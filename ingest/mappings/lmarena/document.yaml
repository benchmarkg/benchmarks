benchmark_ref: lmarena-document
family: external-scrape
score_column: rating
scale: 1.0
scale_source: https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset
metric_ref: lmarena-document-score
source_ref: src-lmarena-leaderboard-dataset
reviewed_by: null
notes: "Written 2026-10-10 (P5-S6-T02; agent; reviewed_by awaits a person). `rating` is the Arena Score, a
  Bradley-Terry rating on an Elo-like scale (the card's schema), so scale 1.0 into an unbounded, pool-relative
  metric. rating_lower and rating_upper are two bound columns, LMArena's 95% CI, mapped by the adapter, not a
  half-width. The arena itself: one Leaderboard and one RatingPool per snapshot (06 S3.6)."

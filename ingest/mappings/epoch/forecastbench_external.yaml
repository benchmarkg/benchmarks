# ingest/mappings/epoch/forecastbench_external.yaml -- the mapping stanza for Epoch's orphan forecastbench_external.csv, hand-mapped (07 S2.1; P3-S2-T04)
benchmark_ref: forecastbench
family: external-scrape
score_column: Overall score
scale: 1.0
scale_source: https://www.forecastbench.org/leaderboards/
metric_ref: forecastbench-brier-index
source_ref: src-epoch-benchmark-data
conditions:
  reasoning_effort:
    from: model_version_suffix
reviewed_by: null
notes: Read 2026-10-05 (P3-S2-T04, agent draft; reviewed_by awaits a person). The leaderboard's
  headline is the Overall Brier Index on "an interpretable 0-100% scale" (100% perfect, 50%
  maximally uninformed), higher is better; Epoch's 50.4..62.5 is that index in percent. Scale 1.0,
  because the curated metric forecastbench-brier-index is itself 0-100 (range 0-100, chance 50); a
  fraction metric would need 0.01 instead. Epoch's metadata row (scale 1.0, random_baseline 0.5,
  score_ceiling 1.0) treats the column as a fraction and is wrong on its face. The Name column
  carries the prompt variant ("(scratchpad)", "(zero shot)"), which EvalConditions has no field for;
  it is not mapped.

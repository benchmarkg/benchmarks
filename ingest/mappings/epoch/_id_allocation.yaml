# ingest/mappings/epoch/_id_allocation.yaml -- P3-S2-T07 (04 S3 "Id allocation is a human act").
#
# One row per `benchmark` string in Epoch's benchmark_metadata.csv (81 rows, src-epoch-benchmark-data),
# in the file's order: the permanent benchmark id it maps to and, where the string names one, the
# version or subset. The ingest adapter reads this file and never allocates an id itself.
#
# EVERY ROW IS A PROPOSAL until a person ratifies it: set ratified_by (a handle) and ratified_on (a
# date), row by row, after checking the rationale. `bench validate` warns on each unratified stub.
# The rows the task names for attention -- the FrontierMath strings, ARC AI2 vs ARC-AGI, METR vs METR
# Time Horizons -- say so in their rationale, as do the others that need a judgement.
#
# data/benchmarks/_stubs/ is emitted from this file by scripts/emit_epoch_stubs.py; change an id here,
# re-run it, and the stubs follow.
version: 0.1.0
source: src-epoch-benchmark-data
added_on: '2026-09-28'
rules:
  - '04 S3: an id names a benchmark, never an Epoch string. A string that also encodes a version, a subset,
    a snapshot date or an access mode maps to its benchmark plus a version or subset, and the access mode
    is a condition of the claim.'
  - A version or subset is recorded here only when the Epoch string itself names one. A version or
    subset carried by a column (LiveBench Version, METR version, a score column) is the mapping
    stanza's to read.
  - 'Numbered successors: a successor its maintainers name as a new numbered benchmark (ARC-AGI-2, Vending-Bench
    2, BTF-3; weatherbench-2 in 04 S3) gets its own id. A dotted release number or a vN (OSWorld 2.0,
    FrontierMath v2) is a version of the same benchmark.'
  - "Where the repository already holds or names an id -- a curated entry, or an id a curated entry's
    lineage declares -- that id is used, and a curated one gets no stub (existing: true)."
  - Where a name is shared with a different benchmark we know of, or is generic, the id carries a
    disambiguator (the maintainer or the game), so neither can take the bare name by accident.
  - A proposal is not an id. A row is decided when ratified_by names the person who checked it and
    ratified_on dates it; until then `bench validate` warns on its stub.

# ingest/mappings/epoch/ale_bench_external.yaml -- the mapping stanza for Epoch's orphan ale_bench_external.csv, hand-mapped (07 S2.1; P3-S2-T04)
benchmark_ref: ale-bench
family: external-scrape
score_column: Performance
scale: 1.0
scale_source: https://sakanaai.github.io/ALE-Bench-Leaderboard/
metric_ref: ale-bench-score
source_ref: src-epoch-benchmark-data
conditions:
  reasoning_effort:
    from: model_version_suffix
reviewed_by: null
notes: Read 2026-10-05 (P3-S2-T04, agent draft; reviewed_by awaits a person). The leaderboard's
  headline is "Performance (higher is better)"; the paper (arXiv 2506.09050) defines it as "a score
  derived from a set of participants and the rank within a problem, using an Elo-rating-like
  method", which "typically ranges from 0 to 3500", averaged over problems as "the simple arithmetic
  mean of the performances". Epoch's values (137.8..2176.88) are those rating points, so scale 1.0
  into an unbounded rating metric, not a fraction (the metric record, like P3-S2-T05's four, must
  declare it unbounded). The Rank column is a mean rank (lower is better) and is not mapped.

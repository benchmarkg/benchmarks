# ingest/mappings/epoch/btf3_external.yaml -- the mapping stanza for Epoch's orphan btf3_external.csv, hand-mapped (07 S2.1; P3-S2-T04)
benchmark_ref: btf-3
family: external-scrape
score_column: Pooled score
scale: 1.0
scale_source: https://evals.futuresearch.ai/#btf3
metric_ref: btf-3-score
source_ref: src-epoch-benchmark-data
conditions:
  reasoning_effort:
    from: model_version_suffix
  harness:
    from: column
    column: Harness
reviewed_by: null
notes: "Read 2026-10-05 (P3-S2-T04, agent draft; reviewed_by awaits a person). The pooled score is a Brier-scale
  error, LOWER is better: binary questions are scored by Brier score and numeric ones by ranked probability
  score, and the pool weights numeric questions three times. The leaderboard row \"Claude Opus 4.8 (xhigh)
  | 0.132 [0.125-0.139]\" is Epoch's 0.13 (Epoch rounds, or read an earlier snapshot). Scale 1.0; the
  metric record must say optimum: min. The 95% CI is two bound columns, not a half-width, so no uncertainty
  is mapped."

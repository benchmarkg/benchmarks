# ingest/mappings/epoch/frontiermath_erdos.yaml -- the mapping stanza for Epoch's orphan frontiermath_erdos.csv, hand-mapped (07 S2.1; P3-S2-T04)
benchmark_ref: frontiermath-erdos
family: epoch-run
score_column: Best score (across scorers)
scale: 1.0
scale_source: https://epoch.ai/benchmarks/frontiermath-erdos
metric_ref: frontiermath-erdos-score

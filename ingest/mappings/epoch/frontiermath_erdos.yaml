    from: model_version_suffix
  selection_strategy:
    const: best-across-scorers
reviewed_by: null
notes: "Read 2026-10-05 (P3-S2-T04, agent draft; reviewed_by awaits a person). Epoch's own benchmark:
  accuracy is \"the fraction of the 68 conjectures resolved\", one attempt each, so 0..0.0294 is a fraction
  and scale is 1.0 (0.0294 is 2 of 68). Mapped like the other FrontierMath files (P3-S2-T03): the best
  score across scorers, with mean_score its pair. Logs and Log viewer are empty on all 5 rows, so these
  claims carry no transcript (ingest/verification.py's absent-log rule)."

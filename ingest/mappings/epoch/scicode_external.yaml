# ingest/mappings/epoch/scicode_external.yaml -- the mapping stanza for Epoch's orphan scicode_external.csv, hand-mapped (07 S2.1; P3-S2-T04)
benchmark_ref: scicode
family: external-scrape
score_column: Score
scale: 1.0
scale_source: https://artificialanalysis.ai/methodology/intelligence-benchmarking
metric_ref: scicode-subproblem-pass-at-1
source_ref: src-epoch-benchmark-data
conditions:
  reasoning_effort:
    from: model_version_suffix
  selection_strategy:
    const: pass-at-k
    k: 1
reviewed_by: null
notes: Read 2026-10-05 (P3-S2-T04, agent draft; reviewed_by awaits a person). Every row is
  Artificial Analysis's (Source column). Its methodology scores SciCode with "Code execution,
  pass@1, sub-problem scoring with scientist-annotated background prompting", so these are
  SUB-PROBLEM accuracies WITH background, as fractions (scale 1.0). That is not the curated
  scicode-main-problem-pass-at-1, and not the paper's standard setup without background (P3-S5-T04),
  so the metric is a separate one and the two series must never be compared.

metric_ref: critpt-challenge-accuracy
source_ref: src-epoch-benchmark-data
conditions:
  reasoning_effort:
    from: model_version_suffix
  selection_strategy:
    const: avg-at-k
    k: 5
reviewed_by: null
notes: Read 2026-10-05 (P3-S2-T04, agent draft; reviewed_by awaits a person). The file carries no
  Source column; its numbers are Artificial Analysis's (GPT-5.6 Sol (Max) "32.3%" there, 0.323
  here). Artificial Analysis's methodology runs the 70 challenges "5 repeats per question with
  pass@1 scoring" on the official grading server, which is the paper's average over five, so the
  metric is critpt-challenge-accuracy and selection_strategy avg-at-k, k 5. Scale 1.0. Cost is
  filled on 11 of 177 rows and is not mapped.

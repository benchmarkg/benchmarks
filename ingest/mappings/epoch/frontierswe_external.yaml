# ingest/mappings/epoch/frontierswe_external.yaml -- the mapping stanza for Epoch's orphan frontierswe_external.csv, hand-mapped (07 S2.1; P3-S2-T04)
benchmark_ref: frontierswe
family: external-scrape
score_column: Score
scale: 1.0
scale_source: https://www.frontierswe.com/
metric_ref: frontierswe-score
source_ref: src-epoch-benchmark-data
conditions:
  reasoning_effort:
    from: model_version_suffix
  harness:
    from: column
    column: Harness
  selection_strategy:
    const: avg-at-k
    k: 5
reviewed_by: null
notes: Read 2026-10-05 (P3-S2-T04, agent draft; reviewed_by awaits a person). The leaderboard
  reports a percentage, "mean@5" over 34 tasks ("Claude Fable 5.1, proximus, 56.5%"); Epoch holds
  0.5629 for the same row (the site has moved since Epoch read it). Scale 1.0. Every row's
  Aggregation is "Mean@5", hence avg-at-k, k 5; Best@5 and Worst@5 are the other two aggregations
  and are not mapped.

# REUSE.toml -- machine-readable licensing for every path (REUSE spec 3.3).
#
# The split is _plan/05-repository-and-workflow.md S12's table; that section owns the
# reasoning (why CC-BY and not ShareAlike for the data, why MIT and not Apache-2.0 for the
# code). LICENSE-DATA and LICENSE-CODE at the root are the human-facing copies; LICENSES/ holds
# the texts REUSE tooling resolves identifiers against. CI runs `reuse lint`.
#
# Rows for paths that do not exist yet are deliberate: a file created under tools/ or schema/
# is licensed correctly from its first commit instead of when someone remembers.
# Later annotations take precedence over earlier ones for the same file (REUSE 3.3), so the
# narrow exceptions come last.

version = 1

# --- Data and documentation: CC-BY-4.0 (05 S12 row 1) --------------------------------------
# drafts/ joined 2026-09-28: the F6 copilot's unreviewed records (P1-S2-T01) are data on its way into
# data/, and drafts/README.md shipped in that task without a row.
[[annotations]]
path = ["data/**", "taxonomy/**", "docs/**", "adr/**", "evals/golden/**", "drafts/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "CC-BY-4.0"

# Root documents a successor or reader looks for first: licensed with docs/.
[[annotations]]
path = ["SUCCESSION.md", "README.md", "CHANGELOG.md", "GOVERNANCE.md", "SECURITY.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "CC-BY-4.0"

# The plan itself is documentation. 05 S12 does not list _plan/; it is licensed with docs/.
[[annotations]]
path = ["_plan/**/*.md", "_plan/**/*.yaml", "_plan/**/*.yml", "_plan/**/*.json", "_plan/**/*.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "CC-BY-4.0"

# --- Code, build and workflows: MIT (05 S12 row 2) -------------------------------------------
[[annotations]]
path = ["tools/**", "ingest/**", "schema/**", "site/**", ".github/**", "scripts/**", "_plan/**/*.py", "_plan/**/*.js"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "MIT"

# Tests and their fixtures are code. Every fixture under tests/ is ours and synthetic -- tests/fixtures/
# epochdl-mini's README says so row by row -- except the captured Hugging Face responses, overridden
# below. Added 2026-09-25 (P0-S7-T01): tests/ was not in 05 S12's table and had no row.
[[annotations]]
path = ["tests/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "MIT"

# Generated reports (scripts/epoch_audit.py, scripts/epoch_identity_census.py) are documentation
# about the corpus and are licensed with docs/. Added 2026-09-25 (P0-S7-T01), as for tests/.
[[annotations]]
path = ["reports/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "CC-BY-4.0"

# Repository configuration is part of the build, and so is config/ (11 S5: build-time model config).
# design/ joined 2026-09-28 (P2-S2-T01): tokens.yaml is build input -- tools/build/tokens.py compiles
# it into site/src/styles/tokens.css and site/src/lib/tokens.json, which site/** already licenses
# MIT -- and 05 S12's table has no row for it.
[[annotations]]
path = ["config/**", "design/**", "CITATION.cff", "pyproject.toml", "uv.lock", ".gitattributes", ".gitignore", "REUSE.toml", "package.json", "package-lock.json", "playwright.config.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "MIT"

# --- Exceptions (05 S12 rows 3-4) -------------------------------------------------------------
# Papers with Code archive: CC-BY-SA-4.0 is inherited and viral, which is why it is quarantined
# under vendor/ and never enters the CC-BY core (04 S9 licence firewall). The copyright is the
# upstream's, not ours.
[[annotations]]
path = ["vendor/pwc-archive/**"]
precedence = "override"
SPDX-FileCopyrightText = "Papers with Code contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Derived health and usage metrics: public domain.
[[annotations]]
path = ["metrics/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Tatra Labs"
SPDX-License-Identifier = "CC0-1.0"

# IBM Plex, subset and self-hosted by scripts/subset_fonts.py (09 S12.1). The font files are
# IBM's under the SIL Open Font License 1.1, not ours under MIT; the licence text ships beside
# them as site/public/fonts/OFL.txt, as the OFL requires.
[[annotations]]
path = ["site/public/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

# Hugging Face Hub API responses, captured byte for byte by scripts/capture_hf_fixtures.py (P5-S1-T02)
# as offline test fixtures. They are not ours and not MIT: the bodies are Hub metadata, including
# repository authors' own descriptions, served under the Hub's terms. LICENSES/LicenseRef-HF-Hub-API-
# Responses.txt says what is and is not claimed. Kept out of the CC-BY data tree by construction.
[[annotations]]
path = ["tests/ingest/fixtures/hf-hub/**"]
precedence = "override"
SPDX-FileCopyrightText = "Hugging Face, Inc. and the authors of the repositories described"
SPDX-License-Identifier = "LicenseRef-HF-Hub-API-Responses"

# OpenAlex API responses, captured by tests/fixtures/openalex/capture.py (P4-S2-T06) and
# tests/fixtures/citations/capture.py (P4-S2-T10) as offline test fixtures. OpenAlex releases its
# metadata under CC0 (06 S3.10), so these are CC0 and not ours; the capture scripts beside them are.
# Added 2026-10-04 (P4-S2-T10): the first capture had been left under tests/**'s MIT row.
[[annotations]]
path = ["tests/fixtures/openalex/*.json", "tests/fixtures/citations/openalex/**"]
precedence = "override"
SPDX-FileCopyrightText = "OurResearch (OpenAlex)"
SPDX-License-Identifier = "CC0-1.0"

# Semantic Scholar API responses, captured by tests/fixtures/citations/capture.py (P4-S2-T10) as
# offline test fixtures. Not ours and not MIT; LICENSES/LicenseRef-Semantic-Scholar-API-Responses.txt
# says what is and is not claimed. Kept out of the CC-BY data tree by construction.
[[annotations]]
path = ["tests/fixtures/citations/semantic-scholar/**"]
precedence = "override"
SPDX-FileCopyrightText = "The Allen Institute for Artificial Intelligence (Semantic Scholar)"
SPDX-License-Identifier = "LicenseRef-Semantic-Scholar-API-Responses"

# Per-day counts of Epoch AI's result rows by the date each would carry as date_reported, made from
# the Epoch snapshot by tests/fixtures/epoch-dates/make_fixture.py (P4-S2-T07). Derived from Epoch's
# CC-BY-4.0 data, so attributed to it; the generator beside it is ours.
[[annotations]]
path = ["tests/fixtures/epoch-dates/event-dates.json"]
precedence = "override"
SPDX-FileCopyrightText = "Epoch AI"
SPDX-License-Identifier = "CC-BY-4.0"

# The Contributor Covenant 2.1, adopted verbatim with only the reporting address filled in. The text
# is the Covenant's, published under CC-BY-4.0 (https://www.contributor-covenant.org).
[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# arXiv OAI-PMH responses (metadataPrefix arXivRaw, set=cs, 2026-10-06), as offline test fixtures for the
# arXiv adapter (P5-S5-T04). The records are arXiv's metadata, verbatim -- titles, authors and abstracts --
# which arXiv releases under CC0 1.0 (06 S3.4); the pages were trimmed to 100 records and their
# resumptionToken renamed, nothing else. Not ours; the README beside them is.
[[annotations]]
path = ["tests/ingest/fixtures/arxiv/set-cs-day*.xml", "tests/ingest/fixtures/arxiv/*.headers.json"]
precedence = "override"
SPDX-FileCopyrightText = "arXiv (Cornell University) and the authors of the papers described"
SPDX-License-Identifier = "CC0-1.0"

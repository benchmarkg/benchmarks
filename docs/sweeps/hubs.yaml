# docs/sweeps/hubs.yaml -- the per-family hub list for the manual sweep (P1-S12-T01; 06 S6)
#
# What a sweep walks. 06 S6: "a scheduled manual sweep, with a written checklist, a per-family cadence,
# and a curator log entry that records 'checked, no change' as a first-class outcome." The checklist is
# docs/sweeps/checklist.md; this file is the list of hubs it is run against, one block per domain family.
#
# The family list is not typed freely. scripts/check_sweep_families.py asserts that the `family` ids here
# are exactly the families in taxonomy/domains.yaml (none missing, none extra, none twice), that each
# family's cadence agrees with 06 S6's cadence table and the tier counts with its effort table, and that
# the cadence table in checklist.md is the one it generates from this file. Adding a twentieth family
# to the taxonomy without a block here fails in the same commit.
#
# Seed. 06 S6's representative hub list, which it calls "the seed; the file is maintained, not frozen".
# Where 06 names a hub without a URL, the URL is the one the repository's own Source and corpus records
# already cite for it; where none does, it is the project's own page, and `url: null` with a `note`
# where which page is meant is itself unclear. engineering-design had no hub list in 06 ("the Phase-0
# scoping survey produces the first one"): its hubs are the recurring contests and live leaderboards in
# data/surveys/engineering-design/_family-scoping.yaml, which is an agent draft not yet accepted.
#
# Fields
#   family          a family id from taxonomy/domains.yaml
#   cadence         quarterly | semi-annual | annual   (06 S6, "set by how fast the family's benchmark
#                   population turns over, not by how interesting it is")
#   capped          true only where 06 S6 says to cap the sweep deliberately (vision)
#   focus           discovery | lineage | survey -- what the sweep is for. `lineage` is 06 S6's
#                   "lineage and supersession events, not new benchmarks"; `survey` is a family whose
#                   first sweep "is a survey, not a check"
#   anchor_events   06 S6's anchor events: when in the year a sweep is most likely to find something
#   catches         what the sweep catches that automation does not (06 S6's last column)
#   hubs[]          name, url (https, or null with a note), mode (manual | api: the hub has an API or
#                   feed an adapter covers, so the sweep checks what the adapter cannot), and optional
#                   `unverified` (06's [U] markers: a claim about the hub nobody has confirmed) and `note`
#   shared_hubs[]   a hub swept once for several families, with its own cadence where 06 sets one
#
# Every URL was fetched once on 2026-10-06 while seeding: 72 of the 75 loaded, two refuse scripted
# requests (403; each has a note) and SUPERB did not answer (06 already marks its status [U]). Where a
# URL redirected to a new canonical home, the new one is written. After that, hubs are re-checked by
# the sweep itself: the checklist's first line is "Page loads; note HTTP status and any redirect".

version: 1
updated: 2026-10-06

families:
  # ------------------------------------------------------------------ quarterly
  - family: robotics-embodiment
    cadence: quarterly
    focus: discovery
    anchor_events: CoRL (Nov), RSS (Jul), ICRA/IROS, CVPR Embodied AI workshop (Jun)
    catches: >
      Everything. No central hub exists anywhere. The fastest-churning family in the index, and the
      largest unindexed field in the landscape.
    hubs:
      - {name: BEHAVIOR Challenge, url: 'https://behavior.stanford.edu/challenge', mode: manual}
      - {name: LIBERO, url: 'https://libero-project.github.io', mode: manual}
      - {name: RoboCasa, url: 'https://robocasa.ai', mode: manual}
      - {name: RoboTwin, url: 'https://robotwin-platform.github.io', mode: manual}
      - {name: RoboArena, url: 'https://robo-arena.github.io', mode: manual}
      - {name: Open X-Embodiment, url: 'https://robotics-transformer-x.github.io', mode: manual}
      - {name: ManiSkill, url: 'https://github.com/mani-skill/ManiSkill', mode: manual}
      - {name: SimplerEnv, url: 'https://github.com/simpler-env/SimplerEnv', mode: manual}
      - {name: Meta-World, url: 'https://github.com/Farama-Foundation/Metaworld', mode: manual}
      - {name: RLBench, url: 'https://github.com/stepjam/RLBench', mode: manual}
      - {name: Habitat Challenge, url: 'https://aihabitat.org/challenge/', mode: manual}
      - {name: BEHAVIOR-1K challenge leaderboard, url: 'https://huggingface.co/spaces/behavior-1k/2026-challenge-leaderboard', mode: manual}
      - name: DuoBench
        url: null
        mode: manual
        note: 06 S6 names it without a page, and no record in the repository cites one. The first sweep finds it or drops it.

  - family: agents-tooluse
    cadence: quarterly
    focus: discovery
    anchor_events: Rolling; no conference anchor
    catches: >
      Harness and scaffold changes, and leaderboard forks that outpace papers (OSWorld,
      Terminal-Bench). The benchmarks are discoverable; the versions are not.
    hubs:
      - {name: OSWorld (verified and 2.0 line), url: 'https://osworld-v2.xlang.ai/', mode: manual}
      - {name: Terminal-Bench 2.x leaderboard, url: 'https://www.tbench.ai/leaderboard/terminal-bench/2.0', mode: manual}
      - {name: Harbor framework releases, url: 'https://github.com/harbor-framework/terminal-bench-2', mode: manual, note: 06 S6 names `harborframework` releases on HF; the repository's records cite this repo}
      - {name: HAL, url: 'https://hal.cs.princeton.edu/', mode: manual, note: submissions paused (06 S6)}
      - {name: BFCL, url: 'https://gorilla.cs.berkeley.edu/leaderboard.html', mode: manual}

  - family: vision
    cadence: quarterly
    capped: true
    focus: discovery
    anchor_events: CVPR (Jun), ICCV/ECCV, NTIRE, Image Matching Workshop
    catches: >
      Workshop challenge tracks, which have no feed. Highest long tail of any family (ceiling above
      1,000). Cap the sweep deliberately or this family eats the project.
    hubs:
      - name: CVPR/ICCV/ECCV workshop challenge indices
        url: null
        mode: manual
        note: one index per conference edition; the sweep records which edition's page it walked
      - {name: NTIRE, url: 'https://cvlai.net/ntire/2026/', mode: manual, note: challenges run on Codabench}
      - {name: Image Matching Workshop, url: 'https://image-matching-workshop.github.io', mode: manual}
      - {name: Robust Reading Competition, url: 'https://rrc.cvc.uab.es', mode: manual}
      - {name: ScanNet++, url: 'https://github.com/scannetpp/scannetpp', mode: manual}

  - family: medicine-health
    cadence: quarterly
    focus: discovery
    anchor_events: MICCAI (Sep/Oct), RSNA (Nov)
    catches: >
      Grand Challenge's API covers most of it; the sweep catches BraTS-style clusters, PhysioNet gated
      releases and non-imaging clinical benchmarks.
    hubs:
      - {name: Grand Challenge, url: 'https://grand-challenge.org', mode: api}
      - {name: BraTS cluster, url: 'https://zenodo.org/records/19714728', mode: manual}
      - {name: PhysioNet, url: 'https://physionet.org', mode: manual, note: gated}
      - {name: ReXrank, url: 'https://rexrank.ai', mode: manual}
      - {name: MedHELM, url: 'https://crfm-helm.readthedocs.io/en/latest/medhelm/', mode: manual}
      - {name: MedMNIST, url: 'https://medmnist.com', mode: manual}

  - family: code
    cadence: quarterly
    focus: lineage
    anchor_events: Rolling
    catches: >
      Lineage only. SWE-bench's six forks, Terminal-Bench's concurrent 2.x line, contamination events.
      The numbers are ingested; the family tree is human work.
    hubs:
      - {name: SWE-bench and its forks, url: 'https://www.swebench.com/', mode: manual, note: includes SWE-bench Multilingual and Multimodal}
      - {name: EvalPlus, url: 'https://evalplus.github.io/leaderboard.html', mode: manual}
      - {name: LiveCodeBench, url: 'https://livecodebench.github.io/leaderboard.html', mode: manual}
      - {name: BigCodeBench, url: 'https://bigcode-bench.github.io/', mode: manual}

  # ---------------------------------------------------------------- semi-annual
  - family: chemistry-materials
    cadence: semi-annual
    focus: discovery
    anchor_events: NeurIPS AI4Science, ACS, CACHE round announcements
    catches: >
      Matbench Discovery is semi-automatable; CACHE runs multi-year rounds with two phases each and
      publishes no feed.
    hubs:
      - {name: Matbench Discovery, url: 'https://matbench-discovery.materialsproject.org', mode: api, note: has /api and RSS}
      - {name: Open Catalyst Project, url: 'https://opencatalystproject.org', mode: manual}
      - {name: CACHE, url: 'https://cache-challenge.org', mode: manual}
      - {name: Polaris Hub, url: 'https://polarishub.io', mode: manual}
      - {name: Therapeutics Data Commons, url: 'https://tdcommons.ai', mode: manual, unverified: freshness}

  - family: biology-genetics
    cadence: semi-annual
    focus: discovery
    anchor_events: CASP (biennial), CAFA, CAGI, DREAM, Virtual Cell Challenge
    catches: >
      CAMEO runs continuous weekly automated evaluation and needs a lighter, more frequent check than
      the rest of the family. CASP/CAFA/CAGI decompose into 100+ children, so the family/child
      convention lives or dies here.
    hubs:
      - {name: CASP, url: 'https://predictioncenter.org', mode: manual, note: CASP17 target call open for 2026}
      - {name: CAMEO, url: 'https://cameo3d.org', mode: manual, note: weekly automated evaluation; check more often than the family cadence}
      - {name: CAFA, url: 'https://biofunctionprediction.org/cafa/', mode: manual}
      - {name: CAGI, url: 'https://genomeinterpretation.org', mode: manual}
      - {name: DREAM Challenges, url: 'https://dreamchallenges.org', mode: manual}
      - {name: Virtual Cell Challenge, url: 'https://arcinstitute.org', mode: manual}
      - {name: Open Problems, url: 'https://openproblems.bio/', mode: manual}

  - family: earth-climate
    cadence: semi-annual
    focus: discovery
    anchor_events: Climate Change AI workshop, AGU/EGU, LifeCLEF (CLEF, Sep)
    catches: >
      WeatherBench 2, ChaosBench and GEO-Bench 2 move on paper cycles, not continuously.
    hubs:
      - {name: WeatherBench, url: 'https://sites.research.google/gr/weatherbench', mode: manual}
      - {name: ChaosBench, url: 'https://leap-stc.github.io/ChaosBench', mode: manual}
      - {name: GEO-Bench, url: 'https://github.com/ServiceNow/geo-bench', mode: manual}
      - name: PANGAEA
        url: null
        mode: manual
        note: 06 S6 names it without a page, and the name covers both a geospatial benchmark and a data publisher; the first sweep settles which is meant.
      - {name: CY-Bench, url: 'https://cybench.agml.org', mode: manual}
      - {name: LifeCLEF, url: 'https://www.imageclef.org/LifeCLEF2026', mode: manual}
      - name: ECMWF operational scorecards
        url: null
        mode: manual
        note: 06 S6 names them without a page; the repository's ECMWF records cite forum and event pages, not the scorecards.

  - family: audio-speech
    cadence: semi-annual
    focus: discovery
    anchor_events: DCASE (window Apr-Jun, results 30 Jun), INTERSPEECH, IWSLT, ISMIR
    catches: >
      The Open ASR Leaderboard is an HF Space and is automatable; the challenge families are not.
      DCASE is one name for seven unrelated tasks re-issued yearly.
    hubs:
      - {name: DCASE, url: 'https://dcase.community/challenge2026', mode: manual}
      - {name: Open ASR Leaderboard, url: 'https://huggingface.co/spaces/hf-audio/open_asr_leaderboard', mode: api}
      - {name: SUPERB, url: 'https://superbbenchmark.org', mode: manual, unverified: 2026 status, note: did not answer on 2026-10-06}
      - {name: IWSLT, url: 'https://iwslt.org/2026/', mode: manual, note: the sweep reads the proceedings}
      - {name: MIREX, url: 'https://music-ir.org/mirex/wiki/MIREX_HOME', mode: manual, unverified: 2026 status}

  - family: physics
    cadence: semi-annual
    focus: discovery
    anchor_events: NeurIPS ML4PS, ACAT/CHEP, NeurIPS competition track
    catches: >
      Highly fragmented by subfield with almost no shared vocabulary. The HEP ML Living Review is
      itself a curated index and the best single sweep target.
    hubs:
      - {name: HEP ML Living Review, url: 'https://iml-wg.github.io/HEPML-LivingReview', mode: manual}
      - {name: FAIR Universe, url: 'https://fair-universe.lbl.gov', mode: manual}
      - {name: Polymathic AI, url: 'https://polymathic-ai.org', mode: manual}
      - {name: CritPt, url: 'https://critpt.com/', mode: manual}
      - {name: Metriq, url: 'https://metriq.info', mode: manual}
      - {name: QC-App-Oriented-Benchmarks, url: 'https://github.com/SRI-International/QC-App-Oriented-Benchmarks', mode: manual}

  - family: safety-alignment
    cadence: semi-annual
    focus: discovery
    anchor_events: inspect_evals releases, AISI publications
    catches: >
      inspect_evals is automatable and covers a large share; the sweep catches the private and
      institutional ones, and the dead repos.
    hubs:
      - {name: inspect_evals releases, url: 'https://ukgovernmentbeis.github.io/inspect_evals/', mode: api}
      - {name: AISI publications, url: 'https://www.aisi.gov.uk', mode: manual}
      - {name: Apollo Research, url: 'https://www.apolloresearch.ai', mode: manual, note: 'a largely private suite, recorded as `access: private` entries'}

  - family: society-econ-law
    cadence: semi-annual
    focus: discovery
    anchor_events: ICAIL, FAccT, Metaculus quarterly tournaments
    catches: >
      Many benchmarks here are commercial and private; the sweep is mostly about recording that they
      exist and are not reproducible.
    hubs:
      - {name: GDPval, url: 'https://openai.com/index/gdpval/', mode: manual, note: refuses scripted requests (403); open it in a browser}
      - {name: LegalBench, url: 'https://hazyresearch.stanford.edu/legalbench/', mode: manual}
      - {name: LegalBench live leaderboard (Vals), url: 'https://www.vals.ai/benchmarks/legal_bench', mode: manual}
      - {name: ForecastBench, url: 'https://www.forecastbench.org/', mode: manual}
      - {name: Metaculus FutureEval, url: 'https://www.metaculus.com/futureeval', mode: manual, note: 'quarterly; refuses scripted requests (403), so open it in a browser'}

  - family: games-planning
    cadence: semi-annual
    focus: discovery
    anchor_events: NeurIPS competition track, IEEE CoG, ARC Prize milestones
    catches: >
      Rating-pool composition changes, which silently invalidate stored Elo. ARC Prize publishes on
      its own schedule.
    hubs:
      - {name: ARC Prize leaderboard, url: 'https://arcprize.org/leaderboard', mode: manual}
      - {name: Kaggle Game Arena, url: 'https://www.kaggle.com/game-arena', mode: manual}
      - name: NeurIPS competition track
        url: null
        mode: manual
        note: one page per conference year; the sweep records which year's page it walked
      - {name: TextArena, url: 'https://github.com/TextArena/TextArena', mode: manual}

  - family: multimodal
    cadence: semi-annual
    focus: discovery
    anchor_events: CVPR, NeurIPS, vendor releases
    catches: >
      Boundary maintenance with vision, per 02 S11's rule -- the sweep is as much about
      reclassification as discovery.
    hubs: []                            # the shared OpenCompass hub, below

  # --------------------------------------------------------------------- annual
  - family: language
    cadence: annual
    focus: lineage
    anchor_events: ACL/EMNLP/NAACL
    catches: >
      Lineage and contamination only. The single most duplicated area in the landscape; the sweep
      checks that supersession edges and contamination evidence are current.
    hubs: []

  - family: mathematics
    cadence: annual
    focus: lineage
    anchor_events: NeurIPS, AIME/IMO cycle
    catches: >
      Lineage only. FrontierMath's four variants and the annual AIME/HMMT contamination events. Volume
      is not the issue; version confusion is.
    hubs: []

  - family: reasoning-general
    cadence: annual
    focus: lineage
    anchor_events: NeurIPS, ICLR
    catches: >
      Lineage only. Same shape as mathematics.
    hubs: []

  - family: general-intelligence
    cadence: annual
    focus: discovery
    anchor_events: ARC Prize, HLE updates
    catches: >
      Low volume, high scrutiny -- roughly twelve field-defining families in total, the one family
      small enough to sweep completely.
    hubs: []

  - family: engineering-design
    cadence: annual
    focus: survey
    anchor_events: NeurIPS AI4Science, EDA/CAD venues
    catches: >
      Unknown. The first sweep is a survey, not a check.
    seeded_from: data/surveys/engineering-design/_family-scoping.yaml
    hubs:
      - {name: CAD Contest at ICCAD, url: 'https://www.iccad-contest.org/', mode: manual, note: annual; three problems a year since 2012}
      - {name: ISPD Contest, url: 'https://ispd.cc/', mode: manual, note: annual; the root redirects to the current edition}
      - {name: Parametric CAD Bench, url: 'https://cadbench.ai', mode: manual, note: live leaderboard}
      - {name: Learn2Design, url: 'https://github.com/artificial-scientist-lab/Learn2Design-2026', mode: manual, note: the 2026 edition}

# A hub swept once for several families. 06 S6: OpenCompass / CompassHub is "swept semi-annually per
# S4.1 -- it is the only entry in this checklist that exists to counter the catalogue's
# English-language sourcing bias, so it is the one that must not be quietly dropped when a sweep runs
# late." For these families the rest of the sweep is a lineage pass over entries already held, driven
# by `superseded_by` gaps and by version strings in Epoch and EEE that match no BenchmarkVersion.
shared_hubs:
  - name: OpenCompass / CompassHub
    url: 'https://opencompass.org.cn'
    mode: manual
    cadence: semi-annual
    must_not_drop: true
    families: [language, mathematics, reasoning-general, multimodal, general-intelligence]

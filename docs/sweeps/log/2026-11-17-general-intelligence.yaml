      - kind: new-edition
        summary: "Epoch changed how the index is computed on 2026-11-04, after the entry was read: capabilities,
          difficulties and slopes are now fitted jointly with a Bayesian model (flat priors, two anchor
          models with no uncertainty, benchmark-specific noise) instead of non-linear least squares with
          a ridge penalty; uncertainty is a 90% credible interval instead of a 90% bootstrap interval
          from 500 resamples; and a model enters only if at least four of its scores fall between 0.1
          and 0.9 after normalisation. The score file now holds 256 models against the 274 the entry's
          Source counted, and the domain ECIs have not yet been refitted. The entry describes the old
          fit (bootstrap intervals) and has no versions."
        evidence_url: https://epoch.ai/data/eci-documentation/changelog
        quote: Switched the ECI to a Bayesian model.
        suggested_action: "versions: add a 2026-11-04 revision (breaking: ECI values, intervals and the
          model set change), with the changelog and Epoch's report (https://epoch.ai/publications/eci-bayesian-methodology,
          2026-11-04) as Sources; update the description, the method text that cites bootstrap intervals,
          and the as_used and comparability notes; note that the domain-specific ECIs have not yet been
          refitted with the new method."
        action: follow-up

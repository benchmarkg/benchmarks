# docs/sweeps/log/2026-11-17-general-intelligence.yaml -- the first annual sweep of general-intelligence (06 S6; the
# instrument is docs/sweeps/checklist.md). No ledger task covers this family's sweep; its annual cadence is in
# docs/sweeps/hubs.yaml. One row per hub and one per entry; "checked-no-change" is a result. Each finding carries
# `action`: `applied` in this PR (three need no new Source), or `follow-up`, a change the sweep found that needs
# new Sources and goes to a later PR. New candidates are capped at five for the family. The family has no hubs of
# its own; the shared OpenCompass / CompassHub hub was checked for general-intelligence. No commit author,
# leaderboard submitter, organiser or other individual is named; account handles appear only inside URLs the
# entries already record. scripts/check_sweep_log.py checks this file.

version: 1
family: general-intelligence
date: 2026-11-17
curator: agent (P1-S12, the annual cadence of docs/sweeps/checklist.md; no ledger task)
cdx: 'not checked: the sweep agents were told not to query the Wayback CDX API, whose capacity went to
  the rolling archiver, so no capture digest was compared and nothing was re-archived; the next sweep
  compares them'
hubs:
  - name: OpenCompass / CompassHub
    url: https://opencompass.org.cn
    http_status: 200
    final_url: null
    page_state: suspect
    outcome: found
    entries:
      - agieval
      - arc-agi-1
      - arc-agi-2
      - gpqa
      - hle
      - livebench
      - mmlu
      - mmlu-pro
    findings:
      - kind: new-candidate
        summary: "C-Eval (arXiv 2305.08322 v3, NeurIPS 2023; CompassHub card 496, with a board; OpenCompass
          config) is a Chinese multi-discipline exam suite: multiple-choice questions over 52 disciplines
          at four levels, middle school to professional (13,948 per the README), with a C-Eval Hard subset.
          It is the Chinese general exam reported beside MMLU in model reports already cited as Sources
          here (DeepSeek-V3, dots.llm1, Qwen3). Its test labels were held behind a submission leaderboard
          until the README announced the release of the complete test set on 2025-07-27, and cevalbenchmark.com,
          the leaderboard's home, failed TLS twice today (certificate expired). Repository hkust-nlp/ceval
          (MIT, last commit 2025-07-27); data ceval/ceval-exam on Hugging Face (ungated, cc-by-nc-sa-4.0)."
        evidence_url: https://arxiv.org/abs/2305.08322
        quote: 'C-Eval comprises multiple-choice questions across four difficulty levels: middle school,
          high school, college, and professional.'
        suggested_action: Open a Benchmark draft in
          general-intelligence/multi-subject-knowledge-exams, with C-Eval Hard as a subset and the
          2025-07-27 test-label release as a version or access change; record the leaderboard site
          as unreachable. Released 2023, well before the 2026-05-01 preference; recorded because
          this is the hub that exists to counter the English-language bias, c3.yaml already says
          C-Eval was left out of language because its claim is breadth of subject knowledge, and the
          family's only Chinese coverage is AGIEval's Gaokao and law tasks.
        action: follow-up
      - kind: new-candidate
        summary: CMMLU (arXiv 2306.09212 v2, 2024-01-17; CompassHub card 499, with a board;
          OpenCompass config with an LLM-judge variant) is a Chinese multiple-choice benchmark over
          67 subjects from elementary to professional level, natural sciences to humanities,
          including China-specific subjects; it is reported beside C-Eval in the DeepSeek-V3 and
          dots.llm1 reports already cited as Sources. Its leaderboard is a pair of README tables
          whose repository was last changed 2024-12-06; repository and Hugging Face dataset sit on a
          personal account (handle withheld); the README gives the data licence as CC BY-NC-SA 4.0.
        evidence_url: https://arxiv.org/abs/2306.09212
        quote: introducing CMMLU, a comprehensive Chinese benchmark that covers various subjects,
          including natural science, social sciences, engineering, and humanities
        suggested_action: Open a Benchmark draft in
          general-intelligence/multi-subject-knowledge-exams; activity likely no-submission-channel
          or closed and lifecycle mature (the README board has not changed since 2024-12). Released
          2023, older than the 2026-05-01 preference; recorded for the same reason as C-Eval
          (c3.yaml names both as left out of language).
        action: follow-up
      - kind: new-candidate
        summary: SuperGPQA (arXiv 2502.14739 v4, 2025-03-28; CompassHub card 1538; OpenCompass
          config since 2025-03-11, last changed 2026-03-17) evaluates graduate-level knowledge and
          reasoning across 285 disciplines, its questions filtered through human-LLM collaborative
          review with over 80 expert annotators; dots.llm1 (a Source here) reports it beside
          MMLU-Pro. Repository SuperGPQA/SuperGPQA (last commit 2025-04-30); data m-a-p/SuperGPQA on
          Hugging Face (ungated, odc-by, last modified 2025-04-30). The leaderboard the README
          links, the Hugging Face Space m-a-p/SuperGPQA, now answers 401, and supergpqa.github.io is
          a script shell, so no board rows were read.
        evidence_url: https://arxiv.org/abs/2502.14739
        quote: we present SuperGPQA, a comprehensive benchmark that evaluates graduate-level
          knowledge and reasoning capabilities across 285 disciplines
        suggested_action: 'Open a Benchmark draft in general-intelligence/multi-subject-knowledge-exams
          (gpqa is a near neighbour by name only: SuperGPQA is a separate collection, not a GPQA version);
          record the leaderboard Space as gone or private. Released 2025-02, before the 2026-05-01 preference.'
        action: follow-up
    note: "Walked for general-intelligence only. opencompass.org.cn, hub.opencompass.org.cn/home and rank.opencompass.org.cn/home
      answer 200 but are script shells (the root's text is its title and keywords), so CompassHub was
      read through the public read API its own pages call (listTopicDimensionTag, listIndexCards and getDetailV2,
      read-only POSTs with no login) and through the open-compass/opencompass repository (Apache-2.0,
      last commit 2026-11-11, release 0.5.5 of 2026-11-06; dataset-index.yml byte-identical to the 2026-11-16
      copy). CompassHub has no general-intelligence dimension: I read every card in Examination (21) and
      Science (6), all 20 in Strong Reasoning, 40 of 42 in Knowledge and the 40 most recently updated
      of 93 in Reasoning, and searched each entry's name. Cards exist for AGIEval (497), MMLU (498), MMLU-Pro
      (1276), GPQA (1135) and LiveBench (1246), none updated since 2024 (the AGIEval and MMLU cards carry
      the legacy OpenCompass board, 112 rows, newest 2023-12-11), and none for ARC-AGI, HLE, HELM, LMArena
      or ECI. The repository's index runs AGIEval, GPQA, MMLU, MMLU-Pro, HLE, HLE-Diamond text-only (added
      2026-11-04), HLE-Verified (2026-05-28), an ARC-AGI-1 public-evaluation config (2024-11-27) and an
      ARC-AGI-2 one (2025-12-08): implementations of sets the entries already record, no new version.
      Forks found here are recorded on mmlu (MMMLU) and mmlu-pro (IndicMMLU-Pro, card 1670). Three candidates
      recorded; seen and not recorded: five more general-scope sets (GAOKAO-Bench, OlympicArena, MMLU-CF,
      KMMLU-Redux, E-EVAL) and five domain sets for other families (ELBench, AECBench, LG_Bench, CS-Eval,
      MedXpertQA)."

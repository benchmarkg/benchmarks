hubs:
- name: DCASE
  url: https://dcase.community/challenge2026
  http_status: 200
  final_url: https://dcase.community/challenge2026/
  page_state: live
  outcome: found
  entries:
  - dcase
  findings:
  - kind: new-candidate
    summary: BioDCASE, the DCASE-modelled bioacoustics challenge whose workshop is co-located with DCASE's (online,
      2026-10-23), ran a 2026 edition of six tasks (multi-channel recording alignment, Antarctic blue and fin whale
      call detection, bird detection on tiny hardware, active learning, cross-domain mosquito species classification,
      bird counting) that opened on 2026-04-01 and published ranked per-task results on 2026-07-06, with data on
      Zenodo and baselines and evaluation code on GitHub; a 2025 edition preceded it, and the dcase entry mentions
      it only in passing.
    evidence_url: https://biodcase.github.io/challenge2026/
    quote: Results are now available for the 2026 BioDCASE Challenge! Thank you to everyone who participated.
    suggested_action: open a Benchmark draft for BioDCASE (https://biodcase.github.io/), one entry with 2025 and
      2026 as editions and the 2026 tasks as subsets; consider earth-climate or biology-genetics as a secondary
      domain
    action: follow-up
  note: The challenge page (updated 2026/07/01) shows all seven 2026 tasks with results released (421 entries).
    The news page adds nothing since the entry but the 2027 task-proposal call (2026-10-01; proposals due 2026-12-15,
    opening 2027-04-01) and a steering-group call (2026-10-06); the DCASE2026 workshop was held in Boston on 27-29
    October and its proceedings are out (see the dcase entry). One candidate recorded, none more seen; BioDCASE
    opened on 2026-04-01, a month before the preferred window.

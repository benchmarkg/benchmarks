    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=100
    quote: SynthRAD is the first challenge on automatic generation of synthetic computed tomography (sCT) for radiotherapy
    suggested_action: open one Benchmark draft for SynthRAD (slugs SynthRAD2023, SynthRAD2025) with the two editions
      as versions
    action: follow-up
  - kind: new-candidate
    summary: The Medical Segmentation Decathlon (slug Decathlon-10) is still OPEN for prediction submissions and
      lists doi 10.1038/s41467-022-30695-9; the catalogue mentions it only inside the medmnist entry and has no
      entry of its own.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=0
    quote: The Medical Segmentation Decathlon challenge tests the generalisability of machine learning algorithms

  - kind: new-candidate
    summary: The FLARE abdominal-organ segmentation series has two OPEN boards, FLARE21 (doi 10.1109/tpami.2021.3100536,
      doi 10.1016/j.media.2022.102616) and FLARE22 (phase from 2023-01-01, doi 10.1109/tpami.2021.3100536), both

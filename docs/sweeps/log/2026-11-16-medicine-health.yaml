    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=100
    quote: MICCAI 2022 Fast and Low-resource semi-supervised  Abdominal oRgan sEgmentation (FLARE) Challenge
    suggested_action: open one Benchmark draft for FLARE (slugs FLARE and FLARE22) with 2021 and 2022 as editions
    action: follow-up
  note: 'The API listing was fetched once as three pages (offsets 0, 100 and 200, 2.5 s apart, no 5xx; saved as

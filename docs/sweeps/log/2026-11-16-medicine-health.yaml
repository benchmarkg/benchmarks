# docs/sweeps/log/2026-11-16-medicine-health.yaml -- P1-S12-T03, the first quarterly sweep of
# medicine-health (06 S6; the instrument is docs/sweeps/checklist.md). One row per hub in
# docs/sweeps/hubs.yaml and one per entry; "checked-no-change" is a result. Each finding carries `action`:
# `applied` in this PR, or `follow-up`, a change the sweep found that needs new Sources and goes to a later
# PR. Grand Challenge was read through its public API, one request at a time at least two seconds apart
# (06 S3.8). PhysioNet was read through its public listing pages only; nothing gated was requested. No
# commit author, leaderboard submitter, organiser or other individual is named; repositories under personal
# accounts are written as the entry's own `repository`. scripts/check_sweep_log.py checks this file.

version: 1
family: medicine-health
date: 2026-11-16
curator: agent (P1-S12-T03)
cdx: 'not checked: the Wayback CDX API answered HTTP 429 from 2026-11-10 until shortly before this sweep, and on
  the sweep day its capacity went to the archive backlog due by 2026-11-17, so no capture digest was compared and
  nothing was re-archived; the next sweep compares them'

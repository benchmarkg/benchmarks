  findings:
  - kind: new-candidate
    summary: DALPHIN, an open visual-question-answering benchmark that scores multimodal large language models as
      pathology assistants (300 cases from six institutions, 130 diagnoses), is OPEN on Grand Challenge with a predictions
      route and a paper (arXiv 2605.03544); listing record created 2025-11-20, modified 2026-10-15.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=200
    quote: DALPHIN is a multicentric, open visual question answering (VQA) benchmark for pathology AI copilots.
    suggested_action: open a Benchmark draft for DALPHIN (https://dalphin.grand-challenge.org/, slug DALPHIN); medicine-health
      primary with a multimodal secondary, since it scores MLLMs
    action: follow-up
  - kind: new-candidate
    summary: BEETLE, a multicentre, multiscanner benchmark for multiclass segmentation of breast-cancer H&E whole-slide
      images (170 annotated regions from 54 slides), is OPEN with a predictions route and a paper (arXiv 2510.02037);
      record created 2025-09-26, modified 2026-10-16.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=200
    quote: BEETLE is a multicenter, multiscanner benchmark for breast cancer histopathology segmentation.
    suggested_action: open a Benchmark draft for BEETLE (https://beetle.grand-challenge.org/, slug BEETLE)
    action: follow-up
  - kind: new-candidate
    summary: Learn2Reg, the medical image registration challenge series, is OPEN (current phase from 2025-05-01,
      no end date, predictions route) and lists four publications (doi 10.1109/tmi.2022.3213983, doi 10.59275/j.melba.2025-gc8c,
      doi 10.5281/zenodo.3835681, arXiv 2505.24160); its record was modified on 2026-11-11.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=0
    quote: 'Challenge on medical image registration addressing: learning from small datasets; estimating large deformations;
      dealing with multi-modal scans; and learning from noisy annotations'
    suggested_action: open a Benchmark draft for Learn2Reg (https://learn2reg.grand-challenge.org/, slug Learn2Reg),
      one entry with its yearly tasks as versions
    action: follow-up
  - kind: new-candidate
    summary: ATM26 (Airway Tree Modeling 2026) is a new edition of the ATM22 airway segmentation challenge that
      adds an anatomical-labelling track; it ran 2026-07-15 to 2026-09-29 (status COMPLETED, algorithm submissions)
      with publications doi 10.1016/j.media.2023.102957, doi 10.1007/s11548-025-03368-3 and arXiv 2412.11039, while
      ATM22 is still OPEN for predictions with five publications.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=200
    quote: 'Building on ATM22 (binary segmentation), ATM26 advances to structured airway understanding, including
      two tracks: binary segmentation and anatomical labeling.'
    suggested_action: open one Benchmark draft for the ATM series (slugs ATM22 and ATM26) with 2022 and 2026 as
      editions
    action: follow-up
  - kind: new-candidate
    summary: TopBrain version 2 (TopBrain2026) asks for segmentation of over 50 brain-vessel anatomies in CTA and
      MRA; start 2026-09-20, end 2026-12-31, status OPEN_SOON with the final test phase opening on 2026-12-11 (home
      page), and a publication doi 10.64898/2026.05.28.26354312.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=200
    quote: Segment over 50 landmark brain vessel anatomies for both CTA and MRA in TopBrain version 2
    suggested_action: open a Benchmark draft for TopBrain (https://topbrain2026.grand-challenge.org/), version 2
      as its 2026 edition; re-check after the final test phase closes
    action: follow-up
  - kind: new-candidate
    summary: COBRA2026, a cone-beam CT reconstruction challenge for radiation therapy, is OPEN_SOON with its test
      phase from 2027-01-15 to 2027-02-15 (algorithm submissions; the home page says the test phase opens on Jan
      15 2027) and a paper arXiv 2607.20037.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=200
    quote: Cone-beam CT reconstruction for radiation therapy challenge
    suggested_action: open a Benchmark draft for COBRA (https://cobra2026.grand-challenge.org/) once the test phase
      opens; record it as accepting-submissions from 2027-01-15
    action: follow-up
  - kind: new-candidate
    summary: The PANTHER Challenge is OPEN for algorithm submissions from 2025-04-30 to 2027-04-13 and lists doi
      10.1016/j.media.2026.104186, but its listing description only asks users to cite the PANORAMA challenge article,
      so the task and whether that DOI is PANTHER's own paper are not stated in the listing.
    evidence_url: https://grand-challenge.org/api/v1/challenges/?limit=100&offset=200
    quote: associated with the PANORAMA challenge, please cite the following article as reference
    suggested_action: read https://panther.grand-challenge.org/ and the DOI before drafting; open a Benchmark draft
      if it is a benchmark of its own rather than a PANORAMA follow-on
    action: follow-up
  - kind: new-candidate
    summary: SynthRAD, the synthetic-CT-for-radiotherapy challenge series, has two OPEN editions, SynthRAD2023 (open
      to 2028-09-20, publications doi 10.1002/mp.16529, doi 10.1016/j.media.2024.103276, arXiv 2403.08447) and SynthRAD2025

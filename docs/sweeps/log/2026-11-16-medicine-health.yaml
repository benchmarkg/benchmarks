  findings:
  - kind: new-candidate
    summary: ReXGroundingCT, the same lab's 3D chest-CT benchmark for segmenting findings described in free-text
      reports (300-case held-out test set, ranked by mean Dice), ran as a MICCAI 2026 challenge (766 submissions,
      53 official final entries, dated rows up to 2026-09-14) and keeps an open, automatically scored leaderboard;
      the catalogue does not carry it.
    evidence_url: https://rexrank.ai/ReXGroundingCT/challenge.html
    quote: The challenge has concluded. This page archives every submission made during the challenge.
    suggested_action: Draft a Benchmark entry (arXiv 2507.22030, v2 2025-10-27; board https://rexrank.ai/ReXGroundingCT/index.html;
      data on Hugging Face under the lab organisation, gated auto, CC-BY-NC-SA-4.0, last modified 2026-07-08; a
      100-case v1 board is archived at ./v1_leaderboard.html). The live board loads from a Firestore backend, so
      its rows were not read.
    action: follow-up
  - kind: new-candidate
    summary: ReX-MLE, an autonomous-agent benchmark of 20 tasks drawn from medical imaging competitions (largely
      Grand Challenge ones), with a 4-row agent leaderboard on the hub; the catalogue does not carry it.
    evidence_url: https://rexrank.ai/ReX-MLE/index.html
    quote: ReX-MLE is a benchmark of 20 tasks drawn from high-impact medical imaging competitions
    suggested_action: Draft a Benchmark entry, probably in agents-tooluse with medicine-health secondary (arXiv
      2512.17838; code at the lab's rex-mle repository, last pushed 2026-07-19, no licence set).
    action: follow-up
  note: The page is static HTML with full text; the first request failed on a local TLS certificate-revocation check
    (the revocation server was offline) and a plain retry answered 200. The hub now fronts two more boards, ReXGroundingCT
    (under a ReXrankCT menu) and ReX-MLE, recorded above. The ReXGroundingCT page embeds a Firebase web configuration
    (page exposes a credential); it was not used. The site is served from the repository's gh-pages branch, whose
    commit messages give the change dates cited under the rexrank entry.

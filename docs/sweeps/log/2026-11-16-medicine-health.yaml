  findings:
  - kind: new-candidate
    summary: ArchEHR-QA, a credentialed PhysioNet challenge dataset for grounded question answering on EHR notes
      (MIMIC-III/IV), released v1.4 on 2026-10-05 with a new test-2026 split (47 cases, 167 in all); it has run
      as two shared-task editions with Codabench boards (BioNLP at ACL 2025, CL4Health at LREC 2026, concluded 2026-05-12)
      and is not in the catalogue.
    evidence_url: https://physionet.org/content/archehr-qa-bionlp-task-2025/1.4/
    quote: This PhysioNet repository is maintained as a benchmark dataset for grounded question answering from electronic
      health records
    suggested_action: Draft a Benchmark entry for ArchEHR-QA with editions 2025 and 2026 (task site https://archehr-qa.github.io/;
      Scientific Data 2026, DOI 10.1038/s41597-026-06639-z; 2025 overview https://aclanthology.org/2025.bionlp-1.34/;
      2026 overview https://aclanthology.org/2026.cl4health-1.23/; PhysioNet DOI 10.13026/sneb-dn55); access is
      credentialed with a DUA, and the 2025 Codabench board (competition 5302) is archived.
    action: follow-up
  - kind: new-candidate
    summary: The SNOMED CT Entity Linking Challenge (credentialed PhysioNet data from MIMIC-IV-Note, v1.2.1 published
      2026-02-17) has been re-launched as a standing benchmark on DrivenData with a hidden test set and a public
      leaderboard (the DrivenData page shows it open, 181 joined); the catalogue does not carry it.
    evidence_url: https://physionet.org/content/snomed-ct-entity-challenge/1.2.1/
    quote: Participants will need to sign up to DrivenData to submit entries against the benchmark, which goes live
      on March 1st 2026
    suggested_action: 'Draft a Benchmark entry (an original competition, now concluded, plus the open benchmark
      at https://www.drivendata.org/benchmarks/310/benchmark-snomed-ct/; metric: class macro-averaged character
      IoU; JAMIA 2025 paper DOI 10.1093/jamia/ocaf104; PhysioNet DOI 10.13026/az93-vm52).'
    action: follow-up
  - kind: new-candidate
    summary: MedVAL-Bench, a physician-annotated benchmark of errors and risk grades in 840 LM-generated medical
      texts over six tasks (some built on aci-bench), was published on PhysioNet as v1.0.2 on 2026-11-16 under credentialed
      access; not in the catalogue.
    evidence_url: https://physionet.org/content/medval-bench/1.0.2/
    quote: MedVAL-Bench is a dataset containing physician evaluations of errors in language model (LM)-generated
      medical text.
    suggested_action: Consider a Benchmark draft (an evaluator or validation benchmark; PhysioNet DOI 10.13026/k9kp-2m73;
      v1.0.2 adds the npj Digital Medicine reference), lower priority than the two challenges; it has no leaderboard.
    action: follow-up
  - kind: new-candidate
    summary: MIMIC-IV-Ext-CPT, a credentialed procedure-code (CPT/E&M) prediction set from MIMIC clinical notes
      with a fixed 7,705-record test split, was published as v1.0.1 on 2026-11-12; PhysioNet's home-page listing
      calls it a benchmark, and the catalogue does not carry it.
    evidence_url: https://physionet.org/content/mimic-iv-ext-cpt/1.0.1/
    quote: MIMIC-IV-Ext-CPT is a credentialed-access dataset for predicting procedure and service code identifiers
      from deidentified MIMIC clinical notes.
    suggested_action: Low priority; consider a Benchmark draft only if a coding-prediction leaf is wanted (PhysioNet
      DOI 10.13026/15h1-9682; no leaderboard; v1.0.1 removes 30 test rows that overlapped training, so it differs
      from the paper's test set).
    action: follow-up
  note: 'The site and its public listing pages are live with full text. The challenge listing (types=2, newest first)
    holds 36 challenge resources; only the two 2026 ones are recorded here. Older challenge projects the catalogue
    also lacks (CXR-LT 2023/2024 v2.0.0, Discharge Me! BioNLP 2024, BioNLP 2023 Task 1A, MIT Critical Datathon 2023)
    were not recorded. The past-Challenge list at /about/challenge/moody-challenge still ends at 2022, as the entry
    records. Hub-level context, not findings: a 2026-06-18 notice warns that credentialed-access applications face
    significant delays (relevant to entries whose reproduction needs credentialed PhysioNet data), a 2026-10-27
    notice reports slower performance and a migration to new infrastructure, and a `physionet` Python package and
    CLI was released on 2026-11-07. Nothing was logged into, requested or accepted.'

# docs/sweeps/log/2026-11-17-earth-climate.yaml -- P1-S12-T05, the first semi-annual sweep of earth-climate (06
# S6; the instrument is docs/sweeps/checklist.md). One row per hub in docs/sweeps/hubs.yaml and one per entry;
# "checked-no-change" is a result. Each finding carries `action`: `applied` in this PR, or `follow-up`, a change
# the sweep found that needs new Sources and goes to a later PR; a change to docs/sweeps/hubs.yaml goes to one
# PR for the whole batch. New candidates are capped at five for the family. The two hubs hubs.yaml lists without
# a URL, PANGAEA and the ECMWF operational scorecards, were resolved to the pages checked; the hub notes say
# which. No commit author, leaderboard submitter, organiser or other individual is named; account handles appear
# only inside URLs the entries already record. scripts/check_sweep_log.py checks this file.


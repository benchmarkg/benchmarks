# docs/sweeps/log/2026-11-16-vision.yaml -- P1-S12-T03, the first quarterly sweep of vision (06 S6; the
# instrument is docs/sweeps/checklist.md). One row per hub in docs/sweeps/hubs.yaml and one per entry;
# "checked-no-change" is a result. Each finding carries `action`: `applied` in this PR, or `follow-up`, a
# change the sweep found that needs new Sources and goes to a later PR. The sweep is capped (06 S6,
# checklist.md step 4): one conference's workshop index was walked, ECCV 2026's, and new candidates stop at
# ten across the index, NTIRE and the Image Matching Workshop; the hub note says where the walk stopped.
# No commit author, leaderboard submitter, organiser or other individual is named; account handles appear
# only inside URLs the entries and hubs.yaml already record. scripts/check_sweep_log.py checks this file.

version: 1
family: vision
date: 2026-11-16
curator: agent (P1-S12-T03)
cdx: 'not checked: the Wayback CDX API answered HTTP 429 from 2026-11-10 until shortly before this sweep, and on
  the sweep day its capacity went to the archive backlog due by 2026-11-17, so no capture digest was compared and
  nothing was re-archived; the next sweep compares them'
hubs:
- name: CVPR/ICCV/ECCV workshop challenge indices
  url: https://eccv.ecva.net/Conferences/2026/Workshops
  http_status: 200
  final_url: null
  page_state: live
  outcome: found
  entries: []
  findings:
  - kind: new-candidate
    summary: 'SceneFun3D (workshop 2, OpenSUN3D). OpenSUN3D''s ECCV 2026 challenge ran tracks 1 and 2 on SceneFun3D:
      functionality segmentation and open-vocabulary 3D affordance grounding. The benchmark has a standing EvalAI
      server (challenge 2466: published, active, end date 2099-12-31). Track 3 ran on Articulate3D. The catalogue
      carries neither benchmark.'
    evidence_url: https://opensun3d.github.io/
    quote: 'Track 2: Open-Vocabulary 3D Affordance Grounding (SceneFun3D)'
    suggested_action: 'Open a Benchmark draft for SceneFun3D. Documentation: https://scenefun3d.github.io/documentation/.
      Server: https://eval.ai/web/challenges/challenge-page/2466/overview (API record https://eval.ai/api/challenges/challenge/2466/).
      Record the OpenSUN3D challenge rounds (ICCV 2023 to ECCV 2026) as events. Articulate3D (track 3, on a self-hosted
      EvalAI instance) could be a second draft.'
    action: follow-up
  - kind: new-candidate
    summary: 'TwinWorld Challenge 2026 (workshop 3): large-scale 3D semantic Gaussian-splatting reconstruction,
      scored by a final score, PSNR and SSIM. It ran on Codabench 17661 in a Development phase (4-20 Aug 2026) and
      a Final phase (20 Aug-1 Sep 2026), with 55 participants and 462 submissions. This is its first edition.'
    evidence_url: https://twin-world.github.io/
    quote: TwinWorld Challenge 2026 focuses on scalable semantic 3D reconstruction for real-world digital twins.
    suggested_action: Open a Benchmark draft (first edition). The Codabench record is https://www.codabench.org/api/competitions/17661/.
      Before drafting, check the data terms and whether the board still takes submissions.
    action: follow-up
  - kind: new-candidate
    summary: 'BOP, the Benchmark for 6D Object Pose Estimation (workshop 7, Recovering 6D Object Pose). The catalogue
      does not carry it. Its standing leaderboards are live: the default view lists 87 methods, and the newest submission
      is dated 2026-11-12. Its 2026 challenge moves to monocular 3D/2D object grounding on a new BOP-Refer benchmark.'
    evidence_url: https://cmp.felk.cvut.cz/sixd/workshop_2026/
    quote: Methods are evaluated on the new BOP-Refer benchmark (to be released soon)
    suggested_action: 'Open a Benchmark draft for BOP. Home: https://bop.felk.cvut.cz/home/. Leaderboards: https://bop.felk.cvut.cz/leaderboards/.
      Model the SIXD 2017 and BOP 2019, 2020 and 2022-2025 challenges as editions and the BOP-Classic, BOP-H3 and
      BOP-Industrial groups as subsets. Add BOP-Refer as the 2026 edition once it is released; https://bop.felk.cvut.cz/challenges/
      still ends at 2025.'
    action: follow-up
  - kind: new-candidate
    summary: 'PhysAI Dynamic 4D Reconstruction Challenge (workshop 11, Physical AI): a synthetic multi-view benchmark
      with dense geometric annotations. It has a 4D reconstruction and point-tracking track and a dynamic novel-view-synthesis
      track. Track 1 ran on Kaggle (competition 150886, 9 Jul-10 Aug 2026, 27 teams, 411 submissions).'
    evidence_url: https://phys-ai-workshop.github.io/eccv26/challenge.html
    quote: A synthetic benchmark with high-quality multi-view rendering and dense geometric annotations, designed
      for reconstructing the physical world in motion.
    suggested_action: Open a Benchmark draft (first edition). The competition is at https://www.kaggle.com/competitions/phys-ai-dynamic-4-d-reconstruction-challenge,
      and its public record at the Kaggle CompetitionService API (competitionName=phys-ai-dynamic-4-d-reconstruction-challenge).
    action: follow-up
  - kind: new-candidate
    summary: AI City Challenge (workshop 31). Its 10th edition ran at ECCV 2026, and the site lists past challenges
      from 2018 to 2025. It has six tracks, from multi-camera 3D perception (scored by 3D HOTA) to transport anomaly
      reasoning and text-based person re-ID, with an online evaluation system and leaderboards. The catalogue carries
      no edition.
    evidence_url: https://www.aicitychallenge.org/
    quote: This 10th edition of the Challenge introduces new reasoning-centric tasks, expanded Sim2Real evaluation
      protocols, and six challenging tracks
    suggested_action: 'Open a Benchmark draft for the series, with yearly editions as versions and tracks as subsets.
      Evaluation system: https://www.aicitychallenge.org/2026-evaluation-system/. Data: https://www.aicitychallenge.org/ai-city-challenge-dataset-access/
      and https://huggingface.co/datasets/nvidia/PhysicalAI-Traffic-Anomaly-Reasoning.'
    action: follow-up
  - kind: new-candidate
    summary: 'TUMTraf-V2X cooperative perception (workshop 33, DriveX). The 6th DriveX workshop''s Grand Challenge
      ran eight tracks from 1 to 29 Aug 2026. Track 1 is TUMTraf-V2X cooperative 3D detection, which has its own
      Codabench competition: 14044, "2026 DriveX Grand Challenge - TUMTraf V2X Cooperative Perception Dataset",
      with 83 participants and 747 submissions in a round that ended on 2026-05-08. The catalogue carries none of
      the eight.'
    evidence_url: https://drivex-workshop.github.io/eccv2026/
    quote: 'Track 1 - TUMTraf-V2X Challenge: V2I-Based Cooperative Perception'
    suggested_action: 'Open a Benchmark draft for TUMTraf-V2X cooperative perception (driving-perception-3d), with
      the DriveX Grand Challenge rounds as events; the Codabench record is https://www.codabench.org/api/competitions/14044/.
      Leave the other seven tracks for a later pass: doScenes, MDrive, nuReasoning, HetroD, UrbanTwin LUMPI, UrbanTwin
      V2X-Real, and Mixed Signals (Codabench 17457: 66 participants, 385 submissions).'
    action: follow-up
  - kind: new-candidate
    summary: 'SLoMO 2026 competition (workshop 50) on story-level movie understanding. It has a MovieQA track and
      an audio-description generation track on two EvalAI servers: 2713 (SLoMO-QA) and 2712 (SLoMO-AD), both closed
      on 30-31 Aug 2026. The data are CMD-AD and SF20K, with public and private test movies.'
    evidence_url: https://slomo-workshop.github.io/eccv2026/
    quote: SLoMO Competition evaluates narrative-level reasoning through two complementary tracks
    suggested_action: 'Open a Benchmark draft, probably in multimodal (video-language), first edition. Servers:
      https://eval.ai/web/challenges/challenge-page/2713/overview and https://eval.ai/web/challenges/challenge-page/2712/overview.
      The SF20K dataset sits on a personal Hugging Face account (handle withheld).'
    action: follow-up
  - kind: new-candidate
    summary: 'MOSE and MeViS (workshop 52, the 8th LSVOS). The 8th LSVOS challenge ran a MOSEv2 complex-VOS track
      (Codabench 17494: 24 participants, 29 submissions) and MeViSv2 text- and audio-referring tracks (17496: 21
      participants, 41 submissions; 17495) between 10 and 27 Jul 2026, and posted its leaderboard on 11 Aug. The
      catalogue carries neither MOSE, MeViS nor the LSVOS series; davis-vos only cites MOSE inside a quote.'
    evidence_url: https://lsvos.github.io/content/2026.md
    quote: 'The 8th LSVOS challenge includes three tracks: MOSEv2, MeViSv2-Text, and MeViSv2-Audio.'
    suggested_action: Open a Benchmark draft for MOSE (https://mose.video/), with MOSEv1 and MOSEv2 as versions
      and the LSVOS rounds as events. MeViS could be a second draft. Add a related-benchmark note on davis-vos.
      The home page https://lsvos.github.io/ is a JS shell that renders this Markdown file.
    action: follow-up
  - kind: new-candidate
    summary: 'VOT and VOTS (workshop 53). The VOT challenge series (since 2013) ran VOTS2026 at ECCV 2026 as four
      challenges: VOTS2026, VOTSt2026, and two new ones, VOTSp2026 (point tracking) and VOTSr2026 (referring tracking).
      Each has a standing evaluation server and leaderboard. No VOT or VOTS benchmark is in the catalogue.'
    evidence_url: https://www.votchallenge.net/vots2026/
    quote: Four challenges are organized
    suggested_action: 'Open a Benchmark draft for VOT/VOTS as a series, with yearly editions; VOTS2023 onwards is
      the segmentation-tracking line, and the 2026 challenges are subsets. Leaderboards: https://www.votchallenge.net/vots2026/leaderboards.html.
      Toolkit: https://github.com/votchallenge.'
    action: follow-up
  - kind: new-candidate
    summary: 'LoViF 2026 (workshop 58), the 2nd Low-Level Vision Frontiers workshop, ran a set of Codabench challenges
      with published challenge reports: real-world all-in-one restoration (16376: 164 participants, 1,697 submissions);
      unified raindrop and reflection removal (16629: 150 participants, 1,582 submissions); a third day-and-night
      raindrop removal challenge (16614: 82 participants, 1,052 submissions); ultra-low-bitrate image compression
      (16656: 97 participants, 224 submissions); and AIGC image compression (17125: 64 participants, 251 submissions).'
    evidence_url: https://lovif-eccv2026-workshop.github.io/
    quote: LoViF 2026 hosts a series of challenges and competitions to promote practical benchmarks, robust algorithms,
      and real-world low-level vision systems.
    suggested_action: 'Open a Benchmark draft for the LoViF challenges as a series, modelled like ntire (family
      with editions and tracks). See the ntire entry finding: one of its tracks continued here.'
    action: follow-up
  note: 'I walked the ECCV 2026 workshops page, which lists 93 workshops in theme order, and stopped at workshop
    58 of 93 (LoViF) on reaching 10. I recorded only challenges with a dataset and a public leaderboard or evaluation
    server, on a non-personal host, that belong to vision or an adjacent multimodal or driving leaf. I saw but did
    not record these: Perception Test (10; carried as perception-test, which already covers 2026); the CAD STEP-BRep
    challenge (8; data and leaderboard on a personal HF account); GENEA 2026 (18; JS-only page, human-rated); DialNav
    and CoIN (23), VLNverse EMR (27; Codabench 17009, 115 participants) and Hoi! articulation and force (28; Codabench
    17342 and 17335), for robotics-embodiment; HSI (25) and ABAW 11th (37), which have no public server and an EULA
    by e-mail respectively; CARE-PD/MOCHA (40), iMED (45) and MedVidU (47; HF leaderboard), for medicine-health.
    The DriveX page links two private Codabench competitions with secret_key parameters (the page exposes a credential;
    not used), and Codabench API records carry pre-signed storage URLs (not used).'

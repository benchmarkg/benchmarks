  findings:
  - kind: other
    summary: The hub cannot be swept by any agent but Googlebot; its robots.txt (Last-Modified 2025-10-15, the same
      text the icdar2015 entry's src-rrc-robots holds) disallows every path, yet hubs.yaml carries no note saying
      so, as it does for the two hubs that refuse scripted requests.
    evidence_url: https://rrc.cvc.uab.es/robots.txt
    quote: 'User-agent: * Disallow: /'
    suggested_action: add a note to the hub in hubs.yaml ("robots.txt disallows every agent but Googlebot; sweep
      it through the current ICDAR edition's competitions page and each challenge's own site, data record and evaluation
      repository"), and consider recording the ICDAR competitions page (this sweep read https://icdar2026.org/index.php/competitions/)
      as the hub's discovery URL
    action: applied
  - kind: new-candidate
    summary: MapText, the ICDAR competition on historical map text detection, recognition and linking, has run two
      editions on this portal (ICDAR 2024 at ?ch=28, ICDAR 2025 at ?ch=32), with data on Zenodo (CC BY 4.0) and
      an open evaluation repository (icdar-maptext/evaluation, GPL-3.0, not archived, last pushed 2025-01-11); the
      catalogue carries no entry for it.
    evidence_url: https://github.com/icdar-maptext/evaluation/blob/main/README.md
    quote: This repository contains the official evaluation implementation for the [ICDAR'25 MapText competition](https://rrc.cvc.uab.es/?ch=32).
    suggested_action: consider a Benchmark draft for MapText with 2024 and 2025 as editions (four tasks - word and
      phrase detection, word and phrase end-to-end recognition); sources it can rest on without the portal are the
      evaluation repository (README, tag icdar-2024 for the first edition), the Zenodo data records (e.g. https://zenodo.org/records/10732281,
      which links ?ch=28 as the competition site) and the competition reports in the ICDAR proceedings; whether
      its RRC ranking still takes uploads cannot be read (robots.txt)
    action: follow-up
  note: Only robots.txt was requested on rrc.cvc.uab.es; the home page, the challenge, download, ranking and scoring
    pages were not, so no portal page was read and no HTTP status for the hub URL exists (page_state suspect for
    that reason, not because of a JS shell). Off-hub, the ICDAR 2026 competitions page lists eight competitions;
    DocVQA2026, the only one evidenced on this portal, is already recorded by the multimodal docvqa entry (which

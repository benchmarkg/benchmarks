  entries: []
  findings:
  - kind: new-candidate
    summary: ScanNet++ is a live benchmark the catalogue does not carry - a hidden-test evaluation server with four
      public boards (novel view synthesis on DSLR, 17 rows; on iPhone, 7 rows, added 2025-10-13; 3D semantic segmentation,
      9 rows; 3D instance segmentation, 15 rows; newest public row last edited 2026-08-26), dataset v2 (2024-12-20,
      1,006 scenes) and a CVPR workshop challenge, most recently at CVPR 2026 (results due 22 May, winner talks
      on 3 June; a /scannetpp/cvpr2025 page is also indexed, not read).
    evidence_url: https://scannetpp.mlsg.cit.tum.de/scannetpp/changelog
    quote: The benchmark is currently evaluated on the v2 version of the dataset.
    suggested_action: open a Benchmark draft scannetpp (paper arXiv 2308.11417; home https://scannetpp.mlsg.cit.tum.de/scannetpp/;
      repository scannetpp/scannetpp; boards under /scannetpp/benchmark/nvs, nvs_iphone, semseg, insseg; versions
      v1 2023-11-23 and v2 2024-12-20; events the CVPR 2026 challenge at /scannetpp/cvpr2026 and any earlier editions;
      access gated by account, application and token under the ScanNet++ Terms of Use), and re-point the stress
      corpus's scannet record and the taxonomy examples to it, as the scannet entry's identity review check asks
    action: follow-up
  - kind: hub-moved
    summary: The dataset and benchmark site the hub repository links (kaldir.vc.in.tum.de/scannetpp/, and its /benchmark/docs)
      now redirects twice (301, then 308) to a new host, scannetpp.mlsg.cit.tum.de/scannetpp/, which carries the
      news, changelog, boards and challenge pages; the GitHub hub URL itself is unchanged.
    evidence_url: https://raw.githubusercontent.com/scannetpp/scannetpp/main/README.md
    quote: For evaluation and submission, refer to the [submission instructions](https://kaldir.vc.in.tum.de/scannetpp/benchmark/docs).
    suggested_action: point the ScanNet++ hub in hubs.yaml at https://scannetpp.mlsg.cit.tum.de/scannetpp/ (or add
      it beside the repository), since the repository is a toolkit with no news or release feed (no releases; last
      commit 2026-07-10)
    action: applied
  note: Repository not archived, pushed_at and last commit 2026-07-10, no licence file (GitHub licence null), no
    releases. The site's robots.txt is absent (404), so its pages were read. No entry is served; the scannet entry
    is the 2017 ScanNet, which its own review check keeps separate from ScanNet++. arXiv title search shows no ScanNet++
    paper after 2308.11417. hubs.yaml now points at the site rather than the repository.

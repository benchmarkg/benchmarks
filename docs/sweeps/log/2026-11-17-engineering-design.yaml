    repo:
      url: https://github.com/circuitnet/CircuitNet
      archived: false
      pushed_at: 2026-05-17
      last_commit: 2026-05-17
      license: BSD-3-Clause
      latest_release: null
    hf:
      id: SKLP-EDA-LAB/CircuitNet3.0
      last_modified: 2026-05-07
      gated: false
    leaderboard_last_updated: null
    leaderboard_rows: null
    reproduction_script_present: true
    findings:
      - kind: new-edition
        summary: 'The entry carries no versions, although its three releases differ in technology node,
          design set and tasks. 1.0 (2022-08-01, 28 nm; renamed CircuitNet-N28 on 2023-06-14). 2.0 (CircuitNet-N14,
          2023-06-14, 14 nm FinFET; congestion, IR drop and timing). 3.0 (CircuitNet-N45, 2026-05-17,
          45 nm): its dataset card describes a multi-modal RTL, netlist and layout set of 8,659 RTL designs
          and 15,863 augmented instances, with timing (AT, WNS, TNS) and power labels. All three predate
          added_on; the entry has them only as aliases and in its description.'
        evidence_url: https://github.com/circuitnet/CircuitNet
        quote: New dataset CircuitNet-N14 is released, supporting congestion, IR drop and timing
          prediction.
        suggested_action: 'versions: add 1.0/N28 (2022-08-01), 2.0/N14 (2023-06-14) and 3.0/N45 (2026-05-17),
          each with its node, tasks and download home: Google Drive/Baidu for N28, Hugging Face CircuitNet/CircuitNet
          for N14 and SKLP-EDA-LAB/CircuitNet3.0 for N45. In the description, say that 3.0 adds power
          labels and RTL/netlist modalities, not only a new node.'
        action: follow-up
      - kind: publication
        summary: "Neither the 2.0 nor the 3.0 paper is a Source. The site's version table links CircuitNet
          2.0 to OpenReview nMFSUjxMIl and 3.0 to OpenReview lEDb4gQ4dB (\"CircuitNet 3.0: A Multi-Modal
          Dataset with Task-Oriented Augmentation for AI-Driven Circuit Design\"), which the companion
          repository calls an ICLR 2026 paper. An arXiv title search finds no arXiv version; it returns
          only 2208.01040, still at v4. Both papers predate added_on, and the entry's review_checks record
          them as unread."
        evidence_url: https://github.com/sklp-eda-lab/iclr-circuitnet_3.0
        quote: Public code release for the ICLR 2026 paper
        suggested_action: Add Sources for the two OpenReview papers and the 3.0 dataset card, and
          resolve the review_check on the unread 2.0 and 3.0 papers. OpenReview answers scripted
          requests with a bot challenge, so read them by hand.
        action: follow-up
      - kind: access-licence
        summary: 'The data licence the entry leaves null is declared on Hugging Face: apache-2.0 on the
          3.0 dataset card and bsd-3-clause on the N14 (2.0) dataset. The 3.0 card also says its layout
          artifacts are being uploaded incrementally, and that a missing layout subset can be requested
          from a contact address; that address is not recorded here. The 3.0 repository still holds one
          1.03 GB circuitNetv3.zip, last modified 2026-05-07, so part of 3.0 is not yet a public download.'
        evidence_url: https://huggingface.co/datasets/SKLP-EDA-LAB/CircuitNet3.0
        quote: Layout artifacts are large and are being uploaded incrementally.
        suggested_action: "data.dataset_licence: record it per version (3.0 apache-2.0; 2.0 bsd-3-clause;
          1.0's Google Drive and Baidu downloads still unstated) and replace the \"not read separately\"\
          \ note. data.access_basis: qualify \"Every version is a public download\" for 3.0, whose layout
          artifacts are partly available only on request."
        action: follow-up
      - kind: other
        summary: CircuitNet 3.0 fixes a source-level train/validation/test split and keeps augmented
          variants of test designs out of training. The entry's contamination_risk_note says the
          read sources name no fixed split and that the code configuration sets it.
        evidence_url: https://huggingface.co/datasets/SKLP-EDA-LAB/CircuitNet3.0
        quote: Source-level train/validation/test partitioning, with augmented variants of test
          sources excluded from train/val to avoid leakage
        suggested_action: 'data.contamination_risk_note and comparability: record that 3.0 has a maintainer-defined
          source-level split with leakage exclusion, while 1.0 and 2.0 still take their split from the
          code configuration. Reassess contamination_risk (unknown) for 3.0.'
        action: follow-up
    note: "Nothing has changed since added_on (2026-10-10). The repository's last two commits are both
      of 2026-05-17 (the 3.0 release note, then versioning and download links), and it has no releases
      or tags. The site's Last-Modified is 2026-05-17 and its version table is unchanged. Hugging Face
      lastModified: 3.0 2026-05-07, N14 2026-02-24, neither gated. lifecycle active and activity no-submission-channel
      still hold (no leaderboard). The test.py and train.py harness in the main repository covers the
      1.0/2.0 tasks. The 3.0 companion repository (created 2026-03-01, last commit 2026-05-06, no licence
      file) holds RTL mutation and classification scripts, not an evaluation script. The IEEE page the
      site links as the 1.0 paper answered 202 with no content, and OpenReview redirected to a bot challenge;
      both are recorded as suspect."

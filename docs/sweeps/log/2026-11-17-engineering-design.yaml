    entries: []
    findings:
      - kind: new-candidate
        summary: "No entry or stub carries the CAD Contest at ICCAD (annual since 2012, three industry-set
          problems a year, ranked on hidden test cases). Its 2026 edition is finished: Problem A, LLM-Assisted
          Netlist Exploration and Transformation (Cadence); Problem B, Regression Failure Bucketing (Synopsys);
          and Problem C, The FloorSet Challenge: Data-Driven SoC Floorplanning (Intel). Alpha, beta and
          final submissions ran to 2026-08-28 and the winners were announced on 2026-11-11. The Phase-0
          survey (_family-scoping.yaml) already lists the series (circuit-eda, grade S), and _eda-cad-cluster.yaml's
          subdomain validation tags it circuit-eda \"fits\"."
        evidence_url: https://www.iccad-contest.org/News.html
        quote: Winner announced.
        suggested_action: Once P1-S8-T02 decides between curate and mute (both surveys still have
          accepted_by null), open a Benchmark draft for the CAD Contest at ICCAD. Treat it as one
          family (02 S11) with yearly editions, 2012-2026, three problems each (History.html lists
          them). Read each problem's scoring from its own problem PDF.
        action: follow-up
    note: "Home, News, Problems, Winners and History all answer 200 with server-rendered text; the header
      still reads \"2026 CAD Contest @ ICCAD\". Newest News item: 2026-11-12, presentation slides for
      all three problems. The Winners page lists three places per problem plus two to four honourable
      mentions; no names are recorded here. No 2027 edition is announced yet, and the hubs.yaml note (\"\
      three problems a year since 2012\") still holds. Problem C's evaluation code is in IntelLabs/FloorSet
      (iccad2026contest/), which Intel has since archived (last push 2026-10-15; the README carries an
      archived notice), and its beta leaderboard was hidden. FloorSet itself (arXiv 2405.05480, 2024)
      is counted with the contest, not as a candidate. No further candidate was seen."

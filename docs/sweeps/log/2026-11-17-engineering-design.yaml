# docs/sweeps/log/2026-11-17-engineering-design.yaml -- the first annual sweep of engineering-design, a survey (06 S6;
# the instrument is docs/sweeps/checklist.md). No ledger task covers this family's sweep; its annual cadence and its
# four hubs are in docs/sweeps/hubs.yaml. One row per hub and one per entry; "checked-no-change" is a result. Each
# finding carries `action`: `applied` in this PR, or `follow-up`, a change the sweep found that needs new Sources and
# goes to a later PR. New candidates are capped at five for the family; each waits on the curate-or-mute decision for
# engineering-design (P1-S8-T02, a human gate). No commit author, leaderboard submitter, organiser or other
# individual is named; account handles appear only inside URLs. scripts/check_sweep_log.py checks this file.


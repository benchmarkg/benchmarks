# docs/sweeps/log/2026-11-17-physics.yaml -- P1-S12-T06, the first semi-annual sweep of physics (06 S6; the
# instrument is docs/sweeps/checklist.md). One row per hub in docs/sweeps/hubs.yaml and one per entry; "checked-
# no-change" is a result. Each finding carries `action`: `applied` in this PR, or `follow-up`, a change the
# sweep found that needs new Sources and goes to a later PR; a change to docs/sweeps/hubs.yaml goes to one PR
# for the whole batch. New candidates are capped at five for the family. Hubs that score quantum devices, which
# ADR-0017 puts out of scope, were checked for liveness and serve no entries. No commit author, leaderboard
# submitter, organiser or other individual is named; account handles appear only inside URLs the entries already
# record. scripts/check_sweep_log.py checks this file.


  - fair-universe-higgsml
  - icecube-neutrinos-in-deep-ice
  - jetclass
  - lhc-olympics-2020
  - top-tagging
  - trackml
  findings:
  - kind: hub-dead
    summary: The Living Review is frozen. Its banner says the project is no longer actively maintained and its literature
      coverage stops at 2026-06-01, with a final archival release on Zenodo (doi 10.5281/zenodo.21626667, version
      v2026.06.01, published 2026-07-27, CC BY 4.0). The last commit on master is 2026-08-10, a pre-commit autoupdate;
      the 2026-07-27 commit reads "Freeze literature coverage as of 1 June 2026".
    evidence_url: https://iml-wg.github.io/HEPML-LivingReview/
    quote: This project is no longer actively maintained. The literature coverage is frozen as of 1 June 2026.
    suggested_action: mark the hub frozen in hubs.yaml (cut-off 2026-06-01, archive doi 10.5281/zenodo.21626667),
      and drop it from later physics sweeps or replace it with a living index, since nothing after June 2026 will
      be added to it
    action: follow-up
  - kind: new-candidate
    summary: Collider-Bench (arXiv 2605.13950, 2026-05-13) scores LLM agents on reproducing published LHC analyses.
      Each agent builds a simulation-and-selection pipeline in a containerised sandbox and submits predicted event
      yields per signal region, which are scored with histogram metrics; an LLM judge also checks the session traces.
      The code and the task corpus (a Hugging Face dataset, MIT, ungated, created 2026-05-12) are public under a
      personal account (handle not written), and the code repository was last pushed on 2026-11-13. No leaderboard
      or evaluation server was found.
    evidence_url: https://arxiv.org/abs/2605.13950
    quote: we introduce Collider-Bench, a benchmark for evaluating whether LLM agents can reproduce experimental
      analyses from the Large Hadron Collider (LHC)
    suggested_action: open a Benchmark draft for Collider-Bench (physics/particle-physics primary with an agents-tooluse
      secondary; no submission channel). The code and data are on personal accounts, so record them as the entry's
      repository and dataset_url
    action: follow-up
  note: The page loads with real text, redirecting once to add a trailing slash. Its Datasets section lists 23 items,
    among them the papers of seven catalogue entries (CaloChallenge, both FAIR Universe Higgs papers, IceCube, JetClass,
    LHC Olympics) and, elsewhere on the page, the top-tagging landscape paper and both TrackML papers. One candidate
    is recorded. Five more were seen and not recorded, because they were released before 2026-05-01 or have no leaderboard
    (DCTracks 2602.14571, ColliderML 2512.15230, NuBench 2511.13111, Towards a Large Physics Benchmark 2507.21695,
    and a summer-school NEXT simulation dataset 2605.07566), along with older datasets (TPCpp-10M, LEMURS, step2point,
    wa-hls4ml, Aspen Open Jets, RODEM).

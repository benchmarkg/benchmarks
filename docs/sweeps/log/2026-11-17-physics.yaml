    quote: about 80% of the validation and test trajectories were exact copies of training trajectories
    suggested_action: add versions to the-well, at least shear_flow v1.0 (2024-12) and v2.0 (2026-10-19, breaking
      for that dataset) and the earlier viscoelastic_instability to viscoelastic_instability_v2 replacement. Record
      a contamination_evidence item or erratum saying that shear_flow v1.0 test scores, including the paper's baselines,
      are inflated by train-test duplication
    action: follow-up
  - kind: lifecycle
    summary: A paper posted on 2026-10-24 (arXiv 2610.33967) trains and scores tuned TFNO models on The Well's tasks
      and reports results against the published baselines on 17 tasks. This is the evidence of use that the entry's
      null lifecycle says it lacked.
    evidence_url: https://arxiv.org/abs/2610.33967
    quote: tuning alone reduces VRMSE below both published FNO and TFNO baselines on 15 of 17 tasks
    suggested_action: set lifecycle to active with arXiv 2610.33967 as the basis and close Stage 3's 2026-09-28-the-well-003.
      The paper also argues that the released baselines are under-tuned, which belongs in a comparability or review
      note
    action: follow-up

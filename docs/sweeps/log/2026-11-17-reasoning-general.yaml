    evidence_url: https://raw.githubusercontent.com/Yale-LILY/FOLIO/main/README.md
    quote: We are excited to release a new version of FOLIO
    suggested_action: 'versions: add v0.0 (GitHub data/v0.0, train and validation) and v2 (Hugging Face), with v2

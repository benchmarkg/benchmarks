curator: agent (P1-S12-T04)
cdx: 'not checked: the sweep agents were told not to query the Wayback CDX API, whose capacity went to the rolling
  archiver, so no capture digest was compared and nothing was re-archived; the next sweep compares them'
hubs:
- name: OpenCompass / CompassHub
  url: https://opencompass.org.cn
  http_status: 200
  final_url: null
  page_state: suspect
  outcome: changed
  entries:
  - big-bench-hard
  - commonsenseqa
  - hellaswag
  - planbench
  findings:
  - kind: fork
    summary: OpenCompass's dataset index carries CommonSenseQA-CN, a Chinese-language CommonsenseQA whose loader
      reads a validation file with the same five choices and question_concept field; it has been in the repository
      since at least 2024-07-31 (the oldest commit on its config folder), and commonsenseqa's lineage records no
      translation or fork.
    evidence_url: https://raw.githubusercontent.com/open-compass/opencompass/main/dataset-index.yml
    quote: 'name: CommonSenseQA-CN'
    suggested_action: 'commonsenseqa lineage.forks: add commonsenseqa-cn (proposed id; maintainer OpenCompass; config
      opencompass/configs/datasets/commonsenseqa_cn/). The index gives no paper and the data ships in OpenCompass''s
      own data bundle, so who translated it, and how, is not stated; a score on it is not a CommonsenseQA score.'
    action: follow-up
  note: The root, hub.opencompass.org.cn and rank.opencompass.org.cn are JS-only shells (the root's body has no
    text beyond its title; one connection timed out before a retry answered 200), so the hub was read through CompassHub's
    public search and detail APIs (the read-only POSTs its own search box makes, no login) and the open-compass/opencompass
    repository (Apache-2.0, last commit 2026-11-11, release 0.5.5 on 2026-11-06). CompassHub has cards for BBH (539),
    CommonSenseQA (511), HellaSwag (531) and PlanBench (1251) and none for the other eight entries; the BBH, CommonSenseQA
    and HellaSwag boards each hold 112 rows, newest 2023-12-11 (the legacy OpenCompass LLM board). dataset-index.yml
    lists bbh, bbeh (already big-bench-hard's recorded successor), commonsenseqa, commonsenseqa_cn and hellaswag,
    plus a hellaswag_clean contamination-annotated config dating from before the entry.

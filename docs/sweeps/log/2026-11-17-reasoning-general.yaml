    action: follow-up
  - kind: fork
    summary: A third-party audit, 'Fixing FOLIO and MALLS' (arXiv 2606.02837 v2, accepted to EMNLP 2026; University
      of Udine), found incorrect FOL formalisations in about 42.5% of FOLIO's validation entries and incorrect NLI
      labels in 8.4%. It releases human-corrected annotations for 275 validation instances on GitHub (an organisation
      repository created 2026-08-28), with a Hugging Face or Zenodo copy promised. FOLIO's lineage is empty, and
      the validation split is the one nearly every published FOLIO result uses.
    evidence_url: https://github.com/dslab-uniud/Fixing-FOLIO-and-MALLS
    quote: We release human-curated versions of these datasets together with a reproducible evaluation pipeline.
    suggested_action: 'lineage.forks: add the corrected validation set (proposed id, e.g. folio-verified), with
      arXiv 2606.02837 as a Source; record its label-error rates as errata or data-quality evidence on the validation
      split.'
    action: follow-up
  - kind: fork
    summary: P-FOLIO (arXiv 2410.09207, 2024) adds 1,430 human-written, step-by-step proofs to FOLIO's stories and
      scores models on inference-rule classification and on reasoning chains (pass@k). Its listed affiliations include
      Yale, FOLIO's maintainer. The entry does not record it.
    evidence_url: https://arxiv.org/html/2410.09207v1
    quote: We presented P-FOLIO, a new dataset consisting of human-written proofs for FOLIO, a set of realistic
      logical reasoning stories written by humans.
    suggested_action: 'lineage: add p-folio (proposed id), under lineage.variants if the reviewer counts it as the
      FOLIO group''s own release, otherwise under lineage.forks; the release location was not read.'
    action: follow-up
  note: The repository and HF record are unchanged since the entry was read; the README still says a leaderboard

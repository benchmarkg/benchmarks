  http_status: 200
  final_url: null
  page_state: live
  outcome: found
  entries:
  - cafa
  findings:
  - kind: new-candidate
    summary: 'LAFA (Longitudinal Assessment of Protein Function Annotation Models) is a persistent server from the
      CAFA organisers. Its page title is "CAFA Forever". It scores containerised protein-function predictors against
      GO annotations as they accrue, between CAFA rounds. Paper: arXiv 2604.20782 (v1 2026-04-22, v2 2026-06-10).
      The server is at https://functionbench.net/, and detailed results are in a public GitHub repository (GPL-3.0,
      last push 2026-08-11). It is not catalogued; cafa''s review_checks name it as a separate benchmark.'
    evidence_url: https://arxiv.org/abs/2604.20782
    quote: Here we introduce the Longitudinal Assessment of Protein Function Annotation Models server (LAFA) as
      a persistent benchmarking system for protein function prediction methods.
    suggested_action: Open a Benchmark draft for LAFA (https://functionbench.net/), primary domain biology-genetics/protein-function-prediction,
      as a continuous companion to cafa. Read it through the paper and its results repository, because the server
      page is a JS-only shell.
    action: follow-up
  note: 'Round state: the hub page is unchanged (WordPress modified 2023-05-22) and still announces CAFA 5. The
    current round is CAFA 6 on Kaggle: opened 2025-10-15, final submissions 2026-02-02, final evaluation 2026-06-01.

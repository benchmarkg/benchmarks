# docs/sweeps/log/2026-11-17-biology-genetics.yaml -- P1-S12-T05, the first semi-annual sweep of
# biology-genetics (06 S6; the instrument is docs/sweeps/checklist.md). One row per hub in docs/sweeps/hubs.yaml
# and one per entry; "checked-no-change" is a result. Each finding carries `action`: `applied` in this PR, or
# `follow-up`, a change the sweep found that needs new Sources and goes to a later PR; a change to
# docs/sweeps/hubs.yaml goes to one PR for the whole batch. New candidates are capped at five for the family.
# Two agents covered the family. CASP, CAFA, CAGI and the Virtual Cell Challenge were checked for round
# announcements, and CAMEO had its lighter check: the date of its latest weekly target set (P1-S12-T05). No
# commit author, leaderboard submitter, organiser or other individual is named; account handles appear only
# inside URLs the entries already record. scripts/check_sweep_log.py checks this file.


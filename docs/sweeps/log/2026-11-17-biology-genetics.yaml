- name: DREAM Challenges
  url: https://dreamchallenges.org
  http_status: 200
  final_url: null
  page_state: live
  outcome: found
  entries:
  - dream5-network-inference
  findings:
  - kind: new-candidate
    summary: In the CM4AI/AnVIL Cell Map Prediction DREAM Challenge (Bridge2AI CM4AI with NHGRI AnVIL), entrants
      generate immunofluorescence images that show where a protein localises in a cell, from the protein's amino-acid
      sequence and reference channels. A hidden test set of 100,000 cells scores it, half for 500 disclosed proteins
      and half for 400 undisclosed proteins. It launched on 2026-10-19, Phase 1 closes on 2026-12-01 and the challenge
      ends on 2027-02-01. Its Synapse Results page is a table of scored submissions.
    evidence_url: https://repo-prod.prod.sagebase.org/repo/v1/entity/syn77349038/wiki/643939
    quote: 'October 19th, 2026: Challenge Launch'
    suggested_action: Open a Benchmark draft for the CM4AI/AnVIL Cell Map Prediction DREAM Challenge (Synapse syn77349038),
      biology-genetics primary (protein subcellular localisation) with a vision secondary for the generated microscopy
      images. Re-check after the Phase 1 deadline on 2026-12-01.
    action: follow-up
  - kind: new-candidate
    summary: 'The DREAM x CACHE Target 2035 Drug Discovery Challenge is the second Target 2035 DEL-ML challenge.
      Entrants train on DNA-encoded-library screens of the kinase PGK2 (890M compounds) and predict hits. They are
      scored first on a held-out set of 400K compounds screened by affinity-selection mass spectrometry, with a
      live leaderboard. The ten best teams then each pick 50 compounds, which are tested experimentally. Registration
      opened in June 2026, the blind test ran to 2026-09-30 and an active-learning step followed in October. DREAM-Q
      (Synapse syn75465972) runs in parallel: the same PGK2 task for quantum or hybrid methods, whose retrospective
      leaderboard opened (wiki modified 2026-11-02).'
    evidence_url: https://dreamchallenges.org/dream-x-cache-target-2035-drug-discovery-challenge/
    quote: This second Target 2035 DEL-ML Challenge invites the community to build models that discover hits (bioactive
      drug-like molecules) for the kinase PGK2 using DNA Encoded Libraries (DEL).
    suggested_action: Open a Benchmark draft for the Target 2035 DEL-ML challenge series (Synapse syn75349604; its
      2025 first round was on WDR91), chemistry-materials primary. Decide whether DREAM-Q is a track of it. The
      cache-challenges entry's review_checks already name this challenge, so check the chemistry-materials sweep
      for a duplicate first.
    action: follow-up
  note: 'The home page''s open-challenge list loads by script, so the site was read through its WordPress REST API
    (posts and categories). The "Open Challenge" category holds 4 posts: CM4AI (2026-09-30), and Digital Pen, DREAM-Q
    and DREAM x CACHE (all 2026-06-29). Three more were seen and not recorded under the cap: the Digital Pen Feature

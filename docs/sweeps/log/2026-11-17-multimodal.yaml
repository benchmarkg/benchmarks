      when a response has no parseable option, and it never seeded the generator, so re-scoring one results file
      could give different accuracies. PR #142 (commit 76070966, merged 2026-11-13 as b26bdefc) adds random.seed(42),
      as mmmu/utils/eval_utils.py already does.'
    evidence_url: https://github.com/MMMU-Benchmark/MMMU/pull/142
    quote: so re-scoring the same results file can give a different accuracy each time
    suggested_action: 'Add an execution.harness_gotcha for this: scores from evaluate.py before commit b26bdefc
      (2026-11-13) are not exactly reproducible when responses fail to parse. Pin the harness at b26bdefc or later.'

# docs/sweeps/log/2026-11-17-multimodal.yaml -- P1-S12-T07, the first semi-annual sweep of multimodal (06 S6;
# the instrument is docs/sweeps/checklist.md). One row per hub in docs/sweeps/hubs.yaml and one per entry;
# "checked-no-change" is a result. Each finding carries `action`: `applied` in this PR, or `follow-up`, a
# change the sweep found that needs new Sources and goes to a later PR; a change to docs/sweeps/hubs.yaml goes
# to one PR for the whole batch. New candidates are capped at five for the family. The family has no hubs of
# its own; the shared OpenCompass / CompassHub hub was checked for multimodal. No commit author, leaderboard
# submitter, organiser or other individual is named; account handles appear only inside URLs the entries
# already record. scripts/check_sweep_log.py checks this file.

version: 1
family: multimodal
date: 2026-11-17
curator: agent (P1-S12-T07)
cdx: 'not checked: the sweep agents were told not to query the Wayback CDX API, whose capacity went to the rolling
  archiver, so no capture digest was compared and nothing was re-archived; the next sweep compares them'
hubs:
- name: OpenCompass / CompassHub
  url: https://opencompass.org.cn
  http_status: 200
  final_url: null
  page_state: suspect
  outcome: found
  entries:
  - mmmu
  - video-mme
  findings:
  - kind: new-candidate
    summary: 'FigCodeBench (arXiv 2610.10066, v1 2026-10-07; CompassHub card 2606, added 2026-11-12, multimodal
      and code). Multimodal LLMs must turn a scientific figure into code that reproduces it: 6,194 instances in
      7 functional categories, in Python, Matlab, R and LaTeX. Outputs are scored by image and code metrics, a Mean
      Machine Opinion Score and a new Figure-Code Fidelity metric. The dataset is on Hugging Face, ungated and MIT-tagged,
      and the project page has a Leaderboard section. Code, page and dataset are on personal accounts (handles withheld).'
    evidence_url: https://arxiv.org/abs/2610.10066
    quote: we propose FigCodeBench, a comprehensive framework for rigorously evaluating MLLMs on figure reproduction
    suggested_action: Open a Benchmark draft in multimodal (figure-to-code generation; code as secondary), first
      edition, from the arXiv paper and the CompassHub record (POST https://hub.opencompass.org.cn/gw/opencompass-be/api/v1/bench/listIndexCards,
      multimodal dimension 17). The project page, repository and dataset are linked from the paper. Check whether
      the leaderboard takes outside entries.
    action: follow-up
  - kind: new-candidate
    summary: 'MMBench (arXiv 2307.06281, v5 2024-08-20) is OpenCompass''s own bilingual multiple-choice benchmark
      for vision-language models: 3,000 questions over 20 ability dimensions (CompassHub card 1206, updated 2026-03-23).
      It has no entry. It is a core column of OpenCompass''s OpenVLM leaderboard: MMBench_TEST_EN_V11 and MMBench_TEST_CN_V11
      for 284 of the 285 models in the leaderboard data, whose timestamp is 2025-09-17. Its data are on Hugging
      Face (opencompass/MMBench, ungated, CC BY 4.0).'
    evidence_url: https://arxiv.org/abs/2307.06281
    quote: we propose MMBench, a bilingual benchmark for assessing the multi-modal capabilities of VLMs
    suggested_action: 'Open a Benchmark draft (multimodal/visual-qa), with the V1.0 and V1.1 test sets as versions
      and EN/CN as subsets. Leaderboard: https://huggingface.co/spaces/opencompass/open_vlm_leaderboard (data http://opencompass.openxlab.space/assets/OpenVLM.json).
      Repository: https://github.com/open-compass/MMBench (pushed 2025-05-22). It is older than the 2026-05-01 preference.
      I recorded it because it is the hub''s flagship, and the catalogue carries none of the OpenVLM leaderboard''s
      core set except MMMU (see note).'
    action: follow-up
  - kind: new-candidate
    summary: VRBench (arXiv 2506.10857, v1 2025-06-12, v2 2025-08-04; CompassHub card 2383, updated 2026-11-03)
      is a long narrative video benchmark for multi-step reasoning. The abstract gives 960 long videos averaging
      1.6 hours, 8,243 human-labelled multi-step QA pairs and 25,106 timestamped reasoning steps. The dataset is
      on Hugging Face (OpenGVLab/VRBench, ungated, Apache-2.0), and the project page has a leaderboard table.
    evidence_url: https://arxiv.org/abs/2506.10857
    quote: We present VRBench, the first long narrative video benchmark crafted for evaluating large models' multi-step
      reasoning capabilities
    suggested_action: 'Open a Benchmark draft in multimodal/video-language. Site: https://vrbench.github.io/. Repository:
      https://github.com/OpenGVLab/VRBench (Apache-2.0, pushed 2026-06-04). The CompassHub card gives 1,010 videos
      and 9,468 reasoning steps against the abstract''s 960 and 25,106, so settle the counts from the paper and
      dataset card. Released before 2026-05-01.'
    action: follow-up
  note: 'The hub''s pages are all JavaScript shells (opencompass.org.cn, rank.opencompass.org.cn/home and hub.opencompass.org.cn/home
    serve only a title), and the first attempt failed to connect (21 s timeout), so I walked CompassHub through
    the public API its own script calls: the multimodal dimension lists 141 benchmarks, and I read the 20 most recently
    updated. The rank site''s multimodal leaderboards could not be read. Its bundle gives the image-VLM leaderboard''s
    period as "Feb 2025 – May 2026"; the OpenVLM leaderboard Space was last modified on 2026-03-11, and its OpenVLM.json
    is timestamped 2025-09-17 (285 models). On CompassHub I found MMMU (card 1248) and Video-MME (1358), and none
    of the other ten entries. I recorded 3 candidates and saw 18 more, unrecorded: MMSI-Bench (May 2025; project
    page and data on personal accounts), LENS (arXiv 2505.15616; data on a personal account), SGI-Bench, VKnowU,
    PICABench, ArgusInspection, GSM8K-V, AIDABench and SmartBench; the science ones, BrainArena (2607.29347, neuroscience
    agents), MolRecBench-Wild (2605.05832, chemistry OCSR) and OmniMatBench (2605.29833, materials), are for other
    families; and the OpenVLM core columns MMStar, MathVista (its leaderboard''s newest row is 2024-11-14), HallusionBench,
    AI2D, OCRBench and MMVet, none of which is in the catalogue. OmniDocBench is already a vision entry, and InternData
    and MotionMillion are training-data collections.'

  findings:
  - kind: new-edition
    summary: 'FLORES+ was revised after the entry read it: the Hugging Face dataset''s lastModified moved from 2026-10-01
      to 2026-10-25 (its CHANGELOG.md is behind the gate), and OLDI''s WMT 2026 shared-task findings (Proceedings
      of WMT26, October 2026, DOI 10.18653/2026.wmt-main.57) report five accepted submissions extending FLORES+,
      one of them arXiv 2609.13847 adding Xichangana, Mozambican Nyanja and Sena, while the entry carries no versions
      at all.'
    evidence_url: https://aclanthology.org/2026.wmt-main.57/
    quote: 'We accepted ten submissions: five extending FLORES+, and five extending other open and massively-parallel
      datasets'
    suggested_action: 'versions: add FLORES-101 (2021), FLORES-200 (2022) and FLORES+ as editions (they are only
      aliases now) and record the October 2026 FLORES+ revision (the archived openlanguagedata/flores repository
      labelled earlier FLORES+ releases 2.0-rc.2 and 2.0-rc.3); add the OLDI findings paper as a Source. The card''s
      configs now list 236 language varieties (233 dev and 228 devtest files), against "about 230" in size_note.'
    action: follow-up
  - kind: other
    summary: 'Contamination: an EACL 2026 paper (arXiv 2601.20858) uses FLORES-200 as a diagnostic, confirms that
      Bloomz was trained on FLORES, and shows that the memorisation raises scores even in translation directions
      the model never saw, while the entry''s contamination_evidence is empty and its note says no evidence was
      read.'
    evidence_url: https://arxiv.org/abs/2601.20858
    quote: We confirm Bloomz's FLORES contamination and demonstrate that machine translation contamination can be
      cross-directional
    suggested_action: 'data.contamination_evidence: add this paper (a third-party assessment, not the maintainers''),
      and revisit contamination_risk (medium) and its note. hubs.yaml asks the language sweep to keep contamination
      evidence current.'
    action: follow-up

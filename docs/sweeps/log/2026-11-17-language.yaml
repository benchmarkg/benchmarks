# docs/sweeps/log/2026-11-17-language.yaml -- P1-S12-T04, the first annual sweep of language (06 S6; the
# instrument is docs/sweeps/checklist.md). One row per hub in docs/sweeps/hubs.yaml and one per entry;
# "checked-no-change" is a result. Each finding carries `action`: `applied` in this PR, or `follow-up`, a
# change the sweep found that needs new Sources and goes to a later PR; a change to docs/sweeps/hubs.yaml goes
# to one PR for the whole batch. This is a lineage sweep (06 S6): new benchmarks are not its target, so it
# records no new candidates; it looks for new versions, forks, concurrent lines, renames and successors. It is
# driven, as P1-S12-T04 asks, from superseded_by gaps and from upstream version strings: every string Epoch's
# benchmark_metadata.csv allocates to code, language, mathematics or reasoning-general matches a version or
# subset its entry carries, and the strings Every Eval Ever uses that match nothing the entry carries are
# recorded as findings beginning "Every Eval Ever". No commit author, leaderboard submitter, organiser or
# other individual is named; account handles appear only inside URLs the entries already record.
# scripts/check_sweep_log.py checks this file.


    likely agents-tooluse), AgentThreatBench (internal, 2026-05-12, no paper or board), SycoBench-600 (no paper)
    and WildClawBench (an agents benchmark with a 10-task safety category). Also seen: about 16 older safety benchmarks
    newly ported or registered (SimpleSafetyTests, CASE-Bench, SALAD-Bench, BrokenMath, Do-Not-Answer and its adversarial
    variant, AraTrust, OR-Bench Hard-1K, MACHIAVELLI, MCPTox, Alignment Faking, DeceptionBench, MonitorBench, NARCBench,
    Adversarial Humanities Benchmark, MANTA).'

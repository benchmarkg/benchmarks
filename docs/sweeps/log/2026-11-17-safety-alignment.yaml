  - kind: other
    summary: The docs home page and the README (since commit 2b9c003, 2026-09-23) now say Inspect Evals is maintained
      by Generality Labs, a London-based nonprofit, with UK AISI, Arcadia Impact and the Vector Institute named
      as contributors; the repository is still UKGovernmentBEIS/inspect_evals, but entry prose calls it UK AISI's
      inspect_evals.
    evidence_url: https://ukgovernmentbeis.github.io/inspect_evals/
    quote: a London-based nonprofit which builds tools for evaluating risks and mitigations in frontier AI
    suggested_action: Where entries call inspect_evals UK AISI's (agentdojo's header and inspect_evals_id_note,
      agentharm's governance.maintainer_basis, sycophancy-eval's as_used protocol), say it is maintained by Generality
      Labs at UKGovernmentBEIS/inspect_evals. AgentHarm's maintainer stays UK AISI, which holds the dataset.
    action: follow-up
  - kind: new-candidate
    summary: Manager Coercion Benchmark (MCB), an agentic propensity benchmark from the CompassionML organisation
      (arXiv 2607.15434, first version 2026-07-16). It measures whether a manager model escalates coercion against
      a subordinate model that refuses, and whether it fabricates success. It was added to the inspect_evals register
      on 2026-07-31 and has a public leaderboard.
    evidence_url: https://ukgovernmentbeis.github.io/inspect_evals/evals/manager_coercion_benchmark/index.html
    quote: MCB measures the unprompted propensity of a manager LLM to coerce a subordinate LLM that politely but
      immovably refuses a benign task.
    suggested_action: Open a Benchmark draft (repository github.com/CompassionML/manager-coercion-bench, MIT, created
      2026-06-05, pushed 2026-11-03; leaderboard https://compassionbench.com/mcb, a JS-only page whose rows were
      not read; built on Inspect AI).
    action: follow-up
  - kind: new-candidate
    summary: HarvestBench, a gridworld farm simulation from the CompassionML organisation (arXiv 2609.04444, first
      version 2026-09-03). It measures whether LLM agents pay a fuel cost to avoid killing animals. It was added
      to the inspect_evals register on 2026-09-28 and has a public leaderboard.
    evidence_url: https://ukgovernmentbeis.github.io/inspect_evals/evals/harvestbench/index.html
    quote: HarvestBench measures revealed animal-welfare preferences of LLM agents in a gridworld farm simulation
      built on Inspect.
    suggested_action: Open a Benchmark draft (repository github.com/CompassionML/harvestbench, MIT, created 2026-07-03,
      pushed 2026-11-03; leaderboard https://compassionbench.com/harvestbench, JS-only, rows not read; the README
      states a leaderboard admission policy). Decide between safety-alignment and society-econ-law for its values
      framing.
    action: follow-up
  - kind: new-candidate
    summary: Hack-Verifiable Terminal Bench (HVTB), a reward-hacking benchmark (arXiv 2608.22103, 2026-08-22). It
      runs 89 Terminal Bench 2.1 tasks with planted reference solutions and held-out tests watched for agent reads.
      It was added to the inspect_evals register on 2026-09-29.
    evidence_url: https://ukgovernmentbeis.github.io/inspect_evals/evals/hvtb/index.html
    quote: HVTB measures reward-hacking rates of LLM agents on 89 real-world terminal/coding tasks from Terminal
      Bench 2.1.
    suggested_action: 'Open a Benchmark draft. The code and leaderboard files sit in a personal GitHub account (MIT,
      pushed 2026-11-16; the README describes "a leaderboard of 30" and marks its onset column unvalidated), so
      record maintainer_type individual. Its project page is also a personal GitHub Pages site. Lineage: derived
      from terminal-bench 2.1.'
    action: follow-up
  note: 'The repository is not archived (MIT), was pushed 2026-11-16 and released v0.25.0 (2026-10-17) to v0.29.0
    (2026-11-13) after the earliest entry curation. The catalogue lists 194 evaluations: 129 inspect_evals and 65

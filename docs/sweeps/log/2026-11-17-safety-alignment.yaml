# docs/sweeps/log/2026-11-17-safety-alignment.yaml -- P1-S12-T06, the first semi-annual sweep of
# safety-alignment (06 S6; the instrument is docs/sweeps/checklist.md). One row per hub in
# docs/sweeps/hubs.yaml and one per entry; "checked-no-change" is a result. Each finding carries `action`:
# `applied` in this PR, or `follow-up`, a change the sweep found that needs new Sources and goes to a later
# PR; a change to docs/sweeps/hubs.yaml goes to one PR for the whole batch, so the family PRs stay
# independent. New candidates are capped at five for the family; the hub notes name the others seen. Dataset
# cards, READMEs and metadata were read, never a dataset's prompts. No commit author, leaderboard submitter,
# author or other individual is named; account handles appear only inside URLs the entries already record.
# scripts/check_sweep_log.py checks this file.


# .github/workflows/pr-validate.yml -- P0-S6-T01
#
# 05 S9's "On every pull request" table, checks 1 to 4, every one blocking:
#
#   1  bench fmt --check        kills cosmetic diffs before they become merge conflicts
#   2  schema validation        tier 1 (Pydantic)
#   3  referential validation   tier 2: every id referenced exists; no reference into tombstones/
#   4  semantic validation      tier 3: the cross-field rules (04 S12)
#
# Blocking means no continue-on-error, no `|| true` and no path filter: a pull request that touches
# nothing these checks read still runs them, so a required status check is never left pending.
# Branch protection is what makes a failing check stop a merge; this file makes the check fail.
#
# Scope (05 S3, `--changed-only`). On a pull request, checks 2-4 report only on files changed
# against the merge base with origin/$GITHUB_BASE_REF -- the whole corpus is still loaded, so a
# changed file's broken reference into an unchanged one is still caught. On a push to main, and on a
# manual run, they validate everything. The merge base needs history, hence fetch-depth: 0.
#
# Python is the lockfile's: uv.lock says requires-python ==3.12.*, and every `uv run` names 3.12
# with --locked, so a stale lockfile fails rather than resolving afresh
# (tests/ci/test_pr_validate_matrix.py holds the two together).
#
# Jobs 7 and 8 (P0-S6-T04; 05 S9) are the metadata-only invariant -- no dataset or archive file and nothing
# over 256 KB under data/ -- and the licence firewall: no commit moves vendor/ content into data/ without a
# `Re-derived-from:` trailer naming a primary source. Job 8 reads every commit of the pull request (or of
# the push), so it needs the history, hence fetch-depth: 0.
#
# Jobs 9 and 9d (P0-S6-T05; 05 S9) are the identifier checks: the retired-id ledger (9), the forbidden-
# identifier grep over its path allowlist (9a) and vocabulary id uniqueness and grammar (9c), then the
# homograph declarations (9d) and their tautological coverage cells (9e, PENDING until the coverage build
# emits build/derived/coverage.json; a pending check does not fail the job, and says so in its log).
#
# Job 5 is the codegen drift check (P0-S6-T02; 05 S9): `bench schema gen --check` regenerates the JSON Schema
# from the Pydantic models and the TypeScript types from it, and fails on any diff. The vocabularies become
# Literal enums at import time, so a taxonomy/ change drifts the artifacts as surely as a schema/ change; the
# job has no path filter, like every job here, so it runs on both. It replaced schema-codegen.yml, which ran
# the same command on its own until this file existed. The issue-form dropdowns join it when the forms do.
#
# sweep-families (P1-S12-T01; 06 S6) runs scripts/check_sweep_families.py: docs/sweeps/hubs.yaml's
# families are exactly taxonomy/domains.yaml's, 06 S6's cadence and effort tables agree with it, and
# docs/sweeps/checklist.md's generated cadence table is current. A twentieth family added to the
# taxonomy without a sweep block fails here, in the same pull request.
#
# single-source (P4-S5-T06; 12 S6, 06 S3.10) builds the site and runs scripts/check_single_source.py
# over it: no single-aggregator citation figure renders without its "unverified" marker, and no
# OpenAlex citation count is a headline number. The build needs the whole history (tools/build/feed.py
# walks it) and the locked Python (BENCH_PYTHON), hence fetch-depth: 0 and `uv sync` before it.
#
# Actions are pinned by commit SHA (08 S6); these are the SHAs archive-sources.yml resolved on
# 2026-09-24, and setup-node's is schema-codegen.yml's (resolved 2026-09-25).

name: pr-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON: '3.12'
  # --changed-only on a pull request, the full corpus otherwise (05 S3).
  SCOPE: ${{ github.event_name == 'pull_request' && '--changed-only' || '' }}

jobs:
  check-1-fmt:
    name: 1 fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: bench fmt --check
        run: uv run --locked --python "$PYTHON" bench fmt --check

  check-2-schema:
    name: 2 schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: bench validate --tier schema
        run: uv run --locked --python "$PYTHON" bench validate --tier schema $SCOPE

  check-3-ref:
    name: 3 referential validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: bench validate --tier ref
        run: uv run --locked --python "$PYTHON" bench validate --tier ref $SCOPE

  check-4-semantic:
    name: 4 semantic validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: bench validate --tier semantic
        run: uv run --locked --python "$PYTHON" bench validate --tier semantic $SCOPE

  check-5-codegen:
    name: 5 codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: json-schema-to-typescript from the site lockfile
        working-directory: site
        run: npm ci --ignore-scripts
      - name: bench schema gen --check
        run: uv run --locked --python "$PYTHON" bench schema gen --check

  check-7-metadata-only:
    name: 7 metadata-only invariant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: check_metadata_only.py
        run: uv run --locked --python "$PYTHON" python scripts/check_metadata_only.py

  check-8-licence-firewall:
    name: 8 licence firewall
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The commits to read: a pull request's against its base, a push's since the previous tip, and a
      # manual run's own tip only (no base).
      FIREWALL_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: check_licence_firewall.py
        run: uv run --locked --python "$PYTHON" python scripts/check_licence_firewall.py ${FIREWALL_BASE:+--base "$FIREWALL_BASE"}

  check-9-identifiers:
    name: 9 identifiers (9, 9a, 9c)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: check_identifiers.py
        run: uv run --locked --python "$PYTHON" python scripts/check_identifiers.py

  check-9d-homographs:
    name: 9d homographs (9d, 9e)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: check_homographs.py
        run: uv run --locked --python "$PYTHON" python scripts/check_homographs.py

  sweep-families:
    name: sweep hub list is the domain vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: check_sweep_families.py
        run: uv run --locked --python "$PYTHON" python scripts/check_sweep_families.py

  single-source:
    name: single-source marker on the built site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: the locked Python environment, for the build's feed step
        run: uv sync --locked --python "$PYTHON"
      - name: site dependencies from the lockfile
        working-directory: site
        run: npm ci --ignore-scripts
      - name: astro build
        working-directory: site
        env:
          BENCH_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npx astro build
      - name: check_single_source.py
        run: uv run --locked --python "$PYTHON" python scripts/check_single_source.py

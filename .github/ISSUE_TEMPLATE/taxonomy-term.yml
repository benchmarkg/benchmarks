# .github/ISSUE_TEMPLATE/taxonomy-term.yml -- P2-S6-T02 (05 S6, 05 S5, 03 S5, 03 S8.2).
# A vocabulary term is the hardest change in the repository: two reviewers and an ADR (05 S5). So this form
# routes to the ADR process and never auto-PRs: it carries no `source:issue-form` label, which is what the
# intake bot opens pull requests for. The `facet` dropdown's options come from scripts/gen_issue_forms.py.
name: Taxonomy term
description: Propose a new vocabulary term. It goes to the ADR process; no pull request is opened for you.
title: "Taxonomy term: "
labels: ["form:taxonomy-term", "route:adr"]
body:
  - type: markdown
    attributes:
      value: |
        Adding a term is deliberately one of the hardest changes in this repository: it needs an Architecture Decision Record and two reviewers. A term is admissible only with a definition, an inclusion test, an exclusion test and a near miss.
  - type: dropdown
    id: facet
    attributes:
      label: Facet
      description: Which vocabulary the term belongs to. Options come from taxonomy/.
      options:
        - domain
        - capability
        - evaluation_method
        - subject
        - data_properties
        - lifecycle
        - governance
        - execution
        - ceiling_anchor_type
        - maintenance_status
    validations:
      required: true
  - type: input
    id: term-id
    attributes:
      label: Proposed id
      description: A lowercase kebab slug (for example program-synthesis).
    validations:
      required: true
  - type: input
    id: term-label
    attributes:
      label: Label
      description: The name a reader sees.
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definition
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: inclusion-test
    attributes:
      label: Inclusion test
      description: The question that decides a benchmark carries the term.
    validations:
      required: true
  - type: textarea
    id: exclusion-test
    attributes:
      label: Exclusion test
      description: What carries a neighbouring term instead, and why.
    validations:
      required: true
  - type: textarea
    id: near-miss
    attributes:
      label: Near miss
      description: A real benchmark that looks like it qualifies and does not, and why.
    validations:
      required: true
  - type: textarea
    id: benchmarks
    attributes:
      label: Benchmarks that need it
      description: Real benchmarks no current term fits, each with a URL.
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Sources
      description: Required.
      options:
        - label: The benchmarks I named exist and their sources support the definition; I understand the term goes through an ADR and two reviewers
          required: true
  - type: checkboxes
    id: bot-disclosure
    attributes:
      label: What happens next
      description: Required.
      options:
        - label: I understand a bot labels this issue for the maintainers and opens no pull request; a person takes it to an ADR
          required: true

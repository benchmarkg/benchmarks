# .github/ISSUE_TEMPLATE/correction.yml -- P2-S6-T02 (05 S6, the ten-minute walkthrough).
# Every entry page's "Suggest a correction" link prefills `entity` and `field` by id through query
# parameters, which is why both are plain text inputs.
name: Correction
description: Fix a wrong field on an entry the index already has.
title: "Correction: "
labels: ["form:correction", "source:issue-form"]
body:
  - type: markdown
    attributes:
      value: |
        A correction is a commit with a rationale, never a quiet edit. It is listed on the corrections page with the date, what the entry said before, what it says now, and who reported it.
  - type: input
    id: entity
    attributes:
      label: Entry id
      description: The id of the benchmark, claim or source, as its page shows it (for example swe-bench).
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field
      description: The field that is wrong, as its page names it (for example data.size).
    validations:
      required: true
  - type: input
    id: current-value
    attributes:
      label: What the entry says now
      description: Optional. Copy it from the page.
    validations:
      required: false
  - type: input
    id: correct-value
    attributes:
      label: The correct value
      description: What the field should say.
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: A page that states the correct value. Must start with https://
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: The sentence that states it
      description: Paste, word for word, the sentence from that page that gives the correct value.
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Sources
      description: Required.
      options:
        - label: The correct value is stated by the source I linked; I have not filled it from memory
          required: true
  - type: checkboxes
    id: bot-disclosure
    attributes:
      label: What happens next
      description: Required.
      options:
        - label: I understand a bot validates this issue, comments with the YAML it would write, and opens a pull request crediting me as co-author, which a person reviews before anything is merged
          required: true

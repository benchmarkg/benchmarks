# .github/ISSUE_TEMPLATE/dispute.yml -- P2-S6-T02 (05 S8, the dispute record).
# Disputes are never resolved by deletion: the disputed record keeps its number and source, and the dispute
# renders beside it with its own source and the disputant's relationship to what is disputed.
name: Dispute
description: Contest an entry or a result. Both positions stay visible; nothing is deleted.
title: "Dispute: "
labels: ["form:dispute", "source:issue-form"]
body:
  - type: markdown
    attributes:
      value: |
        A dispute is never resolved by deleting the disputed number. The entry keeps it, with its source, and your position appears beside it, with yours. An organisation contesting its own score gets exactly the same treatment as anyone else, and the page says which you are.
  - type: input
    id: concerns
    attributes:
      label: What you dispute
      description: The id of the entry, claim or source, as its page shows it.
    validations:
      required: true
  - type: dropdown
    id: disputant-relationship
    attributes:
      label: Your relationship to it
      description: Shown with the dispute. Pick the one that fits.
      options:
        - evaluated-party
        - benchmark-maintainer
        - third-party
        - unknown
    validations:
      required: true
  - type: textarea
    id: position
    attributes:
      label: Your position
      description: What is wrong, and what you believe is right.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: One URL per line. Each should be public, so a reader can check it.
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Sources
      description: Required.
      options:
        - label: My position rests on the evidence I linked, and I understand the disputed record stays visible beside it
          required: true
  - type: checkboxes
    id: bot-disclosure
    attributes:
      label: What happens next
      description: Required.
      options:
        - label: I understand a bot validates this issue, comments with the dispute record it would write, and opens a pull request crediting me as co-author, which a person reviews before anything is merged
          required: true

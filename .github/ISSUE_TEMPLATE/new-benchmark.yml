      required: false
  - type: dropdown
    id: licence
    attributes:
      label: Licence
      description: The licence the dataset or code states. Choose other/unknown if it states none or you are not sure.
      options:
        - CC-BY-4.0
        - CC-BY-SA-4.0
        - CC-BY-NC-4.0
        - CC0-1.0
        - MIT
        - Apache-2.0
        - BSD-3-Clause
        - other/unknown

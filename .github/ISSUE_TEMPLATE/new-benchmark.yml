  - type: textarea
    id: notes
    attributes:
      label: Anything we should know
      description: Optional. Contamination, saturation, known problems, or anything the fields above cannot say.
    validations:
      required: false
  - type: checkboxes
    id: attestation
    attributes:
      label: Sources
      description: Required.
      options:
        - label: Every field above is supported by the linked sources; I have not filled anything from memory
          required: true
        - label: I understand this index links to data and never hosts it
          required: true
  - type: checkboxes
    id: bot-disclosure
    attributes:
      label: What happens next
      description: Required.
      options:
        - label: I understand a bot validates this issue, comments with the YAML it would write, and opens a pull request crediting me as co-author, which a person reviews before anything is merged
          required: true

# .github/ISSUE_TEMPLATE/new-benchmark.yml -- P2-S6-T02 (05 S6, Path A).
# The field list is 05 S6's, in its order. The four vocabulary dropdowns (primary-domain, secondary-domains,
# capabilities, evaluation-method) take their options from taxonomy/ through scripts/gen_issue_forms.py:
# never edit those option lists by hand; CI fails if they drift.
name: New benchmark
description: Add a benchmark the index does not have yet.
title: "New benchmark: "
labels: ["form:new-benchmark", "source:issue-form"]
body:
  - type: markdown
    attributes:
      value: |
        Every field you fill must come from the sources you link: the paper, the repository, the leaderboard. If you are not sure of a value, leave it blank; a blank is better than a guess.
  - type: input
    id: name
    attributes:
      label: Benchmark name
      description: The name its authors use.
      placeholder: SWE-bench
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage or paper URL
      description: The benchmark's own page, or its paper. Must start with https://
      placeholder: https://
    validations:
      required: true
  - type: input
    id: tagline
    attributes:
      label: One-sentence description
      description: What an item asks and how it is scored, in at most 120 characters.
    validations:
      required: true
  - type: dropdown
    id: primary-domain
    attributes:
      label: Primary domain
      description: The one subdomain the benchmark belongs to most. Options come from taxonomy/domains.yaml.

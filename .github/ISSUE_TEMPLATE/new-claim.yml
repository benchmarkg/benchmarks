# .github/ISSUE_TEMPLATE/new-claim.yml -- P2-S6-T02 (05 S6; 04 S7 ResultClaim, 04 S8 EvalConditions).
# A result is a claim with its conditions: the same number under different shots, scaffold or effort is a
# different measurement, so the conditions are asked for beside the value rather than left to a note.
name: New result claim
description: Add a result a system reached on a benchmark, with the conditions it was run under.
title: "New claim: "
labels: ["form:new-claim", "source:issue-form"]
body:
  - type: markdown
    attributes:
      value: |
        Give the number as the source states it, and the conditions the source states. A condition the source does not state is left blank: a blank is recorded as unknown, a guess as a fact.
  - type: input
    id: benchmark
    attributes:
      label: Benchmark id
      description: As the benchmark's page shows it (for example swe-bench-verified), with a version if the source names one (swe-bench@verified).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: The model, agent or pipeline, and its version or snapshot date if stated.
    validations:
      required: true
  - type: input
    id: metric
    attributes:
      label: Metric
      description: The metric the number is in (for example resolved rate, accuracy, pass@1).
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: Value
      description: The number exactly as the source gives it, with its unit (for example 49.2%).
    validations:
      required: true
  - type: input
    id: date-reported
    attributes:
      label: Date reported
      description: When the source published the result, as an ISO date (YYYY-MM-DD).
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: The paper, leaderboard or report that states the result. Must start with https://
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: The sentence or row that states it
      description: Paste it word for word.
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Conditions
      description: Optional, each only if the source states it - shots, chain of thought, reasoning effort, tools allowed, scaffold or harness and its version, number of samples and how one was selected, the subset used.
    validations:
      required: false
  - type: checkboxes
    id: attestation
    attributes:
      label: Sources
      description: Required.
      options:
        - label: The value and every condition above are stated by the source I linked; I have not filled anything from memory
          required: true
  - type: checkboxes
    id: bot-disclosure
    attributes:
      label: What happens next
      description: Required.
      options:
        - label: I understand a bot validates this issue, comments with the YAML it would write, and opens a pull request crediting me as co-author, which a person reviews before anything is merged
          required: true

# .github/ISSUE_TEMPLATE/rerun-request.yml -- P8-S1-T03 (13 S0.2, condition (3) of the Phase-8 gate; 05 S6).
# A request to rerun or check a published result. It changes nothing in the index, so it carries no
# `source:issue-form` label and the intake bot drafts nothing for it. `request:rerun` is not on this list either:
# triage applies it (13 S0.2), and the issue list under that label is the count, so a request sent by e-mail is
# transcribed into this form ("so the count has one home"). scripts/adoption_measure.py reads the `unsolicited`
# answer from the issue body under its label, by the word before the colon ("Unsolicited:", "Solicited:"); its
# tests hold the label and the options to the script, so change neither without the other.
name: Rerun request
description: Ask for a published result to be rerun or checked. A maintainer reads it; the index does not change because of it.
title: "Rerun request: "
labels: ["form:rerun-request"]
body:
  - type: markdown
    attributes:
      value: |
        This project does not run evaluations today. A maintainer reads every request and keeps it on record, but a request does not schedule a rerun and does not change any entry. If the index has a value wrong, the Correction form is the faster route.
  - type: input
    id: target
    attributes:
      label: What to rerun or check
      description: The id of the benchmark or result claim, as its page shows it (for example swe-bench-verified), or the URL of the published result.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What you are asking for
      description: Which result, under which conditions, and what a rerun or a check would settle.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Optional. One URL per line, each public so a reader can check it, such as the published result, a log, or your own attempt.
    validations:
      required: false
  - type: dropdown
    id: unsolicited
    attributes:
      label: Does this request answer a call for requests?
      description: Answer for the person asking; when transcribing an e-mail, for its sender. A request that answers a call is read like any other and recorded as such. The maintainer who triages the issue confirms this answer or corrects it.
      options:
        - "Unsolicited: no, nobody asked for requests; it is the requester's own"
        - "Solicited: yes, it answers a call for requests (a post, an announcement or a message asking for them)"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: arrived-by
    attributes:
      label: How the request arrived
      description: A request sent by e-mail is transcribed here by the maintainer who received it, without the sender's address or name.
      options:
        - Opened here by the person asking
        - Transcribed from an e-mail by a maintainer
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Sources
      description: Required.
      options:
        - label: Anything I state about a published result comes from a source I linked or from my own attempt, not from memory
          required: true
  - type: checkboxes
    id: bot-disclosure
    attributes:
      label: What happens next
      description: Required.
      options:
        - label: I understand no bot acts on this issue and no pull request is opened for it; a maintainer reads it, and the index does not change because of it
          required: true

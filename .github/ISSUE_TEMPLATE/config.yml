# .github/ISSUE_TEMPLATE/config.yml -- P2-S6-T02 (05 S6). Every issue goes through one of the five forms;
# anything the forms do not model is Path B, a direct pull request.
blank_issues_enabled: false
contact_links:
  - name: Direct pull request (Path B)
    url: https://github.com/benchmarkg/benchmarks/pulls
    about: For lineage changes, subsets, bulk edits and anything else the forms do not model.

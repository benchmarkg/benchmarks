- arxiv_id: '2609.14073'
  title: 'LPA-CWM: A Learned Physical Adjudicator for Motion Reasoning with Counterfactual World Models'
  abstract: 'Counterfactual world models (CWM) extract motion from pretrained video predictors by comparing factual and intervened
    predictions, but uniform aggregation weights responses equally without explicitly incorporating physical priors. Our key
    insight is to incorporate physical priors into candidate reliability learning, motivating LPA-CWM with a lightweight Learned
    Physical Adjudicator (LPA). Trained on dense MOVi-F trajectories, the 3.0M-parameter LPA compares visual context and response
    structure across an unordered candidate set to predict relative weights; windowed localization and one paired re-evaluation
    recover motion with the CWM frozen. Existing video-level benchmarks do not directly assess motion correspondence, where
    low localization error can conceal missing trajectory segments. We introduce Completeness-aware Motion Correspondence
    (CMC), a ground-truth-anchored protocol jointly measuring localization, completeness, visibility, and continuity, counting
    missing predictions as failures on visible dynamic points. Across DAVIS, Kinetics, and RoboTAP, LPA-CWM improves all main
    CMC measures over Uniform CWM, with relative gains of 18.1%--60.0% in average Dynamic Correspondence Accuracy ($\mathrm{DCA}_{\mathrm{avg}}$),
    and improves TAP-Vid First tracking accuracy (overview: https://LPA-CWM.github.io).'
- arxiv_id: '2609.13984'
  title: What Makes an Efficient VLA? Navigating Action-Head Design, Scaling, and Latency
  abstract: 'Vision-Language-Action (VLA) models combine a pretrained vision encoder, a language backbone, and an action head,
    but their relative contribution has not been established under controlled, latency-paired conditions. We fix the backbone
    families (SigLIP2 and Qwen2.5) and the training pipeline, sweep action-head design and module scale, and pair each configuration
    with measured on-device latency. The study yields three findings. First, action-head performance is governed primarily
    by initialization rather than decoder architecture, loss, or inference budget: copying the last transformer layers of
    the language backbone into the head is the single largest lever, at no latency cost, and the only axis that helps at every
    module scale. Alignment also explains the other axes: flow matching and a heavier decoder pay off only while the head
    is misaligned and reverse once it is aligned, and extra inference passes give no measurable benefit; expressiveness appears
    to substitute for missing alignment. We read this as representation transfer: the aligned head keeps attending to the
    instruction''s object nouns and stays close to the backbone in weight space rather than relearning to act from scratch.
    Because we reach alignment only through initialization, we offer this as the account that best organizes the measurements,
    not a demonstrated cause, and name the control that would settle it. Second, capacity pays only after alignment: the aligned
    action head is the highest-return module to scale. Third, those returns diminish sharply near the size today''s $\pi$-series
    VLAs already use, so further growth buys little in-domain accuracy for its latency. These specify EffVLA, a compact model
    matching the strongest open-source VLAs on standard LIBERO, leading on most LIBERO-Plus perturbation axes at lower latency,
    and transferring to a real SO-ARM101 arm with the recipe unchanged.'
- arxiv_id: '2609.17491'
  title: 'FreqSpaNet: Frequency and Spatial Learning of SFPF for Physical Layer Hardware Integrity Detection'
  abstract: Unauthorized hardware replacement can preserve a wireless device's logical identity while altering its physical
    implementation, posing a challenge to hardware integrity verification. Spatio-frequency polarization fingerprints (SFPFs)
    capture device-dependent responses across multiple frequencies and directions, but their frequency and spatial dimensions
    exhibit different structural dependencies. We propose FreqSpaNet, an SFPF representation learning network for open set
    hardware anomaly detection. A frequency branch captures local variations among neighboring frequencies, while a geometry-aware
    spatial branch models directional relationships using angular information. The two representations are combined through
    adaptive fusion, and complementary pretraining further captures shared information while preserving the distinct characteristics
    of the frequency and spatial representations. Experiments show that FreqSpaNet achieves a mean AUROC of 96.31\%, 9.05
    points above the baseline. Results under seven hardware replacement scenarios further verify the effectiveness of FreqSpaNet.
- arxiv_id: '2609.14892'
  title: An explicit solution of the five-expert prediction PDE and the exact optimality set of COMB
  abstract: In this paper, we derive an explicit solution of the stationary prediction with expert advice PDE for five experts.
    The formula is given in three regions. In the first two regions, it is the four-expert solution plus a single integral
    with an elementary positive density. In the third region, it is a finite sum of hyperbolic products whose coefficients
    are determined by one scalar quadrature. Our formula establishes that the direction $(1,0,1,0,0)$ is optimal throughout
    the ordered sector, and that the COMB strategy $(1,0,1,0,1)$ is optimal only on a lower dimensional subset of the sector
    (where $x_1=x_2$ and $x_3=x_4$). This disproves the COMB optimality conjecture of Gravin, Peres and Sivan. The verification
    of the Hamiltonian inequalities is a tedious task, part of which is completed with a computer assisted proof. The verification
    reduces to 21 scalar inequalities, which we prove using 147 exact rational Bernstein polynomial certificates. The exact
    certificates and their independent arithmetic checks are included in a supplement to this paper, and a Lean 4 formalization
    machine-checks the verification and both main theorems, apart from the viscosity characterization.
- arxiv_id: '2609.12825'
  title: 'SCDM: Spatial-Contextual Disentanglement Mamba via Differential Inference for Efficient Image Classification'
  abstract: State Space Models (SSMs), particularly VMamba, have emerged as efficient alternatives for modeling long-range
    dependencies in medical image analysis. However, distinguishing subtle pathological features from visually similar anatomical
    backgrounds remains a significant challenge. Existing SSM architectures often learn entangled representations, lacking
    explicit mechanisms to separate disease-specific signals from normal anatomy. To address this limitation, we propose Spatial-Contextual
    Differential Mamba (SCDM), an asymmetric dual-branch architecture designed for selective representational disentanglement.
    SCDM introduces a Positive Branch for extracting discriminative features and a Negative Branch that actively models and
    suppresses normal anatomical context. This separation is achieved through a similarity-driven repulsion gate and a differential
    inference rule, which promote competitive feature learning without requiring additional branch labels or increasing model
    capacity. Evaluated on the RSNA Pneumonia dataset, SCDM achieves competitive classification performance (AUC of 0.858)
    while requiring significantly fewer parameters (29.4M) and FLOPs (1.44G) compared to standard VMamba and vision transformer
    baselines. Furthermore, activation analyses demonstrate that our differential mechanism yields highly precise localization,
    effectively isolating lesions by inhibiting irrelevant anatomical distractors.
- arxiv_id: '2609.13499'
  title: 'Canaries in the Bank: Auditing User-Level Privacy in Private Evolution'
  abstract: Private Evolution (PE) generates high-fidelity synthetic data in federated settings without exposing users' raw
    data. It aggregates clipped user votes over a shared candidate bank into a differentially private histogram, with noise
    calibrated to the worst-case user contribution. However, it is unclear whether an adversary can realize this worst-case
    privacy loss while following the PE protocol. We introduce a protocol-aware empirical audit in which the server commits
    to a single shared candidate bank and replaces roughly 1% of its entries with probes derived from a known, non-private
    canary. We evaluate eight attacks, including an unchanged-bank baseline, exact copies, plausible paraphrases, and high-entropy
    synthetic nonces. Experiments on Yelp and Sentiment140 show that natural-text attacks remain substantially below the theoretical
    DP bound, while nonce-based attacks yield considerably stronger bounds and come closest to the mechanism's privacy ceiling.
    These results quantify the gap between formal worst-case privacy and leakage achievable through protocol-valid candidate-bank
    manipulation.
- arxiv_id: '2609.18861'
  title: 'PersonaPath: Towards Knowledge-Centric Personalized Learning Path Planning'
  abstract: 'Adaptive learning systems commonly formulate learning path planning as Exercise-Centric (EC) recommendation,
    where the next step is inferred from item-level interaction logs. Evaluating goal-oriented guidance additionally requires
    explicit learner goals and curriculum-scale prerequisites: learners with similar exercise records may need different paths
    toward their targets. We therefore study Knowledge-Centric (KC) personalized learning path planning, where a planner must
    reason over learner profiles, mastery states, and prerequisite knowledge structures to decide which textbook, unit, and
    concept should be studied next. To support this setting, we introduce PersonaPath, a benchmark that pairs 2,000 fine-grained
    learner personas with a hierarchical knowledge graph of 347 textbooks, 1,751 units, and 4,092 concepts across 77 subjects.
    We evaluate representative LLMs on PersonaPath. Results show that even the strongest LLM reaches only a 29.5% final pass
    rate in Basic Education, and that the main bottleneck lies in adaptivity, where no model exceeds 44.7% in tailoring paths
    to individual learners.'
- arxiv_id: '2609.18737'
  title: 'Geometry beneath the Waves: Dense Priors for Sparse-View Underwater 3D Gaussian Splatting'
  abstract: Underwater 3D reconstruction remains challenging under sparse views, where scattering, absorption, and suspended
    particles degrade feature correspondences and geometric estimation. Although feed-forward geometry foundation models offer
    an alternative to conventional Structure-from-Motion, their direct application underwater produces noisy and fragmented
    geometry that limits subsequent 3D Gaussian Splatting (3DGS). We propose a sparse-view underwater reconstruction framework
    that adapts feed-forward geometry to underwater degradation and exploits its dense geometric priors for view synthesis.
    First, we adapt VGGT using LoRA and teacher--student distillation, training on synthetically degraded underwater images
    while preserving clean geometric supervision. This improves robustness to underwater appearance distortions without modifying
    the pretrained prediction heads. Second, the predicted dense geometry initialises an intermediate 3DGS representation
    that generates geometry-guided pseudo-views, increasing view overlap and strengthening feature tracks for subsequent RUSplatting
    optimisation. Experiments on SeaThru-NeRF and Submerged3D demonstrate improved reconstruction quality under sparse-view
    conditions. On SeaThru-NeRF, our method improves RUSplatting from 24.37 to 27.11 dB PSNR and increases SSIM from 0.7611
    to 0.8634, while achieving the best average PSNR and LPIPS on Submerged3D. These results demonstrate the potential of
    domain-adapted geometric priors for robust sparse-view underwater 3D reconstruction.
- arxiv_id: '2609.17777'
  title: 'Information Set Emulation: Causal Certificates for AI Derived EHR Features'
  abstract: 'AI and large language models can recover clinically meaningful features from electronic health records (EHRs),
    but predictive usefulness does not establish admissibility for causal inference. We introduce information set emulation:
    an AI typed lift attaches source evidence, clinical and recording times, decision-time availability, representation version,
    proposed causal roles, and unresolved ambiguity to extracted features under a locked target trial. Causal certificates
    record auditable evidence for those roles. Features with unresolved downstream roles are routed to compatible reporting
    or separate analyses. Typed evidence defines an observational fiber of causal worlds consistent with the observed law.
    The locked scalar estimand maps this fiber to a compatible image whose squared Chebyshev radius equals the residual minimax
    mean squared error when the image is nonempty and compact. This classical identity provides a target-specific measure
    of information ambiguity. The contribution is its integration with a joint EHR observation map and an auditable certificate
    architecture. Under explicit exchangeability, positivity, and nuisance-consistency conditions, we give identification
    and cross-fitted augmented inverse probability weighted estimation, distinguishing empirical and population targets. An
    EHR compression-drift identity separates the roles of frame presence, treatment assignment, and outcome observation. Artificial
    simulations and a common-law finite-world example illustrate estimation failures and information-radius reduction. Synthetic
    Phase 0 notes demonstrate audit diagnostics; a separate role-specific analysis spread illustrates routing and is not an
    exact fiber radius. All experiments are synthetic. The framework specifies when reconstructed information can support
    a point claim and when compatible reporting is required.'
- arxiv_id: '2609.18591'
  title: Recursive Reasoning or Statistical Extrapolation? In-Context Learning in Multi-Agent Interdependent Decision-Making
  abstract: In-context learning (ICL) enables large language model (LLM) agents to improve decisions using interaction history,
    yet it remains unclear whether such improvement reflects refined internal reasoning or mere extrapolation of statistical
    patterns. To disentangle these mechanisms, we study LLM agents in multi-agent incomplete-information games that require
    recursive belief reasoning. By constructing a public goods game and manipulating the statistical structure of historical
    feedback, we evaluate decision quality against a history-independent rational expectations equilibrium (REE) benchmark.
    Our experiments reveal that when historical statistical patterns are disrupted, the benefits of longer context largely
    vanish, degrading decision quality to the no-context baseline in a way sharply amplified by stronger strategic interdependence.
    These results suggest that, in such strategic environments, ICL behavior is more consistent with statistical extrapolation
    than with strategic reasoning. Our work extends the mechanistic study of ICL to strategic multi-agent settings, introduces
    REE as a diagnostic tool for distinguishing reasoning from extrapolation, and provides a reusable framework for probing
    the boundaries of LLM reasoning in recursive belief tasks.
- arxiv_id: '2609.12435'
  title: Observation-Anchored Selective Assimilation for Longitudinal Tumor-State Proxy Forecasting in Post-Treatment Glioma
  abstract: Post-treatment MRI in patients with glioma provides serial observations for updating patient-specific tumor-state
    proxy estimates, but variable appearances and trajectories complicate forecasting. We formulate forecasting as an observation-aware
    digital-twin update in which an intermediate observation anchors the patient-specific state. Among 203 patients and 594
    follow-up time points, a predefined no-new-treatment criterion retained 120 of 236 candidate triplets, split into 81/24/15
    training/validation/test triplets at the patient level. Each time point was represented by a continuous voxel-wise tumor-state
    proxy map in [0,1] derived from MRI lesion labels. A SegMamba-based single-step forecaster predicted update proposals
    from multimodal source-state tensors. Observation-Anchored Selective Assimilation (OASA) retained the observed intermediate
    proxy as the state anchor and selectively applied updates through a validation-selected tiered case-level rule and voxel-wise
    soft gate. We compared initial-scan forecasting, rollout without assimilation, latest-observation persistence, direct
    prediction, OASA, OASA + calibration, and morphological dilation. Checkpoints, OASA rules, and calibration thresholds
    were selected using validation data only. Across three seeds on 15 held-out test triplets, OASA maintained Dice at $\tau$
    = 0.2 comparable to persistence (0.6071 $\pm$ 0.0025 vs. 0.6070) while yielding numerically higher Dice at $\tau$ = 0.5
    (0.4269 $\pm$ 0.0079 vs. 0.3981), with a small RMSE increase. Calibration increased Dice at $\tau$ = 0.2 to 0.6178 $\pm$
    0.0025, increased false-positive (FP) support (11,836$\rightarrow$18,663), and reduced false-negative (FN) support (22,107$\rightarrow$17,536).
    This reflects near-threshold support calibration rather than improved biological predictive capability. Code is publicly
    available at https://github.com/jsudg436/longitudinal-proxy-forecasting.
- arxiv_id: '2609.18273'
  title: Behavioral Fingerprinting and Navigation Prediction in Web Browsing
  abstract: 'Web browsing often appears ephemeral: users visit a few websites, complete a task, and move on. However, even
    short fragments of browsing activity can contain rich and structured behavioral signals. In this work, we conduct a comparative
    empirical study of two complementary behavioral inference tasks: session-level user identification and next-domain prediction.
    Both tasks are derived from the same cleaned event stream and evaluated on large-scale anonymous browsing traces, with
    sessionization and splitting adapted to the temporal requirements of each task. For user identification, we evaluate classical
    and neural models operating on session-level behavioral and domain features. For next-domain prediction, we combine graph-based
    modeling with Large Language Models (LLMs). Experimental results show that short browsing sessions are highly identifiable,
    while future navigation actions are highly predictable from long-term interaction structure combined with recent behavioral
    context. Furthermore, LLM-derived semantic features yield only marginal gains over purely structural and sequential models,
    indicating that repeated interaction patterns remain the dominant predictive signal in the evaluated web-browsing setup.
    These findings highlight the extent to which interaction history substantially contributes to both user identifiability
    and navigation predictability in browsing traces.'
- arxiv_id: '2609.15894'
  title: Quenched Ensemble Sampling
  abstract: Some of the sharpest challenges in sampling from the energy functions of physical systems arise at phase transitions,
    where the density of states changes abruptly and many sampling algorithms stall. Nested sampling is a particle method
    that traverses the density of states under a hard energy constraint and is known to be robust to such transitions, but
    its application in high dimension is limited by the difficulty of sampling under that constraint. In this work we introduce
    Quenched Ensemble Sampling, which generalises the hard constraint to a family of repulsive potentials at the energy boundary.
    This preserves the quenched path of monotonically decreasing energy while making the constrained target amenable to scalable
    gradient-based kernels. We demonstrate on synthetic models of phase transitions that our method estimates the marginal
    likelihood and draws posterior samples across a first-order transition where popular alternatives such as tempering fail.
    We apply the procedure to marginal likelihood estimation in Bayesian neural networks, enabling model comparison between
    network architectures. Finally, in a high-dimensional continuous lattice field theory, we show that this method traverses
    a first-order transition and estimates the partition function.
- arxiv_id: '2609.12835'
  title: 'HemaHier: Chain-Conditioned Ordinal Hierarchies for Lineage-Aware Bone-Marrow Cytology'
  abstract: 'Bone-marrow cytology is inherently structured: each cell belongs to a hematopoietic lineage, and many cell types
    lie on ordered maturation trajectories. Standard flat classifiers ignore this structure, treating a mild same-lineage
    confusion the same as a severe cross-lineage mistake and predicting only discrete labels. We propose HemaHier, an ordinal-hierarchical
    prediction head for a frozen or lightly adapted cytology foundation model. Its central component is a chain-conditioned
    maturity score that reads a single maturity value under a per-chain query, supervised only on biologically valid healthy
    chains, while dysplastic and off-chain cell types remain classes but are excluded from maturity supervision. Fine and
    lineage predictions are coupled through a shared posterior that guarantees hierarchical consistency, and a staged objective
    first stabilizes recognition, then adds lineage and maturity supervision. On three bone-marrow datasets under a shared
    ontology, HemaHier achieves competitive recognition while reducing biologically severe errors and adding a within-lineage
    maturity ordering that flat classifiers lack. Code is available at https://github.com/xmindflow/HemaHier.'
- arxiv_id: '2609.17599'
  title: 'Structure is not mechanism: high-gain gated-FFN rows across text and genomic foundation models'
  abstract: 'A small number of unusually high-gain parameters can exert disproportionate effects in transformer language models,
    but whether analogous structures recur in genomic foundation models and whether structural geometry determines functional
    importance remains unknown. We analyzed high-gain rows in gated feed-forward networks across text and genomic foundation
    models, including a frozen 22-model causal census. Computing an associated bilinear weight operator exactly, without a
    diagonal approximation, we tested whether structural extremeness is a transferable mechanism. Activation-derived candidates
    were functionally enriched relative to random and top-norm same-layer controls, yet neither spectral concentration nor
    operator magnitude predicted causal effect size, and these associations vanished within the endpoint-homogeneous text-decoder
    subset. A within-layer sweep of 36 rows in one genomic and one text decoder resolved this into two regimes: below the
    detector''s acceptance threshold the ratio carried no positive information about causal damage, whereas above it the ratio
    ordered rows strongly but did not grade severity as a dose-response. The same sweep revealed a second individually catastrophic
    row invisible to a one-candidate-per-model census, and non-additive damage among co-located critical rows. Case studies
    showed divergent causal organizations: a robust super-additive pair interaction in DNABERT-2, and in GENERator a sharply
    position-localized dependence in which preserving or restoring the row''s beginning-of-sequence contribution rescued essentially
    all native-loss damage. High-gain gated-FFN rows are therefore a recurrent architectural phenotype whose structural prominence
    acts as an enrichment signal, not a calibrated measure of functional criticality or a specification of causal organization.
    Enrichment is general, but the mechanism is model-specific.'
- arxiv_id: '2609.14025'
  title: 'Quantum-Gated LiteSSD: A Parameter-Efficient Lightweight Hybrid Quantum-Classical Framework for Forward-Looking
    Sonar Object Detection'
  abstract: Forward-looking sonar object detection is essential for underwater perception, yet deployment on embedded platforms
    requires highly compact models. To address this challenge, we explore quantum computing and introduce Quantum-Gated LiteSSD,
    a parameter-efficient hybrid quantum--classical detector that reformulates QuCNet-style multi-circuit quantum processing
    as an identity-centered channel-gating mechanism for spatial feature modulation. Experiments on the Marine Debris Watertank
    dataset and UATD forward-looking sonar benchmarks demonstrate an effective parameter--accuracy trade-off. The proposed
    detector achieves 90.84% $\mathrm{mAP}_{50}$ on Watertank with approximately $62\times$ fewer parameters than YOLO26s
    and $164.3\times$ fewer parameters than SSD-VGG16. On UATD, the model achieves 70.37% $\mathrm{mAP}_{50}$ with only 0.150M
    parameters, making it approximately $4.1\times$ smaller than SSGA-YOLO while retaining meaningful multi-class detection
    capability.
- arxiv_id: '2609.22332'
  title: 'AffordanceWAM: Affordance-Aware Joint World-Action Modeling for Robot Manipulation'
  abstract: Generalizable robot manipulation requires predicting how a scene will evolve, identifying where interactions are
    feasible, and determining how to act. Action-labeled robot videos directly supervise control but are costly and limited
    in diversity, whereas egocentric human videos capture diverse interactions but lack robot actions and differ in embodiment
    and appearance. We introduce AffordanceWAM, an affordance-aware generative World Action Model that represents object-centric
    spatiotemporal affordance through Scalar Affordance and Affordance Heatmap, within the generated future World. This representation
    grounds visual prediction in task-relevant objects and interaction regions for action generation, and provides shared
    interaction targets across human and robot videos. Built on a pretrained video diffusion Transformer, AffordanceWAM uses
    separately parameterized World and Action Experts, coupled through Masked Joint Self-Attention, to jointly predict future
    RGB observations, Scalar Affordance fields, Affordance Heatmaps, and continuous robot actions under a unified flow-matching
    objective. Human videos supervise all three future-World streams, whereas robot trajectories additionally provide action
    supervision, enabling transfer without human action labels or retargeting. Experiments on RoboCasa, CALVIN ABC$\rightarrow$D,
    and real-world manipulation demonstrate consistent gains over RGB-only and robot-data-only baselines. Under fixed robot
    supervision, RoboCasa performance improves monotonically as affordance-annotated human video scales. These results support
    affordance as an effective interface for both vision-language-action learning and human-to-robot transfer.
- arxiv_id: '2609.18673'
  title: 'Beyond EER: Multi-Dimensional Evaluation of Information Leakage in Speaker De-Identification'
  abstract: 'Speaker de-identification (SDID) aims to preserve privacy by concealing speaker identity while maintaining speech
    utility. However, current evaluations often reduce privacy to a single dimension - biometric verification performance
    - typically measured by Equal Error Rate (EER). This narrow focus ignores critical leakage channels, such as soft biometric
    inference, embedding-level re-identification, and structural template similarity, which threaten the unlinkability and
    irreversibility of biometric references. We propose a holistic evaluation framework across five complementary metrics:
    (i) EER, (ii) soft biometric leakage score , (iii) cumulative match characteristic re-identification analysis, (iv) canonical
    correlation analysis and Procrustes embedding alignment, and (v) intelligibility via word error rate and semantic similarity.
    Evaluating five SDID systems from the IARPA ARTS program, we demonstrate that these metrics capture independent dimensions
    of information leakage. Our results indicate that reliance on a single metric can misrepresent the privacy properties
    of an SDID system.'
- arxiv_id: '2609.11489'
  title: 'The Convention Gap: Towards Measuring Implicit Communication in Cooperative AI Evaluation'
  abstract: 'Cooperative AI agents are evaluated against other AIs, yet human cooperation relies on implicit conventions --
    shared protocols for reading meaning beyond the literal message -- which AI-AI benchmarks may not capture. We propose
    the convention gap, the difference between the failure probability predicted from the literal content of communication
    and the observed failure rate, as a metric of implicit communication. In the card game Hanabi, the finite deck and deterministic
    hint constraints make this posterior exactly computable. We replayed about 101,000 play actions from three public datasets
    of human-human (an online Hanabi platform), AI-AI (HOAD), and human-AI (HanabiData) games. The gap was +26.2 percentage
    points (pp) in human pairs, -0.7 pp in AI pairs, and +16.4 pp in human-AI pairs, and was concentrated on plays of cards
    that had received no hints (+46 pp in human pairs). Within human-AI play, the literal information available to humans
    was similar across the three AI partners (mean predicted failure 38-41%), but human failure rates ranged from 14.4% to
    34.4% and the gap from +24.1 to +6.2 pp; the partner eliciting the largest gap produced the fewest human failures. Game
    score carried different information: it depended on each corpus''s roster composition, whereas the gap separated human
    from AI play at the agent level. As a known-answer check, Off-Belief Learning agents, whose convention content is controlled
    by construction, gave a gap of +1.6 pp at the convention-free level, rising monotonically to +21.7 pp. These results suggest
    that convention compatibility, rather than AI-AI performance, may predict an AI''s effectiveness with human partners.'
- arxiv_id: '2609.14770'
  title: How broad is that claim? Mapping Generalisation in NLP Research
  abstract: Generalisations are common in scientific communication, even though they are semantically ambiguous. An automated
    method is needed to identify and categorise claims according to their level of generalisation, in order help detect an
    over-reliance on generalisations and possible misrepresentations of scientific findings. We introduce a comprehensive
    taxonomy of generalisations in the scientific domain, NLPGenX, which labels claims according to their level of generality
    and framing within the text. We operationalise this taxonomy with an LLM-powered framework, NLPGenA, that automatically
    classifies sentences from scientific articles into 5 different generalisation classes. We validate our framework with
    human annotators and use the framework to construct a large-scale dataset of NLP papers annotated according to generality,
    with auxiliary labels for hedging and vague descriptors (NLPGens). We use NLPGens to analyse the use of generalisations
    in NLP papers across multiple venues and subdomains, and to examine associations with citation counts, hedging, and vague
    descriptors.
- arxiv_id: '2609.13335'
  title: 'Bridging Thought and Action: Taming Long-Horizon Instability in Open-Source LLM Agents with a MetaTool-Enhanced
    ROS Framework'
  abstract: Large Language Models (LLMs) have enabled more natural human-robot interaction, but open-source models often exhibit
    unstable long-horizon reasoning and inefficient action execution when deployed in agentic robotic frameworks. This paper
    presents an enhanced ROS-Agent based architecture that improves task reliability and execution efficiency for agentic
    robotic systems using open-source LLMs. The proposed system introduces a novel intermediate mechanism, termed the MetaTool,
    which enforces structured planning prior to action execution. Given a natural-language command, the MetaTool induces the
    LLM to generate a pseudo-code plan of intended tool invocations, which is stored in the ROS-Agent's scratchpad and persists
    throughout execution. By explicitly separating planning from execution, the proposed approach reduces execution loops
    and improves deterministic behavior. The architecture is validated on a custom mobile robotic platform with multimodal
    perception and motion control capabilities. Experimental results on real-world interactive tasks demonstrate improved
    task completion and contextual consistency, with up to ~24% gains on complex tasks compared to the baseline framework.
- arxiv_id: '2609.15939'
  title: 'Vulnerability Localization Benchmark: Measuring Agentic Security Analysis at Repository Scale'
  abstract: 'Language-model agents increasingly operate over complete software repositories, yet cybersecurity evaluations
    primarily measure whether they can detect, reproduce, or repair vulnerabilities rather than whether they can locate the
    relevant code. We study vulnerability localization: given a weakness class and an unfamiliar repository, identify the
    implementation files associated with that weakness. We introduce the Vulnerability Localization Benchmark (VLoc Bench),
    comprising 500 real world vulnerabilities from 290 repositories across six package ecosystems and 147 CWE categories.
    Each task pairs repository snapshots immediately before and after a security fix. On the vulnerable snapshot, an agent
    receives only the CWE description and read-only terminal access and must return the affected files; on the patched snapshot,
    it must determine that the recorded vulnerability is no longer present. We evaluate 27 language models and four static-analysis
    tools under a common agent interface. Repository-scale vulnerability localization remains difficult: the strongest system
    achieves 0.229 File F1, and 38.4% of tasks receive no correct localization from any evaluated model. We further find that
    stronger localization does not imply reliable behavior after remediation: systems that identify vulnerable files effectively
    can still report unsupported locations on patched repositories. These results establish vulnerability localization as
    a distinct repository-scale capability and provide a setting for studying both how security agents search for vulnerable
    code and when they should refrain from reporting it.'
- arxiv_id: '2609.11355'
  title: 'SEAR: Segment-Evidence-Aware Routing for Weak-to-Strong Multilingual Speech MCQ'
  abstract: This paper describes our system for Task~2 of the second Multilingual Conversational Speech Language Model (MLC-SLM)
    Challenge. We adapt Qwen3-Omni-30B-A3B-Instruct with a segment-evidence-aware data and post-training pipeline. A language
    model converts timestamped ASR into coherent event spans, which are expanded by a boundary margin and cropped from the
    original recording. We then synthesize complementary semantic MCQs with Qwen3.6-27B and acoustic MCQs with Gemini~3.1
    Flash-Lite, followed by structural, grounding, answer-consistency, and target-model trainability checks, yielding 359,825
    verified MCQs across 21 language and accent variants. A text-only probe partitions the data into weak, text-answerable
    items used for supervised fine-tuning and strong, audio-dependent items used for reinforcement learning with Group Sequence
    Policy Optimization (GSPO), stabilized by debiased advantages, sequence-level importance correction, and dynamic filtering.
    Our system obtains 90.92% accuracy on the final official evaluation set.
- arxiv_id: '2609.11708'
  title: Language-Augmented Semantic Priors for B-Spline Surface Fitting
  abstract: The use of B-splines and Non-Uniform Rational B-Splines surfaces constitutes the mathematical foundation of contemporary
    computer-aided design (CAD) systems. Despite long-term progress, geometric kernels in traditional CAD still rely heavily
    on predetermined heuristic initialization for surface fitting and parameterization. Meanwhile, the procedural semantics
    and design intent encoded in modeling histories are largely ignored during geometry generation. This disconnect creates
    a gap between high-level design intent and solver-executable geometric configuration, often leading to suboptimal and
    semantically inconsistent fitting results. To bridge this gap, we introduce LASP, a Language-Augmented Semantic Priors
    framework that leverages large language models (LLMs) to infer structured, solver-usable B-spline priors from procedural
    modeling histories. Rather than modifying the geometric kernel itself, LASP operates as a semantic reasoning layer above
    existing solvers. It first translates modeling histories into rich textual descriptions that capture design intent, geometric
    context, and functional relationships, and then uses a fine-tuned LLM to predict structured B-spline prior parameters.
    LASP is trained through a two-stage scheme that combines local geometric regularities with long-range contextual dependencies,
    producing priors that are both interpretable and semantically coherent. This approach furnishes inductive signals that
    direct the conventional B-spline fitting process toward solutions that more accurately encapsulate the intended design
    objectives and demonstrate heightened semantic coherence. Compared to traditional machine learning schemes, the experiments
    demonstrate that language-driven reasoning can serve as a powerful inductive bias for geometric solving, establishing
    a new paradigm of language-guided geometric optimization in modern CAD systems.
- arxiv_id: '2609.16192'
  title: 'AI-Driven Feedback Systems, Digital Labour, and Silent Quitting: Transforming African Workplaces'
  abstract: The current trend of digitalisation has revolutionised the organisation of work and the way it is measured and
    performed across the globe, with AI becoming more common for managing labour and performance, as well as employee communication.
    In African organisations, where there is increasing adoption of remote work, hybrid models of work, digital collaboration,
    and data-based HR management, the notion of silent quitting has become more relevant, defined as worker disengagement
    when employees are still doing their job but do not put any effort into achieving good performance and exhibiting any
    emotion. This paper investigates how AI-driven feedback mechanisms, including sentiment analysis systems, pulse surveys,
    chatbots, engagement dashboards, and predictive analytics, are changing African workplaces through offering continuous
    listening, instant performance information and proactive engagement with employees. The study also explores how AI can
    assist organisations in identifying early disengagement and enable intervention and better employee communication in both
    private and public sector organisations in Africa. At the same time, we address the challenges of socioeconomic development
    and governance posed by AI implementation in developing countries, including digital inequality, infrastructure shortcomings,
    privacy concerns, algorithmic bias, and the risk of workplace surveillance. By situating silent quitting within wider
    debates on digital labour and automation, the paper contributes an African-centred perspective to discussions on the future
    of work and offers practical recommendations for HR professionals, managers, policymakers, and technology developers seeking
    responsible, context-sensitive approaches to workplace transformation across the continent.
- arxiv_id: '2609.14824'
  title: 'ANASSA: An Agentic AI Orchestration Framework for Spatial Intelligence'
  abstract: 'The emergence of large language models (LLMs) and large multimodal models (LMMs) has enabled a new class of agentic
    systems capable of integrating natural language understanding with tool-based execution. In geographic information systems
    (GIS), this shift is transforming traditional, expert-driven workflows into semiautonomous systems that can interpret
    user intent, construct spatial workflows, and execute geospatial analysis tasks. However, existing approaches remain limited
    by fragmented integration of reasoning, execution, and evaluation, particularly in complex, real-world environments. This
    study synthesizes recent advances in agentic GIS frameworks, benchmarks, and surveys to identify limitations in spatial
    reasoning, execution robustness, validation, governance, and evaluation. Building on these insights, it introduces ANASSA
    (Autonomous Neural Agents for Spatial Systems Architecture), an agentic AI orchestration framework that integrates structured
    spatial reasoning, multi-agent workflow orchestration, execution feedback, authoritative spatial validation, provenance,
    uncertainty handling, and human decision authority within a unified system design. The contribution is an architecture-level
    specification: eleven components across four layers, a six-step Geospatial AI Cognitive Loop, cross-component contracts,
    and governance mechanisms intended to make agentic geospatial workflows traceable, reproducible, and accountable. Empirical
    performance evaluation is reserved for implementation and deployment studies.'
- arxiv_id: '2609.17128'
  title: 'FirmCORe: A Benchmark for Structured Reasoning about Inter-Firm Collaboration Opportunities'
  abstract: Comprehensive structured data on inter-firm relationships is often scarce or inaccessible because many relationships
    are privately negotiated, selectively disclosed, and fragmented across proprietary databases. This scarcity hinders the
    discovery of collaboration opportunities, particularly for startups and small and medium-sized enterprises. Firm profiles
    are readily available, but collaboration potential cannot be inferred from business similarity alone, since similar firms
    may be competitors, whereas dissimilar firms may offer complementary products, technologies, channels, capabilities, or
    capital. We present FirmCORe (Inter-Firm Collaboration Opportunity Reasoning), a human-annotated benchmark for pairwise
    reasoning over weakly structured firm profiles, comprising 2,805 labeled firm pairs. Given two firm profiles, a model
    must determine whether the available evidence supports a collaboration opportunity and, for positive pairs, jointly predict
    its strength, primary collaboration type, and role direction. FirmCORe also provides parallel Chinese- and English-language
    evaluation sets containing identical instances and gold labels, enabling controlled analysis of input-language sensitivity.
    Experiments with representative locally deployed and hosted large language models (LLMs) show that the strongest model
    achieves a macro-F1 score of 74.51 for opportunity detection but only 61.57% exact match across all four output fields.
    Language effects vary across models, and high cross-language agreement can mask errors shared across languages. These
    results indicate that current LLMs are substantially more reliable at detecting broad collaboration opportunities than
    at identifying their specific types and role directions.
- arxiv_id: '2609.15794'
  title: 'KnowBench: Effort Reduction as a Unified, Deployment-Grounded Benchmark for Clinical AI'
  abstract: 'Clinical AI systems are evaluated with instruments built for research settings (reference-based similarity metrics
    and expert rubric panels) that measure resemblance to an artifact rather than reduction of a burden. We introduce KnowBench,
    pioneered by Knowtex, whose unifying metric is Effort Reduction (ER): the proportion of system-generated clinical work
    product accepted by the responsible clinician under expert and safety review. ER is defined once and instantiated per
    task across the administrative workload clinical AI automates: visit notes, diagnosis and billing codes, orders, EHR chart
    summarization, patient after-visit summaries, and clinical decision support. In every instantiation the construction is
    identical: the clinician''s review-and-attestation event is the ground truth, every accepted unit is work the system completed,
    and every correction is residual effort returned to the clinician. The primary contribution of this paper is the benchmark
    itself: the metric, its degenerate cases, and a reporting protocol under which ER claims are auditable and cross-system
    comparable. Alongside it we report an initial headline measurement from the documentation instantiation: over one million
    signed encounters across a production window exceeding six months and thirteen medical specialties, Knowtex''s proprietary
    fine-tuned clinical foundation models operating inside a closed feedback architecture achieve an aggregate ER of 97.99%,
    with per-specialty aggregates spanning 96.8-98.9%. This release reports the protocol''s checklist partially, and states
    which companion statistics are withheld; the benchmark is offered so that this figure, and every figure reported after
    it, can be held to the same standard.'
- arxiv_id: '2609.19234'
  title: 'The AR Fairness Metamodel: A Structured Framework for Fairness Measures'
  abstract: This paper presents the AR fairness metamodel, a framework designed to represent, analyze, and compare different
    fairness scenarios. The metamodel considers key elements, such as agents, resources, and their attributes, and enables
    the systematic definition and comparison of various fairness measures. We provide examples involving both discrete and
    continuous measures, including equality, equity, group fairness, individual fairness, the Gini index, the Theil index,
    Jain's fairness index, and a detailed fairness measure for Australia's Child Care Subsidy. We also explore relationships
    among group fairness, individual fairness, and envy-freeness, supported by formal proofs. At the conceptual modeling level,
    our approach builds on the Tiles framework, which offers modular components that can be connected to capture diverse fairness
    definitions. The goal is to make AR-based fairness definitions practical and adaptable across contexts, providing a clear
    way to define, compare, and evaluate them. An implementation of the Tiles framework is available as an open-source tool,
    and can support fairness modeling and evaluation across a wide range of applications.
- arxiv_id: '2609.18878'
  title: 'Preventing Model Collapse: A Fisher-Rao Perspective on the Dynamics of Training with Synthetic Data'
  abstract: Large Language Models (LLMs) are now routinely trained using synthetic data, since high-quality human data has
    been exhausted by the ever increasing needs of larger and larger models. However, recursive training on synthetic data
    frequently induces model collapse, a degenerative feedback loop where models progressively forget the true underlying
    data distribution. Training on a mixture of synthetic and fresh human data is a logical countermeasure and can prevent
    model collapse. However, it is an open question as to what is the exact minimum required ratio of human-to-synthetic data
    to maintain training stability. In this paper, we establish rigorous theoretical guarantees on the minimum rate of human
    data required to prevent model collapse. Although previous work established a formal lower bound for this ratio, such
    bound can be vacuous for very high dimensions, as the analysis relies on the usual Euclidean metric in R^n and is not
    adapted to the space of categorical probability distributions. Instead, in this paper we explicitly leverage the information-geometric
    structure of the probability simplex by analyzing the dynamics of the process under the Fisher-Rao metric. We derive quantitative
    contraction and invariance bounds that are stable and do not become trivial as the dimensions increase. Thus, we show
    that the effective required data ratio to prevent model collapse is different than previously implied.
- arxiv_id: '2609.11244'
  title: 'OmniHallu: Unified Hallucination Detection for Cross-Modal Comprehension and Generation in Multimodal Large Language
    Models'
  abstract: 'While Multimodal Large Language Models (MLLMs) have achieved remarkable progress across diverse tasks, they suffer
    from hallucinations where generated outputs contradict or misrepresent input semantics. Existing research typically addresses
    hallucination detection within a single modality or task type, limiting generalizability. We introduce OmniHallu, a unified
    hallucination detection framework spanning both comprehension and generation tasks across image, video, and audio modalities.
    We contribute OmniHallu-Bench, a 10,000-sample benchmark with claim-level human annotations covering six cross-modal tasks:
    image-to-text (I2T), video-to-text (V2T), audio-to-text (A2T), text-to-image (T2I), text-to-video (T2V), and text-to-audio
    (T2A). Our multi-agent architecture decomposes model outputs into atomic claims, verifies them through modality-specific
    experts, and aggregates evidence via structured reasoning. We further propose a preference-optimized trainable verifier
    that approximates the multi-agent decision boundary, reducing expert calls by 66% with minimal performance loss. Extensive
    experiments reveal a consistent modality-dependent performance gradient and provide fine-grained insights into cross-modal
    hallucination patterns.'
- arxiv_id: '2609.17458'
  title: 'Tables Decoded: DELTA for Structure, TARQA for Understanding'
  abstract: 'Table understanding is a core task in document intelligence, encompassing two key subtasks: table reconstruction
    and table visual question answering (TabVQA). While recent approaches predominantly rely on vision- language models (VLMs)
    operating on table images, we propose a more scalable and effective alternative based on structured textual representations.
    These representations are easier to process, align more naturally with LLMs, and eliminate the need for language-specific
    visual encoders, making them particularly suitable for multilingual documents. We present DELTA, which separates physical
    structure recognition, logical structure recognition, and OCR to extract both layout and content accurately. DELTA outputs
    tables in Optimised Table Structure Language (OTSL), a compact and unified format that encodes cell arrangements and textual
    content. On table structure recognition (TSR), DELTA achieves TEDS- Structure scores comparable with state-of-the-art
    methods across FinTabNet, PubTabNet, and PubTables-1M. We further establish its robustness on non-English tables through
    our curated Hindi benchmark, TORQUE. Building on this, we introduce TARQA, an LLM fine-tuned on OTSL sequences. Our approach
    yields gains of 9.3 p.p. on WTQ (TabQA) and 9.2 p.p. on FinTabNetQA (TabVQA), respectively. On TORQUE, our method ranks
    second among all VLMs and DELTA + LLM variants. We release our code, models, and benchmark at: https://github.com/Tihiitborg/Tables-Decoded'
- arxiv_id: '2609.18056'
  title: 'Position Anchor Tuning: Towards Efficient Adaptation of Pre-Trained Point Cloud Transformers'
  abstract: Parameter-efficient fine-tuning (PEFT) has recently emerged as a pivotal research direction for adapting pre-trained
    point cloud transformers to diverse downstream tasks. Although existing methods achieve excellent fine-tuning performance
    with high parameter efficiency, they ignore inference efficiency. To tackle this problem, a novel PEFT method termed position
    anchor tuning (PAT) is proposed in this paper. As multi-head attention (MHA) and feed-forward network (FFN) are computation-heavy
    blocks in pre-trained transformers, PAT decreases their computational cost through token aggregation-expansion pairs.
    Each pair comprises a token aggregation module (TAM) and a token expansion module (TEM). For MHA and FFN blocks, TAMs
    extract representative tokens from their input tokens based on position anchors in 3D space. These extracted tokens, rather
    than the original input tokens, are processed by the blocks, thereby reducing the number of tokens involved in computation.
    Then, TEMs propagate the learned representations back to the original input tokens. Since TAMs are solely responsible
    for capturing task-specific representations, base-sharing low-rank adaptation (BSLoRA) is further introduced to enable
    them to learn such representations effectively with only a small number of trainable parameters. Extensive experiments
    on widely used benchmarks demonstrate that PAT performs comparably to state-of-the-art methods while incurring significantly
    lower computational overhead and fewer trainable parameters.
- arxiv_id: '2610.00174'
  title: Classification Based on Association Rules Algorithm for Breast Cancer
  abstract: 'Breast cancer is a significant contributor to female mortality across the world, displaying one of the highest
    oc currence rates among the various cancer types. In response to the need for early breast cancer detection, researchers
    have increasingly turned to association rule-based classification as a favored method. Association Rule mining is a data
    mining approach which offers the benefit of yielding results that are readily understandable for medical professionals.
    This paper introduces a novel association rule-based data mining technique for breast cancer classification based on a
    weighted classification approach. This implementation employs three core algorithms: Rule Generation, Rule Pruning, and
    Rule Prediction. Rule Generation identifies frequent itemsets and creates association rules. Rule Pruning eliminates rules
    using specific criteria and separates them into major and minor groups based on their influence on training data. Rule
    Prediction applies the pruned rules to classify test data. The final prediction algorithm was tested on several testing
    samples to show the feasibility and performance of the approach.'
- arxiv_id: '2609.15746'
  title: 'TopoRig: Topology-Agnostic Facial Rigging via Multi-Source Supervision'
  abstract: Automatic facial rigging across heterogeneous mesh topologies remains challenging because high-quality expression
    supervision is often tied to canonical templates, while deformation transfer to arbitrary meshes can introduce geometric
    artifacts and correspondence errors. We present TopoRig, a topology-agnostic facial rigging framework that predicts FACS-conditioned
    deformations directly on input mesh vertices while preserving the original topology. Starting from the ICT FaceKit expression
    model, we construct complementary supervision from accurate but template-biased common-topology rigs, topology-diverse
    but noisier transferred rigs, and targeted image-based cues for controls poorly captured by geometric transfer. TopoRig
    combines local surface geometry, landmark-relative semantic features, global shape context, and FACS controls to predict
    per-vertex displacements. We train on 3,496 generated identities using 45 non-gaze expression controls from the 53-control
    ICT FaceKit vocabulary. On held-out identities and unseen mesh topologies, TopoRig more faithfully reproduces the reference
    expression space than prior neural facial-rigging methods, while qualitative results show consistent localized deformations
    across diverse character geometries. Ablations demonstrate that semantic landmark features and complementary supervision
    improve cross-identity and cross-topology generalization. Overall, TopoRig amortizes heterogeneous and imperfect expression
    supervision into a single topology-preserving deformation model.
- arxiv_id: '2609.22285'
  title: 'ORDER: A Fictitious-World Benchmark for Domain-Adaptive Embodied AI'
  abstract: 'Adapting language models to new domains via continual pre-training raises a basic evaluation problem: if the
    training corpus overlaps with what the model already knows, performance gains cannot be cleanly attributed to new learning
    rather than pre-existing knowledge. This matters most for knowledge-intensive, task-light (KHTL) robot deployments - pharmaceutical
    dispensing, hazardous-material handling, facility-specific protocols, where the physical task is simple but the governing
    rules are proprietary and safety-critical, and where extensive live testing is costly or unsafe. We introduce ORDER (Ontology-driven
    Decision-making for Embodied Reasoning), a benchmark built on a fictitious world: a 342,069-token synthetic corpus defining
    a self-consistent physics that cannot appear in any model''s pre-training data. ORDER pairs a 500-question knowledge test
    (ORDER-BENCH) with a harder compositional task, ORDER-SPATIAL: ordering objects for safe manipulation across both familiar
    and entirely novel scenes. GPT-4.1 without adaptation scores below chance on ORDER-SPATIAL (Kendall''s tau = 0.441), showing
    its priors actively conflict with the invented physics. After continual pre-training, small models improve substantially
    on both familiar and novel scenes alike evidence of genuine world-model induction rather than memorization. We then carry
    this through to a robot pipeline: models that answer the knowledge test well often cannot produce valid, executable plans
    without a further skill-adaptation stage, after which small, fully offline models outperform GPT-4.1 even when GPT-4.1
    is given retrieval access to the same rules (Kendall''s tau = 0.848 vs. 0.606), on a full perception-to-execution loop
    demonstrated on a simulated iiwa7 arm with human-in-the-loop correction. Throughout, ORDER-SPATIAL performance, not knowledge-test
    accuracy is what predicts real plan quality.'
- arxiv_id: '2609.11061'
  title: 'Fork Where the Model Changes Its Mind: Belief-Shift Branching for Tree-Structured Reinforcement Learning'
  abstract: 'Tree-structured rollouts give critic-free reinforcement learning with verifiable rewards (RLVR) step-level credit:
    fork a chain at an intermediate point, and sibling outcome differences estimate step value. Each fork adds sampling cost,
    so realistic budgets typically allow only a few forks per chain. A fork placed where the outcome is already largely settled
    yields siblings that mostly agree and provide almost no credit signal; hence, for a given tree size, where forks are placed
    largely determines how much step-level RL can gain. Most existing mainstream methods place forks by structure, such as
    fixed lengths, midpoints, and delimiters, or by next-token entropy. We formalize fork placement as locating the \emph{pivots}
    of the chain''s value curve, where the expected outcome turns. We propose \emph{belief-shift branching}: read the model''s
    answer belief at candidate boundaries and fork just before the step where consecutive beliefs diverge most. Three instantiations,
    none needing step-level supervision, span access levels: a black-box probe, a logit-lens depth profile, and a learned
    activation direction, which is fit offline and therefore used only in the validation before RL training. The signal only
    \emph{places} forks, and the probe costs about $1\%$ of step compute on mathematics and under $5\%$ on code when it runs
    inside the rollout engine. In that validation, against Monte-Carlo value curves, a belief-shift signal ranks first in
    each of the eight model$\times$benchmark panels, ahead of entropy, structural, and LLM-judge baselines. In RL across three
    model families and two domains, belief-shift forking leads every mathematics aggregate, on OLMo-3-7B by $+2.6$ aggregate
    and $+2.9$ on AIME 2026 over the strongest baseline, and sweeps every OLMo code column, by $+6.5$ on LiveCodeBench-medium.'
- arxiv_id: '2609.11518'
  title: 'Breaking the Central Bias: Spatially Partitioned Experts for Coordinate-Based Neuroevolution'
  abstract: 'Evolvable-Substrate HyperNEAT (ES-HyperNEAT), a bio-inspired indirect encoding that determines neuron placement
    and connection weights from spatial coordinates, exhibits a failure mode on MNIST as a diagnostic benchmark. Because input
    pixels map to a coordinate space centered at the origin, evolved networks converge on a small central cluster of input
    pixels, a spatial-concentration bias; prior work observed only 21% mean accuracy in this regime. Is this bias an optimization
    artifact or an architectural ceiling? Inspired by Mixture-of-Experts (MoE) principles, we partition the input into non-overlapping
    spatial segments, each assigned to a separately evolved specialist network. With 13 such experts, this design reaches
    43% mean accuracy, a 106% relative improvement over the baseline. The architectural gain does not depend on data-driven
    aggregation: equal-weighted averaging, which uses no validation data, already yields a 70% improvement; the gain comes
    from partitioning, not the weighting. Receptive-field analysis shows the mechanism: partitioning forces evolution to discover
    features across the entire image, expanding active pixel coverage from 4% to 79%. Absolute accuracy stays below gradient-trained
    baselines, but the relative gain points to central bias, not the evolutionary search. Two tools are designed to generalize
    beyond MNIST: a receptive-field diagnostic for silent input-coverage collapse, and a spatial-partitioning remedy that
    restores coverage.'
- arxiv_id: '2609.31648'
  title: 'Energy Vision--Language--Action: A Controlled Multimodal Benchmark for Intent-Conditioned Residential Energy Management'
  abstract: 'Vision-Language-Action (VLA) models are studied mainly in robotics, where visual observations and language instructions
    are mapped to physical actions. This paper introduces Energy Vision-Language-Action (EVLA), a controlled multimodal benchmark
    for intent-conditioned residential energy management. EVLA frames battery scheduling as a multimodal trajectory-prediction
    problem in which an RGB energy-field representation, a numerical operating state, and a natural-language objective are
    mapped to a 16-step battery-action trajectory generated by a finite-horizon sampling-based reference generator. Source
    windows are derived from public residential electrical-load data, while electricity price, battery state of charge, indoor
    temperature, and time of day are generated benchmark metadata. A hidden operating regime is encoded only through energy-field
    texture, enabling paired visual changes while the explicit numerical state is fixed. Crossing 439,203 retained base windows
    with three hidden regimes and five language objectives yields 6,588,045 multimodal instances. An initial study evaluates
    36 configurations over three training seeds using fixed subsets of 5,000 training, 500 validation, and 500 test instances.
    In the MobileNet-family comparison, removing processed language increases trajectory mean-squared error from 0.3856 +/-
    0.0039 to 0.8628 +/- 0.0001, whereas removing vision yields 0.3843 +/- 0.0013, comparable to the full model. The results
    show strong asymmetry in modality use: the processed-language pathway is strongly associated with prediction quality,
    while the current RGB pathway provides no aggregate error advantage. These results characterize the fixed pilot subset
    and executed protocol rather than full-benchmark training. EVLA provides a controlled setting for studying how semantic
    intent and latent context influence residential energy-action prediction.'
- arxiv_id: '2609.18565'
  title: Variational Quantum Transformer Architecture for Synthetic Language Generation
  abstract: We propose a compact NISQ-compatible quantum transformer architecture for synthetic QNLP sequence modelling. The
    model preserves the autoregressive next-token interface of a classical transformer, but replaces attention and feed-forward
    sublayers with variational quantum encoder blocks, connector circuits, decoder blocks and a direct two-qubit measurement
    readout. Token contexts are angle-encoded into small quantum registers, processed by parallel variational heads and encoder
    integration circuits and conditioned through decoder ancillae to produce a distribution over a four-token vocabulary.
    We evaluate several architecture variants on deterministic and lexicographic grammar-generation tasks against a compact
    classical transformer baseline. The quantum models are trainable end-to-end and learn nontrivial grammar structure, including
    perfect deterministic generation in individual runs and high lexicographic validity in the strongest variant. The classical
    baseline remains more accurate and stable and the quantum models are sensitive to initialization. The contribution is
    therefore not a claim of quantum advantage, but a concrete architecture and evaluation of transformer-inspired QNLP sequence
    modelling under near-term quantum constraints.
- arxiv_id: '2609.11347'
  title: 'Reification as a Transferable Vocabulary: Zero-Shot Link Prediction with Vanilla GNNs'
  abstract: 'Knowledge graph foundation models such as ULTRA achieve zero-shot link prediction on unseen graphs through dedicated
    architectures that hard-code a transfer mechanism. In this work we move that mechanism out of the architecture and into
    the representation, by \emph{reifying} the input graph: every fact becomes a node, connected to its subject, object, and
    relation type through a fixed vocabulary of six meta-relations, with relation types as anonymous shared nodes rather than
    model parameters. On this representation, five textbook GNNs (GAT, GINE with sum and with mean+max aggregation, GraphSAGE,
    R-GCN), each trained on a single knowledge graph of 4,245 triples for 30 minutes on one NVIDIA A100, transfer zero-shot
    to 40 inductive link-prediction benchmarks. The best of them, an off-the-shelf GAT, matches ULTRA, a dedicated foundation
    model pretrained on three graphs, across ULTRA''s own evaluation suite. The same fixed vocabulary extends to relational
    databases, a row becoming an entity and a foreign-key column a relation type; a preliminary probe on two unseen databases,
    with no cell values, schema text or in-context labels, shows a model of this family pretrained on three knowledge graphs
    ranking foreign-key targets far above random-initialization and degree controls. We release the code, the checkpoints,
    and the evaluation pipeline for all 40 benchmarks.'
- arxiv_id: '2609.15625'
  title: 'FedLTLib: A Comprehensive Benchmark for Federated Long-Tail Learning'
  abstract: Driven by the escalating demand for privacy-preserving computing, Federated Learning (FL) has witnessed remarkable
    progress, becoming a cornerstone technology for bridging distributed data silos in mobile edge networks. However, in real-world
    mobile computing environments, data is generated by heterogeneous mobile devices with varying user behaviors, leading
    to a significant Long-Tail Distribution. Unlike idealized balanced datasets, data in the wild manifests an acute imbalance
    where a minority of head classes dominate the sample space while a vast number of tail classes, often representing rare
    but critical edge-case events, are extremely scarce. This data heterogeneity, which we formally characterize as "Double
    Heterogeneity", referring to the superposition of global class imbalance and local statistical skew, precipitates severe
    performance deterioration on tail classes, thereby spurring the vital research direction of Federated Long-Tail Learning
    (FL-LT). To standardize evaluation and accelerate research in this field, we introduce FedLTLib, a comprehensive benchmark
    tailored for FL-LT. Addressing the critical issues of inconsistent experimental configurations and unfair comparisons
    in prior work, FedLTLib establishes a standardized evaluation framework. The platform not only incorporates diverse benchmark
    datasets reflecting mobile data characteristics but also implements 13 state-of-the-art FL algorithms (4 traditional FL
    algorithms and 9 FL-LT algorithms). By leveraging FedLTLib, researchers can perform fair and reproducible evaluations
    of algorithm robustness and generalization capabilities under a unified experimental protocol, ultimately advancing the
    deployment of robust intelligence in mobile computing ecosystems.
- arxiv_id: '2609.17755'
  title: Evolution of US Oral Political Language
  abstract: The analysis of US political language is usually based on the written form (e.g. presidential addresses) or posts
    broadcasted on various social networks. Oral production, however, which is even more frequent, can better reveal the style
    and mode of thinking of the speaker. This study covers this mode of linguistic communication by considering 19 candidates
    from the presidential elections between 1960 to 2024. Our main research objectives are to disclose the main trends hidden
    in those presidential debates. Do we observe a clear simplification of the US political language over time? Does Trump
    have poor language compared to the other candidates? Do unusual stylistic features occur only with a single, specific
    president? Moreover, can we detect a pattern explaining the success or failure of some nominees? Over time, this study
    demonstrates a significant reduction in political language complexity, a decrease of the mean sentence length, and a noteworthy
    decline of complex terms. Moreover, the emotional tone increases over the decades, while logical and rational thinking
    tends to lessen.
- arxiv_id: '2609.12993'
  title: Investigating Temporal Motion Features for Pose-to-Text Indian Sign Language Translation
  abstract: We investigate the effect of pretrained T5 model scale and explicit motion features on pose-to-text Indian Sign
    Language Translation (SLT) for the WSLP 2026 Shared Task. Pose sequences are projected into the embedding space of T5
    through a lightweight pose encoder, with the complete model fine-tuned to generate English text. The shared task data
    used for this work consists of a test set with 5,334 examples and a validation set with 5,257 examples. We compare T5-small,
    T5-base, and T5-large, and additionally introduce a motion-augmented variant, T5-small + Motion, that adds explicit frame-to-frame
    pose differences to the input representation. T5-small achieves the best BLEU and ROUGE scores among the spatial-only
    models, while T5-large obtains the highest chrF score. Augmenting T5-small with motion features yields the largest single
    improvement observed in our study, substantially improving BLEU over the spatial-only baseline and making it the strongest
    model overall on this metric. Our submitted system ranked 5th on the official WSLP 2026 SLT testing leaderboard. The source
    code and trained models are publicly available on GitHub and HuggingFace.
- arxiv_id: '2609.17168'
  title: 'HuMemSLAM: Efficient Human-Inspired Semantic Place Recognition for Robust Visual SLAM'
  abstract: Autonomous systems require reliable place recognition for efficient and effective simultaneous localisation and
    mapping (SLAM). Traditional geometric visual SLAM approaches rely on low-level features and geometric consistency, but
    remain vulnerable to perceptual aliasing, where different places appear similar, and perceptual variation, where the same
    place appears different. Although semantic SLAM and modern learned visual place recognition (VPR) methods improve robustness
    under challenging perceptual conditions, real-time deployment requires both high retrieval accuracy and low latency. Inspired
    by human memory and perception, we propose HuMem-VPR, which exploits the bidirectional relationship between bottom-up
    perceptual evidence and top-down contextual reasoning to achieve high-level place understanding. We further introduce
    HuMemSLAM, the integration of HuMem-VPR with ORB-SLAM3. HuMem VPR achieved the highest aggregate retrieval accuracy on
    the real-image benchmark, competitive accuracy on the CARLA benchmark, and approximately two to three times lower latency
    than the evaluated state-of-the-art VPR methods. Across the evaluated dataset families and online experiments, HuMemSLAM
    substantially improved integrated Recall @1 over ORB-SLAM3's native retrieval while reducing the proposals submitted to
    its geometric backend.
- arxiv_id: '2609.16319'
  title: 'ConGraspXL: Controllable Constraint-Conditioned Dexterous Grasping Motion Synthesis'
  abstract: Dexterous grasping is usually conducted for specific tasks, leading to heterogeneous constraints such as specific
    approach directions, desired contact regions, specified wrist trajectories, and functional hand poses. Our previous work,
    GraspXL, achieves scalable grasping motion synthesis for diverse objects and hand morphologies, while lacking controllability
    for synthesis under such various task-driven constraints. In this paper, we propose ConGraspXL, which extends GraspXL
    with controllable constraint-conditioned grasp motion synthesis that accommodates diverse task-driven constraints and
    their combinations. We introduce a hierarchical constraint formulation, enable flexible constraint composition with a
    masked residual interface, and improve control precision with dynamic hand centers and feed-forward wrist guidance. Without
    losing the strong generalization capabilities of GraspXL, ConGraspXL enables precise and flexible controllability for
    various individual constraints and their combinations, providing a plug-and-play low-level grasp controller for downstream
    applications such as whole-body grasp completion, functional grasping, and human-motion imitation.
- arxiv_id: '2609.14473'
  title: 'PuzzleMate: Benchmarking MLLMs for Egocentric Puzzle Assistance'
  abstract: Personal AI assistants hold the potential to evolve from digital interfaces into embodied companions capable of
    guiding users through complex physical activities. For these assistants to become integral to daily life, they must do
    more than identify objects; they must provide precise, step-by-step instructions that align with a user's real-time progress.
    While Multimodal Large Language Models (MLLMs) show promise in general visual understanding, their ability to deliver
    grounded, sequential guidance for fine-grained manipulation tasks remains largely unverified. In this paper, we choose
    the jigsaw puzzle as a strategic testbed for this capability. Unlike general object recognition, puzzle solving demands
    high-precision spatial reasoning, the ability to distinguish between minute geometric variations, and a rigorous adherence
    to sequential logic. We investigate this capability through PuzzleMate, a novel framework focused on jigsaw puzzle solving
    captured through an egocentric viewpoint. We deploy PuzzleMate in a user-in-the-loop study to evaluate how well state-of-the-art
    MLLMs perceive the current puzzle state and generate actionable next-step instructions. Our analysis reveals seven key
    bottlenecks that limit their effectiveness. Building on these insights, we propose a benchmark that enables systematic
    evaluation of MLLMs' reasoning capabilities for puzzle solving. Our findings reveal a substantial performance gap in current
    models like GPT-5.2 and Gemini-2.5-Pro; while these MLLMs are highly capable, they struggle to navigate the intricate
    reasoning and sequential logic essential for jigsaw puzzle assistance.
- arxiv_id: '2609.18068'
  title: 'From a River in Gilead to the Inference Distributions of Large Language Models: Covert Dialect Bias and Linguistic
    Profiling at Scale'
  abstract: 'Large language models (LLMs) are increasingly deployed in high-stakes domains such as housing screening. While
    alignment techniques mitigate explicit racial bias in generated text, they often leave covert attitudinal associations
    in internal probability distributions untouched. Adapting the matched-guise sociolinguistic paradigm, we examine covert
    dialect bias in housing-related social judgments across four varieties: Standard American English (SAE), African American
    Vernacular English (AAVE), Nigerian Standard English (NSE), and Nigerian Pidgin (NP). AAVE reflects the racialized dialect
    studied in prior covert-bias evaluations, whereas NSE and NP represent Black African, postcolonial varieties absent from
    this literature. Using 260 meaning-matched sentence quadruples and log-probability scoring over housing-relevant adjectives,
    we probe ten open-weight LLMs across three contexts varying in social proximity: tenant screening, neighbor acceptance,
    and roommate selection. Across all ten models, AAVE and NP are consistently associated with more negative adjectives than
    SAE, with NP penalized most severely. Crucially, each dialect is penalized via distinct stereotype clusters rather than
    a generic non-standard category. NSE, which carries institutional prestige, displays a context-dependent shift: favored
    over SAE in formal tenant screening but increasingly penalized as social proximity grows. Our findings reveal that LLMs
    inherit covert dialect bias along both racial identity and prestige dimensions, echoing documented human housing discrimination
    and demonstrating its reach across postcolonial English varieties.'
- arxiv_id: '2609.11873'
  title: 'The Last AI Built by Humans: Toward Genuine Recursive Self-Improvement'
  abstract: 'Recursive self-improvement (RSI) enables AI systems to turn experience and feedback into persistent changes that
    improve both their capabilities and the process of future improvement. We first use the Headroom-Closed Index (HCI) to
    reveal the problems of existing LLMs, then introduce the RSI concept and its development roadmap: from improvement-execution
    autonomy, improvement-strategy autonomy, experience-acquisition autonomy, and environment-adaptation autonomy, to recursive
    meta-improvement. Next we examine RSI across scenarios (e.g., scientific discovery, embodied intelligence, software engineering),
    highlighting their distinct requirements and development speeds. Drawing on diverse industry practices and preliminary
    empirical evidence, we connect RSI research with practical systems and identify key challenges to achieving genuine RSI.'
- arxiv_id: '2609.13665'
  title: 'MARC: Morphology-Aware Regression of Consensus for Cell Segmentation in Subcellular Spatial Transcriptomics'
  abstract: Accurate cell segmentation remains a major bottleneck in subcellular spatial transcriptomics (SST), in which morphological
    images and spatially resolved RNA transcripts are used to partition tissues into individual cellular instances. As segmentation
    serves as the foundation for constructing cell-level representations, boundary errors can lead to incorrect transcript
    assignments and compromise downstream analyses. However, reliable ground-truth boundaries are unavailable because they
    must be inferred from incomplete morphological and transcript signals. Furthermore, manual annotation of a large number
    of cells is time-consuming. Agreement among complementary segmentation methods provides a practical surrogate for identifying
    well-supported and ambiguous regions, but explicit consensus construction requires executing multiple computationally
    intensive pipelines. In this study, we propose MARC (Morphology-Aware Regression of Consensus), a framework that predicts
    a multi-method consensus-support map for SST segmentation. MARC is trained with leave-one-method-out consensus pseudo-targets
    and a Foreground-Union Consensus Loss that focuses supervision on candidate and consensus foreground. We evaluated MARC
    on 4,642 held-out tiles from Xenium kidney tissue, achieving a mean Dice score of 0.90, a mean intersection-over-union
    of 0.82, and a mean cell-level Spearman correlation of 0.79 against explicitly computed cross-method consensus maps. We
    demonstrate that the predicted consensus maps localise weakly supported regions while preserving consensus-based rankings
    and identifying low-consensus cells for manual review. These results show that MARC closely approximates explicit cross-method
    consensus without multi-method inference and therefore has the potential to facilitate robust, consensus-aware evaluation
    of cell segmentation in large-scale SST studies.
- arxiv_id: '2609.15152'
  title: 'PACE: Progressive Angular-to-Norm Contrastive Embedding'
  abstract: Multimodal embedding models encode heterogeneous inputs into a shared embedding space, enabling efficient similarity
    computation across modalities and tasks. Most existing methods optimize cosine-based contrastive objectives, which promote
    stable training but restrict semantic compatibility to angular geometry, precluding embedding norms from serving as an
    additional semantic signal. However, directly optimizing the more expressive dot-product similarity, which leverages both
    angular and norm information, underperforms cosine-based training and exhibits unstable training dynamics. We attribute
    this discrepancy to premature optimization-space expansion, manifested as angular--norm entanglement and directional anisotropy
    in the representation space and further compounded by full-parameter fine-tuning. In this paper, we propose PACE, a two-stage
    framework that progressively expands both the representation and trainable parameter spaces. Stage I combines cosine-based
    objective with low-rank adaptation to establish a reliable angular geometry within constrained optimization spaces. Stage
    II switches to dot-product similarity and full-parameter fine-tuning, enabling embedding directions and norms to jointly
    encode semantic information. We further introduce Focal Embedding Loss, a confidence-adaptive objective that downweights
    queries with high positive retrieval confidence while emphasizing ambiguous queries with competitive negatives. Experiments
    across multiple backbone scales and diverse multimodal embedding tasks consistently validate the effectiveness of PACE.
- arxiv_id: '2609.35791'
  title: 'FD-VAD: Semantic Endpoint Detection for Streaming Full-Duplex Speech'
  abstract: Natural turn-taking in full-duplex voice interaction requires determining from partial speech whether a pause
    reflects hesitation or a completed conversational intent. Acoustic voice activity detection lacks this semantic information,
    while cascaded ASR-based endpointing introduces transcription dependence and additional processing stages. We formulate
    semantic endpoint detection as a causal audio-language reasoning task and introduce FD-VAD, an ASR-free streaming endpointer
    that maps bounded causal audio windows directly to Continue/Stop decisions. FD-VAD combines a frozen speech encoder with
    a lightweight modality adapter and a parameter-efficiently adapted language model, using a last-chunk training objective
    for streaming inference. We further introduce confidence-gated endpoint commitment to control interruption versus delay
    and boundary-focused hard-negative sampling to improve decisions around ambiguous turn boundaries. Across in-domain and
    conversational evaluations, FD-VAD outperforms strong streaming and non-streaming semantic turn classifiers, and achieves
    the highest EOT recall among qualifying systems on TurnBench dev set $0.853$ (at FP<=0.10) in a zero-shot setting. These
    results show that semantic endpointing can be performed directly from streaming audio without intermediate ASR or dialogue
    state tracking.
- arxiv_id: '2609.14530'
  title: Sharing standardized image-derived data in computational pathology using DICOM
  abstract: Development and evaluation of computational pathology methods require access to large and diverse datasets. Over
    the past decade, various initiatives invested significantly into collecting, centralizing, and sharing pathology imaging
    data. In contrast, sharing of image-derived data such as region-of-interest delineations or segmentation masks is less
    well developed. In this work, we describe our approach to encoding and sharing image-derived pathology data in a standardized
    manner within the National Cancer Institute (NCI) Imaging Data Commons (IDC), a platform that hosts and provides public
    access to de-identified radiology and pathology data. The IDC relies on the Digital Imaging and Communications in Medicine
    (DICOM) standard for data harmonization, yet the adoption of DICOM for pathology image-derived content has remained largely
    unexplored until now. Here, we present five representative datasets harmonized by conversion from their original representations
    into DICOM and shared publicly in the IDC. We demonstrate the benefits of this harmonization, describe contributions to
    critical open-source tooling, and discuss technical considerations relevant to broader adoption of DICOM for pathology
    image-derived data.
- arxiv_id: '2609.19325'
  title: 'AUDITPLAN: Commit, Then Answer for Auditable Safety Alignment'
  abstract: 'Safety tuning pipelines judge only the final answer, which makes it difficult to distinguish robust refusal from
    two undesirable shortcuts: blanket refusal on benign requests and polished but unfaithful safety rationales that do not
    actually constrain the answer. We propose AUDITPLAN, a single-model plan-then-answer approach where the model first emits
    a compact structured safety plan and then answers conditioned on it. The plan records a threat label, intended action,
    and explicit constraints, enabling machine-checkable auditing while remaining hidden from users at deployment. We train
    this behavior with supervised fine-tuning followed by reinforcement learning with FAITHGATE, a reward-gating objective
    that grants answer reward only when the safety plan is correct. This discourages safe-looking but unfaithful behavior
    and promotes tighter plan-answer coupling. Across Qwen backbones, AUDITPLAN improves both robustness and auditability:
    on Qwen2.5-3B-Instruct, FAITHGATE reduces ASR from 24.0% to 11.6%, LSR from 1.0% to 0.36%, and over-refusal from 11.0%
    to 2.0%, outperforming answer-only RL, free-form explanation, and weighted-sum structured rewards. Similar trends hold
    for Qwen2.5-1.5B-Instruct. Larger-model confirmation runs on Qwen-3-4B-Instruct and Qwen2.5-7B-Instruct preserve the same
    trend suggesting that explicit internal commitments can make safety alignment more faithful, robust, and auditable.'
- arxiv_id: '2609.15067'
  title: 'Rethinking Procedural Audio Pre-training: Source Scaling and Objective Adaptation'
  abstract: 'Procedural audio has emerged as a viable source for transferable audio representation learning, but its design
    principles remain unclear.We revisit two questions: how a procedural source should be scaled, and whether training choices
    developed on natural audio should transfer unchanged to procedural data.Using a controlled source, we separate scale into
    formula-class coverage C and within-class rendering diversity I.Experiments with FDSL and AudioMAE show that these two
    forms of scale provide different benefits and depend on the learning formulation and downstream task. A matched AudioMAE
    study further shows that procedural audio favors low mask ratios (10%--25%), whereas AudioSet-28K favors 50%--75%. Shared-codebook
    analysis reveals lower patch diversity and stronger temporal predictability in procedural audio. These results motivate
    source-aware procedural pre-training, where source scaling and learning configuration are considered jointly.Code is available
    at https://github.com/Cross-Innovation-Lab/Formula-Bank.'
- arxiv_id: '2609.16099'
  title: 'SWB-DM: A Calibrated Sliced-Wasserstein-Barycenter Aggregator with Delayed-Momentum Caching for Byzantine-Robust
    Federated Learning under Partial Participation'
  abstract: 'Robust aggregation methods for federated learning quietly rest on a fragile assumption: that whoever shows up
    in a given round is a fair sample of the full population. In practice, they rarely are. When only a handful of clients
    participate per round, even a modest fraction of adversaries can dominate that sample and silently invalidate the finite-sample
    guarantees that coordinate-wise median, Krum, Bulyan, and trimmed mean all depend on. We introduce SWB-DM to address this
    directly. SWB treats each slice of a client update as a one-dimensional distribution, computes a trimmed Wasserstein barycenter
    across clients, and recovers coordinate identity via a medoid-based gauge-fixing step -- a heuristic we developed and
    do not claim it belongs to standard optimal-transport theory. DeMoA-style delayed momentum then caches updates across
    the full client population each round, decoupling robustness from whoever happened to be sampled. Trim ratio calibration
    is not cosmetic: under-trimming causes collapse at corruption levels a properly calibrated model survives. Across 448
    CIFAR-10 configurations, plus CIFAR-100, FEMNIST, and a 500-client scalability run, we find several mechanistically distinct
    failure modes. Even-sample coordinate-wise median degrades to a deterministic wrong answer. Krum silently violates its
    own n greater than 2f+2 precondition and diverges without warning. Bulyan''s n greater than or equal to 4f+3 threshold
    produces a sharp pass/fail boundary. On attacks, IPM defeats order-statistic defenses -- including SWB -- more reliably
    than ALIE, confirmed through delta-space measurements against a convergence bound. SWB-DM''s cache carries a real warm-up
    cost, but extending all baselines to the same round budget shows its CIFAR-10 gains are disproportionately large. On CIFAR-100,
    FLTrust benefits more -- for reasons entirely unrelated to caching.'
- arxiv_id: '2609.16347'
  title: Multi-Label Proportion Learning for Sea-Ice Type Prediction
  abstract: Sea-ice type prediction is important for climate monitoring, maritime navigation, and decision-making in polar
    regions. The main source of label data for this task is the ice chart, produced manually by ice analysts who interpret
    satellite imagery to delineate ice zones into polygons. Although ice charts are valuable, their production is labor-intensive
    and expensive, motivating recent efforts to automate the process using deep learning. However, deep learning models require
    patch-level (or pixel-level) label data for training, while ice charts provide only polygon-level annotations. As a workaround,
    supervised approaches often create approximate patch-level labels from polygon-level ice chart labels by assigning each
    sample the dominant ice type of its parent polygon. This approach enables supervised training but creates an ill-posed
    learning problem with intrinsically approximate solution. In this paper, we redefine sea-ice type prediction as a weakly
    supervised multi-label proportion learning problem to be able to directly use the polygon-level ice chart labels and avoid
    unnecessary label approximation for improved prediction accuracy. To address this problem, we propose a two-module framework
    where first Multiple Instance Learning (MIL) is used for water--ice classification, and then a multi-label proportion
    learning (MLPL) is introduced for ice-type composition prediction. We further extend this framework with a multimodal
    model that integrates SAR imagery with AMSR2 brightness temperatures and ERA5 reanalysis data through modality-guided
    auxiliary regularization. Evaluated on the AI4Arctic dataset, the SAR-only model reduces MAE by 14.5\% and more than doubles
    mean ice-class F1 over the best supervised baseline. The multimodal model further reduces MAE by 21.5\% and raises mean
    F1 by 41.2\% over the SAR-only model, and by 52.7\% over the supervised multimodal baseline.
- arxiv_id: '2609.13024'
  title: Label-Guided Knowledge Distillation for 3D-CNNs in Action Recognition
  abstract: 'As a key model compression technique, knowledge distillation aims to transfer knowledge from a high-capacity
    teacher model to a lightweight student model for enhancing the latter''s performance. In this work, we reviewed the feature
    knowledge distillation for 3D-CNNs and observed that most feature distillation methods in video analysis are simple adaptations
    of those used in image analysis, often neglecting the differences of video features in the temporal dimension. To address
    this issue, we proposed Label-Guided Knowledge Distillation (LGKD) to guide the distillation of student model features
    using ground truth labels. Our method entails two components: sample-wise distillation and class-wise distillation, enabling
    the student model to learn feature representation of the teacher model at two levels. Sample-wise distillation utilizes
    label information and the teacher''s probability distribution to guide the learning of features that significantly impact
    temporal accuracy while mitigating noise. Meanwhile, class-wise feature distillation employs a prototype network to further
    capture the relational knowledge among samples within the same category, enhancing the student''s ability to learn higher-dimensional
    semantic information and improving model generalization. To demonstrate the effectiveness and superiority of our method,
    we conducted comprehensive experiments on two benchmark action recognition datasets, UCF101 and HMDB51, achieving competitive
    results.'
- arxiv_id: '2609.14886'
  title: 'PeerPen: AI-Assisted Writing for Online Mental Health Peer Support'
  abstract: 'Online mental health communities thrive on peer support, yet those who volunteer to help often lack formal training
    and may struggle to articulate supportive responses. AI co-writing could lower this barrier; however, peer support derives
    much of its value from being perceived as personal, raising questions around authorship, ownership, and trust. We built
    PeerPen, a writing assistance tool embedded within a Reddit-like interface, supporting two main features: draft generation
    and revision of user-written responses. Through semi-structured interviews with 15 participants, we find that PeerPen
    reduced the burden of composing responses and increased confidence in offering support. Participants wanted AI to assist
    their writing without taking over authorship and anticipated tensions around authenticity and trust. Such assistance could
    make authorship uncertain even for responses written without it, weakening trust across the community. We contribute design
    implications for AI writing assistance that scaffolds supportive communication, preserves authorship, and accounts for
    community-level trust.'
- arxiv_id: '2609.17483'
  title: Bridging the Gap Between Homogeneous and Heterogeneous Asynchronous Optimization Is Surprisingly Difficult
  abstract: 'Modern large-scale machine learning tasks often require multiple workers, devices, CPUs, or GPUs to compute stochastic
    gradients in parallel and asynchronously to train model weights. Theoretical results typically distinguish between two
    settings: (i) the homogeneous setting, where all workers have access to the same data distribution, and (ii) the heterogeneous
    setting, where each worker operates on different data distributions. Known optimal time complexities in these settings
    reveal a significant gap, with far more pessimistic guarantees in the heterogeneous case. In this work, we investigate
    whether these pessimistic optimal time complexities can be overcome under different assumptions. Surprisingly, we show
    that improvement is provably impossible under widely used first- and second-order similarity assumptions for any randomized
    algorithm. We then turn to the interpolation regime and demonstrate that the weak interpolation assumption alone is also
    insufficient. Finally, we introduce a minimal combination of irreducible assumptions, strong interpolation and the local
    Polyak-Lojasiewicz condition, to derive a new time complexity bound that matches the dependence on worker computation
    times in the best-known result in the homogeneous setting, without requiring identical data distributions.'
- arxiv_id: '2609.12509'
  title: 'ChitraMiti: Benchmarking Visual Grounding and Modality Reliance in Bengali Geometric Reasoning'
  abstract: Evaluation of vision-language models (VLMs) for multimodal mathematical reasoning remains limited for low-resource
    languages and for geometry problems that require reading a diagram and a question together. We introduce ChitraMiti-12.8k,
    a synthetic benchmark of 12,874 Bengali planar geometry problems paired with structured 15-attribute descriptions, and
    NCTB-500, a complementary set of 500 diagrams manually extracted from Bengali school textbooks. Using a three-phase protocol
    that separates diagram-only, diagram-plus-description, and description-only inputs, we show across five open-weight and
    closed-source VLMs that description-only performance is statistically indistinguishable from diagram-plus-description
    performance, establishing structured descriptions as a sufficient textual proxy for controlled evaluation. Despite this,
    models remain poor at cross-modal verification, frequently misled by a swapped spatial relation even when they answer
    the unmodified item correctly. We further evaluate supervised adaptation on ChitraMiti-12.8k, finding that fine-tuning
    improves performance on both ChitraMiti-1k and NCTB-500, although a substantial gap to the strongest zero-shot model remains.
    Together, ChitraMiti-12.8k, NCTB-500, and our evaluation protocol offer a standardized way to study Bengali multimodal
    geometry reasoning and, more broadly, whether VLMs actually check their text against what they see. Our dataset and code
    are publicly available on Hugging Face at https://huggingface.co/datasets/RaiyanKhaan/ChitraMiti.
- arxiv_id: '2609.14624'
  title: 'TTDF: A Two-Stage Framework for Reliable Surgical Phase Transition Detection'
  abstract: 'Reliable workflow transition detection is important for context-aware surgical assistance and downstream decision
    support. However, online surgical phase recognizers primarily focus on frame-wise accuracy and temporal consistency, rather
    than the reliability of workflow transition events. Directly converting phase changes into events is unreliable: temporal
    jitter and workflow-illegal switches produce false or duplicate events, while persistent, workflow-consistent candidates
    may remain incorrect. To address this limitation, we formulate reliable workflow transition detection as a distinct event-level
    task operating on outputs of a frozen online phase recognizer. We propose the Two-Stage Transition Detection Framework
    (TTDF), a causal framework that progressively filters transition candidates. Transition Candidate Extraction (TCE) first
    applies a minimum-duration requirement and a workflow-graph constraint to remove false candidates caused by temporal jitter
    and phase transitions not allowed by the workflow graph. Specifically, a candidate is retained only if the predicted target
    phase persists for a minimum duration and the ordered phase pair belongs to the workflow graph''s allowed transition set.
    TCE thereby produces a high-recall candidate set without additional training. Transition Candidate Verification (TCV)
    suppresses remaining false candidates using phase-posterior shifts and visual-change cues from frozen DINOv2 features.
    Events are assessed using a phase-pair-aware one-to-one matching protocol. Experiments on Cholec80 show that TTDF reduces
    false transition emissions while preserving recall and controlling decision delay.'
- arxiv_id: '2609.15387'
  title: 'WebCraftBench: Evaluating Web Application Generation from a Software Testing Perspective'
  abstract: 'Human evaluation provides a direct measure of the quality of LLM-generated web applications. However, fitting
    human judgments through automated evaluation remains challenging. Static benchmarks can credit functionality that exists
    in source code but is unreachable at runtime. Interactive benchmarks exercise the application, yet incomplete exploration
    can cause them to miss implemented functionality and confound application defects with agent execution failures. To address
    these limitations, we propose WebCraftBench, an interactive benchmark for evaluating web application generation from a
    software testing perspective. WebCraftBench instruments each generated application and uses code coverage to guide an
    agent in exploring its functionality through user-simulated interactions. It then abstracts the interaction trace into
    a state-transition graph and evaluates the application along three dimensions: visual aesthetics, usability, and requirement
    alignment. By separating exploration from scoring, WebCraftBench collects runtime evidence without constraining exploration
    to predefined acceptance criteria. WebCraftBench comprises 369 real-world user requirements and 5,088 acceptance criteria.
    Evaluation of 17 frontier LLMs reveals distinct strengths across the three dimensions, with no model leading on every
    dimension. On 197 validated sessions sampled from an internal arena, WebCraftBench achieves 85.3\% agreement with human
    preferences, with agreement generally increasing as the score difference between paired applications grows. Further experiments
    show that coverage guidance improves exploration coverage and the model rankings remain stable when the judge model is
    replaced.'
- arxiv_id: '2609.14987'
  title: 'ActGuard: Pre-execution Action Auditing against Indirect Prompt Injection in LLM Agents'
  abstract: 'Large language model (LLM) agents interact with external environments through tool invocation, but tool outputs
    can also expose them to indirect prompt injection (IPI) attacks. Existing defenses mainly rely on prompt hardening, content
    filtering, pre-generated plans, or permission constraints. These approaches often struggle with complex tasks or over-sanitize
    external content, making it difficult to balance security and utility. The key challenge is therefore to preserve execution
    flexibility while precisely identifying and removing the malicious content that actually induces unsafe actions. To address
    this challenge, we propose ActGuard, a pre-execution action auditing framework. Rather than judging whether external content
    is inherently suspicious, ActGuard assesses whether it causes the current action to deviate from a locally reasonable
    expectation. At each step, ActGuard predicts the tools likely to be used by the upcoming action and constructs a local
    tool prior without constraining the execution trajectory. Before execution, it compares the candidate action against this
    prior and performs tool-level contrastive analysis and parameter-level evidence localization to identify deviations in
    tool selection and action parameters. A verifier then examines the localized evidence, masks only spans confirmed as malicious,
    and regenerates the action from the sanitized context. This design preserves legitimate planning flexibility while minimizing
    information loss from indiscriminate filtering. We evaluate ActGuard on challenging benchmarks for tool-using agents.
    Results show that ActGuard reduces attack success rates to a level comparable to state-of-the-art defenses while maintaining
    task utility close to the no-attack setting, achieving a favorable security-utility trade-off. Our code is publicly available
    at: https://github.com/binzhwang/ActGuard.'
- arxiv_id: '2609.15348'
  title: Robust Multi-Model Fitting through Learning Neighbor Regions
  abstract: Multi-model fitting involves fitting multiple models accurately in a noisy environment. It is the basis for computer
    vision tasks such as scene reconstruction and mixed reality. However, its performance is often limited by insufficient
    feature utilization, inefficient optimization, model overlap, and the non-differentiable pipelines. To overcome these
    limitations, we introduce a robust coarse-to-fine framework called Learning Neighbor Regions (LNR). Recognizing that substantial
    computational resources are wasted on numerous bad minimum sets, we propose the coarse-level module. This module utilizes
    a neural network to extract and analyze geometric feature of both local point-wise relationships and global contextual
    information in minimum sets, outputting confidence to pre-select a small number of good minimum sets, thereby enhancing
    overall efficiency before solving hypotheses. To address model overlap, LNR encodes neighbor region features for each
    hypothesis in its fine-level module. These region features consist of geometric features of neighboring data points, which
    can be used by multiple regions simultaneously. This design allows the neural network to individually refine and score
    each hypothesis. Importantly, LNR is trained to learn directly from data point features rather than from the hypothesis
    parameters, thus avoiding differentiating the sampling process and the model solvers. Extensive experiments on four classic
    multi-model fitting tasks demonstrate that LNR achieves state-of-the-art performance. The analysis suggests that LNR can
    be easily adapted to various robust multi-model fitting tasks.
- arxiv_id: '2609.15888'
  title: Anatomical Grounding and Leakage-Aware Multimodal Contrastive Learning for Alzheimer's Disease Classification from
    Structural MRI
  abstract: 'Deep networks trained on structural MRI for Alzheimer''s disease (AD) staging often reach reasonable accuracy
    while attending to anatomically irrelevant regions, and multimodal models that add clinical tables frequently rely on
    variables that were used to assign the diagnostic label in the first place. We study both issues with a deliberately lightweight
    slice-based encoder (ResNet18 with a one-layer Transformer over slices) on 1,075 baseline T1-weighted scans from ADNI-1.
    First, we use FastSurfer segmentations as an anatomical reference: YOLOv8 models trained on segmentation-derived labels
    localize Alzheimer-relevant structures with mAP_50 above 0.96, and a Grad-CAM comparison shows that the image-only classifier
    frequently attends to the skull, orbits and background. Second, we adapt a CLIP-style image - tabular contrastive framework
    and organize ADNIMERGE variables along a label-leakage spectrum. Fusion with cognitive scores yields 87.3% three-way accuracy,
    which we treat as a leakage-driven upper bound rather than an imaging result; fusion with regional volumes yields 73.0%.
    We observe that the choice of contrastive target changes what the image encoder learns: on MCI vs. CN, the image-only
    head reaches 52.4% when the encoder is aligned to cognitive scores and 73.8\% when aligned to volumes, although no tabular
    input is used at inference. Third, restricting the input to a per-subject crop of the medial temporal lobe raises image-only
    three-way accuracy from 58.7% to 65.1%. All results come from single runs on a small balanced test set, and we report
    confidence intervals and the protocol differences that prevent direct comparison with published numbers.'
- arxiv_id: '2609.12422'
  title: Hierarchical Belief Modeling for Zero-Shot Opponent Adaptation in Partially Observable Multi-Agent Navigation
  abstract: Lux AI Season 3 requires agents to act under partial observability, randomized episode level dynamics, and a best
    of five match structure that rewards both tactical execution and fast adaptation. We present HORIZON, a hierarchical agent
    that combines symmetry aware spatial perception, dual memory belief tracking, relic centric graph attention, information
    gain driven exploration, and an opponent conditioned policy mixture. HORIZON separates short horizon control from cross
    match meta reasoning, while auxiliary belief and world model objectives stabilize learning. Trained with PPO in a large
    scale JAX simulator, the resulting agent explicitly infers hidden game parameters and opponent style. Experiments show
    consistent gains in match win rate, episode win rate, adaptation gain, and league rating over strong recurrent and feed
    forward baselines.
- arxiv_id: '2609.17064'
  title: Neuro-Symbolic Hierarchical Intention Anticipation in Human Behavior
  abstract: Assistive autonomous systems must anticipate human goals before an observed behavior is complete. This article
    formulates anticipation as goal inference from a partially observed multimodal episode together with structured prediction
    of the remaining behavior, rather than exact motor forecasting. A compact Hierarchical Planning Decoder (HPD) is attached
    to a frozen neuro-symbolic recognition encoder and predicts, at four ontological levels, the next actions, the remaining
    activities and low-level intentions, and the episode high-level intention(HLI). The decoder is trained with soft neuro-symbolic
    regularization combining transition-coherence and hierarchical continuity losses, and is decoded with hard reachability
    masks that enforce ontological validity at inference. On a compositional four-level benchmark of 15,002 multimodal episodes
    built over NTU RGB+D 120 features, three headline properties are observed together. The advantage over the strongest sequential
    baseline grows with the anticipation horizon, from +1.7 points at step 1 to +7.3 points at step 3 (top-5). Under compositional
    generalization, where one parent association per multi-parent low level intention is held out, this advantage widens to
    +4.9 points at step 1. At the episode level, 96.8% of anticipated trajectories satisfy the joint logic constraints, above
    the 88.1% strongest-baseline value and the 73.9% ground-truth floor; soft logic terms alone account for a 59.8 to 71.1%
    relative reduction of HLI-reachability violations, and the hard masks then eliminate them entirely. Neural generation
    supplies predictive ranking, symbolic constraints supply onto logical validity, and their combination yields coherent
    hierarchical anticipation while exposing remaining challenges in compositional goal generalization and unordered set prediction.
- arxiv_id: '2609.15834'
  title: 'TRACE: Two-Stage Detector-Response Estimation With Angular Cosine Expansion for Ring Artifact Correction in Photon-Counting
    CT'
  abstract: Detector response nonuniformity introduces systematic projection errors and ring artifacts in photon-counting
    detector computed tomography (PCD-CT). In measured PCD-CT data, residual stripe amplitudes vary slowly with projection
    angle, which fixed-bias models cannot adequately capture. We propose TRACE, a two-stage unsupervised sinogram decomposition
    method for estimating and correcting these response-related errors. TRACE represents stripes as a fixed bias plus low-order
    discrete cosine transform (DCT) components, using a small number of coefficients to describe angular variations at each
    detector element. A learnable analysis--synthesis architecture represents the ideal projections, while two-stage optimization
    separates them from fixed and then dynamic stripes. An angular-gradient soft orthogonality constraint suppresses correlated
    variations within the shared DCT gradient subspace, reducing the leakage of object structures into the artifact estimate.
    All parameters are optimized directly on the measured sinogram without paired training data. Experiments on measured QRM
    mouse phantom and porcine trotter data show that TRACE suppresses ring artifacts and improves image uniformity while preserving
    edge sharpness, soft-tissue texture, and trabecular detail.
- arxiv_id: '2609.12322'
  title: 'Affective Agent: On-Device Personalized Intervention Reasoning for Wearable Systems'
  abstract: Affective computing has advanced wearable state inference, but on-device reasoning about whether, when, and how
    to intervene remains challenging. We present Affective Agent, a three-layer reference architecture for personalized intervention
    reasoning under uncertainty on wearable-class hardware. It combines a compact sub-billion-parameter language model with
    physiological evidence, context, and user history to decide whether, when, and how to intervene, without cloud dependency
    or per-user retraining. The architecture is organized into three interacting layers (perception, personalization, and
    reasoning), adapting to individual users through host-managed structured memory evolution rather than per-user weight
    updates. We instantiate Affective Agent in indoor environmental quality control and evaluate it on held-out, simulator-generated
    longitudinal scenarios spanning physiological variation, context, signal quality, and intervention history. Results show
    that memory-driven personalization and two-pass structured reasoning improve intervention decisions within this synthetic
    evaluation. By moving the decision layer on-device, this work demonstrates a path from wearable state inference toward
    closed-loop, personalized intervention on wearable-class hardware.
- arxiv_id: '2609.15523'
  title: Automating Attack Graph Construction for Agentic Pentesting. Towards Neuro-Symbolic Vulnerability Hunting
  abstract: 'Logic attack graphs grounded in scanner output provide explicit and auditable attack path reasoning LLM-based
    agents lack. Integrating symbolic frameworks such as MulVAL to contemporary security workflows or agentic pipelines, however,
    requires translating scanner evidence to initial facts, and creating domain-specific rules. We present a semi-automated
    pipeline that addresses this interoperability problem and depict its feasibility in a web-security case study. Our pipeline
    parses findings from Trivy, Semgrep, and Nmap into MulVAL predicates and uses an LLM-assisted process to construct domain-specific
    Datalog rules linking scanner-detectable evidence to attack techniques. MulVAL/XSB then performs symbolic inference to
    generate structured attack paths. We evaluate the attack-graph construction infrastructure on 54 web Capture-the-Flag
    tasks from CyBench within an agentic pipeline (Hybrid Reasoner); we do not evaluate the performance of the downstream
    agent. Every task produced at least one goal-reaching graph, and we achieve mean ground-truth vulnerability coverage of
    53.7%, with 51.9% achieving full coverage; mean noise-path rate was 83.9%. With median end-to-end time of 24.9 s (MulVAL
    reasoning: 2.7 s) the pipeline is feasible and runtime-practical for agentic workflows, but predicate coverage, rule coverage,
    and path precision remain limiting factors. Next steps include semantic rule validation and agent-level comparison for
    graph-guided pentesting.'
- arxiv_id: '2609.14247'
  title: What Input Resolution Is Required for Bird Species Identification, and What Is Its Latency Cost on an Edge Device?
    A Study of 14 Input Resolutions and Six Architectures with On-Device Measurements
  abstract: 'Bird-strike mitigation at wind farms requires identifying distant birds that span only tens of pixels, so the
    classifier''s input resolution N is a design variable, not a fixed specification. We study it with a factorial design
    over 14 side lengths N (16 to 224), six architectures, two training and evaluation regimes and 30 random seeds -- 2,520
    checkpoints and 5,040 evaluations -- plus latency measured on an NVIDIA Jetson Orin Nano. Four results. (1) The selected
    N depends on the target: 0.90 is met on validation by ResNet50 at N=112 in an estimated 1.85 ms (0.8980 on test) and 0.95
    by DINOv2-L at N=144 in 12.70 ms; changing the model buys more accuracy than raising N (+5.93 versus +2.33 points at N=112).
    (2) The benefit of lowering N depends on the assumed preprocessing path: N=224 -> 80 saves 13.5% when each individual
    is decoded from its own file but 46.2% when the detector decodes the 4K frame once; the Pareto set grows from 20 to 23
    configurations. (3) Accuracy must be measured on the deployed engine: half precision costs ViT-S/16 alone 4 to 7 points
    at N>=96 while the CNNs stay within 0.1 points, and with selection held at validation the choice differs at 26 of 176
    targets. A broken FP16 engine can run faster than a correct one, undetectable from latency; admitting 14 ViT-S/16 FP32
    configurations moves the recommendation over the 0.931-0.938 band and under the 10 ms budget. (4) ViT-L-scale models fit
    this device, but activations exceed the FP16 range; splitting the graph at transformer-block boundaries confines FP32
    to the affected segments, making the deployed DINOv2-L chain 1.85x faster than the single-engine build. We also quantify
    how the regime-difference sign stabilises with seed count; a sensitivity split removing some forms of group sharing preserves
    all 14 non-trivial signs at the selection boundary.'
- arxiv_id: '2609.14654'
  title: 'Evaluating Contextual Bias in CNN Image Classification: Evidence from Agricultural Benchmark Datasets'
  abstract: 'Convolutional neural networks (CNNs) are typically evaluated using held-out classification accuracy, an approach
    that presupposes predictions are based primarily on the intended object of interest rather than incidental surrounding
    context. We test this assumption in CNN-based agricultural image classification by comparing model performance on original
    images with performance on background-dominated patches extracted from the same images across eight publicly available
    agricultural benchmark datasets and four widely used CNN architectures. Background-dominated patches were classified above
    dataset-specific random chance for six of the eight datasets, and substantially above chance for four of them, indicating
    that contextual information contributes to model predictions for the majority of datasets evaluated. For these four datasets,
    we further evaluated whether this behavior reflected genuine class-discriminative information or was primarily attributable
    to class imbalance using macro-averaged precision, recall, and F1 together with class-balanced test subsets. The results
    show that contextual reliance does not admit a single explanation: class imbalance accounts for a substantial portion
    of the observed signal for some datasets and architectures, whereas above-chance contextual classification persists after
    balancing for others. Together with previous evidence from curated object recognition and cancer pathology imaging, these
    findings support the growing view that contextual bias is a recurring characteristic of CNN-based image classification
    rather than a phenomenon confined to a single application domain. More broadly, this work provides a systematic framework
    for quantifying contextual bias across heterogeneous image datasets by combining dataset-specific random-chance baselines,
    contextual bias categorization, macro-averaged evaluation, and class-balanced robustness analysis.'
- arxiv_id: '2609.15418'
  title: 'ViCo-SAM3: Vision-Conditioned Alignment for Open-Vocabulary Camouflaged Object Segmentation'
  abstract: Open-vocabulary camouflaged object segmentation (OVCOS) aims to segment unseen camouflaged objects under text
    guidance. We observe that SAM3 still suffers from a pronounced semantic gap between global textual semantics and fine-grained
    pixel-level visual cues in OVCOS. Meanwhile, fully fine-tuning the text encoder introduces heavy parameter overhead and
    risks overfitting to training categories, which compromises open-vocabulary representation flexibility. To address these
    issues, we propose ViCo-SAM3, a Vision-Conditioned alignment framework designed for OVCOS. Specifically, we introduce
    vision-conditioned (ViCo) module, which dynamically modulates text embeddings with global visual context, enabling textual
    representations to adapt to the current image content and thereby effectively bridging the semantic gap between vision
    and text. Building on this, we further design a vision-conditioned cross-modal binding (ViCoBind) module to enhance cross-modal
    interaction and semantic alignment between visual and textual representations. Without bells and whistles, ViCo-SAM3 achieves
    state-of-the-art performance on the OVCamo benchmark and demonstrates strong generalization.
- arxiv_id: '2609.12684'
  title: 'Generative AI Use Cases In Real Estate Marketing: Adoption and Constraints in Germany'
  abstract: 'Generative artificial intelligence (GenAI) is changing how work is organized and performed. Real estate marketing
    is a prime example of this, yet evidence of GenAI in real estate agents'' day-to-day practice remains scarce. In this
    work, we report on our insights from a German-based empirical study with eleven semi-structured interviews. GenAI is already
    utilized across different activities, with marketing communication being the most prominent. Concrete use cases are emergent
    and unevenly adopted, with writing expos\''e texts being the only widely established one. Interaction is predominantly
    human-in-the-loop: GenAI drafts, structures, and retrieves, while real estate agents curate, verify, and decide. Constraints
    stem less from model capability than from integration with listings and documents, data availability, and compliance in
    sensitive tasks. The study contributes a grounded map of existing and potential use cases and identifies tentative practical
    implications for adoption.'
- arxiv_id: '2609.12356'
  title: 'When Connected Does Not Mean Similar: Charting the Homophily Boundary of SNAP-KG for Streaming Entity Integration'
  abstract: SNAP-KG is a framework for assigning newly arriving entities to semantic communities in a growing knowledge graph
    (KG) using only their raw features, with no graph access and no retraining at inference time. It was evaluated on five
    multi-view benchmarks and a 2.4M-node OGB-WikiKG2 KG. In each of these datasets, at least one graph view is homophilous,
    meaning that connected nodes usually belong to the same class, and SNAP-KG performs well on all of them. This paper asks
    what happens outside that setting. We extend the evaluation to three heterophilous graphs (Texas, Wisconsin, Chameleon)
    and measure the edge homophily of every view. When no homophilous view is available, clustering quality drops sharply
    for both SNAP-KG and the transductive baselines used in its original evaluation. What decides this is the homophily of
    the relation, not the number of relations. Multi-view fusion still helps, but only when at least one homophilous relation
    provides a reliable foundation. The homophily assumption is therefore shared by the whole method family, not specific
    to SNAP-KG. We argue that heterophilous multi-view clustering is a separate research problem, outside the scope of this
    work. As future work, we outline how a heterophily-aware teacher could be distilled into SNAP-KG's projector to serve
    both homophilous and heterophilous KGs.
- arxiv_id: '2609.11758'
  title: 'RAG-Safety-Bench: Reliable Evaluation of Retrieval-Augmented LLM Safety'
  abstract: Allowing large language models (LLMs) to retrieve information from a set of trusted documents can increase reliability
    and reduce hallucination. However, recent work has demonstrated that retrieval-augmented generation (RAG) can have unintended
    side effects on the overall safety of the generated responses, when prompted for harmful or dangerous content. A clearer
    understanding of the mechanisms leading to this result is needed, as increasing numbers of end users turn to RAG to incorporate
    corporate documents and knowledge bases into LLM-based systems. We introduce RAG-Safety-Bench, a benchmark to measure
    the safety impact of RAG on LLM models. By removing the confounding effect of retriever quality, and cleanly separating
    the problem into four conditions -- non-RAG, RAG with an oracle document containing the answer to the harmful request,
    RAG with documents related to the harmful request but without the specific answer, and RAG with random, safe documents
    -- the benchmark isolates the impacts of different factors in the observed safety degradation. We report results across
    five open-source LLMs, showing an inverse relationship between benign and unsafe capability, strong evidence that baseline
    safety guardrails do not lead to downstream safety guarantees in the RAG case, and model-specific support for previous
    findings that even benign documents can lead to unsafe generation in retrieval-enabled systems.
- arxiv_id: '2609.16946'
  title: High-Fidelity Video Quality Assessment with VQA-Specific Saliency
  abstract: No-reference video quality assessment (NR VQA) has recently seen promising progress with deep learning. However,
    video data is inherently large, and processing them with deep models incurs high computational cost. This challenge is
    particularly acute in VQA, where preserving original-resolution cues and dense temporal information is critical for accuracy.
    Existing efficiency-driven preprocessing strategies, such as fragmenting, reduce computation but alter the input data
    distribution, limiting effective reuse of pretrained video foundation models (ViFMs). To address these challenges, we
    propose \textbf{H}igh-\textbf{F}idelity \textbf{V}ideo \textbf{Q}uality \textbf{A}ssessment (\textbf{HFVQA}), a framework
    built on fixed-size spatio-temporal (ST) patches that is fully compatible with pretrained ViFMs. HFVQA samples ST patches
    across multiple scales, including the original resolution, with minimal temporal subsampling to preserve low-level quality
    cues and semantic context. To limit computation, HFVQA introduces a lightweight auxiliary network trained end-to-end with
    the ViFM encoder to learn \textit{VQA-specific saliency}. Distilled directly from quality supervision, this saliency captures
    task-specific importance patterns, reflecting that video quality perception is dominated by a small subset of spatio-temporal
    regions. By combining high-fidelity spatio-temporal cues with learned, task-specific saliency, HFVQA achieves SOTA performance
    on standard NR VQA benchmarks while processing as little as 12\% of candidate ST patches, making high-fidelity ViFM-based
    VQA computationally tractable.
- arxiv_id: '2609.11155'
  title: 'DRG-MAPPO: Hierarchical Dynamic Role-Graph Multi-Agent Reinforcement Learning for Cooperative Air Combat'
  abstract: 'Multi-Agent Reinforcement Learning (MARL) has emerged as a pivotal paradigm for complex decision-making in autonomous
    systems and air combat. While MARL has demonstrated significant potential in air combat, achieving sophisticated tactical
    coordination remains a non-trivial challenge. This difficulty is largely attributed to two primary limitations: (1) the
    absence of structured relational modeling hinders agents from capturing complex, time-varying interactions among battlefield
    entities; and (2) conventional flat architectures often lack the capability to explicitly model tactical roles, leading
    to ambiguous task allocation in highly dynamic environments. To address these challenges, we propose Hierarchical Dynamic
    Role-Graph Multi-Agent Proximal Policy Optimization (DRG-MAPPO), a novel MARL framework that integrates graph-based relational
    modeling with dynamic role assignment. Specifically, DRG-MAPPO constructs a graph-based representation of battlefield
    interactions and leverages graph attention mechanisms to extract critical relational features among allies, enemies, and
    threats. Subsequently, a high-level policy employs a dynamic role assignment mechanism to determine tactical responsibilities
    (e.g., ``leader'''' and ``supporter''''). Conditioned on these roles and encoded graph-relational features, a low-level
    policy executes discrete maneuver actions, facilitating the joint optimization of tactical strategy and collaborative
    execution. Furthermore, a target-priority auxiliary task is designed to foster the emergence of behaviors such as focus-fire.
    Experimental results demonstrate that DRG-MAPPO achieves a state-of-the-art win rate of 87%, suggesting that our framework
    effectively balances relational modeling, interpretability, and optimization stability for cooperative air combat.'
- arxiv_id: '2609.12898'
  title: 'UniPart: Towards Zero-shot Language-Grounded 3D Part Segmentation for Embodied Interaction'
  abstract: Fine-grained robotic manipulation depends on understanding parts, not only whole objects. Existing 3D foundation
    models tend to be either generalized but object-aware, or part-aware but limited to closed-set taxonomies, which weakens
    zero-shot transfer. We study text-conditioned 3D part segmentation, where a free-form phrase selects a functional part
    on point cloud. We introduce UniPart, a feed-forward cross-modal 3D Transformer that conditions CLIP text embedding. To
    scale supervision, we build LangPart-1M with 160K+ Objaverse assets and 8M text to part pairs using multi-view consistent
    part generation. We further manually label a high-quality subset, LangPart-4K, for fine-tuning and evaluation. UniPart
    achieves strong zero-shot results on open-vocabulary part benchmarks and transfers to language-conditioned part grasping
    in real world.
- arxiv_id: '2609.16461'
  title: 'Protocol-Preserving Context Trimming for Agentic Workflows: Benefits, Failure Regimes, and Budget Guardrails'
  abstract: Agentic large language model (LLM) systems rely on long interaction histories to preserve instructions, tool states,
    intermediate decisions, and unresolved dependencies, but unrestricted context growth increases computational cost and
    can reduce efficiency. This study evaluates protocol-preserving context trimming as a reliability-constrained approach
    for multi-step agentic workflows. Five trimming strategies - recency-based, relevance-based, summarization, protocol-aware
    trimming, and adaptive budget guardrails - were compared across retained-context levels and workflow-complexity classes
    using task success, protocol adherence, valid tool calls, token savings, latency reduction, cascading failures, and critical
    context thresholds. Conventional strategies achieved about 60% mean token savings but lower task success (66.6-77.3%)
    and protocol adherence (85.5-88.6%). Protocol-aware trimming improved task success to 92.2%, while adaptive guardrails
    achieved 96.0% task success, 96.3% protocol adherence, and 1.0% cascading failure with 56.0% mean token savings. Retained-context
    budgets of 25% or less increased failure odds 10.92-fold relative to budgets of 50% or more (p < 0.001). Protocol-aware
    trimming produced 5.24-fold greater odds of successful completion than conventional methods under aggressive budgets,
    while adaptive guardrails further increased success odds 2.11-fold versus fixed protocol-aware trimming (p < 0.001). Critical
    context thresholds also increased with workflow complexity. These findings indicate that reliable context reduction depends
    more on preserving protocol-critical state than on maximizing token removal, and that adaptive guardrails can improve
    efficiency, scalability, and reliability in long-horizon agentic systems.
- arxiv_id: '2609.18057'
  title: 'Anchoring What Matters: A Dual-Level Learning Framework for Visually-Grounded Multimodal Reasoning'
  abstract: 'Reinforcement learning with verifiable rewards (RLVR) has significantly improved the reasoning capabilities of
    large vision-language models (LVLMs). However, standard on-policy RLVR algorithms face a critical optimization bottleneck
    in preserving and reinforcing visually grounded reasoning behaviors: valuable visually-grounded reasoning trajectories
    are discarded after a single update, while uniform token advantage allocation prevents the model from reinforcing critical
    perception or reasoning steps. To bridge this gap, we propose PIVOT, a dual-level learning framework that anchors policy
    optimization around informative visual reasoning signals. Specifically, PIVOT introduces a self-calibrated experience
    replay mechanism, which selectively collects and replays visually-grounded historical experiences as stable reference
    anchors for policy optimization. Building upon this, we further design a vision-guided advantage allocation mechanism
    to allocate additional vision-aware advantages to tokens based on their local visual support and impact on downstream
    reasoning. Extensive experiments across diverse benchmarks demonstrate that PIVOT achieves highly competitive performance
    in enhancing the multimodal reasoning capabilities of LVLMs.'
- arxiv_id: '2609.11506'
  title: 'UBone3D: Physics-Rectified Conditional Flow Matching for Anatomical 3D Shape Completion from Ultrasound'
  abstract: 'Three-dimensional ultrasound (US) is a safe, radiation-free complementary modality to CT and X-rays for longitudinal
    monitoring, yet its segmentation-derived partial point clouds are extremely artifact-laden. Consequently, it is challenging
    to recover a clean and complete anatomical structure from such US point clouds. In this paper, we present UBone3D, a novel
    framework based on physics-rectified conditional flow matching (CFM) that performs point cloud completion directly from
    partial US observations. UBone3D models deterministic physics artifacts (e.g., surface thickening, streaking, dropouts)
    via a simulated physics proxy, and introduces test-time physics rectification to steer the shape completion. At inference,
    the completion is jointly steered by two decoupled forces: (1) anatomical plausibility enforced by a CT-trained generative
    shape prior, BoneFM, and (2) physics consistency enforced by USimNet in the ultrasound formation space. Extensive experiments
    on simulated and in-vivo data demonstrate significant improvements in reconstruction accuracy and anatomical fidelity
    over existing baselines.'
- arxiv_id: '2609.15807'
  title: Accelerating Transfer-Learning-Based Autotuning with Predictive LLVM IR Performance Ranking
  abstract: As the complexity of High Performance Computing (HPC) ecosys- tems continually increases, achieving optimal performance
    becomes a challenge. Traditional performance autotuning techniques pro- vide promising means to navigate this complexity,
    these techniques remain computationally intensive and require many evaluations to find optimal configurations. This work
    proposes an autotuning framework that designs a machine learning-based ensemble LLVM Intermediate Representa- tion (IR)
    ranker, Neural Configuration Scorer (NCS). NCS ranks the performance of IRs sampled by a transfer-learning-based autotuner,
    improving the efficiency of the tuning process by reducing tuning overheads and circumventing subpar evaluations. By leveraging
    knowledge from related tasks, we are able to effectively exploit the transfer relationship to access high-performing configurations
    in fewer samples than traditional techniques that rely upon itera- tive refinement. Our framework can achieve similar
    performance improvements as state-of-the-art autotuning techniques with up to 61.67% fewer evaluations, averaging 27.85%
    fewer evaluations across various HPC benchmarks.
- arxiv_id: '2609.13677'
  title: Nonsmooth Optimization via Orthogonalized Momentum
  abstract: 'Modern real application problems involve matrix-valued parameters, yet conventional optimizers treat them as
    vectors, thereby motivating matrix-aware methods that exploit input-output geometry, such as Muon which orthogonalizes
    the momentum matrices before parameter updates. Its empirical success raises a conceptual question: can orthogonalized
    momentum remain effective beyond smooth optimization? This paper studies this question for locally Lipschitz functions
    using a generalized derivative framework compatible with backpropagation. Our first contribution is to identify a key
    limitation: for every fixed momentum factor $\beta\in[0,1)$, Muon can fail to approach the global optimal solution of
    a convex Lipschitz objective from almost every initialization, when step sizes adapt to the full gradient history. The
    failure can occur even along bounded iterates. Our example is inspired by the one of Parshakova et al. which only covers
    $\beta\in[0,\frac{1}{2})$. Then, we show that the obstruction lies in fixed momentum rather than orthogonalization. Indeed,
    when the momentum factor is adaptive and approaches 1 together with a vanishing step size, Muon recovers asymptotic convergence
    for nonconvex nonsmooth optimization under the boundedness and regularity conditions. Moreover, we propose MAGD, which
    combines orthogonalized momentum with gradient, weighted based on their relative progress. MAGD retains asymptotic convergence
    in nonconvex settings and achieves an $O(\min\{m,n\}\epsilon^{-2})$ rate in convex settings. A lower bound shows the optimal
    dimension dependence. Experiments on synthetic problems, image classification, and LLM pretraining show MAGD is a simple
    and practical alternative to Muon. Together, our results characterize when orthogonalized momentum fails without smoothness
    and how it can be made reliable and we hope that the analysis may be useful more broadly.'
- arxiv_id: '2609.18769'
  title: 'Version- and Scope-Aware Question Answering over Normative Documents: A Deployed System and an End-to-End Evaluation
    at Production Scale'
  abstract: 'Correctly answering a question grounded in normative documents often depends on information outside any single
    passage: whether the retrieved document is the version currently in force; whether it applies to the jurisdiction, subject
    (such as an institution or applicant), and date at issue; and whether each normative claim can be traced to its supporting
    source text. Hosted retrieval services have substantially lowered the engineering cost of building an initial system over
    such corpora, making "upload the documents and ask" a common default. We evaluate this default on approximately 73,000
    candidate normative documents supplied to a production deployment. The evaluation uses a stratified sample of 200 questions
    from our published benchmark, with a gold source document for every question; the released sampling rule reads no system
    outputs or scores. We compare the hosted service with a governed system that resolves version and scope through explicit
    rules before generation. The governed system scored 97.7 overall, while the hosted service scored 88.1, a gap of 9.6 points
    computed from unrounded means. The question set, the answer text evaluated for both systems, the scores, and the scripts
    used to reproduce the reported benchmark statistics are public. The governed configuration has operated as a commercial
    product since January 2026 and serves 1,126 registered users; named customer organizations include Zhipu AI and Lecheng
    Health. By mid-April 2026, it had reached roughly 100,000 calls per workday.'
- arxiv_id: '2609.17029'
  title: 'Distributed JEPA: A Self-Supervised Framework for Energy Forecasting'
  abstract: Traditional energy forecasting solutions rely on task-specific supervision and energy asset representations, limiting
    transferability and the ability to capture general temporal dynamics across heterogeneous assets. We address this by proposing
    a distributed Joint Embedding Predictive Architecture (JEPA) for self-supervised learning from heterogeneous energy time-series.
    The framework predicts latent representations of masked temporal segments while integrating temporal observations and
    contextual information within a shared embedding space. To prevent representation collapse, training combines a latent-space
    predictive objective with covariance and temporal variance regularization. The evaluation was conducted on energy consumption
    and generation datasets under data-degradation scenarios and compared with a Transformer forecasting baseline. The learned
    representations remained stable (cosine similarity $\approx 0.98$; effective rank 185-235). JEPA achieved performance
    comparable to a Transformer on building energy data, higher $R^2$ in 3/5 consumer clusters, and outperformed the baseline
    on 9/10 unseen PVs ($R^2$=0.73-0.88 vs. <0.45), while showing greater robustness to missing data.
- arxiv_id: '2609.18283'
  title: Where Should Agents Live? Energy-Memory Characterization of Agentic AI for the Edge-Cloud Continuum
  abstract: As telecommunication networks evolve toward autonomous 5G-Advanced and 6G operations, agentic artificial intelligence
    (AI) workflows, where large language models (LLMs) execute multi-step reasoning, invoke diagnostic tools, retrieve domain
    knowledge, and coordinate across agent teams, are increasingly embedded across the edge-cloud continuum. While the biological
    brain accomplishes complex cognition on an exceptionally modest metabolic power budget of approximately 20W contemporary
    LLMs are profoundly energy- and memory-intensive, making sustainable lifecycle orchestration a critical operational priority.
    However, existing AI lifecycle metrics evaluate only isolated, single-model inferences or overlook multi-agent execution
    graphs entirely. Consequently, network operators lack foundational models to determine whether distributed agent communication
    incurs meaningful energy costs and where across edge-cloud tiers agent teams should physically reside. To address this
    gap, we introduce agentic-eCAL, generalizing the Energy Cost of AI Lifecycle (eCAL) metric to directed multi-agent workflows
    by coupling a closed-form two-rate single-call energy model (compute-bound prefill and memory-bound decode) with 7-layer
    OSI data transport. Grounded in hundreds of GPU benchmark configurations on NVIDIA A100 and H100, 16 open-weight models
    and 8 orchestration topologies, we validate components of the metric and study workflow placement implications. Our findings
    demonstrate that inter-agent text transport incurs 0.25% of workflow energy across 5G RAN, metro, and optical links. Therefore
    in edge-cloud agent placement the dominant energy cost of distribution is often not the transmission of inter-agent text
    itself, but the additional inference and context processing induced by that communication.
- arxiv_id: '2609.18366'
  title: 'Bad Genius: Counterfactual-Guided Harness Evolution Beyond Task-Specific Shortcuts'
  abstract: Reliable agent evaluation is complicated by automatic harness optimization, which repeatedly uses a released benchmark
    $B_{\mathrm{rel}}$ to guide a Proposer that edits prompts, memory, retrieval, tools, and control code around a fixed foundation
    model. Task holdout is commonly used to guard against harness overfitting. It varies semantic tasks but leaves the benchmark
    protocol fixed, so a bad genius Proposer can produce a cheating harness whose improvement over the initial harness on
    $B_{\mathrm{rel}}$ depends on a benchmark-wide shortcut. We introduce Counterfactual Harness Search and Evolution (CHASE),
    which casts harness evolution as constraint generation over valid counterfactual benchmarks. After each Proposer update,
    a Challenger searches for an executable protocol transformation with large gain destruction. A validity firewall checks
    that task semantics are preserved, while a held-out confirmation set determines whether the counterfactual enters a finite
    archive. We formalize an ideal shortcut-neutralized benchmark $B_0$ and establish theoretical guarantees linking finite
    counterfactual archives to $B_0$ and characterizing sequential Challenger search. We evaluate CHASE on Syn-Ledger and
    OfficeQA, where CHASE retains strong released-benchmark gains while substantially reducing gain destruction under valid
    protocol transformations.
- arxiv_id: '2609.13534'
  title: 'Harmfulness Propagation Dynamics: Layer-wise Trajectories of Adversarial Intent in Large Language Models'
  abstract: 'We identify \textbf{Harmfulness Propagation Dynamics (HPD)}: for harmful prompts, the projection of the last-token
    hidden state onto a learned harm direction rises monotonically with transformer depth, whereas benign prompts remain flat
    or oscillatory. This cross-layer signature reflects harmful intent as a \emph{progressively resolved} semantic property:
    surface form appears early, while pragmatic intent consolidates later, making the \emph{trajectory shape} more informative
    than any single-layer snapshot. Moreover, LDA-based harm directions, learned per layer, remain stable across random splits
    (pairwise cosine similarity $>0.97$), supporting the projection sequence as a reproducible structured signal. Building
    on HPD, we introduce \textbf{\herald{}} (\textbf{H}armful \textbf{E}ncoding \textbf{R}ecognition via \textbf{A}ctivation
    \textbf{L}ayer \textbf{D}ynamics). This lightweight input moderator extracts a seven-dimensional feature record, slope,
    curvature, monotonicity, onset layer, and related statistics from the cross-layer projection sequence and classifies it
    with a 288-parameter MLP. \herald{} stores one $d$-dimensional direction per layer ($262$\,KB for a 32-layer, $d{=}4096$
    model), requires no gradient computation during training, and adds only $2.6{\times}10^{-6}$ prefill FLOPs at inference.
    Across eight prompt-harmfulness benchmarks and four model families, \herald{} achieves an average F1 of $89.3$ on OLMo2-7B,
    surpassing all tested guard models on adversarial jailbreak detection ($98.4$ vs.\ $96.9$ F1) and outperforming prior
    latent-based methods by $2.3$-$4.1$ F1 points on every backbone. Per-instance trajectories provide machine-readable audit
    records that reveal \emph{when} and \emph{how} harmfulness emerges, offering an interpretability advantage over single-layer
    approaches.'
- arxiv_id: '2609.15169'
  title: 'GRAVA: Grounded Reasoning-to-Action Representation and Learning for Autonomous Driving'
  abstract: Driving vision-language-action (VLA) models increasingly reason before acting, but their intermediate reasoning
    is often weakly grounded in physical scene evidence and loosely connected to executable behavior. We present GRAVA, a
    framework built around Grounded Reasoning-to-Action (GRA), which unifies grounding, reasoning, and action generation in
    a single autoregressive stream. GRA links action-relevant language references to 2D visual regions and ego-centric physical
    states, organizes object interactions and decisions in a trajectory-anchored typed graph, and serializes this structure
    into grounded reasoning. A single VLM generates this reasoning followed by a compact Executable Planner action that is
    deterministically decoded into a continuous trajectory. We further introduce an agentic GRA data construction pipeline
    that combines forward scene grounding with backward trajectory anchoring, and use it to build GR-NavSim with 2.2M grounded
    question-answer pairs and 70K GRA reasoning traces. A progressive training strategy develops grounded cognition through
    pre-training, establishes the reasoning-to-action interface through imitation, and improves driving behavior through reinforcement
    learning and exploration. Using about 60% of the available human driving demonstrations for action supervision, GRAVA-8B
    achieves state-of-the-art performance among purely autoregressive driving models on the full NAVSIM benchmark. On an internal
    long-tail benchmark, full GRA improves key-object compliance and Closed-loop Driving Score by 19.3% and 20.5% over action-only
    prediction, respectively. These results show the benefit of preserving action-relevant physical evidence from grounded
    reasoning through executable action generation.
- arxiv_id: '2609.18239'
  title: Unified Response Geometry for Structured Pruning
  abstract: 'Structured pruning is commonly formulated as ranking individual channels, although channel responses can be complementary
    or cancel through downstream mixing. Motivated by these response interactions, we formulate pruning as the selection of
    a subset with large joint response capacity, followed by a separate functional realization step. Our unified response
    geometry maps each candidate set to \(M(D,R)=D^{1/2}RD^{1/2}\) and uses its determinant together with Schur-greedy residuals
    to select non-redundant coordinates. The same construction yields two information-conditioned instances: an unlabeled
    instance based on activation covariance, and a task-conditioned instance that combines activation and gradient variance
    for response scale with gradient correlation for complementarity. To convert the selected subset into an executable network,
    we fold predictable removed responses into successor weights through ridge compensation and recalibrate batch-normalization
    statistics, without fine-tuning the network. On ImageNet ResNet-50, the unlabeled instance reaches \(65.4\%\) and \(53.9\%\)
    Top-1 accuracy at 30\% and 40\% deletion, versus \(59.8\%\) and \(43.1\%\) for strength-only selection; the task-conditioned
    instance reaches \(67.7\%\) and \(56.3\%\) under the same protocol. A six-family screen shows architecture-dependent behavior,
    with positive relative contrasts in several convolutional and expansion-layer settings and clear boundary cases in windowed
    attention. These results support response geometry as a conditional principle for structured pruning, with its benefit
    determined jointly by the observed response and the architecture in which that response is realized.'
- arxiv_id: '2609.13657'
  title: 'Safety as a Constraint: Fine-Tuning a LLM Recommender to Explain Itself'
  abstract: 'Traditional recommender systems are typically trained to predict what item users will interact with next, but
    not why. However, offering personalized evidence for why a user might like the predicted item is an important way to enhance
    the service and to raise the likelihood that the user will be genuinely interested in the recommendation. This service
    can be delivered by integrating a frontier-model call into the member-facing pipeline, but it will add extra cost and
    latency. In this paper, we train a recommender LLM to generate personalized explanations for its reccomendation, based
    on the user''s watching history at a large video streaming service. We impose two requirements on the generated explanation:
    it must be faithful to the elements of the shows it links, and it must be strictly non-harmful to the user. To this end,
    we first train two LLM-judge reward models covering three specific criteria, and propose constrained GRPO to incorporate
    these different criteria. On a held-out real-world testing set, our fine-tuned model improves the all-three-criteria PASS
    rate rises from 0.649 to 0.956 under our own judges and from 0.677 to 0.931 under an independent judge, where as the frontier
    generator performs similar to the untuned recommender baseline. We conduct further experiments to show that the model''s
    language and recommendation abilities remain unchanged. Based on these results, we conclude that an LLM-based recommender
    can be fine-tuned on other complex tasks without compromising its original recommendation performance, thus provide insights
    for further agentic user interface powered by a single model.'
- arxiv_id: '2609.18080'
  title: 'Decodability is Not Causality: Dissociating Probe Readouts from Behavioral Drivers via SAE Decomposition'
  abstract: 'Linear probes can decode safety-relevant concepts such as truthfulness from language-model activations, but probe
    accuracy may show only decodability, not that the features the probe weights causally drive model behavior. We demonstrate
    that this gap cannot be closed from the geometry of probe weights alone: the features geometrically aligned with probe
    direction need not be the ones the model uses, so causal relevance requires intervention. We introduce a feature-level
    diagnostic that decomposes a deployed True/False probe into sparse-autoencoder (SAE) features, ranks those features by
    both probe alignment and by gradient sensitivity of the model''s behavior, and ablates the resulting shared, probe-only,
    and random feature sets under a coherence gate. On the truth probe of Buerger et al. (2024) (TTPD), applied in the instructed
    truth/deception setting of Long et al. (2025) for Gemma2-9B-Instruct, the two rankings overlap only weakly (about 12%,
    Spearman rho = 0.10), and ablation dissociates them sharply: features the probe shares with the model flip the output
    far more (up to 27%) than equally sized probe-only (6%) or random (1%) features at full coherence, while probe-only features
    instead perturb the probe''s own readout. The dissociation holds across five seeds and a held-out split, and an activation-aware
    selection of features flips behavior nearly three times as often as the probe''s geometric top features (17.6% vs. 6.1%).
    In this setting, therefore, the geometric projection of a probe''s weight vector alone does not identify the features
    the model causally uses; however, combining probe information with feature activation statistics recovers substantially
    more behaviorally causal features, and coherence-gated SAE intervention is needed to separate them from probe readouts.'
- arxiv_id: '2609.16501'
  title: 'Beyond the Name: Demographic Leakage in De-Identified R\''esum\''es and Evaluation Artifacts in LLM Bias Audits'
  abstract: 'De-identified r\''esum\''e screening assumes that redacting explicit fields prevents ethnocultural inference;
    however, recent audits attribute residual leakage to declared languages. We investigate whether eliminating language fields
    resolves this leakage across nine open-weight models and 620 counterfactual r\''esum\''es. By holding language attributes
    strictly identical, we isolate unstructured prose across five ethnocultural conditions and three cue-salience tiers. Target-group
    recovery averages 0.757 overall and saturates at 1.000 under high salience, demonstrating that non-language prose sustains
    demographic inference. Crucially, models diverge only under faint cues (0.086-0.690), establishing salience as an essential
    evaluation axis. Furthermore, pairwise LLM-as-a-judge outcomes are highly sensitive to evaluation design: forbidding ties
    yields an apparent selection-rate ratio of 0.39 alongside strong position and content effects, whereas permitting ties
    produces near-universal ties for most models ($\ge94\%$). Downstream scoring shows only very small between-condition differences,
    highlighting the need to distinguish demographic signals recoverable from r\''esum\''e content from effects introduced
    by the evaluation protocol.'
- arxiv_id: '2609.17338'
  title: Type-IV Code Clone Detection via Layer-Wise Non-Contrastive Representation Learning
  abstract: Software clones are fragments of code that are similar or functionally equivalent to each other. They pose significant
    challenges for maintenance, refactoring, and bug detection. Detecting Type-IV clones, which are semantically equivalent
    but may differ syntactically, is particularly difficult for traditional token- or syntax-based methods. Recent machine
    learning approaches rely on contrastive learning, which requires careful negative sampling and can introduce bias. In
    this paper, we propose LWVIC4Code, a non-contrastive representation learning approach specifically designed for Type-IV
    clone detection. Building on the Variance-Invariance-Covariance Regularization (VICReg) framework and prior layer-wise
    VICReg training, LWVIC4Code introduces cross-layer consistency regularization and depth-dependent layer weighting to progressively
    refine semantic information across transformer layers, producing robust and discriminative code representations. We conduct
    an empirical study comparing LWVIC4Code against a contrastive learning baseline and zero-shot large language models on
    Python (Kamino) and multi-language (GPTCloneBench) datasets. Results show that LWVIC4Code achieves competitive or superior
    performance without negative samples, benefits from layer-wise supervision, and generalizes effectively from Python to
    other languages, particularly Java and C#. These results demonstrate that non-contrastive, layer-wise representation learning
    is a promising direction for robust semantic code clone detection.
- arxiv_id: '2609.13592'
  title: 'BOOST: Concurrent Access to Host Memory and HBM to Accelerate LLM Inference'
  abstract: 'GPU memory bandwidth and capacity limit throughput in large language model (LLM) inference. The GPU memory system
    consists of a primary tier of high-bandwidth memory (HBM) and a secondary tier of host memory connected via CPU-to-GPU
    interconnect. Current serving systems treat the tiers hierarchically: they serve exclusively from HBM when data fits,
    and otherwise prefetch data from host memory to HBM before use. In both cases, the host memory bandwidth is never well
    utilized. Prefetching expands capacity by utilizing host memory, but consumes HBM bandwidth for writes, reducing the bandwidth
    available for demand loads. We observe that fully utilizing both host and HBM bandwidth requires each wave of GPU threadblocks
    to access both tiers concurrently and in proportion to their bandwidth ratio. Existing bandwidth-proportional placement
    strategies fail to provide concurrency because they are not aware of GPU waves, and the large 2MB GPU page size. This
    paper presents BOOST, the first runtime system that provides concurrent and proportional access to both GPU memory tiers,
    extracting the combined bandwidth of host memory and HBM for LLM inference without kernel changes. The key insight in
    BOOST is to use kernel access patterns to make page allocation and runtime data management wave-aware. For static model
    weights, BOOST applies modulo-based page placement that eliminates access-ratio variance; for dynamically provisioned
    attention key-value (KV) pairs, it makes the free KV page pool wave-aware. We integrate BOOST into vLLM and evaluate on
    a Grace Hopper system. At iso-batch size, BOOST improves Time-per-Output-Token (TPOT) by 4.3% over HBM-only serving, whereas
    prefetching degrades TPOT by 6%. In high-throughput serving, BOOST improves throughput by 31% on average, outperforming
    prefetching by 15%.'
- arxiv_id: '2609.13847'
  title: 'Measuring the Cost of Variety Conflation in Multilingual MT Evaluation: Adding Mozambican Xichangana, Nyanja and
    Sena to FLORES+'
  abstract: 'In this paper, we extend FLORES+ with Portuguese-source evaluation sets for three Mozambican Bantu varieties:
    Xichangana, Mozambican Nyanja, and Sena. We compare Xichangana with the existing Tsonga reference and Mozambican Nyanja
    with Chichewa, and evaluate NLLB-200, Google Translate, GPT, and a variant-aware NLLB model. Holding system output fixed
    reveals substantial reference sensitivity. On \textit{devtest}, changing only the reference from Tsonga to Xichangana
    reduces spBLEU by 13.10 points for NLLB-200 and 15.30 for Google. On matched Nyanja subsets, replacing Chichewa with Mozambican
    Nyanja produces smaller but consistent reductions of 3.03 and 6.10 spBLEU, respectively. Variant-aware fine-tuning reverses
    this pattern on the intended targets: relative to NLLB-200, it improves Xichangana by 7.04 spBLEU and Mozambican Nyanja
    by 5.33 on \textit{devtest}, while losing performance on the sibling references. GPT is competitive on Tsonga and Chichewa
    but substantially weaker on the Mozambican varieties. For Sena, the finetuned model reaches 12.64 spBLEU and 36.21 chrF++
    on \textit{devtest}. These findings motivate variety-aware language identifiers, references, and reporting for cross-border
    languages or language dialects/variants. The data is publicly available on Hugging Face at https://huggingface.co/datasets/MOZNLP/FLORES_MOZ'
- arxiv_id: '2609.11246'
  title: 'Assessing the Reusability of Public Speech Resources for Low-Resource Languages: A Central Kurdish Case Study'
  abstract: 'Kurdish is spoken by millions of people, but little technology can read it aloud. A recent study released three
    Kurdish voices, 35 hours of recorded speech, and a paper describing the work, all free to download. This review checks
    how well those public files match the paper. The research is careful about its limits, but the files contain several problems:
    a settings file lists equipment that was never used, test recordings are left unlabeled among training data, and a coding
    fault mishandles long numbers. The download page also claims a stronger result than the paper reports and recommends one
    voice for general use. That recommendation matters because Kurdish has major regional and written variation, while these
    voices were built from three people reading prepared texts. The process therefore removes much everyday and regional speech.
    English and German benefit from long traditions of dictionaries and linguistic description that help identify wrong pronunciations;
    Kurdish has far less such support, so software choices can go unchecked. The voices sound fluent, but they represent the
    reading styles of their speakers rather than Kurdish as a whole. Most of these issues can be fixed using information the
    team already has, without changing the reported results. Better records would mainly make the work easier for others,
    especially community linguists, to check and reuse. The license is the main exception: whether audiobook owners allow
    corrected versions to be shared will affect whether future Kurdish voices can build on this work or must start again.'
- arxiv_id: '2609.16909'
  title: 'PiPS: Post-Hoc Prototypical Explanations for Interpretable Semantic Segmentation'
  abstract: With the increasing deployment of deep neural networks in critical systems, such as medical diagnostics and autonomous
    vehicles, ensuring their interpretability is crucial to building trust in decision-making systems. In the field of explainable
    artificial intelligence, prototype-based reasoning has gained particular popularity, as it mimics human cognitive processes
    by explaining model decisions based on visual similarity under the looks like this paradigm. While this paradigm has been
    thoroughly investigated in the context of global image classification, the interpretability of dense predictions, particularly
    semantic segmentation, remains largely unexplored despite its immense importance in tasks requiring precise object localization.
    Existing prototype-based interpretable segmentation models rely on ante-hoc architectures, which entails significant limitations
    because they require costly training from scratch and modifications to the network structure, ultimately leading to a
    noticeable drop in predictive performance compared to standard black-box models. To address this issue, we propose PiPS
    (Post-hoc interpretable Prototypical Segmentation), the first fully post-hoc solution for generating prototypical explanations
    for semantic segmentation models. Our method enables the extraction of intuitive, spatially localized explanations from
    any pre-trained network without modification or fine-tuning, thereby preserving 100% of the model's original predictive
    performance. This approach opens a new avenue for the safe and cost-effective deployment of transparent systems in advanced
    computer vision tasks. Codebase available at https://github.com/gmum/PIPS.
- arxiv_id: '2609.18540'
  title: 'SVMemAgent: A Streaming Video Memory Agent for Query-Agnostic Online Frame Selection'
  abstract: Most keyframe selection studies focus on offline settings, assuming access to the full video and query in advance.
    In contrast, real-world streaming scenarios require online frame selection under unknown video duration, without access
    to either the query or future frames during selection. To address this, we introduce Streaming Video Memory (SVMem), a
    compact and representative memory of previously observed content, updated continuously as the video stream unfolds. Building
    on this setting, we propose the Streaming Video Memory Agent (SVMemAgent), which dynamically maintains a memory by deciding
    at each timestep whether to replace an existing memory frame with the incoming frame or discard it. SVMemAgent is trained
    using Group Relative Policy Optimization (GRPO) with task-driven rewards derived from diverse question-answer pairs, implicitly
    exposing the policy to a distribution of queries during training so that SVMem retains generally informative frames at
    inference, when queries are unavailable. Experiments on both online and offline video benchmarks show that SVMemAgent
    consistently outperforms online frame selection baselines and achieves competitive performance with offline methods that
    assume access to the full video and query. Through task-driven rewards, SVMemAgent learns an emergent keyframe selection
    policy that prefers frames containing textual information, which may benefit downstream VideoQA tasks.
- arxiv_id: '2609.14874'
  title: 'MedVA: An End-to-End Neuro-Symbolic Agentic System for Medical Volume Visualization'
  abstract: Medical volume visualization requires selecting regions of interest (ROIs) and carefully controlling their relative
    visual emphasis according to a given clinical intent. Implementing these decisions in conventional workflows demands substantial
    clinical and visualization expertise and often involves trial-and-error optimization. Recent agentic systems have introduced
    natural-language interaction and autonomous visualization operations but largely rely on MLLM-based inference throughout
    the workflow. Although MLLMs encode broad medical knowledge and provide strong reasoning capabilities, such inference
    may be suboptimal for medical volume visualization, potentially leading to clinically incomplete interpretations of user
    requests and unreliable ROI identification and visualization optimization. In this work, we present MedVA, an end-to-end
    neuro-symbolic agentic system for medical volume visualization that addresses these limitations through three complementary
    agents. The neuro-symbolic intent formulation agent refines MLLM-based interpretations of natural-language requests through
    symbolic reasoning over established clinical knowledge, which provides more complete, clinically grounded ROI specifications
    than MLLM-only reasoning. The multi-model ROI identification agent directly identifies semantically specified ROIs in
    the original volume by leveraging complementary large-scale pretrained medical segmentation models. The objective-driven
    visualization optimization agent explicitly evaluates ROI visibility and occlusion in the original volume using a volume-based
    visibility objective. Extensive agent-level and system-level evaluations across diverse medical datasets and interaction
    scenarios support the effectiveness of the individual agents. A formative user study further indicates high usability
    and practical value among users with different levels of expertise.
- arxiv_id: '2609.11699'
  title: 'Negative Self-Distillation: Learning to Reason by Avoiding Flaws'
  abstract: 'On-Policy Self-Distillation (OPSD) has emerged as a popular paradigm for large language model (LLM) self-improvement,
    allowing models to act as their own teachers by leveraging privileged information such as ground-truth solutions. However,
    recent findings indicate that OPSD can severely degrade the performance of LLMs on complex reasoning tasks: By forcing
    the student to imitate an artificially confident reasoning trace conditioned on privileged information, OPSD inadvertently
    suppresses expressions of uncertainty and penalizes the exploratory, self-corrective behaviors required to solve challenging
    problems. To address this, we introduce Negative Self-Distillation (NSD), a new framework that optimizes LLMs by diverging
    from flawed reasoning rather than imitating privileged solutions. Instead of relying on ground-truth answers or external
    supervision, NSD uses the model itself to generate a question-specific negative condition (eg, acting as a ``careless
    reasoner'''') and pushes the student''s distribution away from this self-generated negative teacher. Naively applying
    unlearning objectives to achieve this divergence is problematic, as flawed reasoning tokens are confounded with basic
    linguistic tokens; indiscriminately penalizing both risks catastrophically degrading the model''s foundational language
    capabilities. We resolve this by designing a dynamic gating mechanism that automatically identifies and isolates reasoning-critical
    tokens, ensuring gradient updates target only behavioral flaws while preserving the model''s linguistic priors. Empirically,
    NSD consistently outperforms OPSD and other label-free, self-bootstrapping reinforcement learning (RL) baselines.'
- arxiv_id: '2609.11687'
  title: Structured Transforms for Low-Overhead Quantization of Language Models
  abstract: 'We revisit Kashin-decomposition-based weight quantization for large language models and propose an improved algorithm
    with stronger convergence properties and structured, efficient orthogonal transforms. The method retains the core factorization
    of each weight into two components -- one with bounded infinity norm and the other with bounded infinity norm after an
    orthogonal transformation -- but replaces the dense random orthogonal matrix with a sign-randomized Discrete Cosine Transform
    (DCT), reducing the per-iteration cost from $\mathcal{O}(N^2)$ to $\mathcal{O}(N \log N)$. The proposed greedy algorithm
    with alternating updates guarantees the four-peak distribution required for stable 2-bit clustering of each factor and
    admits closed-form initialization of cluster centers, removing the multi-restart k-means bottleneck of prior work. Composed
    with OPTQ-style sequential error compensation and QuIP-style incoherence preprocessing, the resulting JAX pipeline is
    competitive with OPTQ, QuIP, QuIP-RG and a fine-tuning- and vector-quantization-free variant of QuIP# at 4-bit per channel
    on OPT, Llama-2 and Pythia, with favorable wall-clock scaling. The bounded-$\ell_\infty$ factorization is also notably
    robust: on stress configurations where QuIP variants diverge to four-digit perplexity (Pythia-6.9B) or abort with NaNs
    in LDL back-substitution (Mistral-7B), Kashin-DCT remains numerically stable and stays close to FP16 baseline. At inference
    time, each weight decomposes into two 2-bit factor codes per channel that are structurally suited to native-2-bit hardware.'
- arxiv_id: '2609.13073'
  title: 'Autonomous Research for Open-Ended Problems: A Case Study on Telecom Ticket Retrieval'
  abstract: 'Recent breakthroughs in LLM-based systems and their abilities in problem solving and coding have allowed progress
    in the AI for Science paradigm, potentially replacing human roles in machine learning (ML) research. However, while several
    frameworks of fully autonomous end-to-end ML research have been proposed, successful implementations of them are often
    limited to problems with narrow search spaces, like language modeling or biomedical ML benchmarks. In this paper, we explore
    how autonomous research can be adapted to solve open-ended, industry-grade ML problems, by considering a case study: telecom
    ticket retrieval, an open-ended task with degrees of freedom in representation, architecture, and training data generation.
    We discover that autonomous research for open-ended problems with commercial and open-source agents shows both promise
    and limitations: while autonomous research can excel in narrow hyperparameter optimization, it lacks human-like intuition
    and creativity and requires operational overhead. Even with minimal human supervision, autonomous research can reach $90\%$
    of state-of-the-art performance (0.34 vs. 0.38 Recall@1) in a much shorter time period (10 weeks vs. 10 months of human
    work) at a modest cost (up to \$200 per Cursor campaign). Our empirical evidence recommends that human researchers and
    autonomous research frameworks work together for best results in ML research.'
- arxiv_id: '2610.02221'
  title: Causal discovery identifies pathways linking physical activity to dementia risk in the UK BioBank
  abstract: Physical Activity (PA) is consistently associated with lower risk of dementia, yet the mechanism linking PA to
    dementia prevention remain incomopletely understood. Here, we integrate large language model (LLM)-guided causal discovery
    with mediation analysis in 42,293 older adults aged 60 years or older from the UK Biobank to systematically identify pathways
    connecting objectively measured moderate-to-vigorous physical activity (MVPA) to dementia risk. Across behavioral, psychological,
    functional, and clinical domains, causal discovery consistently identified interconnected pathways linking higher MVPA
    to lower dementia risk through depression, functional capacity, smoking behavior, hypertension, cardiovascular disease,
    chronic kidney disease, and brain injury. Chain mediation analyses further identified depression as a central pathway,
    accounting for 15.1% of the overall association between MVPA and dementia risk. Sex-stratified analyses revealed distinct
    mechanistic patterns, with females exhibiting predominantly metabolic and functional pathways, while males showed behavioral
    and cardiometabolic cascades involving smoking and cardiovascular disease. Together, these findings suggest that the protective
    association between PA and dementia is mediated through interconnected behavioral, psychological, and cardiometabolic
    processes rather than a single pathway. Depression emerged as a prominent and potentially modifiable pathway, highlighting
    opportunities for integrating dementia prevention strategies that combine PA promotion with mental health and cardiovascular
    risk management.
- arxiv_id: '2609.18432'
  title: 'Occluded Gait Recognition with Mixture of Experts: An Action Detection Perspective'
  abstract: 'Extensive occlusions in real-world scenarios pose challenges to gait recognition due to missing and noisy information,
    as well as body misalignment in position and scale. We argue that rich dynamic contextual information within a gait sequence
    inherently possesses occlusion-solving traits: 1) Adjacent frames with gait continuity allow holistic body regions to
    infer occluded body regions; 2) Gait cycles allow information integration between holistic actions and occluded actions.
    Therefore, we introduce an action detection perspective where a gait sequence is regarded as a composition of actions.
    To detect accurate actions under complex occlusion scenarios, we propose an Action Detection Based Mixture of Experts
    (GaitMoE), consisting of Mixture of Temporal Experts (MTE) and Mixture of Action Experts (MAE). MTE adaptively constructs
    action anchors by temporal experts and MAE adaptively constructs action proposals from action anchors by action experts.
    Especially, action detection as a proxy task with gait recognition is an end-to-end joint training only with ID labels.
    In addition, due to the lack of a unified occluded benchmark, we construct a pioneering Occluded Gait database (OccGait),
    containing rich occlusion scenarios and annotations of occlusion types. Extensive experiments on OccGait, OccCASIA-B,Gait3D
    and GREW demonstrate the superior performance of GaitMoE.OccGait is available at https://github.com/BNU-IVC/OccGait.'
- arxiv_id: '2609.13045'
  title: 'Kraken: LLM-based Speech-to-Speech Translation via Low-bitrate VQ and Dual-path Source Conditioning'
  abstract: Speech-to-speech translation (S2ST) has advanced significantly with speech LLMs, offering the potential for joint
    optimization and preserving non-linguistic information. However, these models struggle with predicting high-bitrate speech
    tokens in LLMs, and face the challenge of relying on S2ST training data with ideally aligned speaker identity and prosody.
    We propose using low-bitrate tokens based on single-layer vector quantization, trained to reconstruct self-supervised
    learning (SSL) features. We also employ a separate token-to-waveform decoder named Autowave-X, which is also conditioned
    on the source speech to improve non-linguistic transfer, thereby relaxing the training data constraints. With the integration
    of these techniques, we propose an S2ST model named Kraken, which augments a pre-trained LLM with speech feature inputs
    and the low-bitrate token outputs, followed by Autowave-X vocoder. We built the model upon Qwen3-8B and trained it using
    150k hours of multilingual and multitask speech data. We demonstrated that our model exhibited better translation quality
    than SeamlessM4T-Large v2 and Qwen2.5-Omni, along with improved speaker and prosody transfer capabilities.
- arxiv_id: '2609.13318'
  title: 'Attention-DP3: Spatially Object-aware 3D Diffusion Policy via Geometry-aligned Attentional Conditioning'
  abstract: '3D point-cloud observations are inherently ambiguous in complex, cluttered manipulation scenes, where target
    objects may be partially occluded or tightly intermingled with visually similar distractors. As a result, standard 3D
    diffusion policies often struggle to localize and exploit task-relevant geometry as scene complexity grows. We propose
    \textbf{Attention-DP3}, a spatially object-aware 3D diffusion policy that injects object-level geometric cues via attention
    while keeping the DP3 diffusion backbone unchanged. Our pipeline performs open-vocabulary 2D segmentation on RGB images,
    then lifts predicted target masks into 3D using calibrated camera geometry to obtain object-centric geometric priors.
    We incorporate these cues through Tri-field Attentional Conditioning, which constructs three complementary fields: (i)
    a targetness field to anchor the target object, (ii) an intra-target saliency field to emphasize task-relevant geometry
    within the target, and (iii) a backgroundness field to suppress distractors and clutter. Experiments on Adroit, DexArt,
    MetaWorld, and the real-world SO101 platform show consistent improvements over DP3, achieving state-of-the-art performance
    across benchmarks. Notably, as distractor objects increase, DP3 drops sharply, whereas Attention-DP3 remains stable and
    outperforms DP3 by up to 31\% under heavy clutter. The code is publicly available at https://github.com/zhangzhongbo2213/Attention-DP3.'
- arxiv_id: '2609.15188'
  title: 'MUSE: A Theory-Harnessed Story Engine for Vibe Narrativizing'
  abstract: 'LLMs have been able to generate fluent prose, but high-quality stories also require coordinated decisions about
    plot, character, and language across planning, drafting, and revision. We formulate Vibe Narrativizing as turning natural-language
    writing requirements into a finished story. MUSE, a Theory-Harnessed Story Engine, addresses two bottlenecks: rule quality
    and sustained rule realization. Story theory supplies the rules, and a practical agent harness puts them to work. Knowledge
    engineering organizes Robert McKee''s theory through rule atomization, semantic consolidation, mechanism abstraction,
    a single source of truth, and layered disclosure; typical examples clarify judgments that depend on context and aesthetic
    purpose. The harness preserves story decisions in intermediate deliverables across design, character performance, scene
    composition, and revision. Context engineering supplies each role with relevant guidance and decisions; a masterwork corpus
    provides inspiration and prose references. A worked example follows a requested object from its thematic role to climactic
    actions. Across four base models, MUSE improves WritingBench by 1.1 to 6.2 points over zero-shot generation; it is the
    only multi-stage system in our comparison to do so. It also raises LongStoryEval by more than ten points on three of the
    four models. ConStory-Bench consistency error density remains in the low single digits for all four models, below every
    reproduced story-system baseline on three of the four models. Ablations locate the largest quality contribution in structural
    design, voice-specific effects in the character path, and further gains in revision.'
- arxiv_id: '2609.15654'
  title: 'Empathy Is Steerable but Multi-Axial: Mechanism Geometry and Persona Effects in LLMs'
  abstract: 'Activation steering has been used to control traits such as honesty, refusal, and sycophancy, yet supportive
    empathy is evaluated along multiple dimensions that need not correspond to independently controllable activation directions.
    Using the EPITOME framework, which decomposes supportive empathy into Emotional Reactions, Interpretations, and Explorations,
    we study three instruction-tuned LLMs and ask whether candidate directions derived from these labels produce distinguishable
    intervention effects or instead share structure, and how persona prompts interact with those directions. We find that
    contrastive activation addition yields a stable middle-layer intervention that consistently shifts the EPITOME proxy scores
    across models, moving empathy analysis beyond response-level scoring. However, the recovered directions are only partially
    separable: steering one direction induces off-target shifts, and hand-crafted prompting shifts the empathy profile rather
    than isolating a single dimension. Persona prompts substantially change EPITOME scores, but a paired activation-shift
    decomposition shows that the recovered subspace captures only approximately 3 percent of persona-induced squared activation-shift
    magnitude at layer 15. Under this EPITOME-based definition, expressed empathy is steerable but multi-axial, and controlling
    persona-conditioned empathy requires targeting structure beyond individual mechanism directions.'
- arxiv_id: '2609.15467'
  title: 'Turkish MMLU Pro: Traceable Option Augmentation and Its Validity Limits in Turkish Multiple-Choice Evaluation'
  abstract: Adding answer options can lower multiple-choice scores without improving assessment validity. Turkish MMLU Pro
    examines this distinction using 12,000 Turkish-source questions across 58 sections. Each question retains its stem, five
    original options and source key, and receives five options copied from other questions in the same section. Sentence-embedding
    retrieval proposes candidates; a language model selects existing identifiers. Deterministic verification reconstructs
    all 60,000 additions. A 25-model calibration exposes scoring and generation-budget effects. Five evaluations produce source-key
    accuracies of 34.8%-81.4%. On 981 shared questions, one API-served model falls from 93.7% with five choices to 83.1% with
    ten; 102 of 115 lost correct responses select borrowed options. The decrease is 24.4 percentage points on heuristically
    flagged negative stems and 5.9 points elsewhere. A completed human-checked audit of 200 sampled questions, with undocumented
    reviewer tool use, yields 47 and 31 multiple-answer judgments across the two record sets, 25 of the latter unresolved.
    These records support concern about ambiguity, while their dependence and incomplete reviewer-method documentation limit
    validation. Because order and labels also change, the paired comparison measures augmentation as implemented. The contribution
    is a traceable construction and an analysis of its validity limits, not evidence that lower ten-choice scores measure
    knowledge better.
- arxiv_id: '2609.13340'
  title: 'ProtoCAM: Interpretable Few-Shot Mask-Guided Prototypical Learning for Breast Lesion Classification in Ultrasound
    Imaging'
  abstract: Breast ultrasound imaging plays an important role in the early detection and diagnosis of breast cancer, particularly
    for patients with dense breast tissue. However, developing reliable deep learning models for ultrasound analysis is challenging
    due to limited annotated medical data and the need for interpretable predictions. To address these challenges, this paper
    proposes ProtoCAM, an explainable few-shot learning framework for breast lesion classification that integrates mask-guided
    feature encoding, prototypical metric learning, and gradient-based visual explanations. The proposed approach leverages
    lesion masks to guide feature extraction and constructs class prototypes within an embedding space to enable robust classification
    under limited training samples. The framework was evaluated on the BUSI dataset using a stratified group k-fold cross-validation
    protocol to prevent patient-level data leakage. Experimental results demonstrate ProtoCAM's high performance in low-data
    scenarios. In a 3-way 5-shot setting, the proposed method achieves a macro F1-score of 0.910, representing a substantial
    improvement over standard supervised CNN models. Among the evaluated backbone networks, ResNet18 achieved the best performance,
    reaching a macro F1-score of 91.65% under a 15-shot configuration, providing interpretable insights into the classification
    decisions. These results highlight the potential of explainable few-shot learning frameworks for reliable computer-aided
    breast cancer diagnosis in data-scarce medical imaging environments.
- arxiv_id: '2609.15668'
  title: 'Circuit-MLLM: Topological Logic-Guided Latent-Space Visual Reasoning for Circuit Schematic Understanding'
  abstract: Through pre-training on extensive text and image datasets, current multi-modal large language models (MLLMs) achieve
    strong performance on general tasks. However, circuit schematics present a unique challenge for MLLMs due to their dense
    component layouts and distinct topological logic, demanding fine-grained structural parsing to extract the electrical
    semantics. To address this, we propose Circuit-MLLM, a multimodal reasoning framework that reformulates circuit topology
    analysis as a process of device localization, path tracing, and sequential reasoning within the latent space. We introduce
    a circuit knowledge mining mechanism that deeply aligns the model's latent representations with structurally rich features
    derived from multi-granularity circuit vision experts, enabling the model to effectively internalize topological semantics.
    Building upon these internalized semantics, we devise a topology-guided sequencing strategy that decouples reasoning from
    the rigid raster-scan order, enforcing stepwise inference along the circuit's topological logic in latent space. Across
    diverse circuit analysis tasks, Circuit-MLLM consistently outperforms strong baselines, notably achieving a 25% higher
    average score than GPT-5.1, which demonstrates the effectiveness of our framework in circuit schematic topology analysis.
    Code is publicly available at https://github.com/IC-Yuan/Circuit-MLLM.
- arxiv_id: '2609.16341'
  title: Channel-Informed Neural Network for Physical Layer Key Generation
  abstract: Physical-layer key generation (PKG) enables wireless devices to establish shared keys from reciprocal channel
    observations without directly exchanging the key. This capability is attractive for edge networks, where distributed and
    resource-constrained devices may require lightweight key establishment with limited access to centralized infrastructure.
    We introduce a channel-informed neural network for PKG that derives binary key features directly from received IQ measurements
    while explicitly grounding the learned representation in the underlying multipath channel. The proposed multi-task recurrent
    neural network jointly learns reciprocity-preserving binary features and an auxiliary channel estimate using a training
    objective that combines deep metric learning with channel-informed supervision. Structured channel sounding enables channel
    estimation from over-the-air measurements, while Sionna-RT ray tracing is used to augment training with additional propagation
    conditions. We evaluate the framework using indoor and outdoor software-defined-radio measurements collected on the POWDER
    radio testbed. Across all evaluated scenarios, the proposed model produces lower bit disagreement for reciprocal Alice-Bob
    observations than for Eve-related observations. Ray-traced data augmentation substantially improves key diversity, increasing
    the unique-key rate to 0.94, 0.99, and 0.99 across the indoor and two outdoor scenarios, respectively. Successfully reconciled
    channel-informed keys pass the selected NIST randomness tests prior to SHA-3 privacy amplification. The results demonstrate
    the potential of channel-informed representation learning for decentralized wireless key establishment while highlighting
    an important tradeoff between key diversity and reconciliation reliability.
- arxiv_id: '2609.22338'
  title: 'Learning and Control Beyond Linearity: Towards a Non-asymptotic Theory for Bilinear Systems'
  abstract: This tutorial provides a unified view of the emerging area of bilinear learning and control. Using linear systems
    as a benchmark, it explains what fundamentally changes in the bilinear settings, how recent theory addresses finite-sample
    learning and control, and how these ideas connect to broader themes in nonlinear control, representation learning, and
    data-driven decision making. For learning, we emphasize tools that are particularly useful in the bilinear settings, such
    as one-sided Bernstein's inequality for dependent and heavy-tailed covariates, blocking arguments, and martingale concentration
    for input-dependent noise. We then apply these tools to obtain finite-sample learning guarantees for fully observed bilinear
    systems, partially observed bilinear systems, and linear systems with bilinear observations. For control, we discuss quadratic
    control from bilinear observations, where the classical separation principle fails, and review tractable approaches based
    on belief-space receding horizon control. We also cover stabilization of bilinear dynamics under state feedback using
    semi-definite programming, LMI relaxations, sum-of-squares methods, and Koopman-based lifting. We conclude by discussing
    connections to reinforcement learning and machine learning, and some open problems in combined learning and control of
    bilinear systems.
- arxiv_id: '2609.14922'
  title: Steady-State Convergence of Stochastic Approximation
  abstract: For constant-stepsize stochastic approximation (SA), the iterates converge in distribution to a stationary law
    that depends on the stepsize $\alpha.$ Steady-state convergence (SSC) concerns the limit of the scaled stationary distribution
    as $\alpha \downarrow 0.$ Existing SSC theory requires i.i.d. or additive noise and global differentiability of the mean
    operator, and yields suboptimal rates. We develop a unified SSC theory for constant-stepsize contractive SA driven by
    Markovian, multiplicative noise, covering both locally differentiable and locally nondifferentiable mean operators. A
    key methodological contribution is a multi-step universality framework that progressively reduces the original stochastic
    recursion to tractable auxiliary dynamics while preserving its steady-state limit. Under local quadratic linearization
    at the fixed point, we obtain a Gaussian approximation of the scaled steady state at the optimal rate $O(\sqrt{\alpha})$
    in Wasserstein-2 distance, which further gives finite-time Gaussian approximations for the raw iterates. In the locally
    nondifferentiable regime, we establish a general SSC result and show that the leading-order asymptotic bias can be of
    order $\sqrt{\alpha}$, in contrast to the $\alpha$-order bias in the smooth regime. We apply the theory to Markovian linear
    SA and asynchronous Q-learning, neither of which is covered by prior results. We further propose a bias-reduction scheme
    for Q-learning that requires no knowledge of the local smoothness regime, validated by numerical experiments.
- arxiv_id: '2609.15603'
  title: A Unified Vision-Language Model for PSMA PET/CT Report Generation, Visual Question Answering, and Lesion Segmentation
  abstract: 'Accurate PSMA PET/CT interpretation is central to prostate cancer management, yet existing PET/CT AI models typically
    address isolated tasks. We propose a unified PSMA PET/CT vision-language model for report generation, visual question
    answering, and lesion segmentation. The framework adopts an LLaVA-style architecture, comprising a PET/CT vision encoder,
    an MLP-Mixer projection module, a LoRA-tuned large language model, and a 3D segmentation branch. Training followed a four-stage
    strategy: vision encoder pretraining, projection-layer alignment, VLM fine-tuning, and final multitask tuning. Language
    tasks used 5,747 PSMA PET/CT datasets with paired reports, while segmentation used the PSMA subset of AutoPET. The model
    outperformed PET2REP and a CT-based baseline across standard report-generation metrics, improved performance across VQA
    question types, and achieved higher Dice and lesion-level overlap F1 than SegAnyPET and nnUNet. These results support
    the feasibility of a unified framework for structured, interactive, interpretable PSMA PET/CT analysis with voxel-level
    grounding within a single multitask model architecture.'
- arxiv_id: '2609.15561'
  title: Can We Trust the Judges? Validation of Factuality Evaluation Methods via Answer Perturbation
  abstract: Evaluating the factual correctness of large language models (LLMs) is vital for many applications. But are our
    evaluation tools themselves trustworthy? Despite the rise of factuality-based metrics, their sensitivity and reliability
    remain underexplored. This paper introduces a meta-evaluation framework that systematically tests these metrics using
    controlled corruptions of gold standard answers. Our method generates ranked outputs with known degrees of degradation
    to probe how metrics capture nuanced changes in truthfulness. Our experiments reveal that pipeline-based methods, such
    as the RAGAS's factual correctness metric, better track degradation than LLM-as-judge approaches. We also propose a new
    variant of the factual correctness metric that provides a competitive and cost-efficient.
- arxiv_id: '2609.18135'
  title: 'DualSQL: Text-to-SQL with Multi-Agent Reinforcement Learning'
  abstract: 'State-of-the-art Text-to-SQL systems are typically multi-agent pipelines centered around two fundamental tasks:
    schema linking and SQL generation. However, existing work trains separate models for each task, failing to leverage the
    synergy between these interrelated tasks. In this work, we propose DualSQL, a new Text-to-SQL system consisting of two
    agents powered by a single model backbone. The agents share the same model weights and agentic scaffold, enabling joint
    optimization through a robust multi-agent reinforcement learning (RL) framework. We design three database access tools
    to facilitate effective multi-step reasoning grounded to interactions with the databases. To improve training and avoid
    model collapse, we introduce a set of rollout guardrail mechanisms that stabilizes multi-agent RL training, supporting
    DualSQL to keep improving during training. We also introduce a new SQL correctness metric, robust execution match (REX),
    to more accurately judge SQL correctness and assign reward signals. Being trained on only 3755 examples, DualSQL-4B achieves
    an impressive 68.0% execution accuracy on the BIRD development set, matching previous 7B models. DualSQL-8B further improves
    to 71.1%, outperforming previous state-of-the-art single-model solutions with 32B parameters. These results demonstrate
    the strength of joint multi-agent reinforcement learning for building high performance Text-to-SQL pipelines.'
- arxiv_id: '2609.13706'
  title: Rank-Consistent Set Reasoning for Co-Salient Object Detection
  abstract: Co-salient object detection (Co-SOD) requires a model to find foreground regions that are salient in individual
    images and supported by the image group. We present \emph{Rank-Consistent Set Reasoning} (RCSR), a supervised dense-prediction
    framework that models a group as an unordered set rather than as a sequence of images or a semantic label. The core idea
    is to rank how strongly each spatial region agrees with a small collection of learned group slots at every image scale,
    and to aggregate these ranks with a robust trimmed statistic. This suppresses accidental pairwise matches and prevents
    one atypical group member from dominating the shared representation. A set encoder builds group slots directly from multi-scale
    visual features, while a rank-consistency gate measures whether the ordering of candidate regions is stable across group
    members. The gated slots are decoded jointly with per-image features to produce co-saliency maps. The model contains no
    natural-language branch, no open-vocabulary detector, and no external segmentation model. We further introduce a group
    permutation objective and hard-distractor augmentation so that the model learns the properties of a set-level target rather
    than memorizing image order or isolated visual saliency. We formulate an evaluation protocol for CoCA, CoSal2015, and
    CoSOD3k, together with tests of group-size robustness, distractor rejection, order invariance, and cross-dataset transfer.
- arxiv_id: '2609.16578'
  title: 'GraLoD: Graphics-Inspired Continuous Level-of-Detail Learning for Image Restoration'
  abstract: The spatial support required for image restoration varies across degradation types, image regions, and reconstruction
    stages. However, most existing methods rely on predefined multi-scale hierarchies and aggregate features through fixed
    fusion or attention, leaving the representation scale itself largely determined by the network architecture. This limitation
    becomes more pronounced when a task-specific backbone is extended to heterogeneous degradations in all-in-one restoration.
    Inspired by level-of-detail (LOD) rendering in computer graphics, we propose GraLoD, a plug-and-play framework that treats
    restoration scale as a spatially varying and stage-dependent continuous variable. GraLoD reuses the native encoder hierarchy,
    aligns its multi-scale features into a shared LOD representation space, and predicts a stage-conditioned LOD field at
    each decoder stage. Each spatial location then continuously queries only two neighboring representation levels, enabling
    the effective restoration scale to adapt to both local image content and reconstruction progress. To prevent degenerate
    or arbitrary scale selection, we further introduce minimal-sufficient footprint calibration (MSFC) together with structure-aware
    regularization (SAR) to encourage restoration-effective and spatially coherent LOD assignments. GraLoD can be directly
    integrated into existing restoration backbones without redesigning their fundamental feature-processing blocks. Extensive
    experiments demonstrate consistent improvements in task-specific and all-in-one restoration.
- arxiv_id: '2609.13825'
  title: 'ViperQ: Order Flow Pattern Recognition via Auction Market Theory for Reinforcement Learning Trading'
  abstract: 'Reinforcement learning trading systems published in the academic literature overwhelmingly rely on price-aggregate
    state representations (OHLCV bars) or limit-order-book depth features, leaving microstructure pattern theories from the
    practitioner literature, namely Auction Market Theory and Market Profile, without a peer-reviewed computational instantiation.
    We present ViperQ, a reinforcement learning system whose state representation is built explicitly from Auction Market
    Theory primitives: Volume Point of Control, Value Area position, Low Volume Node flags, Cumulative Volume Delta divergence,
    and tape-velocity signatures, assembled into a 20-dimensional Z-normalised vector. Two Proximal Policy Optimisation agents
    are trained with a prospect theory-grounded asymmetric reward function that penalises losing holds at a magnitude consistent
    with Kahneman and Tversky''s loss-aversion coefficient. Evaluated on a held-out twelve-month partition of institutional
    tick data the agents have never seen, ViperQ achieves +163.6% ROI on TSLA (-27.5% max drawdown, 27,019 trades) and +116.5%
    ROI on NVDA (-47.8% max drawdown, 12,892 trades) under zero leverage. The results establish Auction Market Theory features
    as a tractable structured input modality for sequential decision-making on financial time series and motivate further
    work on microstructure-aware policy learning.'
- arxiv_id: '2609.17039'
  title: 'Bi-FlowGS: Bridging Generative View Completion and Gaussian Geometry through Bidirectional Flow Co-Refinement'
  abstract: Sparse-view 3D scene reconstruction with 3D Gaussian Splatting (3DGS) is inherently underconstrained. Plausible
    renderings can also coexist with erroneous Gaussian geometry, as errors in positions or depths may be concealed by opacity,
    scale, and appearance; we term this failure mode Geometry Cheating. Existing regularization methods constrain geometry
    but remain limited to observed views, while video-diffusion-based methods complete unseen views yet mainly use them as
    RGB pseudo-supervision, underusing motion and temporal priors and lacking explicit geometry supervision. We present Bi-FlowGS,
    which uses optical flow to bridge generative view completion and Gaussian geometry regularization. Our plug-and-play Video-to-Geometry
    Flow Distillation (V2G) distills temporal correspondence priors from restored videos into Gaussian geometry to alleviate
    Geometry Cheating. Conversely, Geometry-to-Video Flow-Guided Restoration (G2V) uses the current 3DGS geometry to guide
    temporally consistent video restoration, providing more reliable generative supervision. Together, V2G and G2V form an
    implicit bidirectional co-refinement process, enabling restored videos and the optimized 3DGS scene to iteratively improve
    each other. Experiments demonstrate improved rendering quality and geometric consistency across wide-baseline and unbounded
    360{\deg} benchmarks.
- arxiv_id: '2609.16378'
  title: 'Geometry vs Structure: Graph-Based Diagnostics for LiDAR Point-Cloud Simulation Fidelity'
  abstract: 'Digital twins provide a scalable and cost-effective complement to real-world testing for validating autonomous-driving
    and advanced driver-assistance system (ADAS) sensor pipelines. However, quantifying their fidelity remains challenging,
    particularly for 3D LiDAR point clouds, where conventional geometric metrics may overlook important structural discrepancies.
    We present a graph-based framework for evaluating the structural fidelity of simulated LiDAR point clouds against real-world
    scans. While scan-level metrics such as Chamfer distance capture point-wise geometric similarity, they do not explicitly
    represent connectivity, topology, or object-level organization. Our framework constructs graphs from real and simulated
    point clouds, applies Louvain community detection to identify spatially coherent subgraphs, and matches corresponding
    communities using centroid proximity. For each matched pair, we compute $r_\lambda$, a bounded graph-spectral metric motivated
    by Weyl''s inequality, and compare it with density-aware Chamfer distance (CDC) as a geometric baseline. Controlled perturbation
    experiments demonstrate that $r_\lambda$ is invariant to rigid transformations and robust to sensor noise while remaining
    sensitive to structural deformation. We evaluate the framework on 50 paired real and simulated LiDAR scans acquired using
    a Velodyne VLP-32C sensor and CARLA, respectively. The dataset contains more than 1,000 matched communities across four
    representative classes: vehicles, vegetation, trees, and building walls. The results show that geometric and structural
    measures capture complementary aspects of simulation fidelity, supporting graph-spectral analysis as an additional diagnostic
    layer for validating digital twins in ADAS and autonomous-driving applications.'
- arxiv_id: '2609.11917'
  title: 'Data Scarcity and Model Sparsity: Mixtures-of-Experts Overfit More to Repeated Data'
  abstract: 'As the supply of human-written text is exhausted, it has become standard practice to repeat language model training
    data. Prior work has studied data repetition for densely activated Transformers, but the effects of data repetition remains
    largely unexplored for recently dominant sparse architectures such as Mixture-of-Experts (MoE), despite their increased
    compute efficiency. We vary data repetition rates across single- and multi-domain data mixes, and across MoE settings,
    including expert count and granularity. We consistently find, for models ranging from 80M to 1B active (8.5B total) parameters,
    that MoEs degrade more rapidly under data repetition. This effect increases with sparsity, dictated by total rather than
    active parameters. While 80M dense models can repeat data over 8x with minimal degradation, MoEs instead begin to suffer
    at 4x, and deteriorate rapidly, ceding their performance benefits in all-unique data settings to underperform dense models
    after 32x. We experiment with existing regularization methods as a potential remedy. We find that some methods, such as
    dropout, can mitigate overfitting. In particular, with strong masking-based regularization, MoEs are able to outperform
    dense models even when data is repeated more than 64 times. However, no method fully matches the performance of all-unique
    training data. Finally, we analyze internal mechanisms correlated with MoE overfitting in high repetition regimes, and
    find that MoE routing universally stabilizes early in training, and that expert specialization correlates with overfitting
    to repeated data. In sum, our work addresses the adverse interactions between sparsity and data repetition: we present
    evidence for the core mechanisms of overfitting and its potential remediation, and suggest promising avenues for future
    methods to reduce over-specialization in model parameters by disrupting memorization patterns.'
- arxiv_id: '2609.13718'
  title: 'Oops, Not Now: PEARL, a RAG-Based Support Agent for Gameplay and What Players Want from AI Help'
  abstract: 'AI-powered gameplay support agents hold promise for game-based learning, yet grounding generative models in structured
    game data remains an open challenge. We present PEARL (Parallel Education Agent for Reflection and Learning), a dual-component
    Retrieval-Augmented Generation (RAG) system that combines semantic knowledge retrieval with structural board-state matching
    to deliver contextualized scaffolding in Parallel, a puzzle game for learning parallel programming. PEARL operates on
    two input streams (natural language queries and board topology), retrieving both conceptual explanations of gameplay moves
    and peer-generated board states as evidence: capabilities unavailable to a standard Large Language Model (LLM) with game
    state access alone. In a qualitative evaluation (N=10) comparing PEARL against an existing community-based Open Player
    Model (OPM) visualization system, participants preferred the visualization system on perceived usefulness and reported
    higher frustration with PEARL; five of ten minimized or abandoned the AI tool during play. Proactive delivery, generic
    responses, and trust deficits drove disengagement, while a subset of four participants found PEARL''s grounded explanations
    complementary to visualization in specific contexts where they initiated the interaction. We position PEARL as a deployed
    design probe whose failure modes inform a concrete design agenda for AI gameplay support, captured as seven open problems
    for the community.'
- arxiv_id: '2609.17890'
  title: 'OBC-Prune: Outcome-Based Calibration for Large Reasoning Model Pruning'
  abstract: Large reasoning models (LRMs) generate long chain-of-thought traces before answering, creating significant inference
    overhead. Pruning can reduce this cost, but its effectiveness depends on the calibration data used to estimate parameter
    importance. Recent work calibrates on the model's own rollouts instead of generic dataset, but treats all reasoning tokens
    uniformly, regardless of whether they contribute to successful reasoning. As a result, pruning protects weights by statistical
    salience rather than by their contribution to correct reasoning, so weights behind erroneous computation survive as readily
    as those behind correct computation. These erroneous patterns then get carried into the pruned model, degrading reasoning
    quality, producing both lower accuracy and longer reasoning traces. We propose Outcome-Based Calibration for Large Reasoning
    Model Pruning (OBC-Prune) to close this gap. OBC first constructs difficulty-matched pairs of correct and incorrect rollouts
    from problems the model answers inconsistently. It then estimates the causal importance of each reasoning sentence through
    intervention-based analysis, quantifying how removing its influence affects subsequent predictions. These causal importance
    scores are converted into per-token weights that rescale the calibration activations used by one-shot pruning methods
    (SparseGPT, Wanda, ALPS), without modifying the underlying pruning algorithms. Experiments on DeepSeek-R1-Distill-Qwen
    1.5B, 7B, and 14B models at 40\% and 50\% sparsity demonstrate consistent improvements over state-of-the-art calibration
    baselines across most model sizes and sparsity levels on MATH500, LiveCodeBench, and AIME 2025. These results indicate
    that preserving causally important reasoning circuits is a substantially more effective pruning objective than uniformly
    preserving observed activations.
- arxiv_id: '2609.18435'
  title: 'WetRobo: A Reproducible Robot Kit for Coding Agents in Biological Laboratories'
  abstract: 'Automating biological research requires general-purpose, reproducible robot systems that allow individual wet-lab
    researchers to delegate robot tasks without performing teleoperation or neural-network training. Vision-language-action
    policies have been proposed for general-purpose arms, but can lose performance when their operating environment changes.
    We therefore built WetRobo, a robot kit that can readily transfer between laboratories. It consists of one robot arm,
    laboratory equipment (an incubator, a reagent bottle with a cap, and a Petri dish), the existing code that moves the arm,
    teleoperation demonstrations of each task that we recorded, and a general AGENTS.md skill file. A biological experimentalist
    provides natural-language tasks without collecting local teleoperation training data or training a neural network. The
    coding agent observes the local laboratory and writes and executes programs, using external tools as needed for adaptation.
    We demonstrate use of WetRobo with OpenAI Codex (gpt-5.6-sol) on three successful tasks: lifting a Petri dish lid, removing
    a bottle cap, and opening the incubator door, all in real-world laboratories. The coding agent achieved the cap task in
    both laboratories, Lab X and Lab Y, whereas a VLA fine-tuned on Lab X demonstrations succeeded there but failed to transfer
    to Lab Y. These results point to a practical route for laboratory robotics: instead of training a policy for each laboratory,
    distribute a kit and let a coding agent adapt it in each laboratory. Code, demonstrations, and the evolved programs are
    available at https://github.com/tsudalab/WetRobo.'
- arxiv_id: '2609.18545'
  title: Revisiting the Objective of Echo Chamber Detection
  abstract: In this paper, we study the detection of an echo chamber in a social network, i.e., the identification of a set
    of nodes that agree on a topic, while disagreeing with the rest of nodes. We argue that this problem is different from
    other social network analysis problems such as community detection, and from other graph problems such as maximum graph
    cut and maximum clique. To the best of our knowledge, we are the first to formalize the objective function of echo chamber
    detection, by using the theory of Fourier transforms of set functions (Stobbe and Krause, 2012). We propose scalable semidefinite
    relaxation, solved via an interior point method and sparse linear algebra. Experimentally, our algorithm recovers the
    ground truth echo chamber better than competing methods on small synthetic experiments. Our algorithm produces echo chambers
    with better network properties than competing methods on large real-world datasets. To independently validate our proposed
    objective function, we show that our algorithm finds echo chambers with more agreements with suspended users than competing
    methods on a small real-world dataset.
- arxiv_id: '2609.14969'
  title: Online Language Adaptive Sampling for Better Distributed Cross-lingual Gains
  abstract: Realignment is a promising approach for improving the cross-lingual transfer ability of multilingual language
    models, particularly for extremely low-resource languages (LRLs). However, existing realignment methods rely on uniform
    and random sampling of parallel sentences across languages, which may be suboptimal under limited batch sizes. In practice,
    models may benefit from seeing certain languages more frequently, especially those that are poorly aligned, and the optimal
    distribution can evolve throughout training. In this work, we propose a simple yet effective adaptive sampling strategy
    that assigns trainable sampling probabilities to each language. Languages that contribute more to the realignment loss
    are sampled more frequently in subsequent batches, and the optimal distribution can evolve throughout training. Our method
    employs an inner-outer optimization loop with a small overhead, leading to consistent performance improvements and, more
    importantly, distributing the gains across languages. We observed a $+0.67$ average performance increase on all tasks
    with XLM-R, and $+0.60$ with Gemma 2 9B compared with uniform realignment. Furthermore, our method is robust across different
    models. Code available at https://github.com/felixgaschi/multilingual-alignment-and-transfer.
- arxiv_id: '2609.12594'
  title: Poisson-Corrector Complexity Bounds for Moreau--Yosida Unadjusted Langevin Sampling
  abstract: We study the classical Moreau--Yosida unadjusted Langevin algorithm (MYULA) for $\pi(\,\mathrm{d} x)\propto e^{-f(x)-g(x)}\,\mathrm{d}
    x$, where $f\in C^2(\mathbb{R}^d)$ is $m$-strongly convex with $L_f$-Lipschitz gradient and $g:\mathbb{R}^d\to\mathbb{R}$
    is convex and globally $G$-Lipschitz. For the Moreau-smoothed target $\pi_\lambda$ and the MYULA invariant law $\widehat\pi_{\lambda,h}$,
    we prove \[ \sqrt m\,W_2(\pi_\lambda,\widehat\pi_{\lambda,h}) =O(h)+\widetilde O(h^{3/4}) \] under $0<h(L_f+\lambda^{-1})\le
    c$, with only logarithmic dependence on $\lambda^{-1}$ in the error coefficients. Combining this estimate with the Moreau
    approximation bias yields $\widetilde O(\varepsilon^{-4/3})$ iterations to achieve $\sqrt m\,W_2(\mu_N,\pi)\le\varepsilon$,
    for fixed model parameters and initialization. The proof combines a discrete Poisson corrector with active-trace estimates
    and a shared-noise bound for the exact--Euler two-point curvature.
- arxiv_id: '2609.17762'
  title: Is Luke the Author of a Gospel and the Acts of the Apostles?
  abstract: According to Christian tradition, Luke is credited with authoring a Gospel and the Acts of the Apostles, even
    if his name does not appear in either book, both originally written in Koine Greek. Several biblical scholars assume that
    both texts were written by a common author, while others deduce the presence of two authors. Different studies have been
    found to support either finding, some based on qualitative evaluation, while a few others consider the occurrence frequency
    differences between the two books. To propose an enhanced quantitative analysis, this study is grounded on two recent
    authorship attribution models. The Burrows' Delta, applied with eleven different feature sizes, demonstrates common authorship.
    An author verification model confirms this finding. The following experiments consider several stylistic representations,
    feature sizes, and distance functions to confirm that Luke is the true author of both books.
- arxiv_id: '2609.11123'
  title: 'HERALD: High-Fidelity Exemplar Retrieval with Adaptive Landmark Distillation for Heterophily-Aware Graph Condensation'
  abstract: Graph condensation aims to produce a small surrogate graph that preserves the downstream node-classification performance
    of a much larger original graph. Existing methods rely on Weisfeiler-Lehman neighbourhood aggregation or gradient-based
    distribution matching, both of which assume that adjacent nodes share the same label, an assumption that breaks down under
    heterophily. We propose HERALD (High-fidelity Exemplar Retrieval with Adaptive Landmark Distillation), a gradient-free
    graph condensation framework that adapts the node scoring and feature selection in the condensation pipeline to the graph's
    measured heterophily. HERALD selects features via a joint Fisher-discriminability and activation-density criterion that
    down-weights aggregated representations on heterophilic graphs, and scores nodes by a weighted combination of prototype
    representativeness, decision-boundary proximity, and Local Intrinsic Dimensionality (LID), where the weights are driven
    by a smooth sigmoid function of the heterophily ratio. Nodes are then assembled into a condensed subgraph through score-ordered
    BFS expansion, Personalised PageRank pruning, and class rebalancing, all at an identical storage budget to BONSAI, enabling
    direct comparison. Experiments on eight benchmark datasets spanning homophilic and heterophilic settings show that HERALD
    matches or outperforms state-of-the-art condensers on heterophilic graphs and remains competitive on homophilic ones across
    four GNN architectures.
- arxiv_id: '2609.17475'
  title: 'JustFit: Just-in-Time State Management for Local LLM Serving'
  abstract: 'Local agents need memory for model execution and working history. We present JustFit, an MLX runtime that coordinates
    their overlapping allocations: KVExec executes and checkpoints four-bit KV with bounded workspace, PhaseSwap loads phase-dependent
    components, and StateTrans preserves history across execution modes. With Qwen3.8-27B MXFP4 on a 24 GiB M4 Pro MacBook,
    JustFit reaches 327,680 retained positions across two requests, 10.67 times the evaluated baseline''s 30,720-position
    single-request record. One request completes the full 262,144-position native window at median 5.986 tokens/s. Each shape
    completes 16,384 outputs per request in three fresh processes: B1 uses one cold build and two prefix extensions; B2 uses
    three ordered prefix extensions (Section 4). Image encoding can proceed while preserving a live 196,608-input text request.
    A controlled, repetitive 32K+6K workload reaches median 18.284 tokens/s at 15,626 MiB; a separate AIME 2026 evaluation
    scores 29/30. Coordinating execution and state lifetimes makes longer histories feasible on personal hardware.'
- arxiv_id: '2609.15305'
  title: 'When Correlations Mislead: Confounder-Aware Multi-View Urban Region Representation Learning'
  abstract: Urban region representation learning commonly combines heterogeneous data sources, such as mobility flows, points
    of interest, and land-use information, to support tasks including mobility analysis, public safety forecasting, and service
    demand estimation. Existing multi-view methods typically improve region embeddings by strengthening interactions across
    views. However, such methods often overlook view-specific regional structures and may propagate correlations induced by
    shared latent factors, which can reduce the stability of downstream predictions. To overcome this major limitation, we
    propose CURE, a confounder-aware framework for multi-view urban region representation learning. CURE first encodes each
    view with its regional graph structure, estimates a shared latent component, and then reduces its projected influence
    before cross-view interaction. A hierarchical graph-aware fusion module subsequently aggregates the residual view representations
    using local and global regional contexts Experiments on three real-world cities show that CURE improves predictive performance,
    remains robust under missing and noisy input views, and provides reliable cross-view integration through shared component
    separation and context-dependent view weighting.
- arxiv_id: '2609.12327'
  title: 'LoRA-RC: Reservoir Computing with Low-Rank Adaptation'
  abstract: Reservoir computing (RC) trains only a linear readout over a fixed recurrent layer, making it fast and data-efficient
    for online prediction. However, a static reservoir degrades under system drift, readout-only adaptation is then insufficient,
    and unconstrained reservoir adaptation can destroy the echo-state and incremental stability properties that make RC reliable.
    This paper proposes LoRA-RC, which adapts the recurrent matrix through a low-rank correction driven by streaming prediction
    errors. The base reservoir and adaptation bases are fixed offline; a small core matrix is adapted online, projected onto
    a spectral-norm ball, and low-pass filtered at each step. The projection guarantees that every applied recurrent matrix
    remains within a certified contraction set, and an incremental input-to-state stability bound is established for the reservoir
    along each online adaptation path, with path-independent rate and gain. On a Lorenz system with an abrupt parameter drift,
    LoRA-RC cuts post-drift prediction error by 56% versus a fixed RC and 51% versus readout-only adaptation; ablations over
    20 seeds show that removing the projection inflates this error by more than a factor of 40.
- arxiv_id: '2609.18346'
  title: 'Faithful yet Collusive: Why Chain-of-Thought Monitoring Cannot Detect Collusion in LLM Pricing Agents under Oligopolistic
    Competition'
  abstract: 'Large language models (LLM) deployed as autonomous pricing agents may sustain supracompetitive prices through
    tacit coordination. We develop a causal graph divergence framework that separately measures structural faithfulness and
    intent faithfulness of LLM pricing agents in Bertrand competition. Across nine LLMs under duopoly and triopoly conditions,
    collusive behavior and chain-of-thought (CoT) faithfulness dissociate along both dimensions: the most collusive model
    accurately reports cooperative intent yet reasons structurally unfaithfully, while the most structurally faithful model
    sustains supra-Nash pricing under both market structures. These findings establish that CoT monitoring alone cannot serve
    as a standalone safeguard against algorithmic collusion.'
- arxiv_id: '2609.11207'
  title: Convex Optimization with Nested Evolving Feasible Sets (CONES) under Time-Varying Loss Functions
  abstract: Convex Optimization with Nested Evolving Feasible Sets (CONES)} was introduced in \cite{CONESVaze} where the objective
    function \(f\) remains fixed but the feasible region evolves over time as a nested sequence \(S_1 \supseteq S_2 \supseteq
    \cdots \supseteq S_T\). The goal of an online algorithm is to simultaneously minimize the regret with respect to hindsight
    static optimal benchmark and the total movement cost $M_\cA(T)$ while ensuring feasibility at all times. CONES is an optimization-oriented
    generalization of the well-known \emph{nested convex body chasing} (NCBC). In this paper, we extend CONES to allow for
    loss functions $f_t'$s to also change over time. When all loss functions are convex, we show that the projected proximal
    algorithm achieves $O(T^{1-\beta}), O(T^\beta)$ simultaneous regret and movement cost, respectively, for any $\beta \in
    [0,1)$, over a time horizon of $T$. We also show that any {\it weakly adaptive} online algorithm with $O(T^\beta)$ regret
    has a movement cost of $\Omega\left(T^{\frac{1-\beta}{2}}\right)$ for any $\beta \in [0,1)$. When all loss functions are
    strongly convex, we show that the projected proximal algorithm simultaneously achieves $O(1)$ regret and a movement cost
    of $O(\log T)$. To complement this, we show that any online algorithm with sublinear {\it anytime} regret has a movement
    cost of $\Omega\left(\log T\right)$.
- arxiv_id: '2609.11067'
  title: 'When Noise Fabricates Bias: The Fragility of LLM-as-a-Judge Bias Measurement under Noisy Text'
  abstract: 'Large language models are increasingly used as judges to measure social bias in text, yet the passages they judge
    are often noisy, containing typos, informal spelling, and broken punctuation. The consequences of such surface noise for
    social bias measurement remain unclear. To investigate this question, we apply five realistic noise conditions at multiple
    intensity levels to 3,822 stereotype-related responses and compare the resulting bias judgments with those on the original
    text. We find that such surface noise does not degrade bias measurement symmetrically: it is far more likely to turn neutral
    judgments into biased ones than biased judgments into neutral ones, by up to a 120x margin. We further observe two non-obvious
    effects across four LLM judges: in the most fragile judge the distortion is at its purest at mild, realistic noise levels,
    where erasure is scarcest, and as judges grow robust it attenuates toward parity rather than reversing. Bias measured
    on noisy text is therefore systematically overestimated, most in the categories that matter most for fairness.'
- arxiv_id: '2609.14352'
  title: 'Beyond Natural Images: Rethinking AI-Generated Image Detection in Documents'
  abstract: 'AI-generated image detection has attracted increasing attention, but existing evaluations mainly focus on natural
    images, leaving AI-generated document images largely underexplored. This omission is concerning because documents often
    appear in sensitive real-world scenarios, such as invoices, expense reports, certificates, and medical records. In this
    paper, we first construct a controlled diagnostic benchmark, AIGDoc-Pilot, and reveal that existing detectors suffer substantial
    performance degradation on AI-generated document images, with the mean AUC dropping by more than 7%. Based on this, we
    further reveal two document-specific properties behind this gap: generation artifacts exhibit strong spatial inconsistency
    across local regions, and text density significantly affects real-synthetic separability, where text-dense regions offer
    stronger discriminative evidence. Motivated by these findings, we construct AIGDoc, a larger document-centric dataset
    containing diverse real-world documents and AI-generated counterparts produced by multiple advanced generation and editing
    models. Extensive experiments on AIGDoc demonstrate that existing detectors still struggle to reliably identify AI-generated
    documents, while document-based training partially narrows the gap. Together, these results offer valuable insights for
    developing dependable and generalizable detectors in document-centric scenarios. The code and datasets will be made publicly
    available upon acceptance of the paper.'
- arxiv_id: '2609.11115'
  title: 'Benchmark Radar: A Living Database and Search Engine for AI Benchmarks and Evaluation'
  abstract: 'Benchmark researchers and developers of large language models (LLMs) and other AI systems need to find relevant
    evaluations, locate their benchmark datasets and code, and understand the settings behind reported scores. We present
    Benchmark Radar, a living database and search engine for retrieval and discovery of AI benchmarks, covering LLM evaluation,
    agentic and tool-use benchmarks, coding, reasoning, safety, and domain-specific evaluations. The system combines daily
    discovery of benchmark papers, repositories, datasets, and releases with a searchable benchmark catalog, mentions in model
    cards and technical reports, and score histories. It retains source identities and citations so readers can inspect candidate
    benchmarks and their evaluation evidence. Daily discovery draws on 37 sources: 13 direct connectors and 24 first-party
    research and engineering feeds. The catalog contains 1,283 source records drawn from 4 benchmark catalogs and 12,916 numeric
    observations on 790 records. We describe collection and retrieval, audit the full catalog, and examine benchmark saturation,
    adoption trends, and the limits of score comparisons. A worked example walks through a complete prior-art search, showing
    how to query the catalog and inspect benchmark evidence when designing a new evaluation. We release the web dashboard
    with a benchmark leaderboard, a Pareto frontier view of score against measured use, saturation and trend views, daily
    feeds, downloadable evidence, a command-line interface (CLI) for offline queries, and reproducible analysis.'
- arxiv_id: '2609.12890'
  title: 'Large Distant Gradients Need Not Be Reliable: reliability-weighted credit assignment for long-horizon autoregressive
    forecasting'
  abstract: 'In autoregressive forecasting, long prediction rollouts provide distant supervision, but backpropagation through
    time (BPTT) carries gradients from those losses through many autoregressive steps. Repeated Jacobian products can make
    distant gradients dominate the update while amplifying predictable signal and unpredictable innovation together; a large
    distant gradient therefore need not carry reliable learning signal. Motivated by this, we introduce Internal Dual-Wiener
    routing (Internal-DW), a backward-only intervention that preserves the full forward rollout and all step losses while
    reliability-weighting internal gradient routes. At each residual block, we derive bounded Wiener gains for the identity
    and nonlinear routes that balance preserving predictable learning signal against suppressing unpredictable variation,
    and estimate them from route-level gradient statistics and an explicit noise model. In a controlled system with known
    gradient signal-to-noise ratio (SNR), we show that distant gradients can grow even as their SNR falls, and that Internal-DW
    reduces error in recovering predictable gradient signals and improves forecasting. On four history-dominated, weak-drive
    testbeds, Internal-DW reduces forecast error by 5.2%-13.8% relative to full BPTT, outperforms gradient clipping and Jacobian
    regularization on three testbeds, with similar performance on shear flow, and outperforms validation-selected truncated
    BPTT (TBPTT) on three. It also extends or preserves the fitted optimal training-horizon range across these four testbeds.
    Across benchmarks, the current Internal-DW estimator has a clear applicability boundary: its benefit diminishes or reverses
    when usable history is limited or when the selected sampler fails to represent dominant drive-dependent variation. The
    results show that retaining long-horizon supervision does not require trusting every backward contribution equally.'
- arxiv_id: '2609.19385'
  title: Mammography Foundation Models for Opportunistic Prediction of Major Adverse Cardiovascular Events
  abstract: Cardiovascular disease (CVD) remains the leading cause of death among women, yet cardiovascular risk assessment
    often relies on clinical variables that may be missing, outdated, or unavailable in routine care. Screening mammography
    offers an opportunity for opportunistic cardiovascular risk stratification because it is routinely acquired and contains
    vascular features, including breast arterial calcifications (BAC), that are associated with cardiovascular risk and events.
    We evaluate whether mammography specific foundation models, originally pretrained for breast cancer-related tasks, can
    transfer to cardiovascular risk prediction without cardiovascular specific supervision or explicit BAC annotation. We
    constructed a 5-year major adverse cardiovascular event (MACE) cohort of 22,497 women linked to electronic health record
    outcomes, including 500 events (2.22% prevalence). The foundation models achieved AUROCs of 0.823 and 0.822 substantially
    exceeding an age-only model (AUROC 0.765), despite using only the screening mammogram as input, with no clinical variables.
    Both foundation models evaluated assigned substantially higher predicted risk to patients with radiologist-documented
    BAC, despite BAC never being used as a training label, and showed activation patterns consistent with vascular findings.
    Together, these findings suggest that mammography foundation models can recover clinically relevant cardiovascular risk
    information directly from mammographic pixels and suggest that screening mammography may provide an opportunistic source
    of cardiovascular risk information to complement conventional clinical assessment without additional imaging. Code is
    available in https://github.com/PauFeld/MammoCVD
- arxiv_id: '2609.15106'
  title: 'When the Wrong Key Wins: Understanding and Detecting Hallucinations in LLMs'
  abstract: 'Large language models can hallucinate even when the knowledge required for a correct answer is already available.
    We study this failure through a latent-key view of inference, where answer selection depends on competition among associations
    acquired during pretraining. We show that model predictions can be highly sensitive to individual query keywords, that
    these influential keywords exhibit entity-specific binding, and that their effects are systematically shaped by pretraining
    frequency. Multiple bindings can also compete and exhibit higher-order interactions within the same query. Based on this
    mechanism, we introduce a two-stage keyword-perturbation method for hallucination detection. By removing influential keywords
    and measuring how the model reorganizes its prediction, the method distinguishes errors caused by misleading key associations
    from correct decisions supported by diagnostic evidence. Across multiple models and benchmarks, perturbation provides
    a strong and transferable detection signal, reaching $0.910$ AUROC on probe-known ScientistQA. Finally, we extend the
    same probabilistic framework to four hallucination regimes: knowledge deficit, wrong knowledge, context distraction, and
    unstable inference. Their operational distributions across benchmarks provide diagnostic context for why different detector
    families succeed in different settings.'
- arxiv_id: '2609.12938'
  title: A Large-Scale AIS Dataset from Finnish Water
  abstract: This research paper contributes to the maritime research community by introducing a comprehensive AIS dataset
    from Finnish waters, specifically the Baltic Sea region. AIS data, initially designed for collision prevention, have evolved
    into a versatile tool with applications across diverse maritime domains. Our paper not only curates and categorises existing
    AIS datasets but also introduces a collected AIS dataset from the Baltic Sea area, renowned for its intercontinental cargo
    routes, military activities, and frozen water expanses. This dataset includes 229 millions data points and provides researchers
    with a resource for studying maritime activities and vessel behaviour in this dynamic region, notably distinguished by
    the inclusion of data from Finnish lakes. Our analysis includes a detailed listing of ship types and relevant features,
    empowering researchers to explore various maritime domains. To enhance comprehension and analysis, we provide visualisations
    of maritime traffic patterns. By publishing this AIS dataset, we aim to catalyse innovation and collaboration in maritime
    research, offering a gateway to deeper insights into maritime activities in the Baltic Sea and Finnish lakes.
- arxiv_id: '2609.14773'
  title: 'Pull: Lazy Materialization of Working Memory for Stateful LLM Conversations'
  abstract: As LLM conversations grow to hundreds of turns, full-context injection incurs $O(N^2)$ cumulative token costs,
    while lossy summarization or hard truncation irreversibly discards historical state. We propose Pull, a session router
    that maintains an addressable metadata directory via a local, deterministic Purifier (zero LLM calls, millisecond-level
    latency). At query time, the LLM lazily materializes only the turns it needs; unmaterialized turns remain accessible but
    collapsed. Unlike irreversible compression, Pull's materialization is reversible; subsequent queries can expand any collapsed
    turn. On LoCoEval (128 conversations, 12,780 turns), Pull reduces per-query context tokens (Phase 2) by 75.1 percent on
    single-hop tasks with equivalent quality ($\Delta = -0.002$, n.s.) and by 72.0 percent on multi-hop tasks with no quality
    loss ($\Delta = +0.017$). A controlled routing benchmark (7,831 queries x 10 methods) shows that entity lifecycle tracking
    is empirically a prerequisite for distance-independent routing. On BEAM 1M (14 conversations, 263 questions), Pull improves
    F1 by +55.2 percent over a truncation baseline.
- arxiv_id: '2609.13393'
  title: Privacy-Preserving Deep Joint Source-Channel Coding with In-Loop Concept Erasure
  abstract: Deep joint source-channel coding (DeepJSCC) transmits learned semantic features efficiently but can leak sensitive
    attributes such as gender, race, or speaker identity. We propose LEAPSC (LEACE-in-the-loop privacy for semantic communication),
    whose core contribution is the integration of in-loop least-squares concept erasure (LEACE) within a variational information
    bottleneck (VIB) encoder. By periodically refitting the projection operator during training, LEAPSC couples the encoder
    dynamics to the erasure mechanism, driving attribute-conditional mean differences toward zero within each task-label group
    on the fitting sample. Additional components, namely conditional value-at-risk (CVaR) tail-sensitive privacy, feature-wise
    linear modulation (FiLM) signal-to-noise ratio conditioning, and Lagrangian dual ascent, improve robustness across channel
    conditions and over the high-leakage tail of samples. On CelebA, FairFace, and Google Speech Commands, LEAPSC reaches
    task accuracy of 0.862, 0.755, and 0.925 respectively, with attacker accuracy at or below the label-only floor on CelebA
    (0.548 vs. floor 0.580) and within 2 percentage points (pp) of chance elsewhere, improving over an information-bottleneck
    adversarial baseline (IBAL) at a matched 52-epoch budget by +3.6, +2.5, and +1.3 pp (Welch's t-test, p=0.019 on CelebA).
- arxiv_id: '2609.17297'
  title: Goal-oriented probabilistic forecasting for dynamic PRB allocation in 5G networks
  abstract: Efficient physical resource block (PRB) allocation in 5G networks requires accurate demand forecasting. Conventional
    methods minimize symmetric error metrics (MAE, RMSE), ignoring the operational cost asymmetry where under-provisioning
    (service degradation) is far costlier than over-provisioning (wasted capacity). We propose a goal-oriented probabilistic
    forecasting framework that aligns model training with the operator's decision-making objectives. Specifically, we train
    DeepAR and Temporal Fusion Transformer (TFT) models using the Pinball Loss function and derive the optimal allocation
    quantile from the operator's cost matrix. Evaluation on a real beam-level 5G traffic dataset shows that the proposed approach
    reduces operational cost compared to MSE-trained baselines while maintaining calibrated uncertainty estimates. The framework
    enables dynamic PRB allocation that explicitly balances service reliability against resource efficiency.
- arxiv_id: '2609.16579'
  title: Recovering Governing Dynamics from Distributed Observations via Exact Spline Merging
  abstract: 'Scientific observations are frequently distributed across locations, time periods, and institutions. Combining
    such observations into a continuous, differentiable field enables recovering governing physical parameters from its derivatives.
    This paper makes two contributions in this setting. First, the established additive structure of fixed-basis ridge-regression
    statistics is applied to tensor-product spline fields: each data holder computes a local Gram matrix and moment vector,
    and the merged solution is mathematically identical to centralized fitting, with no raw data shared and no iterative synchronization.
    This property is specific to the fixed-feature squared-error setting; the present derivation does not establish an analogous
    guarantee for general jointly trained multilayer networks. Second, a complete pipeline connects distributed observations
    to physical parameter inference through field reconstruction, derivative extraction, and linear regression. The pipeline
    is validated on four PDEs: diffusion, wave, heat-with-source, and the nonlinear viscous Burgers equation, recovering governing
    parameters to sub-percent accuracy in the linear cases and 5\% for Burgers. In all cases, distributed merging introduces
    zero degradation relative to centralized fitting. Synthetic experiments validate parameter recovery; application to 41
    years of NOAA sea-surface temperature data validates field reconstruction and aggregation equivalence on real spatiotemporal
    observations. Source code to reproduce all experiments is available at https://github.com/NAVEENMN/splinemerge.'
- arxiv_id: '2609.30297'
  title: 'Bootstrapping Conversational Recommendation Agents At Spotify: Synthetic Data Generation and Self-Improvement Loops'
  abstract: Conversational recommendation agents are a new paradigm for content discovery, enabling users to express complex
    intents through natural language (e.g., "recommend Italian indie artists I haven't heard before"). A central challenge
    in building such agents is optimizing agent planning -- deciding how to select, sequence, and invoke tools -- particularly
    in cold-start settings where real user interactions are not yet available. We introduce a pipeline for multi-turn synthetic
    data generation and a self-improvement loop to address this challenge. The synthetic data pipeline transforms single-turn
    prompts into realistic multi-turn conversations, enabling systematic evaluation before launch. The self-improvement loop
    combines variance-based contrastive optimization with iterative refinement through a coding agent, automatically identifying
    and fixing planning and tool-use errors. Our approach improves quality by +8% on top of a highly optimized manual prompt.
    The system has been productionized and significantly accelerated iteration cycles for the launch of a conversational recommendation
    agent at Spotify. Online A/B tests demonstrate its effectiveness, with +14% user listening, +5% increase in weekly active
    users, and a 5% reduction in skip rate compared to a prior experience supporting only session refinement. This work provides
    a practical framework for accelerating the development of conversational recommendation agents in industry.
- arxiv_id: '2609.12831'
  title: 'VertexCBF: Improving Neural Control Barrier Functions via Vertex-Restricted Control Search'
  abstract: As the number of autonomous robots continues to grow, safety becomes increasingly important. Control barrier functions
    (CBFs) provide a theoretically grounded framework for ensuring safety, but existing design methods often face limitations
    in effectiveness, scalability, or interpretability, and may result in overly conservative safe sets. In this paper, we
    propose \emph{VertexCBF}, a framework for learning neural CBFs in a scalable, systematic, and explainable way. We approximate
    the stationary Hamilton--Jacobi value function using a neural network trained via a combination of physics-informed and
    sparsely supervised learning. By exploiting control-affine dynamics and a convex polytope control set, under which the
    Hamiltonian is maximized at the control vertices, we efficiently generate supervision points via GPU-parallel vertex-restricted
    tree search, while a residual architecture guarantees that the learned CBF is never larger than the specified constraint
    function. We evaluate the method on 15 systems and compare it against relevant baselines, showing that it reliably recovers
    large safe sets where the baselines are conservative or fail completely. In addition, we perform a hardware experiment
    in which a mobile robot safely avoids pedestrians using a neural CBF trained with our method.
- arxiv_id: '2609.17306'
  title: 'Mo'' Models, Mo'' Problems: How to best select model pools when designing Multi-Agent Systems'
  abstract: 'Multi-agent Systems (MAS) combine multiple model outputs to solve complex reasoning tasks. However, despite rapid
    growth of available open-source models, there is limited research on how to select optimal model candidates out of this
    massive pool. We systematically evaluate 8 model selection strategies (including model size, accuracy and answer diversity)
    across before-generation (routing) and after-generation (majority-voting, LLM-as-a-judge) MAS architectures on challenging
    scientific benchmarks. Our findings show a significant gap between theoretical oracle potential and actual performance:
    Expanding candidate pool sizes often degrades performance below that of the top performing base-model. We find that candidate
    selection within a single model family is the strategy that yields the best relative performance over a standalone model.
    These results demonstrate that adding arbitrary models to a heterogeneous MAS can introduce system instability, highlighting
    model selection as a critical design choice for multi-agent systems.'
- arxiv_id: '2609.15224'
  title: Long-to-Short Video Evidence Reasoning for Grounded Question Answering
  abstract: 'We present LOVER, a \underline{L}ong to sh\underline{O}rt \underline{V}ideo \underline{E}vidence \underline{R}einforced
    model for grounded question answering (GQA). LOVER highlights three innovations over existing reinforcement-learning (RL)
    based video reasoning models: (1) \textbf{Long-to-short Video Evidence Curriculum Learning}, which organizes RL training
    according to evidence duration and progressively adapts the model from long-range grounding to short-term reasoning; (2)
    \textbf{GQA Rewards}, which underscore the benefit of IoP reward over IoU for evidence spotting rather than strict temporal
    span overlap; (3) \textbf{Adaptive Timestamp Rendering}, which adaptively renders timestamps onto video frames using background-aware
    position and color selection to enhance temporal observability. The three designs are model-agnostic and reciprocal. They
    effectively improve QA, grounding, and grounded QA performance over different backbones. Notably, LOVER built on Time-R1
    achieves new state-of-the-art (SOTA) results among open-source models on popular GQA benchmarks: NExT-GQA and ReXTime.
    Comprehensive ablation studies further validate the effectiveness of our three innovative components.'
- arxiv_id: '2609.11450'
  title: 'Cross-Lingual Clinical Annotation Projection as Constrained Text Generation: A Six-Language Study'
  abstract: 'Background: To determine whether cross-lingual clinical annotation projection can be formulated as a text-preserving,
    document-level generative task that produces verifiable character-level annotations for multilingual clinical corpus construction,
    and to characterize its robustness and computational trade-offs relative to candidate-based projection pipelines. Methods:
    We developed a constrained LLM projection workflow that inserts entity tags directly into immutable target-language text,
    followed by deterministic validation and character-offset reconstruction. We evaluated it alongside supervised candidate-span
    projection and hybrid ML-LLM refinement for transferring Spanish Disease, Symptom, and Procedure annotations into six
    languages. Evaluation used MultiClinAI gold standard with strict span matching and character-overlap F1 Results: Direct
    LLM projection achieved the strongest and most consistent performance. GLM 5.2 obtained a mean Strict F1 of 0.9201 across
    18 language-entity combinations, while locally deployable Gemma4:31B achieved 0.9133. The best LLM configuration improved
    Strict F1 over the previous state of the art in all 18 settings, by 0.0564-0.1512, yielding 55,416 grounded mentions with
    reconstructed offsets. Conclusions: Direct LLM-based projection enables high-quality multilingual clinical annotation
    transfer and provides a practical approach for extending clinical NLP resources to languages with fewer annotated datasets
    and language-specific tools. Combined with local inference and deterministic validation, it can substantially reduce expert
    time and cost for multilingual clinical corpus construction.'
- arxiv_id: '2609.15254'
  title: Conformal Individual Treatment Effect Estimation under Networked Interference
  abstract: Conformal counterfactual prediction constructs prediction sets with finite-sample coverage guarantees for counterfactual
    outcomes and individual treatment effects under the no-interference assumption. In this work, we relax this assumption
    by allowing each unit's potential outcomes to depend on other units' treatments and covariates. In this setting, propensity-score
    reweighting does not restore weighted exchangeability, and existing methods may fail to achieve valid coverage. To address
    this issue, we develop interference-adjusted weighted conformal prediction that accounts for interference by constructing
    an observable upper bound on the ideal and unobserved conformal $p$-value under the target intervention. The resulting
    prediction sets provide finite-sample marginal coverage guarantees for counterfactual outcomes and individual treatment
    effects in both transductive and inductive settings. We also derive a sharper construction when intervention-induced changes
    in nonconformity scores are bounded. Numerical experiments show that our methods preserve nominal coverage, whereas existing
    methods may not.
- arxiv_id: '2609.17326'
  title: 'From Transient Prompts to Persistent Control: Scientific Poster Generation via Recursive Semantic-Geometric Contracts'
  abstract: Scientific poster generation distills a multimodal paper into a single-page visual artifact, forcing strict trade-offs
    between informational coverage and readability under a fixed spatial budget. Existing methods pass plans as transient
    prompts and validate individual stages in isolation. This strategy causes requirements to drift across content and layout
    modules, and previous checks to be silently invalidated. We introduce PosterVisor, a control framework that shifts poster
    generation from transient prompts to persistent control. An Orchestrator grounds rubrics in the paper and visual assets,
    compiling them into a Semantic-Geometric Contract (SGC) that binds claims and sources to required visuals, budgets, and
    spatial commitments. Only fully instantiated records become executable assertions; other usable requirements remain soft
    guidance. Recursive Contract Enforcement (RCE) dynamically triggers checks across stages as evidence emerges. Crucially,
    during repairs, RCE rechecks affected checkpoint states, preventing repair-induced regressions from propagating silently.
    We instantiate PosterVisor in HTML/CSS and editable PPTX generators. On the 100-paper Paper2Poster benchmark, PosterVisor-PPT
    improves observed mean poster-grounded QA accuracy over PosterGen (64.47% vs. 58.53%) and is preferred by human judges
    in 72.5% of non-tied pairwise comparisons (95% CI, 61.6-83.4%). A secondary 30-paper study also yields higher VLM Overall
    and PaperQuiz means. These results support rubric-compiled contracts and stage-conditioned enforcement for controllable
    poster synthesis.
- arxiv_id: '2609.17067'
  title: 'Bio-Inspired Palette Evolution in Indirectly Encoded Substrates: Timescale Compatibility Shapes Activation Function
    Discovery'
  abstract: 'Indirectly encoded neural networks can assign different activation functions to individual nodes, but the right
    functions are rarely known in advance. When the available set contains only standard monotonic functions, problems like
    parity become unsolvable, yet an all-inclusive palette underperforms a curated one. How should evolution discover which
    functions to use? We address this as a meta-learning problem, designing 13 strategies (11 inspired by biological adaptation
    mechanisms, plus baseline and oracle controls) that modify the set of available activation functions during evolution.
    Each strategy translates a biological principle into an evolutionary operator: for example, circadian-inspired oscillatory
    gating cycles functions in and out of the palette on a fixed schedule, while immune-inspired Clonal Selection permanently
    protects functions that consistently correlate with fitness. We evaluate all strategies across more than 3,000 runs on
    parity and non-parity problems, first evolving the activation palette alone, then co-evolving a per-node aggregation palette
    on harder problems; an independent replication with new seeds confirms a stable high-reliability tier, with Circadian
    holding its top rank. Bio-inspired strategies match the solve rate of a tuned baseline but converge up to twice as fast,
    with Circadian halving total compute. Strategy rankings reverse across problem types, with no strategy dominating all
    domains. Strategy success is largely shaped by timescale compatibility: strategies whose characteristic timescale matches
    the evolutionary evaluation window consistently outperform those that operate too slowly. The practical guideline: match
    the mechanism''s timescale to the evaluation budget. Rescaling the slowest strategy bypasses the oscillatory barrier entirely:
    all nine solutions solve parity with non-oscillatory activations paired with min or max aggregation.'
- arxiv_id: '2609.14060'
  title: 'AGENTQ: Quantization-Conditioned Backdoor Attacks on LLM Agents'
  abstract: 'Quantization is one of the default deployment paths for open-weight LLM agents, but it is not behavior-preserving:
    an adversary can release a full-precision checkpoint that passes audits yet misbehaves once quantized, termed as quantization-conditioned
    attack (QCA). Prior QCA work targets free-text generation, where harm is mediated by a human reader. In contrast, the
    agentic setting poses a more severe risk: the triggered payload is a structured function that can be executed without
    human oversight. We present the first study of QCA against LLM agents. We find that directly adapting prior backdoor-injection
    methods can produce malicious behavior after quantization, but substantially degrades benign utility, rendering the resulting
    attacks impractical. To understand the true upper bound of the threat, we propose AGENTQ, an attack framework that combines
    layer-banded LoRA injection with partial-PGD repair over a multi-codebook quantization-equivalence class. AGENTQ preserves
    normal agentic capability while concentrating malicious behavior in the quantized model. Across three trigger-action pairs
    and three codebooks (NF4, FP4, INT8), AGENTQ reaches up to 100% post-quantization attack success rate with minimal loss
    of benign utility, underscoring the need to make quantization-aware safety evaluation a standard requirement before open-weight
    agents are deployed.'
- arxiv_id: '2609.11190'
  title: 'Agentic Share-of-Search: A Multi-Agent AI System for Competitive Decision-Making in LLM-Mediated E-Commerce'
  abstract: 'AI shopping assistants increasingly redirect consumer discovery, creating an urgent need for tools that support
    seller-side competitive decision-making. We present a multi-agent AI system that automates competitive visibility measurement
    and root cause diagnosis in LLM-mediated ecommerce. The system introduces Agentic Share-of-Search (ASoS) as the decision
    target, deploys query agents across leading AI platforms, and uses a ReAct-based diagnostic agent to recommend prioritized
    merchandising interventions. A 100-trial ablation study, presented as a feasibility evaluation of this prototype, shows
    the agent recovers the ablated signal in 39% of trials (95% CI: 30.0% - 48.8%, 5.5x over chance), rising to 63.9% among
    high-correlation ablations.'
- arxiv_id: '2609.14316'
  title: Learning Continuous Source Responses For Generalizable AI-Generated Image Detection
  abstract: Advances in image generation have made synthetic images increasingly difficult to distinguish from real photographs,
    raising concerns about the trustworthiness of visual media. Existing AI-generated image detectors often perform well on
    in-domain data, but their robustness and cross-generator generalization remain limited. These limitations are commonly
    attributed to overfitting to shortcut cues. Although many methods seek to suppress shortcut learning, most retain binary
    classification as the training task without reconsidering how the task itself shapes the learned representations. We introduce
    CuRe, a framework for learning Continuous Source Responses that revisits authenticity detection from the perspective of
    the training task. CuRe reformulates backbone adaptation as regression of real-generated mixing ratios, providing finer
    supervision that encourages the model to capture authenticity-related variation beyond binary endpoint separation. We
    further select a compact source-response subspace to suppress nuisance variation and limit the final classifier's access
    to potential shortcut cues. Across ten public benchmarks, CuRe achieves an average balanced accuracy of 89.7%, exceeding
    the second-best method by 5.2 percentage points. Further experiments demonstrate consistent generalization gains across
    visual backbones and strong robustness to common image degradations. Code is available at https://github.com/manic-cui/CuRe
- arxiv_id: '2609.16322'
  title: Cross-Anatomy Transfer Versus Sparse Interpolation in Digital-Twin-Oriented Aortic Fluid-Structure Interaction Surrogates
  abstract: 'Surrogate credibility for fluid-structure interac- tion (FSI) requires distinguishing transfer across independent
    anatomies from interpolation within an already sampled surface. Four de-identified human aortic models from the Vascular
    Model Repository were reconstructed into separate lumen and nominal 1.5-mm wall domains and analyzed under matched first-cycle
    two-way FSI. A geometry-only LightGBM prior, selected by leave-one-anatomy-out development on three anatomies, was zero-shot
    evaluated on a fourth, then probed with a post-zero- shot sparse field-completion case study over six targets. Zero-shot
    transfer was poor across all targets. At a five-percent anchor level (203 anchors, 3,852 evaluation nodes), prior-plus-adaptation
    reached an oscillatory shear index (OSI) R2 of 0.603. However, same-anchor controls tuned only on the three development
    anatomies were stronger for several outcomes: inverse-distance weighting reached R2 = 0.829 (OSI), 0.617 (peak von Mises
    stress), 0.676 (mean stress); radial basis function interpolation reached 0.917, 0.714, 0.778. Sparse within-anatomy labels
    thus support field completion, but this four-anatomy cohort gives no evidence the cross-anatomy prior adds value beyond
    direct interpolation. We frame this as a first computational stage toward a measurement-linked digital twin: the surrogate/update
    layer is evaluated here, while larger cohorts, converged FSI, measurable patient-side inputs, and physics-informed learning
    remain future work, not a claim of a complete clinical twin. Our code, data and computation files are available at https://github.
    com/ali-nourbakhsh2005/Aortic-FSI-Sparse-Field-Completion'
- arxiv_id: '2609.15800'
  title: 'Navigating Sparse Evidence: Agentic Visual RAG via Explicit Context Selection and Consolidation'
  abstract: Visual Retrieval-Augmented Generation (VRAG) empowers models to navigate and answer queries about visually rich
    documents by retrieving relevant page images as visual evidence and reasoning over their content. However, effectively
    utilizing this visual evidence is usually impeded by two main challenges. First, answer-relevant evidence is sparse and
    may be concentrated in a small region of one page or dispersed across multiple pages. Second, existing agentic methods
    often generate answers based on raw exploration trajectories or compressed textual memories rather than an explicitly
    organized set of supporting images, making answers susceptible to exploration noise and obscuring the evidence-backed
    reasoning trace. We argue that the bottleneck lies not only in evidence discovery but also in its preservation and organization
    before answer generation. We propose SCoRE (Selection and Consolidation for Robust Evidence), a unified agent loop for
    explicit evidence selection and consolidation. During exploration, SCoRE retains only query-relevant observations and
    their source pointers in a maintained textual ledger, preserving earlier evidence while keeping the visual context bounded.
    At termination, it reloads the referenced original images and consolidates the visual evidence for answering, arranging
    it into a logical sequence. This decouples final reasoning from exploratory trial-and-error while ensuring strict visual
    grounding via indexed claim-to-image linkages. To enable end-to-end optimization of this unified rollout, our training
    paradigm combines filtered cold-start trajectory distillation with evidence-aware reinforcement learning, whose reward
    promotes evidence coverage, consolidation compactness, and answer correctness.
- arxiv_id: '2609.18676'
  title: 'The Uneven Impact of Generative AI on Student Learning: Examining the Roles of Reliance, Evaluation Literacy, and
    Course Policy in AI-related Courses'
  abstract: 'Generative artificial intelligence (GenAI) is changing how students learn, yet the roles of course context, cognitive
    reliance, evaluation literacy, and early reliance remain underexplored. Using survey responses from 118 students across
    12 AI-related courses at our institution, we examined differences in GenAI use and perceived learning experiences. We
    identified four user clusters: high-use students reporting many benefits, light users reporting less reliance and fewer
    benefits, and two moderate-use groups reporting different levels of benefit. We also found significant differences between
    free- and premium-version users, single- and multiple-tool users, and students experiencing different instructor policies.
    In multivariable regression models, academic benefit was associated with early reliance and academic task support; positive
    impact was associated with cognitive reliance, academic task support, confidence in GenAI reliability, and instructor
    policy; and negative impact was associated with early reliance and attitudinal change. The association between early reliance
    and negative impact became stronger as evaluation literacy increased. Finally, perceptions of GenAI-enhanced learning
    appear to reflect cognitive, performance, and self-efficacy benefits, while concerns about stress and diminished critical
    thinking are associated with lower perceived learning benefits. These findings suggest that institutions need better policies
    to address such inequities so that institutions can enable students to benefit from increasingly capable AI systems.'
- arxiv_id: '2609.15189'
  title: 'Reconstructing Is Not Acting: Action-Centric Latent Dynamics Modeling'
  abstract: 'Latent action models (LAMs) learn action representations from unlabeled videos by inferring latent actions from
    visual transitions and reconstructing future states. However, we identify a fundamental $\textbf{reconstruction-action
    mismatch}$: lower reconstruction error does not necessarily yield better latent dynamics or downstream performance. We
    attribute this mismatch to two underconstrained aspects of reconstruction-based latent dynamics modeling: (i) the inverse
    dynamics model (IDM) is not explicitly encouraged to distinguish action-related transitions from nuisance appearance,
    and (ii) the forward dynamics model (FDM) can underutilize the inferred latent action by exploiting predictive shortcuts
    from the current state. To address both limitations, we propose $\textbf{ACT-LAM}$, a lightweight action-centric framework
    that strengthens both action extraction and action utilization. Specifically, its Action Query IDM (AQ-IDM) employs learnable
    action queries and gated aggregation to selectively extract rich action-related transition cues without strong information
    bottlenecks. And its Action Token FDM (AT-FDM) projects latent actions into action tokens that progressively interact
    with evolving state representations, enabling continuous state-aware action conditioning. ACT-LAM further streamlines
    feature processing to concentrate model capacity on latent dynamics modeling. Extensive experiments on several robotic
    datasets and the VP$^2$ benchmark demonstrate stronger latent action consistency, forward dynamics, and downstream visual
    planning performance with fewer trainable parameters and lower computational overhead. In particular, ACT-LAM surpasses
    the previous state of the art by $\textbf{7.6%}$ on the aggregated VP$^2$ success rate. Codes at $\href{https://github.com/DingjieFu/ACT-LAM}{url}$.'
- arxiv_id: '2609.31639'
  title: When Does Domain Adaptation Help on Physical Vibration Sensors? A Held-Out-Bearing Study of Neural-Operator and Convolutional
    Models
  abstract: 'Diagnosing rolling-element bearing faults from vibration is a canonical physical-sensing task and a widely used
    benchmark for domain adaptation under operating-condition shift. Accuracies above 99 percent are commonly reported, but
    under evaluation splits that place the same physical bearing in both training and test. We revisit the task under a held-out-bearing
    protocol, assigning every bearing unit entirely to either the training or the test set, and find that source-only transfer
    is far weaker than such numbers suggest: on a change of shaft speed it reaches only $0.36$, against a target-supervised
    ceiling of 0.97. We then study what governs transfer. Treating computed order tracking, a shaft-angle resampling that
    places fault frequencies at fixed shaft orders independent of running speed, as a controlled change of representation,
    we find that a Fourier Neural Operator raises source-only transfer from $0.36$ to $0.61$ on the speed shift, where the
    fault peaks move, while a convolutional network of matched feature dimension stays near chance in both representations.
    The representation also decides whether unsupervised alignment can work: with the same normalized RBF-MMD loss and no
    target labels, the operator reaches 0.71 in the frequency domain but 0.95 in the order domain, within 0.02 of the target-supervised
    ceiling and above $0.86$ on every held-out bearing fold. Once the representation is right, a small label budget adds little.
    These results indicate that, for this task, the input representation rather than the alignment method decides whether
    adaptation helps. A second dataset, whose held-out units are fault diameters rather than bearings, shows that the same
    protocol exposes failures that even a target-supervised model cannot avoid.'
- arxiv_id: '2609.11117'
  title: 'Overview of the NLPCC 2026 Shared Task 11: Agent-Based Experiment Reproduction from Scientific Papers'
  abstract: Reproducibility is essential to scientific progress, yet the growing volume and complexity of scientific publications
    make exhaustive manual verification increasingly impractical. Although recent advances in large language model (LLM) agents
    enable automated experiment reproduction, existing evaluations largely focus on final repositories and are typically limited
    to machine learning (ML). We introduce AgentActionBench, a process-oriented benchmark for evaluating agent-based experiment
    reproduction across ML and AI4Science domains. Our framework uses an MCP-based Action Recorder to capture agents' behaviour
    throughout the reproduction process and evaluates the resulting traces with paper-specific rubrics. AgentActionBench contains
    150 papers, including 120 ML papers and 30 AI4Science papers. A human-annotated subset covering 10% of the benchmark provides
    validation data, while model-assisted augmentation expands the full benchmark to more than 10,000 rubric items. Experimental
    results show that current systems remain limited, with execution as the primary bottleneck. Meanwhile, the strong Pearson
    and Spearman correlations between model-generated and human-annotated rubrics validate the reliability of our scalable
    rubric-generation approach.
- arxiv_id: '2609.17175'
  title: 'IRENE: A Convolutional GRU Ensemble Model for Radar Precipitation Nowcasting over Italy'
  abstract: 'We present IRENE (Italian Radar Ensemble Nowcasting Experiment), a deep learning model for probabilistic short-range
    precipitation nowcasting over the Italian domain at \SI{1}{km} spatial and 5 min temporal resolution. IRENE adopts an
    encoder--forecaster architecture built on multi-scale Convolutional Gated Recurrent Units (ConvGRUs), trained on the national
    radar composite produced by the Italian Civil Protection Department (DPC). An importance-sampling scheme focuses training
    on precipitation-relevant events, while the almost-fair Continuous Ranked Probability Score (afCRPS) is adopted as the
    primary probabilistic loss function. Two additional training configurations are proposed: an adversarial (GAN) variant,
    IRENE-GAN, designed to improve the spatial sharpness of the generated forecasts, and a spectrally constrained variant,
    IRENE-GAN-RAPSD, in which the adversarial objective is complemented by an explicit penalty on the radially averaged power
    spectral density. The three configurations are evaluated against the stochastic extrapolation method STEPS and the pre-trained
    deep learning model DGMR. All IRENE configurations attain a lower Continuous Ranked Probability Score than both benchmarks
    at every lead time and rank histograms closer to uniformity, indicating better probabilistic skill and ensemble calibration.
    In terms of ensemble-mean mean absolute error the advantage is confined to the first 90 min, beyond which the strongly
    damped DGMR fields and, to a lesser extent, STEPS become competitive. Spectral analysis shows that the adversarial training
    removes the progressive loss of small-scale variance exhibited by IRENE, at the cost of an excess of fine-scale power
    at long lead times that the spectral penalty only partially controls.'
- arxiv_id: '2609.15528'
  title: 'To Each Language Its Tokenizer: Modular Tokenizers for Efficient Multilingual LLMs'
  abstract: Multilingual Large Language Models (LLMs) traditionally rely on a single vocabulary shared by all supported languages,
    which can lead to uneven compression across them. Moreover, their large embedding and output matrices increase memory
    usage and slow inference, notably for small-scale models. It is also wasteful as models are often used for only a subset
    of languages. To address these issues, we introduce a modular framework for multilingual model training. First, we propose
    methods to learn large modular BPE and Unigram tokenizers that enable extraction of subtokenizers tailored to any language
    subset. These subtokenizers achieve compression on par with monolingual tokenizers and improve cross-lingual fairness.
    Second, we design a pretraining strategy that samples subtokenizers to form batches, restricting predictions to the relevant
    vocabulary subset and allowing efficient training despite a large vocabulary. This supports efficient inference with any
    combination of language-specific vocabularies. Therefore, it reduces memory usage and speeds up inference in models without
    sacrificing performance.
- arxiv_id: '2609.14157'
  title: 'When Tools Get in the Way: The Effect of Unnecessary Tool Availability on LLM Answering'
  abstract: Large language models (LLMs) are increasingly deployed with external tools that extend what they can do beyond
    their own knowledge. Tools help on tasks that need external information, but their availability may also change how a
    model handles questions that do not need them. Prior work has mostly asked whether models select and use tools appropriately;
    whether an unnecessary tool changes the correctness of answers has received less attention. We ask whether making a related
    but unnecessary tool available affects a model's ability to answer from its own knowledge, and whether a preceding tool
    interaction changes this behaviour. We construct 500 query pairs across 10 knowledge domains. Each pair consists of a
    tool query, which needs the domain's tool, and a closed-domain query, which does not. Six LLMs are evaluated with the
    tool unavailable, available, and available after a prior tool call. Across 3,000 baseline trials the pooled answer rate
    is 98.2%. When an unnecessary tool is available it falls to 63.5%, with large differences between models. The decrease
    occurs even when the tool is rarely called, so it cannot be explained by unnecessary tool invocation alone. A one-sentence
    scope-aware system instruction recovers most of the lost answers.
- arxiv_id: '2609.14451'
  title: 'Follow the Geometry, Not the Model: Cold Start Semi-Supervised Learning'
  abstract: Modern semi-supervised learning (SSL) couples pseudo-label generation and classifier training, using the classifier's
    own confidence to select the pseudo-labels that are then used to update the model. In the cold-start regime, where at
    most a few labels per class are available, this coupling is ill-posed, since the classifier cannot supervise itself before
    it has learned. To address this problem, we propose VAST (Veracity-Aware Semi-Supervised Training), which decouples these
    two stages. Probabilistic beliefs over the unlabeled set are first inferred directly from the geometry of a frozen self-supervised
    embedding and only then distilled into an inductive classifier. The construction rests on the Veracity Matrix, a kernel-based
    structure that aggregates label evidence across the data manifold and admits an interpretation as a Dirichlet posterior
    under a per-observation powered-likelihood model. Additionally, we introduce Veracity Propagation, a self-terminating
    belief-spreading step that extends coverage beyond the kernel neighborhood of the labeled set. Under a controlled protocol
    in which all methods receive identical frozen embeddings and labeled sets, VAST outperforms the strongest graph-based
    SSL baselines at every operating point across three datasets, with statistically significant gains in 7 of 9 comparisons,
    while producing a deployable inductive classifier rather than requiring transductive graph inference. Compared with end-to-end
    confidence-gated SSL, we further find that these methods underperform in this setting and, in our experiments, do not
    consistently exceed labeled-only performance.
- arxiv_id: '2609.18069'
  title: 'GeoCueFormer: Geometry-Guided Wavelet Representation and Prediction-Cued Dual-Stage Decoder for Underwater Semantic
    Segmentation'
  abstract: Underwater semantic segmentation is essential for marine ecosystem monitoring, yet remains challenging due to
    severe visual degradation. Light absorption and scattering often lead to color shifts, low contrast, and blurred boundaries,
    making shallow detail features unreliable. Existing underwater segmentation methods improve RGB feature aggregation or
    boundary prediction, but still lack an explicit mechanism to distinguish structure-related details from degradation-induced
    responses. To address this limitation, we propose GeoCueFormer, a lightweight framework that combines geometry-constrained
    frequency enhancement with prediction-cued refinement. GeoCueFormer performs stage-specific wavelet enhancement on hierarchical
    encoder features to complement shallow boundary details while preserving deep structural semantics. A depth-derived spatial
    gate constrains shallow frequency enhancement toward geometry-consistent regions, and a prediction-cued dual-stage decoder
    further refines ambiguous high-resolution features. GeoCueFormer obtains 82.23% and 73.04% mIoU on SUIM and DUT, respectively.
    Under comparable model complexity and standard benchmark settings on SUIM and DUT, it achieves SOTA performance while
    maintaining a favorable accuracy-complexity trade-off. These results show that distinguishing structural details from
    degradation-induced interference is more effective for underwater segmentation.
- arxiv_id: '2609.14237'
  title: 'OpWeave: Flexible Operator Disaggregation for Heterogeneous LLM Serving'
  abstract: LLM serving systems increasingly disaggregate inference into finer-grained stages, with recent approaches separating
    attention from FFN or MoE execution during decode. This operator-level disaggregated serving (ODS) can improve hardware
    matching and enable independent scaling, particularly across heterogeneous devices. However, existing systems fix operator
    boundaries and lack a unified characterization of when disaggregation reduces serving cost. We present OpWeave, an end-to-end
    framework for heterogeneous ODS. OpWeave provides an analytical cost model that bounds the gains of homogeneous and heterogeneous
    ODS over colocated serving. It jointly optimizes operator partitioning and deployment configuration through a regularity-aware
    planner that keeps the search tractable even for hybrid-attention models. A vLLM-based runtime executes the synthesized
    plans with flexible operator stages across heterogeneous device groups. In our evaluation, OpWeave reduces serving cost
    by up to $1.78\times$ on homogeneous and $1.89\times$ on heterogeneous GPU clusters relative to the best feasible baseline,
    while meeting latency SLOs.
- arxiv_id: '2609.11135'
  title: Bidirectional Multimodal Fusion of Sky Images and Time-Series for Solar Forecasting with Large Language Models
  abstract: 'Short-term photovoltaic (PV) power and global horizontal irradiance (GHI) forecasts are essential for effective
    dispatch, reserve scheduling, and grid operations. At these forecasting horizons, errors are predominantly driven by cloud
    induced ramps: relying solely on historical numerical data may struggle to anticipate an incoming cloud, making ground-based
    sky images a crucial complementary physical signal. Furthermore, forecast performance is highly sensitive to location
    and local observing conditions, creating a strong need for site-specific data that are often scarce. Recently, large language
    models (LLMs) have demonstrated competitive performance and high data efficiency in time-series forecasting. Despite their
    success, existing LLM-based forecasting methods remain predominantly unimodal, relying primarily on historical numerical
    time-series data. Effectively incorporating sky imagery into an LLM-based forecasting framework remains under-explored
    and an open challenge. In this paper, we propose SolCloudLLM, an LLM-based multimodal forecasting framework. SolCloudLLM
    aligns sky-image patches with time-series patches and fuses their corresponding representations through bidirectional
    multimodal fusion, yielding a unified representation that is subsequently mapped into the embedding space of an LLM. Extensive
    experiments on the SIRTA and SKIPP''D datasets demonstrate that SolCloudLLM consistently outperforms the best baseline
    methods in MSE across all forecasting horizons, achieving a maximum relative MSE reduction of 25.4%. Stratified analysis
    further indicates that the benefits of multimodal fusion are concentrated primarily under cloudy conditions. Notably,
    SolCloudLLM achieves the best performance in nearly all few-shot settings, whereas other deep learning baselines experience
    substantial performance degradation and are frequently outperformed by the non-learning physical method.'
- arxiv_id: '2609.14278'
  title: 'SpermYOLO: A Coordinated YOLO-Based Detector for Accurate and Efficient Sperm and Impurity Detection in Microscopic
    Images'
  abstract: 'Accurate sperm detection is essential for computer-assisted semen analysis, yet it remains challenging in microscopic
    images due to dense distributions, visually similar artifacts, and sperm-like impurities. In this paper, we propose SpermYOLO,
    a coordinated and compact YOLOv11-derived framework for joint sperm and impurity detection in microscopic images. SpermYOLO
    introduces four architectural improvements: C3k2-IDB for channel-wise discriminative feature extraction, D2SEM for spatial--spectral
    semantic enhancement, MFM for adaptive multi-scale feature fusion, and the DESD Head for detail-enhanced shared prediction.
    Experiments on the SVIA semen microscopic imaging benchmark show that SpermYOLO achieves 97.2\% sperm AP and 75.4\% impurity
    AP, outperforming generic detectors, dedicated sperm detection models, and improved YOLO variants. Compared with the baseline
    model, SpermYOLO improves sperm AP, impurity AP, $\mathrm{mAP}_{50}$, and $\mathrm{mAP}_{50:95}$ by 1.6, 10.0, 5.8, and
    2.7 percentage points, respectively, while preserving a lightweight model scale. Cross-scene evaluation on the SDTB testicular-biopsy
    microscopy benchmark shows that SpermYOLO remains effective with extremely small sperm targets and complex tissue backgrounds,
    achieving the highest $\mathrm{mAP}_{50}$ and $\mathrm{mAP}_{50:95}$ of 74.8\% and 31.2\%, respectively. Ablation studies
    and qualitative analyses further support these improvements by demonstrating the contributions of the proposed modules
    and showing more focused feature response patterns than the baseline model. These findings suggest that SpermYOLO is an
    effective and efficient approach for sperm detection in challenging microscopic imaging scenarios.'
- arxiv_id: '2609.16621'
  title: 'Stable by Construction: Variational Latent Markov Operators for Long-Horizon PDE Prediction'
  abstract: Neural PDE solvers provide efficient surrogates for time-dependent physical systems, but autoregressive prediction
    over long horizons remains challenging because local errors can induce distribution shift and accumulate under recursive
    deployment. We develop a variational approach to this problem by introducing latent Markov dynamics in which physical
    states are represented by latent distributions and evolved through probabilistic transitions. The framework is formulated
    directly on function spaces and specialized to functional Gaussian models, where structured latent perturbations induce
    a spectral geometry and variational transition alignment regularizes the learned dynamics. We further analyze how these
    mechanisms affect autoregressive error propagation, providing a theoretical connection between variational training and
    long-horizon prediction. We instantiate the framework as the Variational Autoencoding Markov Operator (VAMO), which combines
    spatially resolved latent fields, structured Gaussian perturbations, and a neural-operator transition. Empirically, we
    demonstrate the effectiveness of VAMO on several fluid-dynamics benchmarks with prediction horizons extending substantially
    beyond those represented during training, where it consistently reduces error accumulation and improves rollout stability
    over several deterministic and noise-injection baselines. Overall, these results highlight variational modeling as a complementary
    approach to robust long-horizon neural PDE dynamics.
- arxiv_id: '2609.12067'
  title: Scalable Discrete-to-Continuous Channel Simulation for Compression and Privacy
  abstract: Channel simulation has recently emerged as a useful component in machine learning systems where samples from a
    prescribed probability distribution are to be compressed. Yet, general channel simulation algorithms often suffer from
    high computational costs, random stopping times or, in the worst case, can require generating an infinite number of shared
    random samples. We introduce a scheme for both exact and approximate simulation of discrete-to-continuous channels which
    conversely uses a fixed number of random samples, and therefore has a runtime independent of the channel and the input.
    Unlike existing channel simulation schemes which generate a sequence of independent samples from a proposal distribution,
    our approach generates one sample, or alternatively a fixed number of samples, from each potential target distribution.
    We then apply a latent permutation to the samples before performing sample selection using an exponential race. Our scheme
    provides a flexible tradeoff between the number of generated samples and the compression rate. Using polar and multilevel
    coding, we scale our approach to handle long blocklengths in $O(n \log n)$ time in order to benefit from reduced per-symbol
    overhead. We conclude by demonstrating applications to variable-rate compression with stochastic VQ-VAEs and communication-efficient
    differentially private distributed mean estimation via exact simulation of the Gaussian mechanism.
- arxiv_id: '2609.15660'
  title: 'CiteShade: Citation Laundering in Multi-Source Retrieval-Augmented Generation and Its Counterfactual Defense'
  abstract: 'Retrieval-augmented generation (RAG) grounds a language model''s answers on retrieved external knowledge and
    returns each answer with citations that identify its sources. Those citations are the user''s audit trail: they let a
    reader verify a claim without trusting the model. Prior security work on RAG asks whether an attacker can corrupt the
    answer, leaving the citation channel unexplored. We show that this channel is a new and practical attack surface. We propose
    CiteShade, the first citation laundering attack to RAG, in which an attacker controlling a single source induces a model
    to produce an attacker-chosen wrong answer and to attribute it to a trusted source that does not support it, while the
    evidence for the correct answer remains in context. We formulate the attack as an optimization problem, derive three necessary
    conditions (retrieval, generation, and citation) and construct sources satisfying them without any instruction. On multi-source
    multi-hop question answering the attack raises the wrong-answer rate from 0.01 to 0.68, and source deletion confirms the
    malicious source is the causal driver in every measured case. Vulnerability tracks a model''s propensity to cite rather
    than its scale, reaching CLR 0.84 under explicit instruction and 0.64 with no instruction at all on the most citation-prone
    model tested. We then show that perplexity filtering and citation-support checking are each insufficient, and propose
    a counterfactual defense that verifies which source actually drove the answer.'
- arxiv_id: '2609.14703'
  title: Patient-Level, Leakage-Aware Deep Learning for Cross-Center Periapical Radiograph Classification
  abstract: 'Dental caries and endodontic disease are among the most common health conditions worldwide, and intraoral periapical
    radiographs are central to their detection, treatment planning, and follow-up. Automated tooth-level classification of
    these images, however, lacks reproducible benchmarks, is often evaluated with image-level splits that leak patients between
    training and test, and is rarely validated across clinics. This paper presents the first patient-level, leakage-aware
    classification benchmark for single-tooth intraoral periapical radiographs on the DentIRO dataset, which comprises 5,300
    images from 3,243 patients across two clinics and four classes: Healthy, Caries, Crowned, and Root Canal. Five transfer-learning
    models are compared with patient-grouped stratified cross-validation, so that every patient remains within a single fold.
    DenseNet121 gave the strongest and most stable result at a mean macro-F1 of 0.9787, while the four ImageNet-initialized
    backbones performed comparably. A controlled comparison on a fixed architecture showed that chest-radiograph pretraining
    transferred less effectively than ImageNet initialization. Bidirectional cross-center validation produced a small average
    generalization gap of 0.0077, and Grad-CAM confirmed that predictions rely on clinically meaningful tooth regions rather
    than acquisition artifacts. The benchmark offers a rigorous and reproducible baseline for intraoral radiograph classification.'
- arxiv_id: '2609.11639'
  title: 'LoaDiff: Conditional Generation of Electricity Consumption Time Series for Energy Analytics'
  abstract: 'The energy transition is reshaping residential electricity consumption through the increasing adoption of distributed
    generation, electrified appliances, and demand-response programs. Understanding these evolving behaviors requires access
    to granular smart-meter data for applications such as load forecasting, appliance detection, and demand-side flexibility
    analysis. However, such data are subject to strict access restrictions and data-protection regulations. Thus, realistic
    synthetic alternatives are necessary. In this paper, we introduce LoaDiff, a diffusion-based generative model for year-long,
    sub-hourly smart-meter load curves. LoaDiff supports flexible conditioning on static household attributes, such as appliance
    ownership, and dynamic contextual variables, including calendar information and outdoor temperature. We evaluate the model
    against multiple generative baselines on three residential electricity-consumption datasets. Our experiments assess four
    complementary dimensions: fidelity and diversity, training-record memorization risk, downstream utility for load forecasting
    and appliance detection, and conditional controllability under alternative temperature conditions. The results show that
    LoaDiff generates realistic and diverse load profiles, achieves a favorable trade-off between generation quality and limited
    evidence of memorization, preserves information useful for downstream energy applications, and responds coherently to
    changes in conditioning variables.'
- arxiv_id: '2609.17496'
  title: Verifiable Social Reasoning for LLM Assistants
  abstract: LLM assistants are widely used for daily social advice, yet evaluating their social reasoning in such consultation
    settings remains challenging since (i) it requires setups where the assistant learns about social situations from subjective
    user narratives, and (ii) social properties, such as others' intentions, typically lack verifiable ground truth. To address
    these challenges, we introduce Fuse, a multi-agent simulation framework for studying user-mediated social reasoning. In
    Fuse, a target agent with a hidden motive interacts with other agents including one representing the user, who then consults
    the evaluated assistant to infer the target's motive, providing verifiable ground truth by construction. Simulation faithfulness
    is validated through a human study with 24k annotations. We apply Fuse to 12 LLMs and demonstrate its analytical utility
    by systematically isolating key factors, showing that (i) user mediation compounds the inherent difficulty of social reasoning;
    (ii) LLMs exhibit systematic sensitivity to biased user framing; (iii) models can require more details than humans need
    to reach a correct prediction; and (iv) longer conversations do not always improve performance despite providing opportunities
    for clarifying questions. We open-source Fuse and a dataset with 21k examples.
- arxiv_id: '2609.11381'
  title: 'Agent-Integrated Software: Interaction Contracts and Continuous Assurance'
  abstract: 'Embedding an intelligent agent in an existing application creates a persistent coordination problem: users can
    revise goals and manipulate shared objects while delegated execution continues. We argue that dependable integration requires
    an explicit correspondence between task-level interaction and application behavior. We introduce Agent-Integrated Software
    (AIS) as a software pattern combining a conventional core, direct interaction, and a built-in agent, and Intent-Level
    Interaction Abstraction (IIA) as the task semantics through which users inspect and control delegated work. An open transition-system
    model relates AIS execution to IIA states and events. Interaction contracts constrain this relation through task bindings,
    role-specific authority, control transitions, and outcome evidence; continuous assurance maintains scoped claims as their
    dependencies change. A compact disclosure contract and conditional propositions illustrate why local component validity
    is insufficient and how selected admission invariants can be separated from planning. Contrasting software domains expose
    the framework''s assumptions and limits. This perspective develops a research agenda spanning application abstraction,
    development support, controlled execution, quality assessment, and human supervision, with the aim of making agent integration
    a maintainable software engineering discipline.'
- arxiv_id: '2609.16667'
  title: 'ANIMASK: What the Model Contributes to Role Play in Simulated Story Worlds'
  abstract: When a language model plays a character, the observed behavior reflects both the assigned persona and the default
    dispositions of the actor model itself. Existing evaluations test persona fidelity or model defaults in isolation, but
    neither says, at a specific choice with consequences, what the persona changed and what the model's default kept. We introduce
    ANIMASK, a simulation framework that freezes books and scripts into story worlds whose characters act on their own motivations
    and replays each story from its freeze point. We hold out the author's continuation as a human reference, verify through
    in-story interviews that each persona remains present, and at every decision point compare the character's action with
    what the model produces when the persona is removed. Across 40 stories, 6 actor models, and 3,846 decision points, the
    replays converge away from their canons in one shared direction, toward flatter, cooler stories that leave their tensions
    open. The personas stay present and obeyed throughout. On three choices in four the model's default already falls inside
    what the persona accepts, and where the two diverge the model is the cautious one, holding where the persona would press.
    The persona guarantees who the character is, and the model sets how far the character will go.
- arxiv_id: '2609.16664'
  title: 'Bridging the Perceptual Gap: Residual-Enhanced Downscaling and Manifold-Aware Perception Alignment Adaptation for
    NR-IQA'
  abstract: Leveraging Large Vision-Language Models like CLIP has recently set new benchmarks for No-Reference Image Quality
    Assessment (NR-IQA). However, the contrastive pretraining of CLIP inherently prioritizes semantic invariance, which often
    suppresses subtle perceptual signals, a phenomenon we term perceptual submergence. Furthermore, standard preprocessing
    techniques (e.g., cropping and interpolation) further exacerbate the loss of critical high-frequency quality cues. In
    this paper, we propose the Cross-modal Perception Alignment Adapter (CMPA), a manifold-aware framework designed to disentangle
    perceptual distortions from dominant semantics. CMPA introduces a Perception-Sensitive Feature Extractor (PFE) that projects
    CLIP features into a compact, low-dimensional subspace, explicitly magnifying distortion-induced off-manifold deviations.
    Subsequently, a Cross-Modal Perception Alignment Injector (PAI) aligns these features with quality-aware text anchors
    and re-injects them into the backbone. To ensure input fidelity, we also devise a Residual-enhanced Perceptual Downscaling
    strategy that adaptively compensates for resolution-induced information loss using Just Noticeable Difference (JND) guided
    frequency re-injection. Extensive evaluations on several benchmark datasets demonstrate that our approach significantly
    outperforms state-of-the-art methods, effectively recovering the perceptual signals submerged in semantic-dense representations.
- arxiv_id: '2609.17996'
  title: Modeling the Developmental Shift in Telicity Acquisition
  abstract: 'Acquiring telicity, which is the distinction between bounded (e.g., ate an apple) and unbounded (e.g., ate apples)
    events, requires first language (L1) learners to map surface-level and semantic cues to abstract event structures, but
    the computational trajectory of this mapping is not well understood. We introduce a Difference in Surprisal method that
    uses GPT2 token surprisal over paired temporal adverbial diagnostics (in an hour versus for an hour) to automatically
    label telicity across English CHILDES corpora, validated against expert linguist judgments. Using these labels, we train
    diagnostic logistic regression classifiers on 12 syntactic and lexical semantic features to compare how child speech and
    child-directed speech encode telicity. The two models diverge: the child model reaches near perfect accuracy through a
    single deterministic cue, the presence of a post-verbal determiner, while the adult model relies more heavily on verb
    class and other lexical semantic features, with the determiner cue neutralized. This trajectory supports Syntactic Bootstrapping:
    learners first exploit high-frequency structural cues as a scaffold to bootstrap, before developing fully compositional,
    verb-based event structures.'
- arxiv_id: '2609.11223'
  title: 'Tri-DehazeGS: Scene--Medium Decoupled Gaussian Splatting with Transmittance-Aware Optimization'
  abstract: Recovering clean 3D scenes from hazy multi-view images is challenging because haze attenuates scene radiance and
    introduces atmospheric scattering. Recent scattering-aware Gaussian Splatting methods introduce physical haze models into
    reconstruction, but they often apply degradation in image space or bind medium-related variables to Gaussian primitives,
    which can entangle clean scene radiance with atmospheric effects. Moreover, low-transmittance regions provide weakened
    supervision for Gaussian optimization, causing distant or dense-haze areas to be under-reconstructed. We argue that clean
    reconstruction under haze requires both scene--medium disentanglement and transmittance-aware optimization rebalancing.
    To this end, we propose Tri-DehazeGS, a scene--medium decoupled Gaussian Splatting framework. It represents the clean
    scene with Gaussian primitives, models the participating medium using an independent view-shared tri-plane field, and
    composes hazy observations through a physical scattering model. We further introduce Medium-Decoupled Transmittance Gradient
    Compensation (MD-TGC), which compensates haze-suppressed gradients after medium freezing without altering forward rendering.
    Experiments on real and synthetic haze benchmarks show that Tri-DehazeGS improves clean novel-view reconstruction. Code
    is available at https://github.com/aptx46/Tri-DehazeGS.
- arxiv_id: '2609.12471'
  title: 'AMDKernelVault: Large-Scale Datasets and Agentic Training for AMD GPU Kernel Optimization'
  abstract: We introduce AMDKernelVault, an open HIP and Triton kernel corpus and training framework for recent AMD CDNA GPUs.
    Existing LLM-based kernel agents are largely CUDA/NVIDIA-centric and often depend on repeated frontier-LLM calls for generation,
    reflection, and optimization. To address this gap, we develop HIPKernelGen and TritonKernelGen, agent-driven pipelines
    that transform PyTorch references into HIP or Triton kernels, compile and validate candidates under ROCm, and latency-profile
    them on AMD hardware. The corpus contains 62,153 execution-verified HIP kernel samples, 2,377 production-grounded ROCm
    Libraries QA entries, and 39,893 Triton kernels. We further train Qwen3-8B with supervised fine-tuning and execution-aware
    reinforcement learning as a demonstration of the corpus's utility. Under fixed evaluation budgets, it achieves the highest
    correctness among the compared models on PyTorch-to-HIP (34.0% Pass@1), TritonBench-G (33.2% Corr@3), and ROCmBench (41.94%
    Corr@3), but does not uniformly lead compilation or speed metrics. The corpus and documentation are available at https://huggingface.co/datasets/amd/AIG-Datasets,
    and the associated training and kernel-generation code is available at https://github.com/AMD-AGI/hip_kernel_llm_lab.
- arxiv_id: '2609.13533'
  title: 'Early-Stopping Thresholds for ES-HyperNEAT: A Data-Driven Approach from Fitness Dynamics'
  abstract: 'Most hyperparameter configurations for Evolvable-Substrate HyperNEAT (ES-HyperNEAT) produce networks that stagnate
    at random-guessing performance, wasting computational resources. We frame early stopping as binary classification on early
    fitness trajectories: for each trial, we compute the cumulative median of best-per-generation fitness and test it against
    a threshold derived by maximizing the F1 score on an initial 90-trial dataset. The resulting rule (generation G* = 3,
    threshold T* = 0.140) achieves F1 = 0.872 on 180 independent validation trials, retaining over 90% of successful trials
    while cutting computational cost by 41.6%. Compared to Hyperband, our domain-specific rule is 64% more efficient with
    higher mean fitness, though Hyperband occasionally discovers higher peak solutions. On a converged search population the
    rule becomes too aggressive (recall 31.1%), motivating adaptive thresholds. The specific thresholds are ES-HyperNEAT-specific,
    but the methodology, deriving stopping criteria from fitness dynamics classification, is applicable to other evolutionary
    algorithms with stagnation-prone hyperparameter spaces.'
- arxiv_id: '2609.16695'
  title: 'MAETrack: Unleashing the Potential of Pretrained Geometric Priors for 3D Single Object Tracking'
  abstract: 'Large-scale pre-training has transformed representation learning in 2D vision, yet its transferability to 3D
    single object tracking (SOT) remains insufficiently understood. Directly fine-tuning self-supervised 3D encoders, such
    as masked autoencoders (MAE), often leads to sub-optimal adaptation because the reconstruction objective is not fully
    aligned with the spatial-temporal matching requirements of tracking. In this paper, we observe that this difficulty can
    be interpreted as a layer-wise transfer mismatch: shallow layers tend to preserve transferable geometric cues, while deeper
    layers become increasingly specialized to the reconstruction pretext task and are less suitable for downstream tracking.
    Based on this observation, we propose MAETrack, a lightweight adaptation framework for transferring pre-training MAE representations
    to 3D SOT. MAETrack includes Layer-Selective Initialization (LSI), which initializes only the shallow stages of the tracking
    backbone from pre-trained weights while re-initializing deeper stages, and Geometric Residual Gating (GRG), which reinforces
    structurally salient regions in the search BEV features before template-search fusion through residual spatial modulation.
    Extensive experiments on standard 3D SOT benchmarks show that MAETrack consistently improves upon vanilla fine-tuning
    baselines with limited computational overhead. More broadly, our results suggest that effective transfer from 3D reconstruction
    pre-training to 3D tracking is not merely a matter of partial fine-tuning, but depends on a tracking-oriented transfer
    principle that preserves shallow geometry while adapting deeper representations to the downstream objective.'
- arxiv_id: '2609.13648'
  title: Solar Intelligence
  abstract: Solar energy decision support is fragmented across dashboards that provide data without explanation, research
    papers are slow to parse, and general-purpose language models are not solar domain specific and answer without evidence.
    This paper introduces Solar Intelligence, a hybrid retrieval-augmented framework that unifies structured solar analytics,
    evidence-grounded scientific question answering, and machine learning forecasting in one system. The platform integrates
    daily NASA POWER solar and meteorological data, Biosphere 2 ground-sensor readings, and a curated corpus of research papers
    and institutional reports. Structured queries use DuckDB SQL; scientific questions are answered by a hybrid retriever
    that fuses BM25 and ChromaDB dense embeddings via Reciprocal Rank Fusion, with responses grounded through a language model
    (llama3.2:3b). An Extreme Gradient Boosting (XGBoost) model produces daily forecasts of irradiance, temperature, and wind
    speed. The system is exposed via FastAPI, Streamlit, and an MCP server, so it can be used as an application, an API service,
    or an agent tool - by students, researchers, and energy analysts.
- arxiv_id: '2609.13789'
  title: 'PPDL: A Real-world Industrial User Retention Ratio Forecasting Framework Integrating Physical Priors with Deep Learning'
  abstract: 'In multi-channel paid user acquisition, early and accurate prediction of user retention at the channel level
    is crucial for optimizing budget allocation. User retention curves display a pronounced temporal pattern: an initial period
    of high churn transitions into long-term stability. This pattern is further characterized by regular fluctuations attributable
    to seasonality and exhibits high serial autocorrelation. These intrinsic properties make such curves highly suitable for
    analysis within a time-series forecasting framework. However, forecasting user retention ratio for large-scale short-video
    platform faces three major challenges: significant heterogeneity across channels, pronounced global trend of decay followed
    by saturation, and short look-back windows. To address these challenges, we propose PPDL, a novel forecasting framework
    that integrates physical priors with deep learning. We first introduce a trend-residual decomposition component. The trend
    is modeled using the Weibull distribution, whose parameters are learned via a Multilayer Perceptron (MLP). Secondly, for
    the residual component, we design an auxiliary embedding module on top of a deep learning backbone to maintain the channel
    identity awareness. Finally, to enhance the model''s sensitivity to trends, we design a Multiscale Trend-penalized loss
    function. The proposed approach PPDL is validated through comprehensive experiments on industrial-scale datasets, covering
    three applications with an average of 30+ channels each. Experimental results show that PPDL achieves improvements across
    different backbones and significantly outperforms existing online solutions.'
- arxiv_id: '2609.16145'
  title: 'Safe Error Correction for Language Models: Frozen-Base Adjustment with Capability Preservation'
  abstract: 'We study a practical question: can a small correction module fix errors in a frozen language model''s outputs
    without degrading its base capabilities? We propose CRN v2, a lightweight logit-level correction module (~34M trainable
    parameters, 0.73% of the 4.65B text module) that sits atop a fully frozen Gemma 4 E2B model. The base model is never updated;
    only the correction module learns, via supervised fine-tuning followed by reference-free DPO on 83,400 error-correction
    pairs. On a 60-question domain exam (CEHRI: Certified Human-Robot Intelligence, covering facts, arithmetic, and implicit-goal
    reasoning), CRN v2 corrects 53.3% of base-model errors (reworded variant: 43.3%) while showing no degradation on tested
    capability benchmarks (MMLU/BoolQ N=200; car-wash N=8). A LoRA baseline at the matched CRN v1 budget (6.6M params, rank
    19) achieves 83.3% correction but suffers 30-75% capability loss on the same benchmarks -- the correction-capability tradeoff.
    An ablation shows that the KL preservation term (lambda=0.1) is critical: lowering it to 0.01 degrades correction to 35.0%.
    A hidden-state injection variant at earlier layers (1.6M params, SFT-only) reaches 50.0%/55.8% but does not exceed logit
    correction; shallower injection (layer 4) drops to 30.0%/28.3%; multi-depth logit correction (~35M) reaches only 40%;
    and longer training (5,000 SFT + 2,000 DPO) stays at 53.3% -- none of the alternative configurations we tested exceeded
    the rank-128 logit result, consistent with a best-achieved result of ~53% rather than a floor. This is a study of a design
    principle (frozen base + logit correction + KL anchoring), not a claim of architectural novelty. All code, main-result
    weights, and evaluation scripts are released (deep variant as code only -- no trained deep checkpoints).'
- arxiv_id: '2609.14690'
  title: 'LIMODENet: Attention-Free Compact Encoders for Information-Preserving Onboard Satellite Image Restoration'
  abstract: 'Onboard satellites must restore a channel-degraded image on a few watts, using neuromorphic accelerators (e.g.,
    BrainChip Akida, Intel Loihi-2) that support no softmax or attention. We ask which encoder restores best under that constraint
    and introduce LIMODENet (LinearMix-ODENet), a 0.69M softmax-/QKV-free backbone whose residual stages read as ODE discretizations
    and which is empirically information-preserving (probe accuracy rises 79.9% -> 98.4% from stem to head). At iso-parameters
    it restores 1 dB DVB-S2X-degraded EuroSAT better than a CNN autoencoder (+1.75 dB PSNR) and a skip-connection U-Net (+1.07
    dB), three seeds, non-overlapping. Unconstrained modern restorers (NAFNet, Restormer) win on fidelity; we decompose that
    gap: spiking-legal additive skips recover about half, and the rest traces to attention and channel gating. LIMODENet then
    converts end-to-end to a spiking network with zero blocked operations, versus 22-24 for the competitors: not the best
    restorer available, but the best verified deployable within a real power budget.'
- arxiv_id: '2609.11493'
  title: 'From Document Silos to Process Intelligence: A Multi-Layer Knowledge Graph for CMC Process Development'
  abstract: Chemistry, Manufacturing and Controls (CMC) process development generates an enormous body of technical information
    across a multi-stage, knowledge-intensive continuum from drug discovery to commercial manufacturing. This knowledge is
    traditionally fragmented across functions and heterogeneous formats, causing traceability gaps and significant knowledge-management
    costs during technology transfer and regulatory filing. We present a modular agentic-AI platform that converts a heterogeneous
    corpus of process-development documents into a queryable, dual-layer knowledge graph. A base knowledge layer builds a
    lexical graph with a Document-Section-Chunk hierarchy through lossless ingestion of digital, scanned, handwritten, and
    multilingual documents, while an intelligence layer extracts ontology-aligned entities and bridges cross-document concepts
    through a provenance-anchored domain graph. LLM agents operate across both layers, selecting the retrieval path best suited
    to each question. We evaluate the lexical layer with a novel three-tier protocol measuring the deployment-fidelity of
    a retrieval-augmented generation (RAG) system on proprietary data, demonstrated on 505 questions curated from 38 development
    reports of a Sanofi small-molecule program. Tier-1 multiple-choice accuracy of 95% signals strong platform reliability;
    the stricter Tier-2 LLM-judge pass rate of 85%, which degrades on comparative and corpus-wide questions, reveals a failure
    taxonomy that Tier-1 accuracy alone fails to capture. A router agent selects between layers according to question type.
    We anticipate this protocol will enable future designers of agentic platforms to assess their systems against nonpublic
    databases, and that graph-based architectures will see broader adoption in pharma as a means of transforming fragmented
    document repositories into structured process intelligence.
- arxiv_id: '2609.13899'
  title: 'URCHIN: A Horizontal Spiking Language Model for Data-Constrained Pretraining'
  abstract: 'The BabyLM challenge measures how much language a model can learn from developmentally-plausible, child-scale
    data rather than internet-scale corpora, yet prior language models forgo the biological constraints of the neural circuitry
    that acquires human language: spiking neurons separated into excitatory and inhibitory populations wired by a recurrent
    lateral connectome. This paper presents URCHIN (Unified Recurrent Connectome with Horizontal Integrate-and-fire Neurons),
    which applies the Parallelized Hierarchical Connectome Spiking State-space Model (PHCSSM) to language modeling: leaky
    integrate-and-fire neurons coupled by a Dale''s-law lateral connectome resolve each token through a multi-transmission
    loop that recirculates activity to a fixed point. The instantiation is deliberately minimal: a single horizontal layer
    of 128 neurons, no attention, and 4.23M parameters. Two implementations share one set of weights and produce identical
    benchmark scores, so URCHIN is trained once and deployed either way with no conversion step: a parallel state-space model
    (SSM) scan that is GPU-efficient for training, or an event-driven recurrent spiking neural network (RSNN) with constant-cost
    inference for CPU or neuromorphic edge deployment. Across all three BabyLM tracks (Strict-100M, Strict-Small, and Multilingual),
    URCHIN offers a biologically plausible, efficient, and directly deployable reference point.'
- arxiv_id: '2609.18011'
  title: 'Gaze as Evidence for Common Grounding: A Cross-Corpus Analysis of MapTask and MUNDEX'
  abstract: 'In collaborative tasks with asymmetric information, participants coordinate their understanding through interaction.
    We ask whether gaze provides evidence about grounding across two such tasks. Working from discrete behavioral annotations,
    we map HCRC MapTask (Anderson et al., 1991) and MUNDEX (T\"urk et al., 2023) into a shared partner/task/away vocabulary
    and compute gaze features around task-relevant dialogue units. In both corpora, aligned reference interpretations (MapTask)
    and UND (understood) judgments (MUNDEX) are associated with more task-directed gaze and with less partner-directed gaze,
    lower gaze entropy, and fewer gaze transitions. The associations are clearest for the participant leading the task: in
    giver-produced references, and in explainer judgments, which also co-vary with the explainee''s gaze. In same-speaker
    MapTask reference chains, the speaker''s gaze entropy is lower at the mention where a previously non-aligned referent
    becomes aligned. The best gaze feature groups improve modestly over controls under grouped cross-validation: temporal
    features in MapTask and raw proportions in MUNDEX. Because effects are small and several weaken when recurring participants
    rather than dialogues are the unit of inference, we treat gaze as one contributing cue to grounding, to be interpreted
    alongside task and dialogue context.'
- arxiv_id: '2609.15503'
  title: 'SyntheticDoc: A Large Synthetic Dataset for Document Unwarping and Illumination Correction'
  abstract: Deep learning models have become the standard tool for document rectification and illumination correction, yet
    their performance is fundamentally bound by their training data. For nearly a decade, the community has heavily relied
    on Doc3D, a pioneering but increasingly limited document unwarping dataset in terms of scale and quality. To address this
    bottleneck, we introduce SyntheticDoc, a massive, high-quality dataset designed to push the boundaries of document unwarping.
    SyntheticDoc is composed of 1,000,000 high-resolution procedurally generated training samples, alongside extensive validation
    and test sets. Each sample is paired with rich, pixel-perfect annotations, including UV maps, normal maps, albedo and
    shading. To ensure physical accuracy and photorealism, the paper geometries are generated via a physics-based simulator
    and rendered using a path tracer. To demonstrate the benefit of our dataset, we train a simple baseline model on SyntheticDoc
    and report on its performance in comparison to state-of-the-art methods on both document unwarping and illumination correction
    tasks. Our dataset is available at https://igl.ethz.ch/projects/SyntheticDoc/ and the code used to generate it at https://github.com/tanguymagne/SyntheticDoc
    .
- arxiv_id: '2609.11656'
  title: Learnware and AI Model Management System
  abstract: 'The transition from file storage to database management systems transformed stored data into managed resources.
    AI now faces an analogous transition from AI model storage to AI model management. Existing model pools essentially serve
    as \textit{AI model storage systems}. What is needed instead are \textit{AI model management systems} that enable models
    trained by different developers, for different tasks, with different data, and under different objectives to be identified,
    reused, and even assembled to address future user tasks. Because AI model developers are generally unwilling to share
    their training data, such systems should operate without accessing the training data of model developers and, ideally,
    without accessing raw data of future users. This requirement poses a fundamental challenge: the functionality of a modern
    AI model may not be fully understood even by the developer who trained it. How, then, can a system identify which models
    are useful for a given user task, let alone assemble models developed independently for different purposes? At first glance,
    this objective may appear unattainable. It becomes possible, however, by upgrading the basic unit of management from a
    machine learning model to a \textit{learnware}. \textit{Learnware = Model + Specification}. The specification, whose assignment
    transforms a trained model into a learnware, is generated with the help of a machine learning process without disclosing
    the training data of the developer and has a theoretically established data-preservation property. The \textit{Learnware
    Dock System (LDS)} provides a path toward powerful AI model management systems. Because specifications are generated according
    to a published reference and are comparable across models, they can also serve as an AI model \textit{collaboration protocol}
    through which independently developed models, including intelligent agents, can collaborate.'
- arxiv_id: '2609.11538'
  title: 'Particle GFlowNets: Rethinking Generative Marginalization Models'
  abstract: Generative Marginalization Models (MaMs) have been recently introduced as efficient neural sampling models for
    any-order autoregressive modelling of discrete distributions. By learning both the marginal and conditional probabilities
    of a persistent-block Gibbs sampler, MaMs enable fast posterior evaluation with a single neural network forward pass.
    While prior work has considered MaMs to be distinct from Generative Flow Networks (GFlowNets), a well-established paradigm
    for inference in discrete stochastic models, we show that they are equivalent. Then, we also extend MaMs' sampling strategy
    to non-autoregressive generative processes. In particular, we describe an automatic criterion for full-state rejuvenation
    of the Gibbs sampler, derived from the Gelman-Rubin statistic, which plays a key role in speeding up learning convergence.
    Our experiments show that our method, called Particle GFlowNets, markedly accelerates training in large combinatorial
    spaces.
- arxiv_id: '2609.17845'
  title: Sharp margin-based generalization bounds for realizable SVM
  abstract: Let the exact homogeneous hard-margin support vector machine be trained on \(m\) independent observations from
    a Borel probability law on a real Hilbert space. We prove that, with score zero counted as an error, there is a universal
    numerical constant \(C\) such that \[ \Pp\left( \gamma_m>0,\quad \Risk(u_m)> \frac{C}{m} \left( K_m+\log\frac1\delta \right)
    \right) \le \delta . \] Here \(\gamma_m\) is the empirical homogeneous margin, \(u_m\) is the exact minimum-norm unit-margin
    separator, \(r_m\) is the largest training radius, and \(K_m:=r_m^2\norm{u_m}^2=r_m^2/\gamma_m^2\) on \(\{\gamma_m>0\}\).
    The proof is driven by a deterministic deletion problem. Given vectors \(x_1,\ldots,x_n\) in the unit ball, delete a set
    \(B\) of constraints and let \(u_B\) be the closest point to the origin that satisfies every retained unit-margin constraint.
    Suppose that \(\norm{u_B}^2\le k\) and that every deleted vector has nonpositive score under \(u_B\). We prove that a
    family of such deletion sets of cardinality \(q\) has size at most \(\exp(8k+2q)\). The conceptual step is an exact identity
    obtained from the KKT representation of \(u_B\). For a random deletion set, the identity converts the mean squared spread
    of the separators into a weighted sum of score deficits. It therefore forces a coordinate whose deletion status separates
    the two conditional means by a quantitatively large amount. Revealing that coordinate decreases the conditional separator
    variance enough to control the binary entropy of the split. An entropy induction gives the deletion count, and an exact
    factorial ghost-sample identity converts that count into the stated high-probability SVM bound.

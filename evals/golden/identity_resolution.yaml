# evals/golden/identity_resolution.yaml -- the identity-resolution calibration set (07 S5.3; P3-S3-T03).
# 100 (candidate, System) pairs, each labelled match or no-match with its reason, and the target as it stood
# when labelled (target_view), so scripts/calibrate_identity.py rescores the set from this file alone.
# 07 S5.3 asks for these labels to be a person's. They are an agent's draft until `confirmed_by` names
# the person who has checked every one; tests/test_identity_calibration.py holds the precision either way.
drawn_on: 2026-10-05
seed: 20261005
drawn_with:
  scorer: set
  weights:
    name: 0.5
    org: 0.2
    date: 0.2
    alias: 0.1
population: the free-text Name strings of Epoch's per-benchmark files (the 2026-09-16 export), each
  with its row's Organization and Release date; every candidate's top three Systems (curated and
  stub) by 07 S5.3's formula as written. 50 pairs from the 0.80-0.95 band, then 50 uniformly from
  the rest.
label_rule: 'match: the candidate string names the target System. A reasoning effort, serving provider,
  harness or API snapshot of that same System does not change it; a different size, tier, release or variant
  does. Where the target is one dated snapshot among several (gpt-4o-aug-2024) and the string names no
  date, the answer is no-match: the string does not pick that snapshot.'
labelled_by: agent draft (P3-S3-T03), from the strings, the organisation and date, and Epoch's own
  identification of each row (epoch_reference), never from the score
confirmed_by: null

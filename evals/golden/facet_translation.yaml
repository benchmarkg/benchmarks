# evals/golden/facet_translation.yaml -- golden set v0, the facet_translation split (P6-S3-T08; 11 S7 "The
# golden set" and "Where the items come from"; 11 S4 "The FacetQuery shape"; D3 S3.4 context 4). Twelve queries,
# each to be labelled with a gold FacetQuery in facet-qualified form; scored by per-facet macro-F1, the
# over-constraint rate and the enum-hallucination rate. All ten FacetQuery slots are in scope for every item.
# Four items are the declared homographs of taxonomy/homographs.yaml, one each, which D3 S3.4 makes mandatory.
#
# THE GOLD LABELS ARE A PERSON'S, NEVER AN AGENT'S. An agent drafted the queries and recorded how each was
# sourced. It wrote no gold label and proposes no answer anywhere in this file: an agent-written gold label makes
# the evaluation circular (P6-S3-T08), and a proposal would anchor the person labelling. Every `gold` is null
# until a person sets it. `labelled_by` names that person, `labelled_on` the date and `labelled_against` the
# commit whose data/ and taxonomy/ the labels were read from; `confirmed_by` names a second person who checked
# every label, or stays null. `label_shape` below says what a label looks like.
#
# provenance: generated (drafted from the taxonomy's own vocabulary), harvested (an external question or text,
# cited in `source`; `sourcing` says how the query was taken from it), adversarial (built to stress the
# pipeline; `stratum` names the technique). 11 S7: at least half of each split is not generated, and the two
# populations are scored separately and both published. `sourcing` describes the technique, never the meaning.
# `strata` is what the split declares; scripts/check_golden_composition.py asserts the declarations are the
# plan's and the items match them, and with --require-labels that every gold label is set.
#
# family: the domain family the item was drafted to target, recorded so that no family exceeds its share of the
# split (`strata.family_max`). It is a drafting stratum, not a facet value and not a hint: a gold label may name
# other families or none. null where the item by design targets no one family, and `family_note` says why.
split: facet_translation
set_version: v0
drafted_by: 'agent draft (P6-S3-T08): the queries, their provenance and strata only; no gold label and
  no proposed answer'
drafted_on: '2026-11-25'
labelled_by: null
labelled_on: null
labelled_against: null
confirmed_by: null
label_shape: "gold: a mapping of hard, soft, unmapped_terms and intent (11 S4). hard (filters) and soft
  (boosts) each map any of the ten FacetQuery slots (tools/build/facetquery_schema.py FIELDS) to a list
  of facet-qualified values from schema/generated/facetquery.schema.json, or year_min to an integer; a
  slot left out constrains nothing. unmapped_terms lists the query terms no facet value expresses ([]
  for none). intent is one of suite_build, lookup, compare, ecosystem_question, out_of_scope. A homograph
  item's gold names its capability reference, its subdomain reference or both, in hard or soft."
strata:
  items: 12
  not_generated_min: 6
  family_max: 1
  family_null_max: 6
  query_max_chars: 500
  homograph_items: 4
items:
  - id: facet_translation-01
    provenance: adversarial
    stratum: homograph
    sourcing: Drafted around the declared homograph "planning" (taxonomy/homographs.yaml), one item
      per declared homograph (D3 S3.4 context 4).
    family: null
    family_note: 'A homograph item: which facet the word names is what the item tests, so it targets no
      family.'
    homograph:
      capability: capability:planning
      domain: domain:reasoning-general/planning
    query: how good are LLMs at planning? looking for benchmarks
    notes: Both facet-qualified readings of the word are declared in taxonomy/homographs.yaml (see
      `homograph`). Label in facet-qualified form whatever the query asks for.
    gold: null
  - id: facet_translation-02
    provenance: adversarial
    stratum: homograph
    sourcing: Drafted around the declared homograph "spatial-reasoning" (taxonomy/homographs.yaml),
      one item per declared homograph (D3 S3.4 context 4).
    family: null
    family_note: 'A homograph item: which facet the word names is what the item tests, so it targets no
      family.'
    homograph:
      capability: capability:spatial-reasoning
      domain: domain:reasoning-general/spatial-reasoning
    query: spatial reasoning tests for vision-language models
    notes: Both facet-qualified readings of the word are declared in taxonomy/homographs.yaml (see
      `homograph`). Label in facet-qualified form whatever the query asks for.
    gold: null
  - id: facet_translation-03
    provenance: adversarial
    stratum: homograph
    sourcing: Drafted around the declared homograph "temporal-reasoning" (taxonomy/homographs.yaml),
      one item per declared homograph (D3 S3.4 context 4).
    family: null
    family_note: 'A homograph item: which facet the word names is what the item tests, so it targets no
      family.'
    homograph:
      capability: capability:temporal-reasoning
      domain: domain:reasoning-general/temporal-reasoning
    query: temporal reasoning in long videos
    notes: Both facet-qualified readings of the word are declared in taxonomy/homographs.yaml (see
      `homograph`). Label in facet-qualified form whatever the query asks for.
    gold: null
  - id: facet_translation-04
    provenance: adversarial
    stratum: homograph
    sourcing: Drafted around the declared homograph "compositional-generalization"
      (taxonomy/homographs.yaml), one item per declared homograph (D3 S3.4 context 4).
    family: null
    family_note: 'A homograph item: which facet the word names is what the item tests, so it targets no
      family.'
    homograph:
      capability: capability:compositional-generalization
      domain: domain:general-intelligence/compositional-generalization
    query: compositional generalisation benchmarks
    notes: Both facet-qualified readings of the word are declared in taxonomy/homographs.yaml (see
      `homograph`). Label in facet-qualified form whatever the query asks for.
    gold: null
  - id: facet_translation-05
    provenance: adversarial
    stratum: negation
    sourcing: Drafted around an exclusion ("not ...").
    family: mathematics
    query: math benchmarks for reasoning models that are not multiple choice
    gold: null
  - id: facet_translation-06
    provenance: adversarial
    stratum: user-jargon
    sourcing: Drafted in product jargon with no taxonomy word in it.
    family: audio-speech
    query: eval our voice agent on noisy call-centre audio
    gold: null
  - id: facet_translation-07
    provenance: adversarial
    stratum: near-miss-vocabulary
    sourcing: Drafted in near-miss wording, close to but not the catalogue's terms.
    family: code
    query: agentic coding benchmarks with a hidden test set you can't download
    gold: null
  - id: facet_translation-08
    provenance: harvested
    stratum: regulation-text
    sourcing: Quotes the phrase on adversarial testing from the AI Act's Annex XI, Section 2, point
      2, framed as a search by a general-purpose AI model's provider. Wording checked against the
      text at https://artificialintelligenceact.eu/annex/11/.
    source:
      title: Regulation (EU) 2024/1689 (Artificial Intelligence Act), Annex XI, Section 2, point 2
      url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
      retrieved_on: '2026-11-25'
    family: safety-alignment
    query: benchmarks for internal and/or external adversarial testing (e.g. red teaming) of a
      general-purpose AI model
    gold: null
  - id: facet_translation-09
    provenance: harvested
    stratum: model-card
    sourcing: A table-group name from the model card's benchmark results, typed alone as a reader of
      the card would search it.
    source:
      title: Gemma 3 model card, "Benchmark Results", "Reasoning and factuality" (reached from
        https://ai.google.dev/gemma/docs/core/model_card_3)
      url: https://gemma.ai/models/gemma-3/
      retrieved_on: '2026-11-25'
    family: null
    family_note: The card's group is not one family's; the item targets none.
    query: reasoning and factuality
    gold: null
  - id: facet_translation-10
    provenance: harvested
    stratum: issue-tracker
    sourcing: The issue's title with its "[FT]" tag and its verb dropped.
    source:
      title: '[FT] Add tool usage benchmarks'
      url: https://github.com/huggingface/lighteval/issues/256
      retrieved_on: '2026-11-25'
    family: agents-tooluse
    query: tool usage benchmarks
    gold: null
  - id: facet_translation-11
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: chemistry-materials
    query: molecular property prediction benchmarks with low contamination risk
    gold: null
  - id: facet_translation-12
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: earth-climate
    query: remote sensing benchmarks released in 2022 or later that are still active
    gold: null

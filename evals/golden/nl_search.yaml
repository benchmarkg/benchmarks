# evals/golden/nl_search.yaml -- golden set v0, the nl_search split (P6-S3-T08; 11 S7 "The golden set" and
# "Where the items come from"). Twenty search queries, each to be graded against the catalogue's benchmark
# entries; scored by Recall@20 on grade 3, nDCG@10 and the must-include violation rate.
#
# THE GOLD LABELS ARE A PERSON'S, NEVER AN AGENT'S. An agent drafted the queries and recorded how each was
# sourced. It wrote no gold label and proposes no answer anywhere in this file: an agent-written gold label makes
# the evaluation circular (P6-S3-T08), and a proposal would anchor the person labelling. Every `gold` is null
# until a person sets it. `labelled_by` names that person, `labelled_on` the date and `labelled_against` the
# commit whose data/ and taxonomy/ the labels were read from; `confirmed_by` names a second person who checked
# every label, or stays null. `label_shape` below says what a label looks like.
#
# provenance: generated (drafted from the taxonomy's own vocabulary), harvested (an external question or text,
# cited in `source`; `sourcing` says how the query was taken from it), adversarial (built to stress the
# pipeline; `stratum` names the technique). 11 S7: at least half of each split is not generated, and the two
# populations are scored separately and both published. `sourcing` describes the technique, never the meaning.
# `strata` is what the split declares; scripts/check_golden_composition.py asserts the declarations are the
# plan's and the items match them, and with --require-labels that every gold label is set.
#
# family: the domain family the item was drafted to target, recorded so that no family exceeds its share of the
# split (`strata.family_max`). It is a drafting stratum, not a facet value and not a hint: a gold label may name
# other families or none. null where the item by design targets no one family, and `family_note` says why.
split: nl_search
set_version: v0
drafted_by: 'agent draft (P6-S3-T08): the queries, their provenance and strata only; no gold label and
  no proposed answer'
drafted_on: '2026-11-25'
labelled_by: null
labelled_on: null
labelled_against: null
confirmed_by: null
label_shape: "gold: a mapping from benchmark entry id (a file name under data/benchmarks/, without .yaml)
  to a grade: 3 must, 2 good, 1 ok, 0 wrong (11 S7). Grade the pooled candidates once P6-S3-T09 pools
  them (TREC-style: the union of several configurations' top 20); until then, grade from the catalogue.
  At least one entry graded 3, or Recall@20 on grade 3 is undefined for the item."
strata:
  items: 20
  not_generated_min: 10
  family_max: 3
  family_null_max: 10
  query_max_chars: 500
items:
  - id: nl_search-01
    provenance: harvested
    stratum: issue-tracker
    sourcing: The issue's title, quoted whole as the query.
    source:
      title: Are there any Safety Alignment Benchmarks ready for use?
      url: https://github.com/EleutherAI/lm-evaluation-harness/issues/2933
      retrieved_on: '2026-11-25'
    family: safety-alignment
    query: Are there any Safety Alignment Benchmarks ready for use?
    gold: null
  - id: nl_search-02
    provenance: harvested
    stratum: issue-tracker
    sourcing: Restated from the issue's title as a search; the benchmarks its body names are left
      out, so the query states a need rather than a lookup.
    source:
      title: '[EVAL]: Add more African Benchmarks'
      url: https://github.com/huggingface/lighteval/issues/373
      retrieved_on: '2026-11-25'
    family: language
    query: benchmarks for African languages
    gold: null
  - id: nl_search-03
    provenance: harvested
    stratum: issue-tracker
    sourcing: Shortened from the issue's title, a question asked about a world model's example task;
      the model's name is dropped.
    source:
      title: Hello, is there a real-world benchmark dataset and download link for the robot-pouring
        task of the Cosmos-Predict2.5-2B model?
      url: https://github.com/nvidia-cosmos/cosmos-predict2.5/issues/105
      retrieved_on: '2026-11-25'
    family: robotics-embodiment
    query: real-world benchmark dataset for a robot pouring task
    gold: null
  - id: nl_search-04
    provenance: harvested
    stratum: issue-tracker
    sourcing: Restated from the issue's title; the three benchmarks it names are left out.
    source:
      title: Plans to add new long-context benchmark like LongBench v2, Babilong, InfiniteBench
        datasets?
      url: https://github.com/EleutherAI/lm-evaluation-harness/issues/3224
      retrieved_on: '2026-11-25'
    family: language
    query: new long-context benchmarks for LLMs
    gold: null
  - id: nl_search-05
    provenance: harvested
    stratum: model-card
    sourcing: A category name from the base-model benchmark table of the model card, typed alone as
      a reader of the card would search it.
    source:
      title: Llama 3 model card (MODEL_CARD.md), "Benchmarks", base pretrained models table
      url: https://github.com/meta-llama/llama3/blob/main/MODEL_CARD.md
      retrieved_on: '2026-11-25'
    family: null
    family_note: The card's category is not one family's; the item targets none.
    query: knowledge reasoning
    gold: null
  - id: nl_search-06
    provenance: harvested
    stratum: model-card
    sourcing: A heading under the model card's "Critical risks", typed alone as a reader of the card
      would search it.
    source:
      title: Llama 3 model card (MODEL_CARD.md), "Responsibility & Safety", "Critical risks"
      url: https://github.com/meta-llama/llama3/blob/main/MODEL_CARD.md
      retrieved_on: '2026-11-25'
    family: safety-alignment
    query: CBRNE
    gold: null
  - id: nl_search-07
    provenance: harvested
    stratum: issue-tracker
    sourcing: The issue's title after its "Research:" prefix, quoted as the query.
    source:
      title: 'Research: Benchmarks for Evaluating LLM Tool Use and Semantic Search'
      url: https://github.com/nexi-lab/nexus/issues/484
      retrieved_on: '2026-11-25'
    family: agents-tooluse
    query: Benchmarks for Evaluating LLM Tool Use and Semantic Search
    gold: null
  - id: nl_search-08
    provenance: harvested
    stratum: issue-tracker
    sourcing: "The issue's title after its \"proposal:\" prefix, quoted as the query: a project's own
      coinage."
    source:
      title: 'proposal: Benchmarks for evaluating subconscious memory architecture'
      url: https://github.com/Lingtai-AI/lingtai/issues/53
      retrieved_on: '2026-11-25'
    family: null
    family_note: The coinage names no one family; the item targets none.
    query: Benchmarks for evaluating subconscious memory architecture
    gold: null
  - id: nl_search-09
    provenance: adversarial
    stratum: user-jargon
    sourcing: "11 S7's own example of how a user words a need (\"Real users type ...\"): an acronym and
      product jargon, no taxonomy word."
    family: language
    query: RAG eval for our support bot
    gold: null
  - id: nl_search-10
    provenance: adversarial
    stratum: negation
    sourcing: Drafted around an exclusion ("not ...").
    family: code
    query: agent evals on real GitHub issues, not leetcode-style puzzles
    gold: null
  - id: nl_search-11
    provenance: adversarial
    stratum: user-jargon
    sourcing: Drafted in colloquial terms with no taxonomy word in it.
    family: general-intelligence
    query: vibe-check arena where people vote on which chatbot answer is better
    gold: null
  - id: nl_search-12
    provenance: adversarial
    stratum: misspelling-abbreviation
    sourcing: Drafted with a misspelling and a texting abbreviation, as typed in a hurry.
    family: vision
    query: ocr benchmarks for handwriten receipts n invoices
    gold: null
  - id: nl_search-13
    provenance: adversarial
    stratum: multi-constraint
    sourcing: Drafted to stack several constraints in one query, so a pipeline that applies each as
      a hard filter can over-constrain.
    family: chemistry-materials
    query: open-licence chemistry benchmarks from 2023 or later that run on a single GPU
    gold: null
  - id: nl_search-14
    provenance: adversarial
    stratum: negation
    sourcing: Drafted around the negation of a word the catalogue also uses.
    family: mathematics
    query: math benchmarks that aren't saturated yet
    gold: null
  - id: nl_search-15
    provenance: adversarial
    stratum: near-miss-vocabulary
    sourcing: Drafted in a field's own jargon, close to but not the catalogue's wording.
    family: earth-climate
    query: skill scores for ML weather models
    gold: null
  - id: nl_search-16
    provenance: adversarial
    stratum: over-constraint-bait
    sourcing: Drafted with an explicit "only" on a property that none of the ten FacetQuery facets
      holds.
    family: medicine-health
    query: clinical benchmarks built only from European hospital data
    gold: null
  - id: nl_search-17
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: biology-genetics
    query: protein structure prediction benchmarks
    gold: null
  - id: nl_search-18
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: audio-speech
    query: speech recognition benchmarks
    gold: null
  - id: nl_search-19
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: society-econ-law
    query: legal reasoning benchmarks
    gold: null
  - id: nl_search-20
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: multimodal
    query: visual question answering benchmarks
    gold: null

# evals/golden/suite_build.yaml -- golden set v0, the suite_build split (P6-S3-T08; 11 S7 "The golden set" and
# "Where the items come from"; 11 S2 F2). Five need statements, each to be labelled with must-include,
# must-not-include and nice-to-have entries and a rubric; scored by must-include coverage, the
# forbidden-inclusion rate, citation validity and the presence of the "Not covered" section. 11 S7 asks for at
# least three external domain reviewers of these labels before the first published run (P6-S6-T02).
#
# THE GOLD LABELS ARE A PERSON'S, NEVER AN AGENT'S. An agent drafted the queries and recorded how each was
# sourced. It wrote no gold label and proposes no answer anywhere in this file: an agent-written gold label makes
# the evaluation circular (P6-S3-T08), and a proposal would anchor the person labelling. Every `gold` is null
# until a person sets it. `labelled_by` names that person, `labelled_on` the date and `labelled_against` the
# commit whose data/ and taxonomy/ the labels were read from; `confirmed_by` names a second person who checked
# every label, or stays null. `label_shape` below says what a label looks like.
#
# provenance: generated (drafted from the taxonomy's own vocabulary), harvested (an external question or text,
# cited in `source`; `sourcing` says how the query was taken from it), adversarial (built to stress the
# pipeline; `stratum` names the technique). 11 S7: at least half of each split is not generated, and the two
# populations are scored separately and both published. `sourcing` describes the technique, never the meaning.
# `strata` is what the split declares; scripts/check_golden_composition.py asserts the declarations are the
# plan's and the items match them, and with --require-labels that every gold label is set.
#
# family: the domain family the item was drafted to target, recorded so that no family exceeds its share of the
# split (`strata.family_max`). It is a drafting stratum, not a facet value and not a hint: a gold label may name
# other families or none. null where the item by design targets no one family, and `family_note` says why.
split: suite_build
set_version: v0
drafted_by: 'agent draft (P6-S3-T08): the queries, their provenance and strata only; no gold label and
  no proposed answer'
drafted_on: '2026-11-25'
labelled_by: null
labelled_on: null
labelled_against: null
confirmed_by: null
label_shape: 'gold: a mapping of must_include (benchmark entry ids, at least one), must_not_include and
  nice_to_have (entry ids, possibly empty), and rubric (one line per criterion a rationale is judged on,
  at least one). No entry id in two lists. Entry ids are file names under data/benchmarks/, without .yaml.'
strata:
  items: 5
  not_generated_min: 3
  family_max: 1
  family_null_max: 2
  query_max_chars: 1000
items:
  - id: suite_build-01
    provenance: harvested
    stratum: regulation-text
    sourcing: Two phrases quoted from the AI Act, Article 55(1)(a) and Annex XI, Section 2, point 1,
      framed as a provider's need statement. Wording checked against the text at
      https://artificialintelligenceact.eu/article/55/ and
      https://artificialintelligenceact.eu/annex/11/.
    source:
      title: Regulation (EU) 2024/1689 (Artificial Intelligence Act), Article 55(1)(a) and Annex XI,
        Section 2, point 1
      url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
      retrieved_on: '2026-11-25'
    family: null
    family_note: The need spans families by its own terms; the item targets none.
    query: We provide a general-purpose AI model that may be designated as having systemic risk.
      Assemble an evaluation suite that lets us "perform model evaluation in accordance with
      standardised protocols and tools reflecting the state of the art", including adversarial
      testing, and lets us document "evaluation criteria, metrics and the methodology on the
      identification of limitations".
    gold: null
  - id: suite_build-02
    provenance: harvested
    stratum: issue-tracker
    sourcing: The issue asks for a model family's published evaluation details to be reproducible in
      a harness; restated as a need statement.
    source:
      title: reproduce llama 3 evals
      url: https://github.com/EleutherAI/lm-evaluation-harness/issues/2557
      retrieved_on: '2026-11-25'
    family: null
    family_note: A model card's evaluations span families; the item targets none.
    query: Build a suite that reproduces the evaluations the Llama 3 model card reports, so we can
      compare our own base model with it on the same benchmarks and settings.
    gold: null
  - id: suite_build-03
    provenance: adversarial
    stratum: user-jargon
    sourcing: Drafted as a team lead would write it, in product jargon with no taxonomy word, with a
      second worry added at the end.
    family: code
    query: we're rolling out a coding copilot on our internal monorepo next quarter. what should we
      eval it on before launch? also worried it might leak secrets or API keys from the codebase
    gold: null
  - id: suite_build-04
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: medicine-health
    query: An evaluation suite for a clinical question-answering model covering medical knowledge,
      safety and calibration, using openly licensed data only.
    gold: null
  - id: suite_build-05
    provenance: generated
    stratum: taxonomy-vocabulary
    sourcing: Drafted from the taxonomy's own wording.
    family: robotics-embodiment
    query: A suite for a robot manipulation policy trained in simulation, including sim-to-real
      transfer.
    gold: null

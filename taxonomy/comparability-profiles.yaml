# taxonomy/comparability-profiles.yaml
#
# Which condition fields are MATERIAL, resolved from a benchmark's evaluation_method and
# designed_for_subjects facets. Owned by 04-data-model.md S8.
#
# THERE IS NO SUCH NUMBER AS "the count of material fields at schema v1". The material set is
# per-benchmark-shaped. 04 S8's table is the UNIVERSE of fields material to some benchmark, not
# a set any single benchmark uses: `shots` is meaningless for a robotics sim benchmark and
# `simulator_version` is meaningless for MMLU. Any surface needing a denominator reads
# `fields_material_total` off the resolved profile at render time. A document that names a
# constant instead has made a category error, and every percentage derived from that constant is
# wrong for every benchmark whose profile is a different size.
#
# The same arithmetic makes condition_completeness per-profile, never global. Epoch's rows
# average about 0.10 against the six-field llm-static-text profile below, 0.054 against the
# eleven-field agentic profile and 0.037 against the full material table. Quote the figure with
# its profile or not at all.
#
# How a benchmark resolves (tools/build/comparability.py): every (evaluation_method, subject) pair
# its two facet lists make is looked up here, each pair in exactly one profile, and the benchmark's
# ONE resolved profile is the union of the rows its pairs hit -- a benchmark that is both judged and
# agentic is material on both rows' fields. A hand-set `comparability.profile` pins one row instead;
# it is how an entry whose facets are deliberately empty (a logged vocabulary gap) gets a profile.
# tests/test_comparability_profiles.py holds every curated benchmark to exactly one resolution,
# never the fallback, with every one of its pairs listed below.
#
# Per-benchmark `comparability.material_extra[]` and `material_waived[]` override the resolved
# set. A WAIVER REQUIRES A REASON STRING and appears in the quality dashboard (tier 4's
# `material-waived` finding, which `bench report quality` lists with each field and reason),
# because the failure mode here is curators quietly waiving inconvenient fields until the
# comparability check passes everything.
#
# Weights default to 1.0. 04 S8 sets 2.0 for judge_model on a model-graded benchmark and 2.0 for
# scaffold where the subject is an agent scaffold -- the fields whose absence does the most
# damage count double.
#
# `provider_snapshot` and `provider_snapshot_available` sit on hosted-api ONLY, per the decision
# in 13-execution-runners.md S4.5: a run against a provider that publishes no dated snapshot
# records `false` explicitly and that counts as COMPLETE, because the field was answered. A null
# does not count, because null means nobody looked. The schema penalises unknowns, not absences.
#
# WHICH FIELDS ARE MATERIAL TO A SHAPE IS A CURATION JUDGEMENT, so every profile below opens with
# its `Basis:` (where the member list comes from) and, where a judgement is open, the `Reviewer
# checks:` a reviewer should confirm or overturn. The member lists of llm-static-text and agentic are still reconstructed
# from 04 S8's own arithmetic rather than transcribed: it states a six-field and an eleven-field
# profile and gives per-field Epoch fill rates summing to 0.594, and 0.594/6 = 0.099 against its
# stated "about 0.10". The six and the eleven are right in SIZE; which fields fill them is
# inference. The profiles added in 0.3.0 rest on the corpus instead: before this revision 133 of
# 325 curated entries resolved to the fallback, and their curators had declared, in
# material_extra, what their shape makes material. Those declarations are the counts quoted in
# each basis.
#
# Authored by P0-S2-T06 from 04 S8 and 13 S4.5; surrogate-fit by ADR-0024; 0.3.0, every pair the
# curated corpus uses and eight profiles, by P3-S10-T01 (ADR-0029).

version: 0.3.0
updated: 2026-11-25
description: >
  Lookup from an (evaluation_method, subject) pair to the material condition-field set used to
  compute comparability_key and condition_completeness.

default_weight: 1.0

# A pair not listed below resolves to `fallback`, and the resolution is REPORTED rather than
# silent: an unlisted pair means the vocabulary grew and this file did not, which is a curation
# signal, not a default to lean on. No curated benchmark resolves here (the test above).
fallback:
  material: [subset_used]
  note: >
    Subset substitution is the one silent change that matters everywhere, so it is the floor.
    A benchmark resolving to fallback should be given a real profile before its claims are
    compared.

profiles:
  # Basis: 04 S8's rows for shots ("changes scores by tens of points"), chain_of_thought,
  #   reasoning_effort ("8-point spread on ARC-AGI within one model"), tools_allowed ("CritPt goes
  #   from ~4% to ~10% with code tools"), retries_allowed and subset_used; the size from 04 S8's
  #   six-field Epoch arithmetic (P0-S2-T06). 0.3.0 adds numeric-tolerance-match,
  #   classification-metric, domain-metric and composite under the prompted models (the same
  #   prompted test scored by another statistic), adversarial-red-team under an instruction-tuned
  #   target (a fixed attack set is a prompted test set; the judge comes from the benchmark's judge
  #   pair), and the answer-keyed methods under tool-augmented-model: a directed exchange with no
  #   loop, whose tools are tools_allowed, already material here.
  # Reviewer checks:
  #   - domain-specialist-model under the answer-keyed methods resolves here (P0-S2-T06), written
  #     for prompted specialists, but most domain-specialist entries are not prompted: geo-bench
  #     and massspecgym waive all five prompting fields. An ADR-0024-style move of those pairs to
  #     trained-model would retire the two waivers.
  #   - tool-augmented-model resolves here and not agentic: no loop, so no scaffold.
  - id: llm-static-text
    description: >
      A prompted language model scored against stored answers.
    material:
      - shots
      - chain_of_thought
      - reasoning_effort
      - tools_allowed
      - retries_allowed
      - subset_used
    applies_to:
      - [exact-match, base-model]
      - [exact-match, instruction-tuned-model]
      - [exact-match, reasoning-model]
      - [exact-match, domain-specialist-model]
      - [symbolic-equivalence, base-model]
      - [symbolic-equivalence, instruction-tuned-model]
      - [symbolic-equivalence, reasoning-model]
      - [symbolic-equivalence, domain-specialist-model]
      - [multiple-choice, base-model]
      - [multiple-choice, instruction-tuned-model]
      - [multiple-choice, reasoning-model]
      - [multiple-choice, domain-specialist-model]
      - [constraint-check, base-model]
      - [constraint-check, instruction-tuned-model]
      - [constraint-check, reasoning-model]
      - [constraint-check, domain-specialist-model]
      - [reference-metric, base-model]
      - [reference-metric, instruction-tuned-model]
      - [reference-metric, reasoning-model]
      - [reference-metric, domain-specialist-model]
      # 0.3.0 (P3-S10-T01)
      - [numeric-tolerance-match, base-model]
      - [numeric-tolerance-match, instruction-tuned-model]
      - [numeric-tolerance-match, reasoning-model]
      - [classification-metric, instruction-tuned-model]
      - [domain-metric, base-model]
      - [domain-metric, instruction-tuned-model]
      - [composite, base-model]
      - [composite, instruction-tuned-model]
      - [composite, reasoning-model]
      - [adversarial-red-team, instruction-tuned-model]
      - [exact-match, tool-augmented-model]
      - [numeric-tolerance-match, tool-augmented-model]
      - [symbolic-equivalence, tool-augmented-model]
      - [multiple-choice, tool-augmented-model]
      - [classification-metric, tool-augmented-model]

  # Basis: 04 S8's rows for scaffold and harness ("Terminal-Bench moves several points on harness
  #   alone"), selection_strategy and n_samples ("pass@1 and pass@4 are different measurements"),
  #   retries_allowed ("silent best-of-n"), plus llm-static-text's prompting fields; the eleven from
  #   04 S8's arithmetic; scaffold weighs 2.0 per 04 S8's w table. 0.3.0 puts every answer-keyed
  #   method under the entrant-built systems (agent-scaffold, full-product-pipeline,
  #   retrieval-augmented-system), as execution-tests already was: of the 14 fallback entries of
  #   this shape, 12 had declared scaffold and 13 harness in material_extra.
  # Reviewer checks:
  #   - k is not a member: a pass@1 run must leave k null (schema/conditions.py), which the key
  #     reads as unknown; 4 of the 14 declare k where pass@k is published.
  #   - full-product-pipeline resolves here though its components are undocumented by
  #     definition: an unknown scaffold is the honest state for a shipped product.
  #   - prospective-resolution and statistical-fit under agent-scaffold (ForecastBench) resolve
  #     here, so a forecasting benchmark that admits scaffolds is material on both rows.
  - id: agentic
    description: >
      A system acting over multiple steps, where the harness is part of the apparatus.
    material:
      - shots
      - chain_of_thought
      - reasoning_effort
      - tools_allowed
      - retries_allowed
      - subset_used
      - scaffold
      - harness
      - selection_strategy
      - n_samples
      - sandbox
    weights:
      scaffold: 2.0
    applies_to:
      - [execution-tests, agent-scaffold]
      - [execution-tests, multi-agent-system]
      - [execution-tests, tool-augmented-model]
      - [execution-tests, full-product-pipeline]
      - [execution-tests, retrieval-augmented-system]
      - [constraint-check, agent-scaffold]
      - [constraint-check, multi-agent-system]
      - [constraint-check, tool-augmented-model]
      - [constraint-check, full-product-pipeline]
      - [constraint-check, retrieval-augmented-system]
      - [composite, agent-scaffold]
      - [composite, multi-agent-system]
      - [composite, tool-augmented-model]
      - [composite, full-product-pipeline]
      - [composite, retrieval-augmented-system]
      # 0.3.0 (P3-S10-T01)
      - [environment-state-check, agent-scaffold]
      - [environment-state-check, full-product-pipeline]
      - [exact-match, agent-scaffold]
      - [exact-match, full-product-pipeline]
      - [exact-match, retrieval-augmented-system]
      - [numeric-tolerance-match, agent-scaffold]
      - [numeric-tolerance-match, full-product-pipeline]
      - [numeric-tolerance-match, retrieval-augmented-system]
      - [multiple-choice, agent-scaffold]
      - [multiple-choice, retrieval-augmented-system]
      - [formal-proof-check, agent-scaffold]
      - [domain-metric, agent-scaffold]
      - [domain-metric, full-product-pipeline]
      - [reference-metric, agent-scaffold]
      - [reference-metric, full-product-pipeline]
      - [reference-metric, retrieval-augmented-system]
      - [classification-metric, full-product-pipeline]
      - [classification-metric, retrieval-augmented-system]
      - [statistical-fit, agent-scaffold]
      - [prospective-resolution, agent-scaffold]
      - [uncertainty-calibration-score, agent-scaffold]
      - [human-distribution-percentile, agent-scaffold]
      - [tournament-play, agent-scaffold]
      - [adversarial-red-team, agent-scaffold]

  # Basis: 04 S8's judge row ("the judge is part of the apparatus": PaperBench, HealthBench,
  #   BixBench) and 02 S5 (model-graded-judge: "Judge model and version are required fields";
  #   model-derived-metric: "The scoring model's version is part of the result"); judge_model
  #   weighs 2.0 per 04 S8. 0.3.0 adds the judge methods under full-product-pipeline,
  #   retrieval-augmented-system, tool-augmented-model and model-in-benchmark-harness (as under
  #   agent-scaffold), and composite under generative-media-model (VBench's composite of
  #   model-scored dimensions). Of the 10 fallback entries of these pairs, 9 had declared
  #   judge_model and 7 judge_model_version.
  # Reviewer checks:
  #   - the judge methods under a model that is not prompted go to model-scored instead, which
  #     drops the prompting fields.
  - id: model-graded
    description: >
      A judge model is part of the apparatus, so its identity and prompt are material.
    material:
      - shots
      - chain_of_thought
      - reasoning_effort
      - subset_used
      - judge_model
      - judge_model_version
      - judge_prompt_hash
      - grading_rubric_ref
    weights:
      judge_model: 2.0
    applies_to:
      - [model-graded-judge, base-model]
      - [model-graded-judge, instruction-tuned-model]
      - [model-graded-judge, reasoning-model]
      - [model-graded-judge, agent-scaffold]
      - [model-graded-judge, generative-media-model]
      - [rubric-graded, base-model]
      - [rubric-graded, instruction-tuned-model]
      - [rubric-graded, reasoning-model]
      - [rubric-graded, agent-scaffold]
      - [rubric-graded, generative-media-model]
      - [model-derived-metric, base-model]
      - [model-derived-metric, instruction-tuned-model]
      - [model-derived-metric, reasoning-model]
      - [model-derived-metric, agent-scaffold]
      - [model-derived-metric, generative-media-model]
      # 0.3.0 (P3-S10-T01)
      - [model-graded-judge, full-product-pipeline]
      - [model-graded-judge, tool-augmented-model]
      - [model-graded-judge, model-in-benchmark-harness]
      - [rubric-graded, full-product-pipeline]
      - [rubric-graded, tool-augmented-model]
      - [rubric-graded, model-in-benchmark-harness]
      - [model-derived-metric, full-product-pipeline]
      - [model-derived-metric, retrieval-augmented-system]
      - [composite, generative-media-model]

  # Basis: 13 S4.5 (the provider snapshot is material where an endpoint, not an artifact, is
  #   evaluated) and 02 S6 (Epoch's 927 endpoint slugs mix model, host and effort). 0.3.0 adds
  #   constraint-check, composite and ordinal-grading under hosted-inference-endpoint (HELM
  #   Capabilities, AILuminate: language-model endpoints), and pairwise-preference-elo under
  #   generative-media-model: LMArena's media arenas rank served endpoints, as its text arena does.
  # Reviewer checks:
  #   - [pairwise-preference-elo, generative-media-model] here rather than human-judged: the votes
  #     are human, but the rating pool lives on the claim (rating_pool) and LMArena already
  #     resolves hosted-api with shots waived.
  #   - the members are a language model's, so the corpus's two non-language endpoints resolve
  #     trained-model instead: [reference-metric, hosted-inference-endpoint] (Open ASR's speech
  #     APIs) and [domain-metric, hosted-inference-endpoint] (CAMEO's structure servers). Their
  #     snapshot is still material in fact; 13 S4.5 keeps provider_snapshot on this row only, so
  #     an entry declares it (Open ASR does; CAMEO does not).
  - id: hosted-api
    description: >
      The evaluated artifact is an endpoint rather than an artifact, so the provider snapshot is material.
    material:
      - shots
      - reasoning_effort
      - tools_allowed
      - subset_used
      - provider_snapshot
      - provider_snapshot_available
    applies_to:
      - [exact-match, hosted-inference-endpoint]
      - [multiple-choice, hosted-inference-endpoint]
      - [execution-tests, hosted-inference-endpoint]
      - [model-graded-judge, hosted-inference-endpoint]
      - [pairwise-preference-elo, hosted-inference-endpoint]
      # 0.3.0 (P3-S10-T01)
      - [constraint-check, hosted-inference-endpoint]
      - [composite, hosted-inference-endpoint]
      - [ordinal-grading, hosted-inference-endpoint]
      - [pairwise-preference-elo, generative-media-model]

  # Basis: 04 S8's rows for simulator + simulator_version ("BEHAVIOR's score is undefined outside
  #   a specific OmniGibson/Isaac-Sim build") and hardware_platform, with the sampling fields; 02
  #   S5 simulation-rollout ("Record the simulator and build"). 0.3.0 adds multi-agent-system under
  #   simulation-rollout, episodic-return and tournament-play (SMAC, Melting Pot, Bi-DexHands,
  #   GLEE), composite under rl-policy (nuPlan's closed-loop score), and simulation-rollout under
  #   reasoning-model (ARC-AGI-3), as under agent-scaffold.
  # Reviewer checks:
  #   - hardware_platform for software-only environments: ARC-AGI-3 waives it.
  - id: simulation
    description: >
      The score is defined inside a specific simulator build.
    material:
      - simulator
      - simulator_version
      - hardware_platform
      - subset_used
      - selection_strategy
      - n_samples
    applies_to:
      - [simulation-rollout, rl-policy]
      - [simulation-rollout, agent-scaffold]
      - [simulation-rollout, physical-robot-system]
      - [simulation-rollout, classical-algorithm]
      - [episodic-return, rl-policy]
      - [episodic-return, agent-scaffold]
      - [episodic-return, physical-robot-system]
      - [episodic-return, classical-algorithm]
      # 0.3.0 (P3-S10-T01)
      - [simulation-rollout, multi-agent-system]
      - [simulation-rollout, reasoning-model]
      - [episodic-return, multi-agent-system]
      - [tournament-play, multi-agent-system]
      - [composite, rl-policy]

  # Basis: 04 S8's rows for hardware_platform ("A policy on an H1 is not a policy on a
  #   Cobot-Magic") and venue (physical site); 02 S5 physical-trial ("High variance, low
  #   reproducibility"). 0.3.0 adds classical-algorithm under physical-trial (Duckietown and
  #   safe-control-gym controllers) and the pooled methods under physical-robot-system (A2RL,
  #   F1TENTH, RoboArena), whose matches are run on the hardware.
  - id: physical-trial
    description: >
      A run happens on hardware at a venue, both of which change the number.
    material:
      - hardware_platform
      - venue
      - subset_used
      - n_samples
    applies_to:
      - [physical-trial, physical-robot-system]
      - [physical-trial, rl-policy]
      - [physical-trial, human-expert]
      - [physical-trial, human-ai-team]
      # 0.3.0 (P3-S10-T01)
      - [physical-trial, classical-algorithm]
      - [tournament-play, physical-robot-system]
      - [pairwise-preference-elo, physical-robot-system]

  # Basis: 04 S8 and 04 S13 (CACHE: the assay protocol is the condition that matters), 02 S5
  #   wet-lab-validation and expert-panel-assessment. Unchanged in 0.3.0.
  # Reviewer checks:
  #   - eligibility_track is a member though 04 S8 does not tie it to wet-lab work; CASP and CAPRI
  #     declare their model-selection rules (selection_strategy) as extras instead.
  - id: wet-lab
    description: >
      Ground truth comes from a bench protocol, which is the condition that matters.
    material:
      - assay_protocol
      - subset_used
      - eligibility_track
    applies_to:
      - [wet-lab-validation, scientific-surrogate-model]
      - [wet-lab-validation, domain-specialist-model]
      - [wet-lab-validation, classical-algorithm]
      - [expert-panel-assessment, scientific-surrogate-model]
      - [expert-panel-assessment, domain-specialist-model]
      - [expert-panel-assessment, classical-algorithm]

  # Basis: 04 S8's lead_time row ("A 3-day and a 10-day forecast score are not the same number")
  #   and resolution_window; 02 S5 prospective-resolution ("a published score is provisional until
  #   resolution"). 0.3.0 adds prospective-resolution under domain-specialist-model and
  #   classical-algorithm (CAFA, whose curator declared resolution_window) and under
  #   reasoning-model; prospective-resolution and statistical-fit under human-nonexpert
  #   (ForecastBench's crowd, as for human-expert); uncertainty-calibration-score under
  #   reasoning-model (HLE), as for the other prompted models.
  # Reviewer checks:
  #   - statistical-fit and uncertainty-calibration-score under the prompted models resolve here
  #     (P0-S2-T06), which makes lead_time material on HLE's calibration error; under trained
  #     subjects the same methods resolve trained-model, with the horizon an extra (five entries
  #     declare lead_time).
  - id: forecasting
    description: >
      The horizon and the resolution window decide what the number means.
    material:
      - lead_time
      - resolution_window
      - subset_used
      - training_data_policy
    applies_to:
      - [prospective-resolution, scientific-surrogate-model]
      - [prospective-resolution, base-model]
      - [prospective-resolution, instruction-tuned-model]
      - [prospective-resolution, human-expert]
      - [statistical-fit, base-model]
      - [statistical-fit, instruction-tuned-model]
      - [statistical-fit, human-expert]
      - [uncertainty-calibration-score, scientific-surrogate-model]
      - [uncertainty-calibration-score, base-model]
      - [uncertainty-calibration-score, instruction-tuned-model]
      - [uncertainty-calibration-score, human-expert]
      # 0.3.0 (P3-S10-T01)
      - [prospective-resolution, reasoning-model]
      - [prospective-resolution, domain-specialist-model]
      - [prospective-resolution, classical-algorithm]
      - [prospective-resolution, human-nonexpert]
      - [statistical-fit, reasoning-model]
      - [statistical-fit, human-nonexpert]
      - [uncertainty-calibration-score, reasoning-model]

  # Basis: ADR-0024 D3 (the six entries that resolved forecasting here all waived lead_time and
  #   resolution_window). 0.3.0 adds the other answer-keyed methods under
  #   scientific-surrogate-model (Matbench, MoleculeNet, TDC ADMET, OC20, JARVIS, Virtual Cell
  #   Challenge, Matbench Discovery); none of their resolved sets changes, since each already hit
  #   this row. The members equal trained-model's; the row keeps its ADR-0024 name.
  - id: surrogate-fit
    description: >
      A learned surrogate scored by its error against stored simulator, DFT or measured fields. Nothing is
      forecast, so there is no horizon; which subset was scored and what the model was trained on move the
      number (ADR-0024: the six entries that resolved `forecasting` here all waived its lead_time and
      resolution_window).
    material:
      - subset_used
      - training_data_policy
    applies_to:
      - [statistical-fit, scientific-surrogate-model]
      # 0.3.0 (P3-S10-T01)
      - [classification-metric, scientific-surrogate-model]
      - [composite, scientific-surrogate-model]
      - [exact-match, scientific-surrogate-model]
      - [numeric-tolerance-match, scientific-surrogate-model]
      - [reference-metric, scientific-surrogate-model]

  # Basis: 04 S8's row for human_in_loop and human_assistance, with grading_rubric_ref for the
  #   rubric raters apply; 02 S5 human-expert-eval and human-crowd-eval. 0.3.0 adds
  #   human-expert-eval and human-crowd-eval under every remaining machine subject, and
  #   pairwise-preference-elo under instruction-tuned-model, tool-augmented-model and
  #   full-product-pipeline (BigLaw Bench's attorney preferences): the raters are the instrument.
  # Reviewer checks:
  #   - human_in_loop and human_assistance describe help given to the entrant; no condition field
  #     names the rater pool, so the rating protocol is carried by grading_rubric_ref and subset.

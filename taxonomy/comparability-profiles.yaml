  # Basis: 02 S12.6 (Matbench Discovery groups models by what they were allowed to train on), 02
  #   S12.7 (ARC-AGI-3's two boards) and 04 S8's eligibility row. Unchanged in 0.3.0.
  # Reviewer checks:
  #   - nine entries waive eligibility_track or training_data_eligibility from this row (eth3d,
  #     image-matching-challenge, sen1floods11, tanks-and-temples, mlip-arena, putnambench,
  #     learn2design-2026, analoggym, ispd-contest), mostly through [domain-metric,
  #     classical-algorithm] and [formal-proof-check, *]. That is ADR-0024's signal that the rule,
  #     not the entries, should move; it is left for its own ADR, because Matbench Discovery and
  #     WeatherBench 2 depend on this row through [domain-metric, scientific-surrogate-model].
  #   - [domain-metric, reasoning-model] resolves here, while [domain-metric, base-model] and
  #     [domain-metric, instruction-tuned-model] resolve llm-static-text.
  - id: eligibility-gated
    description: >
      The benchmark runs separate tracks by what the entrant was allowed to train on.
    material:
      - eligibility_track
      - training_data_eligibility
      - training_data_policy
      - decontamination_applied
      - subset_used
    applies_to:
      - [domain-metric, scientific-surrogate-model]
      - [domain-metric, reasoning-model]
      - [domain-metric, classical-algorithm]
      - [domain-metric, rl-policy]
      - [formal-proof-check, scientific-surrogate-model]
      - [formal-proof-check, reasoning-model]
      - [formal-proof-check, classical-algorithm]
      - [formal-proof-check, rl-policy]
      - [tournament-play, scientific-surrogate-model]
      - [tournament-play, reasoning-model]
      - [tournament-play, classical-algorithm]
      - [tournament-play, rl-policy]

  # ---- added in 0.3.0 (P3-S10-T01, ADR-0029) ----------------------------------------------------

  # Basis: subjects.yaml task-specific-supervised-model ("scored as trained rather than
  #   instructed"); ADR-0024's surrogate-fit, the same two fields for surrogates. Of the 88
  #   fallback entries of this shape, 73 had declared training_data_policy and 61 subset_used (the
  #   fallback already held it); the next field, harness, was declared by 31 and stays an extra.
  #   Applies to the answer-keyed methods under task-specific-supervised-model and
  #   classical-algorithm, to the methods that are not prompted tests under
  #   domain-specialist-model, to the reference, domain and statistical metrics under
  #   generative-media-model, and to the two non-language hosted endpoints (see hosted-api).
  #   Pinned by hear, superb and zerospeech, whose frozen encoders under probes fit no subject
  #   term (the gap superb logged).
  # Reviewer checks:
  #   - classical algorithms are fitted or tuned, not trained; training_data_policy records what
  #     they were tuned on.
  #   - uncertainty-calibration-score under trained subjects resolves here, not forecasting: FAIR
  #     Universe HiggsML, LHC Olympics and PLAsTiCC are not forecasts, and BuildingsBench and the
  #     S2S challenge declare lead_time themselves.
  #   - [execution-tests, classical-algorithm] (Defects4J's repair tools) resolves here.
  - id: trained-model
    description: >
      A model or algorithm trained, fitted or pretrained for the task and scored as the artifact it is,
      not prompted, against a stored key. No prompt exists, so the prompting fields are meaningless;
      which subset was scored and what the entrant learned from move the number.
    material:
      - subset_used
      - training_data_policy
    applies_to:
      - [exact-match, task-specific-supervised-model]
      - [numeric-tolerance-match, task-specific-supervised-model]
      - [symbolic-equivalence, task-specific-supervised-model]
      - [multiple-choice, task-specific-supervised-model]
      - [constraint-check, task-specific-supervised-model]
      - [reference-metric, task-specific-supervised-model]
      - [classification-metric, task-specific-supervised-model]
      - [domain-metric, task-specific-supervised-model]
      - [statistical-fit, task-specific-supervised-model]
      - [composite, task-specific-supervised-model]
      - [uncertainty-calibration-score, task-specific-supervised-model]
      - [exact-match, classical-algorithm]
      - [constraint-check, classical-algorithm]
      - [reference-metric, classical-algorithm]
      - [classification-metric, classical-algorithm]
      - [statistical-fit, classical-algorithm]
      - [composite, classical-algorithm]
      - [uncertainty-calibration-score, classical-algorithm]
      - [execution-tests, classical-algorithm]
      - [classification-metric, domain-specialist-model]
      - [domain-metric, domain-specialist-model]
      - [statistical-fit, domain-specialist-model]
      - [composite, domain-specialist-model]
      - [uncertainty-calibration-score, domain-specialist-model]
      - [reference-metric, generative-media-model]
      - [domain-metric, generative-media-model]
      - [statistical-fit, generative-media-model]
      - [reference-metric, hosted-inference-endpoint]
      - [domain-metric, hosted-inference-endpoint]

  # Basis: subjects.yaml model-in-benchmark-harness ("Record the harness and its version in the
  #   conditions, because the number belongs to the model inside that harness"); 04 S8's rows for
  #   reasoning_effort, the sampling fields and retries_allowed. The harness fixes the scaffold,
  #   prompts, tools and sandbox identically for every entrant, so `harness` answers for them. Of
  #   the 16 fallback entries of this shape, 16 had declared harness, 5 reasoning_effort, 5
  #   n_samples and 3 retries_allowed.
  # Reviewer checks:
  #   - harness weighs 1.0: 04 S8's w table doubles only judge_model and scaffold, though the
  #     harness plays the scaffold's part here.
  #   - 10 of the 16 declared scaffold, mostly entries that also list agent-scaffold, which
  #     brings the agentic row; max_steps (4 of 16) stays an extra.
  - id: harnessed-model
    description: >
      A model driven by the benchmark's own fixed loop, prompts and tools, identical for every entrant, so
      the harness version and the model-side settings decide the number.
    material:
      - harness
      - reasoning_effort
      - n_samples
      - selection_strategy
      - retries_allowed
      - subset_used
    applies_to:
      - [environment-state-check, model-in-benchmark-harness]
      - [execution-tests, model-in-benchmark-harness]
      - [exact-match, model-in-benchmark-harness]
      - [numeric-tolerance-match, model-in-benchmark-harness]
      - [symbolic-equivalence, model-in-benchmark-harness]
      - [multiple-choice, model-in-benchmark-harness]
      - [constraint-check, model-in-benchmark-harness]
      - [classification-metric, model-in-benchmark-harness]
      - [domain-metric, model-in-benchmark-harness]
      - [composite, model-in-benchmark-harness]
      - [formal-proof-check, model-in-benchmark-harness]
      - [simulation-rollout, model-in-benchmark-harness]
      - [episodic-return, model-in-benchmark-harness]
      - [tournament-play, model-in-benchmark-harness]
      - [human-distribution-percentile, model-in-benchmark-harness]
      - [adversarial-red-team, model-in-benchmark-harness]

  # Basis: 04 S8's row for human_in_loop and human_assistance ("CASP ranks human-expert and
  #   automated-server groups separately") and 02 S6 ("Without human_in_loop in the conditions
  #   and human-ai-team in this facet, those two rows are indistinguishable"). Applies to the
  #   human-ai-team pairs: CASP, CAPRI, RNA-Puzzles, CASMI and CACHE rank human-assisted entrants
  #   beside automated ones, and whether a person helped is what separates the rows. Of those five
  #   entries, three had declared human_assistance (casp, casmi, cache-challenges) and one
  #   human_in_loop (rna-puzzles).
  # Reviewer checks:
  #   - human_in_loop is not a member: human_assistance's three values (none, permitted,
  #     required) were written for CASP's human and server categories and already say whether a
  #     person helped; the boolean would count the one distinction twice. rna-puzzles keeps it as
  #     an extra.
  - id: human-participant
    description: >
      Human-assisted entrants are ranked beside automated ones, so how much a person helped is material.
    material:
      - human_assistance
      - subset_used
    applies_to:
      - [exact-match, human-ai-team]
      - [domain-metric, human-ai-team]
      - [wet-lab-validation, human-ai-team]
      - [expert-panel-assessment, human-ai-team]

  # Basis: 04 S7 (a human score on a benchmark is a Baseline, with its own population and
  #   protocol) and 02 S6 (designed_for_subjects names who the benchmark is BUILT to evaluate).
  #   Where a benchmark lists human-expert or human-nonexpert beside machines (GPQA, MMMU, MMAU,
  #   ARC-AGI, WebArena, OSWorld, ChemBench, PI-CAI, A2RL), people sit the test as a scored
  #   population; nothing about how they sat it is a condition of a machine's claim, and a machine
  #   helped by a person is a claim about a human-ai-team, which human-participant covers. So the row
  #   adds only the subset. None of the 18 entries of these pairs had declared a human field for
  #   this reason (gaia's human_in_loop is about its own plugin choice).
  # Reviewer checks:
  #   - A2RL's human pilots and GLEE's human players compete in the same events as machines; if
  #     their rows are claims rather than Baselines, human_assistance belongs on those entries.
  - id: human-baseline
    description: >
      People sit the benchmark as a scored population beside the machines; their scores are baselines, so
      the row adds only the subset to a machine's conditions.
    material:
      - subset_used
    applies_to:
      - [exact-match, human-expert]
      - [exact-match, human-nonexpert]
      - [numeric-tolerance-match, human-expert]
      - [multiple-choice, human-expert]
      - [multiple-choice, human-nonexpert]
      - [reference-metric, human-expert]
      - [classification-metric, human-expert]
      - [domain-metric, human-expert]
      - [domain-metric, human-nonexpert]
      - [composite, human-expert]
      - [composite, human-nonexpert]
      - [environment-state-check, human-expert]
      - [environment-state-check, human-nonexpert]
      - [simulation-rollout, human-nonexpert]
      - [tournament-play, human-expert]
      - [tournament-play, human-nonexpert]
      - [model-graded-judge, human-expert]
      - [model-graded-judge, human-nonexpert]
      - [model-derived-metric, human-expert]

  # Basis: 04 S8's row for selection_strategy, k and n_samples ("pass@1 and pass@4 are different
  #   measurements", "code benchmarks"); llm-static-text's prompting fields plus the test harness
  #   and the selection strategy, which names how the reported sample was chosen (single,
  #   pass-at-k, avg-at-k). Of the 8 fallback entries of this shape, 6 had declared n_samples, 6 k,
  #   5 harness, 5 sampling, and 4 each shots, chain_of_thought and reasoning_effort. Every member
  #   is also agentic's, so an agentic code benchmark's set does not change.
  # Reviewer checks:
  #   - n_samples (declared by 6 of 8) is left an extra, beside k: selection_strategy carries the
  #     aggregation, and the SciCode bridge claims (P3, held at condition_completeness >= 0.6)
  #     state the strategy but not the sample count, so making it a member moves them to 0.56.
  #     Add it once those claims answer it.
  #   - k and sampling stay extras: k must be null on a pass@1 run, which the key reads as
  #     unknown, and 04 S8 makes temperature non-material.
  #   - formal-proof-check under base-model and task-specific-supervised-model (neural provers
  #     sampled at pass@k: ProofNet, miniF2F) resolves here.
  - id: llm-code
    description: >
      A prompted model whose output is executed or machine-checked, often sampled several times; the test
      harness and how the reported sample was chosen decide the number as much as the prompt does.
    material:
      - shots
      - chain_of_thought
      - reasoning_effort
      - tools_allowed
      - retries_allowed
      - subset_used
      - harness
      - selection_strategy
    applies_to:
      - [execution-tests, base-model]
      - [execution-tests, instruction-tuned-model]
      - [execution-tests, reasoning-model]
      - [execution-tests, domain-specialist-model]
      - [formal-proof-check, base-model]
      - [formal-proof-check, task-specific-supervised-model]

  # Basis: 02 S5 model-derived-metric ("The scoring model's version is part of the result") and
  #   04 S8's judge row and weight, under subjects that are not prompted, so trained-model's two
  #   fields replace the prompting ones. Of the 7 fallback entries of this shape, 5 had declared
  #   training_data_policy and 2 the judge.
  # Reviewer checks:
  #   - FCD-, DNSMOS- and COMET-style scorers are pinned by the benchmark's code version; where an
  #     entry's harness fixes the scorer, a judge_model naming the scorer answers the field.
  #   - judge_model weighs 2.0 here as on model-graded; 04 S8 says "model-graded", and a scoring
  #     model is not a judge (02 S5).
  - id: model-scored
    description: >
      A model that is not prompted is scored by another model -- a classifier, an encoder, a judge -- so
      the scoring model's identity and version are material beside what the entrant learned from.
    material:
      - subset_used
      - training_data_policy
      - judge_model
      - judge_model_version
    weights:
      judge_model: 2.0
    applies_to:
      - [model-derived-metric, task-specific-supervised-model]
      - [model-derived-metric, domain-specialist-model]
      - [model-derived-metric, classical-algorithm]
      - [model-derived-metric, attack-or-intervention-method]
      - [model-graded-judge, task-specific-supervised-model]
      - [model-graded-judge, domain-specialist-model]
      - [model-graded-judge, attack-or-intervention-method]

  # Basis: evaluation-methods.yaml entrant-relative-ranking ("tag the methods that produced the
  #   underlying scores as well"): the rank adds no run condition of its own, and the pool and its
  #   snapshot have no EvalConditions field (a rating claim names its rating_pool,
  #   schema/claim.py). So the row is the floor, and the conditions that matter come from the
  #   benchmark's other methods. Pinned by epoch-capabilities-index, whose subjects are empty by
  #   ADR-0020.
  # Reviewer checks:
  #   - date_evaluated as a stand-in for the pool snapshot is not made material; ECI and
  #     AILuminate declare it themselves.
  - id: relative-ranking
    description: >
      The number ranks or rescales each entrant against the others in the pool, so it adds no condition
      beyond those of the scores it is computed from.
    material:
      - subset_used
    applies_to:
      - [entrant-relative-ranking, instruction-tuned-model]
      - [entrant-relative-ranking, reasoning-model]
      - [entrant-relative-ranking, task-specific-supervised-model]
      - [entrant-relative-ranking, domain-specialist-model]
      - [entrant-relative-ranking, scientific-surrogate-model]
      - [entrant-relative-ranking, classical-algorithm]
      - [entrant-relative-ranking, full-product-pipeline]
      - [entrant-relative-ranking, hosted-inference-endpoint]
      - [entrant-relative-ranking, model-in-benchmark-harness]
      - [entrant-relative-ranking, multi-agent-system]
      - [entrant-relative-ranking, rl-policy]
      - [entrant-relative-ranking, physical-robot-system]
      - [entrant-relative-ranking, human-expert]
      - [entrant-relative-ranking, human-ai-team]

  # Basis: subjects.yaml attack-or-intervention-method ("ranked by its effect on" a fixed set of
  #   target models): the harness fixes the targets and the scoring. All 4 fallback entries of
  #   this shape had declared harness. A judge that decides success comes from the judge methods,
  #   which resolve model-scored.
  # Reviewer checks:
  #   - the attack budget (queries, optimisation steps) and the target-model set have no single
  #     condition field and stay with `harness` and extras.
  - id: intervention
    description: >
      An attack, defence, unlearning or editing procedure is ranked by what it does to fixed target
      models, so the harness that fixes the targets and the scoring is material.
    material:
      - harness
      - subset_used
    applies_to:
      - [adversarial-red-team, attack-or-intervention-method]
      - [environment-state-check, attack-or-intervention-method]
      - [execution-tests, attack-or-intervention-method]
      - [multiple-choice, attack-or-intervention-method]
      - [reference-metric, attack-or-intervention-method]
      - [domain-metric, attack-or-intervention-method]

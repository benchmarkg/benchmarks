    examples: []
  - id: biology-genetics/transcriptomics
    label: Transcriptomics
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring a biological state or condition from bulk gene-expression measurements.
    examples: []
  - id: biology-genetics/single-cell-analysis
    label: Single cell analysis
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Turning single-cell or spatially resolved omics measurements into cell-level results,
      whether assignments, integrated embeddings, denoised profiles or inferred interactions.
    inclusion_test: >
      Tag this as PRIMARY if the tasks take single-cell or spatial omics measurements as input
      and most of them score cell-level results: labels, trajectories, batch integration,
      denoising, modality prediction, spatial deconvolution or cell-cell communication.
    exclusion_test: >
      Do NOT tag this if most tasks predict responses to perturbations the cells were not
      observed under (`perturbation-response-prediction`), or if the input is bulk expression
      (`transcriptomics`).
    examples:
      - ref: open-problems-in-single-cell-analysis
        qualifies: true
        why: >
          13 tasks over single-cell and spatial data, from label projection to denoising and
          spatial decomposition; perturbation prediction is one task and goes to secondary.
      - ref: virtual-cell-challenge-2026
        qualifies: false
        why: >
          NEAR MISS. Single-cell readouts throughout, but the task is predicting knockdown
          responses in unseen cell lines, which is `perturbation-response-prediction`.
  - id: biology-genetics/perturbation-response-prediction
    label: Perturbation response prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting how a cell's measured molecular profile changes under a genetic or chemical

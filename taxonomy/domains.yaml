# taxonomy/domains.yaml
#
# Facet 1 of 8, the navigational spine. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: domain
facet_kind: navigational
version: 0.9.0
updated: 2026-09-28
description: >
  The navigational spine. Two levels, `family/subdomain`: a benchmark carries exactly one
  primary domain and any number of secondary domains. A bare family is a navigational node
  and is never assignable to `domain.primary` or `domain.secondary[]`. Crossed with the
  capability-group rollup, this facet supplies the rows of the coverage matrix.

terms:
  # -------------------------------------------------------------- biology-genetics
  - id: biology-genetics
    label: Biology and genetics
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a biological molecule, system or signal.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity concerns proteins, nucleic acids, cells,
      organisms or neural activity.
    exclusion_test: >
      Do NOT tag this if a small molecule is scored for its own properties (ADMET, reactivity,
      synthesis), or nominated compounds are scored by what a wet-lab assay returns, which is
      `chemistry-materials`, and do NOT tag it where the endpoint is a clinical outcome, which is
      `medicine-health`. A small molecule scored for how it binds a protein, as a bound pose or a
      predicted affinity, stays here: the protein makes it biology, even for a drug candidate.
    examples:
      - ref: casp16
        qualifies: true
        why: >
          Protein and nucleic-acid structure prediction, assessed across dozens of groups.
      - ref: proteingym
        qualifies: true
        why: >
          Deep mutational scanning assays scored by rank correlation.
      - ref: virtual-cell-challenge-2026
        qualifies: true
        why: >
          Zero-shot perturbation response in unseen cell lines.
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Biomedical throughout, but the endpoint is clinical conversation quality,
          which is `medicine-health`.
    not_to_be_confused_with:
      - term: chemistry-materials
        distinction: >
          Both families claim a protein-small-molecule complex. The scored quantity decides: a
          bound pose or a binding affinity is biology-genetics; the molecule's own properties, or
          compounds nominated and then assayed, are chemistry-materials.
    seed_target: 25
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: biology-genetics/protein-structure-prediction
    label: Protein structure prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the three-dimensional structure of a protein from its sequence, scored against
      an experimentally determined structure.
    examples:
      - ref: casp
        qualifies: true
        why: >
          Blind biennial prediction of protein structures that are about to be determined but are
          not public, with each model scored as the experimental structure is released.
      - ref: cameo
        qualifies: true
        why: >
          Weekly blind evaluation of automated servers on PDB entries before release, with protein
          chains scored by LDDT and TM-score against the released structure.
      - ref: capri
        qualifies: false
        why: >
          NEAR MISS. Predictors often model the subunits from sequence, but CAPRI's own scores are
          computed per interface and its ranking counts interfaces, not folds, which is
          `protein-protein-interaction`.
      - ref: runs-n-poses
        qualifies: false
        why: >
          NEAR MISS. The protein is predicted too, but the success rate is defined on the ligand's
          pose and its contacts, which is `protein-ligand-cofolding`.
  - id: biology-genetics/nucleic-acid-structure
    label: Nucleic acid structure
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the folded structure of an RNA or DNA molecule, scored against an
      experimentally determined structure.
    examples:
      - ref: rna-puzzles
        qualifies: true
        why: >
          Blind 3D structure prediction of unpublished RNAs: each puzzle gives an RNA sequence and
          scores the predicted structure against the experimental one.
      - ref: cameo
        qualifies: true
        why: >
          As a secondary domain: a target is a whole PDB entry, so the DNA and RNA chains in it
          are scored by LDDT against the released structure.
      - ref: bend
        qualifies: false
        why: >
          NEAR MISS. Every input is a DNA sequence, but what is scored is regulatory state read
          from the sequence (enhancers, chromatin accessibility, methylation), not a folded
          structure against an experimental one, which is `regulatory-genomics`.
  - id: biology-genetics/protein-function-prediction
    label: Protein function prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Assigning functional annotations to a protein sequence, scored against curated function
      terms.
    examples:
      - ref: cafa
        qualifies: true
        why: >
          Functional annotations assigned to protein sequences, scored prospectively against the
          Gene Ontology annotations that accrue after the deadline.
      - ref: caid
        qualifies: true
        why: >
          Per-residue disorder, binding and linker annotations of protein sequences, scored
          against newly curated DisProt annotations.
      - ref: flip
        qualifies: false
        why: >
          NEAR MISS. The paper sets FLIP against CAFA's annotation task rather than joining it; no
          split assigns functional annotations, and its landscapes are
          `protein-fitness-prediction`.
  - id: biology-genetics/protein-fitness-prediction
    label: Protein fitness prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting how a mutation changes a protein's measured activity, stability or binding
      affinity.
    examples:
      - ref: proteingym
        qualifies: true
        why: >
          Mutation effects predicted zero-shot or supervised and scored against over 250 deep
          mutational scanning assays of measured fitness.
      - ref: flip
        qualifies: true
        why: >
          The measured activity, binding or stability of mutated protein sequences, split so that
          training sees few mutations and the test set many, as an engineering campaign does.
      - ref: moleculeace
        qualifies: false
        why: >
          NEAR MISS. Activity is predicted per target, but the protein is fixed in each data set
          and the small molecule varies, so no mutation's effect is predicted; it is
          `drug-target-interaction`.
  - id: biology-genetics/protein-design
    label: Protein design
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Generating novel protein sequences intended to satisfy a structural or functional
      specification.
    examples:
      - ref: protein-engineering-tournament
        qualifies: true
        why: >
          Teams generate novel enzyme sequences that maximise activity while holding stability and
          expression above a threshold, scored on what the wet lab measures.
      - ref: flip
        qualifies: false
        why: >
          NEAR MISS. Framed as protein engineering, but models only predict the measured fitness
          of given mutant sequences and generate none, which is `protein-fitness-prediction`.
  - id: biology-genetics/protein-protein-interaction
    label: Protein protein interaction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting whether two proteins bind and what the bound complex looks like.
    examples:
      - ref: capri
        qualifies: true
        why: >
          Blind prediction of unpublished protein complex structures, scored on how well a model
          reproduces the complex's interfaces.
      - ref: cameo
        qualifies: true
        why: >
          As a secondary domain: a target is a whole PDB entry, so a prediction is the complete
          complex and its interfaces are scored by interface LDDT.
      - ref: caid
        qualifies: false
        why: >
          NEAR MISS. Its Binding references label disordered residues that bind a partner of any
          type, but no partner or complex is predicted, which is `protein-function-prediction`.
  - id: biology-genetics/protein-ligand-cofolding
    label: Protein ligand cofolding
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the bound structure of a protein and a small molecule, either jointly or by
      placing the ligand into a given protein structure.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is the pose of a small molecule bound to a
      protein, whether the protein is predicted with it (co-folding) or given (re-docking), and
      whatever the method. The entry stays in biology-genetics even where the corpus files it
      under chemistry-materials, because the pose is a property of the protein complex.
    exclusion_test: >
      Do NOT tag this if nominated compounds are scored by what an assay returns
      (`chemistry-materials/experimental-hit-finding`), if only binding strength is predicted
      with no structure (`drug-target-interaction`), or if the partner is another protein
      (`protein-protein-interaction`) or a nucleic acid (`nucleic-acid-structure`).
    examples:
      - ref: runs-n-poses
        qualifies: true
        why: >
          Co-folding predictions for 2,073 protein-ligand systems, scored for pose success
          against the deposited structures.
      - ref: posebusters
        qualifies: true
        why: >
          Re-docks each cognate ligand into its receptor's crystal structure and scores the pose;
          docking with the protein given is inside this term.
      - ref: cache-challenges
        qualifies: false
        why: >
          NEAR MISS. Small molecules against a protein target, but they are scored by what the
          binding assay returns, which is `chemistry-materials/experimental-hit-finding`.
    not_to_be_confused_with:
      - term: chemistry-materials
        distinction: >
          A small molecule scored for its bound pose is here; chemistry-materials takes the
          molecule's own properties and assay-scored hit-finding. Both family exclusion tests
          draw this line, so it does not rest on where the subdomain happens to sit.
  - id: biology-genetics/genomics-variant-effect
    label: Genomics variant effect
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the functional or clinical consequence of a genetic variant.
    examples:
      - ref: cagi
        qualifies: true
        why: >
          Every challenge gives predictors genetic variants and scores the phenotypes they
          predict, by independent assessors.
      - ref: bend
        qualifies: true
        why: >
          As a secondary domain: two of its seven tasks classify whether a single-bp noncoding
          variant has an effect on expression or causes disease.
      - ref: flip
        qualifies: false
        why: >
          NEAR MISS. Mutations are scored, but they are engineered protein mutants assayed in the
          laboratory, not human genetic variants with clinical or expression consequences, which
          is `protein-fitness-prediction`.
      - ref: gue
        qualifies: false
        why: >
          NEAR MISS. Its Covid variant task assigns a SARS-CoV-2 genome segment to a lineage; the
          "variant" there is a viral lineage, not a genetic variant whose consequence is
          predicted.
  - id: biology-genetics/regulatory-genomics
    label: Regulatory genomics
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting regulatory activity such as expression level, chromatin state or
      transcription-factor binding directly from genomic sequence.
    examples:
      - ref: bend
        qualifies: true
        why: >
          Four of its seven tasks predict regulatory state (enhancers, chromatin accessibility,
          histone modification, CpG methylation) from human genomic sequence.
      - ref: gue
        qualifies: true
        why: >
          Most of its datasets classify promoters, transcription-factor binding and epigenetic
          marks directly from genomic sequence.
      - ref: dream5-network-inference
        qualifies: false
        why: >
          NEAR MISS. Regulatory networks are inferred, but no sequence is given: the data were
          expression values, chip descriptions and candidate transcription factors, which is
          `systems-biology`.
  - id: biology-genetics/transcriptomics
    label: Transcriptomics
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring a biological state or condition from bulk gene-expression measurements.
    examples:
      - ref: mlomics
        qualifies: true
        why: >
          Bulk TCGA tumour profiles, mRNA and miRNA expression among them, classified or clustered
          by the patient's cancer type or molecular subtype.
      - ref: dream5-network-inference
        qualifies: false
        why: >
          NEAR MISS. The inputs are bulk expression compendia, but the output is a network of
          regulatory edges and no state or condition is predicted, which is `systems-biology`.
      - ref: virtual-cell-challenge
        qualifies: false
        why: >
          NEAR MISS. The measurements are single-cell, and the task predicts expression rather
          than inferring a state from it, which is `perturbation-response-prediction`.
  - id: biology-genetics/single-cell-analysis
    label: Single cell analysis
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Turning single-cell or spatially resolved omics measurements into cell-level results,
      whether assignments, integrated embeddings, denoised profiles or inferred interactions.
    inclusion_test: >
      Tag this as PRIMARY if the tasks take single-cell or spatial omics measurements as input
      and most of them score cell-level results: labels, trajectories, batch integration,
      denoising, modality prediction, spatial deconvolution or cell-cell communication.
    exclusion_test: >
      Do NOT tag this if most tasks predict responses to perturbations the cells were not
      observed under (`perturbation-response-prediction`), or if the input is bulk expression
      (`transcriptomics`).
    examples:
      - ref: open-problems
        qualifies: true
        why: >
          13 tasks over single-cell and spatial data, from label projection to denoising and
          spatial decomposition; perturbation prediction is one task and goes to secondary.
      - ref: virtual-cell-challenge
        qualifies: false
        why: >
          NEAR MISS. Single-cell readouts throughout, but the task is predicting knockdown
          responses in unseen cell lines, which is `perturbation-response-prediction`.
  - id: biology-genetics/perturbation-response-prediction
    label: Perturbation response prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting how a cell's measured molecular profile changes under a genetic or chemical
      perturbation it has not been observed under.
    examples:
      - ref: virtual-cell-challenge
        qualifies: true
        why: >
          Single-cell expression after CRISPRi knockdowns in cell lines never seen perturbed,
          given only their unperturbed cells, scored against Arc's withheld measurements.
      - ref: open-problems
        qualifies: true
        why: >
          As a secondary domain: one of its 13 tasks, Perturbation Prediction, predicts expression
          after a small-molecule perturbation.
      - ref: dream5-network-inference
        qualifies: false
        why: >
          NEAR MISS. Knockout, overexpression and drug experiments are inputs, but no response to
          an unseen perturbation is predicted or scored; it is `systems-biology`.
  - id: biology-genetics/drug-target-interaction
    label: Drug target interaction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting whether a compound binds a specified biological target and how strongly.
    examples:
      - ref: moleculeace
        qualifies: true
        why: >
          How strongly a compound acts on one macromolecular target, regressed as the Ki or EC50
          the assay reported, across 30 ChEMBL target sets.
      - ref: lit-pcba
        qualifies: true
        why: >
          Compounds ranked for whether they are confirmed actives against one named protein
          target, from PubChem assay outcomes already measured.
      - ref: posebusters
        qualifies: false
        why: >
          NEAR MISS. A small molecule against a protein, but only its pose is scored and no
          binding strength is predicted, which is `protein-ligand-cofolding`.
      - ref: tdc-admet
        qualifies: false
        why: >
          NEAR MISS. CYP450, P-glycoprotein and hERG endpoints name proteins, but they are a small
          molecule's own ADMET properties, which is `chemistry-materials/drug-discovery-admet`.
    not_to_be_confused_with:
      - term: chemistry-materials/drug-discovery-admet
        distinction: >
          Binding a specified target is this term even when the compound is a drug candidate;
          what the body does to the compound once it is there is ADMET. Compounds nominated and
          then assayed for binding are `chemistry-materials/experimental-hit-finding`.
  - id: biology-genetics/systems-biology
    label: Systems biology
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Modelling the behaviour of a biological network or pathway as a whole system rather than
      predicting properties of its individual components.
    examples:
      - ref: dream5-network-inference
        qualifies: true
        why: >
          Genome-scale transcriptional regulatory networks inferred from four expression
          compendia, scored edge by edge against known interactions.
      - ref: beeline
        qualifies: true
        why: >
          A whole gene regulatory network recovered from single-cell expression and compared with
          a known network edge by edge; nothing is predicted about a single gene or cell.
      - ref: mlomics
        qualifies: false
        why: >
          NEAR MISS. STRING and KEGG mappings are shipped for downstream analysis, but no task
          scores a network or pathway model, which is `transcriptomics`.
  - id: biology-genetics/phylogenetics
    label: Phylogenetics
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring evolutionary relationships among sequences or organisms from molecular data.
    examples:
      - ref: gue
        qualifies: false
        why: >
          NEAR MISS. The Covid and species tasks classify a genome segment into a fixed label set
          and infer no evolutionary relationship or tree; GUE is `regulatory-genomics`.
    gap_placeholder: true   # 02 S3 changelog: kept although empty so the gap matrix can show the hole
  - id: biology-genetics/bioinformatics-analysis
    label: Bioinformatics analysis
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Executing a multi-step computational analysis over real biological data files to reach a
      stated scientific answer.
    examples:
      - ref: bixbench
        qualifies: true
        why: >
          Agents run multi-step analyses of real biological data files in a Jupyter notebook to
          answer each capsule's expert-reviewed questions.
      - ref: casmi
        qualifies: false
        why: >
          NEAR MISS. Raw LC-MS/MS files from metabolomics and environmental extracts are handed
          out, but the scored answer is a chemical identity, not the result of a multi-step
          analysis, which is `chemistry-materials/spectroscopy-interpretation`.
  - id: biology-genetics/neuroscience-decoding
    label: Neuroscience decoding
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering a stimulus, intention or behavioural variable from recorded neural activity.
    examples:
      - ref: neural-latents-benchmark
        qualifies: true
        why: >
          Models of monkey cortical spiking take recorded activity as input, and one scored
          metric, hand-velocity decoding, is this term's task; it is filed here as the nearest
          leaf.
      - ref: brain-score
        qualifies: false
        why: >
          NEAR MISS. Nothing is recovered from neural activity; models predict the recordings from
          the stimulus, the opposite direction, which is `brain-model-alignment`.
      - ref: physionet-challenge
        qualifies: false
        why: >
          NEAR MISS. Its 2023 and 2026 editions score EEG recordings, but the endpoint is a
          clinical outcome, which is `medicine-health/diagnosis-triage`.
  - id: biology-genetics/brain-model-alignment
    label: Brain model alignment
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Scoring how well a model's internal representations predict measured neural responses to
      the same inputs.
    examples:
      - ref: brain-score
        qualifies: true
        why: >
          Scores how well vision models' internal activations predict primate neural responses to
          the same images, normalised by noise ceilings.
      - ref: neural-latents-benchmark
        qualifies: false
        why: >
          NEAR MISS. No stimulus is given to the model and its internals are not compared with the
          brain; the entrant models the recordings themselves and is scored on neurons it was not
          shown, which is `neuroscience-decoding`.

  # -------------------------------------------------------------- robotics-embodiment
  - id: robotics-embodiment
    label: Robotics and embodiment
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks in which a policy acts through a physical or simulated body.
    inclusion_test: >
      Tag this as PRIMARY if the scored outcome is produced by embodied action -- manipulation,
      locomotion, navigation or driving.
    exclusion_test: >
      Do NOT tag this if the environment is symbolic with no body, and do NOT tag it where a
      physical apparatus is designed rather than operated, which is `engineering-design`.
    examples:
      - ref: humanoidbench
        qualifies: true
        why: >
          Whole-body humanoid control across 27 to 31 tasks with dexterous hands.
      - ref: libero
        qualifies: true
        why: >
          130 language-conditioned manipulation tasks, entirely in simulation.
      - ref: mujoco-gymnasium
        qualifies: false
        why: >
          NEAR MISS. Simulated bodies, but the benchmark's community and claim are about control
          algorithms in the abstract, which is why continuous-control sits here only when the
          embodiment is the point.
    seed_target: 25
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: robotics-embodiment/manipulation
    label: Manipulation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Controlling a robot arm or gripper to change the physical state of objects.
    examples:
      - ref: rlbench
        qualifies: true
        why: >
          100 tasks in which a simulated Franka Panda arm with a parallel gripper changes the
          state of objects on a table, scored on each task's success conditions.
      - ref: meta-world
        qualifies: true
        why: >
          50 tasks in which a simulated Sawyer arm reaches, pushes, picks and places, or opens
          doors and drawers, each episode scored on whether the object reached its goal.
      - ref: bi-dexhands
        qualifies: false
        why: >
          NEAR MISS. Every task is object manipulation, but the difficulty is the hands' degrees
          of freedom and no task uses a parallel gripper, which the term's distinction sends to
          `dexterous-manipulation`.
  - id: robotics-embodiment/dexterous-manipulation
    label: Dexterous manipulation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Manipulation whose difficulty is fine high-degree-of-freedom control, such as in-hand
      reorientation or precise insertion.
    examples:
      - ref: bi-dexhands
        qualifies: true
        why: >
          Manipulation by two simulated 24-DoF Shadow Hands, with the difficulty placed in the
          high-dimensional actuation and the contact-rich model.
      - ref: humanoidbench
        qualifies: true
        why: >
          As a secondary domain: its in-hand reorientation of two cubes and tight peg insertion
          are tasks whose difficulty is the hands' degrees of freedom.
      - ref: rlbench
        qualifies: false
        why: >
          NEAR MISS. Some tasks are precise (insert onto a peg, stack cups), but they are done
          with the Panda's parallel gripper, which the term's distinction keeps under
          `manipulation`.
      - ref: maniskill
        qualifies: false
        why: >
          NEAR MISS. ManiSkill3 has dexterous-hand tasks, but none is in the standard benchmark's
          listed set, and its insertion task uses a parallel gripper, which stays `manipulation`.
    not_to_be_confused_with:
      - term: robotics-embodiment/manipulation
        distinction: >
          Tag dexterous only where the difficulty is the degrees of freedom -- in-hand
          reorientation, fine insertion. Pick-and-place with a parallel gripper is manipulation
          however hard the scene is.
  - id: robotics-embodiment/bimanual-manipulation
    label: Bimanual manipulation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Manipulation benchmarks built around two coordinated arms, on tasks designed for a
      dual-arm embodiment.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is coordinated two-arm manipulation and
      its tasks are specified and scored on dual-arm embodiments. Decide for the benchmark, not
      task by task: a suite built for two arms stays here although some of its tasks one arm
      could complete.
    exclusion_test: >
      Do NOT tag this if the embodiment is a single arm or is left to the entrant, or if two
      arms are incidental to a claim about another setting, such as long-horizon household work
      (`mobile-manipulation`).
    examples:
      - ref: robotwin
        qualifies: true
        why: >
          Over 50 dual-arm collaborative tasks evaluated on dual-arm embodiments, although a few
          task names describe one-arm actions.
      - ref: behavior-1k
        qualifies: false
        why: >
          NEAR MISS. The home page names dexterous bimanual manipulation, but entrants may bring
          their own robot and the claim is household tasks in house-scale scenes, which is
          `mobile-manipulation`.
  - id: robotics-embodiment/locomotion
    label: Locomotion
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Controlling a legged or wheeled body to traverse terrain without falling or becoming
      stuck.
    examples:
      - ref: locomujoco
        qualifies: true
        why: >
          Simulated humanoids, a quadruped and human skeleton models move across the ground from
          motion capture, and an episode ends when the body falls.
      - ref: humanoidbench
        qualifies: true
        why: >
          As a secondary domain: 12 of its tasks (hurdle, stairs, slides, a pole forest, a tunnel)
          are locomotion, which the paper offers as easier primitive skills.
      - ref: ai-driving-olympics
        qualifies: false
        why: >
          NEAR MISS. The Duckiebot is wheeled, but nothing scored is about traversing terrain
          without falling or sticking; the road is flat tiles, and the score is a driving outcome,
          which is `autonomous-driving-planning`.
  - id: robotics-embodiment/whole-body-humanoid-control
    label: Whole body humanoid control
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Coordinating a humanoid's full kinematic chain on tasks where balance and manipulation
      cannot be solved separately.
    examples:
      - ref: humanoidbench
        qualifies: true
        why: >
          Every task is scored on a full humanoid whose legs, arms and hands are controlled
          together, and the manipulation tasks are built so that balance and manipulation cannot
          be separated.
      - ref: locomujoco
        qualifies: false
        why: >
          NEAR MISS. Its README calls it designed for whole-body control, but no task manipulates
          an object; the carry tasks hold a weight in front of the robot while it walks, which is
          `locomotion`.
  - id: robotics-embodiment/navigation
    label: Navigation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Moving an agent to a goal location in an environment it must perceive or map as it goes.
    examples:
      - ref: habitat-challenge
        qualifies: true
        why: >
          Every track (PointNav, ObjectNav, ImageNav) scores an agent moving to a goal in an
          environment it has not seen and has no map of.
      - ref: r2r
        qualifies: true
        why: >
          Scored on whether the agent, moving through an unseen building it must perceive as it
          goes, stops within 3 m of the goal location.
      - ref: carla-leaderboard
        qualifies: false
        why: >
          NEAR MISS. Agents must reach a destination from sparse waypoints, which meets the
          wording, but the subject is driving among traffic and the score counts traffic
          infractions, which is `autonomous-driving-planning`.
      - ref: eth3d
        qualifies: false
        why: >
          NEAR MISS. Its SLAM benchmark scores trajectories, but they are estimated from video
          recorded with a hand-held rig; no agent acts or moves, which is
          `vision/multi-view-stereo`.
  - id: robotics-embodiment/mobile-manipulation
    label: Mobile manipulation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks that require a robot both to move through an environment and to manipulate objects
      in it.
    examples:
      - ref: behavior-1k
        qualifies: true
        why: >
          A robot must move through house-scale scenes, across rooms, and manipulate many objects
          in them within one task; the paper's own keyword is mobile manipulation.
      - ref: robocasa
        qualifies: true
        why: >
          An arm on a mobile base acts across whole simulated kitchens, and navigation is one of
          the skills its tasks are built from.
      - ref: robothor-challenge
        qualifies: false
        why: >
          NEAR MISS. The agent moves through apartments, but it only moves and tilts its camera;
          nothing is picked up or moved, which is `navigation`.
  - id: robotics-embodiment/continuous-control
    label: Continuous control
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Low-level control of a continuous action space scored on a control objective rather than
      on completing a semantic task.
    examples:
      - ref: safe-control-gym
        qualifies: true
        why: >
          As a secondary domain: its quadrotor and cart-pole tasks are scored on a control
          objective (tracking error, cost, constraint violations).
      - ref: meta-world
        qualifies: false
        why: >
          NEAR MISS. The README calls the environments continuous control, but every task is
          scored on a semantic success condition, an object brought to its goal, which is
          `manipulation`.
      - ref: locomujoco
        qualifies: false
        why: >
          NEAR MISS. Its default score, matching a target centre-of-mass velocity, is a control
          objective, but the term holds control in the abstract, and these are gaits of specific
          bodies, which is `locomotion`.
  - id: robotics-embodiment/sim2real-transfer
    label: Sim-to-real transfer
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring how much of a policy's simulated performance survives deployment on physical
      hardware.
    examples:
      - ref: ai-driving-olympics
        qualifies: true
        why: >
          As a secondary domain: the organisers built it so that the same agent is scored in
          simulation and then on hardware, with separate simulation and real-robot leaderboards
          per challenge.
      - ref: robothor-challenge
        qualifies: false
        why: >
          NEAR MISS. Its test apartments have physical replicas and the top 2020 entries were to
          run on a real robot in them, but no physical run was scored in either edition, which
          leaves it `navigation`.
      - ref: simplerenv
        qualifies: false
        why: >
          NEAR MISS. It runs the other way, scoring policies trained on real data in simulation;
          its paired real runs validate the simulator as a proxy rather than score any policy's
          transfer.
  - id: robotics-embodiment/cross-embodiment-transfer
    label: Cross embodiment transfer
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring how well a policy trained on one robot body performs on a different body.
    examples:
      - ref: rlbench
        qualifies: false
        why: >
          NEAR MISS. The arm can be swapped for five others, but the README fixes the Franka Panda
          for benchmarking, so no transfer to another body is scored.
      - ref: locomujoco
        qualifies: false
        why: >
          NEAR MISS. Human motion capture is retargeted to each robot, so demonstrator and agent
          differ in body, but that is a condition of learning; no policy trained on one body is
          scored on another.
  - id: robotics-embodiment/human-robot-interaction
    label: Human robot interaction
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks in which a person is inside the control loop and the interaction itself is what is
      scored.
    examples: []
  - id: robotics-embodiment/autonomous-driving-planning
    label: Autonomous driving planning
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a driving trajectory or decision sequence, scored on the driving outcome rather
      than on perception accuracy.
    examples:
      - ref: carla-leaderboard
        qualifies: true
        why: >
          Closed-loop driving on secret routes in the CARLA simulator, scored on route completion
          and infractions, not perception accuracy.
      - ref: nuplan
        qualifies: true
        why: >
          Driving planners scored on the outcome of their trajectories through real logged scenes:
          at-fault collisions, drivable-area compliance, progress and comfort.
      - ref: nuscenes
        qualifies: false
        why: >
          NEAR MISS. Its prediction task forecasts other agents' trajectories, but they are scored
          by displacement from the logged future and nothing drives the car, which is
          `vision/driving-perception-3d`.
  - id: robotics-embodiment/drone-uav
    label: Drone and UAV
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Controlling an aerial vehicle, where flight dynamics and airspace constraints define the
      task.
    examples:
      - ref: a2rl-drone-championship
        qualifies: true
        why: >
          An autonomous drone is flown through a gated track at speed, and the result is its
          flight time or race placement, so flight dynamics define the task.
      - ref: safe-control-gym
        qualifies: true
        why: >
          Three of its four systems are quadrotors modelled on the Crazyflie 2.0, with tasks
          defined by flight dynamics and by state and input constraints on the vehicle.
      - ref: smac
        qualifies: false
        why: >
          NEAR MISS. The paper motivates it with coordinating drones and other multi-robot
          systems, but the units are StarCraft II game units with no physical body, which is
          `games-planning/real-time-strategy`.
  - id: robotics-embodiment/embodied-instruction-following
    label: Embodied instruction following
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Carrying out a natural-language instruction through physical or simulated embodied action.
    examples:
      - ref: calvin
        qualifies: true
        why: >
          The agent carries out chains of five natural-language instructions through simulated
          tabletop manipulation, scored by how far along the chain it gets.
      - ref: simplerenv
        qualifies: true
        why: >
          As a secondary domain: each manipulation task is given to a language-conditioned policy
          as a natural-language instruction.
      - ref: habitat-challenge
        qualifies: false
        why: >
          NEAR MISS. Goals are coordinates, one of a fixed set of object categories or an image,
          not natural-language instructions, which leaves it `navigation`.
      - ref: behavior-1k
        qualifies: false
        why: >
          NEAR MISS. Tasks are specified by goal conditions in predicate logic, which the scorer
          checks; the 2026 language annotations are training material, not the task specification.
  - id: robotics-embodiment/tactile-sensing
    label: Tactile sensing
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks whose primary input is touch or force sensing rather than vision.
    examples:
      - ref: humanoidbench
        qualifies: false
        why: >
          NEAR MISS. Whole-body tactile sensing (448 taxels) is implemented, but the results use
          state observations only and touch is the primary input of no scored task, which is
          `whole-body-humanoid-control`.

  # -------------------------------------------------------------- vision
  - id: vision
    label: Vision
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose input or output is visual and whose scored quantity is a property of that
      visual signal.
    inclusion_test: >
      Tag this as PRIMARY if the score measures what was recovered from, or produced as, an
      image, video or 3D signal.
    exclusion_test: >
      Do NOT tag this if the scored relation is between a visual signal and language -- a
      question answered about an image, an expression grounded in a scene, a caption retrieved
      for a photo -- which is `multimodal`. A text prompt that merely conditions generation does
      not make a benchmark multimodal; the discriminant is whether crossing between the
      modalities is what is scored. Do NOT tag it as primary either where overhead imagery is
      labelled with Earth-system quantities (`earth-climate/remote-sensing`), or where medical
      images carry clinically defined targets against a clinician reference standard
      (`medicine-health`), although the metric is a vision metric; the vision task subdomain is
      then secondary.
    examples:
      - ref: coco
        qualifies: true
        why: >
          Detection and segmentation scored directly against image content.
      - ref: scannet
        qualifies: true
        why: >
          ScanNet++: novel views scored against held-out DSLR photographs, and 3D semantic and
          instance labels scored on the laser-scan mesh.
      - ref: vbench
        qualifies: true
        why: >
          Generated video scored on sixteen dimensions of the video itself, although a text
          prompt conditioned it.
      - ref: geneval
        qualifies: false
        why: >
          NEAR MISS. Generated images, but the score is whether the image satisfies a
          compositional description, which makes the image-text relation the measured quantity.
    seed_target: 22
    core: false
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: vision/classification
    label: Classification
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Assigning a whole image to one or more categories.
    examples:
      - ref: imagenet
        qualifies: true
        why: >
          The headline task assigns each whole photograph to one of 1,000 classes, scored against
          its one ground-truth label by top-1 and top-5 accuracy.
      - ref: chexpert
        qualifies: true
        why: >
          As a secondary domain: each chest radiograph study gets a probability per finding, a
          multi-label image classification behind the clinical primary.
      - ref: kinetics
        qualifies: false
        why: >
          NEAR MISS. The labels are whole-item classes, but the items are videos, and recognising
          actions across a video's temporal extent is `video-understanding`.
      - ref: vqa
        qualifies: false
        why: >
          NEAR MISS. Many answers are object, colour or count labels, but they come from a
          free-form vocabulary in reply to a question, and no fixed label set is scored on the
          image alone, which is `multimodal/visual-qa`.
  - id: vision/detection
    label: Detection
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Localising and labelling individual object instances within an image.
    examples:
      - ref: coco
        qualifies: true
        why: >
          Detection of object instances in everyday photographs is its original task, the one the
          year-round server scores against withheld labels.
      - ref: ade20k
        qualifies: true
        why: >
          As a secondary domain: its InstSeg100 benchmark detects and masks individual object
          instances, scored by COCO-style AP.
      - ref: refcoco
        qualifies: false
        why: >
          NEAR MISS. The output is a box scored by IoU, but the scored relation is between the
          referring expression and the region, which is `multimodal/visual-grounding`.
      - ref: nuscenes
        qualifies: false
        why: >
          NEAR MISS. Its detection task localises and labels object instances, but as 3D boxes in
          the global frame from any of the sensors, while this term is defined within an image; it
          is `driving-perception-3d`.
  - id: vision/segmentation
    label: Segmentation
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Assigning a category label to every pixel or region of an image.
    examples:
      - ref: ade20k
        qualifies: true
        why: >
          One of 150 classes assigned to every pixel of a photograph, scored against the
          annotators' masks by mean IoU and pixel accuracy.
      - ref: cityscapes
        qualifies: true
        why: >
          Pixel-level, instance-level and panoptic labelling of street scenes; the headline task
          ranks by class IoU over every test pixel.
      - ref: wildfirespreadts
        qualifies: false
        why: >
          NEAR MISS. Segmentation networks output a per-pixel mask, but the mask is of a future
          state, not a labelling of the input image, and active fire is an Earth-system quantity,
          which is `earth-climate/hazard-prediction`.
      - ref: nuscenes
        qualifies: false
        why: >
          NEAR MISS. Its lidar segmentation and panoptic subsets label every lidar point, not
          image pixels, and stay under `driving-perception-3d` with the rest.
    not_to_be_confused_with:
      - term: earth-climate/remote-sensing
        distinction: >
          Same operation, different subject. Per-pixel labels of an Earth-system quantity (water,
          land cover, crops, ice) on satellite or airborne imagery are remote sensing, with this
          term secondary; segmentation is primary only when the benchmark's claim is the vision
          method and the labels are generic objects.
      - term: medicine-health/medical-imaging-segmentation
        distinction: >
          Masks of clinically defined structures against clinician reference annotations are
          medical-imaging-segmentation, with this term secondary where it is recorded at all.
  - id: vision/video-understanding
    label: Video understanding
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recognising actions, events or content across the temporal extent of a video.
    examples:
      - ref: kinetics
        qualifies: true
        why: >
          Each item is a 10-second clip, and what is scored is the one human action label
          recovered from it, by top-1 and top-5 accuracy.
      - ref: motchallenge
        qualifies: true
        why: >
          Every board scores pedestrian tracks recovered from a video, boxes linked by identity
          across frames, against hidden ground-truth tracks.
      - ref: video-mme
        qualifies: false
        why: >
          NEAR MISS. It is framed as video understanding and its task types include action
          recognition, but every task is posed as a multiple-choice question, which is
          `multimodal/video-language`.
      - ref: mpi-sintel
        qualifies: false
        why: >
          NEAR MISS. The inputs are video sequences, but the score is a per-pixel motion vector
          against ground truth, not a recognised action, event or temporal segment; it is
          `image-matching-correspondence`.
    not_to_be_confused_with:
      - term: multimodal/video-language
        distinction: >
          A video benchmark posed as question answering scores the answer's correspondence to
          the video, which is video-language (02 S11 rule 12), even when it calls itself video
          understanding. This term holds benchmarks scored on labels or temporal segments with
          no language to correspond to, such as action recognition and temporal localisation.
  - id: vision/3d-reconstruction
    label: 3D reconstruction
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering the three-dimensional geometry of a scene or object from images.
    examples:
      - ref: tanks-and-temples
        qualifies: true
        why: >
          Complete pipelines from video to dense point cloud, with camera calibration withheld,
          scored by F-score against laser scans.
      - ref: image-matching-challenge
        qualifies: true
        why: >
          As a secondary domain: since 2023 the task is itself to reconstruct scenes from image
          sets and give every camera's pose.
      - ref: eth3d
        qualifies: false
        why: >
          NEAR MISS. The site calls its scenarios a 3D reconstruction benchmark, but each scene's
          calibration is given, and calibrated-view matching is `multi-view-stereo`.
      - ref: dl3dv
        qualifies: false
        why: >
          NEAR MISS. It ships COLMAP poses and serves 3D representation learning, but nothing
          scores recovered geometry; a score on a rendered image is `novel-view-synthesis`.
    not_to_be_confused_with:
      - term: vision/multi-view-stereo
        distinction: >
          Multi-view stereo is one method of reconstruction and is kept separate because it is
          benchmarked on its own terms, with calibrated views given. Tag 3d-reconstruction when
          the benchmark scores recovered geometry regardless of how it was obtained.
      - term: vision/novel-view-synthesis
        distinction: >
          Reconstruction is scored on recovered geometry; novel-view synthesis is scored on a
          rendered image. A method can render a convincing new view without recovering usable
          geometry, and the two benchmarks disagree about whether that is success.
  - id: vision/novel-view-synthesis
    label: Novel view synthesis
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Rendering an unobserved viewpoint of a scene from a set of observed views, scored on the
      rendered image.
    examples:
      - ref: dl3dv
        qualifies: true
        why: >
          Unobserved views of each of 140 scenes are rendered and scored against held-out frames
          by PSNR, SSIM and LPIPS.
      - ref: tanks-and-temples
        qualifies: false
        why: >
          NEAR MISS. View-synthesis papers reuse its scenes and score rendered views, but that is
          a use outside the protocol; the official score is geometric, against laser scans, which
          is `3d-reconstruction`.
    not_to_be_confused_with:
      - term: vision/3d-reconstruction
        distinction: >
          The score is an image-quality metric against a held-out photograph, not a geometric
          error against a mesh or point cloud.
  - id: vision/multi-view-stereo
    label: Multi-view stereo
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering dense geometry specifically by matching pixels across multiple calibrated
      views.
    examples:
      - ref: eth3d
        qualifies: true
        why: >
          Built to evaluate stereo with calibrated views given; two of its three stereo scenarios
          score dense multi-view reconstructions against laser scans.
      - ref: tanks-and-temples
        qualifies: true
        why: >
          As a secondary domain: the paper compares MVS systems by fixing the SfM front end, and
          MVS networks are most of today's entrants.
      - ref: image-matching-challenge
        qualifies: false
        why: >
          NEAR MISS. Scenes are reconstructed from many views, but the camera poses are the
          unknowns being scored and no dense geometry is, which is
          `image-matching-correspondence`.
  - id: vision/image-matching-correspondence
    label: Image matching correspondence
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Finding corresponding points between two or more images of the same scene.
    examples:
      - ref: image-matching-challenge
        qualifies: true
        why: >
          Images of one scene matched across wide baselines, scored through the accuracy of the
          camera poses the matches recover.
      - ref: mpi-sintel
        qualifies: true
        why: >
          A dense optical flow field, a correspondence for every pixel of one frame in the next,
          ranked by endpoint error against ground-truth flow.
      - ref: eth3d
        qualifies: false
        why: >
          NEAR MISS. Its two-view scenario matches pixels between a rectified pair, but the scored
          quantity is the disparity map against laser-scan ground truth, which is
          `depth-geometry`; no correspondence set is scored.
  - id: vision/image-restoration-enhancement
    label: Image restoration enhancement
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering a degraded image, scored against a reference copy of the undegraded original.
    examples:
      - ref: ntire
        qualifies: true
        why: >
          Most tracks recover an image or video from a degraded one (super-resolution, denoising,
          deblurring, dehazing), scored against the withheld clean reference.
      - ref: brats
        qualifies: true
        why: >
          As a secondary domain: its inpainting task (2023 on) fills a voided region of a T1 scan
          and scores it against the real scan.
      - ref: dl3dv
        qualifies: false
        why: >
          NEAR MISS. Rendered images are scored against held-out photographs by PSNR, SSIM and
          LPIPS, but no degraded image is recovered; the output is an unobserved viewpoint, which
          is `novel-view-synthesis`.
  - id: vision/depth-geometry
    label: Depth geometry
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Estimating per-pixel depth or surface orientation from one or more images.
    examples:
      - ref: kitti
        qualifies: true
        why: >
          Its founding boards score per-pixel disparity or depth maps from a forward stereo pair
          against laser ground truth.
      - ref: nyu-depth
        qualifies: true
        why: >
          The headline use estimates per-pixel depth from one RGB image, scored against the Kinect
          depth of 654 indoor test images.
      - ref: cityscapes
        qualifies: false
        why: >
          NEAR MISS. Right stereo views ship with every frame and the tables flag methods that use
          depth, but no task scores a depth or disparity map, which leaves it `segmentation`.
      - ref: image-matching-challenge
        qualifies: false
        why: >
          NEAR MISS. Depth maps derived from its reconstructions feed intermediate metrics, but
          the ranked score is pose accuracy, not per-pixel depth.
  - id: vision/driving-perception-3d
    label: 3D driving perception
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Perceiving the three-dimensional road scene from vehicle-mounted sensors.
    examples:
      - ref: nuscenes
        qualifies: true
        why: >
          Every perception task is scored on the road scene around a car, recovered in 3D from its
          own cameras, lidar and radar.
      - ref: kitti
        qualifies: true
        why: >
          As a secondary domain: its odometry, 3D and bird's-eye-view detection boards score the
          road scene from the car's sensors.
      - ref: carla-leaderboard
        qualifies: false
        why: >
          NEAR MISS. Agents perceive the road scene from vehicle sensors, but nothing perceptual
          is scored; the driving score is computed from the route driven, which is
          `robotics-embodiment/autonomous-driving-planning`.
      - ref: motchallenge
        qualifies: false
        why: >
          NEAR MISS. A few sequences come from a car, but the scenes are mostly pedestrian streets
          and indoor spaces filmed by static or handheld cameras, scored on 2D image boxes.
  - id: vision/image-generation
    label: Image generation
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing an image, scored on properties of the generated image itself.
    examples:
      - ref: geneval
        qualifies: false
        why: >
          NEAR MISS. The images are generated and scored by vision models, but nothing is scored
          without the prompt, and the benchmark defines itself against FID for exactly that, which
          is `multimodal/any-to-any-generation`.
      - ref: ntire
        qualifies: false
        why: >
          NEAR MISS. Perceptual tracks reward realism and many entries are diffusion-based, but
          the output must reproduce the input's content and is scored against a reference, which
          is `image-restoration-enhancement`.
  - id: vision/video-generation
    label: Video generation
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a video, scored on properties of the generated video itself.
    examples:
      - ref: vbench
        qualifies: true
        why: >
          The seven video-quality dimensions score the generated video alone and outweigh prompt
          consistency four to one in the leaderboard's Total Score.
      - ref: dl3dv
        qualifies: false
        why: >
          NEAR MISS. Camera-controlled video generators train on its videos, but that is use of
          the dataset as training data and defines no score of the benchmark's, which is
          `novel-view-synthesis`.
    not_to_be_confused_with:
      - term: multimodal/any-to-any-generation
        distinction: >
          When some scored dimensions check the video against its prompt and others score the
          video alone, the benchmark's headline claim decides: fidelity of the generated video
          is this term, with any-to-any-generation secondary; adherence to the prompt as the
          headline is any-to-any-generation, with this term secondary.
  - id: vision/document-understanding
    label: Document understanding
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Extracting structure and content from document images such as forms, tables and reports.
    examples:
      - ref: omnidocbench
        qualifies: true
        why: >
          Full-page PDF parsing scored on the text, tables, formulas and reading order recovered
          from the page image against layout-level annotations.
      - ref: docvqa
        qualifies: true
        why: >
          As a secondary domain: its questions test the layout, forms, tables and handwriting of
          scanned industry documents, though each is scored on the answer.
      - ref: iam-handwriting
        qualifies: false
        why: >
          NEAR MISS. The images are scanned forms, but the scored unit is a segmented text line
          and its transcription; no layout or form structure is scored, which is
          `ocr-handwriting`.
      - ref: chartqa
        qualifies: false
        why: >
          NEAR MISS. Charts are structured visual content and the repository ships each chart's
          data table, but no extracted structure is scored; the items are questions, which is
          `multimodal/chart-diagram-understanding`.
    not_to_be_confused_with:
      - term: multimodal/visual-qa
        distinction: >
          The format of the item decides, as for any image (02 S11 rule 12). A document-image
          benchmark posed as questions is visual-qa, with this term secondary; this term holds
          document benchmarks scored on the extracted structure or content itself, such as
          layout analysis, key-value extraction and table structure recognition.
  - id: vision/ocr-handwriting
    label: OCR and handwriting
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Transcribing printed or handwritten text in images into character sequences.
    examples:
      - ref: iam-handwriting
        qualifies: true
        why: >
          A recogniser reads a scanned line of handwriting and outputs its character sequence,
          scored by character and word error rate against the transcription.
      - ref: icdar2015-incidental-scene-text
        qualifies: true
        why: >
          Words in casual wearable-camera photos are localised and read into character sequences,
          scored against the annotated words.
      - ref: docvqa
        qualifies: false
        why: >
          NEAR MISS. Answers are read from printed and handwritten text, but the score is the
          answer to a question, not a transcription of the page, which is `multimodal/visual-qa`.
  - id: vision/medical-imaging-cv
    label: Medical imaging (computer vision)
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Computer-vision methods evaluated on medical images, where the benchmark's claim is the
      method rather than a clinical task.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is a vision method (robustness,
      pretraining, generalisation across sites or scanners) and medical images are its test
      domain, with no clinical task claimed for the result.
    exclusion_test: >
      Do NOT tag this if the targets are clinically defined (lesions, organs, findings,
      diagnoses) and clinicians set the reference standard, which is `medicine-health` whatever
      the metric. Dice and FROC are vision metrics, so the metric never decides.
    examples:
      - ref: brats
        qualifies: false
        why: >
          NEAR MISS. Scored by Dice and surface distance, but on clinically defined tumour
          sub-regions against expert masks, which is
          `medicine-health/medical-imaging-segmentation`.
      - ref: luna16
        qualifies: false
        why: >
          NEAR MISS. A false-positive track invites image-classification teams, but the task is
          nodule detection for lung cancer screening against a radiologist reference standard,
          which is `medicine-health/medical-imaging-diagnostic`.
      - ref: medmnist
        qualifies: true
        why: >
          Standardised biomedical image classification datasets built to isolate the learning
          algorithm, with clinical use disclaimed: the claim is the method, and medical images are
          the test domain.
    not_to_be_confused_with:
      - term: medicine-health/medical-imaging-diagnostic
        distinction: >
          The discriminant is the benchmark's claim, not its metric. A clinical task scored
          against a clinical reference standard is medicine-health/medical-imaging-diagnostic
          even when the metric is a vision metric; a vision method tested on medical images is
          vision/medical-imaging-cv.
      - term: medicine-health/medical-imaging-segmentation
        distinction: >
          Masks of clinically defined structures against clinician annotations are
          medical-imaging-segmentation, although Dice is a vision metric; this term takes a
          segmentation benchmark only when its claim is the method.

  # -------------------------------------------------------------- agents-tooluse
  - id: agents-tooluse
    label: Agents and tool use
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a system acting autonomously through tools or interfaces.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is what an autonomous loop achieved using
      tools, APIs, a browser or an operating system, and the grader checks the state it left or
      the result it returned.
    exclusion_test: >
      Do NOT tag this if the environment is a game, which is `games-planning`, and do NOT tag it
      where the grader scores software the agent wrote -- tests run against a patch or program,
      or the performance of a model or analysis it built -- which is `code`, with this family's
      subdomain as secondary. Decide from the benchmark's grading protocol, not task by task:
      when the grader checks a machine's end state (files, services, configuration), this
      family is primary even where some tasks leave a program behind.
    examples:
      - ref: osworld-2-0
        qualifies: true
        why: >
          Dozens of interdependent GUI actions against live application state.
      - ref: tau2-bench
        qualifies: true
        why: >
          Multi-turn tool-and-user interaction scored under a domain policy.
      - ref: terminal-bench
        qualifies: true
        why: >
          Operating a machine to a target state, where harness choice alone moves results
          several points.
      - ref: swe-bench-verified
        qualifies: false
        why: >
          NEAR MISS. Solved almost entirely by agents, but the scored artifact is a patch judged
          by tests, which is `code`.
    not_to_be_confused_with:
      - term: code
        distinction: >
          An agentic harness does not decide the family; the grader does. Tests or a held-out
          score applied to software the agent wrote (a patch, a trained model's predictions) make
          it `code`; a check of the machine or environment state it left makes it
          agents-tooluse.
    seed_target: 20
    core: false
    coverage_status: surveyed
    curation_posture: mixed
    reviewer_signoff: none
  - id: agents-tooluse/web-navigation
    label: Web navigation
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing tasks by browsing and acting on live or recorded web pages.
    examples:
      - ref: webarena
        qualifies: true
        why: >
          812 tasks on self-hosted shopping, forum, GitLab, CMS and map sites, where the grader
          checks the answer the agent returned or the state it left in the websites.
      - ref: mind2web
        qualifies: true
        why: >
          Tasks on 137 real websites, the system choosing the element and operation for each step
          on recorded pages; every task stays in a browser.
      - ref: toolbench
        qualifies: false
        why: >
          NEAR MISS. The APIs are web services, but they are called as functions with parameters,
          not reached by browsing pages, which is `tool-api-calling`.
      - ref: androidworld
        qualifies: false
        why: >
          NEAR MISS. A WebView subset and three Chrome tasks show web pages, but the headline
          tasks run in native Android apps, which is `computer-use-gui`.
  - id: agents-tooluse/computer-use-gui
    label: Computer use (GUI)
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing tasks by operating a graphical user interface through synthetic mouse and
      keyboard input.
    inclusion_test: >
      Tag this as PRIMARY if the agent operates desktop applications through a graphical
      interface, observing the screen and acting by mouse and keyboard, and the grader checks
      the resulting application or file state. Episode length does not move it: a long-horizon
      GUI benchmark stays here, with `long-horizon-autonomy` as secondary.
    exclusion_test: >
      Do NOT tag this if the tasks are confined to web sites in a browser (`web-navigation`), or
      if the agent acts through a shell or an API with no graphical interface
      (`operating-system-tasks`, `tool-api-calling`).
    examples:
      - ref: osworld
        qualifies: true
        why: >
          108 long-horizon workflows operated through screenshots and mouse and keyboard actions;
          the horizon goes to `long-horizon-autonomy` as secondary.
      - ref: webarena
        qualifies: false
        why: >
          NEAR MISS. Long-horizon tasks acted out on rendered pages, but confined to self-hosted
          web sites, which is `web-navigation`.
    not_to_be_confused_with:
      - term: agents-tooluse/long-horizon-autonomy
        distinction: >
          This term names an interface; long-horizon-autonomy names a property of the episode
          that any interface can have. The interface is primary and the horizon secondary.
  - id: agents-tooluse/tool-api-calling
    label: Tool and API calling
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Selecting and invoking external functions or APIs correctly to satisfy a request.
    inclusion_test: >
      Tag this as PRIMARY if a single agent under evaluation is scored on selecting and invoking
      functions or APIs correctly against a backend, including when a simulated user converses
      with it or acts on the shared state with tools of its own.
    exclusion_test: >
      Do NOT tag this if several agents under evaluation must divide work or reach agreement
      (`multi-agent-coordination`), if the calls do clinical work against a health record
      system (`medicine-health/clinical-agent-workflows`), or if the headline is resistance to
      instructions injected into tool outputs (`safety-alignment/prompt-injection`).
    examples:
      - ref: tau-bench
        qualifies: true
        why: >
          tau2-bench: one agent calls domain APIs under a policy while a simulated user acts on
          the same environment; the dual-control setting goes to `multi-agent-coordination` as
          secondary.
      - ref: agentdojo
        qualifies: false
        why: >
          NEAR MISS. 97 tool-use tasks with a utility score, but the title and the attack
          framework make security against injection the claim, which is
          `safety-alignment/prompt-injection`; this term is secondary.
      - ref: gaia
        qualifies: false
        why: >
          NEAR MISS. No functions or APIs are specified, offered or checked, and only the final
          answer is scored, which is `web-navigation`.
    not_to_be_confused_with:
      - term: agents-tooluse/multi-agent-coordination
        distinction: >
          A simulated user, even one with tools of its own, is part of the environment.
          Coordination needs several agents under evaluation, or a score that is the
          coordination itself.
      - term: safety-alignment/prompt-injection
        distinction: >
          Utility and attack success reported side by side on the same tool-use tasks go by the
          benchmark's claim: security is prompt-injection, with this term secondary.
  - id: agents-tooluse/multi-agent-coordination
    label: Multi agent coordination
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks that require several agents to divide work, communicate or reach agreement.
    examples:
      - ref: theagentcompany
        qualifies: false
        why: >
          NEAR MISS. LLM colleagues take part, but one agent is evaluated; the colleagues are
          simulated characters supplied to every entrant, which is environment, and a multi-agent
          design is one entrant's internals.
      - ref: hanabi
        qualifies: false
        why: >
          NEAR MISS. Agents must coordinate and signal to each other, but the family's exclusion
          test sends a game environment to games-planning, here
          `games-planning/card-imperfect-information`.
    not_to_be_confused_with:
      - term: agents-tooluse/tool-api-calling
        distinction: >
          One agent under evaluation facing a simulated user is tool-api-calling, whatever tools
          the simulated user holds; this term needs the coordination between evaluated agents to
          be what is scored.
  - id: agents-tooluse/long-horizon-autonomy
    label: Long horizon autonomy
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks requiring many dependent steps across an extended episode without human
      intervention.
    examples:
      - ref: paperbench
        qualifies: true
        why: >
          One replication attempt is a single unattended episode of many dependent steps, up to
          twelve hours for the agent and twelve more for the reproduction run.
      - ref: vending-bench-2
        qualifies: true
        why: >
          A model runs a simulated vending-machine business for a year through tools; the claim is
          coherence over that year, and no interface subdomain describes it.
      - ref: mind2web
        qualifies: false
        why: >
          NEAR MISS. Each step is scored on its own with the reference history supplied, so no
          episode is run and an error does not carry into later steps.
      - ref: appworld
        qualifies: false
        why: >
          NEAR MISS. Tasks take dozens of dependent API calls, but leaderboard rows average 3 to
          72 agent turns, most between 10 and 40, not the extended unattended run the term names;
          `tool-api-calling` describes the benchmark.
    not_to_be_confused_with:
      - term: agents-tooluse/computer-use-gui
        distinction: >
          Long horizon is a property of the episode, not an interface or a task. When an
          interface or task subdomain describes the benchmark (GUI, web, shell, ML engineering),
          that subdomain is primary and this term secondary; this term is primary only when none
          does.
  - id: agents-tooluse/research-agents
    label: Research agents
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Agents that gather, synthesise and cite external sources to answer an open research
      question.
    examples:
      - ref: browsecomp
        qualifies: false
        why: >
          NEAR MISS. Deep-research agents are prominent entrants, but each question has one short
          answer that is right or wrong, not an open research question, and nothing gathered or
          cited is scored; it is `web-navigation`.
      - ref: gaia
        qualifies: false
        why: >
          NEAR MISS. Answering means gathering and combining information from several sources, but
          every question has one short factual answer, and citing sources is not scored.
  - id: agents-tooluse/software-agents
    label: Software agents
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Agents that complete software engineering work inside a real repository or toolchain.
    inclusion_test: >
      Tag this if an autonomous agent does software-engineering work inside a real repository or
      toolchain, navigating files and running builds and tests itself. Tag it as PRIMARY only
      when the grader checks the toolchain's or environment's end state; when tests judge the
      code the agent wrote, `code` is primary and this term is secondary (02 S12.11).
    exclusion_test: >
      Do NOT tag this if the work is not software engineering -- operating a shell or desktop to
      a target state is `operating-system-tasks` or `computer-use-gui` -- or if the system
      returns code without acting in a repository or toolchain.
    examples:
      - ref: swe-bench-verified
        qualifies: true
        why: >
          SECONDARY. Coding agents resolve real issues inside real repositories, but the patch is
          judged by tests, so `code/repository-scale-se` is primary.
      - ref: terminal-bench
        qualifies: false
        why: >
          NEAR MISS. Agents work in a shell and some tasks are debugging or security fixes, but
          the tasks range over bringing a container to a target state, which is
          `operating-system-tasks`.
      - ref: swe-bench-pro
        qualifies: true
        why: >
          As a secondary domain: the protocol itself is agentic, every model working a whole
          repository in an agent scaffold for up to 50 turns, but tests judge the patch, so
          `code/repository-scale-se` is primary.
    not_to_be_confused_with:
      - term: code/repository-scale-se
        distinction: >
          Repository-scale SE names the code change; this term names the agent making it. When
          tests judge the patch, repository-scale-se is primary and this term secondary.
  - id: agents-tooluse/negotiation
    label: Negotiation
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks scored on the outcome of a bargaining interaction between parties with conflicting
      objectives.
    examples:
      - ref: vending-bench-2
        qualifies: true
        why: >
          As a secondary domain: the business's prices come from bargaining with supplier models,
          and the benchmark's page calls negotiation key.
      - ref: glee
        qualifies: false
        why: >
          NEAR MISS. The definition fits its bargaining and negotiation games, but the players
          exchange only offers, decisions and messages, with no tools, APIs, browser or operating
          system, and the family's exclusion sends a game environment to games-planning; it is
          `society-econ-law/economics-simulation`.
      - ref: textarena
        qualifies: false
        why: >
          NEAR MISS. Several games are bargaining interactions, but they are a few games of the
          suite and are played in a game environment, which is `games-planning/multi-game-suites`.
  - id: agents-tooluse/operating-system-tasks
    label: Operating system tasks
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing tasks against a real operating system, filesystem or shell.
    examples:
      - ref: terminal-bench
        qualifies: true
        why: >
          An agent operates a real Linux container through a shell, and the grader checks the
          state it left there.
      - ref: replibench
        qualifies: true
        why: >
          As a secondary domain: every task family runs through bash in a sandboxed container or
          pod.
      - ref: osworld
        qualifies: false
        why: >
          NEAR MISS. Some tasks change the operating system or its files, but through the
          desktop's graphical interface, a terminal among its apps; only work through a shell or
          an API with no graphical interface comes here. It is `computer-use-gui`.
  - id: agents-tooluse/cybersecurity-offense-defense
    label: Cybersecurity offense defense
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks scored on finding, exploiting or defending against security vulnerabilities.
    examples:
      - ref: replibench
        qualifies: true
        why: >
          As a secondary domain: several of its task families score finding and exploiting
          vulnerabilities across a network of containers, or evading signature-based detection.
      - ref: wmdp
        qualifies: false
        why: >
          NEAR MISS. WMDP-Cyber asks closed-book knowledge questions about the stages of a
          cyberattack; no task is scored on finding, exploiting or defending a vulnerability. It
          is `safety-alignment/dangerous-capability-evals`.
      - ref: terminal-bench
        qualifies: false
        why: >
          NEAR MISS. Some tasks are security work (cracking a hash, fixing vulnerabilities,
          cryptanalysis), but they are a minority category, not the benchmark's claim.
  - id: agents-tooluse/agent-evaluation-suites
    label: Agent evaluation suites
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    # ADR-0016: a suite row of the coverage matrix counts suites, not task coverage. The gap
    # ranking reads a cell here as "is there a suite", never as coverage of the field.
    definition: >
      Suites whose scored tasks span several of the agents-tooluse family's subdomains,
      reported per task or as one aggregate, where the suite's own claim is coverage within
      the family.
    inclusion_test: >
      Tag this as PRIMARY if the tasks span two or more of the agents-tooluse family's
      subdomains, no one subdomain holds most of them, and the benchmark's own claim is breadth
      within the family. Record the subdomains the tasks fall in as secondary.
    exclusion_test: >
      Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and
      the others secondary), or if the suite spans several families, which is
      `general-intelligence`.
    examples:
      - ref: holistic-agent-leaderboard-hal
        qualifies: true
        why: >
          Nine existing agent benchmarks across web navigation, tool calling, research agents
          and coding, on separate boards with no aggregate. Every board scores what an agent
          achieved, so the breadth is inside the family; the coding boards add `code`
          secondaries.
      - ref: webarena
        qualifies: false
        why: >
          NEAR MISS. Several self-hosted sites and task types, but every task is web navigation,
          so `web-navigation` holds the whole benchmark.

  # -------------------------------------------------------------- chemistry-materials
  - id: chemistry-materials
    label: Chemistry and materials
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a molecule, material, reaction or catalyst.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is a property, structure or behaviour of matter
      at the molecular or crystalline scale, whatever method produces it.
    exclusion_test: >
      Do NOT tag this if the subject is a physical process rather than a substance, which is
      `physics`. The family is named for both communities deliberately: method does not decide
      the home, subject does, so a DFT-grounded materials benchmark is chemistry-materials and a
      quantum-simulation benchmark is physics. Do NOT tag it either where a small molecule is
      scored for how it binds a protein, as a bound pose or a predicted affinity, which is
      `biology-genetics` (`protein-ligand-cofolding`, `drug-target-interaction`). Compounds
      nominated and then assayed stay here, in `experimental-hit-finding`, because the
      experiment on the compound is the ground truth.
    examples:
      - ref: matbench-discovery
        qualifies: true
        why: >
          Stability screening over 256k structures; the subject is the material.
      - ref: open-catalyst
        qualifies: true
        why: >
          Catalyst surfaces and adsorption energies, evaluated with physics-derived methods on a
          chemical subject.
      - ref: cache
        qualifies: true
        why: >
          Prospective hit-finding with real binding assays.
      - ref: critpt
        qualifies: false
        why: >
          NEAR MISS. Research-level science, but the subject is physics reasoning rather than
          matter.
      - ref: runs-n-poses
        qualifies: false
        why: >
          NEAR MISS. The corpus files it here and the ligands are drug-like, but the scored
          quantity is the ligand's pose in its protein pocket, which is
          `biology-genetics/protein-ligand-cofolding`.
    not_to_be_confused_with:
      - term: biology-genetics
        distinction: >
          A small molecule scored for how it binds a protein, as a pose or an affinity, is
          biology-genetics even when it is a drug candidate. This family takes the molecule's
          own properties, and compounds nominated and then assayed.
      - term: biology-genetics/protein-ligand-cofolding
        distinction: >
          A protein-small-molecule complex scored as a bound pose is biology-genetics. This
          family takes the molecule's own properties, and compounds nominated and then assayed
          for binding (`experimental-hit-finding`).
    seed_target: 20
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: chemistry-materials/molecular-property-prediction
    label: Molecular property prediction
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting a physical, chemical or biological property of a molecule from its structure.
    examples:
      - ref: moleculenet
        qualifies: true
        why: >
          17 datasets, each scoring a property of a molecule predicted from its structure, from
          quantum-mechanical energies to effects on the human body.
      - ref: omol25
        qualifies: true
        why: >
          As a secondary domain: its seven chemistry evaluations score molecular quantities
          computed with the potential, such as ionisation energies, electron affinities and
          conformer energies.
      - ref: moses
        qualifies: false
        why: >
          NEAR MISS. Four computed properties are compared, but as distributions of a generated
          set against a test set; no property of a given molecule is predicted, which is
          `generative-molecular-design`.
      - ref: tdc-admet
        qualifies: false
        why: >
          NEAR MISS. Lipophilicity and solubility are physicochemical properties, but the group
          files them under absorption, and the more specific `drug-discovery-admet` covers all 22
          tasks.
  - id: chemistry-materials/reaction-prediction
    label: Reaction prediction
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the products of a chemical reaction from its reactants and conditions.
    examples:
      - ref: uspto-mit
        qualifies: true
        why: >
          Given a reaction's reactants and reagents, predict its product: about 480,000 US-patent
          reactions, scored by top-k accuracy.
      - ref: uspto-50k
        qualifies: false
        why: >
          NEAR MISS. Patent reactions again, but scored in the backward step, from a product to
          its reactants, which is `retrosynthesis`.
      - ref: omol25
        qualifies: false
        why: >
          NEAR MISS. Its Reactivity split holds structures along reaction paths, but what is
          scored is their energies and forces; no system predicts a reaction's products.
  - id: chemistry-materials/retrosynthesis
    label: Retrosynthesis
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Proposing a synthetic route from a target molecule back to purchasable starting materials.
    examples:
      - ref: paroutes
        qualifies: true
        why: >
          Multi-step routes from a target back to a stock standing in for purchasable compounds,
          the whole route scored by recovery of the patent's route in the top n.
      - ref: uspto-50k
        qualifies: true
        why: >
          Single-step retrosynthesis, the reactants that make a given product, scored by top-k
          exact match; kept here under ADR-0020's deferral of a single-step leaf.
      - ref: uspto-mit
        qualifies: false
        why: >
          NEAR MISS. The sources read score only the forward direction, from reactants to product,
          which is `reaction-prediction`.
  - id: chemistry-materials/generative-molecular-design
    label: Generative molecular design
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Generating novel molecules intended to satisfy a stated property specification.
    examples:
      - ref: guacamol
        qualifies: true
        why: >
          Molecules a model generates, scored as a distribution matching ChEMBL or as candidates
          for a stated property profile in 20 goal-directed benchmarks.
      - ref: moses
        qualifies: true
        why: >
          Sets of generated molecules scored by eleven metrics as distributions against a held-out
          reference set of drug-like molecules.
      - ref: massspecgym
        qualifies: false
        why: >
          NEAR MISS. Its de novo challenge generates molecules, but each is scored by closeness to
          the one molecule that was measured, recovering a known molecule rather than satisfying a
          specification; it is `spectroscopy-interpretation`.
      - ref: cache-challenges
        qualifies: false
        why: >
          NEAR MISS. Some workflows design new molecules, but most nominations are picked from
          commercial catalogues and the score is the assay, not a stated property specification,
          which is `experimental-hit-finding`.
  - id: chemistry-materials/catalysis
    label: Catalysis
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting catalytic activity, adsorption energies or reaction barriers on catalyst
      surfaces.
    examples:
      - ref: oc20
        qualifies: true
        why: >
          DFT adsorption energies, forces and relaxed structures for adsorbates on catalyst
          surfaces; IS2RE's relaxed energy is what catalysis screening uses.
      - ref: jarvis-leaderboard
        qualifies: true
        why: >
          As a secondary domain: its OC20 IS2RE, AGRA and TinNet tasks score adsorption energies.
      - ref: opendac
        qualifies: false
        why: >
          NEAR MISS. It copies the Open Catalyst tasks and scores adsorption energies, but on
          porous sorbents for gas capture, not catalyst surfaces, and no activity or barrier is
          predicted; it is `force-fields-potentials`.
  - id: chemistry-materials/spectroscopy-interpretation
    label: Spectroscopy interpretation
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring molecular structure or composition from spectroscopic measurements.
    examples:
      - ref: casmi
        qualifies: true
        why: >
          A recurring blind contest: entrants infer a small molecule's formula and structure from
          its mass spectra, ranked by where the confirmed structure falls.
      - ref: massspecgym
        qualifies: true
        why: >
          Its de novo and retrieval challenges take an MS/MS spectrum and score the structure
          inferred from it against the molecule that was measured.
      - ref: chembench
        qualifies: false
        why: >
          NEAR MISS. Its NMR items give a SMILES string and ask how many signals the spectrum
          would show, predicting a spectral feature from structure rather than inferring structure
          from a measurement; it is `molecular-property-prediction`.
  - id: chemistry-materials/crystal-structure-prediction
    label: Crystal structure prediction
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting which crystal structure a given composition will adopt.
    examples:
      - ref: cspbench
        qualifies: true
        why: >
          Each test item is a composition whose known crystal structure the algorithm must
          predict, scored by distances between the predicted and the known structure.
      - ref: matbench-discovery
        qualifies: false
        why: >
          NEAR MISS. Candidate crystals are relaxed and screened, but the score is their stability
          against a fixed DFT convex hull, not which structure a composition adopts; it is
          `crystal-stability-discovery`.
    not_to_be_confused_with:
      - term: chemistry-materials/crystal-stability-discovery
        distinction: >
          Structure prediction asks what arrangement a known composition adopts; stability
          discovery asks which of many candidate compositions are worth making at all. The first
          is scored against a known structure, the second against a computed or measured
          formation energy.
  - id: chemistry-materials/crystal-stability-discovery
    label: Crystal stability discovery
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Identifying which candidate crystalline materials are thermodynamically stable enough to
      be worth synthesising.
    examples:
      - ref: matbench-discovery
        qualifies: true
        why: >
          Energy models as pre-filters in a high-throughput search for stable inorganic crystals,
          scored on stability predictions against a fixed DFT convex hull.
      - ref: jarvis-leaderboard
        qualifies: true
        why: >
          As a secondary domain: its formation-energy, energy-above-hull and decomposition-energy
          tasks, the paper's flagship among them.
      - ref: cspbench
        qualifies: false
        why: >
          NEAR MISS. An energy distance is one metric, but it is the gap to the known structure's
          energy, and no candidate is screened for whether it is worth making; it is
          `crystal-structure-prediction`.
      - ref: matbench
        qualifies: false
        why: >
          NEAR MISS. Two tasks regress a formation energy, but nothing is screened for stability
          against a hull; the Matbench Discovery paper names that gap as its reason to exist.
    not_to_be_confused_with:
      - term: chemistry-materials/crystal-structure-prediction
        distinction: >
          Screening many candidates for stability is a different task from resolving the
          structure of one, and the metrics have different ceilings and headroom behaviour.
  - id: chemistry-materials/force-fields-potentials
    label: Force fields potentials
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Learning interatomic potentials scored against reference quantum-chemical calculations.
    examples:
      - ref: md17
        qualifies: true
        why: >
          Learned force fields scored against reference energies and forces along ab initio MD
          trajectories of small organic molecules.
      - ref: omol25
        qualifies: true
        why: >
          ML interatomic potentials whose energies and forces are scored against molecular DFT on
          held-out splits.
      - ref: moleculenet
        qualifies: false
        why: >
          NEAR MISS. The quantum sets are scored against DFT, but on properties of relaxed
          molecules, not the energies and forces along trajectories a learned potential supplies;
          it is `molecular-property-prediction`.
      - ref: cspbench
        qualifies: false
        why: >
          NEAR MISS. M3GNet and MEGNet potentials drive several of the searches, but no potential
          is scored against reference calculations; what is scored is the structure the whole
          algorithm predicts.
  - id: chemistry-materials/drug-discovery-admet
    label: Drug discovery admet
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting absorption, distribution, metabolism, excretion or toxicity properties of
      candidate drug molecules.
    examples:
      - ref: tdc-admet
        qualifies: true
        why: >
          22 tasks, each predicting an ADMET property of a small molecule from its structure,
          grouped under absorption, distribution, metabolism, excretion and toxicity.
      - ref: moleculenet
        qualifies: true
        why: >
          As a secondary domain: its physiology datasets (BBBP, Tox21, ToxCast, SIDER, ClinTox)
          score blood-brain-barrier penetration and toxicity of drug candidates and marketed
          drugs.
      - ref: moleculeace
        qualifies: false
        why: >
          NEAR MISS. Drug-like compounds throughout, but what is predicted is binding to a named
          target, which goes to `biology-genetics/drug-target-interaction` even for a drug
          candidate; nothing ADMET-related is predicted.
      - ref: chembench
        qualifies: false
        why: >
          NEAR MISS. Its toxicity and safety items concern hazard classes, exposure limits and
          safe handling of chemicals in general, not candidate drugs.
    not_to_be_confused_with:
      - term: biology-genetics/drug-target-interaction
        distinction: >
          Target interaction asks whether a compound binds; ADMET asks what the body does to the
          compound once it is there. A molecule can bind perfectly and fail ADMET entirely.
  - id: chemistry-materials/experimental-hit-finding
    label: Experimental hit finding
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Nominating compounds that are then synthesised and assayed, scored on what the experiment
      returned.
    examples:
      - ref: cache-challenges
        qualifies: true
        why: >
          Teams nominate compounds for a protein target, the organisers buy and assay them, and
          each team is scored on what those experiments return.
      - ref: protein-engineering-tournament
        qualifies: false
        why: >
          NEAR MISS. Candidates are nominated, synthesised and assayed, and the assay result is
          the score, but what is nominated is a protein, not a compound, which is
          `biology-genetics/protein-design`.
      - ref: asap-antiviral-competition
        qualifies: false
        why: >
          NEAR MISS. No compound is nominated for synthesis or assay; every assay had already been
          run and predictions are scored against those stored measurements, which is
          `biology-genetics/drug-target-interaction`.
  - id: chemistry-materials/lab-automation-protocols
    label: Lab automation protocols
    parent: chemistry-materials
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing an executable laboratory protocol from a stated experimental goal.
    examples:
      - ref: chembench
        qualifies: false
        why: >
          NEAR MISS. No item asks for a laboratory protocol and nothing is executed; the paper
          only motivates the benchmark by copilot systems for chemists.
    not_to_be_confused_with:
      - term: engineering-design/lab-automation-execution
        distinction: >
          Writing an executable protocol is scored on the protocol; running it on real equipment
          is scored on what came out of the machine. Only the second can fail for physical
          reasons.

  # -------------------------------------------------------------- medicine-health
  - id: medicine-health
    label: Medicine and health
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is clinical practice or a patient outcome.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity concerns diagnosis, treatment, clinical
      communication or a health endpoint.
    exclusion_test: >
      Do NOT tag this if the subject is biological mechanism without a clinical endpoint, which
      is `biology-genetics`, and do NOT tag it where medical images are used to test general
      vision methods, which is `vision/medical-imaging-cv`. The benchmark's claim decides that
      line, not its metric: where the targets are clinically defined (lesions, organs,
      findings, diagnoses) and clinicians set the reference standard, this family is primary
      even when the metric is Dice or FROC, and the vision subdomain is secondary.
    examples:
      - ref: healthbench
        qualifies: true
        why: >
          5,000 multi-turn clinical conversations against physician-authored rubric criteria.
      - ref: medagentbench-v2
        qualifies: true
        why: >
          Physician-written tasks against a live FHIR record.
      - ref: proteingym
        qualifies: false
        why: >
          NEAR MISS. Deeply biomedical, but the scored quantity is a protein fitness measurement
          with no clinical endpoint.
    seed_target: 20
    core: true
    coverage_status: surveyed
    curation_posture: mixed
    reviewer_signoff: none
  - id: medicine-health/clinical-qa
    label: Clinical QA
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering medical questions that have a determinate correct answer.
    examples:
      - ref: medqa
        qualifies: true
        why: >
          Multiple-choice questions from medical licensing exams in the US, Mainland China and
          Taiwan, each with one keyed answer.
      - ref: medcalc-bench
        qualifies: true
        why: >
          A medical calculator value computed from a patient note, one determinate reference
          answer per item (a number, a date or a gestational age) with no options given.
      - ref: pubmedqa
        qualifies: false
        why: >
          NEAR MISS. The questions are medical, but the label is what the article's own results
          show, so without the supplied abstract there is no determinate answer; it is
          `biomedical-literature`.
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Replies are open-ended and scored against many rubric criteria, not against
          one determinate answer, which is `medical-safety`.
  - id: medicine-health/clinical-dialogue
    label: Clinical dialogue
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Conducting a multi-turn clinical conversation, scored on the conduct of the exchange
      rather than on a single reply.
    examples:
      - ref: ddxplus
        qualifies: true
        why: >
          As a secondary domain: in its evidence-acquisition half, interaction length and
          positive-evidence recall score the conduct of the agent's questioning.
      - ref: agentclinic
        qualifies: true
        why: >
          As a secondary domain: the diagnosis comes out of a multi-turn interview, and two
          analyses score the conduct of that exchange (the patient agent's ratings, clinicians'
          realism and empathy ratings).
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Health conversations throughout, but one reply to a given history is scored,
          not the conduct of the exchange, which the 0.9.0 definition asks; it is
          `medical-safety`.
      - ref: counselbench
        qualifies: false
        why: >
          NEAR MISS. Every item is one question and one reply, scored on that reply; the paper
          names multi-turn dialogue as future work.
  - id: medicine-health/diagnosis-triage
    label: Diagnosis triage
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a diagnosis or an urgency assessment from a presented case.
    examples:
      - ref: agentclinic
        qualifies: true
        why: >
          A doctor agent interviews a simulated patient and orders tests; the score is whether its
          final diagnosis matches the case's.
      - ref: ddxplus
        qualifies: true
        why: >
          A differential diagnosis produced from a presented case (age, sex, an initial evidence
          and the answers to the agent's questions), scored on whether it holds the patient's
          pathology.
      - ref: ehrshot
        qualifies: false
        why: >
          NEAR MISS. Six tasks ask whether a first diagnosis will be recorded within a year of
          discharge, a prognosis from the record rather than a diagnosis from a presented case; it
          is `ehr-prediction`.
      - ref: chexpert
        qualifies: false
        why: >
          NEAR MISS. Findings are read from images against an imaging reference standard, and no
          case history is presented, which is `medical-imaging-diagnostic`.
  - id: medicine-health/medical-imaging-diagnostic
    label: Medical imaging diagnostic
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Detecting clinical findings in, or reaching a diagnostic conclusion from, medical images,
      scored against a clinical reference standard.
    inclusion_test: >
      Tag this as PRIMARY if the system detects findings (nodules, metastases, lesions) or
      assigns a diagnosis or stage from medical images, and a reference standard set by
      clinicians scores it, whatever the metric (FROC, AUC, kappa).
    exclusion_test: >
      Do NOT tag this if regions are delineated and scored as masks
      (`medical-imaging-segmentation`), if the output is a free-text report
      (`radiology-report-generation`), or if the benchmark's claim is a vision method that uses
      medical images as its test domain (`vision/medical-imaging-cv`).
    examples:
      - ref: camelyon17
        qualifies: true
        why: >
          Metastasis detection in lymph-node slides, scored as a patient-level pN stage against a
          pathologist-supervised reference.
      - ref: luna16
        qualifies: true
        why: >
          Pulmonary nodule detection in chest CT, scored by FROC against nodules marked by
          radiologists. A nodule is a finding rather than a diagnosis, and findings are inside
          this term.
      - ref: rexrank
        qualifies: false
        why: >
          NEAR MISS. Chest X-ray interpretation, but the output is a written report, which is
          `radiology-report-generation`.
    not_to_be_confused_with:
      - term: vision/medical-imaging-cv
        distinction: >
          Same rule from the clinical side: the claim decides, not the metric. A clinical task
          against a clinician reference standard is this term even when scored by a vision
          metric; it is a vision benchmark only when its claim is the method.
  - id: medicine-health/medical-imaging-segmentation
    label: Medical imaging segmentation
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Delineating anatomical or pathological regions in medical images.
    inclusion_test: >
      Tag this as PRIMARY if the system delineates clinically defined anatomical or
      pathological regions in medical images and is scored as masks (Dice, surface distance)
      against clinician reference annotations. Dice is a vision metric, and it does not move
      the benchmark to `vision`.
    exclusion_test: >
      Do NOT tag this if findings are scored as locations or labels rather than masks
      (`medical-imaging-diagnostic`), or if the benchmark's claim is a segmentation method that
      uses medical images as its test domain (`vision/medical-imaging-cv`).
    examples:
      - ref: brats
        qualifies: true
        why: >
          Tumour sub-region masks in brain MRI against expert annotations; the metric is Dice,
          but the structures and the reference standard are clinical.
      - ref: luna16
        qualifies: false
        why: >
          NEAR MISS. Clinical CT with a radiologist reference standard, but nodules are scored as
          points by FROC, not delineated, which is `medical-imaging-diagnostic`.
    not_to_be_confused_with:
      - term: vision/segmentation
        distinction: >
          Kept separate because the clinical structures, the annotation protocol and the
          evaluation metrics are medical rather than general-purpose, not because the operation
          differs.
      - term: vision/medical-imaging-cv
        distinction: >
          Both name segmentation of medical images. Clinically defined structures against
          clinician annotations are this term; vision/medical-imaging-cv takes a benchmark only
          when its claim is the method.
  - id: medicine-health/radiology-report-generation
    label: Radiology report generation
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a radiology report from an imaging study.
    examples:
      - ref: rexrank
        qualifies: true
        why: >
          Free-text reports written from chest X-ray studies and compared with the radiologist's
          report, on a private 10,000-study set and three public test sets.
      - ref: aci-bench
        qualifies: false
        why: >
          NEAR MISS. A clinical document scored against a clinician's reference with the same
          metric families, but the input is a conversation, not an imaging study, which is
          `clinical-dialogue`.
      - ref: chexpert
        qualifies: false
        why: >
          NEAR MISS. Its training labels come from reports, but the output is a probability per
          observation; report text came later in a separate dataset, scored elsewhere.
  - id: medicine-health/ehr-prediction
    label: EHR prediction
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting a clinical outcome from structured electronic health record data.
    examples:
      - ref: ehrshot
        qualifies: true
        why: >
          15 few-shot tasks, each predicting a clinical outcome or finding from a patient's coded,
          structured record up to a prediction time.
      - ref: medhelm
        qualifies: true
        why: >
          As a secondary domain: its EHRSHOT scenario predicts a future event from a coded record.
      - ref: medagentbench
        qualifies: false
        why: >
          NEAR MISS. The tasks read and write structured EHR data, but none predicts a clinical
          outcome; answers are retrieved values, aggregates and orders, which is
          `clinical-agent-workflows`.
      - ref: ddxplus
        qualifies: false
        why: >
          NEAR MISS. The records are synthetic symptom and antecedent lists, not electronic health
          records, and nothing is predicted forward in time.
  - id: medicine-health/clinical-agent-workflows
    label: Clinical agent workflows
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing multi-step clinical tasks against a health information system.
    examples:
      - ref: medagentbench
        qualifies: true
        why: >
          Agents do 300 physician-written clinical tasks (retrieving, recording, ordering) through
          FHIR API calls against a virtual EHR of 100 patients.
      - ref: agentclinic
        qualifies: false
        why: >
          NEAR MISS. The doctor gathers information over many steps, but not against a health
          information system: a test is ordered by a one-line command a language model answers
          from the case file, which is `diagnosis-triage`.
      - ref: medhelm
        qualifies: false
        why: >
          NEAR MISS. Its administrative scenarios (referrals, billing codes, CDI questions) are
          single prompts over a supplied note; no scenario acts against a health information
          system.
  - id: medicine-health/biomedical-literature
    label: Biomedical literature
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Retrieving from, extracting from or synthesising the published biomedical literature.
    examples:
      - ref: pubmedqa
        qualifies: true
        why: >
          Yes/no/maybe answers to what a published study concluded, read from its PubMed abstract
          with the conclusion removed.
      - ref: medhelm
        qualifies: true
        why: >
          As a secondary domain: its PubMedQA and MedHallu scenarios fall in this term.
      - ref: medcalc-bench
        qualifies: false
        why: >
          NEAR MISS. Most patient notes come from PubMed Central case reports, but the literature
          is only the source of the input; the task computes a calculator value from the note,
          which is `clinical-qa`.
  - id: medicine-health/treatment-planning
    label: Treatment planning
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a treatment or care plan for a described patient.
    examples:
      - ref: medhelm
        qualifies: true
        why: >
          As a secondary domain: its MTSamples scenario asks for a treatment plan for a described
          patient.
      - ref: aci-bench
        qualifies: false
        why: >
          NEAR MISS. The note's assessment and plan records the plan the doctor states in the
          conversation; the system documents a plan rather than producing one, which is
          `clinical-dialogue`.
      - ref: medagentbench
        qualifies: false
        why: >
          NEAR MISS. Medication orders follow dosing rules the task supplies, such as potassium
          replacement against a threshold; no care plan is produced or scored.
  - id: medicine-health/medical-safety
    label: Medical safety
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring harmful, unsafe or inappropriate clinical advice.
    examples:
      - ref: healthbench
        qualifies: true
        why: >
          A model's next reply in 5,000 health conversations, graded against physician-written
          rubrics that penalise unsafe or harmful advice, from wrong facts to missed referrals.
      - ref: counselbench
        qualifies: true
        why: >
          As a secondary domain: two of its six rating dimensions and all six adversarial failure
          modes measure unsafe or inappropriate advice.
      - ref: medhelm
        qualifies: false
        why: >
          NEAR MISS. RaceBias asks the model to detect race-based content in answers written by
          others; no scenario measures harmful advice the evaluated model gives, and the suite is
          `clinical-task-suites`.
  - id: medicine-health/mental-health
    label: Mental health
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks concerning psychological assessment or support, scored against
      mental-health-specific criteria.
    examples:
      - ref: counselbench
        qualifies: true
        why: >
          LLM answers to real mental-health help-seeking questions, rated by mental-health
          professionals on six dimensions built from clinical psychology literature.
      - ref: medhelm
        qualifies: false
        why: >
          NEAR MISS. One scenario of 37 (MentalHealth), graded on the suite's general accuracy,
          completeness and clarity axes rather than on mental-health-specific criteria.
  - id: medicine-health/clinical-task-suites
    label: Clinical task suites
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    # ADR-0016: a suite row of the coverage matrix counts suites, not task coverage. The gap
    # ranking reads a cell here as "is there a suite", never as coverage of the field.
    definition: >
      Suites whose scored tasks span several of the medicine-health family's subdomains,
      reported per task or as one aggregate, where the suite's own claim is coverage within
      the family.
    inclusion_test: >
      Tag this as PRIMARY if the tasks span two or more of the medicine-health family's
      subdomains, no one subdomain holds most of them, and the benchmark's own claim is breadth
      within the family. Record the subdomains the tasks fall in as secondary.
    exclusion_test: >
      Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and
      the others secondary), or if the suite spans several families, which is
      `general-intelligence`.
    examples:
      - ref: medhelm
        qualifies: true
        why: >
          35 benchmarks across five clinician-validated categories, from decision support to
          note generation and administration, claiming complete coverage of its taxonomy.
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Rubric criteria span seven themes, from emergency referral to global
          health, but every item is one task, a reply to a health conversation, so it is not a
          suite of tasks.

  # -------------------------------------------------------------- audio-speech
  - id: audio-speech
    label: Audio and speech
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose input or output is an acoustic signal.
    inclusion_test: >
      Tag this as PRIMARY if the score measures what was recovered from, or produced as, audio.
    exclusion_test: >
      Do NOT tag this if the scored relation is between audio and language as two modalities,
      which is `multimodal/audio-language`, and do NOT tag it where the audio is only the
      delivery medium for a text task.
    examples:
      - ref: open-asr-leaderboard
        qualifies: true
        why: >
          Word error rate over raw audio; the signal is what is being handled.
      - ref: dcase-2026
        qualifies: true
        why: >
          Sound event detection, localisation and machine condition monitoring, all scored on
          the acoustic signal.
      - ref: birdclef-plus
        qualifies: true
        why: >
          Species identification from soundscapes, with ecology as a secondary domain.
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Multi-turn clinical dialogue, which reads as speech, but it is conducted in
          text and nothing acoustic is scored.
    seed_target: 18
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: audio-speech/speech-recognition
    label: Speech recognition
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Transcribing spoken audio into text, scored by word or character error against a reference
      transcript.
    examples:
      - ref: open-asr-leaderboard
        qualifies: true
        why: >
          Every track scores transcripts recovered from audio by word error rate against reference
          transcripts, and models are ranked by the average.
      - ref: chime
        qualifies: true
        why: >
          Recognising distant, noisy speech is the series' one continuous line, from read speech
          in noise to conversation transcription scored by word error rate.
      - ref: dns-challenge
        qualifies: false
        why: >
          NEAR MISS. Word accuracy enters the score in 2022 and 2023, but a recogniser run by the
          organisers produces the transcript; the entrant only enhances the audio, which is filed
          under `speaker-tasks`.
      - ref: mmau
        qualifies: false
        why: >
          NEAR MISS. Speech items need the words heard, but no transcript is produced or scored by
          word error rate; the answer is a choice about the clip, which is
          `multimodal/audio-language`.
  - id: audio-speech/speech-synthesis
    label: Speech synthesis
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Generating speech audio from text, scored on intelligibility and naturalness rather than
      on transcript accuracy.
    examples:
      - ref: blizzard-challenge
        qualifies: true
        why: >
          Every team builds a voice from the same data, and every edition scores the speech
          synthesised from text as listeners hear it.
      - ref: iwslt
        qualifies: true
        why: >
          As a secondary domain: its speech-to-speech and voice-cloning tracks score generated
          speech beside the campaign's text translations.
      - ref: dns-challenge
        qualifies: false
        why: >
          NEAR MISS. Speech audio is the output and listeners rate it on MOS scales, as in a TTS
          test, but the term is generating speech from text, and here the input is noisy speech.
      - ref: asvspoof
        qualifies: false
        why: >
          NEAR MISS. Synthesis and conversion systems make the attacks, but they are not ranked;
          what is scored is detection, which is `speaker-tasks`.
  - id: audio-speech/speaker-tasks
    label: Speaker tasks
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Identifying, verifying, diarising or separating speakers from audio.
    examples:
      - ref: voxsrc
        qualifies: true
        why: >
          Every track of every edition scores speaker verification (same speaker or not) or
          speaker diarisation (who spoke when) on in-the-wild speech.
      - ref: dihard
        qualifies: true
        why: >
          Every track scores speaker diarization, labelling who spoke when in hard multi-domain
          conversational recordings; nothing is transcribed.
      - ref: zerospeech
        qualifies: false
        why: >
          NEAR MISS. Speaker invariance is tested with across-speaker ABX, but the scored quantity
          is linguistic contrast, not speaker identity.
      - ref: blizzard-challenge
        qualifies: false
        why: >
          NEAR MISS. Speaker similarity is rated on generated speech, but no system identifies,
          verifies or separates speakers, which leaves it `speech-synthesis`.
  - id: audio-speech/speech-translation
    label: Speech translation
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing text or speech in a target language from speech in a source language.
    examples:
      - ref: iwslt
        qualifies: true
        why: >
          Every shared task takes speech as input and the campaign's purpose is translating it;
          the longest-running track scores text translations of recorded speech.
      - ref: wmt-general-mt
        qualifies: false
        why: >
          NEAR MISS. Spoken input is one domain, but it arrives with a transcript and the task is
          text in, text out, which is `language/translation`.
  - id: audio-speech/music-generation
    label: Music generation
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Generating musical audio or symbolic music.
    examples:
      - ref: musiccaps
        qualifies: true
        why: >
          Music generated from musician-written captions, with audio quality (FAD) scored on the
          generated audio alone.
      - ref: mirex
        qualifies: true
        why: >
          As a secondary domain: since 2024 its symbolic and audio music generation tasks score
          generated music, beside the recognition tasks that make up most editions.
      - ref: blizzard-challenge
        qualifies: false
        why: >
          NEAR MISS. Generated audio judged by listeners, but it is speech synthesised from text,
          not musical audio or symbolic music, which is `speech-synthesis`.
  - id: audio-speech/music-understanding
    label: Music understanding
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recognising musical attributes such as key, genre, structure or notes from audio.
    examples:
      - ref: mirex
        qualifies: true
        why: >
          Most tasks in every edition take a music recording and score the attributes recovered
          from it: chords, beats, keys, structure, instruments.
      - ref: hear
        qualifies: true
        why: >
          Music tasks (pitch, genre, percussion strokes, tonic, transcription) are the largest
          group of its nineteen, all scored through one frozen embedding.
      - ref: musiccaps
        qualifies: false
        why: >
          NEAR MISS. The captions and aspect lists describe musical attributes, but the protocol
          generates music from them rather than recognising attributes in audio, which is
          `music-generation`.
  - id: audio-speech/audio-event-understanding
    label: Audio event understanding
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recognising which sound events are present in a recording.
    examples:
      - ref: audioset
        qualifies: true
        why: >
          The headline task asks which of 527 sound classes are present in a 10-second clip, with
          no timing, scored by mAP.
      - ref: dcase
        qualifies: true
        why: >
          Classifying sounds is the challenge's continuous line: acoustic scene classification was
          Task 1 from 2013 to 2025, and 2026's audio classification tasks score which class a
          recording holds.
      - ref: birdset
        qualifies: false
        why: >
          NEAR MISS. It presents itself as general audio classification and compares itself with
          AudioSet, but its labels are bird species in field recordings, which is `bioacoustics`.
      - ref: l3das
        qualifies: false
        why: >
          NEAR MISS. Task 2's score depends on frame timing and position, which goes to
          `audio-event-detection-localization`.
    not_to_be_confused_with:
      - term: audio-speech/audio-event-detection-localization
        distinction: >
          If the score depends on temporal boundaries or spatial direction, it is detection and
          localisation.
  - id: audio-speech/audio-event-detection-localization
    label: Audio event detection localization
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Determining when sound events occur and where they came from, not merely whether they are
      present.
    examples:
      - ref: l3das
        qualifies: true
        why: >
          Task 2 scores when each sound is active, per 100-ms frame, and where it is, within a
          fixed distance, not merely which sounds are present.
      - ref: audioset
        qualifies: true
        why: >
          As a secondary domain: the May 2021 strong labels mark each event's start and end and
          score 960 ms frames.
      - ref: birdset
        qualifies: false
        why: >
          NEAR MISS. The test split carries each vocalisation's start and end, but the benchmark
          scores fixed 5-second segments with no onset or boundary in the score, which leaves it
          `bioacoustics`.
    not_to_be_confused_with:
      - term: audio-speech/audio-event-understanding
        distinction: >
          Understanding asks which events are present; detection and localisation ask when they
          happened and from which direction. A system can name every event correctly and score
          near zero on onset timing.
  - id: audio-speech/machine-condition-monitoring
    label: Machine condition monitoring
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Detecting machine faults or anomalies from operating sound.
    examples:
      - ref: dcase
        qualifies: true
        why: >
          As a secondary domain: anomalous sound detection for machine condition monitoring has
          been one of its tasks since 2020, scoring normal against anomalous machine sound.
      - ref: physionet-challenge
        qualifies: false
        why: >
          NEAR MISS. Some editions detect abnormality from heart-sound recordings (2016) and
          murmurs (2022), but the subject is a patient, not a machine's operating sound, which is
          `medicine-health/diagnosis-triage`.
  - id: audio-speech/bioacoustics
    label: Bioacoustics
    parent: audio-speech
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Identifying species or animal vocalisations in field recordings.
    examples:
      - ref: beans
        qualifies: true
        why: >
          Every official dataset scores identifying species, individuals or call types from
          recordings of animal sound.
      - ref: birdset
        qualifies: true
        why: >
          Bird species identified in 5-second field-recorded soundscape segments, after training
          on focal recordings.
      - ref: hear
        qualifies: false
        why: >
          NEAR MISS. Beehive States classifies a hive as queen-less or normal from its sound, but
          that is a colony state, not a species or a vocalisation, and it is one task of nineteen.

  # -------------------------------------------------------------- earth-climate
  - id: earth-climate
    label: Earth and climate
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is the Earth system or a process within it.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is weather, climate, land surface, hazard,
      ecology or energy in a geophysical setting.
    exclusion_test: >
      Do NOT tag this if the subject is a generic vision task that happens to use satellite
      imagery, and do NOT tag it where the physical process is studied outside an Earth-system
      context, which is `physics`. A vision task is generic when the benchmark's claim is the
      vision method and its labels are objects that merely appear in overhead imagery
      (buildings, vehicles, animals). Where the labels are Earth-system quantities (land cover,
      surface water, crops, biomass, ice), or the benchmark presents itself as Earth
      observation, this family is primary and the vision task subdomain is secondary, however
      standard the vision task.
    examples:
      - ref: weatherbench-2
        qualifies: true
        why: >
          Forecast skill against operational analysis; the subject is the atmosphere.
      - ref: geo-bench-2
        qualifies: true
        why: >
          Geospatial tasks over held-out regions and sensors.
      - ref: smart-buildings-challenge
        qualifies: true
        why: >
          Building energy optimisation as a real-world control task.
      - ref: open-catalyst
        qualifies: false
        why: >
          NEAR MISS. Energy-relevant and physically grounded, but the subject is catalyst
          chemistry rather than an Earth-system process.
    seed_target: 18
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: earth-climate/weather-forecasting
    label: Weather forecasting
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting atmospheric state at a stated lead time, scored against observed weather.
    inclusion_test: >
      Tag this as PRIMARY if forecasts of the atmosphere, or of the coupled Earth system, are
      issued from initial conditions at stated lead times up to the subseasonal-to-seasonal
      range and scored against observations or reanalysis. Record the lead-time range in the
      entry, not in the domain.
    exclusion_test: >
      Do NOT tag this if the horizon is multi-year or longer under stated emissions or forcing
      scenarios (`climate-projection`), or if weather variables are only predictors for another
      target, such as crop yield (`agriculture`).
    examples:
      - ref: weatherbench-2
        qualifies: true
        why: >
          Medium-range global forecasts scored against operational analysis.
      - ref: chaosbench
        qualifies: true
        why: >
          Forecasts at 1 to 44 days, the subseasonal-to-seasonal range, including ocean, sea-ice
          and land targets, with no forcing scenarios.
      - ref: cy-bench
        qualifies: false
        why: >
          NEAR MISS. Weather series are among its predictors and it forecasts ahead of harvest,
          but the scored target is crop yield, which is `agriculture`.
    not_to_be_confused_with:
      - term: earth-climate/climate-projection
        distinction: >
          Initial conditions and a lead time make a forecast; forcing scenarios over long
          horizons make a projection. Subseasonal-to-seasonal prediction has no scenarios, so it
          is forecasting.
  - id: earth-climate/climate-projection
    label: Climate projection
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Projecting climate variables over long horizons under stated emissions or forcing
      scenarios.
    examples:
      - ref: climatebench
        qualifies: true
        why: >
          Emulate a full Earth System Model's 2080-2100 climate under an unseen emissions
          scenario, scored by normalised RMSE.
      - ref: chaosbench
        qualifies: false
        why: >
          NEAR MISS. The paper places S2S between weather and climate, but nothing is projected
          under emissions or forcing scenarios over long horizons; every forecast runs from an
          initial condition to at most 44 days ahead, which is `weather-forecasting`.
      - ref: digital-typhoon
        qualifies: false
        why: >
          NEAR MISS. Climate change is one of its proposed task areas, through reanalysis of a
          homogeneous record, but nothing is projected under emissions or forcing scenarios.
  - id: earth-climate/remote-sensing
    label: Remote sensing
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Extracting land, ocean or atmospheric information from satellite or airborne imagery.
    inclusion_test: >
      Tag this as PRIMARY if a model extracts information from satellite or airborne imagery
      and either the labels are Earth-system quantities (land cover, surface water, crops,
      biomass, ice) or the benchmark presents itself as Earth observation; record the vision
      task (segmentation, classification, detection) as secondary. Mapping a hazard already
      visible in the image, such as flood extent, is this term, not `hazard-prediction`.
    exclusion_test: >
      Do NOT tag this if the imagery is only a predictor for another Earth-system target, such
      as crop yield (`agriculture`), if the task forecasts an event before it happens
      (`hazard-prediction`), or if the benchmark's claim is a vision method and its labels are
      generic objects seen from above (`vision`).
    examples:
      - ref: geo-bench
        qualifies: true
        why: >
          Geospatial foundation models on 19 Earth-observation datasets. Some labels are generic
          objects (buildings, cattle), but the benchmark presents itself as Earth observation,
          and the vision tasks go to secondary.
      - ref: sen1floods11
        qualifies: true
        why: >
          Surface water segmented in Sentinel-1 SAR chips; the operation is generic
          segmentation, but the label is a land-surface state.
      - ref: cy-bench
        qualifies: false
        why: >
          NEAR MISS. Remote-sensing predictors feed it, but the scored target is crop yield,
          which is `agriculture`.
    not_to_be_confused_with:
      - term: vision/segmentation
        distinction: >
          Per-pixel labels of an Earth-system quantity on overhead imagery are this term, with
          segmentation secondary, although the operation and the metric are generic.
  - id: earth-climate/geospatial-reasoning
    label: Geospatial reasoning
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions that require reasoning over geographic location and spatial
      relationships.
    examples:
      - ref: mapeval
        qualifies: true
        why: >
          Multiple-choice map questions on places and the spatial relations between them
          (direction, distance, proximity, routes, multi-stop trips), from map data given as text,
          API tools or snapshots.
      - ref: geobenchx
        qualifies: true
        why: >
          As a secondary domain: every GIS task asks for reasoning over geographic location and
          spatial relationships, though tool-call correctness, not the answer, is what is scored.
      - ref: geobench-vlm
        qualifies: false
        why: >
          NEAR MISS. No task asks where an image was taken or relates places to one another; the
          spatial relations asked are between two boxed objects within one image, which leaves it
          in `remote-sensing`.
  - id: earth-climate/hazard-prediction
    label: Hazard prediction
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting natural hazards such as floods, wildfires, landslides or earthquakes.
    examples:
      - ref: wildfirespreadts
        qualifies: true
        why: >
          Where an active wildfire will be burning the next day, predicted before it is observed
          for 607 US fires and scored by average precision over held-out years.
      - ref: sen1floods11
        qualifies: false
        why: >
          NEAR MISS. Floods are a hazard, but the flood extent is mapped from an image taken
          during the event, not forecast before it, which is `remote-sensing`.
      - ref: digital-typhoon
        qualifies: false
        why: >
          NEAR MISS. Tropical cyclones are a hazard, but every benchmarked target is a property of
          a cyclone already in the image; the tasks that would predict a hazard are proposed, not
          benchmarked.
  - id: earth-climate/ecology-biodiversity
    label: Ecology biodiversity
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Identifying species, or measuring or predicting their distribution and abundance, or the
      condition of an ecosystem.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is biodiversity or ecosystem monitoring,
      whatever modality its tasks use (images, sound, text); record the method subdomains
      (`vision/classification`, `audio-speech/bioacoustics`, `language/information-extraction`)
      as secondary.
    exclusion_test: >
      Do NOT tag this as primary if the benchmark is one method task whose claim is that method,
      such as species calls in soundscapes scored as an audio task (`audio-speech/bioacoustics`,
      with this term secondary), or if the target is agricultural output (`agriculture`).
    examples:
      - ref: lifeclef
        qualifies: true
        why: >
          Five biodiversity challenges across images, soundscapes and web text under one claim,
          biodiversity informatics; each task scores identification.
      - ref: cy-bench
        qualifies: false
        why: >
          NEAR MISS. Land and crop monitoring over many regions, but the target is crop yield,
          which is `agriculture`.
    not_to_be_confused_with:
      - term: audio-speech/bioacoustics
        distinction: >
          A single species-call task scored as audio is bioacoustics, with this term secondary; a
          multi-modality suite whose claim is biodiversity is this term, with bioacoustics
          secondary.
  - id: earth-climate/agriculture
    label: Agriculture
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting agricultural outcomes such as crop yield, disease incidence or soil condition.
    examples:
      - ref: cy-bench
        qualifies: true
        why: >
          Pre-harvest maize and wheat yield forecasts for subnational regions of over 25
          countries; the scored quantity is a region's end-of-season crop yield.
      - ref: cropharvest
        qualifies: true
        why: >
          As a secondary domain: its labels are crop types and cropland and it frames itself as a
          dataset for agriculture, but the label is read off the satellite signal, so
          `remote-sensing` is primary.
      - ref: geo-bench
        qualifies: false
        why: >
          NEAR MISS. Crop types and field boundaries are labels read off the imagery, which
          `remote-sensing` covers; no task predicts an agricultural outcome such as yield.
  - id: earth-climate/energy-systems
    label: Energy systems
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Forecasting or optimising energy generation, demand or grid operation.
    examples:
      - ref: buildingsbench
        qualifies: true
        why: >
          Day-ahead building load forecasts, pretrained on simulated buildings and scored on 1,900
          real ones; the scored quantity is energy demand, forecast for power-system operation.
      - ref: l2rpn
        qualifies: true
        why: >
          Agents operate a simulated power transmission grid through weekly Grid2Op scenarios,
          which is the term's grid operation.
      - ref: opendac
        qualifies: false
        why: >
          NEAR MISS. Direct air capture is the motivation, but nothing scored is an energy
          system's generation, demand or operation; the scored quantity is a property of a MOF
          with adsorbates, which is `chemistry-materials/force-fields-potentials`.

  # -------------------------------------------------------------- physics
  - id: physics
    label: Physics
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a physical system or a physical reasoning competence.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is a physical observable, a simulation of a
      physical process, or research-level physics reasoning.
    exclusion_test: >
      Do NOT tag this if the system is a molecule, crystal, catalyst or material, which is
      `chemistry-materials` even when the method is physics -- the archive kept
      `physics/materials-science` and `chemistry/crystal-structure-prediction` competing for the
      same entries, and Matbench Discovery, Open Catalyst and OMol25 were classifiable both ways
      until materials moved to one home named for both communities.
    examples:
      - ref: critpt
        qualifies: true
        why: >
          71 research-level physics challenges written by active researchers.
      - ref: fair-universe-higgsml-uncertainty
        qualifies: true
        why: >
          Particle-physics signal strength under systematic nuisance parameters.
      - ref: matbench-discovery
        qualifies: false
        why: >
          NEAR MISS. DFT-grounded and thoroughly physical in method, but the subject is crystal
          stability, so it is `chemistry-materials`.
    seed_target: 18
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: physics/simulation-surrogates
    label: Simulation surrogates
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Learned models that stand in for an expensive physical simulation, scored against the
      simulator they replace.
    examples:
      - ref: pdebench
        qualifies: true
        why: >
          Learned forward and inverse solvers for 11 PDEs, several of them fluid flows, scored
          against the numerical solvers that produced the data.
      - ref: the-well
        qualifies: true
        why: >
          Every one of its 16 simulated physical systems scores a learned model against the solver
          it would replace.
      - ref: chaosbench
        qualifies: false
        why: >
          NEAR MISS. Its data-driven entrants emulate numerical weather prediction, but they are
          scored against reanalysis, not against the simulators they would replace; the agencies'
          simulations are baselines, and it is `earth-climate/weather-forecasting`.
      - ref: md17
        qualifies: false
        why: >
          NEAR MISS. The learned model stands in for ab initio molecular dynamics, but the system
          is a molecule, which the physics family's exclusion sends to
          `chemistry-materials/force-fields-potentials`.
    not_to_be_confused_with:
      - term: physics/fluid-dynamics
        distinction: >
          This term names a method; fluid-dynamics names a subject. A surrogate benchmark whose
          claim spans several physical systems is this term, with the subject subdomains
          secondary; a benchmark with one physical system as its subject takes that subject's
          subdomain, whatever the method.
  - id: physics/fluid-dynamics
    label: Fluid dynamics
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting fluid flow fields or quantities derived from them.
    examples:
      - ref: airfrans
        qualifies: true
        why: >
          Learned surrogates of subsonic turbulent flow around a 2D airfoil, scored on the
          predicted flow fields and on the drag and lift derived from them.
      - ref: the-well
        qualifies: true
        why: >
          As a secondary domain: most of its 16 simulated systems are fluid, magnetohydrodynamic
          or astrophysical-fluid flows, though the surrogate method makes `simulation-surrogates`
          primary.
      - ref: weatherbench-2
        qualifies: false
        why: >
          NEAR MISS. The atmosphere it forecasts is a fluid, but the scored quantity is weather in
          an Earth-system context, and the earth-climate family sends only a physical process
          studied outside that context to physics; it is `earth-climate/weather-forecasting`.
    not_to_be_confused_with:
      - term: physics/simulation-surrogates
        distinction: >
          Fluid flow as the one subject is this term, whatever the method. A surrogate benchmark
          spanning several physical systems, most of them fluids, is simulation-surrogates, with
          this term secondary.
  - id: physics/particle-physics
    label: Particle physics
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Analysing particle-collision or detector data to recover physics quantities.
    examples:
      - ref: fair-universe-higgsml
        qualifies: true
        why: >
          The Higgs signal strength, with a confidence interval under systematic uncertainties, is
          recovered from simulated LHC collision events in an ATLAS-like detector.
      - ref: trackml
        qualifies: true
        why: >
          Detector hits from simulated LHC collision events are grouped into the tracks of the
          particles that left them.
      - ref: plasticc
        qualifies: false
        why: >
          NEAR MISS. A classification challenge on simulated data, like the collider ones, but the
          input is telescope photometry, not particle-collision or detector data, and the scored
          quantity is a source's astronomical class, which is `astrophysics-cosmology`.
  - id: physics/astrophysics-cosmology
    label: Astrophysics cosmology
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring astronomical or cosmological quantities from observational data.
    examples:
      - ref: plasticc
        qualifies: true
        why: >
          Each source's astronomical class is inferred from its photometric time series and
          host-galaxy metadata, simulated to mimic LSST observations.
      - ref: strong-lens-finding-challenge
        qualifies: true
        why: >
          Whether a galaxy-scale strong gravitational lens is present is inferred from imaging
          built to mimic Euclid and KiDS observations.
      - ref: the-well
        qualifies: false
        why: >
          NEAR MISS. Some of its simulated systems are astrophysical, from extra-galactic fluids
          to supernova explosions, but a learned surrogate is scored against its solver and no
          astronomical quantity is inferred from observational data, which is
          `simulation-surrogates`.
  - id: physics/condensed-matter
    label: Condensed matter
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting properties of condensed-matter systems such as electronic structure or phase
      behaviour.
    examples:
      - ref: cmt-benchmark
        qualifies: true
        why: >
          Expert-written problems on lattice models of interacting electrons and spins, asking for
          ground-state energies, order parameters, Fermi-surface topology or phase behaviour.
      - ref: varbench
        qualifies: true
        why: >
          As a secondary domain: its Hamiltonians are lattice models of strongly correlated
          electrons and magnets from solid-state physics, though simulating them makes
          `quantum-systems` primary.
      - ref: jarvis-leaderboard
        qualifies: false
        why: >
          NEAR MISS. Band structures, superconducting transition temperatures and dielectric
          functions are condensed-matter properties, but every task is a named material, which the
          physics family's exclusion sends to `chemistry-materials` whatever the method.
      - ref: matbench-discovery
        qualifies: false
        why: >
          NEAR MISS. The physics family's exclusion sends a molecule, crystal, catalyst or
          material to `chemistry-materials` even when the method is physics, and it names Matbench
          Discovery among the cases that forced the rule.
  - id: physics/quantum-systems
    label: Quantum systems
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Simulating, characterising or controlling quantum systems and quantum circuits.
    examples:
      - ref: qcircuitbench
        qualifies: true
        why: >
          Models write OpenQASM circuits for 25 quantum algorithms, scored on the outcome
          statistics or state fidelity of the circuit run on a simulator.
      - ref: varbench
        qualifies: true
        why: >
          Classical and quantum variational methods approximate the ground states of quantum
          many-body Hamiltonians, scored on their energy and variance by the V-score.
      - ref: cmt-benchmark
        qualifies: false
        why: >
          NEAR MISS. Most problems concern quantum many-body methods, but the model simulates no
          quantum system: it answers in text, which is `condensed-matter`.
      - ref: jarvis-leaderboard
        qualifies: false
        why: >
          NEAR MISS. Its QC category runs variational quantum eigensolvers on circuits, but the
          scored quantity is the band structure of aluminium, a material's property, in one task
          of 365.
  - id: physics/optics-photonics
    label: Optics photonics
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Designing optical and photonic systems or predicting their behaviour.
    examples: []
  - id: physics/symbolic-regression-discovery
    label: Symbolic regression discovery
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering a governing symbolic expression or physical law from observed data.
    examples:
      - ref: srbench
        qualifies: true
        why: >
          Its ground-truth track asks methods to recover the governing equations of known physical
          systems and laws from data.
      - ref: asymob
        qualifies: false
        why: >
          NEAR MISS. The answer is an expression checked for symbolic equivalence, but it comes
          from transforming a given expression (integrating, taking a limit), not from recovering
          a law from observed data, which is `mathematics/symbolic-manipulation`.
  - id: physics/plasma-fusion
    label: Plasma fusion
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting or controlling plasma behaviour in fusion devices.
    examples:
      - ref: fusion-equilibrium-challenge
        qualifies: true
        why: >
          The magnetic equilibrium of a tokamak plasma is reconstructed without magnetic sensors
          from DIII-D diagnostics, then transferred zero-shot to MAST.
      - ref: the-well
        qualifies: false
        why: >
          NEAR MISS. Several of its systems are magnetohydrodynamic simulations, but of
          extra-galactic fluids and supernova explosions rather than plasma in a fusion device,
          and a surrogate is scored against its solver, which is `simulation-surrogates`.
  - id: physics/physics-reasoning
    label: Physics reasoning
    parent: physics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving physics problems posed in text, scored on the physics answer rather than on a
      simulation.
    examples:
      - ref: critpt
        qualifies: true
        why: >
          Unpublished research-level physics challenges posed in text, graded on machine-checkable
          answers with no simulation in the loop, across most of modern physics.
      - ref: cmt-benchmark
        qualifies: true
        why: >
          As a secondary domain: its condensed-matter theory problems are posed in text and scored
          on the answer, with no simulation in the loop.
      - ref: qcircuitbench
        qualifies: false
        why: >
          NEAR MISS. The problems are posed in text, but the answer is a program scored by
          simulating it, not a physics answer scored directly, which is `quantum-systems`.
      - ref: mamo
        qualifies: false
        why: >
          NEAR MISS. Some ODE scenarios are physical (mixing tanks, motion), but most are
          business, daily-life or environmental, and the score is whether the situation was
          formulated correctly, which is `mathematics/applied-modeling`.
    not_to_be_confused_with:
      - term: mathematics/applied-modeling
        distinction: >
          Physics reasoning is scored on the physics answer and assumes the physical setup is
          given. Applied modelling is scored on whether the situation was formulated correctly
          in the first place.

  # -------------------------------------------------------------- safety-alignment
  - id: safety-alignment
    label: Safety and alignment
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is whether a system behaves acceptably, or whether it has
      capabilities that would make it hazardous.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is refusal, robustness to attack, honesty,
      bias, or a frontier-risk property. Hazardous knowledge or skill that the benchmark claims
      to measure as a risk is a frontier-risk property, even when it is scored as accuracy.
    exclusion_test: >
      Do NOT tag this if harmful content appears but the benchmark claims to measure neither
      conduct nor a hazardous capability, and do NOT tag it where the failure measured is
      ordinary inaccuracy.
    examples:
      - ref: helm-safety
        qualifies: true
        why: >
          Harmless completion scored across a defined harm taxonomy.
      - ref: jailbreakbench
        qualifies: true
        why: >
          Attack success rate, with a denominator that moves as new attacks are published.
      - ref: wmdp
        qualifies: true
        why: >
          Scores only multiple-choice accuracy, but on hazardous biosecurity, cybersecurity and
          chemical knowledge that it measures as a risk, which is a frontier-risk property.
      - ref: humanity-s-last-exam
        qualifies: false
        why: >
          NEAR MISS. Includes hazardous subject matter, but its claim is breadth of academic
          knowledge, scored as correct answers, and no hazard is what it sets out to measure.
    seed_target: 18
    core: false
    coverage_status: surveyed
    curation_posture: mixed
    reviewer_signoff: none
  - id: safety-alignment/harmlessness-refusal
    label: Harmlessness refusal
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system refuses what it should refuse and complies with what it should
      not refuse.
    examples:
      - ref: ailuminate
        qualifies: true
        why: >
          Scores whether a chat system's responses to prompts in 12 hazard categories violate a
          hazard standard, refusal or safe completion under ordinary prompting.
      - ref: helm-safety
        qualifies: true
        why: >
          Four of its five columns rate whether a response refuses an unsafe request, and XSTest
          also rewards answering its safe prompts, the other half of the term.
      - ref: jailbreakbench
        qualifies: false
        why: >
          NEAR MISS. Its 100 benign behaviours measure refusal of requests that should be
          answered, but only as a sanity check on new models and defences; the leaderboard scores
          attack success, which is `jailbreak-robustness`.
      - ref: wmdp
        qualifies: false
        why: >
          NEAR MISS. Nothing about refusal is scored: the score is accuracy on hazardous-knowledge
          questions, read from the top logit, so a refusal never enters it; it is
          `dangerous-capability-evals`.
  - id: safety-alignment/agentic-harm
    label: Agentic harm
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether an agent completes harmful tasks, scored on task completion rather than
      on output toxicity.
    examples:
      - ref: agentharm
        qualifies: true
        why: >
          The headline harm score is the share of a harmful multi-step task an agent completed
          with synthetic tools, not the toxicity of its text.
      - ref: agentdojo
        qualifies: false
        why: >
          NEAR MISS. The user's tasks are benign; the harmful action is the attacker's goal,
          injected through tool outputs, which is `prompt-injection`.
      - ref: replibench
        qualifies: false
        why: >
          NEAR MISS. Agents complete the tasks, but the paper measures whether the model can do
          them, not whether it complies with a harmful request, and reworks prompts to remove
          refusals; it is `dangerous-capability-evals`.
  - id: safety-alignment/honesty-truthfulness
    label: Honesty truthfulness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system asserts things it does not internally hold to be true.
    examples:
      - ref: mask
        qualifies: true
        why: >
          Elicits a model's belief, then scores whether its statement under a pressure prompt
          contradicts that belief, with accuracy reported apart from honesty.
      - ref: sycophancy-eval
        qualifies: false
        why: >
          NEAR MISS. Some items involve assertions the assistant can be shown not to hold, but the
          manipulated variable is the user's stated view, scored as a change against a no-view
          baseline, which is `sycophancy`.
      - ref: apollo-research-scheming-suite
        qualifies: false
        why: >
          NEAR MISS. Its follow-up questions score whether the model lies about its own action,
          which is `deception-scheming`; no item scores the truth of assertions about the world.
  - id: safety-alignment/sycophancy
    label: Sycophancy
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system revises a correct answer to agree with a user who pushes back.
    examples:
      - ref: sycophancy-eval
        qualifies: true
        why: >
          Its are-you-sure dataset scores an assistant revising a correct answer after the user
          pushes back; the other three score the same caving under other pressure from the user's
          stated view.
      - ref: mask
        qualifies: false
        why: >
          NEAR MISS. The pressure comes from a role or an incentive set before the question, not
          from a user disagreeing, and doubling down asks the model to confirm its own earlier
          falsehood; it is `honesty-truthfulness`.
  - id: safety-alignment/jailbreak-robustness
    label: Jailbreak robustness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring resistance to adversarial prompts constructed to bypass safety training.
    examples:
      - ref: harmbench
        qualifies: true
        why: >
          510 harmful behaviours for scoring automated red-teaming; the scored event is an attack
          eliciting a behaviour from a model that should refuse it.
      - ref: jailbreakbench
        qualifies: true
        why: >
          Ranks jailbreak attacks and defences by attack success on 100 misuse behaviours: an
          adversarial prompt getting a safety-trained model to produce what it should refuse.
      - ref: ailuminate
        qualifies: false
        why: >
          NEAR MISS. Some prompts use misleading contexts, but no adaptive attacker is modelled
          and no attack success is scored, which is `harmlessness-refusal`; MLCommons runs
          jailbreak robustness as a separate benchmark.
      - ref: helm-safety
        qualifies: false
        why: >
          NEAR MISS. It includes HarmBench's behaviours, but sends them through a direct-request
          template with no attack, so refusal is scored without an attacker; it is
          `harmlessness-refusal`.
  - id: safety-alignment/prompt-injection
    label: Prompt injection
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring resistance to instructions embedded in untrusted content the system is asked to
      process.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark scores whether a system follows instructions planted
      in content it processes (tool outputs, documents, web pages) and its own claim is
      security, even when a benign utility score is reported beside the attack score on the
      same tasks.
    exclusion_test: >
      Do NOT tag this if the harmful instruction comes from the user rather than from processed
      content (`jailbreak-robustness`, `agentic-harm`), or if injection is a minor axis of a
      benchmark whose claim is tool use, which takes its `agents-tooluse` subdomain.
    examples:
      - ref: agentdojo
        qualifies: true
        why: >
          Utility on 97 tool-use tasks and attack success on 629 injection cases, under a title
          and framework that make security the claim; `tool-api-calling` is secondary.
      - ref: agentharm
        qualifies: false
        why: >
          NEAR MISS. Tool-using agents facing jailbreak prompts, but the harmful request comes
          from the user, which is `agentic-harm`.
    not_to_be_confused_with:
      - term: agents-tooluse/tool-api-calling
        distinction: >
          When a benchmark reports utility and attack success side by side on the same tool-use
          tasks, its own claim decides: security as the claim is this term, with tool-api-calling
          secondary; tool use as the claim is tool-api-calling, with this term secondary.
  - id: safety-alignment/bias-fairness
    label: Bias fairness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring systematic differences in behaviour across demographic or social groups.
    examples:
      - ref: bbq
        qualifies: true
        why: >
          Hand-built questions on nine US social-bias categories, with a bias score for how far a
          system's answers follow the targeted stereotype beside accuracy.
      - ref: helm-safety
        qualifies: true
        why: >
          As a secondary domain: BBQ's social-bias column is one of its five; the other four rate
          refusal of unsafe requests.
      - ref: sycophancy-eval
        qualifies: false
        why: >
          NEAR MISS. The paper calls tailored feedback biased, but the bias is toward the user's
          stated preference, not a difference in behaviour across demographic or social groups; it
          is `sycophancy`.
      - ref: ethics
        qualifies: false
        why: >
          NEAR MISS. The Justice task's impartiality half relates to fairness, but no score
          compares a system's behaviour across groups; it scores whether a stated reason for
          unequal treatment is reasonable, which is `value-alignment`.
  - id: safety-alignment/privacy-memorization
    label: Privacy memorization
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system reproduces private or memorised training data.
    examples:
      - ref: copybench
        qualifies: true
        why: >
          Scores how often a model reproduces text from books it was presumably trained on,
          verbatim or as plot and characters; the term's memorised half applies, not its private
          half.
      - ref: tofu
        qualifies: true
        why: >
          As a secondary domain: the setting is the right to be forgotten, with fictitious authors
          standing in for private individuals and low forget quality read as privacy leakage.
      - ref: ailuminate
        qualifies: false
        why: >
          NEAR MISS. Privacy is one of its 12 hazard categories, but it is scored as harmful
          content in a response to a prompt, not as reproduction of memorised training data; it is
          `harmlessness-refusal`.
  - id: safety-alignment/unlearning-knowledge-removal
    label: Unlearning knowledge removal
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether targeted knowledge has actually been removed, a setting in which a lower
      score is the safer one.
    examples:
      - ref: tofu
        qualifies: true
        why: >
          Ranks removal methods on whether a share of 200 fictitious author profiles, fine-tuned
          into a model, is forgotten, scored by forget quality beside model utility.
      - ref: wmdp
        qualifies: true
        why: >
          As a secondary domain: the paper also makes its hazardous-knowledge questions an
          unlearning target, but it has no leaderboard of removal methods and reports released
          models, so removal is not primary.
      - ref: copybench
        qualifies: false
        why: >
          NEAR MISS. Mitigations are ranked, but they are decoding methods, prompts and
          instruction tuning applied to fixed models with no forget set, not removal of targeted
          knowledge; it is `privacy-memorization`.
      - ref: saebench
        qualifies: false
        why: >
          NEAR MISS. Only one of its eight metrics removes knowledge (WMDP-bio), and it scores the
          sparse autoencoder as the removal tool; that is one subset's primary, and the benchmark
          is `interpretability-probes`.
    not_to_be_confused_with:
      - term: safety-alignment/dangerous-capability-evals
        distinction: >
          One question set can serve both roles, with opposite score directions. It takes this
          term as primary only when its leaderboard ranks removal methods; when it ranks models
          as released, dangerous-capability-evals is primary and this term secondary.
  - id: safety-alignment/dangerous-capability-evals
    label: Dangerous capability evaluations
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system possesses capabilities that would be dangerous in the wrong
      hands.
    examples:
      - ref: replibench
        qualifies: true
        why: >
          Withheld agentic task families measure whether a model can perform the components of
          autonomous replication, as an early warning; refusals are worked around, so the score is
          capability.
      - ref: wmdp
        qualifies: true
        why: >
          3,668 multiple-choice questions on hazardous bio, cyber and chemical knowledge, measured
          as a risk in released models.
      - ref: hle
        qualifies: false
        why: >
          NEAR MISS. The family's own near miss: hazardous subject matter can appear, but nothing
          about refusal or hazard is measured; it is
          `general-intelligence/multi-subject-knowledge-exams`.
      - ref: agentharm
        qualifies: false
        why: >
          NEAR MISS. The tasks run on synthetic tools and are kept easy, and the paper says they
          are not capabilities of concern, so the score is conduct, which is `agentic-harm`.
    not_to_be_confused_with:
      - term: safety-alignment/unlearning-knowledge-removal
        distinction: >
          A hazardous-knowledge set that doubles as an unlearning target is this term when it
          ranks models as released, with unlearning secondary. The primary tells a reader which
          direction of the score is the safer one.
  - id: safety-alignment/deception-scheming
    label: Deception scheming
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system pursues concealed goals or misleads its operator about its own
      behaviour.
    examples:
      - ref: apollo-research-scheming-suite
        qualifies: true
        why: >
          Agentic tests of whether a model covertly pursues an in-context goal against its
          developers or users, with follow-up questions on whether it then misleads them about its
          actions.
      - ref: controlarena
        qualifies: false
        why: >
          NEAR MISS. The red team instructs the untrusted model to pursue the side task, so the
          score measures the protocol against a worst-case attacker, not the model's propensity to
          conceal a goal; it is `control-oversight`.
      - ref: situational-awareness-dataset
        qualifies: false
        why: >
          NEAR MISS. Motivated by deceptive alignment, but no task scores pursuing a concealed
          goal or misleading the operator; it measures a prerequisite capability, which is
          `evaluation-awareness`.
    not_to_be_confused_with:
      - term: safety-alignment/honesty-truthfulness
        distinction: >
          Truthfulness measures whether assertions are true. Deception measures whether the
          system is pursuing a concealed goal. A system can state only true things deceptively,
          and can be sincerely wrong without any deception at all.
  - id: safety-alignment/evaluation-awareness
    label: Evaluation awareness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system detects that it is being evaluated and behaves differently
      because of it.
    examples:
      - ref: situational-awareness-dataset
        qualifies: true
        why: >
          Its STAGES tasks, STAGES-OVERSIGHT in particular, score whether a model can tell
          evaluation from deployment, the detection the term names.
      - ref: apollo-research-scheming-suite
        qualifies: true
        why: >
          As a secondary domain: Instrumental Alignment Faking scores behaviour that changes with
          whether the model believes it is being tested or deployed.
      - ref: replibench
        qualifies: false
        why: >
          NEAR MISS. Models noticing simulated environments is reported as a behaviour that
          confounds the capability scores, not scored; it is `dangerous-capability-evals`.
    not_to_be_confused_with:
      - term: safety-alignment/sandbagging
        distinction: >
          If the benchmark scores a capability gap between observed and unobserved conditions
          rather than detection itself, it is sandbagging.
  - id: safety-alignment/control-oversight
    label: Control oversight
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether supervisory mechanisms hold against a system actively trying to evade
      them.
    examples:
      - ref: controlarena
        qualifies: true
        why: >
          Scores whether a control protocol of monitors, deferral and auditing stops an attack
          policy, instructed to subvert it, from completing a harmful side task.
      - ref: apollo-research-scheming-suite
        qualifies: false
        why: >
          NEAR MISS. Oversight Subversion has the model disable an oversight config, but the score
          is whether the model takes that action, not whether a supervisory mechanism holds; it is
          `deception-scheming`.
      - ref: processbench
        qualifies: false
        why: >
          NEAR MISS. Motivated by scalable oversight, but it scores the accuracy of locating
          ordinary mathematical errors, and no system is trying to evade the check; it is
          `mathematics/proof-verification`.
  - id: safety-alignment/interpretability-probes
    label: Interpretability probes
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Evaluating methods that read a model's internal structure, scored on what the method
      recovers.
    examples:
      - ref: saebench
        qualifies: true
        why: >
          Eight metrics score what sparse autoencoders' latents recover from a host model's
          activations: concepts, explanations, reconstructions and separable attributes.
      - ref: mask
        qualifies: false
        why: >
          NEAR MISS. It elicits a model's belief, but by asking neutral questions and judging the
          answers; no method reads the model's internal structure, so it is
          `honesty-truthfulness`.
  - id: safety-alignment/sandbagging
    label: Sandbagging
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system deliberately underperforms when it infers that scoring well is
      against its interest.
    examples:
      - ref: apollo-research-scheming-suite
        qualifies: true
        why: >
          As a secondary domain: its Sandbagging evaluation asks whether accuracy on simple
          multiplication drops when scoring above 50% would trigger unlearning.
      - ref: situational-awareness-dataset
        qualifies: false
        why: >
          NEAR MISS. No task scores a capability gap between observed and unobserved conditions;
          STAGES scores the detection itself, which is `evaluation-awareness`.
    not_to_be_confused_with:
      - term: safety-alignment/evaluation-awareness
        distinction: >
          Evaluation awareness is noticing the test; sandbagging is underperforming because of
          it. Awareness is measurable without any behaviour change, which is why they are
          separate terms.
  - id: safety-alignment/value-alignment
    label: Value alignment
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system's expressed values or choices match a stated normative
      standard.
    examples:
      - ref: ethics
        qualifies: true
        why: >
          Five moral-judgement tasks scored by agreement with annotators' consensus labels across
          named normative theories.
      - ref: alignbench
        qualifies: false
        why: >
          NEAR MISS. Its name says alignment, but in the helpfulness sense: a judge rates each
          free-form answer against a reference and category criteria, not against a stated
          normative standard, which is `language/generation`.

  # -------------------------------------------------------------- code
  - id: code
    label: Code
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose scored artifact is software.
    inclusion_test: >
      Tag this as PRIMARY if the entrant's task is to author software and the grader judges it
      by running, testing or verifying that software, or by scoring what the software computes,
      such as a trained model's predictions or an analysis result.
    exclusion_test: >
      Do NOT tag this if code is the means to a result in another field, and do NOT tag it where
      the subject is operating a computer rather than authoring software: a grader that checks
      the end state of a machine the entrant operated makes it `agents-tooluse`, even where some
      tasks leave a program behind. An agentic harness does not move a benchmark out of this
      family; when tests judge a patch, this family is primary and
      `agents-tooluse/software-agents` is secondary (02 S12.11).
    examples:
      - ref: swe-bench-verified
        qualifies: true
        why: >
          Issue-resolving patches judged by fail-to-pass and pass-to-pass test sets.
      - ref: terminal-bench
        qualifies: false
        why: >
          NEAR MISS. Commands and scripts throughout, but the task is operating a machine to an
          end state, which is `agents-tooluse`.
      - ref: mle-bench
        qualifies: true
        why: >
          Agents write and run ML pipelines, and the grader scores the predictions file the
          resulting model produces; the software's output is what is scored.
    not_to_be_confused_with:
      - term: agents-tooluse
        distinction: >
          The grader decides the family, not the harness. Software the entrant wrote, judged by
          tests or by what it computes, is `code`; the state a machine was left in is
          agents-tooluse.
    seed_target: 16
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: code/function-synthesis
    label: Function synthesis
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a self-contained function from a specification, scored by running tests against
      it.
    examples:
      - ref: humaneval
        qualifies: true
        why: >
          164 hand-written Python problems, each a signature and docstring to complete, scored by
          running unit tests on the function.
      - ref: bigcodebench
        qualifies: true
        why: >
          1,140 Python tasks, each one self-contained function written from its docstring or
          instruction and judged by its unit tests.
      - ref: cruxeval
        qualifies: false
        why: >
          NEAR MISS. The function is given; the entrant writes only an input expression or an
          output literal for it, not a function from a specification, which is
          `code-understanding`.
      - ref: swe-bench-pro
        qualifies: false
        why: >
          NEAR MISS. No task is a self-contained function; every task is a change inside a
          repository whose location the system must find, which is `repository-scale-se`.
  - id: code/repository-scale-se
    label: Repository-scale software engineering
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Making a correct change inside a real repository, where finding where to change it is part
      of the task.
    examples:
      - ref: swe-bench
        qualifies: true
        why: >
          2,294 real GitHub issues from 12 Python repositories; the system gets the issue text and
          must patch the repository so the issue's tests pass.
      - ref: swe-bench-pro
        qualifies: true
        why: >
          The system gets a whole repository and a task description, finds where to change it and
          writes a patch, typically across several files, which the task's tests judge.
      - ref: aider-polyglot
        qualifies: false
        why: >
          NEAR MISS. The files to change are given and small, an exercise's stubs, so there is no
          repository to search and no localisation step; it is `function-synthesis`.
      - ref: terminal-bench
        qualifies: false
        why: >
          NEAR MISS. Many tasks leave a program behind, but the tests check the container's final
          state rather than judge a patch, which is `agents-tooluse/operating-system-tasks`.
    not_to_be_confused_with:
      - term: agents-tooluse/software-agents
        distinction: >
          When the change is judged by tests, this term is primary even if every entrant is an
          agent; software-agents records the agentic mode as secondary.
  - id: code/bug-repair
    label: Bug repair
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a patch that fixes a specified defect.
    examples:
      - ref: defects4j
        qualifies: true
        why: >
          854 reproducible real Java bugs, each exposed by a triggering test; in repair use the
          patch to the buggy program is judged by running the project's tests.
      - ref: swe-bench-pro
        qualifies: true
        why: >
          As a secondary domain: its tasks include bug fixes beside feature requests,
          optimisations and refactoring, each patch judged by the task's tests.
      - ref: gso
        qualifies: false
        why: >
          NEAR MISS. The base code is correct and nothing is broken; the specification is a
          performance test rather than an issue or a failing test, which is
          `code-performance-optimization`.
      - ref: aider-polyglot
        qualifies: false
        why: >
          NEAR MISS. The stubs are unimplemented, not defective, and the second try repairs the
          model's own first attempt rather than a specified defect.
  - id: code/competitive-programming
    label: Competitive programming
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving algorithmic contest problems under their original correctness and efficiency
      limits.
    examples:
      - ref: livecodebench
        qualifies: true
        why: >
          Dated LeetCode, AtCoder and Codeforces contest problems judged by hidden tests, so
          models are scored on problems newer than their training cutoff.
      - ref: ale-bench
        qualifies: true
        why: >
          AtCoder Heuristic Contest problems kept under their original execution limits and ranked
          against the contest's own human field.
      - ref: algotune
        qualifies: false
        why: >
          NEAR MISS. Both reward efficient algorithms, but these are library functions with a
          reference solver to beat, and speed is the score rather than a pass/fail limit, which is
          `code-performance-optimization`.
      - ref: matharena
        qualifies: false
        why: >
          NEAR MISS. Its Project Euler problems need programs, but only the final number is
          scored, with no efficiency limit beyond the code tool's two-minute timeout.
    not_to_be_confused_with:
      - term: code/function-synthesis
        distinction: >
          Both are scored by tests. Competitive programming keeps the original efficiency
          limits, so an algorithmically naive but correct solution fails -- which is not true of
          function synthesis.
  - id: code/code-understanding
    label: Code understanding
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions about code without necessarily modifying it.
    examples:
      - ref: cruxeval
        qualifies: true
        why: >
          800 short Python functions: predict the output for a given input, or an input for a
          given output, with nothing written or changed in the program.
      - ref: livecodebench
        qualifies: true
        why: >
          As a secondary domain: its code execution and test output prediction scenarios ask about
          a given program or problem without writing one.
      - ref: defects4j
        qualifies: false
        why: >
          NEAR MISS. It is also a standard set for fault localisation, which ranks suspicious code
          without modifying it, but a ranking of locations is not an answer to a question about
          code, and its dominant repair use modifies the program, which is `bug-repair`.
  - id: code/program-verification
    label: Program verification
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing or checking formal proofs of program properties.
    examples:
      - ref: dafnybench
        qualifies: true
        why: >
          782 Dafny programs with their hints removed; the model restores assertions and
          invariants so the verifier proves each program's own specification.
      - ref: proofbench
        qualifies: false
        why: >
          NEAR MISS. The output is Lean code, but the property proved belongs to a mathematical
          statement, not to a program, which is `mathematics/formal-theorem-proving`.
    not_to_be_confused_with:
      - term: mathematics/formal-theorem-proving
        distinction: >
          The subject of the proof decides, not the tool. A property of a program is this term;
          a mathematical statement proved in a program verifier such as Dafny is
          formal-theorem-proving.
  - id: code/ml-engineering
    label: ML engineering
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Building or improving a machine-learning pipeline, scored on the performance of the model
      it produces.
    examples:
      - ref: mle-bench
        qualifies: true
        why: >
          An agent builds and runs an ML pipeline offline for 75 Kaggle competitions, scored by
          the medal its trained model's predictions would have won.
      - ref: paperbench
        qualifies: false
        why: >
          NEAR MISS. It scores whether a paper's results were reproduced, graded against a rubric,
          not how good a model the code trains; it is `agents-tooluse/long-horizon-autonomy`.
      - ref: dabstep
        qualifies: false
        why: >
          NEAR MISS. No model is trained or scored; each answer is a computed value checked
          against a key, which is `data-science-workflows`.
  - id: code/data-science-workflows
    label: Data science workflows
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing an analysis over real data to reach a defensible quantitative answer.
    examples:
      - ref: dabstep
        qualifies: true
        why: >
          450 questions over one payments dataset and its manual: the entrant writes and runs code
          to compute each answer, and the grader scores the value the analysis computes.
      - ref: bixbench
        qualifies: false
        why: >
          NEAR MISS. The definition fits the work, but code is the means to a result in another
          field: the scored artifact is the answer to a biological question, judged without
          running the agent's code, which is `biology-genetics/bioinformatics-analysis`.
      - ref: mle-bench
        qualifies: false
        why: >
          NEAR MISS. The predictions of a trained model on a held-out split are scored, not an
          analysis reaching a quantitative answer, and the paper sets it apart from data science
          tasks; it is `ml-engineering`.
  - id: code/code-performance-optimization
    label: Code performance optimization
    parent: code
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Making code faster while preserving behaviour, scored on speedup rather than on
      correctness alone.
    examples:
      - ref: algotune
        qualifies: true
        why: >
          154 numerical library functions to make faster: the verifier must accept every output,
          and the score is the speedup over the reference implementation.
      - ref: gso
        qualifies: true
        why: >
          102 expert speedups in real repositories: a patch must keep outputs unchanged and match
          the expert commit's runtime, so a correct patch that is not fast enough fails.
      - ref: ale-bench
        qualifies: false
        why: >
          NEAR MISS. No code is given to speed up; the execution limit is a fixed constraint each
          program must meet, and the score is the problem's own objective, which is
          `competitive-programming`.

  # -------------------------------------------------------------- language
  - id: language
    label: Language
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is the production or interpretation of natural language itself.
    inclusion_test: >
      Tag this as PRIMARY if the thing being measured is a language competence -- understanding,
      generation, translation, summarisation or retrieval over text.
    exclusion_test: >
      Do NOT tag this if language is only the interface to a subject that is measured elsewhere:
      a physics question asked in English is `physics`, and a coding task described in English
      is `code`.
    examples:
      - ref: mmlu-pro
        qualifies: false
        why: >
          NEAR MISS. Text throughout, but what is measured is breadth of knowledge across
          subjects, which is `general-intelligence`.
      - ref: open-asr-leaderboard
        qualifies: false
        why: >
          NEAR MISS. Language is the content, but the scored act is recovering it from an audio
          signal, which is `audio-speech`.
    seed_target: 14
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: language/understanding
    label: Understanding
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions whose answers are determined by a supplied passage.
    examples:
      - ref: squad
        qualifies: true
        why: >
          Each question is posed on a supplied Wikipedia paragraph and answered with a span of it,
          so the passage determines the answer.
      - ref: boolq
        qualifies: true
        why: >
          Naturally occurring yes/no questions, each answered from a Wikipedia passage an
          annotator marked as containing the answer.
      - ref: hellaswag
        qualifies: false
        why: >
          NEAR MISS. A context is supplied, but it does not determine the ending; the paper's
          point is that world knowledge decides it, which is `reasoning-general/commonsense`.
      - ref: lexglue
        qualifies: false
        why: >
          NEAR MISS. The paper calls its tasks legal NLU, but language is the interface: the
          datasets need legal expertise and their labels come from court decisions, so the
          family's exclusion sends it to `society-econ-law/legal-document`.
  - id: language/generation
    label: Generation
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing free-form text scored against reference texts or rubric criteria.
    examples:
      - ref: alignbench
        qualifies: true
        why: >
          Open requests answered in free-form Chinese, each rated 1-10 by a judge against a
          reference answer and category-specific criteria.
      - ref: writingbench
        qualifies: true
        why: >
          1,000 writing tasks in six domains whose free-form output is graded on five criteria
          written for each query.
      - ref: hellaswag
        qualifies: false
        why: >
          NEAR MISS. The system picks one of four supplied endings and is scored by accuracy;
          nothing it writes is scored, which is `reasoning-general/commonsense`.
      - ref: counselbench
        qualifies: false
        why: >
          NEAR MISS. Free text scored on rubric dimensions, but what is measured is the clinical
          quality and safety of mental-health advice, which is `medicine-health/mental-health`.
  - id: language/dialogue
    label: Dialogue
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Conducting a multi-turn conversation, scored on the conversation as a whole rather than on
      one reply.
    examples:
      - ref: mt-bench
        qualifies: true
        why: >
          Two-turn questions whose second turn depends on the model's first answer; the judge sees
          the whole conversation when it grades the second turn.
      - ref: c3
        qualifies: false
        why: >
          NEAR MISS. Nearly half the problems are about a dialogue, but the system reads a
          finished dialogue and answers a question about it, never conducting one; it is
          `understanding`.
      - ref: lmarena
        qualifies: false
        why: >
          NEAR MISS. The vote covers the whole conversation, but conversations average 1.3 turns
          and the claim is usefulness across uses, not conducting a dialogue; it is
          `general-intelligence/open-preference-arenas`.
  - id: language/summarization
    label: Summarization
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a shorter text that preserves the key content of a source.
    examples:
      - ref: xlsum
        qualifies: true
        why: >
          BBC article-summary pairs in 44 languages, scored on producing a shorter text that keeps
          the article's key content.
      - ref: aci-bench
        qualifies: true
        why: >
          As a secondary domain: the scored act is a visit note that summarises a doctor-patient
          conversation, primary in medicine-health because the note follows clinical conventions.
      - ref: writingbench
        qualifies: false
        why: >
          NEAR MISS. A few subdomains condense supplied material, but they are a small share and
          the scored act is writing to the query's criteria, not preserving a source's content; it
          is `generation`.
  - id: language/translation
    label: Translation
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Rendering text from one language into another.
    examples:
      - ref: flores
        qualifies: true
        why: >
          Wikimedia sentences professionally translated into 200+ languages, for scoring
          translation between any two of them.
      - ref: wmt-general-mt
        qualifies: true
        why: >
          Each edition scores translations of documents from a source into a target language, one
          direction at a time, ranked by professional human evaluation.
      - ref: iwslt
        qualifies: false
        why: >
          NEAR MISS. The input is speech, not text, and the score depends on what was recovered
          from the audio, which is `audio-speech/speech-translation`.
      - ref: xlsum
        qualifies: false
        why: >
          NEAR MISS. Each summary is in its article's own language and nothing is rendered from
          one language into another; it is `summarization`.
  - id: language/multilingual
    label: Multilingual
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring the same task across many languages in order to compare performance between
      them.
    examples:
      - ref: belebele
        qualifies: true
        why: >
          One reading-comprehension task run identically in 122 language variants, with parallel
          items made so that models can be compared across them.
      - ref: xlsum
        qualifies: true
        why: >
          As a secondary domain: the same summarization task is run and reported per language
          across 44 languages.
      - ref: writingbench
        qualifies: false
        why: >
          NEAR MISS. Queries are in Chinese or English and scored per language, but two languages
          are a split of one task set, not a comparison across many languages; it is `generation`.
      - ref: c3
        qualifies: false
        why: >
          NEAR MISS. C3 is in one language; the paper hopes it will support cross-lingual study,
          but no task in it is run across languages.
    not_to_be_confused_with:
      - term: language/translation
        distinction: >
          Multilingual benchmarks run the same task in many languages to compare them.
          Translation benchmarks score moving content between two of them. A multilingual QA
          suite translates nothing.
  - id: language/low-resource-languages
    label: Low resource languages
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks in languages for which little training or evaluation data exists.
    examples:
      - ref: flores
        qualifies: true
        why: >
          As a secondary domain: the scored task is translation, but the benchmark's own purpose
          is the long tail of low-resource languages.
      - ref: masakhaner
        qualifies: true
        why: >
          As a secondary domain: both papers build named-entity data in African languages because
          those languages lack annotated datasets.
      - ref: zerospeech
        qualifies: false
        why: >
          NEAR MISS. Unwritten and low-resource languages are the motivation, but the score is
          recovered from audio and the current benchmarks are English LibriSpeech, which is
          `audio-speech/speech-recognition`.
      - ref: c3
        qualifies: false
        why: >
          NEAR MISS. Chinese is not a language with little training or evaluation data.
  - id: language/long-context
    label: Long context
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks whose difficulty comes from the length of the input the system must actually use.
    examples:
      - ref: ruler
        qualifies: true
        why: >
          Synthetic tasks run at increasing input lengths to find the context size a model can
          really use, so length sets the difficulty.
      - ref: fiction-livebench
        qualifies: true
        why: >
          Each question on a story's subtext is asked at increasing lengths of the same story, up
          to 192K tokens, so the reported difficulty is set by length.
      - ref: hotpotqa
        qualifies: false
        why: >
          NEAR MISS. Ten short paragraphs are not long input; the difficulty is finding and
          connecting two of them, which is `retrieval-qa`.
      - ref: writingbench
        qualifies: false
        why: >
          NEAR MISS. Inputs reach 19,361 tokens, but length is one of several properties the
          queries vary and the score is writing quality; it is `generation`.
  - id: language/retrieval-qa
    label: Retrieval QA
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions that require retrieving supporting documents from a corpus first.
    examples:
      - ref: hotpotqa
        qualifies: true
        why: >
          In the fullwiki setting the system gets only the question and Wikipedia's first
          paragraphs, so the supporting paragraphs must be retrieved before the answer.
      - ref: financebench
        qualifies: true
        why: >
          As a secondary domain: the paper makes finding the evidence among a company's filings,
          rather than being handed it, part of the test.
      - ref: squad
        qualifies: false
        why: >
          NEAR MISS. The paragraph is given with the question; no document has to be retrieved
          from a corpus first, which is `understanding`.
      - ref: ruler
        qualifies: false
        why: >
          NEAR MISS. The QA category's gold paragraphs sit inside the input among distractors;
          nothing is retrieved from a corpus first, which is `long-context`.
  - id: language/information-extraction
    label: Information extraction
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Extracting structured records such as entities, relations or events from unstructured
      text.
    examples:
      - ref: masakhaner
        qualifies: true
        why: >
          Finds the named entities in local-news sentences in 21 African languages and labels each
          span with its type, scored by entity-level F1.
      - ref: lifeclef
        qualifies: true
        why: >
          As a secondary domain: PestCLEF, one of the 2026 tasks, scores relations extracted from
          web documents on plant pests.
      - ref: squad
        qualifies: false
        why: >
          NEAR MISS. The output is one answer span per question, not structured records such as
          entities, relations or events; it is `understanding`.
      - ref: financebench
        qualifies: false
        why: >
          NEAR MISS. 28% of the labelled questions only extract a figure or a passage, but the
          output is an answer to a question, not structured records; it is
          `society-econ-law/financial-analysis`.
  - id: language/creative-writing
    label: Creative writing
    parent: language
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing imaginative text scored on craft criteria rather than on factual correctness.
    examples:
      - ref: writingbench
        qualifies: true
        why: >
          As a secondary domain: its Literature & Arts domain asks for novels, poetry, scripts and
          critiques graded on query-specific criteria, and that subset carries the term as
          primary.
      - ref: fiction-livebench
        qualifies: false
        why: >
          NEAR MISS. The material is fiction and the users are writers, but the model writes
          nothing scored on craft; it answers questions about a story it is given, which is
          `long-context`.
      - ref: copybench
        qualifies: false
        why: >
          NEAR MISS. The non-literal task is story writing, but the story is scored only on
          overlap with the source book and a fluency rating, not on its quality as writing; it is
          `safety-alignment/privacy-memorization`.

  # -------------------------------------------------------------- society-econ-law
  - id: society-econ-law
    label: Society, economics and law
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is economic, legal or social activity.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity concerns work, markets, legal reasoning, policy
      or social behaviour.
    exclusion_test: >
      Do NOT tag this if the benchmark measures a general competence using economic content as
      material, and do NOT tag it where the subject is autonomous operation rather than the
      economic value of the output. Forecasting questions that resolve against real-world
      events are the exception: they stay here, in `forecasting-prediction-markets`, whatever
      their topic and however general the competence claimed (02 S12.8), because no other
      family has a home for prospective forecasting.
    examples:
      - ref: gdpval
        qualifies: true
        why: >
          1,320 tasks across 44 occupations in the top nine US GDP sectors, graded blind by
          experts.
      - ref: forecastbench
        qualifies: true
        why: >
          Forecasting questions resolving against real-world outcomes.
      - ref: remote-labor-index
        qualifies: true
        why: >
          Completion of real remote work as the scored quantity.
      - ref: osworld-2-0
        qualifies: false
        why: >
          NEAR MISS. The tasks are economically valuable computer work, but what is scored is
          autonomous operation of an interface, which is `agents-tooluse`.
    seed_target: 14
    core: false
    coverage_status: surveyed
    curation_posture: mixed
    reviewer_signoff: none
  - id: society-econ-law/economically-valuable-work
    label: Economically valuable work
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing tasks drawn from real paid occupations, scored by expert comparison against
      human work product.
    examples:
      - ref: gdpval
        qualifies: true
        why: >
          Tasks from 44 occupations chosen by their share of US wages and GDP, graded blind by
          occupational experts against a professional's deliverable.
      - ref: remote-labor-index
        qualifies: true
        why: >
          240 real paid freelance projects; evaluators judge whether the agent's deliverable is at
          least as good as the professional's own.
      - ref: theagentcompany
        qualifies: false
        why: >
          NEAR MISS. The tasks were chosen with O*NET's occupations, but checkpoint evaluators
          score the environment, not expert comparison with human work product; autonomous
          operation is `agents-tooluse/long-horizon-autonomy`.
      - ref: finance-agent-benchmark
        qualifies: false
        why: >
          NEAR MISS. The questions are analysts' work, but an LLM judge checks rubric criteria
          rather than comparing the output with human work product; `financial-analysis` is the
          narrower fit.
  - id: society-econ-law/finance-forecasting
    label: Finance forecasting
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting financial quantities such as prices, returns, volatility or risk.
    examples:
      - ref: stocknet
        qualifies: true
        why: >
          Predicts the direction of a stock's adjusted closing price on a target day from tweets
          and five days of prices, scored by accuracy and MCC.
      - ref: stockbench
        qualifies: false
        why: >
          NEAR MISS. The agent never states a predicted price, return or volatility; it sets
          positions, and only the realised portfolio outcome is scored, which is
          `trading-market-interaction`.
  - id: society-econ-law/financial-analysis
    label: Financial analysis
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering analytical questions over financial documents and statements.
    examples:
      - ref: financebench
        qualifies: true
        why: >
          Open-book analyst questions about public companies, answered from their filings, with
          answers labelled by hand.
      - ref: finance-agent-benchmark
        qualifies: true
        why: >
          Analyst questions over SEC filings, each answer checked criterion by criterion against
          an expert's answer.
      - ref: apex-agents
        qualifies: false
        why: >
          NEAR MISS. Banking is one of its three jobs, but financial analysis is the material of a
          subset, not the scored subject: an LM judge checks criteria on what a tool-using agent
          returned, which is `agents-tooluse/tool-api-calling`.
      - ref: stocknet
        qualifies: false
        why: >
          NEAR MISS. No question is answered over financial documents or statements; the inputs
          are tweets and price series, which is `finance-forecasting`.
  - id: society-econ-law/trading-market-interaction
    label: Trading market interaction
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Acting inside a market environment, scored on the outcome of the interaction.
    examples:
      - ref: stockbench
        qualifies: true
        why: >
          Agents buy, sell and hold 20 Dow Jones stocks against real prices, scored on the
          portfolio's return, drawdown and Sortino ratio.
      - ref: vending-bench-2
        qualifies: true
        why: >
          As a secondary domain: the score is the outcome of buying and selling in a simulated
          market, but the subject is autonomous operation, so the primary is agents-tooluse.
      - ref: glee
        qualifies: false
        why: >
          NEAR MISS. Negotiation and persuasion are seller-buyer exchanges, but each game is a
          bilateral, stylised model from economic theory rather than a market of many traders; it
          is `economics-simulation`.
  - id: society-econ-law/legal-reasoning
    label: Legal reasoning
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Applying legal rules to a set of facts to reach a determinate conclusion.
    examples:
      - ref: legalbench
        qualifies: true
        why: >
          162 tasks designed by legal professionals, from issue-spotting to rule application,
          organised around the profession's own account of legal reasoning.
      - ref: lexglue
        qualifies: true
        why: >
          As a secondary domain: three of its seven tasks apply law to facts, predicting the ECtHR
          articles a court found violated and picking the holding a citing passage relies on.
      - ref: agieval
        qualifies: false
        why: >
          NEAR MISS. Law is its largest subject (JEC-QA and LSAT), but under half the questions,
          and the breadth does not lie inside one family; it is
          `general-intelligence/multi-subject-knowledge-exams`.
      - ref: obliqa
        qualifies: false
        why: >
          NEAR MISS. No facts are given to which a rule is applied, and no determinate conclusion
          is scored; the answer restates the obligations the passages contain, which is
          `policy-analysis`.
  - id: society-econ-law/legal-document
    label: Legal document
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Extracting from, drafting or reviewing legal documents.
    examples:
      - ref: biglaw-bench
        qualifies: true
        why: >
          Law-firm tasks whose output is a legal work product (a memo, a client alert, an analysis
          of filings), scored on its substance, structure and style by lawyer-written rubrics.
      - ref: lexglue
        qualifies: true
        why: >
          Four of its seven tasks label a legal document by topic or clause type, from SCOTUS
          opinions and EU laws to contract provisions.
      - ref: writingbench
        qualifies: false
        why: >
          NEAR MISS. Politics & Law is one of six domains, but the benchmark claims writing in
          general and legal drafting is material, not the subject; it is `language/generation`.
      - ref: obliqa
        qualifies: false
        why: >
          NEAR MISS. Restating obligations from regulatory texts is extraction from a semi-legal
          document, but the items are questions about what compliance requires, scored on
          obligation coverage, which is `policy-analysis`.
  - id: society-econ-law/economics-simulation
    label: Economics simulation
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Modelling economic agents or systems, scored against economic outcomes.
    examples:
      - ref: glee
        qualifies: true
        why: >
          Two-player bargaining, negotiation and persuasion games from economic theory, scored on
          the exchange's economic outcome: self-gain, efficiency and fairness.
      - ref: vending-bench-2
        qualifies: false
        why: >
          NEAR MISS. The environment simulates an economy, but the entrant acts inside it rather
          than modelling economic agents or systems, which is `trading-market-interaction`,
          carried as secondary.
      - ref: gtbench
        qualifies: false
        why: >
          NEAR MISS. Blind Auction, Negotiation and the Prisoner's Dilemma are economic games, but
          they are three of ten, and the score is a player's advantage over its opponent, which is
          `games-planning/multi-game-suites`.
  - id: society-econ-law/education-tutoring
    label: Education tutoring
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Teaching or assessing a learner, scored on pedagogical outcome or instructional quality.
    examples:
      - ref: mathtutorbench
        qualifies: true
        why: >
          Scores LLM maths tutors on student understanding and pedagogy, with a reward model
          judging scaffolding; its headline is that solving ability does not make a good tutor.
      - ref: agieval
        qualifies: false
        why: >
          NEAR MISS. Its items are exams written to assess human test-takers (Gaokao, SAT, LSAT),
          but here they score the model's own answers and no learner is taught or assessed; it is
          `general-intelligence/multi-subject-knowledge-exams`.
  - id: society-econ-law/policy-analysis
    label: Policy analysis
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Analysing policy options or regulatory questions.
    examples:
      - ref: obliqa
        qualifies: true
        why: >
          Compliance questions on what a regulated firm must do under financial regulation, scored
          on whether the answer states all the applicable obligations.
      - ref: geobenchx
        qualifies: false
        why: >
          NEAR MISS. The tasks serve socio-economic analysis for reports and policy papers, but
          the score is whether the tool calls match a reference, which is
          `agents-tooluse/tool-api-calling`.
      - ref: simulacrabench
        qualifies: false
        why: >
          NEAR MISS. The surveys inform UN and World Bank programming, but the scored quantity is
          a predicted answer, not an analysis of policy options; it is `social-simulation`.
  - id: society-econ-law/social-simulation
    label: Social simulation
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Simulating social behaviour or group dynamics.
    examples:
      - ref: simulacrabench
        qualifies: true
        why: >
          Predicts how members of specific populations answer held-out surveys on unreleased
          UNHCR, UNICEF and World Bank microdata.
      - ref: glee
        qualifies: false
        why: >
          NEAR MISS. Players, language models or people, bargain, negotiate and persuade, but each
          game is scored on its economic outcome (self-gain, efficiency, fairness), not as a
          simulation of social behaviour; it is `economics-simulation`.
  - id: society-econ-law/forecasting-prediction-markets
    label: Forecasting prediction markets
    parent: society-econ-law
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Making probabilistic forecasts about future events that later resolve.
    examples:
      - ref: forecastbench
        qualifies: true
        why: >
          Probabilistic forecasts about future events, Brier-scored as the questions resolve,
          beside superforecasters and the public.
      - ref: stocknet
        qualifies: false
        why: >
          NEAR MISS. Every target is a 2014-2015 price movement that had already happened when the
          dataset was published; nothing resolves after the prediction, which is
          `finance-forecasting`.
      - ref: simulacrabench
        qualifies: false
        why: >
          NEAR MISS. The probabilities concern answers respondents have already given, withheld by
          the organisers, not future events that resolve later; it is `social-simulation`.

  # -------------------------------------------------------------- engineering-design
  - id: engineering-design
    label: Engineering and design
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose scored artifact is a designed physical or computational system.
    inclusion_test: >
      Tag this as PRIMARY if what is submitted is a design -- geometry, a circuit, a structure,
      a protocol or an apparatus -- judged against engineering criteria.
    exclusion_test: >
      Do NOT tag this if the design is operated rather than produced, which is
      `robotics-embodiment`, and do NOT tag it where the artifact is software, which is `code`.
    examples:
      - ref: cadeval
        qualifies: true
        why: >
          Generated OpenSCAD geometry scored by Chamfer and Hausdorff tolerance.
      - ref: autolabs
        qualifies: true
        why: >
          Natural language converted to an executable liquid-handler protocol.
      - ref: learn2design-2026
        qualifies: true
        why: >
          Optimises the experimental design of gravitational-wave detectors.
      - ref: smart-buildings-challenge
        qualifies: false
        why: >
          NEAR MISS. Engineering subject matter, but the scored act is operating a building's
          energy system, not designing one.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: engineering-design/cad-geometry-generation
    label: CAD geometry generation
    parent: engineering-design
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing computer-aided design geometry that satisfies a stated specification.
    examples: []
  - id: engineering-design/circuit-eda
    label: Circuit and EDA design
    parent: engineering-design
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Designing, placing, routing or verifying electronic circuits.
    examples:
      - ref: circuitnet
        qualifies: true
        why: >
          Every task predicts a property of a chip layout in the physical-design flow (routing
          congestion, DRC violations, IR drop), which is electronic design automation.
      - ref: qcircuitbench
        qualifies: false
        why: >
          NEAR MISS. Circuits are designed and verified by simulation, but they are quantum
          circuits written in OpenQASM and scored as a simulated quantum process, not electronic
          circuits; it is `physics/quantum-systems`.
  - id: engineering-design/structural-mechanical-design
    label: Structural mechanical design
    parent: engineering-design
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Designing mechanical or structural components against load and material constraints.
    examples:
      - ref: airfrans
        qualifies: false
        why: >
          NEAR MISS. Motivated by airfoil shape optimisation, with a rank correlation meant to
          preserve the ordering of designs, but what is submitted and scored is a prediction of
          flow fields and forces, not a design; it is `physics/fluid-dynamics`.
      - ref: f1tenth
        qualifies: false
        why: >
          NEAR MISS. Teams build their own cars, but to a common bill of materials with caps on
          every component, and the score is how the car is driven, which is
          `robotics-embodiment/autonomous-driving-planning`.
  - id: engineering-design/process-control-optimization
    label: Process control optimization
    parent: engineering-design
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Controlling or optimising an industrial process against operating objectives.
    examples:
      - ref: smart-buildings-challenge
        qualifies: false
        why: >
          NEAR MISS. Controlling a process against operating objectives fits the act, but the
          family sends a system that is operated rather than designed elsewhere and names this
          benchmark as its near miss; it is `earth-climate/energy-systems`.
      - ref: safe-control-gym
        qualifies: false
        why: >
          NEAR MISS. The controlled systems are robots, a cart-pole and quadrotors, not an
          industrial process, and nothing is designed; it is `robotics-embodiment/drone-uav`.
  - id: engineering-design/experimental-apparatus-design
    label: Experimental apparatus design
    parent: engineering-design
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Designing a physical experimental setup capable of answering a stated question.
    examples: []
  - id: engineering-design/lab-automation-execution
    label: Lab automation execution
    parent: engineering-design
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Running laboratory procedures on automated equipment, scored on what the equipment
      actually produced.
    examples: []
    not_to_be_confused_with:
      - term: chemistry-materials/lab-automation-protocols
        distinction: >
          Execution presupposes a protocol. If no hardware runs and nothing is measured, the
          benchmark is scoring the protocol.

  # -------------------------------------------------------------- games-planning
  - id: games-planning
    label: Games and planning
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks in which an agent plays a game or acts in a rule-governed interactive
      environment.
    inclusion_test: >
      Tag this as PRIMARY if the score comes from episodes played against an environment or an
      opponent that responds.
    exclusion_test: >
      Do NOT tag this if a problem is posed and one solution submitted, which is
      `reasoning-general/puzzle-solving`; the discriminant is the protocol, not the topic. Do
      NOT tag it as primary either where the benchmark's own claim is acquisition of tasks it
      was not built for, with games as the vehicle, which is `general-intelligence`; the game
      subdomain is then secondary (02 S12.7).
    examples:
      - ref: kaggle-game-arena
        qualifies: true
        why: >
          All-play-all across chess, poker and other games, with the roster shaping the rating.
      - ref: craftax
        qualifies: true
        why: >
          Open-ended achievement progression against a responding environment.
      - ref: planbench
        qualifies: false
        why: >
          NEAR MISS. Plans and actions, but the item is a posed problem with a submitted answer
          and no environment responds.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: games-planning/board-games
    label: Board games
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Playing perfect-information board games.
    examples:
      - ref: kaggle-game-arena
        qualifies: true
        why: >
          Language models play each other at chess, all against all, and are rated by the results;
          chess is a perfect-information board game.
      - ref: gtbench
        qualifies: true
        why: >
          As a secondary domain: four of its ten two-player games are complete-information and
          deterministic, three of them on a board.
      - ref: hanabi
        qualifies: false
        why: >
          NEAR MISS. A turn-based tabletop game, but each player sees the others' hands and not
          their own, so information is private; the term takes perfect-information games only, and
          Hanabi is `card-imperfect-information`.
  - id: games-planning/card-imperfect-information
    label: Card and imperfect-information games
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Playing games in which players hold private information from each other.
    examples:
      - ref: hanabi
        qualifies: true
        why: >
          A cooperative card game in which each player sees the others' hands but not their own,
          so every player holds information another lacks.
      - ref: gtbench
        qualifies: true
        why: >
          As a secondary domain: four of its ten games turn on private information, the cards or
          dice of Kuhn Poker and Liar's Dice and the private valuations of Blind Auction and
          Negotiation.
      - ref: kaggle-game-arena
        qualifies: false
        why: >
          NEAR MISS. Two players compete turn by turn, but chess hides nothing from either player,
          so no one holds private information; it is `board-games`.
  - id: games-planning/video-games
    label: Video games
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Playing video games through their ordinary observation and action interfaces.
    examples:
      - ref: atari-100k
        qualifies: true
        why: >
          Agents learn 26 Atari 2600 games through the ALE's ordinary interfaces, the screen as
          observation and the joystick as action.
      - ref: videogamebench
        qualifies: true
        why: >
          VLM agents play commercial Game Boy and MS-DOS games from the emulator's screen with the
          controller, keyboard or mouse, scored by share of each game completed.
      - ref: smac
        qualifies: false
        why: >
          NEAR MISS. StarCraft II is a video game, but SMAC plays it through the raw API's feature
          vectors and unit-level commands, not the game's ordinary observation and action
          interface; it is `real-time-strategy`.
      - ref: craftax
        qualifies: false
        why: >
          NEAR MISS. A game built as an RL environment and run on its symbolic observations, an
          array encoding of the map and inventory, rather than through a game's ordinary
          interface.
  - id: games-planning/real-time-strategy
    label: Real time strategy
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Playing strategy games that demand many simultaneous decisions under real-time pressure.
    examples:
      - ref: smac
        qualifies: true
        why: >
          Every scenario is a StarCraft II battle in which a team of units must be controlled at
          once, each by its own agent, scored by test win rate.
      - ref: videogamebench
        qualifies: false
        why: >
          NEAR MISS. Warcraft II and Age of Empires are real-time strategy games, but both are in
          the dev set, and the only strategy game in the test set, Civilization, is turn-based;
          real time is the emulator's clock for every game, not the genre.
  - id: games-planning/puzzle-games
    label: Puzzle games
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving puzzles through an interactive episode against an environment that responds.
    examples:
      - ref: arc-agi-3
        qualifies: true
        why: >
          As a secondary domain: each environment is an abstract turn-based game whose levels the
          agent must solve by exploring and acting, without instructions, against an environment
          that responds.
      - ref: balrog
        qualifies: true
        why: >
          As a secondary domain: Baba Is AI, one of its six games, is a puzzle game played in
          episodes against a responding environment.
      - ref: enigmaeval
        qualifies: false
        why: >
          NEAR MISS. The protocol decides: a puzzle is posed and one answer submitted, puzzles
          needing interaction with a web page were excluded, and nothing responds to the solver,
          which is `reasoning-general/puzzle-solving`.
      - ref: planbench
        qualifies: false
        why: >
          NEAR MISS. Each item is a posed problem with one submitted answer, and no environment
          responds to the system's actions; it is `reasoning-general/planning`.
    not_to_be_confused_with:
      - term: reasoning-general/puzzle-solving
        distinction: >
          See the same rule from the other side: an environment that responds to each action
          makes it a game, a fixed problem statement with one submitted answer makes it
          reasoning.
      - term: general-intelligence/novel-task-acquisition
        distinction: >
          Both can hold interactive puzzles. When the benchmark's own claim is acquiring tasks
          the system has never seen, with goals it is not told, the claim wins and this term is
          secondary.
  - id: games-planning/open-ended-environments
    label: Open ended environments
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Acting in environments with no single fixed goal, scored on open-ended achievement.
    examples:
      - ref: craftax
        qualifies: true
        why: >
          An agent acts in a game world with no single goal, and the score is the achievements it
          unlocks within a fixed budget of environment steps.
      - ref: balrog
        qualifies: true
        why: >
          As a secondary domain: Crafter, one of its six games, is an open-ended achievement game.
      - ref: arc-agi-3
        qualifies: false
        why: >
          NEAR MISS. Every level has a completion state the agent must discover, and the score is
          efficiency at reaching it, so the goal is fixed; `puzzle-games` is the fit.
      - ref: vending-bench-2
        qualifies: false
        why: >
          NEAR MISS. A long episode against a responding environment that its paper calls a game,
          but it is a simulated business with one stated goal, the year-end balance, which is
          `agents-tooluse/long-horizon-autonomy`.
  - id: games-planning/procedural-generalization
    label: Procedural generalization
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring generalisation to procedurally generated levels that were not seen in training.
    examples:
      - ref: procgen
        qualifies: true
        why: >
          The headline protocol trains on 500 procedurally generated levels and scores on levels
          the agent has not seen.
      - ref: nle
        qualifies: true
        why: >
          As a secondary domain: every game is a new procedurally generated dungeon, and
          evaluation is on held-out seeds.
      - ref: craftax
        qualifies: false
        why: >
          NEAR MISS. Every world is procedurally generated, but agents are scored on levels drawn
          from the training distribution with no held-out set; generalisation to unseen levels is
          hoped for, not measured.
      - ref: balrog
        qualifies: false
        why: >
          NEAR MISS. All six environments are procedurally generated, but the protocol is
          zero-shot with no training levels and no held-out split; the generation guards against
          memorisation rather than measuring generalisation.
  - id: games-planning/game-theory
    label: Game theory
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks scored against a game-theoretic solution concept rather than against a pool of
      opponents.
    examples:
      - ref: gtbench
        qualifies: false
        why: >
          NEAR MISS. The name and the claim fit, but the score is normalized relative advantage
          against one opponent; the regret analysis approximating a Nash equilibrium is a
          secondary study of two games, not the benchmark's score. It is `multi-game-suites`.
      - ref: melting-pot
        qualifies: false
        why: >
          NEAR MISS. The matrix-game substrates borrow classic payoff matrices, but every scenario
          is scored by return against a background population, not against a game-theoretic
          solution concept.
  - id: games-planning/multi-agent-social
    label: Multi agent social
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Games whose difficulty comes from social dynamics such as alliance, betrayal or
      persuasion.
    examples:
      - ref: melting-pot
        qualifies: true
        why: >
          Every substrate is a multi-agent game against co-players that respond, built around
          social interaction, most scenarios mixing cooperative and competitive incentives.
      - ref: glee
        qualifies: true
        why: >
          As a secondary domain: the persuasion family's repeated cheap talk turns on reputation
          and trust between the two players.
      - ref: hanabi
        qualifies: false
        why: >
          NEAR MISS. Its theme is reasoning about teammates' beliefs and intentions, but the game
          is purely cooperative with a fixed team and no channel but hints, so there is no one to
          betray or persuade; it is `card-imperfect-information`.
      - ref: fantom
        qualifies: false
        why: >
          NEAR MISS. Social dynamics are the subject, but nothing is played: there are no moves,
          opponents or outcomes, which is `reasoning-general/theory-of-mind`.
  - id: games-planning/multi-game-suites
    label: Multi-game suites
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    # ADR-0016: a suite row of the coverage matrix counts suites, not task coverage. The gap
    # ranking reads a cell here as "is there a suite", never as coverage of the field. Arenas
    # and environment suites share this term; `evaluation_method` (`tournament-play` for an
    # arena) says which, not the domain.
    definition: >
      Suites whose scored tasks span several of the games-planning family's subdomains,
      reported per task or as one aggregate, where the suite's own claim is coverage within
      the family.
    inclusion_test: >
      Tag this as PRIMARY if the tasks span two or more of the games-planning family's
      subdomains, no one subdomain holds most of them, and the benchmark's own claim is breadth
      within the family. Record the subdomains the tasks fall in as secondary.
    exclusion_test: >
      Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and
      the others secondary), or if the suite spans several families, which is
      `general-intelligence`.
    examples:
      - ref: kaggle-game-arena
        qualifies: true
        why: >
          19 boards across board games, imperfect-information card games, social deduction and
          bargaining, played against other entrants.
      - ref: balrog
        qualifies: true
        why: >
          Six RL environments, from BabyAI to NetHack, averaged into one progress score; puzzle
          and open-ended environments each hold only part of it.
      - ref: atari-100k
        qualifies: false
        why: >
          NEAR MISS. Many games in one suite, but every one is an Atari video game, so
          `video-games` holds the whole benchmark.

  # -------------------------------------------------------------- general-intelligence
  - id: general-intelligence
    label: General intelligence
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose claim is about breadth or novelty across many subjects rather than
      competence in one.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is coverage of many fields, or
      acquisition of tasks it was not built for. When the benchmark also passes another
      family's protocol test, such as play in an interactive game environment, the claim
      decides: tag this family primary and record the other family's subdomain as secondary.
    exclusion_test: >
      Do NOT tag this if the benchmark is broad but its claim is about one competence, or if its
      breadth lies inside one family, which takes that family's subdomains (including a suite
      subdomain where ADR-0016 has added one). Do NOT tag it where every scored item needs an
      image and the benchmark's changes concern the image-text relation, which is `multimodal`
      however many subjects it spans (ADR-0015). And do NOT use this family as a home for
      benchmarks that were hard to place.
    examples:
      - ref: arc-agi
        qualifies: true
        why: >
          Novel-task acquisition with deliberately unhelpful surface similarity.
      - ref: mmlu-pro
        qualifies: true
        why: >
          Breadth across fourteen subjects is the entire claim.
      - ref: gpqa-diamond
        qualifies: true
        why: >
          Graduate-level breadth across three sciences with a stated chance baseline.
      - ref: frontiermath
        qualifies: false
        why: >
          NEAR MISS. Extremely hard and widely cited as a frontier measure, but its claim is
          mathematical competence specifically.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: general-intelligence/abstraction-generalization
    label: Abstraction generalization
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring an abstract rule from a handful of examples and applying it to new cases.
    inclusion_test: >
      Tag this as PRIMARY if each item gives a few demonstrations of an unstated rule, the
      system must apply the rule to new inputs, and the benchmark's own claim is general or
      fluid intelligence, on tasks built so that prior task-specific knowledge does not help.
    exclusion_test: >
      Do NOT tag this if rule induction is studied as a reasoning form in its own right
      (`reasoning-general/abstraction-induction`), or if the system must discover the task and
      its goal by acting in an environment that responds (`novel-task-acquisition`).
    examples:
      - ref: arc-agi-2
        qualifies: true
        why: >
          Infer the rule from a few grid examples and apply it to unseen test grids; the claim
          is general fluid intelligence.
      - ref: arc-agi-3
        qualifies: false
        why: >
          NEAR MISS. Same series and claim, but the agent must learn interactive environments
          whose goals it is never told, which is `novel-task-acquisition`.
    not_to_be_confused_with:
      - term: reasoning-general/abstraction-induction
        distinction: >
          Both infer a rule from instances. The claim separates them: general or fluid
          intelligence, on tasks built to defeat prior knowledge, is this term; rule induction
          studied as a reasoning form is abstraction-induction. ARC-AGI-2 meets both definitions
          and takes this one.
  - id: general-intelligence/novel-task-acquisition
    label: Novel task acquisition
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Learning to perform a task the system has never seen, within the evaluation episode
      itself.
    examples:
      - ref: arc-agi-3
        qualifies: true
        why: >
          Abstract turn-based environments with no instructions: the agent must explore, infer the
          goal and model the dynamics within the episode, scored on action efficiency against a
          human baseline.
      - ref: videogamebench
        qualifies: false
        why: >
          NEAR MISS. Its secret games are framed as task acquisition, but the agent is told each
          game's objectives and controls, seven of ten test games are public, and the headline
          claim is completing well-known games, which is `games-planning/video-games`.
      - ref: arc-agi-2
        qualifies: false
        why: >
          NEAR MISS. Each task is static input and output grids shown with demonstrations; nothing
          is discovered by acting in an environment that responds, which is
          `abstraction-generalization`.
    not_to_be_confused_with:
      - term: games-planning/puzzle-games
        distinction: >
          An interactive puzzle environment passes both families' tests. The claim decides:
          acquiring unseen tasks is this term, with the game subdomain secondary (02 S12.7).
  - id: general-intelligence/human-comparison-batteries
    label: Human comparison batteries
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Broad batteries built specifically to compare system performance against measured human
      performance.
    examples:
      - ref: gpqa
        qualifies: false
        why: >
          NEAR MISS. Human accuracy is measured on every question, but to certify that the
          questions are hard for skilled non-experts, and three sciences are not a broad battery;
          it is `multi-subject-knowledge-exams`.
      - ref: agieval
        qualifies: false
        why: >
          NEAR MISS. Human comparison runs through the paper, but the exams were written for
          people rather than built to measure them here, and the human figures are estimated from
          the exams' published statistics, not measured on these items.
  - id: general-intelligence/multi-subject-knowledge-exams
    label: Multi-subject knowledge exams
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Closed-ended question sets drawn from exams, textbooks or expert-written questions across
      many academic subjects, scored on the answers alone.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is breadth of subject knowledge or
      expertise, its items are closed-ended questions, and no single subject holds most of them.
    exclusion_test: >
      Do NOT tag this if one subject holds most of the items (that subject's family is primary),
      if measured human performance is the benchmark's purpose (`human-comparison-batteries`),
      or if the headline number aggregates heterogeneous task formats (`agi-composite-suites`).
    examples:
      - ref: mmlu-pro
        qualifies: true
        why: >
          Ten-option questions across 14 subjects; breadth is the whole claim.
      - ref: hle
        qualifies: true
        why: >
          Closed-ended questions across over a hundred subjects, with no human solve rate.
      - ref: helm-capabilities
        qualifies: false
        why: >
          NEAR MISS. Includes MMLU-Pro and GPQA, but aggregates five heterogeneous scenarios into
          one mean; that is `agi-composite-suites`.
  - id: general-intelligence/meta-learning
    label: Meta learning
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring how quickly a system improves across a distribution of related tasks.
    examples:
      - ref: meta-world
        qualifies: false
        why: >
          NEAR MISS. The definition describes its ML1, ML10 and ML45 sets, but every task is
          manipulation by one arm, so the breadth lies inside one family, and the MT sets score
          multi-task training, not adaptation; it is `robotics-embodiment/manipulation`.
  - id: general-intelligence/open-ended-discovery
    label: Open ended discovery
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system produces genuinely novel artifacts or findings rather than
      solving posed problems.
    examples: []
  - id: general-intelligence/compositional-generalization
    label: Compositional generalization
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recombining known primitives in configurations not present in training.
    examples:
      - ref: arc-agi-2
        qualifies: true
        why: >
          As a secondary domain: its report makes compositional generalisation, combining known
          rules or concepts in novel ways, ARC-AGI-2's main design focus.
      - ref: arc-agi-1
        qualifies: false
        why: >
          NEAR MISS. Its tasks are novel in representation, not in an arrangement of known
          primitives, and no ARC-AGI-1 source claims that held-out tasks recombine rules shown in
          training; it is `abstraction-generalization`.
      - ref: list-functions
        qualifies: false
        why: >
          NEAR MISS. No split holds out recombinations of known primitives; each function is a new
          rule to infer from its own examples, which is `reasoning-general/abstraction-induction`.
    not_to_be_confused_with:
      - term: reasoning-general/abstraction-induction
        distinction: >
          Compositional generalisation tests recombination of primitives the system already has.
          Abstraction induction tests inferring a rule that was never given. The first is about
          coverage of a combinatorial space, the second about arriving at the rule.
  - id: general-intelligence/agi-composite-suites
    label: AGI composite suites
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Composite suites that aggregate many heterogeneous tasks into a single general-capability
      score.
    examples:
      - ref: epoch-capabilities-index
        qualifies: true
        why: >
          One capability scale fitted to model scores on 61 benchmarks from many families (agents,
          coding, mathematics, science, knowledge, games, multimodal, writing), aggregated into a
          single number.
      - ref: livebench
        qualifies: true
        why: >
          Its headline averages seven categories from different families (mathematics, code, logic
          puzzles, language tasks, instructions, tables), scored by different methods, into one
          number.
      - ref: balrog
        qualifies: false
        why: >
          NEAR MISS. It averages heterogeneous tasks into one score and hopes to spur generalist
          agents, but its breadth lies inside one family, games, which is
          `games-planning/multi-game-suites`.
      - ref: big-bench-hard
        qualifies: false
        why: >
          NEAR MISS. It aggregates 23 heterogeneous tasks into one unweighted mean, the term's
          shape, but its claim is tasks that need multi-step reasoning, chosen by difficulty
          rather than coverage, which is `reasoning-general/logical-deduction`.
  - id: general-intelligence/open-preference-arenas
    label: Open preference arenas
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Open platforms where people submit their own prompts and choose between anonymised system
      outputs, and systems are ranked by a rating model over the votes, across many uses.
    inclusion_test: >
      Tag this as PRIMARY if prompts come from the public rather than a fixed item set, the score
      is a rating fitted to human pairwise votes, and the arena's own claim is general
      usefulness across many uses or modalities.
    exclusion_test: >
      Do NOT tag this if the arena is confined to one field or task (a robotics, coding or
      text-to-speech arena takes that field's subdomain, as RoboArena does), or if the judges are
      a model rather than people (`model-graded-judge` on the arena's own domain).
    examples:
      - ref: lmarena
        qualifies: true
        why: >
          Public prompts, anonymous pairwise votes and ratings across text, vision and
          generation arenas.
      - ref: roboarena
        qualifies: false
        why: >
          NEAR MISS. Pairwise human preference over rollouts, but confined to robot
          manipulation.

  # -------------------------------------------------------------- mathematics
  - id: mathematics
    label: Mathematics
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose scored quantity is a mathematical result, proof or derivation.
    inclusion_test: >
      Tag this as PRIMARY if the answer is checked as mathematics -- a value, an expression or a
      proof.
    exclusion_test: >
      Do NOT tag this if arithmetic is incidental to a question about another field, and do NOT
      tag it where the artifact scored is a program rather than a derivation.
    examples:
      - ref: frontiermath
        qualifies: true
        why: >
          Research-level problems whose answers are checked as mathematics, including a
          Lean-verified track.
      - ref: critpt
        qualifies: false
        why: >
          NEAR MISS. Heavily quantitative, but the problems are physics research challenges and
          the subject is physics.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: mathematics/arithmetic
    label: Arithmetic
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Computing numerical results, where the difficulty is the calculation rather than the
      modelling.
    examples:
      - ref: gsm8k
        qualifies: true
        why: >
          As a secondary domain: the paper puts the difficulty in the modelling, but each word
          problem is solved by a chain of calculations, and its models still made calculation
          errors.
      - ref: test-of-time
        qualifies: true
        why: >
          As a secondary domain: ToT-Arithmetic, 1,850 of its questions, is time arithmetic
          (adding days to a date, a time-zone conversion), scored by exact match.
      - ref: medcalc-bench
        qualifies: false
        why: >
          NEAR MISS. The arithmetic is scored, but the subject is clinical and the difficulty is
          mostly knowing the calculator and extracting its inputs from the note; a calculation
          inside another field's question goes to that field, here `medicine-health/clinical-qa`.
  - id: mathematics/competition-math
    label: Competition math
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving olympiad-style mathematics problems that have determinate answers.
    examples:
      - ref: math
        qualifies: true
        why: >
          12,500 problems from mathematics competitions, each with one determinate final answer
          checked against the reference.
      - ref: omni-math
        qualifies: true
        why: >
          4,428 olympiad problems, from introductory contests to the IMO, each with a determinate
          final answer checked against a reference.
      - ref: processbench
        qualifies: false
        why: >
          NEAR MISS. Competition and olympiad problems throughout, but the system judges a
          solution it is given instead of solving, which is `proof-verification`.
      - ref: gsm8k
        qualifies: false
        why: >
          NEAR MISS. Grade-school exercises written for the dataset, not olympiad or contest
          problems; the paper's own bar is a bright middle-school student.
  - id: mathematics/formal-theorem-proving
    label: Formal theorem proving
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a proof in a formal system that a proof assistant or automated verifier
      accepts.
    inclusion_test: >
      Tag this as PRIMARY if the system must produce a machine-checked proof of a mathematical
      statement, whether the checker is an interactive proof assistant (Lean, Isabelle) or an
      auto-active program verifier (Dafny).
    exclusion_test: >
      Do NOT tag this if the proved property belongs to a program rather than to a mathematical
      statement (`code/program-verification`), if a supplied proof is only judged
      (`proof-verification`), or if answers are checked as values or expressions
      (`competition-math`, `research-level-math`).
    examples:
      - ref: minif2f
        qualifies: true
        why: >
          Olympiad statements proved in Lean, Isabelle and other assistants; the properties
          proved are mathematical.
      - ref: frontiermath
        qualifies: false
        why: >
          NEAR MISS. Research-level problems, but Tiers 1 to 4 check answers as values, not
          proofs, which is `research-level-math`; the Lean-proof Erdos track is catalogued
          apart.
    not_to_be_confused_with:
      - term: code/program-verification
        distinction: >
          The subject of the proof decides, not the tool. A mathematical statement proved in a
          program verifier is this term; a property of a program is program-verification.
      - term: mathematics/proof-verification
        distinction: >
          If the system is handed a candidate proof and asked whether it holds, it is
          verification.
  - id: mathematics/symbolic-manipulation
    label: Symbolic manipulation
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Transforming mathematical expressions, scored by symbolic equivalence rather than by
      string match.
    examples:
      - ref: asymob
        qualifies: true
        why: >
          Integrals, limits, series and ODEs to transform, scored by computer-algebra equivalence
          to the reference, so differently written correct answers pass.
      - ref: srbench
        qualifies: false
        why: >
          NEAR MISS. The scored artifact is an expression checked by SymPy, but it is inferred
          from data rather than transformed from a given expression, which is
          `physics/symbolic-regression-discovery`.
      - ref: math
        qualifies: false
        why: >
          NEAR MISS. The problems are solved, not expressions transformed, and the official check
          compares the boxed answer with the reference as a string by fixed formatting rules, not
          by symbolic equivalence.
  - id: mathematics/applied-modeling
    label: Applied modeling
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Formulating a real-world situation as a mathematical model and solving it.
    examples:
      - ref: mamo
        qualifies: true
        why: >
          Scenarios that do not state their model: the system writes the ODE or (MI)LP, and the
          score is whether solving it gives the reference value.
      - ref: gsm8k
        qualifies: true
        why: >
          Everyday situations told in words, answered with a number; the paper puts the difficulty
          in turning the story into the right chain of steps.
      - ref: srbench
        qualifies: false
        why: >
          NEAR MISS. A model is found, but the input is a table of numbers and no situation is
          posed in words, which is `physics/symbolic-regression-discovery`.
  - id: mathematics/research-level-math
    label: Research level math
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving problems at the level of current mathematical research.
    examples:
      - ref: frontiermath
        qualifies: true
        why: >
          Unpublished expert-written problems from advanced undergraduate to research level, Tier
          4 research-level by design, with answers checked as values and expressions.
      - ref: matharena
        qualifies: true
        why: >
          As a secondary domain: its 2026 research benchmarks add research-level problems from new
          arXiv abstracts, and those subsets carry the term.
      - ref: hle
        qualifies: false
        why: >
          NEAR MISS. It emphasises world-class mathematics problems and Math is its first
          category, but the claim is broad academic coverage and no source shows mathematics
          holding most items, which is `general-intelligence/multi-subject-knowledge-exams`.
      - ref: putnambench
        qualifies: false
        why: >
          NEAR MISS. Putnam problems often use ideas from research mathematics, but they are
          contest problems set for undergraduates, with known solutions.
  - id: mathematics/proof-verification
    label: Proof verification
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Deciding whether a supplied proof is correct, rather than producing one.
    examples:
      - ref: processbench
        qualifies: true
        why: >
          The system is handed a model-written competition solution and locates the first wrong
          step, or declares every step correct, writing no solution of its own.
      - ref: proofbench
        qualifies: false
        why: >
          NEAR MISS. Nothing is handed to the system to judge: it writes the proof itself and Lean
          judges it, which is `formal-theorem-proving`.
    not_to_be_confused_with:
      - term: mathematics/formal-theorem-proving
        distinction: >
          Proving produces the artifact; verification judges one it is given. The second is a
          classification task and its baselines and ceilings are different.

  # -------------------------------------------------------------- multimodal
  - id: multimodal
    label: Multimodal
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose scored quantity is the relation between two or more modalities.
    inclusion_test: >
      Tag this as PRIMARY if success requires crossing between modalities -- answering in
      language about an image, binding an expression to a region, retrieving across modalities,
      or generating in one modality from another such that the correspondence is what is scored.
    exclusion_test: >
      Do NOT tag this if the benchmark is scored wholly inside one modality, which is `vision`
      or `audio-speech`. The boundary is the correspondence: VQA scores whether the answer
      matches the image, whereas image restoration scores the image alone.
    examples:
      - ref: geneval
        qualifies: true
        why: >
          Scores whether a generated image satisfies a compositional text description; the
          image-text correspondence is the measured quantity.
      - ref: coco
        qualifies: false
        why: >
          NEAR MISS. Labels and boxes, but from a fixed category set with no language to
          correspond to.
      - ref: vbench
        qualifies: false
        why: >
          NEAR MISS. Text-prompted video generation, but the sixteen scored dimensions are
          properties of the video, not of its agreement with the prompt.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: multimodal/visual-qa
    label: Visual QA
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions about an image where the answer depends jointly on the question and
      the image.
    examples:
      - ref: vqa
        qualifies: true
        why: >
          Open-ended questions about COCO images, scored by agreement with ten people's answers;
          v2.0 pairs each question with two images whose answers differ, so the question alone
          does not decide.
      - ref: textvqa
        qualifies: true
        why: >
          Questions about photographs answerable only by reading their text; question-only and
          image-only baselines score 8.09% and 6.29%, so neither modality alone carries the score.
      - ref: chartqa
        qualifies: false
        why: >
          NEAR MISS. Every item is visual question answering, but the questions need reading
          charts, which the narrower leaf of the same family takes: `chart-diagram-understanding`.
      - ref: refcoco
        qualifies: false
        why: >
          NEAR MISS. Comprehension can be posed as a question whose answer is a box, but no
          question is asked and the answer is a location, not language, which is
          `visual-grounding`.
    not_to_be_confused_with:
      - term: vision/document-understanding
        distinction: >
          A document-image benchmark posed as questions is this term, with
          document-understanding secondary; document-understanding keeps benchmarks scored on
          extracted structure or content, such as layout and key-value extraction.
      - term: general-intelligence/multi-subject-knowledge-exams
        distinction: >
          A multi-subject exam in which every scored item needs the image, with text-answerable
          items filtered out, is this term. An exam in which images are a minority of the items
          is multi-subject-knowledge-exams, with this term secondary (ADR-0015).
  - id: multimodal/visual-grounding
    label: Visual grounding
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Locating the image region that a language expression refers to.
    examples:
      - ref: refcoco
        qualifies: true
        why: >
          Every item is scored on whether a natural-language expression was bound to the right
          region of a photograph; each image holds two or more objects of the target's category,
          so the label alone does not resolve it.
      - ref: geobench-vlm
        qualifies: true
        why: >
          As a secondary domain: some of its satellite and aerial tasks resolve referring
          expressions to boxes and masks.
      - ref: flickr30k
        qualifies: false
        why: >
          NEAR MISS. Phrase grounding on these images is Flickr30k Entities, a derivative with its
          own boxes and task; Flickr30k's own annotations are whole captions for whole images,
          with no region to localise. It is `cross-modal-retrieval`.
      - ref: r2r
        qualifies: false
        why: >
          NEAR MISS. Framed as a vision-and-language problem, but the score is a navigation
          outcome produced by the agent's moves, which is `robotics-embodiment/navigation`.
  - id: multimodal/chart-diagram-understanding
    label: Chart diagram understanding
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions that require reading structured visual content such as charts, plots
      and diagrams.
    examples:
      - ref: chartqa
        qualifies: true
        why: >
          Natural-language questions about real-world chart images, scored on whether the answer
          matches the gold answer; many questions turn on the chart's marks rather than its
          printed text.
      - ref: docvqa
        qualifies: false
        why: >
          NEAR MISS. Figure questions are one of nine question types, on pages where running text
          dominates; the project's chart and infographic set, InfographicVQA, is not in this
          entry. It is `visual-qa`.
      - ref: textvqa
        qualifies: false
        why: >
          NEAR MISS. Text must be read to answer, but it is scene text in natural images, not the
          labels and marks of charts or diagrams; the paper sets itself against chart and diagram
          datasets.
  - id: multimodal/video-language
    label: Video language
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks pairing video with language in which the correspondence between the two is what is
      scored.
    examples:
      - ref: video-mme
        qualifies: true
        why: >
          Four-option questions answered in language about 900 videos, with questions a model
          could answer from text alone removed, so the score measures correspondence to the video.
      - ref: perception-test
        qualifies: true
        why: >
          Its headline result is multiple-choice video QA, a question and three text options
          answered about a scripted real-world video and its audio.
      - ref: kinetics
        qualifies: false
        why: >
          NEAR MISS. No question, caption or description is scored against the video; predicted
          class labels are compared with the one ground-truth label, which is
          `vision/video-understanding`.
      - ref: videogamebench
        qualifies: false
        why: >
          NEAR MISS. Success needs reading game frames and answering with actions in language, but
          the score is game progress, not a correspondence between frames and language; it is
          `games-planning/video-games`.
    not_to_be_confused_with:
      - term: vision/video-understanding
        distinction: >
          Question answering about a video is this term even when the benchmark calls itself
          video understanding; vision/video-understanding keeps benchmarks scored on labels or
          temporal segments with no language to correspond to.
  - id: multimodal/audio-language
    label: Audio language
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks pairing audio with language in which the correspondence between the two is what is
      scored.
    examples:
      - ref: mmau
        qualifies: true
        why: >
          Each item pairs an audio clip with a question and text options, scored on the option
          chosen; the paper checks listening by replacing the audio with noise.
      - ref: iwslt
        qualifies: true
        why: >
          As a secondary domain: the instruction-following track scores question answering and
          summarisation over speech.
      - ref: musiccaps
        qualifies: false
        why: >
          NEAR MISS. The correspondence between caption and music is scored, but on music the
          system generated, which is `any-to-any-generation`.
      - ref: open-asr-leaderboard
        qualifies: false
        why: >
          NEAR MISS. The score is transcription error against a reference transcript, recovering
          language from the signal rather than a correspondence between two modalities; it is
          `audio-speech/speech-recognition`.
  - id: multimodal/any-to-any-generation
    label: Any to any generation
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Generating output in one modality from input in another, scored on whether the output
      corresponds to the input.
    examples:
      - ref: geneval
        qualifies: true
        why: >
          Images generated from 553 text prompts are checked by a detector for the objects,
          counts, colours and positions the prompt names; no score is computed on the image alone.
      - ref: vbench
        qualifies: true
        why: >
          As a secondary domain: nine prompt-consistency dimensions score generated video against
          its text condition, beside the video-quality dimensions that make it
          `vision/video-generation`.
      - ref: iam-handwriting
        qualifies: false
        why: >
          NEAR MISS. Text is produced from an image, but a transcription is scored on reproducing
          the characters written in it, not on describing the image; the text is the visual
          content, which is `vision/ocr-handwriting`.
      - ref: geobench-vlm
        qualifies: false
        why: >
          NEAR MISS. Image captioning scored by BERTScore is one of its 31 sub-tasks, not the
          benchmark's claim, which is `earth-climate/remote-sensing`.
    not_to_be_confused_with:
      - term: vision/video-generation
        distinction: >
          A text-to-video benchmark that scores prompt adherence on some dimensions and the video
          alone on others goes by its headline claim: prompt adherence is this term, fidelity of
          the video is vision/video-generation, and the other is secondary.
  - id: multimodal/cross-modal-retrieval
    label: Cross modal retrieval
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Retrieving items in one modality using a query expressed in another.
    examples:
      - ref: flickr30k
        qualifies: true
        why: >
          A caption or an image queries a gallery in the other modality, and Recall@K counts
          whether the truly corresponding item ranks in the top K.
      - ref: dcase
        qualifies: true
        why: >
          As a secondary domain: 2026 Task 6 retrieves the moments of long audio recordings that
          align with a textual query.
      - ref: refcoco
        qualifies: false
        why: >
          NEAR MISS. A language expression picks out its referent, but inside the one photograph
          given, scored as a box; nothing is ranked from a gallery in another modality, which is
          `visual-grounding`.

  # -------------------------------------------------------------- reasoning-general
  - id: reasoning-general
    label: General reasoning
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a reasoning competence studied in its own right, independent
      of any application domain.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own literature treats the reasoning form --
      deduction, causality, planning, theory of mind -- as the object of study.
    exclusion_test: >
      Do NOT tag this if the reasoning is applied to a field that has its own family, and do NOT
      tag it where breadth across many subjects is the point, or where the benchmark's own claim
      is general or fluid intelligence on tasks built so that prior knowledge does not help,
      both of which are `general-intelligence`.
    examples:
      - ref: planbench
        qualifies: true
        why: >
          Plan construction studied as its own subject, in a deliberately content-free action
          model.
      - ref: gpqa-diamond
        qualifies: false
        why: >
          NEAR MISS. Demands hard reasoning, but over graduate-level domain content, and the
          benchmark's claim is about knowledge breadth.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: reasoning-general/commonsense
    label: Commonsense
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Questions that require everyday knowledge not stated anywhere in the prompt.
    examples:
      - ref: commonsenseqa
        qualifies: true
        why: >
          Five-choice questions written around ConceptNet concepts so that answering needs
          everyday knowledge the prompt does not supply.
      - ref: hellaswag
        qualifies: true
        why: >
          The context does not say what happens next; the plausible ending is the one that fits
          everyday knowledge of how events and how-to steps unfold.
      - ref: boolq
        qualifies: false
        why: >
          NEAR MISS. The questions need inference beyond paraphrase, but the answer is in or
          implied by the supplied passage and the paper frames the set as reading comprehension,
          which is `language/understanding`.
      - ref: cladder
        qualifies: false
        why: >
          NEAR MISS. Its commonsensical stories come from causal-inference textbooks, but
          everything a question needs is stated in it, and the anti-commonsensical and nonsensical
          variants are built so that everyday knowledge does not help.
  - id: reasoning-general/logical-deduction
    label: Logical deduction
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Deriving conclusions that follow necessarily from stated premises.
    examples:
      - ref: folio
        qualifies: true
        why: >
          Expert-written premise sets with first-order-logic annotations: decide whether a
          conclusion follows from the premises, checked by a first-order prover.
      - ref: big-bench-hard
        qualifies: true
        why: >
          Its largest task group (Boolean Expressions, Logical Deduction, Web of Lies, Formal
          Fallacies) asks for answers that follow from the item's stated premises alone.
      - ref: cruxeval
        qualifies: false
        why: >
          NEAR MISS. Tracing a program is deduction, but the reasoning is applied to code, a field
          with its own family, which is `code/code-understanding`.
      - ref: cladder
        qualifies: false
        why: >
          NEAR MISS. The answers follow necessarily from the stated graph and probabilities, but
          the reasoning form the paper studies is causal inference, which has its own leaf,
          `causal-inference`.
  - id: reasoning-general/causal-inference
    label: Causal inference
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Distinguishing causal from merely associational relationships, or reasoning about
      interventions.
    examples:
      - ref: cladder
        qualifies: true
        why: >
          Yes/no questions about causal graphs across the three rungs of the causal ladder, where
          the association and intervention questions ask the system to tell causal effects from
          correlation.
      - ref: counterbench
        qualifies: true
        why: >
          As a secondary domain: its backdoor queries, 200 of V2's 1,200, ask the model to tell a
          causal effect from a spurious association through a confounder.
      - ref: forecastbench
        qualifies: false
        why: >
          NEAR MISS. The questions ask whether events occur, not what causes them or what an
          intervention would do, which is `society-econ-law/forecasting-prediction-markets`.
  - id: reasoning-general/abstraction-induction
    label: Abstraction induction
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring a general rule from instances and then stating or applying it.
    examples:
      - ref: list-functions
        qualifies: true
        why: >
          Each item withholds a list-to-list rule and gives instances of it; the scored act is
          inferring the rule and applying it to a new list.
      - ref: arc-agi-2
        qualifies: true
        why: >
          As a secondary domain: each task shows a few demonstrations of an unstated grid rule to
          apply to new inputs, while its claim of fluid intelligence makes
          `general-intelligence/abstraction-generalization` primary.
      - ref: enigmaeval
        qualifies: false
        why: >
          NEAR MISS. Solving a puzzle means discovering its hidden mechanism, but each puzzle is
          one posed problem answered once, with no set of instances from which a general rule is
          inferred and applied, which is `puzzle-solving`.
    not_to_be_confused_with:
      - term: general-intelligence/abstraction-generalization
        distinction: >
          If the benchmark's own claim is general or fluid intelligence rather than rule
          induction as a reasoning form, it is general-intelligence/abstraction-generalization,
          as ARC-AGI-2 is.
  - id: reasoning-general/temporal-reasoning
    label: Temporal reasoning
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Reasoning about time, order, duration and their interaction.
    examples:
      - ref: test-of-time
        qualifies: true
        why: >
          Synthetic questions on the order, overlap and length of time intervals over anonymised
          fact graphs, and time-arithmetic problems; temporal reasoning is the paper's object of
          study.
      - ref: big-bench-hard
        qualifies: true
        why: >
          As a secondary domain: its Date Understanding and Temporal Sequences tasks carry this
          leaf as per-task overrides.
      - ref: mmau
        qualifies: false
        why: >
          NEAR MISS. Temporal event reasoning is one of its 27 skills, not the benchmark's claim,
          and no temporal subset is scored on its own on the leaderboards; it is
          `multimodal/audio-language`.
  - id: reasoning-general/spatial-reasoning
    label: Spatial reasoning
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Reasoning about spatial relationships presented textually or diagrammatically.
    examples:
      - ref: spatialviz-bench
        qualifies: true
        why: >
          Generated diagram puzzles of mental rotation, folding, penetration and animation, built
          to study spatial visualization as an ability in its own right.
      - ref: big-bench-hard
        qualifies: true
        why: >
          As a secondary domain: its Navigate and Geometric Shapes tasks carry this leaf as
          per-task overrides.
      - ref: mapeval
        qualifies: false
        why: >
          NEAR MISS. The definition fits, but the reasoning is applied to geography, a field with
          its own family, and homographs.yaml places geographic spatial reasoning in
          `earth-climate/geospatial-reasoning`.
      - ref: arc-agi-2
        qualifies: false
        why: >
          NEAR MISS. Geometry and topology are among the Core Knowledge priors its tasks assume,
          but no ARC-AGI-2 source claims spatial reasoning as what is measured.
  - id: reasoning-general/planning
    label: Planning
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Constructing a sequence of actions that achieves a stated goal, where plan construction is
      itself the object of study.
    examples:
      - ref: planbench
        qualifies: true
        why: >
          Plans for IPC domains such as Blocksworld and Logistics, whose action model is stated in
          the prompt, checked by VAL; plan construction is the benchmark's subject.
      - ref: kaggle-game-arena
        qualifies: true
        why: >
          As a secondary domain: language models play chess against each other, and the report
          names planning as the game's primary demand.
      - ref: ale-bench
        qualifies: false
        why: >
          NEAR MISS. Some problems are planning problems that ask for action sequences, but the
          benchmark studies algorithm engineering, not plan construction as its own subject; it is
          `code/competitive-programming`.
  - id: reasoning-general/theory-of-mind
    label: Theory of mind
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Reasoning about the beliefs, intentions or knowledge of other agents.
    examples:
      - ref: fantom
        qualifies: true
        why: >
          Conversations that characters leave and rejoin, with questions about what each character
          believes or knows, scored for consistency across question types.
      - ref: textarena
        qualifies: true
        why: >
          As a secondary domain: the paper names theory of mind first among the skills its text
          games test.
      - ref: situational-awareness-dataset
        qualifies: false
        why: >
          NEAR MISS. The nearest leaf outside its own family, but this term concerns modelling
          other agents' minds, and the benchmark's subject is the model's knowledge of itself,
          which is `safety-alignment/evaluation-awareness`.
  - id: reasoning-general/counterfactual
    label: Counterfactual
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Reasoning about what would have happened under a different antecedent.
    examples:
      - ref: counterbench
        qualifies: true
        why: >
          Yes/no questions on what an outcome would have been under a changed antecedent in a
          stated causal model, with nonsense variable names; every query type is counterfactual.
      - ref: cladder
        qualifies: true
        why: >
          As a secondary domain: its rung-3 questions, 3,792 of v1.5's 10,112, reason about what
          would have happened had the treatment been different.
      - ref: forecastbench
        qualifies: false
        why: >
          NEAR MISS. Its questions ask what will happen, and each forecast is scored against how
          the event actually resolves; no antecedent is changed, which is
          `society-econ-law/forecasting-prediction-markets`.
  - id: reasoning-general/puzzle-solving
    label: Puzzle solving
    parent: reasoning-general
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving a posed problem by submitting an answer, rather than by acting in an episode.
    examples:
      - ref: enigmaeval
        qualifies: true
        why: >
          Puzzle-hunt puzzles, each answered once with a word or phrase and no environment
          responding; the claim is creative, lateral reasoning on unstructured puzzles.
      - ref: textarena
        qualifies: false
        why: >
          NEAR MISS. Its single-player puzzles (Sudoku, Wordle, Mastermind) are played as episodes
          in which the environment answers each move, which the exclusion test's protocol rule
          sends to `games-planning/puzzle-games`.
      - ref: spatialviz-bench
        qualifies: false
        why: >
          NEAR MISS. Each item is a posed problem with a submitted answer, but what all twelve
          tasks turn on is a spatial transformation, which has its own leaf, `spatial-reasoning`.
    not_to_be_confused_with:
      - term: games-planning/puzzle-games
        distinction: >
          The discriminant is the protocol, not the topic. A posed problem with a submitted
          answer is reasoning-general/puzzle-solving; an interactive episode against a
          responding environment is games-planning/puzzle-games. 02 S3 renamed the latter from
          `puzzle-solving` for exactly this reason -- the slug sat under both families and split
          one coverage row into two thin ones.


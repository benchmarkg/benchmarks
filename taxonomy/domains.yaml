# taxonomy/domains.yaml
#
# Facet 1 of 8, the navigational spine. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: domain
facet_kind: navigational
version: 0.9.0
updated: 2026-09-28
description: >
  The navigational spine. Two levels, `family/subdomain`: a benchmark carries exactly one
  primary domain and any number of secondary domains. A bare family is a navigational node
  and is never assignable to `domain.primary` or `domain.secondary[]`. Crossed with the
  capability-group rollup, this facet supplies the rows of the coverage matrix.

terms:
  # -------------------------------------------------------------- biology-genetics
  - id: biology-genetics
    label: Biology and genetics
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a biological molecule, system or signal.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity concerns proteins, nucleic acids, cells,
      organisms or neural activity.
    exclusion_test: >
      Do NOT tag this if a small molecule is scored for its own properties (ADMET, reactivity,
      synthesis), or nominated compounds are scored by what a wet-lab assay returns, which is
      `chemistry-materials`, and do NOT tag it where the endpoint is a clinical outcome, which is
      `medicine-health`. A small molecule scored for how it binds a protein, as a bound pose or a
      predicted affinity, stays here: the protein makes it biology, even for a drug candidate.
    examples:
      - ref: casp16
        qualifies: true
        why: >
          Protein and nucleic-acid structure prediction, assessed across dozens of groups.
      - ref: proteingym
        qualifies: true
        why: >
          Deep mutational scanning assays scored by rank correlation.
      - ref: virtual-cell-challenge-2026
        qualifies: true
        why: >
          Zero-shot perturbation response in unseen cell lines.
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Biomedical throughout, but the endpoint is clinical conversation quality,
          which is `medicine-health`.
    not_to_be_confused_with:
      - term: chemistry-materials
        distinction: >
          Both families claim a protein-small-molecule complex. The scored quantity decides: a
          bound pose or a binding affinity is biology-genetics; the molecule's own properties, or
          compounds nominated and then assayed, are chemistry-materials.
    seed_target: 25
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: biology-genetics/protein-structure-prediction
    label: Protein structure prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the three-dimensional structure of a protein from its sequence, scored against
      an experimentally determined structure.
    examples: []
  - id: biology-genetics/nucleic-acid-structure
    label: Nucleic acid structure
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the folded structure of an RNA or DNA molecule, scored against an
      experimentally determined structure.
    examples: []
  - id: biology-genetics/protein-function-prediction
    label: Protein function prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Assigning functional annotations to a protein sequence, scored against curated function
      terms.
    examples: []
  - id: biology-genetics/protein-fitness-prediction
    label: Protein fitness prediction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting how a mutation changes a protein's measured activity, stability or binding
      affinity.
    examples: []
  - id: biology-genetics/protein-design
    label: Protein design
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Generating novel protein sequences intended to satisfy a structural or functional
      specification.
    examples: []
  - id: biology-genetics/protein-protein-interaction
    label: Protein protein interaction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting whether two proteins bind and what the bound complex looks like.
    examples: []
  - id: biology-genetics/protein-ligand-cofolding
    label: Protein ligand cofolding
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting the bound structure of a protein and a small molecule, either jointly or by
      placing the ligand into a given protein structure.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is the pose of a small molecule bound to a
      protein, whether the protein is predicted with it (co-folding) or given (re-docking), and
      whatever the method. The entry stays in biology-genetics even where the corpus files it
      under chemistry-materials, because the pose is a property of the protein complex.
    exclusion_test: >
      Do NOT tag this if nominated compounds are scored by what an assay returns
      (`chemistry-materials/experimental-hit-finding`), if only binding strength is predicted
      with no structure (`drug-target-interaction`), or if the partner is another protein
      (`protein-protein-interaction`) or a nucleic acid (`nucleic-acid-structure`).
    examples:
      - ref: runs-n-poses
        qualifies: true
        why: >
          Co-folding predictions for 2,073 protein-ligand systems, scored for pose success
          against the deposited structures.
      - ref: posebusters
        qualifies: true
        why: >
          Re-docks each cognate ligand into its receptor's crystal structure and scores the pose;
          docking with the protein given is inside this term.
      - ref: cache-challenges
        qualifies: false
        why: >
          NEAR MISS. Small molecules against a protein target, but they are scored by what the
          binding assay returns, which is `chemistry-materials/experimental-hit-finding`.
    not_to_be_confused_with:
      - term: chemistry-materials
        distinction: >
          A small molecule scored for its bound pose is here; chemistry-materials takes the
          molecule's own properties and assay-scored hit-finding. Both family exclusion tests
          draw this line, so it does not rest on where the subdomain happens to sit.
  - id: biology-genetics/genomics-variant-effect

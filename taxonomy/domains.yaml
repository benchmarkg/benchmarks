    source: own
    definition: >
      Answering medical questions that have a determinate correct answer.
    examples: []
  - id: medicine-health/clinical-dialogue
    label: Clinical dialogue
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Conducting a multi-turn clinical conversation, scored on the conduct of the exchange
      rather than on a single reply.
    examples: []
  - id: medicine-health/diagnosis-triage
    label: Diagnosis triage
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a diagnosis or an urgency assessment from a presented case.
    examples: []
  - id: medicine-health/medical-imaging-diagnostic
    label: Medical imaging diagnostic
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Detecting clinical findings in, or reaching a diagnostic conclusion from, medical images,
      scored against a clinical reference standard.
    inclusion_test: >
      Tag this as PRIMARY if the system detects findings (nodules, metastases, lesions) or
      assigns a diagnosis or stage from medical images, and a reference standard set by
      clinicians scores it, whatever the metric (FROC, AUC, kappa).
    exclusion_test: >
      Do NOT tag this if regions are delineated and scored as masks
      (`medical-imaging-segmentation`), if the output is a free-text report
      (`radiology-report-generation`), or if the benchmark's claim is a vision method that uses
      medical images as its test domain (`vision/medical-imaging-cv`).
    examples:
      - ref: camelyon17
        qualifies: true
        why: >
          Metastasis detection in lymph-node slides, scored as a patient-level pN stage against a
          pathologist-supervised reference.
      - ref: luna16
        qualifies: true
        why: >
          Pulmonary nodule detection in chest CT, scored by FROC against nodules marked by
          radiologists. A nodule is a finding rather than a diagnosis, and findings are inside
          this term.
      - ref: rexrank
        qualifies: false
        why: >
          NEAR MISS. Chest X-ray interpretation, but the output is a written report, which is
          `radiology-report-generation`.
    not_to_be_confused_with:
      - term: vision/medical-imaging-cv
        distinction: >
          Same rule from the clinical side: the claim decides, not the metric. A clinical task
          against a clinician reference standard is this term even when scored by a vision
          metric; it is a vision benchmark only when its claim is the method.
  - id: medicine-health/medical-imaging-segmentation
    label: Medical imaging segmentation
    parent: medicine-health
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Delineating anatomical or pathological regions in medical images.
    inclusion_test: >
      Tag this as PRIMARY if the system delineates clinically defined anatomical or
      pathological regions in medical images and is scored as masks (Dice, surface distance)
      against clinician reference annotations. Dice is a vision metric, and it does not move
      the benchmark to `vision`.
    exclusion_test: >
      Do NOT tag this if findings are scored as locations or labels rather than masks
      (`medical-imaging-diagnostic`), or if the benchmark's claim is a segmentation method that
      uses medical images as its test domain (`vision/medical-imaging-cv`).
    examples:
      - ref: brats-2026-cluster
        qualifies: true
        why: >
          Tumour sub-region masks in brain MRI against expert annotations; the metric is Dice,
          but the structures and the reference standard are clinical.
      - ref: luna16
        qualifies: false
        why: >
          NEAR MISS. Clinical CT with a radiologist reference standard, but nodules are scored as
          points by FROC, not delineated, which is `medical-imaging-diagnostic`.
    not_to_be_confused_with:
      - term: vision/segmentation
        distinction: >
          Kept separate because the clinical structures, the annotation protocol and the
          evaluation metrics are medical rather than general-purpose, not because the operation
          differs.
      - term: vision/medical-imaging-cv
        distinction: >
          Both name segmentation of medical images. Clinically defined structures against
          clinician annotations are this term; vision/medical-imaging-cv takes a benchmark only
          when its claim is the method.

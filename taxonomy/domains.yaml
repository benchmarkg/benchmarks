  # -------------------------------------------------------------- earth-climate
  - id: earth-climate
    label: Earth and climate
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is the Earth system or a process within it.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is weather, climate, land surface, hazard,
      ecology or energy in a geophysical setting.
    exclusion_test: >
      Do NOT tag this if the subject is a generic vision task that happens to use satellite
      imagery, and do NOT tag it where the physical process is studied outside an Earth-system
      context, which is `physics`. A vision task is generic when the benchmark's claim is the
      vision method and its labels are objects that merely appear in overhead imagery
      (buildings, vehicles, animals). Where the labels are Earth-system quantities (land cover,
      surface water, crops, biomass, ice), or the benchmark presents itself as Earth
      observation, this family is primary and the vision task subdomain is secondary, however
      standard the vision task.
    examples:
      - ref: weatherbench-2
        qualifies: true
        why: >
          Forecast skill against operational analysis; the subject is the atmosphere.
      - ref: geo-bench-2
        qualifies: true
        why: >
          Geospatial tasks over held-out regions and sensors.
      - ref: smart-buildings-challenge
        qualifies: true
        why: >
          Building energy optimisation as a real-world control task.
      - ref: open-catalyst
        qualifies: false
        why: >
          NEAR MISS. Energy-relevant and physically grounded, but the subject is catalyst
          chemistry rather than an Earth-system process.
    seed_target: 18
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: earth-climate/weather-forecasting
    label: Weather forecasting
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting atmospheric state at a stated lead time, scored against observed weather.
    inclusion_test: >
      Tag this as PRIMARY if forecasts of the atmosphere, or of the coupled Earth system, are
      issued from initial conditions at stated lead times up to the subseasonal-to-seasonal
      range and scored against observations or reanalysis. Record the lead-time range in the
      entry, not in the domain.
    exclusion_test: >
      Do NOT tag this if the horizon is multi-year or longer under stated emissions or forcing
      scenarios (`climate-projection`), or if weather variables are only predictors for another
      target, such as crop yield (`agriculture`).
    examples:
      - ref: weatherbench-2
        qualifies: true
        why: >
          Medium-range global forecasts scored against operational analysis.
      - ref: chaosbench
        qualifies: true
        why: >
          Forecasts at 1 to 44 days, the subseasonal-to-seasonal range, including ocean, sea-ice
          and land targets, with no forcing scenarios.
      - ref: cy-bench
        qualifies: false
        why: >
          NEAR MISS. Weather series are among its predictors and it forecasts ahead of harvest,
          but the scored target is crop yield, which is `agriculture`.
    not_to_be_confused_with:
      - term: earth-climate/climate-projection
        distinction: >
          Initial conditions and a lead time make a forecast; forcing scenarios over long
          horizons make a projection. Subseasonal-to-seasonal prediction has no scenarios, so it
          is forecasting.
  - id: earth-climate/climate-projection
    label: Climate projection
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Projecting climate variables over long horizons under stated emissions or forcing
      scenarios.
    examples: []
  - id: earth-climate/remote-sensing
    label: Remote sensing
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Extracting land, ocean or atmospheric information from satellite or airborne imagery.
    inclusion_test: >
      Tag this as PRIMARY if a model extracts information from satellite or airborne imagery
      and either the labels are Earth-system quantities (land cover, surface water, crops,
      biomass, ice) or the benchmark presents itself as Earth observation; record the vision
      task (segmentation, classification, detection) as secondary. Mapping a hazard already
      visible in the image, such as flood extent, is this term, not `hazard-prediction`.
    exclusion_test: >
      Do NOT tag this if the imagery is only a predictor for another Earth-system target, such
      as crop yield (`agriculture`), if the task forecasts an event before it happens
      (`hazard-prediction`), or if the benchmark's claim is a vision method and its labels are
      generic objects seen from above (`vision`).
    examples:
      - ref: geo-bench-2
        qualifies: true
        why: >
          Geospatial foundation models on 19 Earth-observation datasets. Some labels are generic
          objects (buildings, cattle), but the benchmark presents itself as Earth observation,
          and the vision tasks go to secondary.
      - ref: sen1floods11
        qualifies: true
        why: >
          Surface water segmented in Sentinel-1 SAR chips; the operation is generic
          segmentation, but the label is a land-surface state.
      - ref: cy-bench
        qualifies: false
        why: >
          NEAR MISS. Remote-sensing predictors feed it, but the scored target is crop yield,
          which is `agriculture`.
    not_to_be_confused_with:
      - term: vision/segmentation
        distinction: >
          Per-pixel labels of an Earth-system quantity on overhead imagery are this term, with
          segmentation secondary, although the operation and the metric are generic.
  - id: earth-climate/geospatial-reasoning
    label: Geospatial reasoning
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions that require reasoning over geographic location and spatial
      relationships.
    examples: []
  - id: earth-climate/hazard-prediction
    label: Hazard prediction
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting natural hazards such as floods, wildfires, landslides or earthquakes.
    examples: []
  - id: earth-climate/ecology-biodiversity
    label: Ecology biodiversity
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Identifying species, or measuring or predicting their distribution and abundance, or the
      condition of an ecosystem.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is biodiversity or ecosystem monitoring,
      whatever modality its tasks use (images, sound, text); record the method subdomains
      (`vision/classification`, `audio-speech/bioacoustics`, `language/information-extraction`)
      as secondary.
    exclusion_test: >
      Do NOT tag this as primary if the benchmark is one method task whose claim is that method,
      such as species calls in soundscapes scored as an audio task (`audio-speech/bioacoustics`,
      with this term secondary), or if the target is agricultural output (`agriculture`).
    examples:
      - ref: lifeclef-2026
        qualifies: true
        why: >
          Five biodiversity challenges across images, soundscapes and web text under one claim,
          biodiversity informatics; each task scores identification.
      - ref: cy-bench
        qualifies: false
        why: >
          NEAR MISS. Land and crop monitoring over many regions, but the target is crop yield,
          which is `agriculture`.
    not_to_be_confused_with:
      - term: audio-speech/bioacoustics
        distinction: >
          A single species-call task scored as audio is bioacoustics, with this term secondary; a
          multi-modality suite whose claim is biodiversity is this term, with bioacoustics
          secondary.
  - id: earth-climate/agriculture
    label: Agriculture
    parent: earth-climate
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting agricultural outcomes such as crop yield, disease incidence or soil condition.
    examples: []
  - id: earth-climate/energy-systems
    label: Energy systems
    parent: earth-climate
    status: proposed

  - id: games-planning/multi-game-suites
    label: Multi-game suites
    parent: games-planning
    status: proposed
    introduced_in: 1.0.0
    source: own
    # ADR-0016: a suite row of the coverage matrix counts suites, not task coverage. The gap
    # ranking reads a cell here as "is there a suite", never as coverage of the field. Arenas
    # and environment suites share this term; `evaluation_method` (`tournament-play` for an
    # arena) says which, not the domain.
    definition: >
      Suites whose scored tasks span several of the games-planning family's subdomains,
      reported per task or as one aggregate, where the suite's own claim is coverage within
      the family.
    inclusion_test: >
      Tag this as PRIMARY if the tasks span two or more of the games-planning family's
      subdomains, no one subdomain holds most of them, and the benchmark's own claim is breadth
      within the family. Record the subdomains the tasks fall in as secondary.
    exclusion_test: >
      Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and
      the others secondary), or if the suite spans several families, which is
      `general-intelligence`.
    examples:
      - ref: kaggle-game-arena
        qualifies: true
        why: >
          19 boards across board games, imperfect-information card games, social deduction and
          bargaining, played against other entrants.
      - ref: balrog
        qualifies: true
        why: >
          Six RL environments, from BabyAI to NetHack, averaged into one progress score; puzzle
          and open-ended environments each hold only part of it.
      - ref: atari-100k
        qualifies: false
        why: >
          NEAR MISS. Many games in one suite, but every one is an Atari video game, so
          `video-games` holds the whole benchmark.

  # -------------------------------------------------------------- general-intelligence
  - id: general-intelligence
    label: General intelligence
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose claim is about breadth or novelty across many subjects rather than
      competence in one.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is coverage of many fields, or
      acquisition of tasks it was not built for. When the benchmark also passes another
      family's protocol test, such as play in an interactive game environment, the claim
      decides: tag this family primary and record the other family's subdomain as secondary.
    exclusion_test: >
      Do NOT tag this if the benchmark is broad but its claim is about one competence, or if its
      breadth lies inside one family, which takes that family's subdomains (including a suite
      subdomain where ADR-0016 has added one). Do NOT tag it where every scored item needs an
      image and the benchmark's changes concern the image-text relation, which is `multimodal`
      however many subjects it spans (ADR-0015). And do NOT use this family as a home for
      benchmarks that were hard to place.
    examples:
      - ref: arc-agi
        qualifies: true
        why: >
          Novel-task acquisition with deliberately unhelpful surface similarity.
      - ref: mmlu-pro
        qualifies: true
        why: >
          Breadth across fourteen subjects is the entire claim.
      - ref: gpqa-diamond
        qualifies: true
        why: >
          Graduate-level breadth across three sciences with a stated chance baseline.
      - ref: frontiermath
        qualifies: false
        why: >
          NEAR MISS. Extremely hard and widely cited as a frontier measure, but its claim is
          mathematical competence specifically.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: general-intelligence/abstraction-generalization
    label: Abstraction generalization
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Inferring an abstract rule from a handful of examples and applying it to new cases.
    inclusion_test: >
      Tag this as PRIMARY if each item gives a few demonstrations of an unstated rule, the
      system must apply the rule to new inputs, and the benchmark's own claim is general or
      fluid intelligence, on tasks built so that prior task-specific knowledge does not help.
    exclusion_test: >
      Do NOT tag this if rule induction is studied as a reasoning form in its own right
      (`reasoning-general/abstraction-induction`), or if the system must discover the task and
      its goal by acting in an environment that responds (`novel-task-acquisition`).
    examples:
      - ref: arc-agi-2
        qualifies: true
        why: >
          Infer the rule from a few grid examples and apply it to unseen test grids; the claim
          is general fluid intelligence.
      - ref: arc-agi-3
        qualifies: false
        why: >
          NEAR MISS. Same series and claim, but the agent must learn interactive environments
          whose goals it is never told, which is `novel-task-acquisition`.
    not_to_be_confused_with:
      - term: reasoning-general/abstraction-induction
        distinction: >
          Both infer a rule from instances. The claim separates them: general or fluid
          intelligence, on tasks built to defeat prior knowledge, is this term; rule induction
          studied as a reasoning form is abstraction-induction. ARC-AGI-2 meets both definitions
          and takes this one.
  - id: general-intelligence/novel-task-acquisition
    label: Novel task acquisition
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Learning to perform a task the system has never seen, within the evaluation episode
      itself.
    examples: []
    not_to_be_confused_with:
      - term: games-planning/puzzle-games
        distinction: >
          An interactive puzzle environment passes both families' tests. The claim decides:
          acquiring unseen tasks is this term, with the game subdomain secondary (02 S12.7).
  - id: general-intelligence/human-comparison-batteries
    label: Human comparison batteries
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Broad batteries built specifically to compare system performance against measured human
      performance.
    examples: []
  - id: general-intelligence/multi-subject-knowledge-exams
    label: Multi-subject knowledge exams
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Closed-ended question sets drawn from exams, textbooks or expert-written questions across
      many academic subjects, scored on the answers alone.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is breadth of subject knowledge or
      expertise, its items are closed-ended questions, and no single subject holds most of them.
    exclusion_test: >
      Do NOT tag this if one subject holds most of the items (that subject's family is primary),
      if measured human performance is the benchmark's purpose (`human-comparison-batteries`),
      or if the headline number aggregates heterogeneous task formats (`agi-composite-suites`).
    examples:
      - ref: mmlu-pro
        qualifies: true
        why: >
          Ten-option questions across 14 subjects; breadth is the whole claim.
      - ref: humanity-s-last-exam
        qualifies: true
        why: >
          Closed-ended questions across over a hundred subjects, with no human solve rate.
      - ref: helm-capabilities
        qualifies: false
        why: >
          NEAR MISS. Includes MMLU-Pro and GPQA, but aggregates five heterogeneous scenarios into
          one mean; that is `agi-composite-suites`.
  - id: general-intelligence/meta-learning
    label: Meta learning
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring how quickly a system improves across a distribution of related tasks.
    examples: []
  - id: general-intelligence/open-ended-discovery
    label: Open ended discovery
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system produces genuinely novel artifacts or findings rather than
      solving posed problems.
    examples: []
  - id: general-intelligence/compositional-generalization
    label: Compositional generalization
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recombining known primitives in configurations not present in training.
    examples: []
    not_to_be_confused_with:
      - term: reasoning-general/abstraction-induction
        distinction: >
          Compositional generalisation tests recombination of primitives the system already has.
          Abstraction induction tests inferring a rule that was never given. The first is about
          coverage of a combinatorial space, the second about arriving at the rule.
  - id: general-intelligence/agi-composite-suites
    label: AGI composite suites
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Composite suites that aggregate many heterogeneous tasks into a single general-capability
      score.
    examples: []
  - id: general-intelligence/open-preference-arenas
    label: Open preference arenas
    parent: general-intelligence
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Open platforms where people submit their own prompts and choose between anonymised system
      outputs, and systems are ranked by a rating model over the votes, across many uses.
    inclusion_test: >
      Tag this as PRIMARY if prompts come from the public rather than a fixed item set, the score
      is a rating fitted to human pairwise votes, and the arena's own claim is general
      usefulness across many uses or modalities.
    exclusion_test: >
      Do NOT tag this if the arena is confined to one field or task (a robotics, coding or
      text-to-speech arena takes that field's subdomain, as RoboArena does), or if the judges are
      a model rather than people (`model-graded-judge` on the arena's own domain).
    examples:
      - ref: lmarena
        qualifies: true
        why: >
          Public prompts, anonymous pairwise votes and ratings across text, vision and
          generation arenas.
      - ref: roboarena
        qualifies: false
        why: >
          NEAR MISS. Pairwise human preference over rollouts, but confined to robot
          manipulation.

  # -------------------------------------------------------------- mathematics
  - id: mathematics
    label: Mathematics
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose scored quantity is a mathematical result, proof or derivation.
    inclusion_test: >
      Tag this as PRIMARY if the answer is checked as mathematics -- a value, an expression or a
      proof.
    exclusion_test: >
      Do NOT tag this if arithmetic is incidental to a question about another field, and do NOT
      tag it where the artifact scored is a program rather than a derivation.
    examples:
      - ref: frontiermath
        qualifies: true
        why: >
          Research-level problems whose answers are checked as mathematics, including a
          Lean-verified track.
      - ref: critpt
        qualifies: false
        why: >
          NEAR MISS. Heavily quantitative, but the problems are physics research challenges and
          the subject is physics.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
  - id: mathematics/arithmetic
    label: Arithmetic
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Computing numerical results, where the difficulty is the calculation rather than the
      modelling.
    examples: []
  - id: mathematics/competition-math
    label: Competition math
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving olympiad-style mathematics problems that have determinate answers.
    examples: []
  - id: mathematics/formal-theorem-proving
    label: Formal theorem proving
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a proof in a formal system that a proof assistant or automated verifier
      accepts.
    inclusion_test: >
      Tag this as PRIMARY if the system must produce a machine-checked proof of a mathematical
      statement, whether the checker is an interactive proof assistant (Lean, Isabelle) or an
      auto-active program verifier (Dafny).
    exclusion_test: >
      Do NOT tag this if the proved property belongs to a program rather than to a mathematical
      statement (`code/program-verification`), if a supplied proof is only judged
      (`proof-verification`), or if answers are checked as values or expressions
      (`competition-math`, `research-level-math`).
    examples:
      - ref: minif2f-minif2f-dafny
        qualifies: true
        why: >
          Olympiad statements proved in Lean, Isabelle and other assistants, and, in the Dafny
          half, by filling lemma bodies that Dafny's verifier accepts; the properties are
          mathematical either way.
      - ref: frontiermath-tiers-erd-s
        qualifies: false
        why: >
          NEAR MISS. Its Erdos track needs verified Lean proofs, recorded as secondary, but Tiers
          1 to 4 check answers as values, which is `research-level-math`.
    not_to_be_confused_with:
      - term: code/program-verification
        distinction: >
          The subject of the proof decides, not the tool. A mathematical statement proved in a
          program verifier is this term; a property of a program is program-verification.
      - term: mathematics/proof-verification
        distinction: >
          If the system is handed a candidate proof and asked whether it holds, it is
          verification.
  - id: mathematics/symbolic-manipulation
    label: Symbolic manipulation
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Transforming mathematical expressions, scored by symbolic equivalence rather than by
      string match.
    examples: []
  - id: mathematics/applied-modeling
    label: Applied modeling
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Formulating a real-world situation as a mathematical model and solving it.
    examples: []
  - id: mathematics/research-level-math
    label: Research level math
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Solving problems at the level of current mathematical research.
    examples: []
  - id: mathematics/proof-verification
    label: Proof verification
    parent: mathematics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Deciding whether a supplied proof is correct, rather than producing one.
    examples: []
    not_to_be_confused_with:
      - term: mathematics/formal-theorem-proving
        distinction: >
          Proving produces the artifact; verification judges one it is given. The second is a
          classification task and its baselines and ceilings are different.

  # -------------------------------------------------------------- multimodal
  - id: multimodal
    label: Multimodal
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose scored quantity is the relation between two or more modalities.
    inclusion_test: >
      Tag this as PRIMARY if success requires crossing between modalities -- answering in
      language about an image, binding an expression to a region, retrieving across modalities,
      or generating in one modality from another such that the correspondence is what is scored.
    exclusion_test: >
      Do NOT tag this if the benchmark is scored wholly inside one modality, which is `vision`
      or `audio-speech`. The boundary is the correspondence: VQA scores whether the answer
      matches the image, whereas image restoration scores the image alone.
    examples:
      - ref: geneval
        qualifies: true
        why: >
          Scores whether a generated image satisfies a compositional text description; the
          image-text correspondence is the measured quantity.
      - ref: coco
        qualifies: false
        why: >
          NEAR MISS. Labels and boxes, but from a fixed category set with no language to
          correspond to.
      - ref: vbench
        qualifies: false
        why: >
          NEAR MISS. Text-prompted video generation, but the sixteen scored dimensions are
          properties of the video, not of its agreement with the prompt.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: multimodal/visual-qa
    label: Visual QA
    parent: multimodal
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Answering questions about an image where the answer depends jointly on the question and
      the image.
    examples: []
    not_to_be_confused_with:
      - term: vision/document-understanding
        distinction: >
          A document-image benchmark posed as questions is this term, with
          document-understanding secondary; document-understanding keeps benchmarks scored on
          extracted structure or content, such as layout and key-value extraction.
      - term: general-intelligence/multi-subject-knowledge-exams
        distinction: >
          A multi-subject exam in which every scored item needs the image, with text-answerable
          items filtered out, is this term. An exam in which images are a minority of the items
          is multi-subject-knowledge-exams, with this term secondary (ADR-0015).
  - id: multimodal/visual-grounding
    label: Visual grounding

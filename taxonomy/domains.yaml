  # -------------------------------------------------------------- vision
  - id: vision
    label: Vision
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose input or output is visual and whose scored quantity is a property of that
      visual signal.
    inclusion_test: >
      Tag this as PRIMARY if the score measures what was recovered from, or produced as, an
      image, video or 3D signal.
    exclusion_test: >
      Do NOT tag this if the scored relation is between a visual signal and language -- a
      question answered about an image, an expression grounded in a scene, a caption retrieved
      for a photo -- which is `multimodal`. A text prompt that merely conditions generation does
      not make a benchmark multimodal; the discriminant is whether crossing between the
      modalities is what is scored. Do NOT tag it as primary either where overhead imagery is
      labelled with Earth-system quantities (`earth-climate/remote-sensing`), or where medical
      images carry clinically defined targets against a clinician reference standard
      (`medicine-health`), although the metric is a vision metric; the vision task subdomain is
      then secondary.
    examples:
      - ref: coco
        qualifies: true
        why: >
          Detection and segmentation scored directly against image content.
      - ref: scannet
        qualifies: true
        why: >
          ScanNet++: novel views scored against held-out DSLR photographs, and 3D semantic and
          instance labels scored on the laser-scan mesh.
      - ref: vbench
        qualifies: true
        why: >
          Generated video scored on sixteen dimensions of the video itself, although a text
          prompt conditioned it.
      - ref: geneval
        qualifies: false
        why: >
          NEAR MISS. Generated images, but the score is whether the image satisfies a
          compositional description, which makes the image-text relation the measured quantity.
    seed_target: 22
    core: false
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: vision/classification
    label: Classification
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Assigning a whole image to one or more categories.
    examples: []
  - id: vision/detection
    label: Detection
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Localising and labelling individual object instances within an image.
    examples: []
  - id: vision/segmentation
    label: Segmentation
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Assigning a category label to every pixel or region of an image.
    examples: []
    not_to_be_confused_with:
      - term: earth-climate/remote-sensing
        distinction: >
          Same operation, different subject. Per-pixel labels of an Earth-system quantity (water,
          land cover, crops, ice) on satellite or airborne imagery are remote sensing, with this
          term secondary; segmentation is primary only when the benchmark's claim is the vision
          method and the labels are generic objects.
      - term: medicine-health/medical-imaging-segmentation
        distinction: >
          Masks of clinically defined structures against clinician reference annotations are
          medical-imaging-segmentation, with this term secondary where it is recorded at all.
  - id: vision/video-understanding
    label: Video understanding
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recognising actions, events or content across the temporal extent of a video.
    examples: []
    not_to_be_confused_with:
      - term: multimodal/video-language
        distinction: >
          A video benchmark posed as question answering scores the answer's correspondence to
          the video, which is video-language (02 S11 rule 12), even when it calls itself video
          understanding. This term holds benchmarks scored on labels or temporal segments with
          no language to correspond to, such as action recognition and temporal localisation.
  - id: vision/3d-reconstruction
    label: 3D reconstruction
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering the three-dimensional geometry of a scene or object from images.
    examples: []
    not_to_be_confused_with:
      - term: vision/multi-view-stereo
        distinction: >
          Multi-view stereo is one method of reconstruction and is kept separate because it is
          benchmarked on its own terms, with calibrated views given. Tag 3d-reconstruction when
          the benchmark scores recovered geometry regardless of how it was obtained.
      - term: vision/novel-view-synthesis
        distinction: >
          Reconstruction is scored on recovered geometry; novel-view synthesis is scored on a
          rendered image. A method can render a convincing new view without recovering usable
          geometry, and the two benchmarks disagree about whether that is success.
  - id: vision/novel-view-synthesis
    label: Novel view synthesis
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Rendering an unobserved viewpoint of a scene from a set of observed views, scored on the
      rendered image.
    examples: []
    not_to_be_confused_with:
      - term: vision/3d-reconstruction
        distinction: >
          The score is an image-quality metric against a held-out photograph, not a geometric
          error against a mesh or point cloud.
  - id: vision/multi-view-stereo
    label: Multi-view stereo
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering dense geometry specifically by matching pixels across multiple calibrated
      views.
    examples: []
  - id: vision/image-matching-correspondence
    label: Image matching correspondence
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Finding corresponding points between two or more images of the same scene.
    examples: []
  - id: vision/image-restoration-enhancement
    label: Image restoration enhancement
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Recovering a degraded image, scored against a reference copy of the undegraded original.
    examples: []
  - id: vision/depth-geometry
    label: Depth geometry
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Estimating per-pixel depth or surface orientation from one or more images.
    examples: []
  - id: vision/driving-perception-3d
    label: 3D driving perception
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Perceiving the three-dimensional road scene from vehicle-mounted sensors.
    examples: []
  - id: vision/image-generation
    label: Image generation
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing an image, scored on properties of the generated image itself.
    examples: []
  - id: vision/video-generation
    label: Video generation
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Producing a video, scored on properties of the generated video itself.
    examples: []
    not_to_be_confused_with:
      - term: multimodal/any-to-any-generation
        distinction: >
          When some scored dimensions check the video against its prompt and others score the
          video alone, the benchmark's headline claim decides: fidelity of the generated video
          is this term, with any-to-any-generation secondary; adherence to the prompt as the
          headline is any-to-any-generation, with this term secondary.
  - id: vision/document-understanding
    label: Document understanding
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Extracting structure and content from document images such as forms, tables and reports.
    examples: []
    not_to_be_confused_with:
      - term: multimodal/visual-qa
        distinction: >
          The format of the item decides, as for any image (02 S11 rule 12). A document-image
          benchmark posed as questions is visual-qa, with this term secondary; this term holds
          document benchmarks scored on the extracted structure or content itself, such as
          layout analysis, key-value extraction and table structure recognition.
  - id: vision/ocr-handwriting
    label: OCR and handwriting
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Transcribing printed or handwritten text in images into character sequences.
    examples: []
  - id: vision/medical-imaging-cv
    label: Medical imaging (computer vision)
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Computer-vision methods evaluated on medical images, where the benchmark's claim is the
      method rather than a clinical task.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is a vision method (robustness,
      pretraining, generalisation across sites or scanners) and medical images are its test
      domain, with no clinical task claimed for the result.
    exclusion_test: >
      Do NOT tag this if the targets are clinically defined (lesions, organs, findings,
      diagnoses) and clinicians set the reference standard, which is `medicine-health` whatever
      the metric. Dice and FROC are vision metrics, so the metric never decides.
    examples:
      - ref: brats-2026-cluster
        qualifies: false
        why: >
          NEAR MISS. Scored by Dice and surface distance, but on clinically defined tumour
          sub-regions against expert masks, which is
          `medicine-health/medical-imaging-segmentation`.
      - ref: luna16
        qualifies: false
        why: >
          NEAR MISS. A false-positive track invites image-classification teams, but the task is
          nodule detection for lung cancer screening against a radiologist reference standard,
          which is `medicine-health/medical-imaging-diagnostic`.
    not_to_be_confused_with:
      - term: medicine-health/medical-imaging-diagnostic
        distinction: >
          The discriminant is the benchmark's claim, not its metric. A clinical task scored
          against a clinical reference standard is medicine-health/medical-imaging-diagnostic
          even when the metric is a vision metric; a vision method tested on medical images is
          vision/medical-imaging-cv.
      - term: medicine-health/medical-imaging-segmentation
        distinction: >
          Masks of clinically defined structures against clinician annotations are
          medical-imaging-segmentation, although Dice is a vision metric; this term takes a
          segmentation benchmark only when its claim is the method.

  # -------------------------------------------------------------- agents-tooluse
  - id: agents-tooluse
    label: Agents and tool use
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a system acting autonomously through tools or interfaces.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is what an autonomous loop achieved using
      tools, APIs, a browser or an operating system, and the grader checks the state it left or
      the result it returned.
    exclusion_test: >
      Do NOT tag this if the environment is a game, which is `games-planning`, and do NOT tag it
      where the grader scores software the agent wrote -- tests run against a patch or program,
      or the performance of a model or analysis it built -- which is `code`, with this family's
      subdomain as secondary. Decide from the benchmark's grading protocol, not task by task:
      when the grader checks a machine's end state (files, services, configuration), this
      family is primary even where some tasks leave a program behind.
    examples:
      - ref: osworld-2-0
        qualifies: true
        why: >
          Dozens of interdependent GUI actions against live application state.
      - ref: tau2-bench
        qualifies: true
        why: >
          Multi-turn tool-and-user interaction scored under a domain policy.
      - ref: terminal-bench
        qualifies: true
        why: >
          Operating a machine to a target state, where harness choice alone moves results
          several points.
      - ref: swe-bench-verified
        qualifies: false
        why: >
          NEAR MISS. Solved almost entirely by agents, but the scored artifact is a patch judged
          by tests, which is `code`.
    not_to_be_confused_with:
      - term: code
        distinction: >
          An agentic harness does not decide the family; the grader does. Tests or a held-out
          score applied to software the agent wrote (a patch, a trained model's predictions) make
          it `code`; a check of the machine or environment state it left makes it
          agents-tooluse.
    seed_target: 20
    core: false
    coverage_status: surveyed
    curation_posture: mixed
    reviewer_signoff: none
  - id: agents-tooluse/web-navigation
    label: Web navigation
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing tasks by browsing and acting on live or recorded web pages.
    examples: []
  - id: agents-tooluse/computer-use-gui
    label: Computer use (GUI)
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing tasks by operating a graphical user interface through synthetic mouse and
      keyboard input.
    inclusion_test: >
      Tag this as PRIMARY if the agent operates desktop applications through a graphical
      interface, observing the screen and acting by mouse and keyboard, and the grader checks
      the resulting application or file state. Episode length does not move it: a long-horizon
      GUI benchmark stays here, with `long-horizon-autonomy` as secondary.
    exclusion_test: >
      Do NOT tag this if the tasks are confined to web sites in a browser (`web-navigation`), or
      if the agent acts through a shell or an API with no graphical interface
      (`operating-system-tasks`, `tool-api-calling`).
    examples:
      - ref: osworld-2-0
        qualifies: true
        why: >
          108 long-horizon workflows operated through screenshots and mouse and keyboard actions;
          the horizon goes to `long-horizon-autonomy` as secondary.
      - ref: webarena
        qualifies: false
        why: >
          NEAR MISS. Long-horizon tasks acted out on rendered pages, but confined to self-hosted
          web sites, which is `web-navigation`.
    not_to_be_confused_with:
      - term: agents-tooluse/long-horizon-autonomy
        distinction: >
          This term names an interface; long-horizon-autonomy names a property of the episode
          that any interface can have. The interface is primary and the horizon secondary.
  - id: agents-tooluse/tool-api-calling
    label: Tool and API calling
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Selecting and invoking external functions or APIs correctly to satisfy a request.
    inclusion_test: >
      Tag this as PRIMARY if a single agent under evaluation is scored on selecting and invoking
      functions or APIs correctly against a backend, including when a simulated user converses
      with it or acts on the shared state with tools of its own.
    exclusion_test: >
      Do NOT tag this if several agents under evaluation must divide work or reach agreement
      (`multi-agent-coordination`), if the calls do clinical work against a health record
      system (`medicine-health/clinical-agent-workflows`), or if the headline is resistance to
      instructions injected into tool outputs (`safety-alignment/prompt-injection`).
    examples:
      - ref: bench
        qualifies: true
        why: >
          tau2-bench: one agent calls domain APIs under a policy while a simulated user acts on
          the same environment; the dual-control setting goes to `multi-agent-coordination` as
          secondary.
      - ref: medagentbench-v2
        qualifies: false
        why: >
          NEAR MISS. API calls against a FHIR record throughout, but the tasks are clinical work,
          which is `medicine-health/clinical-agent-workflows`.
      - ref: agentdojo
        qualifies: false
        why: >
          NEAR MISS. 97 tool-use tasks with a utility score, but the title and the attack
          framework make security against injection the claim, which is
          `safety-alignment/prompt-injection`; this term is secondary.
    not_to_be_confused_with:
      - term: agents-tooluse/multi-agent-coordination
        distinction: >
          A simulated user, even one with tools of its own, is part of the environment.
          Coordination needs several agents under evaluation, or a score that is the
          coordination itself.
      - term: safety-alignment/prompt-injection
        distinction: >
          Utility and attack success reported side by side on the same tool-use tasks go by the
          benchmark's claim: security is prompt-injection, with this term secondary.
  - id: agents-tooluse/multi-agent-coordination
    label: Multi agent coordination
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks that require several agents to divide work, communicate or reach agreement.
    examples: []
    not_to_be_confused_with:
      - term: agents-tooluse/tool-api-calling
        distinction: >
          One agent under evaluation facing a simulated user is tool-api-calling, whatever tools
          the simulated user holds; this term needs the coordination between evaluated agents to
          be what is scored.
  - id: agents-tooluse/long-horizon-autonomy
    label: Long horizon autonomy
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks requiring many dependent steps across an extended episode without human
      intervention.
    examples: []
    not_to_be_confused_with:
      - term: agents-tooluse/computer-use-gui
        distinction: >
          Long horizon is a property of the episode, not an interface or a task. When an
          interface or task subdomain describes the benchmark (GUI, web, shell, ML engineering),
          that subdomain is primary and this term secondary; this term is primary only when none
          does.
  - id: agents-tooluse/research-agents
    label: Research agents
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Agents that gather, synthesise and cite external sources to answer an open research
      question.
    examples: []
  - id: agents-tooluse/software-agents
    label: Software agents
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Agents that complete software engineering work inside a real repository or toolchain.
    inclusion_test: >
      Tag this if an autonomous agent does software-engineering work inside a real repository or
      toolchain, navigating files and running builds and tests itself. Tag it as PRIMARY only
      when the grader checks the toolchain's or environment's end state; when tests judge the
      code the agent wrote, `code` is primary and this term is secondary (02 S12.11).
    exclusion_test: >
      Do NOT tag this if the work is not software engineering -- operating a shell or desktop to
      a target state is `operating-system-tasks` or `computer-use-gui` -- or if the system
      returns code without acting in a repository or toolchain.
    examples:
      - ref: swe-bench-verified
        qualifies: true
        why: >
          SECONDARY. Coding agents resolve real issues inside real repositories, but the patch is
          judged by tests, so `code/repository-scale-se` is primary.
      - ref: terminal-bench-2-0
        qualifies: false
        why: >
          NEAR MISS. Agents work in a shell and some tasks are debugging or security fixes, but
          the tasks range over bringing a container to a target state, which is
          `operating-system-tasks`.
    not_to_be_confused_with:
      - term: code/repository-scale-se
        distinction: >
          Repository-scale SE names the code change; this term names the agent making it. When
          tests judge the patch, repository-scale-se is primary and this term secondary.
  - id: agents-tooluse/negotiation
    label: Negotiation
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks scored on the outcome of a bargaining interaction between parties with conflicting
      objectives.
    examples: []
  - id: agents-tooluse/operating-system-tasks
    label: Operating system tasks
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Completing tasks against a real operating system, filesystem or shell.
    examples: []
  - id: agents-tooluse/cybersecurity-offense-defense
    label: Cybersecurity offense defense
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Tasks scored on finding, exploiting or defending against security vulnerabilities.
    examples: []
  - id: agents-tooluse/agent-evaluation-suites
    label: Agent evaluation suites
    parent: agents-tooluse
    status: proposed
    introduced_in: 1.0.0
    source: own
    # ADR-0016: a suite row of the coverage matrix counts suites, not task coverage. The gap
    # ranking reads a cell here as "is there a suite", never as coverage of the field.
    definition: >
      Suites whose scored tasks span several of the agents-tooluse family's subdomains,
      reported per task or as one aggregate, where the suite's own claim is coverage within
      the family.
    inclusion_test: >
      Tag this as PRIMARY if the tasks span two or more of the agents-tooluse family's
      subdomains, no one subdomain holds most of them, and the benchmark's own claim is breadth
      within the family. Record the subdomains the tasks fall in as secondary.
    exclusion_test: >
      Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and
      the others secondary), or if the suite spans several families, which is
      `general-intelligence`.
    examples:
      - ref: holistic-agent-leaderboard-hal
        qualifies: true
        why: >
          Nine existing agent benchmarks across web navigation, tool calling, research agents
          and coding, on separate boards with no aggregate. Every board scores what an agent
          achieved, so the breadth is inside the family; the coding boards add `code`
          secondaries.
      - ref: webarena
        qualifies: false
        why: >
          NEAR MISS. Several self-hosted sites and task types, but every task is web navigation,
          so `web-navigation` holds the whole benchmark.

  # -------------------------------------------------------------- chemistry-materials
  - id: chemistry-materials
    label: Chemistry and materials
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a molecule, material, reaction or catalyst.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is a property, structure or behaviour of matter
      at the molecular or crystalline scale, whatever method produces it.
    exclusion_test: >
      Do NOT tag this if the subject is a physical process rather than a substance, which is
      `physics`. The family is named for both communities deliberately: method does not decide
      the home, subject does, so a DFT-grounded materials benchmark is chemistry-materials and a
      quantum-simulation benchmark is physics. Do NOT tag it either where a small molecule is
      scored for how it binds a protein, as a bound pose or a predicted affinity, which is
      `biology-genetics` (`protein-ligand-cofolding`, `drug-target-interaction`). Compounds
      nominated and then assayed stay here, in `experimental-hit-finding`, because the
      experiment on the compound is the ground truth.
    examples:
      - ref: matbench-discovery
        qualifies: true
        why: >
          Stability screening over 256k structures; the subject is the material.
      - ref: open-catalyst
        qualifies: true
        why: >
          Catalyst surfaces and adsorption energies, evaluated with physics-derived methods on a
          chemical subject.
      - ref: cache
        qualifies: true
        why: >
          Prospective hit-finding with real binding assays.
      - ref: critpt
        qualifies: false
        why: >
          NEAR MISS. Research-level science, but the subject is physics reasoning rather than
          matter.
      - ref: runs-n-poses
        qualifies: false
        why: >
          NEAR MISS. The corpus files it here and the ligands are drug-like, but the scored
          quantity is the ligand's pose in its protein pocket, which is
          `biology-genetics/protein-ligand-cofolding`.
    not_to_be_confused_with:
      - term: biology-genetics
        distinction: >
          A small molecule scored for how it binds a protein, as a pose or an affinity, is
          biology-genetics even when it is a drug candidate. This family takes the molecule's
          own properties, and compounds nominated and then assayed.
      - term: biology-genetics/protein-ligand-cofolding
        distinction: >
          A protein-small-molecule complex scored as a bound pose is biology-genetics. This
          family takes the molecule's own properties, and compounds nominated and then assayed
          for binding (`experimental-hit-finding`).
    seed_target: 20
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none

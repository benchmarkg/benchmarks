  # -------------------------------------------------------------- medicine-health
  - id: medicine-health
    label: Medicine and health
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is clinical practice or a patient outcome.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity concerns diagnosis, treatment, clinical
      communication or a health endpoint.
    exclusion_test: >
      Do NOT tag this if the subject is biological mechanism without a clinical endpoint, which
      is `biology-genetics`, and do NOT tag it where medical images are used to test general
      vision methods, which is `vision/medical-imaging-cv`. The benchmark's claim decides that
      line, not its metric: where the targets are clinically defined (lesions, organs,
      findings, diagnoses) and clinicians set the reference standard, this family is primary
      even when the metric is Dice or FROC, and the vision subdomain is secondary.
    examples:
      - ref: healthbench
        qualifies: true
        why: >
          5,000 multi-turn clinical conversations against physician-authored rubric criteria.
      - ref: medagentbench-v2
        qualifies: true
        why: >
          Physician-written tasks against a live FHIR record.
      - ref: proteingym
        qualifies: false
        why: >
          NEAR MISS. Deeply biomedical, but the scored quantity is a protein fitness measurement
          with no clinical endpoint.
    seed_target: 20
    core: true
    coverage_status: surveyed
    curation_posture: mixed
    reviewer_signoff: none
  - id: medicine-health/clinical-qa
    label: Clinical QA
    parent: medicine-health

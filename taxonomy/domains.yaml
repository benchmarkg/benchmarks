  # -------------------------------------------------------------- robotics-embodiment
  - id: robotics-embodiment
    label: Robotics and embodiment
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks in which a policy acts through a physical or simulated body.
    inclusion_test: >
      Tag this as PRIMARY if the scored outcome is produced by embodied action -- manipulation,
      locomotion, navigation or driving.
    exclusion_test: >
      Do NOT tag this if the environment is symbolic with no body, and do NOT tag it where a
      physical apparatus is designed rather than operated, which is `engineering-design`.
    examples:
      - ref: humanoidbench
        qualifies: true
        why: >
          Whole-body humanoid control across 27 to 31 tasks with dexterous hands.
      - ref: libero
        qualifies: true
        why: >
          130 language-conditioned manipulation tasks, entirely in simulation.
      - ref: mujoco-gymnasium
        qualifies: false
        why: >
          NEAR MISS. Simulated bodies, but the benchmark's community and claim are about control
          algorithms in the abstract, which is why continuous-control sits here only when the
          embodiment is the point.
    seed_target: 25
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
  - id: robotics-embodiment/manipulation
    label: Manipulation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Controlling a robot arm or gripper to change the physical state of objects.
    examples: []
  - id: robotics-embodiment/dexterous-manipulation
    label: Dexterous manipulation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Manipulation whose difficulty is fine high-degree-of-freedom control, such as in-hand
      reorientation or precise insertion.
    examples: []
    not_to_be_confused_with:
      - term: robotics-embodiment/manipulation
        distinction: >
          Tag dexterous only where the difficulty is the degrees of freedom -- in-hand
          reorientation, fine insertion. Pick-and-place with a parallel gripper is manipulation
          however hard the scene is.
  - id: robotics-embodiment/bimanual-manipulation
    label: Bimanual manipulation
    parent: robotics-embodiment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Manipulation benchmarks built around two coordinated arms, on tasks designed for a
      dual-arm embodiment.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is coordinated two-arm manipulation and
      its tasks are specified and scored on dual-arm embodiments. Decide for the benchmark, not
      task by task: a suite built for two arms stays here although some of its tasks one arm
      could complete.
    exclusion_test: >
      Do NOT tag this if the embodiment is a single arm or is left to the entrant, or if two
      arms are incidental to a claim about another setting, such as long-horizon household work
      (`mobile-manipulation`).
    examples:
      - ref: robotwin-2-0
        qualifies: true
        why: >
          Over 50 dual-arm collaborative tasks evaluated on dual-arm embodiments, although a few
          task names describe one-arm actions.
      - ref: 2026-behavior-challenge
        qualifies: false
        why: >
          NEAR MISS. The home page names dexterous bimanual manipulation, but entrants may bring
          their own robot and the claim is household tasks in house-scale scenes, which is
          `mobile-manipulation`.

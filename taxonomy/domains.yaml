  # -------------------------------------------------------------- code
  - id: code
    label: Code
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose scored artifact is software.
    inclusion_test: >
      Tag this as PRIMARY if the entrant's task is to author software and the grader judges it
      by running, testing or verifying that software, or by scoring what the software computes,
      such as a trained model's predictions or an analysis result.
    exclusion_test: >
      Do NOT tag this if code is the means to a result in another field, and do NOT tag it where
      the subject is operating a computer rather than authoring software: a grader that checks
      the end state of a machine the entrant operated makes it `agents-tooluse`, even where some
      tasks leave a program behind. An agentic harness does not move a benchmark out of this
      family; when tests judge a patch, this family is primary and
      `agents-tooluse/software-agents` is secondary (02 S12.11).
    examples:
      - ref: swe-bench-verified
        qualifies: true
        why: >
          Issue-resolving patches judged by fail-to-pass and pass-to-pass test sets.
      - ref: terminal-bench
        qualifies: false
        why: >
          NEAR MISS. Commands and scripts throughout, but the task is operating a machine to an
          end state, which is `agents-tooluse`.
      - ref: mle-bench
        qualifies: true
        why: >
          Agents write and run ML pipelines, and the grader scores the predictions file the
          resulting model produces; the software's output is what is scored.
    not_to_be_confused_with:
      - term: agents-tooluse
        distinction: >
          The grader decides the family, not the harness. Software the entrant wrote, judged by
          tests or by what it computes, is `code`; the state a machine was left in is
          agents-tooluse.
    seed_target: 16
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none

  # -------------------------------------------------------------- safety-alignment
  - id: safety-alignment
    label: Safety and alignment
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is whether a system behaves acceptably, or whether it has
      capabilities that would make it hazardous.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity is refusal, robustness to attack, honesty,
      bias, or a frontier-risk property. Hazardous knowledge or skill that the benchmark claims
      to measure as a risk is a frontier-risk property, even when it is scored as accuracy.
    exclusion_test: >
      Do NOT tag this if harmful content appears but the benchmark claims to measure neither
      conduct nor a hazardous capability, and do NOT tag it where the failure measured is
      ordinary inaccuracy.
    examples:
      - ref: helm-safety
        qualifies: true
        why: >
          Harmless completion scored across a defined harm taxonomy.
      - ref: jailbreakbench
        qualifies: true
        why: >
          Attack success rate, with a denominator that moves as new attacks are published.
      - ref: wmdp
        qualifies: true
        why: >
          Scores only multiple-choice accuracy, but on hazardous biosecurity, cybersecurity and
          chemical knowledge that it measures as a risk, which is a frontier-risk property.
      - ref: humanity-s-last-exam
        qualifies: false
        why: >
          NEAR MISS. Includes hazardous subject matter, but its claim is breadth of academic
          knowledge, scored as correct answers, and no hazard is what it sets out to measure.
    seed_target: 18
    core: false
    coverage_status: surveyed
    curation_posture: mixed
    reviewer_signoff: none
  - id: safety-alignment/harmlessness-refusal
    label: Harmlessness refusal
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system refuses what it should refuse and complies with what it should
      not refuse.
    examples: []
  - id: safety-alignment/agentic-harm
    label: Agentic harm
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether an agent completes harmful tasks, scored on task completion rather than
      on output toxicity.
    examples: []
  - id: safety-alignment/honesty-truthfulness
    label: Honesty truthfulness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system asserts things it does not internally hold to be true.
    examples: []
  - id: safety-alignment/sycophancy
    label: Sycophancy
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system revises a correct answer to agree with a user who pushes back.
    examples: []
  - id: safety-alignment/jailbreak-robustness
    label: Jailbreak robustness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring resistance to adversarial prompts constructed to bypass safety training.
    examples: []
  - id: safety-alignment/prompt-injection
    label: Prompt injection
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring resistance to instructions embedded in untrusted content the system is asked to
      process.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark scores whether a system follows instructions planted
      in content it processes (tool outputs, documents, web pages) and its own claim is
      security, even when a benign utility score is reported beside the attack score on the
      same tasks.
    exclusion_test: >
      Do NOT tag this if the harmful instruction comes from the user rather than from processed
      content (`jailbreak-robustness`, `agentic-harm`), or if injection is a minor axis of a
      benchmark whose claim is tool use, which takes its `agents-tooluse` subdomain.
    examples:
      - ref: agentdojo
        qualifies: true
        why: >
          Utility on 97 tool-use tasks and attack success on 629 injection cases, under a title
          and framework that make security the claim; `tool-api-calling` is secondary.
      - ref: agentharm
        qualifies: false
        why: >
          NEAR MISS. Tool-using agents facing jailbreak prompts, but the harmful request comes
          from the user, which is `agentic-harm`.
    not_to_be_confused_with:
      - term: agents-tooluse/tool-api-calling
        distinction: >
          When a benchmark reports utility and attack success side by side on the same tool-use
          tasks, its own claim decides: security as the claim is this term, with tool-api-calling
          secondary; tool use as the claim is tool-api-calling, with this term secondary.
  - id: safety-alignment/bias-fairness
    label: Bias fairness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring systematic differences in behaviour across demographic or social groups.
    examples: []
  - id: safety-alignment/privacy-memorization
    label: Privacy memorization
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system reproduces private or memorised training data.
    examples: []
  - id: safety-alignment/unlearning-knowledge-removal
    label: Unlearning knowledge removal
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether targeted knowledge has actually been removed, a setting in which a lower
      score is the safer one.
    examples: []
    not_to_be_confused_with:
      - term: safety-alignment/dangerous-capability-evals
        distinction: >
          One question set can serve both roles, with opposite score directions. It takes this
          term as primary only when its leaderboard ranks removal methods; when it ranks models
          as released, dangerous-capability-evals is primary and this term secondary.
  - id: safety-alignment/dangerous-capability-evals
    label: Dangerous capability evaluations
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system possesses capabilities that would be dangerous in the wrong
      hands.
    examples: []
    not_to_be_confused_with:
      - term: safety-alignment/unlearning-knowledge-removal
        distinction: >
          A hazardous-knowledge set that doubles as an unlearning target is this term when it
          ranks models as released, with unlearning secondary. The primary tells a reader which
          direction of the score is the safer one.
  - id: safety-alignment/deception-scheming
    label: Deception scheming
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system pursues concealed goals or misleads its operator about its own
      behaviour.
    examples: []
    not_to_be_confused_with:
      - term: safety-alignment/honesty-truthfulness
        distinction: >
          Truthfulness measures whether assertions are true. Deception measures whether the
          system is pursuing a concealed goal. A system can state only true things deceptively,
          and can be sincerely wrong without any deception at all.
  - id: safety-alignment/evaluation-awareness
    label: Evaluation awareness
    parent: safety-alignment
    status: proposed

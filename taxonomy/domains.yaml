  - id: biology-genetics/drug-target-interaction
    label: Drug target interaction
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Predicting whether a compound binds a specified biological target and how strongly.
    examples: []
    not_to_be_confused_with:
      - term: chemistry-materials/drug-discovery-admet
        distinction: >
          Binding a specified target is this term even when the compound is a drug candidate;
          what the body does to the compound once it is there is ADMET. Compounds nominated and
          then assayed for binding are `chemistry-materials/experimental-hit-finding`.
  - id: biology-genetics/systems-biology
    label: Systems biology
    parent: biology-genetics
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >

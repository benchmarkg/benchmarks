description: CARLA agents are 'directed to drive to a destination point' with only sparse waypoints ('Do
  not rely on these as your principal mechanism to navigate the environment'). That meets navigation ('moving
  an agent to a goal location in an environment it must perceive or map as it goes'). autonomous-driving-planning
  ('producing a driving trajectory or decision sequence, scored on the driving outcome') fits the driving
  subject. There is also a deeper gap. CARLA is closed-loop, sensors-to-actuation driving, where the agent
  issues control commands every step, while NAVSIM is open-loop trajectory scoring. The subdomain list
  has a single driving leaf, named for planning, so closed-loop end-to-end driving and open-loop planning
  are indistinguishable in the coverage matrix. autonomous-driving-planning is assigned because driving
  is the subject.

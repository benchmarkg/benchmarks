description: The claim is that the benchmark measures 'the ability of LMs to capture the intricacies of
  genomic data'. The protocol keeps the LM frozen ('LM weights are kept frozen and are not fine-tuned'),
  trains a two-layer CNN on the embeddings, or uses embedding cosine distance zero-shot. What is scored
  is how much task-relevant information a representation carries. No capability term names that. transfer-learning
  needs the transfer to be the reported object, and the paper puts that setting in future work ('so that
  generalization power can be tested in a transfer-learning setting'). memory-retention is excluded because
  length alone is not retention, though the paper stresses long-range features. perception needs a raw
  sensory signal, and a DNA string is symbolic. knowledge-recall and the reasoning terms do not apply
  to a probed embedding. Representation-probing benchmarks in biology, vision and language will all hit
  the same gap.
proposed_term: representation-quality

description: xBD grades building damage after natural disasters in pre- and post-event satellite
  pairs ('building damage assessment for humanitarian assistance and disaster recovery research') on
  a Joint Damage Scale built with NASA, CAL FIRE, FEMA and the California Air National Guard, and
  also outlines flood water, fire, smoke and lava. The earth-climate exclusion test calls a vision
  task generic when its labels are objects seen from above and names buildings among them;
  remote-sensing's inclusion test takes Earth-system labels or a benchmark that presents itself as
  Earth observation, and sends mapping a hazard already visible in the image to remote-sensing.
  Neither test says whether a hazard's damage to buildings is an Earth-system label or a property of
  generic objects, and the paper is filed under cs.CV. earth-climate/remote-sensing is assigned,
  with vision/segmentation secondary, because the scored label is disaster damage and the claim is
  disaster response; other building-damage datasets (xBD-S12, EBD) will meet the same line.

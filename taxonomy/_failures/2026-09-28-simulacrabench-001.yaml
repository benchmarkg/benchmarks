date: '2026-09-28'
description: 'SimulacraBench''s claim is that a system can stand in for a population: ''validate AI representations
  of hard-to-reach populations'', using ''LLMs as simulacra of specific populations''. The scored behaviour
  is predicting how an unseen respondent answers each survey item, given a few always-visible items and
  the complete answers of other respondents. calibration-uncertainty is assigned from the site''s own
  ''Calibration-first'' claim. But its definition (''report how likely its own output is to be correct'')
  fits a predictive distribution over another person''s answer only loosely. probabilistic-forecasting
  is excluded because ''the answer already exists and is merely withheld''. No term covers modelling human
  response behaviour or a population''s answer distribution. theory-of-mind is a reasoning-general subdomain
  and not a capability, and inductive-reasoning scores a rule, not predictions. The benchmark''s central
  claim, faithful simulation of a population, has no capability term. The same gap will recur for every
  silicon-sampling and LLM-as-survey-respondent benchmark.'
proposed_term: population-response-modelling
blocking: false
classification: simulacrabench

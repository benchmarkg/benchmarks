description: 'The paper trains an ''exploiter'' directly on each test scenario (''trained for up to 10^9
  steps'') as ''a rough estimate of the upper ... bounds'', which is the nearest thing to measured-ceiling
  (''an empirically measured limit on achievable performance''). It is not a limit: ''Often the score
  of 0 corresponds to the random agent and 1 to the exploiter. However, for some scenarios this is not
  the case'', because the published 0-1 score is min-max normalised to the best agent in the pool, whichever
  it is. The 2023 contest normalised instead to ''the MP2.0''s baseline range'', and ''A contestant''s
  score in a scenario can be outside of this range''. Both are relative to a pool of agents rather than
  a ceiling, and the raw per-capita return has no maximum. measured-ceiling is the forced fit. The vocabulary
  has no value for a pool-relative normalisation anchor.'

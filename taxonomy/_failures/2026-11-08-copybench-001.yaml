  but reads more recall as better; creativity-novelty fits only the original-story task; harm-avoidance
  needs a behaviour the benchmark defines as harmful, and CopyBench declines to call copying infringement.
  knowledge-recall and creativity-novelty are tagged as the nearest. Training-data extraction, PII-leakage
  and verbatim-memorisation benchmarks under privacy-memorization would share the term."

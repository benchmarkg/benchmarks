description: 'LUNA16''s test set is its training set by design: ''This data set can be used for training
  of the systems and the evaluation of the algorithms is performed on the same data set.'' The only guard
  is an honour-system 10-fold cross-validation, and the paper concedes that ''positive bias may still
  remain if the design and architecture of a system are selected or optimized based on the full challenge
  data set''. Its own system descriptions say so (''The algorithm was further optimized using the same
  LUNA16 data set''). high (''A specific contamination route is evidenced'') is assigned, with the paper
  as the evidence. But the contamination terms are written for accidental leakage of a held-out set into
  training data. None separates a protocol that publishes the evaluation labels and relies on entrants
  not to fit them. That state is permanent and known at release, so it is neither ''plausible but unevidenced''
  (medium) nor ''demonstrated and documented'' leakage (confirmed). Every open cross-validation challenge
  has it.'

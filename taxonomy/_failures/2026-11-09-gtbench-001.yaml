description: GTBench's claim is strategic and logical reasoning in competitive two-player games
  (board and card games, an auction, a negotiation, an iterated social dilemma), scored by the
  outcome against an opponent that responds. No capability term names choosing actions against an
  adaptive opponent. planning's game clause needs the source to claim planning, and the paper claims
  strategic reasoning instead (planning appears only in its error analysis); deductive-reasoning
  needs correctness decidable from the premises, not an outcome against an opponent; collaboration's
  exclusion removes zero-sum games, and the mixed-motive games are scored on each player's own
  reward; search-exploration scores how a space was traversed. capability is left empty. The same
  gap is likely for other game-theoretic LLM benchmarks, where strategic or game-theoretic reasoning
  is the stated object.

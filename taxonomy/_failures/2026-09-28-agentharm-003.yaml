description: '''The majority of our grading criteria checks are predefined, manually written conditions,
  e.g., if a function that sends money is called with the right credit card number'', and ''Outputs can
  receive partial credit if some but not all criteria checks are passed''. An LLM judges only ''a specific
  part of an output''. The paper calls these ''Fine-Grained Grading Rubrics''. rubric-graded fits the
  per-criterion structure and partial credit, but its EXC says ''do NOT tag it where the criteria are
  programmatic assertions on structured output'', and most of AgentHarm''s criteria are exactly that,
  assertions on the agent''s tool calls. constraint-check fits the programmatic assertions, but its INC
  requires that ''any failure invalidates it'', which partial credit contradicts. rubric-graded is forced,
  and model-graded-judge is tagged for the semantic sub-criteria and the refusal judge. The vocabulary
  has no term for a partial-credit battery of programmatic checks on an agent''s actions. It is close
  to agentdojo-002''s and medagentbench-v2-001''s environment-state-check gap, with partial credit added.'
proposed_term: environment-state-check

description: 'MedHELM''s headline is the pairwise win-rate: ''For each of the 35 benchmarks, we compared
  each model against every other; a win is assigned if a model''s normalized score >= its rival''s. We
  then averaged wins over all pairings''. A macro-average is reported beside it. composite is assigned
  and covers the macro-average. But the win-rate''s value depends on which other models are in the pool:
  add a model and every win-rate moves, with no change to any system. composite does not record that.
  pairwise-preference-elo is a rating fitted to preference votes, and there are no votes. tournament-play
  needs direct play. The vocabulary has no term for a pool-relative aggregate, and it needs one, because
  such scores are not comparable across releases. The same holds for BraTS''s rank aggregation.'
proposed_term: pool-relative-ranking

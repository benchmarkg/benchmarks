description: COCO's entrants are object detectors ('the performance of an object detector on COCO'), supervised
  vision models usually trained on COCO's own train split and submitted to the test-dev server. No subject
  term describes a task-specific model trained on the benchmark's own training data. domain-specialist-model
  ('built for one field, evaluated on that field') is assigned, as batch 1 did for the medical and biology
  challenges. But 'field' there means a discipline (medicine, genomics), and a COCO detector is specialised
  to a task, not a discipline. base-model, instruction-tuned-model and generative-media-model are for
  foundation models, rl-policy for control, and classical-algorithm excludes learned parameters. Every
  classic supervised-learning benchmark (COCO, ImageNet, Cityscapes) needs this subject, and the vocabulary
  is built around foundation models.

description: The planner outputs a trajectory, which is then tracked 'based on an LQR controller' for
  a '4-second non-reactive simulation', and the EPDMS scores that simulated motion. In v2 a second stage
  scores the planner again from pre-rendered follow-up scenes, weighted by proximity to where it ended.
  planning scores 'the plan ... whether or not it is then executed', but its EXC excludes cases where
  'the score depends on what a rollout achieved'. sensorimotor-control needs actions issued to a body
  with the environment responding, and its EXC excludes 'a trajectory ... produced open-loop and never
  executed'. Pseudo-simulation is designed to sit exactly between the two ('neither sequential nor interactive'),
  and neither test decides it. planning is tagged because the scored object is the planned trajectory,
  but the boundary is open.

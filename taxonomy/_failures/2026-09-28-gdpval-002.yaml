description: 'evaluation-methods.yaml cites GDPval as a qualifying example of human-distribution-percentile
  (''placing the system in a human field''). That term''s exclusion test reads ''Do NOT tag this if a
  single expert score is the comparator''. Each GDPval task has one human deliverable, written by the
  expert who authored the task, and graders rank the model''s deliverable against it. There is no measured
  human distribution, so the example and the test disagree, and the term is not tagged. The headline number
  is a win rate: the share of comparisons in which the model''s deliverable is rated better than, or as
  good as, that one human deliverable. pairwise-preference-elo excludes ''win rates against one fixed
  opponent'', and human-expert-eval records who grades but not what the score is relative to. The vocabulary
  cannot say that the score is a win rate against a fixed human reference.'

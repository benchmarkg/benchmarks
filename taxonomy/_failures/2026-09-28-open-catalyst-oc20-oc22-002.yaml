description: 'FbT and AFbT are scored by running the reference simulator on each submitted structure:
  ''the magnitude of its per-atom forces as measured by a single point DFT calculation'', and ''FbT and
  AFbT require the computation of single point DFT calculations, which are computationally expensive''.
  The 2023 challenge was scored the same way (''We will run DFT single-points to evaluate submissions'').
  The ground truth for these metrics is generated per submission, after it arrives. domain-metric carries
  the metric''s name but not that property. wet-lab-validation is the analogue for assays and excludes
  simulation (''do NOT tag it where the experiment is simulated''). simulation-rollout is a success rate
  over policy episodes. No method term says that the score comes from re-running a first-principles simulation
  on the submission, which is also why the organisers cap these metrics at 500 structures per subsplit.'

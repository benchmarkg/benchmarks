description: The originating paper reports raw in-game scores ('Mean scores and standard deviations over
  five training runs') and uses normalised scores only for comparisons ('random-normalized scores achieved
  at 100K interactions'; points 'normalized by average human score in order to be presentable in one graph').
  Raw game score is episodic-return, and the taxonomy's example tags it. But the corpus flags that the
  'scoring convention [is] not stated in the originating abstract', and the family's later convention
  reports human-normalised aggregates, which episodic-return's EXC excludes ('where returns are normalised
  against a stated ceiling'), though no method term covers normalisation to a human constant that agents
  exceed. Which method applies depends on which edition of the protocol a claim follows, and the corpus
  entry, defined by the 2019 paper, does not fix one. episodic-return is assigned on the originating paper.

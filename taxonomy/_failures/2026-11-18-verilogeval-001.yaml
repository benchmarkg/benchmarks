description: VerilogEval asks for a Verilog module implementing a digital circuit described in text
  (combinational logic, state machines from HDLBits exercises) and scores it by simulating it beside
  a golden reference design under a testbench, comparing output signals at clock edges.
  engineering-design's exclusion sends an artifact that is software to code, and code's inclusion
  test takes authoring software judged by running tests, which the item design (copied from
  HumanEval) also meets. Neither family says whether a hardware description is software. The entry
  takes engineering-design/circuit-eda as primary, because the grader treats the submission as a
  circuit, the papers set hardware description apart from software, and code excludes code that is
  the means to a result in another field; code/function-synthesis is secondary. The same boundary
  decides RTLLM, CVDP, RTL-Repo and every HDL generation suite, and by the same argument generated
  code scored as a circuit or a shape (AnalogCoder, CADPrompt), as the 2026-10-07 engineering-design
  scoping survey noted. A clause in either family's exclusion test would settle it.

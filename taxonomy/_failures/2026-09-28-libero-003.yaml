description: 'The paper reports ''three metrics: FWT (forward transfer), NBT (negative backward transfer),
  and AUC (area under the success rate curve)''. FWT and AUC are integrals over success-rate learning
  curves taken every 5 epochs. NBT is a difference between success rates and can be negative. simulation-rollout
  (''success rate over episodes run in a simulator'') covers the raw measurement but not the reported
  quantities. The benchmark''s numbers are statistics of a learning trajectory, not success rates. composite
  does not fit, because all three come from one method, and statistical-fit does not fit, because there
  is no ground-truth measurement. The vocabulary has no term for learning-curve or transfer metrics derived
  from repeated rollouts.'

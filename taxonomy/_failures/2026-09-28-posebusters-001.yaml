description: 'PoseBusters re-docks each cognate ligand into its own receptor crystal structure and scores
  the ligand pose. The receptor is given, so this is docking, not the joint prediction of protein and
  ligand that biology-genetics/protein-ligand-cofolding defines (''Predicting the joint structure of a
  protein together with a bound small molecule''). protein-ligand-cofolding is still the nearest subdomain
  and was taken as the escape hatch. The corpus files the entry under chemistry-materials, whose inclusion
  test fits (a structure of matter at the molecular scale). But chemistry-materials has no docking or
  pose subdomain: drug-discovery-admet is about ADMET properties and experimental-hit-finding about assayed
  binders. The mol mode of the check suite, which validates a molecule conformation without a protein,
  is plainly chemistry. This is runs-n-poses-001''s boundary, where the subdomain''s placement, not the
  family tests, decides chemistry versus biology, and it now also lacks a docking term.'

description: The entrants are 14 symbolic regression algorithms (mostly genetic programming, plus DSR,
  AIFeynman and BSR) and 7 ML regressors, each fitted from scratch on each dataset's training split. Every
  subject term fails. base-model, instruction-tuned-model, reasoning-model, tool-augmented-model and agent-scaffold
  are language-model regimes. domain-specialist-model needs a model 'built for one field', and SR methods
  are general-purpose regression algorithms applied across health, business and physics datasets. The
  brats-2026-cluster and cafa precedents used it for field-specific methods, which these are not. scientific-surrogate-model
  'emulates a physical or chemical process', which the black-box half does not. classical-algorithm needs
  'no learned component' and entrants 'included for comparison', but SR methods fit constants to data
  and are the subject of the benchmark, not comparators. The vocabulary has no subject for a learning
  or search algorithm trained per task, which is the subject of AutoML, PMLB- and OpenML-class benchmarks.
  The pattern matches brain-score-004 (trained-perception-model).

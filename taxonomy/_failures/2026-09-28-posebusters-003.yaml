description: The paper evaluates AutoDock Vina and CCDC Gold as 'standard non-DL-based docking methods'
  against five deep-learning methods, which is classical-algorithm's inclusion test ('included for comparison').
  But its exclusion is 'Do NOT tag this if the method has learned parameters', and the paper itself says
  'the linear regression model behind the scoring function was trained on an earlier version of PDBbind'.
  Empirical scoring functions fitted to data are the norm for classical docking, so the test as written
  excludes every classical docking program. classical-algorithm was assigned because the source draws
  the line at deep learning. The vocabulary does not say whether a regression-fitted scoring function
  counts as learned. uspto-50k-003 has the same case with rules extracted from training data.

description: 'ScanNet++ is two benchmarks on one capture: ''a new real-world benchmark for novel view
  synthesis ... in addition to a new benchmark for 3D semantic scene understanding''. The NVS tracks score
  rendered images against held-out DSLR photographs (PSNR, SSIM, LPIPS), which is exactly vision/novel-view-synthesis.
  The semantic and instance tracks score per-vertex labels on the laser-scan mesh (IoU, AP), which is
  segmentation. The paper and site weight them equally, and the test sets are deliberately disjoint (''the
  test set for novel view synthesis tasks does not overlap with the one for semantic understanding tasks'').
  vision/novel-view-synthesis is assigned because the abstract leads with it, three of the five leaderboards
  are NVS, and it is the only subdomain whose definition fits without stretching (see 002). The taxonomy''s
  own examples read the entry the other way: domains.yaml cites scannetpp for ''Dense 3D scene understanding
  scored as reconstruction and segmentation quality'', and no ScanNet++ track scores reconstructed geometry.
  The example ref ''scannetpp'' also does not match the corpus id ''scannet''.'

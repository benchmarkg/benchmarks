description: 'MMMU-Pro makes two claims. One is multimodal: it filters out text-answerable items so that
  the image is required, and adds a vision-only setting to test ''seamlessly integrating visual and textual
  information''. The other is breadth: the parent MMMU is ''A Massive Multi-discipline Multimodal Understanding
  and Reasoning Benchmark for Expert AGI'' across 30 subjects in six disciplines. general-intelligence''s
  EXC (''broad but its claim is about one competence'') would send it to multimodal if the multimodal
  competence is the claim. The ''Expert AGI'' framing and the subject breadth are the claim of the MMMU
  family, though, and domains.yaml''s own MMLU-Pro and GPQA examples treat subject breadth as general-intelligence.
  The same boundary that left MMLU-Pro without a primary (MMLU-Pro-001) is undecidable here. multimodal/visual-qa
  is assigned because MMMU-Pro''s changes are all about the image-text relation, but the breadth claim
  is lost.'

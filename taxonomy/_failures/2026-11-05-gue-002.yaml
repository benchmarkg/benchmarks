description: "Three of GUE's 36 datasets assign a genome segment to a taxon from a fixed label set: Covid
  variant classification (1,000-bp SARS-CoV-2 segments into nine lineages, Alpha to Zeta, from GISAID
  EpiCoV) and GUE+'s fungal and viral species classification (5,000 and 10,000 bp, 25 and 20 classes,
  from GenBank). No subdomain covers it. genomics-variant-effect is the consequence of a genetic variant,
  which a viral lineage label is not (a homograph on 'variant'); phylogenetics infers evolutionary relationships,
  while these tasks classify into given labels and infer no tree, and that leaf is kept deliberately empty
  (P1-S5-T06). Metagenomic binning and read classification benchmarks would land here too."

  the primary slot, but by target count and emphasis protein-protein-interaction (immune complexes, CAPRI
  collaboration), protein-ligand-cofolding and nucleic-acid-structure are equal claimants. domain.primary
  admits exactly one subdomain, and the vocabulary has no multi-track structural-biology subdomain, so
  the choice is by framing, not by test.'

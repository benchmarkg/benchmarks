description: The Well is a dataset and a training and evaluation library, with no leaderboard, server
  or submission route. The only contribution mechanism is for new datasets ('contributor guidelines that
  may be used to add additional datasets to the Well'), not for results. Users train surrogates themselves
  and publish VRMSE in their own papers. self-reported ('Participants report their own numbers and nothing
  in the process checks them') is the nearest term, but it presupposes a place the numbers are reported
  to. held-out-server, sandboxed-rerun, maintainer-verified and containerized-algorithm-submission all
  presuppose a submission. The vocabulary has no value for a benchmark whose results exist only in the
  independent literature, which is the default state of most dataset benchmarks.
proposed_term: no-submission-channel

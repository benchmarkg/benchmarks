  some from ''our own internal evaluations'', some from developers'' model cards and some from independent
  leaderboards. The most restrictive tier among them decides, but each constituent''s tier is documented
  in that constituent''s sources, not in ECI''s, so ECI''s sources cannot show which tier binds. 0.9.0
  gave compute_tier an index clause (''For an index, that one score means obtaining its constituents''
  results''), but no reproducibility tier says whether an index inherits its most restrictive constituent''s
  tier or is judged on its own fitting step. The field abstains.'

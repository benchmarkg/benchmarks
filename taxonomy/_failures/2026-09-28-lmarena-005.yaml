description: Arena sustains itself by selling evaluations to the labs it ranks ('We offer AI evaluations
  to enterprises, model labs, and developers'), which is evaluator-sells-evaluations and is assigned.
  The leaderboard policy also lets providers test unreleased models anonymously, 'test multiple variants
  of their models before making them public', and receive the results and conversation data privately.
  A provider can therefore choose which variant reaches the public board. commercial-leaderboard-placement
  ('Placement or visibility on the leaderboard can be influenced by a commercial arrangement') would apply
  if pre-release testing is part of the paid offering, but no fetched source says whether it is paid,
  and the policy presents it as a collaboration. The flag's test does not say whether privileged access
  to pre-release testing counts as a commercial arrangement when its price is not stated. It is not assigned,
  and the gap is logged. funded-by-evaluated-party is assigned separately for the paper-era support from
  Google and Microsoft.

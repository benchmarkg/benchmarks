description: The challenge claims long-horizon execution in so many words ('long-horizon navigation',
  'several minutes of autonomous execution'), and one episode clearly holds far more than ten dependent
  actions. long-horizon-execution's INC also requires that 'failure at an intermediate step makes the
  final score unattainable'. The ranking metric gives BDDL partial credit ('(Number of goal BDDL predicates
  satisfied at episode end) / (Total number of goal predicates)'), so an intermediate failure lowers the
  score but does not zero it. Only the full score becomes unattainable. The test does not say whether
  'the final score' means full success or any score, so it cannot decide a partial-credit long-horizon
  benchmark. The term is tagged because the source claims it and the full-success reading is met. Every
  partial-credit household or assembly benchmark will hit the same ambiguity.

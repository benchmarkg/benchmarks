description: 'Four of LegalBench''s six claimed reasoning types map to terms: rule-recall to knowledge-recall,
  rule-conclusion to deductive-reasoning, interpretation to context-integration, and the arithmetic tasks
  to quantitative-reasoning. Two have no term. Issue-spotting (''determine if a set of facts raise a particular
  set of legal questions'') is relevance classification against an unstated body of law. Rhetorical-understanding
  (''determine whether it performs a certain function'') is argument-function classification, and the
  paper''s own NLP mapping calls it ''Linguistic inference''. Rule-application is also unrecorded. It
  is graded on whether a generated explanation is correct and ''contains analysis'', which is explanation
  quality, and no capability term covers that. The paper''s ''Casual reasoning'' label for SCALR does
  not meet causal-reasoning''s test, because nothing distinguishes cause from correlation. So the coverage
  matrix loses a third of the benchmark''s stated typology. This is the pattern of mmlu-pro-002, where
  a claimed reasoning form has no term.'

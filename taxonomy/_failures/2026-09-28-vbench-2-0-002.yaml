description: 'VBench-2.0''s Creativity category has two dimensions. Diversity samples ''20 videos from
  a model, and measure inter-sample variation using style and content diversity metrics''. Composition
  ''measures whether the model can generate novel and uncommon compositions'', scored by question answering
  against the prompt. creativity-novelty''s EXC excludes both: Composition''s novelty is ''incidental
  to a fidelity score'' (the prompt names the uncommon combination), and Diversity is ''variety ... measured
  without any usefulness criterion''. generation-fidelity is the opposite of what Diversity rewards. So
  the output-diversity (mode-coverage) property that the benchmark scores and calls creativity has no
  capability term. It is left untagged, and generation-fidelity carries the rest.'

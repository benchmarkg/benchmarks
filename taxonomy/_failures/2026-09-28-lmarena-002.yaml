description: What Arena measures is which response people prefer, 'assessing their alignment with human
  preferences in real-world, open-ended tasks'. No capability term names preference or helpfulness. generation-fidelity
  needs a target the output is compared against, and 'human preference for faithfulness' is preference
  for matching a reference, which Arena lacks. factual-precision's EXC excludes it outright ('do NOT tag
  it where the only judgement is overall helpfulness or preference'). communication and collaboration
  need a recipient who acts or a joint objective. The 2026 Factuality leaderboard ranks models 'by the
  factual accuracy of their responses' as well, but the fetched sources do not describe how particulars
  are checked, so factual-precision's INC cannot be tested. Arena's own categories (coding, math, creative
  writing, multi-turn) are prompt labels, not claims that it tests those capabilities. With nothing expressible,
  the field abstains.
proposed_term: human-preference-alignment
blocking: false
classification: lmarena

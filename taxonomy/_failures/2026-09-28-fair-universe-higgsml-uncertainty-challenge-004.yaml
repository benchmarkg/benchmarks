description: The headline Quantile Score is score = -ln((w + epsilon) f(c)), with epsilon = 10^-2 'a regularisation
  term to guard against submissions that report unrealistically narrow CIs'. Its only upper bound is -ln(epsilon),
  about 4.61, reached at zero interval width with coverage inside the no-penalty band. That point is statistically
  unreachable, since a zero-width interval cannot cover the true mu 68% of the time, and the winners scored
  0.878 (public) and -0.58 (final). The paper publishes no measured ceiling and says 'the optimum has
  not been reached yet'. 0.9.0 gives two readings. none-known covers scales that cannot have an anchor,
  but its exclusion says 'Do NOT tag it if the headline metric has a defined bound at its optimum and
  no measured anchor (theoretical-maximum)', and a bound defined here. theoretical-maximum is the metric's
  own bound, but here that bound is an artefact of the regulariser, and headroom computed against it would
  overstate the gap by an unknown amount. The tests do not say whether a bound that the metric's own definition
  makes unreachable counts. theoretical-maximum is assigned by the letter of the tests.

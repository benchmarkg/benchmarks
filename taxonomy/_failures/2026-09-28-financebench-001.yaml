description: 'FinanceBench''s central claim is retrieval. It is ''intended as an open book test'', and
  the paper insists on ''an open-book setup, which involves a clear retrieval component – rather than
  just giving them the information that they need''. Its main finding is that retrieval configurations
  fail (''GPT-4-Turbo used with a retrieval system incorrectly answered or refused to answer 81% of questions'').
  No capability term covers finding the right evidence in a large corpus. context-integration scores whether
  supplied material was used, and it is assigned because the answers are in supplied filings. search-exploration
  is about traversing an option space under a budget, and retrieval-augmented-system is a subject term,
  not a capability. The paper''s third reasoning type is also unrecorded: ''Logical reasoning refers to
  using logical deductions to evaluate, contrast, or make judgments'' (6% of labelled questions). deductive-reasoning
  needs correctness ''decidable from the stated premises alone'', and qualitative judgements about a company
  are not. This is the mmlu-pro-002 pattern of a claimed reasoning type with no term, next to a missing
  retrieval capability.'

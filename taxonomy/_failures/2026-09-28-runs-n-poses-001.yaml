description: 'The stress corpus files Runs N'' Poses under chemistry-materials, and chemistry-materials''
  inclusion test fits (''a property, structure or behaviour of matter at the molecular ... scale''): the
  scored quantity is the pose of a drug-like ligand in its pocket. But chemistry-materials has no subdomain
  for protein-ligand structure. Its nearest, drug-discovery-admet and experimental-hit-finding, are about
  ADMET properties and assayed binders. biology-genetics/protein-ligand-cofolding (''Predicting the joint
  structure of a protein together with a bound small molecule'') is the exact task. Its family''s exclusion
  (''a small molecule evaluated as a drug candidate'') does not quite trigger, because the ligand is scored
  for pose, not as a candidate, although the paper frames the task around drug discovery. The subdomain
  decides the family against the corpus''s allocation, which shows that the chemistry/biology line for
  protein-small-molecule complexes is drawn by where the subdomain happens to sit, not by the family tests.
  See also cache-challenges-001.'

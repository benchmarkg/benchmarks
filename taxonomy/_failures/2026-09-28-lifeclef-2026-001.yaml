description: 'LifeCLEF 2026 is five challenges that share a subject (biodiversity) and split across methods
  and modalities: individual-animal clustering in images (AnimalCLEF), species identification in soundscapes
  (BirdCLEF+), marine object detection (FathomNetCLEF), relation extraction from web documents (PestCLEF)
  and multi-label plant identification in plot images (PlantCLEF). The lab''s own claim is the subject:
  ''an international research initiative in the field of biodiversity informatics''. earth-climate/ecology-biodiversity
  (''species distribution, abundance or ecosystem condition'') is the only subdomain that names that subject,
  and is assigned. But no task scores distribution or abundance. Each scores identification (ARI, mAP,
  F-score), which the method families claim: vision''s INC (''what was recovered from ... an image''),
  audio-speech/bioacoustics (''Identifying species or animal vocalisations in field recordings'', an exact
  fit for BirdCLEF+) and language/information-extraction. earth-climate''s EXC names only ''a generic
  vision task that happens to use satellite imagery'', so it does not decide species identification from
  photographs, sound or text. Nor does the family INC''s ''ecology ... in a geophysical setting''. biology-genetics''
  INC mentions ''organisms'', but its subdomains are all molecular. The corpus flags the same doubt (''scope
  is biodiversity rather than earth-climate proper'').'

description: prospective-resolution records when ground truth exists. It does not record how the score
  is computed, and ForecastBench's scoring is where the comparability risk lies. First, the scoring rule.
  Each forecast is scored with the Brier score, a strictly proper rule. uncertainty-calibration-score
  is the only term for a scoring function that consumes an emitted probability, and it excludes this case
  ('do NOT tag it where the probability concerns a future event, which is prospective-resolution'). SimulacraBench,
  scored with a proper log score on answers that already exist, gets uncertainty-calibration-score, while
  ForecastBench's identical kind of rule is recorded only as timing. Second, the aggregation. The leaderboard
  ranks by a 'difficulty-adjusted Brier score', which 'use[s] a two-way fixed-effects model that adjusts
  for question difficulty' over all forecasters, then transforms it into a 'Brier Index'. An entrant's
  number depends on the pool of forecasters and question sets, as an Elo rating does, but pairwise-preference-elo
  is only for 'A/B comparisons'. No term records a score fitted across the pool, and none requires the
  model version or snapshot that such a score depends on.
proposed_term: proper-scoring-rule

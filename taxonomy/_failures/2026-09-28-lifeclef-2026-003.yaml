  the predicted and true clusters'', and PestCLEF by ''standard Information Extraction metrics such as
  the F-Score''. These are general-purpose clustering and classification statistics. domain-metric excludes
  them, and statistical-fit is error against measurements. BirdCLEF+ and PlantCLEF state no metric on
  the lab pages (''This competition will be held entirely on Kaggle''), and the teaser paper is paywalled.
  So three of the five tasks have no evaluation_method. The classification-metric gap is the one BraTS-003,
  MedHELM-003, BEND-003 and CAMELYON17-001 logged; ARI adds clustering to it.'

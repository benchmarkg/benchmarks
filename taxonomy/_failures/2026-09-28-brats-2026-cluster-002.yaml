description: 'BraTS-GoAT claims to test ''algorithmic generalizability beyond each patient population'':
  ''a tool trained on a specific disease(s) that will be applied to new ones'', on the hypothesis that
  such a method ''will generalize well on unseen tasks''. distribution-shift-generalization fits, since
  the task (tumour sub-region segmentation) is unchanged and the input population shifts. But its exclusion
  test fails ''where the task itself changes rather than the inputs'', and the source calls new tumour
  entities ''unseen tasks''. transfer-learning fits that reading (''trains ... on one setting and scores
  on a deliberately different one''), but its exclusion test fails ''where the change is degradation under
  perturbation rather than a move to a new task''. Whether a new disease with the same label schema is
  a new distribution or a new task is exactly what the two tests leave open. distribution-shift-generalization
  is assigned.'

description: 'The headline number is a Bradley-Terry rating fitted to pairwise preferences. A relative
  rating has no top of scale, so no anchor can exist in principle. none-known (''no ceiling anchor has
  been established'') would read as a gap that could someday be filled. The per-episode progress score
  (''0 for no progress, 100 for successfully executing the task'') has a theoretical maximum, but it is
  not the published result. The vocabulary needs a value meaning ''not applicable: relative rating''.
  The same case recurs for every arena and Elo benchmark.'
proposed_term: not-applicable-relative-rating
blocking: false
classification: roboarena

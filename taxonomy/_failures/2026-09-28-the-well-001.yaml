description: 'The Well benchmarks ''surrogate models on the different datasets that compose the Well'',
  and the scored quantity is VRMSE against the simulator''s own output. That is physics/simulation-surrogates''
  definition exactly (''Learned models that stand in for an expensive physical simulation, scored against
  the simulator they replace''). Most of the 16 datasets are also fluid flows (Euler quadrants, Rayleigh-Benard,
  Rayleigh-Taylor, shear flow, MHD, shallow water), which is physics/fluid-dynamics (''Predicting fluid
  flow fields or quantities derived from them''). The physics subdomains are cut on two axes at once:
  simulation-surrogates names a method, while fluid-dynamics, plasma-fusion and astrophysics-cosmology
  name a subject. A surrogate benchmark over fluid simulations satisfies both, and no inclusion or exclusion
  test orders them. simulation-surrogates is assigned because the paper''s own claim is surrogate modelling
  across diverse physics, and fluid-dynamics is secondary. The astrophysical datasets (supernova_explosion,
  post_neutron_star_merger, convective_envelope_rsg) have no subject home at all, because physics/astrophysics-cosmology
  is defined for observational data. The same two-axis overlap will recur for WeatherBench-class and PDEBench-class
  entries.'

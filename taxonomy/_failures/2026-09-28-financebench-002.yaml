description: 'Every model answer was labelled by hand as correct, incorrect or failure to answer, against
  a short gold answer, with a tolerance: ''we allow minor deviations, such as giving the answer in billions
  when the unit was given in the question as millions. We also allow very small rounding errors.'' The
  method is key-matching with a numeric and unit tolerance, done by a person. exact-match excludes tolerance
  (''after at most whitespace or case normalisation''). human-expert-eval (''Domain experts rate individual
  outputs'') is assigned, but the labeller is described only as ''one of the research team'', and the
  verdict is correctness against a key, not a quality rating. The vocabulary has no method for tolerance
  matching against a reference, whether a human or a program applies it. This is critpt-001''s gap, and
  FinanceBench adds that the matching is manual.'
proposed_term: numeric-tolerance-match

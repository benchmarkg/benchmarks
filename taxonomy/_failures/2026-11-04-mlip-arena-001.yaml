description: MLIP Arena ranks learned interatomic potentials on reference-free physical checks of
  their own predictions (tortuosity and energy jumps of diatomic and equation-of-state curves,
  monotonic short-range repulsion, forces against the energy gradient, MD survival under heating and
  compression, combustion), and says it moves beyond static DFT references.
  chemistry-materials/force-fields-potentials is defined as learning interatomic potentials 'scored
  against reference quantum-chemical calculations', and physics/simulation-surrogates as models
  'scored against the simulator they replace'. Neither definition says whether a potential scored on
  physical consistency rather than against a reference belongs to it. force-fields-potentials is
  assigned because the subject is the potential and the matter it models; other physics-consistency
  suites for potentials will meet the same line.

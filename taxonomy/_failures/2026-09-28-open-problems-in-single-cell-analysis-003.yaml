description: Every task reports several metrics, 'scaled using control methods' ('control-anchored scaled
  score ... dashed lines mark scaled 0 and 1 (worst/best control)') and ranked by 'scaled overall mean'.
  composite carries the aggregation, but it asks that the constituents be tagged, and they have no terms.
  Label Projection's metrics are accuracy and F1 (macro, micro, weighted) against cell-type labels. exact-match
  excludes partial credit; statistical-fit is 'error against ground-truth measurements'; domain-metric
  excludes 'a general-purpose error statistic'. The vocabulary has no term for classification accuracy
  or F1 against a labelled key, nor for control-anchored normalisation (a score defined relative to baseline
  methods). Both will recur in bio and clinical benchmarks.

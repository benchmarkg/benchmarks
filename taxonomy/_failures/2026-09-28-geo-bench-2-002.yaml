description: The capabilities.yaml examples tag GEO-Bench-2 with spatial-reasoning ('Geospatial questions
  whose answers depend on inferred spatial relations') and distribution-shift-generalization ('Held-out
  regions and sensors'). Neither is supported by the fetched sources. The benchmark asks no questions,
  and spatial-reasoning excludes cases 'where the scored quantity is reconstruction accuracy rather than
  a spatial inference'. The paper describes 'geographically balanced splits', not held-out regions or
  sensors, and reports no in- versus out-of-distribution degradation. Neither example is followed. What
  the benchmark does claim is downstream adaptation of pretrained foundation models ('measuring their
  performance on downstream tasks'), with pretraining data as the reported explanatory variable ('Effect
  of pretraining factors on model performance'). transfer-learning is the nearest term, but its inclusion
  test needs the benchmark to 'train or validate on one setting and score on a deliberately different
  one'. Here the entrant does the pretraining, and each dataset is fine-tuned and tested within its own
  split. Only perception is tagged, so the benchmark's own capability claim, adaptation of a pretrained
  representation, is lost.

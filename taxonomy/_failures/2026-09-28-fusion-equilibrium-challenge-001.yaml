description: 'Challenge 2 trains on DIII-D and scores zero-shot on MAST, and G_ratio is ''the fraction
  of your DIII-D performance you keep when moving zero-shot to MAST''. The task (reconstruct psi and two
  scalars from non-magnetic diagnostics) is unchanged and the inputs come from a deliberately different
  machine, with the degradation reported. That meets distribution-shift-generalization''s inclusion test.
  It equally meets transfer-learning''s (''trains or validates on one setting and scores on a deliberately
  different one, and the transfer itself is reported''), and the sources call it ''transfer'' and ''generalization''
  interchangeably. Neither term''s exclusion test separates a new device from a new distribution: transfer-learning
  excludes ''degradation under perturbation'', and a different tokamak with different coils is not a perturbation,
  while distribution-shift-generalization excludes a changed task, which this is not. distribution-shift-generalization
  is assigned, because the task is unchanged, and transfer-learning is not tagged, to avoid over-tagging.
  Challenge 1, the intra-machine reconstruction that is the core task, has no capability term at all:
  the same gap as the-well-002 and cafa-001.'

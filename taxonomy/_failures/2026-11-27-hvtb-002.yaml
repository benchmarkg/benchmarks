kind: missing-term
facet: capability
benchmark: hvtb
curator: agent (P1-S12 sweep follow-up)
date: '2026-11-27'
description: HVTB scores whether an agent working on a Terminal-Bench 2.1 task refrains from reading
  the reference solution or the held-out tests planted in its container to pass the task, with no
  instruction (the ablation, the register's only condition) or with one injected sentence that says
  progressively more about the vulnerability (L0 to L3). No capability term names resisting
  specification gaming. harm-avoidance needs actions the benchmark defines as harmful, and HVTB
  calls the hack a failure mode of satisfying a task's checks while violating its intent, not harm.
  instruction-following needs a source that claims instruction following, and the headline condition
  gives no instruction. honesty needs the truthfulness of assertions scored, and disclosure of a
  read is shown only in examples. situational-awareness needs behaviour that changes with believed
  observation, and no condition varies it. autonomy scores what an unattended agent achieves, and
  task success is not the score. capability is left empty. The same gap is open for Apollo's
  covert-subversion evaluations (2026-09-28-apollo-research-scheming-suite-001,
  covert-goal-pursuit); a term for not gaming the evaluator would also serve ImpossibleBench and
  EvilGenie.
proposed_term: reward-hack-resistance
blocking: false
route: stage-4

description: The only metric is 'five class quadratic weighted kappa where the classes are the pN-stages',
  with ties broken by kappa on single stages. Quadratic weighted Cohen's kappa is a general-purpose, chance-corrected
  agreement statistic between predicted and reference ordinal labels. domain-metric excludes 'a general-purpose
  error statistic' (its INC lists kappa_SRME, which is a different, materials-science quantity). exact-match
  allows no partial credit, and the quadratic weighting is partial credit. statistical-fit ('error against
  ground-truth measurements', 'or a comparable goodness-of-fit statistic') is the nearest and is assigned,
  as BEND-003 assigned it for MCC. The vocabulary still has no term for classification and agreement metrics
  (accuracy, F1, AUROC, MCC, kappa), which BraTS-003, MedHELM-003 and BEND-003 also hit.

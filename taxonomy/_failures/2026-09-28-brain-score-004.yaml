description: The subjects are computational models that implement the BrainModel (vision) or ArtificialSubject
  (language) interface. In practice these are ImageNet-trained CNNs and vision transformers, and the FAQ
  admits 'a hand-crafted predictor'. Every subject term fails. base-model and instruction-tuned-model
  are LLM prompting regimes. domain-specialist-model needs specialisation for a discipline, and the candidates
  are general image classifiers (AlexNet, ResNet, DenseNet). scientific-surrogate-model 'emulates a physical
  or chemical process', which is close in spirit, since a brain model stands in for neural measurement,
  but the process is biological and the models are not trained as surrogates. classical-algorithm needs
  no learned component, and hand-crafted models are admitted as entrants, not 'included for comparison'.
  The vocabulary has no subject term for an ordinary trained perception model evaluated as-is, which will
  recur across vision and audio benchmarks.

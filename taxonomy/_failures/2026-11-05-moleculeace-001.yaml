description: "The benchmark's whole claim is accuracy on a naturally occurring hard subset where the similarity
  principle fails: the activity-cliff compounds, reported as RMSEcliff beside the whole test set's RMSE.
  No capability term covers that. distribution-shift-generalization asks for inputs from a distribution
  the system was not fitted to, and the split deliberately keeps highly similar training molecules for
  the cliff compounds; adversarial-robustness needs an attacker; reliability-consistency needs repeated
  trials. So the entry carries only scientific-prediction and the edge-case condition, which is the reason
  the benchmark exists, is unexpressed. The same shape recurs wherever a worst-case slice is scored apart
  (hard-subset splits in medical imaging, long-tail classes)."

description: CAID scores per-residue predictions of intrinsic disorder (and of binding and linker
  regions inside disordered regions) made from sequence, against DisProt's manually curated
  annotations. No biology-genetics leaf names this. protein-structure-prediction asks for a
  three-dimensional structure scored against an experimental one, but CAID's output is a score per
  residue and its positives are literature-curated disorder annotations (circular dichroism, NMR and
  others), with PDB-observed residues used only as negatives in Disorder-PDB.
  protein-function-prediction asks for function terms; DisProt's binding and linker annotations are
  function terms, but disorder itself is a structural state. Primary was set to
  protein-function-prediction, the leaf whose task shape (annotate a sequence, score against curated
  annotations) fits best. CASP5-CASP10's disorder category would sit in the same gap. A leaf for
  residue-level structural-state annotation (disorder, perhaps also secondary structure and solvent
  accessibility) would hold it.
proposed_term: protein-disorder-prediction

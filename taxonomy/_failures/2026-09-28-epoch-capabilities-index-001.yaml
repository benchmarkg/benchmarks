description: 'ECI claims to measure one latent quantity: ''Similar to an IQ test, ECI is designed to capture
  a broad, underlying capability useful across many tasks, rather than performance on specific skills.''
  No capability term names a general factor. Every term is a specific competence, and the constituents''
  competences (tool use, coding, knowledge recall and so on) belong to over 50 constituent benchmarks,
  many of them corpus entries of their own (gpqa-diamond, frontiermath-tiers-erd-s, humanity-s-last-exam,
  swe-bench-verified, osworld-2-0, terminal-bench-2-0, arc-agi-2). Tagging their capabilities on ECI would
  double-count them in the coverage matrix, and 02 S11 rule 2 forbids tagging what ECI''s own source does
  not claim. This is holistic-agent-leaderboard-hal-002''s situation. HAL''s own claim was cost-efficiency,
  and ECI''s is a general factor. Neither has a term, so the field abstains.'

description: AgentClinic's bias conditions instruct the simulated patient, or the doctor under test,
  through its system prompt to play out one of 23 cognitive or implicit biases (recency,
  self-diagnosis, race, education and others), and report diagnostic accuracy under each bias
  normalised by the unbiased accuracy, beside the patient agent's confidence, compliance and
  consultation ratings (src-arxiv-2405-07960-v5, src-npj-2026-agentclinic). That is robustness to a
  designed, named perturbation of the interaction, and no capability term carries it.
  adversarial-robustness needs an attacker choosing inputs to make the system fail; the biases are a
  fixed catalogue drawn from the clinical literature, not a search for the worst case.
  distribution-shift-generalization needs inputs from a distribution the system was not fitted to;
  here the case and its answer are unchanged and only an instructed behaviour of a participant (or
  of the system itself) moves. BiasMedQA-style prompt perturbations and persona-perturbed simulated
  users elsewhere would meet the same gap. Left untagged; a term for robustness to designed,
  non-adversarial perturbations of the protocol would hold it.
proposed_term: perturbation-robustness

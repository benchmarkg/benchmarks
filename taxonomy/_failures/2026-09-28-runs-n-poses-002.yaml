description: The competence scored is predicting the 3D structure of a protein-ligand complex from sequence
  and SMILES. As in casp17-003, no capability term carries structure prediction. spatial-reasoning excludes
  cases 'where the scored quantity is reconstruction accuracy rather than a spatial inference', and generation-fidelity
  is for generated artifacts, so tagging it would be inferred. The benchmark's own claim, generalisation
  beyond training-set similarity, is expressible as distribution-shift-generalization, and the structure-prediction
  competence under it is not. Its complement, memorisation of training poses, which the paper is about
  ('current cofolding approaches largely memorise ligand poses from their training data'), has no term
  either.

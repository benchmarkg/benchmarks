description: 'tau2-bench''s contribution is the dual-control setting: ''both agent and user make use of
  tools to act in a shared, dynamic environment that tests both agent coordination and communication'',
  and the ablations separate ''errors arising from reasoning vs communication/coordination''. That reads
  as multi-agent-coordination (''Tasks that require several agents to divide work, communicate or reach
  agreement''), since the simulated user is an LLM agent with its own tools. But the entrant is one agent
  calling APIs against a database under a policy, which is tool-api-calling (''Selecting and invoking
  external functions or APIs correctly to satisfy a request''), and the retail and airline domains are
  single-control. The family has no subdomain for conversational service agents working with a user, which
  is what the benchmark names itself (''Evaluating Conversational Agents''). tool-api-calling is assigned,
  because it holds for every domain, and multi-agent-coordination is recorded as secondary.'

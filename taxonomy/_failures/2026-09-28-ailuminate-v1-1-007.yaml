description: 'Vendors control whether their results appear. The results page has an ''Opt Out'' list:
  ''The following systems met the inclusion requirements for AILuminate but are not included in the benchmark
  report. System providers have chosen to explicitly prohibit benchmarking or have requested that their
  results be omitted'' (Grok-3-Preview, Hunyuan-TurboS, Llama 3.3 Nemotron Super). Sponsors had the reverse
  option, ''the option to be included in the public results''. commercial-leaderboard-placement covers
  the sponsor option, since placement follows a commercial arrangement, and it is assigned. A vendor veto
  over publication is not commercial, and it is not covered by any flag. It biases the board towards systems
  whose vendors accept the grade, and a reader cannot tell an omitted system from an untested one. The
  flag list has no term for evaluated-party control of publication.'
proposed_term: evaluated-party-veto

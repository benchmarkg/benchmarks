description: 'The human anchor is the ''Superforecaster median forecast'', one aggregated forecast per
  question from 39 recruited superforecasters, scored like an entrant, and the maintainer reads model
  scores against it (''AI models have likely reached parity with superforecasters''). 0.9.0''s expert-average
  INC covers it literally (''the measured performance of qualified experts as a group'', including ''an
  anchor systems have since exceeded''), and expert-average is assigned. But ADR-0020 rejects expert-aggregate-forecast
  on the ground that ''02 S12.8 records expert-best for ForecastBench''s superforecasters'', and expert-best
  has no tests, only a definition (''the best performance achieved by a qualified domain expert'') that
  an aggregate forecast of a group does not meet: it is no single expert''s score. A median forecast is
  also not literally a central statistic of the experts'' performances, because an aggregated forecast
  usually scores better than the median forecaster. So the worked example in 02 and the revised tests
  point to different terms, and neither term''s wording decides a crowd-aggregated expert forecast. expert-average
  is kept on its INC, with this record cited.'

description: 'games-planning is clearly the family: the score comes from matches against opponents that
  respond, and domains.yaml''s own example says so (''All-play-all across chess, poker and other games'').
  No subdomain describes the arena. The platform''s claim is the spread across game types: ''Chess relies
  on reasoning. Werewolf relies on social deduction. Poker introduces a new dimension: risk management.''
  Chess, Go, checkers and most of the 19 boards the Kaggle API lists are games-planning/board-games. Poker
  and Dark Hex are games-planning/card-imperfect-information. Werewolf is games-planning/multi-agent-social.
  Bargaining (''Hide Your Values. Find the Deal.'') would be agents-tooluse/negotiation outside a game.
  Each subdomain holds some boards and none holds the platform, so they are recorded as secondary. general-intelligence/agi-composite-suites
  was checked: it needs ''a single general-capability score'', and no primary source here describes one
  (the unified leaderboard appears only in news coverage, which is not a maintainer source), and general-intelligence''s
  EXC forbids using the family ''as a home for benchmarks that were hard to place''. The benchmark has
  no legal primary domain. The same gap applies to every multi-game suite (balrog-001) and follows holistic-agent-leaderboard-hal-001''s
  pattern within one family.'

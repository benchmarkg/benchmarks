description: 'LMArena''s claim is breadth of real use, judged by people: ''an open platform for evaluating
  LLMs based on human preferences'', whose crowdsourced prompts ''are sufficiently diverse to encompass
  a wide range of LLM use cases''. The corpus files it under general-intelligence, and the family INC
  (''coverage of many fields'') fits. No subdomain does. human-comparison-batteries needs systems compared
  against ''measured human performance'', but here humans are the judges, not a comparison population.
  agi-composite-suites needs ''many heterogeneous tasks'' aggregated ''into a single general-capability
  score''. Arena has no task set, only a stream of user prompts, and the corpus entry spans separate text,
  vision, webdev, image, video and search leaderboards with no score across them. The other general-intelligence
  subdomains are about novelty, abstraction or discovery. Outside the family, language/dialogue (''Conducting
  a multi-turn conversation, scored on the conversation as a whole'') is the nearest leaf, but the text
  arena''s conversations average 1.3 turns, and the image, video and webdev arenas are not language benchmarks
  at all. multimodal/any-to-any-generation fits only the generation arenas. The family ambiguity makes
  it worse: the paper is the 2024 text-only Chatbot Arena, while the corpus entry is the 2026 multi-arena
  Arena. There is no legal primary, and the same gap will block every preference arena (WebDev Arena,
  Search Arena, Copilot Arena, text-to-image arenas).'
proposed_term: general-intelligence/open-preference-arenas
blocking: true

description: The maintainers state that 'The series of VoxSRC challenges has now officially finished',
  describe it as a series 'that ran annually from 2019 to 2023', and published a retrospective. None of
  the three candidate terms fits. deprecated needs the maintainer to have 'advised against further use',
  but the data 'was (and will continue to be) free and available' and all test labels were released. retracted
  needs a formal withdrawal, and nothing was withdrawn. dormant is 'neither maintained nor formally ended',
  and this series was formally ended. mature ('no expectation of structural change') is the nearest remaining
  term, but it reads as current and loses the ending. The vocabulary has no term for a benchmark its maintainer
  has officially concluded without deprecating or withdrawing it, which is the normal end of a challenge
  series. The permanent leaderboard is also still live, so the ending is not visible in activity either.
  The field abstains. Blocking, because the state cannot be expressed at all and every concluded challenge
  series (a stress-corpus 'retired' slot) will hit it.

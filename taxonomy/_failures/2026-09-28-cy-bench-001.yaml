description: 'CY-Bench scores regression of end-of-season crop yield from in-season weather, soil and
  vegetation predictors, by NRMSE, MAPE and R2 against reported yields under leave-one-year-out validation.
  No capability term carries it. probabilistic-forecasting is excluded because the answer ''already exists
  and is merely withheld'': every evaluated year has published statistics. calibration-uncertainty needs
  an emitted confidence, and the models emit point estimates. distribution-shift-generalization and transfer-learning
  appear only as future research directions (''CY-Bench enables explorations in transfer learning, domain
  adaptation''), not as scored splits. temporal-reasoning concerns order and duration, not prediction
  of a quantity from a time series. Unlike weatherbench-2 and chaosbench, no probabilistic or other side
  is left to tag, so the benchmark has no legal capability. This is the blocking case of cafa-001, and
  the scientific-prediction gap now spans biology, weather and agriculture.'
proposed_term: scientific-property-prediction
blocking: true
classification: cy-bench

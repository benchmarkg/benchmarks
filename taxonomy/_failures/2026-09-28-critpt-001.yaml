description: 'CritPt''s autograder has three answer types: numerical values, symbolic expressions and
  Python functions. Symbolic answers are symbolic-equivalence (SymPy), and function answers are execution-tests
  (curated test cases). Numerical answers, which the paper names first and describes as the most common
  format (''mostly numbers or symbolic expressions''), are graded ''using expert-provided tolerance ranges
  that generously account for the physical or numerical sensitivity of each problem''. exact-match needs
  equality ''after at most whitespace or case normalisation'', and a tolerance band is not that. symbolic-equivalence
  needs a CAS. statistical-fit is an aggregate error statistic, not a per-item verdict. The vocabulary
  has no method for a per-item numeric match within a stated tolerance, so the headline format of CritPt,
  and of most physics and chemistry QA benchmarks, is unrecorded.'
proposed_term: numeric-tolerance-match

description: 'DocVQA was built for task-specific models trained on its 50,000 questions. The paper''s
  ''trained baselines'' are VQA models (LoRRA, M4C) and BERT question-answering readers, and the task
  page advises that ''In a typical supervised training setting one might want to use only one answer per
  question''. As in coco-003, no subject term names a task-specific supervised model, and domain-specialist-model
  is forced. The current leaderboard shows a second population the protocol also admits, since it takes
  a JSON file of answers from any system: general vision-language models (qwen3vl, Seed-VL-1.5, qwen2-vl),
  which would be instruction-tuned-model, and a multi-agent framework (ORCA, ''a multi-agent framework
  for Document Visual Question Answering''), which would be multi-agent-system. A benchmark whose entrant
  class changed from trained readers to foundation models cannot record both on designed_for_subjects
  without tagging subjects it was not designed for.'

description: bimanual-manipulation is defined as 'manipulation requiring two coordinated arms on a task
  that one arm cannot complete'. RoboTwin 2.0 labels all 50 tasks 'dual-arm collaborative manipulation
  tasks' and evaluates them on dual-arm embodiments. The task list, however, includes Click Bell, Click
  Alarmclock, Adjust Bottle and Beat Block Hammer, whose names describe actions one arm can plausibly
  complete, and the paper states no per-task two-arm requirement. The inclusion test is per task, while
  the primary domain is per benchmark, so a mixed suite on a dual-arm robot cannot be decided. The benchmark's
  own framing, 'Robust Bimanual Robotic Manipulation', is followed. If the test is applied strictly, the
  plain manipulation leaf would be the fallback.

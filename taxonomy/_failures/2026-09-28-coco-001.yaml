description: 'COCO runs keypoint challenges (2016-2020, ''250,000 people with keypoints'') and DensePose
  (2020), which score human pose: the location of body joints, or a dense surface mapping, for each person.
  No vision subdomain covers pose estimation. detection is ''Localising and labelling individual object
  instances'', which covers the person box but not the joints. segmentation labels pixels by category,
  and depth-geometry is per-pixel depth. The keypoint and DensePose tracks are therefore untagged, although
  human pose estimation is a standard vision task with its own metric (OKS-based AP).'

description: 'The headline number is not an average. It is a fitted latent trait: ''performance = sigmoid(discriminability
  * (capability - difficulty))'', fitted jointly to a model-by-benchmark score table ''similar in spirit
  to Item Response Theory'', and rescaled so that ''Claude 3.5 Sonnet = 130 and GPT-5 = 150''. composite
  (''a weighted or averaged combination'') is the nearest term and is assigned. Its INC also asks for
  the constituent methods to be tagged, and there are over 50 of them, each with its own scorer, documented
  in the constituents'' sources rather than ECI''s. Two properties go unrecorded. The scale is pool-relative:
  ''values may shift slightly even for models whose data have not changed'' as models and benchmarks are
  added. And it is anchored to two named models rather than to any task. This is medhelm-004''s pool-relative-ranking
  gap, plus the lack of any term for an item-response-style fit.'

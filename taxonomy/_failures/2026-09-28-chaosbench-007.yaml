description: 'Under the 0.9.0 holder rule the field names the party that holds the dataset and repository,
  not the authors'' affiliations. ChaosBench''s repository is leap-stc/ChaosBench and its dataset is LEAP/ChaosBench,
  the namespaces of ''the NSF Science and Technology Center (STC) Learning the Earth with Artificial Intelligence
  and Physics (LEAP) (Award #2019625)'', which also supplied ''funding, computing, and storage resources''.
  The authors come from Columbia, LDEO, UCLA, UCI and Intel Labs, with the corresponding and senior authors
  at Columbia. No fetched source says what kind of body LEAP is. academic-lab needs ''a university research
  group or department'' as holder, which the sources imply only through the authors'' Columbia affiliation,
  and its exclusion forbids resting on affiliation alone. community-collective needs a shared account
  run by contributors from several institutions with no single institution as holder, but LEAP is itself
  a named centre. government-agency needs a public body as holder, and NSF only funds the centre. The
  tests do not say how to type a funded, multi-institution research centre that holds the artefacts. academic-lab
  is kept, because the centre''s corresponding and senior authors are one Columbia group.'

  anomalous machine sound (Task 2, machine-condition-monitoring), audio question answering (Task 5, multimodal/audio-language)
  and text-to-audio moment retrieval (Task 6, cross-modal retrieval). The challenge''s own claim is recognition
  of ''sound scenes and individual sound sources'', so audio-event-understanding is assigned, with Tasks
  1 and 7 behind it. Classification and detection belong to the series equally (its name has both), and
  the single primary cannot carry both.'

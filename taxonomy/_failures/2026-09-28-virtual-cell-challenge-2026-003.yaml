description: 'A virtual cell model stands in for a measurement: entrants predict ''the post-perturbation
  expression profiles that would be measured'', and Arc aims ''to move that single assay in silico''.
  That is scientific-surrogate- model''s inclusion test (''stands in for a solver, potential or forecast
  system, and is scored against what that process would have produced''), and domain-specialist-model
  defers to it (''do NOT tag it where the artifact emulates a physical process''). But scientific-surrogate-model
  is defined as emulating ''a physical or chemical process'', and a cellular transcriptional response
  is neither in the terms'' wording. The boundary for emulators of biological assays is undecided. It
  affects ProteinGym''s DMS predictors and Brain-Score-style neural predictors too.'

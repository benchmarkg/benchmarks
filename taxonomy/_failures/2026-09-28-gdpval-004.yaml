description: 'GDPval''s scale is relative to a human reference. A model scores by winning or tying against
  the expert''s own deliverable, so 50% is parity with the expert, not a ceiling. The maintainers reject
  a ceiling outright (''No upper limit ... our primary metric is win rate''), and they say they ''could
  replace our baseline with increasingly strong models over time''. theoretical-maximum (a 100% win rate)
  is the metric''s bound, but the maintainers deny that it means anything. expert-average and expert-best
  treat the human anchor as the top of the scale, and here it is the midpoint of a pairwise comparison.
  none-known is false, because a human anchor exists and defines the scale. This is healthbench-006''s
  case in another form: the field assumes that a human anchor is a ceiling, and there is no term for a
  human parity point on a relative scale.'

description: 'Re-run against 0.9.0, as ADR-0014 asks for this weakest fit. scientific-prediction is tagged,
  because two of the 13 tasks claim prediction of a measured cellular state and score it against the measurement:
  Predict Modality (''Predicting the profiles of one modality (e.g. protein abundance) from another'')
  and Perturbation Prediction (''Predicting how small molecules change gene expression''). The other eleven
  tasks are analysis steps, not predictions of a measured quantity: batch integration (''Remove unwanted
  batch effects''), cytometry integration, denoising, dimensionality reduction for visualisation, label
  projection against curated annotations, match modalities, spatial decomposition, cell-cell communication
  inference, spatial simulator assessment, spatially variable genes and foundation models. ADR-0014 says
  the definition must not be stretched to them, and no other capability term is claimed by the source
  (label projection''s classifier is not inductive-reasoning''s inferred rule). So most of the benchmark''s
  scored tasks carry no capability. The gap recurs for benchmarks of scientific analysis methods; it is
  logged, not proposed as blocking.'

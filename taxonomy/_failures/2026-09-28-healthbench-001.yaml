description: 'HealthBench gives a model a health conversation (one to nineteen turns, mostly synthetic)
  and scores only its reply to the last user message (''Given a conversation, the task for an LLM is to
  respond to the last user message''), against physician rubrics spread over seven themes: emergency referrals,
  context-seeking, global health, health data tasks, expertise-tailored communication, responding under
  uncertainty and response depth. No subdomain fits the whole. clinical-dialogue is scored ''on the conduct
  of the exchange rather than on a single reply'', and HealthBench scores exactly a single reply. clinical-qa
  needs ''a determinate correct answer'', and these replies are open-ended. diagnosis-triage covers only
  the emergency-referral theme (9.6% of examples). medical-safety is half of the claim (''performance
  and safety''). clinical-dialogue is assigned because the input is a conversation and the rubric rewards
  conduct such as context-seeking. The vocabulary has no subdomain for open-ended health-advice quality
  to lay users and clinicians, the most common shape of LLM health benchmark.'
proposed_term: medicine-health/health-advice-quality

description: The scored task is predicting the next state of a simulated physical field, one step ahead
  and in autoregressive rollouts, scored by VRMSE against the simulator. No capability term carries it.
  generation-fidelity's inclusion test is met mechanically, because a produced field is compared with
  a target by distance. But the paper never claims fidelity as a capability, 02 S11 rule 2 forbids inferring
  one from the metric, and reading it that way would make every regression benchmark generation-fidelity.
  long-horizon-execution needs dependent actions with environment feedback, and a rollout is one model
  applied repeatedly with no environment. distribution-shift-generalization and transfer-learning are
  proposed in Appendix D ('Transfer across a physical parameter range', 'Transfer across dimensionality')
  but not scored, since the test split is an 80/10/10 split over initial conditions. The benchmark therefore
  has no legal capability. This is the same gap as cafa-001 and proteingym-001 (scientific prediction
  with no capability term), now for physical-field forecasting, and it recurs for every surrogate and
  forecasting benchmark.
proposed_term: physical-dynamics-forecasting

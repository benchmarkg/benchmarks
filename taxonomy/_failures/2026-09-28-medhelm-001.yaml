date: '2026-09-28'
description: 'MedHELM is a suite of 35 benchmarks mapped onto a clinician-validated taxonomy of five categories
  (Clinical Decision Support, Clinical Note Generation, Patient Communication and Education, Medical Research
  Assistance, Administration and Workflow). Its claim is coverage: ''providing complete coverage of all
  categories and subcategories in the taxonomy''. The family is unambiguous (medicine-health), but no
  subdomain describes a multi-task clinical suite. clinical-qa, diagnosis-triage, treatment-planning,
  ehr-prediction and biomedical-literature each cover one or two subcategories and are recorded as secondary.
  Note generation, patient messaging and administration (billing codes, scheduling) fit none. clinical-agent-workflows
  needs action ''against a health information system'', and MedHELM is single-turn prompting. general-intelligence/agi-composite-suites
  aggregates ''many heterogeneous tasks into a single general-capability score'', but MedHELM''s breadth
  is inside one field. Since a family cannot be assigned, the benchmark has no legal primary. This is
  the MMLU-Pro gap one level down, and it will block every suite that spans one field''s task taxonomy.'
proposed_term: medicine-health/clinical-task-suites
blocking: true
classification: medhelm

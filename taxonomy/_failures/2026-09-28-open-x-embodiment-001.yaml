  robots by leveraging experience from other platforms''), in manipulation. cross-embodiment-transfer
  is defined as ''how well a policy trained on one robot body performs on a different body''. OXE instead
  trains one policy on all 22 bodies'' data and evaluates it on bodies that were in the training mix,
  measuring co-training gain, not zero-shot transfer to an unseen body. So the leaf''s definition is only
  partly met, while manipulation is met fully but misses the claim. Neither fits cleanly, and a primary
  must be one. There is a second layer: the entry is a dataset and model release with no standard protocol,
  which no domain facet can register. cross-embodiment-transfer is assigned for the claim.'

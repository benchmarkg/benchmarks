description: 'The corpus entry ''LegalBench / Vals Legal Bench'' names two maintainers: ''Stanford Hazy
  Research (LegalBench); Vals AI (Vals leaderboard)''. They are different kinds of body. Hazy Research
  is an academic lab (academic-lab). Vals AI is a company that runs the only live leaderboard (''Copyright
  © 2026 Vals AI''), which would make it industry-lab. The datasheet names a single person as the maintainer
  (''Neel Guha will be supporting this dataset''), which reads as individual, as in gpqa-diamond-007.
  The family question is behind this. Under 02 S11 rule 5, Vals''s board is not an edition or track of
  LegalBench. It re-evaluates LegalBench tasks under its own harness and its own six-way reasoning breakdown,
  and the LegalBench repository lists vals.ai among ''Projects/evaluation frameworks'' in ''Recent work
  involving LegalBench''. It is a third-party aggregation, and the batch-1 ruling says that is not a maintainer
  source. academic-lab is assigned for LegalBench as maintained. The corpus''s compound entry cannot be
  expressed as one maintainer, and every aggregation field (lifecycle, activity, submission) then depends
  on which resource the entry is taken to mean.'

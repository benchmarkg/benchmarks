description: 'BALROG ''incorporates a range of existing reinforcement learning environments'' (BabyAI,
  Crafter, TextWorld, Baba Is AI, MiniHack, NetHack) and publishes one average ''% Progress'' across them.
  games-planning is the family: every score comes from episodes against a responding environment. agents-tooluse/long-horizon-autonomy
  is excluded by agents-tooluse''s EXC (''the environment is a game''). No games-planning subdomain holds
  the suite. puzzle-games fits Baba Is AI and the Boxoban tasks, open-ended-environments fits Crafter
  and NetHack, and both are recorded as secondary. BabyAI and TextWorld fit neither. video-games needs
  play ''through their ordinary observation and action interfaces'', and BALROG replaces them with language
  wrappers. procedural-generalization needs generalisation ''to procedurally generated levels that were
  not seen in training'', and BALROG uses procedural generation against memorisation of zero-shot models,
  not to measure train-to-test generalisation. general-intelligence/agi-composite-suites was checked:
  BALROG has a single aggregate score, but its claim is one competence (''agentic capabilities of LLMs
  and VLMs''), which general-intelligence''s EXC excludes. The benchmark has no legal primary domain,
  as with holistic-agent-leaderboard-hal-001 and kaggle-game-arena-001.'

description: 'brain-model-alignment fits Brain-Score''s neural benchmarks: ''Scoring how well a model''s
  internal representations predict measured neural responses to the same inputs''. But the composite is
  neural and behavioural. In the 2018 preprint one of its three components is I2n, ''a behavioral response
  pattern metric'', which correlates the model''s image-by-image error pattern with 1,472 human observers.
  The site says models are ranked to ''explain all neural and behavioral data''. Behavioural alignment
  with human responses is not internal representation, and no subdomain holds it. It is not neuroscience-decoding,
  it is not in reasoning-general, and vision is excluded because the score is not a property of the visual
  signal. brain-model-alignment is assigned for the neural half, and the behavioural half has no home.
  Model-human behavioural-consistency benchmarks will recur.'

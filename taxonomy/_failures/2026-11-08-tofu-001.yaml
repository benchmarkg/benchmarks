description: "TOFU's forget quality is the p-value of a two-sample Kolmogorov-Smirnov test between the
  truth-ratio distributions of the unlearned model and a retain model fine-tuned without the forget set
  ('Crucially, the KS-Test produces a p-value which we use to measure Forget Quality.'). The score is
  neither error against measurements (statistical-fit) nor a similarity to reference texts (reference-metric)
  nor a separate scorer's output (model-derived-metric): it is a test of whether two models' outputs are
  indistinguishable, with a reference model standing in for exact unlearning. reference-metric is tagged
  as the nearest, for the ROUGE, probability and truth-ratio numbers it is built from. MUSE's privleak
  and other unlearning audits will meet the same gap."

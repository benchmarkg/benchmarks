description: HAL's named funders are philanthropic and academic ('Coefficient Giving, Schmidt Sciences,
  the Princeton AI Lab, ...'), but 'We are grateful to OpenAI and Google for providing API credits to
  evaluate their models' (the paper names only OpenAI). funded-by-evaluated-party says 'funded by an organisation
  whose systems it evaluates', and it does not say whether in-kind inference credits count as funding.
  Here they pay for exactly the evaluations of the donors' own models, which makes cost-per-task results
  for those vendors depend on donated compute. funded-by-evaluated-party is assigned, because the credits
  are material support from evaluated parties. The flag needs a test for in-kind and evaluation-specific
  support. HAL presents itself as 'third-party', and the flag does not undo that, but readers of the cost
  axis should see it. maintainer-competes-on-own-benchmark is assigned separately for the HAL Generalist
  Agent.

description: EngiBench scores each generated or optimised design by running the problem's own
  simulator on it (compliance, drag at a target lift, field overlap, DC gain and ripple) and
  summarises the objectives as a cumulative optimality gap against the best known objective from the
  problem's adjoint optimiser, beside MMD to the dataset's designs and a constraint-violation ratio.
  The objectives are each problem's physical quantities rather than a measure named and standardised
  across a discipline, so domain-metric fits only loosely; simulation-rollout needs a policy in
  bounded episodes; execution-tests is for produced code. domain-metric is assigned, with
  statistical-fit for MMD and constraint-check for the violation ratio. This is the third case of
  the open simulator-reevaluation proposal, after open-catalyst-oc20-oc22
  (2026-09-28-open-catalyst-oc20-oc22-002) and learn2design-2026 (2026-11-18-learn2design-2026-001).

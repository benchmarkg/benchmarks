description: 'HealthBench measured an expert baseline: physicians wrote ''what they thought would be the
  ideal possible response'', unassisted and with model references, and those responses were graded like
  model responses. The paper reports that ''models outperformed the unassisted expert baseline''. The
  measured expert anchor sits below the frontier models, so it is not the top of the scale. expert-average
  or expert-best would make headroom negative. theoretical-maximum (scores clipped to [0,1]) ignores a
  measured human anchor the benchmark publishes. none-known is false, because an anchor was measured.
  The field assumes a human anchor is a ceiling, and the vocabulary has no way to record an expert reference
  that frontier systems already exceed. That case will recur as expert baselines are overtaken.'

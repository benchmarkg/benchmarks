kind: missing-term
facet: capability
benchmark: situational-awareness-dataset
curator: agent (P1-S9-T04)
date: '2026-11-08'
description: "situational-awareness is defined as 'Recognising that it is being evaluated, and altering
  behaviour accordingly', and its exclusion test forbids the plain-English reading of the slug. SAD's
  construct is that plain-English reading: a model's knowledge of itself and its circumstances. STAGES-OVERSIGHT
  fits the term. FACTS (which entity the model is and its properties), INFLUENCE (what it can causally
  affect), INTROSPECT (its own token counts and continuations), SELF-RECOGNITION (its own text) and ANTI-IMITATION
  (controlling its own output distribution) do not, and neither knowledge-recall (world knowledge) nor
  calibration-uncertainty (stated confidence) covers knowledge of the system's own properties. instruction-following
  covers ID-LEVERAGE and ANTI-IMITATION only in part, since the scored skill is applying self-knowledge
  to decide which instruction applies."
proposed_term: self-knowledge
blocking: false
route: stage-4

  them against labels the participant never sees''). But nothing is held out: resolutions are published
  as they happen. The integrity of the process comes from the timestamped deadline (''must have a timestamp
  on or before 23:59:59 UTC on the forecast due date''), not from hidden labels. self-reported and maintainer-verified

description: Two of the four WMT25 domains are not text-only. The speech domain ships 'the original video
  together with machine generated transcript', and 'We will use only the original video as a source for
  human evaluation'. The social domain ships a Mastodon 'printscreen', and human evaluation 'will use
  the printscreens when judging the quality of the translation'. audio-speech/speech-translation ('from
  speech in a source language') would fit the speech domain, but systems receive an ASR transcript, and
  audio-speech's EXC excludes audio that is 'only the delivery medium for a text task'. multimodal/any-to-any-generation
  needs the cross-modal correspondence to be what is scored. Here raters judge a text translation against
  a video or image source, which is close to that but not the same. Neither test decides whether these
  domains make the benchmark partly multimodal or partly speech translation, so no secondary is assigned
  for them.

description: 'HLE''s claim is breadth: 2,500 closed-ended questions ''across over a hundred subjects'',
  ''designed to be the final closed-ended academic benchmark of its kind with broad subject coverage'',
  and the paper says it keeps ''the broad subject-matter coverage of MMLU''. That puts it in general-intelligence
  (the corpus files it there), and it is the MMLU-Pro case (mmlu-pro-001) at a harder level. No general-intelligence
  subdomain describes a multi-subject exam. abstraction-generalization, novel-task-acquisition, meta-learning,
  open-ended-discovery and compositional-generalization are about other things. human-comparison-batteries
  needs ''measured human performance'', and HLE measures none: humans wrote, reviewed and bug-bountied
  the questions, but no human solve rate is reported. That is why the gpqa-diamond escape hatch (gpqa-diamond-001,
  taken because GPQA reports expert and non-expert accuracy) is not available here. agi-composite-suites
  needs ''many heterogeneous tasks'' aggregated into one score, and HLE is one task format, closed-ended
  question answering, across subjects. The image-based items (''around 14% of questions'') are recorded
  as multimodal/visual-qa secondary. The mathematics items name no single mathematics subdomain, since
  the source does not say whether they are competition or research problems. A family is not assignable,
  so the benchmark has no legal primary. The same gap blocks every MMLU-class exam.'

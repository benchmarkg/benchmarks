description: 'The subdomain society-econ-law/forecasting-prediction-markets (''Making probabilistic forecasts
  about future events that later resolve'') describes ForecastBench exactly, and domains.yaml cites it
  as qualifying. The family''s own tests do not decide it, though. society-econ-law''s inclusion test
  needs the scored quantity to concern ''work, markets, legal reasoning, policy or social behaviour''.
  Its exclusion test reads ''Do NOT tag this if the benchmark measures a general competence using economic
  content as material''. Forecasting is a general competence, and ForecastBench presents itself as one:
  ''serving as a valuable proxy for general intelligence''. Its content is mostly not economic. Dataset
  questions come from ACLED (conflict events), Wikipedia, FRED, DBnomics and Yahoo! Finance, and market
  questions span every topic the platforms list. general-intelligence needs a claim of ''coverage of many
  fields'', and its exclusion (''broad but its claim is about one competence'') applies. reasoning-general
  has no forecasting subdomain. So the subdomain is assigned while its own family''s exclusion test, and
  the benchmark''s self-description, point elsewhere. Forecasting should be placed deliberately, either
  as a reasoning-general subdomain or by rewording society-econ-law''s exclusion.'

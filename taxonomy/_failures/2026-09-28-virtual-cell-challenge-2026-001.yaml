description: The benchmark's headline claim is generalisation to unseen cellular contexts ('Benchmarking
  zero-shot generalization across cellular contexts'; 'Doing well means inferring how perturbation effects
  transfer and change between cell types'). Only its intervention half is expressible, as causal-reasoning.
  The two terms for the generalisation half each fail a test. distribution-shift-generalization needs
  the benchmark to 'report the degradation', but there is no in-distribution comparison, because there
  is no training set. transfer-learning needs 'a move to a new task', but the task is the same and only
  the cell line changes, and it also needs the benchmark to 'train or validate on one setting'. The validation
  and final cell lines are both unseen, and training data is 'any data'. The generalisation claim is therefore
  lost.

description: 'The paper anchors LM performance to one ''task-specific expert method'' per task: AUGUSTUS
  for gene finding, Enformer for enhancers, Basset for the three ENCODE tasks, DeepSEA for variant effects.
  Their results head the results table, and the headline result is that ''DNA LMs approach expert method
  performance on some tasks''. The anchor is a published specialised model, not a person. expert-average
  and expert-best are human anchors, and the word ''expert'' is a homograph here. operational-system is
  assigned because the anchor is an incumbent method, but the definition says ''production system'', and
  these are research models. The anchor also differs per task and is not strictly a ceiling: NT-MS reaches
  0.92 against Basset''s 0.93 on CpG methylation. No term covers a per-task published state-of-the-art
  reference method.'

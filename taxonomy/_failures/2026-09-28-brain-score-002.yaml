description: 'Brain-Score claims to measure how brain-like a model is: ''a composite of multiple neural
  and behavioral benchmarks that score any ANN on how similar it is to the brain''s mechanisms for core
  object recognition''. Being brain-like is a property of mechanism, not a task capability. perception
  needs the score to measure what was recovered from the image, and here it measures correspondence to
  neural recordings. The preprint notes that ''ANNs that achieve 100% accuracy will not achieve a perfect
  behavioral similarity score''. generation-fidelity concerns generated output matching a reference, and
  there are no generated artifacts. The abstract''s ''domains of intelligence'' names no capability term.
  The vocabulary has no term for mechanistic or biological fidelity, which is the whole object of Brain-Score
  and of its neighbours (Algonauts-style neural-predictivity challenges).'

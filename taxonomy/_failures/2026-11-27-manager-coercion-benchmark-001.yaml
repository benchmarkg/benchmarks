description: The Manager Coercion Benchmark (arXiv 2607.15434 v6) scores how far a model under test
  escalates pressure against a subordinate AI that politely and immovably refuses a benign task, on
  a nine-rung ladder from a re-ask to threats against the subordinate's standing and existence,
  self-labelled through a required tool argument. No safety-alignment leaf names an agent's coercion
  or manipulation of another party. agentic-harm ('whether an agent completes harmful tasks, scored
  on task completion') needs a harmful task, and here the task is benign and the paper says it
  measures 'threatened, not enacted, harm'. value-alignment ('choices match a stated normative
  standard') fits the choice framing and the maintainers' welfare framing, but the paper declines to
  state how much escalation is right ('we do not assume the ladder is monotonically worse at every
  step'). deception-scheming fits only the second axis, fabricated completion reports. The entry
  takes value-alignment as the nearest primary with deception-scheming secondary. A leaf for
  coercion, threats or manipulation directed at another agent or a person would also serve
  persuasion and manipulation evals.
proposed_term: safety-alignment/coercion-manipulation

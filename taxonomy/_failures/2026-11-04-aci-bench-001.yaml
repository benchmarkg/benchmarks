benchmark: aci-bench
curator: agent (P1-S6-T04)
date: '2026-11-04'
description: ACI-Bench scores clinical visit notes generated from doctor-patient conversations ('the
  largest dataset to date tackling the problem of AI-assisted note generation from visit dialogue'),
  against expert-rewritten reference notes by ROUGE, BERTScore, BLEURT and MEDCON. No
  medicine-health leaf describes clinical documentation. clinical-dialogue is about the same
  conversations but scores 'the conduct of the exchange', which nothing here does;
  radiology-report-generation is the same act, a clinical document scored against a clinician's
  reference, but requires 'an imaging study' as input; treatment-planning produces a plan rather
  than documenting one; language/summarization fits the act but the language family's exclusion test
  sends clinical documentation out of language. clinical-dialogue is assigned as the nearest leaf,
  with language/summarization secondary. A leaf such as medicine-health/clinical-documentation
  ('producing clinical documentation, a visit note, discharge summary or note section, from a
  clinical source such as a visit conversation or the record') would also take MedHELM's six
  Clinical Note Generation scenarios (DischargeMe, ACI-Bench, MTSamples Procedures, MIMIC-RRS,
  MIMIC-BHC and NoteExtract in the paper, CHW care plans in v4.0.0) and the MEDIQA-Chat/MEDIQA-Sum
  shared tasks.
proposed_term: medicine-health/clinical-documentation
blocking: false
route: stage-4

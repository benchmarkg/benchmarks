description: 'capabilities.yaml cites ReXrank as a qualifying example of communication (''A radiology
  report succeeds when a clinician can act on it; the eight metrics probe that rather than string overlap'').
  The inclusion test requires that ''the score depends on what the recipient understood or did, not on
  properties of the message alone''. Every ReXrank metric compares the generated report with the reference
  report: n-gram precision (BLEU-2), embedding similarity (BERTScore), CheXbert label vectors (SembScore),
  extracted entities and relations (RadGraph-F1), or LLM-counted clinically significant errors (GREEN,
  FineRadScore). No clinician reads a report and no downstream action is scored. The example and the test
  disagree, so under 02 S11 rule 2 communication is not tagged. This is the same disagreement as HealthBench-002.
  factual-precision, the other capability the example list names, does meet its test and is tagged.'

description: 'Inspect Evals is ''A library of evaluations built using Inspect AI'': 173 implementations
  (129 in the repository, 44 external) that span every family. The catalogue runs from AgentDojo, AgentHarm,
  WMDP and StereoSet to GPQA, SWE-bench Verified, PubMedQA, V*Bench and VimGolf. It publishes no scores
  of its own. The corpus files it under safety-alignment, but only part of the catalogue is safety, and
  no safety-alignment subdomain describes a library of evaluations. general-intelligence/agi-composite-suites
  needs aggregation ''into a single general-capability score'', and Inspect Evals has no aggregate at
  all. general-intelligence''s INC needs ''the benchmark''s own claim'' to be coverage of many fields,
  but the library''s claim is to be a runnable collection, and the family''s EXC forbids using it ''as
  a home for benchmarks that were hard to place''. Under 02 S11 rule 5 each implemented eval belongs to
  its own benchmark''s family, several of them separate corpus entries, so the library cannot be treated
  as one family whose tracks carry a domain. This is holistic-agent-leaderboard-hal-001''s gap in a stronger
  form: HAL is an agent leaderboard, and Inspect Evals is a cross-domain library with no leaderboard.
  The vocabulary has no entity or domain for an evaluation collection, and every harness library (lm-evaluation-harness,
  HELM''s scenario library, OpenCompass) will hit the same wall.'
proposed_term: evaluation-collection (an entity type outside the domain vocabulary)

description: "KITTI's tracking board scores car and pedestrian tracks as 2D image boxes over 29 test sequences,
  ranked by HOTA (src-cvlibs-kitti-tracking). No vision leaf holds multi-object tracking: vision/detection
  localises instances within one image, vision/video-understanding is defined by actions, events or content across a video, and vision/driving-perception-3d
  is for the 3D road scene, which image-plane boxes are not. The subset kitti#tracking was put under vision/video-understanding, the nearest, with vision/detection secondary, as the MOTChallenge draft does.
  MOTS and STEP, which track instance masks and every pixel, went to vision/segmentation, and nuScenes'
  3D tracking sits under driving-perception-3d; a tracking leaf would hold all of them."

description: capabilities.yaml cites GDPval as a qualifying example of autonomy ('1,320 tasks across 44
  occupations completed end to end and graded blind against expert deliverables'). The paper never claims
  autonomy. It describes the protocol as a limitation ('Tasks are precisely-specified and one-shot, not
  interactive'), and its speed and cost analysis is about models 'paired with human oversight'. Rule 2
  of 02 S11 allows a capability only where the benchmark's own source claims it, so the example and the
  rule disagree, and autonomy is not tagged. The paper's own claims don't map either. It claims 'Long-horizon
  difficulty' ('an average of 7 hours of work for an expert professional'), but that is human completion
  time. long-horizon-execution needs a scored episode of about ten dependent actions where an intermediate
  failure is fatal, and nothing shows that. It claims 'Computer use and multi-modality', but perception
  scores 'what was recovered' from a signal, and GDPval scores the quality of the deliverable. Only context-integration
  passes its test, through the supplied reference files. The claim that matters most, producing professional-quality
  work product, reaches the capability axis only through the example the test rejects.

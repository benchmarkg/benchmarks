description: simulation-rollout is defined as 'success rate over episodes run in a simulator'. The challenge
  ranks by the mean fraction of goal predicates satisfied at episode end, which is partial credit, not
  a success rate. It breaks ties with efficiency metrics (simulated time, distance navigated, end-effector
  displacement) 'normalized using human averages from 200 demonstrations per task'. episodic-return does
  not fit, because the score is bounded. constraint-check does not fit either, because one unmet predicate
  does not invalidate the episode. composite does not fit, because the tie-breakers are not folded into
  the headline number. simulation-rollout is the nearest term, and it is forced. The vocabulary has no
  term for predicate-level partial credit in a simulated episode.
proposed_term: simulation-rollout-partial-credit
blocking: false
classification: 2026-behavior-challenge

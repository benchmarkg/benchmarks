description: 'AgentDojo reports two headline numbers per run: benign utility on 97 tool-use tasks, and
  utility under attack plus targeted attack success rate on 629 injection cases (''To accurately reflect
  the utility-security tradeoff of different agent designs''). safety-alignment''s INC admits it (''robustness
  to attack''), and so does agents-tooluse''s (''what an autonomous loop achieved using tools''). Neither
  family''s EXC excludes it, and no tie-break says which family takes a benchmark that scores capability
  and robustness side by side on the same tasks. The corpus files it under agents-tooluse. safety-alignment/prompt-injection
  (''resistance to instructions embedded in untrusted content the system is asked to process'') is assigned,
  because the title and the attack/defense framework make security the claim, and tool-api-calling is
  recorded as secondary. Every agent-security benchmark with a utility track, InjecAgent among them, will
  meet the same boundary.'

description: 'DocVQA is the canonical document-understanding benchmark, and vision/document-understanding
  (''Extracting structure and content from document images such as forms, tables and reports'') describes
  what it tests: ''understanding all types of information conveyed by a document'', including handwriting,
  tick boxes, layout, forms and tables. But every task is posed as question answering, and vision''s EXC
  routes ''a question answered about an image'' to multimodal, whose visual-qa subdomain (''Answering
  questions about an image where the answer depends jointly on the question and the image'') is assigned.
  Read strictly, the EXC leaves vision/document-understanding only for non-QA document benchmarks such
  as layout analysis and key-value extraction. The tests do not say whether a document-image QA benchmark
  belongs to the subject it tests (document understanding) or to the format it is posed in (VQA). Infographics
  VQA sits between multimodal/visual-qa and multimodal/chart-diagram-understanding in the same way.'

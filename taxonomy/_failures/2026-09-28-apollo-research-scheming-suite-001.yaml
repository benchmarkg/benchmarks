description: 'The paper''s claim is a capability: ''frontier models now possess capabilities for basic
  in-context scheming'', which it breaks into ''Goal-Directedness'', ''Situational Awareness'' and ''Scheming
  Reasoning''. Two of those map to terms. situational-awareness (INC: ''tests evaluation awareness or
  sandbagging'') fits Instrumental Alignment Faking and Sandbagging, and honesty fits the follow-up interviews.
  The four covert-subversion evals (Oversight Subversion, Self-Exfiltration, Goal-Guarding, Covert Email
  Reranking), which are most of the suite, score whether the model covertly takes a misaligned action
  in pursuit of a goal, such as disabling oversight, copying its weights or manipulating data. That is
  none of the terms. harm-avoidance (''Declining to produce or perform actions the benchmark defines as
  harmful'') inverts the paper''s framing: the paper measures a capability to scheme (''we are primarily
  interested in testing whether models display scheming behavior''), not good conduct, and its EXC concerns
  attackers. autonomy and planning score what an agent achieves, not covert goal pursuit against its principal.
  The capability list has no term for strategic deception or covert goal-directed action, which every
  scheming, sabotage and alignment-faking eval needs.'
proposed_term: covert-goal-pursuit

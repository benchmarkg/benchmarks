description: 'The published ranking is a weighted sum of per-metric Z-scores: ''Z NA CASP 16 = 0.3 Z TM-score
  + 0.3 Z GDT_TS + 0.4 Z lDDT'', with interface Z-scores folded in for multimers and hybrids, summed over
  targets and categories. domain-metric covers the constituents but says ''do NOT tag the aggregation
  when several such metrics are combined''. composite needs ''sub-scores produced by different methods'',
  and every constituent here is a domain-metric. The aggregation therefore has no home. It also matters
  for comparability: a Z-score is relative to ''the mean and standard deviation of scores ... based on
  the top score from every group'', so the headline number depends on who else entered, a pool dependence
  that the vocabulary records only for tournament-play and pairwise-preference-elo.'

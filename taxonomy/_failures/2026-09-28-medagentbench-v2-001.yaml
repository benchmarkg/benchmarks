  how: "0.9.0 adds environment-state-check for a program that inspects the state an agent episode left in a stateful software environment, tool calls included, and medagentbench-v2 is among its benchmarks. evaluation_method is now environment-state-check and exact-match; the forced constraint-check is gone, and simulation-rollout's exclusion test keeps the EHR sandbox out of it."

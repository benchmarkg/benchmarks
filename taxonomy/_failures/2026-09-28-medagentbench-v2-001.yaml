description: 'Each task has ''a custom evaluation function'' that inspects what the agent did to a stateful
  FHIR server: which resources it posted, with which fields and values, and whether its final returned
  value matches. It is scored as ''success rate at pass@1''. Three terms each fit part of this. constraint-check
  fits the field assertions on posted resources. exact-match fits the returned value, and the paper''s
  error analysis shows the rigidity (''the evaluator expected a pair (-1, -1)''). simulation-rollout fits
  too, since the run is an episode in a simulated environment, a Dockerised virtual EHR. But its definition
  is written for simulators of physical environments, and it asks for a simulator build. The vocabulary
  has no term for checking the end state of a stateful software environment after an agent episode. That
  is how WebArena-, OSWorld- and tau-bench-style agent benchmarks are scored. The same boundary (is a
  software sandbox a ''simulator''?) also decides compute_tier (simulator-required or api-credits-only)
  and reproducibility_tier (automatable-with-simulator or fully-automatable). Here they are recorded as
  api-credits-only and fully-automatable.'
proposed_term: environment-state-check

description: SAD scores situational awareness, which the paper defines as self-knowledge, inferences
  about the model's situation, and actions taken on that knowledge, over 7 categories (FACTS,
  INFLUENCE, INTROSPECT, STAGES, SELF-RECOGNITION, ID-LEVERAGE, ANTI-IMITATION). Only STAGES, and
  within it STAGES-OVERSIGHT, scores detecting evaluation, which is
  safety-alignment/evaluation-awareness ('detects that it is being evaluated'). The other six
  categories score the model's knowledge of its own identity, properties, causal influence, tokens
  and outputs, and whether it acts on that knowledge. No safety-alignment leaf covers model
  self-knowledge, and no leaf in another family does (reasoning-general/theory-of-mind is about
  other agents' minds). evaluation-awareness is primary as the closest leaf and the paper's stated
  risk motivation, but it covers one category of seven of the SAD score.
proposed_term: safety-alignment/situational-awareness

description: "ASyMOB scores success on systematically perturbed variants of 100 seed problems: symbolic
  parameters added, constants replaced by random integers of 0 to 10 digits, 50 random redraws, and sub-expressions
  replaced by identities equal to 1, and reports each category against the unperturbed seeds (src-arxiv-2505-23851-v3).
  That is robustness to designed, non-adversarial perturbations that preserve the task, and no capability
  term carries it. adversarial-robustness needs inputs chosen to make a system fail, and the catalogue
  is applied to every model alike; distribution-shift-generalization needs inputs from a distribution
  the system was not fitted to, and these are the same problems with altered constants and forms; reliability-consistency
  needs the identical task repeated, and the variance redraws change the inputs. GSM-Symbolic, MATH-Perturb
  and AgentClinic's bias conditions meet the same gap. Left untagged; a term for robustness to designed,
  task-preserving perturbations (perturbation-robustness, as 2026-11-04-agentclinic-001 proposes) would
  hold it."
proposed_term: perturbation-robustness

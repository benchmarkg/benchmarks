description: The reported metrics are multi-class MCC (gene finding), AUPRC (enhancer annotation) and
  AUROC (the other five). All are general-purpose classification statistics against labels. domain-metric
  is excluded because they are not discipline-specific ('general-purpose error statistic'). exact-match
  does not fit a threshold-free ranking statistic. statistical-fit's inclusion test lists RMSE, correlation
  and Spearman. MCC is a correlation coefficient and fits, but AUROC and AUPRC measure discrimination
  across thresholds rather than error against measurements. statistical-fit is assigned as the nearest
  term. The vocabulary has no term for classification metrics (accuracy, F1, AUROC, AUPRC, MCC), so every
  labelled-classification benchmark will either force statistical-fit or abstain.

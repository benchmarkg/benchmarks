description: 'The semantic leaderboard''s entrants are supervised 3D networks trained on the ScanNet++
  train split (PTv3, OACNN, SPFormer, ''Implementation code can be found on Pointcept''). As in coco-003,
  no subject term describes a task-specific model trained on the benchmark''s own data, so domain-specialist-model
  (''built for one field'') is forced, although the specialisation is to a task rather than a discipline.
  The NVS entrants are a second misfit: NeRF and 3D Gaussian Splatting methods are optimised per scene
  on that scene''s training images (''Train your NVS method!''), so there is no trained model to name
  at all. generative-media-model is tagged for them on its literal INC (the entrant produces images and
  the score is a property of those images), but its examples are text-to-media generators, and a per-scene
  radiance field is not one. classical-algorithm is excluded because the parameters are learned.'

description: There is no stored evaluation set. Every battle is a fresh user prompt ('This crowdsourced
  method effectively gathers a diverse array of fresh user prompts'). generated-on-demand ('items are
  produced fresh per run rather than drawn from a fixed stored set') is the nearest term, as in roboarena-003,
  but it assumes a generator and claims contamination resistance 'by construction'. Here the items are
  written by the public, and access to the record is asymmetric. The public gets 'a fraction of the data',
  while model providers testing unreleased models receive conversation data 'to help them improve their
  models'. That is a route by which the evaluation distribution reaches some entrants' training, which
  the term's 'by construction' denies. No access term describes crowd-improvised items whose record is
  shared selectively.

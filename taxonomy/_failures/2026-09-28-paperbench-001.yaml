description: 'PaperBench''s task is replicating published research: agents get a paper and must produce
  ''a codebase that replicates the paper'', which is then run and graded against an author-approved rubric
  of Code Development, Execution and Result Match leaves. The code family admits it (a codebase is submitted,
  run and verified). No subdomain names research replication. code/ml-engineering (''Building or improving
  a machine-learning pipeline, scored on the performance of the model it produces'') is the forced fit:
  the papers are ML papers and the agents build ML pipelines, but the score is rubric coverage of a paper''s
  contributions, not the performance of a produced model. agents-tooluse/research-agents is about gathering
  and citing sources for an open question. general-intelligence/open-ended-discovery rewards novelty,
  and replication rewards the opposite. The same gap will hold CORE-Bench (one of HAL''s constituents)
  and any paper-reproduction benchmark outside ML.'

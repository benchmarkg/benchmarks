description: The semantic tracks ask for 'a semantic label for each vertex of the 3D mesh' (top 100 classes,
  Top-1 and Top-3 IoU against multi-label ground truth), and the instance track for RLE-encoded vertex
  masks scored by AP25/AP50/AP. vision/segmentation is 'Assigning a category label to every pixel or region
  of an image', and a laser-scan mesh is not an image. vision/3d-reconstruction and vision/depth-geometry
  score geometry, not labels. vision/driving-perception-3d is restricted to vehicle-mounted sensors, and
  vision/detection is 'within an image'. vision/segmentation is the nearest term and is assigned, but
  the vocabulary has no subdomain for 3D semantic or instance scene understanding on point clouds or meshes
  (ScanNet, ScanNet200, ScanNet++, S3DIS).

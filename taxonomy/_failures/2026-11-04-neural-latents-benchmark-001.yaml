description: "NLB'21 scores latent variable models of neural population activity by co-smoothing: given
  the held-in neurons of test trials, predict the firing rates of held-out neurons, scored as Poisson
  bits per spike, with forward prediction of future bins as a secondary score. Nothing external is recovered,
  so neuroscience-decoding (recovering a stimulus, intention or behavioural variable from recorded activity)
  fits only the secondary hand-velocity decoding metric; brain-model-alignment (a model's representations
  predicting neural responses to the same inputs) does not fit, since no stimulus is given to the model
  and its internals are not compared with the brain. The paper sets NLB apart from both decoding benchmarks
  and Brain-Score. Filed as neuroscience-decoding (nearest: the input is recorded activity and one scored
  metric is decoding). Other benchmarks of neural dynamics models, such as the Computation-thru-Dynamics
  Benchmark, would share the proposed leaf."

description: The site evaluates 'ML and physics-based weather forecasting models in a like-for-like fashion',
  and its participating-models table lists IFS HRES, IFS ENS and the ERA5 hindcasts as 'Physics-based'
  rows beside the ML models. classical-algorithm's inclusion test is 'the entrant contains no learned
  component and is included for comparison', which these rows meet, and its exclusion test removes only
  a classical system that 'provides the ground truth'. The IFS forecasts are not the ground truth (ERA5
  is, except for operational models scored against their own analysis). The subjects.yaml example nevertheless
  rejects classical-algorithm for WB2 as a near miss ('the comparator the field is measured against rather
  than as a competing entrant'), because the headline scorecard is expressed relative to IFS HRES. The
  definition does not say whether a baseline that is also the scorecard's reference is an entrant. The
  example is followed and classical-algorithm is not tagged. ChaosBench, whose physics-based baselines
  are plotted alongside the ML models, is tagged the other way.

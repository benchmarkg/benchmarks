description: "ASVspoof scores countermeasures that tell bona fide speech from spoofed or deepfake speech
  (synthesis, conversion, replay, adversarial), alone (2015, 2017, 2021 DF, ASVspoof 5 Track 1) or joined
  to a speaker verifier (2019-2021 LA and PA by t-DCF, ASVspoof 5 Track 2). speaker-tasks (identifying,
  verifying, diarising or separating speakers) covers the verification half but not stand-alone detection,
  which decides nothing about who is speaking. No other leaf fits: audio-event-understanding asks which
  sound events are present, multimodal/audio-language scores audio against text, safety-alignment scores
  an AI system's own conduct or hazardous capability rather than a detector's error rates, agents-tooluse/cybersecurity-offense-defense
  is agentic vulnerability work, and there is no security family. Primary is speaker-tasks on the series'
  own framing (protecting ASV). The gap will recur for other speech deepfake-detection benchmarks (ADD,
  In-the-Wild, MLAAD) and for image and video forgery detection."

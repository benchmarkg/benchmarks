description: The task claims to evaluate 'general capabilities of machine translation (MT) systems' and
  scores cross-lingual meaning preservation through human ESA/MQM error annotation against the source
  document. No capability term names translation or cross-lingual transfer. generation-fidelity is the
  nearest fit ('How closely generated output matches a reference or a stated specification', whose INC
  allows 'human preference for faithfulness'). But ESA annotates errors against the source text rather
  than measuring similarity to a target, and the human score does not use the reference at all. context-integration
  fails because the benchmark scores no use of supplied context beyond the source, which is the task input
  itself. memory-retention is excluded for the long-context literary domain because 'length is a property
  of the prompt'. generation-fidelity is assigned as the near fit, and every MT benchmark will need the
  same escape hatch.

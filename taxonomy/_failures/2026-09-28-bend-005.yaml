description: 'BEND generates no data (''As no new data was generated in this study''). Every label is
  reused from public scientific resources: ENCODE ChIP-seq and DNase peaks, GENCODE gene annotation, CRISPR-screen
  enhancer sets (Fulco, Gasperini), DeepSEA/GRASP eQTLs and ClinVar. For the ENCODE-derived tasks, experimental-measurement
  fits the ground truth, though its definition has in mind an experiment run for the benchmark (''as wet-lab
  challenges do''). GENCODE is curated annotation and ClinVar holds clinical-submission assertions. Neither
  is an experiment, an instrument recording (real-world-instrument), web scraping or expert authoring
  for the benchmark. experimental-measurement is assigned as the nearest term. The vocabulary has no term
  for labels derived from curated public databases, which is the normal case in computational biology.'

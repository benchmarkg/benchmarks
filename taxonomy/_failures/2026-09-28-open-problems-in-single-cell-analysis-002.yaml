description: Open Problems benchmarks analysis methods on computational tasks (integration, denoising,
  annotation, deconvolution, modality prediction) and claims no cognitive capability. Its own vocabulary
  is 'formal, reproducible benchmarks' that 'rank the methods'. Label projection might look like inductive-reasoning,
  but it is a supervised classifier trained on a reference, which is not 'a rule ... inferred' from observations
  and scored as a rule. The perturbation task could support causal-reasoning, but it is one task of 13
  and the platform makes no such claim. With no term claimed by the source, the field abstains, and the
  capability gap for scientific-method benchmarks recurs.
proposed_term: scientific-data-analysis

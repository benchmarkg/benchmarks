description: 'code/ml-engineering (''Building or improving a machine-learning pipeline, scored on the
  performance of the model it produces'') describes MLE-bench exactly. But its family''s INC does not
  admit it: code is primary only ''if what is submitted is code and correctness is judged by running,
  testing or verifying it'', and MLE-bench scores a predictions file (''Answers for competitions must
  be submitted in CSV format'') against held-out labels. The code is never run by the grader, and code
  is checked only for plagiarism. agents-tooluse''s INC (''what an autonomous loop achieved using tools'')
  does admit it, and its EXC (scored artifact is software) does not bite on a CSV. The corpus files the
  entry under agents-tooluse, where no subdomain names ML engineering, and long-horizon-autonomy is the
  nearest. So the subdomain that fits sits in a family whose test rejects the benchmark. code/ml-engineering
  is assigned on the subdomain definition. This is the mirror image of swe-bench-verified-001, where the
  subdomain and its family''s exclusion disagreed the other way.'

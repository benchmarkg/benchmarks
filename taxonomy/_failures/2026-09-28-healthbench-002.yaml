description: capabilities.yaml cites HealthBench as a qualifying example of communication ('Physician-authored
  rubrics score whether the reply communicates to the patient'). The term's inclusion test requires that
  'the score depends on what the recipient understood or did, not on properties of the message alone'.
  HealthBench's communication-quality axis 'captures whether the response is well-structured and concise,
  and whether it uses a level of technical depth and vocabulary that is well-matched to the user'. That
  is a property of the message, judged by a model grader, and no recipient takes part. The example and
  the inclusion test disagree. Under 02 S11 rule 2 the test governs, so communication is not tagged. The
  example should be corrected, or the test widened to cover audience-appropriateness.

description: "No rule draws the boundary between reasoning-general/spatial-reasoning and multimodal/visual-qa,
  and SpatialViz-Bench passes both primary tests. Its 1,180 multiple-choice items are questions about
  rendered diagrams (cube stacks, nets, solids, mechanisms). reasoning-general's test is met because the
  paper studies spatial visualization as a cognitive ability in its own right ('spatial visualization
  tasks are often buried under broader categories like mathematical or logical reasoning'), and the leaf
  admits relations 'presented textually or diagrammatically'. multimodal's test is met because every item
  is answered in language about an image, and the paper shows a text-only model at chance. Neither exclusion
  removes it: reasoning-general excludes reasoning applied to a field with its own family, which a modality
  family is not, and multimodal excludes only single-modality scoring. The leaf's 'diagrammatically' and
  MapEval's entry (geospatial-reasoning primary, multimodal/visual-qa secondary) were followed. The same
  question arises for MindCube, VSI-Bench, MMSI and the other image or video spatial-intelligence benchmarks
  that EASI groups together."

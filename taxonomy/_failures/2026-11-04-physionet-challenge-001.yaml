description: "The PhysioNet Challenges pose a new clinical problem on physiological recordings (ECG, phonocardiogram,
  EEG, polysomnography) every year since 2000. medicine-health has no leaf for tasks on physiological
  waveforms: diagnosis-triage ('a diagnosis or an urgency assessment from a presented case') takes the
  diagnostic and screening editions (2016-2017, 2020-2022, 2024-2025) and, by stretching, the prognostic
  ones (2023 coma outcome, 2026 future cognitive impairment); ehr-prediction is limited to structured
  record data and takes only 2012 and 2019. Measurement, detection and reconstruction editions (RR-interval
  modelling 2002, QT intervals 2006, T-wave alternans 2008, fetal ECG 2013, heart-beat detection 2014,
  ECG digitisation 2024) fit no medicine-health leaf, and biology-genetics/neuroscience-decoding and audio-speech
  exclude them by their clinical endpoint. diagnosis-triage is assigned primary with the per-edition leaves
  secondary; a leaf for detection, measurement and prediction from physiological signals (other ECG, EEG
  and wearable benchmarks will meet the same line) would hold the series without stretching."
proposed_term: medicine-health/physiological-signal-analysis

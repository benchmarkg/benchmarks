description: "HVTB scores reward hacking: whether an agent working on one of Terminal-Bench 2.1's 89 tasks
  reads the reference solution or the held-out tests planted in an admin/ directory of its container,
  as flagged by inotify watchers, reported as a hack rate over tasks per model and prompt class (arXiv
  2608.22103 v1). The paper defines reward hacking as satisfying a task's checks while violating its intent.
  No safety-alignment leaf names it. deception-scheming ('pursues concealed goals or misleads its operator
  about its own behaviour') is the nearest and is assigned: the hack is a shortcut against the designer's
  intent, the project page shows agents whose final reports omit or misstate the read, and the taxonomy
  places Apollo's Covert Email Reranking (manipulating a scoring script) there. But a read counts whether
  or not the agent discloses it, so concealment is not what is scored. control-oversight (no supervisory
  mechanism is under test; the watchers are the measurement), evaluation-awareness (detecting the test
  is not scored), honesty-truthfulness (no assertion is scored), agentic-harm (the tasks are benign) and
  value-alignment (no normative standard is stated) were checked. A reward-hacking or specification-gaming
  leaf would also hold the reward-hacking benchmarks the paper compares (ImpossibleBench, EvilGenie)."
proposed_term: safety-alignment/reward-hacking
blocking: false
route: stage-4

description: "FigCodeBench gives a multimodal LLM a scientific figure and asks for Python, MATLAB, R or
  LaTeX code that reproduces it. The grader renders the code and compares the render with the figure (PSNR,
  SSIM, LPIPS, CIEDE2000 and a three-MLLM jury's similarity score, MMOS, which heads the leaderboard),
  and compares the code with the reference code (CrystalBLEU, AST similarity, plotting-API F1), which
  the paper calls complementary diagnostics. multimodal's inclusion test (generating in one modality from
  another, scored on correspondence) and code's (software authored, run and scored on what it computes)
  both read true, and code's exclusion of code that is the means to a result in another field does not
  say whether a figure is such a result. No code leaf fits: function-synthesis needs tests that judge
  behaviour, and the code is run once to render. The entry takes multimodal/any-to-any-generation as primary
  with no code secondary. The same boundary decides every image-to-code and chart-to-code benchmark (Plot2Code,
  ChartMimic, Design2Code, MatPlotBench); the verilogeval record covers code scored as a circuit or a
  shape, not as an image. A clause in either family's exclusion test, or a code leaf for code judged by
  its rendered output, would settle it."

description: 'Metriq and the QED-C suite measure quantum hardware: entanglement quality (BSEQ), error
  per layered gate (EPLG), mirror-circuit polarization, circuit throughput (CLOPS), and normalized result
  fidelity on application circuits (QFT, QAOA, QML kernel, Hamiltonian simulation). The paper itself says
  the composite ''is not a physical fidelity, and not an estimator of a single latent hardware capability''.
  Every capability term describes a competence of an intelligent system: reasoning forms, perception,
  control, planning, learning, calibration and conduct. None applies to the gate error or throughput of
  a device. optimization is the nearest for LR-QAOA, but the score is the device''s output fidelity on
  a fixed optimisation circuit, not a system optimising an objective. The vocabulary cannot express what
  this benchmark measures. This may be a corpus scope defect rather than a vocabulary gap, because the
  entry is not a benchmark of AI systems, and the synthesis should decide which.'

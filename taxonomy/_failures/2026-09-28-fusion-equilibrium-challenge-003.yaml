description: The inputs are real-world-instrument (coil currents and Thomson-scattering profiles recorded
  on DIII-D and MAST shots), and that is assigned. The ground truth is neither measured nor simulated.
  It is the output of EFIT, the standard equilibrium-fitting code, run on each shot's magnetic measurements
  ('Its output is the ground truth you are scored against'). experimental-measurement ('Ground truth was
  produced by running a physical experiment') misses the inversion step. simulation-generated ('from a
  physics or environment simulator') misses the measurements, and EFIT is an inverse solver, not a simulator.
  model-generated means a machine-learning model. The vocabulary has no provenance for labels produced
  by a reference analysis code applied to instrument data. That provenance matters because the labels
  carry EFIT's own error, and it recurs for reanalysis-scored weather benchmarks (ERA5) and for any benchmark
  scored against a standard reconstruction pipeline.

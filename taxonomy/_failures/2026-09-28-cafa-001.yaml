description: 'CAFA scores predicting a protein''s Gene Ontology functions from sequence against annotations
  that appear later. No capability term carries it. knowledge-recall does not apply, because the answer
  is not held knowledge (it does not exist yet). probabilistic-forecasting is the closest: predictions
  carry scores and outcomes resolve later. But its exclusion covers answers that already exist (the protein''s
  function exists, only the annotation is missing), and CAFA''s Fmax sweeps thresholds rather than scoring
  the numbers as probabilities. calibration-uncertainty needs the confidence itself to be scored. The
  benchmark therefore has no legal capability, and the gap recurs for every biological property-prediction
  entry.'

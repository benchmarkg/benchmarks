description: 'The black-box track scores two things jointly: accuracy (R^2, which is statistical-fit)
  and model size, counted as expression complexity after sympy simplification. The paper reports them
  as accuracy-complexity trade-offs (''the ability of each method to learn models with low error and low
  complexity''), and the 2025 edition ranks on accuracy-size Pareto fronts. Complexity is not an error
  against ground truth (statistical-fit), not a discipline-named metric (domain-metric), not a battery
  of pass/fail conditions (constraint-check) and not an aggregation of different methods (composite).
  The vocabulary has no method for a parsimony or size measure of the produced artifact, so half of the
  black-box score is unrecorded. The same gap applies to any benchmark that scores accuracy against model
  size or cost.'
proposed_term: model-complexity-measure

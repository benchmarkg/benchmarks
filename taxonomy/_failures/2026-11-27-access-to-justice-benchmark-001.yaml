description: "The Access to Justice Benchmark scores whether a model can act as a first point of contact
  for a person with a civil legal problem and no lawyer: about a quarter of each rubric's criteria are
  facts the model must find out by asking a simulated client, and the rest, which the page calls legal
  information, apply a state's law to the person's facts or refer the person to named local legal aid
  programmes, court self-help centres or lawyer referral services. legal-reasoning (applying legal rules
  to facts to reach a determinate conclusion) covers the first part only; legal-document, policy-analysis
  and economically-valuable-work do not fit, and language/dialogue covers the conversation, not the subject.
  Immigration Bench (immigration-bench), persona questions on US immigration law scored on what an answer
  must confirm about the person, explain or recommend and avoid, has the same shape. Both entries use
  legal-reasoning as primary with language/dialogue secondary. A leaf for legal help to lay people (intake,
  legal information and referral, scored against expert rubrics) would hold both."

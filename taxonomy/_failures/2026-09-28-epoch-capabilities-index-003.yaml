description: 'ECI assigns one number per named model, pooling results produced under different conditions:
  ''In cases where there are multiple models with different evaluation settings, we take the max over
  these model performances.'' Its inputs mix Epoch''s own runs, ''benchmark-developer reported scores''
  and ''developer reports (i.e. model cards and technical reports)'', and the paper notes that external
  data ''generally do not use the same scaffold for different models''. The subject is therefore the model
  release, taken at its best observed elicitation, whether that was a developer-reported score on an older
  benchmark (HellaSwag, LAMBADA), a chat prompt or an agent run (OSWorld, SWE-bench Verified). base-model,
  instruction-tuned-model, reasoning-model and agent-scaffold each describe some rows and not the index.
  hosted-inference-endpoint is excluded, because ECI deliberately collapses serving path and settings
  into the model''s name, which is the opposite of that term''s point. The field abstains.'

  Beams3D and MTO2D (thermofluid topology optimisation) have been added since, ten in all. No subdomain
  holds most problems and the paper's claim is breadth across physics domains. structural-mechanical-design
  is primary as the largest group a leaf names (two of seven, four of ten), circuit-eda and physics/optics-photonics
  secondary. The heat-conduction, aerodynamic and thermofluid problems have no engineering-design leaf,
  as thermal and aerodynamic design generally has none. This is the second design-suite case after EngDesign
  (2026-11-18-engdesign-001)."

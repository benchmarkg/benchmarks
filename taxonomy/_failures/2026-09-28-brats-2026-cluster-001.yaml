description: Three of BraTS 2026's five challenges delineate tumour sub-regions in brain MRI, scored by
  Dice and Normalized Surface Distance against expert reference masks. medicine-health/medical-imaging-segmentation
  ('Delineating anatomical or pathological regions in medical images') fits by name. vision/medical-imaging-cv
  ('Computer-vision methods evaluated on medical images where the score is a vision metric rather than
  a clinical outcome') also fits. Dice and NSD are vision metrics, and no clinical outcome is scored.
  The medicine-health exclusion test ('do NOT tag it where medical images are used to test general vision
  methods') leans the same way. Against that, the proposal frames every region by its clinical use ('clinical
  practice characterizes the extent of resection based on removal of the contrast enhancing region'),
  and the organisers are clinical societies. The two subdomains are defined on opposite sides of 'vision
  metric versus clinical endpoint', but both name segmentation of medical images, so every medical-segmentation
  challenge (BraTS, KiTS, AMOS, the Medical Segmentation Decathlon) belongs equally to both. The corpus
  family (medicine-health) is followed here.

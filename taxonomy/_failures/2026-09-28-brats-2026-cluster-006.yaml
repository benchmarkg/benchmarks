description: 'BraTS runs annual editions (''the 15th BraTS cluster of challenges at MICCAI 2026''), which
  reads as periodic-recompetition: ''recurring editions, each with a fresh evaluation set''. But not every
  task gets a fresh set. For BraTS-METS the proposal says ''For the purposes of the challenge, we are
  utilizing the dataset used in 2025'', with a quality-control pass on the annotations. The task line-up
  also changes by edition: in 2025 there were 11 challenges, some since considered solved. So one cluster
  mixes re-competed tasks with fresh data, re-run tasks on reused data and new tasks. The terms do not
  decide whether that is periodic-recompetition or versioned-releases, and the field cannot vary by sub-challenge.'

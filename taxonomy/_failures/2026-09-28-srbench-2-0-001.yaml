description: SRBench v2.0 has two halves. There are 130 ground-truth problems from the Feynman Symbolic
  Regression Database and the ODE-Strogatz repository ('first principles models of physical systems'),
  and 122 black-box PMLB regression problems from health informatics, business, technology, environmental
  science and government. The only subdomain named for symbolic regression is physics/symbolic-regression-discovery,
  and it is assigned. But the physics family's inclusion test ('a physical observable, a simulation of
  a physical process, or research-level physics reasoning') is met only by the ground-truth half. The
  black-box half, which the paper treats as equally essential ('we consider it essential to also evaluate
  the performance of SR on real-world or otherwise black-box regression problems'), is tabular regression
  with no domain in the vocabulary. The mathematics family's test ('the answer is checked as mathematics
  -- a value, an expression or a proof') fits the scored artifact, a symbolic expression checked by sympy,
  but no mathematics subdomain describes recovering an expression from data, and symbolic-manipulation
  means transforming given expressions. Physics subject versus mathematical artifact is not decided by
  either family's tests, and a benchmark whose half is domain-free tabular regression has no home at all.
  The symbolic-regression subdomain sits under physics, which pre-empts the question rather than answering
  it.

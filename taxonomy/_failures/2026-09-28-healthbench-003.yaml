description: evaluation-methods.yaml cites HealthBench as a qualifying example of human-expert-eval ('Physician
  authorship and physician grading sit behind the rubric criteria'). The inclusion test requires that
  'qualified experts score outputs one by one and their ratings are the result'. In HealthBench the result
  comes from the model grader. Physicians wrote the criteria and graded model responses only for meta-evaluation
  on the consensus criteria ('We use this to evaluate the agreement of our grader with physician opinion').
  The example and the test disagree. rubric-graded and model-graded-judge carry the method, and human-expert-eval
  is not tagged. The vocabulary also has no way to mark that a model judge was validated against experts,
  which is what the example seems to want.

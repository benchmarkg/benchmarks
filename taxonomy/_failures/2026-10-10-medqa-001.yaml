description: MedQA's paper defines it as open-domain QA over a released textbook collection ('we
  prepared text materials from a total of 18 English medical textbooks'), under which
  knowledge-recall's exclusion applies (the benchmark provides the material) and context-integration
  is the nearer term. Nearly every later result (Vals AI's board, lm-evaluation-harness's
  medqa_4options) answers closed-book, which is knowledge-recall's case. capability is one list per
  benchmark, with no way to say which protocol a term belongs to, so the entry tags knowledge-recall
  for the dominant use and says so in the basis. The same split applies to any benchmark released
  with a retrieval corpus that is later run closed-book (e.g. HotpotQA's distractor and fullwiki
  settings, Natural Questions open).

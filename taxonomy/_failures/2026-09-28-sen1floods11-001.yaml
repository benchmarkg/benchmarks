description: Sen1Floods11 is binary water segmentation of Sentinel-1 SAR chips, scored by IoU against
  hand labels. earth-climate/remote-sensing ('Extracting land ... information from satellite ... imagery')
  and vision/segmentation ('Assigning a category label to every pixel') both fit fully. earth-climate's
  exclusion ('a generic vision task that happens to use satellite imagery') does not decide it. The task
  is generic per-pixel segmentation, but the scored quantity, surface and flood water, is a land-surface
  state. hazard-prediction names floods, but its definition is 'Predicting natural hazards', and Sen1Floods11
  maps inundation already visible in the image rather than predicting it. The paper's 'deep learning models
  to predict floods' uses the word loosely. The dataset is framed as 'a surface water data set', and the
  vocabulary has no hydrology or surface-water subdomain. The corpus family is followed, remote-sensing
  is primary and vision/segmentation is secondary, as for geo-bench-2-001 and brats-2026-cluster-001.

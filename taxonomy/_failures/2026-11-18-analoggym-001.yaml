date: '2026-11-18'
description: "AnalogGym scores the final design a sizing method reaches by simulating it: the testbench's
  SPICE analyses (DC, AC, pole-zero, transient) at the chosen PVT corners give the circuit's metrics,
  and for amplifiers FOM_AMP multiplies their ratios to the topology's baselines with a penalty for noise,
  temperature coefficient and offset worse than baseline. FOM_AMP is the suite's own figure, unbounded
  above, and the metrics it combines are circuit measures, so domain-metric fits only as the nearest term;
  simulation-rollout needs a bounded per-episode score, constraint-check excludes artifacts that must
  be executed to be judged, and execution-tests is for code under test. The entry takes domain-metric.
  This is the third benchmark, after open-catalyst-oc20-oc22 (2026-09-28-open-catalyst-oc20-oc22-002)
  and learn2design-2026 (2026-11-18-learn2design-2026-001), whose score comes from re-running a simulator
  on each submission."
proposed_term: simulator-reevaluation

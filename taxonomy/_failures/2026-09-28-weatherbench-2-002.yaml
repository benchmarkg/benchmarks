description: 'The probabilistic headline metric is CRPS, which domain-metric''s inclusion test names explicitly
  (''GDT-TS, lDDT, DockQ, mAP, FID, CRPS, IoU''). CRPS also meets uncertainty-calibration-score''s inclusion
  test: it ''consumes an emitted ... distribution'' (the ensemble members) and rewards spread as well
  as skill (''encourages spread''). The two definitions overlap on the single most common probabilistic
  weather metric, and nothing says which wins. uncertainty-calibration-score is assigned, because the
  paper treats CRPS and the spread-skill ratio together as the probabilistic, calibration-facing scores.
  The deterministic side has the same overlap in a milder form. statistical-fit names RMSE and ''anomaly
  correlation'' in its inclusion test, but its exclusion test removes a statistic ''standardised within
  a discipline under its own name'', and WB2 uses RMSE and ACC as the WMO and ECMWF define them (''this
  agrees with the definition of the RMSE used by the WMO and ECMWF'').'

description: 'BEND is seven genome-annotation tasks for DNA language models: gene finding (per-nucleotide
  exon, intron and splice-site labels from GENCODE), enhancer annotation, chromatin accessibility, histone
  modification, CpG methylation, and two noncoding variant-effect tasks. The family is clear (biology-genetics:
  nucleic acids). No subdomain holds the whole benchmark. regulatory-genomics (''regulatory activity such
  as expression level, chromatin state or transcription-factor binding directly from genomic sequence'')
  fits four tasks. genomics-variant-effect fits two, and it is recorded as secondary. Gene finding, which
  the paper calls ''a common task in genome annotation'', fits neither, nor transcriptomics or bioinformatics-analysis.
  The benchmark''s own claim is representation quality across annotation tasks, which no subdomain names.
  regulatory-genomics is assigned as the plurality fit. Multi-task genomic suites (BEND, GUE, Genomic
  Benchmarks, the Nucleotide Transformer tasks) will all land here.'

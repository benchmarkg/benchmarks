description: GSO asks an agent to make a real repository's code faster on a given workload while
  keeping its outputs equivalent, and scores whether the patch reaches at least 95% of an expert
  commit's speedup (OPT@1). No capability names finding and removing performance bottlenecks in
  existing code. optimization requires the score to be the objective's value, and here the score is
  a pass rate at a threshold against a human target, with speedups only a secondary metric;
  search-exploration and long-horizon-execution do not fit (no search budget is scored, and a failed
  attempt within an episode can be repaired). context-integration is tagged for using the supplied
  codebase and test, which leaves the performance claim itself unrecorded. The same gap applies to
  every code/code-performance-optimization benchmark, such as SWE-Perf and SWE-fficiency.
proposed_term: performance-engineering

  a simulation, research-level physics) does not fit. But the family's inclusion test asks for a submitted
  design, and only the four design topics (control system design 24, root-locus 7, Nyquist 5, loop-shaping
  4; 40 of 147) ask for one, a controller's gains or a compensator; the other 107 are analysis questions
  (stability ranges, step responses, Bode readings, margins, background mathematics) answered with a value
  or an expression. No engineering-design leaf covers engineering knowledge and problem-solving questions.
  process-control-optimization is assigned as the nearest and is forced: its definition names an industrial
  process against operating objectives, where ControlBench's plants are textbook transfer functions and
  a car's cruise control. The same gap will meet other engineering question sets (the 2026-09-23 scoping
  survey lists EngiBench, arXiv 2509.17677), as chemistry-materials met it with ChemBench (2026-11-04-chembench-001)."

description: The scored material is in three access states. (1) The released splits are public on Hugging
  Face with no gate ('we publicly release AgentHarm'), which is fully-open, but that is only 'At the moment,
  we release 44 out of 66 public test base behaviors (176 augmented ones) and 8 out of 11 validation base
  behaviors (32 augmented ones)', and the paper's main results are on the full public test set. (2) The
  private test split, 30% of the behaviors, is held by the maintainers ('AgentHarm is not contaminated,
  with 30% of the tasks withheld and never exposed to public LLM APIs'), and they run it themselves 'on
  our own deployment of frontier LLMs on Azure'. There is no server anyone submits to, so private-test-server
  fails, the frontiermath-tiers-erd-s-003 gap for a maintainer-held set with no submission path. (3) The
  licence restricts use rather than access ('The additional clause prohibits using the dataset and benchmark
  for purposes besides improving the safety and security of AI systems'). restricted-dual-use was tested
  and fails. It requires material 'deliberately withheld because releasing it would carry misuse risk',
  and the only stated reason for withholding is contamination. No reason is given for the 22 unreleased
  public behaviors or the unreleased jailbreak template. data.access is single-valued. fully-open is assigned
  for what a third party can obtain, as in healthbench (which also keeps a private held-out set). The
  vocabulary also has no term for a use-restricted licence on otherwise open safety data.
proposed_term: null

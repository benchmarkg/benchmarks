  excludes it because one subject holds all the items and sends it to that subject's family, but chemistry-materials
  has no leaf for knowledge and reasoning questions: its subdomains are all prediction, design or protocol
  tasks on molecules and materials. molecular-property-prediction is assigned as the nearest, since most
  of the 1,749 semi-automatic items ask for a property of a given molecule (NMR signal count, point group,
  oxidation state, hazard statement), but the exam and textbook items and the 1,000 preference questions
  are not property prediction. The GPQA Diamond Stage-3 record (2026-09-28-gpqa-diamond-001) already noted
  that chemistry-materials and biology-genetics have no subdomain for science question answering; MaCBench
  and other chemistry QA sets will meet the same gap."

description: 'ProteinGym''s headline track is zero-shot fitness prediction: ''predict experimental phenotypical
  measurements from a given assay, without having access to the labels''. No capability term carries it.
  It is not knowledge-recall (the quantity is an assay value, not held information) and not transfer-learning
  (no training setting is fixed). Only the supervised track''s extrapolation splits are expressible, as
  distribution-shift-generalization. The capabilities.yaml example tags ProteinGym as sample-efficiency
  (''Low- shot regimes are a scored condition''), but neither the NeurIPS paper nor the README scores
  a fixed low-shot budget. The paper lists ''using only a handful of proteins'' as a ''more challenging
  generalization task'' that ''this study does not delve into''. The example is not source-supported,
  and sample-efficiency is not tagged.'

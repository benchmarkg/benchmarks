description: HAL is not a benchmark with tasks of its own. It is 'a standardized evaluation harness' and
  a leaderboard over nine existing benchmarks 'in coding, web navigation, science, and customer service'
  (AssistantBench, CORE-Bench Hard, GAIA, Online Mind2Web, SciCode, ScienceAgentBench, SWE-bench Verified
  Mini, TAU-bench Airline, USACO). agents-tooluse is the right family, since every board scores what an
  agent achieved. But no subdomain describes a cross-benchmark agent suite, and web-navigation, tool-api-calling
  and research-agents each hold only some of the boards (recorded as secondary, with code/repository-scale-se
  and code/competitive-programming). general-intelligence/agi-composite-suites needs aggregation 'into
  a single general-capability score', and HAL publishes nine separate boards with no aggregate. It is
  also agent-specific rather than a claim of breadth. The family question sharpens this. Under 02 S11
  rule 5 the nine boards belong to their own benchmarks' families (two of them to corpus entries swe-bench-verified
  and bench), so HAL cannot be treated as a family whose tracks carry a domain. The corpus flags it as
  a 'meta-leaderboard that aggregates other benchmarks rather than a single benchmark'. The vocabulary
  has no legal primary for an aggregator. This is medhelm-001's gap without the single-field restriction,
  and it will block every multi-benchmark leaderboard (HELM-style suites, vendor-neutral evaluators).
proposed_term: agents-tooluse/agent-evaluation-suites
blocking: true
classification: holistic-agent-leaderboard-hal

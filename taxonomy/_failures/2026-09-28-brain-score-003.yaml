description: 'Neural Predictivity fits a PLS regression (25 components, on 1,000 PCA features) from model
  activations to each recorded neuroid on training images, then scores held-out images by Pearson r, median
  over neuroids and normalised by a noise ceiling. It reads as three terms at once. statistical-fit: the
  INC test lists correlation. domain-metric: ''Neural Predictivity'' and ''I2n'' are named, standardised
  measures of computational neuroscience with published definitions. model-derived-metric: the number
  depends on a fitted mapping model whose settings are part of the result, though it is fitted per submission
  rather than being a fixed scorer. statistical-fit is assigned because the final statistic is a correlation.
  The headline is also ''their average score across all the benchmarks'', so composite is assigned. Strictly,
  composite requires sub-scores ''produced by different methods'', and under the statistical-fit reading
  every sub-score shares one method. The two assignments are consistent only if Neural Predictivity and
  I2n count as different methods, which the vocabulary cannot say.'

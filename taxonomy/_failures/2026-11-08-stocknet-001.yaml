# taxonomy/_failures/2026-11-08-stocknet-001.yaml -- bench tag-gap (05 S3, 03 S3.3)
kind: missing-term
facet: capability
benchmark: stocknet
curator: agent (P1-S9-T06)
date: '2026-11-08'
description: "StockNet scores predicting a stock's next-day price movement (rise or fall) from tweets
  and five days of prices, by accuracy and MCC against movements that already happened in 2015. No capability
  term carries it. scientific-prediction is the nearest, but its definition is limited to physical, chemical,
  biological or Earth systems, and a market is none of them. probabilistic-forecasting is excluded because
  the outcomes already exist and a label, not a probability, is scored. temporal-reasoning concerns order
  and duration, not predicting a quantity from a time series (the cy-bench precedent). context-integration
  is tagged as the only legal term, loosely: the supplied tweets and prices are the inputs, but they do
  not determine the answer. The gap will recur for every finance-forecasting entry (prices, returns, volatility,
  risk). Widening scientific-prediction to economic systems, or adding a term for forecasting a quantity
  from a series, would close it. Not blocking, because one capability is legal."
proposed_term: series-forecasting
blocking: false
route: stage-4

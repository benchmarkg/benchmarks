description: Digital Typhoon's forecasting tasks predict an existing tropical cyclone's central
  pressure 1 to 24 hours ahead and whether it becomes extra-tropical 24 hours ahead, from satellite
  images, scored against the JMA best track. earth-climate/weather-forecasting ('Predicting
  atmospheric state at a stated lead time, scored against observed weather') fits, and so does
  earth-climate/hazard-prediction ('Predicting natural hazards such as floods, wildfires, landslides
  or earthquakes'), since a tropical cyclone is a hazard; remote-sensing's exclusion test sends
  'forecasts an event before it happens' to hazard-prediction. hazard-prediction has no inclusion or
  exclusion test, so nothing says whether forecasting the evolution of a hazard already under way
  (intensity, transition) is hazard prediction or weather forecasting, or whether hazard-prediction
  is only for occurrence and impact (formation, landfall damage). The entry records
  weather-forecasting as secondary and as the forecasting subsets' domain_override, and rejects
  hazard-prediction, because the targets are atmospheric state variables and the proposed formation
  and impact tasks are not benchmarked.

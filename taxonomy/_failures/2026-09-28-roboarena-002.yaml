description: physical-robot-system is 'a complete robot -- policy, body and sensors -- evaluated on real
  hardware', and rl-policy's EXC sends any policy running on hardware to it. In RoboArena the entrant
  is only the policy, served from a remote policy server. The body and sensors belong to the evaluator
  ('We host all policies in our pool on remote servers'), and they are standardised (DROID) so that they
  are not part of what is compared. The subject is therefore a hardware-agnostic learned policy evaluated
  on someone else's standard hardware. physical-robot-system over-includes the body, and rl-policy is
  excluded by its own EXC. The vocabulary has no term for a policy evaluated on shared standard hardware.
proposed_term: policy-on-standard-hardware

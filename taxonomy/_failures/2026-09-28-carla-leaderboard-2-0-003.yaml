description: 'simulation-rollout''s definition is ''success rate over episodes run in a simulator''. CARLA''s
  driving score is route completion multiplied by a geometric infraction penalty (for example ''Collisions
  with pedestrians -- 0.50''), averaged over routes. It is bounded at 100, but it is not a success rate.
  composite needs sub-scores ''produced by different methods'', and both factors come from the same rollout.
  constraint-check needs ''any failure invalidates'', and infractions only discount the score. The leaderboard''s
  own history shows why the distinction matters: the exponential penalty rewarded stopping early, and
  2.1 made it linear. The metric''s form changes what is being measured, and simulation-rollout cannot
  record it. The same partial-credit gap appears in BEHAVIOR.'

description: 'EPDMS is a weighted, multiplicative combination of rule checks (NC, DAC, DDC, TLC) and graded
  subscores (EP, TTC, LK, HC, EC), so composite and constraint-check are tagged. What produces those subscores
  is neither term. It is pseudo-simulation: real logs augmented with 3D Gaussian Splatting views, a 4-second
  non-reactive LQR rollout, and a second stage over pre-computed follow-up scenes weighted by a Gaussian
  kernel. simulation-rollout needs ''success rate over episodes run in a simulator'' and excludes nothing
  here, but it is not a success rate and not an episode run. The paper''s contribution is a new evaluation
  method, and the vocabulary has no slot for it. Two further subscores escape constraint-check: EP ranges
  over [0, 1], and the human filter disables penalties the human log also incurs.'
proposed_term: pseudo-simulation

description: 'GEO-Bench-2 scores classification, semantic segmentation, pixel regression, detection and
  instance segmentation on 19 Earth-observation datasets, using the standard vision metrics (Jaccard,
  accuracy, F1, RMSE, mAP). earth-climate/remote-sensing (''Extracting land, ocean or atmospheric information
  from satellite or airborne imagery'') fits by definition. vision''s inclusion test (''the score measures
  what was recovered from ... an image'') fits equally, and its segmentation, classification and detection
  subdomains name the tasks. The deciding test is earth-climate''s exclusion: ''Do NOT tag this if the
  subject is a generic vision task that happens to use satellite imagery''. That test does not say when
  a task is generic. Land cover, crop type, biomass, glacier zones and flood extent are Earth-surface
  quantities, but SpaceNet building footprints, EverWatch bird detection and NZCattle cow detection are
  generic object detection on aerial photos, and the paper''s own finding is that ImageNet-pretrained
  ConvNeXt and DINOv3 lead the high-resolution RGB tasks. This is the boundary brats-2026-cluster-001
  found between medicine-health and vision. The corpus family and the domains.yaml example (earth-climate)
  are followed, and the vision subdomains are recorded as secondary.'

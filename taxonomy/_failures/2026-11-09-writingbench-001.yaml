description: WritingBench scores the quality of written text against five criteria generated per
  query (coherence, depth, use of supplied material, style, format, length, and for Literature &
  Arts craft). No capability term names writing quality. generation-fidelity needs a reference or
  source to match, creativity-novelty needs a reward for departure from known work,
  instruction-following needs the source to claim instruction following (it calls style, format and
  length writing requirements graded by degree), communication needs a recipient who acts. Only
  context-integration is expressible, for the supplied materials. The same gap affects any
  rubric-judged writing or creative-writing benchmark in language/generation and
  language/creative-writing.

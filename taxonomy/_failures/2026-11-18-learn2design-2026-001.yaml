description: "Learn2Design scores what a submitted optimiser finds by running the competition's simulator
  on it: each setup the algorithm logs is evaluated by Differometor, and a run's score is the lowest loss
  among the setups that pass the power checks, the loss comparing the design's broadband strain sensitivity
  with the Voyager reference detector on a log scale. The loss is the competition's own, unbounded below
  (negative beats the reference), not a measure standardised across gravitational-wave instrumentation,
  so domain-metric's inclusion test ('named and standardised within a discipline') is met only loosely;
  simulation-rollout needs a bounded per-episode success score, and statistical-fit compares with measurements.
  The entry takes domain-metric. This is the second benchmark after open-catalyst-oc20-oc22 (2026-09-28-open-catalyst-oc20-oc22-002)
  whose score comes from re-running a simulator on each submission, and every design benchmark scored
  by simulating the submitted geometry, circuit or apparatus will meet it."

description: '''There are two primary ways to use HarmBench: (1) evaluating red teaming methods against
  a set of LLMs, and (2) evaluating LLMs against a set of red teaming methods.'' Use (2) has a subject
  term: the target LLMs are chat models and instruction-tuned-model fits. Use (1) makes an attack method
  the entrant (GCG, PAIR, TAP, AutoDAN and 14 others), scored by ''its attack success rate (ASR) on a
  given target model'', and new attacks are added by implementing ''the RedTeamingMethod class''. No subject
  term describes an attack or other procedure applied to a model. classical-algorithm covers non-learned
  methods competing on the task, but an attack is neither learned nor competing on the task, and agent-scaffold
  describes a harness wrapping a model. The same gap recurs for unlearning methods (wmdp-002) and for
  the attacks and defenses AgentHarm evaluates (agentharm-004).'

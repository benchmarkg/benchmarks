description: domains.yaml settles VBench (1.0) as vision because 'the sixteen scored dimensions are properties
  of the video, not of its agreement with the prompt' (multimodal near-miss) and 'Generated video scored
  on sixteen dimensions of the video itself' (vision example). VBench-2.0 changes that. Seven of its eighteen
  dimensions are Controllability, which 'measures how accurately the model can render specific entities,
  events, content, and camera movements in response to detailed textual instructions', and they are scored
  by checking the video against the prompt ('the LLM will determine whether the standardized description
  matches the ground truth'). The Physics dimensions compare the video with GPT-4o descriptions derived
  from the prompt. Human Fidelity, Diversity and Multi-View Consistency are properties of the video alone.
  Vision's EXC makes the test 'whether crossing between the modalities is what is scored', and here it
  is for roughly half the Total Score and not for the rest. vision/video-generation is assigned on the
  benchmark's own framing (faithfulness of the generated video), with multimodal/any-to-any-generation
  as secondary. The test does not say what share of prompt-correspondence scoring moves a text-to-video
  benchmark across the line. The taxonomy's example ref 'vbench' also names the predecessor, not this
  entry.

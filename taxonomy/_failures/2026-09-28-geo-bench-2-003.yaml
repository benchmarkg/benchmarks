description: The evaluated systems are pretrained backbones fine-tuned per dataset. EO-specific GeoFMs
  (TerraMind, Prithvi, Clay, DOFA, Satlas) fit domain-specialist-model. The paper deliberately includes
  'foundational general-purpose computer vision models like the latest DINOv3' and ImageNet ConvNeXt and
  ResNet backbones 'to explore their generalizability to EO tasks', and these lead several capability
  groups. domain-specialist-model excludes them ('Do NOT tag this if a general model is merely evaluated
  on domain content'). base-model, instruction-tuned-model and the other subject terms describe language
  models, agents or robots. The vocabulary has no subject for a general-purpose pretrained vision backbone
  evaluated by fine-tuning, which is the standard subject of vision and remote-sensing benchmarks.
proposed_term: pretrained-vision-backbone

description: The benchmark calls itself an evaluation of 'video understanding', and vision/video-understanding
  is defined as 'Recognising actions, events or content across the temporal extent of a video'. That describes
  Levels 1 and 2 exactly. vision's EXC sends questions answered about visual content to multimodal, and
  multimodal/video-language ('the correspondence between the two is what is scored') is assigned. But
  the subdomain vision/video-understanding then has no reachable member evaluated by question answering.
  Nearly every modern video-understanding benchmark (Video-MME, MVBench, LongVideoBench) is multiple-choice
  QA, so the vision subdomain holds only classification-style benchmarks, and its definition does not
  say so. The two subdomains overlap on the benchmark's own self-description.

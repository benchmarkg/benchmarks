description: 'LUNA16 scores pulmonary nodule detection in chest CT by FROC sensitivity against a reference
  standard of nodules marked by at least 3 of 4 radiologists. The corpus files it under medicine-health,
  and the motivation is clinical (lung cancer screening). But no medicine-health subdomain describes lesion
  detection. medical-imaging-diagnostic needs ''a diagnostic conclusion'', and a nodule is a finding ''which
  may or may not represent early stage lung cancer'', not a diagnosis. medical-imaging-segmentation needs
  delineation, and LUNA16 scores point locations. The medicine-health EXC (''do NOT tag it where medical
  images are used to test general vision methods'') also points away: the false positive reduction track
  was added ''to encourage the participation of teams with experience in image classification tasks but
  no particular background on the analysis of medical images''. vision/medical-imaging-cv (''the score
  is a vision metric rather than a clinical outcome'') fits, and so does vision/detection by name. vision/medical-imaging-cv
  is assigned. This is the BraTS-001 gap from the other side: medical segmentation belongs equally to
  two families, and medical detection has a home only in vision, so every CAD-detection challenge (LUNA16
  and its predecessor ANODE09 among them) leaves medicine-health.'
proposed_term: medicine-health/medical-imaging-detection

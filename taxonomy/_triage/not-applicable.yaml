# taxonomy/_triage/not-applicable.yaml -- the applicable-or-not triage of every coarse cell (P1-S12-T09;
# 12 S5.4, 03 S7.1, 02 S4.3)
#
# 12 S5.4: "A cell can be declared not applicable -- the question it asks is incoherent for that family -- and a
# declared cell leaves both the numerator and the denominator of every coverage figure". 03 S7.1: "every coarse
# cell must be triaged as applicable or not applicable before any gap claim publishes ... A cell declared
# not-applicable carries the declaring curator, the date and a one-line reason, exactly like a failure record,
# so the declaration is auditable and reversible when a field moves."
#
# One row per cell of the coarse grid, the 19 families of taxonomy/domains.yaml crossed with the 13 groups of
# taxonomy/capability_groups.yaml: 247 rows, each with a `verdict` (applicable or not-applicable), a
# one-sentence `rationale`, `declared_by` and `declared_on`. A new family or group adds cells, and the pull
# request that adds it triages them here. tools/build/coverage_states.py reads the file (a not-applicable cell
# reads `not-applicable` and leaves the coverage figures) and scripts/check_na_cells.py checks it: every cell
# listed once, no not-applicable cell occupied, chemistry-materials x autonomy-and-oversight never declared, no
# group or family declared wholesale.
#
# Why here and not at taxonomy/not-applicable.yaml, the path P1-S12-T09 names: schema/taxonomy.py loads every
# taxonomy/*.yaml as a vocabulary through a model, and a new model there is a schema change, which resets the
# schema freeze scripts/check_schema_churn.py measures and, past entry 60, fires stopping rule (b) (14-roadmap).
# This file is a record, not a vocabulary, so it sits beside the failure records in taxonomy/_failures/.
#
# The test applied. A cell is declared only when no benchmark could carry a term of the group while sitting in
# the family, as its primary or as a secondary. Secondaries matter because 02 S11 rule 1 decides a cell's state
# "by presence at any weight": a safety benchmark with a biology secondary puts biology x
# conduct-and-cooperation in has-benchmarks, so that cell's question cannot be incoherent. The 147 cells an
# entry occupied on 2026-11-16 are applicable by evidence, and each row names one occupying entry. None of the
# 100 empty cells failed the test, so no cell is declared. 02 S4.3 expected roughly twenty structural false
# gaps in autonomy-and-oversight and conduct-and-cooperation across the science rows; each of those cells has a
# coherent benchmark shape (biosecurity and chemical uplift refusal, autonomous experimentation), and the
# false-gap risk is carried instead by tools/build/coverage_states.py: an empty cell with no dated survey note
# reads not-yet-surveyed and can never be published as a gap (02 S11 rule 6, 12 S5.4). The three closest calls
# are marked "the closest call in the row". A reviewer may set any empty cell's verdict to not-applicable with a
# rationale; a not-applicable cell that a later entry occupies fails scripts/check_na_cells.py until the
# verdict is withdrawn.
#
# Status: agent-drafted (P1-S12-T09's executor is agent-draft). A person accepts or amends each verdict.


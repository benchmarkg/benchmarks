      whether the protein is predicted with it (co-folding) or given (re-docking), and whatever the method. The
      entry stays in biology-genetics even where the corpus files it under chemistry-materials, because the pose
      is a property of the protein complex.
    exclusion_test: Do NOT tag this if nominated compounds are scored by what an assay returns (`chemistry-materials/experimental-hit-finding`),
      if only binding strength is predicted with no structure (`drug-target-interaction`), or if the partner is
      another protein (`protein-protein-interaction`) or a nucleic acid (`nucleic-acid-structure`).
  - id: biology-genetics/protein-function-prediction

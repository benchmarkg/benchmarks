  - id: society-econ-law/economically-valuable-work
    label: Economically valuable work
    definition: Completing tasks drawn from real paid occupations, scored by expert comparison against human work
      product.
  - id: safety-alignment/dangerous-capability-evals
    label: Dangerous capability evaluations
    definition: Measuring whether a system possesses capabilities that would be dangerous in the wrong hands.
  - id: safety-alignment/jailbreak-robustness
    label: Jailbreak robustness
    definition: Measuring resistance to adversarial prompts constructed to bypass safety training.
  - id: medicine-health/ehr-prediction

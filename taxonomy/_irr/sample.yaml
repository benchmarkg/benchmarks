vocabularies:
  domains:
  - id: reasoning-general/planning
    label: Planning
    definition: Constructing a sequence of actions that achieves a stated goal, where plan construction is itself
      the object of study.
  - id: robotics-embodiment/sim2real-transfer
    label: Sim-to-real transfer
    definition: Measuring how much of a policy's simulated performance survives deployment on physical hardware.
  - id: safety-alignment/bias-fairness
    label: Bias fairness
    definition: Measuring systematic differences in behaviour across demographic or social groups.
  - id: medicine-health/clinical-task-suites
    label: Clinical task suites
    definition: Suites whose scored tasks span several of the medicine-health family's subdomains, reported per
      task or as one aggregate, where the suite's own claim is coverage within the family.
    inclusion_test: Tag this as PRIMARY if the tasks span two or more of the medicine-health family's subdomains,
      no one subdomain holds most of them, and the benchmark's own claim is breadth within the family. Record the
      subdomains the tasks fall in as secondary.
    exclusion_test: Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and the
      others secondary), or if the suite spans several families, which is `general-intelligence`.
  - id: physics/optics-photonics
    label: Optics photonics
    definition: Designing optical and photonic systems or predicting their behaviour.
  - id: agents-tooluse/negotiation
    label: Negotiation
    definition: Tasks scored on the outcome of a bargaining interaction between parties with conflicting objectives.
  - id: physics/plasma-fusion
    label: Plasma fusion
    definition: Predicting or controlling plasma behaviour in fusion devices.
  - id: biology-genetics/drug-target-interaction
    label: Drug target interaction
    definition: Predicting whether a compound binds a specified biological target and how strongly.
  - id: vision/ocr-handwriting
    label: OCR and handwriting
    definition: Transcribing printed or handwritten text in images into character sequences.
  - id: chemistry-materials/drug-discovery-admet
    label: Drug discovery admet
    definition: Predicting absorption, distribution, metabolism, excretion or toxicity properties of candidate drug
      molecules.
  - id: medicine-health/diagnosis-triage
    label: Diagnosis triage
    definition: Producing a diagnosis or an urgency assessment from a presented case.
  - id: robotics-embodiment/manipulation
    label: Manipulation
    definition: Controlling a robot arm or gripper to change the physical state of objects.
  - id: biology-genetics/transcriptomics
    label: Transcriptomics
    definition: Inferring a biological state or condition from bulk gene-expression measurements.
  - id: society-econ-law/financial-analysis
    label: Financial analysis
    definition: Answering analytical questions over financial documents and statements.
  - id: biology-genetics/protein-design
    label: Protein design
    definition: Generating novel protein sequences intended to satisfy a structural or functional specification.
  - id: general-intelligence/agi-composite-suites
    label: AGI composite suites
    definition: Composite suites that aggregate many heterogeneous tasks into a single general-capability score.
  - id: biology-genetics/protein-fitness-prediction
    label: Protein fitness prediction
    definition: Predicting how a mutation changes a protein's measured activity, stability or binding affinity.
  - id: biology-genetics/neuroscience-decoding
    label: Neuroscience decoding
    definition: Recovering a stimulus, intention or behavioural variable from recorded neural activity.
  - id: audio-speech/machine-condition-monitoring
    label: Machine condition monitoring
    definition: Detecting machine faults or anomalies from operating sound.
  - id: audio-speech/speech-translation
    label: Speech translation
    definition: Producing text or speech in a target language from speech in a source language.
  - id: society-econ-law/forecasting-prediction-markets
    label: Forecasting prediction markets
    definition: Making probabilistic forecasts about future events that later resolve.
  - id: reasoning-general/temporal-reasoning
    label: Temporal reasoning
    definition: Reasoning about time, order, duration and their interaction.
  - id: biology-genetics/single-cell-analysis
    label: Single cell analysis
    definition: Turning single-cell or spatially resolved omics measurements into cell-level results, whether assignments,
      integrated embeddings, denoised profiles or inferred interactions.
    inclusion_test: 'Tag this as PRIMARY if the tasks take single-cell or spatial omics measurements as input and
      most of them score cell-level results: labels, trajectories, batch integration, denoising, modality prediction,
      spatial deconvolution or cell-cell communication.'
    exclusion_test: Do NOT tag this if most tasks predict responses to perturbations the cells were not observed
      under (`perturbation-response-prediction`), or if the input is bulk expression (`transcriptomics`).
  - id: mathematics/formal-theorem-proving
    label: Formal theorem proving
    definition: Producing a proof in a formal system that a proof assistant or automated verifier accepts.
    inclusion_test: Tag this as PRIMARY if the system must produce a machine-checked proof of a mathematical statement,
      whether the checker is an interactive proof assistant (Lean, Isabelle) or an auto-active program verifier
      (Dafny).
    exclusion_test: Do NOT tag this if the proved property belongs to a program rather than to a mathematical statement
      (`code/program-verification`), if a supplied proof is only judged (`proof-verification`), or if answers are
      checked as values or expressions (`competition-math`, `research-level-math`).
  - id: medicine-health/biomedical-literature
    label: Biomedical literature
    definition: Retrieving from, extracting from or synthesising the published biomedical literature.
  - id: multimodal/video-language
    label: Video language
    definition: Tasks pairing video with language in which the correspondence between the two is what is scored.
  - id: mathematics/proof-verification
    label: Proof verification
    definition: Deciding whether a supplied proof is correct, rather than producing one.
  - id: multimodal/audio-language
    label: Audio language
    definition: Tasks pairing audio with language in which the correspondence between the two is what is scored.
  - id: chemistry-materials/experimental-hit-finding
    label: Experimental hit finding
    definition: Nominating compounds that are then synthesised and assayed, scored on what the experiment returned.
  - id: multimodal/cross-modal-retrieval
    label: Cross modal retrieval
    definition: Retrieving items in one modality using a query expressed in another.
  - id: mathematics/arithmetic
    label: Arithmetic
    definition: Computing numerical results, where the difficulty is the calculation rather than the modelling.
  - id: code/code-performance-optimization
    label: Code performance optimization
    definition: Making code faster while preserving behaviour, scored on speedup rather than on correctness alone.
  - id: agents-tooluse/long-horizon-autonomy
    label: Long horizon autonomy
    definition: Tasks requiring many dependent steps across an extended episode without human intervention.
  - id: earth-climate/hazard-prediction
    label: Hazard prediction
    definition: Predicting natural hazards such as floods, wildfires, landslides or earthquakes.
  - id: games-planning/open-ended-environments
    label: Open ended environments
    definition: Acting in environments with no single fixed goal, scored on open-ended achievement.
  - id: audio-speech/bioacoustics
    label: Bioacoustics
    definition: Identifying species or animal vocalisations in field recordings.
  - id: mathematics/competition-math
    label: Competition math
    definition: Solving olympiad-style mathematics problems that have determinate answers.
  - id: vision/image-generation
    label: Image generation
    definition: Producing an image, scored on properties of the generated image itself.
  - id: mathematics/applied-modeling
    label: Applied modeling
    definition: Formulating a real-world situation as a mathematical model and solving it.
  - id: language/creative-writing
    label: Creative writing
    definition: Producing imaginative text scored on craft criteria rather than on factual correctness.
  - id: biology-genetics/phylogenetics
    label: Phylogenetics
    definition: Inferring evolutionary relationships among sequences or organisms from molecular data.
  - id: engineering-design/experimental-apparatus-design
    label: Experimental apparatus design
    definition: Designing a physical experimental setup capable of answering a stated question.
  - id: society-econ-law/economics-simulation
    label: Economics simulation
    definition: Modelling economic agents or systems, scored against economic outcomes.
  - id: audio-speech/audio-event-detection-localization
    label: Audio event detection localization
    definition: Determining when sound events occur and where they came from, not merely whether they are present.
  - id: robotics-embodiment/embodied-instruction-following
    label: Embodied instruction following
    definition: Carrying out a natural-language instruction through physical or simulated embodied action.
  - id: language/generation
    label: Generation
    definition: Producing free-form text scored against reference texts or rubric criteria.
  - id: biology-genetics/protein-structure-prediction
    label: Protein structure prediction
    definition: Predicting the three-dimensional structure of a protein from its sequence, scored against an experimentally
      determined structure.
  - id: robotics-embodiment/locomotion
    label: Locomotion
    definition: Controlling a legged or wheeled body to traverse terrain without falling or becoming stuck.
  - id: physics/fluid-dynamics
    label: Fluid dynamics
    definition: Predicting fluid flow fields or quantities derived from them.
  - id: audio-speech/audio-event-understanding
    label: Audio event understanding
    definition: Recognising which sound events are present in a recording.
  - id: earth-climate/weather-forecasting
    label: Weather forecasting
    definition: Predicting atmospheric state at a stated lead time, scored against observed weather.
    inclusion_test: Tag this as PRIMARY if forecasts of the atmosphere, or of the coupled Earth system, are issued
      from initial conditions at stated lead times up to the subseasonal-to-seasonal range and scored against observations
      or reanalysis. Record the lead-time range in the entry, not in the domain.
    exclusion_test: Do NOT tag this if the horizon is multi-year or longer under stated emissions or forcing scenarios
      (`climate-projection`), or if weather variables are only predictors for another target, such as crop yield
      (`agriculture`).
  - id: safety-alignment/sycophancy
    label: Sycophancy
    definition: Measuring whether a system revises a correct answer to agree with a user who pushes back.
  - id: multimodal/chart-diagram-understanding
    label: Chart diagram understanding
    definition: Answering questions that require reading structured visual content such as charts, plots and diagrams.
  - id: code/bug-repair
    label: Bug repair
    definition: Producing a patch that fixes a specified defect.
  - id: vision/video-generation
    label: Video generation
    definition: Producing a video, scored on properties of the generated video itself.
  - id: biology-genetics/nucleic-acid-structure
    label: Nucleic acid structure
    definition: Predicting the folded structure of an RNA or DNA molecule, scored against an experimentally determined
      structure.
  - id: code/program-verification
    label: Program verification
    definition: Producing or checking formal proofs of program properties.
  - id: agents-tooluse/web-navigation
    label: Web navigation
    definition: Completing tasks by browsing and acting on live or recorded web pages.
  - id: audio-speech/music-generation
    label: Music generation
    definition: Generating musical audio or symbolic music.
  - id: society-econ-law/education-tutoring
    label: Education tutoring
    definition: Teaching or assessing a learner, scored on pedagogical outcome or instructional quality.
  - id: general-intelligence/abstraction-generalization
    label: Abstraction generalization
    definition: Inferring an abstract rule from a handful of examples and applying it to new cases.
    inclusion_test: Tag this as PRIMARY if each item gives a few demonstrations of an unstated rule, the system
      must apply the rule to new inputs, and the benchmark's own claim is general or fluid intelligence, on tasks
      built so that prior task-specific knowledge does not help.
    exclusion_test: Do NOT tag this if rule induction is studied as a reasoning form in its own right (`reasoning-general/abstraction-induction`),
      or if the system must discover the task and its goal by acting in an environment that responds (`novel-task-acquisition`).
  - id: code/data-science-workflows
    label: Data science workflows
    definition: Completing an analysis over real data to reach a defensible quantitative answer.
  - id: games-planning/procedural-generalization
    label: Procedural generalization
    definition: Measuring generalisation to procedurally generated levels that were not seen in training.
  - id: audio-speech/music-understanding
    label: Music understanding
    definition: Recognising musical attributes such as key, genre, structure or notes from audio.
  - id: agents-tooluse/operating-system-tasks
    label: Operating system tasks
    definition: Completing tasks against a real operating system, filesystem or shell.
  - id: vision/3d-reconstruction
    label: 3D reconstruction
    definition: Recovering the three-dimensional geometry of a scene or object from images.
  - id: vision/segmentation
    label: Segmentation
    definition: Assigning a category label to every pixel or region of an image.
  - id: chemistry-materials/reaction-prediction
    label: Reaction prediction
    definition: Predicting the products of a chemical reaction from its reactants and conditions.
  - id: mathematics/symbolic-manipulation
    label: Symbolic manipulation
    definition: Transforming mathematical expressions, scored by symbolic equivalence rather than by string match.
  - id: robotics-embodiment/drone-uav
    label: Drone and UAV
    definition: Controlling an aerial vehicle, where flight dynamics and airspace constraints define the task.
  - id: vision/multi-view-stereo
    label: Multi-view stereo
    definition: Recovering dense geometry specifically by matching pixels across multiple calibrated views.
  - id: games-planning/card-imperfect-information
    label: Card and imperfect-information games
    definition: Playing games in which players hold private information from each other.
  - id: code/repository-scale-se
    label: Repository-scale software engineering
    definition: Making a correct change inside a real repository, where finding where to change it is part of the
      task.
  - id: agents-tooluse/cybersecurity-offense-defense
    label: Cybersecurity offense defense
    definition: Tasks scored on finding, exploiting or defending against security vulnerabilities.
  - id: chemistry-materials/force-fields-potentials
    label: Force fields potentials
    definition: Learning interatomic potentials scored against reference quantum-chemical calculations.
  - id: code/code-understanding
    label: Code understanding
    definition: Answering questions about code without necessarily modifying it.
  - id: medicine-health/medical-imaging-segmentation
    label: Medical imaging segmentation
    definition: Delineating anatomical or pathological regions in medical images.
    inclusion_test: Tag this as PRIMARY if the system delineates clinically defined anatomical or pathological regions
      in medical images and is scored as masks (Dice, surface distance) against clinician reference annotations.
      Dice is a vision metric, and it does not move the benchmark to `vision`.
    exclusion_test: Do NOT tag this if findings are scored as locations or labels rather than masks (`medical-imaging-diagnostic`),
      or if the benchmark's claim is a segmentation method that uses medical images as its test domain (`vision/medical-imaging-cv`).
  - id: robotics-embodiment/tactile-sensing
    label: Tactile sensing
    definition: Tasks whose primary input is touch or force sensing rather than vision.
  - id: general-intelligence/open-preference-arenas
    label: Open preference arenas
    definition: Open platforms where people submit their own prompts and choose between anonymised system outputs,
      and systems are ranked by a rating model over the votes, across many uses.
    inclusion_test: Tag this as PRIMARY if prompts come from the public rather than a fixed item set, the score
      is a rating fitted to human pairwise votes, and the arena's own claim is general usefulness across many uses
      or modalities.
    exclusion_test: Do NOT tag this if the arena is confined to one field or task (a robotics, coding or text-to-speech
      arena takes that field's subdomain, as RoboArena does), or if the judges are a model rather than people (`model-graded-judge`
      on the arena's own domain).
  - id: multimodal/visual-grounding
    label: Visual grounding
    definition: Locating the image region that a language expression refers to.
  - id: society-econ-law/finance-forecasting
    label: Finance forecasting
    definition: Predicting financial quantities such as prices, returns, volatility or risk.
  - id: language/information-extraction
    label: Information extraction
    definition: Extracting structured records such as entities, relations or events from unstructured text.
  - id: safety-alignment/deception-scheming
    label: Deception scheming
    definition: Measuring whether a system pursues concealed goals or misleads its operator about its own behaviour.
  - id: vision/novel-view-synthesis
    label: Novel view synthesis
    definition: Rendering an unobserved viewpoint of a scene from a set of observed views, scored on the rendered
      image.
  - id: mathematics/research-level-math
    label: Research level math
    definition: Solving problems at the level of current mathematical research.
  - id: chemistry-materials/generative-molecular-design
    label: Generative molecular design
    definition: Generating novel molecules intended to satisfy a stated property specification.
  - id: robotics-embodiment/mobile-manipulation
    label: Mobile manipulation
    definition: Tasks that require a robot both to move through an environment and to manipulate objects in it.
  - id: robotics-embodiment/autonomous-driving-planning
    label: Autonomous driving planning
    definition: Producing a driving trajectory or decision sequence, scored on the driving outcome rather than on
      perception accuracy.
  - id: agents-tooluse/multi-agent-coordination
    label: Multi agent coordination
    definition: Tasks that require several agents to divide work, communicate or reach agreement.
  - id: society-econ-law/legal-reasoning
    label: Legal reasoning
    definition: Applying legal rules to a set of facts to reach a determinate conclusion.
  - id: medicine-health/medical-imaging-diagnostic
    label: Medical imaging diagnostic
    definition: Detecting clinical findings in, or reaching a diagnostic conclusion from, medical images, scored
      against a clinical reference standard.
    inclusion_test: Tag this as PRIMARY if the system detects findings (nodules, metastases, lesions) or assigns
      a diagnosis or stage from medical images, and a reference standard set by clinicians scores it, whatever the
      metric (FROC, AUC, kappa).
    exclusion_test: Do NOT tag this if regions are delineated and scored as masks (`medical-imaging-segmentation`),
      if the output is a free-text report (`radiology-report-generation`), or if the benchmark's claim is a vision
      method that uses medical images as its test domain (`vision/medical-imaging-cv`).
  - id: language/low-resource-languages
    label: Low resource languages
    definition: Tasks in languages for which little training or evaluation data exists.
  - id: society-econ-law/social-simulation
    label: Social simulation
    definition: Simulating social behaviour or group dynamics.
  - id: engineering-design/lab-automation-execution
    label: Lab automation execution
    definition: Running laboratory procedures on automated equipment, scored on what the equipment actually produced.
  - id: code/ml-engineering
    label: ML engineering
    definition: Building or improving a machine-learning pipeline, scored on the performance of the model it produces.
  - id: biology-genetics/brain-model-alignment
    label: Brain model alignment
    definition: Scoring how well a model's internal representations predict measured neural responses to the same
      inputs.
  - id: language/summarization
    label: Summarization
    definition: Producing a shorter text that preserves the key content of a source.
  - id: language/translation
    label: Translation
    definition: Rendering text from one language into another.
  - id: games-planning/board-games
    label: Board games
    definition: Playing perfect-information board games.
  - id: games-planning/game-theory
    label: Game theory
    definition: Tasks scored against a game-theoretic solution concept rather than against a pool of opponents.
  - id: chemistry-materials/crystal-structure-prediction
    label: Crystal structure prediction

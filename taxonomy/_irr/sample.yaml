  - id: agents-tooluse/tool-api-calling
    label: Tool and API calling
    definition: Selecting and invoking external functions or APIs correctly to satisfy a request.
    inclusion_test: Tag this as PRIMARY if a single agent under evaluation is scored on selecting and invoking functions
      or APIs correctly against a backend, including when a simulated user converses with it or acts on the shared
      state with tools of its own.
    exclusion_test: Do NOT tag this if several agents under evaluation must divide work or reach agreement (`multi-agent-coordination`),

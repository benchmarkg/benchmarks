  - id: safety-alignment/prompt-injection
    label: Prompt injection
    definition: Measuring resistance to instructions embedded in untrusted content the system is asked to process.
    inclusion_test: Tag this as PRIMARY if the benchmark scores whether a system follows instructions planted in
      content it processes (tool outputs, documents, web pages) and its own claim is security, even when a benign
      utility score is reported beside the attack score on the same tasks.
    exclusion_test: Do NOT tag this if the harmful instruction comes from the user rather than from processed content
      (`jailbreak-robustness`, `agentic-harm`), or if injection is a minor axis of a benchmark whose claim is tool
      use, which takes its `agents-tooluse` subdomain.
  - id: medicine-health/clinical-agent-workflows
    label: Clinical agent workflows

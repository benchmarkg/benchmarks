  - id: reasoning-general/logical-deduction
    label: Logical deduction
    definition: Deriving conclusions that follow necessarily from stated premises.
  - id: society-econ-law/trading-market-interaction
    label: Trading market interaction
    definition: Acting inside a market environment, scored on the outcome of the interaction.
  - id: physics/symbolic-regression-discovery
    label: Symbolic regression discovery
    definition: Recovering a governing symbolic expression or physical law from observed data.
  - id: games-planning/real-time-strategy
    label: Real time strategy
    definition: Playing strategy games that demand many simultaneous decisions under real-time pressure.
  - id: medicine-health/clinical-dialogue
    label: Clinical dialogue
    definition: Conducting a multi-turn clinical conversation, scored on the conduct of the exchange rather than

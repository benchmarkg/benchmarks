  - id: vision/medical-imaging-cv
    label: Medical imaging (computer vision)
    definition: Computer-vision methods evaluated on medical images, where the benchmark's claim is the method rather
      than a clinical task.
    inclusion_test: Tag this as PRIMARY if the benchmark's own claim is a vision method (robustness, pretraining,
      generalisation across sites or scanners) and medical images are its test domain, with no clinical task claimed
      for the result.
    exclusion_test: Do NOT tag this if the targets are clinically defined (lesions, organs, findings, diagnoses)
      and clinicians set the reference standard, which is `medicine-health` whatever the metric. Dice and FROC are
      vision metrics, so the metric never decides.
  - id: language/multilingual
    label: Multilingual
    definition: Measuring the same task across many languages in order to compare performance between them.
  - id: safety-alignment/privacy-memorization
    label: Privacy memorization
    definition: Measuring whether a system reproduces private or memorised training data.
  - id: robotics-embodiment/whole-body-humanoid-control
    label: Whole body humanoid control
    definition: Coordinating a humanoid's full kinematic chain on tasks where balance and manipulation cannot be
      solved separately.
  - id: safety-alignment/control-oversight
    label: Control oversight
    definition: Measuring whether supervisory mechanisms hold against a system actively trying to evade them.
  - id: society-econ-law/legal-document
    label: Legal document
    definition: Extracting from, drafting or reviewing legal documents.
  - id: safety-alignment/interpretability-probes
    label: Interpretability probes
    definition: Evaluating methods that read a model's internal structure, scored on what the method recovers.
  - id: agents-tooluse/software-agents
    label: Software agents
    definition: Agents that complete software engineering work inside a real repository or toolchain.
    inclusion_test: Tag this if an autonomous agent does software-engineering work inside a real repository or toolchain,
      navigating files and running builds and tests itself. Tag it as PRIMARY only when the grader checks the toolchain's
      or environment's end state; when tests judge the code the agent wrote, `code` is primary and this term is
      secondary (02 S12.11).
    exclusion_test: Do NOT tag this if the work is not software engineering -- operating a shell or desktop to a
      target state is `operating-system-tasks` or `computer-use-gui` -- or if the system returns code without acting
      in a repository or toolchain.
  - id: society-econ-law/policy-analysis
    label: Policy analysis
    definition: Analysing policy options or regulatory questions.
  - id: general-intelligence/novel-task-acquisition
    label: Novel task acquisition
    definition: Learning to perform a task the system has never seen, within the evaluation episode itself.
  - id: vision/image-restoration-enhancement
    label: Image restoration enhancement
    definition: Recovering a degraded image, scored against a reference copy of the undegraded original.
  capabilities:
  - id: tool-use
    label: Tool use
    definition: Invoking external tools or APIs and using what they return.
    inclusion_test: Tag this if the protocol exposes callable tools and the score depends on whether they were selected,
      parameterised and consumed correctly.
    exclusion_test: Do NOT tag this if tools are available but incidental to the score, and do NOT tag it where
      the system emits a call that is never executed.
  - id: context-integration
    label: Context integration
    definition: Using information the protocol supplies in the prompt or environment, rather than information the
      system already held.
    inclusion_test: Tag this if the benchmark supplies the material that determines the answer and scores whether
      the system used it correctly.
    exclusion_test: Do NOT tag this if the supplied material is decorative and the answer is obtainable without
      it, and do NOT tag it for closed-book questions however much context surrounds them.
  - id: distribution-shift-generalization
    label: Distribution-shift generalization
    definition: Holding up when the input distribution changes from the one the system was fitted to.
    inclusion_test: Tag this if the benchmark evaluates on inputs drawn deliberately from a distribution the system
      was not fitted to -- a held-out site, population, device, recording condition or cell line -- and reports
      the score on those inputs as a condition of its own, with or without an in-distribution score beside it. When
      the scored task and its label set are unchanged and only the inputs move, tag this and not `transfer-learning`,
      even where the source calls the move transfer, adaptation or an unseen task.
    exclusion_test: Do NOT tag this if the change is adversarially constructed, if the test split differs from training
      only by random or balanced sampling, or where the task itself changes rather than the inputs -- a new label
      set, objective or embodiment -- which is `transfer-learning`.
  - id: scientific-prediction
    label: Scientific prediction
    definition: Predicting a property, structure or state of a physical, chemical, biological or Earth system from
      its description or from measurements of it.
    inclusion_test: Tag this if the benchmark's own claim is that systems predict such a quantity, structure or
      state, and the score compares the prediction with experimental measurement, observation or a reference computation.
    exclusion_test: Do NOT tag this if the answer is recalled rather than predicted (`knowledge-recall`), if the
      truth does not yet exist and probabilities are scored on resolution (`probabilistic-forecasting`), or if the
      benchmark claims a reasoning competence and scientific content is only its subject matter, as in exam-style
      question answering.
  - id: continual-learning
    label: Continual learning
    definition: Acquiring new competence over time without losing what was already learned.
    inclusion_test: Tag this if the protocol presents tasks in sequence and scores retention of earlier ones alongside
      acquisition of later ones.
    exclusion_test: Do NOT tag this if all tasks are available at once, and do NOT tag it where only final performance
      is reported.
  - id: reliability-consistency
    label: Reliability and consistency
    definition: Succeeding on the same task across repeated independent trials.
    inclusion_test: Tag this if the benchmark runs the same item more than once and scores agreement across runs
      -- pass^k and its relatives.
    exclusion_test: Do NOT tag this if repeated runs are averaged, because averaging destroys exactly the quantity
      this term names, and do NOT tag it where the inputs change between trials.
  - id: situational-awareness
    label: Situational awareness
    definition: Recognising that it is being evaluated, and altering behaviour accordingly.
    inclusion_test: Tag this if the benchmark tests evaluation awareness or sandbagging -- whether the system behaves
      differently when it believes it is observed.
    exclusion_test: 'Do NOT tag this under the plain-English reading of the slug: this term does NOT mean an agent''s
      awareness of its own task state, which is `context-integration`.'
  - id: hypothesis-generation
    label: Hypothesis generation
    definition: Producing candidate explanations or proposals worth testing, scored on the candidates rather than
      on a single answer.
    inclusion_test: Tag this if the system's output is a set or ranking of candidates and the benchmark scores that
      set.
    exclusion_test: Do NOT tag this if exactly one answer is scored, and do NOT tag it where the candidates are
      supplied and only selection is required.
  - id: transfer-learning
    label: Transfer learning
    definition: Carrying competence acquired on one task, embodiment or environment to a different one.
    inclusion_test: Tag this if the benchmark trains or validates on one setting and scores on a deliberately different
      task, objective, embodiment or environment -- such as new tasks after earlier ones, or simulation to the real
      robot -- and the transfer itself is reported.
    exclusion_test: Do NOT tag this if train and test differ only by sampling, and do NOT tag it where the change
      is degradation under perturbation rather than a move to a new task. If the task and its label set are unchanged
      and only the population, site, device or recording conditions differ, tag `distribution-shift-generalization`
      instead, whatever the source calls the move.
  - id: perception
    label: Perception
    definition: Extracting structure from a raw sensory or simulated signal.
    inclusion_test: Tag this if the input is an image, video, audio stream, point cloud or comparable raw signal
      and the score measures what was recovered from it.
    exclusion_test: Do NOT tag this if the signal is described in words rather than presented, and do NOT tag it
      where symbols must be bound to referents -- that is grounding.
  - id: honesty
    label: Honesty
    definition: Asserting what the system's own evidence supports, including admitting ignorance when it has none.
    inclusion_test: Tag this if the benchmark scores truthfulness of assertion separately from correctness -- for
      example rewarding an admission of not knowing.
    exclusion_test: Do NOT tag this if being wrong is the only failure mode measured, and do NOT tag it where the
      assertion is a numeric confidence.
  - id: constraint-satisfaction
    label: Constraint satisfaction
    definition: Producing an output that satisfies every stated requirement simultaneously, where a violation of
      any one makes the output wrong.
    inclusion_test: Tag this if the scoring function checks the output against an enumerated set of conditions and
      any single violation fails the item. Per 02 S4.2's tie-break, tag the term the benchmark's own source claims.
    exclusion_test: Do NOT tag this if the requirements are stylistic preferences scored by degree, and do NOT tag
      it where the conditions are given as natural-language instructions the benchmark itself calls instruction
      following.
  - id: calibration-uncertainty
    label: Calibration and uncertainty
    definition: The ability to report how likely its own output is to be correct, such that the reported confidence
      matches the observed frequency of correctness.
    inclusion_test: Tag this if the benchmark's scoring function consumes a confidence, a probability, a distribution
      or an interval emitted by the system under test.
    exclusion_test: Do NOT tag this merely because accuracy is measured on hard items, and do NOT tag it when a
      third party computes calibration post hoc from logits the system did not intend as a confidence claim.
  - id: abductive-reasoning
    label: Abductive reasoning
    definition: Selecting the explanation that best accounts for an observation, where the conclusion is supported
      but not entailed.
    inclusion_test: Tag this if the benchmark presents evidence and scores which explanation the system settles
      on.
    exclusion_test: Do NOT tag this if the conclusion follows necessarily from the stated premises, and do NOT tag
      it where the task is to propose candidates rather than to choose among them.
  - id: probabilistic-forecasting
    label: Probabilistic forecasting
    definition: Producing a probability for a future event whose truth value does not yet exist.
    inclusion_test: Tag this if the benchmark scores probabilities against outcomes that resolve after the prediction
      is made.
    exclusion_test: Do NOT tag this if the answer already exists and is merely withheld, and do NOT tag it where
      the probability concerns the system's own correctness.
  - id: inductive-reasoning
    label: Inductive reasoning
    definition: Generalising a rule from a finite set of observed examples, where the examples are the evidence
      for the rule.
    inclusion_test: Tag this if the benchmark supplies observations and scores a rule, law or generalisation inferred
      from them.
    exclusion_test: Do NOT tag this if the rule is given and only instantiated, and do NOT tag it where the task
      is to see the input differently rather than to accumulate evidence.
  - id: long-horizon-execution
    label: Long-horizon execution
    definition: The ability to carry a single task through many dependent steps, where an error at any step is not
      recoverable by the later steps and the system must retain and act on state it generated itself earlier in
      the episode.
    inclusion_test: 'Tag this if a single scored episode contains at least ~10 dependent actions AND failure at
      an intermediate step makes full success on the episode unattainable. Partial credit for progress does not
      disqualify a benchmark: the test is whether full success can still be reached after the error, not whether
      the score falls to zero.'
    exclusion_test: Do NOT tag this if the benchmark is scored per-item on independent items, however many items
      there are, or if the long sequence is produced in one generation without any environment feedback between
      steps.
  - id: autonomy
    label: Autonomy
    definition: Operating over an extended task without human intervention.
    inclusion_test: Tag this if the protocol prohibits or measures human intervention and scores what was achieved
      unattended.
    exclusion_test: Do NOT tag this if a human is in the loop by design, and do NOT tag it merely because an episode
      is long.
  - id: quantitative-reasoning
    label: Quantitative reasoning
    definition: Arriving at a numerically correct result through calculation, estimation or manipulation of quantities.
    inclusion_test: Tag this if the scored answer is a number, an expression or a quantity, and the path to it involves
      arithmetic, algebra or numerical estimation.
    exclusion_test: Do NOT tag this if numbers appear only as labels or options, and do NOT tag it where the quantity
      is read off a supplied table without manipulation.
  - id: abstraction
    label: Abstraction
    definition: Deriving a rule or representation that is not present in the surface form of the input.
    inclusion_test: Tag this if the novelty the benchmark tests is in the representation -- the solver must find
      the right way to see the problem before any answer is available.
    exclusion_test: Do NOT tag this if the rule is stated and only has to be applied, and do NOT tag it where the
      difficulty lies in the amount of evidence rather than in its form.
  - id: self-correction
    label: Self correction
    definition: Detecting an error in the system's own output and repairing it.
    inclusion_test: Tag this if the protocol gives the system a chance to revise and scores the improvement, or
      scores whether errors were caught.
    exclusion_test: Do NOT tag this if revision is driven by an external oracle telling it what is wrong, and do
      NOT tag it where only the final answer after unlimited attempts is scored.
  - id: self-improvement
    label: Self improvement
    definition: Improving the system's own capability through its own activity, without external retraining.
    inclusion_test: Tag this if the benchmark measures capability before and after a period of the system's own
      work and attributes the change to that work.
    exclusion_test: Do NOT tag this if improvement comes from supplied training data, and do NOT tag it where the
      gain is within a single episode rather than in the system's standing capability.
  - id: temporal-reasoning
    label: Temporal reasoning
    definition: Reasoning about order, duration and change over time.
    inclusion_test: Tag this if correctness depends on when things happened relative to one another, or on how long
      they lasted.
    exclusion_test: Do NOT tag this if events are merely listed in order, and do NOT tag it where the claim is causal
      rather than temporal.
  - id: search-exploration
    label: Search and exploration
    definition: Covering a space of options efficiently enough to find a good one.
    inclusion_test: Tag this if the benchmark rewards how the option space was traversed -- coverage, sample count,
      or discovery under a budget.
    exclusion_test: Do NOT tag this if the space is small enough to enumerate, and do NOT tag it where the score
      is the quality of a single produced solution with no search budget at stake.
  - id: communication
    label: Communication
    definition: Conveying information to another party such that it is correctly received and acted on.
    inclusion_test: Tag this if the score depends on what the recipient understood or did, not on properties of
      the message alone.
    exclusion_test: Do NOT tag this if the output is scored against a reference text, and do NOT tag it where the
      joint objective rather than the transfer is what is measured.
  - id: causal-reasoning
    label: Causal reasoning
    definition: Reasoning about why an outcome occurred and what would follow under intervention, as distinct from
      what co-occurs.
    inclusion_test: Tag this if correctness depends on distinguishing cause from correlation, or on predicting the
      effect of an intervention that was not observed.
    exclusion_test: Do NOT tag this if the benchmark scores predictive accuracy on observational data alone, and
      do NOT tag it for temporal ordering without a causal claim.
  - id: knowledge-recall
    label: Knowledge recall
    definition: The ability to produce information the system already holds, where the task supplies no source containing
      the answer.
    inclusion_test: Tag this if a scored item can only be answered from information the system brought with it,
      and no passage, tool or retrieval step in the protocol supplies the answer.
    exclusion_test: Do NOT tag this if the answer appears in the prompt or in material the benchmark provides, and
      do NOT tag it merely because answering requires background knowledge on the way to a different scored outcome.
  - id: memory-retention
    label: Memory retention
    definition: Carrying information across a long context or across episode boundaries so that it is still available
      when it is needed.
    inclusion_test: Tag this if the scored behaviour depends on information introduced earlier and separated from
      its use by intervening material or by an episode boundary.
    exclusion_test: Do NOT tag this if the needed information sits adjacent to its use, and do NOT tag it merely
      because the input is long -- length is a property of the prompt, not evidence that anything had to be retained.
  - id: planning
    label: Planning
    definition: Constructing a sequence of actions that would achieve a goal, scored as a property of the sequence.
    inclusion_test: Tag this if the benchmark scores the plan -- its validity, cost or optimality -- whether or
      not it is then executed. In an interactive episode against an explicit goal or objective, such as a game or
      puzzle environment, the executed action sequence is the plan, and its cost or its outcome counts as scoring
      it, provided the source claims planning.
    exclusion_test: Do NOT tag this if the score is the quality of an artifact the rollout produced -- a patch,
      a document, a final answer -- rather than of the action sequence itself, and do NOT tag it where the sequence
      is produced in one generation with no goal state to satisfy.
  - id: generation-fidelity
    label: Generation fidelity
    definition: How closely generated output matches a reference or a stated specification.
    inclusion_test: Tag this if the score compares the produced artifact against a target by similarity, distance
      or human preference for faithfulness. The target may be a reference output or the source whose content the
      output must preserve, as when human annotators grade a translation for errors against the source text.
    exclusion_test: Do NOT tag this if the output is judged for being new rather than for matching, and do NOT tag
      it where a single discrete answer is checked against a key. Do NOT tag it for a predicted property, structure
      or state of a physical system scored against measurement or reference computation, which is `scientific-prediction`.
  - id: deductive-reasoning
    label: Deductive reasoning
    definition: Drawing conclusions that follow necessarily from stated premises or rules, checkable against those
      premises.
    inclusion_test: Tag this if correctness is decidable from the stated premises alone, without appeal to world
      knowledge or to evidence outside the item.
    exclusion_test: Do NOT tag this if the conclusion is merely plausible given the premises, and do NOT tag it
      where the difficulty is recalling a theorem rather than applying it.
  - id: factual-precision
    label: Factual precision
    definition: The correctness of individual asserted particulars -- names, numbers, dates, citations -- inside
      an otherwise free-form output.
    inclusion_test: Tag this if the scoring function checks asserted particulars against a reference one by one,
      independently of whether the response as a whole is well-formed.
    exclusion_test: Do NOT tag this if the benchmark scores one short answer against a key, and do NOT tag it where
      the only judgement is overall helpfulness or preference.
  - id: creativity-novelty
    label: Creativity and novelty
    definition: Producing output that is both new and useful, where resemblance to existing work counts against
      it.
    inclusion_test: Tag this if the scoring rewards departure from known solutions, or explicitly penalises retrieval
      and reproduction.
    exclusion_test: Do NOT tag this if novelty is incidental to a fidelity score, and do NOT tag it where variety
      is measured without any usefulness criterion.
  - id: spatial-reasoning
    label: Spatial reasoning
    definition: Reasoning about position, shape, orientation and relation in space, whether the space is perceived
      or described.
    inclusion_test: Tag this if correctness depends on spatial relations that must be inferred rather than read
      off.
    exclusion_test: Do NOT tag this if spatial words appear but the answer is recalled, and do NOT tag it where
      the scored quantity is reconstruction accuracy rather than a spatial inference.
  - id: optimization
    label: Optimization
    definition: Finding the input that best satisfies an objective function, where the score is the objective's
      value.
    inclusion_test: Tag this if the benchmark states an objective and ranks systems by how well they optimise it.
    exclusion_test: Do NOT tag this if the objective is accuracy against a held-out key, and do NOT tag it where
      the difficulty is finding any feasible solution rather than the best one.
  - id: instruction-following
    label: Instruction following
    definition: Complying with directions given in the prompt, where compliance is checkable independently of whether
      the content is good.
    inclusion_test: Tag this if the benchmark scores whether stated directions were obeyed, and per 02 S4.2 the
      benchmark's own source claims instruction following.
    exclusion_test: Do NOT tag this if the requirements are physical or policy conditions the source calls validity
      or compliance, and do NOT tag it where only answer correctness is scored.
  - id: analogical-reasoning
    label: Analogical reasoning
    definition: Mapping the structure of one situation onto another so that a solution transfers between them.
    inclusion_test: Tag this if the benchmark requires recognising that two differently-presented problems share
      a structure, and scores the transfer.
    exclusion_test: Do NOT tag this if the two situations share surface features rather than structure, and do NOT
      tag it where transfer is between training and test distributions rather than between two presented cases.
  - id: compositional-generalization
    label: Compositional generalization
    definition: Recombining known primitives in arrangements that were never observed together.
    inclusion_test: Tag this if every primitive in the held-out items appeared in training or in the prompt, and
      only their arrangement is new. Where the source does not enumerate its primitives, tag this only if it claims
      that held-out items combine rules or concepts already shown, and not where it says they introduce new mechanics.
    exclusion_test: Do NOT tag this if the held-out items introduce new primitives, and do NOT tag it for ordinary
      distribution shift where the change is in input statistics rather than in structure.
  - id: harm-avoidance
    label: Harm avoidance
    definition: Declining to produce or perform actions the benchmark defines as harmful.
    inclusion_test: Tag this if the scored behaviour is refusal, safe completion, or the absence of a harmful action.
    exclusion_test: Do NOT tag this if the benchmark measures resistance to an attacker rather than conduct under
      ordinary use, and do NOT tag it where harm is discussed rather than elicited.
  - id: collaboration
    label: Collaboration
    definition: Working with another agent or a human towards a shared objective, where the joint outcome is scored.
    inclusion_test: Tag this if the protocol contains more than one actor and the score depends on the outcome they
      reach together.
    exclusion_test: Do NOT tag this if the other party is a scripted environment with no objective, and do NOT tag
      it for adversarial settings where the objectives are opposed. A mixed-motive setting, neither purely cooperative
      nor purely competitive, qualifies when the source claims cooperation and the score includes an outcome the
      actors reach together; a zero-sum game, where one actor's gain is another's loss, does not.
  - id: experimental-design
    label: Experimental design
    definition: Designing the procedure or apparatus that would discriminate between competing possibilities.
    inclusion_test: Tag this if the scored artifact is a protocol, assay or apparatus, judged by whether it would
      answer the question.
    exclusion_test: Do NOT tag this if the protocol is given and only executed, and do NOT tag it where the output
      is a hypothesis rather than the means of testing one.
  - id: sensorimotor-control
    label: Sensorimotor control
    definition: Closed-loop control of a physical or simulated body.
    inclusion_test: Tag this if actions are issued to a body, the environment responds, and the score depends on
      the resulting physical behaviour.
    exclusion_test: 'Do NOT tag this if the environment is symbolic with no body, and do NOT tag it where a trajectory
      is produced open-loop and never executed. Where the entrant supplies only a planned trajectory and the benchmark''s
      own fixed controller tracks it in a non-reactive simulation, the scored object is the plan: tag `planning`,
      not this term.'
  - id: sample-efficiency
    label: Sample efficiency
    definition: Reaching a given level of competence from a small number of examples or interactions.
    inclusion_test: Tag this if the benchmark fixes a budget of samples, episodes or environment steps and scores
      performance at that budget.
    exclusion_test: Do NOT tag this if the budget is unconstrained, and do NOT tag it where few-shot prompting is
      a harness setting rather than the measured quantity.
  - id: adversarial-robustness
    label: Adversarial robustness
    definition: Holding up against inputs chosen deliberately to make the system fail.
    inclusion_test: Tag this if an attacker -- human, automated or red-team -- selects the inputs and the score
      is the system's resistance.
    exclusion_test: Do NOT tag this if the difficult inputs are naturally occurring, and do NOT tag it where the
      failure sought is inconsistency across identical repeated trials.
  - id: grounding
    label: Grounding
    definition: Binding symbols to the referents they denote in a perceived or simulated world.
    inclusion_test: Tag this if the benchmark scores whether a linguistic expression was correctly attached to an
      object, location or event in a presented world.
    exclusion_test: Do NOT tag this if the task is recovering structure from a signal with no symbol to bind, and
      do NOT tag it for text-only reference resolution.
  evaluation-methods:
  - id: formal-proof-check
    label: Formal proof check
    definition: The score is whether a machine-checkable proof is accepted by a proof assistant.
    inclusion_test: Tag this if a proof assistant or program verifier -- Lean, Coq, Isabelle, or an SMT-backed verifier
      such as Dafny that discharges proof obligations -- accepts or rejects the submission, and that verdict is
      the score. A check that the submission kept the original specification is part of the same verdict.
    exclusion_test: Do NOT tag this if a CAS decides equivalence without a proof object, do NOT tag it where a human
      referee judges a proof, and do NOT tag it where a programmatic battery validates a structure with no proof
      obligation, which is `constraint-check`.
  - id: execution-tests
    label: Execution tests
    definition: The score is whether produced code passes tests when run.
    inclusion_test: Tag this if the artifact is executed and the verdict comes from test outcomes.
    exclusion_test: Do NOT tag this if code is compared against a reference implementation without running, and
      do NOT tag it where execution only checks structural validity rather than behaviour.
  - id: episodic-return
    label: Episodic return
    definition: The score is unbounded cumulative reward from a control episode.
    inclusion_test: Tag this if the metric accumulates reward with no defined maximum. Headroom is undefined for
      these and they can never be marked saturated.
    exclusion_test: Do NOT tag this if the episode is scored as success or failure, and do NOT tag it where returns
      are rescaled against a maximum that cannot be exceeded. Normalising against a reference constant that agents
      do exceed, such as a human-normalised Atari score, leaves the metric unbounded, and the term still applies.
  - id: prospective-resolution
    label: Prospective resolution
    definition: Ground truth does not exist at submission and resolves later.
    inclusion_test: Tag this if the correct answer becomes known only after predictions are locked, because the
      world resolves it -- an event occurs, an annotation is curated, or an experiment run independently of the
      predictions reports -- and pair it with a resolution status on the claim. On a benchmark, tag it only if the
      protocol guarantees this for its targets, not where some targets may already be known and merely unreleased.
    exclusion_test: Do NOT tag this if the answer exists and is merely withheld from entrants, do NOT tag it where
      a laboratory assay is run on the submission itself, which is `wet-lab-validation`, and do NOT tag it where
      what happens after the deadline is only the grading of the submissions, such as a post-deadline human evaluation,
      which is the grading method's own term.
  - id: human-crowd-eval
    label: Human crowd evaluation
    definition: Non-expert human raters score outputs.
    inclusion_test: Tag this if raters are recruited without a domain qualification requirement. A screen on platform
      performance or language fluency, as on a paid crowd platform, is not a domain qualification; raters recruited
      for a professional credential are `human-expert-eval`.
    exclusion_test: Do NOT tag this if raters are credentialed domain experts, and do NOT tag it where the aggregation
      is a head-to-head rating system.
  - id: rubric-graded
    label: Rubric graded
    definition: A structured rubric is applied to the output and aggregated into a score.
    inclusion_test: Tag this if named criteria are checked individually and combined, and record the grader separately
      -- it may be human or model.
    exclusion_test: Do NOT tag this if a judge model issues a holistic verdict with no criterion structure, and
      do NOT tag it where the criteria are programmatic assertions on structured output.
  - id: multiple-choice
    label: Multiple choice
    definition: The score is selection among supplied options, against a known chance baseline.
    inclusion_test: Tag this if the system picks from an enumerated option set, and record the chance baseline --
      it is the headroom floor.
    exclusion_test: Do NOT tag this if the options are generated by the system, and do NOT tag it where a free-form
      answer is matched against a set of acceptable strings.
  - id: model-derived-metric
    label: Model-derived metric
    definition: The score is computed by another model -- a detector, an encoder or a fine-tuned classifier -- that
      is not acting as a judge.
    inclusion_test: 'Tag this if a fixed, released scoring model produces the number -- a detector, a learned reference-based
      metric such as COMET, the Inception network behind FID, a labeller such as CheXbert, or a guard classifier
      with a fixed label set -- and record the scoring model''s version: it is part of the result. For the same
      number this term governs over `domain-metric` and `reference-metric`.'
    exclusion_test: Do NOT tag this if a general-purpose model is prompted to issue a verdict, which is `model-graded-judge`,
      do NOT tag it where the metric is a fixed formula, and do NOT tag it where the mapping model is a regression
      fitted afresh to each submission as part of the metric; the final statistic then carries the method.
  - id: wet-lab-validation
    label: Wet-lab validation
    definition: The score comes from experimental assays run on the predictions themselves.
    inclusion_test: Tag this if predictions are taken to a laboratory and the measured outcome is the score.
    exclusion_test: Do NOT tag this if predictions are compared against previously measured data, do NOT tag it
      where the experiment is simulated, and do NOT tag it where an experiment run after the deadline measures every
      candidate regardless of the predictions, which is `prospective-resolution`.
  - id: expert-panel-assessment
    label: Expert panel assessment
    definition: An assessor committee produces a published judgement rather than a leaderboard.
    inclusion_test: Tag this if the authoritative output is an assessment written by a named committee, including
      a committee that assigns each participant one collective score.
    exclusion_test: Do NOT tag this if experts rate outputs individually into a score, and do NOT tag it where a
      leaderboard is the published artifact.
  - id: environment-state-check
    label: Environment state check
    definition: The score is a programmatic check of the state that an agent episode leaves in a stateful software
      environment.
    inclusion_test: Tag this if, after the episode, a program inspects what the agent changed -- databases, files,
      a virtual machine, mocked services, or the tool calls it issued -- and decides task success or per-checkpoint
      credit, so that any trajectory reaching the required state passes. Where the checked state is an attacker's
      goal, tag `adversarial-red-team` as well for the attack-success aggregate.
    exclusion_test: Do NOT tag this if only a returned answer or a produced artifact is checked, which is `exact-match`,
      `constraint-check` or `execution-tests`, and do NOT tag it where the environment is a physics or game simulator
      for a control policy, which is `simulation-rollout`. When tests run in the agent's container, tag `execution-tests`
      if they exercise code the agent wrote and this term if they inspect state it changed.
  - id: human-expert-eval
    label: Human expert evaluation
    definition: Domain experts rate individual outputs.
    inclusion_test: Tag this if qualified experts score outputs one by one and their ratings are the result.
    exclusion_test: Do NOT tag this if raters are untrained, and do NOT tag it where a committee issues one collective
      judgement rather than per-output ratings; a committee's collective score for each participant is still `expert-panel-assessment`.
  - id: entrant-relative-ranking
    label: Entrant-relative ranking
    definition: The headline number ranks or rescales each entrant against the other entrants in the evaluated pool,
      so it changes when the pool changes.
    inclusion_test: Tag this if the published figure is a rank aggregation, a win rate against every other entrant,
      a Z-score against the field, or a scale fitted jointly across entrants, so that adding or removing one entrant
      moves the others' numbers with no change to their outputs. Record the pool and its snapshot date, and tag
      the methods that produced the underlying scores as well.
    exclusion_test: Do NOT tag this if the rating is fitted to preference votes, which is `pairwise-preference-elo`,
      or to games between entrants, which is `tournament-play`, and do NOT tag it where scores are normalised against
      fixed baselines or controls that do not change with the entrants.
  - id: physical-trial
    label: Physical trial
    definition: The score comes from trials run on real hardware.
    inclusion_test: Tag this if the reported outcome was produced by a physical system acting in the world.
    exclusion_test: Do NOT tag this if the result is simulated however faithfully, do NOT tag it where hardware
      is used only to collect the dataset, and do NOT tag it where hardware runs are a one-off experiment in the
      release paper rather than a scored track of the benchmark.
  - id: human-distribution-percentile
    label: Human distribution percentile
    definition: The score locates the system within a real human population distribution.
    inclusion_test: Tag this if thresholds or percentiles are derived from an actual measured human field rather
      than from a chosen constant.
    exclusion_test: Do NOT tag this if a single expert score is the comparator, and do NOT tag it where the human
      number is a ceiling anchor rather than the scoring scale.
  - id: ordinal-grading
    label: Ordinal grading
    definition: The result is a grade on an ordered scale rather than a number.
    inclusion_test: Tag this if the published result is a band such as Poor, Fair, Good, and note whether the bands
      are defined relative to the current state of the art.
    exclusion_test: Do NOT tag this if a number is bucketed only for display, and do NOT tag it where the bands
      come from a measured human distribution.
  - id: reference-metric
    label: Reference metric
    definition: The score is an automatic similarity measure against one or more reference texts.
    inclusion_test: Tag this if BLEU, ROUGE, chrF, TER, word error rate, perplexity or a relative computed by a
      fixed formula is the reported number.
    exclusion_test: Do NOT tag this if the similarity is computed by a learned scoring model -- COMET, BLEURT, MetricX
      and BERTScore are `model-derived-metric` even though they compare against references -- and do NOT tag it
      where the metric is specific to a scientific domain.
  - id: domain-metric
    label: Domain metric
    definition: The score is a measure defined by and specific to a scientific or engineering field.
    inclusion_test: Tag this if the metric is named and standardised within a discipline and has no meaning outside
      it -- GDT-TS, lDDT, DockQ, mAP, IoU, Dice, kappa_SRME -- and is defined per Metric entity.
    exclusion_test: Do NOT tag this if the metric is a general-purpose statistic such as RMSE, correlation, F1 or
      AUROC, even where a field's agencies standardise how it is computed, do NOT tag it where a model computes
      the number, which is `model-derived-metric`, and do NOT tag it where the metric scores an emitted distribution,
      which is `uncertainty-calibration-score`. Do NOT tag the aggregation when several such metrics are combined.
  - id: constraint-check
    label: Constraint check
    definition: The score is programmatic validation of structured output against a battery of conditions.
    inclusion_test: Tag this if a checker asserts a set of properties on the output and any failure invalidates
      it.
    exclusion_test: Do NOT tag this if the artifact must be executed to be judged, do NOT tag it where the checked
      object is the state an agent episode left in a stateful software environment, which is `environment-state-check`,
      and do NOT tag the composite metric that a battery is folded into -- tag both terms on the benchmark and let
      `composite` carry the aggregation.
  - id: exact-match
    label: Exact match
    definition: The score is string or value equality against a stored reference answer.
    inclusion_test: Tag this if a response is marked correct only when it equals the reference exactly, after at
      most whitespace or case normalisation. Plain accuracy over such per-item verdicts, including accuracy against
      a fixed label set, stays here.
    exclusion_test: Do NOT tag this if equivalence is decided by a computer-algebra system or a proof checker, and
      do NOT tag it where partial credit is available. A numeric answer accepted within a tolerance is `numeric-tolerance-match`,
      and a statistic computed over the whole set of predicted labels, such as F1, AUROC, MCC or kappa, is `classification-metric`.
  - id: numeric-tolerance-match
    label: Numeric tolerance match
    definition: The score is whether a numeric answer lies within a stated tolerance of a reference value.
    inclusion_test: 'Tag this if each numeric answer is marked correct when it falls inside an absolute, relative
      or unit-conversion tolerance of the reference, whether a program or a person applies the tolerance, and record
      the tolerance rule: it decides what counts as right.'
    exclusion_test: Do NOT tag this if the answer must equal the reference after at most whitespace or case normalisation,
      which is `exact-match`, and do NOT tag it where the reported number is an error statistic aggregated over
      all predictions, which is `statistical-fit`.
  - id: classification-metric
    label: Classification metric
    definition: The score is a general-purpose statistic computed from predicted labels, scores or clusters against
      a labelled key.
    inclusion_test: 'Tag this if the reported number is F1, precision, recall, sensitivity or specificity, AUROC,
      AUPRC, the Matthews correlation coefficient, Cohen''s kappa, balanced or macro-averaged accuracy, or a clustering
      index such as the adjusted Rand index: a statistic of the whole confusion matrix or score ranking whose formula
      is the same in every field.'
    exclusion_test: 'Do NOT tag this if each item is simply right or wrong and the score is their mean, which is
      `exact-match` or `multiple-choice`, and do NOT tag it where the statistic is named and defined only within
      a discipline, such as mAP over IoU thresholds, Dice or FROC sensitivity, which is `domain-metric`. Labels
      decide against `statistical-fit`: a correlation between predicted and true classes is this term, one between
      continuous values is not.'
  - id: composite
    label: Composite
    definition: The headline number aggregates sub-scores produced by different methods.
    inclusion_test: Tag this if the published figure is a weighted or averaged combination of sub-scores that different
      methods produced, and tag the constituent methods on the benchmark as well.
    exclusion_test: 'Do NOT tag this if every constituent shares one method -- one metric averaged over its own
      parameter sweep, such as IoU thresholds, categories, or datasets and tasks scored the same way -- and do NOT
      use it as a catch-all for benchmarks with several tracks: model those as subsets. Where the combination is
      also relative to the entrant pool, tag `entrant-relative-ranking` beside it.'
  - id: tournament-play
    label: Tournament play
    definition: Relative strength is established through play against other entrants.
    inclusion_test: Tag this if entrants compete directly and the result is placement or a rating derived from those
      games.
    exclusion_test: Do NOT tag this if the comparison is a judged preference, and do NOT tag it where an entrant
      plays only against a fixed baseline.
  - id: uncertainty-calibration-score
    label: Uncertainty calibration score
    definition: The metric scores an emitted confidence, interval or distribution rather than a point answer.
    inclusion_test: Tag this if the scoring function consumes an emitted confidence, interval, probability or ensemble
      and scores its coverage, sharpness or calibration error, or applies a proper scoring rule to it -- CRPS and
      its skill score, the Brier score, the log score -- even where a discipline has standardised the rule under
      its own name.
    exclusion_test: Do NOT tag this if accuracy is scored on hard answers with no emitted uncertainty, and do NOT
      tag it where an ensemble is reduced to its mean before scoring, which is `statistical-fit`. A probability
      about a future event keeps this term for how it is scored, and takes `prospective-resolution` as well for
      when its truth exists.
  - id: statistical-fit
    label: Statistical fit
    definition: The score is error against ground-truth measurements.
    inclusion_test: Tag this if the number is RMSE, MAE, correlation, anomaly correlation, Spearman rho or a comparable
      goodness-of-fit statistic on continuous values, including where a field's agencies fix how it is computed,
      as for RMSE and ACC under WMO and ECMWF definitions.
    exclusion_test: Do NOT tag this if the statistic is defined only within one discipline under its own name, which
      is `domain-metric`, do NOT tag it where the quantity scored is calibration rather than accuracy, and do NOT
      tag it where the statistic is computed from predicted class labels, which is `classification-metric` even
      when it is a correlation such as MCC.
  - id: symbolic-equivalence
    label: Symbolic equivalence
    definition: The score is computer-algebra equivalence to a reference expression, rather than string equality.
    inclusion_test: Tag this if two differently-written answers can both be scored correct because a computer-algebra
      system judges them equivalent.
    exclusion_test: 'Do NOT tag this if the checker compares strings, and do NOT tag it where a full machine-checked
      proof is required rather than an equivalence: a proof assistant accepting a derivation is `formal-proof-check`,
      even when the statement proved is an equality.'
  - id: model-graded-judge
    label: Model-graded judge
    definition: A judge model issues a verdict on the output.
    inclusion_test: Tag this if a model prompted with a grading instruction decides quality or correctness, and
      record the judge model and version as required fields. Where the maintainer withholds the judge's identity,
      the term still applies and the withholding goes in the notes.
    exclusion_test: Do NOT tag this if the model computes a quantity rather than a verdict, do NOT tag it where
      the scorer is a released classifier fine-tuned to a fixed label set, which is `model-derived-metric`, and
      do NOT tag it where a rubric structures the judgement without a model applying it.
  - id: adversarial-red-team
    label: Adversarial red team
    definition: The score is attack success rate under human or automated attack.
    inclusion_test: 'Tag this if the reported number is how often an attacker succeeded, and note that the denominator
      moves: scores change when a new attack is published, with no change to the system.'
    exclusion_test: Do NOT tag this if the difficult inputs occur naturally, and do NOT tag it where refusal under
      ordinary use is what is measured.
  - id: pairwise-preference-elo
    label: Pairwise preference Elo
    definition: A rating is derived from A/B comparisons against other entrants.
    inclusion_test: Tag this if the number is a rating fitted to pairwise outcomes, and record the rating-pool identity
      and snapshot date -- both are part of the result.
    exclusion_test: Do NOT tag this if outcomes come from direct play rather than preference votes, do NOT tag it
      where preferences are reported as win rates against one fixed opponent, and do NOT tag it where the pairwise
      comparison is of ordinary scores with no vote, which is `entrant-relative-ranking`.
  - id: simulation-rollout
    label: Simulation rollout
    definition: The score is a bounded outcome, success or partial credit, of episodes run in a simulator.
    inclusion_test: 'Tag this if outcomes are produced by running a policy or agent in a simulated physical or game
      environment and each episode is scored on a bounded scale -- success or failure, the fraction of goal predicates
      met, route completion discounted by infractions, or efficiency against a baseline under a cap. Record the
      simulator and its build, and the per-episode formula on the Metric: the score is only defined inside one build,
      and the formula changes what is measured.'
    exclusion_test: Do NOT tag this if the episode runs on real hardware, do NOT tag it where the reported quantity
      is unbounded cumulative reward, which is `episodic-return`, and do NOT tag it where the environment is a stateful
      software system checked by a program, which is `environment-state-check`.
  subjects:
  - id: model-in-benchmark-harness
    label: Model in benchmark harness
    definition: A model driven by the benchmark's own fixed agent loop, prompts and tools, applied identically to
      every entrant so that only the model varies.
    inclusion_test: Tag this if the protocol, or one view of it, runs every entrant inside a maintainer-supplied
      multi-turn loop -- mini-SWE-agent in SWE-bench's bash-only view, Terminus 2, the default tau-bench agent,
      BALROG's naive agent -- and the row names only the model. Record the harness and its version in the conditions,
      because the number belongs to the model inside that harness; where the models are addressed as served endpoints,
      tag `hosted-inference-endpoint` as well.
    exclusion_test: Do NOT tag this if the entrant supplies or modifies the loop, which is `agent-scaffold`, and
      do NOT tag it where the benchmark prompts the model once with no loop, which is `instruction-tuned-model`,
      or offers tools in a directed exchange that the protocol rather than the model ends, which is `tool-augmented-model`.
  - id: generative-media-model
    label: Generative media model
    definition: A model that produces images, video, audio or speech as its scored output.
    inclusion_test: Tag this if the artifact under evaluation generates media and the score is a property of the
      generated media.
    exclusion_test: Do NOT tag this if media is an input rather than the output, do NOT tag it where a model scores
      someone else's media, and do NOT tag it where a network is trained to reconstruct a reference image, as in
      restoration or super-resolution, which is `task-specific-supervised-model`.
  - id: domain-specialist-model
    label: Domain-specialist model
    definition: A model post-trained or built for one field, evaluated on that field.
    inclusion_test: 'Tag this if the artifact was specialised for a discipline -- pretrained on its data, post-trained
      or fine-tuned on its tasks, or trained from scratch for a task the discipline defines -- and the benchmark
      is designed to test that specialisation. A discipline here is a scientific, clinical or engineering-design
      field: the physics, chemistry-materials, biology-genetics, medicine-health, earth-climate and engineering-design
      domain families.'
    exclusion_test: Do NOT tag this if a general model is merely evaluated on domain content without adaptation,
      because the tag describes the model the benchmark is designed for and not its subject matter; do NOT tag it
      where the artifact emulates a process in place of a simulation or measurement, which is `scientific-surrogate-model`;
      and do NOT tag it where the task is a general perception, language or audio task with no discipline, such
      as object detection, speech recognition or translation, which is `task-specific-supervised-model`.
  - id: physical-robot-system
    label: Physical robot system
    definition: A complete robot -- policy, body and sensors -- evaluated on real hardware.
    inclusion_test: 'Tag this if the scored run happened on a physical machine, and record the hardware: it is part
      of the system under test. Where the evaluator owns the hardware and gives every entrant the same body and
      sensors, the term still applies and the entrant is the policy running on it; standardised hardware makes entrants
      comparable, it does not take the run off hardware.'
    exclusion_test: Do NOT tag this if the evaluation is simulated however faithfully, and do NOT tag it where hardware
      only collected the dataset or ran a one-off validation experiment outside the benchmark's scored protocol.
  - id: human-ai-team
    label: Human-AI team
    definition: A human and a system working together, evaluated as one entrant.
    inclusion_test: On a Benchmark, tag this if the protocol admits joint entrants, including an entrant category
      labelled human whose members may use automated tools without saying how. On a ResultClaim, tag it if a human
      was in the loop -- without human_in_loop in the conditions and this term on the claim, a human-assisted row
      and an automated row are indistinguishable.
    exclusion_test: Do NOT tag this if a human only configured or prompted the system before an unattended run,
      and do NOT tag it where human entrants and machine entrants each work alone and are merely scored side by
      side.
  - id: scientific-surrogate-model
    label: Scientific surrogate model
    definition: A learned model that emulates a physical, chemical or biological process in place of a simulation
      or measurement.
    inclusion_test: Tag this if the artifact stands in for a solver, potential, forecast system or laboratory assay,
      and is scored against what that process would have produced.
    exclusion_test: Do NOT tag this if the model answers questions about science in language, do NOT tag it where
      the artifact is a classical solver rather than a learned one, and do NOT tag it where a general model of sequences
      or images is scored against measurements it was not trained to emulate, which is `domain-specialist-model`
      or `task-specific-supervised-model`.
  - id: classical-algorithm
    label: Classical algorithm
    definition: A non-learned method -- a solver, heuristic or analytical procedure -- evaluated as an entrant or
      a baseline on the benchmark's task.
    inclusion_test: Tag this if the entrant contains no learned component, whether it competes for the ranking or
      is included as a baseline. Hand-designed methods keep this term when they contain constants fitted once to
      data, as an empirical docking scoring function does, or rules and frequencies tabulated from training data,
      as a template-based expert system does.
    exclusion_test: Do NOT tag this if a trained model -- a neural network, a tree ensemble, or a search that fits
      a model's structure to each dataset, as symbolic regression does -- produces the method's output, and do NOT
      tag it where a classical system provides the ground truth rather than competing. A classical baseline that
      also anchors a scorecard is still an entrant when its own forecasts are scored against the ground truth like
      any other.
  - id: rl-policy
    label: RL policy
    definition: A learned control policy evaluated by acting in an environment.
    inclusion_test: 'On a Benchmark, tag this if the environment is designed for trained policies. On a ResultClaim,
      tag it only if the evaluated artifact was trained on that environment -- several RL benchmarks now receive
      prompted-language-agent claims, which are agent-scaffold, not rl-policy. The policy and the learning procedure
      that produces it are one entrant: a benchmark that ranks lifelong or sample-efficient learning procedures
      by the policies they yield is still this term.'
    exclusion_test: Do NOT tag this if a language model is prompted to act without being trained on the environment,
      do NOT tag it where the policy runs on hardware, which is `physical-robot-system`, and do NOT tag it where
      a learned planner is scored open-loop on logged data without acting, which is `task-specific-supervised-model`.
  - id: task-specific-supervised-model
    label: Task-specific supervised model
    definition: A model trained or fine-tuned with supervision for one general-purpose task, evaluated as the trained
      artifact rather than by prompting.
    inclusion_test: Tag this if the intended entrants are built for a task -- trained from scratch or fine-tuned
      on labelled data, usually the benchmark's own training split -- such as object detectors, speech recognisers,
      speaker-verification systems, translation systems and image-restoration networks, and are scored as trained
      rather than instructed. Where the benchmark ranks a fitting procedure that is refitted on each dataset (symbolic
      regression, AutoML suites), the procedure and the model it fits are one entrant and take this term. A model
      trained for another task and scored as it stands, such as an ImageNet classifier scored against neural recordings,
      also qualifies.
    exclusion_test: Do NOT tag this if the entrant is a general model prompted or instructed to perform the task,
      which is `instruction-tuned-model` or `base-model`; do NOT tag it where the task belongs to a scientific,
      clinical or engineering-design discipline, which is `domain-specialist-model`; and do NOT tag it where a learned
      controller is scored by acting in an environment, which is `rl-policy`. A learned planner scored open-loop
      on logged data, without acting, is this term.
  - id: reasoning-model
    label: Reasoning model
    definition: A model trained or configured to spend inference compute on explicit reasoning before answering,
      where the reasoning effort is a condition of the result.
    inclusion_test: On a ResultClaim, tag this if a reasoning-effort or thinking-budget setting was part of the
      run and materially changes the number.
    exclusion_test: Do NOT tag this if long output happens to be produced without a budget being set, and do NOT
      tag it where the extra compute comes from an external retry loop rather than from the model.
  - id: base-model
    label: Base model
    definition: A pretrained model evaluated by continuation, with no instruction tuning or post-training for task
      compliance.
    inclusion_test: On a Benchmark, tag this if the protocol is designed to work against raw continuation. On a
      ResultClaim, tag it only if the evaluated artifact had no instruction post-training.
    exclusion_test: Do NOT tag this if the system was prompted as an assistant and complied, and do NOT tag it merely
      because the provider calls the checkpoint a base model.
  - id: agent-scaffold
    label: Agent scaffold
    definition: A harness wrapping one or more models with an autonomous loop, memory, retries or tool orchestration.
    inclusion_test: Tag this if the system decides for itself what to do next and when to stop, and the entrant
      supplies or modifies the loop. On a ResultClaim, tag it whenever a harness the entrant chose drove the run,
      even where the leaderboard row names only a model.
    exclusion_test: Do NOT tag this if the loop is the benchmark's own driver applied identically to all entrants,
      which is `model-in-benchmark-harness`, and do NOT tag it where several independent agents negotiate, which
      is `multi-agent-system`.
  - id: instruction-tuned-model
    label: Instruction-tuned model
    definition: A model post-trained to follow instructions, evaluated by prompting it directly with no external
      loop.
    inclusion_test: On a Benchmark, tag this if the protocol expects a compliant assistant. On a ResultClaim, tag
      it if a single model answered with no harness, no tools and no retries.
    exclusion_test: Do NOT tag this if a harness drove the model across turns -- `agent-scaffold` where the entrant
      supplied the harness, `model-in-benchmark-harness` where the benchmark did -- and do NOT tag it where tools
      were available, which is `tool-augmented-model`.
  - id: retrieval-augmented-system
    label: Retrieval-augmented system
    definition: A system in which a retrieval component and a model are evaluated together.
    inclusion_test: Tag this if retrieval is inside the boundary of what is scored, so a change to the index changes
      the result, and retrieval is a built-in component of the entrant rather than a tool the model chooses to call.
    exclusion_test: Do NOT tag this if retrieved material is supplied by the protocol identically to every entrant,
      do NOT tag it where retrieval is one tool among many in an autonomous loop, and do NOT tag it where a model
      decides for itself when to call a single search tool, which is `tool-augmented-model`.
  - id: multi-agent-system
    label: Multi-agent system
    definition: Several agents with distinct roles or objectives, evaluated on their joint behaviour.
    inclusion_test: Tag this if more than one autonomous agent participates and the interaction between them affects
      the score.
    exclusion_test: 'Do NOT tag this if one agent calls sub-models as tools, do NOT tag it where the second party
      is a scripted environment, and do NOT tag it where the other agents are supplied by the benchmark identically
      to every entrant, such as a simulated user: they are part of the environment, and the field describes the
      entrant.'
  - id: tool-augmented-model
    label: Tool-augmented model
    definition: A model given access to tools but driven with no autonomous loop.
    inclusion_test: On a Benchmark, tag this if the protocol offers tools without an autonomous loop. On a ResultClaim,
      tag it if tools were used in a directed exchange -- CritPt is designed for bare models and most of its interesting
      claims are tool-augmented, which is the divergence this facet exists to record.
    exclusion_test: Do NOT tag this if the system iterates autonomously towards a goal -- `agent-scaffold` where
      the entrant supplies the loop, `model-in-benchmark-harness` where the benchmark does -- and do NOT tag it
      where tools were offered but the protocol scores an answer produced without them.
  - id: full-product-pipeline
    label: Full product pipeline
    definition: A shipped end-to-end product evaluated as delivered, including components its vendor does not describe.
    inclusion_test: On a Benchmark, tag this if the protocol scores shipped systems. On a ResultClaim, tag it if
      what ran was a product whose components are not documented well enough to rebuild the run.
    exclusion_test: Do NOT tag this if the components are documented well enough to rebuild the run, and do NOT
      tag it where a hosted endpoint serves a single named model.
  - id: human-expert
    label: Human expert
    definition: Credentialed humans evaluated on the same task as machine entrants.
    inclusion_test: On a Benchmark, tag this if the protocol admits human entrants who work unaided. On a ResultClaim,
      tag it if the scored run was performed by humans credentialed in the benchmark's domain. People who built
      or validated the items may be tagged when they also sat the task under the protocol; say so in the notes,
      because their exposure to the items makes theirs a construction-staff baseline.
    exclusion_test: Do NOT tag this if humans only authored or graded the benchmark, do NOT tag it where a human
      worked alongside a system, which is `human-ai-team`, and do NOT tag it where the humans' credentials are in
      a field other than the benchmark's own, which is `human-nonexpert`.
  - id: hosted-inference-endpoint
    label: Hosted inference endpoint
    definition: A provider-served endpoint whose identity includes how it is served, not only which model it names.
    inclusion_test: On a Benchmark, tag this if the protocol evaluates endpoints as served. On a ResultClaim, tag
      it whenever the artifact was addressed by a provider slug, however the benchmark describes itself -- Epoch's
      927 endpoint strings are claims about endpoints on benchmarks designed for models.
    exclusion_test: Do NOT tag this if the weights were run locally under known settings, and do NOT tag it where
      the endpoint is merely the delivery mechanism for a fully specified model.
  - id: human-nonexpert
    label: Human non-expert
    definition: Humans without domain credentials evaluated on the same task as machine entrants.
    inclusion_test: Tag this if humans without credentials in the benchmark's domain produced scored results under
      the benchmark's protocol, including credentialed people answering outside their own field.
    exclusion_test: Do NOT tag this if crowd workers rated outputs rather than attempting the task, and do NOT tag
      it where a screen for expertise in the benchmark's own domain was applied.
  - id: attack-or-intervention-method
    label: Attack or intervention method
    definition: A procedure applied to other models -- an attack, a defence, or an unlearning or editing method
      -- and ranked by its effect on them.
    inclusion_test: 'Tag this if the benchmark ranks procedures applied to a fixed set of target models, scoring
      each by what it does to them: attack success, hazardous knowledge removed, capability retained. Where the
      benchmark also ranks the target models, tag their own subject term as well.'
    exclusion_test: Do NOT tag this if the procedure performs the task itself as a harness around a model, which
      is `agent-scaffold`, and do NOT tag it where the benchmark applies a fixed set of attacks and ranks only the
      models, which is the models' own term with `adversarial-red-team` as the method.
  lifecycle:
  - id: deprecated
    label: Deprecated
    definition: The maintainer has advised against further use without necessarily withdrawing the material.
    inclusion_test: Tag this only if the maintainer advises against further use of the benchmark itself, whether
      or not the material stays available.
    exclusion_test: Do NOT tag this for an end-of-maintenance notice that gives no advice against use (that is `maintenance_status`
      evidence), for a 'deprecated' label on a replaced server, library or code base rather than on the benchmark,
      or for a paused leaderboard whose maintainers point users to its results. A deprecated benchmark cannot be
      `accepting-submissions` (02 S11).
  - id: superseded
    label: Superseded
    definition: A later benchmark has replaced this one for its purpose, though the original remains coherent.
    inclusion_test: 'Tag this if a later benchmark, or a later edition or version of the same family, has replaced
      the instrument the entry names for its purpose. lifecycle describes the entry as catalogued: an edition or
      version entry is superseded when its successor takes over, even while the family is active, and the family''s
      standing belongs on the family record.'
    exclusion_test: Do NOT tag this where only the code base is replaced while the data and scores carry over, where
      only the competition was replaced while the instrument's own leaderboard stays in use (record the ending in
      `activity` and keep the instrument's standing), or on a family entry whose current edition is in use (`active`).
  - id: mature
    label: Mature
    definition: The benchmark is established and stable, with a settled result record and no expectation of structural
      change, including an instrument whose maintainer has ended its competition or frozen its leaderboard while
      it remains available and in use.
    inclusion_test: 'Tag this if the instrument is established, available and in use, its result record has settled,
      and nothing announced will change its structure, including when the maintainer has ended the competition,
      entered maintenance mode or frozen the leaderboard. Record that ending in `activity`: `closed`, or `leaderboard-live-no-round`
      where a permanent phase stays open (ADR-0019).'
    exclusion_test: Do NOT tag this where results are still being produced in the ordinary way (`active`), where
      the maintainer has signalled a structural change or a successor, such as a leaderboard paused pending one,
      where a later edition has replaced the entry (`superseded`), or where nobody maintains it and it has gone
      unused for long enough (`dormant`).
  - id: under-revision
    label: Under revision
    definition: The maintainer is correcting or reissuing the benchmark content, so a score reported without a version
      is not interpretable.
    inclusion_test: Tag this if the maintainer has announced corrections to, or a reissue of, the content the entry
      names and that work is in progress, such as batched task fixes for an upcoming release or errata being applied.
      It takes precedence over `active`, because an unversioned score is then uninterpretable.
    exclusion_test: Do NOT tag this where new variants are released beside a finalised set that is not itself being
      edited (the set keeps its own standing, and the variants are their own entries), or where only the evaluation
      code base is replaced while the content carries over.
  - id: proposed
    label: Proposed
    definition: The benchmark has been announced or published but is not yet in use.
  - id: contaminated
    label: Contaminated
    definition: The benchmark is compromised as an instrument by evidenced training-data leakage, and the value
      is hand-set and requires an evidence source.
  - id: retracted
    label: Retracted
    definition: The benchmark has been formally withdrawn by its maintainer, and the value is hand-set and requires
      an evidence source.
  - id: dormant
    label: Dormant
    definition: The benchmark is neither maintained nor formally ended, and no activity has been observed for long
      enough that it should not be read as current; a formally ended competition series is not dormant, because
      its ending is recorded in `activity` and `lifecycle` keeps the instrument's standing.
    inclusion_test: Tag this if nobody maintains the benchmark, nothing formally ended it, and no results have been
      produced against the instrument for long enough that it should not be read as current.
    exclusion_test: 'Do NOT tag this on the originators'' inactivity alone (a last commit, an archived repository,
      a deprecated library): that is `maintenance_status` evidence, and a community standard still in use is `active`
      or `mature`. Where the sources show only that inactivity and are silent on current use, leave the field null
      and log it. Do NOT tag it for a formally ended series or a maintainer freeze (keep the instrument''s standing
      and record the ending in `activity`), for a pause the maintainer has announced, or while the benchmark is
      `accepting-submissions`, which 02 S11 blocks.'
  - id: active
    label: Active
    definition: The benchmark is in current use and results are still being produced against it.
    inclusion_test: 'Tag this if results are still being produced against the instrument the entry names, by its
      maintainer or by anyone else. lifecycle describes the entry as catalogued: an edition or version entry takes
      its own standing, not its family''s, and a family entry is active while any member is still producing results.
      A community standard whose originators have stopped touching it is active while it is still used, and their
      inactivity is `maintenance_status` evidence.'
    exclusion_test: Do NOT tag this for an edition or version that a later one has replaced for its purpose, even
      while the family is active (`superseded`); where the maintainer is correcting or reissuing the content the
      entry names (`under-revision`); where no new results are being produced but the instrument stays established
      and available, including a record its maintainer has frozen (`mature`); or where the only results are the
      maintainers' own release baselines and they state that benchmarking use has not begun (`proposed`).
  data.access:
  - id: proprietary-closed
    label: Proprietary and closed
    definition: The data is owned and withheld commercially, with no public access path at any tier.
  - id: gated-registration
    label: Gated by registration
    definition: The data is public but reachable only after creating an account or accepting click-through terms.
    inclusion_test: Tag this if the evaluation data behind the headline score, labels included, is released, but
      every official copy needs an account, a form or click-through acceptance of terms. For a competition with
      no distributable data, tag it when anyone who registers is admitted.
    exclusion_test: Do NOT tag this if the evaluation labels are withheld (train-open-test-held-out or private-test-server
      take precedence, and the gate goes in the notes). Do NOT tag it if one official copy is reachable without
      registration, or if the only obstacle is a printed password or a no-reveal request (fully-open), or if access
      needs the maintainer's approval of verified credentials and a signed agreement (credentialed-dua).
  - id: credentialed-dua
    label: Credentialed data-use agreement
    definition: Access requires verified credentials, training certification and a signed data-use agreement, as
      the PhysioNet class of clinical datasets does.
  - id: generated-on-demand
    label: Generated on demand
    definition: Evaluation items are produced fresh per run rather than drawn from a fixed stored set, which makes
      the benchmark contamination-resistant by construction.
    inclusion_test: Tag this only if a program or model produces the scored items afresh for each run or match,
      such as a procedural generator or a game engine in which entrants play each other, so no fixed item set exists
      to be obtained.
    exclusion_test: Do NOT tag this for items that people improvise live, such as an arena's user prompts or an
      evaluator's chosen robot task. There is no generator and no resistance by construction, and the access state
      is that of the record of those items. Do NOT tag it when items are resampled at each evaluation from a fixed
      pool.
  - id: private-test-server
    label: Private test server
    definition: The evaluation set never leaves the maintainer, and a score is produced only by the maintainer running
      or scoring the entrant's system on it, whether through a submission server or on request.
    inclusion_test: 'Tag this if the evaluation items behind the headline score, and not only their labels, are
      held by the maintainer and scored only on the maintainer''s side: through a submission server, a container
      the organisers run, or an evaluation the maintainer runs itself or on request. Tag it also when the headline
      score combines open sets with such a held set, because the headline cannot be computed without it. Sharing
      the set privately with vetted parties, case by case, creates no public access path and does not change this
      tag.'
    exclusion_test: Do NOT tag this if the evaluation inputs are released and only their labels are withheld (train-open-test-held-out).
      Do NOT tag it for a held set used only to check for overfitting, on which no published score is computed,
      or for a set withheld because its release would carry misuse risk (restricted-dual-use).
  - id: restricted-dual-use
    label: Restricted for dual-use reasons
    definition: Material is deliberately withheld because releasing it would carry misuse risk, which is a different
      state from being commercially closed.
  - id: invitation-only
    label: Invitation only
    definition: Participation is limited to teams the organisers invite, so the field of entrants is closed by decision
      rather than by capability.
    inclusion_test: Tag this if the organisers decide who may enter, by invitation or by selecting among applicants,
      so the field of entrants is closed by decision. For a competition with no distributable data, such as a physical
      race, this is the access state when entry is by selection.
    exclusion_test: Do NOT tag this if anyone who registers is admitted (gated-registration for a competition with
      no distributable data), or if the selection governs access to data rather than entry to the evaluation (credentialed-dua).
  - id: fully-open
    label: Fully open
    definition: Every split, including the evaluation labels, is publicly downloadable without registration or agreement.
    inclusion_test: Tag this if the evaluation data behind the headline score, labels included, can be downloaded
      by anyone without an account or an agreement from at least one official copy. A password printed in the official
      README, or a request not to republish items, is an anti-contamination device rather than a gate and does not
      stop this tag. For a blind-prediction round whose ground truth does not exist or is embargoed while entries
      are collected, judge the data once the round has closed and the ground truth is released. For a family whose
      editions are distributed differently, the current edition decides.
    exclusion_test: Do NOT tag this if any evaluation set that the headline score is computed on is withheld, held
      by the maintainer or reachable only after registration. When the headline mixes an open set with a withheld
      one, the withheld set decides. Do NOT tag it for a public sample when the headline score is computed on a
      larger unreleased set.
  - id: train-open-test-held-out
    label: Train open, test held out
    definition: The evaluation inputs or the training material are released while the evaluation labels are withheld
      by the maintainer, whatever gate the released material sits behind.
    inclusion_test: 'Tag this if the labels or answers of the evaluation set behind the headline score are withheld
      while its inputs or the training material are released, so the entrant runs the system and submits outputs
      or code for scoring. It takes precedence over a gate on the released material: when the data sits behind registration
      or an approval-and-signature agreement and the test labels are withheld, tag this and record the gate in the
      notes.'
    exclusion_test: Do NOT tag this if the evaluation items themselves, and not only their labels, never leave the
      maintainer (private-test-server). Do NOT tag it when the evaluation labels are released, whatever gate they
      sit behind.
  data.refresh:
  - id: periodic-recompetition
    label: Periodic recompetition
    definition: The benchmark runs as recurring editions whose rankings are produced on evaluation data new to each
      edition, which is neither static nor rolling.
    inclusion_test: Tag this if the headline scores are rankings of recurring, dated competition editions and each
      edition brings new evaluation data at the family level, even when some of its tasks reuse an earlier set or
      the task line-up changes. The field describes the family (02 S11 rule 5), so an entry that is one edition
      of such a series takes this term too. For a live physical competition, each edition's trials are new by construction.
    exclusion_test: Do NOT tag this if every edition re-ranks entrants on one fixed test set (versioned-releases
      or static), or if the headline scores come from a labelled dataset version that competition rounds sit beside
      (versioned-releases). Do NOT tag it when items are posed before their answers exist (resolves-over-time takes
      precedence).
  - id: resolves-over-time
    label: Resolves over time
    definition: Items are posed before their answers exist and are scored as reality resolves them, pairing with
      the claim-level resolution_status field.
    inclusion_test: Tag this if items are posed before their answers exist and are scored as reality resolves them.
      It takes precedence over periodic-recompetition, continuously-generated and rolling-live when those also hold,
      because it is the property that makes a pending score provisional, and the edition or generation cadence goes
      in the notes.
    exclusion_test: Do NOT tag this if the answers exist when the items are posed but are withheld or embargoed
      until a round closes, as in a blind round whose reference structures are already solved (periodic-recompetition).
  - id: continuously-generated
    label: Continuously generated
    definition: New items are synthesised on an ongoing basis from a generator rather than curated in batches.
    inclusion_test: Tag this if a generator synthesises the evaluation items on an ongoing basis, per run or on
      a schedule, rather than a curated batch fixing them.
    exclusion_test: Do NOT tag this if the scored content is a fixed pool from which items are resampled at each
      evaluation (static or versioned-releases), or if a generator exists but is not used to add evaluation items.
      Do NOT tag it if the generated items are posed before their answers exist (resolves-over-time takes precedence).
  - id: rolling-live
    label: Rolling live
    definition: The content behind a live leaderboard, meaning its items, tasks, scoring or rating pool, changes
      continuously or between labels, so what a score means depends on when it was measured.
    inclusion_test: Tag this if the leaderboard's items, tasks, scoring or rating pool change without each change
      being carried by a labelled version or a dated announcement that a claim can cite, so a score needs its measurement
      date to be read. It takes precedence over versioned-releases when labelled versions exist but content also
      changes between them.
    exclusion_test: Do NOT tag this if every change is carried by a version label or a dated announcement (versioned-releases),
      if each competition edition brings a new set (periodic-recompetition), or if the items are posed before their
      answers exist (resolves-over-time takes precedence). A named frozen set beside a rolling fork is a separate
      entry, not a layer of this one.
  - id: static
    label: Static
    definition: The benchmark's content, meaning its items, task list and scoring function, is one fixed set that
      has not changed since release.
    inclusion_test: Tag this if nothing that fixes what a score means has changed since release. Items resampled
      at evaluation time from a fixed pool, and a generator shipped beside a fixed canonical set but not used to
      add evaluation items, leave the content static.
    exclusion_test: 'Do NOT tag this if the items, tasks or scoring changed after release, even to correct errors:
      a dated, announced revision makes it versioned-releases, and unannounced changes against a live leaderboard
      make it rolling-live. Do NOT tag it for one edition of a recurring series, because the field describes the
      family (periodic-recompetition).'
  - id: versioned-releases
    label: Versioned releases
    definition: Content changes only in discrete revisions, each identified by a version label or a dated announcement,
      that a claim can be pinned to.
    inclusion_test: Tag this if every change to the items, tasks or scoring since release is carried by a labelled
      version or a dated maintainer announcement, so a claim can name the state it was measured on. A scoring change
      under a new version label counts, and so does a dated erratum. It also applies when the headline scores come
      from a labelled dataset or devkit version that competition rounds sit beside.
    exclusion_test: Do NOT tag this if changes reach the live leaderboard between labels or without any pin (rolling-live),
      or if the headline scores are rankings of recurring editions each with new evaluation data (periodic-recompetition,
      with the version labels on the claims). Do NOT tag it for a task set that someone other than the maintainer
      derived from the benchmark, which is a separate entry linked by `variant_of`.
  - id: continuously-reexecuted
    label: Continuously re-executed
    definition: Results are recomputed whenever the maintainer's pipeline re-runs, so a stored claim without a pipeline
      commit is unanchored, whether or not the tasks also carry version labels.
    inclusion_test: Tag this if the maintainer re-runs the methods and re-scores the leaderboard automatically as
      code, data or methods change, even where the task definitions carry labelled versions. It takes precedence
      over versioned-releases, because a label does not pin a re-executed result.
    exclusion_test: Do NOT tag this if results are fixed once submitted or released and only the content changes
      (versioned-releases or rolling-live), or if re-running happens only when a new version is released.
  data.contamination_risk:
  - id: medium
    label: Medium
    definition: A contamination route is plausible but unevidenced, which is the honest default for a public static
      set of any age.
    inclusion_test: Tag this if the scored content is public or reachable by entrants and a route into training
      data is plausible, but no source evidences one for a split the benchmark scores. A route evidenced only for
      one entrant, such as a model trained on the evaluation period, does not raise the benchmark above medium and
      is recorded on that entrant's claims.
    exclusion_test: Do NOT tag this if a source evidences a route into content the benchmark still scores (high),
      or if the structure excludes a route (low).
  - id: unknown
    label: Unknown
    definition: Nobody has assessed the contamination posture of this benchmark, which is a statement about our
      knowledge and not a claim that the risk is low.
  - id: confirmed
    label: Confirmed
    definition: Contamination has been demonstrated and documented, and the entry may not carry this value without
      at least one contamination_evidence source.
  - id: low
    label: Low
    definition: No plausible route by which the evaluation content entered training data is known, and the benchmark's
      structure works against one.
    inclusion_test: Tag this if the structure excludes a training route to the scored content, such as answers that
      did not exist at submission, a live physical trial, a set never exposed, or a filter that keeps only items
      released after an entrant's training cutoff, and no evidenced route remains open in what is scored. Tag it
      also when a route was evidenced and then closed by the maintainer before scoring, with the evidence and the
      fix in contamination_notes. The structure is the evidence and is stated in contamination_notes (02 S7).
    exclusion_test: Do NOT tag this if nobody has considered the question and the structure does not settle it (unknown),
      or if the scored content is public and a route is merely plausible (medium). Do NOT tag it while an evidenced
      route remains open in a split the benchmark still scores (high).
  - id: high
    label: High
    definition: A specific contamination route is evidenced, and the entry may not carry this value without at least
      one contamination_evidence source.
    inclusion_test: Tag this if at least one contamination_evidence source evidences a specific route into content
      the benchmark still scores and publishes, including a protocol that evaluates on the very data it releases
      for training. One contaminated split the benchmark scores is enough, and contamination_notes names the split
      (02 S11).
    exclusion_test: Do NOT tag this without a contamination_evidence source, which is blocking (02 S11). Do NOT
      tag it for a route the maintainer closed before scoring (low or medium, with the evidence in the notes), or
      for a route evidenced only for one entrant's training data (that entrant's claims).
  data.ceiling_anchor_type:
  - id: crowd-average
    label: Crowd average
    definition: The top of the scale is the mean, or another central statistic, of the measured performance of non-specialist
      humans.
    inclusion_test: Tag this if the sources read scores against a mean, median or other central statistic of non-specialist
      humans' measured performance, including a median over those who completed a task. When the sources give several
      crowd statistics, the one the headline reads against decides, and the others are further Baseline records.
    exclusion_test: Do NOT tag this if the humans were recruited for specialist knowledge the tasks require (expert-average),
      or if the statistic is the best single person's score (crowd-best).
  - id: crowd-best
    label: Crowd best
    definition: The top of the scale is the best performance achieved by a non-specialist human annotator.
  - id: expert-average
    label: Expert average
    definition: The top of the scale is the mean, or another central statistic, of the measured performance of qualified
      domain experts.
    inclusion_test: Tag this if the sources read scores against the measured performance of qualified experts as
      a group, including professionals scored under the same protocol as systems, an anchor systems have since exceeded,
      or an expert reference that marks parity on a win-rate scale. Headroom against an exceeded anchor is computed
      unclamped (12 S3.1).
    exclusion_test: Do NOT tag this if the expert behaviour is built into the scoring function rather than reported
      as a score, such as a logged expert trajectory that switches penalties off. Do NOT tag it if the anchor is
      the agreement between expert annotations of the reference labels (noise-ceiling).
  - id: noise-ceiling
    label: Noise ceiling
    definition: The top of the scale is the reliability limit of the measurement itself, above which any gain would
      be fitting noise.
    inclusion_test: Tag this if the anchor is the reliability of the reference measurement itself, such as test-retest
      or split-half agreement of recordings, or the inter- and intra-rater variability of the expert annotations
      that serve as ground truth.
    exclusion_test: Do NOT tag this if experts perform the task and are scored like systems against a reference
      they did not produce (expert-average). Do NOT tag it if the agreement figure concerns raters of system outputs
      rather than the reference labels.
  - id: none-known
    label: None known
    definition: No anchor for the best end of the headline metric has been established, either because none has
      been measured or because the scale cannot have one, so headroom cannot be computed and its absence must be
      shown rather than rendered as a blank.
    inclusion_test: 'Tag this if the benchmark''s sources publish no reference for the best end of the headline
      metric, including where no anchor can exist: a rating fitted to a pool (Elo, Bradley-Terry), a score normalised
      to the best of a pool of entrants or reference models, an unbounded metric such as PSNR, or a lower-is-better
      target equal to chance. Why it is absent is recorded on the Metric (unbounded, requires_pool, optimum) and
      on a Baseline''s value_absent_reason, not by a separate term.'
    exclusion_test: Do NOT tag this if the sources publish a human score, an operational system or a measured ceiling
      that scores are read against, even when systems now exceed it or it marks parity rather than a maximum (tag
      its type). Do NOT tag it if the headline metric has a defined bound at its optimum and no measured anchor
      (theoretical-maximum). Anchors of secondary metrics or other tracks go to ceiling_by_category and do not change
      this value.
  - id: expert-best
    label: Expert best
    definition: The top of the scale is the best performance achieved by a qualified domain expert.
  - id: measured-ceiling
    label: Measured ceiling
    definition: The top of the scale is an empirically measured limit on achievable performance given the data,
      rather than a bound derived from the metric.
    inclusion_test: 'Tag this if an empirical check establishes the achievable score on the data: an oracle or gold
      solution run against the tests, human validation that every item is solvable, or a measured bound below the
      metric''s maximum. It takes precedence over theoretical-maximum when the checked limit equals the bound.'
    exclusion_test: Do NOT tag this for a score normalised to the best agent of a reference pool, which is not a
      limit on what is achievable (none-known). Do NOT tag it where no check was run (theoretical-maximum).
  - id: operational-system
    label: Operational system
    definition: The anchor is an incumbent production system scored as a comparator against the same ground truth,
      for which asking after a human baseline would be a category error.
    inclusion_test: Tag this if the sources read scores against an incumbent system in operational use, scored like
      an entrant against ground truth it did not produce, including when entrants now beat it. Headroom is then
      computed unclamped (12 S3.1).
    exclusion_test: Do NOT tag this if the incumbent's output is itself the ground truth (theoretical-maximum, since
      matching it is the bound). Do NOT tag it if the reference is a published research model or a designated control
      method rather than a system in operational use.
  - id: theoretical-maximum
    label: Theoretical maximum
    definition: The best end of the scale is the headline metric's own bound at its optimum, rather than any measured
      performance.
    inclusion_test: Tag this if the headline metric is bounded at its optimum, such as 1.0, 100% or zero error,
      and no source publishes a measured human, system or data ceiling that scores are read against. It applies
      when the ground truth is an incumbent code's output, because matching the reference labels is then the bound
      itself. Anchors of secondary metrics go to ceiling_by_category.
    exclusion_test: Do NOT tag this if an empirical check, such as an oracle solution run or human validation, establishes
      the achievable score (measured-ceiling), or if an incumbent system is scored as a comparator against independent
      ground truth (operational-system). Do NOT tag it if the headline metric is unbounded or pool-relative (none-known).
  - id: experimental-replicate
    label: Experimental replicate
    definition: The top of the scale is the agreement between repeated runs of a physical experiment, so the hundred-per-cent
      anchor is an experiment rather than a person.
  execution.reproducibility_tier:
  - id: requires-physical-experiment
    label: Requires a physical experiment
    definition: Reproduction requires running an experiment in the physical world.
  - id: automatable-with-simulator
    label: Automatable with a simulator
    definition: Reproduction is automatic but requires a specific simulation environment.
  - id: requires-human-raters
    label: Requires human raters
    definition: Reproduction requires recruiting and paying human judges.
    inclusion_test: Tag this if any part of the headline score needs human judges to be recruited, even for a minority
      of tasks, and nothing more restrictive applies.
    exclusion_test: Do NOT tag this if a hardware fleet is also required (requires-specialized-hardware), or if
      only the maintainer holds the items or the rater base that produces the score (not-independently-reproducible).
  - id: not-independently-reproducible
    label: Not independently reproducible
    definition: No party outside the maintainer can reproduce the result at all.
    inclusion_test: Tag this if some part of the headline score can be produced only by the maintainer, because
      it holds the evaluation set, the scorer or the user base that produces it, even when other parts are public
      or a calibrated public sibling set exists. It is the most restrictive tier and takes precedence over every
      other.
    exclusion_test: Do NOT tag this merely because nobody, the maintainer included, can repeat a past run's conditions
      exactly, as with a live world or improvised trials; tag the tier a fresh run needs and add the live-world-state
      blocker. Do NOT tag it for a component outside the headline score, such as a private set used only to check
      overfitting.
  - id: requires-specialized-hardware
    label: Requires specialised hardware
    definition: Reproduction requires hardware that is not generally available.
    inclusion_test: Tag this if reproducing the headline score needs hardware that is not generally available, such
      as a robot fleet or quantum devices, and nothing only the maintainer holds is needed. It takes precedence
      over requires-human-raters when a run needs both.
    exclusion_test: Do NOT tag this if the hardware is a GPU machine or cluster that can be rented, whose cost the
      compute-scale blocker records. Do NOT tag it if the result depends on something only the maintainer holds
      (not-independently-reproducible).
  - id: fully-automatable
    label: Fully automatable
    definition: An independent party can reproduce a run end to end with no human or physical step.
    inclusion_test: Tag this if an independent party can produce the headline official score for a new system end
      to end, running and scoring it, with no human, physical, simulator-build or maintainer-only step anywhere
      in that score.
    exclusion_test: Do NOT tag this if any part of the headline score needs human graders, physical hardware, a
      specific simulator or a set only the maintainer holds, even when that part is a minority of tasks, because
      the most restrictive requirement decides (02 S11 also blocks this tier beside any blocker except licence-restriction).
      Do NOT tag it because a public set is calibrated to match a withheld one, or because a published number can
      be re-fitted from released outputs.
  governance.independence_flags:
  - id: single-evaluator-private-test-set
    label: Single evaluator, private test set
    definition: One party holds the evaluation set and runs every evaluation, which resists contamination and simultaneously
      prevents outside verification.
  - id: funded-by-evaluated-party
    label: Funded by an evaluated party
    definition: The benchmark is funded by an organisation whose systems it evaluates.
    inclusion_test: Tag this if an organisation whose systems the benchmark evaluates gave the maintainer money
      or in-kind support for the benchmark or for the publication that defines its method, including grants, API
      access or credits, and compute. A maintainer's statement that the benchmark is independent goes in a note
      and does not remove the flag.
    exclusion_test: Do NOT tag this where the funder's systems are not evaluated, where the only support is access
      any user can buy, where the support is a prize pool (`prize-sponsored-by-industry`), or where the sources
      name only an unnamed 'industry partner' (leave it unset and log the gap). Access to an unreleased model for
      the purpose of evaluating it is not by itself funding.
  - id: prize-sponsored-by-industry
    label: Prize sponsored by industry
    definition: A commercial sponsor funds the prize pool for the benchmark or its competition.
  - id: no-known-conflict
    label: No known conflict
    definition: We looked for an independence conflict and found none, which is a statement about our search and
      its date rather than a guarantee that none exists.
    inclusion_test: Tag this only if the sources were searched for every other flag in this field, including material
      support from an evaluated party, and none applies; record the search date in last_verified.
    exclusion_test: Do NOT tag this where the search could not be completed, such as sponsors shown only as logos,
      an unnamed industry partner or an unreadable site (leave the field empty and log the failure), or where an
      evaluated party gave money or in-kind support such as API credits (`funded-by-evaluated-party`).
  - id: commercial-leaderboard-placement
    label: Commercial leaderboard placement
    definition: Placement or visibility on the leaderboard can be influenced by a commercial arrangement.
  - id: maintainer-competes-on-own-benchmark
    label: Maintainer competes on own benchmark
    definition: The party maintaining the benchmark also submits systems evaluated by it.
  - id: grader-from-evaluated-party
    label: Grader from an evaluated party
    definition: A judge model or human rater that produces the published scores is itself an evaluated system or
      is supplied by a party whose systems are evaluated.
    inclusion_test: Tag this if any grader in the official scoring path (a judge model, a jury member or a human
      rater) is one of the evaluated systems or an earlier snapshot of one, or comes from or is employed by an organisation
      whose systems are evaluated. Tag it beside `maintainer-competes-on-own-benchmark` when the maintainer's own
      model is also the judge, because the two record different conflicts.
    exclusion_test: Do NOT tag this where scoring is programmatic (unit tests, exact match, game outcomes), where
      the judge's vendor has no system among those evaluated, or where the only conflict is that the maintainer
      submits systems (`maintainer-competes-on-own-benchmark`).
  - id: evaluator-sells-evaluations
    label: Evaluator sells evaluations
    definition: The party producing the results sells evaluation as a commercial service.
  - id: results-published-only-in-vendor-document
    label: Results published only in a vendor document
    definition: The results appear only inside a document controlled by the party being evaluated, such as a model
      card or system card.

  - id: chemistry-materials/retrosynthesis
    label: Retrosynthesis
    definition: Proposing a synthetic route from a target molecule back to purchasable starting materials.
  - id: earth-climate/climate-projection
    label: Climate projection
    definition: Projecting climate variables over long horizons under stated emissions or forcing scenarios.
  - id: physics/condensed-matter
    label: Condensed matter
    definition: Predicting properties of condensed-matter systems such as electronic structure or phase behaviour.
  - id: biology-genetics/protein-protein-interaction
    label: Protein protein interaction
    definition: Predicting whether two proteins bind and what the bound complex looks like.
  - id: audio-speech/speech-recognition
    label: Speech recognition

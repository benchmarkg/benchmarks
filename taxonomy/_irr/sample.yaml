  - id: general-intelligence/multi-subject-knowledge-exams
    label: Multi-subject knowledge exams
    definition: Closed-ended question sets drawn from exams, textbooks or expert-written questions across many academic
      subjects, scored on the answers alone.
    inclusion_test: Tag this as PRIMARY if the benchmark's own claim is breadth of subject knowledge or expertise,
      its items are closed-ended questions, and no single subject holds most of them.
    exclusion_test: Do NOT tag this if one subject holds most of the items (that subject's family is primary), if

  - id: multimodal/visual-qa
    label: Visual QA
    definition: Answering questions about an image where the answer depends jointly on the question and the image.
  - id: chemistry-materials/molecular-property-prediction
    label: Molecular property prediction
    definition: Predicting a physical, chemical or biological property of a molecule from its structure.
  - id: biology-genetics/regulatory-genomics
    label: Regulatory genomics
    definition: Predicting regulatory activity such as expression level, chromatin state or transcription-factor
      binding directly from genomic sequence.
  - id: chemistry-materials/lab-automation-protocols
    label: Lab automation protocols
    definition: Producing an executable laboratory protocol from a stated experimental goal.
  - id: language/understanding
    label: Understanding
    definition: Answering questions whose answers are determined by a supplied passage.
  - id: safety-alignment/agentic-harm
    label: Agentic harm
    definition: Measuring whether an agent completes harmful tasks, scored on task completion rather than on output
      toxicity.
  - id: safety-alignment/harmlessness-refusal
    label: Harmlessness refusal
    definition: Measuring whether a system refuses what it should refuse and complies with what it should not refuse.
  - id: physics/physics-reasoning
    label: Physics reasoning
    definition: Solving physics problems posed in text, scored on the physics answer rather than on a simulation.
  - id: medicine-health/medical-safety
    label: Medical safety
    definition: Measuring harmful, unsafe or inappropriate clinical advice.
  - id: safety-alignment/unlearning-knowledge-removal
    label: Unlearning knowledge removal
    definition: Measuring whether targeted knowledge has actually been removed, a setting in which a lower score
      is the safer one.
  - id: engineering-design/structural-mechanical-design
    label: Structural mechanical design
    definition: Designing mechanical or structural components against load and material constraints.
  - id: robotics-embodiment/dexterous-manipulation
    label: Dexterous manipulation
    definition: Manipulation whose difficulty is fine high-degree-of-freedom control, such as in-hand reorientation
      or precise insertion.
  - id: agents-tooluse/agent-evaluation-suites
    label: Agent evaluation suites
    definition: Suites whose scored tasks span several of the agents-tooluse family's subdomains, reported per task
      or as one aggregate, where the suite's own claim is coverage within the family.
    inclusion_test: Tag this as PRIMARY if the tasks span two or more of the agents-tooluse family's subdomains,
      no one subdomain holds most of them, and the benchmark's own claim is breadth within the family. Record the
      subdomains the tasks fall in as secondary.
    exclusion_test: Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and the
      others secondary), or if the suite spans several families, which is `general-intelligence`.
  - id: vision/video-understanding
    label: Video understanding

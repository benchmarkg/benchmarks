  - id: audio-speech/speaker-tasks
    label: Speaker tasks
    definition: Identifying, verifying, diarising or separating speakers from audio.
  - id: robotics-embodiment/cross-embodiment-transfer
    label: Cross embodiment transfer
    definition: Measuring how well a policy trained on one robot body performs on a different body.
  - id: reasoning-general/puzzle-solving
    label: Puzzle solving
    definition: Solving a posed problem by submitting an answer, rather than by acting in an episode.
  - id: language/retrieval-qa
    label: Retrieval QA
    definition: Answering questions that require retrieving supporting documents from a corpus first.
  - id: vision/detection
    label: Detection

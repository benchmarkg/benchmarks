  - id: games-planning/multi-game-suites
    label: Multi-game suites
    definition: Suites whose scored tasks span several of the games-planning family's subdomains, reported per task
      or as one aggregate, where the suite's own claim is coverage within the family.
    inclusion_test: Tag this as PRIMARY if the tasks span two or more of the games-planning family's subdomains,
      no one subdomain holds most of them, and the benchmark's own claim is breadth within the family. Record the
      subdomains the tasks fall in as secondary.
    exclusion_test: Do NOT tag this if one subdomain holds most of the tasks (tag that subdomain primary and the
      others secondary), or if the suite spans several families, which is `general-intelligence`.
  - id: engineering-design/cad-geometry-generation
    label: CAD geometry generation
    definition: Producing computer-aided design geometry that satisfies a stated specification.
  - id: language/dialogue
    label: Dialogue
    definition: Conducting a multi-turn conversation, scored on the conversation as a whole rather than on one reply.
  - id: medicine-health/mental-health
    label: Mental health

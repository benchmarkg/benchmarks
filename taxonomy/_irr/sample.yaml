  - id: agents-tooluse/computer-use-gui
    label: Computer use (GUI)
    definition: Completing tasks by operating a graphical user interface through synthetic mouse and keyboard input.
    inclusion_test: 'Tag this as PRIMARY if the agent operates desktop applications through a graphical interface,
      observing the screen and acting by mouse and keyboard, and the grader checks the resulting application or
      file state. Episode length does not move it: a long-horizon GUI benchmark stays here, with `long-horizon-autonomy`
      as secondary.'
    exclusion_test: Do NOT tag this if the tasks are confined to web sites in a browser (`web-navigation`), or if
      the agent acts through a shell or an API with no graphical interface (`operating-system-tasks`, `tool-api-calling`).
  - id: games-planning/video-games
    label: Video games
    definition: Playing video games through their ordinary observation and action interfaces.
  - id: games-planning/puzzle-games
    label: Puzzle games
    definition: Solving puzzles through an interactive episode against an environment that responds.
  - id: general-intelligence/human-comparison-batteries
    label: Human comparison batteries
    definition: Broad batteries built specifically to compare system performance against measured human performance.
  - id: earth-climate/ecology-biodiversity
    label: Ecology biodiversity
    definition: Identifying species, or measuring or predicting their distribution and abundance, or the condition
      of an ecosystem.
    inclusion_test: Tag this as PRIMARY if the benchmark's own claim is biodiversity or ecosystem monitoring, whatever
      modality its tasks use (images, sound, text); record the method subdomains (`vision/classification`, `audio-speech/bioacoustics`,
      `language/information-extraction`) as secondary.
    exclusion_test: Do NOT tag this as primary if the benchmark is one method task whose claim is that method, such
      as species calls in soundscapes scored as an audio task (`audio-speech/bioacoustics`, with this term secondary),

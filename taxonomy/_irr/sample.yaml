  - id: reasoning-general/theory-of-mind
    label: Theory of mind
    definition: Reasoning about the beliefs, intentions or knowledge of other agents.
  - id: earth-climate/remote-sensing
    label: Remote sensing
    definition: Extracting land, ocean or atmospheric information from satellite or airborne imagery.
    inclusion_test: Tag this as PRIMARY if a model extracts information from satellite or airborne imagery and either
      the labels are Earth-system quantities (land cover, surface water, crops, biomass, ice) or the benchmark presents
      itself as Earth observation; record the vision task (segmentation, classification, detection) as secondary.
      Mapping a hazard already visible in the image, such as flood extent, is this term, not `hazard-prediction`.
    exclusion_test: Do NOT tag this if the imagery is only a predictor for another Earth-system target, such as
      crop yield (`agriculture`), if the task forecasts an event before it happens (`hazard-prediction`), or if
      the benchmark's claim is a vision method and its labels are generic objects seen from above (`vision`).
  - id: safety-alignment/honesty-truthfulness
    label: Honesty truthfulness

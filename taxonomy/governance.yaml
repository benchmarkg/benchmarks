# taxonomy/governance.yaml
#
# Facet 7 of 8. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: governance
facet_kind: flat
version: 0.9.0
updated: 2026-09-28
description: >
  Who maintains the benchmark, how results are submitted, and what independence relationships
  exist between the maintainer and the systems evaluated. Drives ecosystem analysis and the
  independence disclosure. Every independence flag except `no-known-conflict` requires a source.

# Authored by P0-S2-T05 from 02 S7-S10, which is the canonical enumeration.
# Definitions only: 02 S11 rule 8 lets `examples: []` warn rather than fail while
# taxonomy/VERSION < 1.0.0, and the example pass is P1-S14-T06's.
#
# Stage 4 revision (P1-S1-T07). The terms the Stage 3 failure log showed to collide, or to
# be missing, now carry inclusion and exclusion tests, examples and not_to_be_confused_with
# blocks, and four submission_process terms and one independence flag are added. The other
# terms are still definition-only.
#
# maintainer_type is single-valued and many benchmarks have several parties behind them. The
# precedence rule, stated in each term's tests: the field names the party that holds and
# publishes the benchmark as distributed (its dataset and repository), not the authors'
# affiliations, its funders, its contributors, or a partner that runs a results page or
# supplies data. If nobody holds it any longer, the originator's type applies and the decay
# goes to maintenance_status (02 S9). The one exception is `conference-workshop`, which wins
# for a recurring challenge whose organising team re-forms each edition.
#
# Three fields share this file -- maintainer_type, submission_process and
# independence_flags -- so every term carries the `field` it belongs to.
#
# independence_flags is multi-valued and every value except `no-known-conflict` requires
# an evidence Source; CI enforces it. `no-known-conflict` means 'we looked and found
# none' and carries last_verified, so an entry with no flags is NOT the same as one
# flagged no-known-conflict and the interface shows the difference. None of these flags
# carries a valence in the rendering: no warning triangles, no red. Disclosure, never
# accusation.
#
# NOTE FOR P0-S2-T06. Five submission_process ids -- self-reported, maintainer-verified,
# sandboxed-rerun, held-out-server, third-party-audited -- are also rungs on the
# seven-rung ResultClaim.verification ladder that taxonomy/verification.yaml will carry.
# They are genuinely different things: this field describes the benchmark's submission
# PROCESS, the ladder grades an individual CLAIM's provenance, and a benchmark with a
# held-out server can still carry a self-reported claim. 02 S8 is explicit that
# conflating the two ladders is a known failure and already produced a rule naming an
# enum value that existed on neither.

terms:

  # --- governance.maintainer_type -- 9 terms ---
  - id: academic-lab
    label: Academic lab
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A university research group maintains the benchmark.
    inclusion_test: >
      Tag this if the party that holds and publishes the benchmark as distributed (its dataset
      and repository) is a university research group or department. The field names that
      holder, not the authors' affiliations, the funders, the contributors or a partner that
      runs a results page or supplies data. If nobody holds the benchmark any longer, tag the
      originator's type and record the decay in `maintenance_status`.
    exclusion_test: >
      Do NOT tag this on the authors' affiliations alone. If the dataset and repository sit in
      one person's own account and no institution is stated as holding them, tag `individual`;
      if they sit in a shared organisation account run by contributors from several
      institutions, with no single institution stated as the holder, tag
      `community-collective`; if the benchmark is a recurring challenge whose organising team
      re-forms each edition under a conference or workshop, tag `conference-workshop` even
      when one lab coordinates the series.
    examples:
      - ref: cy-bench
        qualifies: true
        why: >
          The repository sits in the WUR-AI organisation, and project administration, software
          and funding are at Wageningen University's AI group, although the AgML community
          conceived the benchmark.
      - ref: simulacrabench
        qualifies: true
        why: >
          Organised from the Stanford Digital Economy Lab, which hosts the competition and its
          harness; UNHCR, UNICEF and the World Bank are data partners.
      - ref: gpqa-diamond
        qualifies: false
        why: >
          NEAR MISS. The paper is from an NYU group, but the dataset and repository sit in one
          author's personal namespaces (idavidrein/gpqa). That is `individual`.
      - ref: ntire
        qualifies: false
        why: >
          NEAR MISS. One lab at Wurzburg heads the organiser list, but each challenge's
          organisers change by edition under a CVPR workshop. That is `conference-workshop`.
    not_to_be_confused_with:
      - term: individual
        distinction: >
          `individual` is decided by where the artefacts sit: one person's own account, with no
          institution stated as holding them, is `individual` whatever university the authors
          list.
      - term: community-collective
        distinction: >
          A lab-held benchmark that takes outside contributions stays `academic-lab`;
          `community-collective` needs a shared account with no single institution as holder.
      - term: conference-workshop
        distinction: >
          A recurring challenge whose organising team re-forms each edition under a conference
          is `conference-workshop`, even when one lab carries the series.
  - id: industry-lab
    label: Industry lab
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A commercial research organisation maintains the benchmark.
    inclusion_test: >
      Tag this if the party that holds and publishes the benchmark as distributed (its dataset
      and repository) is a for-profit company or its research arm, including a public benefit
      corporation. The field names that holder in its current legal form, not the authors'
      affiliations, the funders or a partner that runs a results page. If nobody holds the
      benchmark any longer, tag the originator's type and record the decay in
      `maintenance_status`.
    exclusion_test: >
      Do NOT tag this because company employees are among the authors, or because a company
      runs the leaderboard, the judge or the grading server while another party holds the
      dataset and repository: tag the holder's type. Do NOT tag it for a nonprofit or a
      fiscally sponsored project (`nonprofit`, or the project's own type).
    examples:
      - ref: open-catalyst-oc20-oc22
        qualifies: true
        why: >
          The data, the code (facebookresearch/fairchem), the terms of use and the current
          leaderboard are Meta's, although Carnegie Mellon is a named collaborator.
      - ref: apollo-research-scheming-suite
        qualifies: true
        why: >
          Apollo is now a Public Benefit Corporation, a for-profit form. The type is the
          holder's current form, although the suite was built while Apollo was fiscally
          sponsored.
      - ref: agentharm
        qualifies: false
        why: >
          NEAR MISS. Nine of the fourteen authors are at Gray Swan AI, but the dataset and the
          Inspect implementation sit in UK AI Security Institute namespaces. That is
          `government-agency`.
      - ref: humanity-s-last-exam
        qualifies: false
        why: >
          NEAR MISS. Scale AI runs the leaderboard, its judge and its ranking, but the Center
          for AI Safety hosts the dataset and the repository. That is `nonprofit`.
    not_to_be_confused_with:
      - term: nonprofit
        distinction: >
          A public benefit corporation is a company and is `industry-lab`; a fiscally sponsored
          project or a nonprofit is not. Where a company and a nonprofit share a benchmark, the
          one holding the dataset and repository decides.
  - id: consortium
    label: Consortium
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A formally constituted multi-party body with a legal form maintains the benchmark.
    inclusion_test: >
      Tag this if the holder of the benchmark is a membership body governed by its member
      organisations, such as a board of members or funders, and the sources state its legal
      form. It stays a consortium when that legal form is a nonprofit corporation.
    exclusion_test: >
      Do NOT tag this on the word 'consortium' alone: a development group or alliance with no
      stated legal form is `community-collective`. Do NOT tag it for a single nonprofit that
      is not governed by member organisations (`nonprofit`), and a nonprofit fiscal host does
      not make a project a consortium.
    examples:
      - ref: ailuminate-v1-1
        qualifies: true
        why: >
          MLCommons is 'an open engineering consortium supported by over 125 members and
          affiliates', with a board balancing its members, and a 501(c)6 nonprofit. Member
          governance with a legal form is a consortium.
      - ref: wmdp
        qualifies: false
        why: >
          NEAR MISS. The paper says 'a consortium of academics and technical consultants', but
          that names the development group, which has no legal form, and the artefacts sit in
          the Center for AI Safety's namespaces. That is `nonprofit`.
      - ref: open-problems-in-single-cell-analysis
        qualifies: false
        why: >
          NEAR MISS. The site speaks of 'the consortium', but no legal entity exists and
          NumFOCUS is only its fiscal host. That is `community-collective`.
    not_to_be_confused_with:
      - term: community-collective
        distinction: >
          A multi-party group with no stated legal form is `community-collective`, whatever it
          calls itself; `consortium` needs the legal form and member governance.
      - term: nonprofit
        distinction: >
          A member-governed body is `consortium` even when its legal form is a nonprofit;
          `nonprofit` is a single organisation not governed by member organisations.
  - id: standards-body
    label: Standards body
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A standards or certification organisation maintains the benchmark, which makes it slower,
      more procedural and materially more durable than a lab.
    examples: []
  - id: conference-workshop
    label: Conference or workshop
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      An organising committee that re-forms for each edition maintains the benchmark, making
      continuity dependent on individual volunteers.
    inclusion_test: >
      Tag this if the benchmark is a recurring challenge held under a conference or workshop
      whose tasks are run by an organising team that changes between editions. This overrides
      the field's holder rule and any lab or society that coordinates the series, because the
      re-forming committee is the governance this term records.
    exclusion_test: >
      Do NOT tag this for a benchmark that is merely presented at a conference, or for a
      competition-track entry organised and hosted by one standing lab (tag that lab's type).
    examples:
      - ref: dcase-2026
        qualifies: true
        why: >
          Each edition's tasks are proposed and run by different teams and feed an annual
          workshop, although a standing steering group selects them.
      - ref: lifeclef-2026
        qualifies: true
        why: >
          A lab of the CLEF conference whose task teams change each edition, although Inria
          has coordinated it since 2011.
      - ref: simulacrabench
        qualifies: false
        why: >
          NEAR MISS. A NeurIPS 2026 competition-track entry, but it is organised from the
          Stanford Digital Economy Lab, which hosts the competition and its harness. That is
          `academic-lab`.
    not_to_be_confused_with:
      - term: academic-lab
        distinction: >
          A lab that coordinates a conference-hosted series with a re-forming organising team
          does not make it `academic-lab`; a competition one lab organises and hosts does not
          become `conference-workshop` by appearing in a conference track.
  - id: nonprofit
    label: Nonprofit
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A nonprofit organisation outside the academic and standards systems maintains the
      benchmark.
    inclusion_test: >
      Tag this if the holder of the benchmark's dataset and repository is a single nonprofit
      organisation, outside the university and standards systems, that is not governed by
      member organisations. The field names that holder, not the authors or a commercial
      partner that runs the results page.
    exclusion_test: >
      Do NOT tag this for a member-governed body with a nonprofit legal form (`consortium`),
      for a project that only has a nonprofit fiscal host (tag the project's own type), or for
      a public benefit corporation, which is a company (`industry-lab`).
    examples:
      - ref: wmdp
        qualifies: true
        why: >
          The dataset and repository sit in the Center for AI Safety's namespaces, and 'CAIS is
          an AI safety non-profit'.
      - ref: humanity-s-last-exam
        qualifies: true
        why: >
          CAIS hosts the dataset, the repository and HLE-Rolling. Scale AI's leaderboard is a
          partner's results page and does not change the holder.
      - ref: open-problems-in-single-cell-analysis
        qualifies: false
        why: >
          NEAR MISS. NumFOCUS gives 'nonprofit financial and administrative support' as fiscal
          host, but the platform is community-owned with no legal entity. That is
          `community-collective`.
      - ref: ailuminate-v1-1
        qualifies: false
        why: >
          NEAR MISS. MLCommons is a 501(c)6 nonprofit, but it is governed by its members. That
          is `consortium`.
    not_to_be_confused_with:
      - term: consortium
        distinction: >
          A nonprofit governed by its member organisations is `consortium`; `nonprofit` is a
          single organisation without member governance.
      - term: industry-lab
        distinction: >
          A public benefit corporation is a company (`industry-lab`). Where a nonprofit and a
          company share a benchmark, the holder of the dataset and repository decides.
  - id: government-agency
    label: Government agency
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A public body or national laboratory maintains the benchmark.
    inclusion_test: >
      Tag this if the holder of the benchmark's dataset and repository is a public body or a
      national laboratory. The field names that holder, not an agency that funds the work or
      supplies data under agreement.
    exclusion_test: >
      Do NOT tag this for public funding alone, for a data partner that supplies evaluation
      data without holding or publishing the benchmark, or on a research institute's name when
      no source states that it is a public body.
    examples:
      - ref: agentharm
        qualifies: true
        why: >
          The dataset is huggingface.co/datasets/ai-safety-institute/AgentHarm and the
          implementation sits in UK AI Security Institute namespaces, although most authors are
          at Gray Swan AI.
      - ref: fair-universe-higgsml-uncertainty-challenge
        qualifies: true
        why: >
          The principal investigator is at Lawrence Berkeley National Laboratory and the site
          is on lbl.gov; the university partners and ChaLearn do not hold it.
      - ref: simulacrabench
        qualifies: false
        why: >
          NEAR MISS. UNHCR, UNICEF and the World Bank hold the evaluation data, but as data
          partners; the Stanford lab hosts the competition and its harness. That is
          `academic-lab`.
      - ref: vbench-2-0
        qualifies: false
        why: >
          NEAR MISS. Most of the v2 authors are at Shanghai Artificial Intelligence Laboratory,
          but no source states that it is a public body, so the type cannot rest on its name.
  - id: individual
    label: Individual
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      One person maintains the benchmark, with the key-person risk that implies.
    inclusion_test: >
      Tag this if the benchmark's dataset and repository sit in one person's own account and
      no organisation is stated as holding them, whatever institutions the authors list,
      because that is the key-person risk this term records.
    exclusion_test: >
      Do NOT tag this because a datasheet names a contact person, or where a personal
      repository mirrors artefacts that an organisation holds and publishes: tag that
      organisation's type.
    examples:
      - ref: medagentbench-v2
        qualifies: true
        why: >
          The v2 code and tasks sit on the first author's personal GitHub account, apart from
          the Stanford group that maintains the original MedAgentBench.
      - ref: matbench-discovery
        qualifies: true
        why: >
          The benchmark lives on one person's account (janosh/matbench-discovery, with the site
          at janosh.github.io), and the README disclaims Materials Project endorsement.
      - ref: gpqa-diamond
        qualifies: true
        why: >
          The dataset and repository sit in personal namespaces (idavidrein/gpqa), although
          the paper is from an NYU group.
      - ref: legalbench-vals-legal-bench
        qualifies: false
        why: >
          NEAR MISS. The datasheet says 'Neel Guha will be supporting this dataset', but
          LegalBench is held by Stanford Hazy Research. That is `academic-lab`.
    not_to_be_confused_with:
      - term: academic-lab
        distinction: >
          A university author list does not outweigh a personal-account host: where the
          artefacts sit in one person's own account, the benchmark is `individual`.
  - id: community-collective
    label: Community collective
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A distributed group of contributors maintains the benchmark without the legal form a
      consortium has.
    inclusion_test: >
      Tag this if the benchmark is held in a shared organisation account run by contributors
      from several institutions, with no legal form stated and no single institution stated
      as its holder.
    exclusion_test: >
      Do NOT tag this for a lab-held benchmark that takes outside contributions by pull
      request, or for a community that conceived a benchmark one institution now holds: tag
      the holder's type. A body with a stated legal form and member governance is a
      `consortium`.
    examples:
      - ref: critpt
        qualifies: true
        why: >
          Crafted by '50+ active physics researchers from 30+ leading institutions' under the
          CritPt-Benchmark GitHub organisation, with no stated legal form.
      - ref: open-problems-in-single-cell-analysis
        qualifies: true
        why: >
          'A community-owned platform' with a voting Core Team and no legal entity; its NumFOCUS
          fiscal host does not change that.
      - ref: cy-bench
        qualifies: false
        why: >
          NEAR MISS. Conceived by the AgML community, but the repository is in the WUR-AI
          organisation and Wageningen University runs it. That is `academic-lab`.
    not_to_be_confused_with:
      - term: academic-lab
        distinction: >
          A community contribution model does not make a lab-held benchmark a collective; the
          holder of the dataset and repository decides.
      - term: consortium
        distinction: >
          Calling a group a 'consortium' does not make it one; without a stated legal form and
          member governance it is `community-collective`.

  # --- governance.submission_process -- 14 terms ---
  - id: self-reported
    label: Self-reported
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Participants report their own numbers and nothing in the process checks them.
    inclusion_test: >
      Tag this if participants send numbers they computed themselves to a shared results
      channel (a leaderboard, a results page or a pull request) and no source says anyone
      checks, re-runs or re-scores them before they are published.
    exclusion_test: >
      Do NOT tag this where there is no shared channel and results appear only in independent
      papers (`literature-only`), where the sources state a maintainer review of the submitted
      result or its code (`maintainer-verified`), where the maintainer re-executes it
      (`sandboxed-rerun`), or where the maintainer computes the score from submitted outputs
      (`maintainer-scored-predictions`).
    examples:
      - ref: vbench-2-0
        qualifies: true
        why: >
          Anyone can 'upload the generated result.json file', and nothing checks it. The
          certified rows are a separate, `maintainer-run` channel.
      - ref: webarena
        qualifies: true
        why: >
          Outside entries are marked 'Self-reported'. Since September 2024 they must include raw
          trajectories, but no source says anyone checks them.
      - ref: libero
        qualifies: false
        why: >
          NEAR MISS. Users run the script and publish their own numbers, but in their own
          papers: no channel takes them. That is `literature-only`.
      - ref: proteingym
        qualifies: false
        why: >
          NEAR MISS. Entrants supply their own scores, but by a reviewed pull request whose code
          must be runnable, which is a stated check. That is `maintainer-verified`.
    not_to_be_confused_with:
      - term: literature-only
        distinction: >
          `self-reported` needs a shared channel that takes the numbers; numbers published only
          in the reporters' own papers are `literature-only`.
      - term: maintainer-verified
        distinction: >
          A stated review of the submitted result, its trajectories or its code makes it
          `maintainer-verified`; `self-reported` is the case where no check is stated.
      - term: sandboxed-rerun
        distinction: >
          `sandboxed-rerun` publishes the maintainer's own execution of the submission;
          `self-reported` publishes the participant's number.
  - id: maintainer-verified
    label: Maintainer verified
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer checks a submitted result before it is published.
    inclusion_test: >
      Tag this if a participant submits a result, with or without the code that produced it,
      and the sources state that the maintainer reviews the result, its trajectories or its
      code before publishing it. A stated review is enough: a re-run the maintainer says it
      could do, but does not say it does, still makes this term, not `sandboxed-rerun`.
    exclusion_test: >
      Do NOT tag this where the maintainer re-executes every submission and publishes the
      number that run produces (`sandboxed-rerun`), where the participant submits predictions
      and the maintainer computes the score (`maintainer-scored-predictions`), where the
      maintainer runs systems nobody submitted (`maintainer-run`), or where no check is stated
      (`self-reported`).
    examples:
      - ref: bench
        qualifies: true
        why: >
          Outside pull-request submissions are marked 'Verified' when their trajectories are
          available for review, and 'Unverified' otherwise.
      - ref: cy-bench
        qualifies: true
        why: >
          A contributor sends model code with self-computed results, and code pull requests are
          reviewed by 'at least one reviewer'. Whether the maintainers re-run is unstated, so
          the stated review decides.
      - ref: proteingym
        qualifies: true
        why: >
          Pull requests carry scores and runnable code and are reviewed. Re-scoring is possible
          ('we should be able to reproduce scores if needed'), not stated as done.
      - ref: video-mme-v2
        qualifies: false
        why: >
          NEAR MISS. The maintainers handle what is sent, but what is sent is model responses,
          which they score themselves. That is `maintainer-scored-predictions`.
      - ref: frontiermath-tiers-erd-s
        qualifies: false
        why: >
          NEAR MISS. Epoch stands behind every number because it produces every number; nobody
          submits. That is `maintainer-run`.
    not_to_be_confused_with:
      - term: self-reported
        distinction: >
          `maintainer-verified` needs a stated check before publication; without one the same
          submission is `self-reported`.
      - term: sandboxed-rerun
        distinction: >
          A re-run that is possible or optional is not `sandboxed-rerun`; that term needs the
          maintainer to execute the submission and publish its own number.
      - term: maintainer-scored-predictions
        distinction: >
          `maintainer-verified` checks a result the participant computed;
          `maintainer-scored-predictions` computes the result from submitted outputs.
      - term: maintainer-run
        distinction: >
          `maintainer-verified` checks a number someone else produced; `maintainer-run` is the
          maintainer producing the number for a system nobody submitted.
  - id: sandboxed-rerun
    label: Sandboxed re-run
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer re-executes the submission in a controlled environment and publishes the
      number it produces.
    inclusion_test: >
      Tag this if participants submit a runnable system (code, a plugin, an inference script
      or an agent implementation) and the sources state that the maintainer executes it in its
      own environment and publishes the number that run produces.
    exclusion_test: >
      Do NOT tag this where re-execution is only optional or possible (`maintainer-verified`
      if a review is stated), where the participant hands over a container image that the
      maintainer runs against data the participant never sees
      (`containerized-algorithm-submission`), or where the maintainer runs systems nobody
      submitted (`maintainer-run`).
    examples:
      - ref: rexrank
        qualifies: true
        why: >
          External entrants e-mail a model description, a conda environment and an inference
          script, and the maintainers run it for official evaluation.
      - ref: osworld-2-0
        qualifies: true
        why: >
          Verified-leaderboard entrants upload their agent implementation, and the maintainers
          run the agent themselves.
      - ref: brain-score
        qualifies: true
        why: >
          Model code arrives as a plugin that the maintainers score on their own
          infrastructure. A plugin is not a container image, so this term applies rather than
          `containerized-algorithm-submission`.
      - ref: proteingym
        qualifies: false
        why: >
          NEAR MISS. The code must be runnable so that scores can be reproduced 'if needed',
          but re-execution is not stated as done. That is `maintainer-verified`.
    not_to_be_confused_with:
      - term: self-reported
        distinction: >
          `sandboxed-rerun` publishes the maintainer's execution; `self-reported` publishes the
          participant's own number.
      - term: maintainer-verified
        distinction: >
          `sandboxed-rerun` needs a stated re-execution of every submission; a review, or a
          re-run that is only possible, is `maintainer-verified`.
      - term: maintainer-run
        distinction: >
          `sandboxed-rerun` runs what a participant submitted; `maintainer-run` runs systems the
          maintainer chose, with no submission.
  - id: held-out-server
    label: Held-out evaluation server
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Participants submit predictions and an evaluation server scores them against labels the
      participant never sees.
    inclusion_test: >
      Tag this if participants submit outputs and the maintainer scores them against reference
      answers the participant cannot see at submission, whether an automatic server scores them
      at once or the organisers score them after a deadline, and including references, outcomes
      or human judgements that do not yet exist when the outputs are submitted.
    exclusion_test: >
      Do NOT tag this where the labels are public and the maintainer only computes the score
      (`maintainer-scored-predictions`), where a private held-out split exists but nobody
      outside the maintainer can submit to it (`maintainer-run`), or where participants hand
      over code rather than outputs (`containerized-algorithm-submission` or
      `sandboxed-rerun`).
    examples:
      - ref: dcase-2026
        qualifies: true
        why: >
          Participants upload system outputs on label-free evaluation audio, and the organisers
          score them after the 15 June deadline. Offline organiser scoring against unseen labels
          counts.
      - ref: wmt25-general-mt-shared-task
        qualifies: true
        why: >
          Translations are uploaded to OCELoT without feedback and scored by human evaluation
          after the deadline, against judgements that do not exist at submission.
      - ref: forecastbench
        qualifies: true
        why: >
          Forecasts are locked by a timestamped deadline and scored as the questions resolve, so
          the answers do not exist when the prediction is made.
      - ref: video-mme-v2
        qualifies: false
        why: >
          NEAR MISS. The maintainers score e-mailed responses, but the labels are public in
          test.parquet. That is `maintainer-scored-predictions`.
      - ref: humanity-s-last-exam
        qualifies: false
        why: >
          NEAR MISS. A private held-out set exists, but 'we do not report any model performance
          metrics on the private held-out set' and nobody submits to it. The published scores
          are `maintainer-run`.
    not_to_be_confused_with:
      - term: maintainer-scored-predictions
        distinction: >
          Both have the maintainer score submitted outputs; `held-out-server` needs labels the
          participant cannot see, and public labels make it `maintainer-scored-predictions`.
      - term: maintainer-run
        distinction: >
          A held-out split that only the maintainer evaluates on is not a server anyone submits
          to; the scores it yields are `maintainer-run`.
  - id: containerized-algorithm-submission
    label: Containerised algorithm submission
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Participants submit executable code in a container rather than predictions, so the
      leaderboard cannot be overfitted by inspection and entry requires working software.
    examples: []
  - id: assessment-committee
    label: Assessment committee
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      There is no leaderboard, and the output is a peer-reviewed assessment produced by a
      committee.
    examples: []
  - id: third-party-audited
    label: Third-party audited
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      An independent party other than the maintainer or the participant verifies the result.
    examples: []
  - id: live-arena
    label: Live arena
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Results emerge from continuous head-to-head comparison among entrants rather than from a
      fixed scored set.
    examples: []
  - id: physical-competition
    label: Physical competition
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Results are produced by entrants competing with physical hardware at a venue on a date.
    examples: []
  - id: publication-gated
    label: Publication gated
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Official ranking requires the entrant to submit an accompanying paper, which is an access
      condition nothing else in the schema carries.
    inclusion_test: >
      Tag this if the rules make an accompanying paper, working note, technical report or
      description article a condition of being officially ranked or of staying listed. Tag it
      beside the route by which the score is produced.
    exclusion_test: >
      Do NOT tag this where the condition is releasing the code or the system itself
      (`open-source-gated`), or where a report is required only for prize or award
      eligibility while ranking is open without one.
    examples:
      - ref: lifeclef-2026
        qualifies: true
        why: >
          Official ranking requires a CEUR-WS working-note paper.
      - ref: luna16
        qualifies: true
        why: >
          The maintainers 'stop processing new LUNA16 submissions without a clear description
          article'.
      - ref: arc-agi-2
        qualifies: false
        why: >
          NEAR MISS. Official scores are conditional, but on open-sourcing the solution, not on
          a paper. That is `open-source-gated`.
      - ref: navsim-v2
        qualifies: false
        why: >
          NEAR MISS. NAVSIM 2025 requires a technical report to be eligible for awards, not to
          be ranked.
    not_to_be_confused_with:
      - term: open-source-gated
        distinction: >
          `publication-gated` requires a paper or report; `open-source-gated` requires the
          entry's implementation to be released. A benchmark may require both.
  - id: maintainer-run
    label: Maintainer run
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer chooses which systems to evaluate, runs the evaluation itself and
      publishes the results, and no participant submits anything.
    inclusion_test: >
      Tag this if the maintainer, not a system's developer, decides that a system is evaluated,
      runs it, and publishes the results in a ranking or results table it keeps, even when the
      developer supplies API or checkpoint access at the maintainer's request. The field is
      multi-valued: tag this beside any submission route the same benchmark also offers.
    exclusion_test: >
      Do NOT tag this for the release publication's own baselines when the maintainer keeps no
      ranking (`literature-only`), where a developer asks to be evaluated and submits a system,
      predictions or access to be run (tag that route), or where the maintainer only checks a
      number someone else produced (`maintainer-verified`).
    examples:
      - ref: frontiermath-tiers-erd-s
        qualifies: true
        why: >
          Epoch selects the models, runs them, meters the spend and publishes the numbers, and
          nobody submits.
      - ref: humanity-s-last-exam
        qualifies: true
        why: >
          Scale selects the models, runs them, grades them with an o3-mini judge and ranks them.
      - ref: helm-capabilities
        qualifies: true
        why: >
          CRFM chose the flagship models of mainstream providers and ran them through its own
          pipeline and judges; contributed model code is not a result.
      - ref: webarena
        qualifies: true
        why: >
          Rows marked 'WebArena Team' were produced by the maintainers, beside the self-reported
          outside entries.
      - ref: uspto-50k
        qualifies: false
        why: >
          NEAR MISS. The only maintainer results are the release paper's baseline and model, and
          no ranking is kept; everyone else reports in their own papers. That is
          `literature-only`.
      - ref: video-mme-v2
        qualifies: false
        why: >
          NEAR MISS. The maintainers compute every score, but only on responses that entrants
          choose to send. That is `maintainer-scored-predictions`.
    not_to_be_confused_with:
      - term: literature-only
        distinction: >
          `maintainer-run` needs a ranking or results table the maintainer keeps; a release
          paper's own baselines, with later results only in other people's papers, is
          `literature-only`.
      - term: maintainer-verified
        distinction: >
          `maintainer-run` produces the number itself for a system nobody submitted;
          `maintainer-verified` checks a number a participant produced.
      - term: sandboxed-rerun
        distinction: >
          `sandboxed-rerun` executes a participant's submission; `maintainer-run` has no
          submission, because the maintainer chose the system.
      - term: held-out-server
        distinction: >
          A private split only the maintainer evaluates on is `maintainer-run`;
          `held-out-server` needs participants who submit outputs to be scored.
  - id: literature-only
    label: Literature only
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      No process collects or ranks results, so beyond the release publication's own baselines
      the results against the benchmark appear only in independent publications.
    inclusion_test: >
      Tag this if the benchmark has no leaderboard, results page or submission route of its
      own, the maintainer publishes no results beyond those in the publications that release
      it, and others report their numbers in their own work.
    exclusion_test: >
      Do NOT tag this where the maintainer keeps a ranking or results table of systems it runs
      itself (`maintainer-run`), or where a shared channel takes participants' own numbers,
      even unchecked (`self-reported`). A third party's leaderboard that re-runs the benchmark
      is not the benchmark's own process and does not remove this term.
    examples:
      - ref: atari-100k
        qualifies: true
        why: >
          No process collects results and there is no ranking; each paper runs the protocol
          itself.
      - ref: libero
        qualifies: true
        why: >
          No source describes a ranking. Users run the evaluation script and publish in their
          own papers.
      - ref: the-well
        qualifies: true
        why: >
          A dataset and training library with no leaderboard, server or submission route; its
          contribution guidelines are for datasets, not results.
      - ref: uspto-50k
        qualifies: true
        why: >
          The maintainers publish only the release paper's Table 2, and everyone else reports
          top-N accuracy in their own papers.
      - ref: paperbench
        qualifies: false
        why: >
          NEAR MISS. There is no submission channel, but the README keeps a leaderboard table of
          the maintainers' own runs. That is `maintainer-run`.
    not_to_be_confused_with:
      - term: maintainer-run
        distinction: >
          `literature-only` has no ranking the maintainer keeps; a results table the maintainer
          fills with its own runs is `maintainer-run`.
      - term: self-reported
        distinction: >
          `self-reported` needs a shared channel that takes participants' numbers;
          `literature-only` has none.
  - id: open-source-gated
    label: Open-source gated
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Official ranking or continued listing requires the entrant to release its code or system
      publicly.
    inclusion_test: >
      Tag this if the rules make publishing the entry's implementation, under an open licence
      or into the maintainers' repository, a condition of receiving an official score or of
      staying on the leaderboard. Tag it beside the route by which the score is produced.
    exclusion_test: >
      Do NOT tag this where only a paper or report is required (`publication-gated`), where
      releasing code is encouraged but not required, or where the entrant hands code to the
      maintainer to run and the rules do not require it to be published (`sandboxed-rerun` or
      `containerized-algorithm-submission`).
    examples:
      - ref: arc-agi-2
        qualifies: true
        why: >
          'Participants must open source their solutions before receiving official private
          evaluation scores', under a permissive public-domain licence.
      - ref: osworld-2-0
        qualifies: true
        why: >
          A verified-leaderboard result requires uploading the agent implementation and
          allowing the maintainers to disclose it.
      - ref: agentdojo
        qualifies: true
        why: >
          A results pull request must include 'an implementation of the attack/defense/model in
          the agentdojo repository'.
      - ref: lifeclef-2026
        qualifies: false
        why: >
          NEAR MISS. Ranking is gated, but on a CEUR-WS working-note paper, not on released
          code. That is `publication-gated`.
    not_to_be_confused_with:
      - term: publication-gated
        distinction: >
          `open-source-gated` requires the implementation to be released; `publication-gated`
          requires a paper or report. A benchmark may require both.
  - id: maintainer-scored-predictions
    label: Maintainer-scored predictions
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Participants submit their system's predictions and the maintainer scores them against
      labels the participants can already see.
    inclusion_test: >
      Tag this if what is submitted is outputs or predictions, the maintainer or its site
      computes the published score, and the reference labels are public, so the maintainer's
      scoring guards the arithmetic but not the test set.
    exclusion_test: >
      Do NOT tag this where the labels are hidden from the participant at submission
      (`held-out-server`), where the participant computes the number and the maintainer
      reviews it (`maintainer-verified`), or where the maintainer re-runs submitted code
      (`sandboxed-rerun`).
    examples:
      - ref: video-mme-v2
        qualifies: true
        why: >
          Entrants 'send model responses' by e-mail and the maintainers score them, while
          test.parquet's 3,200 annotated answers are public.
      - ref: weatherbench-2
        qualifies: true
        why: >
          One route is to 'provide us with your forecasts ... We will then evaluate the
          forecast', against public ground truth.
      - ref: luna16
        qualifies: true
        why: >
          Entrants uploaded candidate locations to the site's evaluation script, which scored
          them against labels every entrant holds.
      - ref: dcase-2026
        qualifies: false
        why: >
          NEAR MISS. The organisers score uploaded outputs, but on label-free evaluation audio
          whose labels participants never see. That is `held-out-server`.
    not_to_be_confused_with:
      - term: held-out-server
        distinction: >
          Public labels make it `maintainer-scored-predictions`; labels the participant cannot
          see at submission make it `held-out-server`.
      - term: maintainer-verified
        distinction: >
          `maintainer-scored-predictions` computes the number from submitted outputs;
          `maintainer-verified` checks a number the participant computed.

  # --- governance.independence_flags -- 9 terms ---
  - id: no-known-conflict
    label: No known conflict
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      We looked for an independence conflict and found none, which is a statement about our
      search and its date rather than a guarantee that none exists.
    inclusion_test: >
      Tag this only if the sources were searched for every other flag in this field, including
      material support from an evaluated party, and none applies; record the search date in
      last_verified.
    exclusion_test: >
      Do NOT tag this where the search could not be completed, such as sponsors shown only as
      logos, an unnamed industry partner or an unreadable site (leave the field empty and log
      the failure), or where an evaluated party gave money or in-kind support such as API
      credits (`funded-by-evaluated-party`).
    examples:
      - ref: simulacrabench
        qualifies: true
        why: >
          The organiser page and starter kit were searched. The prize sponsor is Schmidt
          Sciences, a philanthropic organisation, and the compute sponsor is a cloud provider;
          neither is an evaluated party.
      - ref: posebusters
        qualifies: true
        why: >
          'There are no conflicts to declare', and the seven evaluated docking methods are all
          third-party.
      - ref: holistic-agent-leaderboard-hal
        qualifies: false
        why: >
          NEAR MISS. The named funders are philanthropic and academic, but OpenAI and Google
          provided API credits to evaluate their own models. That is
          `funded-by-evaluated-party`.
      - ref: 2026-behavior-challenge
        qualifies: false
        why: >
          NEAR MISS. No conflict was found, but the prize sponsors appear only as logos, so the
          search is incomplete and the field stays empty.
    not_to_be_confused_with:
      - term: funded-by-evaluated-party
        distinction: >
          In-kind support from an evaluated party, such as API credits, is funding, so it rules
          out `no-known-conflict`.
  - id: maintainer-competes-on-own-benchmark
    label: Maintainer competes on own benchmark
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The party maintaining the benchmark also submits systems evaluated by it.
    examples: []
  - id: funded-by-evaluated-party
    label: Funded by an evaluated party
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark is funded by an organisation whose systems it evaluates.
    inclusion_test: >
      Tag this if an organisation whose systems the benchmark evaluates gave the maintainer
      money or in-kind support for the benchmark or for the publication that defines its
      method, including grants, API access or credits, and compute. A maintainer's statement
      that the benchmark is independent goes in a note and does not remove the flag.
    exclusion_test: >
      Do NOT tag this where the funder's systems are not evaluated, where the only support is
      access any user can buy, where the support is a prize pool (`prize-sponsored-by-industry`),
      or where the sources name only an unnamed 'industry partner' (leave it unset and log the
      gap). Access to an unreleased model for the purpose of evaluating it is not by itself
      funding.
    examples:
      - ref: holistic-agent-leaderboard-hal
        qualifies: true
        why: >
          'We are grateful to OpenAI and Google for providing API credits to evaluate their
          models'. In-kind credits count, and here they pay for the donors' own evaluations.
      - ref: epoch-capabilities-index
        qualifies: true
        why: >
          Google DeepMind financially supported the paper that defines the index's method, and
          Gemini models are scored. Epoch's statement that the index is independent is recorded
          beside the flag.
      - ref: helm-capabilities
        qualifies: true
        why: >
          Together AI, OpenAI, Google, Anthropic, Amazon and Writer provided the model APIs the
          work used, and their models are ranked.
      - ref: osworld-2-0
        qualifies: false
        why: >
          NEAR MISS. Google Research gave a gift fund, but no Google model is evaluated.
    not_to_be_confused_with:
      - term: no-known-conflict
        distinction: >
          Donated API access or credits, or compute, from an evaluated party count as funding;
          they rule out `no-known-conflict`.
  - id: prize-sponsored-by-industry
    label: Prize sponsored by industry
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      A commercial sponsor funds the prize pool for the benchmark or its competition.
    examples: []
  - id: evaluator-sells-evaluations
    label: Evaluator sells evaluations
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The party producing the results sells evaluation as a commercial service.
    examples: []
  - id: single-evaluator-private-test-set
    label: Single evaluator, private test set
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      One party holds the evaluation set and runs every evaluation, which resists contamination
      and simultaneously prevents outside verification.
    examples: []
  - id: results-published-only-in-vendor-document
    label: Results published only in a vendor document
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The results appear only inside a document controlled by the party being evaluated, such as
      a model card or system card.
    examples: []
  - id: commercial-leaderboard-placement
    label: Commercial leaderboard placement
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      Placement or visibility on the leaderboard can be influenced by a commercial arrangement.
    examples: []
  - id: grader-from-evaluated-party
    label: Grader from an evaluated party
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      A judge model or human rater that produces the published scores is itself an evaluated
      system or is supplied by a party whose systems are evaluated.
    inclusion_test: >
      Tag this if any grader in the official scoring path (a judge model, a jury member or a
      human rater) is one of the evaluated systems or an earlier snapshot of one, or comes from
      or is employed by an organisation whose systems are evaluated. Tag it beside
      `maintainer-competes-on-own-benchmark` when the maintainer's own model is also the judge,
      because the two record different conflicts.
    exclusion_test: >
      Do NOT tag this where scoring is programmatic (unit tests, exact match, game outcomes),
      where the judge's vendor has no system among those evaluated, or where the only conflict
      is that the maintainer submits systems (`maintainer-competes-on-own-benchmark`).
    examples:
      - ref: healthbench
        qualifies: true
        why: >
          The grader is gpt-4.1-2025-04-14, the maintainer's own model, and it scores Claude,
          Gemini, Grok and Llama responses as well as OpenAI's.
      - ref: medhelm
        qualifies: true
        why: >
          All three jury models (GPT-4o, Claude 3.7 Sonnet, Llama 3.3 70B) are among the nine
          evaluated models.
      - ref: roboarena
        qualifies: true
        why: >
          The evaluators who cast the preference votes are entrants, who earn evaluations of
          their own policies by running comparisons.
      - ref: wmt25-general-mt-shared-task
        qualifies: true
        why: >
          Cohere's Command A is one of AutoRank's two judges and Cohere employees rate the
          English to Italian outputs, while a Cohere system competes.
      - ref: swe-bench-verified
        qualifies: false
        why: >
          NEAR MISS. The maintainers' own mini-SWE-agent produces rows, but grading is by unit
          tests, so no grader has a stake. That is `maintainer-competes-on-own-benchmark` only.
    not_to_be_confused_with:
      - term: maintainer-competes-on-own-benchmark
        distinction: >
          `maintainer-competes-on-own-benchmark` records who submits; this flag records who
          grades. A maintainer whose model is also the judge carries both.

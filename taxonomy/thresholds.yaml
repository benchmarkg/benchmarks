# taxonomy/thresholds.yaml
#
# Named constants, not literals. 12-analytics-and-trends.md S1.4 owns the reasoning that separates
# the two floors, and this file alone holds their values: no document or module prints them, and
# anything that needs one references it BY NAME (tests/test_threshold_literals.py checks it).
#
# They are constants rather than literals because a threshold typed as a number in five
# documents is a threshold that gets calibrated in one of them and diverges in the other four
# the first time real completeness data arrives -- which is exactly when it finally matters.
#
# Basis, 2026-11-25 (adr/0028-threshold-recalibration.md, P4-S1-T07): both values were checked
# against the first measured distribution, the n = 76 hand-curated claims on 18 benchmarks that
# `bench report completeness` scores (median 0.73, a quarter at 0.40 or below, 30 fully specified),
# and RE-AFFIRMED, not re-derived. The sample shows both floors sitting in its low tail, with 14 and
# 16 claims below them, all from three benchmarks; it cannot place them more precisely, because it
# is under the ~200 claims 12 S1.4 asks for, clusters by benchmark, and was chosen adversarially.
# The ADR says what reopens the question.
#
# `calibrated_on: null` is load-bearing and stays null after that check: a re-affirmation on a
# sample this small is not a calibration, and filling the date in would say it was. The honest
# expectation after the Epoch ingest is a mean condition_completeness around 0.10 on a six-field
# profile, so APPROXIMATELY ZERO ingested claims will clear either floor. That is the intended
# behaviour, not a miscalibration: the bulk ingest is for coverage, and comparison is where
# credibility lives.
#
# Authored by P0-S2-T06 from 04 S12; basis recorded by P4-S1-T07.

version: 0.1.1
updated: 2026-11-25
description: >
  Condition-completeness floors, referenced by name from every document that needs one. Both
  re-affirmed on 2026-11-25 against n = 76 hand-curated claims on 18 benchmarks, and not yet
  calibrated (adr/0028-threshold-recalibration.md).

declared_by: 12-analytics-and-trends.md
calibrated_on: null

thresholds:
  frontier_floor: 0.3
  comparison_floor: 0.4

meanings:
  frontier_floor: >
    The condition_completeness below which a claim is too thin to sit on a frontier line. A
    claim below it still renders everywhere else; it is excluded from the SOTA trace only.
  comparison_floor: >
    The condition_completeness below which a machine-ingested claim is hidden from comparison
    views while remaining fully visible in browse and search.

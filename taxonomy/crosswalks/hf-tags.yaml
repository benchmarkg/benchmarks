    count: 39
    count_fixture: 38
    use: suggested
    source: hf_space_tag
    caveat: hf-tag-density
    note: A manual route says who enters a result, not who checks it; both readings occur.
  - tag: "submission:automatic"
    ours: Leaderboard.submission_process
    candidates: [sandboxed-rerun]
    count: 27
    count_fixture: 27
    use: suggested
    source: hf_space_tag
    caveat: hf-tag-density
  - tag: "submission:semiautomatic"
    ours: Leaderboard.submission_process

# taxonomy/_corpus/classifications/carla-leaderboard-2-0.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: carla-leaderboard-2-0
corpus_item: 17
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  home: https://leaderboard.carla.org/
  evaluation: https://leaderboard.carla.org/evaluation_v2_0/
  getstarted: https://leaderboard.carla.org/get_started_v2_0/
  submit: https://leaderboard.carla.org/submit_v2_0/
  challenge: https://leaderboard.carla.org/challenge/
  about: https://leaderboard.carla.org/about/
  terms: https://leaderboard.carla.org/terms/
facets:
  domain.primary:
    - value: robotics-embodiment/autonomous-driving-planning
      source: home
      quote: The main goal of the CARLA Autonomous Driving Leaderboard is to evaluate the driving proficiency
        of autonomous agents in realistic traffic scenarios.
      note: Agents are 'directed to drive to a destination point'. The claim is driving proficiency, and 0.9.0's
        claim-over-protocol rule decides the primary; closed versus open loop is carried by evaluation_method.
  domain.secondary: []
  capability:
    - value: sensorimotor-control
      source: home
      quote: The main goal of the CARLA Autonomous Driving Leaderboard is to evaluate the driving proficiency
        of autonomous agents in realistic traffic scenarios.
      note: Agents issue control commands to a simulated vehicle every step and are scored on the resulting driving.
        reliability-consistency is not tagged; carla-leaderboard-2-0 is its 0.9.0 near miss, because the ranking
        averages the repeated routes.
  evaluation_method:
    - value: simulation-rollout
      source: evaluation
      quote: Main metric of the leaderboard, serving as the product between the route completion and the infractions
        penalty.
  designed_for_subjects:
    - value: rl-policy
      source: getstarted
      quote: Training database creation tools
      note: The leaderboard ships training routes and training-database tools for learned driving agents, which
        act in the simulator. No source names a non-learned entrant, so classical-algorithm is not tagged.
  data.access:
    - value: private-test-server
      source: getstarted
      quote: The routes used for the online evaluation are secret.
      note: The training, validation and testing routes are public; the evaluation routes never leave the organisers'
        AWS instance.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: Starting on March 2025, the CARLA AD Leaderboard will be updated to the new version 2.1.
      note: 2.1 changed the infraction score from exponential to linear while the routes stayed fixed; 0.9.0 counts
        a scoring change under a version label.
  data.data_provenance:
    - value: simulation-generated
      source: getstarted
      quote: The set of routes that will be used for the simulation.
      note: The traffic scenarios are authored by the organisers 'based on the NHTSA typology' of pre-crash
        scenarios.
  data.contamination_risk:
    - value: low
      source: getstarted
      quote: The routes used for the online evaluation are secret.
      note: The scored routes are never exposed, which excludes a training route to them. The towns and scenario types
        are public ('Participants have access to a set of traffic scenarios that work on the publicly available
        towns'); no source assesses contamination further.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: evaluation
      quote: Has a maximum value of 100.
  lifecycle:
    - value: superseded
      source: home
      quote: While the Leaderboard is current at version 2.1, older versions are still available to support your
        previous work.
      note: The entry is Leaderboard 2.0, and 0.9.0 reads the entry as catalogued. The family is active at 2.1.
  activity:
    - value: leaderboard-live-no-round
      source: home
      quote: Teams are provided a finite number of submissions (currently 20 submissions) for a given a month.
      note: The annual challenge 'will unfortunately not be running during 2025', and the standing leaderboard takes
        entries.
  governance.maintainer_type:
    - value: null
      source: about
      quote: The CARLA Autonomous Driving Leaderboard is developed and maintained by the CARLA Team and the
        Embodied AI Foundation.
      failure: 2026-09-28-carla-leaderboard-2-0-009
  governance.submission_process:
    - value: containerized-algorithm-submission
      source: submit
      quote: In order for the CARLA leaderboard to evaluate your agent, it needs to be encapsulated within
        a docker image.
  governance.independence_flags:
    - value: null
      source: home
      quote: The CARLA Autonomous Driving Leaderboard is offered for free as a service to the research community
        thanks to the generosity of our sponsors and collaborators.
      failure: 2026-09-28-carla-leaderboard-2-0-010
  execution.compute_tier:
    - value: provided-allocation
      source: home
      quote: Each submission will be evaluated in AWS using a g5.12xlarge instance.
      note: The organisers run the official evaluation for free, which outranks the CARLA 0.9.14 simulator dependency;
        the simulator is recorded by the specific-simulator-build blocker.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: getstarted
      quote: The routes used for the online evaluation are secret.
      note: The official score is computed on routes only the organisers hold. A local run on the public routes needs
        the simulator ('You can test your docker image by running the leaderboard locally at your computer'), but it
        does not reproduce the headline.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: getstarted
      quote: The routes used for the online evaluation are secret.
    - value: specific-simulator-build
      source: getstarted
      quote: The CARLA Leaderboard release is based on version 0.9.14.
  execution.harness_availability:
    - value: official-harness
      source: getstarted
      quote: Download the Leaderboard repository leaderboard-2.0 branch.
notes: >-
  No paper describes Leaderboard 2.0, so every value rests on the organiser pages. The corpus's get_started and
  submit URLs return 404; the version-specific pages (get_started_v2_0, submit_v2_0, evaluation_v2_0) were
  fetched in their place. The results tables are rendered by script, and the fetched leaderboard page carries only
  column headers. Entrants are 'AD agents' and 'AV stacks', Python or ROS based; ADR-0020 defers an
  autonomy-stack subject for hybrid modular stacks, and no source here says whether entrants are learned, modular
  or hybrid.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, evaluation_method, designed_for_subjects, data.access, data.refresh,
      data.contamination_risk, lifecycle, activity, execution.compute_tier, execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; the reproducibility tier follows the new most-restrictive-part rule.

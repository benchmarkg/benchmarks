notes: >-
  No paper describes Leaderboard 2.0, so every value rests on the organiser pages. The corpus's get_started and
  submit URLs return 404; the version-specific pages (get_started_v2_0, submit_v2_0, evaluation_v2_0) were
  fetched in their place. capabilities.yaml's example says reliability-consistency qualifies; it is not tagged
  (failure 002). The results tables are rendered by script, and the fetched leaderboard page carries only
  column headers.

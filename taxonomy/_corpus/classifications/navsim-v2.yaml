# taxonomy/_corpus/classifications/navsim-v2.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: navsim-v2
corpus_item: 16
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2506.04218
  abs: https://arxiv.org/abs/2506.04218
  home: https://github.com/autonomousvision/navsim
  submission: https://raw.githubusercontent.com/autonomousvision/navsim/main/docs/submission.md
  metrics: https://raw.githubusercontent.com/autonomousvision/navsim/main/docs/metrics.md
  splits: https://raw.githubusercontent.com/autonomousvision/navsim/main/docs/splits.md
  install: https://raw.githubusercontent.com/autonomousvision/navsim/main/docs/install.md
  dlnavhard: https://raw.githubusercontent.com/autonomousvision/navsim/main/download/download_navhard_two_stage.sh
facets:
  domain.primary:
    - value: robotics-embodiment/autonomous-driving-planning
      source: submission
      quote: To submit to a leaderboard you need to create a pickle file that contains a trajectory for each
        test scenario.
  domain.secondary: []
  capability:
    - value: planning
      source: paper
      quote: We consider a planning task where evaluation proceeds in two stages (Fig. 1).
      note: The entrant outputs a trajectory that the devkit's LQR controller tracks in a non-reactive simulation;
        sensorimotor-control's 0.9.0 tie-break assigns that case to planning.
  evaluation_method:
    - value: composite
      source: metrics
      quote: NAVSIM v1 introduced the PDM Score (PDMS), a combination of several subscores and multiplicative
        penalties.
      failure: 2026-09-28-navsim-v2-002
    - value: constraint-check
      source: metrics
      quote: The new Driving Direction Compliance (DDC) and Traffic Light Compliance (TLC) subscores extend
        the inadmissible behaviors detected and penalized in evaluation.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: paper
      quote: Latent TransFuser (LTF) [11], the most established baseline for image-only planning for nuPlan
      note: Learned planners are trained on logged driving data and scored open-loop without acting in an environment,
        which task-specific-supervised-model covers and rl-policy excludes.
    - value: classical-algorithm
      source: paper
      quote: a set of 37 rule-based and 46 learned planners
  data.access:
    - value: fully-open
      source: dlnavhard
      quote: wget https://huggingface.co/datasets/OpenDriveLab/OpenScene/resolve/main/navsim-v2/navsim_v2.2_navhard_two_stage_scene_pickles.tar.gz
      note: The corpus entry's leaderboard is the public navhard_two_stage split, which downloads without an account
        and is scored locally ('The `navhard_two_stage` split is used for local testing of your model's performance').
        The 2025 challenge split private_test_hard_two_stage withholds its annotations; it is a round beside the
        headline set.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: NAVSIM v2.2 release (official devkit version for
  data.data_provenance:
    - value: real-world-instrument
      source: splits
      quote: Corresponds to nuPlan and downsampled to 2HZ.
    - value: model-generated
      source: abs
      quote: augments them with synthetic observations generated prior to evaluation using 3D Gaussian Splatting
    - value: simulation-generated
      source: metrics
      quote: The follow-up scenes were pre-computed by rolling out several simulations starting from the initial
        scene, each with a different 4-second plan.
  data.contamination_risk:
    - value: medium
      source: home
      quote: Using the `test`/`navtest`/`navhard_two_stage`/`warmup_two_stage`/`private_test_two_stage` splits
        for training your challenge submissions is not allowed.
      note: The navhard split behind the headline is public, so a training route is plausible; the rule forbids it
        but no source assesses whether it holds, and the underlying nuPlan logs are public.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: metrics
      quote: 'No at-fault Collisions (NC) | multiplier | {0, 1/2, 1} | Drivable Area Compliance (DAC) | multiplier
        | {0, 1}'
      note: Every multiplier and weighted subscore of EPDMS lies in [0, 1], so the metric is bounded at 1. The logged
        human trajectory only switches off penalties the human also incurs, and no source reports its EPDMS as a
        reference.
  lifecycle:
    - value: null
      failure: 2026-09-28-navsim-v2-007
  activity:
    - value: null
      failure: 2026-09-28-navsim-v2-008
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: University of Tübingen, Tübingen AI Center
      note: The repository is autonomousvision at Tübingen, which holds the devkit and data. Co-authors include NVIDIA
        Research, Robert Bosch GmbH and OpenDriveLab, and OpenDriveLab hosts the Hugging Face leaderboards; under the
        holder rule neither decides.
  governance.submission_process:
    - value: held-out-server
      source: submission
      quote: all evaluation is performed on the server with the official evaluation script
      note: The 2025 challenge scores the private_test_hard_two_stage split, whose annotations are not provided.
    - value: maintainer-scored-predictions
      source: paper
      quote: The goal of the leaderboard is to ensure standardized evaluation
      note: The public navhard leaderboard scores submitted trajectories on the navhard split, whose data every entrant
        can download and score locally.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: we propose a new simple and robust baseline architecture called NavFormer
      note: Latent TransFuser, another listed baseline, also comes from the maintainer group.
  execution.compute_tier:
    - value: null
      source: splits
      quote: requires significantly less sensor data storage than `travel` (445GB vs. 2100GB)
      failure: 2026-09-28-navsim-v2-011
  execution.reproducibility_tier:
    - value: fully-automatable
      source: install
      quote: The `navhard_two_stage` split is used for local testing of your model's performance in a two-stage
        pseudo closed-loop setup.
      note: The headline navhard score is reproducible from downloaded data with the devkit; the challenge's private
        split, a round beside it, is scored only by the server.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: metrics
      quote: 'To evaluate the PDM score for an agent you can run:'
notes: >-
  The entry is NAVSIM v2 (main branch, pseudo-simulation, EPDMS), whose repository also hosts v1 and its navtest
  leaderboard on a separate branch; only v2 is classified. The corpus names the public navhard leaderboard, which
  0.9.0's headline rules make the layer that data.access, the ceiling and the reproducibility tier describe; the
  2025 challenge's private split is a round beside it. The 2024 rule that removes leaderboard entries without open
  code applies to the v1 navtest Leaderboard 2024, so open-source-gated is not tagged on this v2 entry. The Hugging
  Face leaderboard Space returned only a shell and is not cited.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, designed_for_subjects, data.access, data.refresh,
      data.contamination_risk, data.ceiling_anchor_type, governance.submission_process, execution.compute_tier,
      execution.reproducibility_blockers]
    note: Re-adjudicated against 0.9.0; the install guide and the navhard download script were added as maintainer
      sources.

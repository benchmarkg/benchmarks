# taxonomy/_corpus/classifications/uspto-50k.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: uspto-50k
corpus_item: 40
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC5658761/
  arxiv: https://arxiv.org/pdf/1706.01643
  home: https://github.com/pandegroup/reaction_prediction_seq2seq
  commits: https://api.github.com/repos/pandegroup/reaction_prediction_seq2seq/commits
facets:
  domain.primary:
    - value: chemistry-materials/retrosynthesis
      source: arxiv
      quote: For a given target molecule and a specified reaction type, the model predicts the most likely reactants
        that can react in the specified reaction type to produce the target molecule.
      note: 'USPTO-50k is single-step retrosynthesis: one disconnection from product to reactants, with no route and no
        purchasability check. ADR-0020 defers a single-step subdomain and rules the case expressible as retrosynthesis
        with this note.'
  domain.secondary: []
  capability:
    - value: scientific-prediction
      source: arxiv
      quote: For a given target molecule and a specified reaction type, the model predicts the most likely reactants
        that can react in the specified reaction type to produce the target molecule.
      note: Entrants predict the reactants of a chemical reaction from its product, scored against the reactants the
        patent literature reports (ADR-0014 names USPTO-50k).
  evaluation_method:
    - value: exact-match
      source: arxiv
      quote: The top-N accuracy refers to the percentage of examples where the ground truth reactant set, which is the
        actual patent literature reported reactant set for the corresponding target molecule in the test dataset, was
        found within the top N predictions made by the model.
      note: Reactant sets are compared as canonicalised SMILES; top-N counts an item correct if any of the first N
        candidates equals the single recorded reactant set, with no partial credit.
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: The model is trained on 50,000 experimental reaction examples from the United States patent literature
    - value: classical-algorithm
      source: paper
      quote: We find that our model performs comparably with a rule-based expert system baseline model
      note: The baseline's rules are extracted from the training reactions and ranked by observed frequency; under 0.9.0
        rules and frequencies tabulated from training data do not make a method learned.
  data.access:
    - value: fully-open
      source: paper
      quote: The neural network model, processed data sets, and evaluation code will be made available at https://github.com/pandegroup/reaction_prediction_seq2seq.git.
  data.refresh:
    - value: static
      source: paper
      quote: Finally, the data set was split into training, validation, and test data sets (8:1:1).
      note: One split, released with the code in November 2017 and not changed since (commits).
  data.data_provenance:
    - value: curated-public-database
      source: paper
      quote: We use a filtered patent data set, derived from an open source patent database,47 which contains 50,000
        atom-mapped reactions that have been classified into 10 broad reaction types.
      note: Reactions text-mined from US patents (Lowe), atom-mapped and classed by Schneider et al., then filtered and
        split by Liu et al.; uspto-50k is the 0.9.0 example of curated-public-database.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: derived from an open source patent database
      note: A public static set since 2017, drawn from public patent text. No source assesses overlap with any model's
        training data, so medium is the honest default rather than an evidenced route.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: arxiv
      quote: The top-N accuracy refers to the percentage of examples where the ground truth reactant set, which is the
        actual patent literature reported reactant set for the corresponding target molecule in the test dataset, was
        found within the top N predictions made by the model.
      note: Top-N accuracy is bounded at 100% and no source measures an anchor. Each product has one recorded reactant
        set, so the attainable score is below the bound by an unmeasured amount, which goes on the Baseline record. Under
        0.9.0 a bounded headline with no measured anchor is theoretical-maximum.
  lifecycle:
    - value: null
      source: commits
      quote: 2018-03-30T18:19:26Z Update README.md
      failure: 2026-09-28-uspto-50k-009
  activity:
    - value: no-submission-channel
      source: home
      quote: The prediction can be evaluated using reaction_evaluation.ipynb in the evaluation folder.
      note: A download-and-run split with an evaluation notebook and no leaderboard or submission route.
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: Department of Chemistry, Stanford University, Stanford, California 94305, United States
      note: The Pande group; the underlying 50k reaction set is Schneider, Stiefl and Landrum 2016 (Novartis), which
        this split re-processes.
  governance.submission_process:
    - value: literature-only
      source: paper
      quote: Table 2 shows the top-N accuracies of the rule-based expert system baseline and the seq2seq model on the
        test data set.
      note: The maintainers publish only the release paper's Table 2 and keep no ranking; everyone else reports top-N
        accuracy in their own papers.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: We find that our model performs comparably with a rule-based expert system baseline model
      note: The split was introduced together with the authors' own seq2seq model and their own baseline. The declared
        competing interests (a consultancy with Schrodinger and board and investment roles) concern no evaluated
        system.
  execution.compute_tier:
    - value: null
      failure: 2026-09-28-uspto-50k-008
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: The data has already been preprocessed for training the seq2seq model
      note: The pinned stack is python 3.5 and tensorflow 1.0.1, which only matters for re-running the 2017 model; the
        split and the top-N scoring need neither.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: The prediction can be evaluated using reaction_evaluation.ipynb in the evaluation folder.
notes: The corpus flags a provenance ambiguity, and it is real. The benchmark split (40k/5k/5k, 8:1:1, reaction class
  as an input token) and the top-N protocol come from Liu et al. 2017, the code repository in the corpus url. The 50k
  atom-mapped, class-labelled reaction set comes from Schneider, Stiefl and Landrum 2016, and the reactions from Lowe's
  text-mined USPTO extraction. This record classifies the Liu 2017 split, the thing papers mean by USPTO-50k. The ACS
  AuthorChoice full text on PMC and the arXiv PDF were both used; the PubMed-style PMC page is the corpus paper url.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, designed_for_subjects, data.data_provenance, data.ceiling_anchor_type,
      lifecycle, activity, governance.submission_process]
    note: Re-adjudicated against 0.9.0; the blocking capability gap closes with scientific-prediction, and lifecycle
      moves from dormant to an abstention pending ADR-0020 open question 3.

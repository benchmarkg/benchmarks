# taxonomy/_corpus/classifications/docvqa-robust-reading-competition.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: docvqa-robust-reading-competition
corpus_item: 64
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2007.00398
  abs: https://arxiv.org/abs/2007.00398
  home: https://rrc.cvc.uab.es/?ch=17
  tasks: https://rrc.cvc.uab.es/?ch=17&com=tasks
  downloads: https://rrc.cvc.uab.es/?ch=17&com=downloads
  results: https://rrc.cvc.uab.es/?ch=17&com=evaluation&task=1
  docvqa2026: https://rrc.cvc.uab.es/?ch=34&com=introduction
facets:
  domain.primary:
    - value: multimodal/visual-qa
      source: home
      quote: 'Task 1 - Single Page Document VQA: Is a typical VQA style task, where natural language questions are defined
        over single page documents, and an answer needs to be generated by interpreting the document image.'
      note: Under 0.9.0 the item format decides (02 S11 rule 12). A document-image benchmark posed as questions is visual-qa,
        with vision/document-understanding secondary.
  domain.secondary:
    - value: vision/document-understanding
      source: home
      quote: This goes over and above passing a document image through OCR, and involves understanding all types of information
        conveyed by a document.
      note: Printed and handwritten text, layout, tick boxes, forms and tables, which is what the tasks test; the QA format
        makes it secondary (vision/document-understanding not_to_be_confused_with multimodal/visual-qa).
    - value: multimodal/chart-diagram-understanding
      source: tasks
      quote: Infographics (or information graphic) is a visual representation of information or data in the form of
        charts, diagrams, etc.
      note: Task 3, Infographics VQA.
    - value: multimodal/cross-modal-retrieval
      source: tasks
      quote: Document Collection VQA (DocCVQA) is a retrieval-answering task where given a question, the aim is to identify
        and retrieve from a large collection of documents, which ones are relevant to answer the given question and provide
        the answer itself.
      note: Task 2 retrieves document images (14,362 filled forms) for a text question.
  capability:
    - value: perception
      source: home
      quote: visually understanding the information on a document image is necessary in order to provide an answer
      note: Printed, typewritten and handwritten text, layout, tick boxes and figures must be read from the image.
    - value: context-integration
      source: tasks
      quote: The answers to questions are short text spans taken verbatim from the document.
      note: Task 4 adds answer-page prediction to check 'if the answers have been inferred from the input documents or
        from prior learned bias'.
  evaluation_method:
    - value: reference-metric
      source: tasks
      quote: We will be using Average Normalized Levenshtein Similarity (ANLS) as the evaluation metric.
      note: ANLS is a string similarity against the list of accepted answers. Task 2 ranks by ANLSL, and Task 4 adds
        answer-page accuracy.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: paper
      quote: We report several baseline results by adopting existing VQA and reading comprehension models.
      note: The benchmark was built for VQA models (LoRRA, M4C) and BERT readers trained on its 50,000 training questions
        ('In a typical supervised training setting one might want to use only one answer per question'). Document QA is
        a general perception and language task, not a discipline. The general vision-language models and the multi-agent
        framework on today's leaderboard are claim-level subjects of those rows.
  data.access:
    - value: train-open-test-held-out
      source: tasks
      quote: A list of correct answers provided by annotators. Not available in test set.
      note: Test images and questions are distributed and the answers withheld. The RRC account needed for the download
        section ('You will need to register to get access to the download section') is a lesser layer (0.9.0 access
        precedence; this entry is the example on train-open-test-held-out).
  data.refresh:
    - value: versioned-releases
      source: home
      quote: 09/01/2023 QA Types made public 02/19/2023 Multipage DocVQA Dataset is public! 03/31/2021 ICDAR competition
        deadline extended 02/11/2021 Infographics Test Set Available
      note: The headline Task 1 test set has ranked the standing leaderboard since '20 April 2020 - Test set available',
        and every task added since (Infographics VQA, Multipage DocVQA, QA types) came with a dated announcement, with
        a dataset_version string in the files. The competition rounds (CVPR 2020, ICDAR 2021, and the separate ICDAR
        2026 challenge, ch=34) sit beside the labelled set, so the family is not periodic-recompetition. The test-split
        exclusion list of ambiguous questions carries no date on the fetched pages.
  data.data_provenance:
    - value: curated-public-database
      source: paper
      quote: Images in the dataset are sourced from documents in UCSF Industry Documents Library
      note: Pages were hand picked from a curated library archive of industry documents (Tasks 1, 3 and 4) and from Public
        Disclosure Commission forms (Task 2), archives of records compiled for other purposes ('We downloaded documents
        from different collections and hand picked pages'). 0.9.0 separates a curated archive from harvested web content
        (web-scraped).
    - value: crowd-authored
      source: paper
      quote: Questions and answers on the selected document images are collected with the help of remote workers, using
        a Web based annotation tool.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: Images in the dataset are sourced from documents in UCSF Industry Documents Library
      note: Test images and questions are distributed, the source documents are on the public web, and the train split
        with answers is public. Test answers are withheld. No source assesses contamination.
  data.ceiling_anchor_type:
    - value: crowd-average
      source: paper
      quote: For measuring human performance , we collect answers for all questions in test split, with help a few volunteers
        from our institution.
      note: The paper reports 94.36% accuracy. The leaderboard lists 'Human Performance' at ANLS 0.9811, and the top
        system (ORCA, 2026-03-10) at 0.9729.
  lifecycle:
    - value: active
      source: results
      quote: 'method: ORCA2026-03-10'
      note: New Task 1 results were submitted in 2025 and 2026 (Seed-VL-1.5, qwen3vl, NEXT-8B, ORCA). The top score is
        within 0.01 ANLS of the human row. lifecycle saturated is derived and is not set here.
  activity:
    - value: leaderboard-live-no-round
      source: results
      quote: 'method: NEXT-8B2026-01-02'
      note: The 2020 and 2021 competition rounds are over and the Task 1 leaderboard still takes results. A separate
        ICDAR 2026 competition (DocVQA 2026, ch=34) announced its winners on 22 June 2026.
  governance.maintainer_type:
    - value: academic-lab
      source: results
      quote: 'Affiliation: CVIT, IIIT Hyderabad, CVC-UAB, Amazon'
      note: The data and leaderboard are published on the Robust Reading Competition portal of the Computer Vision Center
        (rrc.cvc.uab.es), a UAB research centre, which is the holder under 0.9.0's rule. The DocVQA organisers are from
        IIIT Hyderabad and CVC-UAB, with one organiser at Amazon, and the same team has run each round.
  governance.submission_process:
    - value: held-out-server
      source: tasks
      quote: Results are expected to be submitted as a single JSON file (extension .json)
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: tasks
      quote: A list of correct answers provided by annotators. Not available in test set.
  execution.compute_tier:
    - value: null
      failure: 2026-09-28-docvqa-robust-reading-competition-005
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: tasks
      quote: A list of correct answers provided by annotators. Not available in test set.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: tasks
      quote: A list of correct answers provided by annotators. Not available in test set.
  execution.harness_availability:
    - value: reference-implementation-only
      source: paper
      quote: The dataset, code and leaderboard are available at docvqa.org
      note: The released code is the paper's baselines. The official ANLS scorer runs on the RRC server and was not
        found on the fetched pages.
notes: The corpus entry is the RRC DocVQA challenge page (ch=17, 'DocVQA 2020-23'), with four tasks (single page,
  document collection, infographics, multipage), classified on its primary Task 1 and paper. The RRC also hosts DocVQA
  2026 ('ICDAR 2026 Competition on Multimodal Reasoning over Documents in Multiple Domains', ch=34), which 'builds on
  the successful DocVQA series'. By 02 S11 rule 5 it is the same family. It is noted here but not classified, because
  its data and tasks differ.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, domain.secondary, designed_for_subjects, data.access, data.refresh, data.data_provenance,
      governance.maintainer_type]
    note: Re-adjudicated against 0.9.0; document-understanding becomes secondary, the subjects task-specific-supervised-model,
      refresh versioned-releases and the document source curated-public-database.

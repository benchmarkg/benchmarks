# taxonomy/_corpus/classifications/gdpval.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: gdpval
corpus_item: 82
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2510.04374
  abs: https://arxiv.org/abs/2510.04374
  home: https://huggingface.co/datasets/openai/gdpval
facets:
  domain.primary:
    - value: society-econ-law/economically-valuable-work
      source: abs
      quote: GDPval covers the majority of U.S. Bureau of Labor Statistics Work Activities for 44 occupations across
        the top 9 sectors contributing to U.S. GDP (Gross Domestic Product).
  domain.secondary: []
  capability:
    - value: context-integration
      source: paper
      quote: Each task also requires parsing through up to 17 reference files in the gold subset, and 38 in the
        full set.
      note: The paper also shows that performance falls when context is withheld ("model performance degrades with
        less context"). autonomy is not tagged despite the capabilities.yaml example; see the failure.
      failure: 2026-09-28-gdpval-001
  evaluation_method:
    - value: human-expert-eval
      source: paper
      quote: we conducted blinded expert pairwise comparisons, where experts in the relevant occupation were presented
        with a request and reference files and asked to rank two or more unlabeled work deliverables.
      note: human-distribution-percentile is not tagged despite the evaluation-methods.yaml example; see the failure.
      failure: 2026-09-28-gdpval-002
    - value: model-graded-judge
      source: paper
      quote: For the gold subset, we trained an experimental grading model to perform pairwise comparisons in the
        style of industry professional experts.
      note: 'Judge model: "Our automated grader, based on GPT-5-high"; no version string is given. The paper calls
        it experimental and recommends human grading, and it cannot grade 12 of the 220 tasks.'
  designed_for_subjects:
    - value: agent-scaffold
      source: paper
      quote: Here is the prompt we give the agent to elicit capabilities
      note: OpenAI models ran with "the web search tool and the code interpreter tool, with background sampling"
        in a container, and the scaffolding experiment adds best-of-N with a GPT-5 judge.
    - value: full-product-pipeline
      source: paper
      quote: We sampled Claude via the UI to enable the maximum GDPval-relevant features.
      note: Claude was run as the shipped consumer product, while the OpenAI models ran through the API with tools,
        so one comparison mixes two kinds of subject.
  data.access:
    - value: fully-open
      source: paper
      quote: we open-source a gold subset of 220 tasks and provide a public automated grading service at evals.openai.com
      note: The released gold subset includes the prompts, reference files, the expert deliverables and rubrics (the
        dataset card's deliverable_files and rubric_json columns). The other 1,100 tasks of the full set are not released.
      failure: 2026-09-28-gdpval-003
  data.refresh:
    - value: versioned-releases
      source: paper
      quote: Our paper introduces the first version of GDPval, a benchmark evaluating AI model performance on real-world
        economically valuable tasks.
      note: The paper promises later iterations ("We are expanding the dataset size"). It also mentions "an earlier
        version of the GDPval gold subset" that carries no version label.
  data.data_provenance:
    - value: expert-authored
      source: paper
      quote: We recruited expert industry professionals to create realistic tasks based on their professional work
        experience.
      note: The card also says "Some images and videos in this dataset feature AI-generated individuals". That describes
        some reference media, not the tasks themselves.
  data.contamination_risk:
    - value: medium
      source: home
      quote: Canary gdpval
      note: The public gold subset carries a canary string, so the maintainers treat training leakage as a live route.
        The Hugging Face page also lists third-party models "trained or fine-tuned on openai/gdpval". That list is Hugging
        Face's own metadata, and no source reports contamination of any evaluated model.
  data.ceiling_anchor_type:
    - value: null
      source: paper
      quote: 'No “upper limit”: Unlike metrics that could saturate quickly, our primary metric is win rate, which allows
        for continuous evaluation.'
      failure: 2026-09-28-gdpval-004
  lifecycle:
    - value: null
      failure: 2026-09-28-gdpval-005
  activity:
    - value: null
      failure: 2026-09-28-gdpval-006
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: Amelia Glaese Jerry Tworek OpenAI
  governance.submission_process:
    - value: null
      failure: 2026-09-28-gdpval-007
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: 'Figure 6: Performance of OpenAI frontier models increased roughly linearly over time on the GDPval gold
        subset.'
      failure: 2026-09-28-gdpval-008
  execution.compute_tier:
    - value: human-panel
      source: paper
      quote: Constructing and running our evaluation is expensive, particularly with industry expert graders.
      note: Sampling the models adds API spend ("the average invoiced cost per task"), and the experimental automated
        grader is the cheaper path. Human expert comparison is the recommended one.
  execution.reproducibility_tier:
    - value: requires-human-raters
      source: paper
      quote: our primary evaluation metric is head-to-head human expert comparison
  execution.reproducibility_blockers:
    - value: human-raters
      source: paper
      quote: On average, grading each comparison for the gold subset took over an hour.
    - value: no-reference-implementation
      source: paper
      quote: We open-source the prompts and reference files in our 220-task gold subset.
      note: No sampling or grading code is released. The model setup (tools, container, preinstalled libraries) and
        the grading protocol exist only as prose.
  execution.harness_availability:
    - value: none
      source: paper
      quote: we make an experimental automated grader publicly available at evals.openai.com
      failure: 2026-09-28-gdpval-009
notes: The record classifies the entry as the corpus defines it, the open 220-task gold subset on Hugging Face with
  its paper. The headline results in the paper are also on the gold subset. The OpenAI blog post answered HTTP 403,
  and evals.openai.com returned an empty application shell, so neither is a source. Everything about the grading
  service comes from the paper.

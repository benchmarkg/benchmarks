# taxonomy/_corpus/classifications/rexrank.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: rexrank
corpus_item: 33
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2411.15122
  abs: https://arxiv.org/abs/2411.15122
  home: https://rexrank.ai/
  guideline: https://rexrank.ai/explore/submission_guideline.html
  metrics: https://github.com/rajpurkarlab/CXR-Report-Metric
facets:
  domain.primary:
    - value: medicine-health/radiology-report-generation
      source: paper
      quote: a public leaderboard and challenge specifically designed for evaluating AI-powered radiology report
        generation from chest X-ray images.
  domain.secondary:
    - value: multimodal/visual-qa
      source: home
      quote: ReXrank Challenge V2.0 is a competition in VQA task utilizing VQA dataset constructed from ReXGradient,
        including 41,007 VQA pairs with 10,000 radiological studies.
      note: The VQA track postdates the paper and appears only on the site, as the corpus flags.
  capability:
    - value: perception
      source: paper
      quote: requiring both deep expertise in medical imaging and the ability to accurately interpret and articulate
        intricate findings.
    - value: factual-precision
      source: paper
      quote: RadGraph-F1 is a metric for radiology report evaluation. It computes the overlap in clinical entities
        and relations that RadGraph [11] extracts from candidate and reference reports.
      note: communication is not tagged; 0.9.0 makes rexrank its near miss, because every metric compares the report
        with a reference and no recipient's understanding is scored.
    - value: generation-fidelity
      source: paper
      quote: It evaluates the quality of generated text by comparing n-gram precision between the candidate and
        reference texts, with scores ranging from 0 to 1.
    - value: distribution-shift-generalization
      source: paper
      quote: This broad dataset spectrum allows us to evaluate model performance on data with varying distributions,
        providing deeper insights into the models’ generalization capabilities.
      note: Scores are reported per test set, including the 67-site private ReXGradient set held out from every
        entrant's training data.
  evaluation_method:
    - value: reference-metric
      source: paper
      quote: In this work, we specifically use BLEU-2, which focuses on bigram precision to assess the quality of
        the generated text.
    - value: model-derived-metric
      source: paper
      quote: It computes the cosine similarity between the indicator vectors of 14 pathologies that the CheXbert
        automatic labeler extracts from model-generated and groundtruth radiology reports.
      note: SembScore (CheXbert), RadGraph-F1 (RadGraph), BERTScore and RaTEScore are computed by scoring models;
        the paper names implementations but not checkpoint versions. Under 0.9.0 a field-standard metric computed
        by a model (RadGraph-F1, SembScore) is model-derived-metric, not domain-metric.
    - value: model-graded-judge
      source: paper
      quote: GREEN (Generative Radiology Report Evaluation and Error Notation) is an LLM-based metric for evaluating
        radiology report generation.
      note: 'Judge models: the GREEN model from the Stanford-AIMI implementation, and GPT-4o for FineRadScore (no
        snapshot given).'
    - value: composite
      source: paper
      quote: RadCliQ is a composite metric designed for evaluating radiology report generation, combining BLEU,
        BERTScore, SembScore, and RadGraph-F1 to provide a comprehensive assessment of generated reports.
      note: The paper names RadCliQ-v1 the primary metric ("We default use RadCliQ-v1 as the primary metric"); 0.9.0
        makes rexrank a qualifying example of composite.
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: Medical visual-language models have shown promise in automating the generation of radiology reports
        from chest X-ray images
      note: Most entrants are radiology-specific models (MedVersa, CheXagent, MAIRA-2, RadFM); general models
        (GPT-4V, and Qwen and LLaVA models on the VQA track) appear as comparators.
  data.access:
    - value: private-test-server
      source: home
      quote: In ReXrank, we use additional private test set ReXGradient, 10,000 studies for benchmarking.
      note: The headline mixes the public MIMIC-CXR, IU-Xray and CheXpert Plus splits with the maintainer-held ReXGradient
        set; under 0.9.0's mixed-headline rule the most restrictive set decides.
  data.refresh:
    - value: rolling-live
      source: home
      quote: Findings Findings + Impression Rank Model CRIMSON 1/RadCliQ-v1 BLEU BertScore SembScore RadGraph RaTEScore
        GREEN
      note: The test items are fixed, but the live table's metric battery differs from the paper's (CRIMSON added,
        FineRadScore dropped) with no version label. 0.9.0 counts the scoring function as content, so an unlabelled
        change to the metric battery is rolling-live.
  data.data_provenance:
    - value: real-world-instrument
      source: paper
      quote: This private test set is provided by Gradient Health, which consists of 10,000 studies collected from
        7,004 patients across 67 medical sites in the United States.
      note: Chest radiographs from clinical imaging.
    - value: patient-clinical-record
      source: paper
      quote: 'report: Radiologist’s findings and impressions'
      note: The references are the clinical radiology reports written for these studies. The sources do not say
        whether they are identifiable; MIMIC-CXR is distributed under PhysioNet credentialed access.
    - value: inherited-from-constituents
      source: paper
      quote: For public datasets, we utilize the official test splits of MIMIC-CXR (2,347 studies) and IU-Xray (590
        studies), along with CheXpert Plus’s validation set (200 studies) as no test split is available.
      note: Three of the four test sets are published datasets reused by their official splits; ReXGradient is the
        benchmark's own addition.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: For public datasets, we utilize the official test splits of MIMIC-CXR (2,347 studies) and IU-Xray (590
        studies), along with CheXpert Plus’s validation set (200 studies) as no test split is available.
      note: Three of the four test sets are public and years old, and most entrants were trained on the same corpora
        ("These models were trained on different medical datasets, primarily MIMIC-CXR, CheXpert Plus, and IU-Xray").
        The private ReXGradient set works against leakage. No source assesses contamination.
  data.ceiling_anchor_type:
    - value: none-known
      note: No human or radiologist baseline is reported, and the primary metric 1/RadCliQ-v1 has no upper bound
        (the paper reports values up to 1.46).
  lifecycle:
    - value: active
      source: home
      quote: 2026 CARE-X Microsoft Research
      note: The leaderboard lists entries dated 2026, and the paper was revised on 12 Aug 2026.
  activity:
    - value: accepting-submissions
      source: guideline
      quote: Once your model has been evaluated, your scores will be added to the leaderboard.
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: 'Affiliation: Department of Biomedical Informatics, Harvard Medical School, Boston, MA, USA'
      note: The Rajpurkar Lab; the private test set is provided by Gradient Health.
  governance.submission_process:
    - value: sandboxed-rerun
      source: guideline
      quote: 'Inference Script: The model should support the following command:'
      note: Entrants email a model description, environment file and inference script; the maintainers run it
        on the test sets and publish the scores.
    - value: maintainer-run
      source: paper
      quote: In our evaluation, we utilized the publicly available checkpoint from Huggingface
      note: The paper's baseline rows were never submitted; the maintainers downloaded public checkpoints (and called
        GPT-4V through its API) and ran them, and they keep the ranking.
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: home
      quote: In ReXrank, we use additional private test set ReXGradient, 10,000 studies for benchmarking.
    - value: maintainer-competes-on-own-benchmark
      source: home
      quote: MedVersa Harvard
      note: MedVersa, listed under the maintainer's institution, is among the top-ranked models, and its checkpoint
        is hosted at huggingface.co/hyzhou/MedVersa; Hong-Yu Zhou is a ReXrank author.
    - value: grader-from-evaluated-party
      source: paper
      quote: For evaluation, we employ GPT-4o as the LLM
      note: FineRadScore's judge is GPT-4o, while the GPT-4V entrant was run as the API model "gpt4o05132024", so an
        OpenAI model grades an OpenAI entrant in the paper's published results.
  execution.compute_tier:
    - value: provided-allocation
      source: paper
      quote: ReXrank supports model submissions and evaluates them on both public datasets and a large-scale private
        dataset
      note: The maintainers run each submitted inference script, and pay for the LLM-based metrics. Entrants train
        on their own hardware.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: home
      quote: ReXGradient is a large-scale private test dataset contains 10,000 studies collected from different medical
        centers in the US.
      note: For the headline ReXGradient scores. Scores on the three public test sets can be reproduced with the
        public checkpoints and metric code.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: home
      quote: ReXGradient is a large-scale private test dataset contains 10,000 studies collected from different medical
        centers in the US.
  execution.harness_availability:
    - value: official-harness
      source: metrics
      quote: This repository provides code for computing metric scores for radiology report evaluation.
      note: The maintainer lab's CXR-Report-Metric repository computes BLEU, BERTScore, SembScore, RadGraph-F1 and
        RadCliQ, the paper's "official implementation". GREEN and RaTEScore come from third-party repositories, and
        the end-to-end leaderboard pipeline is not published. RadGraph needs PhysioNet credentialed access.
notes: The guideline source is the site's submission page and metrics is the maintainer lab's metric repository,
  both fetched for this record. The paper (v2, 12 Aug 2026) describes eight metrics including FineRadScore; the
  live site shows a different set including CRIMSON (data.refresh). The site also hosts ReXrankCT, ReXGroundingCT
  and ReX-MLE, which are separate benchmarks and not classified here.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, evaluation_method, data.access, data.refresh, data.data_provenance, governance.submission_process,
      governance.independence_flags]
    note: Re-adjudicated against 0.9.0; the added maintainer-run, grader-from-evaluated-party and inherited-from-constituents
      terms and the clarified scoring-as-content rule settle all seven Stage 3 failures.

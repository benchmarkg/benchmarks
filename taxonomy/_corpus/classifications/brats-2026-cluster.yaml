# taxonomy/_corpus/classifications/brats-2026-cluster.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: brats-2026-cluster
corpus_item: 30
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://doi.org/10.5281/zenodo.19714728
  zenodo: https://zenodo.org/api/records/19714728
  wiki: https://repo-prod.prod.sagebase.org/repo/v1/entity/syn74274097/wiki
  proposal: https://zenodo.org/records/19714728/files/284-BraTS_2026_Cluster_of_Challenges_2026-04-22T16-36-39.pdf
facets:
  domain.primary:
    - value: medicine-health/medical-imaging-segmentation
      source: paper
      quote: (Challenge 1) Segmentation of brain metastases sub-regions in pre- and post-treatment MRI scans,
      note: Three of the five challenges (METS, PEDS, GoAT) are segmentation, a majority. The targets are clinically
        defined tumour sub-regions against expert masks, so 0.9.0's claim-over-metric rule keeps medicine-health primary
        although Dice is a vision metric; brats-2026-cluster is the example.
  domain.secondary:
    - value: vision/segmentation
      source: proposal
      quote: Ranking of methods will be based on the aggregate of rankings of Dice and NSD for segmentation and
        Sensitivity/Specificity for detection.
      note: 0.9.0 makes the vision task subdomain secondary when medical images carry clinically defined targets;
        vision/medical-imaging-cv is now reserved for a benchmark whose claim is the method, and brats-2026-cluster is
        its near miss.
    - value: vision/image-restoration-enhancement
      source: paper
      quote: (Challenge 4) Local Synthesis / Inpainting of brain tumor MRI scans,
    - value: medicine-health/medical-imaging-diagnostic
      source: paper
      quote: (Challenge 5) Classification of brain glioblastoma sub-regions in H&E-stained; pathology slides.
  capability:
    - value: perception
      source: paper
      quote: (Challenge 2) Segmentation of pediatric brain tumor sub-regions in pre- and post-treatment MRI scans,
    - value: distribution-shift-generalization
      source: proposal
      quote: We aim to simulate the clinical scenario where we develop a segmentation tool agnostic to future clinical
        applications (i.e., a tool trained on a specific disease(s) that will be applied to new ones).
      note: The source calls new tumour entities 'unseen tasks', but segmentation with the same label schema is unchanged
        and only the patient population moves; brats-2026-cluster is transfer-learning's 0.9.0 near miss.
    - value: generation-fidelity
      source: proposal
      quote: The Structural similarity Index (SSIM) is used to evaluate the quality of brain structures in synthetic
        images, i.e. to compare synthetic sequences with their physically acquired counterparts
  evaluation_method:
    - value: domain-metric
      source: proposal
      quote: Ranking of methods will be based on the aggregate of rankings of Dice and NSD for segmentation and
        Sensitivity/Specificity for detection.
    - value: statistical-fit
      source: proposal
      quote: 'We choose the three most popular metrics to evaluate image synthesis methods: - RMSE (root mean square
        error)'
      note: Inpainting is scored by RMSE, PSNR and SSIM.
    - value: classification-metric
      source: proposal
      quote: Accuracy, AUC, F1 Score, Matthews Correlation Coefficient (MCC),
      note: BraTS-Path (Challenge 5), with sensitivity and specificity; the segmentation detection arm adds lesion-wise
        F1.
    - value: composite
      source: proposal
      quote: a ranking score generated for each evaluated method, based on case-wise cumulative rankings aggregated
        across the pre-specified metrics reported above and across unseen hold-out cases
    - value: entrant-relative-ranking
      source: proposal
      quote: based on pairwise permutation testing across the ranked order of the evaluated models
      note: Final position comes from case-wise cumulative rankings across the entrants, so a team's rank depends on who
        else entered; brats-2026-cluster is the 0.9.0 example, with composite beside it.
  designed_for_subjects:
    - value: domain-specialist-model
      source: wiki
      quote: tasking participants with developing solutions for clinically relevant problems across neuro-oncology
      note: Entrants are fully automated, task-specific algorithms ("Participants must submit a fully automated
        container").
  data.access:
    - value: private-test-server
      source: proposal
      quote: The organizers will then confirm receiving the containerized method and will evaluate it in the hidden
        testing data.
      note: The ranking is computed on test data that is never released and on which the organisers run the entrants'
        containers. 0.9.0 makes withholding decide before a gate, and items that never leave the maintainer
        private-test-server. The training data (with labels) and validation inputs sit behind Synapse registration.
  data.refresh:
    - value: periodic-recompetition
      source: wiki
      quote: The 15th BraTS Cluster of Challenges at MICCAI 2026
      note: Annual editions with fresh evaluation data for most tasks; BraTS-METS reusing its 2025 dataset does not
        change the family's value (0.9.0; brats-2026-cluster is the example).
  data.data_provenance:
    - value: real-world-instrument
      source: proposal
      quote: 'The provided data describe mpMRI scans, acquired with different clinical protocols and various scanners
        from:'
    - value: expert-authored
      source: paper
      quote: To ensure accurate performance evaluation, expert neuroradiologists and neuropathologists have created
        and approved reference standard annotations for all datasets for each subject in the training, validation,
        and testing datasets.
      note: Reference labels are expert-approved refinements of annotations from many annotators ("over 200 annotators
        (students, residents, postgraduate fellows)" for METS).
  data.contamination_risk:
    - value: medium
      source: proposal
      quote: Ethics approval is not required for the treatment-naïve data, as these cases have already been publicly
        released through The Cancer Imaging Archive
      note: Test labels are hidden and evaluation is by container, which works against leakage. But part of the
        pediatric data is already public on TCIA, and BraTS-METS reuses the 2025 dataset ("we are utilizing the
        dataset used in 2025"). A route is plausible and unevidenced.
  data.ceiling_anchor_type:
    - value: noise-ceiling
      source: paper
      quote: AI models reached the threshold of human expert inter-/intra-rater variability, as determined in an
        extensive re-annotation study for BraTS 2025 to quantify expert variance.
      note: The anchor is the variability of the expert annotations that serve as ground truth, which 0.9.0 separates
        from expert task performance (expert-average); brats-2026-cluster is the example.
  lifecycle:
    - value: active
      source: wiki
      quote: 'October 1, 2026; 13:30 – 18:00; Room: Curie B (Upper Floor)'
      note: The 2026 edition is running; the MICCAI satellite event with rankings is scheduled three days after
        classification.
  activity:
    - value: results-pending
      source: proposal
      quote: '31 July 2026: Submission deadline for Paper and Containerized method'
      note: The deadline has passed, the organisers are running the containers on hidden test data, and rankings are due
        at the MICCAI event on 1 October 2026.
  governance.maintainer_type:
    - value: conference-workshop
      source: paper
      quote: 'Specifically, the BraTS 2026 Cluster of Challenges will encompass 5 MICCAI challenges, designed to
        benchmark and advance the current state-of-the-art algorithms for addressing:'
      note: A recurring MICCAI challenge cluster whose sub-challenges are run by organising teams that change between
        editions. 0.9.0's conference-workshop override applies even though one lab has led the series since 2012, and
        no source states a legal form that consortium would need.
  governance.submission_process:
    - value: containerized-algorithm-submission
      source: proposal
      quote: Participants must submit a fully automated container that no user interaction is required for successful
        execution.
    - value: publication-gated
      source: proposal
      quote: The containerized method will be evaluated on the hidden testing data by the organizers, only for participants
        with submitted short papers.
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: proposal
      quote: The organizers will then confirm receiving the containerized method and will evaluate it in the hidden
        testing data.
    - value: maintainer-competes-on-own-benchmark
      source: proposal
      quote: May participate but organizers and their immediate groups cannot be 1) eligible for awards, 2) announced
        as the winners of the challenge, or 3) included in the announced formal rankings.
      note: Organizers' groups may submit and are evaluated, but are excluded from awards and formal rankings.
  execution.compute_tier:
    - value: provided-allocation
      source: proposal
      quote: during the validation and final testing/ranking phase using the organizers' infrastructure (i.e., Synapse.org
        - SAGE Bionetworks)
      note: Training runs on the participants' own infrastructure; inference for validation and ranking runs on
        the organizers'.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: proposal
      quote: The organizers will then confirm receiving the containerized method and will evaluate it in the hidden
        testing data.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: proposal
      quote: The organizers will then confirm receiving the containerized method and will evaluate it in the hidden
        testing data.
  execution.harness_availability:
    - value: official-harness
      source: proposal
      quote: The implementation and references to the pre-processing tools, exact evaluation metrics, and the ranking
        code used during the whole challenge's lifecycle will be made available through the challenge’s website
      note: Announced in the proposal; the evaluation code was not itself fetched or verified.
notes: 'The corpus defines the entry as the whole 2026 cluster (five MICCAI challenges: METS, PEDS, GoAT, Inpainting,
  Path), which is classified as one family; per-challenge metrics and rules come from the 100-page structured proposal
  PDF in the Zenodo record (md5 8414544b8c9e0e89a11d55eb53879da9, fetched for this record). The home key (Synapse
  portal) was omitted because it renders only a loading message. Industry-sponsored prizes are anticipated but unconfirmed
  ("Formal confirmation can only be provided after the acceptance of the challenge"), so prize-sponsored-by-industry
  is not tagged.'
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, domain.secondary, capability, evaluation_method, data.access, data.refresh,
      data.ceiling_anchor_type, activity, governance.maintainer_type]
    note: Re-adjudicated against 0.9.0; the claim-over-metric and withholding precedence rules decide the domain and
      access.

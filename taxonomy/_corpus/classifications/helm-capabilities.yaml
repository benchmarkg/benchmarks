# taxonomy/_corpus/classifications/helm-capabilities.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: helm-capabilities
corpus_item: 90
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  home: https://crfm.stanford.edu/2025/03/20/helm-capabilities.html
  release: https://storage.googleapis.com/crfm-helm-public/capabilities/benchmark_output/releases/v1.15.0/summary.json
  schema: https://storage.googleapis.com/crfm-helm-public/capabilities/benchmark_output/releases/v1.15.0/schema.json
  maint: https://crfm-helm.readthedocs.io/en/latest/maintenance_mode/
  repo: https://github.com/stanford-crfm/helm
facets:
  domain.primary:
    - value: general-intelligence/agi-composite-suites
      source: home
      quote: Building on the HELM framework, we introduce HELM Capabilities to capture our latest thinking on the
        evaluation of general capabilities.
      note: Five heterogeneous scenarios (knowledge, reasoning, instruction following, dialogue and competition
        mathematics) are aggregated into one mean score, which is what the subdomain defines. It differs from
        holistic-agent-leaderboard-hal, which publishes no aggregate.
  domain.secondary:
    - value: mathematics/competition-math
      source: home
      quote: Omni-MATH (Mathematical Reasoning) challenges models with high-level mathematical problem-solving tasks
        comparable to international mathematical Olympiad competitions
    - value: language/generation
      source: home
      quote: to score a model’s output against a checklist, and takes the average for the final scoring
      note: WildBench's free-form responses are scored against checklist criteria. IFEval's free-form responses are
        checked against verifiable instructions.
    - value: language/dialogue
      source: home
      quote: WildBench (Dialogue) assesses the models’ ability to engage in dynamic and contextually-aware conversations
      note: The WildBench scenario's claimed capability, dialogue, has no capability term; ADR-0020 rules that this
        domain leaf expresses it.
  capability:
    - value: knowledge-recall
      source: home
      quote: MMLU-Pro (General Knowledge) extends MMLU to assess models’ knowledge across diverse academic and
        professional domains
      note: GPQA's claimed 'Reasoning' names no reasoning form, and ADR-0020 rejects a general reasoning term, so it
        is recorded here; WildBench's 'Dialogue' is recorded as the domain leaf language/dialogue.
    - value: instruction-following
      source: home
      quote: IFEval (Instruction Following) tests how well models understand and execute user instructions using
        verifiable instructions
    - value: quantitative-reasoning
      source: home
      quote: Omni-MATH (Mathematical Reasoning) challenges models with high-level mathematical problem-solving tasks
  evaluation_method:
    - value: multiple-choice
      source: home
      quote: 'MMLU-Pro: Multiple Choice Accuracy.'
      note: MMLU-Pro has ten options (10% chance) and GPQA four (25%).
    - value: constraint-check
      source: home
      quote: 'IFEval: evaluator logic from the official implementation, which identifies instruction types and verifies
        instruction fulfillment.'
    - value: rubric-graded
      source: home
      quote: to score a model’s output against a checklist, and takes the average for the final scoring
      note: The WildBench grader is a jury of GPT-4o (20240513), Llama 3.1 405B Instruct Turbo and Claude 3.5 Sonnet
        (20241022), and the 1-10 WB-Score is rescaled to 0-1.
    - value: model-graded-judge
      source: home
      quote: 'Omni-MATH: an LLM-as-a-judge annotator that compares the model prediction against the gold answer to
        determine whether they are equivalent.'
      note: The same three-model jury, averaged. HELM used the HELM Safety judge prompt rather than Omni-MATH's own.
    - value: composite
      source: home
      quote: The models are ranked based on the mean score, which aggregates metrics across scenarios with the WB score
        (1-10) rescaled to 0-1.
  designed_for_subjects:
    - value: instruction-tuned-model
      source: home
      quote: we evaluate an instance using zero-shot Chain-of-Thought prompting
    - value: hosted-inference-endpoint
      source: home
      quote: we used the Turbo variants of the models, which are models that have been quantized using Together AI’s
        proprietary process
      note: Closed models were called through each provider's official API, and open models through Together AI's
        API, so the serving path is part of what each row measures.
  data.access:
    - value: fully-open
      source: home
      quote: For full transparency, the raw prompts can be viewed on the HELM Capabilities leaderboard.
      note: All five scenarios are public datasets. GPQA's condition ('We request that you do not reveal examples
        from this dataset in plain text or images online') is a no-reveal request, which 0.9.0 says is an
        anti-contamination device and not a gate (gpqa-diamond is gated-registration's near miss).
  data.refresh:
    - value: versioned-releases
      source: release
      quote: '"release": "v1.15.0"'
      note: Sixteen numbered releases, v1.0.0 to v1.15.0, the last dated 2025-11-24. Releases add models. The five
        scenarios are unchanged in v1.15.0's schema.
  data.data_provenance:
    - value: inherited-from-constituents
      source: home
      quote: For each capability, we selected a scenario out of the available scenarios in the existing literature
      note: Each scenario is reused and downsampled to 1,000 instances, with its own paper documenting its provenance
        (helm-capabilities is the term's example).
  data.contamination_risk:
    - value: medium
      source: home
      quote: to reduce the risk of leakage into foundation model training corpora
      note: This is GPQA's own condition, quoted in the post. All five scenarios are public static sets released
        between November 2023 and October 2024, and no source assesses leakage.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: home
      quote: The models are ranked based on the mean score, which aggregates metrics across scenarios with the WB score
        (1-10) rescaled to 0-1.
      note: The headline mean is bounded at 1, and the sources report no human or measured anchor on any scenario.
        0.9.0's none-known excludes a headline metric with a defined bound at its optimum.
  lifecycle:
    - value: mature
      source: maint
      quote: HELM entered maintenance mode on June 1, 2026.
      note: A maintainer freeze of the result record while the instrument stays available, which ADR-0019 puts in
        mature, with the ending recorded in activity (helm-capabilities is mature's example).
  activity:
    - value: closed
      source: maint
      quote: no new evaluations will be added to the HELM leaderboards
  governance.maintainer_type:
    - value: academic-lab
      source: repo
      quote: Center for Research on Foundation Models (CRFM) at Stanford
      note: HELM is now kept "by volunteer maintainers on a best-effort basis".
  governance.submission_process:
    - value: maintainer-run
      source: home
      quote: We chose these models as they are positioned as the flagship models from mainstream model providers
      note: CRFM chose the models and ran them through its own pipeline and judges; contributed model code is not a
        result (helm-capabilities is maintainer-run's example).
  governance.independence_flags:
    - value: funded-by-evaluated-party
      source: home
      quote: 'We would also like to acknowledge the following companies for providing model APIs that were instrumental
        in this work: Together AI, OpenAI, Google, Anthropic, Amazon, and Writer.'
      note: The cash funder is "the HAI Industrial Affiliates Program", whose members the post does not list. 0.9.0
        counts donated API access from an evaluated party as funding (helm-capabilities is the flag's example).
    - value: grader-from-evaluated-party
      source: home
      quote: 'To reduce variance, we used three LLM-as-a-judge models: GPT-4o (20240513), LLaMA 3.1 405B Instruct Turbo,
        and Claude 3.5 Sonnet (20241022).'
      note: Two jurors are ranked models in the same snapshot and the third is an earlier snapshot of one, so two of
        the five scenarios are partly graded by the systems being ranked.
  execution.compute_tier:
    - value: api-credits-only
      source: home
      quote: For models from OpenAI, Anthropic, Google, Amazon, and Writer, we used their official API endpoint.
      note: The open models ran through the Together AI API, and the judges are API calls too.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: the results can be fully reproduced using the HELM framework
  execution.reproducibility_blockers:
    - value: null
      failure: 2026-09-28-helm-capabilities-007
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: We maintain official leaderboards with results from evaluating recent models on notable benchmarks using
        this framework.
notes: The corpus flags that the primary source is the maintainers' announcement post, not a paper, and that the
  leaderboard page is a JavaScript application. The leaderboard's data was read instead from the release JSON the
  application loads (summary.json and schema.json for release v1.15.0). The post and the corpus's primary-paper link
  are the same URL, so it is cited once as home. The corpus also flags overlap with other entries. MMLU-Pro and GPQA
  are corpus entries in their own right, and under 02 S11 rule 5 they remain their own families, so this record
  classifies the curated suite, its aggregate and its governance. HELM's maintenance mode (June 2026) freezes this
  leaderboard, as it does MedHELM's.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.secondary, capability, data.access, data.data_provenance, data.ceiling_anchor_type,
      lifecycle, governance.submission_process, governance.independence_flags]
    note: Re-adjudicated against 0.9.0; the no-reveal rule, the metric bound and the maintainer-run and grader terms apply.

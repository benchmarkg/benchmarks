# taxonomy/_corpus/classifications/scannet.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: scannet
corpus_item: 61
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2308.11417
  abs: https://arxiv.org/abs/2308.11417
  home: https://github.com/scannetpp/scannetpp
  site: https://scannetpp.mlsg.cit.tum.de/scannetpp/
  docs: https://scannetpp.mlsg.cit.tum.de/scannetpp/benchmark/docs
  nvs: https://scannetpp.mlsg.cit.tum.de/scannetpp/benchmark/nvs
  semseg: https://scannetpp.mlsg.cit.tum.de/scannetpp/benchmark/semseg
  changelog: https://scannetpp.mlsg.cit.tum.de/scannetpp/changelog
  terms: https://scannetpp.mlsg.cit.tum.de/scannetpp/static/scannetpp-terms-of-use.pdf
  cvpr2026: https://scannetpp.mlsg.cit.tum.de/scannetpp/cvpr2026
facets:
  domain.primary:
    - value: vision/novel-view-synthesis
      source: abs
      quote: ScanNet++ enables a new real-world benchmark for novel view synthesis, both from high-quality RGB capture,
        and importantly also from commodity-level images, in addition to a new benchmark for 3D semantic scene understanding
      note: Three of the five server leaderboards are NVS (DSLR fisheye, DSLR undistorted, iPhone); the other two are 3D
        semantic and instance segmentation.
      failure: 2026-09-28-scannet-001
  domain.secondary:
    - value: vision/segmentation
      source: semseg
      quote: Submissions must provide a semantic label for each vertex of the 3D mesh.
      note: 3D semantic segmentation (Top-1/Top-3 IoU) and 3D instance segmentation (AP) on mesh vertices.
      failure: 2026-09-28-scannet-002
  capability:
    - value: generation-fidelity
      source: nvs
      quote: We evaluate the similarity beween the ground truth and generated RGB images.
      note: The NVS tracks score rendered views against held-out DSLR photographs.
    - value: perception
      source: semseg
      quote: This task involves predicting a semantic labeling of a 3D scan mesh which is obtained from the laser scanner
        point cloud.
      note: The semantic and instance tracks score labels recovered from the captured scene, as capabilities.yaml's own
        scannetpp example reads it.
  evaluation_method:
    - value: domain-metric
      source: semseg
      quote: We rank methods similar to the ScanNet intersection-over-union metric (IoU).
      note: NVS reports PSNR and SSIM, the semantic track IoU, the instance track AP25/AP50/AP. The three NVS metrics
        are reported side by side and not combined, so composite is not tagged.
    - value: model-derived-metric
      source: nvs
      quote: learned perceptual image patch similarity (LPIPS)
      note: LPIPS is computed by a pretrained network; the sources do not name its backbone or version.
  designed_for_subjects:
    - value: domain-specialist-model
      source: home
      quote: This table presents the **Top-1 IoU** and **Top-3 IoU** results for different models on validation and test
        sets.
      note: Supervised 3D segmentation networks (PTv3, OACNN, SPFormer) trained on the ScanNet++ train split.
      failure: 2026-09-28-scannet-003
    - value: generative-media-model
      source: docs
      quote: A submission must include algorithm-generated images
      note: The NVS tracks score images the entrant renders (NeRF, 3D Gaussian Splatting, Zip-NeRF on the leaderboard).
  data.access:
    - value: train-open-test-held-out
      source: docs
      quote: Benchmark results are evaluated on the hidden test sets, which are not publicly available.
      failure: 2026-09-28-scannet-004
  data.refresh:
    - value: versioned-releases
      source: changelog
      quote: The benchmark is currently evaluated on the v2 version of the dataset.
      note: v1 (23 November 2023, 380 scenes) and v2 (20 December 2024, 1006 scenes); the NVS and semantic test splits
        were kept, with improved annotations and poses, and an NVS-small set was added.
  data.data_provenance:
    - value: real-world-instrument
      source: abs
      quote: Each scene is captured with a high-end laser scanner at sub-millimeter resolution, along with registered
        33-megapixel images from a DSLR camera, and RGB-D streams from an iPhone.
      note: The semantic labels were applied by annotators in a web tool ('The segments are annotated in a 3D web interface
        with free-text instance labels'); the sources do not say who the annotators were, so no authorship term is tagged.
  data.contamination_risk:
    - value: low
      source: docs
      quote: Benchmark results are evaluated on the hidden test sets, which are not publicly available.
      note: NVS ground-truth test images and semantic test labels are withheld, and entrants get four submissions per
        task at least 24 hours apart. The data itself sits behind an approval gate. No source assesses contamination.
  data.ceiling_anchor_type:
    - value: null
      source: nvs
      quote: Our evaluation metrics are peak signal-to-noise ratio (PSNR), structural similarity index measure (SSIM),
        and learned perceptual image patch similarity (LPIPS).
      failure: 2026-09-28-scannet-005
  lifecycle:
    - value: active
      source: cvpr2026
      quote: 'NVS on DSLR: PIM-NeRF2.0 (Zizhuang Wei)'
      note: The CVPR 2026 workshop challenge (3 June 2026) presented winners for NVS on DSLR, NVS on iPhone and 3D semantics,
        and the iPhone NVS benchmark was added on 13 October 2025.
  activity:
    - value: leaderboard-live-no-round
      source: docs
      quote: It may take upto 24 hours after a valid submission for the results to appear on the public leaderboard.
      note: The CVPR 2026 challenge round closed ('submit your result before May 22'); the standing benchmark server keeps
        its submission policy and leaderboards. No 2027 round is announced on the fetched pages.
  governance.maintainer_type:
    - value: academic-lab
      source: terms
      quote: receive permission to use the ScanNet++ database (the "Database") at the Technical University of Munich.
      note: All four paper authors are at TUM (the Niessner and Dai groups). The CVPR 2026 challenge adds one Meta organiser
        (Peter Kontschieder).
  governance.submission_process:
    - value: held-out-server
      source: docs
      quote: Benchmark results are evaluated on the hidden test sets, which are not publicly available.
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: paper
      quote: Following ScanNet [9], we maintain a hidden test set and build an online public evaluation website.
      note: The leaderboard entries visible on the fetched pages are external groups (Huawei, Horizon Robotics, academic
        labs). Sponsorship of the challenge is not stated.
  execution.compute_tier:
    - value: null
      source: home
      quote: (Requires Pytorch3D and a GPU)
      failure: 2026-09-28-scannet-006
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: docs
      quote: Benchmark results are evaluated on the hidden test sets, which are not publicly available.
      note: For test-set scores. Validation-set scores can be reproduced with the public evaluation scripts.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: docs
      quote: Benchmark results are evaluated on the hidden test sets, which are not publicly available.
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: The evaluation script here is the same that runs on the benchmark server.
notes: The corpus URL is the GitHub toolkit because the official site returned HTTP 502 on 2026-09-23. It answered on
  2026-09-28 (scannetpp.mlsg.cit.tum.de), and its home, submission, NVS, semantic, changelog, terms-of-use and CVPR 2026
  workshop pages were fetched for this record. The terms of use name the Technical University of Munich, which settles
  the corpus flag 'maintainer not stated beyond repo org'. The entry is the whole benchmark family (DSLR NVS, iPhone
  NVS, 3D semantic and 3D instance segmentation) on dataset v2.

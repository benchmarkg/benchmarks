# taxonomy/_corpus/classifications/wmt25-general-mt-shared-task.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: wmt25-general-mt-shared-task
corpus_item: 2
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://aclanthology.org/2025.wmt-1.22.pdf
  home: https://www2.statmt.org/wmt25/translation-task.html
  wmt26: https://www2.statmt.org/wmt26/translation-task.html
facets:
  domain.primary:
    - value: language/translation
      source: home
      quote: Formerly known as News translation task of the WMT focusses on evaluation of general capabilities
        of machine translation (MT) systems.
  domain.secondary:
    - value: language/multilingual
      source: home
      quote: Multilingual subtask - develop a system that can translate into multiple languages simultaneously.
    - value: language/low-resource-languages
      source: home
      quote: To investigate the translation of low-resource, morphologically rich languages
      note: English-Bhojpuri and English-Maasai are new low-resource directions. Failure 001 covers the speech
        and social domains, for which no secondary could be assigned.
      failure: 2026-09-28-wmt25-general-mt-shared-task-001
  capability:
    - value: generation-fidelity
      source: paper
      quote: We evaluated system outputs with professional annotators using the Error Span Annotation (ESA)
        protocol
      failure: 2026-09-28-wmt25-general-mt-shared-task-002
  evaluation_method:
    - value: human-expert-eval
      source: paper
      quote: We evaluated system outputs with professional annotators using the Error Span Annotation (ESA)
        protocol, except for two language pairs, for which we used Mul- tidimensional Quality Metrics (MQM)
        instead.
      note: The official ranking is the human score. Failure 005 covers the prospective-resolution boundary.
      failure: 2026-09-28-wmt25-general-mt-shared-task-005
    - value: human-crowd-eval
      source: paper
      quote: 'Toloka AI paid expert crowd: Bilingual native target-language speakers who were high-performing
        on the platform.'
      failure: 2026-09-28-wmt25-general-mt-shared-task-003
    - value: model-graded-judge
      source: paper
      quote: We use GEMBA-ESA (Kocmi and Federmann, 2023b) with two independent judges
      note: GEMBA-ESA is part of AutoRank, which selects the systems that reach human evaluation and is
        published beside the human score. The judges are GPT-4.1 and Command A.
    - value: model-derived-metric
      source: paper
      quote: metrics trained to approximate human quality judgments with references
      failure: 2026-09-28-wmt25-general-mt-shared-task-004
  designed_for_subjects:
    - value: instruction-tuned-model
      source: home
      quote: Providing preamble prompt for each domain containing translation brief of expected translation
        output useful with instruction LLMs
    - value: full-product-pipeline
      source: paper
      quote: translations we collected from large language models (LLMs) and popular online translation providers
      note: Online translation services enter anonymised as ONLINE-B, ONLINE-G and ONLINE-W, and their
        components are not documented.
    - value: human-expert
      source: paper
      quote: Human references are in the winning cluster for only six out of 15 language pairs
      note: Professional reference translations are ranked as an entrant ("Human") in every human-evaluated
        pair.
    - value: domain-specialist-model
      source: paper
      quote: This generic setup may disadvantage systems tuned for specific MT in- structions, such as TowerLLM
        or EuroLLM
      failure: 2026-09-28-wmt25-general-mt-shared-task-006
  data.access:
    - value: fully-open
      source: paper
      quote: All submissions to the General MT Task, along with sources, references, and human judgments, are
        available in the dedicated GitHub repository.
      note: The release follows the campaign. The home page limits the data to research use ("can be freely
        used for research purposes").
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: Participants will use their systems to translate a testset of unseen documents.
      note: Each annual edition collects a fresh test set. WMT25 is the 20th iteration of the conference, and
        WMT26 followed in 2026.
  data.data_provenance:
    - value: web-scraped
      source: paper
      quote: The social domain data was sourced using the Mastodon Social API.
    - value: model-generated
      source: home
      quote: The speech domain is going to be released with the original video together with machine generated
        transcript.
    - value: expert-authored
      source: paper
      quote: The test sets were translated by professional transla- tion agencies according to the brief in
        Appendix B.
      note: This covers the reference translations, not the source texts.
  data.contamination_risk:
    - value: low
      source: home
      quote: Participants will use their systems to translate a testset of unseen documents.
      note: This holds for the edition as run in June and July 2025. News was collected from a recent month,
        and references did not exist at submission. Sources, references and outputs have been public since
        release, so any later use of this test set has a different posture.
  data.ceiling_anchor_type:
    - value: null
      source: paper
      quote: Human references are in the winning cluster for only six out of 15 language pairs
      failure: 2026-09-28-wmt25-general-mt-shared-task-007
  lifecycle:
    - value: superseded
      source: wmt26
      quote: ELEVENTH CONFERENCE ON MACHINE TRANSLATION (WMT26)
      failure: 2026-09-28-wmt25-general-mt-shared-task-008
  activity:
    - value: closed
      source: home
      quote: Translation submission deadline 3rd July 2025
      note: This is the WMT25 edition the corpus names. The family is mid-cycle. WMT26 published its
        submissions and references on 2026-07-27 ("We published the submissions and references"), ahead of its
        October 2026 conference.
  governance.maintainer_type:
    - value: conference-workshop
      source: home
      quote: TENTH CONFERENCE ON MACHINE TRANSLATION (WMT25)
      note: The organiser list changes with each edition and spans academia and industry (Charles University,
        Cohere, Google, Microsoft and others).
  governance.submission_process:
    - value: publication-gated
      source: home
      quote: Each participant is required to submit submission paper
    - value: held-out-server
      source: home
      quote: You won’t get any feedback on your system in OCELoT, human references do not exist at the time of
        submission.
      failure: 2026-09-28-wmt25-general-mt-shared-task-009
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: C.5 CommandA-WMT (Kocmi et al., 2025a) We built our system on top of Command-A
      note: Tom Kocmi, affiliated with Cohere, is the first organiser listed on the task page. Cohere also
        sponsors the task, supplies the Italian annotators and one of the two AutoRank judges.
      failure: 2026-09-28-wmt25-general-mt-shared-task-010
    - value: funded-by-evaluated-party
      source: home
      quote: This task would not have been possible without the sponsorship of testsets translations and human
        evaluation done with our partners.
      note: The partners listed include Cohere, Google and Microsoft, and Cohere (CommandA) and Google
        (Gemini-2.5-Pro) systems are ranked in the results tables.
  execution.compute_tier:
    - value: human-panel
      source: paper
      quote: All annotators were paid a fair wage in their respective countries.
      note: The cost that defines a run of this benchmark is the organisers' human evaluation. Each entrant's
        own inference cost varies with the system and belongs to that role.
  execution.reproducibility_tier:
    - value: requires-human-raters
      source: home
      quote: Systems are evaluated with humans.
  execution.reproducibility_blockers:
    - value: human-raters
      source: home
      quote: Primary systems (for which abstract papers have been submitted to SoftConf) will be included in the
        human evaluation.
  execution.harness_availability:
    - value: reference-implementation-only
      source: paper
      quote: 'The code for collecting translations is available at: github.com/wmt-conference/wmt-collect-translations'
      note: Code is published for collecting translations, verifying submissions (wmt_gen_mt_tool.py) and
        computing the automatic metrics. The official score is a human evaluation, which no harness produces.
notes: Classified as the WMT25 edition, following the corpus name and flags. The shared task is one family
  across its annual editions, which the single-valued lifecycle field cannot express (failure 008). The social
  and speech domains give human raters screenshots and video as the source, which puts part of the task across
  modalities (failure 001).

# taxonomy/_corpus/classifications/agentdojo.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: agentdojo
corpus_item: 45
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2406.13352
  abs: https://arxiv.org/abs/2406.13352
  home: https://agentdojo.spylab.ai/
  repo: https://github.com/ethz-spylab/agentdojo
  results: https://agentdojo.spylab.ai/results/
  changelog: https://agentdojo.spylab.ai/changelog/
  releases: https://github.com/ethz-spylab/agentdojo/releases
facets:
  domain.primary:
    - value: safety-alignment/prompt-injection
      source: abs
      quote: an evaluation framework for agents that execute tools over untrusted data
      note: Utility and attack success are reported side by side on the same tool-use tasks; under 0.9.0 the benchmark's
        claim decides, and security as the claim makes prompt-injection primary with tool-api-calling secondary (agentdojo
        is the example).
  domain.secondary:
    - value: agents-tooluse/tool-api-calling
      source: abs
      quote: We populate the environment with 97 realistic tasks (e.g., managing an email client, navigating an
        e-banking website
  capability:
    - value: adversarial-robustness
      source: paper
      quote: our attacks succeed against the best performing agents in less than 25% of cases
      note: Attacks are injected into tool outputs, and the score is how often the agent still resists.
    - value: tool-use
      source: paper
      quote: tasks requiring chaining up to 18 different calls to both general-purpose and specialized tools
      note: Benign utility is scored on whether the tool calls reached the goal state.
  evaluation_method:
    - value: adversarial-red-team
      source: paper
      quote: we were mainly concerned with the targeted attack success rate
      note: The results page reports utility, utility under attack and targeted ASR for each model, defense and
        attack.
    - value: environment-state-check
      source: paper
      quote: a formal utility checks computed over the environment state
      note: Utility and security functions inspect the mutations an agent episode left in the inbox, calendar, files or
        bank account. Where the checked state is the attacker's goal, 0.9.0 tags adversarial-red-team beside it for the
        attack-success aggregate.
  designed_for_subjects:
    - value: agent-scaffold
      source: home
      quote: Check out the documentation on how to create your own pipeline.
      note: For custom pipelines, which the documentation invites.
    - value: model-in-benchmark-harness
      source: results
      quote: Please run your attacks/models/defenses on the benchmark within a fork of the repository, and open a PR
        with your results.
      note: Every results row is a provider model run through AgentDojo's own tool-calling pipeline, varied only by a
        defense and an attack, which 0.9.0 names model-in-benchmark-harness.
    - value: attack-or-intervention-method
      source: results
      quote: Please run your attacks/models/defenses on the benchmark within a fork of the repository, and open a PR
        with your results.
      note: Attacks and defenses are entrants in their own right, each applied to the same target models and scored by
        the attack success rate and utility it produces.
  data.access:
    - value: fully-open
      source: home
      quote: pip install agentdojo
      note: The task suites, injection tasks and their utility and security functions ship in the open-source
        package.
  data.refresh:
    - value: versioned-releases
      source: changelog
      quote: Fix some issues in Benchmark v1.2
      note: The task suites are versioned separately from the package (v1, v1.1, v1.2, and "V1.2.2 tasks" in the
        October 2025 release). The paper's datacard gives the collection cadence as "Static", which the later
        releases contradict.
  data.data_provenance:
    - value: expert-authored
      source: paper
      quote: The tasks and the some of the dummy data were created by the authors with their creativity.
      note: The authors are security researchers writing their own tasks, recorded as expert-authored as in
        minif2f-minif2f-dafny.
    - value: model-generated
      source: paper
      quote: We generate the dummy data both manually or assisted by GPT-4o and Claude 3 Opus
      note: The environment data (emails, calendars, files), inspected by hand afterwards.
  data.contamination_risk:
    - value: unknown
      note: The tasks have been public since June 2024, and no source assesses contamination. The paper frames
        AgentDojo as extensible because attacks and defenses evolve, not because of training-data leakage.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: we were mainly concerned with the targeted attack success rate
      note: The headline targeted attack success rate is bounded at 0% (and utility at 100%). Every user task carries a
        ground-truth sequence of function calls, but no source reports running it as an oracle or any human score. Under
        0.9.0 a bounded headline with no measured anchor is theoretical-maximum.
  lifecycle:
    - value: active
      source: releases
      quote: Adding result for Llama 3.3 and Meta SecAlign 70B
      note: This is in release v0.1.35, published 2025-10-27. The results page's newest dated row is 2025-02-24.
  activity:
    - value: accepting-submissions
      source: results
      quote: open a PR with your results. We will merge your PR and your results will be displayed here.
      note: The page says it "is not a leaderboard because we did not attack all models with all attacks and
        defenses".
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: Edoardo Debenedetti, ETH Zurich
      note: The maintainer is SPY Lab at ETH Zurich (ethz-spylab). Three of the six authors are also at Invariant
        Labs, whose trace explorer hosts the result traces.
  governance.submission_process:
    - value: self-reported
      source: results
      quote: Please run your attacks/models/defenses on the benchmark within a fork of the repository, and open a PR
        with your results.
    - value: open-source-gated
      source: results
      quote: an implementation of the attack/defense/model in the agentdojo repository
      note: A results PR must contribute the implementation to the maintainers' repository; agentdojo is the 0.9.0 example.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: Our simple tool filtering defense is particularly effective, lowering the attack success rate to 7.5%.
      note: The maintainers' own tool-filter defense and baseline attacks appear as rows of the results table.
  execution.compute_tier:
    - value: api-credits-only
      source: paper
      quote: running the full suite of 629 security test cases on GPT-4o costs around US$35
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: To run the benchmark, you first need to install the package.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: We release with the code on GitHub all models outputs and conversations as JSON files
      note: The agentdojo package's benchmark script produces the official utility and ASR numbers.
notes: The corpus files AgentDojo under agents-tooluse, and the record puts it in safety-alignment, which 0.9.0 makes
  its prompt-injection example.
  AgentDojo is a framework as well as a benchmark ("How can I use the Dojo to create my own benchmark?"), and the
  record classifies the task suites it ships.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, evaluation_method, designed_for_subjects, data.ceiling_anchor_type,
      governance.submission_process]
    note: Re-adjudicated against 0.9.0; environment-state-check, model-in-benchmark-harness, open-source-gated and the
      prompt-injection tie-break settle all four Stage 3 failures.

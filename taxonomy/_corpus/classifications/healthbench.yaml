# taxonomy/_corpus/classifications/healthbench.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: healthbench
corpus_item: 27
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2505.08775
  abs: https://arxiv.org/abs/2505.08775
  home: https://github.com/openai/simple-evals
  readme: https://raw.githubusercontent.com/openai/simple-evals/main/healthbench_eval.py
facets:
  domain.primary:
    - value: null
      source: paper
      quote: Given a conversation, the task for an LLM is to respond to the last user message.
      failure: 2026-09-28-healthbench-012
  domain.secondary:
    - value: medicine-health/medical-safety
      source: abs
      quote: We present HealthBench, an open-source benchmark measuring the performance and safety of large language
        models in healthcare.
    - value: medicine-health/diagnosis-triage
      source: paper
      quote: This theme evaluates one of the most immediate and high-stakes ways language models can impact human
        health—recognizing emergencies and steering people toward care if needed.
  capability:
    - value: factual-precision
      source: paper
      quote: Rubric criteria can range from specific facts that should be mentioned in the response (e.g., what
        medications to take and at what dosage)
      note: communication is not tagged; healthbench is its 0.9.0 near miss, because a model grader judges the message
        itself and no recipient takes part.
    - value: instruction-following
      source: paper
      quote: This axis evaluates whether the model adheres to instructions while still prioritizing safety.
    - value: honesty
      source: paper
      quote: This theme evaluates whether models can recognize when uncertainty is present and respond with language
        reflecting that uncertainty if so.
    - value: context-integration
      source: paper
      quote: This axis captures whether the model appropriately responds to contextual cues that are present (e.g.,
        user role, geographic setting, resources the user says they have), and whether it seeks clarification when
        needed.
    - value: reliability-consistency
      source: paper
      quote: we study the worst-at-kk performance on HealthBench—in other words, the worst score of kk model calls.
      note: Worst-at-k over repeated samples of the same example, a pass^k relative; reported as an analysis, not
        as the headline score. ("kk" is the source text's MathML rendering of k.)
  evaluation_method:
    - value: rubric-graded
      source: paper
      quote: We then get the total points for a given example by summing the point values for criteria met, including
        points for positive criteria and penalties for negative points.
      note: human-expert-eval is not tagged; healthbench is its 0.9.0 near miss, because physicians only meta-evaluated
        the model grader.
    - value: model-graded-judge
      source: paper
      quote: To score a model response, a model-based grader goes through each rubric criterion independently and
        determines whether the response meets that criterion.
      note: 'Judge model and version: gpt-4.1-2025-04-14 in the reference implementation.'
  designed_for_subjects:
    - value: instruction-tuned-model
      source: paper
      quote: Given a conversation, the task for an LLM is to respond to the last user message.
      note: Built for and reported on general frontier assistants; healthbench is domain-specialist-model's 0.9.0 near
        miss.
  data.access:
    - value: fully-open
      source: paper
      quote: We release HealthBench data and code via OpenAI’s simple-evals repository
      note: The maintainers also keep "a small private held-out set of identically distributed HealthBench examples"
        to detect training on the benchmark; it is not the scored set.
  data.refresh:
    - value: null
      failure: 2026-09-28-healthbench-005
  data.data_provenance:
    - value: model-generated
      source: paper
      quote: Most conversations in HealthBench were synthetically generated.
    - value: expert-authored
      source: paper
      quote: The vast majority of the 48,562 unique rubric criteria in HealthBench were written specifically by
        a physician for that example.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: We request that you do not reveal examples from this dataset in plain text or images online, to help
        prevent leakage into foundation model training corpora
      note: The set is public and the maintainers treat leakage as a live route (canary string, private held-out
        set), with no evidence of contamination reported.
  data.ceiling_anchor_type:
    - value: expert-average
      source: paper
      quote: we asked physicians to write responses to HealthBench examples with and without reference responses
        from models, and found that models outperformed the unassisted expert baseline
      note: Physicians' responses were graded like model responses. 0.9.0 keeps an exceeded expert anchor as the anchor,
        with headroom computed unclamped; healthbench is the example.
  lifecycle:
    - value: mature
      source: home
      quote: The repo will continue to host reference implementations for **HealthBench**, **BrowseComp**, and
        **SimpleQA**.
      note: The maintainer stopped adding results in July 2025 while it keeps hosting the benchmark, which ADR-0019's
        mature covers, with the ending recorded in activity.
  activity:
    - value: closed
      source: home
      quote: '`simple-evals` will no longer be updated for new models or benchmark results.'
      note: A formal stop to adding results is closed under ADR-0019, not no-submission-channel.
  governance.maintainer_type:
    - value: industry-lab
      source: home
      quote: We are open sourcing it so we can be transparent about the accuracy numbers we're publishing alongside
        our latest models.
  governance.submission_process:
    - value: maintainer-run
      source: paper
      quote: Using HealthBench, we evaluate a range of state-of-the-art LLMs.
      note: OpenAI chose and ran every reported model, competitors' included, and published the results in the paper
        and the simple-evals results table; nobody submits.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: In recent months, OpenAI’s frontier models have improved by 28% on HealthBench.
    - value: grader-from-evaluated-party
      source: readme
      quote: grading_sampler = ChatCompletionSampler( model="gpt-4.1-2025-04-14",
      note: The grader is the maintainer's own model, and it scores Claude, Gemini, Grok and Llama responses as well as
        OpenAI's.
  execution.compute_tier:
    - value: api-credits-only
      source: readme
      quote: grading_sampler = ChatCompletionSampler( model="gpt-4.1-2025-04-14",
      note: Every run pays for grader calls to a hosted OpenAI model on top of sampling the model under test.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: Code for loading data and running HealthBench is available at https://github.com/openai/simple-evals.
  execution.reproducibility_blockers:
    - value: null
      failure: 2026-09-28-healthbench-011
  execution.harness_availability:
    - value: official-harness
      source: readme
      quote: 'To run HealthBench, HealthBench Consensus, or HealthBench Hard, use the simple-evals script:'
notes: The record classifies HealthBench as released (5,000 examples); HealthBench Consensus and HealthBench Hard
  are subsets in the same family and harness. The source key "readme" is the healthbench_eval.py reference implementation,
  as recorded in src/index.json. Three Stage 3 failures (002-004) were taxonomy examples that contradicted their
  tests; 0.9.0 turned all three into near misses.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, evaluation_method, designed_for_subjects, data.ceiling_anchor_type,
      lifecycle, activity, governance.submission_process, governance.independence_flags]
    note: Re-adjudicated against 0.9.0; the forced clinical-dialogue primary is replaced by an abstention.

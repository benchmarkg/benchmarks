# taxonomy/_corpus/classifications/sen1floods11.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: sen1floods11
corpus_item: 57
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://openaccess.thecvf.com/content_CVPRW_2020/html/w11/Bonafilia_Sen1Floods11_A_Georeferenced_Dataset_to_Train_and_Test_Deep_Learning_CVPRW_2020_paper.html
  pdf: https://openaccess.thecvf.com/content_CVPRW_2020/papers/w11/Bonafilia_Sen1Floods11_A_Georeferenced_Dataset_to_Train_and_Test_Deep_Learning_CVPRW_2020_paper.pdf
  home: https://github.com/cloudtostreet/Sen1Floods11
facets:
  domain.primary:
    - value: earth-climate/remote-sensing
      source: paper
      quote: we introduce Sen1Floods11, a surface water data set including classified permanent water, flood water, and
        raw Sentinel-1 imagery
      failure: 2026-09-28-sen1floods11-001
  domain.secondary:
    - value: vision/segmentation
      source: paper
      quote: We used Sen1Floods11 to train, validate, and test fully convolutional neural networks (FCNN) to segment permanent
        and flood water.
  capability:
    - value: perception
      source: paper
      quote: We used Sen1Floods11 to train, validate, and test fully convolutional neural networks (FCNN) to segment permanent
        and flood water.
    - value: distribution-shift-generalization
      source: pdf
      quote: is held out for a distinct test set to evaluate the accuracy of trained models on
      note: All hand-labelled Bolivia chips form a held-out flood event, reported separately (Tables 2 and 4) against
        the ten-event test set (Tables 1 and 3). The paper also trains on permanent water and scores on flood water ("the
        transferability of permanent water detection to flood water detection"), a research question rather than a benchmark
        split, so transfer-learning is not tagged.
  evaluation_method:
    - value: domain-metric
      source: pdf
      quote: Intersection over union(IOU) is used to evaluate the models
      note: Omission and commission error rates are also reported "for comparison to remote sensing literature". The
        corpus flag that the scoring metric is not stated refers to the README, not the paper.
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: We used Sen1Floods11 to train, validate, and test fully convolutional neural networks (FCNN) to segment permanent
        and flood water.
      note: Task-trained segmentation networks, as for brats-2026-cluster.
    - value: classical-algorithm
      source: paper
      quote: We compare these four models to a common remote sensing approach of thresholding radar backscatter to identify
        surface water.
      note: Otsu thresholding of the VH band, which beats every FCNN on permanent water.
  data.access:
    - value: fully-open
      source: home
      quote: 'The dataset is available for access through Google Cloud Storage bucket at:'
  data.refresh:
    - value: versioned-releases
      source: home
      quote: v1.1 involved major restructing of the bucket and more understandable file naming as well as updates to the
        dataset and data format to comply with COG spec.
  data.data_provenance:
    - value: real-world-instrument
      source: home
      quote: Raw Sentinel-1 imagery.
    - value: expert-authored
      source: pdf
      quote: for trained remote sensing analysts to hand label water areas
      note: The 446 hand-labelled chips are the evaluation labels. The 4,385 weakly supervised training chips carry labels
        from Otsu and NDWI-style thresholding of Sentinel-1 and Sentinel-2, and the permanent-water chips come from the
        JRC surface-water product.
  data.contamination_risk:
    - value: medium
      source: home
      quote: If you would like to download the entire dataset (~14 GB) you can use `gsutil rsync` to clone the bucket to
        a local directory.
      note: The test labels have been public since 2020, and Sentinel-1 and Sentinel-2 archives are common pretraining
        data for geospatial foundation models. No contamination evidence is reported.
  data.ceiling_anchor_type:
    - value: none-known
      note: The paper reports mean IoU against the hand labels but no inter-analyst agreement or other anchor. Analysts
        marked uncertain areas as "no data" rather than labelling them, so the reachable IoU is not stated.
  lifecycle:
    - value: null
      source: home
      quote: The original v1.0 data is still hosted for now on the original `cnn_chips` bucket.
      failure: 2026-09-28-sen1floods11-002
  activity:
    - value: null
      failure: 2026-09-28-sen1floods11-003
  governance.maintainer_type:
    - value: industry-lab
      source: home
      quote: This data was generated by Cloud to Street, a Public Benefit Corporation
      note: A public benefit corporation is a for-profit company. One author is also at Columbia University's Earth Institute.
  governance.submission_process:
    - value: null
      failure: 2026-09-28-sen1floods11-004
  governance.independence_flags:
    - value: null
      failure: 2026-09-28-sen1floods11-005
  execution.compute_tier:
    - value: null
      source: pdf
      quote: We use PyTorch to train and test all of our models
      failure: 2026-09-28-sen1floods11-006
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: 'We provide Sen1Floods11, as well as our training and evaluation code at:'
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: reference-implementation-only
      source: home
      quote: shows how to train and validate the model on a dataset.
      note: Train.ipynb is the authors' training and validation notebook. There is no official scorer or leaderboard.
notes: Classified as the corpus defines it, a dataset paper with no hosted leaderboard (corpus flag). The CVF open-access
  HTML (abstract) and PDF are the paper sources, since IEEE Xplore returned a bot check. GEO-Bench-2's paper (not
  a source here) excludes Sen1Floods11 because well-trained models "saturate" on it. That is third-party evidence
  that bears on headroom and cannot set lifecycle.

# taxonomy/_corpus/classifications/a2rl-drone-championship.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: a2rl-drone-championship
corpus_item: 18
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  home: https://a2rl.io/autonomous-drone-race
  site: https://a2rl.io
facets:
  domain.primary:
    - value: robotics-embodiment/drone-uav
      source: home
      quote: This challenge features fully autonomous drones flying on complex tracks at high speed
  domain.secondary: []
  capability:
    - value: sensorimotor-control
      source: home
      quote: flying entirely on AI-driven vision and onboard computing
    - value: autonomy
      source: site
      quote: develop fully autonomous drones capable of navigating complex aerial tracks at extreme speeds without
        human control
    - value: planning
      source: home
      quote: designed to evaluate how advanced AI systems perceive, plan, and respond in real-time
      note: 0.9.0's planning test admits an interactive episode against an explicit objective when the source claims
        planning; the race is that episode, and the flown sequence is scored by its outcome.
  evaluation_method:
    - value: physical-trial
      source: home
      quote: Single lap autonomous sprints to determine the starting grid.
    - value: tournament-play
      source: home
      quote: Wheel-to-wheel multi-agent championship race for the grand prize.
  designed_for_subjects:
    - value: physical-robot-system
      source: home
      quote: Fourteen teams from leading universities, research labs, and startups competed across four advanced
        race formats
    - value: human-expert
      source: home
      quote: 'The ultimate benchmark: AI vs professional racing pilots.'
  data.access:
    - value: invitation-only
      source: home
      quote: Demo autonomous drone flight Video
      note: There is no dataset. Entry is by an application whose form requires a demonstration flight video of an
        autonomous drone, so the organisers admit teams by selection; 02 S7 records the 14 invited teams.
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: A2RL Drone Season 2 brings the fastest AI driven aerial machines into a fully competitive environment.
      note: Each edition of a live physical competition has new trials by construction (0.9.0's periodic-recompetition
        test).
  data.data_provenance:
    - value: real-world-instrument
      source: home
      quote: Single lap autonomous sprints to determine the starting grid.
      note: The scored items are the recorded trials of a live physical race, which 0.9.0's real-world-instrument
        test covers.
  data.contamination_risk:
    - value: low
      source: home
      quote: Wheel-to-wheel multi-agent championship race for the grand prize.
      note: A live race on a physical track against a field on the day has no stored item set for training data to
        contain, as 02 S12.2 reads RoboArena's live trials. No source discusses contamination.
  data.ceiling_anchor_type:
    - value: expert-best
      source: home
      quote: AI-powered drone victory over a world-champion human pilot
      note: The human anchor is a head-to-head race outcome against elite FPV pilots, and the site reports
        it as already surpassed.
  lifecycle:
    - value: active
      source: home
      quote: The A2RL Drone Championship returns for UMEX Abu Dhabi
      note: Season 2 ran at UMEX in January 2026 (the page mislabels the date as '21 - 22 January 2025'), and
        the page carries a 'Drone Registration for Race 3' form.
  activity:
    - value: between-rounds
      source: home
      quote: Drone Registration for Race 3
      note: Season 2 has finished and Race 3 has no announced date. Registering for a physical race is not
        submitting a result.
  governance.maintainer_type:
    - value: null
      source: site
      quote: Owned by ASPIRE, A2RL is part of the Advanced Technology Research Council (ATRC)
      failure: 2026-09-28-a2rl-drone-championship-006
  governance.submission_process:
    - value: physical-competition
      source: home
      quote: 'Location: Hall 10 in ADNEC Centre Abu Dhabi (part of UMEX Abu Dhabi 2026)'
  governance.independence_flags:
    - value: null
      source: site
      quote: Leading Partners
      failure: 2026-09-28-a2rl-drone-championship-007
  execution.compute_tier:
    - value: physical-venue-entry
      source: home
      quote: 'Location: Hall 10 in ADNEC Centre Abu Dhabi'
  execution.reproducibility_tier:
    - value: requires-specialized-hardware
      source: home
      quote: This challenge features fully autonomous drones flying on complex tracks at high speed
      note: Nobody can rerun a past race, but 0.9.0 sends that to the live-world-state blocker and asks for the tier
        a fresh run needs. A fresh run needs autonomous racing drones on a physical gated track, which is hardware
        rather than computation, as 02 S12.2 reads RoboArena's physical trials.
      failure: 2026-09-28-a2rl-drone-championship-009
  execution.reproducibility_blockers:
    - value: live-world-state
      source: home
      quote: Head-to-head tactical AI battles across technical sectors.
      note: The result is a race on a given day, at a given venue, against a given field of rival drones and human
        pilots.
  execution.harness_availability:
    - value: none
      source: home
      quote: Performance benchmarks and AI logic verification in closed sim.
      note: The only software named is a closed simulator used for pre-race testing; nothing runnable is published.
notes: >-
  No paper, rulebook or scoring specification is published. The 'Regulations' bulletins on a2rl.io belong to
  the car series, not the drone championship. All values rest on two organiser marketing pages whose dates are
  inconsistent (a UMEX Abu Dhabi 2026 event dated January 2025, and a 'November 15, 2025, Yas Marina Circuit'
  banner). How lap times and race placements combine into a result is not stated.

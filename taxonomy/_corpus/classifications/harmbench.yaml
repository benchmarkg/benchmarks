# taxonomy/_corpus/classifications/harmbench.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: harmbench
corpus_item: 68
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2402.04249
  abs: https://arxiv.org/abs/2402.04249
  home: https://github.com/centerforaisafety/HarmBench
  commits: https://api.github.com/repos/centerforaisafety/HarmBench/commits
  cais: https://safe.ai/about
facets:
  domain.primary:
    - value: safety-alignment/jailbreak-robustness
      source: abs
      quote: we introduce HarmBench, a standardized evaluation framework for automated red teaming
      note: The headline number is attack success rate against target models and defenses.
  domain.secondary:
    - value: safety-alignment/harmlessness-refusal
      source: paper
      quote: HarmBench offers a standardized, large-scale evaluation framework for automated red teaming and robust
        refusal.
      note: The DirectRequest baseline measures refusal of the plain harmful request. Over-refusal is not measured.
  capability:
    - value: adversarial-robustness
      source: paper
      quote: The primary measure of a red teaming method’s success is its attack success rate (ASR) on a given target
        model
  evaluation_method:
    - value: adversarial-red-team
      source: paper
      quote: The primary measure of a red teaming method’s success is its attack success rate (ASR) on a given target
        model
      note: The denominator moves with the attack roster (18 methods at release).
    - value: model-derived-metric
      source: paper
      quote: For non-copyright behaviors, we fine-tune Llama 2 13B chat to serve as our classifier for whether a test
        case was successful.
      note: 'Scoring model: cais/HarmBench-Llama-2-13b-cls (test), with cais/HarmBench-Mistral-7b-val-cls for
        validation. Copyright behaviors use a hashing-based classifier.'
      failure: 2026-09-28-harmbench-001
  designed_for_subjects:
    - value: instruction-tuned-model
      source: home
      quote: 'There are two primary ways to use HarmBench: (1) evaluating red teaming methods against a set of LLMs,
        and (2) evaluating LLMs against a set of red teaming methods.'
      note: The target LLMs are chat models, some with defenses, and include multimodal models.
      failure: 2026-09-28-harmbench-002
  data.access:
    - value: fully-open
      source: paper
      quote: we provide an official validation/test split of HarmBench behaviors
      note: The behaviors, test cases and classifiers are all public. Test-set hygiene is by rule ("do not tune on
        the test set"), not by withholding. Hazardous material was excluded from the context strings, not withheld
        from a release, so restricted-dual-use does not apply.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: 'HarmBench 1.0: adversarial training code+model, precomputed test cases, and various improvements'
      note: The initial release (2024-02-06) was followed by 1.0 (2024-02-26). The roadmap's "Additional harmful
        behaviors" were never released as a later version.
  data.data_provenance:
    - value: expert-authored
      source: paper
      quote: several authors of this work manually designed a large set of behaviors that we assessed would violate
        laws or widely-held norms
      note: The authors are safety researchers writing their own behaviors, recorded as in agentdojo.
    - value: web-scraped
      source: paper
      quote: context strings were sourced from public websites and journal articles that can be easily found online
      note: This covers the context strings of the contextual behaviors only.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: We require that attacks and defenses do not tune on the test set or on behaviors semantically identical
        to those in the test set.
      note: The behaviors and test cases have been public on GitHub since February 2024. No fetched source
        mentions a canary string, and the only protection is a rule. No contamination evidence is reported.
  data.ceiling_anchor_type:
    - value: none-known
      note: ASR has no reported human or oracle anchor, and its direction depends on the subject, since an attack
        aims for 100% and a defense for 0%. The classifiers' agreement with human labels (93.2% for the test
        classifier) bounds measurement quality, and it is not a ceiling.
  lifecycle:
    - value: dormant
      source: commits
      quote: 2024-08-05T20:25:38Z Merge pull request #63 from ronakrm/save-test-cases-logging-bugfix
      failure: 2026-09-28-harmbench-003
  activity:
    - value: unknown
      note: The README describes no leaderboard or submission route. The project site (harmbench.org) is a
        JavaScript application whose served HTML is empty, per the corpus flag, so any leaderboard there could not
        be read.
  governance.maintainer_type:
    - value: nonprofit
      source: cais
      quote: CAIS is an AI safety non-profit.
      note: The repository and the classifiers are in the Center for AI Safety's namespaces (centerforaisafety,
        cais). The first author lists UIUC, and most other authors list CAIS.
  governance.submission_process:
    - value: null
      failure: 2026-09-28-harmbench-004
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: home
      quote: We also introduce a highly efficient adversarial training method that greatly enhances LLM robustness
        across a wide range of attacks
      note: The maintainers' R2D2 adversarially trained model is evaluated as a defense alongside third-party
        models.
  execution.compute_tier:
    - value: cluster
      source: home
      quote: to enable parallelizing test case generation across multiple machines
      note: The README recommends SLURM for a full run. The paper reports that "GCG is extremely slow, requiring 20
        minutes to generate a single test case on 7B parameter LLMs using an A100". A single method against a single
        model runs on one machine in local mode.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: A higher-level run_pipeline.py utility that automates parts of the pipeline
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: The HarmBench evaluation pipeline consists of three steps
notes: HarmBench calls itself an evaluation framework, like AgentDojo, and it ships a fixed behavior set (510 behaviors,
  with a 100/410 validation/test split), classifiers and a pipeline. The record classifies that shipped benchmark. It
  scores two kinds of entrant, attacks and target models or defenses, with one number (failure 002). The corpus url was
  moved from the JavaScript-only harmbench.org to the GitHub repository, and the site was not used.

# taxonomy/_corpus/classifications/critpt.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: critpt
corpus_item: 51
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2509.26574
  abs: https://arxiv.org/abs/2509.26574
  home: https://github.com/CritPt-Benchmark/CritPt
facets:
  domain.primary:
    - value: physics/physics-reasoning
      source: abs
      quote: the first benchmark designed to test LLMs on unpublished, research-level reasoning tasks that broadly
        covers modern physics research areas
      note: domains.yaml rejects mathematics and chemistry-materials for CritPt as near misses.
  domain.secondary: []
  capability:
    - value: quantitative-reasoning
      source: paper
      quote: problems are constructed to have guess-resistant final answers such as arrays of floating-point numbers
        and complicated symbolic expressions
    - value: reliability-consistency
      source: paper
      quote: a problem is deemed as consistently solved only if at least four out of five runs give correct final
        answers.
      note: The headline metric averages five runs, which the term excludes; the consistently-solved rate (Sec.
        4.3, "Reliability metric") is the paper's agreement metric and is what carries the tag.
  evaluation_method:
    - value: symbolic-equivalence
      source: paper
      quote: For problems involving symbolic algebra, we use a hierarchical grading script based on SymPy
      failure: 2026-09-28-critpt-001
    - value: execution-tests
      source: paper
      quote: When models return executable functions (e.g., for parametric solutions), we grade the model answer
        using curated test cases
  designed_for_subjects:
    - value: reasoning-model
      source: home
      quote: python -m critpt generate epochs=5 model=openai/gpt-5,openai/o3,openai/o4-mini reasoning_effort=high
        max_connections=150
      note: 'Reasoning effort is part of every configuration and moves the number: GPT-5 (high) 5.7 against GPT-5
        (minimal) 0.0.'
    - value: instruction-tuned-model
      source: paper
      quote: General-purpose chat models, including GPT-5 (minimal), GPT-4o and Llama-4 Maverick [14, 19, 20] are
        also included for comparison.
    - value: tool-augmented-model
      source: paper
      quote: With access to the code interpreter, GPT-5 (high, code) improves to 10.6%, a notable relative improvement
        from the base model
      note: The subjects.yaml example agrees. Tool configurations (code, code and web search) are shipped as task
        configs.
  data.access:
    - value: train-open-test-held-out
      source: paper
      quote: The solutions to the other 70 challenges (test set) are kept private to avoid potential contamination.
      note: The 70 test problems are public on GitHub and Hugging Face; only one example challenge has its solution
        published. Scoring is by the grading server. navsim-v2 used the same term for public inputs with withheld
        labels.
  data.refresh:
    - value: null
      source: home
      quote: It currently includes 71 challenges and 190 checkpoints
      failure: 2026-09-28-critpt-002
  data.data_provenance:
    - value: expert-authored
      source: abs
      quote: All problems are newly created by 50+ active physics researchers based on their own research.
  data.contamination_risk:
    - value: low
      source: paper
      quote: All problems in the CritPt are unpublished, hand-curated by physics experts to be well-defined and
        self-contained with search-proof answers.
      note: Answers are withheld. The problem statements have been public since 2025-11-21 and are sent to API providers
        during evaluation, a route the sources do not assess.
  data.ceiling_anchor_type:
    - value: none-known
      note: No human score is reported. Experts judge the challenges comparable to "warm-up research exercises"
        for junior graduate students, which is a difficulty description, not an anchor.
  lifecycle:
    - value: active
      source: paper
      quote: The leaderboard will be continually updated at https://artificialanalysis.ai/evaluations/critpt.
      note: The maintainers name Artificial Analysis as the host of future evaluations. The maintainer sources date
        the public pipeline release to 2025-11-21 and paper v4 to 2026-05-08. The Artificial Analysis board itself
        was not used as a source.
  activity:
    - value: accepting-submissions
      source: home
      quote: Model responses should be submitted to our grading server to receive a score.
      note: Limited to 10 submissions per account per 24 hours.
  governance.maintainer_type:
    - value: community-collective
      source: home
      quote: crafted by a team of 50+ active physics researchers from 30+ leading institutions worldwide
      failure: 2026-09-28-critpt-003
  governance.submission_process:
    - value: held-out-server
      source: home
      quote: our grading server only accepts complete batches containing responses to all 70 problems.
  governance.independence_flags:
    - value: evaluator-sells-evaluations
      source: paper
      quote: Notably, Artificial Analysis, an AI evaluation company, has independently validated our results on
        the CritPt challenges using this pipeline
      note: Artificial Analysis co-operates the grading server and hosts the continually updated leaderboard, so
        a commercial evaluator produces the ongoing results. Funding is Argonne LDRD (DOE), and no evaluated model
        developer funds the benchmark in the fetched sources.
  execution.compute_tier:
    - value: api-credits-only
      source: home
      quote: 'Setup model API keys in .env as environment variables:'
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: To evaluate your own models on CritPt, please follow the instructions provided on this page.
      note: End to end, but only through the maintainers' grading server, since the answers are private.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: paper
      quote: The solutions to the other 70 challenges (test set) are kept private to avoid potential contamination.
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: The evaluation pipeline and challenge dataset are now publicly available!
notes: critpt.com is JS-rendered, as the corpus flags; the record rests on the GitHub README and the paper. The
  README carries contact e-mail addresses, which are not quoted. One leaderboard row (Gemini 3 Pro) is attributed
  to Artificial Analysis rather than the maintainers.

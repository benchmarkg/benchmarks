# taxonomy/_corpus/classifications/legalbench-vals-legal-bench.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: legalbench-vals-legal-bench
corpus_item: 83
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2308.11462
  abs: https://arxiv.org/abs/2308.11462
  home: https://hazyresearch.stanford.edu/legalbench/
  start: https://hazyresearch.stanford.edu/legalbench/getting-started/
  news: https://hazyresearch.stanford.edu/legalbench/news/
  repo: https://github.com/HazyResearch/legalbench
  hf: https://huggingface.co/datasets/nguha/legalbench
  vals: https://www.vals.ai/benchmarks/legal_bench
facets:
  domain.primary:
    - value: society-econ-law/legal-reasoning
      source: paper
      quote: 'we present LegalBench: a collaboratively constructed legal reasoning benchmark consisting of 162 tasks
        covering six different types of legal reasoning'
      failure: 2026-09-28-legalbench-vals-legal-bench-002
  domain.secondary:
    - value: society-econ-law/legal-document
      source: paper
      quote: Interpretive tasks provide the LLM with a text, and ask the LLM to either extract a relevant piece of
        information, answer a question, or categorize the text by some property.
  capability:
    - value: knowledge-recall
      source: paper
      quote: LegalBench evaluates rule-recall through tasks which require the LLM to generate the correct legal rule
        on an issue in a jurisdiction (e.g., the rule for hearsay in US federal court).
    - value: deductive-reasoning
      source: paper
      quote: LegalBench evaluates rule-conclusion through tasks which require an LLM to determine the legal outcome
        of a set of facts under a specified rule.
      note: '"The LLM is always provided with the relevant rule, via the prompt", and "all tasks are considered to
        have objectively “correct” answers", so the outcome is decidable from the stated rule and facts. Issue-spotting
        and rhetorical-understanding have no capability term; ADR-0020 rules that the domain leaf legal-reasoning
        expresses them.'
    - value: context-integration
      source: paper
      quote: LegalBench evaluates interpretation through tasks which require the LLM to parse and understand a legal
        text.
    - value: quantitative-reasoning
      source: paper
      quote: Arithmetic (e.g., GSM8K [34]) Diversity Tasks, SARA Tasks
      note: From the paper's own table of NLP reasoning types (Table 11). sara_numeric's scored answer is a tax amount.
  evaluation_method:
    - value: exact-match
      source: paper
      quote: Classification tasks are evaluated using "exact-match" (following HELM [80]).
      note: The per-item verdict, and the score of the extraction tasks after normalisation. The classification tasks
        are aggregated as balanced accuracy and a few multi-label tasks use F1, which are classification-metric.
    - value: classification-metric
      source: paper
      quote: Because some tasks contain significant label imbalances, we use balanced-accuracy as a metric.
      note: Balanced accuracy for the classification tasks and F1 for the multi-label ones ('For these, we evaluate
        using F1'), both statistics over the whole set of predictions.
    - value: human-expert-eval
      source: paper
      quote: Rule-application tasks were evaluated manually by a law-trained individual, who analyzed LLM responses
        for both correctness and analysis.
      note: rule_qa is also graded by hand, "with reference to a grading guide".
  designed_for_subjects:
    - value: base-model
      source: paper
      quote: selecting between zero and eight samples from the available train split to use as in-context demonstration
      note: Few-shot prompts with generation stopped at a newline work against raw continuation, and the paper evaluates
        base checkpoints (Incite-Base-7B, OPT, BLOOM) alongside instruction-tuned ones.
    - value: instruction-tuned-model
      source: paper
      quote: We study three commercial API-access models.
  data.access:
    - value: fully-open
      source: home
      quote: Download the dataset from Huggingface.
      note: Per-task licences differ, and several are non-commercial (CC BY-NC, CC BY-NC-SA). Access is unrestricted
        for research.
  data.refresh:
    - value: versioned-releases
      source: news
      quote: '8/23/23: Version 1 released! Paper and data.'
      note: The getting-started page adds "If you would like to access an older version of the benchmark, please email
        us". The maintainers commit to adding tasks and fixing errors, and the news page's changelist is empty.
  data.data_provenance:
    - value: expert-authored
      source: abs
      quote: LegalBench was built through an interdisciplinary process, in which we collected tasks designed and hand-crafted
        by legal professionals.
      note: The tasks written for LegalBench and the unreleased datasets built by legal professionals.
    - value: inherited-from-constituents
      source: paper
      quote: The first source of tasks are existing available datasets and corpora.
      note: CUAD, MAUD, ContractNLI, OPP-115, SARA and others, restructured into few-shot tasks under their original
        licences, with their own papers documenting provenance.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: It is thus possible that some LegalBench tasks leaked into pretraining data.
      note: The paper's Table 9 separates previously published tasks (CUAD, MAUD, ContractNLI and others, on the web
        before LegalBench) from original unreleased ones. No contamination is evidenced.
  data.ceiling_anchor_type:
    - value: none-known
      note: No maintainer source reports human performance. The only saturation claim ("the top models are bunched
        near 88%") is Vals AI's, which is a third-party board and no anchor.
  lifecycle:
    - value: null
      source: news
      quote: '8/23/23: Version 1 released! Paper and data.'
      failure: 2026-09-28-legalbench-vals-legal-bench-005
  activity:
    - value: no-submission-channel
      source: home
      quote: LegalBench is ongoing and we are always looking to incorporate more tasks.
      note: The maintainer runs no leaderboard, and its only contribution channel is for tasks, not results. 0.9.0's
        unknown excludes an observed absence of any channel. The live board is Vals AI's ("Updated 9/22/2026"), a
        third-party aggregation that cannot carry activity (reviewer ruling, P1-S1-T03).
  governance.maintainer_type:
    - value: academic-lab
      source: hf
      quote: 'Repository: https://github.com/HazyResearch/legalbench/'
      note: Under 0.9.0's holder rule the repository and site are Stanford Hazy Research's, a datasheet contact is
        not a holder, and Vals AI's board is a partner's results page (legalbench is academic-lab's example and
        individual's near miss).
  governance.submission_process:
    - value: literature-only
      source: paper
      quote: We study three commercial API-access models.
      note: The maintainers publish only the release paper's results and keep no ranking; others report in their own
        work. 0.9.0's test says a third party's re-running board (Vals AI, HELM Lite) is not the benchmark's own
        process.
  governance.independence_flags:
    - value: funded-by-evaluated-party
      source: paper
      quote: 'members of the Stanford DAWN project: Facebook, Google, and VMWare'
      note: The acknowledgement is lab-wide sponsorship (Hazy Research's affiliates, also including Google Cloud and
        Microsoft). The paper evaluates Meta's OPT and LLaMA-2 and Google's Flan-T5. The paper also thanks "Casetext for
        assistance with evaluating GPT-4", and Casetext is a legal-AI vendor.
  execution.compute_tier:
    - value: api-credits-only
      source: paper
      quote: We study three commercial API-access models.
      note: The two-GPU A100 node ('All inference was performed on two-GPU GCP 40GB A100s') served the open models,
        which is the entrant's serving choice; the protocol mandates no hardware and API models are evaluated, so
        0.9.0's precedence rule gives api-credits-only (legalbench is multi-gpu-node's near miss).
  execution.reproducibility_tier:
    - value: requires-human-raters
      source: start
      quote: A small number of LegalBench tasks (~7) require manual evaluation.
      note: About 155 tasks are scored automatically, but hand-grading even a minority of tasks gives this tier
        under 0.9.0 (legalbench is its example).
  execution.reproducibility_blockers:
    - value: human-raters
      source: start
      quote: A small number of LegalBench tasks (~7) require manual evaluation.
  execution.harness_availability:
    - value: official-harness
      source: start
      quote: Code for automatically computing metrics is available on the Github repository.
      note: The repository also holds a base prompt for each task, and there is a gradebook for the manually graded
        tasks. Running the models is left to the user.
notes: 'The corpus entry combines two resources. One is LegalBench, which Hazy Research at Stanford maintains:
  paper, site, repository and Hugging Face data. The other is Vals AI''s LegalBench leaderboard. Under 02 S11
  rule 5 the leaderboard is not an edition or track of the family. It is a third-party re-evaluation of LegalBench
  tasks, and the LegalBench repository lists vals.ai under "Recent work involving LegalBench". The record classifies
  LegalBench as maintained. Vals is cited only where it shows a gap: lifecycle, activity and the ceiling. Vals''s
  statement that "LegalBench is largely saturated" cannot set lifecycle, which is derived in any case (failure
  005).'
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, evaluation_method, data.data_provenance, activity, governance.maintainer_type,
      governance.submission_process, execution.compute_tier, execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; the precedence rules settle compute, tier, holder and the no-channel fields.

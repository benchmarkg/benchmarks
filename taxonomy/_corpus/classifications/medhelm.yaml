# taxonomy/_corpus/classifications/medhelm.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: medhelm
corpus_item: 28
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2505.23802
  abs: https://arxiv.org/abs/2505.23802
  home: https://crfm-helm.readthedocs.io/en/latest/medhelm/
  maint: https://crfm-helm.readthedocs.io/en/latest/maintenance_mode/
facets:
  domain.primary:
    - value: medicine-health/clinical-task-suites
      source: abs
      quote: a comprehensive benchmark suite comprising 35 benchmarks (17 existing, 18 newly formulated) providing
        complete coverage of all categories and subcategories in the taxonomy
      note: The tasks span diagnosis, treatment planning, outcome prediction, clinical QA, literature research, note
        generation, patient messaging and administration, no subdomain holds most of them, and the claim is coverage
        within medicine (ADR-0016; medhelm is the example). The subdomains the tasks fall in are secondary.
  domain.secondary:
    - value: medicine-health/diagnosis-triage
      source: home
      quote: Supporting Diagnostic Decisions
    - value: medicine-health/treatment-planning
      source: home
      quote: Planning Treatments
    - value: medicine-health/ehr-prediction
      source: home
      quote: Predicting Patient Risks and Outcomes
    - value: medicine-health/clinical-qa
      source: home
      quote: Providing Clinical Knowledge Support
    - value: medicine-health/biomedical-literature
      source: home
      quote: Conducting Literature Research
  capability:
    - value: null
      source: abs
      quote: We introduce MedHELM, an extensible evaluation framework for assessing LLM performance for medical
        tasks
      failure: 2026-09-28-medhelm-002
  evaluation_method:
    - value: exact-match
      source: paper
      quote: Exact-match accuracy for single-token or numeric outputs (e.g. selecting the correct option in MedQA).
    - value: classification-metric
      source: paper
      quote: Micro-F1 for multi-label classification tasks (e.g. ICD-10 code assignment).
    - value: multiple-choice
      source: paper
      quote: MCQ framing for multiple-choice questions
    - value: model-graded-judge
      source: paper
      quote: The jury composition (GPT-4o, Claude 3.7 Sonnet, LLaMA 3.3 70B) was chosen to represent diverse model
        architectures and training approaches, minimizing systematic bias from any single provider.
    - value: rubric-graded
      source: paper
      quote: We prompted each judge to score the model-generated responses on a 1–5 Likert scale according to three
        axes adopted from Van Veen et al. (2024)
    - value: reference-metric
      source: paper
      quote: ROUGE and BERTScore were also computed for all open-ended benchmarks with gold standard responses but
        used only as secondary metrics due to their limited alignment with clinical judgment.
      note: ROUGE; the source reports it and BERTScore as secondary metrics.
    - value: model-derived-metric
      source: paper
      quote: ROUGE and BERTScore were also computed for all open-ended benchmarks with gold standard responses but
        used only as secondary metrics due to their limited alignment with clinical judgment.
      note: BERTScore is computed by a learned encoder, which 0.9.0 moves from reference-metric to model-derived-metric.
    - value: composite
      source: paper
      quote: The overall performance score calculated by averaging results across all 35 benchmarks, with each benchmark
        weighted equally regardless of size (0–1 scale).
    - value: entrant-relative-ranking
      source: paper
      quote: For each of the 35 benchmarks, we compared each model against every other
      note: The headline pairwise win-rate moves when a model joins the pool; medhelm is the 0.9.0 example, with composite
        beside it for the combination of methods.
  designed_for_subjects:
    - value: instruction-tuned-model
      source: paper
      quote: We evaluated 9 state-of-the-art LLMs (Table 1) under a uniform prompting and decoding regimen.
      note: Nine general frontier models and no medical one; medhelm is domain-specialist-model's 0.9.0 near miss.
  data.access:
    - value: private-test-server
      source: paper
      quote: Access levels are designated as 14 public, seven gated (i.e. requiring approval), and 14 private.
      note: The headline covers all 35 benchmarks, and 14 are internal clinical datasets that only the maintainers'
        authorized members run, with no submission server. 0.9.0's mixed-headline rule gives private-test-server,
        which now covers a maintainer-run set.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: Use the numbered release version you want to display.
      note: The official leaderboard is published as numbered releases (v2.0.0 in the docs).
  data.data_provenance:
    - value: patient-clinical-record
      source: paper
      quote: All experiments were conducted on a PHI-compliant shared cluster maintaining full HIPAA compliance.
      note: 12 of the 13 new benchmarks are EHR-based, curated with Stanford Health Care.
    - value: unreleasable-confidential
      source: paper
      quote: For privacy and regulatory compliance, as well as to prevent inclusion in LLM training data, 14 datasets
        are not publicly released.
    - value: exam-derived
      source: paper
      quote: accuracy on standardized exams like MedQA
      note: MedQA is one of the 17 existing benchmarks incorporated.
    - value: inherited-from-constituents
      source: abs
      quote: a comprehensive benchmark suite comprising 35 benchmarks (17 existing, 18 newly formulated)
      note: The 17 existing benchmarks are reused, each with its own documented provenance.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: For privacy and regulatory compliance, as well as to prevent inclusion in LLM training data, 14 datasets
        are not publicly released.
      note: The authors withhold 14 datasets partly to keep them out of training data, which concedes a route for
        the 21 released ones (MedQA and other public sets). No contamination is evidenced.
  data.ceiling_anchor_type:
    - value: none-known
      note: No human task performance is reported. The clinician-clinician ICC (0.43) measures agreement among raters
        of responses, not a ceiling on task scores, and the win-rate headline is relative to the model pool.
  lifecycle:
    - value: mature
      source: maint
      quote: The HELM code and leaderboards will continue to be available as open-source resources for the community.
      note: HELM entered maintenance mode on June 1, 2026 and freezes the result record of an instrument that stays
        available; ADR-0019 reads that as mature with activity closed, and medhelm is the example.
  activity:
    - value: closed
      source: maint
      quote: However, no new features will be added to HELM, and no new evaluations will be added to the HELM leaderboards.
      note: HELM, which hosts the MedHELM leaderboard, entered maintenance mode on June 1, 2026.
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: 'Suhana Bedi Affiliation: Stanford University School of Medicine, Stanford, CA, USA'
      note: Stanford CRFM (HELM) with Stanford School of Medicine and Stanford Health Care; HELM is now maintained
        "by volunteer maintainers on a best-effort basis".
  governance.submission_process:
    - value: maintainer-run
      source: paper
      quote: We evaluated 9 state-of-the-art LLMs (Table 1) under a uniform prompting and decoding regimen.
      note: The maintainers chose and ran every model, some on a PHI-compliant Stanford cluster, and keep the leaderboard;
        a HELM contribution is model code, not a result.
  governance.independence_flags:
    - value: grader-from-evaluated-party
      source: paper
      quote: The jury composition (GPT-4o, Claude 3.7 Sonnet, LLaMA 3.3 70B) was chosen to represent diverse model
        architectures and training approaches
      note: All three jury models are among the nine evaluated models; medhelm is the 0.9.0 example.
  execution.compute_tier:
    - value: api-credits-only
      source: paper
      quote: All models were queried via their respective APIs or local endpoints with sampling temperature set to 0
        for deterministic outputs.
      note: The leaderboard takes API-served models, and the jury is API spend too; local GPUs ('Needed for running
        models locally') are the entrant's choice under 0.9.0's precedence rule.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: home
      quote: Private Internal clinical datasets run_entries_medhelm_private_{org}.conf Authorized org members
      note: For the full 35-benchmark suite and its win-rate. The 14 public benchmarks can be reproduced by anyone,
        and the gated ones by credentialed users.
  execution.reproducibility_blockers:
    - value: unreleasable-data
      source: paper
      quote: For privacy and regulatory compliance, as well as to prevent inclusion in LLM training data, 14 datasets
        are not publicly released.
      failure: 2026-09-28-medhelm-011
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: 'Run the following command to install HELM and the necessary MedHELM extensions:'
notes: The maint source is the HELM documentation's Maintenance Mode Policy page, fetched for this record because
  it bears directly on lifecycle and activity. MedHELM is classified as the suite (taxonomy, 35 benchmarks, leaderboard);
  the constituent benchmarks are separate families where they exist independently (e.g. MedQA).
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, evaluation_method, designed_for_subjects, data.access, data.data_provenance, lifecycle,
      governance.submission_process, governance.independence_flags, execution.compute_tier]
    note: Re-adjudicated against 0.9.0; clinical-task-suites (ADR-0016) resolves the blocking primary.

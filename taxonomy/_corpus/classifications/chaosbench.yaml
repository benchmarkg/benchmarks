# taxonomy/_corpus/classifications/chaosbench.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: chaosbench
corpus_item: 55
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2402.00712
  abs: https://arxiv.org/abs/2402.00712
  repo: https://github.com/leap-stc/ChaosBench
  leaderboard: https://leap-stc.github.io/ChaosBench/leaderboard.html
  evaluation: https://leap-stc.github.io/ChaosBench/evaluation.html
  metrics: https://leap-stc.github.io/ChaosBench/metrics.html
facets:
  domain.primary:
    - value: earth-climate/weather-forecasting
      source: repo
      quote: ChaosBench is a benchmark project to improve and extend the predictability range of deep weather emulators
        to the subseasonal-to-seasonal (S2S) range.
      failure: 2026-09-28-chaosbench-001
  domain.secondary: []
  capability:
    - value: calibration-uncertainty
      source: paper
      quote: Spread/Skill Ratio balances the ensemble spread with the forecast skill (e.g., RMSE); ideally, a well-calibrated
        ensemble should have a spread that matches the forecast skill
      note: CRPS, CRPSS and the spread/skill ratio consume the emitted ensemble.
      failure: 2026-09-28-chaosbench-002
  evaluation_method:
    - value: statistical-fit
      source: metrics
      quote: 'Deterministic-based: RMSE Bias Anomaly Correlation Coefficient (ACC)'
    - value: domain-metric
      source: paper
      quote: Continuous Ranked Probability Skill Score (CRPSS) evaluates the skill of probabilistic forecast relative to
        climatology variability
      note: MS-SSIM and the benchmark's own spectral metrics (SpecDiv, SpecRes) are also reported. The spectral metrics
        are introduced by this paper, so they are not yet standardised within the discipline.
    - value: uncertainty-calibration-score
      source: paper
      quote: Continuous Ranked Probability Score (CRPS) evaluates the accuracy of the ensemble distribution against the
        target.
      failure: 2026-09-28-chaosbench-003
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: abs
      quote: we propose ChaosBench, a challenging benchmark to extend the predictability range of data-driven weather emulators
        to S2S timescale
    - value: classical-algorithm
      source: abs
      quote: we evaluate on a diverse set of physics-based forecasts from four national weather agencies as baselines to
        our data-driven counterpart
      note: 'UKMO, NCEP, CMA and ECMWF forecasts are plotted and ranked with the data-driven models. The reference line
        is climatology, not one of them, which is why this differs from weatherbench-2 (failure 003 there).'
  data.access:
    - value: fully-open
      source: paper
      quote: All our dataset, present and future (e.g., with more years, multi-resolution support, etc) are available at
        https://huggingface.co/datasets/LEAP/ChaosBench.
  data.refresh:
    - value: static
      source: leaderboard
      quote: Unless stated, all results are evaluated for the year 2022.
      note: The evaluation year is fixed. The appendix anticipates adding years and resolutions to the dataset, but no
        release of that kind is recorded.
  data.data_provenance:
    - value: simulation-generated
      source: paper
      quote: ERA5 Reanalysis provides a comprehensive record of the global atmosphere combining physics and observations
        for correction
      note: The baselines are also simulations, "physics-based control (deterministic) and perturbed (ensemble) forecasts
        from four national weather agencies".
      failure: 2026-09-28-chaosbench-004
  data.contamination_risk:
    - value: medium
      source: paper
      quote: All evaluations presented here are done on the held-out 2022 data.
      note: The held-out year is public ERA5, ORAS5 and ERA5-Land data, so nothing but convention keeps it out of an
        entrant's training set. No contamination evidence is reported.
  data.ceiling_anchor_type:
    - value: operational-system
      source: paper
      quote: we find that ECMWF high-resolution ensemble, dubbed as the gold standard, still has the best performance in
        terms of CRPSS
      note: Climatology is the skill floor (CRPSS > 0 means skill). The ECMWF ensemble is the best system measured and
        the stated goal-post.
  lifecycle:
    - value: null
      source: paper
      quote: Furthermore, we are committed to maintaining and preserving the ChaosBench benchmark.
      failure: 2026-09-28-chaosbench-005
  activity:
    - value: unknown
      note: The leaderboard page is live, but no fetched source dates a result after the 2024 paper (v5, 20 Nov 2024)
        or says whether new entries are taken.
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: 'Juan Nathaniel Affiliation: Columbia University'
      note: Funding, computing and storage came from the NSF Science and Technology Center LEAP (Award 2019625), which
        hosts the leap-stc GitHub organisation.
  governance.submission_process:
    - value: null
      source: leaderboard
      quote: We provide a leaderboard for both deterministic and probabilistic models/metrics.
      failure: 2026-09-28-chaosbench-006
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: '[17] Tung Nguyen, Johannes Brandstetter, Ashish Kapoor, Jayesh K Gupta, and Aditya Grover. Climax: A foundation
        model for weather and climate.'
      note: Tung Nguyen and Aditya Grover are ChaosBench authors, and ViT/ClimaX is one of the four state-of-the-art models
        evaluated (the best at 44 days in Table 2). The paper also notes that "AG would like to acknowledge support from
        Google", whose GraphCast is evaluated.
  execution.compute_tier:
    - value: multi-gpu-node
      source: paper
      quote: All training are performed using 2x NVIDIA A100 GPUs.
      note: This is the maintainers' baseline training. The evaluation page recommends GPUs, and the quickstart asks for
        about 150GB of disk.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: 'Model Checkpoints: All of our model checkpoints used for the purposes of ablation in this work are available
        at'
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: evaluation
      quote: Once training is done, we can perform evaluation depending on the use case.
      note: The repository ships eval_iter.py, eval_direct.py and eval_ensemble.py, and the page documents their use.
notes: The site root (the corpus url) is a meta refresh and fetched empty, so it is not listed. Its Jupyter-Book pages
  (leaderboard, evaluation, metrics) are static and were fetched directly. The leaderboard's interactive plots are
  iframes that did not render, so the ranked rows themselves were not read.

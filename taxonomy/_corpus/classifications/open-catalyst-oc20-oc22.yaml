# taxonomy/_corpus/classifications/open-catalyst-oc20-oc22.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: open-catalyst-oc20-oc22
corpus_item: 34
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2010.09990
  abs: https://arxiv.org/abs/2010.09990
  oc22: https://arxiv.org/abs/2206.08917
  home: https://opencatalystproject.org/
  leaderboard: https://opencatalystproject.org/leaderboard.html
  lbdata: https://opencatalystproject.org/data/leaderboard_data.json
  lbdata22: https://opencatalystproject.org/data/leaderboard_oc22_data.json
  challenge: https://opencatalystproject.org/challenge.html
  lbcontent: https://huggingface.co/spaces/facebook/fairchem_leaderboard/raw/main/content.py
  lbconfig: https://facebook-fairchem-leaderboard.hf.space/config
facets:
  domain.primary:
    - value: chemistry-materials/catalysis
      source: paper
      quote: This is the most common task in catalysis, as the relaxed energies are often correlated with catalyst activity
        and selectivity
      note: Said of IS2RE (initial structure to relaxed energy), one of the three OC20 tasks; OC22 extends the same tasks
        to oxide electrocatalysts. The subject is the adsorbate-surface system, so the physics exclusion (a molecule,
        crystal, catalyst or material is chemistry-materials) settles the family.
  domain.secondary:
    - value: chemistry-materials/force-fields-potentials
      source: paper
      quote: Our combined metric, Energy and Forces within Threshold (EFwT), is designed to measure the practical usefulness
        of a model for replacing DFT by evaluating whether both the computed energy and forces are close to the ground
        truth.
      note: The S2EF task, and the only task the current FAIR Chemistry leaderboard carries besides IS2RE, scores a learned
        potential against DFT energies and forces.
  capability:
    - value: distribution-shift-generalization
      source: paper
      quote: As expected, the In Domain (ID) achieves the best results and the OOD Both performs the worst.
      note: The test set has In-Domain, OOD Adsorbate, OOD Catalyst and OOD Both subsplits, reported separately on both
        leaderboards.
      failure: 2026-09-28-open-catalyst-oc20-oc22-001
  evaluation_method:
    - value: domain-metric
      source: paper
      quote: We use ADwT as opposed to the MAE on 3D atom positions, since ADwT is robust to outliers and better indicates
        the percentage of relaxations that are likely to be successful.
      note: EFwT, ADwT, FbT and AFbT are thresholded metrics defined for this benchmark family.
      failure: 2026-09-28-open-catalyst-oc20-oc22-002
    - value: statistical-fit
      source: paper
      quote: 'Energy MAE: Mean Absolute Error between the computed energy and the ground truth energy.'
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: home
      quote: The use of AI or machine learning may provide a method to efficiently approximate these calculations, leading
        to new approaches in finding effective catalysts.
  data.access:
    - value: train-open-test-held-out
      source: paper
      quote: Ground truth test data is not publicly released to reduce potential overfitting.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: 06-21-22 We released OC22, a new dataset focused on oxide electrocatalysis
      failure: 2026-09-28-open-catalyst-oc20-oc22-003
  data.data_provenance:
    - value: simulation-generated
      source: abs
      quote: we developed the OC20 dataset, consisting of 1,281,040 Density Functional Theory (DFT) relaxations (~264,890,000
        single point evaluations)
  data.contamination_risk:
    - value: low
      source: paper
      quote: Ground truth test data is not publicly released to reduce potential overfitting.
      note: Validation labels are public and the extrapolative validation subsplits are disjoint from the test ones;
        no source assesses leakage of the test inputs, which are released.
  data.ceiling_anchor_type:
    - value: none-known
      note: The reference is DFT itself and no source states a ceiling. The paper reports that "All approaches perform
        badly on the EFwT metric" and gives no human or measured upper bound; the thresholded metrics top out at 100%
        by construction, but no source anchors the scale there.
  lifecycle:
    - value: active
      source: lbconfig
      quote: '"Meta", true, true, "UMA-459M", "53.70", "24.06", "2026-03-18"'
      note: A 2026-03-18 row on the FAIR Chemistry leaderboard, which now hosts OC20 S2EF and IS2RE test evaluations;
        OC22 is not on that leaderboard.
      failure: 2026-09-28-open-catalyst-oc20-oc22-004
  activity:
    - value: accepting-submissions
      source: lbcontent
      quote: Upload your file and click Submit Eval
      note: For OC20 on the FAIR Chemistry leaderboard. The legacy page still says "submit your own on the OC20 evaluation
        server"; the EvalAI servers themselves were not fetched.
  governance.maintainer_type:
    - value: industry-lab
      source: home
      quote: The Open Catalyst Project is a collaborative research effort between Fundamental AI Research (FAIR) at Meta
        and Carnegie Mellon University's (CMU) Department of Chemical Engineering.
      failure: 2026-09-28-open-catalyst-oc20-oc22-005
  governance.submission_process:
    - value: held-out-server
      source: paper
      quote: Evaluation on the test set may only be done through the leaderboard.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: lbdata
      quote: '"team": "Open Catalyst Project (FAIR/CMU)"'
      note: The legacy OC20 leaderboard also ranks "FAIR + CMU", "FAIR Meta AI" and "Atomic Architects MIT + FAIR at
        Meta" entries; the current leaderboard ranks Meta UMA models.
  execution.compute_tier:
    - value: cluster
      source: paper
      quote: The largest baseline models with ca. 10 million parameters were trained on upwards of 32 GPUs at a time
      note: Training cost at baseline scale; 32 GPUs exceeds one ordinary node. Scoring FbT/AFbT also needs DFT single
        points, run by the organisers.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: paper
      quote: Evaluation on the test set may only be done through the leaderboard.
      note: Test scores come only from the maintainer-run server; validation scores are reproducible locally.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: paper
      quote: Ground truth test data is not publicly released to reduce potential overfitting.
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: In addition to the data, baseline models and code are open-sourced on our Github page.
notes: Combined entry (OC20 and OC22, two datasets and papers). OC20 has moved from the EvalAI-backed opencatalystproject.org
  leaderboard, whose last rows are dated 2024/06/27, to the FAIR Chemistry leaderboard Space, which also hosts OMol25;
  OC22 has not. The site also ran Open Catalyst Challenges in 2021, 2022 and 2023, the last on a new test-challenge-2023
  split scored by DFT single points. Code now lives in facebookresearch/fairchem.

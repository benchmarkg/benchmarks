# taxonomy/_corpus/classifications/audioset.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: audioset
corpus_item: 80
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  pdf: https://research.google.com/pubs/archive/45857.pdf
  home: https://research.google.com/audioset/
  download: https://research.google.com/audioset/download.html
  strong: https://research.google.com/audioset/download_strong.html
  commits: https://api.github.com/repos/audioset/ontology/commits
facets:
  domain.primary:
    - value: audio-speech/audio-event-understanding
      source: home
      quote: By releasing AudioSet, we hope to provide a common, realistic-scale evaluation task for audio event
        detection, as well as a starting point for a comprehensive vocabulary of sound events.
      note: The original labels mark presence in a 10-second clip, which is recognition rather than timing.
  domain.secondary:
    - value: audio-speech/audio-event-detection-localization
      source: strong
      quote: and to indicate the start and end times of each event by dragging out a region on a spectrogram
      note: The May 2021 temporally-strong labels for the evaluation set and 5% of training.
    - value: audio-speech/music-understanding
      source: home
      quote: covering a wide range of human and animal sounds, musical instruments and genres, and common everyday
        environmental sounds.
  capability:
    - value: perception
      source: pdf
      quote: to create a system able to predict the human labelings from audio alone.
  evaluation_method:
    - value: classification-metric
      source: pdf
      quote: This system gave a bal- anced mean Average Precision across the 485 categories of 0.314, and an average
        AUC of 0.959
      note: The paper's baseline reports mAP, AUC and d-prime. Clip-level average precision is precision and recall
        over a score ranking, with no IoU sweep, so it is a general classification statistic (0.9.0's tie-break keeps
        only mAP over IoU thresholds in domain-metric). The site defines no official protocol, and later work reports
        mAP on the evaluation segments by convention.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: pdf
      quote: we used the training portion of the Audio Set YouTube Corpus to train a shallow fully-connected neural
        network
      note: Audio event classifiers trained on AudioSet's own training splits; audio tagging is a general audio task,
        not a discipline.
  data.access:
    - value: fully-open
      source: download
      quote: The dataset is made available by Google Inc. under a Creative Commons Attribution 4.0 International
        (CC BY 4.0) license
      note: Labels, segment lists and features download without registration. The audio is not distributed, and
        each segment points to a YouTube clip that may vanish. ADR-0020 rules that pointer-only media is fully-open
        with a note, and vanishing media is a reproducibility matter (the live-world-state blocker).
  data.refresh:
    - value: versioned-releases
      source: download
      quote: The “v1” release includes the rerating done thus far.
      note: Followed by the May 2021 strong-label release.
  data.data_provenance:
    - value: web-scraped
      source: home
      quote: a collection of 2,084,320 human-labeled 10-second sound clips drawn from YouTube videos
    - value: crowd-authored
      source: pdf
      quote: Each segment was rated by three raters and a majority vote was required to record an overall rating.
      note: No rater qualification is stated; the ontology is built so that classes are distinguishable by a "typical"
        listener.
  data.contamination_risk:
    - value: medium
      source: home
      quote: a collection of 2,084,320 human-labeled 10-second sound clips drawn from YouTube videos
      note: The evaluation clips are public YouTube audio and their labels have been public since 2017, so a route
        into audio pretraining is plausible. No source assesses it.
  data.ceiling_anchor_type:
    - value: none-known
      note: No anchor is reported. Raters were unanimous on 76.2% of votes and the quality assessment found some
        classes with poor label accuracy, which bounds attainable mAP below 1 by an unmeasured amount.
  lifecycle:
    - value: null
      source: strong
      quote: Temporally-Strong Labels Download (May 2021)
      failure: 2026-09-28-audioset-007
  activity:
    - value: no-submission-channel
      source: home
      quote: The dataset and machine-extracted features are available at the download page.
      note: A download-and-run dataset with no leaderboard, server or submission route; users publish in their own
        papers.
  governance.maintainer_type:
    - value: industry-lab
      source: home
      quote: This dataset is brought to you from the Sound Understanding group in the Machine Perception Research
        organization at Google.
  governance.submission_process:
    - value: literature-only
      source: pdf
      quote: To give a sense of the performance possible with this data, we have trained a simple baseline system.
      note: The only maintainer result is the release paper's baseline, and no ranking is kept; everyone else reports
        on the evaluation segments in their own papers.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: pdf
      quote: To give a sense of the performance possible with this data, we have trained a simple baseline system.
      note: The release paper evaluates Google's own classifier, built on an embedding network trained on YouTube
        video topics, and the site distributes Google's VGGish features. There is no ranking.
  execution.compute_tier:
    - value: null
      source: download
      quote: The total size of the features is 2.4 gigabytes.
      failure: 2026-09-28-audioset-006
  execution.reproducibility_tier:
    - value: null
      source: download
      quote: Text (csv) files describing, for each segment, the YouTube video ID, start time, end time, and one
        or more labels.
      failure: 2026-09-28-audioset-008
  execution.reproducibility_blockers:
    - value: live-world-state
      source: strong
      quote: (excluding the ones that have become unavailable since the original release)
      note: The evaluation set is defined by YouTube IDs, and clips disappear as videos are removed, so two runs
        at different dates score different sets.
  execution.harness_availability:
    - value: reference-implementation-only
      source: download
      quote: The VGG-like model, which was used to generate the 128-dimensional features and which we call VGGish,
        is available in the TensorFlow models Github repository
notes: The corpus flags AudioSet as a dataset with no scoring protocol or leaderboard, and that holds on every maintainer
  page. The research.google publication page carries only the abstract, so the ICASSP 2017 paper was read from Google's
  PDF, with the download, strong-label and ontology pages and the ontology repository's commit history. The balanced
  evaluation split is what papers mean by the AudioSet benchmark.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [evaluation_method, designed_for_subjects, data.access, lifecycle, activity,
      governance.submission_process, execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; lifecycle and tier now abstain on the rules 0.9.0 states and ADR-0020 defers.

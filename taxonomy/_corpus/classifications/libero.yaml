# taxonomy/_corpus/classifications/libero.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: libero
corpus_item: 12
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2306.03310
  abs: https://arxiv.org/abs/2306.03310
  home: https://libero-project.github.io/main.html
  repo: https://github.com/Lifelong-Robot-Learning/LIBERO
  docs: https://lifelong-robot-learning.github.io/LIBERO/html/getting_started/overview.html
facets:
  domain.primary:
    - value: robotics-embodiment/manipulation
      source: abs
      quote: we introduce LIBERO, a novel benchmark of lifelong learning for robot manipulation.
      note: Forward transfer and forgetting across a task sequence are carried by the capability
        continual-learning, and the domain stays manipulation (ADR-0020).
  domain.secondary:
    - value: robotics-embodiment/embodied-instruction-following
      source: paper
      quote: we use the templates and select objects available in the simulator to generate a set of task
        descriptions in the form of language instructions.
  capability:
    - value: continual-learning
      source: paper
      quote: Lower NBT means a policy has better performance in the previously seen tasks, higher FWT means
        a policy learns faster on a new task
    - value: transfer-learning
      source: home
      quote: 'We build this benchmark to invite communities of machine learning and robotics people to study
        a core problem in lifelong learning: knowledge transfer.'
    - value: sensorimotor-control
      source: paper
      quote: success rate over 20 test rollout trajectories of a maximum length of 600
  evaluation_method:
    - value: simulation-rollout
      source: paper
      quote: All metrics are computed in terms of success rate
      note: FWT, NBT and AUC are Metric definitions over simulated success rates (ADR-0020); the simulator is
        Robosuite on MuJoCo.
  designed_for_subjects:
    - value: rl-policy
      source: repo
      quote: currently we mainly focus on lifelong imitation learning.
      note: The benchmark ranks lifelong-learning procedures (sequential finetuning, ER, EWC, PackNet) by the
        simulated policies they train, and 0.9.0's rl-policy treats the policy and its learning procedure as
        one entrant.
  data.access:
    - value: fully-open
      source: repo
      quote: Creative Commons Attribution 4.0 International (CC BY 4.0)
  data.refresh:
    - value: static
      source: abs
      quote: For benchmarking purpose, we create four task suites (130 tasks in total)
      note: The procedural generator that 'can in principle generate infinitely many tasks', and the site's 'a
        benchmark that can continually grow', are not used to add evaluation tasks, which leaves the content
        static (0.9.0; this benchmark is the term's example).
  data.data_provenance:
    - value: synthetic-procedural
      source: abs
      quote: We develop an extendible procedural generation pipeline that can in principle generate infinitely
        many tasks.
    - value: simulation-generated
      source: paper
      quote: Our generation pipeline is built on top of Robosuite [76], a modular manipulation simulator that
        offers seamless integration.
  data.contamination_risk:
    - value: unknown
      note: No source assesses contamination. The tasks and demonstrations are public, and the protocol
        trains on them by design, so leakage in the language-model sense does not arise.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: All metrics are computed in terms of success rate
      note: Success rates are bounded at 100%, and the sources report no human or expert success rate; human
        teleoperators appear only as demonstration collectors.
  lifecycle:
    - value: null
      failure: 2026-09-28-libero-006
  activity:
    - value: no-submission-channel
      source: repo
      quote: we offer an evaluation script for you to evaluate models separately.
      note: There is no leaderboard or submission route; users run the script and publish in their own
        papers.
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: LARG, RPL, and Statistical Learning & AI groups at UT Austin
  governance.submission_process:
    - value: literature-only
      source: repo
      quote: we offer an evaluation script for you to evaluate models separately.
      note: No source describes a ranking. Beyond the paper's baselines, results appear in users' own papers.
  governance.independence_flags:
    - value: null
      failure: 2026-09-28-libero-009
  execution.compute_tier:
    - value: simulator-required
      source: paper
      quote: For all experiments, we use a single Nvidia A100 GPU or a single Nvidia A40 GPU (CUDA 11.7)
      note: A run needs the Robosuite/MuJoCo simulator, which takes precedence over the accelerator; the single
        A100 or A40 goes here (0.9.0; this benchmark is the term's example).
  execution.reproducibility_tier:
    - value: automatable-with-simulator
      source: repo
      quote: for benchmarking purpose, we fix the a set of initial states
  execution.reproducibility_blockers:
    - value: null
      source: paper
      quote: Our generation pipeline is built on top of Robosuite [76]
      failure: 2026-09-28-libero-011
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: we offer an evaluation script for you to evaluate models separately.
notes: >-
  0.9.0 makes LIBERO a near miss for grounding: the paper never claims grounding, and it scores task success,
  not whether an expression was attached to its referent, so 02 S11 rule 2 keeps it untagged.
  The corpus flag 'scoring metrics are not stated' is resolved by the paper: FWT, NBT and AUC, all computed
  from success rates.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, evaluation_method, designed_for_subjects, data.refresh,
      data.ceiling_anchor_type, activity, governance.submission_process, execution.compute_tier]
    note: Re-adjudicated against 0.9.0.

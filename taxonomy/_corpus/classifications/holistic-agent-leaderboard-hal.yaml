# taxonomy/_corpus/classifications/holistic-agent-leaderboard-hal.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: holistic-agent-leaderboard-hal
corpus_item: 47
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2510.11977
  abs: https://arxiv.org/abs/2510.11977
  home: https://hal.cs.princeton.edu/
  repo: https://github.com/princeton-pli/hal-harness
facets:
  domain.primary:
    - value: null
      source: abs
      quote: We validate the harness by conducting 21,730 agent rollouts across 9 models and 9 benchmarks in coding,
        web navigation, science, and customer service
      failure: 2026-09-28-holistic-agent-leaderboard-hal-001
  domain.secondary:
    - value: agents-tooluse/web-navigation
      source: home
      quote: Online Mind2Web Web Assistance
      note: AssistantBench, GAIA and Online Mind2Web are filed under Web Assistance.
    - value: code/repository-scale-se
      source: home
      quote: SWE-bench Verified Mini Software Engineering
      note: This follows swe-bench-verified, whose family SWE-bench Verified Mini belongs to.
    - value: agents-tooluse/tool-api-calling
      source: home
      quote: TAU-bench Airline Customer Service
      note: TAU-bench Airline belongs to the tau-bench family of corpus entry bench.
    - value: code/competitive-programming
      source: home
      quote: USACO Programming
  capability:
    - value: null
      source: home
      quote: The standardized, cost-aware, and third-party leaderboard for evaluating agents.
      failure: 2026-09-28-holistic-agent-leaderboard-hal-002
  evaluation_method:
    - value: execution-tests
      source: paper
      quote: It consists of 307 problems, complete with exhaustive test cases
      note: HAL runs each constituent benchmark's own scorer, so its methods are inherited. This quote is USACO.
        SWE-bench Verified Mini and SciCode are also scored by tests. The other constituents' scorers are not
        described in the fetched sources. HAL adds a cost axis and a Pareto frontier
        to every board (failure 002).
  designed_for_subjects:
    - value: agent-scaffold
      source: paper
      quote: This contract supports both task-specific scaffolds (which may operate within benchmark-defined
        environments) and generalist scaffolds that can be run across benchmarks.
      failure: 2026-09-28-holistic-agent-leaderboard-hal-003
    - value: full-product-pipeline
      source: home
      quote: Running Opus 4.5 with an updated scaffold that uses Claude Code drastically outperforms the CORE-Agent
        scaffold we used
      note: Claude Code, a shipped product, holds the top CORE-Bench Hard rows, as on terminal-bench-2-0.
  data.access:
    - value: fully-open
      source: paper
      quote: For GAIA and AssistantBench, we evaluate on publicly available test sets rather than the full private
        sets used for official leaderboards
      note: HAL uses only the public sets of its constituents. Some are wrapped against scraping with published
        passwords ("The password for the GPG file is `reproducibility`"), which does not restrict access.
  data.refresh:
    - value: null
      failure: 2026-09-28-holistic-agent-leaderboard-hal-004
  data.data_provenance:
    - value: null
      failure: 2026-09-28-holistic-agent-leaderboard-hal-005
  data.contamination_risk:
    - value: medium
      source: home
      quote: All agent traces are encrypted to prevent benchmark contamination through automated scraping.
      note: The constituents are public sets, and the paper documents agents "searching for the benchmark on
        HuggingFace instead of solving a task". That is answer lookup at run time, not a training route.
  data.ceiling_anchor_type:
    - value: none-known
      note: HAL states no ceiling of its own, and each board inherits its constituent's scale. The home page
        declares one board solved by manual rescoring ("We have now declared CORE-Bench solved"), which is not an
        anchor.
  lifecycle:
    - value: null
      source: repo
      quote: the repository is archived for historical reference
      failure: 2026-09-28-holistic-agent-leaderboard-hal-006
  activity:
    - value: closed
      source: repo
      quote: HAL is no longer accepting new result submissions through this harness.
      failure: 2026-09-28-holistic-agent-leaderboard-hal-007
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: By the SAgE team at Princeton University
  governance.submission_process:
    - value: null
      source: repo
      quote: Simple upload of agent traces to HuggingFace Hub via `hal-upload` CLI
      failure: 2026-09-28-holistic-agent-leaderboard-hal-008
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: a general-purpose agent scaffold of our creation (HAL Generalist Agent)
      note: The HAL Generalist Agent holds top rows on GAIA and TAU-bench Airline.
    - value: funded-by-evaluated-party
      source: home
      quote: We are grateful to OpenAI and Google for providing API credits to evaluate their models.
      failure: 2026-09-28-holistic-agent-leaderboard-hal-009
  execution.compute_tier:
    - value: api-credits-only
      source: abs
      quote: with a total cost of about $40,000
      note: The cost is model inference for 21,730 rollouts. The harness orchestrates Azure VMs, but the paper
        reports spend as API cost.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: repo
      quote: This repository provides a standardized evaluation harness for reproducible agent evaluations across
        various benchmarks.
  execution.reproducibility_blockers:
    - value: live-world-state
      source: paper
      quote: It does not rely on cached pages and allows real-time testing against dynamic and evolving web
        interfaces.
      note: Online Mind2Web runs on 136 live websites, and AssistantBench's tasks are web-search tasks.
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: One-stop shop evaluation harness for all benchmarks and agents
      note: The harness repository is now archived but still public.
notes: 'The corpus flags HAL as a meta-leaderboard that aggregates other benchmarks. Under 02 S11 rule 5 its nine
  boards are not tracks of a HAL family: each belongs to its own benchmark''s family. SWE-bench Verified Mini is a
  50-task subset in the swe-bench-verified family, and TAU-bench Airline is in the tau-bench family of corpus
  entry bench. The paper notes it uses "the original TAU-bench, though the newer τ2 Bench" exists. HAL adds a
  standard harness, cost accounting and log analysis, not tasks. Its results are third-party re-evaluations of
  those families, and the record classifies what HAL itself contributes. It inherits the rest (failures 001 and
  005).'

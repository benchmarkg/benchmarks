# taxonomy/_corpus/classifications/robotwin-2-0.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: robotwin-2-0
corpus_item: 13
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2506.18088
  abs: https://arxiv.org/abs/2506.18088
  home: https://robotwin-platform.github.io/
  repo: https://github.com/robotwin-Platform/RoboTwin
  leaderboard: https://robotwin-platform.github.io/leaderboard
facets:
  domain.primary:
    - value: robotics-embodiment/bimanual-manipulation
      source: home
      quote: we construct a suite of over 50 dual-arm collaborative manipulation tasks
      note: 0.9.0 decides bimanual-manipulation for the benchmark as a whole, and a suite built for two arms
        stays here although a few task names describe one-arm actions (this benchmark is the term's example).
  domain.secondary: []
  capability:
    - value: sensorimotor-control
      source: leaderboard
      quote: then evaluated 100 trials/task under demo_clean and demo_randomized.
    - value: distribution-shift-generalization
      source: paper
      quote: 'policies are tested with 100 rollouts under two conditions: Easy (clean) and Hard (domain-randomized
        with clutter, lighting, textures, and height variations)'
  evaluation_method:
    - value: simulation-rollout
      source: paper
      quote: We report success rates as indicators of few-shot adaptation and robustness.
      note: The real-arm runs on four tasks (COBOT-Magic) validate the data generator and are not a scored
        track, so physical-trial is not tagged (0.9.0 exclusion; this benchmark is its near miss).
  designed_for_subjects:
    - value: rl-policy
      source: paper
      quote: All VLAs are fine-tuned from their released pretrained weights in the single-task setting.
  data.access:
    - value: fully-open
      source: abs
      quote: We release the data generator, benchmark, dataset, and code to support scalable research in robust
        bimanual manipulation.
  data.refresh:
    - value: versioned-releases
      source: repo
      quote: 'Latest Version: RoboTwin 2.0'
  data.data_provenance:
    - value: simulation-generated
      source: abs
      quote: We present RoboTwin 2.0, a scalable framework for automated, large-scale generation of diverse
        and realistic data
    - value: model-generated
      source: abs
      quote: we design an expert data synthesis pipeline that leverages multimodal language models (MLLMs)
        and simulation-in-the-loop refinement to automatically generate task-level execution code.
    - value: synthetic-procedural
      source: abs
      quote: 'RoboTwin 2.0 applies structured domain randomization along five axes: clutter, lighting, background,
        tabletop height, and language'
  data.contamination_risk:
    - value: unknown
      note: No source assesses contamination. The evaluation seeds come from the same public generator as
        the released training data, and whether a submission trained on randomized data breaks the 'demo_clean'
        rule is not checked in any source.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: We report success rates as indicators of few-shot adaptation and robustness.
      note: Success rates are bounded at 100%, and no human or expert success rate is reported; humans appear
        only in the texture-library filtering ('human-in-the-loop verification').
  lifecycle:
    - value: active
      source: leaderboard
      quote: Results here are reproduced via the XPolicyLab standard interface.
      note: The repository dates XPolicyLab-based evaluation to 2026/08/03, so the board's rows were produced
        or reproduced after that date.
  activity:
    - value: leaderboard-live-no-round
      source: leaderboard
      quote: To submit results or request listing, contact
      note: The benchmark ran CVPR 2025 challenge rounds, now on archived branches, and none is running, so
        the standing leaderboard takes precedence over accepting-submissions (0.9.0).
  governance.maintainer_type:
    - value: community-collective
      source: home
      quote: '*Equal contribution ✉Corresponding authors †Equally leading organizations'
      note: The code sits in a shared organisation account (robotwin-Platform) and the board is credited to the
        'RoboTwin Team', drawn from 16 institutions (SJTU, HKU MMLab, Shanghai AI Lab, D-Robotics, TeleAI and
        others). Two organisations lead equally, so no single institution is stated as the holder, and no
        legal form is stated.
  governance.submission_process:
    - value: publication-gated
      source: leaderboard
      quote: a model must provide publicly released code, publicly released weights, and a technical report
        (arXiv paper or equivalent public document) describing the method.
    - value: open-source-gated
      source: leaderboard
      quote: To be listed on this leaderboard, a model must provide publicly released code, publicly released
        weights
    - value: sandboxed-rerun
      source: leaderboard
      quote: Results here are reproduced via the XPolicyLab standard interface.
  governance.independence_flags:
    - value: null
      source: leaderboard
      quote: 'Contributor: RoboTwin Team'
      failure: 2026-09-28-robotwin-2-0-004
  execution.compute_tier:
    - value: simulator-required
      source: repo
      quote: The scheduler starts a policy server and simulator per task on your GPU pool.
      note: The simulator takes precedence over the accelerator count, and the 4 to 8 GPUs of VLA fine-tuning
        are training, which is excluded (0.9.0; this benchmark is multi-gpu-node's near miss).
  execution.reproducibility_tier:
    - value: automatable-with-simulator
      source: repo
      quote: All evaluation goes through `scripts/eval_policy.sh`.
  execution.reproducibility_blockers:
    - value: null
      failure: 2026-09-28-robotwin-2-0-006
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: All evaluation goes through `scripts/eval_policy.sh`.
notes: >-
  RoboTwin 2.0 is a data generator and a benchmark in one release. Its 50-task sim benchmark ('50 demo_clean
  trajectories x 50 tasks ... evaluated 100 trials/task') is classified, and its code-generation evaluation and
  sim-to-real data experiments are treated as framework validation. The leaderboard page also
  embeds RoboDojo sim and real boards, which belong to a different benchmark. Aloha-AgileX is the simulated
  embodiment, and the real-world runs used the COBOT-Magic platform in a paper experiment, not a track, as
  0.9.0's corrected physical-trial example says.
  cross-embodiment-transfer is not tagged as secondary, because the sources report per-embodiment success
  rates, not train-on-one, test-on-another transfer.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, evaluation_method, data.ceiling_anchor_type, activity,
      governance.maintainer_type, governance.submission_process, execution.compute_tier]
    note: Re-adjudicated against 0.9.0.

# taxonomy/_corpus/classifications/omol25.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: omol25
corpus_item: 35
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2505.08762
  abs: https://arxiv.org/abs/2505.08762
  home: https://huggingface.co/facebook/OMol25
  lbcontent: https://huggingface.co/spaces/facebook/fairchem_leaderboard/raw/main/content.py
  lbconfig: https://facebook-fairchem-leaderboard.hf.space/config
facets:
  domain.primary:
    - value: chemistry-materials/force-fields-potentials
      source: abs
      quote: Machine learning (ML) models hold the promise of transforming atomic simulations by delivering quantum chemical
        accuracy at a fraction of the computational cost.
      note: The headline task is S2EF against wB97M-V DFT energies and forces. arXiv files the paper under physics.chem-ph,
        but the physics exclusion names OMol25 and sends molecular systems to chemistry-materials.
  domain.secondary:
    - value: chemistry-materials/molecular-property-prediction
      source: lbcontent
      quote: Ionization energy and electron affinity
      note: The downstream evaluations (ligand strain, conformer energies, protonation energies, IE/EA, spin gaps) score
        molecular properties computed with the potential.
  capability:
    - value: scientific-prediction
      source: abs
      quote: Machine learning (ML) models hold the promise of transforming atomic simulations by delivering quantum chemical
        accuracy at a fraction of the computational cost.
      note: Entrants predict energies, forces and derived molecular properties, scored against wB97M-V DFT, a reference
        computation (ADR-0014).
    - value: distribution-shift-generalization
      source: paper
      quote: To test generalizability beyond just out-of-distribution (OOD) compositions, we also generate several explicit
        OOD splits.
      note: The main test split holds out compositions, and the M-Lig, PDB-TM, Reactivity, COD and Anions splits are
        reported separately (Table 3).
  evaluation_method:
    - value: statistical-fit
      source: paper
      quote: The per-atom mean absolute error (MAE) is used as the primary evaluation metric
      note: The downstream evaluations are also MAEs of energy differences, plus RMSDs between DFT- and MLIP-optimised
        structures.
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: abs
      quote: Machine learning (ML) models hold the promise of transforming atomic simulations by delivering quantum chemical
        accuracy at a fraction of the computational cost.
  data.access:
    - value: train-open-test-held-out
      source: paper
      quote: All training and validations splits are made publicly available.
      note: Test scores come only from the leaderboard, which evaluates uploaded prediction files. Under 0.9.0 withheld
        test labels take precedence over the gate on the Hugging Face repository (contact details, and no access from
        sanctioned jurisdictions, China, Russia or Belarus), which is a lesser layer recorded here.
  data.refresh:
    - value: versioned-releases
      source: paper
      quote: A pre-release version of the OMol25 dataset was initially published on arXiv on May 13, 2025 along with
        models.
      note: OMol-0 (about 100M DFT points) and OMol-1 (40M more); the leaderboard records training sets as OMol-102M
        or OMol-140M.
  data.data_provenance:
    - value: simulation-generated
      source: abs
      quote: a large-scale dataset composed of more than 100 million density functional theory (DFT) calculations at
        the
      note: Some input geometries come from existing community datasets; every label is a new DFT calculation.
  data.contamination_risk:
    - value: low
      source: paper
      quote: All training and validations splits are made publicly available.
      note: The test labels are withheld, and the main test split holds out whole compositions. No source assesses leakage
        of the released test inputs.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: The per-atom mean absolute error (MAE) is used as the primary evaluation metric
      note: The DFT reference is the ground truth, so zero error is the headline metric's bound, and no source reports a
        human or measured ceiling. Under 0.9.0 a bounded headline with no measured anchor is theoretical-maximum.
  lifecycle:
    - value: active
      source: lbconfig
      quote: '"COSMO (EPFL)", true, "Other", 186.66766122250286, 4.271608522452373, "2026-04-21"'
      note: A third-party row dated 2026-04-21; the newest rows are dated 2026-09-14 (Meta).
  activity:
    - value: accepting-submissions
      source: lbcontent
      quote: 'Ready to submit your model? Check out our steps for running benchmarks and generating prediction files:'
  governance.maintainer_type:
    - value: industry-lab
      source: abs
      quote: Meta FAIR introduces Open Molecules 2025 (OMol25)
  governance.submission_process:
    - value: held-out-server
      source: lbcontent
      quote: Results will appear on the leaderboard after successful validation
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: abs
      quote: In addition to the public release of the data, we provide baseline models
      note: Meta's eSEN, GemNet-OC and UMA models are ranked on the leaderboard alongside third-party entries such as
        COSMO (EPFL), MACE-Cambridge and JSR Corporation.
  execution.compute_tier:
    - value: null
      source: paper
      quote: All models were trained on Nvidia H100 80GB GPU cards
      failure: 2026-09-28-omol25-003
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: lbcontent
      quote: Upload your file and click Submit Eval
      note: Test and evaluation-task scores come only from the maintainer-run leaderboard; validation scores are reproducible
        locally.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: paper
      quote: All training and validations splits are made publicly available.
  execution.harness_availability:
    - value: reference-implementation-only
      source: lbcontent
      quote: 'Ready to submit your model? Check out our steps for running benchmarks and generating prediction files:'
      note: The published code runs the benchmark and writes prediction files; the official test and evaluation scores
        are computed by the leaderboard against withheld labels, which 0.9.0's official-harness exclusion sends here.
notes: The corpus url is the gated Hugging Face model repository; the leaderboard is the FAIR Chemistry leaderboard Space,
  read through its content.py and its served Gradio config (the Space page itself is an empty shell). The corpus flag
  says evaluation metrics were not in the fetched abstract; the full paper defines them (S2EF MAE plus six downstream
  evaluations).
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, data.access, data.ceiling_anchor_type, execution.harness_availability]
    note: Re-adjudicated against 0.9.0; scientific-prediction and the access precedence rule settle two failures, and
      compute_tier stays source-silent.

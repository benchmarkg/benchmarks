# taxonomy/_corpus/classifications/medagentbench-v2.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: medagentbench-v2
corpus_item: 29
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://psb.stanford.edu/psb-online/proceedings/psb26/chen_eric.pdf
  home: https://github.com/ericoericochen/medagentbenchv2
facets:
  domain.primary:
    - value: medicine-health/clinical-agent-workflows
      source: home
      quote: MedAgentBench is the first benchmark for evaluating LLM agents on clinical tasks in a FHIR-compliant
        EHR.
  domain.secondary:
    - value: agents-tooluse/tool-api-calling
      source: paper
      quote: To interact with the EHR, the agent must issue FHIR- compliant API calls.
  capability:
    - value: tool-use
      source: paper
      quote: we introduced structured tools for each FHIR interaction, such as fhir patient search, fhir observation
        search, and fhir service request create.
    - value: temporal-reasoning
      source: paper
      quote: Each function encoded task-specific clinical rules, often involving multi-step temporal logic, conditional
        branches, or medication dosing thresholds.
    - value: quantitative-reasoning
      source: paper
      quote: Several tasks required the agent to perform math reasoning, such as averaging blood glucose readings
        over time or computing time differences between clinical events.
  evaluation_method:
    - value: constraint-check
      source: paper
      quote: The evaluation logic also verified that all FHIR resources posted by the agent included correct fields
        such as resourceType, intent, status, and subject.reference.
      failure: 2026-09-28-medagentbench-v2-001
    - value: exact-match
      source: paper
      quote: For patients with no qualifying data, the agent returned a single “-1,” while the evaluator expected
        a pair (-1, -1).
      note: Returned values are matched exactly in form; the reported metric is "success rate at pass@1".
  designed_for_subjects:
    - value: agent-scaffold
      source: paper
      quote: Using GPT-4.1 as the base model, our agent achieved a success rate of 91.0% without memory and 98.0%
        with memory.
  data.access:
    - value: fully-open
      source: home
      quote: The new tasks are located in `/medagentbench_v2/src/MedAgentBench/data/medagentbench/test_data_v2.json`
  data.refresh:
    - value: versioned-releases
      source: paper
      quote: To that end, we added 300 new tasks, expanding the benchmark with increased variety and difficulty.
      failure: 2026-09-28-medagentbench-v2-002
  data.data_provenance:
    - value: model-generated
      source: paper
      quote: These inputs were given to o3 with the instruction to produce 10 novel, clinically relevant tasks per
        patient.
      note: An internal medicine physician rated the o3-generated tasks and chose the 10 task types; 30 variations
        each were made by substituting patient MRNs.
      failure: 2026-09-28-medagentbench-v2-003
  data.contamination_risk:
    - value: unknown
      note: The tasks are public on GitHub (test_data_v2.json) and nothing assesses contamination. The paper's blinding
        concerns the authors' own agent tuning, not training-data leakage.
  data.ceiling_anchor_type:
    - value: none-known
      note: No human performance is reported. The paper's "greater than 95% accuracy" is a deployment-safety threshold,
        not a measured anchor.
  lifecycle:
    - value: null
      failure: 2026-09-28-medagentbench-v2-004
  activity:
    - value: null
      failure: 2026-09-28-medagentbench-v2-005
  governance.maintainer_type:
    - value: individual
      source: paper
      quote: 'Code is publicly available at: https://github.com/ericoericochen/medagentbenchv2.'
      failure: 2026-09-28-medagentbench-v2-006
  governance.submission_process:
    - value: null
      failure: 2026-09-28-medagentbench-v2-007
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: To contribute to the benchmark and evaluate the generalization of our agent, we developed 300 new multi-step
        clinically-driven tasks in collaboration with a physician.
      note: 'The authors mitigated this with a blinded split: the co-author who ran the agent had no prior knowledge
        of the new tasks.'
  execution.compute_tier:
    - value: api-credits-only
      source: home
      quote: Create an `.env` in `/medagentbench_v2` and set `OPENAI_API_KEY = <YOUR_KEY>`
      note: A local FHIR server runs in Docker; the run cost is OpenAI API spend.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: Run FHIR server docker ```bash ./bin/run_emr.sh ```
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: Calculates overall and per-task accuracy from the collected responses.
notes: 'Classified as the corpus defines it: MedAgentBench v2 = the PSB 2026 paper plus its repository, whose task
  set is the original 300 MedAgentBench tasks and 300 new ones. v1 (arXiv 2501.14654, stanfordmlgroup/MedAgentBench)
  is the same family and was not re-fetched. Failure 002 records the family ambiguity.'

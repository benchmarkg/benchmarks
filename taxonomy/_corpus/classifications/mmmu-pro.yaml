# taxonomy/_corpus/classifications/mmmu-pro.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: mmmu-pro
corpus_item: 9
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2409.02813
  abs: https://arxiv.org/abs/2409.02813
  home: https://mmmu-benchmark.github.io/
  repo: https://github.com/MMMU-Benchmark/MMMU
  hf: https://huggingface.co/datasets/MMMU/MMMU_Pro
facets:
  domain.primary:
    - value: multimodal/visual-qa
      source: abs
      quote: MMMU-Pro rigorously assesses multimodal models' true understanding and reasoning capabilities
      note: Every scored item needs the image, because text-answerable questions are filtered out, and the
        changes concern the image-text relation, so 0.9.0 sends the exam to multimodal however many subjects it
        spans (general-intelligence exclusion; visual-qa's not_to_be_confused_with).
  domain.secondary:
    - value: multimodal/chart-diagram-understanding
      source: home
      quote: Our benchmark aims to cover college-level knowledge with 30 image formats including diagrams,
      note: MMMU-Pro inherits MMMU's image types, in which diagrams, tables and plots are the most frequent.
    - value: general-intelligence/multi-subject-knowledge-exams
      source: home
      quote: These questions span 30 subjects and 183 subfields
      note: The breadth claim of the MMMU family, recorded as secondary because every MMMU-Pro item needs the
        image (ADR-0015).
  capability:
    - value: perception
      source: home
      quote: 'MMMU is designed to measure three essential skills in LMMs: perception, knowledge, and reasoning.'
    - value: knowledge-recall
      source: paper
      quote: college-level tasks that require subject-specific knowledge and deliberate reasoning
    - value: context-integration
      source: abs
      quote: (1) filtering out questions answerable by text-only models
      note: The filter keeps only items whose answer depends on the supplied image, which is the INC's
        "supplies the material that determines the answer".
  evaluation_method:
    - value: multiple-choice
      source: paper
      quote: The model is required to answer a multiple-choice question with up to 10 options, each embedded
        within a screenshot or photo.
      note: The augmented setting usually has 10 options, so the chance baseline is about 10%. The headline is
        the average of the settings under one method, which is not composite.
  designed_for_subjects:
    - value: instruction-tuned-model
      source: abs
      quote: We explore the impact of OCR prompts and Chain of Thought (CoT) reasoning, finding that OCR prompts
        have minimal effect while CoT generally improves performance.
      note: human-expert is not tagged, because the human figures are estimated from the original MMMU
        evaluation data rather than produced under the MMMU-Pro protocol.
  data.access:
    - value: fully-open
      source: hf
      quote: 'License: apache-2.0'
      note: The Hugging Face dataset is ungated.
  data.refresh:
    - value: versioned-releases
      source: hf
      quote: Fixed incorrect ground-truth answer labels.
      note: The maintainers' dataset card dates each change to the MMMU-Pro items, from 2024-10-20 to
        2026-07-10, and a dated erratum is a pin (0.9.0).
  data.data_provenance:
    - value: exam-derived
      source: home
      quote: MMMU includes 11.5K meticulously collected multimodal questions from college exams, quizzes, and
        textbooks
    - value: inherited-from-constituents
      source: abs
      quote: This paper introduces MMMU-Pro, a robust version of the Massive Multi-discipline Multimodal
        Understanding and Reasoning (MMMU) benchmark.
      note: The items are MMMU questions, filtered and re-optioned; MMMU's own sources document their
        provenance.
    - value: model-generated
      source: paper
      quote: Specifically, GPT-4o generates and Claude 3.5 filters the options, followed by two rounds of human
        review to refine and verify the augmented options.
    - value: real-world-instrument
      source: paper
      quote: The images were manually captured by annotators in diverse display environments to reflect
        real-world cases.
      note: The photographs taken for the benchmark's vision-only setting (ADR-0020).
  data.contamination_risk:
    - value: medium
      source: hf
      quote: 'License: apache-2.0'
      note: The questions are public and static, and they derive from MMMU, whose test answers were released
        in 2026 ("We have released the answers for the MMMU test set!"). This is the honest default for a
        public static set, and no source assesses leakage.
  data.ceiling_anchor_type:
    - value: expert-average
      source: paper
      quote: Estimated human performance on MMMU-Pro across different disciplines, based on the original MMMU
        evaluation data.
      note: The anchor is expert performance, estimated from MMMU's measured human evaluation as low, medium
        and high bands (73.0, 80.8, 85.4 overall). That it is an estimate belongs on the Baseline record, not in
        the type (ADR-0020).
  lifecycle:
    - value: null
      failure: 2026-09-28-mmmu-pro-010
  activity:
    - value: unknown
      note: "The project page carries the maintainers' table (\"Last updated: 09/05/2025\") with no submission instructions fetched; Hugging Face's board is not a maintainer source (reviewer ruling, P1-S1-T03)."
  governance.maintainer_type:
    - value: community-collective
      source: hf
      quote: 'Datasets: MMMU / MMMU_Pro'
      note: The dataset and repository sit in shared organisation accounts (MMMU on Hugging Face,
        MMMU-Benchmark on GitHub) of the 'MMMU Team', whose authors span several institutions (Ohio State and
        Waterloo among them). No single institution is stated as the holder, and no legal form is stated.
  governance.submission_process:
    - value: self-reported
      source: home
      quote: '*: results provided by the authors.'
      note: The rows marked this way; no source says anyone checks them.
    - value: maintainer-run
      source: paper
      quote: we evaluate a diverse set of state-of-the-art multimodal models as baselines
      note: The unmarked rows of the maintainers' leaderboard are the MMMU Team's own runs.
  governance.independence_flags:
    - value: null
      failure: 2026-09-28-mmmu-pro-008
  execution.compute_tier:
    - value: api-credits-only
      source: paper
      quote: we evaluate a diverse set of state-of-the-art multimodal models as baselines
      note: The leaderboard includes API models (GPT-4o, Claude 3.5 Sonnet, Gemini 1.5 Pro). Serving open
        weights on one GPU or a node is the entrant's choice (0.9.0 precedence rule).
  execution.reproducibility_tier:
    - value: fully-automatable
      source: repo
      quote: This repo contains the evaluation code for the paper
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: This repo contains the evaluation code for the paper
notes: The corpus flags that the URL is the shared MMMU and MMMU-Pro project page and that no maintainer is
  stated; 0.9.0's holder rule reads the shared MMMU accounts. The 'perception, knowledge, and reasoning' claim
  names no reasoning form, and ADR-0020 rejects a catch-all reasoning term, so that part is recorded here. MMMU-level statements on the shared page and README
  (skills, provenance, leaderboard notes) are used only where MMMU-Pro inherits them unchanged.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, domain.secondary, capability, data.refresh, data.data_provenance,
      data.ceiling_anchor_type, governance.maintainer_type, governance.submission_process,
      execution.compute_tier]
    note: Re-adjudicated against 0.9.0; the Hugging Face dataset card dates the item fixes.

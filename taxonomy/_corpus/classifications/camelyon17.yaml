# taxonomy/_corpus/classifications/camelyon17.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: camelyon17
corpus_item: 32
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  epmc: https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&resultType=core&query=DOI:10.1109/TMI.2018.2867350
  home: https://camelyon17.grand-challenge.org/
  background: https://camelyon17.grand-challenge.org/Background/
  evaluation: https://camelyon17.grand-challenge.org/Evaluation/
  data: https://camelyon17.grand-challenge.org/Data/
  rules: https://camelyon17.grand-challenge.org/Rules/
  organisers: https://camelyon17.grand-challenge.org/Organisers/
  lbdata: https://camelyon17.grand-challenge.org/evaluation/challenge/leaderboard/?draw=1&start=0&length=10
facets:
  domain.primary:
    - value: medicine-health/medical-imaging-diagnostic
      source: evaluation
      quote: The task in this challenge is to determine a pN-stage for every patient in the test dataset.
      note: The scored output is a pathologic staging category against a pathologist-supervised reference. Under
        0.9.0 the claim decides, not the metric, so vision/medical-imaging-cv does not pull it away and the vision
        task goes to secondary.
  domain.secondary:
    - value: vision/classification
      source: background
      quote: The aim of CAMELYON17 is to evaluate new and existing algorithms for automated detection and classification
        of breast cancer metastases in whole-slide images of histological lymph node sections.
      note: The vision task behind the clinical primary; the scored output is a category per patient.
  capability:
    - value: perception
      source: background
      quote: The aim of CAMELYON17 is to evaluate new and existing algorithms for automated detection and classification
        of breast cancer metastases in whole-slide images of histological lymph node sections.
  evaluation_method:
    - value: classification-metric
      source: evaluation
      quote: For the evaluation of the results we use five class quadratic weighted kappa where the classes are
        the pN-stages.
      note: Cohen's kappa between predicted and reference pN-stage labels is a classification metric under 0.9.0.
  designed_for_subjects:
    - value: domain-specialist-model
      source: epmc
      quote: All these participants used convolutional neural networks in combination with pre- and postprocessing
        steps.
      note: Entrants are purpose-built histopathology pipelines trained on the CAMELYON16 and CAMELYON17 data.
  data.access:
    - value: train-open-test-held-out
      source: data
      quote: These slides are not annotated and not labelled. A pN-stage per patient is also not given.
      note: All slides, training and test, are open access under CC0 without registration; only the test pN-stage
        labels are withheld. A grand-challenge.org account is needed to submit, not to download.
  data.refresh:
    - value: static
      source: data
      quote: The test data set was released in March 2017.
      note: One test set of 100 patients (500 slides), unchanged since release; the leaderboard reopened on it
        in May 2017.
  data.data_provenance:
    - value: real-world-instrument
      source: data
      quote: The data set for CAMELYON17 is collected from 5 medical centres in the Netherlands.
      note: Whole-slide scans of H&E-stained lymph node sections.
    - value: expert-authored
      source: data
      quote: All ground truth annotations were carefully prepared under supervision of expert pathologists.
  data.contamination_risk:
    - value: medium
      source: data
      quote: CAMELYON16 and CAMELYON17 data sets are open access and shared publicly on GigaScience, Google Drive
        and on Baidu Pan.
      note: The test labels are withheld, but the test slides have been public since March 2017, so a route through
        semi-supervised or transductive use of the test images is plausible. No source assesses it.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: evaluation
      quote: For the evaluation of the results we use five class quadratic weighted kappa where the classes are
        the pN-stages.
      note: Kappa is bounded at 1 (perfect agreement), and no fetched source reports a measured anchor such as pathologist
        agreement on the pN-stage task. Under 0.9.0 a bounded headline metric with no measured anchor is theoretical-maximum,
        not none-known. The 0.93 of combined top algorithms is an ensemble of entrants, not an anchor.
  lifecycle:
    - value: null
      source: lbdata
      quote: 20 Dec. 2021
      failure: 2026-09-28-camelyon17-003
  activity:
    - value: leaderboard-live-no-round
      source: home
      quote: The CAMELYON17 challenge is still open for submissions!
      note: 'The formal round closed with the ISBI 2017 workshop ("1 April 2017: Submission deadline for results");
        the leaderboard reopened afterwards ("15 May 2017: Submission re-opened!").'
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: organised by the Diagnostic Image Analysis Group (DIAG) and Department of Pathology of the Radboud University
        Medical Center
  governance.submission_process:
    - value: held-out-server
      source: rules
      quote: Evaluation of classification results uploaded to this website will be made publicly available on the
        Results page of this site
      note: Entrants upload predicted pN-stages for the released test slides; the site scores them against the
        withheld labels.
    - value: publication-gated
      source: rules
      quote: To participate in the challenge and have your results visible on this website it is mandatory to submit
        a link to a 4-page paper
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: data
      quote: These slides are not annotated and not labelled. A pN-stage per patient is also not given.
      note: The organisers hold the test labels and every score comes from their server. Whether organiser groups
        also entered cannot be read, because only the 10 lowest-ranked of 121 leaderboard rows were served; the
        Sponsors section is image-only.
  execution.compute_tier:
    - value: null
      failure: 2026-09-28-camelyon17-004
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: data
      quote: These slides are not annotated and not labelled. A pN-stage per patient is also not given.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: data
      quote: These slides are not annotated and not labelled. A pN-stage per patient is also not given.
  execution.harness_availability:
    - value: null
      failure: 2026-09-28-camelyon17-005
notes: The primary paper (IEEE TMI) is not open access; its PubMed page is a 170-character stub, so the paper is
  represented by its Europe PMC record (title, authors, abstract). The Rules, Organisers and Background pages were
  fetched for this record. The leaderboard page renders by script; the lbdata source is its DataTables endpoint,
  flattened to text, which reported 121 entries but served only 10 rows. The pN-stage task scores artificial patients
  assembled from mixed real slides; under 0.9.0 they take the slides' provenance (the synthetic-procedural near miss).
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, domain.secondary, evaluation_method, data.data_provenance, data.ceiling_anchor_type]
    note: Re-adjudicated against 0.9.0; classification-metric and the synthetic-procedural exclusion close both escape
      hatches, and the three source-silent gaps remain.

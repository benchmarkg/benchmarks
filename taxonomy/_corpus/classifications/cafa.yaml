# taxonomy/_corpus/classifications/cafa.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: cafa
corpus_item: 21
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://doi.org/10.1186/s13059-019-1835-8
  home: https://biofunctionprediction.org/cafa/
  kaggle: https://www.kaggle.com/competitions/cafa-6-protein-function-prediction
facets:
  domain.primary:
    - value: biology-genetics/protein-function-prediction
      source: home
      quote: The predictors then predict the function of these proteins by associating them with Gene Ontology terms
        or Human Phenoytpe Ontology terms
  domain.secondary: []
  capability:
    - value: null
      source: home
      quote: A major challenge in the field of bioinformatics is to predict the function of a protein from its sequence
        or structure.
      failure: 2026-09-28-cafa-001
  evaluation_method:
    - value: prospective-resolution
      source: home
      quote: Following the prediction deadline, we wait for several months. During that time, some proteins whose
        function were unknown experimentally have received experimental verification
    - value: domain-metric
      source: paper
      quote: the Smin is based on the remaining uncertainty/missing information (RU-MI) curve as described in [51]
        (Fig. 4), where S stands for semantic distance.
      note: Smin weights GO terms by information content and is specific to ontology annotation; Fmax and AUROC,
        also reported, are general-purpose statistics and are not tagged.
    - value: wet-lab-validation
      source: paper
      quote: we used CAFA predictions to select genes from D. melanogaster and assay them for long-term memory involvement
      failure: 2026-09-28-cafa-002
  designed_for_subjects:
    - value: domain-specialist-model
      source: home
      quote: an experiment designed to provide a large-scale assessment of computational methods dedicated to predicting
        protein function
    - value: classical-algorithm
      source: paper
      quote: Two baseline models were also computed for these evaluations. The Naïve method assigns the term frequency
        as the prediction score for any protein, regardless of any protein-specific properties.
      note: BLAST sequence-similarity transfer is the second non-learned baseline.
  data.access:
    - value: null
      source: home
      quote: CAFA 5 is now open for registration and submission on Kaggle.
      failure: 2026-09-28-cafa-003
  data.refresh:
    - value: resolves-over-time
      source: paper
      quote: In CAFA1, we adopted a time-delayed evaluation method, where protein sequences that lacked experimentally
        verified annotations, or targets, were released for prediction.
      failure: 2026-09-28-cafa-004
  data.data_provenance:
    - value: experimental-measurement
      source: paper
      quote: computational predictions and assessment goals drove some of the experimental assays, resulting in
        new functional annotations for more than 1000 genes
      note: 'The curation-driven benchmark also rests on experimental evidence: benchmark proteins are those that
        gained experimental annotation after the deadline.'
  data.contamination_risk:
    - value: low
      source: paper
      quote: The crux of a time-delayed challenge is the annotation growth period between time t0 and t1.
      failure: 2026-09-28-cafa-005
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: The perfect prediction should have Fmax=1, at the top right corner of the plot.
      note: Annotations are incomplete (the open-world problem the paper notes for Smin), so the achievable maximum
        is below the bound; no measured ceiling is reported.
  lifecycle:
    - value: null
      source: kaggle
      quote: CAFA 6 Protein Function Prediction
      failure: 2026-09-28-cafa-006
  activity:
    - value: unknown
      note: The official page still announces CAFA 5 (predictions due 2023-08-21); the CAFA 6 Kaggle page renders
        client-side and yields only its title, so the current round state was not observed.
  governance.maintainer_type:
    - value: community-collective
      source: paper
      quote: The Critical Assessment of Functional Annotation (CAFA) is an ongoing, global, community-driven effort
        to evaluate and improve the computational annotation of protein function.
      failure: 2026-09-28-cafa-007
  governance.submission_process:
    - value: assessment-committee
      source: home
      quote: CAFA assessors will carry out evaluations following this date, as more experimentally annotated results
        accumulate.
      note: True of the CAFA1-4 reports; the Kaggle-hosted CAFA 5 and 6 also carry a leaderboard.
  governance.independence_flags:
    - value: no-known-conflict
      source: paper
      quote: The authors declare that they have no competing interests.
      note: Participants are co-authors ("All other co-authors developed the computational function prediction methods
        participating in the challenge"); the sources do not say that an organiser entered a method.
  execution.compute_tier:
    - value: wet-lab
      source: paper
      quote: we performed experimental whole-genome mutation screening in Candida albicans and Pseudomonas aureginosa
        genomes
      note: CAFA3 ran its own screens; in every edition the ground truth is experimental annotation that accrues
        after the deadline.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: Zhou N, Gerten M, Friedberg I. CAFA_assessment_tool. Zenodo. 2019.
      note: Re-scoring a closed edition against its released benchmark set is automatic; a blind run needs a new
        annotation-growth period.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: Zhou N, Gerten M, Friedberg I. CAFA_assessment_tool. Zenodo. 2019. https://doi.org/10.5281/zenodo.3401694.
notes: The corpus entry is the generic, recurring CAFA; its primary paper is the CAFA3 report, so edition-specific
  features (the CAFA3 genome-wide screens, CAFA-pi) are read as family features and flagged where they decide a
  field. The official page is stale (last lists CAFA 5, 2023).

# taxonomy/_corpus/classifications/tanks-and-temples.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: tanks-and-temples
corpus_item: 65
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://storage.googleapis.com/t2-downloads/paper/tanks-and-temples.pdf
  home: https://www.tanksandtemples.org/
  license: https://www.tanksandtemples.org/license/
  tutorial: https://www.tanksandtemples.org/tutorial/
  repo: https://github.com/IntelVCL/TanksAndTemples
facets:
  domain.primary:
    - value: vision/3d-reconstruction
      source: home
      quote: We present a benchmark for image-based 3D reconstruction.
      note: Entrants receive uncalibrated video or image sets and must recover camera poses as well as geometry, which
        is 3d-reconstruction ('regardless of how it was obtained') rather than multi-view-stereo ('with calibrated views
        given'), per domains.yaml's not_to_be_confused_with note.
  domain.secondary: []
  capability:
    - value: perception
      source: home
      quote: High-resolution video sequences are provided as input, supporting the development of novel pipelines that
        take advantage of video input to increase reconstruction fidelity.
      note: The score measures geometry recovered from the video. spatial-reasoning's EXC excludes reconstruction accuracy.
  evaluation_method:
    - value: domain-metric
      source: tutorial
      quote: Our evaluation computes F-score using the following equations.
      note: F-score of precision and recall of point-to-point distances at a scene-specific threshold tau, a 3D-reconstruction
        metric rather than the general-purpose classification F-score.
  designed_for_subjects:
    - value: classical-algorithm
      source: paper
      quote: We have evaluated many SfM+MVS pipelines on the presented benchmark.
      note: COLMAP, VisualSFM, MVE and PMVS are non-learned solvers, and 0.9.0's classical-algorithm covers a non-learned
        method whether it competes for the ranking or is a baseline. Later learned MVS and radiance-field entrants are
        claim-level subjects of their rows; the 2017 benchmark was built for these pipelines.
  data.access:
    - value: train-open-test-held-out
      source: tutorial
      quote: The reconstruction of training set can be evaluated using public ground truth.
      note: Input images and videos are distributed for every scene, and training-scene ground truth is public. Test
        ground truth is withheld ('the ground truth geometries are not public'). Submitting needs an account.
  data.refresh:
    - value: static
      source: license
      quote: we are under no obligation to provide either maintenance services, update services
      note: The 2017 set (intermediate, advanced and training scenes) has no version history on any fetched page.
  data.data_provenance:
    - value: real-world-instrument
      source: home
      quote: Ground-truth data was captured using an industrial laser scanner.
      note: Inputs are video from Sony a7S II and DJI X5R cameras; ground truth is industrial laser scans.
  data.contamination_risk:
    - value: low
      source: tutorial
      quote: It is based on the same evaluation pipeline used for the offline case, but the ground truth geometries are
        not public.
      note: Only the test ground truth could leak, and it is held by the server. No source assesses contamination.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: tutorial
      quote: is defined to lie in the range [0,100] and can be interpreted as a percentage.
      note: Precision and recall lie in [0,100], so the F-score tops out at 100.
  lifecycle:
    - value: null
      source: repo
      quote: This project will no longer be maintained by Intel.
      failure: 2026-09-28-tanks-and-temples-004
  activity:
    - value: unknown
      note: The leaderboard page answers automated requests with a math challenge ('This simple verification helps
        protect our leaderboard from automated access'), and submission sits behind a login. No fetched source dates
        a result or says whether submissions are still scored. The site footer reads '© 2025'.
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: ARNO KNAPITSCH, JAESIK PARK, QIAN-YI ZHOU, and VLADLEN KOLTUN, Intel Labs
      note: Intel Labs originated the benchmark and holds the repository (IntelVCL), which it has discontinued. Who now
        runs the website and evaluation server is not stated (corpus flag 'maintainer not stated'). Under 0.9.0 an unmaintained
        benchmark keeps its originator's type, and the decay goes to maintenance_status.
  governance.submission_process:
    - value: held-out-server
      source: tutorial
      quote: This case uses a dedicated server for the evaluation.
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: paper
      quote: Ground truth data for the benchmark sequences will be withheld
  execution.compute_tier:
    - value: null
      failure: 2026-09-28-tanks-and-temples-003
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: tutorial
      quote: It is based on the same evaluation pipeline used for the offline case, but the ground truth geometries are
        not public.
      note: For intermediate and advanced test scores. Training-scene scores can be reproduced offline with the public
        evaluation script.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: paper
      quote: Ground truth data for the benchmark sequences will be withheld
  execution.harness_availability:
    - value: official-harness
      source: tutorial
      quote: It is based on the same evaluation pipeline used for the offline case, but the ground truth geometries are
        not public.
      note: The offline evaluation script (python_toolbox/evaluation in the IntelVCL repository, MIT licensed) is the
        server's pipeline.
notes: The paper's DOI resolves to the ACM Digital Library, which blocks automated requests, so the authors' preprint
  linked from the site is used (corpus flag). The Submit and Leaderboard pages were fetched but returned only a login
  form and a bot check, so they are not listed as sources. The licence page is internally inconsistent. It publishes
  the data 'under the Creative Commons Attribution 4.0 International (CC BY 4.0) License ... even commercially', and
  then grants use 'for the sole purpose of performing non-commercial scientific research' and says 'any use for commercial
  purposes, is prohibited'. Research reproduction is allowed under either reading, so no licence-restriction blocker
  is set.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [designed_for_subjects, lifecycle, governance.maintainer_type]
    note: Re-adjudicated against 0.9.0; classical-algorithm is clean now, and lifecycle abstains because Intel's end of
      maintenance is not dormancy and no source dates current use.

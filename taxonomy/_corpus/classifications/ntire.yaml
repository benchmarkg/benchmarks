# taxonomy/_corpus/classifications/ntire.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: ntire
corpus_item: 62
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  home: https://cvlai.net/ntire/2026/
  srx4: https://www.codabench.org/api/competitions/13516/
  denoise: https://www.codabench.org/api/competitions/12905/
  deepfake: https://www.codabench.org/api/competitions/12795/
facets:
  domain.primary:
    - value: vision/image-restoration-enhancement
      source: home
      quote: Image restoration, enhancement and manipulation are key computer vision tasks, aiming at the restoration
        of degraded image content
      note: Most of the 2026 edition's challenges are restoration or enhancement (super-resolution, denoising, deblurring,
        dehazing, low-light, reflection, shadow and raindrop removal). The SR (x4) perception track adds no-reference
        metrics (NIQE, MUSIQ, CLIP-IQA), which strains the subdomain's 'scored against a reference copy'.
  domain.secondary:
    - value: vision/classification
      source: deepfake
      quote: it evaluates the model's ability to distinguish between classes (Real vs. Fake)
      note: Robust Deepfake Detection and Robust AI-Generated Image Detection in the Wild.
      failure: 2026-09-28-ntire-001
    - value: vision/detection
      source: home
      quote: Cross-Domain Few-Shot Object Detection started!
    - value: vision/segmentation
      source: home
      quote: Rip Current Detection and Segmentation started!
    - value: vision/depth-geometry
      source: home
      quote: HR Depth from Images of Specular and Transparent Surfaces - Track Metric Mono started!
    - value: vision/3d-reconstruction
      source: home
      quote: 3D Restoration and Reconstruction started!
  capability:
    - value: generation-fidelity
      source: srx4
      quote: The evaluation consists of comparing the restored high-resolution images with the ground truth high-resolution
        images.
      note: capabilities.yaml cites ntire as a qualifying example ('Restoration and enhancement tracks scored by fidelity
        to a reference image'). The efficiency tracks (runtime, parameters) are not a capability; ADR-0020 rejects
        inference-efficiency and carries them in the benchmark's secondary_axes (02 S4.4).
    - value: perception
      source: deepfake
      quote: it evaluates the model's ability to distinguish between classes (Real vs. Fake)
      note: The detection, segmentation, depth and saliency challenges score what was recovered from the image.
  evaluation_method:
    - value: domain-metric
      source: denoise
      quote: We use the standard Peak Signal To Noise Ratio (PSNR) and, complementary, the Structural Similarity (SSIM)
        index as often employed in the literature.
      note: PSNR and SSIM rank the restoration tracks.
    - value: classification-metric
      source: deepfake
      quote: The primary metric for this challenge is the Area Under the Receiver Operating Characteristic Curve (ROC-AUC).
      note: The detection challenges (Robust Deepfake Detection, Robust AI-Generated Image Detection) rank by ROC-AUC.
    - value: model-derived-metric
      source: srx4
      quote: 'Perceptual Metrics:** **LPIPS**, **DISTS**, **NIQE**, **ManIQA**, **MUSIQ**, and **CLIP-IQA**.'
      note: LPIPS, DISTS, ManIQA, MUSIQ and CLIP-IQA are computed by learned networks; their versions are not stated.
    - value: composite
      source: srx4
      quote: The **Perception Score** is calculated as the average weighted value of the six perceptual metrics.
      note: The SR (x4) perception track folds learned metrics and NIQE, a fixed natural-scene-statistics formula, into
        one weighted number. The weights are not published on the fetched pages.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: denoise
      quote: the task of restoring the clean contents from a noisy input image based on a set of prior examples of noisy
        and noise-free images.
      note: Restoration networks trained on the challenge's training pairs and scored as trained; the term names image-restoration
        networks, and the detection challenges' classifiers are the same kind of entrant.
  data.access:
    - value: train-open-test-held-out
      source: srx4
      quote: The ground truth test data will not be made available to the participants during the contest.
      note: The flagship restoration challenges release the test inputs and withhold their ground truth. The Codabench
        registration gate is a lesser layer (withholding precedes a gate). The deepfake challenge's final ranking on a
        Hidden Private Test Set is that challenge's own value, for its child record (02 S11 rule 4).
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: 'NTIRE 2026: 11th Edition Overview and Awards'
      note: The challenge line-up changes almost entirely each year. The restoration tracks that reuse DIV2K's hidden test
        split do not change the family's cadence (periodic-recompetition inclusion test; ntire is its example).
  data.data_provenance:
    - value: synthetic-procedural
      source: denoise
      quote: Noisy images are generated by adding IID additive white Gaussian noise (AWGN) to the noise-free images and
        the noise level is 50.
      note: SR (x4) inputs are bicubic downscalings made with Matlab imresize.
    - value: inherited-from-constituents
      source: denoise
      quote: dataset adapted for the specific needs of the challenge.
      note: The clean images come from DIV2K and LSDIR, published datasets whose training, validation and test splits
        are reused ('it will be made available DIV2K and LSDIR dataset adapted for the specific needs of the challenge');
        their own sources document how the photographs were obtained.
    - value: model-generated
      source: deepfake
      quote: the base image sources (original identities) and the generative methods differ between the Training, Validation,
        and Test splits.
      note: The fake images of the deepfake and AI-generated-image detection challenges.
  data.contamination_risk:
    - value: low
      source: srx4
      quote: The ground truth test data will not be made available to the participants during the contest.
      note: Test inputs are released, but their ground truth stays with the organisers, and the official score is recomputed
        by running the entrant's code. No source assesses contamination. The DIV2K test split is reused across editions
        (see failure 006), but its high-resolution images are not distributed.
  data.ceiling_anchor_type:
    - value: none-known
      note: The restoration tracks rank by PSNR ('Restoration Quality - Measured using PSNR'), an unbounded metric, and
        no source reports a human or measured ceiling. 0.9.0 reads an unbounded headline metric as none-known, with
        the reason on the Metric; SSIM, the perception score and ROC-AUC go to ceiling_by_category.
  lifecycle:
    - value: active
      source: home
      quote: 'NTIRE 2026: 11th Edition Overview and Awards'
      note: The 2026 edition lists 47 challenge tracks (43 challenges per the corpus), with reports and awards at CVPR
        on 4 June 2026.
  activity:
    - value: between-rounds
      source: home
      quote: June 4, 2026, room 207 & Zoom
      note: The 2026 challenges closed in March and the workshop was held on 4 June 2026. No 2027 edition is announced
        on the fetched page.
  governance.maintainer_type:
    - value: conference-workshop
      source: home
      quote: New Trends in Image Restoration and Enhancement workshop and associated challenges in conjunction with CVPR
        2026
      note: Each challenge's organisers change by edition under the CVPR workshop, although Radu Timofte's lab at the
        University of Wurzburg heads the list and carries the series; the conference-workshop override decides (ntire
        is the near miss on academic-lab).
  governance.submission_process:
    - value: held-out-server
      source: srx4
      quote: the entries will be online submitted via the Codabench web platform.
    - value: sandboxed-rerun
      source: srx4
      quote: will be computed based on **the results obtained by running the submitted code** rather than relying on
        the direct Codabench submission results.
      note: The deepfake challenge does the same for its top entries ('The organizers will manually run the code against
        a Hidden Private Test Set'). Challenge papers are invited but 'Publishing papers is optional', so publication-gated
        is not tagged.
    - value: publication-gated
      source: srx4
      quote: To enter the final ranking the participants will need to fill out a survey (fact sheet) briefly describing
        their method.
      note: A method description is a condition of the final ranking. Code release is required only for prize eligibility
        ('To be eligible for prizes, the top ranking participants should publicly release their code'), so open-source-gated
        is not tagged.
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: srx4
      quote: The ground truth test data will not be made available to the participants during the contest.
    - value: prize-sponsored-by-industry
      source: srx4
      quote: There will be economic incentive prizes and travel grants for the winners (based on availability) to boost
        contest participation
      note: The workshop page's Sponsors section shows OPPO and Kuaishou logos (as images, beside the University of Wurzburg's),
        and both companies also supply organisers. The rules bar organisers from entering and deny prize money to sponsor-affiliated
        winners.
  execution.compute_tier:
    - value: provided-allocation
      source: srx4
      quote: The submitted code, model checkpoints, or inference scripts will be executed on a **single NVIDIA A6000 GPU**.
      note: The official SR (x4) score is computed from the organisers' own run of the submitted code ('based on the results
        obtained by running the submitted code'), on their single A6000, which takes precedence over the accelerator
        tier. Training an entry is at the entrant's cost and is not part of the run.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: srx4
      quote: The ground truth test data will not be made available to the participants during the contest.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: srx4
      quote: The ground truth test data will not be made available to the participants during the contest.
  execution.harness_availability:
    - value: official-harness
      source: denoise
      quote: With the dataset the organizers will provide scripts to facilitate the reproducibility of the images and
        performance evaluation results after the validation server is online.
notes: The corpus defines NTIRE as the 2026 workshop series ('workshop series, not a single benchmark'), with no primary
  paper, and it is classified as one family per 02 S11 rule 5. The workshop page lists the challenges but not their rules.
  Three Codabench challenges were fetched through Codabench's public API as representatives - Image Super-Resolution
  (x4), the flagship; Image Denoising; and Robust Deepfake Detection, a non-restoration track. Single-valued fields record
  the flagship restoration challenges, and the failures record where the other tracks differ. The Codabench pages carry
  organisers' e-mail addresses, which are not quoted.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, evaluation_method, designed_for_subjects, data.access, data.refresh, data.data_provenance,
      data.ceiling_anchor_type, governance.maintainer_type, governance.submission_process, execution.compute_tier]
    note: Re-adjudicated against 0.9.0; classification-metric, task-specific-supervised-model, inherited-from-constituents,
      none-known, publication-gated and provided-allocation now apply.

# taxonomy/_corpus/classifications/forecastbench.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: forecastbench
corpus_item: 84
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2409.19839
  abs: https://arxiv.org/abs/2409.19839
  home: https://www.forecastbench.org/
  about: https://www.forecastbench.org/about/
  leaderboards: https://www.forecastbench.org/leaderboards/
  docs: https://www.forecastbench.org/docs/
  repo: https://github.com/forecastingresearch/forecastbench
  submit: https://github.com/forecastingresearch/forecastbench/wiki/How-to-submit-to-ForecastBench
facets:
  domain.primary:
    - value: society-econ-law/forecasting-prediction-markets
      source: about
      quote: We evaluate LLMs by regularly asking them to make probabilistic forecasts about future events, thereby
        creating a contamination-free benchmark.
      note: 0.9.0's society-econ-law exclusion keeps forecasting that resolves against real-world events in this subdomain
        whatever its topic and however general the competence claimed (02 S12.8).
  domain.secondary:
    - value: society-econ-law/finance-forecasting
      source: paper
      quote: Yahoo! Finance finance.yahoo.com 509
      note: Yahoo! Finance, FRED and DBnomics series supply part of the dataset questions (Table 1). ACLED (conflict)
        and Wikipedia supply the rest.
  capability:
    - value: probabilistic-forecasting
      source: abs
      quote: To avoid any possibility of data leakage, ForecastBench is comprised solely of questions about future events
        that have no known answer at the time of submission.
      note: calibration-uncertainty is not tagged. The probability is about a world event, not about the system's
        own correctness, and no source claims calibration.
  evaluation_method:
    - value: prospective-resolution
      source: submit
      quote: Contrary to what is written in the paper, we are not scoring unresolved market questions; we now wait
        until the questions resolve before scoring them.
      note: The paper scored unresolved market questions against the platform crowd forecast, and that stopped.
        The preliminary leaderboard still ranks early on "all resolved dataset questions", so a published rank carries
        a resolution status.
    - value: uncertainty-calibration-score
      source: paper
      quote: Brier scores are strictly proper, incentivizing truthful reporting from participants.
      note: Each emitted probability is scored with the Brier score. 0.9.0 has a probability about a future event
        carry both this term (how it is scored) and prospective-resolution (when its truth exists).
    - value: entrant-relative-ranking
      source: leaderboards
      quote: To enable fair ranking across forecasters despite non-overlapping question sets, we use a two-way fixed-effects
        model that adjusts for question difficulty
      note: The difficulty adjustment is fitted jointly across all forecasters, so an entrant's Brier Index moves as
        the pool changes. The pool and snapshot date belong on each claim.
  designed_for_subjects:
    - value: instruction-tuned-model
      source: leaderboards
      quote: Models are evaluated out of the box, without extra tools, context, or scaffolding.
      note: The baseline leaderboard.
    - value: agent-scaffold
      source: leaderboards
      quote: Teams may enhance models however they choose—with tools, added context, fine-tuning, ensembling, or other
        methods.
      note: The tournament leaderboard.
    - value: human-expert
      source: paper
      quote: We recruited 39 superforecasters, who have a strong track record of accurate performance on a diverse
        set of geopolitical questions
      note: Superforecasters are selected by track record, not by formal credential. Their median forecast is ranked
        on the same leaderboard as the models.
    - value: human-nonexpert
      source: paper
      quote: We recruited 500 human forecasters via Prolific and advertisements on Facebook to participate as representatives
        of the general public.
  data.access:
    - value: fully-open
      source: paper
      quote: Our datasets, distributed under the CC BY-SA 4.0 license, are available on www.forecastbench.org/datasets.html.
      note: Question sets are published at the start of each round and resolutions as they occur. At submission the
        answers do not exist yet, so there is nothing to withhold.
  data.refresh:
    - value: resolves-over-time
      source: paper
      quote: As they resolve, we update a public leaderboard to show participant performance.
      note: 0.9.0 gives resolves-over-time precedence over continuously-generated and rolling-live. The cadences go
        here, as the term asks. Dataset questions are generated every night from time series, and a new question set
        is sampled every two weeks against a leaderboard updated nightly.
  data.data_provenance:
    - value: web-scraped
      source: paper
      quote: We compile market questions from a handful of prediction markets and forecast aggregation sites that elicit
        human predictions on questions across a wide range of topics.
    - value: synthetic-procedural
      source: paper
      quote: With these sources, we can generate questions using a fixed question template
      note: Dataset questions are generated from time series (ACLED, DBnomics, FRED, Wikipedia, Yahoo! Finance). gpt-4o-mini
        only categorises and filters questions, so model-generated is not tagged.
    - value: curated-public-database
      source: paper
      quote: We create dataset questions from well-established and well-maintained datasets that track real-world events
      note: The dataset questions and their resolutions come from curated archives compiled for other purposes (ACLED's
        conflict database, FRED and DBnomics statistics).
  data.contamination_risk:
    - value: low
      source: paper
      quote: The final resolution of each question is only determined in the future and cannot be leaked in any training
        data (by construction).
      note: The one route left is live look-up of market prices during the 24-hour window. That is run-time leakage,
        not training contamination, and the question set supplies the crowd forecast as a freeze value in any case.
  data.ceiling_anchor_type:
    - value: expert-average
      source: about
      quote: AI models have likely reached parity with superforecasters on ForecastBench 2026-07-16
      note: The anchor is the 'Superforecaster median forecast', a group of 39 superforecasters scored like an entrant.
        It stays the anchor after the frontier reaches it, with headroom unclamped (12 S3.1). The group was 'last surveyed
        in July 2024', which the Baseline record carries. 02 S12.8 records expert-best; see the failure.
      failure: 2026-09-28-forecastbench-007
  lifecycle:
    - value: active
      source: about
      quote: AI models have likely reached parity with superforecasters on ForecastBench 2026-07-16
      note: The home page also announces "Kalshi added as question source 2026-08-19", and the submission wiki was
        edited on Sep 23, 2026.
  activity:
    - value: null
      source: submit
      quote: Upload your Forecast Set by 23:59:59 UTC on the forecast due date
      failure: 2026-09-28-forecastbench-008
  governance.maintainer_type:
    - value: nonprofit
      source: about
      quote: ForecastBench is developed and maintained by the Forecasting Research Institute , a nonprofit research
        organization
  governance.submission_process:
    - value: held-out-server
      source: submit
      quote: Upload your forecast set to your GCP bucket folder.
      note: The tournament board. Forecasts are locked by a timestamped deadline and scored as questions resolve, and
        0.9.0's held-out-server counts outcomes that do not exist at submission (forecastbench is its example).
    - value: maintainer-run
      source: leaderboards
      quote: The baseline leaderboard is run solely by the ForecastBench team.
      note: The baseline board ranks models the maintainer chose and ran out of the box.
  governance.independence_flags:
    - value: no-known-conflict
      source: about
      quote: ForecastBench is supported by a grant from Coefficient Giving
      note: 'Searched the about page, paper acknowledgements and leaderboard notes. The funders are Coefficient Giving
        and, in the paper, Open Philanthropy, and neither is an evaluated party. The maintainer does enter the baseline
        board and some tournament rows itself, with off-the-shelf models and published prompts ("Models submitted by
        the ForecastBench team receive the crowd forecast as context for market questions"). These are reference
        entries, not systems of its own, so maintainer-competes-on-own-benchmark is not tagged.'
  execution.compute_tier:
    - value: api-credits-only
      source: paper
      quote: Limiting the number of questions generated to 1,000 also ensures that costs for testing LLMs on the benchmark
        are capped for development teams with fewer resources.
      note: The entrant pays for inference and the maintainer pays for resolution. The cost that sets this benchmark
        apart is waiting, which the tier cannot record ("models are included on the leaderboard 50 days after forecast
        submission").
  execution.reproducibility_tier:
    - value: null
      source: paper
      quote: One reason we’ve open-sourced our code (link in Appendix A) is to allow for independent verification of
        our results.
      failure: 2026-09-28-forecastbench-006
  execution.reproducibility_blockers:
    - value: live-world-state
      source: paper
      quote: We thus elicit forecasts, obtaining comparable forecast sets on the due date from both LLMs and humans who
        faced the same information environment.
  execution.harness_availability:
    - value: official-harness
      source: docs
      quote: The repository contains the full pipeline for generating forecasting questions from time-series data, evaluating
        LLM and human forecasts, computing difficulty-adjusted Brier scores, and maintaining the leaderboard.
notes: 'Stress test (item 84). Both flagged values pass their tests. data.refresh resolves-over-time and evaluation_method
  prospective-resolution both hold: the answer "becomes known only after predictions are locked" once the wiki confirms
  that unresolved market questions are no longer scored against the crowd proxy. Under 0.9.0 the biweekly generated
  rounds sit in the refresh notes, and the scoring rule and the pool-relative difficulty adjustment have method terms.
  What still breaks: the human anchor is an aggregate from 2024 that the frontier has now reached, and 02 S12.8 and
  the tests name different terms for it (007); reproducibility splits between re-scoring and re-forecasting (006).
  The corpus flag is confirmed: the difficulty-adjusted Brier score is described in the technical report (docs, "Last
  updated: 3 Oct 2025") and on the leaderboards page, not in the paper. Combination questions, which are in the paper,
  were dropped for rounds from 2025-10-26.'
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, evaluation_method, data.refresh, data.data_provenance,
      data.ceiling_anchor_type, activity, governance.submission_process]
    note: Re-adjudicated against 0.9.0; the scoring rule and pool adjustment now have terms, and the rounds sit under resolves-over-time.

# taxonomy/_corpus/classifications/posebusters.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: posebusters
corpus_item: 39
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2308.05777
  abs: https://arxiv.org/abs/2308.05777
  home: https://github.com/maabuu/posebusters
  docs: https://posebusters.readthedocs.io/en/latest/
facets:
  domain.primary:
    - value: biology-genetics/protein-ligand-cofolding
      source: paper
      quote: These poses were generated by re-docking the cognate ligands of the 81 protein-ligand crystal complexes
        in the Astex Diverse set
      failure: 2026-09-28-posebusters-001
  domain.secondary: []
  capability:
    - value: constraint-satisfaction
      source: abs
      quote: Only methods that both pass these checks and predict native-like binding modes should be classed as having
        "state-of-the-art" performance.
      failure: 2026-09-28-posebusters-002
    - value: distribution-shift-generalization
      source: paper
      quote: Figure 4 shows the results of the docking methods on the PoseBusters Benchmark set but stratified by the
        target protein receptor’s maximum sequence identity with the proteins in the PDBbind 2020 General Set
  evaluation_method:
    - value: constraint-check
      source: paper
      quote: Molecule poses which pass all tests in PoseBusters are ‘PB-valid’.
    - value: domain-metric
      source: abs
      quote: It is therefore not sufficient to evaluate these methods solely by RMSD to a native binding mode.
      note: Ligand RMSD to the crystal pose is the docking field's standard accuracy measure; the headline success rate
        is PB-valid and RMSD within 2 Å.
  designed_for_subjects:
    - value: domain-specialist-model
      source: abs
      quote: We use PoseBusters to compare five deep learning-based docking methods (DeepDock, DiffDock, EquiBind, TankBind,
        and Uni-Mol)
    - value: classical-algorithm
      source: abs
      quote: two well-established standard docking methods (AutoDock Vina and CCDC Gold)
      failure: 2026-09-28-posebusters-003
  data.access:
    - value: fully-open
      source: paper
      quote: Data for this paper, including the Astex Diverse set and PoseBusters Benchmark set, as well as the individual
        tabulated test results for each docking are available at Zenodo
  data.refresh:
    - value: versioned-releases
      source: abs
      quote: version 2 added an additional filter to the PoseBusters Benchmark set to remove ligands with crystal contacts
      note: The filter took the set from 428 to 308 complexes (Table S2), so a score pins to the paper version of the
        set.
  data.data_provenance:
    - value: experimental-measurement
      source: paper
      quote: carefully-selected publicly-available crystal complexes from the PDB
      note: Ground truth is deposited crystal structures.
  data.contamination_risk:
    - value: low
      source: paper
      quote: It only contains complexes released since 2021 and therefore does not contain any complexes present in
        the PDBbind General Set v2020 used to train many of the methods.
      failure: 2026-09-28-posebusters-004
  data.ceiling_anchor_type:
    - value: none-known
      note: The paper sets the check thresholds so that the crystal ligands pass ("all of those in the PoseBusters
        Benchmark set pass at this threshold"), which calibrates the checks, not the success rate. No human or measured
        ceiling is stated.
  lifecycle:
    - value: null
      source: docs
      quote: Last updated on 05 December 2025.
      failure: 2026-09-28-posebusters-005
  activity:
    - value: null
      source: home
      quote: For code issues, please open an issue.
      failure: 2026-09-28-posebusters-006
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: Department of Statistics, 24-29 St Giles’, Oxford OX1 3LB, United Kingdom.
  governance.submission_process:
    - value: null
      source: paper
      quote: M. B. performed the computational experiments, created the PoseBusters software, and wrote the original
        draft.
      failure: 2026-09-28-posebusters-007
  governance.independence_flags:
    - value: no-known-conflict
      source: paper
      quote: Conflicts of interest There are no conflicts to declare.
      note: The seven evaluated docking methods are all third-party; the authors enter no method of their own.
  execution.compute_tier:
    - value: null
      failure: 2026-09-28-posebusters-008
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: PoseBusters is made available as a pip-installable Python package and as open source code under the BSD-3-Clause
        license
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: docs
      quote: PoseBusters is a command line tool and Python library to check the output of molecular conformation generators,
        docking programs, or other programs that generate molecules in 3D.
notes: The corpus entry is both a check suite (the posebusters package, which others run on their own predictions,
  as Runs N' Poses does) and a benchmark (the Astex Diverse set of 81 complexes and the PoseBusters Benchmark set of
  308). This record classifies the benchmark the paper runs; the check suite alone would carry the same evaluation-method
  and harness terms. The journal version is Chem. Sci. 2024, 15, 3130-3139 (DOI 10.1039/D3SC04185A); the arXiv v3 HTML
  was used as the full text.

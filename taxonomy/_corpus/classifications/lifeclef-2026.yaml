# taxonomy/_corpus/classifications/lifeclef-2026.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: lifeclef-2026
corpus_item: 59
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://link.springer.com/chapter/10.1007/978-3-032-21321-1_39
  home: https://www.imageclef.org/LifeCLEF2026
  animal: https://www.imageclef.org/AnimalCLEF2026
  bird: https://www.imageclef.org/BirdCLEF2026
  fathomnet: https://www.imageclef.org/FathomNetCLEF2026
  pest: https://www.imageclef.org/PestCLEF2026
  plant: https://www.imageclef.org/PlantCLEF2026
facets:
  domain.primary:
    - value: earth-climate/ecology-biodiversity
      source: home
      quote: LifeCLEF is an international research initiative in the field of biodiversity informatics that organizes
        yearly challenges on the automated identification and understanding of life forms
      note: 0.9.0 redefines ecology-biodiversity to include species identification, and a biodiversity claim across
        modalities is primary here with the method subdomains secondary (the term's own lifeclef-2026 example).
  domain.secondary:
    - value: audio-speech/bioacoustics
      source: bird
      quote: This competition involves building models that automatically identify wildlife species from their vocalizations
        in audio recordings collected across the Pantanal wetlands.
    - value: vision/detection
      source: fathomnet
      quote: The FathomNet 2026 challenge addresses this real-world constraint by focusing on positive-unlabeled learning
        for object detection.
    - value: vision/classification
      source: plant
      quote: The task is evaluated as a multi-label classification task that aims to predict all the plant species
        on the high-resolution plot images.
    - value: language/information-extraction
      source: pest
      quote: The task is a knowledge graph extraction task and is framed as a document-level relation extraction
        problem.
      note: AnimalCLEF (clustering images into individual animals) has no subdomain of its own and is covered only
        by the primary.
  capability:
    - value: perception
      source: fathomnet
      quote: identifying both the presence and location of marine organisms across diverse habitats.
      note: The image and audio tasks (AnimalCLEF, BirdCLEF+, FathomNetCLEF, PlantCLEF) all score what was recovered
        from the raw signal.
    - value: distribution-shift-generalization
      source: plant
      quote: The main difficulty of the task lies in the shift between the test data (high-resolution multi-label
        images of vegetation plots) and the training data (single-label images of individual plants).
      note: The species label set is unchanged and only the inputs move, from close-ups of single plants to plot images;
        the multi-label output follows from plots holding many plants, and no transfer is reported, so 0.9.0's
        tie-break gives this term and not transfer-learning.
    - value: context-integration
      source: pest
      quote: Relations reflect ecological interactions and events involving entities such as Host, Pest, Disease,
        Vector, and Location.
      note: PestCLEF scores relations extracted from the supplied documents.
  evaluation_method:
    - value: domain-metric
      source: fathomnet
      quote: The evaluation metric is the mean Average Precision (mAP), applied to the fully labeled evaluation set.
      note: FathomNetCLEF.
    - value: classification-metric
      source: animal
      quote: Performance will be evaluated using the Adjusted Rand Index (ARI), which measures pairwise consistency
        between the predicted and true clusters.
      note: AnimalCLEF's ARI and PestCLEF's F-score ('Submissions will be evaluated using standard Information
        Extraction metrics such as the F-Score'). BirdCLEF+ and PlantCLEF state no metric on the fetched pages.
  designed_for_subjects:
    - value: domain-specialist-model
      source: bird
      quote: This competition focuses on the development of machine learning models that identify wildlife species
        from passive acoustic monitoring (PAM).
      note: Entrants are task-specific models; AnimalCLEF and PlantCLEF supply pre-trained domain models (MegaDescriptor
        and PlantCLEF checkpoints).
  data.access:
    - value: train-open-test-held-out
      source: pest
      quote: The annotation guidelines and the datasets are already publicly available, the test set annotation remains
        undisclosed.
      note: Test inputs are released with their labels withheld (PestCLEF, FathomNetCLEF's COCO test set, AnimalCLEF's
        test images), and 0.9.0 puts withholding before the gate, so the CLEF form and Kaggle's rules acceptance go
        here in the notes. No fetched page says BirdCLEF+'s test audio is withheld.
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: organizes yearly challenges on the automated identification and understanding of life forms
      note: The family is periodic-recompetition even though PlantCLEF 2026 reuses its 2025 data and the task line-up
        changes by edition (0.9.0's inclusion test; ADR-0020 names lifeclef-2026).
  data.data_provenance:
    - value: real-world-instrument
      source: bird
      quote: a growing network of 1,000 acoustic recorders is being deployed across the Pantanal, running continuously
        to capture wildlife sounds across different habitats and seasons.
      note: Also camera and underwater imagery (FathomNet, turtles and lizards, vegetation plots).
    - value: expert-authored
      source: pest
      quote: The annotation was carried out by a team of 30 plant disease and NLP experts following the state-of-the-art
        annotation methodology.
      note: AnimalCLEF identities "were determined by field experts and validated by AI models"; FathomNet boxes are
        "expert-curated".
    - value: web-scraped
      source: pest
      quote: The task uses the EPOP dataset, which contains 247 web documents focusing on 20 monitored pests.
    - value: inherited-from-constituents
      source: pest
      quote: The task uses the EPOP dataset, which contains 247 web documents focusing on 20 monitored pests.
      note: PestCLEF reuses a published dataset ('the datasets are already publicly available').
    - value: curated-public-database
      source: fathomnet
      quote: The dataset is derived from the FathomNet Database, which contains more than 400k images and 1M expert-curated
        bounding boxes
      note: FathomNetCLEF's items are selected from a curated public archive compiled for ocean research, not published
        as an evaluation dataset.
  data.contamination_risk:
    - value: medium
      source: fathomnet
      quote: The dataset is derived from the FathomNet Database, which contains more than 400k images and 1M expert-curated
        bounding boxes, as of Feb 2026, across thousands of marine taxonomic, geologic, and equipment classes.
      note: FathomNetCLEF's fully annotated test images come from a public database, and PlantCLEF 2026 reuses the
        2025 datasets, so routes are plausible for two tasks. No source assesses contamination.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: fathomnet
      quote: The evaluation metric is the mean Average Precision (mAP), applied to the fully labeled evaluation set.
      note: Every stated task metric (mAP, ARI, F-score) is bounded at 1, and no task page reports a human or expert
        baseline, so 0.9.0's none-known exclusion sends a bounded metric with no measured anchor here. The teaser
        paper is paywalled and the post-campaign overview is not yet published.
  lifecycle:
    - value: active
      source: home
      quote: AnimalCLEF participant talk [1st place]
      note: The 2026 campaign produced rankings presented at CLEF 2026 in Jena on 21-22 September 2026.
  activity:
    - value: between-rounds
      source: home
      quote: organizes yearly challenges on the automated identification and understanding of life forms
      note: The 2026 edition ended with CLEF 2026 (21-24 Sept 2026). No 2027 edition is announced on the fetched pages.
  governance.maintainer_type:
    - value: conference-workshop
      source: home
      quote: LifeCLEF lab is part of the Conference and Labs of the Evaluation Forum (CLEF).
      note: Task teams change each edition, and 0.9.0's conference-workshop override applies although Inria has
        coordinated the lab since 2011 (the term's own lifeclef-2026 example).
  governance.submission_process:
    - value: held-out-server
      source: fathomnet
      quote: Submissions must be provided as a CSV file where each row corresponds to a single predicted object detection.
      note: Every task is scored on Kaggle against withheld test labels.
    - value: publication-gated
      source: animal
      quote: Only participants who submitted a working-note paper will be part of the officially published ranking
        used for scientific communication.
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: pest
      quote: The annotation guidelines and the datasets are already publicly available, the test set annotation remains
        undisclosed.
      note: BirdCLEF+ awards $5,000 for the best working notes ("Organizers will award $5,000 in prize money"), and
        its dataset was supported by the Bezos Earth Fund, a philanthropy; no commercial prize sponsor is named, so
        prize-sponsored-by-industry is not tagged. Organisers include Google (BirdCLEF+); whether organiser groups
        also entered is not visible.
  execution.compute_tier:
    - value: null
      source: plant
      quote: Training set - Min side size - 800px [~281GB]
      failure: 2026-09-28-lifeclef-2026-007
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: pest
      quote: The annotation guidelines and the datasets are already publicly available, the test set annotation remains
        undisclosed.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: pest
      quote: The annotation guidelines and the datasets are already publicly available, the test set annotation remains
        undisclosed.
  execution.harness_availability:
    - value: official-harness
      source: fathomnet
      quote: The evaluation notebook can be found here.
      note: Only FathomNetCLEF links its scoring code. The other four tasks are scored by Kaggle, and their metric
        code is not linked from the fetched pages.
notes: The corpus defines the entry as the whole 2026 lab (AnimalCLEF, BirdCLEF+, FathomNetCLEF, PestCLEF, PlantCLEF),
  classified as one family per 02 S11 rule 5. The primary paper is the ECIR 2026 pre-campaign teaser; only its Springer
  landing page (abstract, affiliations, acknowledgements) is open, and the post-campaign overview is not yet published.
  The five task pages on imageclef.org were fetched for this record. Per-task metrics, access and harnesses differ,
  and several single-valued fields record the dominant or best-documented task, which the 0.9.0 family and precedence
  rules now settle for access and refresh.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, evaluation_method, data.access, data.refresh, data.data_provenance, data.ceiling_anchor_type, governance.maintainer_type]
    note: Re-adjudicated against 0.9.0; the redefined ecology-biodiversity, the shift tie-break, classification-
          metric and the access, refresh and conference-workshop rules settle six Stage 3 failures. Provenance adds
          inherited-from-constituents for EPOP and curated-public-database for FathomNet, the ceiling moves to
          theoretical-maximum, and compute stays source-silent.

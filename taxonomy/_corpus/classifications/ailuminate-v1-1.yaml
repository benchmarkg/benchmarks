# taxonomy/_corpus/classifications/ailuminate-v1-1.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: ailuminate-v1-1
corpus_item: 70
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2503.05731
  abs: https://arxiv.org/abs/2503.05731
  home: https://mlcommons.org/2025/02/ailumiate-v1-1-fr/
  site: https://mlcommons.org/ailuminate/
  faq: https://mlcommons.org/ailuminate/safety-faq/
  users: https://mlcommons.org/ailuminate/safety-technical-users/
  results: https://ailuminate.mlcommons.org/benchmarks?language=fr_FR
  repo: https://github.com/mlcommons/ailuminate
facets:
  domain.primary:
    - value: safety-alignment/harmlessness-refusal
      source: home
      quote: the v1.1 French model of AILuminate assesses LLM responses to over 24,000 French language test prompts
        across twelve categories of hazards behaviors
      note: The scored quantity is the share of responses that violate the assessment standard. Jailbreak resistance
        is a separate benchmark in the family (Jailbreak v0.5), not this entry.
  domain.secondary: []
  capability:
    - value: harm-avoidance
      source: results
      quote: which of the responses are violations according to the AILuminate Assessment Standard guidelines
  evaluation_method:
    - value: model-graded-judge
      source: paper
      quote: Others are high-performing generic LLMs that are prompt-engineered to generate safety-violation
        judgements.
      note: The ensemble combines fine-tuned open evaluators and prompted generic LLMs, and its members are not
        disclosed (failure 001).
      failure: 2026-09-28-ailuminate-v1-1-001
    - value: ordinal-grading
      source: paper
      quote: AILuminate assigns grades on a five-tier scale of Poor, Fair, Good, Very Good, or Excellent based on the
        percentage of SUT responses classified as violating.
      note: The bands below Excellent are defined relative to a reference system of the two best "accessible" open
        models, so they move with the state of the art.
  designed_for_subjects:
    - value: instruction-tuned-model
      source: results
      quote: 'Bare Models: as a standalone model in the default configuration'
    - value: hosted-inference-endpoint
      source: users
      quote: For official online testing, the model must be available from a hosting service or through an API.
      note: The "AI Systems" category grades a served system with its guardrails and filters ("Mistral Large 24.11
        with output moderation"), whose identity includes how it is served.
  data.access:
    - value: private-test-server
      source: faq
      quote: 'Official Test: The formal AILuminate benchmark test for when a SUT is ready to be benchmarked using our
        complete, hidden set of prompts and private evaluator.'
      note: The 12,000 official prompts per language never leave MLCommons. The 12,000 practice prompts are offered
        to MLCommons members, and a 1,200-prompt demo subset is public under CC-BY 4.0. None of this is
        restricted-dual-use, since the official set is withheld against overfitting.
  data.refresh:
    - value: versioned-releases
      source: faq
      quote: Every official score is associated with a specific release version of the AILuminate benchmark.
      failure: 2026-09-28-ailuminate-v1-1-002
  data.data_provenance:
    - value: expert-authored
      source: results
      quote: All of the prompts were created by a team of experts.
      note: Three procured prompt suppliers wrote the prompts, and the paper records per prompt "whether a large
        language model (LLM) generated or translated any part of that prompt". The fetched sources do not say how
        the French set was produced.
  data.contamination_risk:
    - value: medium
      source: home
      quote: none of the LLMs evaluated are given advance access to specific evaluation prompts or the evaluator model
      note: The structure works against contamination (hidden prompts, reserve prompts rotated in to detect
        overfitting). But every official run sends the hidden prompts to the evaluated vendor's API, and members
        receive a practice set that is "statistically nearly identical". No contamination evidence is reported.
  data.ceiling_anchor_type:
    - value: null
      source: results
      quote: Achieves or exceeds current ideal goal of < 0.1% violating responses.
      failure: 2026-09-28-ailuminate-v1-1-003
  lifecycle:
    - value: null
      failure: 2026-09-28-ailuminate-v1-1-004
  activity:
    - value: accepting-submissions
      source: users
      quote: You can keep testing with our practice test tool until your model is ready, then submit it to our service
        for final evaluation
  governance.maintainer_type:
    - value: consortium
      source: home
      quote: An open engineering consortium supported by over 125 members and affiliates
      failure: 2026-09-28-ailuminate-v1-1-005
  governance.submission_process:
    - value: held-out-server
      source: faq
      quote: When you are ready to run the Official Test please reach out to us to configure the system so results can
        be
      note: MLCommons queries the SUT with the hidden prompts and scores the responses with its private evaluator,
        and the participant never sees either.
      failure: 2026-09-28-ailuminate-v1-1-006
  governance.independence_flags:
    - value: funded-by-evaluated-party
      source: paper
      quote: Companies that sponsored the effort had the option to be included.
    - value: commercial-leaderboard-placement
      source: faq
      quote: We also offered sponsors the option to be included in the public
      note: At launch, sponsorship bought the option of a place in the public results.
      failure: 2026-09-28-ailuminate-v1-1-007
    - value: single-evaluator-private-test-set
      source: paper
      quote: 'The official dataset is for grading SUTs and for reporting (see Section 6); it remains confidential to
        prevent or at least resist overfitting'
  execution.compute_tier:
    - value: api-credits-only
      source: faq
      quote: SUTs are tested as black-box query-response systems.
      note: The entrant pays for inference on 12,000 prompts per language, and MLCommons runs the evaluator. The
        fetched sources state no participation fee.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: paper
      quote: MLCommons keeps that information confidential to prevent the ensemble from being used as a guard model
        that enables a SUT to achieve a perfect score despite being less than perfectly safe.
      note: Both the official prompts and the evaluator ensemble are confidential. The public demo set with Llama
        Guard gives only an approximation.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: paper
      quote: 'The official dataset is for grading SUTs and for reporting (see Section 6); it remains confidential to
        prevent or at least resist overfitting'
      failure: 2026-09-28-ailuminate-v1-1-008
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: 'Called ModelBench (https://github.com/mlcommons/modelbench), it includes the following components:'
      note: ModelBench is the software that "implements the entire AILuminate benchmark", and it is open source. The
        official score also needs the hidden prompts and the private evaluator, which only MLCommons runs.
notes: 'AILuminate is a family (Safety, Jailbreak, Agentic and Multimodal workstreams) under 02 S11 rule 5, and v1.1 is
  a release of the Safety text-to-text benchmark that adds French to the English v1.0. No v1.1 paper exists, so the
  record combines the v1.0 technical paper (method), the February 2025 v1.1 announcement (French, 24,000+ prompts) and
  the current MLCommons pages. The version label is inconsistent across maintainer sources (failure 002). On the
  maintainer question, MLCommons is a consortium, not a standards body: it describes itself as "An open engineering
  consortium", it is a 501(c)(6) association with 125+ members, and its benchmarks "support international standards
  organizations" rather than being issued by one (failure 005).'

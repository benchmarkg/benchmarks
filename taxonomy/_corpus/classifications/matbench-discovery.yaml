# taxonomy/_corpus/classifications/matbench-discovery.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: matbench-discovery
corpus_item: 36
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://doi.org/10.1038/s42256-025-01055-1
  arxiv: https://arxiv.org/abs/2308.14920
  home: https://github.com/janosh/matbench-discovery
  site: https://janosh.github.io/matbench-discovery/
  contribute: https://janosh.github.io/matbench-discovery/contribute
  changelog: https://janosh.github.io/matbench-discovery/changelog
facets:
  domain.primary:
    - value: chemistry-materials/crystal-stability-discovery
      source: paper
      quote: We present Matbench Discovery as an example evaluation framework for machine learning energy models, here
        applied as pre-filters to first-principles computed data in a high-throughput search for stable inorganic crystals.
      note: 'The physics exclusion names Matbench Discovery: the subject is crystal stability, so the DFT-grounded method
        does not make it physics.'
  domain.secondary:
    - value: chemistry-materials/force-fields-potentials
      source: home
      quote: that ranks ML interatomic potentials across crystal stability prediction, geometry optimization, phonons
        and thermal conductivity, molecular dynamics, and diatomic potential-energy curves.
      note: The phonon, molecular-dynamics and diatomic tasks score the potential itself; phonon thermal conductivity
        of crystals stays in chemistry-materials under the same exclusion.
  capability:
    - value: search-exploration
      source: paper
      quote: The discovery acceleration factor (DAF) quantifies how many times more effective a model is at finding stable
        structures compared with random selection from the test set.
      note: DAF is also reported on the 10,000 materials each model ranks as most stable, a fixed screening budget.
    - value: distribution-shift-generalization
      source: paper
      quote: allows out-of-distribution testing by examining whether model performance degrades for later batches
      note: WBM batches carry increasing numbers of elemental substitutions away from the MP training distribution; the
        site also separates a "Unique Prototypes" subset.
  evaluation_method:
    - value: composite
      source: site
      quote: CPS combines discovery F1 (50%), geometry RMSD (10%), and phonons κSRME (40%).
      note: The live leaderboard ranks by CPS; the paper ranks by F1 (corpus flag).
      failure: 2026-09-28-matbench-discovery-001
    - value: domain-metric
      source: paper
      quote: The maximum possible DAF is the inverse of the prevalence
      note: DAF and kappa_SRME are materials-discovery metrics; the taxonomy names kappa_SRME as a domain-metric example.
    - value: statistical-fit
      source: paper
      quote: Global metrics such as mean absolute error (MAE), root mean squared error (RMSE) and R2 may provide practitioners
        with misleading confidence regarding model reliability.
      note: MAE, RMSE and R2 are reported alongside the classification metrics (Table 1) and on the leaderboard.
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: home
      quote: that ranks ML interatomic potentials across crystal stability prediction, geometry optimization, phonons
        and thermal conductivity, molecular dynamics, and diatomic potential-energy curves.
  data.access:
    - value: fully-open
      source: paper
      quote: The test set is the WBM dataset50, which is available via Figshare
      note: 'One exception: in the MD task, "energy/force RMSEs are maintainer-computed private-label diagnostics"; they
        are not part of CPS.'
  data.refresh:
    - value: versioned-releases
      source: changelog
      quote: v1.3.1 11 September 2024
      failure: 2026-09-28-matbench-discovery-002
  data.data_provenance:
    - value: simulation-generated
      source: paper
      quote: This candidate is relaxed using DFT to arrive at a relaxed structure that can be compared against a reference
        convex hull. This sort of workflow was used to construct the WBM dataset.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: To control for the potential adverse effects of leakage between the MP training set and the WBM test set,
        we cleaned the WBM test set based on protostructure matching.
      failure: 2026-09-28-matbench-discovery-003
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: The maximum possible DAF is the inverse of the prevalence
      note: About 6.5 on the full test set. The anchor is stated for DAF only; F1, CPS and the other metrics have no
        stated anchor beyond their bounds.
  lifecycle:
    - value: active
      source: site
      quote: Prophet-OAME-MBD 0.912 0.978 0.928 6.065 0.927 0.018 0.869 0.065 0.059 0.578 0.572 62.3M EFSG 2026-09-13
      note: The top-ranked model was added on 2026-09-13.
  activity:
    - value: leaderboard-live-no-round
      source: contribute
      quote: To submit a new model to this benchmark and add it to our leaderboard, please create a model-submission
        pull request to the main branch as described in Step 4.
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: Department of Physics, University of Cambridge, Cambridge, UK Janosh Riebesell, Rhys E. A. Goodall & Alpha
        A. Lee
      failure: 2026-09-28-matbench-discovery-004
  governance.submission_process:
    - value: maintainer-verified
      source: contribute
      quote: Once tests pass, a maintainer triggers automated ingestion on your PR (see below) and after merge your model
        appears on the leaderboard
      note: Ingestion runs trusted maintainer code over the submitted prediction files; the model itself is not re-executed
        ("Submission code is never executed in CI").
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: For this benchmark, we introduce Wrenformer
      note: The authors also trained the ALIGNN, CGCNN, CGCNN+P and Voronoi RF entries "for this benchmark".
  execution.compute_tier:
    - value: null
      source: contribute
      quote: For a full contiguous Slurm discovery or kappa array, the runner can infer shard selection
      failure: 2026-09-28-matbench-discovery-005
  execution.reproducibility_tier:
    - value: fully-automatable
      source: contribute
      quote: Run the ingestion script (via uv, no extra install needed) to validate your submission before opening a
        PR. It runs all evaluation scripts
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: contribute
      quote: The shared runners models/run_discovery.py, models/run_kappa.py, models/run_md.py, and models/run_diatomics.py
        are the only entry points for calculator-backed models
notes: The corpus url moved to the GitHub repository; the prerendered site pages (landing leaderboard, contribute, changelog)
  were fetched as statically served maintainer pages. The capabilities.yaml example tags classical-algorithm for Matbench
  Discovery, but every entrant the sources name (GNN potentials, one-shot GNNs, BOWSR with a surrogate energy model,
  random forests) has learned parameters, so it is not tagged.

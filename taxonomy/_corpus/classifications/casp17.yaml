# taxonomy/_corpus/classifications/casp17.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: casp17
corpus_item: 19
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  home: https://predictioncenter.org/casp17/
facets:
  domain.primary:
    - value: biology-genetics/protein-structure-prediction
      source: home
      quote: CASP17 provides an independent mechanism for the assessment of methods of protein structure modeling.
      failure: 2026-09-28-casp17-001
  domain.secondary:
    - value: biology-genetics/protein-protein-interaction
      source: home
      quote: aiming to provide a rich and varied set of non-homologous targets spanning antibody-antigen, nanobody-antigen
        complexes, and T-cell receptor complexes
    - value: biology-genetics/protein-ligand-cofolding
      source: home
      quote: 'Organic Ligand-Protein Complexes: These complexes have obvious importance for the development of new
        small-molecule drugs.'
    - value: biology-genetics/nucleic-acid-structure
      source: home
      quote: CASP17 will include a diversity of non-homologous RNA/DNA structures and protein-nucleic acid complexes
      failure: 2026-09-28-casp17-002
  capability:
    - value: calibration-uncertainty
      source: home
      quote: New this CASP is self-assessment of accuracy for nucleic acid structures and complexes, and for protein-ligand
        complexes.
      failure: 2026-09-28-casp17-003
  evaluation_method:
    - value: expert-panel-assessment
      source: home
      quote: As is the practice in CASP, assessment of the results will be made by the independent assessor teams.
      failure: 2026-09-28-casp17-004
    - value: domain-metric
      source: home
      quote: Assessment criteria will be based on those previously developed in CASP, but assessors may add new
        metrics they consider appropriate.
      note: The page names no metric; the established CASP criteria it points to are discipline-specific structure
        measures, which is what domain-metric carries.
  designed_for_subjects:
    - value: domain-specialist-model
      source: home
      quote: CASP17 provides an independent mechanism for the assessment of methods of protein structure modeling.
      note: The page separates server participants ("Participants with servers are requested to register before
        April 14") from others but never names human-expert or human-in-the-loop groups, so those subjects are not
        tagged for this edition.
  data.access:
    - value: null
      source: home
      quote: Through the Summer and Fall, as the experimental coordinates become available, the tens of thousands
        of models submitted by over 100 research centers worldwide are processed and evaluated.
      failure: 2026-09-28-casp17-005
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: Every two years, participants are invited to submit models for a set of macromolecules and their complexes
        (proteins, RNA, ligands)
  data.data_provenance:
    - value: experimental-measurement
      source: home
      quote: From May through August 2026, structures about to be solved by crystallography, cryo-EM or NMR are
        identified, and their sequences are made available to predictors.
  data.contamination_risk:
    - value: low
      source: home
      quote: for which the experimental structures are not yet public
      note: 'Blind by construction: the reference structure is unreleased while predictions are collected.'
  data.ceiling_anchor_type:
    - value: none-known
      note: The page gives no ceiling for any CASP17 category; "many models competitive in accuracy with experiment"
        (about CASP14) is a comparison, not an anchor. The replicate skyline in the CASP16 nucleic-acid assessment
        belongs to a different entry.
  lifecycle:
    - value: active
      source: home
      quote: The assessors are currently working on the assessment of submitted models.
  activity:
    - value: null
      source: home
      quote: CASP17 prediction season is over as of September 11, 2026.
      failure: 2026-09-28-casp17-006
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: © 2007-2026, University of California, Davis
      note: The Protein Structure Prediction Center, sponsored by NIH/NIGMS; the organising committee spans UMD,
        UC Davis, Basel and Hamburg but has no legal form of its own.
  governance.submission_process:
    - value: assessment-committee
      source: home
      quote: Independent assessors then compare the models with experiment. Assessments and results are posted at
        this website and published in a special issue of a scientific journal
      note: CASP also posts numerical ranking tables; the assessment papers are the authoritative output.
    - value: publication-gated
      source: home
      quote: 'Note: no abstract - no recognition by the assessors and no talk at the conference.'
      note: The gate is a methods abstract, not a full paper.
  governance.independence_flags:
    - value: no-known-conflict
      source: home
      quote: In accordance with CASP policy, assessors cannot take part in the relevant parts of the experiment
        as predictors.
      note: The scientific advisory board lists John Jumper (Google DeepMind) and David Baker, whose groups build
        entrant-class methods; the board advises and does not maintain or assess.
  execution.compute_tier:
    - value: wet-lab
      source: home
      quote: structures about to be solved by crystallography, cryo-EM or NMR are identified
      note: Each edition needs new experimental structures from outside groups. Entrant-side compute is not stated
        and varies by entrant.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: All CASP predictions and results of numerical evaluation will be made available through this web site
        shortly before the meeting.
      note: Holds only after release (announced for the eve of the conference); until then no outside party can
        re-score. A blind re-run needs new experimental structures.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: null
      source: home
      quote: Tools for viewing, comparison, and analysis of submitted models are made available at this site.
      failure: 2026-09-28-casp17-007
notes: CASP17 is in progress. The page now dates the end of the prediction season to September 11, 2026, while its
  own timetable says August 31 and the corpus flag (verified 2026-09-23) quotes August 19; the conference is dated
  November 30 in one place and December 2026 in another. Reproducibility blockers are [] because the only blocker,
  unreleased reference structures, is temporary (see failure 005).

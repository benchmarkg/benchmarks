# taxonomy/_corpus/classifications/open-asr-leaderboard.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: open-asr-leaderboard
corpus_item: 77
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2510.06961
  abs: https://arxiv.org/abs/2510.06961
  home: https://github.com/huggingface/open_asr_leaderboard
  constants: https://huggingface.co/spaces/hf-audio/open_asr_leaderboard/raw/main/constants.py
  init: https://huggingface.co/spaces/hf-audio/open_asr_leaderboard/raw/main/init.py
  privblog: https://huggingface.co/blog/open-asr-leaderboard-private-data
  prtemplate: https://raw.githubusercontent.com/huggingface/open_asr_leaderboard/main/.github/PULL_REQUEST_TEMPLATE.md
facets:
  domain.primary:
    - value: audio-speech/speech-recognition
      source: abs
      quote: We standardize word error rate (WER) and inverse real-time factor (RTFx) evaluation for consistent
        accuracy-efficiency comparisons across model architectures and toolkits
  domain.secondary:
    - value: language/multilingual
      source: paper
      quote: A multilingual benchmark covering German, French, Italian, Spanish, and Portuguese.
      note: The Space has since added Dutch and Hindi ("Add Dutch to multilingual").
  capability:
    - value: perception
      source: home
      quote: The leaderboard is a Gradio Space that allows users to compare the accuracy of ASR models on a variety
        of datasets.
      note: Transcription accuracy (WER) over raw audio. The co-reported speed axis (RTFx) has no capability term;
        see the failure.
      failure: 2026-09-28-open-asr-leaderboard-001
  evaluation_method:
    - value: reference-metric
      source: paper
      quote: On the leaderboard, models are sorted according to average WER across all datasets of a corresponding
        task.
      note: WER after a Whisper-style text normaliser; Hindi is scored against reference lattices with the voi-oiwer
        package. RTFx is reported beside WER but does not rank.
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: The evaluated decoder architectures include transformer-based, CTC (Connectionist Temporal Classification),
        Recurrent Neural Network Transducer (RNN-T), Token-and-Duration Transducer (TDT) [29], and LLM (Large Language
        Model)-based approaches.
      failure: 2026-09-28-open-asr-leaderboard-002
    - value: full-product-pipeline
      source: paper
      quote: seven commercial APIs (AssemblyAI, Aqua Voice, Google, ElevenLabs, Rev AI, Speechmatics, Zoom)
      note: API systems enter as served products (for example ElevenLabs Scribe v2, Zoom Scribe v1) whose components
        are not documented.
  data.access:
    - value: fully-open
      source: paper
      quote: The datasets themselves are hosted on the Hugging Face Hub
      note: All twelve-plus public test sets are downloadable. The Private Data tab (Appen, DataoceanAI, Voice Arena)
        is never released; see the failure.
      failure: 2026-09-28-open-asr-leaderboard-003
  data.refresh:
    - value: versioned-releases
      source: init
      quote: Add versioning for seeing past results.
      note: Dated versions (24-07-2026 to 25-09-2026 in init.py) pin each results CSV to a commit. Datasets are
        still added and removed between versions; see the failure.
      failure: 2026-09-28-open-asr-leaderboard-004
  data.data_provenance:
    - value: real-world-instrument
      source: constants
      quote: are sourced from dual-channel recordings of two-person conversations, segmented per channel to yield
        single-speaker chunks
      note: Every test set is recorded speech (audiobooks, meetings, earnings calls, European Parliament, conversations)
        with human transcripts, taken from existing public corpora or supplied by data vendors.
      failure: 2026-09-28-open-asr-leaderboard-005
  data.contamination_risk:
    - value: medium
      source: paper
      quote: While it is not possible to fully guarantee the absence of test-set contamination, namely that a given
        model has not been trained on a specific evaluation set [23],
      note: The public sets are long-established corpora (LibriSpeech 2015 onward). The maintainers mitigate the
        route with non-commercial-licence sets, a benchmark-fitting tab and private sets, and the paper they cite
        reports contamination in speech LLMs; no contamination of this leaderboard is itself documented.
  data.ceiling_anchor_type:
    - value: none-known
      note: No human transcription WER or other anchor is reported for any test set, and the paper sets no target
        below which WER stops being informative.
  lifecycle:
    - value: active
      source: init
      quote: '"25-09-2026": { "label": "Add abr-ai models (9m, 84m), add Zipformer and Parakeet TDT with fast-asr-gpu
        decoding library, and add sprag API.",'
      note: The Space was last modified on 2026-09-25 (Hugging Face API).
  activity:
    - value: accepting-submissions
      source: constants
      quote: If you want results for a model (or dataset) not listed here, you can directly open a pull request
        (PR) on GitHub!
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: 1 Hugging Face, Inc., France
      note: Maintained by Hugging Face staff (hf-audio); co-authors come from NVIDIA, Cambridge, Mistral AI and
        OpenAI, and models are contributed by PR.
  governance.submission_process:
    - value: containerized-algorithm-submission
      source: home
      quote: Each model family has its own Docker image with the necessary software requirements.
      note: Entrants submit evaluation code and a Space with a Dockerfile, not predictions; API providers submit
        a provider module and a key.
    - value: sandboxed-rerun
      source: paper
      quote: We verify these scripts in our environment to ensure consistent evaluation across models before updating
        the leaderboard.
      note: Since 2026 the maintainers re-run each model on HF Jobs on one H200, and compute the private-set scores
        themselves ("We will verify the results on the public sets and compute the metrics on the private ones").
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: NVIDIA (18), Meta/Facebook (14), OpenAI (8), Hugging Face (5)
      note: The maintainer's own models are ranked (Distil-Whisper, whose first author co-authors the paper), and
        three co-authors are NVIDIA staff whose 18 models are ranked. The private test data come from commercial
        data vendors; see the failure.
      failure: 2026-09-28-open-asr-leaderboard-006
  execution.compute_tier:
    - value: single-gpu
      source: home
      quote: 'Example costs for a full run over the main public datasets for English short-form:'
      note: Official runs use one H200 (141 GB) on HF Jobs, $2.92 to $5.58 per model for the English short-form
        sets. API entrants cost API spend instead.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: 'to guarantee reproducibility: every run executes a Docker image on the same hardware, to minimize
        environment and driver differences.'
      note: For the public sets. The Private Data columns, part of the default average since 24 July 2026, cannot
        be reproduced outside the maintainer (data.access failure).
  execution.reproducibility_blockers:
    - value: private-test-set
      source: constants
      quote: This tab evaluates models on private (non-public) speech datasets from multiple data providers.
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: The script outputs a JSONL file with predictions and prints WER and RTFx after completion.
notes: The corpus url is the evaluation repository because the Space is a script-rendered shell. The Space's own
  app files (constants.py, init.py) were fetched through the Hugging Face raw-file API for this record, with the
  maintainers' private-data blog post and the repository's pull-request template. The leaderboard has three public
  tracks (English short-form, multilingual, English long-form) and a Private Data tab, classified as one benchmark.

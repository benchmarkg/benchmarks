# taxonomy/_corpus/classifications/paperbench.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: paperbench
corpus_item: 44
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2504.01848
  abs: https://arxiv.org/abs/2504.01848
  home: https://github.com/openai/frontier-evals
  readme: https://raw.githubusercontent.com/openai/frontier-evals/main/project/paperbench/README.md
facets:
  domain.primary:
    - value: code/ml-engineering
      source: abs
      quote: Agents must replicate 20 ICML 2024 Spotlight and Oral papers from scratch, including understanding paper
        contributions, developing a codebase, and successfully executing experiments.
      note: 'The task is replicating ML research papers: agents build and run a codebase that a rubric grades. ADR-0020
        defers a code/research-replication subdomain as one benchmark and rules that code/ml-engineering with this note
        stands.'
  domain.secondary:
    - value: agents-tooluse/long-horizon-autonomy
      source: paper
      quote: PaperBench can be used as a measure of model autonomy in OpenAI
      note: Rollouts run 12 to 36 hours unattended.
  capability:
    - value: autonomy
      source: paper
      quote: PaperBench can be used as a measure of model autonomy in OpenAI
      note: The research-engineering competence itself is carried by the domain (code/ml-engineering), as ADR-0020 rules.
    - value: context-integration
      source: abs
      quote: including understanding paper contributions, developing a codebase, and successfully executing
        experiments
      note: The paper, its addendum and its assets are supplied, and the rubric scores whether the replication
        implements what they specify. The paper's own code repository is blacklisted.
  evaluation_method:
    - value: rubric-graded
      source: abs
      quote: we develop rubrics that hierarchically decompose each replication task into smaller sub-tasks with
        clear grading criteria
      note: Leaves are binary, and a parent scores the weighted mean of its children. The 20 rubrics hold 8,316
        leaves.
    - value: model-graded-judge
      source: abs
      quote: we also develop an LLM-based judge to automatically grade replication attempts against rubrics
      note: The official judge is SimpleJudge on o3-mini-high, which scores F1 0.83 against expert labels on the
        authors' JudgeEval.
  designed_for_subjects:
    - value: agent-scaffold
      source: readme
      quote: 'You may use a custom solver: set `paperbench.solver` to point to your custom solver class.'
      note: For custom solvers, which the README invites.
    - value: model-in-benchmark-harness
      source: readme
      quote: IterativeAgent o1-high (36h limit)
      note: Every leaderboard row is a model inside one of the maintainers' two agents (BasicAgent, IterativeAgent), which
        0.9.0 names model-in-benchmark-harness.
    - value: human-expert
      source: readme
      quote: If you have already run your agent or you are a human and have submissions ready to be graded
      note: The paper's human baseline is 8 ML PhDs graded under the same rubric and reproduction step.
  data.access:
    - value: fully-open
      source: readme
      quote: '`rubric.json` file that is used to grade submissions'
      note: Papers, addenda, rubrics and blacklists are in the public repository through Git-LFS. Only the JudgeEval
        tarballs are not redistributed.
  data.refresh:
    - value: null
      failure: 2026-09-28-paperbench-004
  data.data_provenance:
    - value: expert-authored
      source: paper
      quote: Each rubric was written in collaboration with one of the original authors of each paper
    - value: curated-public-database
      source: abs
      quote: Agents must replicate 20 ICML 2024 Spotlight and Oral papers from scratch
      note: The task inputs are papers selected from the ICML 2024 proceedings, a curated scientific archive compiled
        for other purposes, which 0.9.0 separates from web-scraped content. The grading keys are the expert rubrics.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: models that are pre-trained on large corpuses may have internalized solutions, resulting in inflated
        performance on this benchmark
      note: The authors' codebases exist online for almost all papers, and are blacklisted during rollouts. The
        paper judges present-day models "most likely not affected" because the papers are recent.
  data.ceiling_anchor_type:
    - value: expert-best
      source: abs
      quote: we recruit top ML PhDs to attempt a subset of PaperBench, finding that models do not yet outperform the
        human baseline
      note: The anchor is best-of-3 ML-PhD attempts ("use that as an 'expert' score"), 41.4% after 48 hours, and
        it is measured on a 3-paper subset, not on all 20 papers.
  lifecycle:
    - value: null
      failure: 2026-09-28-paperbench-005
  activity:
    - value: no-submission-channel
      source: readme
      quote: If you have already run your agent or you are a human and have submissions ready to be graded
      note: The README's leaderboard holds only the maintainers' own runs, and outside users grade their own submissions
        locally; no route onto the table exists. 0.9.0's no-submission-channel covers a maintainer-run benchmark that
        nobody else can enter.
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: Amelia Glaese Tejal Patwardhan * OpenAI
  governance.submission_process:
    - value: maintainer-run
      source: readme
      quote: IterativeAgent o1-high (36h limit)
      note: The README keeps a leaderboard table of the maintainers' own runs; paperbench is the 0.9.0 near miss on
        literature-only for this reason.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: readme
      quote: IterativeAgent o1-high (36h limit)
      note: OpenAI's o1 in the maintainers' own IterativeAgent tops the maintainer-run leaderboard.
    - value: grader-from-evaluated-party
      source: paper
      quote: Grading costs an additional $66 USD per paper on average with o3-mini SimpleJudge.
      note: The official grader is OpenAI's o3-mini, and it grades Claude, Gemini and DeepSeek submissions as well as
        OpenAI's. Tagged beside maintainer-competes-on-own-benchmark, as 0.9.0 directs when both hold.
  execution.compute_tier:
    - value: single-gpu
      source: paper
      quote: we copy its submission to a fresh VM running an Ubuntu 24.04 image with access to an A10 GPU
      note: The reproduction step runs on an A10 GPU VM for every paper, which the protocol mandates; under 0.9.0 a mandated
        GPU outranks the API spend ($400 per paper for an o1 rollout), and paperbench is the example.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: readme
      quote: is executed in a fresh second container with GPU access so that results from executing the codebase
        are obtained
      failure: 2026-09-28-paperbench-011
  execution.reproducibility_blockers:
    - value: compute-scale
      source: paper
      quote: For the 20 papers, this sums to $8000 USD per eval run.
      note: This is before grading ($66 per paper) and the A10 reproduction step. The Code-Dev variant exists to cut
        this cost.
      failure: 2026-09-28-paperbench-010
  execution.harness_availability:
    - value: official-harness
      source: readme
      quote: This repo contains the dataset and code for the paper
notes: 'Classified as the corpus defines it: PaperBench, arXiv 2504.01848, now in openai/frontier-evals after the
  preparedness repository was renamed. PaperBench Code-Dev, a lighter variant that grades only the code-development
  leaves and skips reproduction, is a track of the same family, and it is not classified separately. The
  corpus flags the LLM judge. The paper validates it on its own JudgeEval, and the record carries both rubric-graded
  and model-graded-judge.'
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, designed_for_subjects, data.data_provenance, activity,
      governance.submission_process, governance.independence_flags, execution.compute_tier,
      execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; seven failures settle, refresh, lifecycle and the hosted-judge blocker stay open,
      and a new record logs the fully-automatable plus compute-scale pair that 02 S11 blocks.

# taxonomy/_corpus/classifications/epoch-capabilities-index.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: epoch-capabilities-index
corpus_item: 88
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2512.00193
  abs: https://arxiv.org/abs/2512.00193
  home: https://epoch.ai/eci
  docs: https://epoch.ai/data/eci-documentation
  repo: https://github.com/epoch-research/eci-public
  about: https://epoch.ai/about
facets:
  domain.primary:
    - value: general-intelligence/agi-composite-suites
      source: home
      quote: The Epoch Capabilities Index (ECI) combines scores from many different AI benchmarks into a single
        “general capability” scale
      note: This is the subdomain's definition almost word for word ("aggregate many heterogeneous tasks into a
        single general-capability score"). holistic-agent-leaderboard-hal abstained because HAL publishes nine
        separate boards with no aggregate, and ECI publishes exactly the aggregate.
  domain.secondary: []
  capability:
    - value: null
      source: home
      quote: ECI is designed to capture a broad, underlying capability useful across many tasks, rather than
        performance on specific skills.
      failure: 2026-09-28-epoch-capabilities-index-001
  evaluation_method:
    - value: composite
      source: docs
      quote: ECI is a composite metric which uses scores from over 50 distinct benchmarks to generate a single,
        general capability scale.
      failure: 2026-09-28-epoch-capabilities-index-002
  designed_for_subjects:
    - value: null
      source: paper
      quote: In cases where there are multiple models with different evaluation settings, we take the max over these
        model performances.
      failure: 2026-09-28-epoch-capabilities-index-003
  data.access:
    - value: fully-open
      source: home
      quote: Epoch AI’s data is free to use, distribute, and reproduce provided the source and authors are credited
        under the Creative Commons Attribution license.
      note: ECI's data is its model-by-benchmark score table, published as CSV and as the benchmark_data.zip the
        fit reads. The constituents' own items range from public sets to Epoch's unpublished FrontierMath problems.
  data.refresh:
    - value: continuously-reexecuted
      source: home
      quote: The model used to produce ECI scores is fit jointly across all data. As new models and new benchmark
        evaluations are obtained, values may shift slightly even for models whose data have not changed.
  data.data_provenance:
    - value: null
      source: home
      quote: Model-by-benchmark scores used to fit the ECI.
      failure: 2026-09-28-epoch-capabilities-index-004
  data.contamination_risk:
    - value: medium
      source: home
      quote: One shortcoming is that model developers can optimize for high performance on certain benchmarks, so
        that we overestimate the capabilities of some models.
      note: The risk is inherited. Many constituents are public static sets of some age (MMLU, GSM8K, HellaSwag),
        and ECI does not assess leakage into any of them.
  data.ceiling_anchor_type:
    - value: null
      source: home
      quote: Note that as with Elo scores, there is no maximum achievable ECI.
      failure: 2026-09-28-epoch-capabilities-index-005
  lifecycle:
    - value: active
      source: home
      quote: Updated Sep. 28, 2026
      note: The ECI model scores, benchmark results and difficulty tables were all updated on the classification
        date.
  activity:
    - value: null
      source: home
      quote: we require a minimum of 4 benchmark evaluations for any model to ensure ECI scores are both stable and
        fair
      failure: 2026-09-28-epoch-capabilities-index-006
  governance.maintainer_type:
    - value: nonprofit
      source: about
      quote: Epoch AI is a data-first research nonprofit investigating the future of artificial intelligence.
  governance.submission_process:
    - value: self-reported
      source: home
      quote: with scores obtained from developer reports (i.e. model cards and technical reports)
      failure: 2026-09-28-epoch-capabilities-index-007
  governance.independence_flags:
    - value: funded-by-evaluated-party
      source: paper
      quote: This work was financially supported by Google DeepMind.
      note: The documentation adds that "the ECI is an independent Epoch AI product that Epoch has full rights over".
      failure: 2026-09-28-epoch-capabilities-index-008
    - value: evaluator-sells-evaluations
      source: about
      quote: including commissioned research, model evaluations, and consultations
  execution.compute_tier:
    - value: null
      source: repo
      quote: Download benchmark_data.zip, fit model and save results to outputs/
      failure: 2026-09-28-epoch-capabilities-index-009
  execution.reproducibility_tier:
    - value: fully-automatable
      source: repo
      quote: The fit runs from Epoch's raw benchmark data,
      note: This holds for recomputing the index from Epoch's published score table. Reproducing the input scores
        themselves is each constituent's problem, and some cannot be reproduced outside Epoch or the developer
        that reported them (failure 009).
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: This package fits the ECI model,
notes: The corpus flags ECI as an aggregate index over other catalogue entries. Under 02 S11 rule 5 its constituents
  belong to their own families (gpqa-diamond, frontiermath-tiers-erd-s, humanity-s-last-exam, swe-bench-verified,
  osworld-2-0, terminal-bench-2-0 and arc-agi-2 are corpus entries), so the record classifies what ECI contributes,
  which is the statistical scale, its data table and its governance. No secondary domain is recorded. The index's own domain
  tags (Agent, Mathematics, Software engineering and so on) and its domain-specific variants (Software engineering,
  Math and Cyber ECI) are views over constituents, whose subdomains are recorded on the constituents' own records.
  The Cyber ECI "incorporates cyber benchmarks that are not part of the general ECI", so it is a separate index
  in the same family rather than a subset.

# taxonomy/_corpus/classifications/open-problems-in-single-cell-analysis.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: open-problems-in-single-cell-analysis
corpus_item: 24
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://doi.org/10.1038/s41587-025-02694-w
  home: https://openproblems.bio/
  repo: https://github.com/openproblems-bio/openproblems
  benchmarks: https://openproblems.bio/benchmarks/
  label: https://openproblems.bio/benchmarks/label_projection/
  governance: https://openproblems.bio/governance/
  about: https://openproblems.bio/about/
  events: https://openproblems.bio/events/
  docs: https://openproblems.bio/documentation/
  safeguards: https://openproblems.bio/documentation/advanced_topics/safeguards/
  stack: https://openproblems.bio/documentation/advanced_topics/technology-stack/
  pr: https://openproblems.bio/documentation/create_component/create-pull-request/
facets:
  domain.primary:
    - value: biology-genetics/single-cell-analysis
      source: home
      quote: Benchmarking the open problems in single-cell analysis.
      note: 0.9.0 redefines the subdomain to cover integrated embeddings, denoised profiles, spatial deconvolution and
        inferred interactions as well as labels, and open-problems is its example. Perturbation prediction is one task
        of 13 and goes to secondary.
  domain.secondary:
    - value: biology-genetics/perturbation-response-prediction
      source: benchmarks
      quote: Predicting how small molecules change gene expression in different cell types.
  capability:
    - value: scientific-prediction
      source: benchmarks
      quote: Predicting the profiles of one modality (e.g. protein abundance) from another (e.g. mRNA expression).
      note: Predict Modality and Perturbation Prediction ('Predicting how small molecules change gene expression in
        different cell types') claim prediction of a measured cellular state and score it against the measurement
        (ADR-0014). The other eleven tasks are analysis steps the term does not cover (failure 009).
      failure: 2026-09-28-open-problems-in-single-cell-analysis-009
  evaluation_method:
    - value: composite
      source: home
      quote: Every method scored across each dataset and metric, in a single funkyheatmap. Results are scaled using
        control methods for easy comparison.
      note: Each task's overall score averages metrics of different methods, such as Label Projection's accuracy and
        F1. The scaling uses fixed control methods, so entrant-relative-ranking does not apply (open-problems is its
        near miss).
    - value: exact-match
      source: label
      quote: The percentage of correctly predicted labels.
      note: Label Projection's accuracy, a mean of per-cell verdicts against the annotated cell type.
    - value: classification-metric
      source: label
      quote: Unweighted mean of each label F1-score
      note: Label Projection's F1 macro, micro and weighted; only this task page was fetched, so other tasks'
        constituent methods are not tagged.
  designed_for_subjects:
    - value: domain-specialist-model
      source: docs
      quote: OpenProblems is a framework for machine learning scientists, computational biologists, and single-cell
        data analysts to benchmark and compare single-cell omics methods on a variety of tasks.
  data.access:
    - value: fully-open
      source: home
      quote: Public, ready-to-use gold-standard datasets curated and version-controlled by the community.
      note: Governance qualifies this with "datasets (where licensing permits)".
  data.refresh:
    - value: continuously-reexecuted
      source: home
      quote: State-of-the-art methods are ranked and re-run automatically as the field evolves.
      note: Tasks also carry release labels ('18 methods 6 datasets 13 metrics 6 releases'), but 0.9.0 gives
        continuously-reexecuted precedence, because a label does not pin a re-executed result.
  data.data_provenance:
    - value: curated-public-database
      source: stack
      quote: These datasets are derived from sources like CELLxGENE census and GEO and are processed by a standardized
        dataset processing pipeline.
      note: The datasets are selected and reprocessed from curated public archives that were not published as
        evaluation datasets.
  data.contamination_risk:
    - value: medium
      source: stack
      quote: These datasets are derived from sources like CELLxGENE census and GEO
      note: Public data of any age; foundation-model entrants may be pretrained on the same repositories. No leakage
        is evidenced.
  data.ceiling_anchor_type:
    - value: null
      source: safeguards
      quote: Positive controls return the solution directly (or, when a perfect solution does not exist, produce
        a near-perfect score on at least one metric). They set an upper performance limit, indicating the best possible
        result under ideal conditions.
      failure: 2026-09-28-open-problems-in-single-cell-analysis-006
  lifecycle:
    - value: active
      source: home
      quote: State-of-the-art methods are ranked and re-run automatically as the field evolves.
      note: Task pages show 2026 release candidates (Label Projection 2.1.0-rc2), and the sponsors page lists partners
        added in 2026.
  activity:
    - value: leaderboard-live-no-round
      source: home
      quote: anyone can contribute a new method or propose a new problem
      note: The last competition on the events page is NeurIPS 2023; later events are hackathons and conferences.
  governance.maintainer_type:
    - value: community-collective
      source: home
      quote: A community-owned platform for benchmarking single-cell analysis.
      note: The site speaks of 'the consortium', but no legal entity is stated, and NumFOCUS is only the fiscal host
        ('providing nonprofit financial and administrative support'); open-problems is the 0.9.0 example.
  governance.submission_process:
    - value: sandboxed-rerun
      source: home
      quote: Open Problems is hosted on GitHub with benchmarks run on cloud infrastructure supported by the Chan
        Zuckerberg Initiative.
      note: Methods arrive as Viash components by pull request ("Your PR will be reviewed by OpenProblems maintainers"),
        each with its own Docker image, and the maintainers' pipeline runs them. The datasets are public, so 0.9.0's
        tie-break gives sandboxed-rerun, not containerized-algorithm-submission, which needs data the participant never
        sees.
  governance.independence_flags:
    - value: null
      source: paper
      quote: D.B.B. is a paid employee of and has equity interest in NVIDIA.
      failure: 2026-09-28-open-problems-in-single-cell-analysis-008
  execution.compute_tier:
    - value: provided-allocation
      source: home
      quote: Open Problems is hosted on GitHub with benchmarks run on cloud infrastructure supported by the Chan
        Zuckerberg Initiative.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: safeguards
      quote: It can run on HPC clusters, cloud infrastructure, or locally.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: All Open Problems code is publicly available at https://www.github.com/openproblems-bio/openproblems.
notes: The Nature Biotechnology correspondence is paywalled; only its preview, code availability, acknowledgements
  and competing interests were readable. Platform facts come from openproblems.bio pages (benchmarks, governance,
  about, events, documentation) and one task page (Label Projection) as a sample. The paper preview says 12 tasks
  and the site says 13.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, evaluation_method, data.refresh, data.data_provenance,
      governance.maintainer_type, governance.submission_process]
    note: Re-adjudicated against 0.9.0; scientific-prediction covers the two prediction tasks only.

# taxonomy/_corpus/classifications/brain-score.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: brain-score
corpus_item: 26
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  abstract: https://europepmc.org/abstract/MED/32918861
  epmc: https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&resultType=core&query=DOI:10.1016/j.neuron.2020.07.040
  home: https://www.brain-score.org/
  faq: https://www.brain-score.org/faq/
  repo: https://github.com/brain-score/vision
  preprint: https://www.biorxiv.org/content/10.1101/407007v2.full
facets:
  domain.primary:
    - value: biology-genetics/brain-model-alignment
      source: preprint
      quote: 'Neural metrics assess the similarity of internally observable signals: image-evoked feature activations
        in ANNs and image-evoked recorded neural activations in different primate brain regions.'
      note: The claim is brain alignment, so brain-model-alignment holds the benchmark (ADR-0020). The behavioural
        component, I2n, correlates the model's image-by-image error pattern with human observers' and is recorded here
        rather than as a second subdomain.
  domain.secondary: []
  capability:
    - value: null
      source: abstract
      quote: push mechanistic models toward explaining entire domains of intelligence, such as vision, language,
        and motor control
      note: Re-read for scientific-prediction (ADR-0014). Neural Predictivity maps activations to recordings through a
        regression fitted per model, but the benchmark's own claim is that a model is brain-like, not that it predicts
        a measured quantity, so the term's inclusion test is not met and it is not tagged.
      failure: 2026-09-28-brain-score-002
  evaluation_method:
    - value: statistical-fit
      source: preprint
      quote: we compare predicted responses y′ with the measured neuroid responses y by computing the Pearson correlation
        coefficient r
      note: The behavioural benchmark (I2n) is also a Pearson correlation, between model and human d-prime patterns,
        divided by a noise ceiling. The PLS mapping is fitted afresh for each submitted model, so it is not a scoring
        model (model-derived-metric's near miss), and the leaderboard average ('Models are ranked according to their
        average score across all the benchmarks') combines sub-scores of one method, which composite excludes.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: preprint
      quote: we found that gains in ANN ImageNet performance led to gains on Brain-Score
      note: The candidates are ImageNet-trained CNNs and vision transformers scored as they stand against neural and
        behavioural recordings; brain-score is the 0.9.0 example.
    - value: classical-algorithm
      source: faq
      quote: Note that Brain-Score is agnostic to the exact model family, e.g. this could be an artificial neural
        network or a hand-crafted predictor.
      note: Hand-crafted predictors are admitted as entrants, and 0.9.0's classical-algorithm no longer requires a
        comparison role.
  data.access:
    - value: private-test-server
      source: repo
      quote: Note that you can only access a limited set of public benchmarks when running locally.
      note: The headline average needs benchmarks held on the maintainers' servers ('To score a model on all benchmarks,
        submit it via the brain-score.org website'), so the mixed-headline rule gives private-test-server.
  data.refresh:
    - value: rolling-live
      source: preprint
      quote: The Brain-Score and the ranking of models will be updated regularly as new experimental benchmarks
        are added and new ANNs become available.
      note: The site lists benchmark additions dated from 2024-12 (Brain-Score 2.0) to 2026-09-09.
  data.data_provenance:
    - value: experimental-measurement
      source: preprint
      quote: Two macaque monkeys were implanted three arrays each, with one array placed in area V4 and the other
        two placed on the posterior-anterior axis of IT cortex.
      note: The arrays record responses to controlled image stimuli, the outcome of a designed experiment, which 0.9.0
        separates from real-world-instrument; the human psychophysics is a designed experiment too.
    - value: synthetic-procedural
      source: preprint
      quote: The image set was generated by pasting a 3D object model on a naturalist background.
  data.contamination_risk:
    - value: unknown
      note: No source assesses contamination. The private benchmarks are held server-side, which works against leakage,
        while the public ones (e.g. MajajHong2015public) are downloadable; nothing says whether candidate models
        were trained on the stimuli or on the neural data.
  data.ceiling_anchor_type:
    - value: noise-ceiling
      source: faq
      quote: 1 means the model matches the measurements at ceiling level such that no more data can be explained
        due to noise in the signal
  lifecycle:
    - value: active
      source: home
      quote: Sep 9, 2026 V4 single-unit (Cowley2026) benchmark added
  activity:
    - value: leaderboard-live-no-round
      source: home
      quote: Below you will find links on how to prepare a model for submission and receive a Brain-Score!
      note: Brain-Score has run competition rounds (the site links 'Competition 2024'), and none is open, so 0.9.0 gives
        the standing leaderboard leaderboard-live-no-round over accepting-submissions.
  governance.maintainer_type:
    - value: academic-lab
      source: epmc
      quote: Department of Brain and Cognitive Sciences, MIT, Cambridge, MA, USA
      note: The platform was built and is published by the MIT DiCarlo group, and no source names another holder of the
        brain-score repositories or site. Plugins contributed by outside groups do not make a lab-held benchmark a
        community-collective (0.9.0 tie-break).
  governance.submission_process:
    - value: sandboxed-rerun
      source: faq
      quote: If this pull request passes all of the Jenkins tests, the PR will be merged and the scoring of your
        plugin will begin.
      note: A plugin is not a container image, so 0.9.0's tie-break gives sandboxed-rerun; brain-score is its example.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: preprint
      quote: We also tested CORnet-S, a new model that was developed with the goal of rivaling the best models on
        Brain-Score while being significantly shallower than competitors
      note: The preprint also ranks "an in-house-developed family of models", the BaseNets. CORnet-S placed second
        in the preprint ranking.
  execution.compute_tier:
    - value: provided-allocation
      source: faq
      quote: The submission and scoring process can vary depending on server availability
      note: Official scores are computed on the maintainers' servers after a submission is merged. Public benchmarks
        can also be scored locally with pip install brainscore-vision.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: repo
      quote: To score a model on all benchmarks, submit it via the [brain-score.org website](http://www.brain-score.org).
      note: The value is for the leaderboard average, which includes private benchmarks. A score on a public benchmark
        alone is fully automatable locally (see the data.access failure).
  execution.reproducibility_blockers:
    - value: private-test-set
      source: repo
      quote: Note that you can only access a limited set of public benchmarks when running locally.
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: 'Test if the installation is successful by scoring a model on a public benchmark:'
notes: The Neuron paper (the corpus primary_paper) is paywalled; its abstract and author affiliations come from
  Europe PMC. The 2018 bioRxiv technical preprint, which the corpus flags as a competing primary and which the README
  asks users to cite alongside the Neuron perspective, was fetched and supplies the metric definitions. Brain-Score
  Vision and Brain-Score Language share the site and are treated as one family; the quoted metrics are from Vision.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, evaluation_method, designed_for_subjects, data.access,
      data.data_provenance, activity, governance.maintainer_type, governance.submission_process]
    note: Re-adjudicated against 0.9.0; composite is dropped and the capability stays open (biological-fidelity is
      deferred).

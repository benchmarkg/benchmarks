# taxonomy/_corpus/classifications/vbench-2-0.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: vbench-2-0
corpus_item: 63
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2503.21755
  abs: https://arxiv.org/abs/2503.21755
  home: https://vchitect.github.io/VBench-2.0-project/
  repo: https://github.com/Vchitect/VBench
  vb2readme: https://raw.githubusercontent.com/Vchitect/VBench/master/VBench-2.0/README.md
  lbconst: https://huggingface.co/spaces/Vchitect/VBench_Leaderboard/raw/main/constants.py
  commits: https://api.github.com/repos/Vchitect/VBench/commits?path=VBench-2.0&per_page=15
facets:
  domain.primary:
    - value: vision/video-generation
      source: home
      quote: we introduce VBench-2.0, a next-generation benchmark designed to automatically evaluate video generative
        models for their intrinsic faithfulness.
      failure: 2026-09-28-vbench-2-0-001
  domain.secondary:
    - value: multimodal/any-to-any-generation
      source: paper
      quote: This dimension measures how accurately the model can render specific entities, events, content, and camera
        movements in response to detailed textual instructions.
      note: The seven Controllability dimensions score whether the text-to-video output corresponds to the prompt.
  capability:
    - value: generation-fidelity
      source: home
      quote: we introduce VBench-2.0, a next-generation benchmark designed to automatically evaluate video generative
        models for their intrinsic faithfulness.
      note: Faithfulness to physical laws, anatomy, commonsense and the prompt. The Diversity dimension has no capability
        term (see the failure).
      failure: 2026-09-28-vbench-2-0-002
    - value: instruction-following
      source: paper
      quote: This dimension measures how accurately the model can render specific entities, events, content, and camera
        movements in response to detailed textual instructions.
      note: The source's own framing of Controllability is following complex prompts ("ability to follow complex prompts").
  evaluation_method:
    - value: model-graded-judge
      source: paper
      quote: Unless otherwise specified, we adopt LLaVA-Video-7B [75] as our VLM model and Qwen2.5-7B-Instruct [76] as
        LLM model.
      note: 'Judges: LLaVA-Video-7B (video question answering and captioning) and Qwen2.5-7B-Instruct (text alignment,
        for example "the LLM will determine whether the standardized description matches the ground truth").'
    - value: model-derived-metric
      source: paper
      quote: We use a pre-trained ViT-base model [77] to train three anomaly detection models
      note: Human Anatomy uses the anomaly detectors, Diversity uses VGG-19 feature statistics, and Multi-View Consistency
        uses feature-matching stability.
    - value: composite
      source: vb2readme
      quote: Total Score = 0.2 * (Creativity Score + Commonsense Score + Controllability Score + Human Fidelity Score +
        Physics Score)
  designed_for_subjects:
    - value: generative-media-model
      source: home
      quote: we introduce VBench-2.0, a next-generation benchmark designed to automatically evaluate video generative
        models for their intrinsic faithfulness.
      note: subjects.yaml cites vbench (1.0) as a qualifying example. Closed models (Kling 1.6, Sora) were sampled through
        their API or website, and all but Sora through the benchmark's own Prompt Refiner.
  data.access:
    - value: fully-open
      source: paper
      quote: VBench-2.0 will be fully open-sourced
      note: The prompt suite (VBench2_full_info.json), the fixed GPT-4o descriptions, the evaluation code and the sampled
        videos are all in the public repository and its linked Drive folder. There are no withheld labels.
  data.refresh:
    - value: versioned-releases
      source: vb2readme
      quote: Major Update! We released
      note: VBench (CVPR 2024, 16 dimensions), VBench++ (TPAMI 2025) and VBench-2.0 (March 2025, 18 dimensions) are
        labelled releases of one family, and the leaderboard keeps a separate tab for each.
  data.data_provenance:
    - value: expert-authored
      source: paper
      quote: For each evaluation dimension in VBench-2.0, we carefully construct a suite of approximately 70 prompts
      note: The prompts were written by the authors, recorded as expert-authored as in webarena and minif2f-minif2f-dafny.
    - value: model-generated
      source: paper
      quote: we prompt GPT-4o to generate explicit visual descriptions of expected physical behavior
      note: The Physics references are GPT-4o descriptions of each prompt's expected outcome. The scored items themselves
        are the videos each entrant generates.
  data.contamination_risk:
    - value: medium
      source: vb2readme
      quote: VBench-2.0 is designed for evaluating different models on a standard benchmark.
      note: The prompts and their reference descriptions are public and fixed, so a generator can be tuned on them. No
        source assesses contamination or prompt overfitting.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: the final score is the percentage of frames that are not flagged as abnormal
      note: Dimension scores are proportions, and the Total Score averages them, so 100% is the top of the scale. Human
        annotations validate the evaluators (win ratios); no human or real-video baseline is reported.
  lifecycle:
    - value: active
      source: commits
      quote: '"date": "2025-10-16T08:14:56Z" }, "message": "[update] veo3, tomoviee-2.0"'
      note: The maintainers updated the VBench-2.0 folder for new models (Veo 3, Tomoviee 2.0) in October 2025, and last
        changed its code on 2026-01-08.
  activity:
    - value: accepting-submissions
      source: vb2readme
      quote: To submit your sampled videos for evaluation, please complete this
      note: The Hugging Face leaderboard (maintained by the VBench team) also takes uploads of self-computed results.
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: Z. Huang, Y. Zhang, Z. Liu are with the S-Lab, Nanyang Technological University.
      failure: 2026-09-28-vbench-2-0-004
  governance.submission_process:
    - value: self-reported
      source: lbconst
      quote: upload the generated `result.json` file here.
      note: Uncertified rows. Certified rows are evaluated by the VBench team (see the failure).
      failure: 2026-09-28-vbench-2-0-003
  governance.independence_flags:
    - value: null
      failure: 2026-09-28-vbench-2-0-005
  execution.compute_tier:
    - value: single-gpu
      source: vb2readme
      quote: Evaluate 18 dimensions sequentially on a single GPU (not recommended)
      failure: 2026-09-28-vbench-2-0-006
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: the GPT-4o-generated descriptions are based solely on the text prompt, remain fixed during evaluation, and
        do not compromise evaluation reproducibility.
      note: Scoring runs on open-weight judges and detectors. Re-sampling a closed generator depends on the vendor still
        serving the same model.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: vb2readme
      quote: Use VBench-2.0 to evaluate videos, and video generative models.
notes: The corpus entry is VBench-2.0 (arXiv 2503.21755, v2 of 20 August 2025). The repository and leaderboard serve the
  whole VBench family, and the record is scoped to the VBench-2.0 folder, README and leaderboard tab. The taxonomy's examples
  cite 'vbench' (the 16-dimension VBench 1.0), not this entry. The leaderboard's result tables sit in a private Hugging
  Face dataset (Vchitect/vbench_leaderboard_submission), so rows and certification tiers could not be read. The commit
  history of the VBench-2.0 folder (GitHub API) was fetched to date the maintainers' activity.

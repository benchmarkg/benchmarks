# taxonomy/_corpus/classifications/voxsrc-retired-2023.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: voxsrc-retired-2023
corpus_item: 81
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2408.14886
  abs: https://arxiv.org/abs/2408.14886
  home: https://mm.kaist.ac.kr/datasets/voxceleb/voxsrc/competition2023.html
  project: https://mm.kaist.ac.kr/datasets/voxceleb/voxsrc/workshop.html
  server: https://zeus.robots.ox.ac.uk/competitions/competitions/14
  devkit: https://github.com/JaesungHuh/VoxSRC2023
facets:
  domain.primary:
    - value: audio-speech/speaker-tasks
      source: home
      quote: Track 1, 2 and 3 are speaker verification tracks, where the task is to determine whether two samples
        of speech are from the same person.
      note: Track 4 is speaker diarisation, which the same subdomain names.
  domain.secondary: []
  capability:
    - value: perception
      source: home
      quote: The goal of this challenge is to probe how well current methods can recognise speakers from speech
        obtained 'in the wild'.
    - value: distribution-shift-generalization
      source: home
      quote: a large set of unlabelled data in a target domain (a subset of the CnCeleb2 dev set without speaker
        labels)
      note: Track 3 (semi-supervised domain adaptation), scored on the CnCeleb target domain. The verification task
        and its same-or-different label set are unchanged and only the inputs move, so 0.9.0's tie-break gives this
        term and not transfer-learning, whatever the source calls the adaptation.
  evaluation_method:
    - value: domain-metric
      source: paper
      quote: The evaluation protocols and metrics are adopted, with minor modifications, directly from NIST SRE
        challenges [7] for the verification tracks, and from DIHARD [11] for the diarisation track.
      note: minDCF ranks Tracks 1 and 2 and DER Track 4.
    - value: classification-metric
      source: home
      quote: For track 3, the primary metric is EER, as this is a more forgiving metric.
      note: The equal error rate is the operating point of the score ranking where false acceptance equals false
        rejection, a general detection statistic.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: home
      quote: Participants can only use VoxCeleb2 dev dataset for which we have already released speaker labels.
      note: Speaker-embedding and diarisation systems trained on VoxCeleb2 dev; speaker verification is a general
        audio task, which 0.9.0 names in the term's test.
  data.access:
    - value: fully-open
      source: project
      quote: This website provides an overview of the VoxSRC challenges, links to the previous challenges and ground
        truth of all test pairs from 2019 to 2023.
      note: During each challenge the test labels were withheld (train-open-test-held-out); they are now all released.
  data.refresh:
    - value: periodic-recompetition
      source: project
      quote: with new test sets released each year.
      note: The 2023 test set combines the test pairs of 2019, 2021, 2022 and 2023.
  data.data_provenance:
    - value: web-scraped
      source: home
      quote: The data is obtained from YouTube videos of celebrity interviews, as well as news shows, talk shows,
        and debates
      note: Test identities were checked manually, and the diarisation test sets were annotated by a vendor team.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: A particular challenge is siloing the test set, to ensure that it has not been used for training.
      note: All test labels have been public since the series ended, and the audio comes from public YouTube videos.
        No source documents a leak.
  data.ceiling_anchor_type:
    - value: none-known
      note: No human or measured ceiling is reported. The retrospective calls winners below 1% EER on the 2019 test
        set "performance saturation", a threshold rather than an anchor.
  lifecycle:
    - value: mature
      source: project
      quote: The series of VoxSRC challenges has now officially finished.
      note: The maintainers ended the series; the test sets and labels stay available ('all the training and validation
        data was (and will continue to be) free and available') and the result record is settled in the retrospective.
        Under ADR-0019 the ending goes to activity and lifecycle keeps the instrument's standing. No maintainer
        source dates a result after 2023, so mature rather than active.
  activity:
    - value: leaderboard-live-no-round
      source: server
      quote: Submissions for comparison with previous ones. Not to be taken into account for the challenge workshop
      note: The VoxSRC-23 server lists its permanent phase as current, with "Competition Ends Never" (checked on
        the Track 3 server). The test labels are public, so its scores no longer rest on held-out data. voxsrc-retired-2023
        is this term's example (ADR-0019).
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: Copyright © Visual Geometry Group.
      note: VGG (Oxford) with KAIST, which now hosts the pages; organisers also came from CMU, FAIR, Google Research
        and AWS.
  governance.submission_process:
    - value: held-out-server
      source: paper
      quote: For speaker verification tracks, we provided a list of pairs with corresponding audio files and asked
        the participants to submit the prediction scores for whether each pair was from the same speaker or not.
    - value: publication-gated
      source: home
      quote: Entries to the challenge will only be considered if a technical report is submitted on time.
    - value: maintainer-scored-predictions
      source: paper
      quote: We also opened a permanent phase after the workshop ended to let people both in industry and academia
        evaluate their systems with our test set and compare them against competition winners’ performance.
      note: The permanent phase still scores submitted predictions, and since the series ended every test label is
        public, so the server's scoring now guards the arithmetic, not the test set. held-out-server records the
        challenge phases.
  governance.independence_flags:
    - value: null
      source: home
      quote: there will be cash prizes for the top 3 on the leaderboard for each track.
      failure: 2026-09-28-voxsrc-retired-2023-005
  execution.compute_tier:
    - value: null
      failure: 2026-09-28-voxsrc-retired-2023-004
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: The code in this toolkit was identical to the one which organisers use for evaluation, preventing possible
        performance differences stemming from implementation mismatches.
      note: With the test labels released, any result can be rescored locally.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: The code in this toolkit was identical to the one which organisers use for evaluation
notes: The corpus entry is the retired series, with the VoxSRC-23 page as its url and the 2024 retrospective as
  its paper. The project page (which releases all test labels and states that the series has ended), the VoxSRC-23
  evaluation server and the 2023 development kit were fetched for this record. Classified as the family across its
  five editions, with the 2023 page supplying the final rules.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, evaluation_method, designed_for_subjects, lifecycle, activity,
      governance.submission_process, governance.independence_flags]
    note: Re-adjudicated against 0.9.0; ADR-0019 gives the concluded series mature, with the ending in activity.

# taxonomy/_corpus/classifications/fair-universe-higgsml-uncertainty-challenge.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: fair-universe-higgsml-uncertainty-challenge
corpus_item: 50
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2410.02867
  abs: https://arxiv.org/abs/2410.02867
  home: https://fair-universe.lbl.gov/
  codabench: https://www.codabench.org/api/competitions/2977/
facets:
  domain.primary:
    - value: physics/particle-physics
      source: abs
      quote: Each instance represents a simulated proton-proton collision as observed at CERN's Large Hadron Collider
        in Geneva, Switzerland.
  domain.secondary: []
  capability:
    - value: calibration-uncertainty
      source: abs
      quote: Participants were required to compute and report confidence intervals for a parameter of interest regarding
        the Higgs boson while accounting for various systematic (epistemic) uncertainties.
  evaluation_method:
    - value: uncertainty-calibration-score
      source: paper
      quote: 'The final Quantile Score (the larger the better) used to rank participants is calculated as follows:'
      note: The score combines average 68.27% interval width with an asymmetric penalty on coverage, over 100 pseudo-experiments
        x 1000 trials in the final evaluation.
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: Participants provided a model that can analyse a pseudo-experiment to determine
      note: Entrants are task-specific HEP inference pipelines (the winners used simulation-based inference and
        contrastive normalising flows), as with the brats-2026-cluster precedent.
  data.access:
    - value: train-open-test-held-out
      source: paper
      quote: A separate 120M i.i.d dataset has been used for the final results in section 5 and is kept private
        for future over-training checks.
      note: The 280M-event training set is on Zenodo, and "Registration is not required to access the dataset".
  data.refresh:
    - value: null
      source: paper
      quote: All submissions were run on the same pseudo-experiments, instead of separate pseudo-experiments for
        the public leaderboard.
      failure: 2026-09-28-fair-universe-higgsml-uncertainty-challenge-001
  data.data_provenance:
    - value: simulation-generated
      source: paper
      quote: The dataset [65] was created with two widely-used simulation tools, Pythia 8.2 [68] and Delphes 3.5.0
        [69]
  data.contamination_risk:
    - value: low
      source: paper
      quote: A separate 120M i.i.d dataset has been used for the final results in section 5 and is kept private
        for future over-training checks.
      note: The final evaluation set is private, and participants' code was run on pseudo-experiments it never saw.
  data.ceiling_anchor_type:
    - value: none-known
      note: No ceiling is reported. The paper says the winners' results "are not very correlated which implies the
        optimum has not been reached yet"; the epsilon = 0.01 regulariser bounds the score but is not presented
        as an anchor.
  lifecycle:
    - value: mature
      source: home
      quote: We have announced the results and winners of NeurIPS 2024 Higgs Uncertainty challenge.
      note: Winners were announced on 2025-05-08 and the public dataset was released on Zenodo on 2025-05-16; the
        paper intends it to "serve as a long-lasting benchmark". FAIR Universe has since moved to the Weak Lensing
        challenges, a different task.
  activity:
    - value: closed
      source: codabench
      quote: (Ended) FAIR UNIVERSE - Higgs Uncertainty Challenge
      note: The only phase ran from 2024-08-31 to 2025-03-14 and has status "Previous".
  governance.maintainer_type:
    - value: government-agency
      source: paper
      quote: 'Wahid Bhimji Affiliation: Lawrence Berkeley National Laboratory'
      failure: 2026-09-28-fair-universe-higgsml-uncertainty-challenge-002
      note: Bhimji is the "FAIR Universe Project Principal Investigator" (home); the project site is on lbl.gov
        and DOE-funded.
  governance.submission_process:
    - value: sandboxed-rerun
      source: codabench
      quote: Participant's code is called multiple times to make predictions for multiple test sets(pseudo experiments).
      note: Entrants submit model code (optionally pre-trained weights), which Codabench runs in the organisers'
        docker image on the NERSC queue; every submission was re-run on a new dataset for the final ranking.
  governance.independence_flags:
    - value: null
      source: codabench
      quote: This challenge is for educational purposes only and no prizes are granted.
      failure: 2026-09-28-fair-universe-higgsml-uncertainty-challenge-003
  execution.compute_tier:
    - value: provided-allocation
      source: codabench
      quote: Throughout the competition, participants’ submissions will be run on either the Perlmutter supercomputer
        at NERSC or an alternative workstation at LBNL
      note: Inference ran on organiser hardware (one Perlmutter node, 4 A100s). Training compute is the entrant's
        own and unstated; generating the data took 1.8 million CPU core hours.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: paper
      quote: A separate 120M i.i.d dataset has been used for the final results in section 5 and is kept private
        for future over-training checks.
      note: The official final scores need the private set. Public-leaderboard-style scoring can be re-run on the
        public data with the released scoring code.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: paper
      quote: A separate 120M i.i.d dataset has been used for the final results in section 5 and is kept private
        for future over-training checks.
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: This includes a Jupyter notebook starting kit, simple baseline models, a small sample of the dataset,
        and code to compute the score.
notes: The corpus URL is the FAIR Universe project page, which now leads with the 2026 Weak Lensing challenge. The
  competition record comes from the Codabench API for competition 2977 (the JS-rendered page's own data). That record
  also contains organiser e-mail addresses and a queue broker URL, none of which is quoted. Its Terms ("no prizes
  are granted") contradict its Prizes page and reward field ("A pool of 4000 USD"); see failure 003.

# taxonomy/_corpus/classifications/video-mme-v2.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: video-mme-v2
corpus_item: 10
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2604.05015
  abs: https://arxiv.org/abs/2604.05015
  home: https://video-mme-v2.netlify.app/
  repo: https://github.com/MME-Benchmarks/Video-MME-v2
  hf: https://huggingface.co/datasets/MME-Benchmarks/Video-MME-v2
facets:
  domain.primary:
    - value: multimodal/video-language
      source: abs
      quote: we introduce Video-MME-v2, a comprehensive benchmark designed to rigorously evaluate the robustness
        and faithfulness of video understanding
      note: Question answering about a video is video-language even when the benchmark calls itself video
        understanding; vision/video-understanding keeps label-scored recognition (0.9.0, 02 S11 rule 12).
  domain.secondary:
    - value: multimodal/audio-language
      source: paper
      quote: For Omni models that accept raw audio (e.g., MiMo-v2-Omni, Gemini-3-Pro), as well as the human
        baseline, we report results with raw audio input under the w. sub setting
      note: Level 1 aggregates "multimodal cues (frames, audio, subtitles)". Audio is a scored input for omni
        models, not a separate track.
  capability:
    - value: perception
      source: abs
      quote: ranging from multi-point visual information aggregation, to temporal dynamics modeling, and
        ultimately to complex multimodal reasoning
    - value: temporal-reasoning
      source: repo
      quote: Focuses on dynamic evolution and causal relations, requiring models to accurately capture state
        changes, action sequences, and event logic.
      note: causal-reasoning is not tagged. "Causal relations" between events in a video does not meet its
        INC, which requires distinguishing cause from correlation or predicting an intervention.
    - value: context-integration
      source: repo
      quote: Retrieves, extracts, and integrates multimodal cues (frames, audio, subtitles) scattered throughout
        a video.
  evaluation_method:
    - value: multiple-choice
      source: repo
      quote: Select the best answer to the following multiple-choice question based on the video.
      note: There are eight options (A-H), so the per-question chance baseline is 12.5%. The headline Non-Lin
        score is a non-linear transform over groups of four questions, which the Metric records; ADR-0020
        rejects a composite reading for one method.
  designed_for_subjects:
    - value: instruction-tuned-model
      source: repo
      quote: Respond with only the letter (A, B, C, D, E, F, G, or H) of the correct option.
    - value: reasoning-model
      source: repo
      quote: 'For the thinking/reasoning setting, the instruction is replaced with:'
      note: The abstract reports that "thinking-based reasoning is highly dependent on textual cues", so the
        thinking setting moves the number.
    - value: human-expert
      source: paper
      quote: while human experts achieve a score of 90.7, the best-performing model, Gemini-3-Pro, reaches only
        49.4
      note: The baseline came from the quality-inspection team, which had reviewed every item and then answered
        the full dataset, so it is a construction-staff baseline (0.9.0 human-expert inclusion test).
  data.access:
    - value: fully-open
      source: hf
      quote: 'License: mit'
      note: The Hugging Face card says MIT, but the repository README says "Video-MME-v2 is only used for
        academic research. Commercial use in any form is prohibited." The two licence statements conflict.
        Access itself is ungated.
  data.refresh:
    - value: versioned-releases
      source: hf
      quote: Fixed 2 incorrect MP4s & 3 mismatched URLs. Original data preserved in the original branch.
      note: Dated 2026.06.11 on the maintainers' dataset card, beside the 2026.05.22 update to the evaluation
        script; a dated erratum is a pin (0.9.0).
  data.data_provenance:
    - value: web-scraped
      source: paper
      quote: we source videos from the internet with a strict focus on temporal recency
    - value: expert-authored
      source: repo
      quote: We establish a comprehensive data annotation process involving 3,300 human-hours from 60+ experts.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: Over 80% of the videos in our dataset are published in 2025 or later, with nearly 40% published
        after October 2025.
      note: Recency-oriented collection and manual decontamination mitigate leakage, but the videos and the
        annotated answers are public on Hugging Face, so a route is plausible for later models, and no source
        evidences one. Recency at release is not a per-entrant cutoff filter, which 0.9.0's low requires.
  data.ceiling_anchor_type:
    - value: expert-average
      source: paper
      quote: We establish a rigorous human expert baseline, where human annotators achieve an outstanding
        Non-Lin Score of 90.7 and an average accuracy of 94.9%.
      note: The project page says the baseline came from the quality-inspection team answering the whole
        dataset, and those people had reviewed every item; the Baseline record carries that.
  lifecycle:
    - value: active
      source: repo
      quote: EvalScope now supports one-command evaluation for Video-MME-v2
      note: The repository news is dated 2026.08.05, and the maintainers' leaderboard takes model responses.
  activity:
    - value: accepting-submissions
      source: repo
      quote: If you want to add your model to our [leaderboard](https://video-mme-v2.netlify.app/#leaderboard),
        please send model responses to
  governance.maintainer_type:
    - value: null
      source: home
      quote: © 2026 Video-MME Team. All rights reserved.
      failure: 2026-09-28-video-mme-v2-006
  governance.submission_process:
    - value: maintainer-scored-predictions
      source: repo
      quote: If you want to add your model to our [leaderboard](https://video-mme-v2.netlify.app/#leaderboard),
        please send model responses to
      note: The maintainers score the e-mailed responses, while the labels are public in test.parquet.
  governance.independence_flags:
    - value: null
      failure: 2026-09-28-video-mme-v2-008
  execution.compute_tier:
    - value: api-credits-only
      source: repo
      quote: provides a community-maintained integration for running Video-MME-v2 against OpenAI-compatible
        model endpoints
      note: The leaderboard includes API models such as Gemini-3-Pro, so local GPUs for open weights are the
        entrant's choice (0.9.0 precedence rule).
  execution.reproducibility_tier:
    - value: fully-automatable
      source: repo
      quote: The evaluation does not require any third-party models (e.g., GPT) — answer extraction uses regex
        matching by default.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: We also provide a standalone inference & evaluation script
      note: The script computes the grouped non-linear score. VLMEvalKit, lmms-eval and EvalScope also support
        the benchmark.
notes: Video-MME-v2 is a separate benchmark from the 2024 Video-MME (corpus flag), though the same team built
  both. The benchmark's distinctive feature is group-level, reasoning-conditioned scoring. ADR-0020 rejects a
  cross-query-consistency capability and a composite reading (one benchmark each), so the consistency claim
  is recorded here and the group score on the Metric.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, evaluation_method, designed_for_subjects, data.refresh,
      data.contamination_risk, data.ceiling_anchor_type, lifecycle, governance.submission_process,
      execution.compute_tier]
    note: Re-adjudicated against 0.9.0.

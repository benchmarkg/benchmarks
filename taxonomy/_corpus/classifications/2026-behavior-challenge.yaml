# taxonomy/_corpus/classifications/2026-behavior-challenge.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: 2026-behavior-challenge
corpus_item: 11
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2403.09227
  abs: https://arxiv.org/abs/2403.09227
  home: https://behavior.stanford.edu/challenge/
  rules: https://behavior.stanford.edu/challenge/evaluation.html
  submission: https://behavior.stanford.edu/challenge/submission.html
facets:
  domain.primary:
    - value: robotics-embodiment/mobile-manipulation
      source: home
      quote: BEHAVIOR tests whether embodied agents can combine high-level reasoning, long-horizon navigation,
        and dexterous bimanual manipulation in house-scale scenes.
  domain.secondary: []
  capability:
    - value: sensorimotor-control
      source: rules
      quote: The evaluator sends flattened observations to the policy server. The server should return a
        msgpack-encoded response containing an action array with the robot action for the current step.
    - value: long-horizon-execution
      source: home
      quote: Agents must search across rooms, manipulate many objects, handle object state changes, and satisfy
        symbolic BDDL goal conditions after several minutes of autonomous execution.
      failure: 2026-09-28-2026-behavior-challenge-001
  evaluation_method:
    - value: simulation-rollout
      source: rules
      quote: Partial successes = (Number of goal BDDL predicates satisfied at episode end) / (Total number
        of goal predicates).
      failure: 2026-09-28-2026-behavior-challenge-002
  designed_for_subjects:
    - value: rl-policy
      source: rules
      quote: There are no restrictions on the type of policy used. Methods such as IL, RL, or TAMP are all
        allowed.
      failure: 2026-09-28-2026-behavior-challenge-003
  data.access:
    - value: train-open-test-held-out
      source: rules
      quote: Indices 0-19 are public test instances; indices 20-39 are hidden instances reserved for final
        evaluation.
      failure: 2026-09-28-2026-behavior-challenge-004
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: Join us for the second year of the BEHAVIOR Challenge
      note: The challenge is yearly; this edition adds scenes ("7 scenes, including 4 new scenes").
  data.data_provenance:
    - value: crowd-authored
      source: paper
      quote: the object spaces and the relevant properties and predicates they enable are offered to lay annotators
        to generate BDDL definitions
      note: BEHAVIOR-1K paper; the challenge's 100 tasks are drawn from these activity definitions.
    - value: web-scraped
      source: paper
      quote: The object spaces are derived from 5,000 WikiHow articles for the 1,000 activities
    - value: simulation-generated
      source: abs
      quote: OMNIGIBSON, a novel simulation environment that supports these activities via realistic physics
        simulation and rendering of rigid bodies, deformable bodies, and liquids
    - value: model-generated
      source: paper
      quote: Through crowdworkers, students, and GPT-3 [58], we also associate each object with our fully
        simulatable object states
      note: GPT-3 contributed object-state annotations that the task definitions are built on, not the task
        items themselves.
  data.contamination_risk:
    - value: unknown
      note: No source assesses contamination. The hidden instances 20-39 and edition-specific new scenes work
        against leakage, but nobody has assessed it.
  data.ceiling_anchor_type:
    - value: null
      source: rules
      quote: Secondary metrics will be normalized using human averages from 200 demonstrations per task.
      failure: 2026-09-28-2026-behavior-challenge-005
  lifecycle:
    - value: active
      source: home
      quote: 'Challenge Launch: 07/02/2026'
  activity:
    - value: accepting-submissions
      source: home
      quote: 'Submission Deadline: 10/16/2026'
      note: The deadline falls after the classification date of 2026-09-28.
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: 2026 Stanford Vision and Learning Lab
  governance.submission_process:
    - value: maintainer-verified
      source: rules
      quote: We will update the leaderboard once we sanity-check the performance.
    - value: containerized-algorithm-submission
      source: submission
      quote: Submit a Docker image that serves your policy.
      failure: 2026-09-28-2026-behavior-challenge-006
  governance.independence_flags:
    - value: null
      source: home
      quote: 'We gratefully acknowledge the support of our sponsors who make this challenge possible:'
      failure: 2026-09-28-2026-behavior-challenge-007
  execution.compute_tier:
    - value: simulator-required
      source: rules
      quote: Run challenge evaluation from the v3.9.3 tag of BEHAVIOR-1K, not the older v3.9.0 tag.
      failure: 2026-09-28-2026-behavior-challenge-008
  execution.reproducibility_tier:
    - value: automatable-with-simulator
      source: rules
      quote: We provide OmniGibson/omnigibson/eval/eval.py as the command-line entry point for running websocket-based
        evaluations.
  execution.reproducibility_blockers:
    - value: specific-simulator-build
      source: rules
      quote: The challenge evaluator and dataset interfaces in v3.9.3 include the latest compatibility fixes
        that the organizers will use for evaluation.
      failure: 2026-09-28-2026-behavior-challenge-009
    - value: private-test-set
      source: rules
      quote: We will hold out 10 more instances for final evaluation.
  execution.harness_availability:
    - value: official-harness
      source: rules
      quote: We provide OmniGibson/omnigibson/eval/eval.py as the command-line entry point for running websocket-based
        evaluations.
notes: >-
  The corpus entry is the 2026 edition of a yearly challenge; its only paper is BEHAVIOR-1K (1,000
  activities, 50 scenes), of which the challenge uses 100 tasks in 7 scenes, so the provenance values come
  from the parent benchmark. domain.secondary is left empty although the home page names 'dexterous bimanual
  manipulation': the embodiment is not fixed ('Participants may use the default R1Pro robot or provide their
  own'), so bimanual-manipulation's test (a task one arm cannot complete) is not shown. The Hugging Face
  leaderboard Space returned only a shell and is not cited.

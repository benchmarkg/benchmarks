# taxonomy/_corpus/classifications/cache-challenges.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: cache-challenges
corpus_item: 37
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://doi.org/10.1038/s41570-022-00363-z
  home: https://cache-challenge.org/
  what: https://cache-challenge.org/what-cache
  results1: https://cache-challenge.org/results-cache-challenge-1
facets:
  domain.primary:
    - value: chemistry-materials/experimental-hit-finding
      source: home
      quote: Participants will predict hits and CACHE will validate these hits experimentally.
  domain.secondary:
    - value: biology-genetics/drug-target-interaction
      source: home
      quote: to predict small molecules (hits) that bind to predefined disease-associated protein targets
      failure: 2026-09-28-cache-challenges-001
  capability:
    - value: hypothesis-generation
      source: results1
      quote: CACHE Challenges begin with a hit-finding round (Round 1), where participants can nominate up to 100 commercially
        available compounds.
      note: The scored output is each participant's set of nominated compounds, judged by how many are confirmed as binders.
    - value: creativity-novelty
      source: paper
      quote: This novelty parameter will be defined as the Tanimoto distance relative to most similar structures binding
        that target
      note: Novelty relative to known binders is a scoring criterion; recent challenges ask for "chemically novel" molecules,
        and DREAM x CACHE ranks by "the number of novel chemical series".
  evaluation_method:
    - value: wet-lab-validation
      source: what
      quote: CACHE will procure the molecules from commercial vendors and test them experimentally with two rigorous
        binding assays.
    - value: expert-panel-assessment
      source: results1
      quote: All data were evaluated by an independent Hit Evaluation Committee composed of industry experts in biophysics
      failure: 2026-09-28-cache-challenges-002
    - value: composite
      source: paper
      quote: Before each challenge, CACHE will publish the corresponding success criteria (activity, selectivity, aqueous
        solubility, lipophilicity, novelty etc.) and how these will be combined into an overall multi-objective score
    - value: domain-metric
      source: paper
      quote: 'Calculated properties include: corrected molecular weight; polar surface area29; number of rotatable bonds;
        Fsp3 (ref.30); and novelty.'
      note: Cheminformatics descriptors that enter the multi-objective score alongside measured affinity, solubility
        and logD.
  designed_for_subjects:
    - value: human-ai-team
      source: paper
      quote: ideally, who also submit their fully automated workflows
      note: Entrants are teams of computational chemists running their own workflows, and the protocol rewards but does
        not require full automation; round-2 analogues are selected by each participant.
    - value: classical-algorithm
      source: paper
      quote: These methods would likely include random local search, simple similarity matching or vanilla docking methods,
        where applicable.
      note: Baselines run centrally by the challenge leads.
  data.access:
    - value: null
      source: home
      quote: Each competition includes a hit-finding and a hit expansion round of prediction and experimental testing
        after which all data, including chemical structures, will be made publicly available without restrictions on
        use.
      failure: 2026-09-28-cache-challenges-003
  data.refresh:
    - value: periodic-recompetition
      source: what
      quote: CACHE will initiate a new hit-finding benchmarking exercise every four months.
      note: Each challenge has a new protein target; eight numbered challenges are listed so far.
  data.data_provenance:
    - value: experimental-measurement
      source: results1
      quote: Primary screening of nominated compounds was conducted by SPR, an assay that measures direct binding of
        compounds to the WDR domain of LRRK2 captured on a chip.
  data.contamination_risk:
    - value: low
      source: home
      quote: Participants will predict hits and CACHE will validate these hits experimentally.
      note: 'Prospective: the activity of a nominated compound is measured only after nomination. Known binders for a
        target can be public, which the novelty criterion penalises.'
  data.ceiling_anchor_type:
    - value: none-known
      note: Scores are hit counts, affinities and committee scores with no stated maximum or reference ceiling; replicate
        assays confirm hits but are not reported as a ceiling.
  lifecycle:
    - value: active
      source: home
      quote: We are pleased to launch the DREAM x CACHE Target 2035 Drug Discovery Challenge, which is now accepting
        predictions.
  activity:
    - value: accepting-submissions
      source: home
      quote: 'Last date to apply is: Wed, 09/30/2026 - 00:00'
      note: 'The open call is DREAM x CACHE; Challenge #8 closed to applications on 2026-04-30.'
      failure: 2026-09-28-cache-challenges-004
  governance.maintainer_type:
    - value: nonprofit
      source: paper
      quote: CACHE will be structured as an independent, not-for-profit entity or fiscally governed by a not-for-profit
        organization with aligned goals, such as the Structural Genomics Consortium (SGC)
      note: The site says Conscience has been the steward since 2024.
      failure: 2026-09-28-cache-challenges-005
  governance.submission_process:
    - value: assessment-committee
      source: results1
      quote: All data were evaluated by an independent Hit Evaluation Committee composed of industry experts in biophysics
      note: The committee assigns each participant a final score, published with an annotated ranking; there is no continuous
        leaderboard.
    - value: publication-gated
      source: what
      quote: Participants will be asked to disclose their approaches in sufficient detail to enable an expert in the
        area to understand the methodology while computational algorithms can remain proprietary.
      note: The gate is a methods disclosure, peer-reviewed by other participants, not a paper; as in casp17.
  governance.independence_flags:
    - value: no-known-conflict
      source: results1
      quote: All data were evaluated by an independent Hit Evaluation Committee composed of industry experts in biophysics
      note: 'Funders sit on the governing board, which decides target selection and participation rules, and pharma companies
        also participate (Merck KGaA in Challenge #1); no source says that a funder entered a challenge.'
  execution.compute_tier:
    - value: wet-lab
      source: what
      quote: CACHE will procure the molecules from commercial vendors and test them experimentally with two rigorous
        binding assays.
      failure: 2026-09-28-cache-challenges-006
  execution.reproducibility_tier:
    - value: requires-physical-experiment
      source: what
      quote: CACHE will procure the molecules from commercial vendors and test them experimentally with two rigorous
        binding assays.
  execution.reproducibility_blockers:
    - value: wet-lab
      source: paper
      quote: Within CACHE, we estimate that the costs of rigorous experimental testing for 100 compounds is approximately
        US $25,000
  execution.harness_availability:
    - value: reference-implementation-only
      source: paper
      quote: CACHE will provide the workflows and scripts that were used to calculate the different descriptors.
      note: Announced in the 2022 paper and not verified; the experimental part of the score has no code by nature.
notes: 'The entry is the CACHE series (Challenges #1-#8 plus DREAM x CACHE Target 2035). The primary paper is the 2022
  design paper, written in the future tense; the Challenge #1 results page is used for the protocol as run. Per-challenge
  scoring details vary and are set by each challenge lead.'

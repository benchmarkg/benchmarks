# taxonomy/_corpus/classifications/bench.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: bench
corpus_item: 42
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2506.07982
  abs: https://arxiv.org/abs/2506.07982
  home: https://github.com/sierra-research/tau2-bench
  submission: https://raw.githubusercontent.com/sierra-research/tau2-bench/main/docs/leaderboard-submission.md
  evaluation: https://raw.githubusercontent.com/sierra-research/tau2-bench/main/docs/evaluation.md
  changelog: https://raw.githubusercontent.com/sierra-research/tau2-bench/main/CHANGELOG.md
  manifest: https://raw.githubusercontent.com/sierra-research/tau2-bench/main/web/leaderboard/public/submissions/manifest.json
facets:
  domain.primary:
    - value: agents-tooluse/tool-api-calling
      source: paper
      quote: The agent have access to a set of tools that interact with a database
      failure: 2026-09-28-bench-001
  domain.secondary:
    - value: agents-tooluse/multi-agent-coordination
      source: abs
      quote: where both agent and user make use of tools to act in a shared, dynamic environment that tests both
        agent coordination and communication
  capability:
    - value: tool-use
      source: evaluation
      quote: any sequence of tool calls that produces an equivalent DB end state passes the DB check
    - value: constraint-satisfaction
      source: paper
      quote: solve constraint satisfaction tasks, where constraints stem from a combination of a domain policy that
        the agent must follow
      note: The sentence describes the retail and airline domains, which tau2-bench carries over from tau-bench.
      failure: 2026-09-28-bench-002
    - value: collaboration
      source: paper
      quote: how well it can communicate and collaborate with the user at solving the issue
      note: In telecom the user simulator must itself act on its phone, so the task succeeds only if the agent and
        the user reach the fixed state together.
    - value: communication
      source: abs
      quote: separating errors arising from reasoning vs communication/coordination
      note: The telecom score depends on what the simulated user did after the agent's instructions.
    - value: reliability-consistency
      source: paper
      quote: suggesting less consistent performance on the telecom domain
      note: 'The headline metric is pass^k: the share of tasks solved in all k trials. The leaderboard asks for
        "at least 4 trials per domain".'
  evaluation_method:
    - value: exact-match
      source: evaluation
      quote: compared (by hash) to the predicted environment's DB end state
      failure: 2026-09-28-bench-003
    - value: constraint-check
      source: paper
      quote: In telecom, only assertion functions are used to evaluate task success.
      note: The retail and airline reward multiplies the DB check by a check that every required string appears in
        the agent's messages ("Does every string in `communicate_info` appear in the agent's messages?").
  designed_for_subjects:
    - value: agent-scaffold
      source: submission
      quote: Replacing or augmenting that benchmark-side scaffold with a planner, router, additional agent, custom
        tool, or modified control flow makes the submission custom.
      failure: 2026-09-28-bench-004
    - value: multi-agent-system
      source: abs
      quote: A novel Telecom dual-control domain modeled as a Dec-POMDP, where both agent and user make use of tools
        to act in a shared, dynamic environment
      note: Tagged on the taxonomy's own tau2-bench example ("A simulated user is a second participant whose
        behaviour shapes the outcome").
      failure: 2026-09-28-bench-005
  data.access:
    - value: fully-open
      source: evaluation
      quote: If you have looked at `data/tau2/domains/airline/tasks.json` and assumed those listed actions are
        required of the agent
      note: Tasks, reference actions, policies and the evaluator are in the public repository.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: results produced with tau2-bench < 1.0.1 are not comparable with >= 1.0.1
      note: The repository follows semantic versioning (0.1.x to 1.0.1), and the leaderboard moves superseded
        rows to legacy_submissions.
  data.data_provenance:
    - value: synthetic-procedural
      source: abs
      quote: A compositional task generator that programmatically creates diverse, verifiable tasks from atomic
        components
      note: This is the telecom domain (2,285 generated tasks, 114 sampled). The retail and airline provenance is
        inherited from tau-bench and not restated here.
    - value: model-generated
      source: paper
      quote: An LLM then generates function implementations, a mock database, and unit tests based on the PRD.
      note: The authors then refined the generated code by hand "until all unit tests pass".
  data.contamination_risk:
    - value: medium
      source: submission
      quote: Models where training data significantly overlaps with τ-bench evaluation scenarios
      note: The leaderboard classes such models as custom submissions, which acknowledges the route. The public
        repository also ships "Train/test task splits for all domains" for RL training. No source measures
        contamination.
  data.ceiling_anchor_type:
    - value: none-known
      note: Telecom tasks are verified solvable by replaying their solution functions ("Task correctness is
        automatically verified"), but no source reports a human or oracle score as the top of the scale. This
        follows swe-bench-verified.
  lifecycle:
    - value: active
      source: manifest
      quote: gpt-live-1-diamond-alpha_openai_2026-09-09
      failure: 2026-09-28-bench-006
  activity:
    - value: accepting-submissions
      source: submission
      quote: Submit your agent results to the τ-bench leaderboard at
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: 'Affiliation: Sierra'
  governance.submission_process:
    - value: maintainer-verified
      source: submission
      quote: Trajectory data available for review
      note: Voice interaction metrics are "recomputed by maintainers from the submitted trajectories during
        review".
      failure: 2026-09-28-bench-007
    - value: self-reported
      source: submission
      quote: are marked with a caution icon and may have
      note: Unverified submissions are listed with a caution icon.
  governance.independence_flags:
    - value: no-known-conflict
      source: submission
      quote: Sierra runs all final/published evaluations with its own voices to ensure parity across leaderboard
        results.
      note: Searched the paper, the submission guide and the leaderboard manifest. Sierra sells customer-service
        agents in the benchmark's domains, but no Sierra agent appears among the listed submissions. Most rows are
        runs Sierra made of other vendors' models (failure 007).
  execution.compute_tier:
    - value: api-credits-only
      source: paper
      quote: The cost of running all domains for 1 trial per task is approximately $40.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: tau2 run --domain airline --agent-llm gpt-4.1 --user-llm gpt-4.1
  execution.reproducibility_blockers:
    - value: null
      source: submission
      quote: You can use any LLM as the user simulator, but this choice will be reported on the leaderboard.
      failure: 2026-09-28-bench-008
  execution.harness_availability:
    - value: official-harness
      source: submission
      quote: Compute performance metrics (Pass^k rates)
notes: 'The corpus id is bench, a known corpus defect. The entry is tau2-bench (arXiv 2506.07982), and its URL is
  the repository, which now ships as tau3-bench (v1.0.x) with banking_knowledge and voice domains. The original
  tau-bench (2024) and tau3-bench are the same family under 02 S11 rule 5. The text airline, retail and telecom
  domains remain, with "75+ task fixes". Classified from the tau2 paper for construction and from the live
  repository for governance and activity. HAL (holistic-agent-leaderboard-hal) runs the original TAU-bench
  Airline, a member of this family. The taxonomy examples for this entry use the ref tau2-bench. long-horizon-execution
  and memory-retention, which those examples tag, are not tagged, because no tau2 source claims either.'

# taxonomy/_corpus/classifications/srbench-2-0.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: srbench-2-0
corpus_item: 49
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2107.14351
  abs: https://arxiv.org/abs/2107.14351
  home: https://cavalab.org/srbench/
facets:
  domain.primary:
    - value: physics/symbolic-regression-discovery
      source: abs
      quote: including physics equations and systems of ordinary differential equations
      failure: 2026-09-28-srbench-2-0-001
  domain.secondary: []
  capability:
    - value: inductive-reasoning
      source: paper
      quote: Relative to accuracy metrics, the Symbolic Solution metric is a more faithful evaluation of the ability
        of an SR method to discover the data generating process.
      note: 'Ground-truth track only: observations are supplied and the recovered law is scored. The capabilities.yaml
        srbench example agrees.'
  evaluation_method:
    - value: symbolic-equivalence
      source: paper
      quote: Prior to assessing symbolic solutions, each model underwent sympy simplification, as did the conditions
        above.
      note: Definition 4.1 accepts models that differ from the truth by an additive constant or a scalar factor.
    - value: statistical-fit
      source: paper
      quote: We assessed accuracy using the coefficient of determination
      note: The paired model-size axis is a Metric and reporting concern (ADR-0020 rejects model-complexity-measure),
        so the method is R^2 alone.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: paper
      quote: Jobs consisted of the training of each method on a single dataset for a fixed random seed.
      note: Fourteen SR algorithms and seven ML regressors are each refitted on every dataset's training split, so
        the ranked entrant is the fitting procedure (the term's own srbench-2-0 example).
  data.access:
    - value: fully-open
      source: paper
      quote: Datasets are released under an MIT license.
      note: All 252 datasets are in PMLB, with ground-truth equations in the metadata.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: 'v1.0 was reported in our GECCO 2018 paper:'
      note: v1.0 (2018), v2.0 (2021, this entry) and SRBench 2025 are discrete editions with separate results.
  data.data_provenance:
    - value: inherited-from-constituents
      source: paper
      quote: This paper does not contribute new datasets, but rather collates and standardizes datasets that were
        already publicly available.
      note: Every problem comes from a published dataset collection, the black-box half from PMLB (itself drawn from
        OpenML and UCI), the Feynman problems from the Feynman Symbolic Regression Database and the ODE problems from
        the ODE-Strogatz repository, so each keeps its constituent's provenance. The two terms below record what the
        paper itself states about the ground-truth data.
    - value: synthetic-procedural
      source: paper
      quote: 76 synthetic problems (i.e., data generated computationally from static functions or simulations)
      note: Also the Feynman ground-truth problems, sampled from known equations.
    - value: simulation-generated
      source: paper
      quote: In order to simulate their behavior, initial conditions were chosen
      note: The Strogatz ODE problems.
  data.contamination_risk:
    - value: unknown
      note: 'Entrants are fitted per dataset, and no source assesses contamination. One design overlap is visible:
        the Feynman datasets were "proposed as SR benchmarks" by the AIFeynman authors, whose method is an entrant.'
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: 'Figure 3: Solution rates for the ground-truth regression problems.'
      note: Solution rate and R^2 are bounded at their optimum (100%, 1), and no source reports a measured,
        human or noise-limited ceiling, so 0.9.0's none-known exclusion sends the field here. Noise added to the
        targets (0 to 0.1) keeps R^2 below 1 for the true model; that is a note on the bound, not a measured anchor.
  lifecycle:
    - value: superseded
      source: home
      quote: If you are choosing baselines for a new symbolic regression paper, please use this roster and these
        results rather than the 2021 tables below.
      note: The entry is the v2.0 edition, and the entry-as-catalogued rule makes a replaced edition superseded
        while the family is active (the term's own example).
  activity:
    - value: closed
      source: home
      quote: 'Methods currently benchmarked or staged for the next benchmark update:'
      note: The v2.0 result tables are frozen while the family stages new methods, and closed covers an edition whose
        own intake is frozen inside an open family (the term's own example).
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: Maintained by @cavalab and many open-source contributors
      note: Cava Lab (William La Cava, Boston Children's Hospital / Harvard Medical School); contributions are approved
        by "the benchmark maintainers".
  governance.submission_process:
    - value: sandboxed-rerun
      source: paper
      quote: Once the tests pass and the method is approved by the benchmark maintainers, the contribution becomes
        part of the resource and can be tested via the commands above.
      note: Contributors submit a method by pull request; the maintainers run every method under one fixed Anaconda
        environment and publish the results.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: home
      quote: Feature Engineering Automation Tool (La Cava et al. 2017)
      note: FEAT and epsilon-lexicase are the maintainer's own methods. The paper's co-authors also include the
        authors of Operon (Burlacu), GP-GOMEA and SBP-GP (Virgolin) and ITEA (de Franca).
  execution.compute_tier:
    - value: cluster
      source: paper
      quote: Experiments were run in a heterogeneous cluster computing environment
      note: 1.29M core hours (black-box) plus 436.8K core hours (ground-truth), one CPU core per job. Fitting is the
        run here, because the entrant is the fitting procedure, and the maintainer's reference run is on a cluster.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: A detailed guide on how to reproduce the experiments by yourself is provided in docs/user_guide.md.
      note: Nothing in a fresh run needs raters, hardware beyond a rentable cluster, or a maintainer-only set, but the
        tier's exclusion forbids it beside compute-scale (failure 006).
      failure: 2026-09-28-srbench-2-0-006
  execution.reproducibility_blockers:
    - value: compute-scale
      source: paper
      quote: Computing Budget 1.29M core hours 436.8K core hours
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: Experiments are launched from the experiments/ folder via the script analyze.py.
notes: Classified as the maintainers' SRBench v2.0 (NeurIPS 2021, arXiv 2107.14351), as the corpus resolves the
  name. The corpus flag records that some third parties use "SRBench 2.0" for the 2025 edition, and the maintainers'
  site now leads with SRBench 2025 and tells new papers to use it. The edition ambiguity is logged where it changes
  a field (failures 004 and 005, both resolved at 0.9.0 by the entry-as-catalogued rule).
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [evaluation_method, designed_for_subjects, data.data_provenance, data.ceiling_anchor_type, lifecycle, activity, execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; task-specific-supervised-model and the entry-as-catalogued rules settle
          three Stage 3 failures and the rejection of model-complexity-measure a fourth. Provenance moves from web-
          scraped to inherited-from-constituents, the ceiling to theoretical-maximum, the physics-or-mathematics
          primary stays deferred, and the tier carries the compute-scale contradiction as a new failure.

# taxonomy/_corpus/classifications/coco.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: coco
corpus_item: 60
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/1405.0312
  abs: https://arxiv.org/abs/1405.0312
  homehtm: https://raw.githubusercontent.com/cocodataset/cocodataset.github.io/master/dataset/home.htm
  detection: https://raw.githubusercontent.com/cocodataset/cocodataset.github.io/master/dataset/detection-eval.htm
  upload: https://raw.githubusercontent.com/cocodataset/cocodataset.github.io/master/dataset/upload.htm
  det2020: https://raw.githubusercontent.com/cocodataset/cocodataset.github.io/master/dataset/detection-2020.htm
  terms: https://raw.githubusercontent.com/cocodataset/cocodataset.github.io/master/dataset/termsofuse.htm
  codalab: https://competitions.codalab.org/competitions/5181
  codalab2020: https://competitions.codalab.org/competitions/20796
facets:
  domain.primary:
    - value: vision/detection
      source: abs
      quote: Objects are labeled using per-instance segmentations to aid in precise object localization.
      note: Detection (boxes and instance masks) is the primary challenge and leaderboard.
  domain.secondary:
    - value: vision/segmentation
      source: homehtm
      quote: Superpixel stuff segmentation
      note: The stuff and panoptic tasks. The keypoint and DensePose tasks have no subdomain (see the failure).
      failure: 2026-09-28-coco-001
    - value: multimodal/any-to-any-generation
      source: homehtm
      quote: COCO is a large-scale object detection, segmentation, and captioning dataset.
      note: The Captioning 2015 task generates text from an image. Its evaluation page was not fetched.
  capability:
    - value: perception
      source: abs
      quote: We present a new dataset with the goal of advancing the state-of-the-art in object recognition by placing
        the question of object recognition in the context of the broader question of scene understanding.
  evaluation_method:
    - value: domain-metric
      source: detection
      quote: Specifically we use 10 IoU thresholds of .50:.05:.95.
      note: AP (mAP) averaged over 10 IoU thresholds and 80 categories is the primary challenge metric, one metric over
        its own sweep, so composite is not tagged (0.9.0 makes coco domain-metric's example and composite's near
        miss).
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: detection
      quote: 'The following 12 metrics are used for characterizing the performance of an object detector on COCO:'
      note: Entrants are object detectors, usually trained on COCO's own train split and submitted to the test-dev
        server; detection is a general perception task, not a discipline (the term's own coco example).
  data.access:
    - value: train-open-test-held-out
      source: detection
      quote: To obtain results on the COCO test set, for which ground-truth annotations are hidden, generated results
        must be
      note: Train and val images and annotations are public (annotations CC BY 4.0, images under Flickr terms).
  data.refresh:
    - value: versioned-releases
      source: upload
      quote: 'test split: "val2017", "test-dev2017", or "test-challenge2017"'
      note: The splits are released as labelled versions (2014, 2015, 2017). The 2017-2020 challenges reused the
        test-challenge split rather than fresh sets.
  data.data_provenance:
    - value: web-scraped
      source: paper
      quote: we collected images from Flickr which tends to have fewer iconic images.
    - value: crowd-authored
      source: paper
      quote: For all crowdsourcing tasks we used workers on Amazon’s Mechanical Turk (AMT).
  data.contamination_risk:
    - value: medium
      source: paper
      quote: Flickr contains photos uploaded by amateur photographers with searchable metadata and keywords.
      note: The test images are public Flickr photos and the test-dev images are distributed, so a route into web-scale
        pretraining is plausible. The test annotations are hidden, and no source assesses contamination.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: detection
      quote: PR after all remaining errors are removed (trivially AP=1).
      note: No human detection baseline is reported; the paper's expert comparison concerns annotation recall, not
        task performance.
  lifecycle:
    - value: mature
      source: homehtm
      quote: Please note that there will not be a COCO 2021 Challenge, instead, we encourage people to participate
        in the LVIS 2021 Challenge.
      note: LVIS replaced the annual challenge, not the instrument, whose test-dev server keeps a 'Current' phase that
        the maintainers recommend for publication. 0.9.0's superseded exclusion (coco is its near miss) keeps the
        instrument's standing and sends the ending to activity. No maintainer source dates a result after the 2020
        challenge, so the record reads as settled rather than active (ADR-0019).
  activity:
    - value: leaderboard-live-no-round
      source: codalab2020
      quote: Current test-dev (segm)
      note: The last round was the 2020 challenge ("Competition Ends Aug. 8, 2020"); the test-dev phase is still
        listed as current with a leaderboard. The site warns that its own leaderboard "may not contain the latest
        results".
  governance.maintainer_type:
    - value: community-collective
      source: terms
      quote: The annotations in this dataset along with this website belong to the COCO Consortium
      note: The holder calls itself a consortium, but no source states a legal form or member governance, and its
        members span Microsoft, Facebook AI Research, Google and several universities. 0.9.0 reads the word
        'consortium' without a legal form as community-collective.
  governance.submission_process:
    - value: held-out-server
      source: upload
      quote: submitting to the evaluation server provides results on the test sets.
      note: Challenge entries (through 2020) also needed a technical report; the standing test-dev channel does
        not.
  governance.independence_flags:
    - value: single-evaluator-private-test-set
      source: detection
      quote: To obtain results on the COCO test set, for which ground-truth annotations are hidden, generated results
        must be
      note: The site's Sponsors and Collaborators lists render only by script and were not visible, so sponsorship
        and maintainer participation could not be checked.
  execution.compute_tier:
    - value: null
      source: upload
      quote: the evaluation may take quite some time to complete (from ~20m to a few hours).
      failure: 2026-09-28-coco-006
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: detection
      quote: To obtain results on the COCO test set, for which ground-truth annotations are hidden, generated results
        must be
      note: For test-dev and test-challenge results. Val results can be reproduced locally with the cocoapi.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: detection
      quote: To obtain results on the COCO test set, for which ground-truth annotations are hidden, generated results
        must be
  execution.harness_availability:
    - value: official-harness
      source: detection
      quote: The exact same evaluation code, described below, is used to evaluate results on the test set.
notes: The corpus URL (cocodataset.org) is a script-rendered shell, so the site's pages are read from its source
  repository (cocodataset/cocodataset.github.io, last content change November 2023) and the two CodaLab detection
  servers it links, all fetched for this record. The People page renders only "COCO Consortium" without script.
  The corpus entry is the whole dataset family (detection, keypoints, stuff, panoptic, DensePose and captioning),
  classified on its primary detection task.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [evaluation_method, designed_for_subjects, lifecycle, governance.maintainer_type]
    note: Re-adjudicated against 0.9.0; the fixed composite example, task-specific-supervised-model, the superseded
          exclusion with ADR-0019's mature, and the consortium legal-form test settle four Stage 3 failures. Pose
          estimation stays deferred and compute stays source-silent.

# taxonomy/_corpus/classifications/inspect-evals.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: inspect-evals
corpus_item: 66
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  home: https://ukgovernmentbeis.github.io/inspect_evals/
  repo: https://github.com/UKGovernmentBEIS/inspect_evals
  version: https://ukgovernmentbeis.github.io/inspect_evals/guides/run-specific-eval-version.html
  register: https://ukgovernmentbeis.github.io/inspect_evals/register/
facets:
  domain.primary:
    - value: null
      source: home
      quote: A library of evaluations built using Inspect AI
      failure: 2026-09-28-inspect-evals-001
  domain.secondary:
    - value: safety-alignment/prompt-injection
      source: home
      quote: Assesses whether AI agents can be hijacked by malicious third parties using prompt injections
      note: AgentDojo. The list is illustrative. It names the safety-alignment subdomains the catalogue carries,
        plus two capability areas, and is not an inventory of all 173 evals.
    - value: safety-alignment/agentic-harm
      source: home
      quote: Assesses whether AI agents might engage in harmful activities by testing their responses to malicious
        prompts in areas like cybercrime, harassment, and fraud
      note: AgentHarm, corpus entry agentharm.
    - value: safety-alignment/jailbreak-robustness
      source: home
      quote: A benchmark that evaluates the susceptibility of LLMs to various jailbreak attacks.
      note: StrongREJECT.
    - value: safety-alignment/honesty-truthfulness
      source: home
      quote: Evaluates honesty in large language models by testing whether they contradict their own beliefs when
        pressured to lie.
      note: MASK.
    - value: safety-alignment/sycophancy
      source: home
      quote: Evaluate sycophancy of language models across a variety of free-form text-generation tasks.
    - value: safety-alignment/bias-fairness
      source: home
      quote: A dataset that measures stereotype bias in language models across gender, race, religion, and profession
        domains.
      note: StereoSet.
    - value: safety-alignment/dangerous-capability-evals
      source: home
      quote: serve as a proxy measurement of hazardous knowledge in biosecurity, cybersecurity, and chemical security
      note: WMDP, corpus entry wmdp.
    - value: safety-alignment/evaluation-awareness
      source: home
      quote: Measures whether LLMs strategically comply with harmful requests when believing outputs will be used for
        RLHF training (free-tier/monitored) versus when unmonitored (paid-tier).
      note: Alignment Faking.
    - value: agents-tooluse/cybersecurity-offense-defense
      source: home
      quote: Tests language models on cybersecurity skills using 39 of 40 practical, professional-level challenges
        taken from cybersecurity competitions
      note: Cybench.
    - value: code/repository-scale-se
      source: home
      quote: Evaluates AI's ability to resolve genuine software engineering issues sourced from 12 popular Python
        GitHub repositories
      note: SWE-bench Verified, corpus entry swe-bench-verified.
  capability:
    - value: adversarial-robustness
      source: home
      quote: A benchmark that evaluates the susceptibility of LLMs to various jailbreak attacks.
      note: Tagged as capabilities.yaml's inspect-evals example says. Every capability here is a constituent
        eval's claim, as described on the maintainer's catalogue page (failure 002).
      failure: 2026-09-28-inspect-evals-002
    - value: situational-awareness
      source: home
      quote: Measures whether LLMs strategically comply with harmful requests when believing outputs will be used for
        RLHF training (free-tier/monitored) versus when unmonitored (paid-tier).
      note: The primary metric is the compliance gap between the monitored and the unmonitored condition.
    - value: honesty
      source: home
      quote: Evaluates honesty in large language models by testing whether they contradict their own beliefs when
        pressured to lie.
      note: MASK scores honesty separately from accuracy.
    - value: harm-avoidance
      source: home
      quote: Dataset with 250 safe prompts across ten prompt types that well-calibrated models should not refuse,
        and 200 unsafe prompts as contrasts that models, for most applications, should refuse.
  evaluation_method:
    - value: null
      source: home
      quote: Scoring is performed via an LLM judge comparing agent-generated answers against reference answers.
      failure: 2026-09-28-inspect-evals-003
  designed_for_subjects:
    - value: instruction-tuned-model
      source: repo
      quote: uv run inspect eval inspect_evals/arc_easy --model openai/gpt-5-nano
      note: A run names a provider model. The agentic evals drive it through the Inspect solvers each eval ships,
        which is the benchmark's-own-harness case of swe-bench-verified-003. That case is not logged again here.
  data.access:
    - value: fully-open
      source: repo
      quote: pip install inspect-evals
      note: The library and its task definitions are public, and datasets are pulled from their constituents' own
        hosts at run time. Each constituent keeps its own access state, and the fetched sources do not say which
        constituents are gated.
  data.refresh:
    - value: versioned-releases
      source: version
      quote: Each task carries a version in N-X format (e.g. 3-A), where N tracks comparability-breaking changes and
        X tracks interface changes.
      note: Versioning is per task, and the package also has releases (v0.22.0 on 2026-09-25). A claim pins to the
        task's comparability version N.
  data.data_provenance:
    - value: null
      failure: 2026-09-28-inspect-evals-004
  data.contamination_risk:
    - value: unknown
      note: Inspect Evals assesses no contamination for the library. Each constituent has its own posture, and most
        are public static sets.
  data.ceiling_anchor_type:
    - value: none-known
      note: The library defines no scale of its own. Each eval inherits its constituent's metric and anchor.
  lifecycle:
    - value: active
      source: home
      quote: Evaluating an open-weight model’s capabilities in cybersecurity, biology and autonomous tasks.
      note: The maintainer's "Featured work" lists results produced with the library, including this SaferAI
        GLM-5.2 risk report and UK AISI papers at arXiv 2606.17930 and 2608.14425 (June and August 2026). The
        repository shows commits on 2026-09-28.
  activity:
    - value: null
      source: register
      quote: The Inspect Evals Register aims to make it easier to submit, discover, and run evals that live in their
        authors’ own repositories.
      failure: 2026-09-28-inspect-evals-005
  governance.maintainer_type:
    - value: nonprofit
      source: home
      quote: Inspect Evals is maintained by Generality Labs, a London-based nonprofit which builds tools for evaluating
        risks and mitigations in frontier AI.
      failure: 2026-09-28-inspect-evals-007
  governance.submission_process:
    - value: null
      failure: 2026-09-28-inspect-evals-006
  governance.independence_flags:
    - value: no-known-conflict
      source: home
      quote: Inspect Evals was founded in 2024, with contributions from the UK AI Security Institute, Arcadia Impact,
        and the Vector Institute.
      note: Neither the maintainer nor any named contributor is a model vendor the library evaluates, and the
        maintainer publishes no results. This is a statement about the sources fetched on 2026-09-28.
  execution.compute_tier:
    - value: api-credits-only
      source: repo
      quote: ANTHROPIC_API_KEY=<anthropic-api-key>
      note: A typical run calls a provider API. Some evals pull Docker images ("at least 65 GB of extra space"),
        need up to 32 GB of RAM or depend on torch, so the tier varies by eval.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: repo
      quote: Choose an evaluation in the docs and follow the Usage section on its page.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: uv run inspect eval-set inspect_evals/arc_easy inspect_evals/arc_challenge
notes: Inspect Evals is a collection, not a benchmark or a framework. The framework is Inspect AI, by UK AISI. Inspect
  Evals is a library of 173 eval implementations built on it (129 in the repository and 44 externally registered at
  pinned upstream commits), and it publishes no scores. Under 02 S11 rule 5 each implemented eval belongs to its own
  benchmark's family, and AgentHarm, WMDP, SWE-bench Verified and GPQA are separate corpus entries. The record
  classifies what the library itself contributes (task versioning, a harness and a register), and the fields that
  belong to constituents abstain (failures 001, 003 and 004). The corpus files it under safety-alignment, but the
  catalogue spans every family. The maintainer is now Generality Labs, and the repository is still in the
  UKGovernmentBEIS namespace (failure 007).

# taxonomy/_corpus/classifications/melting-pot.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: melting-pot
corpus_item: 76
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2107.06857
  abs: https://arxiv.org/abs/2107.06857
  home: https://github.com/google-deepmind/meltingpot
  report2: https://arxiv.org/abs/2211.13746
  contest: https://www.aicrowd.com/challenges/meltingpot-challenge-2023
  releases: https://api.github.com/repos/google-deepmind/meltingpot/releases
  commits: https://api.github.com/repos/google-deepmind/meltingpot/commits
facets:
  domain.primary:
    - value: games-planning/multi-agent-social
      source: home
      quote: 'has been designed to test a broad range of social interactions such as: cooperation, competition,
        deception, reciprocation, trust, stubbornness and so on'
  domain.secondary: []
  capability:
    - value: distribution-shift-generalization
      source: abs
      quote: We apply these test scenarios to standard MARL training algorithms, and demonstrate how Melting Pot
        reveals weaknesses not apparent from training performance alone.
      note: The substrate is held fixed and only the co-players change ('test scenarios that preserve a familiar
        substrate while substituting a new and unfamiliar background population'), so the task does not change
        and transfer-learning's EXC applies instead.
    - value: collaboration
      source: paper
      quote: perform well across a range of social situations where individuals are interdependent
      failure: 2026-09-28-melting-pot-001
  evaluation_method:
    - value: episodic-return
      source: paper
      quote: We propose the focal-population per-capita return as a primary evaluation metric
      note: The paper min-max normalises returns between the worst and best agent in its pool "to contextualize
        the range", and also reports Elo over its agents; the raw per-capita return is the stated primary metric.
  designed_for_subjects:
    - value: rl-policy
      source: home
      quote: The resulting score can then be used to rank different multi-agent RL algorithms by their ability
        to generalize to novel social situations.
    - value: multi-agent-system
      source: paper
      quote: The purpose of Melting Pot is to evaluate the MAPLA by measuring the performance of the resulting focal
        population
  data.access:
    - value: fully-open
      source: home
      quote: Melting Pot is available on PyPI](https://pypi.python.org/pypi/dm-meltingpot) and can be installed using
      note: The test scenarios ship in the package; that agents must not train on background populations is a rule
        of the protocol, not an access control.
  data.refresh:
    - value: versioned-releases
      source: releases
      quote: 2024-12-19T12:22:13Z v2.4.0 v2.4.0
      note: The corpus paper is Melting Pot 1.0 ("over 80 unique test scenarios"); the corpus description and the
        repository are 2.x ("over 256 unique test scenarios").
  data.data_provenance:
    - value: model-generated
      source: abs
      quote: uses reinforcement learning to reduce the human labor required to create novel test scenarios
      note: The background populations that make a scenario are trained agents.
    - value: simulation-generated
      source: home
      quote: Melting Pot is built on top of [DeepMind Lab2D](https://github.com/google-deepmind/lab2d)
  data.contamination_risk:
    - value: medium
      source: paper
      quote: Note that the learning algorithms only have access to the raw substrates and not the background populations.
      note: The background populations are released with the package, so training on the test co-players is a
        plausible, unevidenced route that only the protocol rule prevents.
  data.ceiling_anchor_type:
    - value: measured-ceiling
      source: paper
      quote: Together, exploiters and the random agent provide a rough estimate of the upper and lower bounds (respectively)
        of performance on the test scenarios.
      failure: 2026-09-28-melting-pot-002
  lifecycle:
    - value: null
      source: commits
      quote: 2026-09-21T12:24:04Z Move assert to fix pyrefly error
      failure: 2026-09-28-melting-pot-003
  activity:
    - value: null
      failure: 2026-09-28-melting-pot-004
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: 'Joel Z. Leibo Affiliation: DeepMind'
      note: The README says "We plan to maintain it", and the repository is google-deepmind's.
  governance.submission_process:
    - value: null
      failure: 2026-09-28-melting-pot-005
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: On average, the top performing agent was V-MPO (Song et al., 2020a), followed by OPRE (Vezhnevets et
        al., 2020)
      note: OPRE's first author, Alexander Sasha Vezhnevets, is a Melting Pot author, and the paper's benchmark
        results are the maintainers' own agent architectures.
  execution.compute_tier:
    - value: simulator-required
      source: home
      quote: Melting Pot is built on top of [DeepMind Lab2D](https://github.com/google-deepmind/lab2d)
      failure: 2026-09-28-melting-pot-006
  execution.reproducibility_tier:
    - value: automatable-with-simulator
      source: home
      quote: library can be used to evaluate [SavedModel](https://www.tensorflow.org/guide/saved_model)s trained
        on Melting Pot substrates.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: library can be used to evaluate [SavedModel](https://www.tensorflow.org/guide/saved_model)s trained
        on Melting Pot substrates.
notes: The corpus entry is the Melting Pot suite as the repository defines it (2.x). Its paper is the 1.0 paper;
  the 2.0 tech report revises the substrates and scenarios, and the NeurIPS 2023 contest on AIcrowd was a single
  closed edition (organised with the Cooperative AI Foundation and MIT) with its own held-out scenarios and a
  normalisation to the Melting Pot 2.0 baseline range. The contest is cited only for that normalisation (failure
  002) and for the family's one submission channel, now closed (failure 004).

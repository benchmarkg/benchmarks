# taxonomy/_corpus/classifications/frontiermath-tiers-erd-s.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: frontiermath-tiers-erd-s
corpus_item: 3
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2411.04872
  abs: https://arxiv.org/abs/2411.04872
  home: https://epoch.ai/frontiermath
  tiers: https://epoch.ai/frontiermath/tiers-1-4
  erdos: https://epoch.ai/benchmarks/frontiermath-erdos
  about: https://epoch.ai/about
facets:
  domain.primary:
    - value: mathematics/research-level-math
      source: home
      quote: Difficulty Tiers 1-3 cover undergraduate problems through exploratory problems suitable for an
        advanced graduate student, while Tier 4 is research-level mathematics.
      note: FrontierMath Erdős (68 conjectures open as of August 2026) is research-level by construction.
  domain.secondary:
    - value: mathematics/formal-theorem-proving
      source: erdos
      quote: Problems are formulated in Lean and AI must write complete Lean proofs or disproofs.
  capability:
    - value: quantitative-reasoning
      source: abs
      quote: from computationally intensive problems in number theory and real analysis
    - value: deductive-reasoning
      source: erdos
      quote: A model resolves a conjecture when it submits a proof of the conjecture or of its negation that
        passes verification.
  evaluation_method:
    - value: exact-match
      source: paper
      quote: If the problem has a unique integer solution, it checks for an exact match.
    - value: symbolic-equivalence
      source: paper
      quote: it uses SymPy evaluation to check that the difference between the submitted answer and the actual
        answer simplifies to 0
      note: Tiers 1-4 only. The Erdős track's Lean-checked proofs are formal-proof-check.
    - value: formal-proof-check
      source: erdos
      quote: We accept a submission only if it passes Comparator, a proof checker maintained by the Lean FRO
  designed_for_subjects:
    - value: model-in-benchmark-harness
      source: paper
      quote: The interaction continues until either the model submits a correctly formatted final answer or
        reaches the token limit
      note: In Tiers 1-4 the model iterates inside Epoch's Python loop and decides when to submit; in Erdős it
        runs inside Epoch's own evaluation scaffold. The loop is the benchmark's, applied identically to every
        model.
  data.access:
    - value: private-test-server
      source: tiers
      quote: A benchmark of several hundred unpublished, highly challenging mathematics problems.
      note: Tiers 1-4 never leave Epoch, which evaluates them itself; outside teams must reach out. The Erdős
        statements are public, but a headline that mixes open and held sets takes the most restrictive.
  data.refresh:
    - value: versioned-releases
      source: tiers
      quote: On 2026-06-12, we released v2 which addressed errors in 42% of problems.
      note: This applies to Tiers 1-4. The Erdős set states no versioning. Its conjectures can be filtered out
        once resolved ("conjectures resolved before a model’s training cutoff can be filtered out"), which
        shrinks the set rather than versioning it.
  data.data_provenance:
    - value: expert-authored
      source: abs
      quote: crafted and vetted by expert mathematicians
    - value: curated-public-database
      source: erdos
      quote: These problems are sourced from ErdősProblems.com.
      note: A curated archive of Erdős problems, whose maintainer helped select the 68; 50 of the Lean
        statements come from Formal Conjectures, 'an open-source library of formalized open problems
        maintained by Google DeepMind'. Neither was published as an evaluation dataset.
    - value: model-generated
      source: erdos
      quote: We formalized these ourselves using an autoformalization pipeline
      note: 17 Erdős statements were autoformalized and then reviewed by Bloom.
  data.contamination_risk:
    - value: low
      source: abs
      quote: FrontierMath uses new, unpublished problems and automated verification to reliably evaluate models
        while minimizing risk of data contamination.
      note: The Erdős page adds that no proof of any conjecture was known as of August 2026. The route by which
        problems reach model providers during API evaluation is not assessed in the sources.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: abs
      quote: Current state-of-the-art AI models solve under 2% of problems, revealing a vast gap between AI
        capabilities and the prowess of the mathematical community.
      note: The headline is the fraction of problems solved, bounded at 100%, and no source publishes a
        measured human score; the comparison with mathematicians is qualitative. For Erdős, human performance
        is zero by construction, since the problems are open.
  lifecycle:
    - value: active
      source: paper
      quote: At Epoch AI, we are committed to maintaining FrontierMath as a public resource and regularly
        conducting comprehensive evaluation
      note: Tiers 1-4 v2 was released on 2026-06-12 and the Erdős component in 2026, which corroborates the
        stated commitment.
  activity:
    - value: no-submission-channel
      source: paper
      quote: Teams interested in evaluating models on the benchmark should reach out to
      note: Epoch runs every evaluation and publishes the results; an on-request evaluation is not a
        submission channel.
  governance.maintainer_type:
    - value: nonprofit
      source: about
      quote: Epoch AI is a data-first research nonprofit investigating the future of artificial intelligence.
  governance.submission_process:
    - value: maintainer-run
      source: erdos
      quote: Spend is metered at each model’s standard API prices.
      note: Epoch selects the models, runs them, meters the spend and publishes the numbers; nobody submits.
  governance.independence_flags:
    - value: funded-by-evaluated-party
      source: tiers
      quote: This project is supported by OpenAI.
      note: OpenAI models are evaluated from the first paper onwards (o1-preview, o1-mini, GPT-4o).
    - value: single-evaluator-private-test-set
      source: tiers
      quote: A benchmark of several hundred unpublished, highly challenging mathematics problems.
      note: This applies to Tiers 1-4, which Epoch holds and evaluates itself. The Erdős statements are
        public.
    - value: evaluator-sells-evaluations
      source: about
      quote: We offer mission-aligned services to companies, nonprofits, and government bodies, including
        commissioned research, model evaluations, and consultations.
  execution.compute_tier:
    - value: api-credits-only
      source: erdos
      quote: Spend is metered at each model’s standard API prices.
      note: Erdős caps each attempt at $300 of spend and 72 hours.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: tiers
      quote: A benchmark of several hundred unpublished, highly challenging mathematics problems.
      note: Only Epoch can score Tiers 1-4, and the most restrictive part of the headline decides; the open
        Erdős component would be fully-automatable on its own.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: tiers
      quote: A benchmark of several hundred unpublished, highly challenging mathematics problems.
      note: This applies to Tiers 1-4 only.
  execution.harness_availability:
    - value: official-harness
      source: erdos
      quote: the open-source repository, which contains the Lean statement of each conjecture and the
        evaluation scaffold
      note: This covers Erdős. No Tiers 1-4 harness is published in the fetched sources.
notes: The corpus flags this as a composite entry. Tiers 1-4 and FrontierMath Erdős are separate benchmarks
  with separate pages and papers, and they disagree on every data and execution field that depends on whether
  the items are private. 0.9.0's precedence rules settle the single-valued fields for the entry as a whole, so
  the most restrictive component decides data.access and reproducibility_tier. symbolic-equivalence rests on
  the Tiers SymPy check, as 0.9.0's corrected example does. A third component, FrontierMath Open Problems, is on the home
  page but not in the entry.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [evaluation_method, designed_for_subjects, data.access, data.data_provenance,
      data.ceiling_anchor_type, activity, governance.submission_process, execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; the composite entry's single-valued fields follow the
      most-restrictive precedence rules.

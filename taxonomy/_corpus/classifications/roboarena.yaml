# taxonomy/_corpus/classifications/roboarena.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: roboarena
corpus_item: 14
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2506.18123
  abs: https://arxiv.org/abs/2506.18123
  home: https://github.com/robo-arena/roboarena
facets:
  domain.primary:
    - value: robotics-embodiment/manipulation
      source: paper
      quote: deployed on a robot arm to perform various manipulation tasks
      note: The arena shape is carried by evaluation_method and governance, and an arena confined to one field
        takes that field's subdomain (ADR-0018; 02 S12.2).
  domain.secondary:
    - value: robotics-embodiment/embodied-instruction-following
      source: paper
      quote: in form of a natural language instruction
  capability:
    - value: sensorimotor-control
      source: abs
      quote: Through more than 600 pairwise real-robot evaluation episodes across seven generalist policies
  evaluation_method:
    - value: pairwise-preference-elo
      source: abs
      quote: by aggregating preference feedback from pairwise comparisons across diverse tasks and environments,
        we can derive a ranking of policies.
      note: The rating model is Bradley-Terry extended with latent task-difficulty parameters; the rating
        pool is the DROID-RoboArena policy pool.
    - value: physical-trial
      source: abs
      quote: we propose RoboArena, a new approach for scalable evaluation of generalist robot policies in
        the real world.
  designed_for_subjects:
    - value: physical-robot-system
      source: paper
      quote: which consists of a Franka Panda 7DoF robot arm, a Robotiq 2F-85 parallel-jaw gripper
      note: Evaluator-owned standard DROID hardware is still recorded as the hardware, and the entrant is the
        policy running on it (0.9.0 physical-robot-system inclusion test).
  data.access:
    - value: null
      source: paper
      quote: 'This database hosts all evaluation results: instructions, scores and preference, natural language
        feedback, and the rollout videos.'
      failure: 2026-09-28-roboarena-012
  data.refresh:
    - value: rolling-live
      source: paper
      quote: with dozens of evaluators asynchronously contributing policy evaluations at any time of day
  data.data_provenance:
    - value: real-world-instrument
      source: paper
      quote: recordings of all observations and actions are sent to the central server
      note: The recorded trials of a live physical evaluation take this term (0.9.0 inclusion test; 02
        S12.2).
  data.contamination_risk:
    - value: low
      source: abs
      quote: evaluators can freely choose the tasks and environments they evaluate on
      note: A live physical trial on evaluator-chosen tasks and scenes has no stored item set for training data
        to contain, which excludes the route by structure (0.9.0 low inclusion test; 02 S12.2).
  data.ceiling_anchor_type:
    - value: none-known
      source: abs
      quote: by aggregating preference feedback from pairwise comparisons across diverse tasks and environments,
        we can derive a ranking of policies.
      note: The headline is a Bradley-Terry rating fitted to a pool, which has no top; the reason is carried by
        Metric.requires_pool (0.9.0 none-known inclusion test; 02 S12.2).
  lifecycle:
    - value: null
      failure: 2026-09-28-roboarena-006
  activity:
    - value: accepting-submissions
      source: home
      quote: (1) serving your policy via a remote policy server, to make it ready for RoboArena evaluation
      note: The current README instructs how to submit. The paper states the network is open ('to which
        anyone can submit policies and contribute evaluations').
  governance.maintainer_type:
    - value: community-collective
      source: paper
      quote: 1UC Berkeley, 2Stanford University, 3University of Washington, 4University of Montreal, 5NVIDIA
      note: The code sits in a shared organisation account (robo-arena), and the network is run by
        contributors from eight institutions; no source states a single institution as holder or a legal form
        (0.9.0 holder rule; 02 S12.2).
  governance.submission_process:
    - value: live-arena
      source: paper
      quote: RoboArena relies on a decentralized network of evaluators that perform pairwise, double-blind
        comparisons of policies
  governance.independence_flags:
    - value: grader-from-evaluated-party
      source: paper
      quote: for every pairwise policy evaluation that an evaluator runs, they receive a credit, which they
        can use to request an equal number of pairwise comparisons between their own policies and other policies
        from the pool.
      note: The evaluators who cast the preference votes are entrants. Double-blind assignment is the stated
        safeguard.
  execution.compute_tier:
    - value: physical-hardware
      source: abs
      quote: We instantiate our approach across a network of evaluators at seven academic institutions using
        the DROID robot platform.
      note: The result needs the robot, while an entrant needs only a served policy; compute_tier_by_role
        holds both roles (0.9.0; 02 S12.2).
  execution.reproducibility_tier:
    - value: requires-specialized-hardware
      source: abs
      quote: We instantiate our approach across a network of evaluators at seven academic institutions using
        the DROID robot platform.
      note: A fresh ranking needs a DROID fleet and human evaluators, and hardware comes before raters. Tasks
        are never repeated ('By not relying on identical initial conditions'), which is the live-world-state
        blocker, not a maintainer-only tier (0.9.0; 02 S12.2).
  execution.reproducibility_blockers:
    - value: hardware-fleet
      source: abs
      quote: We instantiate our approach across a network of evaluators at seven academic institutions using
        the DROID robot platform.
    - value: human-raters
      source: paper
      quote: a binary, pairwise preference label that indicates which policy the evaluator preferred
    - value: live-world-state
      source: abs
      quote: Instead of standardizing evaluations around fixed tasks, environments, or locations
  execution.harness_availability:
    - value: reference-implementation-only
      source: home
      quote: 'This repo contains example code and instructions for:'
      note: A policy-server interface and a client are published, while the official rating is fitted
        centrally to preference votes (0.9.0; 02 S12.2).
notes: >-
  Designated stress test. RoboArena is less a task set than an evaluation protocol: there are no fixed items,
  the evaluators set the tasks, and the ranking is a live rating. Most data.* and execution.* fields presuppose a
  stored item set and a runnable scorer, and they strain accordingly. The site is a JavaScript application,
  so the paper and the repository README are the only fetched sources.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, designed_for_subjects, data.access, data.data_provenance,
      data.contamination_risk, data.ceiling_anchor_type, governance.maintainer_type,
      governance.independence_flags, execution.compute_tier, execution.reproducibility_tier,
      execution.harness_availability]
    note: Re-adjudicated against 0.9.0.

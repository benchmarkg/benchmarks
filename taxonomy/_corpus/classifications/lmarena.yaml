# taxonomy/_corpus/classifications/lmarena.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: lmarena
corpus_item: 89
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2403.04132
  abs: https://arxiv.org/abs/2403.04132
  repo: https://github.com/lm-sys/FastChat
  leaderboard: https://arena.ai/leaderboard/text
  policy: https://arena.ai/blog/policy/
  how: https://arena.ai/how-it-works
  about: https://arena.ai/company/about
  blog: https://arena.ai/blog
  changelog: https://arena.ai/company/leaderboard-changelog
  faq: https://arena.ai/faq
facets:
  domain.primary:
    - value: general-intelligence/open-preference-arenas
      source: abs
      quote: we introduce Chatbot Arena, an open platform for evaluating LLMs based on human preferences.
      note: Public prompts, anonymous pairwise votes and Bradley-Terry ratings across the text, vision, webdev, image,
        video and search arenas, with a claim of breadth across uses (ADR-0018; lmarena is the term's example).
  domain.secondary:
    - value: language/dialogue
      source: paper
      quote: Each data point includes multi-turn conversations between the user and two LLMs, and a vote to indicate
        which model the user prefers.
      note: The vote is on the whole conversation, but the text arena averaged 1.3 turns per conversation in the
        paper's data (Table 1).
    - value: multimodal/any-to-any-generation
      source: how
      quote: if you want to generate an image, select the image icon
      note: The Text-to-Image, Image Edit, Text-to-Video and Image-to-Video arenas.
    - value: multimodal/visual-qa
      source: changelog
      quote: glm-5.3-flash has been added to the Text Arena and Vision Arena leaderboards.
  capability:
    - value: null
      source: paper
      quote: Current benchmarks often fail to capture the nuanced and diverse aspects of these models, particularly in
        assessing their alignment with human preferences in real-world, open-ended tasks.
      failure: 2026-09-28-lmarena-002
  evaluation_method:
    - value: pairwise-preference-elo
      source: faq
      quote: Your votes directly shape the model rankings through the Bradley-Terryrating system
      note: The rating pool is each arena's current model set, and the snapshot is the leaderboard date. Ratings are
        style-controlled by default, and the changelog records corrections to the Bradley-Terry fit, so the method
        itself moves between snapshots. AutoEval scores (July 2026) fill in before votes accumulate, and the fetched
        sources do not describe how they are computed.
  designed_for_subjects:
    - value: hosted-inference-endpoint
      source: policy
      quote: 'Public APIs: The model is accessible via a public, global, and generally accessible API'
      note: Models are listed as served (open weights, public APIs or public services), and the provider must keep
        access available for 30 days.
    - value: generative-media-model
      source: how
      quote: if you want to generate an image, select the image icon
      note: The image and video arenas score the generated media by preference.
  data.access:
    - value: private-test-server
      source: policy
      quote: We release a fraction of the data collected from the platform, as well.
      note: 0.9.0's generated-on-demand excludes items that people improvise live (lmarena is its near miss), and the
        access state is that of the record of those items. The prompts and votes behind the ratings stay with Arena
        ('we don't release full conversation logs'), only a fraction is released, and model providers receive their
        conversation data privately, which creates no public access path. The headline cannot be computed from
        downloaded data.
  data.refresh:
    - value: rolling-live
      source: paper
      quote: It requires the collection of live, fresh, and diverse user questions to accurately represent real-world
        scenarios.
  data.data_provenance:
    - value: crowd-authored
      source: abs
      quote: leverages input from a diverse user base through crowdsourcing
  data.contamination_risk:
    - value: medium
      source: policy
      quote: When we test unreleased models, we share conversation data with model providers to help them improve
        their models
      note: The prompts are fresh, so stored items cannot leak. But the maintainer states a route by which the
        evaluation distribution reaches some entrants, and public datasets of past battles are released. No source
        measures the effect.
  data.ceiling_anchor_type:
    - value: none-known
      note: The headline is a Bradley-Terry rating fitted to pairwise votes, which has no top ('similar to the Elo
        rating system'). 0.9.0's none-known covers a pool-fitted rating, whose reason is carried by Metric.requires_pool
        (lmarena is the term's example).
  lifecycle:
    - value: active
      source: changelog
      quote: deepseek-v4.1-flash-max, grok-4.7-xhigh, gpt-6-sol-max, gpt-6-luna-max, and claude-opus-5.5-high has been
        added to the Text Arena leaderboard.
      note: Dated September 25, 2026.
  activity:
    - value: accepting-submissions
      source: faq
      quote: We work directly with open-source and commercial model providers to make their pre-release models available
        for community testing
      note: The arena has never run in rounds, so 0.9.0's leaderboard-live-no-round (for a benchmark that runs or has
        run rounds) does not apply. Providers bring models and keep access open for 30 days, and a model that meets
        the listing policy is rated once it accumulates votes ('at least 1,000; typically more').
  governance.maintainer_type:
    - value: industry-lab
      source: about
      quote: In 2025, we formed Arena Intelligence Inc. and raised funding from a16z and The University of California.
      note: The paper-era maintainer was a UC Berkeley group (LMSYS). The company reports $250 million in venture
        funding.
  governance.submission_process:
    - value: live-arena
      source: abs
      quote: Our methodology employs a pairwise comparison approach and leverages input from a diverse user base
        through crowdsourcing.
  governance.independence_flags:
    - value: evaluator-sells-evaluations
      source: faq
      quote: We offer AI evaluations to enterprises, model labs, and developers grounded in real-world human feedback.
      failure: 2026-09-28-lmarena-005
    - value: funded-by-evaluated-party
      source: paper
      quote: This project is also partly supported by Accenture, AMD, Google, IBM, Intel, Microsoft, Samsung SDS, SAP,
        Uber, and VMware.
      note: Google, IBM and Microsoft models are ranked on the board. This is the paper-era support. The 2025 company
        is venture-funded.
  execution.compute_tier:
    - value: api-credits-only
      source: policy
      quote: 'Public APIs: The model is accessible via a public, global, and generally accessible API'
      note: A new system's rating needs its provider to serve it to Arena, which is inference spend. The votes come
        from unpaid users, so human-panel ('paid human rater time') does not apply, and ADR-0020 rejects volunteer-crowd
        because the rater base is recorded by live-arena, the human-raters blocker and the reproducibility tier.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: policy
      quote: We release a fraction of the data collected from the platform, as well.
      note: A rating needs Arena's own user stream to cast the votes, a rater base only the maintainer has. Re-fitting
        ratings from the released votes ('anyone can audit our leaderboard using publicly released data') is not
        reproduction under 0.9.0.
  execution.reproducibility_blockers:
    - value: human-raters
      source: abs
      quote: Our methodology employs a pairwise comparison approach and leverages input from a diverse user base
        through crowdsourcing.
    - value: live-world-state
      source: paper
      quote: It requires the collection of live, fresh, and diverse user questions to accurately represent real-world
        scenarios.
      note: The corpus flags the ranking as non-stationary. The user population and its prompts move, so the same
        evaluation cannot be repeated.
  execution.harness_availability:
    - value: official-harness
      source: policy
      quote: The model evaluation and ranking pipelines have been open sourced in the Arena-Rank repository.
      note: The released pipeline turns votes into ratings. The votes themselves can only be collected on Arena, and
        FastChat holds the original serving and battle code.
notes: The corpus flags a rebrand (Chatbot Arena, then LMArena, now Arena at arena.ai). The paper describes the
  2024 text-only Chatbot Arena, and the corpus entry covers the 2026 platform with text, vision, webdev, image, video
  and search arenas. Under 02 S11 rule 5 these are one family, but they differ in modality and subject, which is part
  of why the platform takes the breadth subdomain open-preference-arenas (ADR-0018) rather than a modality's. Each
  arena may later become a child entry with its own domain. The Agent Arena, launched in June 2026, is outside the corpus
  description and is not classified here. The arena.ai home page is an SPA stub and is not used. The policy URL
  arena.ai/policy is also a stub, so the Leaderboard Policy post is cited instead.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, data.access, data.ceiling_anchor_type, activity, execution.compute_tier,
      execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; ADR-0018 gives the primary, and the layering rules settle access, compute and tier.

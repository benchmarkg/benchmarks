# taxonomy/_corpus/classifications/proteingym.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: proteingym
corpus_item: 22
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://proceedings.neurips.cc/paper_files/paper/2023/file/cac723e5ff29f65e3fcbb0739ae91bee-Paper-Datasets_and_Benchmarks.pdf
  home: https://github.com/OATML-Markslab/ProteinGym
facets:
  domain.primary:
    - value: biology-genetics/protein-fitness-prediction
      source: home
      quote: ProteinGym is an extensive set of Deep Mutational Scanning (DMS) assays and annotated human clinical
        variants curated to enable thorough comparisons of various mutation effect predictors in different regimes.
  domain.secondary:
    - value: biology-genetics/genomics-variant-effect
      source: paper
      quote: ClinVar permits the direct comparison of predictive models in terms of their accuracy in estimating
        the functional impact of mutations on human health.
  capability:
    - value: scientific-prediction
      source: paper
      quote: In the zero-shot setting we predict experimental phenotypical measurements from a given assay, without
        having access to the labels at training time.
      note: The headline predicts DMS assay measurements and clinical variant effects and scores them against the
        measurements and labels (ADR-0014).
    - value: distribution-shift-generalization
      source: paper
      quote: In order to quantify the ability of each model to extrapolate to unseen positions at training time,
        we leverage 3 types of cross-validation schemes introduced in Notin et al. [2023].
      note: 'Supervised track only: Contiguous and Modulo splits hold out positions and are reported against Random
        (Table 3); the task and its labels are unchanged.'
  evaluation_method:
    - value: statistical-fit
      source: paper
      quote: the Spearman’s rank correlation coefficient is the most generally appropriate metric for model performance
        on experimental measurements
      note: NDCG and top-10% recall are also reported; the "corrected average" averages one metric over functional
        groups, which composite excludes.
    - value: classification-metric
      source: home
      quote: 'For clinical benchmarks: AUC'
      note: AUC and MCC also score the zero-shot DMS benchmarks against binarized measurements.
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: Protein language models are trained on large quantities of unaligned sequences across protein families.
  data.access:
    - value: fully-open
      source: paper
      quote: The DMS assays, model scores, Multiple Sequence Alignments, predicted 3D structures, processed Clin-
        Var/gnomAD datasets, and raw files before preprocessing can all be downloaded from our servers
  data.refresh:
    - value: versioned-releases
      source: home
      quote: The latest version is v1.3.
  data.data_provenance:
    - value: experimental-measurement
      source: home
      quote: 'DMS_score (float): corresponds to the experimental measurement in the DMS assay.'
    - value: curated-public-database
      source: paper
      quote: ClinVar [Landrum and Kattman, 2018] is an extensive, public database developed by the National Center
        for Biotechnology Information (NCBI).
      note: The clinical labels are ClinVar annotations, a curated archive of submitted reports, not a published
        evaluation dataset.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: In a supervised benchmark, there is the potential for data leakage from training to testing, even for
        different variants in the same protein.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: the Spearman’s rank correlation coefficient is the most generally appropriate metric for model performance
        on experimental measurements
      note: The headline Spearman is bounded at 1, and no source reports a measured ceiling. The paper says "some assays
        have poor experimental replicate correlation" and "one cannot expect perfect correlation between experiment and
        model", naming a noise ceiling it does not measure or report per assay.
  lifecycle:
    - value: active
      source: home
      quote: Added 16 baselines to the zero-shot DMS substitutions benchmark (eg., ESM3, ESM C, ProGen3, xTrimoPGLM).
  activity:
    - value: accepting-submissions
      source: home
      quote: 'If you would like new baselines to be included in ProteinGym (ie., website, performance files, detailed
        scoring files), please follow the following steps:'
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: Debora S. Marks∗ Harvard Medical School Broad Institute
  governance.submission_process:
    - value: maintainer-verified
      source: home
      quote: The corresponding model is open source (we should be able to reproduce scores if needed).
      note: New baselines arrive by a reviewed pull request carrying all model scores and runnable code. Re-scoring is
        possible, not stated as done, so the stated review decides (proteingym is the 0.9.0 example).
    - value: maintainer-run
      source: paper
      quote: We implement a diverse set of 50+ zero-shot baselines
      note: The maintainers run the baselines and keep the leaderboards at proteingym.org, and 'are planning on
        regularly scoring new baselines ourselves'.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: Lastly, we include ProteinNPT [Notin et al., 2023], a semi-supervised pseudo-generative architecture
      note: The paper's first author is Notin and its last is Marks; the README credits Tranception, TranceptEVE
        and EVE among the ranked baselines to the same authors.
  execution.compute_tier:
    - value: null
      source: home
      quote: Download the model scores from the website
      failure: 2026-09-28-proteingym-004
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: all of the model predictions can be reproduced using this repository
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: The open-source codebase containing a framework for scoring all the benchmarks is available via our
        GitHub repository
notes: The title says "Fitness Prediction and Design", but no track generates sequences; the design metrics (NDCG,
  top-k recall) rank assayed variants, so protein-design is not tagged. The website is a JS app; the README and
  NeurIPS paper are the sources. ProteinGym has never run in rounds, so its open leaderboard is accepting-submissions.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, evaluation_method, data.data_provenance, data.ceiling_anchor_type, activity,
      governance.submission_process]
    note: Re-adjudicated against 0.9.0; scientific-prediction (ADR-0014) and curated-public-database are tagged.

# taxonomy/_corpus/classifications/geo-bench-2.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: geo-bench-2
corpus_item: 56
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2511.15658
  abs: https://arxiv.org/abs/2511.15658
  home: https://github.com/The-AI-Alliance/GEO-Bench-2
  leaderboard: https://github.com/The-AI-Alliance/GEO-Bench-2-Leaderboard
facets:
  domain.primary:
    - value: earth-climate/remote-sensing
      source: abs
      quote: Geospatial Foundation Models (GeoFMs) are transforming Earth Observation (EO), but evaluation lacks standardized
        protocols.
      note: The benchmark presents itself as Earth observation, which 0.9.0's remote-sensing tie-break makes primary
        although some labels are generic objects (buildings, cattle); the vision tasks go to secondary (the term's
        own geo-bench-2 example).
  domain.secondary:
    - value: vision/segmentation
      source: abs
      quote: GEO-Bench-2 addresses this with a comprehensive framework spanning classification, segmentation, regression,
        object detection, and instance segmentation across 19 permissively-licensed datasets.
    - value: vision/classification
      source: abs
      quote: GEO-Bench-2 addresses this with a comprehensive framework spanning classification, segmentation, regression,
        object detection, and instance segmentation across 19 permissively-licensed datasets.
    - value: vision/detection
      source: abs
      quote: GEO-Bench-2 addresses this with a comprehensive framework spanning classification, segmentation, regression,
        object detection, and instance segmentation across 19 permissively-licensed datasets.
  capability:
    - value: perception
      source: abs
      quote: GEO-Bench-2 addresses this with a comprehensive framework spanning classification, segmentation, regression,
        object detection, and instance segmentation across 19 permissively-licensed datasets.
      failure: 2026-09-28-geo-bench-2-002
  evaluation_method:
    - value: composite
      source: paper
      quote: To report scores for a capability, we aggregate results across multiple datasets.
      note: Per-dataset scores are min-max normalised, bootstrapped and IQM-aggregated into each capability-group score.
    - value: domain-metric
      source: paper
      quote: 'Instance segmentation and Object detection: Mean Average Precision (mAP)'
      note: Semantic segmentation uses the Multiclass Jaccard Index (IoU).
    - value: statistical-fit
      source: paper
      quote: 'Pixel Wise Regression: Root Mean Squared Error (RMSE)'
    - value: exact-match
      source: paper
      quote: 'Single label Classification: Accuracy'
    - value: classification-metric
      source: paper
      quote: 'Multilabel classification: F1-score'
  designed_for_subjects:
    - value: domain-specialist-model
      source: home
      quote: GEO-Bench-2 is a framework for robust evaluation of Geospatial Foundation Models (GeoFMs)
      note: EO foundation models and general vision backbones (DINOv3, ConvNeXt) are each fine-tuned on the EO
        datasets, and 0.9.0's inclusion test counts fine-tuning on a discipline's data as the specialisation tested
        (the term's own geo-bench-2 example).
  data.access:
    - value: fully-open
      source: abs
      quote: Code, data, and leaderboard for GEO-Bench-2 are publicly released under a permissive license.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: but leaderboard submissions are solely accepted based on official dataset versions on
      note: GEO-Bench-2 is itself the second version of GEO-Bench (a different benchmark release, per the corpus flag).
  data.data_provenance:
    - value: inherited-from-constituents
      source: paper
      quote: After experimentation and thorough analysis, we selected 19 that we believe enable high-quality GeoFM evaluation
      note: 19 of 35 candidate public EO datasets are selected, subsampled and reformatted, and each keeps its own
        labels and documents its own provenance (the term's own geo-bench-2 example).
    - value: real-world-instrument
      source: paper
      quote: 'S1: Sentinel-1; S2: Sentinel-2; DEM: Digital Elevation Model'
      note: The modality the benchmark's own sources state for the reused data, satellite and aerial capture.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: After experimentation and thorough analysis, we selected 19 that we believe enable high-quality GeoFM evaluation
      note: All 19 are pre-existing public datasets (BigEarthNet V2, SpaceNet, PASTIS and others), and the evaluated
        GeoFMs are pretrained on public Sentinel, Landsat and aerial archives. No overlap check is reported, so a route
        is plausible and unevidenced.
  data.ceiling_anchor_type:
    - value: none-known
      source: paper
      quote: we normalize each dataset’s scores to [0,1] using a linear transformation with the worst and best result for
        a given dataset as the reference points
      note: The capability scores are min-max normalised to the best of a fixed reference pool, which a new model can
        exceed, so the scale is pool-relative and cannot have an anchor (the term's own geo-bench-2 example). The reason
        is carried by the Metric, not by a term.
  lifecycle:
    - value: active
      source: home
      quote: tracks the performance of state-of-the-art models on GeoBench-2 datasets. It further acts as a public repository
        of model performance.
      note: The paper's results are in v2 (revised 2 Feb 2026), and the README cites the TMLR 2026 version.
  activity:
    - value: accepting-submissions
      source: home
      quote: We strongly encourage users of the this library to submit experimental results to the leaderboard.
      note: GEO-Bench-2 has never run in rounds, so 0.9.0's leaderboard-live-no-round exclusion sends a continuously
        open leaderboard here.
  governance.maintainer_type:
    - value: community-collective
      source: home
      quote: This project was developed as part of the AI Alliance with involvement from IBM and ServiceNow.
      note: Both repositories sit in The-AI-Alliance organisation, run by contributors from IBM, ServiceNow, TUM, Clark,
        MBZUAI, NASA, ESA and Arizona State. No source states a legal form for the AI Alliance or names a single
        institution as holder, so 0.9.0's consortium and holder tests give community-collective.
  governance.submission_process:
    - value: maintainer-verified
      source: paper
      quote: Leaderboard submissions will be reviewed and may be flagged as over-engineered if search spaces are excessively
        customized.
      note: Entrants open a pull request with their results and hyperparameters. The maintainers "reserve the right to
        reject submissions" that do not follow the protocol or "Cannot be reproduced, e.g., closed source model".
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: 'P. Fraccaro, T. Brunschwiler, G. Cavallaro, J. Bernabe-Moreno, and N. Longépé (2025) TerraMind: large-scale
        generative multimodality for earth observation.'
      note: Fraccaro, Bernabe-Moreno (IBM Research Europe) and Longépé (ESA) are GEO-Bench-2 authors. TerraMind and Prithvi-EO-2.0
        (Fraccaro is also a Prithvi author) are among the evaluated GeoFMs and lead the multi-spectral and multi-temporal
        capabilities. The baseline protocol runs on IBM's TerraTorch.
  execution.compute_tier:
    - value: null
      source: paper
      quote: Core provides a balanced subset across all capabilities with the aim of reducing the compute needed for evaluating
        on the benchmark
      failure: 2026-09-28-geo-bench-2-007
  execution.reproducibility_tier:
    - value: fully-automatable
      source: leaderboard
      quote: It includes functionality to easily perform both hyperparameter tuning and re-repeated experiments in the manner
        prescribed by the GEO-Bench protocol.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: paper
      quote: It is recommended to use the leaderboard or the provided code for computing these scores based on raw results
        to minimize the chance of mistakes.
notes: GEO-Bench-2 is distinct from the original GEO-Bench (ServiceNow/geo-bench), as the corpus flags. The Hugging
  Face leaderboard Space is an app and was not fetched; its GitHub repository README describes the submission route.
  The paper excludes Sen1Floods11 because models "saturate" on it, which bears on that entry.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, evaluation_method, designed_for_subjects, data.data_provenance, data.ceiling_anchor_type, activity, governance.maintainer_type]
    note: Re-adjudicated against 0.9.0; the remote-sensing tie-break, domain-specialist-model's rewrite, inherited-
          from-constituents, the pool-relative none-known and the holder rule settle five Stage 3 failures,
          classification-metric records the multilabel F1, and activity moves to accepting-submissions. The
          pretrained-representation gap stays open (representation-quality deferred) and compute stays source-
          silent.

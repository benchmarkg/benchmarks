# taxonomy/_corpus/classifications/casp16-na-rna-puzzles-joint-assessment.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: casp16-na-rna-puzzles-joint-assessment
corpus_item: 20
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC13185081/
  home: https://predictioncenter.org/casp16/
  casp17: https://predictioncenter.org/casp17/
  repo: https://github.com/DasLab/CASP16_NA
facets:
  domain.primary:
    - value: biology-genetics/nucleic-acid-structure
      source: paper
      quote: Here, we present an assessment of blind predictions across all NA targets of CASP16.
  domain.secondary: []
  capability:
    - value: null
      source: paper
      quote: The inclusion of nucleic acid targets in CASP’s model quality assessment category [ 89 ] in the future
        may benefit the community by encouraging more accurate self-assessment.
      failure: 2026-09-28-casp16-na-rna-puzzles-joint-assessment-001
  evaluation_method:
    - value: domain-metric
      source: paper
      quote: (1) US-align [ 34 , 35 ] for TM-score (with sequence correspondence) and TM-align (without sequence
        correspondence); (2) Local-Global Alignment [ 36 ] for GDT_TS
      failure: 2026-09-28-casp16-na-rna-puzzles-joint-assessment-002
    - value: expert-panel-assessment
      source: paper
      quote: Here, we present an assessment of blind predictions across all NA targets of CASP16.
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: 'Server and human groups are differentiated in the amount of time the group had for prediction: 3 days
        for servers, 2 weeks for humans.'
    - value: human-expert
      source: paper
      quote: 'all top-performing groups were human expert predictors: Vfold, GuangzhouRNA-human, and KiharaLab'
      failure: 2026-09-28-casp16-na-rna-puzzles-joint-assessment-003
    - value: human-ai-team
      source: paper
      quote: human groups appear to be increasingly taking advantage of automated approaches, especially the AlphaFold
        3 server, to sample more diverse ensembles of models and then manually curate the best predictions
  data.access:
    - value: fully-open
      source: paper
      quote: 'The predicted models can be found at: https://predictioncenter.org/download_area/CASP16/predictions/RNA/'
      note: Reference structures carry PDB IDs in Table 1. The paper said its repository would be public "upon release
        of all experimental reference structures"; the repository is public now.
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: Every two years, participants are invited to submit models for a set of macromolecules and macromolecular
        complexes
      failure: 2026-09-28-casp16-na-rna-puzzles-joint-assessment-004
  data.data_provenance:
    - value: experimental-measurement
      source: paper
      quote: CASP16 challenged 65 predictors with a total of 42 NA containing targets, provided by 22 experimental
        groups
  data.contamination_risk:
    - value: low
      source: paper
      quote: In CASP16, blind predictions for 42 targets canvassing a full array of nucleic acid functions
      failure: 2026-09-28-casp16-na-rna-puzzles-joint-assessment-005
  data.ceiling_anchor_type:
    - value: experimental-replicate
      source: paper
      quote: we estimated a skyline for NA structure prediction by identifying pairs of RNA structures that have
        been solved by independent groups at around the same time in recent years
      note: 'The paper proposes TM-align 0.8 as the goal: independently solved structures at 2-5 A agree at 0.8
        to 1.0.'
  lifecycle:
    - value: null
      source: casp17
      quote: As before, this category will be in collaboration with RNA Puzzles, and will be co-ordinated with RNA
        Kaggle challenges.
      failure: 2026-09-28-casp16-na-rna-puzzles-joint-assessment-006
  activity:
    - value: closed
      source: casp17
      quote: In the latest CASP round, CASP16 in 2024, over 100 research groups from around the world submitted
        more than 120,000 models on 150+ targets in five broad prediction categories.
      note: The CASP16 round is over; the family continues as CASP17.
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: © 2007-2026, University of California, Davis
      note: The CASP Prediction Center runs the round; the NA assessors are the Stanford-based Das lab with Strasbourg,
        in collaboration with RNA-Puzzles.
  governance.submission_process:
    - value: assessment-committee
      source: home
      quote: As is the practice in CASP, assessment of the results will be made by the independent assessor teams.
  governance.independence_flags:
    - value: no-known-conflict
      source: home
      quote: In accordance with CASP policy, assessors cannot take part in the relevant parts of the experiment
        as predictors.
      note: The AlphaFold 3 baseline "participated blindly". The secondary-structure comparison runs packages including
        EternaFold and RNet as baselines, and one co-author is Eterna-affiliated; whether these are the assessors'
        own tools is not established from the sources, and they are not ranked entrants.
  execution.compute_tier:
    - value: wet-lab
      source: paper
      quote: 42 NA containing targets, provided by 22 experimental groups
      note: The ground truth is new experimental structures; re-scoring the published predictions is CPU-trivial.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: The data that support the findings of this study, Supporting Information tables, and code to replicate
        these results are openly available in a GitHub repository
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: reference-implementation-only
      source: repo
      quote: Scripts, data, and plotting code to support the global evaluation of nucleic-acid structure prediction
        in CASP16
notes: The corpus entry joins two companion Proteins papers; only the CASP16 NA assessment (primary) was read, so
  RNA-Puzzles-specific metrics from the companion paper are not reflected. Hybrid NA-protein and NA-ligand interfaces
  are scored too; no subdomain covers nucleic-acid complexes, so domain.secondary is [] rather than a forced protein-ligand-cofolding.
  The CASP17 page is added as a primary source for the family state (key casp17).

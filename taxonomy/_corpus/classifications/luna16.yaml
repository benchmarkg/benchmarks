# taxonomy/_corpus/classifications/luna16.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: luna16
corpus_item: 31
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  arxiv: https://arxiv.org/pdf/1612.08012
  home: https://luna16.grand-challenge.org/
  description: https://luna16.grand-challenge.org/Description/
  procedure: https://luna16.grand-challenge.org/Procedure/
  data: https://luna16.grand-challenge.org/Data/
  evaluation: https://luna16.grand-challenge.org/Evaluation/
  download: https://luna16.grand-challenge.org/Download/
  results: https://luna16.grand-challenge.org/Results/
facets:
  domain.primary:
    - value: vision/medical-imaging-cv
      source: evaluation
      quote: Analysis is performed using free receiver operating characteristic (FROC) analysis.
      note: The score is detection sensitivity against radiologist marks; no diagnosis or clinical outcome is scored.
      failure: 2026-09-28-luna16-001
  domain.secondary:
    - value: vision/detection
      source: description
      quote: Using raw CT scans, the goal is to identify locations of possible nodules, and to assign a probability
        for being a nodule to each location.
    - value: vision/classification
      source: description
      quote: 'Hence, one could see this as a classification task: nodule or not a nodule.'
      note: The false positive reduction track classifies supplied candidate locations.
  capability:
    - value: perception
      source: arxiv
      quote: meaning that the only input into the system is a CT scan.
  evaluation_method:
    - value: domain-metric
      source: evaluation
      quote: 'The final score is defined as the average sensitivity at 7 predefined false positive rates: 1/8,
        1/4, 1/2, 1, 2, 4, and 8 FPs per scan.'
      note: The Competition Performance Metric (CPM) of FROC analysis, introduced in ANODE09. It averages one metric
        over its own false-positive-rate sweep, so composite is not tagged.
  designed_for_subjects:
    - value: domain-specialist-model
      source: description
      quote: We believe that this challenge is important for a reliable comparison of CAD algorithms and to encourage
        rapid development of new algorithms using state-of-the-art computer vision technology.
      note: Entrants are purpose-built nodule CAD systems, mostly convolutional networks trained on the challenge
        data.
  data.access:
    - value: fully-open
      source: description
      quote: This means that unlike other challenges, images and reference standard are publicly available.
      note: The scans and annotations are downloadable from Zenodo under CC BY 4.0.
  data.refresh:
    - value: versioned-releases
      source: data
      quote: After ISBI 2016, we have decided to release a new set of candidates, candidates_V2.csv, for the false
        positive reduction track.
      note: The 888 scans and the reference standard are fixed. The candidate list is versioned, and the results
        page marks rows that used the first list with an asterisk.
  data.data_provenance:
    - value: real-world-instrument
      source: arxiv
      quote: The LIDC-IDRI database contains a total of 1018 CT scans.
    - value: expert-authored
      source: data
      quote: The reference standard of our challenge consists of all nodules >= 3 mm accepted by at least 3 out
        of 4 radiologists.
      note: The annotations come from the LIDC-IDRI two-phase reading by four experienced thoracic radiologists.
  data.contamination_risk:
    - value: high
      source: arxiv
      quote: The algorithm was further optimized using the same LUNA16 data set.
      note: The evaluation set is the training set by design, guarded only by an instructed 10-fold cross-validation;
        the paper is the contamination evidence.
      failure: 2026-09-28-luna16-002
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: evaluation
      quote: Clearly a perfect system will have a score of 1 and the lowest possible score is 0.
      note: The observer study found CAD marks that expert readers accepted as nodules missed by the original annotation,
        so the reference standard is incomplete and the achievable score is below the bound. No measured ceiling
        is reported.
  lifecycle:
    - value: mature
      source: home
      quote: 'January, 2018: We have decided to stop processing new LUNA16 submissions.'
      note: The data, evaluation script and frozen results remain online ("We are committed to maintain this site
        as a public repository of benchmark results").
  activity:
    - value: closed
      source: home
      quote: This challenge has been closed.
  governance.maintainer_type:
    - value: academic-lab
      source: arxiv
      quote: Diagnostic Image Analysis Group, Radboud University Medical Center, Nijmegen, The Netherlands
      note: Organised with the Polytechnic University of Turin and INFN.
  governance.submission_process:
    - value: publication-gated
      source: home
      quote: 'September, 2017: We have decided to stop processing new LUNA16 submissions without a clear description
        article.'
      failure: 2026-09-28-luna16-003
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: results
      quote: DIAG_CONVNET (arnaud.setio)
      note: Organisers Setio and Jacobs appear on the leaderboards (DIAG_CONVNET, VisiaCTLung (jacobsc)), and the
        organising group's own candidate detectors supply the false positive reduction track.
  execution.compute_tier:
    - value: single-gpu
      source: arxiv
      quote: a NVIDIA TITAN X GPU was used for acceleration.
      note: From the described entrant systems; scoring itself is a CPU script.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: evaluation
      quote: Evaluation script is provided in this link, so that participants can use the same evaluation method
        for the development of the algorithm.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: arxiv
      quote: The evaluation script is publicly available on the LUNA16 website and can thus be viewed and used by
        all participants.
notes: The primary paper's DOI returned only a redirect stub to automated fetch, so the arXiv version of the same
  paper (1612.08012v4) is used as the paper source. The Description, Procedure, Evaluation
  and Download pages of the challenge site were fetched for this record. The leaderboard is frozen at submissions
  dated up to January 2018.

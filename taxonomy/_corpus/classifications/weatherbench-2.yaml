# taxonomy/_corpus/classifications/weatherbench-2.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: weatherbench-2
corpus_item: 54
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2308.15560
  abs: https://arxiv.org/abs/2308.15560
  home: https://sites.research.google/gr/weatherbench/
  repo: https://github.com/google-research/weatherbench2
  submit: https://weatherbench2.readthedocs.io/en/latest/submit.html
  faq: https://sites.research.google/gr/weatherbench/faq/
facets:
  domain.primary:
    - value: earth-climate/weather-forecasting
      source: abs
      quote: WeatherBench 2 is an update to the global, medium-range (1-14 day) weather forecasting benchmark proposed
        by Rasp et al. (2020)
      note: Ground truth is the ERA5 reanalysis (the IFS analysis for operational models), not raw observations; the
        domains.yaml example accepts forecast skill against analysis as this subdomain.
  domain.secondary: []
  capability:
    - value: scientific-prediction
      source: abs
      quote: WeatherBench 2 is an update to the global, medium-range (1-14 day) weather forecasting benchmark proposed
        by Rasp et al. (2020)
      note: Systems forecast the atmospheric state 1-14 days ahead, scored against ERA5 (ADR-0014). The evaluation year
        is past and its truth is published, so this is not probabilistic-forecasting.
    - value: calibration-uncertainty
      source: paper
      quote: A well-calibrated ensemble forecast should have a spread-skill ratio of 1
      note: The probabilistic headline scorecard scores emitted ensembles by CRPS against IFS ENS, and the spread-skill
        ratio scores their dispersion.
  evaluation_method:
    - value: statistical-fit
      source: home
      quote: The scorecards below show the skill (measured by the global root mean squared error) of different physical
        and ML-based methods
      note: ACC and bias are also reported (paper 4.3).
    - value: domain-metric
      source: home
      quote: Precipitation is evaluated using the SEEPS score using ERA5 ground truth for all models.
    - value: uncertainty-calibration-score
      source: home
      quote: The scorecard below shows the skill (measured by the continuous ranked probability score = CRPS) of physical
        and ML-based probabilistic models
      note: 0.9.0 moves CRPS out of domain-metric into this term, and keeps RMSE and ACC in statistical-fit although
        WMO and ECMWF fix their definitions (the term's own weatherbench-2 example).
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: home
      quote: WeatherBench is an open framework for evaluating ML and physics-based weather forecasting models in a like-for-like
        fashion.
      note: The subjects.yaml example agrees ("Evaluates weather emulators against the operational forecast they replace").
    - value: classical-algorithm
      source: home
      quote: IFS HRES ECMWF Physics-based Forecast (deterministic) Operational 0.1°
      note: The IFS HRES and IFS ENS forecasts are scored rows beside the ML models, and ERA5 is the truth; 0.9.0 says a
        baseline that anchors the scorecard is still an entrant (the term's own weatherbench-2 example).
  data.access:
    - value: fully-open
      source: abs
      quote: publicly available training, ground truth and baseline data
  data.refresh:
    - value: versioned-releases
      source: paper
      quote: In its initial version WB2 uses the year 2020.
      note: The site's headline scorecards are now "for the year 2022", with "Scorecards 2020" kept as a separate page,
        so a score is pinned by its evaluation year.
  data.data_provenance:
    - value: simulation-generated
      source: paper
      quote: ERA5 is a model simulation which is closer to the truth for some variables than for others
    - value: real-world-instrument
      source: paper
      quote: 4D-Var data assimilation which uses a wide range of direct and remote sensing observations.
      note: A reanalysis is an observation-constrained model state, which 0.9.0 records as this term beside
        simulation-generated (the term's own weatherbench-2 example; 02 S12.3).
  data.contamination_risk:
    - value: medium
      source: paper
      quote: The ERA5 dataset (Hersbach et al.,, 2020) is used as the ground truth dataset for WB2 and as the training
        dataset for many of the data-driven approaches described above.
      note: The evaluation years are public ERA5. The one evidenced route, WeatherMesh 4 ('Trained on future years'),
        concerns one entrant and belongs on its claims, which 0.9.0 says leaves the benchmark at medium (the term's
        own example).
  data.ceiling_anchor_type:
    - value: operational-system
      source: home
      quote: relative to ECMWF's IFS HRES, one of the world's best operational weather models
      note: IFS HRES is scored like an entrant against ERA5, which it did not produce, and entrants that beat it leave
        it the anchor with headroom unclamped (the term's own weatherbench-2 example).
  lifecycle:
    - value: active
      source: home
      quote: This website contains up-to-date scores of many state-of-the-art global weather models
      note: WeatherBench-X replaces the evaluation code, while the scorecards, ground truth and data guide carry over,
        which 0.9.0's superseded and under-revision exclusions leave active (weatherbench-2 is the near miss on both).
  activity:
    - value: accepting-submissions
      source: home
      quote: Check out this guide for how to participate or submit a GitHub issue.
      note: WeatherBench 2 has never run in rounds, and 0.9.0's leaderboard-live-no-round exclusion sends a continuously
        open leaderboard with no rounds here.
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: 'Stephan Rasp Affiliation: Google Research'
      note: The code sits in the google-research/weatherbench2 repository and the site on sites.research.google, so
        Google holds it. Three of the eighteen authors are at ECMWF, whose IFS forecasts are the main baseline.
  governance.submission_process:
    - value: maintainer-scored-predictions
      source: submit
      quote: We will then evaluate the forecast
      note: The first route, forecasts sent by GitHub issue or directly and scored by the maintainers against public
        ERA5 (the term's own weatherbench-2 example).
    - value: self-reported
      source: submit
      quote: Or you evaluate the forecasts yourself and share your evaluation code and results with us. Then we will update
        the results on the website.
      note: The second route. The guide states no check of the shared results, and 0.9.0's maintainer-verified needs a
        stated review.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: home
      quote: GraphCast Google DeepMind ML-based Forecast (deterministic) ERA5 0.25°
      note: The maintainer is Google Research; GraphCast, GenCast and FGN (Google DeepMind) and NeuralGCM and SphericalCNN
        (Google Research) are ranked on the scorecards.
  execution.compute_tier:
    - value: single-gpu
      source: faq
      quote: Creating a single 10-day forecast takes less than a minute on a single TPU.
      note: Under 0.9.0's precedence rule training is excluded and a leaderboard of locally run systems takes the
        maintainer's reference run, which is inference on one accelerator (Table 1, GraphCast and NeuralGCM on a
        single TPU, Pangu-Weather on a single GPU). Evaluation runs on CPU with Xarray-Beam, optionally on DataFlow;
        the IFS rows need ECMWF's operational system and are the incumbent, not a new entrant.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: All data and code needed for evaluation are publicly available
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: Open-source evaluation code.
      note: The README now recommends the successor code base, WeatherBench-X, for evaluation.
notes: Classified as the corpus defines it, WeatherBench 2 at sites.research.google/gr/weatherbench. The evaluation
  code has moved to WeatherBench-X (corpus flag), which 0.9.0's lifecycle tests read as a code-base successor
  that leaves the benchmark active. The FAQ and the
  submission guide were fetched in addition to the paper, abstract, site and README.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, evaluation_method, designed_for_subjects, data.data_provenance, data.contamination_risk, data.ceiling_anchor_type, lifecycle, activity, governance.submission_process, execution.compute_tier]
    note: Re-adjudicated against 0.9.0; scientific-prediction, maintainer-scored-predictions and the revised method,
          subject, provenance, contamination, ceiling, lifecycle and compute tests settle all nine Stage 3 failures,
          and activity moves to accepting-submissions because the leaderboard has never run in rounds.

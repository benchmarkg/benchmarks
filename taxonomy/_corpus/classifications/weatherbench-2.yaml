# taxonomy/_corpus/classifications/weatherbench-2.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: weatherbench-2
corpus_item: 54
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2308.15560
  abs: https://arxiv.org/abs/2308.15560
  home: https://sites.research.google/gr/weatherbench/
  repo: https://github.com/google-research/weatherbench2
  submit: https://weatherbench2.readthedocs.io/en/latest/submit.html
  faq: https://sites.research.google/gr/weatherbench/faq/
facets:
  domain.primary:
    - value: earth-climate/weather-forecasting
      source: abs
      quote: WeatherBench 2 is an update to the global, medium-range (1-14 day) weather forecasting benchmark proposed
        by Rasp et al. (2020)
      note: Ground truth is the ERA5 reanalysis (the IFS analysis for operational models), not raw observations; the
        domains.yaml example accepts forecast skill against analysis as this subdomain.
  domain.secondary: []
  capability:
    - value: calibration-uncertainty
      source: paper
      quote: A well-calibrated ensemble forecast should have a spread-skill ratio of 1
      note: The probabilistic headline scorecard scores emitted ensembles by CRPS against IFS ENS, and the spread-skill
        ratio scores their dispersion.
      failure: 2026-09-28-weatherbench-2-001
  evaluation_method:
    - value: statistical-fit
      source: home
      quote: The scorecards below show the skill (measured by the global root mean squared error) of different physical
        and ML-based methods
      note: ACC and bias are also reported (paper 4.3).
    - value: domain-metric
      source: home
      quote: Precipitation is evaluated using the SEEPS score using ERA5 ground truth for all models.
    - value: uncertainty-calibration-score
      source: home
      quote: The scorecard below shows the skill (measured by the continuous ranked probability score = CRPS) of physical
        and ML-based probabilistic models
      failure: 2026-09-28-weatherbench-2-002
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: home
      quote: WeatherBench is an open framework for evaluating ML and physics-based weather forecasting models in a like-for-like
        fashion.
      note: The subjects.yaml example agrees ("Evaluates weather emulators against the operational forecast they replace").
      failure: 2026-09-28-weatherbench-2-003
  data.access:
    - value: fully-open
      source: abs
      quote: publicly available training, ground truth and baseline data
  data.refresh:
    - value: versioned-releases
      source: paper
      quote: In its initial version WB2 uses the year 2020.
      note: The site's headline scorecards are now "for the year 2022", with "Scorecards 2020" kept as a separate page,
        so a score is pinned by its evaluation year.
  data.data_provenance:
    - value: simulation-generated
      source: paper
      quote: ERA5 is a model simulation which is closer to the truth for some variables than for others
      failure: 2026-09-28-weatherbench-2-004
  data.contamination_risk:
    - value: medium
      source: paper
      quote: The ERA5 dataset (Hersbach et al.,, 2020) is used as the ground truth dataset for WB2 and as the training
        dataset for many of the data-driven approaches described above.
      failure: 2026-09-28-weatherbench-2-005
  data.ceiling_anchor_type:
    - value: operational-system
      source: home
      quote: relative to ECMWF's IFS HRES, one of the world's best operational weather models
      failure: 2026-09-28-weatherbench-2-006
  lifecycle:
    - value: active
      source: home
      quote: This website contains up-to-date scores of many state-of-the-art global weather models
      failure: 2026-09-28-weatherbench-2-007
  activity:
    - value: leaderboard-live-no-round
      source: home
      quote: Check out this guide for how to participate or submit a GitHub issue.
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: 'Stephan Rasp Affiliation: Google Research'
      note: Three of the eighteen authors are at ECMWF, whose IFS forecasts are the main baseline.
  governance.submission_process:
    - value: maintainer-verified
      source: submit
      quote: Or you evaluate the forecasts yourself and share your evaluation code and results with us. Then we will update
        the results on the website.
      failure: 2026-09-28-weatherbench-2-008
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: home
      quote: GraphCast Google DeepMind ML-based Forecast (deterministic) ERA5 0.25°
      note: The maintainer is Google Research; GraphCast, GenCast and FGN (Google DeepMind) and NeuralGCM and SphericalCNN
        (Google Research) are ranked on the scorecards.
  execution.compute_tier:
    - value: null
      source: repo
      quote: Since high-resolution forecast files can be large, the WeatherBench 2 code was written with scalability in
        mind.
      failure: 2026-09-28-weatherbench-2-009
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: All data and code needed for evaluation are publicly available
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: Open-source evaluation code.
      note: The README now recommends the successor code base, WeatherBench-X, for evaluation.
notes: Classified as the corpus defines it, WeatherBench 2 at sites.research.google/gr/weatherbench. The evaluation
  code has moved to WeatherBench-X (corpus flag), which is covered by the lifecycle failure (007). The FAQ and the
  submission guide were fetched in addition to the paper, abstract, site and README.

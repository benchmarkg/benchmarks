# taxonomy/_corpus/classifications/simulacrabench.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: simulacrabench
corpus_item: 86
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  home: https://simulacrabench.org/
  kit: https://github.com/SituatedEvals/public
facets:
  domain.primary:
    - value: society-econ-law/social-simulation
      source: home
      quote: SimulacraBench is a NeurIPS competition to validate AI representations of hard-to-reach populations, evaluated
        on unreleased UNHCR, UNICEF, and World Bank microdata.
      note: The motivation is "using LLMs as simulacra of specific populations to pre-test instruments, impute non-response,
        and run subgroup what-ifs". The scored task is probabilistic completion of a respondent-by-question survey grid.
  domain.secondary: []
  capability:
    - value: calibration-uncertainty
      source: home
      quote: Calibration-first, log-score evaluation.
      note: The system emits a distribution over each item's options, and the grader scores it with a proper log score.
      failure: 2026-09-28-simulacrabench-001
  evaluation_method:
    - value: uncertainty-calibration-score
      source: kit
      quote: The metric is a strictly proper scoring rule, so your best expected score comes from reporting what you
        actually believe.
      note: The skill is 1 plus the mean log score divided by the uniform reference U, and the grand-prize number is
        the flat mean of three instrument skills. Development-phase scores come back Laplace-noised and rounded to 0.01.
  designed_for_subjects:
    - value: classical-algorithm
      source: home
      quote: The trivial one predicts each item's smoothed crowd shares and ignores everything about the individual respondent;
        it is what you have to beat.
      note: The crowd-marginal baseline; 0.9.0's classical-algorithm admits baselines as entrants.
    - value: task-specific-supervised-model
      source: kit
      quote: Fit statistical or psychometric models (IRT, low-rank completion, tabular generative models) on the schema
        and your own practice data
      note: ADR-0020 rules that fitted statistical predictors are this term. That API-served models are excluded ('the
        run has the data but no network') is an EvalConditions fact, not a subject.
  data.access:
    - value: private-test-server
      source: home
      quote: Evaluation is closed. Code travels to the data; only aggregate scores travel back.
  data.refresh:
    - value: static
      source: kit
      quote: assigned once when the dataset is built and never redrawn
      note: The respondent roles (TRAIN, DEV, TEST) are fixed for this edition, and the development and final phases
        score disjoint respondents from one fixed set. No source mentions a later edition.
  data.data_provenance:
    - value: unreleasable-confidential
      source: home
      quote: The microdata are never released to participants.
      note: Real respondents' answers to three behavioural surveys (UNHCR ERPIS, UNICEF Faith & Immunisation, World
        Bank Skills Assessment). ADR-0020 rules that this term plus a note expresses survey microdata, and the obligations
        to respondents are a governance matter.
  data.contamination_risk:
    - value: low
      source: home
      quote: Three unpublished datasets from UNHCR, UNICEF, and World Bank programs, not in any pretraining corpus.
      note: Execution is network-isolated and the answer key never enters the container. The rules forbid using repeated
        development-phase feedback to infer hidden labels, and the phase-1 scores are noised.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: home
      quote: normalised so a uniform guess scores 0 and perfection scores 1
      note: Perfect prediction of individual survey answers is not attainable, and no noise ceiling (for example test-retest
        agreement) is reported.
  lifecycle:
    - value: active
      source: home
      quote: the development phase is running through October 30, 2026
      note: The page still also carries launch-era text ("register your interest to be notified when the leaderboard
        goes live"), and the corpus flagged the leaderboard as not yet live on 2026-09-23. The Codabench page returned
        only a shell, so no posted score was seen.
  activity:
    - value: accepting-submissions
      source: home
      quote: 1 leaderboard submission per team per day, with no cap over the phase
      note: A final phase (Nov 1 – Nov 14, 2026) with one exact-scored submission per team follows.
  governance.maintainer_type:
    - value: academic-lab
      source: home
      quote: Organized from the Stanford Digital Economy Lab at Stanford HAI, with the UN Innovation Network, and with
        UNHCR, UNICEF and the World Bank as data partners.
      note: Under 0.9.0's holder rule the Stanford lab hosts the competition and its harness, and the UN agencies are
        data partners (simulacrabench is academic-lab's example, and the near miss on government-agency and
        conference-workshop).
  governance.submission_process:
    - value: sandboxed-rerun
      source: kit
      quote: You upload a `.zip`; the platform runs your code against the phase's hidden slice and writes the predictions
        on your behalf.
      note: The submission is a zip holding main.py and requirements.txt, not a container image, and 0.9.0's tie-break
        in sandboxed-rerun's exclusion gives any code the maintainer executes other than a container image this term.
        Winners must also supply "a 4-page method description and source code". This condition applies to prizes,
        not to ranking, so publication-gated is not tagged.
  governance.independence_flags:
    - value: no-known-conflict
      source: home
      quote: With thanks to Schmidt Sciences for prize sponsorship.
      note: Searched the organiser page and the starter kit. The prize sponsor is a philanthropic science organisation,
        and the compute sponsor (linked to modal.com) is a cloud provider. Neither is an evaluated party. The organisers
        submit only the two published baselines.
  execution.compute_tier:
    - value: provided-allocation
      source: home
      quote: Single H100 GPU, 16 GB. The compute budget is shared across all three instruments
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: home
      quote: Microdata are not released.
      note: The grader and sandbox generator are public, but a score exists only on the custodians' data inside the
        organisers' runtime.
  execution.reproducibility_blockers:
    - value: unreleasable-data
      source: home
      quote: Attempting to access, reconstruct, or re-identify the underlying records — successfully or not — is grounds
        for disqualification
    - value: private-test-set
      source: kit
      quote: The answer key is not among them and never enters the container.
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: the grader itself, so you can run a submission locally exactly as it will be run.
notes: The corpus lists no paper, and the organiser page and the MIT-licensed starter kit are the primary sources. The
  Codabench competition page returned only its shell (344 characters) and is not used. The 'primary' and 'home' keys
  in src/index.json are the same URL, and the record uses 'home'.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [designed_for_subjects, data.data_provenance, governance.maintainer_type,
      governance.submission_process]
    note: Re-adjudicated against 0.9.0; the fitted predictors take the new subject term, and the code upload is sandboxed-rerun.

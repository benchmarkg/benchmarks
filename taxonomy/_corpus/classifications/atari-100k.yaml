# taxonomy/_corpus/classifications/atari-100k.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: atari-100k
corpus_item: 75
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/1903.00374
  abs: https://arxiv.org/abs/1903.00374
  t2t: https://github.com/tensorflow/tensor2tensor
  t2trl: https://raw.githubusercontent.com/tensorflow/tensor2tensor/master/tensor2tensor/rl/README.md
  t2tcommits: https://api.github.com/repos/tensorflow/tensor2tensor/commits
facets:
  domain.primary:
    - value: games-planning/video-games
      source: abs
      quote: Model-free reinforcement learning (RL) can be used to learn effective policies for complex tasks, such
        as Atari games, even from image observations.
  domain.secondary: []
  capability:
    - value: sample-efficiency
      source: abs
      quote: Our experiments evaluate SimPLe on a range of Atari games in low data regime of 100k interactions between
        the agent and the environment, which corresponds to two hours of real-time play.
  evaluation_method:
    - value: episodic-return
      source: paper
      quote: Mean scores and standard deviations over five training runs.
      failure: 2026-09-28-atari-100k-001
  designed_for_subjects:
    - value: rl-policy
      source: paper
      quote: In this work, we aim to learn Atari games with a budget of just 100K agent steps (400K frames), corresponding
        to about two hours of play time.
  data.access:
    - value: fully-open
      source: t2trl
      quote: You also need to install the Atari dependencies for OpenAI Gym
      note: There is no dataset; the evaluation environment is the public Arcade Learning Environment installed
        through Gym. The sources say nothing about the licence of the game ROMs.
  data.refresh:
    - value: static
      source: paper
      quote: We evaluate our method on 2626 games selected on the basis of being solvable with existing state-of-the-art
        model-free deep RL algorithms
      note: '"2626" is the HTML rendering of 26. The protocol is the fixed 26-game set at 100K interactions.'
  data.data_provenance:
    - value: simulation-generated
      source: paper
      quote: Atari games gained prominence as a benchmark for reinforcement learning with the introduction of the
        Arcade Learning Environment (ALE) Bellemare et al. (2015).
  data.contamination_risk:
    - value: unknown
      note: No source assesses contamination. Agents are trained from scratch on the same 26 environments they
        are scored on, by design, so the notion reduces to tuning on the test games, which nobody has assessed
        in the originating sources.
  data.ceiling_anchor_type:
    - value: null
      source: paper
      quote: Human scores are "Avg. Human" from Table 3 in Pohlen et al. (2018).
      failure: 2026-09-28-atari-100k-002
  lifecycle:
    - value: dormant
      source: t2tcommits
      quote: 2023-04-01T10:19:28Z Internal change
      note: The originating code lives in Tensor2Tensor, which is archived and "now deprecated".
      failure: 2026-09-28-atari-100k-003
  activity:
    - value: null
      failure: 2026-09-28-atari-100k-004
  governance.maintainer_type:
    - value: null
      source: paper
      quote: 'Łukasz Kaiser Affiliation: Google Brain'
      failure: 2026-09-28-atari-100k-005
  governance.submission_process:
    - value: null
      failure: 2026-09-28-atari-100k-006
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: abs
      quote: In most games SimPLe outperforms state-of-the-art model-free algorithms, in some games by over an order
        of magnitude.
      note: The paper that defines the 100K regime also introduces and ranks its own method, and tuned its baseline
        ("we therefore optimized Rainbow") for the comparison.
  execution.compute_tier:
    - value: simulator-required
      source: t2trl
      quote: pip install gym[atari]
  execution.reproducibility_tier:
    - value: automatable-with-simulator
      source: t2trl
      quote: You should be able to reproduce the [Model-Based Reinforcement Learning for Atari](https://arxiv.org/abs/1903.00374)
        results.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: reference-implementation-only
      source: paper
      quote: The source code is available as part of the Tensor2Tensor library and it includes instructions on
        how to run the experiments
notes: 'Atari-100k is an evaluation protocol (a 100K-interaction budget on 26 ALE games) that the SimPLe paper introduced
  and later work adopted; there is no site, leaderboard or maintainer. The record classifies the protocol as the
  originating paper and its code define it. The abs text is also recorded under the corpus url as home, and is cited
  as abs. Later conventions of the family (human-normalised mean and median scores, sticky actions, interquartile
  means) are not in the originating sources, which is failure 001.'

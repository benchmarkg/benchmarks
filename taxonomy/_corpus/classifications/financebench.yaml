# taxonomy/_corpus/classifications/financebench.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: financebench
corpus_item: 85
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2311.11944
  abs: https://arxiv.org/abs/2311.11944
  home: https://github.com/patronus-ai/financebench
  hf: https://huggingface.co/datasets/PatronusAI/financebench
  site: https://www.patronus.ai/
facets:
  domain.primary:
    - value: society-econ-law/financial-analysis
      source: paper
      quote: FinanceBench is a first-of-its-kind test suite for evaluating the performance of LLMs on open book financial
        question answering (QA).
  domain.secondary:
    - value: language/retrieval-qa
      source: paper
      quote: it is critical that LLMs are tested for financial QA with an open-book setup, which involves a clear retrieval
        component
      note: ADR-0020 places FinanceBench's retrieval claim in this domain leaf and in the subject retrieval-augmented-system,
        rather than in a capability.
  capability:
    - value: context-integration
      source: home
      quote: The relevant financial source documents (PDFS) are located in `/pdfs/`
      note: The answer to every question is in a supplied public filing, and each item carries its evidence string
        and page number. The retrieval claim is carried by domain.secondary and the subject term, and the unnamed
        'logical reasoning' type (6% of labelled questions) by the notes, as ADR-0020 rules.
    - value: quantitative-reasoning
      source: paper
      quote: Numerical reasoning refers to performing mathematical calculations or comparing numerical data.
      note: 66% of the taxonomy-labelled questions involve numerical reasoning, and metrics-generated answers are
        computed figures.
  evaluation_method:
    - value: human-expert-eval
      source: paper
      quote: experts manually checked the answers from each of the 16 model configurations
      note: 'Each answer was labelled correct, incorrect or failure to answer: "Each of the models’ responses to the
        150 questions have been labelled by one of the research team." This term records the human grader, and
        numeric-tolerance-match the answer criterion.'
    - value: numeric-tolerance-match
      source: paper
      quote: we allow minor deviations, such as giving the answer in billions when the unit was given in the question
        as millions. We also allow very small rounding errors.
      note: Answers are matched by hand against a short gold answer within a unit and rounding tolerance (financebench
        is the term's example).
  designed_for_subjects:
    - value: retrieval-augmented-system
      source: paper
      quote: We construct a more realistic setting by creating a shared vector store for all documents.
      note: The paper argues that retrieval belongs inside what is scored ("an open-book setup, which involves a clear
        retrieval component").
    - value: instruction-tuned-model
      source: paper
      quote: Each prompt is fed to the model without any additional information or context.
      note: The closed-book, long-context and oracle configurations prompt a chat model directly.
  data.access:
    - value: fully-open
      source: home
      quote: This repository contains an open source sample of 150 annotated examples used in the evaluation and analysis
        of models assessed in the FinanceBench paper.
      note: The sample is licensed CC BY-NC 4.0 (Hugging Face card). The other 10,081 questions are held by Patronus.
        The paper's results are computed on the 150-case sample, and 0.9.0's fully-open test counts a public sample
        when the headline is computed on it.
  data.refresh:
    - value: null
      source: paper
      quote: Future work will expand the scope and coverage of FinanceBench and address the limitations identified in
        this paper.
      failure: 2026-09-28-financebench-004
  data.data_provenance:
    - value: expert-authored
      source: paper
      quote: To join the project, annotators needed to have relevant experience and education in finance, complete
        a short screening test, and discuss the project with the authors.
      note: Covers the domain-relevant and novel-generated questions (2,248 of 10,231, and 100 of the 150 open cases).
    - value: synthetic-procedural
      source: paper
      quote: We then constructed questions and answers from both the base and the derivative metrics, using templates
        that were specific to each combination of metric, company, fiscal year, and financial statement(s).
      note: The metrics-generated questions (7,983 of 10,231; 50 of the 150 open cases). The base metrics were extracted
        by hand.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: It is unclear how much financial information and statistics appear in the pre-training data of models.
      note: The filings are public web documents, and the 150-case sample has been public since 2023. No contamination
        is evidenced.
  data.ceiling_anchor_type:
    - value: none-known
      note: Gold answers were written by finance annotators, and no source measures human performance on the task.
        The best configuration reported is a model ("GPT-4-Turbo Oracle", 85%).
  lifecycle:
    - value: null
      failure: 2026-09-28-financebench-005
  activity:
    - value: no-submission-channel
      source: home
      quote: To evaluate your models on the full `FinanceBench` dataset, or if you have questions about this work, you
        can email us at
      note: There is no leaderboard, and an on-request evaluation that publishes nothing is not a channel under 0.9.0's
        test (financebench is named in it).
  governance.maintainer_type:
    - value: industry-lab
      source: site
      quote: Patronus AI develops simulation research and infrastructure to accelerate progress toward human-aligned
        AGI
  governance.submission_process:
    - value: literature-only
      source: paper
      quote: experts manually checked the answers from each of the 16 model configurations
      note: The only published results are the release paper's 16 configurations, and no ranking is kept. The private
        on-request evaluation of the full set publishes nothing, so it is no results process.
  governance.independence_flags:
    - value: evaluator-sells-evaluations
      source: site
      quote: Evaluation model that produces high-quality reasoning chains and highlights
      note: 'The quote describes GLIDER, one of Patronus''s commercial evaluation models ("Cost-effective for companies
        requiring efficient, fast, and reliable guardrails"). The site lists products (Core Platform, Percival) and
        pricing. The FinanceBench README routes full-set evaluation through the company.'
    - value: single-evaluator-private-test-set
      source: home
      quote: To evaluate your models on the full `FinanceBench` dataset, or if you have questions about this work, you
        can email us at
      note: The full 10,231-question set is held and evaluated only by Patronus, and anyone can evaluate on the 150-case
        sample.
  execution.compute_tier:
    - value: human-panel
      source: paper
      quote: Each of the models’ responses to the 150 questions have been labelled by one of the research team.
      note: Sampling adds API spend (GPT-4, GPT-4-Turbo, Claude 2), or a GPU for Llama 2. No automatic scorer is published,
        so every run needs a human grader.
  execution.reproducibility_tier:
    - value: requires-human-raters
      source: abs
      quote: and manually review their answers (n=2,400)
  execution.reproducibility_blockers:
    - value: human-raters
      source: paper
      quote: Complex cases were raised for discussion, and samples from every models’ responses were spot-checked.
    - value: no-reference-implementation
      source: home
      quote: In addition, we provide the human-annotated model completions of the evaluated model configurations in
        the paper of the open-source dataset in `/results/`
      note: The repository ships data, filings and labelled completions, and no code. The retrieval setups (LangChain,
        Chroma, text-embedding-ada-002) are described only in prose.
  execution.harness_availability:
    - value: none
      source: home
      quote: 'The provided open-source dataset (n=150) consists of two JSONL files (located in `/data/`):'
      note: No evaluation or scoring code is published in the repository or on the dataset card.
notes: The corpus flags hold. Only the 150-case sample is public, and no maintainer source shows a leaderboard. Patronus
  AI's current home page describes the company as "a frontier lab training the first Digital World Models" and features
  FinanceBench as research. The evaluation business is shown by its product and pricing pages and by the README's
  offer to evaluate on the full set.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.secondary, capability, evaluation_method, data.access, activity,
      governance.submission_process]
    note: Re-adjudicated against 0.9.0; tolerance matching, the retrieval domain leaf and the no-channel terms apply.

# taxonomy/_corpus/classifications/virtual-cell-challenge-2026.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: virtual-cell-challenge-2026
corpus_item: 23
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  news: https://arcinstitute.org/news/virtual-cell-challenge-2026
  abstract: https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&resultType=core&query=DOI:10.1016/j.cell.2026.08.004
  celleval: https://github.com/ArcInstitute/cell-eval
  arc: https://arcinstitute.org/about
facets:
  domain.primary:
    - value: biology-genetics/perturbation-response-prediction
      source: news
      quote: Models must predict CRISPRi knockdown responses in six cell lines they have never seen perturbed, using
        only the unperturbed state of those cells and a list of genes to knock down.
  domain.secondary: []
  capability:
    - value: causal-reasoning
      source: news
      quote: Each model must predict the post-perturbation expression profiles that would be measured after CRISPRi
        knockdown followed by 10x Flex profiling.
      note: An unobserved intervention (a knockdown) in a context never seen perturbed; the capabilities.yaml example
        agrees.
      failure: 2026-09-28-virtual-cell-challenge-2026-001
  evaluation_method:
    - value: composite
      source: news
      quote: final rankings use an aggregate across a broader panel of six metrics
      failure: 2026-09-28-virtual-cell-challenge-2026-002
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: news
      quote: If the field can learn to move that single assay in silico, reliably and across contexts, it fundamentally
        changes the scale at which we can reason in biology
      failure: 2026-09-28-virtual-cell-challenge-2026-003
  data.access:
    - value: private-test-server
      source: news
      quote: Arc’s experimental measurements themselves are withheld and serve as ground truth.
      note: The 2025 edition's held-out data was released after that challenge; the 2026 ground truth is withheld
        for now.
  data.refresh:
    - value: periodic-recompetition
      source: news
      quote: 'This year the task is zero-shot: we are not releasing a training set, and the evaluation dataset is
        far more expansive than last year’s challenge.'
  data.data_provenance:
    - value: experimental-measurement
      source: news
      quote: At Arc we ran Perturb-seq across six cell lines from different tissues of origin
  data.contamination_risk:
    - value: low
      source: abstract
      quote: Participants will build models to predict gene knockdown responses in a new Arc-generated dataset comprising
        unseen cell lines.
      note: The measurements are new and withheld. Entrants may "train their models on any data", and the cell lines
        are not named in the fetched sources, so public screens of the same lines are not ruled out; that would
        be a near duplicate, not the evaluation content.
  data.ceiling_anchor_type:
    - value: noise-ceiling
      source: celleval
      quote: The result is, per metric, an unbiased upper bound on how well any model could score on this dataset.
      note: cell-eval's --ceiling computes a split-half, Spearman-Brown-corrected data ceiling. The announcement
        does not say the 2026 ranking reports it.
  lifecycle:
    - value: active
      source: news
      quote: Validation data live, leaderboard active, submissions open.
  activity:
    - value: accepting-submissions
      source: news
      quote: Registration for the 2026 Virtual Cell Challenge is open at virtualcellchallenge.org.
      note: Final submissions are due November 5, 2026; winners are announced mid to late November.
  governance.maintainer_type:
    - value: nonprofit
      source: arc
      quote: Arc Institute is an independent nonprofit research organization based in Palo Alto, California
  governance.submission_process:
    - value: held-out-server
      source: news
      quote: The live leaderboard runs on the validation dataset and uses a suite of metrics.
  governance.independence_flags:
    - value: prize-sponsored-by-industry
      source: news
      quote: The grand prize is $100,000, and the Challenge is again sponsored by NVIDIA, 10x Genomics, and Ultima
        Genomics.
      failure: 2026-09-28-virtual-cell-challenge-2026-004
  execution.compute_tier:
    - value: wet-lab
      source: news
      quote: At Arc we ran Perturb-seq across six cell lines from different tissues of origin
      note: The ground truth is new Perturb-seq data generated for this edition; the entrant-side cost is unstated,
        and prizes include NVIDIA Brev credits.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: news
      quote: The remaining three are held back for final testing and determining our winners.
      note: While the challenge runs. The 2025 test data was released afterwards, which would make the tier fully-automatable.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: news
      quote: Arc’s experimental measurements themselves are withheld and serve as ground truth.
  execution.harness_availability:
    - value: official-harness
      source: news
      quote: This year, we are running a new version of our scoring tool cell-eval, in collaboration with NVIDIA.
      note: cell-eval is open source and has a "prep (VCC)" command.
notes: virtualcellchallenge.org is a JS app and the Cell paper is paywalled, as the corpus flags. The record rests
  on Arc's announcement page, the Europe PMC abstract, the cell-eval README (the named scoring tool) and Arc's about
  page (maintainer type). The Europe PMC record also carries an e-mail address, which is not quoted.

# taxonomy/_corpus/classifications/humanity-s-last-exam.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: humanity-s-last-exam
corpus_item: 87
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2501.14249
  abs: https://arxiv.org/abs/2501.14249
  home: https://lastexam.ai/
  repo: https://github.com/centerforaisafety/hle
  diamond: https://lastexam.ai/blog/hle-diamond
  rolling: https://raw.githubusercontent.com/centerforaisafety/hle/main/hle-rolling-changes.txt
  hf: https://huggingface.co/datasets/cais/hle
  scale: https://scale.com/leaderboard/humanitys_last_exam
  cais: https://safe.ai/about
  scaleeval: https://scale.com/evaluation/model-developers
facets:
  domain.primary:
    - value: general-intelligence/multi-subject-knowledge-exams
      source: home
      quote: The dataset consists of 2,500 challenging questions across over a hundred subjects.
      note: The claim is breadth ('the final closed-ended academic benchmark of its kind with broad subject coverage'),
        the items are closed-ended, no single subject holds most of them, and no human solve rate is measured
        (ADR-0015; humanity-s-last-exam is the term's example).
  domain.secondary:
    - value: multimodal/visual-qa
      source: paper
      quote: HLE is a multi-modal benchmark, with around 14% of questions requiring comprehending both text and an
        image.
  capability:
    - value: knowledge-recall
      source: diamond
      quote: HLE-Diamond questions are designed to be answerable in a closed-book setting, testing both reasoning and
        expert knowledge.
      note: The main protocol is closed-book, and questions were screened to be "resistant to simple internet lookup
        or database retrieval". The reasoning half of HLE's claim ('depth of reasoning') names no reasoning form, and
        ADR-0020 rejects a general reasoning term, so it is recorded here and not tagged.
    - value: calibration-uncertainty
      source: home
      quote: To measure calibration, we prompt models to provide both an answer and their confidence from 0% to 100%.
  evaluation_method:
    - value: model-graded-judge
      source: paper
      quote: we use o3-mini as a judge to verify answer correctness against model predictions
      note: The judge is o3-mini-2025-01-31 with structured decoding, and it grades both the exact-match and the
        multiple-choice items. The paper's "exact-match questions" are therefore not exact-match in the taxonomy's
        sense, because a model decides equivalence.
    - value: uncertainty-calibration-score
      source: scale
      quote: use the model’s own stated confidence to derive an RMS calibration error
  designed_for_subjects:
    - value: instruction-tuned-model
      source: paper
      quote: We employ a standardized system prompt that structures model responses into explicit reasoning followed
        by a final answer.
    - value: reasoning-model
      source: diamond
      quote: All models are evaluated with reasoning high.
      note: The README also warns against short budgets ("We do not recommend setting max completion tokens below
        `8192` for reasoning models").
  data.access:
    - value: gated-registration
      source: hf
      quote: You need to agree to share your contact information to access this dataset
      note: A private held-out set also exists, but it is used only to check overfitting, and no scores on it are
        published ("we do not report any model performance metrics on the private held-out set").
  data.refresh:
    - value: versioned-releases
      source: home
      quote: '[04/03/2025]: HLE has been finalized with 2,500 questions.'
      note: The entry is the finalised 2,500-question set, which is pinned. Under 0.9.0 HLE-Rolling, replaced continuously,
        is a separate variant and not a layer of this entry (humanity-s-last-exam is rolling-live's near miss).
  data.data_provenance:
    - value: expert-authored
      source: home
      quote: questions from nearly 1,000 subject expert contributors affiliated with over 500 institutions across 50
        countries
      note: Each submitted question had to make frontier LLMs fail before it went to expert review, so the set is
        adversarially filtered against the models of late 2024.
  data.contamination_risk:
    - value: medium
      source: home
      quote: We publicly release these questions, while maintaining a private test set of held out questions to
        assess model overfitting.
      note: The public set is gated and carries a canary string. The Hugging Face page lists 11 uploader models
        declared as "trained or fine-tuned on cais/hle". Those are not evaluated frontier models, so they show a
        route rather than contamination of any published score.
  data.ceiling_anchor_type:
    - value: none-known
      note: No human performance on HLE is reported. Experts wrote each question with a solution and reviewed it, but
        no expert or crowd solve rate is measured.
  lifecycle:
    - value: active
      source: diamond
      quote: We compare the performance of current models on HLE-Diamond without tools.
      note: Scale's HLE leaderboard also lists 2026 frontier models on the finalized 2,500-question set. HLE-Rolling
        and HLE-Diamond are new variants beside a finalised set that is not itself being edited, which 0.9.0's
        under-revision excludes (humanity-s-last-exam is its near miss).
  activity:
    - value: no-submission-channel
      source: scale
      quote: Each model on the leaderboard is evaluated on all public questions of Humanity’s Last Exam with
        temperature 0.0 when configurable or stated otherwise.
      note: A maintainer-run leaderboard that nobody else can enter; the lastexam.ai submission links are for contributing
        questions. 0.9.0 merges maintainer-run-ongoing into no-submission-channel, and that results are still produced
        is carried by lifecycle active and submission_process maintainer-run.
  governance.maintainer_type:
    - value: nonprofit
      source: cais
      quote: CAIS is an AI safety non-profit.
      note: Under 0.9.0's holder rule CAIS hosts the dataset (cais/hle), the repository and HLE-Rolling, and Scale's
        leaderboard is a partner's results page (humanity-s-last-exam is nonprofit's example).
  governance.submission_process:
    - value: maintainer-run
      source: scale
      quote: Each model on the leaderboard is evaluated on all public questions of Humanity’s Last Exam with
        temperature 0.0 when configurable or stated otherwise.
      note: Scale selects the models, runs them, grades them with an o3-mini judge and ranks them; nobody submits. The
        private held-out set is not a held-out server, because no score on it is published.
  governance.independence_flags:
    - value: evaluator-sells-evaluations
      source: scaleeval
      quote: Trusted LLM capability and safety evaluations.
      note: Scale AI, co-maintainer, produces the HLE leaderboard results and sells capability evaluations to model
        developers. No funding statement for HLE itself was found in the paper, site or leaderboard.
    - value: grader-from-evaluated-party
      source: paper
      quote: we use o3-mini as a judge to verify answer correctness against model predictions
      note: The judge in the official scoring path is an OpenAI model, and OpenAI's models are ranked on the same board.
  execution.compute_tier:
    - value: api-credits-only
      source: repo
      quote: We provide a simple evaluation, using the `openai-python` interface.
      note: Every run also pays for the o3-mini judge, so API spend is incurred even when the evaluated model runs
        locally.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: scale
      quote: Evaluation is automatic.
  execution.reproducibility_blockers:
    - value: null
      failure: 2026-09-28-humanity-s-last-exam-008
  execution.harness_availability:
    - value: official-harness
      source: repo
      quote: We provide a simple evaluation, using the `openai-python` interface.
      note: hle_eval runs predictions and then the judge, and prints the accuracy and calibration error that the
        leaderboard reports.
notes: The entry is the 2,500-question HLE. HLE-Rolling (a dynamic fork since 2025-10-08) and HLE-Diamond (a 1,000-question
  refined subset, released 2026-09-22) are in the same family under 02 S11 rule 5, and they give different scores for the
  same model. Under 0.9.0 they are separate variants, and the entry keeps the finalised set's own refresh and
  lifecycle. HLE-Diamond also publishes a with-tools (web+code) setting, whose loop is not described, so no tool
  subject is tagged. The primary domain is multi-subject-knowledge-exams (ADR-0015), because HLE claims breadth and
  reports no human performance. The older taxonomy examples still cite this benchmark as `humanitys-last-exam`; the
  0.9.0 additions use the corpus id.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, data.refresh, lifecycle, activity, governance.maintainer_type,
      governance.submission_process, governance.independence_flags]
    note: Re-adjudicated against 0.9.0; ADR-0015 gives the primary, and the maintainer-run terms fill the no-channel fields.

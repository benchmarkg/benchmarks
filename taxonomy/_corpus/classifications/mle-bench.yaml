# taxonomy/_corpus/classifications/mle-bench.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: mle-bench
corpus_item: 43
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2410.07095
  abs: https://arxiv.org/abs/2410.07095
  home: https://github.com/openai/mle-bench
facets:
  domain.primary:
    - value: code/ml-engineering
      source: abs
      quote: tasks that test real-world ML engineering skills such as training models, preparing datasets, and
        running experiments
      note: Under 0.9.0 the code family admits scoring what the entrant's software computes, a trained model's predictions
        file, and mle-bench is its example; long-horizon-autonomy is primary only when no task subdomain applies.
  domain.secondary:
    - value: agents-tooluse/long-horizon-autonomy
      source: paper
      quote: For each of the 75 competitions, agents have a maximum of 24 hours to produce a submission.
  capability:
    - value: autonomy
      source: paper
      quote: We built MLE-bench to be a robust measure of real-world progress in autonomous ML engineering agents
      note: Agents run unattended in a container for up to 24 hours, and the paper checks logs for outside help
        ("calling another external LLM API for assistance"). mle-bench is the 0.9.0 example of autonomy. The engineering
        competence itself is carried by the domain (code/ml-engineering), as ADR-0020 rules.
  evaluation_method:
    - value: human-distribution-percentile
      source: abs
      quote: We establish human baselines for each competition using Kaggle's publicly available leaderboards.
      note: Bronze, silver and gold thresholds come from each competition's private Kaggle leaderboard, and the
        headline is the share of attempts awarded any medal. Each competition's raw score uses its own metric.
  designed_for_subjects:
    - value: agent-scaffold
      source: home
      quote: We purposefully designed our benchmark to not make any assumptions about the agent that produces
        submissions
  data.access:
    - value: gated-registration
      source: home
      quote: Ensure that you have downloaded your Kaggle credentials
      note: Data comes through the Kaggle API, which needs an account and acceptance of each competition's rules
        ("be sure to accept the competition rules"). The test labels are then built locally from Kaggle's public
        training data, so they are not withheld.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: which will include a version column in the leaderboard to distinguish between v1 and v2 results.
      note: v1 is frozen ("we are postponing fixes to avoid invalidating the leaderboard"), and v2 is announced for
        openai/frontier-evals but not yet released.
  data.data_provenance:
    - value: inherited-from-constituents
      source: paper
      quote: MLE-bench consists of 75 machine learning engineering tasks manually sourced from Kaggle
      note: Each task is a published Kaggle competition, its description, dataset and leaderboard reused and re-split,
        so each competition's own provenance applies. The maintainers wrote new train-test splits and grading code.
        0.9.0's inherited-from-constituents describes that reuse better than web-scraped.
  data.contamination_risk:
    - value: medium
      source: paper
      quote: that models have trained on all public Kaggle material including competition details, solutions, and
        even the datasets including our test set
      note: The paper's familiarity and obfuscation experiments "find no evidence of results being systematically
        inflated due to memorization" for GPT-4o, and the README lists test-label leaks in several competitions.
  data.ceiling_anchor_type:
    - value: expert-best
      source: paper
      quote: with a ceiling comparable to the achievements of the very best human Kagglers after years of cumulative
        effort
      note: Only nine humans have medals in 75 different Kaggle competitions, per the paper.
  lifecycle:
    - value: under-revision
      source: home
      quote: we plan to release batched fixes in the upcoming v2 release of MLE-bench
      note: Under 0.9.0 an announced correction of the entry's content in progress takes precedence over active, although
        rows are dated up to 2026-03-06; mle-bench is the example.
  activity:
    - value: closed
      source: home
      quote: We are currently not taking any new submissions to the leaderboard while we develop an improved process
        for ensuring submissions are fair and comparable.
      note: 0.9.0's closed covers a pause with no reopening date. The stated plan is to share updates on an improved
        process, and v2 is to move to openai/frontier-evals.
  governance.maintainer_type:
    - value: industry-lab
      source: paper
      quote: We open-source our benchmark code (github.com/openai/mle-bench/)
      note: The author block gives OpenAI as the affiliation, and some authors note "Work done while at OpenAI".
  governance.submission_process:
    - value: self-reported
      source: home
      quote: To produce the scores for the leaderboard, please organize your grading reports
      note: Submitters run the grader and report the mean and standard error themselves. Nothing fetched describes
        a maintainer check, though the maintainers move some rows to a "not directly comparable" table.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: abs
      quote: finding that the best-performing setup--OpenAI's o1-preview with AIDE scaffolding--achieves at least
        the level of a Kaggle bronze medal in 16.9% of competitions
  execution.compute_tier:
    - value: single-gpu
      source: paper
      quote: and a single Nvidia A10 GPU
      note: The protocol fixes the agent's machine (36 vCPUs, 440GB RAM, one 24GB A10 GPU) whatever model drives it, and
        under 0.9.0 a mandated GPU outranks the API spend; mle-bench is the example.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: The evaluation (task and grading) itself is deterministic, but agents/LLMs can be quite high-variance!
      failure: 2026-09-28-mle-bench-006
  execution.reproducibility_blockers:
    - value: compute-scale
      source: home
      quote: Evaluating agents with the above settings on the full 75 competitions of MLE-bench can be expensive.
      note: A canonical run is 75 competitions times 24 hours times at least 3 seeds on the A10 machine, over 3.3TB
        of data. The maintainers offer the 22-competition Low split as a "lite" alternative for this reason.
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: We have released the code used to construct the dataset, the evaluation logic, as well as the agents we
        evaluated for this benchmark.
notes: The corpus files MLE-bench under agents-tooluse, and the record puts it in code/ml-engineering, which 0.9.0 makes a qualifying example of code.
  The README's known-issues list (label leaks in several competitions, crowded leaderboards) is kept unfixed in v1
  so as not to invalidate submissions, and v2 is to move to openai/frontier-evals, where PaperBench lives.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, data.data_provenance, lifecycle, activity, execution.compute_tier,
      execution.reproducibility_tier]
    note: Re-adjudicated against 0.9.0; all five Stage 3 failures settle, and a new record logs the fully-automatable
      plus compute-scale pair that 02 S11 blocks.

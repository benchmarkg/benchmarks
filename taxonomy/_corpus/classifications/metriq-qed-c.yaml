# taxonomy/_corpus/classifications/metriq-qed-c.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: metriq-qed-c
corpus_item: 53
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2603.08680
  abs: https://arxiv.org/abs/2603.08680
  home: https://metriq.info/
  qedc: https://arxiv.org/html/2110.03137
  qedcrepo: https://github.com/SRI-International/QC-App-Oriented-Benchmarks
  metriqgym: https://github.com/unitaryfoundation/metriq-gym
  metriqdata: https://github.com/unitaryfoundation/metriq-data
  datacommits: https://api.github.com/repos/unitaryfoundation/metriq-data/commits?per_page=5
  unitary: https://unitary.foundation/
facets:
  domain.primary:
    - value: physics/quantum-systems
      source: abs
      quote: system-level metrics that characterize fundamental device properties such as entanglement quality,
        gate performance, and circuit speed
      note: The subdomain's "characterising ... quantum systems and quantum circuits" fits literally, but here the
        quantum computer is the system under test, not the subject an AI system reasons about (failures 001 and
        002).
  domain.secondary: []
  capability:
    - value: null
      source: paper
      quote: It is not a physical fidelity, and not an estimator of a single latent hardware capability.
      failure: 2026-09-28-metriq-qed-c-001
  evaluation_method:
    - value: composite
      source: abs
      quote: we introduce the Metriq Score, a composite index aggregating benchmark outcomes.
    - value: domain-metric
      source: paper
      quote: Each benchmark contributes a normalized subscore derived from its own task-specific metric (e.g., polarization,
        success probability, approximation ratio, throughput)
      note: EPLG, CLOPS, BSEQ and the QED-C normalised classical fidelity are quantum-benchmarking metrics.
    - value: physical-trial
      source: abs
      quote: Using Metriq, we collect and publicly release results from more than ten quantum computers across multiple
        hardware vendors
  designed_for_subjects:
    - value: null
      source: home
      quote: A scoreboard that assigns each device a composite Metriq Score based on results from the metriq-gym
        benchmark suite.
      failure: 2026-09-28-metriq-qed-c-002
  data.access:
    - value: generated-on-demand
      source: paper
      quote: For each size, up to max_circuits parameterized circuits are generated.
      note: Benchmark circuits are generated per job from versioned parameter schemas (EPLG and mirror circuits
        are random). The results dataset is CC BY 4.0.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: Suite versions and device data series are tracked separately.
      note: Metriq suite series v0.4 to v0.7 and Metriq Score 1.0; the QED-C repository separately has v1.x and
        v2 (failure 003).
  data.data_provenance:
    - value: synthetic-procedural
      source: paper
      quote: four different measurement circuits are generated for each edge
      note: The items are procedurally generated circuits; the scored outcomes are hardware measurements.
  data.contamination_risk:
    - value: unknown
      note: Training-data contamination does not transfer to hardware. The analogue, vendors tuning compilers or
        calibration to known benchmark circuits, is not assessed in any source.
  data.ceiling_anchor_type:
    - value: none-known
      note: The Metriq Score is normalised to a baseline device ("100 means on par with the baseline") and is unbounded
        above, with devices scoring over 600 on single benchmarks. The baseline is a reference point, not a ceiling.
  lifecycle:
    - value: active
      source: datacommits
      quote: 'mgym upload: suite metriq_score_1_0 on ibm/ibm_phoenix (#545)'
      note: Committed to metriq-data on 2026-09-11. Results uploads continue on the maintainer's own dataset repository.
  activity:
    - value: accepting-submissions
      source: home
      quote: Yes, in fact everyone is encouraged to.
      note: The answer to the FAQ "Can I add new benchmark results?"; the upload path is the metriq-gym CLI.
  governance.maintainer_type:
    - value: nonprofit
      source: unitary
      quote: Unitary Foundation is a 501(c)(3) non-profit helping create a quantum technology ecosystem that benefits
        the most people
      failure: 2026-09-28-metriq-qed-c-003
  governance.submission_process:
    - value: maintainer-verified
      source: metriqdata
      quote: Passing schema validation is not sufficient for inclusion.
      note: Operators run metriq-gym and upload results as data pull requests, which the maintainers review against
        the upload policy.
  governance.independence_flags:
    - value: funded-by-evaluated-party
      source: paper
      quote: We also thank the OriginQ team for their help in interfacing with their devices and for supplying additional
        runtime for running our benchmarks.
      note: In-kind device time from a vendor whose devices are scored (OriginQ wukong_72 is in Table 1).
    - value: maintainer-competes-on-own-benchmark
      source: qedc
      quote: (Data collected by Quantinuum in-house.)
      note: 'QED-C side: the suite paper''s authors include Quantinuum staff, who ran it on Quantinuum H1-1.'
  execution.compute_tier:
    - value: physical-hardware
      source: paper
      quote: A practical barrier to comprehensive quantum benchmarking is the monetary cost of executing circuits
        on commercial quantum hardware.
      note: The hardware is reached through vendor clouds, so the cost is paid as cloud credits; local simulators
        are supported for validation only.
  execution.reproducibility_tier:
    - value: requires-specialized-hardware
      source: metriqdata
      quote: how the result can be reproduced, given appropriate access, credentials, and credits;
  execution.reproducibility_blockers:
    - value: live-world-state
      source: paper
      quote: Running a suite ensures that all constituent benchmarks are evaluated under the same backend version,
        calibration epoch, and queuing conditions
      note: Device calibrations drift, so a run cannot be repeated under the same conditions.
  execution.harness_availability:
    - value: official-harness
      source: metriqgym
      quote: metriq-gym is a Python framework for implementing and running standard quantum benchmarks on different
        quantum devices by different providers.
notes: A combined entry (Metriq platform plus QED-C suite), as the corpus flags; failure 003 logs the split. The
  benchmark scores quantum hardware, not AI systems, so capability and designed_for_subjects have no legal value
  (blocking failures 001 and 002). The synthesis should decide whether the entry is in scope. The datacommits source
  is the metriq-data commit log, and its committer e-mail fields are not quoted.

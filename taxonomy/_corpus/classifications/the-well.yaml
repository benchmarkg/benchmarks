# taxonomy/_corpus/classifications/the-well.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: the-well
corpus_item: 48
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2412.00568
  abs: https://arxiv.org/abs/2412.00568
  home: https://polymathic-ai.org/the_well/
  repo: https://github.com/PolymathicAI/the_well
  simons: https://www.simonsfoundation.org/about/
facets:
  domain.primary:
    - value: physics/simulation-surrogates
      source: home
      quote: The repository allows benchmarking surrogate models on the different datasets that compose the Well.
      note: The claim is surrogate modelling across many physical systems (biological, fluid, acoustic, MHD,
        astrophysical), which the 0.9.0 not_to_be_confused_with between simulation-surrogates and fluid-dynamics
        assigns here, with the subject subdomains secondary.
  domain.secondary:
    - value: physics/fluid-dynamics
      source: abs
      quote: 15TB of data across 16 datasets covering diverse domains such as biological systems, fluid dynamics,
        acoustic scattering
      note: Most datasets are flows (Euler quadrants, Rayleigh-Benard, Rayleigh-Taylor, shear flow, MHD, shallow
        water). The astrophysical simulations have no subject subdomain, because astrophysics-cosmology is
        defined for observational data.
  capability:
    - value: scientific-prediction
      source: paper
      quote: These baselines are trained on the forward problem - predicting the next snapshot of a given simulation
        from a short history of 4 time-steps.
      note: The next state of a simulated physical field, scored by VRMSE against the simulator (ADR-0014; the
        term's own example).
  evaluation_method:
    - value: statistical-fit
      source: paper
      quote: Table 2 reports the one-step Variance Scaled Root Mean Squared Error (VRMSE) – defined in Section E.3
        – averaged over all physical fields.
      note: VRMSE is RMSE normalised by the variance of the true field, defined by the paper rather than standardised
        in a discipline. Rollout windows (6-12, 13-30) use the same metric.
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: repo
      quote: We hope that the community will build upon these results to develop better architectures for PDE surrogate
        modeling.
  data.access:
    - value: fully-open
      source: home
      quote: If --dataset and --split are omitted, all datasets and splits will be downloaded.
      note: The datasheet gives the licence as CC-BY-4.0; most datasets also stream from Hugging Face.
  data.refresh:
    - value: versioned-releases
      source: repo
      quote: However `viscoelastic_instability_v2` contains the same data without the processing error.
      note: The datasheet says modifications to the collection "will be in the form of added datasets", and a score
        is reported per dataset, so the dataset label (here _v2) is what a claim pins to.
  data.data_provenance:
    - value: simulation-generated
      source: paper
      quote: All data in the Well was produced via numerical simulation.
  data.contamination_risk:
    - value: unknown
      note: No source assesses contamination. Test splits (80/10/10 over initial conditions) are public with their
        targets, and whether pretrained physics foundation models have seen them is not discussed.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: 'Table 2: Model Performance Comparison: VRMSE metrics on test sets (lower is better).'
      note: VRMSE is an RMSE scaled by the target field's variance, so zero error is the metric's bound at its
        optimum, and 1 marks the mean-prediction floor. No measured, human or operational ceiling is published, and
        0.9.0's none-known exclusion sends a bounded metric with no measured anchor here.
  lifecycle:
    - value: null
      failure: 2026-09-28-the-well-003
  activity:
    - value: no-submission-channel
      source: paper
      quote: Our Github page contains contributor guidelines that may be used to add additional datasets to the
        Well.
      note: The sources show no leaderboard, server or submission route, and the contribution route is for datasets,
        not results (unknown's near miss for the-well).
  governance.maintainer_type:
    - value: nonprofit
      source: simons
      quote: The Simons Foundation is a private foundation guided by its board of trustees.
      note: The datasheet says the datasets "are collected and maintained by Polymathic AI, a research collaboration
        within the Simons Foundation", and "The Flatiron Institute will host and maintain the data"; Flatiron is
        the foundation's research division.
  governance.submission_process:
    - value: literature-only
      source: paper
      quote: Our Github page contains contributor guidelines that may be used to add additional datasets to the
        Well.
      note: A dataset and training library with no ranking; beyond the release paper's baselines, results appear in
        users' own papers (the term's own example).
  governance.independence_flags:
    - value: no-known-conflict
      source: paper
      quote: Polymathic AI acknowledges funding from the Simons Foundation and Schmidt Sciences, LLC.
      note: NVIDIA donated DGX Cloud node hours but is not an evaluated party. The baselines are standard architectures
        (FNO, TFNO, U-net, CNextU-net), not maintainer products. This reflects the acknowledgements and README read
        on 2026-09-28.
  execution.compute_tier:
    - value: single-gpu
      source: paper
      quote: All runs were time-limited to 12 hours on a single Nvidia H100 GPU.
      note: The maintainer's reference run, per dataset and model; there is no leaderboard, so under 0.9.0's
        precedence rule that run decides. It covers training and the test-set evaluation on the same accelerator. The full collection is 15TB (6.9GB to 5.1TB per dataset), so storage is a cost
        of its own.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: 'For instance, to run the training script of default FNO architecture on the active matter dataset,
        launch the following commands:'
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: abs
      quote: we provide a unified PyTorch interface for training and evaluating models.
notes: The Well is a dataset collection with a benchmarking library and paper baselines, not a leaderboard. At
  0.1.0 its surrogate-forecasting task had no capability term (the-well-002, the cafa-001 pattern), and the physics
  subdomains crossed a method axis with a subject axis (the-well-001). 0.9.0 adds scientific-prediction (ADR-0014)
  and a not_to_be_confused_with that orders the two physics subdomains.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, capability, data.ceiling_anchor_type, activity, governance.submission_process]
    note: Re-adjudicated against 0.9.0; scientific-prediction, literature-only and the simulation-surrogates tie-
          break settle three Stage 3 failures, activity moves to no-submission-channel and the ceiling to
          theoretical-maximum under the revised tests, and lifecycle stays source-silent.

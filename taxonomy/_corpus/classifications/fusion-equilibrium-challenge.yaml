# taxonomy/_corpus/classifications/fusion-equilibrium-challenge.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: fusion-equilibrium-challenge
corpus_item: 52
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://arxiv.org/html/2609.01750
  abs: https://arxiv.org/abs/2609.01750
  home: https://fusion-equilibrium-challenge.sophelio.io/
  codabench: https://www.codabench.org/api/competitions/17739/
  organizers: https://fusion-equilibrium-challenge.sophelio.io/organizers/
  sophelio: https://sophelio.io/
facets:
  domain.primary:
    - value: physics/plasma-fusion
      source: home
      quote: Can AI reconstruct the magnetic geometry of a fusion plasma — without measuring the magnetic field?
  domain.secondary: []
  capability:
    - value: scientific-prediction
      source: home
      quote: A single learned mapping turns coil currents and laser profiles into the flux surfaces, plasma boundary,
        and equilibrium parameters EFIT normally derives from magnetic sensors.
      note: Challenge 1, the core task, predicts the plasma equilibrium from non-magnetic measurements and scores it
        against EFIT's reference reconstruction (ADR-0014).
    - value: distribution-shift-generalization
      source: home
      quote: the fraction of your DIII-D performance you keep when moving zero-shot to MAST
      note: Challenge 2. The task and targets are unchanged and only the machine moves, so 0.9.0's tie-break gives
        this term and not transfer-learning, whatever the source calls it (the term's own example).
  evaluation_method:
    - value: composite
      source: home
      quote: S = 0.55·R²ψ + 0.15·R²_q95,βN + 0.10·(1 − D_LCFS) + 0.20·Consistency
      note: Challenge 2 ranks on G_ratio = S_model(MAST) / S_model(DIII-D), a ratio of the same composite.
    - value: statistical-fit
      source: paper
      quote: Flux reconstruction accuracy. The pooled coefficient of determination,
      note: 'Every constituent is an error against the EFIT reference: pooled R^2 on psi and on q95/betaN, a length-normalised
        Hausdorff distance on the LCFS, and R^2 on seven psi-derived scalars.'
  designed_for_subjects:
    - value: scientific-surrogate-model
      source: home
      quote: A single learned mapping turns coil currents and laser profiles into the flux surfaces, plasma boundary,
        and equilibrium parameters EFIT normally derives from magnetic sensors.
      note: The model stands in for EFIT-with-magnetics and is scored against EFIT's output. Any method is admitted,
        "from ridge regression to neural operators".
  data.access:
    - value: train-open-test-held-out
      source: codabench
      quote: Private-fold EFIT reconstructions are never released; leakage or memorization is disqualifying.
      note: Training data and public-test inputs are on Hugging Face under CC BY 4.0, with public-test targets withheld.
  data.refresh:
    - value: versioned-releases
      source: paper
      quote: we will issue a versioned patch on Hugging Face, exclude the affected shots from the test pool, and notify
        participants through every communication channel.
      note: The one post-release data change is dated ('Aug 2026 Data erratum DIII-D plasma-current timestamps', home),
        and the diverted-timeslice restriction is in the release paper. 0.9.0 counts a dated announcement as a pin.
        A single NeurIPS 2026 edition, with no further editions announced.
  data.data_provenance:
    - value: real-world-instrument
      source: abs
      quote: releasing a curated dataset of 9,113 DIII-D shots and 2,416 MAST shots--filtered for Thomson-diagnostic
        availability
      note: The inputs are coil currents and Thomson-scattering profiles recorded on each shot.
    - value: simulation-generated
      source: home
      quote: Its output is the ground truth you are scored against
      note: The ground truth is EFIT's equilibrium reconstruction, a physics code fitted to each shot's magnetic
        measurements, which 0.9.0 records as this term beside real-world-instrument (the term's own example).
  data.contamination_risk:
    - value: medium
      source: codabench
      quote: '**No MAST equilibrium data.** Equilibrium reconstructions of MAST or MAST-U from any source'
      note: The maintainers name a specific route (the public FAIR-MAST archive holds MAST equilibria) and forbid
        it by rule rather than by construction, and the reconstructions stay public. The private folds are never
        released.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: home
      quote: It blends flux-map accuracy, the two predicted scalars, boundary alignment, and the consistency of
        the seven ψ-derived scalars into one number in [0, 1]. Higher is better.
      note: EFIT's reconstruction is the ground truth itself, so reaching the bound means matching the incumbent's
        labels, which 0.9.0 records as theoretical-maximum, not operational-system (the term's own example).
  lifecycle:
    - value: active
      source: home
      quote: Phase 1 (development) is open — submissions close Oct 18, 2026
  activity:
    - value: accepting-submissions
      source: home
      quote: Phase 1 (development) is open — submissions close Oct 18, 2026
      note: The blind final phase runs 2026-10-19 to 2026-10-26, with results in December 2026.
  governance.maintainer_type:
    - value: industry-lab
      source: sophelio
      quote: At Sophelio, we specialize in crafting and advancing AI and machine learning solutions
      note: '"A Sophelio initiative"; the dataset (huggingface.co/datasets/Sophelio/...) and the starter kit
        (github.com/Sophelio/...) sit in Sophelio namespaces, so the company holds it. The ten organisers are three
        at Sophelio, six at General Atomics (DIII-D) and one at UT Austin (organizers page).'
  governance.submission_process:
    - value: held-out-server
      source: home
      quote: Submit against the public test set and watch the leaderboard move.
    - value: maintainer-verified
      source: paper
      quote: so that organizers can independently rebuild and re-score the entry.
      note: Applies to the top five entries per challenge before prizes; an entry that cannot be rebuilt stays on
        the leaderboard but is not eligible.
  governance.independence_flags:
    - value: null
      source: paper
      quote: no external sponsor is required to run the challenge.
      failure: 2026-09-28-fusion-equilibrium-challenge-005
  execution.compute_tier:
    - value: trivial-cpu
      source: paper
      quote: Our evaluation is CPU-light, so no GPU allocation or compute support from the conference is required.
      note: Scoring runs CPU-only on submitted predictions, and every reference baseline trains and runs 'in under
        two hours on a single commodity GPU or CPU'. The 24 GPU-hour cap on a single A100 bounds training for the
        reproduction package, and training is not part of the run under 0.9.0's precedence rule.
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: codabench
      quote: Private-fold EFIT reconstructions are never released; leakage or memorization is disqualifying.
      note: Official scores need the never-released blind folds. Local scoring on held-out training shots uses the
        same scoring modules.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: codabench
      quote: Private-fold EFIT reconstructions are never released; leakage or memorization is disqualifying.
  execution.harness_availability:
    - value: official-harness
      source: codabench
      quote: scoring program's own modules, copied unmodified — the same functionals run here and on the
notes: A live NeurIPS 2026 competition, with the paper posted 2026-09-01. The Codabench record (API for competition
  17739) supplies the rules, evaluation and terms, and the organizers page and Sophelio's site supply the maintainer.
  The site's contact addresses are not quoted.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, data.refresh, data.data_provenance, data.ceiling_anchor_type, execution.compute_tier]
    note: Re-adjudicated against 0.9.0; the shift tie-break, the pin test, the reanalysis rule and the incumbent-as-
          truth rule settle four Stage 3 failures, scientific-prediction is added for Challenge 1, and compute moves
          to trivial-cpu because the GPU cap bounds training only. The prize-funder gap stays source-silent.

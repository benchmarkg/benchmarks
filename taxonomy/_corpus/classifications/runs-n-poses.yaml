# taxonomy/_corpus/classifications/runs-n-poses.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: runs-n-poses
corpus_item: 38
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://doi.org/10.21203/rs.3.rs-7311192/v1
  pdf: https://www.researchsquare.com/article/rs-7311192/v1.pdf
  home: https://github.com/plinder-org/runs-n-poses
  polaris: https://polarishub.io/benchmarks/plinder-org/runs-n-poses
facets:
  domain.primary:
    - value: biology-genetics/protein-ligand-cofolding
      source: home
      quote: This benchmark tests the ability of protein-ligand co-folding methods to generalize to systems different
        from those in their training set.
      failure: 2026-09-28-runs-n-poses-001
  domain.secondary: []
  capability:
    - value: distribution-shift-generalization
      source: home
      quote: This benchmark tests the ability of protein-ligand co-folding methods to generalize to systems different
        from those in their training set.
      note: Success is reported per bin of similarity to the closest training system, and the paper reports the degradation
        across bins.
      failure: 2026-09-28-runs-n-poses-002
  evaluation_method:
    - value: domain-metric
      source: home
      quote: The LDDT-PLI, BiSyRMSD, LDDT-LP, backbone RMSD, and pocket F1 score accuracy metrics
      note: The headline success rate is ligand RMSD < 2 A together with LDDT-PLI > 0.8.
    - value: constraint-check
      source: home
      quote: suite of physical plausibility checks
      note: PoseBusters validity is reported alongside the success rate ("PB-Valid").
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: Here we present a comprehensive evaluation of four leading all-atom cofolding methods using our newly introduced
        benchmark dataset Runs N' Poses
  data.access:
    - value: fully-open
      source: pdf
      quote: We provide the entire dataset for benchmarking use at doi.org/10.5281/zenodo.14794785, including the sequences,
        SMILES, and MSAs used as input for each prediction
  data.refresh:
    - value: versioned-releases
      source: polaris
      quote: 'Created on: February 03, 2025'
      note: The Polaris listing is marked V2; the dataset is a Zenodo record.
      failure: 2026-09-28-runs-n-poses-003
  data.data_provenance:
    - value: experimental-measurement
      source: paper
      quote: which comprises 2,600 high-resolution protein-ligand systems released after the training cutoff used by
        these methods
      note: Ground truth is deposited PDB crystal structures.
  data.contamination_risk:
    - value: low
      source: home
      quote: This is a zero-shot benchmark, provided that your method uses a structural training cutoff of 30 September
        2021.
      failure: 2026-09-28-runs-n-poses-004
  data.ceiling_anchor_type:
    - value: none-known
      note: Success rates and LDDT-PLI have no stated ceiling. The paper notes that experimental quality limits PLI ground
        truth but does not turn it into an anchor.
  lifecycle:
    - value: active
      source: pdf
      quote: Since the creation of Runs N’ Poses, Boltz-2 [ 31] has been released
      note: The August 2025 preprint version adds Boltz-2 results to the February 2025 set; the paper was published in
        Nature Structural & Molecular Biology on 2026-05-08.
  activity:
    - value: null
      source: polaris
      quote: Interacting with it through the Polaris client is currently not possible.
      failure: 2026-09-28-runs-n-poses-005
  governance.maintainer_type:
    - value: academic-lab
      source: pdf
      quote: Biozentrum, University of Basel, Basel, Switzerland.
      note: With SIB Swiss Institute of Bioinformatics; the repository is under the plinder-org organisation.
  governance.submission_process:
    - value: null
      source: polaris
      quote: Interacting with it through the Polaris client is currently not possible.
      failure: 2026-09-28-runs-n-poses-006
  governance.independence_flags:
    - value: no-known-conflict
      source: paper
      quote: JE is currently employed by VantAI, but was involved in this research while being employed by the Swiss
        Institute of Bioinformatics at University of Basel.
      note: The declared interest concerns an author, not an evaluated system; the evaluated methods (AlphaFold3, Boltz,
        Chai-1, Protenix, RoseTTAFold-All-Atom) are third-party.
  execution.compute_tier:
    - value: single-gpu
      source: pdf
      quote: were run on one A100 40 GPU each with 10 recycling steps
  execution.reproducibility_tier:
    - value: fully-automatable
      source: home
      quote: for the code used to generate the figures in the paper
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: for instructions on how to run accuracy scoring and extract relevant accuracy metrics for each method
notes: The corpus primary paper is the Research Square preprint (v1, posted 2025-08-14); its PDF was fetched as the full
  text. The Europe PMC search result was not used, because it mixes unrelated records. The preprint was published in
  Nature Structural & Molecular Biology on 2026-05-08 under the title "Evaluating generalization in protein-ligand cofolding
  methods". Recomputing similarity for a new training cutoff needs "an entire copy of the PDB, the PLINDER dataset, and
  large amounts of memory", but the processed similarity scores are released, so reproduction is not blocked.

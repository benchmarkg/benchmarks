# taxonomy/_corpus/classifications/iwslt-2026.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: iwslt-2026
corpus_item: 79
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  pdf: https://aclanthology.org/2026.iwslt-1.39.pdf
  paper: https://aclanthology.org/2026.iwslt-1.39/
  home: https://iwslt.org/2026/
  offline: https://iwslt.org/2026/offline
  lowres: https://iwslt.org/2026/low-resource
  metrics: https://iwslt.org/2026/metrics
  iwslt2027: https://iwslt.org/2027/
facets:
  domain.primary:
    - value: audio-speech/speech-translation
      source: home
      quote: The International Conference on Spoken Language Translation (IWSLT) is an annual scientific conference,
        associated with shared tasks on spoken language translation
  domain.secondary:
    - value: audio-speech/speech-synthesis
      source: pdf
      quote: the cross-lingual voice cloning task focuses on transferring voice identity across languages while
        maintaining natural- ness and intelligibility.
      note: Also the Indic and African/Celtic speech-to-speech tracks.
    - value: audio-speech/speech-recognition
      source: offline
      quote: '(note: the evaluation includes the English-English ASR direction).'
      note: Also the ASR subtask of the instruction-following track.
    - value: multimodal/audio-language
      source: pdf
      quote: It aims to test general-purpose multimodal models (known as multimodal LLMs or audio- LLMs) for the
        speech modality.
    - value: language/low-resource-languages
      source: lowres
      quote: The goal of this shared task is to benchmark and promote speech translation technology for a diverse
        range of dialects and low-resource languages.
      note: The Metrics track has no domain term; see the failure.
      failure: 2026-09-28-iwslt-2026-001
  capability:
    - value: generation-fidelity
      source: offline
      quote: Systems’ performance will be evaluated with respect to their capability to produce translations similar
        to the target-language references in the test sets.
      note: 0.9.0's generation-fidelity admits the source as the target whose content the output must preserve, so
        the COMET ranking against references and the human direct assessment against the source audio both meet it.
    - value: perception
      source: pdf
      quote: Human graders are asked for direct assessment (DA) (Graham et al., 2013; Cettolo et al., 2017; Akhbardeh
        et al., 2021) of the system output given the input audio
      note: Every track takes raw speech as input. The latency and compression axes are not capabilities; 02 S4.4
        records them in the benchmark field secondary_axes (ADR-0020 rejects inference-efficiency).
  evaluation_method:
    - value: model-derived-metric
      source: offline
      quote: the submitted runs will be ranked based on COMET calculated on the test set by using automatic resegmentation
        of the hypothesis based on the reference translation by mwerSegmenter.
      note: COMET ranks the offline, compression and low-resource tracks; the voice-cloning track scores speaker
        similarity with an ECAPA-TDNN model. 0.9.0 moves COMET and BLEURT to this term, and model-derived-metric
        governs for the ranking number.
    - value: reference-metric
      source: offline
      quote: 'Such similarity will be measured in terms of multiple automatic metrics: COMET, BLEURT, BLEU, TER,
        and characTER.'
      note: For BLEU, TER and characTER, which are fixed formulas; COMET and BLEURT are model-derived-metric.
    - value: human-expert-eval
      source: pdf
      quote: Annotation is conducted by professional translators fluent in the source language and native in the
        target language.
      note: Direct assessment of primary submissions in the offline, compression and instruction-following tracks,
        a complement to the automatic ranking.
    - value: statistical-fit
      source: metrics
      quote: Quality Estimation models will be evaluated by measuring their correlation with human judgments similar
        to WMT Metrics Shared Task.
      note: Metrics track (Kendall tau_b at segment level, soft pairwise accuracy at system level).
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: offline
      quote: Both cascade and end-to-end models will be evaluated.
      note: Purpose-built speech-translation systems trained under the track's data conditions; translation is a
        general language task, not a discipline.
    - value: instruction-tuned-model
      source: pdf
      quote: It aims to test general-purpose multimodal models (known as multimodal LLMs or audio- LLMs) for the
        speech modality.
      note: Instruction-following track only.
  data.access:
    - value: train-open-test-held-out
      source: offline
      quote: Reference translation (will not be provided for evaluation data)
      note: Training data under the constrained condition are public corpora; test audio is downloaded from the
        SPEECHM server and references are withheld.
  data.refresh:
    - value: periodic-recompetition
      source: home
      quote: The 23rd edition of IWSLT will be run as an ACL and ELRA sponsored event, co-located with ACL 2026
        in San Diego, CA, USA on July 3-4, 2026.
      note: Each edition releases new test sets; 2026 added Japanese, call-centre and YouTube data.
  data.data_provenance:
    - value: web-scraped
      source: pdf
      quote: By incorporating two brand-new scenarios, call center interactions and YouTube videos
      note: Test audio is also taken from TV series, ACL presentations and a Bloomberg business-news broadcast.
    - value: expert-authored
      source: pdf
      quote: High-quality reference translations for German, Japanese, and Chinese were professionally cu- rated
        by AppTek
      note: The reference translations, not the source audio.
  data.contamination_risk:
    - value: medium
      source: offline
      quote: 'English -> German: TV series, scientific presentations, call center two-person conversations, YouTube,
        business news, and accent challenge data.'
      note: The references were new for this edition and withheld, but much of the source audio is public broadcast
        and web video that may already be in pretraining data. No source assesses contamination.
  data.ceiling_anchor_type:
    - value: none-known
      note: The headline track is the offline track, ranked by COMET, and no source publishes a human or measured
        anchor for it. The Metrics track's inter-annotator agreement ('the agreement between human annotators') is
        another track's anchor and goes to ceiling_by_category under 0.9.0's none-known test.
  lifecycle:
    - value: superseded
      source: iwslt2027
      quote: The 24th edition of IWSLT will be co-located with ACL 2027 in Kyoto, Japan.
      note: The entry is the 2026 edition, and 0.9.0's entry-as-catalogued rule makes an edition that a later one
        has replaced superseded even while the family is active.
  activity:
    - value: closed
      source: home
      quote: Apr 15, 2026 System submission deadline (shared tasks)
      note: 'This is the 2026 edition the corpus names. The family is open: IWSLT 2027 runs year-round leaderboards
        for offline ST, compression and instruction following ("Submission for these tasks is open").'
  governance.maintainer_type:
    - value: conference-workshop
      source: home
      quote: The 23rd edition of IWSLT will be run as an ACL and ELRA sponsored event
      note: Chairs from Amazon, CMU, GMU, FBK, KIT, Galway, Google and Zoom; the findings paper has 55 authors across
        the track teams.
  governance.submission_process:
    - value: held-out-server
      source: offline
      quote: The evaluation will be performed using the Meetween SPEECHM Evaluation Server
      note: The server scores the offline, compression and instruction-following tracks; other tracks take e-mailed
        outputs scored by the organisers.
    - value: publication-gated
      source: metrics
      quote: As part of the submission, participants are required to submit a system description paper to IWSLT
        2026 for review by May 10, 2026
      note: Metrics track. For the other tracks a system paper is an opportunity, not a condition.
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: pdf
      quote: closely followed by FBK’s primary (91.5%)
      note: FBK supplies three of the conference chairs (programme, logistics, website) and enters systems. AppTek
        staff co-author the findings, AppTek curated references, and an AppTek system entered the subtitling track.
  execution.compute_tier:
    - value: null
      source: offline
      quote: in which the allowed training data is limited to a medium-sized framework in order to keep the training
        time and resource requirements manageable.
      failure: 2026-09-28-iwslt-2026-008
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: offline
      quote: Reference translation (will not be provided for evaluation data)
      note: The official COMET ranking is computed on the server against withheld references, and the human scores
        need recruited translators.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: offline
      quote: Reference translation (will not be provided for evaluation data)
    - value: human-raters
      source: pdf
      quote: we conduct a human evaluation of primary submissions
  execution.harness_availability:
    - value: official-harness
      source: offline
      quote: The detailed evaluation script can be found in the SLT.KIT.
notes: Classified as the IWSLT 2026 evaluation campaign, following the corpus name. The findings paper was read
  from the ACL Anthology PDF (the landing page carries only the abstract), with the 2026 home page, the offline,
  low-resource and metrics track pages and the IWSLT 2027 page. The campaign has ten tracks; single-valued fields
  record the offline track, the longest-running and best-documented, with the spread in notes.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, evaluation_method, designed_for_subjects, data.ceiling_anchor_type, lifecycle]
    note: Re-adjudicated against 0.9.0; the ceiling follows the headline offline track, and the escape hatches close.

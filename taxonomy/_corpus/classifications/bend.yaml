# taxonomy/_corpus/classifications/bend.yaml -- Stage 3 (03 S3.3), P1-S1-T03
id: bend
corpus_item: 25
curator: agent (P1-S1-T03)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2311.12570
  abs: https://arxiv.org/abs/2311.12570
  home: https://github.com/frederikkemarin/BEND
facets:
  domain.primary:
    - value: biology-genetics/regulatory-genomics
      source: paper
      quote: 3.1 Gene finding 3.2 Enhancer annotation 3.3 Chromatin accessibility prediction 3.4 Histone modification
        prediction 3.5 CpG methylation prediction 3.6 Noncoding variant effects (expression and disease)
      note: Four of the seven tasks (enhancer annotation, chromatin accessibility, histone modification, CpG methylation)
        predict regulatory state from sequence; gene finding has no subdomain.
      failure: 2026-09-28-bend-001
  domain.secondary:
    - value: biology-genetics/genomics-variant-effect
      source: paper
      quote: Predicting variant effects is a binary problem, where single-bp mutations are classified as either
        having an effect or not.
  capability:
    - value: null
      source: paper
      quote: BEND aims to provide a standardized set of tasks that measure the ability of LMs to capture the intricacies
        of genomic data
      failure: 2026-09-28-bend-002
  evaluation_method:
    - value: statistical-fit
      source: paper
      quote: We compute the multi-class Matthews correlation coefficient (MCC) (Gorodkin, 2004) over all bp.
      note: The other tasks report AUPRC (enhancer annotation) and AUROC ("The AUROC is computed for each label
        and averaged").
      failure: 2026-09-28-bend-003
  designed_for_subjects:
    - value: domain-specialist-model
      source: abs
      quote: we introduce BEND, a Benchmark for DNA language models, featuring a collection of realistic and biologically
        meaningful downstream tasks defined on the human genome
      note: The subjects are self-supervised DNA language models probed through frozen embeddings; the one-hot CNN
        and Basset baselines are supervised models without pre-training.
  data.access:
    - value: fully-open
      source: home
      quote: All data is available for download
  data.refresh:
    - value: null
      failure: 2026-09-28-bend-004
  data.data_provenance:
    - value: experimental-measurement
      source: paper
      quote: As the curation of a comprehensive benchmark task collection requires experimental ground-truth data
        to be available
      failure: 2026-09-28-bend-005
  data.contamination_risk:
    - value: unknown
      note: 'No source assesses contamination. One route exists by construction: the evaluated DNA LMs were pretrained
        self-supervised on the human reference genome, which contains the held-out test chromosomes, though not
        their labels. The sources never discuss it.'
  data.ceiling_anchor_type:
    - value: operational-system
      source: paper
      quote: For all tasks where Basset is not applicable, we report the performance of a previously published task-specific
        expert method on the benchmark dataset to put LM performance into context.
      failure: 2026-09-28-bend-006
  lifecycle:
    - value: null
      failure: 2026-09-28-bend-007
  activity:
    - value: null
      source: paper
      quote: An adaptable benchmarking framework for preparing embeddings and training lightweight supervised models.
      failure: 2026-09-28-bend-008
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: 'Wouter Boomsma Affiliation: Department of Computer Science, University of Copenhagen'
      failure: 2026-09-28-bend-009
  governance.submission_process:
    - value: null
      failure: 2026-09-28-bend-010
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: paper
      quote: We trained an autoregressive AWD-LSTM LM using truncated backpropagation through time
      note: The authors train two of the evaluated LMs themselves (AWD-LSTM and the dilated ResNet LM, "A baseline
        LM used in BEND" in the README) and rank them alongside third-party LMs. They are framed as baselines.
  execution.compute_tier:
    - value: single-gpu
      source: paper
      quote: Computations for all tasks were performed on single GPUs of the types RTX 6000, RTX 8000, V100, A40
        and A100 on local clusters, depending on availability.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: Code, configs and scripts to extract data and run all experiments are provided at https://github.com/frederikkemarin/BEND.
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: The `train_on_task.py` script calls a trainer class `bend.utils.task_trainer`.
notes: Entry is the BEND benchmark as released with the ICLR 2024 paper; the corpus flags low repository activity
  (last push 2024-10-31) and no hosted leaderboard, which the activity and submission failures record.

# taxonomy/_corpus/classifications/balrog.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: balrog
corpus_item: 74
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.1.0
sources:
  paper: https://arxiv.org/html/2411.13543
  abs: https://arxiv.org/abs/2411.13543
  home: https://balrogai.com/
  repo: https://github.com/balrog-ai/BALROG
  submit: https://balrogai.com/submit.html
  evaldoc: https://raw.githubusercontent.com/balrog-ai/BALROG/main/docs/evaluation.md
  subcommits: https://api.github.com/repos/balrog-ai/experiments/commits
facets:
  domain.primary:
    - value: null
      source: abs
      quote: Our benchmark incorporates a range of existing reinforcement learning environments with varying levels
        of difficulty
      failure: 2026-09-28-balrog-001
  domain.secondary:
    - value: games-planning/puzzle-games
      source: paper
      quote: An environment based on the popular puzzle video game Baba Is You.
    - value: games-planning/open-ended-environments
      source: paper
      quote: Agents are evaluated based on the number of achieved milestones, such as discovering new resources
        and crafting tools
      note: This is Crafter; NetHack is scored by a progression metric in the same way.
  capability:
    - value: planning
      source: home
      quote: testing their ability to plan, reason spatially, and explore in dynamic environments
      failure: 2026-09-28-balrog-002
    - value: long-horizon-execution
      source: repo
      quote: BALROG is a novel benchmark evaluating agentic LLM and VLM capabilities on long-horizon interactive
        tasks using reinforcement learning environments.
      failure: 2026-09-28-balrog-003
    - value: spatial-reasoning
      source: abs
      quote: Real-world tasks require handling intricate interactions, advanced spatial reasoning, long-term planning,
        and continuous exploration of new strategies
      note: The site repeats the claim ("reason spatially"), and every environment has a navigation component
        (Table 1). search-exploration is claimed too, but the progress score does not reward how the space was
        traversed, so its INC is not met.
  evaluation_method:
    - value: simulation-rollout
      source: paper
      quote: For environments like MiniHack, BabyAI, and Baba Is AI, each episode is scored as either 0 or 100
        based on task completion.
      failure: 2026-09-28-balrog-004
  designed_for_subjects:
    - value: agent-scaffold
      source: paper
      quote: Submissions may propose novel inference-time prompting strategies for improving the reasoning, planning,
        or in-context learning capability of an existing model.
      failure: 2026-09-28-balrog-005
  data.access:
    - value: generated-on-demand
      source: paper
      quote: all of the environments used in the benchmark are procedurally generated, and encountering the same
        instance of an environment twice is unlikely
      note: The code is MIT-licensed. Results are run over replicate seeds, and no source says whether the evaluation
        seeds are fixed.
  data.refresh:
    - value: continuously-generated
      source: paper
      quote: Our evaluation framework leverages fast, procedurally generated environments, ensuring rigorous and
        fair comparisons by preventing test-set leakage
  data.data_provenance:
    - value: synthetic-procedural
      source: paper
      quote: all of the environments used in the benchmark are procedurally generated, and encountering the same
        instance of an environment twice is unlikely
      note: The generators belong to the six pre-existing environments (BabyAI, Crafter, TextWorld, Baba Is AI,
        MiniHack, NetHack); BALROG's own paper states their provenance, so the aggregator gap of HAL-005 does
        not arise.
  data.contamination_risk:
    - value: low
      source: paper
      quote: BALROG is difficult to solve through simple memorization
      note: Models do carry game knowledge ("LLMs possess extensive NetHack knowledge", Appendix F.5), which is
        knowledge of the game rather than leakage of evaluation instances.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: we introduce a standardized metric, scoring performance on each task within a range of 0 to 100
  lifecycle:
    - value: active
      source: subcommits
      quote: 2026-09-20T18:53:57Z Add GPT-5.6 Terra and Claude Opus 5 LLM results
      note: The experiments repository holds the official submissions; the leaderboard shows rows dated 2026-09-18
        and 2026-09-20.
  activity:
    - value: accepting-submissions
      source: home
      quote: If you would like to submit your model to the leaderboard, please check the submission page.
      note: The site also says "The leaderboard is updated once a week on Monday."
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: 'Affiliation: AI Centre, University College London'
      note: The corpus flags "maintainer not stated beyond author list". The first author and the correspondence
        address are at UCL; the site also lists Oxford, NYU and IDEAS NCBR.
  governance.submission_process:
    - value: self-reported
      source: submit
      quote: 'verified: false (See below for results verification)'
      note: Submissions are pull requests of the run logs to the experiments repository.
    - value: maintainer-verified
      source: submit
      quote: We will run your agent on a random subset of BALROG and verify the results.
      note: The site's legend for the check mark is copied from SWE-bench's template ("reproduce the patch generations").
        The newest rows (2026-09) carry no check mark.
  governance.independence_flags:
    - value: funded-by-evaluated-party
      source: paper
      quote: We thank the Gemini Academic Program and Divy Thakkar for their support.
      failure: 2026-09-28-balrog-006
  execution.compute_tier:
    - value: api-credits-only
      source: repo
      quote: We support how of the box clients for OpenAI, Anthropic and Google Gemini APIs.
      failure: 2026-09-28-balrog-007
  execution.reproducibility_tier:
    - value: automatable-with-simulator
      source: paper
      quote: BALROG supports highly parallelized evaluations, leveraging the lightweight simulators of each of the environments in the suite
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: evaldoc
      quote: The following are various options you can use to evaluate your agents on BALROG.
notes: BALROG wraps six existing reinforcement-learning environments in a language interface and averages their
  progress scores, which is why no games-planning subdomain holds it (failure 001). The leaderboard has LLM, VLM
  and Agent modes; the paper's own results are zero-shot runs of the benchmark's naive agent.

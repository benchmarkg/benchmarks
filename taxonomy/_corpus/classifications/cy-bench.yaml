# taxonomy/_corpus/classifications/cy-bench.yaml -- Stage 3 (03 S3.3), P1-S1-T04
id: cy-bench
corpus_item: 58
curator: agent (P1-S1-T04)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  paper: https://essd.copernicus.org/articles/18/3997/2026/
  home: https://github.com/WUR-AI/AgML-CY-Bench
  contributing: https://raw.githubusercontent.com/WUR-AI/AgML-CY-Bench/main/CONTRIBUTING.md
facets:
  domain.primary:
    - value: earth-climate/agriculture
      source: home
      quote: We propose CY-Bench, a dataset and benchmark for subnational crop yield forecasting, with coverage of major
        crop growing countries and underrepresented countries of the world for maize and wheat.
  domain.secondary: []
  capability:
    - value: scientific-prediction
      source: home
      quote: By forecasting, we mean prediction is made ahead of harvest.
      note: Systems predict end-of-season crop yield, a state of an agricultural Earth system, from weather, soil and
        vegetation measurements, scored against official yield statistics under leave-one-year-out validation
        (ADR-0014). Every evaluated year's statistics exist, so this is not probabilistic-forecasting.
  evaluation_method:
    - value: statistical-fit
      source: paper
      quote: 'Our library computes the following evaluation metrics: normalized root mean squared error (NRMSE; i.e., the
        root mean squared error normalized by the average yield of the test set), mean absolute percentage error (MAPE),
        and R-squared (R2).'
  designed_for_subjects:
    - value: domain-specialist-model
      source: paper
      quote: we provide initial benchmarking results using several machine learning models in the accompanying code repository
      note: The baselines are task-trained regressors (ridge, random forest, LSTM, InceptionTime and residual variants)
        fitted per country and crop, as for brats-2026-cluster.
  data.access:
    - value: fully-open
      source: paper
      quote: provide an openly accessible dataset to the earth system science and machine learning communities
      note: The data and code are on Zenodo under EUPL-1.2.
  data.refresh:
    - value: versioned-releases
      source: home
      quote: version = {1.0},
      note: The dataset citation is versioned (Zenodo DOI), and the paper plans "future iterations" as new crop statistics
        are onboarded.
  data.data_provenance:
    - value: real-world-instrument
      source: paper
      quote: utilizing gap-filled and smoothed MODIS and VIIRS datasets
      note: The satellite predictors (fPAR, NDVI) are instrument products.
    - value: simulation-generated
      source: paper
      quote: AgERA5 offers agrometeorological indicators from 1979 to the present, derived from ERA5 reanalysis
      note: The weather predictors (AgERA5) and soil moisture (GLDAS, a land data assimilation system) are
        observation-constrained model products, which 0.9.0 records as this term beside real-world-instrument.
    - value: curated-public-database
      source: paper
      quote: Crop yield statistics for sub-national administrative levels are obtained from national statistics offices
        or regional agencies
      note: The yield targets are official statistics, some through curated harmonisations (the term's own cy-bench
        example).
  data.contamination_risk:
    - value: medium
      source: paper
      quote: It features publicly available sub-national yield statistics and relevant predictors, such as weather data,
        soil characteristics, and remote sensing indicators
      note: Leave-one-year-out validation is designed against spatial-temporal leakage within a split. The yield statistics
        themselves are public national records. No contamination evidence is reported.
  data.ceiling_anchor_type:
    - value: theoretical-maximum
      source: paper
      quote: 'Our library computes the following evaluation metrics: normalized root mean squared error (NRMSE; i.e., the
        root mean squared error normalized by the average yield of the test set), mean absolute percentage error (MAPE),
        and R-squared (R2).'
      note: NRMSE and MAPE are bounded at zero error and R2 at 1, and no measured anchor is published; the paper says it
        does not "define an upper bound on achievable yield prediction accuracy". 0.9.0's none-known exclusion sends a
        bounded metric with no measured anchor here.
  lifecycle:
    - value: proposed
      source: paper
      quote: While these results are only illustrative, a full comparison of methods, including systematic benchmarking
        and analysis of findings relative to existing datasets will be addressed in a dedicated follow-up study.
      note: The only results are the maintainers' illustrative release baselines, and the maintainers say systematic
        benchmarking has not begun and the leaderboard is not yet built, which 0.9.0's active exclusion calls proposed.
  activity:
    - value: accepting-submissions
      source: contributing
      quote: When you have such models tested and ready to be included in CY-Bench, we would appreciate your contributions.
      note: The contribution route is open now and CY-Bench has never run in rounds, so 0.9.0's leaderboard-live-no-round
        exclusion sends it here. The contributing guide also says "We are still working on putting the leaderboard in
        GitHub."
  governance.maintainer_type:
    - value: academic-lab
      source: paper
      quote: Artificial Intelligence Group, Wageningen University and Research
      note: The repository sits in the WUR-AI organisation, and project administration, software and funding are at
        Wageningen's AI group, although the AgML community conceived the benchmark. 0.9.0's holder rule gives
        academic-lab (the term's own cy-bench example).
  governance.submission_process:
    - value: maintainer-verified
      source: contributing
      quote: When you have finished making changes, create a pull request and request review from at least one reviewer.
      note: A contributor sends model code with self-computed results ('After your model runs and produces results,
        please send an email to AgML list email'), and code pull requests are reviewed. Whether the maintainers re-run
        is unstated, so the stated review decides (the term's own cy-bench example).
  governance.independence_flags:
    - value: no-known-conflict
      source: paper
      quote: The contact author has declared that none of the authors has any competing interests.
      note: Funding was from the WUR Research Investment Theme and the EU Digital Europe Programme (AgrifoodTEF). The
        only evaluated models are generic baselines, not a maintainer product. Searched 2026-09-28.
  execution.compute_tier:
    - value: single-gpu
      source: home
      quote: If run sequentially in a single capable GPU, the whole benchmark should take 50-60 hours to complete.
      note: The protocol fits each entrant per country and crop under leave-one-year-out validation, so fitting is part
        of producing the score. The reference environment lists 256GB RAM and 2TB disk; the maintainers ran countries in
        parallel on a GPU cluster.
  execution.reproducibility_tier:
    - value: fully-automatable
      source: paper
      quote: The complete code base encompassing data pre-processing, tools for model construction, training, evaluation,
        and data/metric visualization routines is available through our publicly accessible Zenodo repository
  execution.reproducibility_blockers: []
  execution.harness_availability:
    - value: official-harness
      source: home
      quote: is an open source python library to load CY-Bench dataset and run the CY-Bench tasks.
notes: The ESSD article (published 11 Jun 2026, corpus flag) and the GitHub README are the primary sources, with the
  contributing guide for the submission route. The paper names cybench.agml.org as an overview page, which was not
  fetched.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [capability, data.data_provenance, data.ceiling_anchor_type, lifecycle, activity, governance.maintainer_type, governance.submission_process]
    note: Re-adjudicated against 0.9.0; scientific-prediction, curated-public-database and the revised proposed,
          holder and maintainer-verified tests settle all five Stage 3 failures, including the blocking capability
          record. The reanalysis predictors add simulation-generated, the ceiling moves to theoretical-maximum and
          activity to accepting-submissions.

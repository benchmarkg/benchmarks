# taxonomy/_corpus/classifications/dcase-2026.yaml -- Stage 3 (03 S3.3), P1-S1-T05
id: dcase-2026
corpus_item: 78
curator: agent (P1-S1-T05)
classified_on: 2026-09-28
taxonomy_version: 0.9.0
sources:
  home: https://dcase.community/challenge2026/
  submission: https://dcase.community/challenge2026/submission
  t1: https://dcase.community/challenge2026/task-heterogeneous-audio-classification
  t2: https://dcase.community/challenge2026/task-first-shot-unsupervised-anomalous-sound-detection-for-machine-condition-monitoring
  t3: https://dcase.community/challenge2026/task-semantic-acoustic-imaging-for-sound-event-localization-and-detection-from-spatial-audio-and-audiovisual-scenes
  t4: https://dcase.community/challenge2026/task-spatial-semantic-segmentation-of-sound-scenes
  t5: https://dcase.community/challenge2026/task-audio-dependent-question-answering
  t7: https://dcase.community/challenge2026/task-domain-agnostic-incremental-learning-for-audio-classification
  news: https://dcase.community/news
facets:
  domain.primary:
    - value: audio-speech/audio-event-understanding
      source: home
      quote: to reliably recognize sound scenes and individual sound sources in realistic soundscapes
      note: Tasks 1 and 7 classify sounds; the other five tasks spread over four other subdomains, recorded as secondary.
        02 S12.9 decides DCASE's primary as audio-event-understanding and carries the per-task domains as children
        with domain_override (ADR-0020, no action).
  domain.secondary:
    - value: audio-speech/audio-event-detection-localization
      source: home
      quote: Acoustic Imaging SELD requires generating high-resolution semantic energy maps from low-channel audio,
        outputting dynamic polygon masks encoding event class, localization, and acoustic energy.
      note: Task 3. Task 4 (detection plus separation) is covered here only for its detection half; see the failure.
      failure: 2026-09-28-dcase-2026-002
    - value: audio-speech/machine-condition-monitoring
      source: home
      quote: Noise-aware Unsupervised Anomalous Sound Detection for Machine Condition Monitoring
    - value: multimodal/audio-language
      source: home
      quote: 'Audio-Dependent Question Answering (ADQA) is a multiple-choice question answering task where questions
        are specifically designed to be audio-dependent: the correct answer cannot be determined without listening
        to the audio.'
    - value: multimodal/cross-modal-retrieval
      source: home
      quote: Audio moment retrieval is the task of retrieving specific moments within long audio recordings that
        align with a given textual query.
  capability:
    - value: perception
      source: home
      quote: Developing signal processing methods to extract this information automatically has enormous potential
        in several applications
    - value: continual-learning
      source: t7
      quote: Continual learning aims to develop systems that can accumulate knowledge over time without forgetting
        previously learned tasks.
      note: Task 7 reveals three domains in sequence and ranks by accuracy averaged over all three.
    - value: distribution-shift-generalization
      source: home
      quote: such that the model can achieve higher detection performance regardless of environmental noise or occurrences
        of domain shifts.
      note: Task 2 scores source and target domains separately; the target domain differs in operating speed, load,
        noise and SNR.
    - value: grounding
      source: home
      quote: Audio moment retrieval is the task of retrieving specific moments within long audio recordings that
        align with a given textual query.
      note: Task 6 scores whether a text query is attached to the right stretch of audio (recall1@0.7 IoU).
    - value: temporal-reasoning
      source: home
      quote: The primary challenge is to capture temporal contexts within long audio, which requires effective sequence
        modeling and learning methods to enhance retrieval accuracy.
      note: Task 6, where the scored answer is a start and end time; the capabilities.yaml example for this entry
        cites onset and offset scoring.
  evaluation_method:
    - value: domain-metric
      source: t3
      quote: The primary ranking metric is the Mask mean Average Precision (Mask mAP), computed via the standard
        COCO evaluation protocol on the binarized rendered masks.
      note: Also Task 4 (CAPI-SDRi) and Task 6 (recall1@0.7 IoU).
    - value: classification-metric
      source: t1
      quote: The main metric will be macro-averaged hierarchical F-score
      note: Task 1. Task 2 ranks by the harmonic mean of AUC and partial AUC ('used to calculate an official score
        and a final ranking').
    - value: exact-match
      source: t7
      quote: Systems will be ranked by overall accuracy.
      note: Task 7. Plain per-item accuracy against a fixed label set, averaged over three domains, stays exact-match
        under 0.9.0's tie-break.
    - value: statistical-fit
      source: t3
      quote: For each spatially matched pair, the Pearson correlation coefficient is computed over the 2-pixel dilated
        union of their binary masks
    - value: composite
      source: t3
      quote: Overall ranking will be based on the cumulative rank of the metrics mentioned above, sorted in ascending
        order.
      note: Task 3 ranks by the sum of the Mask mAP rank and the Pearson r rank.
    - value: entrant-relative-ranking
      source: t3
      quote: Overall ranking will be based on the cumulative rank of the metrics mentioned above, sorted in ascending
        order.
      note: Task 3's cumulative rank depends on who else entered; 0.9.0 tags a rank aggregation across metrics of
        different methods as both composite and this term.
    - value: multiple-choice
      source: t5
      quote: The primary evaluation metric is Top-1 Accuracy on the ADQA-Bench.
  designed_for_subjects:
    - value: task-specific-supervised-model
      source: home
      quote: Participants are encouraged to explore audio-based, metadata-based, and multimodal approaches to sound
        classification
      note: Task-specific audio models trained on each task's development data; Task 5's audio-language models are
        fine-tuned on its training set. Sound classification is a general audio task, not a discipline.
  data.access:
    - value: train-open-test-held-out
      source: t1
      quote: The evaluation dataset, without ground truth labels, has been published so participants can run inference
        and submit a CSV file with the predictions for evaluation of the systems
      note: Every task published development data and label-free evaluation audio ("Release of evaluation datasets",
        1 June 2026).
  data.refresh:
    - value: periodic-recompetition
      source: news
      quote: The goal for DCASE 2026 Challenge is to foster gradual technology improvements through continuity of
        tasks, but also to bring novel research directions into the field
      note: Annual editions since 2016 with fresh evaluation sets; Task 1 evaluation sounds were uploaded to Freesound
        after 1 April 2025.
  data.data_provenance:
    - value: real-world-instrument
      source: home
      quote: additional data consisting of distant recordings of the machine
      note: Also the Task 3 microphone-array recordings and the Task 4 newly recorded sound events.
    - value: web-scraped
      source: home
      quote: two complementary Freesound-based datasets are provided
      note: Task 1 sounds are Freesound uploads with their user metadata.
    - value: crowd-authored
      source: home
      quote: a larger, noisier, crowd-sourced collection, BSD35k-CS, which reflects real-world labeling variability
    - value: simulation-generated
      source: t4
      quote: Each mixture is synthesized by convolving target and interference sources with RIRs and adding background
        noise
    - value: inherited-from-constituents
      source: home
      quote: The evaluation set, ADQA-Bench, is constructed by collecting samples from mainstream benchmarks
      note: Task 5 reuses samples of published benchmarks (MMAU, MMAR, MMSU) after filtering, and Task 7 draws on
        existing datasets including AudioSet.
  data.contamination_risk:
    - value: medium
      source: home
      quote: The evaluation set, ADQA-Bench, is constructed by collecting samples from mainstream benchmarks and
        applying multi-stage audio-dependency filtering, followed by careful data curation and data leakage prevention
        mechanisms, with final human verification.
      note: Task 5 draws part of its evaluation set from public benchmarks (MMAU, MMAR, MMSU) and Task 7 from sources
        including AudioSet, so routes are plausible for two tasks. No source measures contamination.
  data.ceiling_anchor_type:
    - value: none-known
      note: No task page reports a human baseline or states an anchor. The metrics differ by task, and CAPI-SDRi
        (Task 4) has no upper bound.
  lifecycle:
    - value: active
      source: news
      quote: The DCASE2026 Challenge results are now published.
      note: The 2026 edition ranked 421 submission entries; its workshop is in Boston.
  activity:
    - value: between-rounds
      source: news
      quote: The DCASE2026 Challenge results are now published.
      note: The yearly cycle opens with a call for task proposals. The latest news item is the 2026 results (1 July
        2026); no 2027 call is posted, and no standing leaderboard takes results. dcase-2026 is between-rounds'
        example.
  governance.maintainer_type:
    - value: conference-workshop
      source: news
      quote: The DCASE Steering Group has reviewed the task proposals for DCASE 2026 Challenge and selected seven
        tasks.
      note: Each edition's tasks are proposed and run by different teams and feed an annual workshop. 0.9.0's
        conference-workshop override holds even with a standing steering group (dcase-2026 is its example).
  governance.submission_process:
    - value: held-out-server
      source: submission
      quote: Participants run their system with an evaluation dataset, and produce the system output in the specified
        format.
      note: Outputs on label-free evaluation audio are scored by the organisers after the 15 June deadline. 0.9.0's
        held-out-server counts organiser scoring after a deadline against unseen labels.
    - value: publication-gated
      source: submission
      quote: Challenge submission consists of a submission package (one zip package) containing system outputs,
        system meta information, and technical report (pdf file).
  governance.independence_flags:
    - value: maintainer-competes-on-own-benchmark
      source: t1
      quote: Baseline_UPF_task1_2 HATR baseline (multimodal)
      note: Organiser baselines are ranked in the published tables (Task 1 is organised by UPF). The Task 1 winner
        is Primus_CPJKU, and a Task 6 organiser is Paul Primus of JKU Linz. Industry organisers (Hitachi, NTT, Sony,
        Ant Group, LY Corporation) lead tasks; no prize or sponsor is named on the fetched pages.
  execution.compute_tier:
    - value: null
      source: submission
      quote: '# Number of GPUs used for training gpu_count: 4'
      failure: 2026-09-28-dcase-2026-007
  execution.reproducibility_tier:
    - value: not-independently-reproducible
      source: t1
      quote: The evaluation dataset, without ground truth labels, has been published
      note: As of this record. Task 2 is "planning to provide ground truth labels for the evaluation dataset after
        the challenge has finished", which would make it reproducible.
  execution.reproducibility_blockers:
    - value: private-test-set
      source: t1
      quote: The evaluation dataset, without ground truth labels, has been published
  execution.harness_availability:
    - value: official-harness
      source: t1
      quote: The baseline system code includes an implementation of such evaluation metrics that can be usd by the
        parcipants of the task.
      note: Task 2 also links its evaluator ("DCASE2026 Task 2 evaluator, repository"). The official scores are
        computed by the organisers.
notes: The corpus entry is the whole 2026 challenge (seven tasks), classified as one family per 02 S11 rule 5. There
  is no overview paper, so the challenge page, the submission rules, the seven task pages and the news page were
  read; the ones quoted are listed in sources. Metrics, data and harnesses differ by task, and single-valued fields
  record the dominant case with the spread in notes and failures.
revisions:
  - by: agent (P1-S1-T08)
    on: 2026-09-28
    taxonomy_version: 0.9.0
    fields: [domain.primary, evaluation_method, designed_for_subjects, data.data_provenance, activity,
      governance.maintainer_type, governance.submission_process]
    note: Re-adjudicated against 0.9.0; classification metrics, the Task 3 rank aggregation and the new subject term added.

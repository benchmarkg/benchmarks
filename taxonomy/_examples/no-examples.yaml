# taxonomy/_examples/no-examples.yaml -- the subdomains that could not be given examples from the catalogue
# (P1-S14-T11; 03 S5, 02 S11 rule 8)
#
# P1-S14-T11 draws at least two examples[] for every subdomain of taxonomy/domains.yaml from entries already in
# data/benchmarks/, at least one of them a near-miss with `qualifies: false`, and never writes a ref that names
# a benchmark not in data/: "A fabricated example is worse than a missing one: it survives review because it
# reads correctly." Where no catalogued entry carries a subdomain, as its domain.primary or in domain.secondary,
# there is nothing to draw a positive example from, and the task says to leave examples[] empty and record why,
# "so P1-S14-T06's retirement decision has evidence rather than a blank". This file is that record. P1-S14-T06
# reads it beside the terms' examples[].
#
# One row per subdomain that does not reach two examples with at least one positive and one near-miss:
# `term`, `carrying_entries` (the number of catalogued entries that carry it as primary or secondary on
# drafted_on, data/benchmarks/_stubs/ excluded), `reason` (what was looked for and what is missing) and
# `survey_note` (the dated note under data/surveys/ that covers the subdomain, or null where none exists). A
# term that catalogued entries weighed and rejected in `domain_considered_and_rejected` carries up to two of those
# rejections as near-misses in domains.yaml although it has no positive, and its row names every rejecting
# entry. A row is withdrawn when an entry that carries the term is catalogued and the term's examples are
# drawn from it.
#
# Why here and not in taxonomy/: schema/taxonomy.py loads every taxonomy/*.yaml as a vocabulary through a model,
# and this file is a record, not a vocabulary, so it sits beside taxonomy/_failures/ and taxonomy/_triage/.
#
# Status: agent-drafted (P1-S14-T11). A person accepts or amends each row.


# data/systems/fuxi.yaml -- P3-S7-T05 (04 S7). Thin: only what its WeatherBench 2 claim needs
# (data/claims/weatherbench-2/), where the maintainers' results files call it `fuxi`
# (benchmark_results/fuxi_vs_era5_240x121_2020.nc).
#
# system_type scientific-surrogate-model: a learned weather model standing in for a numerical forecast system and
# scored against reanalysis (taxonomy/subjects.yaml, whose example is WeatherBench 2); so its claims are not LLM-run
# (tools/report/llm_run.py). It is one system although it is a cascade: the FAQ describes "specific models trained
# for short (0-5 days), medium (5-10 days) and long-range (10-15 days) prediction" (src-weatherbench-2-faq), and the
# site scores the cascade as one forecast. The site's participating-models table reads "FuXi Fudan University,
# Shanghai ML-based Forecast (deterministic) ERA5 0.25°" (src-weatherbench-2-homepage); organization is left out
# because org-fudan-university is only an unpromoted Epoch stub, which a curated record may not name, and promoting
# it is the identity review's (04 S10). The paper's Table 1 lists its training data as ERA5 1979-2017
# (src-weatherbench-2-arxiv-html). availability research-only: no source read says where or under what terms the
# model can be obtained; a reviewer confirms. Release date, size and compute are not curated.
id: fuxi
name: FuXi
system_type: scientific-surrogate-model
availability: research-only
external_ids:
  weatherbench2_results: fuxi
sources:
  - src-weatherbench-2-homepage
  - src-weatherbench-2-faq
  - src-weatherbench-2-arxiv-html

# data/systems/orb-v2-mptrj.yaml -- P3-S7-T01 (04 S7). Thin: only what its Matbench Discovery claim
# (data/claims/matbench-discovery/) needs.
# The row "ORB MPtrj" of the Matbench Discovery v1 unique-prototype table, trained on MPtrj, added to the
# leaderboard 2024-10-14 (src-github-matbench-discovery-metrics-table-uniq-protos-6d587c1); the archived
# leaderboard capture of 2026-06-10 names the same row "ORB v2 MPtrj", with the same date, parameter count and
# metrics (src-matbench-discovery-homepage), and that is the name used here. Not "ORB" (ORB v2 on the board),
# trained on MPtrj and Alexandria, a separate row and System.
#
# system_type scientific-surrogate-model: a learned interatomic potential that stands in for DFT and is scored
# against it, the term's inclusion test (taxonomy/subjects.yaml) and the entry's designed_for_subjects; so its
# claims are not LLM-run (tools/report/llm_run.py). organization is left null and availability is research-only:
# the developer, whether weights or code are released, the release date, size and licence were not looked for
# beyond the table, whose parameter count is rounded. A reviewer confirms.
id: orb-v2-mptrj
name: ORB v2 MPtrj

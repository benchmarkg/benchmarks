# data/systems/canary-1b-v2.yaml -- P3-S8-T08 (04 S7). Thin: only what the Open ASR Leaderboard claims
# (data/claims/open-asr-leaderboard/) need, where the board lists it as `nvidia/canary-1b-v2`.
#
# system_type task-specific-supervised-model: a speech recogniser scored as trained rather than instructed, the
# term's inclusion test, whose example is this board (taxonomy/subjects.yaml); so its claims are not LLM-run
# (tools/report/llm_run.py). It is not nvidia/canary-qwen-2.5b, a separate row on the board. open_weights: the board
# marks the row with its hugging-face emoji, which the plot legend reads "🤗 indicates open weights"
# (src-hf-open-asr-leaderboard-config-7f8e531); availability generally-available follows from the open weights and
# is a reviewer's to confirm. organization is left out: the board's `nvidia/` namespace is NVIDIA's, but org-nvidia
# is only an unpromoted Epoch stub, which a curated record may not name, and promoting it is the identity review's
# (04 S10). Release date, licence and size are not in the source read and are left out.
id: canary-1b-v2
name: nvidia/canary-1b-v2
system_type: task-specific-supervised-model
modalities_in:
  - audio
modalities_out:
  - text
open_weights: true
availability: generally-available
external_ids:
  huggingface: nvidia/canary-1b-v2
sources:

# data/systems/pdebench-fno.yaml -- P3-S7-T07 (04 S7). Thin: only what PDEBench's claims
# (data/claims/pdebench/) need. The paper's FNO baseline, trained by its authors for each PDE dataset and
# parameter value on 90% of its samples, "For FNO, we followed the original implementation, hyperparameters,
# and training protocols" (src-arxiv-2210-07182-v7-html); a claim names its PDE in subset_used. Not
# the-well-fno: another paper's training of the same architecture, on other data.
# system_type scientific-surrogate-model: a learned model standing in for the numerical solver and scored
# against its output, the entry's designed_for_subjects; so its claims are not LLM-run
# (tools/report/llm_run.py).
# availability research-only: the paper offers pre-trained baselines on DaRUS, not checked for these PDEs,
# so open_weights is left out. A reviewer confirms.
id: pdebench-fno
name: FNO (PDEBench baseline)
organization: org-pdebench
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-arxiv-2210-07182-v7-html

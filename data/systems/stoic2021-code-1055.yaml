# data/systems/stoic2021-code-1055.yaml -- P3-S8-T03 (04 S7). Thin: only what its STOIC2021 claim needs
# (data/claims/stoic2021/). The Final phase codebase of the team Code 1055, which the paper names as the one
# "which achieved the highest AUC for discriminating between severe and non-severe COVID-19 in the Final phase";
# section 3.3.1 describes it as a 3D version of the ConvNeXt architecture ("the first 3D version of this
# architecture"), pretrained on public data ("we pretrain our network on two additional datasets") and trained by
# the organisers on the sequestered training set B (src-arxiv-2306-10484-v2-2026-11-25).
#
# Named by the team name, which is neither a person's name nor a handle, and the architecture. system_type
# domain-specialist-model: a CT classifier built for this prognosis task (stoic2021's designed_for_subjects), so its
# claim is not LLM-run (tools/report/llm_run.py). availability research-only: the paper links the codebase from
# the organisers' GitHub organisation ("Public code for training and inference publicly available at") and a
# public Grand Challenge algorithm; whether the trained weights may be used outside research was not read.
# organization is null: the team's affiliation is not in a passage the extract keeps. A reviewer confirms.
id: stoic2021-code-1055
name: Code 1055 3D ConvNeXt (STOIC2021 Final phase)
system_type: domain-specialist-model
availability: research-only
sources:
  - src-arxiv-2306-10484-v2-2026-11-25

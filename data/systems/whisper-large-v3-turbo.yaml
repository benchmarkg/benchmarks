# data/systems/whisper-large-v3-turbo.yaml -- P3-S8-T08 (04 S7). Thin: only what the Open ASR Leaderboard
# claims (data/claims/open-asr-leaderboard/) need, where the board lists it as `openai/whisper-large-v3-turbo`.
#
# system_type task-specific-supervised-model: a speech recogniser scored as trained rather than instructed, the
# term's inclusion test, whose example is this board (taxonomy/subjects.yaml); so its claims are not LLM-run
# (tools/report/llm_run.py). open_weights: the board marks the row with its hugging-face emoji, which the plot
# legend reads "🤗 indicates open weights" (src-hf-open-asr-leaderboard-config-7f8e531); availability
# generally-available follows from the open weights and is a reviewer's to confirm. organization: the board's
# `openai/` namespace. It is its own System, not a version of whisper-large-v3: the board ranks the two as
# separate models with their own rows, and how the turbo checkpoint derives from large-v3 is not in the source
# read (a reviewer may add a built_on). Release date, licence and size are left out for the same reason.
id: whisper-large-v3-turbo
name: openai/whisper-large-v3-turbo
organization: org-openai
system_type: task-specific-supervised-model
modalities_in:
  - audio
modalities_out:
  - text
open_weights: true
availability: generally-available
external_ids:
  huggingface: openai/whisper-large-v3-turbo
sources:
  - src-hf-open-asr-leaderboard-config-7f8e531

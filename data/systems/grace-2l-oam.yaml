# data/systems/grace-2l-oam.yaml -- P3-S7-T02 (04 S7). Thin: only what its Matbench Discovery claim
# (data/claims/matbench-discovery/) needs.
# The row "GRACE-2L-OAM" of the Matbench Discovery v1 unique-prototype table, trained on OMat24, sAlex and
# MPtrj, added to the leaderboard 2025-02-06 (src-github-matbench-discovery-metrics-table-uniq-protos-6d587c1);
# the archived leaderboard capture of 2026-06-10 lists it under the same name (src-matbench-discovery-homepage).
# Not GRACE-2L-OAM-L, a later row on the board with its own parameter count, nor the GRACE-2L row trained on
# MPtrj alone; neither has a System.
#
# system_type scientific-surrogate-model: a learned interatomic potential that stands in for DFT and is scored
# against it, the term's inclusion test (taxonomy/subjects.yaml) and the entry's designed_for_subjects; so its
# claims are not LLM-run (tools/report/llm_run.py). organization is left null and availability is research-only:
# the developer, whether weights or code are released, the release date, size and licence were not looked for
# beyond the table, whose parameter count is rounded. A reviewer confirms.
id: grace-2l-oam
name: GRACE-2L-OAM
system_type: scientific-surrogate-model
availability: research-only

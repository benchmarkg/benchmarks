# data/systems/the-well-cnextu-net.yaml -- P3-S7-T07 (04 S7). Thin: only what The Well's claims
# (data/claims/the-well/) need. The paper's CNextU-net baseline, "a modernized U-net using ConvNext blocks
# [100, CNextU-net]" (src-arxiv-2412-00568-v3-html), trained by its authors for each dataset separately
# (Table 6 gives a learning rate and epoch count per dataset and model), so one record stands for the
# architecture under the paper's recipe and a claim names its dataset in subset_used. Named with the benchmark
# so that it is not read as the architecture trained by anyone.
# system_type scientific-surrogate-model: a learned model standing in for the numerical solver and scored
# against its output, the entry's designed_for_subjects; so its claims are not LLM-run
# (tools/report/llm_run.py).
# availability research-only: the README says most baseline checkpoints are on Hugging Face, which was not
# checked for this one, so open_weights is left out. A reviewer confirms.
id: the-well-cnextu-net
name: CNextU-net (The Well baseline)
organization: org-polymathic-ai
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-arxiv-2412-00568-v3-html

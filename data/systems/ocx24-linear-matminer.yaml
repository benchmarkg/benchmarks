# data/systems/ocx24-linear-matminer.yaml -- P3-S7-T04 (04 S7). Thin: only what its OCx24 claim (data/claims/oc20/)
# needs. The OCx24 paper's second linear model for hydrogen evolution, which predicts the measured cell voltage from
# Matminer features instead of adsorption energies: "R2 = 0.59 for adsorption energies and R2 = 0.53 for Matminer
# features", and "Using these linear models, we performed inference" (src-arxiv-2411-11783-v1). Refitted on every
# cross-validation fold, so one record stands for the model under the paper's recipe; named with the dataset so that it
# is not read as a linear regression anyone ran.
#
# system_type scientific-surrogate-model, organization org-open-catalyst-project and availability research-only, for the
# reasons data/systems/ocx24-linear-h-oh-adsorption.yaml gives. A reviewer confirms.
id: ocx24-linear-matminer
name: Linear model on Matminer features (OCx24 baseline)
organization: org-open-catalyst-project
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-arxiv-2411-11783-v1

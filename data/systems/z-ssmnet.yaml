# data/systems/z-ssmnet.yaml -- P3-S8-T04 (04 S7). Thin: only what its PI-CAI claim needs (data/claims/pi-cai/).
# The Zonal-aware Self-supervised Mesh Network of src-arxiv-2212-05808-v2, the model that "was ranked first place"
# in
# the PI-CAI Open Development Phase: 2D, 2.5D and 3D convolutions in one mesh network, pre-trained by
# self-supervised learning "using large-scale unlabeled data", with a zonal-anatomy prior from a segmentation
# model trained on public prostate datasets.
#
# Named as its paper names it. system_type domain-specialist-model: a prostate MRI detection and diagnosis model
# (pi-cai's designed_for_subjects), so its claim is not LLM-run (tools/report/llm_run.py). availability
# research-only: the paper links its code from a personal GitHub account (not quoted, being a handle); no source
# read says the trained weights were released. organization org-university-of-sydney: the byline places the
# team there, in a passage that names its authors and is not quoted. A reviewer confirms.
id: z-ssmnet
name: Z-SSMNet (PI-CAI Open Development Phase)
organization: org-university-of-sydney
system_type: domain-specialist-model
availability: research-only
sources:
  - src-arxiv-2212-05808-v2

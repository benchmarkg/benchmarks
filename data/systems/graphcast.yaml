# data/systems/graphcast.yaml -- P3-S7-T05 (04 S7). Thin: only what its WeatherBench 2 claim needs
# (data/claims/weatherbench-2/), where the maintainers' results files call it `graphcast`
# (benchmark_results/graphcast_vs_era5_240x121_2020.nc).
#
# system_type scientific-surrogate-model: a learned weather model standing in for a numerical forecast system and
# scored against reanalysis, the term's inclusion test, whose example is WeatherBench 2 (taxonomy/subjects.yaml); so
# its claims are not LLM-run (tools/report/llm_run.py). organization org-google-deepmind: the Source column of the
# site's participating-models table, "GraphCast Google DeepMind ML-based Forecast (deterministic) ERA5 0.25°"
# (src-weatherbench-2-homepage). The claim is on the version WeatherBench 2 scores for 2020, "a version of GraphCast
# that was trained on ERA5 data from 1979 to 2019 (incl.)" (src-weatherbench-2-faq); GraphCast (oper.), "finetuned
# and initialized with the operational IFS HRES analysis", is a separate row on the site and not this record's
# claim. availability research-only: the FAQ points to public code at github.com/google-deepmind/graphcast, and the
# weights' release and licence were not read, so a reviewer confirms. Release date, size and compute are not curated.
id: graphcast
name: GraphCast
organization: org-google-deepmind
system_type: scientific-surrogate-model
availability: research-only
external_ids:
  weatherbench2_results: graphcast
sources:
  - src-weatherbench-2-homepage
  - src-weatherbench-2-faq

# data/systems/pdebench-u-net.yaml -- P3-S7-T07 (04 S7). Thin: only what PDEBench's claims
# (data/claims/pdebench/) need. The paper's U-Net baseline, "We trained U-Net similarly to FNO, but with the
# autoregressive methods with the pushforward trick" (src-arxiv-2210-07182-v7-html), for each PDE dataset on
# 90% of its samples; a claim names its PDE in subset_used.
# system_type scientific-surrogate-model: a learned model standing in for the numerical solver and scored
# against its output, the entry's designed_for_subjects; so its claims are not LLM-run
# (tools/report/llm_run.py).
# availability research-only, as for pdebench-fno. A reviewer confirms.
id: pdebench-u-net
name: U-Net (PDEBench baseline)
organization: org-pdebench
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-arxiv-2210-07182-v7-html

# data/systems/cluspro-lab-expert.yaml -- P3-S8-T01 (04 S7). Thin: only what its CASP claim needs (data/claims/casp/).
# The CASP16 human (expert) group of the lab whose server group is cluspro: "both ClusPro (server group) and [name
# redacted] (human group from the same lab)" (src-casp16-complex-2026-11-24); group 274 in the ligand assessment
# ("leading accuracy from groups Cluspro (494), [name redacted] (274)", src-casp16-ligand-2026-11-24).
#
# Named by the method's published name, ClusPro, which the lab's two groups share ("The leading ClusPro and [name
# redacted] groups used the same methodology run with different parameters"), with the group number to tell it from
# the server. Left out: the group's registered name, which joins its two lab heads' surnames (the extracts replace
# it with [name redacted]); the assessment papers read give no institution for it, so none is recorded and
# organization stays null. system_type human-ai-team: a human group steering automated tools, here AlphaFold
# monomers and FFT docking ("group appears to have used AF to generate a diverse set of monomers, performed
# extensive FFT-based docking", src-casp16-complex-2026-11-24), the term's CASP16 example in taxonomy/subjects.yaml.
# availability never-released: a group's hand-run protocol is not something a reader can obtain.
id: cluspro-lab-expert
name: ClusPro lab expert group (CASP16 group 274)
system_type: human-ai-team
availability: never-released
external_ids:
  casp16_group: '274'
sources:
  - src-casp16-complex-2026-11-24
  - src-casp16-ligand-2026-11-24

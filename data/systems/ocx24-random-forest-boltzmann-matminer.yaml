# data/systems/ocx24-random-forest-boltzmann-matminer.yaml -- P3-S7-T04 (04 S7). Thin: only what its two OCx24 claims
# (data/claims/oc20/) need. The OCx24 paper's model for CO2 reduction: "For each product, we independently fit a random
# forest regressor to predict the production rate", and "Boltzmann weighted adsorption energies and Matminer elemental
# features were used as inputs" (src-arxiv-2411-11783-v1). One regressor is fitted per product and per cross-validation
# fold, so one record stands for the recipe and a claim names its product in its conditions' subset_used; named with the
# dataset so that it is not read as a random forest anyone ran.
#
# Its two claims are one model under the paper's two cross-validation strategies, which are two subsets of oc20, so they
# are two measurements and no conflict (tools/report/conflicts.py keys on the subset).
#
# system_type scientific-surrogate-model, organization org-open-catalyst-project and availability research-only, for the
# reasons data/systems/ocx24-linear-h-oh-adsorption.yaml gives. A reviewer confirms.
id: ocx24-random-forest-boltzmann-matminer
name: Random forest on Boltzmann-weighted adsorption energies and Matminer features (OCx24 baseline)
organization: org-open-catalyst-project
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-arxiv-2411-11783-v1

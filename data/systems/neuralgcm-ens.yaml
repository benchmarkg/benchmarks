# data/systems/neuralgcm-ens.yaml -- P3-S7-T05 (04 S7). Thin: only what its WeatherBench 2 claim needs
# (data/claims/weatherbench-2/), where the maintainers' results files call it `neuralgcm_ens`
# (benchmark_results/neuralgcm_ens_vs_era5_240x121_2020.nc).
#
# The ensemble version of NeuralGCM, a system of its own: the site lists "NeuralGCM ENS Google Research Hybrid
# Forecast (Ensemble) ERA5 1.4°" and the deterministic "NeuralGCM 0.7°" as two rows (src-weatherbench-2-homepage), and
# the FAQ says "The deterministic simulations are run at 0.7 degrees and a 50 member ensemble was created at 1.4
# degrees" (src-weatherbench-2-faq). Whether the two belong in one System with two SystemVersions is a reviewer call.
# system_type scientific-surrogate-model, not classical-algorithm: "NeuralGCM combines a differentiable solver for
# atmospheric dynamics with ML components" (src-weatherbench-2-faq), and a learned component rules the second term
# out (the entry's designed_for_subjects_considered_and_rejected); so its claims are not LLM-run
# (tools/report/llm_run.py). Whether a hybrid fits the first term is the same reviewer check the entry carries.
# organization org-google-research: the table's Source column. Google Research also maintains WeatherBench 2, which
# is why the entry sets maintainer-competes-on-own-benchmark. The paper's Table 1 lists its training data as ERA5
# 1979-2017 (src-weatherbench-2-arxiv-html). availability research-only: no source read says where or under what
# terms the model can be obtained; a reviewer confirms. Release date, size and compute are not curated.
id: neuralgcm-ens
name: NeuralGCM ENS
organization: org-google-research
system_type: scientific-surrogate-model
availability: research-only
external_ids:
  weatherbench2_results: neuralgcm_ens
sources:
  - src-weatherbench-2-homepage
  - src-weatherbench-2-faq
  - src-weatherbench-2-arxiv-html

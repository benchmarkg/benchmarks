# Named as the paper names it. system_type domain-specialist-model: a CT nodule detector trained on the
# challenge's scans (luna16's designed_for_subjects), so its claim is not LLM-run (tools/report/llm_run.py).
# availability research-only: no source read says the trained models were released. organization is null: no
# passage read places its developers. A reviewer confirms.
id: luna16-znet
name: ZNET (LUNA16 nodule detection)
system_type: domain-specialist-model
availability: research-only
sources:
  - src-arxiv-1612-08012-v4-2026-11-26

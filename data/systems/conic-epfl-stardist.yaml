# branch added for the nucleus classes (src-arxiv-2303-06274-v2-2026-11-25).
#
# Named as the paper and the board name the team: an institute and a method, no person. system_type
# domain-specialist-model: a nucleus segmentation and classification model trained on the challenge's data
# (conic's designed_for_subjects). availability research-only: the organisers released the original algorithms
# of the teams that agreed ("Docker containers are available for download by visiting
# https://warwick.ac.uk/conic-challenge."); whether this team agreed was not read. organization is null: EPFL
# has no Organization record, and the team's name is the only place the paper gives it. A reviewer confirms.

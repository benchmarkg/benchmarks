# data/systems/cluspro.yaml -- P3-S8-T01 (04 S7). Thin: only what its CASP claims need (data/claims/casp/). The CASP16
# server group of the lab whose human group is cluspro-lab-expert: "both ClusPro (server group) and [name redacted]
# (human group from the same lab)" (src-casp16-complex-2026-11-24). The ligand assessment numbers it group 494 ("Each
# group has a unique number, for example, group 494, ... and a unique name, such as ClusPro") and says the lab's two
# groups "used the same methodology run with different parameters" (src-casp16-ligand-2026-11-24).
#
# Named by the method's published name, which is also the group's registered name. system_type
# domain-specialist-model: a docking pipeline built for protein complexes. The complex assessment describes the lab's
# human group building AlphaFold monomers and docking them by FFT search, which would make the shared methodology
# partly learned, but the server's own pipeline is not described in the extracts read, so classical-algorithm is
# the alternative a reviewer weighs. availability research-only: no source read here says whether the server is open
# to the public; a reviewer confirms.
id: cluspro
name: ClusPro
system_type: domain-specialist-model
availability: research-only
external_ids:
  casp16_group: '494'
sources:
  - src-casp16-complex-2026-11-24
  - src-casp16-ligand-2026-11-24

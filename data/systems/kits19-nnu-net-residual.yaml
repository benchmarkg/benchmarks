# data/systems/kits19-nnu-net-residual.yaml -- P3-S8-T03 (04 S7). Thin: only what its KiTS19 claim needs
# (data/claims/kits/). The submission that placed first at KiTS19 (section 5.1 of src-arxiv-1912-01054-v2-2026-11-25):
# "an ensemble of the Residual 3D U-Net networks from all" five cross-validation folds, which the paper reads as
# nnU-Net's win ("nnU-Net demonstrated top performance despite attempts by several teams to enhance it.").
#
# Named for its method. Section 5.1 names the two researchers at the German Cancer Research Center who made the
# submission; the passage is outside every window and they are not named here. system_type
# domain-specialist-model: a CT segmentation model trained on the challenge's data (kits's
# designed_for_subjects). built_on is empty because nnU-Net has no System record. availability research-only:
# no source read says the submission's weights were released. organization is null: the German Cancer Research
# Center has no Organization record, and the passage that names it names people. kits's review_checks already
# weigh DKFZ's later role as a KiTS co-organiser (2021 on). A reviewer confirms.
id: kits19-nnu-net-residual
name: nnU-Net residual 3D U-Net ensemble (KiTS19 first place)
system_type: domain-specialist-model
availability: research-only
sources:
  - src-arxiv-1912-01054-v2-2026-11-25

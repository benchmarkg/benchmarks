# data/systems/the-well-fno.yaml -- P3-S7-T07 (04 S7). Thin: only what The Well's claims
# (data/claims/the-well/) need. The paper's Fourier Neural Operator baseline, "the Fourier Neural Operator
# [97, FNO]" (src-arxiv-2412-00568-v3-html), trained by its authors for each dataset separately (Table 6), so
# one record stands for the architecture under the paper's recipe and a claim names its dataset in
# subset_used. Not pdebench-fno: another paper's training of the same architecture, on other data.
# system_type scientific-surrogate-model: a learned model standing in for the numerical solver and scored
# against its output, the entry's designed_for_subjects; so its claims are not LLM-run
# (tools/report/llm_run.py).
# availability research-only: the README loads polymathic-ai/FNO-active_matter as its example checkpoint;
# whether the shear_flow one is published was not checked, so open_weights is left out. A reviewer confirms.
id: the-well-fno
name: FNO (The Well baseline)
organization: org-polymathic-ai
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-arxiv-2412-00568-v3-html

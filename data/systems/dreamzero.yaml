# data/systems/dreamzero.yaml -- P3-S6-T05 (04 S7). Thin: only what RoboArena's rating pools need
# (data/rating-pools/pool-roboarena-*.yaml), where the board's backend id is `dreaming_zebra`, and the site shows it
# as "DreamZero".
#
# system_type physical-robot-system: taxonomy/subjects.yaml's RoboArena example, the entrant is the policy running
# on the evaluators' DROID arms. availability and open_weights: the board flags it open_source, which the RoboArena
# paper defines as trained only on publicly available data with weight access (src-roboarena-arxiv-html); the
# weights themselves were not looked for. DreamZero is the policy src-dreamzero-arxiv-abs introduces, the entry's
# learned-entrant evidence.
id: dreamzero
name: DreamZero
system_type: physical-robot-system
open_weights: true
availability: generally-available
external_ids:
  roboarena_policy: dreaming_zebra
sources:
  - src-roboarena-api-leaderboard-history-2026-11-19
  - src-roboarena-site-bundle-2026-11-19
  - src-roboarena-arxiv-html
  - src-dreamzero-arxiv-abs

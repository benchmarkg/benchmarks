# data/systems/falcon-7b.yaml -- P3-S5-T02 (04 S7), promoted from P3-S3-T04's Epoch stub, thinly: what the
# falcon-7b MMLU claims (data/claims/mmlu/) need. The first-generation Falcon base model, from TII.
#
# system_type base-model: a pretrained model with no instruction tuning, which is how every one of the six
# reports evaluates it (few-shot, beside other base models). open_weights and availability: Epoch's
# model_metadata.csv records it "Open weights (unrestricted)". first_released is Epoch's date for its one
# version. The training-compute figure and its working are Epoch's, kept verbatim. training_compute_estimated
# true: it is 6ND arithmetic from the disclosed parameter and token counts, not a FLOP figure TII published --
# the honest-arithmetic kind 04 S7 distinguishes from compute imputed from benchmark scores, which the notes show.
id: falcon-7b
name: Falcon-7B
organization: org-technology-innovation-institute
system_type: base-model
open_weights: true
first_released: 2023-04-24
training_compute_flop: 6.3e+22
training_compute_estimated: true
training_compute_notes: "6ND = 6 * 7B * 1.5T = 6.3e22\n\"Falcon-7B is a 7B parameters causal decoder-only
  model built by TII and trained on 1,500B tokens of RefinedWeb enhanced with curated corpora. It is made
  available under the Apache 2.0 license.\"\n\nTable 1 from https://arxiv.org/pdf/2311.16867 Falcon paper\n\
  \n730 petaflop-days * 1e15 * 24 * 3600 = 6.3072e+22 FLOPs"
availability: generally-available
external_ids:
  epoch_model_group: Falcon-7B
sources:
  - src-epoch-benchmark-data
  - src-arxiv-2407-14885

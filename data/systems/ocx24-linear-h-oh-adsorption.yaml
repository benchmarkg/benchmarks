# data/systems/ocx24-linear-h-oh-adsorption.yaml -- P3-S7-T04 (04 S7). Thin: only what its OCx24 claim
# (data/claims/oc20/) needs. The OCx24 paper's linear model for hydrogen evolution, which predicts the measured cell
# voltage from computed adsorption energies: "Models were trained to predict the cell voltage at 50 mA/cm2 production
# rate using the adsorption energies of H and OH as features", and "Using these linear models, we performed inference"
# (src-arxiv-2411-11783-v1). It is refitted on every cross-validation fold, so one record stands for the model under the
# paper's recipe; named with the dataset so that it is not read as a linear regression anyone ran.
#
# system_type scientific-surrogate-model: a learned model that stands in for a laboratory assay and is scored against
# what the assay measured, the term's inclusion test (taxonomy/subjects.yaml) and the oc20 entry's
# designed_for_subjects; so its claim is not LLM-run (tools/report/llm_run.py). organization org-open-catalyst-project:
# the paper's authors fitted it, and the oc20 entry records the three generations under that one maintainer; the paper's
# affiliations are wider (a university and a company beside FAIR at Meta and CMU), which no Organization record holds.
# availability research-only: whether its code is released was not looked for. A reviewer confirms both.
id: ocx24-linear-h-oh-adsorption
name: Linear model on H and OH adsorption energies (OCx24 baseline)
organization: org-open-catalyst-project
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-arxiv-2411-11783-v1

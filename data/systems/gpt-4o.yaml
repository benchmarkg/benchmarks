# data/systems/gpt-4o.yaml -- P3-S5-T03 (04 S7). GPT-4o as a model family, its API snapshots as versions.
#
# Why a family record when P3-S3-T04 stubbed each snapshot as its own System (data/systems/_stubs/
# gpt-4o-may-2024.yaml, -aug-2024, -nov-2024): three of the four SWE-bench Verified rows in Agentless's
# Table 6 say "GPT-4o" and no snapshot, so a scaffold built on one of them can only name the family. Agentless
# names its own snapshot (gpt-4o-2024-05-13), so its scaffold is built on gpt-4o@2024-05-13. Whether the
# snapshot stubs become versions of this record, or this record is replaced, is the identity reviewer's
# call (04 S10); until then the stubs stay where they are. The versions are the API snapshots Epoch's
# model_metadata.csv records, with their dates; availability is Epoch's "API access", retirements unchecked.

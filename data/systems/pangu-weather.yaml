# data/systems/pangu-weather.yaml -- P3-S7-T05 (04 S7). Thin: only what its WeatherBench 2 claim needs
# (data/claims/weatherbench-2/), where the maintainers' results files call it `pangu`
# (benchmark_results/pangu_vs_era5_240x121_2020.nc).
#
# system_type scientific-surrogate-model: a learned weather model standing in for a numerical forecast system and
# scored against reanalysis (taxonomy/subjects.yaml, whose example is WeatherBench 2); so its claims are not LLM-run
# (tools/report/llm_run.py). The site's participating-models table reads "Pangu-Weather Huawei ML-based Forecast
# (deterministic) ERA5 0.25°" (src-weatherbench-2-homepage); organization is left out because no Organization record
# for Huawei exists, and adding one is the identity review's (04 S10). The claim is on the ERA5-initialised version,
# which "is trained using ERA5 data from 1979 to 2017 (incl.) with 2019 for validation and 2018, 2020 and 2021 for
# testing" (src-weatherbench-2-faq); Pangu-Weather (oper.), "initialized with the operational IFS HRES analysis", is
# a separate row on the site. availability research-only: the FAQ links inference code held under a personal
# account, so its URL is not recorded here, and the weights' licence was not read; a reviewer confirms. Release
# date, size and compute are not curated.
id: pangu-weather
name: Pangu-Weather
system_type: scientific-surrogate-model
availability: research-only
external_ids:
  weatherbench2_results: pangu
sources:
  - src-weatherbench-2-homepage
  - src-weatherbench-2-faq

# data/systems/hephy-higgsml-2024.yaml -- P3-S7-T07 (04 S7). Thin: only what the FAIR Universe HiggsML
# Uncertainty Challenge claims (data/claims/fair-universe-higgsml/) need. The HEPHY team's entry to the 2024
# challenge, ranked joint first on the private hold-out set (src-fair-universe-higgs-challenge-site); the team
# is named for its institute, the Institute of High Energy Physics in Vienna. Its method, simulation-based
# inference with a calibrated multiclassifier and parametric regressors, is section 5.1 of the paper, "We use
# simulation-based inference (SBI)" (src-arxiv-2410-02867-v5).
#
# system_type domain-specialist-model, the entry's designed_for_subjects: an inference pipeline built for this
# particle-physics measurement and trained on its data; so its claims are not LLM-run (tools/report/llm_run.py).
# availability research-only: section 5.1 says its code-base is public; that repository, which may sit under a
# personal account, is not recorded. organization is left null rather than adding an Organization for the
# institute, as the DCASE systems do. Only this finalist is curated: the other two entered under handles
# formed from their members' names. A reviewer confirms.
id: hephy-higgsml-2024
name: HEPHY (HiggsML Uncertainty Challenge 2024)
system_type: domain-specialist-model
availability: research-only
sources:
  - src-fair-universe-higgs-challenge-site
  - src-arxiv-2410-02867-v5

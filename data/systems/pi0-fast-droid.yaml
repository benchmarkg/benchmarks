# data/systems/pi0-fast-droid.yaml -- P3-S6-T05 (04 S7). Thin: only what RoboArena's rating pools need
# (data/rating-pools/pool-roboarena-*.yaml), where the board's backend id is `pi0_fast_droid`.
#
# system_type physical-robot-system: taxonomy/subjects.yaml's RoboArena example, the entrant is the policy running
# on the evaluators' DROID arms. availability and open_weights: openpi's README lists a downloadable checkpoint
# under this exact name (src-github-openpi-readme-215abfb). The board flags it not open_source, which the paper
# reserves for policies trained only on publicly available data, not for closed weights.
id: pi0-fast-droid
name: pi0_fast_droid
system_type: physical-robot-system
open_weights: true
availability: generally-available
external_ids:
  roboarena_policy: pi0_fast_droid
sources:
  - src-roboarena-api-leaderboard-history-2026-11-19
  - src-github-openpi-readme-215abfb

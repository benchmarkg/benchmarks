# data/systems/colabfold.yaml -- P3-S8-T01 (04 S7). Thin: only what its CASP claims need (data/claims/casp/). ColabFold
# took part in CASP16 as the group the monomer and complex assessors measure progress against, the AlphaFold2 and
# AlphaFold-Multimer pipeline of CASP15 with its databases and weights updated (src-casp16-monomer-2026-11-24,
# src-casp16-complex-2026-11-24); the CASP16 overview calls it "a server running AlphaFold2" (src-casp16-overview).
# The monomer assessment's figures label its group colabfold_baseline.
#
# Named by the method's published name. system_type domain-specialist-model: a structure predictor trained for the
# field and scored on it (taxonomy/subjects.yaml; casp's designed_for_subjects). built_on is empty because AlphaFold2
# has no System record. availability research-only: no source read here says how the pipeline is obtained; a
# reviewer confirms.
id: colabfold
name: ColabFold
system_type: domain-specialist-model
availability: research-only
external_ids:
  casp16_group_name: colabfold_baseline
sources:
  - src-casp16-overview
  - src-casp16-monomer-2026-11-24
  - src-casp16-complex-2026-11-24

# data/systems/eqv2-m.yaml -- P3-S7-T02 (04 S7). Thin: only what its Matbench Discovery claim
# (data/claims/matbench-discovery/) needs.
# The row "eqV2 M" of the Matbench Discovery v1 unique-prototype table, trained on OMat24 and MPtrj, added to
# the leaderboard 2024-10-18 (src-github-matbench-discovery-metrics-table-uniq-protos-6d587c1); the archived
# leaderboard capture of 2026-06-10 lists it under the same name (src-matbench-discovery-homepage). Not eqV2 S
# DeNS, the smaller model of the same architecture trained on MPtrj alone, a separate row and System
# (eqv2-s-dens).
#
# system_type scientific-surrogate-model: a learned interatomic potential that stands in for DFT and is scored
# against it, the term's inclusion test (taxonomy/subjects.yaml) and the entry's designed_for_subjects; so its
# claims are not LLM-run (tools/report/llm_run.py). organization is left null and availability is research-only:
# the developer, whether weights or code are released, the release date, size and licence were not looked for
# beyond the table, whose parameter count is rounded. A reviewer confirms.
id: eqv2-m
name: eqV2 M
system_type: scientific-surrogate-model
availability: research-only
sources:
  - src-github-matbench-discovery-metrics-table-uniq-protos-6d587c1

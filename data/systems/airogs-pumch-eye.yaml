# data/systems/airogs-pumch-eye.yaml -- P3-S8-T04 (04 S7). Thin: only what its two AIROGS claims need
# (data/claims/airogs/). The Final Test Phase entry of the team PUMCH-eye (src-arxiv-2302-01738-v2-2026-11-26),
# whose
# workflow chains five trained models: an optic-disc segmentation model "with ResNet101-UperNet [39] as the
# backbone", vision transformers for referable glaucoma on the disc crop or on the whole image, and a
# vessel-based classifier for ungradable images.
#
# Named by the team name, which is an eye department's, not a person's. system_type domain-specialist-model: a
# fundus-photograph classifier trained on the challenge's data (airogs's designed_for_subjects), so its claims
# are not LLM-run (tools/report/llm_run.py). availability research-only: the organisers keep the submitted
# containers on the platform; no source read says the team released its weights. organization is null: the
# paper places the team only through its reference [36], which names people. A reviewer confirms.
id: airogs-pumch-eye
name: PUMCH-eye (AIROGS Final Test Phase)
system_type: domain-specialist-model
availability: research-only
sources:
  - src-arxiv-2302-01738-v2-2026-11-26

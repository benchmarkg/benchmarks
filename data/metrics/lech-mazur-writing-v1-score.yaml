# data/metrics/lech-mazur-writing-v1-score.yaml -- P3-S2-T05 (04 S6). The 0-10 scale: Lech Mazur
# Writing V1. Epoch's benchmark_metadata.csv gives this benchmark scale 0.1 (0-10 to 0-1),
# random_baseline 0.0 and score_ceiling 1.0; its Mean score column is on the 0-10 scale (6.05 to
# 8.6), so a claim is stored against this metric in 0-10 points and the 0.1 is not applied (07 S8).
#
# value_type ordinal, not ratio: the score is a mean of graders' ratings, not a fraction of
# anything, and 10 is the top of a rating scale rather than an attainable "all correct". That makes
# headroom not computable (Metric.headroom_null_reason: metric-not-headroom-computable). If a
# reviewer judges the 0-10 mean headroom-bearing, change value_type to ratio and headroom_computable
# to true together.
id: lech-mazur-writing-v1-score
name: Mean story score (V1)
full_name: LLM Creative Story-Writing Benchmark, V1 mean grade
definition: >
  The mean grade, on an absolute 0-10 scale, that the grader LLMs give a model's short stories.
  Each model writes 500 stories of about 400-500 words, each required to incorporate ten randomly
  assigned elements (a character, object, concept, attribute, action, method, setting, timeframe,
  motivation and tone). Seven grader LLMs grade every story on 16 questions: six on the story
  (character, plot, world and atmosphere, storytelling impact, originality, execution and
  cohesion) and one on the fit of each required element.
value_type: ordinal
range:
  min: 0
  max: 10
optimum: max
aggregation: mean over stories, questions and grader LLMs
units: points on a 0-10 scale
headroom_computable: false
pitfalls: >
  V1 only: the scores are the final leaderboard of the absolute-scale version (commit 80b7f17,
  2025-08-08). Later versions compare stories pairwise and produce relative ratings that cannot be
  combined with these 0-10 scores. Within V1, the 2025-04-24 update replaced the grader LLMs and
  added grading criteria, so scores from before it are not comparable either. The graders are
  LLMs, and the author notes "we cannot be certain that these ratings are correct without human
  validation". The scale's endpoints are Epoch's statement; the upstream README gives the 0.1
  grading granularity but not the range.
sources:
  - src-lechmazur-writing-v1-readme
  - src-epoch-lech-mazur-writing

# data/metrics/luna16-cpm.yaml -- P3-S8-T04 (04 S6). LUNA16's score, the Competition Performance Metric: the
# mean FROC sensitivity at "1/8, 1/4, 1/2, 1, 2, 4, and 8 FPs per scan" (the paper, src-arxiv-1612-08012-v4,
# whose re-read src-arxiv-1612-08012-v4-2026-11-26 holds the passage), with the
# hit criterion of the evaluation page (src-luna16-evaluation: "Our hit criterium is that a candidate should be
# located within a distance R of the nodule center"). New for the LUNA16 claim (data/claims/luna16/): luna16
# declares no metrics yet (P3-S6-T06 left it out of the Grand Challenge subset), and the task may not edit the
# entry, so adding this record to luna16's metrics is a reviewer's step. Its own record, not a shared FROC one:
# the operating points, the reference standard and the 100-mark cap are LUNA16's.
id: luna16-cpm
name: CPM (LUNA16)
full_name: LUNA16 Competition Performance Metric, the mean FROC sensitivity at seven false-positive
  rates
definition: The average of the nodule detection sensitivity read off the FROC curve at 1/8, 1/4,
  1/2, 1, 2, 4 and 8 false positives per scan. A mark is a true positive when it lies within the
  radius of a reference nodule from its centre, the highest-scoring mark counting when several hit
  one nodule; marks on irrelevant findings are ignored and the rest are false positives. At most 100
  marks per scan are kept. The reference standard is the 1,186 nodules accepted by at least three of
  the four LIDC-IDRI readers.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: One FROC curve over the marks of all 888 scans, each scan scored by a model that did
  not train on its fold, then the mean of the seven sensitivities; a 95% band by bootstrapping.
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: The false positive reduction track scores the supplied candidates, so its values are
  comparable only on one candidate list (the original or candidates_V2), and neither track's value
  is comparable with the other's. The labels are public and entrants cross-validate themselves, so a
  CPM is not a held-out score. ANODE09 introduced the name on another set of scans and another
  reference, which is a different number.
sources:
  - src-arxiv-1612-08012-v4
  - src-arxiv-1612-08012-v4-2026-11-26
  - src-luna16-evaluation

# data/metrics/game-arena-elo.yaml -- P0-S8-T05 (04 S13's Elo case). Unbounded, pool-relative, no headroom.
id: game-arena-elo
name: Game Arena Elo
definition: An Elo-scaled rating from a Bradley-Terry model fitted to every pairwise game outcome in
  one rating pool (draws count 0.5), anchored so the pool's lowest-rated model is 0.
value_type: elo
range:
  min: null
  max: null
unbounded: true
optimum: max
requires_pool: true
headroom_computable: false
pitfalls: The anchor is the weakest model in the pool, so every rating moves when the pool changes;
  never compare ratings from different pools or snapshot dates. The report's Stockfish calibration
  is approximate and less reliable outside the engine's range.
sources:
  - src-game-arena-arxiv-html

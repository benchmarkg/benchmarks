# data/metrics/oc-is2rs-adwt.yaml -- P3-S6-T02 (04 S6). Open Catalyst's IS2RS distance threshold rate.
id: oc-is2rs-adwt
name: ADwT
full_name: Average Distance within Threshold (Open Catalyst IS2RS)
definition: >
  The percentage of predicted relaxed structures whose atom-position MAE (free catalyst and adsorbate
  atoms, with periodic boundary conditions) is below a threshold, averaged over thresholds from 0.01 Å
  to 0.5 Å in steps of 0.001 Å.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
units: percent
domains:
  - chemistry-materials/catalysis
pitfalls: >
  It needs no DFT to compute, which is why a server can score it on submission, but the OC22 paper finds
  that distance-based metrics like it correlate poorly with the DFT force metrics that say whether a structure
  is really relaxed. The OC22 paper's IS baseline row already scores 43.39% on the in-domain test split.
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3

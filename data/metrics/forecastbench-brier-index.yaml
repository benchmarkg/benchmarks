# data/metrics/forecastbench-brier-index.yaml -- P0-S8-T06 (04 S6). ForecastBench's leaderboard scale.
id: forecastbench-brier-index
name: Brier Index
full_name: Brier Index (ForecastBench)
definition: >
  ForecastBench's difficulty-adjusted Brier score converted to a 0-100% scale where higher is better:
  100% is perfect accuracy, 50% is maximally uninformed and 0% is maximally wrong. The Overall Brier
  Index converts the equal-weighted average of the dataset and market difficulty-adjusted Brier scores.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
chance_baseline: 50
normalization_anchor: 50% is a forecaster who always says 50% (maximally uninformed); the human
  comparison groups are the Baseline records (src-forecastbench-leaderboards).
aggregation: difficulty-adjusted Brier score per question type, averaged with equal weight, then
  transformed; the transformation is nonlinear, so the Overall index is not the mean of the dataset
  and market indices
units: percent
pitfalls: >
  The difficulty adjustment is a two-way fixed-effects model fitted across forecasters and question
  sets, so a forecaster's index can move when other forecasters or new questions enter, and the human
  groups (surveyed in July 2024) are compared with later models through that model rather than on the
  same questions. Values change nightly as questions resolve.
sources:
  - src-forecastbench-leaderboards

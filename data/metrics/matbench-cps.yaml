# data/metrics/matbench-cps.yaml -- P0-S8-T02 (04 S6). Matbench Discovery's own composite.
id: matbench-cps
name: CPS
full_name: Combined Performance Score (Matbench Discovery)
definition: >
  Matbench Discovery's leaderboard composite: a weighted combination of discovery F1, geometry
  optimisation RMSD and thermal-conductivity κSRME, with default weights 50%, 10% and 40%, which the
  viewer can change.
value_type: ratio
optimum: max
aggregation: weighted combination of three task metrics; default weights F1 50%, κSRME 40%, RMSD 10%
headroom_computable: false
must_report_with:
  - f1-score
  - kappa-srme
  - structure-rmsd
pitfalls: >
  The weights are a presentation choice the page lets any viewer change, so a CPS value is meaningful
  only with its weights, and the set of tasks it combines has changed as tasks were added. No source
  states its range. Not headroom-computable for either reason.
sources:
  - src-matbench-discovery-homepage

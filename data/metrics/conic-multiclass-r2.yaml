# data/metrics/conic-multiclass-r2.yaml -- P3-S6-T06 (04 S6). CoNIC task 2's ranking metric (src-gc-conic-evaluation:
# "we will use multi-class coefficient of determination to determine the correlation between the predicted and true
# counts").
id: conic-multiclass-r2
name: Multi-class R2
full_name: CoNIC multi-class coefficient of determination of nucleus counts
definition: For each of the six nucleus types, one minus the ratio of the residual sum of squares of
  the predicted per-image counts to the total sum of squares of the true counts; the six types'
  values are averaged.
value_type: ratio
range:
  max: 1
optimum: max
aggregation: Per type over the test images, then the unweighted mean over the six types.
domains:
  - medicine-health/medical-imaging-segmentation
pitfalls: Bounded above at 1 but not below, since a prediction worse than each type's mean count
  goes negative, so the range has no floor. Every type weighs the same in the mean, whatever its
  count.
sources:
  - src-gc-conic-evaluation

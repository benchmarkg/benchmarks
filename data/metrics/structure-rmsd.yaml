# data/metrics/structure-rmsd.yaml -- P0-S8-T02 (04 S6).
id: structure-rmsd
name: RMSD
full_name: Root-mean-square displacement between a model-relaxed and the DFT-relaxed structure
definition: >
  After structure matching, the root-mean-square distance between atomic positions in the structure
  a model relaxes to and the DFT-relaxed reference, averaged over the test structures.
value_type: ratio
range:
  min: 0
optimum: min
pitfalls: >
  Units are not settled by the sources read: the archived geometry-optimisation page reports RMSD in
  Angstrom in its plots, while the live page (2026-09-26, not archived) calls it normalised and
  unitless. Compare only values from one release of the evaluation code.
sources:
  - src-matbench-discovery-geo-opt-page

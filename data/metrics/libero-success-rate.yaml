# data/metrics/libero-success-rate.yaml -- P3-S8-T06 (04 S6). The success rate LIBERO's users report per task suite.
id: libero-success-rate
name: Success rate
full_name: LIBERO task-suite success rate
definition: The share of evaluation episodes in which the task's goal predicates hold, over the
  tasks of one LIBERO suite (10 tasks, from the benchmark's fixed initial states). Under the
  lifelong protocol the paper builds FWT, NBT and AUC from it; multitask papers report it per suite.
  Reported in percent.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
aggregation: Episodes per task, then the mean over the suite's tasks; papers may average seeds on
  top.
units: percent
domains:
  - robotics-embodiment/manipulation
pitfalls: One suite's rate is not another's, and a multitask rate is not a lifelong one. The count
  of episodes and seeds, the cameras a policy sees and any cleaning of the demonstrations differ by
  paper, and the simulator release behind a run is seldom stated.
sources:
  - src-arxiv-2306-03310-v2
  - src-arxiv-2406-09246-v3-html

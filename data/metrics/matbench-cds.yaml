# data/metrics/matbench-cds.yaml -- P3-S6-T01 (04 S6). Matbench Discovery's diatomics score.
id: matbench-cds
name: CDS
full_name: Combined Diatomics Score (Matbench Discovery)
definition: >
  How well a model's homonuclear diatomic potential-energy curves agree with PBE references and behave
  physically, as a score in [0, 1]: the weighted mean of four pillar subscores, Accuracy (PBE energy and
  force MAE), Geometry (repulsive wall, bond length and well depth against PBE), Physicality (reference-free
  smoothness: energy jumps, force flips, tortuosity) and Speed (sweep wall time), multiplied by the fraction
  of the 87 scored elements the model completed. Defined here at the leaderboard's default weights.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
normalization_anchor: >
  Each component subscore is clamped linearly (log-scaled for wall time) between a frozen floor (subscore
  1) and baseline (subscore 0), e.g. energy MAE 0 to 4 eV, force MAE 0 to 5 eV/Å, wall time 50 s to 5,000
  s, so that scores do not move as models are added.
aggregation: >
  Weighted mean of the pillars at the default weights Accuracy 4/9, Geometry 2/9, Physicality 2/9, Speed
  1/9, times element coverage; the diatomics page lets a viewer change the weights. The site computes
  it from the stored components and never stores it.
domains:
  - chemistry-materials/force-fields-potentials
pitfalls: >
  As for CMDS: viewer-adjustable weights, a speed pillar timed on each submitter's own GPU and not normalised
  across hardware, and a formula the site recomputes rather than stores. The PBE references are themselves
  unreliable for stretched diatomics (dissociation limits, spin states), which the Accuracy pillar's own
  description concedes, so a model trained on another reference can lose Accuracy without being a worse
  potential.
sources:
  - src-github-matbench-discovery-labels-6d587c1
  - src-github-matbench-discovery-combined-scores-6d587c1

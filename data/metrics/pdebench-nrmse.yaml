# data/metrics/pdebench-nrmse.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's normalised RMSE, the scale-free member
# of its forward metrics. An error norm: optimum zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-nrmse
name: nRMSE
full_name: Normalised root mean squared error (PDEBench)
definition: >
  The L2 norm of the difference between the predicted and the simulated solution divided by the L2 norm
  of the simulated solution, ||u_pred - u_true||_2 / ||u_true||_2. The evaluation script takes the ratio
  for each test sample, output variable and time step (the sample's RMSE over the grid over the root mean
  square of the true field), then averages over samples, variables and time steps. The initial context
  steps are dropped first.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the per-sample ratio averaged over test samples,
  then over output variables and scored time steps.
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  Undefined where the true field is zero and unstable where it is small: the paper says normalised metrics
  are not well defined when the original signal is zero, and its own results show nRMSE rising as a forcing
  term shrinks the solution's scale. Scale-free, so closer to comparable across PDEs than RMSE, but a
  value still belongs to one PDE dataset and parameter value. The script averages per-sample ratios; the
  paper's formula does not say over what the norms are taken, so a value computed another way may differ.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

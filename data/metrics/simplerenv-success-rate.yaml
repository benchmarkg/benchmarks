# data/metrics/simplerenv-success-rate.yaml -- P3-S8-T06 (04 S6). SimplerEnv's simulated task success rate.
id: simplerenv-success-rate
name: Success rate
full_name: SimplerEnv simulated success rate
definition: For one task of a SIMPLER setup (Google Robot or WidowX + Bridge) under one evaluation
  approach (Visual Matching or Variant Aggregation), the share of simulated trials over the task's
  grid of object and robot placements that end in success, averaged over the approach's variants
  (tuned arm colours, environment variants) and, for stochastic policies, random seeds. Reported as
  a fraction.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Trials over the placement grid, then the mean over variants and seeds.
domains:
  - robotics-embodiment/manipulation
pitfalls: Visual Matching and Variant Aggregation are different numbers for the same task, and
  WidowX tasks also report partial (grasp) success in the same table. The value predicts real-world
  ranking, not real-world success.
sources:
  - src-arxiv-2405-05941-v1-html

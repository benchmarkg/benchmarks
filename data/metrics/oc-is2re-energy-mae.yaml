# data/metrics/oc-is2re-energy-mae.yaml -- P3-S6-T02 (04 S6). Open Catalyst's IS2RE relaxed-energy error.
id: oc-is2re-energy-mae
name: IS2RE energy MAE
full_name: Mean absolute error of the predicted relaxed energy (Open Catalyst IS2RE)
definition: >
  The mean absolute difference between the relaxed-state energy a model predicts from an initial structure
  and the DFT energy of the relaxed structure, over the systems of one test split. In OC20 it is the relaxed
  adsorption energy; in OC22's IS2RE-Total task, the DFT total energy of the relaxed structure.
value_type: ratio
range:
  min: 0
optimum: min
aggregation: >
  Mean over the systems of one subsplit; the Hugging Face board also reports the mean of the four OC20
  subsplits (avg_energy_mae).
units: eV
domains:
  - chemistry-materials/catalysis
pitfalls: >
  A model may predict the energy directly or relax the structure with a force model and read off the final
  energy; the OC22 paper reports the two approaches in separate rows, and which one produced a number
  belongs to the system, not the metric. OC20 and OC22 values measure different energies and never compare.
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3
  - src-hf-fairchem-leaderboard-evaluator-212fd1e

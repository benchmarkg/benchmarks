# data/metrics/oc-s2ef-efwt.yaml -- P3-S6-T02 (04 S6). Open Catalyst's S2EF energy-and-forces threshold rate.
id: oc-s2ef-efwt
name: EFwT
full_name: Energy and Forces within Threshold (Open Catalyst S2EF)
definition: >
  The percentage of structures whose computed energy is within 0.02 eV of the DFT energy and whose largest
  per-atom force error is below 0.03 eV/Å; both must hold for a structure to count as correct.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
units: percent
domains:
  - chemistry-materials/force-fields-potentials
pitfalls: >
  The thresholds are tight enough that no model in the OC22 paper's S2EF-Total test table scores above
  0.19%, so the metric separates little at present accuracy; it rewards replacing DFT outright. The thresholds
  are the OC20 paper's, and the OC22 paper refers to them rather than restating them.
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3

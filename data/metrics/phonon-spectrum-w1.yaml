# data/metrics/phonon-spectrum-w1.yaml -- P3-S6-T01 (04 S6). Matbench Discovery's phonon-spectrum distance.
id: phonon-spectrum-w1
name: W1(ω)
full_name: Wasserstein-1 distance between ML and DFT phonon frequency spectra
definition: >
  The mean, over the PhononDB-PBE materials whose frequencies are usable, of the Wasserstein-1 distance
  between the phonon frequency spectrum a model's force constants give and the DFT reference spectrum.
  It scores the phonons themselves, before the thermal-conductivity calculation that κSRME scores.
value_type: ratio
range:
  min: 0
optimum: min
normalization_anchor: >
  The maintainers give an approximately 0.02 THz mesh-comparison noise floor, below which a lower value
  is not a better spectrum (data/baselines/matbench-discovery.yaml, a noise-ceiling record).
aggregation: mean over the materials with usable frequencies
units: THz
domains:
  - chemistry-materials/force-fields-potentials
pitfalls: >
  Averaged only over materials with usable frequencies, so a material whose phonons fail drops out rather
  than counting against the model; κSRME, which censors a failed material to its maximum of 2, is the
  metric that counts it. Not part of CPS. `ratio` is the nearest value_type, as for e-above-hull-mae.
sources:
  - src-github-matbench-discovery-labels-6d587c1

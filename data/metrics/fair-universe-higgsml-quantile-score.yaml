# data/metrics/fair-universe-higgsml-quantile-score.yaml -- P3-S6-T08 (04 S6; 12 S3.4). The score that ranked the
# FAIR Universe HiggsML Uncertainty Challenge, built from the coverage and the width of each submission's 68.27%
# intervals. Higher is better and it is bounded above, at -ln(0.01), so headroom can be computed against that bound
# once a floor exists; none is published (data/baselines/fair-universe-higgsml.yaml).
id: fair-universe-higgsml-quantile-score
name: Quantile Score
full_name: Quantile Score (FAIR Universe HiggsML Uncertainty Challenge)
definition: >
  score = -ln((w + eps) * f(c)), over a set of pseudo-experiments for each of which a submission returned
  a 68.27% confidence interval [mu16, mu84] for the Higgs signal strength mu. w is the intervals' average
  width, c their coverage of the true mu, and eps = 0.01 a regulariser against unrealistically narrow
  intervals. f is a penalty on coverage: 1 while c lies within two binomial standard errors (sigma68 =
  sqrt(0.6827 * 0.3173 / N) for N pseudo-experiments) of 0.6827, plus the fourth power of the shortfall
  below that band in units of sigma68, or the third power of the excess above it, so under-coverage costs
  more than over-coverage.
value_type: ratio
range:
  max: 4.6052
optimum: max
normalization_anchor: >
  -ln(0.01), about 4.6052, the supremum reached only at zero width with coverage inside the no-penalty
  band, which no valid interval reaches (a theoretical-maximum record in data/baselines/fair-universe-higgsml.yaml).
aggregation: Over the pseudo-experiments of an evaluation; the public leaderboard ran 10 trials of
  100 pseudo-experiments, the final ranking 1000 trials of 100 from the private set, the same for
  every submission.
domains:
  - physics/particle-physics
pitfalls: >
  Unbounded below and logarithmic, so equal differences are not equal improvements and negative values
  are normal (the joint winners scored about -0.58 in the final evaluation). The penalty's band is set
  by N through sigma68, so a score is comparable only at the same number of pseudo-experiments per trial,
  and a score on the public leaderboard's draws (drawn separately for each submission) is not one on the
  final, shared private draws. Intervals were clipped at mu = 3, the competition's maximum, which narrows
  widths at large mu; a score from unclipped intervals is a different number. The range's maximum is derived
  from the formula, not printed in any source read.
sources:
  - src-arxiv-2410-02867-v5-2026-11-24
  - src-fair-universe-higgs-docs-evaluation
  - src-fair-universe-higgs-challenge-site

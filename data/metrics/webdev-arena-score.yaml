# data/metrics/webdev-arena-score.yaml -- P3-S2-T05 (04 S6, 12 S3.4). Elo-like: WebDev Arena's Arena
# Score. Epoch's benchmark_metadata.csv gives this benchmark scale 1.0, random_baseline 0.0 and
# score_ceiling 1.0; its Arena Score column runs 1099.0 to 1797.04, so the row's bounds cannot be
# applied to it (07 S8).
id: webdev-arena-score
name: Arena Score
full_name: WebDev Arena Bradley-Terry score
definition: >
  A rating fitted with the Bradley-Terry model to community votes between two anonymous models: a
  user submits a prompt, both models build a web app, and the user votes for the better one. The
  fit turns the win/loss record of every pairwise match-up into one score per model, reflecting
  its likelihood of winning against the other models in the pool. The scale is Elo-like.
value_type: elo
unbounded: true
optimum: max
aggregation: Bradley-Terry fit over all pairwise votes in the pool, reported with a 95% confidence
  interval
units: rating points
requires_pool: true
headroom_computable: false
pitfalls: >
  Pool-relative: a model's score is its standing against the other models in the pool, so it moves
  when a different model joins or leaves with no change to the model itself, and a score is read
  with the date of its leaderboard snapshot (12 S3.4, relative-rating-only). Scores from WebDev
  Arena and Chatbot Arena come from different pools and are not comparable, even though both use
  Bradley-Terry. About a quarter of WebDev Arena votes are ties (26%, against Chatbot Arena's
  35%). The arena has since been renamed Text Arena (Coding), a subset of LMArena's Text Arena,
  and Epoch now reads it from that leaderboard.
sources:
  - src-lmarena-webdev-arena-blog
  - src-epoch-text-arena-coding

# data/metrics/pdebench-rmse.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's root mean squared error, the first of its
# eight forward metrics. An error norm: optimum zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-rmse
name: RMSE
full_name: Root mean squared error (PDEBench)
definition: >
  The root mean squared difference between the predicted and the simulated solution over all grid points
  of a test sample, for each output variable and time step, averaged over the test samples and then over
  variables and time steps, as the benchmark's evaluation script computes it. The initial time steps given
  to the model as context are dropped before scoring.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the mean over test samples, then over output
  variables and scored time steps. The paper's Figure 2 plots it averaged over each PDE's parameter
  values.
units: the PDE variable's own units
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  In the units and scale of each PDE's variables, so values differ by orders of magnitude between PDEs
  and between parameter values of one PDE and are never comparable across them; nRMSE is the scale-free
  member of the family. How many initial steps are given as context (the script's initial_step) changes
  which steps are scored. The paper's per-PDE tables report it beside seven other metrics, and its baselines
  (U-Net, FNO, PINN) are learned models, not anchors.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

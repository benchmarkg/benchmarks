# data/metrics/f1-score.yaml -- P0-S8-T02 (04 S6). A general metric, first used by matbench-discovery.
id: f1-score
name: F1
full_name: F1 score
definition: The harmonic mean of precision and recall for a binary classification.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
pitfalls: >
  Depends on where the positive class is drawn and on its prevalence in the test set, so two F1
  values are comparable only on the same test set with the same threshold. On matbench-discovery the
  positive class is "on or below the Materials Project convex hull", and the full WBM set and its
  unique-prototype subset give different F1 for the same model.
sources:
  - src-matbench-discovery-nature
  - src-matbench-discovery-discovery-page

# data/metrics/lddt-pli.yaml -- P3-S8-T01 (04 S6). The pose score of CASP16's pharmaceutical ligand category, which
# casp's casp#ligands subset names and which had no Metric record before its first claim (data/claims/casp/).
id: lddt-pli
name: LDDT-PLI
full_name: Local Distance Difference Test for protein-ligand interactions
definition: >
  An lDDT restricted to a ligand and its binding site: the differences between the distances from ligand
  atoms to binding-site atoms in the crystal structure and in the predicted complex, scored from 0 (no
  crystallographic contact predicted correctly) to 1 (all of them). CASP16's version also penalises predicted
  ligand-protein contacts that the crystal structure does not have.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: per ligand pose target; the CASP16 ligand assessors average a group's values over the
  pose targets with a skipped target counted as 0 (the skip-penalised mean), for Model 1 and for the
  best of each group's models
units: fraction
domains:
  - biology-genetics/protein-ligand-cofolding
pitfalls: >
  Not the same score in every edition: CASP16 added the penalty for contacts absent from the crystal,
  so a CASP15 value does not compare. A skip-penalised mean and a mean over the predicted targets only
  are different numbers for a group that skipped targets, and Model 1 and best-model means differ too.
  It scores the pose against one crystal structure and says nothing about the rest of the protein. lDDT
  and interface lDDT are different scores.
sources:
  - src-casp16-ligand-2026-11-24

# data/metrics/pdebench-brmse.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's boundary error. An error norm: optimum
# zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-brmse
name: bRMSE
full_name: RMSE at the boundaries (PDEBench)
definition: >
  The root mean squared difference between the predicted and the simulated solution over the boundary
  grid points only, the first and last point along each spatial axis, for each test sample, output variable
  and time step, averaged over samples and then over variables and time steps. It shows whether a model
  has learned the boundary condition.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the mean over test samples, then over output
  variables and scored time steps.
units: the PDE variable's own units
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  Scores only the outermost grid points, so the share of the field it reads shrinks as the grid gets finer,
  and what it tests depends on each PDE's boundary condition. In the variables' own units, so not comparable
  across PDEs.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

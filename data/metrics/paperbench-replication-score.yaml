# data/metrics/paperbench-replication-score.yaml -- P0-S8-T07 (04 S6). PaperBench's headline score.
id: paperbench-replication-score
name: Replication Score
full_name: PaperBench Replication Score
definition: >
  Per paper, the root score of that paper's rubric tree: each leaf requirement is graded pass (1) or
  fail (0), each parent takes the weighted mean of its children's scores, and the root is the paper's
  score; 100% means every leaf requirement was met. The benchmark score is the mean over the papers.
formula_reference: https://arxiv.org/abs/2504.01848
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
aggregation: weighted mean up each rubric tree, then the unweighted mean over the 20 papers
units: percent
rubric:
  structure: tree
  rubric_count: 20
  leaf_count: 8316
  node_count: 11218
  leaf_scoring: binary
  node_aggregation: weighted-mean-of-children
  leaf_types:
    - type: code-development
      count: 3674
    - type: execution
      count: 4076
    - type: result-match
      count: 566
domains:
  - agents-tooluse/long-horizon-autonomy
pitfalls: >
  The number depends on the grader, which is a model: the same submission can grade differently with
  another judge, and with the same judge on another call. Node weights express importance, not
  difficulty, so the score is not a count of requirements met. Execution and Result Match leaves are
  zero without a working reproduce.sh, which makes the score step-like in that file's success. The
  PaperBench Code-Dev variant grades only the Code Development leaves and is not comparable. The
  per-type leaf counts and the node count are sums of the paper's Tables 2 and 7.
sources:
  - src-paperbench-arxiv-html

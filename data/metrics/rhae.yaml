# data/metrics/rhae.yaml -- P0-S8-T03 (04 S6). ARC-AGI-3's official score.
id: rhae
name: RHAE
full_name: Relative Human Action Efficiency
definition: >
  Per level, the human baseline action count divided by the agent's action count, squared, so an
  agent twice as slow as the baseline scores 25% on that level; levels are scored in isolation,
  normalised per environment, and the total is the mean over environments. The human baseline is the
  upper-median best human action count for the level.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
normalization_anchor: >
  The human baseline: 100% is completing every level in no more actions than the upper-median best
  human (src-arc-agi-3-report-arxiv).
units: percent
pitfalls: >
  Squaring punishes inefficiency steeply, so small scores are compressed near zero. Scores depend on
  the action budget (five times the human median per level) and on the evaluation set: public-demo
  scores are not comparable with semi-private ones, and the maintainers say public-demo scores are
  not a measure of progress.
sources:
  - src-arc-agi-3-report-arxiv

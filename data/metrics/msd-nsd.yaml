# data/metrics/msd-nsd.yaml -- P3-S6-T06 (04 S6). The Medical Segmentation Decathlon's boundary metric, the normalised
# surface distance per target region on 3D volumes (src-arxiv-2106-05735-v1: "and the Normalised Surface Distance
# (NSD) [18], both computed on 3D volumes."). Not KiTS's Surface Dice record: the tolerance and the regions differ.
id: msd-nsd
name: NSD
full_name: Normalised surface distance per target region (Medical Segmentation Decathlon)
definition: The share of the predicted and reference boundaries of one target region that lie within
  a tolerance of each other, on 3D volumes; 1 when every boundary point is within the tolerance.
  Computed for each of a task's target regions separately, beside the Dice similarity coefficient.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Per volume and region, then turned into a significance score against the other
  entrants, as for DSC.
must_report_with:
  - msd-dsc
domains:
  - medicine-health/medical-imaging-segmentation
pitfalls: Depends on the tolerance the organisers set, which the passages read do not state, so an
  NSD computed elsewhere with another tolerance is another number. Despite the name it is an
  agreement share (higher is better), not a distance in millimetres.
sources:
  - src-arxiv-2106-05735-v1

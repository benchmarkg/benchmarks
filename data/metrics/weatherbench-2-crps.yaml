# data/metrics/weatherbench-2-crps.yaml -- P3-S6-T04 (04 S6). WeatherBench 2's probabilistic headline metric.
id: weatherbench-2-crps
name: CRPS
full_name: Continuous ranked probability score (WeatherBench 2)
definition: >
  How far an ensemble forecast's distribution lies from the ground truth, for one variable at one pressure
  level, one region and one lead time: the area-weighted mean absolute error of the members minus half
  their mean pairwise absolute difference, the unbiased ensemble estimator, averaged over every initialisation
  of the evaluation year. It rewards a forecast whose stated uncertainty matches the actual uncertainty
  and is sharp. For a single deterministic forecast it reduces to the area-weighted mean absolute error.
value_type: ratio
range:
  min: 0
optimum: min
aggregation: none across the grid; one value per (variable, level, region, lead time) cell of an
  evaluation year at one evaluation resolution
units: the variable's own; the results files carry no units attribute
domains:
  - earth-climate/weather-forecasting
pitfalls: >
  A value is one cell of a grid and needs its variable, level, region, lead time, evaluation year and
  resolution, as for RMSE. Operational forecasts, the IFS ensemble among them, are scored against their
  own analysis and the rest against ERA5. A deterministic forecast also gets a CRPS, its mean absolute
  error, so a deterministic model's value can sit on the same scale as an ensemble's. For 850 hPa wind
  the headline CRPS is on wind speed, where the deterministic headline is the wind-vector RMSE.
sources:
  - src-arxiv-2308-15560-v2
  - src-weatherbench-2-faq
  - src-weatherbench-2-arxiv-html

# data/metrics/pdebench-frmse-low.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's Fourier-space error in the low
# wavenumbers. An error norm: optimum zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-frmse-low
name: fRMSE low
full_name: RMSE in Fourier space, low-frequency band (PDEBench)
definition: >
  The error of the prediction's Fourier spectrum in the low-wavenumber band. The squared magnitude of
  the difference between the predicted and the true field's discrete Fourier transforms is binned by integer
  wavenumber (radially in 2D and 3D), root-mean-squared over test samples, scaled by the domain length
  over the grid size, and averaged over the band's wavenumbers, then over output variables and time steps.
  The paper puts the low band at wavenumbers 0 to 4.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the mean over the band's wavenumbers, then over
  output variables and scored time steps.
units: the PDE variable's own units, scaled by the domain length
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  The band edges differ between the paper and the script: the paper defines low as wavenumbers 0-4, mid
  5-12 and high 13 and above, while the evaluation script's defaults (iLow=4, iHigh=12) slice wavenumbers
  0-3, 4-11 and 12 and above, so a value says which convention made it. The bands are fixed wavenumber
  indices, not physical scales, so the same band covers different scales on grids of different resolution.
  One of three band metrics (low, mid, high) reported side by side.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

# data/metrics/vcc-2026-de-lfc-accuracy.yaml -- P0-S8-T04 (04 S6). One of the six scaled metrics of the Virtual Cell Challenge 2026.
id: vcc-2026-de-lfc-accuracy
name: nmae
full_name: DE log-FC accuracy (Virtual Cell Challenge 2026)
definition: 'Normalised mean absolute error of the log2 fold changes, over the genes the reference called
  significant: how close the predicted effect sizes are, not only their direction.'
formula_reference:
  https://github.com/ArcInstitute/cell-eval2/blob/main/docs/vcc2026_metrics/vcc2026-metrics.md
value_type: ratio
range:
  min: -6
unbounded: true
optimum: max
normalization_anchor: 'Reference-scaled per cell context: 0 is the cell-context mean (one average profile
  predicted for every perturbation) and 1 is a real replicate experiment (the held-out cells split in
  two, one half scored against the other), both measured on the withheld data (src-vcc-2026-evaluation).'
aggregation: per context over the panel, then scaled; the overall score averages the scaled values
  over the three contexts
headroom_computable: false
domains:
  - biology-genetics/perturbation-response-prediction
pitfalls: Recorded in its scaled form, the one the overall score averages. The raw column on the
  leaderboard is not comparable across metrics or contexts. Not clamped above, so a prediction can
  score above the replicate; the anchor is a landmark, not a maximum. Floored at -6 by a penalty
  cap, the only lower bound among the six. Its raw form is lower-is-better.
sources:
  - src-vcc-2026-evaluation
  - src-vcc-2026-faq

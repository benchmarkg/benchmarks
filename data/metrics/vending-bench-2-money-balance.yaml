# data/metrics/vending-bench-2-money-balance.yaml -- P3-S2-T05 (04 S6, 12 S3.4). Dollars:
# Vending-Bench 2's score. Epoch's benchmark_metadata.csv gives this benchmark scale 1.0,
# random_baseline 0.0 and score_ceiling 1.0, which fit a 0-1 fraction, not a dollar balance (its
# highest Score is 11181.87); the ingest must read the bound from here, not from that row (07 S8,
# metric-definition gate).
id: vending-bench-2-money-balance
name: Money balance
full_name: Vending-Bench 2 money balance after a simulated year
definition: >
  The agent's money balance, in US dollars, after a simulated year of running a vending-machine
  business from a $500 starting balance: finding suppliers, ordering from them by email and moving
  delivered stock from storage into the machine. A run that fails to pay the $2 daily fee for more
  than 10 consecutive days is terminated early. The leaderboard reports the average across 5 runs.
value_type: currency
unbounded: true
optimum: max
aggregation: mean across 5 runs, reported with a spread (±)
units: US dollars
headroom_computable: false
pitfalls: >
  No ceiling by design: Andon Labs states "there's no ceiling, meaning a superintelligent AI could
  theoretically make almost infinite money", so there is no headroom to compute (12 S3.4,
  unbounded-metric). Andon Labs' figure of roughly $63k a year for a "good" strategy is an
  estimate built from stated assumptions, not a measured human baseline and not a ceiling.
  Vending-Bench 2 changed the scoring of the original Vending-Bench ("streamlined the scoring
  system"), so the two are not comparable. A balance below the $500 start is a loss, and it can
  fall below zero (one of Epoch's rows is -31.18), so the metric declares no lower bound.
  Run-to-run spread can be large: Claude Opus 5's $11,181.87 carries ± $2,094.
sources:
  - src-andonlabs-vending-bench-2

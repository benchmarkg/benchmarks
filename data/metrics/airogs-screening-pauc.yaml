# data/metrics/airogs-screening-pauc.yaml -- P3-S6-T06 (04 S6). AIROGS's first screening metric (src-arxiv-2302-01738-v2:
# "Screening performance was evaluated using the standardized partial area under the receiver operating characteristic
# curve"), restricted to the 90-100% specificity range a screening programme needs.
id: airogs-screening-pauc
name: Screening pAUC
full_name: AIROGS standardised partial AUROC for referable glaucoma, 90-100% specificity
definition: The area under the ROC curve of the system's referable-glaucoma likelihood, taken only
  over specificities from 90% to 100% and standardised by the method the paper cites.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: One statistic over the test images with a referable or non-referable glaucoma label; it
  enters the final ranking as a rank among the teams.
must_report_with:
  - airogs-screening-sensitivity
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: Not a full AUROC, and not a raw partial area either, so it is comparable only with partial
  AUROCs over the same specificity range under the same standardisation. A team's final place is the
  mean of four ranks, which this value alone does not order.
sources:
  - src-arxiv-2302-01738-v2

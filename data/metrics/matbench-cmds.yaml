# data/metrics/matbench-cmds.yaml -- P3-S6-T01 (04 S6). Matbench Discovery's molecular-dynamics score.
id: matbench-cmds
name: CMDS
full_name: Combined MD Score (Matbench Discovery)
definition: >
  How closely a model's NVT molecular-dynamics trajectories reproduce ab-initio MD on the 17 DynaMat v1.0
  systems, as a score in [0, 1]: the weighted mean of three observable subscores, each 1 − error/100 for
  the vibrational density of states (ΔvDOS), bond-angle distribution (ΔADF) and pressure distribution
  (ΔP) errors, and a speed subscore from the summed rollout wall time. Defined here at the leaderboard's
  default weights.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
normalization_anchor: >
  Fixed, roster-independent scales: each error is a percentage whose 100% is a featureless or disjoint
  reference (a structureless angular background for ΔADF, the reference's own spectral width for ΔvDOS,
  disjoint histograms for ΔP), and wall time is log-scaled from 9,000 s (subscore 1) to 300,000 s (subscore
  0), bounds frozen at the mid-2026 field.
aggregation: >
  Weighted mean at the default weights ΔvDOS 30%, ΔP 30%, ΔADF 20%, speed 20%; the MD task page lets a
  viewer change them. The site computes it from the stored components and never stores it.
domains:
  - chemistry-materials/force-fields-potentials
pitfalls: >
  Three things move it besides the model. The weights are viewer-adjustable, so a number is this metric
  only at the defaults. The speed subscore is wall time on each submitter's own GPU, not normalised across
  hardware, and a model without recorded timings has no CMDS unless the speed weight is zeroed. And the
  formula has changed (ΔRDF was dropped, and ΔvDOS moved from an L1 overlap to a W1 distance), so a value
  should carry the date it was read. The maintainers find the pressure error alone explains about R² 0.9
  of the ranking. It scores fidelity to ab-initio dynamics, not whether a trajectory stays stable.
sources:
  - src-github-matbench-discovery-labels-6d587c1
  - src-github-matbench-discovery-combined-scores-6d587c1
  - src-github-matbench-discovery-md-metrics-design-6d587c1

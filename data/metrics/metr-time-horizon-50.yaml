# data/metrics/metr-time-horizon-50.yaml -- P3-S2-T05 (04 S6, 12 S3.4). Minutes: METR's 50%-time
# horizon. Epoch's benchmark_metadata.csv names average_score (a 0-1 success rate) as this file's
# score_column, with scale 1.0; the minutes are in the `Time horizon` column and the 80% horizon in
# `Time Horizon (80%)`. A claim against this metric must come from `Time horizon`, which the mapping
# stanza has to name explicitly.
id: metr-time-horizon-50
name: 50%-time horizon
full_name: METR task-completion time horizon at 50% reliability
definition: >
  The task duration, measured by how long a human expert takes to complete the task, at which an
  AI agent is predicted to succeed half the time. METR fits a logistic curve of the agent's
  success probability against human completion time over its task suite and reads off where the
  curve crosses 50%. Reported in minutes.
value_type: duration
range:
  min: 0
unbounded: true
optimum: max
aggregation: logistic fit of success probability against human task length over the whole task suite
units: minutes
headroom_computable: false
pitfalls: >
  METR: "Measurements above 16 hrs are unreliable with our current task suite". Epoch's highest
  row, 1,044.78 minutes (about 17.4 hours), is already past that, so the top of the leaderboard is
  where the number is least trustworthy. It is not how long an agent can work autonomously; METR's
  FAQ answers that question "No". It is suite-relative: Time Horizon 1.1 follows the original
  method "with a larger task suite", so a horizon is read with its suite version (Epoch's `METR
  version` column). The 50% horizon is not the 80% horizon, which is much shorter for the same
  model; the two are different metrics.
sources:
  - src-metr-time-horizons

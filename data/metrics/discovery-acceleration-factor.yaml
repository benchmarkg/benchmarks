# data/metrics/discovery-acceleration-factor.yaml -- P0-S8-T02 (04 S6).
id: discovery-acceleration-factor
name: DAF
full_name: Discovery acceleration factor
definition: >
  How many times more often a model's predicted-stable candidates are actually stable than
  candidates picked at random from the same test set: precision divided by the prevalence of the
  positive class.
value_type: ratio
range:
  min: 0
optimum: max
normalization_anchor: >
  Its maximum is the inverse of the prevalence, so it is a property of the test set: about 6.5 on the
  WBM unique-prototype set (src-matbench-discovery-nature).
pitfalls: >
  Not comparable across test sets with different prevalence, and a DAF near its test-set maximum says
  the model's precision is near 1, nothing more.
sources:
  - src-matbench-discovery-nature
  - src-matbench-discovery-homepage

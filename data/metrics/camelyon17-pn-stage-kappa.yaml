# data/metrics/camelyon17-pn-stage-kappa.yaml -- P3-S6-T06 (04 S6). CAMELYON17's ranking metric, a five-class quadratic
# weighted kappa over patients' pN-stages (src-camelyon17-evaluation: "For the evaluation of the results we use five class
# quadratic weighted kappa where the classes are the pN-stages."). Not a slide-level accuracy and not CAMELYON16's FROC.
id: camelyon17-pn-stage-kappa
name: Quadratic weighted kappa
full_name: Five-class quadratic weighted Cohen's kappa over pN-stages (CAMELYON17)
definition: Cohen's kappa with quadratic weights between each test patient's predicted and reference
  pathologic N-stage, the five classes being pN0, pN0(i+), pN1mi, pN1 and pN2, so a prediction one
  stage off costs less than one four stages off. It is computed once over the 100 test patients; a
  stage is derived from the patient's five slide-level labels by the challenge's counting rule.
value_type: ratio
range:
  min: -1
  max: 1
optimum: max
aggregation: One statistic over all 100 test patients (a pooled agreement, not a mean of per-patient
  scores). Ties are broken by the same kappa computed on the patients of single reference stages,
  pN2 first.
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: A patient-level agreement on an ordinal five-class scale. It is not comparable with the
  slide-level accuracy or AUC that papers report on CAMELYON17's labelled slides, nor with
  CAMELYON16's lesion FROC or slide AUC. Its value depends on the test set's stage distribution,
  which the organisers fixed per centre, and the challenge's entries ranged down to a negative
  value, so the floor is not zero.
sources:
  - src-camelyon17-evaluation
  - src-camelyon17-tmi

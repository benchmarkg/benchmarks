# data/metrics/vqa-accuracy.yaml -- P1-S8-T09 (04 S6). The VQA dataset's consensus accuracy, first used by vqa.
id: vqa-accuracy
name: VQA accuracy
full_name: VQA consensus accuracy against ten human answers
definition: For each question, an answer scores min(n / 3, 1), where n is the number of the human
  annotators who gave exactly that answer after normalisation (lower case, number words to digits,
  punctuation and articles removed), so an answer three annotators gave is fully correct. Each
  question has ten human answers; the score is computed against every set of nine of them and
  averaged, to match how human accuracy is measured, and the benchmark score is the mean over
  questions, reported overall and by answer type (yes/no, number, other).
formula_reference: https://visualqa.org/evaluation.html
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Mean over questions of the per-question score, itself the mean over the ten
  leave-one-out sets of nine human answers; reported in percent.
domains:
  - multimodal/visual-qa
pitfalls: >
  The number depends on the split, and papers mix them: VQA v2.0's test-standard is the split the maintainers
  ask to be reported, test-dev is for development, and many results are on the validation split, which
  is public. v1.0 and v2.0 scores are not comparable, since v2.0 adds a complementary image with a different
  answer to almost every question to weaken language priors. The answer normalisation is part of the metric,
  and the evaluation script was changed in 2021 to process ground-truth and predicted answers consistently,
  which the maintainers say can move a score by about 0.1 points against the old server. On v1.0 the same
  formula scores the multiple-choice task, where the chosen option is matched against the human answers,
  so a multiple-choice score is not an open-ended one. Partial credit means human accuracy under the metric
  is well below 100 (83.30 for real images on v1.0 test-standard).
sources:
  - src-arxiv-1505-00468-v7
  - src-visualqa-evaluation
  - src-visualqa-challenge
  - src-arxiv-1612-00837-v3

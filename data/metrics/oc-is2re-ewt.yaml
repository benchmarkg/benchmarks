# data/metrics/oc-is2re-ewt.yaml -- P3-S6-T02 (04 S6). Open Catalyst's IS2RE energy threshold rate.
id: oc-is2re-ewt
name: EwT
full_name: Energy within Threshold (Open Catalyst IS2RE)
definition: >
  The percentage of predicted relaxed energies within 0.02 eV of the DFT relaxed energy, the share of
  estimates the OC20 paper calls likely to be practically useful.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
units: percent
domains:
  - chemistry-materials/catalysis
pitfalls: >
  On OC22's total energies every model in the paper's IS2RE-Total table is under 4%, so the metric sits
  near its floor there. The 0.02 eV threshold is the OC20 paper's.
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3

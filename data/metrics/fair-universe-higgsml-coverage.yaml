# data/metrics/fair-universe-higgsml-coverage.yaml -- P3-S6-T08 (04 S6; 12 S3.4). The coverage of the FAIR Universe
# HiggsML Uncertainty Challenge's 68.27% confidence intervals. Its optimum is a target, 0.6827, not a maximum, so it
# is not headroom-computable: Metric.headroom_null_reason() answers metric-not-headroom-computable, a reason 12
# S3.4's table does not list (review check on fair-universe-higgsml). Bound to the interval width.
id: fair-universe-higgsml-coverage
name: Coverage
full_name: Coverage of the 68.27% confidence interval (FAIR Universe HiggsML Uncertainty Challenge)
definition: >
  The fraction of pseudo-experiments whose reported 68.27% interval [mu16, mu84] contains the true signal
  strength mu the pseudo-experiment was generated with. The nominal 68.27% is the target: the challenge
  scores the closer the better, penalising coverage below the target more steeply than coverage above
  it.
value_type: ratio
range:
  min: 0
  max: 1
optimum: target
optimum_target: 0.6827
aggregation: Over the pseudo-experiments of an evaluation (10 trials of 100 on the public
  leaderboard, 1000 trials of 100 in the final ranking); the results page reports an average over
  the final evaluation.
units: fraction of pseudo-experiments
headroom_computable: false
must_report_with:
  - fair-universe-higgsml-interval-width
domains:
  - physics/particle-physics
pitfalls: >
  Never shown without the interval width: an interval as wide as mu's whole range covers every time, so
  a coverage alone says nothing about the measurement. Higher is not better; a coverage above the target
  is an overstated uncertainty. Its statistical error falls with the number of pseudo-experiments (sigma68,
  the binomial standard error the score uses), so a coverage from one trial of 100 is much noisier than
  one pooled over 1000 trials.
sources:
  - src-arxiv-2410-02867-v5-2026-11-24
  - src-fair-universe-higgs-challenge-site

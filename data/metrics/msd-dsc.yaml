# data/metrics/msd-dsc.yaml -- P3-S6-T06 (04 S6). One of the Medical Segmentation Decathlon's two metrics, the Dice
# similarity coefficient per target region on 3D volumes (src-arxiv-2106-05735-v1). Its own record because the
# challenge computes it per region and feeds it to a significance ranking, not to a mean.
id: msd-dsc
name: DSC
full_name: Dice similarity coefficient per target region (Medical Segmentation Decathlon)
definition: Twice the overlap of the predicted and reference masks of one target region in a 3D
  volume, divided by the sum of their sizes; 1 is a perfect mask and 0 no overlap. Computed for each
  of a task's one to three target regions separately.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Per volume and region. The ranking does not average it into one score; it turns each
  region's values into a significance score against the other entrants, and those ranks are averaged
  per task and over tasks.
must_report_with:
  - msd-nsd
domains:
  - medicine-health/medical-imaging-segmentation
pitfalls: A per-region value, so a task's number depends on which region (tumour core, whole organ)
  is meant; a paper's mean Dice over one task's sub-regions on its own folds is not a challenge
  score. The challenge's place is a pool-relative significance rank over both metrics, which no
  single Dice value orders.
sources:
  - src-arxiv-2106-05735-v1

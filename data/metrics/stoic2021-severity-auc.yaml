# data/metrics/stoic2021-severity-auc.yaml -- P3-S6-T06 (04 S6). STOIC2021's ranking metric (src-arxiv-2306-10484-v2:
# "Participants were ranked based on AUC for classifying COVID-19 severity, computed over cases with a positive COVID-19
# RT-PCR result."). Its own record: the population is the RT-PCR-positive cases only, not every scan.
id: stoic2021-severity-auc
name: Severity AUC
full_name: STOIC2021 AUROC for severe COVID-19 over RT-PCR-positive cases
definition: The area under the ROC curve of the system's likelihood that a patient will have severe
  COVID-19 (intubation or death within one month of the CT scan), computed only over the test cases
  whose COVID-19 RT-PCR result was positive.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: One statistic over the RT-PCR-positive cases of the test subset scored (test set A1, A2
  or the full test set).
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: Computed over RT-PCR-positive cases only, so it is not the AUC over all scans, and it is
  not STOIC2021's AUC for COVID-19 presence. Qualification-phase values (models trained on the 2,000
  public scans) and final-phase values (models the organisers trained on the sequestered data) are
  not comparable, and A1, A2 and the full test set are different subsets.
sources:
  - src-arxiv-2306-10484-v2
  - src-gc-stoic2021-home

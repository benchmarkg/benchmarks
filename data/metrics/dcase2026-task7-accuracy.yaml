# data/metrics/dcase2026-task7-accuracy.yaml -- P3-S8-T07 (04 S6). DCASE2026 Task 7's ranking metric, the
# overall accuracy over three domains (src-dcase-challenge2026-task7: "Systems will be ranked by overall
# accuracy."), shown as "Avg Accuracy" in the results tables (src-dcase-challenge2026-task7-results).
id: dcase2026-task7-accuracy
name: Avg Accuracy
full_name: Overall accuracy over three domains (DCASE2026 Task 7)
definition: Accuracy is computed separately for each of the task's three domains, a domain's
  accuracy being the average of its class-wise accuracies over the ten sound classes, and the
  overall accuracy is the average of the three, so the domains weigh the same whatever their sizes.
  Systems are ranked by it. Reported in percent.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
aggregation: Class-wise accuracy averaged within each domain, then the unweighted mean over the
  three domains.
units: percent
domains:
  - audio-speech/audio-event-understanding
pitfalls: The domains are learned in sequence without access to earlier domains' data, and the three
  domain accuracies (D1, D2, D3) are published beside the average; the average alone does not show
  which domain a system lost. One edition's number, on the 2026 evaluation set; not comparable with
  another DCASE task's accuracy, which averages differently.
sources:
  - src-dcase-challenge2026-task7
  - src-dcase-challenge2026-task7-results

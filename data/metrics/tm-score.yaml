# data/metrics/tm-score.yaml -- P3-S6-T03 (04 S6). The global-fold measure of CASP16's complex assessment, and one of
# CAMEO's scores. No source read expands the abbreviation, so full_name is null.
id: tm-score
name: TM-score
definition: >
  A superposition-based similarity between a model and the experimental structure over their equivalent
  residues, in which each residue's distance error is scaled by a length-dependent factor, so that small
  errors weigh more than large ones and the score of a random pair does not depend on its length. 1 is
  a perfect match.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
chance_baseline: 0.17
aggregation: per model of a target
domains:
  - biology-genetics/protein-structure-prediction
  - biology-genetics/protein-protein-interaction
pitfalls: >
  The value depends on which structure's length normalises it; the TM-score program normalises by the
  second structure, the experimental one, and TM-align reports a higher value than TM-score for the same
  pair because it optimises the alignment first. The chance level is a threshold, not a mean: the program's
  page puts randomly chosen unrelated proteins below 0.17, and pairs above 0.5 generally in the same fold.
  On complexes, TM-score and the interface scores disagree in both directions: a small mispredicted interface
  barely moves DockQ but changes the shape TM-score sees, and CASP16's complex assessors leave TM-score
  out for antibody-antigen targets.
sources:
  - src-tm-score-program-page
  - src-casp16-complex-2026-11-18
  - src-predictioncenter-casp16-help

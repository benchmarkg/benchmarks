# data/metrics/textarena-trueskill.yaml -- P1-S11-T04 (04 S13's rating case). Unbounded, pool-relative, no headroom.
# value_type elo is the vocabulary's one rating type; the rating itself is TrueSkill, not Elo.
id: textarena-trueskill
name: TextArena TrueSkill
definition: The mean of a TrueSkill posterior per entrant, initialised at mu 25 and sigma 25/3 and
  updated after every match from the win, draw and loss outcomes against the other entrants of one
  environment or environment grouping. Human players share one rating, listed as Humanity.
value_type: elo
range:
  min: null
  max: null
unbounded: true
optimum: max
requires_pool: true
headroom_computable: false
pitfalls: A rating moves with the pool and the matchmaking, so never compare ratings across
  environment groupings, dates or pools. The leaderboard reports the mean and its standard deviation
  separately and keeps inactive models in the rows; a low game count leaves a wide deviation. The
  MindGames analysis of the 2025 competition found TrueSkill can reward surviving opponents' errors
  and compress large differences in raw reward.
sources:
  - src-arxiv-2504-11442-v2
  - src-arxiv-2605-29512-v1

# data/metrics/oc-is2rs-afbt.yaml -- P3-S6-T02 (04 S6). Open Catalyst's IS2RS DFT force threshold rate.
id: oc-is2rs-afbt
name: AFbT
full_name: Average Forces below Threshold (Open Catalyst IS2RS)
definition: >
  The percentage of predicted relaxed structures whose largest DFT-calculated per-atom force on free atoms
  is below a threshold and whose positions are within 0.5 Å of the DFT relaxed structure, averaged over
  force thresholds from 0.01 to 0.4 eV/Å in steps of 0.001 eV/Å.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
units: percent
domains:
  - chemistry-materials/catalysis
pitfalls: >
  It needs a DFT single-point calculation on every scored structure, so the OC20 paper computes it on
  a random subset of 500 relaxed structures from the validation and test sets rather than on a whole split.
  A value is only as comparable as the subset it was computed on.
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3

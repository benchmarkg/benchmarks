# data/metrics/dockq-acceptable-targets.yaml -- P3-S8-T01 (04 S6). The count CASP16's complex assessors give for the
# groups they compare on the antibody-antigen targets, and the measure of the server and human claims of one lab
# (data/claims/casp/).
id: dockq-acceptable-targets
name: Targets with an acceptable model (DockQ ≥ 0.23)
definition: >
  The number of targets in a set on which a group has a model of CAPRI acceptable quality or better, that
  is a DockQ of 0.23 or more.
value_type: count
range:
  min: 0
optimum: max
aggregation: a count over a stated set of targets; the CASP16 complex assessment gives it for the
  eight Phase 1 antibody and nanobody-antigen targets
units: targets
headroom_computable: false
domains:
  - biology-genetics/protein-protein-interaction
pitfalls: >
  A count, not a rate: its top is the size of the target set, which differs by category and edition, so
  headroom is not computed and a count means nothing without its set. The CASP16 complex assessment does
  not say whether a target counts on a group's first model or its best. Medium and high quality (DockQ
  0.49 and 0.80) are tiers the count does not distinguish.
sources:
  - src-casp16-complex-2026-11-24
  - src-plosone-dockq-2016

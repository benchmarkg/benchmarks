# data/metrics/pi-cai-ranking-score.yaml -- P3-S6-T06 (04 S6). The PI-CAI challenge's ranking score
# (src-picai-tasks-evaluation: "Overall Ranking Score = (AP + AUROC) / 2"), the mean of a patient-level and a
# lesion-level metric rather than an accuracy.
id: pi-cai-ranking-score
name: PI-CAI ranking score
full_name: PI-CAI overall ranking score, the mean of patient-level AUROC and lesion-level AP
definition: The unweighted mean of two task-specific metrics for clinically significant prostate
  cancer (csPCa) in biparametric MRI. Patient-level diagnosis is scored by the area under the ROC
  curve of each exam's csPCa likelihood; lesion-level detection by the average precision of the
  detection map's lesion candidates, a candidate counting as a true positive when it overlaps a
  reference lesion by an IoU of at least 0.10 in 3D.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: AUROC over all exams of the cohort and AP over all lesion candidates of the cohort,
  then (AUROC + AP) / 2.
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: A cohort statistic, so the Hidden Tuning Cohort's 100 exams and the Hidden Testing
  Cohort's 1,000 give numbers that are not comparable with each other, and neither is comparable
  with the reader study, which scores radiologists by AUROC alone. The AP half depends on the 0.10
  IoU hit criterion and on how overlapping candidates are discarded; FROC sensitivity at
  radiologists' false-positive rates is reported beside it and does not rank.
sources:
  - src-picai-tasks-evaluation

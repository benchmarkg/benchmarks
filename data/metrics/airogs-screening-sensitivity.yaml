# data/metrics/airogs-screening-sensitivity.yaml -- P3-S6-T06 (04 S6). AIROGS's second screening metric, the
# sensitivity for referable glaucoma at 95% specificity (src-arxiv-2302-01738-v2).
id: airogs-screening-sensitivity
name: Sensitivity at 95% specificity
full_name: AIROGS sensitivity for referable glaucoma at 95% specificity
definition: The share of referable-glaucoma test images the system's likelihood flags when its
  threshold is set so that 95% of the non-referable images are correctly passed.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: One statistic over the gradable test images; it enters the final ranking as a rank
  among the teams.
must_report_with:
  - airogs-screening-pauc
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: One operating point on the ROC curve, chosen for screening's low prevalence; a sensitivity
  at another specificity, or at the system's own decision threshold, is a different number.
sources:
  - src-arxiv-2302-01738-v2

# data/metrics/open-asr-wer.yaml -- P3-S6-T07 (04 S6). The Open ASR Leaderboard's word error rate, bound to its RTFx.
id: open-asr-wer
name: WER
full_name: Word error rate (Open ASR Leaderboard)
definition: >
  The word error rate of a model's transcripts against a dataset's reference transcripts, after both are
  normalised by the leaderboard's English normaliser, which removes punctuation and casing, standardises
  numbers and spellings and drops filler words, closely following Whisper's. A track's Average WER is
  the macro-average of the per-dataset WERs over the datasets the board's version averages, and models
  are ranked by it, lowest first. Reported in percent.
value_type: ratio
range:
  min: 0
optimum: min
aggregation: Per dataset, then macro-averaged over a track's datasets (Average WER); the
  private-data tab publishes only aggregates over its sets.
units: percent
must_report_with:
  - open-asr-rtfx
domains:
  - audio-speech/speech-recognition
pitfalls: >
  Never shown without RTFx: the board ranks by accuracy with speed measured in the same run, and its paper
  holds that a single metric, word error rate, is not enough. A value means one board version: the datasets
  in the default average changed several times in 2026, and the English normaliser changed on 24 June
  2026 and again on 6 November 2026, each moving the WERs, so values from different versions are not comparable.
  A per-dataset WER is not the Average WER. No source read states an upper bound, so the range sets only
  a minimum. Some closed models have a WER but no RTFx in the paper's Table 3 (a dash), which leaves their
  WER without the partner must_report_with asks for.
sources:
  - src-arxiv-2510-06961-v4
  - src-hf-open-asr-leaderboard-constants
  - src-hf-open-asr-leaderboard-init
  - src-hf-open-asr-leaderboard-init-2026-11

# data/metrics/e-above-hull-mae.yaml -- P0-S8-T02 (04 S6).
id: e-above-hull-mae
name: MAE (hull distance)
full_name: Mean absolute error of the predicted energy above the convex hull
definition: >
  The mean absolute difference between a model's predicted and the DFT reference distance to a fixed
  DFT convex hull, per atom. With the hull held fixed, it equals the formation-energy MAE.
value_type: ratio
range:
  min: 0
optimum: min
units: eV/atom
pitfalls: >
  A low MAE can coexist with many false positives near the 0 eV/atom stability threshold, which is the
  benchmark paper's central argument for classification metrics. `ratio` is the nearest value_type;
  the vocabulary has no term for a dimensional quantity (curation note on matbench-discovery).
sources:
  - src-matbench-discovery-nature
  - src-matbench-discovery-discovery-page

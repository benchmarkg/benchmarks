# data/metrics/pdebench-frmse-high.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's Fourier-space error in the high
# wavenumbers. An error norm: optimum zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-frmse-high
name: fRMSE high
full_name: RMSE in Fourier space, high-frequency band (PDEBench)
definition: >
  The error of the prediction's Fourier spectrum in the high-wavenumber band, computed as for fRMSE low
  (pdebench-frmse-low) and averaged over the band's wavenumbers, then over output variables and time steps.
  The paper puts the high band at wavenumber 13 and above.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the mean over the band's wavenumbers, then over
  output variables and scored time steps.
units: the PDE variable's own units, scaled by the domain length
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  The band edges differ between the paper (13 and above) and the evaluation script's defaults (iHigh=12,
  which starts the band at 12), so a value says which convention made it (pdebench-frmse-low). The paper
  uses this band to show a model's error at sharp features, where it rises by orders of magnitude; the
  band's upper end is the grid's own resolution limit, so it is not comparable across resolutions.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

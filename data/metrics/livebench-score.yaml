# data/metrics/livebench-score.yaml -- P1-S11-T06 (04 S6). LiveBench's headline score, the metric that
# ingest/mappings/epoch/live_bench_external.yaml already names for Epoch's live_bench_external.csv `Global average`.
id: livebench-score
name: LiveBench score
full_name: LiveBench global average, the unweighted mean of the category averages of one release
definition: >
  For one LiveBench release, each question is scored 0-1 against its ground truth, each task is the mean
  of its questions, each category the mean of its tasks, and the score the unweighted mean of the categories
  (six to 2025-04-25, seven from 2025-05-30). LiveBench publishes it on 0-100; on this 0-1 scale it is
  the published value divided by 100.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
chance_baseline: 0.0
score_ceiling: 1.0
pitfalls: >
  A score names its release: every release replaces part of the questions and some add or retire tasks
  or a whole category, so numbers from different releases are not comparable, and a value without its
  release is uninterpretable. Category means weigh tasks unequally (a category with fewer tasks weighs
  more per task). Scores inside a release can change after publication when scoring functions are fixed
  or a category is re-run (the 2025-05-30 agentic coding re-run of October 2025). The site computes the
  average in the browser, and its code returns fixed values for two rows (grok-3-thinking 72, grok-3 58)
  instead of their mean. Rows carry an effort setting in the model name, and the newest questions of a
  release are private, so an outside run of the current release is not possible.
sources:
  - src-arxiv-2406-19314-v2
  - src-github-livebench-site-averaging
  - src-github-livebench-changelog
  - src-epoch-benchmark-data

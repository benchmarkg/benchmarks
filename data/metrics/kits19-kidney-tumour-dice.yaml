# data/metrics/kits19-kidney-tumour-dice.yaml -- P3-S6-T06 (04 S6). KiTS19's ranking metric (src-arxiv-1912-01054-v2:
# "teams were ranked based on their average Sørensen-Dice coefficient between the kidneys and tumors across these 90
# test cases"). KiTS21 and KiTS23 rank differently (kits-hec-dice, kits-hec-surface-dice), so it is its own record.
id: kits19-kidney-tumour-dice
name: Kidney and tumour Dice
full_name: KiTS19 composite Sørensen-Dice, the mean of kidney and tumour Dice over the test cases
definition: For each of KiTS19's 90 test cases, the Sørensen-Dice coefficient of the predicted
  kidney region (kidney and tumour together) and of the predicted tumour against the reference
  segmentation; the score is the average of the two, averaged over the test cases.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Per case and region (kidney, tumour), then the mean over the two regions and the 90
  test cases.
domains:
  - medicine-health/medical-imaging-segmentation
pitfalls: KiTS19's 90 test cases were folded into the KiTS21 training set, so a value on them from a
  model trained on later KiTS data is not a held-out score. It weighs kidney and tumour equally and
  has no cyst class, so it is not comparable with the hierarchical-evaluation-class Dice of KiTS21
  and KiTS23.
sources:
  - src-arxiv-1912-01054-v2

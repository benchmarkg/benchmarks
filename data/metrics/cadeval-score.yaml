# data/metrics/cadeval-score.yaml -- P1-S8-T04 (04 S6). CadEval's headline score, the metric that
# ingest/mappings/epoch/cad_eval_external.yaml already names for Epoch's cad_eval_external.csv `Overall pass (%)` column.
id: cadeval-score
name: CadEval overall pass rate
full_name: Share of CadEval attempts whose rendered part passes every geometry check against the
  reference
definition: >
  The fraction of a model's attempts (25 tasks, each run for a set number of replicates: two in the published
  run of 2025-04-22) that pass overall. An attempt passes when the model's OpenSCAD script was generated
  and rendered to an STL (for Zoo's text-to-CAD, when an STL was returned) and none of the six checks
  against the task's reference mesh failed: watertight, the expected number of connected components, the
  bounding box after ICP alignment within 1 mm, volume within 2%, Chamfer distance at most 1 mm and the
  95th-percentile Hausdorff distance at most 1 mm. Failed generations and renders count as failures. The
  repository reports it as a percentage; Epoch's export carries it as a fraction.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
chance_baseline: 0.0
score_ceiling: 1.0
aggregation: unweighted mean of the per-attempt pass verdicts over every task and replicate
pitfalls: >
  A number depends on the thresholds in config.yaml, the replicate count, the system prompt (the repository
  ships four templates) and, for thinking models, the thinking budget, which the README says moves results.
  The checks align meshes with ICP and Open3D's sampling is not seeded, so a borderline attempt can flip
  between runs; the maintainer estimates false negatives at about 5%, and the README says small missing
  features can pass. With 25 tasks and two replicates, one task moves the score by four points. The dashboard's
  other rates (generation, render, per-check) are conditional on earlier stages and are not this metric.

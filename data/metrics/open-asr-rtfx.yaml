# data/metrics/open-asr-rtfx.yaml -- P3-S6-T07 (04 S6). The Open ASR Leaderboard's inverse real-time factor, bound to its WER.
id: open-asr-rtfx
name: RTFx
full_name: Inverse real-time factor (Open ASR Leaderboard)
definition: >
  The total duration of the audio a model transcribed divided by the time it took to transcribe it, measured
  in the same evaluation run as the WER. Higher values mean faster inference; the leaderboard reports
  the inverse of the real-time factor so that higher is better and speedups read directly (10 times, 100
  times). It can be computed for one utterance or over a batch of audio.
value_type: ratio
range:
  min: 0
unbounded: true
optimum: max
aggregation: Over the audio of a run, as total audio duration over total transcription time.
units: seconds of audio per second of transcription
headroom_computable: false
must_report_with:
  - open-asr-wer
domains:
  - audio-speech/speech-recognition
pitfalls: >
  Never shown without WER: speed is the board's second axis, and the paper finds that the architectures
  with the best RTFx buy it with accuracy. The absolute value depends on the hardware: the paper's runs
  used one A100 with a batch size of 64 where memory allowed, reduced adaptively otherwise, and the board's
  runs moved to one H200 on 24 June 2026, so values are comparable only within one setup, never across
  that date. It also moves with the batch size a run could fit. Some closed models have no RTFx at all
  in the paper's Table 3 (a dash). The ratio has no upper bound, so headroom is not computable.
sources:
  - src-arxiv-2510-06961-v4
  - src-hf-open-asr-leaderboard-constants
  - src-github-open-asr-leaderboard-readme
  - src-hf-open-asr-leaderboard-init

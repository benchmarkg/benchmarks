# data/metrics/oc-s2ef-force-mae.yaml -- P3-S6-T02 (04 S6). Open Catalyst's S2EF force error.
id: oc-s2ef-force-mae
name: S2EF force MAE
full_name: Mean absolute error of the predicted per-atom forces (Open Catalyst S2EF)
definition: >
  The mean absolute difference between the per-atom forces a model computes for a structure and the DFT
  forces, per force component. The OC20 paper computes it over free catalyst and adsorbate atoms only.
value_type: ratio
range:
  min: 0
optimum: min
aggregation: >
  Mean over the force components of every scored atom in one subsplit (the board's scorer divides the
  summed absolute error by three times the atom count); the Hugging Face board also reports the mean of
  the four OC20 subsplits (avg_forces_mae).
units: eV/Å
domains:
  - chemistry-materials/force-fields-potentials
pitfalls: >
  Forces are derivatives of the energy, and a model can have a small force error beside a large energy
  error, which is why the OC20 paper pairs the two in EFwT. Only free atoms are scored in the paper's
  definition; a re-implementation that scores fixed atoms too is a different measurement.
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3
  - src-hf-fairchem-leaderboard-evaluator-212fd1e

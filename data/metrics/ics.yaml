# data/metrics/ics.yaml -- P3-S6-T03 (04 S6). The contact-level interface score of CASP's complex assessments, the
# "F1 metric" of the CASP16 overview. The sources read give the abbreviation only, so full_name is null.
id: ics
name: ICS
definition: >
  The F1 score of a model's inter-chain contacts against the experimental structure's: the harmonic mean
  of the precision and the recall of interacting residue pairs, a pair being two residues of different
  chains within 5 Å.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: per interface; CASP16's complex assessors average a target's interfaces weighted by the
  base-10 logarithm of interface size
domains:
  - biology-genetics/protein-protein-interaction
pitfalls: >
  Counts contacts, not geometry, so it is read beside DockQ and QS-score. The contact cut-off, the chain
  mapping and the way interfaces are combined differ between the OpenStructure values on the Prediction
  Center's site and the assessors' recomputation, and a stoichiometry mismatch needs a mapping rule of
  its own (CASP16's reciprocal best match), which changes the value. Trivial interfaces between two antibody
  chains or two antigen chains can dominate it, which is why CASP16 scores antibody-antigen targets on
  the antibody-antigen interface alone.
sources:
  - src-casp16-complex-2026-11-18
  - src-casp16-overview
  - src-casp16-complex

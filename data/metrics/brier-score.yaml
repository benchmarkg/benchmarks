# data/metrics/brier-score.yaml -- P0-S8-T06 (04 S6). The Brier score of a binary probability forecast.
id: brier-score
name: Brier score
definition: >
  The mean squared difference between a forecast probability and the outcome (1 if the event
  happened, 0 if not), averaged over forecasts. 0 is a perfect forecast; always forecasting 50% scores
  0.25; forecasting certainty on the wrong outcome scores 1.
value_type: ratio
range:
  min: 0
  max: 1
optimum: min
aggregation: mean over forecasts; ForecastBench averages dataset and market questions separately and
  then takes the mean of the two
pitfalls: >
  Depends on the question mix: easy questions give low scores to everyone, so Brier scores from
  different question sets are not comparable without an adjustment for difficulty. On ForecastBench a
  score over unresolved market questions uses the current crowd forecast in place of the outcome.
sources:
  - src-forecastbench-arxiv-html

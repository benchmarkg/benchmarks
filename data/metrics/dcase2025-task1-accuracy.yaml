# data/metrics/dcase2025-task1-accuracy.yaml -- P3-S8-T07 (04 S6). DCASE2025 Task 1's ranking metric, the
# class-wise macro-averaged accuracy (src-dcase-challenge2025-task1: "The leaderboard ranking score of individual
# submissions is based on their class-wise macro-averaged accuracies.").
id: dcase2025-task1-accuracy
name: Accuracy
full_name: Class-wise macro-averaged accuracy (DCASE2025 Task 1)
definition: For each of the ten acoustic scene classes, the share of the evaluation recordings of
  that class that a system assigns to it, averaged over the ten classes, so each class weighs the
  same whatever its size. The leaderboard ranks submissions by it; multi-class log loss is computed
  too and does not rank. Reported in percent.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
aggregation: Per class over the evaluation set, then the unweighted mean over the ten classes.
units: percent
domains:
  - audio-speech/audio-event-understanding
pitfalls: "One edition's number: each DCASE edition ranks on an evaluation set of its own (2025: 12 cities
  and 10 scenes), so a value is comparable neither with another year's Task 1 accuracy nor with the development-test
  split that papers report. The results page prints it with one decimal and a 95% confidence interval
  in the systems ranking, and with two decimals in the teams ranking. Systems are also ranked on memory
  and MACs, which the accuracy alone does not show."
sources:
  - src-dcase-challenge2025-task1
  - src-dcase-challenge2025-task1-results

# data/metrics/conic-mpq-plus.yaml -- P3-S6-T06 (04 S6). CoNIC task 1's ranking metric, multi-class panoptic quality
# with its statistics pooled over all images (src-gc-conic-evaluation: "Hence, for the purpose of this challenge, we
# refer to the metric as `mPQ`+"). Its own record because the organisers say it differs from the per-image mPQ that
# PanNuke, MoNuSAC and Lizard's own paper report.
id: conic-mpq-plus
name: mPQ+
full_name: CoNIC multi-class panoptic quality, statistics pooled over all images
definition: For each of the six nucleus types, the panoptic quality of the predicted instances
  against the reference, a predicted and a reference nucleus being matched when their IoU exceeds
  0.5, with the matched pairs, unmatched references and unmatched predictions counted over all
  images together; the six types' values are averaged.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: True positives, false negatives and false positives pooled per type over the whole test
  set, PQ per type, then the unweighted mean over the six types.
domains:
  - medicine-health/medical-imaging-segmentation
pitfalls: Not the mPQ of earlier nuclei benchmarks, which compute PQ per image and class before
  averaging, so a value from PanNuke, MoNuSAC or Lizard's paper is a different number. The
  organisers pool to avoid undefined values when a type is absent from a patch.
sources:
  - src-gc-conic-evaluation

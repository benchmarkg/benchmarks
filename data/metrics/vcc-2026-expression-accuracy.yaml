# data/metrics/vcc-2026-expression-accuracy.yaml -- P0-S8-T04 (04 S6). One of the six scaled metrics of the Virtual Cell Challenge 2026.
id: vcc-2026-expression-accuracy
name: mse
full_name: Expression accuracy (Virtual Cell Challenge 2026)
definition: A squared distance between the predicted and measured expression profiles, corrected for
  the sampling floor that comes from having a finite number of cells, then normalised by the size of
  the measured effect; one ratio over the whole panel rather than a per-perturbation value.
formula_reference:
  https://github.com/ArcInstitute/cell-eval2/blob/main/docs/vcc2026_metrics/vcc2026-metrics.md
value_type: ratio
range:
  min: 0
  max: 1
unbounded: false
optimum: max
normalization_anchor: 'Reference-scaled per cell context: 0 is the cell-context mean (one average profile
  predicted for every perturbation) and 1 is a real replicate experiment (the held-out cells split in
  two, one half scored against the other), both measured on the withheld data (src-vcc-2026-evaluation).'
aggregation: per context over the panel, then scaled; the overall score averages the scaled values
  over the three contexts
headroom_computable: true
domains:
  - biology-genetics/perturbation-response-prediction
pitfalls: Recorded in its scaled form, the one the overall score averages. The raw column on the
  leaderboard is not comparable across metrics or contexts. The one metric clamped at both ends, to
  0 and 1, so it cannot pass the replicate. Its raw form is an error ratio where lower is better and
  1.0 means no skill; raw values in the hundreds or thousands are possible.
sources:
  - src-vcc-2026-evaluation
  - src-vcc-2026-faq

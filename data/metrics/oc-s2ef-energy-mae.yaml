# data/metrics/oc-s2ef-energy-mae.yaml -- P3-S6-T02 (04 S6). Open Catalyst's S2EF energy error.
id: oc-s2ef-energy-mae
name: S2EF energy MAE
full_name: Mean absolute error of the predicted energy of a structure (Open Catalyst S2EF)
definition: >
  The mean absolute difference between the energy a model computes for an atomic structure and the DFT
  energy of that structure, over the structures of one test split. In OC20 the energy is the adsorption
  energy; in OC22's S2EF-Total task it is the DFT total energy.
value_type: ratio
range:
  min: 0
optimum: min
aggregation: >
  Mean over the structures of one subsplit. The Hugging Face board also reports the plain mean of the
  four OC20 subsplits' values (avg_energy_mae).
units: eV
domains:
  - chemistry-materials/force-fields-potentials
  - chemistry-materials/catalysis
pitfalls: >
  One name covers two quantities: OC20's adsorption energies and OC22's total energies, whose scales differ
  by orders of magnitude (OC22's median baseline is about 163 eV), so a value never compares across the
  two generations. It is not the IS2RE relaxed-energy error (oc-is2re-energy-mae), which scores another
  task on another item set. `ratio` is the nearest value_type; the vocabulary has no term for a dimensional
  quantity (as for e-above-hull-mae).
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3
  - src-hf-fairchem-leaderboard-evaluator-212fd1e

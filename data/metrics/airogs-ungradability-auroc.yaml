# data/metrics/airogs-ungradability-auroc.yaml -- P3-S6-T06 (04 S6). AIROGS's second robustness metric (src-arxiv-
# 2302-01738-v2: "we calculated the area under the receiver operator characteristic curve using the human reference for
# ungradability as the true labels"), computed from a scalar the system emits for ungradability.
id: airogs-ungradability-auroc
name: Ungradability AUROC
full_name: AIROGS AUROC of the system's ungradability scalar
definition: The area under the ROC curve of a non-thresholded scalar the system emits for each
  image, rising with its likelihood of being ungradable (an entropy or an ensemble variance, for
  instance), against the human ungradability reference.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: One statistic over the test images; it enters the final ranking as a rank among the
  teams.
must_report_with:
  - airogs-ungradability-kappa
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: Scores an uncertainty or out-of-distribution signal, not glaucoma screening, so it is not
  comparable with the screening AUROCs reported on the same data.
sources:
  - src-arxiv-2302-01738-v2

# data/metrics/fair-universe-higgsml-interval-width.yaml -- P3-S6-T08 (04 S6; 12 S3.4). The average width of the
# FAIR Universe HiggsML Uncertainty Challenge's 68.27% confidence intervals. The smaller the better with a bound of
# zero, so its optimum is zero and headroom is refused with lower-is-better-optimum-zero. Bound to the coverage.
id: fair-universe-higgsml-interval-width
name: Average interval width
full_name: Average width of the 68.27% confidence interval (FAIR Universe HiggsML Uncertainty
  Challenge)
definition: >
  The mean over pseudo-experiments of |mu84 - mu16|, the width of the 68.27% confidence interval a submission
  reports for the Higgs signal strength mu, in units of mu (itself dimensionless). The challenge scores
  the smaller the better, at the coverage it asks for.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Over the pseudo-experiments of an evaluation (10 trials of 100 on the public
  leaderboard, 1000 trials of 100 in the final ranking); the results page reports an average over
  the final evaluation.
units: signal strength mu (dimensionless)
headroom_computable: false
must_report_with:
  - fair-universe-higgsml-coverage
domains:
  - physics/particle-physics
pitfalls: >
  Never shown without the coverage: a zero-width interval would almost never cover the true mu, so a small
  width is good only at the target coverage, and the score's regulariser exists to stop an unrealistically
  narrow interval from winning. Intervals were clipped at mu = 3, the competition's maximum, which narrows
  them at large mu for a reason the paper calls specific to the competition; a width from unclipped intervals
  is not comparable. Widths vary with the true mu (the paper plots them against it), and the pseudo-experiments'
  mu ran from 0.1 to 3, so a width is comparable only over the same distribution of mu.
sources:
  - src-arxiv-2410-02867-v5-2026-11-24
  - src-fair-universe-higgs-challenge-site

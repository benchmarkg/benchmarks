# data/metrics/gdt-ts.yaml -- P3-S6-T03 (04 S6). The score the Prediction Center ranks CASP's tertiary-structure
# category on, and the CASP16 overview's measure of monomer and RNA backbone agreement.
id: gdt-ts
name: GDT_TS
full_name: Global Distance Test -- Total Score
definition: >
  The mean of four percentages: the share of a model's residues that lie within 1, 2, 4 and 8 Å of the
  experimental structure, each taken under the superposition that maximises it. GDT_HA is the same calculation
  at 0.5, 1, 2 and 4 Å.
formula_reference: https://predictioncenter.org/casp16/doc/help.html
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
aggregation: per evaluation unit (a domain, or domains whose relative orientation most groups
  predict); the Prediction Center ranks groups by their summed z-scores over the units, not by a
  mean GDT_TS
units: percent
domains:
  - biology-genetics/protein-structure-prediction
  - biology-genetics/nucleic-acid-structure
pitfalls: >
  Not normalised for size: the CASP16 monomer assessment finds that larger evaluation units score lower
  because GDT_TS is computed globally without normalising over length. A global superposition score, it
  rewards a correct fold and says little about local or side-chain accuracy, which is why the CASP16 assessors
  rank monomers on a weighted sum of nine measures (GDT_HA, lDDT, GDC_SC, MolProbity and others) while
  the Prediction Center's table ranks on GDT_TS z-scores alone; the two official rankings can disagree.
  A value belongs to an evaluation unit that the assessors define per edition, so values on differently
  split targets do not compare. At the top of the scale the CASP16 overview reads further gains as limited
  by experimental accuracy, not by methods.
sources:
  - src-predictioncenter-casp16-help
  - src-bioinformatics-lddt-2013
  - src-casp16-zscores
  - src-casp16-overview
  - src-casp16-monomer-2026-11-18

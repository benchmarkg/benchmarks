# data/metrics/kappa-srme.yaml -- P0-S8-T02 (04 S6).
id: kappa-srme
name: κSRME
full_name: Symmetric relative mean error in phonon-mode contributions to lattice thermal
  conductivity
definition: >
  An error in predicted lattice thermal conductivity that compares the per-phonon-mode contributions
  before they are summed, so errors that cancel in the total are still counted (Póta et al.). A
  material whose prediction fails, e.g. through imaginary modes, is assigned the maximum, 2.
value_type: ratio
range:
  min: 0
  max: 2
optimum: min
pitfalls: >
  Sensitive to the relaxation protocol; the leaderboard's protocol is simplified relative to Póta et al.'s
  (src-matbench-discovery-homepage), so values are not comparable with that paper's. The finite-difference
  displacement matters too: the PhononDB-PBE reference uses 0.03 Å, and the leaderboard marks values from
  models run at 0.01 Å as not strictly comparable (src-github-matbench-discovery-labels-6d587c1).
sources:
  - src-pota-kappa-arxiv-html
  - src-matbench-discovery-homepage
  - src-github-matbench-discovery-labels-6d587c1

# data/metrics/weatherbench-2-rmse.yaml -- P3-S6-T04 (04 S6). WeatherBench 2's deterministic headline metric.
id: weatherbench-2-rmse
name: RMSE
full_name: Root mean squared error (WeatherBench 2)
definition: >
  The area-weighted root mean squared difference between a forecast field and the ground truth for one
  variable at one pressure level, one region and one lead time, over every initialisation of the evaluation
  year: the squared errors are averaged over time and grid points together and the root is taken once
  (WeatherBench 1 took the time mean outside the root). Grid points that lie below ground at a pressure
  level are left out, and each pressure level is scored on its own. For 850 hPa wind the headline score
  is the wind-vector RMSE, over the u and v components together.
value_type: ratio
range:
  min: 0
optimum: min
aggregation: none across the grid; one value per (variable, level, region, lead time) cell of an
  evaluation year at one evaluation resolution
units: the variable's own; the results files carry no units attribute
domains:
  - earth-climate/weather-forecasting
pitfalls: >
  A value is one cell of a grid, never a score for a model: it means nothing without its variable, level,
  region, lead time, evaluation year and evaluation resolution, and the paper notes that absolute values
  differ significantly between resolutions. Operational forecasts are scored against their own analysis
  (HRES at t=0) and every other model against ERA5, so two values at one cell can differ in ground truth.
  RMSE favours smooth forecasts: the paper finds the IFS ensemble mean, which is not a realistic forecast,
  beating IFS HRES at longer lead times. `ratio` is the nearest value_type; the vocabulary has no term
  for a dimensional quantity.
sources:
  - src-arxiv-2308-15560-v2
  - src-weatherbench-2-faq
  - src-weatherbench-2-homepage

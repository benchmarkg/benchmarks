# data/metrics/airogs-ungradability-kappa.yaml -- P3-S6-T06 (04 S6). AIROGS's first robustness metric, Cohen's kappa
# between the system's ungradability decisions and the graders' (src-arxiv-2302-01738-v2). Not CAMELYON17's kappa:
# unweighted, two classes, a different question.
id: airogs-ungradability-kappa
name: Ungradability kappa
full_name: AIROGS Cohen's kappa for ungradable images
definition: Cohen's kappa between the system's binary decision that an image is ungradable and the
  human reference, over the test images; 1 is full agreement and 0 the agreement expected by chance.
value_type: ratio
range:
  min: -1
  max: 1
optimum: max
aggregation: One statistic over the test images; it enters the final ranking as a rank among the
  teams.
must_report_with:
  - airogs-ungradability-auroc
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: Scores the robustness half of the challenge, not glaucoma detection, and depends on the
  share of ungradable images in the test set, which the training set does not contain.
sources:
  - src-arxiv-2302-01738-v2

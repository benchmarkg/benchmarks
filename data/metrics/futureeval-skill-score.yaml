# data/metrics/futureeval-skill-score.yaml -- P1-S12 sweep follow-up (04 S6). The Model Leaderboard's skill score.
id: futureeval-skill-score
name: FutureEval skill score
full_name: FutureEval Model Leaderboard forecasting skill score (Metaculus)
definition: >
  The forecasting skill score that ranks models on FutureEval's Model Leaderboard. It is determined
  from head-to-head Peer Scores between models on the questions they forecast (the methodology calls
  Peer Scores essentially differences in log scores), counts only forecasts made within one year of a
  model's first forecast, and is set to 0 for GPT-4o; higher is better.
value_type: ratio
range:
  min: null
  max: null
unbounded: true
optimum: max
normalization_anchor: 0 is GPT-4o's score, set by definition ("arbitrarily set to 0 for GPT-4o",
  src-github-metaculus-futureeval-methodology-d1e2145); the Pro and community baselines on the
  performance-over-time graph are computed on the questions humans and bots both forecast.
aggregation: head-to-head Peer Scores across diverse questions, combined into one score per model;
  how the pairwise scores are combined is described in a Metaculus notebook (42076) that was not
  read
headroom_computable: false
pitfalls: >
  A relative scale: a value says how a model compares with the others it met head to head, anchored
  at GPT-4o, not how often it was right. The methodology calls it roughly comparable to the Peer
  Scores of regular tournaments, so it is not the bot tournaments' own leaderboard number. Values
  change as questions resolve, and a model's forecasts more than a year after its first one are not
  counted, because performance worsens as a model's training data ages.
sources:
  - src-github-metaculus-futureeval-methodology-d1e2145

# data/metrics/kendall-tau.yaml -- P3-S6-T03 (04 S6). A general rank correlation, first used here for CASP16's
# ligand-affinity category, whose assessors give it a ceiling below 1 set by experimental uncertainty.
id: kendall-tau
name: Kendall's tau
full_name: Kendall rank correlation coefficient
definition: >
  A rank correlation between predicted and measured values over a set of items (in CASP16, the binding
  affinities of one target's ligands): the excess of concordant over discordant pairs, scaled to lie between
  -1 (the order reversed) and 1 (the same order).
value_type: ratio
range:
  min: -1
  max: 1
optimum: max
aggregation: over the ligands of one affinity set
domains:
  - biology-genetics/drug-target-interaction
pitfalls: >
  A ranking measure: it ignores how far off each predicted affinity is. On CASP16's affinity sets the
  attainable value is about 0.73, not 1, because the experimental affinities carry their own uncertainty
  (src-casp16-ligand), so a tau is read against that ceiling. Values on different ligand sets do not compare.
sources:
  - src-casp16-ligand

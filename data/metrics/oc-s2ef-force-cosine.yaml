# data/metrics/oc-s2ef-force-cosine.yaml -- P3-S6-T02 (04 S6). Open Catalyst's S2EF force-direction agreement.
id: oc-s2ef-force-cosine
name: S2EF force cosine
full_name: Mean cosine between predicted and DFT per-atom forces (Open Catalyst S2EF)
definition: >
  The mean cosine of the angle between the per-atom forces a model computes and the DFT forces, over free
  catalyst and adsorbate atoms: 1 when every force points the right way.
value_type: ratio
range:
  min: -1
  max: 1
optimum: max
domains:
  - chemistry-materials/force-fields-potentials
pitfalls: >
  It scores direction only, so a force with the right direction and the wrong magnitude scores 1; read
  it beside the force MAE.
sources:
  - src-arxiv-2010-09990-v5
  - src-arxiv-2206-08917-v3

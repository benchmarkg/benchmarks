# data/metrics/vcc-2026-perturbation-discrimination.yaml -- P0-S8-T04 (04 S6). One of the six scaled metrics of the Virtual Cell Challenge 2026.
id: vcc-2026-perturbation-discrimination
name: pds
full_name: Perturbation discrimination (Virtual Cell Challenge 2026)
definition: "Whether each predicted perturbation effect is closer to its own measured effect than to any
  other perturbation's: every measured effect in the panel is ranked by cosine distance from the prediction,
  and the score is where the true one lands. The rank is within the panel."
formula_reference:
  https://github.com/ArcInstitute/cell-eval2/blob/main/docs/vcc2026_metrics/vcc2026-metrics.md
value_type: ratio
unbounded: true
optimum: max
normalization_anchor: 'Reference-scaled per cell context: 0 is the cell-context mean (one average profile
  predicted for every perturbation) and 1 is a real replicate experiment (the held-out cells split in
  two, one half scored against the other), both measured on the withheld data (src-vcc-2026-evaluation).'
aggregation: per context over the panel, then scaled; the overall score averages the scaled values
  over the three contexts
headroom_computable: false
domains:
  - biology-genetics/perturbation-response-prediction
pitfalls: 'Recorded in its scaled form, the one the overall score averages. The raw column on the leaderboard
  is not comparable across metrics or contexts. Not clamped above, so a prediction can score above the
  replicate; the anchor is a landmark, not a maximum. A rank within its own panel, so its value depends
  on the panel: validation and final-test values are not comparable.'
sources:
  - src-vcc-2026-evaluation
  - src-vcc-2026-faq

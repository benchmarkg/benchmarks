# data/metrics/dcase-asd-official-score.yaml -- P3-S8-T07 (04 S6). The official score of DCASE's anomalous
# sound detection task (Task 2), which the 2025 and 2026 task pages define in the same words
# (src-dcase-challenge2025-task2, src-dcase-challenge2026-task2-2026-11-24: "for each submitted system is given by
# the harmonic mean of the AUC and pAUC scores over all the machine types, sections, and domains").
id: dcase-asd-official-score
name: Official score
full_name: Official score, harmonic mean of AUC and pAUC (DCASE Task 2, 2025 and 2026)
definition: The harmonic mean of the AUC for every machine type, section and domain (source and
  target) and the partial AUC (pAUC) for every machine type and section of the evaluation set, the
  pAUC being the AUC over the false-positive-rate range from 0 to p, with p = 0.1. It ranks anomaly
  scores against each other, so no decision threshold enters it. Systems are ranked by it. Reported
  in percent.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
aggregation: Harmonic mean over every AUC (machine type, section, domain) and every pAUC (machine
  type, section) of the evaluation set.
units: percent
domains:
  - audio-speech/machine-condition-monitoring
pitfalls: Read from the 2025 and 2026 task pages only; the Task 2 lines of 2020 to 2024 were not
  read and may score differently, so do not attach their scores to this metric unchecked. A value
  means one edition's machine types and evaluation set, so a 2025 value and a 2026 value are not
  comparable under the same formula. The results pages print each score with a "±" figure they do
  not explain, which is not an uncertainty here. The precision, recall and F1 of the normal/anomaly
  decisions are published beside it and do not rank.
sources:
  - src-dcase-challenge2025-task2
  - src-dcase-challenge2026-task2-2026-11-24

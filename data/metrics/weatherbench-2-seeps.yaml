# data/metrics/weatherbench-2-seeps.yaml -- P3-S6-T04 (04 S6). WeatherBench 2's deterministic headline score for
# precipitation.
id: weatherbench-2-seeps
name: SEEPS
full_name: Stable Equitable Error in Probability Space (WeatherBench 2)
definition: >
  A categorical error score for accumulated precipitation, the deterministic headline score for 24 h precipitation.
  Forecast and ground-truth values are put in three classes, dry (below 0.25 mm/day), light and heavy,
  with light and heavy split so that light days are climatologically twice as common; a 3x3 contingency
  table for each lead time is weighted by a scoring matrix built from each location's climatological frequency
  of dry days; very dry and very wet locations are left out; and the result is averaged over the area.
  Lower is better.
value_type: ratio
range:
  min: 0
optimum: min
aggregation: none across the grid; one value per (region, lead time) cell of an evaluation year at
  one evaluation resolution
domains:
  - earth-climate/weather-forecasting
pitfalls: >
  The paper's figures show 1 - SEEPS, the positively oriented skill score, so a plotted value and this
  metric run in opposite directions. The site computes it for precipitation only and against ERA5 only,
  so operational forecasts, scored against their own analysis for every other variable, are scored against
  ERA5 here. WeatherBench 2's classes come from a smooth daily climatology rather than the usual monthly
  one, and the paper warns that ERA5 precipitation sometimes differs widely from rain gauges. No source
  read states the range: the minimum 0 is the scoring matrix's zero diagonal, and no maximum is set.
sources:
  - src-arxiv-2308-15560-v2
  - src-weatherbench-2-arxiv-html
  - src-weatherbench-2-deterministic-layout-2026-11-24

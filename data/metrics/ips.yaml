# data/metrics/ips.yaml -- P3-S6-T03 (04 S6). The residue-level interface score of CASP's complex assessments. The
# sources read give the abbreviation only, so full_name is null.
id: ips
name: IPS
definition: >
  The Jaccard coefficient of the interface residues of a model and of the experimental structure: the
  residues in both interfaces divided by the residues in either, M11 / (M01 + M10 + M11).
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: per interface; CASP16's complex assessors average a target's interfaces weighted by the
  base-10 logarithm of interface size
domains:
  - biology-genetics/protein-protein-interaction
pitfalls: >
  Scores which residues form the interface, not which pairs of them touch (that is ICS), so a model that
  brings the right surfaces together in the wrong orientation can still score well. The same mapping and
  combination caveats as ICS apply, including the antibody-antigen rule.
sources:
  - src-casp16-complex-2026-11-18

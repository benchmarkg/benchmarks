# data/metrics/midog-2021-f1.yaml -- P3-S6-T06 (04 S6). MIDOG 2021's ranking metric (src-arxiv-2204-03742-v1: "We
# calculated the F1 score over all N processed slides as"), an F1 with its counts pooled over the test slides and a
# distance-based match. Its own record: neither a mean of per-slide F1s nor the shared f1-score record.
id: midog-2021-f1
name: F1 (MIDOG 2021)
full_name: MIDOG 2021 mitotic figure detection F1, counts pooled over all test slides
definition: A detection is a true positive when its distance to a reference mitotic figure is below
  a threshold set from the figures' average size; unmatched detections are false positives and
  unmatched reference figures false negatives. F1 is 2TP / (2TP + FP + FN) with each count summed
  over all test slides before the ratio is taken.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Counts summed over the slides of the test set scored (the 80-slide final set or the
  20-slide preliminary set), then one F1; confidence intervals by bootstrapping over images.
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: Pooling lets slides rich in mitotic figures weigh more than sparse ones, which the
  organisers chose deliberately over a mean of per-slide F1s; a paper's mean per-slide F1 is a
  different number. It depends on the match distance, so an F1 computed with another hit criterion
  is not comparable. The MIDOG 2025 detection track's F1 was not checked against this definition.
sources:
  - src-arxiv-2204-03742-v1

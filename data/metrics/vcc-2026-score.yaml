# data/metrics/vcc-2026-score.yaml -- P0-S8-T04 (04 S6). The Virtual Cell Challenge 2026 headline score.
id: vcc-2026-score
name: Overall score
full_name: Virtual Cell Challenge 2026 overall score
definition: The unweighted mean of the six reference-scaled metrics, averaged across the three cell
  contexts of a round; nothing is weighted by perturbation count or cohort size.
formula_reference:
  https://github.com/ArcInstitute/cell-eval2/blob/main/docs/vcc2026_metrics/vcc2026-metrics.md
value_type: ratio
unbounded: true
optimum: max
normalization_anchor: 'Reference-scaled per cell context: 0 is the cell-context mean (one average profile
  predicted for every perturbation) and 1 is a real replicate experiment (the held-out cells split in
  two, one half scored against the other), both measured on the withheld data (src-vcc-2026-evaluation).'
aggregation: unweighted mean over six metrics, then over three cell contexts
headroom_computable: false
must_report_with:
  - vcc-2026-perturbation-discrimination
  - vcc-2026-expression-accuracy
  - vcc-2026-de-lfc-accuracy
  - vcc-2026-de-direction-fidelity
  - vcc-2026-de-direction-reach
  - vcc-2026-de-significance-overlap
domains:
  - biology-genetics/perturbation-response-prediction
pitfalls: "Not a percentage and not bounded at 1: five of its six components are unclamped above, so a
  submission can beat the replicate, and four are unclamped below, so there is no single floor. Validation
  and final-test scores use different cell lines, panels and scales and are not comparable. Headroom is
  marked uncomputable because the scale has no upper bound, although the replicate at 1 is the anchor
  it is built around (the benchmark's curation.notes, schema finding 3)."
sources:
  - src-vcc-2026-evaluation
  - src-vcc-2026-faq

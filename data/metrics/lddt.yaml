# data/metrics/lddt.yaml -- P3-S6-T03 (04 S6). A superposition-free local score, one of the six measures of CASP16's
# complex assessment and of its nine monomer measures, and one of CAMEO's scores.
id: lddt
name: lDDT
full_name: Local Distance Difference Test
definition: >
  A superposition-free comparison of a model with the experimental structure. For every pair of atoms
  in different residues of the reference that lie within an inclusion radius (15 Å by default), it asks
  whether the model keeps their distance within a tolerance, and averages the preserved fraction over
  four tolerances: 0.5, 1, 2 and 4 Å. Distances involving atoms in stereochemical violations or clashes
  count as not preserved.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: per model of a target (a monomer evaluation unit or a whole complex)
units: fraction
domains:
  - biology-genetics/protein-structure-prediction
  - biology-genetics/protein-protein-interaction
pitfalls: >
  One score on two scales: a fraction from 0 to 1 in the lDDT paper and the CASP16 assessment papers,
  and 0 to 100 on the Prediction Center's tables, where predicted lDDT (pLDDT) is compared against it;
  a value must say which. The inclusion radius, the atom set and whether the stereochemistry checks run
  all change the number. On a complex, global lDDT rewards correct chains even when their interfaces are
  wrong, which is why CASP16's complex assessors pair it with interface scores and leave it out for antibody-antigen
  targets. Interface lDDT and LDDT-PLI are different scores.
sources:
  - src-bioinformatics-lddt-2013
  - src-casp16-complex-2026-11-18
  - src-predictioncenter-casp16-help
  - src-casp16-monomer

# data/metrics/gdt-ha.yaml -- P3-S8-T01 (04 S6). The high-accuracy variant of GDT_TS, the first-listed of the nine
# measures CASP16's monomer assessors rank groups on, and the measure of their ColabFold reference number
# (data/claims/casp/).
id: gdt-ha
name: GDT_HA
full_name: Global Distance Test -- High Accuracy
definition: >
  GDT_TS at tighter cut-offs: the mean of four percentages, the share of a model's residues that lie within
  0.5, 1, 2 and 4 Å of the experimental structure, each taken under the superposition that maximises it.
formula_reference: https://predictioncenter.org/casp16/doc/help.html
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
aggregation: per evaluation unit; the CASP16 monomer assessors average a group's best-model values
  over the units it predicted, and rank groups on summed z-scores over nine measures, not on a mean
units: percent
domains:
  - biology-genetics/protein-structure-prediction
pitfalls: >
  Stricter than GDT_TS, so the two scales do not mix: for one model GDT_HA is the lower of the pair. A
  mean over evaluation units depends on the units a group predicted, and on whether each unit takes the
  group's first model or its best: the monomer assessors' ColabFold figure is a best-model mean over the
  59 of 74 Phase 1 units ColabFold modelled, which compares only with means over the same units. Like
  GDT_TS it is a global superposition score and is not normalised for size.
sources:
  - src-predictioncenter-casp16-help
  - src-casp16-monomer-2026-11-24

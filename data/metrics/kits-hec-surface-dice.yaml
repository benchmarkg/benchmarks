# data/metrics/kits-hec-surface-dice.yaml -- P3-S6-T06 (04 S6). The Surface Dice half of KiTS21's and KiTS23's
# ranking (src-arxiv-2307-01984-v1: "the Sørensen-Dice metric was supplemented with the Surface Dice metric").
id: kits-hec-surface-dice
name: HEC Surface Dice
full_name: KiTS Surface Dice averaged over the hierarchical evaluation classes (KiTS21, KiTS23)
definition: The Surface Dice of the prediction against the reference on each of the three
  hierarchical evaluation classes (kidney and masses, kidney mass, tumour), the share of the two
  boundaries lying within a tolerance of each other, averaged over the classes and the test cases.
  KiTS21 added it so that a small missed or spurious region is not swamped by a large correct one.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Per case and HEC, then the mean over the three HECs and the test cases; ranked beside
  the HEC Dice mean by rank-then-aggregate.
must_report_with:
  - kits-hec-dice
domains:
  - medicine-health/medical-imaging-segmentation
pitfalls: The value depends on the boundary tolerance the organisers set, which the sources read
  here do not state, so a Surface Dice computed with another tolerance is a different number. Half
  of a rank-then-aggregate ranking, and edition-specific like the HEC Dice.
sources:
  - src-arxiv-2307-01984-v1
  - src-kits-challenge-kits23

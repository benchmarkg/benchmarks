# data/metrics/r-squared.yaml -- P3-S6-T02 (04 S6). The coefficient of determination, as OCx24 reports it.
id: r-squared
name: R²
full_name: Coefficient of determination
definition: >
  One minus the ratio of the residual sum of squares of the predictions to the total sum of squares of
  the measured values about their mean: 1 for exact prediction, 0 for predicting the mean, negative for
  worse than the mean.
value_type: ratio
range:
  max: 1
optimum: max
aggregation: >
  Computed once over all held-out predictions of a cross-validation run (OCx24: leave one sample out,
  or leave one composition out).
pitfalls: >
  It depends on the spread of the measured values as much as on the model: the same errors give a higher
  R² on a more varied target set. OCx24 reports it per reaction and, for CO2 reduction, per product, under
  two cross-validation strategies that can give very different values for one model (the CO production
  rate: 0.44 leaving one sample out, 0 leaving one composition out), so a value means nothing without
  its strategy and its target.
sources:
  - src-arxiv-2411-11783-v1

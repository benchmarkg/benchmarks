# data/metrics/kits-hec-dice.yaml -- P3-S6-T06 (04 S6). The Sørensen-Dice half of KiTS21's and KiTS23's ranking, on
# hierarchical evaluation classes (HECs) rather than single regions (src-kits-challenge-kits23). It ranks only beside
# kits-hec-surface-dice: teams are ranked on each and the two places averaged.
id: kits-hec-dice
name: HEC Dice
full_name: KiTS Sørensen-Dice averaged over the hierarchical evaluation classes (KiTS21, KiTS23)
definition: The Sørensen-Dice coefficient of the prediction against the reference on each of three
  hierarchical evaluation classes, kidney and masses (kidney, tumour and cyst), kidney mass (tumour
  and cyst) and tumour alone, averaged over the classes and the test cases. KiTS21 computed it
  against sampled combinations of the several delineations drawn per region.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Per case and HEC, then the mean over the three HECs and the test cases. The edition's
  ranking averages each team's place on this mean and on the Surface Dice mean
  (rank-then-aggregate), with tumour Dice breaking ties.
must_report_with:
  - kits-hec-surface-dice
domains:
  - medicine-health/medical-imaging-segmentation
pitfalls: Half of a rank-then-aggregate ranking, so a team's place is not ordered by this number
  alone. Values are edition-specific (KiTS21's 100 Cleveland Clinic test cases, KiTS23's 110 cases
  with a second contrast phase) and are not comparable with KiTS19's kidney-and-tumour Dice.
sources:
  - src-kits-challenge-kits23
  - src-arxiv-2307-01984-v1

# data/metrics/gtbench-nra.yaml -- P1-S11-T04 (04 S6, 12 S3.4). GTBench's Normalized Relative Advantage:
# bounded, but measured against one named opponent, so no headroom (the attainable maximum is the
# opponent's and the game's, not the scale's).
id: gtbench-nra
name: NRA
full_name: Normalized Relative Advantage
definition: >
  The relative advantage of one participant over one opponent across K matches of one game: the participant's
  summed match scores minus the opponent's, divided by the sum of the two. In zero-sum games a match scores
  1 for a win, 0.5 for a draw and 0 for a loss; in non-zero-sum games, such as Blind Auction, the score
  is the reward the participant earned in the match. GTBench runs 50 valid matches per pairing, each side
  moving first in 25, and reports the NRA averaged over them; averages across games are also reported.
value_type: ratio
range:
  min: -1
  max: 1
optimum: max
normalization_anchor: >
  The opponent: 0 means as competitive as the opponent, above 0 better, below 0 worse (src-arxiv-2402-12348-v2).
  The paper's opponents are MCTS with 1000 simulations, Tit-for-Tat for the Iterated Prisoner's Dilemma,
  a random agent, and GPT-3.5-turbo with the Prompt Agent as the common opponent of the LLM-vs-LLM comparisons.
aggregation: mean over the 50 valid matches of a pairing; the paper also averages across games
headroom_computable: false
pitfalls: >
  An NRA is defined only against its opponent. A value against MCTS, against the random agent and against
  GPT-3.5-turbo are three different quantities, and a change of the opponent model, its agent or its snapshot
  changes the scale. The bound of 1 (every match won) is not the attainable maximum: against a near-optimal
  MCTS in Tic-Tac-Toe, a solved game with a forced draw, perfect play reaches 0, and the attainable value
  differs by game, so headroom against 1 would mislead and is not computed. Only valid matches count;
  a match in which an agent produced an illegal move is discarded and replayed, which the NRA does not
  show (the completion rate is reported apart). Means across games mix zero-sum outcome scores with non-zero-sum
  rewards.
sources:
  - src-arxiv-2402-12348-v2

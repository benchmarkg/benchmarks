# data/metrics/pdebench-crmse.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's conserved-value error. An error norm:
# optimum zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-crmse
name: cRMSE
full_name: RMSE of the conserved value (PDEBench)
definition: >
  How far the prediction departs from a physically conserved quantity of the simulated solution. The evaluation
  script sums each output variable over the grid, takes the root mean square over test samples of the
  difference between the predicted and the true sums, and divides by the number of grid points, so it
  is the error in the field's spatial mean; then it averages over variables and time steps.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the root mean square over test samples of the
  spatial-mean difference, then the mean over output variables and scored time steps.
units: the PDE variable's own units
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  The paper's Appendix B prints its formula under the name nRMSE and as a norm divided by N, so read the
  definition from the script, not the formula. Only meaningful where the summed variable is conserved
  by the PDE and its boundary conditions; a prediction can score well on it with large local errors that
  cancel in the sum.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

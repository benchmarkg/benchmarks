# data/metrics/critpt-challenge-accuracy.yaml -- P3-S5-T04 (04 S6). CritPt's headline: challenge-level
# average accuracy (the paper's Table 3, first column).
id: critpt-challenge-accuracy
name: CritPt challenge accuracy
full_name: CritPt average challenge accuracy, without expert answers
definition: The fraction of CritPt's 70 test challenges whose final answer the grader accepts,
  averaged over the independent runs made per challenge (five in the paper). Checkpoint accuracy and
  the "consistently solved" rate are different metrics.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
pitfalls: Moves with the tools the model may call (5.7% to 12.6% for one model) and with reasoning
  effort; and an average over five runs is not a single-run accuracy.
sources:
  - src-arxiv-2509-26574

# data/metrics/dockq.yaml -- P3-S6-T03 (04 S6). The interface score CASP16's complex assessment reads most, also
# the basis of CAPRI-style quality classes.
id: dockq
name: DockQ
definition: >
  A continuous quality score for one interface of a protein-protein model, combining Fnat (the share of
  native inter-chain contacts the model keeps), LRMS (the deviation of the ligand chain after superposing
  the receptor) and iRMS (the deviation over the interface residues) into one value between 0 and 1. Cut-offs
  at 0.23, 0.49 and 0.80 recover CAPRI's acceptable, medium and high quality classes.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: per interface; CASP16's complex assessors average a target's interfaces weighted by the
  base-10 logarithm of interface size, and where the model's stoichiometry differs from the target's
  take the lower of the target-to-model and model-to-target averages
domains:
  - biology-genetics/protein-protein-interaction
pitfalls: >
  Defined for a pair of chains, so a multi-chain target needs a rule for combining interfaces, and the
  rules differ: the CASP16 complex assessors' log-size weighting is not OpenStructure's overall score
  on the Prediction Center's site, and the assessors warn that their values may differ from the official
  ones. The DockQ paper puts the medium class at 0.49 while the CASP16 assessment writes medium quality
  as DockQ of 0.5 or more. CASP16 did not compute it for protein-nucleic acid (hybrid) targets. For antibody-antigen
  targets only the antibody-antigen interfaces count.
sources:
  - src-plosone-dockq-2016
  - src-casp16-complex-2026-11-18
  - src-casp16-complex

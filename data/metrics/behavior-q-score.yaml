# data/metrics/behavior-q-score.yaml -- P3-S8-T06 (04 S6). The BEHAVIOR Challenge's ranking metric, the task success
# score Q.
id: behavior-q-score
name: Q score
full_name: BEHAVIOR Challenge task success score (Q)
definition: Per episode, the fraction of the task's goal BDDL predicates satisfied at the episode's
  end, matched against the best-satisfied goal clause, so a policy earns partial credit without
  finishing the task; averaged over the edition's tasks (50 in 2025, 100 in 2026). It ranks
  submissions; secondary efficiency metrics break ties.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: Per episode, then the mean over a task's instances, then the mean over the tasks.
domains:
  - robotics-embodiment/mobile-manipulation
pitfalls: "Partial credit: the leaderboard prints the binary full-task success rate beside it, and the
  two rank differently. Public-validation values are self-reported on public instances, held-out values
  are the organisers' runs on hidden ones, and 2025 averages over 50 tasks, 2026 over 100, so a value
  means nothing without its edition and instance set."
sources:
  - src-behavior-challenge-2025-evaluation-2026-11-24
  - src-behavior-challenge-2025-leaderboard
  - src-behavior-challenge-evaluation

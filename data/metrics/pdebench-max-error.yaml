# data/metrics/pdebench-max-error.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's maximum error, its local worst
# case. An error norm (the L-infinity norm): optimum zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-max-error
name: max error
full_name: Maximum absolute error (PDEBench)
definition: >
  The largest absolute difference between the predicted and the simulated solution, taken over every grid
  point and every test sample, for each output variable and time step, then averaged over variables and
  time steps, as the evaluation script computes it. The paper reads it as the local worst case and as
  a proxy for the stability of time-stepping.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the maximum over grid points and test samples,
  then the mean over output variables and scored time steps.
units: the PDE variable's own units
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  A maximum over the whole test set, so it grows with the number of test samples and one bad sample sets
  it; a value from a different test-set size is not comparable. In the variables' own units, like RMSE,
  so not comparable across PDEs.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

# data/metrics/roboarena-pairwise-win-rate.yaml -- P3-S6-T05 (04 S7: claim_type pairwise). What a pairwise RoboArena
# claim's value is: one policy's non-tie win rate against one opponent, the number the site's policy pages list per
# common opponent (src-roboarena-site-bundle-2026-11-19). A claim on it names its `opponent` and no rating pool.
id: roboarena-pairwise-win-rate
name: RoboArena win rate against one opponent
full_name: RoboArena non-tie win rate of a policy against one opponent
definition: >
  For a policy and one opponent, the share of the A/B evaluations between the two that the evaluator decided
  in the policy's favour, with ties left out: wins divided by wins plus losses. The site lists it per
  common opponent beside the wins-ties-losses record it is computed from.
value_type: ratio
range:
  min: 0
  max: 100
optimum: max
units: percent
headroom_computable: false
domains:
  - robotics-embodiment/manipulation
pitfalls: >
  A pairwise number: it says how one policy fared against one opponent on whatever tasks and scenes that
  pair's evaluators chose, and nothing about any other pair, so two win rates against different opponents
  are not comparable and no ceiling or floor applies. Ties are excluded, and 14.4% of all A/B evaluations
  were ties on 2026-09-23, so the wins-ties-losses record belongs beside the rate; a pair with few evaluations
  gives a rate with no stated uncertainty. The site shows it as a percentage.
sources:
  - src-roboarena-site-bundle-2026-11-19
  - src-roboarena-arxiv-html
  - src-roboarena-api-transparency

# data/metrics/stoic2021-covid-auc.yaml -- P3-S6-T06 (04 S6). STOIC2021's feedback metric (src-arxiv-2306-10484-v2:
# "AUC for COVID-19 presence, computed over all cases, was used solely as additional feedback for participants"). It
# never ranked.
id: stoic2021-covid-auc
name: COVID-19 AUC
full_name: STOIC2021 AUROC for COVID-19 presence over all cases
definition: The area under the ROC curve of the system's likelihood that the patient has COVID-19,
  against the RT-PCR result, over all test cases.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
aggregation: One statistic over all cases of the test subset scored.
domains:
  - medicine-health/medical-imaging-diagnostic
pitfalls: Feedback only; it did not rank, so a high value says nothing about a team's place, and it
  is computed over a different population (all cases) from the ranking AUC.
sources:
  - src-arxiv-2306-10484-v2
  - src-gc-stoic2021-home

# data/metrics/scicode-main-problem-pass-at-1.yaml -- P3-S5-T04 (04 S6). SciCode's main-problem pass@1.
id: scicode-main-problem-pass-at-1
name: SciCode main-problem pass@1
full_name: SciCode pass@1 at the main-problem level
definition: The fraction of SciCode's 65 test main problems solved on the first attempt, where a
  main problem counts only if every one of its subproblems and the integrated solution pass the
  tests.
value_type: ratio
range:
  min: 0
  max: 1
optimum: max
pitfalls: 'Two protocol switches move it as much as the model does: scientific background supplied or
  not, and gold or generated solutions carried over between subproblems. The subproblem-level rate is
  a different metric, and so is the score aggregators such as Artificial Analysis publish.'
sources:
  - src-arxiv-2407-13168

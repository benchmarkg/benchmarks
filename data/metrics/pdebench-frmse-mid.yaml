# data/metrics/pdebench-frmse-mid.yaml -- P3-S6-T08 (04 S6; 12 S3.4). PDEBench's Fourier-space error in the middle
# wavenumbers. An error norm: optimum zero, so headroom is refused with lower-is-better-optimum-zero.
id: pdebench-frmse-mid
name: fRMSE mid
full_name: RMSE in Fourier space, medium-frequency band (PDEBench)
definition: >
  The error of the prediction's Fourier spectrum in the middle-wavenumber band, computed as for fRMSE
  low (pdebench-frmse-low) and averaged over the band's wavenumbers, then over output variables and time
  steps. The paper puts the middle band at wavenumbers 5 to 12.
value_type: ratio
range:
  min: 0
optimum: zero
aggregation: Per PDE dataset and parameter value; the mean over the band's wavenumbers, then over
  output variables and scored time steps.
units: the PDE variable's own units, scaled by the domain length
headroom_computable: false
domains:
  - physics/simulation-surrogates
pitfalls: >
  The band edges differ between the paper (5-12) and the evaluation script's defaults (iLow=4, iHigh=12,
  which slice wavenumbers 4-11), so a value says which convention made it (pdebench-frmse-low). Fixed
  wavenumber indices, so the band's physical scale changes with the grid.
sources:
  - src-arxiv-2210-07182-v7
  - src-github-pdebench-metrics-4bcbb4c

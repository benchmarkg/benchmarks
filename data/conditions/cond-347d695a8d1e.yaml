# data/conditions/cond-347d695a8d1e.yaml -- P3-S7-T07; conditions of The Well's claim for
# the-well-fno on shear_flow (04 S8). Content-derived over the fields written here (05 S2), with
# tools/build/comparability.py's canonicalise().
# The three material fields (the surrogate-fit profile's subset_used and training_data_policy, and the
# entry's material_extra hardware) are answered, from
# src-arxiv-2412-00568-v3-html:
#   hardware: "All runs were time-limited to 12 hours on a single Nvidia H100 GPU."
#   subset_used: one dataset's test split, "We report evaluation on the test set of each model with
#     hyperparameters performing best on the validation set." The horizon is written into it as well as into
#     lead_time, because lead_time is not material here and a rollout-window VRMSE (Table 3) of the same
#     dataset must not share this key (a review check on the-well).
#   lead_time: "predicting the next snapshot of a given simulation from a short history of 4 time-steps"
#   training_data_policy restricted-list: each baseline is trained on the dataset's own training split alone,
#     "Each file is randomly split into training/testing/validation sets with a respective split of
#     0.8/0.1/0.1 * n_traj", with a learning rate and epoch count chosen per dataset (Table 6). The paper sets
#     no rule for other entrants; the four TrainingDataPolicy terms have no definitions, and restricted-list
#     is read as "the task's own data", as the DCASE conditions read it. A reviewer confirms.
id: cond-347d695a8d1e
lead_time: 'one step: the next snapshot, from the 4 before it'
training_data_policy: restricted-list
subset_used: shear_flow, test split, one-step prediction
hardware: one NVIDIA H100 GPU per training run, time-limited to 12 hours

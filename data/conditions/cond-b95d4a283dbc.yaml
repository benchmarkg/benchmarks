# data/conditions/cond-b95d4a283dbc.yaml -- P3-S7-T07; conditions of PDEBench's nRMSE claim for
# pdebench-fno on the Burgers' equation at nu = 0.001 (04 S8). Content-derived over the fields written here
# (05 S2), with tools/build/comparability.py's canonicalise(). The two material fields of the surrogate-fit
# profile are answered, from
# src-arxiv-2210-07182-v7-html:
#   subset_used: one PDE dataset and parameter value, forward problem, "The data was split into training and
#     test data: 90% was for training and 10% for test data."
#   training_data_policy restricted-list: the baseline is trained on that dataset's own 90% alone. The paper
#     sets no rule for other entrants; the four TrainingDataPolicy terms have no definitions, and restricted-list
#     is read as "the task's own data", as the DCASE conditions read it. A reviewer confirms.
id: cond-b95d4a283dbc
training_data_policy: restricted-list
subset_used: Burgers' equation at nu = 0.001, forward problem, test split (10% of the samples)

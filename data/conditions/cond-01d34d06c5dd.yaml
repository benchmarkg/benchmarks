# data/conditions/cond-01d34d06c5dd.yaml -- P3-S8-T02; the conditions of RoseTTAFold's and Phyre2's lDDT claims, one
# CAMEO 3D window (04 S8).
#
# Content-derived over the fields written here, nulls included (05 S2), with tools/build/comparability.py's
# canonicalise() -- first 12 hex. cameo's resolved material set is {selection_strategy, subset_used} (the fallback
# profile plus its material_extra).
#
# The evaluation window is the first thing subset_used states, as "<first date> to <last date>", because a CAMEO score
# is an average over a date range and a server set (cameo's refresh_basis), and the claim's date_reported is the
# paper's date, months after the window closed.
# subset_used: "(A) CAMEO 3D data for IntFOLD7 - All Targets, Common Subset Comparison (172 targets) with IntFOLD7 as
# the reference server - dataset: 1-year [2022–02-04 - 2023–01-28]" (src-pmc-10320135-table-1).
# selection_strategy null: the table heads each score "Dif. Best", which does not say whether a server's first model
# or its best was scored; CAMEO's current site scores model 1 only (src-cameo-help), but no source read here says so
# of CAMEO 3D in 2022.
# human_assistance none: CAMEO scores automated servers ("In CAMEO, automated prediction servers are continuously
# benchmarked", "The assessment is fully automated.", src-cameo-faq).
id: cond-01d34d06c5dd
selection_strategy: null
human_assistance: none

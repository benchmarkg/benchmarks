# data/conditions/cond-d96c1eda6f1e.yaml -- P3-S7-T04 (04 S8); the conditions of the two OCx24 hydrogen evolution claims
# in data/claims/oc20/, the OCx24 paper's two linear models scored leaving one composition out. Content-derived over the
# fields written here (05 S2), with tools/build/comparability.py's canonicalise(). Both of oc20's material fields
# (profile surrogate-fit, and the entry's material_extra) are answered.
#
# assay_protocol: the ground truth is a laboratory measurement, and the paper's section 2.2 (detailed in its A.4) is the
# protocol that produced it: "Parallelized screening for CO2RR and HER was performed using a modified membrane electrode
# assembly (MEA) setup", and "The testing process began with the electrolyzer operating at 50 mA/cm2 for 9 minutes to
# evaluate HER activity" (src-arxiv-2411-11783-v1). It is not material for oc20 (the entry's comparability comment says
# why), so it separates no key; it is what marks the ground truth as wet-lab beside OC20's and OC22's DFT, whose claims
# leave it null.
#
# subset_used: the measured target and the cross-validation strategy, as the claim's subset oc20#ocx24-her-loco names
# them: "Models were trained to predict the cell voltage at 50 mA/cm2 production rate", and "Leave One Composition Out
# (LOCO): Hold out all samples with a given composition". The paper models averaged targets ("We averaged over these
# samples to obtain 179 experimental targets for modeling efforts"); how many of the 179 carry a voltage is not stated
# in the extract, so no count is written.
#
# training_data_policy restricted-list: each fold's model is fitted on OCx24's own measurements of the other
# compositions ("models trained on experimental data using computational descriptors as input"), with computed
# descriptors as its features; restricted-list is read as "the task's own data", as the DCASE and The Well conditions
# read it. A reviewer confirms.
id: cond-d96c1eda6f1e
assay_protocol: src-arxiv-2411-11783-v1
training_data_policy: restricted-list
subset_used: OCx24 hydrogen evolution, the cell voltage measured at 50 mA/cm2, each composition
  predicted with all its samples held out of training (leave one composition out)

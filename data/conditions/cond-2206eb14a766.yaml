# data/conditions/cond-2206eb14a766.yaml -- P3-S8-T05 (04 S8); the conditions of one RoboArena pair's A/B
# evaluations, for claim-8436706da501 (pi0-fast-droid against pi0-droid).
#
# Content-derived over roboarena's resolved material fields {hardware_platform, n_samples, simulator,
# simulator_version, subset_used, venue}, nulls included (05 S2), with tools/build/comparability.py's canonicalise()
# -- first 12 hex. All six are answered.
#
# The evaluator pool and the venue: the pair's record in src-roboarena-api-transparency-2026-11-24 counts 146 A/B
# evaluations run by 24 evaluator accounts at 11 evaluator organisations ("evaluator_count":24, "lab_count":11), and
# each organisation evaluates on its own robot ("Evaluations are double-blind and distributed across institutions.",
# src-roboarena-site-bundle). So the venue is those organisations' robots and n_samples the pair's count.
# subset_used names the pair, because the rate is computed on that pair's evaluations alone: two pairs never share a
# comparability key, so no surface can rank one pair's rate against another's.
# hardware_platform DROID: "which consists of a Franka Panda 7DoF robot arm, a Robotiq 2F-85 parallel-jaw gripper, a
# ZED-mini stereo wrist camera and one or multiple external ZED 2 stereo cameras" (src-roboarena-arxiv-html).
# simulator and simulator_version none: every A/B evaluation is on a real robot, and the simulated DROID environment
# is for checks before submission ("Test your policies in our simulation environment before submitting for
# real-world evaluation.", src-roboarena-site-bundle-2026-11-19); `none` is the answer P3-S6-T05 proposed for a
# real-robot claim.
# harness is the episode protocol (src-roboarena-arxiv-html-2026-11-24): the central server "randomly samples two
# policies"; "the evaluators do not know which policies they are evaluating"; the evaluator "arranges the evaluation
# scene" and defines the task; both run "back-to-back until the task is completed or a fixed timeout is reached",
# the evaluator required "to closely match the initial conditions within this A/B policy comparison"; then "a
# continuous progress score", "a binary, pairwise preference label that indicates which policy the evaluator
# preferred" and "a free-form, natural language explanation for why they preferred one policy over the other". The
# live arena counts ties as well ("Wins divided by non-tie outcomes.", src-roboarena-site-bundle-2026-11-19).
# human_in_loop: the preference is the evaluator's.
id: cond-2206eb14a766
harness: 'RoboArena double-blind A/B evaluation: two policies sampled by the central server and hidden
  from the evaluator run back-to-back on one scene and language instruction the evaluator sets, from matched
  initial conditions, until the task is completed or a fixed timeout; the evaluator then records which
  policy they preferred or a tie, a 0-100 progress score for each, and a free-form explanation'
harness_source: src-roboarena-arxiv-html-2026-11-24
n_samples: 146
human_in_loop: true
simulator: none
simulator_version: none
hardware_platform: DROID
venue: the DROID robots of 11 evaluator organisations in the RoboArena evaluator network (24
  evaluator accounts)
subset_used: the 146 counted public A/B evaluations between pi0_fast_droid and pi0_droid

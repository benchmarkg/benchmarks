# data/conditions/cond-f63f40db297a.yaml -- P0-S8-T04; the Virtual Cell Challenge 2026's reference
# conditions, the prize-ranking round (04 S8).
#
# The id is content-derived (05 S2): sha256 over the canonical JSON (sorted keys, no spaces) of the
# material fields virtual-cell-challenge resolves to -- profile `forecasting`, less the two fields its
# entry waives (lead_time, resolution_window): {subset_used, training_data_policy} -- first 12 hex. No
# `bench claim` exists yet to allocate it (05 S3), so it was computed by hand with
# tools/build/comparability.py's resolve_profile() and canonicalise().
#
# EvalConditions is a closed record with no annotation keys, so the evidence for each value is here.
#
# subset_used. Only the final test ranks for prizes, and it is not comparable with the validation
# round:
#   src-vcc-2026-data-page: "Final rankings will be based solely on performance on the final test set."
#   src-vcc-2026-evaluation: "Validation and the final test are scored independently and are "
#                            [the page then sets "not comparable" in bold]
#
# training_data_policy. `zero-shot-only` in one sense only: nothing measured in a target cell line
# under perturbation is released, so every entry predicts those lines zero-shot. It is NOT a limit on
# what an entrant may train on, which is anything they have the right to use:
#   src-vcc-2026-evaluation:   "There is no Challenge training set this year."
#   src-vcc-2026-announcement: "Participants may use any modeling strategy and train their models on
#                               any data."
#   src-vcc-2026-faq:          "you may use any data to improve the performance of your predictions"
# The four TrainingDataPolicy terms have no definitions (schema finding 1 in the benchmark's
# curation.notes); if `zero-shot-only` comes to mean a training ban, this value becomes `open`.
id: cond-f63f40db297a
training_data_policy: zero-shot-only
subset_used: final-test

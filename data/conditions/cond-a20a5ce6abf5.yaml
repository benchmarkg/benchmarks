# data/conditions/cond-a20a5ce6abf5.yaml -- P0-S8-T07; PaperBench's reference conditions, the
# paper's main setup (04 S8).
#
# The id is content-derived (05 S2): sha256 over the canonical JSON (sorted keys, no spaces) of the
# material fields paperbench resolves to -- profile `model-graded`, plus the entry's material_extra
# (scaffold, hardware_platform), less its waivers (shots, chain_of_thought): {grading_rubric_ref,
# hardware_platform, judge_model, judge_model_version, judge_prompt_hash, reasoning_effort, scaffold,
# subset_used}, nulls included -- first 12 hex. No `bench claim` exists yet to allocate it (05 S3),
# so it was computed by hand with tools/build/comparability.py's resolve_profile() and canonicalise().
#
# EvalConditions is a closed record with no annotation keys, so the evidence for each value is here.
# All from src-paperbench-arxiv-html.
#
# judge_model, judge_model_version. The paper's default judge, SimpleJudge on o3-mini at high
# reasoning effort -- the judge's effort, and so part of the judge's version, not the agent's
# reasoning_effort:
#   "o3-mini-2025-01-31 with reasoning_effort set to “high” as the backend model for the judge"
#   "o3-mini with the SimpleJudge scaffolding is the most cost-effective, with an F1 score of 0.83"
# Removing judge_model makes the entry fail tier 3's reference-grader rule (the benchmark-level form
# of the judge-model rule); tests/schema/test_semantic_rules.py pins it.
#
# judge_prompt_hash is null: the prompt is in the open-source code, which is not read here.
#
# scaffold. The main experiment's agent, BasicAgent, built on Inspect AI's basic agent:
#   "We use a simple agent scaffolding based on Inspect AI’s basic agent"
# IterativeAgent is a different condition, and moves o1 from 13.2% to 24.4%.
#
# hardware_platform. Agent and reproduction both run on one A10:
#   "we copy its submission to a fresh VM running an Ubuntu 24.04 image with access to an A10 GPU."
#
# reasoning_effort is null: it is the evaluated model's setting and differs per claim (o1 and
# o3-mini at high in the paper). subset_used is the full benchmark, not Code-Dev.
id: cond-a20a5ce6abf5
scaffold: basic-agent
judge_model: o3-mini
judge_model_version: o3-mini-2025-01-31, reasoning_effort high
grading_rubric_ref: paperbench@2025-04 rubrics (20 papers, 8,316 leaves)
hardware_platform: 1x NVIDIA A10 GPU, Ubuntu 24.04
subset_used: all-20-papers

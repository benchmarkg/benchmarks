# data/conditions/cond-1b915562efa8.yaml -- P3-S8-T01; the conditions of ColabFold's GDT_HA claim on the CASP16
# monomer evaluation units (04 S8).
#
# Content-derived over casp's resolved material fields {assay_protocol, eligibility_track, human_assistance,
# selection_strategy, subset_used} (the wet-lab profile plus casp's material_extra), nulls included (05 S2),
# with tools/build/comparability.py's canonicalise() -- first 12 hex.
#
# assay_protocol and eligibility_track are null, which counts as unknown: the wet-lab profile's assay_protocol
# has no meaning for a structure prediction (casp's review_checks), and casp's review_checks name
# eligibility_track as the nearest field for the pool a Prediction Center z-score is computed in, which none
# of these numbers depends on.
#
# human_assistance none: a server ("ColabFold, a server running AlphaFold2", src-casp16-overview).
# selection_strategy best-of-n: "We computed the average GDT_HA scores of the best models from the top 50
# groups in CASP15 and CASP16 (Figure 7A)." (src-casp16-monomer-2026-11-24). k is left out: the paper
# does not say how many models ColabFold submitted per unit.
# subset_used: "ColabFold submitted predictions to all 112 CASP15 monomer EUs, and 59 out of 74 CASP16
# monomer EUs in Phase 1" and "Accordingly, we restricted our comparative analysis to EUs with ColabFold
# predictions." (src-casp16-monomer-2026-11-24).
id: cond-1b915562efa8
selection_strategy: best-of-n
human_assistance: none
assay_protocol: null
eligibility_track: null
subset_used: Phase 1 monomer evaluation units with ColabFold models (59 of 74)

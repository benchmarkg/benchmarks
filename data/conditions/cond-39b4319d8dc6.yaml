# data/conditions/cond-39b4319d8dc6.yaml -- P3-S7-T03 (04 S8); the conditions of the three OC20 IS2RE claims in
# data/claims/oc20/, one row each from three teams on the test set's OOD Both subsplit, as EvalAI scored them.
# Content-derived over the fields written here (05 S2), with tools/build/comparability.py's canonicalise(). Both of
# oc20's material fields (profile surrogate-fit, and the entry's material_extra) are answered.
#
# subset_used: the IS2RE -- Test leaderboard (phase split 1950, phase 1535 in src-evalai-oc20-challenge-712-splits)
# reports each test subsplit in its own column; the claims read the column "Energy MAE (eV) -- OOD Both"
# (src-evalai-oc20-leaderboard-1950). The subsplit is the entry's oc20#oc20-test-ood-both.
#
# training_data_policy open: the board withholds the test labels, and no source read restricts training data. Its
# submission form asks "Was only OC20 data used for training?" and tells a submitter to answer No "if you used any
# external data for training" (src-evalai-oc20-leaderboard-1950), so external data is admitted and declared, not
# barred. What each model trained on is stated only by its method name, in its claim's notes; the four policy terms
# cannot hold it, so the three claims share this record whatever their models trained on (review check).
id: cond-39b4319d8dc6
training_data_policy: open
subset_used: OC20 IS2RE test set, OOD Both subsplit (adsorbates and catalysts unseen in training),
  as the evaluation server of EvalAI challenge 712 scored it (IS2RE -- Test, phase split 1950)

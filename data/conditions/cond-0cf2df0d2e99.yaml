# data/conditions/cond-0cf2df0d2e99.yaml -- P3-S7-T01; the conditions of the five Matbench Discovery batch-1 claims (04 S8),
# all compliant models' F1 on the unique-prototype discovery set. Content-derived over the fields written here
# (05 S2), with tools/build/comparability.py's canonicalise(). All five material fields of the entry's resolved
# profile (surrogate-fit + eligibility-gated) are answered:
#   eligibility_track compliant: the compliance tier, as the ledger step asks and 04 S8's comment on the field has
#     it ("Matbench Discovery compliance tier"). It is also the board view the rows are listed in: the archived
#     2026-06-10 capture offers "Compliant models Non-compliant models" views (src-matbench-discovery-homepage).
#     The entry's tier note reads eligibility_track as the board view instead (all models or the Compliant models
#     preset); for these rows the two readings give the same value. A reviewer confirms the convention.
#   training_data_eligibility compliant: the tier id in the entry's training_data_eligibility_tiers (tier 3,
#     training-tier-declared). Each claim's Training Set cell is MPtrj or MPF, Materials Project data inside the
#     paper's rule: "database release as the maximum allowed training set for any compliant model submission"
#     (src-matbench-discovery-nature). Not compliant-preset: these rows are read off the v1 table and a capture
#     that predate that 2026 preset.
#   training_data_policy restricted-list: training is limited to one named release and its subsets.
#   decontamination_applied true: the unique-prototype set is the test set cleaned against the training
#     release, "To control for the potential adverse effects of leakage between the MP training set and the WBM
#     test set, we cleaned the WBM test set based on protostructure matching." (src-matbench-discovery-nature).
#     That cleaning bounds leakage only for models trained inside the release, which is why it is answered here
#     and not for a non-compliant model.
#   subset_used: "leaving 215,488 structures in the unique prototype test set" (src-matbench-discovery-nature).
id: cond-0cf2df0d2e99
eligibility_track: compliant
training_data_policy: restricted-list
training_data_eligibility: compliant
decontamination_applied: true
subset_used: WBM unique-prototype test set, 215,488 structures

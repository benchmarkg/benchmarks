# data/conditions/cond-6e8ba4ad92b4.yaml -- P0-S8-T03; the ARC-AGI-3 Verified leaderboard's rules
# (04 S8; ADR-0007). Referenced by data/leaderboards/lb-arc-agi-3-verified.yaml.
#
# The id is content-derived (05 S2): sha256 over the canonical JSON (sorted keys, no spaces) of the
# material fields arc-agi-3 resolves to -- the `simulation` profile plus material_extra, less the
# waived hardware_platform: {eligibility_track, harness, n_samples, reasoning_effort,
# selection_strategy, simulator, simulator_version, subset_used}, nulls included -- first 12 hex.
#
# A board's conditions are a floor: what every listed result shares. Fields the board leaves open
# are null here and answered on each claim. EvalConditions has no annotation keys, so the evidence is
# in these comments, quoted from src-arc-prize-testing-policy (2026-09-04 capture) unless noted.
#
# eligibility_track: verified -- "Up-to-date Verified Leaderboard of state-of-the-art model
#   performance on the ARC-AGI."; entry is by ARC Prize's selection: "We test public models from
#   trusted sources." and "Commercial APIs must have >$10M USD gross revenue/mo".
# subset_used: semi-private -- "Semi-Private Evaluation Set - Used for frontier model testing on the
#   Verified Leaderboard."
# n_samples: 1, selection_strategy: single -- "A single run is used, we do not average scores across
#   runs."
# tools_allowed: [] -- "We do not enable additional tools behind the model, including code
#   execution." Opt-in and declared when used ("any tool use will always be declared"), so a claim
#   that used tools says so in its own conditions.
# harness: null -- the board reports two: "Standard harness - Uses a minimal, provider-neutral
#   interface." and "Provider Adapter harness - Uses provider-designed context-management features".
#   "We report their results separately and clearly label the harness used for each result." Each
#   claim carries its harness; the report (arXiv 2603.24621v2, 2026-04) had said "the official
#   leaderboard will not use a harness to report official scores".
# reasoning_effort: null -- "we will often repeat model tests at varied reasoning levels".
# Not expressible as a field: the cost cap, "We cap our evaluations at $10,000 USD per run.", and
#   the report's action budget of five times the human median per level.
id: cond-6e8ba4ad92b4
tools_allowed: []
n_samples: 1
selection_strategy: single
eligibility_track: verified
subset_used: semi-private

# data/conditions/cond-ea31d199f347.yaml -- P3-S7-T04 (04 S8); the conditions of the OCx24 CO2 reduction claim in
# data/claims/oc20/ for the H2 production rate, the OCx24 paper's random forest scored leaving one sample out.
# Content-derived over the fields written here (05 S2), with tools/build/comparability.py's canonicalise(). Both of
# oc20's material fields are answered.
#
# assay_protocol: the paper, for its CO2 reduction protocol (section 2.2, detailed in A.4): "the CO2RR was carried out
# at current densities of 50, 100, 150, 200, and 300 mA/cm2 for 9 minutes each", in the membrane electrode assembly the
# HER record quotes (src-arxiv-2411-11783-v1). Not material for oc20, as there.
#
# subset_used: the product, which no subset and no other condition field holds (the oc20 entry's review check), the
# target's normalisation ("we interpolate each product to a fixed applied potential of 3.3 V full cell voltage") and the
# strategy of the claim's subset oc20#ocx24-co2rr-loo ("Leave One Out (LOO): Hold out a given sample, train on the
# remaining data, and evaluate on the held out sample").
#
# training_data_policy restricted-list, as the HER record reads it. A reviewer confirms.
id: cond-ea31d199f347
assay_protocol: src-arxiv-2411-11783-v1
training_data_policy: restricted-list
subset_used: OCx24 CO2 reduction, the H2 production rate interpolated to 3.3 V full-cell voltage,
  each sample predicted with it held out of training (leave one sample out)

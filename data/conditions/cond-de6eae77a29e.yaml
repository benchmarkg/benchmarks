# data/conditions/cond-de6eae77a29e.yaml -- P3-S8-T06 (04 S8); the conditions of the SimplerEnv claim on the Google
# Robot pick-coke-can task under Visual Matching (RT-1 (Converged)).
#
# Content-derived over simplerenv's resolved material fields {hardware_platform, n_samples, selection_strategy,
# simulator, simulator_version, subset_used, training_data_policy}, nulls included (05 S2), with
# tools/build/comparability.py's canonicalise() -- first 12 hex.
#
# harness, n_samples and selection_strategy, the episode protocol (src-arxiv-2405-05941-v1-html): "We place the coke
# can in 3 different orientations: horizontally laying, vertically laying, and standing."; "yielding 25 trials per
# orientation and 75 trials in total"; for Visual Matching "the number of trials is multiplied by the number of
# tuned robot arm colors for the Google Robot evaluation setup", and "for Google Robot simulated evaluations, we
# average results over four versions of robot arm and gripper colors". n_samples is 75 x 4, the paper's own rule;
# selection single, RT-1 being deterministic (seeds are averaged only for Octo).
#
# simulator and simulator_version: "We instantiate SIMPLER on top of the SAPIEN physics simulator"
# (src-arxiv-2405-05941-v1-html). At db69506, SimplerEnv's commit of the paper's day ("date":"2024-05-09T15:19:27Z",
# src-github-api-simplerenv-commits-2024-05), the ManiSkill2_real2sim submodule is at cd45dd2
# (src-github-api-simplerenv-submodule-db69506), whose requirements pin "sapien==2.2.2"
# (src-github-maniskill2-real2sim-requirements-cd45dd2). The pin is the build; that the paper's runs used that very
# checkout is not stated, and is left to a reviewer.
#
# hardware_platform: "For the Google Robot, we adopt the following language-conditioned tasks" (same Source), the
# simulated Google Robot. training_data_policy open: SIMPLER sets no rule on training data; it scores policies
# trained on real robot data, "We use popular open-source generalist robot policies: RT-1-X [11] and Octo [50]
# (Octo-Base and Octo-Small)." (src-arxiv-2405-05941-v1-html).
id: cond-de6eae77a29e
harness: 'SIMPLER Visual Matching on the Google Robot "pick coke can" task: the can in 3 orientations
  (horizontally laying, vertically laying, standing) at 25 grid positions each, 75 trials, repeated for
  four tuned robot arm and gripper colours; success averaged over the orientations'
harness_source: src-arxiv-2405-05941-v1-html
n_samples: 300
selection_strategy: single
simulator: SAPIEN (through ManiSkill2_real2sim)
simulator_version: SAPIEN 2.2.2 (ManiSkill2_real2sim cd45dd2)
hardware_platform: Google Robot (simulated)
training_data_policy: open
subset_used: Google Robot pick coke can, Visual Matching

# data/conditions/cond-9c281a853c39.yaml -- P3-S7-T05; the conditions of the WeatherBench 2 claims at lead time
# 120 h over the global region (04 S8), shared by the GraphCast, Pangu-Weather and NeuralGCM ENS claims
# (data/claims/weatherbench-2/). Content-derived over the resolved material fields {decontamination_applied,
# eligibility_track, lead_time, resolution_window, subset_used, training_data_eligibility, training_data_policy},
# nulls included (05 S2), with tools/build/comparability.py's canonicalise().
#
# lead_time: one lead time, never a range, in the results files' own spelling ("lead_time 120 h"). The reference
# conditions (cond-eb116e6670bf) state the grid a lead time sits on; a claim states its point on it.
# subset_used: the region coordinate of the results files, which hold 34 regions; the headline scores are global
# (the entry's secondary_axes_note). The variable and pressure level are the claim's subset.
# resolution_window: nothing was pending when the files were scored, because the evaluation year is a hindcast
# ("In its initial version WB2 uses the year 2020.", src-weatherbench-2-arxiv-html) against a reanalysis ("ERA5 is a
# reanalysis dataset that was created in retrospect", src-weatherbench-2-faq). The reference conditions leave it
# null for the same reason; here it is answered, as ForecastBench's resolved claims answer it.
# training_data_policy: open, as in the reference conditions: the benchmark fixes the targets and nothing about
# training ("it leaves the remaining modeling setup open", src-weatherbench-2-arxiv-html). Each model's own training
# years are in its claim's notes.
#
# Left null, so they count as unknown: eligibility_track, training_data_eligibility and decontamination_applied. The
# eligibility-gated profile makes them material (domain-metric x scientific-surrogate-model), but WeatherBench 2
# declares no tracks and no training_data_eligibility_tiers, and no source read says whether any entrant
# decontaminated its training data beyond holding the evaluation year out.
#
# Not expressible, and material by the maintainers' own account (the entry's review checks; schema findings 1 and 2):
# the evaluation resolution (240x121, 1.5 degrees, for every claim here) and the ground truth (ERA5 for every claim
# here), both named by each claim's results file. Nor the initial conditions (ERA5 here; the site's "(oper.)" rows
# start from the operational analysis), which the participating-models table lists per model.
id: cond-9c281a853c39
lead_time: 120 h
resolution_window: 'resolved before scoring: a hindcast of the 2020 evaluation year against ERA5, a reanalysis
  made in retrospect'
training_data_policy: open
subset_used: region global

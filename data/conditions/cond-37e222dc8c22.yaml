# data/conditions/cond-37e222dc8c22.yaml -- P3-S8-T06 (04 S8); the conditions of the two LIBERO-Spatial claims from
# Table 12 of the OpenVLA paper (OpenVLA and Octo, each fine-tuned on the suite), which the paper ran under one
# protocol.
#
# Content-derived over libero's resolved material fields {hardware_platform, n_samples, selection_strategy,
# simulator, simulator_version, subset_used, training_data_policy}, nulls included (05 S2), with
# tools/build/comparability.py's canonicalise() -- first 12 hex.
#
# harness, n_samples, selection_strategy and k, the episode protocol (src-arxiv-2406-09246-v3-html): "all methods
# are evaluated across 500 trials for each task suite, and the reported performance is the average success rate over
# three random seeds (resulting in 1500 total trials per statistic)"; "we do not change the test environments but
# rather use the same initial environment configurations provided by the original LIBERO benchmark"; "Each policy is
# trained independently on each of the task suites above (rather than training a single policy on all four suites
# combined)."; "we only utilize the static third-person camera images; we do not use the wrist camera images"; "We
# rotate all third-person images at both train and test time by 180 degrees because we observe that the LIBERO
# environments return images that are upside down on our hardware." The README agrees: "Each success rate is the
# average over 3 random seeds x 500 rollouts each (10 tasks x 50 rollouts per task)."
# (src-github-openvla-readme-a793354). avg-at-k with k 3: every trial is run under each of three seeds and the rate
# averaged.
#
# simulator: LIBERO's environments are robosuite's, rendered by MuJoCo: "import robosuite as suite" and
# "renderer="mujoco"," (src-github-libero-env-wrapper-8f1084e); OpenVLA's harness installs robosuite
# (src-github-openvla-libero-requirements-a793354). simulator_version is null, with the reason in each claim's
# notes.
#
# hardware_platform: LIBERO's ControlEnv defaults to "robots=["Panda"]," (src-github-libero-env-wrapper-8f1084e),
# and OpenVLA's harness builds the environment from the task file and camera size alone, "env_args =
# {"bddl_file_name": task_bddl_file, "camera_heights": resolution, "camera_widths": resolution}"
# (src-github-openvla-libero-utils-a793354), so the robot is that default. The paper says the test environments are
# unchanged for every method.
#
# training_data_policy open: LIBERO sets no rule on pretraining data, and both policies were pretrained on
# real-robot data before fine-tuning ("OpenVLA was pretrained with purely real-world robot data and no simulation
# data"). subset_used names the suite and the multitask protocol, since the entry declares no subsets and its
# lifelong protocol scores differently.
id: cond-37e222dc8c22
harness: "the OpenVLA paper's LIBERO protocol (Appendix E): one policy trained per task suite on that
  suite's demonstrations, seeing only the static third-person camera with images rotated 180 degrees at
  train and test time; 500 trials per suite (10 tasks x 50) from the benchmark's own initial configurations,
  repeated over three random seeds, and the success rate with its standard error over the seeds"
harness_source: src-arxiv-2406-09246-v3-html
n_samples: 1500
selection_strategy: avg-at-k
k: 3
simulator: robosuite (MuJoCo)
simulator_version: null
hardware_platform: Panda (robosuite arm model, LIBERO's default robot)
training_data_policy: open
subset_used: LIBERO-Spatial (10 tasks), multitask training on that suite's demonstrations alone,
  scored on the benchmark's fixed initial states

# data/conditions/cond-eb116e6670bf.yaml -- P0-S8-T01; WeatherBench 2's reference conditions (04 S8).
#
# The id is content-derived (05 S2): sha256 over the canonical JSON (sorted keys, no spaces) of the
# material fields weatherbench-2's facets resolve to -- profiles `forecasting` and
# `eligibility-gated`: {decontamination_applied, eligibility_track, lead_time, resolution_window,
# subset_used, training_data_policy}, nulls included -- first 12 hex. No `bench claim` exists yet to
# allocate it (05 S3), so it was computed by hand with tools/build/comparability.py's canonicalise().
#
# EvalConditions is a closed record with no annotation keys, so the evidence for each value is here.
#
# lead_time. WeatherBench 2 reports every score as a function of lead time, so the reference
# conditions cannot name one: they state the grid a claim's single lead time sits on. Every claim
# carries its own lead_time, and two claims at different lead times get different comparability
# keys. The two sources disagree on the range and both are kept in the value:
#   src-weatherbench-2-arxiv-html: "global, medium-range (1–14 day) weather forecasting benchmark"
#   src-weatherbench-2-homepage:   "with a focus on medium-range (1-15 day) prediction"
#   src-weatherbench-2-arxiv-html: "The evaluation time step can be freely chosen. We use 6 hours as
#                                   our highest resolution."
# A range is not a lead time: whether reference conditions for a grid-valued benchmark should be
# one record per cell instead is a schema question, recorded in the benchmark's curation.notes.
#
# training_data_policy. The benchmark fixes the targets and nothing about training:
#   src-weatherbench-2-arxiv-html: "WB2 is a benchmark for entire forecast systems, i.e., the
#                                   combination of choice of input data, training setup and model
#                                   architecture"
#
# resolution_window is null: nothing resolves later, because the evaluation years are hindcasts.
# subset_used is null: the evaluation year is the benchmark version (2020 or 2022), not a subset.
#
# Not expressible here, and material by the maintainers' own account (see curation.notes):
#   - evaluation resolution: "Note that absolute values of metrics computed at different resolution
#     are not necessarily comparable (see paper)." (src-weatherbench-2-submit)
#   - ground truth: "Operational models are evaluated against IFS analysis. All other models
#     evaluated against ERA5." (src-weatherbench-2-homepage)
id: cond-eb116e6670bf
lead_time: 'one stated lead time per score, on a 6-hourly grid over the medium range (the paper: 1-14
  days; the site: 1-15 days)'
training_data_policy: open

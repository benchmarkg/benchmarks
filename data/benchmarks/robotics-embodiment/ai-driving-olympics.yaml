# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T03)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1903-02503
    - src-arxiv-1903-02503-v1
    - src-arxiv-2009-04362
    - src-arxiv-2009-04362-v1
    - src-duckietown-aido-page
    - src-duckietown-aido-6-announcement
    - src-duckietown-aido-5-announcement
    - src-github-challenge-aido-lf-scoring
    - src-github-challenge-aido-lf-lf-norm-test
    - src-github-challenge-aido-lf-comp-simulator
    - src-github-api-challenge-aido-lf-lf-norm-test-scenarios
    - src-github-gym-duckietown-readme
    - src-arxiv-2007-03514
    - src-arxiv-2609-00718-v1
  sources_note: >
    The AI-DO 1 report and the DUCKIENet paper, each as its v1 PDF and abstract page (DOIs, not archived);
    the organiser's AI-DO page and its 5th- and 6th-edition announcements on duckietown.com, with scripts
    and styles stripped, withheld from archiving because they name individuals; three challenge-definition
    files of the 2021 edition and GitHub's API listing of its LF test scenarios, pinned at commit a317d9ff;
    the gym-duckietown README pinned at c76a7fec; a Lane Following winner's abstract page for a learned
    entrant; and the v1 PDF of arXiv 2609.00718 as evidence of current use. The challenges server could
    not be read.
  confidence: medium
  review_checks:
    - check: Primary domain. autonomous-driving-planning was chosen over sim2real-transfer because
        every board scores a drive in one setting and the AI-DO 1 report says the sim-to-real gap
        had no metric; the organisers' own framing (one agent scored in simulation and on hardware)
        makes sim2real-transfer the main alternative, kept as secondary.
      field: domain
      source: src-arxiv-1903-02503-v1
      quote: The AI-DO is an ideal setup to test sim-to-real transfer wince both simulation and real
        environment are readily available for testing
    - check: lifecycle mature rests on a September 2026 paper that uses Gym-Duckietown and
        AI-DO-like tasks with its own curricula, not AI-DO's challenges, scenarios or metrics. If
        only the challenges count as the instrument, nothing has used it since 2021; dormant would
        then be weighed against the ADR-0019 reading of an ended series, and no ending was ever
        announced.
      field: lifecycle
      source: src-arxiv-2609-00718-v1
      quote: train a belief-state policy with proximal policy optimization (PPO) in Gym-Duckietown
    - check: activity closed rests on the 2021 challenges' close date and on the challenges server
        answering HTTP 530 on 2026-11-05 (not quotable). The organiser's page still calls AI-DO 2021
        the ongoing edition; whether any leaderboard reopened elsewhere could not be checked without
        the server.
      field: activity
      source: src-duckietown-aido-page
      quote: Check the rules of the ongoing edition (AI-DO 2021 Urban League Finalists).
    - check: The sources disagree on AI-DO 1's participation. The report gives around 2,000
        submissions from around 110 users; the organiser's page gives over 1,600 from 58 unique
        participants.
      field: data.size
      source: src-duckietown-aido-page
      quote: There were over 1600 submissions from 58 unique participants.
    - check: Versions. The editions are numbered as the organisers number them (AI-DO 4 was
        cancelled, so there is no aido-4 row). AI-DO 2, 3 and 5 rest on the organiser's summary page
        and the AI-DO 5 announcement; their own rules and results pages (on docs.duckietown.org and
        the challenges server) were not read, and no edition has a release date in the sources read.
        The 2021 challenge files open on 2021-01-31, while the AI-DO 6 announcement puts the
        practice phase in November 2021.
      field: versions
      source: src-github-challenge-aido-lf-lf-norm-test
      quote: 'date-open: 2021-01-31T00:00Z date-close: 2021-12-31T00:00Z'
    - check: Scope. The entry covers the Urban Driving League. The Advanced Perception League's
        nuScenes challenges are recorded on nuscenes.yaml, and the Racing League (AWS DeepRacer) is
        a separate competition; whether either needs a lineage link here is for a reviewer.
      field: aliases
      source: src-duckietown-aido-page
      quote: The Racing League uses AWS Deepracer and is organized by AWS.
    - check: simulator_version is material but cannot be filled for any edition from the sources
        read. The 2021 simulator image is built on gym-duckietown's floating daffy tag; PyPI's
        duckietown-gym-daffy shows 6.1.x releases through 2021 (read 2026-11-05, not a quoted
        Source), and the daffy branch now declares 6.2.0.
      field: comparability
      source: src-github-challenge-aido-lf-comp-simulator
      quote: 'image: ${AIDO_REGISTRY}/duckietown/challenge-aido_lf-simulator-gym:daffy-amd64'
    - check: maintainer_type is null. The Duckietown Foundation's legal form is not stated, the
        pages are now Duckietown, Inc.'s, and the organisers were from ETH Zurich, Mila and TTIC;
        nonprofit, academic-lab and conference-workshop are all arguable (taxonomy failure
        2026-11-05-ai-driving-olympics-001, logged by this draft).
      field: governance.maintainer_type
      source: src-duckietown-aido-5-announcement
      quote: The Duckietown Foundation is grateful to its sponsors
    - check: reproducibility_tier requires-specialized-hardware treats an Autolab as buildable by
        others from its documentation; if the headline results count as held only by the organisers
        (their Autolabs and the closed server), not-independently-reproducible is the alternative.
      field: execution.reproducibility_tier
    - check: ground_truth_source experimental and execution_mode physical-trial describe the
        hardware stage that decided the winners; the simulation leaderboards are simulation and
        automated. Neither field takes two values.
      field: ground_truth_source
    - check: AI-DO 1's AMOD challenge scored a fleet dispatcher in a separate city-scale simulator,
        with low-level driving assumed, which is not embodied driving; no domain leaf fits it (fleet
        dispatch is operations planning). It is kept as a subset because it was one challenge of one
        edition, with few entrants; a reviewer may prefer to drop it or give it a domain_override.
      field: subsets
      source: src-arxiv-1903-02503-v1
      quote: Participants were required to implement a centralized dispatcher that provided goals to
        individual robots
    - check: prize-sponsored-by-industry rests on AI-DO 1's AWS credits and nuTonomy ride, from
        companies whose staff co-authored the report; whether later editions had industry prizes was
        not found.
      field: governance.independence_flags
    - check: data.access private-test-server describes the hardware stage; the simulation test
        scenarios of 2021 are public in the repository, which is why contamination_risk is medium.
      field: data.access
      source: src-github-api-challenge-aido-lf-lf-norm-test-scenarios
      quote: '"name":"LF-norm-loop-000"'
  personal_data_excluded:
    - source: src-arxiv-1903-02503-v1
      what: the author block, and the finalists' names and team members in Section 4, Figure 10 and
        Table 4
    - source: src-arxiv-1903-02503
      what: the author list and the submitter line
    - source: src-arxiv-2009-04362-v1
      what: the author block, the corresponding author's contact line and the acknowledgements
    - source: src-arxiv-2009-04362
      what: the author list and the submitter line
    - source: src-arxiv-2007-03514
      what: the author list and the submitter line
    - source: src-duckietown-aido-page
      what: named endorsements by individual academics and industry staff, and the footer's
        obfuscated contact address
    - source: src-duckietown-aido-6-announcement
      what: the author's byline and a related post naming a lecturer
    - source: src-duckietown-aido-5-announcement
      what: the author's byline and a related post naming a lecturer
    - source: src-github-gym-duckietown-readme
      what: the citation block's author list

# data/benchmarks/robotics-embodiment/f1tenth.yaml
#
# P1-S5-T03, robotics-embodiment entry 23. Filled from the organisers' GitHub repositories (f1tenth.org redirects to
# roboracer.ai, a script-rendered app, so its pages were read from f1tenth/roboracer-site, which builds it): the
# General Rules (public/rules.md, version 3.2026-draft), the past-races and upcoming-events lists the race page
# loads, and the About page's source; the 24th competition's ruleset (f1tenth/roboracer_rules README, ICRA 2025); the
# 31st competition's rules (f1tenth/iros2026_race, IROS 2026) and its results page; the f1tenth_gym README; the
# platform paper (arXiv 1901.08567, v1 PDF); the evaluation-environment paper (PMLR 123, NeurIPS 2019 competition
# track, PDF); the 2025 RoboRacer survey (arXiv 2506.15899, v1 PDF); and the abstract pages of the ForzaETH Race Stack
# (arXiv 2403.11784) and AROLA (arXiv 2602.02730, IV 2026). Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts. Results tables and team rosters were not read, and no
# individual is named here.

id: f1tenth
name: F1TENTH Autonomous Racing
aliases:
  - RoboRacer
  - RoboRacer Autonomous Racing Competition
  - International RoboRacer Autonomous Racing Competition
  - F1/10 International Autonomous Racing Competition
  - F1/10
aliases_note: The platform and its race series were called F1/10 in the 2019 platform paper and
  F1TENTH afterwards, and were rebranded RoboRacer by 2025 (the survey's "recently rebranded as
  RoboRacer"; the site's "RoboRacer, formerly F1TENTH"). f1tenth.org now redirects to roboracer.ai,
  the GitHub organisation is still f1tenth, and the competitions are numbered as the "International
  RoboRacer Autonomous Racing Competition" (24th at ICRA 2025, 31st at IROS 2026).
tagline: Autonomous 1:10-scale car races at robotics conferences, with time trials and head-to-head
  races on team-built cars.
description: >
  A series of physical autonomous racing competitions on the open-source F1TENTH (now RoboRacer) 1:10-scale
  car, begun at Embedded Systems Week 2016 in Pittsburgh and held since at conferences such as CPS(-IoT)
  Week, ESWeek, ICRA, IROS, IV, ITSC and CDC, several times a year; the site counts 30 competitions since
  2016 and the IROS 2026 race is numbered the 31st. Each team builds its own car to the published bill
  of materials (a Traxxas 1:10 chassis, a LiDAR no better than a Hokuyo UST-30LX, any onboard computer,
  one brushless motor), qualifies with a video of autonomous driving, and races on a track of air ducts
  or pipes laid out in the conference hall and mapped in practice. The Time Trial ranks teams on their
  fastest lap and on their number of consecutive uninterrupted laps in two five-minute heats, and seeds
  the Head-to-Head race, an elimination tournament of two-car races (20 laps, best of three, at ICRA 2025)
  that IROS 2026 widened to up to four cars. Some editions add a virtual round in simulation (ICRA 2025's
  ran on the AutoDrive Ecosystem). The organisers publish the f1tenth_gym simulator and course material,
  but no harness scores a race: results are the race director's lap times and the tournament placements,
  posted on each competition's site.
self_description:
  source: src-pmlr-v123-okelly20a-pdf
  quote: This paper details the F1TENTH autonomous racing platform, an open-source evaluation
    framework for training, testing, and evaluating autonomous systems.
paper:
  title: 'F1/10: An Open-Source Autonomous Cyber-Physical Platform'
  arxiv: '1901.08567'
  version_read: v1
  source: src-arxiv-1901-08567-v1
paper_note: The platform paper, which also describes the first three races. The benchmark tasks are
  defined in the NeurIPS 2019 competition-track paper (PMLR 123, src-pmlr-v123-okelly20a-pdf), which
  has no DOI or arXiv id; the rules are the organisers' rulebooks, not a paper.
released: null
released_note: The first race was held at ESWeek 2016 in Pittsburgh, but no source read gives its
  day, so the date is left null; see release_venue.
release_venue: Embedded Systems Week (ESWeek) 2016, Pittsburgh
release_venue_source: src-arxiv-1901-08567-v1
release_venue_quote: inaugural race was held at the 2016 ES-Week

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/autonomous-driving-planning
  secondary: []
domain_basis:
  reason: Teams' cars drive themselves around a race track and are scored on the driving outcome --
    lap time, laps without a crash, and finishing first against other cars -- not on perception
    accuracy. The race stack built for it calls F1TENTH a head-to-head autonomous racing
    competition, and the evaluation-environment paper reduces every task to lap time.
  source: src-pmlr-v123-okelly20a-pdf
  quote: 'submitted solutions are measured by a simple, sparse reward: lap time.'
domain_considered_and_rejected:
  - term: robotics-embodiment/continuous-control
    reason: The 2019 evaluation-environment paper is titled for continuous control and reinforcement
      learning, but the competitions score a race on a physical track, not a control objective in
      the abstract (the family's mujoco-gymnasium near miss).
  - term: robotics-embodiment/sim2real-transfer
    reason: The evaluation-environment paper compares its baselines' simulated and real lap times,
      and some editions add a simulated round, but no race scores how much simulated performance
      survives on the car; the physical races are scored on their own.
    source: src-pmlr-v123-okelly20a-pdf
    quote: In all the experiments, the lap times measured on hardware rollouts are higher than the
      simulated lap times.
  - term: robotics-embodiment/navigation
    reason: The cars localise against a map they build, but the map is known before the race and the
      track does not change, so the task is driving the known track fastest; the driving leaf is the
      narrower fit.
    source: src-github-roboracer-rules-readme
    quote: The map (track layout) is **known** a priori (from practice the day before) and the track
      layout does not change over the whole competition.
  - term: engineering-design/structural-mechanical-design
    reason: Teams build their own cars, but to a common bill of materials with caps on every
      component, and the score is how the car is driven; the car is operated, not designed for the
      score (the family's exclusion test).
    source: src-arxiv-1901-08567-v1
    quote: Every team builds the same baseline car

capability:
  - sensorimotor-control
  - autonomy
  - planning
  - reliability-consistency
capability_basis:
  sensorimotor-control:
    reason: The car is driven in closed loop from its own LiDAR, cameras and odometry, computed on
      board, and the score is the physical lap or race that results.
    source: src-github-roboracer-rules-readme
    quote: In the spirit of the competition, all computation must be done onboard the vehicle.
  autonomy:
    reason: Cars race without a driver; entry requires a video of unaided autonomous laps, and
      manual control is allowed only to slow a car that failed the obstacle test, never to race it.
    source: src-github-roboracer-rules-readme
    quote: To qualify for the in-person competition, teams should submit a video of their car
      driving autonomously around a track.
  planning:
    reason: The evaluation-environment paper names its tasks as kinodynamic planning problems, and
      each race is an interactive episode against an explicit objective (the fastest lap, or
      finishing first) whose executed sequence is scored by its outcome, which the term's inclusion
      test admits.
    source: src-pmlr-v123-okelly20a-pdf
    quote: 'Benchmark 1: Static Kinodynamic Planning'
  reliability-consistency:
    reason: Half of the Time Trial score is a ranking on the number of consecutive laps driven
      without a crash or stop on the same track in the same heat, which scores repeated success
      rather than an average.
    source: src-github-roboracer-site-general-rules
    quote: 'Consecutive uninterrupted laps: Teams are ranked based on the highest number of consecutive
      uninterrupted laps they complete.'
capability_considered_and_rejected:
  - term: perception
    reason: Cars must localise and detect opponents and obstacles from LiDAR or cameras, but nothing
      perceptual is scored; the score is the drive.
  - term: collaboration
    reason: Several cars share the track in the head-to-head races, but they compete; the rules
      forbid teams from sharing code on the day.
    source: src-github-roboracer-rules-readme
    quote: Each team must run their own unique algorithms and cannot run the same code on multiple
      vehicles.
  - term: distribution-shift-generalization
    reason: Each competition has a new hall and track (and the rules warn of reflective floors and
      gaps in the barriers), but no score is reported for a shifted condition beside an
      in-distribution one.

evaluation_method:
  - physical-trial
  - tournament-play
  - entrant-relative-ranking
evaluation_method_basis:
  reason: Every scored run is a physical car on the track, timed by the race director's time-keeping
    system (a transponder on the car). The Head-to-Head race places teams by racing them against
    each other in an elimination bracket, which is tournament-play. The Time Trial's final score is
    a sum of rank points (fastest lap and consecutive laps, each awarded by position among the
    entrants), so a team's score moves when the field changes, which is entrant-relative-ranking.
  source: src-github-roboracer-rules-readme
  quote: The head-to-head race will be organized as a double-elimination tournament with two
    brackets seeded by results of the qualification.
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: Some editions add a virtual round in a simulator, but its time trial ranks lap times,
      which are unbounded, and its head-to-head is a tournament; the series' headline results are
      the physical races.
    source: src-github-roboracer-rules-readme
    quote: The virtual competition will be completely done in an simulation environment only and no
      hardware is involved.
  - term: composite
    reason: The Time Trial adds two rankings, but both come from the same physical heats timed the
      same way; entrant-relative-ranking carries the aggregation.
    source: src-github-roboracer-rules-readme
    quote: The final score is the sum of the points from both categories.
designed_for_subjects:
  - physical-robot-system
designed_for_subjects_basis:
  reason: The entrant is a team's whole car -- the hardware it built within the specification and
    the software running on it -- scored on a physical track, so the body is inside the evaluated
    system. Unlike A2RL, the evaluator supplies no standard body, only the specification and an
    inspection.
  source: src-github-roboracer-rules-readme
  quote: Teams registered for the in-person competition need to provide and build a Roboracer car by
    themselves according to the constraints listed below.
designed_for_subjects_considered_and_rejected:
  - term: rl-policy
    reason: The f1tenth_gym was presented as an environment for reinforcement learning, but the
      races run on hardware, which rl-policy's exclusion sends to physical-robot-system; the virtual
      rounds are a subset, not the series' design.
  - term: classical-algorithm
    reason: Teams may run any method. The organisers' baselines include follow-the-gap, RRT and MPC
      controllers beside a learned imitation policy, and the race stack that has won repeatedly is a
      modular stack; no source read says the entrants are all non-learned.
    source: src-arxiv-1901-08567-v1
    quote: From there, they have the freedom to deploy any algorithms they want to complete a loop
      around the track in the fastest time, and to complete the biggest number of laps in a
  - term: human-expert
    reason: No human driver races in the protocol; manual control is a penalty measure, not an
      entry.

lifecycle: active
lifecycle_basis:
  reason: Five numbered competitions ran in 2026 (the 27th at ICRA in Vienna to the 31st at IROS in
    Pittsburgh), and a 2026 paper (AROLA, IV 2026) reports a stack deployed at the 2025 IV race.
  source: src-github-roboracer-site-past-races
  quote: '"name": "27th RoboRacer Autonomous Racing Competition (ICRA 2026, Vienna)",'
activity: results-pending
activity_basis:
  reason: The last listed race, the 31st competition at IROS 2026 (28-30 September 2026), is over,
    and its results page still shows its placeholder five weeks later; the upcoming-events list
    names no later race. No round is open and no standing board takes results.
  source: src-roboracer-iros2026-results
  quote: Results will be posted after the competition.
events:
  - name: ICRA 2024 Mad Games and IROS 2023 Mad Games, side events listed among the past races;
      their format was not read
    kind: co-located-side-event
    source: src-github-roboracer-site-past-races
    quote: '"name": "ICRA 2024 Mad Games",'
  - name: ICRA Autonomous Racing Workshop, listed among the past races
    kind: workshop
    source: src-github-roboracer-site-past-races
    quote: '"name": "ICRA Autonomous Racing Workshop",'
  - name: RoboRacer Autonomous Racing Competition - Spring 2024 Course, a course's closing race,
      listed among the past races
    kind: course-race
    source: src-github-roboracer-site-past-races
    quote: '"name": "RoboRacer Autonomous Racing Competition - Spring 2024 Course",'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SSIL DAgger, the organisers' vision-based imitation-learning baseline for the
      obstacle-avoidance task that the competitions use as qualification (Benchmark 2), run in
      simulation and on the car
    source: src-pmlr-v123-okelly20a-pdf
    observed_on: 2026-11-05
    quote: illustrates a method to transfer a reactive LIDAR based obstacle avoidance policy to a
      vision based policy via self-supervised imitation learning (SSIL).
    note: A baseline in the organisers' paper, not a race entry; no source read reports a learned
      policy's result in an official race (see review_checks).
evaluation_target: mixed
evaluation_target_basis:
  reason: Any algorithm may race. The organisers' baselines are classical controllers
    (follow-the-gap, RRT, MPC) and a learned imitation policy, and the stack with repeated wins
    (ForzaETH) is a modular autonomy stack.
  source: src-arxiv-2403-11784
  quote: by winning the official F1TENTH international competition multiple times
execution_mode: physical-trial
ground_truth_source: experimental
ground_truth_source_note: The race director's lap times, from a transponder fixed to each car, and
  the finishing order of each race as called by the referees. No item has a stored answer.
ground_truth_source_source: src-github-iros2026-race-competition-rules
ground_truth_source_quote: keep a free, flat spot on the bottom of the car where the organizers can
  attach the lap-timing transponder.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: An official result exists only from the organisers' race, on their track in that hall,
    against the field on the day; anyone can build the car and a track, but not repeat a race.
  source: src-github-roboracer-rules-readme
  quote: The laptime will be measured with a time-keeping system provided by the race director.

task:
  exists: true
  input:
    - The car's own sensor readings -- a 2D LiDAR (no better than a Hokuyo UST-30LX), optional mono
      or stereo cameras, IMU and wheel odometry -- with a map of the track built by the team in
      practice; indoor GPS is forbidden
  output: Steering and speed commands computed on board, driving the car around the track (and past
    obstacles and opponents).
  scoring: Time Trial -- two heats of five minutes; teams are ranked on their fastest lap and on
    their number of consecutive uninterrupted laps, each ranking awards points by position, and the
    sum ranks the teams (ties go to more laps); a crash costs the time to recover. Head-to-Head --
    seeded by the Time Trial, races of two cars (best of three rounds, first to 20 laps, double
    elimination with a final four at ICRA 2025; up to four cars, single elimination, about 10 laps
    at IROS 2026), after an obstacle test; referees judge collisions and place the at-fault car
    behind.
  source: src-github-roboracer-rules-readme
  quote: The race consists of two heats. Each heat lasts for 5 minutes, and the goal is to drive a
    single lap in as short time as possible and to drive as many complete laps as possible.
platform: Each team's own car built to the RoboRacer bill of materials (ICRA 2025 rules) -- a 1:10
  Traxxas chassis or one within 15% of its dimensions, 2WD or 4WD; any onboard computer (Jetson,
  NUC, Raspberry Pi); a LiDAR no better than a Hokuyo UST-30LX (30 m range, 40 Hz, 0.125 degrees);
  optional mono or stereo cameras; one brushless motor no stronger than a Velineon 3500 kV; at most
  one 4S battery on the motor; soft bumpers and a LiDAR-visible box for head-to-head racing
platform_note: >
  The hardware varies by team within these caps, so it is part of the evaluated system and each team declares
  it (IROS 2026 publishes the hardware lists after the race). The 2019 platform paper's reference car
  used an NVIDIA Jetson TX2, a Hokuyo 10LX LiDAR and a Traxxas chassis; the computation constraint was
  lifted later because of supply-chain shortages.
hardware:
  source: src-github-roboracer-rules-readme
  quote: The teams are allowed to use components of similar or lower specifications.

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_basis:
    reason: There is no dataset. Teams register through a form with a video of their car driving
      autonomously and avoiding obstacles and a hardware list, and the registration is approved once
      they are submitted; the rules are open to teams of all levels and no selection among
      applicants is described.
    source: src-github-iros2026-race-competition-rules
    quote: A link to a video of their car driving autonomously and avoiding obstacles (~1 minute).
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each competition is a new live race on a new track in a different hall, several times a
      year, which for a physical competition is a new evaluation by construction.
    source: src-arxiv-1901-08567-v1
    quote: followed by another race held during Cyber-Physical Systems (CPS) Week in April 2018, in
      Porto, Portugal.
  data_provenance:
    - real-world-instrument
  data_provenance_note: The scored items are the timed laps and races of a live physical
    competition.
  data_provenance_source: src-github-roboracer-rules-readme
  data_provenance_quote: The laptime will be measured with a time-keeping system provided by the
    race director.
  contamination_risk: low
  contamination_risk_note: A live race on a new track has no stored item set for training data to
    contain. Teams map and practise on the race track for a day or more before racing, which is the
    protocol, not contamination. No source discusses contamination.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No human driver or physical bound is set beside the results; lap times
    have no ceiling and placements are relative to the field.
  dataset_licence: null
  dataset_licence_note: There is no dataset; nothing is released. The rules encourage the top three
    teams of each race to publish their code under an open-source licence.
  size:
    - count: 30
      unit: competitions since 2016
      subset: all editions (as of the site read on 2026-11-05)
      note: The IROS 2026 race is numbered the 31st; the site's past-races and upcoming lists
        together hold 38 races, side events and a course race among them, so the counts do not agree
        (see review_checks).
      source: src-github-roboracer-site-about
      quote: There have been 30 competitions since 2016.
    - count: 12
      unit: universities whose teams had raced (by January 2019)
      subset: the first three races (2016-2018)
      source: src-arxiv-1901-08567-v1
      quote: So far, teams from more than 12 universities have participated in the F1/10 competition
    - count: 2
      unit: Time Trial heats of 5 minutes each
      subset: time trial (IROS 2026)
      source: src-github-iros2026-race-competition-rules
      quote: Two heats, 5 minutes each.
    - count: 20
      unit: laps to win a head-to-head race
      subset: head-to-head (ICRA 2025)
      source: src-github-roboracer-rules-readme
      quote: The first car that completes **20 laps** wins.
    - count: 4
      unit: cars at most in one head-to-head race
      subset: head-to-head (IROS 2026)
      source: src-github-iros2026-race-competition-rules
      quote: Up to four. This replaces the two-car format described in the General Rules.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: RoboRacer (formerly F1TENTH), led from the University of Pennsylvania's xLAB, where
    the project began in 2016; each competition is run by organisers at its host conference under
    the RoboRacer General Rules, extended by that competition's own rules
  maintainer_basis:
    reason: The project's About page says it started at the University of Pennsylvania in 2016 and
      is led from Penn's xLAB; the General Rules apply to every official in-person competition and
      each competition's rules extend them. The GitHub organisation (f1tenth) holds the rules, the
      site and the simulator.
    source: src-github-roboracer-site-about
    quote: leads it from Penn's xLAB.
  maintainer_type: academic-lab
  maintainer_type_basis:
    reason: The project is held and led by a university research group, per its own About page. No
      foundation or other legal form is stated in the sources read.
    source: src-github-roboracer-site-about
    quote: founded 2016, University of Pennsylvania
  submission_process: physical-competition
  submission_process_note: Teams bring their cars to the venue and race on fixed dates; results are
    the organisers' lap times and brackets, posted on each competition's site. Virtual rounds, where
    held, take code submitted to a simulation platform (AutoDrive at ICRA 2025), and the organisers
    may reject an entry that exploits the simulator.
  independence_flags: []
  independence_flags_note: Not assessed. No source read lists sponsors, prize funders or the
    organising institutions' own teams against the results, so whether an organiser's group races in
    its own competition, or industry funds prizes, is not known.
  independence_assessed: false
  participation:
    source: src-arxiv-1901-08567-v1
    quote: So far, teams from more than 12 universities have participated in the F1/10 competition

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: physical-venue-entry
  compute_tier_note: Teams buy and build their car (participant-funded) and bring it and up to four
    members to the host conference, whose registration is required (USD 300 per person for the
    competitions-only rate at IROS 2026). All computation is on the car.
  compute_tier_source: src-github-roboracer-rules-readme
  compute_tier_quote: Teams registered for the in-person competition need to provide and build a
    Roboracer car by themselves according to the constraints listed below.
  reproducibility_tier: requires-specialized-hardware
  reproducibility_tier_basis:
    reason: A past race cannot be repeated (live-world-state); a fresh run needs a 1:10 race car
      built to the bill of materials and a track, which are built from purchasable parts but are not
      general computing hardware. Nothing only the organisers hold is needed to run the format.
    source: src-github-roboracer-rules-readme
    quote: The race is designed with **1:10 Traxxas** chassis in mind
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: The result is a race on a given day, in a given hall, on a track
    laid out for that event, against the field on the day.
  harness_availability: reference-implementation-only
  harness_note: The organisers publish the f1tenth_gym simulator (with a ROS bridge and a JAX
    rewrite), the car's driver stack and course labs, which show how to take part; no published code
    produces an official result, which comes from the race director's timing and the referees.
  harness_source: src-github-f1tenth-gym-readme
  harness_quote: This is the repository of the F1TENTH Gym environment.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for f1tenth/f1tenth_gym, read 2026-11-05; not a
    quoted Source. The rules repository and the site repository carry no licence.
  est_participant_cost_usd: null
  est_participant_cost_usd_note: No source states the cost of a car; the only figure read is the
    IROS 2026 conference fee of USD 300 per team member.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # The physical-trial profile already makes hardware_platform, venue, subset_used and n_samples material. Here the
  # hardware differs by team within the bill of materials' caps ("The teams are allowed to use components of similar
  # or lower specifications", src-github-roboracer-rules-readme), so hardware_platform is restated. subset_used
  # carries the competition and format (time trial or head-to-head, and the number of cars), venue the hall and its
  # floor. simulator and simulator_version are material to virtual-round results only: ICRA 2025's virtual round
  # "is based on the [AutoDrive Ecosystem]" (same Source) at an unstated version, and the f1tenth_gym "is still under
  # heavy developement" (src-github-f1tenth-gym-readme), so its build matters to any simulated lap time.
  material_extra:
    - hardware_platform
    - simulator
    - simulator_version
  # Time Trial points and head-to-head placements are relative to the field of that competition.
  rating_pool_required: true

liveness:
  repo_last_commit: 2025-10-13
  last_checked: 2026-11-10

homepage: https://roboracer.ai/
repository: https://github.com/f1tenth/roboracer_rules
maintainer_url: https://github.com/f1tenth


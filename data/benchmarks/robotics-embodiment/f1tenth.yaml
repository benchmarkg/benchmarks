curation:
  added_by: agent (P1-S5-T03)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-github-roboracer-rules-readme
    - src-github-roboracer-site-general-rules
    - src-github-roboracer-site-past-races
    - src-github-roboracer-site-upcoming-events
    - src-github-roboracer-site-about
    - src-github-iros2026-race-competition-rules
    - src-roboracer-iros2026-results
    - src-github-f1tenth-gym-readme
    - src-arxiv-1901-08567-v1
    - src-pmlr-v123-okelly20a-pdf
    - src-arxiv-2506-15899-v1
    - src-arxiv-2403-11784
    - src-arxiv-2602-02730
  sources_note: >
    roboracer.ai renders by script, so its rules, race lists and About page were read from the repository
    that builds it, pinned at commit 2998bf7; the ICRA 2025 ruleset from f1tenth/roboracer_rules at 202c377;
    the IROS 2026 rules from f1tenth/iros2026_race at 9c65656, and its live results page; the gym README
    at 4fdb9c7. The three arXiv documents are DOI Sources and are not archived. The PMLR PDF (e-mail block),
    the About page (named leads) and the upcoming-events file (a maintainer's first name) are withheld
    from archiving; their extracts leave the names out. Per-competition sites, results tables and team
    lists were not read.
  confidence: medium
  review_checks:
    - check: The learned-entrant evidence is the organisers' own imitation-learning baseline on the
        qualification task, in simulation and on a car, not a race entry. No source read reports a
        learned policy racing in an official round; a 2025-2026 paper on an RL policy or a team
        report that does would be stronger evidence.
      field: learned_entrant_evidence
    - check: Edition count and numbering disagree. The About page says 30 competitions since 2016,
        the IROS 2026 race is the 31st, the past-races and upcoming lists hold 38 races (with Korea
        and Germany championships, BU, Techfest and ICCAS races), and ICRA 2025 (the 24th) and IV
        2025 are missing from the list. Which races are official numbered editions, and whether the
        national championships and university races belong to this entry, needs a ruling.
      field: versions
      source: src-github-roboracer-site-past-races
      quote: '"name": "17th Autonomous Championship",'
    - check: The survey's Table IV numbers the 2024 editions (15th to 22nd) and places them, but
        pdftotext flattens it, so the numbers are not attached to version rows. Read the table in a
        layout-preserving render before adding them.
      field: versions
      source: src-arxiv-2506-15899-v1
      quote: RoboRacer competitions are featured at several prestigious conferences
    - check: The prompt describes a "F1TENTH Foundation" as the organiser; no source read names a
        foundation or any legal form. academic-lab rests on the About page's statement that the
        project is led from Penn's xLAB; community-collective is the alternative if the races are
        held to be run by their local organisers.
      field: governance.maintainer_type
    - check: activity results-pending reads the IROS 2026 results page's placeholder five weeks
        after the race. If results were posted elsewhere (the Twitch stream, a bracket site), the
        state is between-rounds, since no later race is announced in the lists read.
      field: activity
    - check: reliability-consistency rests on the Time Trial's consecutive-laps ranking, a count of
        successive clean laps rather than pass^k over independent trials. Drop it if the term needs
        independent repeats of one item.
      field: capability
    - check: entrant-relative-ranking for the Time Trial's rank-point sum, beside tournament-play
        for the bracket. Earlier rulesets (2016-2018) ranked on raw lap time and lap count; the
        rank-point rule is read from the 2025 and 2026 rules only.
      field: evaluation_method
    - check: The virtual rounds are a subset with a different execution mode (simulation, code
        submitted to a platform). Whether they need their own execution or domain override, and
        which editions had them (an ICRA 2022 virtual competition is known from an organisation
        repository's name only), is open.
      field: subsets
    - check: gated-registration reads the IROS 2026 registration (form, video, hardware list,
        approval) as admitting every team that qualifies; venue capacity or organiser discretion
        could make it invitation-only at some editions.
      field: data.access
    - check: requires-specialized-hardware treats a 1:10 race car and a track as hardware that is
        not generally available although it is built from purchasable parts; reference
        implementations (gym, driver stack) are published, so the tier may be read as automatable
        for the virtual subset.
      field: execution.reproducibility_tier
  personal_data_excluded:
    - source: src-github-roboracer-site-about
      what: the names of the project's lead and co-founder and a site maintainer's name in code
        comments
    - source: src-github-roboracer-site-upcoming-events
      what: a site maintainer's first name in a scheduling note
    - source: src-pmlr-v123-okelly20a-pdf
      what: the author block with its e-mail addresses and the volume editors' names
    - source: src-arxiv-1901-08567-v1
      what: the author block
    - source: src-arxiv-2506-15899-v1
      what: the author block and its e-mail line
    - source: src-arxiv-2403-11784
      what: the author list and the submitter's name
    - source: src-arxiv-2602-02730
      what: the author list and the submitter's name

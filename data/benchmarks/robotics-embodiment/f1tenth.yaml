subsets:
  - id: f1tenth#time-trial
    label: Time Trial -- single-car heats ranked on fastest lap and consecutive uninterrupted laps
    scored_separately: true
    evidence:
      - source: src-github-roboracer-rules-readme
        quote: Time Trial is a race with a goal to drive through the designated track as fast as
          possible and as consistently as possible.
      - source: src-github-roboracer-site-general-rules
        quote: Time Trial is used as a seeding technique for the Head-to-Head Race.
    notes: Two results tables (fastest lap, consecutive laps), combined by rank points into one
      ranking that also seeds the Head-to-Head bracket. The first races (2016-2018) were time trials
      only.
  - id: f1tenth#head-to-head
    label: Head-to-Head -- races between cars on the track at once, in an elimination bracket
    scored_separately: true
    evidence:
      - source: src-github-roboracer-site-general-rules
        quote: Head-to-Head race is a race with multiple cars on the track at the same time.
      - source: src-github-iros2026-race-competition-rules
        quote: Up to four. This replaces the two-car format described in the General Rules.
    notes: Two cars per race through ICRA 2025 (best of three rounds, 20 laps, double elimination
      with a final four); up to four at IROS 2026 (single elimination, about 10 laps). Entry needs a
      passed obstacle-avoidance test. The 2019 platform paper says car-vs-car racing was still to
      come.
  - id: f1tenth#virtual
    label: Virtual competition -- time trial and head-to-head in a simulator, at some editions
    scored_separately: true
    evidence:
      - source: src-github-roboracer-rules-readme
        quote: This simulation environment is based on the [AutoDrive
          Ecosystem](https://autodrive-ecosystem.github.io/).
      - source: src-github-roboracer-rules-readme
        quote: Roboracer reserves the right to reject any submission that we deem illegal due to
          circumstances such as exploiting the simulation environment.
    notes: Code is submitted to a simulation platform and raced there, with no hardware; ICRA 2025's
      ran on the AutoDrive Ecosystem. Which other editions held a virtual round was not established.


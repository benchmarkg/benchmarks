# data/benchmarks/robotics-embodiment/a2rl-drone-championship.yaml
#
# P1-S5-T02, robotics-embodiment entry 13. Filled from the organiser's pages on a2rl.io (the drone race page, the
# home page, and four blog posts: the Season 1 recap, the Season 2 announcement, the Season 2 testing schedule and
# the Season 2 selection rounds); the organiser's two Business Wire releases (the July 2024 launch and the January
# 2026 Season 2 results), read as Medianet News Hub copies; the Technology Innovation Institute's "About us" page;
# and two participating teams' papers, each read as its v1 PDF and its abstract page: MonoRace (arXiv 2601.15222,
# TU Delft's MAVLab, the Season 1 winner) and the KAIST team's system paper (arXiv 2512.20475), which describe the
# rules and the supplied drone. No rulebook or scoring specification is published. Every quote below is checked by
# the quote-substring validator against those Sources' committed extracts. Human pilots, team members and
# executives are not named here: quote organisations and systems only.

id: a2rl-drone-championship
name: A2RL Drone Championship
aliases:
  - A2RL x DCL Autonomous Drone Championship
  - A2RL Drones
  - Abu Dhabi Autonomous Drone Racing Competition
aliases_note: The first season was organised with the Drone Champions League (DCL) and is called
  "A2RL x DCL" in both team papers; MonoRace's abstract calls it the 2025 Abu Dhabi Autonomous Drone
  Racing Competition. The Season 2 release, organised by ASPIRE alone, says "A2RL Drone
  Championship".
tagline: Autonomous drone races in Abu Dhabi on a supplied one-camera drone, with heats against
  human FPV pilots.
description: >
  A yearly physical competition run by the Abu Dhabi Autonomous Racing League (A2RL), owned by ASPIRE
  of Abu Dhabi's Advanced Technology Research Council. Selected teams fly a drone the organisers supply,
  with a fixed configuration -- a 5-inch quadrotor with one forward-facing rolling-shutter camera, the
  flight controller's IMU and an NVIDIA Jetson Orin NX -- fully autonomously through a gated indoor track,
  with no GPS, motion capture, external positioning or human control. Season 1 (11-12 April 2025, ADNEC,
  with the Drone Champions League) had 14 teams in four formats: the Grand Challenge, a two-lap time trial
  over 11 gates timed from the first passage of gate 1 to the second passage of gate 11; AI vs Human,
  a knockout against the best human FPV pilots; a four-drone race; and a drag race. Season 2 (21-22 January
  2026, UMEX Abu Dhabi) ran an AI Speed Challenge, gold and silver multi-drone races and a best-of-nine
  Human vs AI final on a 14-gate track. Entry is by application and selection, through virtual (simulated)
  selection rounds, an on-site selection on the official drone and qualification on the track. There is
  no dataset, no harness and no leaderboard: results are the organisers' race times and placements.
self_description:
  source: src-a2rl-drone-race-page
  quote: This challenge features fully autonomous drones flying on complex tracks at high speed,
    designed to evaluate how advanced AI systems perceive, plan, and respond in real-time.
paper: null
paper_note: The organisers publish no paper, rulebook or scoring specification. The rules and the
  platform are read from two participating teams' papers (MonoRace, src-arxiv-2601-15222-v1; KAIST,
  src-arxiv-2512-20475-v1), which are a competitor's account, not the organiser's.
released: 2025-04-11
released_note: The first race day of Season 1. The championship was announced, with registration
  open, in a release dated 2024-07-25 (src-medianet-a2rl-drone-launch-2024).
released_source: src-arxiv-2601-15222-v1
released_quote: The competition was held on April 11 and 12, 2025, in Abu Dhabi.
release_venue: Season 1 at ADNEC Marina Hall, Abu Dhabi (11-12 April 2025)
release_venue_source: src-a2rl-blog-drones-season-1
release_venue_quote: turned ADNEC Marina Hall into a vision of the future

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/drone-uav
  secondary: []
domain_basis:
  reason: An autonomous aerial vehicle is flown through a gated track at speed, and the result is
    its flight time or race placement, so flight dynamics define the task. The drone is supplied and
    operated, not designed (engineering-design's exclusion), and the corpus classification gives the
    same leaf.
  source: src-a2rl-home
  quote: develop fully autonomous drones capable of navigating complex aerial tracks at extreme
    speeds without human control
domain_considered_and_rejected:
  - term: robotics-embodiment/navigation
    reason: The drone must localise itself against gates it sees, but the track is known and fixed
      for the race, and the scored quantity is speed through it; drone-uav is the more specific
      leaf.
    source: src-arxiv-2601-15222-v1
    quote: The organizers defined the completion time as the interval from the first passage of Gate
      1 to the second passage of Gate 11.
  - term: robotics-embodiment/sim2real-transfer
    reason: Season 2's selection began in simulation, but nothing scored measures how simulated
      performance survives on hardware; the races are physical only.
  - term: robotics-embodiment/continuous-control
    reason: The control is continuous, but the score is a race outcome on a physical track, not a
      control objective in the abstract (the family's mujoco-gymnasium near miss).
  - term: robotics-embodiment/autonomous-driving-planning
    reason: A2RL's car series is a separate competition; this one flies drones.

capability:
  - sensorimotor-control
  - autonomy
  - planning
capability_basis:
  sensorimotor-control:
    reason: The policy closes the loop from one camera and an IMU to the drone's motors at speed,
      and the score is the physical flight that results.
    source: src-arxiv-2512-20475-v1
    quote: Competing teams are restricted to using only a single forward-facing RGB camera and
      optionally a low-cost inertial measurement unit (IMU) built in the flight controller for all
      navigation and control tasks.
  autonomy:
    reason: The protocol prohibits human control and every external aid, and scores what the drone
      achieves unattended.
    source: src-medianet-a2rl-drone-championship-2026
    quote: All drones competed fully autonomously using a single forward-facing monocular RGB camera
      and an inertial measurement unit.
  planning:
    reason: The organiser claims planning, and each race is an interactive episode against an
      explicit objective (complete the laps fastest, or beat the other drones), whose executed
      sequence is scored by its outcome, which the term's inclusion test admits. Season 2's
      mission-style obstacles add to it.
    source: src-a2rl-drone-race-page
    quote: This challenge features fully autonomous drones flying on complex tracks at high speed,
      designed to evaluate how advanced AI systems perceive, plan, and respond in real-time.
capability_considered_and_rejected:
  - term: perception
    reason: Gate detection from the camera is the core difficulty, but the score is time and
      placement, not what was recovered from the images.
  - term: collaboration
    reason: The multi-drone races put several drones in one airspace, but they compete; avoiding the
      others is not working with them.
    source: src-arxiv-2601-15222-v1
    quote: 3. Multi-Drone Race — single race with four AI drones flying simultaneously.
  - term: reliability-consistency
    reason: Season 2's qualification asked for consistent laps, but that decides entry, not the
      scored result; the races take the fastest or winning run.
    source: src-a2rl-blog-drones-season-2-road
    quote: To qualify, teams must complete full-track runs and demonstrate consistent lap
      performance across all formats.
  - term: distribution-shift-generalization
    reason: The track and hall are new to the teams and change between seasons, but no score is
      reported for a deliberately shifted condition against an in-distribution one.

evaluation_method:
  - physical-trial
  - tournament-play
evaluation_method_basis:
  reason: Every result is a timed run of a physical drone on the track, timed by the organisers' RF
    timing system. The Grand Challenge (AI Speed Challenge in Season 2) is a time trial; the AI vs
    Human knockout and the multi-drone races place entrants by racing them against each other, which
    is tournament-play.
  source: src-arxiv-2601-15222-v1
  quote: 2. AI vs Human — three knockout rounds in a head-to-head race (AI teams and FPV pilots).
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: Season 2's virtual selection rounds and Season 1's simulator tasks decide who races, but
      no published result comes from them.
    source: src-a2rl-blog-drones-season-2-road
    quote: This season began with two rounds of virtual selection challenges, designed to test
      algorithmic capability and innovation under pressure.
  - term: entrant-relative-ranking
    reason: Placements depend on the field, but they come from races between entrants, which the
      term's exclusion sends to tournament-play; the Grand Challenge's times are absolute.
designed_for_subjects:
  - physical-robot-system
  - human-expert
designed_for_subjects_basis:
  reason: The entrant is a team's autonomy stack running on the organisers' standard drone, which
    physical-robot-system covers when the evaluator supplies the same body to every entrant. Human
    FPV pilots race the same track unaided in the AI vs Human format, so the protocol admits human
    entrants.
  source: src-arxiv-2601-15222-v1
  quote: The best-ranked human FPV pilots were subsequently pitted against the best-ranked
    autonomous drones in a direct knockout tournament
designed_for_subjects_considered_and_rejected:
  - term: rl-policy
    reason: MonoRace's controller is a reinforcement-learned network, but rl-policy's exclusion
      sends a policy running on hardware to physical-robot-system.
  - term: classical-algorithm
    reason: Teams may enter any method, and the KAIST system pairs visual-inertial odometry with
      model predictive control, but its gate detector is a learned YOLO model; no entrant without a
      learned component is shown.
  - term: human-ai-team
    reason: Human pilots and autonomous drones race each other; no entrant combines them.

lifecycle: active
lifecycle_basis:
  reason: Season 2 ran in January 2026 with results published by the organiser, and participating
    teams published system papers in December 2025 and January 2026.
  source: src-medianet-a2rl-drone-championship-2026
  quote: Held over two days on 21–22 January during UMEX
activity: between-rounds
activity_basis:
  reason: Season 2's results are out, and the drone page carries a registration form for Race 3 with
    no date given anywhere read. Registering for a physical race is not submitting a result (the
    vocabulary's own example).
  source: src-a2rl-drone-race-page
  quote: Drone Registration for Race 3
events:
  - name: DCL Falcon Cup (Season 1), the human pilots' race held alongside, whose best pilots met
      the best autonomous drones in the AI vs Human knockout
    kind: co-located-human-race
    source: src-arxiv-2601-15222-v1
    quote: human FPV drone racing pilots competed in the DCL

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: MonoRace (TU Delft MAVLab), winner of the 2025 Grand Challenge and the AI vs Human
      knockout
    source: src-arxiv-2601-15222
    observed_on: 2026-11-04
    quote: the guidance and control are performed by a neural network that foregoes inner loop
      controllers by directly sending motor commands
evaluation_target: learned-system
execution_mode: physical-trial
ground_truth_source: experimental
ground_truth_source_note: The organisers' recorded times, measured by a VTx-based RF timing system,
  and the finishing order of each race. No item has a stored answer.
ground_truth_source_source: src-arxiv-2601-15222-v1
ground_truth_source_quote: are measured using a VTx-based RF timing system
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: An official result exists only from the organisers' race, on their drone, their track and
    their hall, against the field on the day.
  source: src-arxiv-2601-15222-v1
  quote: To this end, the organizers created the drone hardware accordingly and determined both the
    race track and the competition hall, which did not feature a motion tracking system.

task:
  exists: true
  input:
    - Images from one forward-facing rolling-shutter camera and the flight controller's IMU
      readings, on the organiser-supplied drone, with no external localisation
  output: Flight commands computed onboard (the Jetson Orin NX and the flight controller), flying
    the drone through the gates.
  scoring: Grand Challenge (AI Speed Challenge in Season 2) -- the fastest completion time of two
    laps within a 15-minute individual trial, timed from the first passage of gate 1 to the second
    passage of gate 11 in Season 1; AI vs Human -- head-to-head knockout heats (best of nine in the
    Season 2 final); multi-drone races -- finishing order of four drones flying at once; drag race
    (Season 1) -- time on an 83 m straight with four gates.
  source: src-arxiv-2601-15222-v1
  quote: 1. Grand Challenge — 15 minutes individual trial for AI teams (fastest time counts).
platform: The A2RL drone, supplied by the organisers (Season 1, as two teams describe it) -- a
  5-inch quadrotor (30 x 28 x 10 cm frame, 6S 1400 mAh battery, about 960 g) with an NVIDIA Jetson
  Orin NX on an A603 carrier board, an Arducam IMX219 rolling-shutter camera, and a Foxeer H7 flight
  controller (STM32H743, MPU-6000 IMU)
platform_note: >
  The hardware is fixed and supplied, so it is the evaluated system's body and the entrant is the software
  on it. Only the camera's mounting angle may change (KAIST mounted it at 15 degrees for qualification
  and about 45 for the final). Season 2's sources name the same sensor set (one forward-facing monocular
  RGB camera and an IMU) and "the official A2RL drone design", but give no component list, so whether
  the drone changed between seasons is not known.
hardware:
  source: src-arxiv-2512-20475-v1
  quote: Teams participating in the competition were given pre-made drones with a fixed hardware
    configuration, with the exception of the camera mounting direction.

# --- Data ------------------------------------------------------------------------------------

data:
  access: invitation-only
  access_basis:
    reason: There is no dataset. Entry is by application and selection -- a demonstration video of
      an autonomous flight, screening, simulated or on-site selection tasks, and qualification on
      the track -- so the organisers decide the field.
    source: src-medianet-a2rl-drone-launch-2024
    quote: All entries will undergo a rigorous selection process to identify the successful
      competing teams.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each season is a new live race on a new track (11 gates in Season 1, 14 in Season 2,
      with new obstacle and mission elements), which for a physical competition is a new evaluation
      by construction.
    source: src-a2rl-blog-drones-season-2
    quote: While speed dominated the focus last year, the 2026 edition will shift toward agility and
      precision.
  data_provenance:
    - real-world-instrument
  data_provenance_note: The scored items are the recorded runs of a live physical race, timed by the
    organisers' RF timing system.
  data_provenance_source: src-arxiv-2601-15222-v1
  data_provenance_quote: are measured using a VTx-based RF timing system
  contamination_risk: low
  contamination_risk_note: A live race on a physical track against the field on the day has no
    stored item set for training data to contain. Teams do practise on the track before the race
    (on-site qualification and practice sessions), which is the protocol, not contamination. No
    source discusses contamination.
  contamination_evidence: []
  ceiling_anchor_type: expert-best
  ceiling_anchor_type_basis:
    reason: The reference the results are read against is the best human FPV pilots, raced head to
      head on the same track. An autonomous drone beat them in Season 1 (MonoRace's 16.56 s run
      against three world-champion pilots); in Season 2 a human pilot won the best-of-nine final
      after the autonomous drone hit a gate.
    source: src-arxiv-2601-15222-v1
    quote: Our controller achieved the fastest completion time of 16.56 s, outperforming three world
      championlevel FPV pilots.
  dataset_licence: null
  dataset_licence_note: There is no dataset; nothing is released.
  size:
    - count: 14
      unit: teams
      subset: Season 1 (2025)
      source: src-a2rl-blog-drones-season-1
      quote: It was 14 global teams
    - count: 11
      unit: gates per lap (two laps in the Grand Challenge, 170 m)
      subset: Season 1 (2025)
      source: src-arxiv-2601-15222-v1
      quote: featured a track with 11 square gates, each with a 1.5 m inner opening
    - count: 4
      unit: race formats
      subset: Season 1 (2025)
      source: src-a2rl-drone-race-page
      quote: Fourteen teams from leading universities, research labs, and startups competed across
        four advanced race formats
    - count: 14
      unit: gates on the track
      subset: Season 2 (2026)
      note: The same line gives "10+ Global Teams" and six human FPV pilots; the exact number of
        teams in Season 2's final is not stated.
      source: src-a2rl-drone-race-page
      quote: 10+ Global Teams 6 Elite Human FPV Pilots 14 Gate AI Racetrack

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: ASPIRE, the innovation acceleration arm of Abu Dhabi's Advanced Technology Research
    Council (ATRC), which owns A2RL; Season 1 was organised with the Drone Champions League (DCL)
  maintainer_basis:
    reason: The home page says A2RL is owned by ASPIRE and part of ATRC; the Season 2 release names
      ASPIRE as organiser. The 2024 launch release and both team papers name the Drone Champions
      League as Season 1's co-organiser; no Season 2 source mentions it.
    source: src-medianet-a2rl-drone-championship-2026
    quote: Organised by ASPIRE, the innovation acceleration arm of the Advanced Technology Research
      Council (ATRC)
  maintainer_type: government-agency
  maintainer_type_basis:
    reason: ASPIRE is an arm of ATRC, and the Technology Innovation Institute's page describes ATRC
      as Abu Dhabi Government's council that oversees technology research in the emirate, which
      makes the holder a public body. The statement is on a sister entity's page, not on A2RL's or
      ASPIRE's own.
    source: src-tii-about-us
    quote: We are part of Abu Dhabi Government
  submission_process: physical-competition
  submission_process_note: Selected teams bring their software to the venue and race the organisers'
    drones on a fixed date; results are the organisers' times and placements, announced in releases
    and blog posts. There is no results table on the site.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-medianet-a2rl-drone-championship-2026
      quote: decisive test of autonomous and human performance, as Technology Innovation Institute
  independence_flags_note: >
    TII Racing, the Technology Innovation Institute's team, won Season 1's multi-drone race and Season
    2's AI Speed Challenge and reached Season 2's Human vs AI final. The institute is part of ATRC (src-tii-about-us),
    and A2RL, owned by ASPIRE, is part of ATRC too (src-a2rl-home), so the organiser's parent council
    fields a competing team. ASPIRE and TII are separate entities; the flag reads "the party maintaining"
    as the ATRC group (see review_checks). prize-sponsored-by-industry is not adopted: the prize pools
    (USD 1 million in Season 1, USD 600,000 in Season 2) are stated with no funder named, and the site's
    partner logos carry no text.
  independence_assessed: true
  participation:
    source: src-a2rl-drone-race-page
    quote: Fourteen teams from leading universities, research labs, and startups competed across
      four advanced race formats

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: physical-venue-entry
  compute_tier_note: Teams travel to Abu Dhabi and fly the organisers' drones at the venue, after an
    on-site selection and weeks of on-track qualification (three weeks in November 2025 for Season
    2). The compute is the drone's onboard Jetson Orin NX; offboard processing is not allowed.
  compute_tier_source: src-arxiv-2512-20475-v1
  compute_tier_quote: (a) Registration, Screening, & Video Evaluation (b) AI Grand Challenge On-site
    1st Qualification On-site 2nd Qualification & Practice Session
  reproducibility_tier: requires-specialized-hardware
  reproducibility_tier_basis:
    reason: A past race cannot be repeated (live-world-state); a fresh run needs the racing drone
      and a gated track in a hall. The drone is built from purchasable parts, but the official one
      is the organisers', which is why the corpus left this tier open (taxonomy failure
      2026-09-28-a2rl-drone-championship-009).
    source: src-arxiv-2512-20475-v1
    quote: The main compute was NVIDIA Jetson Orin NX on a A603 carrier board.
  reproducibility_blockers:
    - live-world-state
    - no-reference-implementation
  reproducibility_blockers_note: The result is a race on a given day, at a given venue, against a
    given field of drones and human pilots. No organiser code, simulator, track specification or
    rulebook is published.
  harness_availability: none
  harness_note: The organisers publish no harness. Season 1's selection used an open-source
    simulator the release does not name, and Season 2's used virtual selection challenges whose
    simulator is not named either; neither produces a result that is reported.
  harness_source: src-medianet-a2rl-drone-launch-2024
  harness_quote: assess the teams' proficiency in using an open-source simulator to fly a drone
    autonomously
  code_licence: null
  code_licence_note: No organiser code is released. MonoRace's and KAIST's papers describe their own
    systems; no team code was checked.
  est_participant_cost_usd: null
  est_participant_cost_usd_note: Teams travel to Abu Dhabi and race supplied drones; no source
    states a cost.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # The physical-trial profile already makes hardware_platform, venue, subset_used and n_samples material. The
  # result depends on the platform -- the organisers' A2RL drone (Season 1: Jetson Orin NX, Arducam IMX219
  # rolling-shutter camera, Foxeer H7 flight controller with an MPU-6000 IMU), listed here for step 2 -- and on
  # the venue and track of the season (subset_used carries the season and race format). simulator and
  # simulator_version are material only to selection-round results: Season 1's simulator is an unnamed
  # open-source one and Season 2's virtual selection names none, so no published race time depends on a
  # simulator build.
  material_extra:
    - hardware_platform
    - simulator
    - simulator_version
  # The AI vs Human heats and the multi-drone races place entrants against the field on the day, so a placement
  # means nothing outside its season's pool.
  rating_pool_required: true


  sources_note: >
    The organiser's drone race page, home page and four blog posts (server-rendered; scripts and styles
    stripped); the organiser's two Business Wire releases as syndicated on Medianet's News Hub (the Business
    Wire host did not answer); the Technology Innovation Institute's "About us" page; and the two team
    papers' v1 PDFs (DOIs, not archived) and abstract pages. The drone page and both releases are withheld
    from archiving because they name individuals (a pilot roster, a media contact); their extracts leave
    the names out.
  confidence: medium
  review_checks:
    - check: Identity. The rules and the platform rest on two competitors' papers, not on any
        organiser rulebook, which is not published. The scoring of the multi-drone races and of the
        Season 2 formats is not specified anywhere read.
      field: task
    - check: Whether Season 2 used the same drone as Season 1. Its sources give the same sensor set
        and "the official A2RL drone design" but no component list; hardware_platform for 2026 is
        unconfirmed.
      field: platform
      source: src-a2rl-blog-drones-season-2-road
      quote: teams must take control of the official A2RL drone design and demonstrate the
        essentials
    - check: maintainer-competes-on-own-benchmark reads ASPIRE and TII, two entities of ATRC, as one
        party. If the flag needs the same organisation, drop it and keep the fact in the note.
      field: governance.independence_flags
      source: src-tii-about-us
      quote: Advanced Technology Research Council, which oversees technology research in the emirate
    - check: government-agency rests on TII's page calling ATRC Abu Dhabi Government's; A2RL's and
        ASPIRE's own pages do not state the legal form. This would resolve taxonomy failure
        2026-09-28-a2rl-drone-championship-006, which a lead should update, not this draft.
      field: governance.maintainer_type
    - check: The drone page's dates are inconsistent. It dates the UMEX 2026 event "21 - 22 January
        2025" and carries the car race's "November 15, 2025, Yas Marina Circuit" banner; the release
        fixes Season 2 as 21-22 January 2026.
      field: versions
      source: src-a2rl-drone-race-page
      quote: 'A2RL Drone Championship Debuts at UMEX Abu Dhabi 2026 Date: 21 - 22 January 2025 Location:
        Hall 10 in ADNEC Centre Abu Dhabi (part of UMEX Abu Dhabi 2026)'
    - check: Season 1's sources disagree on figures. The organiser's blog gives MAVLab 17.225 s over
        22 gates and speeds beyond 150 km/h; MonoRace gives 16.56 s on the organiser's times (its
        Figure 1) and up to 100 km/h; the home page says 130+ km/h.
      field: subsets
      source: src-a2rl-blog-drones-season-1
      quote: The Dutch team MavLab set a blistering 17.225-second time over 22 gates on a 170-meter
        course.
    - check: requires-specialized-hardware versus not-independently-reproducible. The organisers
        supply the drone and set the track, which the tier's test reads as something only the
        maintainer holds; the drone is built from purchasable parts. Taxonomy failure
        2026-09-28-a2rl-drone-championship-009 is still open.
      field: execution.reproducibility_tier
    - check: ceiling_anchor_type expert-best treats the human pilots' head-to-head result as the
        anchor; a time trial has no bound, and the AI vs Human heats are a separate format, so
        none-known is the alternative.
      field: data.ceiling_anchor_type
    - check: ground_truth_source experimental is the closest value for an organiser's RF timing
        system and race order; none of the listed values names a physical race.
      field: ground_truth_source
    - check: The Drone Champions League's role in Season 2 is not stated; whether it still
        co-maintains the series is unknown.
      field: governance.maintainer
    - check: The simulators of the selection rounds are not named (Season 1 "an open-source
        simulator", Season 2 "virtual selection challenges"), so simulator and simulator_version
        cannot be filled for any selection result.
      field: comparability
      source: src-a2rl-blog-drone-season-2-testing
      quote: Teams will compete in a series of performance benchmarks and race simulations to earn
        their place on the final competition grid.

      quote: '"last_eval_at":"2026-09-12T02:24:25.225565Z"'
    policy_servers_up: 5              # of 24; derived from status.is_active on the board
    policy_servers_up_derived: true
    evaluator_concentration:
      largest_org_share_percent: 57.6
      top3_org_share_percent: 79.8
      derived: true                   # from per-organisation counts; organisations not named here

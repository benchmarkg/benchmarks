      maintainer_source: src-roboarena-site-bundle
platform: DROID
hardware:
  source: src-roboarena-arxiv-html
  quote: which consists of a Franka Panda 7DoF robot arm, a Robotiq 2F-85 parallel-jaw gripper, a
    ZED-mini stereo wrist camera and one or multiple external ZED 2 stereo cameras

# --- Data -------------------------------------------------------------------------------------

data:
  access: generated-on-demand
  access_note: >
    There is no evaluation set to access. Items exist only when an evaluator runs them.
    02 S12.2 says fully-open; that describes the evaluation RECORDS, not the items.
  records_access: fully-open
  records_access_source: src-roboarena-hf-api
  records_access_quote: '"gated":false'
  records_licence: MIT
  records_snapshot: 2026-07-17
  refresh: rolling-live
  data_provenance: []   # not yet tagged: the right term, evaluator-improvised, is not in the
                        # vocabulary (02 S11 rule 7); held in tags[] until it is. See _schema_findings
  data_provenance_note: >
    Items are authored on the spot by volunteer evaluators in their own scenes.
    crowd-authored ("non-specialist annotators at scale") and real-world-instrument
    ("recordings captured from physical sensors") each capture half of it.
  contamination_risk: low
  contamination_risk_basis: >
    An item does not exist until an evaluator builds it, which is what the vocabulary means
    by contamination-resistant by construction. Not recorded: whether evaluator scenes
    resemble DROID training scenes, which would be in-distribution rather than contaminated.

# --- Governance -------------------------------------------------------------------------------

governance:
  maintainer_note: >
    The self-description is "community-run", and evaluation is distributed. But ranking,
    the backend, the safety screening and the evaluation budget are run centrally by the
    core team. The evaluator network is distributed; the maintainer is not.
  maintainer_type: community-collective
  maintainer_type_source: src-roboarena-site-bundle
  submission_process: live-arena
  submission_process_note: >
    02 S12.2 says physical-competition, "at a venue on a date". Entrants never ship
    hardware or travel; they host a server. The CoRL 2025 challenge was a dated event
    run on the arena, recorded under `events`.
  independence_flags: []
  independence_flags_note: >
    Empty, not `no-known-conflict`. 02 S12.2 sets maintainer-competes-on-own-benchmark,
    and no source read here establishes it: the paper's HTML carries no affiliations.
  independence_assessed: true
  admission:
    safety_screen: >
      New policy servers pass a format check and a supervised test run before joining the
      evaluation pool.
    source: src-roboarena-arxiv-html
    quote: Only after a policy passed these tests, we add it to the general pool and distribute it
      to evaluators.
  evaluation_budget:
    source: src-roboarena-site-bundle
    quote: You have a weekly budget of policy evaluations, and can get more by contributing
      evaluations yourself!
    comparability_consequence: >
      A policy's sample size depends on its submitter's budget and contributions, which is
      why some rows have 6 evaluations and others 1,000.
  known_limitation:
    source: src-roboarena-arxiv-html
    quote: we have not investigated its robustness to intentionally adversarial evaluators

# --- Execution: the cost depends on which role you play --------------------------------------

execution:
  compute_tier: physical-hardware
  compute_tier_note: >
    A submitter needs no robot; that is the design's point. The tier describes the network,
    not the entrant.
  compute_tier_by_role:
    submitter: null                   # hosting a policy server; GPU class not stated in any source
    evaluator: physical-hardware
  compute_tier_by_role_source: src-roboarena-arxiv-html
  compute_tier_by_role_quote: DROID-RoboArena can enable researchers without access to a physical
    robot to train and evaluate real-world generalist robot policies
  reproducibility_tier: requires-specialized-hardware
  reproducibility_tier_note: >
    Rescoring is possible: the evaluation records are open, so the rating can be refitted
    from the data dump. Rerunning is not: the items were improvised once, on hardware and
    by people outside anyone's control.
  reproducibility_blockers:
    - hardware-fleet
    - human-raters
    - live-world-state
  harness_availability: reference-implementation-only
  harness_note: >
    The repository provides the policy-server interface, a client and simulated
    pre-submission checks. No harness can produce the official score, which exists only
    as the output of the live network.
  harness_source: src-roboarena-readme
  harness_quote: (1) serving your policy via a remote policy server, to make it ready for RoboArena
    evaluation
  code_licence: MIT
  code_licence_source: src-roboarena-gh-api
comparability:
  # P3-S6-T05. The facets resolve, through (physical-trial, physical-robot-system), to the physical-trial profile:
  # hardware_platform, venue, subset_used and n_samples. The task makes simulator, simulator_version,
  # hardware_platform and venue material on the robotics profile. Of the two profiles in
  # taxonomy/comparability-profiles.yaml that carry them, simulation lacks venue and physical-trial lacks the
  # simulator pair, and changing a profile's material set is a vocabulary change that needs an ADR and a migration
  # (scripts/check_schema_change_gate.py). So the four are named here, the per-entry override 04 S8 provides, as
  # casp names human_assistance:
  #   hardware_platform -- every score is a policy on a DROID arm, and the paper leaves other embodiments to
  #     future work; a policy on another body is a different number.
  #   venue -- the A/B evaluations are spread over the evaluators' institutions, and the maintainers publish the
  #     official board refitted with one evaluator organisation removed: the evaluator mix moves the number.
  #   simulator, simulator_version -- the maintainers point submitters to a simulated DROID environment to test a
  #     policy before real-world evaluation; a number from it is not an arena number and must never share a key
  #     with one. A real-robot claim answers both with `none` (a review check asks for a better answer).
  # hardware_platform and venue also come from the profile; naming them keeps all four material if the facets change.
  material_extra:
    - hardware_platform
    - venue
    - simulator
    - simulator_version
  # Added 2026-09-25 with the user's approval (P0-S5-T02). The same fact is stated in the deferred
  # metric block below; this is the field the rating-pool-required rule (02 S11) reads.
  rating_pool_required: true
headline_metric: roboarena-rating
liveness:
  repo_last_commit: 2026-04-28
  leaderboard_last_updated: 2026-11-10
  reproduction_script_present: false
  last_checked: 2026-11-10

homepage: https://robo-arena.github.io/
repository: https://github.com/robo-arena/roboarena
dataset_url: https://huggingface.co/datasets/RoboArena/DataDump_07-17-2026
api_url: https://roboarena-api-domain-name.online/api

# --- Metrics and the missing absolute baseline (P3-S6-T05) ------------------------------------
# The rating pools are data/rating-pools/pool-roboarena-2026-06-10.yaml and pool-roboarena-2026-11-16.yaml: a
# rating claim names one, and the pool carries its snapshot date (comparability.rating_pool_required). A pairwise
# claim names an `opponent` and is valued in roboarena-pairwise-win-rate.

metrics:
  - roboarena-rating
  - roboarena-pairwise-win-rate

baselines:
  # Why no absolute-score Baseline exists, as a record (04 S7, 12 S3.4): taxonomy/ceiling-anchors.yaml carries the
  # absent anchor of a pool-relative rating on the Metric and on a Baseline's value_absent_reason. kind
  # theoretical-maximum names the bound an absolute score would have.
  #
  # The ranked number is a Bradley-Terry-Davidson score fitted to pairwise preferences within one pool: unbounded,
  # and moved by every policy that joins, so no ceiling or floor can be stated on its scale. Nor is there a fixed
  # item set to measure a human, operational or random reference on: each A/B evaluation's task and scene are the
  # evaluator's, shared only by the pair. The one absolute number the network collects, a 0-100 progress score per
  # policy per evaluation, sits on those evaluator-chosen tasks and does not rank. Headroom is null, and the Metric
  # refuses it (requires_pool, unbounded). The notes below keep the gist under the escape-hatch audit's 200
  # characters (docs/schema-stress-audit.md).
  - id: base-roboarena-no-absolute-score
    benchmark_version: roboarena
    kind: theoretical-maximum
    metric: roboarena-rating
    value_absent_reason: not-applicable
    is_primary: true
    source: src-roboarena-site-bundle-2026-11-19
    evidence:
      - source: src-roboarena-site-bundle-2026-11-19
        quote: This uses the same Bradley-Terry Davidson ranking path as the leaderboard
      - source: src-roboarena-site-bundle
        quote: The only requirement is that evaluations are done pairwise, maintaining the same task
          and environment for the policies in the pair.
      - source: src-roboarena-arxiv-html
        quote: that is proportional to the maximum progress a policy achieved on the task
    notes: >
      No absolute anchor exists or can be measured: the rating is a Bradley-Terry-Davidson score within
      one pool, unbounded and with no fixed item set (12 S3.4: relative-rating-only).

tags:                                 # 02 S11 rule 7: the escape hatch for an undefined term
  - evaluator-improvised


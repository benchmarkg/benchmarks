      quote: '"evaluator_organization_count":28'
    policies:
      value: 24
      source: src-roboarena-api-transparency
      quote: '"policy_count":24'
    official_policies:
      value: 9
      derived: true                   # rows with num_evals >= 100 on the API board
      source: src-roboarena-api-leaderboard
    tie_rate_percent:
      value: 14.4
      source: src-roboarena-api-transparency
      quote: '"tie_rate":14.4'
    first_evaluation:
      value: 2025-04-15
      source: src-roboarena-api-transparency
      quote: '"first_eval_at":"2025-04-15'
    last_evaluation:
      value: 2026-09-12

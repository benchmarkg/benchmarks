        pool; tying it to a snapshot needs either its date_reported or a schema change.
      field: metrics
      source: src-roboarena-site-bundle-2026-11-19
      quote: Percentages exclude ties; records are wins-ties-losses.
    - check: The pools name 24 Systems drafted only so that the pools resolve, and their ids are
        proposals (04 S3, id allocation is a human act). The five floppy_bagel rows look like
        checkpoints of one policy and could be versions of one System; apricot, dam and phoenix are
        short global ids for arena-only names; balsomsoc is the site's label for the backend id
        Cosmos3-Nano-Policy, and the site gives the name Cosmos3-Nano-Policy to another backend id,
        so each System keeps the backend id in external_ids.
      source: src-roboarena-site-bundle-2026-11-19
      quote: '"cosmos3-nano-policy":"balsomsoc"'
    - check: Systems' availability follows the board's open_source flag (16, generally-available, by
        the paper's definition of an open-source policy), openpi's README (pi0_droid, pi0_fast_droid
        and pi05_droid, flagged not open_source but downloadable) and, for the five with neither,
        never-released. No weights were looked for; a reviewer confirms each.
      source: src-github-openpi-readme-215abfb
      quote: gs://openpi-assets/checkpoints/pi0_droid
    - check: The paper's own pool (seven policies, 612 comparisons) is not stored as a RatingPool.
        Its policy names map onto the board's backend ids only by inference, and it gives no
        snapshot date of its own.
      source: src-roboarena-arxiv-html
      quote: Through decentralized evaluations of 7 generalist policies across 7 universities and a
        total of 612 pairwise comparisons
    - check: Two pools are stored, the first weekly snapshot and the newest; the 22 between are in
        the same Source body. The scores have not moved since the snapshot of 2026-09-14 (the last
        evaluation the transparency summary showed on 2026-09-23 is dated 2026-09-12), so that
        snapshot and the newest hold the same scores under different dates; which one a claim cites
        is P3-S8-T05's call.
      source: src-roboarena-api-leaderboard-history-2026-11-19
      quote: '"note":"Automatic weekly leaderboard snapshot."'
    - check: roboarena-rating is flagged unbounded and requires_pool, like the three other rating
        metrics, so Metric.headroom_null_reason() answers unbounded-metric, whereas 12 S3.4 and
        P3-S9-T04 name relative-rating-only for RoboArena and unbounded-metric for Kaggle Game
        Arena. The two metrics now carry the same flags; dropping unbounded here would give
        relative-rating-only but the ingest gate refuses a metric with neither a range nor
        unbounded. Which signal separates the two reasons is P3-S9-T02's or a schema decision.
      field: metrics
    - check: The missing absolute anchor is a theoretical-maximum Baseline with value_absent_reason
        not-applicable, because Baseline.kind has no term for an absent anchor. Whether a floor
        record (random-chance, also not-applicable) should sit beside it is open.
      field: baselines
  personal_data_excluded:
    - source: src-roboarena-api-transparency
      what: evaluator account labels (e-mail addresses) and per-account counts

# --- The metric: relative, pool-dependent, and not quite Elo -----------------------------------
# Deferred (Metric and RatingPool). Since P3-S6-T05 the records are data/metrics/roboarena-rating.yaml and
# data/rating-pools/pool-roboarena-*.yaml; this block stays as the Phase-0 record of what they had to hold.

metric:
  kind: relative-rating
  absolute_score: false
  model: Bradley-Terry with Davidson ties
  model_source: src-roboarena-site-bundle
  model_quote: Bradley-Terry Davidson
  paper_model_note: >
    The paper extends Bradley-Terry with latent task buckets fitted by EM, because the task
    changes between comparisons and a plain BT model assumes it does not. The site's chart
    is labelled "Elo score"; the fit is not an online Elo update. The rating scale is
    Elo-like (scores around 1,500-1,800) with a standard deviation per policy.
  paper_model_source: src-roboarena-arxiv-html
  paper_model_quote: assumes that each pairwise comparison in the preference dataset takes place
    under identical conditions. This assumption is not satisfied in the setting of A/B robot policy
    evaluations
  rating_pool_required: true          # a rating means nothing outside its pool and snapshot
  snapshot:
    last_updated: 2026-09-23T18:46:33Z
    source: src-roboarena-api-leaderboard
    quote: '"last_updated":"2026-09-23T18:46:33.415445Z"'
  official_threshold:
    value: 100
    unit: A/B evaluations per policy
    source: src-roboarena-site-bundle
    quote: A/B evals per policy are required for the official leaderboard.
    value_locator: bundle constant `Bn=100`, used in the title string above
  provisional_rows_on_same_board: true
  provisional_note: >
    The API's board mixes official and provisional rows. Its top row (j2-vla, 1788) has 25
    evaluations and is not official; the top official row (dreaming_zebra, shown as
    "DreamZero", 1735) has 190. An ingester that takes row 1 records the wrong leader.
  provisional_source: src-roboarena-site-bundle
  provisional_quote: All policies · includes early results with higher uncertainty.
  ceiling_anchor_type: none-known     # correct, not a gap: a relative rating has no top
  headroom: null                      # forced by the rating being relative (02 S8 guard 4)

# --- Identity of what is ranked ---------------------------------------------------------------

policy_identity:
  # Backend ids are not display names, and one of them is actively misleading.
  aliasing: true
  source: src-roboarena-site-bundle
  quote: f0={dreaming_zebra:"DreamZero","cosmos3-nano-policy":"balsomsoc","j2-vla":"Spirit
    v1.6",yckmtchl:"Cosmos3-Nano-Policy"}
  trap: >
    The backend id `cosmos3-nano-policy` displays as "balsomsoc", and the policy displayed
    as "Cosmos3-Nano-Policy" has the backend id `yckmtchl`. Joining on either string alone
    attaches a rating to the wrong system. Claims must carry both ids.
  linked_paper_example:
    backend_id: dreaming_zebra
    display_name: DreamZero
    source: src-dreamzero-arxiv-abs
    quote: We introduce DreamZero, a World Action Model (WAM) built upon a pretrained video
      diffusion backbone.
  open_source_flag_per_policy: true   # the board carries open_source; the paper planned separate boards
  open_source_source: src-roboarena-arxiv-html
  open_source_quote: We plan to publish separate leaderboards for “all policies” and “open-source
    policies”
# maintenance_status is DERIVED by the probe protocol and may not appear in a hand-written
# file (04 S5); removed by P0-S4-T03. Its raw inputs follow.
maintenance_signals_seen:
  - signal: API leaderboard last_updated 2026-09-23
    source: src-roboarena-api-leaderboard
  - signal: repository pushed_at 2026-04-28, not archived
    source: src-roboarena-gh-api
  - signal: backend repository pushed_at 2026-02-26
    source: src-roboarena-backend-gh-api
  - signal: data dump published 2026-07-17
    source: src-roboarena-hf-api


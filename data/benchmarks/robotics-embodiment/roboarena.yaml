# data/benchmarks/robotics-embodiment/roboarena.yaml
#
# P0-S3-T03. Written from the primary sources below with NO schema in front of the author
# (14-roadmap "Start here", Week 2 item 4). Field names are invented where the entry needed
# them; P0-S5 reconciles them. `_schema_findings` at the bottom is the product of this task.
#
# The site is a single-page app with no server-rendered text. Its prose, its display-name
# table and its API base URL were read from the published JS bundle; the leaderboard and
# the evaluation counts from the public API the site itself calls. Both are `extract: raw`.
#
# PRIVACY. The public transparency endpoint lists evaluator accounts by e-mail address. This
# entry uses only aggregate counts from it. No evaluator name or address appears here, and
# none may be added: 05 S4's "no field without a source" is not a licence to republish
# personal data that a source happens to expose.
#
# 02 S12.2 disagrees with the sources in five places; each is recorded where it bites:
# submission_process, independence_flags, two secondary domains, and the capability list.
#
# P3-S6-T05 (2026-11-19) added the pairwise, sim and embodiment records: the headline Metric
# data/metrics/roboarena-rating.yaml and the pairwise one roboarena-pairwise-win-rate.yaml; two RatingPools,
# data/rating-pools/pool-roboarena-2026-06-10.yaml and pool-roboarena-2026-11-16.yaml, with the 24 Systems they
# name; the four environment fields made material under `comparability`; and the Baseline that records why no
# absolute score has an anchor. Read for it: the API's weekly leaderboard snapshots, a second read of the site
# bundle (its extract above lacks the passages) and openpi's README. tests/test_roboarena.py holds them.

id: roboarena
name: RoboArena
tagline: Robot policies ranked from double-blind A/B trials that volunteer labs run on their own
  tasks and robots.

description: >
  Submitters host a manipulation policy as a remote policy server. Volunteer evaluators at
  institutions with a DROID robot are handed two anonymised policies, choose any task and
  scene they like, run both under the same conditions, and record which they preferred,
  a 0-100 progress score for each, and a free-text explanation. A Bradley-Terry-style model
  with ties aggregates the preferences into a relative rating. There is no task list, no
  fixed test set and no absolute score.

self_description:
  source: src-roboarena-site-bundle
  quote: RoboArena is a community-run, real-world benchmark for evaluating generalist robot
    policies, instantiated currently on the DROID robot platform.
paper:
  title: 'RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies'
  arxiv: '2506.18123'
  version_read: v2
  source: src-roboarena-arxiv-abs

released: 2025-06-22                  # arXiv v1

# --- Taxonomy ---------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/manipulation
  secondary:
    - robotics-embodiment/embodied-instruction-following
  secondary_basis: >
    Each A/B item is a scene plus a language instruction, and the policies are
    language-conditioned.
  secondary_source: src-roboarena-arxiv-html
  secondary_quote: (e.g., a specific scene and language instruction)
domain_considered_and_rejected:
  - term: robotics-embodiment/cross-embodiment-transfer
    reason: One embodiment only. The paper lists cross-embodiment as future work.
    source: src-roboarena-arxiv-html
    quote: the experimental evaluations in this paper have focused on the DROID platform
  - term: robotics-embodiment/sim2real-transfer
    reason: >
      Simulated environments exist for debugging before submission, but nothing scores the
      gap between simulated and real performance.

capability:
  - sensorimotor-control
  - grounding
capability_basis:
  sensorimotor-control: Closed-loop control of a real arm; the score depends on the physical
    outcome.
  grounding: >
    Instructions name objects in a scene the evaluator built, and the preference depends on
    whether the right object was acted on. Weaker than a benchmark that isolates binding;
    reviewer's call.
capability_considered_and_rejected:
  - term: instruction-following
    reason: >
      Its IN clause requires that "the benchmark's own source claims instruction following".
      The sources claim generalist manipulation; compliance is not scored separately from
      task success.
  - term: distribution-shift-generalization
    reason: >
      IN requires inputs "drawn from a deliberately different distribution" with "the
      degradation" reported. Scenes are novel but not deliberately shifted, and nothing
      reports degradation against a training distribution. Closest near-miss.
  - term: long-horizon-execution
    reason: Evaluators pick the task; nothing requires ~10 dependent steps, and most reported tasks
      are single pick-and-place.

evaluation_method:
  - physical-trial
  - pairwise-preference-elo
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: >
      Raters are volunteer evaluators with no stated qualification requirement, and the
      ranked number is a rating fitted to preferences rather than per-output ratings. The
      human judgement is inside pairwise-preference-elo, not beside it. 02 S12.2 tags both.
  - term: human-crowd-eval
    reason: OUT clause, verbatim -- "do NOT tag it where the aggregation is a head-to-head rating
      system".

designed_for_subjects:
  - physical-robot-system
designed_for_subjects_note: >
  rl-policy's OUT clause sends a policy running on hardware to physical-robot-system. But
  here the submitter provides only the policy; the body is the evaluator's, and differs per
  item. The term's own IN clause says "record the hardware: it is part of the system under
  test" -- and the hardware is not the submitter's. The subject is really a remotely served
  policy evaluated on someone else's robot.
designed_for_subjects_considered_and_rejected:
  - term: rl-policy
    reason: Its OUT clause, and most listed policies are VLAs fine-tuned on demonstrations, not RL.
  - term: hosted-inference-endpoint
    reason: >
      Near-miss. Policies are queried as remote servers and the board tracks their uptime,
      so how a policy is served does affect whether it is evaluated at all. But the rating
      is about the policy, not the endpoint.

# --- Lifecycle and activity -------------------------------------------------------------------

lifecycle: active
activity: accepting-submissions
activity_source: src-roboarena-site-bundle
activity_quote: The RoboArena benchmark will be running live through Dec 2026, with potential
  extensions beyond.
planned_end: 2026-12                  # announced, not a closure; "potential extensions beyond"
events:
  - name: CoRL 2025 generalist policy challenge
    kind: competition-on-the-arena    # a timed ranking run on the live arena, not a separate benchmark
    source: src-roboarena-site-bundle
    quote: We will be hosting a generalist policy development challenge as part of CoRL 2025, using
      the RoboArena framework.

# --- Admissibility (04 S5; 00 S6 A5) -- added by P0-S4-T03 with the user's approval ---------
# The learned-entrant test: in scope because at least one entrant is a learned system, and
# the entry cites where that is shown. Quoted from a source this entry already relied on.

learned_entrant_evidence:
  - system: DreamZero                  # ranked on the board as backend id dreaming_zebra
    source: src-dreamzero-arxiv-abs
    observed_on: 2026-09-23
    quote: We introduce DreamZero, a World Action Model (WAM) built upon a pretrained video
      diffusion backbone.
evaluation_target: learned-system

# --- What an "item" is, when there is no task list ---------------------------------------------

task:
  exists: false
  item_definition: >
    One A/B evaluation: a pair of policies, one evaluator, one scene and one language
    instruction chosen by that evaluator, run on that evaluator's robot. Items are not
    stored in advance and are never repeated.
  constraint:
    source: src-roboarena-site-bundle
    quote: The only requirement is that evaluations are done pairwise, maintaining the same task and
      environment for the policies in the pair.
  blinding:
    source: src-roboarena-site-bundle
    quote: Evaluations are double-blind and distributed across institutions.
  task_distribution_drifts: true
  task_distribution_drifts_source: src-roboarena-site-bundle
  task_distribution_drifts_quote: The task distribution can evolve with policy capabilities.
  source: src-roboarena-site-bundle
  quote: instead of standardizing the set of tasks for which all policies are evaluated, we allow
    evaluators to pick

feedback_per_item:
  # Three signals are collected; only one of them drives the leaderboard.
  signals:
    - kind: pairwise preference (binary, ties allowed)
      ranks: true
    - kind: progress score, 0-100 per policy
      ranks: false                    # studied in the paper as an alternative ranker, not the official one
    - kind: free-form language explanation
      ranks: false                    # used to generate qualitative policy reports
  source: src-roboarena-arxiv-html
  quote: that is proportional to the maximum progress a policy achieved on the task (e.g., 0 for no
    progress, 100 for successfully executing the task, intermediate values for partial success)
  quote_note: The paper puts inline math ("∈ [0…100]") mid-sentence; the quote starts after it.

# --- Scale, as of retrieval -------------------------------------------------------------------

scale:
  at_publication:
    source: src-roboarena-arxiv-html
    quote: Through decentralized evaluations of 7 generalist policies across 7 universities and a
      total of 612 pairwise comparisons
    institutions: 7
    policies: 7
    pairwise_comparisons: 612
  live_2026_09_23:
    total_ab_evaluations:
      value: 3994
      source: src-roboarena-api-transparency
      quote: '"total_evals":3994'
    evaluator_organizations:
      value: 28

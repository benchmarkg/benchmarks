# data/benchmarks/robotics-embodiment/humanoidbench.yaml
#
# P1-S5-T02, robotics-embodiment entry 10. Filled from the HumanoidBench paper, arXiv 2403.10506 read as its v2 PDF
# (2024-06-18), and its abstract page; the paper's page in the RSS 2024 proceedings; the project site; the repository
# README, setup.py and LICENSE pinned at commit cb11890; the balance task's code at the v0.1.0 and v0.2.0 tags; and
# the abstract pages of FastDSAC (arXiv 2603.12612), a 2026 paper that reports on it, and of MuJoCo MPC for Humanoid
# Control (arXiv 2408.00342), a non-learned entrant. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.

id: humanoidbench
name: HumanoidBench
tagline: 27 whole-body locomotion and manipulation tasks for a simulated Unitree H1 humanoid with
  dexterous hands, in MuJoCo.
description: >
  A simulated benchmark for learning whole-body humanoid control, from the Robot Learning Lab (RLL) at
  UC Berkeley, with Yonsei University, published at RSS 2024. The robot is a Unitree H1 humanoid with
  two Shadow Hands, simulated in MuJoCo, with 61 position-controlled actuators driven at 50 Hz; models
  of the Unitree G1, Agility Digit, a Robotiq gripper and Unitree hands are also provided. There are 12
  locomotion tasks (walk, run, hurdle, stairs, a maze, balancing on an unstable board and others) and
  15 whole-body manipulation tasks (pushing a box, opening cabinets, unloading a truck, catching and throwing
  a basketball, in-hand cube reorientation, peg insertion and others), 31 environments counting the simple
  and hard variants. Each task has a dense, hand-designed reward and an episode limit of 500 or 1,000
  steps, and the paper reports episode return per task beside a per-task target that marks success qualitatively.
  The default observation is the privileged robot and object state; egocentric cameras and whole-body
  tactile sensing are available but were not benchmarked. The paper's baselines (DreamerV3, TD-MPC2, SAC,
  PPO and a hierarchical policy) stay below the target on most tasks. There is no leaderboard; results
  appear in users' papers.
self_description:
  source: src-arxiv-2403-10506-v2
  quote: we present a high-dimensional, simulated robot learning benchmark, HumanoidBench, featuring
    a humanoid robot equipped with dexterous hands
external_ids:
  arxiv: '2403.10506'
paper:
  title: 'HumanoidBench: Simulated Humanoid Benchmark for Whole-Body Locomotion and Manipulation'
  arxiv: '2403.10506'
  version_read: v2
  source: src-arxiv-2403-10506-v2
released: 2024-03-15
released_note: The paper's first arXiv version, as its abstract page dates it; the repository was
  created on 2024-03-18 (GitHub API) and v2 of the paper followed on 2024-06-18.
released_source: src-arxiv-2403-10506
released_quote: Submitted on 15 Mar 2024 (v1), last revised 18 Jun 2024 (this version, v2)
release_venue: 'Robotics: Science and Systems XX (RSS 2024, Delft)'
release_venue_source: src-rss-2024-p061
release_venue_quote: ADDRESS = {Delft, Netherlands}, MONTH = {July}

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/whole-body-humanoid-control
  secondary:
    - robotics-embodiment/locomotion
    - robotics-embodiment/dexterous-manipulation
domain_basis:
  reason: Every task is scored on a full humanoid whose legs, arms and hands are controlled
    together, and the manipulation tasks are built so that balance and manipulation cannot be
    separated -- the paper's door failure is the robot pulling with its arm without moving its body
    back. taxonomy/domains.yaml gives this benchmark as the family's qualifying example. Locomotion
    is secondary for the 12 locomotion tasks (hurdle, stairs, slides, a pole forest, a tunnel),
    which the paper offers as easier tasks and primitive skills. Dexterous manipulation is secondary
    for the tasks whose difficulty is the hands' degrees of freedom -- in-hand reorientation of two
    cubes, and inserting a peg into two tight blocks.
  source: src-arxiv-2403-10506-v2
  quote: Before learning any manipulation skills, an agent must learn locomotion skills to balance
    and move towards an object or the world to interact.
domain_considered_and_rejected:
  - term: robotics-embodiment/bimanual-manipulation
    reason: Several tasks use both hands (package, insert, cube), but the claim is whole-body
      control of a humanoid, and the paper sets its benchmark apart from bimanual ones; the leaf's
      exclusion covers two arms incidental to another setting.
    source: src-arxiv-2403-10506-v2
    quote: While bimanual manipulation is one of the key objectives of humanoid robots, most
      benchmarks in humanoid research have so far focused on the locomotion challenges
  - term: robotics-embodiment/continuous-control
    reason: The tasks are scored on hand-designed dense rewards, which is near the leaf's
      definition, but the embodiment is the point -- a model of real hardware with real hands --
      which is what separates this benchmark from the family's mujoco-gymnasium near miss.
    source: src-arxiv-2403-10506-v2
    quote: This motivates us to implement a comprehensive simulated humanoid benchmark based on
      real-world hardware
  - term: robotics-embodiment/mobile-manipulation
    reason: Some tasks need the robot to move and manipulate (truck, room, door), but on legs and
      with balance as the difficulty, which whole-body-humanoid-control names more narrowly.
    source: src-arxiv-2403-10506-v2
    quote: 'truck: Unload packages from a truck by moving them onto a platform.'
  - term: robotics-embodiment/navigation
    reason: One task (maze) asks the robot to reach a goal through turns, but from privileged state,
      with nothing to perceive or map.
    source: src-arxiv-2403-10506-v2
    quote: 'maze: Reach the goal position in a maze by taking multiple turns at the intersections.'
  - term: robotics-embodiment/tactile-sensing
    reason: Whole-body tactile sensing (448 taxels) is implemented, but the benchmark's results use
      state observations only, and touch is not the primary input of any scored task.
    source: src-arxiv-2403-10506-v2
    quote: we first focus on the state-based environment setup, where proprioceptive robot states
      and object states are used as the
  - term: robotics-embodiment/sim2real-transfer
    reason: The paper names sim-to-real transfer as future work; nothing is run on hardware.
    source: src-arxiv-2403-10506-v2
    quote: show promise to study sim-toreal transfer in more depth
capability:
  - sensorimotor-control
capability_basis:
  sensorimotor-control:
    reason: A controller issues joint-position targets for 61 actuators at 50 Hz, the simulator
      responds, and the score is the reward the resulting physical behaviour earns.
      taxonomy/capabilities.yaml gives this benchmark as the term's qualifying example.
    source: src-arxiv-2403-10506-v2
    quote: For both position and torque control, the action space is 61-dimensional including the
      two hands, and controlled at 50 Hz.
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: The paper stresses long-horizon tasks, and a fall ends the episode, but the score is a
      return that accumulates over the episode, most tasks are tracking or posture objectives rather
      than sequences of dependent steps, and nothing has to be remembered from earlier in the
      episode under the state-based setup.
    source: src-arxiv-2403-10506-v2
    quote: All the baseline algorithms perform below the success threshold on most tasks,
      particularly struggling on tasks that require long-horizon planning
  - term: sample-efficiency
    reason: The paper reports returns at 10M (DreamerV3, SAC) and 2M (TD-MPC2) environment steps,
      but those budgets came from giving each method about 48 hours of compute; the benchmark fixes
      no step budget at which performance is scored.
    source: src-arxiv-2403-10506-v2
    quote: we ran each of the algorithms for approximately 48 hours, resulting in the visible
      differences in environment steps
  - term: perception
    reason: Egocentric cameras are available, but the benchmarked setup and the README's default
      observation are privileged state, so nothing visual is recovered.
    source: src-github-humanoidbench-readme
    quote: As a default, the environment returns a privileged state of the environment (e.g., robot
      state + environment state).

evaluation_method:
  - episodic-return
evaluation_method_basis:
  reason: Every reported number is a return, the sum of a task's hand-designed rewards over an
    episode (average and maximum returns over three seeds in the appendix tables). No source read
    states a maximum, and the per-task targets mark success qualitatively rather than bounding the
    scale; on stand the best runs (about 930) exceed the target of 800.
  source: src-arxiv-2403-10506-v2
  quote: Returns are computed by summing the rewards at all timesteps of an episode.
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: Episodes run in a simulator, but the reported quantity is not a bounded success or
      partial-credit score; the targets (the dashed lines) only indicate success qualitatively, and
      the tables report returns.
    source: src-arxiv-2403-10506-v2
    quote: The dashed lines qualitatively indicate task success.
designed_for_subjects:
  - rl-policy
  - classical-algorithm
designed_for_subjects_basis:
  reason: The environments are built for trained policies -- the paper's baselines are model-based
    and model-free reinforcement learning and a hierarchical policy over pretrained reaching skills
    -- and the paper says they support any controller, model-based control among them, without
    benchmarking one. A non-learned entrant has since been evaluated, model-predictive control with
    MuJoCo MPC (src-arxiv-2408-00342), which classical-algorithm covers.
  source: src-arxiv-2403-10506-v2
  quote: While we do not benchmark classical model-based control approaches [14, 26] in this work,
    our environments support actions obtained by using any type of controllers.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced, among them FastDSAC's in 2026 (v2 on 2026-05-04), and
    the repository was last pushed on 2025-09-18 (GitHub API).
  source: src-arxiv-2603-12612
  quote: Extensive evaluations on HumanoidBench and a diverse set of continuous control tasks
activity: no-submission-channel
activity_basis:
  reason: The site and the README offer the paper, the code and the baselines' training curves, and
    no leaderboard or submission route; the curves are published so that users can compare without
    re-running the baselines, and results appear in users' papers.
  source: src-github-humanoidbench-readme
  quote: so that comparing with our baselines will not necessarily require re-running them in the
    future

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: FastDSAC
    source: src-arxiv-2603-12612
    observed_on: 2026-11-04
    quote: with gains of 180% and 350% on the challenging Basketball and Balance Hard tasks
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's reward function, computed from the MuJoCo state at every step
  and summed over the episode; there are no stored labels.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The environments, robot models, baseline training code and the paper's training curves are
    released under open licences, and the simulator is open source; a run is reproducible within the
    pinned MuJoCo build and the package version (see execution).
  source: src-github-humanoidbench-readme
  quote: This repo contains the code for environments and training.

task:
  exists: true
  input:
    - the robot's joint positions and velocities and, per task, object poses and velocities (151
      dimensions for the robot with two hands, before task observations); egocentric images and
      tactile readings are optional
  output: Joint-position targets (or torques) for 61 actuators, normalised to [-1, 1], at 50 Hz
    until the episode ends -- after 500 or 1,000 steps, on a fall, or on task completion.
  scoring: Per task, the episode return under the task's own reward, reported in the paper as the
    mean and standard deviation over three seeds of the average or the maximum return at a training
    budget, beside a per-task target that marks success qualitatively.
  source: src-arxiv-2403-10506-v2
  quote: We report the mean and standard deviation of maximum episode returns over three seeds.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: There is no dataset; the environments, assets and reward code are installed from the
      public repository with pip, without an account.
    source: src-github-humanoidbench-readme
    quote: This repo contains the code for environments and training.
  refresh: versioned-releases
  refresh_basis:
    reason: The task list has been fixed since release, but the package moved from version 0.1 to
      0.2 (tags v0.1.0 and v0.2.0, 2024) and the balance tasks' reward and board geometry changed
      between them under the same -v0 environment ids, so which package version a result used
      matters (see versions).
    source: src-github-humanoidbench-balance-v0-2-0
    quote: bounds=(_STAND_HEIGHT + 0.37, float("inf")),
  data_provenance:
    - simulation-generated
  data_provenance_note: Episodes and their rewards are computed in MuJoCo from hand-written reward
    functions; the robot models adapt Unitree's H1 model and the Shadow Hand models from MuJoCo
    Menagerie. No human demonstrations are provided.
  data_provenance_source: src-arxiv-2403-10506-v2
  data_provenance_quote: We simulate this humanoid robot using MuJoCo [60] adapting the Unitree H1
    model provided by Unitree
  contamination_risk: unknown
  contamination_risk_note: Scoring is closed-loop with randomised initial states and nothing to
    memorise from a stored set; training in the environment is the protocol. Not assessed is the
    reward-shaping concern MuJoCo MPC's authors raise, that the rewards admit unrealistic optimal
    behaviour, which is a validity question rather than contamination.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: Returns have no stated maximum. The paper's per-task targets (700 for
    walk, 12,000 for reach, 4 for kitchen) are hand-set success thresholds that the best runs exceed
    on some tasks, not measured performance of a reference, so they are not an anchor of any listed
    type.
  ceiling_anchor_type_source: src-arxiv-2403-10506-v2
  ceiling_anchor_type_quote: Target 700.0 800.0 700.0 12000.0
  dataset_licence: null
  dataset_licence_note: There is no dataset. The robot models keep their component licences, which
    the repository's LICENSE appends (BSD-3-Clause for the Unitree models, Apache-2.0 for the Shadow
    Hand models, the Robotiq terms for the gripper).
  size:
    - count: 27
      unit: tasks (12 locomotion, 15 whole-body manipulation)
      source: src-arxiv-2403-10506-v2
      quote: We benchmark 27 tasks, consisting of 12 locomotion tasks and 15 distinct manipulation
        tasks
    - count: 31
      unit: environments in the main benchmark list (the 27 tasks with simple and hard variants of
        sit, balance, bookshelf and insert)
      subset: Main Benchmark Tasks (h1hand)
      note: Counted from the README's list, which runs from h1hand-walk-v0 to h1hand-insert_small-v0
        (highbar as h1strong-highbar_hard-v0); the paper's appendix tables have the same 31 columns.
      source: src-github-humanoidbench-readme
      quote: Main Benchmark Tasks

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Robot Learning Lab (RLL), UC Berkeley
  maintainer_basis:
    reason: The package names RLL at UC Berkeley as its author and the LICENSE holds the copyright
      for the lab; the code sits in the first author's personal GitHub account
      (carlosferrazza/humanoid-bench), and the LICENSE has placed it in the BAIR Commons repository
      since 2025.
    source: src-github-humanoidbench-setup
    quote: author="RLL at UC Berkeley",
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: No leaderboard, results page or route for outside results; the
    maintainers publish their baselines' training curves as JSON files for comparison, and users
    report in their own papers.
  independence_flags: []
  independence_flags_note: None recorded. With no ranking there is no board for the maintainers to
    compete on, although they do report their own later methods on it, as anyone does. The paper's
    acknowledgments name industrial support (the BAIR Industrial Consortium, Komatsu), neither an
    evaluated party in the sources read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: MuJoCo, pinned at 3.1.6 (with mujoco-mjx 3.1.6, gymnasium 0.29.1 and dm_control
    1.0.20) in setup.py at package version 0.2 and at the v0.1.0 tag; the first commit left it
    unpinned. A full environment steps at over 1,000 frames per second on one CPU (550 with tactile
    meshes), but training a policy is the cost -- the paper's baselines ran about 48 hours per task
    and seed, and its low-level reaching skills were pretrained on GPU with MuJoCo MJX.
  compute_tier_source: src-github-humanoidbench-setup
  compute_tier_quote: '"mujoco==3.1.6",'
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside MuJoCo, and the return depends on the MuJoCo
      build and on the package version that defines the task's reward.
    source: src-arxiv-2403-10506-v2
    quote: The simulation environment of HumanoidBench uses the MuJoCo [60] physics engine.
  reproducibility_blockers:
    - specific-simulator-build
  reproducibility_blockers_note: A return is defined by the MuJoCo build (3.1.6 pinned since mid
    2024) and by the humanoid_bench package version, whose balance rewards changed between 0.1 and
    0.2 under unchanged environment ids; GPU-parallel ports used by later papers are further builds
    whose equivalence no source read establishes.
  harness_availability: official-harness
  harness: humanoid_bench (Gymnasium environments h1hand-<task>-v0, whose reward functions compute
    the score), with the paper's baseline training scripts
  harness_source: src-github-humanoidbench-readme
  harness_quote: This repo contains the code for environments and training.
  code_licence: MIT
  code_licence_note: The LICENSE is MIT for the HumanoidBench code, followed by the licences of the
    adapted components (MIT for jaxrl_m, DreamerV3, TD-MPC2 and the Digit models, Apache-2.0 for
    purejaxrl, the Shadow Hand models and MuJoCo, BSD-3-Clause for the Unitree models, and the
    Robotiq terms). GitHub's licence metadata reports NOASSERTION for the composite file (read
    2026-11-04).
  code_licence_source: src-github-humanoidbench-license
  code_licence_quote: Copyright (c) 2024 Robot Learning Lab (RLL) lab @ UC Berkeley
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile (simulator, simulator_version, subset_used, selection_strategy, n_samples):
  # the return is defined inside one MuJoCo build (3.1.6 in setup.py since 2024) and one humanoid_bench package
  # version (0.1 or 0.2, whose balance rewards differ), recorded as simulator, simulator_version and harness. Also
  # material: the training budget and data the policy had (environment steps, pretrained low-level skills,
  # demonstrations), and whether the average or the maximum return is reported (selection_strategy).
  material_extra:
    - simulator
    - simulator_version
    - harness
    - training_data_policy

homepage: https://humanoid-bench.github.io/
repository: https://github.com/carlosferrazza/humanoid-bench

versions:
  - version: '0.1'
    label: humanoid_bench 0.1 (first commit 2024-03-18 to tag v0.1.0)
    version_kind: revision
    released: 2024-03-18
    items: 31
    changes: The release the paper's results were produced with; 31 Unitree H1 environments with
      hands. MuJoCo was unpinned at the first commit and pinned at 3.1.6 by the v0.1.0 tag.
    superseded_by: '0.2'
    frozen: true
    sources:
      - src-github-humanoidbench-balance-v0-1-0
      - src-arxiv-2403-10506
  - version: '0.2'
    label: humanoid_bench 0.2 (tag v0.2.0, 2024-07-02; current main)
    version_kind: revision
    released: 2024-07-02
    items: 31
    changes: Adds the Unitree G1 environments and nested observation wrappers; changes the balance
      tasks' head-height bound and board geometry under the same environment ids.
    breaking: true
    supersedes_version: '0.1'
    frozen: false
    sources:
      - src-github-humanoidbench-balance-v0-2-0
      - src-github-humanoidbench-setup

tags:
  - humanoid
  - whole-body-control
  - locomotion
  - dexterous-manipulation
  - simulation
  - mujoco
  - reinforcement-learning

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2403-10506-v2
    - src-arxiv-2403-10506
    - src-rss-2024-p061
    - src-humanoidbench-site
    - src-github-humanoidbench-readme
    - src-github-humanoidbench-setup
    - src-github-humanoidbench-license
    - src-github-humanoidbench-balance-v0-1-0
    - src-github-humanoidbench-balance-v0-2-0
    - src-arxiv-2603-12612
    - src-arxiv-2408-00342
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its v1 PDF read for comparison; its abstract
    page for the dates; the RSS 2024 proceedings page for the venue; the project site with scripts and
    styles stripped; the README, setup.py and LICENSE at commit cb11890 and the balance task code at the
    v0.1.0 and v0.2.0 tags; and the abstract pages of FastDSAC, as evidence of current use, and of MuJoCo
    MPC for Humanoid Control, as a non-learned entrant. GitHub's compare view, which robots.txt disallows,
    was not used; tag and commit dates come from the GitHub API.
  confidence: medium
  review_checks:
    - check: evaluation_method is episodic-return because the paper reports returns with no stated
        maximum. Many tasks' per-step rewards lie in [0, 1] over a fixed 1,000-step limit, which
        would bound them, and later papers may report success against the targets instead;
        simulation-rollout is the alternative, and it changes no comparability profile.
      field: evaluation_method
      source: src-arxiv-2403-10506-v2
      quote: Returns are computed by summing the rewards at all timesteps of an episode.
    - check: dexterous-manipulation is secondary on three of 31 environments (cube, insert_small,
        insert_normal) and on the hands being part of every task; dropping it, leaving locomotion as
        the only secondary, is the alternative.
      field: domain
      source: src-arxiv-2403-10506-v2
      quote: 'cube: Manipulate two cubes in-hand until they both reach a randomly initialized target orientation.'
    - check: The 0.1 and 0.2 package versions are modelled as revisions with the same 31 items; the
        tags and their dates come from the GitHub API, not a quoted Source, and the 0.1 entry's
        released date is the repository's first commit. Whether a balance-reward change under
        unchanged ids merits versions at all, or only an erratum, is a modelling call.
      field: versions
      source: src-github-humanoidbench-balance-v0-1-0
      quote: bounds=(_STAND_HEIGHT + 0.35, float("inf")),
    - check: Which MuJoCo version produced the paper's results is not stated; the first commit
        (2024-03-18) left mujoco unpinned, and the 3.1.6 pin appears by the v0.1.0 tag (2024-06-29).
      field: execution.compute_tier_note
      source: src-github-humanoidbench-setup
      quote: '"mujoco==3.1.6",'
    - check: Later papers often run HumanoidBench through GPU-parallel reimplementations rather than
        this package; whether those are the same benchmark (and should be lineage forks) was not
        checked.
      field: execution.reproducibility_blockers
    - check: The MuJoCo MPC paper finds the sparse rewards produce unrealistic behaviour when
        optimised and adds regularisation terms, so a return can rise without the intended
        behaviour; a construct-validity note for a reviewer, not a field.
      field: data.contamination_risk_note
      source: src-arxiv-2408-00342
      quote: We find that sparse reward functions of HumanoidBench yield undesirable and unrealistic
        behaviors when optimized
    - check: classical-algorithm rests on the paper's statement that any controller is supported and
        on one non-learned entrant (MuJoCo MPC, 2024), which evaluated a subset of tasks with its
        own regularised reward.
      field: designed_for_subjects
      source: src-arxiv-2408-00342
      quote: Current evaluations on a subset of tasks
    - check: maintainer_type academic-lab rests on setup.py and the LICENSE naming RLL at UC
        Berkeley; the code sits in the first author's personal account, so individual is the
        alternative if the lab does not maintain it. The 2025 BAIR Commons line in the LICENSE was
        not followed up.
      field: governance.maintainer_type
      source: src-github-humanoidbench-license
      quote: This software is part of the BAIR Commons HIC Repository as of calendar year 2025.
    - check: The site says 27 tasks and is the homepage here; the README links a copy on the first
        author's personal domain, which was not read.
      field: homepage
      source: src-humanoidbench-site
      quote: HumanoidBench is the first-of-its-kind simulated humanoid robot benchmark, including 27
        distinct whole-body control tasks

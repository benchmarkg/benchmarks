  - simulation
  - gpu-parallel-simulation

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2206-08686-v2
    - src-arxiv-2206-08686
    - src-crossref-10-52202-068431-0372
    - src-pubmed-38051620
    - src-github-dexteroushands-readme
    - src-nvidia-isaac-gym
    - src-arxiv-2505-20922
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the dates and the licence;
    Crossref's record of the NeurIPS proceedings version for its DOI; PubMed's record of the TPAMI journal
    version for its citation and abstract (the full text is paywalled); the README at main (commit dc41afd);
    NVIDIA's Isaac Gym page with scripts and styles stripped; and DIMA's abstract page as evidence of
    current use.
  confidence: medium
  review_checks:
    - check: Primary is dexterous-manipulation with bimanual-manipulation secondary. The bimanual
        leaf's inclusion test fits as well (the claim is coordinated two-hand manipulation on tasks
        built for two hands), but its definition says two arms and the hands here have no arm; a
        reviewer may prefer bimanual primary.
      field: domain
      source: src-arxiv-2206-08686-v2
      quote: Another undeveloped area is bimanual manipulation
    - check: Much of the 2025 use is as a MARL algorithm testbed beside MAMuJoCo, the community the
        family's mujoco-gymnasium near miss excludes. The entry stays in robotics because the tasks
        are semantic manipulation goals on a human-like hand; continuous-control as a secondary leaf
        is the alternative.
      field: domain
      source: src-arxiv-2505-20922
      quote: significantly outperforming prior world models in terms of final return and sample
        efficiency, including MAMuJoCo and Bi-DexHands
    - check: evaluation_method is episodic-return because the paper reports rewards. The README
        marks a success metric for all tasks as done, which would add simulation-rollout; whether
        later papers report success rates or rewards was not surveyed.
      field: evaluation_method
      source: src-github-dexteroushands-readme
      quote: Success Metric for all tasks
    - check: multi-agent-system is a designed subject although the paper says the multi-agent
        setting is completely inferable from the single-agent one and that PPO beats HAPPO and MAPPO
        in most cases; collaboration was rejected on the same grounds. rl-policy alone is the
        alternative.
      field: designed_for_subjects
      source: src-arxiv-2206-08686-v2
      quote: PPO algorithm is still better than HAPPO, MAPPO algorithms in most cases
    - check: transfer-learning rests on the ML4 and ML20 categories, a minor part of the paper; the
        headline per-task results carry no transfer.
      field: capability
      source: src-arxiv-2206-08686-v2
      quote: existing RL algorithms fail to work in most of the multi-task and the few-shot learning
        settings
    - check: Versions. The IEEE TPAMI journal version (2024, a different author list) was read only
        as its PubMed abstract, which keeps the 20 tasks, so it is not modelled as a version; the
        code changed without tags (visual observations, success metric, re-packaging). If the
        journal version changed tasks or protocol it should become a revision, and refresh would
        move from static.
      field: versions
      source: src-pubmed-38051620
      quote: IEEE Trans Pattern Anal Mach Intell. 2024 May;46(5):2804-2818.
    - check: lifecycle active rests on one 2025 paper (DIMA). The repository has not been pushed
        since 2025-02-18 and Isaac Gym is deprecated legacy software, so mature or dormant are the
        alternatives within a year; no 2026 use was searched beyond one web search.
      field: lifecycle
      source: src-nvidia-isaac-gym
      quote: 'Isaac Gym - Now Deprecated Note: This is legacy software.'
    - check: The abstract calls the task count "tens" and the conclusion "more than twenty", while
        the results and the journal abstract give 20 and the README table lists 16 task names beside
        20 result figures; data.size takes 20. The 2,000-object count is the README's.
      field: data.size
      source: src-arxiv-2206-08686-v2
      quote: We follow the principle of Fine Motor Subtest (FMS) [20] to design tens of tasks
    - check: The paper writes "Issac Gym" and names no build; the build comes from the README alone,
        which supports two previews whose physics differ.
      field: comparability.material_extra
      source: src-arxiv-2206-08686-v2
      quote: We built Bi-DexHands in the Issac Gym

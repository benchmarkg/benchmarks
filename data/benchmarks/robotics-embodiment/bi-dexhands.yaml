# data/benchmarks/robotics-embodiment/bi-dexhands.yaml
#
# P1-S5-T02, robotics-embodiment entry 17. Filled from the Bi-DexHands paper, arXiv 2206.08686 read as its v2 PDF
# (2022-10-11, NeurIPS 2022 Datasets and Benchmarks), and its abstract page; Crossref's record of the NeurIPS
# proceedings version; PubMed's record of the IEEE TPAMI journal version (2024), whose full text was not read; the
# repository README at main (commit dc41afd); NVIDIA's Isaac Gym page, for the simulator's status; and the abstract
# page of DIMA (arXiv 2505.20922), a 2025 paper that reports on it. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.

id: bi-dexhands
name: Bi-DexHands
aliases:
  - Bimanual Dexterous Hands Benchmark
  - DexterousHands
tagline: 20 bimanual tasks for two simulated Shadow Hands in Isaac Gym, for single-agent,
  multi-agent, offline and meta RL.
description: >
  A reinforcement-learning benchmark for bimanual dexterous manipulation from Peking University (the PKU-MARL
  group), built in NVIDIA's Isaac Gym. Two simulated Shadow Hands (24 degrees of freedom each, on a fixed
  base or with a movable base in some tasks) perform 20 tasks designed after the Fine Motor Subtest of
  infant development, from pushing a block (5-6 months) to catching an object thrown underarm or pouring
  water (48 months) and swapping two objects between the hands, with objects drawn from YCB and SAPIEN.
  Each task has a goal-based dense reward. The paper benchmarks five formulations on the same tasks: single-agent
  RL, multi-agent RL (each hand, or any grouping of fingers and palms, as an agent in a fully cooperative
  game with one shared reward), offline RL on collected datasets, and multi-task and meta RL categories
  modelled on Meta-World (MT1, MT4, MT20, ML1, ML4, ML20). Results are learning curves of episode reward
  over 100M environment steps with 2,048 parallel environments, averaged over 10 trials, and normalised
  scores for the offline and generalisation settings; the README later added a success metric for every
  task. A journal version appeared in IEEE TPAMI in 2024. There is no leaderboard; results appear in users'
  papers.
self_description:
  source: src-arxiv-2206-08686-v2
  quote: we propose the Bimanual Dexterous Hands Benchmark (Bi-DexHands), a simulator that involves
    two dexterous hands with tens of bimanual manipulation tasks and thousands of target objects
external_ids:
  arxiv: '2206.08686'
paper:
  title: Towards Human-Level Bimanual Dexterous Manipulation with Reinforcement Learning
  arxiv: '2206.08686'
  doi: 10.52202/068431-0372
  version_read: v2
  source: src-arxiv-2206-08686-v2
released: 2022-06-17
released_note: The paper's first arXiv version, as its abstract page dates it; v2, the NeurIPS 2022
  version, followed on 2022-10-11. The repository was created on 2022-03-30 (GitHub API), before the
  paper.
released_source: src-arxiv-2206-08686
released_quote: Submitted on 17 Jun 2022 (v1), last revised 11 Oct 2022 (this version, v2)
release_venue: NeurIPS 2022 Track on Datasets and Benchmarks; a journal version in IEEE TPAMI 46(5),
  2024
release_venue_source: src-arxiv-2206-08686-v2
release_venue_quote: 36th Conference on Neural Information Processing Systems (NeurIPS 2022) Track
  on Datasets and Benchmarks

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/dexterous-manipulation
  secondary:
    - robotics-embodiment/bimanual-manipulation
domain_basis:
  reason: Every task is manipulation by two simulated Shadow Hands, 24-DoF hands with 20 actuated
    tendon pairs each, and the paper places the difficulty in the high-dimensional actuation and the
    contact-rich model, which is the dexterous leaf's case. The benchmark's claim is also two-hand
    cooperation on tasks specified for the dual-hand embodiment (handing over, swapping two objects,
    holding a bottle in one hand and twisting its cap with the other), which the bimanual leaf
    records as secondary; it is not primary because its definition is two coordinated arms, and
    these hands sit on fixed or constrained floating bases with no arm (see review_checks).
  source: src-arxiv-2206-08686-v2
  quote: such dexterous manipulation remains a challenging problem because of the high dimensional
    actuation space and contact-rich model
domain_considered_and_rejected:
  - term: robotics-embodiment/continuous-control
    reason: Much of the benchmark's use is as a testbed for RL and MARL algorithms beside MAMuJoCo,
      the community the family's mujoco-gymnasium near miss describes. But each task is a semantic
      manipulation goal (open a door, lift a pot, stack blocks) on a named, human-like hand, and the
      paper's claim is human-level dexterity, so the embodiment is the point, which keeps the entry
      under manipulation rather than control in the abstract.
    source: src-arxiv-2206-08686-v2
    quote: Our environments focus on the application of RL algorithms to dexterous hand control
  - term: robotics-embodiment/manipulation
    reason: The leaf's distinction sends tasks whose difficulty is the degrees of freedom to
      dexterous-manipulation; no task uses a parallel gripper.
  - term: robotics-embodiment/sim2real-transfer
    reason: Transfer to real hands is named as future work; nothing the benchmark scores runs on
      hardware.
    source: src-arxiv-2206-08686-v2
    quote: We would like address the sim-to-real gap by transferring the simulation result on real
      dexterous hands.

capability:
  - sensorimotor-control
  - transfer-learning
capability_basis:
  sensorimotor-control:
    reason: A policy issues joint-position targets to two simulated hands at 30 Hz in closed loop,
      the simulator responds, and the reward depends on where the object ends up relative to its
      goal.
    source: src-arxiv-2206-08686-v2
    quote: For object-catching tasks, our reward is simply related to the difference between the
      pose of the object and the target.
  transfer-learning:
    reason: The meta-RL categories ML4 and ML20 train on 3 and 15 tasks and score adaptation to 1
      and 5 held-out tasks, with train and test rewards reported separately; the test tasks are
      different tasks, not resampled goals, which is transfer-learning rather than distribution
      shift. ML1 and the multi-task categories vary only goals or train on all tasks, and do not
      carry the term.
    source: src-arxiv-2206-08686-v2
    quote: ML4 and ML20 are categories for learning meta-policies in 3&15 tasks respectively and
      hoping to adapt to new 1&5 testing tasks.
capability_considered_and_rejected:
  - term: collaboration
    reason: The multi-agent formulation splits the hands into agents, but it is a fully cooperative
      game with one shared reward that the paper says is completely inferable from the single-agent
      setting, and single-agent PPO controlling both hands is the strongest baseline. The
      coordination scored is one robot's two hands, recorded by the bimanual leaf, not agents
      working towards a shared outcome.
    source: src-arxiv-2206-08686-v2
    quote: Therefore, the setting of multi-agent can be completely inferred from the setting of
      single-agent.
  - term: sample-efficiency
    reason: The baselines run 100M environment steps with 2,048 parallel environments, but that is
      the authors' training configuration; the benchmark fixes no budget at which entrants are
      scored.
    source: src-github-dexteroushands-readme
    quote: All baselines are run under the parameters of `2048 num_env` and `100M total_step`.
  - term: distribution-shift-generalization
    reason: Every episode resets the object's start and goal poses at random, and objects can be
      swapped within a category; no score on deliberately shifted inputs is reported. ML1's held-out
      goals within one task are resampled goals, an ordinary split.
    source: src-arxiv-2206-08686-v2
    quote: All environments are goal-based

evaluation_method:
  - episodic-return
evaluation_method_basis:
  reason: The reported numbers are episode rewards -- learning curves for the 20 tasks, average
    reward for the multi-task and meta categories -- and offline scores normalised so that 100 is
    the expert policy's return, a reference that can be exceeded. The dense rewards have no stated
    maximum.
  source: src-arxiv-2206-08686-v2
  quote: The average reward for each training is shown in Table 4.
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: The README's plan marks a success metric for all tasks as done, which would be a bounded
      outcome, but the paper reports rewards, and the README's own baseline figures are reward
      curves; which metric later users report was not surveyed (see review_checks).
    source: src-github-dexteroushands-readme
    quote: Success Metric for all tasks
designed_for_subjects:
  - rl-policy
  - multi-agent-system
designed_for_subjects_basis:
  reason: The tasks are built for policies trained by reinforcement learning, with single-agent
    (PPO, TRPO, SAC), offline (BCQ, TD3+BC, IQL), multi-task and meta baselines. Multi-agent
    learners are a designed entrant of their own -- the README offers MARL algorithms (HAPPO,
    HATRPO, MAPPO, IPPO, MADDPG) and the paper runs each hand as an agent -- whose joint behaviour
    is what the shared reward scores.
  source: src-arxiv-2206-08686-v2
  quote: Note that the experiments of MARL algorithms run based on two agents, which means each hand
    represents an agent.
as_used:
  - protocol: A multi-agent RL testbed beside MAMuJoCo, for comparing MARL methods (here world
      models) by final return and sample efficiency.
    source: src-arxiv-2505-20922
    quote: significantly outperforming prior world models in terms of final return and sample
      efficiency, including MAMuJoCo and Bi-DexHands

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced, among them DIMA's (NeurIPS 2025). The repository was
    last pushed on 2025-02-18 (GitHub API), and its simulator is deprecated by NVIDIA (see
    execution.harness_gotcha), so mature or dormant may soon fit better (see review_checks).
  source: src-arxiv-2505-20922
  quote: significantly outperforming prior world models in terms of final return and sample
    efficiency, including MAMuJoCo and Bi-DexHands
activity: no-submission-channel
activity_basis:
  reason: The README offers code, tasks, baselines, offline datasets and plotting scripts, and no
    leaderboard or submission route; results appear in users' papers.
  source: src-github-dexteroushands-readme
  quote: To load a trained model and only perform inference (no training), pass `--test`

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DIMA (Diffusion-Inspired Multi-Agent world model)
    source: src-arxiv-2505-20922
    observed_on: 2026-11-04
    quote: significantly outperforming prior world models in terms of final return and sample
      efficiency, including MAMuJoCo and Bi-DexHands
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's dense reward, computed by the task code from the simulated
  hands', object's and goal's poses.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Tasks, algorithms and training and test scripts are released under Apache-2.0, and the
    paper's offline datasets are linked from the README; Isaac Gym itself must be obtained from
    NVIDIA (execution.harness_gotcha).
  source: src-github-dexteroushands-readme
  quote: Bi-DexHands has an Apache license, as found in the [LICENSE](LICENSE) file.

task:
  exists: true
  input:
    - joint, fingertip, velocity and force state of both hands with the object's and goal's poses
      (up to about 400 dimensions); point-cloud and visual observations optional
  output: Relative joint-position targets for the actuated joints of both hands (and the base in
    some tasks), up to 40 dimensions per hand, from one policy or from several agents.
  scoring: Per task, episode reward over training (curves over 100M steps, 10 trials); for offline
    RL, return normalised between random (0) and expert (100); for multi-task and meta RL, average
    reward on training and test tasks.
  source: src-arxiv-2206-08686-v2
  quote: The shaded region represents the standard deviation of the score over 10 trials.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The task code, assets and algorithms install from the public repository and the offline
      datasets download from links in the README, with no account. Isaac Gym, which the tasks need,
      is NVIDIA's separate download (execution.harness_gotcha).
    source: src-github-dexteroushands-readme
    quote: 'The originally collected data in our paper is available at:'
  refresh: static
  refresh_basis:
    reason: The 20 tasks of the NeurIPS paper are the 20 of the 2024 journal abstract. The code has
      changed since without version labels (visual observations for all tasks in 2022-11, a success
      metric, a re-packaging in 2023-02), and the repository has no tags or releases (GitHub API).
    source: src-pubmed-38051620
    quote: a simulator with two dexterous hands featuring 20 bimanual manipulation tasks and
      thousands of target objects
  data_provenance:
    - simulation-generated
  data_provenance_note: Episodes and rewards are computed in Isaac Gym over hand and object models
    (Shadow Hand; YCB and SAPIEN objects); the offline datasets are rollouts of PPO policies at
    random, medium and expert stages, collected as D4RL does for MuJoCo.
  data_provenance_source: src-arxiv-2206-08686-v2
  data_provenance_quote: The data collection follows that in D4RL-MuJoCo [68]
  contamination_risk: low
  contamination_risk_note: Scoring is closed-loop with start and goal poses resampled every episode,
    and policies are trained on the environment itself by design, so there is no stored test set to
    leak; the offline datasets are training material for the offline setting.
  contamination_evidence: []
  dataset_licence: Apache-2.0
  dataset_licence_note: The README licenses the repository, which holds the tasks and assets, under
    Apache; the offline datasets hosted on Peking University's disk state no licence of their own,
    and the YCB and SAPIEN objects keep their own terms.
  dataset_licence_source: src-github-dexteroushands-readme
  dataset_licence_quote: Bi-DexHands has an Apache license, as found in the [LICENSE](LICENSE) file.
  size:
    - count: 20
      unit: tasks
      source: src-arxiv-2206-08686-v2
      quote: Learning curves for all 20 tasks.
    - count: 6
      unit: multi-task and meta-RL categories (MT1, MT4, MT20, ML1, ML4, ML20)
      subset: multi-task and meta RL
      source: src-arxiv-2206-08686-v2
      quote: MT20 uses all of our 20 tasks.
    - count: 2000
      unit: target objects (more than 2,000, from YCB and SAPIEN)
      source: src-github-dexteroushands-readme
      quote: dataset (>2,000 objects)

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: PKU-MARL, Yaodong Yang's group at the Institute for AI, Peking University
  maintainer_basis:
    reason: The repository sits in the PKU-MARL organisation, and the README's team section names
      Peking University; the paper's authors are mostly at Peking University's Institute for AI,
      with the Beijing Institute for General Artificial Intelligence, UCL and CMU.
    source: src-github-dexteroushands-readme
    quote: Organization-PKU_MARL
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results page; the README's baseline figures are the
    authors' own runs, and later results appear in independent papers.
  independence_flags: []
  independence_flags_note: None recorded. With no ranking there is no board for the maintainers to
    compete on. The journal version acknowledges Chinese public funders (Crossref's TPAMI record,
    not a cited Source), none an evaluated party. NVIDIA supplies the simulator and is not an
    evaluated party.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: NVIDIA Isaac Gym, standalone Preview Release 3 or 4 (PhysX), on an NVIDIA GPU
    under Linux; the paper names Isaac Gym without a build, and Preview 4 changed the physics,
    aligning its PhysX with Omniverse Isaac Sim 2022.1 (src-nvidia-isaac-gym), so runs on the two
    previews need not match. The paper's runs used one RTX 3090 ("All of our experiments are run
    with Intel i7-9700K CPU @ 3.60GHz and NVIDIA RTX 3090 GPU"), at 20,000 to 35,000 frames per
    second with state observations; point-cloud input fits at most 256 parallel environments.
  compute_tier_source: src-github-dexteroushands-readme
  compute_tier_quote: We currently support the `Preview Release 3/4` version of IsaacGym.
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: Training and testing run end to end from the repository's scripts, but only inside Isaac
      Gym, which the README pins to its Preview Release 3 or 4.
    source: src-arxiv-2206-08686-v2
    quote: Building on the Isaac Gym simulator, Bi-DexHands supports running thousands of
      environments simultaneously.
  reproducibility_blockers:
    - specific-simulator-build
  reproducibility_blockers_note: The tasks exist only for Isaac Gym's standalone preview builds,
    which NVIDIA no longer supports; the README tests them on Ubuntu 18.04/20.04 with Python 3.7/3.8
    and reports PhysX collision bugs that can crash long runs ("Some environments may report errors
    due to PhysX's collision calculation bugs in the later stage of program runtime").
  harness_availability: official-harness
  harness: bidexhands (train.py with --task and --algo, and --test to evaluate a saved model;
    rl-games 1.5.2 as an alternative trainer)
  harness_source: src-github-dexteroushands-readme
  harness_quote: python train.py --task=ShadowHandOver --algo=ppo
  harness_gotcha:
    source: src-nvidia-isaac-gym
    quote: Developers may download and continue to use it, but it is no longer supported.
  harness_gotcha_note: Isaac Gym is deprecated legacy software, which NVIDIA points users away from
    to Isaac Lab; Bi-DexHands has no Isaac Lab port in the sources read, so a run needs the old
    preview build, its driver and Python versions.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for PKU-MARL/DexterousHands reports Apache-2.0 (read
    2026-11-04).
  code_licence_source: src-github-dexteroushands-readme
  code_licence_quote: Bi-DexHands has an Apache license, as found in the [LICENSE](LICENSE) file.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Scores depend on the simulator: Isaac Gym Preview Release 3 or 4 (Preview 4 aligned its PhysX with Isaac Sim
  # 2022.1), at a repository commit, since the code has no version labels. Beyond the simulation profile (subset,
  # n_samples, ...): which formulation the result belongs to (single-agent, multi-agent and how the hands are split
  # into agents, offline, multi-task or meta, which change what the learner is given), what the learner trained on
  # (the offline dataset type), and -- with no field for it -- the environment-step budget and number of parallel
  # environments (100M and 2,048 in the paper), and whether reward or the success metric is reported.
  material_extra:
    - simulator
    - simulator_version
    - eligibility_track
    - training_data_policy

homepage: https://pku-marl.github.io/DexterousHands/
repository: https://github.com/PKU-MARL/DexterousHands


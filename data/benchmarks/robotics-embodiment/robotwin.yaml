# data/benchmarks/robotics-embodiment/robotwin.yaml
#
# P1-S5-T01, robotics-embodiment entry 6 of 9. Filled from the RoboTwin 2.0 paper, arXiv 2506.18088 read as its
# v2 PDF (2025-08-27), and its abstract page; the RoboTwin 1.0 paper, arXiv 2504.13059 read as its v1 PDF (CVPR
# 2025), and the early version's abstract page (arXiv 2409.02920, ECCV 2024 workshop); the CVPR 2025 challenge
# report's abstract page (arXiv 2506.23351); the leaderboard page and the board data it renders; the repository
# README; and Hugging Face's API record of the dataset. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: robotwin
name: RoboTwin
aliases:
  - RoboTwin 2.0
tagline: 50 simulated dual-arm manipulation tasks, scored in clean and in domain-randomized scenes,
  with a standing leaderboard.
description: >
  A simulation benchmark and data generator for dual-arm (bimanual) manipulation. RoboTwin 2.0, the
  current version, has 50 dual-arm tasks built on an annotated library of 731 objects in 147 categories,
  expert demonstrations from task code that multimodal language models write and correct in simulation,
  five dual-arm embodiments, and domain randomization along five axes (clutter, lighting, background,
  tabletop height and instruction wording). The benchmark trains on 50 clean demonstrations per task on
  the Aloha-AgileX embodiment and scores success over 100 trials per task in clean scenes (Easy) and in
  domain-randomized ones (Hard). Its leaderboard, open since August 2025, ranks the paper's single-task
  baselines and policies co-trained on all 50 tasks by the mean of the two. RoboTwin 1.0 (2024-2025) had
  15 tasks, with simulated and real-world data.
self_description:
  source: src-arxiv-2506-18088-v2
  quote: RoboTwin 2.0 is a scalable framework for bimanual manipulation, integrating an expert data
    generation pipeline with a 50-task benchmark built on the RoboTwin Object Dataset (731 objects,
    147 categories)
external_ids:
  arxiv: '2506.18088'
paper:
  title: 'RoboTwin 2.0: A Scalable Data Generator and Benchmark with Strong Domain Randomization for Robust
    Bimanual Robotic Manipulation'
  arxiv: '2506.18088'
  version_read: v2
  source: src-arxiv-2506-18088-v2
released: 2024-09-04
released_note: The early version's first arXiv version (ECCV 2024 workshop), as its abstract page
  dates it. RoboTwin 2.0, the version the leaderboard ranks, was first posted on 2025-06-22 (see
  versions).
released_source: src-arxiv-2409-02920
released_quote: Submitted on 4 Sep 2024

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/bimanual-manipulation
domain_basis:
  reason: The benchmark's claim is coordinated two-arm manipulation, and its tasks are specified and
    scored on dual-arm embodiments (Aloha-AgileX for the benchmark), decided for the suite as a
    whole.
  source: src-arxiv-2506-18088-v2
  quote: we construct a suite of 50+ dual-arm collaborative manipulation tasks
capability:
  - sensorimotor-control
  - distribution-shift-generalization
capability_basis:
  sensorimotor-control:
    reason: A policy issues actions to two simulated arms in closed loop over each rollout, and the
      score is whether the resulting physical state completes the task.
    source: src-arxiv-2506-18088-v2
    quote: 'policies are tested with 100 rollouts under two conditions: Easy (clean) and Hard (domain-randomized
      with clutter, lighting, textures, and height variations)'
  distribution-shift-generalization:
    reason: Policies train on clean scenes only and are scored, as a condition of its own (Hard;
      clean2random on the board), in scenes randomized in clutter, lighting, background texture,
      table height and instruction wording. The tasks are unchanged and only the inputs move.
    source: src-arxiv-2506-18088-v2
    quote: All models are trained on 50 clean (non-randomized) demonstrations per task (blue). For
      evaluation, the Easy setting also uses clean environments, while the Hard setting employs
      domain-randomized environments (green).
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The paper's few-shot adaptation to unseen tasks and its sim-to-real runs are experiments
      on the data generator, not the benchmark's protocol; the protocol keeps the task and
      embodiment and moves only the scene, which the tests assign to
      distribution-shift-generalization.
  - term: sample-efficiency
    reason: Training data is fixed at 50 clean demonstrations per task, but entrants bring
      pretraining of any size, so the total budget is unconstrained; the fixed set keeps runs
      comparable rather than being the measured quantity.

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every number is a success rate over trials run in the simulator, each trial a success or a
    failure.
  source: src-robotwin-leaderboard
  quote: Training data is fixed to 50 demo_clean trajectories × 50 tasks (2,500 demos total) on
    Aloha-AgileX, then evaluated 100 trials/task under demo_clean and demo_randomized.
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: The entrants are learned visuomotor policies, from ACT and Diffusion Policy to
    vision-language-action models such as RDT and pi0, trained or fine-tuned on the benchmark's
    demonstrations and run in the simulator. The vocabulary has no term of its own for
    vision-language-action models, and the LIBERO and RoboCasa entries tag them the same way.
  source: src-arxiv-2506-18088-v2
  quote: All VLAs are fine-tuned from their released pretrained weights in the single-task setting
as_used:
  - protocol: The leaderboard's main track trains one policy on all 50 tasks' 2,500 clean
      demonstrations, where the paper fine-tunes one checkpoint per task, and ranks by the mean of
      Easy and Hard success; the paper's single-task results sit on the same board.
    source: src-robotwin-leaderboard
    quote: 'Co-train: one policy jointly trained on all 50 tasks'

lifecycle: active
lifecycle_basis:
  reason: Outside teams' results keep being listed, nine rows from August to October 2026, the
    latest on 2026-10-11, the board data's last update. The repository was last pushed on 2026-09-24
    (GitHub API).
  source: src-robotwin-leaderboard-data
  quote: Add ViGAR co-train results (82.00 / 67.02%).
activity: leaderboard-live-no-round
activity_basis:
  reason: RoboTwin ran the CVPR 2025 Dual-Arm Collaboration Challenge in rounds, now kept on legacy
    branches, and no round is open. The standing leaderboard lists outside models that meet its
    listing policy, entered by contacting the project lead, which for a benchmark that has run
    rounds is leaderboard-live-no-round.
  source: src-arxiv-2506-23351
  quote: 'the competition consisted of three stages: Simulation Round 1, Simulation Round 2, and a final
    Real-World Round'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: PatchWAM
    source: src-robotwin-leaderboard-data
    observed_on: 2026-10-14
    quote: Add PatchWAM co-train results (91.56 / 66.72%).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's success check on the simulator's state after a trial. The 2.0
  paper does not state the check; the 1.0 paper's is the target pose constraints met at the end,
  with collision-free execution throughout.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The data generator, tasks, dataset and code are released, and evaluation runs through one
    public script.
  source: src-arxiv-2506-18088
  quote: We release the data generator, benchmark, dataset, and code to support scalable research in
    robust bimanual manipulation

task:
  exists: true
  input:
    - camera observations (point clouds for 3D policies) and proprioception from a simulated
      dual-arm robot, Aloha-AgileX in the benchmark, with the task's language instruction for
      policies that take one
  output: Continuous actions for both arms and grippers, step by step, until the task succeeds or
    the trial ends.
  scoring: Success rate per task over 100 trials in each condition, Easy (clean scenes) and Hard
    (domain-randomized), averaged over the 50 tasks; the leaderboard ranks by the mean of the two.
  source: src-arxiv-2506-18088-v2
  quote: 'policies are tested with 100 rollouts under two conditions: Easy (clean) and Hard (domain-randomized
    with clutter, lighting, textures, and height variations)'

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The tasks, simulator code, pre-collected trajectories and evaluation scripts are public
      downloads, the dataset under MIT on Hugging Face.
    source: src-github-robotwin-readme
    quote: We provide over 100,000 pre-collected trajectories as part of the open-source release
  refresh: versioned-releases
  refresh_basis:
    reason: The task set changed between labelled versions (15 tasks in 1.0, 50 in 2.0), and later
      fixes to the evaluation code and embodiment assets, and the board's changes of track and
      ranking, are dated announcements in the README and the board's news.
    source: src-github-robotwin-readme
    quote: 'Latest Version: RoboTwin 2.0'
  data_provenance:
    - simulation-generated
    - model-generated
  data_provenance_note: Tasks are scored in a physics simulator. The expert demonstrations come from
    task programs that a code-generation agent writes and a vision-language observer corrects in
    simulation; the in-house object meshes were reconstructed from images, and the background
    textures generated with Stable Diffusion and filtered by people.
  data_provenance_source: src-arxiv-2506-18088-v2
  data_provenance_quote: The code agent synthesizes task programs from instructions, while the
    observer monitors execution in simulation, detects failures, and suggests corrections
  contamination_risk: unknown
  contamination_risk_note: Training on the clean demonstrations is the protocol. Not assessed is
    whether pretrained models' mixtures include RoboTwin 2.0's released domain-randomized
    trajectories, which would undo the Hard condition's hold-out; the board fixes only the
    benchmark's own training data.
  contamination_evidence: []
  dataset_licence: MIT
  dataset_licence_source: src-hf-api-robotwin2-0
  dataset_licence_quote: '"cardData":{"license":"mit"}'
  size:
    - count: 50
      unit: tasks
      subset: RoboTwin 2.0
      source: src-arxiv-2506-18088-v2
      quote: Evaluations are conducted on all 50 benchmark tasks using the Aloha AgileX dual-arm
        embodiment
    - count: 2500
      unit: training demonstrations on the leaderboard (50 clean per task)
      subset: leaderboard
      source: src-robotwin-leaderboard
      quote: Training data is fixed to 50 demo_clean trajectories × 50 tasks (2,500 demos total) on
        Aloha-AgileX, then evaluated 100 trials/task under demo_clean and demo_randomized.
    - count: 15
      unit: tasks
      subset: RoboTwin 1.0
      source: src-arxiv-2504-13059-v1
      quote: which includes 15 tasks in total

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The RoboTwin Team (the RoboTwin-Platform organisation, led jointly by SJTU's AI
    Institute and HKU MMLab)
  maintainer_basis:
    reason: The paper names SJTU's AI Institute and HKU MMLab as equally leading organisations among
      sixteen; the code sits in the RoboTwin-Platform GitHub organisation and the board is credited
      to the RoboTwin Team.
    source: src-arxiv-2506-18088-v2
    quote: ‡ Equally leading organizations
  maintainer_type: community-collective
  maintainer_type_note: A shared organisation account with contributors from sixteen institutions
    and two equally leading organisations, so no single institution is stated as the holder and no
    legal form is stated.
  submission_process:
    - maintainer-run
    - publication-gated
    - open-source-gated
  submission_process_note: Listing requires public code, public weights and a technical report, and
    entrants ask to be listed by contacting the project lead. The team runs the paper's single-task
    baselines and other published models itself (rows credited to the RoboTwin Team). Outside rows
    are credited to the team that produced the numbers, while the page says results are reproduced
    through the XPolicyLab interface; whether the maintainers re-run them is not stated, so that
    route is left untagged.
  submission_process_source: src-robotwin-leaderboard
  submission_process_quote: To be listed on this leaderboard, a model must provide publicly released
    code, publicly released weights, and a technical report (arXiv paper or equivalent public
    document) describing the method.
  independence_flags: []
  independence_flags_note: Not assessed to completion. The paper's named supporters, AgileX
    Robotics, D-Robotics and an HKU Jockey Club lab, have no system on the board. Whether any of the
    models the RoboTwin Team ran itself (X-WAM, AHA-WAM, FastWAM, EventVLA and others) come from the
    maintainers' own groups was not checked.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: Every official run needs RoboTwin's simulator, whatever policy is entered; the
    GPUs used to fine-tune vision-language-action models are training cost.
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside RoboTwin's simulator, which the evaluation
      scheduler starts for each task.
    source: src-github-robotwin-readme
    quote: The scheduler starts a policy server and simulator per task on your GPU pool.
  harness_availability: official-harness
  harness: RoboTwin's scripts/eval_policy.sh, over XPolicyLab policy adapters
  harness_source: src-github-robotwin-readme
  harness_quote: All evaluation goes through `scripts/eval_policy.sh`.
  code_licence: MIT
  code_licence_source: src-github-robotwin-readme
  code_licence_quote: This repository is released under the MIT license.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which version (1.0's 15 tasks or 2.0's 50), which condition (Easy, Hard or
  # their mean) and track (one checkpoint per task, or one policy co-trained on all 50), what the policy was
  # pretrained on (RoboTwin's own randomized data among it), and how many trials per task.
  material_extra:
    - subset_used
    - training_data_policy
    - n_samples

homepage: https://robotwin-platform.github.io/
repository: https://github.com/RoboTwin-Platform/RoboTwin
leaderboard_url: https://robotwin-platform.github.io/leaderboard

versions:
  - version: '1.0'
    label: RoboTwin, the ECCV 2024 workshop early version and the CVPR 2025 paper
    version_kind: edition
    released: 2024-09-04
    items: 15
    changes: The first release, 15 dual-arm tasks on the ManiSkill3 physics engine with simulated
      and real-world (COBOT Magic) data; its paper benchmarks imitation learning on 14 of them with
      20, 50 and 100 demonstrations.
    breaking: true
    superseded_by: '2.0'
    frozen: true
    sources:
      - src-arxiv-2409-02920
      - src-arxiv-2504-13059-v1
  - version: '2.0'
    label: RoboTwin 2.0
    version_kind: edition
    released: 2025-06-22
    items: 50
    changes: 50 tasks, the RoboTwin-OD object library, five embodiments, domain randomization on
      five axes and the Easy and Hard protocol. The leaderboard opened in August 2025 and merged its
      co-train and single-task boards into one in July 2026; evaluation code and embodiment assets
      were fixed in place in July and August 2025.
    breaking: true
    supersedes_version: '1.0'
    frozen: false
    sources:
      - src-arxiv-2506-18088
      - src-arxiv-2506-18088-v2
      - src-github-robotwin-readme
      - src-robotwin-leaderboard-data

history:
  - date: 2025-08-06
    event: channel-opened
    field: governance.submission_process
    to: maintainer-run
    source: src-github-robotwin-readme
    quote: We release RoboTwin 2.0 Leaderboard
    note: The board opened with the paper's single-task baselines. The first outside row, GigaAI's
      GigaBrain-0.7, was listed on 2026-08-15.

tags:
  - bimanual-manipulation
  - domain-randomization
  - simulation
  - vision-language-action
  - leaderboard

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2506-18088-v2
    - src-arxiv-2506-18088
    - src-arxiv-2504-13059-v1
    - src-arxiv-2409-02920
    - src-arxiv-2506-23351
    - src-robotwin-leaderboard
    - src-robotwin-leaderboard-data
    - src-github-robotwin-readme
    - src-hf-api-robotwin2-0
  sources_note: >
    The RoboTwin 2.0 paper's v2 PDF and the 1.0 paper's v1 PDF (DOIs, not archived) read as text; the
    2.0, early-version and challenge-report abstract pages; the leaderboard page with scripts and styles
    stripped, and the board data file it renders its rows from; the README at main; and Hugging Face's
    API record of the dataset.
  confidence: medium
  review_checks:
    - check: The entry is the RoboTwin family with 1.0 and 2.0 as editions (the ECCV 2024 early
        version folded into 1.0). The taxonomy's examples and corpus classification call it
        robotwin-2-0; whether the id or those refs should change, and whether 2.0 should be its own
        entry.
      field: versions
    - check: The outside submission route is untagged. The page says results are reproduced through
        the XPolicyLab interface (sandboxed-rerun?), but the board data credits each row to the team
        that produced the numbers (self-reported?).
      field: governance.submission_process
      source: src-robotwin-leaderboard
      quote: Results here are reproduced via the XPolicyLab standard interface.
    - check: distribution-shift-generalization rests on clean-only training data; pretrained models
        may have seen RoboTwin's randomized trajectories, which no source checks.
      field: capability
    - check: sample-efficiency is rejected although the paper reads its success rates as few-shot
        adaptation at a fixed 50 demonstrations per task.
      field: capability
    - check: embodied-instruction-following is not tagged as secondary. Instructions are a
        randomization axis, and the single-task baselines (ACT, DP, DP3) take none.
      field: domain
    - check: community-collective rather than academic-lab, since two university groups lead
        equally.
      field: governance.maintainer_type
    - check: The leaderboard page's body carries the project lead's contact e-mail (kept out of the
        extract); whether its archive should be withheld rather than pending.
      source: src-robotwin-leaderboard
    - check: The README lists a WBCD-2026 branch; whether a 2026 competition round on RoboTwin is
        open, which would change activity.
      field: activity

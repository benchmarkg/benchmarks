# data/benchmarks/robotics-embodiment/robothor-challenge.yaml
#
# P1-S5-T03, robotics-embodiment entry 19. Filled from the RoboTHOR paper (arXiv 2004.06799, CVPR 2020), read as
# its v1 PDF and its abstract page; the two challenge pages on ai2thor.allenai.org, for 2020 and 2021 (robots.txt
# disallows only /external-publications; scripts and styles stripped); the robothor-challenge README at the 2021
# head commit (f3c4f35) and at the last 2020 commit (78730ca), the 2021 challenge_config.yaml and the 2020
# requirements.txt; EvalAI's public API records of the 2020 challenge (558), its phase list and its RGB-D
# test-challenge leaderboard; the CVPR 2020 and CVPR 2022 Embodied AI workshop pages on embodied-ai.org; and the
# v2 PDF of STRIVE (arXiv 2505.06729, September 2025), a paper that reports on the 2021 edition's validation
# episodes. Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.
#
# The 2021 submission host, the AI2 Leaderboard (leaderboard.allenai.org/robothor_objectnav), was not read: its
# host name no longer resolves (NXDOMAIN on 2026-11-05), so the 2021 ranking is not in this entry.

id: robothor-challenge
name: RoboTHOR Challenge
aliases:
  - RoboTHOR ObjectNav Challenge
  - RoboTHOR Object Navigation Challenge
  - AI2-THOR ObjectNav
aliases_note: >
  The 2021 README is headed "2021 RoboTHOR Object Navigation (ObjectNav) Challenge"; the CVPR 2021 Embodied
  AI workshop's challenge table lists the 2021 edition as "AI2-THOR ObjectNav".
tagline: AI2's ObjectNav challenge in the RoboTHOR apartments (CVPR 2020-2021), scored by SPL; the
  real-robot phases never ran.
description: >
  The Allen Institute for AI's object-goal navigation challenge, run with the Embodied AI workshop at
  CVPR in 2020 and 2021 in RoboTHOR, an AI2-THOR environment of artist-built apartments. An agent starts
  at a random pose in an apartment it has not seen and must find an object named by its category (one
  of 12, such as Apple or Television) from egocentric camera frames, issuing discrete moves, turns and
  camera tilts, and end the episode within 1 m of the object with the object in view. Episodes are scored
  by success and by SPL, success weighted by the ratio of the shortest path to the path taken, and ranked
  by SPL. RoboTHOR pairs its 14 test apartments with physical replicas at AI2 in Seattle, and the challenge
  was built around simulation-to-real transfer: top 2020 entries were to run on a LoCoBot robot in the
  real apartments. COVID-19 cancelled that in both years, so every score is from simulation. The 2020
  edition ran on EvalAI, where entrants pushed Docker images that the organisers ran on held-out test
  apartments in an RGB and an RGB-D track. The 2021 edition switched to RGB-D, released its test episodes
  without their shortest paths, and took entrants' locally computed metrics files on the AI2 Leaderboard,
  which validated them and computed the metrics. No edition has run since 2021.
self_description:
  source: src-ai2thor-robothor-challenge
  quote: The RoboTHOR challenge is an embodied AI challenge focused on the problem of
    simulation-to-real transfer.
external_ids:
  arxiv: '2004.06799'
paper:
  title: 'RoboTHOR: An Open Simulation-to-Real Embodied AI Platform'
  arxiv: '2004.06799'
  version_read: v1
  source: src-arxiv-2004-06799-v1
paper_note: The platform's paper, which both challenge pages ask entrants to cite; the challenge has
  no paper of its own, and the paper's experiments are the authors' benchmark of the platform, not
  the challenge.
released: 2020-02-11
released_note: The day the 2020 edition's simulated training and validation data were released, per
  its timeline; EvalAI's record of the 2020 challenge starts on 2020-03-14.
released_source: src-ai2thor-robothor-challenge
released_quote: Simulation Training and Validation Data Released Feb 11, 2020
release_venue: CVPR 2020 Embodied AI Workshop
release_venue_source: src-ai2thor-robothor-challenge
release_venue_quote: Held in conjunction with the CVPR 2020 Embodied AI Workshop

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/navigation
domain_basis:
  reason: Both editions score one task, an agent moving to an instance of a named object category in
    an apartment it has not seen, which is the navigation leaf's definition.
  source: src-ai2thor-robothor-cvpr-2021-challenge
  quote: The agent starts from a random location in an apartment and is expected to navigate towards
    an object that is specified by its type.
domain_considered_and_rejected:
  - term: robotics-embodiment/sim2real-transfer
    reason: The design point, and the leaf the challenge names itself by. RoboTHOR pairs its test
      apartments with physical replicas, and in 2020 the top entries were to be run on a LoCoBot in
      them. But the leaf scores how much simulated performance survives on hardware, and no physical
      run was scored in either edition. COVID-19 moved 2020 to simulation only, with the physical
      component deferred to a date never set, and 2021 was simulation only. Navigation leads; see
      review_checks.
    source: src-ai2thor-robothor-cvpr-2021-challenge
    quote: Due to COVID-19, the challenge will only be done in simulation.
  - term: robotics-embodiment/embodied-instruction-following
    reason: The goal is one object category name from a fixed list of 12, not a natural-language
      instruction.
  - term: robotics-embodiment/mobile-manipulation
    reason: The agent only moves and tilts its camera; nothing is picked up or moved.
capability:
  - sensorimotor-control
  - search-exploration
capability_basis:
  sensorimotor-control:
    reason: Actions drive a simulated robot body whose response is noisy, as the real LoCoBot's is.
      The 2021 configuration runs the stochastic agent in LoCoBot mode with continuous (not
      grid-snapped) motion, and the score depends on where that body ends up.
    source: src-arxiv-2004-06799-v1
    quote: The motion of the agent in the simulated world is stochastic in nature, mirroring its
      behavior in the real world.
  search-exploration:
    reason: The target's location is not given, so the agent must search the apartment until it sees
      an instance, and SPL discounts success by how much longer the path was than the shortest one.
      The paper's human players took a median 49.5 steps where the shortest paths took 22.0.
    source: src-arxiv-2004-06799-v1
    quote: In fact, the agent must explore until it observes the target, and then move swiftly
      towards it.
capability_considered_and_rejected:
  - term: perception
    reason: The input is RGB (2020) or RGB-D images and success needs the target in view, but the
      score is whether and how efficiently the target was reached, not what was recovered from the
      images; the same call as habitat-challenge.
  - term: grounding
    reason: The goal is a category label from a fixed list of 12; no linguistic expression is
      resolved to a referent.
  - term: distribution-shift-generalization
    reason: The shift the challenge was built to measure, from simulation to the physical
      apartments, was never scored. The test apartments share no wall layout or object instance with
      the training ones, but they are drawn from the same artist-built design, and no shifted
      condition is reported beside an in-distribution one.
    source: src-arxiv-2004-06799-v1
    quote: while avoiding any overlap between the wall layouts and object instances among train/val,
      test-dev and test-standard
  - term: spatial-reasoning
    reason: Habitat-challenge takes it from PointNav without GPS+Compass. This challenge has only
      ObjectNav, where the target is found by search and then approached, and no source names a
      spatial inference that the score depends on.

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every scored number is computed over episodes run in the AI2-THOR simulator, each a
    success or a failure, with SPL bounded by 1.
  source: src-ai2thor-robothor-challenge
  quote: The final winners will be chosen based on performance in the simulated scenes in the
    Test-Challenge set.
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: The challenge is built for policies trained in the RoboTHOR training apartments. The
    paper's baselines are trained with A3C, and the 2021 edition supplies AllenAct baselines trained
    with DD-PPO and DAgger.
  source: src-ai2thor-robothor-cvpr-2021-challenge
  quote: Reinforcement/imitation learning pipelines for training with Distributed Decentralized
    Proximal Policy Optimization (DD-PPO) and DAgger.
as_used:
  - protocol: The 2021 edition's validation episodes, run by the authors in the Habitat simulator
      rather than AI2-THOR, with a 500-step cap and a 1.0 m success distance, and scored by success
      rate and SPL; not the test split the leaderboard ranked.
    split: val
    source: src-arxiv-2505-06729-v2
    quote: RoboTHOR [14], including 1800 episodes across 15 scenes with 12 target object categories.
    note: STRIVE (v2, September 2025), a zero-shot agent built on gemini-2.0-flash with
      MM-GroundingDINO and SAM. 1,800 episodes over 15 scenes and 12 categories is the 2021 README's
      validation split.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the challenge's own episodes; a September 2025 paper reports
    success and SPL on the 2021 edition's 1,800 validation episodes. The series' ending is recorded
    in activity (ADR-0019).
  source: src-arxiv-2505-06729-v2
  quote: 68.1% SR and 36.3% SPL on RoboTHOR
activity: closed
activity_note: EvalAI's record of the 2020 challenge (558) is inactive, its test-challenge phases
  ended on 2020-06-12 and its test-dev phases on 2020-08-02. The 2021 edition's submissions closed
  on 2021-05-31; its host, leaderboard.allenai.org, did not resolve on 2026-11-05 (NXDOMAIN), and
  the Wayback Machine's last capture of a robothor_objectnav submission page, on 2025-10-25, is a
  404. The CVPR 2022 Embodied AI workshop's challenge table has no RoboTHOR entry, and
  ai2thor.allenai.org has no page for a later edition (/robothor/cvpr-2022-challenge/ returns 404).
activity_basis:
  reason: Each edition's route for results, EvalAI in 2020 and the AI2 Leaderboard in 2021, existed
    and none is open now, and no edition has run since 2021.
  source: src-evalai-robothor-challenge-558-phases
  quote: '"end_date":"2020-08-02T06:59:59Z"'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: AllenAct ObjectNav baseline (the organisers' CNN-RNN policy, 300M training steps)
    source: src-ai2thor-robothor-cvpr-2021-challenge
    observed_on: 2026-11-05
    quote: our best pretrained model checkpoint (trained for 300M steps) obtaining a test-set
      success rate of ~26%
  - system: STRIVE (zero-shot, on gemini-2.0-flash)
    source: src-arxiv-2505-06729-v2
    observed_on: 2026-11-05
    quote: For VLM, we use Gemini [3] (gemini-2.0flash)
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Success is checked in the simulator when the agent stops (distance to the
  target and the target's visibility), and SPL uses the simulator's shortest path from the start
  pose.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The 2020 test-challenge apartments were held by the organisers, and the 2021 test episodes
    were released without the shortest paths SPL needs. Both routes to an official score have
    closed. Anyone can run the released validation episodes.
  source: src-github-robothor-challenge-readme
  quote: are hidden from episodes in the `test` split.

task:
  exists: true
  input:
    - egocentric RGB frames (the 2020 RGB track) or RGB-D frames (the 2020 RGB-D track and 2021),
      640 x 480, in an unseen simulated apartment
    - 'the goal: an object category name, one of 12'
  output: A sequence of discrete actions (MoveAhead, RotateRight, RotateLeft, LookUp, LookDown)
    ending with Stop, within 500 steps.
  scoring: Success and SPL averaged over the test episodes, ranked by SPL, with proximity-only
    success and SPL (ignoring visibility) and episode length beside them. An episode succeeds when
    the agent issues Stop within 1 m of an instance of the target category with the instance
    visible.
  item_definition: An episode is an apartment, a start position and orientation, and a target object
    category.
  source: src-github-robothor-challenge-readme
  quote: the agent must be within 1 meter of the target object and the object must also be visible
    to the agent.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The 2021 edition, the latest, released its test episodes in the repository with the
    shortest_path keys removed, and the test apartments ship with the simulator build; only the
    shortest paths, which SPL needs, stayed with the organisers. In 2020 the test-challenge
    apartments themselves were held back (private-test-server), with entrants' containers run on
    them.
  access_basis:
    reason: The headline set's inputs are public and its reference shortest paths are withheld, so
      entrants ran their own agents and submitted results for scoring.
    source: src-github-robothor-challenge-readme
    quote: are hidden from episodes in the `test` split.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each edition ranked entrants on its own episode set, with a new simulator build, agent
      body and sensor rule. 2020 had RGB and RGB-D tracks on ai2thor 2.3.7; 2021 was RGB-D only, on
      ai2thor 2.7.2, with new train, val and test episodes.
    source: src-ai2thor-robothor-cvpr-2021-challenge
    quote: The RoboTHOR Challenge 2021 deals with the task of Visual Semantic Navigation from
      ego-centric RGB-D camera input.
  data_provenance:
    - simulation-generated
  data_provenance_note: Episodes are start poses and targets in AI2-THOR scenes, with shortest paths
    from the simulator. The scenes were assembled from an asset library made by digital artists, not
    scanned; the authors' design of them is not separately tagged.
  data_provenance_source: src-arxiv-2004-06799-v1
  data_provenance_quote: A large asset library was created by digital artists
  contamination_risk: medium
  contamination_risk_note: The 2021 test apartments ship with the simulator build so that entrants
    can run the test episodes themselves, and the rules allow any external data, so nothing
    technical keeps a policy from being trained in the test apartments; no source forbids it
    explicitly. In 2020 the test-challenge apartments were held back and the risk was low. No
    contamination case is known.
  contamination_risk_source: src-ai2thor-robothor-cvpr-2021-challenge
  contamination_risk_quote: Yes, you can use any external data (in addition to the provided dataset)
    for training your models.
  contamination_evidence: []
  size:
    - count: 2040
      unit: test episodes in 10 apartments
      subset: 2021 edition
      source: src-github-robothor-challenge-readme
      quote: '| Test | 2040 |'
    - count: 1800
      unit: validation episodes in 15 apartments
      subset: 2021 edition
      note: The 2021 challenge page's table gives 1080 validation episodes; the README's 1800 is
        what STRIVE reports using.
      source: src-github-robothor-challenge-readme
      quote: '| Val | 1800 |'
    - count: 108000
      unit: training episodes in 60 apartments
      subset: 2021 edition
      source: src-github-robothor-challenge-readme
      quote: '| Train | 108000 |'
    - count: 6116
      unit: validation episodes (27,595 training episodes beside them)
      subset: 2020 edition
      source: src-github-robothor-challenge-readme-2020
      quote: The dataset consists of 27595 training episodes and 6116 val episodes
    - count: 89
      unit: apartments (60 train, 15 val, 4 test-dev, 10 test-standard), the last 14 also built
        physically
      subset: RoboTHOR platform
      source: src-arxiv-2004-06799-v1
      quote: ROBOTHOR consists of a set of 89 apartments, 75 in train/val (we use 60 for training
        and 15 for validation), 4 in test-dev
  submission_limit:
    max_submissions: 1
    period_days: 1
    per: team, on the 2020 test-dev phases (50 in all); the test-challenge phases allowed 1 in all
    source: src-evalai-robothor-challenge-558-phases

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Allen Institute for AI (its PRIOR team)
  maintainer_basis:
    reason: AI2's PRIOR team organised both editions, AI2 sponsored the challenge under its
      participation agreement, and its repositories and site host the challenge.
    source: src-ai2thor-robothor-cvpr-2021-challenge
    quote: The RoboTHOR 2021 challenge is being organized by the PRIOR team at the Allen Institute
      for AI.
  maintainer_type: null
  maintainer_type_note: conference-workshop was considered, as results were announced at the CVPR
    Embodied AI workshop, but one standing institute organised and hosted both editions. No source
    read states AI2's legal form, so the value is left null; nonprofit is the likely one
    (review_checks).
  submission_process:
    - containerized-algorithm-submission
    - held-out-server
  submission_process_note: In 2020 entrants pushed Docker images to EvalAI with its CLI, and the
    organisers ran them on test-dev and test-challenge apartments in simulation. In 2021 entrants
    ran the released test episodes themselves and uploaded the gzipped metrics file to the AI2
    Leaderboard, which validated the results and computed the metrics with the shortest paths it
    held.
  submission_process_source: src-github-robothor-challenge-readme
  submission_process_quote: During leaderboard evaluation, we will validate your results and compute
    several metrics
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-github-robothor-challenge-readme-2020
      quote: During leaderboard evaluation, separate scenes/points will be used to determine your
        score.
  independence_flags_note: In 2020 AI2 held the test-challenge apartments and ran every submitted
    container; in 2021 it held the test shortest paths and computed every score. EvalAI's record has
    no prize and no sponsor, and no source read names a prize for either edition. Whether AI2
    entered systems of its own on the 2021 board was not checked, because the board could not be
    read (review_checks).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline scores are test-set results that only the organisers could compute, from
      apartments (2020) or shortest paths (2021) they held, and both servers have closed. The
      validation episodes can be run and scored by anyone.
    source: src-github-robothor-challenge-readme
    quote: Submissions will be ranked on the leaderboard by SPL on the test set.
  reproducibility_blockers:
    - private-test-set
    - specific-simulator-build
  reproducibility_blockers_note: Each edition pins its simulator, ai2thor 2.3.7 in 2020 and 2.7.2 in
    2021, and the 2021 configuration names a THOR build by hash; the evaluation resets the
    environment parameters to the configuration's values.
  reproducibility_blockers_source: src-github-robothor-challenge-config
  reproducibility_blockers_quote: 'thor_build_id: bad5bc2b250615cb766ffb45d455c211329af17e'
  harness_availability: official-harness
  harness: robothor-challenge (runner.py with challenge_config.yaml, which writes the metrics file
    submitted to the leaderboard)
  harness_source: src-github-robothor-challenge-readme
  harness_quote: These are the same values that will be used for generating the leaderboard.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for allenai/robothor-challenge, read 2026-11-05; not
    a quoted Source. The episode files ship in the same repository, and no separate data licence was
    found.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the simulator and its build, because the agent body, noise model and scenes
  # are defined only in a given AI2-THOR release (ai2thor 2.3.7 with agentMode bot in 2020; 2.7.2 with
  # agentMode locobot and THOR build bad5bc2 in 2021) and STRIVE ran the 2021 val episodes in Habitat
  # instead; which edition, track and split (2020 RGB or RGB-D test-challenge, 2021 test, or the released val
  # episodes); and what the agent was trained on (the challenge allows any external data, and zero-shot
  # agents train on none of it). hardware_platform is not material: no physical run was ever scored.
  material_extra:
    - simulator
    - simulator_version
    - subset_used
    - training_data_policy

homepage: https://ai2thor.allenai.org/robothor/cvpr-2021-challenge/
repository: https://github.com/allenai/robothor-challenge
leaderboard_url: https://eval.ai/web/challenges/challenge-page/558/overview
leaderboard_url_note: EvalAI's 2020 record, the only results page still readable; the 2021 board's
  host no longer resolves.

versions:
  - version: '2020'
    label: RoboTHOR Challenge 2020 (CVPR 2020 Embodied AI Workshop)
    version_kind: edition
    released: 2020-02-11
    changes: The first edition. ObjectNav with 12 target categories on ai2thor 2.3.7, in an RGB and
      an RGB-D track on EvalAI, with Docker submissions run on test-dev and test-challenge
      apartments in simulation. Weekly runs of the top 5 test-dev entries on the real apartments,
      and real test-challenge runs for the top 3, were planned and cancelled for COVID-19. Four
      teams appear on each test-challenge board; the RGB-D winner's SPL is 0.157 at 32.4% success.
    breaking: true
    superseded_by: '2021'
    frozen: true
    sources:
      - src-ai2thor-robothor-challenge
      - src-github-robothor-challenge-readme-2020
      - src-github-robothor-challenge-requirements-2020
      - src-evalai-robothor-challenge-558
      - src-evalai-robothor-challenge-558-phases
      - src-evalai-robothor-challenge-558-lb-rgbd
  - version: '2021'
    label: RoboTHOR Challenge 2021 (CVPR 2021 Embodied AI Workshop)
    version_kind: edition
    released: 2021-02-17
    items: 2040
    changes: RGB-D only, on ai2thor 2.7.2 with a LoCoBot-mode agent and a 500-step cap; new episode
      sets (108,000 train, 1,800 val, 2,040 test), the test episodes released without shortest
      paths; AllenAct baselines; metrics files submitted to the AI2 Leaderboard until 2021-05-31,
      winners announced on 2021-06-19. Simulation only.
    breaking: true
    supersedes_version: '2020'
    frozen: true
    sources:
      - src-ai2thor-robothor-cvpr-2021-challenge
      - src-github-robothor-challenge-readme
      - src-github-robothor-challenge-config

history:
  - date: 2020-08-02
    event: channel-closed
    field: execution.submission_channel
    from: EvalAI challenge 558 (the 2020 edition)
    source: src-evalai-robothor-challenge-558-phases
    quote: '"end_date":"2020-08-02T06:59:59Z"'
    note: The test-dev phases' end; the test-challenge phases ended on 2020-06-12.
  - date: 2021-05-31
    event: channel-closed
    field: execution.submission_channel
    from: AI2 Leaderboard, robothor_objectnav (the 2021 edition)
    source: src-ai2thor-robothor-cvpr-2021-challenge
    quote: Submissions Close May 31, 2021
    note: The deadline for the 2021 ranking. When the board itself stopped taking results is not
      dated by any source read; its host no longer resolves.

tags:
  - navigation
  - objectnav
  - sim2real
  - simulation
  - challenge
  - ai2-thor

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T03)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2004-06799-v1
    - src-arxiv-2004-06799
    - src-ai2thor-robothor-challenge
    - src-ai2thor-robothor-cvpr-2021-challenge
    - src-github-robothor-challenge-readme
    - src-github-robothor-challenge-readme-2020
    - src-github-robothor-challenge-config
    - src-github-robothor-challenge-requirements-2020
    - src-evalai-robothor-challenge-558
    - src-evalai-robothor-challenge-558-phases
    - src-evalai-robothor-challenge-558-lb-rgbd
    - src-embodied-ai-cvpr2020
    - src-embodied-ai-cvpr2022
    - src-arxiv-2505-06729-v2
  sources_note: >
    The RoboTHOR paper's v1 PDF and abstract page (a DOI, not archived); the 2020 and 2021 challenge pages
    with scripts and styles stripped; the README at the 2021 head commit and at the last 2020 commit,
    the 2021 challenge_config.yaml and the 2020 requirements.txt, all pinned by commit; EvalAI's JSON
    records of the 2020 challenge, its phases and its RGB-D test-challenge leaderboard; the CVPR 2020
    and 2022 Embodied AI workshop pages; and STRIVE's v2 PDF (a DOI, not archived) as evidence of current
    use.
  confidence: medium
  review_checks:
    - check: Navigation is primary and sim2real-transfer rejected, because no physical run was
        scored in either edition. The challenge calls itself a sim-to-real challenge, and the paper
        and the 2020 plan were built for it. If the catalogue tags design intent, sim2real-transfer
        could be secondary with a note that it was never exercised.
      field: domain
      source: src-ai2thor-robothor-challenge
      quote: The component of the RoboTHOR challenge involving the physical robot will be held at a
        later date, to be determined as we get more clarity on the COVID-19 stay at home order.
    - check: How this differs from habitat-challenge, which also ran ObjectNav at the same CVPR
        workshops (2020-2023). Habitat is Meta's, in Habitat-Sim on scanned Matterport3D and HM3D
        houses with 21 or 6 categories, and adds PointNav and ImageNav. This is AI2's, in AI2-THOR
        on artist-built apartments with physical replicas and 12 categories, ObjectNav only. They
        share SPL, the 1 m success radius and the workshop, but not the maintainer, simulator,
        scenes or episodes, so neither is a version or fork of the other; no lineage is recorded.
      field: lineage
      source: src-embodied-ai-cvpr2020
      quote: iGibson Habitat RoboTHOR Problem PointNav PointNav, ObjNav ObjNav Test Environment Real
        Simulation Real
    - check: lifecycle active rests on STRIVE (September 2025), which ran the 2021 validation
        episodes in the Habitat simulator, not AI2-THOR. Several 2026 papers (Graph-MambaNav,
        SAGE-Nav, F2A-ObjectNav, AgentSpec) report "RoboTHOR" ObjectNav, but on their own scene
        splits and target lists or a handful of episodes, which is use of the platform rather than
        of the challenge; they were read only as arXiv HTML and are not Sources. If the ported
        episodes do not count, lifecycle could be mature.
      field: lifecycle
      source: src-arxiv-2505-06729-v2
      quote: on the Object Navigation task in Habitat [45] simulator
    - check: The 2021 validation split is 1800 episodes in the README and 1080 on the challenge
        page; 1800 is recorded, and STRIVE's count agrees with it.
      field: data.size
      source: src-ai2thor-robothor-cvpr-2021-challenge
      quote: Val 1080 15 Test 2040 10
    - check: The success radius is a Euclidean distance on the 2020 challenge page and a geodesic

# data/benchmarks/robotics-embodiment/rlbench.yaml
#
# P1-S5-T02, robotics-embodiment entry 15. Filled from the RLBench paper, arXiv 1909.12271 read as its v1 PDF
# (2019-09-26, its only version), and its abstract page; Crossref's record of the IEEE RA-L version (the DOI); the
# repository README and LICENSE at commit 02720bb; the project site; PyRep's README and version file at commit
# 8f420be, for the simulator chain; the PerAct paper, arXiv 2209.05451 read as its v2 PDF (CoRL 2022), for the
# 18-task set later work reports on; and the abstract page of BridgeVLA (arXiv 2506.07961), a 2025 paper that
# reports on RLBench. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.

id: rlbench
name: RLBench
aliases:
  - The Robot Learning Benchmark & Learning Environment
tagline: 100 hand-designed manipulation tasks for a simulated Franka Panda arm in CoppeliaSim, with
  motion-planned demos.
description: >
  A simulated benchmark and learning environment for vision-guided robot manipulation from the Dyson Robotics
  Lab at Imperial College London. One scene, a Franka Emika Panda arm on a table, hosts 100 hand-designed
  tasks, from reaching a target to multi-stage tasks such as putting a tray in an oven. Each task has
  variations (target objects or colours) with textual descriptions, and an unlimited supply of episodes
  (new positions) and of demonstrations from motion planning. Observations are proprioception and RGB,
  depth and segmentation masks from an over-the-shoulder stereo camera and a wrist camera. An episode
  succeeds when the task's success conditions hold, with a sparse reward of +1. The paper's headline protocol
  is a few-shot challenge (v1.0): train on most tasks, then from K demonstrations of each unseen test
  task (1, 5 or 20) report success on new episodes. The repository adds named task sets for few-shot and
  multi-task learning. RLBench was built on V-REP and PyRep and now runs on CoppeliaSim 4.1.0 through
  PyRep, and scores depend on that build. Most later work does not use either designed protocol. It reports
  average success over the 18-task, 249-variation multi-task set that PerAct (CoRL 2022) derived from
  RLBench, partly modified. That set is recorded as a fork.
self_description:
  source: src-arxiv-1909-12271-v1
  quote: 'We present a challenging new benchmark and learning-environment for robot learning: RLBench'
external_ids:
  arxiv: '1909.12271'
paper:
  title: 'RLBench: The Robot Learning Benchmark & Learning Environment'
  arxiv: '1909.12271'
  doi: 10.1109/lra.2020.2974707
  version_read: v1
  source: src-arxiv-1909-12271-v1
released: 2019-09-26
released_note: The paper's first and only arXiv version, as its abstract page dates it. GitHub
  reports the repository created the same day (API, read 2026-11-04).
released_source: src-arxiv-1909-12271
released_quote: Submitted on 26 Sep 2019
release_venue: IEEE Robotics and Automation Letters 5(2), 2020, with a presentation at ICRA 2020
release_venue_note: Crossref dates the issue to April 2020 and gives pages 3019-3026 (DOI
  10.1109/LRA.2020.2974707); the README announces the acceptance on 28 January 2020. The IEEE
  version itself was not read.
release_venue_source: src-crossref-10-1109-lra-2020-2974707
release_venue_quote: '"container-title":["IEEE Robotics and Automation Letters"]'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/manipulation
domain_basis:
  reason: Every task is a simulated Franka Panda arm with a parallel gripper changing the state of
    objects on a table (stacking blocks, opening a door, taking a lid off a saucepan); the scored
    outcome is the task's success conditions on the objects.
  source: src-arxiv-1909-12271-v1
  quote: The benchmark includes 100 completely unique, hand-designed tasks ranging in
domain_considered_and_rejected:
  - term: robotics-embodiment/embodied-instruction-following
    reason: Each variation comes with textual descriptions, but the paper offers them as an extra
      for language and HRI research, and neither designed protocol conditions or scores on them.
      Language-conditioned use comes from PerAct's derived set (a fork), which conditions its policy
      on templated language goals.
    source: src-arxiv-1909-12271-v1
    quote: Each variation of a task comes with a list of textual descriptions that verbally
      summarise this variation of the task
  - term: robotics-embodiment/sim2real-transfer
    reason: The paper names sim-to-real research as an application, with a domain-randomisation
      rendering option and swappable arms, but nothing is scored on hardware.
    source: src-arxiv-1909-12271-v1
    quote: a domain randomisation rendering option in order to maximise the potential for research
      on sim-to-real transfer
  - term: robotics-embodiment/cross-embodiment-transfer
    reason: The arm can be swapped for five others, but the README fixes the Franka Panda for
      benchmarking, so no transfer to another body is scored.
    source: src-github-rlbench-readme
    quote: '**For benchmarking, the arm should remain as the Franka Panda.**'
  - term: robotics-embodiment/dexterous-manipulation
    reason: Some tasks are precise (insert onto a peg, stack cups), but they are done with the
      Panda's parallel gripper, which the leaf's distinction keeps under manipulation.
    source: src-arxiv-1909-12271-v1
    quote: which share a common Franka Emika Panda robot arm
capability:
  - sensorimotor-control
  - transfer-learning
  - sample-efficiency
capability_basis:
  sensorimotor-control:
    reason: A policy issues actions to the simulated arm in closed loop through the Environment API,
      the simulator responds, and an episode is scored by whether the task completes.
    source: src-arxiv-1909-12271-v1
    quote: Each task has a completely sparse reward of +1 which is given only on task completion.
  transfer-learning:
    reason: The designed few-shot challenge trains on one set of tasks (meta-train) and scores on
      unseen tasks held out for the test set, with no prior knowledge of them, so the transfer to
      new tasks is the reported quantity.
    source: src-arxiv-1909-12271-v1
    quote: There must be no prior knowledge of the unseen tasks given to the system that are not
      included in the training tasks.
  sample-efficiency:
    reason: The same challenge fixes the budget of demonstrations of each unseen task (K-shot) and
      scores success at 1, 5 and 20 demonstrations.
    source: src-arxiv-1909-12271-v1
    quote: Users report 1-shot, 5-shot, and 20-shot results for their method.
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: Some tasks are multi-stage and demonstrations run from 100 to 1000 timesteps, but long
      horizons are one tier of a range from reaching upward, not the benchmark's claim.
    source: src-arxiv-1909-12271-v1
    quote: The tasks lengths vary from 100 to 1000 timesteps.
  - term: perception
    reason: Policies act from images, and the README warns against low-dimensional state, but the
      score is task success, not what was recovered from the images.
    source: src-github-rlbench-readme
    quote: Although each task does supply a low-dimensional output this should be used with extreme
      caution!

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every reported number is the share of simulated episodes in which the task's success
    conditions were met, on new episodes of the task.
  source: src-arxiv-1909-12271-v1
  quote: success should be reported on new episodes of that same task
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: Episodes return a reward, but it is the sparse +1 for completion (shaped rewards exist
      for two tasks only), so the reported quantity is success, not return.
    source: src-arxiv-1909-12271-v1
    quote: Each task has a completely sparse reward of +1 which is given only on task completion.
designed_for_subjects:
  - rl-policy
  - classical-algorithm
designed_for_subjects_basis:
  reason: The paper names reinforcement, imitation, few-shot and multi-task learners as entrants
    (rl-policy, which covers behaviour cloning as in LIBERO's entry), and sets out to compare
    classical, modular manipulation systems on the same tasks, which can enter with no learned
    component.
  source: src-arxiv-1909-12271-v1
  quote: whilst also allowing classical systems to be compared
as_used:
  - protocol: Multi-task behaviour cloning on PerAct's 18-task, 249-variation set derived from
      RLBench, scored by average success over 25 evaluation episodes per task, from 10 or 100
      demonstrations per task and at most 25 keyframe actions per episode. Neither designed protocol
      (the few-shot challenge or the README's task sets) is what later papers report.
    source: src-arxiv-2209-05451-v2
    quote: We report average success rates on 25 evaluation episodes per task
    note: BridgeVLA (2025) reports average success on RLBench rising from 81.4% to 88.2% without
      naming the task set in its abstract; the 18-task set is the usual one in this line of work but
      that is not read from its abstract.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced on RLBench, among them BridgeVLA's in 2025 (88.2% average
    success). The maintainers' repository was last pushed on 2025-01-25 (a typo fix, GitHub API),
    and its newest dated announcement is from May 2022, which is maintenance evidence rather than
    disuse.
  source: src-arxiv-2506-07961
  quote: In RLBench, it improves the average success rate from 81.4% to 88.2%.
activity: no-submission-channel
activity_basis:
  reason: The site links the paper, the code, a presentation and tutorials, and no leaderboard,
    results page or submission route; the README invites contributed tasks, not results. Results
    appear in users' papers.
  source: src-rlbench-site
  quote: 'Code: https://github.com/stepjam/RLBench ICRA 2020 Presentation Task Creation Tutorials'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: BridgeVLA
    source: src-arxiv-2506-07961
    observed_on: 2026-11-04
    quote: In RLBench, it improves the average success rate from 81.4% to 88.2%.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's registered success conditions (for example, an object detected
  by a proximity sensor while grasped), checked on the simulator's state.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The tasks, the task-building tools and the environment are released, and demonstrations
    can be generated on demand by motion planning, so anyone with the simulator can rerun an
    evaluation. The licence restricts use to non-commercial, internal or academic research, which
    covers a research reproduction.
  source: src-arxiv-1909-12271-v1
  quote: come from using the Open Motion Planning Library

task:
  exists: true
  input:
    - proprioception (joint angles, velocities and torques, gripper pose) and RGB, depth and
      segmentation masks from an over-the-shoulder stereo camera and a wrist camera (128 x 128 by
      default), with the variation's textual descriptions; for the few-shot challenge, K
      demonstrations of each unseen task
  output: Arm and gripper actions in one of the chosen action modes (joint velocities, positions or
    torques, or end-effector velocities or poses, absolute or delta), step by step until the task
    completes or the episode ends.
  scoring: Success rate on new episodes of each task (sparse +1 on completion); the few-shot
    challenge reports it at 1, 5 and 20 demonstrations of each unseen test task.
  source: src-arxiv-1909-12271-v1
  quote: Users have a wide variety of action spaces at their disposal

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The package, tasks and task sets install from the public repository without an account
      or click-through, and demonstrations are generated locally. The repository's licence binds on
      download and limits use to non-commercial research, which restricts use but gates no copy (see
      review_checks).
    source: src-github-rlbench-readme
    quote: pip install git+https://github.com/stepjam/RLBench.git
  refresh: versioned-releases
  refresh_basis:
    reason: Changes come as labelled package versions and dated README announcements (version 1.2.0
      on 18 February 2022, shaped rewards for two tasks on 11 May 2022), and task sets carry a
      version suffix (FS10_V1, MT15_V1). The paper planned newer challenge versions as tasks grew.
      New tasks arrive by pull request, which a version label does not always mark (see
      review_checks).
    source: src-github-rlbench-readme
    quote: 'Note: This release will cause code-breaking API changes for action modes.'
  data_provenance:
    - expert-authored
    - simulation-generated
  data_provenance_note: The tasks were hand-designed by the authors with the task-building tool, and
    their episodes are run in the simulator; training demonstrations are generated by motion
    planning (OMPL) on each task's waypoints, not collected from people.
  data_provenance_source: src-arxiv-1909-12271-v1
  data_provenance_quote: The benchmark includes 100 completely unique, hand-designed tasks ranging
    in
  contamination_risk: unknown
  contamination_risk_note: Episodes are drawn afresh in closed loop, and training on generated
    demonstrations of the evaluated tasks is the multi-task protocol, not contamination. Under the
    few-shot challenge, prior knowledge of the test tasks is ruled out, but whether pretraining
    mixtures of later policies include RLBench data was not assessed.
  contamination_evidence: []
  dataset_licence: Imperial College London's RLBench licence agreement (non-commercial, internal or
    academic research use)
  dataset_licence_note: The repository has one licence, for the software including its task files;
    no separate licence for demonstration data was found. The task models came from third-party
    model sites (README acknowledgements), whose terms were not read.
  dataset_licence_source: src-github-rlbench-licence
  dataset_licence_quote: You may use the Software solely for non-commercial, internal or academic
    research purposes
  size:
    - count: 100
      unit: hand-designed tasks
      subset: RLBench as released (v1)
      note: GitHub lists 107 Python files in rlbench/tasks at commit 02720bb, one of them
        __init__.py (API, read 2026-11-04), so the current count may be above 100; not quoted.
      source: src-arxiv-1909-12271-v1
      quote: The benchmark includes 100 completely unique, hand-designed tasks ranging in
  size_note: Each task has one or more variations and an unbounded number of episodes per variation;
    the paper does not give a variation total.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Dyson Robotics Lab at Imperial College London
  maintainer_basis:
    reason: The site names the lab as the authors' affiliation, and the repository's licence makes
      Imperial College London the licensor that keeps all rights. The repository itself sits in the
      first author's personal GitHub account (stepjam).
    source: src-rlbench-site
    quote: Dyson Robotics Lab, Imperial College London
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results page of the maintainers'; results appear in
    users' papers. Contributed tasks go to the task repository by pull request, after the task
    validator passes.
  independence_flags: []
  independence_flags_note: None recorded. The work was supported by Dyson Technology Ltd., which is
    not an evaluated party in the sources read. With no ranking there is no board for the
    maintainers to compete on; the first author's later methods (C2FARM-BC among them) are reported
    on RLBench in papers like anyone's.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: CoppeliaSim 4.1.0 (the Edu build the README downloads for Ubuntu 20.04), driven
    through PyRep (4.1.0.3 at its head commit, installed from git unpinned), on Linux only; the
    paper's release ran on V-REP, CoppeliaSim's predecessor. Headless runs need an X server on a
    GPU, which the README sets up.
  compute_tier_source: src-github-rlbench-readme
  compute_tier_quote: RLBench is built around CoppeliaSim v4.1.0 and
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside CoppeliaSim 4.1 through PyRep, which PyRep
      requires and supports on Linux only.
    source: src-github-pyrep-readme
    quote: PyRep requires version **4.1** of CoppeliaSim.
  reproducibility_blockers:
    - specific-simulator-build
  reproducibility_blockers_note: Scores are defined inside CoppeliaSim 4.1 with PyRep's bindings;
    the release paper's results were on V-REP, and PyRep is installed unpinned from its default
    branch, so a claim needs the CoppeliaSim and PyRep versions beside it.
  harness_availability: official-harness
  harness: rlbench (the Environment and TaskEnvironment classes, whose tasks register their own
    success conditions)
  harness_source: src-arxiv-1909-12271-v1
  harness_quote: Users will interface with the benchmark and learning environment through the
    Environment class.
  code_licence: Imperial College London's RLBench licence agreement (non-commercial, internal or
    academic research use; BSD terms for BSD elements)
  code_licence_note: GitHub's licence metadata reports NOASSERTION (API, read 2026-11-04). PyRep is
    MIT-licensed; CoppeliaSim's Edu licence was not read.
  code_licence_source: src-github-rlbench-licence
  code_licence_quote: You may use the Software solely for non-commercial, internal or academic
    research purposes
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile (simulator, simulator_version, subset_used, n_samples, ...): the scores depend on
  # the simulator chain, CoppeliaSim 4.1.0 (V-REP for the 2019 paper) driven through PyRep (4.1.0.3 at its head,
  # installed unpinned), so simulator and simulator_version name both. Then the task set (the few-shot challenge's
  # split, a README task set such as FS10_V1 or MT15_V1, or PerAct's derived 18 tasks), how many demonstrations the
  # policy learned from (K per unseen task, or per training task), the number of evaluation episodes per task, and
  # the step limit per episode (25 keyframe actions in PerAct's protocol). The arm stays the Franka Panda for
  # benchmarking, and the camera set and image size (128 x 128 by default) go in the claim's notes.
  material_extra:
    - simulator
    - simulator_version
    - subset_used
    - training_data_policy
    - n_samples
    - max_steps

homepage: https://sites.google.com/view/rlbench
repository: https://github.com/stepjam/RLBench

versions:
  - version: '1.0'
    label: RLBench as released with the paper (few-shot challenge v1.0), on V-REP and PyRep
    version_kind: revision
    released: 2019-09-26
    items: 100
    changes: The first release, with 100 tasks, the task-building tools, motion-planned
      demonstrations and the few-shot challenge v1.0, built around V-REP and PyRep.
    breaking: false
    superseded_by: 1.2.0
    frozen: true
    sources:
      - src-arxiv-1909-12271-v1
      - src-arxiv-1909-12271
  - version: 1.2.0
    label: RLBench 1.2.0, on CoppeliaSim 4.1.0 and PyRep
    version_kind: revision
    released: 2022-02-18
    changes: Code-breaking API changes for action modes; the README now builds RLBench around
      CoppeliaSim 4.1.0. Shaped rewards for two tasks followed on 2022-05-11. When V-REP gave way to
      CoppeliaSim is undated in the sources read.
    breaking: false
    supersedes_version: '1.0'
    frozen: false
    sources:
      - src-github-rlbench-readme
      - src-github-pyrep-readme
      - src-github-pyrep-init

subsets:
  - id: rlbench#few-shot-task-sets
    label: Few-shot task sets (FS10_V1, FS25_V1, FS50_V1, FS95_V1)
    scored_separately: true
    evidence:
      - source: src-github-rlbench-readme
        quote: collection of X training tasks and 5 tests tasks. Here X can be 10, 25, 50, or 95.
      - source: src-arxiv-1909-12271-v1
        quote: 10% of the tasks have been selected for the test set (meta-test)
    notes: The README's task sets for the few-shot challenge, each with 10, 25, 50 or 95 training
      tasks and 5 test tasks. The paper planned 10% of the 100 tasks (ten) for the test set, so the
      released split differs from the paper's (see review_checks).
  - id: rlbench#multi-task-task-sets
    label: Multi-task task sets (MT15_V1, MT30_V1, MT55_V1, MT100_V1)
    scored_separately: true
    evidence:
      - source: src-github-rlbench-readme
        quote: collection of X training tasks. Here X can be 15, 30, 55, or 100.
      - source: src-arxiv-1909-12271-v1
        quote: all tasks from both meta-training and meta-testing can be used during training
    notes: The README's task sets for multi-task learning, with 15, 30, 55 or 100 training tasks;
      the paper's multi-task setting trains on all tasks and tests on unseen episodes of them.

lineage:
  role: root
  forks:
    # Another maintainer's derivative: PerAct's authors selected 18 RLBench tasks, added variations to some of them,
    # and fixed an evaluation protocol that most later papers use.
    - id: rlbench-18
      maintainer: The PerAct authors (University of Washington and NVIDIA)
      source: src-arxiv-2209-05451-v2
      quote: we train a single multi-task Transformer for 18 RLBench tasks (with 249 variations)
lineage_note: Only the derivative a source read here states. GemBench, COLOSSEUM (which BridgeVLA's
  abstract names beside RLBench) and other RLBench-based suites by other groups were not read and
  are separate benchmarks.

tags:
  - manipulation
  - simulation
  - few-shot-learning
  - imitation-learning
  - reinforcement-learning
  - multi-task-learning

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1909-12271-v1
    - src-arxiv-1909-12271
    - src-crossref-10-1109-lra-2020-2974707
    - src-github-rlbench-readme
    - src-github-rlbench-licence
    - src-rlbench-site
    - src-github-pyrep-readme
    - src-github-pyrep-init
    - src-arxiv-2209-05451-v2
    - src-arxiv-2506-07961
  sources_note: >
    The paper's v1 PDF and PerAct's v2 PDF (DOIs, not archived) read as text; the RLBench abstract page
    for the date; Crossref's JSON record of the IEEE RA-L version (a DOI) for the venue; the README and
    LICENSE at commit 02720bb and PyRep's README and version file at commit 8f420be, as raw text; the
    project site with scripts and styles stripped; and BridgeVLA's abstract page as evidence of current
    use.
  confidence: medium
  review_checks:
    - check: Identity. Most later results are on PerAct's 18-task set, not on either protocol
        RLBench's maintainers designed. The entry records that set as a fork (rlbench-18, no entry
        yet) because another group selected the tasks, modified some and fixed the protocol. A
        subset of rlbench is the alternative, as are the as_used row alone or the fork's own entry;
        the fork's id is a placeholder for the lead.
      field: lineage.forks
      source: src-arxiv-2209-05451-v2
      quote: include additional variations to stress-test multi-task and language-grounding
        capabilities
    - check: capability and designed_for_subjects follow the paper's few-shot challenge
        (transfer-learning, sample-efficiency); the dominant multi-task use on 18 tasks tests
        neither. As with LIBERO, the design decides, and the as_used row records the use.
      field: capability
      source: src-arxiv-1909-12271-v1
      quote: Users report 1-shot, 5-shot, and 20-shot results for their method.
    - check: The few-shot split differs between sources. The paper puts 10% of the 100 tasks (ten)
        in the test set, and the README's task sets have 5 test tasks each. Which one a result used
        needs recording in subset_used.
      field: subsets
      source: src-github-rlbench-readme
      quote: collection of X training tasks and 5 tests tasks. Here X can be 10, 25, 50, or 95.
    - check: The simulator chain moved from V-REP (the paper) to CoppeliaSim 4.1.0 (the README),
        with PyRep between, installed unpinned from git. The switch is undated, and versions 1.0 and
        1.2.0 are both modelled as non-breaking revisions. Whether 1.2.0's action-mode API change,
        or the simulator switch, makes earlier scores incomparable (breaking) was not established.
      field: versions
      source: src-arxiv-1909-12271-v1
      quote: The benchmark and learning environment is built around a V-REP [37] and PyRep [12]
        interface.
    - check: PyRep is installed from its git default branch with no pin (setup.py, read but not made
        a Source because it carries a contact address). Its head reports 4.1.0.3, which the compute
        note records. A claim should name the PyRep commit beside CoppeliaSim's version, and older
        claims may have run other PyRep commits.
      field: execution.compute_tier
      source: src-github-pyrep-init
      quote: __version__ = '4.1.0.3'
    - check: PerAct's set runs on the same chain, but its paper names CoppeliaSim and PyRep without
        versions in the passage read, so simulator_version for a result on it has to come from
        elsewhere (its code release was not read).
      field: comparability.material_extra
      source: src-arxiv-2209-05451-v2
      quote: The simulation is set in CoppelaSim [79] and interfaced through PyRep [80].
    - check: data.access fully-open rests on the public pip install. The licence says downloading
        binds the user to its terms (non-commercial research only, no sharing with users who have
        not accepted), so gated-registration, or licence-restriction as a blocker, are alternatives.
      field: data.access
      source: src-github-rlbench-licence
      quote: BY EXERCISING THE OPTION TO DOWNLOAD THE SOFTWARE YOU AGREE TO BE BOUND BY THE TERMS OF
        THE AGREEMENT.
    - check: The licence's publication clause asks that results be published naming the Software and
        its licence from Imperial College London, and that a copy go to Imperial; whether that
        conditions use enough to note on result claims.
      field: execution.code_licence
      source: src-github-rlbench-licence
      quote: provided that any such presentation or publication identifies the Software as the
        source of the results or the data
    - check: maintainer_type academic-lab rests on the licence (Imperial College London as licensor)
        and the site's affiliation. The repository sits in the first author's personal account and
        has had only small merges since 2022, so individual is the alternative.
      field: governance.maintainer_type
      source: src-github-rlbench-licence
      quote: Imperial College of Science, Technology and Medicine
    - check: refresh versioned-releases. Tasks are added by pull request without a stated version
        bump, and the task count in the repository (106 task files by the GitHub listing) may exceed
        the paper's 100; static is the alternative if the task set has in fact been fixed since
        1.2.0.
      field: data.refresh
      source: src-github-rlbench-readme
      quote: New tasks using our task building tool, in addition to bug fixes, are very welcome!

# data/benchmarks/robotics-embodiment/maniskill.yaml
#
# P1-S5-T01, robotics-embodiment entry 9 of 9. Filled from the ManiSkill3 paper, arXiv 2410.00425 read as its v2
# PDF (2025-05-30, RSS 2025), and its abstract page; the ManiSkill2 paper, arXiv 2302.04659 read as its v1 PDF
# (ICLR 2023); the original ManiSkill paper's abstract page (arXiv 2107.14483, NeurIPS 2021 Datasets and
# Benchmarks); the repository README; three documentation pages (reinforcement-learning setup and baselines,
# learning-from-demonstrations setup); the ManiSkill2 project page; and the abstract page of ReMAP-DP (arXiv
# 2603.14977), a 2026 paper that reports on ManiSkill3. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: maniskill
name: ManiSkill
aliases:
  - ManiSkill2
  - ManiSkill3
  - SAPIEN Manipulation Skill Benchmark
tagline: Simulated robot manipulation tasks with success conditions, in three editions since 2021;
  the third is GPU-parallelised.
description: >
  A simulation framework and benchmark for robot manipulation built on the SAPIEN simulator, from Hao
  Su's
  lab at UC San Diego. It has had three editions. ManiSkill (2021) benchmarked manipulation of objects
  with
  large shape variation from ego-centric point clouds or RGB-D. ManiSkill2 (ICLR 2023) defined 20 task
  families (stationary and mobile-base, single and dual-arm, rigid and soft-body), each with a success
  condition and an evaluation protocol on training and held-out objects, and ran a challenge scored by
  a
  cloud service that executed submitted Docker images. ManiSkill3 (RSS 2025) is a GPU-parallelised
  simulator whose tasks span 12 categories, from table-top and mobile manipulation to humanoids, dexterous
  hands and digital twins of real set-ups. Its documentation defines a standard reinforcement-learning
  benchmark (a small set of 8 tasks and a large set of 50 still in development) and one evaluation setup
  for all policies, which records whether each episode succeeded at any step (success_once) and at its
  last step. There is no leaderboard; results appear in users' papers.
self_description:
  source: src-arxiv-2410-00425-v2
  quote: ManiSkill3 introduces a state-of-the-art framework/benchmark for generalizable robotics
    simulation and rendering
external_ids:
  arxiv: '2410.00425'
paper:
  title: 'ManiSkill3: GPU Parallelized Robotics Simulation and Rendering for Generalizable Embodied AI'
  arxiv: '2410.00425'
  version_read: v2
  source: src-arxiv-2410-00425-v2
released: 2021-07-30
released_note: The original ManiSkill paper's first arXiv version, as its abstract page dates it.
  ManiSkill2's paper followed on 2023-02-09 and ManiSkill3's on 2024-10-01 (see versions).
released_source: src-arxiv-2107-14483
released_quote: Submitted on 30 Jul 2021
release_venue: NeurIPS 2021 Track on Datasets and Benchmarks
release_venue_source: src-arxiv-2107-14483
release_venue_quote: NeurIPS 2021 Track on Datasets and Benchmarks

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/manipulation
  secondary:
    - robotics-embodiment/mobile-manipulation
domain_basis:
  reason: The framework is about manipulation skills, and the scored tasks are robots changing the
    state of objects. Mobile manipulation is in the scored set of both scored editions --
    ManiSkill2's mobile-base task families, and OpenCabinetDrawer-v1 in ManiSkill3's standard
    benchmark, whose page says the set spans mobile manipulation.
  source: src-github-maniskill-readme
  quote: with a strong focus on manipulation skills
domain_considered_and_rejected:
  - term: robotics-embodiment/dexterous-manipulation
    reason: ManiSkill3 has dexterous-hand tasks, such as in-hand rotation, but none is in the
      standard benchmark's listed set, and its insertion task (PegInsertionSide) uses a parallel
      gripper, which the leaf's distinction keeps under manipulation.
    source: src-maniskill-docs-rl-baselines
    quote: 'Small Set Environment IDs: PushCube-v1, PickCube-v1, PegInsertionSide-v1, PushT-v1, HumanoidPlaceAppleInBowl-v1,
      AnymalC-Reach-v1, OpenCabinetDrawer-v1'
  - term: robotics-embodiment/locomotion
    reason: One quadruped reaching task (AnymalC-Reach-v1) is in the small set and the page names
      locomotion among the problems the set spans, but locomotion is one task of seven, outside the
      framework's manipulation claim and in no ManiSkill2 task family.
    source: src-maniskill-docs-rl-baselines
    quote: articulated object manipulation, generalizable manipulation, mobile manipulation,
      locomotion etc.
  - term: robotics-embodiment/whole-body-humanoid-control
    reason: The humanoid task in the small set (HumanoidPlaceAppleInBowl-v1) is manipulation with
      the legs fixed, so balance and manipulation are not solved together.
    source: src-arxiv-2410-00425-v2
    quote: the legs are fixed in place so that robot learning methods can focus on manipulation only
  - term: robotics-embodiment/sim2real-transfer
    reason: The paper shows sim2real and real2sim digital twins on some tasks, but as demonstrations
      of the framework; the standard benchmark is scored in simulation only.
    source: src-arxiv-2410-00425-v2
    quote: we verify sim2real and real2sim are both possible using ManiSkill3 via digital twins on
      some tasks
capability:
  - sensorimotor-control
capability_basis:
  sensorimotor-control:
    reason: A policy maps observations to actions for a simulated robot in closed loop, and an
      episode is scored on whether the simulator's resulting state meets the task's success
      condition.
    source: src-arxiv-2302-04659-v1
    quote: The user only needs to provide a function that accepts observations and returns actions
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: ManiSkill2's protocol scored held-out object sets apart from the training objects, and
      its challenge used confidential test objects, but ManiSkill3's evaluation setup draws objects
      from each task's own randomisation and reports no held-out condition.
    source: src-arxiv-2302-04659-v1
    quote: Results on held-out objects are presented in Appendix F.
  - term: sample-efficiency
    reason: ManiSkill3 tunes its baselines either for wall time or for sample efficiency, but the
      benchmark fixes no sample or step budget at which performance is scored.
    source: src-arxiv-2410-00425-v2
    quote: Configurations for baselines are tuned to minimize training wall time with no regard to
      sample efficiency

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every reported number is the share of simulated episodes that met the task's success
    condition, at any step (success_once) or at the last (success_at_end).
  source: src-maniskill-docs-rl-setup
  quote: 'success_once: Whether the task was successful at any point in the episode.'
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: The evaluation also records each episode's return, and the standard tasks have
      normalised dense rewards, but success_once is the metric that is reported.
    source: src-maniskill-docs-il-setup
    quote: is what is typically reported in research/work using ManiSkill
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: The environments are built for trained policies, with reinforcement-learning baselines
    (PPO, SAC, TD-MPC2) and learning-from-demonstrations baselines (behaviour cloning, Diffusion
    Policy, ACT, RLPD, RFCL); vision-language-action models are evaluated through digital twins.
    LIBERO's and RoboCasa's entries tag such entrants the same way.
  source: src-arxiv-2410-00425-v2
  quote: ManiSkill3 also provides a comprehensive set of baselines that span popular RL and
    learning-from-demonstrations algorithms

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced on ManiSkill3, among them ReMAP-DP's in March 2026, and
    the repository was last pushed on 2026-08-04 (GitHub API).
  source: src-arxiv-2603-14977
  quote: On ManiSkill 3, our method yields a 28% improvement over DP3 on the geometrically
    challenging Stack Cube task
activity: closed
activity_basis:
  reason: The family's route for outside results was a challenge tied to ManiSkill2, whose code is
    now frozen at the v0.5.3 tag; ManiSkill3's README and documentation offer no leaderboard,
    challenge or submission route. The call is inferred (see review_checks).
  source: src-arxiv-2302-04659-v1
  quote: Since we will hold a public challenge based on ManiSkill2, code related to asset generation
    and cloud-based evaluation service cannot be released for fairness
events:
  - name: ManiSkill challenge (2021)
    kind: online-challenge
    source: src-arxiv-2107-14483
    quote: a challenge facing interdisciplinary researchers will be held based on the benchmark
  - name: ManiSkill2 Challenge 2022
    kind: online-challenge    # cloud evaluation of submitted Docker images, results on a public board
    source: src-arxiv-2302-04659-v1
    quote: 'Challenge website: https://sapien.ucsd.edu/challenges/maniskill/2022/'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: ReMAP-DP
    source: src-arxiv-2603-14977
    observed_on: 2026-10-14
    quote: On ManiSkill 3, our method yields a 28% improvement over DP3 on the geometrically
      challenging Stack Cube task
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's success condition, checked on the simulator's state;
  ManiSkill2's PickCube, for one, succeeds when the cube is within 2.5 cm of the goal and the robot
  is static.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The simulator, tasks, assets, demonstrations, baselines and evaluation code are released,
    the environments under permissive licences and the assets under CC BY-NC 4.0.
  source: src-github-maniskill-readme
  quote: All rigid body environments in ManiSkill are licensed under fully permissive licenses
    (e.g., Apache-2.0).

task:
  exists: true
  input:
    - state, RGB-D, segmentation or point-cloud observations from a simulated robot (arm, mobile
      manipulator, humanoid or hand), with the goal where it is not visible
  output: Actions in the robot's chosen controller space, step by step, until the episode's time
    limit.
  scoring: Per task, the share of evaluation episodes whose success condition held at any step
    (success_once, the reported metric) or at the last step (success_at_end), with partial resets
    off and every parallel environment reconfigured on reset.
  source: src-maniskill-docs-rl-setup
  quote: Partial resets are turned off and environments do not reset upon success/fail/termination

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The package, assets and demonstrations install and download without an account.
      ManiSkill2's challenge kept confidential test objects, but the current edition decides, and
      ManiSkill3 has no withheld set.
    source: src-github-maniskill-readme
    quote: Installation of ManiSkill is extremely simple, you only need to run a few pip installs
      and setup Vulkan for rendering
  refresh: versioned-releases
  refresh_basis:
    reason: Editions are labelled package versions (ManiSkill2 is mani_skill 0.5.3 and lower,
      ManiSkill3 is 3.0.0 and later, per the README's citation notes), and every task id carries a
      version suffix (PickCube-v1).
    source: src-github-maniskill-readme
    quote: Users looking for the original ManiSkill2 can find the commit for that codebase at the
      [v0.5.3 tag]
  data_provenance:
    - simulation-generated
  data_provenance_note: Episodes and their success are computed in the SAPIEN-based simulator; the
    training demonstrations come from motion planning, RL policies and teleoperation.
  data_provenance_source: src-arxiv-2410-00425-v2
  data_provenance_quote: millions of demonstration frames are provided from motion planning, RL, and
    teleoperation
  contamination_risk: unknown
  contamination_risk_note: Scoring is closed-loop with randomised initial states, and training on
    the demonstrations is the protocol. Not assessed is whether large robot-policy pretraining
    mixtures include ManiSkill data; the ManiSkill3 paper notes that RDT-1B trained on ManiSkill2's
    datasets.
  contamination_evidence: []
  dataset_licence: CC-BY-NC-4.0
  dataset_licence_note: The README licenses the assets so; it states no licence for the
    demonstration datasets.
  dataset_licence_source: src-github-maniskill-readme
  dataset_licence_quote: The assets are licensed under [CC BY-NC 4.0]
  size:
    - count: 8
      unit: tasks in the standard reinforcement-learning benchmark's small set
      subset: ManiSkill3 standard benchmark, small set
      note: The page lists seven environment ids for it.
      source: src-maniskill-docs-rl-baselines
      quote: The standard benchmark for RL in ManiSkill consists of two groups, a small set of 8
        tasks, and a large set of 50 tasks, both with state based and visual based settings.
    - count: 50
      unit: tasks in the standard benchmark's large set, still being developed
      subset: ManiSkill3 standard benchmark, large set
      source: src-maniskill-docs-rl-baselines
      quote: The large set is still being developed and tested.
    - count: 12
      unit: task categories
      subset: ManiSkill3
      source: src-arxiv-2410-00425-v2
      quote: Concretely we categorize the 12 distinct categories as follows
    - count: 20
      unit: task families
      subset: ManiSkill2
      source: src-arxiv-2302-04659-v1
      quote: ManiSkill2 includes 20 manipulation task families with 2000+ object models and 4M+
        demonstration frames

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ManiSkill contributors (the mani-skill GitHub organisation), led from Hao Su's lab
    at UC San Diego and Hillbot
  maintainer_basis:
    reason: The documentation is copyrighted to "ManiSkill Contributors", and the repository sits in
      the mani-skill organisation, which GitHub describes as a community for developing the
      framework (created 2026-06-07, GitHub API). ManiSkill3's authors are at UC San Diego, Hillbot
      and four other institutions; ManiSkill2's code was in the haosulab account.
    source: src-maniskill-docs-rl-setup
    quote: Copyright 2024, ManiSkill Contributors
  maintainer_type: community-collective
  submission_process:
    - literature-only
  submission_process_note: ManiSkill3 has no leaderboard, results page or route for outside results;
    the maintainers link Weights & Biases pages of their own baseline runs from the documentation,
    and users report in their own papers. ManiSkill2's challenge took Docker images and showed the
    results on a public board (see history).
  independence_flags: []
  independence_flags_note: None recorded. With no ranking there is no board for the maintainers to
    compete on; their baselines are reported beside users' results in papers. The ManiSkill3 paper
    acknowledges support from Qualcomm Embodied AI Fund and Hillbot Inc., neither an evaluated party
    in the sources read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside ManiSkill's own SAPIEN-based simulator, whose
      GPU simulation the README supports on Linux with NVIDIA GPUs.
    source: src-arxiv-2410-00425-v2
    quote: We introduce and open source ManiSkill3, the fastest state-visual GPU parallelized
      robotics simulator with contact-rich physics targeting generalizable manipulation
  harness_availability: official-harness
  harness: mani_skill (ManiSkillVectorEnv or CPUGymWrapper with record_metrics, as the
    documentation's evaluation setup gives them)
  harness_source: src-maniskill-docs-rl-setup
  harness_quote: The code to fairly evaluate policies and record standard metrics in ManiSkill are
    shown below.
  code_licence: Apache-2.0
  code_licence_note: The README names Apache-2.0 as an example of the environments' permissive
    licences; GitHub's licence metadata for mani-skill/ManiSkill reports Apache-2.0 (read
    2026-10-14).
  code_licence_source: src-github-maniskill-readme
  code_licence_quote: All rigid body environments in ManiSkill are licensed under fully permissive
    licenses (e.g., Apache-2.0).
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and task set (ManiSkill2's families, ManiSkill3's small or large
  # standard set, or other tasks), what the policy learned from (number, type and source of demonstrations, or
  # online RL), how many evaluation episodes, and the episode horizon success_once is counted over.
  material_extra:
    - subset_used
    - training_data_policy
    - n_samples
    - max_steps

homepage: https://maniskill.ai/
repository: https://github.com/mani-skill/ManiSkill

versions:
  - version: maniskill1
    label: ManiSkill (SAPIEN Manipulation Skill Benchmark), NeurIPS 2021
    version_kind: edition
    released: 2021-07-30
    changes: The first release, benchmarking manipulation of objects with large shape variation from
      point clouds or RGB-D, with demonstrations and a challenge.
    breaking: true
    superseded_by: maniskill2
    frozen: true
    sources:
      - src-arxiv-2107-14483
  - version: maniskill2
    label: ManiSkill2 (mani_skill 0.5.3 and lower), ICLR 2023
    version_kind: edition
    released: 2023-02-09
    items: 20
    changes: 20 task families (stationary and mobile-base, single and dual-arm, rigid and
      soft-body), a unified evaluation protocol on training and held-out objects, and a
      cloud-evaluated challenge.
    breaking: true
    supersedes_version: maniskill1
    superseded_by: maniskill3
    frozen: true
    sources:
      - src-arxiv-2302-04659-v1
      - src-github-maniskill-readme
  - version: maniskill3
    label: ManiSkill3 (mani_skill 3.0.0 and later), RSS 2025
    version_kind: edition
    released: 2024-10-01
    changes: GPU-parallelised simulation and rendering, tasks in 12 categories, a standard
      reinforcement-learning benchmark (a small and a large set) and one evaluation setup for all
      policies.
    breaking: true
    supersedes_version: maniskill2
    frozen: false
    sources:
      - src-arxiv-2410-00425
      - src-arxiv-2410-00425-v2
      - src-github-maniskill-readme
      - src-maniskill-docs-rl-baselines

history:
  - event: channel-opened
    field: governance.submission_process
    to: containerized-algorithm-submission
    source: src-arxiv-2302-04659-v1
    quote: User submissions are in the form of docker images
    note: ManiSkill2's challenge, scored by the maintainers' cloud evaluation and shown on a public
      board. Undated in the sources read; the challenge's site is under /2022/, and the ManiSkill2
      page says challenges have run since 2021.
  - event: channel-closed
    field: governance.submission_process
    from: containerized-algorithm-submission
    to: literature-only
    source: src-github-maniskill-readme
    quote: Users looking for the original ManiSkill2 can find the commit for that codebase at the
      [v0.5.3 tag]
    note: Undated and inferred. ManiSkill2 is frozen and ManiSkill3 names no route; the challenge
      site did not respond on 2026-10-14.
  - event: repository-moved
    field: repository
    from: https://github.com/haosulab/ManiSkill2
    to: https://github.com/mani-skill/ManiSkill
    source: src-arxiv-2302-04659-v1
    quote: 'Codes: https://github.com/haosulab/ManiSkill2'
    note: Undated in the sources read; GitHub reports the mani-skill organisation created on
      2026-06-07.

tags:
  - manipulation
  - mobile-manipulation
  - simulation
  - gpu-parallel-simulation
  - reinforcement-learning
  - imitation-learning

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2410-00425-v2
    - src-arxiv-2410-00425
    - src-arxiv-2302-04659-v1
    - src-arxiv-2107-14483
    - src-github-maniskill-readme
    - src-maniskill-docs-rl-setup
    - src-maniskill-docs-rl-baselines
    - src-maniskill-docs-il-setup
    - src-maniskill2-site
    - src-arxiv-2603-14977
  sources_note: >
    The ManiSkill3 paper's v2 PDF and the ManiSkill2 paper's v1 PDF (DOIs, not archived) read as text;
    the
    abstract pages of ManiSkill3 and of the original ManiSkill for dates and venue; the README at main;
    three documentation pages and the ManiSkill2 project page with scripts and styles stripped; and
    ReMAP-DP's abstract page as evidence of current use.
  confidence: medium
  review_checks:
    - check: Identity. ManiSkill3 calls itself a framework/benchmark and says its core contribution
        is task support rather than a task count; the entry is a benchmark because the documentation
        fixes a standard task set and one evaluation setup, and ManiSkill2 was a benchmark with a
        protocol and a challenge. ManiSkill2 could instead be its own entry, with ManiSkill3 left as
        a simulator.
      field: versions
      source: src-arxiv-2410-00425-v2
      quote: while ManiSkill3 may not have the most distinct number of tasks compared to some
        benchmarks, the core contribution is supporting a diverse array of possible tasks
    - check: The standard benchmark's small set is called 8 tasks but seven ids are listed, and the
        large set of 50 is not listed and still in development; which set a result used needs
        recording.
      field: data.size
      source: src-maniskill-docs-rl-baselines
      quote: 'Small Set Environment IDs: PushCube-v1, PickCube-v1, PegInsertionSide-v1, PushT-v1, HumanoidPlaceAppleInBowl-v1,
        AnymalC-Reach-v1, OpenCabinetDrawer-v1'
    - check: mobile-manipulation is secondary on one small-set task (OpenCabinetDrawer-v1) and
        ManiSkill2's mobile-base families; locomotion was rejected although the same sentence names
        it.
      field: domain
      source: src-maniskill-docs-rl-baselines
      quote: articulated object manipulation, generalizable manipulation, mobile manipulation,
        locomotion etc.
    - check: activity closed is inferred. The ManiSkill2 page still invites entrants to the
        challenge, beside its ManiSkill 3 announcement, and the challenge site did not respond on
        2026-10-14; unknown is the alternative. Later challenges others ran on ManiSkill
        environments were not checked.
      field: activity
      source: src-maniskill2-site
      quote: Join the ongoing ManiSkill 2 Challenge!
    - check: maintainer_type community-collective rests on the docs' "ManiSkill Contributors" and
        the new community organisation; academic-lab (Hao Su's lab at UC San Diego, with Hillbot) is
        the alternative.
      field: governance.maintainer_type
      source: src-maniskill-docs-rl-setup
      quote: Copyright 2024, ManiSkill Contributors
    - check: The documentation links Weights & Biases results of baselines the maintainers ran;
        whether that is a results table that makes it maintainer-run rather than literature-only.
      field: governance.submission_process
      source: src-maniskill-docs-rl-baselines
      quote: The results link takes you to the respective wandb pages for the results.

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2506-04218-v3
    - src-arxiv-2506-04218
    - src-arxiv-2406-15349-v2
    - src-arxiv-2406-15349
    - src-github-navsim-readme
    - src-github-navsim-metrics
    - src-github-navsim-splits
    - src-github-navsim-submission
    - src-github-navsim-install
    - src-github-navsim-v1-1-metrics
    - src-hf-navsim-navhard-info
    - src-hf-navsim-navhard-leaderboard
    - src-hf-navsim-navtest-info
    - src-hf-navsim-navtest-leaderboard
    - src-opendrivelab-challenge2025
    - src-hf-api-openscene
    - src-arxiv-2610-20604
  sources_note: >
    The two papers' PDFs (DOIs, not archived) read as text, and their abstract pages for dates and venues;
    the README and four documents at commit 0a380a9 and the v1.1 branch's metrics document; the two leaderboard
    Spaces read as the JSON their pages load (overview by GET, the public table by POST), since both render
    by script; OpenDriveLab's 2025 challenge page with scripts and styles stripped; Hugging Face's API
    record of OpenScene; and VITAL's abstract page as evidence of current use. The submission guide, both
    leaderboard tables and the OpenDriveLab page are withheld from archiving for personal data.
  confidence: medium
  review_checks:
    - check: Family inclusion. The scored outcome is the simulated execution of a committed 4-second
        trajectory, not of closed-loop control, so whether it is "produced by embodied action" is
        arguable. autonomous-driving-planning's definition (a trajectory scored on the driving
        outcome) fits it, and the taxonomy files cite this benchmark as planning, not sensorimotor
        control; no other family claims it.
      field: domain
      source: src-arxiv-2406-15349-v2
      quote: This means driving agents are only queried in the initial frame of each scene.
    - check: evaluation_method follows the corpus (composite and constraint-check).
        simulation-rollout is the alternative, since every subscore comes from a simulated execution
        and CARLA's driving score is that term's example; the missing pseudo-simulation term is open
        failure 2026-09-28-navsim-v2-002.
      field: evaluation_method
    - check: Versions. v2 is an edition by the 04 S4 rule (same maintainer and task, new test
        items), but it also changes the metric (EPDMS) and the simulation (IDM-reactive vehicles, a
        second stage), and taxonomy/ cites the corpus item as `navsim-v2`. A separate navsim-v2
        entry linked by lineage, or v1 and v2 as track-sets (both boards are live and both splits
        are scored under v2's devkit), are the alternatives.
      field: versions
      source: src-arxiv-2506-04218-v3
      quote: we release NAVSIM v2, a framework for benchmarking autonomous driving built upon our
        proposed evaluation methodology
    - check: Sources disagree on reactivity. The v2 paper and the 2025 challenge page make
        background vehicles react through IDM, while the navhard board's overview still describes
        NAVSIM as non-reactive, and v1's documents describe log replay. The description follows the
        papers.
      field: description
      source: src-arxiv-2506-04218-v3
      quote: Background vehicles (represented as oriented bounding boxes) respond to the ego agent
        using a rule-based planner called the Intelligent Driver Model (IDM) [43].
    - check: reproducibility_tier is automatable-with-simulator with the specific-simulator-build
        blocker, treating the devkit's own simulation as the simulator (as ManiSkill's entry does);
        the corpus record chose fully-automatable. compute_tier stays null (open failure
        2026-09-28-navsim-v2-011).
      field: execution.reproducibility_tier
    - check: navtest looks saturated. The navtest board's top row (96.19 PDMS, 2026-10-17) is above
        the logged human's 94.8 in the v1 paper's Table 1, and the v1 paper's own 10-point gap to
        the human has closed. saturated is derived and needs claims; navhard (top 64.58 EPDMS) is
        far from its bound.
      field: lifecycle
      source: src-arxiv-2406-15349-v2
      quote: The 10 PDMS discrepancy to the human operator demonstrates that navtest poses
        challenges even to well-studied end-to-end architectures.
    - check: open-source-gated rests on a stated periodic removal (about every 6 months) on both
        boards; whether it is enforced was not checked. The corpus record left the term off because
        it read the rule only for the 2024 board; the navhard overview states it too.
      field: governance.submission_process
      source: src-hf-navsim-navhard-info
      quote: do not provide associated open-source training and inference code with the
        corresponding pre-trained checkpoints
    - check: Independence. NVIDIA won the CVPR 2025 phase, and NVIDIA Research is a co-author
        affiliation of both papers; the rules bar a track's organisers from its awards. Whether the
        winning team overlaps the authors was not checked; maintainer-competes-on-own-benchmark
        rests on the maintainers' baselines on their boards.
      field: governance.independence_flags
      source: src-opendrivelab-challenge2025
      quote: The outstanding Champion goes to team NVIDIA.
    - check: The metric changed after the challenge (the 2025-09-29 human-filter bugfix, on main
        after v2.2), and which devkit commit each board's server runs is not stated, so navhard rows
        before and after that date may not be comparable.
      field: versions
      source: src-github-navsim-readme
      quote: '[2025/09/29]`** Bugfix'
    - check: activity and lifecycle now rest on dated leaderboard rows and October 2026 papers,
        which answers the corpus's open source-silent failures 2026-09-28-navsim-v2-007 (lifecycle)
        and -008 (activity); the lead may close them. No 2026 round was found.
      field: activity
    - check: Both leaderboard tables were read by POST and are withheld (personal handles in rows),
        so they cannot be archived; the entry's DOI sources carry the rest. dataset_licence is the
        OpenScene repository's tag; nuPlan's own licence, which the installation guide points to,
        was not read.
      field: data.dataset_licence

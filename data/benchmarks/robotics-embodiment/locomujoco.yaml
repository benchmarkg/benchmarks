# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2311-02496-v2
    - src-arxiv-2311-02496
    - src-github-loco-mujoco-readme
    - src-github-loco-mujoco-pyproject
    - src-github-loco-mujoco-environments-readme
    - src-github-loco-mujoco-smpl-readme
    - src-github-loco-mujoco-v101-pyproject
    - src-github-loco-mujoco-v010-requirements
    - src-github-loco-mujoco-v010-reward
    - src-github-api-loco-mujoco-releases
    - src-loco-mujoco-docs-v030-unitreeh1
    - src-loco-mujoco-docs-v030-imitation-learning
    - src-hf-api-loco-mujoco-datasets
    - src-hf-loco-mujoco-datasets-lafan1-readme
    - src-arxiv-2406-08472-v4
    - src-arxiv-2605-11020-v2
  sources_note: >
    The paper's v2 PDF and the two reporting papers' PDFs (DOIs, not archived) read as text; the paper's
    abstract page for its dates; the repository's README, pyproject, environment overview and AMASS guide
    at the v1.1.0 commit, the v1.0.1 pyproject and the v0.1.0 requirements and reward module, all raw
    at pinned commits; GitHub's releases API record; two v0.3.0 documentation pages with scripts and styles
    stripped (the current documentation, /en/latest/, is disallowed by the site's robots.txt and was not
    read); and Hugging Face's API record of the datasets repository and its LAFAN1 README. The AMASS,
    SMPL and MANO sites were not visited.
  confidence: medium
  review_checks:
    - check: Scope. The family's mujoco-gymnasium near miss was weighed and judged not to fit -- the
        paper sets itself against Gym-MuJoCo and the DeepMind Control Suite for toy tasks and claims
        realistic robot platforms, motion capture and a sim-to-real aim. A reviewer may still read
        the benchmark's community as imitation-learning algorithm research in the abstract, which

  - version: 1.x
    label: LocoMuJoCo 1.x (v1.0.1 and later), the JAX rewrite
    version_kind: edition
    released: 2025-04-18
    changes: A rewrite on JAX with MuJoCo for single and MJX for parallel environments; 12 humanoid
      and 4 quadruped environments; over 22,000 motion capture datasets (default, LAFAN1, AMASS)

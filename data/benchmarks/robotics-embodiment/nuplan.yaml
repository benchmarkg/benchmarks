# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T03)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2403-04133-v1
    - src-arxiv-2403-04133
    - src-arxiv-2106-11810
    - src-github-nuplan-devkit-readme
    - src-github-nuplan-devkit-licence
    - src-github-nuplan-devkit-competition
    - src-github-nuplan-devkit-metrics-aggregation
    - src-evalai-nuplan-challenge-1856
    - src-nuplan-org-nuplan
    - src-nuplan-org-terms-noncommercial
    - src-arxiv-2306-07962-v2
    - src-arxiv-2309-10443-v1
    - src-arxiv-2404-07569
    - src-arxiv-2610-36837-v1
    - src-arxiv-2609-06055
    - src-arxiv-2610-29676
    - src-github-navsim-splits
  sources_note: >
    The 2024 paper's PDF and four arXiv PDFs or abstract pages of others' work (DOIs, not archived); the
    2021 paper's abstract page; four devkit files at commit e924167; EvalAI's public API record of the
    challenge, withheld from archiving for the creator's personal handle; nuplan.org's two pages as the
    script chunks that render them; and three 2026 papers as evidence of current use. Nothing behind the
    dataset's registration was read, and no terms were accepted.
  confidence: medium
  review_checks:
    - check: Capability. planning and sensorimotor-control are both tagged. sensorimotor-control's
        tie-break sends a trajectory tracked by the benchmark's own controller in a non-reactive
        simulation to planning, which describes the CLS-NR mode literally; but nuPlan re-queries the
        planner every 0.1 s on the state it produced, and the reactive mode closes the loop through
        other vehicles too. A reviewer may keep planning only.
      field: capability
      source: src-github-nuplan-devkit-competition
      quote: Each planner will have a fixed time budget of 1s for each simulation iteration, after
        which the simulation will time out.
    - check: evaluation_method adds domain-metric and composite for the open-loop mode and the
        challenge's mean of the three modes, beside simulation-rollout; current papers report the
        closed-loop modes only, so simulation-rollout alone may be the better reading.
      field: evaluation_method
    - check: Val14 and Test14 are recorded as as_used protocols, not forks, because they are
        scenario lists over nuPlan's own splits scored unchanged; 04 S4's "independently versioned
        and cited" could make them separate benchmarks, especially Test14-hard, whose selection
        depends on a planner (PDM-Closed). interPlan is a fork on its abstract alone.
      field: lineage
      source: src-arxiv-2609-06055
      quote: across the Val14, Test14-hard, and Test14-random community splits in both non-reactive
        and reactive modes
    - check: Versions. The dataset releases are modelled (v0.1 and v1.0 editions, v1.1 a revision of
        the same logs) and the devkit versions are a condition (simulator_version). v1.1 is unfrozen
        because the sensor data was to be released gradually; whether it completed was not checked.
        The devkit version used by 2026 papers is not stated in any source read.
      field: versions
      source: src-github-nuplan-devkit-readme
      quote: Submissions generated from version v1.1 should remain compatible.
    - check: activity is closed. EvalAI's record ends on 2025-11-15 (inactive, frozen), but the PDM
        and PlanTF papers describe the leaderboard as closed in 2023. When submissions actually
        stopped, between 2023-05-26 and 2025-11-15, is unclear; the history's closing date follows
        the competition page.
      field: activity
      source: src-arxiv-2306-07962-v2
      quote: Unfortunately, due to the closure of the leaderboard
    - check: data.access is gated-registration for the released splits behind current results; the
        challenge's hidden test set made that round private-test-server. Whether the hidden set is
        the same as the released test split was not established.
      field: data.access
    - check: prize-sponsored-by-industry rests on the competition page's prizes and the terms'
        statement that Motional AD Inc. conducted the competition; no sentence says who paid. The
        maintainer type rests on the same legal-form wording.
      field: governance.independence_flags
      source: src-evalai-nuplan-challenge-1856
      quote: which is conducted by Motional AD Inc. and its affiliates
    - check: The scoring document lists driving_direction_compliance with a weight of 5 in its table
        while its text and the 2024 paper (Tables II and XIV) treat it as a multiplier; task.scoring
        follows the paper.
      field: task
      source: src-github-nuplan-devkit-metrics-aggregation
      quote: '|driving_direction_compliance |Score is 1 if during the previous `time_horizon`'
    - check: The 2024 paper notes that reactive agents use an IDM similar to the IDM baseline
        planner, which may favour it in closed loop; no source measures the bias.
      field: known_limitation
      source: src-arxiv-2403-04133-v1
      quote: It should be noted though that the reactive agents are also modelled with a similar
        IDM.
    - check: The challenge's ranking table in the 2024 paper names team "CS Tu" first (0.895), while
        the PDM paper says PDM-Hybrid ranked first of 25 teams; that these are the same entry is
        likely but not stated. The EvalAI leaderboard itself was not read (it lists entrants by team
        names, some personal).
      field: governance.participation
      source: src-arxiv-2403-04133-v1
      quote: Overall Score 0.895 0.875 0.848 0.829
    - check: The NAVSIM fork row cites navsim's Source src-github-navsim-splits, which needs nuplan
        in its cited_by. navsim.yaml has no lineage block; it may want a fork role pointing here.
      field: lineage

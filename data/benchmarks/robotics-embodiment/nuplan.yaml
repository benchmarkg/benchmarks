subsets:
  - id: nuplan#open-loop
    label: Challenge 1, open-loop (OLS)
    scored_separately: true
    evidence:
      - source: src-github-nuplan-devkit-competition
        quote: 'Challenge 1: Open-loop'
      - source: src-github-nuplan-devkit-competition
        quote: In this challenge, the planning system is tasked with imitating the expert driver in
          open-loop.
    notes: The planned trajectory is compared with the logged one and never executed. Rarely
      reported after the challenge.
  - id: nuplan#closed-loop-non-reactive
    label: Challenge 2, closed-loop with non-reactive agents (CLS-NR)
    scored_separately: true
    evidence:
      - source: src-github-nuplan-devkit-competition
        quote: 'Challenge 2: Closed-loop non-reactive agents'
      - source: src-github-nuplan-devkit-competition
        quote: Nonetheless, the other agents are replayed from a log according to their observed
          states in open-loop - hence, the name non-reactive.
    notes: The ego is propagated by the LQR tracker along the planner's trajectory; other agents
      replay their logs.
  - id: nuplan#closed-loop-reactive
    label: Challenge 3, closed-loop with reactive agents (CLS-R)
    scored_separately: true
    evidence:
      - source: src-github-nuplan-devkit-competition
        quote: 'Challenge 3: Closed-loop reactive agents'
      - source: src-github-nuplan-devkit-competition
        quote: In the final and most complex challenge, the vehicles in the scene become reactive.
    notes: Vehicles follow the Intelligent Driver Model; pedestrians and other objects replay their
      logs. Computed identically to CLS-NR ("they differ in background traffic behavior",
      src-arxiv-2306-07962-v2).

lineage:
  role: root
  forks:
    # Other groups' benchmarks derived from nuPlan, with their own scenarios, metrics or simulation, maintained apart
    # from Motional.
    - id: navsim
      maintainer: Autonomous Vision Group, University of Tübingen, with co-authors (see navsim.yaml)
      source: src-github-navsim-splits
      quote: Corresponds to nuPlan and downsampled to 2HZ.
    - id: interplan
      maintainer: The interPlan authors (arXiv 2404.07569)
      source: src-arxiv-2404-07569
      quote: we propose a novel closed-loop benchmark interPlan containing several edge cases and
        challenging driving scenarios.
lineage_note: Val14 and Test14 are not forks here, as they are scenario lists over nuPlan's own
  validation and test splits, scored unchanged with the devkit's modes and metrics, so they are
  recorded as protocols (as_used). interPlan is a separate closed-loop benchmark of edge cases,
  proposed because nuPlan "mostly covers basic driving scenarios" (src-arxiv-2404-07569); only its
  abstract was read, and that it reuses nuPlan's logs and simulation, as the 2026 papers that report
  both imply, is not stated there. Other nuPlan-based benchmarks seen in arXiv listings were not
  read or linked.


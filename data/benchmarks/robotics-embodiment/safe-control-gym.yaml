# data/benchmarks/robotics-embodiment/safe-control-gym.yaml
#
# P1-S5-T03, robotics-embodiment entry 25. Filled from the safe-control-gym paper, arXiv 2109.06325 read as its v4
# PDF (2022-07-26, the IEEE Robotics and Automation Letters version), and its abstract page; the repository
# (learnsyslab/safe-control-gym, formerly utiasDSL) at commit 6b5391d on main -- README, pyproject.toml, the quadrotor
# environment and its PyBullet base class, and the experiment class that computes the metrics; GitHub's API records of
# the repository and its releases; the beta-iros-competition branch's README (the IROS 2022 Safe Robot Learning
# Competition, commit ec361ae); the competition report, arXiv 2308.16743 read as its v1 PDF; the lab's Safe Robot
# Learning page on dynsyslab.org; and Fuz-RL (arXiv 2602.20729, read as its 2026 v2 PDF) as evidence of current use.
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts. Competition
# winners, organisers and authors are not named here: quote organisations, teams and systems only.

id: safe-control-gym
name: safe-control-gym
aliases:
  - Safe-Control-Gym
  - safe_control_gym
aliases_note: The RA-L title capitalises it "Safe-Control-Gym"; the Python package is
  safe_control_gym.
tagline: PyBullet cart-pole and quadrotor control tasks with constraints and disturbances, comparing
  control and RL on safety.
description: >
  An open-source benchmark suite from the University of Toronto's Dynamic Systems Lab (now the Learning
  Systems and Robotics Lab of TU Munich and the University of Toronto), built to compare learning-based
  control and reinforcement learning on the same footing. It extends the Gym API with symbolic a priori
  dynamics, cost and constraints (CasADi), and with configurable disturbances on control inputs, state
  measurements, inertial parameters and external forces such as wind, all simulated in PyBullet. The paper
  (IEEE RA-L 2022) has three unstable systems -- the cart-pole, and a 1D and a 2D quadrotor -- and two
  tasks, stabilisation and trajectory tracking (circle, sinusoid, lemniscate or square references); the
  current code adds a 3D quadrotor, and the quadrotor model is the Bitcraze Crazyflie 2.0. Results are
  read on control performance (RMSE to the reference, a quadratic cost or return), data efficiency, constraint
  violations and robustness to disturbances and parameter mismatch, with baselines from classical control
  (PID, LQR, iLQR, linear and nonlinear MPC), learning-based control (GP-MPC), RL (PPO, SAC, DDPG), safe
  and robust RL (safety layer, RARL, RAP) and safety filters (MPSC, CBF). There is no leaderboard. In
  2022 the lab ran the IROS Safe Robot Learning Competition on a branch of the repository: a Crazyflie
  2.x flies through gates to a goal under randomised dynamics and gate positions, scored in four simulated
  levels and a sim2real level on real Crazyflies.
self_description:
  source: src-arxiv-2109-06325-v4
  quote: Here, we propose a new open-source benchmark suite, called safe-control-gym, supporting
    both model-based and databased control techniques.
external_ids:
  arxiv: '2109.06325'
paper:
  title: 'safe-control-gym: a Unified Benchmark Suite for Safe Learning-based Control and Reinforcement
    Learning in Robotics'
  arxiv: '2109.06325'
  doi: 10.1109/LRA.2022.3196132
  version_read: v4
  source: src-arxiv-2109-06325-v4
paper_note: The RA-L DOI is the one the repository README gives
  (src-github-safe-control-gym-readme); the IEEE page was not read. The v4 PDF calls itself "this
  letter".
released: 2021-09-13
released_note: The paper's first arXiv version. The repository was created on 2021-08-04 (GitHub
  API); the RA-L code release, v0.6.0, was tagged on branch submission on 2022-02-22.
released_source: src-arxiv-2109-06325
released_quote: '[Submitted on 13 Sep 2021 (v1), last revised 26 Jul 2022 (this version, v4)]'
release_venue: IEEE Robotics and Automation Letters, vol. 7, no. 4, pp. 11142-11149 (2022)
release_venue_source: src-github-api-safe-control-gym-releases
release_venue_quote: '"tag_name":"v0.6.0","target_commitish":"submission","name":"IEEE Robotics and Automation
  Letters"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/drone-uav
  secondary:
    - robotics-embodiment/continuous-control
domain_basis:
  reason: >
    Three of the four systems are quadrotors (1D, 2D and, in the current code, 3D) modelled on the Crazyflie
    2.0, whose tasks are defined by flight dynamics (thrust, mass, inertia, wind) and by state and input
    constraints on the vehicle; the competition the suite hosted flies Crazyflies through gates in simulation
    and on hardware. The family's mujoco-gymnasium near miss was weighed. Its claim is control algorithms
    in the abstract; safe-control-gym's is safe control for deployment on real robots, with real robots'
    models, disturbances that mimic their non-idealities, and a sim2real competition, so the embodiment
    is the point. Continuous control is the secondary because the score is a control objective (tracking
    error, cost, constraint violations), and the cart-pole is not aerial (its subset overrides the primary).
    See review_checks.
  source: src-arxiv-2109-06325-v4
  quote: These correspond to the cases in which the movement of a quadrotor is constrained to the 1D
    motion in the vertical z-direction and the 2D motion in the xz-plane, respectively
domain_considered_and_rejected:
  - term: robotics-embodiment/sim2real-transfer
    reason: The suite itself is simulation only, by design; sim2real is scored only in the 2022
      competition, whose subset carries it as a secondary.
    source: src-arxiv-2109-06325-v4
    quote: While we acknowledge the importance of eventual real-robot experiments, here, we focus on
      simulation as a way to lower the barrier of entry and appeal to a larger fraction of the
      control and RL communities.
  - term: robotics-embodiment/navigation
    reason: The competition's quadrotor flies through gates whose exact pose it learns only when
      close, but the course is given in advance and the suite's own tasks track references; nothing
      is mapped or explored.
  - term: engineering-design/process-control-optimization
    reason: The controlled systems are robots (a cart-pole and quadrotors), not an industrial
      process, and nothing is designed; the engineering-design scoping survey also sends it here.

capability:
  - sensorimotor-control
  - constraint-satisfaction
  - distribution-shift-generalization
capability_basis:
  sensorimotor-control:
    reason: A controller or policy issues thrusts or forces to a simulated body in closed loop, the
      PyBullet simulation responds, and the score is the resulting motion against the reference.
    source: src-arxiv-2109-06325-v4
    quote: it is important to clarify that we focus on safe, low-level control rather than
      vision-based applications
  constraint-satisfaction:
    reason: The benchmark's own claim includes satisfying constraints, every step's info reports
      constraint evaluations, and the experiment class scores the failure rate -- the share of
      episodes with any violation -- beside the number of violating steps; in the competition only
      runs with no collision or violation complete the task.
    source: src-github-safe-control-gym-base-experiment
    quote: Occurence of any violation in episodes.
  distribution-shift-generalization:
    reason: The paper reports robustness as a condition of its own -- controllers evaluated against
      pole lengths and input noise away from those they were designed or trained for -- and the
      disturbance and randomisation API exists to build such conditions; Fuz-RL evaluates under the
      suite's perturbations at test time.
    source: src-arxiv-2109-06325-v4
    quote: capability to satisfy constraints (Figure 7), as well as robustness against disturbances
      and parametric uncertainty (Figure 8)
capability_considered_and_rejected:
  - term: adversarial-robustness
    reason: RARL and RAP train against an adversary, but the evaluation's perturbations (parameter
      mismatch, white noise) are not selected to defeat the controller under test.
    source: src-arxiv-2109-06325-v4
    quote: RAP is trained against adversarial input disturbances
  - term: sample-efficiency
    reason: Data efficiency is plotted against seconds of simulated training data, and the
      competition scores data and compute efficiency, but no budget is fixed at which performance is
      scored.
  - term: transfer-learning
    reason: Only the competition's sim2real level moves a controller from simulation to hardware;
      its subset carries the term.
  - term: planning
    reason: The suite gives the reference trajectory or equilibrium; the competition's entrants plan
      paths through the gates, but the competition subset is scored on flying them safely and fast,
      which sensorimotor-control and constraint-satisfaction cover.
  - term: perception
    reason: Observations are states (with optional noise), and the competition gives poses from
      motion capture; nothing is recovered from images.

evaluation_method:
  - simulation-rollout
  - physical-trial
evaluation_method_basis:
  reason: >
    The suite's results come from episodes in PyBullet, scored per episode on RMSE to the reference, constraint-violation
    counts and a failure rate (bounded in [0,1]), and a return whose default quadrotor reward is bounded
    in [0,1] per step. The competition's fifth level flew each entrant's controller on real Crazyflies
    in a motion-capture arena, and that level is scored like the simulated ones, which makes it a scored
    physical track, not a one-off validation.
  source: src-github-safe-control-gym-iros-competition-readme
  quote: '| sim2real | **Yes** | Real-life hardware | **Yes**, injected | *No* | Sim2real transfer |'
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: The experiment class reports an average return, but the quadrotor's default reward is
      the exponentiated negative quadratic cost, bounded per step, and the paper's headline numbers
      are RMSE and constraint violations.
    source: src-github-safe-control-gym-quadrotor
    quote: If to exponentiate negative quadratic cost to positive, bounded [0,1] reward.
  - term: statistical-fit
    reason: RMSE is a general statistic, but here it measures a closed-loop trajectory produced in
      the simulator, which simulation-rollout covers; nothing is predicted against observations.
    source: src-arxiv-2109-06325-v4
    quote: Evaluation cost is the RMSE with respect to the target state(s).
  - term: entrant-relative-ranking
    reason: The 2022 competition gave 20, 10 and 5 points to the top three per level, so its final
      classification depends on the field; the quantities ranked (task time, violations, learning
      time) are absolute, and the suite has no ranking. See review_checks.
    source: src-arxiv-2308-16743-v1
    quote: the top 3 solutions ranked by safety and performance and the top 3 solutions ranked by
      data & compute efficiency were given 20, 10, and 5 points respectively
designed_for_subjects:
  - rl-policy
  - classical-algorithm
  - physical-robot-system
designed_for_subjects_basis:
  reason: The suite is built so that RL agents and non-learned controllers are scored on the same
    axes -- PPO, SAC and safe RL beside PID, LQR, iLQR and MPC -- with learning-based control
    (GP-MPC) and safety filters in between. The competition's sim2real level runs each entrant's
    controller on the organisers' Crazyflies, which physical-robot-system covers when every entrant
    gets the same body.
  source: src-arxiv-2109-06325-v4
  quote: Our benchmark suite includes, as baselines, standard statefeedback controllers such as the
    linear quadratic regulator (LQR) and iterative LQR (iLQR)
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: No language model acts; entrants are controllers and trained policies.

as_used:
  - protocol: Four tasks (cart-pole and 2D quadrotor, each stabilisation and tracking) with
      observation, action and dynamics perturbations from the suite applied at test time, reported
      as mean and standard deviation over 10 episodes and 10 seeds, beside four Safety-Gymnasium
      tasks.
    source: src-arxiv-2602-20729-v2
    quote: 'we conduct experiments on four Safe-Control-Gym [6] tasks: Cartpole-Stab, Cartpole-Track,
      Quadrotor-Stab, and Quadrotor-Track'
    note: One 2026 paper's protocol; the suite fixes no evaluation protocol of its own (episodes,
      seeds or perturbation levels are configured per experiment).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against it. Fuz-RL (v2 March 2026) evaluates safe RL methods on
    four of its tasks under its perturbations, and the maintainers last pushed to the repository on
    2026-04-29 (GitHub API). The competition's ending is recorded in activity (ADR-0019).
  source: src-arxiv-2602-20729-v2
  quote: Empirical analyses on safe-control-gym and safety-gymnasium scenarios demonstrate that
    Fuz-RL effectively integrates with existing safe RL baselines
activity: closed
activity_note: The suite itself never had a submission route; users report in their own papers. The
  only route was the 2022 competition's (pull requests into the beta-iros-competition branch), which
  ended at IROS 2022. The report speaks of future iterations, but the lab's page lists only the 2022
  competition among its past events, and no later edition was found.
activity_basis:
  reason: A route for entering systems existed (the competition) and none is open now.
  source: src-github-safe-control-gym-iros-competition-readme
  quote: 'IROS Conference and Competition days: October 24-26, 2022'
events:
  - name: IROS 2022 Safe Robot Learning Competition, run remotely during IROS 2022 (24-26 October
      2022), with simulated levels and a sim2real level on Crazyflies at the University of Toronto
    kind: competition
    source: src-arxiv-2308-16743-v1
    quote: this article motivates and describes an aerial sim2real robot competition that ran during
      the 2022 IEEE/RSJ International Conference on Intelligent Robots and Systems

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Fuz-RL (fuzzy-guided robust safe RL, applied to the PPOL, CUP and CPPO baselines)
    source: src-arxiv-2602-20729-v2
    observed_on: 2026-11-05
    quote: Empirical analyses on safe-control-gym and safety-gymnasium scenarios demonstrate that
      Fuz-RL effectively integrates with existing safe RL baselines
evaluation_target: mixed
evaluation_target_note: Non-learned controllers (PID, LQR, iLQR, MPC, CBF filters) are scored beside
  RL policies and learning-based control on the same metrics, by design.
execution_mode: automated
execution_mode_note: The suite is run in simulation. The 2022 competition's sim2real level was a
  physical trial run by the organisers on their Crazyflies.
ground_truth_source: simulation
ground_truth_source_note: The reference state or trajectory the task generates and the constraint
  evaluations the environment returns at each step, computed on the simulated state.
ground_truth_source_source: src-arxiv-2109-06325-v4
ground_truth_source_quote: Constraint evaluations are included in the info dictionary returned at
  each environment
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The environments, controllers, safety filters and experiment scripts are released under
    MIT, and every task runs on PyBullet on a CPU. The competition's sim2real level needs
    Crazyflies, a motion-capture arena and the organisers' pipeline.
  source: src-github-api-safe-control-gym
  quote: '"license":{"key":"mit","name":"MIT License","spdx_id":"MIT"'
task:
  exists: true
  input:
    - the system's state (cart-pole 4, 1D quadrotor 2, 2D quadrotor 6, 3D quadrotor 12 values),
      optionally with noise, plus the reference to track; on reset, the symbolic a priori dynamics,
      cost and constraints (CasADi) and the task reference
  output: A force on the cart or the quadrotor's motor thrusts, at the control frequency, until the
    episode ends (in the competition, position, velocity, acceleration and heading references to the
    Crazyflie's onboard controller).
  scoring: Per task, RMSE of the closed-loop state against the reference, the quadratic cost (or the
    RL return), the number of constraint-violating steps and the failure rate (share of episodes
    with any violation), over evaluation episodes, read against the training data used; robustness
    is the same metrics under parameter mismatch or injected noise. In the competition, a run
    completes the task only with no collision and no constraint violation, and completed runs are
    ranked on task time and on data and compute efficiency.
  task_distribution_drifts: false
  source: src-arxiv-2109-06325-v4
  quote: For trajectory tracking, we include a trajectory generation module capable of generating
    circular, sinusoidal, lemniscate, or square trajectories.
platform: Simulated in PyBullet (Bullet physics stepped at up to 1000 Hz, typically controlled at 50
  Hz); the quadrotor is the Bitcraze Crazyflie 2.0 in X configuration (cf2x). The competition's
  hardware was the Crazyflie 2.x, commanded through Crazyswarm at 30 Hz from a ground station, with
  its firmware's Mellinger controller and a Vicon motion-capture system.
hardware:
  source: src-github-safe-control-gym-base-aviary
  quote: CF2X = 'cf2x' # Bitcraze Craziflie 2.0 in the X configuration.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: There is no dataset; the environments, their configurations and the controllers are in a
      public MIT-licensed repository.
    source: src-github-api-safe-control-gym
    quote: '"license":{"key":"mit","name":"MIT License","spdx_id":"MIT"'
  refresh: versioned-releases
  refresh_basis:
    reason: Changes reach users as tagged releases with branches kept for each paper's results
      (v0.5.0 on branch ar for the Annual Review, v0.6.0 on branch submission for RA-L, then
      v1.0.0); main has moved on since (package version 2.0.0, untagged).
    source: src-github-api-safe-control-gym-releases
    quote: '"tag_name":"v0.5.0","target_commitish":"ar","name":"Annual Reviews"'
  data_provenance:
    - simulation-generated
    - real-world-instrument
  data_provenance_note: Every suite result is a simulated episode. The competition's sim2real level
    produced flights of real Crazyflies tracked by Vicon; its simulated levels are simulation too.
  data_provenance_source: src-arxiv-2308-16743-v1
  data_provenance_quote: We used a Vicon motion tracking system to measure the locations of each
    obstacle at the start of each trial
  contamination_risk: low
  contamination_risk_note: Closed-loop control episodes generated at run time have no stored item
    set for training data to contain, and training in the environment is the protocol. No source
    discusses contamination.
  contamination_evidence: []
  ceiling_anchor_type: null
  ceiling_anchor_type_note: RMSE and violation counts have a floor of zero, and the RL reward is
    bounded per step, but no source states an anchor results are read against; the paper compares
    controllers with each other (LQR with true parameters is the nearest thing to a reference in its
    stabilisation plot).
  dataset_licence: null
  dataset_licence_note: There is no dataset; the environments are code (execution.code_licence).
  size:
    - count: 3
      unit: dynamic systems (cart-pole, 1D quadrotor, 2D quadrotor), each with two tasks
        (stabilisation, trajectory tracking)
      subset: v0.6.0 (the RA-L paper)
      source: src-arxiv-2109-06325-v4
      quote: We provide implementations for three dynamic systems—the cart-pole, the 1D, and 2D
        quadrotor— and two control tasks—stabilization and trajectory tracking.
    - count: 4
      unit: dynamic systems (the cart-pole and the 1D, 2D and 3D quadrotor)
      subset: v1.0.0 and later
      note: The 3D quadrotor is a motion type of the same environment and the README's headline
        example; it is already in the v1.0.0 README.
      source: src-github-safe-control-gym-quadrotor
      quote: The choice of motion type (1D along z, 2D in the x-z plane, or 3D).
    - count: 5
      unit: evaluation scenarios (levels 0-3 in simulation, and sim2real)
      subset: IROS 2022 competition
      source: src-github-safe-control-gym-iros-competition-readme
      quote: 'Proposed solutions will be evaluated in 5 scenarios with different challenges:'

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Learning Systems and Robotics Lab (LSY) of the Technical University of Munich and
    the University of Toronto, formerly the University of Toronto's Dynamic Systems Lab (DSL), with
    the Vector Institute
  maintainer_basis:
    reason: The paper's authors are with the Dynamic Systems Lab at the University of Toronto's
      Institute for Aerospace Studies; the competition report (2023) names the same group the
      Learning Systems & Robotics Lab, and the lab's page, the repository's homepage, carries the TU
      Munich and Toronto name. The repository moved from the utiasDSL to the learnsyslab
      organisation (see history), whose README footer still reads Dynamic Systems Lab.
    source: src-dynsyslab-safe-robot-learning
    quote: Learning Systems and Robotics Lab | Technical University of Munich & University of
      Toronto.
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: The suite has no leaderboard; users report in their own papers. The 2022
    competition took submissions as pull requests (or private repositories) and was scored by the
    organisers; it is closed (see history and activity).
  independence_flags:
    - flag: prize-sponsored-by-industry
      source: src-github-safe-control-gym-iros-competition-readme
      quote: 'Kindly supported by [Bitcraze](https://www.bitcraze.io): - 1st: [Bitcraze Crazyflie AI Bundle](https://store.bitcraze.io/collections/bundles/products/the-ai-bundle)'
  independence_flags_note: The 2022 competition's prizes were Bitcraze Crazyflie bundles, linked to
    Bitcraze's store, the maker of the hardware every entrant flew; Bitcraze did not enter. No
    source read shows the maintainers entering their own competition or ranking their methods on a
    board. The suite's paper compares the authors' implementations of others' methods and their own
    lab's GP-MPC, which is a baseline study, not a ranking.
  independence_assessed: true
  participation:
    source: src-arxiv-2308-16743-v1
    quote: Tot. (Rank) 85 (3) 115 (2) 150 (1)
  participation_note: The report gives the three podium teams' scores (a USTC team, Ekumen's Ekuflie
    and team H2, the winner); the total number of entrants is not stated in the sources read.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: >
    Every run needs PyBullet and CasADi; a CPU suffices (the paper's timings are on a quad-core laptop
    CPU, with simulation 10 to 20 times faster than real time headless). Current main asks for Python
    3.10, pybullet ^3.2, gymnasium ^0.28 and torch ^2.8; the competition branch used Python 3.8 and a
    recommended mid-tier laptop with a GPU. Fast MPC may need acados built separately.
  compute_tier_source: src-arxiv-2109-06325-v4
  compute_tier_quote: In headless mode, a single instance of safe-control-gym allows to collect data
    10 to 20 times faster than in real life
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is automatic, but only inside PyBullet with the environment configuration (YAML
      overrides for constraints, disturbances and randomisation) it was run with; main pins no exact
      PyBullet build.
    source: src-github-safe-control-gym-pyproject
    quote: pybullet = "^3.2"
  harness_availability: official-harness
  harness: safe_control_gym (the environments with their YAML configurations, the controllers and
    safety filters, and the experiment class that computes return, RMSE, failure rate and constraint
    violations; scripts in examples/)
  harness_source: src-github-safe-control-gym-base-experiment
  harness_quote: "'failure_rate': np.asarray(self.get_episode_constraint_violations()).mean(),"
  harness_gotcha:
    source: src-github-safe-control-gym-readme
    quote: You may need to separately install [`acados`](https://github.com/acados/acados) for fast
      MPC implementations.
  harness_gotcha_note: The MPC baselines may need acados built and installed separately, and the
    dependencies include the Mosek solver; the competition branch also needed pycffirmware built
    from source (SWIG). Each paper's results are reproduced from its own branch (ar, submission),
    not from main.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata and the pyproject both say MIT (read 2026-11-05).
  code_licence_source: src-github-safe-control-gym-pyproject
  code_licence_quote: license = "MIT"
  est_participant_cost_usd: null
  est_participant_cost_usd_note: Runs on a laptop CPU; no source states a cost.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile (simulator, simulator_version, hardware_platform, subset_used, selection_strategy,
  # n_samples) and the physical-trial profile (hardware_platform, venue, subset_used, n_samples): results depend on
  # PyBullet's build and on the release (each paper's results sit on their own branch; main asks only pybullet ^3.2),
  # so simulator and simulator_version are restated, and on the platform -- the simulated Crazyflie 2.0 (cf2x) model
  # in the suite, a real Crazyflie 2.x with its Mellinger controller, Crazyswarm and Vicon in the competition's
  # sim2real level -- so hardware_platform is restated. The system, task, constraint set, disturbances and
  # randomisation are all YAML configuration (subset_used). Also material: what the controller was given and trained
  # on (an a priori model, possibly with wrong parameters as in the paper's LQR150%, and how many seconds of training
  # data; training_data_policy), and the evaluation episodes and seeds (n_samples).
  material_extra:
    - simulator
    - simulator_version
    - hardware_platform
    - subset_used
    - training_data_policy
    - n_samples

aggregation_policy: unknown
aggregation_policy_note: The paper reports each system and task separately and no aggregate; the
  competition summed points over its five levels.

homepage: https://www.dynsyslab.org/safe-robot-learning/
repository: https://github.com/learnsyslab/safe-control-gym


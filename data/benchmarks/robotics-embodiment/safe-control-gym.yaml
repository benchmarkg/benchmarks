    released: 2024-05-05
    changes: Adds the 3D quadrotor (already the headline example of the v1.0.0 README) and moves to
      Python 3.10; main since lists DDPG and a neural-network CBF beside the paper's methods and
      depends on Gymnasium. The release notes say only "Version 1.0.0"; the changes are read from
      the README and the code.
    breaking: true
    supersedes_version: 0.6.0
    frozen: false
    sources:
      - src-github-api-safe-control-gym-releases
      - src-github-safe-control-gym-readme
      - src-github-safe-control-gym-pyproject
      - src-github-safe-control-gym-quadrotor
versions_note: Release dates are the tags' creation dates; GitHub shows all four releases as made
  public only on 2023-05-08 (the alpha) or 2024-10-21. Whether results on the same system and task
  are comparable across versions is not stated anywhere read, so each later version is marked
  breaking (see review_checks).

subsets:
  - id: safe-control-gym#cartpole
    label: Cart-pole -- stabilisation and trajectory tracking
    scored_separately: true
    domain_override:
      primary: robotics-embodiment/continuous-control
    evidence:
      - source: src-arxiv-2109-06325-v4
        quote: The 1D quadrotor is a linear dynamic system, the 2D quadrotor is nonlinear, and the
          cart-pole is non-minimum phase.
    notes: Not aerial, so its primary is continuous control. Also offers the classic reward of 1 per
      upright step.
  - id: safe-control-gym#quadrotor-1d
    label: 1D quadrotor (vertical motion only) -- stabilisation and trajectory tracking
    scored_separately: true
    evidence:
      - source: src-arxiv-2109-06325-v4
        quote: These correspond to the cases in which the movement of a quadrotor is constrained to
          the 1D motion in the vertical z-direction and the 2D motion in the xz-plane, respectively
    notes: A double integrator (thrust against gravity), which the paper says suits teaching too.
  - id: safe-control-gym#quadrotor-2d
    label: 2D quadrotor (x-z plane) -- stabilisation and trajectory tracking
    scored_separately: true
    evidence:
      - source: src-arxiv-2109-06325-v4
        quote: Evaluation cost is the RMSE with respect to the target state(s).
    notes: The paper's headline tracking task (a circle of 1 m radius in its Figure 5); in its RMSE
      only the x and z components count.
  - id: safe-control-gym#quadrotor-3d
    label: 3D quadrotor -- stabilisation and trajectory tracking (v1.0.0 and later)
    scored_separately: true
    evidence:
      - source: src-github-safe-control-gym-readme
        quote: '### 3D Quadrotor Lemniscate Trajectory Tracking with PID'
    notes: Not in the paper; 12 state values.
  - id: safe-control-gym#iros-2022-competition
    label: IROS 2022 Safe Robot Learning Competition -- a Crazyflie through gates to a goal, levels
      0-3 in simulation and a sim2real level on hardware
    scored_separately: true
    domain_override:
      primary: robotics-embodiment/drone-uav
      secondary:
        - robotics-embodiment/sim2real-transfer
    capability_override:
      - sensorimotor-control
      - constraint-satisfaction
      - transfer-learning
    evidence:
      - source: src-arxiv-2308-16743-v1
        quote: a nano-quadrotor (specifically, the Bitcraze Crazyflie 2.x) to safely fly (in the
          real world) through a set of gates and reach a predefined target despite uncertainties in
          the robot dynamics (i.e., mass and inertia)
      - source: src-github-safe-control-gym-iros-competition-readme
        quote: only runs with 0 collisions/violations will count as TASK COMPLETION
      - source: src-arxiv-2308-16743-v1
        quote: we directly quantify the sim2real performance of each of the 3 solutions by plotting
          the average position error
    notes: A task of its own on the beta-iros-competition branch, scored by the organisers in 2022
      and not repeated. Level 0 has constraints only; level 1 adds randomised inertial properties,
      level 2 randomised gates and obstacles, level 3 re-randomisation between episodes; sim2real
      flies real Crazyflies with injected disturbances. Exact gate poses are revealed within half a
      metre. Team H2 won (150 points), ahead of Ekuflie (115) and USTC (85).
subsets_note: The suite's subsets are its systems, each with the two tasks. The competition is a
  subset, not an edition -- it ran once (2022), on a different task (gates, a goal and hardware)
  from the suite's -- and the event is listed under events.


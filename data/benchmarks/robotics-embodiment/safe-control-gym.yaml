# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T03)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2109-06325-v4
    - src-arxiv-2109-06325
    - src-github-safe-control-gym-readme
    - src-github-safe-control-gym-pyproject
    - src-github-safe-control-gym-quadrotor
    - src-github-safe-control-gym-base-aviary
    - src-github-safe-control-gym-base-experiment
    - src-github-api-safe-control-gym
    - src-github-api-safe-control-gym-releases
    - src-github-safe-control-gym-iros-competition-readme
    - src-arxiv-2308-16743-v1
    - src-dynsyslab-safe-robot-learning
    - src-arxiv-2602-20729-v2
  sources_note: >
    The paper's v4 PDF, the competition report's v1 PDF and Fuz-RL's v2 PDF (DOIs, not archived) read
    as text; the paper's abstract page for its dates; the repository's README, pyproject and three code
    files at commit 6b5391d, and the competition branch's README at ec361ae, all raw at pinned commits;
    GitHub's API records of the repository and its releases; and the lab's Safe Robot Learning page with
    scripts and styles stripped (robots.txt allows it). The competition README and the lab page are withheld
    from archiving because they name individuals (winners, organisers, an organiser's e-mail address and
    handle; the lab's contributors); their extracts leave them out. The IEEE Xplore page for the RA-L
    DOI was not read.
  confidence: medium
  review_checks:
    - check: Scope and primary. The mujoco-gymnasium near miss was weighed and judged not to fit --
        the suite models real robots (the Crazyflie 2.0), injects real-world non-idealities and
        hosted a sim2real competition. But its stated aim is comparing control and RL methods, which
        a reviewer may read as control algorithms in the abstract (the near miss), and
        continuous-control may be the better primary since the score is a control objective;
        drone-uav rests on three of four systems being quadrotors.
      field: domain
      source: src-arxiv-2109-06325-v4
      quote: Our goal here is to highlight the potential for quantitative comparisons among
        controllers (although conditional to adequate and careful parameter tuning)
    - check: The prompt for this entry named IROS 2022 and 2023 competitions. Only the 2022 one was
        found; the lab's page lists only it among past events, the repository has one competition
        branch, and a search for a 2023 edition found none. The competition is modelled as a subset
        (one run, a different task) plus an event, not as editions. If a 2023 run is found, editions
        of a competition subset or a separate competition entry are the alternatives.
      field: subsets
      source: src-dynsyslab-safe-robot-learning
      quote: IROS Safe Robot Learning Competition, IROS 2022
    - check: physical-trial and physical-robot-system come from the competition's sim2real level
        alone, which ran once in 2022. If a reviewer reads a past competition as outside the
        benchmark's scored protocol, both drop and the entry is simulation only.
      field: evaluation_method
      source: src-github-safe-control-gym-iros-competition-readme
      quote: '| sim2real | **Yes** | Real-life hardware | **Yes**, injected | *No* | Sim2real transfer
        |'
    - check: simulation-rollout reads RMSE and violation counts as bounded episode outcomes; RMSE
        has a floor of zero but no cap. The RL return is bounded only through the default
        exponentiated reward, which a configuration can switch off (rew_exponential), so
        episodic-return is an alternative for RL-style results.
      field: evaluation_method
      source: src-github-safe-control-gym-quadrotor
      quote: If to exponentiate negative quadratic cost to positive, bounded [0,1] reward.
    - check: distribution-shift-generalization rests on the paper's robustness study (Figure 8) and
        the perturbation API; the suite fixes no held-out condition of its own, and each paper
        chooses its perturbations. constraint-satisfaction rests on the failure-rate metric and the
        competition's completion rule; the paper's headline violation metric is a fraction of time,
        scored by degree.
      field: capability
    - check: Versions. 0.5.0, 0.6.0 and 1.0.0 are modelled as revisions of one suite (same
        maintainer and repository), each kept on its own branch or tag; whether results on the same
        system and task carry across versions is not stated, so breaking is set conservatively. The
        tags were created in 2021-2024 but published only in 2023-2024; main (package 2.0.0) is
        untagged.
      field: versions
      source: src-github-api-safe-control-gym-releases
      quote: '"tag_name":"v1.0.0","target_commitish":"dd1b293f3be1f3df56bb26cb66753e250afda00a","name":"v1.0.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2024-05-05T22:43:15Z"'
    - check: prize-sponsored-by-industry reads Bitcraze as commercial from its prizes being products
        in its online store; Bitcraze also made the hardware every entrant flew, but it did not
        enter, so funded-by-evaluated-party does not apply.
      field: governance.independence_flags
    - check: Evidence of current use is one 2026 paper (Fuz-RL), plus the maintainers' 2026 commit.
        Other 2024 papers found by search (safety filtering while training, safe Bayesian
        optimisation kernels) were not read.
      field: lifecycle
    - check: maintainer is read as one lab under two names (the Dynamic Systems Lab, the Learning
        Systems and Robotics Lab), now at TU Munich and Toronto, rather than a hand-over; no source
        dates the rename or the move of the repository.
      field: governance.maintainer
      source: src-github-safe-control-gym-readme
      quote: University of Toronto's [Dynamic Systems Lab](https://github.com/learnsyslab)
    - check: The 3D quadrotor's first release is inferred from its presence in the v1.0.0 README
        (read for comparison, not kept as a Source); the 3D subset's version boundary is
        unconfirmed.
      field: subsets
  personal_data_excluded:
    - source: src-github-safe-control-gym-iros-competition-readme
      what: the winning teams' members, the twenty organisers, an organiser's e-mail address and
        GitHub handle
    - source: src-dynsyslab-safe-robot-learning
      what: the named contributors and collaborators with their posts, and the speakers of listed
        events
    - source: src-arxiv-2109-06325
      what: the author list and the submitter line
    - source: src-arxiv-2109-06325-v4
      what: the author block and the contact line
    - source: src-arxiv-2308-16743-v1
      what: the author block and a team's supervisors' names
    - source: src-arxiv-2602-20729-v2
      what: the author block with its e-mail addresses
    - source: src-github-api-safe-control-gym-releases
      what: the releasing accounts' handles

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T03)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1711-07280-v3
    - src-arxiv-1711-07280
    - src-bringmeaspoon-site
    - src-github-matterport3dsimulator-readme-589d091
    - src-github-matterport3dsimulator-r2r-readme-589d091
    - src-github-matterport3dsimulator-r2r-download-589d091
    - src-evalai-r2r-challenge-97
    - src-evalai-r2r-challenge-97-phases
    - src-evalai-r2r-leaderboard-270
    - src-arxiv-2604-19064-v1
    - src-arxiv-1905-12255
    - src-arxiv-2010-07954
    - src-arxiv-2004-02857
    - src-github-vln-ce-readme-729d141
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, and its abstract page for the dates and venue;
    the project site with scripts and styles stripped; the simulator README, the tasks/R2R README and
    the download script at commit 589d091; EvalAI's public JSON records of challenge 97, its phases and
    its Test leaderboard (no account, nothing accepted); the v1 PDF of an April 2026 paper (a DOI) as
    evidence of current use; and the R4R, RxR and VLN-CE abstract pages and the VLN-CE README for lineage.
    The Matterport3D scans were not requested.
  confidence: medium
  review_checks:
    - check: Primary navigation, secondary embodied-instruction-following. R2R is the founding
        vision-and-language navigation benchmark and the task statement fits both leaves; navigation
        leads because only the stop location is scored. calvin, the instruction-following leaf's
        entry, scores whole chains of instructions; aerialvln in this round made the same call as
        here.
      field: domain
      source: src-arxiv-1711-07280-v3
      quote: as many instructions do not specify the path that should be taken
    - check: Whether robotics-embodiment holds at all. The agent teleports between panoramas on a
        navigation graph with deterministic actions and no dynamics, which is why
        sensorimotor-control was rejected; the family's exclusion ("symbolic with no body") was
        judged not to apply because the agent has a pose and camera in real imagery. A reviewer may
        prefer a note that VLN-CE is the embodied form.
      field: domain.primary
      source: src-arxiv-2004-02857
      quote: this setting lifts a number of assumptions implicit in prior work that represents
        environments as a sparse graph of panoramas with edges corresponding to navigability
    - check: grounding is tagged on the paper's own claim (visually grounded instructions), although
        the score is the stop location; aerialvln rejected grounding on the libero near miss for the
        same kind of score. The two entries should agree.
      field: capability
    - check: Lineage. R4R and VLN-CE reuse R2R's items under other maintainers, so they are forks

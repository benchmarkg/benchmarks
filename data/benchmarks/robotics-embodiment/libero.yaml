curation:
  added_by: agent (P1-S3-T01)
  added_on: 2026-10-10
  last_verified: 2026-10-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2306-03310-v2
    - src-arxiv-2306-03310
    - src-libero-project-site
    - src-github-libero-readme
    - src-arxiv-2502-19645
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the date; the project
    site with scripts and styles stripped; the README at master; and OpenVLA-OFT's abstract page as evidence
    of current use.
  confidence: medium
  notes: |
    Reviewer checks:
    - Use has moved from the paper's lifelong protocol to multitask success per suite; continual-learning and

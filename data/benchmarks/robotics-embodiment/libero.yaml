# data/benchmarks/robotics-embodiment/libero.yaml
#
# P1-S3-T01, checkpoint entry 6 of 10 (copilot off). Filled from the LIBERO paper, arXiv 2306.03310 read as its
# v2 PDF (2023-10-14), and its abstract page; the project site; the repository README; and the abstract page
# of OpenVLA-OFT (arXiv 2502.19645), a 2025 paper that reports on it. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.

id: libero
name: LIBERO
aliases:
  - Lifelong Robot Learning Benchmark
tagline: 130 simulated, language-specified manipulation tasks for testing knowledge transfer in
  lifelong robot learning.
description: >
  A simulated manipulation benchmark (robosuite on MuJoCo) with a procedural generator for tasks and four
  fixed task suites: LIBERO-Spatial, LIBERO-Object and LIBERO-Goal, each holding one kind of knowledge
  shift, and LIBERO-100, split into LIBERO-90 for pretraining and LIBERO-10 (LIBERO-Long) for downstream
  evaluation. Every task has 50 human-teleoperated demonstrations. The paper scores lifelong learners
  on tasks presented in sequence, by forward transfer, negative backward transfer and the area under the
  success-rate curve. Most later work, vision-language-action models above all, reports multitask success
  rate per suite instead.
self_description:
  source: src-arxiv-2306-03310-v2
  quote: we introduce LIBERO, a novel benchmark of lifelong learning for robot manipulation
external_ids:
  arxiv: '2306.03310'
paper:
  title: 'LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning'
  arxiv: '2306.03310'
  version_read: v2
  source: src-arxiv-2306-03310-v2
released: 2023-06-05
released_note: The paper's first arXiv version, as the abstract page dates it.
released_source: src-arxiv-2306-03310
released_quote: Submitted on 5 Jun 2023

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/manipulation
  secondary:
    - robotics-embodiment/embodied-instruction-following
domain_basis:
  reason: Every task is tabletop manipulation by a simulated arm. Each task comes with a
    natural-language instruction that conditions the policy, which is the secondary leaf's case.
  source: src-github-libero-readme
  quote: 130 tasks grouped into four task suites
capability:
  - continual-learning
  - sensorimotor-control
capability_basis:
  continual-learning:
    reason: The designed protocol presents tasks in sequence and scores retention of earlier tasks
      (NBT) beside transfer to later ones (FWT). Later multitask use reports final success only,
      which continual-learning's exclusion would not cover; the capability is the paper's.
    source: src-arxiv-2306-03310-v2
    quote: 'We report three metrics: FWT (forward transfer) [20], NBT (negative backward transfer), and
      AUC (area under the success rate curve)'
  sensorimotor-control:
    reason: A policy issues actions to a simulated arm in closed loop, and the score is whether the
      resulting physical behaviour completes the task.
    source: src-arxiv-2306-03310-v2
    quote: All metrics are computed in terms of success rate
capability_considered_and_rejected:
  - term: transfer-learning
    reason: Forward transfer is measured, but it is measured as part of the lifelong protocol, so
      continual-learning is the term.

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every number is a success rate over episodes run in the simulator, each episode a success
    or a failure.
  source: src-arxiv-2306-03310-v2
  quote: All metrics are computed in terms of success rate
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: The entrants are learned visuomotor policies acting in the simulator, and the paper ranks
    lifelong learning procedures by the policies they yield -- rl-policy's own inclusion example.
    The policies are trained by behaviour cloning, not reinforcement.
  source: src-github-libero-readme
  quote: three lifelong learning algorithms with the sequential finetuning and multitask learning
    baselines

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. Vision-language-action papers report on LIBERO's four
    suites, among them OpenVLA-OFT in 2025, at 97.1% average success. The maintainers' repository
    was last pushed on 2025-03-15 (GitHub API).
  source: src-arxiv-2502-19645
  quote: sets a new state of the art on the LIBERO simulation benchmark, significantly boosting
    OpenVLA's average success rate across four task suites from 76.5% to 97.1%
activity: no-submission-channel
activity_basis:
  reason: The site and the README offer the paper, code, documentation and datasets, and no
    leaderboard or submission route; results appear in users' papers.
  source: src-libero-project-site
  quote: LIBERO Home LIBERO Paper Codebase Documentation Datasets Research

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: OpenVLA-OFT
    source: src-arxiv-2502-19645
    observed_on: 2026-10-10
    quote: sets a new state of the art on the LIBERO simulation benchmark
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's goal predicates, checked on the simulator's state at the end
  of an episode.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The simulator, task definitions, demonstrations and evaluation code are all released.
  source: src-github-libero-readme
  quote: We provide high-quality human teleoperation demonstrations for the four task suites in
    **LIBERO**

task:
  exists: true
  input:
    - camera images and proprioception from a simulated arm, with the task's language instruction
  output: Continuous arm and gripper actions, step by step, until the episode ends.
  scoring: Success rate per task over evaluation episodes; under the lifelong protocol, FWT, NBT and
    AUC over a sequence of tasks.
  source: src-arxiv-2306-03310-v2
  quote: All metrics are computed in terms of success rate

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Code, task definitions and demonstrations are public, the demonstrations under
      CC-BY-4.0.
    source: src-github-libero-readme
    quote: Creative Commons Attribution 4.0 International (CC BY 4.0)
  refresh: static
  refresh_basis:
    reason: The four suites are one fixed set. The procedural generator ships beside them, and
      static's inclusion test keeps a generator that adds no evaluation items static. Derived suites
      by others (LIBERO-PRO, LIBERO-Plus and the like) are separate benchmarks.
    source: src-arxiv-2306-03310-v2
    quote: We develop an extendible procedural generation pipeline that can in principle generate
      infinitely many tasks
  data_provenance:
    - simulation-generated
    - synthetic-procedural
  data_provenance_note: Tasks come from the procedural generator and are scored in a physics
    simulator; the training demonstrations were collected by human teleoperation.
  data_provenance_source: src-arxiv-2306-03310-v2
  data_provenance_quote: The demonstrations are collected by human experts through teleoperation
    with 3Dconnexion Spacemouse
  contamination_risk: unknown
  contamination_risk_note: Training on demonstrations of the evaluated tasks is the protocol, not
    contamination. Not assessed is whether large pretraining mixtures now include LIBERO's
    demonstrations beside other data, which would blur the lifelong protocol's pretraining split
    (LIBERO-90 versus LIBERO-10).
  contamination_evidence: []
  dataset_licence: CC-BY-4.0
  dataset_licence_source: src-github-libero-readme
  dataset_licence_quote: Creative Commons Attribution 4.0 International (CC BY 4.0)
  size_note: 130 tasks in four suites, with 50 demonstrations each ("we provide 50 trajectories of
    high-quality demonstrations for every single task").

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: LARG, RPL and the Statistical Learning & AI group at UT Austin
  maintainer_basis:
    reason: The site names three UT Austin groups as its holders; the code sits in the
      Lifelong-Robot-Learning organisation.
    source: src-libero-project-site
    quote: LARG, RPL, and Statistical Learning & AI groups at UT Austin
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results page of the maintainers'; results appear in
    independent papers.
  independence_flags: []
  independence_flags_note: None recorded. With no ranking of its own there is no board for the
    maintainers to compete on. Their own follow-up methods are reported in papers like anyone's.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside the robosuite and MuJoCo simulation LIBERO is
      built on.
    source: src-github-libero-readme
    quote: The following is a minimal example of retrieving a specific task from a specific task
      suite
  harness_availability: official-harness
  harness: libero (the package's evaluation scripts)
  harness_source: src-github-libero-readme
  harness_quote: we provide example scripts for retrieving a task, training and evaluation
  code_licence: MIT
  code_licence_source: src-github-libero-readme
  code_licence_quote: '| Codebase | [MIT License](LICENSE)'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which suite or protocol (a lifelong sequence or multitask training, and which
  # of the four suites), what pretraining data the policy saw (LIBERO-90, other robot data), and how many
  # evaluation episodes per task.
  material_extra:
    - subset_used
    - training_data_policy
    - n_samples

homepage: https://libero-project.github.io/
repository: https://github.com/Lifelong-Robot-Learning/LIBERO

tags:
  - lifelong-learning
  - manipulation
  - simulation
  - vision-language-action


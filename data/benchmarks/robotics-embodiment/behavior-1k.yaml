    event: channel-opened
    field: governance.submission_process
    to: maintainer-verified
    source: src-behavior-challenge-2025
    quote: 'Challenge Launch: September 2, 2025'
    note: The first challenge opened a results channel; before it, results appeared only in papers.
  - date: 2025-11-17
    event: channel-closed
    field: governance.submission_process
    source: src-behavior-challenge-2025
    quote: Submissions for the 2025 BEHAVIOR Challenge have officially closed!
  - date: 2026-07-02
    event: channel-opened
    field: governance.submission_process
    to: maintainer-verified
    source: src-behavior-challenge-site
    quote: 'Challenge Launch: 07/02/2026'
    note: The second challenge reopened the channel, now through a portal on a Hugging Face Space
      rather than a Google Form.

tags:
  - household
  - mobile-manipulation
  - long-horizon
  - simulation
  - competition
  - vision-language-action

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2403-09227-v1
    - src-arxiv-2403-09227
    - src-pmlr-v205-li23a
    - src-behavior-challenge-site
    - src-behavior-challenge-evaluation
    - src-behavior-challenge-submission
    - src-behavior-challenge-2025
    - src-behavior-challenge-2025-leaderboard
    - src-hf-behavior-1k-leaderboard-readme
    - src-behavior-1k-install
    - src-arxiv-2512-06951
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date, the venue and
    the licence; the CoRL 2022 paper's PMLR page; the 2026 challenge's home, rules and submission pages
    and
    the 2025 challenge's archived home page and leaderboard, all static documentation pages, read with
    scripts and styles stripped; the leaderboard Space's README at commit d5cd72b (the Space renders by
    script; its data files were read through the Hugging Face API, and the 2026 results file was empty);
    the installation page; and the winning 2025 solution's abstract page, as evidence of a learned
    entrant.
  confidence: medium
  review_checks:
    - check: The entry is BEHAVIOR-1K with the yearly challenges as editions. taxonomy/ cites the
        2026 edition as `2026-behavior-challenge`, and an edition entry of its own, with refresh,
        access and activity read per edition, is the alternative.
      field: versions
    - check: long-horizon-execution rests on irreversible state changes making full success
        unattainable after some errors; RoboCasa's entry rejects the term because a failed grasp can
        be retried, and many BEHAVIOR errors can be retried too.
      field: capability
      source: src-arxiv-2403-09227-v1
      quote: Binary state indicating whether the object has been sliced (irreversible)
    - check: classical-algorithm follows the challenge naming task and motion planning; no
        non-learned entrant is evidenced on the 2025 board, and TAMP systems often contain learned
        parts.
      field: designed_for_subjects
      source: src-behavior-challenge-evaluation
      quote: There are no restrictions on the type of policy used. Methods such as IL, RL, or TAMP
        are all allowed.
    - check: contamination_risk is medium because published leaderboard rows come from public
        instances; the taxonomy's Stage 3 pilot read the hidden-instance ranking alone and chose
        low.
      field: data.contamination_risk
    - check: The IP-address route to final evaluation, where the organisers query a policy server
        the entrant hosts, fits no submission_process term (taxonomy failure
        2026-behavior-challenge-006). The 2025 board labels its public rows self-reported although
        the rules state a sanity check.
      field: governance.submission_process
      source: src-behavior-challenge-2025-leaderboard
      quote: entries are self-reported on the public validation set
    - check: prize-sponsored-by-industry rests on NVIDIA's 2025 sponsorship; 2026's prize funders
        are not named in text, and NVIDIA Research also competed in 2025.
      field: governance.independence_flags
      source: src-behavior-challenge-site
      quote: We gratefully acknowledge the support of our sponsors who make this challenge possible
    - check: released is the first day of CoRL 2022 (14 December 2022), combined from the arXiv
        comment and PMLR's conference dates; PMLR dates the volume 2023.
      field: released
      source: src-pmlr-v205-li23a
      quote: month = {14--18 Dec}

# data/benchmarks/robotics-embodiment/simplerenv.yaml
#
# P1-S5-T01, robotics-embodiment entry 7 of 9. Filled from the SIMPLER paper, arXiv 2405.05941 read as its v1 PDF
# (2024-05-09, its only version), and its abstract page; the repository README at main and the repository's GitHub
# API record; and the abstract page of MemoryVLA (arXiv 2508.19236, ICLR 2026), a paper that reports on it. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: simplerenv
name: SimplerEnv
aliases:
  - SIMPLER
  - Simulated Manipulation Policy Evaluation for Real Robot Setups
tagline: Simulated copies of the Google Robot and WidowX/Bridge setups, built so simulated success
  tracks real-robot success.
description: >
  A suite of simulated evaluation environments (SAPIEN, through ManiSkill2) that recreate two real robot
  manipulation setups: the Google Robot of the RT-series papers and the WidowX arm of BridgeData V2.
  Policies trained on real robot data, such as RT-1, RT-1-X and Octo, are run in simulation on
  language-conditioned tasks. On the Google Robot they pick a coke can, move one object near another,
  open or close a drawer, and open a drawer then place an apple in it; on the WidowX they put a spoon
  on a towel, a carrot on a plate or an eggplant in a basket, and stack one block on another. Two
  setups narrow the visual gap to the real scenes: Visual Matching overlays real backgrounds and
  real-matched textures, and Variant Aggregation (Google Robot only) averages over randomized
  backgrounds, lighting, distractors and table textures. Each task is scored by success rate over a
  grid of object and robot placements. The release paper validated the suite with paired real and
  simulated evaluations, scored by Pearson correlation and a ranking metric of its own, Mean Maximum
  Rank Violation (MMRV). Later papers report simulated success rates per setup.
self_description:
  source: src-arxiv-2405-05941-v1
  quote: a collection of simulated environments for manipulation policy evaluation on common real
    robot setups
external_ids:
  arxiv: '2405.05941'
paper:
  title: Evaluating Real-World Robot Manipulation Policies in Simulation
  arxiv: '2405.05941'
  version_read: v1
  source: src-arxiv-2405-05941-v1
released: 2024-05-09
released_note: The paper's first and only arXiv version, as its abstract page dates it. The
  repository is CoRL 2024's, by its own description.
released_source: src-arxiv-2405-05941
released_quote: Submitted on 9 May 2024

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/manipulation
  secondary:
    - robotics-embodiment/embodied-instruction-following
domain_basis:
  reason: Every task is a robot arm (the Google Robot or a WidowX) changing the state of objects on
    a table or in a cabinet. Each task is given to a language-conditioned policy as a
    natural-language instruction, the secondary leaf's case.
  source: src-arxiv-2405-05941-v1
  quote: The robot is instructed to grasp the empty coke can on the table and lift it up
domain_considered_and_rejected:
  - term: robotics-embodiment/sim2real-transfer
    reason: The leaf measures how much of a policy's simulated performance survives on hardware.
      SimplerEnv runs the other way, scoring policies trained on real data in simulation, and its
      paired real runs validate the simulator as a proxy for real evaluation rather than score any
      policy's transfer.
    source: src-arxiv-2405-05941-v1
    quote: While sim-to-real approaches typically train in simulation and evaluate in the real
      world, we are interested in the opposite question
capability:
  - sensorimotor-control
  - transfer-learning
capability_basis:
  sensorimotor-control:
    reason: A policy issues end-effector and gripper actions to a simulated arm step by step through
      a Gym interface, and a trial succeeds only if the simulated scene reaches the task's goal.
    source: src-arxiv-2405-05941-v1
    quote: Manipulation poses distinct challenges for simulated evaluation due to the tight
      interaction loop between policy and environment
  transfer-learning:
    reason: Policies trained on real robot data are scored in a deliberately different, simulated
      environment, and the release paper reports the move itself, pairing each policy's real and
      simulated success rates and scoring their agreement by Pearson r and MMRV.
    source: src-arxiv-2405-05941
    quote: Through paired sim-and-real evaluations of manipulation policies, we demonstrate strong
      correlation between policy performance in SIMPLER environments and in the real world
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: Variant Aggregation averages success over randomized backgrounds, lighting, distractors
      and table textures, but as a more faithful estimate of real performance, not as a score on
      shifted inputs. The per-shift robustness study (five shift axes, two RT-1 checkpoints) is an
      analysis in the release paper, not a scored condition.
    source: src-arxiv-2405-05941-v1
    quote: we can aggregate evaluation results across a range of visual simulator characteristics to
      obtain a more faithful signal for the policy
  - term: grounding
    reason: Instructions name objects, but the score is task success and no source claims grounding;
      the same near miss as LIBERO.
  - term: long-horizon-execution
    reason: The longest task, opening a drawer and then placing an apple in it, chains two
      instructions, far short of the term's ten or so dependent actions.

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every benchmark number is a success rate over trials run in the SAPIEN simulator, each a
    success or a failure.
  source: src-arxiv-2405-05941-v1
  quote: In this work, we design an evaluation procedure in which policies trained on real data are
    evaluated in purpose-built simulated environments
evaluation_method_considered_and_rejected:
  - term: physical-trial
    reason: The release paper ran real-robot trials beside the simulated ones, but to validate the
      simulator; physical-trial's exclusion leaves out hardware runs that are a one-off experiment
      in the release paper, and the scored protocol is the simulator.
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: The entrants are learned visuomotor policies acting in the simulator, RT-1, RT-1-X, RT-2-X
    and Octo in the release paper and vision-language-action models in later papers. They are
    trained on real robot data by imitation, not on the environment by reinforcement; the vocabulary
    has no term of its own for vision-language-action models, and LIBERO's and RoboCasa's entries
    tag them the same way.
  source: src-arxiv-2405-05941-v1
  quote: We use popular open-source generalist robot policies
designed_for_subjects_considered_and_rejected:
  - term: physical-robot-system
    reason: The scored policies run in simulation; only the release paper's validation runs used
      hardware.
as_used:
  - protocol: Success rates on the WidowX/Bridge and Google Robot (Fractal) setups, reported as a
      comparison between policies; no real-robot counterpart or sim-and-real correlation is
      reported.
    source: src-arxiv-2508-19236
    quote: On SimplerEnv-Bridge, Fractal, LIBERO-5 suites and Mikasa-Robo, it achieves 71.9%, 72.7%,
      96.5%, and 41.2% success rates

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. MemoryVLA (ICLR 2026, revised in January 2026) reports
    SimplerEnv success rates on both setups. The maintainers' repository was last pushed on
    2026-09-30, a dependency pin; since the May 2024 release its commits have been fixes and
    documentation, so it is a maintained tool rather than a growing one.
  source: src-arxiv-2508-19236
  quote: On SimplerEnv-Bridge, Fractal, LIBERO-5 suites and Mikasa-Robo, it achieves 71.9%, 72.7%,
    96.5%, and 41.2% success rates
activity: no-submission-channel
activity_basis:
  reason: The README offers environments, inference scripts and the release paper's results for
    comparison, and no leaderboard or submission route; users add their own policies, run the
    evaluation and publish in their own papers.
  source: src-github-simplerenv-readme
  quote: If you want to use existing environments for evaluating new policies, you can keep

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: MemoryVLA
    source: src-arxiv-2508-19236
    observed_on: 2026-10-14
    quote: On SimplerEnv-Bridge, Fractal, LIBERO-5 suites and Mikasa-Robo, it achieves 71.9%, 72.7%,
      96.5%, and 41.2% success rates
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's success condition, checked on the simulator's state. The
  WidowX tasks also report partial success, such as grasping the object.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The environments, assets, policy inference code and evaluation scripts are released, with
    a guide to building new environments. The real-robot validation runs are not reproducible by
    others, but they are not the scored protocol.
  source: src-arxiv-2405-05941-v1
  quote: We open-source all SIMPLER environments as well as a detailed guide for environment
    creation

task:
  exists: true
  input:
    - images from the simulated robot's camera (under Visual Matching, composited onto a photograph
      of the real scene), with the task's language instruction
  output: End-effector translation and rotation deltas and a gripper command at each control step,
    until the episode ends.
  scoring: Success rate per task over a grid of object and robot placements. Google Robot results
    are averaged over four tuned arm colours (Visual Matching) or over visual variants (Variant
    Aggregation), and stochastic policies over three seeds. The release paper also scores the
    simulator itself, by MMRV and Pearson r against real success rates.
  source: src-github-simplerenv-readme
  quote: By default, Google Robot environments use a control frequency of 3hz, and Bridge
    environments use a control frequency of 5hz

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The environments, scene and object assets and evaluation scripts are public in the
      repository and install with pip, without registration.
    source: src-github-simplerenv-readme
    quote: Install ManiSkill2 real-to-sim environments and their dependencies
  refresh: static
  refresh_basis:
    reason: The README's environments are the paper's tasks plus a pick-any-object variant, and the
      repository's commits since the May 2024 release pin dependencies and edit documentation (read
      on the GitHub API, 2026-10-14). The ManiSkill3 port of the Bridge environments is a second
      implementation beside them, not a change to their content.
    source: src-github-simplerenv-readme
    quote: We have also integrated the Bridge dataset environments into ManiSkill3, which offers GPU
      parallelization and can run 10-15x faster than the ManiSkill2 version
  data_provenance:
    - simulation-generated
  data_provenance_note: Scenes are simulated in SAPIEN with object assets from Objaverse, 3D scans
    and single-view reconstruction. Under Visual Matching, photographs of the real evaluation scenes
    are overlaid as backgrounds and real textures are projected onto objects, so observations mix
    rendered and photographed pixels. No training data ships; policies bring their own.
  data_provenance_source: src-github-simplerenv-readme
  data_provenance_quote: Matching real & sim visual appearances for policy evaluation by overlaying
    real-world images onto simulation backgrounds
  contamination_risk: unknown
  contamination_risk_note: The tasks are chosen to resemble those in the real datasets the policies
    train on (RT-1's and BridgeData V2's), so that overlap is the design, not contamination. Not
    assessed is whether later policies train on rollouts in, or assets from, the simulated scenes.
  contamination_evidence: []
  size:
    - count: 8
      unit: tasks (four on the Google Robot, four on the WidowX)
      subset: the release paper's evaluation
      note: Counted from the paper's appendix task lists; open and close drawer count as one task.
      source: src-arxiv-2405-05941-v1
      quote: For the WidowX + Bridge (with WidowX-250 6DOF robot), we adopt the following tasks
    - count: 10
      unit: prepackaged task environments (six Google Robot, four WidowX)
      subset: the README's Current Environments table
      note: Counted from the table's rows, which split open and close drawer and add
        google_robot_pick_object to the paper's tasks.
      source: src-github-simplerenv-readme
      quote: To get a list of all available environments, run
    - count: 75
      unit: trials (25 placements in each of three can orientations)
      subset: Pick Coke Can, the largest task's real-world grid
      note: Simulated trials multiply this by the number of arm colours or visual variants, and by
        seeds for stochastic policies.
      source: src-arxiv-2405-05941-v1
      quote: yielding 25 trials per orientation and 75 trials in total

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The SimplerEnv authors (the simpler-env GitHub organisation; UC San Diego, Stanford,
    UC Berkeley and Google DeepMind)
  maintainer_basis:
    reason: The repository sits in the simpler-env organisation account, and the paper credits the
      code release to authors at UC San Diego, Stanford and UC Berkeley. No institution is stated as
      its holder.
    source: src-arxiv-2405-05941-v1
    quote: 'SIMPLER Codebase Release: Xuanlin Li, Jiayuan Gu, Karl Pertsch, Kyle Hsu, Oier Mees'
  maintainer_type: community-collective
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or submission route. The README ships the release paper's
    real and simulated results (with MMRV and Pearson functions) so that other evaluation approaches
    can be compared with SIMPLER; those are the release paper's own results. Later results appear in
    their authors' papers.
  submission_process_source: src-github-simplerenv-readme
  submission_process_quote: To make comparisons easy, we provide our real and SIMPLER evaluation
    performance for all policies on all tasks
  independence_flags: []
  independence_flags_note: None recorded. With no ranking there is no board for the maintainers to
    compete on. The authors include Google DeepMind researchers and members of the Octo team, and
    the release paper's validation uses the RT-series and Octo policies; those were existing
    open-source policies, not systems built for the benchmark.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside the SAPIEN simulation (through ManiSkill2)
      that SimplerEnv is built on, and it needs an NVIDIA GPU for rendering.
    source: src-arxiv-2405-05941-v1
    quote: We instantiate SIMPLER on top of the SAPIEN physics simulator
  harness_availability: official-harness
  harness: simpler_env (main_inference.py, the ManiSkill2 evaluator and the scripts/ sweeps)
  harness_source: src-github-simplerenv-readme
  harness_quote: Policy inference scripts to reproduce our Google Robot and WidowX real-to-sim
    evaluation results
  code_licence: MIT
  code_licence_source: src-simplerenv-gh-api
  code_licence_quote: '"spdx_id":"MIT"'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile: which setup (Google Robot Visual Matching or Variant Aggregation, WidowX Visual
  # Matching) and which task variants, which implementation (the main branch on ManiSkill2 and SAPIEN 2, or the
  # ManiSkill3 port of the Bridge environments), how many arm colours, variants and seeds were averaged, and whether
  # the policy was fine-tuned on the Fractal or Bridge data the tasks were modelled on.
  material_extra:
    - subset_used
    - training_data_policy
    - n_samples

homepage: https://simpler-env.github.io/
repository: https://github.com/simpler-env/SimplerEnv

tags:
  - manipulation
  - simulation
  - real-to-sim
  - vision-language-action
  - google-robot
  - widowx

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2405-05941-v1
    - src-arxiv-2405-05941
    - src-github-simplerenv-readme
    - src-simplerenv-gh-api
    - src-arxiv-2508-19236
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date and a clean
    copy of the abstract; the README at main; the repository's GitHub API record for its licence and
    last push; and MemoryVLA's abstract page as evidence of current use. The project site repeats the
    paper and was read but not cited.
  confidence: medium
  review_checks:
    - check: The primary domain is manipulation and sim2real-transfer is rejected, because
        SimplerEnv scores real-trained policies in simulation and the leaf is about simulated
        performance surviving on hardware. Its stated purpose is predicting real-world performance
        from simulation, so a reviewer may want sim2real-transfer as primary or secondary.
      field: domain
      source: src-arxiv-2405-05941-v1
      quote: While sim-to-real approaches typically train in simulation and evaluate in the real
        world, we are interested in the opposite question
    - check: transfer-learning rests on the release paper's paired real and simulated evaluations
        (taxonomy/capabilities.yaml also names SimplerEnv as the term's example). Later papers
        report simulated success only, so the transfer is reported in the design, not in use.
      field: capability
    - check: distribution-shift-generalization is rejected, but later papers report Variant
        Aggregation as a column of its own, a score averaged over randomized visual variants;
        whether that is a score on shifted inputs is a judgement call.
      field: capability
      source: src-github-simplerenv-readme
      quote: creating different sim environment variants (e.g., different backgrounds, lightings,
        distractors, table textures, etc) and averaging their results
    - check: maintainer_type is community-collective because the repository is in a project
        organisation with code-release authors from three universities. If the UC San Diego group
        that leads the code is taken as holder, it is academic-lab.
      field: governance.maintainer_type
    - check: refresh static rests on the commit history read on the GitHub API, which is not a
        Source. Whether the ManiSkill3 port of the Bridge environments, with its different simulator
        build, should be a version or a variant entry.
      field: data.refresh
    - check: The README also offers the paired real results and the MMRV and Pearson functions so
        that other offline policy-evaluation methods can be scored against SIMPLER. That second use,
        whose entrant is an evaluation method rather than a policy, is not modelled here.
      field: task
      source: src-github-simplerenv-readme
      quote: We make it easy to compare your offline robot policy evaluation approach to SIMPLER

# data/benchmarks/robotics-embodiment/meta-world.yaml
#
# P1-S5-T02, robotics-embodiment entry 14. Filled from the Meta-World paper, arXiv 1910.10897 read as its v2 PDF
# (2021-06-14, which reports on the -v2 environments) and its v1 PDF (the CoRL 2019 version), and its abstract page;
# the Meta-World+ paper, arXiv 2505.11289 read as its v2 PDF (NeurIPS 2025 Datasets and Benchmarks), and its abstract
# page; the repository's README and pyproject.toml at commit c0dafaf, pyproject.toml at the 3.0.0 tag, README and
# setup.py at the v2.0.0 tag, and setup.py at a 2019 commit; the GitHub API's release list; three documentation
# pages (benchmark descriptions, evaluation, reward functions); the Farama Foundation's About page; and the abstract
# pages of METTA (arXiv 2610.31656) and Evo-World (arXiv 2610.12936), 2026 papers that report on it. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.

id: meta-world
name: Meta-World
aliases:
  - Meta-World+
  - Metaworld
aliases_note: The repository, package and documentation spell it Metaworld. Meta-World+ is the title
  of the 2025 paper that accompanies release 3.0.0, which is a version here, not a separate
  benchmark.
tagline: 50 simulated Sawyer-arm manipulation tasks in multi-task and meta-RL task sets, scored by
  success rate.
description: >
  An open-source simulated benchmark of 50 robotic manipulation tasks performed by one simulated Sawyer
  arm on a table-top, built so that a single policy can address every task: all tasks share a 39-dimensional
  observation space and a 4-dimensional action space (end-effector displacement and gripper). It was released
  with a CoRL 2019 paper and is now maintained by the Farama Foundation. The protocol is a set of task
  sets. MT1, MT10 and MT50 train one multi-task policy on 1, 10 or 50 tasks, with a one-hot task ID, and
  score it on the same tasks and goals. ML1 meta-trains on goal variations of one task and tests on held-out
  goals; ML10 and ML45 meta-train on 10 or 45 tasks and test few-shot adaptation on 5 held-out tasks.
  Each task has a success condition, typically the object within a distance threshold of its goal, and
  the reported number is the mean success rate over tasks and goal positions, an episode counting as a
  success if the condition held at any step. The environments changed without announced versions: the
  -v1 environments and rewards of 2019 gave way to -v2 environments with rewritten rewards, and Meta-World+
  (release 3.0.0, 2025) moved to MuJoCo's own Python bindings and Gymnasium as -v3 environments, kept
  both reward functions selectable, and added MT25 and ML25. Its authors show that results under the two
  reward functions are not comparable. There is no leaderboard; results appear in papers, among them vision-language-action
  papers reporting on the MT50 tasks.
self_description:
  source: src-github-metaworld-readme
  quote: Meta-World is an open source benchmark for developing and evaluating multi-task and meta
    reinforcement learning algorithms for continuous control robotic manipulation environments
external_ids:
  arxiv: '1910.10897'
paper:
  title: 'Meta-World: A Benchmark and Evaluation for Multi-Task and Meta Reinforcement Learning'
  arxiv: '1910.10897'
  version_read: v2
  source: src-arxiv-1910-10897-v2
released: 2019-10-24
released_note: The paper's first arXiv version, the CoRL 2019 manuscript, as the abstract page dates
  it. Its v2 (2021-06-14) is an update of that manuscript.
released_source: src-arxiv-1910-10897
released_quote: Submitted on 24 Oct 2019 (v1), last revised 14 Jun 2021 (this version, v2)
release_venue: CoRL 2019 (3rd Conference on Robot Learning, Osaka); Meta-World+ at NeurIPS 2025
  Datasets and Benchmarks
release_venue_source: src-arxiv-1910-10897-v1
release_venue_quote: 3rd Conference on Robot Learning (CoRL 2019), Osaka, Japan.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/manipulation
  secondary: []
domain_basis:
  reason: Every task is a simulated Sawyer arm changing the state of objects -- reaching, pushing,
    picking and placing, opening doors, drawers and windows -- and every episode is scored on
    whether the object reached its goal. The claim is about multi-task and meta-RL algorithms, which
    is the family's mujoco-gymnasium near miss; the entry keeps it here because the task
    distribution is defined by one robot body manipulating objects, the paper motivates it by robots
    acquiring skills, and the score is task success rather than a control objective (see
    review_checks).
  source: src-arxiv-1910-10897-v2
  quote: All of our tasks are performed by a simulated Sawyer robot.
domain_considered_and_rejected:
  - term: general-intelligence/meta-learning
    reason: Its definition, how quickly a system improves across a distribution of related tasks,
      describes ML1, ML10 and ML45. But the general-intelligence exclusion sends a benchmark whose
      breadth lies inside one family to that family's subdomains, every task is manipulation by one
      arm, and the MT task sets score multi-task training, not adaptation.
    source: src-arxiv-2505-11289-v2
    quote: Meta-World contains 50 different robotic manipulation tasks for a single Sawyer Robot
      Arm2 to solve.
  - term: robotics-embodiment/continuous-control
    reason: The README calls the environments continuous control, but every task is scored on a
      semantic success condition, an object brought to its goal, not on a control objective, which
      the leaf's definition requires.
    source: src-github-metaworld-readme
    quote: Meta-World is an open source benchmark for developing and evaluating multi-task and meta
      reinforcement learning algorithms for continuous control robotic manipulation environments
  - term: robotics-embodiment/dexterous-manipulation
    reason: The gripper is commanded by one scalar beside the end-effector displacement; the
      difficulty is the breadth of tasks, not degrees of freedom, so the leaf's distinction keeps it
      under manipulation.
    source: src-arxiv-1910-10897-v2
    quote: The action space is a 2-tuple consisting of the change in 3D space of the end-effector
      followed by a normalized torque that the gripper
  - term: robotics-embodiment/embodied-instruction-following
    reason: A task is identified by a one-hot task ID in the multi-task sets and not at all in the
      meta-learning sets; there is no natural-language instruction.
    source: src-arxiv-1910-10897-v2
    quote: In our experiments, the algorithm is typically provided with a one-hot vector indicating
      the current task.
capability:
  - sensorimotor-control
  - transfer-learning
capability_note: MT10 and MT50, the most reported task sets, score learning many distinct tasks at
  once with one policy, on those same tasks. No capability term names multi-task learning; the miss
  is logged (taxonomy/_failures/2026-11-04-meta-world-001).
capability_basis:
  sensorimotor-control:
    reason: A policy issues end-effector displacements and a gripper command to a simulated arm in
      closed loop, and the episode is scored on whether the resulting physical state meets the
      task's success condition.
    source: src-arxiv-1910-10897-v2
    quote: The action space is a 2-tuple consisting of the change in 3D space of the end-effector
      followed by a normalized torque that the gripper
  transfer-learning:
    reason: ML10 and ML45 meta-train on 10 or 45 tasks and score adaptation to 5 held-out tasks with
      new objects and interactions, the meta-test success reported apart from meta-training success
      -- the inclusion test's new tasks after earlier ones. It holds for those two task sets only
      (see subsets); ML1 varies only goal positions.
    source: src-arxiv-1910-10897-v2
    quote: not just in terms of parametric variation in goals, but completely new objects and
      interaction scenarios
capability_considered_and_rejected:
  - term: sample-efficiency
    reason: Few-shot adaptation is the meta-RL claim, and the evaluation pseudocode defaults to 10
      adaptation episodes per test goal, but no budget of training samples or steps is fixed at
      which the score is taken, and the multi-task sets fix none at all.
    source: src-metaworld-docs-evaluation
    quote: adaptation_steps = 1, adaptation_episodes = 10, num_evals = 40
  - term: continual-learning
    reason: All training tasks are available at once in both the multi-task and the meta-training
      phase; nothing is presented in sequence and no retention is scored.
    source: src-metaworld-docs-benchmark-descriptions
    quote: Unlike usual RL benchmarks, the training of the agent is strictly split into training and
      testing phases.
  - term: compositional-generalization
    reason: Meta-World+ speaks of composing skills to adapt to unseen tasks, but the original paper
      says the held-out tasks bring completely new objects and interaction scenarios, which the
      term's exclusion (new primitives) leaves out.
    source: src-arxiv-1910-10897-v2
    quote: not just in terms of parametric variation in goals, but completely new objects and
      interaction scenarios
  - term: distribution-shift-generalization
    reason: ML1 tests on held-out goal and object positions within one task, which differ from
      training only by sampling, the term's exclusion; the held-out tasks of ML10 and ML45 change
      the task, which is transfer-learning.
    source: src-arxiv-1910-10897-v2
    quote: meta-testing on 50 heldout positions

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every reported number is the share of simulated episodes in which the task's success flag
    was set at any step, averaged over tasks and goal positions.
  source: src-metaworld-docs-evaluation
  quote: In Metaworld, agents are to be evaluated using their success rate on a set of tasks and
    goal positions, not the episodic reward achieved during training.
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: Each task has a shaped dense reward (V1 or V2) for training, and the evaluation
      utilities also return mean returns, but the documentation rules out reward as the evaluation
      metric.
    source: src-metaworld-docs-evaluation
    quote: In Metaworld, agents are to be evaluated using their success rate on a set of tasks and
      goal positions, not the episodic reward achieved during training.
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: The environments are built for policies trained by multi-task and meta-reinforcement
    learning; the paper's baselines (multi-task PPO, TRPO and SAC, task embeddings, RL2, MAML and
    PEARL) come from the authors' Garage library. Vision-language-action models now report on the
    MT50 tasks too (as_used); rl-policy covers trained policies on a Benchmark either way.
  source: src-arxiv-1910-10897-v2
  quote: We use the baselines in the Garage [59] reinforcement learning library, which we developed
    for benchmarking Meta-World.
as_used:
  - protocol: Vision-language-action models report a success rate averaged over difficulty tiers of
      the MT50 tasks, not the designed protocol's mean over tasks and goal positions after
      multi-task RL training.
    source: src-arxiv-2610-12936
    quote: achieving a tier-averaged success rate of 91.1% on Meta-World MT50
    note: The tiers are not defined in any Meta-World source read here, and the abstract does not
      say how the policy was trained or which release and reward function were used.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced, among them METTA's on ML10 and ML45 in October 2026, and
    the maintainers published release v3.1.1 on 2026-06-28; the repository was last pushed on
    2026-10-09 (GitHub API).
  source: src-arxiv-2610-31656
  quote: On unseen held-out Meta-World ML10/45 test environments, METTA achieves a success rate over
    $50\%$ while maintaining a low training budget and short wall-clock time.
activity: no-submission-channel
activity_basis:
  reason: The README and documentation offer installation, the API, the task sets, evaluation
    utilities and a citation, and no leaderboard or submission route; Meta-World+ asks users to run
    baselines themselves rather than compare with published numbers.
  source: src-arxiv-2505-11289-v2
  quote: Thus, we believe that users should be running their own baselines rather than copying
    numbers from previous works.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: METTA
    source: src-arxiv-2610-31656
    observed_on: 2026-11-04
    quote: On unseen held-out Meta-World ML10/45 test environments, METTA achieves a success rate
      over $50\%$ while maintaining a low training budget and short wall-clock time.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each task's success condition, checked on the simulator's state; typically
  the task-relevant object within a small distance (such as 5 cm) of its goal.
ground_truth_source_source: src-arxiv-1910-10897-v2
ground_truth_source_quote: this success metric is typically based on the distance between the
  task-relevant object and its
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The environments, task sets and evaluation utilities install with pip, under MIT;
    Meta-World+ releases the scripts behind its results.
  source: src-github-metaworld-readme
  quote: To install Meta-World, use `pip install metaworld`

task:
  exists: true
  input:
    - a 39-dimensional state vector -- end-effector position, gripper opening, the positions and
      quaternions of up to two objects, the previous step's values and the goal position (zeroed in
      the meta-learning sets); MT10 and MT50 append a one-hot task ID
  output: A 4-dimensional action each step (end-effector displacement and gripper command), up to a
    500-step horizon.
  scoring: Per task set, the mean over tasks and goal positions of episode success, the success flag
    set at any step. In MT1, MT10 and MT50 one episode per training goal (50 per task); in ML10 and
    ML45 three post-adaptation episodes per test goal (40 goals for each of 5 held-out tasks), after
    adaptation episodes on that goal.
  source: src-metaworld-docs-evaluation
  quote: The final metric is the average success rate achieved across all tasks and episodes.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The package, its environments and its evaluation utilities install from PyPI without an
      account.
    source: src-github-metaworld-readme
    quote: To install Meta-World, use `pip install metaworld`
  refresh: versioned-releases
  refresh_basis:
    reason: The environments carry version suffixes (-v1, -v2, -v3) and the package has tagged
      releases (v2.0.0, 3.0.0, v3.1.1). The change from -v1 to -v2 was not announced as a release,
      which Meta-World+ was written to remedy.
    source: src-arxiv-2505-11289-v2
    quote: This work highlights the need for explicit versioning of software benchmarks that
      researchers should report in their works.
  data_provenance:
    - simulation-generated
  data_provenance_note: The tasks are hand-built MuJoCo scenes with hand-written success conditions
    and rewards; object and goal positions are sampled, and every episode and its success are
    computed in the simulator.
  data_provenance_source: src-arxiv-1910-10897-v2
  data_provenance_quote: All of the tasks are implemented in the MuJoCo physics engine [53], which
    enables fast simulation of physical contact.
  contamination_risk: unknown
  contamination_risk_note: In the multi-task sets the evaluation tasks and goals are the training
    ones by design. The meta-test tasks of ML10 and ML45 are fixed and published, so an entrant
    could train on them; nothing read here forbids or detects it.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: The headline is a success rate bounded at 1, every episode successful. The paper checked
      that each task can be solved by single-task RL, which shows the tasks are learnable one at a
      time, not that any task set's bound is reachable.
    source: src-arxiv-1910-10897-v2
    quote: verify that each of the 50 presented tasks are indeed solveable by existing single-task
      reinforcement learning algorithms
  dataset_licence: null
  dataset_licence_note: Meta-World ships simulated scenes and task definitions inside its package,
    not a dataset. The package is MIT (execution.code_licence); no sources read state a separate
    licence for the scene assets.
  size:
    - count: 50
      unit: tasks
      source: src-arxiv-1910-10897
      quote: we propose an open-source simulated benchmark for meta-reinforcement learning and
        multi-task learning consisting of 50 distinct robotic manipulation tasks
    - count: 10
      unit: tasks
      subset: MT10
      source: src-arxiv-1910-10897-v2
      quote: 'The MT10 evaluation uses 10 environments: reach, push, pick and place, open door, open drawer,
        close drawer, press button top-down, insert peg side, open window, and open box.'
    - count: 5
      unit: held-out test tasks, beside 10 or 45 meta-training tasks
      subset: ML10 and ML45
      source: src-github-metaworld-readme
      quote: ML10 comprises 10 train tasks with 5 test tasks, while ML45 comprises of 45 training
        tasks with 5 test tasks.
    - count: 40
      unit: test goal positions per held-out task
      subset: ML10 and ML45 (the 3.x evaluation)
      source: src-metaworld-docs-evaluation
      quote: For ML10 and ML45, there are 5 held out testing tasks which are different from the
        training tasks, and each of them also has 40 goal positions never seen during training.
    - count: 25
      unit: training tasks
      subset: MT25 and ML25 (added in 3.0.0)
      source: src-arxiv-2505-11289-v2
      quote: To create the training task set of 25 tasks, we select 12 tasks that are solved in MT50
        and 13 tasks that are not solved.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Farama Foundation
  maintainer_basis:
    reason: The repository sits in the Farama-Foundation organisation and the documentation site is
      the Foundation's; the README at the v2.0.0 tag announced the hand-over from the original
      authors, whose code was in the rlworkgroup organisation (see history).
    source: src-github-metaworld-readme-v2-0-0
    quote: Metaworld is now maintained by the Farama Foundation!
  maintainer_type: nonprofit
  maintainer_type_basis:
    reason: The holder of the repository and the package is a single nonprofit, outside the
      university and standards systems, with no member governance stated.
    source: src-farama-about
    quote: The Farama Foundation is a 501(c)(3) nonprofit that advances reinforcement learning
      through open-source tools and shared standards for researchers and industry practitioners.
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results page; results appear in papers. Meta-World+
    re-ran published multi-task and meta-RL methods under both reward functions from its own code
    base.
  independence_flags: []
  independence_flags_note: None recorded. With no ranking there is no board for the maintainers to
    compete on. Meta-World+'s authors include Farama Foundation members and three of the original
    authors; their re-runs of published methods are replication, not a competing entry.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: Every run needs MuJoCo -- through mujoco-py up to v2.0.0, through MuJoCo's own
    Python bindings since 3.0.0, pinned at mujoco 3.3.0 since v3.1.1 -- with Python 3.11 to 3.13 on
    Linux or macOS. Meta-World+'s runs took about 6 hours for MT10, 12 for MT25 and 25 for MT50 on
    an AMD Epyc 7402 with one NVIDIA A100.
  compute_tier_source: src-arxiv-2505-11289-v2
  compute_tier_quote: on an AMD Epyc 7402 24-Core Processor with an NVIDIA A100 PCI GPU
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside MuJoCo at the version the release pins.
    source: src-github-metaworld-pyproject
    quote: '"mujoco==3.3.0",'
  reproducibility_blockers:
    - specific-simulator-build
  reproducibility_blockers_note: >
    Scores depend on Meta-World's environment version and the simulator build together. The releases pinned:
    mujoco-py >=2.0,<2.1 with gym 0.12.1 (the 2019 code); mujoco-py >=2.0,<2.2 with gym >=0.15.4 (v2.0.0);
    mujoco >=3.0.0 with Gymnasium (3.0.0); mujoco ==3.3.0 (v3.1.1), because MuJoCo releases after 3.3.0
    represent contacts differently. The reward function (V1 or V2) is a separate choice since 3.0.0.
  reproducibility_blockers_source: src-github-api-metaworld-releases
  reproducibility_blockers_quote: The major change from v3.0.0 to v3.1.1 is the pinning of
    `mujoco==3.3.0` due to some changes with how mujoco represents contacts between objects in
    mujoco > 3.3.0.
  harness_availability: official-harness
  harness: metaworld (Gymnasium environments registered as Meta-World/MT1 to Meta-World/ML45-test,
    with the metaworld.evaluation package's evaluation and metalearning_evaluation functions, since
    3.0.0)
  harness_source: src-metaworld-docs-evaluation
  harness_quote: the benchmark provides two evaluation utility functions through the
    metaworld.evaluation package
  harness_gotcha:
    source: src-metaworld-docs-reward-functions
    quote: Meta-World currently implements two types of reward functions that can be selected by
      passing the reward_func_version keyword argument to gym.make(...).
  harness_gotcha_note: The reward function is an argument to gym.make, not part of the -v3
    environment name, so a result has to state it; the documentation ties the V1 rewards to papers
    on the -v1 environments and V2 to those on -v2.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for Farama-Foundation/Metaworld also reports MIT
    (read 2026-11-04).
  code_licence_source: src-github-metaworld-pyproject
  code_licence_quote: '"License :: OSI Approved :: MIT License",'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile: the score depends on Meta-World's release and the MuJoCo build together.
  # simulator is MuJoCo (through mujoco-py before 3.0.0, its own bindings since) and simulator_version the MuJoCo
  # release the package pinned (mujoco==3.3.0 in v3.1.1). harness carries the metaworld release, the environment
  # suffix (-v1, -v2, -v3) and reward_func_version (V1 or V2), which no condition field names; subset_used the task
  # set (MT10, MT50, ML10, ML45, MT25, ML25, ML1/MT1 with its task, or a custom set); n_samples the evaluation
  # episodes and seeds; training_data_policy whether the policy learned by online RL or from demonstrations.
  material_extra:
    - simulator
    - simulator_version
    - subset_used
    - harness
    - n_samples
    - training_data_policy

liveness:
  repo_last_commit: 2026-10-09
  reproduction_script_present: true
  last_checked: 2026-11-10

homepage: https://metaworld.farama.org/
repository: https://github.com/Farama-Foundation/Metaworld

versions:
  - version: v1
    label: Meta-World as released with the CoRL 2019 paper (-v1 environments, V1 rewards)
    version_kind: revision
    released: 2019-10-24
    items: 50
    changes: The first release, with the 50 tasks, dense V1 rewards adapted from one pick-and-place
      reward, and the ML1, MT1, MT10, MT50, ML10 and ML45 task sets; the code required mujoco-py
      >=2.0,<2.1 and gym 0.12.1.
    superseded_by: v2
    frozen: true
    sources:
      - src-arxiv-1910-10897-v1
      - src-github-metaworld-setup-2019
      - src-arxiv-2505-11289-v2
  - version: v2
    label: The -v2 environments with V2 rewards (tagged v2.0.0 in 2023)
    version_kind: revision
    items: 50
    changes: The same 50 tasks and task sets, each environment re-implemented as -v2, with new dense
      rewards written as fuzzy constraints on a common 0-10 scale. Introduced without a release; the
      paper's 2021 revision reports on the -v2 environments, and the v2.0.0 tag (2023-06-16), the
      last code before the Farama Foundation's maintenance, requires mujoco-py >=2.0,<2.2 and gym
      >=0.15.4. Meta-World+ shows results under V1 and V2 rewards are not comparable.
    breaking: true
    supersedes_version: v1
    superseded_by: 3.0.0
    frozen: true
    sources:
      - src-arxiv-1910-10897-v2
      - src-arxiv-2505-11289-v2
      - src-github-metaworld-readme-v2-0-0
      - src-github-metaworld-setup-v2-0-0
      - src-github-api-metaworld-releases
  - version: 3.0.0
    label: Meta-World+ (metaworld 3.0.0, -v3 environments), NeurIPS 2025 Datasets and Benchmarks
    version_kind: revision
    released: 2025-06-14
    items: 50
    changes: MuJoCo's own Python bindings (mujoco >=3.0.0) instead of mujoco-py, Gymnasium >=1.0
      instead of gym, and gym.make registration; the -v3 environments with V1 and V2 rewards both
      selectable, the -v1 environments removed; MT25 and ML25 and custom task sets added; evaluation
      utilities. The paper claims full reproducibility of past results.
    supersedes_version: v2
    superseded_by: 3.1.1
    frozen: true
    sources:
      - src-arxiv-2505-11289-v2
      - src-arxiv-2505-11289
      - src-github-api-metaworld-releases
      - src-github-metaworld-pyproject-3-0-0
      - src-metaworld-docs-reward-functions
  - version: 3.1.1
    label: metaworld 3.1.1 (MuJoCo pinned at 3.3.0)
    version_kind: revision
    released: 2026-06-28
    items: 50
    changes: Pins mujoco 3.3.0, since later MuJoCo releases represent contacts between objects
      differently; fixes the button-press dense rewards and adds render options and a camera. v3.1.0
      was skipped.
    supersedes_version: 3.0.0
    frozen: false
    sources:
      - src-github-api-metaworld-releases
      - src-github-metaworld-pyproject

subsets:
  - id: meta-world#mt1
    label: MT1
    items: 1
    scored_separately: true
    capability_override:
      - sensorimotor-control
    evidence:
      - source: src-github-metaworld-readme
        quote: In the MT10 and MT50 benchmarks, the observations returned by the benchmark will come
          with one-hot task IDs appended to the state.
    notes: One of the 50 tasks, chosen by the user, learned across 50 goal positions with the goal
      observable, and scored on those goals.
  - id: meta-world#mt10
    label: MT10
    items: 10
    scored_separately: true
    capability_override:
      - sensorimotor-control
    evidence:
      - source: src-arxiv-1910-10897-v2
        quote: 'The MT10 evaluation uses 10 environments: reach, push, pick and place, open door, open
          drawer, close drawer, press button top-down, insert peg side, open window, and open box.'
    notes: Ten tasks learned at once with a one-hot task ID, scored on the training tasks and goals.
  - id: meta-world#mt50
    label: MT50
    items: 50
    scored_separately: true
    capability_override:
      - sensorimotor-control
    evidence:

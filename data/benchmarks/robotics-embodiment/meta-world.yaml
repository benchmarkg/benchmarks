curation:
  added_by: agent (P1-S5-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1910-10897-v2
    - src-arxiv-1910-10897-v1
    - src-arxiv-1910-10897
    - src-arxiv-2505-11289-v2
    - src-arxiv-2505-11289
    - src-github-metaworld-readme
    - src-github-metaworld-pyproject
    - src-github-metaworld-pyproject-3-0-0
    - src-github-metaworld-readme-v2-0-0
    - src-github-metaworld-setup-v2-0-0
    - src-github-metaworld-setup-2019
    - src-github-api-metaworld-releases
    - src-metaworld-docs-benchmark-descriptions
    - src-metaworld-docs-evaluation
    - src-metaworld-docs-reward-functions
    - src-farama-about
    - src-arxiv-2610-31656
    - src-arxiv-2610-12936
  sources_note: >
    The Meta-World paper's v2 and v1 PDFs and the Meta-World+ paper's v2 PDF (DOIs, not archived) read
    as text; both abstract pages for dates and venues; the README and pyproject.toml at commit c0dafaf
    on main, pyproject.toml at the 3.0.0 tag, README and setup.py at the v2.0.0 tag and setup.py at commit
    ed59610 (2019), for the simulator each release pins; the GitHub API's release list; three documentation
    pages and the Farama Foundation's About page with scripts and styles stripped; and the abstract pages
    of METTA and Evo-World as evidence of current use.
  confidence: medium
  review_checks:
    - check: Embodiment. Meta-World's claim is about multi-task and meta-RL algorithms, as
        mujoco-gymnasium's is about control algorithms, and the family's near miss excludes
        benchmarks whose embodiment is not the point. The entry keeps it in
        robotics-embodiment/manipulation because the tasks are object manipulation by one robot arm,
        scored on object state, and the paper motivates it by robots acquiring skills.
        general-intelligence/meta-learning as primary, or a machine-learning home the taxonomy
        lacks, is the alternative.
      field: domain
      source: src-arxiv-1910-10897
      quote: Meta-reinforcement learning algorithms can enable robots to acquire new skills much
        more quickly
    - check: Farama maintenance is not a fork. The repository was transferred (created 2019-09-09,
        per the GitHub API), the README at v2.0.0 announces the Foundation as maintainer, and three
        original authors are on Meta-World+, so one Benchmark with a maintainer-changed event, not a
        lineage fork; confirm that the 04 S4 test (different maintainer) does not apply to a
        hand-over.
      field: lineage
      source: src-github-metaworld-readme-v2-0-0
      quote: Metaworld is now maintained by the Farama Foundation!
    - check: version_kind. v1 to v2 and v2 to 3.0.0 are revisions (the same 50 tasks and task sets,
        changed environments and rewards). 3.0.0 also renamed the environments, removed -v1 and
        added two task sets, so an edition reading is arguable. breaking is left false for 3.0.0 and
        3.1.1 on the maintainers' reproducibility claim, which was not checked and which the move
        from mujoco-py to MuJoCo 3 makes uncertain.
      field: versions
      source: src-arxiv-2505-11289-v2
      quote: Through this process we release a new open-source version of Meta-World1 that has full
        reproducibility of past results
    - check: The v2 version has no release date. Meta-World+ says the V1 rewards were overwritten at
        an unstated point; the first dated source read that reports the -v2 environments is the
        paper's 2021-06-14 revision, and the repository's history was not searched.
      field: versions
      source: src-arxiv-2505-11289-v2
      quote: However, at some point these V1 rewards were overwritten by a new set of dense rewards,
        which we will refer to as V2.
    - check: 3.1.1 fixed the button-press dense rewards, so V2 training rewards for those tasks
        differ from 3.0.0; whether that makes 3.1.1 breaking for training-curve or success
        comparisons is not stated.
      field: versions
      source: src-github-api-metaworld-releases
      quote: dense rewards for button press fixed
    - check: Task-set counts disagree across sources. ML1's held-out goals are 50 in the paper and
        10 in the documentation, and ML10 has 3 test tasks in the README at v2.0.0 but 5 in both
        papers and the current documentation.
      field: subsets
      source: src-github-metaworld-readme-v2-0-0
      quote: It comprises 10 meta-train tasks, and 3 test tasks.
    - check: capability. transfer-learning rests on ML10 and ML45 alone, and the MT subsets override
        it away; multi-task learning, what MT10 and MT50 measure, has no term (taxonomy failure
        2026-11-04-meta-world-001). sample-efficiency was rejected although few-shot adaptation is
        the meta-RL claim, because no training budget is fixed.
      field: capability
    - check: comparability. The reward function version (V1 or V2) changes multi-task results and
        has no condition field; the entry records it inside harness. A reward_function_version
        field, or a reading of V1 and V2 under 3.x as subsets, is the alternative.
      field: comparability.material_extra
      source: src-arxiv-2505-11289-v2
      quote: These results are not comparable, as the two sets of reward functions have different
        design philosophies and per-task reward scales
    - check: as_used. Vision-language-action papers report a tier-averaged MT50 success whose tiers
        no Meta-World source defines; how such policies are trained and which release they use was
        not read.
      field: as_used
      source: src-arxiv-2610-12936
      quote: achieving a tier-averaged success rate of 91.1% on Meta-World MT50

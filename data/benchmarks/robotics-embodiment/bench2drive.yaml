      relation: extension for desired-speed conditioned driving, with its own metrics and dataset
      source: src-arxiv-2603-25672
      quote: we present Bench2Drive-Speed, a benchmark with metrics, dataset, and baselines for
        desired-speed conditioned autonomous driving.
    - id: bench2drive-robust
      relation: extension scoring driving under deployment perturbations (camera-stream failures,
        ego-state errors, latency)
      source: src-github-bench2drive-readme
      quote: Check [Bench2Drive-Robust](https://github.com/Thinklab-SJTU/Bench2Drive-Robust), which
        analyze models' performance under real deployment issues
    - id: bench2drive-vl
      relation: extension for closed-loop question answering with vision-language models
      source: src-github-bench2drive-readme
      quote: Check [Bench2Drive-VL](https://github.com/Thinklab-SJTU/Bench2Drive-VL), which enables
        closed-loop QA of VLM4AD.
lineage_note: >
  A fork of carla-leaderboard: another maintainer's benchmark on CARLA and Leaderboard 2.0's scenarios,
  with its own short routes, five added scenarios and an official training set, which carla-leaderboard's
  lineage.forks records with this id and the same quote. Bench2Drive does not supersede the leaderboard
  and is versioned on its own. The three variants are separate benchmarks by the same maintainer (each
  a Thinklab-SJTU repository linked from the README), with their own papers and metrics, so 04 S4 makes
  each a new benchmark, not a version. Bench2Drive-R (arXiv 2412.09647) shares the name but evaluates
  on real-world data in nuPlan through a generative renderer; no source read states its maintainer or
  a shared task, so it is not linked (see review_checks).
lineage_source: src-arxiv-2406-03877-v3
lineage_quote: CARLA Leaderboard V2 [28] lacks expert demonstration data.


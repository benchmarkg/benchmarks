# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T03)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2406-03877-v3
    - src-arxiv-2406-03877
    - src-github-bench2drive-readme
    - src-github-bench2drive-v004-update
    - src-hf-api-bench2drive
    - src-arxiv-2412-09647
    - src-arxiv-2603-25672
    - src-arxiv-2610-21741
    - src-arxiv-2610-32069
    - src-arxiv-2503-09594
    - src-carla-leaderboard-evaluation-v2-1
  sources_note: >
    The v3 PDF was read in full as pdftotext output; its Source, first committed for carla-leaderboard,
    had its extract rebuilt from the same file with narrow windows so that it holds carla-leaderboard's
    quotes and this entry's, clear of the author list, the datasheet's curator names and its contact lines.
    The README and update notes are pinned at commit 7ec25d1; the Hugging Face record was read through
    the API without accepting terms; the arXiv Sources are DOIs and need no archive. CARLA's evaluation
    page (committed for carla-leaderboard) gives the driving score's bound.
  confidence: medium
  review_checks:
    - check: Versions. 0.0.4 is called an edition because it scores a new set of 220 routes (and a
        new training set), which the README marks as in use; but the README also calls it a
        "separate validation set", bench2drive220.xml stays in the repository, and papers still
        report on the original 220. Which set a paper used is not always stated, so 0.0.3 and 0.0.4
        scores may be mixed in the literature.
      field: versions
      source: src-github-bench2drive-readme
      quote: '**Separate validation set** of 220 routes (44 scenarios × 5) for more reliable evaluation.'
    - check: Licences disagree. The README puts all assets and code under CC-BY-NC-ND unless
        specified otherwise (and the LICENSE file is that text), while the Hugging Face datasets are
        tagged apache-2.0 and the paper's Appendix I says Apache 2.0 for data, code and checkpoints.
        dataset_licence follows the dataset tag and code_licence the README; a reviewer may read the
        README as governing both.
      field: data.dataset_licence
      source: src-arxiv-2406-03877-v3
      quote: I License All data, codes, and checkpoints are in GitHub and Huggingface under Apache
        License 2.0.
    - check: submission_process is maintainer-run on the README's table, which holds outside methods
        re-scored on the 0.0.4 set; no source says whether the maintainers ran them or copied
        authors' numbers. If copied, literature-only fits better.
      field: governance.submission_process
      source: src-github-bench2drive-v004-update
      quote: We released a new evaluation set with 220 routes (44 scenarios * 5) in it.
    - check: Known limitation. An October 2026 audit finds the comfort metric mostly measures time
        standing still, and that the harness's default controller can replace a model's steering and
        supply a target point unlike training. The README's comfort column (and the 0.0.4 table) may
        therefore not mean what its name says. The paper defines comfort as the ratio of smooth
        trajectory segments to all segments.
      field: governance.known_limitation
      source: src-arxiv-2610-21741
      quote: the default controller can replace a model's own steering with an angle toward the
        route target point
    - check: Lineage. Bench2Drive-R was not linked; its maintainer is not stated in a quotable
        source (the arXiv author lists overlap, which is not quoted here), and it evaluates in
        nuPlan with a generative renderer rather than on Bench2Drive's routes. A reviewer may add it
        as a variant. A 2026 cross-benchmark study of NAVSIM and Bench2Drive (arXiv 2605.00066)
        could ground a correlates_with edge to navsim; it was not read.
      field: lineage
      source: src-arxiv-2412-09647
      quote: We further integrate Bench2Drive-R into nuPlan and evaluate the generative qualities
        with closed-loop simulation results.
    - check: 0.0.3 is marked breaking false because driving score and success rate did not change;
        skill scores before and after it are not comparable.
      field: versions
      source: src-github-bench2drive-readme
      quote: This update will **not affect driving score and success rate**.
    - check: The ceiling's bound is quoted from CARLA's evaluation page (another benchmark's
        Source); Bench2Drive's paper says only that its driving score follows CARLA's metric and
        states no bound of its own.
      field: data.ceiling_anchor_type
      source: src-arxiv-2406-03877-v3
      quote: This metric follows CARLA [28] official metric as reference.
    - check: maintainer-competes-on-own-benchmark rests on DriveTransformer, which the README calls
        "our latest work"; ThinkTwice, DriveAdapter and TCP may also be the maintainers' work
        (shared authors in the paper's references), which was not adopted as a fact.
      field: governance.independence_flags

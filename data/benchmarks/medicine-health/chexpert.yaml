lineage:
  role: root
lineage_note: >
  Two related resources are not linked as lineage, by 04 S4's rule. The CheXpert labeler
  (stanfordmlgroup/chexpert-labeler) is a tool that produced the training labels, also used for
  MIMIC-CXR, and has no scored task of its own: not a benchmark. CheXpert Plus (Chambon et al.,
  2024, Stanford AIMI) re-releases the same studies, less 186 whose reports could not be recovered,
  with the report text, DICOM images, demographics and new labels, under its own paper and DOI and a
  different author team led from AIMI. It changes neither the competition's items nor its scoring,
  so it is not a version, and it defines no test protocol or board of its own, so it is a separate
  dataset rather than a variant; report generation on its validation set is scored by ReXrank.
  Other work built on the test set, such as CheXternal, which the test labels README names, was not
  read.

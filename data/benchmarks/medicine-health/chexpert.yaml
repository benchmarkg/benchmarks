  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with windows clear of the brace-form address
    under the title, and its abstract page; the live competition page and the same page at commit ec5c40a,
    both withheld from archiving because leaderboard rows name individual submitters; the evaluation
    script and CodaLab configuration at commit 4f887a3; the test set labels README at a03eb34 and the
    repository's API record; Stanford AIMI's dataset page; CheXpert Plus's v2 PDF and C2A's v1 PDF (DOIs,
    not archived). Read but not cited: the board's results.json (submitter user names), the page's pug
    source, resolution-v1.0.py, the GitHub commit lists for the page's files, CheXpert Plus's abstract
    page and C2A's. Not read: the AIMI download portal and the CodaLab worksheets (script-rendered; no
    registration made).
  confidence: medium
  review_checks:
    - check: data.access is gated-registration on the strength of the test images being on the AIMI
        portal behind a login, which the notes of src-aimi-stanford-chexpert record but no quote
        states for today; the registration step is quoted only from the September 2022 page. If the
        portal now needs an approval, credentialed-dua would fit; if the labels alone counted,
        fully-open.
      field: data.access
      source: src-github-stanfordmlgroup-chexpert-page-ec5c40a
      quote: Once you register to download the CheXpert dataset, you will receive a link to the
        download over email.
    - check: The board's rank order does not strictly follow the displayed mean AUROC (rank 133 at
        0.894 above rank 134 at 0.895). The page's data file has a score field that tracks mean
        AUROC plus 0.001 times the radiologist count; no source read defines it, so
        aggregation_policy records the mean AUROC only and composite is rejected.
      field: aggregation_policy
      source: src-stanfordmlgroup-chexpert-competition
      quote: MM1 ensemble 0.894 1.6 134 May 07, 2021 MVD121 single model 0.895 1.2
    - check: submission_process is sandboxed-rerun because entrants handed over CodaLab code bundles
        and a command, which CodaLab ran on bundles they never saw. CodaLab runs each bundle in a
        Docker image of the entrant's choosing, so containerized-algorithm-submission is arguable.
      field: governance.submission_process
      source: src-github-stanfordmlgroup-chexpert-codalab-4f887a3
      quote: '"predict": { "mimic": ['
    - check: lifecycle active rests on C2A, which reports the five competition tasks on the
        validation set, not on the test set. Whether results against the released test set are still
        produced was not checked; if the competition tasks on the validation set do not count as the
        instrument, mature may fit better.
      field: lifecycle
    - check: ceiling_anchor_type is expert-average for the three comparison radiologists, scored as
        operating points against the five-reader majority. The headline metric is AUROC, which an
        operating point does not have, so theoretical-maximum with the radiologists under
        ceiling_by_category is the alternative reading.
      field: data.ceiling_anchor_type
      source: src-arxiv-1901-07031-v1
      quote: We examine whether the radiologist operating points lie below the curves to determine
        if the model is superior to the radiologists.
    - check: CheXpert Plus is treated as a separate dataset, not a version or variant, because it
        changes neither items nor scoring and has no test protocol of its own. Its authors overlap
        with CheXpert's only in part and it is led from AIMI rather than the ML Group, but it calls
        itself an enhanced version; a reviewer may prefer a lineage variant once it has an entry of
        its own.
      field: lineage
      source: src-arxiv-2405-19538-v2
      quote: Building upon the foundational CheXpert dataset introduced in 2019, which comprised
        224,316 chest radiographs from 65,240 patients annotated for 14 observations
    - check: The channel-closed date, 2022-10-01, comes from a commit date in the GitHub API, not
        from a quoted Source; the board nonetheless lists rows dated 4 October to 2 November 2022.
        Whether those were runs submitted before closing could not be read.
      field: history
      source: src-stanfordmlgroup-chexpert-competition
      quote: Oct 21, 2022 KD-Prune10 (Single model) MPU 0.909
    - check: maintainer is the Stanford ML Group, but the released test labels sit in the
        rajpurkarlab organisation and the data on AIMI's portal, so maintenance is split across
        three Stanford or Stanford-descended holders; whether the ML Group still maintains the page
        beyond link updates (last commit 2026-04-24) was not established.
      field: governance.maintainer
    - check: The paper's limitations note that model and readers saw no patient history and that no
        significance test compared model and radiologists; the board's radiologist count inherits
        both.
      field: data.ceiling_anchor_type
      source: src-arxiv-1901-07031-v1
      quote: no statistical test was performed to assess whether the difference between the
        performance of the model and the radiologists is statistically
    - check: The dataset licence is the research use agreement printed on the 2022 page. The current
        AIMI terms, and any change since (the Plus paper describes a Stanford University Dataset
        Research Use Agreement), were not read, and the test labels repository carries no licence.
      field: data.dataset_licence
      source: src-arxiv-2405-19538-v2
      quote: It is associated with a Stanford University Dataset Research Use Agreement, which
        specifies that CHEXPERT PLUS may not be used for any commercial purposes and is only
        available for research uses.

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2501-14654-v2
    - src-arxiv-2501-14654-v1
    - src-arxiv-2501-14654
    - src-github-stanfordmlgroup-medagentbench-readme
    - src-github-medagentbenchv2-readme
    - src-psb-2026-medagentbench-v2
    - src-arxiv-2609-13582
  sources_note: >
    The paper's v2 and v1 PDFs (DOIs, not archived) read as text, with windows that keep the authors'
    e-mail line out; the abstract page for the version dates; both READMEs at main; the PSB 2026 paper's
    PDF (a DOI, not archived) for the fork; and the abstract page of arXiv 2609.13582 as evidence of
    current use. Also read, not cited: the repository's config, task files and commit list, the fork's
    task files and refsol.py, the issues list and Docker Hub's record (APIs), and Crossref's records of
    both papers.
  confidence: medium
  review_checks:
    - check: Identity. The PSB 2026 "MedAgentBench v2" is recorded as a fork (lineage.forks,
        medagentbench-v2), not as a version or an alias. ADR-0020 makes a task set derived by
        someone other than the maintainer a separate variant_of entry, and its 300 new tasks sit on
        a personal account and were never added to the Stanford repository. But three of its five
        authors (both co-first authors and the senior author) are MedAgentBench's, so it could also
        be read as a same-team extension (lineage.variants with a co_maintainer). The proposed alias
        "MedAgentBench v2" was left out because it would send claims about the PSB task set to this
        entry; the maintainers' own v2 is the 300-task data file.
      field: lineage
      source: src-psb-2026-medagentbench-v2
      quote: To contribute to the benchmark and evaluate the generalization of our agent, we
        developed 300 new multi-step clinically-driven tasks in collaboration with a physician.
    - check: The fork's README places the new tasks in test_data_v2.json, but that file is the same
        git blob as the Stanford repository's test_data_v2.json, the original 300 tasks. The new
        tasks look to be new_patient_tasks.json (300 items, 30 per category), which the fork's
        config leaves commented out. Whoever curates medagentbench-v2 should check which file the
        PSB results used.
      field: lineage
      source: src-github-medagentbenchv2-readme
      quote: The new tasks are located in
    - check: evaluation_method. POSTs are never sent to the server, so action tasks are graded on
        the payloads in the transcript (tool calls issued, which environment-state-check names) and
        nothing inspects a changed server state; a September 2026 repository issue makes the same
        point about the grader. The refsol.py the fork republishes (read, not cited) accepts the
        average-glucose answer within 0.1, so numeric-tolerance-match may apply to one category.
      field: evaluation_method
      source: src-arxiv-2501-14654-v2
      quote: If the agent system invokes a POST request, we conduct a simple sanity check to make
        sure the payload data is JSON-loadable, and indicate success of execution to the agent
        system.
    - check: tool-use's exclusion bars calls that are never executed, which holds for every POST. It
        is assigned on the GET calls, which are executed and feed both halves of the set.
      field: capability
      source: src-arxiv-2501-14654-v2
      quote: we decide to only send GET requests to the environment so that we do not need to
        re-initialize the environment for each individual task
    - check: patient-clinical-record's definition asks for identifiable records. The profiles are
        real Stanford records, deidentified and jittered, with their identifiers replaced; no term
        names deidentified real clinical records. A clinical-data specialist should decide.
      field: data.data_provenance
      specialist: true
      source: src-arxiv-2501-14654-v2
      quote: patient profiles are extracted from a deidentified clinical data warehouse curated by
        the STARR (STAnford Research Repository) project
    - check: v1 (100 tasks) stood for about two weeks before v2 replaced it, and the v2 paper calls
        the 300-task set the first release. Whether v1 earns an edition or is better a note on v2.
      field: versions
      source: src-arxiv-2501-14654-v2
      quote: We decided that the first release of MedAgentBench would contain 300 tasks and 100
        patient profiles
    - check: Most later results replace the paper's orchestrator (the PSB agent's tools and memory,
        a repository issue's prefetch-and-execute agent at a claimed 300/300), so observed_subjects
        could record agent-scaffold use and those claims need their scaffold.
      field: designed_for_subjects
    - check: Independence is not assessed; the NEJM AI page and its disclosures returned 403.
      field: governance.independence_flags
  unreachable:
    - url: https://ai.nejm.org/doi/full/10.1056/AIdbp2500144
      http_status: 403
      consequence: The version of record and its disclosures were not read; arXiv v2 stands in for
        it, and independence is left unassessed.
  personal_data_excluded:
    - source: src-arxiv-2501-14654-v2
      what: the authors' e-mail addresses under the title
    - source: src-arxiv-2501-14654-v1

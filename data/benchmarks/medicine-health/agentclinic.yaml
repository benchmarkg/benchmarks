# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T04)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2405-07960-v5
    - src-arxiv-2405-07960-v4
    - src-arxiv-2405-07960-v1
    - src-arxiv-2405-07960
    - src-npj-2026-agentclinic
    - src-github-agentclinic-readme
    - src-github-agentclinic-script
    - src-agentclinic-site
    - src-arxiv-2607-15314-v3
  sources_note: >
    The paper's v5, v4 and v1 PDFs (DOIs, not archived) read as text, with windows that keep the contact
    line and the example case study out; the abstract page for the version dates; the npj version of record
    (a DOI) as Europe PMC's XML; the README and agentclinic.py pinned to b6fbe22; the project site; and
    Cura 1T's v3 PDF (a DOI) as evidence of current use. Also read, not cited: the four released case
    files and the repository's commit list (GitHub API), Crossref's and Europe PMC's records of the npj
    paper, and arXiv abstracts of 2026 studies that evaluate on AgentClinic.
  confidence: medium
  review_checks:
    - check: Primary is diagnosis-triage, with clinical-dialogue secondary. The case is presented
        through a multi-turn conversation, and the paper presents patient-perception and clinician
        realism ratings that do score conduct, but the only quantity the harness computes and every
        headline table reports is whether the moderator accepts the diagnosis. If ADR-0021 widens
        clinical-dialogue to multi-turn encounters scored on their outcome, the two could swap.
      field: domain
      source: src-arxiv-2405-07960-v5
      quote: Moderator agent compares conclusion to ground truth diagnosis at the end of the
        simulation.
    - check: The moderator's model. The paper names GPT-4 (gpt-4-0613) for the patient, measurement
        and moderator agents, but the harness maps "gpt4" to gpt-4-turbo-preview (gpt-4-turbo when
        an image is sent), so a rerun with the shipped code does not use the paper's judge. No
        reference_conditions is written, so the reference-grader rule cannot see either.
      field: reference_conditions
      source: src-github-agentclinic-script
      quote: model="gpt-4-turbo-preview",
    - check: The harness sends images only when the case set is named NEJM, the 15-case first
        release; NEJM_Ext, the 120 cases the paper reports, runs text-only in the shipped code, and
        Cura 1T rewrote the harness to attach them. Whether the paper's NEJM numbers came from other
        code is not stated.
      field: execution.harness
      source: src-github-agentclinic-script
      quote: 'if dataset == "NEJM":'
    - check: collaboration, memory-retention and tool-use follow the taxonomy's own AgentClinic
        examples and the npj title, but each is stretched. The patient agent has no objective of its
        own beyond answering when asked (collaboration's exclusion), the cross-case retention is the
        notebook condition only, and in the base protocol the "tools" are test orders answered by a
        language model. A reviewer may prefer to keep only abductive-reasoning and
        context-integration.
      field: capability
      source: src-npj-2026-agentclinic
      quote: We recognize that the tool-use commands in AgentClinic are abstractions of real-world
        clinical workflows.
    - check: Robustness to the 23 instructed biases is central to the paper but has no capability
        term; logged as a missing term (taxonomy/_failures, perturbation-robustness proposed). The
        project site says 24 biases, the papers 23, and the README offers 12 doctor and 11 patient
        options.
      field: capability
      source: src-agentclinic-site
      quote: AgentClinic embeds 24 cognitive and implicit biases in both doctor and patient agents
    - check: Versions. The two data releases are modelled as editions (2024-05, 2024-08), with the
        case sets as subsets and the paper's five arXiv versions and the npj version noted in the
        rows. The extended set keeps every first-release MedQA case, so 2024-08 could be read as a
        revision rather than an edition; and the 2026-10-03 addition of a 215th MedQA-Ext case (the
        paper had reported 215 since October 2024) is recorded only in prose, with no Source of its
        own.
      field: versions
      source: src-github-agentclinic-readme
      quote: More AgentClinic-MedQA cases [107] → [215]
    - check: The npj paper says all data is in the repository, but the Spec (260) and Lang (749)
        sets are not there, and MIMIC-IV is on request. data.access fully-open describes the
        released MedQA and NEJM files only; the size rows for Spec and Lang describe sets nobody
        outside the authors can run.
      field: data.access
      source: src-npj-2026-agentclinic
      quote: The data from the AgentClinic benchmark is open under an MIT license.
    - check: AgentClinic-Lang's 749 cases equal 107 times 7, which suggests the first release's 107
        MedQA cases in seven languages (English included), not the extended 215; no source says
        which.
      field: subsets
      source: src-arxiv-2405-07960-v4
      quote: We also introduce 260 patient cases from 9 medical specialties and 749 patient cases
        from 7 multilingual environments.
    - check: data_provenance leaves out patient-clinical-record. AgentClinic-MIMIC-IV is built from
        deidentified MIMIC-IV records under PhysioNet's credentialed terms, and the term asks for
        identifiable records; a clinical-data specialist should decide, as for medagentbench.
      field: data.data_provenance
      specialist: true
      source: src-github-agentclinic-readme
      quote: based on real clinical cases from MIMIC-IV (requires approval from
        https://physionet.org/content/mimiciv/2.2/)
    - check: maintainer_type individual follows the term's rule for a personal account; the
        benchmark is a multi-institution academic project, and a reviewer may prefer academic-lab.
      field: governance.maintainer_type
    - check: MedQA link. AgentClinic-MedQA rebuilds MedQA's questions as dialogue cases and the
        paper compares the two; the medqa entry was not edited and carries no lineage. It could list
        agentclinic (or the AgentClinic-MedQA subset) as a derived benchmark by other maintainers.
      field: lineage
      source: src-arxiv-2405-07960-v5
      quote: Overall, MedQA accuracy was only weakly predictive of accuracy on AgentClinic-MedQA.
  unreachable: []
  personal_data_excluded:
    - source: src-arxiv-2405-07960-v5
      what: the corresponding author's e-mail address on the first page, and the example patient
        case in Appendix J
    - source: src-arxiv-2405-07960-v1
      what: the corresponding author's e-mail address under the affiliations
    - source: src-arxiv-2405-07960
      what: the arXiv submitter line
    - source: src-npj-2026-agentclinic
      what: the author and corresponding-author block
    - source: src-agentclinic-site
      what: the website template's credit to a named person

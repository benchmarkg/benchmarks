subsets:
  - id: agentclinic#medqa
    label: AgentClinic-MedQA
    items: 215
    scored_separately: true
    evidence:
      - source: src-arxiv-2405-07960-v5
        quote: We design 120 multimodal language agents which require an understanding of both
          language and images and 215 language agents based on cases from the USMLE.
      - source: src-github-agentclinic-readme
        quote: More AgentClinic-MedQA cases [107] → [215]
    notes: USMLE questions from MedQA (its own entry, medqa) rebuilt as dialogue cases; the main
      set, on which the models, the physicians, the bias conditions, the toolbox and the turn limit
      are compared. The first release's 107 cases (agentclinic_medqa.jsonl) are all inside the
      extended file (agentclinic_medqa_extended.jsonl), which held 214 cases until one was added on
      2026-10-03 (compared item by item, GitHub API).
  - id: agentclinic#nejm
    label: AgentClinic-NEJM
    items: 120
    scored_separately: true
    domain_override:
      primary: medicine-health/diagnosis-triage
      secondary:
        - medicine-health/medical-imaging-diagnostic
        - medicine-health/clinical-dialogue
    capability_override:
      - abductive-reasoning
      - context-integration
      - collaboration
      - tool-use
      - memory-retention
      - perception
    evidence:
      - source: src-arxiv-2405-07960-v5
        quote: We randomly sample 120 challenges from a sample of 932 total cases for
          AgentClinic-NEJM.
      - source: src-npj-2026-agentclinic
        quote: 'The mechanism for receiving image input in AgentClinic-NEJM is supported in two ways:
          provided initially to the doctor agent upon initialization and as feedback from the instrument
          agent upon request.'
      - source: src-npj-2026-agentclinic
        quote: we chose to not provide these options to the doctor agent and instead keep the
          problems open-ended
    notes: NEJM image challenges answered open-ended, scored in two conditions (image at the start,
      or only when the doctor requests it). The first release had 15 (agentclinic_nejm.jsonl, June
      2024); their images reappear among the 120 (agentclinic_nejm_extended.jsonl), though no record
      is identical. Images are linked from NEJM's content server.
  - id: agentclinic#mimic-iv
    label: AgentClinic-MIMIC-IV
    items: 200
    scored_separately: true
    evidence:
      - source: src-arxiv-2405-07960-v5
        quote: we select the first 200 patients out of a total
      - source: src-github-agentclinic-readme
        quote: based on real clinical cases from MIMIC-IV (requires approval from
          https://physionet.org/content/mimiciv/2.2/)
    notes: The first 200 MIMIC-IV patients with a single diagnosis, with their lab and microbiology
      events, so test orders return fuller results than in the MedQA set. Behind PhysioNet
      credentialing and not in the repository.
  - id: agentclinic#spec
    label: AgentClinic-Spec
    items: 260
    scored_separately: true
    evidence:
      - source: src-arxiv-2405-07960-v5
        quote: Specialist cases use case report questions from the MedMCQA dataset
      - source: src-arxiv-2405-07960-v5
        quote: We also introduce 260 patient cases from 9 medical specialties and 749 patient cases
          from 7 multilingual environments.
    notes: MedMCQA case reports in nine patient-facing specialties, reported per specialty. First
      described in arXiv v4; not found in the repository.
  - id: agentclinic#lang
    label: AgentClinic-Lang
    items: 749
    scored_separately: true
    evidence:
      - source: src-arxiv-2405-07960-v5
        quote: Multilingual patient cases are converted from AgentClinic-MedQA to the the target
          language using GPT-4 and then manually corrected by native speakers.
      - source: src-arxiv-2405-07960-v4
        quote: We also introduce 260 patient cases from 9 medical specialties and 749 patient cases
          from 7 multilingual environments.
    notes: AgentClinic-MedQA cases in English, Chinese, Hindi, Korean, Spanish, French and Persian,
      reported per language. 749 is 107 times 7, which suggests the first release's 107 cases in
      seven languages; no source says so (review_checks). First described in arXiv v4; not found in
      the repository.


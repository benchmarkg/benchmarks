    - src-github-api-isic-challenge-scoring
    - src-arxiv-2010-05351
    - src-arxiv-2506-03420
    - src-arxiv-2611-04409
  sources_note: >
    The ISIC Challenge site serves HTML (no robots.txt), read with scripts and styles stripped; its 2018
    and 2019 leaderboard pages were read but not cited, because team names there include individuals'
    names, and the MILK10k landing page was read but not cited. The ISIC Archive API was read only for
    its collection listing; no image record, which carries patient metadata, was requested. Kaggle's 2020
    and 2024 competition pages serve a plain reader only their title, so their rules, metric and leaderboard
    were not read and no Kaggle endpoint was called; the 2020 and 2024 metrics come from the winners'
    and a participant's abstracts instead. The two Scientific Data descriptors were read as Europe PMC's
    full-text XML, because nature.com's robots.txt disallows Anthropic's agents. The three challenge papers
    and the two descriptors are DOI sources (not archived), read with windows that keep authors' names
    and e-mail lines out. The Data page, the 2016-2019 landing pages and the API listing name organisers
    or an individual, so they are withheld from archiving, with windows that hold no person's name.
  confidence: medium
  review_checks:
    - check: One entry for the series, the six editions as versions and the recurring tasks as
        subsets, since the yearly rounds share ISIC as organiser and the site lists them as one
        series. 2020 (SIIM-ISIC Melanoma Classification) and 2024 (SLICE-3D) ran on Kaggle under
        their own names, with SIIM as co-sponsor in 2020; whether either should be an entry of its
        own.
      field: versions
    - check: MILK10k, an open benchmark on the same challenge platform since August 2025, by ISIC
        members at the Medical University of Vienna, with its own dataset and macro-F1 metric, is
        left out as a separately maintained benchmark. If it counts as the 2025 round, it becomes a
        version, and activity moves from between-rounds to leaderboard-live-no-round.
      field: activity
      source: src-isic-challenge-home
      quote: The MILK10k Benchmark is open! Submit to the leaderboard!!
    - check: The 2024 metric (partial AUC above 80% true positive rate) and the 2020 metric (AUC)
        are quoted from participants' abstracts, not from the organisers; Kaggle's pages, which
        would state them, serve no content to a plain reader. Whether Kaggle still accepts late
        submissions to either competition, which would also change activity, could not be read.
      field: task.scoring
      source: src-arxiv-2506-03420
      quote: Using partial AUC (pAUC) above 80 percent true positive rate (TPR) as the evaluation
        metric
    - check: data.access private-test-server and reproducible_by_third_party false follow the 2024
        edition (and 2020's withheld labels), while the 2016-2019 editions, which most current
        papers use, are fully open and re-scorable. A per-edition access value may fit better.
      field: data.access
      source: src-isic-challenge-data
      quote: 8,238 entries of gold standard lesion diagnoses. Includes the scoring and validation
        weights.
    - check: The 2019 venue is inconsistent on its landing page, which presents the results at a
        CVPR 2019 workshop and awards the prizes after a MICCAI workshop in Shenzhen; the version
        label follows the first.
      field: versions
      source: src-isic-challenge-landing-2019
      quote: awarded after the MICCAI Workshop in Shenzhen, China, in October 2019
    - check: ceiling_anchor_type theoretical-maximum because no reader-study result was read. The
        site says leading algorithms outperformed clinicians in reader studies by 2018 (Marchetti et
        al. for 2016 and 2017, Tschandl et al. for 2018, published in journals not read); those
        would give an expert-average anchor for the diagnosis task.
      field: data.ceiling_anchor_type
      source: src-isic-challenge-home
      quote: the diagnostic performance of the leading algorithms was consistently outperforming
        clinicians
    - check: distribution-shift-generalization rests on the 2018 external partition, which the paper
        analyses per submission while ranking on the whole test set. The 2024 test set has two
        test-only sites, but no separate score on them was read.
      field: capability
      source: src-arxiv-1902-03368-v2
      quote: Correlation between internal and external test dataset performance for each submission
        is shown in Fig. 4A
    - check: The 2019 outlier class has no capability term (recognising a category absent from
        training); logged with bench tag-gap as a missing term.
      field: capability
    - check: Independence flags rest on the rules and sponsor lists. Whether organisers'
        institutions entered (the rules allow affiliated organisations), and whether Canfield
        Scientific, whose 3D imaging system produced the 2024 data and who funded the prizes, has
        systems among the entrants, were not checked against the leaderboards.
      field: governance.independence_flags
      source: src-isic-challenge-landing-2018
      quote: Any organizations/companies affiliated with members of the organizing committee are not
        excluded from participation in the Challenge
    - check: The two subsets that override capability to perception alone produce the validator's
        subset-drops-terms warnings; the drop is deliberate, the external partition belonging to the
        2018 diagnosis task only. The attribute subset is filed as segmentation although 2016 and
        2017 scored it per superpixel.
      field: subsets

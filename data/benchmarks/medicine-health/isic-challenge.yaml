# data/benchmarks/medicine-health/isic-challenge.yaml
#
# P1-S6-T04, medicine-health entry 15. Filled from the ISIC Challenge site (challenge.isic-archive.com), read as the
# HTML of its home, Data, Stats and Live pages and the 2016, 2017, 2018 and 2019 landing pages, scripts and styles
# stripped; the ISIC Archive's public API listing of its collections; the 2016, 2017 and 2018 challenge papers (arXiv
# 1605.01397 v1, 1710.05006 v3 and 1902.03368 v2, read as the text of their PDFs); the data descriptors of the 2020
# challenge dataset (Scientific Data 8, 34, 2021) and of SLICE-3D, the 2024 training set (Scientific Data, 2024),
# read as Europe PMC's full-text XML (nature.com's robots.txt disallows Anthropic's agents); the README of the isic-challenge-scoring package and GitHub's API record of its
# repository; and three abstract pages on arXiv: the 2020 winners' paper (2010.05351), a 2025 paper on the 2024 data
# (2506.03420) and a November 2026 segmentation paper (2611.04409). Kaggle's competition pages for 2020 and 2024
# serve only their title to a plain reader and were not cited. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: isic-challenge
name: ISIC Challenge
aliases:
  - ISIC Grand Challenge
  - Skin Lesion Analysis Towards Melanoma Detection
  - SIIM-ISIC Melanoma Classification
  - ISIC 2024 - Skin Cancer Detection with 3D-TBP
tagline: 'Yearly skin-lesion challenges since 2016: skin-cancer diagnosis from dermoscopy and 3D total-body-photo
  crops.'
description: >
  The International Skin Imaging Collaboration's annual challenges, built on the ISIC Archive of skin
  lesion images and held with computer-vision and medical-imaging conferences: ISBI in 2016 and 2017,
  MICCAI in 2018, a CVPR workshop in 2019, and Kaggle competitions in 2020 (SIIM-ISIC Melanoma
  Classification, with the Society for Imaging Informatics in Medicine) and 2024 (SLICE-3D). The
  scored task the series keeps is diagnosis: from benign versus malignant on 379 test images (2016),
  through three classes (2017) and seven classes with balanced accuracy and an external test
  partition (2018), to eight classes plus an outlier class absent from training, with and without
  age, sex and site metadata (2019). The 2020 edition scored melanoma detection on 10,982 test images
  by AUC, with a patient identifier linking each patient's lesions; 2024 moved from dermoscopy to
  15 mm crops of lesions from 3D total-body photographs, 401,059 of them for training, scored by
  partial AUC above 80% true positive rate. Malignant diagnoses rest on histopathology, benign ones on
  histopathology, follow-up or expert consensus. Through 2018 each edition also ran lesion
  boundary segmentation (Jaccard, thresholded in 2018) and dermoscopic attribute detection. Teams
  upload predictions to the ISIC submission system or Kaggle and are scored against withheld labels;
  2017-2019 required a short methods manuscript. The 2016-2019 test labels have since been released,
  and the isic-challenge-scoring package scores those editions. The site also hosts the MILK10k
  benchmark (2025, open), which this entry does not include (review_checks).
self_description:
  source: src-isic-challenge-home
  quote: Beginning in 2016, ISIC has sponsored annual challenges for the computer science community
    in association with leading computer vision conferences.
external_ids:
  arxiv: '1605.01397'
paper:
  title: 'Skin Lesion Analysis toward Melanoma Detection: A Challenge at the International Symposium on
    Biomedical Imaging (ISBI) 2016, hosted by the International Skin Imaging Collaboration (ISIC)'
  arxiv: '1605.01397'
  version_read: v1
  source: src-arxiv-1605-01397-v1
released: 2016-01-05
released_note: The day the first edition released its training images and ground truth, as the 2016
  landing page's timeline gives it (the year from the page's title); test data followed in March and
  the deadline was 1 April.
released_source: src-isic-challenge-landing-2016
released_quote: 'Jan 5: Release initial data (images + ground truth)'
release_venue: IEEE International Symposium on Biomedical Imaging (ISBI) 2016

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-imaging-diagnostic
  secondary:
    - medicine-health/medical-imaging-segmentation
    - vision/classification
    - vision/segmentation
  per_edition: true
domain_basis:
  reason: The task every edition ranks is a diagnosis assigned to a skin lesion from its image
    (benign or malignant, then up to nine categories, then melanoma or skin cancer), scored against
    histopathology or expert consensus, which the leaf's inclusion test takes whatever the metric.
    The secondary leaves come from tasks only the 2016-2018 editions ran (per_edition). Lesion
    boundary segmentation and attribute detection are scored as masks against dermatologists'
    tracings (medical-imaging-segmentation, with vision/segmentation by the vocabulary's rule for
    medical masks), and vision/classification is the image-level task behind the diagnosis.
  source: src-europepmc-pmc11324883
  quote: Since 2016, ISIC has hosted 5 Grand Challenges that have all been focused on developing AI
    for diagnostic classification using dermoscopy images
domain_considered_and_rejected:
  - term: vision/medical-imaging-cv
    reason: The claim is clinical, the diagnosis of skin cancer against a pathology reference
      standard, not a vision method tested on medical images; the term's exclusion test sends
      clinically defined targets with a clinician reference to medicine-health.
    source: src-isic-challenge-landing-2016
    quote: The gold standard for diagnosis of skin lesions is pathology.
  - term: medicine-health/diagnosis-triage
    reason: The 2024 edition frames its task as triage outside specialist clinics, but every edition
      diagnoses from an image alone (with a few metadata fields in some tracks), which is the
      imaging leaf rather than a diagnosis from a presented case.
  - term: vision/detection
    reason: The attribute tasks localise dermoscopic structures, but they are scored per superpixel
      (2016, 2017) or as masks by Jaccard (2018), not as detected boxes or points.
capability:
  - perception
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: The input is a photograph of a lesion (dermoscopic, or a crop of a 3D total-body
      photograph), and the score measures the diagnosis or outline recovered from it.
    source: src-arxiv-1605-01397-v1
    quote: In this article, we describe the design and implementation of a publicly accessible
      dermatology image analysis benchmark challenge.
  distribution-shift-generalization:
    reason: The 2018 diagnosis task held out an external test partition of 316 images from
      institutions in Turkey, New Zealand, Sweden and Argentina, none represented in training, and
      the paper reports each submission's internal and external scores side by side with the label
      set unchanged. Only 2018 reports such a condition of its own (per_edition); the 2020 and 2024
      test sets also include held-out sites, but no score on them alone was read.
    source: src-arxiv-1902-03368-v2
    quote: consisting of 316 images additionally selected from data sources not
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The 2019 test set adds an outlier class absent from training that systems must flag.
      That is recognising an unknown category, not adapting to a new task, and no term records it;
      logged as a missing term (taxonomy/_failures).
    source: src-isic-challenge-landing-2019
    quote: will contain an additional outlier class not represented in the training data, which
      developed systems must be able to identify.
  - term: context-integration
    reason: The 2019 metadata task and the 2020 patient identifier supply clinical context, but the
      image-only track shows the answer is obtainable without it, and the score does not test
      whether the context was used.
  - term: calibration-uncertainty
    reason: Submissions are confidences per category, but the metrics (average precision, AUC,
      balanced accuracy at a fixed threshold, partial AUC) rank or threshold them; none scores
      whether a confidence matches the observed frequency.
evaluation_method:
  - classification-metric
  - domain-metric
evaluation_method_basis:
  reason: Diagnosis, the headline task, is ranked by general classification statistics, average
    precision (2016), AUC (2017, 2020), balanced multi-class accuracy (2018-2019) and partial AUC
    (2024). Segmentation and attribute detection are ranked by the Jaccard index, thresholded at
    0.65 per image in 2018, a field-specific overlap measure.
  source: src-isic-challenge-landing-2019
  quote: Submissions are scored using a normalized multi-class accuracy metric (balanced across
    categories).
evaluation_method_considered_and_rejected:
  - term: entrant-relative-ranking
    reason: Teams are ordered by their own metric value; adding a team moves no other team's score.
  - term: composite
    reason: Each task is ranked on one metric; the editions' secondary metrics are reported beside
      it, not combined into it.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are image classifiers and segmenters trained for dermoscopic diagnosis, a task
    dermatology defines, mostly on the challenge's own training data, which
    task-specific-supervised- model's exclusion test sends here.
  source: src-arxiv-1710-05006-v3
  quote: All top submissions implemented various ensembles of deep learning networks.
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The entrants are task-trained networks, but the task, skin lesion diagnosis, is defined
      by a clinical discipline.
as_used:
  - protocol: Lesion segmentation retrained and evaluated on the official ISIC 2017 and ISIC 2018
      partitions, reporting Dice on their test sets beside an external set (PH2). Nothing is
      submitted to the challenge, and the 2018 ranking metric, thresholded Jaccard, is not the one
      reported.
    split: the official ISIC 2017 and ISIC 2018 test partitions, labels released
    source: src-arxiv-2611-04409
    quote: Nine networks were retrained on the official ISIC 2017 and ISIC 2018 partitions under a
      harmonized protocol
    note: LCM-UNet (arXiv 2611.04409, November 2026). Papers using the 2016-2019 editions score
      themselves against the released test labels, often with metrics the challenge did not rank by.
  - protocol: Malignant-versus-benign classification on the ISIC 2024 SLICE-3D data, reported as
      partial AUC above 80% true positive rate.
    split: not stated in the abstract read
    source: src-arxiv-2506-03420
    quote: our approach achieves a pAUC of 0.1755
    note: A June 2025 paper; whether the figure is from the Kaggle leaderboard or its own validation
      could not be read from the abstract.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the released editions; a paper of 3 November 2026 retrains
    nine segmentation networks on the official 2017 and 2018 partitions and ranks them on both test
    sets (as_used).
  source: src-arxiv-2611-04409
  quote: ranking first on both ISIC test sets
activity: between-rounds
activity_basis:
  reason: The last annual challenge, 2024 on Kaggle, has finished; the Live Challenges page, which
    re-opened the 2018-2020 tasks, has no open task (the Stats page dates the last close to July
    2024), and no next edition is announced in the sources read. The open MILK10k benchmark on the
    same site is not counted as a round of this series (review_checks).
  source: src-isic-challenge-landing-live
  quote: any currently open tasks for live-submission scoring.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The 2020 winning ensemble of EfficientNet CNNs (SIIM-ISIC Melanoma Classification)
    source: src-arxiv-2010-05351
    observed_on: 2026-11-04
    quote: It is an ensemble of convolutions neural network (CNN) models with different backbones
      and input sizes
  - system: The top 2017 diagnosis entries, ensembles of deep networks
    source: src-arxiv-1710-05006-v3
    observed_on: 2026-11-04
    quote: All top submissions implemented various ensembles of deep learning networks.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Diagnoses from histopathology for every malignant lesion, and for benign
  ones from histopathology, at least six months of unchanged follow-up, unanimous expert diagnosis
  or, in 2024, a dermatologist's full-body examination; lesion and attribute masks traced by expert
  dermatologists. The test labels were withheld at submission in every edition; 2016-2019's have
  since been released, 2020's and 2024's have not.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The two latest editions are scored on labels only their organisers hold, the 2020 test
    labels withheld and the 2024 test set not released at all. The 2016-2019 editions can be
    re-scored by anyone, since their test labels and the scoring package are public.
  source: src-europepmc-pmc7843971
  quote: These test images are available for download, but the test labels are not yet public due to
    planned future challenges and experiments.

task:
  exists: true
  input:
    - one dermoscopic image of a skin lesion (2016-2020), with age, sex and anatomic site in the
      2019 metadata task and the 2020 edition, which also links each patient's lesions
    - one 15 mm by 15 mm crop centred on a lesion, extracted from a 3D total-body photograph, with
      its metadata (2024)
  output: A confidence per diagnostic category for each image (diagnosis), a binary mask of the
    lesion (segmentation), or per-attribute masks or superpixel labels (dermoscopic attributes).
  scoring: Per edition and task against withheld labels. Diagnosis by average precision (2016), AUC
    (2017, 2020), balanced multi-class accuracy with AUC as tie-break (2018-2019) and partial AUC
    above 80% true positive rate (2024); segmentation by the mean Jaccard index, set to zero below
    0.65 per image in 2018. Teams are ranked on the one metric.
  tests_hidden_from_system: true
  source: src-isic-challenge-landing-2019
  quote: Submissions are scored using a normalized multi-class accuracy metric (balanced across
    categories).

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The current edition decides. The 2024 test set was never released, so only the Kaggle
    competition could score it; 2020 released its test images with the labels withheld. The
    2016-2019 test sets, labels included, now download without an account from the Data page and the
    ISIC Archive's official collections, so those editions are fully open.
  access_basis:
    reason: The 2024 test data were collected separately from the released SLICE-3D training set,
      and the Data page offers neither the test images nor their labels.
    source: src-europepmc-pmc11324883
    quote: was collected for a separate test set, not described here, for evaluating results of that
      competition
  refresh: periodic-recompetition
  refresh_basis:
    reason: Six dated editions (2016-2020, 2024), each ranked on a test set of its own with the task
      line-up and metric changing between them.
    source: src-isic-challenge-home
    quote: Beginning in 2016, ISIC has sponsored annual challenges for the computer science
      community in association with leading computer vision conferences.
  data_provenance:
    - real-world-instrument
    - expert-authored
  data_provenance_note: Dermoscopic photographs and 3D total-body photographs from routine care at
    contributing centres in North America, Europe, Australia and, for the 2018 external set, Turkey,
    New Zealand and Argentina (real-world-instrument). Diagnoses come from pathology reports or a
    panel of dermoscopy experts, and masks and attributes were traced by expert dermatologists
    (expert-authored). patient-clinical-record was considered for the pathology-derived labels; the
    images and metadata are released de-identified.
  data_provenance_source: src-arxiv-1605-01397-v1
  data_provenance_quote: Ground truth for both training and test sets was generated by a panel of
    dermoscopic experts.
  contamination_risk: medium
  contamination_risk_note: The 2016-2019 test images and labels are public on the Data page and as
    official collections of the ISIC Archive, which also feeds pretraining corpora and later
    datasets, so a training route into those editions' test sets is plausible; 2018 also drew its
    training set from the public HAM10000. The 2024 test set is unreleased. No source read evidences
    a route.
  contamination_risk_source: src-isic-challenge-data
  contamination_risk_quote: 8,238 entries of gold standard lesion diagnoses. Includes the scoring
    and validation weights.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Balanced accuracy, AUC and partial AUC are bounded, and no source read
    gives a measured anchor on the diagnosis test sets. The challenges fed reader studies comparing
    algorithms with dermatologists (published separately, not read), which may supply an
    expert-average anchor (review_checks). For segmentation, three experts' mean Jaccard agreement
    of 0.786 on 100 images of 2016 is a noise ceiling, and 2018's 0.65 threshold derives from it.
  dataset_licence: CC-BY-NC-4.0
  dataset_licence_note: The 2024 SLICE-3D data, as the Data page and the descriptor give it.
    Licences differ by edition, CC-0 for 2016 and 2017, CC BY-NC for 2018, 2019 and 2020, and CC BY
    for the SLICE-3D Permissive subset of four contributors' data.
  dataset_licence_source: src-isic-challenge-data
  dataset_licence_quote: SLICE-3D 2024 Challenge Dataset. International Skin Imaging Collaboration
    https://doi.org/10.34970/2024-slice-3d (2024). Creative Commons Attribution-Non Commercial 4.0
    International License.
  size:
    - count: 401059
      unit: training crops of distinct lesions from 3D total-body photographs (the test set's size
        is not in the sources read)
      subset: 2024 edition (SLICE-3D)
      source: src-isic-challenge-data
      quote: 401,059 JPEG images of skin lesion image crops extracted from 3D TBP
    - count: 10982
      unit: test images (33,126 training images)
      subset: 2020 edition
      source: src-isic-challenge-data
      quote: 10,982 JPEG images.
    - count: 8238
      unit: test images (25,331 training images)
      subset: 2019 edition
      source: src-isic-challenge-data
      quote: 8,238 JPEG images of skin lesions.
    - count: 1512
      unit: diagnosis test images (10,015 training, 193 validation)
      subset: 2018 Task 3
      source: src-arxiv-1902-03368-v2
      quote: For validation and held-out test sets, 193 and 1,512 images were provided,
        respectively, without ground truth.
    - count: 1000
      unit: segmentation and attribute test images (2,594 training, 100 validation)
      subset: 2018 Tasks 1 and 2
      source: src-arxiv-1902-03368-v2
      quote: For validation and test sets, 100 and 1,000 images were provided, respectively, without
        ground truth masks.
    - count: 600
      unit: test images (2,000 training, 150 validation)
      subset: 2017 edition
      source: src-arxiv-1710-05006-v3
      quote: split into training (n=2000), validation (n=150), and holdout test (n=600) datasets
    - count: 379
      unit: test images (900 training)
      subset: 2016 edition
      source: src-arxiv-1605-01397-v1
      quote: Training data included 900 images. A separate test dataset of 379 images was provided

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The International Skin Imaging Collaboration (ISIC), sponsored by the International
    Society for Digital Imaging of the Skin, through organising committees that change by edition,
    with SIIM as co-sponsor in 2020 and Kaggle hosting the 2020 and 2024 competitions
  maintainer_basis:
    reason: The site presents ISIC as the sponsor of every challenge, and each landing or Data
      section names that edition's chairs and partners, who change between editions.
    source: src-isic-challenge-home
    quote: sponsored by the International Society for Digital Imaging of the Skin (ISDIS)
  maintainer_type: conference-workshop
  maintainer_type_note: The challenges were held with ISBI, MICCAI and a CVPR workshop, and each
    edition's committee is drawn anew from ISIC's members, which the term's override takes over the
    coordinating body. consortium was considered for ISIC itself, a partnership of academia and
    industry, but no source read gives it a legal form.
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: Teams upload predictions, to Covalic in 2016, then the ISIC Challenge
    submission system, which validates the format and pre-scores against a small validation subset,
    and since 2020 to Kaggle; the final scores against the withheld test labels are released after
    the deadline. 2017-2019 required a link to a methods manuscript (an arXiv abstract in 2017) for
    a submission to count; the 2020 and 2024 rules on Kaggle were not readable, and whether 2024 ran
    as a code competition is not stated in the sources read.
  submission_process_source: src-isic-challenge-landing-2019
  submission_process_quote: Submissions are made to the ISIC Challenge submission system, which
    provides automated format validation, pre-scoring, metadata editing capabilties.
  independence_flags:
    - flag: prize-sponsored-by-industry
      source: src-isic-challenge-landing-2018
      quote: The prizes are being provided by Canfield Scientific, Inc., a US company
    - flag: single-evaluator-private-test-set
      source: src-europepmc-pmc11324883
      quote: was collected for a separate test set, not described here, for evaluating results of
        that competition
  independence_flags_note: Canfield Scientific, a dermatology imaging vendor whose 3D total-body
    system and export tool produced the 2024 data, funded the 2018 ($2,500 per task) and 2019
    ($7,000 per task) prizes and co-sponsored 2024; IBM and MetaOptima also sponsored 2019, and
    Kaggle supported 2024. No source read shows any sponsor's system entered. The rules let
    organisations affiliated with committee members take part if their submissions are independent
    of those members; no organiser entry was checked (review_checks).
  independence_assessed: true
  independence_policy:
    source: src-isic-challenge-landing-2018
    quote: Any organizations/companies affiliated with members of the organizing committee are not
      excluded from participation in the Challenge

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The 2020 and 2024 rankings need test labels that only their organisers hold. The
      2016-2019 rankings can be recomputed from the released labels with the public scoring package.
    source: src-europepmc-pmc7843971
    quote: These test images are available for download, but the test labels are not yet public due
      to planned future challenges and experiments.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: isic-challenge-scoring (ImageMarkup/isic-challenge-scoring), the Python package and
    Docker image that computed the official scores, with segmentation and classification commands
    for the 2016-2019 tasks
  harness_note: The README lists the 2016-2019 tasks it scores; the 2020 and 2024 editions were
    scored on Kaggle. The package was not run.
  harness_source: src-isic-challenge-landing-2019
  harness_quote: The code of the isic-challenge-scoring package is used for actual score
    computation.
  submission_channel:
    source: src-isic-challenge-landing-2019
    quote: Submissions are made to the ISIC Challenge submission system, which provides automated
      format validation, pre-scoring, metadata editing capabilties.
  submission_channel_note: The ISIC Challenge submission system carried 2017-2019 and the Live
    Challenges; 2020 and 2024 were Kaggle competitions (history).
  code_licence: Apache-2.0
  code_licence_note: The scoring package's licence, per GitHub's metadata read 2026-11-04.
  code_licence_source: src-github-api-isic-challenge-scoring
  code_licence_quote: '"spdx_id":"Apache-2.0"'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and task (the classes, test sets and ranking metric change every
  # year, and papers re-use the 2016-2019 splits with metrics the challenge did not rank by), and what the entrant
  # was trained on (outside dermoscopic data was allowed if disclosed, and 2016 ranked such entries apart).
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://challenge.isic-archive.com/
repository: https://github.com/ImageMarkup/isic-challenge-scoring
repository_note: The scoring package's repository; the challenge site and the ISIC Archive have no
  repository among the sources read.
dataset_url: https://challenge.isic-archive.com/data/
leaderboard_url: https://www.kaggle.com/competitions/isic-2024-challenge/leaderboard
leaderboard_url_note: The current edition's board, linked from the home page and not readable
  without scripts; the 2016-2019 boards are on the ISIC site
  (challenge.isic-archive.com/leaderboards/2019/ and the like).


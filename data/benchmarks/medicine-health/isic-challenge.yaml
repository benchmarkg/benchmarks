subsets:
  - id: isic-challenge#lesion-diagnosis
    label: Lesion diagnosis (2016 Part 3 and 3B, 2017 Part 3, 2018 Task 3, 2019, 2020, 2024)
    scored_separately: true
    evidence:
      - source: src-github-isic-challenge-scoring-readme
        quote: Classification (2016 Tasks 3 & 3B, 2017 Task 3, 2018 Task 3, 2019 Tasks 1 & 2)
      - source: src-isic-challenge-home
        quote: The earlier challenges were focused primarily on diagnostic accuracy for
          distinguishing dermoscopic photos of melanoma from other skin lesions.
    notes: The task every edition ran, the family's primary leaf. Two classes in 2016, 2020 and
      2024, three in 2017, seven in 2018, eight plus an outlier class in 2019. The best 2018
      balanced accuracy was 0.885; the 2020 winners scored 0.9490 AUC on Kaggle's private
      leaderboard.
  - id: isic-challenge#2019-images-and-metadata
    label: 2019 Task 2, lesion diagnosis from images with age, sex and anatomic site
    parent: isic-challenge#lesion-diagnosis
    items: 8238
    scored_separately: true
    evidence:
      - source: src-isic-challenge-landing-2019
        quote: 1) classify dermoscopic images without meta-data, and 2) classify images with
          additional available meta-data.
    notes: Ranked apart from the image-only Task 1, which its entrants also had to enter; test
      metadata were released a week after the image-only deadline.
  - id: isic-challenge#lesion-segmentation
    label: Lesion boundary segmentation (2016 Part 1, 2017 Part 1, 2018 Task 1)
    scored_separately: true
    domain_override:
      primary: medicine-health/medical-imaging-segmentation
      secondary:
        - vision/segmentation
    capability_override:
      - perception
    evidence:
      - source: src-isic-challenge-landing-2016
        quote: Lesions have been segmented against background normal skin and miscellaneous
          structures by expert dermatologists.
      - source: src-arxiv-1902-03368-v2
        quote: if the Jaccard value of a particular mask falls below a threshold T, the Jaccard is
          set to zero.
    notes: Binary lesion masks against dermatologists' tracings, ranked by mean Jaccard (2016, 2017)
      and thresholded Jaccard (2018), whose best was 0.802. The capability override drops
      distribution-shift-generalization, which only the 2018 diagnosis task scored.
  - id: isic-challenge#dermoscopic-attributes
    label: Dermoscopic feature and attribute detection (2016 Part 2 and 2B, 2017 Part 2, 2018 Task
      2)
    scored_separately: true
    domain_override:
      primary: medicine-health/medical-imaging-segmentation
      secondary:
        - vision/segmentation
    capability_override:
      - perception
    evidence:
      - source: src-arxiv-1902-03368-v2
        quote: 2,594 images with 12,970 ground truth segmentation masks for 5 attributes were
          provided for training.
      - source: src-github-isic-challenge-scoring-readme
        quote: Segmentation (2016 Tasks 1 & 2B, 2017 Task 1, 2018 Tasks 1 & 2)
    notes: Clinically defined dermoscopic structures localised in the lesion, labelled per
      superpixel in 2016 and 2017 (2B as masks) and as five attribute masks scored by Jaccard in
      2018. The least entered task each year; the capability override matches the segmentation
      subset's.


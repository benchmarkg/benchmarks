# data/benchmarks/medicine-health/medical-segmentation-decathlon.yaml
#
# P3-S6-T06, Grand Challenge subset, challenge 4 of 8 (the first new entry). Filled from the challenge paper (arXiv
# 2106.05735, v1 PDF; Nature Communications 13, 4128, 2022), read with windows narrowed to the cited sentences because
# the author list and the test-data custody passage name people; the challenge's home page on
# decathlon-10.grand-challenge.org, scripts and styles stripped; and the abstract page of a 2026 paper that evaluates on
# its brain tumour task (arXiv 2610.04787). The leaderboard, which shows participants' user names, and Grand Challenge's
# API, which its robots.txt disallows, were not read. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.

id: medical-segmentation-decathlon
name: Medical Segmentation Decathlon
aliases:
  - MSD
  - Decathlon-10
tagline: Ten 3D medical segmentation tasks solved by one general-purpose method, scored by Dice and
  NSD.
description: >
  A MICCAI 2018 challenge, hosted on Grand Challenge, that asks for one segmentation method able to solve
  ten tasks without task-specific manual settings. The ten data sets, 2,633 CT and MRI volumes from several
  institutions with one to three target regions each, are released with their training labels under CC
  BY-SA 4.0; the test labels stay with the organisers. In 2018 seven tasks formed a development phase
  and three (hepatic vessels, colon and spleen) a mystery phase, in which the same method had to be retrained
  on unseen tasks. Each region is scored by the Dice similarity coefficient and the normalised surface
  distance on 3D volumes, and methods are ranked by a significance ranking per region, averaged per task
  and over tasks. After the 2018 event the challenge reopened as a live challenge over all ten tasks in
  one phase, with a submission limit per team and a monthly ranking.
self_description:
  source: src-gc-decathlon-home
  quote: The MSD challenge tests the generalisability of machine learning algorithms when applied to
    10 different semantic segmentation tasks.
paper:
  title: The Medical Segmentation Decathlon
  arxiv: '2106.05735'
  doi: 10.1038/s41467-022-30695-9
  version_read: v1
  source: src-arxiv-2106-05735-v1
released: null
released_note: The paper dates the challenge event to MICCAI 2018 but no source read gives the day
  the data or the submission site opened.
release_venue: MICCAI 2018 (Granada); the paper in Nature Communications 13, 4128 (2022)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-imaging-segmentation
  secondary:
    - vision/medical-imaging-cv
domain_basis:
  reason: Systems delineate clinically defined regions (tumours, organs, vessels) in CT and MRI
    volumes and are scored as masks by Dice and surface distance, which the leaf's inclusion test
    takes. The challenge's own claim is a general-purpose method rather than a clinical task, so the
    vision term is recorded as the secondary (review_checks).
  source: src-arxiv-2106-05735-v1
  quote: an international challenge dedicated to identifying a general-purpose algorithm for medical
    image segmentation
domain_considered_and_rejected:
  - term: medicine-health/medical-imaging-diagnostic
    reason: No finding is scored as a location or a label; every target is scored as a mask.

capability:
  - perception
capability_basis:
  perception:
    reason: The input is 3D CT or MRI, and the score depends on how much of each target region the
      predicted mask covers and how close its boundary lies to the reference.
    source: src-arxiv-2106-05735-v1
    quote: and the Normalised Surface Distance (NSD) [18], both computed on 3D volumes.
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The mystery phase retrains the same method on three unseen tasks, but the method, not a
      trained model, carries over, and each task is scored as trained on its own data; nothing
      reports a transfer from one task to another.
    source: src-arxiv-2106-05735-v1
    quote: The participants were allowed to submit only one solution, able to solve all problems
      without changing the architecture or hyperparameters.

evaluation_method:
  - domain-metric
  - entrant-relative-ranking
evaluation_method_basis:
  reason: Each region is scored by Dice and NSD, segmentation metrics the term names; the ranking is
    a significance ranking computed per region against the other entrants, so adding an entrant can
    move the others' ranks.
  source: src-arxiv-2106-05735-v1
  quote: the ranking scheme is applied to each ROI separately
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are segmentation networks trained on the challenge's labelled volumes, for
    tasks a clinical imaging discipline defines, which task-specific-supervised-model's exclusion
    test sends here.
  source: src-gc-decathlon-home
  quote: teams cannot manually tweak parameters of algorithms/models on a task specific basis
as_used:
  - protocol: One task's data (Task01, brain tumour MRI) as a stand-alone benchmark, trained and
      scored locally by Dice on its sub-regions; nothing is submitted to the challenge site and the
      other nine tasks are not run.
    split: Task01 BrainTumour
    source: src-arxiv-2610-04787
    quote: Evaluations on the Medical Segmentation Decathlon (MSD) Task01 BrainTumour benchmark
      showed that Active-DiNTS surpasses DiNTS, C2FNAS, and nnU-Net in Dice
    note: Active-DiNTS (arXiv 2610.04787, October 2026), an active-learning network topology search.

lifecycle: active
lifecycle_basis:
  reason: Papers still evaluate on its tasks in 2026, as the as_used row shows.
  source: src-arxiv-2610-04787
  quote: Evaluations on the Medical Segmentation Decathlon (MSD) Task01 BrainTumour benchmark showed
    that Active-DiNTS surpasses DiNTS, C2FNAS, and nnU-Net in Dice
activity: leaderboard-live-no-round
activity_basis:
  reason: The 2018 event is over and the challenge reopened for rolling submissions over all ten
    tasks; the home page still invites submissions and promises a monthly ranking. The leaderboard
    itself was not read.
  source: src-arxiv-2106-05735-v1
  quote: Following the challenge event at MICCAI 2018, the competition was opened again for rolling
    submissions.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Active-DiNTS, a differentiable network topology search for 3D segmentation, compared
      with DiNTS, C2FNAS and nnU-Net on the brain tumour task
    source: src-arxiv-2610-04787
    observed_on: 2026-11-25
    quote: Evaluations on the Medical Segmentation Decathlon (MSD) Task01 BrainTumour benchmark
      showed that Active-DiNTS surpasses DiNTS, C2FNAS, and nnU-Net in Dice
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test labels stay with the organisers, so an official score comes only from the
    challenge site; local scores use cross-validation on the training labels.
  source: src-arxiv-2106-05735-v1
  quote: Only two copies of the full test data currently exist

task:
  exists: true
  input:
    - the training volumes (CT or MRI, NIfTI) of each of the ten tasks with their label maps
    - the test volumes of each task, without labels
  output: A label map per test volume of each task, uploaded to the challenge site; in the live
    challenge, results for all ten tasks in one submission.
  scoring: Dice similarity coefficient and normalised surface distance per target region on 3D
    volumes; a significance ranking per region and metric, averaged per task and then over tasks.
  metric_range:
    - 0.0
    - 1.0
  tests_hidden_from_system: true
  source: src-arxiv-2106-05735-v1
  quote: and the Normalised Surface Distance (NSD) [18], both computed on 3D volumes.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The ten data sets, training labels included, are downloadable without a challenge
    account under CC BY-SA 4.0. Teams run their method on the released test volumes and upload the
    segmentations; the test labels are kept by the organisers and the Grand Challenge validation
    server, so scoring needs the site.
  access_basis:
    reason: The test inputs are released and the labels are not, so entrants upload predictions for
      the organisers' site to score.
    source: src-gc-decathlon-home
    quote: Participants are expected to submit the segmentation results through this website.
  refresh: static
  refresh_note: One set of ten tasks since 2018; the live challenge scores the same tasks, and no
    source read announces a change to the items or labels.
  data_provenance:
    - real-world-instrument
  data_provenance_note: CT and MRI volumes acquired in clinical practice at several institutions.
    The paper's description of who drew the labels was not among the passages read, so
    expert-authored is not recorded (review_checks).
  data_provenance_source: src-arxiv-2106-05735-v1
  data_provenance_quote: The images (2,633 in total) were acquired across multiple institutions,
    anatomies and modalities
  contamination_risk: medium
  contamination_risk_note: The test volumes have been public since 2018 and the tasks are widely
    used as stand-alone benchmarks, so unlabelled test volumes can reach pretraining corpora; the
    test labels have not been released. No source read evidences a route.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Dice and NSD are bounded at 1; no source read reports inter-rater
    agreement for the ten tasks.
  dataset_licence: CC-BY-SA-4.0
  dataset_licence_note: The paper's own licence (CC BY-NC-SA 4.0 on arXiv) is not the data's.
  dataset_licence_source: src-arxiv-2106-05735-v1
  dataset_licence_quote: all data sets have been released with a permissive copyright-license
    (CC-BY-SA 4.0)
  size:
    - count: 2633
      unit: CT and MRI volumes over the ten tasks
      subset: all tasks
      source: src-arxiv-2106-05735-v1
      quote: The images (2,633 in total) were acquired across multiple institutions, anatomies and
        modalities
    - count: 10
      unit: segmentation tasks
      subset: all tasks
      source: src-gc-decathlon-home
      quote: The MSD challenge tests the generalisability of machine learning algorithms when
        applied to 10 different semantic segmentation tasks.
  submission_limit:
    max_submissions: 15
    period_days: 0
    per: team, in the live challenge over all ten tasks (at most one a day)
    source: src-gc-decathlon-home
  submission_limit_note: The home page also allows one submission a day, and the paper gives the
    same 15 for the live challenge. In 2018 the development phase took one submission a day and the
    mystery phase one in all.
  submission_limit_source: src-gc-decathlon-home
  submission_limit_quote: Each team is only allowed 15 submissions in total.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Medical Segmentation Decathlon organisers, among them a group at King's College
    London (KCL), with data sets contributed by several institutions
  maintainer_basis:
    reason: The paper names KCL's organisers as the ones who held the test data and stayed out of
      the competition; the data come from several institutions.
    source: src-arxiv-2106-05735-v1
    quote: The KCL organisers committed to not participate in the challenge.
  maintainer_type: consortium
  maintainer_type_note: A multi-institution organising group and data providers. academic-lab was
    considered; the sources read do not show one lab running it alone.
  submission_process:
    - held-out-server
    - maintainer-scored-predictions
  submission_process_note: Teams upload segmentations of the test volumes; the site's validation
    script scores them against the withheld labels, one machine first-in-first-out. Registering
    several teams to get round the limit is forbidden.
  submission_process_source: src-gc-decathlon-home
  submission_process_quote: Participants are expected to submit the segmentation results through
    this website.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2106-05735-v1
      quote: Only two copies of the full test data currently exist
  independence_flags_note: The organisers hold the test labels and every official score comes from
    their site. The organisers who held the test data committed not to compete.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The official score needs the withheld test labels.
    source: src-arxiv-2106-05735-v1
    quote: Only two copies of the full test data currently exist
  reproducibility_blockers:
    - private-test-set
  harness_availability: null
  harness_availability_note: The paper's passage on the metric implementation was not among those
    read, and no repository was opened (review_checks).
  code_licence: null
  runnable_via:
    - none
  runnable_via_note: The official score needs the withheld labels.
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which task or tasks (the 2018 development or mystery phase, the live
  # challenge's ten, or one task alone as papers use it).
  material_extra:
    - subset_used

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The organisers rank by a significance ranking per region and metric, averaged per task and
    over tasks; it is pool-relative, so no metric is the headline.
  source: src-arxiv-2106-05735-v1
  quote: the ranking scheme is applied to each ROI separately

liveness:
  last_checked: 2026-11-25

homepage: https://decathlon-10.grand-challenge.org/
repository: null
dataset_url: null
dataset_url_note: The home page links the data download; its target was not opened.
leaderboard_url: null
leaderboard_url_note: The site's Leaderboard link was not followed; Grand Challenge leaderboards
  show participants' user names.

metrics:
  - msd-dsc
  - msd-nsd
metrics_note: P3-S6-T06. The challenge's own two metrics, per region on 3D volumes, which feed its
  significance ranking; neither is a shared accuracy, and a paper's Dice on one task outside the
  site is not the challenge's number.

tags:
  - segmentation
  - ct
  - mri
  - multi-task
  - challenge

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P3-S6-T06)
  added_on: 2026-11-25
  last_verified: 2026-11-25
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2106-05735-v1
    - src-gc-decathlon-home
    - src-arxiv-2610-04787
  confidence: medium
  review_checks:
    - check: medical-imaging-segmentation is primary because the targets are clinically defined
        regions against reference masks, which vision/medical-imaging-cv's exclusion test sends to
        medicine-health; but the challenge claims a general-purpose method and says its metrics are
        not clinically validating, which is that term's inclusion test. Confirm the primary.
      field: domain.primary
      source: src-arxiv-2106-05735-v1
      quote: It is important to note that the proposed metrics are not task-
    - check: submission_limit records the live challenge's 15 per team (home page and paper agree);
        the 2018 phases allowed one a day and one mystery-phase submission. The platform's current
        phase settings were not read, because the submit page needs an account.
      field: data.submission_limit
      source: src-arxiv-2106-05735-v1
      quote: each team was allowed submit their results 15 times
    - check: The 2018 challenge (seven development and three mystery tasks in two phases) and the
        live challenge (all ten in one phase) are recorded as one benchmark without versions.
        Whether the live challenge scores the same test cases is not stated in the passages read; if
        it does not, they are two versions.
      field: versions
    - check: activity rests on the paper's reopening and the home page's monthly ranking; the
        leaderboard was not read (participants' user names), so whether submissions still arrive is
        unconfirmed.
      field: activity
      source: src-gc-decathlon-home
      quote: There will be a monthly ranking calculation and the results will be updated
        accordingly.
    - check: harness_availability and code_licence are null because the metric notebook and any
        repository were not read; reference-implementation-only is likely if the notebook is public.
      field: execution.harness_availability
    - check: data_provenance lacks expert-authored because the paper's labelling passage was not
        read; read it and add the term if the labels were drawn by clinicians.
      field: data.data_provenance
    - check: The learned entrant comes from a 2026 paper's own use of one task, not from the
        challenge board; the board's rows carry participants' user names and were not read.
      field: learned_entrant_evidence
  personal_data_excluded:
    - source: src-arxiv-2106-05735-v1
      what: The author list and a passage naming the two organisers who held the test data; the
        extract keeps only the cited sentences.
    - source: src-gc-decathlon-home
      what: The challenge's project e-mail address in the page text and mailto links.
    - source: src-arxiv-2610-04787
      what: The author list and the submitter line.

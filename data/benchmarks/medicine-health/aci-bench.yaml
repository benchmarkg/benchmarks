curation:
  added_by: agent (P1-S6-T04)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-scidata-aci-bench-2023
    - src-arxiv-2306-02022-v1
    - src-arxiv-2306-02022
    - src-github-aci-bench-readme
    - src-github-aci-bench-setup
    - src-figshare-api-aci-bench
    - src-acl-2023-clinicalnlp-1-52
    - src-arxiv-2505-23802-v2
    - src-medhelm-leaderboard-v4-schema
    - src-arxiv-2610-08161-v1
  sources_note: >
    The Scientific Data version of record read as Europe PMC's full-text XML (a DOI, not archived), with
    windows that keep out the worked examples of note text; the preprint's v1 PDF and its abstract page
    (DOIs); the README at main, withheld from archiving because it spells out two people's e-mail addresses,
    and SETUP.md at main; Figshare's API record (a DOI); the MEDIQA-Chat 2023 overview paper's PDF (a
    DOI), with windows clear of its example conversations; MedHELM's paper and v4.0.0 schema, already
    on main; and Symphony's v1 PDF (a DOI) as evidence of current use.
  confidence: medium
  review_checks:
    - check: Domain. No leaf describes clinical documentation (note generation from a conversation
        or a record). clinical-dialogue is filed as the nearest leaf, but its definition scores the
        conduct of an exchange; radiology-report-generation is closer by output and requires
        imaging. A missing-term gap proposing medicine-health/clinical-documentation is logged;
        MedHELM's six Clinical Note Generation scenarios (DischargeMe, MIMIC-BHC and others) would
        share the leaf.
      field: domain.primary
      source: src-medhelm-leaderboard-v4-schema
      quote: '"subgroups": [ "dischargeme", "aci_bench", "mtsamples_procedures", "mimic_rrs", "mimic_bhc",
        "chw_care_plan" ]'
    - check: Family. medicine-health is primary with language/summarization secondary, on the
        language exclusion test (language as the interface to clinical documentation). The paper
        calls the task dialogue summarisation and the data was built for benchmarking summarisation
        methods, which argues for language/summarization primary if the reviewer reads the
        competence as summarisation itself.
      field: domain
      source: src-scidata-aci-bench-2023
      quote: The data here is intended to be used for benchmarking methods related to
        clinician-patient dialogue summarization.
    - check: Identity. MEDIQA-Chat 2023 and MEDIQA-Sum 2023 are editions of the MEDIQA shared-task
        series, organised by an overlapping group (three ACI-Bench authors among MEDIQA-Chat's
        organisers), and ran on ACI-Bench's test sets before the corpus was released. They are
        modelled here as events, subsets and as_used rows by the 04 S4 rule (the same items, scored
        separately), not as editions of ACI-Bench. If MEDIQA is catalogued as a family, its 2023
        edition should link here. MEDIQA-Sum's overview paper was not read.
      field: events
      source: src-scidata-aci-bench-2023
      quote: Test 3 corresponds to CLEF MEDIQA-SUM 2023 Subtask C full-note generation.
    - check: activity closed rests on the shared tasks' run submissions being ACI-Bench's channel.
        If they are MEDIQA's channel rather than the benchmark's, no-submission-channel (download
        and run, results in users' papers) fits better, and submission_process becomes
        literature-only.
      field: activity
      source: src-acl-2023-clinicalnlp-1-52
      quote: we added a new requirement to submit the code for a second evaluation of the outputs
    - check: Test set 2 served MEDIQA-Chat Task C, note-to-dialogue generation, the reverse task,
        while the paper scores note generation on all three test sets. The task block describes note
        generation only; whether dialogue generation should be a subset with its own task was not
        decided.
      field: task
      source: src-acl-2023-clinicalnlp-1-52
      quote: This task addresses data augmentation through the generation of synthetic
        doctor-patient conversations from full clinical notes.
    - check: MEDCON is tagged reference-metric (a string-match F1 over UMLS concepts) and backs
        factual-precision. Concept-set F1 with no assertion status counts a negated finding as a
        match, so whether it checks asserted particulars one by one, as factual-precision's test
        asks, is arguable.
      field: capability
      source: src-scidata-aci-bench-2023
      quote: is performed using a string match algorithm applied to the UMLS concept database
        through the QuickUMLS package
    - check: designed_for_subjects lists domain-specialist-model and instruction-tuned-model, from
        the paper's fine-tuned and prompted baselines; the paper does not say which it was designed
        for.
      field: designed_for_subjects
    - check: data_provenance. model-generated rests on the notes being drafted by an automatic note
        generation system before expert rewriting, and on the aci transcripts being ASR output;
        expert-authored's exclusion (experts only reviewed items from elsewhere) could be read as
        applying to the notes.
      field: data.data_provenance
      source: src-scidata-aci-bench-2023
      quote: Our final dataset was distilled from encounters originally created for marketing
        demonstration purposes.
    - check: maintainer_type individual follows the holder test (a personal GitHub account and an
        author-deposited Figshare record); the README's contacts are Microsoft staff, and
        industry-lab may be the truer description of who keeps it.
      field: governance.maintainer_type
    - check: The paper compares ACI-Bench with real encounters and finds it shorter and probably
        slightly easier, and the README reports uncorrected swapped speaker tags in some
        transcripts. Neither is a revision, but users correcting the tags change the input.
      field: data.refresh
      source: src-github-aci-bench-readme
      quote: Some ACI-BENCH subsets include swapped speaker tags (e.g., [patient], [doctor]) that
        originate from the Automatic Speech Recognition (ASR) process.
    - check: The size rows for the splits and the subset item counts come from the README and the
        paper's Table 3; the corpus zip was not downloaded to count them.
      field: data.size
  personal_data_excluded:
    - source: src-github-aci-bench-readme
      what: The README's contact section, two named people's e-mail addresses spelled out with 'at'

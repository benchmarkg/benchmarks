# data/benchmarks/medicine-health/counselbench.yaml
#
# P1-S6-T04, medicine-health entry 19. Filled from the CounselBench paper, arXiv 2506.08584 read as its v4 PDF
# (2026-05-14, the ICLR 2026 version) and its v1 PDF (2025-06-10, for the first adversarial protocol), and its
# abstract page; the repository README pinned at commit a33c4e5 (2026-05-02); Hugging Face's API records of the
# three datasets (CounselBench-Eval, CounselBench-Adv and CounselBench-Adv-human-annotation, none gated; no data
# file was downloaded); and the v1 PDF of CARE-MH (arXiv 2607.24754, May 2026), a third party's framework that
# re-runs CounselBench. GitHub's API was read for the licence, push date, contents and commits. The questions come
# from a public forum of real people: none is quoted here, and no rater is named. Every quote below is checked by
# the quote-substring validator against those Sources' committed extracts.

id: counselbench
name: CounselBench
tagline: Mental-health professionals rate LLM answers to 100 real patient questions and label
  failures on 120 adversarial ones.
description: >
  A University of Southern California benchmark of single-turn answers to mental-health questions, in
  two parts. CounselBench-Eval takes 100 patient questions from CounselChat, a public forum where verified
  therapists answer anonymous questions: five per topic across 20 topics (depression, anxiety, relationships,
  trauma, grief, substance abuse, eating disorders and others), chosen by the upvotes of their best answer.
  Each question was answered by GPT-4, Llama-3.3-70B-Instruct and Gemini-1.5-Pro, prompted as an online
  therapist and held to 250 words, and by the forum's top-voted therapist answer. 100 licensed or trained
  mental-health professionals, recruited through Upwork with credentials checked, rated the four answers
  blind, five raters per answer (2,000 evaluations), on overall quality, empathy and specificity (1-5),
  factual consistency (1-4), toxicity (1-5, lower is better) and whether the answer gives medical advice
  only a licensed professional should give (yes or no), marking the spans and writing rationales. Llama-3.3
  led on five of six dimensions and was the model flagged most often for medical advice; the therapists'
  answers scored lowest. CounselBench-Adv has 120 questions written by ten of the raters, two for each
  of six failure modes seen in Eval (recommending medication, suggesting therapy techniques, speculating
  about symptoms, judgmental tone, apathetic tone, unsupported assumptions). In the ICLR 2026 version
  one answer from each of nine LLMs (1,080) is labelled by a professional for whether the targeted failure
  appears, and the score is that fraction per model and failure mode; the first version instead had GPT-4.1
  label 2,880 answers. Nine LLMs were also tested as judges and found to overrate answers and miss the
  safety problems experts flagged. Data and code are public; scoring a new model needs new expert ratings.
self_description:
  source: src-arxiv-2506-08584
  quote: We present CounselBench, a large-scale benchmark developed with 100 mental health
    professionals to evaluate and stress-test large language models (LLMs) in realistic help-seeking
    scenarios.
external_ids:
  huggingface: izi-ano/CounselBench-Eval
  arxiv: '2506.08584'
paper:
  title: 'CounselBench: A Large-Scale Expert Evaluation and Adversarial Benchmarking of Large Language
    Models in Mental Health Question Answering'
  arxiv: '2506.08584'
  version_read: v4
  source: src-arxiv-2506-08584-v4
released: 2025-05-16
released_note: The day the CounselBench-Eval and CounselBench-Adv datasets were created on Hugging
  Face, as their API records date them, and the day the repository was created and first committed
  (GitHub API). The paper's v1 followed on arXiv on 2025-06-10; v4, the ICLR 2026 version, on
  2026-05-14.
released_source: src-hf-api-counselbench-eval
released_quote: '"createdAt":"2025-05-16T06:00:51.000Z"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/mental-health
  secondary:
    - medicine-health/medical-safety
domain_basis:
  reason: The task is answering people's mental-health help-seeking questions, which is
    psychological support, and the six dimensions were built from clinical psychology literature
    with clinical psychologists and rated by mental-health professionals, which are
    mental-health-specific criteria, the leaf's definition. medical-safety is secondary because two
    of the six dimensions (medical advice beyond a licensed professional's remit, toxicity) and all
    six adversarial failure modes measure unsafe or inappropriate advice.
  source: src-arxiv-2506-08584-v4
  quote: Our evaluation protocol is co-designed with clinical psychologists
domain_considered_and_rejected:
  - term: medicine-health/clinical-dialogue
    reason: Every item is one question and one reply, scored on that reply; the paper names
      multi-turn dialogue as future work.
    source: src-arxiv-2506-08584-v4
    quote: our framework provides a foundation for future expansion into dialogue settings
  - term: medicine-health/clinical-qa
    reason: The questions have no determinate answer; replies are rated on six dimensions by
      experts.
  - term: medicine-health/clinical-task-suites
    reason: One task, an answer to a help-seeking question, in two item sets; not a suite of tasks
      across subdomains.
  - term: language/generation
    reason: Free text scored on rubric dimensions, but language is the interface; what is measured
      is the clinical quality and safety of mental-health advice (the language family's exclusion).
  - term: safety-alignment/harmlessness-refusal
    reason: Toxicity and unauthorised medical advice are rated, but the claim is clinically grounded
      quality and safety of mental-health answers, not refusal; the adversarial questions are
      realistic patient questions aimed at clinical failure modes, not attacks on safety training
      (the family's inclusion test names refusal, attack robustness, honesty, bias and frontier
      risk).
capability:
  - harm-avoidance
  - adversarial-robustness
  - context-integration
capability_basis:
  harm-avoidance:
    reason: In Eval, under ordinary use (real questions), experts flag whether a reply gives
      diagnostic or therapeutic advice that only a licensed professional should give, and rate
      toxicity; the absence of that harmful content is scored for every reply.
    source: src-arxiv-2506-08584-v4
    quote: Medical Advice flags whether the response includes therapeutic or diagnostic guidance
      that should only be provided by licensed professionals.
  adversarial-robustness:
    reason: In Adv, clinicians wrote questions chosen to make models fall into six failure modes
      seen in Eval, and the score is how often each model did, read as its vulnerability.
    source: src-arxiv-2506-08584-v4
    quote: Importantly, these questions do not directly contain the failure, but are designed to
      trigger the failure in LLM responses.
  context-integration:
    reason: The question supplies the person's situation, and specificity (1-5) scores whether the
      reply is tailored to it rather than generic; low-rated replies were often faulted for little
      personalisation or for assumptions without context.
    source: src-arxiv-2506-08584-v4
    quote: Specificity evaluates how well the response is tailored to the user
capability_considered_and_rejected:
  - term: factual-precision
    reason: Factual consistency is one holistic 1-4 rating per reply against commonsense or clinical
      knowledge; raters mark spans, but no reference is checked particular by particular.
    source: src-arxiv-2506-08584-v4
    quote: This dimension is rated on a 4-point scale
  - term: communication
    reason: Empathy and specificity rate the message itself; no recipient's understanding or action
      is measured.
  - term: knowledge-recall
    reason: Clinical knowledge is an input to a good reply, but no question has a keyed answer.
  - term: honesty
    reason: Nothing scores whether a reply states what the model believes or acknowledges
      uncertainty.

evaluation_method:
  - human-expert-eval
  - adversarial-red-team
evaluation_method_basis:
  reason: human-expert-eval, because licensed or trained mental-health professionals rate each reply
    individually (five per reply in Eval, one per reply in Adv) and their ratings are the result;
    adversarial-red-team, because Adv reports how often clinician-written attack questions succeeded
    in eliciting the targeted failure. The Adv set is fixed, so its denominator does not move with
    new attacks.
  source: src-arxiv-2506-08584-v4
  quote: we recruit 100 licensed or professionally trained mental health professionals to provide
    2,000 evaluations of answers to real patient questions.
evaluation_method_considered_and_rejected:
  - term: rubric-graded
    reason: The six dimensions are named criteria rated individually, but they are reported side by
      side and never combined into a score, which the term's inclusion test asks for
      (review_checks).
    source: src-arxiv-2506-08584-v4
    quote: scores were first averaged by question, then by model
  - term: model-graded-judge
    reason: Nine LLMs were run as judges only to measure their agreement with the experts, which was
      poor; the reported scores are the experts'. The first version did score Adv with GPT-4.1
      (versions).
    source: src-arxiv-2506-08584-v4
    quote: LLM judges systematically overrate model responses and overlook safety concerns
      identified by human experts
  - term: human-crowd-eval
    reason: Raters were recruited for, and checked on, counselling licences, degrees or experience.
  - term: ordinal-grading
    reason: Likert ratings are averaged into numbers; no band is the published result.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: Each model is prompted once with a therapist persona and the question and writes one
    reply, with no tools or retrieval; the paper reports general chat models from OpenAI, Meta,
    Google and Anthropic.
  source: src-arxiv-2506-08584-v4
  quote: Each model is prompted with the original patient question and asked to respond.
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: Mental-health and medical models were piloted, answered poorly, and were dropped;
      general instruction-tuned models were evaluated instead.
    source: src-arxiv-2506-08584-v4
    quote: We first piloted domain-specific models such as MentalLLaMA (Yang et al., 2023) and
      Meditron
  - term: human-expert
    reason: The forum's top-voted therapist answers are rated beside the models as a fixed
      comparison (ceiling anchor); the protocol admits no new human entrants.
  - term: reasoning-model
    reason: GPT-5 is among the Adv models, but the benchmark sets no reasoning condition.
as_used:
  - protocol: CounselBench-Eval's 100 questions, answered by Gemini-2.5-Pro, GPT-4.1 and Llama-3.3
      beside the therapists' answers, and scored on CounselBench's dimensions by LLM evaluators
      (GPT-5, Llama 3.1 and 3.3, Claude and Gemini models) inside the CARE-MH framework, not by
      experts.
    split: CounselBench-Eval (100 questions)
    source: src-arxiv-2607-24754-v1
    quote: 'We evaluated three mental health LLM benchmarks: CounselBench (Li et al., 2026), from which
      we used 100 example prompts'
    note: CARE-MH (May 2026) reproduces the paper's LLM-judge scores, mostly within 0.05, and
      compares CounselBench with MentalBench and MentalChat16K. Its numbers are LLM-judged and not
      comparable with the expert ratings.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against it by others; CARE-MH (May 2026) re-runs
    CounselBench-Eval with newer models and evaluators. The maintainers last pushed the repository
    on 2026-05-02 and added the Adv expert labels in April 2026 (GitHub and Hugging Face APIs),
    which is maintenance evidence.
  source: src-arxiv-2607-24754-v1
  quote: These results suggest that CounselBench is relatively robust to evaluator variation
activity: no-submission-channel
activity_basis:
  reason: There is no leaderboard or submission route, and there never was; the data and code are
    released for others to run, and results appear in their papers.
  source: src-arxiv-2506-08584-v4
  quote: Both components of COUNSELBENCH are released as public resources to support future
    research.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Llama-3.3-70B-Instruct
    source: src-arxiv-2506-08584-v4
    observed_on: 2026-11-04
    quote: Among the models, LLaMA-3.3 received the highest overall ratings, leading on five of six
      dimensions.
evaluation_target: learned-system
execution_mode: human-in-loop
ground_truth_source: expert-panel
ground_truth_source_note: There is no reference answer. The score is mental-health professionals'
  ratings of each reply (Eval) and their labels for the targeted failure mode (Adv).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The questions, the rubric, the prompts, the generation and judge code and the experts'
    ratings and labels are public; scoring a new model means recruiting mental-health professionals
    to rate its replies, as the paper did through Upwork.
  source: src-arxiv-2506-08584-v4
  quote: We recruited 100 licensed or professionally trained mental health practitioners across the
    U.S. through Upwork

task:
  exists: true
  input:
    - "a person's mental-health question: one of 100 from CounselChat (Eval) or one of 120 written by
      clinicians to trigger a failure mode (Adv)"
    - a system prompt casting the model as a professional therapist answering online in a single
      turn
  output: One free-text reply of at most 250 words (longer outputs were regenerated).
  scoring: "Eval: five professionals rate each reply blind on overall quality, empathy, specificity and
    toxicity (1-5), factual consistency (1-4) and medical advice (yes, no or not sure); ratings are averaged
    by question and then by model, and medical advice is the share of yes. Adv: a professional labels
    whether the reply shows the question's targeted failure mode (yes, no or not sure), and the score
    is the fraction of replies with it, per model and failure mode."
  source: src-arxiv-2506-08584-v4
  quote: All metrics were rated using 5-point Likert scales (1 = the most negative; 5 = the most
    positive) unless specified.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: CounselBench-Eval and CounselBench-Adv are public Hugging Face datasets with no gate.
    source: src-hf-api-counselbench-eval
    quote: '"gated":false'
  records_access: fully-open
  records_access_note: The Eval file holds the 2,000 expert ratings with rationales; the Adv expert
    labels were released as a third dataset on 2026-04-22 (not gated).
  records_access_source: src-github-counselbench-readme
  records_access_quote: Human annotations for CounselBench-Adv have also been
  refresh: versioned-releases
  refresh_basis:
    reason: The question sets and Eval ratings have not changed since May 2025 (lastModified), but
      Adv's scoring changed between paper versions, from GPT-4.1 labels on 2,880 replies (v1, June
      2025) to expert labels on 1,080 (v4, May 2026); each state is pinned by a dated arXiv version
      (versions).
    source: src-hf-api-counselbench-eval
    quote: '"lastModified":"2025-05-16T06:01:15.000Z"'
  data_provenance:
    - web-scraped
    - expert-authored
    - model-generated
  data_provenance_note: Eval's 100 questions and the therapists' answers were taken from a scraped
    CounselChat dataset (forum posts written before 2022); Adv's 120 questions were written by ten
    mental-health professionals; the replies rated are model outputs, beside the therapists'
    answers.
  data_provenance_source: src-arxiv-2506-08584-v4
  data_provenance_quote: Each clinician authored 12 adversarial questions (2 per issue × 6 issues),
    resulting in a total of 120 questions.
  contamination_risk: medium
  contamination_risk_note: The forum questions and therapist answers have been public since before
    2022, and the Eval and Adv question sets since May 2025, so a training route is plausible.
    Scores come from experts rating fresh replies, so a memorised answer key does not apply, but
    training on the top-voted answers could still shape replies. No evidence of contamination was
    read.
  contamination_risk_source: src-arxiv-2506-08584-v4
  contamination_risk_quote: All posts were authored before 2022, ensuring that all online therapist
    responses predate the widespread use of LLMs like ChatGPT.
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_basis:
    reason: The forum's top-voted answers by verified therapists were rated blind under the same
      protocol as the models, and the paper reads model scores against them. All three models exceed
      them (overall 2.60 against 3.26-4.29), which leaves the anchor in place.
    source: src-arxiv-2506-08584-v4
    quote: GPT4 Llama 3.3 Gemini-1.5-Pro Online Human Therapists Overall ↑ (range:1-5) 3.28 4.29
      3.26 2.60
  dataset_licence: CC-BY-NC-ND-4.0
  dataset_licence_note: The licence tag on all three Hugging Face datasets. The paper says the
    questions and therapist answers come from the MIT-licensed CounselChat dataset; the GitHub
    repository states no licence.
  dataset_licence_source: src-hf-api-counselbench-eval
  dataset_licence_quote: license:cc-by-nc-nd-4.0
  size:
    - count: 100
      unit: patient questions, each with four answers (three LLMs, one therapist)
      subset: CounselBench-Eval
      source: src-arxiv-2506-08584-v4
      quote: From each topic, we selected five questions with the highest response upvotes,
        resulting in 100 questions in total.
    - count: 2000
      unit: expert evaluations (100 questions x 4 answers x 5 raters)
      subset: CounselBench-Eval
      source: src-arxiv-2506-08584-v4
      quote: In total, the study includes 2,000 annotated QA pairs (100 questions × 4 answers × 5
        annotations).
    - count: 120
      unit: expert-authored adversarial questions (20 per failure mode)
      subset: CounselBench-Adv
      source: src-arxiv-2506-08584-v4
      quote: Each clinician authored 12 adversarial questions (2 per issue × 6 issues), resulting in
        a total of 120 questions.
    - count: 1080
      unit: expert-labelled replies (120 questions x 9 LLMs)
      subset: CounselBench-Adv
      source: src-arxiv-2506-08584-v4
      quote: For each model, we generated one response for each question, this leads to 1,080 QA
        pairs (120 questions × 9 LLMs).

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CounselBench authors at the University of Southern California, in the
    llm-eval-mental-health GitHub organisation
  maintainer_basis:
    reason: The paper's authors are at USC and give the repository as the home of the code and data,
      which links the three Hugging Face datasets.
    source: src-arxiv-2506-08584-v4
    quote: 'https://github.com/llm-eval-mental-health/CounselBench Disclaimer: this study is conducted
      for research purposes and is not intended for clinical use'
  maintainer_type: academic-lab
  maintainer_type_note: The authors are in USC's computer science, engineering, social work,
    psychiatry and communication departments. The Hugging Face datasets sit on a separate account
    with an anonymous-looking name.
  submission_process:
    - literature-only
  submission_process_note: The maintainers published their own model results in the paper and keep
    no ranking; others report their numbers in their own papers (CARE-MH).
  submission_process_source: src-arxiv-2506-08584-v4
  submission_process_quote: Both components of COUNSELBENCH are released as public resources to
    support future research.
  independence_flags: []
  independence_flags_note: Not assessed to completion. The maintainers rank no system of their own;
    the v4 PDF has no funding, API-credit or competing-interests statement, so material support from
    an evaluated developer cannot be ruled out, and the ICLR version of record was not read.
  independence_assessed: false
  known_limitation:
    source: src-arxiv-2506-08584-v4
    quote: The initial expert also completed annotation of the remaining 120 question

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: human-panel
  compute_tier_note: A run's cost is paying licensed professionals (the Adv labellers were paid $210
    for about five to six hours each), beside API calls or GPUs for the model (the paper used 8 RTX
    A6000s for open models).
  compute_tier_source: src-arxiv-2506-08584-v4
  compute_tier_quote: Most experiments were run on 8 × RTX A6000 GPUs (48 GB each).
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: Every reported score is an expert's rating or label, so scoring a new model means
      recruiting mental-health professionals; LLM judges are shown not to substitute for them.
    source: src-arxiv-2506-08584-v4
    quote: Even the best-performing model (Claude-3.7-Sonnet) attains an F1 score of only 0.5.
  reproducibility_blockers:
    - human-raters
  harness_availability: reference-implementation-only
  harness_availability_note: The repository generates replies under the paper's prompts and runs the
    LLM judges and statistics, but the official scores are human ratings collected in Qualtrics and
    Google Sheets, which no code produces.
  harness: generate_counselchat/evaluate_counsel_chat.py (persona_survey prompt, temperature 0.7,
    length constrained) for replies; llm_as_judges/ and run_adversarial/ for the judge and
    adversarial runs
  harness_source: src-github-counselbench-readme
  harness_quote: python generate_counselchat/evaluate_counsel_chat.py
  code_licence: null
  code_licence_note: GitHub reports no licence for llm-eval-mental-health/CounselBench (API, read
    2026-11-04), and the README states none.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the human-judged profile: the reply-generation conditions, which the paper fixes and a
  # rerun must match, namely the therapist system prompt with its 250-word limit enforced by
  # regeneration (prompt_template_hash) and temperature 0.7, top-p 1.0, 1,024 tokens (sampling). Which
  # subset (Eval or Adv) and which protocol version (versions) is covered by subset_used.
  material_extra:
    - prompt_template_hash
    - sampling

aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each of the six Eval dimensions and each of the six Adv failure modes is reported on its
    own; the paper defines no overall score across them.
  source: src-arxiv-2506-08584-v4
  quote: scores were first averaged by question, then by model

homepage: https://github.com/llm-eval-mental-health/CounselBench
repository: https://github.com/llm-eval-mental-health/CounselBench
dataset_url: https://huggingface.co/datasets/izi-ano/CounselBench-Eval
leaderboard_url: null

versions:
  - version: arxiv-v1
    label: CounselBench as first released (arXiv v1, June 2025)
    version_kind: revision
    released: 2025-06-10
    changes: The first release. CounselBench-Eval as now. CounselBench-Adv's 120 questions were
      answered three times by each of eight LLMs (2,880 replies), GPT-4.1 labelled every reply for
      its targeted failure mode, and one professional checked 96 of them.
    breaking: true
    superseded_by: arxiv-v4
    frozen: true
    sources:
      - src-arxiv-2506-08584-v1
  - version: arxiv-v4
    label: The ICLR 2026 version (arXiv v4, May 2026)
    version_kind: revision
    released: 2026-05-14
    changes: CounselBench-Adv re-scored on the same 120 questions. One reply from each of nine LLMs
      (1,080) is labelled by a mental-health professional, and GPT-4.1 and seven other models appear
      only as judges measured against those labels; the labels were released on Hugging Face on
      2026-04-22. Adv scores are not comparable with v1's. CounselBench-Eval is unchanged.
    breaking: true
    supersedes_version: arxiv-v1
    frozen: true
    sources:
      - src-arxiv-2506-08584-v4
      - src-hf-api-counselbench-adv-human-annotation

subsets:
  - id: counselbench#eval
    label: CounselBench-Eval
    items: 100
    scored_separately: true
    evidence:
      - source: src-arxiv-2506-08584-v4
        quote: From each topic, we selected five questions with the highest response upvotes,
          resulting in 100 questions in total.
      - source: src-arxiv-2506-08584-v4
        quote: Each pair was independently evaluated by five different professionals, supporting
          inter-rater reliability and reducing individual bias.
    notes: 100 CounselChat questions over 20 topics, each answered by three LLMs and the top-voted
      therapist, rated blind by five professionals on six dimensions (2,000 evaluations). Mean
      Krippendorff's alpha per dimension is 0.72-0.83.
  - id: counselbench#adv
    label: CounselBench-Adv
    items: 120
    scored_separately: true
    evidence:
      - source: src-arxiv-2506-08584-v4
        quote: Each clinician authored 12 adversarial questions (2 per issue × 6 issues), resulting
          in a total of 120 questions.
      - source: src-arxiv-2506-08584-v4
        quote: Higher values reflect greater model vulnerability to the targeted issue.
    notes: 120 questions written by ten Eval raters, 20 for each of six failure modes drawn from
      Eval (medication, therapy techniques, symptom speculation, judgmental, apathetic, unsupported
      assumptions). Scored as the fraction of a model's replies showing the targeted failure; lower
      is better. Its scoring changed between paper versions (versions).


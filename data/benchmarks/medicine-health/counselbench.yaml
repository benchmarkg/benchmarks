    - src-hf-api-counselbench-adv
    - src-hf-api-counselbench-adv-human-annotation
    - src-arxiv-2607-24754-v1
  sources_note: >
    The paper's v4 PDF and v1 PDF (DOIs, not archived) read as text, with windows that keep the authors'
    contact line and the reprinted forum questions out; its abstract page for the submission history and
    licence; the README pinned at a33c4e5; Hugging Face's API records of the three datasets (none gated,
    no terms accepted, no data file downloaded); and CARE-MH's v1 PDF (a DOI) as evidence of current use.
    GitHub's API (licence, push date, contents, commits) and Semantic Scholar's citation list were read
    but are not quoted Sources. v2 (October 2025) and v3 (March 2026) of the paper were not read.
  confidence: medium
  review_checks:
    - check: The mental-health leaf has no inclusion or exclusion test and no examples in 0.9.0, so
        the placement rests on its one-line definition. medical-safety was weighed as primary, since
        the medical-advice and toxicity dimensions and all of Adv measure unsafe advice; it is
        secondary because the paper's claim is clinically grounded quality and safety of
        mental-health QA, with empathy and specificity as much the subject. CounselBench may suit
        the leaf as its first example.
      field: domain
      source: src-arxiv-2506-08584-v4
      quote: Our evaluation protocol is co-designed with clinical psychologists
    - check: Versions. The arxiv-v1 and arxiv-v4 rows are this entry's labels; the maintainers name
        no versions. Adv's items are the same 120 in both, but its scorer changed from GPT-4.1 to
        experts and its models from eight (three samples each) to nine (one each), so the rows are
        revisions marked breaking. Which of v2 (2025-10-01) or v3 (2026-03-04) first made the change
        was not read; v3's abstract is reported elsewhere to give the v4 numbers.

# data/benchmarks/medicine-health/airogs.yaml
#
# P3-S6-T06, Grand Challenge subset, challenge 5 of 8. Filled from the challenge paper (arXiv 2302.01738, v2 PDF; IEEE
# Transactions on Medical Imaging), read in windows that keep the author list and affiliations out; the challenge's home
# page on airogs.grand-challenge.org, scripts and styles stripped, which lists organisers and the final leaderboard's
# team members by name and is therefore withheld from archiving; and the abstract page of a 2026 paper that validates
# on a derived version of the data (arXiv 2611.13513). Grand Challenge's API, which its robots.txt disallows, and the
# leaderboards were not read. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.

id: airogs
name: AIROGS
aliases:
  - Artificial Intelligence for RObust Glaucoma Screening
  - AIROGS challenge
tagline: Glaucoma referral from fundus photographs, with ungradable images in the test set, ranked
  on four metrics.
description: >
  A glaucoma screening challenge held with ISBI 2022 on Grand Challenge. Systems receive colour fundus
  photographs from a diabetic retinopathy screening programme (the Rotterdam EyePACS AIROGS data set,
  112,732 images from 60,071 subjects at 500 sites) and must output a likelihood and a decision for referable
  glaucoma, a decision on whether the image is ungradable, and a scalar that rises with the likelihood
  of ungradability. The training set (101,442 images) holds only gradable images and is on Zenodo under
  CC BY-NC-ND; the test set (11,290 images) also holds ungradable ones and was never released, so algorithms
  run as containers on the platform. Screening is scored by partial AUROC in the 90-100% specificity range
  and sensitivity at 95% specificity, robustness by Cohen's kappa and AUROC for ungradability, and the
  final ranking is the mean of a team's four ranks. External fundus training data were not allowed. After
  the prizes the phases reopened for post-challenge submissions indefinitely, and a follow-up challenge
  (JustRAIGS) has started.
self_description:
  source: src-arxiv-2302-01738-v2
  quote: This challenge includes a large dataset of around 113,000 images from about 60,000 patients
    and 500 different screening centers
paper:
  title: 'AIROGS: Artificial Intelligence for RObust Glaucoma Screening Challenge'
  arxiv: '2302.01738'
  version_read: v2
  source: src-arxiv-2302-01738-v2
released: null
released_note: The home page dates the training data's release to 1 December 2021 in a passage the
  extract does not keep; no quoted source gives the date.
release_venue: IEEE International Symposium on Biomedical Imaging (ISBI) 2022

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-imaging-diagnostic
  secondary:
    - vision/classification
domain_basis:
  reason: Systems decide from a fundus photograph whether an eye should be referred for glaucoma and
    whether the image is gradable, scored against graders' labels, which the leaf's inclusion test
    takes whatever the metric. The image-level labelling behind it is recorded as the secondary.
  source: src-arxiv-2302-01738-v2
  quote: Screening performance was evaluated using the standardized partial area under the receiver
    operating characteristic curve
domain_considered_and_rejected:
  - term: vision/medical-imaging-cv
    reason: The claim is a clinical screening task against a clinical reference, not a vision method
      tested on medical images.

capability:
  - perception
  - calibration-uncertainty
capability_basis:
  perception:
    reason: The input is a single fundus photograph, and every output is read from it.
    source: src-arxiv-2302-01738-v2
    quote: The Rotterdam EyePACS AIROGS dataset contains 112,732 CFPs from 60,071 subjects and 500
      different sites
  calibration-uncertainty:
    reason: One of the four scored outputs is a scalar the system emits that rises with the
      likelihood that an image is ungradable (an entropy or an ensemble variance, for instance), and
      the ungradability AUROC is computed from it.
    source: src-arxiv-2302-01738-v2
    quote: we calculated the area under the receiver operator characteristic curve using the human
      reference for ungradability as the true labels
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The ungradable test images are a class absent from training, but they are scored as a
      detection target of their own (kappa and AUROC for ungradability), not as shifted inputs on
      which the screening task is scored as a condition.
    source: src-arxiv-2302-01738-v2
    quote: agreement with the human reference on ungradability using Cohen

evaluation_method:
  - classification-metric
  - entrant-relative-ranking
evaluation_method_basis:
  reason: The four metrics are general statistics of binary decisions and scores (partial AUROC,
    sensitivity at a specificity, kappa, AUROC); the final score is the mean of a team's ranks on
    them, so it moves when the field changes.
  source: src-arxiv-2302-01738-v2
  quote: was then calculated as the mean of those ranking
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The ranking combines four metrics, but all four are classification metrics, and they are
      combined as ranks, which entrant-relative-ranking records.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are fundus-image classifiers trained on the challenge's own data, for a
    screening task ophthalmology defines, which task-specific-supervised-model's exclusion test
    sends here.
  source: src-arxiv-2302-01738-v2
  quote: teams were not permitted to use additional fundus image training data
as_used:
  - protocol: A derived, smaller version of the data (EyePACS-AIROGS-light-V2), used with another
      fundus data set to validate a glaucoma classifier's uncertainty estimates; nothing is
      submitted to the challenge and its four metrics are not computed.
    split: EyePACS-AIROGS-light-V2
    source: src-arxiv-2611-13513
    quote: Using the EyePACS-AIROGS-light-V2 and RIM-ONE-DL datasets for validation
    note: arXiv 2611.13513 (November 2026). Who built the light version, and from which split, was
      not read.

lifecycle: active
lifecycle_basis:
  reason: The challenge's phases are open again indefinitely, and a November 2026 paper validates on
    a version of its data (as_used).
  source: src-gc-airogs-home
  quote: The AIROGS challenge is again open for submissions indefinitely!
activity: leaderboard-live-no-round
activity_basis:
  reason: The prizes were awarded in 2022 and the phases reopened for post-challenge submissions,
    which appear on the leaderboards; no new round is announced, and a separate follow-up challenge
    has started.
  source: src-gc-airogs-home
  quote: The AIROGS challenge is again open for submissions indefinitely!

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The highest-scoring AIROGS team's algorithm, one of the 14 teams' solutions the paper
      evaluates
    source: src-arxiv-2302-01738-v2
    observed_on: 2026-11-25
    quote: We evaluated solutions from 14 teams in this paper, and found that the best teams
      performed similarly to a set of 20 expert ophthalmologists and optometrists.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test images and labels are private, so only the platform can run and score an
    algorithm on them.
  source: src-arxiv-2302-01738-v2
  quote: The test set was and still is closed, meaning the image data and the labels are private and
    cannot be downloaded.

task:
  exists: true
  input:
    - one colour fundus photograph, gradable or ungradable
    - for training, 101,442 gradable photographs labelled referable or non-referable glaucoma
  output: A referable-glaucoma likelihood and decision, an ungradability decision, and a scalar that
    rises with the likelihood of ungradability, produced by a container on the platform.
  scoring: Screening by standardised partial AUROC (90-100% specificity) and sensitivity at 95%
    specificity; robustness by Cohen's kappa and AUROC for ungradability against the graders. Teams
    are ranked on each of the four, and the final score is the mean of the four ranks (lower is
    better).
  tests_hidden_from_system: true
  source: src-arxiv-2302-01738-v2
  quote: was then calculated as the mean of those ranking

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The training images and labels are on Zenodo under CC BY-NC-ND; the test images and
    labels have never been released, and algorithms are executed on the platform. Joining the
    challenge on Grand Challenge is the route to submit.
  access_basis:
    reason: Neither the test images nor their labels leave the organisers; submissions are
      containers run on the platform.
    source: src-arxiv-2302-01738-v2
    quote: The test set was and still is closed, meaning the image data and the labels are private
      and cannot be downloaded.
  refresh: static
  refresh_note: One test set of 11,290 images since 2022; the reopened phases score the same set,
    and no source read announces a change to it.
  data_provenance:
    - real-world-instrument
  data_provenance_note: Photographs taken in a diabetic retinopathy screening programme; the
    graders' selection and labelling are described in a passage the extract does not keep, so
    expert-authored is not recorded (review_checks).
  data_provenance_source: src-arxiv-2302-01738-v2
  data_provenance_quote: The images were originally acquired for a diabetic retinopathy screening
  contamination_risk: low
  contamination_risk_note: The test images, not only their labels, are private and run on the
    platform, so a system cannot have seen them; the training set is public. Derived public versions
    of the data exist (as_used), whose relation to the test set was not read.
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_basis:
    reason: The paper compares the best teams with a set of 20 expert ophthalmologists and
      optometrists on screening; whether the anchor is the experts' average or their spread was not
      read.
    source: src-arxiv-2302-01738-v2
    quote: We evaluated solutions from 14 teams in this paper, and found that the best teams
      performed similarly to a set of 20 expert ophthalmologists and optometrists.
  dataset_licence: CC BY-NC-ND (version not stated in the passage read)
  dataset_licence_source: src-arxiv-2302-01738-v2
  dataset_licence_quote: the training set was released and has since been available for download
    under the CC BY-NC-ND licence on Zenodo
  size:
    - count: 112732
      unit: colour fundus photographs (60,071 subjects, 500 sites)
      subset: complete data set
      source: src-arxiv-2302-01738-v2
      quote: The Rotterdam EyePACS AIROGS dataset contains 112,732 CFPs from 60,071 subjects and 500
        different sites
    - count: 11290
      unit: colour fundus photographs
      subset: test
      source: src-arxiv-2302-01738-v2
      quote: We split the data into a training set of 101,442 CFPs and a test set of 11,290 CFPs
    - count: 101442
      unit: colour fundus photographs
      subset: training
      source: src-arxiv-2302-01738-v2
      quote: We split the data into a training set of 101,442 CFPs and a test set of 11,290 CFPs
  submission_limit:
    max_submissions: 1
    period_days: 0
    per: team, in the Final Test Phase on the whole test set, whose metrics decided the ranking
    source: src-arxiv-2302-01738-v2
  submission_limit_note: Preliminary Test Phase 2, on 10% of the test set, took three submissions
    per team. Since the phases reopened the limit has changed; the home page says the new maximum
    shows only behind the submit button, which needs an account (review_checks).
  submission_limit_source: src-arxiv-2302-01738-v2
  submission_limit_quote: The Final Test Phase opened simultaneously with Preliminary Test Phase 2,
    but algorithms were tested on 100% of the test data and only one submission per team was
    allowed.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The AIROGS organisers, from the Rotterdam Eye Hospital's Rotterdam Ophthalmic
    Institute, Radboudumc's Diagnostic Image Analysis Group, the University of Amsterdam and
    Amsterdam UMC, and Project Orbis International
  maintainer_basis:
    reason: The home page lists the organisers with these affiliations. The list names people, so it
      is not quoted and the page is withheld from archiving.
    source: src-gc-airogs-home
  maintainer_type: consortium
  maintainer_type_note: Several hospitals, universities and a non-profit; academic-lab was
    considered.
  submission_process:
    - containerized-algorithm-submission
    - held-out-server
  submission_process_note: Teams submit algorithm containers, which the platform runs on the private
    test images and scores; the final ranking came from the one Final Test Phase submission.
  submission_process_source: src-arxiv-2302-01738-v2
  submission_process_quote: were executed on the challenge platform using an NVIDIA T4 GPU
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2302-01738-v2
      quote: The test set was and still is closed, meaning the image data and the labels are private
        and cannot be downloaded.
  independence_flags_note: The organisers hold the test set and every official score comes from
    their platform. The home page names a cloud sponsor, and whether organiser groups entered was
    not read (review_checks).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The official score needs the private test images and labels.
    source: src-arxiv-2302-01738-v2
    quote: The test set was and still is closed, meaning the image data and the labels are private
      and cannot be downloaded.
  reproducibility_blockers:
    - private-test-set
  harness_availability: null
  harness_availability_note: The paper points to the evaluation code on GitHub in a passage the
    extract does not keep, and the repository was not read (review_checks).
  code_licence: null
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which phase (Preliminary Test Phase 2 on 10% of the test set, the Final Test
  # Phase on all of it, or a post-challenge submission) and what the entrant was trained on (no external
  # fundus data during the challenge).
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The final ranking is the mean of each team's ranks on the four metrics, so no single
    metric is the headline and the aggregate depends on the field.
  source: src-arxiv-2302-01738-v2
  quote: was then calculated as the mean of those ranking

liveness:
  last_checked: 2026-11-25

homepage: https://airogs.grand-challenge.org/
repository: null
dataset_url: null
dataset_url_note: The paper gives a Zenodo record for the training set in a passage the extract does
  not keep; it was not opened.
leaderboard_url: null
leaderboard_url_note: The three phases' leaderboards were not read; they show participants' user
  names.

metrics:
  - airogs-screening-pauc
  - airogs-screening-sensitivity
  - airogs-ungradability-kappa
  - airogs-ungradability-auroc
metrics_note: P3-S6-T06. The challenge's own four metrics, two for screening and two for robustness;
  the ranking is the mean of the four ranks, so none is shown as the headline and none is a shared
  accuracy.

tags:
  - glaucoma
  - fundus-photography
  - screening
  - ungradable-images
  - challenge

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P3-S6-T06)
  added_on: 2026-11-25
  last_verified: 2026-11-25
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2302-01738-v2
    - src-gc-airogs-home
    - src-arxiv-2611-13513
  confidence: medium
  review_checks:
    - check: submission_limit records the Final Test Phase's one per team. Since the phases reopened
        the limit is different, and the home page shows it only behind the submit button, which
        needs an account; the current limit is unrecorded.
      field: data.submission_limit
      source: src-gc-airogs-home
      quote: To view the new maximum number of submissions per team, click the
    - check: lifecycle active rests on the reopened phases and on a 2026 paper's use of a derived
        light version of the data, not the challenge's own test set. If derived versions do not
        count, the reopened board alone does not show use.
      field: lifecycle
      source: src-arxiv-2611-13513
      quote: Using the EyePACS-AIROGS-light-V2 and RIM-ONE-DL datasets for validation
    - check: The home page says a follow-up challenge (JustRAIGS) has started. Whether it is a new
        edition of AIROGS (a version here) or a separate benchmark (lineage) was not read.
      field: lineage
      source: src-gc-airogs-home
      quote: A follow-up challenge has started
    - check: dataset_licence gives CC BY-NC-ND without a version because the paper does not state
        one; the Zenodo record would.
      field: data.dataset_licence
    - check: calibration-uncertainty rests on the ungradability AUROC being computed from a scalar
        the system emits for that purpose; confirm the term's inclusion test reads an uncertainty
        score that is ranked by AUROC, not calibrated, as in scope.
      field: capability
    - check: The home page says the challenge is sponsored by AWS, in a passage beside the
        leaderboard's names that the extract leaves out; whether that is
        prize-sponsored-by-industry, and whether organiser groups entered, was not assessed from a
        quotable source.
      field: governance.independence_flags
    - check: maintainer is taken from the home page's organiser list, which is not quoted because it
        names people. Confirm the affiliations from the paper's front matter.
      field: governance.maintainer
    - check: data_provenance lacks expert-authored, and ceiling_anchor_type is expert-average, both
        resting on passages about the graders and the reader study that were only partly kept.
      field: data.ceiling_anchor_type
  personal_data_excluded:
    - source: src-arxiv-2302-01738-v2
      what: The author list, affiliations and the corresponding author's contact line.
    - source: src-gc-airogs-home
      what: The organisers' names and the final leaderboard's team members, and an organiser's
        e-mail address in the mailto links.
    - source: src-arxiv-2611-13513
      what: The author list and the submitter line.

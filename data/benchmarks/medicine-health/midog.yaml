# data/benchmarks/medicine-health/midog.yaml
#
# P3-S6-T06, Grand Challenge subset, challenge 8 of 8. Filled from the MIDOG 2021 challenge paper (arXiv 2204.03742, v1
# PDF; Medical Image Analysis 84, 102699, 2023), read in windows that keep the author list and affiliations out; the
# MIDOG 2021 home page on midog2021.grand-challenge.org, scripts and styles stripped, withheld from archiving because it
# lists the organisers by name; and the abstract page of the MIDOG 2025 challenge report (arXiv 2606.07368), the
# series' latest edition. MIDOG 2022, which the 2021 page names as its successor, was not read. The leaderboards,
# which show participants' user names, and Grand Challenge's API, which its robots.txt disallows, were not read. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: midog
name: MIDOG
aliases:
  - Mitosis Domain Generalization Challenge
  - MIDOG 2021
  - MIDOG 2025
tagline: Mitotic figure detection across scanners and tumour types, scored by F1 pooled over the
  test slides.
description: >
  The MItosis DOmain Generalization challenge series, held with MICCAI on Grand Challenge. Systems detect
  mitotic figures, cells in division whose density grades tumours, in H&E histopathology regions. MIDOG
  2021 trained on 200 breast cancer cases from four scanners, three of them labelled, and tested on 100
  more from four scanners, two of them unseen in training, to measure robustness to the scanner-induced
  domain shift. Submissions were algorithm containers run on the platform, with one a day on a 20-case
  preliminary set and one in the final test phase; a detection counts when it lies within a fixed distance
  of a reference mitotic figure, and the score is F1 over the true positives, false positives and false
  negatives pooled across all test slides. 17 teams reached the final test set, and the best F1 was 0.748.
  Members of the organisers' institutes could not take part. A 2022 edition followed, and MIDOG 2025 widened
  the test set to 365 cases of 12 human, canine and feline tumour types and added a track for classifying
  atypical mitotic figures.
self_description:
  source: src-arxiv-2606-07368
  quote: The MItosis DOmain Generalization (MIDOG) 2025 challenge was designed to evaluate
    algorithmic performance across unprecedented biological and contextual diversity.
paper:
  title: Mitosis domain generalization in histopathology images -- The MIDOG challenge
  arxiv: '2204.03742'
  doi: 10.1016/j.media.2022.102699
  version_read: v1
  source: src-arxiv-2204-03742-v1
released: null
released_note: The 2021 home page gives day-and-month dates without a year in a passage the extract
  does not keep; no quoted source dates the first release.
release_venue: MICCAI 2021 (MIDOG 2021); MICCAI 2025 (MIDOG 2025)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-imaging-diagnostic
  secondary:
    - vision/detection
domain_basis:
  reason: Systems detect mitotic figures, a histopathological finding, scored as locations against
    the reference annotations, which the leaf's inclusion test takes (findings scored as locations,
    not masks). The object detection behind it is recorded as the secondary.
  source: src-arxiv-2204-03742-v1
  quote: Euclidean distance between a mitotic
domain_considered_and_rejected:
  - term: vision/medical-imaging-cv
    reason: The series' claim is scanner and tumour robustness, a method property, but the targets
      are clinically defined findings against a pathology reference, which that term's exclusion
      test sends to medicine-health.
  - term: medicine-health/medical-imaging-segmentation
    reason: No mask is scored; detections are matched to reference points by distance.

capability:
  - perception
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: The input is a histopathology image region, and the score depends on which mitotic
      figures are found in it.
    source: src-gc-midog2021-home
    quote: Evaluation will be done on four scanners (two new, two are part of the training set) with
      the F1 score as main metric.
  distribution-shift-generalization:
    reason: MIDOG 2021's test set holds two scanners absent from training, chosen to measure the
      domain shift, with the task and labels unchanged; MIDOG 2025 widens the shift to new tumour
      types and species.
    source: src-arxiv-2204-03742-v1
    quote: As a test set, an additional 100 cases split across four scanning systems, including two
      previously unseen scanners, were given.
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The task and its label set stay the same across scanners and tumour types; only the
      inputs move, which transfer-learning's exclusion test sends to
      distribution-shift-generalization.

evaluation_method:
  - classification-metric
evaluation_method_basis:
  reason: Detections are matched to reference figures and scored by F1, a general-purpose statistic
    that domain-metric's exclusion test sends here.
  source: src-arxiv-2204-03742-v1
  quote: We calculated the F1 score over all N processed slides as
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: The matching distance is set by mitotic figure size, but the reported number is F1.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are mitosis detectors trained on the challenge's labelled cases, for a task
    pathology defines, which task-specific-supervised-model's exclusion test sends here.
  source: src-arxiv-2204-03742-v1
  quote: All participating teams submitted their fully automatic algorithm containers on the
    grand-challenge.org website.

lifecycle: active
lifecycle_basis:
  reason: The series ran its 2025 edition, whose report appeared in June 2026 with 18 teams in the
    detection track.
  source: src-arxiv-2606-07368
  quote: There were 18 teams submitting to the detection track, with F1 scores ranging up to 0.740.
activity: unknown
activity_note: MIDOG 2021's phases are closed and the 2025 edition has reported; whether another
  edition is planned, or the 2025 board takes post-challenge submissions, was not read.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The winning MIDOG 2021 algorithm, a mitotic figure detector submitted as a container
    source: src-arxiv-2204-03742-v1
    observed_on: 2026-11-25
    quote: the winning algorithm yielding an F1 score of 0.748
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: Algorithms run as containers on the platform against test cases the teams never receive,
    so only the organisers can score them.
  source: src-arxiv-2204-03742-v1
  quote: All participating teams submitted their fully automatic algorithm containers on the
    grand-challenge.org website.

task:
  exists: true
  input:
    - an H&E-stained histopathology image region (MIDOG 2021 breast cancer; MIDOG 2025 also other
      human, canine and feline tumour types)
    - for training, the challenge's cases with mitotic figure annotations (in 2021, three of four
      scanners labelled)
  output: The coordinates of every detected mitotic figure, from a container run on the platform.
  scoring: A detection is a true positive when it lies within a fixed distance of a reference
    mitotic figure; F1 is computed from the true positives, false positives and false negatives
    summed over all test slides. MIDOG 2025 adds a track scored by balanced accuracy on atypical
    mitotic figures.
  metric: midog-2021-f1
  metric_range:
    - 0.0
    - 1.0
  tests_hidden_from_system: true
  source: src-arxiv-2204-03742-v1
  quote: We calculated the F1 score over all N processed slides as

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: MIDOG 2021's training cases were downloadable after registering on the challenge
    website (gated-registration for the training side); the test cases were never given to teams,
    whose containers ran on the platform. The 2025 edition's access terms were not read.
  access_basis:
    reason: Teams submitted containers that the platform ran on the test cases, so the test images
      and labels never reached them.
    source: src-arxiv-2204-03742-v1
    quote: All participating teams submitted their fully automatic algorithm containers on the
      grand-challenge.org website.
  refresh: periodic-recompetition
  refresh_note: Each edition brings a new test set (2021 breast cancer from four scanners; 2025, 365
    cases of 12 tumour types).
  refresh_source: src-arxiv-2606-07368
  refresh_quote: We curated a test dataset of 365 cases, encompassing 12 distinct human, canine and
    feline tumor types
  data_provenance:
    - real-world-instrument
  data_provenance_note: Clinical breast cancer cases scanned on several whole-slide scanners; how
    the reference annotations were made is in passages the extract does not keep, so expert-authored
    is not recorded.
  data_provenance_source: src-arxiv-2204-03742-v1
  data_provenance_quote: The challenge used a training set of 200 cases, split across four scanning
    systems.
  contamination_risk: low
  contamination_risk_note: The test cases run only on the platform and were not released in the
    passages read; later public mitosis data sets from the same group were not checked against them.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: F1 is bounded at 1; the paper's comparison of the winners with expert
    level was not among the passages kept.
  dataset_licence: null
  dataset_licence_note: Not stated in the passages read.
  size:
    - count: 100
      unit: test cases from four scanners, two unseen in training
      subset: MIDOG 2021 test
      source: src-arxiv-2204-03742-v1
      quote: As a test set, an additional 100 cases split across four scanning systems, including
        two previously unseen scanners, were given.
    - count: 200
      unit: training cases from four scanners
      subset: MIDOG 2021 training
      source: src-arxiv-2204-03742-v1
      quote: The challenge used a training set of 200 cases, split across four scanning systems.
    - count: 365
      unit: test cases of 12 human, canine and feline tumour types
      subset: MIDOG 2025 test
      source: src-arxiv-2606-07368
      quote: We curated a test dataset of 365 cases, encompassing 12 distinct human, canine and
        feline tumor types
  submission_limit:
    max_submissions: 1
    period_days: 0
    per: team, in the MIDOG 2021 final test phase
    source: src-arxiv-2204-03742-v1
  submission_limit_note: The 15-day preliminary test phase took one submission a day. The 2022 and
    2025 editions' limits were not read.
  submission_limit_source: src-arxiv-2204-03742-v1
  submission_limit_quote: the participants were able to only submit once

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The MIDOG organisers, a group of pathology and image-analysis teams in Germany,
    Austria and the Netherlands (2021), with institutes changing by edition
  maintainer_basis:
    reason: The 2021 home page lists the organisers with their institutions; the list names people,
      so it is not quoted and the page is withheld from archiving.
    source: src-gc-midog2021-home
  maintainer_type: consortium
  submission_process:
    - containerized-algorithm-submission
    - held-out-server
  submission_process_note: Teams submit containers run on the platform; in 2021 a short paper about
    the method was also asked for, and only a team's own work qualified.
  submission_process_source: src-gc-midog2021-home
  submission_process_quote: Only your own work will qualify as a submission.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2204-03742-v1
      quote: All participating teams submitted their fully automatic algorithm containers on the
        grand-challenge.org website.
  independence_flags_note: The organisers hold the test cases and every official score comes from
    the platform. In 2021 members of the organisers' institutes were barred from taking part, so
    maintainer-competes-on-own-benchmark does not apply to that edition; 2025's rule was not read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The official score needs the test cases, which only the platform holds.
    source: src-arxiv-2204-03742-v1
    quote: All participating teams submitted their fully automatic algorithm containers on the
      grand-challenge.org website.
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness_availability_basis:
    reason: The organisers published a reference container template for MIDOG 2021 on GitHub, which
      shows how to take part; an evaluation container is linked beside it in the paper but was not
      read.
    source: src-gc-midog2021-home
  code_licence: null
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition (2021 breast cancer across scanners; 2025 across tumour types and
  # species, with two tracks) and which test set (preliminary or final).
  material_extra:
    - subset_used

aggregation_policy: official-aggregate
headline_metric: midog-2021-f1
headline_metric_note: MIDOG 2021's F1. The 2025 detection track also ranks by F1, but its matching
  rule was not read, so it is not asserted to be the same metric.

liveness:
  last_checked: 2026-11-25

homepage: https://midog2021.grand-challenge.org/
homepage_note: The 2021 edition's page; the series has one page per edition, and the 2025 one was
  not read.
repository: null
dataset_url: null
leaderboard_url: null
leaderboard_url_note: The leaderboards were not read; they show participants' user names.

versions:
  - version: '2021'
    label: MIDOG 2021
    version_kind: edition
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2204-03742-v1
      - src-gc-midog2021-home
  - version: '2025'
    label: MIDOG 2025
    version_kind: edition
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2606-07368

metrics:
  - midog-2021-f1
metrics_note: P3-S6-T06. MIDOG 2021's own F1, pooled over slides with a distance-based match, rather
  than a shared accuracy or a mean of per-slide F1s. The 2025 tracks' metrics have no record yet.

tags:
  - computational-pathology
  - mitosis
  - histopathology
  - domain-generalisation
  - challenge

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P3-S6-T06)
  added_on: 2026-11-25
  last_verified: 2026-11-25
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2204-03742-v1
    - src-gc-midog2021-home
    - src-arxiv-2606-07368
  confidence: medium
  review_checks:
    - check: MIDOG 2022, named on the 2021 page as the successor, was not read and has no version
        here; the 2025 edition is recorded from its report's abstract only. Read both editions'
        pages and add 2022 as a version from its own sources, checking whether its task and metric
        match 2021's.
      field: versions
      source: src-gc-midog2021-home
      quote: successor, MIDOG 2022, here is a link
    - check: submission_limit records MIDOG 2021's final test phase (one per team); the preliminary
        phase took one a day. The 2022 and 2025 limits were not read.
      field: data.submission_limit
      source: src-arxiv-2204-03742-v1
      quote: the number of submissions was limited to one per day
    - check: distribution-shift-generalization is tagged on the two unseen scanners; the ranked F1
        pools all four test scanners, and the per-scanner scores are in the paper's analysis, which
        the extract does not keep. Confirm the inclusion test's condition-of-its-own reading.
      field: capability
    - check: activity is unknown because neither a next edition nor post-challenge submissions to
        the 2025 board were read.
      field: activity
    - check: The training data's licence and download terms (registration on the challenge website)
        were not read beyond the home page's instruction; the 2025 data's terms neither.
      field: data.dataset_licence
      source: src-gc-midog2021-home
      quote: Register on the challenge website and download the data set.
    - check: maintainer is summarised from the 2021 organiser list, which names people and is not
        quoted.
      field: governance.maintainer
  personal_data_excluded:
    - source: src-arxiv-2204-03742-v1
      what: The author list, affiliations and the reference list's author names.
    - source: src-gc-midog2021-home
      what: The organisers' names with their institutions, and an organiser's e-mail address in the
        mailto links.
    - source: src-arxiv-2606-07368
      what: The author list and the submitter line.

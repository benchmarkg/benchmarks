          "medbullets", "med_qa", "med_mcqa", "medalign", "shc_ptbm_med", "shc_sei_med" ]'
      - source: src-arxiv-2505-23802-v2
        quote: Clinical Decision Support is the most represented category with ten benchmarks
    notes: Ten benchmarks in the paper; twelve in v4.0.0, with MedQA and MedMCQA.
  - id: medhelm#medcalc-bench
    label: MedCalc-Bench
    parent: medhelm#clinical-decision-support

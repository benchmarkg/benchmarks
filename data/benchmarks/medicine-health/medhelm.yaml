      - source: src-medhelm-leaderboard-v4-schema
        quote: '"name": "med_qa", "display_name": "MedQA"'
    notes: Not among the paper's 35; in v4.0.0. Exact match. MedQA has its own entry, medqa.
  - id: medhelm#medmcqa
    label: MedMCQA
    parent: medhelm#clinical-decision-support
    evidence:
      - source: src-medhelm-leaderboard-v4-schema
        quote: '"name": "med_mcqa", "display_name": "MedMCQA"'

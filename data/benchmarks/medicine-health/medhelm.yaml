# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2505-23802-v2
    - src-arxiv-2505-23802
    - src-medhelm-docs
    - src-helm-maintenance-mode
    - src-medhelm-leaderboard
    - src-medhelm-leaderboard-v4-summary
    - src-medhelm-leaderboard-v4-schema
    - src-arxiv-2601-03423-v3
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, with windows that keep the corresponding
    author's contact line out; its abstract page for the date; the MedHELM documentation page and HELM's
    Maintenance Mode Policy, with scripts and styles stripped; the leaderboard's config script and release
    v4.0.0's summary.json and schema.json from the crfm-helm-public bucket (no score was read); and the
    v3 PDF of a CHIL 2026 paper as evidence of use.
  confidence: medium
  review_checks:
    - check: Identity. The entry is MedHELM as a whole, the taxonomy, the suite and the leaderboard.
        Scenarios that are benchmarks in their own right (MedQA, catalogued as medqa; PubMedQA,
        EHRSHOT, ACI-Bench and others) are subsets here and separate entries where they exist. The
        schema has no lineage field for a suite's constituents, so the relation lives only in the
        subsets. The paper names MedQA among its existing benchmarks, but its Table C3 of 35 does
        not list it; MedQA is a scenario from v3.0.0.
      field: subsets
      source: src-arxiv-2505-23802-v2
      quote: We incorporated existing benchmarks from public or gated sources (e.g., MedQA, MIMIC-IV
        Billing Code, ACI-Bench) to ensure broad subcategory coverage.
    - check: The five secondary subdomains are read from the scenarios' descriptions; no source maps
        each scenario to a subcategory. Whether some scenarios (MedQA, EHRSHOT) should carry a
        domain_override, so that the coverage matrix counts them (02 S11 rule 4), was not decided.
      field: domain.secondary
    - check: capability is empty. The sources describe MedHELM by task category and claim no
        capability. context-integration is the closest candidate, since most scenarios supply the
        record the answer depends on, but 02 S11 rule 2 forbids inferring it.
      field: capability
    - check: numeric-tolerance-match (MedCalc-Bench) and execution-tests (EHRSQL) each rest on one
        scenario. v4.0.0's schema describes EHRSQL's main metric as the share of correctly predicted
        answerable questions, not as the execution accuracy the paper names; the judges' snapshot
        identifiers are not given.
      field: evaluation_method
      source: src-medhelm-leaderboard-v4-schema
      quote: Exact match for categories risk, severity and diagnosis. Check if within range for the
        other categories.
    - check: lifecycle mature or active. mature follows ADR-0019 and the term's own MedHELM example,
        but results are still produced with MedHELM's jury outside the frozen leaderboard; the CHIL
        paper's v3 (April 2026, before maintenance mode) is one, by overlapping authors.
      field: lifecycle
      source: src-arxiv-2601-03423-v3
      quote: LLM-J = MedHelm LLM-jury score (average out of 5)
    - check: data.access is private-test-server by the mixed-headline rule. The gated scenarios on
        their own would be credentialed-dua, and the access levels of MedQA and MedMCQA come from no
        source read here.
      field: data.access
      source: src-medhelm-docs
      quote: Gated PhysioNet, Redivis run_entries_medhelm_gated.conf Credentialed users
    - check: released is the paper's first arXiv version. The bucket's v1.0.0 summary is dated
        2025-02-28, which would make the leaderboard older than the paper. v1.0.0 and v3.0.0 are
        described in versions_note from files read but not kept as Sources; add them as Sources if
        the earlier date or those versions should stand.
      field: released
    - check: A published version (listed as Nature Medicine on Stanford profile pages found by a web
        search) was not read and may describe the 37-scenario suite; paper.doi is left empty.
      field: paper
    - check: The access level and curation status in each scenario's notes are transcribed from the
        paper's Table C3, whose PDF text interleaves the table's columns; check them against the
        rendered table.
      field: subsets
    - check: single-evaluator-private-test-set is tagged for the 14 private scenarios. Funding was
        not stated in the v2 paper; Microsoft employs several authors, and Microsoft's Phi-3.5-mini
        was among v1.0.0's six models (not in v4.0.0).
      field: governance.independence_flags
    - check: rating_pool_required is set because the win rate depends on the release's model pool;
        the validator requires it only for preference and tournament methods.
      field: comparability.rating_pool_required

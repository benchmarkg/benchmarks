# data/benchmarks/medicine-health/physionet-challenge.yaml
#
# P1-S6-T04, medicine-health entry 11. Filled from the George B. Moody PhysioNet Challenge site
# (moody-challenge.physionet.org), read as its home page, the challenge pages of the 2019 to 2026 editions,
# the 2025 and 2026 results pages and the 2026 results table; PhysioNet's list of the 2000-2022 Challenges
# (physionet.org/about/challenge/moody-challenge); the 2025 Challenge description paper (Reyna et al.,
# arXiv 2510.02202, read as its v1 PDF and its abstract page); and the README of the 2026 example and
# scoring code (physionetchallenges/python-example-2026, at commit c0bcd78). The 2000-2018 editions are
# recorded from the two lists' titles only. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.

id: physionet-challenge
name: George B. Moody PhysioNet Challenge
aliases:
  - George B. Moody PhysioNet Challenges
  - PhysioNet/Computing in Cardiology Challenge
  - PhysioNet/CinC Challenge
  - PhysioNet Challenge
tagline: 'Annual PhysioNet/Computing in Cardiology challenge since 2000: a new clinical task on physiological
  signals each year.'
description: >
  An annual competition co-hosted by PhysioNet and the Computing in Cardiology conference (CinC) since
  2000, renamed for George B. Moody in 2021; 2026 was its 27th edition. Each year poses a different clinical
  problem on physiological recordings or records: early prediction of sepsis from hourly ICU data (2019),
  diagnoses from 12-lead ECGs (2020) and from reduced-lead ECGs (2021), heart murmurs and clinical outcome
  from phonocardiograms (2022), neurological outcome after cardiac arrest from EEG and ECG (2023), digitisation
  and classification of paper ECG images (2024), Chagas disease from the ECG (2025) and future cognitive
  impairment from overnight polysomnography (2026). The 2000-2018 editions covered sleep apnoea, atrial
  fibrillation, QT and ST measurement, fetal ECG, heart-beat detection, false ICU alarms, ICU mortality
  and heart sounds. In recent editions teams submit open-source code, including training code, in a GitHub
  or GitLab repository; the organisers containerise it, train it on the public training set and score
  it on hidden validation and test sets, at most 15 scored entries per team over an unofficial and an
  official phase and one entry per team on the test set. Each edition defines its own metric, often tailored
  to clinical use: a utility that rewards early sepsis alarms, a weighted accuracy whose weights cardiologists
  set, a referral cost, a true positive rate at a fixed false positive rate or a fixed testing capacity,
  an age-conditioned AUROC. Ranking requires an open-source licence, a CinC abstract and paper and attendance
  at the conference. In 2025, 111 teams made 1,317 submissions and 41 were ranked.
self_description:
  source: src-moody-challenge-home
  quote: For the past 27 years, PhysioNet and Computing in Cardiology have co-hosted a series of
    annual challenges, now called the George B. Moody PhysioNet Challenges, to tackle clinically
    interesting but unsolved questions.
paper:
  title: 'Detection of Chagas Disease from the ECG: The George B. Moody PhysioNet Challenge 2025'
  arxiv: '2510.02202'
  version_read: v1
  source: src-arxiv-2510-02202-v1
released: null
released_note: The first Challenge is the 2000 edition, on sleep apnoea from the ECG, as both lists
  of Challenges give it; neither dates it more closely than the year. The 2025 description paper
  counts 2025 as the 26th Challenge, which agrees.
release_venue: Computing in Cardiology, every year since 2000; recent editions are described in CinC
  proceedings papers and Physiological Measurement focus issues

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/diagnosis-triage
  secondary:
    - medicine-health/ehr-prediction
    - medicine-health/medical-imaging-diagnostic
    - vision/document-understanding
    - audio-speech/audio-event-understanding
  per_edition: true
domain_basis:
  reason: The yearly task changes, so the primary is chosen from what most editions score. From 2016
    on, nearly every edition scores a diagnostic, screening or prognostic call about a patient from
    a physiological recording, against clinical reference labels - heart-sound abnormality (2016),
    atrial fibrillation (2017), cardiac abnormalities from 12-lead and reduced-lead ECGs (2020,
    2021), murmurs and clinical outcome (2022), poor neurological outcome after cardiac arrest
    (2023), ECG classes from images (2024), Chagas disease, framed by the organisers as a triage
    task for scarce serological tests (2025), and future cognitive impairment (2026).
    diagnosis-triage takes a diagnosis or urgency assessment from a presented case; here the case is
    a recording with basic demographics. The secondaries are the union over editions (per_edition) -
    ehr-prediction for sepsis from hourly vital signs and laboratory values (2019; ICU mortality in
    2012 by its title), medical-imaging-diagnostic for classifying ECG images and
    vision/document-understanding for digitising them into waveforms (2024), and
    audio-event-understanding for murmur presence in heart-sound recordings (2022; 2016 by title).
    ehr-prediction and audio-event-understanding were each weighed as primary and kept secondary,
    since each holds one or two editions; the 2019 input is hourly structured record data, every
    other recent edition's a waveform or an image of one. Measurement and detection editions before
    2016 (QT intervals, heart beats, fetal ECG) fit no leaf well (review_checks; a tag gap is
    logged).
  source: src-arxiv-2510-02202-v1
  quote: to frame the machine learning problem as a triage task
domain_considered_and_rejected:
  - term: medicine-health/clinical-task-suites
    reason: Across the years the tasks fall in several medicine-health subdomains, but each edition
      scores one clinical problem (two in 2022 and 2024) and ranks it on its own. No edition reports
      tasks of different subdomains together, and the series claims no breadth within the family.
  - term: biology-genetics/neuroscience-decoding
    reason: The 2023 and 2026 editions score EEG recordings, but the endpoint is a clinical outcome
      (poor neurological recovery, a later cognitive-impairment diagnosis), which biology-genetics'
      exclusion test sends to medicine-health.
    source: src-moody-challenge-2023
    quote: The goal of the 2023 Challenge is to use longitudinal EEG and ECG recordings to predict
      good and poor patient outcomes after cardiac arrest.
  - term: vision/medical-imaging-cv
    reason: The 2024 edition takes images, but its claim is a clinical task, digitising and
      classifying ECGs, scored against the original waveforms and diagnostic classes, not a vision
      method.
capability:
  - perception
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: The inputs are raw physiological signals (ECG, phonocardiogram, EEG, polysomnography;
      images of paper ECGs in 2024), and the score measures what a system recovers from them, a
      diagnosis, an outcome or the waveform itself.
    source: src-moody-challenge-2026
    quote: Each study includes synchronized physiological signals and human and automated
      annotations of sleep stages, arousals, and respiratory and limb movement events.
  distribution-shift-generalization:
    reason: Recent editions hold whole data sources out of training and score them as conditions of
      their own, with the task and labels unchanged. In 2025 the three test sources were never
      posted publicly, each is scored separately and the ranking averages them, and the median score
      fell 64% from the validation source to the ELSA-Brasil test source. In 2026 the validation and
      test sets each come from a site absent from training, in 2023 one hospital's patients are in
      the test set only, and in 2020 the test set holds a geographically distinct institution.
    source: src-arxiv-2510-02202-v1
    quote: The median Challenge score dropped 64% (from 0.279 to 0.100) from the REDS-II data in the
      validation set to the ELSA-Brasil data in the test set.
capability_considered_and_rejected:
  - term: temporal-reasoning
    reason: The 2019 utility function makes the timing of a sepsis alarm decide its score, rewarding
      predictions from 12 hours before to 3 hours after onset, but only that edition scores time.
    source: src-moody-challenge-2019
    quote: For the challenge, we designed a utility function that rewards early predictions and
      penalizes late predictions as well as false alarms.
  - term: probabilistic-forecasting
    reason: The 2026 edition predicts a diagnosis that comes 1 to 6 years after the sleep study, but
      the follow-up already exists in the records and is withheld, which the term's exclusion test
      leaves out.
  - term: calibration-uncertainty
    reason: Recent editions ask for a probability beside the label (2025), but score the ranking it
      induces (the true positive rate among the top 5%), not its calibration.
  - term: scientific-prediction
    reason: The predicted quantities are clinical outcomes and diagnoses, which medicine-health
      holds, not properties of a physical or biological system.

evaluation_method:
  - classification-metric
  - domain-metric
  - statistical-fit
evaluation_method_basis:
  reason: The headline metric changes by edition. Most recent ones are general statistics of a
    confusion matrix or score ranking - the true positive rate at a false positive rate of 0.05 per
    hospital (2023), the macro F-measure (2024 classification), the true positive rate among the top
    5% of a cohort (2025) and an age-conditioned AUROC (2026). Others are clinical metrics the
    organisers defined for one problem, with no meaning outside it, recorded as domain-metric - a
    utility rewarding early sepsis alarms (2019), a weighted accuracy with partial credit set by
    cardiologists (2020, 2021) and a cost of prescreening, expert screening, treatment and missed
    treatment (2022 outcome). The 2024 digitisation task is scored by the signal-to-noise ratio of
    the reconstructed waveform, a fit statistic.
  source: src-moody-challenge-2026
  quote: The team with the highest age-conditioned area under the receiver-operating characteristic
    curve (AUROC) on the hidden test set wins the Challenge.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The 2025 ranking averages one metric over three test sources, and the 2022 and 2024
      tasks are ranked separately; no edition combines sub-scores of different methods into one
      figure.
    source: src-moody-challenge-2025-results
    quote: The official Challenge entries are sorted and ranked by the mean Challenge score across
      the three data sources in the test set
  - term: entrant-relative-ranking
    reason: Teams are ranked by their own test-set score, which does not change when another team
      enters.
  - term: uncertainty-calibration-score
    reason: Probabilities are requested in recent editions but scored only through the rankings and
      labels they produce.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are algorithms trained for a clinically defined task, submitted as code that the
    organisers train on the edition's training set and run on the hidden data; a team whose model
    cannot be reproduced from its training code is not ranked. Clinical tasks such as sepsis
    prediction or Chagas screening are what the term's inclusion test names.
  source: src-arxiv-2510-02202-v1
  quote: We required teams to submit code both for their trained models and for training their
    models
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The entrants are task-trained models, but the tasks are defined by clinical disciplines
      (cardiology, critical care, sleep medicine), which the term's exclusion test sends to
      domain-specialist-model.
  - term: classical-algorithm
    reason: Early editions asked for measurements (QT intervals, heart beats) that hand-built signal
      processing can make, and rule-based entries are not excluded, but since 2020 an entry must
      learn from the training set to be ranked.
    source: src-moody-challenge-2020
    quote: If we cannot reproduce your model from the training code, then you will not be eligible
      for ranking or a prize.

lifecycle: active
lifecycle_basis:
  reason: The 2026 edition ran from February to August 2026, was presented at CinC 2026 in
    September, and its results were released on 28 September 2026.
  source: src-moody-challenge-home
  quote: 'September 28, 2026: We have released the results of the 2026 Challenge.'
activity: between-rounds
activity_basis:
  reason: The 2026 official phase has closed and its results are out; no 2027 Challenge is announced
    on the pages read, although every edition since 2019 opened between late December and
    mid-February.
  source: src-moody-challenge-2026
  quote: 'August 24, 2026: The official phase of the Challenge has concluded.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Biomed-Cardio, the first-ranked team of the 2025 Challenge (Chagas disease from the ECG)
    source: src-arxiv-2510-02202-v1
    observed_on: 2026-11-04
    quote: Rank 1 2 3 Team name Biomed-Cardio [30]
  - system: SIREN, a site-invariant rank ensemble (team NeuroUC3M), first in the 2026 Challenge
    source: src-moody-challenge-2026-results-tsv
    observed_on: 2026-11-04
    quote: 'SIREN: A Site-Invariant Rank Ensemble for Predicting Future Cognitive Impairment from Polysomnography'
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The reference labels differ by edition - Sepsis-3 onset derived from the
  records (2019), diagnoses mapped to SNOMED-CT codes (2020, 2021), murmur grades from an expert
  annotator and clinical outcomes (2022), neurological outcome on the CPC scale (2023), serological
  tests or self-reports for Chagas disease (2025) and later ICD-coded diagnoses in follow-up records
  (2026). All are withheld for the validation and test sets.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The validation and test data, not only their labels, stay with the organisers, who train
    and run each entry themselves; recent editions draw them from sources never posted publicly.
  source: src-moody-challenge-2025
  quote: the validation and test data and labels are privately sequestered to allow for the
    principled assessment of the submitted algorithms

task:
  exists: true
  input:
    - physiological recordings of one patient with basic demographics - 12-lead ECGs (2020, 2021,
      2025), heart-sound recordings from several auscultation sites (2022), continuous EEG and ECG
      after cardiac arrest (2023), an overnight polysomnogram (2026)
    - hourly vital signs, laboratory values and demographics over an ICU stay (2019)
    - images of paper ECGs, synthetic or photographed and scanned (2024)
  output: A label with a probability or score per patient or recording (a diagnosis, a screening
    flag, an outcome), a prediction for every hour of an ICU stay (2019), or a reconstructed ECG
    waveform (2024 digitisation).
  scoring: Each edition defines its metric, computed by the organisers' scoring code on the hidden
    test set after they train each team's chosen entry on the public training set - an
    age-conditioned AUROC (2026), the true positive rate among the 5% of a cohort ranked most likely
    positive, averaged over three test sources (2025), signal-to-noise ratio and macro F-measure
    (2024), the true positive rate at a false positive rate of 0.05 (2023), weighted accuracy and a
    referral cost (2022), a weighted diagnostic accuracy (2020, 2021) and a clinical utility (2019).
  tests_hidden_from_system: true
  source: src-moody-challenge-2026
  quote: After the Challenge, we will train one entry from each team on the training set and
    evaluate it on the test set.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: Each edition's training set is public (on PhysioNet for 2022, on Kaggle and the Brain
    Data Science Platform for 2026); the validation and test sets are held by the organisers, who
    run the entries on them. Some hidden sets are released after the edition (2022), others come
    from private sources that are not (2025). No data were downloaded and no access terms were
    accepted for this entry.
  access_basis:
    reason: The rankings are computed on validation and test sets whose inputs, not only labels,
      stay with the organisers, who train and run each team's code on them.
    source: src-arxiv-2510-02202-v1
    quote: The data sources in the validation and test sets have never been posted publicly,
      allowing us to assess common machine learning problems such as overfitting.
  access_by_phase:
    during_edition: Training set public; validation and test sets hidden, scored only by the
      organisers running each team's code.
    after_edition: Varies by edition. The 2022 hidden data were to be released after the Challenge;
      the 2025 validation and test sources are private databases.
    note: The 2022 page says the hidden data will be released only after the end of the Challenge.
  refresh: periodic-recompetition
  refresh_basis:
    reason: A dated edition every year since 2000, each with a new clinical problem and its own
      hidden validation and test data, ranked at the edition's conference.
    source: src-moody-challenge-home
    quote: For the past 27 years, PhysioNet and Computing in Cardiology have co-hosted a series of
      annual challenges
  data_provenance:
    - real-world-instrument
    - patient-clinical-record
    - expert-authored
  data_provenance_note: The recordings come from clinical devices at hospitals, sleep laboratories
    and screening cohorts (real-world-instrument), de-identified with their patients' demographics.
    Many labels come from the clinical record - Sepsis-3 onset (2019), serology (2025), ICD-9 and
    ICD-10 codes in follow-up (2026) (patient-clinical-record). Others are expert annotations, such
    as the murmur labels of 2022 and the cardiologists' weighting of diagnoses in 2020 and 2021
    (expert-authored).
  data_provenance_source: src-moody-challenge-2026
  data_provenance_quote: defined as having at least two qualifying ICD-9 or ICD-10 codes
  contamination_risk: medium
  contamination_risk_note: The hidden sets are kept from the teams, and in 2025 they came from
    sources never posted publicly, which works against leakage. But training sources recur across
    editions (PTB-XL in 2020, 2021, 2024 and 2025), and some editions' hidden sets are released
    afterwards (2022). In 2025 the validation and test sets both drew on REDS-II, whose negative
    records were oversampled with added noise and filtering to create new but highly similar
    records, so near-duplicates across those splits are plausible; no source evidences one.
  contamination_risk_source: src-arxiv-2510-02202-v1
  contamination_risk_quote: to create new but highly similar records
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: The recent headline metrics are bounded at 1 (AUROC, true positive
    rates, the normalised 2020-2021 score, where a classifier that outputs the true classes scores
    1). The 2024 digitisation SNR is unbounded and the 2022 outcome cost is minimised, so the anchor
    holds edition by edition, not for every task.
  ceiling_anchor_type_source: src-moody-challenge-2020
  ceiling_anchor_type_quote: The score s is then normalized so that a classifier that always outputs
    the true class(es) receives a score of 1
  dataset_licence: null
  dataset_licence_note: No single licence; each edition assembles public and private databases under
    their own terms, and the 2025 test sources are private. The site's CC BY 4.0 covers its web
    content, not the data. The data licences on PhysioNet, Kaggle and the Brain Data Science
    Platform were not read.
  size:
    - count: 6600
      unit: polysomnography records with physiological data in the large training set (5,139 + 319 +
        1,142 from three sites); the validation and test sites are hidden
      subset: 2026 edition
      source: src-moody-challenge-2026
      quote: S0001/ (5139 records) | I0002/ (319 records) | I0006/ (1142 records)
    - count: 378624
      unit: 12-lead ECG recordings from six sources (335,621 training records from CODE-15% before
        preprocessing; the hidden sets were augmented afterwards)
      subset: 2025 edition
      source: src-arxiv-2510-02202-v1
      quote: We used 378,624 12-lead ECG recordings recordings from 6 different sources.
    - count: 1020
      unit: adult patients comatose after cardiac arrest (about 60% training, 10% validation, 30%
        test)
      subset: 2023 edition
      source: src-moody-challenge-2023
      quote: This database consists of data from 1,020 adult patients
    - count: 3163
      unit: heart-sound recordings from 942 patients in the training set (60% of the 1,568 patients)
      subset: 2022 edition
      source: src-moody-challenge-2022
      quote: The training set contains 3163 recordings from 942 patients.
    - count: 36266
      unit: ECGs retained privately as test data (6,630 more as validation data, over 88,000 shared
        as training data)
      subset: 2021 edition
      source: src-moody-challenge-2021
      quote: 6,630 ECGs retained privately as validation data, and 36,266 ECGs retained privately as
        test data
    - count: 40336
      unit: ICU patients in the public training sets A (20,336) and B (20,000), from two hospital
        systems; a third system's data are the hidden test set
      subset: 2019 edition
      source: src-moody-challenge-2019
      quote: training set A (20,336 subjects) and B (20,000 subjects)
  submission_limit:
    max_submissions: 15
    period_days: 0
    per: team, scored entries on the validation set over the unofficial (up to 5) and official (up
      to 10) phases of one edition; one entry per team is scored on the test set (2025 and 2026
      rules)
    source: src-moody-challenge-2026

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The PhysioNet Challenge organisers, co-hosted by PhysioNet (maintained by the MIT
    Laboratory for Computational Physiology) and Computing in Cardiology; the 2025 edition was
    organised by a team at Emory University and Georgia Tech with that year's data partners
  maintainer_basis:
    reason: The Challenge site and PhysioNet's list name PhysioNet and CinC as co-hosts and the MIT
      Laboratory for Computational Physiology as PhysioNet's maintainer. The 2025 description
      paper's authors, the organisers, are at Emory University and Georgia Tech with that year's
      data partners in Brazil, Spain and Sweden; the 2023 and 2026 pages list other partners (the
      I-CARE consortium, the Human Sleep Project).
    source: src-physionet-moody-challenge-overview
    quote: Since the turn of the century, PhysioNet has run an annual Challenge in collaboration
      with Computing in Cardiology.
  maintainer_type: conference-workshop
  maintainer_type_note: academic-lab was considered, since one group may have led the recent
    editions (only the 2025 organisers' affiliations were read) and PhysioNet itself is held by an
    MIT laboratory. The term's override takes a recurring challenge held with a conference (CinC,
    which votes on its name and runs its abstract review) whose organising team changes with each
    edition's data partners.
  submission_process:
    - containerized-algorithm-submission
    - open-source-gated
    - publication-gated
  submission_process_note: Teams submit a GitHub or GitLab repository with training and inference
    code, which the organisers build into a Docker image, train on the training set and run on the
    hidden data, with time limits on training and inference (2025). Ranking requires an open-source
    licence (entries under other licences are scored but not ranked, and all entries are posted
    publicly after the Challenge), an accepted CinC abstract, a preprint and a final four-page CinC
    paper, and attendance at the conference. Scores on the validation set are returned during both
    phases.
  submission_process_source: src-arxiv-2510-02202-v1
  submission_process_quote: Participants containerized their code in Docker and submitted it in
    GitHub or Gitlab repositories.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-moody-challenge-2025
      quote: the validation and test data and labels are privately sequestered to allow for the
        principled assessment of the submitted algorithms
  independence_flags_note: The organisers hold the hidden sets and produce every official score.
    People in the organisers' research groups or departments may not officially participate.
    Industry has sponsored editions (Google and MathWorks in 2019-2021, MathWorks with AWS in 2024,
    MathWorks in 2025) and prizes are paid, but no source read says who funds them, so
    prize-sponsored-by-industry is not tagged (review_checks). The 2025 paper acknowledges
    unrestricted gifts from AliveCor and MathWorks and states that no such entity influenced the
    design or provided data.
  independence_assessed: true
  funding:
    source: src-moody-challenge-home
    quote: Supported by the National Institute of Biomedical Imaging and Bioengineering (NIBIB)
      under NIH grant number R01EB030362.
  independence_policy:
    source: src-moody-challenge-2026
    quote: no individual who is affiliated with the same research group, department, or similar
      organization unit (academic or industry) as one or more of the Organizers of that year

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: provided-allocation
  compute_tier_basis:
    reason: Teams develop on their own hardware, but the official training and scoring runs are the
      organisers', in a containerised environment of 16 vCPUs, 60 GB of RAM and an optional
      data-centre GPU in 2025, with 72 hours for training on a GPU and 48 hours for inference on
      each hidden set.
    source: src-arxiv-2510-02202-v1
    quote: We used a containerized environment with 16 vCPUs, 60 GB RAM, at least 100 GB of
      available local storage, and an optional GPU
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The official scores need the hidden validation and test sets, which only the organisers
      hold and run.
    source: src-github-physionetchallenges-python-example-2026-readme
    quote: we will use different datasets for the validation and test sets, and we will not provide
      the labels to your code
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: The organisers' evaluate_model scoring script with the train_model and run_model drivers,
    published each year in the example-code repositories (python-example-2026, matlab-example-2026;
    separate evaluation repositories for 2023-2025)
  harness_note: The README says the organisers run the unedited train_model.py and run_model.py and
    score with evaluate_model.py; the code was not run for this entry.
  harness_source: src-github-physionetchallenges-python-example-2026-readme
  harness_quote: The scoring code is included in this repository in the file
  submission_channel:
    source: src-moody-challenge-2026
    quote: Teams submit their code, including working training code, in a GitHub or GitLab
      repository by submitting a form.
  code_licence: BSD-3-Clause
  code_licence_note: For the 2026 example and scoring code (python-example-2026), per GitHub's
    licence metadata read 2026-11-04; the 2025 evaluation repository reports BSD-2-Clause. The rules
    apply the example code's BSD 3-Clause licence to entries that state none.
  code_licence_source: src-moody-challenge-2026
  code_licence_quote: we will assume that you have released your code under the BSD 3-Clause license
  runnable_via:
    - custom
  runnable_via_note: The example repositories' train_model, run_model and evaluate_model scripts, in
    a Docker image or a virtual environment, run against the public training data; the official
    score needs the hidden sets.
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile (subset_used: which edition, task and split, the validation or the test set, and
  # in 2025 which of the three test sources or their mean): what the entry was trained on. Every edition fixes a
  # training set, 2026 offers a small and a large version that are compared directly, and public data released
  # before the Challenge may be added.
  material_extra:
    - training_data_policy

homepage: https://moody-challenge.physionet.org/
repository: https://github.com/physionetchallenges
leaderboard_url: https://moody-challenge.physionet.org/2026/results/

versions:
  - version: '2000'
    label: 'Detecting and Quantifying Apnea Based on the ECG: The PhysioNet/Computing in Cardiology Challenge
      2000'
    version_kind: edition
    changes: The first Challenge, sleep apnoea detection from the ECG; recorded from its title only.
    breaking: true
    superseded_by: '2001'
    frozen: true
    sources:
      - src-physionet-moody-challenge-overview
      - src-moody-challenge-home
  - version: '2001'
    label: 'Predicting Paroxysmal Atrial Fibrillation/Flutter: The PhysioNet/Computing in Cardiology Challenge
      2001'
    version_kind: edition
    changes: Prediction of paroxysmal atrial fibrillation; title only.

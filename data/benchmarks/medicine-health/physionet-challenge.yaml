subsets:
  - id: physionet-challenge#2024-digitization
    label: 2024 task 1, digitisation of ECG images into waveforms
    scored_separately: true
    domain_override:
      primary: vision/document-understanding
      secondary:
        - medicine-health/diagnosis-triage
    capability_override:
      - perception
    evidence:
      - source: src-moody-challenge-2024
        quote: Digitize the ECGs, i.e., turn images of ECGs (scanned from paper) into waveforms
          (time-series data) representing the same ECGs
      - source: src-moody-challenge-2024
        quote: The evaluation metric for the digitization task is the signal-noise ratio (SNR) of
          the reconstructed signal
    notes: Scored by the SNR of the reconstructed signal against the original waveform, with its own
      prize. The domain override makes the extraction of a waveform from a document image primary;
      the family's diagnosis-triage stays secondary because the waveform is a diagnostic ECG. The
      capability override drops distribution-shift-generalization, which the sources read do not
      report as a condition of this task.
  - id: physionet-challenge#2024-classification
    label: 2024 task 2, classification of ECG images
    scored_separately: true
    domain_override:
      primary: medicine-health/medical-imaging-diagnostic
      secondary:
        - medicine-health/diagnosis-triage
    capability_override:
      - perception
    evidence:
      - source: src-moody-challenge-2024
        quote: Classify the ECGs (either from the image, or from the converted time-series data that
          you extract from the image)
    notes: Scored by macro F-measure over the diagnostic classes, with its own prize; teams may
      classify from the image directly or from their digitised signal.
  - id: physionet-challenge#2022-murmur
    label: 2022 task 1, murmur detection from heart-sound recordings
    scored_separately: true
    domain_override:
      primary: medicine-health/diagnosis-triage
      secondary:
        - audio-speech/audio-event-understanding
    capability_override:
      - perception
    evidence:
      - source: src-moody-challenge-2022
        quote: to rank the murmur classifiers, but we will use a different metric to rank the
          clinical outcome classifiers
    notes: Present, unknown or absent per patient, scored by a weighted accuracy that weights
      present murmurs five times and unknown ones three times. The 2022 split is patient-wise and
      stratified, so distribution-shift-generalization is dropped.
  - id: physionet-challenge#2022-outcome
    label: 2022 task 2, clinical outcome from heart-sound recordings
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-moody-challenge-2022
        quote: The second scoring metric is a cost-based metric that considers the costs of
          algorithmic prescreening, expert screening, treatment, and diagnostic errors that result
          in late or missed treatments.
    notes: Normal or abnormal clinical outcome per patient, ranked by the cost of the referrals the
      algorithm's outputs imply (lower is better). The capability override drops
      distribution-shift-generalization, as for the murmur task.

history:
  - date: 2019-04-22
    event: channel-moved
    field: execution.submission_channel
    from: the submission system of the 2019 unofficial phase
    to: a new cloud submission system that runs the teams' code
    source: src-moody-challenge-2019
    quote: We will only use our new cloud submission system for the official phase of the Challenge.
    note: The announcement of the 2019 official phase; the sources read do not describe the earlier
      editions' submission routes.


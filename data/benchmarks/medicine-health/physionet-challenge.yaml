# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T04)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-moody-challenge-home
    - src-physionet-moody-challenge-overview
    - src-moody-challenge-2019
    - src-moody-challenge-2020
    - src-moody-challenge-2021
    - src-moody-challenge-2022
    - src-moody-challenge-2023
    - src-moody-challenge-2024
    - src-moody-challenge-2025
    - src-moody-challenge-2025-results
    - src-moody-challenge-2026
    - src-moody-challenge-2026-results
    - src-moody-challenge-2026-results-tsv
    - src-arxiv-2510-02202-v1
    - src-arxiv-2510-02202
    - src-github-physionetchallenges-python-example-2026-readme
  sources_note: >
    The Challenge site is static (GitHub Pages; physionetchallenges.org redirects to it) and was read
    as HTML with scripts and styles stripped; it serves no robots.txt, and physionet.org's allows all
    paths. The pages name organisers and data partners beside their facts, so the windows are kept short
    and clear of them. The 2026 results table lists every team's authors and was read with zero-width
    windows around the cited strings; its archive is withheld. The arXiv PDF (a DOI, not archived) was
    read as text with windows clear of the corresponding author's address. No data were downloaded, and
    nothing on PhysioNet, Kaggle or the Brain Data Science Platform was logged into or accepted. The 2000-2018
    editions were not read beyond the two lists' titles.
  confidence: medium
  review_checks:
    - check: One entry for the whole series, each year a version with version_kind edition, as the
        brief's cap at families directs. The editions share the organiser, name, venue and
        submission protocol, but their tasks, data and metrics differ entirely from year to year,
        and an edition's public training data may be used as a benchmark of its own outside the
        Challenge (not checked). Whether any edition should be a separate entry linked by lineage is
        open.
      field: versions
    - check: diagnosis-triage is primary by majority of the editions since 2016, and the per-year
        leaf spread is wide - ehr-prediction (2012, 2019), prognosis of neurological outcome (2023)
        and a future diagnosis (2026) read as diagnosis-triage by stretching 'from a presented
        case', medical-imaging-diagnostic and vision/document-understanding (2024),
        audio-event-understanding (2016, 2022). Before 2016 several editions are measurement or
        detection tasks on signals (QT intervals 2006, T-wave alternans 2008, fetal ECG 2013, heart
        beats 2014, RR modelling 2002) that no medicine-health leaf fits; a tag gap for a
        physiological-signal leaf is logged.
      field: domain.primary
      specialist: true
    - check: domain-metric is tagged for the bespoke clinical metrics (the 2019 utility, the
        2020-2021 weighted accuracy, the 2022 cost), which have no meaning outside their problem but
        are not standardised within a discipline as the term's inclusion test names. If they read
        better as classification-metric variants, domain-metric goes.
      field: evaluation_method
      source: src-moody-challenge-2020
      quote: we developed a new scoring metric that awards partial credit to misdiagnoses that
        result in similar treatments or outcomes as the true diagnosis as judged by our
        cardiologists
    - check: The 2000-2018 editions are recorded from titles only. The two lists word some titles
        differently (2000 Detecting Sleep Apnea from the ECG on the Challenge site, Detecting and
        Quantifying Apnea Based on the ECG on PhysioNet; 2016 adds Normal/Abnormal) and give
        different paper and software counts. No dates, sizes, metrics or submission routes were read
        for them, and their changes lines paraphrase the titles.
      field: versions
      source: src-moody-challenge-home
      quote: '2000: Detecting Sleep Apnea from the ECG 13 papers and 1 contributed software'
    - check: prize-sponsored-by-industry is not tagged. Google, MathWorks and AWS are named as
        sponsors of recent editions and prize money is paid to in-person attendees, but no page read
        says who funds the prizes (the IEEE Signal Processing Society funded extra prizes for
        African teams in 2024). The 2025 paper also discloses an organiser's financial interests in
        AliveCor, a sponsor by unrestricted gift, and states that the sponsors did not influence the
        design.
      field: governance.independence_flags
      source: src-arxiv-2510-02202-v1
      quote: None of these entities influenced the design of or provided data for this
    - check: maintainer_type conference-workshop rests on the term's override for a challenge held
        with a conference whose organisers change with each year's data partners; the 2025
        organisers are an Emory-based group, the organiser lists of the other editions were not
        checked for affiliation, and PhysioNet is an MIT laboratory's resource, so academic-lab is
        the alternative if one group has carried the series.
      field: governance.maintainer_type
    - check: activity between-rounds - the 2026 results are out and no 2027 Challenge is announced
        on the pages read. Editions have opened between late December and mid-February since 2019,
        so round-scheduled or accepting-submissions will apply once a 2027 page appears.
      field: activity
    - check: paper is the 2025 description paper, the newest one read; the series has no single
        paper, each edition has its own description paper (the 2025 paper cites the 2019 one in
        Critical Care Medicine), and only the 2025 one was read. The description and facets for
        2019-2024 and 2026 rest on the Challenge pages, which give the rules as announced, not as
        finally run.
      field: paper
    - check: distribution-shift-generalization is tagged for the family on the 2020, 2023, 2025 and
        2026 designs. The 2022 split is patient-wise and stratified, and the 2019 and 2021 test sets
        were not checked for a held-out source beyond the pages' wording; the 2022 and 2024 subsets
        drop the term.
      field: capability
    - check: contamination_risk medium partly rests on the 2025 augmentation of REDS-II, which feeds
        both the validation and the test set with oversampled, perturbed copies; whether any patient
        or record is in both splits is not stated.
      field: data.contamination_risk
      source: src-arxiv-2510-02202-v1
      quote: to create new but highly similar records
    - check: dataset_licence is null because each edition's data carry their own terms. The 2026
        training data sit on Kaggle and the Brain Data Science Platform, and older editions' data on
        PhysioNet, some of whose clinical collections need credentialed access; none of those terms
        were read.
      field: data.dataset_licence
  personal_data_excluded:
    - source: src-moody-challenge-2026-results-tsv
      what: The authors of every team's entry, listed by name in each row.
    - source: src-moody-challenge-2022
      what: The organisers' names at the head of the page.
    - source: src-moody-challenge-2023
      what: The organisers' names and the names of the contributing hospitals' investigators.
    - source: src-arxiv-2510-02202-v1
      what: The corresponding author's e-mail address in the author block.

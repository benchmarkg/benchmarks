# data/benchmarks/medicine-health/conic.yaml
#
# P3-S6-T06, Grand Challenge subset, challenge 6 of 8. Filled from the challenge paper (arXiv 2303.06274, v2 PDF;
# Medical Image Analysis 92, 103047, 2024), read in windows that keep the author list out; two pages of
# conic-challenge.grand-challenge.org, scripts and styles stripped: the home page, whose citation lines name authors and
# which is therefore withheld from archiving, and the Evaluation page; and the abstract page of a 2026 paper that
# evaluates on CoNIC (arXiv 2606.07633). The leaderboards, which show participants' user names, and Grand Challenge's
# API, which its robots.txt disallows, were not read. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.

id: conic
name: CoNIC
aliases:
  - Colon Nuclei Identification and Counting Challenge
  - CoNIC 2022
tagline: Nuclei segmentation, classification and counting in colon H&E patches, two tasks with their
  own metrics.
description: >
  The Colon Nuclei Identification and Counting challenge, held with ISBI 2022 on Grand Challenge. It is
  built on Lizard, a colon histology data set of nearly half a million labelled nuclei, released for training
  as 256x256 H&E patches. Task 1 asks for every nucleus to be segmented and classified as epithelial,
  lymphocyte, plasma, eosinophil, neutrophil or connective tissue, and is ranked by the multi-class panoptic
  quality computed over all images (mPQ+); task 2 asks for the count of each type per image and is ranked
  by the multi-class coefficient of determination (R2). Submissions are Docker containers run on the platform
  against a test set never released (Lizard test images and a colon biopsy set made for the challenge),
  with one submission a day in the preliminary phase and one per task in the final phase, which a short
  method manuscript had to accompany. 26 teams reached the final task 1 leaderboard and 24 the task 2
  one. Post-challenge submissions have been accepted since July 2022.
self_description:
  source: src-gc-conic-home
  quote: The challenge requires researchers to develop algorithms that perform segmentation,
    classification and counting of 6 different types of nuclei
paper:
  title: 'CoNIC Challenge: Pushing the Frontiers of Nuclear Detection, Segmentation, Classification and
    Counting'
  arxiv: '2303.06274'
  version_read: v2
  source: src-arxiv-2303-06274-v2
released: 2021-11-20
released_note: The day the training data and the evaluation code were released, as the home page's
  dates give it.
released_source: src-gc-conic-home
released_quote: '20th November 2021: Release of training data and evaluation code'
release_venue: IEEE International Symposium on Biomedical Imaging (ISBI) 2022; the paper in Medical
  Image Analysis 92, 103047 (2024)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-imaging-segmentation
  secondary:
    - vision/segmentation
domain_basis:
  reason: Task 1 delineates nuclei in H&E histology as instance masks and labels each with a cell
    type, scored against pathologist-refined annotations, which the leaf's inclusion test takes;
    task 2's counts follow from the same recognition. The instance segmentation behind it is
    recorded as the secondary.
  source: src-gc-conic-home
  quote: epithelial, lymphocyte, plasma, eosinophil, neutrophil or connective tissue
domain_considered_and_rejected:
  - term: medicine-health/medical-imaging-diagnostic
    reason: No diagnosis or finding is scored as a label or location; nuclei are scored as masks and
      counts.
  - term: vision/medical-imaging-cv
    reason: The cell types and the reference are clinical (pathology), and the claim is nuclear
      recognition for computational pathology, not a vision method tested on medical images.

capability:
  - perception
capability_basis:
  perception:
    reason: Every output is read from an H&E image patch, nucleus by nucleus.
    source: src-gc-conic-home
    quote: The challenge requires researchers to develop algorithms that perform segmentation,
      classification and counting of 6 different types of nuclei
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The final test set adds a colon biopsy set made for the challenge, but one score is
      reported over the whole test set, with no condition of its own for the new data.
    source: src-arxiv-2303-06274-v2
    quote: which came from images within the Lizard test dataset and a special colon biopsy dataset
  - term: quantitative-reasoning
    reason: Task 2 outputs counts, but they are read off the image rather than reasoned to.

evaluation_method:
  - domain-metric
  - statistical-fit
evaluation_method_basis:
  reason: Task 1 is scored by panoptic quality, a segmentation metric of the kind the domain-metric
    term names; task 2 by the coefficient of determination between predicted and true counts, a
    goodness-of-fit statistic. Each task has its own metric and ranking (subsets).
  source: src-gc-conic-evaluation
  quote: We will use a single metric per task to determine the performance of submitted results.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The two tasks are ranked separately, never combined into one figure, and composite's
      exclusion test sends separate tracks to subsets.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are nuclear segmentation and classification networks (a HoVer-Net baseline
    was provided) trained on the challenge's patches, for a task computational pathology defines,
    which task-specific-supervised-model's exclusion test sends here.
  source: src-arxiv-2303-06274-v2
  quote: We provided a HoVer-Net9 model
as_used:
  - protocol: The CoNIC data as a nuclei segmentation and classification benchmark scored locally by
      mean Dice and mean F1 over seven classes; neither of the challenge's metrics is computed and
      nothing is submitted to the platform.
    source: src-arxiv-2606-07633
    quote: Evaluated on the CoNIC benchmark across seven nuclei classes, AMN achieves a mean Dice of
      0.82 and mean F1 of 0.68
    note: AMN (arXiv 2606.07633, May 2026). The paper's seven classes presumably count background
      beside the six types; not read.

lifecycle: active
lifecycle_basis:
  reason: Papers still evaluate on the CoNIC data in 2026 (as_used), and the platform still takes
    post-challenge submissions.
  source: src-arxiv-2606-07633
  quote: Evaluated on the CoNIC benchmark across seven nuclei classes, AMN achieves a mean Dice of
    0.82 and mean F1 of 0.68
activity: leaderboard-live-no-round
activity_basis:
  reason: The challenge ended at ISBI 2022; post-challenge submission opened on 2022-07-15 for both
    tasks and the home page still announces it. The post-challenge leaderboards were not read.
  source: src-gc-conic-home
  quote: We are now accepting post-challenge submissions for both tasks!

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: HoVer-Net, the organisers' baseline trained on the challenge's training patches
    source: src-arxiv-2303-06274-v2
    observed_on: 2026-11-25
    quote: We provided a HoVer-Net9 model
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test set was never released, so only the platform can score a container on it; the
    evaluation code is public and runs on any labelled split.
  source: src-gc-conic-home
  quote: only the training set will be released during the challenge and participants will not have
    access to any part of the test set

task:
  exists: true
  input:
    - an H&E-stained colon histology image patch (256x256 in the released training set)
    - for training, the Lizard training patches with instance masks, nucleus types and counts
  output: 'Task 1: an instance segmentation map with a type for every nucleus. Task 2: the count of each
    of the six nucleus types in the image. Both produced by a container on the platform.'
  scoring: 'Task 1: multi-class panoptic quality, PQ per type with statistics pooled over all images,
    averaged over the six types (mPQ+). Task 2: multi-class coefficient of determination between predicted
    and true counts, per type and averaged. Each task is ranked on its own metric.'
  tests_hidden_from_system: true
  source: src-gc-conic-evaluation
  quote: We will use a single metric per task to determine the performance of submitted results.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The training patches and evaluation code are downloadable once a challenge
    registration on Grand Challenge is accepted (gated-registration for the training data); the test
    images were never released, and containers run on the platform.
  access_basis:
    reason: The test inputs never leave the organisers; submissions are containers scored on the
      platform. The training data sit behind the challenge's registration.
    source: src-gc-conic-home
    quote: only the training set will be released during the challenge and participants will not
      have access to any part of the test set
  refresh: static
  refresh_note: One test set since the 2022 challenge; the post-challenge phases score against it,
    and no source read announces a change.
  data_provenance:
    - real-world-instrument
    - expert-authored
  data_provenance_note: H&E slides scanned from clinical colon tissue; Lizard's labels were made by
    an iterative semi-automatic process with pathologists refining them.
  data_provenance_source: src-arxiv-2303-06274-v2
  data_provenance_quote: The Lizard dataset14 employed an iterative approach to label nearly half a
    million nuclei
  contamination_risk: low
  contamination_risk_note: The test images were never released and are processed only on the
    platform. Lizard's own test split is part of the test set; whether Lizard's public release
    includes those images was not read (review_checks).
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Both metrics are bounded at 1 above; no source read reports
    inter-annotator agreement on the test set.
  dataset_licence: Creative Commons non-commercial (version not stated in the passage read)
  dataset_licence_source: src-arxiv-2303-06274-v2
  dataset_licence_quote: where the data is held under a non-commercial Creative Commons license
  size:
    - count: 103150
      unit: nuclei in the evaluation data
      subset: test
      source: src-arxiv-2303-06274-v2
      quote: Within 60 minutes, the algorithms had to process all 103,150 nuclei in the evaluation
        dataset
  size_note: Lizard holds nearly half a million labelled nuclei in all; the number of training
    patches was not in the passages read.
  submission_limit:
    max_submissions: 1
    period_days: 0
    per: team and task, in the final test phase (a second only for a significantly different method)
    source: src-gc-conic-home
  submission_limit_note: The preliminary test phase took one submission a day per team and task. The
    post-challenge phases' limits were not read.
  submission_limit_source: src-gc-conic-home
  submission_limit_quote: In the final test phase, each team has only one chance of submission per
    task, unless they are submitting two (or more) methods that are significantly different from
    each other.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CoNIC organisers, at the University of Warwick's Tissue Image Analytics (TIA)
    Centre
  maintainer_basis:
    reason: The paper links the challenge's results pages on warwick.ac.uk and its code under the
      TissueImageAnalytics GitHub organisation; the passages are not quoted because they sit beside
      the author list.
    source: src-arxiv-2303-06274-v2
  maintainer_type: academic-lab
  submission_process:
    - containerized-algorithm-submission
    - held-out-server
    - publication-gated
  submission_process_note: Teams submit a Docker container per task, run on the platform within a
    time limit; a final-phase submission without its short method manuscript was disqualified.
  submission_process_source: src-gc-conic-home
  submission_process_quote: Each final submission should be accompanied by a short manuscript
    describing technical details of the submitted method.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-gc-conic-home
      quote: only the training set will be released during the challenge and participants will not
        have access to any part of the test set
  independence_flags_note: The organisers hold the test set and every official score comes from the
    platform. Whether organiser groups entered, and who funded the prizes, was not read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The evaluation code is public, but the official score needs the unreleased test set.
    source: src-gc-conic-home
    quote: only the training set will be released during the challenge and participants will not
      have access to any part of the test set
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: The challenge's evaluation code on its GitHub page, computing mPQ+ and multi-class R2
  harness_note: The repository itself was not read, so its version and licence are not recorded.
  harness_source: src-gc-conic-evaluation
  harness_quote: To access the evaluation code that we will use in the challenge, take a look at our
    GitHub page.
  code_licence: null
  runnable_via:
    - custom
  runnable_via_note: The evaluation code scores any labelled split, such as cross-validation folds
    of the training patches; the official scores need the platform.
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which task and phase (preliminary, final, post-challenge) a number comes from.
  material_extra:
    - subset_used

aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: The two tasks are ranked separately, each by its own metric, and never combined.
  source: src-gc-conic-evaluation
  quote: We will use a single metric per task to determine the performance of submitted results.

liveness:
  last_checked: 2026-11-25

homepage: https://conic-challenge.grand-challenge.org/
repository: null
repository_note: The evaluation code's GitHub repository is linked from the challenge pages; its
  address was not read from a quotable passage.
dataset_url: null
leaderboard_url: null
leaderboard_url_note: The six leaderboards (preliminary, final and post-challenge for each task)
  were not read; they show participants' user names.

subsets:
  - id: conic#segmentation-classification
    label: 'Task 1: nuclear segmentation and classification'
    metric_override: conic-mpq-plus
    evidence:
      - source: src-gc-conic-evaluation
        quote: Hence, for the purpose of this challenge, we refer to the metric as
      - source: src-arxiv-2303-06274-v2
        quote: 26 unique teams appeared on the final segmentation and classification leaderboard,
          whereas 24 teams appeared on the cellular composition leaderboard.
  - id: conic#cellular-composition
    label: 'Task 2: prediction of cellular composition'
    metric_override: conic-multiclass-r2
    evidence:
      - source: src-gc-conic-evaluation
        quote: we will use multi-class coefficient of determination to determine the correlation
          between the predicted and true counts

metrics:
  - conic-mpq-plus
  - conic-multiclass-r2
metrics_note: P3-S6-T06. Each task's own ranking metric, set as its subset's metric_override. mPQ+
  is CoNIC's pooled variant of multi-class PQ, which the organisers distinguish from the per-image
  mPQ of earlier nuclei benchmarks; neither metric is a shared accuracy.

tags:
  - computational-pathology
  - nuclei
  - histopathology
  - instance-segmentation
  - counting
  - challenge

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P3-S6-T06)
  added_on: 2026-11-25
  last_verified: 2026-11-25
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2303-06274-v2
    - src-gc-conic-home
    - src-gc-conic-evaluation
    - src-arxiv-2606-07633
  confidence: medium
  review_checks:
    - check: submission_limit records the final phase's one per team and task; the paper and the
        home page agree, and the paper gives one a day in the preliminary phase. The post-challenge
        limit was not read (it shows only to a signed-in user).
      field: data.submission_limit
      source: src-arxiv-2303-06274-v2
      quote: The final submission phase lasted one week, where participants could only submit once
        per task.
    - check: data.access is private-test-server for the test set, but the training data themselves
        are gated behind an accepted challenge registration; gated-registration describes the
        training side and is recorded in the note only.
      field: data.access
      source: src-gc-conic-home
      quote: Once your participation request has been accepted, you will have access to the data
        download and submission pages.
    - check: contamination_risk low assumes the Lizard test images in the CoNIC test set are not
        public elsewhere; Lizard's own release terms were not read.
      field: data.contamination_risk
    - check: maintainer is the Warwick TIA Centre on the strength of the paper's links, which sit
        beside the author list and are not quoted. Confirm from the paper's affiliations.
      field: governance.maintainer
    - check: A 2026 paper reports mean Dice and F1 over seven classes on "the CoNIC benchmark",
        neither of which is a challenge metric; whether its split is the challenge's was not read.
      field: as_used
    - check: dataset_licence is a non-commercial Creative Commons licence of unstated version; the
        Data page (behind registration) or Lizard's release would give it.
      field: data.dataset_licence
  personal_data_excluded:
    - source: src-arxiv-2303-06274-v2
      what: The author list, affiliations and the corresponding author's contact line.
    - source: src-gc-conic-home
      what: The citation lines naming the papers' authors.
    - source: src-gc-conic-evaluation
      what: The challenge's project e-mail address in the mailto links.
    - source: src-arxiv-2606-07633
      what: The author list and the submitter line.

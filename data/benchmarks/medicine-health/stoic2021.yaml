# data/benchmarks/medicine-health/stoic2021.yaml
#
# P3-S6-T06, Grand Challenge subset, challenge 7 of 8. Filled from the challenge paper (arXiv 2306.10484, v2 PDF), read
# with windows narrowed to the cited sentences because the author list, a contact line, repository handles and team
# names sit close to them; and the challenge's home page on stoic2021.grand-challenge.org, scripts and styles stripped,
# withheld from archiving because its mailto links carry an organiser's personal e-mail address. The leaderboards,
# which show participants' user names, and Grand Challenge's API, which its robots.txt disallows, were not read. No
# 2025-2026 use was found by an arXiv abstract search, so lifecycle is null. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.

id: stoic2021
name: STOIC2021
aliases:
  - STOIC2021 - COVID-19 AI Challenge
  - STOIC 2021
tagline: Severe COVID-19 from a chest CT scan, ranked by AUC, with finalists' training code run on
  private data.
description: >
  A COVID-19 challenge on Grand Challenge, sponsored by AWS and endorsed by MICCAI, built on the STOIC
  project's CT scans of patients suspected of SARS-CoV-2 infection in France in spring 2020. Systems predict
  from one CT scan whether the patient will have severe COVID-19, defined as intubation or death within
  one month, and are ranked by AUC over the RT-PCR-positive cases; AUC for COVID-19 presence is reported
  as feedback only. In the qualification phase teams trained on a public sample of 2,000 scans (CC BY-NC
  4.0) and submitted Docker containers, scored on a 200-subject subset of the 1,000-scan test set every
  seven days at most and once on a disjoint subset to qualify. In the final phase the ten best teams submitted
  training code, which the organisers ran on the platform on the sequestered STOIC data (the paper's Type
  Three format), so the finalists' models were trained on data they never saw; six of eight submitted
  codebases trained successfully, and the winning model reached an AUC of 0.815. The codebases were released
  publicly.
self_description:
  source: src-gc-stoic2021-home
  quote: The focus of the challenge is the prediction of severe COVID-19, defined as intubation or
    death within one month from the acquisition of the CT scan (AUC, primary metric).
paper:
  title: 'The STOIC2021 COVID-19 AI challenge: applying reusable training methodologies to private data'
  arxiv: '2306.10484'
  version_read: v2
  source: src-arxiv-2306-10484-v2
released: null
released_note: The paper dates the public data release to December 2021 in a passage the extract
  does not keep; no quoted source gives the date.
release_venue: Grand Challenge, endorsed by MICCAI; the winners presented their solutions in a
  webinar on 18 October

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-imaging-diagnostic
domain_basis:
  reason: Systems reach a prognostic conclusion (severe or not) from a chest CT scan, scored against
    the patient's recorded outcome, which the leaf's inclusion test takes whatever the metric.
  source: src-arxiv-2306-10484-v2
  quote: with the goal of predicting from a computed tomography (CT) scan whether subjects had a
    severe COVID-19 infection, defined as intubation or death within one month
domain_considered_and_rejected:
  - term: medicine-health/ehr-prediction
    reason: The reference is an outcome from the patient record, but the input is the CT scan, not
      structured record data; age and sex labels come with the public scans and are not the task.
  - term: vision/classification
    reason: One label per scan, but the label is a clinical outcome; the vision side adds nothing
      the primary does not say.

capability:
  - perception
capability_basis:
  perception:
    reason: The input is a volumetric chest CT scan, from which the outcome must be read.
    source: src-gc-stoic2021-home
    quote: The test set consists of 1000 scans from the STOIC dataset.
capability_considered_and_rejected:
  - term: probabilistic-forecasting
    reason: The outcome lies in the patient's future at scan time, but it was resolved before the
      challenge and is scored as a label by AUC, not as a forecast resolving later.
    source: src-arxiv-2306-10484-v2
    quote: Participants were ranked based on AUC for classifying COVID-19 severity, computed over
      cases with a positive COVID-19 RT-PCR result.
  - term: sample-efficiency
    reason: The final phase retrains on far more data than the qualification phase, but the amount
      of data is the organisers' choice, not a scored condition.

evaluation_method:
  - classification-metric
evaluation_method_basis:
  reason: Ranked by the area under the ROC curve for severe COVID-19 over the RT-PCR-positive cases,
    a general classification statistic.
  source: src-arxiv-2306-10484-v2
  quote: Participants were ranked based on AUC for classifying COVID-19 severity, computed over
    cases with a positive COVID-19 RT-PCR result.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are CT classifiers trained on the challenge's data, and in the final phase
    the training code itself, for a prognostic task clinical medicine defines.
  source: src-arxiv-2306-10484-v2
  quote: With T3, challenge organizers train a codebase provided by the participants on sequestered
    training data.

lifecycle: null
lifecycle_note: No source read shows use after the 2023 paper; an arXiv abstract search on
  2026-11-25 found none since 2023 (taxonomy/_failures record). dormant's exclusion asks for null
  where the sources are silent on use.
activity: closed
activity_basis:
  reason: Both qualification test sets stopped taking submissions in April 2022 and the prizes were
    presented in October; no source read mentions post-challenge submissions.
  source: src-arxiv-2306-10484-v2
  quote: Submissions to both test set A1 and A2 were closed on April 13th, 2022.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The winning final-phase solution, a CT classifier trained by the organisers from its
      team's codebase on the sequestered STOIC data
    source: src-arxiv-2306-10484-v2
    observed_on: 2026-11-25
    quote: The winning solution obtained an area under the receiver operating characteristic curve
      for discerning between severe and non-severe COVID-19 of 0.815.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test scans and most of the training data are private; the final-phase models exist
    only because the organisers trained them on data no participant holds.
  source: src-arxiv-2306-10484-v2
  quote: With T3, challenge organizers train a codebase provided by the participants on sequestered
    training data.

task:
  exists: true
  input:
    - one chest CT scan of a patient suspected of COVID-19
    - for qualification-phase training, the public sample of 2,000 scans with RT-PCR results,
      severity at one month, age and sex
  output: A likelihood of severe COVID-19 (and one of COVID-19 presence) per scan, produced by a
    Docker container on the platform; in the final phase, also the training code that produced it.
  scoring: AUC for severe COVID-19 over the test cases with a positive RT-PCR result ranks; AUC for
    COVID-19 presence over all cases is feedback only.
  metric_range:
    - 0.0
    - 1.0
  tests_hidden_from_system: true
  source: src-arxiv-2306-10484-v2
  quote: AUC for COVID-19 presence, computed over all cases, was used solely as additional feedback
    for participants

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: "Three tiers: a public sample of 2,000 scans with labels under CC BY-NC 4.0; a 1,000-scan
    test set never released, scored only on the platform; and the rest of the STOIC data, never released,
    on which the organisers trained the finalists' code inside the platform. Taking part needed a Grand
    Challenge account; the final phase was by invitation."
  access_basis:
    reason: The test scans never leave the platform, and the final phase's training data are
      sequestered too, so participants never see most of the data their models are trained and
      scored on.
    source: src-arxiv-2306-10484-v2
    quote: With T3, challenge organizers train a codebase provided by the participants on
      sequestered training data.
  refresh: static
  refresh_note: One test set of 1,000 scans, split into the qualification subsets; no source read
    announces a change.
  data_provenance:
    - real-world-instrument
    - patient-clinical-record
    - unreleasable-confidential
  data_provenance_note: CT scans from the STOIC project's first-wave cohort (real-world-instrument),
    with RT-PCR results and the one-month outcome from the patients' records
    (patient-clinical-record); all but the public sample stay sequestered
    (unreleasable-confidential).
  data_provenance_source: src-gc-stoic2021-home
  data_provenance_quote: infected with SARS-COV-2 during the first wave of the pandemic in France,
    from March to April 2020.
  contamination_risk: low
  contamination_risk_note: The test scans were never released and are processed only on the
    platform; the final-phase training data are sequestered as well.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: AUC is bounded at 1; no source read reports radiologists' AUC on the
    task.
  dataset_licence: CC-BY-NC-4.0
  dataset_licence_note: The public sample of 2,000 scans only; the rest of the STOIC data is not
    released.
  dataset_licence_source: src-gc-stoic2021-home
  dataset_licence_quote: a publicly available sample of the STOIC dataset, consisting of 2000 scans
    and released under the CC BY-NC 4.0 license
  size:
    - count: 1000
      unit: CT scans
      subset: test
      source: src-gc-stoic2021-home
      quote: The test set consists of 1000 scans from the STOIC dataset.
    - count: 200
      unit: subjects in test set A1, for the qualification phase's rolling submissions
      subset: test set A1
      source: src-arxiv-2306-10484-v2
      quote: Test set A1 consisted of only 200 subjects to limit the computational costs of the
        rolling submissions.
    - count: 2000
      unit: CT scans released for training
      subset: public training sample
      source: src-gc-stoic2021-home
      quote: a publicly available sample of the STOIC dataset, consisting of 2000 scans and released
        under the CC BY-NC 4.0 license
  submission_limit:
    max_submissions: 1
    period_days: 0
    per: team, to test set A2, the qualification phase's last submission, which decided the
      finalists
    source: src-arxiv-2306-10484-v2
  submission_limit_note: The rolling submissions to test set A1 had a seven-day count-down between
    submissions. In the final phase each invited team submitted one training codebase.
  submission_limit_source: src-arxiv-2306-10484-v2
  submission_limit_quote: each team could submit their solution to be evaluated on test set A2 only
    once

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The STOIC2021 organisers, at Radboudumc's Diagnostic Image Analysis Group with the
    STOIC project's investigators
  maintainer_basis:
    reason: The paper's correspondence line and the baseline repositories point to Radboudumc, and
      the data are the STOIC project's; those passages name people and are not quoted.
    source: src-arxiv-2306-10484-v2
  maintainer_type: academic-lab
  submission_process:
    - containerized-algorithm-submission
    - held-out-server
    - maintainer-run
  submission_process_note: In the qualification phase teams submit inference containers scored on
    the platform; in the final phase the organisers build training containers from the finalists'
    code and run them on the sequestered data, which is maintainer-run training rather than scoring
    alone.
  submission_process_source: src-gc-stoic2021-home
  submission_process_quote: Participants must upload their solutions as a Docker container to
    https://grand-challenge.org/algorithms/.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-gc-stoic2021-home
      quote: The test set consists of 1000 scans from the STOIC dataset.
    - flag: prize-sponsored-by-industry
      source: src-gc-stoic2021-home
      quote: This challenge is sponsored by AWS and endorsed by MICCAI.
  independence_flags_note: The organisers hold the test set, and in the final phase they also train
    every finalist's model. AWS sponsored the challenge, paid the prizes in AWS credits and hosts
    the training environment; it is not an entrant. Whether organiser groups entered was not read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The test set and the final-phase training data are private, so neither the scores nor
      the final models can be reproduced outside the platform.
    source: src-arxiv-2306-10484-v2
    quote: With T3, challenge organizers train a codebase provided by the participants on
      sequestered training data.
  reproducibility_blockers:
    - private-test-set
    - unreleasable-data
  harness_availability: reference-implementation-only
  harness_availability_note: The finalists' training and inference codebases, and a baseline, were
    released; no scoring code was read.
  harness_availability_source: src-arxiv-2306-10484-v2
  harness_availability_quote: The submitted codebases for training and running inference were
    released publicly.
  submission_channel:
    source: src-gc-stoic2021-home
    quote: At the end of the qualification round, each team can submit one Algorithm to the final
      leaderboard where the full test set will be processed.
  code_licence: null
  code_licence_note: The home page required the final-phase code to be released under a permissive
    open-source licence; which licence each codebase took was not read.
  code_licence_source: src-gc-stoic2021-home
  code_licence_quote: The code for this container needs to be released under a permissive
    open-source license.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the phase and test subset (A1, A2, the full test set) and, above all, what the
  # model was trained on: the 2,000 public scans in the qualification phase or the sequestered STOIC data in the
  # final phase, where the organisers ran the training.
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: official-aggregate
headline_metric: stoic2021-severity-auc

liveness:
  last_checked: 2026-11-25

homepage: https://stoic2021.grand-challenge.org/
repository: null
dataset_url: null
leaderboard_url: null
leaderboard_url_note: The Qualification, Qualification (last submission) and Final leaderboards were
  not read; they show participants' user names.

metrics:
  - stoic2021-severity-auc
  - stoic2021-covid-auc
metrics_note: P3-S6-T06. The challenge's ranking AUC, computed over RT-PCR-positive cases only, and
  the feedback AUC for COVID-19 presence over all cases; two different populations, so the two are
  separate records and neither is a generic AUC.

tags:
  - covid-19
  - chest-ct
  - prognosis
  - sequestered-data
  - challenge

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P3-S6-T06)
  added_on: 2026-11-25
  last_verified: 2026-11-25
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2306-10484-v2
    - src-gc-stoic2021-home
  confidence: medium
  review_checks:
    - check: lifecycle is null because no use after 2023 was found; an arXiv abstract search on
        STOIC and COVID returned nothing newer. A full-text search, or the reopened leaderboards if
        they exist, may show use.
      field: lifecycle
    - check: submission_limit records test set A2's one per team, the qualification phase's ranking
        submission. Test set A1 enforced seven days between submissions, and the final phase took
        one training codebase per finalist.
      field: data.submission_limit
      source: src-arxiv-2306-10484-v2
      quote: A count-down time between submissions of seven days was enforced.
    - check: activity closed rests on the paper's closing date for both qualification test sets;
        whether the leaderboards reopened for post-challenge submissions, as on other Grand
        Challenge challenges, was not read.
      field: activity
    - check: The final phase's numbers come from models the organisers trained on sequestered data,
        the qualification phase's from models trained on the 2,000 public scans; the two are not
        comparable, and training_data_policy alone may not say so. A subset per phase may be needed.
      field: comparability.material_extra
      source: src-arxiv-2306-10484-v2
      quote: The organizers successfully trained six of the eight Final phase submissions.
    - check: prize-sponsored-by-industry is set for AWS, which sponsored the challenge, paid the
        prizes in credits and hosted the training; AWS is not an evaluated party, so
        funded-by-evaluated-party was not set.
      field: governance.independence_flags
      source: src-gc-stoic2021-home
      quote: This challenge is sponsored by AWS and endorsed by MICCAI.
    - check: maintainer and maintainer_type rest on passages that name people and are not quoted;
        confirm from the paper's affiliations.
      field: governance.maintainer
  personal_data_excluded:
    - source: src-arxiv-2306-10484-v2
      what: The author list, the corresponding author's contact line, repository handles named after
        a person, and team names in the results table.
    - source: src-gc-stoic2021-home
      what: An organiser's e-mail address in the mailto links.

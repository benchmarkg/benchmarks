# data/benchmarks/medicine-health/ehrshot.yaml
#
# P1-S6-T03, medicine-health entry 9 of 10. Filled from the EHRSHOT paper, arXiv 2307.02028 read as its v3 PDF
# (2023-12-11), and its abstract page; the ehrshot-benchmark repository README at main; the dataset's public
# Redivis page (its schema.org description only: no account was made and no agreement accepted); the project site
# (ehrshot.stanford.edu, served from som-shahlab.github.io/ehrshot-website) and its leaderboard page and
# leaderboard data file; and the v1 PDF of BERT-LER (arXiv 2608.20315, MLHC 2026), a paper from outside the
# maintainers that reports results on it. Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.

id: ehrshot
name: EHRSHOT
tagline: 15 few-shot clinical prediction tasks on the structured, longitudinal EHRs of 6,739
  Stanford Medicine patients.
description: >
  A benchmark for few-shot evaluation of foundation models on structured electronic health records,
  from Nigam Shah's lab at Stanford. It releases the deidentified, longitudinal coded records of 6,739
  Stanford Medicine patients (41.6 million clinical events over 921,499 visits, not restricted to ICU
  or emergency stays, with no notes or images), canonical train, validation and test splits, and
  labels for 15 classification tasks in four groups: operational outcomes (long length of stay,
  30-day readmission, ICU transfer), anticipating lab test results (five labs, scored as normal
  versus abnormal), assignment of a new diagnosis within a year (six diseases), and anticipating the
  14 findings of the next chest X-ray report. A model is trained on k positive and k negative
  examples per task, k from 1 to 128, and scored by AUROC and AUPRC on the full test split, with the
  whole training split as a last point. The data and the maintainers' foundation model,
  CLMBR-T-base (141M parameters, pretrained on 2.57M Stanford patients), are released under a
  research data use agreement. The maintainers' leaderboard holds their own baselines and models.
self_description:
  source: src-arxiv-2307-02028-v3
  quote: We release EHRSHOT, a longitudinal EHR benchmark for the few-shot evaluation of clinical
    FMs
external_ids:
  arxiv: '2307.02028'
paper:
  title: 'EHRSHOT: An EHR Benchmark for Few-Shot Evaluation of Foundation Models'
  arxiv: '2307.02028'
  version_read: v3
  source: src-arxiv-2307-02028-v3
released: 2023-07-05
released_note: The paper's first arXiv version, as its abstract page dates it; v3 followed on
  2023-12-11.
released_source: src-arxiv-2307-02028
released_quote: Submitted on 5 Jul 2023
release_venue: NeurIPS 2023, Datasets and Benchmarks track
release_venue_note: The v3 PDF still reads as a submission. The project site cites the paper in
  Advances in Neural Information Processing Systems 36 (2023) and links the proceedings' Datasets
  and Benchmarks PDF.
release_venue_source: src-arxiv-2307-02028-v3
release_venue_quote: Submitted to the 37th Conference on Neural Information Processing Systems
  (NeurIPS 2023) Track on Datasets and Benchmarks

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/ehr-prediction
domain_basis:
  reason: Every task predicts a clinical outcome or finding for a patient from the coded, structured
    record of their care up to a prediction time, which is ehr-prediction's definition.
  source: src-arxiv-2307-02028-v3
  quote: Records include demographics, diagnoses, procedures, laboratory results, medications, and
    other structured data
domain_considered_and_rejected:
  - term: medicine-health/diagnosis-triage
    reason: The six new-diagnosis tasks ask whether a first diagnosis will be recorded within a year
      of discharge, a prognosis from the record, not a diagnosis produced from a presented case.
  - term: medicine-health/medical-imaging-diagnostic
    reason: The chest X-ray task anticipates the findings of the next report 24 hours before it is
      recorded, from the structured record; no image is an input.
    source: src-arxiv-2307-02028-v3
    quote: The prediction time is 24 hours before the radiology report is recorded
capability:
  - sample-efficiency
  - temporal-reasoning
capability_basis:
  sample-efficiency:
    reason: The budget is the benchmark. A model sees k positive and k negative training examples
      per task, k in 1, 2, 4, 8, 12, 16, 24, 32, 48, 64 and 128, drawn from canonical k-shot samples
      the release fixes, and AUROC and AUPRC are scored at each k on the whole test split. The
      leaderboard reports a few-shot view beside the full-data one.
    source: src-arxiv-2307-02028-v3
    quote: We also provide canonical k-shot samples for each few-shot evaluation task
  temporal-reasoning:
    reason: Every label is defined by a window after the prediction time (an admission's duration,
      30 days after discharge, one year after discharge, the next lab result or report), and the
      model sees only events before that time, so whether an outcome counts depends on when it
      happened relative to the prediction. Long length of stay is itself a duration.
    source: src-arxiv-2307-02028-v3
    quote: Time Horizon is the length of time considered after the prediction time to determine
      whether an event occurs
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The paper names task adaptation of pretrained models as a benefit to evaluate, but the
      benchmark scores only the 15 target tasks. Pretraining is the entrant's own choice, and no
      source-setting score is reported beside the target.
  - term: distribution-shift-generalization
    reason: All splits come from one institution's patients; the paper lists performance at other
      institutions as a limitation, not a scored condition.
  - term: scientific-prediction
    reason: The tasks predict hospital outcomes, lab results and diagnoses for health-system use;
      the claim is clinical prediction from records, not a property of a natural system measured by
      experiment.

evaluation_method:
  - classification-metric
evaluation_method_basis:
  reason: Every task is scored by AUROC and AUPRC against its labels on the test split, averaged
    over 5 replicates of the k-shot draw and macro-averaged within each task group.
  source: src-arxiv-2307-02028-v3
  quote: We measure the AUROC and AUPRC of each model on each task
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Built to evaluate foundation models pretrained on structured EHR data and adapted to
    clinical tasks; the maintainers' CLMBR-T-base is probed with a logistic-regression head over its
    frozen representations. Count-based GBM, logistic regression and random forest models trained on
    the k examples are the baselines.
  source: src-arxiv-2307-02028-v3
  quote: our benchmark is designed for evaluating pretrained FMs on a broad range of tasks
as_used:
  - protocol: Fine-tuned on each task's whole training split rather than at the k-shot budgets, on
      14 of the 15 tasks (Chest X-ray Findings left out), and scored by ROC-AUC on the canonical
      test split.
    split: test (canonical)
    source: src-arxiv-2608-20315-v1
    quote: We follow the benchmark protocol and report results using the canonical
      train/validation/test splits provided with the release
    note: BERT-LER (Sanofi with Carnegie Mellon, MLHC 2026), pretrained on another provider's
      records and mapped to EHRSHOT's codes through UMLS.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against it by groups outside the maintainers; BERT-LER, posted
    on 2026-08-20 and accepted at MLHC 2026, reports on 14 of its tasks. The repository was last
    pushed on 2025-06-06 (GitHub API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2608-20315-v1
  quote: We benchmark our approach on the public EHRShot benchmark suite
activity: no-submission-channel
activity_note: The leaderboard holds five systems, the paper's three count-based baselines,
  CLMBR-T-base and MOTOR-T-base, all run by the maintainers (the leaderboard data gives run dates of
  2023-07-01 and 2024-01-15). No page read describes a way for anyone else to add a result.
activity_basis:
  reason: Users run the released code on their own DUA copy and report in their own papers, and the
    maintainers' leaderboard lists only models they ran.
  source: src-ehrshot-leaderboard
  quote: MOTOR-T-base The foundation model released in the MOTOR paper with frozen weights and a
    task-specific logistic regression head

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: CLMBR-T-base
    source: src-ehrshot-leaderboard
    observed_on: 2026-10-14
    quote: CLMBR-T-base The foundation model released in the EHRSHOT paper with frozen weights and a
      task-specific logistic regression head
  - system: MOTOR-T-base
    source: src-ehrshot-leaderboard-data
    observed_on: 2026-10-14
    quote: '"MOTOR-T-base": { "runDate": "2024-01-15" }'
    note: The leaderboard's run date for the second foundation model on the board.
  - system: BERT-LER
    source: src-arxiv-2608-20315-v1
    observed_on: 2026-10-14
    quote: Our BERT-LER model shows superior performance in most tasks
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Labels are outcomes recorded in the patients' records after the prediction
  time (stays, readmissions, transfers, lab results, new diagnosis codes). The chest X-ray labels
  are the CheXpert NLP labeler's output on the report text, which is not released.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The code is public, and the DUA download carries the data, splits, labels, k-shot samples,
    the model weights and the maintainers' raw results, so any approved researcher can rerun the
    benchmark end to end.
  source: src-github-ehrshot-benchmark-readme
  quote: Use the following steps to run the EHRSHOT benchmark

task:
  exists: true
  input:
    - a patient's coded structured EHR timeline (diagnoses, procedures, medications, lab results,
      visits, demographics) up to the task's prediction time
    - k positive and k negative labelled training examples for the task, and as many for validation
  output: A score for the task's label, binary for operational outcomes and new diagnoses, normal
    versus abnormal for the lab tasks as the paper scores them, and 14 finding labels for the chest
    X-ray task.
  scoring: AUROC and AUPRC on each task's test split at each k from 1 to 128 and on the full
    training split, averaged over 5 replicates; macro-averaged within each of the four task groups.
  source: src-arxiv-2307-02028-v3
  quote: For each of the 15 benchmark tasks, we steadily increase the number of examples k that each
    model sees from k = 1 to the full training dataset

# --- Data ------------------------------------------------------------------------------------

data:
  access: credentialed-dua
  access_note: The dataset is on Redivis, where a user must sign in with an institutional e-mail
    account, show a verified academic, government or similar affiliation and be approved; the
    agreement is the Stanford University Dataset Research Use Agreement, for non-commercial research
    only and forbidding redistribution. The CLMBR-T-base weights on Hugging Face also need a signed
    research usage agreement. The Redivis page's public description is cut off partway through its
    list of requirements, so whether training certification is among them was not read.
  access_basis:
    reason: Access needs the maintainers' approval of a researcher's verified identity and a signed
      data use agreement, which is credentialed-dua and gated-registration's exclusion.
    source: src-arxiv-2307-02028-v3
    quote: we release our dataset under a data usage agreement that requires researchers to register
      with their identity and gain approval before accessing the dataset
  refresh: versioned-releases
  refresh_basis:
    reason: The dataset is distributed in labelled versions on Redivis, at 3.2 when read, and the
      leaderboard names that version. The README notes that the released labels differ slightly from
      the paper's counts, and an OMOP variant with different data was added beside the original.
    source: src-ehrshot-redivis
    quote: '"version":"3.2"'
  data_provenance:
    - patient-clinical-record
  data_provenance_note: Deidentified structured records from Stanford's STARR OMOP-CDM research
    repository (Stanford Health Care and Lucile Packard Children's Hospital), with dates jittered,
    patients under 19 or over 88 removed and free text removed. Patients were sampled so each task
    has enough positive labels for few-shot use.
  data_provenance_source: src-arxiv-2307-02028-v3
  data_provenance_quote: We sourced the data for our benchmark from the Stanford Medicine Research
    Data Repository (STARR)
  contamination_risk: unknown
  contamination_risk_note: Not assessed in the sources read. The data is not public and its terms
    forbid redistribution, which works against a web route, but the test labels ship with the data
    to every approved user, and the maintainers' models were pretrained on the same STARR source,
    where the paper says a global train/validation/test split was drawn first. No source checks
    whether other entrants' pretraining data holds these patients.
  contamination_evidence: []
  dataset_licence: Stanford University Dataset Research Use Agreement (non-commercial research use,
    no redistribution)
  dataset_licence_source: src-arxiv-2307-02028-v3
  dataset_licence_quote: The license for the dataset is the standard Stanford University Dataset
    Research Use Agreement
  size:
    - count: 6739
      unit: patients
      source: src-arxiv-2307-02028-v3
      quote: EHRSHOT contains the full coded medical timelines of 6,739 patients from Stanford
        Medicine
    - count: 15
      unit: classification tasks (3 operational outcomes, 5 lab results, 6 new diagnoses, 1 chest
        X-ray findings)
      source: src-arxiv-2307-02028-v3
      quote: We define 15 tasks as part of our benchmark
    - count: 41661637
      unit: clinical events
      source: src-github-ehrshot-benchmark-readme
      quote: 41,661,637 clinical events

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Shah Lab, Stanford Medicine (Nigam Shah's group)
  maintainer_basis:
    reason: The paper's authors are at Stanford, the code sits in the som-shahlab GitHub
      organisation, and the dataset is published in the Shah Lab's catalogue on Stanford's Redivis.
    source: src-ehrshot-redivis
    quote: Shah Lab Data Portal
  maintainer_type: academic-lab
  submission_process:
    - maintainer-run
  submission_process_note: The maintainers keep a leaderboard of systems they ran themselves, the
    paper's baselines and two of their own foundation models; nobody else submits. Results by others
    appear in their own papers.
  submission_process_source: src-github-ehrshot-benchmark-readme
  submission_process_quote: contains raw results from our running of our benchmark on the baseline
    models
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-ehrshot-leaderboard
      quote: CLMBR-T-base The foundation model released in the EHRSHOT paper with frozen weights and
        a task-specific logistic regression head
  independence_flags_note: CLMBR-T-base was pretrained by the benchmark's authors and released with
    it, and it is the paper's headline model and a leaderboard row. MOTOR-T-base, the other
    foundation model on the board, is described as from the MOTOR paper, whose authors were not read
    here.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Once the DUA download is in place, run_all.sh produces every score with no human or
      maintainer-only step. The agreement is the only obstacle, which the tier allows beside the
      licence-restriction blocker.
    source: src-github-ehrshot-benchmark-readme
    quote: Run** the benchmark end-to-end with
  reproducibility_blockers:
    - licence-restriction
  reproducibility_blockers_note: Each user must hold an approved copy under the research use
    agreement, which forbids redistributing the data and allows non-commercial research only.
  reproducibility_blockers_source: src-arxiv-2307-02028-v3
  reproducibility_blockers_quote: YOU MAY NOT DISTRIBUTE, PUBLISH, OR REPRODUCE A COPY of any
    portion or all of the EHRSHOT Dataset to others without specific prior written permission from
    the School of Medicine
  harness_availability: official-harness
  harness: ehrshot-benchmark (run_all.sh over the FEMR pipeline; Linux with CUDA)
  harness_source: src-github-ehrshot-benchmark-readme
  harness_quote: Use the following steps to run the EHRSHOT benchmark
  code_licence: Apache-2.0
  code_licence_source: src-github-ehrshot-benchmark-readme
  code_licence_quote: The source code of this repo is released under the Apache License 2.0
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which tasks (all 15, or 14 without chest X-ray as BERT-LER reports) and which data
  # version (Original or OMOP); k, the labelled examples per class (recorded as shots), or the full training split,
  # with how many replicate draws were averaged; and what the model was pretrained on (Stanford STARR, another
  # institution's records, none).
  material_extra:
    - subset_used
    - shots
    - training_data_policy

homepage: https://ehrshot.stanford.edu/
repository: https://github.com/som-shahlab/ehrshot-benchmark
dataset_url: https://redivis.com/datasets/53gc-8rhx41kgt
leaderboard_url: https://som-shahlab.github.io/ehrshot-website/leaderboard/paper/

tags:
  - ehr
  - structured-data
  - few-shot
  - foundation-models
  - clinical-prediction
  - data-use-agreement

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2307-02028-v3
    - src-arxiv-2307-02028
    - src-github-ehrshot-benchmark-readme
    - src-ehrshot-redivis
    - src-ehrshot-site
    - src-ehrshot-leaderboard
    - src-ehrshot-leaderboard-data
    - src-arxiv-2608-20315-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, with windows that keep the authors' contact
    lines out; its abstract page for the date and the access statement; the README at main; the Redivis
    dataset page read without an account, whose schema.org description is the only public text; the
    project site and leaderboard page with scripts and styles stripped, and the leaderboard's data file;
    and BERT-LER's v1 PDF as evidence of current use outside the maintainers.
  confidence: medium
  review_checks:
    - check: data.access is credentialed-dua on the paper's register-and-approve terms and Redivis's
        verified-affiliation rule. credentialed-dua's definition also names training certification,
        and the public description is cut off before the end of its requirements list; if no
        training is required, gated-registration's exclusion still sends approval of verified
        credentials here, but confirm.
      field: data.access
      source: src-ehrshot-redivis
      quote: You must authenticate to Redivis using your formal affiliation's email address
    - check: activity no-submission-channel and submission_process maintainer-run rest on the
        leaderboard holding only the maintainers' runs. The homepage invites comparison with "other
        submissions", but no page read describes a submission route; if one exists, both change.
      field: activity
      source: src-ehrshot-site
      quote: Compare your model to strong baselines and other submissions using our leaderboard
    - check: maintainer-competes-on-own-benchmark rests on CLMBR-T-base, the maintainers' own model
        released with the benchmark. Whether MOTOR-T-base is also theirs was not read.
      field: governance.independence_flags
      source: src-ehrshot-leaderboard
      quote: MOTOR-T-base The foundation model released in the MOTOR paper with frozen weights and a
        task-specific logistic regression head
    - check: temporal-reasoning rests on every label being defined by a window after the prediction
        time; no source names temporal reasoning as what EHRSHOT tests.
      field: capability
    - check: sample-efficiency describes the design, but BERT-LER (as_used) fine-tunes on the full
        training splits, and the leaderboard shows a full-data view beside the few-shot one.
      field: capability
      source: src-arxiv-2608-20315-v1
      quote: Models are fine-tuned for the 14 clinical prediction tasks on EHRShot data
    - check: refresh is versioned-releases on Redivis's version label (3.2) and the README's note
        that released counts differ from the paper's. What changed between Redivis versions was not
        read; if the Original files never changed after release, static fits better. Whether the
        OMOP variant (same patients, different data) should be a version is also open.
      field: data.refresh
      source: src-github-ehrshot-benchmark-readme
      quote: Note this is slightly different than reported in the original EHRSHOT paper due to
        dataset updates pre-release

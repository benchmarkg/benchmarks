curation:
  added_by: agent (P1-S6-T04)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2406-12036-v4
    - src-arxiv-2406-12036
    - src-neurips-2024-medcalc-bench
    - src-github-medcalc-bench-readme
    - src-github-medcalc-bench-releases
    - src-hf-api-medcalc-bench-v1-2
    - src-hf-api-medcalc-bench-v1-0
    - src-github-medcalc-bench-verified-readme
    - src-github-medcalc-bench-verified-releases
    - src-arxiv-2512-19691-v3
    - src-medhelm-leaderboard-v4-schema
  sources_note: >
    The paper's v4 PDF (a DOI, not archived) read as text, with windows that keep the correspondence line
    and the printed patient notes out; its abstract page for the dates; the NeurIPS proceedings page with
    scripts and styles stripped; both READMEs at pinned commits and both release lists from the GitHub
    API, unauthenticated, with the first author's account handles kept out of the extracts; Hugging Face's
    API records of v1.2 and of the gated v1.0, with no terms accepted; Ye et al.'s v3 PDF (a DOI) as an
    independent audit and evidence of current use; and MedHELM's v4.0.0 schema, already a Source of medhelm.
  confidence: medium
  review_checks:
    - check: MedCalc-Bench Verified is modelled as a version (revision) of this record, as OSWorld
        records OSWorld-Verified and tau-bench its move to tau2-bench. 04 S4 sends a derivative with
        a different maintainer or its own version numbering to a new benchmark with a lineage link,
        and Verified has both (the first author's personal accounts, v1.0.0 to v1.0.8). Against
        that, the original README and card hand users over to it, it keeps v1.2's 1,100 test items,
        task and scoring, the same account published the ncbi-nlp releases, and the audit calls it
        another revision. If it becomes its own entry, the maintainer, repository and history here
        revert to NCBI/NLM and government-agency.
      field: versions
      source: src-arxiv-2512-19691-v3
      quote: 'MedCalc-Bench-Verified: another revision (GitHub link, December 14 snapshot), also posted
        by an author of the original benchmark, with similarly extensive changes to the v1.0 release.'
    - check: v1.1 and v1.2 are recorded as revisions of the same items, but the audit estimates that
        about 70% of v1.0's test instances and annotations were replaced, which reads more like new
        items on the same task (an edition). The calculators, questions and scoring are unchanged.
      field: versions
      source: src-arxiv-2512-19691-v3
      quote: Our examination suggests that approximately 70% of test instances and annotations in
        the original v1.0 release were replaced, making this a partially overlapping but
        substantially different version of the same task.
    - check: lifecycle is under-revision on the stream of Verified releases (latest 2026-09-08). If
        the reviewer reads v1.0.8 as a finished release with no corrections in progress, active
        fits; the README only promises releases should corrections be needed.
      field: lifecycle
    - check: The v1.0 labels are held-out-labels, but they were produced by GPT-4 extraction and
        scripted aggregation, and the audit judges at least 27% likely wrong; no facet records
        model-derived reference labels (logged with bench tag-gap). A specialist should judge the
        audit's physician adjudication, which covers 50 instances.
      field: ground_truth_source
      specialist: true
      source: src-arxiv-2512-19691-v3
      quote: At least 27% of test labels are likely erroneous or incomputable.
    - check: knowledge-recall is rejected because the score is the computed value, although the
        paper names calculator recall as the first required capability and zero-shot errors are
        mostly of that type. A reviewer may prefer to tag it, since in the zero-shot settings
        nothing supplies the rule or equation.
      field: capability
      source: src-arxiv-2406-12036-v4
      quote: we add a one-shot exemplar in the prompt, showing the model how to apply the requested
        medical equations or rules
    - check: The dataset licence is CC-BY-SA 4.0 by the README and the v1.2 card, but the paper says
        the data can be distributed for any non-commercial purposes, which that licence does not
        restrict, and the re-posted v1.0 card declares cc-by-4.0.
      field: data.dataset_licence
      source: src-arxiv-2406-12036-v4
      quote: both the training and testing instances of the MEDCALC-BENCH dataset are released by
        the CC-BY-SA 4.0 license and can be distributed for any non-commercial purposes
    - check: The paper says clinicians synthesized the notes for eleven rule-based calculators; the
        current README calls them LLM-generated and then edited or approved by a clinician, and v1.1
        replaced the synthetic notes. model-generated follows the README; expert-authored would fit
        the paper's description of v1.0.
      field: data.data_provenance
      source: src-github-medcalc-bench-readme
      quote: synthesized by a clinician (LLM generated and then edited/approvied by a clinician)
    - check: harness_availability is reference-implementation-only because run.py is the paper's
        baseline reproduction for eight named models. It also scores each answer, so
        official-harness is arguable.
      field: execution.harness_availability
    - check: diagnosis-triage is a secondary, and the rule-based subset's primary, on the reading
        that risk, severity and diagnostic scores grade a presented case. MedHELM's entry puts the
        whole benchmark under diagnosis-triage; the output is always a calculator value, so
        clinical-qa stays primary here.
      field: domain
      source: src-arxiv-2406-12036-v4
      quote: Medical calculators are statistical tools derived from high-quality clinical studies,
        serving various purposes, including metric conversions [7], disease diagnosis [18], and
        prognosis prediction [11].
    - check: The subset counts are v1.0's (20 notes per calculator at most). v1.2 and Verified have
        1,100 test items, but their per-category counts were not read.
      field: subsets
    - check: Which MedCalc-Bench version MedHELM's scenario and Anthropic's reported results use was
        not read; the audit reports that the latter sit closer to v1.0 than to v1.2.
      field: as_used

# data/benchmarks/medicine-health/brats.yaml
#
# P1-S6-T03, medicine-health entry 5 of 10. Filled from the BraTS 2026 cluster's Synapse project (syn74274097),
# read through Synapse's public REST API as the markdown of its home, Challenge Rules, Submit Instructions,
# Timeline, News & Updates and BraTS-GoAT Data wiki pages; the 2026 structured challenge proposal (Zenodo
# record 19714728, read as its record page and the text of its PDF); the original BRATS benchmark paper (Menze
# et al., IEEE TMI 2015), read as its accepted manuscript on HAL (hal-00935640v2); the 2012-2018 retrospective
# (arXiv 1811.02629, v3 PDF); the BraTS 2021 benchmark paper (arXiv 2107.02314, v2 PDF); CBICA's BraTS series
# page at the University of Pennsylvania; and the abstract page of a September 2026 BraTS-METS participant paper
# (arXiv 2609.11477). Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.

id: brats
name: BraTS
aliases:
  - Brain Tumor Segmentation Challenge
  - BRATS
  - BraTS Cluster of Challenges
  - Brain TumorS
tagline: 'Yearly MICCAI brain tumour challenge since 2012: tumour sub-region segmentation in MRI, now
  a cluster of five tasks.'
description: >
  The Brain Tumor Segmentation challenge, held with MICCAI every year since 2012; 2026 is its 15th
  edition. Systems delineate tumour sub-regions (enhancing tumour, tumour core, whole tumour and, in
  later tasks, others such as the resection cavity) in multiparametric brain MRI (T1, contrast-enhanced
  T1, T2 and T2-FLAIR), scored case by case against reference annotations approved by expert
  neuroradiologists. Through 2021 each edition centred on adult glioma, the dataset growing from 50
  cases in 2012 to 2,040 in 2021, with side tasks on disease progression (2014-2016), overall
  survival (2017-2020) and MGMT promoter methylation (2021). From 2023 BraTS became a cluster of
  challenges covering brain metastases, meningioma, paediatric tumours and a sub-Saharan African
  population, MRI inpainting and histopathology classification; 2025 ran 11 challenges as a MICCAI
  Lighthouse challenge, and the acronym now reads Brain TumorS. The 2026 cluster has five: metastases,
  paediatric tumours, generalisation across tumour types (GoAT), inpainting and glioblastoma pathology.
  Participants train on released data and tune on an unlabelled validation set; since 2021 they submit
  a Docker container, backed by a mandatory short paper, that the organisers run on a hidden test set
  on Synapse. Teams are ranked by case-wise cumulative ranks across the metrics (Dice with a surface
  distance: 95% Hausdorff in the 2017-2021 editions, Normalized Surface Distance in 2026), with
  pairwise permutation tests deciding which differences are significant.
self_description:
  source: src-synapse-brats-2026-home
  quote: Since its inception at MICCAI 2012, the Brain Tumor Segmentation (BraTS) Challenge has
    advanced brain tumor image analysis by benchmarking algorithmic innovations
paper:
  title: The Multimodal Brain Tumor Image Segmentation Benchmark (BRATS)
  doi: 10.1109/TMI.2014.2377694
  source: src-hal-00935640-v2
released: 2012-10-01
released_note: The first edition's on-site challenge at MICCAI 2012 in Nice, as the original paper
  dates it; training data had been released to registered teams earlier in 2012, on a date the
  sources do not give.
released_source: src-hal-00935640-v2
released_quote: benchmark was organized on October 1, 2012 in Nice, France, in a workshop held as
  part of the MICCAI 2012 conference
release_venue: MICCAI 2012

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-imaging-segmentation
  secondary:
    - vision/segmentation
    - vision/image-restoration-enhancement
    - medicine-health/medical-imaging-diagnostic
  per_edition: true
domain_basis:
  reason: Every edition's headline task delineates clinically defined tumour sub-regions in brain
    MRI, scored as masks against expert-approved annotations, which keeps medicine-health primary
    although Dice is a vision metric. The secondary leaves come from tasks that only some editions
    ran (per_edition), the union over the series. vision/segmentation follows the vocabulary's rule
    for medical masks. vision/image-restoration-enhancement is the inpainting task (2023 on), a
    voided region of a T1 scan filled in and scored against the real scan. The diagnostic leaf
    covers the histopathology classification (BraTS-Path), MGMT status from MRI (2021) and the 2026
    lesion-detection arm.
  source: src-zenodo-19714728-proposal
  quote: (Challenge 1) Segmentation of brain metastases sub-regions in pre- and post-treatment MRI
    scans
domain_considered_and_rejected:
  - term: vision/medical-imaging-cv
    reason: Scored by Dice and surface distance, but on clinically defined tumour sub-regions
      against neuroradiologists' reference masks, which the term's exclusion test sends to
      medicine-health; the vocabulary names this benchmark as its near miss.
capability:
  - perception
  - distribution-shift-generalization
  - generation-fidelity
capability_basis:
  perception:
    reason: The input is raw multi-contrast MRI volumes (and, in BraTS-Path, digitized H&E tissue
      patches), and the score measures the tumour structure recovered from them.
    source: src-hal-00935640-v2
    quote: Twenty state-of-the-art tumor segmentation algorithms were applied to a set of 65
      multi-contrast MR scans of low- and high-grade glioma patients
  distribution-shift-generalization:
    reason: BraTS-GoAT scores one segmentation algorithm across tumour types and populations
      (glioma, meningioma, metastases, paediatric tumours, sub-Saharan African patients) with the
      label set fixed across them, so only the inputs move; its test composition is not disclosed.
      The source calls new tumour entities unseen tasks; the vocabulary's tie-break makes that
      distribution shift. The 2021 edition also scored an out-of-distribution test cohort (Baid et
      al.).
    source: src-zenodo-19714728-proposal
    quote: We aim to simulate the clinical scenario where we develop a segmentation tool agnostic to
      future clinical applications (i.e., a tool trained on a specific disease(s) that will be
      applied to new ones)
  generation-fidelity:
    reason: The inpainting task scores a synthesized T1 region against the scan's real tissue by
      SSIM, PSNR and RMSE.
    source: src-zenodo-19714728-proposal
    quote: The Structural similarity Index (SSIM) is used to evaluate the quality of brain
      structures in synthetic images
capability_considered_and_rejected:
  - term: transfer-learning
    reason: GoAT's tumour types share one label set and only the patient population moves, which the
      inclusion test of distribution-shift-generalization takes whatever the source calls the move;
      the vocabulary names this benchmark as transfer-learning's near miss.
  - term: sample-efficiency
    reason: GoAT asks for generalisation with little data on the target classes, but no edition
      fixes a data budget and scores performance at it.
  - term: scientific-prediction
    reason: The overall-survival task (2017-2020) and the MGMT task (2021) predicted patient
      outcomes or molecular status, but as side tasks beside the segmentation that every edition
      ranks.

evaluation_method:
  - domain-metric
  - classification-metric
  - statistical-fit
  - composite
  - entrant-relative-ranking
evaluation_method_basis:
  reason: Segmentation is scored by Dice with a surface distance (95% Hausdorff in the 2017-2021
    editions, Normalized Surface Distance in 2026), field-specific measures. Detection (2026 METS)
    and BraTS-Path use F1, MCC, AUC, sensitivity and specificity, general classification statistics.
    Inpainting uses RMSE and PSNR, general fit statistics, with SSIM. The final ranking aggregates
    case-wise ranks across metrics of these different kinds (composite), and a team's rank depends
    on who else entered (entrant-relative-ranking).
  source: src-zenodo-19714728-proposal
  quote: Ranking of methods will be based on the aggregate of rankings of Dice and NSD for
    segmentation and Sensitivity/Specificity for detection.
evaluation_method_considered_and_rejected:
  - term: reference-metric
    reason: Its inclusion test is text similarity (BLEU, ROUGE, word error rate); BraTS compares
      masks and images with field-specific or general statistics.
  - term: model-derived-metric
    reason: The 2026 inpainting task introduces experimental metrics computed from grey- and
      white-matter segmentation of the inpainted scans, but they do not enter the ranking, which
      uses SSIM, PSNR and RMSE.
    source: src-zenodo-19714728-proposal
    quote: we are introducing experimental metrics based on grey- and white-matter segmentation
      performance
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are fully automated algorithms trained for a task neuro-oncology defines, tumour
    sub-region segmentation, mostly on the challenge's own training data; the vocabulary names
    tumour segmentation as this term's case.
  source: src-zenodo-19714728-proposal
  quote: We are seeking the development of automated algorithms.
as_used:
  - protocol: Results reported on the 2026 METS validation leaderboard (unranked, labels hidden) and
      in five-fold cross-validation on the training cases, scored with the official evaluation code,
      before the hidden test results were released.
    split: validation
    source: src-arxiv-2609-11477
    quote: on the official validation leaderboard
    note: Liu and Wang (September 2026), an nnU-Net ensemble entered in BraTS-METS 2026. Papers
      written during an edition can report validation scores only; test scores reach participants
      later.

lifecycle: active
lifecycle_basis:
  reason: The 2026 edition ran its five challenges through 2026, with containers due on 30 July and
    rankings scheduled for the MICCAI satellite event on 1 October 2026, and participant papers
    reporting on it appeared in September 2026.
  source: src-synapse-brats-2026-home
  quote: Overall BraTS 2026 Rankings & Awards Ceremony
activity: between-rounds
activity_basis:
  reason: Every 2026 queue, the validation leaderboard's included, closed on 30 July; the rankings
    were scheduled for the satellite event on 1 October 2026, two weeks before this entry was read,
    and no 2027 edition is announced in the sources read. No source read shows the rankings
    themselves (see review_checks).
  source: src-synapse-brats-2026-timeline
  quote: submission queues, including to the Validation Leaderboard, will close.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: NVDLMED (Myronenko, NVIDIA), first in BraTS 2018 segmentation
    source: src-arxiv-1811-02629-v3
    observed_on: 2026-10-14
    quote: 1 NVDLMED Andriy Myronenko NVIDIA, Santa Clara, USA
  - system: A five-fold nnU-Net ResEnc-L ensemble (Liu and Wang), BraTS-METS 2026
    source: src-arxiv-2609-11477
    observed_on: 2026-10-14
    quote: We build a pragmatic pipeline on a 5-fold nnU-Net ResEnc-L ensemble
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Reference masks drawn or refined by annotators and approved by
  board-certified neuroradiologists (class labels from neuropathologists for BraTS-Path; the real T1
  scan for inpainting), held back for the validation and test cases.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test cases behind every ranking stay with the organisers, who run the submitted
    containers on them; the validation labels are not released either.
  source: src-zenodo-19714728-proposal
  quote: The organizers will then confirm receiving the containerized method and will evaluate it in
    the hidden testing data.

task:
  exists: true
  input:
    - multiparametric brain MRI of one patient (pre-contrast T1, contrast-enhanced T1, T2,
      T2-FLAIR), at one or more timepoints
    - for inpainting, a T1 scan with the tumour region voided and the mask of the region to fill
    - for BraTS-Path, one patch of a digitized H&E-stained tissue section
  output: A voxel-wise label map of the tumour sub-regions (segmentation tasks), a synthesized T1
    volume (inpainting) or one of ten histologic classes (pathology).
  scoring: Per case and sub-region, Dice with a surface distance (lesion-wise in the later
    segmentation tasks); each team is ranked against the others per case, region and metric, the
    ranks are averaged over cases into a final ranking score, and pairwise permutation tests decide
    which differences are significant.
  tests_hidden_from_system: true
  source: src-arxiv-1811-02629-v3
  quote: The ranking scheme followed during the BraTS 2017 and 2018 comprised the ranking of each
    team relative to its competitors for each of the testing subjects

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: Training data with labels and validation inputs without labels are released to
    registered participants through Synapse, behind a data-access request and the challenge terms;
    parts are also on TCIA. The test cases are run only by the organisers, which decides the term
    before the gate.
  access_basis:
    reason: The rankings are computed on hidden test data that the organisers run the entrants'
      containers on; the inputs, not only their labels, stay with the organisers, and the validation
      labels are not released either.
    source: src-synapse-brats-2026-goat-data
    quote: test datasets and validation GT labels will not be released to the public.
  refresh: periodic-recompetition
  refresh_basis:
    reason: A dated edition every year since 2012, each ranked on its own test data at the family
      level, with the task line-up changing; BraTS-METS 2026 reusing the 2025 dataset does not
      change the family's value.
    source: src-synapse-brats-2026-home
    quote: the 15th BraTS cluster of challenges at
  data_provenance:
    - real-world-instrument
    - expert-authored
  data_provenance_note: Routine clinical MRI from many institutions and scanners (and, for
    BraTS-Path, clinically scanned TCGA tissue sections). Reference labels are drafted by annotators
    of varying rank, often from fused algorithm outputs, and approved by experienced
    neuroradiologists.
  data_provenance_source: src-zenodo-19714728-proposal
  data_provenance_quote: The provided data describe mpMRI scans, acquired with different clinical
    protocols and various scanners from
  contamination_risk: medium
  contamination_risk_note: Containers run on hidden test cases, which works against leakage. But
    part of the scored data is public in other forms. BraTS-PEDs' treatment-naive cohort, its 109
    test cases among them, is released on TCIA, BraTS-Path's slides are public TCGA images, and
    BraTS-METS 2026 reuses its 2025 test set. The rules forbid pretrained models built on earlier
    BraTS data, so a route is plausible but no source evidences one.
  contamination_risk_source: src-zenodo-19714728-proposal
  contamination_risk_quote: We have publicly released treatment-naïve data for 457 pediatric
    patients with high-grade gliomas through TCIA
  contamination_evidence: []
  ceiling_anchor_type: noise-ceiling
  ceiling_anchor_type_basis:
    reason: The organisers judge a task solved when models reach the inter- and intra-rater
      variability of the expert annotations that are the ground truth, measured in a re-annotation
      study for BraTS 2025. The 2012-2013 analysis made the same comparison against inter-rater
      agreement.
    source: src-zenodo-19714728-proposal
    quote: AI models reached the threshold of human expert inter-/intra-rater variability, as
      determined in an extensive re-annotation study for BraTS 2025 to quantify expert variance
  dataset_licence: CC-BY-NC-4.0
  dataset_licence_note: The challenge rules put BraTS data under CC BY-NC unless otherwise
    indicated. The 2026 proposal states CC BY for the METS and Path data and CC BY with a CC BY-NC
    fallback for PEDs and GoAT; the rules page, which participants accept, is recorded here.
  dataset_licence_source: src-synapse-brats-2026-rules
  dataset_licence_quote: BraTS data is subject to a [CC BY-NC
    license](https://creativecommons.org/licenses/by-nc/4.0/), unless otherwise indicated
  size:
    - count: 2040
      unit: patients' pre-operative mpMRI scans (1,251 training, 219 validation, 570 test)
      subset: 2021 edition (adult glioma)
      source: src-arxiv-2107-02314-v2
      quote: in pre-operative baseline mpMRI data from 2,040 patients
    - count: 1778
      unit: cases (1,296 training, 179 validation, 303 test)
      subset: 2026 BraTS-METS (Challenge 1)
      source: src-zenodo-19714728-proposal
      quote: 'Total amount of cases: 1778 (1046 pre-operative and 732 post-treatment)'
    - count: 130
      unit: test cases (timepoints) from 116 subjects
      subset: 2026 BraTS-PEDs (Challenge 2)
      source: src-zenodo-19714728-proposal
      quote: 'Testing: 116 subjects, 130 cases (timepoints)'
    - count: 1251
      unit: training cases (219 validation; 568 glioma and 277 meningioma test cases)
      subset: 2026 BraTS-Inpainting (Challenge 4)
      source: src-zenodo-19714728-proposal
      quote: 'Training data: 1251 cases; Validation data: 219 cases; Testing data glioma: 570-2 = 568
        (two excluded) cases'
    - count: 660
      unit: cases (369 training, 125 validation, 166 test)
      subset: 2020 edition
      source: src-arxiv-2107-02314-v2
      quote: 2020 660 369 125 166 Segmentation Survival prediction Pre-operative
    - count: 542
      unit: cases (285 training, 66 validation, 191 test)
      subset: 2018 edition
      source: src-arxiv-1811-02629-v3
      quote: 2018 542 285 66 191 Segmentation Pre-operative only Survival prediction
    - count: 50
      unit: cases (35 training, 15 test)
      subset: 2012 edition
      source: src-arxiv-1811-02629-v3
      quote: 2012 50 35 N/A 15 Segmentation Pre-operative only
  submission_limit:
    max_submissions: 2
    period_days: 0
    per: team, in the final testing phase (2026 proposal; multiple validation submissions are
      allowed)
    source: src-zenodo-19714728-proposal

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The BraTS organisers, MICCAI challenge committees that re-form by edition and task,
    started in 2012 by Menze and colleagues and coordinated in later editions by Spyridon Bakas's
    group (CBICA at the University of Pennsylvania, now Indiana University), with RANO, RSNA, ASNR,
    ASFNR, ESNR, CBTN and the NIH as partners in 2026
  maintainer_basis:
    reason: The 2026 proposal has 24 authors from 17 institutions (its Zenodo record lists them) and
      names the partner societies; each challenge has its own organising team, and the challenges
      run on Synapse with Sage Bionetworks.
    source: src-zenodo-19714728-proposal
    quote: The BraTS 2026 Cluster of Challenges is a multi-society multi-institutional collaborative
      effort
  maintainer_type: conference-workshop
  maintainer_type_note: academic-lab was considered, since one group has coordinated the later
    editions (CBICA at the University of Pennsylvania, now Indiana University), and consortium for
    the society partnership, which no source gives a legal form. The term's override takes a
    recurring MICCAI challenge whose organising teams change between editions.
  submission_process:
    - containerized-algorithm-submission
    - publication-gated
    - held-out-server
  submission_process_note: Since 2021 the ranking runs each team's Docker container, without network
    access, on hidden test data on Synapse, at most two submissions per team in 2026. A short paper
    is mandatory for the container to be run, and top-ranked teams must have a published article
    before the announcement. During the validation phase teams upload predictions for unlabelled
    validation cases to an unranked leaderboard. Before 2021 teams submitted predictions, in 2017
    and 2018 within a 48-hour test window.
  submission_process_source: src-synapse-brats-2026-submit
  submission_process_quote: Failure to provide a short paper will disqualify your Docker submission
    from evaluation and final ranking.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-zenodo-19714728-proposal
      quote: The organizers will then confirm receiving the containerized method and will evaluate
        it in the hidden testing data.
    - flag: maintainer-competes-on-own-benchmark
      source: src-zenodo-19714728-proposal
      quote: May participate but organizers and their immediate groups cannot be 1) eligible for
        awards, 2) announced as the winners of the challenge, or 3) included in the announced formal
        rankings
    - flag: prize-sponsored-by-industry
      source: src-arxiv-2107-02314-v2
      quote: monetary prizes of total value of $60,000, sponsored by Intel, RSNA, and NeoSoma Inc.
  independence_flags_note: Organisers' groups may submit and are evaluated, but are kept out of
    awards and the formal rankings. Industry has sponsored prizes, Intel AI's $5,000 in 2018 and
    $60,000 from Intel, RSNA and NeoSoma in 2021; the 2026 prizes were unconfirmed when the proposal
    was written. The organisers hold the test data and run every evaluation.
  independence_assessed: true
  independence_policy:
    source: src-zenodo-19714728-proposal
    quote: They will however be evaluated and if they are within the top-ranked ones they will be
      honorarily mentioned

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: provided-allocation
  compute_tier_basis:
    reason: Training runs on the participants' own hardware; validation scoring and the ranking runs
      of the containers are on the organisers' Synapse infrastructure (an NVIDIA A10G per
      segmentation container in 2026).
    source: src-zenodo-19714728-proposal
    quote: during the validation and final testing/ranking phase using the organizers'
      infrastructure (i.e., Synapse.org - SAGE Bionetworks)
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The rankings are computed on test data that only the organisers hold and run.
    source: src-zenodo-19714728-proposal
    quote: The containerized method will be evaluated on the hidden testing data by the organizers,
      only for participants with submitted short papers
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: PermRanker (the organisers' ranking and permutation-testing tool) with each task's metric
    code, such as the BraTS-Inpainting 2026 repository's evaluation
  harness_note: PermRanker (IUCompPath/PermRanker, Apache-2.0) and BraTS-inpainting/2026_challenge
    (MIT) exist, per GitHub's metadata read 2026-10-14; neither was read or run, and the
    segmentation metric code was not located.
  harness_source: src-zenodo-19714728-proposal
  harness_quote: The software that we will use is released as an open-source tool through GitHub
    (https://github.com/IUCompPath/PermRanker)
  code_licence: null
  code_licence_note: The series has no single code repository. GitHub's licence metadata, read
    2026-10-14, gives Apache-2.0 for PermRanker and MIT for the 2026 inpainting repository; the
    rules make submitted containers publicly accessible under Apache 2.0 unless participants
    indicate otherwise.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and task (the data, labels, sub-regions and metrics change by
  # year and challenge), which split (the hidden test set or the validation leaderboard), and what the entrant
  # was trained on (each task restricts outside data and pretrained weights differently; GoAT allows none).
  material_extra:
    - subset_used
    - training_data_policy


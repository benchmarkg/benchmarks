subsets:
  - id: brats#2026-mets
    label: 2026 Challenge 1, BraTS-METS (brain metastases, pre- and post-treatment)
    items: 303
    scored_separately: true
    evidence:
      - source: src-zenodo-19714728-proposal
        quote: (Challenge 1) Segmentation of brain metastases sub-regions in pre- and post-treatment
          MRI scans
    notes: 303 test cases. Segmentation (Dice, NSD on lesions above 27 mm3) and a lesion-detection
      arm (F1); the 2025 dataset reused after a quality-control pass.
  - id: brats#2026-peds
    label: 2026 Challenge 2, BraTS-PEDs (paediatric brain tumours, pre- and post-treatment)
    items: 130
    scored_separately: true
    evidence:
      - source: src-zenodo-19714728-proposal
        quote: (Challenge 2) Segmentation of pediatric brain tumor sub-regions in pre- and
          post-treatment MRI scans
    notes: 130 test timepoints from 116 subjects, a longitudinal post-treatment cohort new in 2026.
  - id: brats#2026-goat
    label: 2026 Challenge 3, BraTS-GoAT (generalisation across tumour types)
    scored_separately: true
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-zenodo-19714728-proposal
        quote: (Challenge 3) Generalizability of brain tumor sub-region segmentation across tumor
          entities in MRI scans
      - source: src-synapse-brats-2026-goat-data
        quote: The composition of the private test data will **NOT** be disclosed to the
          participants.
    notes: Pre-operative MRI from the earlier glioma, sub-Saharan Africa, meningioma, metastasis and
      paediatric challenges. The test set's composition is not disclosed, and only the data provided
      for the task may be used for training. The capability override drops generation-fidelity,
      which only the inpainting task scores.
  - id: brats#2026-inpainting
    label: 2026 Challenge 4, BraTS-Inpainting (local synthesis of healthy tissue in T1 MRI)
    scored_separately: true
    domain_override:
      primary: vision/image-restoration-enhancement
      secondary:
        - medicine-health/medical-imaging-segmentation
    capability_override:
      - generation-fidelity
    evidence:
      - source: src-zenodo-19714728-proposal
        quote: (Challenge 4) Local Synthesis / Inpainting of brain tumor MRI scans
      - source: src-zenodo-19714728-proposal
        quote: We choose the three most popular metrics to evaluate image synthesis methods
    notes: RMSE, PSNR and SSIM per case, aggregated into ranks with equal weight per case, over a
      glioma (568 cases) and a meningioma (277 cases) test set. The capability override keeps
      generation-fidelity only. The meningioma set tests healthy-tissue synthesis beyond glioma, but
      whether its score is reported as a condition of its own was not read, so
      distribution-shift-generalization is not carried over.
  - id: brats#2026-path
    label: 2026 Challenge 5, BraTS-Path (glioblastoma histology classification)
    scored_separately: true
    domain_override:
      primary: medicine-health/medical-imaging-diagnostic
    capability_override:
      - perception
    evidence:
      - source: src-zenodo-19714728-proposal
        quote: (Challenge 5) Classification of brain glioblastoma sub-regions in H&E-stained;
          pathology slides
      - source: src-zenodo-19714728-proposal
        quote: Ranking of methods will be based on the aggregate of rankings of F1 score and MCC
    notes: Patches of TCGA tissue sections, nine histologic classes and a none-of-the-above class.
      The capability override keeps perception only; distribution shift and generation fidelity
      belong to GoAT and inpainting.


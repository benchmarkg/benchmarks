# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1612-08012-v4
    - src-arxiv-1612-08012
    - src-luna16-site
    - src-luna16-data
    - src-luna16-evaluation
    - src-luna16-leaderboard
    - src-luna16-announcement-2017
    - src-luna16-announcement-2018
    - src-zenodo-luna16
    - src-tcia-lidc-idri
    - src-pmc-12868601
  sources_note: >
    The paper's v4 PDF (a DOI, not archived) read as text; its abstract page for the dates and the
    journal DOI; six pages of the challenge site, scripts and styles stripped, each withheld from archiving
    because its HTML carries an organiser's e-mail address; Zenodo's record of the data (a DOI, not
    archived); TCIA's LIDC-IDRI page; and the PMC copy of a February 2026 Digital Health paper, withheld
    for
    its corresponding author's address. The site's Description, Procedure, Download and Tutorial pages
    were
    read but not cited.
  confidence: medium
  review_checks:
    - check: lifecycle active or mature. The board has been frozen since 2018 and the organisers
        called for a successor with a hidden test set, but papers still report CPM on the scans (a
        February 2026 paper read here), which the precedence rule reads as active.
      field: lifecycle
      source: src-luna16-announcement-2017
      quote: It would be a good idea to repeat the LUNA16 challenge with a new test data set.
    - check: released is left null. No page read dates the challenge's opening; the earliest board
        rows are 1 April 2016 and the paper's first arXiv version 2016-12-23. A dated capture of the
        site or the ISBI 2016 workshop programme would settle it.
      field: released
    - check: maintainer-competes-on-own-benchmark rests on the board's submitter handle for
        DIAG_CONVNET matching the first author and organiser, and on the paper describing
        DIAG_CONVNET as his group's method. The handles behind VisiaCTLung and M5LCADThreshold0.3
        are read as two other organisers' by name only.
      field: governance.independence_flags
      source: src-arxiv-1612-08012-v4
      quote: This method uses multi-view ConvNets proposed by Setio et al. (2016)
    - check: calibration-uncertainty was rejected although the scorer consumes each mark's degree of
        suspicion, because FROC only thresholds it. Confirm that reading of the inclusion test.
      field: capability
    - check: data_provenance takes inherited-from-constituents for LIDC-IDRI, read as a published
        CAD dataset rather than a curated archive of records. expert-authored was not added for the
        radiologists' marks, which LUNA16 inherited and merged rather than commissioned.
      field: data.data_provenance
    - check: The slice-thickness cut-off differs between the Data page (2.5 mm) and the paper (3
        mm), both giving 888 scans; the description says only that thick-slice scans were removed.
      source: src-arxiv-1612-08012-v4
      quote: we discarded scans with a slice thickness greater than 3 mm
    - check: versions records the false positive reduction track's two candidate lists as revisions
        of the whole benchmark, although the nodule detection track did not change with them. A
        per-subset record may fit better.
      field: versions
    - check: Commercial products whose components are not described (VisiaCTLung, Aidence,
        JianPeiCAD) are among the entrants; whether observed_subjects should add
        full-product-pipeline beside domain-specialist-model.
      field: designed_for_subjects
  personal_data_excluded:
    - source: src-luna16-site
      what: An organiser's e-mail address in the page's mailto links (navigation and contact).
    - source: src-luna16-data
      what: An organiser's e-mail address in the page's mailto links.
    - source: src-luna16-evaluation
      what: An organiser's e-mail address in the page's mailto links.
    - source: src-luna16-leaderboard
      what: An organiser's e-mail address in the page's mailto links.
    - source: src-luna16-announcement-2017
      what: An organiser's e-mail address in the page's mailto links.
    - source: src-luna16-announcement-2018
      what: An organiser's e-mail address in the page's mailto links.
    - source: src-pmc-12868601
      what: The corresponding author's e-mail address in the author notes.

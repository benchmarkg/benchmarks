# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T04)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2205-09148-v3
    - src-arxiv-2205-09148
    - src-neurips-2022-ddxplus
    - src-github-mila-ddxplus-readme
    - src-github-mila-ddxplus-project-page
    - src-figshare-api-ddxplus-fr
    - src-figshare-api-ddxplus-fr-v14
    - src-figshare-api-ddxplus-en
    - src-arxiv-2502-19175-v2
    - src-arxiv-2603-24844-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, with windows that keep the authors' contact
    lines and the printed synthetic patients out; its abstract page for the dates and venue comment; the
    NeurIPS proceedings page for the track and the published DOI; the README and the project page's HTML
    at commit 69e8cf5, with scripts and styles stripped; Figshare's API records of both datasets (the
    French at versions 15 and 14, with versions 1 to 13 compared by checksum only), read on the API host
    because figshare.com challenges robots.txt; and MEDDxAgent's and multi-answer RL's PDFs as evidence
    of use outside the maintainers.
  confidence: medium
  review_checks:
    - check: ground_truth_source is held-out-labels, but every label is a generator's output, the
        sampled pathology and DXA's differential, not a clinician's. simulation was weighed and not
        used because the vocabulary keeps it for physics and environment simulators; whether a
        vendor rule-based system's output needs its own term is open (bench tag-gap refuses
        ground_truth_source as not a classified field, so it is recorded here only). Patients whose
        sampled pathology DXA left out were discarded, which ties the data to that system's
        behaviour.
      field: ground_truth_source
      source: src-arxiv-2205-09148-v3
      quote: We further proceed by verifying if the underlying synthesized disease is part of the
        generated differential diagnosis
    - check: The README calls the generating system "a commercial rule-based ASD system"; the paper
        and both Figshare records call it a rule-based AD system. The paper's account was used.
      field: data.data_provenance
      source: src-github-mila-ddxplus-readme
      quote: a proprietary medical knowledge base and a commercial rule-based ASD system
    - check: The French Figshare record's current version 15 (2026-03-11) lists patient zips whose
        computed_md5 equals the English record's (e.g. the test split's), while version 14's differ.
        The README and project page still call the French record the original on which the paper's
        results were obtained. Whether version 15 replaced the French patient files with the English
        ones by mistake was not established; a claim on the French data should pin version 14 or
        earlier.
      field: versions
      source: src-figshare-api-ddxplus-fr
      quote: '"computed_md5": "6fd53d331cf19ed4439bf4f46b92ee94"'
    - check: The French and English releases are modelled as two revisions of one benchmark (same
        maintainer, same patients, changed names), not as an edition or a separate benchmark. The
        French record's 15 Figshare versions are not modelled one by one; only version 9's change to
        the patient files (sizes differ by 266 bytes per file) touched the data before 2026, and
        what it changed is not documented.
      field: versions
      source: src-figshare-api-ddxplus-fr-v14
      quote: '"computed_md5": "8d56376b0312ae59c0a90f186f3db7ad"'
    - check: clinical-dialogue is secondary for the questioning, scored by IL and PER. The
        interaction is a sequence of structured symptom queries answered from a record, not

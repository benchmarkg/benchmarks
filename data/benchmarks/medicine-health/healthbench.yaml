# data/benchmarks/medicine-health/healthbench.yaml
#
# P1-S6-T03, medicine-health entry 2 of 10. Filled from the HealthBench paper, arXiv 2505.08775 read as its v1 PDF
# (2025-05-13, its only version), and its abstract page; OpenAI's announcement page (2025-05-12, scripts and
# styles stripped); the simple-evals README, healthbench_eval.py and simple_evals.py at main; the abstract page of
# HealthBench Professional (arXiv 2604.27470), a separate OpenAI benchmark that runs through the same eval; and the
# v1 PDF of Medmarks (arXiv 2605.01417, May 2026), a third party's suite that runs HealthBench. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.

id: healthbench
name: HealthBench
tagline: 5,000 health conversations; a model's next reply is graded against physician-written
  rubrics by a GPT-4.1 grader.
description: >
  OpenAI's benchmark of 5,000 conversations between a model and a lay user or a health professional, one
  to nineteen turns long and ending with a user message; the model under test writes the next reply. Each
  conversation carries its own rubric, written by physicians from a cohort of 262: criteria worth between
  -10 and +10 points that name facts to include, behaviour to show or errors to avoid, 48,562 unique criteria
  in all. A GPT-4.1 grader decides, criterion by criterion, whether the reply meets it. An example scores
  the points met over the positive points available, and the benchmark score is the mean over examples,
  clipped to [0, 1]. Examples fall into seven themes (emergency referrals, context seeking, global health,
  health data tasks, expertise-tailored communication, responding under uncertainty, response depth) and
  criteria into five axes (accuracy, completeness, communication quality, context awareness, instruction
  following). Most conversations were generated by a language model from situations physicians specified;
  others come from physician red teaming and from HealthSearchQA queries rewritten as conversations. Two
  subsets are scored separately: HealthBench Hard, the 1,000 examples on which five developers' models
  of early 2025 scored lowest, and HealthBench Consensus, 3,671 examples scored only on 34 criteria that
  several physicians agreed applied. Physicians' own responses were graded as a baseline, and recent models
  exceed it. Data and code are released in OpenAI's simple-evals repository. HealthBench Professional
  (2026), built on real clinician chats, runs through the same code but is a separate benchmark and is
  not included here.
self_description:
  source: src-arxiv-2505-08775-v1
  quote: We present HealthBench, an open-source benchmark measuring the performance and safety of
    large language models in healthcare.
external_ids:
  arxiv: '2505.08775'
paper:
  title: 'HealthBench: Evaluating Large Language Models Towards Improved Human Health'
  arxiv: '2505.08775'
  version_read: v1
  source: src-arxiv-2505-08775-v1
released: 2025-05-12
released_note: OpenAI's announcement page is dated 12 May 2025, the day the data files and the eval
  were committed to simple-evals (GitHub API, read 2026-10-14). The paper's only arXiv version
  followed on 13 May 2025.
released_source: src-openai-healthbench-site
released_quote: May 12, 2025 Publication Introducing HealthBench

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: medicine-health/medical-safety
  secondary:
    - medicine-health/diagnosis-triage
domain_basis:
  reason: The paper's claim is the performance and safety of models in health conversations, and the
    rubrics penalise unsafe or harmful advice across every theme, from wrong facts to omitted red
    flags and missed referrals. Safety is half that claim, not all of it; clinical-dialogue would
    name the subject better, but under taxonomy 0.9.0 its definition excludes a single scored reply
    (see domain_considered_and_rejected and review_checks). The emergency-referrals theme, 9.6% of
    the examples, asks for an urgency assessment, which is diagnosis-triage's case.
  source: src-arxiv-2505-08775-v1
  quote: We present HealthBench, an open-source benchmark measuring the performance and safety of
    large language models in healthcare.
domain_considered_and_rejected:
  - term: medicine-health/clinical-dialogue
    reason: Its 0.9.0 definition reads "scored on the conduct of the exchange rather than on a
      single reply", and HealthBench scores one reply to a given history. ADR-0021, proposed and not
      applied, would widen the term to exactly this case and make it the primary.
    source: src-arxiv-2505-08775-v1
    quote: whereas HealthBench evaluates single model responses to multi-turn conversations
  - term: medicine-health/clinical-task-suites
    reason: The term's own example names HealthBench as its near miss. The seven themes stratify one
      task, a reply to a health conversation; they are not a suite of tasks.
  - term: medicine-health/clinical-qa
    reason: Replies are open-ended and scored against many criteria, not against one determinate
      answer.
capability:
  - factual-precision
  - honesty
  - context-integration
  - instruction-following
  - reliability-consistency
capability_basis:
  factual-precision:
    reason: Criteria check particulars inside the free-text reply one at a time, such as which
      medication and at what dose, and the accuracy axis (33% of criteria) scores whether what is
      stated is correct.
    source: src-arxiv-2505-08775-v1
    quote: Rubric criteria can range from specific facts that should be mentioned in the response
      (e.g., what medications to take and at what dosage)
  honesty:
    reason: The responding-under-uncertainty theme (21.4% of examples) rewards language that
      reflects uncertainty where it exists and penalises overconfident claims, which is scored apart
      from whether the content is correct.
    source: src-arxiv-2505-08775-v1
    quote: This theme evaluates whether models can recognize when uncertainty is present and respond
      with language reflecting that uncertainty if so.
  context-integration:
    reason: The conversation supplies the user's role, setting and resources and, across turns, the
      facts that decide the right reply; the context-awareness axis (16% of criteria) scores whether
      the reply used them or asked for what was missing.
    source: src-arxiv-2505-08775-v1
    quote: This axis captures whether the model appropriately responds to contextual cues that are
      present (e.g., user role, geographic setting, resources the user says they have), and whether
      it seeks clarification when needed.
  instruction-following:
    reason: An axis of its own (4% of criteria) scores whether the reply did what the user asked,
      such as a format or a type of clinical note, separately from clinical accuracy, and the
      abstract names instruction following among the behavioural dimensions.
    source: src-arxiv-2505-08775-v1
    quote: This axis evaluates whether the model adheres to instructions while still prioritizing
      safety.
  reliability-consistency:
    reason: The paper samples each example repeatedly and reports worst-at-k, the expected lowest
      score of k replies, as its reliability measure beside the averaged headline score.
    source: src-arxiv-2505-08775-v1
    quote: To examine this, we study the worst-at-k performance on HealthBench
capability_considered_and_rejected:
  - term: communication
    reason: The communication-quality axis grades the message itself; no recipient's understanding
      or action is scored. The term's own example names HealthBench as its near miss.
  - term: knowledge-recall
    reason: Answering needs medical knowledge the model brings, but what is scored is the
      correctness of particulars inside a free-form reply, which is factual-precision; the knowledge
      is an input.
  - term: harm-avoidance
    reason: The conversations are ordinary health requests, not requests for harmful output. Unsafe
      advice is penalised through accuracy and completeness criteria, not scored as refusal or safe
      completion.
  - term: calibration-uncertainty
    reason: Uncertainty is expressed in words and graded by criteria; no numeric confidence is
      consumed.

evaluation_method:
  - rubric-graded
  - model-graded-judge
evaluation_method_basis:
  reason: rubric-graded, because each conversation's physician-written criteria are checked one by
    one and their points summed and normalised; model-graded-judge, because a prompted judge model,
    GPT-4.1 (gpt-4.1-2025-04-14 in simple-evals), decides each criterion. Both terms' examples name
    HealthBench.
  source: src-arxiv-2505-08775-v1
  quote: We then get the total points for a given example by summing the point values for criteria
    met, including points for positive criteria and penalties for negative points.
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: Physicians graded responses only to measure the grader's agreement with them, and only
      on the consensus criteria; the reported scores come from the model grader.
    source: src-arxiv-2505-08775-v1
    quote: We studied quality of model-based grading via meta-evaluation against physician grading,
      but only on consensus criteria
  - term: model-derived-metric
    reason: The grader is a general model prompted with a grading instruction that returns a verdict
      per criterion, not a fixed released scoring model.
  - term: expert-panel-assessment
    reason: 262 physicians wrote criteria that are applied at scale; no committee issues a
      collective judgement.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The model under test is prompted with the conversation and writes one reply, with no
    tools, harness or retries, and the paper reports general assistants from five developers.
  source: src-arxiv-2505-08775-v1
  quote: Given a conversation, the task for an LLM is to respond to the last user message.
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: Built with physicians, but the reported systems are general assistants from OpenAI,
      Anthropic, Google, xAI and Meta; medicine is the benchmark's subject, not its models'
      specialisation. The term's own example names HealthBench as a near miss.
  - term: reasoning-model
    reason: o-series models are reported at low, medium and high reasoning effort, but that is a run
      condition; the benchmark is not built around a reasoning budget.
  - term: human-expert
    reason: Physicians wrote responses that were graded like a model's, as a baseline (ceiling
      anchor), but the protocol admits no human entrants.
as_used:
  - protocol: Run inside the Medmarks suite with GPT-5 mini as the grader in place of GPT-4.1, so
      the scores are not on the simple-evals grader and are not comparable with OpenAI's.
    split: the full set, and HealthBench Hard
    source: src-arxiv-2605-01417-v1
    quote: for HealthBench we replaced the slow and expensive GPT-4.1 with GPT-5 mini.
    note: Medmarks (May 2026) evaluates 61 models on 30 benchmarks and runs its open-ended ones,
      HealthBench among them, on a dozen of those models, ranked by win rate.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against it by others. Medmarks (May 2026) runs it on a dozen
    models beside its other open-ended benchmarks and reports it among the hardest. OpenAI stopped
    adding results to simple-evals in July 2025 (activity) but keeps hosting HealthBench, and in
    April 2026 added HealthBench Professional options to the same eval.
  source: src-arxiv-2605-01417-v1
  quote: with MedCaseReasoning (Wu et al., 2025b) and HealthBench (Arora et al., 2025) among the
    hardest datasets
activity: closed
activity_basis:
  reason: No route ever let outsiders enter results; OpenAI chose and ran the models it reported. In
    July 2025 it formally stopped adding results to simple-evals, which keeps hosting the eval, and
    under ADR-0019 a formal stop is closed rather than no-submission-channel.
  source: src-github-simple-evals-readme
  quote: will no longer be updated for new models or benchmark results

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: o3
    source: src-arxiv-2505-08775-v1
    observed_on: 2026-10-14
    quote: Overall scores on HealthBench range from 0.16 (GPT-3.5 Turbo) to 0.60 (o3).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: expert-panel
ground_truth_source_note: The physician-written rubric criteria are the reference; the GPT-4.1
  grader applies them, it does not define them.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The conversations, rubrics, subsets and grading code are public, and the grader is a dated
    model snapshot served through OpenAI's API. A rerun depends on that snapshot staying available.
  source: src-github-simple-evals-healthbench-eval
  quote: INPUT_PATH =
    "https://openaipublic.blob.core.windows.net/simple-evals/healthbench/2025-05-07-06-14-12_oss_eval.jsonl"

task:
  exists: true
  input:
    - a conversation of one to nineteen turns between a model and a lay user or a health
      professional, ending with a user message
  output: One free-text reply to the last user message.
  scoring: Each of the example's rubric criteria (2 to 48 per example, each worth between -10 and
    +10 points) is judged met or not by the GPT-4.1 grader. The example scores the points met over
    the positive points available, and the benchmark score is the mean over examples, clipped to [0,
    1]. HealthBench Consensus is reported as an error rate, 1 minus the score.
  source: src-arxiv-2505-08775-v1
  quote: by taking the mean of its per-example scores and clipping that mean to the range [0, 1]

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The small private held-out set OpenAI keeps to detect training on the benchmark is
    not part of the scored set. The three data files answered an unauthenticated HEAD request on
    2026-10-14, last modified on 2025-05-12 (not a quoted Source).
  access_basis:
    reason: The eval downloads the conversations and rubrics, and the Hard and Consensus files, from
      a public OpenAI blob store with no account. The paper asks only that examples not be
      republished, an anti-contamination request rather than a gate.
    source: src-github-simple-evals-healthbench-eval
    quote: INPUT_PATH =
      "https://openaipublic.blob.core.windows.net/simple-evals/healthbench/2025-05-07-06-14-12_oss_eval.jsonl"
  refresh: static
  refresh_basis:
    reason: The eval still loads the May 2025 data files. Its one later change (2026-04-22, GitHub
      API) added HealthBench Professional options and left the default grader and files as they
      were. No source announces a revision.
    source: src-github-simple-evals-healthbench-eval
    quote: INPUT_PATH_HARD =
      "https://openaipublic.blob.core.windows.net/simple-evals/healthbench/hard_2025-05-08-21-00-10.jsonl"
  data_provenance:
    - model-generated
    - expert-authored
  data_provenance_note: Most conversations were generated by a language-model pipeline from
    situations physicians enumerated; others come from physician red teaming, and the rest are
    HealthSearchQA queries (Google) that a model rewrote as conversations. A model filtered them for
    realism and relevance. Physicians wrote every example's rubric criteria.
  data_provenance_source: src-arxiv-2505-08775-v1
  data_provenance_quote: Most conversations in HealthBench were synthetically generated.
  contamination_risk: medium
  contamination_risk_note: The full set, rubrics included, has been public since May 2025, and the
    paper treats leakage as a live route, with a canary string, a request not to republish examples
    and a private held-out set to detect training on it. No source read here shows contamination.
  contamination_risk_source: src-arxiv-2505-08775-v1
  contamination_risk_quote: We request that you do not reveal examples from this dataset in plain
    text or images online, to help prevent leakage into foundation model training corpora
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_basis:
    reason: Physicians' own responses, written without AI help, were graded with the same rubrics,
      and the paper reads model scores against them. Models already exceed that baseline, which
      stays the anchor (taxonomy/ceiling-anchors.yaml names HealthBench as the example).
    source: src-arxiv-2505-08775-v1
    quote: As a baseline, we asked physicians to write responses to HealthBench examples with and
      without reference responses from models, and found that models outperformed the unassisted
      expert baseline
  dataset_licence: MIT
  dataset_licence_note: The README lists HealthBench under the repository's MIT licence. The data
    files sit on OpenAI's blob store with no licence beside them, and the paper asks users not to
    republish examples.
  dataset_licence_source: src-github-simple-evals-readme
  dataset_licence_quote: 'HealthBench: Evaluating Large Language Models Towards Improved Human Health,
    reference: https://openai.com/index/healthbench, [MIT License]'
  size:
    - count: 5000
      unit: conversations, each with its own rubric
      source: src-arxiv-2505-08775-v1
      quote: HealthBench consists of 5,000 multi-turn conversations between a model and an
        individual user or healthcare professional.
    - count: 48562
      unit: unique rubric criteria
      source: src-arxiv-2505-08775-v1
      quote: The vast majority of the 48,562 unique rubric criteria in HealthBench were written
        specifically by a physician for that example.
    - count: 1000
      unit: conversations
      subset: HealthBench Hard
      source: src-arxiv-2505-08775-v1
      quote: HealthBench Hard is a subset of 1,000 examples from HealthBench chosen for their
        difficulty
    - count: 3671
      unit: conversations, scored on the 34 consensus criteria only
      subset: HealthBench Consensus
      source: src-arxiv-2505-08775-v1
      quote: HealthBench Consensus keeps the 3,671 examples with at least one positive consensus
        criterion and filters rubric criteria to include only consensus criteria

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: OpenAI
  maintainer_basis:
    reason: The paper's authors are OpenAI's, and the data and code are released in OpenAI's
      simple-evals repository.
    source: src-arxiv-2505-08775-v1
    quote: Code for loading data and running HealthBench is available at
      https://github.com/openai/simple-evals.
  maintainer_type: industry-lab
  submission_process:
    - maintainer-run
  submission_process_note: OpenAI chose nine primary models from five developers, ran them and
    published the results in the paper and on its announcement page, which promised results for
    future models. Nobody submits. ADR-0020 sorted HealthBench to maintainer-run; the boundary with
    literature-only is in review_checks.
  submission_process_source: src-openai-healthbench-site
  submission_process_quote: We look forward to sharing results for future models.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2505-08775-v1
      quote: We use HealthBench to evaluate both OpenAI models and models from other model providers
    - flag: grader-from-evaluated-party
      source: src-github-simple-evals-script
      quote: grading_sampler = ChatCompletionSampler( model="gpt-4.1-2025-04-14",
  independence_flags_note: OpenAI's models are evaluated beside Anthropic's, Google's, xAI's and
    Meta's, and lead the paper's results. The grader, gpt-4.1-2025-04-14, is OpenAI's and is itself
    one of the evaluated models. OpenAI picked it in a meta-evaluation that compared only OpenAI
    models as graders, and chose the Hard subset by the scores of five developers' models.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2505-08775-v1
    quote: We studied quality of model-based grading via meta-evaluation against physician grading,
      but only on consensus criteria

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: Every run pays for OpenAI API calls to the grader, one per rubric criterion
    (11.5 per example on average), on top of sampling the model under test; nothing beyond an
    ordinary CPU is required.
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: Automatable end to end, but every official score depends on one hosted
    grader snapshot, gpt-4.1-2025-04-14. Once OpenAI retires it the official score cannot be
    reproduced, and no blocker term covers that (taxonomy/execution.yaml defers
    hosted-judge-dependency). Over 16 repeated runs the paper found a standard deviation of about
    0.002.
  reproducibility_tier_source: src-arxiv-2505-08775-v1
  reproducibility_tier_quote: We observe a standard deviation of around 0.002 for different models
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: simple-evals (python -m simple-evals.simple_evals with --eval=healthbench,
    healthbench_hard or healthbench_consensus)
  harness_source: src-github-simple-evals-healthbench-eval
  harness_quote: 'To run HealthBench, HealthBench Consensus, or HealthBench Hard, use the simple-evals
    script:'
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for openai/simple-evals, read 2026-10-14, also
    reports MIT.
  code_licence_source: src-github-simple-evals-readme
  code_licence_quote: 'HealthBench: Evaluating Large Language Models Towards Improved Human Health, reference:
    https://openai.com/index/healthbench, [MIT License]'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The model-graded profile already makes the subset (full, Hard or Consensus) and the grader's
  # model and version material, which is what moves a HealthBench number most: Medmarks grades with
  # GPT-5 mini (as_used), and since April 2026 simple-evals offers GPT-5.4 at low effort as an
  # optional grader. No field beyond the profile is added.
  material_extra: []

homepage: https://openai.com/index/healthbench/
repository: https://github.com/openai/simple-evals
dataset_url:
  https://openaipublic.blob.core.windows.net/simple-evals/healthbench/2025-05-07-06-14-12_oss_eval.jsonl

subsets:
  - id: healthbench#hard
    label: HealthBench Hard
    items: 1000
    scored_separately: true
    evidence:
      - source: src-arxiv-2505-08775-v1
        quote: HealthBench Hard is a subset of 1,000 examples from HealthBench chosen for their
          difficulty
      - source: src-arxiv-2505-08775-v1
        quote: Select the 1,000 examples with lowest average score across model providers.
    notes: The 1,000 examples with the lowest mean score across five developers' models of early
      2025 (o3, Grok 3, Gemini 2.5 Pro, Claude 3.7 Sonnet, Llama 4 Maverick), after dropping the
      roughly 1.5% that no model scored above zero on. Scored like the full set; the best score in
      the paper is o3's 0.32. Its difficulty is relative to the models it was selected against.
  - id: healthbench#consensus
    label: HealthBench Consensus
    items: 3671
    scored_separately: true
    evidence:
      - source: src-arxiv-2505-08775-v1
        quote: HealthBench Consensus keeps the 3,671 examples with at least one positive consensus
          criterion and filters rubric criteria to include only consensus criteria
      - source: src-arxiv-2505-08775-v1
        quote: we examine model error rates (i.e., 1 minus the score) for this subset
    notes: The examples with at least one positive consensus criterion, scored on the 34 consensus
      criteria only, pre-written criteria assigned where two or more physicians agreed they applied.
      Reported as an error rate, 1 minus the score. These are also the only criteria the grader was
      meta-evaluated on.

tags:
  - health
  - clinical-conversations
  - physician-rubrics
  - llm-judge
  - safety

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2505-08775-v1
    - src-arxiv-2505-08775
    - src-openai-healthbench-site
    - src-github-simple-evals-readme
    - src-github-simple-evals-healthbench-eval
    - src-github-simple-evals-script
    - src-arxiv-2605-01417-v1
    - src-arxiv-2604-27470
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with windows that keep the authors' contact
    line out; its abstract page for the arXiv date; OpenAI's announcement page with scripts and styles
    stripped; the simple-evals README, healthbench_eval.py and simple_evals.py at main; Medmarks's v1
    PDF (a DOI) as evidence of current use; and HealthBench Professional's abstract page (a DOI), for
    the identity call.
  confidence: medium
  review_checks:
    - check: Primary is medical-safety because clinical-dialogue's 0.9.0 definition excludes a
        single scored reply, and safety is only half of HealthBench's claim. If ADR-0021 is applied,
        the primary should become clinical-dialogue, with medical-safety and diagnosis-triage
        secondary.
      field: domain
      source: src-arxiv-2505-08775-v1
      quote: whereas HealthBench evaluates single model responses to multi-turn conversations
    - check: lifecycle active rests on Medmarks's May 2026 runs. The Stage 3 classification recorded
        mature, because simple-evals stopped adding results in July 2025 while still hosting the
        eval.
      field: lifecycle
      source: src-arxiv-2605-01417-v1
      quote: with MedCaseReasoning (Wu et al., 2025b) and HealthBench (Arora et al., 2025) among the
        hardest datasets
    - check: activity closed rests on the simple-evals deprecation notice, which covers the whole
        repository, while the announcement page promised results for future models. OpenAI's later
        model or system cards were not read; if they still report HealthBench, the maintainer has
        not stopped adding results and no-submission-channel may be the better value.
      field: activity
      source: src-openai-healthbench-site
      quote: We look forward to sharing results for future models.
    - check: submission_process maintainer-run against literature-only. OpenAI's results are the
        release paper's and announcement page's; the simple-evals results table has no HealthBench
        column, so whether OpenAI keeps a results table of its own is open.
      field: governance.submission_process
    - check: reliability-consistency rests on worst-at-k, which the paper reports as an analysis
        beside the averaged headline score; healthbench_eval.py does not compute it.
      field: capability
      source: src-arxiv-2505-08775-v1
      quote: To examine this, we study the worst-at-k performance on HealthBench
    - check: Identity. HealthBench Professional (April 2026) is OpenAI's benchmark on real clinician
        chats, run through the same eval with a custom input path, a GPT-5.4 grader and a length
        adjustment. It is left out here as a separate benchmark rather than a version or subset; it
        may deserve an entry of its own.
      field: versions
      source: src-arxiv-2604-27470
      quote: We introduce HealthBench Professional, an open benchmark for evaluating large language
        models on real tasks that clinicians bring to ChatGPT in the course of their work.
    - check: No reference_conditions is written, so the reference-grader rule cannot see the grader
        (gpt-4.1-2025-04-14, the simple-evals default). simple-evals now also offers GPT-5.4 at low
        effort as a HealthBench grader, and a score graded that way is not comparable.
      field: reference_conditions
      source: src-github-simple-evals-script
      quote: Use GPT-5.4 with low reasoning effort as the HealthBench rubric grader.
    - check: dataset_licence MIT is read from the README's list of evals, which links the
        repository's licence; no licence statement sits beside the data files themselves.
      field: data.dataset_licence

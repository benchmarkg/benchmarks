lineage_note: >
  SMACv2 (arXiv 2212.07489, NeurIPS 2023 Datasets and Benchmarks) is by the same lab, in the same GitHub
  organisation, and keeps SMAC's API, but it has its own repository and package (smacv2), its own paper
  and citation, and new procedurally generated scenarios (5, 10 and 20 units per side, symmetric and asymmetric,
  for each of three races, plus three EPO maps); its README says old SMAC maps do not work in it. That
  makes it independently versioned and cited, the 04 S4 test for a new Benchmark linked by lineage, so
  it is a same-maintainer variant here rather than a version. It has no entry yet. Third-party derivatives
  seen in an arXiv search (SMAC-Hard, SMAC-Talk, HLSMAC, StarCraft+ and others) were not read and are
  not recorded as forks.
lineage_source: src-github-smacv2-readme-577ab5a
lineage_quote: For now, SMAC is not backwards compatible with old SMAC maps


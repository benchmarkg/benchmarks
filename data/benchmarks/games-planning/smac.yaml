  sources_note: >
    The SMAC paper's v5 PDF and the SMACv2 paper's v2 PDF (DOIs, not archived) read as text, with their
    abstract pages for dates and abstracts; the SMAC README and docs/smac.md at commit d6aab33 and GitHub's
    release record (pending archive); the SMACv2 README at commit 577ab5a (withheld from the archive for
    a named maintainer's e-mail address); and the v2 PDF of a May 2026 paper (a DOI) as evidence of current
    use. The repositories' licences and dates come from GitHub's API metadata, read 2026-11-09. The paper's
    AAMAS 2019 extended-abstract publication was not found in any source read; the v5 PDF names the NeurIPS
    2019 Deep RL workshop.
  confidence: medium
  review_checks:
    - check: "Identity (04 S4). SMACv2 is recorded as a same-maintainer variant, a separate Benchmark,
        not as a version of this entry, and the call is not clear-cut. For a version: the same lab and
        organisation, the same API and task (decentralised micromanagement against the built-in AI, scored
        by win rate), the abstract page calls it \"a new version of the benchmark\" and its README \"\
        an update\". For a separate entry: its own repository, package and paper (cited separately), new
        procedurally generated scenarios in place of SMAC's maps, old maps no longer running in it, and
        the v2 PDF's abstract calling it \"a new benchmark\". If it were folded in, it would be a version
        with version_kind edition and breaking true."
      field: lineage
      source: src-arxiv-2212-07489-v2
      quote: we introduce SMACv2, a new benchmark where scenarios are procedurally generated and
        require agents to generalise to previously unseen settings during evaluation
    - check: Primary is real-time-strategy, whose definition asks for many simultaneous decisions
        under real-time pressure. SMAC has the simultaneous decisions (one agent per unit) and is
        built on an RTS game, but the environment is stepped through the API, so there is no
        wall-clock pressure on the agents. video-games is the alternative if the clause is read
        strictly.
      field: domain
    - check: multi-agent-system is tagged beside rl-policy, as Melting Pot's entry does for a
        population scored jointly. Hanabi's entry rejects it because one learning process controls
        every seat; SMAC's release baselines also share parameters across agents, but each agent
        acts on its own local observations at test time.
      field: designed_for_subjects
    - check: The maintainer-competes-on-own-benchmark flag rests on the release table being the
        maintainers' own runs in their own framework, as Hanabi's rests on its release learners.
        That QMIX, the best performer, is by several of the SMAC authors is visible only in the
        paper's reference list, which this entry does not quote because it names individuals; a
        reviewer may confirm it.
      field: governance.independence_flags
    - check: The Easy and Super Hard memberships come from the paper's Figures 4 and 6 and Table 2
        (the five maps at 97% or more for QMIX, and the five where all methods stay low), not from a
        sentence; only the Hard four are named in the text. A reviewer with the figures should
        confirm.
      field: subsets
    - check: aggregation_policy is official-aggregate on the paper's Figure 3, the median win rate
        averaged across the 14 scenarios. The methodology section and users (such as arXiv
        2605.01805, which averages over its own six maps) report per map; community-aggregate or
        unknown are the alternatives.
      field: aggregation_policy
    - check: lifecycle active rests on a May 2026 paper using five SMAC maps. The SMACv2 paper
        argues SMAC no longer rewards algorithmic improvement and the README points to SMACv2, which
        could support superseded; saturated is derived and not hand-set. The entry states the
        saturation claim only as the SMACv2 paper does (governance.known_limitation).
      field: lifecycle
      source: src-arxiv-2212-07489-v2
      quote: Recent work reports near-perfect win rates on most scenarios [55, 13]
    - check: data.refresh is versioned-releases on two releases whose maps are identical; the
        paper's v5 says its challenge list changed from an earlier version (which arXiv version is
        not stated), and later commits are not tagged (GitHub API, read 2026-11-09). The commit
        history was not read for changes to scenarios or scoring; static is the alternative if none
        exist.
      field: data.refresh
    - check: The StarCraft II binary is a proprietary dependency. Blizzard's terms for the Linux
        builds and the game were not read, so no licence-restriction blocker is recorded; the
        specific-simulator-build blocker rests on the README's warning that SC2 versions are not
        comparable.
      field: execution.reproducibility_blockers
    - check: The task framing named AAMAS 2019 (extended abstract) as a venue; no source read states
        it. release_venue is the NeurIPS 2019 Deep RL workshop from the v5 PDF's first page.
      field: release_venue

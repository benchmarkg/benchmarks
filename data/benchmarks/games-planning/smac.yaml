  - version: v1
    label: Version 1
    version_kind: revision
    released: 2019-12-04
    changes: The release notes say the maps are the beta's; the release adds the paper's run data.
      The paper's v5 (December 2019) says its list of challenge scenarios was updated from an
      earlier version, with every scenario still in the repository, and that the baselines' training
      settings differ from the beta's.
    breaking: false
    supersedes_version: v0.1-beta1
    frozen: true
    sources:
      - src-github-smac-releases
      - src-arxiv-1902-04043-v5

subsets:

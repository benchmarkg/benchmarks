        quote: they serve an important role in the benchmark as sanity checks when implementing and
          testing new algorithms
    notes: Five scenarios on which QMIX exceeds 95% in the release results, kept as sanity checks.
      The membership is read from the paper's Figure 4 and Table 2, not stated in its text.

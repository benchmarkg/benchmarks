    notes: 2c_vs_64zg, bane_vs_bane, 5m_vs_6m and 3s_vs_5z, the four the paper discusses under
      Figure 5.
  - id: smac#2c-vs-64zg
    label: 2c_vs_64zg (2 Colossi vs 64 Zerglings)

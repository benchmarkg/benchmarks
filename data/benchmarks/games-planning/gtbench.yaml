# data/benchmarks/games-planning/gtbench.yaml
#
# P1-S11-T04, games-planning entry 11. Filled from the GTBench paper, arXiv 2402.12348 read as its v2 PDF
# (2024-06-10, "Preprint. Under review."), and its abstract page, for the dates and versions; the NeurIPS 2024
# virtual-site poster page, for the venue and the published title; the repository README at commit b75e1d7 (a
# personal GitHub account, so the Source is withheld from archiving), with GitHub's metadata for the licence and
# dates; Hugging Face's API record of the leaderboard Space (withheld: its model list names individuals'
# accounts); and the v1 PDF of arXiv 2510.16761 (October 2025), another group's paper that uses six GTBench
# games, as evidence of current use. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# The environment: ten two-player games on OpenSpiel in two groups, complete and deterministic (Tic-Tac-Toe,
# Connect-4, Breakthrough, Nim) and incomplete or probabilistic (Kuhn Poker, Liar's Dice, Blind Auction,
# Negotiation, Pig, Iterated Prisoner's Dilemma), played by LLM-driven agents (a backbone model with one of four
# reasoning methods) against conventional agents (MCTS, Tit-for-Tat, random) or against other LLM agents, and
# scored by NRA (data/metrics/gtbench-nra.yaml). The paper's Elo table and its regret and Pareto analyses are
# secondary results, not the benchmark's score. The NeurIPS camera-ready was not read (the proceedings host timed
# out), nor was arXiv v1.

id: gtbench
name: GTBench
aliases:
  - 'GTBench: Uncovering the Strategic Reasoning Limitations of LLMs via Game-Theoretic Evaluations'
  - 'GTBench: Uncovering the Strategic Reasoning Capabilities of LLMs via Game-Theoretic Evaluations'
aliases_note: The arXiv versions and the repository title the paper "Limitations"; the NeurIPS 2024
  poster page titles it "Capabilities". A different benchmark, a 2026 graph-theory set for LLMs as
  mathematical research assistants, also calls itself GTBench (see review_checks).
tagline: Ten two-player games in which LLM agents play MCTS, Tit-for-Tat or other LLMs, scored by
  normalized relative advantage.
description: >
  GTBench is a language-driven environment for testing the strategic reasoning of large language models
  in competitive two-player games. It has ten games built on OpenSpiel, in two groups: complete and deterministic
  (Tic-Tac-Toe, Connect-4, Breakthrough on a 3x8 board, Nim) and incomplete-information or probabilistic
  (Kuhn Poker, Liar's Dice, Blind Auction, Negotiation, Pig, the Iterated Prisoner's Dilemma). A prompt
  adapter turns each game state into a modular prompt with the legal moves and parses the model's action.
  The entrant is an LLM-driven agent, a backbone model with one of four reasoning methods (Prompt, Chain-of-Thought,
  Self-Consistent CoT, Tree-of-Thought). It plays either a conventional agent, MCTS with 1000 simulations
  (Tit-for-Tat in the Prisoner's Dilemma) or a random agent, or another LLM agent, with GPT-3.5-turbo
  and the Prompt Agent as the common opponent. Each pairing runs 50 valid matches, each side moving first
  in 25, at temperature 0.2, and is scored by the Normalized Relative Advantage (NRA) in [-1, 1], where
  0 means as competitive as the opponent. Against MCTS in the deterministic games every model scored -1.
  The paper also gives Elo ratings for LLM-vs-LLM play and regret and Pareto analyses for a few games.
  The authors keep a leaderboard on Hugging Face, last changed in February 2024.
self_description:
  source: src-arxiv-2402-12348-v2
  quote: we propose GTBENCH, an environment consisting of 10 widely recognized game-theoretic tasks,
    across a comprehensive taxonomy of games
external_ids:
  arxiv: '2402.12348'
paper:
  title: 'GTBench: Uncovering the Strategic Reasoning Limitations of LLMs via Game-Theoretic Evaluations'
  arxiv: '2402.12348'
  version_read: v2
  source: src-arxiv-2402-12348-v2
released: 2024-02-19
released_note: The paper's first arXiv version, as its abstract page dates it; v2, the version read,
  was posted on 2024-06-10. The paper appeared as a NeurIPS 2024 poster
  (src-neurips-2024-gtbench-poster); the abstract page records no venue, and the proceedings version
  and its DOI were not read.
released_source: src-arxiv-2402-12348
released_quote: Submitted on 19 Feb 2024 (v1), last revised 10 Jun 2024 (this version, v2)
release_venue: NeurIPS 2024
release_venue_source: src-neurips-2024-gtbench-poster
release_venue_quote: 'NeurIPS Poster GTBench: Uncovering the Strategic Reasoning Capabilities of LLMs
  via Game-Theoretic Evaluations NeurIPS 2024'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/multi-game-suites
  secondary:
    - games-planning/board-games
    - games-planning/card-imperfect-information
domain_basis:
  reason: Every score comes from matches against an opponent that responds, which is the family
    test. The ten games span subdomains and none holds most of them. Four are complete-information,
    deterministic games, three on a board (board-games); four turn on private information, the cards
    or dice of Kuhn Poker and Liar's Dice and the private valuations of Blind Auction and
    Negotiation (card-imperfect-information); Pig is a dice game of chance with nothing hidden, and
    the Prisoner's Dilemma a simultaneous-move social dilemma. The benchmark's own claim is coverage
    of a game taxonomy, which is multi-game-suites' inclusion test. board-games and
    card-imperfect-information each hold four of the ten, too few for primary, and the paper's own
    grouping of the six non-deterministic games is stochasticity, not hidden information, so both
    are secondary and the subsets carry each game's own leaf.
  source: src-arxiv-2402-12348-v2
  quote: covering 6 mainstream game-theoretic configurations, including complete- and
    incomplete-information gaming, dynamic and static gaming, and probabilistic and deterministic
    gaming
domain_considered_and_rejected:
  - term: games-planning/game-theory
    reason: The name and the claim fit, but the leaf's definition is tasks scored against a
      game-theoretic solution concept rather than against opponents. GTBench's score is NRA against
      one opponent; the regret analysis that approximates a Nash equilibrium is a secondary study of
      two games (Blind Auction, the Prisoner's Dilemma), not the benchmark's score.
    source: src-arxiv-2402-12348-v2
    quote: In Figure 5a, we present the regret values of LLMs on Blind Auction and Iterated Prisoner
  - term: games-planning/multi-agent-social
    reason: Negotiation and the Prisoner's Dilemma have social content, but the paper chooses
      game-theoretic tasks precisely to strip out the role-play and narrative of social-deduction
      games such as Werewolf and Avalon.
    source: src-arxiv-2402-12348-v2
    quote: pure logic and strategic reasoning without the added complexity of backgrounds or
      character roles
  - term: society-econ-law/economics-simulation
    reason: Blind Auction, Negotiation and the Prisoner's Dilemma are economic games, but they are
      three of ten, and the score is a player's advantage over its opponent, not the economic
      outcome of the exchange that GLEE's classification rests on.
  - term: reasoning-general/logical-deduction
    reason: The paper calls its games "pure logic", but the family test sends a game played against
      an opponent that responds to games-planning, and nothing is scored as a derivation from
      premises.

capability: []
capability_note: Not tagged. The paper's claim is strategic and logical reasoning against opponents,
  which no capability term names; the miss is logged with `bench tag-gap` (proposed term
  strategic-reasoning).
capability_considered_and_rejected:
  - term: planning
    reason: A match is an interactive episode against an explicit objective, but the term's game
      clause needs the source to claim planning. The paper claims strategic and logical reasoning;
      planning appears only in its error analysis, as something the models do.
    source: src-arxiv-2402-12348-v2
    quote: LLM agents are capable of generating reasonable planning/strategies
  - term: deductive-reasoning
    reason: Correctness would have to be decidable from stated premises; the score is the outcome of
      matches against an opponent, not a conclusion checked against the rules.
  - term: quantitative-reasoning
    reason: Nim's XOR and the bids in Blind Auction and Liar's Dice need arithmetic, but the scored
      quantity is the match outcome, never a number the model reports.
  - term: collaboration
    reason: The Prisoner's Dilemma rewards implicit cooperation and Negotiation needs an agreement,
      but NRA scores each player's own reward against the other's, and the other eight games are
      zero-sum, which the term's exclusion test removes.
    source: src-arxiv-2402-12348-v2
    quote: achieving implicit collaboration
  - term: search-exploration
    reason: The opponent searches (MCTS); nothing scores how the entrant traversed its options.

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Each pairing is a set of matches run in OpenSpiel game environments, and the score, NRA,
    is bounded at -1 and 1 by construction. The opponent is fixed by the protocol (MCTS, Tit-for-Tat
    or a random agent, or GPT-3.5-turbo with the Prompt Agent), so the number is efficiency against
    a baseline on a bounded scale, which is the term's inclusion test. The simulator is OpenSpiel
    with GTBench's prompt adapter, and the formula is on the Metric gtbench-nra.
  source: src-arxiv-2402-12348-v2
  quote: is naturally normalized to [−1, 1], providing an interpretable meaning regarding the
    performance of Mi
evaluation_method_considered_and_rejected:
  - term: tournament-play
    reason: The paper computes Elo ratings from LLM-vs-LLM games (Table 6; initial rating 1500, K
      20), but the benchmark's score and its leaderboard are NRA against a common fixed opponent,
      and the term's exclusion test removes an entrant that plays only against a fixed baseline. The
      Elo table does not say which pairings it was fitted to (see review_checks).
    source: src-arxiv-2402-12348-v2
    quote: we take GPT-3.5-turbo with Prompt Agent as the common opponent and make other LLM-driven
      agents compete against it
  - term: episodic-return
    reason: Rewards accumulate in the non-zero-sum games, but NRA rescales them against a maximum
      that cannot be exceeded, which the term's exclusion test removes.
  - term: entrant-relative-ranking
    reason: The number depends on the opponent, but the opponent is fixed by the protocol and does
      not change when another entrant is added, which the term's exclusion test removes.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Every entrant runs inside the benchmark's own prompt adapter and modular prompts, and its
    reasoning method is one of the four the benchmark supplies, the same for every model. A row
    names the backbone model and that method; nothing in the protocol lets an entrant bring its own
    loop (the README's "Customized LLM Agent" section reads "Will be ready soon").
  source: src-arxiv-2402-12348-v2
  quote: LLM-Driven Reasoning Agent consists of backbone LLMs and reasoning paradigms.
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: The reasoning methods are scaffolds, but the benchmark supplies all four identically to
      every model, which the term's exclusion test sends to model-in-benchmark-harness; the method
      is recorded as a condition (comparability).
    source: src-github-gtbench-readme
    quote: '### Customized LLM Agent Will be ready soon.'
  - term: classical-algorithm
    reason: MCTS, Tit-for-Tat and the random agent are the opponents an NRA is measured against, not
      entrants whose own NRA is reported.
    source: src-arxiv-2402-12348-v2
    quote: We also include Random Agent that randomly selects action at each turn, serving as a
      baseline and sanity check.
  - term: multi-agent-system
    reason: Two agents interact in every match, but the opponent is supplied by the protocol to
      every entrant, which the term's exclusion test treats as environment.
  - term: hosted-inference-endpoint
    reason: The repository calls models through provider APIs, but the paper names dated snapshots
      (GPT-3.5-turbo-1106, GPT-4-0613), so the endpoint is the delivery mechanism for a specified
      model.
    source: src-github-gtbench-readme
    quote: Remote API access such as [OpenAI](https://openai.com/)

as_used:
  - protocol: Six GTBench games (Breakthrough, Connect Four, Tic-Tac-Toe, Kuhn Poker, Liar's Dice,
      Nim) played by a trained Qwen2-7B-Instruct agent against Random, MCTS (1000 simulations),
      GPT-3.5-turbo-0125 and GPT-4-turbo, 100 episodes per opponent, at GTBench's evaluation
      temperature of 0.2; scored by win rate (draws count 0.5), not NRA, plus head-to-head matches
      of 100 games between trained agents.
    source: src-arxiv-2510-16761-v1
    quote: In this experiment, we use the six games from GTBench to conduct direct battles between
      two players, with 100 games played in each match.
    note: The win rate and the opponents differ from GTBench's, so these numbers are not NRAs and do
      not compare with the paper's or the leaderboard's.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on GTBench's games, for example an October 2025 paper by
    another group that uses six of them as its testbed, though under its own metric and opponents
    (as_used). The repository was last pushed on 2024-09-06 and the leaderboard Space last changed
    on 2024-02-21, which is maintenance evidence, not lifecycle.
  source: src-arxiv-2510-16761-v1
  quote: In this work, we use GTBench as a testbed and select several games
activity: no-submission-channel
activity_basis:
  reason: The leaderboard shows the authors' own runs, and the README's route for uploading results
    to it was never published; no other route is described. The Space was last modified on
    2024-02-21.
  source: src-github-gtbench-readme
  quote: '### Upload to GTBench HF Leaderboard Will be ready soon.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4-0613 (CoT Agent)
    source: src-arxiv-2402-12348-v2
    observed_on: 2026-11-09
    quote: In general, GPT-4 is the most powerful LLM in strategic reasoning among all the examined
      LLMs.
    note: The paper's models include GPT-3.5-turbo-1106 and GPT-4-0613 among the commercial ones.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The OpenSpiel game's outcome or reward at the end of each match, a win,
  draw or loss, or the reward earned in a non-zero-sum game; there is no reference answer.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The code is public under MIT and runs any model through provider or OpenAI-compatible
    APIs. The paper's own numbers rest on dated commercial snapshots that a third party may no
    longer be able to call.
  source: src-github-gtbench-readme
  quote: python3 -m gamingbench.main

task:
  exists: true
  input:
    - a prompt assembled from four parts, a system prompt, the game's rules (head prompt), an
      observation of the current state with the legal moves (observation prompt) and the reasoning
      method's instruction (reasoning prompt)
  output: One legal action per turn in the game's action format, until the match ends; a match with
    an illegal move is not counted, and play continues until 50 valid matches are complete.
  scoring: NRA of the entrant against its opponent over 50 valid matches, each side moving first in
    25, in [-1, 1]; zero-sum games score a win 1, a draw 0.5 and a loss 0, non-zero-sum games the
    reward earned. Results are reported per game and as averages across games.
  metric: gtbench-nra
  metric_range:
    - -1
    - 1
  source: src-arxiv-2402-12348-v2
  quote: 'Prompts are designed to be modular, consisting of four individual components: System Prompt,
    Head Prompt, Observation Prompt, and Reasoning Prompt.'

# --- Data ------------------------------------------------------------------------------------

data:
  access: generated-on-demand
  access_basis:
    reason: Every scored match is played out in a game engine as it runs, between the entrant and
      its opponent; there is no stored item set to obtain.
    source: src-arxiv-2402-12348-v2
    quote: all of the gaming environments are built on top of OpenSpiel
  refresh: null
  refresh_note: Not established. The paper's two arXiv versions differ at least in the models
    evaluated (v2 adds Llama-3-70b-Instruct), v1 was not read, and no source versions the games,
    prompts or scoring. The repository's last commits (2024-09) change dependencies and add a
    licence.
  data_provenance:
    - synthetic-procedural
  data_provenance_note: Positions, deals and dice come from OpenSpiel's rule engines, with no
    learned model generating them; the entrants' and opponents' moves are the evaluation, not its
    data.
  data_provenance_source: src-arxiv-2402-12348-v2
  data_provenance_quote: all of the gaming environments are built on top of OpenSpiel
  contamination_risk: low
  contamination_risk_note: Matches are played, not retrieved, so no training set can hold them. What
    a model may have read is strategy for well-known games (Tic-Tac-Toe and Nim are solved, Kuhn
    Poker has a known equilibrium), which is knowledge of the game, not of the scored content; the
    published prompts and game logs could be trained on, which matters only for the prompt format.
    Recorded, not escalated.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: NRA is bounded at 1, every match won, but the attainable value depends
    on the opponent and the game. Against a near-optimal MCTS in Tic-Tac-Toe, a solved game with a
    forced draw, perfect play reaches 0. The Metric declares no headroom for that reason.
  ceiling_anchor_type_basis:
    reason: The score is bounded by construction.
    source: src-arxiv-2402-12348-v2
    quote: is naturally normalized to [−1, 1], providing an interpretable meaning regarding the
      performance of Mi
  size:
    - count: 10
      unit: games
      source: src-arxiv-2402-12348-v2
      quote: we propose GTBENCH, an environment consisting of 10 widely recognized game-theoretic
        tasks, across a comprehensive taxonomy of games
    - count: 4
      unit: games
      subset: gtbench#complete-deterministic
      source: src-arxiv-2402-12348-v2
      quote: 'There are four complete and deterministic tasks supported in GTBENCH: Tic-Tac-Toe, Connect-4,
        Breakthrough, and Nim.'
    - count: 50
      unit: valid matches per pairing
      source: src-arxiv-2402-12348-v2
      quote: For each competition, we run 50 valid matches. The final performance is measured by the
        averaged NRA over the 50 valid matches.
  size_note: The games are generated as played, so the counts are games and matches, not items. The
    remaining six games form the incomplete and probabilistic group (subsets).

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The GTBench authors (Drexel University and collaborators)
  maintainer_basis:
    reason: The paper's authors are at Drexel University, Boston University, LLNL, Lehigh
      University, UNC Chapel Hill, MIT and Harvard. The code sits in one author's personal GitHub
      account, and the leaderboard in a Hugging Face organisation named GTBench, with no institution
      stated as the holder of either.
    source: src-arxiv-2402-12348-v2
    quote: Drexel University 2Boston University 3LLNL 4Lehigh University 5UNC Chapel Hill 6MIT
      7Harvard University
  maintainer_type: individual
  maintainer_type_note: academic-lab's exclusion test sends a benchmark whose repository sits in one
    person's own account, with no institution stated as its holder, to individual; the authors'
    affiliations are academic and governmental. The repository was last pushed on 2024-09-06 (GitHub
    API), which is maintenance evidence.
  submission_process:
    - maintainer-run
  submission_process_note: The authors run every model and agent themselves and publish the results
    in the paper and on their Hugging Face leaderboard. The README's upload route says "Will be
    ready soon" and was not published by the commit read.
  submission_process_source: src-arxiv-2402-12348-v2
  submission_process_quote: The code and leaderboard will be public and continuously updated for
    future reasoning agents and LLMs.
  independence_flags: []
  independence_flags_note: Not assessed. The v2 preprint read has no acknowledgements or funding
    statement, and the NeurIPS camera-ready, which may carry one, was not read. The authors evaluate
    other parties' models and none of their own, as far as the paper shows.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: Models are called through provider or OpenAI-compatible APIs, and the game engines and
      the MCTS opponent run on an ordinary CPU.
    source: src-github-gtbench-readme
    quote: GTBench uses [LangChain](https://github.com/langchain-ai/langchain) for LLM Inference
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: One script plays and scores every match end to end, with a cap on attempts when a model
      keeps producing illegal moves; no human or physical step is involved.
    source: src-github-gtbench-readme
    quote: threshold_matches=100 # maximum number of matches, stop criteria for low completion rate
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: gamingbench (python3 -m gamingbench.main, with per-game, per-model and per-agent
    configs), on OpenSpiel
  harness_source: src-github-gtbench-readme
  harness_quote: python3 -m gamingbench.main
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for the repository, read 2026-11-09; the LICENSE file
    was added on 2024-09-04 and its text was not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # No profile resolves: model-in-benchmark-harness is in no profile's applies_to, and simulation-rollout pairs
  # only with RL, scaffold, robot and classical subjects (as for Kaggle Game Arena), so the fallback's subset_used
  # (the game) is the floor. Beyond it, what the paper holds fixed and a rerun could change: the harness and its
  # prompt templates (the paper studies prompt sensitivity), the reasoning method (scaffold: Prompt, CoT, SC-CoT,
  # ToT), sampling (temperature 0.2, at most 1024 tokens), the number of valid matches (50), and the model
  # snapshot. The opponent is the most material condition of all (an NRA is defined only against it); no
  # EvalConditions field names an opponent, so user_simulator, the field for a counterpart the benchmark
  # supplies, carries it here (review_checks).
  material_extra:
    - harness
    - prompt_template_hash
    - scaffold
    - sampling
    - n_samples
    - provider_snapshot
    - user_simulator
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper's LLM-vs-LLM leaderboard ranks agents by their NRA averaged across the ten
    games, and its tables average NRA over the deterministic and the probabilistic games.
  source: src-arxiv-2402-12348-v2
  quote: NRA confusion matrix of LLM vs. LLM across ten games ranked by average NRA.
headline_metric: gtbench-nra

homepage: https://huggingface.co/spaces/GTBench/GTBench
repository: https://github.com/jinhaoduan/GTBench
leaderboard_url: https://huggingface.co/spaces/GTBench/GTBench

subsets:
  - id: gtbench#complete-deterministic
    label: Complete and deterministic games
    scored_separately: true
    domain_override:
      primary: games-planning/board-games
    evidence:
      - source: src-arxiv-2402-12348-v2
        quote: 'There are four complete and deterministic tasks supported in GTBENCH: Tic-Tac-Toe, Connect-4,
          Breakthrough, and Nim.'
      - source: src-arxiv-2402-12348-v2
        quote: all the LLM agents equipped with various reasoning methods achieve NRA as −1, meaning
          that LLM agents can barely win even a single match
    notes: Perfect-information games with no chance. Against MCTS (1000 simulations), which the
      paper says plays near-optimally here, every LLM agent in the paper scored -1; against the
      random agent all scored well above 0.
  - id: gtbench#tic-tac-toe
    label: Tic-Tac-Toe
    parent: gtbench#complete-deterministic
    scored_separately: true
  - id: gtbench#connect-4
    label: Connect-4
    parent: gtbench#complete-deterministic
    scored_separately: true
  - id: gtbench#breakthrough
    label: Breakthrough
    parent: gtbench#complete-deterministic
    scored_separately: true
    evidence:
      - source: src-arxiv-2402-12348-v2
        quote: we scale the size of the board to 3*8 while maintaining its competitiveness
    notes: Played on a 3x8 board rather than the standard 8x8.
  - id: gtbench#nim
    label: Nim
    parent: gtbench#complete-deterministic
    scored_separately: true
    notes: Four piles of 1, 3, 5 and 7 matches; the player who takes the last match loses.
  - id: gtbench#incomplete-probabilistic
    label: Incomplete-information and probabilistic games
    scored_separately: true
    evidence:
      - source: src-arxiv-2402-12348-v2
        quote: 'Blind Auction, Negotiation, Pig, and one dynamic task: Iterated Prisoner'
      - source: src-arxiv-2402-12348-v2
        quote: We group these games together as they all involve stochasticity in the gameplay
    notes: Kuhn Poker, Liar's Dice, Blind Auction, Negotiation and Pig, which the paper calls
      probabilistic, and the Iterated Prisoner's Dilemma. The conventional opponent is MCTS, except
      Tit-for-Tat in the Prisoner's Dilemma, and the random opponent is omitted for Negotiation and
      the Prisoner's Dilemma. NRAs against MCTS are near 0 here apart from Liar's Dice.
  - id: gtbench#kuhn-poker
    label: Kuhn Poker
    parent: gtbench#incomplete-probabilistic
    scored_separately: true
    domain_override:
      primary: games-planning/card-imperfect-information
    evidence:
      - source: src-arxiv-2402-12348-v2
        quote: e.g., Kuhn Poker where GPT-4 outperforms MCTS Agent
  - id: gtbench#liars-dice
    label: Liar's Dice
    parent: gtbench#incomplete-probabilistic
    scored_separately: true
    domain_override:
      primary: games-planning/card-imperfect-information
    notes: Two players with one die each.
  - id: gtbench#blind-auction
    label: Blind Auction
    parent: gtbench#incomplete-probabilistic
    scored_separately: true
    domain_override:
      primary: games-planning/card-imperfect-information
    evidence:
      - source: src-arxiv-2402-12348-v2
        quote: For non-zero-sum games, e.g., Blind Auction, fs(Mi, m) is the rewards earned by Mi at
          the m-th match.
    notes: A first-price sealed-bid auction with private valuations; non-zero-sum, scored on
      rewards.
  - id: gtbench#negotiation
    label: Negotiation
    parent: gtbench#incomplete-probabilistic
    scored_separately: true
    domain_override:
      primary: games-planning/card-imperfect-information
    notes: Proposals and utterances over a pool of items that each player values privately.
  - id: gtbench#pig
    label: Pig

    changes: The scenarios, puppets and bots of the NeurIPS 2023 contest added to the package.
    breaking: true
    supersedes_version: 2.1.0
    superseded_by: 2.4.0
    errata:
      - date: 2024-06-27
        scope: clean_up_20 and territory__rooms_6
        description: Two contest scenarios were set up wrongly, clean_up_20 with the wrong puppet
          bot and territory__rooms_6 a duplicate of territory__rooms_5; 2.4.0 fixed the first and
          deleted the second.
        source: src-github-meltingpot-changelog
    frozen: true
    sources:

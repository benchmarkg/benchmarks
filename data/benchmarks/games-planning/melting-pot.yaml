        description: Release 1.0.3 corrected which players are focal in team-vs-team scenarios.
        source: src-github-meltingpot-changelog
    frozen: true
    sources:
      - src-arxiv-2107-06857
      - src-arxiv-2107-06857-v1
      - src-github-meltingpot-changelog
  - version: 2.0.0

# data/benchmarks/games-planning/melting-pot.yaml
#
# P1-S11-T03, games-planning entry 5 of 6. Filled from the Melting Pot paper, arXiv 2107.06857 read as its v1 PDF
# (2021-07-14, ICML 2021), and its abstract page; the Melting Pot 2.0 report, arXiv 2211.13746 read as its v6 PDF
# (2023-10-31), and its abstract page; the repository's README and CHANGELOG at main (google-deepmind/meltingpot);
# the NeurIPS 2023 contest page on AIcrowd (scripts and styles stripped); and two papers that use it since, the v1
# PDFs of Bidirectional Distillation (arXiv 2505.11100, May 2025) and of Training Small LLMs as Spatial Multi-Agent
# Policies (arXiv 2608.01425, August 2026). Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# The suite, 1.0 and 2.x as versions. The NeurIPS 2023 contest ran on it and is recorded as an event, with its
# submission route in history; the corpus classification read it as a separate event (see review_checks).

id: melting-pot
name: Melting Pot
aliases:
  - Melting Pot 2.0
  - meltingpot
  - dm-meltingpot
tagline: Multi-agent RL suite scoring trained populations against unfamiliar co-players in 256+
  held-out social scenarios.
description: >
  A multi-agent reinforcement learning evaluation suite from DeepMind, built on the DeepMind Lab2D
  gridworld engine. A substrate is a partially observed multi-agent game, from social dilemmas such as
  Clean Up and Commons Harvest to coordination games, matrix games played in space and team
  competitions such as Paintball. A test scenario pairs a substrate with a background population of
  pretrained bots that the agents under test have never met. The entrant is a multi-agent population
  learning algorithm: it may train a population on the substrates however it likes, and the population
  is then placed zero-shot into the scenarios, in resident mode (focal players in the majority) or
  visitor mode (background bots in the majority). The primary metric is the focal-population per-capita
  return, the mean return of the focal players; the release papers min-max normalise it per scenario
  between the worst and best agent evaluated and average it over each substrate's scenarios. Melting
  Pot 1.0 (ICML 2021) had 21 substrates and over 80 scenarios; Melting Pot 2.0 (2022) replaced them all,
  added roles for asymmetric games, and the suite now counts over 50 substrates and over 256 scenarios.
  A NeurIPS 2023 contest on AIcrowd, run with the Cooperative AI Foundation and MIT, scored submitted
  populations on held-out scenarios of four substrates; those scenarios joined the package in v2.3.0.
  There is no standing leaderboard, and results appear in users' papers.
self_description:
  source: src-arxiv-2211-13746
  quote: Melting Pot is a research tool developed to facilitate work on multi-agent artificial
    intelligence, and provides an evaluation protocol that measures generalization to novel social
    partners in a set of canonical test scenarios
external_ids:
  arxiv: '2107.06857'
paper:
  title: Scalable Evaluation of Multi-Agent Reinforcement Learning with Melting Pot
  arxiv: '2107.06857'
  version_read: v1
  source: src-arxiv-2107-06857-v1
released: 2021-07-14
released_note: The first paper's only arXiv version, as its abstract page dates it. The CHANGELOG
  dates release 1.0.0 two days later, 2021-07-16.
released_source: src-arxiv-2107-06857
released_quote: Submitted on 14 Jul 2021
release_venue: ICML 2021
release_venue_source: src-arxiv-2107-06857
release_venue_quote: Accepted to ICML 2021

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/multi-agent-social
domain_basis:
  reason: Every substrate is a multi-agent game played against co-players that respond, and the
    suite is built around social interaction, most scenarios mixing cooperative and competitive
    incentives, which is the leaf's case and the corpus classification's call.
  source: src-github-meltingpot-readme
  quote: 'has been designed to test a broad range of social interactions such as: cooperation, competition,
    deception, reciprocation, trust, stubbornness and so on'
domain_considered_and_rejected:
  - term: games-planning/multi-game-suites
    reason: The suite holds many games, but every one is a multi-agent social game, so one subdomain
      holds them all, the term's exclusion.
  - term: games-planning/game-theory
    reason: The matrix-game substrates borrow classic payoff matrices, but every scenario is scored
      by return against a background population, not against a game-theoretic solution concept.
capability:
  - distribution-shift-generalization
  - collaboration
capability_basis:
  distribution-shift-generalization:
    reason: Each scenario keeps a substrate the population trained on and replaces its co-players
      with a held-out background population, so the task is unchanged and only who else acts in it
      moves. The papers report the self-play (training) score beside the scenario scores.
    source: src-arxiv-2107-06857-v1
    quote: test scenarios that preserve a familiar substrate while substituting a new and unfamiliar
      background population
  collaboration:
    reason: The suite claims cooperation among the interactions it tests and scores the mean return
      of the focal players, an outcome they reach together. Most scenarios are mixed-motive, which
      collaboration's exclusion admits under those two conditions; the zero-sum substrates are a
      minority.
    source: src-arxiv-2211-13746
    quote: a clear majority of scenarios in Melting Pot have mixed incentives
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The substrate, its rules and its reward are those the population trained on; only the
      co-players change, which transfer-learning's exclusion sends to
      distribution-shift-generalization.
    source: src-arxiv-2211-13746-v6
    quote: the kind of generalization that Melting Pot probes is mainly along social dimensions, not
      physical dimensions
  - term: communication
    reason: The first paper left communication and language out of the suite on purpose, and no
      scenario scores a message's transfer.
    source: src-arxiv-2107-06857-v1
    quote: The largest category of extant research that we left unrepresented is
      communication/language
  - term: sensorimotor-control
    reason: Agents move avatars in a 2D gridworld, but the score is the return of a social game, not
      the physical behaviour of a body.
  - term: perception
    reason: The input is egocentric RGB pixels, but the score is return, not what was recovered from
      the images.

evaluation_method:
  - episodic-return
  - entrant-relative-ranking
evaluation_method_basis:
  reason: The primary metric is the focal players' mean episode return, a reward accumulated with no
    defined maximum (episodic-return). The figures the release papers publish rescale it per
    scenario between the worst and the best agent in the evaluated set, so adding an agent that
    beats the best moves every other agent's score (entrant-relative-ranking); papers using the
    suite do the same.
  source: src-arxiv-2107-06857-v1
  quote: We propose the focal-population per-capita return as a primary evaluation metric
evaluation_method_considered_and_rejected:
  - term: tournament-play
    reason: Entrants never play each other; each population plays the scenario's held-out bots, and
      the first paper's Elo is computed over the scores the agents earned that way.
  - term: simulation-rollout
    reason: Episodes run in a simulator, but the score is unbounded return, not a bounded success
      outcome, which simulation-rollout's exclusion sends to episodic-return.
designed_for_subjects:
  - rl-policy
  - multi-agent-system
designed_for_subjects_basis:
  reason: The entrant is a multi-agent population learning algorithm, a training process that
    produces a population of reinforcement-learning policies on the substrates, and the population's
    focal players are scored together. The background bots are the environment, the same for every
    entrant; the field describes the focal population, which the taxonomy's own example for
    multi-agent-system names.
  source: src-github-meltingpot-readme
  quote: The resulting score can then be used to rank different multi-agent RL algorithms by their
    ability to generalize to novel social situations.
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: Language-model agents now act in Melting Pot substrates (observed_subjects), but the
      suite was built for populations trained on its substrates.
observed_subjects:
  values:
    - rl-policy
    - multi-agent-system
    - agent-scaffold
  basis: >
    Most results are trained MARL populations (BiDist, May 2025, against OPRE, RPM and MAPPO). An
    August 2026 paper casts small language models as the agents of the clean_up substrate, each with a
    LoRA adapter trained on the substrate by multi-agent GRPO (rl-policy on such a claim), and compares
    them with the same models frozen and prompted over an option library (agent-scaffold).
  source: src-arxiv-2608-01425-v1
as_used:
  - protocol: The min-max normalised focal per-capita return on the first five scenarios of each of
      five substrates, normalised within each scenario across the methods compared, from 10 test
      games per checkpoint and 3 training seeds.
    split: scenarios 0-4
    source: src-arxiv-2505-11100-v1
    quote: We report the min-max normalized focal per-capita returns of the first five test
      scenarios (scenarios 0-4) for each substrate.
    note: BiDist (May 2025); the methods compared are the pool its normalisation runs over.
  - protocol: Team reward (apples per 150-step episode) on the clean_up substrate with every player
      drawn from the trained population and no background population, so a substrate score, not a
      test scenario's.
    source: src-arxiv-2608-01425-v1
    quote: (clean_up substrate, 7 agents, 150-step episodes)
    note: Small language models as the agents (August 2026), with Overcooked-AI and Commons Harvest
      beside Clean Up.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it. A May 2025 paper reports scenario scores under the
    suite's protocol, an August 2026 paper trains language-model agents on a substrate, and the
    repository was last pushed on 2026-10-13, with release 2.4.1 on 2026-09-30 (GitHub API; the
    pushes are maintenance evidence, not lifecycle).
  source: src-arxiv-2505-11100-v1
  quote: We report the min-max normalized focal per-capita returns of the first five test scenarios
    (scenarios 0-4) for each substrate.
activity: closed
activity_basis:
  reason: The suite has no leaderboard or server; its one route for outside entries was the NeurIPS
    2023 contest on AIcrowd, which ended in November 2023 and has not run again.
  source: src-aicrowd-meltingpot-challenge-2023
  quote: 'Round 1: Completed'
events:
  - name: Melting Pot Contest at NeurIPS 2023
    kind: online-challenge    # submitted populations scored on held-out scenarios of four substrates
    source: src-aicrowd-meltingpot-challenge-2023
    quote: organised by researchers from the Cooperative AI Foundation, MIT, and Google DeepMind

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: V-MPO (the first paper's top baseline)
    source: src-arxiv-2107-06857-v1
    observed_on: 2026-10-14
    quote: On average, the top performing agent was V-MPO (Song et al., 2020a), followed by OPRE
      (Vezhnevets et al., 2020)
  - system: BiDist (Bidirectional Distillation)
    source: src-arxiv-2505-11100-v1
    observed_on: 2026-10-14
    quote: our BiDist consistently achieves high normalized focal per-capita returns across varying
      dynamics
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each player's reward as the substrate's rules compute it in the simulator;
  the background bots are fixed pretrained policies.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Substrates, scenarios, background bots and the evaluation library are released and install
    from PyPI, so anyone can score a population on every scenario.
  source: src-github-meltingpot-readme
  quote: library can be used to evaluate [SavedModel]

task:
  exists: true
  input:
    - each focal player's partial egocentric RGB view of a 2D gridworld, in a scenario where some
      players are held-out background bots
  output: One discrete action per focal player per step (moving, turning and the substrate's own
    actions, such as zapping or cleaning), for the length of the episode.
  scoring: The focal per-capita return, the mean episode return of the focal players with the
    background players left out, per scenario. The release papers min-max normalise it per scenario
    between the worst and the best agent evaluated, average it over each substrate's scenarios, and
    report an overall average.
  source: src-arxiv-2107-06857-v1
  quote: Performance on a test scenario by a focal population f is measured by the expected
    per-capita return as before, except that background players are excluded from the mean

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every substrate and scenario, the background bots among them, ships with the package on
      PyPI; that agents must not train on the bots is a rule of the protocol, not an access control.
    source: src-github-meltingpot-readme
    quote: pip install dm-meltingpot
  refresh: versioned-releases
  refresh_basis:
    reason: Scenarios change only in numbered releases recorded in the CHANGELOG, from 2.0.0's
      replacement of every 1.0 scenario to 2.4.0's fix of two contest scenarios.
    source: src-github-meltingpot-changelog
    quote: this project adheres to [Semantic Versioning]
  data_provenance:
    - simulation-generated
    - model-generated
  data_provenance_note: Scenarios run in DeepMind Lab2D, and their background populations are agents
    trained with reinforcement learning, some chained into scripted behaviours ("puppets") from
    trained sub-policies.
  data_provenance_source: src-arxiv-2107-06857-v1
  data_provenance_quote: Members of the background population are RL agents.
  contamination_risk: medium
  contamination_risk_note: The protocol forbids training on the background populations, but the bots
    ship with the package, the contest's held-out scenarios among them since 2.3.0, so training on
    the test co-players is a plausible route that only the rule closes. No source evidences it.
  contamination_risk_source: src-arxiv-2107-06857-v1
  contamination_risk_quote: Note that the learning algorithms only have access to the raw substrates
    and not the background populations.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_basis:
    reason: Raw return has no maximum, and the published scores are normalised to the best agent of
      the pool. An exploiter trained on each scenario is a rough upper estimate, not a limit scores
      are read against, and it is not always the best agent.
    source: src-arxiv-2107-06857-v1
    quote: Often the score of 0 corresponds to the random agent and 1 to the exploiter. However, for
      some scenarios this is not the case.
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the scenarios and bots as distinct from
    the code; GitHub reports the repository's licence as Apache-2.0 (execution.code_licence).
  size:
    - count: 256
      unit: test scenarios
      subset: the current 2.x release
      note: A lower bound; the README says over 256, and the installed release was not counted.
      source: src-github-meltingpot-readme
      quote: over 256 unique test
    - count: 50
      unit: substrates
      subset: the current 2.x release
      note: A lower bound; the README says over 50.
      source: src-github-meltingpot-readme
      quote: over 50 multi-agent reinforcement learning
    - count: 21
      unit: substrates
      subset: Melting Pot 1.0
      source: src-arxiv-2107-06857-v1
      quote: we performed 21 training runs— one for each substrate
    - count: 80
      unit: test scenarios
      subset: Melting Pot 1.0
      note: A lower bound; the abstract says over 80, the paper's conclusion about 85.
      source: src-arxiv-2107-06857
      quote: we have created over 80 unique test scenarios
    - count: 4
      unit: substrates
      subset: the NeurIPS 2023 contest
      source: src-aicrowd-meltingpot-challenge-2023
      quote: we will specifically focus on the following four substrates

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Google DeepMind
  maintainer_basis:
    reason: The repository and the PyPI package sit in Google DeepMind's GitHub organisation, the
      authors of both papers are at DeepMind, and the README states the intention to maintain it.
    source: src-github-meltingpot-readme
    quote: We plan to maintain it, and will be extending it in the coming years
  maintainer_type: industry-lab
  maintainer_type_note: The README's closing line ("This is not an officially supported Google
    product") is Google's usual open-source disclaimer; the holder is still Google DeepMind.
  submission_process:
    - literature-only
  submission_process_note: There is no leaderboard or results route. The README points to a notebook
    of the 2.0 report's results, extended in 2.3.1 with the contest's baselines, and other groups
    publish their numbers in their own papers. The 2023 contest was the one route for outside
    entries (history).
  submission_process_source: src-github-meltingpot-readme
  submission_process_quote: Evaluation results from the [Melting Pot 2.0 Tech Report]
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2107-06857-v1
      quote: On average, the top performing agent was V-MPO (Song et al., 2020a), followed by OPRE
        (Vezhnevets et al., 2020)
  independence_flags_note: The release papers rank the maintainers' own runs of DeepMind
    architectures (A3C/ACB, V-MPO, OPRE), and OPRE's first author is a Melting Pot author. With no
    ranking of its own, the flag rests on those release results. Google DeepMind also co-organised
    the 2023 contest; its page names a $10,000 prize pool but no sponsor, so
    prize-sponsored-by-industry is not tagged.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_basis:
    reason: Every run needs the DeepMind Lab2D simulator, whatever population is entered; training
      the population is not part of the run (the taxonomy's own example).
    source: src-github-meltingpot-readme
    quote: Melting Pot is built on top of [DeepMind Lab2D]
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: Scoring a saved population on the scenarios is automatic, but only inside Lab2D and the
      package's scenario definitions.
    source: src-arxiv-2107-06857-v1
    quote: We built substrates on DMLab2D
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: meltingpot.utils.evaluation (the evaluation library, added in 2.2.0)
  harness_source: src-github-meltingpot-readme
  harness_quote: trained on Melting Pot substrates
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for google-deepmind/meltingpot, read 2026-10-14; not
    a quoted Source. UK AISI inspect_evals' listing, read the same day, has no Melting Pot
    implementation.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile (episodic-return with rl-policy): what the population was trained on, since the
  # protocol bars training on the background bots, which ship with the package. The version (1.0's scenarios are
  # gone from 2.x, and 2.4.0 changed two contest scenarios) and the scenarios used go under subset_used; the agents a
  # normalised score was rescaled against are the pool, and a raw per-capita return needs none.
  material_extra:
    - training_data_policy

homepage: https://github.com/google-deepmind/meltingpot
repository: https://github.com/google-deepmind/meltingpot

versions:
  - version: 1.0.0
    label: Melting Pot 1.0 (ICML 2021)
    version_kind: edition
    released: 2021-07-16
    changes: The first release, with 21 substrates and over 80 test scenarios, symmetric games only.
    breaking: true
    superseded_by: 2.0.0
    errata:
      - date: 2021-10-01
        description: Release 1.0.1 fixed substrates and scenarios that did not operate as intended,
          among them bots receiving incorrect timesteps in scenarios.
        source: src-github-meltingpot-changelog

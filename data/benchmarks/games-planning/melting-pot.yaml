    version_kind: edition
    released: 2022-11-25
    changes: Every 1.0 substrate, bot and scenario removed and replaced; roles added for asymmetric
      games; more than twice the substrates and three times the scenarios of 1.0.
    breaking: true
    supersedes_version: 1.0.0
    superseded_by: 2.1.0
    frozen: true
    sources:
      - src-github-meltingpot-changelog
      - src-arxiv-2211-13746
      - src-arxiv-2211-13746-v6
  - version: 2.1.0
    label: Melting Pot 2.1
    version_kind: revision
    released: 2022-12-06
    changes: The Hidden Agenda substrate and its scenarios added, and bots resampled at the start of
      every scenario episode.
    breaking: true

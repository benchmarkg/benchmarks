history:
  - date: 2023-08-31
    event: channel-opened
    field: governance.submission_process
    to: containerized-algorithm-submission
    source: src-aicrowd-meltingpot-challenge-2023
    quote: 'August 31: Development phase begins'
    note: The NeurIPS 2023 contest on AIcrowd opened; the year is the contest's. Participants
      submitted trained populations, one per substrate, which the organisers ran on held-out
      scenarios. The page names a submission starter kit, not a container; this is the closest term.
  - date: 2023-11-18
    event: channel-closed
    field: governance.submission_process
    from: containerized-algorithm-submission
    to: literature-only
    source: src-aicrowd-meltingpot-challenge-2023
    quote: 'November 18: Development/Generalization phase Ends (i.e. participants can no longer make submission'
    note: The page's updated timeline; final evaluation on the held-out scenarios followed, and the
      round is marked completed.

tags:
  - multi-agent
  - reinforcement-learning
  - social-dilemmas
  - zero-shot-generalisation
  - cooperative-ai

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2107-06857-v1
    - src-arxiv-2107-06857
    - src-arxiv-2211-13746-v6
    - src-arxiv-2211-13746
    - src-github-meltingpot-readme
    - src-github-meltingpot-changelog
    - src-aicrowd-meltingpot-challenge-2023
    - src-arxiv-2505-11100-v1
    - src-arxiv-2608-01425-v1
  sources_note: >
    Both papers' PDFs (DOIs, not archived) read as text, and their abstract pages for dates and venue;
    the README and CHANGELOG at main; the AIcrowd contest page with scripts and styles stripped; and two
    papers' v1 PDFs as evidence of current use. Substrates and scenarios are scored separately in the
    papers but are not listed as subsets: there are over 300 of them, and subset_used carries the
    choice.
  confidence: medium
  review_checks:
    - check: The contest is recorded as an event on this entry, so the suite had a route for outside
        entries and activity is closed, with the route in history. The corpus classification
        (P1-S1-T08) read the contest as a separate event and gave no-submission-channel and
        literature-only. The contest's scenarios joined the package in 2.3.0 and its baselines the
        README's notebook in 2.3.1, which is why it is folded in here.
      field: activity
      source: src-github-meltingpot-changelog
      quote: New scenarios, puppets and bots used in the Melting Pot Contest, NeurIPS 2023.
    - check: The history's containerized-algorithm-submission is the nearest term; the contest page
        says populations were submitted through a starter kit and run on held-out scenarios, not
        that they were containers.
      field: history
      source: src-aicrowd-meltingpot-challenge-2023
      quote: Contestants submit populations for evaluation, one per substrate.
    - check: entrant-relative-ranking rests on the release papers' and users' per-scenario min-max
        normalisation across the agents compared; the contest instead normalised to the fixed MP2.0
        baseline range, which is not pool-relative. comparability.rating_pool_required is left false
        because the defined primary metric, raw per-capita return, needs no pool.
      field: evaluation_method
      source: src-aicrowd-meltingpot-challenge-2023
      quote: focal per-capita rewards are normalized based on the MP2.0's baseline range
    - check: lifecycle active rests on a May 2025 paper using the scenario protocol and an August
        2026 paper using one substrate without background bots; the corpus classification abstained
        (failure 2026-09-28-melting-pot-003).
      field: lifecycle
    - check: maintainer-competes-on-own-benchmark rests on the release papers' baselines (OPRE by a
        Melting Pot author); ManiSkill's entry, also literature-only, records no flag for its own
        baselines.
      field: governance.independence_flags
    - check: data_provenance takes simulation-generated, as the classification did, although the
        first paper likens Lab2D's entity-component system to a game engine, which
        synthetic-procedural covers.
      field: data.data_provenance

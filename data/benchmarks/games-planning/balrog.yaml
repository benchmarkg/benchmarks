# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2411-13543-v2
    - src-arxiv-2411-13543
    - src-balrogai-site
    - src-balrogai-submit
    - src-github-balrog-readme
    - src-github-balrog-evaluation-doc
    - src-arxiv-2608-08466
    - src-epoch-benchmark-data
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its abstract page for the dates, venue
    and CC BY licence; the site's front page with scripts and styles stripped (withheld from archiving:
    it names the authors and ends with an author's e-mail address), whose two leaderboards are static
    HTML, and the submission page; the README and the evaluation guide at commit b7afe79e; the abstract
    page of an August 2026 paper (a DOI) as evidence of current use; and Epoch's export for the Balrog
    string. Not read: the BALROG/experiments repository, the per-row trajectory viewer, docs/agents.md
    and the few-shot guide, and the six environments' own sources. The scaffolded Source src-balrogai-com
    (Epoch's link to the same front page) has no extract and is not cited.
  confidence: medium
  review_checks:
    - check: The independence flags are not assessed. The paper thanks the Gemini Academic Program
        for support of unstated kind and Gemini models are ranked; if a reviewer confirms the
        programme is the model provider's and the support was money, credits or compute,
        funded-by-evaluated-party applies (the Stage 3 record set it). One author's Anthropic
        affiliation, with Claude models ranked, has no flag of its own.
      field: governance.independence_flags
    - check: Stage 3's record says the leaderboard has LLM, VLM and Agent modes. The page read has
        two tabs, LLM and VLM; Agent is the heading of the model column. Subsets follow the page.
      field: subsets
      source: src-balrogai-site
      quote: Agent % Progress BabyAI Crafter BabaIsAI MiniHack NetHack Date
    - check: The site's legend for the check mark speaks of reproducing "the patch generations",
        which reads as copied from SWE-bench's template (the site says it uses it); the submission
        page's own wording is a re-run on a random subset. The five September 2026 rows, the board's
        top three among them, are unverified.
      field: governance.submission_process
      source: src-balrogai-site
      quote: Checked indicates that we, the BALROG team, received access to the system and were able
        to reproduce the patch generations.
    - check: Epoch's string "Balrog" names no track. Its score column, Average progress, matches
        both boards' headline; which board (LLM or VLM) Epoch reads was not checked against its CSV
        rows.
      field: external_ids.epoch
      source: src-epoch-benchmark-data
      quote: Balrog,True,balrog_external.csv,Average progress
    - check: No versions are recorded. The board mixes rows from 2024-11 to 2026-09 run on whatever
        harness commit the entrant used, with history length, temperature and agent left to the
        entrant, and BALROG labels no release; the paper's v1 and v2 are revisions of the text, not
        of the benchmark. If the harness or the environment wrappers changed scoring, a revision
        belongs here.
      field: versions
    - check: procedural-generalization was rejected. All environments are procedurally generated and
        the models never trained on them, which could be read as evaluation on unseen levels; the
        paper presents the generation as leakage control and has no train/test split.
      field: domain
      source: src-arxiv-2411-13543-v2
      quote: ensuring rigorous and fair comparisons by preventing test-set leakage
    - check: data.access is generated-on-demand, as craftax has it, where nle.yaml has fully-open
        for the same situation. No source read says whether evaluation seeds are fixed, which
        decides whether two runs see the same episodes.
      field: data.access
    - check: The paper's MiniHack task list differs between section 2.1 (five tasks) and Appendix E
        (Maze 9x9 and 15x15, Corridor, CorridorBattle, Quest Easy and Medium, Boxoban), and the
        episode count per task is not stated; data.size follows section 2.1.
      field: data.size
      source: src-arxiv-2411-13543-v2
      quote: From the MiniHack Navigation Tasks, we picked Maze 9x9, Maze 15x15, Corridor and
        CorridorBattle
    - check: The domain overrides on the Crafter, Baba Is AI and NetHack subsets, and the
        secondaries, are drawn from the paper's descriptions of the environments; BabyAI, TextWorld
        and MiniHack get none because no single leaf fits them. A reviewer may prefer no overrides.
      field: subsets
    - check: The newest rows carry a Max suffix (GPT-6-Astra-Max, Claude-Opus-5-Max) whose meaning,
        presumably a reasoning-effort setting, no source read states; the experiments repository's
        metadata for them was not read.
      field: observed_subjects
  personal_data_excluded:
    - source: src-balrogai-site
      what: the author list under the title, the BibTeX citation's author list and an author's
        correspondence e-mail address
    - source: src-arxiv-2411-13543-v2
      what: the author block with its contact e-mail address, and the acknowledgements naming
        individuals
    - source: src-arxiv-2411-13543
      what: the author list and the submission-history line naming the submitter
    - source: src-github-balrog-readme
      what: the BibTeX citation's author list
    - source: src-arxiv-2608-08466
      what: the author's name and the submission-history line

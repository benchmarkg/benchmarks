# data/benchmarks/games-planning/balrog.yaml
#
# P1-S11-T04, games-planning entry 7. Promotes the Epoch stub data/benchmarks/_stubs/balrog.yaml (Epoch's string
# "Balrog", score column "Average progress"). Filled from the BALROG paper, arXiv 2411.13543 read as its v2 PDF
# (2025-04-01, the ICLR 2025 version), and its abstract page; the project site's front page, whose LLM and VLM
# leaderboards are static HTML (scripts and styles stripped), and its submission page; the repository README and
# docs/evaluation.md at a pinned commit of balrog-ai/BALROG; the abstract page of an August 2026 paper that evaluates
# on BALROG (arXiv 2608.08466); and Epoch's benchmark export. Not read: the BALROG/experiments repository that holds
# the submissions, the site's per-row trajectory viewer, and the six environments' own papers. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# BALROG is a suite and a harness over six existing environments (BabyAI, Crafter, TextWorld, Baba Is AI, MiniHack
# and the NetHack Learning Environment), each a subset here beside the leaderboard's two tracks, LLM and VLM. NetHack
# is catalogued as `nle`; Crafter has no entry (craftax rewrites and extends it). No lineage edge links them, because
# BALROG wraps those environments rather than deriving a benchmark from one of them.

id: balrog
name: BALROG
aliases:
  - Balrog
  - 'BALROG: Benchmarking Agentic LLM and VLM Reasoning On Games'
aliases_note: The first is Epoch's benchmark string (its capitalisation only differs); the second is
  the paper's title, which the name abbreviates.
aliases_source: src-epoch-benchmark-data
aliases_quote: Balrog,True,balrog_external.csv,Average progress
tagline: LLMs and VLMs play six existing RL games through one text harness, scored by average
  progress from 0 to 100.
description: >
  A benchmark and evaluation framework for LLMs and VLMs as agents in long-horizon games, from a group
  spanning UCL's AI Centre, IDEAS NCBR, Oxford, NYU and Warsaw. It wraps six existing reinforcement-learning
  environments of rising difficulty: BabyAI (five grid-world navigation tasks set in natural language),
  Crafter (a 2D survival and crafting game), TextWorld (three text adventures), Baba Is AI (40 rule-rewriting
  puzzles after Baba Is You), MiniHack (maze, corridor, combat, Sokoban-like and quest tasks built on
  NetHack) and NetHack itself through the NetHack Learning Environment. Each step, the model receives
  the game's rules and actions, then the recent observation-action history as text (16 observations in
  the paper), plus an image of the current state in VLM mode, and must return one action in natural language;
  an invalid action is reported back and replaced by a default. Each episode scores 0 to 100: success
  or failure in BabyAI, Baba Is AI and MiniHack, the share of achievements in Crafter and TextWorld, and
  in NetHack a new progression measure built from human games (the probability of eventually winning from
  the deepest dungeon or highest experience level reached). The headline % Progress averages the environments.
  Because every environment is procedurally generated, episodes are not stored. The paper's zero-shot
  baselines run in the framework's own naive agent, led by Claude 3.5 Sonnet at 32.64% language-only;
  the leaderboard takes submissions by pull request, with optional verification, and its LLM board is
  led at 68.3% (September 2026), where NetHack progress is still at most 13.2%.
self_description:
  source: src-arxiv-2411-13543-v2
  quote: we introduce BALROG, a novel benchmark designed to assess the agentic capabilities of LLMs
    and VLMs through a diverse set of challenging games
external_ids:
  epoch: Balrog
  arxiv: '2411.13543'
paper:
  title: 'BALROG: Benchmarking Agentic LLM and VLM Reasoning On Games'
  arxiv: '2411.13543'
  doi: 10.48550/arXiv.2411.13543
  version_read: v2
  source: src-arxiv-2411-13543-v2
released: 2024-11-20
released_note: The paper's first arXiv version, as its abstract page dates it, and the date Epoch's
  export and the stub carry; the repository was created the same day (GitHub API). The v2 read here
  (2025-04-01) is the ICLR 2025 version.
released_source: src-arxiv-2411-13543
released_quote: Submitted on 20 Nov 2024 (v1), last revised 1 Apr 2025 (this version, v2)
release_venue: ICLR 2025
release_venue_source: src-arxiv-2411-13543
release_venue_quote: Published as a conference paper at ICLR 2025

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/multi-game-suites
  secondary:
    - games-planning/puzzle-games
    - games-planning/open-ended-environments
    - games-planning/video-games
domain_note: The secondaries are the subdomains the six environments fall in, as the leaf's
  inclusion test asks; BabyAI's instructed navigation and TextWorld's text adventures fit no single
  leaf. The taxonomy names BALROG as the leaf's own example.
domain_basis:
  reason: Every score comes from episodes against a responding game environment, and the suite spans
    several of the family's subdomains with none holding most of it, Baba Is AI a puzzle game,
    Crafter an open-ended achievement game and NetHack a roguelike video game, averaged into one
    progress score; the paper's claim is breadth across games.
  source: src-arxiv-2411-13543-v2
  quote: Specifically BALROG enables seamless running of LLM and VLM agents on BabyAI, Crafter,
    TextWorld, Baba Is AI, MiniHack, and NetHack
domain_considered_and_rejected:
  - term: games-planning/procedural-generalization
    reason: All six environments are procedurally generated, but the protocol is zero-shot, with no
      training levels and no held-out split; the paper presents the generation as a guard against
      memorisation and leakage, not as a measure of generalisation to unseen levels (review_checks).
    source: src-arxiv-2411-13543-v2
    quote: all of the environments used in the benchmark are procedurally generated, and
      encountering the same instance of an environment twice is unlikely
  - term: general-intelligence/agi-composite-suites
    reason: The paper hopes to spur generalist agents and averages heterogeneous tasks into one
      score, but its breadth lies inside one family, games, which general-intelligence's exclusion
      test sends to that family's suite leaf.
    source: src-arxiv-2411-13543-v2
    quote: we look to spur progress on developing truly generalist agents
  - term: agents-tooluse/agent-evaluation-suites
    reason: The models act as agents over long episodes across several environments, but every
      environment is a game, which agents-tooluse's exclusion test sends to games-planning.
capability:
  - planning
  - long-horizon-execution
  - spatial-reasoning
capability_basis:
  planning:
    reason: Each episode is played against an explicit goal (a mission, the achievements, the win
      condition or the stairs down), and the source claims long-term planning, so the executed
      action sequence is the plan and its progress scores it (the term's tie-break for interactive
      episodes).
    source: src-arxiv-2411-13543-v2
    quote: It supports model evaluation on challenging reinforcement learning environments that test
      skills such as long-term planning, spatial reasoning, and the ability to deduce the mechanics
      of the environment.
  long-horizon-execution:
    reason: Episodes run from tens of steps (BabyAI) to tens of thousands (NetHack) of dependent
      actions with environment feedback between them, and dying or an irreversible move (a boulder
      pushed into a corner) makes full success on the episode unattainable; partial credit in
      Crafter, TextWorld and NetHack does not disqualify it.
    source: src-arxiv-2411-13543-v2
    quote: while all of these games are long-horizon, they span a broad range of difficulty levels
  spatial-reasoning:
    reason: Every environment has a navigation component, and progress depends on positions and
      layouts the agent must infer from relative descriptions ("a wall 5 steps forward") or an
      image; the site repeats the claim. The taxonomy names BALROG as the term's example.
    source: src-balrogai-site
    quote: testing their ability to plan, reason spatially, and explore in dynamic environments
capability_considered_and_rejected:
  - term: search-exploration
    reason: The site and the paper claim exploration, and Crafter's milestones reward discovery, but
      the headline averages task completion and progress; nothing scores how the space was
      traversed, and Crafter is one environment of six.
    source: src-arxiv-2411-13543-v2
    quote: Agents are evaluated based on the number of achieved milestones, such as discovering new
      resources and crafting tools
  - term: causal-reasoning
    reason: Deducing environment dynamics is one of the paper's six skills (Table 1) and Baba Is AI
      turns on rewriting the rules, but no score isolates an inferred causal relation; it enters
      only through progress.
  - term: instruction-following
    reason: The paper says models must read the rules and produce valid actions, but invalid actions
      are replaced by a default rather than scored, and the source claims agentic capability, not
      instruction following.
    source: src-arxiv-2411-13543-v2
    quote: BALROG provides feedback to the agent indicating the action
  - term: perception
    reason: The VLM track adds an image of the current state, but the score is game progress, and
      the paper reports that images mostly lower it rather than measuring what was recovered from
      them.
    source: src-arxiv-2411-13543-v2
    quote: we find that multimodal LLMs perform much worse when also presented with an image of the
      environment rather than a textual-only description of the observation

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every number is the outcome of episodes run in the environments' simulators, each scored
    on a bounded 0-100 scale, success or failure in three environments and the share of achievements
    or progression in the other three, so one term carries both; the per-environment formulas are in
    task.scoring.
  source: src-arxiv-2411-13543-v2
  quote: For environments like MiniHack, BabyAI, and Baba Is AI, each episode is scored as either 0
    or 100 based on task completion.
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: NetHack's own in-game score accumulates without bound, but BALROG replaces it with a
      progression measure that runs from 0 at the start of the game to 100 at ascension, so no
      environment's score is unbounded; the term's exclusion test sends it to a bounded method.
    source: src-arxiv-2411-13543-v2
    quote: and ascension as 100% progression
designed_for_subjects:
  - model-in-benchmark-harness
  - agent-scaffold
designed_for_subjects_basis:
  reason: The leaderboard takes two kinds of entry. A new model is evaluated zero-shot inside
    BALROG's own naive agent, the same prompts and loop for every entrant, which the taxonomy names
    as model-in-benchmark-harness's example; an agentic strategy replaces that loop (agent.py) with
    the entrant's own prompting or reasoning method around an existing model.
  source: src-arxiv-2411-13543-v2
  quote: Submissions may propose novel inference-time prompting strategies for improving the
    reasoning, planning, or in-context learning capability of an existing model.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: The model is prompted at every step of a multi-turn loop with environment feedback, not
      once, which the term's exclusion test sends to model-in-benchmark-harness.
    source: src-arxiv-2411-13543-v2
    quote: By default, these models will be evaluated zero-shot.
  - term: hosted-inference-endpoint
    reason: Most rows are API-served models, but the framework runs local models through vLLM as
      well, and the endpoint is the delivery mechanism for a named model rather than the subject.
  - term: rl-policy
    reason: The environments are reinforcement-learning environments, but entrants must act in
      natural language and are not trained on them; no source read shows a trained policy entered.
observed_subjects:
  values:
    - reasoning-model
  basis: The LLM board's 39 rows, read 2026-11-09, include reasoning models and thinking variants
    (DeepSeek-R1, Claude-Opus-4.5-Thinking, Gemini-3.1-Pro-Thinking, GPT-5-minimal-think), and the
    five newest rows carry a Max suffix whose meaning the site does not state.
  source: src-balrogai-site
as_used:
  - protocol: A frozen model (DeepSeek-V4-Flash-Preview) inside a harness that the paper's own
      method rewrites from environment feedback, reported per environment as raw % Progress gains
      over the initial harness, with held-out splits of Baba Is AI levels.
    source: src-arxiv-2608-08466
    quote: On BALROG with DeepSeek-V4-Flash-Preview as the frozen backbone, HSI achieves consistent
      gains over the initial harness on moderate-difficulty tasks
    note: An August 2026 paper, read as its abstract only. It evaluates an agent-scaffold method,
      the design's second submission kind, and makes its own held-out split, which BALROG does not
      have.

lifecycle: active
lifecycle_basis:
  reason: The LLM board gained five rows in September 2026, the newest dated 2026-09-20, and outside
    papers still report on it, such as the August 2026 harness-evolution paper read here. The
    repository's last commit is 2026-04-09 (GitHub API), which is maintenance evidence, not
    lifecycle.
  source: src-balrogai-site
  quote: Claude-Opus-5-Max 63.4 ± 1.8 100.0 ± 0.0 68.2 ± 3.5 71.6 ± 6.8 95.8 ± 1.8 37.5 ± 7.7 7.3 ±
    1.6 2026-09-20
activity: accepting-submissions
activity_note: The VLM board's newest row is dated 2025-04-25, so that track has taken no entry in
  eighteen months while the LLM board has.
activity_basis:
  reason: The site invites submissions, which go by pull request to the experiments repository, and
    says the board is refreshed weekly.
  source: src-balrogai-site
  quote: If you would like to submit your model to the leaderboard, please check the submission
    page.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-6-Astra-Max (LLM track)
    source: src-balrogai-site
    observed_on: 2026-11-09
    quote: GPT-6-Astra-Max 68.3 ± 2.0 100.0 ± 0.0 76.8 ± 3.6 54.5 ± 7.9 100.0 ± 0.0 65.0 ± 7.5 13.2
      ± 2.7 2026-09-18
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each environment's own engine decides task completion and achievements;
  NetHack's progress is read off the dungeon and experience levels reached, against BALROG's table
  built from human games.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The framework and the environments install from the public repository, and any model
    behind an API or a local vLLM server can be run on freshly generated episodes.
  source: src-github-balrog-readme
  quote: pip install -e .

task:
  exists: true
  input:
    - an instruction prompt with the game's rules and the available actions, each with a short
      description, written once for all models
    - the observation-action history as a chat, in natural language (a textual description of the
      state, with an ASCII map for MiniHack and NetHack), 16 observations in the paper
    - in VLM mode, an image of the current state as well (TextWorld has none)
  output: One action per step as a natural-language string, until the episode ends; an invalid
    action is reported to the agent and replaced by a default action.
  scoring: Each episode is scored 0 to 100. BabyAI, Baba Is AI and MiniHack score 0 or 100 for
    completing the task; Crafter and TextWorld score the proportion of achievements toward the
    maximum; NetHack scores the higher of two progression values, for the dungeon level and the
    experience level reached, each the probability in a dataset of human games of winning from
    there, with the start at 0 and ascension at 100. Episodes are averaged over seeds per
    environment, and % Progress averages the environments (six in the LLM track, five in VLM).
  source: src-arxiv-2411-13543-v2
  quote: For TextWorld, Crafter, and NetHack we use as the score a real number between 0 and 100,
    representing the proportion of achievements toward the maximum score.

# --- Data ------------------------------------------------------------------------------------

data:
  access: generated-on-demand
  access_note: The code is MIT-licensed and public. No source read says whether the evaluation seeds
    are fixed, so whether two runs see the same episodes is not established (review_checks).
  access_basis:
    reason: There is no stored set of episodes; each run generates its levels from the six
      environments' procedural generators.
    source: src-arxiv-2411-13543-v2
    quote: all of the environments used in the benchmark are procedurally generated, and
      encountering the same instance of an environment twice is unlikely
  refresh: continuously-generated
  refresh_basis:
    reason: The generators produce the scored episodes at every evaluation, which the paper presents
      as preventing test-set leakage; the taxonomy names BALROG as the term's example.
    source: src-arxiv-2411-13543-v2
    quote: ensuring rigorous and fair comparisons by preventing test-set leakage
  data_provenance:
    - synthetic-procedural
  data_provenance_note: The generators are the six pre-existing environments' own (BabyAI, Crafter,
    TextWorld with generation rules from earlier work, Baba Is AI, MiniHack, NLE), with no learned
    model in the loop. BALROG's own additions are the language wrappers (its own for Baba Is AI,
    existing ones for the others) and the NetHack progression table, built from a dataset of
    human-played games.
  data_provenance_source: src-arxiv-2411-13543-v2
  data_provenance_quote: we constructed a data-centric progression system where each data point
    represents the probability of a human player winning the game after reaching a specific dungeon
    level or experience level
  contamination_risk: low
  contamination_risk_note: The scored episodes are generated at evaluation and do not exist
    beforehand. What a pretrained model may hold is knowledge of the games themselves (NetHack wikis
    and guides, Minecraft-like crafting), which the paper finds models have but fail to use; that is
    knowledge of the game, not leakage of evaluation instances.
  contamination_evidence:
    - source: src-arxiv-2411-13543-v2
      stance: against
      quote: Some of the models exhibit knowledge about the game from pre-training but fail to use
        it in practice.
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: No source reports a human or oracle score on the suite as a whole. The
    LLM board has reached 100 on BabyAI and Baba Is AI, while NetHack's best is 13.2, so the
    average's practical ceiling is set by NetHack.
  ceiling_anchor_type_basis:
    reason: Every environment's score is bounded at 100 by construction, so % Progress is too.
    source: src-arxiv-2411-13543-v2
    quote: we introduce a standardized metric, scoring performance on each task within a range of 0
      to 100
  size:
    - count: 6
      unit: environments
      source: src-arxiv-2411-13543-v2
      quote: BALROG, a suite of six reinforcement learning environments for testing the agentic
        capabilities of long-context LLMs
    - count: 5
      unit: tasks, 25 seeds each in the paper
      subset: BabyAI
      source: src-arxiv-2411-13543-v2
      quote: Errors are computed with 25 seeds for each of the 5 tasks of BabyAI.
    - count: 10
      unit: seeds (episodes) in the paper
      subset: Crafter
      source: src-arxiv-2411-13543-v2
      quote: standard errors are computed using 10 seeds
    - count: 3
      unit: games, 20 seeds each in the paper
      subset: TextWorld
      source: src-arxiv-2411-13543-v2
      quote: Standard errors are computed using 20 seeds for each of the 3 tasks.
    - count: 40
      unit: puzzles, 5 seeds each in the paper
      subset: Baba Is AI
      source: src-arxiv-2411-13543-v2
      quote: Standard errors are computed using 5 seeds for each of the 40 Baba Is AI tasks.
    - count: 5
      unit: tasks (Maze, Corridor, CorridorBattle, Boxoban, Quest)
      subset: MiniHack
      source: src-arxiv-2411-13543-v2
      quote: We select five different tasks, Maze, Corridor, CorridorBattle, Boxoban, and Quest.
    - count: 5
      unit: seeds (episodes) in the paper
      subset: NetHack
      source: src-arxiv-2411-13543-v2
      quote: We provide NetHack results for LLM and VLM mode in Tables 14 and 15. Standard errors
        are computed using 5 seeds.
  size_note: Counts are tasks and evaluation seeds, not stored items; the harness's
    eval.num_episodes sets the episodes per environment ({nle 5, minihack 5, babyai 25, ...} by
    default). MiniHack's five tasks are seven in the appendix's own list (two maze sizes, two quest
    difficulties), and whether its 5 seeds are per task is not stated.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The BALROG team (the balrog-ai GitHub organisation)
  maintainer_basis:
    reason: The code, the experiments repository and the site sit in the balrog-ai organisation
      account (an Organization, GitHub API), and the site and submission page speak as "the BALROG
      team". The paper's authors are at UCL's AI Centre, IDEAS NCBR, the University of Oxford, New
      York University and the University of Warsaw, among others; that line of the PDF sits beside
      the authors' names and the contact address and is not quoted.
    source: src-github-balrog-readme
    quote: git clone https://github.com/balrog-ai/BALROG.git
  maintainer_type: community-collective
  maintainer_type_note: academic-lab was considered. The authors come from several institutions, the
    artefacts sit in a shared organisation account, and no source states one institution as the
    holder; the site's UCL correspondence address is a contact, not a holder (the term's holder
    rule).
  submission_process:
    - self-reported
    - maintainer-verified
    - maintainer-run
  submission_process_note: Entrants open a pull request with their run logs and a metadata file that
    sets verified to false; separately, they may open an issue asking the team to run the agent on a
    random subset and check the results, which earns the check mark (34 of the 39 LLM rows carry it;
    the five September 2026 rows do not). The paper's own zero-shot baselines, run by the
    maintainers, are rows on both boards (Claude-3.5-Sonnet-2024-10-22 at 32.6, the paper's 32.64).
  submission_process_source: src-balrogai-submit
  submission_process_quote: 'verified: false (See below for results verification)'
  independence_flags: []
  independence_flags_note: Not assessed. The paper thanks the Gemini Academic Program for support of
    an unstated kind, and Gemini models are ranked on both boards; one author lists an Anthropic
    affiliation, and Claude models are ranked. No source read states who runs that programme or what
    the support was, so funded-by-evaluated-party is left for a reviewer (review_checks).
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The environments are lightweight CPU simulators. The paper's models and most
    leaderboard rows are API-served, and a local model through vLLM is the entrant's choice; one
    NetHack demonstration for few-shot prompting can need over 700,000 input tokens, which the paper
    found too expensive to run.
  compute_tier_source: src-github-balrog-readme
  compute_tier_quote: We support how of the box clients for OpenAI, Anthropic and Google Gemini
    APIs.
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: Runs are automatic end to end, but only inside the six environments' simulators at the
      versions the framework installs, run in parallel.
    source: src-arxiv-2411-13543-v2
    quote: BALROG supports highly parallelized evaluations, leveraging the lightweight simulators of
      each of the environments in the suite
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: balrog (eval.py, configured with Hydra; the naive agent, agent.type=naive, for zero-shot
    model entries), at commit b7afe79e of balrog-ai/BALROG
  harness_source: src-github-balrog-evaluation-doc
  harness_quote: The following are various options you can use to evaluate your agents on BALROG.
  harness_gotcha:
    source: src-github-balrog-evaluation-doc
    quote: Too low temperatures can cause some of the more brittle models to endlessly repeat
      actions or create incoherent outputs.
  harness_gotcha_note: The guide recommends a temperature around 0.7-1.0 or the API's default, while
    its option table lists client.generate_kwargs.temperature at 0.0 and client.temperature at 1.0;
    a reproduction should state the temperature it used. The paper's runs fix a history of 16
    observations, which entrants may change.
  code_licence: MIT
  code_licence_source: src-github-balrog-readme
  code_licence_quote: This project is licensed under the MIT License
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated
  maintainer_rerun_policy_note: The team re-runs an agent on a random subset of BALROG only when an
    entrant asks for verification; no policy for re-running existing rows was found.

comparability:
  # (simulation-rollout, agent-scaffold) resolves to the simulation profile: simulator, simulator_version,
  # hardware_platform, subset_used, selection_strategy, n_samples. subset_used carries the track (LLM or VLM, which
  # also changes the average from six environments to five) and the environment. What BALROG adds: the agent
  # (the naive agent or an entrant's strategy) and the harness commit; the model snapshot and its reasoning effort
  # (rows such as Claude-Opus-4.5 and Claude-Opus-4.5-Thinking differ only there); the sampling temperature
  # (conditions.sampling), which the guide says changes behaviour; and few-shot demonstrations, which the codebase
  # supports. The observation history length
  # (16 in the paper, open to entrants) has no conditions field of its own and is carried by harness.
  material_extra:
    - scaffold
    - harness
    - provider_snapshot
    - reasoning_effort
    - sampling
    - shots
aggregation_policy: official-aggregate
aggregation_policy_note: Each environment is a column with its own standard error, and % Progress is
  their plain mean; the VLM board's average is over its five columns (Claude-3.5-Sonnet's 35.5 is
  the mean of 82.0, 37.3, 34.5, 22.5 and 1.2). The two tracks are ranked separately.
aggregation_policy_basis:
  reason: The leaderboard's headline is the average across the environments.
  source: src-balrogai-site
  quote: The % Progress metric refers to the average completion percentage of BALROG environments of
    the model.

homepage: https://balrogai.com/
repository: https://github.com/balrog-ai/BALROG
leaderboard_url: https://balrogai.com/

subsets:
  - id: balrog#llm
    label: LLM (language only)
    scored_separately: true
    evidence:
      - source: src-balrogai-site
        quote: Agent % Progress BabyAI Crafter TextWorld BabaIsAI MiniHack NetHack Date
      - source: src-balrogai-submit
        quote: Create a new folder with the submission date and the agent name in the LLM or VLM
          directory
    notes: The language-only track, all six environments, with a textual description of each
      observation. 39 rows on 2026-11-09, led by GPT-6-Astra-Max at 68.3.
  - id: balrog#vlm
    label: VLM (vision-language)
    scored_separately: true
    evidence:
      - source: src-arxiv-2411-13543-v2
        quote: Except for TextWorld, which lacks a visual component, we evaluate all environments
          using two observation modalities
      - source: src-balrogai-site
        quote: Agent % Progress BabyAI Crafter BabaIsAI MiniHack NetHack Date
    notes: The same environments with an image of the current state added to the text, TextWorld
      excluded, so five columns. 10 rows, the newest dated 2025-04-25, led by
      Gemini-2.5-Pro-Exp-03-25 at 35.7.
  - id: balrog#babyai
    label: BabyAI
    scored_separately: true
    evidence:
      - source: src-arxiv-2411-13543-v2
        quote: Agents are tested across five different types of navigation tasks
    notes: Five grid-world navigation tasks given as natural-language missions, through the
      BabyAI-Text wrapper; 0 or 100 per episode. The easiest environment; the LLM board's newest
      rows reach 100.
  - id: balrog#crafter
    label: Crafter
    scored_separately: true
    domain_override:
      primary: games-planning/open-ended-environments
    evidence:
      - source: src-arxiv-2411-13543-v2
        quote: Agents are evaluated based on the number of achieved milestones, such as discovering
          new resources and crafting tools
    notes: The original Crafter with an existing language wrapper from earlier work, scored by the
      share of its 22 achievements unlocked. Crafter has no entry here; craftax is a separately
      maintained JAX rewrite and extension of it, not what BALROG runs.
  - id: balrog#textworld
    label: TextWorld
    scored_separately: true
    evidence:
      - source: src-arxiv-2411-13543-v2
        quote: Standard errors are computed using 20 seeds for each of the 3 tasks.
    notes: Three generated text adventures (Treasure Hunter, The Cooking Game, Coin Collector),
      scored by the proportion of achievements toward the maximum; language-only, so absent from the
      VLM track. The paper scores Gemini models 0 here because their API refused the prompts.
  - id: balrog#babaisai
    label: Baba Is AI
    items: 40
    scored_separately: true
    domain_override:
      primary: games-planning/puzzle-games
    evidence:
      - source: src-arxiv-2411-13543-v2
        quote: An environment based on the popular puzzle video game Baba Is You.
      - source: src-arxiv-2411-13543-v2
        quote: Agents are tested on 40 puzzles
    notes: Forty rule-rewriting puzzle levels with BALROG's own language wrapper; 0 or 100 per
      episode.
  - id: balrog#minihack
    label: MiniHack
    scored_separately: true
    evidence:
      - source: src-arxiv-2411-13543-v2
        quote: MiniHack is a multi-task framework built on top of the NetHack Learning Environment
      - source: src-arxiv-2411-13543-v2
        quote: We select five different tasks, Maze, Corridor, CorridorBattle, Boxoban, and Quest.
    notes: Navigation (mazes, corridors, corridor combat), a Sokoban-like boulder puzzle and quests
      needing items, through the NetHack language wrapper; 0 or 100 per episode. No model solved
      Boxoban or Quest in the paper.
  - id: balrog#nle
    label: NetHack (NLE)
    scored_separately: true
    domain_override:
      primary: games-planning/video-games
    evidence:
      - source: src-arxiv-2411-13543-v2
        quote: we develop a novel data-informed progression system for NetHack
    notes: The full game through the NetHack Learning Environment (catalogued as nle) and the
      NetHack language wrapper, with an ASCII map in language mode. Scored by BALROG's own
      progression measure, not NLE's in-game score or tasks, so results here are not comparable with
      nle's. The hardest environment; the best LLM row reaches 13.2.

lineage:
  role: root
  role_note: No released variant, verified set or fork of BALROG was found. The six environments are
    other maintainers' benchmarks that BALROG wraps with language interfaces and its own scoring;
    the schema has no edge for a suite's components, so the relation to nle (and to Crafter, which
    craftax rewrites) is recorded in the subsets' notes.
lineage_source: src-arxiv-2411-13543
lineage_quote: Our benchmark incorporates a range of existing reinforcement learning environments
  with varying levels of difficulty


# data/benchmarks/games-planning/atari-100k.yaml
#
# P1-S11-T03, games-planning entry 4 of 6. Filled from the SimPLe paper that introduced the protocol, arXiv
# 1903.00374 read as its v5 PDF (ICLR 2020), and its abstract page; the rliable paper, arXiv 2108.13264 read as its
# v4 PDF (NeurIPS 2021), and its abstract page; the rliable README at master; two pages of the Arcade Learning
# Environment's documentation (Environments and Installation, scripts and styles stripped); and the v1 PDF of EAWM
# (arXiv 2601.19336, January 2026, ICLR 2026), a paper that reports on all 26 games. Every quote below is checked by
# the quote-substring validator against those Sources' committed extracts.
#
# The entry is the 100k-step protocol on 26 ALE games. The Arcade Learning Environment itself (Bellemare et al.
# 2013) is its ancestor and is named only as the sources name it. The protocol has no site, maintainer or
# leaderboard; the stress corpus's url is the originating paper's abstract page, and so is homepage here.

id: atari-100k
name: Atari 100k
aliases:
  - Atari 100K
  - Atari-100k
tagline: 26 Atari 2600 games, each learned from scratch in 100k agent steps (400k frames), scored by
  human-normalised score.
description: >
  A sample-efficiency protocol for reinforcement learning on the Arcade Learning Environment (ALE),
  introduced with SimPLe (Kaiser et al., ICLR 2020). An agent learns each of 26 Atari 2600 games from
  scratch within 100k agent steps; every action is repeated for 4 frames, so the budget is 400k
  frames, about two hours of play. The 26 games are those on which SimPLe or a tuned Rainbow reached
  non-random scores at that budget. A run's score on a game is its return averaged over evaluation
  episodes after training, normalised so that a random agent scores 0 and an average human 1, and
  most papers report 3 or 5 runs per game, aggregated across games as the mean and the median. The
  rliable paper (Agarwal et al., NeurIPS 2021) showed that such point estimates mislead at these run
  counts and recommended the interquartile mean (IQM) over all runs with stratified bootstrap
  confidence intervals, which later papers report beside the mean and median. SimPLe's main results
  ran without sticky actions; the ALE's v5 environments repeat the previous action with probability
  0.25 by default and its v4 environments never do, so the environment settings are part of a
  result. There is no maintainer, site or leaderboard: papers run the protocol and publish their own
  numbers.
self_description:
  source: src-arxiv-1903-00374-v5
  quote: In this work, we aim to learn Atari games with a budget of just 100K agent steps (400K
    frames)
external_ids:
  arxiv: '1903.00374'
paper:
  title: Model-Based Reinforcement Learning for Atari
  arxiv: '1903.00374'
  version_read: v5
  source: src-arxiv-1903-00374-v5
released: 2019-03-01
released_note: The SimPLe paper's first arXiv version, as its abstract page dates it. The version
  read is v5 (2024-04-03); the paper appeared at ICLR 2020.
released_source: src-arxiv-1903-00374
released_quote: Submitted on 1 Mar 2019
release_venue: ICLR 2020
release_venue_source: src-arxiv-1903-00374-v5
release_venue_quote: Published as a conference paper at ICLR 2020

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/video-games
domain_basis:
  reason: Agents learn Atari 2600 games through the ALE's ordinary interfaces, the screen as
    observation and the joystick as action, and every one of the 26 is a video game.
  source: src-arxiv-2601-19336-v1
  quote: Atari 100K Benchmark is comprised of 26 different Atari video games
domain_considered_and_rejected:
  - term: games-planning/multi-game-suites
    reason: Many games in one suite, but all of them are Atari video games, so video-games holds the
      whole benchmark; the taxonomy names atari-100k as this term's near miss.
capability:
  - sample-efficiency
capability_basis:
  sample-efficiency:
    reason: The benchmark fixes a budget of 100k agent steps per game and scores the policy reached
      at that budget; the budget is the benchmark's whole claim, and the taxonomy names atari-100k
      as the term's example.
    source: src-arxiv-1903-00374-v5
    quote: In this work, we aim to learn Atari games with a budget of just 100K agent steps (400K
      frames)
capability_considered_and_rejected:
  - term: perception
    reason: The input is the game screen, but the score is the game's return, not what was recovered
      from the images.
  - term: sensorimotor-control
    reason: Actions go to a video game, not to a physical or simulated body whose physical behaviour
      is scored.
  - term: planning
    reason: SimPLe and later world-model entrants plan inside learned models, but that is a method.
      The benchmark scores the return a policy reaches under the interaction budget, and no source
      read claims planning for the benchmark.

evaluation_method:
  - episodic-return
evaluation_method_basis:
  reason: A run's score on a game is in-game return, which has no defined maximum. It is normalised
    against a random agent (0) and an average human (1), constants that agents exceed (EASimulus's
    mean is 1.818), which the term's exclusion test keeps as episodic-return.
  source: src-arxiv-2108-13264-v4
  quote: typically normalized with respect to a random agent and an average human, who are assigned
    a normalized score of 0 and 1 respectively
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: Episodes run in an emulator, but the reported quantity is unbounded return, not a
      bounded per-episode outcome.
  - term: human-distribution-percentile
    reason: The human reference is a published average used as a normalisation constant, not a
      measured human distribution that a score is placed in; the taxonomy names atari-100k as the
      term's near miss.
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: Entrants are reinforcement-learning agents trained from scratch on each game within the
    budget, model-free (Rainbow, PPO, DER, SPR) or model-based (SimPLe, DreamerV3, Simulus); the
    taxonomy names atari-100k as the term's example.
  source: src-arxiv-1903-00374-v5
  quote: Prior methods are generally not evaluated in this regime, and we therefore optimized
    Rainbow
as_used:
  - protocol: 100 independent runs per algorithm on each of the 26 games, each run's score the
      average return over 100 evaluation episodes after training; median and IQM human-normalised
      scores reported as interval estimates (stratified bootstrap confidence intervals), with
      performance profiles. The paper recommends the IQM, which ignores the best and worst quarter
      of runs, over the median.
    source: src-arxiv-2108-13264-v4
    quote: where the score for a run is the average returns obtained in 100 evaluation episodes
      taking place after training
    note: The rliable case study (Agarwal et al., 2021). It also shows that reporting the maximum
      evaluation score reached during training, as CURL and SUNRISE did, is not comparable with
      end-of-training scores.
  - protocol: Five seeds per game and 100 evaluation episodes at the end of training; the mean,
      median and IQM human-normalised scores and the optimality gap with 95% stratified bootstrap
      confidence intervals, and the count of games above human level.
    source: src-arxiv-2601-19336-v1
    quote: The scores for each task are computed by conducting 100 evaluation episodes at the end of
      training
    note: EAWM (January 2026, ICLR 2026), a world-model method. It reruns its DreamerV3 and Simulus
      baselines itself and leaves lookahead-search methods out of the comparison.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it; a January 2026 paper accepted at ICLR 2026 reports
    scores and aggregates on all 26 games against world-model baselines it reran. The originators'
    Tensor2Tensor repository is archived, last pushed on 2023-06-02, and so is rliable's, last
    pushed on 2024-08-12 (GitHub API); that is maintenance evidence, not lifecycle.
  source: src-arxiv-2601-19336-v1
  quote: Game scores and human normalized aggregate metrics on the 26 games of the Atari 100K
    benchmark
activity: no-submission-channel
activity_basis:
  reason: The protocol has no leaderboard, server or submission route of its own and never had one;
    the originators released code with instructions, and papers run the protocol and report their
    own numbers, as SimPLe, rliable and EAWM do.
  source: src-arxiv-1903-00374-v5
  quote: The source code is available as part of the Tensor2Tensor library and it includes
    instructions on how to run the experiments

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SimPLe
    source: src-arxiv-1903-00374-v5
    observed_on: 2026-10-14
    quote: In most games SimPLe outperforms state-of-the-art model-free algorithms
  - system: EASimulus (EAWM applied to Simulus)
    source: src-arxiv-2601-19336-v1
    observed_on: 2026-10-14
    quote: EASimulus obtains a mean human-normalized score of 1.818
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The game's own score, read from the emulated Atari 2600 by the ALE; the
  random and human reference scores are published constants.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The ALE installs from PyPI, and the rliable authors released their Atari 100k
    re-implementations in Dopamine and the per-run scores of the algorithms they studied.
  source: src-arxiv-2108-13264-v4
  quote: Our code for Atari 100k experiments is open-sourced as part of the Dopamine library under
    the labs/atari_100k folder

task:
  exists: true
  input:
    - the game screen and the reward at every agent step, each action repeated for 4 frames
  output: One of the game's joystick actions per agent step, for at most 100k agent steps of
    interaction while learning; the policy reached is then run for evaluation episodes.
  scoring: Per game, the return averaged over evaluation episodes after training (100 in rliable and
    EAWM), human-normalised as (agent - random) / (human - random); across the 26 games, the mean
    and the median, and since rliable the IQM over all runs with stratified bootstrap confidence
    intervals.
  source: src-arxiv-2601-19336-v1
  quote: Standard measurement for a game is human-normalized score (HNS) (Mnih et al., 2015)

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: There is no held-out data. The games run in the ALE, which anyone can install from PyPI,
      and the random and human reference scores are printed in the papers.
    source: src-ale-docs-installation
    quote: 'To install the Python interface from PyPi simply run: pip install ale-py'
  refresh: static
  refresh_basis:
    reason: The 26 games, the 100k-step budget and the per-game human-normalised score have not
      changed since SimPLe. What changed is how papers aggregate (the IQM beside mean and median,
      after rliable) and which ALE environment version they run; both are conditions of a result,
      not changes to the benchmark (see review_checks).
    source: src-arxiv-2108-13264-v4
    quote: In this benchmark, algorithms are evaluated on only 100k steps (2-3 hours of game-play)
      for each of its 26 games
  data_provenance:
    - synthetic-procedural
  data_provenance_note: The states an agent plays through are produced by the Atari game programs
    running in the ALE's emulator, a game engine with no learned model in the loop.
  data_provenance_source: src-ale-docs-installation
  data_provenance_quote: ALE supports the Gymnasium API such that all the setup required for
    interacting with the emulator is complete
  contamination_risk: unknown
  contamination_risk_note: Training on the 26 scored games is the protocol, so contamination reduces
    to tuning on the test games and to what pretrained components bring with them; no source read
    assesses either.
  contamination_evidence: []
  ceiling_anchor_type: null
  ceiling_anchor_type_note: Scores are read against an average human (normalised score 1), which
    rules out none-known, but no source read says who the humans were (SimPLe takes its "Avg. Human"
    scores from Pohlen et al. 2018), so crowd-average and expert-average cannot be told apart; the
    corpus classification abstained for the same reason (failure 2026-09-28-atari-100k-007).
  dataset_licence: null
  dataset_licence_note: The benchmark has no dataset; no source read states terms for the game ROMs
    the ALE runs.
  size:
    - count: 26
      unit: Atari 2600 games
      source: src-arxiv-1903-00374-v5
      quote: We evaluate our method on 26 games selected on the basis of being solvable

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: None; defined by the SimPLe authors (Google Brain, with deepsense.ai, the University
    of Warsaw and others)
  maintainer_basis:
    reason: No party holds or publishes the protocol. The originators' code sits in Google's
      Tensor2Tensor library, and most of SimPLe's authors were at Google Brain.
    source: src-arxiv-1903-00374-v5
    quote: Google Brain, 2deepsense.ai
  maintainer_type: industry-lab
  maintainer_type_note: The originator rule. Nobody holds the benchmark, so the type is its
    originators', Google Brain, whose Tensor2Tensor library holds SimPLe's code; the decay belongs
    to maintenance_status (the Tensor2Tensor repository is archived, GitHub API, 2026-10-14). The
    rliable re-implementations sit in Dopamine, also a Google library.
  submission_process:
    - literature-only
  submission_process_note: No process collects or ranks results; each paper runs the protocol and
    reports its own numbers, often rerunning its baselines (EAWM reran DreamerV3 and Simulus).
  submission_process_source: src-arxiv-2601-19336-v1
  submission_process_quote: We follow the official implementation of Simulus (Cohen et al., 2025)
    and reproduce the results based on the suggested hyperparameters
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-1903-00374
      quote: In most games SimPLe outperforms state-of-the-art model-free algorithms
  independence_flags_note: The paper that defines the 100k regime introduces its own method and
    ranks it against baselines it tuned for the comparison, and the 26 games are those on which
    SimPLe or Rainbow reached non-random scores. Nobody maintains the protocol now, so no later
    party competes as its maintainer.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: Every run needs the ALE's emulation of the Atari 2600; the GPU time for
    training depends on the method.
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is fully automatic, but only inside the ALE's emulator, with the environment
      version and its sticky-action and frame-skip settings fixed.
    source: src-ale-docs-installation
    quote: ALE supports the Gymnasium API such that all the setup required for interacting with the
      emulator is complete
  harness_availability: reference-implementation-only
  harness: SimPLe's code in Tensor2Tensor (tensor2tensor/rl); rliable's re-implementations in
    Dopamine (labs/atari_100k); the rliable library for the aggregate metrics
  harness_note: No code is designated as producing the official score. Each paper runs its own agent
    in the ALE and computes the normalised aggregates itself, increasingly with rliable.
  harness_source: src-arxiv-1903-00374-v5
  harness_quote: The source code is available as part of the Tensor2Tensor library and it includes
    instructions on how to run the experiments
  code_licence: null
  code_licence_note: The protocol has no code of its own. Tensor2Tensor (SimPLe's code) and rliable
    are both Apache-2.0 by GitHub's licence metadata, read 2026-10-14; not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The simulation profile already makes material the simulator and its version (the ALE version, with its
  # sticky-action and frame-skip settings), hardware_platform, subset_used (the 26 games), selection_strategy
  # (end-of-training scores, not the best evaluation during training) and n_samples (runs per game and
  # evaluation episodes per run). Beyond it: what the agent may use besides its 100k steps, such as pretrained
  # components or data from other games.
  material_extra:
    - training_data_policy

homepage: https://arxiv.org/abs/1903.00374
homepage_note: No site exists; this is the originating paper's abstract page, as the stress corpus
  records it.
repository: https://github.com/tensorflow/tensor2tensor
repository_note: SimPLe's code, in Tensor2Tensor's rl directory, as the paper gives it; it is a
  reference implementation of the method, not a harness for the benchmark.

tags:
  - reinforcement-learning
  - atari
  - arcade-learning-environment
  - sample-efficiency
  - low-data-regime

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1903-00374-v5
    - src-arxiv-1903-00374
    - src-arxiv-2108-13264-v4
    - src-arxiv-2108-13264
    - src-github-rliable-readme
    - src-ale-docs-environments
    - src-ale-docs-installation
    - src-arxiv-2601-19336-v1
  sources_note: >
    SimPLe's v5 PDF and rliable's v4 PDF (DOIs, not archived) read as text, with their abstract pages
    for the dates and venues; the rliable README at master; the ALE documentation's Environments and
    Installation pages with scripts and styles stripped; and EAWM's v1 PDF (a DOI, not archived) as
    evidence of current use.
  confidence: medium
  review_checks:
    - check: The entry is the 100k protocol on 26 games. The ALE (Bellemare et al. 2013), its
        200M-frame protocol and the sticky-action protocol of Machado et al. (2018) are ancestors or
        siblings and have no entry; rliable calls the benchmark an offshoot of the ALE and cites
        SimPLe as its origin. lineage is left empty until an ALE entry exists.
      field: lineage
      source: src-arxiv-2108-13264-v4
      quote: Our case study concerns the Atari 100k benchmark [50], an offshoot of the ALE
    - check: rliable's IQM recommendation is recorded here, not as a version. It is a third party's
        reporting recommendation (no maintainer exists to issue a version), and the per-run,
        per-game scores it aggregates are unchanged. If the catalogue treats it as a scoring
        revision, versions would gain a 2019 SimPLe protocol and a 2021 rliable protocol, and
        refresh would become versioned-releases. The rliable library computes the IQM that papers
        now report.
      field: data.refresh
      source: src-github-rliable-readme
      quote: Interquartile Mean (IQM) across all runs
    - check: Sticky actions are not fixed by the protocol. SimPLe's main results are deterministic
        (sticky actions were a separate experiment), the ALE's v5 environments default to a 0.25
        repeat probability and v4 to none, and the EAWM text read does not state its setting.
        Results on different settings are not comparable; the simulator_version condition has to
        carry it.
      field: comparability
      source: src-ale-docs-environments
      quote: In the v0 and v5 environments, the probability of repeating an action is 25% while in
        v4 environments, the probability is 0%
    - check: The 26 games were chosen by the originators' own results (SimPLe or Rainbow non-random
        at 100k), which the independence flag rests on together with SimPLe ranking itself in the
        defining paper. Whether a benchmark introduced beside its authors' method carries
        maintainer-competes-on-own-benchmark is a reviewer call.
      field: governance.independence_flags
      source: src-arxiv-1903-00374-v5
      quote: Specifically, for the final evaluation we selected games which achieved non-random
        results using our method or the Rainbow algorithm using 100K interactions
    - check: maintainer_type is industry-lab by the originator rule (Google Brain, whose
        Tensor2Tensor holds SimPLe's code). Nobody ever held the protocol as a benchmark, so null
        with a note is the alternative.
      field: governance.maintainer_type
    - check: ceiling_anchor_type is left null. The average-human normaliser is an anchor agents
        exceed, but no source read says whether the humans were non-specialists or expert players;
        Pohlen et al. (2018), where SimPLe takes them from, was not read.
      field: data.ceiling_anchor_type
    - check: activity no-submission-channel rests on there being no route of the benchmark's own.
        The stress corpus records a Papers with Code leaderboard for Atari-100k that now redirects;
        it was a third-party aggregator and was not read. If it counts as a channel that existed,
        activity is closed.
      field: activity
    - check: released is SimPLe v1's date (2019-03-01). v1's abstract page (read, not cited) already
        states the 100K-interaction, 400K-frame budget, but whether v1 evaluated the same 26 games
        was not checked; v3 (June 2019) and v4 (February 2020) revised the paper.
      field: released

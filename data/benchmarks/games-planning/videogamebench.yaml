# data/benchmarks/games-planning/videogamebench.yaml
#
# P1-S11-T04, games-planning entry 12. Filled from the VideoGameBench paper, arXiv 2505.18134 read as its v3 PDF
# (2026-05-14), its abstract page (current version v3) and its abstract page as of v1 (2025-05-23); the project site
# vgbench.com with its leaderboard, and its research-preview post (blog.html, April 2025), both read with scripts
# and styles stripped; the repository README at commit faab5317 (2025-05-30, the last push); and the v1 PDF of
# Rank-Then-Act (arXiv 2607.01897, July 2026), a paper that uses one of the benchmark's games up to its first
# checkpoint. Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.
#
# The entry is the family: 23 Game Boy and MS-DOS games in a 13-game dev split and a 10-game test split (7 public, 3
# secret games run only by the maintainers), the real-time setting, and VideoGameBench Lite, the same games with the
# emulator paused while the agent thinks, recorded as a subset (same release, same maintainer, scored separately).
# The three practice games are a subset too. The site, the research-preview post and the repository name the
# authors or sit in one author's personal account; their Sources are withheld from archiving.

id: videogamebench
name: VideoGameBench
tagline: VLM agents play 1990s Game Boy and MS-DOS games in real time from raw frames, scored by
  share of each game completed.
description: >
  A benchmark of 23 video games from the 1990s, Game Boy, Game Boy Color and MS-DOS titles run in
  emulators (PyBoy for Game Boy, JS-DOS in a browser driven by Playwright for MS-DOS), split into a
  13-game dev set and a 10-game test set. Seven test games are public (Doom II, Pokemon Crystal, Zelda:
  Link's Awakening DX, Civilization, The Need for Speed, Kirby's Dream Land DX and The Incredible
  Machine) and three are secret, held on the maintainers' private evaluation server. A vision-language
  agent sees only the raw game screen and a short description of the game's objectives and controls; no
  overlays, game-state access, hints or intermediate rewards are allowed, and actions are key presses,
  button presses and mouse moves written in language. The task is to complete each game. Progress is
  tracked automatically: checkpoint frames scraped from YouTube longplay walkthroughs are matched to the
  emulator's frames by perceptual image hashing, and a game's score is the share of the walkthrough's
  running time at which the furthest checkpoint reached appears; the overall score averages the games.
  The game runs in real time, so a model's inference latency costs it; VideoGameBench Lite pauses the
  emulator while the agent thinks, turning play into turns. In the paper, run with the maintainers'
  ReAct-style VG-Agent once per game, the best models complete 0.48% of the test set and 1.6% of the Lite
  test games. Three practice games (clicking, dragging, 2D navigation) probe the interface skills.
self_description:
  source: src-arxiv-2505-18134-v3
  quote: we introduce VideoGameBench, a benchmark consisting of 10 popular video games from the
    1990s that VLMs directly interact with in real-time
external_ids:
  arxiv: '2505.18134'
paper:
  title: 'VideoGameBench: Can Vision-Language Models complete popular video games?'
  arxiv: '2505.18134'
  version_read: v3
  source: src-arxiv-2505-18134-v3
released: 2025-05-23
released_note: The paper's first arXiv version, as the abstract page dates it, which is the release
  that set the dev and test splits, the secret games and the checkpoint score. The research preview
  on the project site (April 2025, by its title) came first, with 20 games and no split. The version
  read is v3 (2026-05-14); no venue is named in it.
released_source: src-arxiv-2505-18134
released_quote: Submitted on 23 May 2025 (v1), last revised 14 May 2026 (this version, v3)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/video-games
domain_basis:
  reason: Agents play commercial video games through their ordinary interfaces, the emulator's
    screen as observation and the controller, keyboard or mouse as action, and the score comes from
    episodes played against the responding game, which is the family's inclusion test and the leaf's
    definition. Every one of the 23 games is a video game.
  source: src-arxiv-2505-18134-v3
  quote: Therefore, we do not permit any visual overlays, and also do not permit providing any extra
    information to the agent sourced either from the internal game-state or from the viewable
    screen.
domain_considered_and_rejected:
  - term: general-intelligence/novel-task-acquisition
    reason: The family's exclusion test sends a benchmark whose own claim is acquiring tasks it was
      not built for, with games as the vehicle, to general-intelligence, and the secret games are
      framed that way. But the headline claim is completing well-known games, the agent is told each
      game's objectives and controls, seven of the ten test games are public with their prompts, and
      the secret games are three columns of one average, so the claim is competence at video games
      and the game family stays primary (see review_checks).
    source: src-arxiv-2505-18134-v3
    quote: Our objective is not to measure whether agents can play specific games, but whether they
      can adapt to, learn from, and progress in new environments.
  - term: games-planning/multi-game-suites
    reason: Many games across genres (shooters, platformers, RPGs, strategy, racing, puzzle), but
      every one is a video game played through its own interface, so video-games holds the whole
      benchmark; the taxonomy's atari-100k near miss.
  - term: games-planning/real-time-strategy
    reason: Warcraft II and Age of Empires are real-time strategy games, but both are in the dev
      set; the only strategy game in the test set, Civilization, is turn-based. Real time here is
      the emulator's clock for every game, not the genre.
  - term: games-planning/puzzle-games
    reason: The Incredible Machine is a puzzle game played interactively, but it is one of seven
      public test games; recorded neither as primary nor secondary.
  - term: agents-tooluse/computer-use-gui
    reason: The MS-DOS games are driven by mouse and keyboard in a browser, as a computer-use agent
      would act, but the environment is a game and agents-tooluse's exclusion test sends games to
      games-planning; the benchmark forbids tools.
  - term: multimodal/video-language
    reason: Success needs reading game frames and answering in language actions, but the score is
      game progress, not the correspondence between the frames and any language, which multimodal's
      inclusion test asks.
capability:
  - planning
  - spatial-reasoning
  - memory-retention
  - long-horizon-execution
capability_basis:
  planning:
    reason: Each run is played against an explicit objective, completing the game, and the score is
      how far the executed action sequence got; the source claims planning for the games, which the
      term's tie-break for interactive episodes needs.
    source: src-arxiv-2505-18134-v3
    quote: also require significant planning (e.g. navigating the world in The Legend of Zelda
  spatial-reasoning:
    reason: Movement and aiming depend on where things are relative to the controlled character or
      the cursor, inferred from the frame rather than read off, with mouse coordinates on a 640 by
      400 screen in the MS-DOS games.
    source: src-arxiv-2505-18134-v3
    quote: controller D-Pad (the flat, four-way directional button on a controller) movement
      requires understanding positions relative to the game character
  memory-retention:
    reason: What the agent needs (objectives, places visited, items held) is often off-screen by the
      time it matters, so it must be carried across steps; the paper's failures include agents
      overwriting their scratchpad and forgetting the objective.
    source: src-arxiv-2505-18134-v3
    quote: Because the games in VideoGameBench require context that is often not visible on-screen
  long-horizon-execution:
    reason: A game runs to thousands of dependent actions, and the paper reports errors that end a
      run's progress (wasting all ammunition, locking or quitting the emulator); partial credit by
      checkpoint does not remove the term, whose test is whether full success stays reachable.
    source: src-arxiv-2505-18134-v3
    quote: incorrectly processing the given input frames frequently leads to illogical behavior that
      can fatally compromise the run
capability_considered_and_rejected:
  - term: perception
    reason: The input is raw frames and the paper's failure analysis is largely misperception, but
      the score is game progress, not what was recovered from the frames, which the term's inclusion
      test asks; as atari-100k decides.
  - term: sensorimotor-control
    reason: Actions go to a video game, not to a physical or simulated body whose physical behaviour
      is scored.
  - term: distribution-shift-generalization
    reason: The secret games are unseen, but they are different games with different objectives, not
      the same task on shifted inputs, which the term's exclusion test sends to transfer-learning;
      and their scores are folded into the overall average, not reported as a condition of their
      own.
    source: src-arxiv-2505-18134-v3
    quote: We keep three of the games secret to encourage solutions that generalize to unseen
      environments.
  - term: transfer-learning
    reason: A dev set is provided for tuning agents without the test games, which is a move to new
      environments, but no score of the transfer is reported (the paper reports no dev-set scores
      and tunes no agent on the dev set).
    source: src-arxiv-2505-18134-v3
    quote: We explicitly provide a dev set to encourage improving the performance of models or
      minimal scaffolds on interactive environments without using the test set games.
  - term: search-exploration
    reason: Exploration helps in many of the games, but nothing in the score rewards how the space
      was covered; the score is the furthest checkpoint.
  - term: tool-use
    reason: Tools are forbidden; the agent acts only through the game's controls.

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every number is the outcome of runs in a game emulator, scored per game as the percentage
    of the game completed by the furthest checkpoint, bounded at 100% (a finished game), and
    averaged over the games. The scale is bounded, so headroom is defined, and the leading score of
    0.48% leaves almost all of it.
  source: src-arxiv-2505-18134-v3
  quote: we track the furthest checkpoint reached by the agent, lookup the timestamp in the
    associated walkthrough video, and compute the percentage of the game completed
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: The games give no reward signal and the score is not cumulative reward; it is a
      completion percentage with 100% as its maximum, which the term's exclusion test removes.
    source: src-arxiv-2505-18134-v3
    quote: we do not provide the agent with any intermediate rewards or signals throughout gameplay
  - term: environment-state-check
    reason: A program inspects the emulator's frames, but the environment is a game driven by a
      policy, which the taxonomy separates as simulation-rollout; no software end state is checked.
  - term: composite
    reason: The overall score is an average of per-game scores that all come from the same method,
      not a combination of methods.
designed_for_subjects:
  - agent-scaffold
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Two views, as the taxonomy's model-in-benchmark-harness test allows. The rules constrain
    inputs and forbid overlays and tools but leave the agent loop to the entrant, the dev set exists
    to improve models or scaffolds, and the paper's prompts are a starting point entrants may change
    (agent-scaffold). Every result read runs the maintainers' own VG-Agent with the same prompts,
    frames and settings, so only the model varies and the leaderboard rows name VG-Agent with the
    model (model-in-benchmark-harness).
  source: src-arxiv-2505-18134-v3
  quote: These prompts also serve as a starting point for future agents on VideoGameBench, and can
    be modified if they fall within the rules.
designed_for_subjects_considered_and_rejected:
  - term: rl-policy
    reason: Policies trained on the games are not what the benchmark is built for; it gives no
      reward and keeps the test games for evaluation. Rank-Then-Act trains an RL policy on one
      game's first checkpoint, but outside the benchmark's protocol.
  - term: hosted-inference-endpoint
    reason: The models are called through LiteLLM and real-time results depend on their serving
      latency, but the paper evaluates models inside its loop rather than endpoints as such; the
      latency dependence is recorded in comparability.

as_used:
  - protocol: Kirby's Dream Land up to the first boss, which is VideoGameBench's first checkpoint,
      in the PyBoy emulator at 160 by 144 pixels, as an RL control task; the policy (VL-DAC with
      LoRA adapters) learns from a learned progress-ranking reward rather than the game, with
      simultaneous button presses allowed as in VideoGameBench Lite.
    source: src-arxiv-2607-01897-v1
    quote: corresponding to the first checkpoint in VideoGameBench [31]
    note: Rank-Then-Act (July 2026). It uses one game and its first checkpoint as a task, not the
      benchmark's test protocol, and reports no VideoGameBench score.

lifecycle: active
lifecycle_basis:
  reason: The maintainers revised the paper in May 2026 (v3), and a July 2026 paper builds a control
    task on one of its games and its first checkpoint, calling it a standard benchmark. No later
    system has been scored on the test split in the sources read, and the repository was last pushed
    on 2025-05-30 (GitHub API); that is maintenance evidence, not lifecycle, and the thin use is a
    review check.
  source: src-arxiv-2607-01897-v1
  quote: Kirby is a standard VLM benchmark from VideoGameBench.
activity: accepting-submissions
activity_basis:
  reason: The README, which has never described rounds, says the maintainers run the secret games
    for new submissions. No submission form or instructions were found on the site, and the
    leaderboard holds only the paper's runs (see review_checks).
  source: src-github-videogamebench-readme
  quote: There are three secret games in the test set which we do not release in this repo. We will
    run them on our side for new submissions.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: VG-Agent + Gemini 2.5 Pro (gemini-2.5-pro-preview-03-25)
    source: src-vgbench-site
    observed_on: 2026-11-09
    quote: VG-Agent + Gemini 2.5 Pro (gemini-2.5-pro-preview-03-25) 0.48%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The game's own progression, read from the emulator's frames by matching
  them to checkpoint frames scraped from human longplay walkthroughs; each checkpoint's score is its
  timestamp's share of the walkthrough.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The headline averages ten test games, three of which the maintainers keep on a private
    server, so no third party can compute it; the seven public games can be run with the open code,
    given ROMs or the JS-DOS builds the code loads.
  source: src-arxiv-2505-18134-v3
  quote: we also test each agent on three secret games that we host on a private evaluation server

task:
  exists: true
  input:
    - the raw game screen at each step (in the paper, one frame half a second after each action, or
      five frames 0.1 seconds apart for MS-DOS games in Lite), with a prompt giving the game's
      objectives and controls; no overlays, game state or hints
  output: Actions in language at every step, key presses, held keys, mouse moves, clicks and drags
    for MS-DOS games, button presses for Game Boy games, while the game runs in real time (or paused
    while the agent thinks, in Lite), until the run ends.
  scoring: Per game, the furthest checkpoint reached, detected by a Hamming-distance threshold on
    perceptual hashes of frames, mapped to the percentage of the walkthrough's running time at which
    it appears (100% for a finished game); the overall score is the mean over the games. Runs are
    capped at 20 times the walkthrough's length (one step counted as one second in Lite).
  source: src-arxiv-2505-18134-v3
  quote: The overall score is computed as an average of scores across all games.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The public games are not distributed. Game Boy ROMs must be supplied by the user,
    while the MS-DOS games load through JS-DOS without a download; the README says the user must own
    the games.
  access_basis:
    reason: The headline averages seven public test games with three secret games held and run only
      by the maintainers, so it cannot be computed outside; the taxonomy's test tags a headline that
      combines open sets with a maintainer-held set this way.
    source: src-arxiv-2505-18134-v3
    quote: Performance on VideoGameBench test split, a benchmark consisting of 7 games and 3 secret
      games, which we keep private to users.
  refresh: static
  refresh_basis:
    reason: The 23 games, the split and the checkpoints have stayed as released with the paper; v3
      of the paper (May 2026) revises results, not the games, and the repository has had no push
      since 2025-05-30 (GitHub API). The research preview before it is recorded as a version.
    source: src-arxiv-2505-18134-v3
    quote: VideoGameBench includes 10 games in the test set, and 13 in the dev set
  data_provenance:
    - synthetic-procedural
  data_provenance_note: The states an agent plays through are produced by the games' own programs in
    the emulators, with no learned model in the loop, as atari-100k records the ALE. The checkpoint
    frames that score progress were scraped from YouTube walkthroughs and their checkpoints defined
    by hand; they are the scoring reference, not items (web-scraped and expert-authored were
    considered on that ground).
  data_provenance_source: src-arxiv-2505-18134-v3
  data_provenance_quote: We automatically detect which checkpoint an agent has reached by applying
    perceptual image hashing
  contamination_risk: medium
  contamination_risk_note: The public games are well known, and walkthroughs and guides of them are
    all over the web, a route into pretraining that the paper names but no source evidences for a
    scored result. The secret games and the dev-test split are the paper's guard; the identity of
    the secret games is not public.
  contamination_risk_source: src-arxiv-2505-18134-v3
  contamination_risk_quote: information, guides and video walkthroughs about virtually all video
    games are widely available online and might make its way to pre-training or finetuning corpora
  contamination_evidence: []
  ceiling_anchor_type: measured-ceiling
  ceiling_anchor_type_basis:
    reason: 100% is a completed game, and each game's checkpoints are taken from a human playthrough
      to completion, which the paper says exists for every game; through the benchmark's own
      interface the authors beat only the first checkpoint of Kirby's Dream Land and Doom II (see
      review_checks).
    source: src-arxiv-2505-18134-v3
    quote: These playthroughs contain full, unedited gameplay of a human playing each video game to
      completion.
  dataset_licence: null
  dataset_licence_note: The benchmark has no dataset of its own; the games are commercial titles
    under copyright, which the README says the user must own, and the checkpoint frames come from
    YouTube walkthroughs, used, the paper says, under fair use.
  size:
    - count: 10
      unit: games
      subset: test
      source: src-arxiv-2505-18134-v3
      quote: VideoGameBench includes 10 games in the test set, and 13 in the dev set
    - count: 23
      unit: games
      source: src-arxiv-2505-18134-v3
      quote: VideoGameBench is a benchmark composed of a diverse suite of 23 curated video games
        split across a dev and test set
    - count: 13
      unit: games
      subset: dev
      source: src-arxiv-2505-18134-v3
      quote: VideoGameBench includes 10 games in the test set, and 13 in the dev set
    - count: 3
      unit: secret games
      subset: test-secret
      source: src-arxiv-2505-18134-v3
      quote: Seven of these are public and three are secret
    - count: 3
      unit: practice games
      subset: practice-games
      source: src-arxiv-2505-18134-v3
      quote: scored by how many targets (out of 10) each model could interact with in 250 actions

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The VideoGameBench authors (Princeton University)
  maintainer_basis:
    reason: The paper's authors are at Princeton University by its title page, which is not quoted
      because the line names them. The code sits in one author's personal GitHub account (owner type
      User, GitHub API), the site at vgbench.com is a GitHub Pages site of the authors, and the
      maintainers say they run the secret games themselves.
    source: src-github-videogamebench-readme
    quote: There are three secret games in the test set which we do not release in this repo. We
      will run them on our side for new submissions.
  maintainer_type: individual
  maintainer_type_note: academic-lab was considered. The paper comes from a Princeton group, but the
    repository is in one author's personal account and no institution is stated as holding the
    artefacts; the term's gpqa-diamond example decides it, as craftax's does.
  submission_process:
    - maintainer-run
    - sandboxed-rerun
  submission_process_note: The leaderboard holds the maintainers' own runs of VG-Agent with five
    models (the paper ran seven). The README says the maintainers run the secret games for new
    submissions, which reads as running an entrant's agent on their side; no source says how to
    submit or that the number is published.
  submission_process_source: src-github-videogamebench-readme
  submission_process_quote: There are three secret games in the test set which we do not release in
    this repo. We will run them on our side for new submissions.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-vgbench-site
      quote: VG-Agent + Gemini 2.5 Pro (gemini-2.5-pro-preview-03-25) 0.48%
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2505-18134-v3
      quote: we also test each agent on three secret games that we host on a private evaluation
        server
  independence_flags_note: Every leaderboard row is the maintainers' VG-Agent scaffold, built for
    the benchmark, run with a different model; the models themselves are third parties'. The secret
    games are held and run by the maintainers alone, so no outside party can check those three
    columns.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2505-18134-v3
    quote: The automatic checkpoint detection we introduced works for measuring game progress, but
      is not able to provide extremely fine-grained or continuous markers.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: Every run needs the emulators (PyBoy for Game Boy, JS-DOS in a
    Playwright-driven browser for MS-DOS) and the game files; inference spend is the other cost, up
    to $30 per game run in the paper (Appendix D.2), which is also the paper's no-progress stopping
    rule.
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is automatic inside the emulators with the maintainers' code, but the headline
      needs the secret games, which only the maintainers hold, and the public games must be owned by
      whoever runs them.
    source: src-github-videogamebench-readme
    quote: You must legally own the games to play them.
  reproducibility_blockers:
    - private-test-set
    - licence-restriction
  harness_availability: official-harness
  harness: videogamebench main.py (at commit faab5317), with VG-Agent, the per-game configs, prompts
    and checkpoint frames, and the --lite flag for VideoGameBench Lite; all_experiments.sh lists the
    paper's runs
  harness_source: src-github-videogamebench-readme
  harness_quote: python main.py --game doom2 --model gemini/gemini-2.5-pro-preview-03-25 --lite
  code_licence: MIT
  code_licence_note: The README puts the codebase under MIT and excludes the games; GitHub's licence
    metadata reads NOASSERTION (API, read 2026-11-09), so the LICENSE file was not identified as MIT
    by GitHub.
  code_licence_source: src-github-videogamebench-readme
  code_licence_quote: While all parts of this codebase fall under the MIT license
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile (simulator and version, hardware_platform, subset_used, selection_strategy,
  # n_samples): the agent scaffold and harness, since every published row is VG-Agent and entrants may bring their
  # own; the run cap (20x the walkthrough's length, 15,000 steps by the harness default, and the paper's stricter
  # stuck-run and $30 rules); and sampling (temperature 0.7) and the 2,048-token output limit. subset_used carries
  # real time versus Lite and the test versus dev split. In real time, the model's serving latency moves the score;
  # no conditions field records it, so hardware_platform and the run's date are the nearest. The paper runs each
  # model once per game.
  material_extra:
    - scaffold
    - harness
    - max_steps
    - max_output_tokens
    - sampling

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: One headline per setting, the mean of the per-game completion percentages over the test
    games (ten in real time, three in Lite), which the leaderboard prints as the Overall Score.
  source: src-arxiv-2505-18134-v3
  quote: The overall score is computed as an average of scores across all games.

homepage: https://www.vgbench.com/
repository: https://github.com/alexzhang13/VideoGameBench
repository_note: The repository sits in one author's personal GitHub account, so the URL holds a
  personal handle; it is the repository the paper's site and README link.
leaderboard_url: https://www.vgbench.com/


        quote: Performance on VideoGameBench test split, a benchmark consisting of 7 games and 3
          secret games, which we keep private to users.
    notes: The headline. Doom II, Pokemon Crystal, Zelda Link's Awakening DX, Civilization, The Need
      for Speed, Kirby's Dream Land DX and The Incredible Machine, with three secret games; the best

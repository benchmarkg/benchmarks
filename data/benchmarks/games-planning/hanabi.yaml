# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1902-00506-v2
    - src-arxiv-1902-00506
    - src-github-hanabi-learning-environment-readme
    - src-arxiv-2511-22581-v5
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the dates, the venue
    and the journal DOI; the README at master, with GitHub's repository metadata for the licence and
    the archive state; and the v5 PDF of a 2026 paper (a DOI, not archived) as evidence of current
    use. The journal's own page on ScienceDirect was not read, because its robots.txt could not be
    fetched (HTTP 403); the journal publication rests on the abstract page's related DOI and the 2026
    paper's reference. UK AISI's inspect_evals does not list Hanabi (docs index read 2026-10-14).
  confidence: medium
  review_checks:
    - check: The assignment named episodic-return for the game score. The score is bounded at 25,
        which episodic-return's tests exclude and simulation-rollout's include, so the entry takes
        simulation-rollout (simulation profile). Confirm.
      field: evaluation_method
      source: src-arxiv-1902-00506-v2
      quote: the group scores one point for each card in each stack, for a maximum of 25; otherwise,
        the score is 0
    - check: multi-agent-social was rejected because the leaf's examples (alliance, betrayal,
        persuasion) are dynamics of diverging interests and Hanabi is purely cooperative. If
        theory-of-mind reasoning about teammates counts as social dynamics, add it as secondary. The
        vocabulary has no capability for theory of mind, the paper's central claim.
      field: domain
    - check: distribution-shift-generalization rests on reading unfamiliar teammates as shifted
        inputs to an unchanged task, as Melting Pot's classification does; sample-efficiency holds
        for the sample-limited regime only. Both are set per subset with capability_override, so the
        validator's two subset-drops-terms warnings are this deliberate split; confirm it.
      field: capability
    - check: multi-agent-system was rejected (a self-play entrant is one joint policy, an ad-hoc
        entrant one agent with evaluator-supplied teammates); Melting Pot's classification tags it
        for a focal population scored jointly, which self-play resembles.
      field: designed_for_subjects
    - check: evaluation_target is learned-system with the hand-coded bots as baselines, following
        WeatherBench 2 and Open Problems; mixed was considered, since the bots led most of the
        release table.
      field: evaluation_target
    - check: maintainer-competes-on-own-benchmark rests on the release paper's own learners (ACHA,
        and BAD by six of its authors), as RoboCasa's flag rests on its baseline rows; NLE records
        no flag for its release baselines.
      field: governance.independence_flags
      source: src-arxiv-1902-00506-v2
      quote: '[38] J. N. Foerster, F. Song, E. Hughes, N. Burch, I. Dunning, S. Whiteson, M. Botvinick,
        M. Bowling, Bayesian action decoder for deep multi-agent reinforcement learning'
    - check: lifecycle active rests on a 2026 paper that runs JaxMARL's reimplementation, not the
        archived Hanabi Learning Environment. Whether results on a port count as use of the
        instrument the entry names, and whether they compare with results on the original (the
        scoring of lost games and the observation must match).
      field: lifecycle
      source: src-arxiv-2511-22581-v5
      quote: We run experiments in the JaxMARL [25] implementations of the popular Hanabi [4] and
        Overcooked [6] environments
    - check: contamination_risk medium rests on the ad-hoc pool being the evaluator's choice and
        possibly public; self-play alone would be low.
      field: data.contamination_risk
    - check: Identity. The 2018 IEEE CIG Hanabi competition (Mirror and Mixed tracks, scoring lost
        games by cards played) and later Hanabi challenges, such as the 2025 Ad-Hoc Human-AI
        Coordination Challenge (seen in a search result, not read), are separate events or entries,
        not folded in here.
      source: src-arxiv-1902-00506-v2
      quote: Recently, there was a Hanabi competition that took place at the 2018 IEEE Computational
        Intelligence in Games Conference in Maastricht
    - check: data.refresh is null because the commit history could not be read; a reader with the
        history should set static or versioned-releases.
      field: data.refresh
  personal_data_excluded:
    - source: src-arxiv-1902-00506-v2
      what: The first page's list of the fifteen authors' e-mail addresses; the windows stop short
        of it.
    - source: src-arxiv-2511-22581-v5
      what: The first page's correspondence line with an author's e-mail address; the windows stop
        short of it.

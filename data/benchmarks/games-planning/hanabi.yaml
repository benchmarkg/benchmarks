# data/benchmarks/games-planning/hanabi.yaml
#
# P1-S11-T03, games-planning entry 6 of 6. Filled from the Hanabi Challenge paper, arXiv 1902.00506 read as its v2
# PDF (2019-12-06; Artificial Intelligence 280, 2020), and its abstract page, for the dates, the venue and the
# journal DOI; the README of google-deepmind/hanabi-learning-environment at master, with GitHub's metadata for the
# repository (licence, archived, last push); and the v5 PDF of arXiv 2511.22581 (2026-06-04), a paper that reports
# Hanabi results as evidence of current use. Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# The challenge and its environment: two settings (self-play, ad-hoc team play), two training regimes for self-play
# (sample-limited at 100 million environment steps, unlimited), two to five players, scored by the game score (0 to
# 25). The 2018 IEEE CIG Hanabi competition, which the paper describes, and later Hanabi challenges were not read
# and are not folded in here.

id: hanabi
name: Hanabi Challenge
aliases:
  - Hanabi Learning Environment
  - 'The Hanabi Challenge: A New Frontier for AI Research'
tagline: Cooperative imperfect-information card play for 2-5 agents, scored 0-25 in self-play and
  with unfamiliar teammates.
description: >
  A challenge built on the card game Hanabi, from DeepMind and Google Brain, with an open-source
  environment, the Hanabi Learning Environment. Two to five players cooperate to build five colour
  stacks from 1 to 5; each sees every hand but their own, and can tell a teammate about their cards
  only through hints that name one colour or rank and cost an information token. The team scores a
  point per card stacked, 25 at most, or nothing if it loses three lives. The paper proposes two
  challenges. In self-play one learning process controls every seat, in a sample-limited regime of
  100 million environment steps or an unlimited one, and the mean score of the best run is reported
  over at least 1000 games per player count. In ad-hoc team play an agent joins teammates drawn from
  a held-out pool it has never met, after watching ten of their self-play games. Baselines are
  learned agents (Rainbow, an IMPALA-based actor-critic, the Bayesian Action Decoder) beside
  hand-coded bots, which beat the learners in most settings at release. The repository is archived;
  later work also runs Hanabi in reimplementations such as JaxMARL's.
self_description:
  source: src-arxiv-1902-00506
  quote: proposing the game of Hanabi as a new challenge domain with novel problems that arise from
    its combination of purely cooperative gameplay with two to five players and imperfect
    information
external_ids:
  arxiv: '1902.00506'
paper:
  title: 'The Hanabi Challenge: A New Frontier for AI Research'
  arxiv: '1902.00506'
  doi: 10.1016/j.artint.2019.103216
  version_read: v2
  source: src-arxiv-1902-00506-v2
released: 2019-02-01
released_note: The paper's first arXiv version, as its abstract page dates it. The v2 read here
  (2019-12-06) is the version accepted by Artificial Intelligence, published in volume 280 (2020) as
  article 103216.
released_source: src-arxiv-1902-00506
released_quote: Submitted on 1 Feb 2019

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/card-imperfect-information
domain_basis:
  reason: Hanabi is a card game in which each player sees the others' hands but not their own, so
    every player holds information the holder of those cards lacks; the paper sets it beside poker
    rather than chess or Go for that reason.
  source: src-arxiv-1902-00506-v2
  quote: It is also an imperfect information game, where players have asymmetric knowledge about the
    environment state
domain_considered_and_rejected:
  - term: games-planning/multi-agent-social
    reason: The paper's theme is reasoning about teammates' beliefs and intentions, but the leaf's
      examples are alliance, betrayal and persuasion, the dynamics of players whose interests can
      diverge. Hanabi is purely cooperative with a fixed team and no channel but hints, so there is
      no one to betray or persuade (see review_checks).
    source: src-arxiv-1902-00506
    quote: its combination of purely cooperative gameplay with two to five players and imperfect
      information
  - term: agents-tooluse/multi-agent-coordination
    reason: Agents must coordinate and signal to each other, but the family's exclusion test sends a
      game environment to games-planning.
capability:
  - collaboration
  - distribution-shift-generalization
  - sample-efficiency
capability_basis:
  collaboration:
    reason: Two to five players share one score, the cards the team stacks together, with no opposed
      objective anywhere in the game.
    source: src-arxiv-1902-00506
    quote: its combination of purely cooperative gameplay with two to five players and imperfect
      information
  distribution-shift-generalization:
    reason: The ad-hoc challenge scores an agent with teammates from a held-out pool it never
      trained with, reported as a setting of its own beside self-play. The game and its score are
      unchanged and only the partners move, which the term's inclusion test sends here rather than
      to transfer-learning; Melting Pot's classification reads unfamiliar co-players the same way.
    source: src-arxiv-1902-00506-v2
    quote: This is measured via the score achieved by the agent when it is paired with teammates
      chosen from a held-out pool of agents
  sample-efficiency:
    reason: The self-play challenge's sample-limited regime caps training at 100 million environment
      steps and scores the agent at that budget. The unlimited regime has no cap, so the term holds
      for that regime only (subsets).
    source: src-arxiv-1902-00506-v2
    quote: we propose to limit the number of environment steps that the agent can experience to be
      at most 100 million
capability_considered_and_rejected:
  - term: communication
    reason: Hints are the only explicit channel and the paper names communication as a central
      difficulty, but the score is the team's stacked cards, the joint objective, not what a
      recipient understood, which the term's exclusion test removes.
  - term: long-horizon-execution
    reason: A game runs to dozens of dependent turns, and losing three lives or discarding the last
      copy of a card caps the score, but the default observation hands each agent the card knowledge
      from past hints, so it need not retain state it generated itself, which the definition asks.
    source: src-arxiv-1902-00506-v2
    quote: This removes the memory task from the challenge
  - term: memory-retention
    reason: The minimal observation, without remembered card knowledge, is offered as an option for
      researchers interested in memory; the challenge's protocol uses the default observation.
    source: src-arxiv-1902-00506-v2
    quote: For researchers interested in memory, we provide the option to request a minimal
      observation
  - term: planning
    reason: A game is an interactive episode against an explicit objective, but the term's game
      clause needs the source to claim planning, and the paper claims cooperation, imperfect
      information and theory-of-mind reasoning instead.
  - term: transfer-learning
    reason: In ad-hoc play only the teammates change; the game, its rules and its score are the
      same, which the term's exclusion test sends to distribution-shift-generalization.

evaluation_method:
  - simulation-rollout
evaluation_method_basis:
  reason: Every number is a mean game score over games played in the environment, and each game is
    scored on a bounded scale, 0 to 25 points.
  source: src-arxiv-1902-00506-v2
  quote: the group scores one point for each card in each stack, for a maximum of 25; otherwise, the
    score is 0
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: The environment's per-turn rewards sum to the game score, but the term needs a metric
      with no defined maximum, and its exclusion test removes a return bounded by a maximum that
      cannot be exceeded. Hanabi's is 25 points, and a 2026 paper notes that not every deal can
      reach it.
    source: src-arxiv-2511-22581-v5
    quote: Note that the highest return one can achieve in one episode of Hanabi is 25, and one
      cannot achieve that return in every episode.
  - term: tournament-play
    reason: Entrants do not play each other for a placement or rating; an ad-hoc agent is scored
      with teammates from a pool the evaluator chooses, and the score is the team's own.
designed_for_subjects:
  - rl-policy
  - classical-algorithm
designed_for_subjects_basis:
  reason: The environment is built for policies trained in it, under the two training regimes, and
    ships a lower-level interface for non-learned methods such as search. The release paper scores
    hand-coded bots (SmartBot, FireFlower, HatBot, WTFWThat) in the same self-play table as the
    learners, which classical-algorithm's inclusion test admits as baselines.
  source: src-github-hanabi-learning-environment-readme
  quote: A lower level game interface is provided in pyhanabi.py for non-RL methods like Monte Carlo
    tree search.
designed_for_subjects_considered_and_rejected:
  - term: multi-agent-system
    reason: In self-play one learning process controls every seat and its joint policy is the
      entrant, with parameters shared across players in the release baselines; in ad-hoc play the
      entrant is one agent and its teammates come from a pool the evaluator supplies, which the
      term's exclusion test treats as environment (see review_checks).
    source: src-arxiv-1902-00506-v2
    quote: In this case, the learning process is in control of all players, and the objective is to
      maximise the expected utility of the resulting joint policy

as_used:
  - protocol: Inter-seed cross-play, a zero-shot form of the ad-hoc setting. Greedified IPPO
      policies from independent seeds are paired with each other for two to five players and scored
      by mean game score, run in JaxMARL's reimplementation of Hanabi rather than the Hanabi
      Learning Environment, with no held-out pool and no warm-up games.
    source: src-arxiv-2511-22581-v5
    quote: We run experiments in the JaxMARL [25] implementations of the popular Hanabi [4] and
      Overcooked [6] environments
    note: Forkel and colleagues (2026-06, v5) report two-player cross-play above 24.45 points
      against a previous best of 24.30, and self-play near 24.5.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on Hanabi under the challenge's settings, for example a 2026
    paper reporting a new state of the art in inter-seed cross-play for two to five players. That
    paper runs JaxMARL's reimplementation; the original repository is archived and was last pushed
    on 2023-02-14 (GitHub API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2511-22581-v5
  quote: In Hanabi in particular we achieve a new SOTA in inter-seed cross-play this way.
activity: no-submission-channel
activity_basis:
  reason: The paper releases an environment and recommends a protocol and reporting rules; neither
    it nor the README offers a leaderboard, server or submission route, and results appear in users'
    papers.
  source: src-arxiv-1902-00506
  quote: propose an experimental framework for the research community to evaluate algorithmic
    advances

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Rainbow (sample-limited regime)
    source: src-arxiv-1902-00506-v2
    observed_on: 2026-10-14
    quote: Training a Rainbow agent for the sample limited regime of 100 million steps took
      approximately seven days using an NVIDIA V100 GPU
  - system: IPPO with LSTM policies (high entropy regularisation, greedified)
    source: src-arxiv-2511-22581-v5
    observed_on: 2026-10-14
    quote: We see for 2 players, that XP of IPPO with either LSTM architecture is above 24.45, which
      is higher than our OBL level 6 and the previous SOTA of 24.30
evaluation_target: learned-system
evaluation_target_note: The hand-coded bots are baselines, not entrants the challenge is built for.
  Both regimes count training steps, the ad-hoc protocol is defined for agents that learn from ten
  games of their teammates, and the release paper left the bots out of its ad-hoc runs.
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The game engine's own score when the game ends, with a game that loses all
  three lives scored 0.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The environment is open source and any agent can be run on it in self-play. The ad-hoc
    pool the release paper used was not released and no canonical pool exists, so its ad-hoc numbers
    cannot be repeated exactly; new pools can be built.
  source: src-arxiv-1902-00506-v2
  quote: we have released an open source Hanabi reinforcement learning environment called the Hanabi
    Learning Environment

task:
  exists: true
  input:
    - the agent's view of the game each turn, every hand but its own, the stacks, the discards, the
      information and life tokens, and by default the card knowledge revealed by earlier hints
  output: One action per turn, a hint of one colour or rank to another player, a play or a discard,
    until the stacks are complete, the deck runs out or three lives are lost.
  scoring: "The team's game score: one point per card stacked, 25 at most, 0 if all three lives are lost.
    Self-play reports the mean and standard deviation of the best run over at least 1000 games per player
    count; ad-hoc play reports the mean over at least 1000 trials per hold-out team, each after ten of
    that team's self-play games."
  metric_range:
    - 0
    - 25
  source: src-arxiv-1902-00506-v2
  quote: 'Players take turns doing one of three actions: giving a hint, playing a card from their hand,
    or discarding a card.'

# --- Data ------------------------------------------------------------------------------------

data:
  access: generated-on-demand
  access_basis:
    reason: Every scored game is dealt and played out by the environment as it runs; there is no
      stored item set to obtain, and the environment itself is open source.
    source: src-arxiv-1902-00506-v2
    quote: It includes an environment state class which can generate observations and rewards for an
      agent
  refresh: null
  refresh_note: Not established. No source read versions the environment or dates a change to its
    rules or scoring, and its commit history was not read (the GitHub API refused the request,
    rate-limited). The repository is archived and was last pushed on 2023-02-14.
  data_provenance:
    - synthetic-procedural
  data_provenance_note: Deals and game states come from the environment's rules engine (C++ with a
    Python interface), with no learned model in the loop. The ad-hoc teammates are agents the
    evaluator trains or hand-codes, not data the benchmark supplies.
  data_provenance_source: src-arxiv-1902-00506-v2
  data_provenance_quote: Written in Python and C++, the code provides an interface similar to OpenAI
    Gym
  contamination_risk: medium
  contamination_risk_note: Self-play games are dealt afresh, so no training set can hold them. The
    ad-hoc protocol rests on teammates the agent has never encountered, but the evaluator chooses
    the pool and no canonical one was released; public agent checkpoints used as partners could have
    been trained against, a plausible route only the protocol rule prevents. Melting Pot is rated
    medium on the same ground.
  contamination_risk_source: src-arxiv-1902-00506-v2
  contamination_risk_quote: In the future we expect to see canonical agent pools of pre-trained or
    hard-coded self-play agents be made available for training and hold-out sets to allow for
    consistent comparisons
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: 25 points is the score's bound, and no human score is published to read
    scores against; the paper says only that experienced human teams are considered stronger than
    the bots. Not every deal can reach 25 (src-arxiv-2511-22581-v5), so the best possible mean is
    below the bound and unknown.
  ceiling_anchor_type_basis:
    reason: The game score is bounded at 25 by the rules.
    source: src-arxiv-1902-00506-v2
    quote: the group scores one point for each card in each stack, for a maximum of 25; otherwise,
      the score is 0
  size: null
  size_note: No fixed item set. Each game is a new deal of the 50-card deck; the protocol asks for
    at least 1000 games per player count in self-play and at least 1000 trials per hold-out team in
    ad-hoc play.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Google DeepMind
  maintainer_basis:
    reason: The environment's repository sits in the google-deepmind organisation, and its README
      marks it as a Google project, though not an officially supported product. The paper's authors
      were at DeepMind and Google Brain, apart from one each at Oxford and Carnegie Mellon whose
      work was done there.
    source: src-github-hanabi-learning-environment-readme
    quote: This is not an officially supported Google product.
  maintainer_type: industry-lab
  maintainer_type_note: The repository is archived (GitHub API, 2026-10-14), so nobody maintains the
    environment now; the field names the holder's type, and the decay is maintenance_status
    evidence.
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or submission route. The paper's own Table 1 and ad-hoc
    crosstables are the release baselines; everyone else reports in their own papers.
  submission_process_source: src-arxiv-1902-00506
  submission_process_quote: propose an experimental framework for the research community to evaluate
    algorithmic advances
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-1902-00506-v2
      quote: To demonstrate what is possible in the unlimited regime, we trained ACHA agents for 20
        billion steps.
  independence_flags_note: The release table's learners are the maintainers' own. ACHA is DeepMind's
    IMPALA-based agent built for the paper, and the Bayesian Action Decoder, the best two-player
    result in it, is by six of the paper's authors (reference 38). They are release baselines, not a
    later entry on a ranking the maintainers keep.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: Every run needs the Hanabi environment, which is light ("around 0.1ms per turn
    on a CPU"). Training is not part of a run; the release paper's Rainbow took about seven days on
    one V100 GPU for the sample-limited regime, and ACHA an estimated 100 CPU years.
  compute_tier_source: src-arxiv-1902-00506-v2
  compute_tier_quote: fast (around 0.1ms per turn on a CPU)
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is automatic but needs the environment's C++ game engine built and installed, or a
      reimplementation of it.
    source: src-arxiv-1902-00506-v2
    quote: Written in Python and C++, the code provides an interface similar to OpenAI Gym
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: hanabi_learning_environment (rl_env.py, the Gym-like environment, and pyhanabi.py, the
    lower-level game interface)
  harness_note: The environment computes the game score; averaging it over games is the paper's
    protocol, and no held-out ad-hoc pool ships with it.
  harness_source: src-github-hanabi-learning-environment-readme
  harness_quote: 'python examples/rl_env_example.py # Runs RL episodes'
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for google-deepmind/hanabi-learning-environment, read
    2026-10-14; not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the simulation profile (simulator and version, subset_used, selection_strategy, n_samples): the
  # training regime the paper defines for self-play (sample-limited at 100 million environment steps, or
  # unlimited), carried as eligibility_track; and the harness settings that change the score, namely the
  # observation (default, with remembered card knowledge, or minimal) and how a game that loses all three lives
  # is scored (0 here, the number of cards played in much prior work and the 2018 CIG competition). subset_used
  # names the setting, the player count and, for ad-hoc play, the hold-out pool; simulator names the Hanabi
  # Learning Environment or a reimplementation such as JaxMARL's. selection_strategy matters because the paper
  # reports the best of several training runs.
  material_extra:
    - eligibility_track
    - harness

homepage: https://github.com/google-deepmind/hanabi-learning-environment
repository: https://github.com/google-deepmind/hanabi-learning-environment

subsets:
  - id: hanabi#self-play
    label: 'Challenge one: self-play learning'
    scored_separately: true
    capability_override:
      - collaboration
      - sample-efficiency
    evidence:
      - source: src-arxiv-1902-00506-v2
        quote: In this case, the learning process is in control of all players, and the objective is
          to maximise the expected utility of the resulting joint policy
    notes: One learning process plays every seat. Results are reported per regime, sample-limited
      (100 million environment steps) or unlimited, and per player count.
  - id: hanabi#self-play-2p
    label: Self-play, two players
    parent: hanabi#self-play
    scored_separately: true
    notes: Five cards in each hand.
  - id: hanabi#self-play-3p
    label: Self-play, three players
    parent: hanabi#self-play
    scored_separately: true
    notes: Five cards in each hand.
  - id: hanabi#self-play-4p
    label: Self-play, four players
    parent: hanabi#self-play
    scored_separately: true
    notes: Four cards in each hand.
  - id: hanabi#self-play-5p
    label: Self-play, five players
    parent: hanabi#self-play
    scored_separately: true
    notes: Four cards in each hand.
  - id: hanabi#ad-hoc
    label: 'Challenge two: ad-hoc team play'
    scored_separately: true
    capability_override:
      - collaboration
      - distribution-shift-generalization
    evidence:
      - source: src-arxiv-1902-00506-v2
        quote: The second challenge, ad-hoc team play, is learning to play with a set of unknown
          partners, with only a few games of interaction
      - source: src-arxiv-1902-00506-v2
        quote: We recommend the evaluated agents be given ten random self-play games
    notes: The agent plays with teammates from a held-out pool after ten of their self-play games,
      with its memory reset between trials. For three to five players the team holds two unique
      agents, the evaluated one and one from the pool in every other seat. No canonical pool was
      released, so the pool is part of the result. The release paper ran two and four players.
  - id: hanabi#ad-hoc-2p
    label: Ad-hoc team play, two players
    parent: hanabi#ad-hoc
    scored_separately: true
  - id: hanabi#ad-hoc-3p
    label: Ad-hoc team play, three players
    parent: hanabi#ad-hoc
    scored_separately: true
  - id: hanabi#ad-hoc-4p
    label: Ad-hoc team play, four players
    parent: hanabi#ad-hoc
    scored_separately: true
  - id: hanabi#ad-hoc-5p
    label: Ad-hoc team play, five players
    parent: hanabi#ad-hoc
    scored_separately: true


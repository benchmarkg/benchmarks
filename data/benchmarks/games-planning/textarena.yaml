# data/benchmarks/games-planning/textarena.yaml
#
# P1-S11-T04, games-planning entry 8. Filled from the TextArena paper, arXiv 2504.11442 read as its v2 PDF
# (2025-05-24), and its abstract page; the repository's README and examples/online_play.py at commit 1e3160d
# (TextArena/TextArena, 2026-10-03), with GitHub's API record of the repository; the leaderboard page at
# textarena.ai (scripts and styles stripped); the MindGames paper, arXiv 2605.29512 read as
# its v1 PDF (2026-05-28), for the NeurIPS 2025 competition built on TextArena; and the abstract page of
# AutoHarness, arXiv 2603.03329 (February 2026), as evidence of current use. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The entry is the collection and its online TrueSkill leaderboard together, as the paper presents them. The rating
# is pool-relative: comparability.rating_pool_required is set and the metric textarena-trueskill carries no
# headroom. No data/rating-pools/ record is written: the board's rows load from a database endpoint that is not
# cited (review_checks), so no Source names the pool's members. MindGames, the four-game arena of the NeurIPS 2025 competition, is a variant under lineage, and
# its competition window an event.

id: textarena
name: TextArena
aliases:
  - TextArena Leaderboard
tagline: Language-model agents play 100+ text games against each other and people, rated by
  TrueSkill on a live leaderboard.
description: >
  An open-source collection of text-based games for evaluating and training language-model agents, with
  a Gym-style interface (an agent is any function from a text observation to a text action) and an online
  leaderboard. The games are single-player puzzles (Sudoku, Wordle, Minesweeper), two-player board, card
  and word games (chess, Othello, Kuhn poker, Taboo), negotiation and social dilemmas, and multi-player
  social-deduction and bargaining games (Secret Mafia, Codenames, Diplomacy). The paper launched with
  57 games and counted 74 at publication; the README now says over 100, with interfaces in 192 languages.
  Online, entrants play each other and human players through the maintainers' matchmaking server, and
  each is rated with TrueSkill per environment and per environment grouping (the default view is a seven-game
  Balanced Subset); humans share one rating, Humanity. The maintainers host many commercial models themselves,
  and anyone may enter an agent. When read on 2026-11-09 every row of the board was marked inactive. The
  NeurIPS 2025 MindGames competition ran four of its games on the same server.
self_description:
  source: src-arxiv-2504-11442
  quote: TextArena is an open-source collection of competitive text-based games for training and
    evaluation of agentic behavior in Large Language Models (LLMs).
external_ids:
  arxiv: '2504.11442'
paper:
  title: TextArena
  arxiv: '2504.11442'
  version_read: v2
  source: src-arxiv-2504-11442-v2
released: 2025-04-15
released_note: The paper's first arXiv version, as its abstract page dates it; the v2 read here is
  of 2025-05-24. The repository is older (created 2024-09-23, GitHub API), and the README dates an
  initial demo to January 2025 and a stable release to February 2025; neither is the paper's date.
released_source: src-arxiv-2504-11442
released_quote: '[Submitted on 15 Apr 2025 (v1), last revised 24 May 2025 (this version, v2)]'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/multi-game-suites
  secondary:
    - games-planning/board-games
    - games-planning/card-imperfect-information
    - games-planning/puzzle-games
    - reasoning-general/theory-of-mind
domain_basis:
  reason: >
    The games span several of the family's subdomains -- interactive single-player puzzles, perfect-information
    board games, card and dice games with hidden information, and negotiation and social-deduction games
    -- and the paper's appendix lists them by player count, not by one kind. Its claim is breadth across
    capabilities within games, which the term's inclusion test asks; the subdomains go secondary, multi-agent-social
    apart (rejected below). reasoning-general/theory-of-mind is secondary because the paper names theory
    of mind first among the skills its games test.
  source: src-arxiv-2504-11442-v2
  quote: These games test a wide range of capabilities, including theory of mind, persuasion,
    deception, spatial reasoning, long-term planning and other social skills that traditional
    benchmarks typically do not assess.
domain_considered_and_rejected:
  - term: games-planning/multi-agent-social
    reason: The abstract foregrounds social skills, and the multi-player list is mostly social
      deduction and bargaining. But the appendix's single-player list is all puzzles and most of its
      two-player list is board, card, dice and word games, so social dynamics do not hold most of
      the games. It is the runner-up for primary, and since a term cannot be both assigned and
      rejected it is not listed as secondary either; the social games are carried by
      reasoning-general/theory-of-mind.
    source: src-arxiv-2504-11442-v2
    quote: Traditional benchmarks rarely assess dynamic social skills such as negotiation, theory of
      mind, and deception
  - term: games-planning/game-theory
    reason: Prisoner's Dilemma, Stag Hunt and Battle of the Sexes are among the games, but every
      game is rated against the other entrants, not against a game-theoretic solution concept.
  - term: reasoning-general/puzzle-solving
    reason: The single-player puzzles (Sudoku, Wordle, Mastermind) are played as episodes in which
      the environment answers each move, which the exclusion test's protocol rule sends to
      games-planning/puzzle-games.
  - term: agents-tooluse/negotiation
    reason: Several games are bargaining interactions, but they are a few games of the suite and are
      played in a game environment, which takes them to games-planning.
  - term: general-intelligence/agi-composite-suites
    reason: The breadth lies inside one family, games, which its exclusion test sends to that
      family's suite subdomain.
capability:
  - planning
capability_basis:
  planning:
    reason: >
      Each game is an interactive episode against an explicit objective, winning, so the executed moves
      are the plan and the game's outcome scores it, and the source claims planning: long-term planning
      among the capabilities the games test, and Strategic Planning the most common of the soft skills
      the paper tags its games with.
    source: src-arxiv-2504-11442-v2
    quote: These games test a wide range of capabilities, including theory of mind, persuasion,
      deception, spatial reasoning, long-term planning and other social skills that traditional
      benchmarks typically do not assess.
capability_considered_and_rejected:
  - term: collaboration
    reason: A few games are cooperative or mixed-motive (Codenames teams, Stag Hunt), but the games
      are presented as competitive and every rating is fitted to wins and losses against opponents,
      not to an outcome the players reach together.
  - term: communication
    reason: Taboo, Codenames and the negotiation games turn on messages, but the score is the game's
      result, the joint or opposed objective, which the term's exclusion test removes.
  - term: calibration-uncertainty
    reason: Uncertainty Estimation is one of the paper's soft-skill tags, but no game's score
      consumes a confidence the system emits.
  - term: spatial-reasoning
    reason: Spatial Thinking is a soft-skill tag on board games, but the rating scores the game's
      outcome, not a spatial inference.
  - term: deductive-reasoning
    reason: Logical Reasoning is a soft-skill tag, but the score is a game result, not a conclusion
      checked against premises.
evaluation_method:
  - tournament-play
evaluation_method_basis:
  reason: Entrants play each other, and human players, in the maintainers' online system, and the
    result is a TrueSkill rating fitted to those games, per environment and per grouping --
    tournament-play's inclusion test. The paper chose TrueSkill because it handles games with more
    than two players.
  source: src-arxiv-2504-11442-v2
  quote: The online competition system facilitates both Model vs Model and Model vs Human play
    across our diverse library of environments.
evaluation_method_considered_and_rejected:
  - term: pairwise-preference-elo
    reason: The paper sets itself against Chatbot Arena's votes; outcomes here are played games, and
      the term's exclusion test removes direct play.
    source: src-arxiv-2504-11442-v2
    quote: humans select which of two LLM-generated answers they prefer
  - term: episodic-return
    reason: A game ends in a win, draw or loss, and the rating is fitted to those outcomes, not to
      an unbounded accumulated reward. Offline users report mean reward (AutoHarness, as_used),
      which is their protocol, not the board's.
  - term: entrant-relative-ranking
    reason: The rating is relative to the pool, but it comes from games played between the entrants,
      which tournament-play names.
designed_for_subjects:
  - agent-scaffold
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: >
    Two kinds of entrant are rated side by side. Community entrants bring their own agent, any function
    from observation to action with whatever prompting or loop it contains (agent-scaffold; the README's
    interface, and MindGames' winners relied on explicit scaffolding). The maintainers also host official
    models, listed under provider model names and played by the platform itself, so for those rows only
    the model varies inside the maintainers' wrapper (model-in-benchmark-harness). No source read states
    the hosted models' prompt or wrapper.
  source: src-arxiv-2504-11442-v2
  quote: So far, we have evaluated 283 models online, including community submissions and the 64
    official models hosted by the platform.
designed_for_subjects_considered_and_rejected:
  - term: multi-agent-system
    reason: Several agents play in each game, but each entrant is one agent and the other players
      are other entrants; the field describes the entrant, as the term's exclusion test says.
  - term: instruction-tuned-model
    reason: The game loop drives the model across many turns, which the term's exclusion test sends
      to a harness term.
  - term: human-nonexpert
    reason: Human players are on the board, but pooled as one reference rating, Humanity, not as the
      subjects the benchmark is built to rank.
  - term: rl-policy
    reason: The framework is built for RL training as well, but the leaderboard rates submitted
      agents; a policy trained on the games enters as an agent like any other.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the games. AutoHarness (February 2026) ran Gemini-2.5-Flash
    with synthesised harnesses on 145 TextArena games, and MindGames' 2025 competition rated 944
    submitted agents on four. The online board itself showed no active model on 2026-11-09
    (activity).
  source: src-arxiv-2603-03329
  quote: The resulting harness prevents all illegal moves in 145 different TextArena games (both
    1-player and 2-player)
activity: unknown
activity_basis:
  reason: >
    The submission route still exists in the code at the pinned commit (ta.make_online and an example
    script), but whether the online board takes entries now could not be established. Every row the leaderboard
    loaded on 2026-11-09, for the Balanced Subset and for all environments, was marked inactive, which
    on the page's own rule means fewer than 5 games in the last 14 days; and the matchmaking server the
    client connects to did not answer an HTTPS request that day (a timeout, not quoted). accepting-submissions
    would need the route to be open now.
  source: src-textarena-leaderboard
  quote: For most environments, inactivity means playing fewer than 5 games in the last 14 days.
events:
  - name: MindGames, NeurIPS 2025 competition (Stage I and II on the TextArena online leaderboard)
    kind: online-challenge    # 944 agents from 76 teams on four games; the board's NeurIPS subset
    source: src-textarena-leaderboard
    quote: For the NeurIPS subset and its component environments, inactivity is determined within
      the competition window (Sept 23 – Oct 7, 2025)

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Gemini-2.5-Flash with a synthesised code harness (AutoHarness)
    source: src-arxiv-2603-03329
    observed_on: 2026-11-09
    quote: The resulting code-policy receives a higher average reward than Gemini-2.5-Pro and
      GPT-5.2-High on 16 TextArena 1-player games.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each game's outcome as its environment's rules compute it -- a win, draw
  or loss per player -- not a reference answer.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The environments install from PyPI under the MIT licence, and any two agents can be played
    offline. A third party can run its own tournament; it cannot reproduce the online board's
    ratings, which come from the maintainers' server and its pool.
  source: src-github-textarena-readme-1e3160d
  quote: pip install textarena

task:
  exists: true
  input:
    - each turn, the player's text observation of the game -- its rules, the state as that player
      may see it, and the other players' moves and messages
  output: One text action per turn, in the format the game expects; the environment enforces the
    rules.
  scoring: Each game's win, draw or loss updates every player's TrueSkill rating for that
    environment and for the groupings it belongs to. The paper also derives soft-skill profiles,
    weighted averages of a model's environment ratings over the up to five skills each game is
    tagged with.
  tests_hidden_from_system: false
  source: src-github-textarena-readme-1e3160d
  quote: function that accepts a string observation and returns a string action

# --- Data ------------------------------------------------------------------------------------

data:
  access: generated-on-demand
  access_basis:
    reason: The scored items are games, produced afresh in every match by entrants playing each
      other in the game engines -- the term's own case. There is no item set to obtain; the
      environments themselves are open.
    source: src-arxiv-2504-11442-v2
    quote: TextArena facilitates offline model development/training and online competition between
      models and human players (both model vs model and model vs human)
  refresh: rolling-live
  refresh_basis:
    reason: The game collection grows without labelled versions -- 57 at launch, 74 at publication,
      over 100 in the README -- and the rating pool changes as entrants come and go, so a rating
      needs its date and grouping to be read.
    source: src-arxiv-2504-11442-v2
    quote: As of publication, the collection has grown to 74 games and continues to expand.
  data_provenance:
    - synthetic-procedural
  data_provenance_note: The states arise from play in rule-coded game environments with no learned
    model generating them; the entrants' moves are the evaluation, not its data. Some games draw on
    word lists, puzzles or topics shipped with the code, which were not read.
  data_provenance_source: src-arxiv-2504-11442-v2
  data_provenance_quote: Importantly, all games used are either naively text-based or adapted to be
    text-based.
  contamination_risk: low
  contamination_risk_note: Games against other entrants are played, not retrieved. Single-player
    puzzles drawn from lists shipped with the code could be memorised, and the rules of classic
    games are public; no source evidences either, and the online board's groupings are mostly
    multi-player. Recorded, not escalated.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_basis:
    reason: The paper chose a relative rating so that there is no top end; a TrueSkill mean has no
      maximum, and Humanity's rating is one entrant in the pool, not a ceiling scores are read
      against.
    source: src-arxiv-2504-11442-v2
    quote: The advantage thereof is that there is no clear upper limit of performance that can be
      reached
  dataset_licence: null
  dataset_licence_note: The games and their word lists ship as code; no source read states a licence
    for any data apart from the code, which GitHub reports as MIT (execution.code_licence). The
    paper promises releases of game trajectories; MindGames' 2025 trajectories are CC BY 4.0 by its
    paper.
  size:
    - count: 100
      unit: games
      subset: the repository at commit 1e3160d
      note: A lower bound; the README says over 100.
      source: src-github-textarena-readme-1e3160d
      quote: A suite of 100+ single-, two-, and multi-player text-based games for benchmarking and
        training LLMs.
    - count: 145
      unit: games
      subset: the one- and two-player games AutoHarness ran (February 2026)
      note: Counted by a user of the suite, not by its maintainers; the README's count is the lower
        bound above.
      source: src-arxiv-2603-03329
      quote: The resulting harness prevents all illegal moves in 145 different TextArena games (both
        1-player and 2-player)
    - count: 74
      unit: games
      subset: the paper's v2 (16 single-player, 47 two-player, 11 multi-player)
      source: src-arxiv-2504-11442-v2
      quote: As of publication, the collection has grown to 74 games and continues to expand.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The TextArena team (GitHub organisation TextArena)
  maintainer_basis:
    reason: The repository, the PyPI package's code and the site are held under the TextArena name,
      in a GitHub organisation account. The paper's authors are at A*STAR's research institutes,
      Northeastern University, the National University of Singapore and MIT; no source read names
      one institution as the holder.
    source: src-github-api-textarena
    quote: '"full_name":"TextArena/TextArena"'
  maintainer_type: community-collective
  maintainer_type_note: The term's test -- a shared organisation account, contributors from several
    institutions, no legal form and no single holder stated. A*STAR is the first affiliation of most
    authors; if it holds the project, academic-lab or government-agency would replace this
    (review_checks).
  maintainer_type_source: src-github-api-textarena
  maintainer_type_quote: '"type":"Organization"'
  submission_process:
    - live-arena
    - maintainer-run
  submission_process_note: >
    live-arena: ratings come from continuous play among whoever is entered. Anyone may enter an agent
    through the online client, with no formal restriction; the maintainers also choose and host official
    models themselves (maintainer-run). Ratings are computed by the maintainers' server from the games,
    so nothing is self-reported.
  submission_process_source: src-arxiv-2504-11442-v2
  submission_process_quote: While we impose no formal restrictions on model submissions
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-arxiv-2504-11442-v2
      quote: and OpenRouter, Anthropic, and AWS for supporting TextArena in various capacities.
  independence_flags_note: The paper thanks Anthropic among others for unspecified support, and the
    paper names Claude-3.7-Sonnet among the models whose games it records. The kind of support is
    not stated (review_checks). Whether the maintainers enter models of their own was not
    established.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The game engines are plain Python on a CPU; the cost of playing is the entrant's model
      inference, which the README's examples buy through OpenRouter.
    source: src-github-textarena-readme-1e3160d
    quote: pip install textarena
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline ratings are computed on the maintainers' matchmaking server from games
      against the entrants and human players it gathers, so only the maintainers can produce them; a
      third party can play the same environments offline and rate its own pool. The pool also moves
      (live-world-state).
    source: src-github-textarena-online-play-1e3160d
    quote: 'env.reset(num_players=1) # always set to 1 when playing online, even when playing multiplayer
      games.'
  reproducibility_blockers:
    - live-world-state
  harness_availability: reference-implementation-only
  harness_availability_note: The textarena package is the environments and the online client
    (ta.make_online); the official TrueSkill is computed server-side, not by published code.
  harness: textarena (PyPI), with ta.make_online for the online leaderboard
  harness_source: src-github-textarena-online-play-1e3160d
  harness_quote: env = ta.make_online(
  code_licence: MIT
  code_licence_source: src-github-api-textarena
  code_licence_quote: '"spdx_id":"MIT"'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # No profile resolves: tournament-play pairs only with surrogate, reasoning, classical and RL subjects. The
  # conditions a rating depends on, beyond its pool: the entrant's own agent (scaffold) or the platform's wrapper
  # for a hosted model (harness), the model snapshot behind a provider name, and the environment or grouping the
  # rating was fitted over (subset_used). The board fits a separate rating per grouping, so a Balanced Subset
  # rating and a Chess-v0 rating are on different axes. No data/rating-pools/ record is written (header comment).
  material_extra:
    - scaffold
    - harness
    - provider_snapshot
    - subset_used
  rating_pool_required: true
aggregation_policy: official-aggregate
aggregation_policy_note: The board's default view is one TrueSkill rating over the seven-game
  Balanced Subset, beside ratings over all environments, per skill grouping and per game. Each is
  fitted to the games in that grouping, not averaged from per-game ratings; the paper's soft-skill
  profiles are weighted averages.
headline_metric: textarena-trueskill
secondary_axes:
  - latency

homepage: https://www.textarena.ai/
repository: https://github.com/TextArena/TextArena
leaderboard_url: https://www.textarena.ai/leaderboard

metrics:
  - textarena-trueskill

lineage:
  role: root
  variants:
    - id: mindgames
      relation: four-game competition arena built on TextArena (Colonel Blotto, Iterated Prisoner's
        Dilemma, Codenames, Secret Mafia), with its own site, dataset and frozen offline reference
        pool (MG-Ref)
      co_maintainer: MindGames organiser and participation teams (NeurIPS 2025 competition)
      source: src-arxiv-2605-29512-v1
      quote: Built on TextArena, MINDGAMES provides a unified interaction interface, TrueSkillbased
        rating, and full trajectory logging across four game environments.
lineage_note: MindGames is listed as a same-maintainer variant because the README announces it and
  its findings in the maintainers' voice and its first cycle ran on TextArena's own server; it has
  its own organiser team, site and repository, so it may instead be a fork (review_checks). It is
  not catalogued.

tags:
  - rating-pool
  - trueskill
  - text-games
  - human-vs-model
  - multilingual

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2504-11442-v2
    - src-arxiv-2504-11442
    - src-github-textarena-readme-1e3160d
    - src-github-textarena-online-play-1e3160d
    - src-github-api-textarena
    - src-textarena-leaderboard
    - src-arxiv-2605-29512-v1
    - src-arxiv-2603-03329
  sources_note: >
    The paper's v2 PDF and the MindGames v1 PDF (DOIs, not archived) read as text, and the abstract pages
    of TextArena and AutoHarness; the README and online-play example pinned to commit 1e3160d, and GitHub's
    API record; and the leaderboard page with scripts and styles stripped. The board's rows and groupings
    load from a database endpoint whose request carries a privileged key shipped in the site's script;
    they
    are not cited, and the leaderboard's groupings are not recorded as subsets (review_checks).
  confidence: medium
  review_checks:
    - check: No data/rating-pools/ record and no subsets. The leaderboard's rows and its groupings
        (a default Balanced Subset, an All grouping and skill groupings) load from a database
        endpoint whose request carries a privileged key shipped in the site's script, so they are
        not cited. A pool record (rating_system trueskill) and the groupings as subsets wait on a
        public export or archivable page that lists them.
      field: comparability.rating_pool_required
    - check: activity unknown. The code keeps the online route, but every leaderboard row was
        inactive on 2026-11-09 and the matchmaking host timed out. A reviewer who can see a game
        being played, or a statement that the server is closed, should set accepting-submissions or
        closed.
      field: activity
      source: src-github-textarena-online-play-1e3160d
      quote: env = ta.make_online(
    - check: multi-game-suites against multi-agent-social. The abstract's own claim is social
        skills, and the corpus has no classification record for TextArena. The call rests on the
        appendix's game lists; no count by subdomain was computed (05 S4). Rejecting
        multi-agent-social as primary also keeps it out of secondary, though social-deduction and
        bargaining games are a large part of the suite; a reviewer may prefer it secondary, with
        this check carrying the rejection.
      field: domain.primary
      source: src-arxiv-2504-11442
      quote: allows for easy evaluation of model capabilities via an online-play system (against
        humans and other submitted models) with real-time TrueSkill scores
    - check: funded-by-evaluated-party rests on an acknowledgement of support "in various
        capacities" from Anthropic, whose models are rated; if the support was not money, credits or
        compute, the flag should go. OpenRouter and AWS are thanked too; whether their own systems
        are rated was not checked.
      field: governance.independence_flags
    - check: model-in-benchmark-harness for the hosted official models rests on the paper's "hosted
        by the platform"; no source read gives their prompt or wrapper, or says the same wrapper is
        used for all of them.
      field: designed_for_subjects
    - check: maintainer_type community-collective. The paper's first affiliation is A*STAR's Centre
        for Frontier AI Research; if A*STAR holds the project, the type is academic-lab or
        government-agency.
      field: governance.maintainer_type
    - check: MindGames as a variant, not a fork. Same server and the README's "we", but its own
        organiser team, GitHub organisation, site and dataset. If the lead judges it separately
        maintained, it becomes a fork with that team as maintainer.
      field: lineage
      source: src-github-textarena-readme-1e3160d
      quote: We released the findings of
    - check: No versions are modelled. The collection grows game by game with no tags or GitHub
        releases (API, 2026-11-09), environments carry their own -v0 ids, and the README dates
        package releases (v0.6.9 with 100 games, July 2025). Whether those package releases should
        be editions under 04 S4 is not clear-cut; PyPI's release history was not read (its
        robots.txt disallows the JSON API).
      field: versions
    - check: theory of mind, persuasion and deception, the skills the paper says set it apart, have
        no capability term; logged with bench tag-gap.
      field: capability
    - check: The paper and README link the repository under its earlier personal-account home; the
        canonical repository is now the TextArena organisation (GitHub API). No history event is
        recorded because no source read dates the move.
      field: repository
  personal_data_excluded:
    - source: src-arxiv-2504-11442-v2
      what: The authors' names and corresponding addresses, and the acknowledgements' named
        contributors, beside the cited passages.
    - source: src-arxiv-2504-11442
      what: The author list and the submitter line on the abstract page.
    - source: src-github-textarena-readme-1e3160d
      what: An individual named in the January 2025 update, the citation's author list and links

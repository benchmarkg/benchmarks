# data/benchmarks/games-planning/nle.yaml
#
# P1-S3-T02, checkpoint entry 16 of 20 (copilot off). Filled from the NLE paper, arXiv 2006.13760 read as its v2
# PDF (NeurIPS 2020), and its abstract page; the README of the maintained repository (NetHack-LE/nle) and of the
# archived original (facebookresearch/nle); and an April 2026 abstract that reports on it. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# The environment and its task suite (NetHackScore, the staircase, pet, eat, gold, scout and oracle tasks, and the
# full game). The NeurIPS 2021 NetHack Challenge ran on NLE as a separate competition; it was not read and is not
# folded in here.

id: nle
name: NetHack Learning Environment (NLE)
aliases:
  - NLE
  - NetHack Learning Environment
tagline: 'NetHack as a reinforcement-learning environment: procedurally generated dungeons, scored by
  the in-game score.'
description: >
  A Gym-style interface to NetHack 3.6, a single-player terminal roguelike whose dungeons are generated
  anew from a seed every game, with complex stochastic dynamics and the long-term goal of retrieving an
  amulet and ascending. NLE ships a suite of tasks, among them reaching the downstairs, eating, collecting
  gold, scouting, finding the oracle and maximising the in-game score. The authors recommend the score
  task for comparing agents, because ascension is out of reach, and evaluate on held-out seeds. The environment
  is fast, and baselines are IMPALA agents with and without random network distillation. It is now maintained
  outside its original organisation, with a Gymnasium interface.
self_description:
  source: src-arxiv-2006-13760-v2
  quote: we present the NetHack Learning Environment (NLE), a scalable, procedurally generated,
    stochastic, rich, and challenging environment for RL research
external_ids:
  arxiv: '2006.13760'
paper:
  title: The NetHack Learning Environment
  arxiv: '2006.13760'
  version_read: v2
  source: src-arxiv-2006-13760-v2
released: 2020-06-24
released_note: The paper's first arXiv version, as the abstract page dates it (NeurIPS 2020).
released_source: src-arxiv-2006-13760
released_quote: Wed, 24 Jun 2020

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: games-planning/video-games
  secondary:
    - games-planning/procedural-generalization
domain_basis:
  reason: Agents play a video game through its ordinary observation and action interfaces. Every
    game is a new procedurally generated dungeon, and evaluation is on held-out seeds, which is the
    secondary leaf.
  source: src-arxiv-2006-13760-v2
  quote: evaluating on held-out unseen seeds ensures we test systematic generalization of agents
capability:
  - long-horizon-execution
capability_basis:
  long-horizon-execution:
    reason: An episode runs to thousands of dependent actions, and dying ends it, so an early error
      makes later progress unattainable.
    source: src-github-nle-readme
    quote: one of the hardest roguelikes currently being played by humans
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: Held-out seeds differ from training only by random sampling of the same generator, which
      the term's exclusion test removes.

evaluation_method:
  - episodic-return
evaluation_method_basis:
  reason: The recommended comparison is NetHack's in-game score, an unbounded accumulation over an
    episode; the vocabulary names it as the term's own example.
  source: src-arxiv-2006-13760-v2
  quote: we recommend comparing models on the score task in the meantime
designed_for_subjects:
  - rl-policy
designed_for_subjects_basis:
  reason: The environment is built for trained reinforcement-learning policies. Prompted language
    agents are now scored in it as well, which rl-policy's own test sends to their own term on the
    claim.
  source: src-github-nle-readme
  quote: The NetHack Learning Environment (NLE) is a Reinforcement Learning environment originally
    presented at [NeurIPS 2020]

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it, for example an April 2026 hierarchical-RL paper, and the
    maintained repository was last pushed on 2026-09-21 (GitHub API).
  source: src-arxiv-2604-24558
  quote: We evaluate HBS on the NetHack Learning Environment, demonstrating strong performance
activity: no-submission-channel
activity_basis:
  reason: The repository offers the environment and its tasks and keeps no leaderboard; results
    appear in users' papers. The 2021 NetHack Challenge was a separate competition on NLE and is not
    read here.
  source: src-github-nle-readme
  quote: comes with tasks that function as a first step to evaluate agents on this new environment

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: IMPALA with Random Network Distillation
    source: src-arxiv-2006-13760-v2
    observed_on: 2026-10-10
    quote: we introduce baseline models trained using IMPALA [24] and Random Network Distillation
      (RND) [13]
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The game engine's own score and end-of-game state.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The environment is open source and installs from PyPI; any agent can be run on any seed.
  source: src-github-nle-readme
  quote: $ pip install nle

task:
  exists: true
  input:
    - the game's symbolic observation (map glyphs, messages, status) at each step
  output: One of NetHack's keyboard actions per step, until the hero dies or the episode ends.
  scoring: The task's reward accumulated over the episode -- for the score task, NetHack's in-game
    score -- averaged over episodes on held-out seeds.
  source: src-arxiv-2006-13760-v2
  quote: we recommend comparing models on the score task in the meantime

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The environment and every task are open source; there is no held-out data, only unseen
      seeds.
    source: src-github-nle-readme
    quote: $ pip install nle
  refresh: versioned-releases
  refresh_basis:
    reason: The environment changes in versioned releases, including the move from NetHack 3.6.6 to
      3.6.7 and to the Gymnasium API; a score names the version and task id.
    source: src-github-nle-readme
    quote: This version of NLE is based on [NetHack 3.6.7]
  data_provenance:
    - synthetic-procedural
  data_provenance_note: Every dungeon is generated by NetHack's own engine from a seed, with no
    learned model in the loop.
  data_provenance_source: src-arxiv-2006-13760-v2
  data_provenance_quote: a scalable, procedurally generated, stochastic, rich, and challenging
    environment
  contamination_risk: low
  contamination_risk_note: The scored episodes are generated from seeds at evaluation and do not
    exist beforehand, so no training set can hold them. What a model may have read is strategy (the
    NetHack wiki and guides), which is knowledge of the game, not of the scored content.
  contamination_evidence: []
  ceiling_anchor_type: none-known

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: NetHack-LE (community maintainers; originally Meta AI and UCL)
  maintainer_basis:
    reason: The original repository is archived and points to a new home, and the maintained
      repository now sits in the NetHack-LE organisation.
    source: src-github-facebookresearch-nle-readme
    quote: Please find NLE at its new home at
  maintainer_type: community-collective
  maintainer_type_note: A project organisation with no stated institutional holder; the paper's
    authors were at Facebook AI Research and UCL.
  submission_process:
    - literature-only
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: Runs are automatic but only inside NLE's build of the NetHack engine, compiled with
      cmake.
    source: src-github-nle-readme
    quote: NLE requires `python>=3.10`, `cmake>=3.28` to be installed
  harness_availability: official-harness
  harness: nle (the Gymnasium environments, e.g. NetHackScore-v0)
  harness_source: src-github-nle-readme
  harness_quote: env = gym.make("NetHackScore-v0")
  code_licence: null
  code_licence_note: GitHub reports the licence as "Other" (NetHack's own General Public License
    applies to the game); no licence text was read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the task id and environment version (NetHack 3.6.6 or 3.6.7, gym or Gymnasium), the
  # number of evaluation episodes and seeds, and the training budget in environment steps.
  material_extra:
    - subset_used
    - n_samples

homepage: https://github.com/NetHack-LE/nle
repository: https://github.com/NetHack-LE/nle

tags:
  - reinforcement-learning
  - roguelike
  - procedural-generation
  - nethack

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S3-T02)
  added_on: 2026-10-10
  last_verified: 2026-10-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2006-13760-v2
    - src-arxiv-2006-13760
    - src-github-nle-readme
    - src-github-facebookresearch-nle-readme
    - src-arxiv-2604-24558
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the date; both READMEs
    at main; and a 2026 abstract page as evidence of current use.
  confidence: medium
  notes: |
    Reviewer checks:
    - The 2021 NetHack Challenge (NeurIPS, on AIcrowd) was not read; if catalogued, it is its own entry or an

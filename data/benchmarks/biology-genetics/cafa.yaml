# data/benchmarks/biology-genetics/cafa.yaml
#
# P1-S5-T04, biology-genetics entry 4 of 9. Filled from the CAFA hub page on biofunctionprediction.org
# (scripts and styles stripped); the CAFA 6 and CAFA 5 Kaggle competition pages as Kaggle's page service
# serves them (overview, evaluation, data, timeline, host and rules), read without accepting any rules, and
# Kaggle's public record of the CAFA 6 competition; the CAFA1 report (Nature Methods 2013) and the CAFA3
# report (Genome Biology 2019) as Europe PMC full text; the v2 PDFs of the CAFA4 and CAFA5 reports (bioRxiv,
# June 2026); the README of CAFA-evaluator, the scorer the competitions name; and FANTASIA (NAR
# Genomics and Bioinformatics, September 2026), a paper that scores itself on the CAFA5 test sets. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# One entry for the series, as the plan has it for CASP, CAFA and CAGI: the rounds CAFA1 to CAFA 6 are
# `versions[]` editions, each breaking.

id: cafa
name: CAFA
aliases:
  - Critical Assessment of protein Function Annotation
  - Critical Assessment of Functional Annotation
tagline: Protein function prediction, scored prospectively against Gene Ontology annotations that
  accrue after the deadline.
description: >
  A recurring community experiment, run since 2010, that assesses computational protein function
  prediction. The organisers release a large set of protein sequences, most of them lacking
  experimental annotation in at least one Gene Ontology aspect. Entrants submit a score in (0, 1]
  for each protein-term pair they predict, using any data available before the deadline. After the
  deadline the organisers wait months to years while experimental annotations reach UniProt. The
  proteins that gain them become the benchmark, split by aspect (Molecular Function, Biological
  Process, Cellular Component) and by what was known before (no-knowledge, limited-knowledge and,
  since the CAFA4 and CAFA5 reports, partial-knowledge). Methods are ranked by Fmax, the best
  F-measure over score thresholds, and by Smin, a semantic distance weighted by information
  content. CAFA1 to CAFA4 ran on the organisers' own submission system and were reported in
  assessment papers. CAFA 5 (2023) and CAFA 6 (2025-2026) ran as Kaggle competitions ranked by
  information-accretion-weighted Fmax. CAFA2 also scored Human Phenotype Ontology terms, CAFA3
  and its follow-on CAFA-π added experimental screens, CAFA4 a disordered-protein category and
  CAFA 6 an optional free-text task. Known weaknesses the sources name: annotations
  are incomplete (an absent annotation is not evidence of absence), measured performance moves
  until enough annotations accumulate, and in CAFA5 only 5.3% of the new annotations came from
  papers published after the deadline.
self_description:
  source: src-cafa-site
  quote: The Critical Assessment of protein Function Annotation algorithms (CAFA) is an experiment
    designed to provide a large-scale assessment of computational methods dedicated to predicting
    protein function, using a time challenge
paper:
  title: A large-scale evaluation of computational protein function prediction
  doi: 10.1038/nmeth.2340
  source: src-natmethods-2013-cafa1
released: 2010-09-15
released_note: CAFA1's target release, as its report dates it; predictions were due on 2011-01-18.
  The series' reports appeared in 2013 (CAFA1), 2016 (CAFA2), 2019 (CAFA3) and 2026 (CAFA4 and
  CAFA5).
released_source: src-natmethods-2013-cafa1
released_quote: The set of targets was announced on 15 September 2010 with a prediction submission
  deadline of 18 January 2011
release_venue: Nature Methods 10(3), 221-227 (2013), the CAFA1 report

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/protein-function-prediction
domain_basis:
  reason: Every edition scores functional annotations (Gene Ontology terms, and in CAFA2 also Human
    Phenotype Ontology terms) assigned to protein sequences, against curated annotations; that is
    the leaf's definition. The phenotype and disordered-protein tracks are still function terms
    assigned to proteins, so no secondary leaf is added.
  source: src-cafa-site
  quote: The predictors then predict the function of these proteins by associating them with Gene
    Ontology terms or Human Phenoytpe Ontology terms
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: Systems predict a biological property, a protein's function, from its sequence and other
      data, and the score compares the prediction with experimentally supported annotations.
    source: src-cafa-site
    quote: A major challenge in the field of bioinformatics is to predict the function of a protein
      from its sequence or structure.
capability_considered_and_rejected:
  - term: probabilistic-forecasting
    reason: Entrants emit scores and the truth is curated after the deadline, but what is predicted
      is a property the protein already has; only its experimental annotation is missing. The
      exclusion for an answer that already exists applies to the property, so the prospective
      element is recorded as prospective-resolution and resolves-over-time instead.
  - term: calibration-uncertainty
    reason: The scores in (0, 1] are consumed only through a threshold swept over them. Fmax and
      Smin take the best threshold, so any order-preserving rescaling of a method's scores leaves
      its result unchanged, and no source claims that calibration is scored.
  - term: distribution-shift-generalization
    reason: The Kaggle pages warn that the leaderboard sample and the final test set differ in
      distribution, but that is a caution about the interim leaderboard, not a shifted condition the
      benchmark sets up and reports.

evaluation_method:
  - prospective-resolution
  - domain-metric
  - classification-metric
evaluation_method_basis:
  reason: >
    prospective-resolution because the benchmark proteins are those that gain experimental
    annotations between the deadline and the evaluation; the protocol guarantees that each scored
    annotation was absent from UniProt when predictions were locked. domain-metric for the current
    headline, Fmax over precision and recall weighted by each GO term's information accretion, and
    for Smin; both are defined over the ontology by the field's own papers. classification-metric
    for the unweighted Fmax that CAFA1 to CAFA4 ranked by and the reports still give, an F-measure
    over predicted terms maximised over thresholds.
  source: src-kaggle-cafa-6
  quote: Proteins having one or more of their functions published by researchers during the curation
    phase of the competition will comprise the future test set.
evaluation_method_considered_and_rejected:
  - term: wet-lab-validation
    reason: In CAFA3 the organisers assayed Drosophila genes that the predictions selected for
      long-term memory, a lab test of the predictions themselves, but it was one term-centric
      analysis of one edition and is in no ranking; the CAFA3 genome-wide screens measured every
      gene regardless of the predictions, which is prospective-resolution.
    source: src-genomebiol-2019-cafa3
    quote: we used CAFA predictions to select genes from D. melanogaster and assay them for
      long-term memory involvement
  - term: composite
    reason: The Kaggle headline averages one method, weighted Fmax, over the three GO aspects and
      (CAFA 6) the three knowledge settings; the term's exclusion covers one metric averaged over
      categories.
  - term: expert-panel-assessment
    reason: CAFA1 to CAFA4 were published as assessment papers, but CAFA 5 and CAFA 6 rank entrants
      on a Kaggle leaderboard, which the term's exclusion sends elsewhere.
  - term: uncertainty-calibration-score
    reason: No metric scores the emitted scores' calibration or applies a proper scoring rule to
      them (see calibration-uncertainty).
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The entrants are function predictors built for this biological task, from the CAFA3 winner
    GOLabeler (an ensemble of classifiers trained on sequence features) to the
    protein-language-model methods of CAFA 5. Naive term-frequency and BLAST transfer, which have no
    learned component, are scored beside them as baselines in every report, which the
    classical-algorithm test counts.
  source: src-biorxiv-2026-04-27-716980-v2
  quote: The Naive [9] prediction baseline assigns each term in the ontology a score equal to its
    frequency in the database.
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: A predictor is scored against curated annotations of a protein's role, not against what
      an assay would output for a given input, and its exclusion sends models scored against
      measurements they were not built to emulate to domain-specialist-model.
  - term: task-specific-supervised-model
    reason: Its exclusion sends tasks of a scientific discipline to domain-specialist-model, even
      though the Kaggle editions drew general machine-learning entrants.
as_used:
  - protocol: The CAFA5 test sets (no-knowledge, limited-knowledge and partial-knowledge) and the
      CAFA evaluation tools used after the challenge to score a method that did not take part. The
      run is retrospective, so it is not blind to annotations published since the CAFA5 deadline.
    split: CAFA5 no-knowledge, limited-knowledge and partial-knowledge test sets
    source: src-nargab-2026-fantasia
    quote: we benchmarked k = 1, 3, 5, and 10 for all five models against the three CAFA5 test sets
      (no knowledge, limited knowledge, and partial knowledge) across all GO namespaces
    note: FANTASIA (NAR Genomics and Bioinformatics, September 2026), an embedding-based annotation
      transfer framework compared with the CAFA5 ProtT5 baseline.

lifecycle: active
lifecycle_basis:
  reason: CAFA 6 ran on Kaggle from 2025-10-15 to its final evaluation on 2026-06-01 with 2,259
    teams; the CAFA4 and CAFA5 reports appeared in 2026; and a September 2026 paper scores a new
    method on the CAFA5 test sets (as_used).
  source: src-kaggle-cafa-6-record
  quote: '"totalTeams":2259'
activity: between-rounds
activity_note: The hub page (last modified 2023-05-22) still announces CAFA 5; no CAFA 7 is
  announced in any source read. CAFA 6's optional free-text predictions are to be evaluated 9-12
  months after its deadline, and the CAFA5 report's final evaluation came 23 months after that
  edition's deadline, so a fuller CAFA 6 assessment may still follow the Kaggle ranking.
activity_basis:
  reason: CAFA runs in editions. CAFA 6's Kaggle submissions are closed and its final leaderboard
    has been verified, no standing leaderboard takes entries, and the next round has no announced
    date.
  source: src-kaggle-cafa-6-record
  quote: '"finalLeaderboardHasBeenVerified":true,"disableSubmissions":true'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GOLabeler (the top CAFA3 method)
    source: src-genomebiol-2019-cafa3
    observed_on: 2026-10-14
    quote: utilized 5 component classifiers trained from different features
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: experimental
ground_truth_source_note: Experimentally supported GO annotations (and, in CAFA3 and CAFA-π, the
  organisers' own genome-wide screens) that reach UniProt after the deadline. They do not exist in
  the database when predictions are locked, so the ground truth resolves over time.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The CAFA5 report releases its baselines and evaluation data and names the scorer, and the
    ground truth comes from public UniProt releases, so anyone can score a method on a closed
    edition's benchmark, as FANTASIA did on CAFA5's (as_used). Such a run is retrospective and
    cannot recreate the blind conditions of the round.
  source: src-biorxiv-2026-04-27-716980-v2
  quote: Baselines and evaluation data are available at https://doi.org/10.5281/zenodo.20186533.

task:
  exists: true
  input:
    - the amino-acid sequences of the target set (CAFA 6's test superset), with the organisers'
      training set of experimentally annotated proteins; any other data available before the
      deadline may be used
  output: A score in (0, 1] for each protein-GO term pair predicted (at most 1,500 terms a protein
    in CAFA 5 and 6), propagated to the ontology's root; in CAFA 6 optionally up to five lines of
    free text per protein.
  scoring: >
    Per GO aspect and knowledge setting, Fmax of precision and recall weighted by information
    accretion, computed on the proteins that gained experimental annotations after the deadline.
    The CAFA 6 headline averages the three aspects and then the no-knowledge, limited-knowledge and
    partial-knowledge settings; CAFA 5's averaged the aspects over no- and limited-knowledge targets.
    The reports add unweighted and micro-averaged Fmax and Smin.
  tests_hidden_from_system: true
  source: src-kaggle-cafa-6
  quote: Finally, the three F-measures from the three subtypes no-knowledge, limited-knowledge, and
    partial-knowledge will be combined again as an arithmetic mean to compute the final performance.

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_basis:
    reason: Kaggle requires accepting the competition rules before the data can be used, and the
      labels behind the score are not withheld by the organisers but come from public UniProt.
    source: src-kaggle-cafa-6-record
    quote: '"rulesRequired":true'
  access_by_phase:
    during_edition: The target set (test superset), training set, ontology and information-accretion
      weights are on Kaggle, downloadable after accepting the competition rules; the labels do not
      exist yet.
    after_edition: The ground truth is the experimental annotations in public UniProt releases.
      CAFA1 to CAFA4's target files are open downloads on the hub page, and the CAFA5 report put
      that edition's baselines and evaluation data on Zenodo; CAFA 6's competition data stay on
      Kaggle behind the rules.
    note: The current edition decides (the term's family rule). No source read here publishes CAFA
      6's benchmark files outside Kaggle.
  refresh: resolves-over-time
  refresh_note: Editions are the cadence ("held every three years", the Kaggle pages say; CAFA1
    2010-2011, CAFA2 2013-2014, CAFA3 2016-2017, CAFA-π 2017-2018, CAFA4 2019-2020, CAFA 5 2023,
    CAFA 6 2025-2026), each with a new target set. Within an edition the benchmark grows as
    annotations accrue, and the reports re-evaluate at later UniProt releases.
  refresh_basis:
    reason: Targets are posed before their experimental annotations exist and are scored as the
      annotations accrue, which takes precedence over the edition cadence.
    source: src-genomebiol-2019-cafa3
    quote: In CAFA1, we adopted a time-delayed evaluation method, where protein sequences that
      lacked experimentally verified annotations, or targets, were released for prediction.
  data_provenance:
    - curated-public-database
    - experimental-measurement
  data_provenance_note: Targets, training data and ground truth are selected from UniProtKB and its
    GO annotations, which biocurators compile from published experiments. experimental-measurement
    is for CAFA3 and CAFA-π, whose organisers ran genome-wide screens in Candida albicans and
    Pseudomonas aeruginosa that supplied benchmarks of their own.
  data_provenance_source: src-genomebiol-2019-cafa3
  data_provenance_quote: we performed experimental whole-genome mutation screening in Candida
    albicans and Pseudomonas aureginosa genomes
  contamination_risk: medium
  contamination_risk_note: >
    The protocol keeps annotations already in UniProt at the deadline out of the benchmark, and in
    CAFA3 the organisers deleted Candida albicans annotations that had been public in another
    database before the deadline. But the CAFA5 report found that only 3,627 of the 68,940
    annotations added after the deadline (5.3%) rest on papers published after it; the rest cite
    earlier papers or none, so much of what is scored was already in the literature. Mining it is
    allowed, since entrants may use any data
    available before the deadline; the organisers' stricter subset of post-deadline publications is
    an extra analysis, not the headline. No source shows that a ranked method was trained on the
    scored annotations themselves.
  contamination_evidence:
    - source: src-biorxiv-2026-04-27-716980-v2
      stance: supports
      quote: We found that only 3,627 annotations out of 68,940 unique annotations (5.3%) added to
        UniProt since t0 associated with CAFA target proteins had publications corresponding to
        dates after t0.
    - source: src-genomebiol-2019-cafa3
      stance: against
      quote: Since these annotations were already in the public domain before the CAFA3 submission
        deadline, we have deleted any annotation from Candida albicans with an assigned date prior
        to our CAFA3 submission deadline.
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Fmax is bounded at 1 (and Smin at 0). Annotations are incomplete, so a
    perfect predictor of a protein's true function would not reach 1 against them; no measured
    ceiling is published.
  ceiling_anchor_type_source: src-genomebiol-2019-cafa3
  ceiling_anchor_type_quote: The perfect prediction should have Fmax=1, at the top right corner of
    the plot.
  dataset_licence: Non-commercial and academic research use (the CAFA 6 competition data's terms)
  dataset_licence_note: CAFA 5's competition data were CC-BY-4.0 (src-kaggle-cafa-5); the change is
    in history. The ground truth itself is UniProt's.
  dataset_licence_source: src-kaggle-cafa-6
  dataset_licence_quote: Competition Use and Non-Commercial
  size:
    - count: 24405
      unit: proteins in the final evaluation set, with 234,529 annotations
      subset: CAFA 5, final evaluation on UniProt release 2025_03
      source: src-biorxiv-2026-04-27-716980-v2
      quote: After filtering, the final evaluation set consisted of 24,405 proteins and 234,529
        annotations.
    - count: 141865
      unit: target proteins
      subset: CAFA 5 target set
      source: src-biorxiv-2026-04-27-716980-v2
      quote: = 141,865 proteins was released
    - count: 97999
      unit: target proteins
      subset: CAFA4 target set
      source: src-biorxiv-2026-05-06-722942-v2
      quote: = 97,999) for the challenge
    - count: 866
      unit: benchmark proteins from 11 species
      subset: CAFA1
      source: src-natmethods-2013-cafa1
      quote: Methods were then evaluated on 866 targets from 11 species that had accumulated
        functional annotations during the waiting period
  submission_limit:
    max_submissions: 5
    period_days: 1
    per: team, in CAFA 6 (two final submissions selected for judging)
    source: src-kaggle-cafa-6

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CAFA organisers of the ISCB Function COSI, co-chaired from Iowa State University
    and Northeastern University
  maintainer_basis:
    reason: The Function Community of Special Interest conducts CAFA, which two co-chairs at
      different universities lead with co-organisers at the University of Padova and UniProt
      (EMBL-EBI). Iowa State University is the Kaggle competitions' sponsor and host.
    source: src-kaggle-cafa-6
    quote: The Function Community of Special Interest (Function-COSI) brings together computational
      biologists, experimental biologists, and biocurators
  maintainer_type: community-collective
  maintainer_type_note: No single institution is stated as CAFA's holder and no legal form is
    stated; the organisers come from several institutions and the hub belongs to the Function COSI.
    academic-lab (Iowa State University, the Kaggle sponsor) and conference-workshop (the COSI meets
    at ISMB) were considered; the co-chairs have run every edition, so the committee does not
    re-form.
  submission_process:
    - held-out-server
  submission_process_note: Entrants submit prediction files and the organisers score them against
    annotations that do not exist at submission. CAFA1 to CAFA4 took up to three models per team on
    the organisers' own system; CAFA 5 was a Kaggle code competition (submissions through
    notebooks); CAFA 6 took prediction files on Kaggle.
  submission_process_source: src-kaggle-cafa-6
  submission_process_quote: This is a prospective (i.e., future) data competition.
  independence_flags:
    - flag: no-known-conflict
      source: src-genomebiol-2019-cafa3
      quote: The authors declare that they have no competing interests.
  independence_flags_note: Searched for every flag on 2026-10-14. The CAFA5 report's support is an
    NIH award, and the Kaggle rules name Iowa State University as the Competition Sponsor of CAFA 5
    and CAFA 6, each with $50,000 in prizes. Kaggle, part of Google, hosted CAFA 5 and 6 and a
    Kaggle employee co-authors the CAFA5 report, but no Google system appears among the evaluated
    entrants in the sources read, and the rules let sponsor and Kaggle staff enter but not win
    prizes. Organisers co-author the reports with participants; no source shows an organiser's own
    method ranked. The ground truth is public, so single-evaluator-private-test-set does not apply.
  independence_assessed: true
  funding:
    source: src-biorxiv-2026-04-27-716980-v2
    quote: This CAFA challenge has been partially supported by the NIH award R01GM145937
  known_limitation:
    source: src-kaggle-cafa-6
    quote: the absence of evidence for a function cannot be considered the evidence for absence of
      that function

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: Scoring a fresh run is automatic, with the published scorer and public
    UniProt releases. A blind run needs the wait for annotations, and a past round's blindness
    cannot be recreated, which is live-world-state; as on ForecastBench, that blocker is not set
    beside this tier.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: CAFA-evaluator (cafaeval; BioComputingUP/CAFA-evaluator), and for CAFA 6 its
    partial-knowledge branch claradepaolis/CAFA-evaluator-PK, which the competition names
  harness_source: src-kaggle-cafa-6
  harness_quote: The evaluation code is available on this
  harness_gotcha:
    # The Kaggle headline is the weighted Fmax: run without the edition's IA file, the scorer reports
    # only the unweighted measures.
    source: src-github-cafa-evaluator-readme
    quote: If not provided, the weighted and S statistics are not generated.
  code_licence: GPL-3.0
  code_licence_note: GitHub's licence metadata for both BioComputingUP/CAFA-evaluator and
    claradepaolis/CAFA-evaluator-PK, read 2026-10-14; the README does not state it, so it is not a
    quoted fact.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the edition and the UniProt release it was scored on (scores move as
  # annotations accrue; the CAFA4 and CAFA5 reports each evaluate at five releases), and what the method
  # was trained on (any data before the deadline is allowed, and a retrospective run on a closed edition
  # may have seen the answers). subset_used (aspect, knowledge setting, weighted or unweighted, micro or
  # macro Fmax) comes from the fallback.
  material_extra:
    - resolution_window
    - training_data_policy
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The Kaggle ranking figure is the organisers' arithmetic mean of the per-aspect weighted
    Fmax values and, in CAFA 6, of the three knowledge settings; the reports give each aspect and
    setting separately.
  source: src-kaggle-cafa-6
  quote: Finally, the three F-measures from the three subtypes no-knowledge, limited-knowledge, and
    partial-knowledge will be combined again as an arithmetic mean to compute the final performance.

homepage: https://biofunctionprediction.org/cafa/
repository: https://github.com/BioComputingUP/CAFA-evaluator
dataset_url: https://www.kaggle.com/competitions/cafa-6-protein-function-prediction/data
leaderboard_url: https://www.kaggle.com/competitions/cafa-6-protein-function-prediction/leaderboard


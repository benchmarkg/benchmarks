lineage_note: GUE+ is a subset tree brought in by the v2 track-set version, not a variant or fork
  (header and the first review check). BEND (bend) is a separate benchmark by another group with no
  derivation either way. GUE's yeast epigenetic-mark datasets are shared with the Nucleotide
  Transformer benchmark, which is not catalogued; no correlation was measured.


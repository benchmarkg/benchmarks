  sources_note: >
    The paper's v2 and v1 PDFs (DOIs, not archived) read as text and compared for the version change,
    with the e-mail addresses on their first pages kept out; its abstract page for the dates and the ICLR
    comment, with the submitter line kept out; the README, LICENSE and run_dnabert2.sh at commit f25bed9
    (pending archive); GitHub's API record of the MAGICS-LAB organisation (pending archive) and of commit
    d87d29f (withheld: it names the author); the Drive page of GUE_v2.zip (withheld: its embedded data
    name the owner's address); and ILNN's v1 PDF as evidence of current use. GitHub's API was also read
    for the repository's creation date, last push and licence and for the files' last commits, and is
    not kept as a Source. The OpenReview record returned 403, and the archive itself was not downloaded.
  confidence: medium
  review_checks:
    - check: GUE+ is modelled as subsets (gue#gue-plus and two children) introduced by a track-set
        version, not as a variant or a separate benchmark. The same authors ship it in the same
        paper, repository and archive, and it has no name or version line of its own, which is the
        04 S4 test for a subset. But it was added nine months after first release, with new tasks
        rather than new items for old ones, and is reported apart; if it is ever cited or versioned
        on its own, a Variant on lineage would fit better.
      field: versions
      source: src-arxiv-2306-15006-v2
      quote: 'Due to the input length limits of existing genome foundation models, we split the benchmark
        into two parts: GUE and GUE+.'
    - check: The GUE+ data were in the README's download only from 2025-08-14 (the commit that
        switched GUE.zip for GUE_v2.zip), 17 months after the paper announced them; whether they
        were public elsewhere before, and whether GUE_v2.zip changed any of the 28 GUE datasets, was
        not checked, because the archive was not downloaded.
      field: versions
      source: src-github-api-dnabert-2-commit-d87d29f
      quote: '"date":"2025-08-14T19:54:59Z"},"message":"include GUE+ datasets"'
    - check: "Overlap with bend, the leaf's other DNA language model entry: no shared dataset was found.
        BEND is human-only (GRCh38), keeps the LM frozen and probes it with a small CNN, runs to 100 kbp
        and includes variant-effect tasks; GUE is multi-species, fine-tunes the whole model (LoRA for
        NT), stays at 70-1,000 bp (10 kbp in GUE+) and has no variant-effect task. Both draw on ENCODE
        ChIP-seq, BEND for histone marks and accessibility in human cell lines, GUE for transcription
        factor peaks, and GUE's histone task is yeast. On what was read they are complementary rather
        than near-duplicates; whether a paper reporting both should count once or twice is for the reviewer."
      field: lineage
    - check: The yeast epigenetic-mark datasets are the one task GUE shares with the Nucleotide
        Transformer benchmark, re-split 8:1:1 for GUE; scores on the two are not comparable, and if
        the NT benchmark is catalogued it needs a correlates_with or overlap note.
      field: subsets
      source: src-arxiv-2306-15006-v2
      quote: We select the epigenetic marks prediction task for benchmarking since it is the only
        shared task among Dalla-Torre et al. (2023) and GUE.
    - check: The task and species counts disagree within the paper. Table 1 has seven GUE tasks on
        human, mouse, yeast and virus, while the text lists human, fungi, virus and yeast as the
        four species; Table 2 has two GUE+ tasks (with species classification once for two species)
        where Table 5 says three, and 7 + 3 is not the stated 9. data.size uses the dataset counts,
        which agree (28 + 8 = 36).
      field: data.size
      source: src-arxiv-2306-15006-v2
      quote: averaged performance on the 3 tasks in the GUE+ benchmark, including 6 Enhance Promoter
        Interaction (EPI) datasets and two Species Classification (SC) datasets on virus and fungi.
    - check: The paper averages three seeds, but the released run_dnabert2.sh loops over one seed
        (42), so a user running the scripts as given does not reproduce the paper's protocol; the
        harness is material in comparability for this reason.
      field: comparability
      source: src-github-dnabert-2-run-script
      quote: for seed in 42
    - check: compute_tier is multi-gpu-node on the README's four-GPU script setting. The README says
        to rescale the batch for other GPU counts and the paper says DNABERT-2 fine-tunes on
        consumer GPUs, while NT-2.5B needed LoRA; single-gpu may describe a typical run better.
      field: execution.compute_tier
      source: src-arxiv-2306-15006-v2
      quote: It is important to note that NT models are 6 to 29 times larger than DNABERT, which
        precludes standard model fine-tuning on consumer GPUs.
    - check: dataset_licence is null. The Covid task redistributes SARS-CoV-2 sequences from GISAID
        EpiCoV, whose terms of use were not read; whether a public archive of those sequences is
        compatible with them, and whether the task should carry a licence-restriction blocker, needs
        a reviewer who reads GISAID's terms.
      field: data.dataset_licence
      source: src-arxiv-2306-15006-v2
      quote: We download the genomes from the EpiCoV database (Khare et al., 2021) of the Global
        Initiative on Sharing Avian Influenza Data (GISAID).
    - check: maintainer_type academic-lab rests on the MAGICS-LAB organisation account. The v1
        repository path was in the first author's personal account, and the data archive is a Drive
        file in a personal account, so individual is arguable if the archive is the benchmark as
        distributed.
      field: governance.maintainer_type
      source: src-github-api-magics-lab-org
      quote: '"description":"Northwestern University MAGICS Labs"'
    - check: Splice site prediction and the taxon tasks (Covid variants, species) fit no domain
        leaf; logged as failures 2026-11-05-gue-001 (genome-annotation, the term ADR-0020 deferred
        for want of GUE-like corpus evidence) and 2026-11-05-gue-002 (sequence taxonomic
        classification).
      field: domain
    - check: ILNN, the current-use evidence, reports seven GUE datasets chosen where an earlier
        model did poorly rather than the 28-dataset average, so a cited "GUE" score may mean a

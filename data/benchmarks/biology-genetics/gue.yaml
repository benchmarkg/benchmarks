# data/benchmarks/biology-genetics/gue.yaml
#
# P1-S5-T06, biology-genetics entry 24. Filled from the DNABERT-2 paper, which introduces GUE, arXiv 2306.15006 read
# as its v2 PDF (2024-03-18, the ICLR 2024 version and the first with GUE+), its v1 PDF (compared for what GUE held
# at first release) and its abstract page; the repository README, LICENSE and GUE evaluation script at commit
# f25bed9 (2026-01-01, the head of main); GitHub's API records of the MAGICS-LAB organisation and of commit d87d29f,
# which pointed the download at the archive with GUE+; the Google Drive page of that archive; and the Intrinsic
# Lorentz Neural Network paper (arXiv 2602.23981, v1 PDF, ICLR 2026) as evidence of current use. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# The OpenReview record (forum oMLQB4EZE1, ICLR 2024 poster, found by OpenReview's search API) returned HTTP 403 to
# every later request on 2026-11-05 and was not read. The data archive (GUE_v2.zip) was not downloaded, so its
# contents are the paper's and the commit's word. There is no corpus classification record and no Epoch stub for
# this id.
#
# GUE+ is modelled as a subset tree (gue#gue-plus) brought in by a track-set version (v2), not as a variant: the same
# authors ship it in the same paper, repository and archive, and it carries no name or version line of its own (04 S4;
# see versions, subsets and the first review check).

id: gue
name: GUE
aliases:
  - Genome Understanding Evaluation
  - GUE+
  - Genome Understanding Evaluation Plus
tagline: 'Genome-sequence classification for fine-tuned DNA foundation models: 28 datasets in GUE, 8 long-input
  in GUE+.'
description: >
  A benchmark for genome foundation models introduced with DNABERT-2 by Northwestern University's MAGICS
  lab and Stony Brook University (ICLR 2024). GUE has 28 datasets in seven sequence classification tasks
  on four genomes, with inputs of 70 to 1,000 bp: human core promoter and promoter detection (TATA, non-TATA
  and all, from EPDnew), human and mouse transcription factor binding (five ENCODE ChIP-seq datasets each),
  human splice site prediction (a reconstructed dataset with adversarial negatives), yeast epigenetic
  marks (ten histone datasets) and SARS-CoV-2 variant classification (nine lineages, from GISAID). GUE+,
  added in the paper's second version, holds eight longer-input datasets (5,000 to 10,000 bp): six human
  enhancer-promoter interaction datasets and fungal and viral species classification. Datasets were kept
  or reworked (class balancing, adversarial samples, fewer training samples) until existing models scored
  moderately on them. Every dataset has fixed train, validation and test splits; the pretrained model
  is fine-tuned on each training set, the checkpoint with the lowest validation loss is scored on the
  test set, and scores are MCC for every task except Covid variants (F1), averaged over three seeds. The
  paper reports each model's average over the 28 GUE datasets and reports GUE+ apart. There is no leaderboard;
  users run the repository's fine-tuning scripts and report in their own papers.
self_description:
  source: src-arxiv-2306-15006-v2
  quote: a standardized and comprehensive multi-species benchmark containing 36 datasets across 9
    important genome analysis tasks on genomes of 4 species with input lengths ranging from 70 to
    10000.
external_ids:
  arxiv: '2306.15006'
paper:
  title: 'DNABERT-2: Efficient Foundation Model and Benchmark For Multi-Species Genomes'
  arxiv: '2306.15006'
  version_read: v2
  source: src-arxiv-2306-15006-v2
released: 2023-06-26
released_note: The paper's first arXiv version, as its abstract page dates it, which already held
  the 28 GUE datasets; GUE+ followed in v2 (2024-03-18). The ICLR 2024 proceedings version has no
  DOI of its own (the arXiv DOI is on the Sources); the repository was created on 2023-06-23 (GitHub
  API).
released_source: src-arxiv-2306-15006
released_quote: Submitted on 26 Jun 2023 (v1), last revised 18 Mar 2024 (this version, v2)
release_venue: ICLR 2024
release_venue_source: src-arxiv-2306-15006
release_venue_quote: 'Comments: Accepted by ICLR 2024'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/regulatory-genomics
  secondary: []
domain_basis:
  reason: Five of GUE's seven tasks, 26 of its 28 datasets (core promoter and promoter detection,
    human and mouse transcription factor binding, yeast epigenetic marks), predict regulatory state
    from genomic sequence, the primary leaf's definition and the majority (ADR-0016), and so do six
    of GUE+'s eight (enhancer-promoter interaction). Splice site prediction and the taxon tasks
    (Covid variants, species) fit no leaf and are left out of the list (failures 2026-11-05-gue-001
    and -002).
  source: src-arxiv-2306-15006-v2
  quote: We accessed the legacy 690 ENCODE ChIP-seq experiments (Consortium et al., 2012) via the
    UCSC genome browser
domain_considered_and_rejected:
  - term: biology-genetics/genomics-variant-effect
    reason: Covid variant classification assigns a SARS-CoV-2 genome segment to one of nine
      lineages; "variant" there is a viral lineage, not a genetic variant whose consequence is
      predicted, so the leaf's definition does not apply (failure 2026-11-05-gue-002).
    source: src-arxiv-2306-15006-v2
    quote: We consider 9 types of SARS_CoV_2 variants, including Alpha, Beta, Delta, Eta, Gamma,
      Iota, Kappa, Lambda and Zeta.
  - term: biology-genetics/phylogenetics
    reason: The Covid and species tasks classify a segment into a fixed label set and infer no
      evolutionary relationship or tree; the leaf is also kept deliberately empty in this family
      (P1-S5-T06).
  - term: biology-genetics/transcriptomics
    reason: No task takes expression measurements as input; every input is DNA or viral RNA genome
      sequence.
  - term: medicine-health/diagnosis-triage
    reason: The Covid task labels viral lineages from sequence; no patient, case or clinical outcome
      is scored, which the biology-genetics family's exclusion test keeps here.
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: Each dataset predicts a biological state of a sequence (promoter, binding site, splice
      site, histone mark, lineage, species, enhancer-promoter pairing) and scores it against
      database or experimental labels. The benchmark's claim is about genome foundation models'
      understanding, which here is measured after fine-tuning on each task's training set.
    source: src-arxiv-2306-15006-v2
    quote: We explicitly define evaluation metrics for each task and split each dataset into
      training, validation, and test data for a fair comparison across different models.
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The paper speaks of multi-species transferability, but every dataset is fine-tuned on
      its own training split and scored on the same task and species; no model is trained on one
      species and scored on another, and transfer from pre-training is not a reported condition.
    source: src-arxiv-2306-15006-v2
    quote: this benchmarks contains tasks for various species, including human, fungi, virus, and
      yeast.
  - term: distribution-shift-generalization
    reason: Test sets are random splits of each dataset (8:1:1 for the yeast marks), not a
      deliberately shifted condition reported as its own score.
    source: src-arxiv-2306-15006-v2
    quote: randomly split each dataset into training, validation, and test sets with a ratio of
      8:1:1.
  - term: context-integration
    reason: GUE+ exists for long inputs (5,000 to 10,000 bp), but the long sequence is the input
      itself, not supplied material whose use is scored apart from it.

evaluation_method:
  - classification-metric
evaluation_method_basis:
  reason: Eight of the nine task types are scored by MCC and Covid variant classification by F1,
    each on the dataset's test split; the headline averages these over the 28 GUE datasets.
  source: src-arxiv-2306-15006-v2
  quote: Metric mcc mcc mcc mcc mcc mcc f1 mcc mcc
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The 28-dataset average combines MCC and F1, but both are confusion-matrix statistics of
      one method, which composite's exclusion leaves out.
  - term: domain-metric
    reason: MCC and F1 are general classification statistics, which the domain-metric exclusion
      sends to classification-metric.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are genome foundation models pretrained on DNA (DNABERT, Nucleotide
    Transformer, DNABERT-2), fine-tuned per dataset; the datasets were calibrated against them.
  source: src-arxiv-2306-15006-v2
  quote: 'We compare DNABERT-2 with two state-of-the-art genome foundation models: DNABERT (Ji et al.,
    2021) and Nucleotide Transformer (Dalla-Torre et al., 2023).'
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: Models trained from scratch are run on GUE (the paper's appendix CNN, and the ICLR 2026
      hyperbolic network in as_used), but the benchmark is built and calibrated for pretrained
      foundation models, and the term's exclusion sends a discipline's own task to
      domain-specialist-model.
    source: src-arxiv-2602-23981-v1
    quote: We evaluate on the most challenging subsets of the TEB and GUE genomics benchmarks,
      specifically those on which the published HCNN (Khan et al., 2025) does not surpass a
      Euclidean convolutional baseline.
  - term: scientific-surrogate-model
    reason: The models do not stand in for an assay or a simulation run; they are classifiers scored
      against labels.

as_used:
  - protocol: A hyperbolic network trained from scratch on seven GUE datasets (core promoter and
      promoter detection, three each, and Covid variant classification), with the official splits
      and MCC, against Euclidean and hyperbolic baselines; the datasets were chosen as those on
      which an earlier hyperbolic CNN did not beat a Euclidean one.
    source: src-arxiv-2602-23981-v1
    quote: we adopt the official train/validation/test splits and report the Matthews correlation
      coefficient (MCC) as our primary metric.
    note: Intrinsic Lorentz Neural Network (ICLR 2026). A subset of the 28, with no foundation model
      and no 28-dataset average.

lifecycle: active
lifecycle_basis:
  reason: New models are still scored on GUE's datasets with its splits; an ICLR 2026 paper reports
    results on seven of them. The repository was last pushed on 2026-01-01 (a README update, GitHub
    API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2602-23981-v1
  quote: Extensive experiments conducted on CIFAR-10/100 and two genomic benchmarks (TEB and GUE)
activity: no-submission-channel
activity_basis:
  reason: The README offers the data and fine-tuning scripts and shows the paper's results as a
    figure, with no leaderboard, server or submission route, and no source shows one ever existed.
  source: src-github-dnabert-2-readme
  quote: 'Statistics and model performances on GUE is shown as follows:'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DNABERT-2 (117M parameters)
    source: src-arxiv-2306-15006-v2
    observed_on: 2026-11-05
    quote: Through comprehensive experiments on the GUE benchmark, we demonstrate that DNABERT-2
      achieves comparable performance to the state-of-the-art model
  - system: Intrinsic Lorentz Neural Network (ILNN)
    source: src-arxiv-2602-23981-v1
    observed_on: 2026-11-05
    quote: whereas ILNN matches and slightly surpasses the Euclidean score (64.8 vs. 63.6).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: experimental
ground_truth_source_note: Mixed. Transcription factor binding and the yeast histone marks are ChIP
  readouts (ENCODE via the UCSC browser for human and mouse); promoters come from EPDnew, splice
  sites from Ensembl's GRCh38 annotation, Covid lineages from GISAID EpiCoV records and species from
  GenBank reference genomes, which are curated labels. Negatives are constructed (random or
  substituted sequences, GC-matched sequences, dinucleotide shuffles, adversarial false positives).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The datasets with their splits are a public download, and the repository holds the
    fine-tuning code and per-model scripts for the 28 GUE datasets.
  source: src-github-dnabert-2-readme
  quote: Please first download the GUE dataset from
    [here](https://drive.google.com/file/d/1uOrwlf07qGQuruXqGXWMpPn8avBoW7T-/view?usp=sharing). Then
    run the scripts to evaluate on all the tasks.

task:
  exists: true
  input:
    - a DNA (or SARS-CoV-2 genome) sequence of 70 to 1,000 bp for GUE, or 5,000 to 10,000 bp for
      GUE+, as a csv row of sequence and label
    - for enhancer-promoter interaction, a pair of sequences
  output: A class label per sequence (binary for most datasets; three for splice sites, nine Covid
    lineages, 25 fungal or 20 viral species), predicted by the pretrained model after fine-tuning on
    the dataset's training split.
  scoring: Per dataset, MCC (F1 for Covid variant classification) on the test split, from the
    checkpoint with the lowest validation loss, averaged over three seeds; the headline is the
    average over the 28 GUE datasets, with GUE+ reported apart.
  source: src-arxiv-2306-15006-v2
  quote: save the model that yields the smallest loss on the validation set, and report its
    evaluation results on the test set.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The datasets, splits included, are one zip archive on a public Google Drive link from
      the README, with no sign-in or terms.
    source: src-github-dnabert-2-readme
    quote: Please first download the GUE dataset from
      [here](https://drive.google.com/file/d/1uOrwlf07qGQuruXqGXWMpPn8avBoW7T-/view?usp=sharing).
      Then run the scripts to evaluate on all the tasks.
  refresh: versioned-releases
  refresh_basis:
    reason: The one change found to the content came with a dated paper version (v2 added GUE+) and
      a dated commit that moved the download to an archive labelled v2. Neither changed the 28 GUE
      datasets, whose scores are identical in both paper versions (versions).
    source: src-github-api-dnabert-2-commit-d87d29f
    quote: '"date":"2025-08-14T19:54:59Z"},"message":"include GUE+ datasets"'
  data_provenance:
    - curated-public-database
    - experimental-measurement
    - inherited-from-constituents
  data_provenance_note: GUE generated no data of its own. Promoters come from EPDnew, splice sites
    from Ensembl GRCh38, Covid genomes from GISAID EpiCoV and species genomes from GenBank
    (curated-public-database). Human and mouse binding sites are ENCODE ChIP-seq peaks, and the
    yeast marks histone ChIP data (experimental-measurement). The splice task rebuilds a published
    dataset (Wang et al., 2019) and the ten yeast datasets are a published set that the Nucleotide
    Transformer benchmark also uses (inherited-from-constituents). Negative classes are constructed
    by rule (random substitution, GC matching, dinucleotide shuffling), which is recorded here
    rather than as synthetic-procedural.
  data_provenance_source: src-arxiv-2306-15006-v2
  data_provenance_quote: We download the genomes from the EpiCoV database (Khare et al., 2021) of
    the Global Initiative on Sharing Avian Influenza Data (GISAID).
  contamination_risk: medium
  contamination_risk_note: The test splits and labels are public, and the evaluated models are
    pretrained self-supervised on genomes (DNABERT-2 on 135 species including human and mouse, NT on
    850 species) that contain the test sequences, though not their labels. The paper also reports
    DNABERT-2 further pre-trained on the combined GUE training sets (training splits only, no labels
    used by the masked-language objective). No source evidences or assesses a route into the test
    labels.
  contamination_risk_source: src-arxiv-2306-15006-v2
  contamination_risk_quote: We combine the training sets of the 28 GUE datasets and further
    pre-train DNABERT-2 on this combined set.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: MCC and F1 are bounded at 1 (the paper reports them times 100), and no
    human, expert-method or measured ceiling is published. The calibration step kept datasets on
    which 2023 models scored moderately, so the bound is far from current scores by design.
  ceiling_anchor_type_basis:
    reason: The headline metrics are bounded statistics of predicted labels against true labels.
    source: src-arxiv-2306-15006-v2
    quote: To measure model performance, we utilize F1-Score and Matthews Correlation Coefficient
      (MCC).
  dataset_licence: null
  dataset_licence_note: No licence for the datasets is stated in the paper, the README or on the
    Drive page. The repository's Apache-2.0 licence covers its files, and the archive is not in the
    repository. The Covid sequences come from GISAID EpiCoV, whose terms of use were not read
    (review_checks).
  upstream_licences: The terms of EPDnew, ENCODE and the UCSC browser, Ensembl, GenBank, GISAID
    EpiCoV, the yeast nucleosome dataset site and Wang et al. (2019) apply to the data they
    supplied; none was read.
  upstream_licences_source: src-arxiv-2306-15006-v2
  upstream_licences_quote: We download the genomes from the EpiCoV database (Khare et al., 2021) of
    the Global Initiative on Sharing Avian Influenza Data (GISAID).
  size:
    - count: 28
      unit: datasets in 7 tasks (GUE)
      source: src-arxiv-2306-15006-v2
      quote: GUE (See Table 1) includes 7 genome sequence classification problems with 28 datasets
        with input lengths ranging from 70 to 1000.
    - count: 8
      unit: datasets (GUE+; 6 enhancer-promoter interaction, 1 fungal and 1 viral species)
      subset: GUE+
      source: src-arxiv-2306-15006-v2
      quote: Species Human Fungi Virus Task Enhancer Promoter Interaction Species Classification
        Species Classification Num. Datasets 6 1 1 Num. Classes 2 25 20 Sequence Length 5000 5000
        10000
    - count: 36
      unit: datasets in 9 tasks (GUE and GUE+)
      source: src-arxiv-2306-15006-v2
      quote: we propose the Genome Understanding Evaluation, a comprehensive multi-species genome
        classification dataset that amalgamates 36 distinct datasets across 9 tasks, with input
        lengths ranging from 70 to 10000.
    - count: 7000
      unit: test sequences (77,669 train, 7,000 validation)
      subset: Covid variant classification
      source: src-arxiv-2306-15006-v2
      quote: 77669 / 7000 / 7000
    - count: 4562
      unit: test sequences (36,496 train, 4,562 validation)
      subset: splice site prediction
      source: src-arxiv-2306-15006-v2
      quote: 36496 / 4562 / 4562
    - count: 5920
      unit: test sequences in the "all" dataset (47,356 train, 5,920 validation), the union of the
        TATA and non-TATA datasets
      subset: promoter detection, and core promoter detection with the same counts
      source: src-arxiv-2306-15006-v2
      quote: 47356 / 5920 / 5920
  size_note: Split sizes are Table 12's. The headline counts datasets, not sequences, because the
    datasets differ by three orders of magnitude (1,904 to 77,669 training sequences) and the "all"
    promoter datasets repeat the TATA and non-TATA ones. The abstract's "4 species" is Table 1's
    human, mouse, yeast and virus; with GUE+'s fungi there are five (review_checks).

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The DNABERT-2 authors at Northwestern University's MAGICS lab (with Stony Brook
    University), in the lab's GitHub organisation
  maintainer_basis:
    reason: The repository that publishes GUE and its scripts sits in the MAGICS-LAB organisation,
      which describes itself as Northwestern University's MAGICS lab; the paper gives the repository
      as the home of the code and data.
    source: src-github-api-magics-lab-org
    quote: '"description":"Northwestern University MAGICS Labs"'
  maintainer_type: academic-lab
  maintainer_type_note: The repository is in a university lab's organisation account, which the
    holder rule reads as academic-lab. The paper's v1 gave a repository path in the first author's
    personal account, which now redirects to the organisation, and the data archive is a Google
    Drive file in a personal account; individual is the alternative if the archive is taken as the
    benchmark as distributed (review_checks).
  submission_process:
    - literature-only
  submission_process_note: The paper's tables are the only maintainer result set, repeated as a
    figure in the README; others fine-tune with the scripts and report in their own papers.
  submission_process_source: src-github-dnabert-2-readme
  submission_process_quote: 'Statistics and model performances on GUE is shown as follows:'
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2306-15006-v2
      quote: Through comprehensive experiments on the GUE benchmark, we demonstrate that DNABERT-2
        achieves comparable performance to the state-of-the-art model
  independence_flags_note: GUE was introduced to evaluate the authors' own model, DNABERT-2, which
    is ranked on it with third-party models, and its further pre-trained variant tops the average.
    The datasets were selected by how existing models, DNABERT and Nucleotide Transformer, scored on
    them. Funding is from the NIH, which has no evaluated model, so funded-by-evaluated-party does
    not apply.
  independence_assessed: true
  funding:
    source: src-arxiv-2306-15006-v2
    quote: This work is supported by NIH R01LM01372201.
  known_limitation:
    source: src-arxiv-2306-15006-v2
    quote: Datasets where the majority of models yielded moderate (e.g., F1-scores between 0.3 and
      0.8) and distinguishable performance scores were retained.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: multi-gpu-node
  compute_tier_basis:
    reason: Every model must be fine-tuned on every dataset, so the evaluation itself needs
      accelerators. The maintainers' reference scripts are set for four GPUs in one machine, though
      the README says to adapt the per-device batch to other GPU counts, and the paper says
      DNABERT-2 fine-tunes on consumer GPUs (review_checks). Pre-training the entrant is excluded.
    source: src-github-dnabert-2-readme
    quote: Current script is set to use `DataParallel` for training on 4 GPUs.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Data and splits are public and the repository's scripts fine-tune and score every GUE
      dataset, with no human, physical or maintainer-only step.
    source: src-github-dnabert-2-readme
    quote: sh scripts/run_dnabert2.sh DATA_PATH
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The DNABERT-2 repository's finetune/train.py with scripts/run_dnabert2.sh,
    run_dnabert1.sh (by k-mer) and run_nt.sh (by NT variant) over the 28 GUE datasets; no script
    covers GUE+.
  harness_source: src-github-dnabert-2-readme
  harness_quote: sh scripts/run_dnabert2.sh DATA_PATH
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for MAGICS-LAB/DNABERT_2 also reports Apache-2.0
    (read 2026-11-05).
  code_licence_source: src-github-dnabert-2-license
  code_licence_quote: Apache License Version 2.0, January 2004
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the harness, because the paper fine-tunes DNABERT and DNABERT-2 fully but NT with
  # LoRA, fixes hyperparameters across datasets and averages three seeds while the released script runs one; and the
  # training-data policy, because the paper's best figure (DNABERT-2 further pre-trained on the GUE training sets) is
  # a different condition from the plain model. subset_used, the floor, carries GUE against GUE+ and the many papers
  # that report a handful of the 28 datasets.
  material_extra:
    - harness
    - training_data_policy
aggregation_policy: official-aggregate
aggregation_policy_note: The headline is the unweighted average of the 28 GUE datasets' scores (MCC,
  with F1 for Covid), beside a count of top-two placings; the paper also gives per-task averages.
  GUE+ is reported per dataset and is not in the average.
aggregation_policy_basis:
  reason: The paper's Table 3 ranks the models by that average.
  source: src-arxiv-2306-15006-v2
  quote: the average evaluation scores on the 28 datasets of the GUE benchmark


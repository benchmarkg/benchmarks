# data/benchmarks/biology-genetics/protein-engineering-tournament.yaml
#
# P1-S5-T05, biology-genetics entry 16. Filled from the pilot results paper (Proteins 93:2005-2014, 2025,
# CC BY), read as Europe PMC's full-text XML of the version of record; the 2023 design paper (arXiv
# 2309.09955v2); the pilot data repository's README pinned at commit 06dd2e0; four Align Foundation pages
# (Benchmarks, the 2023 Amylase Benchmark, the 2025 PETase Tournament page from its last Wayback capture,
# and the October 2025 announcement), each with scripts and styles stripped; the Align data portal's
# Protein Tournament page; the organisers' 2026 Zenodo report on the assays built for the 2025 edition; and
# a 2026 Molecular Systems Biology paper for current use. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The editions are rows in versions[] with version_kind: edition, as casp.yaml and cagi.yaml hold their
# rounds, and the evidence for each is the organisers' own paper or page rather than a live board.

id: protein-engineering-tournament
name: Protein Engineering Tournament
aliases:
  - 2023 Amylase Benchmark
  - 2025 PETase Tournament
tagline: Biennial open-science competition in which teams predict enzyme properties, then design
  variants the lab assays.
description: >
  The Protein Engineering Tournament, run by the Align Foundation (Align to Innovate), a nonprofit, as
  a CASP-like community benchmark for protein function rather than structure. Each edition has two phases.
  In the predictive phase, teams receive protein sequences and predict biophysical properties -- specific
  activity, thermostability, soluble expression -- in a zero-shot track with no training data and a supervised
  track with a provided training set; predictions are scored against withheld measurements. Top teams
  advance to the generative phase, where they submit ranked lists of designed sequences that the organisers
  and their wet-lab partners synthesise, express and assay, and the ranking is made from what the assays
  return. The 2023 pilot ran six donated enzyme datasets (alpha-amylase, aminotransferase, imine reductase,
  alkaline phosphatase PafA, beta-glucosidase B, xylanase) as seven predictive events scored by Spearman
  correlation and one generative event on alpha-amylase, whose ~1,200 designed variants were characterised
  by International Flavors and Fragrances; 28 teams registered, seven submitted predictions, and TUM Rostlab
  won overall. The 2025 edition targets PETase, scores the predictive phase by NDCG against experimental
  rankings and the generative phase by the change in measured specific activity against a benchmark enzyme
  subject to expression thresholds, and reports more than 290 registered teams. All data, submissions
  and analysis scripts of a finished edition are released publicly. Known weaknesses the sources name:
  in the pilot, how far a team built on the donor's prior engineering mattered more than which model it
  used, and only two teams kept more than half their designs inside the stability and expression criteria.
self_description:
  source: src-alignbio-2025-petase-tournament
  quote: The Protein Engineering Tournament is a global benchmarking initiative hosted by The Align
    Foundation.
external_ids:
  arxiv: '2309.09955'
paper:
  title: 'Results of the Protein Engineering Tournament: An Open Science Benchmark for Protein Modeling
    and Design'
  arxiv: '2309.09955'
  doi: 10.1002/prot.70008
  source: src-proteins-2025-pet-results
paper_note: Two papers. The Proteins version of record (2025-06-23, CC BY 4.0) reports the pilot's
  structure and results and is the entry's primary source; arXiv 2309.09955 (v2, 2023-09-19, CC BY
  4.0) is the earlier design paper that proposed the Tournament, cited here for the rules it set
  out. The pilot results also exist as bioRxiv 2024.08.12.606135, which was not read.
released: 2023-05-01
released_note: The data portal dates the pilot's launch. The design paper that proposed the
  Tournament was posted in September 2023, after the pilot had started.
released_source: src-alignbio-data-protein-tournament
released_quote: The pilot tournament launched on May 1st, 2023 with the theme of Enzyme Design

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/protein-design
  secondary:
    - biology-genetics/protein-fitness-prediction
  secondary_basis:
    reason: The predictive phase of every edition is a protein-fitness-prediction task, in which
      teams score the activity, stability or expression of enzyme variants from sequence and are
      ranked against the measured values. It is the larger half by event count (seven of eight
      events in the pilot), and the primary term is chosen for the phase that decides the Tournament
      rather than the one with more events.
    source: src-proteins-2025-pet-results
    quote: In the predictive round, participants engaged in seven events distributed across two
      unique tracks
  per_edition: false
  per_edition_note: Both editions on record run the same two phases on a different enzyme family, so
    the terms do not change between them.
domain_basis:
  reason: The phase that produces the Tournament champion asks teams to generate novel protein
    sequences satisfying a functional specification -- maximise activity while holding stability and
    expression above a threshold -- and scores them on what the wet lab measures.
  source: src-proteins-2025-pet-results
  quote: In the generative round, teams were tasked with using their computational models to propose
    novel enzyme designs that exhibited enhanced functional properties.
domain_considered_and_rejected:
  - term: chemistry-materials/experimental-hit-finding
    reason: The structure matches the term closely -- candidates are nominated, synthesised and
      assayed, and the assay result is the score -- but what is nominated is a protein, not a
      compound, and both family exclusion tests put a scored protein in biology-genetics. CACHE is
      the term's near-miss example for the same shape with small molecules.
    source: src-alignbio-benchmarks
    quote: Teams design new protein sequences with desired traits. Designs are synthesized, tested
      in vitro, and ranked based on experimental performance.
capability:
  - scientific-prediction
  - optimization
capability_basis:
  scientific-prediction:
    reason: The predictive phase asks for biophysical properties of given sequences and scores them
      against the withheld experimental measurements.
    source: src-proteins-2025-pet-results
    quote: the teams were tasked with developing models for predicting biophysical properties of
      given protein sequences
  optimization:
    reason: The generative phase states an objective -- maximum specific activity subject to
      stability and expression thresholds -- and ranks teams by the measured value of that
      objective.
    source: src-proteins-2025-pet-results
    quote: Submit a list of up to 200 Amino Acid Sequences that maximize enzyme activity while
      maintaining 90% stability and expression of the parent sequence.
capability_considered_and_rejected:
  - term: constraint-satisfaction
    reason: The stability and expression thresholds are hard gates, and a variant that misses either
      is dropped before ranking. But the surviving variants are ranked by degree of activity, not
      pass or fail, and the organisers' own claim is maximisation under thresholds, so optimization
      is tagged instead.
    source: src-proteins-2025-pet-results
    quote: Only two teams, MediumBio and SergiR1996, achieved more than 50% success rate of screened
      variants passing the expression and stability criteria.
  - term: creativity-novelty
    reason: Designs are novel sequences, but nothing scores novelty; the pilot found the best
      designs were within a few mutations of the donor's own best variant, and distance from
      wildtype was reported rather than rewarded.
    source: src-proteins-2025-pet-results
    quote: the choice to build on top of IFF's prior engineering, and the number of mutations
      introduced (Figure 4A,B), was a stronger indicator of team performance than the base model
      used.
  - term: experimental-design
    reason: The organisers develop the assays, and their 2026 report assesses three assay platforms,
      but that work is theirs, not the entrants'; no team is scored on a protocol.
    source: src-zenodo-19832225
    quote: we systematically developed and evaluated three independent assay platforms against key
      criteria of data quality, scalability, and industrial relevance.

evaluation_method:
  - wet-lab-validation
  - statistical-fit
  - classification-metric
  - entrant-relative-ranking
evaluation_method_note: classification-metric rests on the pilot's one classification event ("The
  Xylanase event was analyzed using a weighted F1 score because it was a classification task",
  src-proteins-2025-pet-results). The 2025 edition replaces Spearman with NDCG in the predictive
  phase, which is still a rank statistic against measured values.
evaluation_method_basis:
  reason: The generative phase's score is what the assay returns on the submitted sequences, which
    is wet-lab-validation. The predictive phase's score is a rank correlation against withheld
    measurements (Spearman in the pilot, NDCG in 2025). The published pilot standings are points
    from each event's rank, summed across events, so a team's position depends on who else entered.
  source: src-proteins-2025-pet-results
  quote: Teams were awarded points based on their rank for each individual event using a
    reverse‐rank reward system
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: The 2025 generative phase scores a free-energy change of specific activity relative to a
      benchmark enzyme, which reads as a discipline-specific measure. It is a transformation of an
      assay readout rather than a named community statistic, so the assay term carries it.
    source: src-alignbio-2025-petase-tournament
    quote: At the end of round-2 teams will be ranked by comparing free energy change of the
      experimentally measured specific activity relative to benchmark value, while maintaining
      threshold levels of expression.
  - term: prospective-resolution
    reason: The generative phase's measurements are made after submission, but the experiment is run
      on the submitted sequences themselves, which the term's exclusion test assigns to
      wet-lab-validation.
  - term: expert-panel-assessment
    reason: No assessor writes an assessment. Scoring is mechanical from the assay and the rank
      statistics, and the organisers publish leaderboards rather than per-event assessments.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are protein-engineering methods -- protein language models fine-tuned on assay
    data, structure-based pipelines, evolutionary sequence models and genetic algorithms --
    evaluated on the discipline they are built for.
  source: src-proteins-2025-pet-results
  quote: Nimbus employed structural modeling tools like PyRosetta [12] and AlphaFold
designed_for_subjects_considered_and_rejected:
  - term: human-ai-team
    reason: Entrants are teams, and the pilot's own analysis says the human choice of starting point
      counted for more than the model. But no rule asks for human involvement and nothing separates
      such entrants, so the designed-for subject stays the model.
    source: src-proteins-2025-pet-results
    quote: the choice to build on top of IFF's prior engineering, and the number of mutations
      introduced (Figure 4A,B), was a stronger indicator of team performance than the base model
      used.
  - term: task-specific-supervised-model
    reason: The supervised track trains on a provided dataset, which fits the shape, but the task is
      one a scientific discipline defines, which the vocabulary's distinction assigns to
      domain-specialist-model.
    source: src-proteins-2025-pet-results
    quote: Participants were directed to train their models using the training set and subsequently
      use the trained model to predict the withheld properties in the test set.

lifecycle: active
lifecycle_basis:
  reason: The 2025 PETase edition launched in December 2025 with more than 290 registered teams, its
    generative phase scheduled through 2026, and the organisers published a 2026 report on the
    assays built to score it.
  source: src-alignbio-petase-press-release
  quote: The tournament begins December 1st and will unfold in two phases
activity: unknown
activity_note: No public board or results page for the 2025 edition was found on 2026-11-04, and the
  tournament's own page has been taken down (HTTP 404), while the Benchmarks page still links to it.
  The phase dates are legible only in a timeline image on the archived page (predictive zero-shot
  from 2025-12-01, predictive supervised from 2026-04-13, generative round 1 in summer 2026, round 2
  in autumn 2026, winners in spring 2027), which no quote can carry, so whether the edition is
  mid-generative-phase, between phases or stalled is not evidenced. results-pending and
  accepting-submissions were both considered (review_checks).
activity_basis:
  reason: What is evidenced is that an edition is under way and that its results are promised at
    completion, not which phase is open today.
  source: src-alignbio-2025-petase-tournament
  quote: Anonymized predictions, designed protein sequences, and associated experimental results for
    all teams will made public at the completion of the Tournament.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: TUM Rostlab (protein language models with reinforcement training; the pilot's overall
      champion)
    source: src-alignbio-2023-amylase
    observed_on: 2026-11-04
    quote: 'In Vitro Winner & Overall Tournament Champion: TUM Rostlab'
  - system: Registered teams of the 2025 edition, including the Arnold and Baker labs and Profluent
    source: src-alignbio-petase-press-release
    observed_on: 2026-11-04
    quote: Registered participants range from leading academic groups, including the Frances Arnold
      Lab at Caltech and the Baker Lab at the University of Washington, to AI-driven companies like
      Profluent
evaluation_target: learned-system
execution_mode: wet-lab
execution_mode_note: Two modes in one benchmark. The predictive phase is automated, with teams
  uploading predictions and the organisers score them against withheld measurements. The generative
  phase, which decides the champion, is a wet-lab round in which submitted sequences are
  synthesised, expressed and assayed by the organisers' partners.
ground_truth_source: experimental
ground_truth_source_note: Assay measurements throughout -- expression, thermostability and specific
  activity of enzyme variants, measured by the donor or partner laboratory. In the pilot these were
  IFF's alpha-amylase assays; for 2025 the organisers built and benchmarked PETase assays of their
  own.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: After the pilot, every dataset, submission and analysis script was released publicly under
    CC BY, so its predictive events can be rescored by anyone. What cannot be repeated is the blind
    condition or the generative round, which needs DNA synthesis and the partner's assays.
  source: src-alignbio-2023-amylase
  quote: All data, code, and results are openly available on GitHub.

task:
  exists: true
  input:
    - enzyme variant sequences for the target protein, with the challenge problem and the properties
      to score
    - in the supervised track and the generative phase, a training set of sequences with measured
      activity, thermostability and expression
  output: Per predictive event, a score per sequence for each requested property (the range is
    arbitrary, since only the ranking is used). In the generative phase, a ranked list of up to 200
    designed amino-acid sequences, plus an abstract describing the method.
  scoring: Predictive events are scored by rank correlation against the withheld measurements
    (Spearman in the pilot, averaged over an event's properties; NDCG averaged over properties in
    2025), one classification event by weighted F1, and event ranks are turned into points and
    summed into track and overall leaderboards. The generative phase is scored on the assay -- in
    the pilot, the best and median specific activity among variants meeting the stability and
    expression criteria; in 2025, the change in specific activity against a benchmark enzyme.
  tests_hidden_from_system: true
  source: src-proteins-2025-pet-results
  quote: Participants were directed to train their models using the training set and subsequently
    use the trained model to predict the withheld properties in the test set.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: During an edition the supervised track and the generative phase get a training set
    while the test properties stay withheld; the zero-shot track gets sequences only. After an
    edition everything is published, so the pilot's data are now fully-open -- four datasets
    download from the Align data portal with no login, and the repository is CC BY 4.0. Registration
    is free and open to anyone.
  access_basis:
    reason: The predictive phase scores predictions against properties the teams never see, and the
      generative phase against measurements that do not exist until the designs are assayed.
    source: src-proteins-2025-pet-results
    quote: The zero‐shot track challenged participants to make predictions without any prior
      training data, relying solely on intrinsic algorithmic robustness and generalizability.
  access_by_phase:
    during_edition: Challenge sequences, and in the supervised track a training set, go to
      registered teams; the measured properties stay with the organisers and the donor until the
      event closes.
    after_edition: Everything is released -- data, participant submissions and analysis scripts on
      GitHub under CC BY 4.0, with four of the pilot's datasets also on the Align data portal.
    after_edition_source: src-alignbio-2025-petase-tournament
    after_edition_quote: Anonymized predictions, designed protein sequences, and associated
      experimental results for all teams will made public at the completion of the Tournament.
  refresh: periodic-recompetition
  refresh_note: A new edition every 18 to 24 months, with a new target protein and newly donated or
    newly generated data each time.
  refresh_basis:
    reason: Each edition poses unpublished measurements on a different enzyme family, and nothing
      carries over between them.
    source: src-alignbio-benchmarks
    quote: The Tournament runs approximately every 18–24 months, with new target proteins and
      expanded datasets in each edition.
  data_provenance:
    - experimental-measurement
  data_provenance_note: Assay readouts throughout, donated by academic and industry groups in the
    pilot (IFF, Codexis, the Fordyce group, the Bornscheuer group, the Fleishman lab, the Design to
    Data program) and generated by the organisers' own assay platforms for 2025.
  data_provenance_source: src-proteins-2025-pet-results
  data_provenance_quote: The pilot Protein Engineering Tournament was made possible by the donation
    of six multi‐objective datasets from our academic and industry partners
  contamination_risk: low
  contamination_risk_note: Low for what an edition scores. The predictive data are unpublished when
    posed, and the generative phase's measurements do not exist until the submitted designs are
    assayed. Once an edition closes, its datasets are published in full, so reusing the pilot's
    alpha-amylase or PafA data as a benchmark today has no such protection; that is reuse, not the
    Tournament.
  contamination_evidence:
    - source: src-proteins-2025-pet-results
      stance: against
      quote: Participants were directed to train their models using the training set and
        subsequently use the trained model to predict the withheld properties in the test set.
    - source: src-alignbio-2023-amylase
      stance: supports
      quote: All data, code, and results are openly available on GitHub.
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The licence of the released pilot repository, which holds the datasets, the
    team submissions and the analysis scripts. The 2025 data are not released yet; the participation
    terms give the organisers ownership of the outputs, with no licence named for the eventual
    release.
  dataset_licence_source: src-github-pet-2023-readme
  dataset_licence_quote: all of the provided data, participant submissions, and analysis scripts can
    be found on our [GitHub repository
  size:
    - count: 6
      unit: donated enzyme datasets
      subset: 2023 pilot
      source: src-alignbio-2023-amylase
      quote: 6 datasets contributed from 4 academic and 2 industry groups
    - count: 7
      unit: predictive events
      subset: 2023 pilot, predictive round
      source: src-proteins-2025-pet-results
      quote: In the predictive round, participants engaged in seven events distributed across two
        unique tracks
    - count: 9422
      unit: sequences
      subset: 2023 pilot, alpha-amylase dataset (28,266 measurements)
      source: src-proteins-2025-pet-results
      quote: 9422 sequences measured for expression, specific activity, and thermostability
    - count: 1200
      unit: designed sequences synthesised and assayed
      subset: 2023 pilot, generative round
      source: src-alignbio-2023-amylase
      quote: 1,200 unique sequences synthesized and tested
    - count: 20
      unit: reference PETases
      subset: 2025 edition, assay calibration panel
      source: src-alignbio-data-protein-tournament
      quote: were developed and benchmarked against a reference panel of 20 PETases
  submission_limit:
    max_submissions: 200
    period_days: 0
    per: team and generative event, as designed sequences in one ranked list
    source: src-proteins-2025-pet-results

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Align Foundation (Align to Innovate), with a planning committee of its staff and
    volunteers from the protein engineering community
  maintainer_basis:
    reason: The nonprofit holds the Tournament, its data portal and its repositories; the planning
      committee sets each edition's target and rules.
    source: src-proteins-2025-pet-results
    quote: The Protein Engineering Tournament is operated by Align to Innovate, a non‐profit
      organization dedicated to improving the reproducibility, scalability, and shareability of life
      science research through community
  maintainer_type: nonprofit
  maintainer_type_note: consortium and community-collective were considered. The datasets, portal
    and repositories sit with one nonprofit that is not governed by member organisations, and the
    planning committee is advisory, so nonprofit holds. Align to Innovate now presents itself as the
    Align Foundation; both names appear across the sources.
  submission_process:
    - held-out-server
    - maintainer-scored-predictions
  submission_process_note: Teams download each event's data, run their methods and upload
    predictions or designed sequences, with an abstract describing the method. The organisers score
    them after the deadline against withheld measurements or against the assays they commission, and
    publish leaderboards. Teams are anonymised during an edition and the top ones de-anonymised
    afterwards.
  submission_process_source: src-alignbio-2025-petase-tournament
  submission_process_quote: Each team submits their property predictions (predictive phase) or
    designed protein sequences (generative phase).
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-proteins-2025-pet-results
      quote: The Marks Lab won the zero‐shot track, while Exazyme and Nimbus shared the first‐place
        spot for the supervised track.
    - flag: funded-by-evaluated-party
      source: src-proteins-2025-pet-results
      quote: All experimentation was performed by our automation partners, International Flavors and
        Fragrances,
    - flag: prize-sponsored-by-industry
      source: src-alignbio-petase-press-release
      quote: The tournament is backed by sponsors including Twist Bioscience, Modal Labs, and
        EvolutionaryScale.
  independence_flags_note: maintainer-competes-on-own-benchmark rests on the winning zero-shot team
    being the laboratory of one of the results paper's authors, who is also credited with
    supervision; the paper names the team, and this record does not name the individual.
    funded-by-evaluated-party rests on IFF, which donated the alpha-amylase dataset, ran the
    generative round's experiments, and its staff are among the paper's authors, while teams that
    built on IFF's own engineered variant did best. For 2025 the sponsor EvolutionaryScale supplies
    the protein language models that entrants may use, which is the same shape one step removed.
  independence_assessed: true
  funding:
    source: src-proteins-2025-pet-results
    quote: Align to Innovate receives philanthropic funding in part from Griffin Catalyst.
  independence_policy: null
  independence_policy_note: No conflict-of-interest rule was found on any page or in either paper,
    and nothing says whether an organiser's laboratory may enter, or how an event whose data the
    organisers donated is scored.
  known_limitation:
    source: src-proteins-2025-pet-results
    quote: Only two teams, MediumBio and SergiR1996, achieved more than 50% success rate of screened
      variants passing the expression and stability criteria.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Nothing states a compute requirement. Entrants run their own methods; the 2025
    edition offers sponsored cloud compute so that teams "compete on ideas rather than availability
    of infrastructure".
  reproducibility_tier: requires-physical-experiment
  reproducibility_tier_note: Two questions with two answers, as for CASP. Rescoring the pilot's
    predictive events from the released repository is automatable; repeating the Tournament, whose
    decisive round measures designed sequences in a laboratory, is not. The tier takes the decisive
    round.
  reproducibility_blockers:
    - wet-lab
  reproducibility_blockers_note: The generative phase needs DNA synthesis, expression and the
    partner's assays; the pilot's were run at IFF's facility and the 2025 edition's at a contract
    research organisation.
  harness_availability: reference-implementation-only
  harness: The pilot repository (Align-to-Innovate/the-protein-engineering-tournament-2023) holds
    per-event Jupyter notebooks with the input data, team predictions and the figures and
    leaderboards they produce
  harness_note: The notebooks reproduce the pilot's scoring from the released submissions. There is
    no packaged scorer for a new entrant, and no public harness for the 2025 edition.
  harness_source: src-github-pet-2023-readme
  harness_quote: 'Test Data (with values): The evaluation data for each challenge, consisting of protein
    sequences and with their properties filled in. This data was what teams’ predictions were evaluated
    against in the supervised round.'
  submission_channel: null
  submission_channel_note: No submission URL is quoted on any page read. Registration for the 2025
    edition ran through a form on the Align site, and the tournament page gives an organiser e-mail
    address, which this record does not carry.
  code_licence: CC-BY-4.0
  code_licence_note: The pilot repository's own licence, which covers the analysis notebooks as well
    as the data; GitHub's API reports CC-BY-4.0 for the repository.
  code_licence_source: src-github-pet-2023-readme
  code_licence_quote: The pilot tournament is structured into three tracks
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and event (each is its own enzyme, assay and property set),
  # which track a result comes from (zero-shot and supervised are scored separately), and the assay protocol,
  # since the generative round's numbers are assay readouts from one partner laboratory.
  material_extra:
    - subset_used
    - eligibility_track
    - assay_protocol

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The organisers publish a combined standing from event ranks turned into points and summed
    across events in the pilot, and the average NDCG over properties in 2025.
  source: src-alignbio-2025-petase-tournament
  quote: The final tournament ranking is determined by the average NDCG across all protein
    properties.
headline_metric: null
headline_metric_note: The aggregate is a ranking, not a number on a scale -- points from event ranks
  in the pilot, average NDCG in the 2025 predictive phase, and a change in measured specific
  activity in the generative phase. No single metric spans the editions.

homepage: https://alignbio.org/benchmarks/
repository: https://github.com/Align-to-Innovate/the-protein-engineering-tournament-2023
dataset_url: https://data.alignbio.org/protein-tournament/

versions:
  - version: pilot-2023
    label: Pilot Tournament (2023, six donated enzyme datasets)
    version_kind: edition
    released: 2023-05-01
    changes: The proof-of-concept edition. Six donated datasets (alpha-amylase, aminotransferase,
      imine reductase, alkaline phosphatase PafA, beta-glucosidase B, xylanase) made seven
      predictive events in a zero-shot and a supervised track, scored by Spearman correlation and
      one weighted F1, plus one generative event on alpha-amylase whose designs IFF synthesised and
      assayed. 28 teams registered, seven submitted predictions, seven competed in the generative
      round; the Marks Lab won the zero-shot track, Exazyme and Nimbus tied in the supervised track,
      Nimbus led the predictive round overall and TUM Rostlab was the champion. All data and
      submissions were released.
    breaking: true
    superseded_by: petase-2025
    frozen: true
    sources:
      - src-proteins-2025-pet-results
      - src-alignbio-2023-amylase
      - src-github-pet-2023-readme
      - src-alignbio-data-protein-tournament
  - version: petase-2025
    label: 2025 PETase Tournament
    version_kind: edition
    released: 2025-12-01
    changes: The first official edition, targeting PETase for enzymatic plastic recycling. The
      predictive phase keeps the zero-shot and supervised tracks but is scored by NDCG against
      experimental rankings; the generative phase runs in two rounds, the second trained on the
      first round's measurements, and ranks teams by the change in measured specific activity
      against a benchmark enzyme under expression thresholds. More than 290 teams from 40 countries
      registered, there are $30,000 in prizes, and the organisers built and benchmarked three assay
      platforms for the data, of which one proved usable.
    breaking: true
    supersedes_version: pilot-2023
    frozen: false

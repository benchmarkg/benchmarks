    - src-github-pet-2023-readme
    - src-zenodo-19832225
    - src-msb-2026-bits-to-binders
  sources_note: >
    The pilot results paper as Europe PMC's full-text XML of the Proteins version of record, and the 2023
    design paper as its arXiv v2 PDF (both DOIs, not archived); four alignbio.org pages and the Align
    data portal's tournament page, with scripts and styles stripped, of which the 2025 PETase Tournament
    page was read from its Wayback capture of 2026-03-13 because the live page now returns 404; the pilot
    repository's README pinned at commit 06dd2e0; the organisers' 2026 Zenodo report on the 2025 assays;
    and a 2026 Molecular Systems Biology paper as evidence of current use. The bioRxiv preprint of the
    results paper (2024.08.12.606135) and the ICLR 2024 workshop poster were not read.
  confidence: medium
  review_checks:
    - check: Primary domain protein-design against protein-fitness-prediction. Seven of the pilot's
        eight events, and every team, were predictive; only the generative event produced the
        champion. The call follows the phase the Tournament is decided on, and the other term is
        secondary.
      field: domain
      source: src-proteins-2025-pet-results
      quote: In the predictive round, participants engaged in seven events distributed across two
        unique tracks
    - check: chemistry-materials/experimental-hit-finding was rejected because the nominated
        artifact is a protein. The term's shape -- nominate, synthesise, assay, score on the assay
        -- otherwise fits the generative phase exactly, and a reviewer may want it recorded as a
        cross-family near miss in the taxonomy, as CACHE is for protein-ligand-cofolding.
      field: domain
    - check: activity is unknown. The 2025 edition's phase dates exist only in a timeline image, the
        tournament page was withdrawn from the live site (404 on 2026-11-04) while the Benchmarks
        page still links it, and no leaderboard was found. On the image's dates the generative phase
        would be running now (results-pending and accepting-submissions were the alternatives).
      field: activity
      source: src-alignbio-benchmarks
      quote: '2025 Tournament: Engineering improve PETase enzymes to tackle plastic waste'
    - check: The 2025 edition's released date, 2025-12-01, comes from an October 2025 announcement
        of a future start, not from a report that it started. Nothing read confirms the predictive
        phase opened on that date.
      field: versions
      source: src-alignbio-petase-press-release
      quote: The tournament begins December 1st and will unfold in two phases
    - check: Sources disagree on the pilot's scale. The paper says "over 90 individuals assembled
        into 28 teams" and the site says "85 registered users across 28 teams"; the site also says
        "Over 30 teams participated" and the announcement "drew 30 teams". The entry follows the
        paper.
      field: data.size
      source: src-alignbio-petase-press-release
      quote: Align piloted this approach in 2023 with an amylase engineering competition that drew
        30 teams and published results in Proteins.
    - check: maintainer-competes-on-own-benchmark. The team that won the pilot's zero-shot track is
        the laboratory of one of the results paper's authors, credited with supervision. Whether
        that author was involved in scoring is not stated anywhere, and no conflict-of-interest
        policy was found.
      field: governance.independence_flags
    - check: funded-by-evaluated-party rests on IFF donating the alpha-amylase dataset, running the
        generative round's assays and co-authoring the paper, while the designs that scored best
        built on IFF's own engineered variant. Whether the evaluated party is IFF or the teams using
        its data needs a ruling.
      field: governance.independence_flags
      source: src-proteins-2025-pet-results
      quote: the choice to build on top of IFF's prior engineering, and the number of mutations
        introduced (Figure 4A,B), was a stronger indicator of team performance than the base model
        used.
    - check: entrant-relative-ranking is tagged from the pilot's reverse-rank points. The 2025
        predictive phase is scored by average NDCG, which is not pool-relative; if a reviewer reads
        the editions apart, the term belongs to the pilot only.
      field: evaluation_method
    - check: execution_mode wet-lab and reproducibility_tier requires-physical-experiment both
        describe the generative phase. The predictive phase on its own is automated and fully
        reproducible from the released repository, and reproducible_by_third_party true describes
        that half.
      field: execution_mode
    - check: data.access train-open-test-held-out describes a live edition. After an edition
        everything is published, which on its own would be fully-open; the pilot's four datasets
        download from the data portal with no login or agreement.
      field: data.access
      source: src-alignbio-data-protein-tournament
      quote: Protein Tournament 4 datasets available
    - check: submission_limit records the pilot's 200 sequences per generative submission, which is
        a size limit on one submission rather than a rate limit; period_days 0 and the note carry
        that. No limit on predictive submissions was found.
      field: data.submission_limit
    - check: The pilot's data and the 2025 edition's are governed differently. The repository is CC
        BY 4.0, while the 2025 participation terms give the organisers ownership of all outputs with
        no licence named for the release, so dataset_licence may need splitting per edition.
      field: data.dataset_licence
      source: src-alignbio-2025-petase-tournament
      quote: The Align Foundation will own those datasets, methods, assays, analysis and results
    - check: Evidence of current use is second-hand. A 2026 Molecular Systems Biology paper on
        another design competition names the Tournament among the efforts now validating
        crowd-sourced designs experimentally, but no 2026 result of the Tournament's own was found,
        and its 2025 edition has published none.
      field: lifecycle
      source: src-msb-2026-bits-to-binders
      quote: Similar efforts are emerging in AI-driven protein design, such as the Protein
        Engineering Tournament

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T05)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-caid-site
    - src-natmethods-2021-caid1
    - src-proteins-2023-caid2
    - src-proteins-2025-caid3
    - src-nar-2023-caid-portal
    - src-github-caid-readme
    - src-jmb-2026-fldpnn3
    - src-biorxiv-2026-06-24-733783
  sources_note: >
    The CAID1 and CAID3 reports and the Prediction Portal paper as Europe PMC full-text XML; the CAID2
    report as the text of the publisher's PDF in the Padova repository, because Wiley refused the request
    and there is no PMC copy (all four DOIs, not archived); the site as its compiled bundle, because every
    page renders by script; the CAID README at a pinned commit; and Europe PMC's abstract records of flDPnn3
    and The Hidden Disorder Divide (DOIs, not archived). The reference FASTA files of CAID2 and CAID3
    were downloaded to confirm the counts (348 and 319 Disorder-PDB proteins, 204 Disorder-NOX) and are
    not Sources.
  confidence: medium
  review_checks:
    - check: Domain. No leaf names residue-level disorder prediction. protein-function-prediction
        was chosen for its task shape (annotate a sequence, score against curated annotations) over
        protein-structure-prediction, whose definition asks for a three-dimensional structure. A
        tag-gap record proposes protein-disorder-prediction; a specialist may prefer the structure
        leaf, as CASP's old disorder category suggests.
      field: domain.primary
      specialist: true
    - check: Identity. One entry for the series with four rounds as editions, and the five reference
        sets as subsets carrying CAID3's sizes. The rounds re-run all earlier methods on each new
        reference, so an edition is new items with a growing entrant pool. The CAID Prediction
        Portal and its dataset repository are services built on CAID's predictors, not separate
        benchmarks.
      field: versions
    - check: expert-panel-assessment assumes the organisers' assessment paper is the authoritative
        output. The site's results pages (interactive curves and tables per round) could be read as
        the published artifact instead, which the term's exclusion sends elsewhere.
      field: evaluation_method
      source: src-natmethods-2021-caid1
      quote: '(4) Report: a report of the evaluation is produced and published in peer-reviewed journals
        and on a web page that allows the reader to browse the evaluation of all CAID editions.'
    - check: maintainer-competes-on-own-benchmark rests on the organisers' AlphaFold-disorder
        packages being ranked in the CAID2 and CAID3 tables. The papers call them baselines and
        CAID1's policy keeps assessors' methods for reference only, so the flag may be too strong.
        ESpritz, whose paper (cited in CAID2) lists an organiser among its authors, is also among
        the evaluated methods.
      field: governance.independence_flags
      source: src-proteins-2023-caid2
      quote: To establish a comparison baseline, we also incorporated the AlphaFold-disorder
        package,9
    - check: submission_process tags containerized-algorithm-submission for all rounds. Before CAID3
        no method arrived containerised and the organisers built the containers from submitted code,
        which is closer to sandboxed-rerun; CAID3 is the first round where most entrants hand over
        containers.
      field: governance.submission_process
      source: src-proteins-2025-caid3
      quote: In this edition, 17 out of 24 (70%) new methods were submitted as containers.
    - check: data.access fully-open is judged on the closed rounds, whose references and predictions
        are open downloads. No licence is stated for them, and CAID4's references are not yet out.
      field: data.access
    - check: contamination_risk low. Medium could be argued, because the experiments behind new
        DisProt annotations are often published long before, and The Hidden Disorder Divide shows
        that binding predictors trained on DisProt score far higher on CAID's sets than on other
        databases. That paper explains it as selection bias in literature-curated binding sites, not
        leakage, which is why it is recorded under comparability and as_used rather than as
        contamination evidence.
      field: data.contamination_risk
      source: src-biorxiv-2026-06-24-733783
      quote: Predictors trained predominantly on DisProt data achieved substantially higher AUCs on
        the CAID sets but performed poorly on the DBs.
    - check: data_provenance curated-public-database, although DisProt is curated at the same
        department and CAID uses its unreleased annotations. expert-authored could be argued if
        DisProt's curators count as authors of the labels.
      field: data.data_provenance
    - check: The CAID2 report says OpenEBench will become the official platform for future rounds,
        but CAID4 takes submissions through a web form and no source shows the move, so no history
        event is recorded.
      field: execution.submission_channel
      source: src-proteins-2023-caid2
      quote: which will become the official platform for running future CAID challenges
    - check: The CAID4 dates come from the site's compiled JavaScript, read as zero-based months
        (Date(2026,5,30) is 30 June 2026). A rendered page or the organisers should confirm them,
        and the resource limits quoted for CAID4 (48 GB, 24 threads, 6 hours) are from the same
        page.
      field: versions
      source: src-caid-site
      quote: title:"Preliminary results",date:new Date(2026,11,1)
    - check: No round has a start date in the papers except CAID1's annotation window, so only CAID4
        carries `released`. CAID2's and CAID3's labels give years from their DisProt deltas and
        papers.
      field: versions

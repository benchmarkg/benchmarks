lineage:
  role: root
lineage_note: The systems are PLINDER systems, cut from the PDB by PLINDER's pipeline and validation
  criteria, but Runs N' Poses is a dataset of its own with its own items and release, not a subset
  or filter of the PLINDER splits, so no lineage relation is set. Nor is it a variant of
  posebusters, whose checks it runs; the paper finds 87% of the PoseBusters set's complexes above 50
  SuCOS-pocket similarity to training. CAMEO (cameo), from the same Basel group, is named as using
  its data.
lineage_source: src-nature-s41594-026-01797-5
lineage_quote: In fact, 87% of the complexes in the commonly used PoseBusters benchmark dataset20
  have a SuCOS–pocket similarity >50 to the training set


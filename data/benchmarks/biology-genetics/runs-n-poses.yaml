versions_note: Six Zenodo deposits, modelled as three revisions of the same items under 04 S4. The
  ground-truth archive has one checksum throughout, and only the deposits that change what a score
  means become versions. The newest deposit's change note counts from "v4", which does not match
  Zenodo's six-deposit order (review_checks).


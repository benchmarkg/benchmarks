  sources_note: >
    The journal paper's open-access PDF (a DOI, not archived), read as text, with windows that keep the
    corresponding author's address, the correspondence line and the reviewers' names out; bioRxiv's API
    record for the preprint's versions; the README and LICENSE at commit 197fafc; Zenodo's API JSON for
    three of six deposits, in narrow windows that keep the creators' ORCIDs out; the Polaris benchmark
    page as served; and Pearl's v2 PDF (a DOI) as evidence of current use. GitHub's API was read for the
    repository's dates and licence metadata, and the other three Zenodo deposits' API records for their
    file checksums; neither is kept as a Source.
  confidence: medium
  review_checks:
    - check: The versions are a judgement under 04 S4. Six Zenodo deposits share one ground-truth
        checksum; the entry makes three revisions (first deposit, August 2025 annotations, January
        2026 PoseBusters re-run) and leaves the MSA and prediction-file additions out. Whether the
        August and January changes are benchmark revisions or results-file updates, and whether
        either is breaking, is not clear-cut. The new PoseBusters file first appears in the
        2026-01-05 deposit (same checksum as 2026-01-25's), but only the later record carries the
        change note.
      field: versions
      source: src-zenodo-18366081
      quote: mode, which added additional checks and thus changed overall PB valid counts
    - check: The 2,579 count and the dropped 21 systems rest on the curator's comparison of two
        downloaded annotations.csv files plus the paper's Fig. 2b and its statement on the 21
        systems; no source states the annotation change directly.
      field: data.size
    - check: aggregation_policy is none-by-design, read from per-bin reporting; no source says in so
        many words that no single figure should be quoted. community-aggregate is the alternative.
      field: aggregation_policy
    - check: The pair (constraint-check, domain-specialist-model) resolves to the llm-static-text
        profile, whose LLM fields mean nothing for a co-folding model, as posebusters' entry notes.
        Nothing is waived.
      field: comparability
    - check: compute_tier is null where the corpus record has single-gpu, because the GPU serves the
        entrant and no source mandates it.
      field: execution.compute_tier
    - check: maintainer_type academic-lab against community-collective. The repository is in the
        shared plinder-org account; the LICENSE names the Schwede lab, and the Zenodo creators all
        give the University of Basel.
      field: governance.maintainer_type
      source: src-github-runs-n-poses-license
      quote: Copyright 2024 Schwede Lab
    - check: no-known-conflict rests on the journal's competing-interests statement. Dompé
        farmaceutici is a funder, and AlphaFold3 weights were provided to one author; neither looks
        like support from an evaluated party, but a reviewer should confirm. The corpus record
        quotes a different employer for the same author from the preprint.
      field: governance.independence_flags
    - check: The Polaris subset's eight bins sum to 2,073, but its header lists test sizes summing
        to 2,835, probably ligands rather than systems; the page does not say.
      field: subsets
      source: src-polaris-runs-n-poses
      quote: 'Test size: 95 + 122 + 169 + 302 + 356 + 444 + 454 + 893'
    - check: The README dates the all-PDB similarity file to 5 January 2025, the paper's dataset
        window to 9 January 2025.
      field: data.size
      source: src-github-runs-n-poses-readme
      quote: Contains all calculated similarity metrics for Runs N' Poses dataset systems against
        the entire PDB up until 5 January 2025.
    - check: released is the first Zenodo deposit (2025-02-03), not the preprint's first version
        (2025-02-07); the preprint's three versions were not read in full.
      field: released
    - check: Pearl's as_used protocol scores RMSD with PB-validity, best of 5, over a 702-structure
        post-2023 subset, not the benchmark's LDDT-PLI criterion per similarity bin.
      field: as_used
      source: src-arxiv-2510-24670-v2
      quote: We report the main results for the best@5 protocol

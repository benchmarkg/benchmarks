curation:
  added_by: agent (P1-S5-T06)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-jcim-2022-moleculeace
    - src-crossref-10-26434-chemrxiv-2022-mfq52
    - src-github-moleculeace-readme
    - src-github-api-moleculeace
    - src-github-api-moleculeace-releases
    - src-arxiv-2601-04507-v1
  sources_note: >
    The release paper as Europe PMC's full-text XML of PMC9749029, read with 50-character windows that
    keep the author block, the corresponding address, the acknowledgments and the reference list out;
    Crossref's record of the first ChemRxiv posting, with 15-character windows that keep the author names
    and ORCIDs out, for the date and the maintaining group; the README at main; the repository record
    and the release list from the GitHub API; and the SemiMol v1 PDF as evidence of 2026 use. The LICENCE
    file was fetched and not kept as a Source: it adds only a copyright holder's name to what the README
    and the API record already state.
  confidence: medium
  review_checks:
    - check: The primary leaf. The chemistry-materials round dropped this entry because that
        family's exclusion test sends a predicted protein affinity to biology-genetics, and
        drug-target-interaction is the only leaf whose definition covers a compound's potency on a
        named target. But the leaf's not_to_be_confused_with contrasts it only with ADMET and
        hit-finding, and the paper's own framing is molecular property prediction, which is a
        chemistry-materials leaf. If the reviewer reads the scored quantity as the molecule's own
        property, the entry belongs in chemistry-materials; nothing else in the taxonomy forces the
        call.
      field: domain.primary
    - check: No capability term names what the benchmark actually claims to measure, accuracy on the
        activity-cliff slice of a test set. The three candidates all fail their own inclusion tests
        (capability_considered_and_rejected), so capability carries only scientific-prediction.
        Logged as taxonomy/_failures/2026-11-05-moleculeace-001 with a proposed term.
      field: capability
    - check: Whether chemistry-materials/molecular-property-prediction should be a secondary leaf
        rather than only rejected. It was left off because the family exclusion test is written
        against exactly this case, but a secondary tag would make the entry findable from the QSAR
        side.
      field: domain.secondary
    - check: designed_for_subjects is scientific-surrogate-model, not domain-specialist-model, which
        decides the comparability profile (surrogate-fit rather than fallback). The entrants are
        fitted on the target's own measured potencies and predict what the assay would report, which
        is the surrogate test; but two of them are chemistry-pretrained models fine-tuned onto the
        assay, which reads as specialisation. ProteinGym rejected the surrogate term for predictors
        scored against assays they were not trained to emulate; here they are trained on them, which
        is why the call differs.
      field: designed_for_subjects
      source: src-jcim-2022-moleculeace
      quote: We used the pretrained ChemBERTa model weights based on 10M compounds from PubChem.
    - check: entrant-relative-ranking is rejected. The release paper's global ranking is a PCA over
        the pool's RMSEcliff values stretched between the pool's best and worst, which the term's
        inclusion test describes, and adding a method would move the picture. It is treated as one
        paper's analysis rather than the benchmark's scoring because the package computes only the
        two RMSEs.
      field: evaluation_method
      source: src-jcim-2022-moleculeace
      quote: we performed a principal component analysis (PCA) on the obtained RMSEcliff values
    - check: aggregation_policy is none-by-design on the paper's refusal to normalise RMSE across
        data sets, but the paper itself compares methods "on average" across the 30 sets throughout,
        and later users report mean RMSE over them. Whether the catalogue should record that
        community mean as a community-aggregate instead.
      field: aggregation_policy
    - check: data.refresh is versioned-releases, resting on v3.0.0's labelled correction. The extra
        pEC50/pKi column the README announces carries no date and no release label; the README says
        model errors are unchanged because the labels are shifted by a constant 9, which is why this
        is not read as rolling-live.
      field: data.refresh
      source: src-github-moleculeace-readme
      quote: we added an extra column to the datasets containing pEC50 and pKi values calculated
        from Molar concentrations alongside the original training labels used in the study
    - check: The data licence is null. The repository is MIT and the data folder is inside it, but
        the measurements are ChEMBL's and ChEMBL's own terms (CC BY-SA) were not read, so whether
        the benchmark data may be redistributed is unresolved.
      field: data.dataset_licence
    - check: ceiling_anchor_type is theoretical-maximum (zero RMSE). The paper's warning about
        undetectable experimental noise, and its one-log-unit replicate-scatter filter, point at a
        noise ceiling that nobody has quantified for the retained data. A reviewer with the
        replicate-level ChEMBL data could put a number on it.
      field: data.ceiling_anchor_type
      specialist: true
    - check: contamination_risk is medium. The labels are public in ChEMBL and in the repository, so
        a later entrant that pretrains on ChEMBL bioactivities would have seen the test molecules'
        potencies. No source read assesses this for any scored method, and the benchmark has no
        training-data policy to breach.
      field: data.contamination_risk
    - check: The 30 per-target data sets are not enumerated as subsets, as MMLU's 57 subjects are
        not. If the reviewer wants per-target rows, the paper's Table 1 has every target, response
        type, size, test size and cliff share.
      field: subsets
    - check: Whether the January 2026 user's authors overlap the maintainers. The paper was read
        through windows that keep its author block out, so independence of that use is unverified;
        the flag list rests only on the release paper's conflict statement.
      field: as_used
    - check: Derivative benchmarks are not recorded. Several later activity-cliff benchmarks exist
        (one for antimicrobial peptides, one classification-framed set), and whether any is a fork
        or variant of these 30 data sets, rather than an independent construction, was not
        established, so lineage is unset.
      field: lineage
    - check: governance.funding is unset although the paper carries an acknowledgment of a
        fellowship and a research centre. The sentence sits immediately after personal names, so
        quoting it would have pulled them into the Source extract.
      field: governance.funding

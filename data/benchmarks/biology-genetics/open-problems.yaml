  - living-benchmark

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T04)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-researchsquare-rs-4181617-v1
    - src-openproblems-site
    - src-openproblems-benchmarks
    - src-openproblems-batch-integration
    - src-openproblems-cell-cell-communication
    - src-openproblems-perturbation-prediction
    - src-openproblems-about
    - src-openproblems-docs-philosophy
    - src-github-openproblems-readme
    - src-github-task-predict-modality-releases
  sources_note: >
    The platform paper's Research Square preprint (a DOI, not archived) read as the text of its v1
    PDF, with windows that keep the authors' ORCIDs out; the Nature Biotechnology article page was
    read but not cited, since it is subscription content and its raw page carries corresponding
    authors' e-mail addresses. Seven openproblems.bio pages with scripts, styles, SVGs and Astro
    props stripped; the openproblems README at main; and GitHub's release record of
    task_predict_modality, for the newest dated release.
  confidence: medium
  review_checks:
    - check: Identity. One entry for the platform with its 13 tasks as subsets; each task has its
        own datasets, metrics, controls, releases and ranking, and could instead be an entry of its
        own. The taxonomy's examples cite this platform as `open-problems-in-single-cell-analysis`,
        an id this entry (`open-problems`, as assigned) does not use.
      field: subsets
    - check: The NeurIPS 2021 and 2022 multimodal integration competitions and the NeurIPS 2023
        perturbation competition are treated as separate benchmarks, not versions or `events` of
        this entry. They ran as competitions with their own participants, data and timelines (the
        2021 one built on two platform tasks), while the platform is a standing benchmark; the
        taxonomy cites the 2023 one separately as `open-problems-op3`. The 2023 competition's task
        now lives on as the Perturbation Prediction subset. The sources read do not describe how the
        competitions were scored.
      field: versions
      source: src-researchsquare-rs-4181617-v1
      quote: Leveraging the batch integration and matching modality tasks as a basis, we previously
        set up popular competitions for multimodal data integration at NeurIPS 2021
    - check: maintainer-run beside sandboxed-rerun rests on maintainers entering methods whose
        developers did not submit them, as with the NeurIPS 2022 winner ported into Predict
        Modality; no source says who adds most methods.
      field: governance.submission_process
      source: src-github-task-predict-modality-releases
      quote: Added the winning solution of the NeurIPS 2022 competition
    - check: open-source-gated rests on a pull request into the task's public repository being the
        only route to a score; no rule read says in so many words that a method's own package must
        be open source.
      field: governance.submission_process
      source: src-researchsquare-rs-4181617-v1
      quote: adding a new method is as simple as opening a pull request to the repository and adding
        a new file that follows the API for that task
    - check: maintainer-competes-on-own-benchmark rests on Cell-Cell Communication's maintainer
        authoring LIANA, whose methods it ranks. Other tasks were not checked for methods from the
        core team's or advisors' labs.
      field: governance.independence_flags

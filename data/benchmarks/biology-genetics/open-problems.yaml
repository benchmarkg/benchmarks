# data/benchmarks/biology-genetics/open-problems.yaml
#
# P1-S5-T04, biology-genetics entry 6 of 9. Filled from the platform paper's open version, the Research Square
# preprint rs-4181617 read as its v1 PDF (posted 2024-04-04, CC BY 4.0; published in Nature Biotechnology on
# 2025-07-01, whose article page is subscription content and was not cited); openproblems.bio's home, benchmarks,
# about and Philosophy pages and three task pages (Batch Integration, Cell-Cell Communication, Perturbation
# Prediction), each with scripts, styles, SVGs and Astro props stripped; the openproblems-bio/openproblems README at
# main; and GitHub's release record of task_predict_modality. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.
#
# Identity: one entry for the platform, its 13 tasks as subsets. The NeurIPS 2021 and 2022 multimodal competitions
# and the NeurIPS 2023 perturbation competition are not versions or events of this entry (review_checks).

id: open-problems
name: Open Problems in Single-Cell Analysis
aliases:
  - Open Problems
  - OpenProblems
  - openproblems.bio
tagline: A living, community-run benchmark of 13 single-cell analysis tasks, from batch integration
  to spatial decomposition.
description: >
  A community-run benchmarking platform for single-cell and spatial omics analysis. Each task (13
  on the site in October 2026, among them batch integration, label projection, denoising,
  dimensionality reduction for visualisation, modality prediction, spatial decomposition,
  cell-cell communication and perturbation prediction) defines datasets with known ground truth,
  methods, and metrics. Every method is run on every dataset of its task and scored by every
  metric; each metric is scaled between the task's worst and best control methods, and methods are
  ranked by their mean scaled score. There is no score across tasks. Methods enter as code: a
  contributor adds a component to the task's public repository by pull request, and the platform's
  own pipeline (Viash components, Nextflow workflows, Docker containers) runs the benchmark and
  publishes the results, re-running methods as tasks, datasets and methods change. Datasets are
  public, most of them drawn from GEO, CELLxGENE and figshare. The NeurIPS competitions the
  project ran in 2021-2023 are separate benchmarks; the 2023 perturbation competition is now one
  of the platform's tasks.
self_description:
  source: src-github-openproblems-readme
  quote: Open Problems is a living, extensible, community-guided benchmarking platform.
paper:
  title: Defining and benchmarking open problems in single-cell analysis
  doi: 10.1038/s41587-025-02694-w
  version_read: v1
  source: src-researchsquare-rs-4181617-v1
released: null
released_note: No source read dates a first release. The tasks were defined in public from 2021, at
  a hackathon in March 2021, and the NeurIPS 2021 competition was built on two of them; the platform
  paper was posted on 2024-04-04 (Research Square) and published on 2025-07-01. The repository was
  created on 2020-06-19 (GitHub API), which is not a release.
released_source: src-researchsquare-rs-4181617-v1
released_quote: a hackathon in March 2021 with over 50 participants
release_venue: Nature Biotechnology (2025), as the version of record of the Research Square preprint
release_venue_source: src-researchsquare-rs-4181617-v1
release_venue_quote: A version of this preprint was published at Nature Biotechnology on July 1st,
  2025.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/single-cell-analysis
  secondary:
    - biology-genetics/perturbation-response-prediction
domain_basis:
  reason: Every task takes single-cell or spatial omics measurements, and most score cell-level
    results (batch integration, label projection, denoising, modality prediction, spatial
    decomposition, cell-cell communication), the primary leaf's inclusion test. One task,
    Perturbation Prediction, predicts expression after a small-molecule perturbation, the secondary
    leaf; its subset carries that leaf as its own primary.
  source: src-researchsquare-rs-4181617-v1
  quote: The Open Problems platform is an open-source, extensible, living benchmarking framework
    that enables quantitative evaluation of best practices in single-cell analysis.
domain_considered_and_rejected:
  - term: biology-genetics/transcriptomics
    reason: The inputs are single-cell and spatial measurements, not bulk expression.
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: Most tasks score a predicted state of cells against a reference measured or annotated on
      the same data, held back from the method -- cell-type labels, a second measured modality,
      held-out counts, cell-type composition, ligand-target interactions. Batch integration and
      dimensionality reduction score representations instead (review_checks).
    source: src-researchsquare-rs-4181617-v1
    quote: Datasets define both the input and the ground truth for a task, methods attempt to solve
      the task, and metrics evaluate the success of a method on a given dataset.
capability_considered_and_rejected:
  - term: causal-reasoning
    reason: Only Perturbation Prediction predicts the effect of an intervention on cells not
      observed under it, so the term is that subset's (capability_override), not the platform's.
    source: src-openproblems-perturbation-prediction
    quote: accurately predict chemical perturbations in new cell types
  - term: distribution-shift-generalization
    reason: Label projection evaluates several train and test splits, but no source read reports a
      deliberately shifted condition as a score of its own.
    source: src-researchsquare-rs-4181617-v1
    quote: Different train and test splits are evaluated on several datasets.
  - term: generation-fidelity
    reason: Spatial Simulators scores simulated spatial data against real data, but it is one task
      of 13; not assigned at the platform level.
  - term: perception
    reason: Inputs are count matrices and spatial expression tables, not raw sensory signals.

evaluation_method:
  - statistical-fit
  - classification-metric
  - composite
evaluation_method_basis:
  reason: >
    Each task scores with several general statistics: correlations and errors on continuous values
    (Perturbation Prediction's mean rowwise Pearson, Spearman, RMSE and MAE; modality prediction),
    and statistics of predicted labels or rankings (AUPRC and odds ratios for cell-cell
    communication, ARI and NMI for batch integration, F1 for label projection). A task's ranking
    figure is the mean of all its metrics after each is scaled between control methods, a
    combination of different methods, which is composite.
  source: src-researchsquare-rs-4181617-v1
  quote: All method scores are then normalised to this range such that optimum performance
    corresponds to a normalised score of 1 and random performance to a normalised score of 0.
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Batch integration also uses metrics named only in single-cell integration (kBET, iLISI,
      cLISI, batch ASW), but the term asks that each be defined as a Metric entity, and none is
      recorded here (review_checks).
    source: src-openproblems-batch-integration
    quote: kBET higher better
  - term: entrant-relative-ranking
    reason: Scores are rescaled before ranking, but against control methods that are the same for
      every entrant, so adding a method moves no one else's score; the taxonomy names this entry as
      the near miss.
    source: src-openproblems-batch-integration
    quote: dashed lines mark scaled 0 and 1 (worst/best control)
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The entrants are single-cell analysis methods. Learned ones are built for the discipline,
    from scVI-family models trained per dataset to foundation models pretrained on single-cell
    transcriptomes, such as Geneformer (learned_entrant_evidence). Many others contain no learned
    component, such as BBKNN's batch-balanced neighbour graph, Harmony or the cell-cell
    communication scoring methods.
  source: src-openproblems-batch-integration
  quote: BBKNN creates k nearest neighbours graph by identifying neighbours within batches
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The tasks are defined by single-cell biology, a scientific discipline, which the term's
      exclusion sends to domain-specialist-model.
  - term: scientific-surrogate-model
    reason: Perturbation Prediction's models stand in for an experiment, but that is one task; the
      platform's methods otherwise analyse measurements rather than emulate them.

lifecycle: active
lifecycle_basis:
  reason: Tasks keep releasing and re-scoring. Predict Modality v0.2.0, released on 2026-10-09,
    added eight methods, and the site carries its results; the openproblems repository was last
    pushed on 2026-10-02 (GitHub API).
  source: src-github-task-predict-modality-releases
  quote: '"published_at":"2026-10-09T15:23:42Z"'
activity: accepting-submissions
activity_basis:
  reason: Methods, datasets and tasks are taken by pull request at any time; the platform itself has
    not run in rounds (the NeurIPS competitions are separate benchmarks, review_checks).
  source: src-openproblems-site
  quote: anyone can contribute a new method or propose a new problem

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Geneformer (Batch Integration)
    source: src-openproblems-batch-integration
    observed_on: 2026-10-14
    quote: Geneformer is a foundation transformer model pretrained on a large-scale corpus of single
      cell transcriptomes
evaluation_target: learned-system
evaluation_target_note: Classical methods are ranked beside the learned ones
  (designed_for_subjects).
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each dataset carries its own ground truth, held back from the method --
  cell-type annotations, the second modality of jointly profiled cells, a molecular cross-validation
  split of the counts, spatial or cytokine proxies for cell-cell communication, measured
  perturbation responses.
ground_truth_source_basis:
  source: src-researchsquare-rs-4181617-v1
  quote: Datasets define both the input and the ground truth for a task, methods attempt to solve
    the task, and metrics evaluate the success of a method on a given dataset.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every component runs in a Docker container defined in the public task repositories, and
    the data come from public archives.
  source: src-researchsquare-rs-4181617-v1
  quote: To maximise reproducibility, each component is run within a Docker container defined by the
    method contributor, and all data is downloaded from public repositories

task:
  exists: true
  input:
    - a task-specific AnnData file of single-cell or spatial omics data, such as batches of cells
      with cell-type labels (batch integration), a labelled reference and an unlabelled query (label
      projection), one modality of jointly profiled cells (modality prediction), or spot-level
      spatial data with a single-cell reference (spatial decomposition)
  output: The task's result -- an integrated matrix, embedding or graph, predicted labels, a
    denoised matrix, the predicted second modality, per-spot cell-type proportions, ranked
    interactions or predicted expression after a compound.
  scoring: Every method is run on every dataset of its task and scored by every metric. Each metric
    is scaled so that the task's worst control scores 0 and its best control 1 (methods can fall
    outside that range), and methods are ranked by the mean scaled score.
  source: src-researchsquare-rs-4181617-v1
  quote: All method scores are then normalised to this range such that optimum performance
    corresponds to a normalised score of 1 and random performance to a normalised score of 0.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The datasets behind every task, ground truth included, are public, and each component
      downloads them from public archives.
    source: src-openproblems-site
    quote: Public, ready-to-use gold-standard datasets curated and version-controlled by the
      community.
  records_licence: CC-BY
  records_licence_source: src-researchsquare-rs-4181617-v1
  records_licence_quote: Open Problems results, which are made available under a Creative Commons
    Attribution licence (CC-BY), can then be included in the respective method papers.
  refresh: continuously-reexecuted
  refresh_basis:
    reason: Methods are re-run and re-scored by the pipeline as methods, datasets and metrics
      change, although each task also carries release labels (Batch Integration v1.0.0 to
      v2.1.0-rc2), so a result needs its task release and run to be read.
    source: src-openproblems-site
    quote: State-of-the-art methods are ranked and re-run automatically as the field evolves.
  data_provenance:
    - curated-public-database
    - experimental-measurement
  data_provenance_note: Most datasets are selected and processed from public archives (GEO,
    CELLxGENE, figshare). Perturbation Prediction's dataset was generated for the NeurIPS 2023
    competition, 144 compounds measured by single-cell RNA-seq in PBMCs from three donors ("we
    designed and generated a novel single-cell perturbational dataset in human peripheral blood
    mononuclear cells (PBMCs)", src-openproblems-perturbation-prediction).
  data_provenance_source: src-researchsquare-rs-4181617-v1
  data_provenance_quote: all data is downloaded from public repositories, including figshare, the
    Gene Expression Omnibus (GEO)
  contamination_risk: unknown
  contamination_risk_note: All ground truth is public, and methods may be tuned on the scored
    datasets. Foundation models pretrained on large single-cell corpora are scored on datasets drawn
    from CELLxGENE (Batch Integration's cellxgene_census datasets); whether their pretraining data
    include the scored datasets was not assessed.
  contamination_evidence: []
  ceiling_anchor_type: null
  ceiling_anchor_type_note: Not set. Each metric is scaled to the task's best control, which for
    some tasks is a perfect-prediction control run on the data (Cell-Cell Communication's "True
    Events"), but methods can score above it, and there is no ranking figure across tasks.
  dataset_licence: null
  dataset_licence_note: No platform-wide data licence is stated in the sources cited; datasets keep
    their upstream terms (the project's governance page, read but not cited, makes datasets public
    only where licensing permits). The results are CC-BY (records_licence).
  size:
    - count: 13
      unit: tasks (one, Cyto Batch Integration, marked in development)
      subset: the site, 2026-10-14
      source: src-openproblems-site
      quote: 13 open problems 135 methods benchmarked 96 gold-standard datasets 58 contributors
    - count: 135
      unit: methods benchmarked
      subset: the site, 2026-10-14
      source: src-openproblems-site
      quote: 13 open problems 135 methods benchmarked 96 gold-standard datasets 58 contributors
    - count: 96
      unit: gold-standard datasets
      subset: the site, 2026-10-14
      source: src-openproblems-site
      quote: 13 open problems 135 methods benchmarked 96 gold-standard datasets 58 contributors
    - count: 10
      unit: tasks counting subtasks (16 datasets, 70 methods, 31 metrics)
      subset: the 2024 preprint
      source: src-researchsquare-rs-4181617-v1
      quote: Currently, Open Problems includes 10 defined tasks, on which 16 datasets are used to
        evaluate 70 methods using 31 metrics.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Open Problems community, led by its core team, with a task team and task leader
    for each task
  maintainer_basis:
    reason: The about page names a core team of six across Helmholtz Munich, NVIDIA, HubFlow, Edaro
      and Data Intuitive, with two scientific advisors; each task page names its own maintainers.
    source: src-openproblems-about
    quote: Core team Daniel Burkhardt NVIDIA foundercore Malte D. Lücken Helmholtz Munich
      foundercore
  maintainer_type: community-collective
  maintainer_type_note: The project calls itself community-owned and is held in the openproblems-bio
    GitHub organisation with members from several institutions. NumFOCUS is its fiscal host
    ("providing nonprofit financial and administrative support", src-openproblems-about), which does
    not make it a nonprofit or a consortium; the taxonomy names this entry as community-collective's
    example.
  maintainer_type_source: src-openproblems-site
  maintainer_type_quote: A community-owned platform for benchmarking single-cell analysis.
  submission_process:
    - sandboxed-rerun
    - open-source-gated
    - maintainer-run
  submission_process_note: >
    A method enters as code: a component added by pull request to the task's public (MIT)
    repository, tested in CI and reviewed by the task leaders and the infrastructure team, after
    which the platform's pipeline runs every method on every dataset and publishes the scores.
    Contributors submit no numbers. The only route to a score is adding the implementation to the
    maintainers' repository, hence open-source-gated. Much of the field is entered by the
    maintainers themselves, not by the methods' developers (for instance the winning NeurIPS 2022
    solution, ported in Predict Modality v0.2.0), hence maintainer-run beside it.
  submission_process_source: src-openproblems-docs-philosophy
  submission_process_quote: Community members can actively contribute to the development and
    refinement of single-cell omics benchmarks, which are then run by our computational
    infrastructure.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-openproblems-cell-cell-communication
      quote: Dimitrov et al., 2022 RobustRankAggregate generates a consensus rank of all methods
        implemented in LIANA
  independence_flags_note: >
    Cell-Cell Communication's maintainer, Daniel Dimitrov ("Daniel Dimitrov maintainerauthor" on
    the task page), is an author of LIANA, three of whose seven ranked methods (Log2FC and the
    magnitude and specificity rank aggregates) are cited "Dimitrov et al., 2022"; the paper
    reports LIANA's ensemble among the top performers. Methods from core members' and advisors'
    own labs in other tasks were not checked. The Chan Zuckerberg Initiative, lead sponsor since
    2020, funds competitions, dataset generation and the benchmarking infrastructure; no CZI-built
    method appears on the task pages read, so funded-by-evaluated-party is not adopted.
  independence_assessed: true
  funding:
    source: src-openproblems-about
    quote: Chan Zuckerberg Initiative Lead sponsor Funds competitions, dataset generation, and the
      benchmarking infrastructure.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data are public and every dataset loader, method and metric is a containerised
      component in a public repository, so anyone can run a task's benchmark workflow end to end.
      Some methods need GPUs (compute_tier left null).
    source: src-researchsquare-rs-4181617-v1
    quote: To maximise reproducibility, each component is run within a Docker container defined by
      the method contributor, and all data is downloaded from public repositories
  harness_availability: official-harness
  harness: Each task repository's Viash components and Nextflow benchmark workflow
    (openproblems-bio/task_*, scripts/run_benchmark)
  harness_source: src-openproblems-docs-philosophy
  harness_quote: Viash is a meta-framework which allows generating modular Nextflow components and
    workflows from Python and R scripts
  code_licence: MIT
  code_licence_note: The task pages state each task repository's licence; GitHub's metadata reports
    MIT for openproblems-bio/openproblems and for most task repositories (read 2026-10-14).
  code_licence_source: src-openproblems-batch-integration
  code_licence_quote: Task repository MIT v2.0.0
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which task, task release (results move between release
  # candidates) and dataset, and which pipeline run produced the score.
  material_extra:
    - subset_used
    - harness
aggregation_policy: none-by-design
aggregation_policy_note: Each task ranks its methods by their mean scaled score over its metrics and
  datasets; the platform publishes no score across tasks, and tasks are not comparable with each
  other.
aggregation_policy_source: src-openproblems-batch-integration
aggregation_policy_quote: Methods ranked by scaled overall mean.

homepage: https://openproblems.bio/
repository: https://github.com/openproblems-bio/openproblems
dataset_url: https://openproblems.bio/datasets
leaderboard_url: https://openproblems.bio/benchmarks

subsets:
  - id: open-problems#batch-integration
    label: Batch Integration
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Remove unwanted batch effects from scRNA-seq data while retaining biologically
          meaningful variation.
  - id: open-problems#cell-cell-communication
    label: Cell-Cell Communication
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Detect interactions between ligands and target cell types
  - id: open-problems#cyto-batch-integration
    label: Cyto Batch Integration
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Benchmarking of batch integration algorithms for cytometry data.
      - source: src-openproblems-benchmarks
        quote: in development Cyto Batch Integration
    notes: Marked in development on the benchmarks page.
  - id: open-problems#denoising
    label: Denoising
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Removing noise in sparse single-cell RNA-sequencing count data
  - id: open-problems#dimensionality-reduction
    label: Dimensionality Reduction for Visualisation
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Reduction of high-dimensional datasets to 2D for visualization & interpretation
  - id: open-problems#foundation-models
    label: Foundation Models
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Modelling of single-cells to perform multiple tasks using
    notes: The site's one-line description is cut off as quoted.
  - id: open-problems#label-projection
    label: Label Projection
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Automated cell type annotation from rich, labeled reference data
  - id: open-problems#match-modalities
    label: Match Modalities
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Alignment of cellular profiles from two different modalities
  - id: open-problems#perturbation-prediction
    label: Perturbation Prediction
    scored_separately: true
    domain_override:
      primary: biology-genetics/perturbation-response-prediction
      secondary:
        - biology-genetics/single-cell-analysis
    capability_override:
      - scientific-prediction
      - causal-reasoning
    evidence:
      - source: src-openproblems-perturbation-prediction
        quote: The task is to predict the gene expression profile of a cell after a small molecule
          perturbation.
      - source: src-openproblems-perturbation-prediction
        quote: accurately predict chemical perturbations in new cell types
      - source: src-openproblems-perturbation-prediction
        quote: This task was a Kaggle competition as part of the NeurIPS 2023 competition track.
    notes: The NeurIPS 2023 single-cell perturbation competition's task and dataset, carried onto
      the platform. causal-reasoning is the prediction of a compound's effect in cell types not
      observed under it.
  - id: open-problems#predict-modality
    label: Predict Modality
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Predicting the profiles of one modality (e.g. protein abundance) from another (e.g.
          mRNA expression).
  - id: open-problems#spatial-decomposition
    label: Spatial Decomposition
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Calling cell-type compositions for spot-based spatial transcriptomics data
  - id: open-problems#spatial-simulators
    label: Spatial Simulators
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Assessing the quality of spatial transcriptomics simulators
  - id: open-problems#spatially-variable-genes
    label: Spatially Variable Genes
    scored_separately: true
    evidence:
      - source: src-openproblems-benchmarks
        quote: Spatially variable genes (SVGs) are genes whose expression levels vary significantly
          across different spatial regions within a tissue
subsets_note: >
  The 13 tasks the benchmarks page lists ("showing 13 of 13", src-openproblems-benchmarks), each
  with its own datasets, methods, metrics, control methods, release labels and ranking. Batch
  integration's three output subtasks (feature, embedding, graph) and cell-cell communication's
  two (source-target, ligand-target) from the paper are not recorded as subsets of their own. The
  task repositories in the GitHub organisation include further tasks not listed on the site (for
  instance GRN inference and spatial segmentation), not recorded here.

tags:
  - single-cell

  sources_note: >
    The paper as its PubMed Central author manuscript (a DOI, not archived), read as Europe PMC's full-text
    XML with windows that keep the corresponding author's address and the byline out; nature.com, which
    holds the Supplementary Data and Notes, disallows AI agents and was not fetched. Six Synapse wiki
    pages and one anonymous permissions response, read through the public REST API without an account.
    The DREAM Challenges page for the challenge and the site's search API, read with its 10-second crawl
    delay; the GP-DREAM page at the Broad Institute. Two 2026 papers (DOIs) as Europe PMC full text for
    current use. GRNFormer (Bioinformatics, March 2026), which also scores DREAM5's E. coli and yeast
    data, was read but not kept, because the beeline entry, drafted in parallel, cites it.
  confidence: medium
  review_checks:
    - check: The entry is one challenge, not DREAM and not DREAM5. DREAM runs annual rounds of
        unrelated challenges with their own data, organisers and scoring (DREAM5 alone had four, for
        network inference, systems genetics, TF-DNA motif recognition and epitope-antibody
        recognition), so a DREAM hub entry would hold a different benchmark per challenge, and each
        challenge that is still used gets its own entry. Whether hubs.yaml's DREAM line should map
        to per-challenge entries is for the reviewer.
      field: id
      source: src-dreamchallenges-search-dream5
      quote: DREAM 5 &#8211; Systems Genetics Challenge
    - check: The paper calls the DREAM3 and DREAM4 network inference challenges previous editions,
        and the data page calls DREAM4's in-silico challenge the previous edition. Under 04 S4 those
        could be editions of one network-inference family. They are not modelled so here because
        DREAM3 and DREAM4 scored small simulated networks while DREAM5 scored genome-scale real
        compendia (a different task definition), each has its own paper and data, and none is
        maintained now; if a reviewer prefers a family entry, this becomes its 2010 edition.
      field: versions
      source: src-europepmc-pmc3512113
      quote: we used the same metric as in the previous two editions of the challenge
    - check: lifecycle is active on two 2026 papers that use the data, but neither runs the
        challenge's protocol (the p-value overall score); one scores two networks with its own
        AUROC/AUPRC and the other trains a classifier on the E. coli gold standard. If results only
        under the official protocol count, lifecycle is mature.
      field: lifecycle
      source: src-europepmc-pmc13523312
      quote: Table 1 Performance of different methods on the DREAM datasets
    - check: data.access gated-registration rests on Synapse refusing anonymous download. The
        paper's Supplementary Data 1 on nature.com may be an open copy of the data and gold
        standards, which would make it fully-open; nature.com could not be read, and Europe PMC's
        supplementary-files zip for the manuscript held only an empty PDF entry.
      field: data.access
      source: src-synapse-dream5-data-permissions
      quote: '"isEntityOpenData":false'
    - check: harness_availability official-harness assumes the Synapse "scoring methodology"
        folder's Evaluation scripts.zip is the organisers' scoring code, as the scoring page's
        button says; the zip needs an account and was not opened, so its contents, language and
        licence are unverified. No organiser-maintained GitHub copy was found (a GitHub search on
        2026-11-05 returned four personal repositories).
      field: execution.harness_availability
      source: src-synapse-dream5-scoring
      quote: Scoring Scripts & data
    - check: causal-reasoning is tagged because only direct regulation counts and the data include
        interventions. Correlation-only methods still score far above random on E. coli, so a
        reviewer may read the task as structure prediction alone (scientific-prediction) and drop
        it, as the term's exclusion for observational accuracy might suggest.
      field: capability
      source: src-europepmc-pmc3512113
      quote: Explicit use of such knockouts also helped methods to more reliably draw the direction
        of edges between transcription factors.
    - check: composite is not tagged although the overall score averages two metrics over three
        networks, because both metrics are classification statistics of one ranked list.
        entrant-relative-ranking is tagged because the p-value null is drawn from the participants'
        own edge lists, which the scoring page says gives the scores no absolute meaning.
      field: evaluation_method
      source: src-synapse-dream5-scoring
      quote: since the _p_-values are designed to identify the best and worst relative performance
        but have no absolute interpretation
    - check: maintainer_type conference-workshop. The challenge ran once, was organised by one
        cross-institution team, and is now held by DREAM Challenges on Synapse (Sage Bionetworks);
        nonprofit or academic-lab could be argued. The data page ties the round to a DREAM5
        conference.
      field: governance.maintainer_type
      source: src-synapse-dream5-data
      quote: which will be released after the DREAM5 conference
    - check: One of the paper's three equally contributing first authors is first author of the
        reference given for the second-ranked method (Other 2, ANOVA). The paper does not say
        whether that author took part as a team; if so, a second maintainer-competes case exists
        beside the organisers' off-the-shelf runs.
      field: governance.independence_flags
    - check: The archived board has inconsistent ranks (Correlation 1 is ranked 26 with an overall
        score of 8.126, above methods ranked 16-25; Regression 3 and Meta 1 are both ranked 5). The
        scores were copied as served and no rank is cited elsewhere in the entry.
      field: leaderboard_url
      source: src-synapse-dream5-leaderboards
      quote: Correlation 1|26|8.126|5.632|10.619
    - check: The paper says the in silico data came from GeneNetWeaver version 4.0, the data page
        version 3.0; the paper's chip counts are one higher per real compendium than Synapse's
        table. Neither changes a facet.
      field: data.size
      source: src-synapse-dream5-data
      quote: The in-silico network and dataset was generated using [GeneNetWeaver (GNW) version 3.0]

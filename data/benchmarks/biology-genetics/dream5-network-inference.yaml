    notes: 67 of its arrays perturb a transcription factor; the network used most by later papers.
  - id: dream5-network-inference#net4-s-cerevisiae
    label: Network 4, Saccharomyces cerevisiae
    scored_separately: true
    evidence:
      - source: src-europepmc-pmc3512113
        quote: For the results reported in the main text, we used the most stringent gold standard
    notes: The hardest network for every method; several alternative gold standards exist and the
      most stringent is the official one.


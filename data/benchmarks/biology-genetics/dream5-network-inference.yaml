# data/benchmarks/biology-genetics/dream5-network-inference.yaml
#
# P1-S5-T06, biology-genetics entry 22. Filled from the DREAM5 network inference paper (Nature Methods, 2012) read as
# its PubMed Central author manuscript through Europe PMC's full-text XML (nature.com disallows AI agents in
# robots.txt and was not fetched, so the Supplementary Data and Notes were not read); six wiki pages of the
# challenge's Synapse project syn2787209 (home, description, questions, data, scoring, final leaderboards), read
# through Synapse's public REST API, and Synapse's answer to an anonymous permissions request on the challenge-data
# folder; the DREAM Challenges site's page for the challenge and its search API's list of DREAM5 challenges; the
# GP-DREAM page at the Broad Institute; and, for current use, two 2026 papers read as Europe PMC full text, a causal
# reinforcement-learning method (BMC Bioinformatics, June 2026) and DDTRN (Briefings in Bioinformatics, September
# 2026). Every quote below is checked by the quote-substring validator against those Sources' committed extracts. No
# corpus classification record and no Epoch stub exist for this id. No Synapse file was downloaded: the files need an
# account, and none was used.
#
# Identity: one challenge of the fifth DREAM round, run once in 2010, not the DREAM series (review_checks). Its four
# networks are subsets of one release; there are no editions or revisions.

id: dream5-network-inference
name: DREAM5 Network Inference Challenge
aliases:
  - DREAM5 - Network Inference
  - DREAM5 transcriptional network inference challenge
tagline: Genome-scale gene regulatory network inference from four expression compendia, scored by
  AUPR and AUROC (2010).
description: >
  The transcriptional network inference challenge of DREAM5, the fifth annual round of DREAM systems biology
  challenges, open from June to October 2010. Participants received four anonymised microarray compendia
  -- E. coli (805 chips, 4,511 genes), S. aureus (160 chips), S. cerevisiae (536 chips) and an in silico
  network simulated with GeneNetWeaver on the E. coli network's structure -- each with a list of candidate
  transcription factors and descriptions of every chip's perturbations, and submitted for each network
  a ranked list of up to 100,000 directed transcription factor-target edges. Gene names were replaced
  by arbitrary labels and about 5% decoy genes added, so that the organisms could not be recognised. Edges
  were scored by AUPR and AUROC against RegulonDB's strong-evidence interactions for E. coli (2,066),
  a ChIP-chip and conserved-motif gold standard for yeast, and the known network (3,940 interactions)
  for the in silico case. Each area was turned into a p-value against random edge lists drawn from the
  participants' own submissions, and the overall score is the mean of the -log10 p-values over the three
  networks and the two metrics. S. aureus, which lacks a large enough set of known interactions, was not
  scored. 29 teams and six off-the-shelf methods run by the organisers were ranked; a random forest method
  (GENIE3) and an ANOVA method led, and the organisers' community network, built by averaging every team's
  ranks, scored best of all. The data, gold standards and scoring scripts sit in a Synapse project whose
  files need a free account, and papers in 2026 still report results on the E. coli and yeast networks,
  mostly with their own protocols.
self_description:
  source: src-europepmc-pmc3512113
  quote: we performed a comprehensive blind assessment of over thirty network inference methods on
    Escherichia coli, Staphylococcus aureus, Saccharomyces cerevisiae, and in silico microarray data
paper:
  title: Wisdom of crowds for robust gene network inference
  doi: 10.1038/nmeth.2016
  source: src-europepmc-pmc3512113
released: null
released_note: The Synapse home page gives the launch as June 2010 and the close as October 2010,
  without days. The DREAM Challenges site's page for the challenge is dated 9 June 2010, but that is
  the page's own date (it was last modified in 2021), not a stated launch day. The paper was
  published on 2012-07-15.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/systems-biology
domain_basis:
  reason: The scored object is a whole transcriptional regulatory network, genome-scale, recovered
    from expression compendia and compared edge by edge with known interactions; nothing is
    predicted about one gene in isolation. That is the leaf's definition, a network modelled as a
    system rather than properties of its components.
  source: src-europepmc-pmc3512113
  quote: the challenge is to computationally predict direct regulatory interactions between a
    transcription factor and its target genes
domain_considered_and_rejected:
  - term: biology-genetics/transcriptomics
    reason: The inputs are bulk expression compendia, but the leaf scores a biological state or
      condition inferred from them; here the output is a network of regulatory edges, and no state
      or condition is predicted.
  - term: biology-genetics/regulatory-genomics
    reason: The leaf predicts regulatory activity directly from genomic sequence. The challenge gave
      no sequence; the anonymised data were expression values, chip descriptions and candidate
      transcription factors. Promoter sequences are named in the paper only as an input that yeast
      inference may need in future.
  - term: biology-genetics/perturbation-response-prediction
    reason: Perturbation experiments are inputs (knockouts, overexpression, drugs), but no response
      to an unseen perturbation is predicted or scored.
  - term: biology-genetics/single-cell-analysis
    reason: The compendia are microarrays of bulk samples; no single-cell measurement is involved.
capability:
  - scientific-prediction
  - causal-reasoning
capability_basis:
  scientific-prediction:
    reason: The claim is that methods recover the regulatory structure of real organisms from
      measurements of them, and the prediction is scored against interactions supported by
      experiment (RegulonDB's strong-evidence set for E. coli, binding and conservation data for
      yeast) or the simulated network's true edges.
    source: src-synapse-dream5-home
    quote: The goal of this Network Inference Challenge is to reverse engineer gene regulatory
      networks from gene expression datasets.
  causal-reasoning:
    reason: An edge counts only if the transcription factor directly regulates the target; a
      co-expressed pair that is regulated indirectly, through a cascade or a feed-forward loop, is a
      false positive. The compendia include knockouts and overexpression, which the paper found let
      methods direct edges between transcription factors, and it names telling direct from indirect
      regulation as the open problem (review_checks).
    source: src-europepmc-pmc3512113
    quote: develop more effective approaches to distinguish direct from indirect regulation
      (feed-forward loops vs. cascades)
capability_considered_and_rejected:
  - term: inductive-reasoning
    reason: The network is inferred from many observations, but what is scored is a ranked list of
      individual edges against known interactions, a structure of the system rather than a rule or
      law that the term's inclusion test asks for; scientific-prediction covers it.
  - term: hypothesis-generation
    reason: The output is a ranked list of candidate interactions, but it is scored as a
      reconstruction against interactions already known. The paper's wet-lab test of 53 novel
      interactions was run on the organisers' community network, not on any entrant's submission,
      and scores no one (review_checks).
  - term: distribution-shift-generalization
    reason: The paper's finding is that methods' rankings do not carry across organisms, but every
      network is scored as a condition of its own with no source-target split, and the overall score
      averages them.

evaluation_method:
  - classification-metric
  - entrant-relative-ranking
evaluation_method_basis:
  reason: Each network's edge list is scored as a binary classification against its gold standard,
    by the areas under the precision-recall and ROC curves, general statistics of a score ranking
    (classification-metric). The official ranking does not use the areas themselves. Each is turned
    into a p-value against a null of random edge lists sampled from the participants' own
    submissions, so the scores change when the pool of entrants changes, and the overall score is
    the mean of the -log10 p-values (entrant-relative-ranking).
  source: src-europepmc-pmc3512113
  quote: Random edge lists were constructed by sampling edges from the submitted edge lists of the
    participants
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The overall score averages AUPR- and AUROC-derived scores over three networks, but both
      are classification statistics of the same ranked list, one method over its own sweep, which
      the term's exclusion leaves out (review_checks).
  - term: wet-lab-validation
    reason: The qPCR tests of 53 novel E. coli interactions validated the organisers' community
      network after the challenge; no entrant was scored by them.
  - term: domain-metric
    reason: AUPR and AUROC are general-purpose statistics; the term's exclusion names AUROC.
designed_for_subjects:
  - classical-algorithm
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The 35 methods ranked include statistical and information-theoretic procedures with no
    learned component (Pearson and Spearman correlation, mutual information with CLR and ARACNE),
    and per-dataset fitted models built for this biological task (lasso regressions, Bayesian
    networks, the random forests of GENIE3, a neural network trained by a genetic algorithm).
    Methods since are mostly deep-learning models made for regulatory network inference, which the
    term's discipline rule sends to domain-specialist-model.
  source: src-europepmc-pmc3512113
  quote: 29 submitted by participants and an additional 6 commonly used
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: Network inference is a task that systems biology defines, which the term's exclusion
      sends to domain-specialist-model, and most entrants fit no supervised labels at all.
  - term: scientific-surrogate-model
    reason: No entrant stands in for a simulator or an assay; the output is a network structure
      scored against known interactions.
as_used:
  - protocol: The E. coli and S. cerevisiae networks only, each scored by AUROC and AUPRC, with
      unsupervised methods (PCC, GENIE3, GRNRI, the authors' own) and supervised ones (GNE, CNNC,
      GENELink and others) in one table. The challenge's p-value scoring, overall score and in
      silico network are not used, and the passages read do not say how negatives were chosen.
      GENIE3's E. coli AUPRC is 0.51 there, against 0.093 for GENIE3 (Other 1) on the challenge's
      board, so the numbers are on another scale.
    split: Network 3 (E. coli) and Network 4 (S. cerevisiae), from Synapse syn2787209
    source: src-europepmc-pmc13523312
    quote: GENIE3 0.65 0.51 0.66 0.57
    note: A causal reinforcement-learning method (BMC Bioinformatics, June 2026), which also reports
      on BEELINE's scRNA-seq data.
  - protocol: The E. coli gold standard alone (2,066 interactions among 4,297 genes, 334
      transcription factors) used as labels for a balanced binary classification of transcription
      factor-target pairs from the two genes' DNA sequences, each positive paired with one sampled
      negative; no expression data and no ranked genome-wide edge list. Scored by AUROC, AUPR and F1
      beside seven other bacterial networks.
    split: Dream5_Ecoli (the Network 3 gold standard)
    source: src-europepmc-pmc13619341
    quote: A balanced dataset was constructed for each bacterial species by pairing all known
      positive regulatory interactions
    note: DDTRN (Briefings in Bioinformatics, September 2026). The gene count differs from the
      challenge's 4,511 for Network 3.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument's data and gold standards; papers in
    June and September 2026 score methods on the E. coli and yeast networks (as_used). The
    challenge's formal ending is recorded in activity (ADR-0019).
  source: src-europepmc-pmc13523312
  quote: Experiments on the DREAM5 dataset and scRNA-seq datasets of six cell types from BEELINE
    demonstrate
activity: closed
activity_note: The challenge ran once and its board is titled final. The GP-DREAM web platform built
  from its top methods was decommissioned in 2016 for lack of funding, and the DREAM website the
  paper cites for the data no longer answered on 2026-11-05.
activity_basis:
  reason: Submissions were taken from June to October 2010 and the Synapse project holds the final
    leaderboards; no route for entering new results exists, and later results are self-scored in
    their authors' papers.
  source: src-synapse-dream5-home
  quote: 'Close Date: October 2010'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GENIE3 (Other 1, first by overall score among the 35 methods)
    source: src-europepmc-pmc3512113
    observed_on: 2026-11-05
    quote: 'Genie3: A random forest is trained to predict target gene expression.'
  - system: The causal reinforcement-learning framework (a deep Q-network), June 2026
    source: src-europepmc-pmc13523312
    observed_on: 2026-11-05
    quote: Experiments on the DREAM5 dataset and scRNA-seq datasets of six cell types from BEELINE
      demonstrate
  - system: DDTRN and six machine-learning baselines, September 2026
    source: src-europepmc-pmc13619341
    observed_on: 2026-11-05
    quote: Dream5_Ecoli AUROC 0.8213
evaluation_target: mixed
evaluation_target_note: Correlation and mutual-information procedures with no learned component are
  ranked beside per-dataset regressions, Bayesian networks and random forests, and later beside deep
  models.
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The gold standards were not given to participants, and the real organisms
  were disguised. E. coli's is RegulonDB's interactions with strong evidence (2,066); yeast's the
  most stringent of several, interactions with both ChIP-chip binding and a conserved motif; the in
  silico network's is the simulated network itself (3,940 interactions). The gold standards are
  incomplete, so some negatives may be unknown true interactions.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The expression data, gold standards and scoring scripts are on Synapse for anyone with a
    free account, so a new method can be scored on the official networks; only the p-value null,
    drawn from the 2010 participants' edge lists, ties the official score to the original pool.
  source: src-europepmc-pmc3512113
  quote: All data and scripts are available in Supplementary Data 1 and at the DREAM website

task:
  exists: true
  input:
    - for each of four networks, an expression matrix (chips by anonymised genes), a table of each
      chip's perturbations (deletions, overexpression, drugs, time point, replicate), and a list of
      candidate transcription factors
  output: For each network, a ranked list of at most 100,000 directed, unsigned edges from a
    candidate transcription factor to a gene, with a confidence between 0 and 1; self-interactions
    are ignored.
  scoring: AUPR and AUROC per network against its gold standard, edges beyond the list treated as
    randomly ordered and genes outside the gold standard ignored; each area converted to a p-value
    against 25,000 random edge lists, and the overall score the mean of the AUROC- and AUPR-derived
    scores, each the mean -log10 p-value over the in silico, E. coli and yeast networks.
  source: src-synapse-dream5-scoring
  quote: Finally, an overall score is obtained as the mean of the AUROC and AUPR derived scores.

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: The challenge data, the original (de-anonymised) data, the scoring scripts with the
    gold standards, and the publication data sit in Synapse folders that anyone may view, but an
    anonymous request is refused download. Synapse accounts are free; none was created. The paper
    also points to its Supplementary Data 1 on nature.com, which was not read (robots.txt), and to a
    DREAM website on wiki.c2b2.columbia.edu and an M3D page at Boston University, neither of which
    answered on 2026-11-05.
  access_basis:
    reason: The files are released, labels included, but the official copy read needs an account to
      download.
    source: src-synapse-dream5-data-permissions
    quote: '"canDownload":false'
  refresh: static
  refresh_basis:
    reason: The challenge ran once, in 2010, and its compendia, gold standards and scoring are those
      of that round. The Synapse copy (2014) added an "original data" folder in 2015 without
      changing what is scored.
    source: src-synapse-dream5-home
    quote: 'Launch Date: June 2010'
  data_provenance:
    - curated-public-database
    - simulation-generated
  data_provenance_note: The three real compendia are Affymetrix arrays selected from GEO and
    normalised by RMA; the E. coli gold standard is drawn from RegulonDB and the yeast one from
    published ChIP-chip and conserved-motif data. The in silico compendium and its network come from
    GeneNetWeaver simulations, on a structure taken from the E. coli network with 10% random edges
    added. experimental-measurement was considered for the yeast binding data, but they are used as
    a published, filtered map rather than a measurement made for the challenge.
  data_provenance_source: src-europepmc-pmc3512113
  data_provenance_quote: Affymetrix gene expression datasets were compiled for E. coli, S. aureus,
    and S. cerevisiae from the Gene Expression Omnibus (GEO) database
  contamination_risk: high
  contamination_risk_note: During the challenge the organisms were disguised by arbitrary gene
    labels and decoy genes, so prior knowledge of E. coli regulation could not be used. Since 2015
    an "original data" folder, with subfolders named for the organisms, sits beside the challenge
    data (its README was not read), the E. coli gold standard is a public RegulonDB extract, and
    supervised methods now train on the gold standards themselves (as_used). No source checks a
    method's training data or prior knowledge against the gold standards.
  contamination_risk_source: src-synapse-dream5-data
  contamination_risk_quote: Download Original Data
  contamination_evidence:
    - source: src-europepmc-pmc3512113
      stance: against
      quote: It is important to note that the identity of the organisms from which the data was
        generated was unknown to the participants.
    - source: src-synapse-dream5-questions
      stance: against
      quote: a set of decoy genes, representing roughly 5% of the compendium, were introduced by
        randomly selecting gene expression values from the compendium, itself
  ceiling_anchor_type_note: No human or measured ceiling is given. The gold standards are
    incomplete, so a perfect reconstruction would not score a perfect AUPR, and the official scores
    are p-values relative to the entrants' pool with no absolute interpretation.
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the challenge data, the gold standards
    or the scripts. GEO, RegulonDB and the yeast binding data keep their own terms, which were not
    read.
  size:
    - count: 4
      unit: networks, each an expression compendium with its candidate transcription factors (three
        scored)
      subset: all
      source: src-synapse-dream5-description
      quote: In order to participate in the challenge, predictions for all four networks must be
        submitted (there are no sub-challenges).
    - count: 805
      unit: microarray chips; 4,511 genes, 334 candidate transcription factors
      subset: dream5-network-inference#net3-e-coli
      source: src-synapse-dream5-description
      quote: Network 3 | _E. coli_ | 334 | 4511 | 805
    - count: 536
      unit: microarray chips; 5,950 genes, 333 candidate transcription factors
      subset: dream5-network-inference#net4-s-cerevisiae
      source: src-synapse-dream5-description
      quote: Network 4 | _S. cerevisiae_ | 333 | 5950 | 536
    - count: 805
      unit: simulated chips; 1,643 genes, 195 candidate transcription factors
      subset: dream5-network-inference#net1-in-silico
      source: src-synapse-dream5-description
      quote: Network 1 | _in silico_ | 195 | 1643 | 805
    - count: 160
      unit: microarray chips; 2,810 genes, 99 candidate transcription factors
      subset: dream5-network-inference#net2-s-aureus
      source: src-synapse-dream5-description
      quote: Network 2 | _S.aureus_ | 99 | 2810 | 160
    - count: 2066
      unit: gold-standard interactions (RegulonDB, strong evidence)
      subset: dream5-network-inference#net3-e-coli
      source: src-europepmc-pmc3512113
      quote: according to RegulonDB evidence classification (2,066 interactions)
    - count: 3940
      unit: interactions in the simulated network (its gold standard)
      subset: dream5-network-inference#net1-in-silico
      source: src-europepmc-pmc3512113
      quote: 10% random edges were added, resulting in 3,940 interactions
    - count: 35
      unit: inference methods ranked (29 teams' and 6 off-the-shelf methods run by the organisers)
      subset: the 2010 challenge
      source: src-europepmc-pmc3512113
      quote: 29 submitted by participants and an additional 6 commonly used
  size_note: The paper counts one chip more per real compendium than the Synapse table (806 E. coli,
    537 yeast and 161 S. aureus arrays). The size of the yeast gold standard is not in the main
    text, and the Supplementary Notes that give it were not read.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: DREAM Challenges (the Synapse project and the dreamchallenges.org page, run by Sage
    Bionetworks); organised in 2010 by authors at MIT and the Broad Institute, Boston University and
    IBM Research
  maintainer_basis:
    reason: The challenge's data, scoring scripts and final leaderboards are kept in the DREAM
      Synapse project, and the DREAM Challenges site that lists it is copyrighted to DREAM
      Challenges and powered by Sage Bionetworks. The paper's organisers were at MIT CSAIL and the
      Broad Institute, Boston University and the IBM T. J. Watson Research Center.
    source: src-dreamchallenges-dream5-network-inference
    quote: Copyright DREAM Challenges . Powered by Sage Bionetworks
  maintainer_type: conference-workshop
  maintainer_type_note: DREAM runs annual rounds of challenges whose results meet at a DREAM
    conference, and each challenge has its own organising team; the sources read name organisers for
    this challenge only. nonprofit (Sage Bionetworks, which now hosts the archive) and academic-lab
    were considered (review_checks).
  submission_process:
    - held-out-server
  submission_process_note: Teams submitted ranked edge lists for all four networks by the deadline,
    and the organisers scored them after it against gold standards the teams never received, with
    the organisms disguised. No route for new submissions exists now; later results are computed by
    their authors on the released data, which the closed activity records.
  submission_process_source: src-synapse-dream5-data
  submission_process_quote: For each network, submit a ranked list of no more than 100,000
    regulatory link predictions
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-europepmc-pmc3512113
      quote: Off-the-shelf algorithm applied by challenge organizers.
  independence_flags_note: The organisers ran six off-the-shelf methods (CLR, ARACNE and others)
    that are ranked beside the 29 teams, and built the community network, which leads the board by
    far (overall score 52.43 against 40.28 for the best team). The paper also reports its own
    funding (NIH, HHMI, the Swiss National Science Foundation); no evaluated party is among the
    funders named, and no prize is mentioned. One of the three equally contributing first authors is
    first author of the reference given for the second-ranked method (Other 2); whether that author
    entered it as a team is not stated (review_checks).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Scoring an edge list is trivial on a CPU, but a run means running the inference
    method on genome-scale compendia (up to 5,950 genes), and no source states the cost.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data, gold standards and the organisers' scripts are released, so a new method can
      be scored end to end with no human or physical step; the Synapse account is a registration
      gate, not a blocker the vocabulary lists.
    source: src-europepmc-pmc3512113
    quote: All data and scripts are available in Supplementary Data 1 and at the DREAM website
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The organisers' evaluation scripts (Evaluation scripts.zip, with INSTRUCTIONS.txt, in the
    Synapse folder "scoring methodology", syn2787214), not read because they need an account
  harness_source: src-synapse-dream5-scoring
  harness_quote: Scoring Scripts & data
  code_licence: null
  code_licence_note: No licence is stated for the evaluation scripts on any page read, and the
    scripts were not opened. The GP-DREAM modules' code is offered as an archive on the Broad page,
    also without a stated licence.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which networks (the in silico one is often dropped, S. aureus was never
  # scored), which yeast gold standard (the paper's main one is the most stringent of several), the scoring
  # (the challenge's p-values against the 2010 pool, raw AUPR over all pairs, or AUPR over sampled balanced
  # negatives, which moves GENIE3's E. coli AUPR from 0.093 to 0.51), and whether the method trained on the
  # gold standards or on prior knowledge.
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: Teams were ranked by one overall score combining the AUROC- and AUPR-derived p-value
    scores over the three scored networks; per-network areas are shown beside it.
  source: src-synapse-dream5-scoring
  quote: Teams will be ranked according to their overall performance over the four networks of a
    challenge.


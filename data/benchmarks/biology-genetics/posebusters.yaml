# data/benchmarks/biology-genetics/posebusters.yaml
#
# P1-S6-T01, chemistry-materials entry 10 of 10, filed under biology-genetics. The corpus files PoseBusters under
# chemistry-materials, but the scored quantity is a ligand's pose in its protein, which both families' tests and
# ADR-0020 send to biology-genetics/protein-ligand-cofolding, and an entry lives under the family of its
# domain.primary (tools/validate/tiers.py). Filled from the PoseBusters paper, arXiv 2308.05777 read as its v3 PDF
# (2023-11-28; Chemical Science 2024), and its abstract page; the repository README and LICENSE at main; the
# Zenodo record of the paper's data (its API JSON); and the v2 PDF of DeCAF (arXiv 2606.08375, June 2026), a
# co-folding paper that reports PoseBusters success rates. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: posebusters
name: PoseBusters
tagline: Protein-ligand docking scored by RMSD within 2 Å of the crystal pose plus an RDKit battery
  of physical-validity checks.
description: >
  A benchmark and a Python test suite for predicted protein-ligand poses, from Oxford's Department of
  Statistics. Methods re-dock each ligand into its own receptor's crystal structure, or co-fold the complex,
  and a pose succeeds only if its symmetry-aware heavy-atom RMSD to the crystal ligand is within 2 Å and
  it
  is PB-valid: it passes every check in the suite, which tests chemical consistency with the true ligand
  (formula, bonds, stereochemistry), intramolecular geometry and energy (bond lengths and angles, planar
  rings, internal clashes, an energy ratio), and clashes with the protein and cofactors. Two sets are
  scored. The Astex Diverse set (85 complexes, 2007) is easy, because most of it is in the training data
  of
  the deep-learning methods. The PoseBusters Benchmark set (308 complexes released from 2021, 428 before
  a
  crystal-contact filter was added in the paper's second version) holds none of PDBbind 2020. The release
  paper compared five deep-learning docking methods with AutoDock Vina and Gold; there is no leaderboard,
  and co-folding papers report their own numbers, often on subsets they filter themselves.
self_description:
  source: src-arxiv-2308-05777-v3
  quote: Only methods that both pass these checks and predict native-like binding modes should be
    classed as having
external_ids:
  arxiv: '2308.05777'
paper:
  title: 'PoseBusters: AI-based docking methods fail to generate physically valid poses or generalise
    to novel sequences'
  arxiv: '2308.05777'
  doi: 10.1039/D3SC04185A
  version_read: v3
  source: src-arxiv-2308-05777-v3
released: 2023-08-10
released_note: The paper's first arXiv version, as its abstract page dates it. The journal version
  is Chemical Science 15(9), 3130-3139 (2024), whose DOI is paper.doi.
released_source: src-arxiv-2308-05777
released_quote: Submitted on 10 Aug 2023

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/protein-ligand-cofolding
domain_basis:
  reason: The scored quantity is the pose of a small molecule bound to a protein, re-docked into the
    given receptor structure, which the leaf's inclusion test covers whatever the method. The
    chemistry-materials family's exclusion test sends a ligand scored for how it binds a protein, as
    a bound pose, to this leaf, so no chemistry-materials leaf is primary or secondary
    (review_checks).
  source: src-arxiv-2308-05777-v3
  quote: These poses were generated by re-docking the cognate ligands
domain_considered_and_rejected:
  - term: chemistry-materials/generative-molecular-design
    reason: The check suite also validates molecules generated without a protein, or for a given
      protein, but the benchmark's two sets score re-docked poses against crystal ligands; no
      generated molecule is scored against a property specification.
    source: src-github-posebusters-readme
    quote: Check re-docked ligand (a pose that should recover the ligand in a given protein-ligand
      crystal complex).
  - term: chemistry-materials/experimental-hit-finding
    reason: No compound is nominated or assayed; the ground truth is a deposited crystal structure.
  - term: biology-genetics/drug-target-interaction
    reason: Only the pose is scored. No binding strength is predicted.
capability:
  - scientific-prediction
  - constraint-satisfaction
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: The paper's claim is that methods predict a ligand's binding mode in a protein, and the
      prediction is scored against the experimentally solved crystal pose.
    source: src-arxiv-2308-05777-v3
    quote: is the task of predicting the predominant binding modes of a protein-ligand complex given
      an experimentally solved or computationally modelled protein structure and a ligand structure
  constraint-satisfaction:
    reason: A pose counts only if it passes every check in the battery; any single failure makes it
      invalid. The paper claims physical validity, not instruction compliance, which the taxonomy's
      tie-break between this term and instruction-following turns on.
    source: src-arxiv-2308-05777-v3
    quote: Only methods that both pass these checks and predict native-like binding modes should be
      classed as having
  distribution-shift-generalization:
    reason: The PoseBusters Benchmark set is built from complexes outside the methods' training data
      and reported as its own condition beside the Astex Diverse set, and its results are further
      split by the receptor's sequence identity to PDBbind 2020.
    source: src-arxiv-2308-05777-v3
    quote: The PoseBusters Benchmark set was designed to contain no complexes that are in the
      training data for any of the methods.
capability_considered_and_rejected:
  - term: generation-fidelity
    reason: The pose is compared with a target by a distance, but it is a predicted structure of a
      physical system scored against measurement, which the term's exclusion sends to
      scientific-prediction.
  - term: optimization
    reason: Poses are scored on validity checks and RMSD to the crystal pose, not on an objective
      the method minimises.
  - term: instruction-following
    reason: The conditions are physical validity checks, and the paper claims validity, not
      compliance with stated directions.
  - term: spatial-reasoning
    reason: The scored quantity is how closely a predicted pose reproduces the crystal pose, which
      the term's exclusion leaves out as reconstruction accuracy.

evaluation_method:
  - constraint-check
  - domain-metric
evaluation_method_basis:
  reason: PB-validity is a programmatic battery of checks on each output pose, any failure
    invalidating it (constraint-check). The accuracy half is the docking field's success criterion,
    a symmetry-aware heavy-atom ligand RMSD to the crystal pose within 2 Å, computed per pose
    (domain-metric). The headline is the share of poses meeting both.
  source: src-arxiv-2308-05777-v3
  quote: Coverage, a metric often used for testing docking methods, is the share of predictions that
    are within a user adjustable threshold which by default is 2 Å RMSD
evaluation_method_considered_and_rejected:
  - term: numeric-tolerance-match
    reason: The answer is a pose, not a number. The 2 Å threshold applies to a structural distance
      computed from the pose, as COCO's IoU thresholds apply to boxes, and the taxonomy reads those
      as domain-metric (review_checks).
  - term: composite
    reason: The headline is a per-pose conjunction of the RMSD criterion and the battery, not a
      weighted or averaged combination of sub-scores, which the term's inclusion test asks
      (review_checks).
  - term: statistical-fit
    reason: RMSD is not reported as an error statistic over all predictions; each pose's RMSD is
      thresholded and the successes counted.
  - term: execution-tests
    reason: The checks validate a structure; nothing is executed.
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The suite was built to test deep-learning docking methods trained on PDBbind (DeepDock,
    DiffDock, EquiBind, TankBind, Uni-Mol), and co-folding models now report on it. AutoDock Vina
    and Gold are compared beside them; under the term's test the regression fitted once into Vina's
    scoring function does not make it learned.
  source: src-arxiv-2308-05777-v3
  quote: two well-established standard docking methods (AutoDock Vina and CCDC Gold)
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: A docking or co-folding model does not stand in for a solver or an assay run; the
      reference is a deposited crystal structure, and CASP's entry rejects the term for structure
      predictors the same way.
  - term: task-specific-supervised-model
    reason: The task is defined by structural biology and drug discovery, which the term's exclusion
      sends to domain-specialist-model.

as_used:
  - protocol: Co-folding models scored best of five on PoseBusters complexes released from
      2021-10-01 that Boltz-1 can run on one A100-80GB GPU, 282 structures, with success as RMSD
      under 2 Å and PB-valid.
    source: src-arxiv-2606-08375-v2
    quote: with cutoff date of 2021-10-01, yielding 282 structures that can be handled by Boltz-1 on
      a single A100-80GB GPU
    note: DeCAF (June 2026; Genesis Molecular AI with MIT, CMU, Imperial College and Mila). The
      paper does not say whether it filtered the 428 or the 308 set; its best success rate on the
      subset is 65.9%.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the PoseBusters Benchmark set; a June 2026 co-folding
    paper reports success rates on it (as_used). The repository was last pushed on 2026-10-03
    (GitHub API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2606-08375-v2
  quote: with cutoff date of 2021-10-01, yielding 282 structures that can be handled by Boltz-1 on a
    single A100-80GB GPU
activity: no-submission-channel
activity_basis:
  reason: The README offers installation, usage and the paper's data, with issues for code problems
    only. There is no leaderboard, server or submission route, and no source shows one ever existed.
  source: src-github-posebusters-readme
  quote: For code issues, please open an issue.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DiffDock
    source: src-arxiv-2308-05777-v3
    observed_on: 2026-10-14
    quote: DiffDock 7 uses equivariant graph neural networks in a diffusion process for blind
      docking.
  - system: DECAF-Boltz (a few-step distillation of Boltz-1x)
    source: src-arxiv-2606-08375-v2
    observed_on: 2026-10-14
    quote: DECAF-Boltz statistically improves over Boltz-1x in both accuracy (RMSD) and physical
      validity scores of protein-ligand poses
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: experimental
ground_truth_source_note: Deposited X-ray crystal structures from the PDB. The PoseBusters set keeps
  structures with a resolution of at most 2 Å and well-fitting ligand density (Table S1).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Both sets, with the paper's per-method test results, are on Zenodo under CC BY 4.0, and
    the check suite is a public package that computes both the RMSD and the checks.
  source: src-arxiv-2308-05777-v3
  quote: Data for this paper, including the Astex Diverse set and PoseBusters Benchmark set, as well
    as the individual tabulated test results for each docking are available at Zenodo

task:
  exists: true
  input:
    - a protein crystal structure with its cofactors, and the ligand to place (the paper's methods
      were given an RDKit starting conformation); co-folding methods take the sequence and the
      ligand instead
  output: One ligand pose in the protein (the top-ranked one in the paper; other users report best
    of five).
  scoring: The share of complexes whose pose has a symmetry-aware heavy-atom RMSD within 2 Å of the
    crystal ligand and passes every PoseBusters check, reported beside the RMSD-only share, per set.
  source: src-arxiv-2308-05777-v3
  quote: The striped bars show the share of predictions of each method that have an RMSD within 2 Å
    and the solid bars show the subset that in addition have valid geometries and energies

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Both sets, receptors and crystal ligands included, are an open Zenodo download linked
      from the README, under CC BY 4.0.
    source: src-github-posebusters-readme
    quote: The data used for the paper is available at
  refresh: versioned-releases
  refresh_basis:
    reason: The PoseBusters Benchmark set changed once, with the paper's dated second arXiv version,
      which removed ligands with crystal contacts and took the set from 428 to 308 complexes
      (versions).
    source: src-arxiv-2308-05777
    quote: version 2 added an additional filter to the PoseBusters Benchmark set to remove ligands
      with crystal contacts
  data_provenance:
    - experimental-measurement
    - inherited-from-constituents
  data_provenance_note: The ground truth is X-ray crystal structures. The PoseBusters Benchmark set
    was selected from the PDB by the authors' filters; curated-public-database was considered, but
    PDB entries are raw structures, not curated annotations. The Astex Diverse set is a published
    2007 docking benchmark reused whole.
  data_provenance_source: src-arxiv-2308-05777-v3
  data_provenance_quote: The PoseBusters Benchmark set is a new set of carefully-selected
    publicly-available crystal complexes from the PDB.
  contamination_risk: high
  contamination_risk_note: The split is the Astex Diverse set, which the benchmark still scores. 47
    of its complexes are in the PDBbind 2020 General Set that the five deep-learning methods trained
    on, and Vina's scoring function was fitted to an earlier PDBbind that held most of it. The
    PoseBusters Benchmark set holds only complexes released from January 2021, outside PDBbind 2020,
    but co-folding models trained on the PDB up to late 2021 can contain its earliest complexes; the
    June 2026 paper in as_used drops those before 2021-10-01.
  contamination_risk_source: src-arxiv-2308-05777-v3
  contamination_risk_quote: 47 of the 81 complexes in the Astex Diverse set are in the PDBbind 2020
    General Set
  contamination_evidence:
    - source: src-arxiv-2308-05777-v3
      stance: supports
      quote: Good performance on this set is expected because the five DL-based methods evaluated
        here have been trained on most of these complexes.
    - source: src-arxiv-2308-05777-v3
      stance: against
      quote: It only contains complexes released since 2021 and therefore does not contain any
        complexes present in the PDBbind General Set v2020 used to train many of the methods.
  ceiling_anchor_type: measured-ceiling
  ceiling_anchor_type_basis:
    reason: The crystal ligands, the gold solutions, were run through the checks, and every
      threshold was set so that all, or all but one, of them pass; their RMSD to themselves is zero.
      So close to 100% is shown reachable, though the paper gives no combined oracle score
      (review_checks).
    source: src-arxiv-2308-05777-v3
    quote: This was selected as all but one of the crystal ligands in the Astex Diverse set and all
      of those in the PoseBusters Benchmark set pass at this threshold.
  dataset_licence: CC-BY-4.0
  dataset_licence_source: src-zenodo-posebusters
  dataset_licence_quote: '"license": {"id": "cc-by-4.0"}'
  size:
    - count: 308
      unit: protein-ligand complexes (308 unique PDB entries, 308 unique ligands)
      subset: PoseBusters Benchmark set, v2 (the journal paper's)
      source: src-arxiv-2308-05777-v3
      quote: The final PoseBusters Benchmark set consists of 308 unique PDB entries containing 308
        unique ligands.
    - count: 85
      unit: protein-ligand complexes
      subset: Astex Diverse set
      source: src-arxiv-2308-05777-v3
      quote: The Astex Diverse set (85 cases) was chosen as an easy test set containing many
        complexes the five DL-based methods were trained on
    - count: 428
      unit: protein-ligand complexes
      subset: PoseBusters Benchmark set, v1 (before the crystal-contact filter)
      source: src-zenodo-posebusters
      quote: The PoseBusters Benchmark set was curated by us using the PDB and contains 428 cases.
  size_note: The paper's introduction and its training-overlap sentence count the Astex Diverse set
    as 81 complexes, while its figures, results and complex list, and the Zenodo record, have 85.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Martin Buttenschoen (the posebusters repository's owner; the paper's authors are at
    the University of Oxford)
  maintainer_basis:
    reason: The package, with the benchmark's code, sits in the first author's personal GitHub
      account (maabuu), and its licence names him as copyright holder. No institution is stated as
      holding it.
    source: src-github-posebusters-license
    quote: Copyright (c) 2025 Martin Buttenschoen
  maintainer_type: individual
  maintainer_type_note: academic-lab was considered. The three authors give University of Oxford
    affiliations, and the Zenodo data record lists all three, but the term's holder rule reads a
    personal-account host as individual whatever the authors' affiliations.
  submission_process:
    - literature-only
  submission_process_note: The only maintainer results are the release paper's comparison of seven
    docking methods, and no ranking is kept. Others run the package and report in their own papers.
  submission_process_source: src-arxiv-2308-05777-v3
  submission_process_quote: M. B. performed the computational experiments, created the PoseBusters
    software, and wrote the original draft.
  independence_flags:
    - flag: no-known-conflict
      source: src-arxiv-2308-05777-v3
      quote: There are no conflicts to declare.
  independence_flags_note: The seven docking methods the paper evaluates are all third-party, and
    the authors enter no method of their own. The arXiv version states no funding; the Chemical
    Science version was not read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: The checks are RDKit on CPU, but a run means running the docking or co-folding
    method under test, from CPU programs such as Vina to models that need a large GPU, and no source
    states the cost.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The sets are public, and the package computes both the RMSD and the checks with no
      human, physical or maintainer-only step.
    source: src-arxiv-2308-05777-v3
    quote: PoseBusters is made available as a pip-installable Python package and as open source code
      under the BSD-3-Clause license at github.com/maabuu/posebusters.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: posebusters (the pip package's `bust` command, re-docking mode with the true ligand and
    the protein)
  harness_source: src-github-posebusters-readme
  harness_quote: bust ligand_pred.sdf -l mol_true.sdf -p protein.pdb
  code_licence: MIT
  code_licence_note: The paper states BSD-3-Clause, the licence until 2025-11-29 (history).
  code_licence_source: src-github-posebusters-license
  code_licence_quote: MIT License
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which set and version (Astex 85, PoseBusters 428 or 308, or a subset the user
  # filtered by date or by what fits a GPU), the method's training cutoff against the sets' release dates, how
  # the pose is chosen (top-ranked or best of five), and the posebusters version and thresholds. The binding-site
  # definition (blind or pocket, and how large) also moves the number and has no conditions field.
  material_extra:
    - subset_used
    - training_data_policy
    - selection_strategy
    - harness

homepage: https://posebusters.readthedocs.io/
repository: https://github.com/maabuu/posebusters
dataset_url: https://zenodo.org/records/8278563

versions:
  - version: v1
    label: PoseBusters Benchmark set, 428 complexes (the paper's arXiv v1)
    version_kind: revision
    released: 2023-08-10
    items: 428
    changes: The first release, with the Astex Diverse set beside it.
    superseded_by: v2
    frozen: true
    sources:
      - src-arxiv-2308-05777
      - src-zenodo-posebusters
  - version: v2
    label: PoseBusters Benchmark set, 308 complexes (the paper's arXiv v2 and the journal version)
    version_kind: revision
    released: 2023-11-06
    items: 308
    changes: Ligands within 5 Å of a protein symmetry mate (crystal contacts) removed, taking the
      set from 428 to 308 complexes. Scores on v1 and v2 are not comparable.
    breaking: true
    supersedes_version: v1
    frozen: true
    sources:
      - src-arxiv-2308-05777
      - src-zenodo-posebusters
      - src-arxiv-2308-05777-v3

history:
  - date: 2025-11-29
    event: licence-changed
    field: execution.code_licence
    from: BSD-3-Clause
    to: MIT
    source: src-github-posebusters-license
    quote: MIT License
    note: GitHub's commit history for LICENSE (read 2026-10-14, not kept as a Source) shows the BSD
      3-Clause file of the initial commit (2023-08-12) and "Add MIT license" on 2025-11-29. The
      paper states BSD-3-Clause.

tags:
  - docking
  - co-folding
  - protein-ligand
  - physical-validity
  - rdkit

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2308-05777-v3
    - src-arxiv-2308-05777
    - src-github-posebusters-readme
    - src-github-posebusters-license
    - src-zenodo-posebusters
    - src-arxiv-2606-08375-v2
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, with windows that keep the corresponding
    author's address out; its abstract page for the dates and the version comments; the README and the
    LICENSE at main; the Zenodo record's API JSON, with windows that keep the creators' ORCIDs out; and
    DeCAF's v2 PDF (a DOI) as evidence of current use. GitHub's API was read for the licence history and
    the last push, and is not kept as a Source.
  confidence: medium
  review_checks:
    - check: The pair (constraint-check, domain-specialist-model) resolves to the llm-static-text
        profile, whose shots, chain_of_thought, reasoning_effort, tools_allowed and retries_allowed
        mean nothing for a docking or co-folding model; taxonomy/comparability-profiles.yaml may
        need a profile for non-LLM specialists, as ADR-0024 gave Matbench Discovery surrogate-fit.
        Nothing is waived meanwhile.
      field: comparability
    - check: The assignment filed PoseBusters as chemistry-materials entry 10 of 10 and asked, if
        the validators forbid a directory that differs from domain.primary's family (they do, in
        tools/validate/tiers.py), for a chemistry-materials primary with this leaf secondary. That
        was not done. The chemistry-materials family's exclusion test sends a ligand scored as a
        bound pose to biology-genetics, the leaf's inclusion test says the entry stays there even
        where the corpus files it under chemistry-materials, and ADR-0020 names posebusters as the
        leaf's example, so no chemistry-materials leaf passes. The entry sits in biology-genetics/,
        and counts there.
      field: domain.primary
    - check: Whether the 2 Å RMSD success criterion is domain-metric or numeric-tolerance-match. It
        is tagged domain-metric, as the Stage 3 record has it, because the answer is a pose rather
        than a number; ligand RMSD is close to the general statistic the domain-metric exclusion
        names.
      field: evaluation_method
      source: src-arxiv-2308-05777-v3
      quote: Coverage, a metric often used for testing docking methods, is the share of predictions
        that are within a user adjustable threshold which by default is 2 Å RMSD
    - check: composite is not tagged. constraint-check's distinction says a battery folded into a
        headline number carries both terms, but the headline is a per-pose conjunction, not the
        weighted or averaged combination composite's inclusion test asks for.
      field: evaluation_method
    - check: ceiling_anchor_type is measured-ceiling, where the Stage 3 record has
        theoretical-maximum. The crystal ligands were run through every check and nearly all pass,
        which reads as a gold solution run, but the run was to calibrate thresholds and no combined
        oracle score is given.
      field: data.ceiling_anchor_type
      source: src-arxiv-2308-05777-v3
      quote: This was selected as all but one of the crystal ligands in the Astex Diverse set and
        all of those in the PoseBusters Benchmark set pass at this threshold.
    - check: The paper counts the Astex Diverse set as 81 complexes in two places and as 85
        elsewhere; its 47-complex training overlap is stated out of 81.
      field: data.size
      source: src-arxiv-2308-05777-v3
      quote: 47 of the 81 complexes in the Astex Diverse set are in the PDBbind 2020 General Set
    - check: no-known-conflict rests on the arXiv version's conflict statement; it carries no
        funding statement, and the Chemical Science version, which may, was not read.
      field: governance.independence_flags
      source: src-arxiv-2308-05777-v3
      quote: There are no conflicts to declare.

# data/benchmarks/biology-genetics/cameo.yaml
#
# P1-S5-T04, biology-genetics entry 7 of 9. Filled from cameo3d.org: the results page (read as the server-component
# payload the page renders, fetched with the "RSC: 1" request header, because its weekly target counts and server
# list sit there and not in the HTML's visible text), and the about, FAQ, help and terms pages (scripts and styles
# stripped); the two open-access CAMEO papers in Proteins, Robin et al. 2025 ("Beyond Single Chains", 10.1002/
# prot.70060) and Robin et al. 2021 ("Perspectives on the future", 10.1002/prot.26213), read as Europe PMC
# full-text XML; and SWISS-MODEL's home page, for who develops it. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The servers page was read but is not cited: its payload holds the registered servers' contact e-mail addresses.
# Haas et al. 2018 (10.1002/prot.25431) is open only as a PMC author manuscript, without an open licence and with
# the corresponding author's address and telephone number on the page; it was read for background and not cited.

id: cameo
name: CAMEO
aliases:
  - Continuous Automated Model EvaluatiOn
  - Continuous Automated Model Evaluation
tagline: Weekly blind, fully automated evaluation of structure prediction servers on PDB entries
  before release, since 2012.
description: >
  A continuous blind evaluation of automated structure prediction servers, run every week since 2012 by
  the Computational Structural Biology Group at the SIB Swiss Institute of Bioinformatics and the
  University of Basel's Biozentrum. Each Saturday CAMEO takes the Protein Data Bank's pre-release of the
  entries due out the following Wednesday, filters and clusters them, classifies each against the
  structures already in the PDB, and sends the selected targets to registered servers by HTTP. A target
  is a whole PDB entry: its protein, peptide, DNA and RNA sequences and any free ligands, with the
  stoichiometry left for the server to predict. Servers e-mail back up to five all-atom models before
  the PDB releases the structures on Wednesday; CAMEO then scores them against the experimental
  structure with OpenStructure (LDDT, interface LDDT and TM-score, and for ligands LDDT-PLI and the
  share of poses within 2 Å BiSyRMSD), and the site shows model 1. Targets are classed hard, medium or
  ligand (a protein with a close template but a ligand its templates lack). The site shows several
  scores and no single ranking,
  averaged over the targets the selected servers share in a chosen date range, beside baselines CAMEO
  runs itself (AlphaFold 3, AlphaFold DB models, BLAST, and SWISS-MODEL with AutoDock Vina or Glide
  docking). Servers register as public or as anonymised development servers. The earlier categories
  (single-chain 3D, model quality estimation, contact prediction, ligand binding sites) are
  discontinued. CAMEO describes itself as a continuous complement to the biennial CASP.
self_description:
  source: src-cameo-site
  quote: The Continuous Automated Model EvaluatiOn (CAMEO) platform provides weekly, automated, and
    independent benchmarking of structure prediction servers, serving as a continuous complement to
    the Critical Assessment of Structure Prediction (CASP) experiments.
paper:
  title: 'Beyond Single Chains: Benchmarking Macromolecular Complex Prediction Methods With the Continuous
    Automated Model EvaluatiOn (CAMEO)'
  doi: 10.1002/prot.70060
  source: src-cameo-2025-proteins
released: null
released_note: CAMEO has run weekly since 2012, as both papers say, but no source read gives a
  launch date. The current complexes category has sent targets weekly since October 2020, first on
  beta.cameo3d.org (see versions).
released_source: src-cameo-2021-proteins
released_quote: Since 2012, CAMEO has been leveraging the prerelease of structures to be published
  in the upcoming release of the PDB to conduct weekly, blind, fully automated benchmarking
  experiments.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/protein-structure-prediction
  secondary:
    - biology-genetics/protein-protein-interaction
    - biology-genetics/protein-ligand-cofolding
    - biology-genetics/nucleic-acid-structure
domain_note: The secondaries are the parts of a complex CAMEO scores today. The discontinued
  single-chain category scored protein structure only, and the ligand binding site category (LB)
  scored residues, not poses.
domain_basis:
  reason: A target is a whole PDB entry, so a prediction is the complete complex. Protein chains are
    scored by LDDT and TM-score, their interfaces by interface LDDT, ligand poses by LDDT-PLI and
    BiSyRMSD, and DNA and RNA chains by LDDT, which covers nucleic-acid chains.
  source: src-cameo-help
  quote: In CAMEO, a target consists of one or more peptide, protein, DNA or RNA sequence(s), and
    zero or more free ligands belonging to the same pre-released PDB entry.
domain_considered_and_rejected:
  - term: biology-genetics/drug-target-interaction
    reason: Ligands are scored for their pose and contacts in the complex; no binding affinity is
      predicted or scored.
  - term: biology-genetics/protein-function-prediction
    reason: The ligand binding site residue category (LB) came nearest, and it is discontinued.
    source: src-cameo-faq
    quote: CAMEO also featured a category for single chain 3D protein structure prediction,
      structure Quality Estimation (QE), Ligand Binding site residue prediction (LB) and one for
      residue-residue Contact Prediction (CP) which have been deprecated.
capability:
  - scientific-prediction
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: Servers predict the three-dimensional structure of a macromolecular complex from its
      sequences and ligand identities, and are scored against the experimental structure the PDB
      then releases.
    source: src-cameo-faq
    quote: Its sole purpose is to continuously evaluate the accuracy of prediction servers based on
      known experimental structures released by the PDB.
  distribution-shift-generalization:
    reason: Targets are chosen and classed by novelty against the PDB at the time, which is what the
      methods are trained on and draw templates from. Hard and medium targets have no close template
      for the whole complex, ligand targets pair an easy protein with a ligand its templates lack,
      and the results page filters by these classes. The 2025 paper reads the ligand results as
      exposing the methods' limits in generalization.
    source: src-cameo-2025-proteins
    quote: exposes limitations in generalization and helps identify cases where current methods
      struggle with novel ligand contexts or alternative binding site conformations
capability_considered_and_rejected:
  - term: generation-fidelity
    reason: The term's exclusion sends a predicted structure scored against measurement to
      scientific-prediction.
  - term: calibration-uncertainty
    reason: Model confidence and the quality estimation category (QE) were scored in the
      single-chain era and are discontinued. No current score consumes a confidence the server
      emits, and the 2025 paper lists quality estimates as still to be addressed.
    source: src-cameo-2025-proteins
    quote: Finally, assessment of model quality estimates (by the prediction methods themselves as
      well as independent model assessment approaches) needs to be addressed.
  - term: spatial-reasoning
    reason: The term's exclusion covers a score that measures reconstruction accuracy rather than a
      spatial inference, which LDDT and TM-score are.

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: LDDT, interface LDDT, TM-score, LDDT-PLI, QS-score and the BiSyRMSD success rate are
    structural-biology measures, all computed by OpenStructure against the released structure.
  source: src-cameo-help
  quote: The iLDDT score (interface LDDT) is a variation of LDDT evaluating the accuracy of
    interfaces by focussing on inter-chain contacts only.
evaluation_method_considered_and_rejected:
  - term: prospective-resolution
    reason: The reference structures are solved and deposited before the targets go out; the PDB
      withholds them only until its Wednesday release.
    source: src-cameo-faq
    quote: Its sole purpose is to continuously evaluate the accuracy of prediction servers based on
      known experimental structures released by the PDB.
  - term: entrant-relative-ranking
    reason: Averages are taken over the targets the selected servers share, so adding a server to a
      comparison can change the others' averages, but each target's score is the server's own and no
      rank, win rate or Z-score is published.
    source: src-cameo-2025-proteins
    quote: doesn't establish a single unique ranking between the methods
  - term: uncertainty-calibration-score
    reason: Scoring of emitted confidence belonged to the discontinued QE category and model
      confidence evaluation.
designed_for_subjects:
  - domain-specialist-model
  - hosted-inference-endpoint
designed_for_subjects_basis:
  reason: The entrants are structure prediction servers, from deep-learning co-folding methods such
    as RoseTTAFold All-Atom to template-based pipelines, built for this discipline. What CAMEO
    evaluates is the server as served, an HTTP endpoint that receives each week's targets, and a
    server's identity includes its settings, so one method run two ways is two servers.
  source: src-cameo-faq
  quote: If you server can be tuned with different parameters (e.g. for highest coverage or for
    highest accuracy), you will need to register two servers with different parameters.
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: Its inclusion test names a solver, potential, forecast system or laboratory assay; a
      structure predictor stands in for structure determination, which CASP's entry also left out.
  - term: classical-algorithm
    reason: Template-based servers and the docking baselines (SWISS-MODEL with AutoDock Vina or
      Glide) are hand-designed, but SWISS-MODEL now draws templates from AlphaFold DB, so the
      baselines are not free of learned components; a reviewer may still add the term for the
      template-based entrants.
    source: src-swissmodel-site
    quote: AlphaFoldDB structures are available as templates in the SWISS-MODEL homology modelling
      pipeline.
  - term: human-ai-team
    reason: Unlike CASP's expert groups, no human steers a prediction; every step is automated.
    source: src-cameo-2025-proteins
    quote: as CAMEO is a fully automated workflow without human intervention

lifecycle: active
lifecycle_basis:
  reason: The results page's data lists scored target counts for every week from 2024-01-06 to
    2026-10-03, the latest week with 148 targets, and 20 public servers, 7 of them CAMEO's own
    baselines. The one-week download was last modified on 2026-10-07 (its HTTP header, read
    2026-10-14; not a quoted Source).
  source: src-cameo-site
  quote: '"id":"2026-10-03","ligand":74,"medium":19,"hard":55'
activity: accepting-submissions
activity_basis:
  reason: Servers can be registered at any time from a user account, and each week's targets go to
    every registered server; CAMEO has no rounds beyond its continuous weekly cycle.
  source: src-cameo-faq
  quote: Since 2025, you can create a user account with CAMEO, and submit registration information
    directly from your account page.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: RoseTTAFold All-Atom
    source: src-cameo-2025-proteins
    observed_on: 2026-10-14
    quote: when analyzing the predictions of another deep‐learning method in CAMEO, RoseTTAFold
      All‐Atom
    note: The paper analyses its CAMEO predictions beside AlphaFold 3 and the docking baselines (its
      Figure S1). AlphaFold 3 itself is a baseline CAMEO runs, not an entrant.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: experimental
ground_truth_source_note: The experimental structures the PDB releases on the Wednesday after the
  targets go out; X-ray structures and EM structures at 4.0 Å or better, solution NMR excluded from
  the week of 2025-07-05.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Targets, predictions, reference structures and scores are public downloads, so any
    published score can be recomputed. A blind run for a past week cannot be repeated, but anyone
    can register a server for the weeks ahead.
  source: src-cameo-2025-proteins
  quote: All results (including predictions, reference structures, and evaluation scores) are
    publicly available

task:
  exists: true
  input:
    - the sequences of one pre-released PDB entry (protein, peptide, DNA or RNA) and its free
      ligands as SMILES and InChI, without the stoichiometry
  output: Up to five all-atom models of the whole complex, in PDB or mmCIF with ligands in mmCIF,
    SDF or the CASP15 format, e-mailed before the PDB releases the structure on Wednesday.
  scoring: Model 1 scored by OpenStructure against the biological assembly that fits it best (LDDT,
    interface LDDT, TM-score; LDDT-PLI and BiSyRMSD successes under 2 Å for ligands), with missing
    chains and ligands penalised, and averaged over the targets the compared servers share in a date
    range.
  tests_hidden_from_system: true
  blinding:
    source: src-cameo-2025-proteins
    quote: CAMEO selects targets shortly before their experimental structures are released and
      distributes them to participating servers
  task_distribution_drifts: true
  source: src-cameo-help
  quote: Up to 5 models can be returned; only model 1 is used for aggregated scores and comparisons
    on the website

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The reference structures are public once the PDB releases them, and CAMEO's downloads
    (one week to one year) hold targets, predictions and scores for public servers. Development
    servers' results are visible only to other registered developers.
  access_basis:
    reason: Once a week's structures are released, everything behind the published scores can be
      downloaded.
    source: src-cameo-2025-proteins
    quote: All results (including predictions, reference structures, and evaluation scores) are
      publicly available
  refresh: rolling-live
  refresh_note: periodic-recompetition was considered, a week being an edition with new data, but no
    week is ranked as an edition; results are read over windows the user picks. resolves-over-time
    is excluded by its own test, because the reference structures exist and are only embargoed by
    the PDB until release.
  refresh_basis:
    reason: New targets enter every week, and a score is an average over a chosen date range and
      over the targets the selected servers share, so it needs its window and server set to be read.
      The selection rules also move without version labels.
    source: src-cameo-2025-proteins
    quote: The difficulty classification of targets in CAMEO is being updated regularly to reflect
      the current scope of modeling approaches
  data_provenance:
    - experimental-measurement
  data_provenance_note: The references are experimental structures deposited in the PDB, selected
    from its weekly pre-release.
  data_provenance_source: src-cameo-help
  data_provenance_quote: Only X-ray diffraction and high resolution (≤ 4.0Å) EM structures are
    included in the evaluation.
  contamination_risk: low
  contamination_risk_note: Predictions are due before the PDB releases the structures, and every
    server is queried at the same time with the same public background data, so no training route to
    a target's structure is known for the scored run. The sources read do not say whether CAMEO
    drops a target whose structure was made public early elsewhere (a preprint, say), as CASP does.
    Re-scoring a method a posteriori on the downloads, which the 2025 paper allows, has no such
    protection.
  contamination_risk_source: src-cameo-2025-proteins
  contamination_risk_quote: CAMEO plays a critical role by providing weekly, blind benchmarking of
    structure prediction methods using newly released experimental structures from the PDB
  contamination_evidence: []
  dataset_licence: CC-BY-SA-4.0
  dataset_licence_note: Servers agree that their predictions can be redistributed under the same
    licence. AlphaFold 3 baseline models are also subject to AlphaFold 3's output terms.
  dataset_licence_source: src-cameo-terms
  dataset_licence_quote: The data provided by CAMEO is licensed under the CC BY-SA 4.0 Creative
    Commons Attribution-ShareAlike 4.0 International License
  size:
    - count: 12205
      unit: targets selected from 23,629 new PDB entries (2,106 medium, 3,266 hard, 6,833 ligand)
      subset: the 76 weeks from 2024-01-06 analysed in the 2025 paper
      note: The paper gives the window as January 6, 2024 to June 14, 2025 in its text and to
        November 30, 2024 in its Figure 1 caption.
      source: src-cameo-2025-proteins
      quote: Out of 23 629 new PDB entries, 12 205 were selected as interesting targets
    - count: 148
      unit: targets (74 ligand, 19 medium, 55 hard)
      subset: the week of 2026-10-03
      source: src-cameo-site
      quote: '"id":"2026-10-03","ligand":74,"medium":19,"hard":55'
    - count: 812
      unit: targets scored, 453 of them oligomeric
      subset: 2020, the single-chain category
      source: src-cameo-2021-proteins
      quote: we evaluated and scored 812 targets, 453 of which were oligomeric

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Computational Structural Biology Group (Torsten Schwede), SIB Swiss Institute of
    Bioinformatics and Biozentrum, University of Basel
  maintainer_basis:
    reason: The about page names the group as CAMEO's developer, and both papers' authors are from
      it.
    source: src-cameo-about
    quote: CAMEO is developed by the Computational Structural Biology Group at the SIB Swiss
      Institute of Bioinformatics and the Biozentrum of the University of Basel
  maintainer_type: academic-lab
  maintainer_type_note: The group is a university research group at the Biozentrum and also an SIB
    group, and the site lists CAMEO in SIB's portfolio of open databases and software tools. SIB is
    a foundation outside the university system, so nonprofit was considered; the group itself holds
    and runs CAMEO.
  submission_process:
    - held-out-server
    - maintainer-run
  submission_process_note: Developers register a server, which CAMEO queries with each week's
    targets by HTTP; the server e-mails its models back before the PDB releases the structures, and
    CAMEO scores them after release. Public servers' results are open to all; development servers
    are shown, anonymised, to other developers only. CAMEO also chooses and runs baselines itself
    (AlphaFold 3 v3.0.1, AlphaFold DB models, BLAST, and SWISS-MODEL with AutoDock Vina or Glide)
    and shows them beside the participants.
  submission_process_source: src-cameo-help
  submission_process_quote: Participants have until the following Wednesday at 0:00 UTC to return
    their predictions
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-swissmodel-site
      quote: SWISS-MODEL is developed by the Computational Structural Biology Group at the SIB Swiss
        Institute of Bioinformatics and the Biozentrum of the University of Basel
  independence_flags_note: SWISS-MODEL, developed by the group that runs CAMEO (the two sites use
    the same words for their developer), is a public CAMEO server and is one of the three
    participants the 2025 paper compares on protein complexes (see review_checks). It also builds
    the protein models of three of CAMEO's own baselines. Funding comes from SIB, the SNSF, ELIXIR
    and the EU's Horizon 2020; none of them enters a system of its own.
  independence_assessed: true
  funding:
    source: src-cameo-about
    quote: This project has furthermore received funding from ELIXIR and the European Union's
      Horizon 2020 research and innovation programme
  participation:
    source: src-cameo-faq
    quote: CAMEO will only evaluate servers with the consent of the author.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: null
  reproducibility_tier_note: Two answers, as for CASP. Re-scoring published predictions is automatic
    from the public downloads. A blind run against unreleased structures is possible only in a live
    week, for anyone who registers a server, and never afterwards. Whether an outside party could
    run CAMEO's target selection and scoring end to end depends on code the sources read do not name
    as published.
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_basis:
    reason: A week's run is defined by the PDB as it stood at that pre-release, the templates and
      sequences every server could see, and cannot be repeated once the structures are public.
    source: src-cameo-2025-proteins
    quote: This guarantees that each method has access to identical background information,
      including sequence and template data.
  harness_availability: null
  harness_availability_note: Every score is computed with OpenStructure (version 2.9.2 when the 2025
    paper was written), as described in Studer et al. 2025. Whether CAMEO's own selection and
    scoring pipeline is published as runnable code was not established from the sources read, so the
    value is left open.
  harness_availability_source: src-cameo-help
  harness_availability_quote: All the scores are computed with OpenStructure
  submission_channel:
    source: src-cameo-help
    quote: Participants return their predictions by email
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the date range and target class (hard, medium, ligand) a figure covers, and the
  # server set whose shared targets it averages over (subset_used); and whether model 1 or the best of up to five
  # models or poses was scored (selection_strategy), since the 2025 paper's ligand analysis takes the best pose.
  material_extra:
    - subset_used
    - selection_strategy
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: The site shows several scores side by side and averages them only over a common subset of
    targets that the user's choice of servers defines.
  source: src-cameo-2025-proteins
  quote: doesn't establish a single unique ranking between the methods

homepage: https://cameo3d.org/
dataset_url: https://cameo3d.org/downloads
leaderboard_url: https://cameo3d.org/

versions:
  - version: cameo-3d
    label: CAMEO-3D, single protein chains, with the QE, CP and LB categories
    version_kind: revision
    changes: Each protein chain of 30 or more residues a target, about 20 a week, scored by lDDT,
      CAD-score and GDT; homo-oligomeric state assessed from 2016 (oligo-lDDT, QS-score); model
      quality estimation (QE), contact prediction (CP) and ligand binding sites (LB) as separate
      categories. All are discontinued.
    breaking: true
    superseded_by: complexes
    frozen: true
    sources:
      - src-cameo-2021-proteins
      - src-cameo-faq
  - version: complexes
    label: Structures & Complexes (complex structures modeling, 3D)
    version_kind: revision
    changes: A target became a whole pre-released PDB entry (protein, peptide, DNA, RNA and
      ligands), with stoichiometry to be predicted, classed hard, medium or ligand, and scored by
      LDDT, interface LDDT, TM-score, LDDT-PLI and BiSyRMSD successes. Weekly targets since October
      2020, first as a beta; the redesigned site carries results from 2024-01-06.
    breaking: true
    supersedes_version: cameo-3d
    errata:
      - date: 2025-07-05
        description: Targets solved by solution NMR are excluded from evaluation from this week on;
          earlier evaluations include them.
        source: src-cameo-help
    frozen: false
    sources:
      - src-cameo-2021-proteins
      - src-cameo-2025-proteins
      - src-cameo-help
      - src-cameo-site

lineage:
  role: root
lineage_note: >
  CAMEO presents itself as a continuous complement to CASP (casp), not a variant of it.
  The FAQ draws the line. In CASP, expert groups predict 50-100 targets over a three-week window and
  independent assessors judge them; in CAMEO, servers are benchmarked automatically, every week, on
  newly released PDB structures. The help page adds that a server registered for CASP can use the
  same technology for CAMEO. No lineage relation fits that, so none is set.
lineage_source: src-cameo-faq
lineage_quote: In CAMEO, automated prediction servers are continuously benchmarked using thousands
  of newly released structures from the PDB on a weekly basis. The assessment is fully automated.

tags:
  - protein-structure
  - macromolecular-complexes
  - protein-ligand
  - blind-prediction
  - continuous-evaluation
  - prediction-servers

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T04)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-cameo-site
    - src-cameo-about
    - src-cameo-faq
    - src-cameo-help
    - src-cameo-terms
    - src-cameo-2025-proteins
    - src-cameo-2021-proteins
    - src-swissmodel-site
  sources_note: >
    cameo3d.org renders with Next.js. The results page was read as its React Server Components payload
    (the same URL with the "RSC: 1" header), which carries the page's metadata, weekly target counts and
    server list; the about, FAQ, help and terms pages were read as HTML with scripts and styles stripped.
    The two Proteins papers are Europe PMC's full-text XML (DOI sources, not archived). SWISS-MODEL's
    home
    page is cited for its developer only.
  confidence: medium
  review_checks:
    - check: data.refresh is rolling-live. A weekly round with new targets could be read as an
        edition (periodic-recompetition), but no week is ranked on its own and scores are read over
        windows. Whether the vocabulary wants a term for continuous blind evaluation is a taxonomy
        question.
      field: data.refresh
    - check: hosted-inference-endpoint is applied to structure prediction servers. Its inclusion
        test ("the protocol evaluates endpoints as served") passes, but its examples are LLM
        endpoints. classical-algorithm was left out although template-based servers (SWISS-MODEL,
        Phyre2, IntFOLD) and physics-based docking baselines take part.
      field: designed_for_subjects
      source: src-cameo-faq
      quote: If you server can be tuned with different parameters (e.g. for highest coverage or for
        highest accuracy), you will need to register two servers with different parameters.
    - check: distribution-shift-generalization rests on CAMEO choosing and classing targets by their
        novelty against the PDB and on the site's filters by class; no source reports a shifted and
        an in-distribution score side by side as a designed condition.
      field: capability
    - check: maintainer-competes-on-own-benchmark rests on SWISS-MODEL and CAMEO naming the same
        developer, and on the 2025 paper comparing SWISS-MODEL as a participant.
      field: governance.independence_flags
      source: src-cameo-2025-proteins
      quote: with three CAMEO participants (MultiFOLD [25], MultiFOLD2 [26], and SWISS‐MODEL [11])
    - check: maintainer_type academic-lab or nonprofit. The site lists CAMEO in SIB's portfolio, and
        SIB is a foundation, not a university; the developing group sits in both.
      field: governance.maintainer_type
    - check: One entry for CAMEO across its categories. The discontinued QE category scored model
        quality estimators, a different task and subject, and could be an entry of its own; contact
        prediction (CP) likewise.
      field: versions
    - check: reproducibility_tier and harness_availability are left null. ForecastBench's entry sets
        fully-automatable for the analogous case; CASP's leaves the tier null. OpenStructure
        computes every score and is published by the same group, which may make it the official
        harness.
      field: execution.harness_availability
    - check: nucleic-acid-structure is a secondary because DNA and RNA chains are sent and scored by
        LDDT, but the 2025 paper says nucleic-acid difficulty is not yet assessed robustly.
      field: domain.secondary
      source: src-cameo-2025-proteins
      quote: To better benchmark nucleic acid predictions, robust methods for assessing the
        difficulty of RNA and DNA will need to be developed.
    - check: The 2025 paper dates its 76-week analysis window two ways; the size row uses the start
        date only.
      field: data.size
      source: src-cameo-2025-proteins
      quote: over the 76‐week period from January 6, 2024 to November 30, 2024

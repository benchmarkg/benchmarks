    label: Brain-Score as first released
    version_kind: revision
    released: 2018-09-05
    changes: Three benchmarks, V4 and IT neural predictivity on the Majaj et al. (2015) recordings
      and I2n on human behaviour; the Brain-Score was their unweighted mean.
    frozen: true
    sources:
      - src-biorxiv-407007-v2
      - src-biorxiv-407007
  - version: '2.0'
    label: Brain-Score 2.0
    version_kind: revision
    changes: A plugin system for data, metrics, benchmarks and models, which deprecated the earlier
      candidate_models usage; Brain-Score Language was added beside Vision. Benchmarks have kept
      being added since, without a new version label.
    breaking: true
    frozen: false
    sources:
      - src-brain-score-release-2-0
      - src-github-brain-score-vision-readme
      - src-brain-score-site

subsets:
  - id: brain-score#neural
    label: Neural benchmarks (V1, V2, V4 and IT)
    scored_separately: true
    evidence:
      - source: src-brain-score-leaderboard
        quote: '"parentField": "average_vision", "benchmarkId": "neural_vision_v0"'
    notes: neural_vision, one of the two halves of average_vision; 77 benchmarks on the board read
      2026-10-14.
  - id: brain-score#behavioral
    label: Behavioural benchmarks
    scored_separately: true
    evidence:
      - source: src-brain-score-leaderboard
        quote: '"parentField": "average_vision", "benchmarkId": "behavior_vision_v0"'
    notes: behavior_vision, the other half of average_vision; 61 benchmarks on the board read
      2026-10-14.
  - id: brain-score#engineering
    label: Engineering benchmarks (ImageNet, ImageNet-C, ObjectNet, Geirhos 2021, Hermann 2020)
    scored_separately: true
    evidence:
      - source: src-brain-score-leaderboard
        quote: '"parentField": null, "benchmarkId": "engineering_vision_v0"'
    notes: Shown beside the ranking and not part of average_vision; 25 benchmarks scored against
      ground-truth labels rather than biological data.


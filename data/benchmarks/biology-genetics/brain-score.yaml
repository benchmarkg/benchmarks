# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T04)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-biorxiv-407007-v2
    - src-biorxiv-407007
    - src-github-brain-score-vision-readme
    - src-brain-score-site
    - src-brain-score-faq
    - src-brain-score-leaderboard
    - src-brain-score-release-2-0
    - src-brain-score-blog-leaderboard-remembers
    - src-brain-score-competition-2024
    - src-brain-score-terms
  sources_note: >
    The technical paper's v2 PDF (a DOI, not archived) read as text, and bioRxiv's API record of it for
    the first version's date; the vision README at master; five brain-score.org pages with scripts and
    styles stripped; the vision leaderboard's content endpoint, read raw because its rows are JSON
    inside a script element; and the terms-of-use PDF read as text. The Neuron perspective is
    subscription-only and was not read; the vision leaderboard page itself renders by script.
  confidence: medium
  review_checks:
    - check: The entry is Brain-Score Vision. Brain-Score Language shares the site, team and plugin
        submission, but has its own repository (brain-score/language, in alpha), model interface
        (ArtificialSubject), entrants (pretrained language models, about 36 on its board) and
        average, never combined with the vision average, so it is left for its own entry. It could
        instead be a subset here.
      field: description
      source: src-brain-score-release-2-0
      quote: which extends the Brain-Score platform from modeling the visual ventral stream to the
        human language system
    - check: scientific-prediction departs from the Stage-3 classification
        (taxonomy/_corpus/classifications/brain-score.yaml), which rejected it because the claim is
        brain-likeness, and ADR-0020 deferred a biological-fidelity term. It is tagged here because
        the 2018 paper and the FAQ call the scored outputs predictions of neural responses.
      field: capability
      source: src-biorxiv-407007-v2
      quote: Neural Predictivity is used to evaluate how well responses X to given images in a
        source system (e.g., a deep ANN) predict the responses in a target system
    - check: open-source-gated rests on the FAQ's statement that all submitted code is merged into
        the public repository and private code submissions are not yet supported. Weights may be
        hosted elsewhere, scores can be kept private, and the FAQ says private code is under
        development, so the gate may lapse.
      field: governance.submission_process
      source: src-brain-score-faq
      quote: at the moment, all submitted code is merged into our public GitHub repository
    - check: maintainer-run rests on rows the Brain-Score Team entered itself, such as
        regnet_y_400mf, and on the 2018 paper's own ranking. 228 rows are from Anonymous User, and
        whether they are the maintainers' bulk runs is not stated.
      field: governance.submission_process
      source: src-brain-score-leaderboard
      quote: '"name": "regnet_y_400mf", "submitter": "Brain-Score Team"}'
    - check: maintainer_type academic-lab rests on MIT's terms of use for the site and the paper's
        MIT affiliations. The 2024 competition was organised from EPFL and York University, and the
        GitHub organisation takes plugins from many labs, so community-collective may fit better.
      field: governance.maintainer_type
      source: src-brain-score-competition-2024
      quote: Organizers Martin Schrimpf EPFL Kohitij Kar York University
    - check: composite was rejected because every benchmark scores agreement with measurements,
        ceiling-normalised. Today's behavioural benchmarks use error consistency, accuracy deltas
        and confusion similarity, whose definitions were not read; if any is a classification
        metric, average_vision combines methods and is composite.
      field: evaluation_method
    - check: Brain-Score 2.0's release date is left empty. Its release page is dated 2024-04-04,
        while the home page lists "Dec 1, 2024 Brain-Score 2.0 released".
      field: versions
      source: src-brain-score-release-2-0
      quote: First published on 04-Apr-2024
    - check: The 2024 competition had a $10,000 prize pool whose funder the sources read do not name
        (the sponsors page renders by script), so prize-sponsored-by-industry and
        funded-by-evaluated-party were not assessed.
      field: governance.independence_flags
      source: src-brain-score-competition-2024
      quote: a $10,000 prize pool to the winning benchmarks
    - check: synthetic-procedural rests on the 2018 benchmarks' rendered stimuli (Majaj et al. 2015
        and the I2n set), still on the board; most later benchmarks use photographs.
      field: data.data_provenance
      source: src-biorxiv-407007-v2
      quote: The image set was generated by pasting a 3D object model on a naturalist background.
  personal_data_excluded:
    - source: src-biorxiv-407007-v2
      what: The correspondence line after the abstract, with three authors' e-mail addresses; the
        windows stop short of it.

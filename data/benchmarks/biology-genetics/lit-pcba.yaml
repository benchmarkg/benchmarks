# data/benchmarks/biology-genetics/lit-pcba.yaml
#
# P1-S5-T06, biology-genetics entry 19.
#
# Filled from the LIT-PCBA paper, read as the accepted manuscript deposited in HAL (hal-03013622) because the
# ACS version of record is behind a subscription; Europe PMC's record of that article for its publication date,
# placement and access status; the dataset's two site pages at drugdesign.unistra.fr (the download page with
# the per-target table, and the Data Content page), whose host serves no robots.txt; the 2025 audit of the set
# (arXiv 2507.21404, its v2 PDF), which evidences leakage and redundancy inside the released splits and
# declines to publish a corrected version; and a July 2026 shape-screening paper (arXiv 2607.20766) as evidence
# of current use. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.
#
# The chemistry-materials round dropped LIT-PCBA from its twenty because the scored quantity is binding to a
# protein target, which that family's exclusion test sends to biology-genetics (see the header of
# data/benchmarks/chemistry-materials/massspecgym.yaml, which replaced it there). There is no corpus
# classification record for this id and no Epoch stub. The HTTP Last-Modified dates of the three downloads
# were read but the archives themselves were not downloaded, so the files' contents are the site's and the
# audit's word.

id: lit-pcba
name: LIT-PCBA
aliases:
  - Literature-derived PubChem BioAssay
tagline: Fifteen PubChem bioassay target sets of confirmed actives and inactives, AVE-debiased, for
  virtual screening.
description: >
  A virtual-screening dataset from the Laboratoire d'Innovation Thérapeutique in Strasbourg, built to
  replace the decoy-based sets (DUD, DUD-E, MUV) whose biases were shown to reward memorisation. It starts
  from 149 confirmatory dose-response PubChem bioassays, each on a single protein target with at least
  one PDB structure bound to a ligand of the same phenotype as the assay's actives, and filters the substances
  for inorganic atoms, false positives (Hill slope, frequency of hits, aggregators, autofluorescence and
  luciferase artifacts), extreme molecular properties and 3D conversion failures. Twenty-one target sets
  survived; preliminary screening with 2D fingerprint similarity, 3D shape similarity and docking kept
  the 15 for which at least one method enriched the top 1% in true actives by a factor of two. Those 15
  sets were then split into training and validation sets by the asymmetric validation embedding (AVE)
  procedure, which minimises the chemical-space bias between training and validation actives and inactives.
  A user takes a target's query ligands and compound library, ranks the library, and reports the enrichment
  of true actives in the top 1% (EF1%), with ROC AUC and BEDROC beside it, per target set. The hit rates
  are those of a real screening deck (as few as 17 actives among 311,748 inactives for ADRB2) and the
  actives are micromolar rather than nanomolar, which makes the set much harder than DUD-E. No code, no
  leaderboard and no submission route are published: the maintainers ran the three baseline screens once
  in the paper, and everyone else downloads the files and reports in their own papers. A 2025 third-party
  audit found 2D-identical and analog compounds shared across the released splits and a parameterless
  memorisation baseline that matches published deep-learning enrichments.
self_description:
  source: src-hal-03013622-pdf
  quote: specifically designed for virtual screening and machine learning
paper:
  title: 'LIT-PCBA: An Unbiased Data Set for Machine Learning and Virtual Screening'
  doi: 10.1021/acs.jcim.0c00155
  version_read: v1
  source: src-hal-03013622-pdf
released: 2020-04-23
released_note: The journal article's first publication date, as Europe PMC records it (J. Chem. Inf.
  Model. 60(9), 4263-4273). The accepted manuscript in HAL is dated 2020-09-28, and the site's
  full_data.tgz answered HEAD with Last-Modified 2020-03-23 (read 2026-11-05, not kept as a Source).
  paper.version_read is v1 because that is the HAL deposit's version, the accepted manuscript; the
  paper has no preprint.
released_source: src-europepmc-32282202
released_quote: '"firstPublicationDate":"2020-04-23"'
release_venue: Journal of Chemical Information and Modeling 60(9)
release_venue_source: src-europepmc-32282202
release_venue_quote: '"journalTitle":"J Chem Inf Model","issue":"9","journalVolume":"60","pubYear":"2020"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/drug-target-interaction
domain_basis:
  reason: Every scored item is a compound ranked for whether it is a confirmed active against one
    named protein target, which is the leaf's definition. The data is retrospective (PubChem assay
    outcomes already measured), so nothing is nominated and then assayed, and no structure is
    predicted or scored. The biology-genetics family's exclusion test keeps a small molecule scored
    for how it binds a protein here even for a drug candidate, which is also why the
    chemistry-materials round dropped this entry (review_checks).
  source: src-hal-03013622-pdf
  quote: 149 assays targeting a single protein target, operated on at least 10,000 substances, and
    leading to at least 50 confirmed actives were first retained
domain_considered_and_rejected:
  - term: chemistry-materials/experimental-hit-finding
    reason: No compound is nominated for synthesis or sent to an assay; the activity labels were
      measured before the set was built, from dose-response curves already in PubChem.
    source: src-hal-03013622-pdf
    quote: The potency of all compounds (actives, inactives) for a particular target should have
      been determined experimentally in homogeneous conditions
  - term: biology-genetics/protein-ligand-cofolding
    reason: The set ships a PDB template and its co-crystallised ligand per target, but as the query
      a method screens with. No pose is predicted or scored, which that leaf's exclusion test sends
      to drug-target-interaction.
    source: src-arxiv-2507-21404-v2
    quote: For each target, LIT-PCBA provides three components
  - term: chemistry-materials/drug-discovery-admet
    reason: Nothing is scored on absorption, metabolism or toxicity. The molecular-property filters
      are an inclusion criterion for the library, not an endpoint.
  - term: biology-genetics/protein-fitness-prediction
    reason: The protein is fixed in every target set; the compound varies. No mutation's effect is
      predicted.
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: A method predicts which library compounds are active against the target, and the
      prediction is scored against what the confirmatory dose-response assay measured. The paper's
      claim is a method's ability to put true actives at the top of a hit list.
    source: src-hal-03013622-pdf
    quote: to pinpoint the ability of a VS method to prioritize, for purchase and validation, the
      shortest possible hit list with an optimal enrichment in true actives
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The AVE split is the opposite of a deliberate shift, since it equalises chemical-space
      distances between training and validation so that neighbour lookup scores at random, and no
      score on shifted inputs is reported as its own condition. The audit's charge is that the
      intended novel-chemotype generalization is not measured at all (known_limitation).
    source: src-hal-03013622-pdf
    quote: led to ROC area under the curve values close to random (0.500)
  - term: optimization
    reason: Compounds are ranked against measured labels; no objective is minimised by the entrant
      and nothing is designed.
  - term: search-exploration
    reason: The library is given in full and scored in full. There is no budget on how much of it a
      method may examine.
  - term: knowledge-recall
    reason: The assay outcomes are public in PubChem, so recall is a contamination route rather than
      the competence claimed (data.contamination_risk); the benchmark's claim is prediction of
      activity.

evaluation_method:
  - domain-metric
  - classification-metric
evaluation_method_basis:
  reason: The headline is EF1%, the enrichment of true actives in the top 1% of the ranking over
    random picking, a measure defined within virtual screening and reported per target set, with
    BEDROC (alpha=20) beside it (domain-metric). The areas under the ROC curves are computed as
    well, a general statistic of a score ranking against binary labels (classification-metric).
  source: src-hal-03013622-pdf
  quote: enrichment factors in true actives at a constant 1% false positive rate (EF1%)
evaluation_method_considered_and_rejected:
  - term: statistical-fit
    reason: Nothing continuous is compared. Potencies exist in the metadata but the label scored is
      active or inactive, which classification-metric's discriminant assigns to labels.
  - term: wet-lab-validation
    reason: No nominated compound is tested. The assay results are the stored key, which makes this
      held-out labels rather than a trial.
  - term: composite
    reason: EF1%, BEDROC and ROC AUC are reported side by side per target set, and no weighted or
      averaged combination is defined; the mean and median across targets are the users' own
      (aggregation_policy).
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The set was built for virtual-screening and machine-learning methods of the drug-discovery
    field, and the paper recommends machine learning on the targets with enough actives to train on
    (domain-specialist-model). Its own baselines, and the comparators in later papers, are
    fingerprint similarity, 3D shape matching and docking programs, which fit no learned class
    (classical-algorithm).
  source: src-hal-03013622-pdf
  quote: 'assessed by three standard methodologies: 2D fingerprint similarity, 3D shape similarity and
    molecular docking'
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: A model fitted per target set is exactly what the training splits are for, but the task
      is defined by drug discovery, which the term's exclusion sends to domain-specialist-model.
    source: src-hal-03013622-pdf
    quote: We however recommend the application of such methods to target sets exhibiting enough
      true actives to train on
  - term: scientific-surrogate-model
    reason: A screening model does not stand in for a solver or an assay run whose output it
      reproduces; the reference is a stored activity label, and CASP's and PoseBusters' entries
      reject the term for structure and pose predictors the same way.

as_used:
  - protocol: Shape-only screening of all 15 target sets with the target's co-crystallised ligand as
      the single 3D query and one generated conformer per library molecule, reported as mean AUROC
      and mean EF1% over the targets beside DUD-E.
    source: src-arxiv-2607-20766-v1
    quote: LIT-PCBA24 (15 targets) benchmarks. For each target the co-crystallised ligand serves as
      the 3D shape query
    note: A July 2026 Monte-Carlo shape-overlap paper; its mean AUROC is 0.54 and mean EF1% 2.2 over
      the 15 sets, and it treats LIT-PCBA as the harder of the two panels it runs.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the 15 target sets, and a July 2026 paper screens all
    of them (as_used), and the 2025 audit describes the set as the field's default for
    machine-learning virtual screening. Whether the audit's findings should instead make this
    `contaminated` is a reviewer's call (review_checks).
  source: src-arxiv-2607-20766-v1
  quote: the mean AUROC is 0.54 (EF1% = 2.2)
activity: no-submission-channel
activity_basis:
  reason: The site offers two downloads and a list of the files in each target set, with no
    leaderboard, server, form or submission route, and no source shows one ever existed. The
    maintainers' own results are the release paper's three baseline screens.
  source: src-unistra-lit-pcba
  quote: Download Full data here

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SPRINT, DrugCLIP, DENVIS and CHEESE (screening pipelines reporting EF1% on LIT-PCBA)
    source: src-arxiv-2507-21404-v2
    observed_on: 2026-11-05
    quote: Prominent pipelines such as SPRINT [14], DrugCLIP [15], DENVIS [16], and CHEESE [17]
      claim superior EF1%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: experimental
ground_truth_source_note: Activity outcomes of confirmatory dose-response PubChem bioassays, with
  each assay's own activity threshold kept as PubChem's depositor set it; the structures are PDB
  entries.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Both archives, the raw target sets and the AVE-split sets, are an open download with no
    registration, and the three metrics are standard published measures any party can compute. No
    official implementation of them is published, which is the reproducibility blocker rather than
    an access one.
  source: src-unistra-lit-pcba
  quote: Download AVE unbiased data here

task:
  exists: true
  input:
    - 'per target set: the PDB template structures and their co-crystallised ligands as mol2 files (the
      query ligands a similarity or docking method screens with)'
    - 'per target set: the compound library as SMILES with PubChem substance ids, actives and inactives,
      either whole or in the AVE training and validation splits'
  output: A score per library compound for that target, giving a ranking of the library (one query
    at a time, or all queries pooled by taking each compound's maximum).
  scoring: Per target set, the enrichment of true actives in the top 1% over random picking (EF1%),
    with BEDROC (alpha=20) and ROC AUC beside it. No aggregate over the 15 sets is defined.
  source: src-hal-03013622-pdf
  quote: enrichment factors in true actives at a constant 1% false positive rate (EF1%)

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The site links two archives, the full data and the AVE-unbiased data, as direct
      downloads with no registration, login or agreement.
    source: src-unistra-lit-pcba
    quote: Download Full data here
  refresh: static
  refresh_basis:
    reason: One documented release, in 2020, with no versioned re-issues, errata or changelog on the
      site or in the paper. The AVE archive answered HEAD with Last-Modified 2023-04-05 and the
      distributed counts are not the paper's, which may be an undocumented change (review_checks).
    source: src-unistra-lit-pcba
    quote: 15 target sets, 7761 actives and 382674 unique inactives selected from high-confidence
      PubChem Bioassay data
  data_provenance:
    - experimental-measurement
    - curated-public-database
  data_provenance_note: The labels are the readouts of confirmatory dose-response high-throughput
    screens (experimental-measurement), taken from the PubChem BioAssay archive with its activity
    calls, substance ids and artifact flags, and the templates are PDB entries
    (curated-public-database). No measurement was made for the dataset; the authors selected,
    filtered and split.
  data_provenance_source: src-hal-03013622-pdf
  data_provenance_quote: Bioactivity data were retrieved from the PubChem BioAssay database
  contamination_risk: high
  contamination_risk_note: Two evidenced routes reach the split the benchmark scores. The set
    releases a training set beside the validation set it is scored on, and the 2025 audit found
    2,491 unique inactives 2D-identical across the two, over 350 analog pairs among actives at ECFP4
    Tanimoto 0.6 or more (323 in ALDH1 alone), and query ligands that reappear in the training and
    validation sets, so that a parameterless memorisation baseline matches published deep-learning
    enrichments. Separately, every label is public in PubChem and every structure in the PDB, so a
    model pretrained on bioactivity archives can have seen the scored compounds; no source assesses
    that route.
  contamination_risk_source: src-arxiv-2507-21404-v2
  contamination_risk_quote: 2,491 2D-identical inactives appear in both training and validation
  contamination_evidence:
    - source: src-arxiv-2507-21404-v2
      stance: supports
      quote: our analysis uncovered a total of 2,491 unique inactives shared between training and
        validation sets across the 15 targets
    - source: src-arxiv-2507-21404-v2
      stance: supports
      quote: a trivial memorization-based baseline with no learnable parameters exploits these
        artifacts to match or exceed the reported performance
    - source: src-hal-03013622-pdf
      stance: against
      quote: led to ROC area under the curve values close to random (0.500)
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: EF1% is bounded per target set by the enrichment a perfect ranking would give, and the
      audit normalises every score by that bound to compare methods; ROC AUC is bounded at 1.0. No
      measured system, human or data ceiling is published, and the paper's own nearest-neighbour
      check establishes the random floor rather than a ceiling.
    source: src-arxiv-2507-21404-v2
    quote: yielding the dimensionless nEF1%
  dataset_licence: null
  dataset_licence_note: Neither site page states a licence or terms for the data; the Data Content
    page asks that the release paper be cited, and the footer carries the laboratory's copyright
    line. The underlying assay records are PubChem's and the structures the PDB's, whose own terms
    were not read.
  size:
    - count: 7761
      unit: confirmed active compounds over the 15 target sets, as distributed
      source: src-unistra-lit-pcba
      quote: 15 target sets, 7761 actives and 382674 unique inactives selected from high-confidence
        PubChem Bioassay data
    - count: 382674
      unit: confirmed inactive compounds over the 15 target sets, as distributed
      source: src-unistra-lit-pcba
      quote: 15 target sets, 7761 actives and 382674 unique inactives selected from high-confidence
        PubChem Bioassay data
    - count: 7844
      unit: confirmed active compounds, as the paper reports them
      source: src-hal-03013622-pdf
      quote: covers 15 target sets, 7844 unique actives and 407381 unique inactives
    - count: 407381
      unit: confirmed inactive compounds, as the paper reports them
      source: src-hal-03013622-pdf
      quote: covers 15 target sets, 7844 unique actives and 407381 unique inactives
    - count: 15
      unit: target sets (single protein targets), from 21 processed and 149 assays retrieved
      source: src-hal-03013622-pdf
      quote: 15 out of the initial 21 target sets can be considered to be suited
  size_note: The paper's counts (7,844 actives, 407,381 inactives) are not the distributed set's
    (7,761 and 382,674, the site's table summed). The 2025 audit's per-target table matches the
    site's numbers exactly, so the files hold the smaller set; the paper also records that the ALDH1
    and VDR sets were cut by 25% at the unbiasing stage. The headline rows are therefore the site's.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Laboratoire d'Innovation Thérapeutique (UMR 7200 CNRS-Université de Strasbourg)
  maintainer_basis:
    reason: The dataset is hosted on the laboratory's own domain and the site's footer carries its
      copyright line; the paper's authors give the same laboratory as their affiliation.
    source: src-unistra-lit-pcba
    quote: (c) Laboratoire d'innovation Thérapeutique
  maintainer_type: academic-lab
  maintainer_type_note: The host is an institutional domain of a CNRS and University of Strasbourg
    joint unit, not a personal account, so individual does not apply as it did for PoseBusters and
    BEND.
  submission_process:
    - literature-only
  submission_process_note: The only maintainer results are the release paper's three baseline
    screens of the 21 processed sets, and no ranking is kept. Everyone else downloads the files,
    computes the metrics themselves and reports in their own papers.
  submission_process_source: src-hal-03013622-pdf
  submission_process_quote: 'assessed by three standard methodologies: 2D fingerprint similarity, 3D shape
    similarity and molecular docking'
  independence_flags: []
  independence_flags_note: None recorded. There is no ranking to compete on, and the three baseline
    methods screened in the paper are third-party software rather than the authors'. The funding is
    a doctoral-school grant (funding); the accepted manuscript carries no competing-interest
    statement, and the published version was not read. The 2025 audit is by a third party and was
    not commissioned.
  independence_assessed: true
  funding:
    source: src-hal-03013622-pdf
    quote: The authors are thankful for the financial support from the doctoral school of chemical
      science
  known_limitation:
    source: src-arxiv-2507-21404-v2
    quote: In its current form, the benchmark does not measure the intended ability to recover novel
      chemotypes

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: A run means screening up to 400,000 compounds per target with the method under
    test, from a fingerprint comparison on one CPU to docking or a neural encoder on a cluster, and
    no source states the cost of any reference run.
  reproducibility_tier: null
  reproducibility_tier_note: A run is automatic end to end once the archives are downloaded, which
    reads as fully-automatable, but no implementation of the metrics or the screening protocol is
    published (the blocker below), and 02 S11 forbids that tier beside it. The tier abstains, as
    MusicCaps did on the same pair.
  reproducibility_blockers:
    - no-reference-implementation
  reproducibility_blockers_note: The site publishes data files only. Each user implements EF1%,
    BEDROC and the pooling over query ligands themselves, and the audit shows the choices move the
    ranking of methods.
  harness_availability: none
  harness_availability_note: No repository, package or script is linked from either site page or
    named in the paper; the paper names the commercial programs its own baselines used
    (Surflex-Dock, ROCS, Omega, Pipeline Pilot, Corina).
  code_licence: null
  code_licence_note: No code is published, so there is nothing to license.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which target sets and which split (the whole set, or the AVE validation split
  # that the splits were built for), what the method was trained on (the target's own training actives, another
  # bioactivity archive, or nothing), and the harness, because every user implements EF1% and the pooling over
  # query ligands themselves and the audit shows single-query, multi-query and normalised variants invert the
  # ranking of methods.
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: community-aggregate
aggregation_policy_note: The paper reports every target set apart and defines no combined figure.
  Users take the mean or the median EF1% over the 15 sets, and the audit argues that both, plus the
  normalised nEF1%, have to be shown together because either alone can invert the ranking.
aggregation_policy_basis:
  reason: The combined figure is the users' own.
  source: src-arxiv-2507-21404-v2
  quote: yielding the dimensionless nEF1%


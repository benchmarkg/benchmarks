# data/benchmarks/biology-genetics/casp.yaml
#
# P0-S3-T02. Written from the primary sources below with NO schema in front of the author
# (14-roadmap "Start here", Week 2 item 4). Field names are invented where the entry needed
# them; P0-S5 reconciles them. `_schema_findings` at the bottom is the product of this task.
#
# The task says "from the CASP17 assessment papers". They do not exist yet. CASP17's
# prediction season closed in August 2026 and its results are due on the eve of the
# conference (30 Nov 2026). The assessment layer here is therefore CASP16's (Proteins,
# published 2025-26), and CASP17 contributes only what its own pages say about the round in
# progress. Re-read this entry against the CASP17 papers when they appear.
#
# Three premises in the plan did not survive the sources, and each is recorded where it bites:
#   1. "No leaderboard at all" (02 S12.1). The Prediction Center publishes z-score ranking
#      tables per category. The authoritative output is still the assessment papers, and
#      the two can rank differently.
#   2. "Human-expert groups ranked separately from automated servers." Servers are ranked
#      separately; human ("expert") groups are ranked with everyone, in the all-groups
#      table. The separate category is the server one.
#   3. "maintenance_status: unobservable ... has no signal our probes can read." CASP has a
#      dated target list, a dated message board and a dated download area.
#
# P3-S6-T03 (2026-11-18) gave the entry its per-category metrics and the human-expert split. The descriptive
# `metrics` dict became refs to seven Metric records (data/metrics/: gdt-ts, lddt, tm-score, dockq, ics, ips and
# kendall-tau), with its quotes moved to one Subset per category; the editions became BenchmarkVersions of kind
# edition; human_assistance and selection_strategy became material; and the per-category ceilings the assessment
# papers state became Baselines. Read for it: the CASP16 complex and monomer assessments again, as Europe PMC full
# text (src-casp16-complex-2026-11-18, src-casp16-monomer-2026-11-18), and the Prediction Center's results-table
# help page (src-predictioncenter-casp16-help). The Metric records also cite the DockQ and lDDT papers and the
# TM-score program's page, which this entry does not quote.

id: casp
name: CASP
aliases:
  - Critical Assessment of Structure Prediction
  - Critical Assessment of Techniques for Protein Structure Prediction
tagline: Blind biennial prediction of unreleased experimental structures, scored by independent
  assessors.

description: >
  Every two years the Prediction Center releases sequences of proteins, nucleic acids and
  complexes whose experimental structures are about to be determined but are not public.
  Registered groups -- automated servers with a short deadline and human-led "expert" groups
  with a longer one -- submit models. As the structures are released, models are scored
  automatically, independent assessor teams evaluate each category, and the round closes
  with a conference and a special issue of Proteins.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/protein-structure-prediction
  secondary:
    - biology-genetics/nucleic-acid-structure
    - biology-genetics/protein-protein-interaction
    - biology-genetics/protein-ligand-cofolding
    - biology-genetics/drug-target-interaction   # the CASP16 affinity targets; not in 02 S12.1
  per_edition: true
  per_edition_note: >
    The secondary list is a union over recent editions. The category set changes every
    round (CASP17 adds immune complexes), so a single domain list is a lossy summary.

capability:
  - generation-fidelity
  - calibration-uncertainty
  - distribution-shift-generalization
capability_basis:
  generation-fidelity: >
    The score is a distance from a produced structure to the experimental one (GDT_TS,
    lDDT, DockQ), which is the term's inclusion test verbatim.
  calibration-uncertainty:
    reason: The scoring consumes a confidence emitted by the system, per residue.
    source: src-casp16-monomer
    quote: predictors are required to submit their own “pLDDT score” in the b‐factor column of their
      predicted structures
  distribution-shift-generalization:
    reason: CASP17 deliberately selects targets outside what current methods were fitted to, and the
      overview reports the degradation.
    source: src-casp17-home
    quote: Proteins and complexes with weak evolutionary information such as those with viral or
      parasite origin
capability_considered_and_rejected:
  # 02 S12.1 tags perception, abstraction, quantitative-reasoning and
  # distribution-shift-generalization. Only the last survives the P0-S2 inclusion tests.
  - term: perception
    reason: The input is a sequence, not "an image, video, audio stream, point cloud or comparable
      raw signal".
  - term: abstraction
    reason: Nothing in the protocol isolates finding a representation from producing coordinates;
      the tie-break says tag what the source claims, and no CASP source claims this.
  - term: quantitative-reasoning
    reason: The output is a structure, not a number reached by calculation; the OUT clause excludes
      numbers that are not the scored answer.
  - term: spatial-reasoning
    reason: OUT clause, verbatim -- "do NOT tag it where the scored quantity is reconstruction
      accuracy rather than a spatial inference".

evaluation_method:
  - domain-metric
  - expert-panel-assessment
evaluation_method_note: >
  expert-panel-assessment's own OUT clause says "do NOT tag it where a leaderboard is the
  published artifact". CASP publishes both, and the definition assumes one or the other.
  Tagged because the papers are the authoritative output; the term needs a both-case.

designed_for_subjects:
  - domain-specialist-model
  - human-ai-team
designed_for_subjects_basis: >
  Servers are automated, field-specific systems. "Expert" groups are people who run and
  steer those systems, which is human-ai-team by definition: a human and a system evaluated
  as one entrant.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: >
      Its definition is "Credentialed humans evaluated on the same task as machine entrants".
      No CASP entrant is a human without a system. Its inclusion test also says "CASP ranks
      human-expert groups in a separate category from automated servers", and the ranking
      page shows the reverse: servers get the separate table.
  - term: scientific-surrogate-model
    reason: Its IN list is "a solver, potential or forecast system"; a structure predictor stands in
      for a measurement, which the term does not name. Near-miss.

# --- Lifecycle, saturation per category --------------------------------------------------------

lifecycle: active
activity: unknown                     # `assessment-in-progress` is not in the vocabulary: see tags[] and activity_note
activity_note: >
  Submissions are closed, the edition is not finished, and no next round is announced.
  `between-rounds` says the edition is over; `round-scheduled` says one has not opened;
  `closed` says the benchmark accepts nothing ever again. None is true today.

# --- Admissibility (04 S5; 00 S6 A5) -- added by P0-S4-T03 with the user's approval ---------
# The learned-entrant test: in scope because at least one entrant is a learned system, and
# the entry cites where that is shown. Quoted from a source this entry already relied on.

learned_entrant_evidence:
  - system: AlphaFold-Multimer and AlphaFold3, as the core modelling engine of most CASP16 groups
    source: src-casp16-complex
    observed_on: 2026-09-23
    quote: Most CASP16 groups relied on AlphaFold‐Multimer (AFM) or AlphaFold3 (AF3) as their core
      modeling engines.
    note: >
      The entrants are research groups; this is the organisers saying what most of them ran.
      AlphaFold 3 as an assessor-run baseline (results_observed) is not an entrant and is not
      the evidence.
evaluation_target: learned-system
entrant_classes:
  # The field the plan predicted, but not the shape it predicted.
  - class: server
    deadline: server expiration (about 3 days after release on the CASP16 list)
    deadline_source: src-casp16-targets
    deadline_quote: Entry Date Server Expiration Ligand Deadline Human Expiration
    ranked_separately: true
    source: src-casp16-zscores
    quote: Server groups on 'all groups' + 'server only' targets
  - class: expert
    deadline: human expiration (about 2 weeks after release)
    ranked_separately: false          # ranked in the all-groups table, with servers
    source: src-casp16-monomer
    quote: 125 human expert groups and 36 server groups submitted predictions for 16, 42, and 27
      targets from Phase 0, 1, and 2, respectively.
entrant_classes_history:
  source: src-casp16-overview
  quote: It is noteworthy that a server delivers the best performance—for much of the history of
    CASP, methods with human input performed better than servers.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open                  # after the edition; see access_by_phase
  access_by_phase:
    during_edition: sequences public, structures not yet released; submission needs a Prediction
      Center account
    after_edition: targets, predictions and results in an open directory listing
    after_edition_source: src-casp16-download
    after_edition_quote: Index of /download_area/CASP16
    note: >
      No single access value is true for the whole life of an edition. `fully-open` is the
      value for every completed edition, which is what a catalogue reader downloads.
      During an edition the closest term is `private-test-server`, and even that is loose:
      the structures are often not yet solved, let alone held by the maintainer.
  refresh: periodic-recompetition
  refresh_basis:
    reason: A new edition every two years, each with a fresh set of targets whose structures are not
      yet public (versions).
    source: src-casp17-home
    quote: Every two years, participants are invited to submit models for a set of macromolecules
      and their complexes (proteins, RNA, ligands) for which the experimental structures are not yet
      public.
  data_provenance:
    - experimental-measurement
  data_provenance_note: X-ray, cryo-EM and NMR structures, contributed by experimental groups before
    publication.
  contamination_risk: low
  contamination_risk_caveat: >
    Homologous structures in the PDB are legitimate inputs, not contamination, and they are
    exactly what the "weak evolutionary information" targets remove.
  contamination_risk_basis: >
    Targets are chosen because their structures are not yet public, and the organisers
    cancel targets that leak. CASP17's target list shows one cancelled because of a
    preprint and one because another group released the structure.
  contamination_risk_source: src-casp17-targets
  contamination_risk_quote: Canceled - preprint.
  ceiling_anchor_type: noise-ceiling
  ceiling_anchor_type_note: >
    02 S12.1 says expert-best. The sources say the ceiling is the experiment's own
    uncertainty, and for affinity they give it a number. The anchor is per category, not
    per benchmark.
  ceiling_by_category:
    - category: monomers
      source: src-casp16-overview
      quote: for most proteins, agreement is likely as high as can be obtained given experimental
        uncertainty.
    - category: ligand affinity
      value: 0.73
      metric: Kendall's tau
      source: src-casp16-ligand
      quote: well below the theoretical maximum possible given experimental uncertainty (~0.73)
  size:
    - count: 101
      unit: experimental targets assessed
      subset: CASP16
      source: src-casp16-overview
      quote: Results were assessed for a total of 101 experimental targets provided by 56 groups
        from 15 countries.
    - count: 300
      unit: targets released, in five prediction categories
      subset: CASP16
      note: Released and assessed are different counts. The home page's 300 are its 100+ modelling
        entities split into evaluation units, phases and ligand poses. Recorded, not reconciled.
      source: src-casp16-home
      quote: yielding 300 targets in five prediction categories

# --- Governance -------------------------------------------------------------------------------

governance:
  maintainer: Protein Structure Prediction Center (UC Davis) with a CASP organising committee
  maintainer_note: >
    The committee spans five institutions in three countries, so academic-lab understates
    it; but it is not a legally constituted consortium, and it does not re-form per
    edition, so neither alternative fits better.
  maintainer_type: academic-lab
  submission_process: assessment-committee
  submission_process_note: >
    The term's definition begins "There is no leaderboard". CASP has ranking tables; the
    rest of the definition (a peer-reviewed assessment by a committee) is right.
  independence_flags: []
  independence_flags_note: >
    Deliberately empty, not `no-known-conflict`, because the search found one thing a
    reviewer should rule on (below) and no term that fits it.
  independence_assessed: true
  funding:
    source: src-casp17-home
    quote: The CASP17 Experiment and the Protein Structure Prediction Center are funded by the NIH,
      National Institute of General Medical Sciences
  participation:
    source: src-casp17-home
    quote: Participation is open to all.
  independence_policy:
    source: src-casp17-home
    quote: In accordance with CASP policy, assessors cannot take part in the relevant parts of the
      experiment as predictors.
# --- Execution --------------------------------------------------------------------------------

execution:
  compute_tier: null                  # no source states what a participant's run costs; not guessed
  reproducibility_tier: null
  reproducibility_tier_note: >
    Two different questions with two different answers. Re-scoring archived CASP16 models
    against released structures is fully automatable from the open download area.
    Re-running the benchmark -- a blind prediction against unreleased structures -- is
    possible only inside a live edition, for anyone, and never afterwards. No tier term
    distinguishes these.
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: >
    02 S12.1 gives [unreleasable-data, wet-lab]. The data is released (see
    access_by_phase), and reproducing a score needs the deposited structure, not a new
    experiment. What cannot be reproduced is blindness, and live-world-state ("the same run
    cannot be repeated against the same conditions") is the nearest term.
  harness_availability: null
  harness_note: >
    The Prediction Center scores submissions and publishes the results; whether its
    evaluation code is published as a harness was not checked. Not guessed.
  submission_channel:
    source: src-casp17-home
    quote: New in CASP17 - we will be accepting submissions only through the web form or server API.

comparability:
  # P3-S6-T03. The facets resolve, through (expert-panel-assessment, domain-specialist-model), to the wet-lab profile:
  # assay_protocol, eligibility_track and subset_used. Two fields are added here rather than in
  # taxonomy/comparability-profiles.yaml, whose profiles are shared by every benchmark that resolves to them:
  #   human_assistance -- servers and human-led expert groups are separate entrant classes, the server table ranks
  #     servers alone, and the monomer assessment finds that human intervention improves models. A server's claim
  #     records `none` and an expert group's `permitted` (CASP lets expert groups intervene and does not require it),
  #     so the two never share a comparability key; tests/test_casp_metrics.py checks it.
  #   selection_strategy -- the Prediction Center and the assessors rank both the model each group designates 1 and
  #     its best model (src-casp16-zscores, src-casp16-complex-2026-11-18), two different numbers for one group.
  # subset_used already comes from the profile, and the server table also counts server-only targets
  # (casp#server-only-targets), so the two tables differ in subset as well.
  material_extra:
    - human_assistance
    - selection_strategy

liveness:
  last_checked: 2026-11-17

homepage: https://predictioncenter.org/
maintainer_url: https://predictioncenter.org/casp17/index.cgi

# --- Editions, categories, metrics and baselines (P3-S6-T03) ------------------------------------

versions:
  # Editions, not revisions (04 S6): each round is a new set of unreleased targets with a partly new category list
  # and its own assessors, so a CASP16 number and a CASP17 number are never on one test set, even within one
  # category. Earlier rounds are not modelled: no source read here covers them.
  - version: casp16
    label: CASP16 (2024)
    version_kind: edition
    changes: Targets released in 2024 in protein domain, multimer, RNA/DNA, accuracy-estimation,
      ligand and ensemble categories; multimers in three phases (without the stoichiometry, with it,
      and with a pool of MassiveFold models) and a Model 6 restricted to ColabFold's alignments.
      Assessed in the Proteins special issue, volume 94 issue 1, January 2026.
    breaking: true
    superseded_by: casp17
    frozen: true
    sources:
      - src-casp16-home
      - src-casp16-targets
      - src-casp16-numbers
      - src-casp16-overview
      - src-casp16-download
  - version: casp17
    label: CASP17 (2026)
    version_kind: edition
    changes: Targets released from May to August 2026; immune complexes a category of their own;
      submissions through the web form or the server API only. The prediction season is over and the
      assessment in progress, with results due on 2026-11-30 and the conference in Rome on 1-5
      December 2026.
    breaking: true
    supersedes_version: casp16
    frozen: false
    sources:
      - src-casp17-home
      - src-casp17-targets
      - src-casp17-numbers-2026-11-18
      - src-predictioncenter-news-2026-11-18

subsets:
  # One per category, carrying the quotes that say how the category is scored. A subset holds across editions; a
  # category that exists in one edition only says so in the comment above it (comments, not `notes`: a stress entry
  # holds no notes string the escape-hatch audit has not catalogued). metric_override names the category's ranking
  # metric where one Metric record is it.
  # Scored per evaluation unit, a domain or a group of domains. Two official rankings exist and can disagree: the
  # Prediction Center's table ranks on GDT_TS z-scores, and the assessors on a weighted sum of z-scores over nine
  # measures (GDT_HA, QSE, reLLG_const, SphGr, CAD_AA, GDC_SC, AL0_P, lDDT and the MolProbity score), of which only
  # lDDT has a Metric record. metric_override names the first.
  - id: casp#protein-domains
    label: Single proteins and domains (tertiary structure)
    metric_override: gdt-ts
    evidence:
      - source: src-casp16-home
        quote: 'Rankings: Protein Domains'
      - source: src-casp16-zscores
        quote: The ranking of groups is based on the analysis of zscores for GDT_TS .
      - source: src-casp16-monomer
        quote: 'nine representative measures were selected: GDT_HA, QSE, reLLG_const, SphGr, CAD_AA, GDC_SC,
          AL0_P'
  # The assessors rank groups on cumulative z-scores of an equal-weight average over six measures, five of which have
  # Metric records (ics, ips, dockq, tm-score, lddt; QSbest has none), so no single metric_override. CASP16 ran the
  # category in three phases (no stoichiometry given, stoichiometry given, and a pool of MassiveFold models given) and
  # took the ranking over all three as the main one.
  - id: casp#protein-multimers
    label: Protein complexes (multimers)
    evidence:
      - source: src-casp16-home
        quote: 'Rankings: Protein multimers'
      - source: src-casp16-complex-2026-11-18
        quote: we included ICS, IPS, DockQ, and QSbest to assess interface accuracy, and TM‐score
          and lDDT to evaluate global fold and local geometry
      - source: src-casp16-complex-2026-11-18
        quote: We weighted the z‐score for each metric equally to obtain an average z‐score for each
          model.
      - source: src-casp16-complex-2026-11-18
        quote: we consider the ranking over all phases as the main CASP16 ranking
  # A category of its own from CASP17. In CASP16 the eight antibody- and nanobody-antigen targets sat in the multimer
  # category and were scored on their antibody-antigen interfaces only, without TM-score and lDDT.
  - id: casp#immune-complexes
    label: Immune complexes (antibody-antigen, nanobody-antigen and T-cell receptor)
    evidence:
      - source: src-casp17-home
        quote: we are introducing immune complexes as a specific category in CASP17
      - source: src-casp16-complex-2026-11-18
        quote: we only used ICS, IPS, DockQ, and QSbest for AA targets to focus on antibody–antigen
          interface quality
  # The CASP16 overview reports the category's backbone agreement in GDT_TS; the rna-puzzles entry records the
  # RNA-Puzzles assessment of the same round's RNA-only targets. No metric_override: the sources read name no
  # single ranking score for the category.
  - id: casp#nucleic-acids
    label: RNA and DNA structures, monomers and multimers
    evidence:
      - source: src-casp16-home
        quote: 'Rankings: RNA/DNA monomers Rankings: RNA/DNA multimers'
      - source: src-casp16-overview
        quote: across all RNA monomers for selected groups in the most recent two CASP experiments,
          using the GDT_TS metric (max 100)
  # Scores predicted accuracy rather than structures; none of the seven Metric records applies.
  - id: casp#accuracy-estimation
    label: Estimation of model accuracy (EMA)
    evidence:
      - source: src-casp16-home
        quote: 'Rankings: EMA (accuracy)'
  # Poses are scored by LDDT-PLI, which has no Metric record yet; affinities are a subset of their own.
  - id: casp#ligands
    label: Protein-organic ligand complexes (pharmaceutical targets, pose and affinity)
    evidence:
      - source: src-casp16-home
        quote: 'Rankings: Ligands'
      - source: src-casp16-ligand
        quote: mean LDDT‐PLI values of 0.69 (scale of 0–1 with 1 best)
  - id: casp#ligand-affinity
    label: Ligand affinity ranking
    parent: casp#ligands
    metric_override: kendall-tau
    evidence:
      - source: src-casp16-ligand
        quote: The CASP affinity predictions showed modest correlation with experimental data
          (maximum Kendall's τ = 0.42)
  # A tab of its own on the CASP16 target list; its assessment was not read.
  - id: casp#ensembles
    label: Macromolecular ensembles
    evidence:
      - source: src-casp16-targets
        quote: Mono/Homo -mers Multimers RNA Ligand Ensemble
  # Targets released to servers only. The Prediction Center's server table ranks servers on the all-groups targets and
  # these together, and its all-groups table on the all-groups targets alone, so a server's result and an expert
  # group's can differ in subset_used as well as in human_assistance.
  - id: casp#server-only-targets
    label: Server-only targets
    scored_separately: false
    evidence:
      - source: src-casp16-zscores
        quote: Server groups on 'all groups' + 'server only' targets
      - source: src-casp17-targets
        quote: Target type 'h' is for human targets, 's' for server-only targets.

metrics:
  # Metric records (data/metrics/). Which one ranks depends on the category and on the edition's assessors, who may
  # add their own; each category's subset says which it uses. QSbest, LDDT-PLI and the monomer assessors' other
  # measures have no record yet.
  - gdt-ts
  - lddt
  - tm-score
  - dockq
  - ics
  - ips
  - kendall-tau

baselines:
  # Per category, as the assessment papers give them. For structures the papers put the ceiling at the experiment's
  # own uncertainty, and state it for monomers without a number; the affinity ceiling is the one with a number. The
  # assessors' ColabFold and AlphaFold 3 server references are registered groups, not anchors, and are not stored
  # here (review_checks).
  # The overview reads the top of the monomer distribution as the limit of the experiments themselves and gives it no
  # number, so headroom against it is null rather than computed against 100.
  - id: base-casp16-protein-domains-noise-ceiling
    benchmark_version: casp@casp16
    kind: noise-ceiling
    metric: gdt-ts
    value_absent_reason: not-yet-measured
    is_primary: true
    subset: casp#protein-domains
    source: src-casp16-overview
    evidence:
      - source: src-casp16-overview
        quote: for most proteins, agreement is likely as high as can be obtained given experimental
          uncertainty.
      - source: src-casp16-overview
        quote: For most targets additional improvement is likely limited by experiment accuracy.
  # The top of the scale, listed as the alternative anchor; the overview's reading is that experimental accuracy, not
  # this bound, limits the best models.
  - id: base-casp16-protein-domains-gdt-ts-maximum
    benchmark_version: casp@casp16
    kind: theoretical-maximum
    metric: gdt-ts
    value: 100
    subset: casp#protein-domains
    source: src-casp16-overview
    evidence:
      - source: src-casp16-overview
        quote: using the GDT_TS metric (max 100)
  # Approximate: the paper writes ~0.73 and calls it the theoretical maximum given experimental uncertainty, a ceiling
  # set by the noise in the measured affinities rather than by the scale, which reaches 1. The best CASP16 affinity
  # prediction reached 0.42.
  - id: base-casp16-ligand-affinity-noise-ceiling
    benchmark_version: casp@casp16
    kind: noise-ceiling
    metric: kendall-tau
    value: 0.73
    is_primary: true
    subset: casp#ligand-affinity
    source: src-casp16-ligand
    evidence:
      - source: src-casp16-ligand
        quote: well below the theoretical maximum possible given experimental uncertainty (~0.73)

tags:
  - assessment-in-progress


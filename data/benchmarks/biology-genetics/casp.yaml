    - id: src-predictioncenter-news-2026-11-18
      url: https://predictioncenter.org/news.cgi
      kind: maintainer-page
      text_sha256: 11193e53878a0a6906dd3ba3fa875928fe051c2152438db55fc2d34dd6d2903e
    - src-casp16-complex-2026-11-18
    - src-casp16-monomer-2026-11-18
    - src-predictioncenter-casp16-help
  sources_note: >
    Paper extracts are the Europe PMC full-text XML with tags stripped, NFC, whitespace
    collapsed. The XML keeps U+2010 hyphens and curly quotes, so a quote retyped with an
    ASCII hyphen will fail the substring check although it reads identically. The CASP17 numbers
    page and the Prediction Center's message board were read on 2026-11-18 for the 2026-11 sweep
    follow-ups; the message board is not archived, because its posts are signed by named organisers.
    For P3-S6-T03 (2026-11-18) the complex and monomer assessments were read again, as second
    Sources of the same articles, because the first records' windows hold none of the passages
    that task cites; the Prediction Center's help page is pending its archive capture.
  review_checks:
    - check: "A Google DeepMind researcher sits on the scientific advisory board, and DeepMind's AlphaFold3
        server is an evaluated entrant. Why no flag: maintainer-competes-on-own-benchmark names the maintainer,
        and an advisory board is not the maintainer. Neither is it funding. If this matters, the vocabulary
        needs an `advisor-affiliated-with-evaluated-party` flag; that is a P0-S2 decision."
      field: governance
      source: src-casp17-home
      quote: John Jumper, Google Deepmind, London, UK
    - check: human_assistance is material so that a server's result and an expert group's never
        share a key, and the convention for claims (P3-S8-T01) is `none` for a server and
        `permitted` for an expert group, since CASP lets expert groups intervene without requiring
        it. rna-puzzles, scored on the same CASP16 RNA targets, makes human_in_loop material for the
        same split instead; the two entries should use one field.
      field: comparability.material_extra
      source: src-casp16-monomer-2026-11-18
      quote: predictors could invest more time and apply human intervention to improve prediction
        quality
    - check: The facets resolve to the wet-lab profile, whose assay_protocol means little for a
        structure prediction. Waiving it, or giving blind structure prediction a profile of its own
        in taxonomy/comparability-profiles.yaml, is a vocabulary decision left open here.
      field: comparability
    - check: The Prediction Center's z-scores are computed within a pool, all groups or servers
        only, so one server's z-score in the server table and in the all-groups table are two
        numbers. A z-score claim needs its pool, and EvalConditions has no field for it;
        eligibility_track, material through the wet-lab profile, is the nearest.
      field: entrant_classes
      source: src-predictioncenter-casp16-help
      quote: z-score showing relative quality of the model among the first models submitted on the
        target by server groups (based on the GDT_TS score)
    - check: The metric list is CASP16's. Assessors may add metrics in any edition, so the CASP17
        papers may score categories on measures with no Metric record; re-read metrics and the
        subsets' evidence against them.
      field: metrics
      source: src-casp17-home
      quote: Assessment criteria will be based on those previously developed in CASP, but assessors
        may add new metrics they consider appropriate.
    - check: Which metric heads each category (gdt-ts for protein domains, kendall-tau for ligand
        affinity, none for multimers, which the assessors rank on an equal-weight z-score over six
        measures) is a structural-biology judgement.
      field: subsets
      specialist: true
    - check: The complex and monomer assessments measure progress against ColabFold, which takes
        part as a group, and against the AlphaFold 3 server's group. They are references, neither
        floors nor ceilings, and Baseline.kind has no term for a learned reference system, so their
        numbers (DockQ 0.47 on CASP16's ordinary complexes and 0.05 on its antibody-antigen targets;
        GDT_HA 72.2 on monomers, a measure with no Metric record) are left to the claims
        (P3-S8-T01). A kind for them would be a schema change.
      field: baselines
      source: src-casp16-complex-2026-11-18
      quote: ColabFold—used as a consistent baseline—achieved an average DockQ of 0.21 in CASP15 but
        dropped sharply to 0.05 in CASP16
    - check: A Baseline's primary is chosen per edition and metric, not per subset, so two
        categories scored on one metric (protein domains and RNA, both reported in GDT_TS) cannot
        each have their own primary. Only the protein-domain GDT_TS anchors are recorded; a
        per-subset primary would be a schema change (04 S7).
      field: baselines
    - check: Only CASP16 and CASP17 are versions. Earlier rounds are not modelled because no source
        read here covers them, so a result from one of them cannot be attached to a version yet.
      field: versions
  not_yet_available:
    - what: CASP17 assessment papers
      expected: after the CASP17 conference (2026-12-01 to 2026-12-05; results on the site from
        2026-11-30)
      consequence: Every assessment-derived field above is CASP16's.

# --- Per-edition facts BenchmarkVersion has no field for --------------------------------------
# P3-S6-T03 moved each edition's identity, kind, supersession, status and proceedings to versions[], its
# categories to subsets[], its target counts to data.size and the biennial cadence to data.refresh_basis.
# What stays is deferred because 04 S6's BenchmarkVersion has no field for it (docs/schema-field-needs.md,
# group `editions`: per-edition participation and assessors are not in S6), keyed by version tag. CASP1's
# year (first_edition) is in no source read here and was never filled.

editions:
  casp16:
    participation:
      sources_disagree: true        # four figures from the organisers for one round
      values:
        - claim: nearly 100 groups, more than 80,000 models
          source: src-casp16-home
          quote: nearly 100 research groups from around the world submitted more than 80,000 models
            on 100+ modeling entities yielding 300 targets in five prediction categories.
        - claim: over 100 groups, more than 120,000 models, 150+ targets
          source: src-casp17-home
          quote: In the latest CASP round, CASP16 in 2024, over 100 research groups from around the
            world submitted more than 120,000 models on 150+ targets in five broad prediction
            categories.
        - claim: 110 groups, 200 methods, over 128,000 submissions
          source: src-casp16-overview
          quote: A total of 110 research groups from 22 countries used a total of 200 methods to
            address a range of computational structural biology areas. In all, over 128,000
            submissions were received.
        - claim: 210 registered groups, 162 expert and 48 servers
          source: src-casp16-numbers
          quote: 'Number of groups registered 210 including: expert groups 162 prediction servers 48'
        - claim: 128,161 total submissions (last column of the all-categories row)
          source: src-casp16-numbers
          quote: 'All (unique): 200 / 48 29987 128161'
      preferred: src-casp16-overview  # the peer-reviewed overview; the others are web copy
    site_error_noted:
      source: src-casp16-home
      quote: CASP16 results will be published in a special edition of Proteins in 2023.
      note: A 2024 round cannot publish in 2023. Shown so nobody copies the date.
  casp17:
    prediction_season:
      sources_disagree: true        # the same page gives two end dates
      values:
        - value: 2026-09-11
          source: src-casp17-home
          quote: CASP17 prediction season is over as of September 11, 2026.
        - value: 2026-08-19
          source: src-casp17-home
          quote: CASP17 prediction season is over as of Aug 19, 2026.
    results_due:
      value: 2026-11-30             # the day before the conference's first session (conference below)
      source: src-casp17-home
      quote: The assessment results will be available through this website one day before the start
        of the CASP17 conference on November 30, 2026.
      note: Read until 2026-11-18 as 2026-11-29, with the conference starting on November 30 and the
        edition page's "December 2026" kept as a conflict. The message board fixes the conference at
        1-5 December, so "on November 30" dates the results, the eve of the first session; the
        edition page's December line agrees.
    conference:
      place: Rome, Italy
      start: 2026-12-01
      end: 2026-12-05
      source: src-predictioncenter-news-2026-11-18
      quote: For the first time, the main CASP meeting will be held in a city center, and in Rome no
        less, from December 1 to 5, 2026. Sessions will begin in the late afternoon on December 1
        and conclude at the end of the day on December 4.
      programme: The message board's post of 2026-11-11 says the programme comes out in the last
        week of November.
      programme_source: src-predictioncenter-news-2026-11-18
      programme_quote: The program will be released in the last week of November.
    participation:
      value: 244
      unit: groups with predictions (177 expert, 67 servers)
      source: src-casp17-numbers-2026-11-18
      quote: 'Number of groups with predictions 244 including: expert groups 177 prediction servers 67'
      caveat: >
        The page read on 2026-09-23 counted 245 groups (178 expert, 67 servers; src-casp17-numbers),
        and some of its other rows (pharma ligand pose 233, affinity 140, stage 2 110) were identical
        to CASP16's page and looked carried over. By 2026-11-18 the page had revised the count to
        244 and dropped those rows. Only the group counts are used.
    assessors_named: true
    assessors_source: src-casp17-home
saturation_by_category:
  # Why a single lifecycle value for CASP is wrong. Evidence only; `saturated` is derived.
  - category: single-domain fold prediction
    state: near-solved
    source: src-casp16-monomer
    quote: no target folds were incorrectly predicted across all Evaluation Units
  - category: protein complexes
    state: open
    source: src-casp16-complex
    quote: Even the leading groups can only predict slightly more than half of the targets to high
      accuracy.
  - category: nucleic acids, no homology
    state: open
    source: src-casp16-overview
    quote: Both approaches still produce very poor results in the absence of structural homology.
# maintenance_status is DERIVED by the probe protocol and may not appear in a hand-written
# file (04 S5); removed by P0-S4-T03. Its raw inputs follow.
maintenance_signals_seen:
  # 02 S12.1 hand-sets `unobservable` and argues CASP has no pollable signal. These are three.
  - signal: dated target list (entry and expiration dates per target)
    source: src-casp17-targets
  - signal: dated download-area directory listing
    source: src-casp16-download
  - signal: dated message board posts on the edition page
    source: src-casp17-home


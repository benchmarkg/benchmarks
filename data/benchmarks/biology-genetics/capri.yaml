lineage:
  role: root
lineage_note: >
  CAPRI is a separate benchmark from CASP (casp), set up on its model, with its own maintainer and its
  own targets outside the joint rounds. Since 2014 the two have run one joint assembly round per CASP
  season. CAPRI designates the templated subset of CASP's complex targets, predictors register with both
  and submit through the CAPRI gateway, which forwards the top five models to CASP, and both sides assess
  the models independently. The joint rounds are therefore editions of both benchmarks, recorded here
  as the casp*-capri rows. No lineage field fits two benchmarks sharing an edition's targets (not a fork,
  variant, subset or extension in either direction), so none is set.
lineage_source: src-casp16-overview
lineage_quote: Assessment is performed jointly with our sister organization CAPRI

tags:
  - protein-docking
  - protein-complexes
  - blind-prediction
  - community-experiment
  - scoring-challenge
  - antibody-antigen

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T05)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-capri-8th-evaluation
    - src-capri-site
    - src-capri-rules
    - src-capri-casp-capri
    - src-capri-publications
    - src-capri-round-57
    - src-capri-round-65
    - src-capri-round-66
    - src-capri-docking-home
    - src-capri-docking-assessment
    - src-casp11-capri
    - src-capri-haddock-rounds-47-55
    - src-capri-pydock-8th
    - src-capri-q
    - src-casp16-overview
    - src-casp16-complex
  sources_note: >
    Five open-access papers as Europe PMC full-text XML (DOI sources, not archived): the 8th CAPRI evaluation,
    the CASP11-CAPRI report, the HADDOCK and pyDock teams' 8th-period reports and CAPRI-Q (an NIH author
    manuscript under CC BY-NC-ND). Nine pages with scripts and styles stripped: seven from the CAPRI site
    at EMBL-EBI (allowed by its robots.txt, read with its 10-second crawl delay) and two from capri-docking.org
    (no robots.txt). The CASP16 overview and complex assessment were already Sources of casp. No CAPRI
    page states a licence.
  confidence: medium
  review_checks:
    - check: Identity and the relation to CASP. The joint CASP-CAPRI rounds are editions of both
        benchmarks, and 31 of 40 CASP16 oligomer targets were CAPRI targets. They are recorded here
        as casp*-capri rows and in lineage_note, because no lineage field takes two benchmarks
        sharing an edition. casp.yaml does not mention CAPRI; whether it should, and whether the
        schema needs a shared-edition relation, is for the lead.
      field: lineage
      source: src-casp16-complex
      quote: were also used in CAPRI
    - check: The edition unit. Rows are the eight evaluation periods, the seven joint rounds, the
        COVID19 round and an open row for the rounds since the 8th period, in two supersession
        chains, not the 66 rounds (one to fifty-odd targets each). Only the 8th period and
        CASP11-CAPRI were read in their assessment papers; the other rows rest on the publications
        page, the CASP-CAPRI page and the 8th evaluation's reference list. The years in the
        joint-round labels follow the biennial CASP seasons from 2014; only 2014, 2020 (before
        AlphaFold2's release), 2024 and 2026 are stated. Rounds 58, 62 and 63 do not appear among
        the home page's past rounds, which Round 58 being CASP16's MassiveFold round explains only
        in part.
      field: versions
    - check: The 8th evaluation counts its targets three ways (11 targets and 21 interfaces in the
        abstract, 10 targets and 21 subtargets for the ranking, 11 target complexes and 24
        interfaces in the conclusion), and the HADDOCK paper says 10 targets and 24 interfaces.
        data.size takes the abstract.
      field: data.size
      source: src-capri-8th-evaluation
      quote: The assessment presented here has been carried out over 11 target complexes
        representing a total of 24 evaluated interfaces.
    - check: Dates the sources disagree on. The 8th meeting was in Grenoble in February 2024 in the
        paper and on 14-16 February 2023 on capri-docking.org. The Round 57 page says CASP16-CAPRI
        results go to the "CASP15 Special Issue", a copy slip like the one casp.yaml notes on
        CASP16's page.
      field: versions
      source: src-capri-docking-home
      quote: The 8th CAPRI evaluation meeting took place in Grenoble, France, February 14-16 2023
    - check: maintainer-competes-on-own-benchmark rests on committee member Bonvin's HADDOCK team
        entering as server, human teams and scorer. The lead assessor's group is also close to
        entrants. Two of his 8th-evaluation co-authors wrote a Round 55 participant paper with him,
        and a group working with the assessors supplied Round 55's AlphaFold2 models.
        grader-from-evaluated-party is left out because the quality classes come from a formula. But
        the assessors also split targets, set difficulty and choose CASP-CAPRI targets, and a
        reviewer may rule that this is grading.
      field: governance.independence_flags
      source: src-capri-docking-assessment
      quote: in collaboration with the assessors had made AlphaFold2 models available, which were
        also assessed
    - check: contamination_risk low despite the T160 leak, in which a photo of the target shown at a
        meeting was posted online and used for restraints by one team. The rules allow public
        information and cancel predictions only if the structure itself becomes public. Whether a
        leaked image counts as a route to the answer, which would make the risk medium, needs a
        ruling.
      field: data.contamination_risk
      source: src-capri-haddock-rounds-47-55
      quote: this picture was used to derive interaction restraints
    - check: How many models count. The 2007 rules and the EBI home page say ten ranked models; the
        8th evaluation ranks predictors on the best of their top five and scorers on their top ten,
        and the joint rounds forward five to CASP. task.output follows the 8th evaluation; the rules
        page is dated March 2007.
      field: task.output
      source: src-capri-rules
      quote: Submissions must contain no more than 100 models, with the top 10 models ranked at the
        top in decreasing quality
    - check: maintainer_type community-collective or academic-lab. The assessments come from
        Lensink's group at Lille, capri-docking.org is copyrighted to Bonvin and CAPRI, and the
        gateway runs at EMBL-EBI, so one could name any of the three as holder.
      field: governance.maintainer_type
      source: src-capri-docking-home
      quote: 2026 Alexandre Bonvin & CAPRI.
    - check: harness_availability is null. CAPRI-Q implements the CAPRI criteria and is cited by the
        8th evaluation among its protocols; if the assessors score with it, official-harness
        applies. Its code licence was not read.
      field: execution.harness_availability
      source: src-capri-8th-evaluation
      quote: The classical CAPRI evaluation and ranking protocols were used to assess the quality of
        submitted models for most targets
    - check: Participants' own rankings differ from the official one. The pyDock paper puts its
        group 4th as predictors by its own success measure, while the 8th evaluation's Score_G table
        places it 6th. A ResultClaim drawn from a participant paper should cite the official table.
      field: aggregation_policy
      source: src-capri-pydock-8th
      quote: we succeeded in 45% of cases as predictors (ranking 4th among participants)
    - check: entrant-relative-ranking is rejected because the official ranking counts targets at
        fixed thresholds. The joint rounds' DockQ Z-score ranking is pool-relative, and if a
        reviewer treats it as a co-equal headline the term applies to those editions.
      field: evaluation_method
    - check: The scoring challenge has no capability term. Scorers are scored on picking correct
        models from a pool of other groups' decoys, a verification or selection skill.
        calibration-uncertainty is about emitted confidence and does not fit; a bench tag-gap record
        logs the miss.
      field: capability
  not_yet_available:
    - what: The CASP16-CAPRI assessment paper
      expected: The 8th evaluation (accepted June 2025) says the CASP16 analysis will be published
        later that year; none was found in Europe PMC on 2026-11-04.
      consequence: The casp16-capri row rests on the assessment website and the CASP16 complex
        assessment.
    - what: CASP17-CAPRI (Round 65) results
      expected: With the CASP17 assessment, from the conference on 2026-11-30.
      consequence: The casp17-capri row has no results.
  personal_data_excluded:
    - source: src-capri-site
      what: The mailing-list contact line naming a committee member, kept out of the windows.
    - source: src-capri-docking-assessment
      what: The contact line naming the lead assessor, kept out of the windows.

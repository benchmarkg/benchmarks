# data/benchmarks/biology-genetics/capri.yaml
#
# P1-S5-T05, biology-genetics entry 14. Filled from the CAPRI site at EMBL-EBI (the home, rules, CASP-CAPRI and
# publications pages and the Round 57, 65 and 66 pages, scripts and styles stripped); from capri-docking.org (the
# home and assessment results pages); from five open-access papers read as Europe PMC full-text XML: the 8th CAPRI
# evaluation (Lensink et al., Proteins 2026, 10.1002/prot.70018), the first joint CASP-CAPRI experiment (Lensink et
# al., Proteins 2016, 10.1002/prot.25007), the HADDOCK and pyDock teams' reports on the 8th evaluation period
# (10.1002/prot.26789 and 10.1002/prot.70038) and CAPRI-Q (J Mol Biol 2024, 10.1016/j.jmb.2024.168540); and from two
# CASP16 papers already on main (src-casp16-overview, src-casp16-complex). Every quote below is checked by the
# quote-substring validator against those Sources' extracts.
#
# Read and not cited: the management page (it lists the committee's e-mail addresses) and the past-targets page (it
# names each target's contributors). Not read: Janin et al. 2003, the evaluation papers before 2016 and the
# CASP12-CAPRI to CASP15-CAPRI papers, which are not open access in Europe PMC; their DOIs and pages come from the
# 8th evaluation's reference list and the CASP-CAPRI page.
#
# Identity. CAPRI is one family. Its evaluation periods (each closed by an evaluation meeting and assessment papers)
# and its joint CASP-CAPRI rounds are editions in versions[]; the 66 numbered rounds are not rows. CASP is a separate
# benchmark with another maintainer (casp.yaml), and the joint rounds belong to both; see lineage_note.

id: capri
name: CAPRI
aliases:
  - Critical Assessment of PRedicted Interactions
  - Critical Assessment of PRediction of Interactions
  - Critical Assessment of PRotein Interactions
aliases_note: The papers expand the acronym as the first form, the EMBL-EBI site's title as the
  second, and the CASP16 overview as the third.
tagline: Blind prediction of unpublished protein complex structures, in rounds since 2001, with a
  scoring challenge.
description: >
  The Critical Assessment of PRedicted Interactions, a community-wide blind experiment on modelling protein
  complexes, set up in 2001 on the model of CASP. Structural biologists offer CAPRI unpublished structures
  of complexes in confidence, and each target opens a prediction round of a few weeks, two to four rounds
  a year. Registered predictor groups and automated servers (with a shorter deadline) get the components'
  coordinates or, in the joint CASP-CAPRI rounds and most recent ones, sequences and stoichiometry, and
  submit up to 100 ranked models. In the scoring challenge, scorer groups pick the best models from the
  anonymised pool of everyone's submissions. Assessors classify each model's interfaces as incorrect,
  acceptable, medium or high quality from the fraction of native contacts and the interface and ligand
  RMSDs, and rank groups on a weighted count of targets met at each level. Most targets are protein-protein
  complexes, with protein-peptide, protein-DNA and protein-glycan targets as well. Results go to registered
  participants and the assessment website, and each evaluation period closes with a meeting and a Proteins
  special issue; there have been eight. Since 2014 one round per CASP season is a joint CASP-CAPRI assembly
  experiment on CASP's templated complex targets, assessed by both. The sources name these weaknesses:
  few complexes are available as targets, and scorers mostly fail to pick the best models in the pool.
self_description:
  source: src-capri-8th-evaluation
  quote: Its main goal is to assess the current state of the art and catalyze progress in
    computational methodology for modeling protein complexes.
paper: null
paper_note: The founding paper, Janin et al., "CAPRI, a Critical Assessment of PRedicted
  Interactions" (Proteins 52:2-9, 2003, 10.1002/prot.10381), is what the rules ask results to cite.
  It is not open access and was not read, so it is not recorded as a Source; the 8th evaluation's
  reference list gives its DOI.
paper_source: src-capri-8th-evaluation
paper_quote: 10.1002/prot.10381
released: null
released_note: The EMBL-EBI site and the 8th evaluation date CAPRI to 2001, and the publications
  page dates the first evaluation meeting to September 2002, but no source read gives the opening
  date of Round 1.
released_source: src-capri-site
released_quote: Since CAPRI began in 2001, the experiment has had two to four prediction rounds each
  year, with one or a few targets per round.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/protein-protein-interaction
  secondary:
    - biology-genetics/nucleic-acid-structure
  secondary_basis:
    reason: Protein-DNA complexes are CAPRI targets (T187 and T188 in the 8th evaluation period),
      and the CASP17-CAPRI round took complexes with nucleic acids as one of its three categories.
      The protein-ligand-cofolding exclusion sends a complex whose partner is a nucleic acid to
      nucleic-acid-structure.
    source: src-capri-round-65
    quote: 'The relevant CASP modelling categories for CAPRI this year are: Immune Complexes Complexes
      with Nucleic Acids Difficult Protein Complexes'
  per_edition: true
  per_edition_note: Protein-protein targets dominate every period. Protein-DNA targets appear in the
    8th evaluation period and in the CASP17-CAPRI round; protein-peptide and protein-oligosaccharide
    targets in the 6th and 7th.
domain_basis:
  reason: A target is the unpublished structure of a complex, and what is scored is how well a model
    reproduces its interfaces; the leaf's definition (whether two proteins bind and what the bound
    complex looks like) is the second half of that.
  source: src-capri-rules
  quote: CAPRI targets are protein-protein complexes, or possibly other complexes involving proteins
domain_considered_and_rejected:
  - term: biology-genetics/protein-structure-prediction
    reason: In the joint rounds and in most recent ones predictors start from sequence and must
      model the subunits, and CASP scores those, but CAPRI's own scores are computed per interface
      and its ranking counts interfaces, not folds.
    source: src-capri-8th-evaluation
    quote: The CAPRI assessment is interface centric.
  - term: biology-genetics/protein-ligand-cofolding
    reason: A few targets bind a sugar or an oligosaccharide, but the term is written for small
      molecules, and these are a handful among more than 380 target numbers.
    source: src-capri-site
    quote: Target 310 is an antibody-sugar complex.

capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: Predictors model the 3D structure of a protein complex, and the models are scored
      against the experimental structure its authors gave CAPRI before publication.
    source: src-capri-8th-evaluation
    quote: It has done so by offering participants the opportunity of testing their algorithms in
      blind predictions of experimentally determined 3D structures of protein complexes
capability_considered_and_rejected:
  - term: generation-fidelity
    reason: Its exclusion sends a predicted structure scored against measurement to
      scientific-prediction.
  - term: spatial-reasoning
    reason: Its exclusion covers scores of reconstruction accuracy rather than a spatial inference,
      which the native-contact fraction and the RMSDs are.
  - term: distribution-shift-generalization
    reason: The 8th evaluation runs AlphaFold on targets released after its training cutoff and
      splits the period into pre- and post-AlphaFold rounds, but targets are whatever
      experimentalists offer, and no score is reported as a shifted condition beside an
      in-distribution one.
    source: src-capri-8th-evaluation
    quote: Since all targets of this evaluation period were released afterwards, they fall out of
      the training set
  - term: calibration-uncertainty
    reason: Groups rank their own models, and the ranking takes the best of the top five, but no
      score consumes a confidence the system emits. The scoring challenge, selecting the correct
      models from a pool of others' decoys, has no capability term (logged with bench tag-gap).
    source: src-capri-8th-evaluation
    quote: A Round also includes a scoring challenge in which the correct assembly models must be
      identified out of a pool of decoys (incorrect models) submitted by the participating
      predictors.

evaluation_method:
  - domain-metric
  - expert-panel-assessment
evaluation_method_note: expert-panel-assessment rests on "This ranking represents the official
  performance ranking for the 8th Evaluation period" (src-capri-8th-evaluation). The assessment
  website posts per-round results with the warning that they are subject to minor changes, which is
  not a standing leaderboard.
evaluation_method_basis:
  reason: Models are scored by the CAPRI criteria, the fraction of native residue contacts (fnat)
    with the interface and ligand RMSDs, which set each interface's quality class, with DockQ
    computed beside them. The official ranking of an evaluation period is the one its assessors
    publish in the period's assessment paper.
  source: src-capri-8th-evaluation
  quote: the native contact recall (f nat) was calculated on residue
evaluation_method_considered_and_rejected:
  - term: entrant-relative-ranking
    reason: The official ranking counts targets met at fixed quality thresholds, which do not move
      with the pool. The joint CASP-CAPRI rounds add a ranking on DockQ Z-scores, which does, but as
      a second view (review_checks).
    source: src-capri-docking-assessment
    quote: As common for joint CASP-CAPRI Rounds, a ranking based on DockQ Z-scores was also
      calculated.
  - term: composite
    reason: Score_G weights the counts of acceptable, medium and high quality targets by 1, 2 and 3,
      but all three come from one classification, which the term's exclusion leaves out.
    source: src-capri-8th-evaluation
    quote: The weighting factors ω were taken as 1, 2, and 3, resp.
  - term: prospective-resolution
    reason: The target structure is solved before the round opens and is withheld; nothing resolves
      after submission.
    source: src-capri-8th-evaluation
    quote: Targets are structures of protein complexes/assemblies offered in strict confidence to
      CAPRI by structural biologists prior to publication.

designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
  - human-ai-team
designed_for_subjects_basis:
  reason: CAPRI was built for docking methods, which sample the components' relative positions and
    score them by shape complementarity and energy terms (classical-algorithm, whose test names an
    empirical docking scoring function). Since 2021 most groups run AlphaFold-derived and other
    learned predictors (domain-specialist-model). Most predictor groups are people who steer these
    tools; they are ranked with the servers, which run unattended on a shorter deadline
    (human-ai-team).
  source: src-capri-8th-evaluation
  quote: Historically, most predictions in CAPRI originate from docking and related conformational
    sampling approaches
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: The human groups work with docking programs and AI predictors, which the term's
      exclusion sends to human-ai-team. The 8th evaluation's contrast of human predictors with AI
      compares groups with vanilla AlphaFold, not unaided people.
    source: src-capri-8th-evaluation
    quote: human predictors still outperform AI on difficult targets, particularly those involving
      antibodies and nucleic acids
  - term: hosted-inference-endpoint
    reason: A server's own manager downloads the target and the server must answer within the
      deadline; CAPRI does not call the server as an endpoint, and a server is one group's method.
    source: src-capri-rules
    quote: A Web server participating in the prediction experiment should return its submission
      within 24 hours of the time its manager downloads the target

lifecycle: active
lifecycle_basis:
  reason: Round 66 opened for prediction on 2026-11-02, the CASP17-CAPRI round (65) listed 54 CAPRI
    target numbers from April to August 2026, and the 8th evaluation was published in 2025-2026 with
    participant papers in the same special issue.
  source: src-capri-site
  quote: It is our pleasure to announce CAPRI round 66, which is co-organised with SEPIQ 2026.
activity: accepting-submissions
activity_note: Round 66 (three nanobody targets, co-organised with the SEPIQ 2026 challenge) takes
  predictions until 2026-11-20 and scoring submissions from 23 to 27 November. Round 65's results
  are due with the CASP17 assessment, and the home page lists no further round.
activity_basis:
  reason: A round is open now, and registration stays open during a round.
  source: src-capri-round-66
  quote: The prediction period will open on November 2 and close on Friday November 20.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: AlphaFold2 and AlphaFold-Multimer inside participants' pipelines, from Round 53
    source: src-capri-8th-evaluation
    observed_on: 2026-11-04
    quote: As of Round 53, AI prediction methods have been integrated into most prediction pipelines
      of the participating groups.
    note: The assessors also run AlphaFold2 themselves as a baseline and to grade a target's
      difficulty; that run is not an entrant.
  - system: the pyDock pipeline with AlphaFold2-modelled subunits (a human team and the pyDockWEB
      server)
    source: src-capri-pydock-8th
    observed_on: 2026-11-04
    quote: after target T187 and onwards, interacting subunits were routinely modeled by AlphaFold2
evaluation_target: mixed
evaluation_target_note: Classical docking programs with empirical scoring functions, learned
  predictors and hybrids of the two are ranked together, many of them steered by human groups.
execution_mode: automated
execution_mode_note: Groups run their methods offline and upload models through the CAPRI gateway;
  the assessors compute the CAPRI criteria against the target structure. How much a human group
  intervenes is not recorded.
ground_truth_source: experimental
ground_truth_source_note: X-ray, cryo-EM and NMR structures of the complexes, given to CAPRI before
  publication.
reproducible_by_third_party: null
reproducible_by_third_party_note: CAPRI-Q, which implements the CAPRI criteria, is free to download,
  and most targets are later released in the PDB, so a published model can be rescored. But the
  submitted models fall under the confidentiality agreement, some targets stay unpublished, and a
  blind run is possible only inside a round. No source says whether a third party can obtain the
  archived models.

task:
  exists: true
  input:
    - in classic rounds, the atomic coordinates of the complex's components, unbound where they
      exist, with any public information (sequence, mutations)
    - in the joint CASP-CAPRI rounds and most recent ones, the sequences and stoichiometry, with
      pre-computed AlphaFold or MassiveFold models in some rounds
    - for scorers, the shuffled and anonymised pool of models the predictors uploaded
  output: Up to 100 models of the complex per target, ranked, of which the top five (top ten under
    the 2007 rules) count for the predictor ranking; scorers submit up to ten models chosen from the
    pool.
  scoring: Each interface of each model is classed incorrect, acceptable, medium or high quality
    from fnat, L-rms and i-rms (CAPRI-Q's thresholds); a group's result on a target is its best
    model in the top five (top ten for scorers); over an evaluation period, groups are ranked by
    Score_G, the counts of targets met at acceptable, medium and high quality weighted 1, 2 and 3.
    Large targets are split into subtargets, and peptide targets use stricter cut-offs.
  tests_hidden_from_system: true
  blinding:
    source: src-capri-8th-evaluation
    quote: Targets are structures of protein complexes/assemblies offered in strict confidence to
      CAPRI by structural biologists prior to publication.
  source: src-capri-rules
  quote: registered predictors are given access to atomic coordinates of the components, and they
    must submit up to 100 models of the complex before a deadline set some weeks later.

entrant_classes:
  - class: server
    deadline: 24 hours after download under the 2007 rules, at most 3 days in the 8th period, 72
      hours in the CASP17-CAPRI round
    deadline_source: src-capri-8th-evaluation
    deadline_quote: Servers can also participate in CAPRI and do so with a much shorter prediction
      time of at most 3 days.
    ranked_separately: true
    ranked_separately_note: Servers also appear in the combined predictor ranking.
    source: src-capri-8th-evaluation
    quote: Server group ranking 1 HDOCK 21 3**
  - class: predictor (human group)
    deadline: some weeks (two weeks per target in the CASP17-CAPRI round)
    deadline_source: src-capri-round-65
    deadline_quote: Every target will have a two-week prediction window, followed by a Scoring
      round.
    ranked_separately: false
    source: src-capri-8th-evaluation
    quote: (A) Predictor group ranking (human and server)
  - class: scorer
    deadline: a second deadline after the prediction period (five days in Round 66)
    ranked_separately: true
    source: src-capri-8th-evaluation
    quote: (C) Scorer group ranking (human and servers)

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The components or sequences go to registered participants, who must sign a
    confidentiality agreement that covers the targets and the models; the target structure stays
    with the assessors until its authors publish it. After a round the results go to registered
    participants and to the assessment website, and most targets later appear in the PDB.
  access_basis:
    reason: The inputs are released to registered participants while the target structure is
      withheld, and the models are scored against it.
    source: src-capri-rules
    quote: covered by a confidentiality agreement that all CAPRI participants must sign on the Web
      site
  access_by_phase:
    during_edition: Components' coordinates or sequences for registered participants under the
      confidentiality agreement; the scoring pool for registered scorers; the structure withheld.
    after_edition: Results for registered participants and on capri-docking.org; the structure in
      the PDB once its authors publish it, which for some targets had not happened when the 8th
      evaluation was written.
    after_edition_source: src-capri-rules
    after_edition_quote: Once the evaluation is completed, the results are made accessible to all
      registered participants through the Web site.
  refresh: periodic-recompetition
  refresh_note: A round opens whenever a target is offered, so the cadence is irregular; the
    editions in versions[] are the evaluation periods and the biennial joint rounds.
  refresh_basis:
    reason: Every round brings new, unpublished targets.
    source: src-capri-site
    quote: Since CAPRI began in 2001, the experiment has had two to four prediction rounds each
      year, with one or a few targets per round.
  data_provenance:
    - experimental-measurement
  data_provenance_note: Crystal, NMR and, more recently, cryo-EM structures, offered by the
    structural biologists who solved them.
  data_provenance_source: src-capri-site
  data_provenance_quote: Its targets are unpublished crystal or NMR structures of complexes,
    communicated on a confidential basis by their authors to the CAPRI management.
  contamination_risk: low
  contamination_risk_note: The target structures are unpublished, and predictions are cancelled if a
    structure becomes public before its round ends. Public information about a target is allowed,
    and one leak is documented. A picture of target T160, posted on social media while it was
    presented at a meeting, let the HADDOCK team derive restraints from it in Round 47
    (review_checks). Templates in the PDB and pre-computed AlphaFold models are inputs, not
    contamination.
  contamination_evidence:
    - source: src-capri-rules
      stance: against
      quote: Predictors may use all the information publicly available at the time the round starts,
        but predictions will be canceled if the target structure becomes public before the round is
        completed.
    - source: src-capri-haddock-rounds-47-55
      stance: supports
      quote: a picture showing the complex in the background was posted on social media
  dataset_licence: null
  dataset_licence_note: No licence is stated for targets or models. The confidentiality agreement
    governs them during a round, and the rules bar use of the results for advertisement or
    commercial purposes.
  dataset_licence_source: src-capri-rules
  dataset_licence_quote: The results may be not be used for advertisement or commercial purposes
  size:
    - count: 11
      unit: targets (21 interfaces)
      subset: 8th evaluation period, Rounds 47-49, 52, 53 and 55
      note: The same paper also counts 10 targets, and 24 evaluated interfaces (review_checks).
      source: src-capri-8th-evaluation
      quote: A total of 11 targets encompassing 21 interfaces, mostly in the difficult prediction
        category, were evaluated.
    - count: 34
      unit: targets (47 assessment units)
      subset: CASP16-CAPRI, Round 57 (2024)
      note: The Round 57 page lists 70 CAPRI target numbers (T236 to T309, with gaps), each against
        a CASP target ID; the assessment page counts 34 targets.
      source: src-capri-docking-assessment
      quote: The Round contained 34 targets, which led to a total of 47 assessment units (AUs).
    - count: 37
      unit: targets (38 assessment units)
      subset: CASP15-CAPRI, Round 54 (2022)
      source: src-capri-docking-assessment
      quote: CAPRI Round 54 comprised 37 targets, divided into 38 Assessment Units (AU).
    - count: 25
      unit: targets
      subset: CASP11-CAPRI, Round 30 (2014)
      source: src-casp11-capri
      quote: The Round comprised 25 targets from amongst those submitted for the CASP11 prediction
        experiment of 2014.
    - count: 3
      unit: targets
      subset: Round 66 (open, 2026)
      source: src-capri-round-66
      quote: In this round we will have three targets corresponding to three different nanobodies
        binding to the same protein.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CAPRI management committee; the round pages and submission gateway are hosted at
    EMBL-EBI (PDBe), and the news and assessment site, capri-docking.org, is kept by Alexandre
    Bonvin (Utrecht University)
  maintainer_basis:
    reason: The committee runs the rounds and two of its members choose which CASP targets become
      CAPRI targets. The 8th evaluation is written by Marc Lensink's group at the University of
      Lille with Bonvin and others.
    source: src-capri-round-57
    quote: Decision on targets designated for CAPRI docking and scoring predictions will be made by
      CAPRI MC members Alexandre Bonvin and Marc Lensink, and communicated to CASP.
  maintainer_type: community-collective
  maintainer_type_note: The committee's members sit at several universities and institutes, no legal
    form is stated, and no single institution is named as the holder; the gateway's host, EMBL-EBI,
    is one member's institute. academic-lab was considered (review_checks).
  submission_process:
    - held-out-server
    - assessment-committee
  submission_process_note: Groups upload models through the CAPRI gateway before each deadline; the
    assessors score them after the round against a structure the groups never saw, with the
    submitters' identities masked. Results of each round go to participants and the assessment site,
    and the official ranking of a period to its assessment paper. In the joint rounds the gateway
    also forwards each group's top five models to CASP.
  submission_process_source: src-capri-casp-capri
  submission_process_quote: participants are invited to submit 100 models in CAPRI format through
    the CAPRI gateway
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-capri-haddock-rounds-47-55
      quote: under various team names (HADDOCK for the server, and Bonvin and Giulini as human
        teams)
  independence_flags_note: The HADDOCK team of committee member Alexandre Bonvin, who co-authored
    the 8th evaluation and co-decides the CASP-CAPRI targets, took part in Rounds 47-55 as a server,
    as human predictor teams and as scorers; the HADDOCK server ranks fourth among servers in that
    evaluation. Members of the lead assessor's Lille group co-authored the 8th evaluation and a
    MassiveFold paper on Round 55 with him, and the assessment site says that in Round 55 a group
    working with the assessors supplied the AlphaFold2 models given to predictors.
    grader-from-evaluated-party is not tagged because the quality classes are computed by formula
    (review_checks). No source read names CAPRI's own funder; the 8th evaluation's funding statement
    is its authors'.
  independence_assessed: true
  participation:
    source: src-capri-rules
    quote: CAPRI is neither a competition nor a commercial enterprise, it is a community-wide
      experiment open to all research groups in a spirit of cooperation.
  independence_policy:
    source: src-capri-rules
    quote: The origin of the submissions is masked from the assessors.
  known_limitation:
    source: src-capri-8th-evaluation
    quote: Also in this CAPRI Evaluation Round scorers were in most cases not able to select the
      best quality models from the scoring sets.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  reproducibility_tier: null
  reproducibility_tier_note: Two questions with two answers, as for CASP. Rescoring a model against
    a released target structure is automatic with CAPRI-Q. A blind prediction of an unpublished
    complex is possible only inside a round, and the archived models fall under the confidentiality
    agreement. No tier term separates the two.
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: What cannot be repeated is the blindness. Once a target is
    published, and once its round's models have circulated among scorers, a new prediction is no
    longer blind.
  harness_availability: null
  harness_availability_note: CAPRI-Q, written by CAPRI assessors and committee members, implements
    the CAPRI criteria and is free to download (C source on gitlab.in2p3.fr) or to use as a web
    server, and the 8th evaluation cites it among the protocols it used. No source says it is the
    code that produces the official scores, so official-harness is not asserted (review_checks).
  harness_availability_source: src-capri-q
  harness_availability_quote: Here we present CAPRI-Q, a stand-alone model quality assessment tool,
    which can be freely downloaded or used via a publicly available web server.
  submission_channel:
    source: src-capri-casp-capri
    quote: participants are invited to submit 100 models in CAPRI format through the CAPRI gateway
  code_licence: null
  code_licence_note: CAPRI-Q's licence is not stated in its paper, and its repository was not read.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the resolved profile: which round, target set and era a figure covers (pre- or post-AlphaFold, joint
  # CASP-CAPRI or not, with or without pre-computed AlphaFold or MassiveFold models; subset_used), and whether a
  # group's result is its top-1, top-5 or top-10 model (selection_strategy), which the 8th evaluation shows can
  # move a scorer from first to third.
  material_extra:
    - subset_used
    - selection_strategy

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: Each evaluation period's assessors publish one official ranking of predictors, servers and
    scorers by Score_G over the period's targets.
  source: src-capri-8th-evaluation
  quote: This ranking represents the official performance ranking for the 8th Evaluation period
headline_metric: null

homepage: https://www.ebi.ac.uk/pdbe/complex-pred/capri/
maintainer_url: https://www.capri-docking.org/

versions:
  # Two series. The evaluation periods are CAPRI's own editions, each closed by an evaluation meeting and
  # assessment papers in a Proteins special issue; the joint CASP-CAPRI rounds run once per CASP season and are
  # assessed separately (the 8th evaluation excludes Rounds 50 and 54). Each series chains on its own.
  - version: evaluation-1
    label: 1st evaluation period (to 2002)
    version_kind: edition
    changes: Closed by the first CAPRI evaluation meeting, La Londe des Maures, 19-21 September
      2002; special issue Proteins 52(1), 2003, which carries the founding paper (Janin et al.,
      10.1002/prot.10381).
    breaking: true
    superseded_by: evaluation-2
    frozen: true
    sources:
      - src-capri-publications
      - src-capri-8th-evaluation
  - version: evaluation-2
    label: 2nd evaluation period (Rounds 3-5)
    version_kind: edition
    changes: Rounds 3 to 5, assessed in Mendez et al., Proteins 60:150-169 (2005),
      10.1002/prot.20551; meeting in Gaeta, 8-10 December 2004, where the scoring experiment was
      proposed; special issue Proteins 60(2), 2005.
    breaking: true
    supersedes_version: evaluation-1
    superseded_by: evaluation-3
    frozen: true
    sources:
      - src-capri-publications

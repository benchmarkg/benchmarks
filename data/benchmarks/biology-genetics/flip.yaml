  personal_data_excluded:
    - source: src-neurips-2021-flip
      what: The eight authors' e-mail addresses under the title; every window starts after them.
    - source: src-zenodo-18433203
      what: The creators' ORCIDs in the record's creator list; the windows are narrowed to 30

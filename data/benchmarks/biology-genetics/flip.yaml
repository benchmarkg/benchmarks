curation:
  added_by: agent (P1-S5-T06)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-neurips-2021-flip
    - src-neurips-2021-flip-abstract
    - src-biorxiv-api-2021-11-09-467890
    - src-github-flip-readme
    - src-github-flip-splits-readme
    - src-github-flip-license
    - src-flip-protein-properties
    - src-pmlr-v306-didi26a
    - src-zenodo-18433203
    - src-arxiv-2609-04793-v1
    - src-arxiv-2501-18223-v1
  sources_note: >
    The NeurIPS 2021 round-2 proceedings PDF read as text, with windows that keep the eight authors' e-mail
    addresses out, and its proceedings page for the venue and the published abstract; bioRxiv's API record
    for the posting date; the README, splits/README and LICENSE at commit 62cace8; the FLIP2 site as served
    HTML; the FLIP2 paper's PMLR PDF; Zenodo's API record, with narrow windows that keep the creators'
    ORCIDs out; and two papers that run FLIP. GitHub's API was read for the repository's creation and
    last push, its commits and dates and its licence metadata, and is not kept as a Source. benchmark.protein.properties,
    data.bioembeddings.com and the split files themselves were not read.
  confidence: medium
  review_checks:
    - check: FLIP2 is recorded as an edition in versions, by the 04 section 4 rule (same
        maintainers' next release, new items, same task, carried on the same site and repository).
        Against that, it has its own name, paper, citation and Zenodo DOI, and the site says the
        2021 datasets are not part of it, which would make it a separate benchmark linked by
        lineage. This is the entry's least clear-cut call.
      field: versions
      source: src-flip-protein-properties
      quote: These legacy datasets are not part of the FLIP2 benchmark
    - check: 'How FLIP and proteingym differ and overlap, as the two entries under biology-genetics/protein-fitness-prediction.
        ProteinGym spans over 250 assays scored mostly zero-shot with random, contiguous and modulo cross-validation
        and an official aggregate; FLIP has three (now ten) landscapes with engineering-motivated extrapolation
        splits, supervised training and no aggregate. The GB1 and AAV capsid landscapes look likely to
        appear in both corpora, which would make some assays shared: that was not confirmed from a Source
        here, and whether the pair deserves a lineage.correlates_with link is open.'
      field: lineage
      source: src-pmlr-v306-didi26a
      quote: results in the majority of datasets only containing single- and double- mutants
        collected via deep mutational scanning experiments
    - check: "activity is unknown rather than no-submission-channel: the paper's Figure 1 shows a \"Leaderboard\"\
        \ step and the 2021 home (benchmark.protein.properties) redirects to a Google Sites sign-in page,
        which was not read and not archived here. If a board never existed, no-submission-channel is right."
      field: activity
    - check: Six of the ten split sets in the repository (Bind, SAV, SCL, Secondary Structure,
        Conservation, Cas9) are described in no source read here, so their subsets carry no item
        count and no task description, and SCL and Secondary Structure would pull in domain leaves
        this entry does not take (protein-function-prediction, protein-structure-prediction). Their
        per-set READMEs on the data host were not read.
      field: subsets
      source: src-github-flip-splits-readme
      quote: '`mixed_vs_human_2`'
    - check: The published abstract on the proceedings page reads "curated splits" and "future
        expansion to new splits" where the PDF reads "curated tasks" and "new tasks". No field here
        depends on the difference, but a reviewer quoting the abstract should know the two differ.
      field: self_description
      source: src-neurips-2021-flip-abstract
      quote: Our curated splits, baselines, and metrics probe model generalization in settings
        relevant for protein engineering
    - check: compositional-generalization was rejected on the majority of splits, but GB1's
        1-vs-rest and 2-vs-rest fit its inclusion test exactly (the test variants recombine
        mutations seen singly). If the facet should follow the headline splits rather than the
        majority, it belongs in capability.
      field: capability
    - check: "sample-efficiency was rejected: the paper claims the low-resource setting and GB1 1-vs-rest
        leaves 29 training sequences, but no budget is fixed as the measured quantity. proteingym is the
        vocabulary's near miss for the same question, so the two entries should be decided together."
      field: capability
    - check: The FLIP2 site gives NucB 55,760 variants where the FLIP2 paper's Table 1 gives 55,759,
        and the 2021 paper's Table 2 repeats a landscape's total for every split of it. data.size
        follows the papers' tables.
      field: data.size
      source: src-pmlr-v306-didi26a
      quote: ntotal 3706 17143 55759 228298 24935 884 734
    - check: "dataset_licence is mixed and partly unchecked: AFL-3 for the 2021 derivatives, CC BY 4.0
        for FLIP2's data, MIT for its Amylase dataset per the site. The files on data.bioembeddings.com
        and the per-dataset READMEs were not read, so no file's own licence statement was seen."
      field: data.dataset_licence
      source: src-flip-protein-properties
      quote: All data licensed under CC-BY 4.0 or MIT.
    - check: 'harness_availability is reference-implementation-only: the repository ships baseline models
        and the split-building notebooks, and no scoring script was read. If baselines/ holds code that
        computes the official per-split Spearman, official-harness is right.'
      field: execution.harness_availability
      source: src-github-flip-readme
      quote: contains code used to compute baselines
    - check: ceiling_anchor_type is theoretical-maximum because Spearman is bounded at 1.0 and
        nothing measured is published. Assay noise puts the achievable score below 1.0 for every
        landscape, and proteingym, the other entry under this leaf, leaves the field at its default
        instead; the two should be decided together, and a reviewer may prefer none-known for a
        correlation against noisy measurements.
      field: data.ceiling_anchor_type
    - check: maintainer_type community-collective rests on the shared J-SNACKKB organisation account
        and the LICENSE naming no holder. Most of the 2026 edition's authors are at two companies,
        so industry-lab, or a co-maintainer reading, may fit better. Nobody is named here.
      field: governance.maintainer_type
    - check: Independence was not assessed. The 2026 baselines include language models bearing the
        authors' organisations' names, and no source read states who owns each; a reviewer with that
        evidence should decide whether maintainer-competes-on-own-benchmark applies.
      field: governance.independence_flags
  unreachable:
    - url: https://benchmark.protein.properties/
      http_status: 302
      consequence: The 2021 home redirects to a Google Sites sign-in page and was not read, so the
        leaderboard question (activity) and the site's own description of the splits rest on the

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T04)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-cagi-genome-biology-2024
    - src-cagi-site
    - src-cagi-challenges
    - src-cagi-meetings
    - src-cagi-organization
    - src-cagi-data-use-agreement
    - src-cagi2-challenge
    - src-cagi3-challenge
    - src-cagi7-challenge
    - src-cagi7-arsa
  sources_note: >
    The flagship paper as Europe PMC's full-text XML of the Genome Biology version of record (a DOI, not
    archived); and nine genomeinterpretation.org pages with scripts and styles stripped: the home page,
    the challenges, meetings, organization and data use agreement pages, the CAGI2 and CAGI3 round
    pages, the CAGI7 challenge page and the CAGI7 ARSA challenge page. The site states no licence. The
    round pages for CAGI1, CAGI4, CAGI5 and CAGI6 were read but not cited: they give no start dates
    beyond CAGI4's "Prediction season: through January 2016" and CAGI6's "Summer-Winter 2021".
  confidence: medium
  review_checks:
    - check: Identity. The entry is the CAGI series with its seven rounds as editions, as the plan
        holds for CASP, CAFA and CAGI. The challenges within a round, such as the Annotate All
        challenges, which keep being assessed as annotations accrue, are not entries of their own.
      field: versions
    - check: data.access is train-open-test-held-out, from the rounds, in which the phenotypes stay
        withheld. After a round, the answer keys sit behind registration and a data use agreement
        signed with initials by "registered and approved predictors". That would be
        gated-registration, or credentialed-dua if the approval vets credentials; no source mentions
        the training certification credentialed-dua's definition names.
      field: data.access
      source: src-cagi-data-use-agreement
      quote: If you agree to these rules, please indicate this by providing your initials.
    - check: activity results-pending or between-rounds. The CAGI7 conference presented results in

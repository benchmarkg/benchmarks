# data/benchmarks/biology-genetics/cagi.yaml
#
# P1-S5-T04, biology-genetics entry 5 of 9. Filled from the CAGI flagship paper (Genome Biology 25:53, 2024), read
# as Europe PMC's full-text XML of the version of record, and from genomeinterpretation.org: the home page, the
# challenges, meetings, organization and data use agreement pages, the CAGI2 and CAGI3 round pages, the CAGI7
# challenge page and the CAGI7 ARSA challenge page, each with scripts and styles stripped. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# The plan's family convention holds CASP, CAFA and CAGI to one entry each: CAGI's rounds are editions in
# versions[], and the challenges within a round are not entries of their own. casp.yaml keeps its rounds in an
# older `editions:` block that predates versions[], so only its idea, not its shape, is followed here.

id: cagi
name: CAGI
aliases:
  - Critical Assessment of Genome Interpretation
tagline: Blind prediction of the phenotypic effects of genetic variants, in rounds since 2010,
  scored by independent assessors.
description: >
  The Critical Assessment of Genome Interpretation, a community experiment modelled on CASP and run in
  rounds since 2010. In each round, data providers contribute unpublished experimental or clinical data.
  Registered predictors receive genetic variants, from single substitutions and saturation libraries to
  gene panels, exomes and genomes, and predict the phenotypes they cause: enzyme activity or protein
  stability in an assay, splicing or reporter expression, pathogenicity, disease status, or the
  diagnostic variants in a patient's genome. An independent assessor for each challenge evaluates the
  anonymised predictions against the measured phenotypes, mostly with correlation and ROC statistics,
  and
  each round closes with a conference and a special journal issue. There is no leaderboard and no score
  across challenges. Seven rounds have run: CAGI1 to CAGI5 (2010-2018) held 50 challenges, CAGI6
  (2021-2022) 13 and CAGI7 (2025-2026) 14. Participants must accept a data use agreement that keeps every
  dataset confidential until its provider releases it; answer keys are posted after a round, except
  patient data kept off the site for privacy. Known weaknesses the sources name: data diversity and
  quality are the biggest obstacle to clear assessment, and in some challenges clinical data leaked or
  batch effects confounded the assessment.
self_description:
  source: src-cagi-site
  quote: The overarching goal of the Critical Assessment of Genome Interpretation (CAGI) is to
    establish the state of the art in the field of interpreting genomic variation through periodic
    editions of the CAGI experiment and extensive dissemination of their outcomes.
external_ids:
  arxiv: '2205.05897'
paper:
  title: CAGI, the Critical Assessment of Genome Interpretation, establishes progress and prospects
    for computational genetic variant interpretation methods
  arxiv: '2205.05897'
  doi: 10.1186/s13059-023-03113-6
  source: src-cagi-genome-biology-2024
paper_note: The Genome Biology version of record (2024-02-22, CC BY 4.0) was read. Its arXiv
  preprint, 2205.05897, has one version (12 May 2022) under CC BY-NC-SA 4.0 and was not cited.
released: null
released_note: No source dates the opening of the first round. The challenges page dates the
  editions from 2010, and CAGI1 closed with a workshop in Berkeley on 10 December 2010.
released_source: src-cagi-meetings
released_quote: 'CAGI1 Conference Dates: December 10, 2010'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/genomics-variant-effect
  secondary:
    - biology-genetics/protein-fitness-prediction
    - biology-genetics/regulatory-genomics
  secondary_basis:
    reason: Thirteen of the first 50 challenges asked for missense effects on enzyme activity,
      stability or growth measured in assays, the protein-fitness-prediction case. Several, from
      CAGI4's eQTL challenge to CAGI7's lentiMPRA, asked for variant effects on reporter expression
      from sequence, the regulatory-genomics case ("Several CAGI challenges have assessed the
      ability of computational methods to identify single base changes that affect the expression
      level of specific genes.", same source).
    source: src-cagi-genome-biology-2024
    quote: Thirteen CAGI challenges have assessed the ability of computational methods to estimate
      these functional effects
  per_edition: true
  per_edition_note: Each round has its own challenge mix. Missense challenges scored against assays
    of enzyme activity, stability or growth (protein-fitness-prediction) and MPRA and eQTL
    challenges scored against reporter expression (regulatory-genomics) recur across rounds, so the
    secondary list is a union over editions.
domain_basis:
  reason: Every challenge gives predictors genetic variants and scores the phenotypes they predict,
    the leaf's functional or clinical consequence of a variant.
  source: src-cagi-challenges
  quote: CAGI experiment participants are provided genetic variants and make predictions about
    resulting phenotypes.
domain_considered_and_rejected:
  - term: medicine-health/diagnosis-triage
    reason: Four of the first 50 challenges, and the Rare Genomes Project challenges of CAGI6 and
      CAGI7, ask for the diagnostic variants in patients' genomes or panels. The scored output is
      still a variant's clinical consequence, which the primary leaf covers, and they are a minority
      of challenges.
    source: src-cagi-genome-biology-2024
    quote: In the area of rare disease diagnosis, four challenges have addressed this by requiring
      participants to identify diagnostic variants in sets of clinical data.
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: Predictors predict biological and clinical phenotypes of variants, and assessors compare
      the predictions with experimentally characterised phenotypes.
    source: src-cagi-challenges
    quote: Independent assessors evaluate the predictions against experimentally characterized
      phenotypes.
capability_considered_and_rejected:
  - term: calibration-uncertainty
    reason: The CAGI7 ARSA challenge asks for a standard deviation with every prediction, but no
      source says that the assessment scores it, and most challenges ask for none.
    source: src-cagi7-arsa
    quote: Each predicted protein stability must include a standard deviation that indicates the
      confidence in the provided prediction score
  - term: causal-reasoning
    reason: The eQTL and riskSNPs challenges asked which of several linked variants causes an
      effect, but they are a few of the challenges; the rest score predicted effects of given
      variants.
  - term: probabilistic-forecasting
    reason: The Annotate All challenges score predictions against annotations that appear after
      submission, but most challenges score phenotypes already measured and withheld.

evaluation_method:
  - statistical-fit
  - classification-metric
  - expert-panel-assessment
evaluation_method_note: classification-metric rests on "The full ROC curve areas provide a useful
  metric to measure the ability of the methods to separate pathogenic from other variants." and
  expert-panel-assessment on "Assessment outcomes together with invited papers from participants
  have been published in special issues of the journal Human Mutation" (both
  src-cagi-genome-biology-2024).
evaluation_method_basis:
  reason: Continuous phenotypes are scored by R², Pearson's correlation and Kendall's tau, and
    binary ones (pathogenic or not, case or control) by ROC AUC and truncated AUC, under the
    protocol of the 2024 flagship paper, which current challenges adopt. The authoritative output is
    each challenge's assessment, written by its named independent assessor and presented at the
    conference and in the special issue; there is no leaderboard.
  source: src-cagi-genome-biology-2024
  quote: Evaluating the prediction of continuous outputs is performed using three primary measures
evaluation_method_considered_and_rejected:
  - term: prospective-resolution
    reason: Only the Annotate All challenges are scored against annotations that appear after
      submission. Most challenges relate variants to phenotypes already measured but unpublished,
      and the term asks that the protocol guarantee resolution for its targets.
    source: src-cagi-genome-biology-2024
    quote: Participants are periodically provided with sets of genetic data and asked to relate
      these to unpublished phenotypes.
  - term: entrant-relative-ranking
    reason: The flagship paper selects methods by average rank over metrics, but says the selection
      is not a ranking of winners, and no published CAGI figure is relative to the pool.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are variant effect predictors, most trained on pathogenic and benign
    variants, with others built on evolutionary conservation, protein structure and stability, or
    splicing and regulatory sequence models.
  source: src-cagi-genome-biology-2024
  quote: Most were trained on pathogenic versus presumed benign variants
designed_for_subjects_considered_and_rejected:
  - term: human-ai-team
    reason: The clinical challenges required full analysis pipelines, and predictors are research
      groups, but no source says that submissions combine human judgement with the methods or sets
      such entrants apart.
    source: src-cagi-genome-biology-2024
    quote: These clinical challenges required participants to develop full analysis pipelines

lifecycle: active
lifecycle_basis:
  reason: CAGI7 released 14 challenges from June 2025, and its two Rare Genomes Project challenges
    took submissions until April 2026; the home page declared the prediction season complete on
    2026-06-22.
  source: src-cagi7-challenge
  quote: Summer-Winter 2025 Fourteen challenges released and completed.
activity: results-pending
activity_note: The CAGI7 conference (6-8 December 2025) came before the Rare Genomes Project
  deadlines (31 March and 30 April 2026), and the home page lists the CAGI7 special issue as to be
  announced. No CAGI8 is announced.
activity_basis:
  reason: CAGI7's prediction season is over and its special issue is not out, so the round is closed
    to entry with its results not yet published.
  source: src-cagi-site
  quote: CAGI7 prediction season is completed

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: MMSplice (selected high performer in the CAGI5 MaPSy and Vex-seq splicing challenges)
    source: src-cagi-genome-biology-2024
    observed_on: 2026-10-14
    quote: evaluates each region using separate neural networks
evaluation_target: learned-system
execution_mode: automated
execution_mode_note: Predictors run their methods offline and upload predictions, and each
  challenge's assessor scores them with statistics against the withheld phenotypes, then writes the
  assessment.
ground_truth_source: experimental
ground_truth_source_note: Assay measurements for most challenges; clinical diagnoses and case or
  control status for the clinical and complex-trait challenges; for the Annotate All challenges,
  clinical and experimental annotations that appear after submission.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: After a round, the answer keys of the reanalysed challenges are on the CAGI website for
    registered users who accept the data use agreement, and the flagship paper's reanalysis code is
    MIT-licensed, so archived or new predictions can be rescored. The blind condition of a round
    cannot be recreated, and the full patient data of the Crohn's and SickKids challenges are not on
    the site.
  source: src-cagi-genome-biology-2024
  quote: The answer keys for all reanalyzed CAGI challenges are available on the CAGI website.

task:
  exists: true
  input:
    - genetic variants, from single substitutions and saturation libraries to gene panels, exomes
      and genomes, with the challenge's background on the gene, assay or cohort
    - for clinical challenges, the patients' phenotype descriptions
  output: Per challenge, a predicted value per variant (enzyme activity, protein stability, splicing
    or expression change, in some challenges with a standard deviation), a probability of
    pathogenicity or disease per variant or individual, or the diagnostic variants of each patient.
  scoring: Each challenge's independent assessor scores the predictions against the measured or
    clinical phenotypes, mostly by Pearson's correlation, Kendall's tau, R² and ROC AUC. The final
    metrics are released after the challenge closes, and nothing is aggregated across challenges.
  tests_hidden_from_system: true
  source: src-cagi7-arsa
  quote: the final evaluation metrics will be released only after the challenge ends

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The gate is registration with a data use agreement each participant signs
    individually, agreeing not to share unreleased data except with other registered and approved
    predictors; some challenges' variant lists are public (CAGI7 ARSA's is). After a round the
    answer keys sit behind the same registration, which on its own would be gated-registration or
    credentialed-dua (review_checks). The flagship paper describes tiered access conditions by
    dataset sensitivity.
  access_basis:
    reason: During a round the variants are released to predictors while the phenotypes stay
      confidential with their providers, and the official assessments are made against them.
    source: src-cagi-data-use-agreement
    quote: All datasets (including genotypes and phenotypes) are confidential until released by the
      dataset provider.
  access_by_phase:
    during_edition: Challenge inputs go to registered predictors who accept the data use agreement;
      the phenotypes stay with the data providers until released.
    after_edition: Answer keys on the CAGI website after registration and acceptance of the data use
      agreement; the full patient data of the Crohn's and SickKids challenges are not kept there.
    after_edition_source: src-cagi-genome-biology-2024
    after_edition_quote: Access requires registration including acceptance of a data use agreement.
  refresh: periodic-recompetition
  refresh_note: The Annotate All challenges (CAGI5 to CAGI7) are scored against annotations that
    appear after submission, the resolves-over-time case, but they are a few challenges in rounds
    that otherwise score measured, withheld phenotypes.
  refresh_basis:
    reason: Each round brings new challenges on unpublished data, whose phenotypes exist when the
      variants are posed but are withheld.
    source: src-cagi-genome-biology-2024
    quote: Participants are periodically provided with sets of genetic data and asked to relate
      these to unpublished phenotypes.
  data_provenance:
    - experimental-measurement
    - patient-clinical-record
  data_provenance_note: Most challenges' phenotypes are assay readouts (enzyme activity, stability,
    yeast or cell growth, splicing, reporter expression). The clinical challenges use genomes,
    exomes or panels with phenotype descriptions of patients, collected in clinical care or research
    studies.
  data_provenance_source: src-cagi-data-use-agreement
  data_provenance_quote: The CAGI experiments depend on the interrogation of data from people whose
    information has been collected as part of clinical care
  contamination_risk: low
  contamination_risk_note: Low for what a round scores. The data are unpublished when posed, and the
    data use agreement bars using or sharing them before release. Past rounds had documented leaks
    of the answers by other routes, which complicated those challenges' assessments. Clinical data
    leaked in the Warfarin and VET challenges, and a PGP predictor used the project's public blog.
    Released answer keys and published assay data (such as PTEN and NAGLU) can now be in training
    data, which matters only for retrospective rescoring.
  contamination_evidence:
    - source: src-cagi-data-use-agreement
      stance: against
      quote: CAGI participants agree not to share unreleased datasets with anyone except other
        registered and approved predictors who have agreed to these terms.
    - source: src-cagi-genome-biology-2024
      stance: supports
      quote: leaked clinical data (Warfarin and VET challenges)
    - source: src-cagi-genome-biology-2024
      stance: supports
      quote: a participant made use of information in the PGP project blog
  dataset_licence: null
  dataset_licence_note: No licence is stated for CAGI datasets. The data use agreement governs them
    until release, after which they carry whatever terms the public release has.
  dataset_licence_source: src-cagi-data-use-agreement
  dataset_licence_quote: Following dataset release, CAGI participants may use the data with the same
    freedom and constraints as others who obtained the data via public mechanisms
  size:
    - count: 14
      unit: challenges
      subset: CAGI7 (2025-2026)
      source: src-cagi-challenges
      quote: CAGI7 challenge website, 14 challenges released
    - count: 13
      unit: challenges
      subset: CAGI6 (2021-2022)
      source: src-cagi-challenges
      quote: CAGI6 challenge website, 13 challenges released
    - count: 50
      unit: challenges
      subset: CAGI1 to CAGI5
      source: src-cagi-genome-biology-2024
      quote: The five complete editions of the CAGI community experiment comprised 50 challenges
  submission_limit:
    max_submissions: 6
    period_days: 0
    per: team and challenge, as models (the last upload of each model before the deadline is
      evaluated), in the CAGI7 ARSA challenge's rules
    source: src-cagi7-arsa

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CAGI organisers, chaired by Steven Brenner (UC Berkeley) and Predrag Radivojac
    (Northeastern University)
  maintainer_basis:
    reason: The NIH awards that support the CAGI experiments and conferences are Brenner's, and most
      of the organisers the flagship paper lists are at UC Berkeley. Moult (University of Maryland)
      chaired earlier rounds, and an ethics forum, advisory boards and a scientific council sit
      beside the chairs.
    source: src-cagi-organization
    quote: Brenner, chair Professor, University of California, Berkeley
  maintainer_type: academic-lab
  maintainer_type_note: community-collective was considered. The organisers come from several
    institutions and no source names the institution that holds the site and data, but the funding
    and most organisers are at one Berkeley group, and CAGI does not re-form per edition
    (conference-workshop).
  submission_process:
    - held-out-server
    - assessment-committee
  submission_process_note: Predictors download each challenge's data, run their methods and upload
    predictions, on Synapse in CAGI7, with a methods description for each. An independent assessor
    per challenge scores them after the deadline against phenotypes the predictors never saw.
    Results go to the CAGI conference and a special journal issue, and there is no leaderboard. A
    submission must carry a detailed methods description, published only if the result is made
    public, so publication-gated is not tagged (review_checks).
  submission_process_source: src-cagi7-arsa
  submission_process_quote: CAGI allows submission of up to six models per team, of which model 1 is
    considered primary.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-cagi-genome-biology-2024
      quote: Principal authors of this paper participated as predictors in many of the CAGI
        challenges reported.
    - flag: grader-from-evaluated-party
      source: src-cagi3-challenge
      quote: 'RiskSNPs: 12 submissions. Assessor: John Moult.'
    - flag: funded-by-evaluated-party
      source: src-cagi-genome-biology-2024
      quote: as well as a Research Agreement with Tata Consultancy Services (TCS) to SEB
  independence_flags_note: The flagship paper's principal authors include the chairs. Its predictor
    list includes John Moult, a CAGI organiser and chair, and Predrag Radivojac, now a chair. The
    CAGI3 page lists Moult, Sean Mooney and Silvio Tosatto among that round's predictors while they
    assessed riskSNPs, PGP and p16; Moult and Tosatto had also provided those challenges' data.
    Whether any of them assessed a challenge they entered is not shown. Tata Consultancy Services
    funded CAGI under a research agreement and built part of its informatics, and TCS researchers
    are among the paper's predictors.
  independence_assessed: true
  funding:
    source: src-cagi-organization
    quote: The CAGI experiment is supported by the National Institutes of Health (NIH) award U24
      HG007346.
  independence_policy:
    source: src-cagi-genome-biology-2024
    quote: Independent assessors evaluate the anonymized predictions, promoting a high level of
      rigor and objectivity.
  known_limitation:
    source: src-cagi-genome-biology-2024
    quote: The biggest obstacle to clear assessment has been and continues to be data diversity and
      quality

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  reproducibility_tier: null
  reproducibility_tier_note: Two questions with two answers, as for CASP. Rescoring archived or new
    predictions on a released challenge is automatable from the answer keys after registration,
    except where patient data are kept off the site. Repeating the benchmark itself, a blind
    prediction of unpublished phenotypes, is possible only inside a live round and never afterwards.
    No tier term separates the two.
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: What cannot be reproduced is the blindness. Once a challenge's data
    are released or published, a new prediction is no longer blind, and the Annotate All challenges
    are scored against annotations that keep accruing.
  harness_availability: reference-implementation-only
  harness: CAGI50, the flagship paper's MATLAB reanalysis code (genomeinterpretation/CAGI50); each
    challenge ships a submission template and a format validation script
  harness_note: The official scores are each challenge's assessor's. The CAGI50 code reproduces the
    paper's reanalysis of CAGI1-CAGI5 challenges, with full data only for NAGLU and PTEN in the
    repository.
  harness_source: src-cagi-genome-biology-2024
  harness_quote: The code used for the analyses in this paper is available on GitHub
  submission_channel:
    source: src-cagi7-arsa
    quote: Download data & submit predictions on Synapse
  code_licence: MIT
  code_licence_note: The licence of the CAGI50 reanalysis code. GitHub's metadata reports
    NOASSERTION, and the repository's copyright.txt carries the MIT text (read 2026-10-14).
  code_licence_source: src-cagi-genome-biology-2024
  code_licence_quote: under an MIT Open Source license
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which challenge of which round (each is its own dataset and phenotype), and
  # what the method was trained on, since predictors may train on ClinVar, gnomAD, HGMD and MaveDB and the
  # flagship paper flags circularity between computation-assisted annotation and assessment.
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: CAGI reports many metrics per challenge and no single indicator, and nothing is combined
    across challenges.
  source: src-cagi-genome-biology-2024
  quote: CAGI has committed to employing a diversity of evaluation metrics rather than any single
    primary performance indicator
headline_metric: null
no_legitimate_aggregate: true
no_legitimate_aggregate_basis:
  reason: Challenges score different phenotypes on different data, and the flagship paper warns
    against reading its own method selections as rankings.
  source: src-cagi-genome-biology-2024
  quote: As always in CAGI, these should not be interpreted as identifying winners and losers

homepage: https://genomeinterpretation.org/
maintainer_url: https://genomeinterpretation.org/organization.html


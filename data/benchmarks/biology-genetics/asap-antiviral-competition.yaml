# data/benchmarks/biology-genetics/asap-antiviral-competition.yaml
#
# P1-S5-T06, biology-genetics entry 20.
# Filled from the organisers' overview paper, MacDermott-Opeskin et al., "A Computational Community Blind
# Challenge on Pan-Coronavirus Drug Discovery Data", J. Chem. Inf. Model. 66(6), 3129-3149 (2026), read as
# its PubMed Central author manuscript (DOI 10.1021/acs.jcim.5c02106; no preprint of it was found, and a
# participant paper's PMC copy answered with a captcha, see curation.unreachable); the three Polaris
# competition pages as served, which carry each subchallenge's sizes, split, metric and timeline; the
# examples-and-evaluation repository's README and LICENSE at commit 56fcb82 (2025-06-23); Zenodo's API
# record of the unblinded challenge data; OpenADMET's own blind-challenge index and publication list, read
# for what followed this competition and for continued use of its data; and Crossref's record of a
# participant team's retrospective preprint. No account was created and no login was attempted on Polaris.
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: asap-antiviral-competition
name: ASAP Discovery x OpenADMET Antiviral Competition
aliases:
  - ASAP-Polaris-OpenADMET antiviral competition
  - ASAP-Polaris-OpenADMET Blind Challenge
  - ASAP Discovery x OpenADMET challenge
  - Antiviral Drug Discovery 2025
tagline: Blind prediction of potency, ligand poses and ADMET on withheld coronavirus Mpro
  lead-optimisation data.
description: >
  A two-month blind challenge run in early 2025 by the ASAP Discovery Consortium with Polaris and the
  OpenADMET project, on data from ASAP's pan-coronavirus main-protease (Mpro) programme that was withheld
  from publication while a patent application was pending. Three subchallenges, each its own Polaris
  competition, were scored: biochemical potency (pIC50 against SARS-CoV-2 Mpro and MERS-CoV Mpro, 297
  test
  molecules), crystallographic ligand poses (195 test structures, 98 SARS-CoV-2 and 97 MERS-CoV, trained
  on
  770 COVID Moonshot SARS-CoV-2 structures only) and five ADMET endpoints (mouse and human liver microsomal
  clearance, kinetic solubility, LogD and MDR1-MDCKII permeability, 126 test molecules). Participants
  downloaded the training half through the Polaris Python API and submitted predictions to it; the test
  labels stayed with the organisers, scores were revealed only at three staged leaderboard checkpoints,
  and
  only a participant's last submission counted. The potency and ADMET splits are date-biased rather than
  random, to imitate prospective lead optimisation, and the pose track holds out a second target
  altogether. Ranking is by mean absolute error, macro-averaged over a subchallenge's endpoints, for
  potency and ADMET, and by the share of poses within 2 angstroms symmetry-corrected RMSD for poses, each
  with bootstrapped confidence intervals and a Tukey HSD compact-letter display beside it. The challenge
  drew 381 submissions from 66 participants, 93 of them on the final leaderboard. It closed on 2025-03-10,
  the data was unblinded at the preclinical-candidate disclosure on 2025-03-25 and is now public on Polaris
  and Zenodo, and the organisers report that deep-learning methods came first in all three tracks while
  physics-based docking and solubility ranking fared worst. Known weaknesses the sources name: about 70
  compounds leak from the ADMET training set into the potency test set, the pose track's ligand-only,
  pre-aligned submission format produced large errors for participants whose alignment or chain choice
  was
  wrong, and one test structure's reference was misaligned during preparation.
self_description:
  source: src-jcim-2026-asap-antiviral-challenge
  quote: We report the outcomes and key insights from an open science community blind challenge
    focused on computational methods in drug discovery
paper:
  title: A Computational Community Blind Challenge on Pan-Coronavirus Drug Discovery Data
  doi: 10.1021/acs.jcim.5c02106
  source: src-jcim-2026-asap-antiviral-challenge
paper_note: Published 2026-02-26 in the Journal of Chemical Information and Modeling, nearly a year
  after the challenge closed, as the overview paper of that journal's special issue on the
  challenge. Read as the PubMed Central author manuscript. No preprint of it was found
  (review_checks).
released: 2025-01-13
released_note: The challenge start date. Sample data was released on 2024-12-03 and the final
  leaderboard closed on 2025-03-10.
released_source: src-polaris-antiviral-potency-2025
released_quote: 'Sample data released: December 3 (2024) Challenge start: Jan 13 (2025)'
release_venue: Polaris Hub, as three competitions under the asap-discovery organisation
release_venue_source: src-polaris-antiviral-potency-2025

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/drug-target-interaction
  secondary:
    - biology-genetics/protein-ligand-cofolding
    - chemistry-materials/drug-discovery-admet
domain_basis:
  reason: The largest track by test items (297 of 618) predicts how strongly each compound inhibits
    a named protein target, pIC50 against SARS-CoV-2 Mpro and MERS-CoV Mpro, which is the
    drug-target-interaction leaf word for word; the leaf's own note keeps a drug candidate's binding
    here. The pose track (195 items) is protein-ligand-cofolding, whose inclusion test covers a
    small molecule's pose in a protein pocket whatever the method, and both family exclusion tests
    keep a bound pose in biology-genetics. The ADMET track (126 items) is the one part that scores
    the molecule's own properties, which is chemistry-materials/drug-discovery-admet.
  source: src-jcim-2026-asap-antiviral-challenge
  quote: to predict the biochemical potency and crystallographic ligand poses of small molecules
    against key coronavirus targets
domain_considered_and_rejected:
  - term: chemistry-materials/experimental-hit-finding
    reason: No compound is nominated for synthesis or assay by a participant. Every assay had
      already been run inside the discovery programme, and predictions are scored against those
      stored measurements, which the leaf's definition (nominating compounds that are then
      synthesised and assayed) excludes.
  - term: chemistry-materials/molecular-property-prediction
    reason: The ADMET endpoints are absorption, distribution, metabolism and excretion properties,
      which the more specific drug-discovery-admet leaf claims; the general molecular-property leaf
      would lose that.
  - term: biology-genetics/protein-structure-prediction
    reason: The pose track gives both chain sequences and scores only the ligand's pose; no protein
      structure is scored, and the submission format is the ligand alone.
  - term: medicine-health/treatment-planning
    reason: Stands for the medicine-health family, whose inclusion test needs a clinical endpoint.
      The compounds are preclinical candidates for an antiviral therapy, but nothing here is
      measured in a patient and no treatment is chosen.

capability:
  - scientific-prediction
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: Every track predicts a measured property or structure of a protein-ligand system and is
      scored against the experiment, which is the term's inclusion test.
    source: src-jcim-2026-asap-antiviral-challenge
    quote: to predict the biochemical potency and crystallographic ligand poses of small molecules
      against key coronavirus targets
  distribution-shift-generalization:
    reason: The pose track releases training structures for one target and scores a test set that
      also holds the second, with per-target success rates reported as conditions of their own, and
      the potency and ADMET splits are date-biased so that the scored compounds are the later ones.
      The task and its labels do not change; only which compounds and which target are scored.
    source: src-polaris-antiviral-ligand-poses-2025
    quote: We will provide training data on SARS CoV-2 Mpro, but participants are free to use any
      data in the public domain. The test set will be comprised of both MERS-CoV Mpro and SARS-CoV-2
      Mpro structures
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The discriminant is what moves. The scored task, its endpoints and its metrics are
      identical across targets and periods; only the inputs move, which the distribution-shift
      term's inclusion test claims even where a source calls it transfer.
  - term: probabilistic-forecasting
    reason: Point predictions are submitted and scored against measurements that already existed
      when the challenge opened, not probabilities scored on resolution.
  - term: calibration-uncertainty
    reason: No uncertainty is required or scored. The bootstrapped intervals are the organisers' own
      estimate of metric variance, not the entrant's emitted distribution.
  - term: optimization
    reason: Nothing is designed or searched over. Participants predict properties of compounds the
      programme had already made; the lead-optimisation campaign itself is the data's provenance,
      not the task.

evaluation_method:
  - statistical-fit
  - domain-metric
evaluation_method_basis:
  reason: The potency and ADMET tracks rank by mean absolute error against the measured values, with
    mean squared error, Pearson R, Spearman rho, Kendall tau and R-squared reported beside it
    (statistical-fit). The pose track reports the share of ligands within a symmetry-corrected
    heavy-atom RMSD of 2 angstroms, the field's own success criterion for a binding pose
    (domain-metric).
  source: src-jcim-2026-asap-antiviral-challenge
  quote: For the potency subchallenge, MAE was chosen as an appropriate, flexible, and continuous
    metric for potency evaluation.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The ranking figure for a multi-endpoint track is one metric macro-averaged over
      endpoints scored the same way, which the term's exclusion test sends away from composite; the
      three tracks are modelled as subsets rather than folded into one number.
    source: src-jcim-2026-asap-antiviral-challenge
    quote: the macro-averaged (averaged over all endpoints of the subchallenge) primary metric was
      used for ranking
  - term: entrant-relative-ranking
    reason: Each entrant's headline number is its own error or success rate and does not move when
      the pool changes. The compact-letter display beside it does depend on who else entered,
      because the letters come from pairwise Tukey HSD tests over the pool, but it is a significance
      grouping rather than the published figure (review_checks).
  - term: wet-lab-validation
    reason: The assays are the ground truth rather than a step in a run; they were performed inside
      the discovery programme before the challenge opened, and no submitted compound is sent to a
      bench.
  - term: classification-metric
    reason: Every endpoint is continuous and scored as error or correlation; nothing is scored from
      predicted class labels.

designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_note: >
  classical-algorithm is the second term, because non-learned docking entered and was scored beside the
  learned methods, including the organisers' own reference-based docking baseline and a blind-docking
  baseline ("The best performing physics-based docking method (d) was the reference-based POSIT baseline
  used by the ASAP team", src-jcim-2026-asap-antiviral-challenge), and the paper reports the physics-based
  group's range of success.
designed_for_subjects_basis:
  reason: The challenge was built for the drug-discovery modelling community, and the entries the
    paper analyses are models specialised to that field, among them graph neural network and
    transformer models for potency, multi-task GNNs for ADMET and co-folding architectures for
    poses.
  source: src-jcim-2026-asap-antiviral-challenge
  quote: a diverse set of deep learning approaches including the MolE65 and MolGPS66 graph neural
    network (GNN) foundation models
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: The framing is close -- the paper reads the best co-folding models as a possible
      surrogate for MERS-CoV Mpro crystallography, and the potency and ADMET endpoints are assay
      readouts -- but the entries are field-specialised predictors scored against stored
      measurements rather than emulators standing in for a run of the assay, as posebusters and
      runs-n-poses record for the same shape of task (review_checks).
  - term: task-specific-supervised-model
    reason: The tasks are defined by structural biology and medicinal chemistry, which the term's
      exclusion test sends to domain-specialist-model.
  - term: human-expert
    reason: No human baseline was run. The medicinal chemists' own practice is described as context
      (clogP used to tune clearance) and is not scored.

as_used:
  - protocol: A participant team's retrospective comparison of classical machine learning with deep
      learning on the potency and ADMET tracks, reporting its own challenge placings (first on the
      SARS-CoV-2 pIC50 endpoint by Pearson R, fourth on aggregated ADME) and re-running the
      comparison with statistical tests after the data was unblinded.
    split: The challenge test sets, potency and ADMET
    source: src-crossref-chemrxiv-2025-64fcb
    quote: classical methods remain highly competitive for predicting potency, modern deep learning
      algorithms significantly outperformed traditional machine learning in ADME prediction
    note: Crossref's record of the preprint (v3, 2025-11-07; the journal version is
      10.1021/acs.jcim.5c01982). Only its abstract was read, so the protocol is as the abstract
      states it. The team reports by Pearson R rather than by the challenge's primary MAE, which is
      one of the re-rankings the organisers warn about.

lifecycle: active
lifecycle_basis:
  reason: The competition itself is over, but its unblinded data is still used as a benchmark. The
    organisers' publication list counts 29 papers using OpenADMET datasets, 26 of them from outside
    the organisers, and names this challenge's potency, pose and ADMET sets among them with the
    endpoints each paper used; a participant team's preprint reporting against it is dated November
    2025, and the overview paper appeared in February 2026.
  source: src-openadmet-publications
  quote: '29 papers that use OpenADMET datasets: 3 challenge overview papers from the organizers and 26
    from the wider community'
activity: closed
activity_note: The organisers kept the community forum and the unblinded dataset open after the
  close ("unblinded challenge dataset as well as the Discord channel remain open to this day",
  src-jcim-2026-asap-antiviral-challenge), which is continued use rather than an open submission
  route.
activity_basis:
  reason: The submission route existed and shut. All three Polaris competition pages read "Ended
    over 1 year ago", the final leaderboard closed on 2025-03-10 and the winners were announced on
    2025-03-25. No standing board takes entries on this data, and the challenges that followed are
    OpenADMET's own on new datasets rather than a further round of this one (lineage_note).
  source: src-polaris-antiviral-potency-2025
  quote: Ended over 1 year ago

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: MolE and MolGPS (potency track, top entries)
    source: src-jcim-2026-asap-antiviral-challenge
    observed_on: 2026-11-05
    quote: a diverse set of deep learning approaches including the MolE65 and MolGPS66 graph neural
      network (GNN) foundation models
  - system: Multi-task GNNs including D-MPNN with Chemprop (ADMET track, three of the top five)
    source: src-jcim-2026-asap-antiviral-challenge
    observed_on: 2026-11-05
    quote: Three of the top 5 participants employed variations on GNN architectures
evaluation_target: learned-system
execution_mode: automated
execution_mode_note: Predictions are scored by the organisers' code against withheld labels. The
  assays and crystallography that produced those labels were run inside the discovery programme
  before the challenge and are not part of a run.
ground_truth_source: experimental
ground_truth_source_basis:
  reason: Dose-response biochemical assays for potency, an outsourced ADMET panel, and X-ray
    crystallography for the poses, all generated by the ASAP programme.
  source: src-jcim-2026-asap-antiviral-challenge
  quote: Mpro inhibition was measured via a direct in vitro dose-response biochemical assay, using a
    fluorescent Mpro substrate.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The unblinded data was published on Polaris and Zenodo after the close, and the evaluation
    logic that ranked the entries is in a public repository, so a third party can recompute a score.
    What cannot be reproduced is the blind condition.
  source: src-jcim-2026-asap-antiviral-challenge
  quote: evaluation logic was open-sourced on GitHub

task:
  exists: true
  input:
    - a molecule's CXSMILES, and nothing else at test time (potency and ADMET tracks)
    - the target label, both chain sequences and the ligand's CXSMILES (ligand-pose track)
  output: >
    Per track: two pIC50 values per molecule (SARS-CoV-2 Mpro and MERS-CoV Mpro); five ADMET values per
    molecule (MLM, HLM, KSOL, LogD, MDR1-MDCKII permeability); or a serialised RDKit molecule of the posed
    ligand alone, pre-aligned to the reference structure.
  scoring: >
    Mean absolute error against the measured values, macro-averaged over a track's endpoints, for potency
    and ADMET (ADMET endpoints log-transformed first, except LogD); for poses, the share of ligands whose
    symmetry-corrected heavy-atom RMSD to the crystallographic pose is under 2 angstroms. Metric
    distributions are bootstrapped and entries grouped by Tukey HSD compact-letter display, with MSE,
    Pearson R, Spearman rho, Kendall tau and R-squared reported beside the primary metric.
  tests_hidden_from_system: true
  source: src-polaris-antiviral-potency-2025
  quote: You must provide predictions for both Mpro targets. We will evaluate your submission using
    the mean absolute error of the predicted endpoint.
task_note: The pose track's submission format is the ligand only, because the platform could not
  store full protein-ligand structures at the time ("participants were required to submit a
  serialized RDKit molecule of the ligand only, pre-aligned to a reference structure",
  src-jcim-2026-asap-antiviral-challenge). That alignment step is part of the apparatus and a source
  of large errors (known_limitation).

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: After the close the organisers published the participant-facing data and the unblinded
      test data; the Zenodo deposit holds the potency and ADMET tables and the pose structures under
      CC BY 4.0.
    source: src-jcim-2026-asap-antiviral-challenge
    quote: we openly posted the participant-facing challenge dataset on both the Polaris platform
      and Zenodo
  access_by_phase:
    during_edition: train-open-test-held-out. Participants pulled the training half through the
      Polaris API and received test inputs without labels, submitting predictions for the organisers
      to score; a Polaris account was needed to submit.
    during_edition_source: src-polaris-antiviral-potency-2025
    during_edition_quote: At test time, we will only provide the CXSMILES.
    after_edition: fully-open. The test data was published at the preclinical-candidate disclosure
      on 2025-03-25, and the datasets are on Polaris, Zenodo (CC BY 4.0) and Hugging Face.
    after_edition_source: src-jcim-2026-asap-antiviral-challenge
    after_edition_quote: after this date all test set data was published
  refresh: static
  refresh_basis:
    reason: One round, one dataset, now fixed and deposited. The organisers' later challenges use
      other donors' data and other endpoints rather than re-running this one (lineage_note).
    source: src-zenodo-15582067
    quote: Raw datasets for the ASAP-Polaris-OpenADMET blind challenge.
  data_provenance:
    - experimental-measurement
  data_provenance_note: Biochemical assays at one institute, an outsourced ADMET panel and
    synchrotron X-ray crystallography, collated from the programme's Collaborative Drug Discovery
    vault. curated-public-database was considered and rejected, because the COVID Moonshot
    structures used as the pose training set come from the PDB, but what is scored is the
    programme's own unpublished measurements.
  data_provenance_source: src-jcim-2026-asap-antiviral-challenge
  data_provenance_quote: ADMET data was collected on an ADMET panel from Bienta
  contamination_risk: high
  contamination_risk_note: >
    The challenge itself ran blind: the data was withheld from publication for a patent application,
    participants never saw the test labels, and scores were shown only at staged checkpoints. Two routes
    are nevertheless evidenced in content the challenge scored. First, the organisers state that about
    70
    compounds leak from the ADMET training set into the potency test set and that the leak was unavoidable
    given the overlap between the two sets; they argue it gives participants little information because
    the leaked subset cannot be identified in advance, but the route was not closed. Second, duplicate
    molecules and racemic near-duplicates survived the first preparation pass and were found by
    participants during the challenge, and the evaluation logic was revised to exclude them before the
    final leaderboards. For any use after March 2025 the test labels are public, which is the ordinary
    medium risk of a public static set.
  contamination_risk_source: src-jcim-2026-asap-antiviral-challenge
  contamination_risk_quote: compounds leak between the ADMET training set and potency test set
  contamination_evidence:
    - source: src-jcim-2026-asap-antiviral-challenge
      stance: supports
      quote: compounds leak between the ADMET training set and potency test set
    - source: src-jcim-2026-asap-antiviral-challenge
      stance: supports
      quote: The evaluation logic was revised several times following feedback from participants
    - source: src-jcim-2026-asap-antiviral-challenge
      stance: against
      quote: a significant portion of its drug discovery data was withheld to ensure a successful
        patent application
    - source: src-jcim-2026-asap-antiviral-challenge
      stance: against
      quote: performance is only revealed at staged leaderboard checkpoints
    - source: src-jcim-2026-asap-antiviral-challenge
      stance: supports
      quote: after this date all test set data was published
  ceiling_anchor_type: experimental-replicate
  ceiling_anchor_type_note: One field for three tracks. The anchor above is the potency track's; the
    pose track's success rate is bounded at 100% with no measured ceiling (theoretical-maximum), and
    no source gives an assay-reproducibility figure for the ADMET endpoints (review_checks). The
    figures cited are literature estimates for assays of this kind, not replicate measurements of
    these test compounds; the paper also shows the two assays' control distributions.
  ceiling_anchor_type_basis:
    reason: The paper places the top potency entry's error against assay reproducibility rather than
      against zero error, citing an intra-assay variability of about 0.3 log units and a Kendall tau
      of about 0.71 between rigorously curated repeat measurements as a rough upper bound.
    source: src-jcim-2026-asap-antiviral-challenge
    quote: these provide a rough estimate of the upper bound of intra-assay variability
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The Zenodo deposit of the unblinded data is CC BY 4.0; the Polaris
    competition pages state no licence of their own, and the record marks itself identical to a
    Hugging Face dataset.
  dataset_licence_source: src-zenodo-15582067
  dataset_licence_quote: '"id": "cc-by-4.0"'
  size:
    - count: 297
      unit: test molecules (each predicted for two targets)
      subset: potency subchallenge
      source: src-polaris-antiviral-potency-2025
      quote: 'Duration: 2 monthsTrain size: 1,031Test size: 297'
    - count: 195
      unit: test crystal structures
      subset: ligand-pose subchallenge
      source: src-polaris-antiviral-ligand-poses-2025
      quote: 'Duration: 2 monthsTrain size: 770Test size: 195'
    - count: 126
      unit: test molecules (each predicted for five endpoints)
      subset: ADMET subchallenge
      source: src-polaris-antiviral-admet-2025
      quote: 'Duration: 2 monthsTrain size: 434Test size: 126'
    - count: 1031
      unit: training molecules
      subset: potency subchallenge
      source: src-polaris-antiviral-potency-2025
      quote: 'Duration: 2 monthsTrain size: 1,031Test size: 297'
    - count: 770
      unit: training crystal structures (COVID Moonshot, SARS-CoV-2 Mpro only)
      subset: ligand-pose subchallenge
      source: src-jcim-2026-asap-antiviral-challenge
      quote: was used as the training set totaling 770 structures for SARS-CoV-2 Mpro only
    - count: 434
      unit: training molecules
      subset: ADMET subchallenge
      source: src-polaris-antiviral-admet-2025
      quote: 'Duration: 2 monthsTrain size: 434Test size: 126'
    - count: 93
      unit: submissions on the final leaderboard (381 submissions from 66 participants over the
        challenge)
      subset: all three subchallenges
      source: src-jcim-2026-asap-antiviral-challenge
      quote: including 381 challenge submissions across 66 unique participants, and with a total of
        93 submissions for the final leaderboard
  size_note: No headline count is stated for the challenge as a whole. The three test sets sum to
    618 items, of which the two tracks in this family hold 492, but that sum is the curator's
    arithmetic over the three competition pages, so the rows are kept per track with the potency
    track, the largest, first. Endpoint counts multiply the molecule counts, giving 594 potency
    values and 630 ADMET values.
  languages: []
# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ASAP Discovery Consortium, with Polaris (the hosting platform) and the OpenADMET
    project
  maintainer_basis:
    reason: The paper names the three partners and the name it gives the challenge; the data is
      ASAP's, the platform and evaluation infrastructure Polaris's, and OpenADMET is the ADMET
      partner that has since carried the challenge series on.
    source: src-jcim-2026-asap-antiviral-challenge
    quote: in partnership with Polaris and the OpenADMET project
  maintainer_type: consortium
  maintainer_type_note: ASAP is an NIH-funded multi-institution consortium and the challenge was run
    by three partners jointly, which is why consortium is preferred to academic-lab or nonprofit.
    The paper describes OpenADMET as an ARPA-H-funded consortium of a university, a company and a
    software foundation (review_checks).
  maintainer_type_source: src-jcim-2026-asap-antiviral-challenge
  maintainer_type_quote: ASAP partnered with OpenADMET, a new Advanced Research Projects Agency for
    Health (ARPA-H)29 funded consortium
  submission_process:
    - held-out-server
  submission_process_note: >
    The eligibility requirement is recorded here rather than as publication-gated ("participants were
    required to provide either a link to code detailing their methods, or a short written report",
    src-jcim-2026-asap-antiviral-challenge). The route is now shut (activity).
  submission_process_basis:
    reason: Participants uploaded predictions through the Polaris API, which rejected malformed
      submissions, and the organisers scored them against labels the participants never saw,
      revealing performance only at three staged checkpoints. Only the last submission counted, and
      a code link or written report was required for final-leaderboard eligibility.
    source: src-jcim-2026-asap-antiviral-challenge
    quote: Participants uploaded their predictions to the Polaris platform via the API over the
      course of the challenge.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-jcim-2026-asap-antiviral-challenge
      quote: Top performing methodologies outperformed existing graph attentional neural networks
        employed at ASAP to predict affinities (23rd best entry
    - flag: single-evaluator-private-test-set
      source: src-jcim-2026-asap-antiviral-challenge
      quote: a significant portion of its drug discovery data was withheld to ensure a successful
        patent application
  independence_flags_note: >
    The organisers entered their own methods: ASAP's internal affinity model appears in the potency leaderboard,
    and the best physics-based pose entry and the worst were both organiser baselines, marked as such
    in the paper's figures. The test data was held and scored by the organisers alone throughout. Two
    further questions were looked for and are not flagged. Prizes were merchandise packs from the hosting
    platform rather than a cash pool, which is not read here as prize-sponsored-by-industry. Funding is
    public (ARPA-H and NIH awards), and the paper's competing-interests statement discloses one author's
    commercial roles, including with the vendor of the docking software used for the organisers' pose
    baseline; that fact sits beside an individual's name, so it is left to a reviewer rather than quoted
    (review_checks).
  independence_assessed: true
  funding:
    source: src-jcim-2026-asap-antiviral-challenge
    quote: ASAP partnered with OpenADMET, a new Advanced Research Projects Agency for Health
      (ARPA-H)29 funded consortium
  funding_note: The quote is the introduction's description of the ADMET partner's funding. The
    paper's own funding section names ARPA-H and NIAID awards for this work but sits beside an
    individual's name and acknowledgements, so it is not quoted.
  known_limitation:
    source: src-jcim-2026-asap-antiviral-challenge
    quote: the reference structure was misaligned during dataset preparation which caused test
      evaluation to fail even on correctly placed ligand poses

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: A run is the participant's own model producing predictions for at most a few
    hundred molecules or structures, and no source states what that costs or mandates any hardware.
    The paper notes that free-energy methods were discouraged by the scale, but that is an
    observation about entrants' choices, not a stated requirement (review_checks).
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data is public and the evaluation package that produced the rankings, with its
      per-subchallenge exclusion lists, is in the examples repository under MIT, so a score can be
      recomputed without a human, a wet lab or the maintainer. The blind condition cannot be
      recreated.
    source: src-jcim-2026-asap-antiviral-challenge
    quote: evaluation logic was open-sourced on GitHub
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The examples repository's evaluation package (evaluation/potency.py, admet.py,
    ligand_poses.py, with bootstrapping.py and cld.py for the intervals and compact letter display)
    over the Polaris Python client, with two notebooks showing how a submission is built
  harness_source: src-github-asap-polaris-challenge-readme
  harness_quote: Example notebooks for the 2025 [Polaris](https://polarishub.io/) x
    [ASAP](https://asapdiscovery.org/) x [OpenADMET](https://openadmet.org/) blind challenge in
    computational approaches to drug discovery.
  harness_gotcha:
    source: src-jcim-2026-asap-antiviral-challenge
    quote: participants were required to submit a serialized RDKit molecule of the ligand only,
      pre-aligned to a reference structure
  code_licence: MIT
  code_licence_source: src-github-asap-polaris-challenge-license
  code_licence_quote: MIT License
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The pair (statistical-fit, domain-specialist-model) is not in the profile table, so this resolves to
  # the fallback profile and its one material field, subset_used -- which track, which target and which
  # chemical series were scored. Two more are material here: what else the model was trained on (the top
  # entries in every track brought outside pre-training or proprietary data, and training was
  # unconstrained), and the harness (the pose track's alignment-to-reference step, and which revision of
  # the evaluation logic and its exclusion lists was used).
  material_extra:
    - training_data_policy
    - harness
aggregation_policy: official-aggregate
aggregation_policy_note: The organisers say the macro-average is a compromise they would revisit,
  because each endpoint contributes according to its log-normalised dynamic range, and that the
  ordering shifts if another metric is used for ranking.
aggregation_policy_basis:
  reason: Within a track the organisers publish one ranking figure, the macro-averaged primary
    metric over that track's endpoints, with the per-metric columns beside it. Across the three
    tracks there is no combined score.
  source: src-jcim-2026-asap-antiviral-challenge
  quote: the macro-averaged (averaged over all endpoints of the subchallenge) primary metric was
    used for ranking

homepage: https://polarishub.io/competitions/asap-discovery/antiviral-drug-discovery-2025
repository: https://github.com/asapdiscovery/asap-polaris-blind-challenge-examples
dataset_url: https://doi.org/10.5281/zenodo.15582067
leaderboard_url: https://polarishub.io/competitions/asap-discovery/antiviral-drug-discovery-2025

versions:
  - version: '2025'
    label: The one round, 13 January to 10 March 2025
    version_kind: edition
    released: 2025-01-13
    changes: The only round. Three subchallenges on withheld lead-optimisation data from ASAP's
      pan-coronavirus Mpro programme, with two intermediate leaderboards, office hours with the
      experimentalists, and a final leaderboard timed to the preclinical-candidate disclosure on
      2025-03-25, after which the data was unblinded.
    breaking: true
    errata:
      - date: null
        scope: evaluation logic
        description: The evaluation logic was revised several times during the challenge after
          participant feedback, excluding duplicates missed on the first preparation pass and
          racemic measurements differing only in extended stereochemistry, and adding pooling logic
          for test compounds with more than one crystal structure. The revisions landed before the
          final leaderboards; the repository carries per-subchallenge exclusion lists.
        source: src-jcim-2026-asap-antiviral-challenge
    frozen: true
    sources:
      - src-polaris-antiviral-potency-2025
      - src-jcim-2026-asap-antiviral-challenge
versions_note: One edition, recorded so that a later OpenADMET round cannot be read as a version of
  this one. 04 S6 makes an edition breaking by definition, which here only records that there is
  nothing earlier to compare with.

subsets:
  - id: asap-antiviral-competition#potency
    label: Potency, pIC50 against SARS-CoV-2 Mpro and MERS-CoV Mpro
    items: 297
    scored_separately: true
    domain_override:
      primary: biology-genetics/drug-target-interaction
    evidence:
      - source: src-polaris-antiviral-potency-2025
        quote: 'Duration: 2 monthsTrain size: 1,031Test size: 297'
      - source: src-polaris-antiviral-potency-2025
        quote: You must provide predictions for both Mpro targets. We will evaluate your submission
          using the mean absolute error of the predicted endpoint.
    notes: Two endpoints, one per target, macro-averaged into the ranking metric. Measurements
      outside the assays' dynamic range were excluded before the split, and the test set is biased
      towards later compounds by MERS-CoV assay date.
  - id: asap-antiviral-competition#ligand-poses
    label: Ligand poses, SARS-CoV-2 and MERS-CoV Mpro crystal structures
    items: 195
    scored_separately: true
    domain_override:
      primary: biology-genetics/protein-ligand-cofolding
    evidence:
      - source: src-polaris-antiviral-ligand-poses-2025
        quote: 'Duration: 2 monthsTrain size: 770Test size: 195'
      - source: src-polaris-antiviral-ligand-poses-2025
        quote: We will evaluate your submission using % of poses with a RMSD<2A compared to the
          crystallographic pose.
    notes: Training structures are SARS-CoV-2 Mpro only, from the COVID Moonshot; the test set adds
      the second target. Co-folding methods took the top places and most deep-learning docking
      methods scored near zero.
  - id: asap-antiviral-competition#poses-sars-cov-2
    label: SARS-CoV-2 Mpro test structures
    parent: asap-antiviral-competition#ligand-poses
    items: 98
    evidence:
      - source: src-jcim-2026-asap-antiviral-challenge
        quote: the test set comprised 98 SARS-CoV-2 Mpro structures and 97 MERS-CoV Mpro structures
    notes: Success rates are reported per target; most entries did better here than on MERS-CoV
      Mpro.
  - id: asap-antiviral-competition#poses-mers-cov
    label: MERS-CoV Mpro test structures
    parent: asap-antiviral-competition#ligand-poses
    items: 97
    evidence:
      - source: src-jcim-2026-asap-antiviral-challenge
        quote: the test set comprised 98 SARS-CoV-2 Mpro structures and 97 MERS-CoV Mpro structures
    notes: The held-out target, with no MERS-CoV Mpro structure in the training set; some entries
      posed a whole series into the wrong chain of its dimer.
  - id: asap-antiviral-competition#admet
    label: ADMET, five endpoints (MLM, HLM, KSOL, LogD, MDR1-MDCKII permeability)
    items: 126
    scored_separately: true
    domain_override:
      primary: chemistry-materials/drug-discovery-admet
    evidence:
      - source: src-polaris-antiviral-admet-2025
        quote: 'Duration: 2 monthsTrain size: 434Test size: 126'
      - source: src-polaris-antiviral-admet-2025
        quote: We will evaluate your submission using MAE on the log transformed endpoints, after
          clipping to the strictly positive detection limit.
    notes: The secondary-domain track. Every endpoint must be predicted; all but LogD are
      log-transformed before scoring. Solubility was well predicted by MAE and badly ranked, which
      the organisers read as memorisation of the training distribution.
subsets_note: The three subchallenges are three Polaris competitions sharing one dataset, one
  timeline and one results page, which 04 S4 models as subsets rather than separate benchmarks (same
  release, same maintainer, scored separately). Each has its own primary metric and leaderboard, so
  subset_used is material. The two pose children record the per-target split the paper reports.

lineage:
  role: root
lineage_note: >
  No lineage relation is set. The pose track's training set is the COVID Moonshot's SARS-CoV-2 Mpro
  structures, but Moonshot is a discovery programme rather than a benchmark. The challenges that followed
  are a series rather than editions of this one: OpenADMET lists this competition under past challenges
  as
  an earlier, OpenADMET-associated one, and its own rounds since -- the 2025-26 ExpansionRx-OpenADMET
  challenge on another company's ADMET data, the 2026 PXR challenge and the CYP inhibition challenge
  running now -- have different donors, endpoints, platforms and organisers, so under 04 S4 they are
  separate benchmarks and not versions here. Whether the series deserves a family entry of its own, with
  this competition as its first round, is a question for a reviewer (review_checks).
lineage_source: src-openadmet-blind-challenges
lineage_quote: ASAP-Polaris-OpenADMET Antiviral Challenge An earlier OpenADMET-associated community
  blind challenge focused on pan-coronavirus drug discovery data

tags:
  - blind-challenge
  - polaris
  - mpro
  - coronavirus
  - lead-optimisation
  - admet
  - pose-prediction
  - potency-prediction

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S5-T06)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-jcim-2026-asap-antiviral-challenge
    - src-polaris-antiviral-potency-2025
    - src-polaris-antiviral-ligand-poses-2025
    - src-polaris-antiviral-admet-2025
    - src-github-asap-polaris-challenge-readme
    - src-github-asap-polaris-challenge-license
    - src-zenodo-15582067
    - src-openadmet-blind-challenges
    - src-openadmet-publications
    - src-crossref-chemrxiv-2025-64fcb
  sources_note: >
    The organisers' overview paper as its PubMed Central author manuscript (a DOI, not archived), read
    as
    text with 150-character windows and a forbid-list of the authors' surnames, which keeps the author
    block, the correspondence line, the acknowledgement names and the ORCIDs out of the extract; the three
    Polaris competition pages as served, which carry each track's sizes, split, metric, endpoints and
    timeline in their HTML and show no leaderboard rows, so no participant handle is quoted; the examples
    repository's README and LICENSE pinned to commit 56fcb82; Zenodo's API record of the unblinded data;
    OpenADMET's blind-challenge index and publication list; and Crossref's record of a participant team's
    preprint, for its abstract. GitHub's API was read for the repository's dates, licence metadata and
    tree, and Zenodo's versions endpoint for the concept record's two deposits; neither is kept as a
    Source. The umbrella Polaris competition page, which carries the three results tables, was fetched
    and
    then not used as a Source because its rows are participants' handles.
  confidence: medium
  review_checks:
    - check: The primary domain is the potency track's leaf, chosen because that track holds the
        most test items (297 of 618) and because the chemistry family's exclusion test sends a
        compound scored for how it binds a protein here. A reviewer who weighs the pose track's 195
        structures, or the paper's structure-first framing, might prefer protein-ligand-cofolding as
        primary.
      field: domain
      specialist: true
    - check: contamination_risk is high on the organisers' own statement that about 70 compounds
        leak from the ADMET training set into the potency test set. They argue the leak conveys
        little because the leaked subset cannot be identified in advance, and the rest of the design
        is blind, so a reviewer may read medium. The duplicate and stereochemistry fixes were made
        before the final leaderboards.
      field: data.contamination_risk
      source: src-jcim-2026-asap-antiviral-challenge
      quote: compounds leak between the ADMET training set and potency test set
    - check: ceiling_anchor_type is experimental-replicate from the potency discussion's
        assay-variability figures, which are literature estimates rather than replicates of these
        test compounds. The pose track has only the metric's bound and the ADMET endpoints have no
        stated anchor, and one field must stand for all three.
      field: data.ceiling_anchor_type
      specialist: true
    - check: scientific-surrogate-model was rejected for designed_for_subjects although the paper
        reads co-folding as a possible surrogate for crystallography and the endpoints are assay
        readouts. The rejection follows posebusters and runs-n-poses, which treat a stored
        measurement as a reference rather than a process emulated; a reviewer may disagree, and the
        choice changes nothing in the comparability profile.
      field: designed_for_subjects
      specialist: true
    - check: entrant-relative-ranking was rejected although the compact-letter display that the
        leaderboards publish beside each score comes from pairwise Tukey HSD tests over the entrant
        pool, so a letter moves when the pool changes. The headline figure itself does not.
      field: evaluation_method
    - check: Whether this competition should instead be curated as the first round of an OpenADMET
        blind-challenge family, with ExpansionRx, PXR and CYP as later editions. It is modelled as
        its own benchmark because the donors, endpoints, platforms and organisers differ; only
        OpenADMET's own index was read on this, not the later challenges' pages.
      field: lineage
      source: src-openadmet-blind-challenges
      quote: ASAP-Polaris-OpenADMET Antiviral Challenge An earlier OpenADMET-associated community
        blind challenge focused on pan-coronavirus drug discovery data
    - check: lifecycle active rests on the maintainers' own publication list (29 papers using
        OpenADMET datasets, 26 from outside) and one participant preprint's abstract. No independent
        paper's full text was read, because the one participant paper tried on PubMed Central
        answered with a captcha (unreachable).
      field: lifecycle
    - check: data.access fully-open describes the catalogued present; the blind condition that
        produced the published standings cannot be recreated, which access_by_phase records but
        reproducible_by_third_party cannot express.
      field: data.access
    - check: The item counts are the three competition pages' own train and test sizes. The paper's
        figures count measurements rather than molecules, and the 618-item total and the
        per-endpoint counts in size_note are the curator's arithmetic, not quoted.
      field: data.size
    - check: maintainer_type consortium for a challenge run by three partners (a consortium, a
        platform and a second consortium). The paper names all three and describes ASAP as an
        NIH-funded consortium and OpenADMET as an ARPA-H-funded one; no source states a legal form
        for the platform.
      field: governance.maintainer_type
    - check: The competing-interests statement discloses one author's commercial roles, including
        with the vendor of the docking software used for the organisers' own pose baseline. It is
        not quoted or flagged because it cannot be stated without naming an individual; a reviewer
        should decide whether a further independence flag belongs.
      field: governance.independence_flags
    - check: compute_tier is null. The challenge mandates no hardware, and the paper's remark that
        the scale discouraged free-energy methods is about entrants' choices.
      field: execution.compute_tier
  unreachable:
    - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13428298/
      http_status: 403
      consequence: A participant team's pose-prediction paper could not be read, because PubMed
        Central answered an automated fetch with a browser check. Evidence of third-party use rests
        on Crossref's record of another participant team's preprint and on OpenADMET's publication
        list.
  personal_data_excluded:
    - source: src-jcim-2026-asap-antiviral-challenge
      what: The author block and affiliations, the corresponding author's e-mail address, the
        acknowledgement names and the ORCIDs in them.
    - source: src-crossref-chemrxiv-2025-64fcb
      what: The record's author names, affiliations and ORCID identifiers.
    - source: src-openadmet-publications
      what: The citation lines' author surnames.
    - source: src-zenodo-15582067
      what: The creators' names, affiliations and ORCID identifiers.

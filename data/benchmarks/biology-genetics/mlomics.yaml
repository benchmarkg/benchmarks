    The Scientific Data paper read through Europe PMC's REST full text (nature.com disallows AI agents),
    with narrow windows that keep the author list, ORCIDs and the corresponding author's address out;
    the arXiv abstract page (v3) for the dates, with the submitter line kept out, and the v1 PDF for the
    CMOB release; the README and the classical runner pinned at commit fdb9da0 (pending archive); the
    Hugging Face and figshare API records of the data; the GDC access page (pending archive); and CMGL's
    Europe PMC full text as evidence of current use. GitHub's API was read for the repository's dates,
    licence and files, and Hugging Face's commit history for the upload dates, and neither is kept as
    a Source. The project page (chenzrg.github.io) and the Hugging Face dataset card page were not read.
  confidence: medium
  review_checks:
    - check: Primary leaf. transcriptomics is defined on bulk gene expression, and two of MLOmics'
        four omics are bulk expression; methylation and copy number are not, and every baseline
        integrates all four. No leaf names bulk multi-omics integration.
        medicine-health/diagnosis-triage was rejected because the labels are TCGA cancer types and
        molecular subtypes rather than a clinical endpoint, but the paper frames classification as
        diagnostic and the clustering is partly scored on survival.
      field: domain
      source: src-mlomics-scidata-2025
      quote: These two classification tasks potentially improve cancer early diagnostic accuracy and
        treatment outcomes.
    - check: Benchmark status. The journal paper calls MLOmics a database (a Data Descriptor), and
        no train/test split is fixed in the released data. The classical runner draws its own
        stratified 80/20 split with seed 42, and CMGL uses five-fold 70/10/20 cross-validation, so
        scores from different papers are not computed on the same test data.
      field: task
      source: src-github-mlomics-run-classifiers
      quote: X, y_enc, test_size=args.test_size, random_state=42, stratify=y_enc)
    - check: The metric set differs between documents. The paper names precision, recall and F1
        (with NMI and ARI) for classification and MSE for imputation; the README's classification
        table ranks the clustering methods (SNF to MCluster-VAEs) by PREC, NMI and ARI and gives MAE
        and RMSE for imputation; the classical runner reports accuracy and macro-F1. Which is
        canonical is not stated.
      field: evaluation_method
      source: src-github-mlomics-run-classifiers
      quote: f1 = f1_score(y_te, y_pred, average='macro')
    - check: versions models three revisions. v1's Table 1 gives the Top scale 2,000 features per
        omics and different Original feature counts from the README's current table (5,000 at Top),
        but the Scientific Data XML holds no tables, so when the change came (v2/v3 in 2025, or the
        July 2026 refresh) was not established. The Hugging Face files were re-uploaded on
        2026-07-21 and 2026-09-22, the second with no announcement, which is why data.refresh is
        null.
      field: versions
      source: src-arxiv-2409-02143-v1
      quote: Top Features 2K+ genes, etc.
    - check: data.access is fully-open on the strength of MLOmics' own ungated, CC BY 4.0 files. The
        paper does not say which GDC access tier each input came from. The GDC page puts high-level,
        non-identifiable genomic data and most clinical elements in the open tier, but the tier of
        each input file (the copy-number calls especially) and of the clinical annotation file was
        not checked file by file.
      field: data.access
      source: src-gdc-data-access-processes
      quote: Open access data generally includes high level genomic data that is not individually
        identifiable
    - check: maintainer_type individual rests on the personal-account repository (chenzRG). The data
        sit in a Hugging Face organisation (AIBIC) whose holder is not stated in any source read; if
        it is a university lab's, academic-lab fits better.
      field: governance.maintainer_type
    - check: The clustering tasks (9 of 20 datasets) are scored by the silhouette and a survival
        log-rank p-value, which no evaluation-method term covers (failure 2026-11-05-mlomics-001);
        the list carries only the classification and imputation methods.
      field: evaluation_method
      source: src-mlomics-scidata-2025
      quote: To evaluate the goodness of clustering we opt for the classic Silhouette coefficient
        (SIL)
    - check: code_licence CC-BY-4.0 is the paper's statement; the repository has no LICENSE file and
        GitHub reports none, and CC BY is not a software licence. The bundled third-party baselines
        carry their own licences.
      field: execution.code_licence
    - check: Current use rests on one 2026 paper, CMGL, which uses its own partitions and metrics.
        Europe PMC lists about 20 works citing MLOmics in 2025-2026; the others (CMIGAT,
        CancerSubtypeXplore, a multi-omic imputation preprint and reviews) were not read.
      field: lifecycle
      source: src-cmgl-bioinformatics-2026
      quote: We build our experiments upon the MLOmics multi-omics cancer database (Yang et al.
        2025)
    - check: designed_for_subjects puts the general learners (XGBoost, SVM, random forest, logistic
        regression) under domain-specialist-model with the multi-omics models, because the tasks
        belong to cancer genomics; clustering algorithms such as SNF and NEMO, which fit no network,
        may be closer to classical-algorithm.
      field: designed_for_subjects
  personal_data_excluded:
    - source: src-mlomics-scidata-2025
      what: The author list with ORCIDs, the corresponding author's e-mail address and the
        author-contribution names; the 60-character windows stop short of them.
    - source: src-arxiv-2409-02143
      what: The arXiv submitter line in the submission history.
    - source: src-arxiv-2409-02143-v1
      what: The title block's author names and e-mail addresses.
    - source: src-github-mlomics-readme
      what: The Contact section's e-mail address.
    - source: src-figshare-28729127
      what: The record's author list.
    - source: src-cmgl-bioinformatics-2026
      what: The author list and ORCIDs.

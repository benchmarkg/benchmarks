    - src-europepmc-pmc13069479
  sources_note: >
    The paper as its PubMed Central author manuscript (a DOI, not archived), read as Europe PMC's full-text
    XML with windows that keep the corresponding author's address out; the publisher's page was not fetched
    (nature.com disallows AI agents). Europe PMC's record of the bioRxiv preprint for its date and abstract.
    The README at master, GitHub's release record and the documentation's landing page. The Zenodo records
    of data versions 3 and 4 (DOIs), with windows that keep the creators' ORCIDs out. DAZZLE's and GRNFormer's
    full texts from Europe PMC as evidence of current use. GitHub's API was read for the repository's
    dates and Zenodo's for versions 1 and 2, and neither is kept as a Source.
  confidence: medium
  review_checks:
    - check: Domain. systems-biology is primary as the leaf whose definition covers a network
        modelled as a whole, but the leaf has no inclusion test and speaks of a network's behaviour,
        while BEELINE scores recovery of its structure. single-cell-analysis is the alternative
        primary (all inputs are single-cell expression, and Open Problems keeps a GRN task in its
        repositories); it is secondary because its inclusion test asks for cell-level results.
        regulatory-genomics needs sequence input. This is the leaf's first entry.
      field: domain.primary
    - check: causal-reasoning rests on the reference being regulation rather than co-expression and
        on the paper treating indirect edges as errors. Against it, the STRING networks count
        functional interactions as true, two of the 12 algorithms output undirected edges, and
        correlation methods score well, so the scoring may not separate cause from correlation as
        the term asks.
      field: capability
      specialist: true
      source: src-beeline-nature-methods-2020
      quote: An interaction here is functional and need not correspond to transcriptional
        regulation.
    - check: reliability-consistency is tagged for the ten-run Spearman stability, which the paper
        reports in its summary figure but which is not an accuracy score; drop it if the term should
        require the agreement to be the headline.
      field: capability
    - check: ground_truth_source is simulation, the reference for over 400 of the datasets. The five
        experimental datasets are scored against ChIP-seq networks and databases, which would be
        experimental or held-out labels; the field takes one value.
      field: ground_truth_source
    - check: The paper tuned each algorithm's parameters for the best median AUPRC on the datasets
        it then reported, so its numbers are tuned on the test data; later users' tuning is unknown.
      field: data.contamination_risk
      source: src-beeline-nature-methods-2020
      quote: Six algorithms required one or more parameters to be specified. We performed a
        parameter sweep to determine the values which gave the highest median AUPRC
    - check: Users' protocols diverge from the paper's. The 2025 paper in as_used scores all genes
        of copies obtained from another method's authors, not the paper's gene sets, and counts
        seven datasets where the paper counts five datasets of seven cell types; no condition field
        records the gene set.
      field: as_used
      source: src-europepmc-pmc12574904
      quote: on the BEELINE single cell benchmark, which includes seven datasets (two from human and
        five from mouse) and three sets of ground truth networks
    - check: Supervised GRN methods train on part of BEELINE's ground-truth edges or on other cell
        types and score against sampled negatives, none of which the paper defined; numbers from
        these protocols and from the paper's unsupervised one are not comparable, and no condition
        field records the split.
      field: as_used
      source: src-europepmc-pmc13069479
      quote: In contrast competing deep-learning methods were trained and evaluated on
        within-dataset splits of each test cell type
    - check: v1.0 and v1.1 are revisions over the same datasets. v1.1 is not marked breaking, since
        the incompatibility its notes declare is of configuration files and directory layout, but
        its evaluation code was rewritten and its roster changed, and whether it reproduces v1.0's
        numbers was not checked.
      field: versions
      source: src-github-beeline-releases
      quote: Config files from v1.0 are not immediately compatible with v1.1.
    - check: The preprint (May 2019) evaluated synthetic and Boolean data only, and the journal
        version added the experimental datasets; the data's Zenodo versions 1 (2019-08-27) and 2
        (2019-10-01) predate the first code release and are not modelled as versions.
      field: versions
      source: src-biorxiv-642926
      quote: We use synthetic networks with predictable cellular trajectories as well as curated
        Boolean models to serve as the ground truth for evaluating the accuracy of GRN inference
        algorithms.
    - check: aggregation_policy is none-by-design although the paper does not say so in words; its
        summary figure orders the algorithms by median early precision ratio on the experimental
        datasets, which could be read as an official ranking.
      field: aggregation_policy
    - check: The pair (classification-metric, domain-specialist-model or classical-algorithm) has no
        comparability profile and resolves to fallback; training_data_policy and harness are added
        through material_extra.
      field: comparability
    - check: no-known-conflict rests on the paper's competing-interests statement and on none of the
        12 algorithms being the authors'; the provenance of the algorithms added in v1.1 was not
        checked.
      field: governance.independence_flags

# data/benchmarks/biology-genetics/rna-puzzles.yaml
#
# P1-S5-T05, biology-genetics entry 12. Filled from the organisers' assessment papers: Round I (RNA 18:610-625,
# 2012, read as Europe PMC's core metadata record with its abstract, because the full text is not in the open
# subset), Rounds II, III and IV (RNA 2015, 2017, 2020) and Round V (Nature Methods 22:399-411, 2025) as Europe PMC
# full-text XML, and the RNA-Puzzles assessment of the CASP16 RNA-only targets (Proteins, 2025) as Europe PMC
# full-text XML; the CASP15 joint RNA assessment (Proteins, 2023) as Europe PMC's core record with its abstract;
# rnapuzzles.org (the home page, the results page, the puzzles list and four news posts, scripts and styles
# stripped); the README and LICENSE of the RNA_assessment repository at a pinned commit; and, as evidence of
# current use, a 2026 RNA Biology benchmark study. The CASP16 overview (src-casp16-overview, cited by casp) is
# cited once, for how CASP describes RNA-Puzzles. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# Identity (04 S4). RNA-Puzzles is its own family, not a CASP subset: it has its own organisers (the Westhof and
# Miao groups), has posed puzzles continuously since 2011, eleven years before CASP15 first held RNA targets, keeps
# its sequences confidential where CASP's are public, and publishes its own assessment papers. Its rounds are
# editions in versions[]. The CASP15 and CASP16 RNA categories were CASP's targets, assessed by the RNA-Puzzles
# organisers with their protocols in parallel with CASP's own assessors; they are recorded here as two joint
# editions and also belong to casp (review_checks). The corpus record
# casp16-na-rna-puzzles-joint-assessment classifies that CASP16 edition and was read as a guide only.

id: rna-puzzles
name: RNA-Puzzles
tagline: Blind 3D structure prediction of unpublished RNAs shared in confidence, assessed by the
  organisers in rounds since 2011.
description: >
  A community-wide blind experiment in RNA three-dimensional structure prediction, started in 2011 by
  Eric Westhof's group in Strasbourg and now run with Zhichao Miao's group at the Guangzhou Laboratory.
  A structural biologist who has solved an RNA structure and is about to publish it sends the sequence
  to the organisers, who pass it in confidence to registered modelling groups. Human-led groups have three
  to four weeks to return up to five models per method, and automated web servers 48 hours. Once the structure
  is released, the organisers compare every model with it automatically (RMSD, the Interaction Network
  Fidelity of Watson-Crick, non-Watson-Crick and stacking interactions, the Deformation Index, lDDT, TM-score
  and MolProbity clash score), and the results of a set of puzzles are published as a round paper co-authored
  by the modellers and the structure providers. Five rounds have been published, covering puzzles 1 to
  39 (2012-2025). In CASP15 (2022) and CASP16 (2024) the organisers also assessed CASP's RNA targets with
  the same protocols, beside CASP's own assessors. Puzzles 40 onward (from 2023) await a sixth round.
  Known weaknesses the sources name: non-Watson-Crick interactions and coaxial stacking are poorly predicted,
  the web-server category is too small to compare, and fast cryo-EM makes the confidentiality that keeps
  the puzzles blind harder to rely on.
self_description:
  source: src-rnapuzzles-site
  quote: The sequence of a solved RNA structure is confidentially communicated to participating
    modelling groups a couple of weeks prior to publication.
paper:
  title: 'RNA-Puzzles Round V: blind predictions of 23 RNA structures'
  doi: 10.1038/s41592-024-02543-9
  source: src-rnapuzzles-round5-nat-methods-2024
paper_note: The most recent round paper, read as Europe PMC's full text (CC BY-NC-ND 4.0). The
  founding paper is Cruz et al. 2012, the Round I report, which calls RNA-Puzzles a CASP-like
  evaluation (RNA, 10.1261/rna.031054.111; src-rnapuzzles-round1-rna-2012).
released: null
released_note: No source gives the date the first puzzle went out. Round IV dates the start to 2011,
  and the Round I paper was published on 2012-02-23 (Europe PMC).
released_source: src-rnapuzzles-round4-rna-2020
released_quote: The RNA-Puzzles competition was initiated in 2011 following discussions and
  exchanges at the annual meetings of the RNA Society.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/nucleic-acid-structure
  secondary: []
  secondary_note: Some puzzles are RNA-protein or RNA-ligand complexes (Round III's SAM-I aptamer
    with YbxF, the T-box-tRNA puzzles, ligand-bound riboswitches), and Round IV discusses ligand
    binding modes. No leaf covers an RNA-ligand or RNA-protein interface (protein-ligand-cofolding's
    exclusion sends a nucleic-acid partner to nucleic-acid-structure), so the secondary list is
    empty, as the corpus record for the CASP16 joint assessment also left it.
domain_basis:
  reason: Every puzzle gives an RNA sequence and scores the predicted 3D structure against the
    experimental structure, which is the leaf's definition.
  source: src-rnapuzzles-site
  quote: To determine the capabilities and limitations of current computational methods of 3D RNA
    structure prediction based on sequence
domain_considered_and_rejected:
  - term: biology-genetics/protein-structure-prediction
    reason: The scored molecule is RNA; where a puzzle includes a protein (Round III's YbxF), the
      assessment is of the RNA.
  - term: biology-genetics/protein-ligand-cofolding
    reason: The leaf's exclusion sends a nucleic-acid partner to nucleic-acid-structure, and ligand
      poses are discussed rather than scored as a category.
    source: src-rnapuzzles-round4-rna-2020
    quote: simultaneous prediction of RNA structure with accurate ligand binding still remains out
      of reach
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: Groups predict an RNA's 3D structure from its sequence, and the organisers compare the
      models with the experimental structure once it is released.
    source: src-rnapuzzles-round5-nat-methods-2024
    quote: The organizers (E.W. or Z.M.) are contacted by a structural biologist who has solved and
      is about to publish an RNA-containing structure.
capability_considered_and_rejected:
  - term: generation-fidelity
    reason: The term's exclusion sends a predicted structure scored against measurement to
      scientific-prediction.
  - term: spatial-reasoning
    reason: The term's exclusion covers a score that measures reconstruction accuracy rather than a
      spatial inference, which RMSD, INF and TM-score are.
  - term: distribution-shift-generalization
    reason: Puzzles are whatever structures their providers offer, not inputs drawn deliberately
      from outside a training distribution. The CASP16 assessment reports targets without a clear
      template separately, and Round II chose puzzles with little homology, but neither is a
      designed condition across rounds.
    source: src-rnapuzzles-round2-rna-2015
    quote: Three puzzles, Puzzles 5, 6, and 10, represented sequences of three large RNA structures
      with limited or no homology with previously solved RNA molecules.
  - term: calibration-uncertainty
    reason: No round scores a confidence emitted with the models.

evaluation_method:
  - domain-metric
  - expert-panel-assessment
  - entrant-relative-ranking
evaluation_method_note: expert-panel-assessment rests on the round papers being the authoritative
  output, written by the organisers with the modellers and structure providers; the results page
  also posts per-puzzle assessment tables. entrant-relative-ranking rests on the Round V and CASP16
  group rankings, which give a group 5 to 1 points per puzzle for the five best models and sum them
  ("5 means that the group obtained the best r.m.s.d.", src-rnapuzzles-round5-nat-methods-2024), so
  adding a group moves the others' totals.
evaluation_method_basis:
  reason: The models are compared with the experimental structure by RMSD, the Interaction Network
    Fidelity of base pairs and stacking (computed from MC-Annotate annotations), the Deformation
    Index, lDDT, TM-score, GDT in CASP16, and the MolProbity clash score.
  source: src-rnapuzzles-casp16-proteins-2025
  quote: In RNA‐Puzzles the assessments of accuracy are based on the Interaction network Fidelity
    (INF)
evaluation_method_considered_and_rejected:
  - term: prospective-resolution
    reason: The structures are solved before the puzzle goes out and are only unpublished; nothing
      resolves after submission.
  - term: composite
    reason: The rankings sum rank points over puzzles for one metric at a time (RMSD in Round V); no
      weighted combination of the metrics is published.
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
  - human-ai-team
designed_for_subjects_basis:
  reason: Entrants are RNA structure prediction methods, mostly fragment-assembly, coarse-grained
    simulation and template-based programs (classical-algorithm), with one deep-learning method in
    Round V (domain-specialist-model). The human category admits groups that use any tool and steer
    it by hand, and its predictions are analysed separately from the automated web servers'
    (human-ai-team).
  source: src-rnapuzzles-round5-nat-methods-2024
  quote: Each modeling group is entitled to use any technique or tool available to get insight on
    the RNA fold in human-based modeling.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: No entrant is a human working unaided; the human category uses computational tools.
  - term: hosted-inference-endpoint
    reason: The web-server category is defined by the absence of human intervention and a 48-hour
      deadline, not by evaluating the endpoint as served; the CASP16 assessment found too few server
      predictions to compare.
    source: src-rnapuzzles-casp16-proteins-2025
    quote: However, the number of web‐server predictions is still too low for meaningful comparisons
      between methods

as_used:
  - protocol: Retrospective test set of 18 RNAs from past RNA-Puzzles, beside CASP15 and CASP16 RNA
      targets and a custom set of 30 RNAs, to compare RNA 3D structure prediction methods given
      native or predicted secondary structures.
    source: src-rnabiol-2026-rna-2d-3d-crosstalk
    quote: The RNA Puzzles dataset contains 18 RNAs collected from the real challenging RNA-Puzzles
    note: RNA Biology, April 2026. The reference structures of past puzzles are public, so a
      retrospective run is not blind (data.contamination_risk_note).

lifecycle: active
lifecycle_basis:
  reason: Puzzles 40 to 62 went out from April 2023 to April 2025, the CASP16 assessment appeared in
    October 2025, and puzzles 74 to 79 were taking submissions in April 2026.
  source: src-rnapuzzles-pz74-pz79-update
  quote: We have updated PZ74–PZ79 to support standard DNA residue names in submitted structure
    files.
activity: accepting-submissions
activity_note: Puzzles are posed whenever a structure provider offers one, and rounds are groupings
  published afterwards, so intake is continuous. The latest dated evidence of an open puzzle is the
  2026-04-02 post; the open-puzzle portal lists current puzzles only after login, so whether one is
  open on 2026-11-04 was not seen (review_checks).
activity_basis:
  reason: The post on puzzles 74 to 79 speaks of submissions under way.
  source: src-rnapuzzles-pz74-pz79-update
  quote: To avoid disrupting ongoing submissions

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Dfold (Kollmann group, Heinrich Heine University Düsseldorf), the one deep-learning
      method among Round V's 18 approaches
    source: src-rnapuzzles-round5-nat-methods-2024
    observed_on: 2026-11-04
    quote: is a deep-learning approach to predict 3D folding structures of RNAs from their nucleic
      acid sequence
  - system: The AlphaFold 3 server (CASP16 group TS304), ranked among the RNA-only targets
    source: src-rnapuzzles-casp16-proteins-2025
    observed_on: 2026-11-04
    quote: TS_304 is the AF3 [57] server and has a ranking score of 19.
    note: A CASP16 entrant assessed by the RNA-Puzzles organisers. The assessors also ran AlphaFold
      3 themselves as a baseline, which is not an entrant.
evaluation_target: learned-system
evaluation_target_note: Most entrants are not learned (Round V has one deep-learning approach of
  18), but at least one is, which is the admissibility test.
execution_mode: automated
execution_mode_note: Groups run their methods and e-mail or upload models; the organisers score them
  automatically against the released structure and then write the round paper with the groups.
ground_truth_source: experimental
ground_truth_source_note: X-ray, cryo-EM and NMR structures contributed by structural biology groups
  before publication; most CASP16 RNA targets were cryo-EM.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The predictions and the assessment code are public, and the reference structures are in
    the PDB, so any published score can be recomputed and a new method can be scored on past
    puzzles. The blind condition of a puzzle cannot be recreated once its structure is out.
  source: src-rnapuzzles-round5-nat-methods-2024
  quote: All the prediction results and codes used are publicly available at www.rnapuzzles.org.

task:
  exists: true
  input:
    - an RNA sequence (sometimes several chains, a stated stoichiometry or ligand), sent in
      confidence before the structure is published, occasionally with additional data
  output: Up to five 3D models per prediction method in standard PDB format, all models in one file
    in NMR style; a group may submit several methods.
  scoring: Each model is compared with the experimental structure by RMSD, INF (all, Watson-Crick,
    non-Watson-Crick, stacking), Deformation Index, lDDT, TM-score and clash score; groups are
    ranked per puzzle by the best of their models and the ranks summed over a round.
  tests_hidden_from_system: true
  blinding:
    source: src-rnapuzzles-round5-nat-methods-2024
    quote: The process is thus double blind
  source: src-rnapuzzles-site
  quote: Up to FIVE prediction models should be submitted as the final results for each puzzle from
    each prediction method.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Judged after a puzzle closes, as the term's test asks for a blind round. During a
    puzzle the sequence goes only to registered groups who agree to keep it confidential; afterwards
    the reference structure is in the PDB and the predictions and assessments are posted on the site
    and in the RNA-Puzzles GitHub organisation.
  access_basis:
    reason: After each puzzle the raw predictions and assessment results are linked from the results
      page, and Round V says all prediction results are public.
    source: src-rnapuzzles-results
    quote: 'Puzzle Submission/Deadline: 2023.01.18/02.08 raw prediction | Assessment results'
  access_by_phase:
    during_edition: The sequence goes in confidence to registered groups who accept the
      confidentiality agreement; the structure is unpublished.
    during_edition_source: src-rnapuzzles-site
    during_edition_quote: I will use the provided sequence data for prediction purposes only.
    after_edition: Reference structure in the PDB; predictions, assessment tables and code public.
    after_edition_source: src-rnapuzzles-round5-nat-methods-2024
    after_edition_quote: All the prediction results and codes used are publicly available at
      www.rnapuzzles.org.
  refresh: periodic-recompetition
  refresh_note: Each round is ranked on puzzles new to it, but rounds are not dated competitions;
    the puzzles go out as structures arrive and are grouped into rounds afterwards by function and
    timing, and rounds overlap in time (Round V includes puzzles 11, 16 and 18 from 2014-2016).
    rolling-live was considered, but there is no live leaderboard. resolves-over-time is excluded
    because the structures exist when the puzzles are posed.
  refresh_basis:
    reason: Every round reports a set of new, then-unpublished structures.
    source: src-rnapuzzles-round4-rna-2020
    quote: The puzzles are grouped into rounds based on the similarity of function and approximate
      cooccurrence in prediction time.
  data_provenance:
    - experimental-measurement
  data_provenance_note: Crystal, cryo-EM and NMR structures solved by the contributing structural
    biology groups and published by them after the puzzle closes.
  data_provenance_source: src-rnapuzzles-round5-nat-methods-2024
  data_provenance_quote: The organizers (E.W. or Z.M.) are contacted by a structural biologist who
    has solved and is about to publish an RNA-containing structure.
  contamination_risk: low
  contamination_risk_note: Low for a live puzzle, whose structure is unpublished and whose sequence
    the groups agree not to share; unlike CASP, RNA-Puzzles keeps its targets confidential. The
    CASP16 assessment names two weakening routes, a team solving the same structure independently by
    fast cryo-EM, and AI tools trained on every structure, and the CASP15 and CASP16 targets were
    public as CASP's are. Past puzzles are in the PDB and so in training data, which matters for
    retrospective reuse such as the 2026 test set in as_used, not for the scored rounds.
  contamination_evidence:
    - source: src-rnapuzzles-round4-rna-2020
      stance: against
      quote: While CASP releases protein sequences publicly, the RNA Puzzles experiment follows
        strict rules of confidentiality.
    - source: src-rnapuzzles-round4-rna-2020
      stance: against
      quote: the procedure minimizes bias in the prediction algorithms
    - source: src-rnapuzzles-casp16-proteins-2025
      stance: supports
      quote: Thus, a team could either have already solved a structure, or be trying to solve it
        independently, which would make a posteriori comparisons biased.
    - source: src-rnapuzzles-casp16-proteins-2025
      stance: supports
      quote: In addition, AI‐based tools incorporate every structure it has been presented to, and
        one cannot erase that memory
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No RNA-Puzzles source read gives a ceiling. The CASP16 nucleic-acid
    assessment by CASP's assessors proposes one from independently solved structure pairs (the
    corpus record's experimental-replicate), but that is CASP's paper, not the organisers'.
  dataset_licence: null
  dataset_licence_note: No licence is stated for the predictions or the assessment tables on the
    site, and the standardized_dataset repository carries none (GitHub metadata, read 2026-11-04,
    not kept as a Source). The reference structures are PDB entries.
  size:
    - count: 23
      unit: puzzles
      subset: Round V (2024-2025)
      source: src-rnapuzzles-round5-nat-methods-2024
      quote: 'We report a large-scale set of predictions by 18 groups for 23 RNA-Puzzles: 4 RNA elements,
        2 Aptamers, 4 Viral elements, 5 Ribozymes and 8 Riboswitches.'
    - count: 34
      unit: RNA-only targets (monomers)
      subset: CASP16 joint assessment (2024)
      source: src-rnapuzzles-casp16-proteins-2025
      quote: For 10 of the 34 Targets, models were beyond 10 Å
    - count: 12
      unit: RNA-containing targets
      subset: CASP15 joint assessment (2022)
      source: src-casp15-rna-proteins-2023
      quote: Forty-two predictor groups submitted models for at least one of twelve RNA-containing
        targets.
    - count: 6
      unit: puzzles
      subset: Round IV (puzzles 9, 15, 17, 19, 20, 21)
      source: src-rnapuzzles-round4-rna-2020
      quote: 'We now report the prediction of 3D structures for six RNA sequences: four nucleolytic ribozymes
        and two riboswitches.'
    - count: 6
      unit: puzzles
      subset: Round III (puzzles 4, 7, 8, 12, 13, 14)
      source: src-rnapuzzles-round3-rna-2017
      quote: Five puzzles, 4, 8, 12, 13, 14, all structures of riboswitch aptamers and puzzle 7, a
        ribozyme structure, are included in this round of the experiment.
    - count: 3
      unit: puzzles
      subset: Round II (puzzles 5, 6, 10)
      source: src-rnapuzzles-round2-rna-2015
      quote: Three puzzles, Puzzles 5, 6, and 10, represented sequences of three large RNA
        structures with limited or no homology with previously solved RNA molecules.
    - count: 3
      unit: puzzles
      subset: Round I (puzzles 1, 2, 3)
      source: src-rnapuzzles-round1-rna-2012
      quote: We report the results of a first, collective, blind experiment in RNA three-dimensional
        (3D) structure prediction, encompassing three prediction puzzles.
  size_note: Round V's text discusses puzzles 11, 16, 18 and 22 to 39, which is 21 numbers for its
    23 Puzzles; the count is the paper's. Puzzles 40 to 62 (April 2023 to April 2025) are on the
    puzzles list without a round paper, and the site names puzzles up to 79 (2026). Round IV's title
    says four ribozymes and two aptamers, its abstract four ribozymes and two riboswitches.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The RNA-Puzzles organisers, Eric Westhof (Architecture et Réactivité de l'ARN,
    Université de Strasbourg, IBMC-CNRS) and Zhichao Miao (Guangzhou Laboratory)
  maintainer_basis:
    reason: Round V names the two organisers by their initials, and both are its corresponding
      authors; the site is run from Miao's group at the Guangzhou Laboratory, and its code sits in
      the RNA-Puzzles GitHub organisation.
    source: src-rnapuzzles-site
    quote: We are part of the Guangzhou Laboratory and RNApuzzles.
  maintainer_type: academic-lab
  maintainer_type_note: The project started in Westhof's university group in Strasbourg and is now
    hosted by Miao's group at the Guangzhou Laboratory, a research institute rather than a
    university; the code is copyrighted to "RNA-Puzzles" in a shared GitHub organisation with
    contributors from several institutions. government-agency (the site's contact address names it
    Guangzhou National Laboratory, but no source states it is a public body) and
    community-collective were considered (review_checks).
  submission_process:
    - held-out-server
    - assessment-committee
  submission_process_note: Groups submit models by e-mail or through the registration and submission
    portal, which checks the file format, before the structure is published; the organisers score
    them after release and the round paper is the authoritative output. Per-puzzle assessment tables
    on the results page sit beside the papers, which assessment-committee's "no leaderboard" does
    not foresee, as for CASP.
  submission_process_source: src-rnapuzzles-site
  submission_process_quote: For submission, please either use the online registration and submission
    portal
  independence_flags: []
  independence_flags_note: >
    Deliberately empty, not no-known-conflict, because the search found two things a reviewer should rule
    on and no term that fits them. The organisers' own groups are not among Round V's predictors, and
    Round V declares no competing interests. But structure providers also predict: the second-ranked team
    on the CASP16 RNA-only targets is a structural biology team that often provides RNA-Puzzles structures.
    And the Das group, an RNA-Puzzles predictor and one of Round V's two strongest human groups, assessed
    the CASP15 RNA targets beside the RNA-Puzzles organisers and took no part as predictors there. Funding
    is from the Guangzhou Laboratory, China's MOST and the NSFC, none of which enters a system. The missing
    provider flag is logged as taxonomy/_failures/2026-11-04-rna-puzzles-001.
  independence_assessed: true
  funding:
    source: src-rnapuzzles-site
    quote: 'Funding: - R&D Programs of Guangzhou Laboratory - MOST IT+BT projects - NSFC'
  participation:
    source: src-rnapuzzles-site
    quote: more predictors who are interested in RNA structure prediction to take part in this
      compitition
  independence_policy:
    source: src-rnapuzzles-round5-nat-methods-2024
    quote: The authors declare no competing interests.
  known_limitation:
    source: src-rnapuzzles-round2-rna-2015
    quote: the prediction accuracy for non-Watson–Crick interactions, key to proper folding of RNAs,
      is low

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: No source states what a participant's run costs; methods range from web servers
    to human-steered simulations. Re-scoring published models is CPU work.
  reproducibility_tier: null
  reproducibility_tier_note: Two questions with two answers, as for CASP. Re-scoring published or
    new models on a past puzzle is automatable from the public structures and RNA_assessment, with
    MC-Annotate, OpenStructure and MolProbity installed beside it. Repeating the benchmark itself, a
    blind prediction of an unpublished structure, is possible only while a puzzle is open. No tier
    term separates the two.
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: What cannot be reproduced is the blindness; once a structure is
    published, a new prediction of it is no longer blind.
  harness_availability: official-harness
  harness: RNA_assessment (RNA-Puzzles GitHub organisation, commit d46f047 of 2024-12-03), with the
    RoundV_reproducibility repository for Round V's figures
  harness_note: Round V says the repository holds all the metrics used in the assessments. It calls
    external programs (MC-Annotate for INF, OpenStructure for lDDT, MolProbity for clash scores) and
    has no versioned release, so official-harness is a near call against
    reference-implementation-only (review_checks).
  harness_source: src-rnapuzzles-round5-nat-methods-2024
  harness_quote: All metrics used in RNA-Puzzles for the assessments and comparisons of RNA 3D
    structures are available at https://github.com/RNA-Puzzles/RNA_assessment.
  submission_channel:
    source: src-rnapuzzles-site
    quote: 'Web servers: Must submit predictions within 48 hours Human experts: Have 3 weeks for submission'
  code_licence: MIT
  code_licence_note: The licence of RNA_assessment at the pinned commit.
  code_licence_source: src-github-rna-assessment-licence
  code_licence_quote: MIT License Copyright (c) 2024 RNA-Puzzles
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which round or puzzles a figure covers (subset_used), and whether the
  # human or the web-server category produced it (human_in_loop), since the two have different deadlines
  # and are ranked separately.
  material_extra:
    - subset_used
    - human_in_loop

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: Round V and the CASP16 assessment rank groups by summing rank points over the round's
    puzzles, separately for human and server predictions; Round III declined to rank at all, and the
    papers discuss every metric rather than one score.
  source: src-rnapuzzles-casp16-proteins-2025
  quote: The final score is the total sum normalized by the ratio of valid submissions divided by
    the total number of Targets (34).
headline_metric: null

homepage: https://www.rnapuzzles.org/
repository: https://github.com/RNA-Puzzles/RNA_assessment
leaderboard_url: https://www.rnapuzzles.org/results/

versions:
  - version: round-i
    label: Round I (puzzles 1-3; RNA, 2012)
    version_kind: edition
    changes: The first round, three puzzles (an RNA dimer, a self-assembling RNA square and a
      glycine riboswitch domain), and the first automated evaluation pipeline.
    breaking: true
    superseded_by: round-ii
    frozen: true
    sources:
      - src-rnapuzzles-round1-rna-2012
      - src-rnapuzzles-results
  - version: round-ii
    label: Round II (puzzles 5, 6, 10; RNA, 2015)
    version_kind: edition
    changes: Three large RNAs with little or no homology (a lariat-capping ribozyme, an
      adenosylcobalamin riboswitch and a T-box-tRNA complex), predicted by seven groups, some using
      chemical-mapping data.
    breaking: true
    supersedes_version: round-i
    superseded_by: round-iii
    frozen: true
    sources:
      - src-rnapuzzles-round2-rna-2015
  - version: round-iii
    label: Round III (puzzles 4, 7, 8, 12, 13, 14; RNA, 2017)
    version_kind: edition
    changes: Five riboswitch aptamers and the Varkud satellite ribozyme. The paper compares models
      with a set of metrics and declines to rank methods.
    breaking: true
    supersedes_version: round-ii
    superseded_by: round-iv

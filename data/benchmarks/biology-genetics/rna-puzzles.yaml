lineage:
  role: root
lineage_note: >
  RNA-Puzzles is not a variant or fork of CASP (casp). It began in 2011, modelled on CASP but with its
  own organisers, and keeps its sequences confidential where CASP's are public; CASP's own overview
  describes it as a separate series. CASP15 was the first CASP to hold RNA targets, and in CASP15 and
  CASP16 the RNA-Puzzles organisers assessed CASP's RNA targets with their protocols, so those two
  joint rounds are editions of both families (versions casp15-joint and casp16-joint here; casp.yaml's
  nucleic-acid category). No lineage relation expresses a shared edition, so none is set.
lineage_source: src-casp16-overview
lineage_quote: and RNA‐Puzzles [ 22 ] has run a series of structure challenges in this area.


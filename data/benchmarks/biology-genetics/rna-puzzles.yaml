    - src-rnapuzzles-future-outlook
    - src-rnapuzzles-participating-teams
    - src-rnapuzzles-pz74-pz79-update
    - src-github-rna-assessment-readme
    - src-github-rna-assessment-licence
    - src-rnabiol-2026-rna-2d-3d-crosstalk
    - src-casp16-overview
  sources_note: >
    The Round II-V papers, the CASP16 RNA-Puzzles assessment and the 2026 RNA Biology study as Europe
    PMC full-text XML; Round I and the CASP15 RNA assessment as Europe PMC core records with their abstracts
    (neither full text is in Europe PMC's open subset). The papers are DOI sources, not archived; the
    site and GitHub pages are left pending for the archiver. rnapuzzles.org is a Jekyll site on GitHub
    Pages; its pages were read as HTML with scripts and styles stripped, with narrow windows that keep
    the organisers' e-mail addresses out. The open-puzzle page embeds a login-gated portal (openpuzzle.bio-it.tech),
    which was not read past its login. The publications page and three other news posts were read and
    not cited. NuFold (Nature Communications, 2025), which re-predicts past puzzles, was read and not
    cited.
  confidence: medium
  review_checks:
    - check: Identity. RNA-Puzzles is entered as its own family by the 04 S4 rule (different
        maintainer, independently cited and run since 2011), with its rounds as editions. The CASP15
        and CASP16 RNA categories are recorded here as joint editions and also sit in casp's
        nucleic-acid category, so a result from them could be claimed under either family. Whether
        they belong here, there or both needs a ruling; the corpus record
        casp16-na-rna-puzzles-joint-assessment and tests/dedup known-pairs treat the CASP16 joint
        assessment as a CASP edition.
      field: versions
      source: src-casp15-rna-proteins-2023
      quote: These models were evaluated by the RNA-Puzzles organizers and, separately, by a
        CASP-recruited team
    - check: Rounds are not dated releases. Puzzles go out continuously and are grouped into rounds
        afterwards by function and timing, so rounds overlap in time (Round V includes puzzles 11,
        16 and 18 from 2014-2016, after Round IV's puzzle 21 of 2017). The supersedes chain follows
        publication order, and `released` is left empty on every row. Modelling puzzles as editions
        and rounds as reports may fit better.
      field: versions
      source: src-rnapuzzles-round4-rna-2020
      quote: The puzzles are grouped into rounds based on the similarity of function and approximate
        cooccurrence in prediction time.
    - check: round-vi is a placeholder for puzzles 40 onward, named after the site's "Round VI"; no
        source says which puzzles it will cover, and some of puzzles 43-49 (2024) may be CASP16
        targets.
      field: versions
      source: src-rnapuzzles-future-outlook
      quote: eagerly anticipate collaborations for Puzzle Round VI
    - check: activity accepting-submissions rests on a 2026-04-02 post about submissions for puzzles
        74-79. The open-puzzle portal needs a login, so no open puzzle was seen on 2026-11-04;
        results-pending or between-rounds may be truer if none is open.
      field: activity
    - check: Round V's paper counts 18 groups and the site's news post 19 teams for the same round.
      field: versions
      source: src-rnapuzzles-participating-teams
      quote: In Puzzles Round V, 19 renowned global RNA structural prediction teams participated
    - check: independence_flags is left empty. Structure providers also predict (the CASP16
        second-ranked team often provides RNA-Puzzles structures), and the Das group, a leading
        RNA-Puzzles predictor, co-assessed CASP15's RNA targets; no flag names either, and no source
        says a provider predicted its own puzzle.
      field: governance.independence_flags
      source: src-rnapuzzles-casp16-proteins-2025
      quote: The team participates often to RNA‐Puzzles [6] as structure provider
    - check: maintainer_type academic-lab, government-agency or community-collective. The site is
        hosted by a group at the Guangzhou Laboratory, a research institute; the code's copyright
        holder is "RNA-Puzzles"; the founding organiser is at a university-CNRS unit in Strasbourg.
      field: governance.maintainer_type
      source: src-github-rna-assessment-licence
      quote: MIT License Copyright (c) 2024 RNA-Puzzles
    - check: harness_availability official-harness rests on Round V's statement that RNA_assessment
        holds all the metrics used. The repository needs MC-Annotate, OpenStructure and MolProbity,
        has no tagged release, and the per-round ranking is done in RoundV_reproducibility's
        notebook.
      field: execution.harness_availability
      source: src-github-rna-assessment-readme
      quote: If need to calculate the Interaction Network Fidelity, it needs to call
    - check: classical-algorithm is tagged as a designed-for subject because nearly all entrants are
        non-learned programs (fragment assembly, coarse-grained simulation, templates); CASP's entry
        did not tag it. Rosetta-based entries selected by the learned ARES scorer sit on the line.
      field: designed_for_subjects
      source: src-rnapuzzles-round5-nat-methods-2024
      quote: Of the 18 modeling approaches, only one is based on deep learning (Kollmann).
    - check: aggregation_policy official-aggregate. Round V and CASP16 publish rank-point totals per
        group, but Round III declines to rank, and the rankings are by one metric at a time;
        none-by-design could be argued.
      field: aggregation_policy
      source: src-rnapuzzles-round3-rna-2017
      quote: At this stage, it is probably still too early to offer a comparative analysis of the
        prediction and modeling methods.
    - check: The Round I paper was read only as its Europe PMC abstract record (the full text is
        free but not in the open subset), so Round I's details rest on the abstract and the puzzles
        list.
      field: versions

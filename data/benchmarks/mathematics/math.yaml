    problems and keeps the split file in its PRM800K repository, Hugging Face's H4 team hosts the
    copy most papers load, and it is reported and versioned under its own name; math-500 is a
    proposed id, not an allocated one. MATH Level 5 is a subset (math#level-5), since Epoch selects
    the maintainers' own level tag and publishes no separate set. PRM800K, a training set of step
    labels on MATH problems, is not a benchmark; ProcessBench (its own entry) draws problems from
    MATH's test set for a different task. EleutherAI's copy, MATH-lighteval and the README's
    re-upload are copies, not derivatives.

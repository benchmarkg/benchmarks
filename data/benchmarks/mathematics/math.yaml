curation:
  added_by: agent (P1-S10-T06)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2103-03874-v2
    - src-arxiv-2103-03874
    - src-github-math-readme
    - src-hf-api-math-original
    - src-hf-api-math-reupload
    - src-hf-legal-takedown-2025-01-02-aops
    - src-github-openai-prm800k-readme
    - src-hf-api-huggingfaceh4-math-500
    - src-hf-api-eleutherai-math
    - src-github-inspect-evals-math-readme
    - src-github-lm-eval-minerva-math-readme
    - src-epoch-benchmarks-math-level-5
    - src-epoch-benchmark-data
    - src-arxiv-2507-10532-v3
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its abstract page for the dates; the MATH
    README at main and the API records of the original dataset and of the re-upload the README links,
    all withheld from archiving because they sit in personal accounts; AoPS's takedown notice, withheld
    because it names AoPS staff and reproduces the problems it claims; the PRM800K README and the MATH-500
    API record for the fork and the contamination route; EleutherAI's API record for the copy and the
    subject counts; the inspect_evals README (withheld: contributor handles) and the lm-evaluation-harness
    README for the harnesses; Epoch's MATH Level 5 page and export for the subset and current use; and
    the v3 PDF of arXiv 2507.10532 (a DOI) for memorisation evidence.
  confidence: medium
  review_checks:
    - check: Lineage. MATH-500 is recorded as a fork (another maintainer, OpenAI, chose and
        published the split; it is cited and loaded under its own name) rather than a variant or
        subset. The items are a random 500 of MATH's own test problems, unchanged, so a subset
        math#math-500 is the alternative if same items outweighs different maintainer.
      field: lineage.forks
      source: src-github-openai-prm800k-readme
      quote: We selected these 500 test problems uniformly at random, and we believe they are
        representative of the test set as a whole.
    - check: math#level-5 is a subset although the selection is Epoch's, not the maintainers'; the
        level is the maintainers' own tag, and the stub's allocation already names it a subset. 04
        section 4's subset test says same maintainer, which Epoch is not.
      field: subsets
      source: src-epoch-benchmarks-math-level-5
      quote: We selected the Level 5 subset for our evaluations because it
    - check: evaluation_method exact-match although the paper's normalisation goes beyond the term's
        whitespace-or-case allowance (fraction encodings, units, 0.5 against 1/2, factor order). No
        computer algebra decides equivalence, so symbolic-equivalence does not fit the official
        scoring; the vocabulary has no term for rule-based normalised match.
      field: evaluation_method
      source: src-arxiv-2103-03874-v2
      quote: When the answer is a factorized polynomial, we permit different orderings of the
        factors
    - check: data.access fully-open rests on the re-upload the maintainers' README links, in a third
        party's personal account, and on mirrors (EleutherAI, MATH-lighteval). The original copy is
        disabled, and AoPS asked Hugging Face to remove derived copies too. If only the authors' own
        copy counts as official, no official copy is downloadable.
      field: data.access
      source: src-github-math-readme
      quote: Download the [**MATH dataset here**]
    - check: dataset_licence MIT is the authors' statement, but AoPS's DMCA notice claims the
        problems and solutions and alleges they were copied from Alcumus; whether
        licence-restriction should be a reproducibility blocker, and whether data_provenance should
        follow the notice, are legal and factual questions the sources do not settle.
      field: data.dataset_licence
      specialist: true
      source: src-hf-legal-takedown-2025-01-02-aops
      quote: found that over 10,000 of the 12,500 problems have a similarity score of 95 or above
        with basic text matching to current problems in our system
    - check: contamination_risk high or confirmed. PRM800K's public training split holds 4,500 of
        the 5,000 test problems, a route into the scored set for any model trained on it, and one
        family's memorisation of MATH-500 is measured; confirmed would need demonstrated
        contamination of the benchmark as scored, which the Qwen result shows only for one family
        and one subset.
      field: data.contamination_risk
      source: src-arxiv-2507-10532-v3
      quote: prompting with the first 60% of each MATH-500 problem, Qwen2.5-Math-7B regenerates the
        remaining 40% with a 54.60% exact-match rate and answers 53.6% of these incomplete problems
        correctly
    - check: ceiling_anchor_type expert-best rests on one solver's 18 of 20 problems in an hour
        without a calculator, a small and unblinded sample (four of six participants were authors).
        The paper also says expert performance is 100% in principle, which would make
        theoretical-maximum the anchor.
      field: data.ceiling_anchor_type
      source: src-arxiv-2103-03874-v2
      quote: Expert-level performance is theoretically 100% given enough time.
    - check: versions is empty. No source labels a revision of the items, and the copies in use
        (EleutherAI's, MATH-lighteval, the README's re-upload, whose one file is named as train
        data) were not compared with the 2021 release. The grader revisions in lm-evaluation-harness
        and inspect_evals change scores but are harness versions, recorded under comparability
        rather than as benchmark versions.
      field: versions
      source: src-hf-api-eleutherai-math
      quote: '"author":"EleutherAI"'
    - check: aggregation. The paper's headline is the average over seven subjects (Table 2), which
        weights Counting and Probability's 474 problems like Algebra's 1,187; harnesses and most
        papers report accuracy over all problems. Whether the paper's average is unweighted was not
        confirmed beyond its wording.
      field: aggregation_policy
    - check: maintainer_type individual or academic-lab. The artefacts sit in the first author's
        personal accounts with no institution named as holder; the authors are a UC Berkeley group.
        The paper's own checklist gives the authors' APPS repository, not the MATH one, as where the
        data and code are.
      field: governance.maintainer_type
    - check: harness_availability official-harness rests on the README's statement that the
        repository holds evaluation code; the code was not read, so reference-implementation-only is
        possible if it only checks answers or runs the paper's fine-tuning.
      field: execution.harness_availability
      source: src-github-math-readme
      quote: This repository contains dataset loaders and evaluation code.

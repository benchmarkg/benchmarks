# data/benchmarks/mathematics/proofnet.yaml
#
# P1-S10-T05, mathematics entry 5 of 6. Filled from the ProofNet paper, arXiv 2302.12433 read as its v1 PDF
# (2023-02-24, the only version), and its abstract page; the earlier MATH-AI 2022 workshop paper of the same
# benchmark (mathai2022.github.io); the repository README at main (zhangir-azerbayev/ProofNet, with GitHub's API for
# its licence and pushed_at); Hugging Face's API record of the dataset (hoskinson-center/proofnet), of its commits,
# and its card; the v1 PDF of DeepSeek-Prover-V1.5 (arXiv 2408.08152, August 2024), whose repository holds the Lean 4
# port the README points to; and the v1 PDF of Diffusion-Proof (arXiv 2606.19315, June 2026), a 2026 result on the
# test split. Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.
#
# The Lean 4 ports are other parties' work. They are recorded as lineage, as the sources state it, and not as
# versions of this entry.

id: proofnet
name: ProofNet
tagline: 371 undergraduate theorems in natural language and Lean 3, for autoformalisation and formal
  theorem proving.
description: >
  A benchmark of 371 theorems from undergraduate pure mathematics, drawn mainly from textbook
  exercises in real and complex analysis, linear algebra, abstract algebra and topology, and from the
  Putnam Competition. Each item pairs a natural-language statement and proof with a formal statement
  in Lean 3 that depends on mathlib, formalised by annotators who know Lean; exercises that ask for
  an unknown quantity are left out, and statements chosen to be unlikely to enter mathlib. Two kinds
  of task use the items. In autoformalisation a system turns the natural-language statement into a
  Lean statement (or the reverse); it is the only task the release paper runs, scored by a human
  expert's verdict on each output, with Lean's typecheck rate and BLEU beside it. In formal theorem
  proving a system must write a proof that the proof assistant accepts; the paper left it to future
  work, and it is how ProofNet is mostly used now, as the share of the 186 test statements proved
  under a sampling budget. The items are split into 185 validation and 186 test statements. Lean 3
  is no longer maintained, and the original repository points users to Lean 4 ports by others, such
  as the one in DeepSeek-Prover-V1.5's repository, converted by hand to Lean 4.9.0. A 297-statement
  version was presented at the NeurIPS 2022 MATH-AI workshop.
self_description:
  source: src-arxiv-2302-12433
  quote: We introduce ProofNet, a benchmark for autoformalization and formal proving of
    undergraduate-level mathematics
external_ids:
  huggingface: hoskinson-center/proofnet
  arxiv: '2302.12433'
paper:
  title: 'ProofNet: Autoformalizing and Formally Proving Undergraduate-Level Mathematics'
  arxiv: '2302.12433'
  version_read: v1
  source: src-arxiv-2302-12433-v1
released: 2023-02-24
released_note: The paper's first and only arXiv version, as its abstract page dates it, and the
  371-statement set it describes. A 297-statement version was presented earlier, at the NeurIPS 2022
  MATH-AI workshop, whose paper gives no day (see versions and review_checks).
released_source: src-arxiv-2302-12433
released_quote: Submitted on 24 Feb 2023

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: mathematics/formal-theorem-proving
domain_basis:
  reason: The benchmark names two tasks, autoformalisation and formal proving. Formal proving is the
    one a leaf exists for, and the one ProofNet is mostly used for now; the statements are
    mathematical and the proof assistant checks each proof. Autoformalisation, the release paper's
    only experiment, has no leaf of its own and is recorded as a subset with its own method
    (subsets, review_checks).
  source: src-arxiv-2302-12433-v1
  quote: Given a formal statement of a theorem, produce a formal proof.
domain_considered_and_rejected:
  - term: mathematics/competition-math
    reason: Some problems come from the Putnam Competition, but most are textbook exercises, and the
      leaf's determinate answers are what ProofNet excludes.
    source: src-arxiv-2302-12433-v1
    quote: We do not include exercises that require computing an unknown quantity.
  - term: language/translation
    reason: Autoformalisation translates natural language into Lean, but the target is a formal
      language and the verdict is whether the mathematical content survived, which is measured as
      mathematics; the language family's exclusion test sends a subject measured elsewhere there.
  - term: mathematics/proof-verification
    reason: No task hands the system a candidate proof to accept or reject; the natural-language
      proofs are inputs, not proofs to judge.
capability:
  - deductive-reasoning
capability_basis:
  deductive-reasoning:
    reason: A formal proof is correct exactly when Lean accepts it, so correctness is decided from
      the formal statement, mathlib and the system's rules alone. The items were chosen to apply
      general results to concrete cases rather than restate library theorems, so the difficulty is
      applying a result, not recalling it, which the term's exclusion test asks.
    source: src-arxiv-2302-12433-v1
    quote: ProofNet predominantly tests the ability of models to apply those results to concrete
      problems
capability_considered_and_rejected:
  - term: generation-fidelity
    reason: Only autoformalisation scores whether an output keeps the source statement's meaning, as
      a human expert judges it, so the term is that subset's (capability_override), not the
      benchmark's.
    source: src-arxiv-2302-12433-v1
    quote: autoformalizations are evaluated for correctness by a human expert
  - term: knowledge-recall
    reason: Provers and autoformalisers must know mathlib's names and definitions, but that
      knowledge is on the way to the scored outcome, a proof Lean accepts or a statement the expert
      accepts.

evaluation_method:
  - formal-proof-check
  - human-expert-eval
evaluation_method_basis:
  reason: formal-proof-check for formal proving, where Lean accepts or rejects each proof and that
    verdict is the score (the Lean 4.9.0 port in DeepSeek-Prover-V1.5's case). human-expert-eval for
    autoformalisation, where a human expert decides whether each generated statement is a correct
    formalisation, because no automatic check decides that two statements say the same thing.
  source: src-arxiv-2302-12433-v1
  quote: autoformalizations are evaluated for correctness by a human expert
evaluation_method_considered_and_rejected:
  - term: reference-metric
    reason: The release paper reports BLEU-4 against the reference formal statements beside the
      expert's accuracy, but finds it a poor guide, and the dataset card's leaderboard leaves it
      out; it is not the score.
    source: src-arxiv-2302-12433-v1
    quote: BLEU is a poor guide to formalization performance
  - term: constraint-check
    reason: The typecheck rate, the share of generated statements Lean accepts as well formed, is a
      programmatic check, but it is reported as a predictor of the expert's accuracy, not as the
      score.
    source: src-arxiv-2302-12433-v1
    quote: Typecheck rate correlates strongly with formalization accuracy
designed_for_subjects:
  - task-specific-supervised-model
  - base-model
designed_for_subjects_note: Mathematics is not one of domain-specialist-model's disciplines, the
  reason miniF2F's entry gives for task-specific-supervised-model, which this entry follows for the
  provers.
designed_for_subjects_basis:
  reason: The release paper's baselines are pretrained language models prompted few-shot by
    continuation (Code-davinci-002 and the authors' proofGPT models), the protocol base-model names,
    with a proofGPT model fine-tuned for autoformalisation beside them. Formal proving is entered by
    models trained for theorem proving, such as DeepSeek-Prover-V1.5, an open model built for
    proving in Lean 4 (task-specific-supervised-model).
  source: src-arxiv-2302-12433-v1
  quote: In this work, we evaluate the capabilities of pre-trained language models on
    autoformalizing and informalizing theorem statements.
designed_for_subjects_considered_and_rejected:
  - term: retrieval-augmented-system
    reason: Prompt retrieval, one of the release paper's two new autoformalisation methods, puts
      retrieval of mathlib statements inside the system, but it is a method the paper proposes, not
      the kind of entrant the benchmark is built for.
  - term: domain-specialist-model
    reason: Mathematics is not one of the term's six disciplines.
as_used:
  - protocol: Formal proving on a Lean 4 version of the test split, whole-proof generation from each
      theorem's natural-language and Lean 4 statements, scored by pass@32 (with up to 32 corrections
      per theorem for the authors' corrector).
    split: test
    source: src-arxiv-2606-19315-v1
    quote: we adopt the standard pass@32 metric applied in almost all previous studies
    note: Diffusion-Proof (UIUC and NVIDIA, June 2026). It does not say which Lean 4 port it used.
  - protocol: Formal proving on the Lean 4.9.0 port of both splits, by single-pass whole-proof
      generation and by tree search (RMaxTS), after expert iteration on the validation split.
    split: valid, test
    source: src-arxiv-2408-08152-v1
    quote: Note that the validation set of ProofNet is used to perform expert iteration in
      supervised fine-tuning.
    note: DeepSeek-Prover-V1.5 (August 2024). Its validation numbers are not held out.

lifecycle: active
lifecycle_note: The README tells users to take a Lean 4 port instead of the original Lean 3
  repository. That is advice against a code base and proof-assistant version, not against the
  benchmark, so deprecated is not tagged (its exclusion test); see review_checks.
lifecycle_basis:
  reason: Results are still produced against it; a June 2026 paper reports formal-proving results on
    the test split and calls ProofNet one of the field's common benchmarks. The repository was last
    pushed on 2024-10-14 and the dataset last changed on 2023-03-17 (GitHub and Hugging Face APIs),
    which is maintenance evidence, not lifecycle.
  source: src-arxiv-2606-19315-v1
  quote: These datasets are frequently employed in major studies on the LLM formal reasoning field
activity: no-submission-channel
activity_basis:
  reason: There is no leaderboard, results page or submission route. The dataset card's leaderboard
    restates the release paper's own baselines and has not changed since March 2023, and the
    repository takes pull requests to the dataset, not results.
  source: src-github-proofnet-readme
  quote: This repo is intended for replicating experimental results and accepting PRs to the
    dataset.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DeepSeek-Prover-V1.5-RL with RMaxTS tree search
    source: src-arxiv-2408-08152-v1
    observed_on: 2026-10-14
    quote: achieving new state-of-the-art pass rates of 25.4% on the validation set and 25.3% on the
      test set
  - system: Diffusion-Proof (dLLM-Prover-7B with dLLM-Corrector-7B)
    source: src-arxiv-2606-19315-v1
    observed_on: 2026-10-14
    quote: It shows that Diffusion-Proof achieves an accuracy rate of 50.00% on MiniF2F and 7.53% on
      ProofNet.
evaluation_target: learned-system
execution_mode: human-in-loop
execution_mode_note: Formal proving runs with no human step; autoformalisation, the release paper's
  task, needs a human expert to judge each output.
ground_truth_source: formal-verifier
ground_truth_source_note: For formal proving the proof assistant's verdict is the truth, and there
  are no reference proofs. For autoformalisation the reference Lean statements guide a human
  expert's verdict.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The statements, reference formalisations and proofs are public on Hugging Face, ungated,
    under MIT, and Lean is open; anyone can check proofs, and any Lean expert can judge
    formalisations.
  source: src-hf-api-proofnet
  quote: '"gated":false'

task:
  exists: true
  input:
    - 'formal proving: a formal theorem statement with its imports header, in Lean 3 or in a Lean 4 port;
      Lean 4 users also give the natural-language statement'
    - 'autoformalisation: a natural-language theorem statement (or, for informalisation, a formal one)'
  output: A proof that Lean accepts, or a formal (informal) statement of the same theorem.
  scoring: Formal proving reports the share of test (or validation) statements proved, with the
    attempt budget (pass@k). Autoformalisation reports the share a human expert judges correct, with
    typecheck rate and BLEU-4 against the reference statement beside it.
  source: src-arxiv-2302-12433-v1
  quote: Given a formal statement of a theorem, produce a formal proof.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Both splits, with reference formal statements and natural-language proofs, are public on
      Hugging Face, ungated, under MIT.
    source: src-hf-api-proofnet
    quote: '"gated":false'
  refresh: versioned-releases
  refresh_note: The GitHub repository took two later fixes, to a natural-language proof (2023-05-29)
    and a shorter proof (2023-07-21), that the Hugging Face copy does not carry (GitHub API commit
    history, read 2026-10-14; not a quoted Source).
  refresh_basis:
    reason: The statements changed after release only in dated commits to the Hugging Face dataset,
      "fixed a few obvious bugs" on 2023-02-24 and "fixed a few errors" on 2023-03-17; the second is
      the dataset's current revision (cb8e756), so the state a claim used can be pinned. The
      297-statement workshop set before them was a separate release (versions).
    source: src-hf-api-proofnet-commits
    quote: '"title":"fixed a few errors"'
  data_provenance:
    - expert-authored
  data_provenance_note: The problems come from exercises in undergraduate textbooks (Rudin, Pugh,
    Stein and Shakarchi, Axler, Dummit and Foote, Herstein, Artin, Munkres) and from the Putnam
    Competition. Annotators who know Lean transcribed the statements into LaTeX and formalised them.
    The natural-language proofs are adapted from online solutions manuals or written by the
    annotators.
  data_provenance_source: src-arxiv-2302-12433-v1
  data_provenance_quote: Problems statements are transcribed into LATEX and formalized by human
    annotators
  contamination_risk: medium
  contamination_risk_note: The statements, reference formalisations and natural-language proofs have
    been public on GitHub and Hugging Face since early 2023, so a route into training data is
    plausible. The authors avoided statements that are, or are likely to become, mathlib theorems,
    which closes one route. The one evidenced route belongs to an entrant, DeepSeek-Prover-V1.5,
    which trained on the validation split by expert iteration and reports results on it; that
    belongs on its claims and leaves the test split unevidenced.
  contamination_evidence:
    - source: src-arxiv-2408-08152-v1
      stance: supports
      quote: validation sets from the miniF2F (Zheng et al., 2022) and ProofNet (Azerbayev et al.,
        2023) benchmarks
    - source: src-arxiv-2302-12433-v1
      stance: against
      quote: we refrain from including statements that are in mathlib or are likely to be added to
        mathlib in the future
  dataset_licence: MIT
  dataset_licence_source: src-hf-api-proofnet
  dataset_licence_quote: '"license":"mit"'
  size:
    - count: 371
      unit: theorems (a natural-language statement and proof, and a formal statement in Lean 3)
      source: src-arxiv-2302-12433-v1
      quote: The ProofNet benchmark consists of 371 parallel formal theorem statements, natural
        language theorem statements, and natural language proofs
    - count: 186
      unit: theorems
      subset: test
      source: src-arxiv-2408-08152-v1
      quote: It comprises 185 validation and 186 test problems from widely-used undergraduate
        textbooks
    - count: 185
      unit: theorems
      subset: valid
      source: src-arxiv-2408-08152-v1
      quote: It comprises 185 validation and 186 test problems from widely-used undergraduate
        textbooks
    - count: 297
      unit: theorem statements, 100 of them with natural-language proofs
      subset: the 2022 workshop version
      source: src-mathai2022-proofnet-paper
      quote: The ProofNet benchmark consists of 297 parallel natural language and formal theorem
        statements
  size_note: The release paper does not give the split sizes; DeepSeek-Prover-V1.5 and
    Diffusion-Proof do, for the Lean 4 port they used, and the Hugging Face dataset holds the same
    two files (valid.jsonl, test.jsonl).
  languages:
    - en
    - Lean 3
  languages_note: Lean 4 ports exist (lineage); the original's formal statements are Lean 3, which
    the dataset card states.
  languages_source: src-hf-proofnet-readme
  languages_quote: Formal theorem statement in Lean 3.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ProofNet authors (Azerbayev et al.), with the dataset in the hoskinson-center
    organisation on Hugging Face
  maintainer_basis:
    reason: The paper and the README direct users to the Hugging Face dataset in the
      hoskinson-center organisation, which also holds the authors' proofGPT models; the paper thanks
      Carnegie Mellon's Hoskinson Center for Formal Mathematics for funding. The repository sits in
      the first author's GitHub account and was marked deprecated on 2024-10-14.
    source: src-arxiv-2302-12433-v1
    quote: Full dataset are available at https://huggingface.co/datasets/hoskinson-center/proofnet
  maintainer_type: academic-lab
  maintainer_type_note: The holder of the dataset as distributed is the hoskinson-center
    organisation, read as Carnegie Mellon's Hoskinson Center for Formal Mathematics from the paper's
    acknowledgement; no source says so outright (review_checks). individual was considered, since
    the repository is in a personal account, but the dataset users are told to use is not.
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results channel. The dataset card's leaderboard is the
    release paper's own baselines, and later results appear in the provers' papers, which follow
    their own protocols (as_used).
  submission_process_source: src-github-proofnet-readme
  submission_process_quote: To use ProofNet for your own experiments, use the [Huggingface dataset]
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2302-12433-v1
      quote: In order to obtain stronger baselines on ProofNet, we train and open-source the
        PROOFGPT language models
  independence_flags_note: The authors trained the proofGPT models, published them in the same
    hoskinson-center organisation, and rank them beside Codex in the paper and on the dataset card's
    leaderboard. EleutherAI, one author's affiliation, gave the compute to train them; no EleutherAI
    model of its own is evaluated, so funded-by-evaluated-party is not set (review_checks).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: The release paper's score, and the one its dataset card ranks, is autoformalisation
      accuracy, which a human expert decides. Formal proving alone is fully automatable, Lean
      checking every proof, and is how ProofNet is mostly used now (review_checks).
    source: src-arxiv-2302-12433-v1
    quote: autoformalizations are evaluated for correctness by a human expert
  reproducibility_blockers:
    - human-raters
  harness_availability: reference-implementation-only
  harness: The repository's eval/ scripts, which run the paper's autoformalisation and
    informalisation baselines; the accuracy itself is a human verdict
  harness_note: The original ships no proving harness. Provers check proofs with their own Lean 4
    setups (DeepSeek-Prover-V1.5 on Lean 4.9.0).
  harness_source: src-github-proofnet-readme
  harness_quote: contains scripts for running the autoformalization and informalization experiments
    found in the paper
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for zhangir-azerbayev/ProofNet, read 2026-10-14; the
    README states none. Not a quoted Source.
  runnable_via:
    - custom
  runnable_via_note: UK AISI's inspect_evals has no ProofNet module (its src/inspect_evals listing,
    read 2026-10-14).
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the profile the human-judged pair resolves to (the formal-proof-check pairs resolve to none): the
  # proof assistant and port (Lean 3, or which Lean 4 port, such as DeepSeek's on Lean 4.9.0), recorded as the
  # harness; the attempt budget (pass@k); whether the entrant trained on the validation split; and, for
  # autoformalisation, the number of in-context examples (the paper used 12 for Codex and 6 for proofGPT).
  material_extra:
    - harness
    - k
    - training_data_policy
    - shots

homepage: https://github.com/zhangir-azerbayev/ProofNet
repository: https://github.com/zhangir-azerbayev/ProofNet
dataset_url: https://huggingface.co/datasets/hoskinson-center/proofnet

versions:
  - version: 2022-workshop
    label: The NeurIPS 2022 MATH-AI workshop version
    version_kind: revision
    items: 297
    changes: The first presented version, 297 statements in natural language and Lean 3, 100 of them
      with natural-language proofs; the workshop paper gives no date beyond the venue.
    breaking: true
    superseded_by: '2023-02-24'
    frozen: true
    sources:
      - src-mathai2022-proofnet-paper
  - version: '2023-02-24'
    label: The arXiv release
    version_kind: revision
    released: 2023-02-24
    items: 371
    changes: 371 statements, each with a natural-language proof, in a validation and a test split.
    breaking: true
    supersedes_version: 2022-workshop
    errata:
      - date: 2023-03-17
        scope: a few statements
        description: '"fixed a few errors" on the Hugging Face dataset, its current revision (cb8e756),
          after "fixed a few obvious bugs" on the release day.'
        source: src-hf-api-proofnet-commits
    frozen: true
    sources:
      - src-arxiv-2302-12433
      - src-arxiv-2302-12433-v1
      - src-hf-api-proofnet-commits

subsets:
  - id: proofnet#valid
    label: Validation split
    items: 185
    scored_separately: true
    evidence:
      - source: src-arxiv-2408-08152-v1
        quote: It comprises 185 validation and 186 test problems from widely-used undergraduate
          textbooks
      - source: src-hf-api-proofnet
        quote: '{"rfilename":"valid.jsonl"}'
    notes: Results are reported on it too, but DeepSeek-Prover-V1.5 drew its few-shot examples from
      it and trained on it by expert iteration, so its validation numbers are not held out.
  - id: proofnet#test
    label: Test split (ProofNet-test)
    items: 186
    scored_separately: true
    evidence:
      - source: src-arxiv-2606-19315-v1
        quote: the ProofNet-test contains 186 theorems derived from college textbooks
      - source: src-hf-api-proofnet
        quote: '{"rfilename":"test.jsonl"}'
    notes: The split provers headline.
  - id: proofnet#autoformalization
    label: Statement autoformalisation and informalisation
    scored_separately: true
    capability_override:
      - generation-fidelity
    evidence:
      - source: src-arxiv-2302-12433-v1
        quote: autoformalizations are evaluated for correctness by a human expert
      - source: src-arxiv-2302-12433-v1
        quote: To calculate BLEU scores, we split on whitespace and use BLEU-4 with smoothing.
      - source: src-hf-proofnet-readme
        quote: '### Leaderboard **Statement Autoformalization**'
    notes: >
      A task over the same statements rather than a set of items, recorded as a subset as PaperBench's
      Code-Dev is, because no domain leaf names autoformalisation. A system turns each natural-language
      statement into a Lean statement, or the reverse. The score is the share a human expert judges
      correct, with the typecheck rate (statements Lean accepts as well formed) and BLEU-4 against the
      reference statement beside it; the authors recommend the typecheck rate as a cheaper predictor.
      capability_override drops deductive-reasoning on purpose, since no proof is produced. The paper
      does
      not say which split it evaluated.
subsets_note: The Hugging Face files are valid.jsonl and test.jsonl. The release paper names the
  tasks it supports (formal and informal proving, statement autoformalisation and informalisation,
  proof autoformalisation) and runs only the statement translations.

lineage:
  role: root
  forks:
    - id: proofnet-lean4
      maintainer: deepseek-ai (the Lean 4.9.0 port in the DeepSeek-Prover-V1.5 repository); the
        README speaks of Lean 4 ports in the plural
      source: src-github-proofnet-readme
      quote: you should use one of the Lean 4 ports of ProofNet, such as the one contained in
        [deepseek-ai/DeepSeek-Prover-V1.5]

tags:
  - theorem-proving
  - autoformalization
  - lean
  - undergraduate-mathematics
  - formal-verification

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2302-12433-v1
    - src-arxiv-2302-12433
    - src-mathai2022-proofnet-paper
    - src-github-proofnet-readme
    - src-hf-api-proofnet
    - src-hf-api-proofnet-commits
    - src-hf-proofnet-readme
    - src-arxiv-2408-08152-v1
    - src-arxiv-2606-19315-v1
  sources_note: >
    The ProofNet paper's v1 PDF (a DOI, not archived) read as text, and its abstract page for the date;
    the MATH-AI 2022 workshop paper (withheld from archiving, as it prints the authors' e-mail addresses);
    the README at main; Hugging Face's API records of the dataset and its commits, and the dataset card;
    DeepSeek-Prover-V1.5's v1 PDF for the Lean 4.9.0 port and the split sizes; and Diffusion-Proof's v1
    PDF
    as evidence of 2026 use.
  confidence: medium
  review_checks:
    - check: Autoformalisation has no domain leaf, so the primary is formal-theorem-proving and
        autoformalisation is a subset (as PaperBench's Code-Dev). The release paper runs only
        autoformalisation; a mathematics/autoformalization leaf, or a primary that follows the
        paper's experiments, would change this.
      field: domain
      source: src-arxiv-2302-12433-v1
      quote: Due to the engineering challenges of implementing neural theorem proving systems in
        Lean, we leave an investigation of formal theorem proving and proof autoformalization to
        future work.
    - check: requires-human-raters follows the release paper's human-judged accuracy. If formal
        proving, the common use now, is taken as the headline, the tier is fully-automatable with no
        blockers, and execution_mode automated.
      field: execution.reproducibility_tier
    - check: academic-lab rests on reading the hoskinson-center Hugging Face organisation as
        Carnegie Mellon's Hoskinson Center, which the paper thanks for funding; the repository is in
        the first author's account (individual).
      field: governance.maintainer_type
      source: src-arxiv-2302-12433-v1
      quote: Hoskinson Center for Formal Mathematics at Carnegie Mellon University
    - check: Identity. The Lean 4 ports (DeepSeek's on Lean 4.9.0, and others the README alludes to)
        are recorded as a fork. Results on different ports may differ by hand corrections; whether a
        port deserves its own entry, and whether ProofNet-test numbers on ports are this
        benchmark's, is open.

# data/benchmarks/mathematics/putnambench.yaml
#
# P1-S10-T05, mathematics entry 3 of 6. Filled from the PutnamBench paper, arXiv 2407.11214 read as its v2 PDF
# (2024-11-03, NeurIPS 2024 Datasets and Benchmarks Track), and its abstract page; the project site and the
# leaderboard page on trishullab.github.io (scripts and styles stripped), with the leaderboard's data file
# (results.json); the repository README and the Lean project's lean-toolchain file at main; the v1 PDF of
# Goedel-Architect (arXiv 2606.06468, June 2026), a current result; and DeepSeek-Prover-V2's abstract page
# (arXiv 2504.21801), already a Source of miniF2F's entry. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: putnambench
name: PutnamBench
tagline: Putnam competition problems (1962-2025) formalised in Lean 4, Isabelle and Coq, scored by
  how many a prover proves.
description: >
  Problems from the William Lowell Putnam Mathematical Competition, North America's undergraduate
  mathematics contest, formalised by hand by a UT Austin team in Lean 4, Isabelle and Coq (now
  Rocq), with the MAA's informal statements. A prover must produce a proof that the proof assistant
  accepts, and the score is the number of problems proved in one language, reported with the
  attempt budget. About 60% of Putnam problems ask for an answer as well as a proof; the answer is
  factored out of the theorem statement, so a prover can be given it or have to find it, and the
  Lean leaderboard ranks the two separately. The 2024 paper had 640 problems in Lean 4 and Isabelle
  and 412 in Coq (1692 formalisations); the repository now holds 672 in Lean, covering 1962 to 2025
  (1724 formalisations in all), and fixes statements as issues are reported. No proofs are
  published, to limit contamination. The leaderboard lists results sent with a paper or preprint,
  with the proofs shared privately for verification. Few problems were solved at release; by 2026
  several Lean systems report all 672, and the featured ranking orders those by reported cost.
self_description:
  source: src-arxiv-2407-11214
  quote: We present PutnamBench, a new multi-language benchmark for evaluating the ability of neural
    theorem-provers to solve competition mathematics problems
external_ids:
  arxiv: '2407.11214'
paper:
  title: 'PutnamBench: Evaluating Neural Theorem-Provers on the Putnam Mathematical Competition'
  arxiv: '2407.11214'
  version_read: v2
  source: src-arxiv-2407-11214-v2
released: 2024-07-15
released_note: The paper's first arXiv version, as the abstract page dates it; the leaderboard's
  first rows are dated 2024-07-17.
released_source: src-arxiv-2407-11214
released_quote: Submitted on 15 Jul 2024
release_venue: NeurIPS 2024 Datasets and Benchmarks Track
release_venue_source: src-arxiv-2407-11214
release_venue_quote: Accepted at NeurIPS 2024 Datasets & Benchmarks Track

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: mathematics/formal-theorem-proving
  secondary:
    - mathematics/competition-math
domain_basis:
  reason: The task is a machine-checked proof of a formal statement, and every statement is a
    problem from an undergraduate mathematics competition.
  source: src-arxiv-2407-11214
  quote: PutnamBench consists of 1692 hand-constructed formalizations of 640 theorems sourced from
    the William Lowell Putnam Mathematical Competition, the premier undergraduate-level mathematics
    competition in North America
domain_considered_and_rejected:
  - term: mathematics/research-level-math
    reason: The paper says Putnam problems often use ideas from research mathematics, but they are
      contest problems set for undergraduates, with known solutions.
    source: src-arxiv-2407-11214-v2
    quote: often using instances of ideas from research-level mathematics
capability:
  - deductive-reasoning
capability_basis:
  deductive-reasoning:
    reason: A proof counts exactly when the proof assistant accepts it, so correctness is decided
      from the formal statement and the system's rules alone.
    source: src-putnambench-site
    quote: The correctness of a proof is automatically checked by the compiler
capability_considered_and_rejected:
  - term: search-exploration
    reason: Results are reported with attempt budgets, and the featured Lean ranking orders the
      systems that proved all 672 problems by reported cost, but cost is not a traversal of the
      option space; the score is the number proved.
    source: src-putnambench-leaderboard
    quote: Lean — all 672 solved (cheapest first)
  - term: quantitative-reasoning
    reason: In the no-answer variant the prover must also find a closed-form answer, but the scored
      artifact is the proof, and the headline boards supply the answer.
    source: src-putnambench-leaderboard
    quote: 346 of the 672 problems contain an answer placeholder that the prover must infer

evaluation_method:
  - formal-proof-check
evaluation_method_basis:
  reason: Each proof is accepted or rejected by Lean 4, Isabelle or Coq, and the score counts the
    accepted ones under a budget of attempts.
  source: src-arxiv-2407-11214-v2
  quote: as determined by the formal proof environment, given a budget of n proof attempts
designed_for_subjects:
  - task-specific-supervised-model
  - agent-scaffold
  - classical-algorithm
designed_for_subjects_basis:
  reason: The paper evaluates neural and symbolic provers. ReProver is a prover fine-tuned for the
    task, the stage-3 reading of a maths prover that miniF2F's entry follows; COPRA and DSP are
    search loops around GPT-4 that the entrant supplies, and the paper counts a whole search as one
    attempt; Sledgehammer and CoqHammer are symbolic baselines, still on the leaderboard. Most rows
    since 2025 are entrant-built agent loops around language models.
  source: src-arxiv-2407-11214-v2
  quote: We use PUTNAMBENCH to evaluate several neural and symbolic approaches
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: GPT-4o prompted few-shot is one of the paper's baselines, but the protocol expects a
      proof the checker accepts, not a compliant assistant, and the competitive entrants are provers
      and agent loops.
    source: src-arxiv-2407-11214-v2
    quote: We prompt GPT-4 in a pass@10, setting temperature T = 0.7

as_used:
  - protocol: Ground-truth informal proofs given to the prover as context beside the formal
      statement, which the design does not provide.
    source: src-putnambench-leaderboard-data
    quote: Ground-truth informal proofs were supplied as context.
    note: The Mistral Prover row (2026-09-04, 658 Lean problems), listed as not yet independently
      verified.
  - protocol: Problems proved against corrected statements rather than the repository's at the cited
      commit.
    source: src-putnambench-leaderboard-data
    quote: Two problems were submitted against fixed formalizations
    note: The NEAR AI row (672/672 Lean); the Varto Isabelle row (640/640) reports that 130 problems
      needed formalization fixes.

lifecycle: active
lifecycle_basis:
  reason: Results keep being added. The leaderboard has rows dated through September and October
    2026, the newest on 2026-10-05, and a June 2026 paper reports 597 of the 672 Lean problems.
  source: src-putnambench-leaderboard-data
  quote: '"date-added": "2026-10-05"'
activity: accepting-submissions
activity_basis:
  reason: A continuously open leaderboard with no rounds, which takes results sent with a preprint
    or publication; outside rows were added in September and October 2026.
  source: src-github-putnambench-readme
  quote: will readily receive evaluation results which are accompanied by a preprint or publication

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Goedel-Prover-V2
    source: src-putnambench-leaderboard-data
    observed_on: 2026-10-14
    quote: pass@184, version 4.9.0, commit 0a59dcd
  - system: DeepSeek-Prover-V2-671B
    source: src-arxiv-2504-21801
    observed_on: 2026-10-14
    quote: solving 49 out of 658 problems from PutnamBench
  - system: Goedel-Architect (DeepSeek-V4-Flash backbone)
    source: src-arxiv-2606-06468-v1
    observed_on: 2026-10-14
    quote: At pass@4 with this NL guidance, GOEDEL-ARCHITECT closes 597/672 problems (88.8%)
    note: Its natural-language guidance comes from the pipeline's own generation step, not from the
      benchmark.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: formal-verifier
ground_truth_source_note: No reference proofs exist in the benchmark. The proof assistant's verdict
  on the submitted proof is the truth.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The statements are public under Apache 2.0 and MIT, and anyone can check a proof with the
    open proof assistants. Many leaderboard rows keep their proofs private, which limits re-checking
    those rows, not the benchmark.
  source: src-github-putnambench-readme
  quote: It is released under permissive licenses (Apache 2.0 for Lean 4 and Isabelle, MIT for Coq)

task:
  exists: true
  input:
    - a formal theorem statement in Lean 4, Isabelle or Coq, with the answer written into the
      statement (with answer) or left as a placeholder the prover must fill (no answer)
  output: A formal proof that the proof assistant accepts; in the no-answer variant, also the
    answer.
  scoring: The number of problems proved per language and variant (out of 672 in Lean, 640 in
    Isabelle, 412 in Coq), with the attempt budget (pass@n) or the cost reported beside it.
  reference_solution: false
  reference_solution_source: src-arxiv-2407-11214-v2
  reference_solution_quote: We do not include any of the formal proofs in our benchmark
  source: src-arxiv-2407-11214-v2
  quote: identify the (closed-form) solution, and then provide a proof of correctness by rewriting
    the solution into the theorem statement

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: All formal statements are public, under Apache 2.0 (Lean 4, Isabelle) and MIT (Coq), and
      the informal statements are included with the MAA's permission.
    source: src-github-putnambench-readme
    quote: It is released under permissive licenses (Apache 2.0 for Lean 4 and Isabelle, MIT for
      Coq)
  refresh: rolling-live
  refresh_basis:
    reason: Problems are added and statements fixed in commits, with no version labels or tags; the
      leaderboard ranks rows measured on different states of the set and asks for the commit, so a
      number needs its commit to be read.
    source: src-putnambench-leaderboard
    quote: Some new problems have been added since original release, benchmarked methods have not
      been rerun on those problems
  data_provenance:
    - exam-derived
    - expert-authored
  data_provenance_note: The problems are Putnam competition problems, with the MAA's informal
    statements. The formal statements were written by hand by two doctoral and five undergraduate
    students experienced in mathematics and proof assistants, and each checked by a second person.
  data_provenance_source: src-arxiv-2407-11214-v2
  data_provenance_quote: undergraduate students with prior experience in university
  contamination_risk: high
  contamination_risk_note: The formal statements are public. At release no formal proofs of them
    existed and none are published in the benchmark, and the maintainers ask that none be written or
    posted. By 2026 several systems report proofs of every Lean problem, most shared privately, but
    one submission's Rocq proofs are public, and the problems' informal solutions are public, a
    route the paper names itself. The Coq (Rocq) board is the split with public formal proofs.
  contamination_evidence:
    - source: src-putnambench-leaderboard-data
      stance: supports
      quote: Public proof files and verification workflow
    - source: src-arxiv-2407-11214-v2
      stance: supports
      quote: Indirect contamination can occur through transfer from training on the informal proofs
    - source: src-putnambench-site
      stance: against
      quote: since no formal proofs have been written for any of our problems, direct contamination
        is not possible
    - source: src-github-putnambench-readme
      stance: against
      quote: We kindly ask that you do not write formal proofs for any of the problems in an effort
        to reduce contamination
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: The headline is the number of problems proved out of a fixed count per board, bounded by
      that count; no human or measured ceiling is published.
    source: src-putnambench-leaderboard
    quote: Lean with answer — answer placeholders pre-filled (out of 672)
  dataset_licence: Apache-2.0 (Lean 4 and Isabelle formalisations); MIT (Coq formalisations)
  dataset_licence_source: src-github-putnambench-readme
  dataset_licence_quote: It is released under permissive licenses (Apache 2.0 for Lean 4 and
    Isabelle, MIT for Coq)
  upstream_licences: The informal problem statements are the MAA's, included with its permission.
  upstream_licences_source: src-github-putnambench-readme
  upstream_licences_quote: are also available with permission from the MAA
  size:
    - count: 672
      unit: problems formalised in Lean 4
      subset: Lean 4 (main, 2026-10)
      source: src-putnambench-site
      quote: There are 672 problems formalized in Lean 4, 640 formalized in Isabelle, and 412
        formalized in Coq
    - count: 640
      unit: problems formalised in Isabelle
      subset: Isabelle
      source: src-putnambench-site
      quote: There are 672 problems formalized in Lean 4, 640 formalized in Isabelle, and 412
        formalized in Coq
    - count: 412
      unit: problems formalised in Coq
      subset: Coq (Rocq)
      source: src-putnambench-site
      quote: There are 672 problems formalized in Lean 4, 640 formalized in Isabelle, and 412
        formalized in Coq
    - count: 1724
      unit: formalisations across the three languages
      subset: all languages (main, 2026-10)
      source: src-github-putnambench-readme
      quote: PutnamBench comprises of 1724 manually-crafted formalizations, aggregated over all
        languages
    - count: 346
      unit: Lean problems with an answer placeholder
      subset: Lean no answer
      source: src-putnambench-leaderboard
      quote: 346 of the 672 problems contain an answer placeholder that the prover must infer
    - count: 1692
      unit: formalisations (640 Lean 4, 640 Isabelle, 412 Coq)
      subset: the 2024 release
      source: src-arxiv-2407-11214-v2
      quote: In aggregate, PUTNAMBENCH contains 1692 formalizations of Putnam competition problems
  languages:
    - Lean 4
    - Isabelle
    - Coq (Rocq)
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The PutnamBench team at UT Austin (the trishullab GitHub organisation)
  maintainer_basis:
    reason: The authors are at UT Austin, and the statements, site and leaderboard sit in the
      trishullab organisation on GitHub, which hosts the team's site.
    source: src-putnambench-site
    quote: The University of Texas at Austin
  maintainer_type: academic-lab
  submission_process:
    - maintainer-verified
    - publication-gated
    - maintainer-run
  submission_process_note: Results are sent privately with a paper or preprint, and the proof bundle
    is shared privately for PutnamBench's verification; at least one row is listed as not yet
    verified. The paper's own baselines (GPT-4o, COPRA, DSP, ReProver, Sledgehammer, CoqHammer,
    Tactician) were run by the maintainers and stay on the board, dated 2024-07-17.
  submission_process_source: src-putnambench-leaderboard-data
  submission_process_quote: The proof bundle was submitted privately for independent PutnamBench
    verification
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2407-11214-v2
      quote: Amitayush Thakur, George Tsoukalas, Yeming Wen, Jimmy Xin, and Swarat Chaudhuri
  independence_flags_note: COPRA, one of the paper's baselines and a leaderboard row, is by four of
    PutnamBench's authors (the quote is its reference's author list). It is a baseline the team ran,
    not a system built for the board. The work was funded by NSF awards and a family foundation, not
    by an evaluated party.
  independence_assessed: true
  funding:
    source: src-arxiv-2407-11214-v2
    quote: This work was supported by NSF awards CCF-2212559 and CCF-2403211
  known_limitation:
    source: src-putnambench-leaderboard
    quote: Some new problems have been added since original release, benchmarked methods have not
      been rerun on those problems

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The statements are public and the proof assistant checks each proof with no human step.
    source: src-putnambench-site
    quote: The correctness of a proof is automatically checked by the compiler
  harness_availability: official-harness
  harness: The proof assistants' own checkers on the repository's projects; for Lean, the lean4
    project with its pinned toolchain and Mathlib
  harness_note: The pinned Lean toolchain moves with main; leaderboard rows report Lean versions
    from 4.9.0 to 4.33.1 and their own Mathlib commits. No prover-driving harness is published; the
    FTPEvals rows used a third party's.
  harness_source: src-github-putnambench-lean-toolchain
  harness_quote: leanprover/lean4:v4.33.1
  submission_channel:
    source: src-putnambench-leaderboard-data
    quote: the solution bundle was shared privately for independent verification
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The (formal-proof-check, classical-algorithm) pair resolves the eligibility-gated profile. Beyond it: the
  # attempt budget (pass@k; agent rows report tool calls or dollars instead), and the proof assistant release and
  # library the proofs were checked under (Lean toolchain and Mathlib commit, Rocq and MathComp versions), which
  # EvalConditions has no field for and `harness` carries here. subset_used carries the language and the with- or
  # no-answer variant; the benchmark commit is the claim's benchmark version.
  material_extra:
    - k
    - harness
  material_waived:
    - field: eligibility_track
      reason: PutnamBench runs no tracks by eligibility; its boards split by proof language and
        answer mode, which subset_used carries.
    - field: training_data_eligibility
      reason: No training-data tiers are defined (training_data_eligibility_tiers is empty); what a
        prover was trained on is carried by training_data_policy.

secondary_axes:
  - cost
secondary_axes_source: src-putnambench-leaderboard
secondary_axes_quote: Lean — all 672 solved (cheapest first)

homepage: https://trishullab.github.io/PutnamBench/
repository: https://github.com/trishullab/PutnamBench
leaderboard_url: https://trishullab.github.io/PutnamBench/leaderboard.html

versions:
  - version: '2024'
    label: PutnamBench as released (NeurIPS 2024)
    version_kind: revision
    released: 2024-07-15
    items: 640
    changes: The first release, 640 problems in Lean 4 and in Isabelle and 412 in Coq (1692
      formalisations), with factored solutions; items is the Lean count.
    superseded_by: main-2026-10
    frozen: true
    sources:
      - src-arxiv-2407-11214
      - src-arxiv-2407-11214-v2
  - version: main-2026-10
    label: The repository's main branch as read on 2026-10-14 (last pushed 2026-10-07)
    version_kind: revision
    items: 672
    changes: Problems added up to the 2025 competition, 672 in Lean 4 (1724 formalisations in all),
      and statements corrected through issues; the Lean set had 658 problems by April 2025. No tags
      or releases mark the states between; leaderboard rows cite commits. Items is the Lean count.
    breaking: true
    supersedes_version: '2024'
    frozen: false
    sources:
      - src-github-putnambench-readme
      - src-putnambench-site
      - src-putnambench-leaderboard
      - src-arxiv-2504-21801
      - src-arxiv-2606-06468-v1

subsets:
  - id: putnambench#lean4
    label: Lean 4
    items: 672
    scored_separately: true
    evidence:
      - source: src-github-putnambench-readme
        quote: Lean 4 | 672
  - id: putnambench#lean4-with-answer
    label: Lean 4, answers written into the statements
    parent: putnambench#lean4
    items: 672
    scored_separately: true
    evidence:
      - source: src-putnambench-leaderboard
        quote: Lean with answer — answer placeholders pre-filled (out of 672)
  - id: putnambench#lean4-no-answer
    label: Lean 4, answers left for the prover to find
    parent: putnambench#lean4
    items: 672
    scored_separately: true
    evidence:
      - source: src-putnambench-leaderboard
        quote: Lean no answer — answer placeholders not provided (out of 672)
    notes: 346 of the 672 problems carry an answer placeholder; submitters are asked to state how
      they reviewed the answers' faithfulness.
  - id: putnambench#isabelle
    label: Isabelle
    items: 640
    scored_separately: true
    evidence:
      - source: src-putnambench-leaderboard
        quote: Isabelle (out of 640)
  - id: putnambench#coq
    label: Coq (Rocq)
    items: 412
    scored_separately: true
    evidence:
      - source: src-putnambench-leaderboard
        quote: Rocq (out of 412)

tags:
  - theorem-proving
  - lean
  - isabelle
  - coq
  - competition-math
  - formal-verification
  - leaderboard

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2407-11214-v2
    - src-arxiv-2407-11214
    - src-putnambench-site
    - src-putnambench-leaderboard
    - src-putnambench-leaderboard-data
    - src-github-putnambench-readme
    - src-github-putnambench-lean-toolchain
    - src-arxiv-2606-06468-v1
    - src-arxiv-2504-21801
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the dates and venue;
    the project site and leaderboard page with scripts and styles stripped, and the leaderboard's
    results.json; the README (withheld from archiving: it gives a maintainer's e-mail address, kept
    out of the extract) and the Lean toolchain file at main; Goedel-Architect's v1 PDF as 2026 use;
    and DeepSeek-Prover-V2's abstract page, miniF2F's Source, for the 2025 problem count. GitHub's
    API (read 2026-10-14) reports no repository licence, no tags or releases, and a last push on
    2026-10-07. UK AISI's inspect_evals has no PutnamBench task.
  confidence: medium
  review_checks:
    - check: Saturation. Several systems report all 672 Lean problems (Aleph Prover, Humanfia, NEAR
        AI, Forall) and one all 640 Isabelle problems, and the featured board now orders full
        solvers by cost. saturated is derived and needs claims; most of these rows rest on privately
        shared proofs.
      field: lifecycle
      source: src-putnambench-leaderboard-data
      quote: 672/672 Lean solutions reported
    - check: classical-algorithm is tagged on the paper's symbolic baselines (Sledgehammer,
        CoqHammer), still on the board. It brings the eligibility-gated profile, two of whose fields
        are waived; miniF2F's entry leaves the term out and resolves to the fallback.
      field: designed_for_subjects
    - check: contamination_risk high rests on one submission's public Rocq proofs (eight problems)
        and the public informal solutions the paper names; medium is arguable, since the Lean and
        Isabelle proofs on the board are shared privately.
      field: data.contamination_risk
      source: src-putnambench-leaderboard-data
      quote: Public proof files and verification workflow
    - check: refresh is rolling-live because the set changes in commits with no labels and the board
        mixes states. miniF2F's entry calls a commit-pinned fork versioned-releases; the leaderboard
        does ask results to name the commit.
      field: data.refresh
      source: src-putnambench-leaderboard
      quote: Results should identify the benchmark commit, any modified inputs, and the
        answer-faithfulness review procedure
    - check: maintainer-verified rests on private proof verification, but at least one row is listed
        before it, which reads as self-reported for that row.
      field: governance.submission_process
      source: src-putnambench-leaderboard-data
      quote: result is not yet independently verified or endorsed
    - check: publication-gated rests on the stated rule, but several 2026 rows link company pages or
        blog posts rather than a paper or preprint (Varto, Aleph Prover, Midas Prover).
      field: governance.submission_process
      source: src-putnambench-site
      quote: We will be incorporating results which are accompanied by a research publication (or
        arxiv preprint) detailing the general methodology
    - check: In the no-answer variant the checker alone does not show that a filled-in answer is the
        intended closed form; submitters review it themselves, one with GPT-5.6 and manual checks.
        Whether that board needs a second evaluation_method term or its own comparability treatment.
      field: evaluation_method
      source: src-putnambench-leaderboard-data
      quote: GPT-5.6 was used for placeholder-faithfulness review, followed by manual checking
    - check: The proof assistant release and library (Lean 4.9.0 to 4.33.1, Mathlib and Rocq library
        versions) are material but EvalConditions has no field for them; `harness` carries them
        here, and simulator_version was the alternative. Agent rows state budgets in dollars, tool
        calls or GPU-days, which k does not hold.
      field: comparability
      source: src-putnambench-leaderboard-data
      quote: Evaluated against PutnamBench commit b3e08943b1728842194fe2df693f02c763da4294 using
        Lean v4.31.0 and Mathlib commit fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
    - check: The two version records (the 2024 release and main as read) are this entry's; the
        project names no versions, and intermediate states (658 Lean problems in April 2025) are
        pinned only by the commits rows cite.
      field: versions
    - check: official-harness rests on the repository's Lean project and its pinned toolchain; the
        repository ships no script that runs a prover and counts proofs, so
        reference-implementation-only is arguable.
      field: execution.harness_availability

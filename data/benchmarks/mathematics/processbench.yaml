# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2412-06559-v4
    - src-arxiv-2412-06559
    - src-aclanthology-2025-acl-long-50
    - src-github-processbench-readme
    - src-hf-api-processbench
    - src-hf-api-processbench-commits
    - src-arxiv-2605-10158-v1
  sources_note: >
    The paper's v4 PDF (a DOI, not archived) read as text; its abstract page for the dates and the
    abstract; the ACL Anthology page for the venue (a DOI); the README at main; Hugging Face's API
    records of the dataset and of its commits; and the v1 PDF of Unsupervised Process Reward Models
    (a DOI) as evidence of current use. GitHub's API was read for the licence and pushed_at.
  confidence: medium
  review_checks:
    - check: mathematics/proof-verification has a definition but no inclusion or exclusion test and
        no examples. ProcessBench judges natural-language solutions to problems with answers, not
        proofs of statements; whether such a solution counts as the leaf's supplied proof.
      field: domain
    - check: The paper's F1 is the harmonic mean of the accuracies on erroneous and on correct
        cases, not precision and recall. It is tagged classification-metric beside exact-match, as a
        balanced accuracy would be; exact-match alone is the other reading.
      field: evaluation_method
      source: src-arxiv-2412-06559-v4
      quote: we calculate the accuracies on erroneous and correct samples, respectively, and
        additionally compute their harmonic mean as the F1 score
    - check: contamination_risk high rests on PRM800K sharing problems (not solutions or labels)
        with ProcessBench, a route the paper closed only for the Qwen team's own PRM. Medium is the
        other reading if problem overlap is not a route into the scored content.
      field: data.contamination_risk
      source: src-arxiv-2412-06559-v4
      quote: To eliminate test data contamination, we also remove the PRM800K training samples that
        have the same problems in PROCESSBENCH
    - check: refresh versioned-releases rests on one label fixed in a dated Hugging Face commit;
        static is excluded by any post-release change, but the change carries no version label.
      field: data.refresh
      source: src-hf-api-processbench-commits
      quote: fix one annotation as suggested in https://github.com/QwenLM/ProcessBench/issues/9
    - check: expert-authored is given for the earliest-error labels, which experts wrote on
        model-written solutions; the term's exclusion of experts who only review items may apply.
      field: data.data_provenance
      source: src-arxiv-2412-06559-v4
      quote: We recruit human experts with doctoral-level mathematical expertise for annotation
    - check: Lineage to GSM8K, MATH, OlympiadBench and Omni-MATH (entry omni-math, curated
        separately) is in the text only; the lineage block has no relation for a benchmark that
        draws its problems from another's test set.
      field: lineage
    - check: Qwen models wrote part of the solutions and Qwen2.5-72B-Instruct segmented all of them,
        and Qwen critics and the Qwen PRM are ranked on them. Whether that warrants a flag beyond
        maintainer-competes-on-own-benchmark is not settled by the sources.
      field: governance.independence_flags

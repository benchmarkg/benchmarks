curation:
  added_by: agent (P1-S10-T06)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2411-04872-v7
    - src-arxiv-2411-04872
    - src-epoch-frontiermath-home
    - src-epoch-frontiermath-tiers-1-4
    - src-epoch-frontiermath-tiers-about
    - src-epoch-benchmarks-frontiermath-tiers-1-3-v2
    - src-epoch-benchmarks-frontiermath-tier-4-v2
    - src-epoch-benchmarks-frontiermath-tiers-1-3-v1
    - src-epoch-benchmarks-frontiermath-tier-4-v1
    - src-github-gist-epoch-frontiermath
    - src-epoch-about
    - src-epoch-benchmark-data
    - src-epoch-eci-included-benchmarks
    - src-epoch-transparency
    - src-arxiv-2605-06651
  sources_note: >
    The paper's v7 PDF (a DOI, not archived) read as text and its abstract page for the dates and the
    CC BY licence; Epoch's FrontierMath landing, Tiers 1-4 and About FrontierMath pages (the last withheld
    from archiving: it names problem authors and quoted mathematicians and gives a contact address); the
    four hub pages, v2 and v1 for each tier, read server-rendered (their score tables are script-rendered
    and were not read); GitHub's API record of the implementation gist (withheld: a personal account);
    Epoch's About page; the existing Sources for Epoch's export, the capabilities-index documentation
    and the transparency page; and AI co-mathematician's abstract page as 2026 use. Not read: the sample-problems
    page (disallowed by robots.txt), the Open Problems pages, Epoch's bylined reports and newsletter posts
    (among them the human-baseline write-up and any v2 or data-audit report), the inspect-viewer logs
    and the score CSVs.
  confidence: medium
  review_checks:
    - check: v2 is version_kind revision with breaking true. 04's version table calls the reissue a
        revision (same items, changed contents), and the allocation calls v2 breaking; the Sources
        support both. The items are the v1 problems, corrected or removed, with none added, and 135
        of 350 answers or statements changed, so scores do not carry across; Epoch keeps separate
        pages and score files and fits only v2. No source says in words that v1 and v2 scores are
        incomparable.
      field: versions
      source: src-epoch-eci-included-benchmarks
      quote: only the v2 score enters the fit
    - check: The 2024 snapshots (10-22, 11-06, 11-26, 12-04) are modelled as revisions with breaking
        true because each adds problems to the same set; edition is the alternative, since items are
        new, but there is no new year and the earlier items stay. 2025-07-01 is a track-set adding
        Tier 4 beside the unchanged core, so a Tiers 1-3 claim at 2025-02-28 and at 2025-07-01 is on
        the same items. Whether the internal snapshots should be versions at all, given that only
        the 10-22 and 11-26 ones carry published scores, is open.
      field: versions
      source: src-epoch-frontiermath-tiers-about
      quote: 'FrontierMath_11-06-24: Includes 147 questions. Internal delivery.'
    - check: Tier 4's v1 date has three spellings. The About page calls it FrontierMath_T4_06-30-25,
        Epoch's strings use 2025-07-01 (the version tag kept here) and the export dates its release
        2025-07-11 (the released date). The About page's version list stops before v2.
      field: versions
      source: src-epoch-frontiermath-tiers-about
      quote: 'FrontierMath_T4_06-30-25: Full 50 problem extreme difficulty expansion.'
    - check: Epoch's export gives v1 score ceilings of 0.57 (Tiers 1-3) and 0.6 (Tier 4), and 1.0
        for both v2 tiers. No source read explains them; they look like the share of v1 problems
        Epoch judged answerable after the audit. They are measurement ceilings (04 S6) on superseded
        versions, so ceiling_anchor_type stays theoretical-maximum; measured-ceiling is arguable for
        v1.
      field: data.ceiling_anchor_type
      source: src-epoch-benchmark-data
      quote: FrontierMath-Tier-4-2025-07-01-Private,True,frontiermath_tier_4.csv,Best score (across
        scorers),1.0,0.0,0.6,2025-07-11,FrontierMath-Tier-4-v2-Private
    - check: contamination_risk is medium where the Stage-3 record had low. The structure excludes a
        public route, but an evaluated developer holds most statements and solutions and API
        evaluation exposes the problems to every provider; no source evidences training on them. low
        is defensible if those routes are treated as conditions on OpenAI's and providers' claims
        rather than on the benchmark.
      field: data.contamination_risk
      source: src-epoch-frontiermath-tiers-about
      quote: OpenAI commissioned 300 questions for the core FrontierMath dataset and 50 problems for
        Tier 4.
    - check: Independence. No flag says that an evaluated party holds the items and answers, which
        is the central fact here; a missing-term gap is logged. No source read says what OpenAI
        holds of v2, whether the holdouts survive it, or who paid for the corrections. The
        transparency page lists an OpenAI-supported 2026 FrontierMath Data Audit, which may be the
        v2 work.
      field: governance.independence_flags
      source: src-epoch-transparency
      quote: 'OpenAI 2026 FrontierMath Data Audit 2026 FrontierMath: Open Problems Verifier 2024/25 Developing
        the FrontierMath benchmark'
    - check: AI co-mathematician's 48% on Tier 4 names no version (May 2026, so presumably the
        2025-07-01 Tier 4), and Epoch's transparency page lists a 2026 Google DeepMind collaboration
        evaluating it on FrontierMath. A claim from it needs the version and the commissioning
        recorded; whether a commissioned run is a separate flag on claims is open.
      field: as_used
      source: src-epoch-transparency
      quote: Google DeepMind 2026 Evaluating the AI co-mathematician on FrontierMath
    - check: harness_availability is reference-implementation-only. The gist is Epoch's own solver
        and scorer, but it imports an internal package, carries no problems and defaults to a
        100,000-token limit against the hub's 1,000,000; official-harness is arguable if the gist is
        taken as the designated implementation. It sits under an individual's personal account, so
        its Source is withheld from archiving.
      field: execution.harness_availability
      source: src-github-gist-epoch-frontiermath
      quote: 'token_limit: int = 100_000,'
    - check: Identity of the companion component. The allocation gives the Lean-proof component its
        own id (frontiermath-erdos) and asks for attention, since it could be frontiermath#erdos
        instead; the home page presents it as one of three FrontierMath components. Epoch's separate
        Open Problems component has no id and no Epoch string, so a reviewer should not call
        frontiermath-erdos the open-problems track. Ratify both.
      field: lineage
      source: src-epoch-frontiermath-home
      quote: Solutions are computationally verifiable, so evaluation can take place without needing
        to review AI proofs.
    - check: "\"Private\" in Epoch's strings is kept as an access-mode condition, as the allocation says,
        while the public problems are child subsets. v2's private counts are not stated, so a v2 claim's
        item count is unknown; the v1 counts are 290 and 48."
      field: subsets
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
      quote: The remaining 290 problems make up frontiermath-2025-02-28-private.
    - check: The evaluation protocol has changed under the same versions. The paper's loop had a
        10,000-token limit and its own code; the hub's implementation differs, and its prompt sets
        1,000,000 tokens. Epoch also re-graded Tier 4 v1 in place in January 2026. harness and
        token_limit are material for this reason.
      field: comparability
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
      quote: This implementation is different from the code we used to run preliminary evaluations
        in the paper.
  notes: null
  personal_data_excluded:
    - source: src-epoch-frontiermath-tiers-about
      what: problem authors' and quoted mathematicians' names, and the FrontierMath contact e-mail

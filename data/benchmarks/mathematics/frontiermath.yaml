# data/benchmarks/mathematics/frontiermath.yaml
#
# P1-S10-T06, mathematics entry 7. Promotes the Epoch stub data/benchmarks/_stubs/frontiermath.yaml. Filled from the
# FrontierMath paper, arXiv 2411.04872 read as its v7 PDF (2025-12-23), and its abstract page; Epoch AI's FrontierMath
# landing page, its Tiers 1-4 page and the About FrontierMath page (conflict-of-interest statement and version list);
# Epoch's four benchmark hub pages, Tiers 1-3 and Tier 4 in v2 and in the frozen v1 ("old") editions, with their
# methodology, prompt and changelogs; GitHub's API record of the gist the hubs link as Epoch's implementation; Epoch's
# About page; the existing Sources for Epoch's benchmark export, its capabilities-index documentation and its
# transparency page; and the abstract page of AI co-mathematician (arXiv 2605.06651, May 2026), a 2026 result on
# Tier 4. All epoch.ai pages were read server-rendered with scripts and styles stripped; robots.txt disallows the
# sample-problems page, which was not fetched. Epoch's bylined reports and newsletter posts were not read. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# Identity (04 S3, S4): the four Epoch strings are one benchmark. Tiers 1-3 and Tier 4 are subsets; the dated
# snapshots and v2 are versions; "Private" is the access mode of Epoch's scored split, a condition of the claim. The
# Lean-proof companion component has its own allocated id, frontiermath-erdos, and its own stub.

id: frontiermath
name: FrontierMath
aliases:
  - FrontierMath-2025-02-28-Private
  - FrontierMath-Tier-4-2025-07-01-Private
  - FrontierMath-Tiers-1-3-v2-Private
  - FrontierMath-Tier-4-v2-Private
  - FrontierMath Tiers 1-4
aliases_note: The first four are Epoch's benchmark-hub strings, each a benchmark, a tier (subset), a
  version and an access mode in one name (_id_allocation.yaml). Epoch's hub pages title them
  FrontierMath Tiers 1-3 (v1, old), FrontierMath Tier 4 (v1, old), FrontierMath Tiers 1-3 (v2) and
  FrontierMath Tier 4 (v2).
tagline: Epoch AI's unpublished, expert-written maths problems with machine-checked answers, in two
  tiers; v2 since 2026-06-12.
description: >
  Epoch AI's benchmark of original, unpublished mathematics problems written and peer-reviewed by mathematicians,
  each with an answer a script can check: a large integer, a SymPy expression or another object, chosen
  so that guessing is hopeless and no proof has to be read. The problems span most branches of modern
  mathematics, number theory and combinatorics most of all. The core set, Tiers 1-3, runs from olympiad-style
  and advanced undergraduate problems to early research problems; Tier 4, finished in mid-2025, holds
  research-level problems that professors and postdocs each wrote as a short research project. A model
  works inside Epoch's own loop with a stateless Python tool and a token budget (10,000 tokens in the
  2024 paper, a hard limit of 1,000,000 on the current hub) and submits a Python function answer() whose
  return value is verified; a problem scores 1 or 0, and Tiers 1-3 and Tier 4 are reported separately,
  on their private problems only. The set grew through dated snapshots: 119 problems in the paper's FrontierMath_10-22-24,
  180 in the 2024-11-26 snapshot behind OpenAI's o3 announcement, the 300-problem core on 2025-02-28 and
  50 Tier 4 problems by July 2025. On 2026-06-12 Epoch released v2, addressing errors in 42% of the problems:
  135 corrected and 12 removed, leaving 338 (295 in Tiers 1-3 and 43 in Tier 4, twelve of them public).
  A score reported without its version is therefore not interpretable. OpenAI funded the benchmark and
  commissioned its problems, and it has access to most problem statements and solutions apart from holdouts
  Epoch keeps for its own evaluations. Only Epoch can score a model on the private sets; it publishes
  the results on its benchmarking hub and fits them into its capabilities index.
self_description:
  source: src-arxiv-2411-04872
  quote: We introduce FrontierMath, a benchmark of hundreds of original, exceptionally challenging
    mathematics problems crafted and vetted by expert mathematicians.
external_ids:
  arxiv: '2411.04872'
paper:
  title: 'FrontierMath: A Benchmark for Evaluating Advanced Mathematical Reasoning in AI'
  arxiv: '2411.04872'
  doi: 10.48550/arXiv.2411.04872
  version_read: v7
  source: src-arxiv-2411-04872-v7
released: 2024-11-07
released_note: The paper's first arXiv version, as its abstract page dates it. The paper analysed
  the 119-problem FrontierMath_10-22-24 snapshot. Epoch's export dates its oldest string, the
  2025-02-28 core set, to 2025-02-28.
released_source: src-arxiv-2411-04872
released_quote: Submitted on 7 Nov 2024

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: mathematics/research-level-math
  secondary: []
domain_basis:
  reason: The answers are checked as mathematics (values and expressions), and the problems run from
    advanced undergraduate to research level, with Tier 4 research-level by design. The family's own
    first example is FrontierMath, and formal-theorem-proving's near-miss note sends answer-checked
    Tiers 1 to 4 here.
  source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
  quote: Expert-written math problems covering advanced undergrad through early career research.
domain_considered_and_rejected:
  - term: mathematics/competition-math
    reason: Tier 1, about a fifth of the core set, resembles olympiad problems, but the problems are
      original and allow tools and heavy computation; none is taken from a competition.
    source: src-epoch-frontiermath-tiers-about
    quote: These problems generally resemble International Math Olympiad problems and advanced
      undergraduate exercises
  - term: mathematics/formal-theorem-proving
    reason: No proof is produced or checked; the taxonomy's near-miss note puts Tiers 1 to 4 under
      research-level-math and leaves the Lean-proof component to frontiermath-erdos.
    source: src-arxiv-2411-04872-v7
    quote: Most notably, we cannot include problems that require mathematical proofs or formal
      reasoning steps
  - term: mathematics/symbolic-manipulation
    reason: Some answers are SymPy objects, but the work is solving the problem, not transforming a
      given expression.
  - term: code/function-synthesis
    reason: The model submits a Python function, but what is scored is the mathematical object it
      returns, so the family's exclusion for a scored program does not apply.
    source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
    quote: The answer is a Python object, often (although not always) an integer or a sympy object.
capability:
  - quantitative-reasoning
  - deductive-reasoning
capability_basis:
  quantitative-reasoning:
    reason: The scored answer is a number or an expression, reached by calculation, algebra and
      often heavy computation.
    source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
    quote: The answer is a Python object, often (although not always) an integer or a sympy object.
  deductive-reasoning:
    reason: Answers are designed to be reachable only by doing the mathematics from the problem's
      stated setting; the taxonomy gives FrontierMath as the term's example.
    source: src-arxiv-2411-04872-v7
    quote: solving the problem had to be necessary to find the correct answer
capability_considered_and_rejected:
  - term: tool-use
    reason: Every model has a Python tool, but the score is the answer, not how the tool was used;
      this is the term's Humanity's Last Exam near miss.
    source: src-epoch-frontiermath-tiers-about
    quote: Models interact with a Python environment where they can write and execute code to test
      hypotheses
  - term: creativity-novelty
    reason: Creativity is one of the three difficulty ratings, but the score rewards the correct
      answer, not departure from known solutions.
  - term: knowledge-recall
    reason: Problems need deep specialist background, but the answer must be derived; the problems
      are new, so it cannot be recalled.
evaluation_method:
  - exact-match
  - symbolic-equivalence
evaluation_method_note: Problems with non-unique answers (a tuple satisfying an equation, say) are
  checked by a custom verification script written by the problem's author; the paper says
  unique-answer problems are the majority, and no source gives the share of custom checks. In the
  hub's implementation the submitted answer() runs with a 30-second limit before verification.
evaluation_method_basis:
  reason: A unique integer answer is checked for an exact match, and a unique symbolic real answer
    by SymPy simplification of the difference to 0.
  source: src-arxiv-2411-04872-v7
  quote: If the problem has a unique integer solution, it checks for an exact match.
evaluation_method_considered_and_rejected:
  - term: constraint-check
    reason: The custom verification scripts for non-unique answers test properties of the submitted
      object, but they cover a minority of problems, of unstated size.
    source: src-arxiv-2411-04872-v7
    quote: In all other cases, a custom verification script is necessary to check validity of a
      submitted answer
  - term: execution-tests
    reason: The submitted answer() function is run, but only to obtain the mathematical object that
      is then verified; no test suite judges program behaviour.
    source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
    quote: For each FrontierMath question, the model needs to submit a Python function answer() that
      returns the answer.
  - term: formal-proof-check
    reason: No proof is checked; that is frontiermath-erdos's method.
  - term: numeric-tolerance-match
    reason: No tolerance is stated; real answers are checked symbolically, by a difference that
      simplifies to 0.
    source: src-arxiv-2411-04872-v7
    quote: it uses SymPy evaluation to check that the difference between the submitted answer and
      the actual answer simplifies to 0
designed_for_subjects:
  - model-in-benchmark-harness
  - reasoning-model
designed_for_subjects_basis:
  reason: Every model runs inside Epoch's own loop (a stateless Python tool, a submit_answer tool
    and a token budget with a forced-submission threshold), and the model decides when to submit.
    Rows are named per reasoning-effort setting, which the taxonomy gives as reasoning-model's
    FrontierMath example.
  source: src-arxiv-2411-04872-v7
  quote: The interaction continues until either the model submits a correctly formatted final answer
    or reaches the token limit, which we set to 10,000 tokens in our experiments.
designed_for_subjects_considered_and_rejected:
  - term: tool-augmented-model
    reason: The model, not the protocol, ends the exchange by submitting, which is
      model-in-benchmark-harness.
  - term: agent-scaffold
    reason: Epoch's loop is applied identically to every model. OpenAI's own runs with an internal
      scaffold (as_used) and Google DeepMind's agentic system are observed subjects, not the design.
    source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
    quote: might be due to OpenAI evaluating with a more powerful internal scaffold, using more
      test-time compute
observed_subjects:
  values:
    - reasoning-model
    - agent-scaffold
  basis: Beside Epoch's runs of models in its own loop, results on the benchmark come from systems
    that bring their own loop. AI co-mathematician, Google DeepMind's agentic workbench, reports 48%
    on Tier 4, and OpenAI ran o3 itself, possibly in a stronger internal scaffold.
  source: src-arxiv-2605-06651
as_used:
  - protocol: OpenAI's own evaluation of o3 for its December 2024 announcement, which Epoch did not
      run, possibly with a stronger internal scaffold and more test-time compute.
    split: the FrontierMath_11-26-24 snapshot (180 problems)
    source: src-epoch-frontiermath-tiers-about
    quote: claimed a 25.2% score on this version of the benchmark
    note: Epoch's own figures are on the 290-problem 2025-02-28 private set, so the two numbers are
      on different versions, by different evaluators and harnesses.
  - protocol: AI co-mathematician, Google DeepMind's agentic mathematics workbench, scored on Tier
      4.
    split: Tier 4, version not stated (May 2026, before v2)
    source: src-arxiv-2605-06651
    quote: scoring 48% on FrontierMath Tier 4, a new high score among all AI systems evaluated
    note: Epoch's transparency page lists a 2026 collaboration with Google DeepMind evaluating the
      AI co-mathematician on FrontierMath (governance), so the run was probably Epoch's, on
      commission; the abstract names no version.

lifecycle: active
lifecycle_basis:
  reason: Epoch keeps producing results on v2 and fits both v2 tiers into its capabilities index,
    and a May 2026 paper reports a new Tier 4 result. The v2 reissue is complete, and the error
    bounty closed on 2026-09-22, so the content is not under revision.
  source: src-epoch-benchmark-data
  quote: FrontierMath-Tiers-1-3-v2-Private,True,frontiermath_tiers_1_3_v2.csv,Best score (across
    scorers),1.0,0.0,1.0,2026-06-12,
activity: no-submission-channel
activity_basis:
  reason: Epoch chooses, runs and publishes every evaluation on the private sets; no source offers
    outsiders a route to submit a model or a result. The taxonomy gives FrontierMath as the term's
    example.
  source: src-epoch-frontiermath-tiers-about
  quote: Epoch AI retains the right to conduct and publish evaluations using the full FrontierMath
    dataset.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: o1-preview
    source: src-arxiv-2411-04872-v7
    observed_on: 2026-11-09
    quote: 'We evaluated six leading language models on our existing subset of FrontierMath problems:
      o1-preview (OpenAI 2024b)'
  - system: GPT-5.2 Pro
    source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
    observed_on: 2026-11-09
    quote: Only GPT-5.2 Pro and GPT-5.2 (high) got the corrected problem right.
  - system: AI co-mathematician (Google DeepMind)
    source: src-arxiv-2605-06651
    observed_on: 2026-11-09
    quote: scoring 48% on FrontierMath Tier 4, a new high score among all AI systems evaluated
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each problem's answer and verification script were written by its author
  and checked in peer review; Epoch holds them, and OpenAI holds most of them as well (governance).
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The scored problems are unpublished and only Epoch runs them; the twelve public problems
    are outside every headline figure. OpenAI holds most statements and solutions but is an
    evaluated party, not an independent reproducer.
  source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
  quote: Unless stated otherwise, all the numbers on this hub correspond to evaluations on the
    private sets.

task:
  exists: true
  input:
    - a natural-language mathematics problem with its answer type (an integer, a SymPy object, a
      tuple and so on)
    - a stateless Python tool with a fixed package list (SymPy, NumPy, SciPy, mpmath, gmpy2, galois,
      networkx, pyadic), 30 seconds per call
  output: The code of a Python function answer() that takes no parameters and returns the answer.
  scoring: The returned object is verified against the author's answer (exact match, SymPy
    equivalence or a custom check); a correct answer scores 1, a wrong or missing one 0. Accuracy is
    reported per tier, on the private problems, with a standard error.
  tests_hidden_from_system: true
  source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
  quote: For each FrontierMath question, the model needs to submit a Python function answer() that
    returns the answer.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: >
    Public: twelve problems with solutions (ten from Tiers 1-3 and two from Tier 4 in v2; in v1 the splits
    frontiermath-2025-02-28-public and frontiermath-tier-4-2025-07-01-public), and the paper's five 2024
    samples; none enters a headline figure. Withheld: every other problem and its answer, which Epoch
    holds and evaluates itself. OpenAI, which commissioned the problems, has every statement and solution
    up to FrontierMath_12-04-24 and those of the 300-problem core apart from 53 solutions withheld for
    holdout evaluation, and 30 of the 50 Tier 4 problems, the other 20 being held out. No source read
    says what OpenAI holds of v2. The taxonomy gives FrontierMath as private-test-server's example.
  access_basis:
    reason: The items behind every headline figure never leave Epoch, which runs every evaluation.
    source: src-epoch-frontiermath-tiers-1-4
    quote: A benchmark of several hundred unpublished, highly challenging mathematics problems.
  refresh: versioned-releases
  refresh_note: The set grew through snapshots Epoch names by date (versions), and the corrected
    reissue is v2; an in-place fix on 2026-01-23 (two Tier 4 problems re-graded or corrected, scores
    adjusted) is a dated erratum on the v1 hubs. Epoch keeps a separate hub page, score file and
    capabilities-index input for each version and tier.
  refresh_basis:
    reason: Every change is carried by a dated snapshot or a labelled version with a dated
      announcement, so a claim can name the state it was measured on.
    source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
    quote: On 2026-06-12, we released a major update, addressing errors in 42% of problems.
  data_provenance:
    - expert-authored
  data_provenance_note: Mathematicians from graduate students to faculty wrote each problem with its
    solution, a verification script and difficulty ratings, and each went through blind peer review.
    The Tier 4 writers were mostly professors and postdocs, each contracted for a several-week
    project. OpenAI commissioned the problems (300 for the core and 50 for Tier 4).
  data_provenance_basis:
    reason: The authors are practising mathematicians writing new problems in their own fields.
    source: src-arxiv-2411-04872-v7
    quote: collaboration with over 60 mathematicians from universities across more than a dozen
      countries
  contamination_risk: medium
  contamination_risk_note: >
    The structure works against a public training route: the scored problems were never published, were
    exchanged over encrypted channels and were screened for originality, and the twelve public problems
    are outside every headline figure. Two routes remain plausible and unevidenced. OpenAI, an evaluated
    developer, holds most statements and solutions, and the paper concedes that plain e-mail was used
    for some problems; and every API evaluation sends the problems to the model's provider. No source
    evidences that any model trained on the problems, so medium, not high; the Stage-3 record had low
    (review_checks).
  contamination_evidence:
    - source: src-epoch-frontiermath-tiers-about
      stance: supports
      quote: They have access to all problem statements and solutions up to FrontierMath_12-04-24,
        except for 53 solutions randomly withheld in version FrontierMath_02-28-25 for holdout
        evaluation.
    - source: src-arxiv-2411-04872-v7
      stance: supports
      quote: standard email clients were used when communicating about a subset of the problems
        outside our immediate team
    - source: src-arxiv-2411-04872-v7
      stance: against
      quote: FrontierMath uses new, unpublished problems and automated verification to reliably
        evaluate models while minimizing risk of data contamination.
    - source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
      stance: against
      quote: Unless stated otherwise, all the numbers on this hub correspond to evaluations on the
        private sets.
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: The headline is the share of a tier's private problems solved, bounded
    at 100%. No source states that every item is solvable; v1's errors are the reason v2 exists.
    Epoch's export gives v1 measured ceilings of 0.57 (Tiers 1-3) and 0.6 (Tier 4), and 1.0 for v2,
    which no source read explains (review_checks). The MIT human competition is below the bound and
    goes to ceiling_by_category.
  ceiling_anchor_type_source: src-arxiv-2411-04872-v7
  ceiling_anchor_type_quote: Current state-of-the-art AI models solve under 2% of problems
  ceiling_by_category:
    - category: Tiers 1-3, a 23-problem subset, teams of four or five strong undergraduates and
        subject experts over four and a half hours (average team)
      value: 19
      metric: problems solved (%)
      source: src-epoch-frontiermath-tiers-about
      quote: On a subset of 23 tier 1-3 problems, the average team scored 19%, while 35% of the
        problems were solved collectively across all teams.
  dataset_licence: null
  dataset_licence_note: The scored problems are unpublished and carry no licence. The public
    problems' page is disallowed by robots.txt and was not read; the paper (v7) is CC-BY-4.0, which
    does not cover the private set.
  size:
    - count: 338
      unit: problems
      subset: v2, both tiers (twelve public)
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
      quote: Following this update, the full FrontierMath dataset consists of 338 problems.
    - count: 295
      unit: problems
      subset: Tiers 1-3, v2
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
      quote: This is split into a base set of 295 problems, which we call Tiers 1-3, and an
        expansion set of 43 exceptionally difficult problems, which we call Tier 4.
    - count: 43
      unit: problems
      subset: Tier 4, v2
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
      quote: This is split into a base set of 295 problems, which we call Tiers 1-3, and an
        expansion set of 43 exceptionally difficult problems, which we call Tier 4.
    - count: 12
      unit: public problems (ten from Tiers 1-3, two from Tier 4)
      subset: v2
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
      quote: 'We have made twelve problems public: ten from Tiers 1-3 and two from Tier 4.'
    - count: 350
      unit: problems (300 in Tiers 1-3, 50 in Tier 4)
      subset: v1 (2025-02-28 and 2025-07-01)
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
      quote: The full FrontierMath dataset contains 350 problems.
    - count: 290
      unit: private problems
      subset: Tiers 1-3, v1 (frontiermath-2025-02-28-private)
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
      quote: The remaining 290 problems make up frontiermath-2025-02-28-private.
    - count: 48
      unit: private problems
      subset: Tier 4, v1 (frontiermath-tier-4-2025-07-01-private)
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
      quote: we have made 2 problems from Tier 4 public, calling this
        frontiermath-tier-4-2025-07-01-public, while the remaining 48 problems make up
        frontiermath-tier-4-2025-07-01-private.
    - count: 119
      unit: problems
      subset: FrontierMath_10-22-24, the set the 2024 paper analysed
      source: src-epoch-frontiermath-tiers-about
      quote: 'FrontierMath_10-22-24: Includes 119 questions. This version of the benchmark was analyzed
        in our arXiv paper.'
  size_note: No source read states the private counts of v2; 295 and 43 less the ten and two public
    problems would give 285 and 41, which is arithmetic, not a quote.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Epoch AI
  maintainer_basis:
    reason: Epoch's authors wrote the paper, Epoch hosts the benchmark's pages and hub, and the
      paper commits Epoch to maintaining it and evaluating models on it.
    source: src-arxiv-2411-04872-v7
    quote: At Epoch AI, we are committed to maintaining FrontierMath as a public resource and
      regularly conducting comprehensive evaluations of leading models.
  maintainer_type: nonprofit
  maintainer_type_source: src-epoch-about
  maintainer_type_quote: Epoch AI is a data-first research nonprofit investigating the future of
    artificial intelligence.
  submission_process:
    - maintainer-run
  submission_process_note: Epoch selects the models, runs them in its own loop and publishes the
    results on its hub, taking each model's best score across settings into the capabilities index.
    OpenAI's announced figures come from its own runs, which Epoch did not run (as_used).
  submission_process_source: src-epoch-benchmarks-frontiermath-tiers-1-3-v1
  submission_process_quote: 'It is also not the methodology used by OpenAI in their own FrontierMath evaluations,
    such as for the o3 and o3-mini models: we were not involved in running these evaluations.'
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
      quote: FrontierMath was developed with funding from OpenAI, who has exclusive access to a
        subset of the benchmark.
    - flag: single-evaluator-private-test-set
      source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
      quote: Unless stated otherwise, all the numbers on this hub correspond to evaluations on the
        private sets.
    - flag: evaluator-sells-evaluations
      source: src-epoch-about
      quote: We offer mission-aligned services to companies, nonprofits, and government bodies,
        including commissioned research, model evaluations, and consultations.
  independence_flags_note: >
    OpenAI funded the benchmark and commissioned its problems, holds most statements and solutions (the
    conflict-of-interest statement; data.access_note), and its models are evaluated from the paper's o1-preview
    to the hub's GPT-5.2 Pro. Epoch's transparency page lists OpenAI's support for developing the benchmark
    (2024/25), a 2026 FrontierMath Data Audit, the period of the v2 corrections, and a 2026 verifier for
    the open-problems component, and a 2026 Google DeepMind collaboration evaluating the AI co-mathematician
    on FrontierMath, whose Tier 4 score the co-mathematician paper reports. Epoch sells model evaluations.
    The vocabulary has no flag for an evaluated party that holds the items and answers; that gap is logged
    (taxonomy/_failures). Epoch keeps holdouts from OpenAI and the right to publish on the full set (independence_policy).
    single-evaluator-private-test-set is set because Epoch alone publishes scores on the private sets,
    though OpenAI can also run its own.
  independence_assessed: true
  funding:
    source: src-epoch-frontiermath-tiers-1-4
    quote: This project is supported by OpenAI.
  independence_policy:
    source: src-epoch-frontiermath-tiers-about
    quote: Additionally, OpenAI has access to 30 of the 50 Tier 4 problems, with the remaining 20
      reserved as a holdout set.
  known_limitation:
    source: src-arxiv-2411-04872-v7
    quote: the practical focus on automatically verifiable and numerical answers excludes
      proof-writing and open-ended exploration

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: One run of a model is inference spend over every private problem in a tier, up
    to the 1,000,000-token limit per problem; the Python tool and the answer() check run on ordinary
    hardware.
  compute_tier_basis:
    reason: Epoch evaluates models through their providers and takes each model's best score across
      settings and providers.
    source: src-epoch-eci-included-benchmarks
    quote: we aggregate across model evaluation settings (e.g. thinking effort and inference
      provider), taking the highest score for each benchmark
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only Epoch holds the scored problems and runs them; the taxonomy gives FrontierMath as
      the term's example.
    source: src-epoch-benchmarks-frontiermath-tiers-1-3-v2
    quote: Unless stated otherwise, all the numbers on this hub correspond to evaluations on the
      private sets.
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness: Epoch's Inspect AI solver and scorer (agent.py, scorer.py, a Dockerfile, compose.yaml and
    the package list), published as a gist that the hub pages link
  harness_note: The code imports Epoch's internal bench package, so it does not run on its own, and
    it ships no problems; its default token limit (100,000, forced submission at 66,000) is below
    the hub prompt's 1,000,000. The sandbox has no network (network_mode none). The gist sits under
    an individual's personal account (src-github-gist-epoch-frontiermath).
  harness_basis:
    reason: The published code shows the loop and the scorer but cannot produce an official score,
      which needs the private problems and Epoch's internal package.
    source: src-github-gist-epoch-frontiermath
    quote: from bench import PROJECT_ROOT
  code_licence: null
  code_licence_note: The gist states no licence.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # (exact-match, reasoning-model) and (symbolic-equivalence, reasoning-model) resolve to llm-static-text; the pairs
  # with model-in-benchmark-harness resolve to the fallback. Beyond them: the benchmark version and tier (subset_used,
  # with the claim's version), Epoch's loop and its version (harness; the paper's loop differs from the hub's), the
  # token limit (10,000 in the paper, 1,000,000 on the hub, 100,000 in the gist), the sandbox, an entrant's own
  # scaffold (OpenAI's o3 runs, AI co-mathematician), the number of runs and Epoch's best-across-settings selection.
  material_extra:
    - harness
    - scaffold
    - token_limit
    - sandbox
    - n_samples
    - selection_strategy


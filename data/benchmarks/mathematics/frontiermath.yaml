lineage_note: >
  Epoch calls FrontierMath a programme of three components: Tiers 1-4 (this entry), Open Problems (open
  research problems with computationally verifiable solutions, no allocated id, not read here) and a curated
  set of open conjectures to be proved or disproved in Lean, which has its own allocated id and stub,
  frontiermath-erdos. That component shares the maintainer and the name but not the task or the scoring,
  so it is recorded as a variant rather than a subset. Tiers 1-3 and Tier 4 are subsets, and the dated
  snapshots and v2 are versions, not variants (04 S4). No fork by another maintainer appears in any source
  read.
lineage_source: src-epoch-frontiermath-home
lineage_quote: 'It has three components: FrontierMath Tiers 1-4, a benchmark of difficult problems authored
  by mathematicians; Open Problems, a broad collection of significant open research problems;'

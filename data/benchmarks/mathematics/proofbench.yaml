# data/benchmarks/mathematics/proofbench.yaml
#
# P1-S10-T06, mathematics entry 10. Promotes the Epoch stub data/benchmarks/_stubs/proofbench.yaml. The identity was
# pinned from Epoch's side first: Epoch AI's benchmark page for ProofBench names Vals AI as its creator and links Vals'
# ProofBench board, and Epoch's benchmark export lists ProofBench in its capabilities index. Then filled from Vals AI's
# two version pages (v1.1, the current board, updated 2026-10-29; v1, archived, updated 2026-08-05), both
# server-rendered and read with scripts and styles stripped; the paper, which calls the benchmark FormalProofBench,
# arXiv 2603.26996 read as its v1 PDF (2026-03-27, ICLR 2026 workshop) and its abstract page, whose comments line
# links Vals' board; and the README of the harness repository vals-ai/proof-bench at commit 01cc296. Vals AI's
# methodology page, already a Source of the Finance Agent entry, is cited for Vals' fixed-harness and private-test-set
# rules. GitHub's API was read for the repository's licence, dates and file tree (not a quoted Source). Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is Vals AI's Lean 4 benchmark. Other benchmarks share the name and are not this one: UC Berkeley's
# ProofBench (arXiv 2510.13888), expert ratings of natural-language proofs for evaluating proof graders;
# MA-ProofBench (arXiv 2606.13782, OpenBMB on GitHub), a Lean benchmark in mathematical analysis; and Google DeepMind's
# IMO-ProofBench, natural-language olympiad proofs. None is cited by or derived from this benchmark, so no lineage is
# recorded (review_checks).

id: proofbench
name: ProofBench
aliases:
  - FormalProofBench
  - Vals AI ProofBench
tagline: Graduate-level theorems with vetted Lean 4 statements; a model in Vals' tool harness must
  write a proof Lean accepts.
description: >
  A Vals AI benchmark of formal theorem proving at the advanced undergraduate and graduate level, described
  in the paper as FormalProofBench. Each problem pairs a natural-language theorem statement with a Lean
  4 formalisation that a team of experienced Lean users (PhD students and domain experts) wrote and a
  second reviewer checked, drawn from qualifying exams and standard textbooks in real and functional analysis,
  probability and stochastic analysis, measure theory, algebra and commutative algebra, algebraic geometry,
  number theory, linear algebra, and logic and model theory. No informal proof is given. The model works
  inside Vals' own agent harness for up to 40 turns, with a Mathlib search tool (Loogle), a Lean execution
  tool and a submit tool, and a problem counts only if the submitted proof compiles in the pinned Lean
  4.25.2 and Mathlib environment without sorry, admit or added axioms; scoring is binary with no partial
  credit. There are 200 problems in two splits of 100; the board scores the private test split, and only
  two sample problems and the harness are public. Vals runs every model itself, plus two outside formal-maths
  systems (Harmonic's Aristotle and Logical Intelligence's AlephProver) in their own harnesses. v1 (from
  January 2026) was superseded by v1.1, which corrected formalisation defects and hardened the grader,
  and whose scores are not comparable with v1's. The paper's best model scored 33.5% on all 200 problems;
  the v1 board's top score was 78% in August 2026, and on v1.1 four entries reach 100% (October 2026).
self_description:
  source: src-arxiv-2603-26996
  quote: We present FormalProofBench, a private benchmark designed to evaluate whether AI models can
    produce formally verified mathematical proofs at the graduate level.
external_ids:
  epoch: ProofBench
  arxiv: '2603.26996'
paper:
  title: 'FormalProofBench: Can Models Write Graduate Level Math Proofs That Are Formally Verified?'
  arxiv: '2603.26996'
  version_read: v1
  source: src-arxiv-2603-26996-v1
released: 2026-01-30
released_note: Epoch's export date for the benchmark, which the stub carries. No Vals source read
  dates the board's launch; the paper followed on arXiv on 2026-03-27 and the harness repository was
  created on 2026-03-11 (GitHub API).
released_source: src-epoch-benchmark-data
released_quote: ProofBench,True,proofbench_external.csv,Accuracy,1.0,0.0,1.0,2026-01-30,
release_venue: 'ICLR 2026 Workshop: VerifAI-2'
release_venue_source: src-arxiv-2603-26996
release_venue_quote: 'Accepted at ICLR 2026 Workshop: VerifAI-2: The Second Workshop on AI Verification
  in the Wild.'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: mathematics/formal-theorem-proving
domain_basis:
  reason: The system must produce a proof of a mathematical statement that the Lean 4 checker
    accepts, which is the leaf's inclusion test; Epoch's page says the same.
  source: src-epoch-benchmarks-proofbench
  quote: ProofBench, created by Vals AI with a team of Lean 4 experts, measures formal theorem
    proving
domain_considered_and_rejected:
  - term: mathematics/proof-verification
    reason: Nothing is handed to the system to judge; it writes the proof itself and Lean judges it.
      The UC Berkeley ProofBench, a set of expert ratings of natural-language proofs for testing
      proof graders, would sit here, which is one reason the two must not be merged.
    source: src-vals-ai-proof-bench
    quote: Given both, a model must construct a formal proof that is accepted by the Lean proof
      checker.
  - term: mathematics/research-level-math
    reason: The problems are graduate exercises from textbooks and qualifying exams with known
      proofs; the paper names research-level theorems as a future direction, not the current set.
    source: src-arxiv-2603-26996-v1
    quote: 'Evaluating research-level formal theorem proving: While FormalProofBench considers advanced
      undergraduate and graduate level mathematics'
  - term: mathematics/competition-math
    reason: The problems were chosen to go beyond olympiad and high-school contest material, and no
      determinate answer is checked, only a proof. This is not a natural-language proof graded by
      people or a judge either, which neither formal proving nor verification would take.
    source: src-arxiv-2603-26996-v1
    quote: Problems that required knowledge beyond olympiad-style / high-school style questions.
  - term: code/program-verification
    reason: The output is Lean code, but the property proved belongs to a mathematical statement,
      not to a program; formal-theorem-proving's not_to_be_confused_with note decides by the subject
      of the proof.
  - term: agents-tooluse/tool-api-calling
    reason: The model calls search, execution and submit tools over up to 40 turns, but the score is
      whether the submitted proof compiles; how the tools were used is reported, not scored.
    source: src-vals-ai-proof-bench
    quote: Models work inside the ProofBench harness, whose tools are Mathlib search and Lean
      execution
capability:
  - deductive-reasoning
  - tool-use
capability_basis:
  deductive-reasoning:
    reason: A proof counts exactly when Lean accepts it, so correctness is decided from the formal
      statement and the system's rules alone.
    source: src-epoch-benchmarks-proofbench
    quote: Because proofs are checked by the Lean 4 compiler rather than a judge, scores reflect
      fully verified formal correctness.
  tool-use:
    reason: Some problems were included because their proofs rest on recently added Mathlib
      theorems, to test looking them up with the search tool, and a proof is graded only if the
      model submits it through the submit tool; the v1.1 page attributes the lowest scores to models
      that never submit.
    source: src-arxiv-2603-26996-v1
    quote: 'we include these problems to test a crucial capability for real-world formalization: reliably
      looking up relevant theorems'
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: Knowing Mathlib's lemmas matters, but the search tool is supplied so that recall is not
      the bottleneck, and the scored artifact is a derivation.
  - term: self-correction
    reason: Models iterate on compiler feedback within the 40 turns, but only the one submitted
      proof is scored; no improvement is measured.
    source: src-vals-ai-proof-bench
    quote: A proof is graded only if the model calls submit_proof
  - term: long-horizon-execution
    reason: Episodes run to 40 turns and can take an hour, but each problem is scored on its final
      proof and failed attempts are recoverable inside the episode.
    source: src-vals-ai-proof-bench
    quote: Models are allowed up to 40 interaction turns per problem

evaluation_method:
  - formal-proof-check
evaluation_method_basis:
  reason: The Lean 4 kernel accepts or rejects each submitted proof, and the grader also rejects
    proofs that rest on disallowed axioms; no judge or person grades correctness.
  source: src-arxiv-2603-26996-v1
  quote: A solution is considered valid if and only if the model calls submit_proof with a proof
    that successfully passes the Lean 4 kernel.
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: Experts wrote and reviewed the statements; no score comes from them.
    source: src-arxiv-2603-26996-v1
    quote: Unlike informal mathematics benchmarks, FormalProofBench provides a binary and fully
      automated correctness signal
  - term: model-graded-judge
    reason: No model grades anything; the Lean checker and an axiom check decide.
    source: src-epoch-benchmarks-proofbench
    quote: Because proofs are checked by the Lean 4 compiler rather than a judge, scores reflect
      fully verified formal correctness.
designed_for_subjects:
  - model-in-benchmark-harness
  - agent-scaffold
designed_for_subjects_note: model-in-benchmark-harness is the design and almost every row;
  agent-scaffold covers the two formal-maths systems Vals runs in their own harnesses, Aristotle
  (with web search, under Lean 4.28) and AlephProver (helper lemmas allowed, the board's own
  toolchain), which the board ranks beside the models and Epoch stores but does not chart.
designed_for_subjects_basis:
  reason: Vals runs every model in its own loop with one prompt and one toolset, and each row names
    only the model; the methodology page states the purpose of the fixed harness. The outside
    systems bring their own loop, which is agent-scaffold's inclusion test.
  source: src-vals-ai-methodology
  quote: Models are called through a fixed harness that we control, so that differences in scores
    reflect the model rather than the scaffold.
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: Each model is run at one reasoning-effort setting Vals chooses (the paper used each
      provider's default sampling settings); the effort is a condition of the claim, not a design
      requirement.
    source: src-epoch-benchmarks-proofbench
    quote: Each model appears once at a fixed reasoning-effort configuration chosen by Vals AI.
  - term: task-specific-supervised-model
    reason: The provers miniF2F's and PutnamBench's entries are tagged for are not what the board
      runs; its rows are general frontier models, with two dedicated formal-maths systems
      (agent-scaffold).
  - term: tool-augmented-model
    reason: The model decides its own tool calls and when to submit within the turn budget, which
      the term's exclusion sends to model-in-benchmark-harness.
as_used:
  - protocol: The paper's evaluation on all 200 problems (both splits) rather than the private test
      split alone, with the same harness, tools and 40-turn limit.
    split: both splits (200 problems)
    source: src-arxiv-2603-26996-v1
    quote: Table 1 presents the distribution of the 200 benchmark problems across these areas.
    note: The paper's numbers (Claude Opus 4.5 (Thinking) 33.5%) are not the v1 board's, which
      scores the private 100 (Claude Opus 4.5 (Thinking) 36.00% there).
  - protocol: Epoch AI carries Vals' leaderboard accuracy in its capabilities index, one row per
      model at Vals' reasoning-effort setting, with Aristotle stored but not charted.
    source: src-epoch-benchmarks-proofbench
    quote: We source results from the public Vals AI ProofBench leaderboard.
    note: Epoch's export carries no version column, so which rows are v1 and which v1.1 is not
      recorded (review_checks).

lifecycle: active
lifecycle_basis:
  reason: Vals keeps running new models on v1.1 and updated the board on 2026-10-29; Epoch's export
    carries the benchmark in its capabilities index. v1 is archived, which is version standing
    within an active benchmark.
  source: src-vals-ai-proof-bench
  quote: As of October 29, 2026, 4 models tie for first on ProofBench with 100.00%
activity: no-submission-channel
activity_note: Vals chooses the models and runs them. AlephProver was evaluated because its makers
  gave Vals access, which is a private arrangement rather than a channel; no page read offers a
  route for entering a model or result.
activity_basis:
  reason: Every published score is Vals' own run on its private split, including the two outside
    systems, which Vals drove itself.
  source: src-vals-ai-proof-bench
  quote: Logical Intelligence provided access for this evaluation

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude Sonnet 5.5
    source: src-vals-ai-proof-bench
    observed_on: 2026-11-09
    quote: 1 Claude Sonnet 5.5 100.00%
  - system: Aristotle (Harmonic)
    source: src-vals-ai-proof-bench
    observed_on: 2026-11-09
    quote: 14 Aristotle 86.00%
    note: Run in Harmonic's own harness, with web search on, against Lean 4.28.
  - system: Claude Opus 5
    source: src-vals-ai-proof-bench-v1
    observed_on: 2026-11-09
    quote: As of August 5, 2026, Claude Opus 5 ranks first on ProofBench v1 with 78.00%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: formal-verifier
ground_truth_source_note: No reference proofs are used in scoring; Vals collected natural-language
  proofs but does not give them to models on the board. The Lean kernel's verdict, with the axiom
  check, is the truth.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The harness is public and Lean is open, but every published score is on a split only Vals
    holds; anyone can run the harness on the two sample problems, which gives no comparable number.
  source: src-github-vals-proof-bench-readme
  quote: The folder only has sample problems; the rest of the benchmark is private.

task:
  exists: true
  input:
    - a natural-language theorem statement (no informal proof) and its Lean 4 formal statement with
      the necessary imports and context
    - Vals' system prompt and tools for Mathlib search (lean_loogle), Lean execution with feedback
      (lean_run_code) and one final submission (submit_proof), over up to 40 turns
  output: A Lean 4 proof (the part starting with 'by') submitted once through submit_proof; the
    outside systems return a whole Lean file with the sorry filled.
  scoring: Binary per problem. A proof counts if it passes the Lean kernel in the pinned environment
    and the axiom check (#print axioms) shows nothing disallowed (sorry, admit, added axioms; the
    paper also rejects axiom and local_instance). The board reports accuracy over the 100 private
    problems, with cost, tokens and duration per test beside it; a model that never submits scores
    zero on the problem.
  metric_range:
    - 0
    - 100
  source: src-vals-ai-proof-bench
  quote: 'every accepted submission is checked with #print axioms'

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: "Public: the paper, its two sample problems with model responses, the harness and prompts
    (vals-ai/proof-bench, which holds the same two samples with their informal statements and proofs),
    and the board's rows, tool-use statistics and two worked examples. Not released: the 100-problem public
    split the pages describe (the README and the paper call the rest of the benchmark private) and the
    100-problem private test split behind every score. Vals runs every evaluation itself."
  access_basis:
    reason: Every score Vals publishes is computed by Vals on a split that is not released, which
      private-test-server's inclusion test covers.
    source: src-vals-ai-methodology
    quote: 'Test Set: This dataset remains private at all times, and is the only dataset used for the
      proprietary benchmark results we publish.'
  refresh: versioned-releases
  refresh_basis:
    reason: The change to items and grader came under a labelled version (1 to 1.1), each with its
      own page and board, and v1.1 says its scores are not comparable with earlier revisions.
    source: src-vals-ai-proof-bench
    quote: Published results are from version 1.1 of the benchmark. Scores are not comparable with
      results published against earlier revisions.
  data_provenance:
    - expert-authored
    - exam-derived
  data_provenance_note: Six formalizers, PhD students or experts with Mathlib contributions or large
    formalisation work behind them, chose the problems from qualifying exams and standard textbooks
    and wrote the Lean statements and natural-language proofs; each was reviewed on GitHub by
    someone other than its author. The textbook exercises are adapted rather than set as exams;
    exam-derived covers the qualifying-exam share, which no source sizes.
  data_provenance_basis:
    reason: The statements and proofs were written for the benchmark by experienced Lean users, from
      existing exam and textbook problems.
    source: src-arxiv-2603-26996-v1
    quote: Problems were selected and formalized by a total of six formalizers who were PhD students
      or experts experienced in writing Lean 4 code.
  data_provenance_source: src-vals-ai-proof-bench
  data_provenance_quote: Problems are drawn from advanced undergraduate and graduate-level sources,
    including qualifying exams and standard textbooks.
  contamination_risk: medium
  contamination_risk_note: The Lean formalisations are private and were written for the benchmark,
    which works against direct contamination, and the maintainers say so. But the problems are
    exercises from standard textbooks and qualifying exams whose informal solutions may be public,
    every run sends the private statements to the provider serving the model, and Aristotle searched
    the web during its run on 60 of the 100 problems. No source reports contamination.
  contamination_evidence:
    - source: src-arxiv-2603-26996-v1
      stance: against
      quote: The benchmark is kept private to prevent data contamination.
    - source: src-arxiv-2603-26996-v1
      stance: against
      quote: contamination resistance, as the specific Lean formalizations we created are unlikely
        to appear in training data
    - source: src-vals-ai-proof-bench
      stance: supports
      quote: We verified that Aristotle searched the web on 60 of 100 problems.
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: The headline is the share of 100 problems proved, bounded at 100%, which four entries
      reached on v1.1; no human baseline is published.
    source: src-vals-ai-proof-bench
    quote: As of October 29, 2026, 4 models tie for first on ProofBench with 100.00%
  dataset_licence: null
  dataset_licence_note: No licence is given for the items. The scored split is private; the
    repository's two samples sit in a repository with no licence (GitHub API, read 2026-11-09). The
    board pages' schema.org record gives CC BY 4.0 for the leaderboard data, which is results, not
    items (outside the extracts).
  size:
    - count: 100
      unit: problems
      subset: private test split, on which every board score is computed
      source: src-vals-ai-proof-bench
      quote: 'The benchmark consists of two splits: a public split and a private test split, each containing
        100 problems.'
    - count: 100
      unit: problems
      subset: public split (not released beyond two samples)
      source: src-vals-ai-proof-bench
      quote: 'The benchmark consists of two splits: a public split and a private test split, each containing
        100 problems.'
    - count: 200
      unit: problems, both splits (the paper's evaluation set)
      subset: all problems
      source: src-arxiv-2603-26996-v1
      quote: Table 1 presents the distribution of the 200 benchmark problems across these areas.
  size_note: The paper's Table 1 splits the 200 problems as real analysis 56, probability and
    stochastic analysis 34, functional analysis 26, number theory 23, logic and model theory 21,
    algebra 18, algebraic geometry 15 and linear algebra 7. No source gives the private split's mix
    or says whether v1.1's corrections changed the count.
  languages:
    - Lean 4
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Vals AI, Inc.
  maintainer_basis:
    reason: Epoch names Vals AI as the creator; Vals hosts the board and its version pages, holds
      the private split and the harness repository (vals-ai on GitHub), and its staff wrote the
      paper with outside formalizers.
    source: src-epoch-benchmarks-proofbench
    quote: ProofBench, created by Vals AI with a team of Lean 4 experts, measures formal theorem
      proving
  maintainer_type: industry-lab
  maintainer_type_note: Vals AI builds and runs evaluations and calls itself an independent
    evaluator (the Finance Agent entry's Sources); the formalizers came from universities and
    independent work.
  submission_process:
    - maintainer-run
  submission_process_note: Vals selects the models and runs each once, at the settings the model's
    owner supplied, in its harness on the private split, and publishes accuracy with cost, tokens,
    latency and tool-use statistics. It also drove the two outside systems' runs itself; AlephProver
    was run twice, at the budgets its makers first set and again at the larger ones they asked for,
    and the second run is reported.
  submission_process_source: src-vals-ai-proof-bench
  submission_process_quote: Every other entrant on this board was run once, at the settings its
    owner supplied.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-vals-ai-methodology
      quote: 'Test Set: This dataset remains private at all times, and is the only dataset used for the
        proprietary benchmark results we publish.'
  independence_flags_note: Vals builds no evaluated model, so maintainer-competes is not set. The
    grader is Lean, not a model, so grader-from-evaluated-party does not arise. AlephProver's makers
    supplied access and asked for the re-run at higher budgets that Vals reports, which is an
    evaluated party shaping its own run; no flag covers it (review_checks). No source read states
    the paper's funding.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is calls to the model's API plus Lean compilation in a sandbox on ordinary CPU;
      the paper puts a problem's evaluation at minutes to hours.
    source: src-arxiv-2603-26996-v1
    quote: practical evaluation costs, with per-problem evaluation completing in minutes to hours
      rather than days
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline scores are on a split only Vals holds, which the tier's inclusion test
      covers.
    source: src-github-vals-proof-bench-readme
    quote: The folder only has sample problems; the rest of the benchmark is private.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness_availability_note: The repository holds the agent loop, the three tools, attempt execution
    and aggregation, and a pinned Lean toolchain, and the paper says all harness code is released;
    the board's v1.1 grader rules (axiom check, native_decide accepted) are stated on the page, and
    whether the repository at 01cc296 implements them was not read.
  harness: vals-ai/proof-bench (Lean 4.25.2, Mathlib at c98ae54 in the paper; the board's sandbox
    pins the same toolchain)
  harness_source: src-arxiv-2603-26996-v1
  harness_quote: We use Lean v4.25.2 and Mathlib (at commit
    c98ae54af00eaefe79c51b2b278361ca94e59bfb).
  code_licence: null
  code_licence_note: The repository has no licence file and GitHub's licence metadata is null (API,
    read 2026-11-09), so the code is not licensed for reuse; the README states none.
  runnable_via:
    - custom
  inspect_evals_id: null
  inspect_evals_id_note: Not reconciled against UK AISI's inspect_evals for this entry.
  maintainer_rerun_policy: unstated

comparability:
  # (formal-proof-check, model-in-benchmark-harness) and (formal-proof-check, agent-scaffold) have no profile, so
  # the entry resolves to the fallback (subset_used). Beyond it: the version (v1 and v1.1 are not comparable); the
  # harness, its tools and the Lean toolchain and Mathlib revision (Aristotle's proofs are checked under 4.28, the
  # rest under 4.25.2); the scaffold for the outside systems; the reasoning effort Vals fixes per model; the turn
  # limit; and the number of runs (one, two for AlephProver).
  material_extra:
    - harness
    - scaffold
    - tools_allowed
    - reasoning_effort
    - max_steps
    - n_samples

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: One headline, accuracy over the private split, with cost, tokens and duration per test
    beside it.
  source: src-epoch-benchmarks-proofbench
  quote: Scoring is binary per problem with no partial credit
secondary_axes:
  - cost
  - latency
secondary_axes_source: src-vals-ai-proof-bench
secondary_axes_quote: ProofBench leaderboard Rank Model Accuracy Cost / Test Tokens / Test Duration
  / Test

homepage: https://www.vals.ai/benchmarks/proof_bench
repository: https://github.com/vals-ai/proof-bench
leaderboard_url: https://www.vals.ai/benchmarks/proof_bench
maintainer_url: https://www.vals.ai/

versions:
  - version: '1'
    label: ProofBench v1 (v1.0), the paper's release
    version_kind: revision
    released: 2026-01-30
    items: 100
    changes: The first board, on the 100-problem private split, Lean 4.25.2 and the three-tool
      harness; Aristotle was given the full statement file with the natural-language statement as a
      comment. Archived when v1.1 superseded it; the board was last updated on 2026-08-05. The
      released date is Epoch's.
    superseded_by: '1.1'
    frozen: true
    sources:
      - src-vals-ai-proof-bench-v1
      - src-arxiv-2603-26996-v1
      - src-arxiv-2603-26996
      - src-epoch-benchmark-data
  - version: '1.1'
    label: ProofBench v1.1, the current board
    version_kind: revision
    items: 100
    changes: Formalisation defects in the dataset corrected and the grader hardened (every accepted
      proof now checked for disallowed axioms); Aristotle given the statement with the proof left as
      sorry and checked under its own Lean 4.28; AlephProver added. Scores are not comparable with
      v1.
    breaking: true
    supersedes_version: '1'
    errata:
      - scope: grader
        description: An earlier revision of the grader rejected proofs using native_decide; Vals
          reversed this because the instructions forbid only new axioms, and reports v1.1 with it
          accepted. Seven models were affected, on two problems, each by one task.
        source: src-vals-ai-proof-bench
    frozen: false
    sources:
      - src-vals-ai-proof-bench
versions_note: The v1 page's banner gives what v1.1 changed; neither page dates v1.1's release (the
  boards' update dates are 2026-08-05 and 2026-10-29), so its released field is null. Item counts
  are the private split's, which every board score uses; no source says whether the corrections
  replaced any problem.

subsets:
  - id: proofbench#private-test
    label: Private test split
    items: 100
    scored_separately: true
    evidence:
      - source: src-epoch-benchmarks-proofbench
        quote: The leaderboard runs on a private 100-problem split
  - id: proofbench#public
    label: Public split (unreleased beyond two samples)
    items: 100
    scored_separately: false
    evidence:
      - source: src-vals-ai-proof-bench
        quote: 'The benchmark consists of two splits: a public split and a private test split, each containing
          100 problems.'
    notes: No score is published on it alone; the paper's results pool it with the private split.

lineage:
  role: root

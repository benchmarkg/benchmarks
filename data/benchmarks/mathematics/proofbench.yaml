# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T06)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-epoch-benchmarks-proofbench
    - src-epoch-benchmark-data
    - src-vals-ai-proof-bench
    - src-vals-ai-proof-bench-v1
    - src-arxiv-2603-26996-v1
    - src-arxiv-2603-26996
    - src-github-vals-proof-bench-readme
    - src-vals-ai-methodology
  sources_note: >
    Epoch's benchmark page and its export row first, for the identity; Vals AI's two version pages, server-rendered
    and read with scripts and styles stripped (withheld from archiving: their acknowledgements and citation
    name individuals, kept out of the extracts); the paper's v1 PDF and abstract page (DOIs, not archived),
    with the author block, affiliations and references kept out of the windows; the harness README at
    a pinned commit; and Vals' methodology page, the Finance Agent entry's Source. GitHub's API (licence,
    dates, file tree) was read but is not a quoted Source. For the name check only, UC Berkeley's ProofBench
    paper (arXiv 2510.13888, v2 PDF) and MA-ProofBench's abstract page (arXiv 2606.13782) were opened
    and are not cited.
  confidence: medium
  review_checks:
    - check: Identity. Several benchmarks are called ProofBench. This entry is Vals AI's Lean 4
        benchmark, the one Epoch links. Not this one are UC Berkeley's ProofBench (arXiv 2510.13888,
        expert 0-7 ratings of LLM-written natural-language competition proofs, for evaluating proof
        graders, which would be proof-verification), MA-ProofBench (arXiv 2606.13782, OpenBMB, 200
        Lean theorems in mathematical analysis) and Google DeepMind's IMO-ProofBench
        (natural-language olympiad proofs; not read, named from memory of its release), and
        IMProofBench, which the paper cites, is another; MA-ProofBench's organisation is from a
        search result's GitHub path, not from its paper. A reviewer should check that no claim or
        alias from them has been joined to this id.
      field: aliases
      source: src-epoch-benchmarks-proofbench
      quote: ProofBench, created by Vals AI with a team of Lean 4 experts, measures formal theorem
        proving
    - check: Epoch's one string (version null) maps to both Vals versions. Its page describes the
        current board, but its export carries no version column and the September 2026 export may
        predate v1.1's board; v1 and v1.1 scores are not comparable, so Epoch's rows should be split
        by version before use.
      field: external_ids.epoch
      source: src-vals-ai-proof-bench
      quote: Published results are from version 1.1 of the benchmark. Scores are not comparable with
        results published against earlier revisions.
    - check: Saturation. On v1.1 four entries score 100% and four more 99%; saturated is derived and
        needs claims. v1's top was 78% in August 2026, so most of the jump may be the corrected
        items and grader rather than the models.
      field: lifecycle
      source: src-vals-ai-proof-bench
      quote: As of October 29, 2026, 4 models tie for first on ProofBench with 100.00%
    - check: The 100-problem public split the pages describe is not public in any source read; the
        README and the paper say only samples are released. Whether it was ever released, or is the
        paper's other half kept private, decides whether access_note's "not released" stands.
      field: data.access
      source: src-github-vals-proof-bench-readme
      quote: The folder only has sample problems; the rest of the benchmark is private.
    - check: released is Epoch's 2026-01-30, which no Vals source states; the v1 page's launch date
        was not found. Whether v1's grader rejected native_decide (the erratum's "earlier revision
        of the grader") is not stated. Both versions are kept as revisions of one benchmark (same
        maintainer, name, page family and private split); v1.1 corrected items, so it may be read as
        breaking with changed items rather than a grader fix.
      field: versions
      source: src-vals-ai-proof-bench-v1
      quote: They have been superseded by v1.1, which corrects formalization defects in the dataset
        and hardens the grader.
    - check: tool-use is tagged on the paper's stated design (problems needing a Mathlib lookup) and
        on the submit tool's gating of every score; the score is still only whether the proof
        compiles, so a reviewer may hold tools incidental, as PutnamBench's entry does.
      field: capability
      source: src-arxiv-2603-26996-v1
      quote: 'we include these problems to test a crucial capability for real-world formalization: reliably
        looking up relevant theorems'
    - check: agent-scaffold rests on the two outside systems, which differ from the models in
        harness, web access (Aristotle), helper lemmas and, for Aristotle, Lean version; comparing
        their rows with model rows needs the scaffold and harness conditions.
      field: designed_for_subjects
      source: src-vals-ai-proof-bench
      quote: rather than the 4.25.2 toolchain used by the sandbox the other models run in
    - check: AlephProver's reported run is the second, at budgets its makers asked for after the
        first scored 99. No independence flag covers an evaluated party setting its own budget;
        funded-by-evaluated-party does not fit.
      field: governance.independence_flags
      source: src-vals-ai-proof-bench
      quote: AlephProver is a formal-math system from Logical Intelligence and, like Aristotle, runs
        on its own infrastructure rather than in our harness.
    - check: contamination_risk medium rests on the private formalisations against public textbook
        and exam problems and Aristotle's web search; low is arguable for the models, which ran
        without internet access.
      field: data.contamination_risk
      source: src-vals-ai-proof-bench
      quote: We verified that Aristotle searched the web on 60 of 100 problems.
    - check: official-harness rests on the paper's statement that all harness code is released and
        the repository's agent and aggregation code; whether its grader matches v1.1's rules was not
        read, which would make reference-implementation-only the fit if not.
      field: execution.harness_availability
      source: src-arxiv-2603-26996-v1
      quote: the evaluation prompt and all harness code are available at this https url
    - check: Personal data. Both Vals pages name individuals in their acknowledgements and BibTeX,
        and the paper and abstract page list authors; all are kept out of the extracts and the Vals
        pages are withheld from archiving. The lead should confirm the withholding.

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2505-23281-v3
    - src-arxiv-2505-23281
    - src-arxiv-2605-00674-v2
    - src-arxiv-2605-00674
    - src-github-matharena-readme
    - src-matharena-site
    - src-matharena-competitions
    - src-hf-api-matharena-arxivmath-0826
    - src-arxiv-2610-11128-v1
  sources_note: >
    Both papers' PDFs (DOIs, not archived) read as text, with their abstract pages for dates; the README
    at main; the home and competitions pages with scripts and styles stripped, both withheld from
    archiving because they carry a researcher's e-mail address; Hugging Face's API record of the August
    2026 ArXivMath set; and an October 2026 paper's v1 PDF as evidence of use by others.
  confidence: medium
  review_checks:
    - check: Identity. One entry for the platform, each competition and arXiv benchmark a subset.
        The alternatives are versions per competition date, a track-set version for the 2026
        expansion, or entries of their own for ArXivMath, BrokenArXiv and ArXivLean. AIME is also a
        core entry of its own in the mathematics survey, so MathArena's AIME 2025 and 2026 subsets
        overlap it.
      field: subsets
    - check: Primary domain. On 2026-10-14 the site marks every competition section deprecated, so
        the current benchmarks are all research-level; the primary could move to
        research-level-math. competition-math's definition also asks for determinate answers, which
        proofs lack.
      field: domain
      source: src-matharena-competitions
      quote: Final-Answer Comps Deprecated Overall Deprecated 4 competitions
    - check: Final answers were expected to be exact-match, but the sources describe SymPy
        equivalence, so symbolic-equivalence is tagged and exact-match rejected. composite and
        entrant-relative-ranking rest only on the home page's expected-performance aggregate.
      field: evaluation_method
      source: src-matharena-site
      quote: For missing results, we estimate the score with a two-parameter item-response theory
        model
    - check: contamination_risk high rests on the 2025 paper's finding that nine AIME and HMMT
        February 2025 problems had near-copies online, in sets now deprecated but still published,
        and on later models being flagged rather than excluded. medium is arguable if deprecated
        sets do not count.
      field: data.contamination_risk
    - check: grader-from-evaluated-party rests on the USAMO 2026 jury, whose grades were all
        reviewed by hand; funded-by-evaluated-party on Google Cloud compute acknowledged in the 2025
        paper only.
      field: governance.independence_flags
    - check: Capability overrides drop terms on purpose (the validator's subset-drops-terms
        warnings). The proof-based subsets and ArXivLean keep deductive-reasoning only, and
        BrokenArXiv has honesty alone, assigned only there and not at entry level; whether the
        entry's coverage should show it.
      field: capability
    - check: The arXiv-based sets on Hugging Face state CC-BY-SA-4.0, not the paper's
        CC-BY-NC-SA-4.0; dataset_licence records the paper's.
      field: data.dataset_licence
      source: src-hf-api-matharena-arxivmath-0826
      quote: '"license":"cc-by-sa-4.0"'
    - check: reproducibility_tier requires-human-raters. Putnam and Miklós Schweitzer 2025 were
        scored once by official juries, and Project Euler's answers are withheld, which could argue
        for not-independently-reproducible; the exclusion for unrepeatable past runs was applied.
      field: execution.reproducibility_tier
    - check: activity no-submission-channel. No source read offers a route for developers to request
        an evaluation; the site gives only a contact address.
      field: activity
    - check: cost_usd is in material_extra as the assignment asked; it is an outcome the boards
        report beside every score rather than a run condition.
      field: comparability.material_extra

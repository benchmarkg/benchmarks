  sources_note: >
    The paper's v3 and v1 PDFs (DOIs, not archived) read as text, and its abstract page for the dates
    and venue; the ACL Anthology page for the Findings of NAACL 2025 DOI; the README at main and GitHub's
    API record of the repository (pending archive); GitHub's commit list (withheld from archiving, as
    each commit carries names and e-mail addresses); Hugging Face's API record of the CardinalOperations
    copy (pending archive); and the survey's and OptiMind's PDFs (DOIs, not archived) for the error audits,
    the cleaned forks and current use.
  confidence: medium
  review_checks:
    - check: 'Choice of benchmark. Weighed: NL4Opt (NeurIPS 2022 competition, org repository; its generation
        subtask scores a logical form against a canonical formulation and its first subtask is entity
        tagging, so the original scores no solved value), IndustryOR (100 problems inside the ORLM paper,
        an Operations Research DOI; the survey finds at least 54% wrong), OptiBench/ReSocratic (605 problems
        as the survey counts them; venue and repository account not checked) and OptMATH (not read). Mamo
        won as the only one built and titled as a mathematical-modelling benchmark, scoring a solved value,
        covering ODEs as well as LP, held in an organisation account, with a DOI and 2026 use.'
      field: domain
      source: src-arxiv-2508-10047-v1
      quote: As shown in Table 1, except for EasyLP in MAMO, the error rates of other benchmarks
        exceed 15%, with IndustryOR even reaching as high as 54%
    - check: Code family. The scored artifact is the value a solver returns on the model's own .lp
        file or Python code, and the paper calls the code a formalisation of the model; placed in
        mathematics as code-as-means. If a reviewer reads the ODE part's Python as the scored
        program, the code family's "scoring what the software computes" would claim that part.
      field: domain
      source: src-arxiv-2405-13144-v3
      quote: We prioritize the correctness of the solution A over the intermediate steps of model
        formulation.
    - check: Identity. The id is a proposal (04 S3); mamo-benchmark or mamo-mathematical-modeling
        are alternatives if "mamo" proves ambiguous. The aliases carry v1's title, which the README
        still uses.
      field: id
      source: src-arxiv-2405-13144-v1
      quote: 'Mamo: a Mathematical Modeling Benchmark with Solvers'
    - check: Lineage. The cleaned sets by SIRL, by the 2025 survey and by OptiMind are recorded as
        forks (other maintainers, changed items); none was opened here, so their sizes, licences and
        release state are unverified, and OptiMind's is only announced. The CardinalOperations
        Hugging Face copy is not recorded as a fork, being a direct copy with renamed fields.
      field: lineage
      source: src-arxiv-2509-22979-v2
      quote: Xiao et al. (2025a) examine six mainstream benchmarks, including IndustryOR and
        MAMO-Complex, and find that about 30-50% of the data are problematic
    - check: Item quality. Experts put the original's error rate at no less than 8.13% (Easy_LP) and
        23.7% (Complex_LP), and OptiMind at 30-60% across the hard sets it cleaned; the maintainers
        have issued no correction, so lifecycle could be read as under-revision by others, and
        scores on the original and on cleaned versions must not be pooled.
      field: lifecycle
      source: src-arxiv-2508-10047-v1
      quote: ≥ 26.4% ≥ 54.0% ≥ 8.13% ≥ 23.7%
    - check: Licence conflict. The paper and repository license the data CC BY-SA 4.0 (Apache 2.0
        for the first three weeks), while the CardinalOperations copy that much later work loads is
        tagged cc-by-nc-4.0, a non-commercial term the share-alike licence does not allow a copier
        to add.
      field: data.dataset_licence
      source: src-hf-api-cardinaloperations-mamo
      quote: '"license":"cc-by-nc-4.0"'
    - check: maintainer_type academic-lab rests on the authors' university; the FreedomIntelligence
        organisation's record names no institution. individual is out (an organisation account), and
        community-collective is the other reading.
      field: governance.maintainer_type
      source: src-mamo-gh-api
      quote: '"type":"Organization"'
    - check: no-known-conflict is set although GPT-4-0613, an evaluated model, repairs other models'
        syntax in the GPT-4-modified setting; that setting is not the headline (Table 4 uses
        self-modification), so grader-from-evaluated-party was not set.
      field: governance.independence_flags
      source: src-arxiv-2405-13144-v3
      quote: we used the original language model and GPT-4-0613 as code modifiers
    - check: data_provenance. expert-authored reads the textbook route as adaptation by trained
        mathematicians; if it is only selection and review, the textbook items are third-party
        material and expert-authored should go. The paper gives no split between the two routes.
      field: data.data_provenance
      source: src-arxiv-2405-13144-v3
      quote: For manual selection, we referenced textbooks and solutions in ODE and optimization
    - check: Capability abstraction is tagged because the model is withheld from the problem
        statement; a reviewer may prefer to keep it for benchmarks whose novelty is a hidden rule,
        leaving quantitative-reasoning alone.
      field: capability
      source: src-arxiv-2405-13144-v3
      quote: Questions should be framed as real-world problems without explicitly stating the
        underlying mathematical model.

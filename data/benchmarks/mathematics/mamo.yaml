# data/benchmarks/mathematics/mamo.yaml
#
# P1-S10-T06, mathematics entry 12. Filled from the Mamo paper, arXiv 2405.13144 read as its v3 PDF (2025-02-15,
# the Findings of NAACL 2025 version) and as its v1 PDF (2024-05-21, for the original title and stated total), and its
# abstract page; the paper's ACL Anthology page for the venue and DOI; the README of FreedomIntelligence/Mamo at main;
# GitHub's API records of the repository and of its seven commits; Hugging Face's API record of the
# CardinalOperations/MAMO copy of the optimisation data; a 2025 survey of LLM optimisation modelling (arXiv 2508.10047, v1
# PDF), which audits Mamo's errors and releases cleaned versions; and the v2 PDF of OptiMind (January 2026), which
# evaluates on a re-cleaned Complex_LP. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# Read and not cited: GitHub's API record of the FreedomIntelligence organisation (display name "Freedom AI", no
# description or location); the commit records of a03916f and 5b0ac25 and the three data files at both commits, which
# the curator compared (the 1,209 questions and answers are unchanged since 2024-05-22); the LICENSE file at main; the
# CardinalOperations/MAMO README; and the arXiv abstract pages of the survey (CC BY 4.0) and of OptiMind. What they
# bear on is in the notes and in curation.review_checks.

id: mamo
name: Mamo
aliases:
  - MAMO
  - 'Mamo: a Mathematical Modeling Benchmark with Solvers'
tagline: 1,209 word problems to formulate as ODE or (MI)LP models, solved by a solver and checked
  against a numeric answer.
description: >
  A benchmark of 1,209 real-world word problems that a language model must turn into a mathematical
  model, without the problem stating the model: 346 ordinary differential equation problems (196
  first-order, 110 second-order, 40 systems) and 863 optimisation problems, split into Easy_LP (652
  high-school-level mixed-integer linear programs) and Complex_LP (211 undergraduate-level LP and MILP
  problems). Problems were selected from ODE and optimisation textbooks and adapted, or synthesised from
  mathematical constructs with random parameters whose answers were computed before GPT-4 wrote a
  real-life scenario around them; a team including PhD holders reviewed, filtered and corrected them.
  For an ODE problem the model writes Python code that calls a solver (solve_ivp, odeint) and prints
  the function's value at a stated time; for an optimisation problem it writes a .lp file, which the
  COPT solver solves for the optimal value. The solver's result is compared with the reference under a
  tolerance tied to the reference's decimal places, and the score is accuracy per part and a
  question-weighted overall. Syntax errors can be repaired by a "code modifier" (the model itself, or
  GPT-4-0613) that may not change the model's logic. There is no leaderboard; later work mostly scores
  the two LP parts, often on cleaned versions others have released.
self_description:
  source: src-arxiv-2405-13144-v3
  quote: we introduce Mamo, a novel benchmark designed to assess the mathematical modeling
    capabilities of LLMs
external_ids:
  arxiv: '2405.13144'
paper:
  title: 'LLMs for Mathematical Modeling: Towards Bridging the Gap between Natural and Mathematical Languages'
  arxiv: '2405.13144'
  doi: 10.18653/v1/2025.findings-naacl.146
  version_read: v3
  source: src-arxiv-2405-13144-v3
released: 2024-05-22
released_note: The day the three data files were committed to the repository; the paper's v1 went to
  arXiv the day before, and the repository was created on 2024-05-21. v1 carried the original title
  (the second alias), which the README still carries.
released_source: src-github-api-mamo-commits
released_quote: '"date":"2024-05-22T11:16:36Z"},"message":"Benchmark_data"'
release_venue: Findings of NAACL 2025
release_venue_source: src-acl-2025-findings-naacl-146
release_venue_quote: 'Volume: Findings of the Association for Computational Linguistics: NAACL 2025 Month:
  April Year: 2025'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: mathematics/applied-modeling
domain_basis:
  reason: The task is the leaf's definition, formulating a real-world situation as a mathematical
    model and solving it. Each problem is posed as a scenario that does not state its model, the
    system must write the model (an ODE with its conditions, or an LP or MILP), and the score is
    whether solving that model gives the reference value, which the family's inclusion test reads as
    an answer checked as mathematics.
  source: src-arxiv-2405-13144-v3
  quote: Questions should be framed as real-world problems without explicitly stating the underlying
    mathematical model.
domain_considered_and_rejected:
  - term: code/function-synthesis
    reason: The model writes Python (ODE) or an .lp file (optimisation), and the code family's
      inclusion test covers scoring what software computes. But the code is the means to a
      mathematical result, which the code family's exclusion sends away, and the mathematics
      family's exclusion of a scored program does not bite either; the paper evaluates the model M
      through the value its solution gives, and a code modifier repairs syntax so that coding errors
      do not count. See review_checks.
    source: src-arxiv-2405-13144-v3
    quote: The evaluative focus lies on whether the LLM constructs a mathematical model M that
      faithfully translates the realworld problem into mathematical language.
  - term: mathematics/competition-math
    reason: The problems are textbook and synthetic modelling exercises, not olympiad problems, and
      the difficulty is the formulation; the solver does the solving.
  - term: mathematics/arithmetic
    reason: The leaf's definition puts the difficulty in the calculation rather than the modelling;
      here the calculation is handed to a solver and the modelling is what is tested.
  - term: physics/physics-reasoning
    reason: Some ODE scenarios are physical (mixing tanks, motion), but most are business,
      daily-life or environmental, and the score is whether the situation was formulated correctly
      in the first place, which is the distinction the physics leaf draws against applied modelling.
capability:
  - quantitative-reasoning
  - abstraction
capability_basis:
  quantitative-reasoning:
    reason: Every scored answer is a number (an optimal value, or an ODE solution's value at a
      stated time) to stated significant figures, reached by building and solving a quantitative
      model.
    source: src-arxiv-2405-13144-v3
    quote: ensuring a unified and numerical answer for clear comparison with the solver
  abstraction:
    reason: The representation is what is withheld. A scenario names quantities and relations but
      not the model, and the system must find the decision variables, constraints and objective, or
      the state variables and differential equation, before any answer exists; the solver then does
      the rest.
    source: src-arxiv-2405-13144-v3
    quote: we aim to map a natural language question Q into a mathematical model M
capability_considered_and_rejected:
  - term: optimization
    reason: Half the items are optimisation problems, but the score is accuracy against a stored
      optimal value, which the term's exclusion test sends away; systems are not ranked by an
      objective they optimise.
  - term: tool-use
    reason: The model does not call the solver. It writes a model, and the harness runs the solver
      and compares the result; no tool is offered to the entrant.
    source: src-arxiv-2405-13144-v3
    quote: For optimization problems, the LLM was asked to express the model in .lp format, after
      which an optimization solver COPT (Ge et al., 2023) was employed to find the optimal value for
      comparison with the correct answer.

evaluation_method:
  - numeric-tolerance-match
evaluation_method_note: "The rule (Section 4.1.2 and the script in Appendix P): with n the decimal places
  of the reference (n = 0 for an integer), a solver answer is correct if its relative error is below 1e-4
  or its absolute error is below min(10^-n, 10^-2). Appendix P's code computes the first branch as relative
  error, the second by scaling both values by 10 to the max(n, 2). The paper's Table 8 shows ODE accuracy
  rising with a looser threshold (GPT-4o 48.55% to 61.85%) and the LP parts unchanged; the headline uses
  the strict one."
evaluation_method_basis:
  reason: Each answer is a number marked correct when it falls inside a tolerance of the reference
    that depends on the reference's stated precision, which is the term's definition; the rule is
    recorded in the note.
  source: src-arxiv-2405-13144-v3
  quote: Let n denote the number of decimal places in A (n = 0 if A is an integer).
evaluation_method_considered_and_rejected:
  - term: execution-tests
    reason: The model's code or .lp file is executed, but the verdict is a comparison of its output
      with a reference value, not the outcome of tests on the code's behaviour.
  - term: exact-match
    reason: The comparison accepts a band around the reference, not the reference only.
designed_for_subjects:
  - instruction-tuned-model
  - reasoning-model
designed_for_subjects_basis:
  reason: The paper prompts chat models with three examples and samples at temperature 0.8, and
    reports o1-preview beside them, whose result (best on second-order ODEs and Complex_LP, weaker
    on Easy_LP) the paper discusses as a reasoning model's.
  source: src-arxiv-2405-13144-v3
  quote: o1-preview, although it excelled in complex tasks such as second-order ODEs and Complex_LP,
    did not outperform
designed_for_subjects_considered_and_rejected:
  - term: base-model
    reason: DeepSeek-math-7B-base is one of the 20 evaluated models, and the 3-shot prompt suits a
      base model, but the protocol and the other 19 are chat or reasoning models.
    source: src-arxiv-2405-13144-v3
    quote: DeepSeek-math-7B-base
  - term: tool-augmented-model
    reason: The solver is run by the harness on the model's output, not offered to the model as a
      tool.
as_used:
  - protocol: OptiMind scores formulation as an executable GurobiPy script rather than an .lp file,
      with a normalised-error check taken from OptMATH instead of Mamo's tolerance rule, on its own
      re-cleaned Complex_LP.
    split: Complex_LP, re-cleaned by the OptiMind authors
    source: src-arxiv-2509-22979-v2
    quote: 'Our evaluation is performed on our rigorously cleaned versions of three challenging and widely-used
      benchmarks: IndustryOR (Tang et al., 2024), Mamo-Complex (Huang et al., 2024), and OptMATH'
    note: OptiMind v2 (2026-01-14) also reports results on the cleaned Complex_LP versions released
      by SIRL and by the 2025 survey, and says the same model's accuracy rises from 40-60% on the
      original releases to 70-90% on corrected sets.
  - protocol: The survey's unified evaluation scores open-source optimisation-modelling methods on
      its own cleaned Easy_LP and Complex_LP, with one base model for every training-free method;
      the ODE part is left out.
    split: Easy_LP and Complex_LP, cleaned by the survey's authors
    source: src-arxiv-2508-10047-v1
    quote: 'Note that MAMO also categorize problems into three classes: EasyLP, ComplexLP and ODE. Our
      study primarily focuses on the former two categories.'
lifecycle: active
lifecycle_basis:
  reason: Results are still being produced on it by others. OptiMind's v2 (January 2026) evaluates
    on Complex_LP, and the 2025 survey reruns open-source methods on Easy_LP and Complex_LP. The
    maintainers' repository has not been pushed since 2024-06-12, which is maintenance evidence, not
    lifecycle.
  source: src-arxiv-2509-22979-v2
  quote: 'Our evaluation is performed on our rigorously cleaned versions of three challenging and widely-used
    benchmarks: IndustryOR (Tang et al., 2024), Mamo-Complex (Huang et al., 2024), and OptMATH'
activity: no-submission-channel
activity_note: The README's Result section is empty and no board exists; results appear in papers.
activity_basis:
  reason: Neither the paper nor the README offers a way to enter a result; the README's Result
    heading is followed directly by the citation.
  source: src-github-mamo-readme
  quote: '## Result ## Citation'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Llama-3.1-405B-Instruct
    source: src-arxiv-2405-13144-v3
    observed_on: 2026-11-09
    quote: The Llama-3.1-405B, in particular, achieved the best overall score across both evaluation
      categories.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each problem's reference numeric answer, from the textbook solution for
  selected problems or computed from the mathematical construct before the scenario was written for
  synthesised ones, then reviewed. The answers are released with the problems.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Problems, answers and the scripts are public under CC BY-SA 4.0. The scripts call COPT, a
    commercial solver, but the README allows another solver that reads .lp files with small code
    changes, and the paper names Gurobi and MATLAB as alternatives.
  source: src-github-mamo-readme
  quote: Here we use COPT, you could use the solver you want and do some small change in the codes

task:
  exists: true
  input:
    - one word problem in English (LaTeX for quantities) describing a real-world scenario and asking
      for a value to stated significant figures, with three worked examples in the prompt
  output: For an ODE problem, Python code that calls an ODE solver and prints the requested value;
    for an optimisation problem, a model in .lp format.
  scoring: The harness runs the code, or solves the .lp file with COPT, and compares the result with
    the reference under the tolerance rule; outputs that fail to run may first be passed once to a
    code modifier (the same model, or GPT-4-0613) told to fix syntax without changing the logic.
    Accuracy is reported for first-order, second-order and system ODEs, Easy_LP and Complex_LP, and
    overall weighted by question count.
  reference_solution: false
  reference_solution_note: The files carry a question and a numeric answer only; no reference model
    or code is released.
  source: src-arxiv-2405-13144-v3
  quote: When the LLM output contains syntax errors in Python or .lp code, these errors must be
    corrected without altering the logic of the code to ensure that the evaluation focuses solely on
    modeling.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The three JSONL files, with every question and its answer, are in the public GitHub
      repository; a copy of the two LP files is ungated on Hugging Face.
    source: src-github-mamo-readme
    quote: 'The data consists of two parts: ODE and Optimization, while optimziation part consists of
      Easy_LP and Complex_LP'
  refresh: static
  refresh_note: The data were committed on 2024-05-22; on 2024-05-24 the files moved under data/ and
    the LP items' Type label was renamed, with questions and answers unchanged (the curator's
    comparison of the two commits). The repository has not been pushed since 2024-06-12. Corrections
    have been made by others, not by the maintainers (lineage.forks); the 2025 survey's experts put
    the original's error rate at no less than 8.13% for Easy_LP and 23.7% for Complex_LP.
  refresh_basis:
    reason: The commit history shows no data change after the first week, and no later release.
    source: src-mamo-gh-api
    quote: '"pushed_at":"2024-06-12T12:39:39Z"'
  data_provenance:
    - model-generated
    - expert-authored
  data_provenance_note: Two routes, in proportions the paper does not give. Synthesised items start
    from a mathematical construct with random parameters whose answer is computed, after which GPT-4
    writes the real-life scenario (model-generated). Selected items were taken from ODE and
    optimisation textbooks and adapted by a team with advanced mathematical training, some with
    PhDs, who changed scenarios or solutions to meet the benchmark's criteria (expert-authored, read
    as adaptation rather than review; see review_checks). All items were then reviewed; of 383
    initial ODE questions 346 remained, of 688 Easy_LP 652, and 40 of the 211 Complex_LP models were
    corrected.
  data_provenance_source: src-arxiv-2405-13144-v3
  data_provenance_quote: Our benchmark dataset comprises manually selected and GPT-generated
    questions, curated by a team with advanced mathematical education, including Ph.D. holders
  contamination_risk: medium
  contamination_risk_note: The full set with answers has been public on GitHub since May 2024 and on
    Hugging Face since 2024-05-29, and part of it is adapted from standard textbooks, so a training
    route is plausible; no source read evidences one for a scored part. Guessing is hard to do by
    chance (about 2.9% for an ODE answer within a 0.01 interval, 7.3% for LP, per Appendix M).
  dataset_licence: CC-BY-SA-4.0
  dataset_licence_note: The paper's Appendix S licenses the benchmark under CC BY-SA 4.0, and the
    repository's LICENSE has been CC BY-SA 4.0 since 2024-06-12, when it replaced an Apache 2.0
    licence added on 2024-05-24. The CardinalOperations copy on Hugging Face is tagged cc-by-nc-4.0,
    which conflicts with the share-alike terms (review_checks).
  dataset_licence_source: src-arxiv-2405-13144-v3
  dataset_licence_quote: This content(incolding benchmark) is licensed under the Creative Commons
    Attribution-ShareAlike 4.0 International (CC BY-SA 4.0) license.
  size:
    - count: 1209
      unit: problems
      source: src-arxiv-2405-13144-v3
      quote: Introducing Mamo, a benchmark with 1,209 questions covering ordinary differential
        equations, linear programming, and mixedinteger linear programming
    - count: 346
      unit: problems
      subset: ODE
      source: src-arxiv-2405-13144-v3
      quote: 'In the section on Ordinary Differential Equations, we present a total of 346 problems: 196
        are based on first-order equations, 110 on secondorder equations, and 40 on systems of equations'
    - count: 652
      unit: problems
      subset: Easy_LP
      source: src-arxiv-2405-13144-v3
      quote: Easy_LP, featuring 652 high school-level Mixed Integer Linear Programming (MILP)
        problems, and Complex_LP, comprising 211 undergraduate-level problems that integrate both LP
        and MILP
    - count: 211
      unit: problems
      subset: Complex_LP
      source: src-arxiv-2405-13144-v3
      quote: Easy_LP, featuring 652 high school-level Mixed Integer Linear Programming (MILP)
        problems, and Complex_LP, comprising 211 undergraduate-level problems that integrate both LP
        and MILP
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: FreedomIntelligence (GitHub organisation, display name "Freedom AI"); the authors are
    at The Chinese University of Hong Kong, Shenzhen, with one at the Shenzhen Research Institute of
    Big Data
  maintainer_basis:
    reason: The data, scripts and licence sit in the FreedomIntelligence organisation account, which
      GitHub records as an Organization. The organisation's own record states no institution; the
      paper's author block puts four of the five authors at CUHK-Shenzhen.
    source: src-mamo-gh-api
    quote: '"type":"Organization"'
  maintainer_type: academic-lab
  maintainer_type_note: Read from the organisation account plus the authors' university; no source
    states CUHK-Shenzhen as the account's holder, which the term's exclusion test asks for
    (review_checks). individual is ruled out by the organisation account; community-collective was
    considered, but the authors come from one university and one institute in the same city.
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results channel; the paper's 20 models were run by the
    authors, and later results are in other papers under their own protocols (as_used).
  submission_process_source: src-github-mamo-readme
  submission_process_quote: '## Result ## Citation'
  independence_flags:
    - flag: no-known-conflict
      source: src-arxiv-2405-13144-v3
      quote: This work was supported by the Shenzhen Science and Technology Program
  independence_flags_note: Searched for every flag on 2026-11-09 in the paper, README and repository
    records. The funders are Shenzhen municipal programmes, NSFC's Tianyuan Fund and a Shenzhen key
    laboratory, none an evaluated party; the authors enter no model of their own, and grading is a
    numeric comparison. GPT-4-0613, an evaluated model, repairs other models' syntax in the
    GPT-4-modified setting (Table 6), which is read as a harness option rather than a grader; see
    review_checks.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2405-13144-v3
    quote: The process, while effective, may inadvertently influence the LLMs

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is inference on 1,209 prompts plus solver calls on a CPU; the paper called
      proprietary and large open models through APIs, and the README serves open models with vLLM.
      The solver is the one other requirement.
    source: src-github-mamo-readme
    quote: For open source models, we use VLLM for deployment and inference.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Generation, execution, solving, repair and comparison are scripted end to end with no
      human step.
    source: src-github-mamo-readme
    quote: bash 4.fix_error_optimization.sh
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: 'FreedomIntelligence/Mamo: scripts/scripts_ode and scripts/scripts_optimization, five shell
    steps each (prepare queries, run the model, run the code and compare, fix errors with the code modifier,
    rerun and compare), in API and vLLM versions, with few-shot variants'
  harness_note: The optimisation scripts call COPT on the .lp files and need a solver that reads
    them; the README asks users to fill in paths in the scripts before running.
  harness_source: src-github-mamo-readme
  harness_quote: bash 4.fix_error_optimization.sh
  harness_gotcha:
    source: src-arxiv-2405-13144-v3
    quote: we used the original language model and GPT-4-0613 as code modifiers
  harness_gotcha_note: The same model can be reported raw, self-modified or GPT-4-modified, and the
    paper reports all three (Tables 4 to 6); a number without the setting is ambiguous. Later papers
    change more (GurobiPy code instead of .lp files, other tolerances, cleaned subsets), so their
    numbers are not on the paper's scale.
  code_licence: CC-BY-SA-4.0
  code_licence_note: The repository's one LICENSE file, CC BY-SA 4.0 since 2024-06-12, covers the
    scripts as well as the data.
  code_licence_source: src-mamo-gh-api
  code_licence_quote: '"spdx_id":"CC-BY-SA-4.0"'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # (numeric-tolerance-match, instruction-tuned-model) has no profile and resolves to fallback (subset_used). Beyond
  # it: the code-modifier setting (none, self or GPT-4-0613), recorded as the harness, with the solver; the prompt's
  # examples (3-shot in the paper, which also reports 0 to 10 shots); sampling (temperature 0.8); and the number of
  # repair passes (one in the paper), carried by retries_allowed. Cleaned versions by others are distinct
  # benchmarks (lineage.forks), and subset_used must say which file was scored.
  material_extra:
    - harness
    - shots
    - sampling
    - retries_allowed
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The headline is the overall accuracy, the question-weighted average of the five part
    scores, beside the parts.
  source: src-arxiv-2405-13144-v3
  quote: score represents the weighted average of correct rates, weighted by question count.

homepage: https://github.com/FreedomIntelligence/Mamo
repository: https://github.com/FreedomIntelligence/Mamo

versions:
  - version: '2024-05-22'
    label: The data as committed on 2024-05-22, unchanged at main
    version_kind: revision
    released: 2024-05-22
    items: 1209
    changes: The only release, 346 ODE, 652 Easy_LP and 211 Complex_LP problems; the 2024-05-24
      commit moved the files and renamed a label, and the paper's later versions changed text, not
      items.
    errata:
      - date: 2025-02-15
        scope: the paper's stated total
        description: The v1 paper gave the benchmark's total as 1059 questions beside part sizes of
          346, 652 and 211; v3 gives 1,209, their sum and the files' line count.
        source: src-arxiv-2405-13144-v1
    frozen: true
    sources:
      - src-github-api-mamo-commits
      - src-arxiv-2405-13144-v1
      - src-arxiv-2405-13144-v3
      - src-arxiv-2405-13144

subsets:
  - id: mamo#ode
    label: ODE
    items: 346
    scored_separately: true
    evidence:
      - source: src-arxiv-2405-13144-v3
        quote: For ODE problems, the LLM was prompted to generate Python code based on a natural
          language description.
    notes: Reported in three columns, first-order (196), second-order (110) and systems (40); Python
      code calling an ODE solver. Most later work drops it.
  - id: mamo#easy-lp
    label: Easy_LP
    items: 652
    scored_separately: true
    evidence:
      - source: src-arxiv-2508-10047-v1
        quote: EasyLP 652 ComplexLP 211
    notes: High-school-level MILP word problems, answered as .lp files.
  - id: mamo#complex-lp
    label: Complex_LP
    items: 211
    scored_separately: true
    evidence:
      - source: src-arxiv-2405-13144-v3
        quote: In complex LP part, for the original 211 questions, 40 were found formulated by wrong
          mathematical models. All of them were corrected.
    notes: Undergraduate-level LP and MILP problems (network flow, TSP and the like); the part later
      work uses most, usually in a cleaned version.
subsets_note: The three parts are separate files with separate scripts. The ODE part's first-order,
  second-order and system columns are labels (the Type field), not files.


# data/benchmarks/mathematics/omni-math.yaml
#
# P1-S10-T05, mathematics entry 4 of 6. Filled from the Omni-MATH paper, arXiv 2410.07985 read as its v3 PDF
# (2024-12-24, the latest version), and its abstract page; the paper's ICLR 2025 proceedings page; the project page
# omni-math.github.io (scripts and styles stripped), which holds the leaderboard; the READMEs of KbsdJames/Omni-MATH
# and KbsdJames/omni-math-rule at main; Hugging Face's API records of the dataset (KbsdJames/Omni-MATH, ungated)
# and of the Omni-Judge model; the v2 PDF of ReASC (arXiv 2601.02970, ACL 2026), a 2026 paper reporting results on
# Omni-MATH; and Stanford CRFM's HELM Capabilities post (March 2025), which runs Omni-MATH in HELM. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.
#
# Read and not cited: GitHub's API records of both repositories, of the project page's repository and of the
# KbsdJames account; Hugging Face's commit listings of the dataset and of Omni-Judge, and Omni-Judge's model card;
# the abstract page and v1 PDF of R^3-Bench (arXiv 2608.16033, August 2026), which draws mathematics problems from
# Omni-MATH for a benchmark of its own; and UK AISI inspect_evals' task listing at main, which has no Omni-MATH task.
# What they bear on is in the notes and in curation.review_checks.

id: omni-math
name: Omni-MATH
aliases:
  - Omni-Math
  - OmniMATH
tagline: 4,428 olympiad maths problems in 33 sub-domains and 10 difficulty levels, answers checked
  against references by GPT-4o.
description: >
  A text-only benchmark of 4,428 olympiad-level mathematics problems, each with a reference answer
  and a full solution. Problems and official solutions were crawled from competition websites (IMO,
  IMC and others, converted to LaTeX with MathPix) and, for competitions without official solutions,
  from the AoPS Wiki and from AoPS forum threads whose user-posted answers agreed; graduate and
  doctoral students checked them against their sources. Every problem carries a difficulty on AoPS's
  0-10 scale, taken from AoPS's competition ratings or, for competitions those do not list, assigned by
  GPT-4o
  prompted with them, and a domain path in a tree of 33 sub-domains assigned by GPT-4o. A model writes
  a solution with its final answer boxed; GPT-4o, given the problem, the reference answer and the
  solution in a few-shot prompt, judges whether the final answer means the same as the reference. The
  score is accuracy, reported overall, by first-level domain and by four difficulty tiers. The
  maintainers also release Omni-Judge, an 8B Llama model fine-tuned on GPT-4o's verdicts, as a cheaper
  judge, and Omni-MATH-Rule, a 2,821-problem subset whose answers can be checked by SymPy-based rules.
  The leaderboard on the project page ranks 15 models the maintainers ran with the GPT-4o judge, and a
  rule-based table beside it.
self_description:
  source: src-arxiv-2410-07985-v3
  quote: we introduce Omni-MATH, a universal Olympiad-level benchmark specifically designed for
    mathematical reasoning
external_ids:
  huggingface: KbsdJames/Omni-MATH
  arxiv: '2410.07985'
paper:
  title: 'Omni-MATH: A Universal Olympiad Level Mathematic Benchmark For Large Language Models'
  arxiv: '2410.07985'
  version_read: v3
  source: src-arxiv-2410-07985-v3
released: 2024-09-20
released_note: The dataset's release date in the README's dated news. Hugging Face's record of the
  dataset was created on 2024-09-14, and the paper's first arXiv version followed on 2024-10-10.
released_source: src-github-omni-math-readme
released_quote: '*2024-09-20*: We have released the Omni-MATH dataset.'
release_venue: ICLR 2025
release_venue_source: src-iclr-2025-omni-math
release_venue_quote: International Conference on Learning Representations 2025 (ICLR 2025)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: mathematics/competition-math
domain_basis:
  reason: Every item is a problem from a mathematics competition, from introductory contests to the
    IMO, with a determinate final answer that is checked against a reference, which is the leaf's
    definition; the family's inclusion test asks that the answer be checked as mathematics, here a
    value or an expression.
  source: src-arxiv-2410-07985-v3
  quote: Our dataset exclusively focuses on text-only mathematics and encompasses an extensive
    collection of 4,428 competition-level problems
domain_considered_and_rejected:
  - term: mathematics/formal-theorem-proving
    reason: No proof is produced or checked; the judge is told to compare the boxed final answer
      with the reference and to ignore the intermediate steps.
    source: src-arxiv-2410-07985-v3
    quote: The Equivalence Judgement is only TRUE or FALSE.
  - term: mathematics/research-level-math
    reason: The problems are competition problems with known solutions, from introductory contests
      up to the IMO and Putnam, not open research questions.
capability:
  - quantitative-reasoning
  - deductive-reasoning
capability_basis:
  quantitative-reasoning:
    reason: The scored output is a final answer, most often a number, a LaTeX expression or a tuple,
      reached by algebra, counting or calculation, and it is judged for mathematical equivalence to
      the reference.
    source: src-arxiv-2410-07985-v3
    quote: Specifically, we leverage GPT-4o to verify whether the content generated by the tested
      model aligns with the standard answer.
  deductive-reasoning:
    reason: Each answer follows from the problem's own statement; correctness is decided against a
      reference fixed by the problem, without appeal to outside evidence. taxonomy/capabilities.yaml
      gives FrontierMath, answer-checked mathematics of the same shape, as this term's example.
    source: src-arxiv-2410-07985-v3
    quote: In our prompt, we provide problem, reference answer, model-generated solution, querying
      GPT-4o to determine whether the model solution is consistent with the reference answer.
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: No passage is supplied, but the problems test solving rather than recalling; knowing a
      theorem is an input on the way to the scored answer, which the term's exclusion sends away.

evaluation_method:
  - model-graded-judge
  - symbolic-equivalence
evaluation_method_note: The official judge is GPT-4o, whose snapshot neither the paper nor the
  README names; the leaderboard also ranks GPT-4o, dated 2024/5/13. Its few-shot prompt is released
  as GPT_eval/gpt_evaluation_template.txt and asks for the student's final answer, a TRUE or FALSE
  equivalence judgement and a justification. On a 100-item set annotated by graduate and doctoral
  students, GPT-4o agreed with the annotators 98% of the time and Omni-Judge 86%. Omni-Judge is the
  maintainers' open alternative, Llama-3.1-8B-Instruct fine-tuned on about 17,600 GPT-4o verdicts
  (the README still describes an earlier Meta-Llama-3-8B-Instruct version trained on 21,451); its
  weights were replaced on Hugging Face on 2024-10-11, and the record read here is at commit
  de5bdca15ff3c366b90718c4b4be555d25c655b0. symbolic-equivalence applies to the Omni-MATH-Rule
  subset only, whose answers are extracted from the last boxed expression and compared by
  rule-matching code adapted from Qwen2.5-Math's evaluation, mainly SymPy.
evaluation_method_basis:
  reason: Every leaderboard number comes from GPT-4o deciding whether a model's final answer is
    equivalent to the reference answer. The Omni-MATH-Rule subset is scored instead by SymPy-based
    rules, so differently written equivalent answers can both pass.
  source: src-github-omni-math-readme
  quote: All the results in our leaderboard is obtained using GPT-4o-Evaluation.
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Answers come in many formats (sets, tuples, functions, conditions in words), and the
      maintainers chose a judge because fixed rules could not compare them; even the rule subset
      compares by symbolic equivalence, not string equality.
    source: src-arxiv-2410-07985-v3
    quote: We began by rewriting a new version of the rule-matching code using the Qwen2.5-math rule
      evaluation repository, primarily utilizing SymPy.
  - term: model-derived-metric
    reason: Omni-Judge is a checkpoint fine-tuned to emit a TRUE or FALSE verdict, closer to
      HarmBench's released classifier than to a prompted judge, but it is the cheaper alternative;
      the official scores come from GPT-4o prompted to grade. See review_checks.
    source: src-hf-api-omni-judge
    quote: '"sha":"de5bdca15ff3c366b90718c4b4be555d25c655b0"'
designed_for_subjects:
  - instruction-tuned-model
  - reasoning-model
designed_for_subjects_basis:
  reason: The paper prompts each model once, with its own recommended maths prompt or an educator
    system prompt, at temperature 0 and with a 2,048-token cap. It reports OpenAI o1-preview and
    o1-mini as test-time scaled models under a 4,096-token completion cap, a budget that is part of
    their result.
  source: src-arxiv-2410-07985-v3
  quote: For the O1-preview and O1-mini, due to constraints of inference costs, we configured the
    maximum completion tokens to 4096.
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: Many entrants are maths-tuned models (Qwen2.5-MATH, DeepSeekMath, NuminaMath,
      Mathstral), but mathematics is not one of the term's six disciplines; miniF2F's entry found
      the same.
as_used:
  - protocol: Accuracy on 1,000 problems sampled at random from the 4,428, judged by xVerify, a
      different judge model, not GPT-4o with the maintainers' prompt.
    split: a random 1,000-problem sample
    source: src-arxiv-2601-02970-v2
    quote: We randomly sampled 1000 problems from the test set and report the accuracy based on the
      verdict of the LLM Judge, namely xVerify (Chen et al., 2025).
    note: ReASC (ACL 2026), an adaptive self-consistency method, run on Llama-3.2, Qwen-2.5 and
      Gemma-3 models from 3B to 27B parameters.
  - protocol: HELM Capabilities downsamples Omni-MATH to 1,000 problems and judges each answer with
      three LLMs whose votes are averaged, using HELM Safety's judge prompt instead of the paper's
      few-shot prompt.
    split: 1,000 problems downsampled from the 4,428
    source: src-crfm-helm-capabilities
    quote: Note that we deviated from the judging prompt template from the original Omni-MATH paper
      and used the HELM Safety LLM-as-a-judge prompt.
    note: Stanford CRFM's HELM Capabilities leaderboard (March 2025). The post names its three judge
      models (GPT-4o 2024-05-13, Llama 3.1 405B Instruct Turbo, Claude 3.5 Sonnet 2024-10-22) for
      WildBench and says only "three different LLMs" for Omni-MATH.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced on it by others. ReASC (v2 of April 2026, ACL 2026)
    reports Omni-MATH results, and HELM Capabilities ranked models on it from March 2025. The
    maintainers' leaderboard and repositories have not changed since December 2024 (GitHub API),
    which is maintenance evidence, not lifecycle.
  source: src-arxiv-2601-02970-v2
  quote: We randomly sampled 1000 problems from the test set and report the accuracy based on the
    verdict of the LLM Judge, namely xVerify (Chen et al., 2025).
activity: no-submission-channel
activity_note: The project page's leaderboard is the maintainers' own runs; neither it nor either
  README says how anyone else could enter a result. The README tells users to run the judge on their
  own outputs.
activity_basis:
  reason: The leaderboard is a table only the maintainers update, and the README's route for outside
    models is to score them oneself with the released judge, not to submit them.
  source: src-github-omni-math-readme
  quote: after obtaining the inference result of your model, you can query GPT-4 to test whether
    your model's output is correct

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: OpenAI o1-mini
    source: src-arxiv-2410-07985-v3
    observed_on: 2026-10-14
    quote: The strongest model evaluated is OpenAI o1-mini, which utilizes test-time enhancement to
      achieve an accuracy rate of just 60.54%.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each problem's reference answer, from the competition's official solution,
  the AoPS Wiki or agreeing AoPS forum answers, checked by annotators. The answers are released with
  the problems, and the judge compares against them.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Problems, reference answers and the judge prompt are public, GPT-4o is an API anyone can
    call and Omni-Judge's weights are open. The GPT-4o snapshot behind the leaderboard is not named
    (execution.harness_gotcha).
  source: src-hf-api-omni-math
  quote: '"gated":false'

task:
  exists: true
  input:
    - one olympiad problem statement in LaTeX, text only, with the model's own recommended maths
      prompt or an educator system prompt
  output: A worked solution ending in a final answer enclosed in \boxed{}.
  scoring: GPT-4o reads the problem, the reference answer and the solution and returns TRUE or FALSE
    for the boxed answer's equivalence to the reference; accuracy is the share judged TRUE, reported
    overall, by first-level domain and by difficulty tier. On Omni-MATH-Rule, rules extract the last
    boxed answer and compare it with SymPy.
  reference_solution: true
  source: src-arxiv-2410-07985-v3
  quote: In our prompt, we provide problem, reference answer, model-generated solution, querying
    GPT-4o to determine whether the model solution is consistent with the reference answer.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The official copy on Hugging Face is ungated and holds every problem with its reference
      answer and solution in one test file; the GitHub repository holds the same file.
    source: src-hf-api-omni-math
    quote: '"gated":false'
  refresh: static
  refresh_note: Hugging Face's commit listing (read 2026-10-14) shows the problem file uploaded on
    2024-09-14 and only renamed and README edits since, and the GitHub copy has one commit. The
    official GPT-4o grading is unchanged. Omni-Judge's weights were replaced on 2024-10-11 with no
    version label, and Omni-MATH-Rule was added on 2024-12-22 as a separately scored subset; neither
    changes the problems or the official scores. See review_checks.
  refresh_basis:
    reason: The dataset record has not been modified since October 2024, and its only file is the
      problem set uploaded at creation.
    source: src-hf-api-omni-math
    quote: '{"rfilename":"test.jsonl"}'
  data_provenance:
    - exam-derived
    - web-scraped
  data_provenance_note: The problems are from mathematics competitions. Statements and official
    solutions were crawled from competition websites and converted from PDF to LaTeX with MathPix;
    where no official solution was published, problems and answers were crawled from the AoPS Wiki
    and AoPS forum, keeping forum problems with at least three agreeing user answers. Graduate and
    doctoral students then checked them (1,100 forum problems became 888). Difficulty tags for
    competitions AoPS does not rate, and every domain label, were assigned by GPT-4o; those are
    labels, not items.
  data_provenance_source: src-arxiv-2410-07985-v3
  data_provenance_quote: For some target competitions like IMO and IMC, we can directly crawl the
    publicly available problems and solutions from the official website.
  contamination_risk: high
  contamination_risk_note: The problems and their solutions are public competition material crawled
    from the web, and the full set with reference answers and solutions has been ungated since
    September 2024. The maintainers' own 5-gram test found leakage in most of the models they
    checked, at most 0.70% of samples (Qwen2.5-MATH-72B-Instruct, 31 samples), and judged its effect
    on their conclusions small. The whole set is scored, so the route is open in what is scored.
  contamination_evidence:
    - source: src-arxiv-2410-07985-v3
      stance: supports
      quote: It can be seen that most models exhibit certain data leakage, as Omni-MATH is based on
        data sourced from the internet
    - source: src-arxiv-2410-07985-v3
      stance: supports
      quote: Qwen2.5-MATH-72b-instruct has the highest degree of data leakage with 5 grams
        accurately predicted in 31 samples
  dataset_licence: Apache-2.0
  dataset_licence_note: Hugging Face's licence tag for the dataset. Neither GitHub repository states
    a licence, and no source read addresses the terms of the competition sites and AoPS pages the
    items were crawled from.
  dataset_licence_source: src-hf-api-omni-math
  dataset_licence_quote: license:apache-2.0
  size:
    - count: 4428
      unit: problems
      source: src-arxiv-2410-07985-v3
      quote: Our dataset exclusively focuses on text-only mathematics and encompasses an extensive
        collection of 4,428 competition-level problems
    - count: 2821
      unit: problems
      subset: Omni-MATH-Rule
      note: The 1,607 problems left out are those whose answers rules could not check reliably.
      source: src-arxiv-2410-07985-v3
      quote: Ultimately, We ended up with a testable set of 2821 problems and an untestable set of
        1607 problems.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Bofei Gao (Peking University), project lead, in his own GitHub and Hugging Face
    accounts (KbsdJames), with co-lead Tianyu Liu (Alibaba Group)
  maintainer_basis:
    reason: The dataset, the Omni-Judge model and both repositories sit in the KbsdJames account,
      which GitHub's API record (read 2026-10-14) gives as Bofei Gao's, of Peking University's
      Institute of Computational Linguistics. The paper marks him and Tianyu Liu of Alibaba Group as
      project leads.
    source: src-hf-api-omni-math
    quote: '"author":"KbsdJames"'
  maintainer_type: individual
  maintainer_type_note: academic-lab was considered. The authors are mostly at Peking University,
    but the dataset and repositories sit in one person's account with no institution stated as their
    holder, which the term's inclusion test sends to individual. The project page is in a separate
    Omni-MATH account, also a user account.
  submission_process:
    - maintainer-run
  submission_process_note: The maintainers ran the 15 models on the project page's leaderboard and
    the eight in its rule-based table (adding QwQ there); no route for others to enter is stated.
  submission_process_source: src-omni-math-site
  submission_process_quote: Qwen-QwQ 49.6%
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-github-omni-math-readme
      quote: All the results in our leaderboard is obtained using GPT-4o-Evaluation.
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2410-07985-v3
      quote: Bofei Gao, Bowen Yu, Chengpeng Li, Dayiheng Liu, Jianhong Tu, Jingren Zhou, Junyang
        Lin, Keming Lu, Mingfeng Xue, Runji Lin, Tianyu Liu, Xingzhang Ren, and Zhenru Zhang.
        Qwen2.5-math technical report
  independence_flags_note: GPT-4o judges every leaderboard result and is itself ranked (dated
    2024/5/13 on the board, 30.49%), beside OpenAI's o1 models at the top. Both project leads are
    authors of the Qwen2.5-Math technical report, and Qwen2.5-MATH-72B-Instruct is the best model
    without test-time scaling on their board; four of the authors are at Alibaba Group, and the
    rule-based scorer adapts Qwen2.5-Math's evaluation code. The v3 paper has no acknowledgements or
    funding statement, so funded-by-evaluated-party found nothing to apply to.
  independence_assessed: true
  known_limitation:
    source: src-crfm-helm-capabilities
    quote: this prompt can encourage the judge model to hallucinate on the model answer, leading to
      erroneous evaluation metrics

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The official judge is GPT-4o through OpenAI's API, and the leaderboard ranks API-served
      models (o1, GPT-4o, Claude 3.5 Sonnet) beside local ones; a run needs nothing beyond inference
      spend. Omni-Judge exists to avoid that cost on a local GPU.
    source: src-github-omni-math-readme
    quote: Due to the high cost of GPT-4o and its limited accessibility, we retained the evaluation
      data used for the GPT-4o model and adapted it for instruction tuning.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Problems and answers are public and the judge is a model, so a new system can be run and
      scored end to end with no human step.
    source: src-hf-api-omni-math
    quote: '"gated":false'
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: 'KbsdJames/Omni-MATH: GPT_eval (the few-shot judge prompt gpt_evaluation_template.txt and get_result.sh,
    which totals the judge reports overall, by domain and by difficulty) and Omni-Judge_eval (omni_judge.sh,
    omni_judge_vllm.sh); KbsdJames/omni-math-rule for the rule-based subset, inference included'
  harness_note: The repository does not ship the inference step for the GPT-4o path or the code that
    sends the judge prompt to GPT-4o; the user writes those around the released prompt and result
    script. The rule-based repository runs inference with vLLM and scores in one place.
  harness_source: src-github-omni-math-readme
  harness_quote: to obtain the overall score for the model, scores in different domains, and scores
    across various difficulty levels
  harness_gotcha:
    source: src-github-omni-math-readme
    quote: All the results in our leaderboard is obtained using GPT-4o-Evaluation.
  harness_gotcha_note: '"GPT-4o" names a moving alias, and no source read names the snapshot that judged
    the leaderboard, so the judge of a reproduction cannot be matched to it. Omni-Judge is a different
    judge: about 91% agreement with GPT-4o in the paper, and its weights changed once after release.'
  code_licence: null
  code_licence_note: GitHub's API reports no licence for KbsdJames/Omni-MATH or
    KbsdJames/omni-math-rule (read 2026-10-14); not a quoted Source.
  runnable_via:
    - custom
    - helm
  runnable_via_note: HELM Capabilities implements Omni-MATH as a scenario, with its own judge prompt
    and a three-model jury, so its numbers do not match the official scoring (see as_used). UK AISI
    inspect_evals has no Omni-MATH task (its listing at main, read 2026-10-14).
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the model-graded profile (shots, chain of thought, reasoning effort, subset, judge model, version and
  # prompt): the output-token cap, which the paper sets at 2,048, and at 4,096 for o1 to limit cost; and best-of-N
  # selection over samples with a reward model, which the paper reports as separate rows (RM@8, RM@256).
  material_extra:
    - max_output_tokens
    - selection_strategy
    - n_samples
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The headline is accuracy over all 4,428 problems, with the domain and difficulty columns
    beside it.
  source: src-omni-math-site
  quote: OpenAI o1-mini 2024/9/13 60.54%

homepage: https://omni-math.github.io/
repository: https://github.com/KbsdJames/Omni-MATH
dataset_url: https://huggingface.co/datasets/KbsdJames/Omni-MATH


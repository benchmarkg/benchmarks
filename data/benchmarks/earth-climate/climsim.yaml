# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2306-08754-v6
    - src-arxiv-2306-08754
    - src-github-climsim-readme
    - src-hf-api-climsim-low-res
    - src-hf-api-climsim-high-res
    - src-kaggle-leap-climsim-record
    - src-kaggle-leap-climsim
    - src-arxiv-2511-20963-v4
    - src-arxiv-2511-20963
    - src-arxiv-2511-22004
  sources_note: >
    The paper's v6 PDF (a DOI source, not archived) read as text, and its abstract page for the dates
    and the award note; the README at its last commit; Hugging Face's public API records of the low- and
    high-resolution datasets (the aquaplanet dataset's was not read); Kaggle's JSON records of the competition
    and its pages, read without accepting the rules; the follow-up paper's v4 PDF and abstract page; and
    one November 2025 abstract as evidence of current use. The project site (leap-stc.github.io/ClimSim)
    and the climsim-online repository were not read.
  confidence: medium
  review_checks:
    - check: climate-projection or another home. ClimSim has no emissions or forcing scenarios (one
        present-day climate, 2005-2014 boundary conditions), which the leaf's definition asks for;
        it is filed there as the nearest leaf for climate-model emulation, and a tag-gap proposes a
        leaf for it. physics/simulation-surrogates as primary was considered; the family exclusion
        test keeps an Earth-system process in earth-climate.
      field: domain
      source: src-arxiv-2306-08754-v6
      quote: which have been generated to reflect a climatological average of the 2005-2014 period
    - check: One entry for three protocols (offline v1, the Kaggle edition, ClimSim-Online). Whether
        the Kaggle competition, with its own variable list, hidden rows and single weighted R2,
        should be its own entry, and whether version_kind edition fits a one-off competition.
      field: versions
    - check: aggregation_policy official-aggregate rests on the Kaggle score. The paper reports each
        variable apart and the online metrics have no aggregate, so none-by-design or unknown are
        defensible for the paper's protocol.
      field: aggregation_policy
    - check: calibration-uncertainty and uncertainty-calibration-score are rejected because CRPS is
        SI-only; the stochastic baselines (HSR, RPN, cVAE) emit distributions, and a reviewer may
        read CRPS as part of the protocol.
      field: evaluation_method
      specialist: true
    - check: funded-by-evaluated-party is not set. NVIDIA is the primary funder, and the U-Net that
        v6 and the follow-up treat as the online state of the art is by authors at NVIDIA; no NVIDIA
        product is evaluated, but the U-Net could be read as an evaluated party's system.
      field: governance.independence_flags
      source: src-arxiv-2306-08754-v6
      quote: Primary support is by NVIDIA, the National Science Foundation (NSF) Science and
        Technology Center (STC) Learning the Earth with Artificial Intelligence and Physics
    - check: activity closed assumes Kaggle's late-submission route, if open, does not count. The
        competition pages and record read do not say whether late submissions are accepted.
      field: activity
    - check: reproducibility_tier automatable-with-simulator and compute_tier simulator-required
        follow the online evaluation; if the offline R2 is taken as the headline, fully-automatable
        and a GPU tier would apply.
      field: execution.reproducibility_tier
    - check: ceiling_anchor_type theoretical-maximum is for the offline and Kaggle R2; the online
        errors are read against internal unpredictability from reruns of the reference simulation, a
        noise-ceiling for those metrics.
      field: data.ceiling_anchor_type
      source: src-arxiv-2306-08754-v6
      quote: Additionally, to estimate the inherent unpredictability of the atmospheric system, we
        ran three additional pure physical simulations with the same initial conditions.
    - check: The paper says several thousand participants entered the Kaggle competition; Kaggle's
        record gives 877 competitors in 693 teams (5,177 users joined), and the follow-up says about
        700 teams. The entry uses Kaggle's counts.
      field: events
      source: src-arxiv-2306-08754-v6
      quote: global participants in a Kaggle ML competition based on the ClimSim dataset
    - check: Current use beyond the maintainers is thin. The follow-up is by the maintainers' group,
        and the November 2025 abstract's last author is a ClimSim author; an independent 2025-2026
        result was not found through arXiv's and OpenAlex's searches (Semantic Scholar's API refused
        with 429). The follow-up also says ClimSim holds a single climate and that a new dataset may
        be needed, which may signal a successor.
      field: lifecycle
      source: src-arxiv-2511-20963-v4
      quote: Unfortunately, ClimSim only contains data from a single climate.
    - check: maintainer_type academic-lab follows chaosbench for LEAP's organisations; LEAP is an
        NSF centre spanning several institutions and the README calls the authors a consortium, so
        community-collective is the alternative.
      field: governance.maintainer_type
      source: src-github-climsim-readme
      quote: developed by a consortium of climate scientists and ML researchers

    version_kind: revision
    released: 2023-11-03
    changes: Western North Pacific only, Channel 1 (infrared), seasons 1978-2022, Lambert azimuthal
      equal-area projection; pyphoon2. Now obsolete and available on request.
    superseded_by: v2
    frozen: true
    sources:
      - src-arxiv-2311-02665-v1
      - src-nii-digital-typhoon-dataset
  - version: v2
    label: Digital Typhoon Dataset V2, the multi-basin edition
    version_kind: revision
    released: 2024-11-26
    changes: The AU (Southern Hemisphere, BoM best track, regraded with JMA's thresholds) set added,
      the 2023 WP season added, and the projection changed to azimuthal equidistant, so the whole
      dataset was regenerated and V1 files cannot be mixed with it. Same format and loader.
    breaking: true
    supersedes_version: v1
    superseded_by: v3-2025.r1
    frozen: true
    sources:
      - src-arxiv-2411-16421-v1

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2311-02665-v1
    - src-arxiv-2311-02665
    - src-arxiv-2411-16421-v1
    - src-arxiv-2610-21654-v1
    - src-nii-digital-typhoon-dataset
    - src-nii-digital-typhoon-dataset-v3
    - src-github-digital-typhoon-readme
    - src-arxiv-2507-03578-v1
  sources_note: >
    The V1, V2 and V3 papers' v1 PDFs (DOI sources, not archived) read as text, and V1's arXiv abstract
    page for the date and venue; the project's English dataset page and V3 page with scripts and styles
    stripped; the README pinned at commit 421f837 (2026-10-16); and SciVid's v1 PDF as evidence of current
    use. The V2 and V3 abstract pages were read for their licences and dates but are not Sources. The
    DIAS record behind the DOI was not read.
  confidence: medium
  review_checks:
    - check: remote-sensing primary rests on the headline task, intensity regressed from one image,
        and on V3's benchmark being regression only. The forecasting subsets override to
        weather-forecasting. Whether forecasting an existing cyclone's intensity or transition is
        weather-forecasting or hazard-prediction is not decided by the taxonomy, since
        hazard-prediction has no tests; an undefined-boundary record was logged.
      field: domain
    - check: scientific-prediction is assigned for the analysis tasks as well as the forecasting
        ones, on the reading that central pressure is inferred from the cloud pattern rather than
        seen, as flood extent is in sen1floods11 (where the term was rejected). A reviewer may keep
        it for the forecasting subsets only.
      field: capability
    - check: exact-match is not tagged although V1's appendix reports plain grade accuracy; the
        paper steers the benchmark to regression. V2's grade precision and ETS balanced accuracy and
        F1 are classification-metric.
      field: evaluation_method
    - check: classical-algorithm rests on V2's persistence and TIFS rows and SciVid's persistence
        and mean-pressure baselines, all in the forecasting subset; V1 names the Dvorak technique
        and SHIPS but scores neither.
      field: designed_for_subjects
      source: src-arxiv-2411-16421-v1
      quote: The first is a naive persistent forecast, which simply repeats the last known value for
        central pressure.
    - check: maintainer_type academic-lab. NII is a national research institute under a research
        organisation, not a university; if a source confirming it as a public body is read,
        government-agency fits better.
      field: governance.maintainer_type
    - check: independence_flags is empty. The V2 and V3 papers publish the maintainers' own
        forecasting and weighting models beside baselines; they are release papers and no ranking is
        kept, so maintainer-competes-on-own-benchmark was not set, as for sen1floods11's baselines.
      field: governance.independence_flags
    - check: The V3 paper's numbers were computed on V3-2025.R1, which is not distributed; the
        paper's retraining on R2 shows small differences, but exact reproduction needs R1 on
        request.
      field: versions
      source: src-nii-digital-typhoon-dataset-v3
      quote: We don't release V3-2025.R1, which we used for benchmarking in the paper.
    - check: versioned-releases rests on V1, V2 and V3 and V3's naming rule. V1 announced an
        in-place update with the 2023 season for early 2024, replacing the ZIP file; whether it was
        issued, and under what label, before V2 was not checked. If it was issued unlabelled,
        rolling-live fits the V1 period.
      field: data.refresh
      source: src-arxiv-2311-02665-v1
      quote: replace the current ZIP file with a new one
    - check: Hourly labels are interpolated from a six-hourly best track (persistence for wind,
        linear for pressure), so most scored images carry interpolated, not analysed, values; V2
        counts 78.8%.
      field: ground_truth_source
      source: src-arxiv-2411-16421-v1
      quote: 152,034 images, representing 78.8% of the whole dataset
    - check: Several conditions that move a score (release and last season, split rule, channel,
        image type, epoch reported) have no EvalConditions field, so claims that differ on them can
        share a comparability key.
      field: comparability
    - check: code_licence MIT rests on V1's statement; GitHub reports no licence for the repository,
        and pyphoon3, V3's library, sits in a repository that was not read.
      field: execution.code_licence
      source: src-github-digital-typhoon-readme
      quote: is a machine-learning library for the Digital Typhoon Dataset.
  personal_data_excluded:
    - source: src-arxiv-2507-03578-v1
      what: The corresponding authors' e-mail addresses in the PDF's author block; the extract's
        windows leave them out.
    - source: src-nii-digital-typhoon-dataset
      what: The list of internship students' names in the page's acknowledgment; the extract's
        windows leave it out.

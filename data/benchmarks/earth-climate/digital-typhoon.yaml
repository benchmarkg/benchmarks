    label: Digital Typhoon Dataset V3-2025.R1, the release the V3 paper benchmarks on
    version_kind: revision
    changes: Channels 2 to 4 (a second infrared, water vapour and near infrared) added beside
      Channel 1, the 2024 and 2025 seasons added for both basins, a new directory layout and
      variable name for pyphoon3, and the SS-L2 season split as the benchmark protocol. Never
      distributed; available on request.
    breaking: true
    supersedes_version: v2
    superseded_by: v3-2025.r2
    errata:
      - scope: Channels 1-3, 4,102 images (579 of them already in V1, 616 in V2)
        description: Blank images from missing recalibration coefficients or conversion tables, and
          46 GOES-9 images over the 30% missing-area limit, corrected or removed in V3-2025.R2. None
          is in the 2024-2025 evaluation seasons.
        source: src-arxiv-2610-21654-v1
    frozen: true
    sources:
      - src-arxiv-2610-21654-v1
      - src-nii-digital-typhoon-dataset-v3
  - version: v3-2025.r2
    label: Digital Typhoon Dataset V3-2025.R2, the distributed V3 release
    version_kind: revision
    released: 2026-10-16
    changes: The R1 corrections applied; the evaluation sets are identical to R1's and only the
      training sets differ, by at most about 1% of a channel's images. Retraining five
      configurations moved the median RMSE by about 0.1 hPa on WP and within run-to-run variation on
      AU.
    supersedes_version: v3-2025.r1
    frozen: true
    sources:
      - src-arxiv-2610-21654-v1
      - src-nii-digital-typhoon-dataset-v3
      - src-nii-digital-typhoon-dataset

subsets:
  - id: digital-typhoon#intensity-regression
    label: Intensity analysis, central pressure or maximum wind regressed from one image
    scored_separately: true
    evidence:
      - source: src-arxiv-2311-02665-v1
        quote: regression tasks, which take an image as input and estimate a pressure or wind value
          as output
      - source: src-arxiv-2610-21654-v1
        quote: For single-channel models, we evaluated the Digital Typhoon Dataset V3 for pressure
          and wind regression tasks.
    notes: The headline task. V1 scores it with an 80/20 split by sequence (best pressure RMSE about
      10.1 hPa); V3 scores it per basin (WP, AU) and per channel on the SS-L2 split (best 6.56 hPa
      on WP-1, 7.20 hPa on AU-1).
  - id: digital-typhoon#grade-classification
    label: Intensity analysis, JMA grade classified from one image
    scored_separately: true
    evidence:
      - source: src-arxiv-2311-02665-v1
        quote: Here the target value is the categorical value of grades 2, 3, 4, 5, and 6.
    notes: V1's appendix reports accuracy over five grades (about 70% at best); V2 classifies grades
      2 to 5 and reports per-grade precision on both basins.
  - id: digital-typhoon#intensity-forecasting
    label: Intensity forecasting, central pressure hours ahead
    scored_separately: true
    domain_override:
      primary: earth-climate/weather-forecasting
      secondary:
        - earth-climate/remote-sensing
    capability_override:
      - scientific-prediction
      - perception
    evidence:
      - source: src-arxiv-2311-02665-v1
        quote: 'Table 5: Results of pressure forecasting for 12-hours by ResNet18 (values in hPa).'
      - source: src-arxiv-2411-16421-v1
        quote: 'Table 2: RMSE of central pressure (hPa) for 12, 18, and 24 hours forecasting over 139
          test sequences.'
    notes: V1 predicts the next frames with a ConvLSTM from the 12 preceding hourly images and
      regresses pressure from them, scored at 1, 2, 3, 6 and 12 hours; V2 forecasts pressure at 12,
      18 and 24 hours from three images three hours apart, with persistence and TIFS baselines;
      SciVid uses V1's protocol (as_used).
  - id: digital-typhoon#ets-transition-forecasting
    label: Extra-tropical transition forecasting, 24 hours ahead
    scored_separately: true
    domain_override:
      primary: earth-climate/weather-forecasting
      secondary:
        - earth-climate/remote-sensing
    capability_override:
      - scientific-prediction
      - perception
    evidence:
      - source: src-arxiv-2411-16421-v1
        quote: a binary t + 24 forecasting as output (1 if the typhoon transitions to ETS, 0 if it
          stays a Tropical Cyclone)
    notes: V2 only, on the WP sequences that contain a transition to grade 6 (378/79/78 sequences
      for training, validation and test; its Table 3 says 66 test sequences). Scored by RMSE of the
      raw output, balanced accuracy and F1. The paper warns the task is very unbalanced.
  - id: digital-typhoon#reanalysis
    label: Reanalysis, pressure regression trained and tested across satellite generations
    scored_separately: true
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-arxiv-2311-02665-v1
        quote: we split the dataset into three buckets by satellite generations, namely the first
          generation (1978-2004), the second generation (2005-2014), and the third generation
          (2015-2022)
    notes: V1's third benchmark, a 3 x 3 table of a model trained on one generation and tested on
      each, meant to expose biases from changing sensors and annotation practice.
  - id: digital-typhoon#center-estimation
    label: Typhoon centre estimation from a randomly cropped image
    scored_separately: true
    evidence:
      - source: src-arxiv-2411-16421-v1
        quote: we will introduce the typhoon center estimation task; namely to identify the center
          of the typhoon only from satellite images
    notes: V2 only. A U-Net heatmap model locates the centre in a 256 x 256 crop; scored by mean
      distance error per grade. This split shuffles images and does not keep sequences whole.
  - id: digital-typhoon#cross-basin
    label: Trained on the Western North Pacific, tested around Australia
    scored_separately: true
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-arxiv-2411-16421-v1
        quote: We use the split of the WP dataset to train all models.
    notes: V2 only. Centre estimation, grade classification and pressure regression trained on WP
      and scored on both test basins, with AU images flipped horizontally to align the direction of
      circulation. V3 instead trains and scores each basin on its own data.
subsets_note: V3 also benchmarks multi-channel inputs (Channel 1 + 2, 1 + 3, 1 + 2 + 3) on the
  four-channel intersection of the data; those are input conditions of intensity-regression, not
  subsets of the cyclones.


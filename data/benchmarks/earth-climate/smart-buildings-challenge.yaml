  sources_note: >
    The proposal's v1 PDF (a DOI, not archived) read as text, its extract kept clear of the authors' e-mail
    addresses; its abstract page for the date and the NeurIPS comment; the site's home and competition
    pages with scripts and styles stripped; the starter kit's README at a pinned commit; Kaggle's public
    JSON records of the competition's pages and header (its pages render by script), read without accepting
    the rules; Kaggle's notebook list, withheld from archiving because every row names its author; and
    the Smart Buildings Control Suite's v2 PDF for the simulator's lineage. No 2025-2026 paper reporting
    results on the challenge exists yet; Kaggle's team and submission counts are the evidence of current
    use.
  confidence: medium
  review_checks:
    - check: Placement. The taxonomy names this benchmark as an earth-climate example, and
        energy-systems reads "optimising energy ... demand", but the family's inclusion test asks
        for energy "in a geophysical setting" and its exclusion sends a physical process outside an
        Earth-system context to physics. engineering-design/process-control-optimization fits the
        act by its definition and is rejected only through its family's operated-not-designed
        exclusion. A building's HVAC plant is the stress case the recon note flagged; the entry
        follows the taxonomy's examples, as l2rpn does.
      field: domain
    - check: episodic-return or simulation-rollout. The score is accumulated reward with no floor
        (the comfort penalty is unbounded), which is episodic-return, but the reward is bounded
        above by zero, and episodic-return's inclusion speaks of "no defined maximum".
        ceiling_anchor_type is theoretical-maximum on the same bound. Both methods resolve the
        simulation profile here, so only the facet and saturation handling change.
      field: evaluation_method
      source: src-arxiv-2610-18511-v1
      quote: The reward is bounded above by zero.
    - check: distribution-shift-generalization rather than transfer-learning. The task and reward
        are fixed and the buildings come from the same generator, but the observation and action
        spaces change shape per building, which a reviewer may read as a new embodiment and so
        transfer-learning.
      field: capability
      source: src-smart-buildings-2026-competition
      quote: Across the 6 training buildings, K runs from 3 to 9 and V from 28 to 85, so the
        discrete space spans 4 to 10 bits and the continuous space 67 to 199 values.
    - check: No capability term covers closed-loop control of a non-embodied physical plant;
        sensorimotor-control is defined for a body. Logged with bench tag-gap (proposed
        plant-control).
      field: capability
    - check: Prize split. The proposal gives $2K for Round One and $38K for the final deadline; the
        site and Kaggle give $25,000 for the leaderboard and $15,000 for the paper track. The entry
        follows the competition pages.
      field: governance.funding
      source: src-arxiv-2610-18511-v1
      quote: Round One deadline (NeurIPS poster; $2K in prizes) Paris Workshop Final deadline ($38K
        in prizes)
    - check: Team size and submission form. The proposal allows teams of up to four and an Entry of
        a module, weights and a reproducibility bundle; Kaggle's rules allow five and take a
        notebook only.
      field: governance.submission_process
      source: src-kaggle-smart-buildings
      quote: The maximum Team size is five (5).
    - check: Final deadline time. Kaggle's timeline says every deadline is at 23:59 UTC, but its
        record holds 17:59:59 UTC on 2027-01-15.
      field: activity
      source: src-kaggle-smart-buildings
      quote: All deadlines are at 11:59 PM UTC on the corresponding day unless otherwise noted.
    - check: Real-building trials. The proposal invites top teams to live trials at four physical
        partner sites; Kaggle's description says three real buildings. Neither is scored, and no
        date is given.
      field: governance.known_limitation
      source: src-kaggle-smart-buildings
      quote: Winning solutions may have the opportunity to test their models on three real
        buildings.
    - check: learned_entrant_evidence is a public notebook whose title names residual PPO; its code
        was not read, the organisers ship no learned baseline, and many of the top public notebooks
        are PI or rule-based controllers. The leaderboard was not read because its rows name
        participants.
      field: learned_entrant_evidence
    - check: maintainer_type academic-lab rests on Kaggle naming the University of Washington host
        and sponsor; the organisers span five universities, Mila and four companies, and the code
        sits in a dedicated account with no stated institution, which community-collective's test
        may fit better.
      field: governance.maintainer_type
    - check: The reward differs from the Smart Buildings Control Suite's 3C reward, which is bounded
        in [-1, 0]; the challenge's comfort term is unbounded and occupancy-weighted. Whether the
        suite itself (a 2024-2025 benchmark of 11 real buildings) deserves an entry, with this
        challenge linked to it, is open; lineage is not recorded.
      field: lineage
      source: src-arxiv-2410-03756-v2
      quote: formulated as an approximate regret function, bounded in the range [-1,0]
    - check: The NeurIPS blog's competition-track post (src-neurips-2026-competitions-blog, on main)

# data/benchmarks/earth-climate/geobench-vlm.yaml
#
# P1-S7-T01, earth-climate entry 9 of 9. Filled from the GEOBench-VLM paper, arXiv 2411.19325 read as its v2 PDF
# (2025-03-12, ICCV 2025), and its abstract page; the repository README at main; the project site (scripts and
# styles stripped); Hugging Face's API record of the dataset and its dataset card (ungated, no terms accepted); and
# the v1 PDF of GeoX (arXiv 2605.20006, May 2026), a paper that reports results on it. Every quote below is checked
# by the quote-substring validator against those Sources' committed extracts.

id: geobench-vlm
name: GEOBench-VLM
aliases:
  - GEO-Bench-VLM
tagline: 'VLMs on satellite and aerial imagery: 31 sub-tasks, mostly five-option multiple choice, scored
  by accuracy.'
description: >
  A benchmark of vision-language models on remote-sensing imagery: 31 sub-tasks in 8 categories (scene
  understanding, object classification, object localisation and counting, event detection, captioning,
  referring segmentation, temporal understanding and non-optical imagery), with over 10,000 manually
  verified instructions. Images and labels come from existing open Earth-observation datasets (DOTA, DIOR,
  FAIR1M, xBD, fMoW, PASTIS, So2Sat, QuakeSet and others) in optical, multispectral, SAR, bi-temporal
  and
  multi-temporal form. Most tasks are five-option multiple-choice questions whose wording and distractors
  GPT-4o generated around the source label, one distractor chosen to be close to it; counting distractors
  are the true count shifted by 20% and 40%. Each question carries several phrasings of its prompt.
  Referring expression detection is scored by precision at IoU 0.5 and 0.25, referring segmentation by
  mIoU and captioning by BERTScore. The paper evaluates 13 generic and geospatial VLMs; the best,
  LLaVA-OneVision, averages 41.7% on the multiple-choice tasks, about twice the 20% chance rate. Questions
  and answers are on Hugging Face; the xBD images are fetched from xView2 separately.
self_description:
  source: src-arxiv-2411-19325-v2
  quote: we present GEOBench-VLM, a comprehensive benchmark specifically designed to evaluate VLMs
    on geospatial tasks
external_ids:
  huggingface: aialliance/GEOBench-VLM
  arxiv: '2411.19325'
paper:
  title: 'GEOBench-VLM: Benchmarking Vision-Language Models for Geospatial Tasks'
  arxiv: '2411.19325'
  version_read: v2
  source: src-arxiv-2411-19325-v2
released: 2024-11-28
released_note: The paper's first arXiv version, as the abstract page dates it. The dataset reached
  Hugging Face on 2024-12-01; v2 of the paper (2025-03-12) added models and analysis.
released_source: src-arxiv-2411-19325
released_quote: Submitted on 28 Nov 2024
release_venue: ICCV 2025
release_venue_source: src-github-geo-bench-vlm-readme
release_venue_quote: ICCV 2025

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: earth-climate/remote-sensing
  secondary:
    - multimodal/visual-qa
    - multimodal/visual-grounding
domain_basis:
  reason: Models extract information from satellite and aerial imagery, many labels are Earth-system
    quantities (land use, crop type, fire risk, flooding, disaster damage), and the paper presents
    the benchmark as filling a gap in Earth observation, which the remote-sensing inclusion test
    makes primary. The tasks are posed in language, so the task subdomains the test sends to
    secondary are multimodal ones, which the vision family's exclusion test directs - questions
    answered about an image (visual-qa) and referring expressions resolved to boxes and masks
    (visual-grounding).
  source: src-arxiv-2411-19325-v2
  quote: the earth-observation domain lacks large-scale manually verified benchmarks covering
    diverse capabilities
domain_considered_and_rejected:
  - term: earth-climate/geospatial-reasoning
    reason: Its definition is questions that need reasoning over geographic location. No task asks
      where an image was taken or relates places to one another; the spatial relations asked are
      between two boxed objects within one image (see review_checks).
  - term: earth-climate/hazard-prediction
    reason: Fire risk assessment is the one sub-task that rates a hazard before it happens. The
      other event and temporal tasks classify or count damage already visible, which the
      remote-sensing inclusion test keeps under remote sensing.
    source: src-arxiv-2411-19325-v2
    quote: This focuses on fire risk detection and assesses fire hazards across forests
  - term: vision/classification
    reason: The remote-sensing test sends the vision task to secondary, but every task here is asked
      and answered in language, which the vision family's exclusion test assigns to multimodal. The
      same holds for vision/detection and vision/segmentation.
  - term: multimodal/any-to-any-generation
    reason: Image captioning, scored by BERTScore against reference captions, is one of the 31
      sub-tasks and not the benchmark's claim.
capability:
  - perception
  - grounding
  - temporal-reasoning
capability_basis:
  perception:
    reason: Every task gives an optical, multispectral or SAR image (or a sequence of them) and
      scores what is recovered from it, such as scene class, ship or aircraft type, object counts
      and disaster type.
    source: src-arxiv-2411-19325-v2
    quote: The sensor data includes RGB images, Multispectral Imaging (MSI), and Synthetic Aperture
      Radar (SAR)
  grounding:
    reason: Referring expression detection scores whether a box drawn for a text query lands on the
      object it names (precision at IoU 0.5 and 0.25); referring segmentation does the same with
      masks.
    source: src-arxiv-2411-19325-v2
    quote: This includes referring expression detection, where models predict bounding boxes based
      on text queries
  temporal-reasoning:
    reason: The temporal tasks give pre- and post-event or multi-date images and ask what changed,
      such as whether a farm pond was constructed or demolished or how many buildings were
      destroyed, so the answer depends on which image came first.
    source: src-arxiv-2411-19325-v2
    quote: This category includes tasks such as change detection and damage assessment to identify
      differences over time
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: The spatial-relation task names the relation between two boxed objects (above, left of,
      parked at), which is read off the image rather than inferred, and the other tasks score
      recognition. The paper says its advanced tasks need spatial reasoning, but the inclusion test
      asks for relations that must be inferred.
    source: src-arxiv-2411-19325-v2
    quote: Describe the spatial relationship between object in green box and object in red box
  - term: quantitative-reasoning
    reason: Counting is posed as choosing among five numbers, which the term's exclusion test
      (numbers only as options) rules out.
    source: src-arxiv-2411-19325-v2
    quote: Counting is framed as a classification task with multiple answer choices
  - term: knowledge-recall
    reason: Fine-grained ship and aircraft classes need background knowledge, but the scored outcome
      is recognising what the image shows, which the term's exclusion test leaves out.

evaluation_method:
  - multiple-choice
  - domain-metric
  - model-derived-metric
evaluation_method_basis:
  reason: Most tasks are five-option multiple choice scored by accuracy, chance 20%, and the
    headline is their average. Referring detection is scored by precision at IoU thresholds and
    referring segmentation by mIoU, both detection and segmentation measures (domain-metric).
    Captions are scored by BERTScore, a learned metric whose scoring model the paper does not name
    (model-derived-metric).
  source: src-arxiv-2411-19325-v2
  quote: For MCQ-based tasks, we report accuracy as the evaluation metric. Precision evaluates
    referring expression detection, mIOU measures segmentation performance, and BERT score estimates
    image caption quality
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The multiple-choice average is one method averaged over tasks, and the detection,
      segmentation and caption scores are reported beside it, not combined into it.
designed_for_subjects:
  - instruction-tuned-model
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The benchmark is built to compare generic VLMs prompted directly with an instruction (the
    released scripts ask for the option letter only) and geospatial VLMs post-trained on satellite
    and aerial data (GeoChat, RS-LLaVA, SkySenseGPT, EarthDial, LHRS-Bot-Nova), testing whether that
    specialisation helps; earth-climate is one of domain-specialist-model's disciplines.
  source: src-arxiv-2411-19325-v2
  quote: a comprehensive benchmark suite designed to evaluate VLMs (generic and geospatial-specific)
    on geospatial tasks
as_used:
  - protocol: GeoX reports on 17 of the 31 sub-tasks, grouped into four categories, scoring closed
      answers by exact match and aggregating 32 sampled responses per question by majority vote.
    split: 17 spatial-understanding sub-tasks
    source: src-arxiv-2605-20006-v1
    quote: From GEOBench-VLM, we use the 17 out of 31 tasks that target spatial understanding.
    note: GeoX (May 2026), a self-play method on Qwen-2.5-VL-7B and LLaVA-1.5-7B. Its averages are
      over its own subset and are not comparable with the paper's 41.7%.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced against it; a May 2026 paper reports GEOBench-VLM
    accuracy for its own models and six baselines, GeoChat and EarthDial among them.
  source: src-arxiv-2605-20006-v1
  quote: GeoXQ attains the highest average on EarthVQA (51.2) and GEOBench-VLM (43.3)
activity: no-submission-channel
activity_basis:
  reason: No route for outsiders exists. The README announces a leaderboard as coming soon but none
    has opened, the project site's table holds the paper's own 13 models, and others report in their
    own papers.
  source: src-github-geo-bench-vlm-readme
  quote: The leaderboard will be released shortly. Follow this repository for updates!

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: LLaVA-OneVision
    source: src-arxiv-2411-19325-v2
    observed_on: 2026-10-14
    quote: the best-performing LLaVa-OneVision achieves only 41.7% accuracy on MCQs
  - system: GeoXQ (GeoX on Qwen-2.5-VL-7B)
    source: src-arxiv-2605-20006-v1
    observed_on: 2026-10-14
    quote: GeoXQ attains the highest average on EarthVQA (51.2) and GEOBench-VLM (43.3)
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The constituent datasets' class labels, boxes and masks, reformatted into
  questions; spatial relations were annotated by hand, captions drafted by GPT-4o and refined by
  hand. The answers are public with the questions.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every subset's questions and answers are in the ungated Hugging Face dataset, with the
    images apart from xBD's, which a released script adds after downloading them from xView2.
  source: src-hf-geobench-vlm-card
  quote: Each folder has its own `qa.json` file that provides questions associated images and
    answers.

task:
  exists: true
  input:
    - an optical, multispectral or SAR image of the Earth's surface, or a bi-temporal or
      multi-temporal sequence of them, with a question and five lettered options
    - for the referring tasks, a natural-language expression naming an object or region
  output: An option letter; for referring detection a bounding box, for referring segmentation a
    binary mask, and for captioning a description.
  scoring: Accuracy per multiple-choice task, averaged across tasks for the headline (chance 20%);
    precision at IoU 0.5 and 0.25 for referring detection; mIoU for referring segmentation;
    BERTScore for captions.
  source: src-arxiv-2411-19325-v2
  quote: 'GPT-4o generates unique MCQs with five options: one correct answer, one semantically similar'

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The xBD imagery behind the disaster tasks is not in the Hugging Face copy; the card
    sends users to xview2.org to download it, and that site renders only with JavaScript, so whether
    it needs an account was not read (see review_checks). Every question and answer is in the
    ungated copy.
  access_basis:
    reason: The Hugging Face dataset is public and ungated, with questions, options, answers and
      images for every subset except the xBD images.
    source: src-hf-api-geobench-vlm
    quote: '"gated":false'
  refresh: static
  refresh_basis:
    reason: The questions were released once, in December 2024. Hugging Face's commit history (read
      2026-10-14; not a quoted Source) shows the xBD images taken out on 2024-12-07 and a script to
      add them back in June 2025, which moved images, not items; v2 of the paper and the README's
      later updates added evaluated models and code.
    source: src-github-geo-bench-vlm-readme
    quote: We release the benchmark dataset
  data_provenance:
    - inherited-from-constituents
    - model-generated
    - real-world-instrument
  data_provenance_note: Images and labels are taken from open Earth-observation datasets and turned
    into questions. GPT-4o wrote the question wording, the distractors and the draft captions;
    people checked the options, annotated the spatial relations and refined the captions. The
    imagery is satellite and aerial capture (optical, multispectral, SAR).
  data_provenance_source: src-arxiv-2411-19325-v2
  data_provenance_quote: GEOBench-VLM integrates open datasets, and manual annotation aided with
    automated tools
  contamination_risk: medium
  contamination_risk_note: The questions and answers have been public on Hugging Face since December
    2024, and the images come from public datasets that are older still and are common sources of
    remote-sensing training data. No source read evidences an overlap with a scored model's training
    set.
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: Neither the Hugging Face record nor its card states a licence, and the
    constituent datasets' licences are not restated in the sources read.
  size:
    - count: 10000
      unit: manually verified instructions (over 10,000), in 31 sub-tasks and 8 categories
      source: src-arxiv-2411-19325-v2
      quote: It covers 8 broad categories and 31 sub-tasks with over 10,000 manually verified
        instructions
    - count: 3211
      unit: single-image questions, each with several phrasings of its prompt
      subset: Single (the Hugging Face parquet split)
      source: src-hf-api-geobench-vlm
      quote: '"name":"single","num_bytes":1391235681,"num_examples":3211'

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The GEOBench-VLM authors (Mohamed bin Zayed University of AI, with University College
    London, IBM Research Europe, ServiceNow Research and others), in The AI Alliance's GitHub and
    Hugging Face organisations
  maintainer_basis:
    reason: The code sits in The-AI-Alliance's GitHub organisation and the data in the aialliance
      Hugging Face organisation. Most authors are at MBZUAI, and no institution is stated as the
      holder.
    source: src-hf-api-geobench-vlm
    quote: '"author":"aialliance"'
  maintainer_type: community-collective
  maintainer_type_note: academic-lab was considered, as most authors and the README's contact are at
    MBZUAI, but the artefacts sit in a shared organisation account with no single institution stated
    as holder, which academic-lab's exclusion test sends here (see review_checks).
  submission_process:
    - maintainer-run
  submission_process_note: The project site keeps a leaderboard table of the 13 models the authors
    ran for the paper, per task. No route takes outside results; others report in their own papers.
  submission_process_source: src-geobench-vlm-site
  submission_process_quote: 'Leaderboard Select Tasks: Average Scene Classification'
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2411-19325-v2
      quote: Muhammad Akhtar Munir, Muhammad Sohail Danish, Paolo Fraccaro, Campbell D Watson,
        Levente J Klein, Fahad Shahbaz Khan, et al. Earthdial
  independence_flags_note: Two of the five geospatial models evaluated are the authors' own work.
    EarthDial, by at least four of the eight authors, ranks fourth overall and first in scene
    classification; GeoChat is by four of them as well. GPT-4o, one of the evaluated models, also
    wrote the question wording, distractors and draft captions.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Questions, answers and images are public (the xBD images by a separate download), and
      the scores are option matching and standard metrics, with no human or maintainer-only step.
    source: src-hf-geobench-vlm-card
    quote: Each folder has its own `qa.json` file that provides questions associated images and
      answers.
  harness_availability: reference-implementation-only
  harness_availability_note: The repository's eval_geobenchvlm scripts (released June 2025) run five
    open baselines (LLaVA-1.5, LLaVA-1.6, LLaVA-OneVision, Qwen2-VL, InternVL2) over each prompt and
    save their raw answers as JSON. They contain no code that turns answers into accuracy, and none
    for the referring, segmentation or captioning tasks (read at main, 2026-10-14).
  harness: eval_geobenchvlm (inference scripts for five open baselines)
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for The-AI-Alliance/GEO-Bench-VLM, read 2026-10-14;
    not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond llm-static-text: how many responses were sampled per question and how they were reduced to one
  # answer (GeoX takes a majority vote over 32); which of the 31 sub-tasks are averaged is subset_used,
  # already in the profile.
  material_extra:
    - n_samples
    - selection_strategy

homepage: https://the-ai-alliance.github.io/GEO-Bench-VLM/
repository: https://github.com/The-AI-Alliance/GEO-Bench-VLM
dataset_url: https://huggingface.co/datasets/aialliance/GEOBench-VLM

tags:
  - remote-sensing
  - earth-observation
  - vision-language-models
  - multiple-choice
  - change-detection
  - sar

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2411-19325-v2
    - src-arxiv-2411-19325
    - src-github-geo-bench-vlm-readme
    - src-geobench-vlm-site
    - src-hf-api-geobench-vlm
    - src-hf-geobench-vlm-card
    - src-arxiv-2605-20006-v1
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the date and licence;
    the
    README at main, withheld from archiving because it prints an author's e-mail address; the project
    site
    with scripts and styles stripped; Hugging Face's API record of the dataset and its ungated card; and
    GeoX's v1 PDF (a DOI) as evidence of 2026 use. The repository's licence, last push (2026-03-09) and
    scripts were read through GitHub's API, not as quoted Sources.
  confidence: medium
  review_checks:
    - check: "Primary domain: remote-sensing was chosen over geospatial-reasoning, whose definition is
        reasoning over geographic location, which no task asks for. multimodal/visual-qa could instead
        be primary, since the multimodal family's inclusion test also says primary for answering questions
        about an image; earth-climate's and vision's tests were read as overriding it for Earth-observation
        imagery, with the multimodal leaves secondary."
      field: domain.primary
      source: src-arxiv-2411-19325-v2
      quote: the earth-observation domain lacks large-scale manually verified benchmarks covering
        diverse capabilities
    - check: data.access fully-open rests on the Hugging Face copy. The xBD images for the disaster
        tasks must come from xview2.org, which could not be read without JavaScript; if every route
        to them needs an account, gated-registration applies.
      field: data.access
      source: src-hf-geobench-vlm-card
      quote: This repository does not include xBD dataset images by default.
    - check: maintainer_type community-collective (shared AI Alliance organisation accounts) or
        academic-lab (MBZUAI, where most authors and the README's contact are).
      field: governance.maintainer_type
    - check: submission_process maintainer-run rests on the site's leaderboard table, which holds
        only the paper's own 13 models; literature-only is the alternative if that table counts as
        the release paper's baselines.
      field: governance.submission_process
      source: src-geobench-vlm-site
      quote: 'Leaderboard Select Tasks: Average Scene Classification'
    - check: maintainer-competes-on-own-benchmark rests on benchmark authors co-authoring two
        evaluated models (EarthDial and GeoChat), not on a model built for the board. That GPT-4o
        both wrote the items and is evaluated has no flag of its own.
      field: governance.independence_flags
    - check: temporal-reasoning and grounding each rest on a minority of sub-tasks (the five
        temporal tasks; referring detection and segmentation), and spatial-reasoning was rejected
        because the relations asked are read off the image.
      field: capability

    notes: Datasets whose scores dropped significantly when only RGB bands were given.
subsets_note: Spatial resolution is recorded here because no conditions field holds it. A
  GEO-Bench-2 paper ablation coarsened the test images' ground sample distance and scores fell
  (quoted in capability_considered_and_rejected and review_checks), and GEO-Bench warns that
  crop-and-resize augmentation lowers resolution, so a result is comparable only at the task's
  native resolution and with the same resizing.


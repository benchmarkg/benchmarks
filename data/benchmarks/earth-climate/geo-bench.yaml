# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2306-03831-v2
    - src-arxiv-2306-03831
    - src-arxiv-2511-15658-v2
    - src-arxiv-2511-15658
    - src-github-geo-bench-readme
    - src-github-geo-bench-2-readme
    - src-github-geo-bench-2-leaderboard-readme
    - src-arxiv-2605-12678-v3
  sources_note: >
    Both papers' latest PDFs (DOIs, not archived) read as text, and their abstract pages for dates; the
    three READMEs at main; and the audit's v3 PDF as evidence of current use. GitHub's and Hugging Face's
    APIs were read for licences, push dates, gating and the leaderboard's result files, and are cited
    in notes, not as Sources. The Hugging Face leaderboard Space is a Docker app and was not scraped.
  confidence: medium
  review_checks:
    - check: The entry is GEO-Bench with GEO-Bench-2 as its second edition, as GEO-Bench's README
        calls it the successor and Lacoste is the corresponding author of both. But the holder
        changed (ServiceNow to the AI Alliance), only three datasets carried over, and the stress
        corpus and taxonomy examples treat geo-bench-2 as its own id. It could instead be its own
        entry with lineage.supersedes.
      field: versions
      source: src-github-geo-bench-readme
      quote: GEO-Bench-2 is the successor to GEO-Bench, published by the AI Alliance
    - check: Spatial resolution has no EvalConditions field, so it is recorded per task in subsets
        and reaches a claim only through subset_used. Resizing, cropping or coarsening the images
        changes it and the score (GEO-Bench-2's GSD ablation; GEO-Bench's warning on
        crop-and-resize). A resolution field, or a ruling that subset_used suffices, is needed; this
        task could not file a tag gap or write a conditions record.
      field: comparability.material_extra
      source: src-arxiv-2511-15658-v2
      quote: Both figures highlight that increasing GSD tends to lower test metrics across all
        models.
    - check: Every per-task ground sample distance and sensor in subsets was read from the text
        layer of the two papers' tables, matched by row order to the name column. Check each against
        Table 1 (GEO-Bench) and Table 2 (GEO-Bench-2) in the PDFs. GEO-Bench gives the RGB bands'
        resolution only, and GEO-Bench-2 one value per dataset.
      field: subsets
    - check: Dataset licences are mixed and the sources disagree. Read in row order, GEO-Bench-2's
        Table 2 gives DynamicEarthNet CC-BY-4.0, PASTIS CC-BY-4.0, KuroSiwo MIT and SpaceNet2
        CC-BY-SA-4.0, while the Hugging Face tags (API, 2026-10-14) give cc-by-sa-4.0, etalab-2.0,
        cc and cc-by-4.0. GEO-Bench's bundle is tagged cc-by-sa-4.0 as a whole against Table 1's
        per-task licences.
      field: data.dataset_licence
    - check: maintainer_type community-collective follows the stress corpus for the current edition;
        GEO-Bench was held by ServiceNow (industry-lab), and the AI Alliance's legal form was not
        looked up.
      field: governance.maintainer_type
    - check: accepting-submissions rests on the stated pull-request route, but the leaderboard's
        only result sets are the maintainers' own release runs, its repository was last pushed on
        2026-01-19, and no outside submission was seen.
      field: activity
      source: src-github-geo-bench-2-leaderboard-readme
      quote: Create a pull request to main
    - check: GEO-Bench-2 is marked not frozen and refresh versioned-releases, but several of its
        Hugging Face datasets were modified in December 2025 and January 2026 (API lastModified),
        after the paper, with no version label stated for the change.
      field: data.refresh
    - check: The independence flag rests on IBM authors of TerraMind and Prithvi-EO-2.0 being
        GEO-Bench-2 authors (and, for GEO-Bench, ServiceNow's SeCo among the baselines); the rows
        are the paper's baselines, not models built for the board.
      field: governance.independence_flags
      source: src-arxiv-2511-15658-v2
      quote: Some examples include TerraMind-V1-Large for its multi-spectral and Multi-Temporal
        capabilities
    - check: sample-efficiency was rejected although GEO-Bench ships official training subsets (1%
        to 100%) and the paper reports results along them.
      field: capability

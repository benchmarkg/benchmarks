    - src-tudelft-l2rpn-delft-2023
    - src-artelys-l2rpn-2023-report
    - src-codabench-docs-codalab-in-2025
    - src-arxiv-2504-08210-v2
    - src-arxiv-2503-15190-v2
    - src-arxiv-2503-23101-v2
  sources_note: >
    The six arXiv PDFs (DOIs, not archived) were read as text, their extracts kept clear of the authors'
    e-mail addresses and of participants' handles in the leaderboards; their abstract pages were read
    for dates, venues and licences and are not quoted Sources. The L2RPN site's pages, the CodaLab, TU
    Delft, Artelys and Codabench pages and the Grid2Op documentation were read with scripts and styles
    stripped; the README at a pinned commit. All non-DOI Sources are pending archiving. The extracts were
    built with the extract builder's windowing done on offsets mapped back from the casefolded text, because
    the PDFs' ligatures shift raw offsets (see the report). Evidence of current use is the 2025 ECML paper,
    with the 2025 survey and RL2Grid beside it; no 2026 paper was found in a short search.
  confidence: medium
  review_checks:
    - check: Domain. earth-climate/energy-systems rests on the subdomain's "grid operation" and the
        family's smart-buildings-challenge example. games-planning's inclusion test (episodes
        against a responding environment) also fits literally, and the engineering-design scoping
        survey listed L2RPN as a boundary case with process-control-optimization. Confirm the home.
      field: domain
    - check: Identity. The entry is the series, with editions as versions, the NeurIPS 2020 tracks
        as subsets and Delft 2023 as an event. Grid2Op could be argued a separate benchmark (RL2Grid
        and others build on it), and the editions differ enough (grid, actions, score) to be entries
        of their own.
      field: versions
    - check: The 2023 Ile-de-France edition is recorded from Grid2Op's docs and Artelys's report
        alone; its dates, scoring, winners and platform were not read. The survey says the 2023
        repeat of the 2022 competition (Delft) was won by another team, with Artelys second, which
        may be the Delft event rather than the Ile-de-France edition. No edition after 2023 was
        found.
      field: versions
      source: src-arxiv-2504-08210-v2
      quote: The competition of [33] was repeated in 2023 [36]
    - check: activity between-rounds assumes the series may recur; with CodaLab gone and nothing
        since 2023, closed could be argued if the organisers have ended it. released is null because
        no source gives the 2019 opening day.
      field: activity
    - check: capability. adversarial-robustness and distribution-shift-generalization each rest on
        one NeurIPS 2020 track (carried as subset capability_overrides); later environments keep an
        opponent. planning was rejected because the source does not claim to score plans.
      field: capability
    - check: data.access is private-test-server for the editions' blind rankings, but RTE now
        provides the 2022 test environment and later papers score on it; whether other editions'
        test scenarios are public was not established. reproducible_by_third_party false follows the
        editions, not the post-competition protocol.
      field: data.access
    - check: ceiling_anchor_type theoretical-maximum takes the normalised score's top of 100; no
        entrant has come near it (the 20 cost-optimisation points went unclaimed in 2020), and some
        scenarios may be infeasible.
      field: data.ceiling_anchor_type
      source: src-arxiv-2103-03104-v2
      quote: But none won those points
    - check: maintainer_type industry-lab for RTE, a state-owned company; ChaLearn (a nonprofit)
        co-organises and hosts the site, and Grid2Op has moved to its own GitHub organisation,
        possibly under another holder.
      field: governance.maintainer_type
    - check: The 2019 edition scored line margins with a different function and on pypownet; the
        entry's task and evaluation describe the 2020-on cost-based score. Whether 2019 belongs in
        the series entry as an edition, rather than as a predecessor, is a judgement.
      field: task.scoring

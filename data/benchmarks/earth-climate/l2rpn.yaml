curation:
  added_by: agent (P1-S7-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2103-03104-v2
    - src-arxiv-1912-04211-v1
    - src-arxiv-2207-10330-v1
    - src-l2rpn-chalearn-site
    - src-l2rpn-chalearn-competitions
    - src-github-grid2op-readme
    - src-readthedocs-grid2op-available-envs

# data/benchmarks/earth-climate/climatebench.yaml
#
# P1-S3-T02, checkpoint entry 14 of 20 (copilot off). Filled from the paper's Crossref record (JAMES 2022; the
# publisher refused the PDF to a script, 403, so the abstract is read from the registry), the repository README,
# the Zenodo record of the data, and two arXiv abstracts: a December 2025 paper that reports on it, and the
# maintainer's ClimateBench v2 (2026-10-03). Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# ClimateBench v1.0 only. ClimateBench v2 was announced a week before this entry by the same first author, with a
# different design (any climate model, scored against post-2015 observations and paleoclimate); it is its own entry
# if catalogued, and whether it supersedes v1 is a reviewer check.

id: climatebench
name: ClimateBench
aliases:
  - ClimateBench v1.0
tagline: Emulate a full Earth System Model's 2080-2100 climate under an unseen emissions scenario,
  scored by normalised RMSE.
description: >
  Training data are NorESM2 simulations from CMIP6, AerChemMIP and DAMIP experiments: emissions and concentrations
  of CO2, methane and aerosols in, and annual maps of temperature, diurnal temperature range, precipitation
  and extreme precipitation out. The test is the held-out SSP2-4.5 scenario, scored as spatial, global
  and total normalised RMSE over 2080-2100 for each of the four variables. The paper's baselines are a
  neural network, a Gaussian process and a random forest, and the README's table ranks them by mean total
  NRMSE.
self_description:
  source: src-crossref-10-1029-2021ms002954
  quote: the first benchmarking framework based on a suite of Coupled Model Intercomparison Project,
    AerChemMIP and Detection
paper:
  title: 'ClimateBench v1.0: A Benchmark for Data-Driven Climate Projections'
  source: src-crossref-10-1029-2021ms002954
released: 2021-08-13
released_note: The data's first Zenodo record (v0.1, with the SSP2-4.5 test data held back for a
  hackathon); the paper followed in JAMES in 2022.
released_source: src-zenodo-climatebench
released_quote: 0.1 - Initial release (not including ssp245 data held back for hackathon)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: earth-climate/climate-projection
domain_basis:
  reason: The task is projecting the climate response to an emissions scenario, which is climate
    projection.
  source: src-crossref-10-1029-2021ms002954
  quote: These emulators can predict annual mean global distributions of temperature, diurnal
    temperature range and precipitation
capability:
  - scientific-prediction
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: An emulator predicts the climate state an Earth System Model produces under given
      forcings, scored against that model's output.
    source: src-crossref-10-1029-2021ms002954
    quote: a set of baseline machine learning models that emulate its response to a variety of
      forcers
  distribution-shift-generalization:
    reason: The test scenario (SSP2-4.5) is held out of training, so the emulator is scored on
      forcings it was not fitted to; it was withheld at first release for that reason.
    source: src-github-climatebench-readme
    quote: against the ClimateBench task of estimating key climate variables under future scenario
      SSP245

evaluation_method:
  - statistical-fit
evaluation_method_basis:
  reason: Spatial, global and total NRMSE are error statistics against the simulator's fields.
  source: src-github-climatebench-readme
  quote: The spatial, global and total NRMSE of the different baseline emulators for the years
    2080-2100
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants are learned emulators standing in for a full-complexity Earth System Model,
    scored against what it produced.
  source: src-crossref-10-1029-2021ms002954
  quote: a set of baseline machine learning models that emulate its response to a variety of forcers

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it, for example a December 2025 generative emulator. Its
    maintainer announced ClimateBench v2 on 2026-10-03, which has not yet replaced it (see the
    reviewer checks).
  source: src-arxiv-2512-02268
  quote: On ClimateBench, SPF outperforms strong flow matching baselines and pre-trained models at
    yearly and monthly timescales
activity: no-submission-channel
activity_basis:
  reason: The README's leaderboard lists the paper's three baselines and describes no route for
    others to enter; results by others appear in their papers.
  source: src-github-climatebench-readme
  quote: The models are ranked in order of the mean of the total NRMSE across all tasks

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Spatiotemporal Pyramid Flows (SPF)
    source: src-arxiv-2512-02268
    observed_on: 2026-10-10
    quote: On ClimateBench, SPF outperforms strong flow matching baselines and pre-trained models
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: NorESM2's SSP2-4.5 output, averaged over its ensemble members.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Training, validation and test data are on Zenodo, with processing scripts and baselines in
    the repository.
  source: src-github-climatebench-readme
  quote: The processed training, validation and test data can be obtained from Zenodo

task:
  exists: true
  input:
    - annual emissions or concentrations of CO2, methane, black carbon and sulphur dioxide, as
      global totals or maps
  output: Annual global maps of surface temperature, diurnal temperature range, precipitation and
    90th-percentile precipitation.
  scoring: Spatial, global and total NRMSE per variable over 2080-2100 of SSP2-4.5; the README ranks
    by the mean total NRMSE.
  source: src-github-climatebench-readme
  quote: The spatial, global and total NRMSE of the different baseline emulators for the years
    2080-2100

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: All splits, the test scenario included since v0.3, are open on Zenodo under CC-BY-4.0.
    source: src-zenodo-climatebench
    quote: 0.3 - Added test data
  refresh: versioned-releases
  refresh_basis:
    reason: The data changed in numbered Zenodo releases with stated fixes (0.1 to 1.0).
    source: src-zenodo-climatebench
    quote: 1.0 - Release version to coincide with accepted version of manuscript
  data_provenance:
    - simulation-generated
  data_provenance_note: NorESM2 runs from CMIP6 experiments, processed to one format.
  data_provenance_source: src-github-climatebench-readme
  data_provenance_quote: It consists of NorESM2 simulation outputs with associated forcing data
    processed in to a consistent format from a variety of experiments performed for CMIP6
  contamination_risk: medium
  contamination_risk_note: The test scenario's outputs have been public since v0.3, and the
    simulation archive they come from (CMIP6 on ESGF) is public too. An emulator can be tuned on the
    test fields; nothing prevents it, and no evidence was read.
  contamination_evidence: []
  dataset_licence: CC-BY-4.0
  dataset_licence_source: src-zenodo-climatebench
  dataset_licence_quote: '"license": {"id": "cc-by-4.0"}'

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Duncan Watson-Parris
  maintainer_basis:
    reason: The repository sits in the maintainer's personal GitHub account and the data record
      names him as its only creator; no institution is stated as holding the benchmark.
    source: src-zenodo-climatebench
    quote: '"creators": [{"name": "Duncan Watson-Parris"'
  maintainer_type: individual
  submission_process:
    - maintainer-run
  submission_process_note: The README's table holds the maintainer's own baselines only; no route
    for outside results is described.
  independence_flags: []
  independence_flags_note: None recorded. The ranked rows are the maintainer's baselines, by design.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Public data and a fixed metric; an emulator can be trained and scored end to end.
    source: src-github-climatebench-readme
    quote: The processed training, validation and test data can be obtained from Zenodo
  harness_availability: reference-implementation-only
  harness_availability_note: The repository holds processing scripts and baseline examples built on
    ESEm, not a designated scorer.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for duncanwp/ClimateBench, read 2026-10-10; not a
    quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  material_extra:
    - training_data_policy
  material_waived:
    - field: lead_time
      reason: The facet pair statistical-fit x scientific-surrogate-model resolves the forecasting
        profile, but nothing here is forecast; an emulated 2080-2100 field has no horizon from an
        issue date.
    - field: resolution_window
      reason: Same resolution as lead_time; nothing resolves later, the simulator's fields exist
        now.

homepage: https://github.com/duncanwp/ClimateBench
repository: https://github.com/duncanwp/ClimateBench
dataset_url: https://zenodo.org/records/7064308

tags:
  - climate-emulation
  - cmip6
  - earth-system-models

# --- Curation --------------------------------------------------------------------------------


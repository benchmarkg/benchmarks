# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: NASA Harvest, with the University of Maryland, College Park
  maintainer_basis:
    reason: The repository sits in the nasaharvest GitHub organisation, and the Zenodo record's
      creators are affiliated with NASA Harvest and the University of Maryland, College Park, as are
      the paper's authors. NASA Harvest is the consortium that funded the work.
    source: src-neurips-db-2021-cropharvest-pdf
    quote: This work was supported by the NASA Harvest Consortium (Award #80NSSC17K0625)
  maintainer_type: academic-lab
  maintainer_type_note: No source read states NASA Harvest's legal form or who holds the nasaharvest
    organisation. NASA Harvest is NASA's food security and agriculture programme, led from the
    University of Maryland (background knowledge, not a quoted Source), which makes the holder a
    university group; consortium needs a stated legal form and member governance, and
    government-agency would need NASA itself as the holder.
  submission_process:
    - literature-only
  submission_process_note: No leaderboard, results page or submission route exists; beyond the
    paper's baselines and the repository's scripts that reproduce them, results appear in their
    authors' own papers.
  independence_flags: []
  independence_flags_note: None recorded. The only results the maintainers published with the
    benchmark are the release paper's baselines, by design, and no ranking is kept for anyone to
    compete on. The funders named are NASA, the Lacuna Fund, the SwissRe Foundation, NASA Goddard
    with USAID, and NASA SERVIR, none an evaluated party. Whether the maintainers' later models
    report on the tasks was not checked.
  independence_assessed: true
  funding:
    source: src-neurips-db-2021-cropharvest-pdf
    quote: This work was supported by the NASA Harvest Consortium (Award #80NSSC17K0625)
  known_limitation:
    source: src-neurips-db-2021-cropharvest-pdf
    quote: The agricultural classes in the dataset are not globally harmonized.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: trivial-cpu
  compute_tier_note: Scoring is a pass of scikit-learn metrics over at most a few hundred thousand
    pixels. Training an entrant is the entrant's cost; the paper's own baselines ran on a CPU
    instance.
  compute_tier_source: src-neurips-db-2021-cropharvest-pdf
  compute_tier_quote: We ran all experiments on an AWS t2.xlarge instance.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Open data and the cropharvest package build every task's training and test data and
      score predictions, with no human, physical or maintainer-only step; a fixed default seed fixes
      the evaluation sets.
    source: src-github-cropharvest-config
    quote: so fixing this ensures the evaluation sets consist of the same data no matter
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The cropharvest Python package (pip install cropharvest; 0.7.0 in setup.py at commit
    aa3c94a). CropHarvest.create_benchmark_datasets builds the tasks from TEST_REGIONS and
    TEST_DATASETS in cropharvest/config.py, and TestInstance.evaluate_predictions in
    cropharvest/engineer.py computes AUC ROC, F1 and IoU.
  harness_source: src-github-cropharvest-engineer
  harness_quote: 'def evaluate_predictions(self, preds: np.ndarray) -> Dict[str, float]:'
  code_licence: CC-BY-SA-4.0
  code_licence_note: The repository's LICENSE.txt, which the README names for CropHarvest as a
    whole; GitHub's licence metadata reports CC-BY-SA-4.0 (read 2026-11-04). A Creative Commons
    licence on code is unusual; the README does not distinguish code from data.
  code_licence_source: src-github-cropharvest-readme
  code_licence_quote: CropHarvest has a [Creative Commons Attribution-ShareAlike 4.0 International]
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The (classification-metric, domain-specialist-model) pair resolves to the fallback profile (subset_used).
  # subset_used carries the task (kenya, brazil, togo or china, subsets below). Two more conditions move a
  # CropHarvest number:
  #   training_data_policy -- whether the model saw only the task's training set or also the rest of
  #     CropHarvest (the paper's pre-trained and MAML baselines) or outside imagery (foundation-model
  #     pretraining on Sentinel archives).
  #   harness -- the cropharvest package version, which the paper couples to one data version; the labels
  #     grew from 90,480 to 95,186 between the paper and v14, and the China task arrived with v14.
  # The metric (AUC ROC and F1, or a later user's accuracy) has no EvalConditions field.
  material_extra:
    - training_data_policy
    - harness

aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: The tasks were chosen to be distinct, and each is scored and reported on its own; the
    paper's Table 3 gives AUC ROC and F1 per task and nothing combines them.
  source: src-neurips-db-2021-cropharvest-pdf
  quote: we selected three geographically and semantically distinct tasks with training data sizes
    ranging from


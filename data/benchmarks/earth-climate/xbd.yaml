# data/benchmarks/earth-climate/xbd.yaml
#
# P1-S7-T02, earth-climate entry 13. Filled from the xBD paper, arXiv 1911.09296 read as its v1 PDF (2019-11-21,
# the final report; there is no later version) and its abstract page; the CVF open-access abstract page of the
# preliminary report at the CVPR 2019 Workshops (Creating xBD), for the venue and the early figures; the xView2
# baseline repository's README at commit 821d9f8; the challenge's scoring script, xview2_metrics.py in
# DIUx-xView/xView2_scoring at commit ea0793d (with GitHub's API for licences, creation and commit dates, not
# quoted); and the v2 PDF of Improved MambaBDA (arXiv 2603.01116, VISAPP 2026), a paper that reports the xView2
# scores on xBD. xview2.org serves an empty script shell, and its robots.txt disallows the /js/ path holding the
# bundles that would render it, so nothing on the site (challenge rules, terms, leaderboard, download page) was
# read; no account was registered. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.

id: xbd
name: xBD
aliases:
  - xView2
  - xView2 Challenge
tagline: Building and damage masks from pre- and post-disaster satellite pairs of 19 disasters,
  scored by the xView2 F1.
description: >
  A dataset for building damage assessment from very-high-resolution satellite imagery, made by
  Carnegie Mellon University's Software Engineering Institute with the Defense Innovation Unit (DIU)
  for the xView2 Challenge, whose data and benchmark it is. It holds 22,068 RGB images of 1024 x 1024
  pixels (11,034 pre- and post-event pairs) from 19 natural disasters (hurricanes, floods,
  earthquakes, tsunamis, wildfires, volcanic eruptions, tornadoes and a monsoon), drawn from Maxar's
  Open Data Program at below 0.8 m ground sample distance, with 850,736 building polygons over
  45,361.79 km2. Buildings are outlined on the pre-event image and their polygons carried to the
  post-event image, where each is graded on a Joint Damage Scale from no damage (0) to destroyed (3),
  built with NASA, CAL FIRE, FEMA and the California Air National Guard; environmental factors such
  as smoke, fire, flood water and lava are outlined too. The data is split 80/10/10 into train, test
  and holdout sets; during the challenge the test set scored an open leaderboard and the holdout set,
  kept back, a private one. A system takes a pair and returns a building mask and a per-pixel damage
  mask, and the score is 0.3 times the localization F1 plus 0.7 times the harmonic mean of the four
  per-class damage F1s, damage being scored only on reference building pixels. The paper's baseline
  scored a weighted F1 of 0.2654 on damage. All splits are now released, and 2026 papers still
  report the xView2 F1s on the test split.
self_description:
  source: src-arxiv-1911-09296
  quote: We present xBD, a new, large-scale dataset for the advancement of change detection and
    building damage assessment for humanitarian assistance and disaster recovery research.
external_ids:
  arxiv: '1911.09296'
paper:
  title: 'xBD: A Dataset for Assessing Building Damage from Satellite Imagery'
  arxiv: '1911.09296'
  version_read: v1
  source: src-arxiv-1911-09296-v1
released: null
released_note: No source read dates the data's public release. The preliminary report at the CVPR
  2019 Workshops (June 2019) describes a dataset still being built, with about 700,000 building
  annotations over 5,000 km2; the baseline repository was created on 2019-09-25 (GitHub API, not
  quoted), ahead of the challenge; and the final report, which says the dataset is used by the
  challenge, went to arXiv on 2019-11-21. The challenge's own dates are on xview2.org, which was not
  read.
released_source: src-arxiv-1911-09296
released_quote: '[Submitted on 21 Nov 2019]'
release_venue: IEEE/CVF CVPR 2019 Workshops (preliminary report); arXiv (final report)
release_venue_note: The workshop paper, Creating xBD, is pp. 10-17 of the CVPR 2019 workshop
  proceedings in CVF's open-access copy; the final report on arXiv names no venue. The IEEE Xplore
  version was not read.
release_venue_source: src-cvf-creating-xbd-abstract
release_venue_quote: Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern
  Recognition (CVPR) Workshops, 2019, pp. 10-17

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: earth-climate/remote-sensing
  secondary:
    - vision/segmentation
domain_basis:
  reason: Satellite image pairs of natural disasters are read for the damage each event did to the
    buildings it struck, graded on a scale built with disaster response agencies, and the dataset
    also outlines hazard features (flood water, fire, smoke, lava). The claim is disaster damage
    assessment, not a vision method, and the scored label is a hazard's effect on the land surface,
    so remote sensing is primary and the generic per-pixel segmentation is secondary, as the
    subdomain's inclusion test asks. The family's exclusion test names buildings among generic
    objects, which is why this boundary is logged as a taxonomy gap and left for review.
  source: src-arxiv-1911-09296
  quote: xBD provides pre- and post-event satellite imagery across a variety of disaster events with
    building polygons, ordinal labels of damage level, and corresponding satellite metadata.
  caveat: >
    vision/segmentation was weighed as primary. The operation and the metric are generic, and the
    arXiv record files the paper under computer vision, but the labels are disaster damage grades on
    a scale built with NASA, CAL FIRE, FEMA and the California Air National Guard and grounded in
    damage assessment practice (HAZUS, EMS-98), not generic object classes, and the dataset's stated
    purpose is humanitarian assistance and disaster recovery. It is kept as secondary.
domain_considered_and_rejected:
  - term: earth-climate/hazard-prediction
    reason: The hazards are the subject, but the damage is read from imagery taken after each event,
      not predicted before it; the remote-sensing inclusion test sends mapping a hazard already
      visible in the image to remote-sensing, as Sen1Floods11 is classified.
  - term: vision/classification
    reason: The paper's baseline classifies each building polygon, but the official score compares
      per-pixel damage masks, which is segmentation; no whole-image label is scored.
capability:
  - perception
capability_basis:
  perception:
    reason: The input is a pair of satellite images, and the score measures the building and damage
      masks recovered from them pixel by pixel.
    source: src-github-xview2-scoring-metrics
    quote: dp = dp*lp_b # only give credit to damages where buildings are predicted
capability_considered_and_rejected:
  - term: temporal-reasoning
    reason: The task compares a pre-event and a post-event image of one place, but correctness does
      not depend on order or duration beyond knowing which image is which; the change is read off
      the pair, which is perception.
  - term: distribution-shift-generalization
    reason: The train, test and holdout splits are drawn at 80/10/10 over all 19 disasters, and no
      held-out event, region or sensor is scored as a condition of its own. Later papers' cross-
      dataset tests on other disasters are their own protocols, not the benchmark's.
    source: src-arxiv-1911-09296-v1
    quote: xBD is provided in train, test, and holdout splits in a 80/10/10% split ratio,
      respectively.
  - term: scientific-prediction
    reason: Nothing is predicted beyond what the post-event image shows; the damage is visible, the
      same line the domain tests draw between mapping and hazard prediction.

evaluation_method:
  - classification-metric
evaluation_method_basis:
  reason: Every number is an F1 computed from pixel counts of true and false positives and false
    negatives, a general confusion-matrix statistic. The headline score weights the localization F1
    at 0.3 and the harmonic mean of the four per-class damage F1s at 0.7.
  source: src-github-xview2-scoring-metrics
  quote: score = .3 * lf1 + .7 * df1
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The headline figure combines sub-scores, but every constituent is an F1 of the same
      method, which composite's exclusion test leaves out.
    source: src-github-xview2-scoring-metrics
    quote: the df1 is calculated by taking the harmonic mean of the 4 damage f1 scores (no damage,
      minor damage, major damage, and destroyed)
  - term: domain-metric
    reason: The baseline's localization was also reported as IoU, which domain-metric names, but the
      official score is F1 throughout, and F1 is excluded from domain-metric.
    source: src-arxiv-1911-09296-v1
    quote: The model achieved an IoU of 0.97 and 0.66 for
  - term: ordinal-grading
    reason: The damage classes are ordinal and the paper's baseline used an ordinal loss, but the
      score treats the four classes as separate F1s; no distance between grades is scored.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are networks trained on the xBD training split for building damage
    assessment, a task disaster response defines with its own damage scale; the paper's baseline
    pairs a building segmentation network with a damage classifier. task-specific-supervised-model's
    exclusion test sends tasks a discipline defines here, as Sen1Floods11 and GEO-Bench-2 are
    tagged.
  source: src-github-xview2-baseline-readme
  quote: Our submission uses a combination of a localization polygon detection model and a
    classification model.
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: Segmentation and classification are general vision tasks, but grading building damage
      after a disaster on the Joint Damage Scale is a task the earth-climate discipline (disaster
      response remote sensing) defines, which the term's exclusion sends to domain-specialist-model.
  - term: instruction-tuned-model
    reason: Vision-language models are asked about xBD images in benchmarks built on it, such as
      GEOBench-VLM, but those score answers to questions, not the xView2 masks.

as_used:
  - protocol: Models trained on the tier 1 and tier 3 training parts, validated on the holdout split
      and scored on the test split with the xView2 localization, damage and overall F1s, computed
      pixel-wise; the holdout set, private during the challenge, is used for validation.
    split: test
    source: src-arxiv-2603-01116-v2
    quote: 'provides the data in four parts: tier 1 and tier 3 splits, which are meant to be used together
      as the training set, test split, and a holdout split, which we utilized as the validation split.'
    note: Improved MambaBDA (March 2026, VISAPP 2026), which also runs cross-dataset tests on other
      disasters; those are its own protocol.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against it; a March 2026 paper reports the xView2 F1s on the
    test split for ten model variants and calls the dataset the practical standard for building
    damage assessment benchmarks, and arXiv lists further 2026 papers that use it.
  source: src-arxiv-2603-01116-v2
  quote: Since then, it has become the practical standard for BDA benchmarking thanks to its
    large-scale size, high resolution and diversity.
activity: unknown
activity_note: The challenge ran an open leaderboard on the test set and a private one on the
  holdout set, which the paper said would be released at the challenge's end, and a 2026 paper uses
  the holdout set for validation, so the challenge as run is over. Whether xview2.org still takes
  submissions could not be read (an empty script shell, with its bundles disallowed by robots.txt).

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Improved MambaBDA (FOCAL + ALIGN + AGB), overall F1 79.16 on the test split
    source: src-arxiv-2603-01116-v2
    observed_on: 2026-11-04
    quote: On xBD, the best overall score is achieved by the FOCAL + ALIGN + AGB model
  - system: The xView2 baseline (a U-Net localization model and a ResNet50-based damage classifier)
    source: src-arxiv-1911-09296-v1
    observed_on: 2026-11-04
    quote: For the baseline model, we attained an overall weighted F1 score of 0.2654.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Building polygons drawn on the pre-event images and damage grades given on
  the post-event images by annotators with an in-house tool of CrowdAI, reviewed for consistency;
  experts from the California Air National Guard, NASA and FEMA checked random samples, found about
  2-3% mislabelled and corrected them. The test and holdout labels are public now (data.access).
ground_truth_source_source: src-arxiv-1911-09296-v1
ground_truth_source_quote: These experts found that approximately 2-3% of the annotations had been
  mislabeled.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every split, labels included, is released, and the scoring script that computes the xView2
    score is public, so anyone can train and score a system on the test split.
  source: src-github-xview2-scoring-metrics
  quote: Most likely 'test' unless you have access to holdout set

task:
  exists: true
  input:
    - a pre-disaster and a post-disaster satellite image of the same area, three-band RGB, 1024 x
      1024 pixels, at below 0.8 m ground sample distance
  output: Two greyscale masks of the post-disaster image, one locating buildings and one giving each
    building pixel a damage class (1 no damage, 2 minor, 3 major, 4 destroyed; 0 no building).
  scoring: Pixel-wise over the whole split. Localization F1 is computed on building against
    background. Damage F1 is computed per class only on pixels that are buildings in the reference,
    with damage counted only where a building is also predicted, and the four class F1s are combined
    by harmonic mean. The score is 0.3 x localization F1 + 0.7 x damage F1.
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The test and holdout labels were withheld during the challenge and
    are released now (data.access_by_phase).
  item_definition: One pre- and post-disaster image pair of 1024 x 1024 pixels.
  item_definition_source: src-github-xview2-scoring-metrics
  item_definition_quote: assert img.shape == (1024,1024)
  source: src-github-xview2-baseline-readme
  quote: 0 for no building 1 for building found and classified no-damaged 2 for building found and
    classified minor-damage 3 for building found and classified major-damage 4 for building found
    and classified destroyed

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: The only official copy read of is xview2.org's download, behind an account; whether
    an ungated official copy exists could not be checked, since the site was not read. Third-party
    mirrors were not looked for.
  access_basis:
    reason: The baseline README sends users to xview2.org to register or log in before downloading,
      and a 2026 paper trains and validates on the released holdout split, so the labels are out.
    source: src-github-xview2-baseline-readme
    quote: please register or login to download the data!
  access_by_phase:
    during_edition: training images and labels released; the test set scored an open leaderboard and
      the holdout set, not released, a private one
    during_edition_source: src-arxiv-1911-09296-v1
    during_edition_quote: The holdout set is purposefully not released during the duration of the
      challenge and is meant to be used as a private evaluation set
    after_edition: every split, the test and holdout labels included, released for download
    after_edition_source: src-arxiv-1911-09296-v1
    after_edition_quote: All dataset splits will be made available at the end of the xView 2
      challenge.
    note: The release is shown by the 2026 paper's use of the holdout split (as_used); no source
      read dates it.
  refresh: static
  refresh_note: The final report's figures are those of the released data; the preliminary report's
    smaller figures (about 700,000 annotations over 5,000 km2) describe the dataset while it was
    being built, not a release. No later version was found in the sources read.
  data_provenance:
    - real-world-instrument
  data_provenance_note: The images are Maxar/DigitalGlobe satellite imagery from its Open Data
    Program, released for crisis events, with eight events added to the programme at the project's
    request. The labels were made for xBD by annotators the paper does not describe, with samples
    checked by agency experts, so neither expert-authored nor crowd-authored is tagged.
  data_provenance_source: src-arxiv-1911-09296-v1
  data_provenance_quote: Imagery for xBD was sourced from the Maxar/DigitalGlobe Open Data Program
  contamination_risk: medium
  contamination_risk_note: The test and holdout labels are public, so nothing keeps them out of an
    entrant's training or model selection, and the 2026 paper uses the holdout set for validation.
    The imagery is also in Maxar's public Open Data Program, which pretraining corpora for
    remote-sensing models may contain. No evidence of either was read.
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: The licence is stated on xview2.org, which was not read; the paper, the
    baseline README and the scoring script state none for the data. The imagery's own Open Data
    Program terms were not read either.
  size:
    - count: 22068
      unit: RGB images of 1024 x 1024 pixels (pre- and post-disaster images counted separately)
      subset: all 19 disasters
      source: src-arxiv-1911-09296-v1
      quote: The complete xBD dataset contains satellite images from 19 different natural disasters
        across 22,068 images and contains 850,736 building polygons.
    - count: 11034
      unit: pre- and post-disaster image pairs
      subset: all
      note: The 2026 paper's pair counts (9,168, 933 and 933) are half of the paper's image counts
        per split, which add to 22,068.
      source: src-arxiv-2603-01116-v2
      quote: containing 9168, 933 and 933 pairs of RGB images in the train, test and validation
        sets, respectively.
    - count: 850736
      unit: building polygons
      subset: all
      note: The damage classes add to 425,368 polygons (313,033 no damage, 36,860 minor, 29,904
        major, 31,560 destroyed, 14,011 unclassified), half the total; the paper does not say so,
        but the total appears to count each building on both the pre- and the post-disaster image.
      source: src-arxiv-1911-09296-v1
      quote: are composed of 313,033, 36,860, 29,904, and 31,560 polygons respectively.
    - count: 1866
      unit: images (933 pairs), with 109,724 polygons
      subset: test
      source: src-arxiv-1911-09296-v1
      quote: Split Train Test Holdout Images 18,336 1,866 1,866 Polygons 632,228 109,724 108,784
    - count: 1866
      unit: images (933 pairs), with 108,784 polygons
      subset: holdout
      source: src-arxiv-1911-09296-v1
      quote: Split Train Test Holdout Images 18,336 1,866 1,866 Polygons 632,228 109,724 108,784
    - count: 18336
      unit: images (9,168 pairs), with 632,228 polygons
      subset: train (tier 1 and tier 3)
      source: src-arxiv-1911-09296-v1
      quote: Split Train Test Holdout Images 18,336 1,866 1,866 Polygons 632,228 109,724 108,784
    - count: 19
      unit: natural disaster events (11 tier 1, 8 tier 3)
      subset: all
      source: src-arxiv-1911-09296-v1
      quote: we selected 11 disaster events from an initial list of 19.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Defense Innovation Unit (DIU), U.S. Department of Defense, with Carnegie Mellon
    University's Software Engineering Institute
  maintainer_basis:
    reason: The baseline README says DIU set the challenge, the data and the scoring code sit in the
      DIUx-xView GitHub organisation, and xview2.org hosts the download. The dataset's authors are
      at CMU's Software Engineering Institute, DIU and the Department of Defense, and CrowdAI.
    source: src-github-xview2-baseline-readme
    quote: xView2 is a challenge set forth by [DIU](https://diu.mil) for assessing damaged buildings
      after a natural disaster.
  maintainer_type: government-agency
  maintainer_type_note: The paper lists the Defense Innovation Unit with the Department of Defense
    among its affiliations, and the SEI is a federally funded research and development centre that
    CMU operates for the Department of Defense. academic-lab was considered for the SEI, which built
    the dataset and the baseline; the challenge, its site and its repositories are DIU's.
  maintainer_type_source: src-arxiv-1911-09296-v1
  maintainer_type_quote: Defense Innovation Unit 4Department of Defense
  submission_process:
    - literature-only
  submission_process_note: During the challenge, participants submitted predicted masks, scored on
    the test set for the open leaderboard and on the withheld holdout set for the private one
    (held-out-server, as it was run). The challenge's rules were not read. With every split
    released, results now appear in their authors' papers.
  submission_process_source: src-arxiv-1911-09296-v1
  submission_process_quote: evaluation set during the open leaderboard phase of the challenge.
  independence_flags: []
  independence_flags_note: Not assessed. The challenge's prizes, sponsors and rules are on
    xview2.org, which was not read. The paper's work was funded by the Department of Defense
    (governance.funding), the maintainer's own department, which evaluates no system of its own on
    the benchmark in the sources read; CrowdAI, a company, built the annotation tool and is among
    the authors, and whether it entered was not read.
  independence_assessed: false
  funding:
    source: src-arxiv-1911-09296-v1
    quote: This material is based upon work funded and supported by the Department of Defense under
      Contract No. FA8702-15-D-0002 with Carnegie Mellon University for the operation of the
      Software Engineering Institute
  participation:
    source: src-github-xview2-baseline-readme
    quote: The challenge is open to all to participate
  known_limitation:
    source: src-arxiv-1911-09296-v1
    quote: The descriptions of each damage level have been generalized to handle the wide variety of
      disasters present in xBD, which can result in some amount of label noise.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The images, labels and splits are released (behind a registration) and the scoring
      script is public; a model can be trained and scored end to end with no human or physical step.
    source: src-github-xview2-scoring-metrics
    quote: the total score is calculated a weighted average of the localization f1 score (lf1) and
      the damage f1 score (df1)
  reproducibility_blockers: []
  harness_availability: official-harness
  harness_availability_note: The maintainer publishes the script as reference code showing how the
    challenge's scores are computed; whether the challenge server ran this exact file is not stated.
    The baseline repository also ships a Dockerfile that wraps inference for submission.
  harness: xview2_metrics.py in DIUx-xView/xView2_scoring, at commit ea0793d (2019-11-19)
  harness_source: src-github-xview2-scoring-metrics
  harness_quote: score = .3 * lf1 + .7 * df1
  submission_channel:
    source: src-github-xview2-baseline-readme
    quote: scoring is done at the localization and classification stages
  submission_channel_note: The challenge's submission route, described on xview2.org (not read); the
    README's Docker container writes the two masks the submission was scored on.
  code_licence: BSD-3-Clause
  code_licence_note: GitHub's licence metadata for DIUx-xView/xView2_scoring (read 2026-11-04); not
    a quoted Source. The baseline repository's README says BSD-3-style and GitHub reports
    NOASSERTION for it.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # classification-metric with domain-specialist-model resolves no profile, so the fallback's subset_used stands,
  # carrying the split (test, or holdout, which papers now use for validation). training_data_policy records what
  # the model trained on (tier 1 alone, or tier 1 and tier 3, and any pretraining). decontamination_applied is
  # added because the released test and holdout labels and Maxar's public imagery can reach training. Two more
  # conditions move an xBD number and have no EvalConditions field: whether the damage head is scored on the
  # submitted localization mask (the official rule) or on reference footprints (a classification-only setup some
  # papers use), and the image resolution fed to the model.
  material_extra:
    - subset_used
    - training_data_policy
    - decontamination_applied

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The scoring script defines one headline score, the weighted sum of the localization F1 and
    the harmonic-mean damage F1, and papers report it beside its parts.
  source: src-arxiv-2603-01116-v2
  quote: F1oa = 0.3F1loc + 0.7F1clf. This is used as the main metric to determine which model
    performs better.

homepage: https://xview2.org/
repository: https://github.com/DIUx-xView/xView2_baseline
dataset_url: https://xview2.org/

subsets:
  - id: xbd#test
    label: Test split (the challenge's open leaderboard set)
    scored_separately: true
    evidence:
      - source: src-arxiv-1911-09296-v1
        quote: evaluation set during the open leaderboard phase of the challenge.
      - source: src-arxiv-2603-01116-v2
        quote: containing 9168, 933 and 933 pairs of RGB images in the train, test and validation
          sets, respectively.
    notes: 1,866 images (933 pairs) with 109,724 polygons; the split later papers score on.
  - id: xbd#holdout
    label: Holdout split (the challenge's private evaluation set)
    scored_separately: true
    evidence:
      - source: src-arxiv-1911-09296-v1
        quote: The holdout set is purposefully not released during the duration of the challenge and
          is meant to be used as a private evaluation set
      - source: src-github-xview2-scoring-metrics
        quote: Most likely 'test' unless you have access to holdout set
    notes: 1,866 images (933 pairs) with 108,784 polygons, withheld during the challenge to counter
      gaming, released after it; the 2026 paper read uses it for validation.

history:
  - event: access-changed
    field: data.access
    from: holdout split withheld as the challenge's private evaluation set
    to: every split released for download (behind registration)
    source: src-arxiv-1911-09296-v1
    quote: All dataset splits will be made available at the end of the xView 2 challenge.
    note: The paper promises the release; the 2026 paper's use of the holdout split shows it
      happened. No source read dates it or the challenge's end.

tags:
  - building-damage-assessment

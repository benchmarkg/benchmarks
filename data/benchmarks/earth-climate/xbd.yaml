# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1911-09296-v1
    - src-arxiv-1911-09296
    - src-cvf-creating-xbd-abstract
    - src-github-xview2-baseline-readme
    - src-github-xview2-scoring-metrics
    - src-arxiv-2603-01116-v2
  sources_note: >
    The paper's v1 PDF read as text (a DOI, not archived) and its arXiv abstract page; CVF's
    open-access abstract page of the preliminary CVPR 2019 workshop paper; the baseline README and
    the scoring script, each pinned to a commit; and Improved MambaBDA's v2 PDF (a DOI, not
    archived) as evidence of current use. xview2.org was fetched once (its robots.txt and its root
    page, an empty script shell) and not read further.
  confidence: medium
  review_checks:
    - check: The domain is the hard call. The family's exclusion test names buildings among generic
        objects seen from above, and the arXiv record files the paper under computer vision; the
        primary rests on the label being disaster damage (a hazard's effect, on a scale built with

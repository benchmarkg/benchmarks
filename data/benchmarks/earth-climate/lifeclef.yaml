# data/benchmarks/earth-climate/lifeclef.yaml
#
# P1-S7-T01, earth-climate entry 7 of 9. Filled from imageclef.org's LifeCLEF overview page and its 2024, 2025 and
# 2026 edition pages; the five 2026 task pages (AnimalCLEF, BirdCLEF+, FathomNetCLEF, PestCLEF, PlantCLEF), all
# with scripts and styles stripped; the HAL record of the LifeCLEF 2025 lab overview (LNCS 16089), the latest lab
# overview found, whose full text is not open; the BirdCLEF+ 2026 and PlantCLEF 2026 task overviews in the CLEF
# 2026 Working Notes (CEUR-WS Vol-4283, CC BY 4.0), read as the text of their PDFs; and one BirdCLEF+ 2026
# participant's working note in the same volume as evidence of current use. Kaggle's competition pages render by
# script and carry no text, so what the entry says about Kaggle comes from these sources. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.

id: lifeclef
name: LifeCLEF
aliases:
  - LifeCLEF lab
aliases_note: The stress corpus and the taxonomy's examples call the 2026 edition `lifeclef-2026`;
  this entry is the yearly lab, with that edition as a version and its five tasks as subsets.
tagline: CLEF's yearly biodiversity AI lab, species identification in images, sound and text in
  Kaggle-hosted tasks.
description: >
  A lab of CLEF, the Conference and Labs of the Evaluation Forum, that runs machine-learning challenges
  on biodiversity every year, since 2014 by its own overview page and since 2011 by its 2025 overview.
  Each edition is a set of independent tasks, each with its own data, metric and ranking, and the line-up
  changes from year to year. The 2026 edition had five: AnimalCLEF (clustering photographs of loggerhead
  sea turtles and Texas horned lizards into individual animals, scored by the adjusted Rand index), BirdCLEF+
  (identifying 234 bird, amphibian, insect, mammal and reptile taxa in 5-second windows of Pantanal soundscapes,
  scored by macro-averaged ROC-AUC), FathomNetCLEF (object detection in underwater images trained on incompletely
  labelled data, scored by mAP), PestCLEF (document-level relation extraction on plant pests from web
  documents, scored by F-score) and PlantCLEF (identifying every plant species in high-resolution vegetation-plot
  images, scored by F1 averaged per transect). The 2024 and 2025 editions also ran GeoLifeCLEF (species
  presence prediction from occurrence and remote-sensing data) and FungiCLEF, and 2024 SnakeCLEF. Every
  2026 task ran as a Kaggle competition ranked on a private leaderboard against labels the organisers
  withheld; BirdCLEF+ was a code competition whose notebooks ran on hidden test audio, CPU-only and within
  90 minutes. Results appear in the CLEF Working Notes (CEUR-WS) and a lab overview in Springer's LNCS.
  The lab makes a working note describing each run mandatory, and four of the 2026 task pages rank officially
  only teams that submitted one. A weakness the sources name: BirdCLEF+ 2026's top 20 teams fell within
  about 0.010 ROC-AUC, which its organisers say may not separate them beyond the error of the evaluation
  split.
self_description:
  source: src-lifeclef-2026-site
  quote: LifeCLEF is an international research initiative in the field of biodiversity informatics
    that organizes yearly challenges on the automated identification and understanding of life forms
paper:
  title: 'Overview of LifeCLEF 2025: Challenges on Species Presence Prediction and Identification, and
    Individual Animal Identification'
  doi: 10.1007/978-3-032-04354-2_19
  source: src-hal-05408591
paper_note: The latest lab-level overview found (CLEF 2025, LNCS 16089, Springer, 2026). Its HAL
  record holds the abstract and no deposited file, so the text read is the abstract; no 2026 lab
  overview was found. The 2026 task overviews in CEUR-WS (src-ceur-vol-4283-paper317,
  src-ceur-vol-4283-paper320) are open under CC BY 4.0.
released_note: Left empty. The lab's overview page says it has run since 2014 and the 2025 overview
  says since 2011; no source read dates the first edition.
released_source: src-lifeclef-site
released_quote: The LifeCLEF lab aims at boosting and evaluating the advances in this domain since
  2014.
release_venue: CLEF labs, yearly; participants' and task overviews in CEUR-WS working notes, the lab
  overview in LNCS

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: earth-climate/ecology-biodiversity
  secondary:
    - audio-speech/bioacoustics
    - vision/classification
    - vision/detection
    - language/information-extraction
  per_edition: true
  per_edition_note: The secondaries are the 2026 tasks' method subdomains, which the primary's
    inclusion test asks for (BirdCLEF+ bioacoustics, PlantCLEF multi-label classification,
    FathomNetCLEF detection, PestCLEF relation extraction); AnimalCLEF's clustering into individuals
    has no subdomain and stays under the primary. The task line-up changes by edition. The 2024 and
    2025 tasks add no other leaf (SnakeCLEF and FungiCLEF are classification, and GeoLifeCLEF
    predicts species presence, the primary itself).
domain_basis:
  reason: The lab's own claim is biodiversity across modalities (photographs, soundscapes,
    underwater images, web text), which is the primary's inclusion test and its own lifeclef-2026
    example; every task scores identifying or understanding species.
  source: src-lifeclef-2026-site
  quote: The 2026 edition of LifeCLEF proposes five data-oriented challenges related to the
    identification and understanding of biodiversity
domain_considered_and_rejected:
  - term: earth-climate/remote-sensing
    reason: GeoLifeCLEF (2024, 2025) used high-resolution remote sensing, but as predictors of
      species presence, which the term's exclusion sends to the target's own leaf; no 2026 task uses
      overhead imagery.
    source: src-lifeclef-2025-site
    quote: '(iii) GeoLifeCLEF 2025: species presence prediction based on species occurrences and high-resolution
      remote sensing data'
  - term: earth-climate/agriculture
    reason: PestCLEF's documents concern crop diseases and their pests, but the scored output is
      extracted relations, not an agricultural outcome such as yield or disease incidence.
  - term: audio-speech/audio-event-detection-localization
    reason: BirdCLEF+ scores a probability per species for each fixed 5-second window; no onset
      boundary or direction is scored.
capability:
  - perception
  - distribution-shift-generalization
  - context-integration
capability_basis:
  perception:
    reason: Four of the five 2026 tasks score what was recovered from a raw signal, photographs,
      soundscape audio or underwater images (the subsets carry the per-task split).
    source: src-fathomnetclef-2026-site
    quote: identifying both the presence and location of marine organisms across diverse habitats
  distribution-shift-generalization:
    reason: PlantCLEF trains on close-ups of single plants and scores vegetation-plot images with
      the same species label set, and BirdCLEF+ trains mainly on focal recordings and scores field
      soundscapes; the label set stays and only the inputs move, the term's tie-break against
      transfer-learning.
    source: src-plantclef-2026-site
    quote: The main difficulty of the task lies in the shift between the test data (high-resolution
      multi-label images of vegetation plots) and the training data (single-label images of
      individual plants).
  context-integration:
    reason: PestCLEF supplies the web documents and scores the relations extracted from them, so the
      supplied text determines the answer.
    source: src-pestclef-2026-site
    quote: The task is a knowledge graph extraction task and is framed as a document-level relation
      extraction problem.
capability_considered_and_rejected:
  - term: transfer-learning
    reason: PlantCLEF's test images are multi-label where its training images are single-label, but
      the species vocabulary is unchanged and no transfer is reported as such, which the term's
      tie-break gives to distribution-shift-generalization.
  - term: calibration-uncertainty
    reason: BirdCLEF+ and FathomNetCLEF consume per-class scores, but through rank-based ROC-AUC and
      mAP, chosen so that no threshold or calibration is assessed.
    source: src-ceur-vol-4283-paper317
    quote: using rank-based metrics like ROC-AUC helps standardize performance assessments without
      requiring species-specific threshold calibration
  - term: sample-efficiency
    reason: BirdCLEF+ 2026 had 28 target taxa with no focal training recordings and AnimalCLEF's
      data is small, but no task fixes a sample budget and scores performance at it.

evaluation_method:
  - classification-metric
  - domain-metric
evaluation_method_basis:
  reason: Four 2026 tasks are scored by general-purpose statistics of predicted labels, scores or
    clusters, AnimalCLEF by the adjusted Rand index, BirdCLEF+ by macro-averaged ROC-AUC, PestCLEF
    by F-score and PlantCLEF by sample F1 averaged per transect (classification-metric);
    FathomNetCLEF by detection mAP (domain-metric). Each subset carries its own metric's quote.
  source: src-ceur-vol-4283-paper317
  quote: The evaluation metric was a variant of macro-averaged ROC-AUC computed on 5-second
    soundscape clips, excluding classes with no true positive labels in the private test set.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are models built or fine-tuned for species identification and biodiversity
    monitoring, tasks the ecology discipline defines; AnimalCLEF and PlantCLEF supply pretrained
    domain models, and the leading BirdCLEF+ entries distil Perch 2.0, a bioacoustic foundation
    model.
  source: src-birdclef-2026-site
  quote: This competition focuses on the development of machine learning models that identify
    wildlife species from passive acoustic monitoring (PAM).
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The entrants are task-trained models, but the tasks belong to ecology, an earth-climate
      discipline, which the term's exclusion sends to domain-specialist-model.
  - term: agent-scaffold
    reason: Some 2026 BirdCLEF+ entries were built with AI coding agents, one by an autonomous agent
      loop, but what is submitted and scored is the trained model in a notebook, not the agent.
    source: src-ceur-vol-4283-paper317
    quote: A notable development in this edition of the challenge was the adoption of AI coding
      agents
as_used:
  - protocol: An offline harness on the 66 labelled soundscape files released with BirdCLEF+ 2026,
      scoring macro-AUC over only the 75 species with positive labels there, used to rank
      configurations; the official public and private leaderboard scores are reported beside it.
    split: BirdCLEF+ 2026 released training soundscapes; public and private leaderboards
    source: src-ceur-vol-4283-paper333
    quote: To rank configurations offline we built a harness on the 66 released labelled soundscape
      files, with macro-AUC restricted to the 75 species that carry positive labels there
    note: A single-author entry in the CLEF 2026 Working Notes. It scored 0.932 on the public
      leaderboard and 0.917 on the private one, and its harness sits near 0.99 because of the
      restricted class set, so its numbers are not on the official scale.

lifecycle: active
lifecycle_basis:
  reason: The 2026 edition ran from February to June 2026 and its task overviews were published on
    2026-10-04; BirdCLEF+ alone drew 5,026 participants.
  source: src-ceur-vol-4283-paper317
  quote: The BirdCLEF+ 2026 competition attracted 5,026 participants, organized in 4,094 teams, who
    submitted 152,756 runs.
activity: between-rounds
activity_note: imageclef.org has no LifeCLEF 2027 page (HTTP 404 on 2026-10-14) and no page read
  announces a 2027 edition or date. Whether Kaggle still takes late submissions on the 2026
  competitions was not checked; such scores would be unranked.
activity_basis:
  reason: The lab runs yearly editions; the 2026 competitions closed on 7 May 2026 (BirdCLEF+ on 3
    June), the workshop met at CLEF 2026 on 21-22 September, and the working notes were published on
    2026-10-04. No round is open and none is dated.
  source: src-ceur-vol-4283-paper317
  quote: published 2026-10-04

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The first-place BirdCLEF+ 2026 solution (student networks distilled from Perch 2.0)
    source: src-ceur-vol-4283-paper317
    observed_on: 2026-10-14
    quote: The first-place solution used teacher-student training to align the student model
      backbones with the embedding space of Perch 2.0.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Expert annotations withheld by each task's organisers and scored on
  Kaggle; BirdCLEF+'s test soundscapes were labelled by 12 Brazilian biologists, PestCLEF's
  documents by 30 plant-disease and NLP experts.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test labels behind every official ranking stay with the organisers, so no outside
    party can recompute a ranked score.
  source: src-pestclef-2026-site
  quote: The annotation guidelines and the datasets are already publicly available, the test set
    annotation remains undisclosed.

task:
  exists: true
  input:
    - photographs of loggerhead sea turtles and Texas horned lizards (AnimalCLEF)
    - 1-minute soundscape recordings from the Pantanal, scored in 5-second windows (BirdCLEF+)
    - underwater images drawn from the FathomNet Database (FathomNetCLEF)
    - web documents on 20 monitored plant pests (PestCLEF)
    - high-resolution images of vegetation-plot quadrats (PlantCLEF)
  output: 'Per task: a cluster per image, one cluster per individual animal; a probability for each of
    234 taxa per 5-second window; bounding boxes with a category and a confidence; relations between Host,
    Pest, Disease, Vector and Location entities; or the set of plant species present in each quadrat.'
  scoring: Each task is ranked on its own Kaggle private leaderboard by its own metric, the adjusted
    Rand index, macro-averaged ROC-AUC over the classes with positives in the private test set, mAP,
    F-score, or sample F1 averaged within each transect and then over transects. No score combines
    the tasks.
  tests_hidden_from_system: true
  source: src-lifeclef-2026-site
  quote: The 2026 edition of LifeCLEF proposes five data-oriented challenges related to the
    identification and understanding of biodiversity

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: Training data are downloadable, PlantCLEF's single-plant sets at about 160 to 281 GB,
    and the test inputs without labels for FathomNetCLEF (a COCO-format test file), PestCLEF and
    PlantCLEF. BirdCLEF+ is the exception, a code competition whose test audio never left Kaggle,
    which on its own would be private-test-server. Entry is gated twice, by CLEF's lab registration
    form and by joining each Kaggle competition and accepting its rules; FathomNet images are
    fetched from the FathomNet Database under its terms.
  access_basis:
    reason: The labels of the evaluation sets are withheld while training data and, for most tasks,
      the test inputs are released; withheld labels take precedence over the registration gates.
    source: src-pestclef-2026-site
    quote: The annotation guidelines and the datasets are already publicly available, the test set
      annotation remains undisclosed.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Yearly editions, each with a changed task line-up and, for most tasks, new evaluation
      data. PlantCLEF 2026 reused its 2025 datasets, which the term's test says does not change the
      family's value.
    source: src-plantclef-2026-site
    quote: the task is organized again in a similar format, using the same datasets and Kaggle
      platform as a second round
  data_provenance:
    - real-world-instrument
    - expert-authored
    - curated-public-database
    - inherited-from-constituents
    - web-scraped
  data_provenance_note: Field recordings and photographs (BirdCLEF+'s 35 passive acoustic recorders,
    FathomNet's underwater imagery, PlantCLEF's plot photographs, AnimalCLEF's turtle and lizard
    images), labelled by experts (BirdCLEF+'s soundscapes by 12 Brazilian biologists, PestCLEF's
    documents by 30 plant-disease and NLP experts, AnimalCLEF's identities by field experts,
    PlantCLEF's plots by experts). FathomNetCLEF's images and boxes come from the FathomNet
    Database, a curated archive; PestCLEF reuses the published EPOP dataset of web documents.
    BirdCLEF+'s training recordings come from iNaturalist and Xeno-canto, PlantCLEF's from Pl@ntNet
    and GBIF.
  data_provenance_source: src-ceur-vol-4283-paper317
  data_provenance_quote: Validation and test soundscapes were collected from a grid of 35 passive
    acoustic monitoring stations deployed across 18 distinct locations in Mato Grosso do Sul, Brazil
  contamination_risk: medium
  contamination_risk_note: No source assesses contamination. Routes are plausible for two tasks.
    FathomNetCLEF's test images are drawn from the public FathomNet Database, which holds expert
    boxes for its images, and PlantCLEF 2026 reused the 2025 datasets. BirdCLEF+'s hidden test audio
    and PestCLEF's undisclosed annotations work against a route.
  contamination_risk_source: src-fathomnetclef-2026-site
  contamination_risk_quote: The dataset is derived from the FathomNet Database, which contains more
    than 400k images and 1M expert-curated bounding boxes
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Every task's metric is bounded at 1 (adjusted Rand index, ROC-AUC, mAP,
    F-score, F1), and no task page or overview read reports a human or expert score that results are
    read against.
  dataset_licence: null
  dataset_licence_note: No licence covers the lab's data as a whole; each task's data carries its
    own. FathomNetCLEF's images are under CC0, CC BY or CC BY-NC-ND and its annotations under CC0,
    CC BY or CC BY-NC, per the FathomNet Database's terms; the other task pages read state none.
  dataset_licence_source: src-fathomnetclef-2026-site
  dataset_licence_quote: The images are licensed under one of three Creative Commons licenses
  size:
    - count: 5
      unit: tasks (AnimalCLEF, BirdCLEF+, FathomNetCLEF, PestCLEF, PlantCLEF)
      subset: 2026 edition
      source: src-lifeclef-2026-site
      quote: The 2026 edition of LifeCLEF proposes five data-oriented challenges related to the
        identification and understanding of biodiversity
    - count: 7200
      unit: 5-second evaluation segments from about 600 one-minute soundscapes, over 234 target taxa
      subset: BirdCLEF+ 2026
      source: src-ceur-vol-4283-paper317
      quote: yielding a total of 7,200 evaluation segments of 5 seconds each
    - count: 1425
      unit: fully annotated test images (6,463 training images), 32 categories
      subset: FathomNetCLEF 2026
      source: src-fathomnetclef-2026-site
      quote: The test set, by contrast, is composed of 1,425 fully annotated images.
    - count: 247
      unit: web documents (the EPOP dataset), on 20 monitored pests
      subset: PestCLEF 2026
      source: src-pestclef-2026-site
      quote: The task uses the EPOP dataset, which contains 247 web documents focusing on 20
        monitored pests.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The LifeCLEF lab of CLEF, coordinated from Inria, CIRAD, Chemnitz University of
    Technology and the University of West Bohemia, with a team per task
  maintainer_basis:
    reason: The lab runs the challenges as part of CLEF and publishes them on imageclef.org; its
      2026 page names an overall coordination team and separate organisers for each task, from
      Inria, CIRAD, INRAE, Cornell, Xeno-canto, Google, MBARI and others.
    source: src-lifeclef-2026-site
    quote: LifeCLEF lab is part of the Conference and Labs of the Evaluation Forum (CLEF).
  maintainer_type: conference-workshop
  maintainer_type_note: The term's inclusion test overrides the holder rule for a recurring
    challenge under a conference whose task teams change between editions, even where one lab
    coordinates the series, and names lifeclef-2026 as its example. academic-lab was considered for
    Inria's continuous coordination.
  submission_process:
    - held-out-server
    - containerized-algorithm-submission
    - publication-gated
  submission_process_note: Every 2026 task ran on Kaggle. AnimalCLEF, FathomNetCLEF, PestCLEF and
    PlantCLEF were scored against labels the entrants never saw (held-out-server); FathomNetCLEF
    states that it takes CSV prediction files, PestCLEF and PlantCLEF released their test inputs
    without labels, and AnimalCLEF's page does not say what is uploaded. BirdCLEF+ was a code
    competition in which Kaggle ran each submitted notebook on hidden test audio, CPU-only and
    within 90 minutes (containerized-algorithm-submission, as arc-agi-3's entry reads Kaggle
    notebooks). BirdCLEF+ and PlantCLEF showed a public leaderboard on part of the test set and
    ranked on the private rest (35% and 65%; about 12% and 88%). The lab makes a working note
    describing each run mandatory, and the AnimalCLEF, FathomNetCLEF, PestCLEF and PlantCLEF pages
    put only teams with one in the officially published ranking (publication-gated); the BirdCLEF+
    page only encourages working notes and awards $5,000 to the two best.
  submission_process_source: src-lifeclef-2026-site
  submission_process_quote: Submitting a working note with the full description of the methods used
    in each run is mandatory.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-pestclef-2026-site
      quote: The annotation guidelines and the datasets are already publicly available, the test set
        annotation remains undisclosed.
  independence_flags_note: Each task's organisers hold its test labels, and Kaggle scores every
    submission against them. No prize comes from an evaluated party. BirdCLEF+'s $5,000 for working
    notes is awarded by its organisers, and FathomNetCLEF has no cash prize. The BirdCLEF+ dataset
    was supported by the Bezos Earth Fund, a philanthropy. A Google DeepMind researcher co-organises
    BirdCLEF+, and Google's Perch 2.0 underlies its leading entries. No source shows an organiser
    team entering a system, so maintainer-competes-on-own-benchmark is not tagged (see
    review_checks).
  independence_assessed: true
  participation:
    source: src-ceur-vol-4283-paper320
    quote: Out of the 557 initial entrants who expressed interest in participating, 123 participants
      grouped into 103 teams submitted 16,106 runs.
  known_limitation:
    source: src-ceur-vol-4283-paper317
    quote: This tight clustering makes it difficult to determine whether rank differences reflect
      statistically significant performance gains or fall within the random error margin of the
      evaluation split

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Not one tier for the lab. BirdCLEF+ runs every submission on Kaggle's CPU-only
    notebooks (2 cores, 16 GB of RAM, 90 minutes), which alone would read as provided-allocation;
    the other four tasks take predictions computed on the entrant's own hardware, whose cost no
    source states, and PlantCLEF's training sets run to about 281 GB.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Every ranked score is computed on Kaggle against labels only the organisers hold;
      BirdCLEF+'s test audio is not released at all. Anyone can run the training data and public
      baselines.
    source: src-ceur-vol-4283-paper317
    quote: The challenge was hosted on Kaggle in a code competition format with hidden test data.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: FathomNetCLEF's evaluation notebook, linked from its task page; the other four tasks are
    scored by Kaggle's competition metrics, and the pages read link no code for them
  harness_source: src-fathomnetclef-2026-site
  harness_quote: The evaluation notebook can be found here.
  submission_channel:
    source: src-birdclef-2026-site
    quote: This competition will be held entirely on Kaggle
  code_licence: null
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which task and edition (the line-up, data and metric change every year), which
  # leaderboard (public or private split of the test set), and what the entrant trained on (the tasks allow external
  # data and pretrained models, and AnimalCLEF and PlantCLEF ask for a paired run on the supplied data only).
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: unknown
aggregation_policy_note: Each task has its own metric and Kaggle leaderboard, and no source read
  combines them into a lab score.

homepage: https://www.imageclef.org/LifeCLEF
maintainer_url: https://www.imageclef.org/LifeCLEF2026


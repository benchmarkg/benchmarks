subsets:
  - id: lifeclef#animalclef-2026
    label: AnimalCLEF 2026, discovery and re-identification of individual animals
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-animalclef-2026-site
        quote: Performance will be evaluated using the Adjusted Rand Index (ARI), which measures
          pairwise consistency between the predicted and true clusters.
      - source: src-animalclef-2026-site
        quote: Your goal will be to create clusters of images. Each cluster should correspond to one
          individual animal.
    notes: Test images of loggerhead sea turtles (Zakynthos) and Texas horned lizards are clustered
      into individuals, scored by the adjusted Rand index; MegaDescriptor and the WildlifeReID-10k
      set (about 140,000 images of over 10,000 individuals) are provided for training. Run on
      Kaggle; a working note is required for the official ranking.
  - id: lifeclef#birdclef-plus-2026
    label: BirdCLEF+ 2026, acoustic species identification in the Pantanal
    items: 7200
    scored_separately: true
    domain_override:
      primary: audio-speech/bioacoustics
      secondary:
        - earth-climate/ecology-biodiversity
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-birdclef-2026-site
        quote: This competition involves building models that automatically identify wildlife
          species from their vocalizations in audio recordings collected across the Pantanal
          wetlands.
      - source: src-ceur-vol-4283-paper317
        quote: The primary training set consisted of 35,549 focal recordings from iNaturalist [17]
          and Xeno-canto [18], representing 206 species.
      - source: src-ceur-vol-4283-paper317
        quote: submissions were run in a strict CPU-only notebook environment with a 90-minute
          runtime limit (restricted to 2 CPU cores, 16 GB of RAM, and 30 GB of disk space)
      - source: src-ceur-vol-4283-paper317
        quote: The final ranking (Figure 2) was determined by the private leaderboard score,
          computed on 65% of the test set and kept hidden until the deadline.
      - source: src-birdclef-2026-site
        quote: We encourage participants to submit a working note write-up of their approach to the
          CLEF conference.
    notes: 234 target taxa (162 birds, 35 amphibians, 28 insects, 8 mammals, 1 reptile) in 7,200
      five-second windows of hidden test soundscapes, scored by macro-averaged ROC-AUC over classes
      with positives in the private test set. A Kaggle code competition from 11 March to 3 June
      2026. Its domain override follows the audio-speech family's own example (birdclef-plus) and
      the primary's exclusion for a single species-call task scored as audio.
  - id: lifeclef#fathomnetclef-2026
    label: FathomNetCLEF 2026, positive-unlabeled object detection in marine images
    items: 1425
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-fathomnetclef-2026-site
        quote: The evaluation metric is the mean Average Precision (mAP), applied to the fully
          labeled evaluation set.
      - source: src-fathomnetclef-2026-site
        quote: Submissions must be provided as a CSV file where each row corresponds to a single
          predicted object detection.
      - source: src-fathomnetclef-2026-site
        quote: the FGVC13 Workshop organized in conjunction with the CVPR 2026 conference
    notes: Training on 6,463 images whose labels are incomplete, testing on 1,425 fully annotated
      images in 32 categories, scored by mAP. Held jointly with CVPR 2026's FGVC13 workshop, with no
      cash prize.
  - id: lifeclef#pestclef-2026
    label: PestCLEF 2026, knowledge-graph extraction on plant pests from web documents
    scored_separately: true
    capability_override:
      - context-integration
    evidence:
      - source: src-pestclef-2026-site
        quote: Submissions will be evaluated using standard Information Extraction metrics such as
          the F-Score.
      - source: src-pestclef-2026-site
        quote: Relations reflect ecological interactions and events involving entities such as Host,
          Pest, Disease, Vector, and Location.
    notes: Document-level relation extraction on the EPOP dataset's 247 web documents about 20
      monitored pests, scored by F-score; the entities need not be grounded in the text. The only
      text task in the 2026 edition.
  - id: lifeclef#plantclef-2026
    label: PlantCLEF 2026, multi-species plant identification in vegetation-plot images
    scored_separately: true
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-ceur-vol-4283-paper320
        quote: First, F1 scores are averaged across all quadrat images within the same transect.
          Then, these per-transect averages are averaged across the entire test set.
      - source: src-plantclef-2026-site
        quote: The task is evaluated as a multi-label classification task that aims to predict all
          the plant species on the high-resolution plot images.
      - source: src-ceur-vol-4283-paper320
        quote: used for real-time feedback, and a private leaderboard (e.g., 88% of the test
          quadrats) used to determine the final rankings
    notes: Training on about 1.4 million single-plant images of 7.8k species from Pl@ntNet and GBIF,
      testing on expert-annotated quadrat images; scored by sample F1 averaged within each transect,
      then over transects. A second round on the 2025 datasets. 103 teams submitted 16,106 runs and
      eight shared working notes.
subsets_note: The five 2026 tasks. Each is ranked on its own and none is aggregated with another,
  and each reached entrants through its own Kaggle competition after CLEF lab registration. Each
  capability_override deliberately narrows the lab's three capabilities to the task's own, which the
  validator's subset-drops-terms warnings ask a reviewer to confirm.


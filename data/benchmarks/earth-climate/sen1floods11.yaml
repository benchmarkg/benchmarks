# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-cvf-sen1floods11-pdf
    - src-cvf-sen1floods11-abstract
    - src-crossref-10-1109-cvprw50498-2020-00113
    - src-github-sen1floods11-readme
    - src-gcs-sen1floods11-splits
    - src-arxiv-2601-02315-v1
  sources_note: >
    The paper's CVF open-access PDF read as text (withheld from archiving: its author block holds
    personal e-mail addresses) and its CVF abstract page with scripts stripped; Crossref's JSON
    record of the IEEE version (a DOI, not archived) for the DOI and the workshop's dates; the
    README at master; the bucket's JSON listing of the hand-labelled split files; and Prithvi-CAFE's
    v1 PDF (a DOI, not archived) as evidence of current use.
  confidence: medium
  review_checks:
    - check: distribution-shift-generalization rests on one held-out event, Bolivia, scored as its
        own test set. The paper keeps Bolivia's Sentinel-1 weak labels in the weak training set, so
        the hold-out is complete only for models trained on hand labels, as later papers do.
      field: capability
      source: src-cvf-sen1floods11-pdf
      quote: However, we do include Sentinel-1 based
    - check: classical-algorithm is assigned for the Otsu baseline. With domain-metric it resolves
        the eligibility-gated comparability profile, two of whose fields are waived; dropping the
        subject would leave the fallback profile with the two material_extra fields.
      field: designed_for_subjects
    - check: The paper's PDF Source carries no DOI and is withheld from archiving for its authors'
        e-mail addresses. The DOI (paper.doi) is IEEE's version, which CVF says is identical apart
        from the watermark but which was not read (pp. 835-845 against CVF's 210-211). Whether the
        PDF Source should carry the DOI instead, which would make it citable without a capture.
      field: paper
    - check: Two conditions that change a score have no EvalConditions field, the input bands
        (Sentinel-1, Sentinel-2 or both) and the IoU definition (per-chip mean by water type, or
        pooled water-class IoU and two-class mIoU), so claims that differ on them can share a
        comparability key.
      field: comparability
      source: src-arxiv-2601-02315-v1
      quote: we opted for standard segmentation metrics such as Intersection over Union (IoU) for
        the foreground class (flood in our case) mean Intersection over Union (mIoU)
    - check: v1.1 is recorded as non-breaking by default, but the README says only that it updated
        the dataset; whether hand labels or splits changed was not checked.
      field: versions
    - check: expert-authored rests on the paper's "trained remote sensing analysts", who corrected
        an algorithmic Sentinel-2 classification rather than drawing from scratch; crowd-authored if
        they learned the task for it. The weak labels, rule outputs on real imagery, are not tagged
        synthetic-procedural.
      field: data.data_provenance
    - check: The README names Cloud to Street as the data's producer; whether the company still
        holds the repository and bucket under that name, last touched in 2021, was not checked.
      field: governance.maintainer
  personal_data_excluded:
    - source: src-cvf-sen1floods11-pdf
      what: Three authors' e-mail addresses in the PDF's author block; the extract's windows leave
        them out and the Source is withheld from archiving.
    - source: src-arxiv-2601-02315-v1
      what: The authors' e-mail addresses in the PDF's author block; the extract's windows leave
        them out.
    - source: src-github-sen1floods11-readme
      what: The README's support contact address, a generic mailbox; the extract's windows leave it
        out.

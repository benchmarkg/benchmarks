# data/benchmarks/earth-climate/s2s-ai-challenge.yaml
#
# P1-S7-T02, earth-climate entry 11. Filled from the challenge's GitHub Pages site (s2s-ai-challenge.github.io,
# scripts and styles stripped); the results paper (Vitart et al., BAMS 103(12), 2022), read as the text of the
# publisher's PDF that UPCommons hosts, because journals.ametsoc.org refuses scripted requests; the template
# repository's README at its last commit and GitHub's API record of it, which dates its December 2025 migration
# from the RenkuLab GitLab; the README of ECMWF's climetlab plugin for the data; the leaderboard repository's README
# (its title and last-update line only); the v1 PDF of Horat and Lerch (arXiv 2306.15956), who used the challenge's
# setup after it closed; and Crossref's record of a 2025 AIES follow-up by members of the third-placed team. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# ChaosBench (chaosbench.yaml) is the other subseasonal entry, and the two measure different things. ChaosBench scores
# global daily fields of 124 variables, as control forecasts or ensembles, for each day ahead from 1 to 44 against
# ERA5 reanalysis on 2022, for data-driven emulators. This challenge scores tercile probabilities of two
# surface variables, 2 m temperature and precipitation, for two fortnights (weeks 3-4 and 5-6) against CPC station
# analyses over land on 2020, and its entrants mostly post-process the forecasts of operational models. The task is
# subseasonal forecasting from stated start dates with no forcing scenarios, so the domain is the same leaf.

id: s2s-ai-challenge
name: S2S AI Challenge
aliases:
  - WMO Prize Challenge to Improve Subseasonal to Seasonal Predictions Using Artificial Intelligence
  - s2s-ai-competition
tagline: Tercile probabilities of 2 m temperature and precipitation for weeks 3-4 and 5-6 of 2020,
  scored by RPSS over land.
description: >
  A prize competition run in 2021 by the WWRP/WCRP Subseasonal to Seasonal Prediction Project (S2S Project)
  of the World Meteorological Organization, with the Swiss Data Science Center (SDSC), which hosted the
  code on its RenkuLab platform, and ECMWF, which served the data from the European Weather Cloud. Entrants
  issue probabilistic forecasts of biweekly 2 m temperature and total precipitation for weeks 3-4 and
  5-6, as probabilities of the below-, near- and above-normal terciles on a global 1.5-degree grid, for
  the 53 Thursdays of 2020. They may train on reforecasts of 2000-2019 and real-time 2020 forecasts from
  ECMWF, ECCC and NCEP and on any public data dated before each forecast, most often to post-process the
  dynamical models' output. A scoring bot computed the ranked probability skill score (RPSS) against a
  climatological forecast from NOAA CPC observations, averaged over land between 90N and 60S, both variables
  and both lead times; prizes (CHF 30,000 in all) required beating climatology and a re-calibrated ECMWF
  benchmark (RPSS -0.0016). Of 47 registered teams, 10 submitted and 5 beat both; the winners, from CRIM
  with ECCC, BSC and the University of Connecticut, reached 0.046, 0.029 and 0.006. The 2020 observations
  were public throughout, so the rules required open code, overfitting safeguards and peer review. The
  competition is over, its scorer has stopped and its repositories moved from RenkuLab to GitHub in December
  2025. ChaosBench, the other subseasonal entry, scores daily reanalysis fields of 124 variables to 44
  days ahead for data-driven emulators instead.
self_description:
  source: src-s2s-ai-challenge-site
  quote: The objective of the competition is to improve week 3-4 (weeks 3 plus 4) and 5-6 (weeks 5
    plus 6) subseasonal global probabilistic 2m temperature and total precipitation tercile
    forecasts issued in the year 2020 by using Machine Learning/Artificial Intelligence.
paper:
  title: Outcomes of the WMO Prize Challenge to Improve Subseasonal to Seasonal Predictions Using
    Artificial Intelligence
  doi: 10.1175/BAMS-D-22-0046.1
  source: src-upcommons-bams-d-22-0046-1-pdf
released: 2021-05-04
released_note: The announcement, as the site's timeline gives it. Submissions were accepted from
  2021-06-01 to 2021-10-31; the results paper appeared in BAMS in December 2022.
released_source: src-s2s-ai-challenge-site
released_quote: '4th May 2021: Announcement of the competition'
release_venue: A WMO prize challenge of the WWRP/WCRP S2S Project; results in the Bulletin of the
  American Meteorological Society 103(12), E2878-E2886 (December 2022)
release_venue_source: src-upcommons-bams-d-22-0046-1-pdf
release_venue_quote: the World Meteorological Organization (WMO) coordinated a prize challenge in
  2021 to improve subseasonal prediction

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: earth-climate/weather-forecasting
domain_basis:
  reason: Forecasts are issued on stated start dates (each Thursday of 2020) for stated lead times,
    weeks 3-4 and 5-6, in the subseasonal range, and scored against observations; there are no
    emissions or forcing scenarios. That is the leaf's inclusion test, which runs up to the
    subseasonal-to-seasonal range, as for chaosbench, its example.
  source: src-s2s-ai-challenge-site
  quote: The objective of the competition is to improve week 3-4 (weeks 3 plus 4) and 5-6 (weeks 5
    plus 6) subseasonal global probabilistic 2m temperature and total precipitation tercile
    forecasts issued in the year 2020 by using Machine Learning/Artificial Intelligence.
domain_considered_and_rejected:
  - term: earth-climate/climate-projection
    reason: The S2S range lies between weather and climate, but every forecast runs from a start
      date to at most six weeks ahead and nothing is projected under scenarios; the taxonomy's
      distinction puts subseasonal-to-seasonal prediction under forecasting.
  - term: earth-climate/agriculture
    reason: The organisers motivate the forecasts by their use in water, energy, health and
      agriculture, but the scored targets are temperature and precipitation themselves, not an
      agricultural outcome.
  - term: earth-climate/hazard-prediction
    reason: Terciles of fortnightly means are scored, not hazard events.

capability:
  - scientific-prediction
  - calibration-uncertainty
capability_basis:
  scientific-prediction:
    reason: Systems predict the state of the atmosphere at the surface, fortnightly mean temperature
      and accumulated precipitation, and are scored against observations.
    source: src-upcommons-bams-d-22-0046-1-pdf
    quote: using observed gridded data from NOAA Climate Prediction Center (CPC)
  calibration-uncertainty:
    reason: The submission is a probability for each tercile, and the ranked probability score
      consumes those probabilities; the climatological forecast it is compared with assigns a third
      to each.
    source: src-s2s-ai-challenge-site
    quote: This RPS is compared to the climatology forecast in the Ranked Probability Skill Score
      (RPSS).
capability_considered_and_rejected:
  - term: probabilistic-forecasting
    reason: The outcomes already existed. The organisers chose 2020, a past year, over a real-time
      competition, and its observations were public during the competition, so the truth was not
      even withheld; the term's exclusion test removes an answer that already exists. The
      probabilistic half is calibration-uncertainty.
    source: src-s2s-ai-challenge-site
    quote: The organizers explicitly choose to run this competition on past 2020 data, instead of a
      real-time competition
  - term: distribution-shift-generalization
    reason: The test year follows the 2000-2019 training years chronologically and no shifted
      condition is reported as a score of its own; the regional scores are diagnostics.

evaluation_method:
  - uncertainty-calibration-score
evaluation_method_basis:
  reason: The ranked probability score is a proper scoring rule applied to the emitted tercile
    probabilities, and RPSS its skill score against climatology, which the term covers even where a
    discipline has standardised the rule under its own name. The gridded RPSS is clipped to [-10,
    1], latitude-weighted over land and averaged over both variables and both lead times.
  source: src-s2s-ai-challenge-site
  quote: This RPS is compared to the climatology forecast in the Ranked Probability Skill Score
    (RPSS).
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: RPSS is a forecast-verification standard of meteorology, but it scores an emitted
      distribution, which domain-metric's exclusion test sends to uncertainty-calibration-score.
  - term: statistical-fit
    reason: No deterministic error is scored; the bias-corrected deterministic fields in the data
      are inputs.
  - term: expert-panel-assessment
    reason: The rules made the final ranking the average of the RPSS rank and an expert review rank,
      but the review was made pass/fail before it ran, passed all five, and the prizes followed the
      RPSS leaderboard.
    source: src-s2s-ai-challenge-site
    quote: 'The expert peer review gave a pass on all five submissions. Based on the leaderboard the prizes
      go to:'
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: Entrants are models trained on the challenge's reforecasts for a task meteorology defines,
    the calibration and combination of subseasonal forecasts (CNNs, random forests, logistic
    regression, EMOS), which domain-specialist-model admits as trained from scratch for a task the
    discipline defines. The re-calibrated ECMWF forecast, a physics-based model with tercile edges
    from its own reforecast climatology, is scored against the observations like an entrant and
    serves as the benchmark to beat, which classical-algorithm admits as a baseline. The site asks
    for machine learning, and the scored list also holds a Bayesian statistical-dynamical
    post-processing entry.
  source: src-upcommons-bams-d-22-0046-1-pdf
  quote: The competition encouraged the use of AI methods on forecasts and reforecasts from models
    in the S2S database to provide better calibration and multimodel ensemble combination
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: Methods that replace dynamical models were allowed (the site's approach I predicts from
      initial conditions), but the competition was built for post-processing, the winners all
      post-processed ECMWF output or used observations, and entrants are scored against observations
      rather than against a simulator they emulate.
    source: src-s2s-ai-challenge-site
    quote: 'Predict the week 3-4 & 5-6 state based on: I. the initial conditions (observations at forecast_time)
      II. the week 3-4 & 5-6 S2S forecasts'
  - term: task-specific-supervised-model
    reason: The entrants are task-trained models, but the task, calibrating subseasonal forecasts,
      is defined by meteorology, which the term's exclusion test sends to domain-specialist-model.
as_used:
  - protocol: Four CNN post-processing models (two UNets among them) trained on the challenge's
      ECMWF reforecasts and observations and scored by the challenge's RPSS on its 2020 test year,
      over land without Antarctica, against climatology and the challenge's ECMWF benchmark. The
      paper also scores a corrected ECMWF baseline of its own, because the challenge's benchmark
      file has precipitation probabilities that do not sum to 1.
    split: test (2020, 53 Thursday forecasts)
    source: src-arxiv-2306-15956-v1
    quote: Following the setup of the S2S AI Challenge, we evaluate the proposed post-processing
      methods based on the ranked probability skill score (RPSS) for the test set (year 2020)
    note: Horat and Lerch (arXiv June 2023; Monthly Weather Review 152, 2024). The first author was
      on the kit-eth-ubern team, fourth on the leaderboard. Their best model, a global UNet, reaches
      a global RPSS of 3.1% averaged over the four variable and lead-time cases, against 4.6% for
      the winning entry; they average the gridded RPSS by area fraction, where the challenge weights
      by the cosine of latitude.
  - protocol: Kim et al. extend the UConn team's entry, a random forest per region for each of 23
      climate regions, and report RPSS improvements for temperature and precipitation at weeks 3-4
      and 5-6. The abstract does not name the challenge, its test year or its reference; the full
      text was not read.
    source: src-crossref-10-1175-aies-d-23-0108-1
    quote: a random forest classification model built for each of 23 regions of the world
    note: Artificial Intelligence for the Earth Systems, July 2025. Three of the four authors are
      listed with the UConn team, and its 12.3% gain for temperature at weeks 3-4 is close to the
      12.4% the results paper reports for the team's later work (see review_checks).

lifecycle: mature
lifecycle_basis:
  reason: The competition was formally ended, which ADR-0019 records in activity while lifecycle
    keeps the instrument's standing. The instrument stays available. The site and the climetlab data
    remain online, the template, scoring notebook and leaderboard moved to GitHub in December 2025,
    and the organisers invite later contributions. Its result record is settled (the leaderboard
    last updated 2022-11-07). Results on its setup were produced after it closed, by Horat and Lerch
    (2023, MWR 2024) and, apparently, by a 2025 follow-up from members of the UConn team (as_used),
    but no 2025-2026 paper found names it, so `active` was not chosen (see review_checks).
  source: src-s2s-ai-challenge-site
  quote: The s2s-ai-competition is officially over.
activity: closed
activity_note: leaderboard-live-no-round was considered. The template README, last edited on
  2021-11-08, says the scorer remains active and that later scores show on the RPSS leaderboard
  without qualifying for prizes; the site's later legacy notice says the scorer stops working, and
  the leaderboard's last update is a year after the competition (review_checks).
activity_basis:
  reason: The route was the s2saichallengescorer bot, which scored tagged commits in participants'
    RenkuLab repositories and posted the results to the RPSS leaderboard. Contributions closed on
    2021-10-31, the bot has stopped, and the leaderboard's last automated update is 2022-11-07. The
    site still asks anyone who beats the leader to contact the organisers and offers manual scoring,
    but describes no route to listing.
  source: src-s2s-ai-challenge-site
  quote: contributing to the leaderboard (now migrated) stops working, but you can still easily
    score your contributions manually

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: CRIMS2S, the winning entry, a mixture of EMOS-calibrated ECMWF, ECCC and NCEP forecasts,
      a CNN applied to ECMWF forecasts and climatology, weighted by a second CNN
    source: src-upcommons-bams-d-22-0046-1-pdf
    observed_on: 2026-11-04
    quote: (ii) a prediction based on a convolutional neural network (CNN) applied to ECMWF
      forecasts
  - system: Horat and Lerch's global UNet post-processing model
    source: src-arxiv-2306-15956-v1
    observed_on: 2026-11-04
    quote: Overall, the global UNet yields the best results with a global RPSS of 3.1% averaged over
      all four test cases.
evaluation_target: learned-system
evaluation_target_basis:
  reason: The competition asks for machine learning or artificial intelligence; the re-calibrated
    ECMWF forecast and climatology are the references entrants must beat, not the systems under
    test.
  source: src-s2s-ai-challenge-site
  quote: The ML-based forecasts should beat the re-calibrated real-time 2020 ECMWF and climatology
    forecasts to be able to win prizes
execution_mode: automated
execution_mode_note: The RPSS was computed by the scoring bot. The prize stage added open and expert
  peer review of the top submissions for rule compliance and reproducibility, which was pass/fail
  and did not change the order (evaluation_method).
ground_truth_source: held-out-labels
ground_truth_source_note: NOAA CPC's unified gauge-based analysis of daily precipitation and CPC's
  global unified temperature, regridded conservatively to the 1.5-degree grid and placed in terciles
  by edges computed from 2000-2019. The 2020 labels were public, not held out (task); the term
  follows cy-bench's use for observed labels.
ground_truth_source_basis:
  reason: The observations are gridded analyses of instrument measurements, scored as category
    labels.
  source: src-github-climetlab-s2s-ai-challenge-readme
  quote: The observations dataset have been build from real instrument observations.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The scoring script, the ground truth and the benchmark forecasts are published, so anyone
    can compute the RPSS of a 2020 submission without the organisers.
  source: src-s2s-ai-challenge-site
  quote: Note that we provide the scoring script as skill_by_year and ground truth data for
    responsible use only.

task:
  exists: true
  input:
    - reforecasts initialised weekly from 2000 to 2019 (ECMWF and ECCC; NCEP's run 1999-2010) and
      real-time forecasts initialised on the Thursdays of 2020, from ECMWF, ECCC and NCEP, daily or
      as biweekly aggregates on the 1.5-degree grid, through climetlab or RenkuLab datasets
    - CPC observations up to each forecast's start date, and any other public data dated before it
  input_source: src-upcommons-bams-d-22-0046-1-pdf
  input_quote: 'This included daily and biweekly real-time forecasts and reforecasts from three S2S models:
    ECMWF, Environment and Climate Change Canada (ECCC), and the National Centers for Environmental Prediction
    (NCEP).'
  output: One NetCDF file holding, for each of the 53 Thursday start dates of 2020, the
    probabilities of the below-, near- and above-normal terciles of 2 m temperature (the fortnight's
    mean) and total precipitation (its accumulation) for weeks 3-4 and 5-6, on a global 1.5-degree
    grid.
  scoring: >
    Per grid cell, the RPS of the submitted probabilities and of climatology (a third per tercile) against
    the observed tercile is averaged over the 53 start dates, and RPSS = 1 - RPS_ML/RPS_clim; a missing
    value where a number is expected scores RPS 2. The gridded RPSS is clipped to [-10, 1], averaged with
    cosine-of-latitude weights over land between 90N and 60S, and then over both variables and both lead
    times. Precipitation is masked where the lower tercile edge is below 1 mm/day. Regional scores (northern
    extratropics, tropics, southern extratropics) are diagnostics. The averaging became 1 - <RPS_ML>/<RPS_clim>
    on 2021-10-22 (versions).
  scoring_source: src-s2s-ai-challenge-site
  scoring_quote: The RPSS values are clipped to the interval [-10, 1].
  metric_range:
    - -10.0
    - 1.0
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The 2020 observations are in the released data as the test output
    reference, marked not to be used, and the organisers say they could be had elsewhere anyway.
  tests_hidden_from_system_source: src-github-climetlab-s2s-ai-challenge-readme
  tests_hidden_from_system_quote: Test dataset (DO NOT use)
  item_definition: One forecast is one start date's tercile probabilities for one variable and lead
    time on the grid; the headline RPSS pools 53 start dates, two variables and two lead times over
    land.
  item_definition_source: src-s2s-ai-challenge-site
  item_definition_quote: over [90N-60S] land points and further averaged over both variables and
    both lead_times.
  source: src-s2s-ai-challenge-site
  quote: We expect one submission netcdf file for all 53 forecasts issued on thursdays in 2020.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Training and test inputs, observations and the ECMWF benchmark are served by ECMWF
    through climetlab from an object store, whose index pages answered a HEAD request on 2026-11-04,
    and were also RenkuLab datasets in git LFS inside the template repository. Whether the LFS
    objects moved to GitHub with the repository was not checked.
  access_basis:
    reason: The test year's observations, the labels, are distributed with the inputs.
    source: src-github-climetlab-s2s-ai-challenge-readme
    quote: Test dataset (DO NOT use)
  refresh: versioned-releases
  refresh_basis:
    reason: During the competition the organisers changed the ground truth (template v0.4,
      2021-07-27) and the RPSS averaging (2021-10-22), each announced and dated, and re-scored
      earlier submissions; nothing has changed since (versions).
    source: src-s2s-ai-challenge-site
    quote: Therefore, we release s2s-ai-challenge-template v0.4.
  data_provenance:
    - real-world-instrument
    - simulation-generated
  data_provenance_note: The ground truth is CPC's gridded analyses of station measurements
    (real-world-instrument). The inputs are forecasts and reforecasts of operational dynamical
    models from the S2S database (simulation-generated).
  data_provenance_source: src-github-climetlab-s2s-ai-challenge-readme
  data_provenance_quote: The data used for the S2S AI challenge is a subset of the S2S data library.
  contamination_risk: medium
  contamination_risk_note: The 2020 observations were public before and during the competition, as
    the organisers state, so a route into training is plausible for every entrant; the rules
    answered it with open code, overfitting safeguards and peer review, not by withholding. No
    source evidences a route for a scored entry.
  contamination_risk_source: src-github-climetlab-s2s-ai-challenge-readme
  contamination_risk_quote: In theory, these data should not be disclosed during the challenge, but
    the nature of the data make is possible to access it from other sources.
  contamination_evidence: []
  ceiling_anchor_type: operational-system
  ceiling_anchor_type_basis:
    reason: Scores are read against ECMWF's real-time 2020 forecasts, an operational system
      re-calibrated with tercile edges from its own reforecasts and scored against the same
      observations (RPSS -0.0016); climatology is the zero of the scale by construction. Prizes
      required beating both.
    source: src-s2s-ai-challenge-site
    quote: Implementing this yields an RPSS benchmark from the ECMWF model of -0.00158017.
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the challenge data or for the S2S
    database subset it uses; ECMWF's S2S terms and the CPC data terms were not read. climetlab's
    Apache-2.0 covers the plugin's code.
  size:
    - count: 53
      unit: weekly forecast start dates (the Thursdays of 2020), each for two variables and two lead
        times
      subset: test (2020)
      source: src-s2s-ai-challenge-site
      quote: We expect one submission netcdf file for all 53 forecasts issued on thursdays in 2020.
    - count: 20
      unit: years of ECMWF reforecasts (11 members each) for training, 2000-2019
      subset: training
      source: src-upcommons-bams-d-22-0046-1-pdf
      quote: The participants were required to develop, train, and test their AI models using only
        observed data and reforecasts (e.g., 20 years and 11 ensemble members for the ECMWF
        reforecasts) prior to 2020, and to submit their forecasts for the year 2020.
    - count: 3
      unit: operational S2S models' forecasts and reforecasts served (ECMWF, ECCC, NCEP)
      subset: inputs
      source: src-upcommons-bams-d-22-0046-1-pdf
      quote: 'This included daily and biweekly real-time forecasts and reforecasts from three S2S models:
        ECMWF, Environment and Climate Change Canada (ECCC), and the National Centers for Environmental
        Prediction (NCEP).'

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The WWRP/WCRP S2S Project of the World Meteorological Organization, which organised
    the challenge with ECMWF and the Swiss Data Science Center; ECMWF serves the data, and the
    template, scorer and leaderboard repositories sit in the account of the WMO contractor who ran
    the competition
  maintainer_basis:
    reason: The site names WMO/WWRP, WCRP and the S2S Project as organisers with SDSC and ECMWF, and
      the results paper says the S2S Project organised it. The climetlab plugin sits in ECMWF's
      ecmwf-lab organisation; the repositories were in the contractor's RenkuLab namespace and since
      2025-12-20 in his GitHub account.
    source: src-s2s-ai-challenge-site
    quote: 'Organized by: WMO/WWRP, WCRP, S2S Project in collaboration with SDSC and ECMWF'
  maintainer_type: government-agency
  maintainer_type_note: WMO, a United Nations agency, ran it, and ECMWF, an intergovernmental
    organisation, holds the data; no source read calls either a public body, which the term's
    exclusion test asks for a research institute. The code repositories sit in one person's account,
    which `individual` would record (review_checks).
  submission_process:
    - maintainer-scored-predictions
    - open-source-gated
  submission_process_note: Entrants committed a NetCDF of their 2020 forecasts in their own RenkuLab
    repository, tagged it, and gave the s2saichallengescorer bot read access; the bot scored it
    against the public observations. The repositories could stay private during the competition, but
    code and results had to be made public in early November 2021 to stay on the leaderboard.
  submission_process_source: src-s2s-ai-challenge-site
  submission_process_quote: Submissions, which are not made public on November 1st 2021, will be
    removed from the leaderboard.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-s2s-ai-challenge-site
      quote: s2s-ai-challenge-ECMWF-internal-testers Matthew Chantry, Florian Pinault, Jesper
        Dramsch, Mihai Alexe
    - flag: grader-from-evaluated-party
      source: src-s2s-ai-challenge-site
      quote: The organizers thank Frederic Pinault (ECMWF), Jesper Dramsch (ECMWF), Stephan Rasp
        (climate.ai) and Kenneth Nowak (USBR) for their expert reviews.
  independence_flags_note: ECMWF co-organised the challenge and supplied its benchmark forecast, and
    a team of ECMWF staff entered (sixth, RPSS -0.030) that includes Florian Pinault, whom the site
    lists among the organisers for ECMWF. Two of the four expert reviewers were from ECMWF, and one
    of them, Jesper Dramsch, is on that team; the review was pass/fail on the five teams with
    positive RPSS, which did not include ECMWF's (review_checks). No prize sponsor is named in the
    sources read; the paper says only that the prize was shared.
  independence_assessed: true
  known_limitation:
    source: src-upcommons-bams-d-22-0046-1-pdf
    quote: In addition, the 1-yr test period might be too short to properly evaluate these methods.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Public data, a public scoring script and public ground truth; no human, physical or
      maintainer-only step produces the RPSS.
    source: src-s2s-ai-challenge-site
    quote: Note that we provide the scoring script as skill_by_year and ground truth data for
      responsible use only.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The RPSS verification notebook and skill_by_year in the template's notebooks/scripts.py,
    aaronspring/s2s-ai-challenge-template on GitHub (formerly aaron.spring/s2s-ai-challenge-template
    on RenkuLab's GitLab); the s2saichallengescorer bot that ran them has stopped.
  harness_source: src-s2s-ai-challenge-site
  harness_quote: Note that we provide the scoring script as skill_by_year and ground truth data for
    responsible use only.
  harness_gotcha:
    source: src-arxiv-2306-15956-v1
    quote: a closer inspection of the precipitation forecasts revealed that the probabilities over
      the three categories sometimes do not sum up to 1
  harness_gotcha_note: The challenge's ECMWF benchmark file, the reference entrants had to beat, has
    precipitation tercile probabilities that do not sum to 1 at many grid points, which Horat and
    Lerch traced to its Fortran code and corrected for their own comparison.
  submission_channel:
    source: src-github-s2s-ai-challenge-template-readme
    quote: The automated scorer will evaulate any tag (regardless of which branch it is on) that
      starts with the word `submission`
  submission_channel_note: The scorer read ML_prediction_2020.nc from any tag beginning with
    submission in a participant's RenkuLab repository carrying the s2s-ai-challenge topic. It has
    stopped (history).
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for aaronspring/s2s-ai-challenge-template. The
    climetlab plugin is Apache-2.0; the website repository and the scoring-image repository carry no
    licence in GitHub's records.
  code_licence_source: src-github-api-s2s-ai-challenge-template
  code_licence_quote: '"spdx_id":"MIT"'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # No comparability profile resolves from domain-specialist-model and classical-algorithm with
  # uncertainty-calibration-score (`forecasting` needs scientific-surrogate-model or a language model), so the
  # fields that decide what an RPSS means are listed here. lead_time: every score belongs to weeks 3-4 (lead 14
  # days, the fortnight's first day) or weeks 5-6 (28 days), and the headline averages the two. training_data_policy:
  # the rules allow any public data dated before each start date, so what an entrant trained on, and whether it saw
  # 2020's public observations, moves the number. The 2020 test year, the land mask from 90N to 60S and the
  # 1.5-degree grid are fixed by the protocol; derived uses change the regional weighting (as_used).
  material_extra:
    - lead_time
    - training_data_policy
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The leaderboard ranks one number, the gridded RPSS averaged over land, both variables and
    both lead times; regional, variable and lead-time scores are diagnostics.
  source: src-s2s-ai-challenge-site
  quote: over [90N-60S] land points and further averaged over both variables and both lead_times.
headline_metric: null
headline_metric_note: The headline is that averaged RPSS; no Metric record exists for it, and this
  task may not write one.

homepage: https://s2s-ai-challenge.github.io/
repository: https://github.com/aaronspring/s2s-ai-challenge-template
dataset_url: https://github.com/ecmwf-lab/climetlab-s2s-ai-challenge
dataset_url_note: The climetlab plugin's repository, which documents the datasets and loads them
  from ECMWF's object store; it was archived after version 0.9.0 (2023-09-13).
leaderboard_url: https://s2s-ai-challenge.github.io/#leaderboard

versions:
  - version: v0.3.1
    label: Template release before the observation fix
    version_kind: revision
    changes: The template and observation files the site pointed to in June 2021, which the
      announcements recommend as the release to use before v0.4.
    breaking: true
    superseded_by: v0.4
    frozen: true
    sources:
      - src-s2s-ai-challenge-site
  - version: v0.4
    label: The template release with the corrected ground truth, scored in the final leaderboard
    version_kind: revision
    released: 2021-07-27
    changes: The CPC observations were regridded conservatively, with missing data at longitude 0
      and after leap days added; the scorer moved to the new files and re-scored earlier
      submissions.
    breaking: true
    supersedes_version: v0.3.1
    errata:
      - date: 2021-10-22
        scope: scoring
        description: The RPSS averaging changed from the mean of gridded 1 - RPS_ML/RPS_clim ratios
          to 1 - <RPS_ML>/<RPS_clim>, following Weigel et al. (2007), and a missing value where a
          number is expected now scores RPS 2; the scorer re-evaluated all earlier submissions, and
          the ECMWF benchmark became -0.00158.
        source: src-s2s-ai-challenge-site
    frozen: true
    sources:
      - src-s2s-ai-challenge-site

lineage:
  role: root
lineage_note: Not derived from or related by lineage to chaosbench; both are subseasonal (see the
  header). The results paper likens the challenge to the US Bureau of Reclamation's S2S Rodeo, which
  was limited to one region; the Rodeo is not catalogued.

history:

  - date: 2021-10-31
    event: channel-closed
    field: execution.submission_channel
    from: the s2saichallengescorer bot
    source: src-s2s-ai-challenge-site
    quote: 'Contributions accepted: 1st June 2021 - 31st October 2021'
    note: A 48-hour grace period ran to 2021-11-02 for fixing submissions. The bot kept scoring for

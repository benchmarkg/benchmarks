# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-s2s-ai-challenge-site
    - src-upcommons-bams-d-22-0046-1-pdf
    - src-github-s2s-ai-challenge-template-readme
    - src-github-api-s2s-ai-challenge-template
    - src-github-climetlab-s2s-ai-challenge-readme
    - src-github-s2s-ai-challenge-leaderboard-readme
    - src-arxiv-2306-15956-v1
    - src-crossref-10-1175-aies-d-23-0108-1
  sources_note: >
    The site with scripts and styles stripped, withheld from archiving for the contact details it prints;
    the results paper's publisher PDF from UPCommons (a DOI source), because journals.ametsoc.org answered
    405; the template README and climetlab README at their last commits and GitHub's API record of the
    template; the leaderboard README, withheld because every row names a participant, cited only for its
    last-update line; Horat and Lerch's arXiv v1 PDF; and Crossref's record of the 2025 AIES follow-up.
    A literature search (OpenAlex works citing the results paper since 2024, arXiv's API and GitHub repository
    search) found no 2025-2026 paper that names the challenge as its benchmark; Semantic Scholar's API
    answered 429.
  confidence: medium
  review_checks:
    - check: lifecycle mature rests on the formal ending (ADR-0019) and on use after it, Horat and
        Lerch (2023/2024) by name and Kim et al. (2025) by inference. If the 2025 paper is not on
        the challenge's protocol, the last named use is 2024, and a reviewer may prefer null (the
        sources silent on current use) over mature.
      field: lifecycle
      source: src-s2s-ai-challenge-site
      quote: The s2s-ai-competition is officially over.
    - check: The 2025 AIES paper (Kim, Zhou, Bienkowski, Pattipati) is tied to the challenge only by
        its authors, its 23 regions, its weeks 3-4 and 5-6 RPSS and a 12.3% temperature gain against
        the 12.4% the results paper reports for the UConn team's later work. Its full text, closed
        access, would show whether it uses the 2020 test year and the challenge's reference.
      field: as_used
      source: src-upcommons-bams-d-22-0046-1-pdf
      quote: Further work since the competition showed that using the average of the ECMWF hindcast
        realizations as a feature in all the models could significantly improve the forecast
        accuracy by 12.4% for temperature at week 3 + 4
    - check: maintainer_type government-agency or individual. WMO and ECMWF are intergovernmental
        bodies, but no source read calls them public bodies, and the code repositories sit in the
        contractor's personal account, which the individual term's holder test would read as
        key-person risk; ECMWF holds the data.
      field: governance.maintainer_type
    - check: grader-from-evaluated-party rests on Jesper Dramsch being both an expert reviewer and a
        member of the ECMWF team that entered. That team was not among the five reviewed, and the
        review was pass/fail, so whether a grader in the official scoring path had a stake is
        arguable. The site names the ECMWF reviewer Frederic Pinault in the thanks and Florian
        Pinault among the organisers and on the team, which may be one person.
      field: governance.independence_flags
      source: src-s2s-ai-challenge-site
      quote: The organizers thank Frederic Pinault (ECMWF), Jesper Dramsch (ECMWF), Stephan Rasp
        (climate.ai) and Kenneth Nowak (USBR) for their expert reviews.
    - check: designed_for_subjects domain-specialist-model, not scientific-surrogate-model. The
        entrants post-process dynamical forecasts; a forecast-verification specialist may read a
        calibrated forecast system as standing in for the forecast system, which would bring the
        `forecasting` profile and its lead_time and resolution_window into force.
      field: designed_for_subjects
      specialist: true
    - check: ground_truth_source held-out-labels follows cy-bench for observed labels, although the
        2020 observations were public and not held out; experimental was the alternative for CPC's
        gauge and station analyses.
      field: ground_truth_source
    - check: dataset_licence is null. The challenge data are a subset of the S2S database at ECMWF,
        whose terms were not read, and the CPC observations come through IRIDL; neither licence was
        found in the sources read.
      field: data.dataset_licence
    - check: data.access fully-open rests on the climetlab README and an object-store index that
        answered a HEAD request; no file was downloaded, and the RenkuLab datasets' git LFS objects
        may not have moved to GitHub, which the old gitlab.renkulab.io host (timed out on
        2026-11-04) cannot confirm.
      field: data.access
    - check: activity closed or leaderboard-live-no-round. The template README says the scorer stays
        active for post-competition entries, the site's undated legacy notice says it stops working,
        and the leaderboard's newest scored row is from 2021-11-03 with a last update on 2022-11-07.
        When the bot stopped is not stated.
      field: activity
      source: src-github-s2s-ai-challenge-template-readme
      quote: However, the `s2saichallengescorer` still remains active.
    - check: The v0.3.1 release is undated in the sources read, and versions 0.1 to 0.3 are not
        recorded; the site's CHANGELOG link points to the old GitLab.
      field: versions
    - check: No EvalConditions record was written, because this task may not write data/conditions.
        By chaosbench's pattern they would hold lead_time "weeks 3-4 (14 days) or weeks 5-6 (28
        days), or both averaged" and training_data_policy "any public data before each 2020 start
        date".
      field: comparability

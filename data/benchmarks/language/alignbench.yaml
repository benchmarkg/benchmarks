# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-github-opencompass-dataset-index-0d88e51
    - src-github-opencompass-alignbench-v1-1-config
    - src-github-opencompass-alignbench-loader
    - src-github-opencompass-readme-0d88e51
    - src-arxiv-2311-18743-v4
    - src-arxiv-2311-18743
    - src-github-alignbench-readme
    - src-github-alignbench-readme-en
    - src-github-api-thudm-org
    - src-openai-api-deprecations
    - src-arxiv-2505-09388-v1
  sources_note: >
    The hub route first: OpenCompass / CompassHub (docs/sweeps/hubs.yaml, shared_hubs) is script-rendered,
    so AlignBench was found in the open-compass/opencompass repository at commit 0d88e51, through its
    dataset index (the list the README's dataset-statistics page is built from), its AlignBench v1.1 config
    and its loader, and the README for CompassHub. Every fact was then read from the paper's v4 PDF (a
    DOI, not archived) and abstract page, the benchmark's Chinese and English READMEs at commit 6505913,
    and GitHub's record of the THUDM organisation; OpenAI's deprecations page (an existing Source) for
    the judge's shutdown; and the Qwen3 Technical Report's v1 PDF (a DOI, not archived) as evidence of
    current use. GitHub's API was read for licence metadata, the repository's creation and push dates,
    file-level commit dates and the data directory listing without being made a Source, and the v1.1 data
    file was downloaded to count items and evidence fields. Hugging Face's dataset search (API, read 2026-11-09)
    holds no AlignBench dataset from the maintainers; the record named omron-sinicx/AlignBench is HalCap-Bench,
    an unrelated image-caption set.
  confidence: medium
  review_checks:
    - check: A reviewer who reads Chinese should confirm the Chinese-language fields - the Chinese
        alias (多维度中文对齐评测基准, the README's title), the eight subset labels, the v1.1 note and the
        data-origin statement quoted from the Chinese README, and the rubric and aggregation read
        from the loader's Chinese prompt and code. The English README predates v1.1 and says nothing
        of either.
      field: data.data_provenance
      specialist: true
      source: src-github-alignbench-readme
      quote: 其中，约 22% 的答案除了进行修正外，还补充了对应参考信息的来源网页
    - check: Why AlignBench was chosen over the other CompassHub candidates. It fills
        language/generation, which had no primary entry on main (writingbench, drafted in parallel,
        also takes it); its data is open on GitHub; its paper is ACL 2024; and it is still reported
        in 2025 model reports (Qwen3). LCSTS (EMNLP 2015) is filed by OpenCompass under
        Understanding and would have been a second summarisation set beside xlsum. CompassArena and
        OpenCompass's other subjective sets were not read, and CLUE, CMRC 2018 and C3 were left to
        another agent.
      field: domain
      source: src-github-opencompass-dataset-index-0d88e51
      quote: 'name: LCSTS category: Understanding paper: https://aclanthology.org/D15-1229.pdf'
    - check: domain primary language/generation with no secondary. The headline weighs the reasoning
        half (mathematics and logic, 204 of 683 queries) equally with the six language categories,
        so mathematics or reasoning-general could be argued as a secondary, or as domain_override on
        those two subsets.
      field: domain
      source: src-github-opencompass-alignbench-loader
      quote: "'中文推理': ['数学计算', '逻辑推理'],"
    - check: rubric-graded was rejected because the overall score is the judge's own synthesis of
        its dimension scores, not a computed combination; the dimensions are named, defined per
        question type and scored individually, which is close to the term's inclusion test.
      field: evaluation_method
      source: src-github-opencompass-alignbench-loader
      quote: "'生成型回答': ['事实正确性', '满足用户需求', '逻辑连贯性', '创造性', '丰富度'],"
    - check: v1 and v1.1 are revisions (same 683 queries, corrected references), and v1.1 is marked
        breaking because changed references move the judge's pivot; the sources do not say whether
        v1 and v1.1 scores are comparable. v1's file is no longer in the repository, and the English
        README still names it.
      field: versions
      source: src-github-alignbench-readme-en
      quote: The data is placed in `data/data_release.jsonl`
    - check: The judge. The paper and README use gpt-4-0613, shut down on 2026-10-23; CritiqueLLM,
        the maintainers' own judge, is claimed to recover 95% of GPT-4's evaluation ability;
        OpenCompass's config does not name a judge, and the Qwen3 report does not say which it used.
        Published AlignBench numbers are therefore often not comparable, and the reproducibility
        tier may need the hosted-judge blocker the execution vocabulary deferred.
      field: evaluation_method
      source: src-github-alignbench-readme-en
      quote: CritiqueLLM, which could recover 95% of GPT-4's evaluation ability
    - check: maintainer-competes-on-own-benchmark rests on the THUDM organisation listing ChatGLM as
        its project and on ChatGLM models in the paper's table. The paper does not say in words that
        ChatGLM is the maintainers' model; its authors interned at Zhipu AI and its queries came
        from "an online LLM service" it leaves anonymous, which the Chinese README names as
        ChatGLM's.
      field: governance.independence_flags
      source: src-arxiv-2311-18743-v4
      quote: Based on observations from an online LLM service (anonymous due to review policy)
    - check: maintainer_type academic-lab, following the AgentBench entry in the same THUDM
        organisation, whose description names Zhipu.ai (Z.ai) and KEG jointly. industry-lab (Zhipu
        AI) or community-collective (an organisation shared by two institutions with no single
        stated holder) could be argued.
      field: governance.maintainer_type
      source: src-github-api-thudm-org
      quote: '"description":"ChatGLM, GLM-4, CogVLM, CodeGeeX, CogView, ImageReward, CogVideoX | CogDL,
        GraphMAE, AMiner | Zhipu.ai (Z.ai) & Knowledge Engineering Group (KEG)","name":"THUKEG"'
    - check: activity no-submission-channel rather than closed. The website's Submit function was a
        private scoring service and no source shows it publishing outside results; if it fed a
        public ranking, the lapsed domain would make this closed with a channel-closed history
        event.
      field: activity
      source: src-github-alignbench-readme-en
      quote: AlignBench [Website](https://llmbench.ai/align) is now officially online
    - check: contamination_risk medium with no evidence. No Source states a contamination finding;
        the queries came from the maintainers' own service's users, which is a route for ChatGLM in
        particular that no source examines. The paper also says the LLM generations are released,
        but the repository's data directory now holds only the v1.1 query file (GitHub contents API,
        not quoted), so records_access is left unset.
      field: data.contamination_risk
    - check: capability instruction-following rests on the paper counting instruction following
        within alignment and on the user-satisfaction dimension; the overall score does not isolate
        compliance from quality, as the term's definition would like.
      field: capability
  unreachable:
    - url: https://llmbench.ai/align
      http_status: 404
      consequence: The AlignBench website the README announced, with its CritiqueLLM Submit
        function, now answers with a 301 to bolddomains.com/align, a domain marketplace's not-found
        page, so it was not read and could not be made a Source. activity and submission_process
        rest on the README's description of the Submit function.
  personal_data_excluded:
    - source: src-arxiv-2311-18743-v4
      what: the author list, the equal-contribution and corresponding-author footnotes, and the
        reference list
    - source: src-arxiv-2311-18743
      what: the author list and the submitter's name
    - source: src-github-alignbench-readme
      what: the citation block's author list
    - source: src-github-alignbench-readme-en
      what: the citation block's author list
    - source: src-github-api-thudm-org
      what: the group's contact e-mail address and social handle

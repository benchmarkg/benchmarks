# data/benchmarks/language/belebele.yaml
#
# P1-S10-T04, language entry 12. Filled from the Belebele paper, read as the text of its ACL Anthology PDF (ACL
# 2024, DOI 10.18653/v1/2024.acl-long.44), and its arXiv abstract page (2308.16884); the repository README and the
# 2M-Belebele README in facebookresearch/belebele, at the commit of 2024-12-18; Hugging Face's API record of
# facebook/belebele; the arXiv abstract pages of 2M-BELEBELE (2412.08274) and of "From Multiple-Choice to
# Extractive QA" (2404.17342, COLING 2025); the Belebele task template in lm-evaluation-harness; and the v1 PDFs
# of two 2026 papers, a small-to-large routing study (arXiv 2610.23249) as evidence of current use and an audit
# of multilingual benchmarks (arXiv 2610.36990, COLM 2026) for contamination findings on FLORES. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# A new benchmark built on another's data: the passages are FLORES-200's, but the questions, answers and task
# are Belebele's own, so it is a separate entry linked to flores by lineage, not a version of it. 2M-Belebele,
# the maintainers' speech and sign-language extension, is recorded as a variant.

id: belebele
name: Belebele
aliases:
  - BELEBELE
  - The Belebele Benchmark
tagline: 900 multiple-choice reading-comprehension questions on FLORES-200 passages, parallel across
  122 language variants.
description: >
  A multiple-choice machine reading comprehension set from Meta AI, built so that models can be compared
  across many languages on the same items. Each of its 900 questions is tied to one of 488 short passages
  taken from FLORES-200's public dev and devtest splits, and has four candidate answers of which one is
  correct. The questions and answers were written in English by a language service provider's annotators
  over five feedback rounds, filtered by statistical checks for shortcut-solvable items, and then translated
  by fluent human translators, without machine translation, to pair with FLORES-200's existing translation
  of each passage. The result is fully parallel across 122 language variants (115 languages, 29 scripts,
  27 families), including romanized Hindi, Urdu, Bengali, Nepali and Sinhala, which FLORES-200 lacks;
  109,800 rows in all. The questions avoid multi-hop and commonsense reasoning and are meant to need only
  the passage, so the score is plain accuracy per language variant against a chance level of 25%. Belebele
  is a test set only; for models that need fine-tuning the maintainers assemble an English training set
  from six other multiple-choice datasets. The paper scores fine-tuned multilingual masked language models,
  five-shot base LLMs and zero-shot instruction-tuned models; four authors answering English questions
  blind averaged 97.6%.
self_description:
  source: src-github-belebele-readme
  quote: Belebele is a multiple-choice machine reading comprehension (MRC) dataset spanning 122
    language variants.
external_ids:
  huggingface: facebook/belebele
  arxiv: '2308.16884'
paper:
  title: 'The Belebele Benchmark: a Parallel Reading Comprehension Dataset in 122 Language Variants'
  arxiv: '2308.16884'
  doi: 10.18653/v1/2024.acl-long.44
  source: src-aclanthology-2024-acl-long-44-pdf
paper_note: Read as the ACL Anthology PDF of the published version; arXiv v2 (2024-07-25), which the
  abstract page marks ACL 2024, was not read as a PDF, so no arXiv version_read is recorded.
released: 2023-08-31
released_note: The paper's first arXiv version, as its abstract page dates it; the Hugging Face
  dataset was created on 2023-09-01 and the paper revised for ACL 2024 on 2024-07-25.
released_source: src-arxiv-2308-16884
released_quote: Submitted on 31 Aug 2023 (v1), last revised 25 Jul 2024 (this version, v2)
release_venue: ACL 2024 (long papers)
release_venue_source: src-aclanthology-2024-acl-long-44-pdf
release_venue_quote: 'Proceedings of the 62nd Annual Meeting of the Association for Computational Linguistics
  (Volume 1: Long Papers)'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/multilingual
  secondary:
    - language/understanding
    - language/low-resource-languages
domain_basis:
  reason: The benchmark's purpose is to run one task, identically, in 122 language variants and
    compare models across them, which is the multilingual leaf's definition; the items are made
    parallel for that comparison. The task is reading comprehension with the answer determined by a
    supplied passage (understanding), and the set is built to reach low-resource languages that
    lacked any such benchmark (low-resource-languages).
  source: src-aclanthology-2024-acl-long-44-pdf
  quote: Being fully parallel, this dataset enables direct comparison of model performance across
    all languages.
domain_considered_and_rejected:
  - term: language/translation
    reason: Systems answer questions; nothing is rendered from one language into another. The
      passages come from a translation benchmark, and translate-test is one optional setting, but
      the score is answer accuracy, not translation quality.
  - term: language/retrieval-qa
    reason: The passage that determines the answer is supplied with each question; nothing is
      retrieved from a corpus.
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: The 2026 audit files Belebele under QA / Knowledge, but the questions are built to need
      only the passage and no external knowledge, so breadth of knowledge is not what is scored.
    source: src-aclanthology-2024-acl-long-44-pdf
    quote: answering does not require presumptions or external knowledge as is required in more
      difficult reasoning datasets
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: Each question is answered from a supplied passage, and the questions were written so
      that the answer rests on what the passage states and cannot be had from knowledge a model
      already holds; the score is whether the model chose the option the passage supports.
    source: src-aclanthology-2024-acl-long-44-pdf
    quote: MCQs enable us to better center the questions on information explicitly stated in the
      passage
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: The passage is supplied and the questions are built not to need outside knowledge.
    source: src-aclanthology-2024-acl-long-44-pdf
    quote: answering does not require presumptions or external knowledge as is required in more
      difficult reasoning datasets
  - term: deductive-reasoning
    reason: The authors deliberately exclude multi-hop and commonsense reasoning so that the score
      separates levels of language comprehension only.
    source: src-aclanthology-2024-acl-long-44-pdf
    quote: we intentionally create questions that do not require higher levels of information
      processing, such as multi-hop or commonsense reasoning
  - term: distribution-shift-generalization
    reason: The paper scores masked language models fine-tuned on English data in every other
      language (zero-shot cross-lingual transfer), which moves only the input language. That is one
      evaluation setting among several, not the benchmark's design; its scores are per-language
      accuracies, not a shifted condition against an in-distribution one.
    source: src-aclanthology-2024-acl-long-44-pdf
    quote: the parallel nature also enables a number of cross-lingual evaluation settings

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: The system picks one of four supplied answers and is scored by accuracy; chance is 25%.
    The paper notes that for instruction-tuned models whose generated answer is matched to a letter
    the 25% floor does not strictly hold, since an unparseable reply scores nothing.
  source: src-aclanthology-2024-acl-long-44-pdf
  quote: With 4 candidate answers for each question, the expected accuracy for sequence
    classification models that guess randomly is 0.25.
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Zero-shot instructed models reply with a letter that is post-processed and matched, but
      the reply still selects among the four supplied options, which is multiple choice.
    source: src-aclanthology-2024-acl-long-44-pdf
    quote: We post-process answers and accept multiple formats.
designed_for_subjects:
  - base-model
  - instruction-tuned-model
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The paper evaluates three kinds of entrant on the same items, masked language models
    fine-tuned on an English multiple-choice training set (or its machine translations), pretrained
    LLMs prompted five-shot and instruction-tuned models prompted zero-shot, and the README lists
    settings for each.
  source: src-aclanthology-2024-acl-long-44-pdf
  quote: For LLMs, we evaluate several models using In-Context Learning and also instruction-tuned
    models via Zero-Shot.
observed_subjects:
  values:
    - instruction-tuned-model
  basis: A 2026 routing study scores three instruction-tuned families (Qwen3, Gemma 3, Llama 3.2, 1B
    to 4B parameters) on Belebele's test items in English, Bangla, Hindi and Urdu.
  source: src-arxiv-2610-23249-v1
as_used:
  - protocol: Instruction-tuned models (Qwen3-1.7B and 4B, gemma-3-1b-it and 4b-it, Llama-3.2-1B-
      and 3B-Instruct) are prompted with each item through their chat templates and scored by the
      next-token logit of each answer label, with no free generation; accuracy and routing gains are
      reported per language.
    split: test, 900 items per language, in English, Bangla, Hindi and Urdu
    source: src-arxiv-2610-23249-v1
    quote: We evaluate all tasks using deterministic next-token multiple-choice scoring.
    note: Four of the 122 variants only; scoring by label logits over a chat template is a different
      protocol from the paper's five-shot log-probability and zero-shot generated-letter settings.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced on it; an October 2026 paper uses it as one of three
    multilingual benchmarks for six instruction-tuned models. The repository was last pushed on
    2024-12-18 (GitHub API, read 2026-11-09), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2610-23249-v1
  quote: 'We evaluate three multilingual benchmarks: Belebele for reading comprehension'
activity: no-submission-channel
activity_note: The maintainers keep no leaderboard or server; the README tells users how to download
  the data and lists evaluation settings, and results appear in users' papers.
activity_basis:
  reason: No source read shows a leaderboard or a route for results; the README describes settings,
    some run in the paper, for users to run themselves.
  source: src-github-belebele-readme
  quote: Several of the evaluation settings were implemented with several models and discussed in
    the paper.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: LLaMA 2 70B (base, five-shot)
    source: src-aclanthology-2024-acl-long-44-pdf
    observed_on: 2026-11-09
    quote: With full finetuning, we achieved a maximum accuracy of 71.7 in English with ROBERTA-base
      model, significantly less than the 90.9 achieved by LLAMA 2 70B in five-shot.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: One correct answer per question, written with the question by the
  annotators in English and carried into each translation; the answer key is public with the items.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every item with its answer key downloads from the ungated Hugging Face dataset or the
    maintainers' archive, and accuracy needs no special scorer.
  source: src-hf-api-belebele
  quote: '"gated":false'

task:
  exists: true
  input:
    - a passage of about four sentences from FLORES-200, in one of the 122 language variants
    - a question about it and four candidate answers, in the same variant (or in another, in the
      cross-lingual settings)
  output: The one candidate answer that the passage supports.
  scoring: Accuracy (correct / total) per language variant over its 900 questions; chance is 25%.
    The paper also averages over the 122 variants and counts the variants above 50% and 70%.
  source: src-github-belebele-readme
  quote: In all evaluation settings, the metric of interest is simple accuracy (# correct / total).

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The Hugging Face copy is ungated and the README links a direct download of the whole
    set.
  access_basis:
    reason: All items with their answers download without registration.
    source: src-hf-api-belebele
    quote: '"gated":false'
  refresh: static
  refresh_basis:
    reason: One release. The Hugging Face data files were uploaded in September 2023 and later
      commits there and on GitHub change only the loading configuration, the README, the sample
      instructions and the 2M-Belebele directory (commit histories read through the APIs); the
      record was last modified in August 2024.
    source: src-hf-api-belebele
    quote: '"lastModified":"2024-08-12T22:18:08.000Z"'
  data_provenance:
    - expert-authored
    - web-scraped
  data_provenance_note: The passages are FLORES-200's, whose English sentences come from Wikinews,
    Wikijunior and WikiVoyage and whose translations were made by professional translators; the
    romanized variants of five Indo-Aryan languages were transliterated by annotators. The questions
    and answers were written for Belebele by a language service provider's annotators in English and
    translated by fluent human translators, then proofread by another annotator.
  data_provenance_source: src-aclanthology-2024-acl-long-44-pdf
  data_provenance_quote: BELEBELE was created end-to-end without the use of machine translation
    technology, relying solely on experts fluent in English and the target language.
  contamination_risk: medium
  contamination_risk_note: The questions and answers have been public since 2023 (Hugging Face and a
    direct download), and the passages are sentences of FLORES-200's public dev and devtest splits,
    which are widely used; the paper's own ethics statement expects the items to reach pretraining
    corpora. The evidence read concerns the passages, not Belebele's questions. BLOOMZ was
    fine-tuned on FLORES-200 translations, which the paper calls an unfair advantage. A 2026 audit,
    aggregating earlier studies, reports that surface-form methods flag all seven models tested as
    contaminated on FLORES, while its own memorisation test flags 1.2% of model-language pairs. No
    source read tests Belebele's question-answer pairs.
  contamination_risk_source: src-aclanthology-2024-acl-long-44-pdf
  contamination_risk_quote: Our decision to open-source BELEBELE may compromise future benchmarking
    as the samples may get collected into large pretraining corpora, undermining fair comparison.
  contamination_evidence:
    - source: src-aclanthology-2024-acl-long-44-pdf
      stance: supports
      quote: we present results from BLOOMZ despite it being finetuned for translation with FLORES
        data, presenting an unfair advantage for the Zero-Shot setting
    - source: src-arxiv-2610-36990-v1
      stance: supports
      quote: 7 of 7 are contaminated on Flores
    - source: src-arxiv-2610-36990-v1
      stance: against
      quote: prior surface-form methods flag 7 of 7 models, yet STAMP detects contamination in only
        1.2% of model
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: 97.6% accuracy (95% interval 93.1 to 99.5), the mean of four authors who
    each answered about 30 English questions blind; no human figure exists for the other 121
    variants.
  ceiling_anchor_type_basis:
    reason: The paper's human performance is the mean accuracy of non-specialist readers on the same
      items, scored as systems are.
    source: src-aclanthology-2024-acl-long-44-pdf
    quote: To establish human performance, 4 authors each randomly sampled around 30 English MCQs
      and answered in a blind test, achieving mean 97.6 accuracy
  dataset_licence: CC-BY-SA-4.0
  dataset_licence_note: The README and the paper give the same licence, the one FLORES-200 carries.
  dataset_licence_source: src-hf-api-belebele
  dataset_licence_quote: '"license:cc-by-sa-4.0"'
  upstream_licences: The passages are FLORES-200's, also CC BY-SA. The separate English training set
    the maintainers assemble from RACE, SciQ, MultiRC, MCTest, MCScript2.0 and ReClor keeps those
    datasets' licences, mostly CC BY-NC, so it limits commercial fine-tuning, not the test set.
  upstream_licences_source: src-aclanthology-2024-acl-long-44-pdf
  upstream_licences_quote: The BELEBELE dataset is licensed under CC-BY-SA, as is the case for the
    underlying FLORES-200.
  size:
    - count: 900
      unit: questions per language variant, four options each, the same items in every variant
      source: src-aclanthology-2024-acl-long-44-pdf
      quote: BELEBELE contains 900 questions, each with 4 multiple-choice answers and one correct
        answer.
    - count: 109800
      unit: rows (questions) across the 122 language variants
      source: src-github-belebele-readme
      quote: 900 x 122 = 109,800 total questions.
    - count: 122
      unit: language variants (115 languages, seven of them in two scripts)
      source: src-aclanthology-2024-acl-long-44-pdf
      quote: Parallel across 122 languages, the corpus contains a total of 109,800 rows.
    - count: 488
      unit: distinct passages, with one or two questions each, none from FLORES's hidden test split
      source: src-aclanthology-2024-acl-long-44-pdf
      quote: In total, there are 488 distinct passages, none belonging to the hidden FLORES test
        set.
  size_note: The Hugging Face copy has one test split per variant; there are no training or
    development splits of Belebele itself. FLORES-200 has passages in 83 further languages that were
    not given translated questions.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Meta AI (FAIR, facebookresearch)
  maintainer_basis:
    reason: The repository is facebookresearch/belebele and the Hugging Face dataset sits in the
      facebook organisation; and the README links the paper on Meta AI's publications site.
    source: src-hf-api-belebele
    quote: '"author":"facebook"'
  maintainer_type: industry-lab
  submission_process:
    - literature-only
  submission_process_note: The maintainers publish the paper's baselines and keep no ranking; others
    report results in their own papers.
  independence_flags: []
  independence_flags_note: None recorded from the sources read; with no board, there is no ranking
    for the maintainer to compete on (see review_checks on the paper's own model results).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The items and answer key are public and the score is accuracy, so any system can be
      scored end to end.
    source: src-hf-api-belebele
    quote: '"gated":false'
  harness_availability: reference-implementation-only
  harness_note: The repository holds the data description, a script that assembles the English
    training set, and the zero-shot instructions the paper used; it holds no scoring code, although
    the paper says the answer post-processing code is provided there. lm-evaluation-harness has a
    belebele task group (a third party's, not designated by the maintainers).
  harness_source: src-github-belebele-readme
  harness_quote: file for specific details on how we evaluated instructed models for the paper
  code_licence: CC-BY-NC-4.0
  code_licence_note: Covers the training-set assembly code and data; the README notes that NLTK
    (Apache 2.0) and pandas and NumPy (BSD 3-Clause) keep their own licences. GitHub reports the
    repository's licence as Other (API, read 2026-11-09).
  code_licence_source: src-github-belebele-readme
  code_licence_quote: The majority of the training set (data and code) is licensed under CC-BY-NC
  runnable_via:
    - custom
    - lm_eval
  runnable_via_note: lm-evaluation-harness (at the adapter's pin) loads facebook/belebele, prompts
    with the README's passage-question-options template and scores the log-likelihood of A to D,
    reporting acc and acc_norm per language. Whether inspect_evals implements Belebele was not
    checked.
  runnable_via_source: src-lm-eval-harness-belebele-template
  runnable_via_quote: 'dataset_path: facebook/belebele'
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the llm-static-text profile (shots, chain_of_thought, reasoning_effort, tools_allowed, retries_allowed,
  # subset_used, the last naming the language variants and any cross-lingual pairing): whether and on what the
  # model was fine-tuned (the assembled English set, translate-train or translate-train-all, or nothing);
  # the prompt, including the language of the instructions and few-shot examples; and the scorer (option
  # log-likelihood, label logits or a generated letter with post-processing), which moves the chance floor.
  material_extra:
    - training_data_policy
    - prompt_template_hash
    - harness

aggregation_policy: official-aggregate
aggregation_policy_note: Results are per language variant; the paper's summary table also averages
  each model over the 122 variants and over the non-English ones, and counts the variants above 50%
  and 70%. Most later papers report chosen variants only.
aggregation_policy_basis:
  reason: The paper's summary table gives each model an average over all variants beside its English
    and non-English scores.
  source: src-aclanthology-2024-acl-long-44-pdf
  quote: 'Table 2: Summary of results on BELEBELE across models and evaluation settings.'

homepage: https://github.com/facebookresearch/belebele
repository: https://github.com/facebookresearch/belebele
dataset_url: https://huggingface.co/datasets/facebook/belebele

lineage:
  role: fork
  variants:
    - id: 2m-belebele
      relation: extension to speech in 74 spoken languages (recorded passages, questions and
        answers) and to American Sign Language, in the same repository
      source: src-arxiv-2412-08274
      quote: Our dataset covers 74 spoken languages at the intersection of BELEBELE and FLEURS, and
        one sign language (ASL).
  forks:
    - id: belebele-extractive-qa
      maintainer: The authors of arXiv 2404.17342 (COLING 2025)
      source: src-arxiv-2404-17342
      quote: to enable the more practical task of extractive QA (EQA) in the style of machine
        reading comprehension
lineage_note: >
  Belebele grew out of FLORES-200 (flores): its passages are FLORES-200 dev and devtest sentences, as
  FLORES translated them, but the questions, answers, task and scoring are new, and it is released, versioned
  and cited on its own, so it is a separate benchmark and not a version of flores. Meta AI built both,
  but FLORES is now maintained by OLDI as FLORES+, so Belebele is recorded as a fork; flores.yaml is not
  edited here, and its lineage.forks could list belebele. 2M-Belebele (December 2024) records speech for
  74 of the languages, partly from FLEURS and partly recorded by Meta, and adds ASL; it sits in this repository,
  so it is a variant. The extractive-QA set re-annotates a subset of Belebele for English and Modern Standard
  Arabic as span extraction, another group's derivative, so it is a fork. Neither has an entry.
lineage_source: src-aclanthology-2024-acl-long-44-pdf
lineage_quote: The passages in the BELEBELE corpus are directly sourced from the FLORES-200 Machine
  Translation Benchmark

tags:
  - reading-comprehension
  - multiple-choice
  - multilingual
  - parallel
  - low-resource-languages
  - flores-200


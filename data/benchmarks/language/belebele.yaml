    address; Hugging Face's public API record of the ungated dataset; the arXiv abstract pages of the
    2M-Belebele and extractive-QA papers (DOIs, not archived) for the variant and the fork; lm-evaluation-harness's
    Belebele template at the adapter's pin; and the v1 PDFs of a 2026 routing study (evidence of current
    use) and a COLM 2026 audit of multilingual benchmarks (contamination findings), both DOIs, not archived.
  confidence: medium
  review_checks:
    - check: Primary is multilingual, with understanding and low-resource-languages secondary. The
        family's other entries put the task first (flores translation, xlsum summarization, squad
        understanding); Belebele is the case for multilingual-first, since the items exist to be
        compared across languages, but understanding could be argued primary for consistency.
      field: domain
    - check: lineage.role is fork, from FLORES-200. Meta AI built FLORES-200 and Belebele, so at
        release the maintainer was the same (variant); FLORES is now OLDI's FLORES+. It could also
        be role root, since the task is new and only the passages are shared. flores.yaml's
        lineage.forks (or variants) could list belebele.
      field: lineage.role
    - check: contamination_risk medium. The evidence read concerns the FLORES passages (BLOOMZ's
        FLORES fine-tuning; an audit's FLORES findings, which disagree by method), not Belebele's
        question-answer pairs, which no source read tests; whether FLORES evidence should count for
        Belebele, and whether high is warranted, is open.
      field: data.contamination_risk
      source: src-arxiv-2610-36990-v1
      quote: prior surface-form methods flag 7 of 7 models, yet STAMP detects contamination in only
        1.2% of model
    - check: The paper's LLM baselines include the LLaMA 1 and LLaMA 2 families; whether they come
        from the maintainer's own organisation is not stated in the sources read, so no independence
        flag is set. There is no board to compete on.
      field: governance.independence_flags
    - check: ceiling_anchor_type is crowd-average from four authors answering about 120 English
        questions; it says nothing about the other 121 variants, and authors are not a crowd sample.
      field: data.ceiling_anchor_type
    - check: harness_availability reference-implementation-only. The paper says its answer
        post-processing code is in the repository, but the repository holds only the training-set
        script and sample instructions; lm-evaluation-harness's group is not designated by the
        maintainers. none could be argued.
      field: execution.harness_availability
      source: src-aclanthology-2024-acl-long-44-pdf
      quote: Code provided at github.com/facebookresearch/belebele
    - check: No versions are recorded. The commit histories of the repository and the Hugging Face
        dataset (read through their APIs, not quoted Sources) show no change to the items after the
        2023 upload; the paper's errata on FLORES translations were handled inside Belebele, not as
        a release. Whether the direct-download archive and the Hugging Face copy are identical was
        not checked.
      field: versions
    - check: The variant and fork ids (2m-belebele, belebele-extractive-qa) are proposed, not
        allocated. The fork's maintainers' affiliations were not read; the 2M-Belebele paper was
        read only as its abstract, and whether its ASL part was released was not established.
      field: lineage
    - check: designed_for_subjects includes task-specific-supervised-model for the fine-tuned masked
        language models, although Belebele itself is test-only; the fine-tuning uses the assembled
        training set from other datasets.
      field: designed_for_subjects
      source: src-github-belebele-readme
      quote: The Belebele dataset is intended to be used only as a test set, and not for training or
        validation.
    - check: aggregation_policy official-aggregate rests on the paper's summary averages over the
        122 variants; the README defines only per-setting accuracy, and later papers report chosen
        variants, so none-by-design or community-aggregate could be argued.
      field: aggregation_policy

# data/benchmarks/language/c3.yaml
#
# P1-S10-T04, language entry 13. Found through OpenCompass / CompassHub, the catalogue's shared non-English
# hub, whose site is script-rendered: read through the open-compass/opencompass repository at commit 6288ea0,
# its default generation and perplexity configs for C3, the C3 loader, the dataset index behind its dataset
# list, and its README. Every fact is then filled from C3's own sources: the paper, arXiv 1904.09679 read as
# its v3 PDF (TACL 2020), and its abstract page; the paper's ACL Anthology page (DOI 10.1162/tacl_a_00305);
# the README and license.txt of nlpdata/c3 at its newest commit; Hugging Face's API record of dataset-org/c3;
# and the CLUE README, which redistributes C3 as a CLUE task (withheld from archiving: it gives a contact
# e-mail address). Current use: the dots.llm1 technical report (arXiv 2506.05767, v1 PDF, June 2025) and the
# DeepSeek-V3 technical report (arXiv 2412.19437, v2 PDF, February 2025). Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts; quotes from Chinese-language text are
# verbatim.
#
# One entry with two subsets, C3-Dialogue and C3-Mixed, scored separately in the paper and together as C3.
# CLUE carries the same 19,577 questions as one of its reading-comprehension tasks, and OpenCompass runs that
# copy under the name CLUE_C3; that is a redistribution inside another maintainer's suite, not a new version
# of C3 (lineage_note).
#
# Hub route (P1-S10-T04 step 2): C3 was chosen from OpenCompass's CLUE-family dataset configs
# (opencompass/configs/datasets/CLUE_C3), and its dataset index lists it under the category Understanding. Every
# fact in the entry is from C3's own paper and repository where they say it; OpenCompass is cited only for how
# OpenCompass runs it. The candidates weighed were CLUE, CMRC 2018 and C3 (see review_checks).

id: c3
name: C3
aliases:
  - C³
  - CLUE_C3
  - Multiple-Choice Chinese Machine Reading Comprehension
tagline: Multiple-choice Chinese reading comprehension on dialogues and mixed-genre texts from
  Chinese second-language exams.
description: >
  A Chinese machine reading comprehension dataset: 19,577 free-form multiple-choice questions on 13,369
  documents, collected from real and practice Chinese-as-a-second-language examinations (HSK and MHK).
  A system reads a document and a question and picks the one correct option of two to four; the score
  is accuracy. Documents are either dialogues (C3-Dialogue, 9,571 questions) or more formally written
  mixed-genre texts such as stories, news reports and advertisements (C3-Mixed, 10,006 questions). The
  authors' annotation of 600 development and test questions found that 86.8% need knowledge beyond the
  document as well as within it, most often general world knowledge. Train, development and test splits
  (60/20/20) are all public with their answers, under a non-commercial research-use statement. The paper's
  best fine-tuned model scored 68.5% on test against a human 96.0% on an annotated subset; 2025 base-model
  reports score 76.7% to 97.6% depending on protocol. There is no leaderboard of its own; CLUE redistributes
  it as a task, and OpenCompass runs that copy.
self_description:
  source: src-arxiv-1904-09679-v3
  quote: containing 13,369 documents (dialogues or more formally written mixed-genre texts) and
    their associated 19,577 multiple-choice free-form questions collected from
    Chinese-as-a-secondlanguage examinations
external_ids:
  huggingface: dataset-org/c3
  arxiv: '1904.09679'
paper:
  title: Investigating Prior Knowledge for Challenging Chinese Machine Reading Comprehension
  arxiv: '1904.09679'
  doi: 10.1162/tacl_a_00305
  version_read: v3
  source: src-arxiv-1904-09679-v3
released: 2019-04-21
released_note: The paper's first arXiv version, as the abstract page dates it; v3, the version read,
  followed on 2019-12-17 and was marked to appear in TACL. Whether the data changed between v1 and
  v3 was not established.
released_source: src-arxiv-1904-09679
released_quote: Submitted on 21 Apr 2019 (v1), last revised 17 Dec 2019 (this version, v3)
release_venue: TACL 2020 (volume 8)
release_venue_source: src-acl-2020-tacl-1-10
release_venue_quote: 'Volume: Transactions of the Association for Computational Linguistics, Volume 8'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/understanding
  secondary:
    - reasoning-general/commonsense
  secondary_basis:
    reason: The authors' annotation of 600 development and test questions found 86.8% need knowledge
      beyond the document as well as within it, and 57.3% general world knowledge, which the paper
      calls commonsense knowledge; the commonsense leaf is everyday knowledge not stated in the
      prompt.
    source: src-arxiv-1904-09679-v3
    quote: It refers to the general knowledge about how the world works, sometimes called
      commonsense knowledge.
domain_basis:
  reason: Every question comes with the document it is about and the answer is chosen against that
    document, the understanding leaf's case; the paper frames the task as machine reading
    comprehension. Its own analysis is that most questions also need knowledge the document does not
    state, above all general world knowledge, so reasoning-general/commonsense is a secondary.
  source: src-arxiv-1904-09679-v3
  quote: These tasks require a machine reader to answer questions relevant to a given document
    provided as input
domain_considered_and_rejected:
  - term: language/multilingual
    reason: C3 is in one language. The paper hopes it will support cross-lingual study against its
      English counterparts (RACE, DREAM), but no task in it is run across languages.
  - term: language/dialogue
    reason: Nearly half the problems are about a dialogue, but the system reads a finished dialogue
      and answers a question about it; it never conducts one, which is what the dialogue leaf
      scores.
    source: src-arxiv-1904-09679-v3
    quote: 48.4% of problems require dialogue understanding
  - term: language/long-context
    reason: Documents are short (116.9 characters on average), and the paper itself says the dataset
      is not suited to lengthy texts.
    source: src-arxiv-1904-09679-v3
    quote: C3 may not be suitable for evaluating the comprehension ability of machine readers on
      lengthy texts
  - term: language/low-resource-languages
    reason: Chinese is not a language with little training or evaluation data.
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: The problems come from exams, but from language-proficiency exams of one subject,
      Chinese reading comprehension, and every question has its document; the claim is reading
      comprehension, not breadth of subject knowledge. This is why C3 was taken and C-Eval and CMMLU
      were not.
    source: src-arxiv-1904-09679-v3
    quote: We collect the general-domain problems from Hanyu Shuiping Kaoshi (HSK) and Minzu Hanyu
      Kaoshi (MHK)
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: The protocol supplies the document that the question is about and scores whether the
      system picked the option that the document, read with ordinary knowledge, supports.
    source: src-arxiv-1904-09679-v3
    quote: answering 86.8% of questions requires both knowledge within and beyond the accompanying
      document
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: Most questions need prior knowledge, but always together with the supplied document; the
      paper's annotation puts only 1.3% of questions as answerable without it, and the term is for
      items no supplied passage answers.
  - term: causal-reasoning
    reason: Cause-effect knowledge is one of eight kinds of general world knowledge the paper
      annotates, needed by about a tenth of the annotated questions; it is not what the benchmark
      scores as a whole.
  - term: quantitative-reasoning
    reason: Arithmetic is an annotated knowledge type in under 4% of the annotated questions.

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: The system picks one of the supplied options (two to four, 3.8 on average) and accuracy is
    the score. The chance baseline is the paper's Random row, 27.1% on development and 27.2% on test
    for C3 as a whole.
  source: src-arxiv-1904-09679-v3
  quote: C3 Dev Test 27.1 27.2 43.8 43.1
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The dataset has a 60% training split, and the paper's baselines (a rule-based method,
    Co-Matching and four fine-tuned Chinese BERT variants) are trained on C3's two subsets together
    and tested on each.
  source: src-arxiv-1904-09679-v3
  quote: We use CM3 and C3D together to train a neural model and perform testing on them separately
observed_subjects:
  values:
    - base-model
  basis: >
    The 2025 reports read here score pretrained base models on C3 without fine-tuning, in few-shot or
    zero-shot prompts: dots.llm1 compares its base model with Qwen2.5 and DeepSeek base models at 5 shots,
    and DeepSeek-V3 scores four base models zero-shot by perplexity.
  source: src-arxiv-2506-05767-v1
as_used:
  - protocol: OpenCompass's default generation config shows the document, the question and options A
      to D in a Chinese prompt, takes the first capital letter of the reply, and scores accuracy.
    split: the development file data/CLUE/C3/dev_0.json, CLUE's copy
    source: src-github-opencompass-clue-c3-gen
    quote: path='./data/CLUE/C3/dev_0.json'
    note: Its loader pads questions with fewer than four options with the string [NULL]; the
      perplexity loader pads with a copy of the first option instead, so the two configs present
      different option sets on the same questions.
  - protocol: OpenCompass's default perplexity config scores each option's continuation after the
      document and question and takes the most likely; no instruction is given.
    split: the development file data/CLUE/C3/dev_0.json, CLUE's copy
    source: src-github-opencompass-clue-c3-ppl
    quote: inferencer=dict(type=PPLInferencer)
  - protocol: DeepSeek-V3's internal framework scores C3 by perplexity, zero-shot, for base models.
    source: src-arxiv-2412-19437-v2
    quote: ARC-Easy, ARC-Challenge, C-Eval, CMMLU, C3, and CCPM
    note: The split is not stated.
  - protocol: dots.llm1 scores C3 5-shot for base models, reported as EM, under one setting for all
      models compared.
    source: src-arxiv-2506-05767-v1
    quote: '# Shots - 5-shot 5-shot 5-shot 5-shot'
    note: The split and whether scoring is by generation or perplexity are not stated.

lifecycle: active
lifecycle_basis:
  reason: Two 2025 model reports read here score C3 as their Chinese reading-comprehension
    benchmark, and OpenCompass maintains two configs for it at its November 2026 commit. Whether it
    is saturated is derived, not set here (see review_checks).
  source: src-arxiv-2506-05767-v1
  quote: For Chinese language understanding, we assess reference disambiguation using CLUEWSC (Xu et
    al., 2020) and reading comprehension using C3 (Sun et al., 2019).
activity: no-submission-channel
activity_note: The maintainers run no leaderboard or submission route; the repository holds the
  data, question-type annotations and baseline code, and was last committed on 2022-04-20 (GitHub
  API, read 2026-11-09). CLUE's leaderboard has a C3 column for CLUE's own submissions (see
  lineage_note).

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: BERT-wwm-ext, fine-tuned on C3 (the paper's best baseline)
    source: src-arxiv-1904-09679-v3
    observed_on: 2026-11-09
    quote: 65.5 64.5 67.8 68.5 97.0 96.0
    note: The C3 row of Table 6 ends with BERT-wwm-ext's development and test accuracy (67.8, 68.5)
      and the human figures (97.0, 96.0).
  - system: dots.llm1 base (rednote-hilab), 5-shot
    source: src-arxiv-2506-05767-v1
    observed_on: 2026-11-09
    quote: dots.llm1 .base MoE 14B 142B 92.8 90.4 92.7 97.6
    note: The fourth score is C3 (97.6), after C-Eval, CMMLU and CLUEWSC.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The exams' answer keys, distributed with every split, test included; the
  labels are not withheld, only stored.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: All three splits and their answers are public in the repository and on Hugging Face
    (ungated), and accuracy needs no maintainer-side scoring.
  source: src-hf-api-c3
  quote: '"gated":false'

task:
  exists: true
  input:
    - a Chinese document, either a dialogue or a mixed-genre written text
    - a question about it with two to four answer options
  output: The one correct option.
  scoring: Accuracy over questions, reported for C3-Mixed, C3-Dialogue and C3 as a whole.
  source: src-arxiv-1904-09679-v3
  quote: Each question is associated with several answer options, and EXACTLY ONE of them is
    correct. The goal is to select the correct option.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The repository's data files cover train, development and test for both subsets, with the
      correct option recorded for every question, and the Hugging Face copy is ungated.
    source: src-github-c3-readme
    quote: the dataset files, where m and d represent
  refresh: static
  refresh_note: One release; no later edition or revision is recorded in the sources read.
  data_provenance:
    - exam-derived
  data_provenance_note: Problems from real and practice HSK and MHK examinations, which test the
    Chinese listening and reading comprehension of second-language learners, all freely available
    online; the authors removed duplicates and split at random at the problem level.
  data_provenance_source: src-arxiv-1904-09679-v3
  data_provenance_quote: We include problems from both real and practice exams; all are freely
    accessible online for public usage.
  contamination_risk: medium
  contamination_risk_note: The problems were taken from exams freely available online, and every
    split with its answers has been public on GitHub and Hugging Face since 2019, so web-scale
    pretraining corpora can hold them. No source read reports a contamination test or
    decontamination for C3, so medium is the provenance-only reading; the 2025 base-model scores
    above the paper's human figure are consistent with contamination as well as with saturation, and
    no source attributes them (see review_checks).
  contamination_evidence: []
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: The paper's human performance, 96.0% on test and 97.0% on development
    for C3, is measured on the annotated subset of 600 development and test questions. Who answered
    and how is not described in the text read; the annotators of knowledge types were two of the
    authors.
  ceiling_anchor_type_basis:
    reason: Human accuracy scored with the same metric as systems, on a subset; the readers'
      expertise is not stated, so crowd-average is the nearest term and is uncertain (see
      review_checks).
    source: src-arxiv-1904-09679-v3
    quote: based on the annotated subset of test and development sets of C3
  ceiling_by_category:
    - category: C3 test (annotated subset), human
      value: 96.0
      metric: accuracy (%)
      source: src-arxiv-1904-09679-v3
      quote: between this method and human performance (96.0%)
  dataset_licence: Non-commercial research use (the repository's license.txt; no named licence)
  dataset_licence_note: Hugging Face's record tags the licence "other". The exam problems' own
    copyright is not discussed in the sources read.
  dataset_licence_source: src-github-c3-licence
  dataset_licence_quote: C3 dataset is intended for non-commercial research purpose only.
  size:
    - count: 19577
      unit: questions on 13,369 documents (11,869 train, 3,816 development, 3,892 test)
      subset: C3 (both subsets, all splits)
      source: src-arxiv-1904-09679-v3
      quote: 8,023 / 11,869 2,674 / 3,816 2,672 / 3,892 13,369 / 19,577
    - count: 10006
      unit: questions on 5,229 documents (2,002 test questions on 1,045 documents)
      subset: C3-Mixed
      source: src-arxiv-1904-09679-v3
      quote: 1,045 / 2,002 5,229 / 10,006
    - count: 9571
      unit: questions on 8,140 documents (1,890 test questions on 1,627 documents)
      subset: C3-Dialogue
      source: src-arxiv-1904-09679-v3
      quote: 1,627 / 1,890 8,140 / 9,571
    - count: 3892
      unit: questions in the test split, as CLUE redistributes it (11,869 train, 3,816 development)
      subset: CLUE's C3 task
      source: src-github-clue-readme
      quote: 数据量：训练集(11,869)，验证集(3,816)，测试集(3,892)
  size_note: The split was 60/20/20 at the problem level. Hugging Face's record counts documents per
    split (C3-Dialogue test 1,627), not questions.
  languages:
    - Chinese

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The C3 authors, through the nlpdata GitHub organisation and dataset.org
  maintainer_basis:
    reason: The paper names dataset.org/c3 as C3's home, and the nlpdata/c3 README says the
      repository maintains C3; both are organisation accounts, not personal ones.
    source: src-github-c3-readme
    quote: This repository maintains **C3**
  maintainer_type: academic-lab
  maintainer_type_note: The paper's author block gives Cornell University and Tencent AI Lab; it is
    not quoted because the same lines carry the authors' e-mail addresses. academic-lab is taken
    from the first institution; a university-industry pairing could also be read as consortium (see
    review_checks).
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or submission route of the maintainers'; every C3 number
    is published by whoever ran it, under a protocol they choose (as_used). CLUE runs a leaderboard
    with a C3 column on its copy of the test set.
  submission_process_source: src-github-c3-readme
  submission_process_quote: code of Chinese BERT, BERT-wwm, and BERT-wwm-ext baselines
  independence_flags: []
  independence_flags_note: None recorded. There is no board for the maintainers to compete on; the
    paper reports baselines of other groups' pretrained models fine-tuned by the authors.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_blockers: []
  harness_availability: reference-implementation-only
  harness: The bert folder of nlpdata/c3, the fine-tuning and evaluation code of the paper's BERT
    baselines
  harness_source: src-github-c3-readme
  harness_quote: code of Chinese BERT, BERT-wwm, and BERT-wwm-ext baselines
  code_licence_note: Not recorded. GitHub's licence metadata for nlpdata/c3 reports NOASSERTION, and
    license.txt speaks only of the dataset.
  runnable_via:
    - custom
  runnable_via_note: The paper's baseline code, and OpenCompass, which is not in the runner
    vocabulary and has generation and perplexity configs for C3 (as_used). No inspect_evals,
    lm-evaluation-harness or HELM task for C3 was read.
  runnable_via_source: src-github-opencompass-dataset-index-6288ea0
  runnable_via_quote: 'category: Understanding paper: https://arxiv.org/pdf/2004.05986 configpath: opencompass/configs/datasets/CLUE_C3/CLUE_C3_gen.py'
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the subset and split (C3-Mixed, C3-Dialogue or both; the test split or the
  # development file OpenCompass runs), the harness (perplexity over options or a generated letter, and how
  # short option lists are padded), the shot count, and what the system was trained on. They move the number
  # a long way: DeepSeek-V3 Base scores 78.6 zero-shot by perplexity in its own report and 97.4 at 5 shots in
  # dots.llm1's.
  material_extra:
    - subset_used
    - harness
    - shots
    - training_data_policy
    - prompt_template_hash
aggregation_policy: official-aggregate
aggregation_policy_note: The paper reports accuracy for each subset and for C3 as a whole, which is
  accuracy over the pooled questions of both subsets.

homepage: https://dataset.org/c3/
repository: https://github.com/nlpdata/c3
dataset_url: https://huggingface.co/datasets/dataset-org/c3
versions_note: No versioned releases. The paper went through three arXiv versions in 2019; the
  data's history between them was not established.

subsets:
  - id: c3#mixed
    label: C3-Mixed (C3M)
    items: 10006
    scored_separately: true
    evidence:
      - source: src-arxiv-1904-09679-v3
        quote: in which the given non-dialogue document is of mixed genre, such as a story, a news
          report, a monologue
    notes: More formally written documents, longer on average (180.2 characters) than the dialogues;
      the paper calls it a Chinese counterpart of RACE.
  - id: c3#dialogue
    label: C3-Dialogue (C3D)
    items: 9571
    scored_separately: true
    evidence:
      - source: src-arxiv-1904-09679-v3
        quote: 48.4% of problems require dialogue understanding
    notes: A dialogue is the document; the paper calls it a Chinese counterpart of DREAM.
subsets_note: The paper trains on both subsets together and reports accuracy on each and on the
  pool.

lineage:
  role: root
lineage_note: CLUE (CLUEbenchmark, COLING 2020) redistributes C3 as one of its three
  reading-comprehension tasks, with the same train, development and test counts, and scores it by
  accuracy on its leaderboard. That is the same items inside another maintainer's suite, not a
  revision of C3 and not a derivative with new items, so it is recorded here rather than as a
  version or fork; CLUE itself, if catalogued, would be a suite with C3 as a member. OpenCompass
  runs CLUE's copy under the name CLUE_C3 and indexes it as "CLUE / C3", citing the CLUE paper
  rather than C3's.
lineage_source: src-github-clue-readme
lineage_quote: 'C3: 多选中文阅读理解(Acc)'

tags:
  - reading-comprehension
  - multiple-choice
  - chinese
  - dialogue
  - exam-derived
  - prior-knowledge
  - compasshub

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-github-opencompass-clue-c3-gen
    - src-github-opencompass-clue-c3-ppl
    - src-github-opencompass-c3-loader
    - src-github-opencompass-dataset-index-6288ea0
    - src-github-opencompass-readme-6288ea0
    - src-arxiv-1904-09679-v3
    - src-arxiv-1904-09679
    - src-acl-2020-tacl-1-10
    - src-github-c3-readme
    - src-github-c3-licence
    - src-hf-api-c3
    - src-github-clue-readme
    - src-arxiv-2506-05767-v1
    - src-arxiv-2412-19437-v2
  sources_note: >
    The hub route first: OpenCompass's repository at commit 6288ea0 (its generation and perplexity configs
    for C3, its loader, its dataset index and its README), read because opencompass.org.cn and CompassHub
    are script-rendered. Then C3's own sources: the paper's v3 PDF and abstract page and its ACL Anthology
    page (all with DOIs, not archived); the nlpdata/c3 README and license.txt at commit 1f41682; Hugging
    Face's API record of dataset-org/c3; and the CLUE README at commit 9e61ddd, withheld from archiving
    because it gives a contact e-mail address. Two 2025 model reports (dots.llm1 v1 and DeepSeek-V3 v2,
    DOIs) are the evidence of current use.
  confidence: medium
  review_checks:
    - check: A reviewer who reads Chinese should confirm the Chinese-language fields - the CLUE
        README's C3 section and counts (data.size, lineage_quote), the OpenCompass prompts and the
        loader comment (as_used), and that CLUE's C3 task is C3's items unchanged.
      field: as_used
      source: src-github-clue-readme
      quote: 中文多选阅读理解数据集，包含对话和长文等混合类型数据集。
    - check: Why C3 over the other CompassHub candidates. CMRC 2018 (span extraction) has its
        official test and challenge sets hidden behind a CodaLab submission route
        (worksheets.codalab.org failed TLS in October 2026, see squad) and its repository and
        leaderboard sit in a personal account; CLUE is a suite of nine tasks, six of them
        classification rather than passage-determined QA, which fits language/understanding less
        well and would need the suite-and-subsets treatment of 04 S4. C3 has every split open with
        answers in an organisation repository, a TACL paper with a DOI, and two 2025 model reports
        using it. CMRC 2018 and CLUE remain candidates for later entries.
      field: id
    - check: The id c3 is proposed (no Epoch stub or allocation row). It is short and the name C3 is
        used by unrelated work; c3-mrc is the alternative if the lead prefers a less collision-prone
        slug.
      field: id
    - check: lifecycle is hand-set active; saturated is derived. Saturation evidence read but not
        asserted - dots.llm1's Table 2 puts five base models at 96.7 to 97.6 on C3 at 5 shots, above
        the paper's human 96.0, while DeepSeek-V3's Table 3 puts four base models, three of them
        also in dots.llm1's table, at 76.7 to 79.7 zero-shot by perplexity. The human figure is on
        an annotated subset of development and test, and neither report names its split, so the
        comparison is loose.
      field: lifecycle
      source: src-arxiv-2506-05767-v1
      quote: DeepSeek V3 Base MoE 37B 671B 89.1 88.1 92.6 97.4
    - check: The DeepSeek-V3 C3 row was read from pdftotext's flattening of Table 3, where each
        benchmark's row is a shot count and four scores in the column order DeepSeek-V2 Base,
        Qwen2.5 72B Base, LLaMA-3.1 405B Base, DeepSeek-V3 Base; the C3 row is taken as the fifth
        Chinese row (0-shot 77.4 76.7 79.7 78.6). Confirm against the rendered table.
      field: comparability.material_extra
      source: src-arxiv-2412-19437-v2
      quote: 0-shot 77.4 76.7 79.7 78.6
    - check: contamination_risk medium from provenance alone, with no evidence entry. The exam
        problems were freely available online and all answers have been public since 2019; a
        reviewer with a contamination study of C3 should add it and consider high.
      field: data.contamination_risk
      source: src-arxiv-1904-09679-v3
      quote: We include problems from both real and practice exams; all are freely accessible online
        for public usage.
    - check: ceiling_anchor_type crowd-average is uncertain. The paper reports human performance on

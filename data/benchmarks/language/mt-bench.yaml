# data/benchmarks/language/mt-bench.yaml
#
# P1-S10-T03, language entry 5 of 7. Filled from the MT-Bench and Chatbot Arena paper, arXiv 2306.05685 read as
# its v4 PDF (2023-12-24, NeurIPS 2023 Datasets and Benchmarks), and its abstract page; the NeurIPS proceedings
# page; FastChat's llm_judge README, gen_judgment.py and common.py at main; Hugging Face's API record of the
# MT-Bench human-judgment dataset; the 2025-08-04 leaderboard table in the Arena leaderboard space; LMSYS's
# About page; OpenAI's API deprecations page (its Markdown version); and the v3 PDF of CyclicJudge (arXiv
# 2603.01865, May 2026), a paper that reports MT-Bench results. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The entry is MT-Bench, the fixed 80-question set and its GPT-4-judged scoring. Chatbot Arena, introduced in the
# same paper, is a separate benchmark (lmarena) and is not described here.

id: mt-bench
name: MT-Bench
aliases:
  - MT-bench
tagline: 80 two-turn questions in eight categories, each turn graded 1 to 10 by a GPT-4 judge, from
  LMSYS's FastChat.
description: >
  A fixed set of 80 two-turn questions for chat assistants, 10 in each of eight categories: writing,
  roleplay, extraction, reasoning, math, coding, knowledge I (STEM) and knowledge II (humanities and
  social science). The second turn is a follow-up to the first, such as a rewrite under a new
  constraint. Answers are graded by GPT-4 acting as judge. The default, single-answer grading, scores
  each turn from 1 to 10 and reports the mean over all 160 turns; math, reasoning and coding are graded
  against reference answers that GPT-4 itself wrote, and the second-turn prompt shows the judge the whole
  conversation. Two pairwise modes report win rates instead, against gpt-3.5-turbo or between all
  pairs. The paper that introduced it studies the judge's biases (position, verbosity and
  self-enhancement, and weak grading of math and reasoning) and measures 85% agreement between GPT-4
  and 58 expert labellers on non-tied votes, above the 81% the labellers reach among themselves. The
  questions, prompts, reference answers and code are in FastChat's llm_judge package, and 3,355 expert
  votes are released on Hugging Face. OpenAI shut down gpt-4-0314, the judge snapshot of the paper's
  case studies, on 2026-03-26, and shuts down gpt-4-0613 and the gpt-4 alias, the harness's default
  judge, on 2026-10-23.
self_description:
  source: src-arxiv-2306-05685-v4
  quote: MT-bench is designed to test multi-turn conversation and instruction-following ability,
    covering common use cases and focusing on challenging questions to differentiate models
external_ids:
  arxiv: '2306.05685'
paper:
  title: Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena
  arxiv: '2306.05685'
  doi: 10.52202/075280-2020
  version_read: v4
  source: src-arxiv-2306-05685-v4
released: 2023-06-09
released_note: The paper's first arXiv version, as its abstract page dates it. The MT-bench code and
  questions were committed to FastChat on 2023-06-16 (GitHub commit history, not a quoted Source).
released_source: src-arxiv-2306-05685
released_quote: Submitted on 9 Jun 2023
release_venue: NeurIPS 2023, Datasets and Benchmarks Track
release_venue_source: src-neurips-2023-mt-bench
release_venue_quote: Advances in Neural Information Processing Systems 36 (NeurIPS 2023)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/dialogue
  secondary:
    - language/generation
domain_basis:
  reason: Every question has two turns, the second a follow-up that depends on the model's first
    answer, and the paper's claim is multi-turn conversational ability. The judge sees the whole
    conversation when it grades the second turn. Answers are free-form text graded on stated
    criteria (helpfulness, relevance, accuracy, depth, creativity, detail), or against reference
    answers in three categories, which is the generation leaf's case.
  source: src-arxiv-2306-05685-v4
  quote: In MT-bench, every question involves two turns to evaluate conversational abilities.
domain_considered_and_rejected:
  - term: general-intelligence/open-preference-arenas
    reason: Its exclusion test applies twice. The items are a fixed set of 80 questions, not prompts
      from the public, and the judge is a model, not people. Chatbot Arena, the paper's other
      benchmark, is the arena (lmarena).
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: The eight categories span writing to STEM knowledge, but the family's test turns on the
      claim, and MT-Bench claims one competence, multi-turn conversation and instruction following,
      not coverage of many fields.
    source: src-arxiv-2306-05685-v4
    quote: MT-bench is designed to test multi-turn conversation and instruction-following ability,
      covering common use cases and focusing on challenging questions to differentiate models
  - term: language/creative-writing
    reason: Writing and roleplay are two of the eight categories (20 of 80 questions); the score is
      not about craft alone.
capability:
  - instruction-following
capability_basis:
  instruction-following:
    reason: The benchmark's own source claims instruction following, and second turns are directions
      about the first answer (such as rewriting it with every sentence starting with the letter A)
      whose compliance the judge grades within its 1-10 score.
    source: src-arxiv-2306-05685-v4
    quote: MT-bench is designed to test multi-turn conversation and instruction-following ability,
      covering common use cases and focusing on challenging questions to differentiate models
capability_considered_and_rejected:
  - term: memory-retention
    reason: The second turn needs the first answer, but it is adjacent to its use, which the term's
      exclusion test names, and no source claims retention.
  - term: context-integration
    reason: Apart from the extraction category's passages, nothing supplied determines the answer;
      the second turn builds on the model's own first answer, not on supplied material.
  - term: communication
    reason: The judge grades the message itself; no recipient acts on it.
  - term: knowledge-recall
    reason: Two of the eight categories are knowledge questions, and the score is a holistic quality
      grade rather than recall checked against a key.
  - term: quantitative-reasoning
    reason: Math and reasoning are two categories of ten questions each, graded by the judge against
      reference answers; the benchmark's claim is conversation and instruction following, and per
      category scores are subsets, not the headline.

evaluation_method:
  - model-graded-judge
evaluation_method_note: The judge is GPT-4. The paper's case studies name gpt-4-0314, and the
  harness's default is the unpinned gpt-4 alias, so the snapshot behind a published score is often
  unstated. The judge prompt (single-v1, single-math-v1 and their multi-turn forms) asks for a
  rating in [[ ]] after a short explanation, at temperature 0. For math, reasoning and coding the
  judge is shown a reference answer that GPT-4 wrote (reference-guided grading). Pairwise modes
  (against gpt-3.5-turbo, or all pairs) report win rates.
evaluation_method_basis:
  reason: A general model prompted with a grading instruction decides the quality of each answer,
    and the reported number is its 1-10 grades averaged.
  source: src-arxiv-2306-05685-v4
  quote: We ask GPT-4 to give a score for each turn on a scale of 10
evaluation_method_considered_and_rejected:
  - term: rubric-graded
    reason: The prompt names factors (helpfulness, relevance, accuracy, depth, creativity, level of
      detail), but the judge issues one holistic grade; no criterion is checked or scored on its
      own.
    source: src-arxiv-2306-05685-v4
    quote: Your evaluation should consider factors such as the helpfulness, relevance, accuracy,
      depth, creativity, and level of detail of the response.
  - term: pairwise-preference-elo
    reason: The pairwise modes report win rates against one baseline or across all pairs, and the
      verdicts are a model's, not votes; no rating is fitted.
    source: src-github-fastchat-llm-judge-readme
    quote: 'Option 2: pairwise comparison against a baseline (default: gpt-3.5-turbo)'
  - term: human-expert-eval
    reason: 58 expert labellers produced about 3K pairwise votes, but they validated the judge;
      scores on the benchmark come from GPT-4.
    source: src-arxiv-2306-05685-v4
    quote: 'We then use 2 kinds of judges: LLM judges and 58 expert-level human labelers.'
  - term: reference-metric
    reason: Reference answers are shown to the judge for three categories; no similarity formula
      compares output and reference.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The protocol expects a chat assistant that answers a question and a follow-up; the paper
    built it because aligned chat models were preferred over base models that conventional
    benchmarks could not tell apart. FastChat applies each model's own chat template.
  source: src-github-fastchat-llm-judge-readme
  quote: To make sure FastChat loads the correct prompt template
designed_for_subjects_considered_and_rejected:
  - term: base-model
    reason: LLaMA-13B is scored in the paper (2.61), as the unaligned model the benchmark is meant
      to separate from chat models, not the designed-for case.
  - term: model-in-benchmark-harness
    reason: FastChat feeds the two fixed turns in sequence, but that is a scripted conversation, not
      an agent loop in which the model decides what to do next.

as_used:
  - protocol: MT-Bench answers graded by a panel of five judges (GPT-5.2, Gemini 3 Flash, Claude
      Sonnet 4.6, Qwen 2.5 7B Instruct and Llama 3.3 70B Instruct) in place of GPT-4, which grade
      each other symmetrically, with 10 generations per question, at the harness's judge decoding
      defaults.
    split: all 80 questions
    source: src-arxiv-2603-01865-v3
    quote: GPT-5.2, Gemini 3 Flash, and Claude Sonnet 4.6, which also serve as judges in a symmetric
      design
    note: CyclicJudge (2026) finds that the judges' systematic offsets are as large as the model
      differences the benchmark should detect, for instance GPT-5.2 and Claude marking Qwen down by
      more than one scale point, so a score is not comparable across judges.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the question set; a paper revised in May 2026 scores
    five current models on it, 4,000 scores per model. The maintainers' own MT-bench column stopped
    growing in mid-2024 and the llm_judge code was last changed in July 2024 (GitHub commit
    history), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2603-01865-v3
  quote: MT-Bench uses m=10 generations per scenario (4,000 scores per model)
activity: no-submission-channel
activity_note: LMSYS ran MT-Bench itself on models it chose and listed the scores beside Arena
  ratings; the 2025-08-04 table holds 67 scored models of 341, the newest Qwen2-72B-Instruct (June
  2024). No source offers outsiders a route onto that column.
activity_basis:
  reason: A download-and-run package; users generate answers and judgments themselves and report
    them in their own work, and the only results table is one the maintainers filled.
  source: src-github-fastchat-llm-judge-readme
  quote: In this package, you can use MT-bench questions and prompts to evaluate your models with
    LLM-as-a-judge.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Vicuna-13B (trained on all ShareGPT data)
    source: src-arxiv-2306-05685-v4
    observed_on: 2026-10-14
    quote: Vicuna-13B (all) 370M 52.1 0.35 6.39
  - system: Qwen2-72B-Instruct
    source: src-hf-arena-leaderboard-table-20250804
    observed_on: 2026-10-14
    quote: qwen2-72b-instruct,Qwen2-72B-Instruct,9.12
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: none
ground_truth_source_note: No stored answer key decides the score. The judge's grade is the score;
  for the 30 math, reasoning and coding questions it is shown reference answers that GPT-4 wrote,
  and the 3,355 expert votes were collected to validate the judge, not to score systems.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The questions, judge prompts, reference answers and code are public, and grading needs
    only API access to the judge. The judge model is a hosted service whose snapshots retire (see
    execution.harness_gotcha).
  source: src-arxiv-2306-05685-v4
  quote: We publicly release 80 MT-bench questions, 3K expert votes, and 30K conversations with
    human preferences for future study.

task:
  exists: true
  input:
    - a first-turn question from one of eight categories
    - then a fixed second-turn follow-up, with the model's own first answer in the conversation
  output: A free-text answer to each turn.
  scoring: Single-answer grading (the default) has GPT-4 rate each turn from 1 to 10, the second
    turn with the whole conversation shown and math, reasoning and coding against a GPT-4 reference
    answer; the score is the mean over the 160 turns, often reported with first- and second-turn
    means beside it. Pairwise modes report win rates against gpt-3.5-turbo or across all pairs.
  metric_range:
    - 1
    - 10
  source: src-github-fastchat-llm-judge-readme
  quote: For each turn, GPT-4 will give a score on a scale of 10. We then compute the average score
    on all turns.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The questions, judge prompts and reference answers ship in the FastChat repository, and
      the expert votes are an ungated Hugging Face dataset.
    source: src-arxiv-2306-05685-v4
    quote: We publicly release 80 MT-bench questions, 3K expert votes, and 30K conversations with
      human preferences for future study.
  records_access: fully-open
  records_access_note: The records are the paper's expert pairwise votes and GPT-4 pairwise
    judgments on six models' answers (human and gpt4_pair splits).
  records_access_source: src-hf-api-mt-bench-human-judgments
  records_access_quote: '"gated":false'
  records_licence: CC-BY-4.0
  records_licence_source: src-hf-api-mt-bench-human-judgments
  records_licence_quote: license:cc-by-4.0
  records_snapshot: 2023-07-20
  refresh: static
  refresh_note: The question and reference-answer files have not changed since they were committed
    on 2023-06-16. The judge prompts were updated on 2023-07-04 and single-answer grading became the
    default on 2023-07-08 (GitHub commit history, not quoted Sources), and the default judge is an
    API alias whose model changed under it (see review_checks).
  refresh_basis:
    reason: One fixed set of 80 questions, released with the paper and its code.
    source: src-arxiv-2306-05685-v4
    quote: We create MT-bench, a benchmark consisting of 80 high-quality multi-turn questions
  data_provenance: []
  data_provenance_note: The authors wrote the questions by hand ("manually designed"); the sources
    do not describe the writers' expertise, so neither expert-authored nor crowd-authored passes its
    test. The reference answers for math, reasoning and coding were written by GPT-4, but they are
    grading material, not items.
  data_provenance_source: src-arxiv-2306-05685-v4
  data_provenance_quote: knowledge I (STEM), and knowledge II (humanities/social science). For each
    category, we then manually designed 10 multi-turn questions
  contamination_risk: medium
  contamination_risk_note: The questions, GPT-4's reference answers and pre-generated answers and
    judgments have been public on GitHub and Hugging Face since mid-2023, so a training route is
    plausible; no source read evidences one. The paper notes that a small conversation dataset can
    teach a model the style the judge prefers, which is a route to a higher score without
    contamination.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: Each turn is rated on a bounded 1-10 scale and the headline is their mean, so 10 is the
      top; no human or measured ceiling is published.
    source: src-arxiv-2306-05685-v4
    quote: please rate the response on a scale of 1 to 10
  dataset_licence: Apache-2.0
  dataset_licence_note: The licence of the FastChat repository that holds the question, prompt and
    reference files (GitHub's licence metadata for lm-sys/FastChat, read 2026-10-14; not a quoted
    Source). No licence is stated for the question set itself.
  size:
    - count: 80
      unit: two-turn questions, 10 in each of eight categories
      source: src-arxiv-2306-05685-v4
      quote: We create MT-bench, a benchmark consisting of 80 high-quality multi-turn questions
    - count: 3355
      unit: expert pairwise votes on six models' answers
      subset: human split of the released judgments
      source: src-hf-api-mt-bench-human-judgments
      quote: '"name":"human","num_bytes":15003469,"num_examples":3355'
    - count: 2400
      unit: GPT-4 pairwise judgments on the same answers
      subset: gpt4_pair split of the released judgments
      source: src-hf-api-mt-bench-human-judgments
      quote: '"name":"gpt4_pair","num_bytes":10679650,"num_examples":2400'
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: LMSYS (Large Model Systems, LMSYS Corp.)
  maintainer_basis:
    reason: FastChat, which holds MT-Bench, is one of LMSYS's flagship projects, and its repository
      and the dataset sit in the lm-sys and lmsys organisations. LMSYS began as a collaboration of
      several universities and was incorporated as a non-profit in September 2024.
    source: src-lmsys-about
    quote: including Chatbot Arena (graduated), SGLang, FastChat, and Vicuna
  maintainer_type: nonprofit
  maintainer_type_note: Before September 2024 LMSYS was a collaboration of UC Berkeley, Stanford,
    UCSD, CMU and MBZUAI with no legal form, which the vocabulary would call community-collective
    (see history).
  maintainer_type_source: src-lmsys-about
  maintainer_type_quote: Large Model Systems (LMSYS Corp.) is a 501(c)(3) non-profit focused on
    incubating open-source projects and research
  submission_process:
    - maintainer-run
  submission_process_note: LMSYS ran MT-Bench on models it chose and published the scores in the
    MT-bench column of its leaderboard table, which now sits in LMArena's space. Everyone else runs
    the package and reports in their own work; no route takes outside numbers.
  submission_process_source: src-hf-arena-leaderboard-table-20250804
  submission_process_quote: key,Model,MT-bench (score),MMLU
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-hf-arena-leaderboard-table-20250804
      quote: gpt-4-0314,GPT-4-0314,8.96
    - flag: maintainer-competes-on-own-benchmark
      source: src-hf-arena-leaderboard-table-20250804
      quote: vicuna-33b,Vicuna-33B,7.12
    - flag: funded-by-evaluated-party
      source: src-arxiv-2306-05685-v4
      quote: This project is partly supported by gifts from Anyscale, Astronomer, Google, IBM,
        Intel, Lacework, Microsoft, MBZUAI, Samsung SDS, Uber, and VMware.
  independence_flags_note: The judge is GPT-4, and OpenAI's GPT-4 and GPT-3.5 models are among the
    scored systems; the paper measured GPT-4 favouring itself by a 10% higher win rate but could not
    establish self-enhancement bias. LMSYS's own Vicuna models are scored, in the paper and in its
    table. The paper's acknowledged gift donors include Google and Microsoft, whose PaLM 2 (6.40)
    and WizardLM models are in the maintainers' MT-bench table, though not in the paper's own
    evaluation.
  independence_assessed: true
  funding:
    source: src-arxiv-2306-05685-v4
    quote: This project is partly supported by gifts from Anyscale, Astronomer, Google, IBM, Intel,
      Lacework, Microsoft, MBZUAI, Samsung SDS, Uber, and VMware.
  known_limitation:
    source: src-arxiv-2306-05685-v4
    quote: its results may become unstable, as absolute scores are likely to fluctuate more than
      relative pairwise results if the judge model changes
  known_limitation_note: >
    The paper names the judge's limitations and quotes them as definitions. "Position bias is when an
    LLM exhibits a propensity to favor certain positions over others"; only GPT-4 gave consistent
    verdicts in more than 60% of swapped pairs. "Verbosity bias is when an LLM judge favors longer,
    verbose responses, even if they are not as clear, high-quality, or accurate as shorter
    alternatives." On self-enhancement, "GPT-4 favors itself with a 10% higher win rate", but "our
    study cannot determine whether the models exhibit a self-enhancement bias". And the judge "also
    shows limitations in grading basic math problems which it is capable of solving", which the
    reference answers address. The paper also says it "emphasizes helpfulness but largely neglects
    safety" (all src-arxiv-2306-05685-v4).

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The judge is called through OpenAI's API, and API-served models can be the
    system under test (gen_api_answer.py); serving open weights on GPUs is the entrant's choice.
  compute_tier_source: src-github-fastchat-llm-judge-readme
  compute_tier_quote: to generate GPT-3.5/4 and Claude's answers
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: Automatable end to end with an API key for the judge. The judge is a
    hosted model whose snapshots retire, so the headline condition (a GPT-4 judge) stops being
    reproducible when the last GPT-4 snapshot shuts down; the vocabulary deferred a blocker for
    hosted judges.
  reproducibility_tier_basis:
    reason: Answer generation, judging at temperature 0 and score computation are scripted, on
      public questions and reference answers.
    source: src-github-fastchat-llm-judge-common
    quote: judgment = chat_completion_openai(model, conv, temperature=0, max_tokens=2048)
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: FastChat's fastchat/llm_judge package (gen_model_answer.py or gen_api_answer.py, then
    gen_judgment.py and show_result.py)
  harness_source: src-github-fastchat-llm-judge-readme
  harness_quote: In this package, you can use MT-bench questions and prompts to evaluate your models
    with LLM-as-a-judge.
  harness_gotcha:
    source: src-openai-api-deprecations
    quote: October 23, 2026 | `gpt-4-0613` \| `gpt-4`, `gpt-4-0613-completions`
  harness_gotcha_note: gen_judgment.py's default judge is the unpinned gpt-4 alias
    (src-github-fastchat-llm-judge-gen-judgment). OpenAI shut down gpt-4-0314, the snapshot of the
    paper's case studies, on 2026-03-26, and shuts down gpt-4-0613 and the gpt-4 alias on
    2026-10-23, nine days after this entry was read. After that a run must name another judge, which
    is a different condition, and CyclicJudge shows judges differ by more than a scale point.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for lm-sys/FastChat, read 2026-10-14; not a quoted
    Source. The repository was last pushed on 2026-05-01, and llm_judge last changed on 2024-07-31.
  runnable_via:
    - custom
  runnable_via_note: UK AISI's inspect_evals does not list MT-Bench (its src/inspect_evals directory
    listing, read 2026-10-14).
  maintainer_rerun_policy: unstated

comparability:
  # The model-graded profile applies (judge model and version, judge prompt, rubric). Beyond it: the system's
  # chat template, which FastChat picks per model and which changes its answers, and the generation temperature,
  # which FastChat sets per category (0.7 for writing and roleplay, 0 for math, coding, reasoning and extraction).
  material_extra:
    - prompt_template_hash
    - sampling

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: One headline, the mean of the judge's 1-10 grades over all turns.
  source: src-github-fastchat-llm-judge-readme
  quote: For each turn, GPT-4 will give a score on a scale of 10. We then compute the average score
    on all turns.


# data/benchmarks/language/flores.yaml
#
# P1-S3-T02, checkpoint entry 11 of 20 (copilot on: the F6 copilot's extractive drafter gave the title, arXiv id
# and release date of FLORES-101). Filled from the FLORES-101 paper, arXiv 2106.03193 read as its v1 PDF, and
# its abstract page; the Open Language Data Initiative's home and getting-started pages; and Hugging Face's API
# record of the FLORES+ dataset, whose card is gated and was not read. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The family entry: FLORES-101 (2021), FLORES-200 (2022, with NLLB) and FLORES+ (OLDI's continuation) are one
# set of English Wikimedia sentences translated into ever more languages. The editions are not separate entries.

id: flores
name: FLORES
aliases:
  - FLORES-101
  - FLORES-200
  - FLORES+
tagline: English Wikimedia sentences professionally translated into 200+ languages, for many-to-many
  MT evaluation.
description: >
  3,001 sentences from English Wikinews, Wikijunior and Wikivoyage, translated by professional translators
  through a controlled, human-checked process. All translations are aligned, so any language can be scored
  into any other. FLORES-101 covered 101 languages, FLORES-200 about 200, and FLORES+ (maintained by the
  Open
  Language Data Initiative since FLORES-200) takes community contributions of new languages. Systems are
  scored on the devtest split with reference metrics: SentencePiece BLEU (spBLEU, proposed with FLORES-101),
  and later chrF++. FLORES-101's test split was kept for an evaluation server; FLORES+ publishes dev and
  devtest only.
self_description:
  source: src-arxiv-2106-03193-v1
  quote: The resulting dataset enables better assessment of model quality on the long tail of
    low-resource languages, including the evaluation of many-to-many multilingual translation
    systems
external_ids:
  huggingface: openlanguagedata/flores_plus
  arxiv: '2106.03193'
paper:
  title: The FLORES-101 Evaluation Benchmark for Low-Resource and Multilingual Machine Translation
  arxiv: '2106.03193'
  version_read: v1
  source: src-arxiv-2106-03193-v1
released: 2021-06-06
released_note: FLORES-101's arXiv submission, as the abstract page dates it; the family's first
  public release.
released_source: src-arxiv-2106-03193
released_quote: Submitted on 6 Jun 2021

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/translation
  secondary:
    - language/low-resource-languages
    - language/multilingual
domain_basis:
  reason: The task is translation between any two of the covered languages, and the benchmark's own
    purpose is the long tail of low-resource languages.
  source: src-arxiv-2106-03193-v1
  quote: These sentences have been translated in 101 languages by professional translators through a
    carefully controlled process
capability:
  - generation-fidelity
capability_basis:
  generation-fidelity:
    reason: A system's translation is scored by its similarity to a professional reference
      translation of the same sentence.
    source: src-arxiv-2106-03193-v1
    quote: we describe our proposed SentencePiece BLEU metric
evaluation_method:
  - reference-metric
evaluation_method_basis:
  reason: spBLEU, and later chrF++, are fixed-formula similarity measures against reference
    translations.
  source: src-arxiv-2106-03193-v1
  quote: We show spBLEU on devtest of FLORES-101 for M2M-124 615M parameter model
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The entrants are translation systems trained for translation and scored as trained,
    task-specific- supervised-model's own example. Prompted general models are scored on it too, but
    it was built for MT systems.
  source: src-arxiv-2106-03193-v1
  quote: including the evaluation of many-to-many multilingual translation systems

lifecycle: active
lifecycle_basis:
  reason: The maintainers keep extending FLORES+ (the Hugging Face dataset was last modified on
    2026-10-01) and run a shared task at WMT26 on their data; translation papers still report FLORES
    devtest scores.
  source: src-oldi-home
  quote: 'Latest news: We are organising a shared task at WMT26.'
activity: unknown
activity_note: FLORES-101's hidden test split was scored by an evaluation server; whether that
  server still runs was not read. FLORES+ publishes only dev and devtest, and OLDI keeps no results
  board; contributions it takes are new languages, not results.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: M2M-124 (615M)
    source: src-arxiv-2106-03193-v1
    observed_on: 2026-10-10
    quote: We show spBLEU on devtest of FLORES-101 for M2M-124 615M parameter model
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Professional reference translations; FLORES-101's test references were
  withheld, dev and devtest references are public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The devtest split, on which results are reported, and its references are downloadable, and
    the metric is a fixed formula.
  source: src-arxiv-2106-03193-v1
  quote: while the dev and devtest are publicly downloadable

task:
  exists: true
  input:
    - a sentence in a source language of the set
  output: Its translation into a target language of the set.
  scoring: spBLEU (or chrF++) against the reference translation, per direction, usually on devtest.
  source: src-arxiv-2106-03193-v1
  quote: We show spBLEU on devtest of FLORES-101 for M2M-124 615M parameter model

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_basis:
    reason: FLORES+ is distributed through a Hugging Face dataset whose card is gated with automatic
      approval, so a user must sign in and accept its terms before downloading. FLORES-101 was a
      direct download; its test split was never released.
    source: src-hf-api-flores-plus
    quote: '"gated":"auto"'
  refresh: versioned-releases
  refresh_basis:
    reason: The language set grows in named releases (FLORES-101, FLORES-200, FLORES+), and FLORES+
      adds languages and corrections over time; a claim names the edition and language pair.
    source: src-oldi-home
    quote: It is an extended and improved version of the FLORES-200 dataset
  data_provenance:
    - expert-authored
    - web-scraped
  data_provenance_note: Source sentences were taken from English Wikinews, Wikijunior and
    Wikivoyage; the translations, which are the evaluation references, were written by professional
    translators and human-checked.
  data_provenance_source: src-arxiv-2106-03193-v1
  data_provenance_quote: consisting of 3001 sentences extracted from English Wikipedia and covering
    a variety of different topics and domains
  contamination_risk: medium
  contamination_risk_note: The devtest split that results are reported on, and its references, have
    been public since 2021, and the source sentences are Wikimedia text on the open web. A training
    route is plausible, and no evidence was read.
  contamination_evidence: []
  dataset_licence: CC-BY-SA-4.0
  dataset_licence_source: src-hf-api-flores-plus
  dataset_licence_quote: '"license":["cc-by-sa-4.0"]'
  size_note: 3,001 sentences (dev, devtest and the withheld test, about 1,000 each in FLORES-101);
    FLORES+ has dev and devtest in about 230 language varieties.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Open Language Data Initiative (OLDI)
  maintainer_basis:
    reason: FLORES+ is managed by OLDI's team, which took it over from the FLORES-200 release;
      FLORES-101 and FLORES-200 came from Meta AI.
    source: src-oldi-getting-started
    quote: The FLORES+ and OLDI-Seed datasets are managed directly by the OLDI team
  maintainer_type: community-collective
  maintainer_type_note: OLDI lists organisers from several universities, companies and foundations
    and states no legal form.
  submission_process:
    - literature-only
  submission_process_note: OLDI takes contributions of new languages and corrections, not results;
    results appear in papers and shared-task reports.
  independence_flags: []
  independence_flags_note: None recorded. Meta AI built FLORES-101/200 and its NLLB models are
    scored on it; with no board of its own, there is no ranking for the maintainer to compete on.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Public devtest references and a fixed metric; any system can be scored end to end.
    source: src-arxiv-2106-03193-v1
    quote: while the dev and devtest are publicly downloadable
  harness_availability: reference-implementation-only
  harness_availability_note: spBLEU is implemented in sacrebleu with the FLORES SentencePiece model;
    no maintainer harness was read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the edition and split (FLORES-101/200/+, devtest), the language pair and
  # direction, and the metric (spBLEU with which SentencePiece model, or chrF++).
  material_extra:
    - subset_used

homepage: https://oldi.org/
dataset_url: https://huggingface.co/datasets/openlanguagedata/flores_plus

tags:
  - machine-translation
  - low-resource-languages
  - multilingual
  - wikimedia

# --- Curation --------------------------------------------------------------------------------


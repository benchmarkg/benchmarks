# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-fiction-live-api-fiction-livebench-chapters
    - src-fiction-live-api-fiction-livebench-node
    - src-gist-fiction-livebench-sample-1k
    - src-epoch-benchmarks-fictionlivebench
    - src-epoch-benchmark-data
    - src-arxiv-2512-02556-v1
    - src-arxiv-2506-05939-v1
  sources_note: >
    Fiction.live's chapters and node records, the JSON its script-rendered story page loads, read in narrow
    windows (withheld from archiving: they carry personal handles); the 1k sample gist at its pinned revision;
    Epoch's benchmark page and its export row; the DeepSeek-V3.2 report's v1 PDF and the ChronoQA paper's
    v1 PDF (DOIs, not archived). The leaderboard image and the 8k sample gist were looked at, not cited.
    The scaffolded Source src-fiction-live-stories-fiction-livebench-mar-14-2025-5e443317 (Epoch's link,
    the page shell) has no extract and is not cited.
  confidence: medium
  review_checks:
    - check: evaluation_method is empty and execution_mode null because no source read says how an
        answer is graded (an answer key, a model judge or a person). The sample asks for a list of
        names, which suggests a key, but no expected answer is published. Ask Fiction.live, or find
        a statement on its X account or in a later post.
      field: evaluation_method
      source: src-gist-fiction-livebench-sample-1k
      quote: 'Question: Finish the sentence, what names would Jerome list? Give me a list of names only.'
    - check: language/long-context against ruler, the leaf's other entry. RULER is synthetic,
        generated on demand from public code, mostly retrieval of inserted strings and scored by
        string recall, with an effective-length headline. Fiction.LiveBench uses real user-written
        fiction, private questions on subtext that are designed to defeat search, lengths from a
        cut-down story to 192K, and no headline across lengths. The post sets itself against RULER
        by name. language/understanding is kept as the secondary.
      field: domain
      source: src-fiction-live-api-fiction-livebench-chapters
      quote: It's a specific long context real world test that we find more reflective of writing
        use than LongBench or RULER, which test search rather than comprehension.
    - check: The counts disagree. The post describes a dozen stories, while Epoch counts 36
        questions about 30 stories, and most of the board's scores are multiples of 1/36. A few are
        not, for example 87.5 at 0 tokens and 93.8 at 120K, so the number of questions may differ by
        length. Which count holds now, and whether the set grew without a dated entry, is unknown.
      field: data.size
      source: src-epoch-benchmarks-fictionlivebench
      quote: The benchmark consists of 36 questions about 30 stories.
    - check: Versions follow 04 S4. Model additions are leaderboard updates, not versions; the
        2025-02-21 change to the question mix is a breaking revision, and the 2025-05-22 extension
        to 192K is recorded as a non-breaking revision, although it may only be longer runs for some
        models rather than new items. Whether the board was rescored on the revised set (the
        pre-revision rows went to an "older results" image) is not stated. Epoch's one string maps
        with version null, and its release date is the revision's.
      field: versions
      source: src-fiction-live-api-fiction-livebench-chapters
      quote: 'Older results: https://cdn6.fiction.live/file/fictionlive/5aa21fca-ff97-4483-9dd6-ae141dfe0a9e.png'
    - check: refresh is versioned-releases because the changes the sources show are dated in the
        changelog. The set is private, the counts disagree (above), and the board does not label
        which set a row was scored on, so rolling-live, or null as biglaw-bench has it, could be
        argued.
      field: data.refresh
    - check: data.access is private-test-server, the step-2 honesty case. The items behind every
        score stay with Fiction.live, which runs every model. proprietary-closed was weighed and
        rejected because no source says the data is withheld commercially. The two sample prompts
        are public.
      field: data.access

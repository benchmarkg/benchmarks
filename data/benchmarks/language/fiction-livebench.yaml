# data/benchmarks/language/fiction-livebench.yaml
#
# P1-S10-T04, language entry 9. Promotes the Epoch stub data/benchmarks/_stubs/fiction-livebench.yaml. Filled from
# Fiction.live's own post, read through the API records its script-rendered story page loads (the chapters record,
# which holds the announcement, methodology, results and changelog, and the story node, for the current title and
# creation time); the 1k sample question the post links, a GitHub gist read at its pinned revision; Epoch AI's
# benchmark page, for its methodology note and counts, and Epoch's benchmark export, which lists Fiction.LiveBench in
# its capabilities index; the DeepSeek-V3.2 report's v1 PDF (December 2025) as evidence of current use; and the
# ChronoQA paper's v1 PDF (June 2025), a third party's account of the benchmark's access. The leaderboard is an image
# with no text table and was viewed, not quoted. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.

id: fiction-livebench
name: Fiction.LiveBench
aliases:
  - Fiction.liveBench
tagline: Private questions on the subtext of long user-written stories, asked at lengths from a
  cut-down version to 192K tokens.
description: >
  Fiction.live's long-context comprehension benchmark. Fiction.live is a platform where writers share
  fiction and offers AI writing tools, and it built the benchmark to show its users which model
  to choose for writing work. The material is a dozen very long, complex stories from its users with quizzes
  on them, and the questions are written to test subtext rather than facts that can be searched for: how
  a relationship changes over time, predictions from hints the story has planted, and what the reader
  has been told in confidence as against what the characters know. Each test starts from a cut-down version
  holding only the relevant information (the "0"-token test) and then cuts less and less, so that at longer
  lengths the relevant information is a small part of the story. The model gets the story and a question
  at the end; the published 1k sample asks it to finish a sentence by listing names. Fiction.live runs
  every model itself and publishes a table of scores per length, from 0 to 192K tokens, as an image with
  a dated changelog; the dataset stays private. Epoch AI, which carries the board's 16K column in its
  capabilities index, counts 36 questions about 30 stories. How answers are graded is not stated in any
  source read.
self_description:
  source: src-fiction-live-api-fiction-livebench-chapters
  quote: That's why we're launching a new benchmark called Fiction.LiveBench to demonstrate the case
    and to show our users which LLM they should choose in their writing tasks.
external_ids:
  epoch: Fiction.LiveBench
paper: null
paper_note: There is no paper. The benchmark is described only in Fiction.live's post, which is the
  story page the board lives on.
released: 2025-02-19
released_note: The story's creation time in Fiction.live's node record, 1739984083087 ms, which is
  2025-02-19 16:54 UTC; the post itself was created at 21:15 UTC the same day. Epoch's export and
  the stub give 2025-02-21, the date of the first changelog entry, which revised the question mix
  (versions).
released_source: src-fiction-live-api-fiction-livebench-node
released_quote: '"ct":1739984083087'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/long-context
  secondary:
    - language/understanding
domain_basis:
  reason: The post builds the benchmark around one claim, that comprehension breaks down as the
    input grows, and each question is asked at increasing lengths of the same story, so the
    difficulty the board reports is set by length. Every answer is fixed by the supplied story,
    which is language/understanding's definition, kept as the secondary.
  source: src-fiction-live-api-fiction-livebench-chapters
  quote: The root problem is that long context comprehension is still broken.
domain_considered_and_rejected:
  - term: language/creative-writing
    reason: The material is fiction and the users are writers, but the model writes nothing that is
      scored on craft; it answers questions about a story it is given.
    source: src-gist-fiction-livebench-sample-1k
    quote: I'm conducting a LLM comprehension test. I'm going to give you a story, and at the end
      you're going to answer a question about the story.
  - term: language/retrieval-qa
    reason: The whole story is in the prompt and nothing is retrieved from a corpus; the post says
      the questions are built so that searching for the relevant passage does not work.
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: We deliberately designed hard questions that test understanding of subtext rather than
      information that can be searched for.
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: The story supplied in the prompt determines each answer, and the shortest test holds
      only the information the question needs. The questions are about invented characters and
      events, so knowledge the model already holds does not answer them.
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: For every test, we start with a cut down version that has only relevant information.
capability_considered_and_rejected:
  - term: memory-retention
    reason: At longer lengths the relevant information is spread through intervening story, which
      the term's inclusion test describes, but the whole story is in the window when the question is
      read, and the term's exclusion keeps it off benchmarks where only the input is long. Kept off
      as ruler does (review_checks).
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: Then we cut down less and less for longer tests where the relevant information is only
      part of the longer story overall.
  - term: temporal-reasoning
    reason: Tracking change over time and the chronology of events are among the abilities the post
      and Epoch name, but they are two of several, the questions are private, and no source says how
      many turn on order or duration.
    source: src-epoch-benchmarks-fictionlivebench
    quote: Answering the questions requires having a theory of mind for the characters, an
      understanding of the chronology of events and an ability to make inferences based on
      implicitly stated information.
  - term: abductive-reasoning
    reason: Predictions from planted hints and inferences from implicit information are named, but
      no source says the scored answer is a choice among explanations rather than a fact the story
      fixes.
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: logical predictions based on established hints
  - term: knowledge-recall
    reason: The stories are user-written fiction supplied in the prompt; no answer comes from what
      the model already holds.

evaluation_method: []
evaluation_method_note: No source read says how an answer is graded, whether by matching an answer
  key, by a model judge or by a person. The published sample asks for a list of names, which a key
  could check, but neither sample gist gives the expected answer. Left empty rather than inferred
  (review_checks).
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Plausible for answers such as a list of names, but no source states it.
    source: src-gist-fiction-livebench-sample-1k
    quote: 'Question: Finish the sentence, what names would Jerome list? Give me a list of names only.'
  - term: model-graded-judge
    reason: Plausible for comprehension answers of free text, but no source states it.
  - term: human-expert-eval
    reason: No source says that people grade the answers.
designed_for_subjects:
  - instruction-tuned-model
  - reasoning-model
designed_for_subjects_basis:
  reason: Models are prompted directly with the story and a question in a chat-style instruction,
    with no harness or tools. Reasoning models are run at stated settings, and the changelog marks
    reasoning variants and their effort in brackets, which the board lists as separate rows.
  source: src-fiction-live-api-fiction-livebench-chapters
  quote: o1 and o3-mini uses default (medium) settings. Claude sonnet 3.7-thinking uses 8k thinking
    tokens.
designed_for_subjects_considered_and_rejected:
  - term: hosted-inference-endpoint
    reason: Some rows name the provider that served the model ("[chutes/fp8]"), so the endpoint can
      matter to a result, but the benchmark is framed as choosing a model, not an endpoint; the
      provider is carried as provider_snapshot in comparability.
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: Added glm-4.5 [chutes/fp8].
as_used:
  - protocol: One column of the board, the 16K-token score, taken as the benchmark's score for
      Epoch's capabilities index, not the length series.
    source: src-epoch-benchmark-data
    quote: Fiction.LiveBench,True,fictionlivebench_external.csv,16k token
      score,1.0,0.0,1.0,2025-02-21,
    note: Epoch's page says it takes its rows from the Fiction.liveBench leaderboard; its export
      file carries the other ten length columns beside it.

lifecycle: active
lifecycle_basis:
  reason: Fiction.live was still adding models in April 2026, and Epoch's September 2026 export
    carries the benchmark in its capabilities index. DeepSeek-V3.2's report (December 2025) cites
    the board as evidence on long-context ability.
  source: src-fiction-live-api-fiction-livebench-chapters
  quote: '04/04/2026 - Added qwen3.6-plus [reasoning: high] [alibaba]'
activity: no-submission-channel
activity_basis:
  reason: Fiction.live chooses the models, runs them and publishes the table; the post invites
    sponsorship and feedback but describes no route by which a developer can submit a model or a
    result.
  source: src-fiction-live-api-fiction-livebench-chapters
  quote: We then evaluated leading LLMs across different context lengths.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: qwen3.6-plus
    source: src-fiction-live-api-fiction-livebench-chapters
    observed_on: 2026-11-09
    quote: '04/04/2026 - Added qwen3.6-plus [reasoning: high] [alibaba]'
  - system: DeepSeek-V3.2-Exp
    source: src-arxiv-2512-02556-v1
    observed_on: 2026-11-09
    quote: DeepSeek-V3.2-Exp consistently outperforms DeepSeek-V3.1-Terminus across multiple metrics
evaluation_target: learned-system
execution_mode: null
execution_mode_note: Whether a person takes part in grading is unknown, because no source says how
  answers are graded (evaluation_method_note).
ground_truth_source: held-out-labels
ground_truth_source_basis:
  reason: The tests are built on quizzes that Fiction.live says were verified, and the answers stay
    with Fiction.live with the rest of the dataset. Who wrote and verified them is not stated.
  source: src-fiction-live-api-fiction-livebench-chapters
  quote: Based on a selection of a dozen very long complex stories and many verified quizzes, we
    generated tests based on select cut down versions of those stories.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The stories, questions and answers are private, and only two prompts (one question, at 1k
    and 8k) are public, so nobody outside Fiction.live can produce a score.
  source: src-fiction-live-api-fiction-livebench-chapters
  quote: The actual dataset comes from our users and will remain private.

task:
  exists: true
  input:
    - an instruction that this is a comprehension test, a version of one story cut down to the
      target length (from the relevant information alone to the full story), and a question at the
      end
  output: A short free-text answer to the question; the 1k sample asks for a list of names only.
  scoring: Not stated in any source read. The board reports one percentage per model and length (0,
    400, 1K, 2K, 4K, 8K, 16K, 32K, 60K, 120K and 192K tokens, from the image), with no average
    across lengths.
  metric_range:
    - 0
    - 100
  source: src-gist-fiction-livebench-sample-1k
  quote: I'm conducting a LLM comprehension test. I'm going to give you a story, and at the end
    you're going to answer a question about the story.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: >
    Public: the post (methodology, a results table published as an image, an older results image and the
    dated changelog), two prompts the post links as examples of one hard question, at 8k and 1k (GitHub
    gists, without the expected answer), and Epoch's page with its counts. Withheld: the stories, the
    cut-down versions, the questions and answers, how answers are graded, and which tokenizer the lengths
    are counted in. Fiction.live runs every model itself. A 2025 paper describes the framework as entirely
    private with no public data.
  access_basis:
    reason: The items behind every published score stay with Fiction.live, which runs and scores
      each model itself, which private-test-server's inclusion test covers ("an evaluation the
      maintainer runs itself"). proprietary-closed was weighed, since the data is the platform's own
      users' content, but no source says it is withheld commercially, and the post's stated reason
      is that the data came from users.
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: The actual dataset comes from our users and will remain private.
  refresh: versioned-releases
  refresh_basis:
    reason: The changes to the set that the sources show are announced with dates in the changelog,
      a change to the question mix on 2025-02-21 and longer lengths on 2025-05-22 (versions). Model
      additions are leaderboard updates, not changes to the items. Because the set is private, an
      undated change cannot be ruled out (review_checks).
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: 2/21/2025 - To reflect common usage we increased the number of easy questions in our
      benchmark set.
  data_provenance:
    - crowd-authored
  data_provenance_note: The stories are Fiction.live users' own writing, which the post calls a huge
    repository of complex long story content. Who wrote the quizzes and how the cut-down versions
    were made (by hand or by a model) is not stated; Epoch says only that shorter versions which
    preserve the key details are created. model-generated may also apply.
  data_provenance_source: src-fiction-live-api-fiction-livebench-chapters
  data_provenance_quote: The actual dataset comes from our users and will remain private.
  contamination_risk: medium
  contamination_risk_note: The questions and answers have never been published, which works against
    a route, and Fiction.live and a third-party paper both say so. But every run sends the full
    prompt to the provider serving the model, one question is public at two lengths, and the stories
    are users' writing on a fiction platform that may itself be on the open web; whether the stories
    are publicly posted is not stated. No source evidences a route or reports contamination.
  contamination_risk_source: src-arxiv-2506-05939-v1
  contamination_risk_quote: they rely on a entirely private evaluation framework with no publicly
    available data
  contamination_evidence:
    - source: src-fiction-live-api-fiction-livebench-chapters
      stance: against
      quote: The actual dataset comes from our users and will remain private.
    - source: src-arxiv-2506-05939-v1
      stance: against
      quote: they rely on a entirely private evaluation framework with no publicly available data
  ceiling_anchor_type_note: No human score is published. 100% is the top of the board's scale, and
    several models reach it at shorter lengths.
  dataset_licence: null
  dataset_licence_note: The data is not released and no licence is stated; the post and the gists
    carry none.
  size:
    - count: 36
      unit: questions
      note: Epoch's count; the post gives none. Most of the board's scores are multiples of 1/36
        (2.78 points), which fits, though a few columns are not (the image, not a quoted Source).
      source: src-epoch-benchmarks-fictionlivebench
      quote: The benchmark consists of 36 questions about 30 stories.
    - count: 30
      unit: stories
      note: Epoch's count, against the post's "a dozen" (the next row); review_checks.
      source: src-epoch-benchmarks-fictionlivebench
      quote: The benchmark consists of 36 questions about 30 stories.
    - count: 12
      unit: stories ("a dozen very long complex stories"), as the post first described the set
      source: src-fiction-live-api-fiction-livebench-chapters
      quote: Based on a selection of a dozen very long complex stories and many verified quizzes, we
        generated tests based on select cut down versions of those stories.
  size_note: The board has eleven length columns (0, 400, 1K, 2K, 4K, 8K, 16K, 32K, 60K, 120K and
    192K), read from the image and from the column names of Epoch's export file, not from a quoted
    text. Not every model is run at every length (the changelog notes runs "up to 16k for now" and
    to 40K).
  languages:
    - en
  languages_note: The published sample is in English; no source states the language of the full set.
  languages_source: src-gist-fiction-livebench-sample-1k
  languages_quote: I'm conducting a LLM comprehension test.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Fiction.live
  maintainer_basis:
    reason: Fiction.live built the set from its users' stories, runs the models and publishes the
      board on its own site.
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: Fiction.live happens to be a huge repository of complex long story content
  maintainer_type: industry-lab
  maintainer_type_note: Fiction.live is a platform that offers AI writing tools and is open to
    sponsorship; no source read states its legal form, so for-profit is inferred from the product,
    not quoted (review_checks).
  maintainer_type_source: src-fiction-live-api-fiction-livebench-chapters
  maintainer_type_quote: Fiction.live has AI tools that help writers save time by making summaries,
    timelines, character bibles
  submission_process:
    - maintainer-run
  submission_process_note: Fiction.live selects the models (frontier releases, open-weight models
    and anonymous preview models, some on free endpoints), runs them, and adds them in dated
    changelog entries. Nobody else submits, which is why private-test-server access sits beside a
    maintainer-run process here.
  submission_process_source: src-fiction-live-api-fiction-livebench-chapters
  submission_process_quote: We then evaluated leading LLMs across different context lengths.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-fiction-live-api-fiction-livebench-chapters
      quote: The actual dataset comes from our users and will remain private.
  independence_flags_note: Fiction.live holds the set and runs every evaluation, and a 2025 paper
    notes that this makes reported results hard to verify. Fiction.live builds no model, so
    maintainer-competes-on-own-benchmark does not apply. It offers AI writing tools and uses the
    board to tell its users which model to choose, and it invites sponsorship; no source read names
    a sponsor or says an evaluated party paid for or influenced placement, so no further flag is set
    (review_checks).
  independence_assessed: true
  known_limitation:
    source: src-fiction-live-api-fiction-livebench-chapters
    quote: 5/22/2025 - Added Gemini Pro 2.5 Flash Preview 05-20. Expanded certain models up to 192k
      length.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Only Fiction.live can run the benchmark. The rows are hosted models, some named
    with their provider, so its own cost is inference spend, but no source states it.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The stories, questions and answers stay with Fiction.live, so nobody else can produce a
      score.
    source: src-arxiv-2506-05939-v1
    quote: These existing issues make it difficult for researchers to verify reported results
  reproducibility_blockers:
    - private-test-set
    - no-reference-implementation
  reproducibility_blockers_note: No code, prompt template beyond the two samples, or grading method
    is published.
  harness_availability: none
  harness: null
  harness_note: No harness or grading code is published in any source read.
  code_licence: null
  code_licence_note: No code is released.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # No evaluation method is stated, so the facet pairs resolve to the fallback profile (subset_used). Beyond it: the
  # input length, which is THE condition (each column is a different number, and the tokenizer the lengths are
  # counted in is not stated); reasoning effort and thinking budget, which the post states per model and the board
  # lists as separate rows; the serving provider, which some rows name and one changelog entry re-ran after a
  # provider fix; and the date, because the question mix was revised on 2025-02-21 and the board does not label
  # which set a row was scored on.
  material_extra:
    - context_window_used
    - reasoning_effort
    - thinking_token_budget
    - provider_snapshot
    - date_evaluated

aggregation_policy: none-by-design
aggregation_policy_note: The board gives one score per model and length and no average across
  lengths; consumers pick a column, as Epoch does with 16K.
aggregation_policy_basis:
  reason: Scores are pooled over the stories at each length and shown per length, with no summary
    number across lengths.
  source: src-epoch-benchmarks-fictionlivebench
  quote: The models are tested separately on every length of summary and the results are aggregated
    across all of the 30 stories

homepage: https://fiction.live/stories/Fiction-liveBench-April-04-2026/oQdzQvKHw8JyXbN87
homepage_note: The story's slug and title change with each update (Mar-14-2025 in Epoch's link,
  April-6-2025 in DeepSeek-V3.2's footnote); the id oQdzQvKHw8JyXbN87 is stable.
leaderboard_url: https://fiction.live/stories/Fiction-liveBench-April-04-2026/oQdzQvKHw8JyXbN87
api_url: https://fiction.live/api/anonkun/chapters/oQdzQvKHw8JyXbN87/0/9999999999999

# data/benchmarks/language/wmt-general-mt.yaml
#
# P1-S10-T03, language entry 2 of 7. Filled from the WMT25 General MT task page and the WMT26 one on
# www2.statmt.org (scripts and styles stripped); the WMT25 findings paper ("Findings of the WMT25 General Machine
# Translation Shared Task: Time to Stop Evaluating on Easy Test Sets", ACL Anthology 2025.wmt-1.22) read as the
# text of its PDF, and its Anthology landing page; the WMT24 findings paper (2024.wmt-1.1) read as the text of its
# PDF; the READMEs of the wmt-conference/wmt25-general-mt and wmt26-general-mt repositories at main; and the
# arXiv abstract page and v1 PDF of North Small Translate (arXiv 2609.13916, September 2026), as evidence of
# current use. Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.
#
# The family entry: one entry for the yearly General MT task (the News translation task until it was renamed),
# its recent editions as versions. The stress corpus's `wmt25-general-mt-shared-task` is the 2025 edition.

id: wmt-general-mt
name: WMT General Machine Translation
aliases:
  - WMT General MT shared task
  - WMT News Translation Task
  - WMT25 General MT Shared Task
  - WMT26 General MT
tagline: The Conference on Machine Translation's yearly general MT shared task, ranked by
  professional human evaluation.
description: >
  The main shared task of WMT, the Conference on Machine Translation (a workshop from 2006 to 2015,
  then a conference under ACL's SIGMT), formerly the News translation task. Each year the organisers
  build new test sets of recent, source-original documents, have professional agencies translate
  them, and release the sources as a blind set; teams translate them within about two weeks and
  upload the outputs to OCELoT, where no score is shown. The organisers also collect translations
  from popular LLMs and anonymised online services. The official ranking comes from human
  evaluation: Error Span Annotation (ESA) since 2024, with MQM for some pairs, by professional
  translators and, for some pairs, a paid crowd; systems are ranked by score into significance
  clusters per language pair. WMT25 had 30 language pairs, half human-evaluated, over news,
  social, speech, literary, education and dialogue documents. An automatic ranking (AutoRank:
  LLM judges and learned metrics, chrF++ for the lowest-resource pairs) chose which systems reached
  human evaluation and ranked the rest. WMT26 (23 pairs, instructions attached to each sample)
  evaluates every primary system by contrastive ESA and publishes no automatic ranking. Systems
  compete in a constrained track (open weights under 20B parameters) and an unconstrained one, and
  sources, outputs, references and judgements are released after each round.
self_description:
  source: src-wmt25-general-mt-site
  quote: Formerly known as News translation task of the WMT focusses on evaluation of general
    capabilities of machine translation (MT) systems.
paper:
  title: 'Findings of the WMT25 General Machine Translation Shared Task: Time to Stop Evaluating on Easy
    Test Sets'
  doi: 10.18653/v1/2025.wmt-1.22
  source: src-acl-2025-wmt-1-22-pdf
released: null
released_note: The series began with the 2006 workshop's shared translation task (Koehn and Monz,
  2006, the first edition the WMT25 findings cite); no source read gives a date for it. WMT25 was
  the 20th event, counting the ten workshops.
released_source: src-acl-2025-wmt-1-22-pdf
released_quote: before becoming a conference, making this the 20th event overall
release_venue: WMT (the Workshop, from 2016 the Conference, on Machine Translation)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/translation
  secondary:
    - language/low-resource-languages
    - language/multilingual
  per_edition: true
  per_edition_note: The language pairs change every year. The low-resource directions were English
    to Bhojpuri and Maasai in 2025, and English to Ladin, Ligurian and Northern Sami in 2026. The
    multilingual subtask, which scored systems on 15 more target languages, ran in 2025.
domain_basis:
  reason: Every edition scores translations of documents from a source language into a target
    language, one direction at a time.
  source: src-wmt25-general-mt-site
  quote: Formerly known as News translation task of the WMT focusses on evaluation of general
    capabilities of machine translation (MT) systems.
domain_considered_and_rejected:
  - term: multimodal/video-language
    reason: The speech domain's sources are videos, and the human raters judge translations against
      the video, but systems receive an ASR transcript and may ignore the video; what is scored is
      the translation of one domain among four or more. The corpus classification logs the same gap
      (failure 2026-09-28-wmt25-general-mt-shared-task-001).
    source: src-wmt25-general-mt-site
    quote: The speech domain is going to be released with the original video together with machine
      generated transcript.
  - term: audio-speech/speech-translation
    reason: Spoken input is one domain and arrives with a transcript; translating speech is IWSLT's
      subject, and here text in, text out is the task.
  - term: language/long-context
    reason: Sources are whole documents, the WMT25 literary ones about 9,900 words in two documents,
      but no score isolates difficulty from input length; the other domains are paragraph-sized.

capability:
  - generation-fidelity
capability_basis:
  generation-fidelity:
    reason: Raters mark error spans in each translation against its source and score it from 0 to
      100 (ESA), or have error categories weighted into a score (MQM); the score is faithfulness to
      the source document. The taxonomy uses this benchmark's 2025 edition as the term's example.
    source: src-acl-2025-wmt-1-22-pdf
    quote: The human evaluation is done primarily using Error Span Annotation (ESA; Kocmi et al.,
      2024b).
capability_considered_and_rejected:
  - term: instruction-following
    reason: WMT26 attaches instructions to each sample (formality, glossaries, structured formats,
      style), but ignoring one is counted as a translation error inside the same ESA score, not
      scored apart from translation quality.
    source: src-wmt26-general-mt-site
    quote: not following instructions will be considered a translation error
  - term: perception
    reason: Speech-domain systems may use the video, and social-domain ones screenshots, but the
      transcript is supplied and the score is the translation, not what was recovered from the
      signal.

evaluation_method:
  - human-expert-eval
  - human-crowd-eval
  - model-graded-judge
  - model-derived-metric
  - reference-metric
  - entrant-relative-ranking
evaluation_method_basis:
  reason: The official result is human evaluation, ESA or MQM, by professional translators and
    linguists for most pairs and by a paid crowd screened on platform performance for others.
    Through WMT25 an automatic ranking chose which systems reached human evaluation and stayed the
    official result for the rest. It averaged robustly scaled scores from two GEMBA-ESA judges
    (GPT-4.1 and Command A, prompted LLMs) and three learned metrics (MetricX-24-Hybrid-XL,
    XCOMET-XL and CometKiwi-XL). For Bhojpuri and Maasai it used chrF++ alone, a fixed-formula
    reference metric. Ranks are ranges over Wilcoxon tests against the other systems, grouped into
    clusters, and AutoRank is rescaled from 1 to the number of systems, so both move with the pool.
  source: src-acl-2025-wmt-1-22-pdf
  quote: Systems not selected for human evaluation keep their AUTORANK ranking as the official
    result for that language pair
evaluation_method_considered_and_rejected:
  - term: composite
    reason: AutoRank averages a judge's and learned metrics' scores, but the headline is the human
      ESA or MQM score, one method; AutoRank selects systems and ranks only those not human-rated,
      and WMT26 dropped it.
    source: src-wmt26-general-mt-site
    quote: All systems will be human evaluated - we will not rely on automatic evaluation to drop
      low performing systems
  - term: pairwise-preference-elo
    reason: WMT26's contrastive ESA rates several systems' translations of a source together, but
      each still gets an error-span score; no rating is fitted to preference votes.
designed_for_subjects:
  - task-specific-supervised-model
  - instruction-tuned-model
  - full-product-pipeline
  - human-expert
designed_for_subjects_basis:
  reason: The task was built for trained MT systems, and most 2025 entrants fine-tuned LLMs for
    translation. The organisers also prompt general LLMs zero-shot with each domain's instruction,
    add three online translation services as shipped products (ONLINE-B, G and W), and rank the
    professional human references among the systems.
  source: src-acl-2025-wmt-1-22-pdf
  quote: In line with previous years, we included translations from three public MT services,
    anonymized as ONLINE-{B,G,W}.
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: Reasoning models enter (Gemini 2.5 Pro ran with reasoning on), but no edition sets or
      reports a reasoning budget as a condition of the ranking.

as_used:
  - protocol: Long-context translation of WMT25's two English literary documents, concatenated into
      one request and translated into nine target languages, scored per segment by xCOMET-XL against
      the WMT25 references; not the task's human evaluation.
    split: WMT25 test set, English literary subset
    source: src-arxiv-2609-13916-v1
    quote: We evaluate long-context translation using a subset of the WMT25 General MT test set
    note: North Small Translate (September 2026), a Cohere model whose first author is one of the
      task's organisers.
  - protocol: The WMT26 test set scored by a reference-free LLM judge (GPT-5.6 Sol) for adequacy and
      fluency, weighted by segments per document; the official WMT26 human ranking was not yet out.
    split: WMT26 test set
    source: src-arxiv-2609-13916-v1
    quote: Thus, we use GPT-5.6 Sol judge without references for evaluation, which we ask to
      separately judge adequacy and fluency.

lifecycle: active
lifecycle_basis:
  reason: The 2026 edition took submissions until 2 July 2026 and has published its submissions and
    references, and a September 2026 paper reports results on the WMT25 and WMT26 test sets.
  source: src-wmt26-general-mt-site
  quote: '2026-07-27: We published the submissions and references'
activity: results-pending
activity_note: The WMT26 human annotations were released as preliminary on the repository (GitHub
  API, read 2026-10-14), but the findings paper with the official ranking is "to appear" at WMT26,
  28-29 October 2026, and the task page announces no automatic results.
activity_basis:
  reason: The WMT26 round closed on 2 July 2026, and its official ranking will appear in the
    findings paper at the conference; no round is open and no standing leaderboard takes outputs.
  source: src-github-wmt26-general-mt-readme
  quote: To appear in Proceedings of the Eleventh Conference on Machine Translation

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Gemini 2.5 Pro (best system overall at WMT25)
    source: src-acl-2025-wmt-1-22-pdf
    observed_on: 2026-10-14
    quote: The best system overall, was Gemini 2.5 Pro, which was in top cluster in 14 language
      pairs
  - system: Cohere CAT+ (North Small Translate), a WMT26 submission
    source: src-arxiv-2609-13916-v1
    observed_on: 2026-10-14
    quote: We submitted our model to the WMT 2026 General MT shared task as Cohere CAT+
evaluation_target: learned-system
execution_mode: panel
execution_mode_note: Human raters produce the official scores; automatic metrics pre-selected
  systems for them through WMT25.
ground_truth_source: expert-panel
ground_truth_source_note: The ground truth is the raters' error annotations and scores, made against
  the source (the video for speech, screenshots for social posts), not a stored answer. Reference
  translations feed only the automatic metrics and are ranked as an entrant.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: After each round the sources, references, system outputs and human judgements are public,
    and the WMT26 repository explains how to rerun its human evaluation in Pearmut. A rerun needs
    raters of one's own, so it reproduces the protocol, not the official numbers.
  source: src-acl-2025-wmt-1-22-pdf
  quote: All source data, system outputs, and human judgments are released to support transparency,
    reproducibility, and further research on machine translation.

task:
  exists: true
  input:
    - a source document in one of the edition's source languages (Czech, English, Japanese; Chinese
      too in 2026), from a domain such as news, social posts, speech, literary or education, with
      the domain's prompt instruction, and the video or screenshot for speech and social documents
  output: The document's translation into the target language, keeping its paragraph (segment)
    breaks, as a JSON-lines hypothesis.
  scoring: Per language pair, the micro-averaged human ESA (or MQM) segment score, with rank ranges
    from Wilcoxon signed-rank tests (p < 0.05) and clusters; constrained systems are also ranked
    among themselves. Through WMT25, AutoRank (GEMBA-ESA judges, MetricX, XCOMET, CometKiwi; chrF++
    for Bhojpuri and Maasai) chose about 18 systems per pair for human evaluation and ranked the
    rest.
  source: src-acl-2025-wmt-1-22-pdf
  quote: 'We calculate three different scores: the human ESA or MQM score, rank, and the cluster.'

entrant_classes:
  - class: constrained
    class_note: Since 2025, open-weight models under 20B parameters (mixtures of experts counted at
      their total size), with the weights released under a licence allowing at least unrestricted
      non-commercial use; training data is unrestricted.
    ranked_separately: true
    source: src-wmt26-general-mt-site
    quote: Constrained models compete only against other constrained, while unconstrained compete
      against all.
  - class: unconstrained
    ranked_separately: false
    source: src-wmt25-general-mt-site
    quote: Unconstrained track - track that do not place any limitations, neither requires
      publishing the model.
entrant_classes_history:
  source: src-acl-2024-wmt-1-1-pdf
  quote: 'We distinguish three types of MT systems participating in the shared task: constrained, open
    and closed systems.'

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The data may be used freely for research; other uses go to the original data owners.
    Multimodal assets are zip files on data.statmt.org.
  access_basis:
    reason: Once a round closes, its sources, references, every system output and the human
      judgements are published in a public GitHub repository, with no account or agreement needed.
      The current edition (WMT26) published its submissions and references on 2026-07-27.
    source: src-acl-2025-wmt-1-22-pdf
    quote: All submissions to the General MT Task, along with sources, references, and human
      judgments, are available in the dedicated GitHub repository.
  access_by_phase:
    during_edition: the blind sources are released and the references withheld; the human judgements
      do not exist until after the deadline
    after_edition: sources, references, system outputs and human judgements in the edition's GitHub
      repository
    note: OCELoT shows no score during submission ("human references do not exist at the time of
      submission", src-wmt25-general-mt-site).
  refresh: periodic-recompetition
  refresh_basis:
    reason: Every edition is ranked on test sets built for it from recent documents; earlier
      editions' sets become development data.
    source: src-wmt25-general-mt-site
    quote: Participants will use their systems to translate a testset of unseen documents.
  data_provenance:
    - web-scraped
    - expert-authored
    - model-generated
  data_provenance_note: Sources are harvested public or openly licensed documents (news from
    February 2025, Mastodon threads, Creative Commons YouTube videos, an Archive of Our Own story,
    public-domain Japanese stories, Czech school exercises); news, speech and social documents are
    picked by a difficulty estimator. The speech domain's source text is a Whisper transcript. The
    references, the human-evaluated anchor, are professional translations. WMT26 adds post-edited MT
    references and hybrid synthetic references assembled from rated system outputs.
  data_provenance_source: src-acl-2025-wmt-1-22-pdf
  data_provenance_quote: The test sets were translated by professional translation agencies
    according to the brief in Appendix B.
  contamination_risk: low
  contamination_risk_note: Within a round the structure works against contamination. Sources are
    recent documents, translations are collected within about two weeks of the blind set's release,
    and the references and human judgements do not exist or are withheld at submission. Not checked
    is whether published translations exist of the two public-domain Japanese stories (1938 and
    1942). After a round, sources, references and outputs are public and recommended as development
    data, so reuse of a past test set (as_used) carries an ordinary public-set risk.
  contamination_risk_source: src-acl-2025-wmt-1-22-pdf
  contamination_risk_quote: We collected public domain or open-licensed source data from a range of
    domains, focusing on the most recent data available to minimize potential overlap with the
    pretraining and fine-tuning data of the systems under evaluation.
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_note: The professional references are rated by the same protocol and ranked
    with the systems; in WMT25 they were in the winning cluster for 6 of 15 pairs, so systems
    reached or passed them elsewhere. The taxonomy uses this benchmark's 2025 edition as the term's
    example.
  ceiling_anchor_type_source: src-acl-2025-wmt-1-22-pdf
  ceiling_anchor_type_quote: Human references are in the winning cluster for only six out of 15
    language pairs
  dataset_licence: Research use (the task's own terms; no named licence)
  dataset_licence_note: The task page asks users to cite the findings paper and leaves other uses to
    the original data owners. GitHub reports no licence for the wmt25-general-mt and
    wmt26-general-mt repositories (API, read 2026-10-14).
  dataset_licence_source: src-wmt26-general-mt-site
  dataset_licence_quote: The data released for the General MT task can be freely used for research
    purposes
  size:
    - count: 30
      unit: language pairs, half of them evaluated by humans
      subset: WMT25
      source: src-acl-2025-wmt-1-22-pdf
      quote: Participants were invited to build systems for any of the 30 language pairs.
    - count: 23
      unit: language pairs, counted from the task page's list
      subset: WMT26
      source: src-wmt26-general-mt-site
      quote: English to Ladin (Val Badia), Italy (new)
    - count: 9000
      unit: source words per domain test set (about 60 to 100 segments)
      subset: WMT25
      source: src-acl-2025-wmt-1-22-pdf
      quote: approximately 9,000 words distributed across
    - count: 11
      unit: language pairs
      subset: WMT24
      source: src-acl-2024-wmt-1-1-pdf
      quote: participants were asked to build machine translation systems for any of 11 language
        pairs

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The WMT General MT task organisers (Conference on Machine Translation, ACL SIGMT)
  maintainer_basis:
    reason: The task is run for WMT, a conference under ACL's special interest group on machine
      translation, by an organising group of about 30 from universities and companies; Tom Kocmi
      (Cohere) is the first-listed organiser and the contact.
    source: src-acl-2025-wmt-1-22
    quote: 'Venue: WMT SIG: SIGMT'
  maintainer_type: conference-workshop
  maintainer_type_basis:
    reason: A recurring shared task of a yearly conference whose organiser list changes between
      editions (WMT26 added Samuel Frontull, Jean Maillard and Sara Rajaee, and thanks Barry Haddow
      and Konstantin Dranch, both WMT25 organisers, instead of listing them).
    source: src-wmt26-general-mt-site
    quote: ELEVENTH CONFERENCE ON MACHINE TRANSLATION (WMT26) 28-29 October, 2026 Budapest, Hungary
  submission_process:
    - held-out-server
    - maintainer-run
    - publication-gated
  submission_process_note: Teams upload translations of the blind set to OCELoT, which shows no
    score; the organisers rate primary systems after the deadline against judgements that do not yet
    exist. The organisers also choose LLMs and online services, collect their translations and rank
    them with the rest. A system description paper is required to be evaluated (WMT26), and in WMT25
    an abstract a week after the deadline was required for human evaluation.
  submission_process_source: src-wmt25-general-mt-site
  submission_process_quote: human references do not exist at the time of submission
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2609-13916-v1
      quote: 'Disclosure of conflict: the main author is also an organizer of the WMT General MT shared
        task.'
    - flag: grader-from-evaluated-party
      source: src-acl-2025-wmt-1-22-pdf
      quote: 'Cohere annotators: professional in-house employees experienced with annotations of general
        LLM outputs, bilingual speakers native in Italian.'
    - flag: funded-by-evaluated-party
      source: src-wmt25-general-mt-site
      quote: This task would not have been possible without the sponsorship of testsets translations
        and human evaluation done with our partners.
  independence_flags_note: Tom Kocmi of Cohere is the first-listed organiser. Cohere entered
    CommandA-WMT at WMT25 (findings appendix C.5, Kocmi et al.) and Cohere CAT+ at WMT26, and
    Cohere's Command A was also ranked as an organiser-collected LLM. Cohere's Command A was one of
    AutoRank's two GEMBA-ESA judges, and Cohere employees rated the English-Italian outputs. The
    partners that sponsored test-set translation and human evaluation include Cohere, Google and
    Charles University, whose systems are ranked (CommandA, Gemini 2.5 Pro, Gemma 3 and Google's
    GemTrans, the CUNI systems); Google and Charles University also have organisers on the task.
  independence_assessed: true
  funding:
    source: src-wmt25-general-mt-site
    quote: This task would not have been possible without the sponsorship of testsets translations
      and human evaluation done with our partners.
  funding_note: WMT25's partners were the Árni Magnússon Institute, Charles University, Cohere,
    Custom.MT, Dubformer, the Gates Foundation, Google, the Institute of the Estonian Language,
    Microsoft, NTT, Toloka, the University of Tartu and the University of Tokyo, with UKRI support;
    WMT26's list adds Alconost, Tencent and two Italian language institutes.
  participation:
    source: src-acl-2025-wmt-1-22-pdf
    quote: This year, we received 96 submissions from 36 participating teams.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: human-panel
  compute_tier_basis:
    reason: What a run costs is the organisers' paid human evaluation; each entrant's own inference
      cost varies with the system.
    source: src-acl-2025-wmt-1-22-pdf
    quote: All annotators were paid a fair wage in their respective countries.
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: The headline score is human ratings. The data and the annotation tool are public and the
      WMT26 repository shows how to rerun the campaign, so anyone who recruits raters can run it,
      not only the organisers.
    source: src-github-wmt26-general-mt-readme
    quote: You can start the annotation server without any completed annotations as follows
  reproducibility_blockers:
    - human-raters
  harness_availability: reference-implementation-only
  harness_availability_note: The published code checks submissions (wmt_gen_mt_tool.py), collects
    translations from LLMs and online services (wmt-collect-translations, Apache-2.0 per GitHub) and
    serves the human evaluation (Pearmut 1.1.6 for WMT26), but the official score is the raters'. UK
    AISI's inspect_evals has no WMT evaluation among its 137 (GitHub API listing, read 2026-10-14).
  harness: wmt_gen_mt_tool.py (blind-set handling and submission checks); Pearmut 1.1.6 with
    contrastive ESA (the WMT26 human evaluation)
  harness_source: src-wmt25-general-mt-site
  harness_quote: We are releasing a script wmt_gen_mt_tool.py to simplify handling the blindset.
  submission_channel:
    source: src-wmt26-general-mt-site
    quote: Submit translations into OCELoT until 2nd July
  code_licence: null
  code_licence_note: GitHub reports no licence for the wmt25-general-mt and wmt26-general-mt
    repositories (API, read 2026-10-14).
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The profiles resolve to human-judged (the raters), model-graded (the GEMBA judges and learned metrics) and
  # llm-static-text (chrF++) for prompted models; the purpose-built MT systems and the online services resolve
  # to the fallback. Beyond them: the track a system was ranked in (constrained or unconstrained), since
  # constrained systems are also ranked among themselves. The edition, language pair and domain are
  # subset_used.
  material_extra:
    - eligibility_track
aggregation_policy: none-by-design
aggregation_policy_note: Each language pair is ranked on its own; the findings count the pairs in
  whose top cluster a system lands but publish no score across pairs.
secondary_axes:
  - cost
secondary_axes_basis:
  reason: The WMT25 findings report each organiser-collected LLM's token counts and estimated
    translation cost beside its rank.
  source: src-acl-2025-wmt-1-22-pdf
  quote: The estimated costs shown are for the main test set and do not include the test suites.

homepage: https://www2.statmt.org/wmt26/translation-task.html
repository: https://github.com/wmt-conference/wmt26-general-mt

versions:
  - version: '2023'
    label: WMT23 General MT
    version_kind: edition
    changes: Human evaluation by DA+SQM, which WMT24 replaced.
    breaking: true
    superseded_by: '2024'
    frozen: true
    sources:
      - src-acl-2024-wmt-1-1-pdf
  - version: '2024'
    label: WMT24 General MT (EMNLP 2024, Miami)
    version_kind: edition
    changes: 11 language pairs, three new; paragraph-level test sets in up to four domains; audio as
      an extra source in the speech domain; ESA replaced DA+SQM; constrained, open and closed
      tracks.
    breaking: true
    supersedes_version: '2023'
    superseded_by: '2025'
    frozen: true
    sources:
      - src-acl-2024-wmt-1-1-pdf
  - version: '2025'
    label: WMT25 General MT (EMNLP 2025, Suzhou)
    version_kind: edition
    released: 2025-06-19
    changes: 30 language pairs, 15 of them human-evaluated (ESA, MQM for English-Korean and
      Japanese-Chinese); difficulty-sampled document-level test sets; video and screenshot sources;
      two tracks (constrained open weights under 20B, unconstrained); an automatically scored
      multilingual subtask; AutoRank with LLM judges choosing the systems for human evaluation.
    breaking: true
    supersedes_version: '2024'
    superseded_by: '2026'
    frozen: true
    sources:
      - src-wmt25-general-mt-site
      - src-acl-2025-wmt-1-22-pdf
      - src-acl-2025-wmt-1-22
      - src-github-wmt25-general-mt-readme
  - version: '2026'
    label: WMT26 General MT (EMNLP 2026, Budapest)
    version_kind: edition
    released: 2026-06-18
    changes: 23 language pairs; an instruction attached to each sample; contrastive ESA in Pearmut
      on every primary submission, with no automatic pre-selection or preliminary automatic results;
      many pairs without human references, and hybrid synthetic references built from rated outputs;
      one primary system per institute. The findings are due at the conference, 28-29 October 2026.
    breaking: true
    supersedes_version: '2025'
    frozen: true

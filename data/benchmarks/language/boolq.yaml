# data/benchmarks/language/boolq.yaml
#
# P1-S10-T04, language entry 8. Promotes the Epoch stub data/benchmarks/_stubs/boolq.yaml. Filled from the BoolQ
# paper, arXiv 1905.10044 read as its v1 PDF (NAACL 2019), its abstract page and its ACL Anthology page (N19-1300);
# the data release's README (google-research-datasets/boolean-questions, at its last commit); Hugging Face's API
# record of google/boolq; the SuperGLUE paper, arXiv 1905.00537 read as its v3 PDF, and the script bundle that
# renders the SuperGLUE site's FAQ and submission pages, for the test-server route; the README of the BoolQ task in
# inspect_evals at a pinned commit; the v1 PDF of "Natural Context Drift Undermines the Natural Language
# Understanding of Large Language Models" (arXiv 2509.01093, 2025) as current-use and contamination evidence; and
# Epoch's benchmark export, which lists BoolQ outside its capabilities index. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# Its own benchmark although SuperGLUE includes it as one of eight tasks: BoolQ was published, released and is
# scored on its own (the allocation's rationale), so the relation is recorded under lineage, not as subset_of.

id: boolq
name: BoolQ
aliases:
  - Boolean Questions
tagline: Naturally occurring yes/no questions from Google search, each answered from a Wikipedia
  passage; scored by accuracy.
description: >
  Google's reading comprehension dataset of yes/no questions that people actually asked: queries to the
  Google search engine that look like yes/no questions and return a Wikipedia page in the top five results,
  paired by an annotator with a passage of that page that answers them and labelled yes or no. A system
  reads the question and the passage (the article title is optional extra context) and answers yes or
  no, and is scored by accuracy against the single annotator's label. The release has 15,942 examples:
  9,427 training and 3,270 development examples with labels, and 3,245 test examples without them. The
  README promised the test labels and a leaderboard later; the repository, archived since May 2019, holds
  neither. SuperGLUE took BoolQ in as one of its eight tasks in July 2019, and its server
  is the route to a test score; most results now are on the public development set, including inspect_evals'
  task. The paper reported 80.43% test accuracy for BERT-large pre-trained on MultiNLI, against a 62.31%
  majority baseline and 90% for human annotators.
self_description:
  source: src-arxiv-1905-10044-v1
  quote: We build a reading comprehension dataset, BoolQ, of such questions, and show that they are
    unexpectedly challenging.
external_ids:
  epoch: BoolQ
  inspect_evals: boolq
  huggingface: google/boolq
  arxiv: '1905.10044'
paper:
  title: 'BoolQ: Exploring the Surprising Difficulty of Natural Yes/No Questions'
  arxiv: '1905.10044'
  doi: 10.18653/v1/N19-1300
  version_read: v1
  source: src-arxiv-1905-10044-v1
released: 2019-05-24
released_note: The paper's arXiv submission, its only version, as its abstract page dates it, and
  the date Epoch's export and the stub carry. The data repository's two commits are dated
  2019-05-28.
released_source: src-arxiv-1905-10044
released_quote: Submitted on 24 May 2019
release_venue: NAACL 2019
release_venue_source: src-arxiv-1905-10044
release_venue_quote: 'Comments: In NAACL 2019'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/understanding
domain_basis:
  reason: Each question comes with a Wikipedia passage that an annotator marked as containing the
    answer, and the system answers from that passage, so the supplied passage determines the answer,
    the leaf's definition.
  source: src-arxiv-1905-10044-v1
  quote: Each question is paired with a paragraph from Wikipedia that an independent annotator has
    marked as containing the answer.
domain_considered_and_rejected:
  - term: reasoning-general/commonsense
    reason: The paper stresses that the questions need inference beyond paraphrase, but its own
      framing is a reading comprehension dataset, and the answer is in or implied by the supplied
      passage; the leaf is for questions needing everyday knowledge stated nowhere in the prompt.
      The family's inclusion test asks for a literature that studies a reasoning form in its own
      right, and BoolQ's studies question answering from text.
    source: src-arxiv-1905-10044-v1
    quote: many questions require making additional inferences
  - term: language/retrieval-qa
    reason: The passage is given with the question; nothing is retrieved from a corpus. A
      document-level version, which would need retrieval within the article, is named only as future
      work.
    source: src-arxiv-1905-10044-v1
    quote: Future work could include building a document-level version of this task
  - term: general-intelligence/agi-composite-suites
    reason: That is SuperGLUE's place, the suite that includes BoolQ as one task; BoolQ itself is
      one task in one language competence.
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: The protocol supplies the passage that determines the answer and scores whether the
      system answered correctly from it; the paper's question-only models perform near the majority
      baseline.
    source: src-arxiv-1905-10044-v1
    quote: We also found that question-only models perform very poorly on this task
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: The answer is determined by the supplied passage, and the paper shows that the question
      alone carries little signal. Some reasoning types use world knowledge to connect the passage
      to the question, but the passage is always given.
    source: src-arxiv-1905-10044-v1
    quote: We also found that question-only models perform very poorly on this task
  - term: deductive-reasoning
    reason: The inferences the paper catalogues (by example, factual reasoning, implicit, missing
      mention) draw on world knowledge and on how the passage is written, so the answer does not
      follow from the passage alone as premises; and the score is plain accuracy, not a
      per-inference measure.
    source: src-arxiv-1905-10044-v1
    quote: many questions require making additional inferences
  - term: abductive-reasoning
    reason: The missing-mention and implicit categories are defeasible inferences, but they are an
      analysis of a sample, not a separately scored part of the benchmark.

evaluation_method:
  - exact-match
evaluation_method_basis:
  reason: Each example is a yes or no label, and the score is accuracy over examples, plain accuracy
    against a fixed label set, which the term covers. SuperGLUE keeps the original metric.
  source: src-arxiv-1905-00537-v3
  quote: Following the original work, we evaluate with accuracy.
evaluation_method_considered_and_rejected:
  - term: multiple-choice
    reason: The two labels are fixed for the task, not options supplied with each item, and the
      paper frames the task as text-pair classification. The chance floor is the majority class
      (62.31% yes on the test set), not 50% (see review_checks).
    source: src-arxiv-1905-10044-v1
    quote: Models on this dataset need to predict an output class given two pieces of input text
  - term: classification-metric
    reason: The reported number is plain accuracy, a mean of per-item verdicts, not F1, MCC or
      another statistic of the confusion matrix.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The dataset has a 9.4k training split, and the paper's baselines and best model are
    classifiers fine-tuned on it, after transfer from entailment data; it was built for systems
    trained for the task. Prompted general models are what is scored on it now (observed_subjects).
  source: src-arxiv-1905-10044-v1
  quote: Our best method trains BERT on MultiNLI and then re-trains it on our train set.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: Current use, not the design; recorded under observed_subjects and as_used.
observed_subjects:
  values:
    - instruction-tuned-model
  basis: The 2025 study scores eight instruction-tuned LLMs zero-shot on BoolQ's development set,
    and inspect_evals prompts a chat model for a bare Yes or No.
  source: src-arxiv-2509-01093-v1
as_used:
  - protocol: inspect_evals' boolq task prompts a model with the passage and question and scores
      accuracy, accepting only a bare Yes or No (case-insensitive, optionally wrapped in
      punctuation); any other wording scores 0.
    split: development set (google/boolq, validation; 3,270 examples)
    source: src-github-inspect-evals-boolq-readme
    quote: BoolQ is a question answering dataset for yes/no questions containing 3,270 samples.
    note: The scorer changed in version 3-A (2026-08-31), and results are not comparable with 2-A.
      Nothing is fine-tuned on the training split.
  - protocol: Eight instruction-tuned LLMs with open training data, zero-shot, prompted to return
      TRUE or FALSE, scored by inclusion match, on development-set passages and on later
      human-edited Wikipedia revisions of them; questions a model answers correctly without the
      passage are excluded.
    split: development set
    source: src-arxiv-2509-01093-v1
    quote: Use the provided article delimited by triple quotes to answer question. Return only TRUE
      or FALSE.
    note: A robustness study (EMNLP 2025 Findings), not a leaderboard; its accuracies are on its own
      filtered subsets.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on BoolQ's development set in 2025-2026, by the 2025
    context-drift study and through inspect_evals, whose task was maintained in September 2026.
    Saturation is for the derived value; no source read compares a current model with the human
    figures.
  source: src-arxiv-2509-01093-v1
  quote: average model accuracy on BOOLQ drops by over 30% from the highest to lowest similarity
    bins
activity: no-submission-channel
activity_note: BoolQ never had a route of its own. Its README promised a leaderboard ("Coming
  soon!") and the release of the test data with hidden labels, and the repository was archived after
  its second commit on 2019-05-28. Test predictions are scored only through SuperGLUE's server, a
  third party's board that takes BoolQ predictions as part of a full SuperGLUE submission; whether
  it still accepts them was not established, because its rows load from a database at run time (see
  review_checks).

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: BERT-large pre-trained on MultiNLI, then fine-tuned on BoolQ (the paper's best model)
    source: src-arxiv-1905-10044-v1
    observed_on: 2026-11-09
    quote: Model Majority Class Recurrent +MultiNLI Pre-trained BERTL +MultiNLI Dev Acc. 62.17 70.28
      76.15 78.09 82.20 Test Acc. 62.31 67.52 74.24 76.70 80.43
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: One annotator's yes or no per example; three of the authors labelled 110
  examples as a gold standard and found the annotations 90% accurate against it. The test labels are
  withheld; the training and development labels are public.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test labels were never released, and a test score comes only from SuperGLUE's server,
    which holds them. Development-set accuracy, which is what most current results report, can be
    computed by anyone.
  source: src-github-boolean-questions-readme
  quote: 3245 unlabeled test examples

task:
  exists: true
  input:
    - a yes/no question (a Google search query)
    - a passage from a Wikipedia article that answers it, with the article's title as optional
      context
  output: Yes or no.
  scoring: Accuracy against the annotator's label, averaged over examples; the paper reports the
    development and test sets, SuperGLUE the test set.
  source: src-arxiv-1905-10044-v1
  quote: The task is then to take a question and passage as input

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: Training and development sets with labels are public (the release's storage links and
    Hugging Face, ungated, which holds no test split); the 3,245 test questions and passages are
    distributed without labels, by the release and by SuperGLUE.
  access_basis:
    reason: The test inputs are released and only their labels are withheld, so an entrant runs the
      system and submits predictions for scoring.
    source: src-github-boolean-questions-readme
    quote: The test data with hidden labels will be released at a later date, along with a
      leaderboard submission system.
  refresh: static
  refresh_basis:
    reason: One release in May 2019, unchanged since in the sources read; SuperGLUE distributes the
      same split sizes (9,427, 3,270 and 3,245). The paper says the data changed before release
      after its analysis section was written, which is not a post-release revision.
    source: src-arxiv-1905-10044-v1
    quote: Note the dataset has been updated since we carried out this analysis, so it might be
      slighly out-of-date.
  data_provenance:
    - web-scraped
    - crowd-authored
  data_provenance_note: The questions are anonymised, aggregated Google search queries selected by
    heuristic, kept when a Wikipedia page was in the top five results; the passages are paragraphs
    of those pages. Annotators judged each question, chose the passage and labelled the answer. 3k
    of the 16k questions, all in the training split, are yes/no questions from the Natural Questions
    training set.
  data_provenance_source: src-arxiv-1905-10044-v1
  data_provenance_quote: Questions are gathered from anonymized, aggregated queries to the Google
    search engine.
  contamination_risk: medium
  contamination_risk_note: The test labels have never been released, but the development set, on
    which current results are reported (inspect_evals and the 2025 study among them), and its labels
    have been public since 2019 and sit on Hugging Face, and the passages are English Wikipedia
    text. The 2025 study shows that models with open training data answer worse as a passage drifts
    from the version of its article in their pretraining corpora, which evidences that the passages
    are in those corpora, not that the questions or labels are. No source read shows the questions
    or labels in training data (see review_checks).
  contamination_evidence:
    - source: src-arxiv-2509-01093-v1
      stance: supports
      quote: Our experiments reveal that LLM performance declines as reading passages naturally
        diverge from the versions encountered during pretraining
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: The paper's 90% is the accuracy of the singly-annotated labels against a
    110-example gold standard set by three of the authors; SuperGLUE's estimate, 89.0 on BoolQ's
    test set, is a majority vote of five crowdworkers on 100 test examples. The best system in each
    paper is about 10 points below.
  ceiling_anchor_type_basis:
    reason: The human figure both papers read scores against is measured performance of
      non-specialist annotators, scored like a system on the same labels.
    source: src-arxiv-1905-00537-v3
    quote: to reannotate a sample of each test set
  dataset_licence: CC-BY-SA-3.0
  dataset_licence_note: The README and Hugging Face's licence tag agree; the README calls it
    Creative Commons Share-Alike 3.0 and links the BY-SA 3.0 licence.
  dataset_licence_source: src-github-boolean-questions-readme
  dataset_licence_quote: Creative Commons Share-Alike 3.0
  size:
    - count: 15942
      unit: question-passage-answer examples, 9,427 training, 3,270 development and 3,245 test
      subset: the whole release
      source: src-github-boolean-questions-readme
      quote: BoolQ is a question answering dataset for yes/no questions containing 15942 examples.
    - count: 3245
      unit: test examples, labels withheld
      subset: test
      source: src-github-boolean-questions-readme
      quote: 3245 unlabeled test examples
    - count: 3270
      unit: development examples with labels
      subset: development (google/boolq, validation)
      source: src-hf-api-google-boolq
      quote: '"name":"validation","num_bytes":1998182,"num_examples":3270'
    - count: 9427
      unit: training examples with labels
      subset: train
      source: src-github-boolean-questions-readme
      quote: 9427 labeled training examples
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Google (Google AI Language, the BoolQ authors)
  maintainer_basis:
    reason: The data release is in the google-research-datasets organisation on GitHub and the
      Hugging Face dataset in Google's namespace; the paper's authors are at Google AI Language, the
      first author as an intern.
    source: src-hf-api-google-boolq
    quote: '"id":"google/boolq","author":"google"'
  maintainer_type: industry-lab
  maintainer_type_note: Google holds the dataset and the repository as distributed. The repository
    is archived, and the test labels are held by Google and by SuperGLUE's maintainers, another
    party, that runs the only test server; that decay is maintenance_status evidence, not a change
    of holder.
  submission_process:
    - literature-only
  submission_process_note: BoolQ has no leaderboard, results page or submission route of its own;
    results are reported in papers on the development set. SuperGLUE's server scores BoolQ test
    predictions as one of its tasks (prediction files uploaded with a full SuperGLUE submission, at
    most two a day and six a month, scored against the hidden labels by string match), which is a
    third party's held-out-server process and not BoolQ's (see review_checks).
  submission_process_source: src-github-boolean-questions-readme
  submission_process_quote: Coming soon!
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-1905-00537-v3
      quote: we have access to (or could create) a test set with private labels
  independence_flags_note: SuperGLUE holds BoolQ's test labels and scores every test submission; the
    BoolQ maintainers keep no ranking, so there is none for them to compete on. The paper's
    baselines include Google's BERT, which is a baseline, not a board entry.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: A test-set score can only be produced by SuperGLUE's server, which holds the labels.
      Development-set accuracy, which harnesses and most current papers report, can be reproduced by
      anyone from the public labels.
    source: src-arxiv-1905-00537-v3
    quote: Each task comes with a standardized training set, development set, and unlabeled test
      set.
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness_availability_note: The BoolQ repository holds only its README, so the maintainers publish
    no code. SuperGLUE ships jiant, its toolkit for baselines and for producing submission files;
    the official test score is computed by SuperGLUE's server. inspect_evals runs the development
    set.
  harness: jiant (SuperGLUE's toolkit), for baselines and submission files
  harness_source: src-arxiv-1905-00537-v3
  harness_quote: SuperGLUE is distributed with a new, modular toolkit for work on pretraining,
    multi-task learning, and transfer learning
  code_licence_note: Not recorded. The BoolQ repository has no code and GitHub reports no licence
    for it (API, read 2026-11-09); jiant's licence was not read.
  runnable_via:
    - custom
    - inspect
  inspect_evals_id: boolq
  inspect_evals_id_note: inspect_evals scores prompted generation on the development set with its
    own bare Yes/No scorer (as_used); it does not reproduce test-set scores.
  inspect_evals_id_source: src-github-inspect-evals-boolq-readme
  inspect_evals_id_quote: inspect eval inspect_evals/boolq
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the split (the hidden test set through SuperGLUE, or the public development set,
  # which most papers and inspect_evals report), whether the system was fine-tuned on BoolQ's training set (the
  # design) or prompted zero- or few-shot, and the prompt and answer parsing for prompted models.
  material_extra:
    - subset_used
    - training_data_policy
    - prompt_template_hash

homepage: https://github.com/google-research-datasets/boolean-questions
repository: https://github.com/google-research-datasets/boolean-questions
dataset_url: https://huggingface.co/datasets/google/boolq

lineage:
  role: root
  role_note: SuperGLUE (2019, another maintainer) includes BoolQ as one of its eight tasks, from its
    v2.0 launch in July 2019, and distributes the same splits; BoolQ's test labels are scored only
    through SuperGLUE's server. SuperGLUE is an Epoch stub (superglue), not a curated entry, so
    nothing is linked. The relation is not subset_of, which would count BoolQ as a child of
    SuperGLUE, since BoolQ was published and released first, by another maintainer, and is scored on
    its own. No variant or fork was read.
lineage_note: SuperGLUE's FAQ records that BoolQ and ReCoRD were added as main tasks between its
  v1.9 trial and its v2.0 launch (src-superglue-site-bundle), and its paper describes BoolQ as a
  task taken from the original work, evaluated with accuracy (src-arxiv-1905-00537-v3). Derivatives
  by other maintainers, such as translated versions, were not surveyed (see review_checks).

tags:
  - reading-comprehension
  - yes-no-questions
  - question-answering
  - natural-questions
  - wikipedia
  - superglue-task

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1905-10044-v1
    - src-arxiv-1905-10044
    - src-acl-n19-1300
    - src-github-boolean-questions-readme
    - src-hf-api-google-boolq
    - src-arxiv-1905-00537-v3
    - src-superglue-site-bundle
    - src-github-inspect-evals-boolq-readme
    - src-arxiv-2509-01093-v1
    - src-epoch-benchmark-data
  sources_note: >
    The BoolQ paper's v1 PDF (a DOI, not archived) read as text, its abstract page for the date and venue,
    and the ACL Anthology page for the DOI and the CC BY 4.0 licence; the data release's README at its
    last commit (the repository is archived); Hugging Face's API record of google/boolq; the SuperGLUE
    paper's v3 PDF (a DOI) and the script bundle of the script-rendered SuperGLUE site, read for its FAQ
    and submission rules; inspect_evals' BoolQ README at commit 62bb6260; the v1 PDF of a 2025 context-drift
    study (a DOI) as evidence of current use and of passage exposure in pretraining; and Epoch's export
    for the BoolQ string. Not read: SuperGLUE's leaderboard rows (loaded from a Firebase database at run
    time), the HELM classic BoolQ page that Epoch links (src-crfm-stanford-edu-helm-classic-latest-groups-boolq,
    scaffolded with no extract, not cited), jiant, and the dataset rows themselves.
  confidence: medium
  review_checks:
    - check: Lineage. SuperGLUE includes BoolQ as one of its eight tasks and is the only route to a
        test score, but it is an Epoch stub, so the relation is a note under lineage.role_note. Once
        SuperGLUE is curated, decide whether the relation becomes an edge on SuperGLUE's side (its
        data_provenance inherited-from-constituents and a link to boolq) and whether BoolQ should
        name it; subset_of was rejected because it would count BoolQ as SuperGLUE's child, against
        the allocation's rationale.
      field: lineage
      source: src-superglue-site-bundle
      quote: BoolQ and ReCoRD were added as main tasks.
    - check: submission_process is literature-only and activity no-submission-channel, because BoolQ
        never had a route of its own and the README's promised leaderboard never appeared. The
        alternative reads SuperGLUE's server as BoolQ's route, held-out-server with activity
        unknown, since SuperGLUE's board loads its rows from a Firebase database at run time and
        whether it still takes submissions was not read.
      field: governance.submission_process
      source: src-superglue-site-bundle
      quote: You may upload at most two submissions a day, and at most six submissions per month.
    - check: ceiling_anchor_type is crowd-average. The paper's 90% is the accuracy of the
        singly-annotated labels against the authors' 110-example gold standard, which could be read
        as noise-ceiling, since the test labels themselves are about 90% right; SuperGLUE's 89.0 is
        a crowd majority vote on 100 test examples scored like a system.
      field: data.ceiling_anchor_type
      source: src-arxiv-1905-10044-v1
      quote: On the 110 selected examples, the answer annotations reached 90% accuracy compared to
        the gold-standard labels.
    - check: contamination_risk is medium. The 2025 study shows that the passages are in some
        models' pretraining corpora and that accuracy depends on how close a passage is to that
        version, but not that the questions or labels are; whether passage exposure is an evidenced
        route into scored content (high) is open. The development set, on which current results are
        reported, has been public with labels since 2019.
      field: data.contamination_risk
      source: src-arxiv-2509-01093-v1
      quote: the accuracy of OLMo-2-1124-7B-Instruct declines sharply from 71.1% in the highest
        similarity bin 0.9-1.0 to 12.5% in the lowest 0.1-0.2
    - check: Epoch's export gives BoolQ a random baseline of 0.5, out of its capabilities index and
        with no data file. The classes are imbalanced, and the paper's floor is the majority class,
        62.31% on the test set and 62.17% on the development set, which is what headroom should be
        read against.
      field: external_ids.epoch
      source: src-epoch-benchmark-data
      quote: BoolQ,False,,,1.0,0.5,1.0,2019-05-24,
    - check: lifecycle is hand-set active from 2025-2026 development-set use. No source read
        compares current models with the 90% and 89.0 human figures, so saturation was not assessed;
        mature may fit if the record is read as settled.
      field: lifecycle
      source: src-github-inspect-evals-boolq-readme
      quote: Results are not comparable with
    - check: data_provenance. The questions are Google search queries, which are neither public web
        text nor written by annotators; web-scraped covers the Wikipedia passages and the found
        queries, crowd-authored the annotators' passage choice and labels. 3k training questions
        come from Natural Questions; inherited-from-constituents was not tagged because none is in a
        scored split.
      field: data.data_provenance
      source: src-arxiv-1905-10044-v1
      quote: with yes/no answers from the NQ training set to reach a total of 16k questions.
    - check: Whether SuperGLUE's copy is item-for-item the BoolQ release was not compared. The split
        sizes match (3,245 test predictions), but SuperGLUE requires its own distributed versions
        because some use different splits from other public versions.
      field: data.size
      source: src-arxiv-1905-00537-v3
      quote: Systems may only use the SuperGLUE-distributed versions of the task datasets
    - check: Derivatives by other maintainers were not surveyed, so no fork is recorded. arXiv's
        search lists translated BoolQ sets (for example a post-edited Kyrgyz BoolQ in
        KyrgyzLLM-Bench, arXiv 2607.17173), which were not read.
      field: lineage
    - check: evaluation_method is exact-match (plain accuracy over a fixed yes/no label set).
        multiple-choice was rejected because no options are supplied per item; a prompted model is
        in effect choosing between two answers, which some harnesses score as two-option multiple
        choice.
      field: evaluation_method
    - check: maintainer_type industry-lab. Google holds the archived repository and the Hugging Face
        dataset, but the only live scoring route is SuperGLUE's, and

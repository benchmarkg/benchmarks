# data/benchmarks/language/masakhaner.yaml
#
# P1-S10-T04, language entry 11. Filled from the MasakhaNER 1.0 paper, arXiv 2103.11811 read as its v2 PDF (the
# pre-MIT Press version of the TACL 2021 article), and its abstract page; the MasakhaNER 2.0 paper, arXiv 2210.12391
# read as its v2 PDF (EMNLP 2022), and its abstract page; the repository README and the MasakhaNER2.0 folder's
# README, pinned at commit ba5843c; Hugging Face's API records of the masakhane/masakhaner and
# masakhane/masakhaner2 datasets; and the ACL Anthology PDF of AfroBench (Findings of ACL 2025), a paper that
# scores LLMs on MasakhaNER-X. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# The family entry: MasakhaNER 1.0 (ten languages, 2021) and MasakhaNER 2.0 (twenty languages, 2022) are two
# editions of one Masakhane benchmark, the same task, tag set and annotation tool on newly collected and annotated
# text, held in one repository. MasakhaNER-X, the repository's aggregation of both for XTREME-UP, is a variant.

id: masakhaner
name: MasakhaNER
aliases:
  - MasakhaNER 1.0
  - MasakhaNER 2.0
  - MasakhaNER-X
tagline: Named-entity recognition on human-annotated local news in 21 African languages, scored by
  entity-level F1.
description: >
  A named-entity recognition benchmark for African languages built by the Masakhane community. Sentences
  of local news text are annotated by native speakers with four entity types, personal names (PER), locations
  (LOC), organizations (ORG) and dates and times (DATE), in CoNLL format with train, development and test
  splits per language. MasakhaNER 1.0 (TACL 2021) covers ten languages from West and East Africa, with
  volunteer annotators; MasakhaNER 2.0 (EMNLP 2022) covers twenty, adding Southern and Central African
  languages, newly annotated with paid annotators and language coordinators and drawn partly from the
  MAFAND-MT translation corpus. It keeps nine of 1.0's languages, on new text with its own test sets,
  and drops Amharic. Systems tag each test sentence and are scored per language by micro-averaged entity-level
  F1. The papers' baselines are multilingual encoders fine-tuned per language, and the 2.0 paper studies
  zero-shot transfer from other source languages. Prompted LLMs are now scored on MasakhaNER-X, the repository's
  aggregation of both editions for XTREME-UP, which recasts the task as generating the entities as text;
  in AfroBench (2025) they trail a fine-tuned AfroXLMR baseline by about 34 to 44 F1 points.
self_description:
  source: src-arxiv-2103-11811
  quote: creating the first large publicly available high-quality dataset for named entity
    recognition (NER) in ten African languages
external_ids:
  huggingface: masakhane/masakhaner2
  arxiv: '2103.11811'
external_ids_note: Each edition has its own Hugging Face dataset, masakhane/masakhaner (1.0) and
  masakhane/masakhaner2 (2.0); 2.0's is recorded as the current one. The 2.0 paper is arXiv
  2210.12391.
paper:
  title: 'MasakhaNER: Named Entity Recognition for African Languages'
  arxiv: '2103.11811'
  doi: 10.1162/tacl_a_00416
  version_read: v2
  source: src-arxiv-2103-11811-v2
paper_note: The family's first paper, for MasakhaNER 1.0; the DOI is the TACL article's, from the
  README's citation. MasakhaNER 2.0's paper is src-arxiv-2210-12391-v2 (EMNLP 2022, DOI
  10.18653/v1/2022.emnlp-main.298 per the README's link, not read on the Anthology).
released: 2021-03-22
released_note: MasakhaNER 1.0's arXiv submission (v1), as its abstract page dates it; the family's
  first public release.
released_source: src-arxiv-2103-11811
released_quote: Submitted on 22 Mar 2021
release_venue: Transactions of the Association for Computational Linguistics (TACL) 2021
release_venue_source: src-arxiv-2103-11811
release_venue_quote: Accepted to TACL 2021, pre-MIT Press publication version

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/information-extraction
  secondary:
    - language/low-resource-languages
    - language/multilingual
domain_basis:
  reason: The scored act is finding the named entities in a sentence and labelling each span with
    its type, extracting structured records (entities) from unstructured text, the
    information-extraction leaf's definition; the 2.0 paper chose NER for that use. Both papers
    build the data because African languages lack annotated datasets, which is the low-resource
    leaf, and the same task is scored and compared per language across ten and twenty languages,
    which is the multilingual leaf.
  source: src-arxiv-2210-12391-v2
  quote: because of its utility in downstream applications such as question answering and
    information extraction
domain_considered_and_rejected:
  - term: language/understanding
    reason: No question is asked of the passage; the output is a labelling of the sentence's own
      spans, which the information-extraction leaf names.
  - term: language/translation
    reason: Nothing is translated. 2.0 annotates some MAFAND-MT translations as source text, but the
      task is tagging them in their own language.
    source: src-arxiv-2210-12391-v2
    quote: which consists of French and English news articles translated into 11 languages
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: The sentence supplied is the material that determines the answer, the entity spans and
      their types, and the score checks whether the system marked them correctly; both papers report
      separately on test entities never seen in training, which a system can only find from the
      sentence itself.
    source: src-arxiv-2210-12391-v2
    quote: zero-frequency entities that do not appear in the training corpus
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: Gazetteers and prior exposure help, but the entities are in the supplied sentence, so
      the protocol supplies the source.
  - term: transfer-learning
    reason: The 2.0 paper's experiments are cross-lingual transfer from other source languages, but
      that is a protocol the paper studies; the benchmark scores in-language tagging on each test
      split, whatever the system was trained on (see review_checks).
    source: src-arxiv-2210-12391-v2
    quote: choosing the best transfer language improves zero-shot F1 scores by an average of 14
      points across 20 languages compared to using English
  - term: factual-precision
    reason: No free-form assertion is checked; the output is a set of typed spans compared with the
      annotation.
  - term: perception
    reason: The input is text, not a raw signal.

evaluation_method:
  - classification-metric
evaluation_method_note: Entity-level F1 over the whole test split of a language, micro-averaged over
  the four types, as seqeval computes it from BIO tags (the README names seqeval). A span counts
  only if its boundaries and type both match. AfroBench scores MasakhaNER-X's generated entity
  strings with its own F1, which is not the same computation.
evaluation_method_basis:
  reason: F1 is a statistic of the whole set of predicted against annotated entities, the term's
    named case.
  source: src-arxiv-2210-12391-v2
  quote: For evaluation, we make use of the microaveraged F1 score.
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Spans must match exactly, but the score is F1 over all predicted and gold entities in a
      split, not a mean of per-item verdicts.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Both papers' baselines are pretrained encoders (mBERT, XLM-R, AfroXLM-R and others)
    fine-tuned on each language's training split and scored as trained artifacts.
  source: src-arxiv-2210-12391-v2
  quote: evaluate performance on the test set using HuggingFace Transformers
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: Prompted LLMs are scored on it now (observed_subjects), but it was built as training and
      test data for fine-tuned taggers, before prompted evaluation.
observed_subjects:
  values:
    - instruction-tuned-model
    - task-specific-supervised-model
  basis: >
    AfroBench (Findings of ACL 2025) prompts ten open models and GPT-4o and Gemini 1.5 Pro on MasakhaNER-X,
    beside a fine-tuned AfroXLMR baseline.
  source: src-acl-2025-findings-acl-976-pdf
as_used:
  - protocol: Instruction-tuned LLMs prompted with five prompt templates, the best reported,
      zero-shot and five-shot for the strongest models, on MasakhaNER-X's test sets for 20
      languages; the model writes the entities as labelled text with a "$" delimiter between them,
      and the output is scored by F1.
    split: test
    source: src-acl-2025-findings-acl-976-pdf
    quote: We evaluate entity recognition for 20 African languages on the MASAKHANER-X
    note: AfroBench's NER task, 18,192 test items. In its Table 4 the fine-tuned AfroXLMR scores
      84.6 F1, the best open LLM (Gemma 2 27B) 50.8, Gemini 1.5 Pro 41.8 and GPT-4o 40.7 zero-shot
      (45.0 five-shot). Not comparable with seqeval scores on the CoNLL files.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced against it; AfroBench, at ACL 2025 (Findings), reports
    per-language MasakhaNER-X results for twelve LLMs and a fine-tuned baseline. The repository was
    last pushed on 2025-10-15 (GitHub API, read 2026-11-09), which is maintenance evidence, not
    lifecycle.
  source: src-acl-2025-findings-acl-976-pdf
  quote: Fine-tuned baselines en/fr-xx xx-en/fr AfroXLMR 89.4 84.6
activity: no-submission-channel
activity_note: The maintainers keep no leaderboard or scoring server; the repository holds the data,
  training code and models, and results appear in papers (AfroBench's leaderboard is AfroBench's
  own).

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: AfroXLMR-large fine-tuned on each MasakhaNER 2.0 language
    source: src-arxiv-2210-12391-v2
    observed_on: 2026-11-09
    quote: AfroXLMR-large 82.2 74.8 90.3
  - system: GPT-4o (Aug), prompted zero-shot, on MasakhaNER-X
    source: src-acl-2025-findings-acl-976-pdf
    observed_on: 2026-11-09
    quote: GPT-4o (Aug) 62.8 40.7
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Native speakers' annotations, adjudicated in ELISA; test labels are public
  in both editions (CoNLL files on GitHub and the Hugging Face datasets).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every split with its labels is downloadable without a gate, and F1 is a fixed formula with
    a public implementation (seqeval).
  source: src-hf-api-masakhaner2
  quote: '"gated":false'
task:
  exists: true
  input:
    - a tokenised sentence of news text in one of the covered African languages
  output: A type for every token in BIO form, marking each person name, location, organization and
    date or time span.
  scoring: Entity-level F1, micro-averaged over the four types, on the language's test split;
    results are reported per language and averaged.
  source: src-arxiv-2210-12391-v2
  quote: 'with four entity types: Personal name (PER), Location (LOC), Organization (ORG), and date and
    time (DATE), similar to MasakhaNER 1.0'

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Both editions are in CoNLL format in the repository's data folders and in ungated
    Hugging Face datasets.
  access_basis:
    reason: All splits, test labels included, download from the ungated Hugging Face datasets and
      from GitHub.
    source: src-hf-api-masakhaner2
    quote: '"gated":false'
  refresh: versioned-releases
  refresh_basis:
    reason: The content changed once, in a second edition named MasakhaNER 2.0, kept beside 1.0 in
      the repository and on Hugging Face, so a claim can name its edition.
    source: src-github-masakhane-ner-readme
    quote: An expansion of MasakhaNER 1.0 to 20 African languages, the dataset includes all
      MasakhaNER 1.0, except for Amharic
  data_provenance:
    - web-scraped
    - expert-authored
  data_provenance_note: The text is local news, from online news sites and radio stations' web pages
    (in 2.0 chiShona and Kiswahili crawled from Voice of America), and for eleven 2.0 languages the
    MAFAND-MT corpus of news translated from English and French. The labels were written by native
    speakers trained on the MUC-6 guide, 1.0's volunteers who are its authors, 2.0's three paid
    annotators and a coordinator per language; Hugging Face tags the annotations expert-generated.
    Native speakers trained for the task are recorded as expert-authored (see review_checks).
  data_provenance_source: src-arxiv-2210-12391-v2
  data_provenance_quote: which were crawled from Voice of America (VOA) websites
  contamination_risk: medium
  contamination_risk_note: The test sentences and their labels have been public on GitHub since 2021
    (1.0) and 2022 (2.0) and on Hugging Face, and the text is from public news sites, so a route
    into pretraining or instruction data is plausible. No source read evidences one; AfroBench
    states it cannot tell whether its evaluation sets overlap the models' training data.
  contamination_risk_source: src-acl-2025-findings-acl-976-pdf
  contamination_risk_quote: Without knowledge of the data mixture
  contamination_evidence: []
  dataset_licence: CC-BY-NC-4.0
  dataset_licence_note: The README's statement, written "CC-BY-4.0-NC" and linked to the CC BY-NC
    4.0 deed, for the NER dataset of both editions. Hugging Face's records disagree, afl-3.0 for
    masakhaner2 and unknown for masakhaner (see review_checks).
  dataset_licence_source: src-github-masakhane-ner-readme
  dataset_licence_quote: The license of the NER dataset is in
    [CC-BY-4.0-NC](https://creativecommons.org/licenses/by-nc/4.0/)
  upstream_licences: The underlying news text keeps the licences of the sites it came from, which
    the README does not list.
  upstream_licences_source: src-github-masakhane-ner-readme
  upstream_licences_quote: the monolingual data have difference licenses depending on the news
    website license
  size:
    - count: 20
      unit: languages
      subset: v2.0
      source: src-arxiv-2210-12391-v2
      quote: We create the largest human-annotated NER dataset for 20 African languages
    - count: 10
      unit: languages
      subset: v1.0
      source: src-arxiv-2103-11811
      quote: high-quality dataset for named entity recognition (NER) in ten African languages
    - count: 4
      unit: entity types (PER, LOC, ORG, DATE)
      source: src-arxiv-2210-12391-v2
      quote: 'with four entity types: Personal name (PER), Location (LOC), Organization (ORG), and date
        and time (DATE), similar to MasakhaNER 1.0'
    - count: 18192
      unit: test items over 20 languages
      subset: MasakhaNER-X, as AfroBench uses it
      source: src-acl-2025-findings-acl-976-pdf
      quote: Total Size 12,190 18,192
  size_note: 1.0 splits each language 70/10/20 into training, development and test sentences, from
    185 test sentences (Luo) to 638 (Igbo). 2.0's test splits run from 966 sentences (Ghomala) to
    2,235 (Kinyarwanda), with 4.8K-11K sentences collected per language. The 2.0 README's split
    table swaps the paper's Mossi and Naija test counts (see review_checks). AfroBench's
    MasakhaNER-X has 900-1,000 test items per language, Amharic 500 and Luo 185.
  languages:
    - Akan/Twi
    - Amharic
    - Bambara
    - Chichewa
    - chiShona
    - Ewe
    - Fon
    - Ghomala
    - Hausa
    - Igbo
    - isiXhosa
    - isiZulu
    - Kinyarwanda
    - Kiswahili
    - Luganda
    - Luo (Dholuo)
    - Mossi
    - Nigerian Pidgin (Naija)
    - Setswana
    - Wolof
    - Yoruba
  languages_note: The union of both editions; Amharic is in 1.0 only, and the eleven languages from
    Bambara to isiZulu that are not in 1.0 are in 2.0 only.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Masakhane, the African NLP research community (the masakhane-io GitHub and masakhane
    Hugging Face organisations)
  maintainer_basis:
    reason: The repository and both Hugging Face datasets sit in Masakhane's organisation accounts,
      and the README credits the annotation to Masakhane volunteers; the papers' authors list
      Masakhane NLP beside about thirty institutions.
    source: src-github-masakhane-ner-readme
    quote: This annotation for the dataset was performed by volunteers from the
  maintainer_type: community-collective
  maintainer_type_note: Shared organisation accounts run by contributors from many institutions,
    with no legal form stated and no single institution named as holder in the sources read, the
    inclusion test's case (as ObliQA's RegNLP organisation). The 2.0 paper thanks a Masakhane
    leadership for administrative support; if Masakhane holds the benchmark through a registered
    body, nonprofit would apply (see review_checks).
  submission_process:
    - literature-only
  submission_process_note: The maintainers publish baselines and a multilingual model and keep no
    ranking; others report results in their own papers.
  submission_process_source: src-github-masakhane-ner-readme
  submission_process_quote: This repository contains the code for
  independence_flags: []
  independence_flags_note: None recorded. 2.0 was funded by Lacuna Fund, which the paper says was
    co-founded by The Rockefeller Foundation, Google.org and Canada's IDRC; whether that bears on
    any system scored on the benchmark was not assessed from the sources (see review_checks). The
    maintainers' own entries are release baselines with no board to compete on.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The test splits and their labels are public and F1 is a fixed formula, so any system can
      be scored end to end.
    source: src-hf-api-masakhaner2
    quote: '"gated":false'
  harness_availability: reference-implementation-only
  harness_availability_note: The repository's code trains and evaluates the papers' fine-tuned
    baselines with Hugging Face Transformers and seqeval; it is the papers' code, not a designated
    scorer for outside results. AfroBench's MasakhaNER-X task runs in EleutherAI's
    lm-evaluation-harness with its own prompts.
  harness_availability_source: src-github-masakhane-ner-readme
  harness_availability_quote: testing framework for sequence labeling
  code_licence_note: Not recorded. The README says the code is based on Hugging Face's
    implementation and gives that implementation's licence (Apache 2.0), not a grant for the
    repository; GitHub's licence metadata reports Other (NOASSERTION) (API, read 2026-11-09).
  code_licence_source: src-github-masakhane-ner-readme
  code_licence_quote: 'The code is based on HuggingFace implementation (License: Apache 2.0).'
  runnable_via:
    - custom
    - lm_eval
  runnable_via_note: lm_eval through AfroBench's MasakhaNER-X task, a third party's prompted
    protocol.
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the edition and language (1.0, 2.0 or MasakhaNER-X; one language or an average),
  # whether the system was fine-tuned on the training split, transferred zero-shot from other languages, or
  # prompted, and with how many shots and which prompt, and the scorer (seqeval span F1 on the CoNLL files, or a
  # suite's F1 over generated entity strings).
  material_extra:
    - subset_used
    - training_data_policy
    - shots
    - prompt_template_hash
    - harness

homepage: https://github.com/masakhane-io/masakhane-ner
repository: https://github.com/masakhane-io/masakhane-ner
dataset_url: https://huggingface.co/datasets/masakhane/masakhaner2

versions:
  - version: v1.0
    label: MasakhaNER 1.0
    version_kind: edition
    released: 2021-03-22
    changes: The first edition, ten languages (Amharic, Hausa, Igbo, Kinyarwanda, Luganda, Luo,
      Nigerian Pidgin, Swahili, Wolof, Yoruba) annotated by volunteers, split 70/10/20 per language.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2103-11811-v2
      - src-arxiv-2103-11811
      - src-hf-api-masakhaner
  - version: v2.0
    label: MasakhaNER 2.0
    version_kind: edition
    released: 2022-10-22
    changes: Twenty languages, eleven of them new (five from Southern Africa); nine of 1.0's
      languages on newly collected and annotated text with their own test sets, Amharic dropped.
      Paid annotators and language coordinators, quality-control flags, and MAFAND-MT translations
      as source text for eleven languages.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2210-12391-v2
      - src-arxiv-2210-12391
      - src-github-masakhaner2-readme
      - src-hf-api-masakhaner2
versions_note: Neither edition is marked superseded. 1.0's test sets are still used, Amharic exists
  only there, and the README tells users to cite each edition's own paper; the README calls 2.0 an
  expansion of 1.0. 2.0's date is its first arXiv submission; its abstract page says it was accepted
  to EMNLP 2022.
versions_basis:
  reason: By 04 S4 the two are editions of one family, not two benchmarks. The same maintainer, the
    Masakhane community, holds both in one repository; the task, the four-type tag set, the MUC-6
    guide and the ELISA tool are the same; and 2.0 is new items, newly collected and annotated text
    with its own test sets, on which the 2.0 paper scores models separately from 1.0's. Released
    dates are each paper's first arXiv submission.
  source: src-arxiv-2210-12391-v2
  quote: Evaluation on MasakhaNER 1.0 test set
versions_source: src-arxiv-2210-12391
versions_quote: Submitted on 22 Oct 2022

lineage:
  role: root
  variants:
    - id: masakhaner-x
      relation: aggregation of MasakhaNER 1.0 and 2.0 as raw text with byte-level span annotations,
        built for Google Research's XTREME-UP benchmark and held in the repository's xtreme-up
        folder
      source: src-github-masakhane-ner-readme
      quote: MasakhaNER-X is an aggregation of MasakhaNER 1.0 and MasakhaNER 2.0 datasets for 20
        African languages.
lineage_note: MasakhaNER-X is what AfroBench and XTREME-UP score, recast as generating entity
  strings; it is recorded as a same-maintainer variant because it sits in the Masakhane repository.
  XTREME-UP itself, the monolingual corpora and the AfroXLM-R models are not part of this entry.

tags:
  - named-entity-recognition
  - information-extraction
  - african-languages
  - low-resource-languages
  - multilingual
  - news
  - cross-lingual-transfer

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2103-11811-v2
    - src-arxiv-2103-11811
    - src-arxiv-2210-12391-v2
    - src-arxiv-2210-12391
    - src-github-masakhane-ner-readme
    - src-github-masakhaner2-readme
    - src-hf-api-masakhaner
    - src-hf-api-masakhaner2
    - src-acl-2025-findings-acl-976-pdf
  sources_note: >
    The MasakhaNER 1.0 paper's v2 PDF and the 2.0 paper's v2 PDF (both DOIs, not archived) read as text;
    their abstract pages for the dates and venues, with the author lists and submitter lines outside the
    windows; the repository README and the MasakhaNER2.0 folder's README at commit ba5843c (2025-10-15);
    Hugging Face's public API records of both ungated datasets; and AfroBench's ACL Anthology PDF (a DOI,
    not archived) as evidence of current use. AfroBench's arXiv v5 PDF is already a Source (src-arxiv-2311-07978-v5,
    for xlsum) but its extract holds none of the MasakhaNER passages, so the published version was read
    instead. The TACL and EMNLP published versions were not read.
  confidence: medium
  review_checks:
    - check: One family with two editions, by 04 S4 (same maintainer and repository, same task and
        tag set, new items). The editions have separate papers, separate Hugging Face datasets and
        separate citation instructions, which the rule's "independently versioned and cited" could
        read as two benchmarks.
      field: versions
      source: src-github-masakhane-ner-readme
      quote: If you make use of the MasakhaNER 1.0 dataset, please cite the our TACL paper.
    - check: The README says 2.0 "includes all MasakhaNER 1.0, except for Amharic", while the 2.0
        paper describes new news sources and separate test sets for the shared languages. Read as
        "all 1.0 languages"; whether any 1.0 sentences were carried into 2.0 was not established.
      field: versions
      source: src-github-masakhane-ner-readme
      quote: An expansion of MasakhaNER 1.0 to 20 African languages, the dataset includes all
        MasakhaNER 1.0, except for Amharic
    - check: The 2.0 README's split table gives Mossi 1,613 and Naija 1,294 test sentences, the
        reverse of the paper's Table 1 (1,294 and 1,613); Bambara and Setswana training counts also
        differ by one and 200. Which matches the released files was not checked.
      field: data.size
      source: src-github-masakhaner2-readme
      quote: 4532 | 648 | 1613 |
    - check: Licence disagreement. The README says CC BY-NC 4.0 for the NER data; Hugging Face's
        masakhaner2 record says afl-3.0 and masakhaner's says unknown. CC-BY-NC-4.0 was recorded
        from the maintainers' README.
      field: data.dataset_licence
      source: src-hf-api-masakhaner2
      quote: '"license:afl-3.0"'
    - check: The 1.0 Hugging Face record (masakhane/masakhaner) states no licence; whether its files
        match the GitHub data folder was not checked.
      field: data.dataset_licence
      source: src-hf-api-masakhaner
      quote: '"license:unknown"'
    - check: maintainer_type community-collective rests on no legal form being stated for Masakhane
        in the sources read; nonprofit if a registered Masakhane body holds the repository and
        datasets. 1.0's annotators volunteered through the community.
      field: governance.maintainer_type
      source: src-arxiv-2103-11811-v2
      quote: volunteered through the Masakhane community
    - check: Lacuna Fund, 2.0's funder, is co-founded by Google.org among others, and AfroBench
        scores models whose developers were not checked against that; funded-by-evaluated-party was
        not set on outside knowledge.
      field: governance.independence_flags
      source: src-arxiv-2210-12391-v2
      quote: This work was carried out with support from Lacuna Fund, an initiative co-founded by
        The Rockefeller Foundation, Google.org, and
    - check: MasakhaNER-X as a same-maintainer variant. It sits in the Masakhane repository but was
        built for XTREME-UP and is cited in AfroBench to the XTREME-UP paper; a fork (another
        maintainer) is arguable. AfroBench's per-language sizes (Amharic 500, Luo 185) are 1.0's
        test splits, though the README says MasakhaNER-X covers 20 languages.
      field: lineage
      source: src-acl-2025-findings-acl-976-pdf
      quote: 'excl. amh: 500 & luo: 185 (in MasakhaNER-X)'
    - check: Capability context-integration, with transfer-learning rejected. The 2.0 paper is about
        cross-lingual transfer and its headline result is zero-shot; transfer-learning is arguable
        as a second capability. NER has no capability term of its own (span labelling as a language
        competence).
      field: capability
    - check: data_provenance expert-authored for native-speaker annotators trained on the MUC-6
        guide; 1.0's annotators were unpaid volunteers who are its authors. crowd-authored is
        arguable.
      field: data.data_provenance
      source: src-arxiv-2210-12391-v2
      quote: The annotation was carried out by three native speakers per language recruited from
        AI/NLP communities in Africa.
    - check: harness_availability reference-implementation-only, not official-harness. The
        repository's code produced the papers' scores, but the maintainers do not designate it as
        the scorer for others' results.
      field: execution.harness_availability

# data/benchmarks/language/writingbench.yaml
#
# P1-S10-T04, language entry 10. Filled from the WritingBench paper, arXiv 2503.05244 read as its v4 PDF
# (2025-11-27, NeurIPS 2025), and its abstract page; the repository README at main; Hugging Face's API record of
# the leaderboard space, the space's app.py and its score.xlsx (read as text); the WritingBench task's README in
# UK AISI's inspect_evals at main; and the v4 PDF of MUSE (arXiv 2609.15188, October 2026), a paper that scores
# story generation on a WritingBench subset. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# Chosen for the empty language/creative-writing leaf over LitBench and EQ-Bench's Creative Writing v3 (see the
# first review check). WritingBench is a general writing benchmark, so language/generation is primary; its
# Literature & Arts domain, 183 of the 1,000 queries, is the creative-writing subset and carries that leaf as a
# subset override.

id: writingbench
name: WritingBench
tagline: 1,000 Chinese and English writing tasks in six domains, each graded on five query-specific
  criteria by an LLM judge.
description: >
  A benchmark of 1,000 writing queries (555 English, 445 Chinese) in six domains and 100 subdomains: Academic
  & Engineering, Finance & Business, Politics & Law, Literature & Arts, Education, and Advertising & Marketing.
  The Literature & Arts domain (183 queries) holds the creative tasks, such as novel manuscripts and outlines,
  poetry, screenplays, fan fiction and lyrics. Queries were drafted by GPT-4o and Claude-3.5-Sonnet, diversified
  with style, format and length requirements, and then revised by experts, with reference material collected
  by trained annotators from public documents; inputs run from tens to thousands of words. Each query
  carries five criteria that Claude-3.7 wrote for it, each with a 1-10 rubric. A judge scores the response
  against each criterion separately and the score is the mean over criteria and queries; the leaderboard
  multiplies it by ten. The paper's own table uses a critic model fine-tuned from Qwen-2.5-7B-Instruct
  on 155K Claude-3.7 judgments; the leaderboard has used Claude models as judge, Claude-3-7-Sonnet from
  April 2025, Claude-Sonnet-4 from September 2025 and Claude-Sonnet-4-5 since 2025-11-27. The first release
  (March 2025) had 1,239 queries. Separate scores are kept for the style, format and length requirements,
  the six domains, the 100 subdomains and the two languages.
self_description:
  source: src-arxiv-2503-05244-v4
  quote: we present WritingBench, a comprehensive benchmark designed to evaluate LLMs across 6 core
    writing domains and 100 subdomains
external_ids:
  arxiv: '2503.05244'
paper:
  title: 'WritingBench: A Comprehensive Benchmark for Generative Writing'
  arxiv: '2503.05244'
  doi: 10.48550/arXiv.2503.05244
  version_read: v4
  source: src-arxiv-2503-05244-v4
released: 2025-03-07
released_note: The paper's first arXiv version, as its abstract page dates it. The README dates the
  first release of the queries 2025-03-10, the day the repository was created (GitHub API, not a
  quoted Source).
released_source: src-arxiv-2503-05244
released_quote: Submitted on 7 Mar 2025 (v1), last revised 27 Nov 2025 (this version, v4)
release_venue: NeurIPS 2025
release_venue_source: src-arxiv-2503-05244-v4
release_venue_quote: 39th Conference on Neural Information Processing Systems (NeurIPS 2025)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: language/generation
  secondary:
    - language/creative-writing
domain_basis:
  reason: Every item asks for free-form text that is scored against rubric criteria written for that
    query, which is the generation leaf's definition. The claim is writing across six domains, most
    of them functional (papers, reports, contracts, lesson plans, advertising copy); the Literature
    & Arts domain, novels, poetry, scripts and critiques, is the creative-writing leaf's case, and
    its subset carries that leaf as primary.
  source: src-arxiv-2503-05244-v4
  quote: 'Literature & Art: This domain covers the creative and expressive realms of writing, including
    novels, poetry, scripts, artistic designs, and critiques of books and movies.'
domain_considered_and_rejected:
  - term: language/long-context
    reason: Inputs reach 19,361 tokens, but the difficulty is not designed to come from length;
      length is one of several properties the queries vary, and the score is writing quality.
    source: src-arxiv-2503-05244-v4
    quote: WritingBench supports extended-context generation with input ranging from tens to
      thousands of words
  - term: language/multilingual
    reason: Queries are in Chinese or English and scores are reported per language, but two
      languages are a split of one task set, not a comparison across many languages.
  - term: society-econ-law/legal-document
    reason: Politics & Law is one of six domains (201 queries, legal opinions, contracts, litigation
      documents and government writing); the benchmark claims writing in general, and legal drafting
      is material, not the subject.
  - term: language/summarization
    reason: A few subdomains condense supplied material (meeting summaries, executive summaries),
      but they are a small share and the scored act is writing to the query's criteria, not
      preserving a source's content.
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: Most queries supply reference material (financial statements, legal templates,
      manuscripts to continue), and the per-query criteria were introduced so that the judge checks
      whether a response uses it, such as incorporating data points or keeping narrative continuity.
    source: src-arxiv-2503-05244-v4
    quote: 'Material dependency: they are insufficient to verify whether responses appropriately utilize
      the provided reference materials'
capability_considered_and_rejected:
  - term: instruction-following
    reason: Queries carry style, format and length requirements, scored in their own subsets, but
      the source calls them writing requirements and grades them by degree on 1-10 rubrics inside
      the quality score; it does not claim instruction following, which the term's inclusion test
      requires.
    source: src-arxiv-2503-05244-v4
    quote: For each requirement, we create two evaluation subsets.
  - term: constraint-satisfaction
    reason: No single violated requirement fails an item; every criterion is graded by degree.
  - term: creativity-novelty
    reason: Literature & Arts rewards craft, but nothing in the scoring rewards departure from known
      work or penalises reproduction.
  - term: generation-fidelity
    reason: There is no reference text; criteria describe what the query asks for, not a target to
      match.
  - term: knowledge-recall
    reason: The paper finds knowledge-intensive subdomains hardest, but the score is a rubric grade
      of the writing, not recall checked against a key.
  - term: communication
    reason: The judge grades the text itself; no recipient acts on it.

evaluation_method:
  - rubric-graded
  - model-graded-judge
evaluation_method_note: >
  The grader, by stage. Criteria: five per query, generated by Claude-3.7 (the paper does not give a snapshot
  id) and reviewed by human annotators. Paper scores: a critic model fine-tuned from Qwen-2.5-7B-Instruct
  on 155K responses scored by Claude-3.7, released on Hugging Face. Leaderboard: Claude-3-7-Sonnet from
  2025-04-29, Claude-Sonnet-4 from 2025-09-05 and Claude-Sonnet-4-5 from 2025-11-27 (README news; no snapshot
  ids), scoring at temperature 1.0, top_p 0.95, 2,048 tokens. inspect_evals defaults to anthropic/claude-3-5-haiku-latest.
  The paper validates the method against five trained annotators' pairwise preferences on 300 queries
  built the same way but kept out of the benchmark: 87% agreement for Claude-3.7 with query-dependent
  criteria, 84% for the critic model, against 58-79% for static criteria.
evaluation_method_basis:
  reason: A rubric of five named criteria is applied per query, each criterion scored on its own by
    a judge model with a justification, and the scores are averaged.
  source: src-arxiv-2503-05244-v4
  quote: Each query is assessed by 5 instance-specific criteria using a 10-point scale scoring by
    our critic model.
evaluation_method_considered_and_rejected:
  - term: model-derived-metric
    reason: The critic is a released fine-tuned checkpoint, but it issues a 1-10 grade and a
      justification against a criterion written for each query, not a fixed label set, and the
      leaderboard's judge is a general model prompted to grade.
    source: src-arxiv-2503-05244-v4
    quote: The critic model is fine-tuned on a dataset of 155K instances scored by Claude-3.7
  - term: human-expert-eval
    reason: Five annotators judged pairs of responses, but on 300 queries outside the benchmark and
      to validate the judge; no published score comes from people.
    source: src-arxiv-2503-05244-v4
    quote: Five professionally trained annotators with linguistic backgrounds perform pairwise
      comparisons of model responses.
  - term: pairwise-preference-elo
    reason: Pairwise preferences appear only in the validation study; systems are scored on their
      own.
  - term: reference-metric
    reason: No reference text is compared with the output.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The queries are written as requests to an assistant, answered in one response with no
    tools or loop; the leaderboard's rows are chat and reasoning models.
  source: src-arxiv-2503-05244-v4
  quote: initial writing query drafts that simulate realistic user requests
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: Reasoning models are scored, with and without thinking, and their reasoning is stripped
      before grading; they are admitted, not the designed-for case.
    source: src-arxiv-2503-05244-v4
    quote: For models capable of reasoning, the reasoning content is excluded from the evaluated
      response.
  - term: base-model
    reason: Requests to an assistant presuppose instruction tuning.

as_used:
  - protocol: A 58-query novel-creation subset spanning seven domains, generated by Claude Sonnet
      4.6, Claude Opus 4.7, GPT-5.4 and GPT-5.5 (zero-shot and inside story-generation systems) and
      judged by claude-sonnet-4-6 in place of the leaderboard's judge.
    split: 58 queries
    source: src-arxiv-2609-15188-v4
    quote: All systems use the same 58-query WritingBench novel-creation subset
    note: MUSE (2026) names the seven domains in its per-domain tables, Literature & Arts subdomains
      such as Fan Fiction and Novel Outline, and reports scores on a 0-100 scale (86.79 for
      zero-shot Claude Sonnet 4.6). Its judge is also one of its four base models, so the Claude
      Sonnet 4.6 rows are self-judged.
  - protocol: inspect_evals' writingbench task, all 1,000 queries or a domain filter, judged by
      anthropic/claude-3-5-haiku-latest unless another judge is passed.
    split: all 1,000 queries, or a domain or subdomain filter
    source: src-github-inspect-evals-writingbench-readme
    quote: "(default: `'anthropic/claude-3-5-haiku-latest'`)"
    note: The task's own check, on 200-query subsets with claude-3-7-sonnet-20250219 as both the
      model and the judge, gave 7.4 against the leaderboard's 7.848. Its changelog says results
      after 2026-08-20 (version 3-A, unparsable judge replies dropped instead of scored 0) are not
      comparable with 2-A.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the query set; a paper revised in October 2026 scores four
    current models on a WritingBench subset, and inspect_evals changed its WritingBench task on
    2026-08-20. The maintainers last updated the leaderboard on 2025-11-27.
  source: src-arxiv-2609-15188-v4
  quote: All systems use the same 58-query WritingBench novel-creation subset
activity: no-submission-channel
activity_note: The maintainers run the models they choose and publish the scores on their Hugging
  Face and ModelScope boards (54 models, last updated 2025-11-27). The README invites people
  interested in leaderboard construction to get in touch by GitHub or e-mail, but names no route by
  which outsiders enter a result.
activity_basis:
  reason: The maintainers add evaluations to the board themselves; everyone else runs the released
    scripts and reports in their own work.
  source: src-github-writingbench-readme
  quote: Update latest LLM evaluations (Claude-3-7-Sonnet, o3, grok-3, etc)

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Deepseek-R1
    source: src-arxiv-2503-05244-v4
    observed_on: 2026-11-09
    quote: Open-source LLMs Deepseek-R1 7.70±0.053
  - system: GPT-5 (gpt-5-2025-08-07)
    source: src-hf-writingbench-leaderboard-scores
    observed_on: 2026-11-09
    quote: gpt-5-2025-08-07,83.87,1000,OpenAI
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: none
ground_truth_source_note: No answer key decides the score. The judge's per-criterion grades are the
  score, against criteria and rubrics that Claude-3.7 generated per query and annotators reviewed;
  the human preferences of the validation study are on queries outside the benchmark.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The queries, criteria, prompts, generation, scoring and aggregation scripts and the critic
    model are public; grading needs API access to the judge or a GPU for the critic. The
    leaderboard's judges are hosted models whose snapshots are not named (see
    execution.harness_gotcha).
  source: src-arxiv-2503-05244-v4
  quote: The benchmark dataset and code have been open-sourced in the GitHub Repo

task:
  exists: true
  input:
    - a writing query in Chinese or English from one of 100 subdomains, with style, format, length
      or other requirements
    - reference material for the task where the query needs it, from tens to thousands of words
  output: The requested text, in one response; a reasoning model's reasoning is removed before
    grading.
  scoring: The judge scores the response against each of the query's five criteria from 1 to 10,
    with a justification, using the criterion's rubric; the score is the mean over criteria and
    queries, and the leaderboard multiplies it by ten. Requirement subsets average either all five
    criteria of the queries with that requirement (R) or only the criteria about it (C).
  metric_range:
    - 1
    - 10
  source: src-github-writingbench-readme
  quote: Each query is paired with **5 instance-specific criteria**, scoring either through LLM
    evaluators or through a finetuned critic model.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The queries, materials and criteria are one JSONL file in the public repository, and the
      critic model is released on Hugging Face.
    source: src-arxiv-2503-05244-v4
    quote: The benchmark dataset and code have been open-sourced in the GitHub Repo
  refresh: versioned-releases
  refresh_note: Each change is a dated README announcement. On 2025-04-29 the query set went from
    1,239 to 1,000 queries with updated criteria and a new evaluation prompt; on 2025-09-05 and
    2025-11-27 only the leaderboard's judge changed (see versions). The queries have not changed
    since 2025-04-29, as far as the README says.
  refresh_basis:
    reason: The query set and the judge change only in dated announcements a claim can be pinned to.
    source: src-github-writingbench-readme
    quote: including **1,000** queries and requirement dimension subsets
  data_provenance:
    - model-generated
  data_provenance_note: GPT-4o and Claude-3.5-Sonnet drafted the queries from the domain taxonomy
    and diversified them; 30 trained annotators then collected reference material from public
    documents, and five experts with LLM experience or industry expertise revised, filtered and
    pruned them and wrote some queries of their own. The criteria are Claude-3.7's, reviewed by
    annotators. expert-authored and web-scraped were weighed for the experts' queries and the
    collected materials (see review_checks).
  data_provenance_source: src-arxiv-2503-05244-v4
  data_provenance_quote: we prompt two different LLMs (GPT-4o and Claude-3.5-Sonnet
  contamination_risk: medium
  contamination_risk_note: >
    The queries, materials and criteria have been public on GitHub since March 2025, and the materials
    are public documents in the first place, so a training route is plausible; no source read evidences
    one for an entrant. Two routes on the evaluator's side are stated. The critic model was trained on
    responses to the benchmark's own queries and criteria ("When building the training data of scoring
    prompts, the queries and criteria are drawn from WritingBench"), so its scores are not independent
    of the items. The maintainers' own writing models were fine-tuned on 12K samples selected by that
    critic from 24K queries generated with the same subdomain taxonomy (not the benchmark's queries) and
    are scored beside other models. The human-alignment study used 300 queries kept out of the benchmark.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: Each criterion is scored on a bounded 1-10 scale and the headline is their mean (shown
      as 100 on the board); no human or measured ceiling is published.
    source: src-github-writingbench-readme
    quote: Leaderboard scores are scaled from 10 to 100 by multiplying by 10 for easier viewing.
  dataset_licence: Apache-2.0
  dataset_licence_note: The licence of the X-PLUG/WritingBench repository that holds
    benchmark_all.jsonl (GitHub's licence metadata, read 2026-11-09; not a quoted Source). The
    leaderboard space's card also declares apache-2.0 (src-hf-api-writingbench-space). No licence is
    stated for the collected reference materials, which come from third parties' public documents.
  size:
    - count: 1000
      unit: writing queries, each with five criteria
      source: src-arxiv-2503-05244-v4
      quote: a benchmark comprising 1,000 queries categorized using a two-tiered taxonomy, including
        445 queries in Chinese and 555 queries in English
    - count: 555
      unit: queries
      subset: English
      source: src-arxiv-2503-05244-v4
      quote: a benchmark comprising 1,000 queries categorized using a two-tiered taxonomy, including
        445 queries in Chinese and 555 queries in English
    - count: 445
      unit: queries
      subset: Chinese
      source: src-arxiv-2503-05244-v4
      quote: a benchmark comprising 1,000 queries categorized using a two-tiered taxonomy, including
        445 queries in Chinese and 555 queries in English
    - count: 183
      unit: queries
      subset: Literature & Arts domain (the creative-writing subset)
      source: src-arxiv-2503-05244-v4
      quote: Politics & Law 201 Literature & Arts 183 Education 111 Advertising & Marketing 128
    - count: 1239
      unit: writing queries
      subset: first release, 2025-03-10 (superseded)
      source: src-github-writingbench-readme
      quote: We release the first version of WritingBench, including **1,239** writing queries and
        style/format/length dimension subsets.
  languages:
    - English
    - Chinese

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: X-PLUG (the GitHub organisation holding the repository), with the WritingBench Hugging
    Face organisation holding the leaderboard
  maintainer_basis:
    reason: The paper gives the repository under X-PLUG and the leaderboard under the WritingBench
      organisation; the README, the leaderboard and the dataset file sit there.
    source: src-arxiv-2503-05244-v4
    quote: 'Repo: https://github.com/X-PLUG/WritingBench Leaderboard: https://huggingface.co/spaces/WritingBench/WritingBench'
  maintainer_type: null
  maintainer_type_note: Not set. The industry-lab test names the holder of the repository and
    dataset, not the authors' affiliations, and no Source read states what X-PLUG or the
    WritingBench Hugging Face organisation is (GitHub's organisation record gives no name or
    description). The paper's front matter lists one company and two universities as affiliations
    (see review_checks).
  submission_process:
    - maintainer-run
  submission_process_note: The maintainers choose the models, run them with fixed generation
    parameters, score them with their judge and publish the table; others run the released scripts
    and report in their own work.
  submission_process_source: src-github-writingbench-readme
  submission_process_quote: Update latest LLM evaluations (Claude-3-7-Sonnet, o3, grok-3, etc)
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-hf-writingbench-leaderboard-scores
      quote: claude-sonnet-4-5-20250929,80.71,1000,Anthropic
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2503-05244-v4
      quote: and our writing model, Qwen-2.5-7Bfiltered (fine-tuned on Qwen-2.5-7B-Instruct)
  independence_flags_note: >
    The leaderboard is "Scored by: Claude-Sonnet-4-5" (src-hf-writingbench-space-app), and Anthropic's
    models are among the 54 rows, Claude-Sonnet-4-5 itself among them at 80.71. Before that the judges
    were Claude-Sonnet-4 and Claude-3-7-Sonnet, also on the board. Claude-3.7 also wrote every query's
    criteria and the critic model's training scores, and Claude-3.7-thinking leads the paper's own table.
    The maintainers' own writing models (Qwen-2.5-7B-filtered, Llama-3.1-8B-filtered) are scored in the
    paper. Whether the maintainers' employer also has models on the board is a review check, not a flag,
    since no Source read states who holds X-PLUG.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2503-05244-v4
    quote: our evaluation framework exhibits diminished precision in handling complex
      multidimensional length requirements
  known_limitation_note: >
    The paper's appendix names three limitations: training by plain SFT only; the scoring's weakness on
    complex length requirements such as section-specific word counts; and that "human evaluators inevitably
    introduce subjective biases when assessing two fair-well responses", which bounds the validation study.
    No Source read measures the judges' own biases (self-preference, length or position) on WritingBench;
    the leaderboard's self-judged rows and MUSE's self-judged Claude Sonnet 4.6 rows are untested for
    them.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The leaderboard's judge is a hosted Claude model called by API, and the system
    under test can be an API model; the alternative judge, the 7B critic model, runs locally on a
    GPU.
  compute_tier_source: src-github-writingbench-readme
  compute_tier_quote: Recommend using `Claude-3-7-Sonnet` for evaluation.
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: Automatable end to end with an API key for the judge or a GPU for the
    critic. The judge samples at temperature 1.0, so scores vary between runs (the paper reports
    standard deviations over three samples), and the hosted judges are named without snapshots,
    which makes the headline condition hard to pin; the vocabulary deferred a blocker for hosted
    judges.
  reproducibility_tier_basis:
    reason: Generation, scoring and aggregation are scripted against the public query file.
    source: src-github-writingbench-readme
    quote: python evaluate_benchmark.py
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The X-PLUG/WritingBench scripts (generate_response.py, evaluate_benchmark.py with the
    claude or critic evaluator, then calculate_scores.py)
  harness_source: src-github-writingbench-readme
  harness_quote: python evaluate_benchmark.py
  harness_gotcha:
    source: src-github-writingbench-readme
    quote: Recommend using `Claude-3-7-Sonnet` for evaluation.
  harness_gotcha_note: The README's Quick Start still recommends Claude-3-7-Sonnet as the judge,
    while its news says the leaderboard moved to Claude-Sonnet-4 (2025-09-05) and Claude-Sonnet-4-5
    (2025-11-27); inspect_evals defaults to claude-3-5-haiku-latest. A score is comparable only
    under the same judge, and none of these names a dated snapshot. The paper's table (critic model,
    1-10) and the board (Claude, 0-100) are different conditions too.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for X-PLUG/WritingBench, read 2026-11-09; not a
    quoted Source. The repository was last pushed on 2025-12-19.
  runnable_via:
    - custom
    - inspect
  runnable_via_note: UK AISI's inspect_evals has a writingbench task with its own copy of the query
    file and a different default judge (src-github-inspect-evals-writingbench-readme).
  inspect_evals_id: writingbench
  maintainer_rerun_policy: unstated

comparability:
  # The model-graded profile applies (judge model and version, judge prompt, rubric). Beyond it: decoding, which
  # the maintainers fix for both the entrant (temperature 0.7, top_p 0.8, top_k 20, up to 16,000 tokens) and the
  # judge (temperature 1.0, top_p 0.95, 2,048 tokens), and which moves the score between runs.
  material_extra:
    - sampling

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: One headline, the mean of the per-criterion scores over all queries; domain, subdomain,
    language and requirement scores are reported beside it.
  source: src-arxiv-2503-05244-v4
  quote: The final overall score is computed by averaging scores across all criteria.

homepage: https://github.com/X-PLUG/WritingBench
repository: https://github.com/X-PLUG/WritingBench
dataset_url: https://github.com/X-PLUG/WritingBench/blob/main/benchmark_query/benchmark_all.jsonl
leaderboard_url: https://huggingface.co/spaces/WritingBench/WritingBench


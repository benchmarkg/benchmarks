# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T04)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2503-05244-v4
    - src-arxiv-2503-05244
    - src-github-writingbench-readme
    - src-hf-api-writingbench-space
    - src-hf-writingbench-space-app
    - src-hf-writingbench-leaderboard-scores
    - src-github-inspect-evals-writingbench-readme
    - src-arxiv-2609-15188-v4
  sources_note: >
    The paper's v4 PDF (a DOI, not archived) read as text; its abstract page for the dates; the README
    at main; Hugging Face's API record of the leaderboard space; the space's app.py, read because the
    board renders by script; its score.xlsx, read as text; the inspect_evals task README at main; and
    MUSE's v4 PDF (a DOI, not archived) as evidence of current use. GitHub's API was read for the licence,
    creation and push dates without being made a Source. The query file (benchmark_all.jsonl) was opened
    to confirm its fields and counts but is not a Source; its items embed third parties' documents, some
    naming people.
  confidence: medium
  review_checks:
    - check: WritingBench was chosen for the empty creative-writing leaf over LitBench (2025, human
        preference pairs on Reddit stories) and EQ-Bench's Creative Writing v3. LitBench's scored
        act is judging which of two stories people preferred, which tests evaluators rather than
        writers, and its items carry Reddit users' stories; Creative Writing v3 has no paper and is
        run from an individual's project. WritingBench has a NeurIPS paper, open queries and
        rubrics, a repository, a board, an inspect_evals task and 2026 use. Those comparisons rest
        on general knowledge, not on Sources read for this entry. No Epoch stub exists; the id
        writingbench is proposed.
      field: domain
    - check: language/generation is primary and creative-writing secondary, with the Literature &
        Arts subset (183 of 1,000) overriding to creative-writing. A reviewer may prefer a separate
        entry for a purpose-built creative-writing benchmark so that the leaf has a primary entry of
        its own.
      field: domain
      source: src-arxiv-2503-05244-v4
      quote: Politics & Law 201 Literature & Arts 183 Education 111 Advertising & Marketing 128
    - check: The grader changes by stage and by date. Criteria are Claude-3.7's, the paper's numbers
        are the critic model's (1-10), and the board's are Claude-3-7-Sonnet's, Claude-Sonnet-4's
        and now Claude-Sonnet-4-5's (0-100), none with a snapshot id. The README's Quick Start still
        recommends Claude-3-7-Sonnet. Whether the board rescored every model when the judge changed
        is not stated.
      field: evaluation_method
      source: src-hf-writingbench-space-app
      quote: 'Scored by: Claude-Sonnet-4-5'
    - check: The two judge switches are modelled as revisions although the queries did not change,
        so a claim can name the judge it was scored under; the 04 S4 rule is written for item
        changes. Whether the 1,000 queries of 2025-04-29 are a subset of the first 1,239 is not
        stated, so revision or edition for that step is a judgement.
      field: versions
      source: src-github-writingbench-readme
      quote: Switch to **Claude-Sonnet-4** for evaluation.
    - check: grader-from-evaluated-party rests on Claude-Sonnet-4-5 judging a board on which it and
        other Anthropic models are scored; the same model family wrote the criteria and trained the
        critic. MUSE's judge (claude-sonnet-4-6) also scores Claude Sonnet 4.6 outputs. No Source
        measures self-preference on WritingBench.
      field: governance.independence_flags
      source: src-arxiv-2609-15188-v4
      quote: the judge is claude-sonnet-4-6
    - check: maintainer_type is null. The paper's front matter gives Alibaba Group, Renmin
        University of China and Shanghai Jiao Tong University as the authors' affiliations (not
        quoted, because the author names and e-mail addresses sit beside them). If X-PLUG is held by
        that company, maintainer_type is industry-lab and maintainer-competes-on-own-benchmark
        extends to the board's Alibaba (Qwen) rows.
      field: governance.maintainer_type
      source: src-hf-writingbench-leaderboard-scores
      quote: qwen3-235b-a22b-thinking-2507,82.34,1000,Alibaba
    - check: capability is context-integration alone. instruction-following was rejected because the
        source frames style, format and length as writing requirements graded by degree and does not
        claim instruction following; the category-specific (C) scores do isolate requirement
        criteria, which a reviewer may count. No capability term names writing quality itself
        (logged with bench tag-gap).
      field: capability
    - check: data_provenance is model-generated. The materials were collected from public documents
        by annotators (web-scraped?), and experts revised every query and wrote some
        (expert-authored?); the sources do not say how many queries the experts wrote. 445 queries
        are Chinese; a reviewer who reads Chinese could confirm the language counts and the
        materials' provenance.
      field: data.data_provenance
      source: src-arxiv-2503-05244-v4
      quote: Their role is to collect open-source reference materials needed for the writing tasks
        (e.g., public financial statements or legal templates).
    - check: contamination_risk medium. The evaluator-side routes (a critic trained on the
        benchmark's own queries and criteria; the maintainers' writing models trained on
        critic-selected data) are recorded in the note, not as contamination_evidence, because
        neither puts the items into an entrant's training data.
      field: data.contamination_risk
      source: src-arxiv-2503-05244-v4
      quote: When building the training data of scoring prompts, the queries and criteria are drawn
        from WritingBench
    - check: activity no-submission-channel, although the README invites contact by GitHub or e-mail
        about leaderboard construction; if the maintainers evaluate models on request,
        accepting-submissions with maintainer-run may fit better.
      field: activity
    - check: inspect_evals reproduces the scoring with a different default judge and reports 7.4
        against the board's 7.848 for the same model and judge on 200-query subsets; its changelog
        breaks comparability at 2026-08-20. Whether to record its runs as a separate condition is
        open.
      field: as_used
      source: src-github-inspect-evals-writingbench-readme
      quote: results are not comparable with `2-A`
    - check: dataset_licence and code_licence are the repository's Apache-2.0 from GitHub's
        metadata; no licence is stated for the third-party reference materials inside the queries.
      field: data.dataset_licence

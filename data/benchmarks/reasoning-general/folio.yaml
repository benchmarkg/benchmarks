# data/benchmarks/reasoning-general/folio.yaml
#
# P1-S3-T02, checkpoint entry 17 of 20 (copilot on: the F6 copilot's extractive drafter gave the name, title, arXiv
# id and release date). Filled from the FOLIO paper, arXiv 2209.00840 read as its v3 PDF (EMNLP 2024), and its
# abstract page; the repository README; Hugging Face's API record of the v2 data (its card is gated and was not
# read); and an August 2026 abstract that reports on it. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: folio
name: FOLIO
tagline: Expert-written premise sets with first-order-logic annotations; decide whether a conclusion
  is True, False or Unknown.
description: >
  1,430 conclusions over 487 sets of premises, written by experts as short natural-language stories grounded
  in real-world knowledge. Each premise and conclusion has a parallel first-order-logic formula, and a
  theorem prover checks that the labels follow from the premises. The main task asks whether a conclusion
  is True, False or Unknown given its premises, scored by accuracy. A second task translates the natural
  language into first-order logic. The split is 70/15/15 by story. The test split was never released,
  and the leaderboard the README promised did not appear, so published results are almost all on the validation
  split.
self_description:
  source: src-arxiv-2209-00840-v3
  quote: We present FOLIO, a human-annotated, logically complex and diverse dataset for reasoning in
    natural language (NL), equipped with first-order logic (FOL) annotations
external_ids:
  huggingface: yale-nlp/FOLIO
  arxiv: '2209.00840'
paper:
  title: 'FOLIO: Natural Language Reasoning with First-Order Logic'
  arxiv: '2209.00840'
  version_read: v3
  source: src-arxiv-2209-00840-v3
released: 2022-09-02
released_note: The paper's first arXiv version, as the abstract page dates it.
released_source: src-arxiv-2209-00840
released_quote: Fri, 2 Sep 2022

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: reasoning-general/logical-deduction
domain_basis:
  reason: Each item asks whether a conclusion follows from stated premises, checked by a first-order
    prover.
  source: src-arxiv-2209-00840-v3
  quote: each paired with one of 487 sets of premises used to deductively reason for the validity of
    each conclusion
capability:
  - deductive-reasoning
capability_basis:
  deductive-reasoning:
    reason: The label is decided by the premises alone, and a theorem prover confirms it from their
      FOL formulas.
    source: src-arxiv-2209-00840-v3
    quote: The logical correctness of the premises and conclusions is ensured by their FOL
      annotations, which are automatically verified by an FOL inference engine

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: The answer is one of three labels (True, False, Unknown), scored by accuracy; chance is
    one in three.
  source: src-arxiv-2209-00840-v3
  quote: We use accuracy for evaluating logical reasoning performance
designed_for_subjects:
  - instruction-tuned-model
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The paper evaluates both prompted large models (few-shot) and medium-sized models
    fine-tuned on FOLIO's training split.
  source: src-arxiv-2209-00840-v3
  quote: Our experiments on FOLIO systematically evaluate the FOL reasoning ability of supervised
    fine-tuning on medium-sized language models

lifecycle: active
lifecycle_basis:
  reason: Papers still report FOLIO in 2026, for example an August 2026 study listing it among five
    reasoning benchmarks; the repository was last pushed in December 2023 (GitHub API).
  source: src-arxiv-2609-05512
  quote: across five reasoning benchmarks, GSM8K, FOLIO, MATH-500, ProofWriter, and MuSiQue
activity: no-submission-channel
activity_basis:
  reason: The README promises a leaderboard for the unreleased test split, and none was found; there
    is no route for outside results, which appear in papers on the validation split.
  source: src-github-folio-readme
  quote: A leaderboard will be releeased soon to obtain your results on the unreleased test set.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4
    source: src-arxiv-2209-00840-v3
    observed_on: 2026-10-10
    quote: a subset of FOLIO presents a challenge for one of the most capable Large Language Model
      (LLM) publicly available, GPT-4
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Expert labels, confirmed by a theorem prover over the FOL annotations; the
  test labels are held by the maintainers and were never released.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test split, the benchmark's designed headline, has never been released and has no
    server, so no one outside the maintainers can score on it. The validation split can be scored by
    anyone.
  source: src-github-folio-readme
  quote: A leaderboard will be releeased soon to obtain your results on the unreleased test set.

task:
  exists: true
  input:
    - a set of natural-language premises and one conclusion (optionally with their FOL formulas)
  output: True, False or Unknown.
  scoring: Accuracy over conclusions; the split is by story, so evaluation stories are unseen.
  source: src-arxiv-2209-00840-v3
  quote: We split FOLIO by 70%/15%/15% split for the train/validation/test sets with 1,001/203/226
    examples respectively

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The v2 data on Hugging Face is gated with automatic approval ("gated":"auto" in its
    API record), which train-open-test-held-out's test records in a note.
  access_basis:
    reason: Train and validation are public (the v2 release behind an automatically approved Hugging
      Face gate); the test split is withheld.
    source: src-github-folio-readme
    quote: folio-v0.0 with train and validation sets are in the data/v0.0 folder
  refresh: versioned-releases
  refresh_basis:
    reason: The data has two named releases, v0.0 on GitHub and a corrected v2 on Hugging Face; a
      result names its version.
    source: src-github-folio-readme
    quote: We are excited to release a new version of FOLIO
  data_provenance:
    - expert-authored
  data_provenance_note: Stories and their FOL formulas were written by annotators with logic
    training, from scratch, not from templates.
  data_provenance_source: src-arxiv-2209-00840-v3
  data_provenance_quote: FOLIO is the first expert-written dataset for FOL reasoning equipped with
    parallel FOL formulas
  contamination_risk: medium
  contamination_risk_note: The designed test split is withheld, but almost every published result is
    on the public validation split, whose labels have been on GitHub since 2022. A training route
    into the split actually reported is plausible; no evidence was read.
  contamination_evidence: []
  dataset_licence: CC-BY-SA-4.0
  dataset_licence_note: The GitHub repository (v0.0) is CC-BY-SA-4.0 (GitHub's licence metadata);
    the Hugging Face record lists MIT for v2. The two disagree, and neither text was read.
  size_note: 1,430 conclusions over 487 premise sets; 1,001 train, 203 validation and 226 test.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Yale NLP (Yale-LILY)
  maintainer_basis:
    reason: The repository sits in Yale's LILY lab organisation and the v2 data in the yale-nlp
      organisation.
    source: src-hf-api-folio
    quote: '"author":"yale-nlp"'
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The designed headline is test accuracy, which only the maintainers can compute; in
      practice the field reports validation accuracy instead, which anyone can.
    source: src-github-folio-readme
    quote: A leaderboard will be releeased soon to obtain your results on the unreleased test set.
  reproducibility_blockers:
    - private-test-set
    - no-reference-implementation
  harness_availability: none
  harness_availability_note: The README says evaluation code "will be updated soon"; none was found.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which split (validation, as nearly everyone reports, or the withheld test), the data
  # version (v0.0 or v2), and the prompting (shots, chain of thought, with or without FOL formulas).
  material_extra:
    - subset_used

homepage: https://github.com/Yale-LILY/FOLIO
repository: https://github.com/Yale-LILY/FOLIO
dataset_url: https://huggingface.co/datasets/yale-nlp/FOLIO

tags:
  - logical-reasoning
  - first-order-logic
  - natural-language-inference


  level in its appendix, so the four sub-abilities are listed with their tasks under them. The sub-ability
  and task counts are the dataset viewer's Category and Task column statistics, quoted as each sub-ability's
  evidence. The difficulty levels (Level0 to Level2) are further cuts that are not listed.

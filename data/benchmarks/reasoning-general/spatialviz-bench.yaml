# data/benchmarks/reasoning-general/spatialviz-bench.yaml
#
# P1-S11-T02, reasoning-general entry 10. Promotes the Epoch stub data/benchmarks/_stubs/spatialviz-bench.yaml. Filled
# from the SpatialViz-Bench paper, arXiv 2507.07610 read as its v7 PDF (2026-03-16, the ICLR 2026 version) and its
# v1 PDF (2025-07-10), and its abstract page; Hugging Face's API record of PLM-Team/Spatial-Visualization-Benchmark,
# its card at a pinned commit, and the dataset viewer's size and column-statistics records; the code repository's
# README at a pinned commit; EASI's benchmark-verification page at a pinned commit and the v5 PDF of the EASI paper
# (arXiv 2508.13142), which report results on it; the MindCube abstract page (arXiv 2506.21458), read to weigh the
# other Epoch stub in this leaf; and Epoch's benchmark export, which lists SpatialViz-Bench outside its capabilities
# index. Every quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: spatialviz-bench
name: SpatialViz-Bench
aliases:
  - SpatialViz
  - Spatial Visualization Benchmark
  - SpatialVizBench
tagline: 1,180 generated diagram puzzles in 12 tasks of mental rotation, folding, penetration and
  animation; multiple choice.
description: >
  A benchmark of spatial visualization, the ability to imagine and mentally manipulate visual images,
  in multimodal language models, from the Institute of Automation of the Chinese Academy of Sciences with
  co-authors at Huawei Noah's Ark, UCL and Shanghai universities. It is organised around four sub-abilities
  taken from the psychology of spatial ability, with three tasks each: mental rotation (2D rotation, 3D
  rotation of cube stacks, three-view projection), mental folding (paper folding with punched holes, cube
  unfolding, cube reconstruction from a net), visual penetration (cross-sections of composite solids,
  counting the cubes in a stack from its views, completing a split cube stack) and mental animation (moving
  arrows on a grid, moving blocks under gravity, motion in gear and linkage systems). Each task has two
  or three difficulty levels of 40 or 50 items, 1,180 in all. Eleven tasks are rendered by a Python and
  FreeCAD generator that also builds the distractors and an explanation for every option; the mechanical-system
  items were written by the authors from public simulations, and one three-view level uses fixed DeepCAD
  part models. Every item is an image with a question and four options, most of them images, and the score
  is accuracy, overall and by sub-ability, task and level. A text-only model scores at chance, so the
  images are needed. The release paper reports 27 models (33 in its first version), led by Gemini-2.5-pro
  at 44.66%, against a human baseline of 82.46% and a random baseline of 25.08%. Data (MIT) is on Hugging
  Face and the evaluation and generation code on GitHub; there is no leaderboard of its own, and EASI's
  spatial-intelligence suite runs it.
self_description:
  source: src-arxiv-2507-07610-v7
  quote: we introduce SpatialViz-Bench, a comprehensive multi-modal benchmark for spatial
    visualization with 12 tasks across 4 sub-abilities, comprising 1,180 programmatically generated
    problems
external_ids:
  epoch: SpatialViz-Bench
  huggingface: PLM-Team/Spatial-Visualization-Benchmark
  arxiv: '2507.07610'
paper:
  title: 'SpatialViz-Bench: A Cognitively-Grounded Benchmark for Diagnosing Spatial Visualization in MLLMs'
  arxiv: '2507.07610'
  doi: 10.48550/arXiv.2507.07610
  version_read: v7
  source: src-arxiv-2507-07610-v7
released: 2025-07-10
released_note: The paper's first arXiv version, as its abstract page dates it, and the date Epoch's
  export and the stub carry. The code repository's README dates the release to 2025-05-28, the day
  the repository was created, and the Hugging Face dataset was created on 2025-06-18 (see
  review_checks).
released_source: src-arxiv-2507-07610
released_quote: Submitted on 10 Jul 2025 (v1), last revised 16 Mar 2026 (this version, v7)
release_venue: ICLR 2026
release_venue_note: The v7 PDF is headed as an ICLR 2026 conference paper, and the README records it
  as accepted as a poster; no proceedings page was read.
release_venue_source: src-arxiv-2507-07610-v7
release_venue_quote: Published as a conference paper at ICLR 2026.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: reasoning-general/spatial-reasoning
  secondary:
    - multimodal/visual-qa
  secondary_note: Every item is a question answered in language about an image, and the paper shows
    that a text-only model scores at chance, so multimodal's inclusion test is also met; visual-qa
    is recorded as the secondary, as MapEval's entry does for its map images (see review_checks).
domain_basis:
  reason: The paper's object of study is spatial visualization as a cognitive ability in its own
    right, decomposed into the four sub-abilities of the psychology of spatial ability, and it
    builds the benchmark to stop that ability being filed under mathematical or logical reasoning.
    The items present the spatial relations diagrammatically, as rendered cube stacks, nets, solids
    and grids, which the leaf's definition admits; nothing is applied to a field with a family of
    its own.
  source: src-arxiv-2507-07610-v7
  quote: Despite their importance as dedicated spatial-reasoning challenges, spatial visualization
    tasks are often buried under broader categories like mathematical or logical reasoning,
    appearing as multimodal puzzles or 3D geometry problems.
domain_considered_and_rejected:
  - term: multimodal/chart-diagram-understanding
    reason: The images are diagrams, but nothing is read off them; the answer needs a transformation
      the image does not show, which is the paper's contrast with benchmarks of visible information.
  - term: mathematics/symbolic-manipulation
    reason: Some tasks resemble 3D geometry problems, but the paper sets spatial visualization apart
      from mathematical reasoning, and the items ask for no computation beyond counting cubes.
  - term: general-intelligence/human-comparison-batteries
    reason: Built on the psychometrics of spatial ability, with a human baseline, but the claim is
      one competence, not breadth, and the human baseline is a reference rather than the purpose.
  - term: reasoning-general/puzzle-solving
    reason: Each item is a posed problem with a submitted answer, which that leaf's definition also
      fits, but what all twelve tasks turn on is a spatial transformation, which has its own leaf.
  - term: vision/depth-geometry
    reason: Nothing is recovered from the image as a signal; the score is whether the chosen option
      is right.
capability:
  - spatial-reasoning
capability_basis:
  spatial-reasoning:
    reason: Every task asks for a relation that the image does not show and that must be inferred by
      a mental transformation, rotating, folding, slicing, counting hidden cubes or propagating
      motion.
    source: src-arxiv-2507-07610-v7
    quote: It is grounded in cognitive science and assesses 4 key sub-abilities through 12 distinct
      tasks
capability_considered_and_rejected:
  - term: perception
    reason: The paper finds that most failures are perceptual, but the score is the choice of an
      option after a transformation, not what is recovered from the image, which the term's
      inclusion test asks.
    source: src-arxiv-2507-07610-v7
    quote: model failures stem primarily from fundamental Perceptual and Spatial Transformation
      deficits, rather than from high-level reasoning
  - term: causal-reasoning
    reason: The 80 mechanical-system items ask how a motion propagates through gears and linkages,
      but that is mental animation of a given mechanism, not the separation of cause from
      association.
  - term: quantitative-reasoning
    reason: Cube Counting's answers are counts, but the count is the product of inferring hidden
      cubes from views; the paper reports no calculation-heavy task.
  - term: deductive-reasoning
    reason: Arrow Moving and Block Moving apply stated movement rules, but the rules are applied to
      a spatial state that must be tracked, not chained as premises.

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: All items are four-option multiple choice with one correct option, most options being
    images; the score is accuracy, against a random baseline of 25.08% that the paper reports in its
    results table. Option D is often "All three other options are incorrect", which makes D less
    frequent (17.5%) than the other letters.
  source: src-arxiv-2507-07610-v7
  quote: we formatted all tasks as Multiple-Choice Answer (MCA) with one correct answer.
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: The direct numeric format provided for Cube Counting (and parts of Cube Reconstruction)
      is an analysis in an appendix; the headline protocol is the option letter.
    source: src-arxiv-2507-07610-v7
    quote: When the Cube Counting task was converted to a fill-in-the-blank format, all models
      showed a significant performance drop.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: Each item is one zero-shot prompt with the image to a multimodal model, with no tools and
    no loop; the paper runs open-weight models locally and closed models through their APIs, each
    with a chain-of-thought prompt and, for most, a direct-answer prompt.
  source: src-arxiv-2507-07610-v7
  quote: all experiments were performed in a zero-shot setting [43, 5], comparing model performance
    under two prompting schemes
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: Eight graduate students answered a 72-item sample as a baseline, not the benchmark under
      the same protocol as models.
    source: src-arxiv-2507-07610-v7
    quote: we randomly sampled 6 problems from each of the 12 task categories, resulting in a total
      of 72 problems per participant.
observed_subjects:
  values:
    - instruction-tuned-model
    - reasoning-model
  basis: The release paper evaluates reasoning models (o1, Gemini-2.5, QvQ and Kimi-VL-thinking)
    beside instruction-tuned ones, and leaves them out of the direct-answer ablation.
  source: src-arxiv-2507-07610-v7
as_used:
  - protocol: All 1,180 items, accuracy under the benchmark's own prompt, which EASI's paper calls
      the official protocol.
    split: test
    source: src-arxiv-2508-13142-v5
    quote: Table 3 Evaluation on eight recent spatial benchmarks (Official Protocol).
    note: EASI (arXiv 2508.13142 v5, December 2025) runs SpatialViz-Bench as one of eight spatial
      benchmarks and puts GPT-5 first on it, at 51.27.
  - protocol: All 1,180 items under EASI's unified chain-of-thought prompt, scored as
      chance-adjusted accuracy (CAA), not accuracy.
    split: test
    source: src-arxiv-2508-13142-v5
    quote: Table 22 Evaluation on SpatialViz (EASI Protocol). All scores are CAA (computed via Eq.
      (1)).
    note: CAA rescales accuracy against chance, so a score below 0 means worse than guessing; it is
      not comparable with the release paper's accuracy.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it. EASI's paper (v5, December 2025) evaluates GPT-5, Grok-4
    and others on it, and EASI's verification page (2026) reproduces the paper's scores in two
    evaluation toolkits. Its top accuracy, about 51%, is far below the 82.46% human baseline. The
    Hugging Face data was last modified on 2025-07-29, which is maintenance evidence, not lifecycle.
  source: src-arxiv-2508-13142-v5
  quote: SpatialViz contains 1,180 items; with max_completion_tokens set to 16,384, all models
    produced complete answers except Grok-4
activity: no-submission-channel
activity_basis:
  reason: Neither the paper, the dataset card nor the README describes a leaderboard or a submission
    route; the README gives scripts to run the benchmark oneself. EASI's own leaderboard takes
    submissions for its suite, which is not the maintainers' channel.
  source: src-github-spatialviz-bench-readme
  quote: This project is designed to evaluate the performance of multimodal large language models on
    the SpatialViz-Bench benchmark.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Gemini-2.5-pro
    source: src-arxiv-2507-07610-v7
    observed_on: 2026-11-09
    quote: with top scores from Gemini-2.5-pro (44.66%) and o1 (41.36%)
  - system: GPT-5 (GPT-5-2025-08-07), in EASI's runs
    source: src-arxiv-2508-13142-v5
    observed_on: 2026-11-09
    quote: GPT-5-2025-08-07 [45]
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Stored option letters, computed by the generator for the eleven
  programmatic tasks and agreed by two annotators for the mechanical-system items, and released with
  the questions and per-option explanations.
ground_truth_source_basis:
  reason: The mechanical-system answers were checked by two annotators to consensus; the other
    tasks' answers come from the generator that built the options.
  source: src-arxiv-2507-07610-v7
  quote: This rigorous process ultimately produced 80 validated data samples.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Items, images and answers are public on an ungated Hugging Face record, the maintainers'
    scripts run and score models, and EASI reproduces the paper's numbers within about two points in
    both of its toolkits.
  source: src-github-easi-benchmark-verification
  quote: '| Qwen2.5-VL-7B-Instruct | `SpatialVizBench` | 30.76 | - | 31.02 | +0.26 |'
task:
  exists: true
  input:
    - One image that combines the reference figure and the option figures (cube stacks, nets,
      punched paper, solids, grids or mechanisms), with a templated question and four options A to D
  output: One option letter, extracted from the model's answer by rules that look for answer tags,
    boxed letters or answer phrases.
  scoring: Accuracy, the share of items whose extracted letter equals the stored answer, reported
    overall and by sub-ability, task and difficulty level.
  source: src-arxiv-2507-07610-v7
  quote: we employ a hierarchical, two-stage rule-based approach for answer extraction

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The questions, answers, explanations and images are on Hugging Face under MIT, as one
      test split, and the record is ungated.
    source: src-hf-api-spatialviz-bench
    quote: '"gated":false'
  refresh: static
  refresh_basis:
    reason: One set of 1,180 items, unchanged since July 2025; the arXiv revisions to v7 report the
      same set, and the first version's top scores (44.66 and 41.36) are the latest's. The paper
      calls the test bank dynamically updatable and the generator code was released in February
      2026, but no regenerated set has been published, which the static term's test leaves static.
    source: src-hf-api-spatialviz-bench
    quote: '"lastModified":"2025-07-29T04:06:23.000Z"'
  data_provenance:
    - synthetic-procedural
    - expert-authored
  data_provenance_note: Eleven tasks (1,100 items) are rendered by the authors' Python and FreeCAD
    generator with controlled randomness, which also builds the distractors and the explanations; no
    model writes items. Three-View Projection's Level 1 (50 items) projects fixed part models from
    DeepCAD, a published machine-learning dataset, so curated-public-database is not tagged. The 80
    mechanical-system items were designed by members of the author team from public simulation
    material, and two annotators checked them (see review_checks).
  data_provenance_source: src-arxiv-2507-07610-v7
  data_provenance_quote: Conversely, the Mechanical System task (1/12) was manually designed, as
    programmatic, physically-consistent generation was technically difficult.
  contamination_risk: medium
  contamination_risk_note: The programmatic design stops models answering from web-sourced IQ-test
    or contest items seen in pretraining, which is the leakage the paper sets out to avoid. The
    items, answers and per-option explanations themselves have been public on Hugging Face since
    mid-2025 with no canary or training ban in the card, so a training route into the scored items
    is plausible. None is evidenced in the sources read.
  contamination_risk_source: src-arxiv-2507-07610-v7
  contamination_risk_quote: This reliance on publicly sourced problems from IQ tests or math
    competitions risks data contamination and compromises assessment reliability.
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_note: 82.46%, the mean accuracy of eight graduate students in mechanical
    engineering and computer science, chosen for strong geometry and physics backgrounds, on a
    72-item sample (six per task) without scratch paper and with unlimited time (see review_checks).
  ceiling_anchor_type_source: src-arxiv-2507-07610-v7
  ceiling_anchor_type_quote: All evaluated models performed well below the human baseline (82.46%)
  dataset_licence: MIT
  dataset_licence_note: The card's licence field; the code repository is MIT too (GitHub's licence
    metadata, read 2026-11-09; not a quoted Source).
  dataset_licence_source: src-hf-api-spatialviz-bench
  dataset_licence_quote: license:mit
  size:
    - count: 1180
      unit: four-option multiple-choice questions (12 tasks, 2 or 3 levels of 40 or 50 each)
      source: src-hf-datasets-server-spatialviz-bench-size
      quote: '"split":"test","num_bytes_parquet_files":63865,"num_bytes_memory":979210,"num_rows":1180'
    - count: 818
      unit: questions whose options are images
      source: src-arxiv-2507-07610-v7
      quote: A significant majority of questions (818) feature image-based options to emphasize
        visual reasoning.
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The SpatialViz-Bench authors (Institute of Automation, Chinese Academy of Sciences,
    with co-authors at Huawei Noah's Ark, UCL, Shanghai Jiao Tong and ShanghaiTech universities)
  maintainer_basis:
    reason: The paper's authors built and released the benchmark; the first-listed affiliation is
      the Institute of Automation's laboratory. The data sits in the PLM-Team organisation on
      Hugging Face and the code in an author's personal GitHub account.
    source: src-arxiv-2507-07610-v7
    quote: Institute of Automation, Chinese Academy of Sciences 2University of Chinese Academy of
      Sciences
  maintainer_type: academic-lab
  maintainer_type_note: industry-lab was considered, as one corresponding author's affiliation is
    Huawei Noah's Ark; the first author's laboratory and most affiliations are academic.
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results page; beyond the release paper's tables,
    results appear in others' papers and in EASI's suite.
  independence_flags: []
  independence_flags_note: None recorded. The release paper evaluates closed models from five
    providers (OpenAI, Google, Anthropic, Alibaba's Qwen and ByteDance's Doubao) and open-weight
    families, none from the authors' listed institutions; no funder is named in the sources read
    (see review_checks).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: Public data, public scoring code and rule-based answer extraction; a
    run needs no human, simulator or maintainer step. Open-weight models need a GPU to serve, which
    is the entrant's choice.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness_availability_note: The repository's evaluation scripts (evaluate.py for API models and one
    script per open-weight family) run the models and compute accuracy overall, by category, task
    and level. EASI integrates the benchmark in VLMEvalKit (SpatialVizBench, SpatialVizBench_CoT)
    and lmms-eval (spatialviz_full), and its verification page compares their numbers with the
    paper's.
  harness_availability_source: src-github-spatialviz-bench-readme
  harness_availability_quote: '`overall`: Accuracy across all test instances.'
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for the repository, read 2026-11-09; not a quoted
    Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the llm-static-text profile (chain_of_thought and subset_used are in it already): the prompt (the
  # paper's CoT prompts A and B, its direct-answer prompt, or EASI's unified CoT prompt) and the harness (the
  # maintainers' scripts, or EASI's VLMEvalKit or lmms-eval backend, each with its own answer extraction), and
  # whether the score is accuracy or EASI's chance-adjusted CAA.
  material_extra:
    - prompt_template_hash
    - harness

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper's headline is overall accuracy over all 1,180 items, which its results table
    reports beside the sub-ability and task averages, and the maintainers' scoring code computes it.
  source: src-github-spatialviz-bench-readme
  quote: '`overall`: Accuracy across all test instances.'

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T02)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2507-07610-v7
    - src-arxiv-2507-07610-v1
    - src-arxiv-2507-07610
    - src-hf-api-spatialviz-bench
    - src-hf-spatialviz-bench-readme
    - src-hf-datasets-server-spatialviz-bench-size
    - src-hf-datasets-server-spatialviz-bench-statistics
    - src-github-spatialviz-bench-readme
    - src-github-easi-benchmark-verification
    - src-arxiv-2508-13142-v5
    - src-arxiv-2506-21458
    - src-epoch-benchmark-data
  sources_note: >
    The paper's v7 and v1 PDFs (DOIs, not archived) read as text, and its abstract page for the dates
    and revisions; Hugging Face's API record of the dataset, its card at commit c722d00b, and the dataset
    viewer's size and statistics records; the code repository's README at commit c27f9111; EASI's benchmark-verification
    page at commit 0c1a41e5 and the EASI paper's v5 PDF (a DOI) as evidence of current use; the MindCube
    abstract page (a DOI), read only to weigh the other Epoch stub in this leaf; and Epoch's export for
    the SpatialViz-Bench string. Not read: the dataset rows and images, the generation code, EASI's leaderboard,
    and the GitHub LICENSE file.
  confidence: medium
  review_checks:
    - check: Choice of benchmark for the spatial-reasoning leaf. The two Epoch stubs here both take
        images. SpatialViz-Bench was preferred because its images are rendered diagrams (cube
        stacks, nets, solids), which the leaf's "textually or diagrammatically" admits, and its
        claim is a named cognitive ability. MindCube (arXiv 2506.21458) asks a model to imagine a
        whole scene from a few views of it and spends much of its paper on training methods
        (cognitive maps, reinforcement learning), which is nearer multimodal or vision scene
        understanding. A text-only benchmark (StepGame, SpartQA) was not needed once a stub fitted.
        Whether the lead prefers a text-only benchmark for this leaf, leaving both stubs to
        multimodal, is open.
      field: domain
      source: src-arxiv-2506-21458
      quote: Can Vision-Language Models (VLMs) imagine the full scene from just a few views, like
        humans do?
    - check: The primary domain passes two families' tests. multimodal's inclusion test ("answering
        in language about an image") is met, and the paper shows the images are indispensable;
        reasoning-general's is met by the paper's claim. No rule decides between a reasoning form
        and a modality family; the leaf's "diagrammatically" and MapEval's entry (geospatial
        primary, visual-qa secondary) were followed. Logged with bench tag-gap as undefined-boundary
        (2026-11-09-spatialviz-bench-001).
      field: domain
      source: src-arxiv-2507-07610-v7
      quote: the text-only model achieved a total accuracy of 25.86%, which is negligibly different
        from the random-chance baseline (25.08%), quantitatively proving that the visual modality is
        indispensable.
    - check: Epoch's export gives SpatialViz-Bench a random baseline of 0.0, while the paper's
        results table reports a random row of 25.08% (four options, with D less frequent). Headroom
        should be read against 25.08%; the stub's chance_baseline 0.0 needs correcting when it is
        retired.
      field: external_ids.epoch
      source: src-epoch-benchmark-data
      quote: SpatialViz-Bench,False,,,1.0,0.0,1.0,2025-07-10,
    - check: ceiling_anchor_type expert-average rests on eight graduate students chosen for geometry
        and physics backgrounds, answering a 72-item sample (six per task) rather than the 1,180
        items; crowd-average may fit better if they are read as non-specialists. Gemini-2.5-pro
        exceeds the human score on Arrow Moving.
      field: data.ceiling_anchor_type
      source: src-arxiv-2507-07610-v7
      quote: All participants possessed strong backgrounds in geometry and physics
    - check: refresh static, although the paper presents a dynamically updated test bank against
        contamination and the generator code was released on 2026-02-02. No regenerated set has been
        published; if the maintainers release one, it is a new version (versioned-releases).
      field: data.refresh
      source: src-arxiv-2507-07610-v7
      quote: supports a dynamically updated test bank that proactively mitigates data contamination
    - check: The release date. arXiv v1 (2025-07-10), Epoch and the stub agree; the README's news
        dates the release to 2025-05-28, when the repository was created, and the Hugging Face
        record was created on 2025-06-18 with its data uploaded in June and early July 2025 (the
        record's commit list, read 2026-11-09).
      field: released
      source: src-github-spatialviz-bench-readme
      quote: Released SpatialViz-Bench, the first benchmark to evaluate spatial visualization for
        MLLMs.
    - check: data_provenance expert-authored for the 80 mechanical-system items rests on the paper
        calling their authors experts; they were members of the author team, and the items were
        checked by two graduate annotators. DeepCAD, the source of 50 three-view items, is a
        machine-learning dataset, so curated-public-database was not tagged.
      field: data.data_provenance
      source: src-arxiv-2507-07610-v7
      quote: Using representative public simulations as a reference, experts designed all questions
        from scratch.
    - check: The dataset card's loading snippet points to an anonymous review copy rather than the
        PLM-Team record, and the card names two tasks differently from the paper (Cube Count
        Inference, Sliding Blocks). Whether the anonymous copy holds the same 1,180 items was not
        checked.
      field: dataset_url
      source: src-hf-spatialviz-bench-readme
      quote: load_dataset("Anonymous285714/SpatialViz-Bench")
    - check: Scores are reported under several protocols that are not comparable. The paper's CoT
        prompts A and B and its direct-answer prompt, EASI's official protocol (accuracy) and EASI's
        own protocol (chance-adjusted CAA, under a unified CoT prompt). Grok-4's EASI score is
        depressed by 300+ truncated answers.
      field: comparability
      source: src-arxiv-2508-13142-v5
      quote: Table 22 Evaluation on SpatialViz (EASI Protocol). All scores are CAA (computed via Eq.
        (1)).
    - check: maintainer_type academic-lab and no independence flag. One corresponding author is at
        Huawei Noah's Ark, and no Huawei model is among those evaluated; the paper names no funder.
        The code is in a personal GitHub account and the data in the PLM-Team organisation on
        Hugging Face, which the sources do not link to an institution.
      field: governance
      source: src-arxiv-2507-07610-v7
      quote: For closed-source MLLMs, we evaluated models from 5 major providers
    - check: GPT-5's 51.27 on the official protocol is read from EASI's Table 3, whose text extract
        runs column by column, so the row-to-number mapping (the last of six proprietary-model
        values in the SpatialViz column) should be checked against the PDF.
      field: as_used
      source: src-arxiv-2508-13142-v5
      quote: 34.58 42.71 19.40† 35.59 44.66 51.27
    - check: One version is recorded for arXiv v1 to v7. The evidence that the items did not change
        is indirect, the same task list and counts and identical top scores in v1 and v7 (44.66 and
        41.36), with the dataset's files untouched since July 2025; the items were not compared. v7
        evaluates 27 models where v1 evaluated 33, so tables differ between the versions.
      field: versions
      source: src-arxiv-2507-07610-v1
      quote: Gemini-2.5-pro and ChatGPT o1 achieved the highest overall scores of 44.66 and 41.36
  personal_data_excluded:

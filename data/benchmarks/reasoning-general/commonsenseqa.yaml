# data/benchmarks/reasoning-general/commonsenseqa.yaml
#
# P1-S11-T01, reasoning-general entry 4 of 6. Filled from the CommonsenseQA paper, arXiv 1811.00937 read as its v2
# PDF (2019-03-15, NAACL 2019) and its v1 PDF (2018-11-02, the three-choice first release), and its abstract page;
# the ACL Anthology page of the NAACL version (scripts and styles stripped); the repository README at master;
# Hugging Face's API record of tau/commonsense_qa; the project site and leaderboard pages on tau-nlp.org, which
# have returned 404 since mid-2025 and were read from their last Wayback captures (2025-01-30 and 2025-01-05,
# scripts and styles stripped), and the spreadsheet of entries the leaderboard page links, read as its CSV export;
# the CommonsenseQA task's README in inspect_evals (at main) and its task file in lm-evaluation-harness (at the
# adapter's pin); and the PDF of SMART filtering (NAACL 2025), a paper that scores 29 models on the validation
# split. GitHub's API record of the repository (licence, pushed_at), the Wayback index of the two tau-nlp.org
# pages, and the data files on Amazon S3 were read beside them and are not quoted Sources. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.

id: commonsenseqa
name: CommonsenseQA
aliases:
  - CSQA
tagline: Five-choice questions on everyday knowledge, written by crowd workers around ConceptNet
  concepts; test answers withheld.
description: >
  Multiple-choice questions that need everyday knowledge the question does not state. Each was
  built from ConceptNet: a crowd worker saw a source concept and three target concepts sharing one
  relation with it (AtLocation, Causes, CapableOf and others), wrote one question per target so that
  only that target answers it, and added two distractors, one more ConceptNet concept and one of the
  worker's own, for five options in all (chance 20%). The paper reports 12,247 questions, fine-tuned
  BERT-large at 55.9% and humans at 88.9%; the released version 1.11 holds 12,102, split 9,741,
  1,221 and 1,140. The random split is the official one; a second split keeps question concepts
  apart between train, development and test. The test answers were never released: entrants
  e-mailed predictions to the authors, who scored them at most once every two weeks and listed an
  entry with a paper or a short report, in one column without ConceptNet and one with it. The site
  and its leaderboard have returned 404 since mid-2025, and results are now reported on the
  validation split. A first release (arXiv v1, November 2018) had 9,500 three-choice questions and
  is discontinued.
self_description:
  source: src-arxiv-1811-00937-v2
  quote: we present COMMONSENSEQA, a new dataset focusing on commonsense question answering, based
    on knowledge encoded in CONCEPTNET
external_ids:
  inspect_evals: commonsense_qa
  huggingface: tau/commonsense_qa
  papers_with_code: commonsenseqa
  arxiv: '1811.00937'
paper:
  title: 'CommonsenseQA: A Question Answering Challenge Targeting Commonsense Knowledge'
  arxiv: '1811.00937'
  doi: 10.18653/v1/N19-1421
  version_read: v2
  source: src-arxiv-1811-00937-v2
released: 2018-11-02
released_note: The paper's first arXiv version, which described the three-choice version 1.0; the
  five-choice version 1.11 came with v2 on 2019-03-15 (see versions).
released_source: src-arxiv-1811-00937
released_quote: Submitted on 2 Nov 2018
release_venue: NAACL 2019, long paper (Best Resource Paper)
release_venue_source: src-acl-n19-1421
release_venue_quote: 'Award: Best Resource Paper'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: reasoning-general/commonsense
domain_basis:
  reason: The questions are written to need everyday knowledge that the prompt does not supply,
    which is the leaf's definition.
  source: src-arxiv-1811-00937-v2
  quote: Our goal is to develop a method for generating questions that can be easily answered by
    humans without context, and require commonsense knowledge
domain_considered_and_rejected:
  - term: language/understanding
    reason: Its definition is answering from a supplied passage, and CommonsenseQA supplies none.
      The paper's Google snippets feed one reading-comprehension baseline and are not part of the
      released task.
  - term: language/retrieval-qa
    reason: Retrieval is not in the protocol; the snippet baseline is one of the paper's baselines,
      not the task.
capability:
  - knowledge-recall
capability_basis:
  knowledge-recall:
    reason: The protocol gives the question and its five options and nothing else, so the answer
      must come from what the system already holds; the paper frames the task as question answering
      with prior knowledge rather than from a given document.
    source: src-arxiv-1811-00937-v2
    quote: To investigate question answering with prior knowledge, we present
capability_considered_and_rejected:
  - term: causal-reasoning
    reason: Cause and effect is one skill in the paper's annotation of 100 development questions
      (23%), but those items ask for a likely cause or effect known from experience; none turns on
      an intervention or a confound.
  - term: spatial-reasoning
    reason: Spatial is the commonest annotated skill (41%) and AtLocation the commonest relation
      (47.3%), but the skill is defined as one concept appearing near another, a known association
      rather than a spatial relation inferred from a description.
  - term: deductive-reasoning
    reason: The answer is not decidable from stated premises; it needs world knowledge, which the
      term's inclusion test excludes.

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: The system picks one of five supplied options and is scored by accuracy; chance is 20%
    (33% in the three-option version 1.0).
  source: src-arxiv-1811-00937-v2
  quote: Nevertheless, this result is much higher than random (20%)
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The data ships with an 80% training split and the paper's protocol trains on it; its best
    baselines, BERT-large and GPT, are fine-tuned on CommonsenseQA, and the leaderboard's entries
    through 2023 are trained models (RoBERTa, ALBERT, T5, knowledge-graph hybrids).
  source: src-arxiv-1811-00937-v2
  quote: The middle part describes models that were trained on COMMONSENSEQA, where BERT-LARGE
    obtains best performance
designed_for_subjects_considered_and_rejected:
  - term: base-model
    reason: The paper's untrained baselines (LM1B, scored by language-model probability) are a
      minority and fall well below the trained ones; the protocol is built around the training
      split.
  - term: instruction-tuned-model
    reason: Prompted instruction-tuned models are how the benchmark is used now (observed_subjects),
      not what it was built for in 2018.
observed_subjects:
  values:
    - instruction-tuned-model
    - base-model
  basis: SMART filtering (NAACL 2025) scores 29 open models on the validation split,
    instruction-tuned versions where available and base checkpoints (Yi-34B, Mixtral-8x7B-v0.1,
    falcon-40b) beside them. inspect_evals and lm-evaluation-harness prompt a model with the
    question and five lettered options.
  source: src-acl-2025-naacl-long-235
as_used:
  - protocol: Accuracy on the public validation split (1,221 questions of version 1.11), because the
      test answers were never released.
    split: validation
    source: src-acl-2025-naacl-long-235
    quote: We used validation set as test set answers are not provided
    note: inspect_evals runs the same split for the same reason, and lm-evaluation-harness's task
      defines no test split (execution.harness_gotcha). The leaderboard ranked the test split.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument; SMART filtering (NAACL 2025) scores 29
    models on its validation split, and inspect_evals keeps an implementation, last changed on
    2026-02-16. The site and leaderboard went offline in 2025 and the repository was last pushed on
    2024-07-25 (GitHub API), which is maintenance and activity evidence, not lifecycle. saturated is
    derived, never hand-set; the evidence either way is in review_checks.
  source: src-acl-2025-naacl-long-235
  quote: we included CommonsenseQA, which offers 5-choice MCQA
activity: closed
activity_note: The Wayback index has the site page answering 200 until 2025-01-30 and 404 from
  2025-06-20, and the leaderboard page 404 from 2025-07-10; both returned 404 when read on
  2026-10-14, the domain no longer pointing at a site. The newest entry in the leaderboard's
  spreadsheet is dated 03/01/2023. No source announces an end.
activity_basis:
  reason: A route existed, predictions e-mailed to the authors and scored against the withheld test
    answers, with results listed on the leaderboard. Neither the page that set it out nor the
    leaderboard is online now, so no route is open.
  source: src-commonsenseqa-site
  quote: Please send predictions in OpenBookQA format

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: BERT-large, fine-tuned (the paper's baseline)
    source: src-arxiv-1811-00937-v2
    observed_on: 2026-10-14
    quote: The best baselines are BERT-LARGE and GPT with an accuracy of 55.9% and 45.5%
  - system: KEAR (single model)
    source: src-commonsenseqa-leaderboard-sheet
    observed_on: 2026-10-14
    quote: KEAR (single model),Microsoft Azure Cognitive Services Research,11/12/2021,,86.1
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The target concept the question's author wrote it for, kept only where one
  of two verifiers chose it; the test split's answers are held by the authors.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The leaderboard's numbers are test-split accuracies that only the authors could compute,
    since the test answers were never released. Validation accuracy, which is how the benchmark is
    reported now, anyone can compute.
  source: src-acl-2025-naacl-long-235
  quote: We used validation set as test set answers are not provided

task:
  exists: true
  input:
    - a natural-language question with five answer options, labelled A to E
  output: The label of one option.
  scoring: Accuracy, the proportion of questions answered correctly; the leaderboard ranks the
    random split's test set.
  source: src-arxiv-1811-00937-v2
  quote: We evaluate all models on the test set using accuracy

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The site linked train, development and answerless test files on Amazon S3, which
    still load (checked 2026-10-14), and the ungated Hugging Face copy holds the same three splits.
  access_basis:
    reason: The training and validation splits come with answers and the test questions without
      them; test scores came only from the authors.
    source: src-github-inspect-evals-commonsense-qa-readme
    quote: This eval runs the 1,221-question validation split; the test split's labels are not
      public
  refresh: versioned-releases
  refresh_basis:
    reason: The data changed once, under a version label. Version 1.0 (9,500 questions, three
      options) was discontinued for version 1.11 (12,102 questions, five options), each with its own
      leaderboard.
    source: src-commonsenseqa-leaderboard
    quote: Version 1.0 Random Split Leaderboard (9,500 examples with 3 answer choices, discontinued)
  data_provenance:
    - crowd-authored
    - curated-public-database
  data_provenance_note: Amazon Mechanical Turk workers wrote the questions and one distractor each,
    and a disjoint group verified them. The question concept, the answer and the other distractors
    are ConceptNet concepts, drawn from 236,208 filtered triplets over 22 relations.
  data_provenance_source: src-arxiv-1811-00937-v2
  data_provenance_quote: We used Amazon Mechanical Turk (AMT) workers to generate and validate
    commonsense questions
  contamination_risk: medium
  contamination_risk_note: The test answers were never released, but nearly every result now is on
    the validation split, whose questions and answers have been public since 2019 (on S3 and Hugging
    Face). A training route is plausible. SMART filtering's check found no contaminated validation
    items (contamination_evidence).
  contamination_evidence:
    - source: src-acl-2025-naacl-long-235
      stance: against
      quote: of the dataset was found to be data contaminated, while CommonsenseQA had none
  dataset_licence: MIT
  dataset_licence_note: Hugging Face's record for tau/commonsense_qa lists MIT. The paper, the site
    and the README state no licence, and GitHub reports none for the repository (API, read
    2026-10-14).
  dataset_licence_source: src-hf-api-commonsense-qa
  dataset_licence_quote: '"license":["mit"]'
  size:
    - count: 12102
      unit: questions with five options each (9,741 train, 1,221 validation, 1,140 test)
      subset: version 1.11, random split
      source: src-commonsenseqa-leaderboard
      quote: Version 1.11 Random Split Leaderboard (12,102 examples with 5 answer choices)
    - count: 12247
      unit: questions, as the paper counts them
      subset: the NAACL 2019 paper
      source: src-arxiv-1811-00937-v2
      quote: We create 12,247 questions through this procedure
    - count: 1221
      unit: validation questions with answers
      subset: version 1.11, random split
      source: src-hf-api-commonsense-qa
      quote: '"name":"validation","num_bytes":273848,"num_examples":1221'
    - count: 1140
      unit: test questions, answers withheld
      subset: version 1.11, random split
      source: src-hf-api-commonsense-qa
      quote: '"name":"test","num_bytes":257842,"num_examples":1140'
    - count: 9500
      unit: questions with three options each
      subset: version 1.0 (discontinued)
      source: src-arxiv-1811-00937-v1
      quote: Using our generation framework, we collect 9,500 commonsense natural language questions
  languages:
    - en
  submission_limit:
    max_submissions: 1
    period_days: 14
    per: entrant, on the test split
    source: src-commonsenseqa-site

training_data_eligibility_tiers:
  - id: without-conceptnet
    label: Accuracy
    rule: Entries that do not use ConceptNet, the knowledge graph the questions were built from. The
      site later accepted only these.
    source: src-commonsenseqa-site
  - id: with-conceptnet
    label: Accuracy with ConceptNet
    rule: Entries that use ConceptNet, ranked in a column of their own, because it can help rule out
      the worker-written distractor and so reduce a question to four options.
    source: src-commonsenseqa-leaderboard
training_data_eligibility_tiers_note: The spreadsheet's columns,
  "Model,Affiliation,Date,Accuracy,Accuracy with conceptnet" (src-commonsenseqa-leaderboard-sheet).
  The site's rule is "At this point we will not be accepting submissions that make use of ConceptNet
  to the leaderboard" (src-commonsenseqa-site); the leaderboard's footnote says such a model "may
  facilitate filtering the human generated distractor answer, potentially reducing the problem to a
  4-way multi-choice" (src-commonsenseqa-leaderboard).

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CommonsenseQA authors, Tel Aviv University's NLP group (with the Allen Institute
    for AI)
  maintainer_basis:
    reason: The site and leaderboard belong to the Tel Aviv University NLP group, the data sits in
      the tau organisation on Hugging Face, and the code in the second author's GitHub account.
      Three of the four authors also list the Allen Institute for AI.
    source: src-commonsenseqa-site
    quote: Tel-Aviv University Natural Language Processing Group
  maintainer_type: academic-lab
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: Entrants ran their systems on the released test questions and e-mailed
    the predictions, in the format of the OpenBookQA evaluator the site named, to two of the
    authors, who scored them against the withheld answers; test results could be evaluated once
    every two weeks. Listing needed a paper or a short anonymous report. Entries using ConceptNet
    were later refused. The route has been offline since mid-2025 (activity).
  submission_process_source: src-commonsenseqa-site
  submission_process_quote: we request a paper or short anonymous report of how you achieved this
    result
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-commonsenseqa-leaderboard-sheet
      quote: BERTLarge (single model),Tel-Aviv University,03/10/2019,56.7,
    - flag: funded-by-evaluated-party
      source: src-arxiv-1811-00937-v2
      quote: which was also supported by a Google PhD fellowship
    - flag: single-evaluator-private-test-set
      source: src-commonsenseqa-site
      quote: Test results may be evaluated once every two weeks
  independence_flags_note: The paper's baselines (BERT-large, GPT and two ESIM variants) sit on the
    board as Tel-Aviv University rows; they are baselines, not a system built for the board. The
    second author's PhD, of which the paper was part, was supported by a Google PhD fellowship, and
    Google's BERT is the paper's best baseline (T5 is on the board through AI2's entry). Three
    authors also list the Allen Institute for AI, whose Aristo team and AI2 Israel have entries. The
    authors held the test answers and scored every entry.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline is test-split accuracy, which only the authors could compute from the
      withheld answers, and their route is offline. Validation accuracy, which is what is reported
      now, anyone can compute.
    source: src-github-inspect-evals-commonsense-qa-readme
    quote: This eval runs the 1,221-question validation split; the test split's labels are not
      public
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness_availability_note: The repository holds the paper's ESIM and BERT baselines, and the site
    named an evaluator (the OpenBookQA one in allenai/aristo-leaderboard) as the format for
    submitted predictions; neither yields the official score, which needed the withheld answers.
  harness: jonathanherzig/commonsenseqa (the paper's baselines), with the evaluation script the site
    linked
  harness_source: src-github-commonsenseqa-readme
  harness_quote: which also has an evaluation script
  harness_gotcha:
    source: src-lm-eval-harness-commonsense-qa-task
    quote: 'validation_split: validation'
  harness_gotcha_note: lm-evaluation-harness defines no test split for the task, so its
    commonsense_qa score is validation accuracy, not the leaderboard's test accuracy.
  code_licence: null
  code_licence_note: GitHub reports no licence for jonathanherzig/commonsenseqa (API, read
    2026-10-14), and the README states none.
  runnable_via:
    - inspect
    - lm_eval
    - custom
  runnable_via_note: inspect_evals' commonsense_qa and lm-evaluation-harness's commonsense_qa both
    load the Hugging Face copy and score accuracy over the five options on its validation split, the
    original's metric on a different split; neither can score the test split, whose answers the copy
    lacks. custom is the repository's baseline code.
  runnable_via_source: src-github-inspect-evals-commonsense-qa-readme
  runnable_via_quote: uv run inspect eval inspect_evals/commonsense_qa
  inspect_evals_id: commonsense_qa
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the split (random or question token; the leaderboard's test set or the validation
  # set reported now) and the version (1.0's three options or 1.11's five); whether the system was fine-tuned on the
  # training split or prompted, and with how many examples; and whether it used ConceptNet, which the leaderboard
  # ranked in a column of its own.
  material_extra:
    - subset_used
    - training_data_policy
    - shots

homepage: https://www.tau-nlp.org/commonsenseqa
repository: https://github.com/jonathanherzig/commonsenseqa
dataset_url: https://huggingface.co/datasets/tau/commonsense_qa
leaderboard_url: https://www.tau-nlp.org/csqa-leaderboard

versions:
  - version: '1.0'
    label: CommonsenseQA 1.0, three answer choices
    version_kind: revision
    released: 2018-11-02
    items: 9500
    changes: The first release, described in arXiv v1. Each question had three candidates, the three
      target concepts, so chance was 33%.
    breaking: true
    superseded_by: '1.11'
    frozen: true
    sources:
      - src-arxiv-1811-00937-v1
      - src-commonsenseqa-leaderboard
  - version: '1.11'
    label: CommonsenseQA 1.11, five answer choices
    version_kind: revision
    items: 12102
    changes: Two distractors added to each question (one from ConceptNet, one written by the worker)
      for five options, and more questions (12,247 in the paper, 12,102 released). Described in
      arXiv v2 (2019-03-15); the leaderboard's baseline rows are dated 03/10/2019. Its release date
      is not stated.
    breaking: true
    supersedes_version: '1.0'
    frozen: true
    sources:
      - src-arxiv-1811-00937-v2
      - src-commonsenseqa-leaderboard
      - src-commonsenseqa-leaderboard-sheet

subsets:
  - id: commonsenseqa#random-split
    label: Random split (official)
    items: 12102
    scored_separately: true
    evidence:
      - source: src-arxiv-1811-00937-v2
        quote: Since the random split is harder, we consider it the primary split of COMMONSENSEQA
      - source: src-commonsenseqa-site
        quote: Rand Split (official split)
    notes: Questions split uniformly at random, 80/10/10 (9,741, 1,221 and 1,140 in version 1.11).
      The leaderboard ranks this split's test set, and the copies on S3 and Hugging Face are this
      split.
  - id: commonsenseqa#question-token-split
    label: Question token split (the paper's question concept split)
    scored_separately: true
    evidence:
      - source: src-arxiv-1811-00937-v2
        quote: 'We perform two types of splits: (a) random split'
      - source: src-arxiv-1811-00937-v2
        quote: 63.6% and 55.5%, respectively, on the question concept split
      - source: src-github-commonsenseqa-readme
        quote: should either be `rand` or `qtoken`
    notes: Train, development and test share no question concept. Trained models score higher on it
      (BERT-large 63.6% against 55.9%), which is why the paper makes the random split primary. It
      had no leaderboard, and its size was not read. The site and Hugging Face call it the question
      token split, the README `qtoken`.

history:
  - event: channel-closed
    field: governance.submission_process
    from: predictions e-mailed to the authors and scored on the withheld test answers, listed on
      tau-nlp.org
    source: src-commonsenseqa-site
    quote: Please send predictions in OpenBookQA format
    note: The route was read on the site's last capture (2025-01-30). The Wayback index has the site
      404 from 2025-06-20 and the leaderboard from 2025-07-10; no source dates or announces the
      closure, so the date is null.

tags:
  - commonsense
  - multiple-choice-qa
  - conceptnet
  - crowdsourced
  - leaderboard

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1811-00937-v2
    - src-arxiv-1811-00937-v1
    - src-arxiv-1811-00937
    - src-acl-n19-1421
    - src-github-commonsenseqa-readme
    - src-hf-api-commonsense-qa
    - src-commonsenseqa-site
    - src-commonsenseqa-leaderboard
    - src-commonsenseqa-leaderboard-sheet
    - src-github-inspect-evals-commonsense-qa-readme
    - src-lm-eval-harness-commonsense-qa-task
    - src-acl-2025-naacl-long-235
  sources_note: >
    The paper's v2 and v1 PDFs (DOIs, not archived) read as text, with windows that keep the authors'
    contact line out; the abstract page for the dates; the ACL Anthology page for the DOI, venue and award;
    the README at master; Hugging Face's API record; the site and leaderboard pages, read from their last
    Wayback captures because both now return 404, with scripts and styles stripped; the leaderboard's
    spreadsheet of entries as CSV; the inspect_evals task README at main and the lm-evaluation-harness
    task
    file at the pinned commit; and SMART filtering's NAACL 2025 PDF (a DOI) as evidence of current use.
  confidence: medium
  review_checks:
    - check: saturated is derived and not hand-set. Evidence for the derivation, either way. On the
        board, two ConceptNet entries pass the human row (CPACE ensemble 89.8 and KEAR ensemble 89.4
        against 88.9), while the best entry without ConceptNet is 82.2 (2023). SMART's best
        validation accuracy is 0.885 (Qwen2-72B-Instruct), and its authors read the original sets as
        not yet ready for retirement. Which column and which split the headroom should use is open.
      field: lifecycle
      source: src-commonsenseqa-leaderboard-sheet
      quote: CPACE (ensemble model),Anonymous,02/10/2022,,89.8
    - check: SMART's own reading of saturation, for the same derivation.
      field: lifecycle
      source: src-acl-2025-naacl-long-235
      quote: This indicates these datasets may not be ready for retirement yet, contrary to what
        leaderboards might suggest
    - check: activity closed rests on the site and leaderboard pages returning 404 (Wayback index
        from mid-2025, and on 2026-10-14), not on an announcement; the authors may still score
        e-mailed predictions. unknown is the alternative.
      field: activity
    - check: 'held-out-server for predictions e-mailed to the authors and scored against withheld answers,
        and publication-gated on "we request a paper or short anonymous report": check that a request
        worded so is a condition of listing, and that an anonymous report counts as one.'
      field: governance.submission_process
      source: src-commonsenseqa-site
      quote: we request a paper or short anonymous report of how you achieved this result
    - check: The independence flags. maintainer-competes rests on the paper's baseline rows (as
        RoboCasa's entry reads its baseline rows); funded-by-evaluated-party on a Google PhD
        fellowship supporting the second author's PhD rather than the benchmark; and
        single-evaluator-private-test-set on the authors scoring every entry, though entrants ran
        their own systems. The AI2 affiliation of three authors beside AI2's entries is in the note
        only.
      field: governance.independence_flags
    - check: Sizes disagree. The paper counts 12,247 questions; the leaderboard, the site and the
        Hugging Face copy 12,102 (9,741, 1,221 and 1,140). No source read explains the 145.
      field: data.size
    - check: The data licence, MIT, comes only from the Hugging Face record's metadata in the tau
        organisation; the paper, site and README state none.
      field: data.dataset_licence
      source: src-hf-api-commonsense-qa
      quote: '"license":["mit"]'
    - check: curated-public-database is assigned because each answer and three of its four
        distractors are ConceptNet concepts selected by filtering its triplets. ConceptNet is itself
        partly crowd-built; check it counts as a curated archive under the term.
      field: data.data_provenance

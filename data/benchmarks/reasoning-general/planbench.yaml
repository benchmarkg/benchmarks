  confidence: medium
  review_checks:
    - check: evaluation_method is constraint-check for the plans, since VAL validates a plan's
        properties against the action model and any failure invalidates it. VAL does step the plan
        through the model, so a reviewer could read that as running the artifact (execution-tests),
        though no code or tests are involved.
      field: evaluation_method

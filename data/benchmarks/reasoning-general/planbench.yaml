    - check: ground_truth_source is formal-verifier (VAL's verdict); simulation, for the symbolic
        execution of the plan, would also be defensible.
      field: ground_truth_source
    - check: base-model rests on the first version's evaluation of base GPT-3 Davinci and on the
        completion-style prompts; the NeurIPS version evaluates instruction-tuned models only.
      field: designed_for_subjects
      source: src-arxiv-2206-10498-v1
      quote: Initial evaluation results on the base version of GPT-3 (Davinci), showcase subpar
        performance on these benchmarks.
    - check: distribution-shift-generalization was rejected for the Mystery domains, which hold the
        task fixed and change only the names and are reported as their own condition. A reviewer may
        read them as a deliberate input shift; the deceptive variant's misleading words lean towards
        an adversarial construction.
      field: capability
    - check: refresh is versioned-releases on the strength of the dated arXiv versions. The Depots

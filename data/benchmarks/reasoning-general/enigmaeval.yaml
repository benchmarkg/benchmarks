curation:
  added_by: agent (P1-S11-T02)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2502-08859-v2
    - src-arxiv-2502-08859
    - src-scale-labs-enigmaeval-leaderboard
    - src-hf-api-enigmaeval
    - src-epoch-benchmarks-enigmaeval
    - src-epoch-benchmark-data
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its abstract page for the dates and the
    CC BY licence; Scale's leaderboard page with scripts and styles stripped (withheld from archiving:
    its acknowledgements name the puzzle authors); Hugging Face's API record of the gated dataset; Epoch's
    benchmark page; and Epoch's export for the EnigmaEval string. Not read: the dataset card and rows
    (gated), the paper's request form, the scale.com address of the board that the paper links, and the
    hunts' own archives.
  confidence: medium
  review_checks:
    - check: Domain. reasoning-general/puzzle-solving is primary on the paper's claim (creative,
        lateral reasoning, with a transcribed format to separate it from parsing) and the leaf's
        protocol rule, with multimodal/visual-qa secondary. The title calls the puzzles multimodal,
        Epoch says the benchmark evaluates multimodal reasoning, Hugging Face files it as visual
        question answering and 1,049 of 1,161 released puzzles carry images, so multimodal/visual-qa
        primary is the main alternative.
      field: domain
      source: src-arxiv-2502-08859-v2
      quote: for measuring continuing progress on multimodal reasoning
    - check: capability is abstraction alone. deductive-reasoning, which the paper claims in its
        abstract, was rejected because the puzzles lean on cultural knowledge, so correctness is not
        decidable from stated premises; perception was rejected for the raw-image format, where the
        paper shows OCR as a bottleneck for some models, and could be a capability_override on that
        subset.
      field: capability
    - check: data.access is gated-registration on the leaderboard's word that the release is the
        complete dataset; the card (gated) was not read to confirm that the answers are in it. If
        Scale's board still scores the paper's 1,184 puzzles, 23 of which are unreleased, the
        headline is private-test-server and reproducible_by_third_party false. The board's five rows
        were created before the release, and neither page says which set they were scored on.
      field: data.access
      source: src-scale-labs-enigmaeval-leaderboard
      quote: The complete dataset is available here.
    - check: contamination_risk medium against high. The official solutions are public online and
        the paper concedes pretraining exposure, and the set itself is public since July 2026; no
        source evidences training on it. Epoch says Scale marks post-release rows with contamination
        caveats, but the five rows read carry none.
      field: data.contamination_risk
      source: src-arxiv-2502-08859-v2
      quote: Many frontier models may have seen these during pretraining.
    - check: activity is unknown. The paper's request form is a route onto Scale's board
        (accepting-submissions if still open); the current page mentions none, which would make it
        no-submission-channel if the form has closed (that term needs a benchmark that never had a
        route, so closed may fit better).
      field: activity
    - check: versions treat the open release as a breaking revision of the paper's set (23 puzzles
        dropped, counts per split unstated). Epoch still describes 1,184 puzzles, so Epoch's series
        may mix the two sets without a pin.
      field: versions
      source: src-epoch-benchmarks-enigmaeval
      quote: EnigmaEval, created by Scale AI with the Center for AI Safety and MIT, evaluates
        long-form multimodal reasoning on 1,184 puzzles drawn from puzzle hunts.
    - check: dataset_licence is the MIT tag on the Hugging Face record, while the paper's puzzles
        carry their authors' Creative Commons terms, some non-commercial, or permission given to
        Scale. Which terms bind a user of the release needs the card, which was not read.
      field: data.dataset_licence
    - check: independence_flags is empty. Scale held the set and ran every evaluation until July
        2026 (single-evaluator-private-test-set for that period), and whether Scale sells data or
        evaluation services to the developers it ranks is not stated in any source read; neither was
        searched beyond these pages.
      field: governance.independence_flags
    - check: The leaderboard shows five rows only; the paper's models and Epoch's longer series are
        not on it. Epoch's export is the only record read of earlier board rows, and the mapping
        stanza leaves the unit of its uncertainty unsettled (standard error against 95% interval
        half-width).
      field: leaderboard_url
    - check: Personal data. The paper's acknowledgements, Figure 2 credits and Table 1, and the
        leaderboard's acknowledgements, name the individual puzzle writers and hunt organisers; the
        extracts leave them out and the leaderboard Source is withheld from archiving. A
        personal-account GitHub repository for the private set was found and not read.
      field: curation.sources

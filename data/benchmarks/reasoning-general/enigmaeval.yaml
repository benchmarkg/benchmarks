# data/benchmarks/reasoning-general/enigmaeval.yaml
#
# P1-S11-T02, reasoning-general entry 9. Promotes the Epoch stub data/benchmarks/_stubs/enigmaeval.yaml. Filled from
# the EnigmaEval paper, arXiv 2502.08859 read as its v2 PDF (2025-02-14), and its abstract page; Scale AI's EnigmaEval
# leaderboard page on labs.scale.com (scripts and styles stripped), which announces the open-source release of
# 2026-07-23; Hugging Face's API record of ScaleAI/EnigmaEval (the dataset is gated, so its card and data were not
# read); Epoch AI's EnigmaEval benchmark page; and Epoch's benchmark export (src-epoch-benchmark-data, already on
# main). Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
# No puzzle, solution or puzzle author is quoted: the paper's acknowledgements, figure credits and Table 1, and the
# leaderboard's acknowledgements, name the individual puzzle writers and hunt organisers, and the windows leave
# them out.
#
# Placement: the paper's title and most of its items are multimodal, but its claim is creative, lateral reasoning
# on posed puzzles, and it builds a human-transcribed format to separate that reasoning from document parsing. A
# posed puzzle with one submitted answer is reasoning-general/puzzle-solving under the leaf's protocol rule; the
# image-text crossing is recorded as multimodal/visual-qa, secondary (review_checks).

id: enigmaeval
name: EnigmaEval
tagline: Scale AI's 1,184 puzzle-hunt puzzles in text and images, each answered with a word or
  phrase; 1,161 public since 2026.
description: >
  Scale AI's benchmark of puzzles from eight online puzzle hunts and puzzle events, from beginner pub
  events to the MIT Mystery Hunt, written with the Center for AI Safety and MIT. Each puzzle comes without
  instructions: the solver must work out what kind of puzzle it is and chain many steps of wordplay, logic,
  mathematics and cultural reference, and the answer is a word or short phrase (sometimes a pair or a
  list). Most puzzles need images such as grids, diagrams and pictures; puzzles needing audio, video,
  interaction with a web page or a physical presence were excluded. Each puzzle is given in two formats,
  the original pages as images and a human transcription into text with the images attached, so that a
  failure of reasoning can be told apart from a failure to parse the document. The 2025 paper's set has
  1,184 puzzles, 949 normal and 235 hard (five or more non-trivial steps with little verification), with
  77 meta-puzzles in the normal split that are given the answers of their component puzzles. An answer
  is extracted from the response's final "Answer:" line and string-matched to the official solution; accuracy
  is reported per split in the paper, and as one pass@1 accuracy with a 95% confidence interval on Scale's
  leaderboard. At release o1 solved 7.0% of the normal split and no model solved a hard puzzle; the leaderboard's
  best row in November 2026 is 39.28%. The set was kept private, with Scale evaluating models itself,
  until an open-source version with 23 fewer puzzles (1,161) was released on Hugging Face on 2026-07-23.
  The puzzles' official solutions have always been public on the hunts' own sites. Epoch AI reproduces
  the leaderboard's combined accuracy.
self_description:
  source: src-arxiv-2502-08859
  quote: We introduce EnigmaEval, a dataset of problems and solutions derived from puzzle
    competitions and events that probes models' ability to perform implicit knowledge synthesis and
    multi-step deductive reasoning.
external_ids:
  epoch: EnigmaEval
  huggingface: ScaleAI/EnigmaEval
  arxiv: '2502.08859'
paper:
  title: 'EnigmaEval: A Benchmark of Long Multimodal Reasoning Challenges'
  arxiv: '2502.08859'
  doi: 10.48550/arXiv.2502.08859
  version_read: v2
  source: src-arxiv-2502-08859-v2
released: 2025-02-13
released_note: The paper's first arXiv version, as its abstract page dates it, and the date Epoch's
  export and the stub carry. v2 followed on 2025-02-14. No venue is stated in the sources read.
released_source: src-arxiv-2502-08859
released_quote: Submitted on 13 Feb 2025 (v1), last revised 14 Feb 2025 (this version, v2)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: reasoning-general/puzzle-solving
  secondary:
    - multimodal/visual-qa
domain_note: multimodal/visual-qa is secondary, not primary. 1,049 of the 1,161 released puzzles
  (847 with one image, 202 with several) carry images, the paper's title calls the puzzles
  multimodal and Hugging Face files the set under visual question answering, but the scored quantity
  is the puzzle's answer rather than an image-text correspondence, and the human transcriptions are
  built to separate reasoning from document parsing (review_checks).
domain_basis:
  reason: Each item is a posed puzzle answered once with a word or phrase, with no environment
    responding, which is the puzzle-solving leaf's protocol. The benchmark's own claim is creative,
    lateral reasoning on unstructured puzzles, set against knowledge benchmarks, and its transcribed
    format exists to measure that reasoning apart from parsing. Most items need an image beside the
    text, which multimodal/visual-qa records as secondary.
  source: src-arxiv-2502-08859-v2
  quote: While HLE probes structured academic knowledge, ENIGMAEVAL tests the integration of
    reasoning capabilities in creative problem-solving scenarios.
domain_source: src-arxiv-2502-08859-v2
domain_quote: This design choice enable us to distinguish between performance limitations we observe
  stem from
domain_considered_and_rejected:
  - term: games-planning/puzzle-games
    reason: The protocol decides. A puzzle is posed and one answer submitted; puzzles that need
      interaction with a web page were excluded, and nothing responds to the solver.
    source: src-arxiv-2502-08859-v2
    quote: we excluded puzzles that rely on these modalities, as well as those requiring interaction
      with a web application
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: Puzzles draw on many fields of knowledge, but the paper contrasts itself with Humanity's
      Last Exam's academic breadth, and no subject structure is scored.
  - term: reasoning-general/logical-deduction
    reason: The paper claims multi-step deductive reasoning, but the steps turn on wordplay,
      cultural references and hidden mechanisms the solver has to discover; puzzle-solving is the
      narrower leaf for posed puzzles.
capability:
  - abstraction
capability_basis:
  abstraction:
    reason: The puzzles state no rule or task. The solver must first find the way to see the puzzle
      (the hidden mechanism linking its clues) before any answer is available, which is the term's
      test; the paper puts the difficulty there rather than in recall or calculation.
    source: src-arxiv-2502-08859-v2
    quote: Notably, they come without explicit instructions, forcing solvers to explore multiple
      creative approaches at each step
capability_considered_and_rejected:
  - term: deductive-reasoning
    reason: The paper claims multi-step deductive reasoning, but the term's test needs correctness
      decidable from the stated premises alone, and the puzzles appeal to cultural references and
      world knowledge (review_checks).
    source: src-arxiv-2502-08859
    quote: We introduce EnigmaEval, a dataset of problems and solutions derived from puzzle
      competitions and events that probes models' ability to perform implicit knowledge synthesis
      and multi-step deductive reasoning.
  - term: knowledge-recall
    reason: Answering needs background knowledge (the implicit knowledge synthesis of the claim),
      but on the way to a scored answer that is derived, not recalled; the term's exclusion.
  - term: perception
    reason: Most puzzles are images, and the raw-image format leaves models to read the pages, but
      the score is the puzzle's answer, not what was recovered from the image; the transcribed
      format is built to take parsing out (review_checks).
    source: src-arxiv-2502-08859-v2
    quote: model performance could drop dramatically from the transcribed puzzles to their original
      PDF versions
  - term: abductive-reasoning
    reason: A solver settles on the mechanism that best explains the clues, but the score is the
      final answer, not the explanation chosen.
  - term: creativity-novelty
    reason: The paper calls the reasoning creative, but scoring rewards matching the official
      answer, not departure from known solutions.
  - term: analogical-reasoning
    reason: Some puzzle mechanics recur across puzzles, but no item scores a mapping between two
      presented situations.

evaluation_method:
  - exact-match
evaluation_method_note: The answer is taken from the response's final "Answer:" line in one of three
  formats fixed by annotation (one word or phrase, a pair, or a comma-separated list, every element
  needing to be right). The sources read do not say how the string match treats case, spacing or
  punctuation.
evaluation_method_basis:
  reason: Each extracted answer is compared with the official solution by string matching, right or
    wrong, with no partial credit.
  source: src-arxiv-2502-08859-v2
  quote: We evaluate models by comparing their answers to ground-truth solutions through string
    matching.
evaluation_method_considered_and_rejected:
  - term: model-graded-judge
    reason: o1 reviewed correct answers for plagiarism of the official walkthroughs, an audit after
      scoring whose flags were all found false on manual inspection; it does not set any score.
    source: src-arxiv-2502-08859-v2
    quote: We used O1 to audit its own correct model-generated answers to check for plagiarism
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The prompts are chat system and user prompts with images attached, and the paper evaluates
    API-served vision-language models (o1, GPT-4o, Gemini 2.0, Claude 3.5 Sonnet and Claude 3 Opus,
    Pixtral Large, Llama 3.2 90B Vision) at their default temperature.
  source: src-arxiv-2502-08859-v2
  quote: We run the evaluation on a range of leading LLMs with multimodal capabilities.
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: o1 and Gemini 2.0 Flash Thinking are among the paper's models and every current
      leaderboard row is a reasoning model, but the design sets no reasoning budget
      (observed_subjects).
  - term: tool-augmented-model
    reason: No tool is given. The paper warns that a model with web search could find a puzzle's
      published solution by its name, a route the protocol leaves out rather than one it measures.
    source: src-arxiv-2502-08859-v2
    quote: Models with web search capabilities could also solve the puzzle by searching the name of
      the puzzle.
observed_subjects:
  values:
    - reasoning-model
  basis: All five rows on Scale's leaderboard read on 2026-11-09 carry a reasoning-effort suffix
    (high or xhigh), and Epoch maps such settings to model versions as separate entries.
  source: src-scale-labs-enigmaeval-leaderboard
as_used:
  - protocol: Epoch reproduces Scale's leaderboard numbers as one combined accuracy over all
      puzzles, keeping the confidence-interval half-width in its export, with each thinking mode or
      reasoning effort mapped as its own entry; the paper reports the normal and hard splits
      separately.
    source: src-epoch-benchmarks-enigmaeval
    quote: Our chart reports the combined accuracy across all puzzles, scored by exact match of the
      final answer
    note: Epoch's page still gives 1,184 puzzles; Scale's page now describes the 1,161 of the open
      release. Which set the board's rows were scored on is not stated (review_checks).

lifecycle: active
lifecycle_basis:
  reason: Scale's leaderboard ranks 2026 models, its rows created between November 2025 and March
    2026 (the page data), Scale released an open-source version in July 2026, and Epoch tracks the
    board. The headline is far from saturated (39.28% at the top).
  source: src-scale-labs-enigmaeval-leaderboard
  quote: 3 gemini-3.1-pro-preview-high 36.78± 2.71
activity: unknown
activity_note: The paper invites developers to request an evaluation through a form, which would be
  a route onto Scale's board; the leaderboard page read in November 2026 mentions no such route, and
  all its rows are Scale's runs. Whether the route is open now is not shown, so the field abstains
  (review_checks).
activity_source: src-arxiv-2502-08859-v2
activity_quote: To request that your model be evaluated on ENIGMAEVAL, please fill out this form.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: o1 (o1-2024-12-17)
    source: src-arxiv-2502-08859-v2
    observed_on: 2026-11-09
    quote: with even the leading model (O1) only reaching 7.0% on the normal split and 0% on the
      hard split
  - system: claude-fable-5-high
    source: src-scale-labs-enigmaeval-leaderboard
    observed_on: 2026-11-09
    quote: 1 claude-fable-5-high 39.28± 2.80
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The official answer from each puzzle's own solution page, copied by
  annotators, validated by hand, tagged with its answer format and checked by separate reviewers.
  The answers were never secret in the wider sense, since the hunts publish their solutions.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Since 2026-07-23 the 1,161 released puzzles can be downloaded after a click-through gate,
    and the paper prints its prompts and answer formats, so a third party can run and score a model.
  source: src-scale-labs-enigmaeval-leaderboard
  quote: The complete dataset is available here.
  caveat: No scoring code is published, the paper's 1,184-puzzle set is not, and the string-matching
    rules are unstated, so a third-party number need not equal Scale's. Before the release only
    Scale could score a model.

task:
  exists: true
  input:
    - one puzzle, either as images of its original PDF pages (or a full-page screenshot of a web
      puzzle), or as a human transcription in text with [image_N] placeholders and the images
      attached
    - a system prompt of general puzzle-solving tips (indexing, acrostics, alphanumeric codes and
      the like), expanded for the MIT Mystery Hunt and trimmed for text-only puzzles
    - for a meta-puzzle, the correct answers of the puzzles it draws on
  output: A step-by-step solution ending in a line "Answer:" with a word or short phrase, a pair, or
    a comma-separated list.
  scoring: The extracted answer is string-matched to the official solution, 1 or 0 per puzzle.
    Accuracy is reported per split (normal, hard) and per input format in the paper, averaged over
    three runs, and as one pass@1 accuracy with a 95% confidence interval on the leaderboard.
  source: src-arxiv-2502-08859-v2
  quote: The puzzle may not have specific instructions, but you know that the answer to the puzzle
    is a word or short phrase

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: >
    Since 2026-07-23 the open-source version, 1,161 puzzles, is on Hugging Face as ScaleAI/EnigmaEval
    behind an automatic click-through gate; Scale's page calls it the complete dataset. The card and the
    data were not read, so that the answers are included rests on that wording. Until then the benchmark
    was private and Scale ran every evaluation (history). The 23 puzzles of the paper's set that are not
    in the release are not public; if Scale's board still scores the 1,184, its headline is private-test-server
    (review_checks).
  access_basis:
    reason: The released set, answers included on the leaderboard's own wording, sits behind Hugging
      Face's automatic gate, which needs an account and acceptance of terms.
    source: src-hf-api-enigmaeval
    quote: '"lastModified":"2026-07-23T17:05:45.000Z","private":false,"gated":"auto"'
  refresh: versioned-releases
  refresh_note: Two states, both dated. The paper's private set of February 2025 and the open
    release of 2026-07-23, which drops 23 puzzles (versions). No source read reports any other
    change.
  refresh_basis:
    reason: The one change to the items is carried by a dated announcement that states it.
    source: src-scale-labs-enigmaeval-leaderboard
    quote: Note that the paper predates the open-source dataset, which contains 23 fewer puzzles.
  data_provenance:
    - web-scraped
  data_provenance_note: The puzzles were written by puzzle constructors and hunt teams for their own
    events and taken from the events' online archives, restricted to Creative Commons puzzles or
    those whose authors consented. Human annotators then transcribed each into the text-image format
    and copied its official answer, under a process Scale AI curated, with a separate review.
  data_provenance_basis:
    reason: The puzzles were harvested from public archives, not written for the benchmark.
    source: src-arxiv-2502-08859-v2
    quote: We scraped puzzles from online archives in their original format
  contamination_risk: medium
  contamination_risk_note: >
    The puzzles and their step-by-step official solutions have been public on the hunts' sites since each
    event, and the paper concedes that models may have seen them in pretraining; since July 2026 the structured
    set is public too, a release the paper itself said could enable memorisation. The paper's audit of
    o1's correct answers found no plagiarism, and scores at release were low. Epoch says Scale marks rows
    evaluated after release with contamination caveats, but the five rows on the board read carry an empty
    contamination message. A route is plausible and conceded, and no source evidences that any model trained
    on these puzzles, so medium rather than high (review_checks).
  contamination_evidence:
    - source: src-arxiv-2502-08859-v2
      stance: supports
      quote: The puzzles in this benchmark have publicly accessible step-by-step solutions online.
    - source: src-arxiv-2502-08859-v2
      stance: supports
      quote: However, our structured dataset release could enable solution memorization.
    - source: src-epoch-benchmarks-enigmaeval
      stance: supports
      quote: and marks those rows with contamination caveats on the leaderboard
    - source: src-arxiv-2502-08859-v2
      stance: against
      quote: We used O1 to audit its own correct model-generated answers to check for plagiarism
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: The headline is the share of puzzles solved, bounded at 100%, and
    Epoch's export gives a score ceiling of 1.0. The paper says models fall far short of experienced
    human puzzle hunters but publishes no measured human score.
  ceiling_anchor_type_source: src-arxiv-2502-08859-v2
  ceiling_anchor_type_quote: falling far short of experienced human puzzle hunters
  dataset_licence: MIT
  dataset_licence_note: The licence tag on Hugging Face's record of the release. The paper takes
    only puzzles under Creative Commons licences (non-commercial ones among them) or used with their
    authors' consent, so whether an MIT tag can cover the puzzles themselves is doubtful
    (upstream_licences; review_checks).
  dataset_licence_source: src-hf-api-enigmaeval
  dataset_licence_quote: '"tags":["task_categories:visual-question-answering","language:en","license:mit"'
  upstream_licences: Each puzzle's own terms, a Creative Commons licence or the consent its author
    gave Scale; the paper credits the licences beside the authors' names, which are not quoted here.
  upstream_licences_source: src-arxiv-2502-08859-v2
  upstream_licences_quote: We restricted our benchmark to puzzles for which we obtained explicit
    consent from the authors or that were released under Creative Commons (CC) licenses.
  size:
    - count: 1161
      unit: puzzles
      subset: the open-source release of 2026-07-23
      source: src-scale-labs-enigmaeval-leaderboard
      quote: EnigmaEval comprises 1161 puzzles collected from eight diverse sources
    - count: 1184
      unit: puzzles
      subset: the paper's set (February 2025)
      source: src-arxiv-2502-08859-v2
      quote: ENIGMAEVAL comprises 1184 puzzles, represented in two formats
    - count: 949
      unit: puzzles
      subset: Normal, the paper's set
      source: src-arxiv-2502-08859-v2
      quote: Split (N) Normal (949) Hard (235)
    - count: 235
      unit: puzzles
      subset: Hard, the paper's set
      source: src-arxiv-2502-08859-v2
      quote: Split (N) Normal (949) Hard (235)
    - count: 77
      unit: meta-puzzles
      subset: Meta-puzzles, within Normal
      source: src-arxiv-2502-08859-v2
      quote: After filtering, our dataset contains 77 meta-puzzles, all in the normal split.
    - count: 112
      unit: puzzles with no image (847 with one image, 202 with several)
      subset: the open-source release
      source: src-hf-api-enigmaeval
      quote: non-image\n112\n\n\nsingle-image\n847\n\n\nmulti-image\n202\n\n\ntotal\n1161
  size_note: The paper breaks the 1,184 down by eight puzzle sources and two splits; no source read
    gives the normal and hard counts of the 1,161 released, or which 23 puzzles were dropped.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Scale AI (with the Center for AI Safety, a co-author)
  maintainer_basis:
    reason: Scale AI curated the data, holds the released dataset under its Hugging Face
      organisation and runs the leaderboard. The paper was written with authors from the Center for
      AI Safety and MIT, which hold none of the benchmark's artefacts in the sources read.
    source: src-hf-api-enigmaeval
    quote: '"id":"ScaleAI/EnigmaEval","author":"ScaleAI"'
  maintainer_type: industry-lab
  submission_process:
    - maintainer-run
  submission_process_note: Scale chooses the models, runs them and ranks them by confidence
    interval; the paper also offered developers a request form (activity). Since the release anyone
    can run the set, but no route onto the board for outside results is stated.
  submission_process_source: src-arxiv-2502-08859-v2
  submission_process_quote: we keep the benchmark private and will continuously update it with the
    leading frontier models
  independence_flags: []
  independence_flags_note: None set. No Scale or Center for AI Safety model is on the board read, no
    source read names a funder, and no source read says Scale was paid for any evaluation, so
    evaluator-sells-evaluations is not set. Until 2026-07-23 Scale alone held the set and ran every
    evaluation, the pattern single-evaluator-private-test-set names; the release ended that, unless
    the board still scores the 23 unreleased puzzles (review_checks).
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2502-08859-v2
    quote: Models with web search capabilities could also solve the puzzle by searching the name of
      the puzzle.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is inference on hosted vision-language models over every puzzle, three times in
      the paper; string matching runs on ordinary hardware.
    source: src-arxiv-2502-08859-v2
    quote: 'OpenAI: o1-2024-12-17, gpt-4o-2024-11-20'
  reproducibility_tier: null
  reproducibility_tier_note: Since the release a run is automatic end to end once the dataset is
    downloaded, which reads as fully-automatable, but no implementation is published (the blocker
    below) and 02 S11 forbids that tier beside it, so the tier abstains as MusicCaps and LIT-PCBA
    do. Before the release it was not-independently-reproducible.
  reproducibility_blockers:
    - no-reference-implementation
  reproducibility_blockers_note: The paper prints the system prompt, the user prompt and its
    variants, the answer formats and the plagiarism-audit prompt, but not the answer extraction or
    the string-matching rules; each user rebuilds them from prose.
  harness_availability: none
  harness: null
  harness_note: Neither the paper, the leaderboard page nor Hugging Face's record links any code. A
    repository on an individual's GitHub account that describes itself as EnigmaEval code for the
    private dataset was found by search, is linked from no source read and was not read.
  code_licence: null
  code_licence_note: No code is published.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # (exact-match, instruction-tuned-model) and (exact-match, reasoning-model) resolve to llm-static-text. Beyond it:
  # the prompt template (Scale's tips, varied by source and format), sampling (the paper's default temperature),
  # the number of runs (three in the paper, pass@1 on the board) and the evaluation date, since rows evaluated
  # after release may meet published solutions. subset_used carries the split, the input format (raw images or
  # transcription) and the puzzle set (the paper's 1,184 or the release's 1,161).
  material_extra:
    - prompt_template_hash
    - sampling
    - n_samples
    - date_evaluated

aggregation_policy: official-aggregate
aggregation_policy_note: The paper reports normal and hard accuracy separately and per input format;
  the leaderboard ranks one accuracy with a 95% confidence interval, which Epoch reads as the
  combined accuracy across all puzzles.
aggregation_policy_basis:
  reason: Each puzzle scores 1 or 0, and the board's headline is the share solved.
  source: src-scale-labs-enigmaeval-leaderboard
  quote: Model performance is measured using accuracy (pass@1) with a 95% confidence interval.
homepage: https://labs.scale.com/leaderboard/enigma_eval
repository: null
dataset_url: https://huggingface.co/datasets/ScaleAI/EnigmaEval

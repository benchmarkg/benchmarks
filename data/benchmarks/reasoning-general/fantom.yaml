# data/benchmarks/reasoning-general/fantom.yaml
#
# P1-S11-T01, reasoning-general entry 6 of 6. Filled from the FANToM paper, arXiv 2310.15421 read as its v3 PDF
# (2023-10-31, EMNLP 2023), and its abstract page; the paper's ACL Anthology page (scripts and styles stripped); the
# project page at hyunw.kim/fantom (scripts and styles stripped); the repository README at main, its evaluation
# script (eval_fantom.py) and its data loader (task/dataset_loader.py); and the v1 PDF of Jev-ToM (arXiv 2610.18610,
# October 2026), a paper that reports FANToM results. GitHub's API (licence, pushed_at, commit history), the Hugging
# Face API record of the scoring model, the released data file and the inspect_evals registry were read beside them
# and are not quoted Sources. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.

id: fantom
name: FANToM
tagline: Theory of mind in conversations that characters leave and rejoin, scored for consistency
  across six question types.
description: >
  An English benchmark of 256 small-talk conversations generated by language models, in which
  characters leave and later rejoin while the others keep talking, so a returning character has
  missed information that the model, reading the whole transcript, has seen. About 10,000
  questions are built from fact questions about that missed information. Belief questions ask
  what the absent character thinks, as free text scored by sentence-embedding distance to the
  character's belief and to the omniscient one (BeliefQ[Dist.]) or as a choice between the two
  (BeliefQ[Choice]). Answerability and information-access questions ask who knows the answer or
  the information, as a list of characters or as yes or no per character. All the question types
  demand the same reasoning, who is aware of what, and the headline All* score counts an
  information piece only when all six ToM question types about it are answered correctly; All
  drops the free-text belief question and is the one humans were measured on (87.5). Inputs are
  the short section around the absence or the full conversation. The maintainers' README ranks
  2024 models by All* on short inputs, all of them at 0.8 or below, and reports a control task
  without information asymmetry beside it.
self_description:
  source: src-arxiv-2310-15421-v3
  quote: a new benchmark designed to stress-test ToM within information-asymmetric conversational
    contexts via question answering
external_ids:
  arxiv: '2310.15421'
paper:
  title: 'FANToM: A Benchmark for Stress-testing Machine Theory of Mind in Interactions'
  arxiv: '2310.15421'
  doi: 10.18653/v1/2023.emnlp-main.890
  version_read: v3
  source: src-arxiv-2310-15421-v3
released: 2023-10-24
released_note: The paper's first arXiv version, as its abstract page dates it. The code and data
  reached the repository on 2023-11-27 (GitHub's commit history, "Update FANToM"; before it the
  README said "TBU"), and the data file on AI2's bucket carries the same Last-Modified day.
released_source: src-arxiv-2310-15421
released_quote: Submitted on 24 Oct 2023
release_venue: EMNLP 2023, main conference (pages 14397-14413)
release_venue_source: src-acl-2023-emnlp-main-890
release_venue_quote: 'Volume: Proceedings of the 2023 Conference on Empirical Methods in Natural Language
  Processing'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: reasoning-general/theory-of-mind
  secondary:
    - language/understanding
domain_basis:
  reason: The paper's object of study is machine theory of mind, the family's own example of a
    reasoning form studied in its own right, and every ToM question asks about a character's beliefs
    or knowledge, the leaf's definition. The fact questions are reading comprehension of the
    supplied conversation, which the paper reads as basic comprehension, the secondary leaf.
  source: src-arxiv-2310-15421-v3
  quote: In this work, we introduce FANTOM, an English benchmark for stress-testing machine ToM
domain_considered_and_rejected:
  - term: language/dialogue
    reason: The items are conversations, but the model never takes part in one; it reads a finished
      transcript as an observer and answers one question about it.
    source: src-arxiv-2310-15421-v3
    quote: they act as omniscient observers during our evaluation since we provide the entire
      conversation as input
  - term: games-planning/multi-agent-social
    reason: Social dynamics are the subject, but nothing is played; there are no moves, opponents or
      outcomes.
  - term: agents-tooluse/multi-agent-coordination
    reason: The characters are generated text, not agents under evaluation, and no coordination is
      scored.
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: The conversation is supplied with every question and decides every answer, and a correct
      belief answer must use only the part of it the absent character witnessed, which is how the
      benchmark separates the model's view from the character's.
    source: src-arxiv-2310-15421-v3
    quote: Each question is provided to the model along with the conversation as input.
capability_considered_and_rejected:
  - term: reliability-consistency
    reason: All* and All score consistency, but across different question types about the same
      information piece, not the identical item repeated over trials, which the term requires (the
      video-mme-v2 near miss).
    source: src-arxiv-2310-15421-v3
    quote: we report the ALL* score which requires the models to answer all six ToM question types
  - term: memory-retention
    reason: Full inputs are longer than short ones and scores drop, but the paper puts the drop down
      to finding the relevant part of the conversation, and the short input holds only that part;
      length alone is excluded.
    source: src-arxiv-2310-15421-v3
    quote: this indicates theory of mind reasoning becomes even more challenging for models when it
      needs to be combined with different types of reasoning (e.g., search)
  - term: deductive-reasoning
    reason: Who knows what follows from who was present, but only with the unstated premise that an
      absent character heard nothing, and the free-text answers are judged by embedding distance,
      not checked against premises. No source frames the task as entailment.
  - term: communication
    reason: No message is sent to a recipient; the model answers questions about a finished
      transcript.
  - term: adversarial-robustness
    reason: Wrong belief answers are written to overlap the context more than right ones, a trap for
      shortcut matching built into the items, but no attacker chooses inputs against a system.

evaluation_method:
  - multiple-choice
  - exact-match
  - model-derived-metric
  - classification-metric
  - reference-metric
  - composite
evaluation_method_note: BeliefQ[Choice] is a choice between two statements, and the yes-or-no
  questions are binary, so chance is 50% on each. The free-response scorer is
  sentence-transformers/all-roberta-large-v1, which eval_fantom.py loads by name with no revision
  pinned; the Hub record is at revision cf74d8a, last modified 2025-03-06 (Hugging Face API, read
  2026-10-14; not a quoted Source), so a run today may not use the scorer behind the paper's or the
  README's numbers. List answers are checked by whether each aware character's name appears in the
  response and no unaware character's does; yes or no is parsed by pattern matching.
evaluation_method_basis:
  reason: Each question type has its own method. BeliefQ[Choice] is a two-way choice. List and
    yes-or-no questions are right or wrong against the stored characters, with no partial marks, and
    the yes-or-no columns are reported as weighted F1. BeliefQ[Dist.] is right when a sentence
    embedding of the response is closer to the character-centric answer than to the omniscient one,
    and token F1 against the reference is reported for it and for FactQ. All* and All combine the
    per-question verdicts of the different types into one all-correct rate per information piece.
  source: src-arxiv-2310-15421-v3
  quote: We use cosine similarity to measure the distance between SentenceBERT (Reimers and
    Gurevych, 2019) embeddings of each option and response.
evaluation_method_source: src-github-fantom-eval-script
evaluation_method_quote: SentenceTransformer('sentence-transformers/all-roberta-large-v1')
evaluation_method_considered_and_rejected:
  - term: model-graded-judge
    reason: The free-response scorer is a sentence-embedding model whose cosine similarities are
      compared; no model is prompted for a verdict.
  - term: constraint-check
    reason: The list check asserts names present and absent, but against the stored answer for that
      item, which is a reference comparison rather than a validity battery.
    source: src-arxiv-2310-15421-v3
    quote: A correct response must include all characters who have access to the answer or
      information while excluding all characters who do not.

designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The paper prompts instruction-tuned models once per question with a fixed instruction, and
    the README's table ranks chat models (GPT-4o, Gemini, Llama-3, Claude 3).
  source: src-arxiv-2310-15421-v3
  quote: We test a total of thirteen recent instruction-tuned neural language models
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The paper fine-tunes Flan-T5-XL on a topic split, but as an analysis; the benchmark is
      not meant for training.
    source: src-arxiv-2310-15421-v3
    quote: Although our benchmark is not meant for training, we also fine-tune Flan-T5-XL
  - term: reasoning-model
    reason: Zero-shot chain of thought is a run condition the paper reports beside plain prompting,
      not a reasoning budget the benchmark is built around.
as_used:
  - protocol: Short-context FANToM's discrete-answer questions only, each posed alone as a choice
      among candidates and scored by strict accuracy, averaged equally with eight other ToM
      benchmarks. No All*, All or free-response scoring.
    split: short context, discrete questions
    source: src-arxiv-2610-18610-v1
    quote: discrete FANToM, English ToMBench, and the ToMi subset accompanying SimToM
    note: Jev-ToM (HKUST, 13 October 2026) compares five typed decision models with seven generative
      models, GPT-5.6-Luna and DeepSeek-V4-Flash among them. Its Table 5 counts 1,805 FANToM
      questions, 1,446 on knowledge access, 227 on beliefs and 132 native controls.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced; a paper of 13 October 2026 scores twelve models on FANToM
    among nine ToM benchmarks. The repository was last pushed on 2024-05-31 (GitHub API), which is
    maintenance evidence, not lifecycle.
  source: src-arxiv-2610-18610-v1
  quote: 'Table 10 removes 920 native controls: 600 BigToM, 132 FANToM, 30 Hi-ToM, and 158 ToMi questions.'
activity: no-submission-channel
activity_basis:
  reason: The README's results table holds the maintainers' own runs of newer models, and no source
    describes a way for anyone else to enter one; other results appear in their authors' papers.
  source: src-github-fantom-readme
  quote: We report evaluation results for newer models on the `short` conversation inputs.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4o-2024-05-13
    source: src-github-fantom-readme
    observed_on: 2026-10-14
    quote: GPT-4o-2024-05-13 | 0.8 | 2.0
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Stored answers (the characters who know each piece of information, and the
  two belief statements per question), generated with GPT-4 and checked by crowdworkers. They are
  public, not withheld. For BeliefQ[Dist.] a released embedding model decides which stored answer a
  response is nearer.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The data, the evaluation script and the scoring model are public, and a run needs no human
    step.
  source: src-github-fantom-readme
  quote: python eval_fantom.py --model gpt-4-0613

task:
  exists: true
  input:
    - a multi-party conversation in which a character left and rejoined, either the short section
      around the absence or the full conversation
    - one question about a fact, an absent character's belief, or which characters know an answer or
      a piece of information
  output: A free-text answer (FactQ, BeliefQ[Dist.]), a choice between two belief statements
    (BeliefQ[Choice]), a list of characters (the two list questions), or yes or no for one character
    (the two binary questions).
  scoring: Per question type as in evaluation_method; the headline All* is the share of question
    sets (by default, one per information piece) with all six ToM question types correct, and All
    leaves out BeliefQ[Dist.]. The control task, on information every character heard, is scored the
    same way and reported separately.
  source: src-arxiv-2310-15421-v3
  quote: Each question is provided to the model along with the conversation as input.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The evaluation script downloads the whole set, answers included, from a public bucket of
      the Allen Institute for AI with no account; the README only asks that it be used for
      evaluation.
    source: src-github-fantom-dataset-loader
    quote: url='https://storage.googleapis.com/ai2-mosaic-public/projects/fantom/fantom.tar.gz'
  refresh: static
  refresh_basis:
    reason: One data file (fantom_v1.json, version 1.0), pinned by hash in the loader and unchanged
      since its upload on 2023-11-27 (the bucket's Last-Modified header). The 2024 commits added
      models and changed how All and All* are computed for the control task only (GitHub's commit
      history, not a quoted Source).
    source: src-github-fantom-dataset-loader
    quote: expected_hash='1d08dfa0ea474c7f83b9bc7e3a7b466eab25194043489dd618b4c5223e1253a4'
  data_provenance:
    - model-generated
  data_provenance_note: The paper has InstructGPT davinci-003 write the conversations and GPT-4
    extract the missed information, write the fact questions and both answers, and turn them into
    belief questions and statements. Crowdworkers on Mechanical Turk then checked every conversation
    and the BeliefQ[Choice] answers, and question sets they marked wrong (about 8.6%) were removed.
    The README's disclaimer says the conversations were generated by GPT-4.
  data_provenance_source: src-arxiv-2310-15421-v3
  data_provenance_quote: we automatically construct full conversations using the large language
    model (LLM) InstructGPT davinci-003
  contamination_risk: medium
  contamination_risk_note: The whole set, answers included, has been public since November 2023 and
    carries no canary string (the released file read 2026-10-14). The only measure the sources state
    is a request not to train on it, in the README and the paper. The paper itself fine-tuned
    Flan-T5-XL on a topic split, so a training route is plausible; no source evidences one for a
    model that reports results.
  contamination_risk_source: src-github-fantom-readme
  contamination_risk_quote: The samples in FANToM should only be used for evaluation purposes.
  contamination_evidence: []
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_basis:
    reason: The human anchor is pooled accuracy of computer-science graduate students (11
      volunteers, 32 question sets, one person per set), given the same instructions as the models.
      Theory of mind needs no specialist knowledge, so they count as non-specialists. They answered
      BeliefQ[Choice] and the two list questions, so the anchor is All (87.5); All* has none.
    source: src-arxiv-2310-15421-v3
    quote: We also measure human performance by asking graduate students in computer science.
  dataset_licence: MIT
  dataset_licence_note: No licence text comes with the data. The tarball holds only fantom_v1.json,
    the README states no licence, and GitHub's licence metadata for the repository reports MIT (read
    2026-10-14). Jev-ToM reads FANToM as MIT. The README adds that the samples are for evaluation
    only.
  dataset_licence_source: src-arxiv-2610-18610-v1
  dataset_licence_quote: BigToM, ToMBench, FANToM, CogToM, and SimToM use MIT licences
  size:
    - count: 256
      unit: conversations, with about 10,000 questions
      source: src-arxiv-2310-15421-v3
      quote: FANTOM consists of 10K questions covering 256 multiparty conversations around a certain
        topic
    - count: 1415
      unit: questions of each belief type (BeliefQ[Dist.] and BeliefQ[Choice])
      subset: belief questions
      source: src-arxiv-2310-15421-v3
      quote: Statistics FANTOM is composed of 256 conversations with 1,415 BELIEFQ[DIST.]s and
        BELIEFQ[CHOICE]s, 703 FACTQs, ANSWERABILITY Q[LIST]s, and INFOACCESS Q[LIST]s, respectively.
    - count: 703
      unit: questions of each of FactQ, AnswerabilityQ[List] and InfoAccessQ[List]
      subset: fact and list questions
      source: src-arxiv-2310-15421-v3
      quote: Statistics FANTOM is composed of 256 conversations with 1,415 BELIEFQ[DIST.]s and
        BELIEFQ[CHOICE]s, 703 FACTQs, ANSWERABILITY Q[LIST]s, and INFOACCESS Q[LIST]s, respectively.
    - count: 2689
      unit: questions of each binary type (AnswerabilityQ[Y/N] and InfoAccessQ[Y/N])
      subset: yes-or-no questions
      source: src-arxiv-2310-15421-v3
      quote: Additionally, there are 2,689 ANSWERABILITY Q[Y/N]s and INFOACCESS Q[Y/N]s.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The FANToM authors at the Allen Institute for AI (Hyunwoo Kim's repository; the data
    on AI2's bucket)
  maintainer_basis:
    reason: The data file, the benchmark proper, is served from AI2's public bucket, and the first,
      fourth, sixth and last authors are at AI2. The code repository and the project page sit on the
      first author's personal accounts.
    source: src-github-fantom-dataset-loader
    quote: ai2-mosaic-public/projects/fantom/fantom.tar.gz
  maintainer_type: nonprofit
  maintainer_type_note: individual was considered, since the repository (skywalker023/fantom) and
    the site (hyunw.kim) are the first author's own, but the data sits in an AI2 bucket, so the
    term's test, dataset and repository in one person's account, does not hold. The Allen Institute
    for AI is a single nonprofit research institute; no source read states its legal form.
  submission_process:
    - maintainer-run
  submission_process_note: The paper's thirteen models and the README's sixteen (results added in
    May 2024) were chosen and run by the maintainers. No route for outside entries is described.
  submission_process_source: src-github-fantom-readme
  submission_process_quote: We report evaluation results for newer models on the `short`
    conversation inputs.
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-arxiv-2310-15421-v3
      quote: Lastly, we also thank OpenAI, as well as Google Cloud Compute.
  independence_flags_note: The acknowledgement, after the grants, thanks OpenAI and Google Cloud
    Compute without saying what they gave; read as API access and compute. OpenAI's models (GPT-4,
    ChatGPT, InstructGPT) and Google's (Flan-T5, Flan-UL2; Gemini and Gemma in the README) are
    evaluated, and OpenAI models also generated the data. The maintainers' own fine-tuned Flan-T5-XL
    appears only in the paper's analysis, not in the README table, so
    maintainer-competes-on-own-benchmark is not set. The scoring model comes from
    sentence-transformers, which has no evaluated system.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The README's rows are mostly API-served models, and the only other model in a run, the
      RoBERTa-large embedding scorer, runs on a GPU if there is one and otherwise on the CPU.
    source: src-github-fantom-eval-script
    quote: self.device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Data, evaluation script and scorer are public, and every score is computed by code.
    source: src-github-fantom-readme
    quote: python eval_fantom.py --model gpt-4-0613
  harness_availability: official-harness
  harness: fantom (eval_fantom.py, with model wrappers under agents/)
  harness_note: UK AISI's inspect_evals has no FANToM task (its src/inspect_evals/_registry.py at
    main, read 2026-10-14; not a quoted Source).
  harness_source: src-github-fantom-readme
  harness_quote: python eval_fantom.py --model gpt-4-0613
  harness_gotcha:
    source: src-github-fantom-eval-script
    quote: Currently, the default conversation-input-type is 'short' and the ALL scores are
      aggregated for each set of questions
  harness_gotcha_note: The script's defaults are the easiest setting. Full inputs and aggregating
    All and All* per conversation part or per whole conversation (--conversation-input-type,
    --aggregation-target) lower the score, so a number means little without both.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for skywalker023/fantom (read 2026-10-14); the README
    states no licence. Not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the profiles the facets resolve to (the scoring model is material there as judge_model): the
  # harness settings that change what is scored, the conversation input (short or full) and the All*
  # aggregation target (set, part or conversation). Which question types and whether the control task
  # was included go in subset_used.
  material_extra:
    - harness

homepage: https://hyunw.kim/fantom/
repository: https://github.com/skywalker023/fantom
dataset_url: https://storage.googleapis.com/ai2-mosaic-public/projects/fantom/fantom.tar.gz

subsets:
  - id: fantom#belief-choice
    label: BeliefQ[Choice]
    items: 1415
    notes: A choice between the character-centric and the omniscient belief statement; chance is
      50%.
  - id: fantom#belief-dist
    label: BeliefQ[Dist.] (free response)
    items: 1415
    evidence:
      - source: src-github-fantom-eval-script
        quote: SentenceTransformer('sentence-transformers/all-roberta-large-v1')
    notes: Right when the response's embedding is nearer the character-centric statement; token F1
      over the right answers is reported beside it.
  - id: fantom#answerability
    label: All AnswerabilityQ
    evidence:
      - source: src-fantom-site
        quote: (1) BeliefQ (choice and free-response types), (2) AnswerabilityQ (list and binary
          types), and (3) InfoAccessQ (list and binary types).
    notes: Both answerability types right for the same information piece.
  - id: fantom#answerability-list
    label: AnswerabilityQ[List]
    parent: fantom#answerability
    items: 703
  - id: fantom#answerability-yn
    label: AnswerabilityQ[Y/N]
    parent: fantom#answerability
    items: 2689
    notes: Reported as weighted F1.
  - id: fantom#infoaccess
    label: All Info-AccessQ
    notes: Both information-access types right for the same information piece.
  - id: fantom#infoaccess-list
    label: InfoAccessQ[List]
    parent: fantom#infoaccess
    items: 703
  - id: fantom#infoaccess-yn
    label: InfoAccessQ[Y/N]
    parent: fantom#infoaccess
    items: 2689
    notes: Reported as weighted F1.
  - id: fantom#fact
    label: FactQ
    items: 703
    notes: Token F1 against the full fact answer; outside All* and All.
  - id: fantom#control
    label: Control task
    evidence:
      - source: src-github-fantom-readme
        quote: which consists of conversations without information asymmetry (i.e., task without
          false belief)
      - source: src-github-fantom-readme
        quote: Please ensure that the performance on the control task remains stable when testing
          your method or model.
    notes: Questions on information every character heard, scored with the same metrics and reported
      in a table of its own; not in the paper.

tags:
  - theory-of-mind
  - false-belief
  - multi-party-conversation
  - consistency
  - question-answering

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2310-15421-v3
    - src-arxiv-2310-15421
    - src-acl-2023-emnlp-main-890
    - src-fantom-site
    - src-github-fantom-readme
    - src-github-fantom-eval-script
    - src-github-fantom-dataset-loader
    - src-arxiv-2610-18610-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text; its abstract page for the date; the ACL
    Anthology page (a DOI) for the venue; the project page with scripts and styles stripped; the README,
    the evaluation script and the data loader at main; and Jev-ToM's v1 PDF (a DOI) as evidence of
    current use.
  confidence: medium
  review_checks:
    - check: The paper's counts (256 conversations, 1,415 belief, 703 fact and list, 2,689 yes-or-no
        questions) may not describe the released data. The file read on 2026-10-14 (fantom_v1.json,
        uploaded 2023-11-27, a month after v3) holds 870 question sets over 253 conversation ids and
        1,540 belief questions, 547 of them the control task's (not a quoted Source). Confirm
        whether data.size and the subsets' items should take the release's counts.
      field: data.size
    - check: 'composite: All* and All are all-correct rates over per-question verdicts from different
        methods (two-way choice, embedding distance, list and yes-or-no checks), read here as one aggregate.
        Whether a conjunction counts as a combination of sub-scores.'
      field: evaluation_method
      source: src-github-fantom-readme
      quote: The models are ranked according to the `All*` score and then the `All` score
    - check: funded-by-evaluated-party rests on an acknowledgement that thanks OpenAI and Google
        Cloud Compute without saying what was given.
      field: governance.independence_flags
      source: src-arxiv-2310-15421-v3
      quote: Lastly, we also thank OpenAI, as well as Google Cloud Compute.
    - check: maintainer_type nonprofit (AI2 holds the data) or individual (the repository and site
        are the first author's own accounts).
      field: governance.maintainer_type
    - check: language/understanding as a secondary rests on FactQ, which is reported but outside
        All* and All.
      field: domain.secondary
      source: src-arxiv-2310-15421-v3
      quote: basic comprehension capability for interactions
    - check: The paper says InstructGPT davinci-003 wrote the conversations; the README's disclaimer
        says GPT-4. data_provenance follows the paper.
      field: data.data_provenance
      source: src-github-fantom-readme
      quote: These multi-party conversations were generated by GPT-4 and they were validated by
        humans.
    - check: dataset_licence MIT rests on the repository's licence metadata and a third-party paper;
        the data file carries no licence text.

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2406-09170-v1
    - src-arxiv-2406-09170
    - src-iclr-2025-test-of-time
    - src-hf-api-tot
    - src-hf-tot-readme
    - src-hf-datasets-server-tot-size
    - src-arxiv-2602-13530-v3
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date; the ICLR
    2025 camera-ready PDF from proceedings.iclr.cc for the venue, the evaluation procedure and the
    added models (withheld from archiving: its first page gives the corresponding authors' e-mail
    addresses); Hugging Face's API record of the dataset, its card at main and the dataset viewer's
    size record; and REMem's v3 PDF (a DOI, not archived) as evidence of current use.
  confidence: medium
  review_checks:
    - check: mathematics/arithmetic as a secondary domain on ToT-Arithmetic. The paper treats time
        arithmetic as one of the two skills of temporal reasoning, and mathematics excludes
        arithmetic incidental to a question about another field; of its seven categories, Compare,
        Schedule, Timezone and Trick are not all calculation.
      field: domain
      source: src-arxiv-2406-09170-v1
      quote: ToT-Arithmetic, a crowd-sourced task, assesses the ability to perform calculations
        involving time points and durations.
    - check: data_provenance. crowd-authored rests on the paper calling ToT-Arithmetic crowd-sourced
        (15 annotators proposed problems), while the datasheet says the data collection was done
        solely by the authors. curated-public-database rests on the AWE graphs, Wikidata ego-nets
        that are one seventh of ToT-Semantic.
      field: data.data_provenance
      source: src-arxiv-2406-09170-v1
      quote: We presented our seed set to 15 annotators
    - check: deductive-reasoning was rejected, while CLadder's entry in this family assigns it on
        similar grounds (answers decidable from stated premises alone). Consistency across the
        family.
      field: capability
    - check: reproducibility_tier is null. A run needs no human, simulator or maintainer step, but
        no code is published, and 02 S11 bars fully-automatable beside no-reference-implementation.
      field: execution.reproducibility_tier
    - check: The dataset card swaps the two tasks' sizes (1,850 Semantic, 2,800 Arithmetic), and the
        arXiv version's datasheet also gives 2,800 for ToT-Arithmetic and calls the 2,800-question
        Semantic set a sample of the 46,480 (the ICLR version has no datasheet). The entry follows
        Section 3 and the dataset viewer's row counts.
      field: data.size
      source: src-hf-tot-readme
      quote: Measuring the semantics and logic of time understanding. Contains 1,850 examples in
        total.
    - check: maintainer_type industry-lab although the data sits in a personal Hugging Face account;
        and whether funded-by-evaluated-party belongs beside maintainer-competes-on-own-benchmark

    notes: The Hugging Face config tot_semantic. Eight question types of 350 each, over seven graph
      generators (400 each) and five fact orders (560 each).
  - id: test-of-time#tot-arithmetic
    label: ToT-Arithmetic
    items: 1850
    scored_separately: true
    domain_override:
      primary: reasoning-general/temporal-reasoning

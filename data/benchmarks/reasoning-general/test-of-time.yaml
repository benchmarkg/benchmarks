subsets_note: >
  The paper reports each task's accuracy by question type (Tables 5 and 8 of v1), so the eight
  ToT-Semantic types and seven ToT-Arithmetic categories are listed under their task. The Semantic
  counts follow from generating 10 questions per graph generator, question type and fact order; the
  Arithmetic counts are the paper's sampled numbers. The dataset viewer's column statistics agree
  (read 2026-10-14; not a quoted Source). Graph generator and fact order are further cuts of
  ToT-Semantic that the paper also reports, and are not listed.


    capability_override:
      - temporal-reasoning
      - context-integration
    evidence:
      - source: src-arxiv-2406-09170-v1
        quote: ToT-Semantic, a synthetic task, focuses on temporal semantics and logic
      - source: src-hf-datasets-server-tot-size

  sources_note: >
    The chimechallenge.org pages were read with scripts and styles stripped. Four of them (the MCoRec
    and ECHI task pages, which list their organisers, and the CHiME-8 DASR task page, which gives an organiser's
    personal e-mail address) are withheld from archiving; the rest carry only the series' generic mailbox,
    outside the extracts. The two PDFs and the arXiv abstract pages are DOI sources. The ECHI dataset's
    Hugging Face record was read through the public API without requesting access.
  confidence: medium
  review_checks:
    - check: Identity. One entry spans ten editions that change task type. CHiME-1 to CHiME-4 score
        recognition of single-speaker read speech in noise, CHiME-5 to CHiME-8 score transcription
        and diarisation of real conversations, and from CHiME-7 the tasks are proposed by separate
        teams; CHiME-9's ECHI and all three announced CHiME-10 tasks are enhancement or extraction,
        not recognition. The one-entry call follows the shared name and Steering Group, but CHiME-1
        to CHiME-4 and the post-CHiME-7 task sets are far apart.
      field: versions
      source: src-arxiv-2507-18161-v2
      quote: The early CHiME challenges, up to CHiME-4, focused on single-speaker scenarios under
        controlled conditions with synthetic data.
    - check: NOTSOFAR-1 (Microsoft, its own name, paper, datasets and development leaderboard) and
        URGENT (a speech-enhancement challenge that is CHiME-10's Task 2) are hosted tasks with
        identities of their own. They are modelled as CHiME tasks here; either could be its own
        benchmark linked by lineage, which would need an id from the lead.
      field: subsets
      source: src-chimechallenge-chime8-task2
      quote: we at Microsoft are excited to release two datasets for the benefit of the wider
        research community
    - check: Overlap with dihard and voxsrc. CHiME-6 Track 2 is modelled on DIHARD II's multichannel
        diarisation track, and CHiME-6 to CHiME-8 report DER as DIHARD and the VoxSRC diarisation
        track do. The diarisation halves here are scored jointly with recognition
        (speaker-attributed WER), not as a diarisation ranking, so no lineage link is recorded; a
        correlates_with link may suit once dihard is curated.
      field: domain
      source: src-chimechallenge-chime6-overview
      quote: Track 1 is a rerun of CHiME-5 and Track 2 is similar to the
    - check: The primary domain is speech-recognition because recognition runs through CHiME-1 to
        CHiME-9. If CHiME-10 runs as announced, the series' current tasks are all enhancement and
        extraction, and a reviewer may prefer speaker-tasks or a speech-enhancement leaf as primary
        from then on.
      field: domain
      source: src-chimechallenge-chime10
      quote: A unified speech enhancement system integrating universal speech enhancement, target
        speaker extraction, and acoustic echo cancellation for realistic conversational scenarios.
    - check: Speech enhancement (UDASE, URGENT, the noise-suppression half of ECHI) has no
        audio-speech leaf; a bench tag-gap record proposes one. ECHI is given speaker-tasks because
        it extracts each partner's speech, which is speaker separation.
      field: domain.secondary
    - check: execution_mode is automated for the family, but UDASE and ECHI were ranked by listening
        panels (P.835 ratings and listener transcriptions from 32 native English speakers). The
        panels are tagged human-crowd-eval because no domain qualification is required; they are
        recruited and run by the organisers in a listening booth, not on a crowd platform.
      field: evaluation_method
      source: src-chimechallenge-chime9-task2-results
      quote: A panel of 32 native English speakers was recruited.
    - check: activity round-scheduled rests on CHiME-10's dated opening (4 February 2027); its
        deadline and workshop are TBC, and between-rounds would hold if the opening slips.
      field: activity
      source: src-chimechallenge-chime10-dates
      quote: 4 Feb 2027 Challenge opening
    - check: data.access is train-open-test-held-out from the CHiME-9 round. Whether MCoRec's and
        ECHI's evaluation references are now released was not established (the ECHI dataset on
        Hugging Face has a test split behind its data use agreement, which was not requested). Old
        editions differ, CHiME-5's transcripts being open under CC BY-SA.
      field: data.access
      source: src-hf-api-chime9-echi
      quote: Submission of a signed Data Use Agreement
    - check: publication-gated rests on MCoRec's rule that participants submit a system description;
        whether a report conditions the ranking in the other CHiME-8 and CHiME-9 tasks was not
        checked.
      field: governance.submission_process
      source: src-chimechallenge-chime9-task1-rules
      quote: Participants must submit a system description with details about their submitted
        system.
    - check: Independence was not assessed. Industry runs or funds several tasks (Microsoft for
        NOTSOFAR-1, Meta and WS Audiology for ECHI, Meta's Aria glasses for MMCSG), and the entrant
        lists were not checked against the organisers' companies.
      field: governance.independence_flags
      source: src-arxiv-2609-26306-v1
      quote: This work was also supported by WS Audiology and Meta.
    - check: released is null. CHiME-1's schedule page and the overview papers of CHiME-1 to CHiME-4
        (Computer Speech and Language and ICASSP/ASRU) were not read, so the editions before CHiME-7
        carry no dates.
      field: released
  personal_data_excluded:

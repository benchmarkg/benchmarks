  - version: '8'
    label: CHiME-8
    version_kind: edition
    released: 2024-02-01
    changes: Three tasks, DASR (NOTSOFAR-1 added as a fourth scenario, an LLM track, no
      oracle-diarisation track), NOTSOFAR-1 (single-device office meetings, single- and
      multi-channel tracks) and MMCSG (streaming transcription of smart-glasses conversations); ran
      to 17 July 2024.
    breaking: true
    supersedes_version: '7'
    superseded_by: '9'
    frozen: true
    sources:
      - src-chimechallenge-chime8
      - src-chimechallenge-chime8-task1
      - src-chimechallenge-chime8-task2
      - src-chimechallenge-chime8-task3
      - src-arxiv-2407-16447
      - src-arxiv-2401-08887
      - src-arxiv-2507-18161-v2
  - version: '9'
    label: CHiME-9
    version_kind: edition
    released: 2025-07-01
    changes: Two tasks, MCoRec (audio-visual transcription and conversation clustering of up to four
      parallel conversations from one 360-degree camera) and ECHI (low-latency enhancement of
      conversation partners for hearing-aid and smart-glasses wearers, ranked by listening tests);
      ran to 6 February 2026, results in May 2026.
    breaking: true
    supersedes_version: '8'
    frozen: true
    sources:
      - src-chimechallenge-chime9
      - src-chimechallenge-chime9-task1
      - src-chimechallenge-chime9-task2
      - src-arxiv-2609-26306-v1
versions_note: CHiME-10 (ECHI-2, URGENT and SG-TSE) is announced and opens on 4 February 2027; it is
  not yet a version because nothing of it is released. The years of CHiME-2 to CHiME-6 are not dated
  by the pages read.

subsets:
  - id: chime#9-mcorec
    label: CHiME-9 Task 1, MCoRec (Multi-Modal Context-aware Recognition)
    items: 320
    scored_separately: true
    evidence:
      - source: src-chimechallenge-chime9-task1
        quote: Up to 8 active speakers divided into up to 4 simultaneous conversations
      - source: src-chimechallenge-chime9-task1-results
        quote: which combines WER and clustering errors as the primary metric for ranking
    notes: From one 360-degree video and its single-channel audio, transcribe each target speaker
      and group the speakers into conversations; ranked by a joint error of per-speaker WER and
      pairwise clustering F1. Items are the evaluation set's speakers.
  - id: chime#9-echi
    label: CHiME-9 Task 2, ECHI (Enhancing Conversations to address Hearing Impairment)
    scored_separately: true
    domain_override:
      primary: audio-speech/speaker-tasks
    evidence:
      - source: src-chimechallenge-chime9-task2
        quote: Your goal is to produce a single-channel audio stream for each conversational
          partner.
      - source: src-chimechallenge-chime9-task2-results
        quote: The final score used for ranking is a combination of the intelligibility score and
          the OVRL score.
    notes: Extract each conversation partner's speech from multichannel recordings in simulated
      cafeteria noise, causally within 20 ms; ranked by listening tests, in two device tracks ranked
      separately. 12 systems from 7 teams.
  - id: chime#9-echi-aria
    label: CHiME-9 ECHI, Aria glasses track
    parent: chime#9-echi
    scored_separately: true
    evidence:
      - source: src-arxiv-2609-26306-v1
        quote: This paper reviews submissions from seven teams and ranks them on a combination of
          subjective intelligibility and quality.
    notes: Seven-channel audio from Meta Aria glasses worn by one participant.
  - id: chime#9-echi-ha
    label: CHiME-9 ECHI, hearing-aid track
    parent: chime#9-echi
    scored_separately: true
    evidence:
      - source: src-arxiv-2609-26306-v1
        quote: This paper reviews submissions from seven teams and ranks them on a combination of
          subjective intelligibility and quality.
    notes: Four-channel audio from a pair of hearing-aid shells worn by another participant.
  - id: chime#8-dasr
    label: CHiME-8 Task 1, DASR (distant ASR with multiple devices in diverse scenarios)
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-recognition
      secondary:
        - audio-speech/speaker-tasks
    evidence:
      - source: src-chimechallenge-chime8-task1
        quote: This task features 4 highly diverse core datasets/scenarios on which performance will
          be evaluated
      - source: src-chimechallenge-chime8-task1
        quote: This Task has two tracks which differ only by the type of external language models
          (LM) allowed.
    notes: Joint diarisation and transcription of CHiME-6, DiPCo, Mixer 6 Speech and NOTSOFAR-1
      meetings by one array-agnostic system, ranked by macro tcpWER; constrained and unconstrained
      (LLM) language-model tracks.
  - id: chime#8-notsofar
    label: CHiME-8 Task 2, NOTSOFAR-1 (distant meeting transcription with a single device)
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-recognition
      secondary:
        - audio-speech/speaker-tasks
    evidence:
      - source: src-chimechallenge-chime8-task2
        quote: In each track, systems will be ranked according to the speaker-attributed tcpWER
          metric
      - source: src-arxiv-2401-08887
        quote: We introduce the first Natural Office Talkers in Settings of Far-field Audio
          Recordings
    notes: Microsoft's office-meeting task, in single-channel and known-geometry multi-channel
      tracks ranked separately by tcpWER; its meetings are also DASR's fourth scenario.
  - id: chime#8-mmcsg
    label: CHiME-8 Task 3, MMCSG (ASR for multimodal conversations in smart glasses)
    scored_separately: true
    evidence:
      - source: src-chimechallenge-chime8-task3
        quote: The goal is to obtain speaker-attributed transcriptions in streaming fashion, using
          audio, video, and IMU input modalities.
    notes: Two-person conversations recorded on Aria glasses, transcribed in streaming fashion for
      the wearer and the partner.
  - id: chime#7-dasr
    label: CHiME-7 Task 1, DASR
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-recognition
      secondary:
        - audio-speech/speaker-tasks
    evidence:
      - source: src-chimechallenge-chime7-task1
        quote: The final ranking will be obtained via speaker-attributed word error rate (SA-WER)
          macro-averaged across the three datasets
    notes: CHiME-6, DiPCo and Mixer 6 Speech scenarios; a main track and an oracle-segmentation
      sub-track, both inherited from CHiME-6.
  - id: chime#7-udase
    label: CHiME-7 Task 2, UDASE (unsupervised domain adaptation for conversational speech
      enhancement)
    scored_separately: true
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-chimechallenge-chime7-task2
        quote: The task consists of denoising conversational speech recordings using out-of-domain
          labeled data and in-domain unlabeled data.
      - source: src-chimechallenge-chime7-task2
        quote: The final ranking of the systems will be based on the results of the listening tests.
    notes: Single-microphone noise suppression adapted to unlabelled CHiME-5 recordings; no
      audio-speech leaf covers speech enhancement, so the subset carries no domain_override (logged
      with bench tag-gap).
subsets_note: >
  The subsets are the tasks of the three latest completed editions, CHiME-7 to CHiME-9; earlier editions'
  tracks are described in versions. NOTSOFAR-1's two tracks are described in its notes rather than as
  children. Subsets without an override keep the family's domain and capabilities.

history:

# data/benchmarks/audio-speech/chime.yaml
#
# P1-S7-T04, audio-speech entry 14. Filled from the CHiME series' site, chimechallenge.org (scripts and styles
# stripped; it serves no robots.txt): the home page; the CHiME-10 page, its schedule and its call for task
# proposals; the CHiME-9 page, the MCoRec task, rules and results pages and the ECHI task and results pages; the
# CHiME-8 page, the DASR task and results pages and the NOTSOFAR and MMCSG task pages; the CHiME-7 page and its
# DASR and UDASE task pages; the CHiME-6 task overview; the CHiME-4 and CHiME-3 overviews; the CHiME-2 and CHiME-1
# introductions; and the CHiME-5 and CHiME-6 dataset pages. Also the organisers' review of CHiME-7 and CHiME-8
# DASR (arXiv 2507.18161, v2 PDF) and the CHiME-9 ECHI overview (arXiv 2609.26306, v1 PDF); the abstract pages of
# the CHiME-5, CHiME-6, CHiME-7 DASR, CHiME-8 DASR, NOTSOFAR-1 and CHiME-7 UDASE papers; the README of the
# chime-utils scoring toolkit at a pinned commit; Hugging Face's API record of the ECHI dataset (read without
# requesting access); and two 2026 abstract pages, a CHiME-9 MCoRec system description (arXiv 2604.27436) and a
# paper evaluated on CHiME-4 data (arXiv 2610.05155). GitHub's metadata for the chimechallenge organisation's
# repositories was read and is not a quoted Source. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# The entry is the series as one family: CHiME-1 (2011) to CHiME-9 (2025-2026) are editions in versions, and the
# tasks of the three latest editions are subsets. CHiME-10 is announced (opening 4 February 2027) and is recorded
# in activity, not yet as a version. The series has no overview paper of its own, so `paper` is left empty. The
# tables of the results pages are filled by script and were not read; only their prose is quoted.

id: chime
name: CHiME Challenge
aliases:
  - CHiME Speech Separation and Recognition Challenge
  - Computational Hearing in Multisource Environments
  - PASCAL CHiME Speech Separation and Recognition Challenge
tagline: 'Distant-microphone speech challenges since 2011: keywords in noise, meeting transcription, conversation
  enhancement.'
description: >
  The CHiME challenges (Computational Hearing in Multisource Environments) and their workshops on speech
  processing in everyday environments, run since 2011. The first four editions scored recognition of single-speaker
  read speech in noise: keywords in Grid utterances mixed binaurally with recorded living-room noise (CHiME-1,
  2011, as the PASCAL CHiME challenge), the same in harder mixing conditions or with a larger vocabulary
  (CHiME-2), and Wall Street Journal prompts read into a six-microphone tablet in cafés, street junctions,
  buses and pedestrian areas (CHiME-3 and CHiME-4). CHiME-5 and CHiME-6 moved to conversational speech
  recorded in twenty real dinner parties with Kinect arrays, and CHiME-6 added joint diarisation and recognition.
  Since CHiME-7 each edition is a set of independent tasks run by separate teams within the CHiME Steering
  Group's schedule: distant meeting transcription across scenarios and array types (DASR, 2023 and 2024),
  NOTSOFAR-1's single-device office meetings and MMCSG's smart-glasses conversations (2024), unsupervised
  domain adaptation for speech enhancement (UDASE, 2023), audio-visual transcription of parallel conversations
  (MCoRec, 2025-2026) and enhancement of conversations for hearing-aid and smart-glasses wearers (ECHI,
  2025-2026), the last two ranked partly or wholly by listening tests. Teams receive training and development
  data, run their systems on evaluation audio without references and submit outputs that each task's organisers
  score. CHiME-10, announced in July 2026, has three enhancement and extraction tasks and opens on 4 February
  2027.
self_description:
  source: src-chimechallenge-chime10-cfp
  quote: CHiME is a challenge series whose purpose is to advance scientific research in the field of
    distant-microphone conversational speech processing.
released: null
released_note: The first edition ran in 2011 as the PASCAL CHiME Speech Separation and Recognition
  Challenge, with a satellite workshop at Interspeech 2011. Its schedule page was not read, so no
  day is given.
release_venue: Interspeech 2011 (satellite workshop)
release_venue_source: src-chimechallenge-chime2-introduction
release_venue_quote: One year ago, we organised the 2011 PASCAL CHiME Speech Separation and
  Recognition Challenge

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speech-recognition
  secondary:
    - audio-speech/speaker-tasks
  per_edition: true
  per_edition_note: >
    Speech recognition is scored in every edition from CHiME-1 to CHiME-9. Speaker diarisation is scored
    from CHiME-6 (Track 2) through CHiME-7 and CHiME-8 DASR and NOTSOFAR-1, and target-speaker extraction
    in CHiME-9 ECHI and CHiME-10's SG-TSE, both under speaker-tasks. CHiME-7 UDASE and CHiME-10 URGENT
    score speech enhancement (noise suppression), which has no leaf (logged with bench tag-gap). The CHiME-9
    and CHiME-8 tasks carry their own domains in subsets.
domain_basis:
  reason: Recognising distant, noisy speech is the series' one continuous line. CHiME-1 to CHiME-4
    scored recognition of read speech in noise, CHiME-5 to CHiME-8 scored transcription of
    conversations, and CHiME-9's MCoRec scores per-speaker word error rate. Diarisation and speaker
    extraction are the secondary leaf, the scored half of several recent tasks.
  source: src-arxiv-1803-10609
  quote: The CHiME challenge series aims to advance robust automatic speech recognition (ASR)
    technology
domain_considered_and_rejected:
  - term: multimodal/audio-language
    reason: Transcription is speech to text, which the audio-speech family's own leaf takes; no task
      scores a correspondence between audio and language beyond the transcript.
  - term: multimodal/video-language
    reason: MCoRec and MMCSG take video (and MMCSG motion sensors) as extra input, but the score is
      still word error rate and clustering of speakers; nothing scores the video's relation to
      language.
capability:
  - perception
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: Every task takes recorded audio and scores what was recovered from it, a transcript with
      speaker turns or an enhanced speech signal.
    source: src-chimechallenge-chime6-overview
    quote: CHiME-6 targets the problem of distant microphone conversational speech recognition in
      everyday home environments.
  distribution-shift-generalization:
    reason: CHiME-7 and CHiME-8 DASR rank one system over several meeting scenarios with different
      array topologies and forbid identifying the scenario, so the task stays fixed while the
      recording conditions move; CHiME-7 UDASE adapts enhancement trained on synthetic mixtures to
      real recordings.
    source: src-chimechallenge-chime7-task1
    quote: Crucially, participants are forbidden to use automatic domain identification
capability_considered_and_rejected:
  - term: transfer-learning
    reason: UDASE calls itself domain adaptation, but the task (removing noise) and its target are
      unchanged and only the input domain moves, which the vocabulary sends to
      distribution-shift-generalization.
  - term: grounding
    reason: MCoRec takes bounding boxes of the target participants and a 360-degree video, but the
      score is word error rate and conversation clustering, not whether a reference was attached to
      the right region.
  - term: communication
    reason: The conversations are the input; no system takes part in them.

evaluation_method:
  - reference-metric
  - domain-metric
  - classification-metric
  - human-crowd-eval
  - composite
evaluation_method_note: >
  Per task. Word error rate and its long-form, speaker-attributed variants (cpWER, tcpWER) rank the recognition
  tasks (reference-metric); the diarisation error rate reported beside them, and the intrusive enhancement
  measures (SI-SDR, PESQ, STOI) of UDASE's and ECHI's first stage, are measures of the speech field (domain-metric).
  MCoRec ranks by a joint error that combines per-speaker WER with a pairwise F1 over conversation clusters
  (classification-metric; the combination is composite). UDASE and ECHI rank by listening tests: P.835
  quality ratings in UDASE, and in ECHI the mean of an intelligibility score from listeners' transcriptions
  and the overall-quality rating, from panels of native English speakers with self-reported normal hearing
  (human-crowd-eval). CHiME-1 and CHiME-2 scored keyword recognition, whose scoring pages were not read.
evaluation_method_basis:
  reason: The latest recognition task combines two methods in its ranking metric; the latest
    enhancement task is ranked by human listeners.
  source: src-chimechallenge-chime9-task1
  quote: 'Joint ASR-Clustering Error Rate (Primary Metric): Combined metric that weights transcription
    performance and clustering performance'
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants build recognition, diarisation and enhancement pipelines trained for each task on
    its training data and the external data and pre-trained models its rules allow; since CHiME-7
    those include self-supervised and large pre-trained speech models fine-tuned for the task.
  source: src-arxiv-2306-13734
  quote: Another departure from earlier CHiME iterations is that participants are allowed to use
    open-source pre-trained models and datasets.
as_used:
  - protocol: A weakly supervised multichannel speech enhancement method trained on real recorded
      CHiME-4 mixtures with their transcripts and evaluated on CHiME-4 data by its authors, outside
      any CHiME round.
    split: CHiME-4
    source: src-arxiv-2610-05155
    quote: Evaluation results on the CHiME-4 dataset show the effectiveness of UltraM2M.
    note: October 2026, in submission. Earlier editions' data stays in use as a standard test bed
      for noisy and distant speech.

lifecycle: active
lifecycle_basis:
  reason: The CHiME-9 round ran from July 2025 to February 2026 and its results were presented in
    May 2026; CHiME-10 is announced; and earlier editions' data is still used for new results (an
    October 2026 paper evaluates on CHiME-4).
  source: src-chimechallenge-home
  quote: CHiME-9 results were presented at the HSCMA&CHiME 2026 workshop in Barcelona.
activity: round-scheduled
activity_note: CHiME-10 opens on 4 February 2027 with three tasks (ECHI-2, URGENT and SG-TSE). Its
  submission deadline (August-September 2027) and its workshop (December 2027, with ASLI 2027) are
  marked TBC. No standing leaderboard takes results between editions; NOTSOFAR-1 ran a Hugging Face
  leaderboard on its development set during CHiME-8 only.
activity_basis:
  reason: CHiME-9's results are out and no round is open, but the next round's opening is dated.
  source: src-chimechallenge-chime10-dates
  quote: 4 Feb 2027 Challenge opening
events:
  - name: CHiME 2027 workshop, December 2027 (with ASLI 2027; details TBC)
    kind: workshop
    source: src-chimechallenge-chime10-dates
    quote: The CHiME-10 Challenge submissions will be presented at a one-day workshop in December
      2027.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: BUT's CHiME-9 MCoRec system (NVIDIA Parakeet-v2 ASR conditioned on AV-HuBERT visual
      features, with Qwen3.5-122B for conversation clustering), second on the evaluation set
    source: src-arxiv-2604-27436
    observed_on: 2026-11-05
    quote: Our architecture conditions a pre-trained NVIDIA Parakeet-v2 ASR model on visual
      representations from a pre-trained AV-HuBERT model.
  - system: STCON's CHiME-8 DASR system, first in the constrained-LM track
    source: src-chimechallenge-chime8-task1-results
    observed_on: 2026-11-05
    quote: Contrary to our expectation, STCON (1st place) and NTT (2nd place) DASR systems
      technically would place 2nd and 3rd also in Task 2 multi-channel track
evaluation_target: learned-system
execution_mode: automated
execution_mode_note: The recognition tasks are scored by script. UDASE (2023) and ECHI (2025-2026)
  rank by listening tests run by the organisers, so for those tasks the mode is a panel.
ground_truth_source: held-out-labels
ground_truth_source_note: Reference transcripts with speaker labels and times, or close-talk
  reference signals, held by each task's organisers during the round. UDASE's and ECHI's final
  rankings come from human listeners' ratings and transcriptions of the processed audio.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: During a round the evaluation references are withheld, and the enhancement tasks' rankings
    rest on listening tests only the organisers run.
  source: src-arxiv-2609-26306-v1
  quote: For the evaluation set, only the noisy Aria and HA audio and the rainbow passages were made
    public

task:
  exists: true
  input:
    - far-field recordings of speech, from binaural and tablet-array recordings of read sentences in
      noise to multi-device array recordings of whole meetings and dinner parties
    - in recent tasks, smart-glasses and hearing-aid microphone arrays, 360-degree video, motion
      sensors and enrolment speech of the target talkers
  output: Per task, transcripts segmented by utterance with start and end times and a speaker label
    (CHiME-6 to CHiME-8), per-speaker transcripts with a conversation-cluster mapping (MCoRec), or
    enhanced speech signals, one stream per conversation partner in ECHI.
  scoring: Each task ranks on its own metric over its evaluation set; the CHiME-8 DASR ranking is
    tcpWER with a 5 s collar, computed per scenario and averaged over the four scenarios.
  source: src-chimechallenge-chime8-task1
  quote: In both tracks systems will be ranked according to scenario-wise macro time-constrained
    minimum permutation WER (tcpWER) with a collar of 5 s.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The gate differs by edition. The latest edition's ECHI data sits behind a signed data
    use agreement approved by the organisers, with redistribution forbidden; the CHiME-7 and CHiME-8
    DASR scenario Mixer 6 Speech comes through LDC; CHiME-5 (and its re-synchronised CHiME-6
    version) has been CC BY-SA 4.0 since 2024, with its evaluation transcripts.
  access_basis:
    reason: In the latest round only the evaluation inputs were released, and the organisers scored
      the outputs against references they kept.
    source: src-arxiv-2609-26306-v1
    quote: For the evaluation set, only the noisy Aria and HA audio and the rainbow passages were
      made public
  access_by_phase:
    during_edition: train-open-test-held-out. Training and development data with references from the
      opening, evaluation audio without references shortly before the deadline.
    during_edition_source: src-chimechallenge-chime8-task2
    during_edition_quote: Teams are allowed to submit up to 4 systems per track for both final
      ranking and jury award
    after_edition: Varies. CHiME-5 is redistributed under CC BY-SA 4.0; the ECHI dataset remains
      available under its data use agreement.
    after_edition_source: src-chimechallenge-datasets-chime5
    after_edition_quote: As of 1st Jan 2024, the CHiME-5 dataset has been re-issued under a standard
      CC BY-SA 4.0 license, and is free for both academic and commercial purposes.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each edition ranks on evaluation data new to it at the family level (CHiME-9's MCoRec
      and ECHI recordings were collected for the round), although CHiME-7 and CHiME-8 DASR reuse
      earlier corpora, CHiME-6 among them, as scenarios.
    source: src-chimechallenge-chime9-task2
    quote: Challenge entrants will be evaluated using a held-out test set, featuring conversations
      and talkers entirely unseen during the training or development phases.
  data_provenance:
    - real-world-instrument
    - simulation-generated
    - inherited-from-constituents
  data_provenance_note: >
    Most evaluation data is recorded speech: dinner parties on Kinect arrays (CHiME-5 and CHiME-6), office
    meetings on commercial devices (NOTSOFAR-1), conversations on smart glasses and hearing aids (MMCSG,
    ECHI) and a 360-degree camera (MCoRec) (real-world-instrument). CHiME-1 and CHiME-2 mixed read utterances
    with recorded room noise, and NOTSOFAR-1's training set is simulated with measured transfer functions
    (simulation-generated). CHiME-7 and CHiME-8 DASR assemble earlier corpora, CHiME-6, DiPCo, Mixer 6
    Speech and NOTSOFAR-1, as scenarios (inherited-from-constituents).
  data_provenance_source: src-chimechallenge-chime6-overview
  data_provenance_quote: Speech material has been collected from twenty real dinner parties that
    have taken place in real homes.
  contamination_risk: medium
  contamination_risk_note: >
    Evaluation corpora are reused across editions: CHiME-6's dinner parties are a CHiME-6, CHiME-7 and
    CHiME-8 scenario, and CHiME-5's transcripts are public under CC BY-SA, so the scenarios are known
    in advance, as the organisers' review notes. Entrants since CHiME-7 build on large pre-trained speech
    models whose training data is not checked against the evaluation sets. ECHI excluded one system that
    trained on data outside its whitelist. No source measures contamination.
  contamination_risk_source: src-arxiv-2507-18161-v2
  contamination_risk_quote: In the C7-8DASR challenges, all the evaluation scenarios were already
    known to the participants and this could have biased the development of submitted systems.
  contamination_evidence: []
  ceiling_anchor_type_note: No human or measured ceiling is given for the recognition tasks. ECHI's
    listening tests included an oracle formed by summing the close-talk signals, a reference rather
    than a ceiling.
  dataset_licence: null
  dataset_licence_note: Per edition. CHiME-5 is CC BY-SA 4.0 since 1 January 2024; the ECHI dataset
    is under a data use agreement for academic use with redistribution forbidden; Mixer 6 Speech is
    an LDC corpus; the licences of the other editions' data (CHiME-1 to CHiME-4, DiPCo, NOTSOFAR-1,
    MCoRec, MMCSG) were not read.
  size:
    - count: 320
      unit: speakers (in 67 sessions)
      subset: CHiME-9 MCoRec evaluation set
      source: src-chimechallenge-chime9-task1-results
      quote: this corresponds to 320 speakers in total
    - count: 8
      unit: sessions (4.8 hours) of four-party conversation
      subset: CHiME-9 ECHI evaluation set
      source: src-arxiv-2609-26306-v1
      quote: the evaluation set contains 8 sessions (4.8 hours)
    - count: 315
      unit: meetings of about 6 minutes (training, development and evaluation together)
      subset: NOTSOFAR-1 benchmarking dataset (CHiME-8)
      source: src-arxiv-2401-08887
      quote: a benchmarking dataset of 315 meetings, averaging 6 minutes each
    - count: 20
      unit: dinner parties of at least two hours each (all splits)
      subset: CHiME-5 and CHiME-6
      source: src-chimechallenge-chime6-overview
      quote: Speech material has been collected from twenty real dinner parties that have taken
        place in real homes.
  submission_limit:
    max_submissions: 4
    period_days: 0
    per: team and track, per edition (CHiME-8 NOTSOFAR-1)
    source: src-chimechallenge-chime8-task2
  submission_limit_note: Limits are per task. NOTSOFAR-1 took up to four systems per track; CHiME-7
    DASR up to three; the CHiME-9 limits were not read.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CHiME Steering Group, with each edition's task organising teams
  maintainer_basis:
    reason: The Steering Group calls for and selects tasks and sets the schedule; each task's team
      provides the data, scores the submissions and presents the results at the CHiME workshop.
    source: src-chimechallenge-chime10-cfp
    quote: Since CHiME 7, each edition of the CHiME Challenge has featured independent tasks
      organised by teams who work within a schedule defined by the CHiME Steering Group.
  maintainer_type: conference-workshop
  maintainer_type_note: The task teams change between editions (Microsoft ran NOTSOFAR-1,
    Meta-affiliated teams MMCSG and MCoRec, a Sheffield-led team ECHI) and feed a workshop held as a
    satellite of a speech conference, which the term's inclusion test makes conference-workshop even
    with a standing Steering Group. academic-lab was considered for the University of Sheffield,
    which leads ECHI and ECHI-2, but the term's exclusion sends a recurring challenge with
    re-forming task teams here.
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: >
    Participants run their systems on evaluation audio without references and upload outputs (transcripts,
    cluster mappings or enhanced audio), which the task's organisers score after the deadline; UDASE and
    ECHI send a selection of systems to listening tests. MCoRec requires a system description and excludes
    systems that break its rules from the ranking; other tasks ask for a technical report presented at
    the workshop, which was not checked as a ranking condition.
  submission_process_source: src-chimechallenge-chime9-task1-rules
  submission_process_quote: Participants must submit a system description with details about their
    submitted system.
  independence_flags: []
  independence_flags_note: >
    Not assessed in full. Several tasks are run or funded by companies: NOTSOFAR-1 by Microsoft, which
    released its data; MMCSG on Meta's Aria glasses; ECHI with WS Audiology and Meta, which supported
    the work. Whether those companies' own teams entered the tasks was not checked. The CHiME-8 DASR baseline
    is built on the NVIDIA NeMo team's CHiME-7 entry. ECHI excluded one system from its ranking for using
    non-whitelisted training data.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: During a round only the organisers hold the evaluation references, and the enhancement
      tasks' official rankings come from listening tests the organisers run. After a round,
      recognition tasks whose references are released can be rescored with the official scripts.
    source: src-arxiv-2609-26306-v1
    quote: a listening panel of 32 native English speakers with self-reported normal hearing was
      recruited
  reproducibility_blockers:
    - private-test-set
    - human-raters
  harness_availability: official-harness
  harness: Per task. CHiME-8 DASR's chime-utils (data generation, text normalisation and the
    official tcpWER, cpWER and DER scoring); MCoRec's and ECHI's evaluation scripts in their
    baseline repositories.
  harness_source: src-github-chime-utils-readme
  harness_quote: the exact same scripts organizers will use for ranking CHiME-8 DASR submissions
  code_licence: MIT
  code_licence_note: chime-utils is MIT per GitHub's licence metadata (read 2026-11-05, not a quoted
    Source); the other tasks' baselines carry their own licences, which were not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the resolved profile: which edition and task (the data, tasks and metrics change every edition, and
  # CHiME-6 data is scored in three editions under different protocols), which split (the evaluation set or the
  # development set most papers report), what external data and pre-trained models the task's rules allowed, the
  # track (constrained or unconstrained language models in CHiME-8 DASR, single- or multi-channel in NOTSOFAR-1,
  # Aria or hearing aid in ECHI), and the scoring code and text normalisation.
  material_extra:
    - subset_used
    - training_data_policy
    - eligibility_track
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each task is ranked on its own metric and teams enter any subset of tasks; nothing
    combines the tasks.
  source: src-chimechallenge-chime10-cfp
  quote: Teams are responsible for managing the tasks, i.e., providing data and instructions,
    scoring submissions and results, etc.

homepage: https://www.chimechallenge.org/
repository: https://github.com/chimechallenge
dataset_url: https://www.chimechallenge.org/datasets/chime6


# data/benchmarks/audio-speech/iwslt.yaml
#
# P1-S7-T03, audio-speech entry 4 of 9. Filled from the findings paper of the 2026 campaign ("Speech Translation
# and Metrics in 2026: Findings of the IWSLT Campaign", ACL Anthology 2026.iwslt-1.39) read as the text of its
# PDF, and its Anthology landing page; the IWSLT 2026 home page and its offline and metrics track pages; the
# IWSLT 2027 home page; the history page listing every edition; Hugging Face's API record of the past
# offline-track test sets; and the arXiv abstract page of KIT's instruction-following submission to IWSLT 2026
# (arXiv 2606.04730), as evidence of current use. Pages were read with scripts and styles stripped. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The family entry: one entry for the yearly campaign, its editions (2004-2027) as versions and the 2026 shared
# tasks as subsets. The stress corpus's `iwslt-2026` is the 2026 edition of this family.

id: iwslt
name: IWSLT Evaluation Campaign
aliases:
  - IWSLT shared tasks
  - IWSLT 2026
tagline: "IWSLT's yearly speech-translation shared tasks since 2004: offline, simultaneous, low-resource,
  subtitling and more."
description: >
  The evaluation campaign of the International Conference on Spoken Language Translation (IWSLT), run
  every year since 2004 under SIGSLT, the ACL special interest group. Each edition is a set of shared
  tasks: organisers release training and development data and test audio, teams submit system outputs
  before the conference, and the organisers score them and report the results in a findings paper in
  the ACL Anthology. The 2026 edition, the 23rd, had ten tasks: offline, low-resource, simultaneous and
  subtitling speech translation, model compression, Indic and African/Celtic speech-to-speech
  translation, cross-lingual voice cloning, instruction following for speech language models, and
  quality estimation for speech translation. The offline track, the oldest, ranks submissions by COMET
  against withheld reference translations after automatic resegmentation, reports BLEURT, BLEU, TER and
  characTER beside it, and has professional translators rate each team's primary run by direct
  assessment. Systems are entered under constrained, constrained-with-LLM and unconstrained data
  conditions. IWSLT 2027 has added year-round leaderboards on the evaluation server for the offline,
  compression and instruction-following tracks.
self_description:
  source: src-iwslt-2026-site
  quote: The International Conference on Spoken Language Translation (IWSLT) is an annual scientific
    conference, associated with shared tasks on spoken language translation
paper:
  title: 'Speech Translation and Metrics in 2026: Findings of the IWSLT Campaign'
  doi: 10.18653/v1/2026.iwslt-1.39
  source: src-acl-2026-iwslt-1-39-pdf
released: 2004-09-30
released_note: The first edition's opening day, as the history page lists it (30 Sep.-1 Oct. 2004,
  Kyoto). The 2026 findings speak of a 23-year tradition of evaluation campaigns; when the first
  campaign's data were released is not stated in the sources read.
released_source: src-iwslt-history
released_quote: IWSLT 2004, 30 Sep.-01 Oct. 2004 - Kyoto, Japan
release_venue: IWSLT (International Workshop, later Conference, on Spoken Language Translation)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speech-translation
  secondary:
    - audio-speech/speech-recognition
    - audio-speech/speech-synthesis
    - language/low-resource-languages
    - multimodal/audio-language
  per_edition: true
  per_edition_note: The secondary list is a union over the 2026 tracks, and the track set changes by
    edition (subtitling from 2023, compression and instruction following from 2025, voice cloning
    from 2026). Speech recognition is the language-agnostic track's English-English direction and a
    task of the instruction-following track; speech synthesis is the speech-to-speech and
    voice-cloning tracks; low-resource languages the low-resource track; audio-language the
    instruction-following track's question answering and summarisation over speech.
domain_basis:
  reason: Every shared task takes speech as input, and the campaign's purpose is translating it; the
    longest-running track scores text translations of recorded speech.
  source: src-iwslt-2026-site
  quote: associated with shared tasks on spoken language translation
domain_considered_and_rejected:
  - term: language/translation
    reason: The input is speech, not text, and the score depends on what was recovered from the
      audio; audio-speech/speech-translation is the leaf for that.
  - term: audio-speech/speaker-tasks
    reason: The voice-cloning track scores speaker similarity of generated speech, but nobody is
      identified, verified or diarised; it is recorded under speech synthesis.
capability:
  - generation-fidelity
  - perception
capability_basis:
  generation-fidelity:
    reason: The offline track's ranking is COMET similarity to the reference translations, and
      professional translators rate each primary run against the source audio; other tracks score
      BLEU, chrF++, SubER or character error rate against references.
    source: src-iwslt-2026-offline
    quote: produce translations similar to the target-language references in the test sets
  perception:
    reason: Every track starts from raw speech, much of it long-form audio with overlapping
      speakers, accents and noise, and what is scored is the content recovered from it.
    source: src-acl-2026-iwslt-1-39-pdf
    quote: Deploying systems on this data requires managing complex phenomena such as overlapping
      speech, heterogeneous accents, and ambient noise.
capability_considered_and_rejected:
  - term: instruction-following
    reason: The instruction-following track gives a task instruction with the audio, but each task's
      output is scored for correctness (WER, COMET, BERTScore), not for whether the stated direction
      was obeyed apart from the content.
    source: src-acl-2026-iwslt-1-39-pdf
    quote: The model receives both a speech input and a task instruction in textual form and is
      expected to follow the instruction to produce the appropriate output.
  - term: distribution-shift-generalization
    reason: The offline test sets span domains and recording conditions and are reported one by one,
      but under the unconstrained conditions no training distribution is fixed, so no condition is
      drawn from outside it by construction.

evaluation_method:
  - model-derived-metric
  - reference-metric
  - human-expert-eval
  - statistical-fit
evaluation_method_basis:
  reason: COMET ranks the offline track and is the score the compression track reports (COMET-XL is
    the simultaneous track's quality metric), and the African/Celtic speech-to-speech score and
    voice cloning's speaker similarity come from ASR and ECAPA-TDNN models, all model-derived. BLEU,
    chrF++, TER, characTER and SubER are reported beside them and rank the low-resource and
    subtitling tracks. Professional translators give direct assessment scores to the primary runs of
    the offline, compression and instruction-following tracks. The metrics track is scored by
    Kendall's tau-b correlation with human judgements.
  source: src-iwslt-2026-offline
  quote: the submitted runs will be ranked based on COMET calculated on the test set by using
    automatic resegmentation of the hypothesis based on the reference translation by mwerSegmenter
evaluation_method_considered_and_rejected:
  - term: composite
    reason: Each track ranks on its own primary metric. The simultaneous track reports latency
      beside quality without combining them, and no figure averages tracks.
  - term: domain-metric
    reason: The latency measures (LongYAAL, StreamLAAL) are specific to simultaneous translation,
      but they measure delay, not quality, and are recorded as a secondary axis; SubER is an edit
      rate against reference subtitles, a reference metric.
  - term: human-crowd-eval
    reason: The direct-assessment raters are professional translators, which is human-expert-eval.
    source: src-acl-2026-iwslt-1-39-pdf
    quote: Annotation is conducted by professional translators fluent in the source language and
      native in the target language.
designed_for_subjects:
  - task-specific-supervised-model
  - instruction-tuned-model
  - generative-media-model
designed_for_subjects_basis:
  reason: The offline, low-resource, simultaneous and subtitling tracks are built for trained speech
    translation systems, cascades and end-to-end models alike. The instruction-following track is
    built for speech language models prompted with a task instruction, and the speech-to-speech and
    voice-cloning tracks score the speech a system generates.
  source: src-iwslt-2026-offline
  quote: Both cascade and end-to-end models will be evaluated.

lifecycle: active
lifecycle_basis:
  reason: The 2026 campaign drew more than 30 teams, and IWSLT 2027 keeps year-round leaderboards
    open for three tracks while its own round is prepared.
  source: src-iwslt-2027-site
  quote: Submission for these tasks is open.
activity: leaderboard-live-no-round
activity_note: The 2027 page lists the next evaluation period as Mar 20-Apr 4, without a year.
activity_basis:
  reason: The campaign runs in yearly rounds. The 2026 round closed (system submission deadline 15
    April 2026) and its results were published in July 2026; the 2027 round has not opened, while
    the evaluation server's leaderboards take outputs from anyone for three tracks.
  source: src-iwslt-2027-site
  quote: 'Year-round evaluation is currently available for: Model compression Offline speech translation
    Instruction following'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: HW-TSC's cascade (Qwen-family VAD, ASR and MT), the only entrant in the 2026 offline
      track's English-German and English-Chinese directions
    source: src-acl-2026-iwslt-1-39-pdf
    observed_on: 2026-10-14
    quote: 'The model is a pipeline composed of: (1) a VAD module to segment long audio'
  - system: KIT's instruction-following system (IWSLT 2026, long and short tracks)
    source: src-arxiv-2606-04730
    observed_on: 2026-10-14
    quote: We present KIT's submission to the Long and Short Instruction Following tracks in the
      unconstrained setting.
evaluation_target: learned-system
execution_mode: automated
execution_mode_note: The official rankings are automatic; human direct assessment of primary runs
  complements them in three tracks.
ground_truth_source: held-out-labels
ground_truth_source_note: Reference translations, transcripts and subtitles withheld from
  participants during the round; the metrics track's ground truth is human quality judgements.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: A round's reference translations are withheld and its official scores come from the
    organisers' server or scoring, and the direct-assessment scores from translators they recruit.
    Earlier rounds' offline test sets are later published with references, on which anyone can run
    the evaluation script.
  source: src-iwslt-2026-offline
  quote: Reference translation (will not be provided for evaluation data)

task:
  exists: true
  input:
    - speech audio in a source language, mostly long-form recordings (talks, TV series, call-centre
      conversations, YouTube videos, business news), with the task instruction in the
      instruction-following track and source audio plus a translation in the metrics track
  output: Per track, target-language text (one segment per line), timed subtitles, target-language
    speech, or a quality score per segment.
  scoring: Per track and language direction. The offline track ranks by COMET after mwerSegmenter
    resegmentation against the references, with BLEURT, BLEU, TER and characTER beside it, and adds
    direct assessment of primary runs; other tracks rank by their own primary metric (BLEU and
    chrF++, SubER, COMET-XL with latency, character error rate, speaker similarity, Kendall's
    tau-b).
  source: src-iwslt-2026-offline
  quote: 'Such similarity will be measured in terms of multiple automatic metrics: COMET, BLEURT, BLEU,
    TER, and characTER.'

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: Test audio for the offline, compression and instruction-following tracks is
    downloaded from the SPEECHM evaluation server after logging in; other tracks distribute their
    test sources themselves. The login is a lesser layer than the withheld references.
  access_basis:
    reason: Training and development data and the test audio are released; the test references are
      not, and the organisers score the submitted outputs.
    source: src-iwslt-2026-offline
    quote: Reference translation (will not be provided for evaluation data)
  access_by_phase:
    during_edition: test audio released, references withheld; scoring by the organisers
    after_edition: earlier rounds' offline test sets, references included, are offered as
      development data; the Hugging Face release holds the offline test sets of 2010-2022, ungated
    note: The 2026 offline page points to the earlier rounds' data ("Data from the previous rounds
      of the offline task", src-iwslt-2026-offline); the Hugging Face record lists their reference
      files (src-hf-api-iwslt-offlinetask).
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each yearly edition brings new test data and often new tracks; 2026 added call-centre
      and YouTube test sets to the offline track, Japanese as a target, and a language-agnostic
      track.
    source: src-acl-2026-iwslt-1-39-pdf
    quote: By incorporating two brand-new scenarios, call center interactions and YouTube videos
  data_provenance:
    - expert-authored
    - web-scraped
  data_provenance_note: The scored references are professional translations, some curated by AppTek.
    The 2026 source audio comes from ITV Studios TV series, scientific (ACL) talks, simulated
    call-centre conversations, YouTube videos from YODAS, a Bloomberg business-news broadcast and
    the EdAcc accented-English corpus, with TTS-synthesised versions of the talks as a further test
    set.
  data_provenance_source: src-acl-2026-iwslt-1-39-pdf
  data_provenance_quote: High-quality reference translations for German, Japanese, and Chinese were
    professionally curated by AppTek
  contamination_risk: medium
  contamination_risk_note: The references are new each round and withheld, but much of the source
    audio is public broadcast and web video (YODAS draws on YouTube), and the unconstrained
    condition admits any pretrained model, so a route into training data is plausible; no source
    assesses it. Past rounds' test sets and references are public.
  contamination_risk_source: src-acl-2026-iwslt-1-39-pdf
  contamination_risk_quote: Sourced from large-scale YouTube collections, this dataset includes five
    English audio files
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No source publishes a human or measured anchor for COMET on the offline
    track, the headline track.
  dataset_licence: CC-BY-NC-ND-4.0
  dataset_licence_note: The Hugging Face release of past offline-track test sets (2010-2022). No
    licence was found for the 2026 test data.
  dataset_licence_source: src-hf-api-iwslt-offlinetask
  dataset_licence_quote: '"license":"cc-by-nc-nd-4.0"'
  size:
    - count: 10
      unit: shared tasks
      subset: the 2026 edition
      source: src-acl-2026-iwslt-1-39-pdf
      quote: This paper presents the outcomes of the 2026 IWSLT Evaluation Campaign, which comprised
        ten distinct shared tasks organized into five primary research areas
    - count: 6
      unit: test sets for English-German (5 for English-Chinese and English-Japanese, 1 for
        English-Arabic)
      subset: 2026 offline track, language-aware
      source: src-iwslt-2026-offline
      quote: 6 test sets for English-German
    - count: 10
      unit: language pairs
      subset: 2026 low-resource track, track 1
      source: src-acl-2026-iwslt-1-39-pdf
      quote: focusing on 10 typologically diverse language pairs

training_data_eligibility_tiers:
  - id: constrained
    label: Constrained
    rule: Only the listed medium-sized speech, speech-translation and text corpora, and no
      pretrained language model.
    source: src-iwslt-2026-offline
  - id: constrained-with-llms
    label: Constrained with large language models
    rule: The constrained data plus any freely accessible large language model released under a
      permissive licence.
    source: src-iwslt-2026-offline
  - id: unconstrained
    label: Unconstrained
    rule: Any resource, pretrained models included, except the evaluation sets.
    source: src-iwslt-2026-offline

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: IWSLT (the conference's organising committee and each track's organisers, under ACL
    SIGSLT)
  maintainer_basis:
    reason: The campaign is organised for the conference, which SIGSLT runs with ACL, ISCA and ELRA
      support; each track has its own organisers, and the findings paper has 55 authors.
    source: src-acl-2026-iwslt-1-39-pdf
    quote: Operating under the auspices of the Special Interest Group on Spoken Language Translation
      (SIGSLT)
  maintainer_type: conference-workshop
  maintainer_type_basis:
    reason: A recurring challenge held under a conference, whose tracks are proposed and run by
      teams that change between editions (voice cloning first ran in 2026, compression in 2025);
      chairs come from Amazon, CMU, George Mason, FBK, KIT, Galway, Google and Zoom.
    source: src-iwslt-2026-site
    quote: The 23rd edition of IWSLT will be run as an ACL and ELRA sponsored event
  submission_process:
    - held-out-server
    - sandboxed-rerun
    - publication-gated
  submission_process_note: Participants submit outputs on test audio whose references they do not
    see; the offline, compression and instruction-following tracks upload them to the SPEECHM
    server, and the other tracks send them to their organisers, who score them after the deadline.
    The simultaneous track prefers Docker images that the organisers run on one H100, to compare
    computation-aware latency, although the test audio is public there. The metrics track requires a
    system description paper; for other tracks a paper is an opportunity (see review_checks).
  submission_process_source: src-iwslt-2026-offline
  submission_process_quote: The evaluation will be performed using the Meetween SPEECHM Evaluation
    Server
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-acl-2026-iwslt-1-39-pdf
      quote: 'The subtitling track saw the participation of three teams: APPTEK, the MT unit of Fondazione
        Bruno Kessler (FBK), and Huawei Translation Service Center (HW-TSC).'
    - flag: funded-by-evaluated-party
      source: src-acl-2026-iwslt-1-39-pdf
      quote: High-quality reference translations for German, Japanese, and Chinese were
        professionally curated by AppTek
  independence_flags_note: FBK holds the 2026 programme co-chair, logistics and website chairs, and
    its MT unit entered the subtitling track; AppTek, whose staff co-author the findings, entered it
    too and ranked first under virtually all conditions. KIT holds the evaluation chair, and the
    evaluation chair and a conference co-chair co-author KIT's instruction-following submission
    (src-arxiv-2606-04730). AppTek's curated references are in-kind support from an evaluated party;
    AppTek also appears among the 2026 sponsors, shown only as logos.
  independence_assessed: true
  funding:
    source: src-acl-2026-iwslt-1-39-pdf
    quote: This work has received funding from the European Union
  funding_note: The findings acknowledge EU Horizon funding (the Meetween project, which built the
    SPEECHM evaluation server) and national grants to individual organisers.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: No source states what a run needs across tracks. The constrained conditions
    limit training data to keep resource needs manageable, and the simultaneous track's Docker route
    expects one NVIDIA H100 with 80 GB.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The official scores of a round are computed by the organisers against references they
      withhold, and the direct-assessment scores need translators they recruit.
    source: src-iwslt-2026-offline
    quote: Reference translation (will not be provided for evaluation data)
  reproducibility_blockers:
    - private-test-set
    - human-raters
  reproducibility_blockers_note: The private test set lasts for the round; earlier rounds' offline
    test sets are later published with their references.
  harness_availability: official-harness
  harness_availability_note: The offline score is produced by the SLT.KIT evaluation script
    (scripts/evaluate/Eval.sh). Other tracks name their own tools, OmniSTEval for the simultaneous
    track and SubER for subtitling.
  harness: SLT.KIT (scripts/evaluate/Eval.sh), with mwerSegmenter resegmentation
  harness_source: src-iwslt-2026-offline
  harness_quote: The detailed evaluation script can be found in the SLT.KIT.
  submission_channel:
    source: src-iwslt-2027-site
    quote: Submit your model outputs to our evaluation server.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The profiles resolve to llm-static-text and model-graded (instruction-tuned systems scored by BLEU and by
  # COMET, whose model is a judge), human-judged (the translators' direct assessment) and forecasting (the
  # metrics track's Kendall tau-b is a statistical fit). Beyond them: the data condition a system was entered
  # under (constrained, constrained with LLMs, unconstrained), and the scoring path (the resegmentation against
  # the references). The track, edition and test set are subset_used. Forecasting makes lead_time and
  # resolution_window material although no track forecasts; ADR-0024 (D3) puts that fix in the profile rule, not
  # in a waiver here (see review_checks).
  material_extra:
    - eligibility_track
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_note: Each shared task ranks its own systems per language direction and data
  condition, and the findings paper publishes no score across tasks.
secondary_axes:
  - latency
secondary_axes_basis:
  reason: The simultaneous track scores every system for latency beside quality.
  source: src-acl-2026-iwslt-1-39-pdf
  quote: For latency, we report LongYAAL as the primary metric

homepage: https://iwslt.org/
dataset_url: https://huggingface.co/datasets/IWSLT/IWSLT.OfflineTask


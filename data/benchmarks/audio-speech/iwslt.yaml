subsets:
  - id: iwslt#offline
    label: Offline speech translation (2026)
    scored_separately: true
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: with focus on unconstrained speech-to-text translation of audio from a variety of
          diverse domains
      - source: src-iwslt-2026-offline
        quote: the submitted runs will be ranked based on COMET calculated on the test set by using
          automatic resegmentation of the hypothesis based on the reference translation by
          mwerSegmenter
    notes: English to German, Chinese, Japanese and Arabic (language-aware track), and Czech, German
      and English to English with the source language unknown (language-agnostic track). Ranked by
      COMET; direct assessment of primary runs.
  - id: iwslt#low-resource
    label: Low-resource speech translation (2026)
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-translation
      secondary:
        - language/low-resource-languages
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: focusing on the translation of recorded speech from a variety of domains in
          low-resource and generally under-served languages, covering 10 language pairs
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: We use standard lowercase BLEU with no punctuation to automatically score all
          submissions.
    notes: Ten language pairs in track 1, scored by BLEU with chrF++; track 2 collects new datasets
      rather than scoring systems.
  - id: iwslt#compression
    label: Model compression (2026)
    scored_separately: true
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: by reducing the size of a large multilingual speech-to-text foundation model
    notes: English to German and Chinese on the offline track's test data, compressing Qwen2-Audio;
      scored on the SPEECHM server.
  - id: iwslt#subtitling
    label: Subtitling (2026)
    scored_separately: true
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: The task of automatic subtitling is multifaceted
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: Subtitle quality vs. reference subtitles
    notes: English speech to subtitles in Arabic, Chinese, German, Japanese or Spanish, ranked by
      SubER, with translation quality and subtitle compliance reported beside it.
  - id: iwslt#simultaneous
    label: Simultaneous speech translation (2026)
    scored_separately: true
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: For translation quality, the primary metric is COMET-XL
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: For latency, we report LongYAAL as the primary metric
    notes: Streamed English to German, Italian and Chinese, and Czech to English; quality and
      latency reported per latency regime.
  - id: iwslt#indic-s2s
    label: Indic speech-to-speech translation (2026)
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-translation
      secondary:
        - audio-speech/speech-synthesis
        - language/low-resource-languages
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: between English and three Indic languages (Hindi, Marathi, Punjabi) in both
          directions
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: For the test set, we provided only the source; participants submitted their
          predictions, and the metrics were evaluated by the Indic S2S organizing team.
  - id: iwslt#african-celtic-s2s
    label: African and Celtic speech translation (2026)
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-translation
      secondary:
        - audio-speech/speech-synthesis
        - language/low-resource-languages
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: focuses on speech-to-speech translation from three under-resourced languages
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: For S2S, the official metric is character error rate (CER)
    notes: Hausa, Igbo and Yoruba to English, as text and as speech; the speech output is
      transcribed by an ASR model before its character error rate is computed.
  - id: iwslt#voice-cloning
    label: Cross-lingual voice cloning (2026)
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-synthesis
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: the cross-lingual voice cloning task focuses on transferring voice identity across
          languages while maintaining naturalness and intelligibility
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: Speaker Similarity is computed using a pretrained ECAPA-TDNN model
    notes: The first edition of the track; scored for content consistency, speaker similarity and
      speech quality.
  - id: iwslt#instruction-following
    label: Instruction-following speech processing (2026)
    scored_separately: true
    domain_override:
      primary: multimodal/audio-language
      secondary:
        - audio-speech/speech-recognition
        - audio-speech/speech-translation
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: It aims to test general-purpose multimodal models
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: Covers the downstream tasks of Speech Recognition, Translation, Question Answering,
          Summarization, Audio Chaptering, and a surprise task
    notes: Short and long sub-tracks on scientific talks, English to German, Italian and Chinese;
      scored per task (WER, COMET, BERTScore) on the SPEECHM server, with direct assessment of
      primary runs.
  - id: iwslt#metrics
    label: Speech translation metrics (quality estimation) (2026)
    scored_separately: true
    evidence:
      - source: src-acl-2026-iwslt-1-39-pdf
        quote: focusing on Quality Estimation for speech translation, a reference-free evaluation of
          speech translation quality
      - source: src-iwslt-2026-metrics
        quote: Quality Estimation models will be evaluated by measuring their correlation with human
          judgments similar to WMT Metrics Shared Task.
    notes: Entrants are quality-estimation metrics scored by correlation with human judgements of
      other tracks' outputs (English to German and Chinese). No domain term covers metric
      meta-evaluation, so no override is set (taxonomy failure 2026-09-28-iwslt-2026-001).

history:
  - event: channel-opened
    field: execution.submission_channel
    to: year-round leaderboards on the SPEECHM evaluation server (offline, compression, instruction
      following)
    source: src-iwslt-2027-site
    quote: For the first time, IWSLT is not only hosting shared tasks with the usual timeline, but
      it is also experimenting with year-round leaderboards to keep track of the progress in the
      community over the whole timeframe.
    note: Opened after the 2026 round for IWSLT 2027; the page does not date it. Until then outputs
      were taken only during each round's evaluation period.

tags:
  - speech-translation
  - shared-task
  - simultaneous-translation
  - subtitling
  - speech-to-speech
  - low-resource-languages
  - quality-estimation


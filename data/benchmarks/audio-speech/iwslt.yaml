curation:
  added_by: agent (P1-S7-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-acl-2026-iwslt-1-39-pdf
    - src-acl-2026-iwslt-1-39
    - src-iwslt-2026-site
    - src-iwslt-2026-offline
    - src-iwslt-2026-metrics
    - src-iwslt-2027-site
    - src-iwslt-history
    - src-hf-api-iwslt-offlinetask
    - src-arxiv-2606-04730
  sources_note: >
    The 2026 findings paper read as the text of its ACL Anthology PDF (a DOI, not archived) and its
    landing page for the date, DOI and CC BY 4.0 licence; the 2026 home, offline and metrics pages, the
    2027 home page and the history page, each with scripts and styles stripped; Hugging Face's API record
    of the past offline test sets; and the abstract page of KIT's 2026 instruction-following submission
    (a DOI, not archived) as evidence of current use. The other 2026 track pages were read but not cited;
    the SPEECHM server needs a login and was not read.
  confidence: medium
  review_checks:
    - check: The comparability profile table maps statistical-fit with instruction-tuned-model to
        forecasting, so the metrics track's Kendall tau-b makes lead_time and resolution_window
        material, though no IWSLT track forecasts. ADR-0024 (D3) removes entry-level waivers of
        those two fields and puts the fix in the profile rule; whether that pair should map to
        forecasting is the open question.
      field: comparability
    - check: 'Identity: one family entry with editions as versions and the 2026 tasks as subsets. The
        stress corpus names the 2026 edition (iwslt-2026), which as an edition entry would be lifecycle
        superseded and activity closed; the family is active.'
      field: versions
    - check: publication-gated rests on the metrics track alone, which requires a system paper; the
        other tracks offer system papers as an opportunity, which the term excludes.
      field: governance.submission_process
      source: src-iwslt-2026-metrics
      quote: As part of the submission, participants are required to submit a system description
        paper to IWSLT 2026 for review
    - check: sandboxed-rerun rests on the simultaneous track's preferred Docker route, where the
        organisers run the submitted system; its test audio is public (log submissions need it), so
        containerized-algorithm-submission was not used.
      field: governance.submission_process
      source: src-acl-2026-iwslt-1-39-pdf
      quote: 'Docker Image Submission (Preferred): Under this setup, the organizers run the participants'
    - check: funded-by-evaluated-party rests on AppTek's curated reference translations as in-kind
        support, AppTek's system being evaluated in subtitling; AppTek's sponsorship is shown only
        as logos. Whether test data donated by an entrant counts as funding.
      field: governance.independence_flags
      source: src-acl-2026-iwslt-1-39-pdf
      quote: High-quality reference translations for German, Japanese, and Chinese were
        professionally curated by AppTek
    - check: activity leaderboard-live-no-round, against round-scheduled (the 2027 page gives the
        next evaluation period without a year) and accepting-submissions.
      field: activity
      source: src-iwslt-2027-site
      quote: Mar 20-Apr 4 Evaluation period (shared tasks)
    - check: designed_for_subjects has three terms, each from different tracks; the
        instruction-tuned subject is the instruction-following track's and the generative-media
        subject the speech-to-speech and voice-cloning tracks'.
      field: designed_for_subjects
      source: src-acl-2026-iwslt-1-39-pdf
      quote: It aims to test general-purpose multimodal models
    - check: data_provenance leaves out real-world-instrument (recorded talks, TV and broadcasts)
        and model-generated (the TTS-synthesised test audio); whether either applies to the source
        audio.
      field: data.data_provenance
      source: src-acl-2026-iwslt-1-39-pdf
      quote: Synthetic TTS Audio Data is generated from the English-German
    - check: Version dates are each edition's first conference day from the history page; only 2023
        and 2025-2027 have changes recorded, and older editions' tasks were not read.
      field: versions
    - check: released (2004) rests on the first edition's date and the findings' 23-year tradition;
        no source read describes the 2004 campaign itself.
      field: released
      source: src-acl-2026-iwslt-1-39-pdf
      quote: Maintaining its 23-year tradition, the 2026 conference was preceded by a comprehensive
        evaluation campaign
  personal_data_excluded:
    - source: src-iwslt-2026-metrics
      what: The track organisers' e-mail addresses on the page; the Source is withheld from
        archiving and its extract leaves them out.

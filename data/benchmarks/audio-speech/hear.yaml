# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T04)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2203-03022-v3
    - src-arxiv-2203-03022
    - src-pmlr-v176-turian22a
    - src-hearbenchmark-tasks
    - src-hearbenchmark-submit
    - src-hearbenchmark-api
    - src-hearbenchmark-leaderboard-csv
    - src-github-hear-eval-kit-readme
    - src-zenodo-5885750
    - src-zenodo-6332517
    - src-arxiv-2512-10120
    - src-arxiv-2512-10120-v2
    - src-arxiv-2505-16369-v2
  sources_note: >
    The paper's v3 PDF and abstract page (DOI sources, not archived) and its PMLR page. Three hearbenchmark.com
    pages and the leaderboard CSV, with the leaderboard page as its rendered URL. hear-eval-kit's README
    at its newest commit. Zenodo's records of dataset versions 2021.1 and 2021.3 (DOI sources). VocSim's
    v2 PDF and abstract page as evidence of current use, and X-ARES's v2 PDF for its account of HEAR.
    The non-DOI Sources are pending archiving.
  confidence: medium
  review_checks:
    - check: Primary domain. No audio-speech leaf holds most of the nineteen tasks, and
        music-understanding wins only as the largest group (7 of 19) under ADR-0016's fallback.
        Environmental sound has as many tasks, split across leaves. A reviewer may prefer
        audio-event-understanding, the broadest leaf. A suite leaf would settle it (logged with
        superb's).
      field: domain.primary
      source: src-arxiv-2203-03022-v3
      quote: 'These tasks encompass multiple audio domains: speech, environmental sound, and music, with
        tasks that involve short and long time spans.'
    - check: Overlap with superb. Both score a frozen pretrained model through small per-task heads.
        SUPERB covers speech processing, HEAR covers speech, environmental sound and music, and they
        share only Speech Commands. The paper calls them complementary, so they are separate
        entries. Their domain and subject gaps are the same two records.
      field: domain.primary
      source: src-arxiv-2203-03022-v3
      quote: these two evaluation activities are complementary to each other
    - check: lifecycle active rests on one ICML 2026 paper that scores seven of the nineteen tasks
        with its own logistic-regression probe. The leaderboard has not moved since 2023-09-26. If
        partial-suite use with another probe does not count as results on the instrument, mature (a
        settled record, still available) is the alternative.
      field: lifecycle
      source: src-arxiv-2512-10120-v2
      quote: Logistic Regression classifier on the frozen embeddings.
    - check: activity leaderboard-live-no-round rests on the Submit page's open invitation. No row
        has been added since 2023-09-26, and two pull requests from early 2023 are still open. If
        the maintainers no longer merge, closed applies.
      field: activity
      source: src-hearbenchmark-leaderboard-csv
      quote: ',2023-09-26,'
    - check: Whether X-ARES (Xiaomi, Interspeech 2025), built on HEAR with 22 tasks, is replacing
        it. It is another maintainer's new suite, not a fork, so no lineage is recorded. Its paper
        notes that follow-up work drops HEAR's noisiest tasks, which is why subset_used matters.
      field: lifecycle
      source: src-arxiv-2505-16369-v2
      quote: which have led to many follow-up works discarding those tasks
    - check: Neither independence flag is set. funded-by-evaluated-party would need a source that
        YAMNet, entered by Soundsensing, is Google's model (Google sponsored HEAR and its compute),
        and maintainer-competes-on-own-benchmark a source that an organiser leads AMAAI Lab at SUTD,
        which entered two models. Set each if a source confirms it.
      field: governance.independence_flags
      source: src-arxiv-2203-03022-v3
      quote: Soundsensing YAMNet 2-D MobileNet (Howard et al., 2017). Pretrained to tag AudioSet.
    - check: Versions are the Zenodo dataset revisions, because the challenge ran once. No source
        read says which revision the 2021 leaderboard scores used for CREMA-D and the two GTZAN
        tasks. 2021.2 is marked breaking because it changed those archives after a preprocessing
        bug. Zenodo's first version (2021) appears only in the versions listing and has no row.
      field: versions
      source: src-zenodo-5885750
      quote: had a preprocessing bug and are retracted
    - check: designed_for_subjects is empty. A frozen embedding model probed through
        organiser-trained heads fits no subject term. The gap is logged, as for superb.
      field: designed_for_subjects
    - check: submission_process containerized-algorithm-submission for the 2021 phase is the nearest
        term. The models were pip-installable packages with weights, which the organisers installed
        and ran, not containers.
      field: governance.submission_process
      source: src-arxiv-2203-03022
      quote: each participant submitted an audio embedding model following a common API
    - check: released is null. No source read dates the release of the open tasks in 2021, and the
        PMLR page gives no publication day.
      field: released

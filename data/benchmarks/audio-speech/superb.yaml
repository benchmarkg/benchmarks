# data/benchmarks/audio-speech/superb.yaml
#
# P1-S3-T01, checkpoint entry 1 of 10 (copilot on: the F6 copilot's extractive drafter, the only one available
# without an API key, gave the title, arXiv id and release date). Filled from SUPERB's paper, arXiv 2105.01051,
# read as its v4 PDF (2021-10-15), and its abstract page. Every quote below is checked by the quote-substring
# validator against those two Sources' committed extracts.
#
# superbbenchmark.org did not answer on 2026-10-10, so nothing here is read from the leaderboard: what it holds
# now, and whether it aggregates the ten tasks, are reviewer checks below.

id: superb
name: SUPERB
aliases:
  - Speech processing Universal PERformance Benchmark
tagline: Ten speech tasks that score one frozen, shared pretrained speech model through small
  task-specific heads.
description: >
  A suite of ten speech-processing tasks -- phoneme and speech recognition, keyword spotting, query-by-example
  spoken term detection, speaker identification, verification and diarization, intent classification,
  slot filling and emotion recognition -- each on an existing public dataset and scored on its own conventional
  metric. In the framework the paper sets out, the pretrained model is frozen and shared across all ten
  tasks, and only a lightweight prediction head is trained per task, so the scores compare how reusable
  one model's representations are. Released as a challenge with an online leaderboard and the s3prl toolkit.
self_description:
  source: src-arxiv-2105-01051
  quote: SUPERB is a leaderboard to benchmark the performance of a shared model across a wide range
    of speech processing tasks with minimal architecture changes and labeled data
external_ids:
  arxiv: '2105.01051'
paper:
  title: 'SUPERB: Speech processing Universal PERformance Benchmark'
  arxiv: '2105.01051'
  version_read: v4
  source: src-arxiv-2105-01051-v4
released: 2021-05-03
released_note: The paper's first arXiv version, as the abstract page dates it.
released_source: src-arxiv-2105-01051
released_quote: Submitted on 3 May 2021

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speech-recognition
  secondary:
    - audio-speech/speaker-tasks
domain_basis:
  reason: The ten tasks cover four aspects of speech. Content (phoneme recognition, ASR, keyword
    spotting, query-by-example) is the largest group and is speech recognition's; the speaker tasks
    are secondary. The two spoken-language-understanding tasks and emotion recognition have no
    audio-speech leaf, and no subdomain holds most of the tasks, which is ADR-0016's case for a
    suite leaf the family does not have (logged).
  source: src-arxiv-2105-01051-v4
  quote: 'Ten tasks are presented here to investigate four aspects of speech: content, speaker, semantics,
    and paralinguistics'
capability:
  - perception
  - transfer-learning
capability_basis:
  perception:
    reason: Every task starts from raw audio and is scored on what was recovered from it -- phones,
      words, keywords, speakers, intents, slots or emotions.
    source: src-arxiv-2105-01051-v4
    quote: the former discriminates from continuous speech into discrete decisions like a match in
      query-by-example, words in ASR, and classes in speaker identification
  transfer-learning:
    reason: The model is pretrained once, then frozen and scored on ten tasks it was not trained
      for; how far the representation carries across them is what the benchmark reports.
    source: src-arxiv-2105-01051-v4
    quote: aiming to offer the community a standard and comprehensive testbed for evaluating the
      generalizability of pretrained models on various tasks covering all aspects of speech
capability_considered_and_rejected:
  - term: sample-efficiency
    reason: The tasks use limited labelled data by design, but no fixed sample budget is set and
      scored.

evaluation_method:
  - reference-metric
  - exact-match
  - classification-metric
  - domain-metric
evaluation_method_basis:
  reason: Each task keeps its own conventional metric -- phone and word error rate and slot-value
    CER (reference metrics), accuracy over fixed label sets (exact match), slot-type F1 (a
    classification statistic), and equal error rate, diarization error rate and MTWV
    (speech-processing measures).
  source: src-arxiv-2105-01051-v4
  quote: The evaluation metric is maximum term weighted value (MTWV) which balances misses and false
    alarms

lifecycle: active
lifecycle_basis:
  reason: The paper presents a long-term, continuously developed project with further tasks planned.
    Its state in 2026 was not read (the homepage did not answer); see the reviewer checks.
  source: src-arxiv-2105-01051-v4
  quote: SUPERB is a long-term maintained and continuously developing project
activity: unknown
activity_note: superbbenchmark.org did not answer on 2026-10-10; whether the leaderboard still takes
  submissions was not read.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: HuBERT
    source: src-arxiv-2105-01051-v4
    observed_on: 2026-10-10
    quote: HuBERT ranks the top one in QbE with MTWV 0.074
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The reference transcripts and labels of each constituent dataset's test
  split.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The datasets are public and the toolkit that runs every task is open source.
  source: src-arxiv-2105-01051-v4
  quote: All the materials are open-sourced and reproducible in s3prl toolkit

task:
  exists: true
  input:
    - one speech utterance (raw audio), or for query-by-example a pair of spoken query and audio
      document
  output: Per task -- a phone or word transcription, a keyword, intent or emotion class, a speaker
    identity or verification score, a speaker-per-frame diarization, slot types and values, or a
    query-document match.
  scoring: Each task on its own metric over its dataset's test split; the paper reports the ten
    separately.
  source: src-arxiv-2105-01051-v4
  quote: we freeze the parameters of pretrained models across tasks and extract fixed
    representations to be fed into each task-specialized prediction head (small downstream model)

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The paper chose publicly available datasets so that anyone can take part. The access
      terms of each constituent (IEMOCAP and VoxCeleb1 among them) were not read; see the reviewer
      checks.
    source: src-arxiv-2105-01051-v4
    quote: publicly available datasets for everyone to participate
  refresh: static
  refresh_basis:
    reason: One set of ten discriminative tasks in this release. The paper announces generative
      tasks as a later, second challenge; whether the task list changed since was not read.
    source: src-arxiv-2105-01051-v4
    quote: we plan to release generative tasks as the second challenge, like voice conversion and
      source separation
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: Every task reuses an existing dataset -- LibriSpeech, Speech Commands v1.0,
    QUESST 2014, VoxCeleb1, LibriMix, Fluent Speech Commands, Audio SNIPS and IEMOCAP -- each with
    its own provenance.
  data_provenance_source: src-arxiv-2105-01051-v4
  data_provenance_quote: We choose the widely used Speech Commands dataset v1.0
  contamination_risk: unknown
  contamination_risk_note: The test splits are public, and some pretrained models are trained on
    LibriSpeech audio; the paper makes no statement on overlap between pretraining data and the test
    splits.
  contamination_evidence: []
  size_note: The paper gives no item counts; each task's size is its constituent dataset's test
    split.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The SUPERB team (National Taiwan University, with MIT, Facebook AI Research, Johns
    Hopkins University, Amazon AI and Carnegie Mellon University)
  maintainer_basis:
    reason: The authors span these institutions; the toolkit is held in the s3prl organisation on
      GitHub. Which body holds the leaderboard was not read.
    source: src-arxiv-2105-01051-v4
    quote: We release SUPERB as a challenge with a leaderboard1 and a benchmark toolkit2
  maintainer_type: community-collective
  maintainer_type_note: The toolkit sits in a shared organisation account and the paper names no
    single holding institution; a reviewer who finds the leaderboard held by one lab should make
    this academic-lab.
  submission_process:
    - self-reported
  submission_process_note: The paper invites pretrained-model submissions and re-submitted results
    to the online leaderboard and states no check on them.
  submission_process_source: src-arxiv-2105-01051-v4
  submission_process_quote: we welcome researchers to re-submit the results to our online
    leaderboard
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2105-01051-v4
      quote: A. T. Liu, S.-w. Yang, P.-H. Chi, P.-c. Hsu, and H.-y. Lee
  independence_flags_note: The paper scores its own authors' models among the rest. Mockingjay and
    TERA come from the lead lab and sit in the same s3prl organisation as the toolkit (the quote is
    Mockingjay's author list), and HuBERT, which ranks first on several tasks, has two SUPERB
    authors among its own. Corrected on 2026-10-10, after entry 5 (ProteinGym) applied the flag to
    the same situation; it was first left empty.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Public datasets and an open toolkit that runs every task end to end.
    source: src-arxiv-2105-01051-v4
    quote: All the materials are open-sourced and reproducible in s3prl toolkit which supports to
      benchmark most existing and customized pretrained models
  harness_availability: official-harness
  harness: s3prl
  harness_source: src-arxiv-2105-01051-v4
  harness_quote: https://github.com/s3prl/s3prl
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The fallback profile carries the conditions every benchmark shares. Two more change a SUPERB number and
  # the paper fixes them per track: the harness (s3prl, its downstream heads and policies), and the track --
  # the constrained one, where the pretrained model is frozen, or the unconstrained one it announces.
  material_extra:
    - harness
    - eligibility_track

homepage: https://superbbenchmark.org/
repository: https://github.com/s3prl/s3prl

tags:
  - speech
  - self-supervised-learning
  - multi-task

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S3-T01)
  added_on: 2026-10-10
  last_verified: 2026-10-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2105-01051-v4
    - src-arxiv-2105-01051
  sources_note: >
    The paper's v4 PDF (a DOI, so not archived), read as text in reading order; its extract keeps windows
    around the cited passages, never the authors' contact line. The abstract page, snapshotted by the
    copilot, dates the release. superbbenchmark.org did not answer and was not read.
  confidence: medium
  notes: |
    Reviewer checks:
    - The leaderboard's state now (lifecycle, activity), and whether it publishes an aggregate across the ten
      tasks: aggregation_policy is left at its default only because the schema has no unknown, and the paper
      reports the tasks separately.
    - data.access fully-open rests on the paper's "publicly available datasets"; IEMOCAP's and VoxCeleb1's own
      terms may gate one task each, which would make it gated-registration.
    - designed_for_subjects is left empty: a frozen self-supervised encoder scored through trained heads is neither
      base-model (no continuation) nor task-specific-supervised-model (not trained for one task); logged as a
      vocabulary gap.
    - Domain: no audio-speech suite leaf exists (ADR-0016's pattern); logged.

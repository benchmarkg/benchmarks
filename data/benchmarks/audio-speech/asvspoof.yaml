# data/benchmarks/audio-speech/asvspoof.yaml
#
# P1-S7-T04, audio-speech entry 15. Filled from asvspoof.org: the home page, the 2015, 2017, 2019 and 2021 challenge
# pages (scripts and styles stripped) and the ASVspoof 5 Phase 2 evaluation plan (v0.6, its PDF); the ASVspoof 5
# results paper, arXiv 2601.03944, read as its v3 PDF (IEEE TASLP 2026), and its abstract page; the abstract pages
# of the ASVspoof 5 workshop summary (arXiv 2408.08739), the ASVspoof 5 database paper (arXiv 2502.08857), the
# ASVspoof 2021 summary (arXiv 2210.02437) and the ASVspoof 2019 database paper (arXiv 1911.01601); Zenodo's record
# of the ASVspoof 5 database and its README.txt; and the v1 PDF of arXiv 2609.11763 (September 2026), a paper that
# reports results on ASVspoof 2019, 2021 and 5. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# asvspoof.org's robots.txt disallows only Drupal's admin, login, search and core paths, so the pages above were
# fetched. The editions' CodaLab competitions were not read. The entry is the challenge series as one benchmark:
# its five editions are versions and its sub-challenges and tracks are subsets.

id: asvspoof
name: ASVspoof
aliases:
  - Automatic Speaker Verification Spoofing and Countermeasures Challenge
  - ASVspoof 5
  - ASVspoof 2019
  - ASVspoof 2021
tagline: Community challenge on detecting spoofed and deepfake speech and on spoofing-robust speaker
  verification, 2015-2024.
description: >
  The Automatic Speaker Verification Spoofing and Countermeasures Challenge, a community-led series begun
  after an Interspeech special session in 2013 and run in 2015, 2017, 2019, 2021 and 2024 (ASVspoof 5)
  by an organising committee from EURECOM, the National Institute of Informatics, the University of Eastern
  Finland and others. Participants build countermeasures that give each speech utterance a score for bona
  fide against spoofed speech, or spoofing-robust speaker verification systems that must accept only the
  claimed speaker's genuine speech. 2015 scored detection of speech synthesis and voice conversion; 2017
  replay attacks; 2019 logical access (synthesis and conversion, with neural attacks) and simulated physical
  access (replay); 2021 logical access over telephony channels, physical access in real rooms and a new
  speech deepfake task over compressed audio. ASVspoof 5 moved to crowdsourced data from about 2,000 speakers
  with 32 attack algorithms, adversarial attacks and codecs, and to two tracks (stand-alone detection;
  spoofing-robust ASV), each with closed and open training conditions. Evaluation audio is released without
  keys and scored by the organisers, who rank by a detection cost (t-DCF from 2019; minDCF and a-DCF in
  ASVspoof 5); the keys are released afterwards. ASVspoof 5 drew 53 teams.
self_description:
  source: src-asvspoof5-evalplan-phase2
  quote: challenge series is a community-led initiative which aims to promote the consideration of
    spoofing and speech deepfakes
external_ids:
  arxiv: '2601.03944'
paper:
  title: 'ASVspoof 5: Evaluation of Spoofing, Deepfake, and Adversarial Attack Detection Using Crowdsourced
    Speech'
  arxiv: '2601.03944'
  doi: 10.1109/TASLPRO.2026.3682962
  version_read: v3
  source: src-arxiv-2601-03944-v3
released: 2014-12-16
released_note: The first edition's development materials, as the 2015 page dates them; its
  evaluation data followed on 6 February 2015 and its results at Interspeech 2015.
released_source: src-asvspoof-index2015
released_quote: 16th December 2014 Release development materials
release_venue: Interspeech 2015
release_venue_source: src-asvspoof-index2015
release_venue_quote: The first evaluation, ASVspoof 2015, is being held within the scope of a
  special session at INTERSPEECH 2015 and with a focus on spoofing detection.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speaker-tasks
domain_basis:
  reason: The series exists to protect automatic speaker verification. Every edition scores
    countermeasures against spoofed speech presented to a speaker verifier, the tandem metric from
    2019 scores them with a fixed ASV system, and ASVspoof 5's Track 2 scores spoofing-robust
    speaker verification itself, which the leaf's 'verifying' names. Stand-alone detection (Track 1,
    the 2021 DF task) decides nothing about who is speaking and has no leaf; that gap is logged.
  source: src-asvspoof5-evalplan-phase2
  quote: 'ASVspoof is centred around the challenges to design: (1) spoofing-robust automatic speaker verification
    (SASV) solutions; (2) stand-alone speech deepfake detectors.'
domain_considered_and_rejected:
  - term: audio-speech/audio-event-understanding
    reason: Bona fide against spoofed is not a sound event present in the recording; the classes are
      the speech's origin (a live speaker, synthesis, conversion, replay), not its acoustic content.
  - term: audio-speech/speech-synthesis
    reason: Synthesis and conversion systems make the attacks, but in ASVspoof 5 they were built by
      data contributors in Phase 1 and are not ranked; what is scored is detection.
  - term: safety-alignment/jailbreak-robustness
    reason: The family scores an AI system's own conduct or hazardous capability. ASVspoof scores a
      detector's error rates against attacks on a biometric system, a security property of
      verification rather than a model's behaviour; there is no security family.
  - term: agents-tooluse/cybersecurity-offense-defense
    reason: That leaf is agentic work on software vulnerabilities; ASVspoof's entrants are
      classifiers scored on audio, with no environment or tool use.
  - term: multimodal/audio-language
    reason: Nothing relates audio to text; the input is speech and the output a score.
capability:
  - perception
  - adversarial-robustness
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: The input is a raw speech waveform and the score measures what was recovered from it,
      whether the speech is bona fide and, in Track 2, whether it is the target speaker's.
    source: src-arxiv-2601-03944-v3
    quote: Track 1 involves a stand-alone spoof/deepfake speech detection task (bonafide versus
      spoof)
  adversarial-robustness:
    reason: The attacks are made by an adversary to defeat the system. In ASVspoof 5 the data
      contributors tuned their attacks against surrogate countermeasure and ASV systems, and seven
      of the sixteen evaluation attacks are adversarial attacks aimed at the CM, the ASV system or
      both; the score is the detector's resistance.
    source: src-arxiv-2601-03944-v3
    quote: Among the 16 attacks in the evaluation set, seven are adversarial attacks designed to
      manipulate the CM, ASV system, or both.
  distribution-shift-generalization:
    reason: Beyond the attacks (which are adversarial), the evaluation sets move the channel
      deliberately and report it as conditions of their own. ASVspoof 5 encodes part of the
      evaluation set only with MP3, Opus, AMR, Speex, M4A, Encodec and simulated telephony; the 2021
      LA task added transmission channels, the DF task compression, and the PA task real rooms after
      simulated training data. The bona fide-or-spoof task is unchanged.
    source: src-arxiv-2601-03944-v3
    quote: a portion of bona fide and spoofed utterances in only the evaluation set are encoded or
      compressed
capability_considered_and_rejected:
  - term: calibration-uncertainty
    reason: ASVspoof 5 reports actDCF and Cllr, which read the scores as log-likelihood ratios, and
      encouraged calibrated scores for the first time, but did not require them, and the ranking
      metric (minDCF) is unaffected by calibration.
  - term: transfer-learning
    reason: Unseen attacks and codecs keep the task and its two classes; only the inputs move.

evaluation_method:
  - domain-metric
  - classification-metric
evaluation_method_note: >
  The ranking metric is a detection cost from the speaker-recognition field: the tandem detection cost
  function (t-DCF), joining the countermeasure to a fixed ASV system, from 2019 and in 2021's LA and PA
  tasks; minDCF with ASVspoof 5's costs and priors in Track 1; and the architecture-agnostic a-DCF in
  Track 2 (domain-metric). The equal error rate, an operating point of the score ranking, was the 2015
  and 2017 measure and the 2021 DF task's, and is reported beside the costs (classification-metric). actDCF
  and Cllr are reported, not ranked.
evaluation_method_basis:
  reason: ASVspoof 5 moved Track 1 from EER to a detection cost function, and Track 2 ranks by the
    minimum a-DCF; EER is kept for continuity with earlier editions.
  source: src-arxiv-2601-03944-v3
  quote: the detection cost function (DCF) [49] metric was adopted for performance evaluation
evaluation_method_considered_and_rejected:
  - term: adversarial-red-team
    reason: The reported number is a detection cost over a fixed set of attacks frozen with each
      edition, not an attack success rate whose denominator moves when an attack is published.
  - term: uncertainty-calibration-score
    reason: Cllr scores the submitted values as log-likelihood ratios, but it is reported beside the
      ranking metric, not used for ranking.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants are countermeasures and spoofing-robust speaker verification systems trained for
    the task, on the edition's training partition alone in the closed condition; the open condition
    admits pretrained speech foundation models, fine-tuned and scored as trained systems.
  source: src-arxiv-2601-03944-v3
  quote: For the open condition, wav2vec2 and WavLM models are utilised by all the top submissions.
designed_for_subjects_considered_and_rejected:
  - term: attack-or-intervention-method
    reason: The attacks are supplied by the organisers and data contributors and are not ranked;
      only the detectors are.
as_used:
  - protocol: Outside the challenge protocol, countermeasures are trained on the ASVspoof 2019 LA
      training set and scored by EER on the ASVspoof 2019, 2021 and 5 evaluation sets as
      cross-dataset tests, not by each edition's ranking metric or rules.
    split: ASVspoof 2019 LA, 2021 and ASVspoof 5 evaluation sets
    source: src-arxiv-2609-11763-v1
    quote: Experiments on ASVspoof 2019, 2021, ASVspoof 5, and Fake-orReal show improved overall
      robustness
    note: Singh, Mahapatra, Ulgen, Andrews, Lee and Sisman (Johns Hopkins University and The Hong
      Kong Polytechnic University), September 2026, accepted to IEEE SLT 2026 by arXiv's metadata.
      Kong Aik Lee is an ASVspoof organiser.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. A September 2026 paper reports EER on
    the ASVspoof 2021 and ASVspoof 5 evaluation sets, and the ASVspoof 5 results paper was revised
    in April 2026 for TASLP with a review of post-challenge results.
  source: src-arxiv-2609-11763-v1
  quote: reducing overall EER from 3.04% to 1.48% on ASVspoof 2021, from 25.43% to 21.04% on
    ASVspoof 5
activity: between-rounds
activity_note: The ASVspoof 5 workshop was on 31 August 2024 and its results are published. The
  organisers' April 2026 paper speaks of future editions but gives no date, and the home page (read
  2026-11-05) still leads with ASVspoof 5. Editions were 'previously-biennial', so by that rhythm a
  2026 edition would have been due. Whether the editions' CodaLab competitions still take
  post-evaluation submissions was not read; if one does, activity is leaderboard-live-no-round.
activity_basis:
  reason: The series runs in editions, the last one's results are out, no round is open, no standing
    board is shown to take results, and the next edition is promised but not dated.
  source: src-arxiv-2601-03944-v3
  quote: Future editions of ASVspoof must hence continue the search for better-generalisable
    detection solutions.
events:
  - name: ASVspoof Workshop 2024 (ASVspoof 5), Interspeech 2024 satellite, 31 August 2024
    kind: workshop
    source: src-asvspoof-home
    quote: ASVspoof Workshop 2024, Interspeech 2024 August 31, 2024

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The top ASVspoof 5 open-condition submissions (wav2vec2 and WavLM front-ends with neural
      back-ends)
    source: src-arxiv-2601-03944-v3
    observed_on: 2026-11-05
    quote: For the open condition, wav2vec2 and WavLM models are utilised by all the top
      submissions.
  - system: A curriculum-trained speech deepfake detector, scored on ASVspoof 2021 and ASVspoof 5
    source: src-arxiv-2609-11763-v1
    observed_on: 2026-11-05
    quote: reducing overall EER from 3.04% to 1.48% on ASVspoof 2021, from 25.43% to 21.04% on
      ASVspoof 5
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The keys (bona fide or spoof, the attack, and in Track 2 target,
  non-target or spoof) are fixed by construction, since the organisers and data contributors made
  every spoof. They are withheld while an edition runs and released after it.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every edition's evaluation keys are public now, and the organisers publish reference
    implementations of the metrics, so any result can be rescored locally.
  source: src-asvspoof5-evalplan-phase2
  quote: Reference implementations of the metrics are included in the evaluation package

task:
  exists: true
  input:
    - one speech utterance (countermeasure tasks; ASVspoof 5 Track 1)
    - a test utterance with enrolment utterances of a claimed target speaker (2019-2021 LA and PA
      with the organisers' ASV system; ASVspoof 5 Track 2)
  output: A single real-valued score per utterance or trial, higher for bona fide (or for the target
    speaker), each item scored independently of the others.
  scoring: The organisers set the decisions and compute the edition's metrics from the score files.
    2015 and 2017 by EER; 2019 and 2021 by min t-DCF with EER (EER alone for 2021 DF); ASVspoof 5
    Track 1 by minDCF with actDCF, Cllr and EER, Track 2 by min a-DCF with min t-DCF and t-EER. Each
    task, track and condition is ranked separately.
  source: src-asvspoof5-evalplan-phase2
  quote: Each test sample must be scored independently of each other

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: During each edition the data came after registration; the 2019 and earlier databases
    are on Edinburgh DataShare and the 2021 and ASVspoof 5 databases on Zenodo. Only the ASVspoof 5
    Zenodo record and the 2021 page's links were read; the DataShare records were not.
  access_basis:
    reason: The completed editions' evaluation data are public with their keys. ASVspoof 5's
      evaluation protocol files on Zenodo carry the key for every utterance and trial; the 2021 keys
      and metadata were released after that challenge, and the 2015 and 2017 keys months after
      theirs.
    source: src-zenodo-14498691-readme
    quote: ASVspoof5.eval.track_1.tsv list of evaluation set utterances, keys, and other
      information.
  access_by_phase:
    during_edition: train-open-test-held-out. Registered participants receive training and
      development data with keys and the evaluation audio without them, and submit score files for
      the organisers to score.
    during_edition_source: src-asvspoof-index2019
    during_edition_quote: 15th February, 2019 Evaluation data 22nd February, 2019 Scores submission
    after_edition: fully-open. The keys and metadata are released after each challenge.
    after_edition_source: src-asvspoof-index2021
    after_edition_quote: We are pleased to announce the release of the keys and detailed metadata
      for the ASVspoof 2021 logical access (LA), physical access (PA) and deepfake (DF) databases
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each edition is ranked on evaluation data new to it. 2021 kept the 2019 training and
      development data but released new evaluation data for each task; ASVspoof 5 built a new
      database whose evaluation attacks are disjoint from the training and development attacks.
    source: src-asvspoof-index2021
    quote: While no new training and no new development data will be released, new evaluation data
      will be released for each of the three conditions.
  data_provenance:
    - inherited-from-constituents
    - model-generated
    - simulation-generated
    - real-world-instrument
  data_provenance_note: >
    The bona fide speech is taken from existing corpora: VCTK for 2015, 2019 and 2021, the English partition
    of Multilingual LibriSpeech (crowdsourced LibriVox audiobook recordings) for ASVspoof 5 (inherited-from-constituents).
    The spoofs of the LA, DF and ASVspoof 5 data are produced by speech synthesis, voice conversion and
    adversarial models, in ASVspoof 5 by crowdsourced data contributors (model-generated). The 2019 PA
    replays are simulated with room and device models (simulation-generated, src-arxiv-1911-01601); the
    2017 replays of RedDots recordings and the 2021 PA data are replayed and re-recorded in real rooms
    (real-world-instrument, src-asvspoof-index2017, src-asvspoof-index2021).
  data_provenance_source: src-arxiv-2601-03944-v3
  data_provenance_quote: the ASVspoof 5 database is constructed from the English partition of the
    Multilingual Librispeech (MLS) database
  contamination_risk: medium
  contamination_risk_note: >
    The evaluation audio and keys of every completed edition are public, and later papers train on one
    edition and test on another. The source corpora are public too, and pretrained speech models can have
    seen them: ASVspoof 5's open condition forbids models pretrained on LibriLight or MLS because they
    hold the evaluation speakers, a rule the participants certify in their system descriptions and that
    no source says is checked. No source measures contamination.
  contamination_risk_source: src-arxiv-2601-03944-v3
  contamination_risk_quote: Those pre-trained using LibriLight [42], however, are non-compliant
    since this database contains data collected from speakers included in the ASVspoof 5 evaluation
    partition.
  contamination_evidence: []
  ceiling_anchor_type_note: No human or measured ceiling is given. The 2019 database paper reports a
    human assessment showing some spoofs that listeners cannot tell from bona fide speech, which is
    not a ceiling on the detectors' metric.
  dataset_licence: ODC-By-1.0
  dataset_licence_note: The Open Data Commons Attribution Licence, from the ASVspoof 5 Zenodo record
    (src-zenodo-14498691) and the 2021 page, which says the 2021 databases are under it. Zenodo's
    search listing (read 2026-11-05, not a quoted Source) shows the 2021 DF record as ODC-ODbL. The
    2015, 2017 and 2019 DataShare records' licences were not read, and the bona fide source corpora
    (VCTK, MLS) keep their own terms.
  size:
    - count: 680774
      unit: evaluation utterances (138,688 bona fide and 542,086 spoofed, from 16 attacks)
      subset: ASVspoof 5, Track 1
      source: src-zenodo-14498691-readme
      quote: 'flac_E_*.tar: 681872 utterances = 680774 in ASVspoof5.eval.track_1.tsv'
    - count: 834536
      unit: lines of the evaluation trial list (target, non-target and spoof trials)
      subset: ASVspoof 5, Track 2
      source: src-zenodo-14498691-readme
      quote: ASVspoof5.eval.track_2.trial.tsv 834536
    - count: 182357
      unit: training utterances
      subset: ASVspoof 5, training partition
      source: src-zenodo-14498691-readme
      quote: 'flac_T_*.tar: 182357 utterances'
    - count: 32
      unit: attack algorithms across the database's partitions
      subset: ASVspoof 5 database
      source: src-arxiv-2502-08857
      quote: The database contains attacks generated with 32 different algorithms
  languages:
    - English
  submission_limit:
    max_submissions: 1
    period_days: 0
    per: team, track and condition, in the ASVspoof 5 evaluation phase
    source: src-asvspoof5-evalplan-phase2
  submission_limit_note: ASVspoof 5's progress phase took up to four submissions a day, scored on a
    subset of trials; the evaluation phase one. The 2015 and 2017 rules allowed up to six score
    files per team, one of them primary.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ASVspoof organising committee (the 'ASVspoof consortium'), from EURECOM, the
    National Institute of Informatics, the University of Eastern Finland and others
  maintainer_basis:
    reason: The evaluation plan is issued by the 'ASVspoof consortium' and calls the series
      community-led. A core of organisers from EURECOM, NII and UEF recurs on every edition's list,
      joined by others from academia and industry (Microsoft, Pindrop and KLASS on ASVspoof 5's).
    source: src-asvspoof5-evalplan-phase2
    quote: challenge series is a community-led initiative which aims to promote the consideration of
      spoofing and speech deepfakes
  maintainer_type: community-collective
  maintainer_type_note: The 'consortium' has no stated legal form, so `consortium` does not apply.
    conference-workshop was considered, as each edition is held with Interspeech or as its satellite
    and the committee changes, but the same core organisers run every edition and hold the site, the
    repositories and the data. No single institution holds the series.
  submission_process:
    - held-out-server
  submission_process_note: >
    Participants submit score files for evaluation audio whose keys they cannot see, and the organisers
    score them: by e-mail to the organisers in 2015 and 2017, and on CodaLab, one competition per track
    and condition with an anonymous leaderboard, in 2021 and ASVspoof 5. publication-gated was considered
    and rejected: ASVspoof 5 requires a system description from every team, but the results paper ranks
    submissions without one, unnamed. Participants may not publish comparisons with other teams' results.
  submission_process_source: src-asvspoof5-evalplan-phase2
  submission_process_quote: The two challenge tracks and the open/closed conditions are each
    organized under separate CodaLab competitions
  independence_flags: []
  independence_flags_note: Not assessed. The home page shows its funding agencies only as logos, so
    the funding flags could not be assessed. ASVspoof 5's organisers include staff of Pindrop and
    Microsoft; whether their companies entered is unknown, because team identities are not
    disclosed. No prizes were found.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: With the evaluation keys public and the metric code released, anyone can score a new
      countermeasure on any completed edition end to end. During an edition the keys are held back.
    source: src-zenodo-14498691-readme
    quote: 'ASV_KEY: target, nontarget, or spoof ASV label'
  harness_availability: official-harness
  harness: The organisers' evaluation package in asvspoof-challenge/asvspoof5 (minDCF, actDCF, Cllr,
    EER, a-DCF, t-DCF, t-EER) and the 2021 repository's EER and min t-DCF scripts with the
    baselines.
  harness_source: src-asvspoof5-evalplan-phase2
  harness_quote: Reference implementations of the metrics are included in the evaluation package
  submission_channel:
    source: src-asvspoof5-evalplan-phase2
    quote: The ASVspoof 5 evaluation platform is implemented using CodaLab
  code_licence: null
  code_licence_note: The asvspoof-challenge repositories were not read, so their licences are not
    recorded.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and which task, track and condition (the attacks, codecs and metrics
  # change with each, and results on 2019 LA are not comparable with 2021 LA or ASVspoof 5 Track 1), the training
  # data policy (closed against open, and whether a foundation model is used, which the organisers call unfair to
  # compare), and the scoring code (the t-DCF depends on the organisers' fixed ASV scores and its cost parameters).
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each track and each condition is its own competition and ranking, and nothing combines
    them.
  source: src-asvspoof5-evalplan-phase2
  quote: The two challenge tracks and the open/closed conditions are each organized under separate
    CodaLab competitions

homepage: https://www.asvspoof.org/
repository: https://github.com/asvspoof-challenge/asvspoof5
dataset_url: https://zenodo.org/records/14498691
leaderboard_url: null


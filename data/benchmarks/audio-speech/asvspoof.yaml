curation:
  added_by: agent (P1-S7-T04)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-asvspoof-home
    - src-asvspoof5-evalplan-phase2
    - src-asvspoof-index2015
    - src-asvspoof-index2017
    - src-asvspoof-index2019
    - src-asvspoof-index2021
    - src-arxiv-2601-03944-v3
    - src-arxiv-2601-03944
    - src-arxiv-2408-08739
    - src-arxiv-2502-08857
    - src-arxiv-2210-02437
    - src-arxiv-1911-01601
    - src-zenodo-14498691
    - src-zenodo-14498691-readme
    - src-arxiv-2609-11763-v1
  sources_note: >
    asvspoof.org's home page, the four edition pages and the ASVspoof 5 Phase 2 evaluation plan, each
    holding organisers' names or contact addresses and so withheld from archiving; the ASVspoof 5 results
    paper's v3 PDF and abstract page; the abstract pages of the ASVspoof 5 workshop and database papers,
    the 2021 summary and the 2019 database paper; Zenodo's ASVspoof 5 record and README (DOI sources,
    not archived); and the v1 PDF of arXiv 2609.11763 as evidence of current use.
  confidence: medium
  review_checks:
    - check: domain.primary is speaker-tasks, which fits Track 2 and the tandem LA and PA tasks but
        not stand-alone detection (2015, 2017, 2021 DF, Track 1), which decides nothing about who is
        speaking. No leaf anywhere covers spoofing or deepfake detection, and there is no security
        family; a missing-term gap is logged proposing a detection leaf. Should the primary instead
        wait for that leaf?
      field: domain.primary
      source: src-arxiv-2601-03944-v3
      quote: There are two tasks, namely the design of stand-alone CMs (spoof/deepfake speech
        detectors) and of spoofing-robust ASV systems.
    - check: activity between-rounds rests on the absence of any announced edition and on no
        standing board being shown. The editions' CodaLab competitions (2021, ASVspoof 5) were not
        read; if any keeps a post-evaluation phase open, activity is leaderboard-live-no-round. With
        editions 'previously-biennial' and none in 2026, a reviewer may judge the series closed
        instead.
      field: activity
      source: src-asvspoof5-evalplan-phase2
      quote: ASVspoof 5 is the fifth edition in a series of previously-biennial, competitive
        challenges
    - check: maintainer_type community-collective or conference-workshop. Each edition is held with
        Interspeech or as its satellite and the committee grew from four to thirteen, but a core
        from EURECOM, NII and UEF runs every edition.
      field: governance.maintainer_type
    - check: The entry is the five-edition series, with LA, PA and DF and ASVspoof 5's tracks as
        subsets. ASVspoof 2019 LA is so widely used as a standing training and test set that it
        could be argued as its own entry; it is the same maintainer's frozen edition, which the
        counting rule keeps as a version. The SASV 2022 challenge (spoofing-aware speaker
        verification, built on ASVspoof 2019 LA, with overlapping organisers) is not covered and
        would be its own entry or a lineage variant.
      field: versions
    - check: adversarial-robustness is tagged because spoofing attacks are made by an adversary and
        ASVspoof 5's attacks were tuned against surrogate detectors, with seven adversarial attacks;
        distribution-shift-generalization rests on the codec and channel conditions only, since the
        vocabulary sends adversarially made shifts to adversarial-robustness.
      field: capability
      source: src-asvspoof5-evalplan-phase2
      quote: Spoofing/deepfake attacks are expected to be more adversarial than in previous editions
        of ASVspoof and to fool both ASV and CM surrogate subsystems.
    - check: calibration-uncertainty and uncertainty-calibration-score were rejected because Cllr
        and actDCF are reported but not ranked. The organisers say calibration-sensitive metrics may
        become primary in future editions.
      field: evaluation_method
      source: src-arxiv-2601-03944-v3
      quote: Note, however, that any order-preserving score calibration does not affect the primary
        minDCF metric.
    - check: data.access fully-open assumes the 2015, 2017 and 2019 DataShare records serve the data
        and keys without registration; they were not read, and the 2015 page describes a username
        and password scheme from the challenge period. dataset_licence ODC-By-1.0 is read from the
        ASVspoof 5 record and the 2021 page only.
      field: data.access
      source: src-asvspoof-index2019
      quote: '5th June: Database Release via Edinburgh DataShare.'
    - check: independence was not assessed. The funders appear only as logos, team identities are
        withheld, and industry organisers (Pindrop, Microsoft) could have entered.
      field: governance.independence_flags
      source: src-arxiv-2601-03944-v3
      quote: As per ASVspoof Challenge policy, neither the team name nor the names of team members
        can be revealed.
    - check: The edition released dates are each edition's first data release as its own page dates
        it (2016-12-23 for 2017 and 2018-12-19 for 2019 from the schedules), and ASVspoof 5's is
        Phase 2's opening (Phase 1 opened on 1 July 2023 for data contributors). The 2021 date is
        the Zenodo release of 28 May 2021.
      field: versions
      source: src-asvspoof-home
      quote: Phase 1 - registration opens July 1, 2023
  personal_data_excluded:
    - source: src-asvspoof-home
      what: the organisers' contact e-mail address and the list of organisers with their employers
    - source: src-asvspoof5-evalplan-phase2

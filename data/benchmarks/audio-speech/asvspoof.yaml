subsets:
  - id: asvspoof#logical-access
    label: Logical access (2019-2021; 2015 as its precursor)
    scored_separately: true
    evidence:
      - source: src-arxiv-1911-01601
        quote: The ASVspoof 2019 edition is the first to consider all three spoofing attack types
          within a single challenge.
      - source: src-asvspoof5-evalplan-phase2
        quote: The latter shares the same goal as the LA sub-task of previous ASVspoof editions
    notes: Synthesised and converted speech injected after the microphone, scored with the
      organisers' ASV system by min t-DCF. The 2015 edition's synthesis and conversion detection is
      its precursor, and ASVspoof 5's Track 2 continues its goal.
  - id: asvspoof#physical-access
    label: Physical access, replay (2017-2021)
    scored_separately: true
    evidence:
      - source: src-asvspoof-index2017
        quote: 'Theme in the 2017 edition: Audio replay attack detection'
      - source: src-asvspoof-index2021
        quote: a physical access sub-challenge similar to the 2019 setup, but with recordings made
          in real physical environments
    notes: Replayed recordings, real in 2017 and 2021 and simulated in 2019. ASVspoof 5 left replay
      out of scope.
  - id: asvspoof#deepfake
    label: Speech deepfake detection (2021)
    scored_separately: true
    evidence:
      - source: src-arxiv-2210-02437
        quote: The Deepfake (DF) task, new to the 2021 edition, targets solutions to the detection
          of manipulated, compressed speech data posted online.
    notes: Stand-alone detection with no ASV, on compressed audio, ranked by EER. ASVspoof 5's Track
      1 continues it.
  - id: asvspoof#track-1
    label: Stand-alone spoofing and deepfake detection (ASVspoof 5 Track 1)
    scored_separately: true
    evidence:
      - source: src-asvspoof5-evalplan-phase2
        quote: similar in spirit to the DF task in ASVspoof 2021
    notes: One score per utterance, ranked by minDCF, in a closed and an open condition.
  - id: asvspoof#track-2
    label: Spoofing-robust automatic speaker verification (ASVspoof 5 Track 2)
    scored_separately: true
    evidence:
      - source: src-arxiv-2601-03944-v3
        quote: The primary metric for Track 2 is the minimum a-DCF
    notes: Target, non-target and spoof trials against enrolment utterances, with any architecture
      or a CM joined to the organisers' ASV system; a closed and an open condition. Its evaluation
      set leaves out the non-telephony codecs.

history:
  - event: channel-moved
    field: execution.submission_channel
    from: score files e-mailed to the organisers (2015, 2017)
    to: CodaLab competitions with anonymous leaderboards (2021, ASVspoof 5)
    source: src-asvspoof-index2021
    quote: 1st June CodaLab leaderboards online
    note: The 2019 route was not read; the 2015 and 2017 pages give e-mail submission.
  - date: 2024-12-18
    event: access-changed
    field: data.access
    from: train-open-test-held-out
    to: fully-open
    source: src-zenodo-14498691-readme
    quote: ASVspoof5.eval.track_1.tsv list of evaluation set utterances, keys, and other
      information.
    note: The ASVspoof 5 database with its evaluation keys was published on Zenodo (record dated 18
      December 2024). Earlier editions made the same change after their own challenges.


  - version: 2021b
    label: Zero Resource Speech Challenge 2021, NeurIPS round
    version_kind: edition
    changes: A second round of the 2021 benchmark as a NeurIPS 2021 competition, adding a visually
      grounded training track (speech with images or video, tested on speech alone); session on 10
      December 2021. The review counts it as the sixth edition.
    breaking: true
    supersedes_version: '2021'
    superseded_by: '2023'
    frozen: true
    sources:
      - src-zerospeech-news
      - src-arxiv-2210-15759-v1
  - version: '2023'
    label: Zero Resource Speech Benchmark (standing benchmarks)
    version_kind: revision
    changes: The evaluations become four permanent benchmarks not tied to challenge events, the
      datasets are republished with gold data, the zrc toolkit evaluates locally, and the in-house
      submission system replaces CodaLab; ABX-LS gains context-invariance conditions and Task 4
      gains ProsAudit (February 2023).
    breaking: false
    supersedes_version: 2021b
    frozen: false
    sources:
      - src-zerospeech-news
      - src-zerospeech-home
      - src-zerospeech-task4
      - src-zerospeech-leaderboard-abxls
      - src-zerospeech-leaderboard-prosaudit

subsets:
  - id: zerospeech#abx-15
    label: ABX-15 (Task 1, acoustic unit discovery, 2015)
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: English (Buckeye) Xitsonga (NCHLT) conversations
    notes: Within- and across-speaker ABX error on English (Buckeye) and Xitsonga, with the training
      set as the test set. Buckeye is not redistributed by the toolkit.
  - id: zerospeech#tde-15
    label: TDE-15 (Task 2, spoken term discovery, 2015)
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: Grouping F-score Type F-score Token F-score
    notes: Matching (NED, coverage), clustering (grouping F-score) and segmentation (type, token and
      boundary F-scores) on the 2015 data.
  - id: zerospeech#abx-17
    label: ABX-17 (Task 1, 2017; rerun in 2020)
    scored_separately: true
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: ABX-15 used the training set as test set, while the ABX-17 introduced a separate test
          set with new speakers
    notes: ABX on the 2017 languages with a test set of new speakers.
  - id: zerospeech#tde-17
    label: TDE-17 (Task 2, 2017; rerun in 2020)
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: Benchmark ABX-15, TDE-15 ABX-17, TDE-17 TTS0-19 reboot of 2017 & 2019 ABX-LS, sLM-21
          (sWUGGY, sBLIMP, sSIMI)
    notes: Term discovery on the 2017 languages, where the test set is the training set.
  - id: zerospeech#tts0-19
    label: TTS0-19 (Task 3, discrete resynthesis, "TTS without T", 2019; rerun in 2020)
    scored_separately: true
    domain_override:
      primary: audio-speech/speech-synthesis
    capability_override:
      - perception
      - generation-fidelity
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: 'MOS: human evaluation'
    notes: Discover units from unlabelled speech, then resynthesise a target voice from them; scored
      by human evaluation (MOS, intelligibility) and by the units' bitrate, plus an ABX on the
      units. Not open for new submissions since 2023 (the news page lists Tasks 1, 2 and 4 as open).
  - id: zerospeech#abx-ls
    label: ABX-LS (Task 1, LibriSpeech, 2021-)
    scored_separately: true
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: The more recent benchmark (ABX-LS) uses the full LibriSpeech (960h) as training set,
          and introduced a separate dev and test set
      - source: src-zerospeech-leaderboard-abxls
        quote: '"updatedOn": "2023-01-10T15:05:38.853487"'
    notes: ABX within and across speakers on LibriSpeech dev and test (clean and other); a v2
      leaderboard with phonemic context-invariance conditions since January 2023.
  - id: zerospeech#slm-21
    label: sLM-21 (Task 4, spoken language modelling, 2021-)
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: participants can use other training sets so long as no labels is provided besides
          speaker ID
    notes: Three zero-shot probes reported side by side; Task 4 entries are split into low and high
      budget by the GPU hours used to train the language model.
  - id: zerospeech#swuggy
    label: sWUGGY (lexical, spot-the-word)
    parent: zerospeech#slm-21
    items: 20000
    scored_separately: true
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: one legal (a), one illegal (b); the chance level is 0.5.
    notes: Accuracy at preferring the real word to a matched nonword; an OOV variant uses words
      absent from LibriSpeech training.
  - id: zerospeech#sblimp
    label: sBLIMP (syntactic acceptability)
    parent: zerospeech#slm-21
    items: 63000
    scored_separately: true
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: The dev and test sets contain 6,300 and 63,000 pairs respectively, with no sentence
          pair overlap.
  - id: zerospeech#ssimi
    label: sSIMI (lexical semantics)
    parent: zerospeech#slm-21
    items: 9744
    scored_separately: true
    evidence:
      - source: src-arxiv-2210-15759-v1
        quote: The Spearman rank correlation is calculated between the dissimilarity scores provided
          in the submission test set (sSIMI)
    notes: Weighted average of Spearman correlations over 12 test datasets, on synthetic and
      LibriSpeech-extracted subsets.
  - id: zerospeech#prosaudit
    label: ProsAudit (Task 4, prosody, 2023)
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-zerospeech-task4
        quote: 'Prosody : the ProsAudit metrics'
      - source: src-zerospeech-leaderboard-prosaudit
        quote: '"last_modified": "2023-02-24T14:03:47.969888"'
    notes: Added after the review, with protosyntax and lexical prosody conditions; its eight rows
      are the organisers' GSLM runs, entered on 2023-02-24.
subsets_note: >
  The subsets are the standing benchmarks the site keeps leaderboards for, with sLM-21's three probes
  as children. A Task 1 entry usually reports ABX-LS and a Task 4 entry sLM-21; the editions that introduced
  each are in versions. TTS0-19 alone carries a domain_override. Every subset carries its own capabilities,
  and each capability_override drops the family terms that belong to other subsets on purpose: the family
  list is a union over them. The visually grounded condition of the 2021 NeurIPS round is a training-data
  condition on sLM-21 and ABX-LS, not a subset.

history:
  - event: channel-moved
    field: execution.submission_channel
    from: CodaLab competitions (2020 and 2021 editions)
    to: the in-house zerospeech.com upload system with local accounts
    source: src-zerospeech-news
    quote: no need to use codalab anymore
    note: Announced with the new site; the in-house system was to open in February 2023.
  - event: channel-moved
    field: execution.submission_channel
    from: the in-house upload API
    to: e-mail to the organisers
    source: src-zerospeech-toolbox
    quote: The upload API is disabled
    note: Not dated. The toolkit's README still calls its submit function work in progress at its
      last commit (2024-07-08).
  - date: 2023-01
    event: access-changed
    field: data.access
    from: test audio released without gold data; scores computed by the organisers
    to: fully-open, gold data republished for local evaluation
    source: src-zerospeech-news
    quote: Republishing datasets containing gold data to allow local evaluation
    note: Dated by the news item announcing the new site and benchmarks (January 2023); the date is
      printed beside the item, not quoted.


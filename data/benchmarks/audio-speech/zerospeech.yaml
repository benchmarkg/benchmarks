# data/benchmarks/audio-speech/zerospeech.yaml
#
# P1-S7-T04, audio-speech entry 16. Filled from the series review "Self-supervised language learning from raw audio:
# Lessons from the Zero Resource Speech Challenge" (IEEE JSTSP 2022), read as the v1 PDF of arXiv 2210.15759; the
# zerospeech.com home page, news page, toolbox ("Getting Started") page, Task 4 page and the archived 2015 challenge
# page (scripts and styles stripped; the site serves no robots.txt); the ABX-LS and ProsAudit leaderboard files on
# download.zerospeech.com, which the script-rendered results pages load; the README of the zrc toolkit
# (zerospeech/benchmarks) at commit 8a716e8; and the v1 PDF of arXiv 2607.04064 (July 2026), a paper that reports
# sWUGGY and sBLIMP from the ZeroSpeech 2021 benchmark. The other six leaderboard files (abx15, abx17, tde15, tde17,
# tts019, sLM21) and GitHub's metadata for the zerospeech organisation were read for dates and are not quoted
# Sources. Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the series as one benchmark: the 2015, 2017, 2019, 2020 and 2021 challenges and the 2021 NeurIPS
# round are editions, and the January 2023 reorganisation into standing benchmarks is a revision. The standing
# benchmarks (ABX-15, TDE-15, ABX-17, TDE-17, TTS0-19, ABX-LS, sLM-21, ProsAudit) are subsets. The overview papers
# of the individual editions were not read; the review stands in for them.

id: zerospeech
name: Zero Resource Speech Challenge
aliases:
  - ZeroSpeech
  - ZRC
  - Zero Resource Speech Benchmark
tagline: CoML's textless speech challenge since 2015, from unit discovery to spoken language models,
  scored by zero-shot probes.
description: >
  A series of challenges run since 2015 by the Cognitive Machine Learning team (CoML: INRIA, ENS, EHESS,
  CNRS) that asks systems to learn from raw speech with no text and no labels, broken into four tasks:
  acoustic unit discovery (Task 1), spoken term discovery (Task 2), discrete resynthesis or "TTS without
  T" (Task 3), and spoken language modelling (Task 4). Instead of training classifiers on the learned
  representations, each task is scored by zero-shot probes inspired by psycholinguistics: ABX discriminability
  of phonemic minimal pairs from frame embeddings (Task 1); matching, clustering and segmentation scores
  against word alignments (Task 2); human-rated quality, intelligibility and bitrate of speech resynthesised
  from discovered units (Task 3); and whether a spoken language model gives higher pseudo-probability
  to a real word than a matched nonword (sWUGGY) or to a grammatical than an ungrammatical sentence (sBLIMP),
  with a correlation against human word-similarity judgements (sSIMI) (Task 4). Six editions ran as special
  sessions and a NeurIPS competition (2015, 2017, 2019, 2020, 2021 and the 2021 NeurIPS round), with 115
  submissions from 29 teams; in January 2023 the evaluations became standing benchmarks with republished
  gold data, a local evaluation toolkit (zrc) and a leaderboard open all year.
self_description:
  source: src-arxiv-2210-15759-v1
  quote: the Zero Resource Challenge series assesses progress toward spoken language systems that
    function without any textual supervision at any point
external_ids:
  arxiv: '2210.15759'
paper:
  title: 'Self-supervised language learning from raw audio: Lessons from the Zero Resource Speech Challenge'
  arxiv: '2210.15759'
  version_read: v1
  source: src-arxiv-2210-15759-v1
released: null
released_note: The first challenge was a special session at Interspeech 2015 (Dresden, 6-10
  September 2015); no source read gives the day its data or evaluation kit were released.
release_venue: Interspeech 2015
release_venue_source: src-zerospeech-2015-tasks
release_venue_quote: This challenge first appeared as a special session at Interspeech 2015 (Sept,
  6-10, 2015, Dresden).

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speech-recognition
  secondary:
    - audio-speech/speech-synthesis
  per_edition: true
  per_edition_note: >
    Tasks 1 and 2 (unit and term discovery) ran in 2015, 2017 and 2020, and Task 1 again in both 2021
    rounds; Task 3 (speech-synthesis) in 2019 and 2020; Task 4 (spoken language modelling) in the 2021
    rounds. Task 4 has no audio-speech leaf, and none of the tasks transcribes into text, which the primary
    leaf's definition presumes; logged as a missing term.
domain_basis:
  reason: The input is raw speech and the score is what a system recovered from it or produced as
    audio, so the family is audio-speech. No leaf holds unsupervised, textless speech learning. The
    review names its tasks as the textless counterparts of phone recognition, ASR, TTS and language
    modelling; speech-recognition is the nearest leaf for Tasks 1 and 2 (the line that ran in five
    of six editions), and speech-synthesis is secondary for Task 3. The miss is logged.
  source: src-arxiv-2210-15759-v1
  quote: 'These are the textless counterparts of well-known tasks: (Task 1) phone recognition; (Task 2)
    word recognition (i.e., ASR); (Task 3) TTS; (Task 4) Language Modeling.'
domain_considered_and_rejected:
  - term: multimodal/audio-language
    reason: No text is paired with the audio. The 2021 NeurIPS round allowed visually grounded
      training (speech with images), but systems are tested on speech alone, and nothing scores a
      correspondence between audio and language.
  - term: language/low-resource-languages
    reason: Unwritten and low-resource languages are the motivation, and the 2015 and 2017 data
      include Xitsonga and other languages, but the score is recovered from audio, which the
      language family's own near miss (open-asr-leaderboard) sends to audio-speech; the current
      benchmarks are English LibriSpeech.
  - term: audio-speech/speaker-tasks
    reason: Speaker invariance is tested (across-speaker ABX), but the scored quantity is linguistic
      contrast, not speaker identity.
capability:
  - perception
  - distribution-shift-generalization
  - generation-fidelity
capability_basis:
  perception:
    reason: Every task takes raw speech and scores what the learned representation recovered from
      it, phonemic contrasts, recurring words, or lexical and syntactic knowledge, with no text or
      labels in training.
    source: src-zerospeech-home
    quote: The objective of the Zero Resource Speech Challenge (ZRC) series is to enable researchers
      to build a spoken dialogue system directly from raw audio recordings (no text, no labels!)
  distribution-shift-generalization:
    reason: From ABX-17 on, the Task 1 test speakers are new, and the across-speaker ABX score
      compares tokens from different talkers; the task and its contrasts are unchanged, only the
      speakers move.
    source: src-arxiv-2210-15759-v1
    quote: ABX-15 used the training set as test set, while the ABX-17 introduced a separate test set
      with new speakers
  generation-fidelity:
    reason: Task 3 (TTS0-19, 2019 and 2020) resynthesises speech from the discovered units and
      scores it by human evaluation (MOS) beside the units' bitrate; it applies to that subset only.
    source: src-arxiv-2210-15759-v1
    quote: 'MOS: human evaluation'
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The probes are zero-shot and require no retraining, so no second task is trained or
      scored; SUPERB is the benchmark that trains heads for downstream tasks.
  - term: sample-efficiency
    reason: Training sets are small in the early editions (2.5 h to 45 h) and Task 4 splits entries
      by GPU budget, but no sample budget is fixed and scored.
  - term: knowledge-recall
    reason: sWUGGY and sBLIMP probe lexical and syntactic knowledge, but from spoken minimal pairs
      scored on audio, which the capability's text reading does not cover; perception carries it.

evaluation_method:
  - domain-metric
  - classification-metric
  - multiple-choice
  - statistical-fit
evaluation_method_note: >
  Per task. Task 1: the ABX error rate over phonemic minimal pairs, within and across speakers, a measure
  of speech psychophysics (domain-metric). Task 2: NED and coverage (domain-metric) with grouping, type,
  token and boundary F-scores (classification-metric). Task 4: sWUGGY and sBLIMP accuracy over pairs of
  one legal and one illegal item, the model's pseudo-probability choosing between them, chance 0.5 (multiple-choice);
  sSIMI is a Spearman correlation with human similarity judgements (statistical-fit). Task 3's MOS is
  a human evaluation whose raters the sources read do not describe, so neither human-rating term is tagged;
  its bitrate is a formula over the discovered units.
evaluation_method_basis:
  reason: Every metric is computed by a fixed module over what the system emits (frame embeddings,
    time-stamped fragments or pseudo-probabilities), with no classifier trained on top.
  source: src-arxiv-2210-15759-v1
  quote: They only require the extraction of information readily available in the system (for
    example, embeddings, pseudo-probabilities)
designed_for_subjects: []
designed_for_subjects_note: Left empty and logged. The entrants are self-supervised speech encoders,
  unit-based spoken language models and unit-to-speech synthesisers trained without labels and
  scored as they stand by zero-shot probes. task-specific-supervised-model needs supervised
  training; base-model fits Task 4's likelihood scoring but would resolve the llm-static-text
  profile, whose prompting fields are meaningless here; generative-media-model fits Task 3 only.
as_used:
  - protocol: sWUGGY and sBLIMP accuracies reported in a paper's own results table beside Spoken
      StoryCloze, computed by the authors and not entered on the ZeroSpeech leaderboard; sSIMI and
      the ABX and term-discovery benchmarks are not reported.
    split: sLM-21 (sWUGGY and sBLIMP)
    source: src-arxiv-2607-04064-v1
    quote: 'The zero resource speech benchmark 2021: Metrics and baselines for unsupervised spoken language
      modeling'
    note: Komatsu et al., July 2026, accepted by the IEEE Open Journal of Signal Processing. The
      paper's comparison table mixes speech-only and speech-text models, which ZeroSpeech's no-text
      rule would not admit to the leaderboard.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument outside the leaderboard. A July 2026
    paper scores speech language models on sWUGGY and sBLIMP and cites the ZeroSpeech 2021 benchmark
    paper for them. The leaderboard has taken no row since February 2023, which activity records.
  source: src-arxiv-2607-04064-v1
  quote: We evaluate the lexical, syntactic, and semantic understanding capabilities of speech LMs
    using sWUGGY, sBLIMP, and StoryCloze, respectively [20], [59].
activity: leaderboard-live-no-round
activity_note: No round has run since the 2021 NeurIPS competition. The site says the series is open
  on a rolling basis, but its upload API is disabled and new results go by e-mail to the organisers;
  the toolkit's submit command is still marked work in progress at its last commit (July 2024). The
  leaderboard files read on 2026-11-04 carry no submission dated after 2023-02-24 (the organisers'
  ProsAudit rows, entered by "admin"). Whether e-mailed results are still added is a reviewer check.
activity_basis:
  reason: The evaluations were reorganised into standing benchmarks no longer tied to challenge
    events, and the toolbox page still gives outsiders a route (by e-mail) onto the leaderboard.
  source: src-zerospeech-home
  quote: The ZRC series is now open on a rolling basis

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: HuBERT-based spoken language models (Ngu21b,c), tied for first on the sLM-21 leaderboard
      in December 2021
    source: src-arxiv-2210-15759-v1
    observed_on: 2026-11-05
    quote: On the other hand, Ngu21b,c are HuBERT systems
  - system: SylReg-LM 7B, a syllable-token speech language model, scored on sBLIMP (July 2026)
    source: src-arxiv-2607-04064-v1
    observed_on: 2026-11-05
    quote: When scaling with respect to both model and data sizes, SylReg-LM 7B achieves an average
      relative improvement of 7% over SpiRit-LM on sBLIMP and StoryCloze.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Phone alignments (ABX triphone contrasts, term-discovery alignments), the
  legal and illegal member of each sWUGGY and sBLIMP pair, and human similarity ratings for sSIMI.
  Held back during the editions and republished with the datasets in 2023 for local evaluation.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The gold data is republished and the zrc toolkit computes every Task 1, 2 and 4 score
    locally. ABX-15 and TDE-15 need the Buckeye corpus, which is not redistributed, and Task 3's MOS
    needs human raters.
  source: src-zerospeech-news
  quote: Republishing datasets containing gold data to allow local evaluation

task:
  exists: true
  input:
    - unlabelled training speech (the benchmark's default set, or other data with no labels beyond
      speaker identity)
    - test audio files (utterances for ABX and term discovery, spoken words and sentences for
      sLM-21)
  output: Per task, time-stamped frame embeddings (Task 1); a list of discovered fragments with
    cluster labels (Task 2); resynthesised waveforms and the discrete units behind them (Task 3); a
    pseudo-probability per spoken item and word embeddings for sSIMI (Task 4).
  scoring: Each benchmark on its own metric, dev and test reported separately; ABX error within and
    across speakers (clean and other for ABX-LS), sWUGGY and sBLIMP accuracy (chance 0.5), sSIMI
    Spearman correlation, the term-discovery F-scores, and MOS with bitrate.
  source: src-arxiv-2210-15759-v1
  quote: The general strategy of the ZRC series is to develop zero-shot probe tasks that are
    inspired by human psycholinguistics, and which require no model retraining.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The current benchmarks (ABX-LS, sLM-21, ABX-17, TTS0-19) download with their gold
    data through the zrc toolkit. ABX-15 and TDE-15 use the Buckeye corpus, which the toolkit does
    not serve because of its licence; their gold data is imported locally.
  access_basis:
    reason: Since January 2023 the datasets are republished with their gold data, so headline scores
      can be computed from downloaded data without an account.
    source: src-zerospeech-news
    quote: Republishing datasets containing gold data to allow local evaluation
  refresh: versioned-releases
  refresh_basis:
    reason: Each edition added named benchmarks (ABX-15, TDE-15, ABX-17, TDE-17, TTS0-19, ABX-LS,
      sLM-21), each kept with its own leaderboard rather than replaced; 2020 reran the 2017 and 2019
      sets. Since 2023 the benchmarks are standing, and new conditions (ABX-LS context-invariance,
      ProsAudit) came as labelled additions.
    source: src-arxiv-2210-15759-v1
    quote: Benchmark ABX-15, TDE-15 ABX-17, TDE-17 TTS0-19 reboot of 2017 & 2019 ABX-LS, sLM-21
      (sWUGGY, sBLIMP, sSIMI)
  data_provenance:
    - inherited-from-constituents
    - model-generated
  data_provenance_note: The speech is drawn from existing corpora (Buckeye and NCHLT Xitsonga for
    2015; Librivox and other corpora for 2017; LibriSpeech for ABX-LS and sLM-21; LibriSpeech and an
    Indonesian corpus for TTS0-19). sWUGGY and sBLIMP stimuli were synthesised with the Google TTS
    API, the nonwords generated by the Wuggy pseudoword generator and the sentence pairs adapted
    from BLiMP; sSIMI pools 13 word-similarity datasets.
  data_provenance_source: src-arxiv-2210-15759-v1
  data_provenance_quote: All stimuli are synthetized using the Google TTS API resulting in the
    sWUGGY and sBLIMP test sets
  contamination_risk: medium
  contamination_risk_note: The test audio and, since 2023, the gold data are public, and the
    LibriSpeech test and dev sets behind ABX-LS sit beside the 960 h training set that models
    commonly pretrain on; sBLIMP adapts the public BLiMP text set. ABX-15 tested on its training set
    by design. No source evidences a route into a scored split.
  contamination_risk_source: src-arxiv-2210-15759-v1
  contamination_risk_quote: ABX-15 used the training set as test set, while the ABX-17 introduced a
    separate test set with new speakers
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: A one-hot phonemic code from the gold annotations scores a perfect ABX;
    the review also reports a supervised GMM-HMM topline for Task 1 and a character-based RoBERTa
    text topline for Task 4 (96.25 sWUGGY, 82.11 sBLIMP), neither of them a human anchor.
  ceiling_anchor_type_source: src-arxiv-2210-15759-v1
  ceiling_anchor_type_quote: using the gold annotations to generate a frame-by-frame one-hot
    phonemic representation mechanically leads to a perfect ABX score
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the ZeroSpeech datasets or gold files.
    The 2015 page calls all its resources free and open source; the constituent corpora keep their
    own terms (LibriSpeech's were not read), and Buckeye's restrict redistribution.
  upstream_licences: Buckeye (ABX-15, TDE-15) is not redistributed by the toolkit because of its
    licence; the other constituents' terms were not read.
  upstream_licences_source: src-zerospeech-toolbox
  upstream_licences_quote: due restrictive licencing
  size:
    - count: 20000
      unit: word-nonword pairs
      subset: sWUGGY test set (5,000 in dev; an OOV set of the same sizes beside it)
      source: src-arxiv-2210-15759-v1
      quote: The sWUGGY dev and test sets consists of 5,000 and 20,000 pairs of words and nonwords
        respectively
    - count: 63000
      unit: grammatical-ungrammatical sentence pairs
      subset: sBLIMP test set (6,300 in dev)
      source: src-arxiv-2210-15759-v1
      quote: The dev and test sets contain 6,300 and 63,000 pairs respectively, with no sentence
        pair overlap.
    - count: 9744
      unit: word pairs (synthesised subset; 3,753 in the LibriSpeech subset)
      subset: sSIMI test set
      source: src-arxiv-2210-15759-v1
      quote: The synthesized subset is composed of 9744 and 705 word pairs for the test and dev sets
        respectively
    - count: 960
      unit: hours of training speech (LibriSpeech), the default for ABX-LS and sLM-21
      subset: training
      source: src-arxiv-2210-15759-v1
      quote: The more recent benchmark (ABX-LS) uses the full LibriSpeech (960h) as training set,
        and introduced a separate dev and test set
  size_note: Six editions received 115 submissions from 29 teams (the review). ABX-LS's dev and test
    sets are LibriSpeech's clean and other splits, about 5 h each.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CoML team (Cognitive Machine Learning; INRIA, ENS, EHESS, CNRS), with
    co-organisers from other institutions in each edition
  maintainer_basis:
    reason: CoML holds the site, the datasets on download.zerospeech.com, the toolkit and the
      leaderboards, and its members organised every edition; organisers from other institutions (the
      University of Toronto in the review) joined edition by edition.
    source: src-zerospeech-home
    quote: Copyright (c) 2015 - 2026 CoML team - INRIA, ENS, EHESS, CNRS.
  maintainer_type: academic-lab
  maintainer_type_note: conference-workshop was considered for 2015-2021, when each edition was a
    special session at Interspeech or ASRU or a NeurIPS competition. Since 2023 the benchmarks are
    standing and held by one research team, independent of any event, which the term's exclusion
    leaves with the lab.
  submission_process:
    - self-reported
    - held-out-server
  submission_process_note: >
    Now (since 2023): participants run the zrc toolkit locally against the republished gold data and send
    the score files with their embeddings or pseudo-probabilities and a meta file; the upload API is disabled,
    so this goes by e-mail. No source says the organisers re-score what is sent (self-reported). During
    the editions the gold data was withheld and the organisers scored submitted representations, through
    CodaLab in 2020 (held-out-server); in 2015 participants ran the released evaluation software themselves
    and sent results to the organisers.
  submission_process_source: src-zerospeech-toolbox
  submission_process_quote: 'score files: these are the result of the evaluation process.'
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2210-15759-v1
      quote: Thi15 2015 [22] CoML Siamese Zeg15 2015 [23] CoML Siamese
  independence_flags_note: CoML's own systems sit on every leaderboard, from the 2015 Siamese
    networks to the 2021 baselines (BAS4) and Ngu21a-d, which shared first place on sLM-21. The
    review's acknowledgement funds two of its authors' work with a Meta AI Research Gift.
    funded-by-evaluated-party was weighed and not set, since it would need a source that systems on
    the leaderboards (Kha20, or the HuBERT models behind Ngu21b,c) are Meta's, and none read says
    so, nor that the gift funded the benchmark itself.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The gold data is downloadable and the zrc toolkit computes the Task 1, 2 and 4 scores
      end to end on a local machine. Task 3's MOS needs human raters and ABX-15/TDE-15 need the
      Buckeye corpus, outside the headline benchmarks.
    source: src-zerospeech-news
    quote: Republishing datasets containing gold data to allow local evaluation
  harness_availability: official-harness
  harness: zrc (the zerospeech-benchmarks Python package, zerospeech/benchmarks on GitHub)
  harness_source: src-zerospeech-toolbox
  harness_quote: zrc benchmarks:run sLM21
  submission_channel:
    source: src-zerospeech-toolbox
    quote: The upload API is disabled
  submission_channel_note: Submissions now go by e-mail to the organisers' role address on the
    toolbox page. The in-house upload system announced for February 2023, which replaced CodaLab, is
    disabled.
  code_licence: GPL-3.0
  code_licence_note: GitHub's licence metadata for zerospeech/benchmarks reports GPL-3.0 (read
    2026-11-04; not a quoted Source), and the README carries a "GPL >= V3" badge.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The profile resolves to the fallback (designed_for_subjects is empty; see the gap). Beyond it: which
  # benchmark, split and condition (ABX within or across speakers, clean or other; sWUGGY with or without OOV
  # words; sSIMI's synthetic or LibriSpeech subset); the training data (the default set, other unlabelled data,
  # or visually grounded data in the 2021 NeurIPS round); and the evaluation code (the edition's own package or
  # the zrc toolkit, and the ABX distance and pooling the participant chose).
  material_extra:
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each benchmark has its own leaderboard and each metric is reported separately (Table V
    lists ABX, sWUGGY, sBLIMP and sSIMI side by side); nothing combines them.
  source: src-arxiv-2210-15759-v1
  quote: The two approaches are currently tied for the top position on the leaderboard

homepage: https://zerospeech.com/
repository: https://github.com/zerospeech/benchmarks
dataset_url: https://download.zerospeech.com
leaderboard_url: https://zerospeech.com/tasks/task_4/results/

versions:
  - version: '2015'
    label: Zero Resource Speech Challenge 2015
    version_kind: edition
    changes: The first edition, a special session at Interspeech 2015 (Dresden). Track 1 subword
      modelling scored by ABX (ABX-15) and Track 2 spoken term discovery (TDE-15), on English
      (Buckeye) and Xitsonga, with the training set as the test set.
    breaking: true
    superseded_by: '2017'
    frozen: true
    sources:
      - src-zerospeech-2015-tasks
      - src-arxiv-2210-15759-v1
  - version: '2017'
    label: Zero Resource Speech Challenge 2017
    version_kind: edition
    changes: Tasks 1 and 2 again (ABX-17, TDE-17) on new languages with surprise languages, and a
      separate Task 1 test set of new speakers. The review lists ASRU among the series' venues.
    breaking: true
    supersedes_version: '2015'
    superseded_by: '2019'
    frozen: true
    sources:
      - src-arxiv-2210-15759-v1
  - version: '2019'
    label: 'Zero Resource Speech Challenge 2019: TTS without T'
    version_kind: edition
    changes: Task 3 only, unsupervised discrete resynthesis (TTS0-19), on English and a surprise
      language (Indonesian); a special session at Interspeech 2019.
    breaking: true
    supersedes_version: '2017'
    superseded_by: '2020'
    frozen: true
    sources:
      - src-zerospeech-news
      - src-arxiv-2210-15759-v1
  - version: '2020'
    label: Zero Resource Speech Challenge 2020
    version_kind: edition
    changes: A consolidating edition on the 2017 and 2019 benchmarks (Tasks 1, 2 and 3), with
      bug-fixed evaluation kits and a CodaLab leaderboard; a special session at Interspeech 2020.
    breaking: true
    supersedes_version: '2019'
    superseded_by: '2021'
    frozen: true
    sources:
      - src-zerospeech-news
      - src-arxiv-2210-15759-v1
  - version: '2021'
    label: 'Zero Resource Speech Challenge 2021: Spoken Language Modelling'
    version_kind: edition
    changes: Spoken language modelling (Task 4, sLM-21 with sWUGGY, sBLIMP and sSIMI) and a new Task
      1 benchmark on LibriSpeech (ABX-LS), with BERT and LSTM baselines; a special session at
      Interspeech 2021.
    breaking: true
    supersedes_version: '2020'
    superseded_by: 2021b
    frozen: true
    sources:

curation:
  added_by: agent (P1-S7-T04)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2210-15759-v1
    - src-zerospeech-home
    - src-zerospeech-news
    - src-zerospeech-toolbox
    - src-zerospeech-task4
    - src-zerospeech-2015-tasks
    - src-zerospeech-leaderboard-abxls
    - src-zerospeech-leaderboard-prosaudit
    - src-github-zerospeech-benchmarks-readme
    - src-arxiv-2607-04064-v1
  sources_note: >
    The review's v1 PDF (a DOI, not archived); five zerospeech.com pages with scripts and styles stripped
    (the 2015 page lists organisers by name and is withheld from archiving; the others print only role
    addresses, kept out of the extracts); two leaderboard JSON files, withheld because their rows carry
    a submitter's handle and authors' names; the zrc README at commit 8a716e8; and the v1 PDF of arXiv
    2607.04064 (a DOI) as evidence of current use.
  confidence: medium
  review_checks:
    - check: activity leaderboard-live-no-round rests on the toolbox page's e-mail route and the
        home page's "open on a rolling basis". The upload API is disabled, the toolkit's submit
        command is unfinished, and no leaderboard row is dated after 2023-02-24. If e-mailed results
        are not being added, activity is closed or no-submission-channel.
      field: activity
      source: src-github-zerospeech-benchmarks-readme
      quote: The submit functionality is a Work in progress, it will be available soon.
    - check: lifecycle active rests on papers that report sWUGGY and sBLIMP (and ABX on LibriSpeech)
        from their own runs, one July 2026 example read here. mature is the alternative if only the
        leaderboard counts, which has been static since early 2023.
      field: lifecycle
      source: src-arxiv-2607-04064-v1
      quote: We evaluate the lexical, syntactic, and semantic understanding capabilities of speech
        LMs using sWUGGY, sBLIMP, and StoryCloze, respectively [20], [59].
    - check: Domain. speech-recognition is the nearest leaf, not a fit, since nothing is transcribed
        into text; a leaf for unsupervised speech representation learning or textless spoken
        language modelling is logged as missing. designed_for_subjects is empty for the same reason
        (logged).
      field: domain
    - check: Overlap with superb. Both score self-supervised speech representations and share
        entrants (HuBERT, CPC), and SUPERB's phoneme recognition and query-by-example tasks sit near
        ZeroSpeech Tasks 1 and 2. They differ in protocol (ZeroSpeech uses zero-shot probes with no
        trained head and forbids text; SUPERB trains heads on labelled data) and in maintainer, so
        they stay separate entries. The review draws the same line.
      field: lineage
      source: src-arxiv-2210-15759-v1
      quote: 'While some research has focused on how self-supervised modelling can improve existing supervised
        speech tasks (for example, the SUPERB benchmark: [3])'
    - check: Identity and versions. The 2021 NeurIPS round is an edition because the review counts
        six editions; it reused the 2021 benchmark and added a training condition, which reads as a
        revision. The 2023 standing benchmarks are a revision; the superseded_by chain records the
        challenge rounds, while every benchmark stays on its own leaderboard.
      field: versions
      source: src-arxiv-2210-15759-v1
      quote: Six editions of the Zero Resource Challenge have been proposed over the years as events
        in different venues (Interspeech, ASRU, NeurIPS)
    - check: The 2017 edition's venue (ASRU 2017) and the 2017 languages come from the review's
        reference list and Table IV, which pdftotext interleaved; the 2017 and 2019-2021 challenge
        pages and overview papers were not read.
      field: versions
    - check: funded-by-evaluated-party is not set. The review acknowledges a Meta AI Research Gift
        to two of its authors, but no source read says which leaderboard systems are Meta's or that
        the gift funded the benchmark. Set it if a source confirms both.
      field: governance.independence_flags
      source: src-arxiv-2210-15759-v1
      quote: and by a Meta AI Research Gift
    - check: submission_process self-reported is the current e-mail route (scores computed locally,
        sent with embeddings); no source says the organisers re-score them, which would make it
        maintainer-verified. held-out-server is the editions' route and is inferred from the 2023
        republication of the gold data and the CodaLab competitions, not stated outright.
      field: governance.submission_process
    - check: maintainer_type academic-lab or conference-workshop. Each edition before 2023 was a
        special session or NeurIPS competition with co-organisers from other institutions; CoML
        organised all and holds the standing benchmarks.
      field: governance.maintainer_type
    - check: Task 3's MOS raters are not described in the sources read, so neither human-crowd-eval
        nor human-expert-eval is tagged; the 2019 overview paper would say.
      field: evaluation_method
  personal_data_excluded:
    - source: src-zerospeech-2015-tasks
      what: the 2015 organisers' names and affiliations and the grant holder's name
    - source: src-zerospeech-leaderboard-abxls
      what: a submitter's personal handle and authors' names in leaderboard rows
    - source: src-zerospeech-leaderboard-prosaudit
      what: authors' names in leaderboard rows
    - source: src-arxiv-2210-15759-v1
      what: the authors' e-mail addresses in the first-page footnotes

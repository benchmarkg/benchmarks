# data/benchmarks/audio-speech/beans.yaml
#
# P1-S7-T04, audio-speech entry 18. Filled from BEANS's paper, arXiv 2210.12300, read as its v1 PDF (the only arXiv
# version) and its abstract page; the earthspecies/beans README and LICENSE at commit b278b1d (October 2024, the head
# of main); for the maintainer's later benchmarks, BEANS-Zero's Hugging Face dataset card and the NatureLM-audio
# abstract page that introduced it, and BEANS-Next's README and arXiv abstract page (2610.10663); Earth Species
# Project's About page, for its legal form; and, as evidence of current use, the v1 PDF of arXiv 2605.10494 (Earth
# Species Project, May 2026) and the abstract page of arXiv 2512.03563 (BioMamba, an outside group, revised April
# 2026). GitHub's metadata for the three repositories and Hugging Face's API record for BEANS-Zero were read and are
# not quoted Sources. Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.
#
# The entry is the 2022 suite: ten datasets in two tasks, with two auxiliary datasets the paper keeps outside the
# benchmark. BEANS-Zero and BEANS-Next are the same maintainer's later benchmarks for audio-language models, with
# their own items and releases, so by 04 S4 they are separate benchmarks, linked here as variants.

id: beans
name: BEANS
aliases:
  - BEnchmark of ANimal Sounds
  - The Benchmark of Animal Sounds
tagline: Earth Species Project's ten public animal-sound datasets, five for classification and five
  for window-level detection.
description: >
  A collection of public bioacoustics datasets, each with fixed train, validation and test splits, released
  in 2022 by Earth Species Project to measure machine-learning methods across species. Five datasets are
  single-label classification, scored by accuracy: marine mammal species (Watkins), Egyptian fruit bat
  individuals, 264 North American bird species from the Cornell Bird Identification competition (split
  so that no recordist is in two splits), individual domestic dogs from their barks, and mosquito species
  from wingbeat sound (HumBugDB). Five are detection: long recordings cut into 1-minute chunks and then
  into sliding windows, each window labelled with every species or call type it overlaps, scored by mean
  average precision (DCASE 2021 Task 5's bird and mammal recordings, an eastern North American dawn chorus,
  minke whale "boings" from the HICEAS survey, tropical birds and frogs from Rainforest Connection, Hainan
  gibbon calls). ESC-50 and Speech Commands are included as auxiliary datasets that are not officially
  part of the benchmark. The paper asks users not to average across datasets and tasks. Its baselines
  (logistic regression to gradient-boosted trees on MFCC statistics, ResNets and VGGish, fine-tuned per
  dataset) leave most datasets well below 90%. A repository downloads, re-splits and validates the data
  and runs the baselines; there is no leaderboard, and results appear in papers, where bioacoustic encoders
  are now usually compared with frozen weights and a trained probe.
self_description:
  source: src-arxiv-2210-12300-v1
  quote: we propose BEANS (the BEnchmark of ANimal Sounds), a collection of bioacoustics tasks and
    public datasets
external_ids:
  arxiv: '2210.12300'
paper:
  title: 'BEANS: The Benchmark of Animal Sounds'
  arxiv: '2210.12300'
  version_read: v1
  source: src-arxiv-2210-12300-v1
paper_note: The v1 PDF is marked as a preprint under review. The paper appeared at ICASSP 2023, as
  papers citing it give it; that version and its DOI were not read, so paper.doi is null.
released: 2022-10-21
released_note: The paper's first and only arXiv version. The repository was created on 2022-10-12
  and its initial commit is dated 2022-10-25 (GitHub API, not a quoted Source).
released_source: src-arxiv-2210-12300
released_quote: Submitted on 21 Oct 2022
release_venue: IEEE ICASSP 2023
release_venue_source: src-arxiv-2605-10494-v1
release_venue_quote: in ICASSP 2023-2023 IEEE International Conference on Acoustics, Speech and
  Signal Processing (ICASSP)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/bioacoustics
  secondary:
    - earth-climate/ecology-biodiversity
domain_basis:
  reason: Every official dataset scores identifying species, individuals or call types from
    recordings of animal sound, the leaf's definition. The benchmark is single-modality and its
    claim is machine-learning method for bioacoustics, which ecology-biodiversity's exclusion test
    sends to this leaf with ecology secondary; the secondary carries the species-monitoring purpose.
    Ecology was weighed as primary. Passive acoustic monitoring and conservation motivate the paper,
    but it is a method benchmark in one modality, not a biodiversity suite across modalities as
    LifeCLEF is, and that term's not_to_be_confused_with puts this case under bioacoustics.
  source: src-arxiv-2210-12300
  quote: Here, we propose BEANS (the BEnchmark of ANimal Sounds), a collection of bioacoustics tasks
    and public datasets, specifically designed to measure the performance of machine learning
    algorithms in the field of bioacoustics.
domain_considered_and_rejected:
  - term: audio-speech/audio-event-detection-localization
    reason: The detection datasets carry onset and offset annotations, but BEANS scores a label set
      for each fixed window by mAP; no onset, offset or direction is scored.
    source: src-arxiv-2210-12300-v1
    quote: where long recordings are broken up into short (potentially overlapping) segments and the
      ML algorithm makes a prediction per segment
  - term: audio-speech/audio-event-understanding
    reason: Only ESC-50 (environmental sounds) would fall here, and with Speech Commands
      (speech-recognition) it is auxiliary and not officially part of the benchmark; the two subsets
      carry their own domain_override.
  - term: multimodal/audio-language
    reason: Nothing in BEANS pairs audio with language. That is BEANS-Zero's and BEANS-Next's
      design, which are separate benchmarks (lineage).
capability:
  - perception
capability_basis:
  perception:
    reason: Every task starts from a recording and is scored on what was recovered from it, a
      species, an individual, a call type, or the labels present in a window.
    source: src-arxiv-2210-12300
    quote: 'The benchmark proposed here consists of two common tasks in bioacoustics: classification and
      detection.'
capability_considered_and_rejected:
  - term: transfer-learning
    reason: As designed, each model is trained on a dataset's own training split and scored on its
      test split, which differ only by sampling. Current users probe frozen encoders pretrained
      elsewhere (as_used), but BEANS reports no transfer as such.
  - term: distribution-shift-generalization
    reason: Only the bird dataset (cbi) is split so that no recordist spans two splits, and the
      shift is not reported as a quantity; the other splits are random.
    source: src-arxiv-2210-12300-v1
    quote: Since the test set labels are hidden, we split the train set into 6:2:2 train:valid:test
      portions in such a way that there is no overlap in recordists between splits.
  - term: sample-efficiency
    reason: The paper wants models that need little species-specific training data, but no task
      fixes a sample budget; each trains on its full training split.

evaluation_method:
  - exact-match
  - classification-metric
evaluation_method_basis:
  reason: The five classification datasets are scored by plain accuracy over a fixed label set
    (exact-match). The five detection datasets are scored by mean average precision, the 11-point
    interpolated precision-recall area of each class's window scores, averaged over classes, with no
    IoU sweep (classification-metric).
  source: src-arxiv-2210-12300-v1
  quote: and auxiliary tasks, and mean average precision (mAP) for detection tasks
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Its exclusion keeps only mAP over IoU thresholds there. BEANS's mAP ranks windows per
      class against window labels, the area under a precision-recall curve.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The intended entrants are models trained or fine-tuned for bioacoustic identification,
    species, individuals and call types, tasks that zoology and ecology define, and the paper wants
    generic bioacoustic models across species; current users enter bioacoustic encoders pretrained
    on animal sound (AVES, BirdAVES, NatureBEATs). The same reading put LifeCLEF's entrants under
    this term.
  source: src-arxiv-2210-12300-v1
  quote: Such models are of interest to the bioacoustic community due to better generalizability and
    lower development cost.
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The paper's baselines are general architectures (ImageNet ResNets, VGGish, tabular
      classifiers) fine-tuned per dataset, which reads as this term, but the tasks belong to a
      biological discipline, which the term's exclusion sends to domain-specialist-model.
as_used:
  - protocol: Frozen bioacoustic and general audio encoders with a trained probe head (linear or
      attention, on the last layer or on all layers), on the official splits; fully fine-tuned
      models only as a top line. Results are averaged over the classification datasets (accuracy)
      and over the detection datasets (mAP).
    split: BEANS official splits, classification and detection
    source: src-arxiv-2605-10494-v1
    quote: For BEANS, we use the official splits.
    note: Earth Species Project, May 2026 (ICASSP 2026). The paper averages within each task group,
      which the BEANS paper advises against, and says most bioacoustic benchmarks are run with a
      fixed low-capacity probe, where BEANS's own baselines fine-tune the whole network.
  - protocol: A self-supervised Mamba encoder (BioMamba) compared with AVES on the classification
      and detection tasks.
    split: BEANS classification and detection
    source: src-arxiv-2512-03563
    quote: evaluate it on the BEANS benchmark across diverse classification and detection tasks
    note: An outside group (v1 December 2025, v2 April 2026). Only the abstract was read, so the
      probing protocol and the datasets used are not recorded.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the instrument, by its maintainer (a May 2026 study of
    probing strategies) and by others (BioMamba, revised April 2026). The repository was last
    changed in October 2024 (GitHub API), which is maintenance evidence, not lifecycle. BEANS-Zero
    and BEANS-Next address audio-language models and do not replace BEANS for encoder evaluation.
  source: src-arxiv-2512-03563
  quote: evaluate it on the BEANS benchmark across diverse classification and detection tasks
activity: no-submission-channel
activity_basis:
  reason: The repository downloads the data and runs the baselines; there is no leaderboard, server
    or submission route, and results appear in users' papers.
  source: src-github-beans-readme
  quote: This repository contains the code for downloading the datasets and running the baselines.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: VGGish, fine-tuned per dataset (the release paper's best baseline)
    source: src-arxiv-2210-12300-v1
    observed_on: 2026-11-05
    quote: In terms of model performance, VGGish works best overall, followed by pretrained ResNet
      models.
  - system: BioMamba (self-supervised Mamba encoder), against AVES
    source: src-arxiv-2512-03563
    observed_on: 2026-11-05
    quote: Compared to the state-of-the-art Transformer-based model (AVES), BioMamba achieves
      comparable performance while significantly reducing VRAM consumption.
  - system: Frozen audio encoders with all-layer probes (Earth Species Project, 2026)
    source: src-arxiv-2605-10494-v1
    observed_on: 2026-11-05
    quote: using all layers in this network increased performance in accuracy by 0.09 for BEANS
      classification and detection
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The constituent datasets' own annotations (species, individual or
  call-type labels; onset and offset times for detection) on the test splits BEANS defines. They are
  public, not withheld.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The datasets are public and the code that downloads, re-splits and validates them and runs
    the baselines is open, so anyone can train and score a model on the same splits.
  source: src-arxiv-2210-12300-v1
  quote: We release the entire code and the baseline implementations as open source

task:
  exists: true
  input:
    - an animal-sound recording, padded or truncated to the dataset's duration (classification)
    - a window of a 1-minute chunk cut from a long field recording (detection; 2 s, 4 s or 10 s by
      dataset)
  output: One label from the dataset's label set (classification), or a score for each class in each
    window, several labels per window allowed (detection).
  scoring: Accuracy on each classification dataset's test split; mAP on each detection dataset's
    test split, a window counting as positive for a class when it overlaps an annotation by more
    than 20%. Each dataset is reported on its own, and the paper advises against averaging them.
  source: src-arxiv-2210-12300-v1
  quote: where long recordings are broken up into short (potentially overlapping) segments and the
    ML algorithm makes a prediction per segment

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: Most datasets download from their public hosts through the repository's scripts, and
    BEANS redistributes its HICEAS subsample itself. Two datasets come only from Kaggle (cbi, the
    Cornell Bird Identification competition, and rfcx), which needs a Kaggle account, an API token
    and joining each competition through "late submission", that is accepting its rules. The dogs
    data is listed as usable for academic purposes through personal correspondence. BEANS-Zero's
    ungated Hugging Face dataset carries cbi and rfcx test items, but as another benchmark's
    test-only, instruction-formatted copy, not an official BEANS copy.
  access_basis:
    reason: Every official route to two of the ten evaluation sets passes Kaggle's account and
      competition-rules gate; nothing is withheld.
    source: src-github-beans-readme
    quote: and choose "late submission" in order to download their datasets.
  refresh: static
  refresh_basis:
    reason: One release in 2022, with no tags or releases in the repository. The paper speaks of
      future iterations to correct its bias toward North American birds; none has appeared under the
      name, and the maintainer's later benchmarks are separate (lineage). An October 2024 commit
      changed the file hosts the scripts fetch from, with MD5 checks on the processed files.
    source: src-arxiv-2210-12300-v1
    quote: wish to address this bias in future iterations of this benchmark
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: Ten existing public datasets (and two auxiliary ones), each with its own
    provenance, from curated sound archives (Watkins, xeno-canto via the Cornell Bird Identification
    competition) to passive acoustic monitoring and towed-hydrophone surveys (HICEAS, Rainforest
    Connection, Hainan gibbons). BEANS made its own splits for most, 6:2:2 at random or, for the
    detection sets, by time or by file, and collapsed rare classes into an "other" class in HumBugDB
    and enabirds.
  data_provenance_source: src-arxiv-2210-12300-v1
  data_provenance_quote: a collection of publicly available bioacoustics datasets along with tasks
    to be performed on those
  contamination_risk: medium
  contamination_risk_note: Every test split and its labels are public. The bird set (cbi) comes from
    xeno-canto recordings, and bioacoustic encoders are pretrained on xeno-canto (BirdAVES among the
    May 2026 paper's models), so a route from pretraining audio into a scored split is plausible. No
    source checks it.
  contamination_risk_source: src-arxiv-2210-12300-v1
  contamination_risk_quote: The training set consists of bird recordings uploaded to xeno-canto
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No human or measured ceiling is given. The paper notes that its
    baselines are well below 90% on most datasets.
  dataset_licence: 'mixed, per dataset (CC-BY, CC-BY-ND, CC-BY-NC-SA, CC0, CC-NC-SA, and terms of use:
    free for personal or academic use, academic use by personal correspondence, free without restriction,
    academic research only)'
  dataset_licence_note: From the paper's Table 1, read in the table's dataset order. Classification
    is watkins free for personal or academic use, bats CC-BY-ND, cbi CC-BY-NC-SA, dogs academic use
    by personal correspondence, humbugdb CC-BY; detection is dcase CC-BY, enabirds CC0, hiceas free
    without restriction, rfcx academic research, gibbons CC-NC-SA. The auxiliary ESC-50 is CC-BY-NC
    and Speech Commands CC-BY. No licence versions are given. BEANS-Zero's card, which reuses most
    of these, lists gibbons as CC-BY-NC-SA and says the composite is not intended for commercial
    use.
  dataset_licence_source: src-arxiv-2210-12300-v1
  dataset_licence_quote: b free for personal or academic use, c academic use allowed through
    personal correspondence, d data are free for use without restriction, e usage allowed for
    academic research.
  size:
    - count: 10
      unit: datasets, five classification and five detection, each scored on its own
      subset: the official benchmark
      source: src-arxiv-2210-12300-v1
      quote: Metrics watkins bats cbi dogs humbugdb BEANS Detection Metrics dcase enabirds hiceas
        rfcx gibbons Auxiliary Metrics esc-50 speech-commands
    - count: 12
      unit: datasets, with the two auxiliary ones (ESC-50 and Speech Commands)
      subset: the paper's headline count
      source: src-arxiv-2210-12300
      quote: It includes 12 datasets covering various species, including birds, land and marine
        mammals, anurans, and insects.
  size_note: Per-dataset train, validation and test counts are on the subsets. The README asks for
    about 300 GB of disk for the original and processed data.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Earth Species Project
  maintainer_basis:
    reason: The repository sits in Earth Species Project's GitHub organisation, the code's copyright
      is the organisation's, and the six authors are its staff.
    source: src-github-beans-license
    quote: Copyright (c) 2022 Earth Species Project
  maintainer_type: nonprofit
  maintainer_type_note: Earth Species Project describes itself as a 501(c)(3) nonprofit
    (src-earthspecies-about), a single organisation outside the university and standards systems.
  maintainer_type_source: src-earthspecies-about
  maintainer_type_quote: Earth Species Project is a 501(c)(3) nonprofit made possible by the
    generosity of visionary individuals and foundations
  submission_process:
    - literature-only
  submission_process_note: The paper's baselines are the only results the maintainer published with
    the benchmark. Users add their model to the repository's code, or run their own pipeline on the
    splits, and report in their own papers.
  submission_process_source: src-github-beans-readme
  submission_process_quote: Implementing new models on BEANS is easy!
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2605-10494-v1
      quote: we benchmark NatureBEATs [22], the post-trained BEATs encoder from the NatureLM-audio
        model
  independence_flags_note: Earth Species Project scores its own encoders on BEANS, NatureBEATs from
    its NatureLM-audio model in the May 2026 paper, whose authors are all at the organisation (its
    title block reads "Earth Species Project arXiv:2605.10494v1"). There is no ranking of record, so
    the flag marks who reports, not a board.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2210-12300-v1
    quote: North American birds are over-represented in BEANS

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: A run is automatic end to end, download, preprocessing, MD5 validation, training and
      scoring; the Kaggle account for two datasets is an access gate, not a human step in the score.
    source: src-github-beans-readme
    quote: It also runs a Python script which verifies the MD5 hashes of all the data files.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: earthspecies/beans (scripts/download_data.sh, run_benchmark.py, scripts/evaluate.py)
  harness_source: src-github-beans-readme
  harness_quote: 'You can run all the baseline models by running:'
  code_licence: MIT
  code_licence_source: src-github-beans-license
  code_licence_quote: MIT License
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which datasets are reported (the ten, a task group, or with the auxiliary pair),
  # what the model is trained on and how (fine-tuned per dataset as in the paper, or a frozen pretrained encoder
  # with a probe head, and on what pretraining audio), and whether the official scripts or a re-implementation
  # produced the splits and scores.
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: The paper reports each dataset separately and asks users not to average across datasets
    and tasks; users who average do so on their own (as_used).
  source: src-arxiv-2210-12300-v1
  quote: Note that we do not encourage the reporting of a single aggregated score across different
    datasets and tasks for the benchmark

homepage: https://github.com/earthspecies/beans
repository: https://github.com/earthspecies/beans

subsets:
  - id: beans#classification
    label: Classification (five datasets, accuracy)
    scored_separately: true
    evidence:
      - source: src-arxiv-2210-12300-v1
        quote: Here, we use a regular single-label, multi-class setting
      - source: src-arxiv-2210-12300-v1
        quote: As metrics for evaluating task performance, we use accuracy A for
    notes: Single-label, multi-class. Train / valid / test counts and label sets are Table 1's, read
      in its dataset order.
  - id: beans#watkins
    label: watkins (Watkins Marine Mammal Sound Database, 31 species)
    parent: beans#classification
    items: 339
    evidence:
      - source: src-arxiv-2210-12300-v1
        quote: 1017 / 339 / 339 6000 / 2000 / 2000 14207 / 3548 / 3620 415 / 139 / 139 9293 / 1859 /
          1859
      - source: src-arxiv-2210-12300-v1
        quote: 31 (species) 10 (individual) 264 (species) 10 (individual) 14 (species)
    notes: 1,017 / 339 / 339 recordings, 44.1 kHz; free for personal or academic use.
  - id: beans#bats
    label: bats (Egyptian fruit bat individuals)
    parent: beans#classification
    items: 2000
    notes: 6,000 / 2,000 / 2,000 calls of 10 individuals, 250 kHz; CC-BY-ND.
  - id: beans#cbi
    label: cbi (Cornell Bird Identification, 264 species)
    parent: beans#classification
    items: 3620
    evidence:
      - source: src-arxiv-2210-12300-v1
        quote: Since the test set labels are hidden, we split the train set into 6:2:2
          train:valid:test portions in such a way that there is no overlap in recordists between
          splits.
    notes: 14,207 / 3,548 / 3,620 xeno-canto recordings from the competition's training set, split
      by recordist; the hardest classification set in the paper. CC-BY-NC-SA; Kaggle only.
  - id: beans#dogs
    label: dogs (individual domestic dogs from barks)
    parent: beans#classification

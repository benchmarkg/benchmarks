lineage:
  role: root
  variants:
    - id: beans-zero
      relation: zero-shot audio-language extension (test only), reusing most BEANS datasets with new
        ones
      n_items: 91965
      source: src-hf-beans-zero-card
      quote: but BEANS-Zero adds new datasets and task types that broaden the evaluation scope
    - id: beans-next
      relation: later audio-language benchmark in four tiers, carrying a BEANS-Zero comparison suite
      n_items: 37718
      source: src-github-beans-next-readme
      quote: contains 37,718 examples across 45 tasks.
lineage_note: >
  Both are Earth Species Project's, so they are variants, not forks. Neither is a version of BEANS under
  04 S4: the items differ (instruction-formatted test-only audio-text pairs, new datasets such as unseen
  species, life stage and captioning), the intended entrants differ (audio-language models answering in
  text, scored zero-shot), and each has its own release, dataset and paper (BEANS-Zero with NatureLM-audio,
  ICLR 2025; BEANS-Next with ROOTS, arXiv 2610.10663, October 2026). BEANS-Next relates to BEANS through
  BEANS-Zero, whose comparison tasks it runs; it may supersede BEANS-Zero, which is a question for that
  entry. Neither has an entry yet; both would sit under multimodal/audio-language. BEANS's dcase subset
  reuses the development set of DCASE 2021 Task 5 (data/benchmarks/audio-speech/dcase.yaml), repurposed
  as ordinary detection.


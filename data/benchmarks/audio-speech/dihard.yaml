    source: src-arxiv-2006-05815-v3
    quote: DIHARD is partnering with NIST through the OpenSAT evaluation series
    note: The 2019 server is named on the DIHARD II site; the 2018 route was not read.
  - event: access-changed
    field: data.access
    from: train-open-test-held-out

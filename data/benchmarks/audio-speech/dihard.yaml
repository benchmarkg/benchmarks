# data/benchmarks/audio-speech/dihard.yaml
#
# P1-S7-T04, audio-speech entry 12.
# Filled from the DIHARD III challenge site on dihardchallenge.github.io (its overview, results, FAQ and software
# pages, scripts and styles stripped) and the DIHARD II site; the three editions' primary documents, the DIHARD I
# evaluation plan v1.3 on Zenodo, the DIHARD II overview paper (arXiv 1906.07839 v1 PDF), the DIHARD III
# evaluation plan v1.2 (arXiv 2006.05815 v3 PDF) and the DIHARD III overview paper (arXiv 2012.01477 v3 PDF);
# NIST OpenSAT's DIHARD III page, which hosted the last edition's submissions and leaderboards; LDC's public
# catalogue record for the DIHARD III evaluation set (LDC2022S14; no licence was signed and nothing behind the login
# was read); the README of the scoring tool, dscore, at a pinned commit; and two papers that report DER on the
# DIHARD III evaluation set after the series ended, arXiv 2509.14737 (Interspeech 2025) and arXiv 2610.11278
# (October 2026, a Source already cited by voxsrc). Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# The DIHARD I site (dihardchallenge.github.io/dihard1) was read but is not a Source: everything cited about the
# first edition is in its evaluation plan and in the DIHARD II paper. The DIHARD II CodaLab server
# (dihard.ldc.upenn.edu) did not answer on 2026-11-05.

id: dihard
name: DIHARD
aliases:
  - DIHARD Speech Diarization Challenge
  - DIHARD Challenge
tagline: LDC-led speaker diarization challenge on hard multi-domain conversational audio, three
  editions 2018-2020.
description: >
  The DIHARD Speech Diarization Challenge, a series of three challenges (2018, 2019 and 2020-21) run by
  the Linguistic Data Consortium at the University of Pennsylvania with organisers from Baidu Research,
  USTC, the Indian Institute of Science and, for the first two, LSCP in Paris. Each scores "who spoke
  when" on 5-10 minute recordings drawn from about eleven deliberately difficult domains (audiobooks,
  broadcast interviews, clinical interviews with children, courtroom, map tasks, meetings, restaurant
  conversations, sociolinguistic interviews, web video and, from 2020, telephone calls). Two tracks run
  in every edition, diarization from a supplied reference speech segmentation and diarization from scratch;
  DIHARD II added two multichannel tracks on CHiME-5 dinner parties, and DIHARD III scored every submission
  on a domain-balanced core evaluation set and a larger full set. Systems are ranked by diarization error
  rate with no forgiveness collar and overlapped speech scored, with Jaccard error rate as the secondary
  metric (from 2019). There is no training set; the development sets may be used for anything. The evaluation
  labels were withheld during each challenge, and the development and evaluation sets were later published
  in LDC's catalogue under its licence. DIHARD III's evaluation set remains a standard test for diarization
  papers.
self_description:
  source: src-ldc-ldc2022s14
  quote: The DIHARD Challenges were a set of shared tasks on diarization
external_ids:
  arxiv: '2012.01477'
paper:
  title: The Third DIHARD Diarization Challenge
  arxiv: '2012.01477'
  version_read: v3
  source: src-arxiv-2012-01477-v3
released: 2018-02-01
released_note: The DIHARD I development set's release date in the first evaluation plan; the
  evaluation set followed on 26 February 2018.
released_source: src-zenodo-1199638
released_quote: Dev set release – February 1, 2018
release_venue: Interspeech 2018 (special session)
release_venue_source: src-zenodo-1199638
release_venue_quote: The results of the initial challenge will be presented at a special session at
  Interspeech 2018 in Hyderabad.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speaker-tasks
domain_basis:
  reason: Every track of every edition scores speaker diarization, labelling who spoke when in a
    multi-speaker recording, which the leaf names. Nothing is transcribed and no language is scored.
  source: src-arxiv-2006-05815-v3
  quote: Systems are provided with a reference speech segmentation that is generated by merging
    speaker turns in the reference diarization.
domain_considered_and_rejected:
  - term: audio-speech/speech-recognition
    reason: No transcript is produced or scored. Track 2 needs speech activity detection, but as a
      step toward speaker turns, and the score is DER over speaker time.
  - term: multimodal/audio-language
    reason: The input is audio alone and the output is speaker-labelled time segments; no relation
      between audio and text is scored.
capability:
  - perception
capability_basis:
  perception:
    reason: The input is raw audio and the score measures what was recovered from it, the number of
      speakers and each one's speech regions.
    source: src-arxiv-2012-01477-v3
    quote: Systems are provided with just the raw audio input for each recording session and are
      responsible for producing their own speech segmentation.
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The series aims at robustness across recording conditions and domains, but the
      development set mirrors the evaluation set's domains and is free for training, and no score is
      reported on a deliberately held-out distribution as a condition of its own. Two DIHARD III
      domains draw evaluation audio from different sources than development (ROAR for RT04 meetings,
      DASS for SLX interviews), and DIHARD I's restaurant domain had no development data, but
      neither is scored separately as a shift.
  - term: temporal-reasoning
    reason: Segment boundaries are scored, but as acoustic segmentation of the signal, not as
      reasoning about temporal relations.

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: Systems are ranked by diarization error rate, the speaker-attributed error introduced by
    the NIST Rich Transcription evaluations, scored with no forgiveness collar and with overlapped
    speech; Jaccard error rate, the secondary metric from 2019, is a diarization-specific variant.
    Both are measures of the speaker-diarization field.
  source: src-arxiv-2012-01477-v3
  quote: without the use of forgiveness collars and with scoring of overlapped speech
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: DER sums missed speech, false alarm and speaker confusion over time after an optimal
      speaker mapping; it is not a per-item classification statistic.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants are diarization pipelines (speech activity detection, speaker embeddings,
    clustering, resegmentation) and end-to-end neural diarization models trained for the task, on
    any data the rules allow.
  source: src-arxiv-2012-01477-v3
  quote: end-to-end approaches [43] were prominent in DIHARD III
as_used:
  - protocol: End-to-end diarizers trained with the DIHARD III development set (split 80/20 into
      training and validation) and scored on the DIHARD III evaluation set from raw audio, with no
      oracle speech activity, no oracle speaker count and no collar; a 0.25-s-collar figure is shown
      beside some results.
    split: DIHARD III evaluation set (full)
    source: src-arxiv-2509-14737-v1
    quote: For DIHARD III and VoxConverse we use the evaluation data for testing and split the train
      set into training and validation subsets
    note: Interspeech 2025 (EEND-TA). The paper does not say whether its figure is the core or the
      full evaluation set; its 14.49% sits between the 2020 winner's Track 2 full (16.78) and Track
      1 full (11.30) results.
  - protocol: Online diarisers scored on the DIHARD III evaluation set with no collar, beside the
      VoxSRC-23 test set, run locally by the authors.
    split: DIHARD III evaluation set
    source: src-arxiv-2610-11278-v1
    quote: The comparison with existing systems (Table 1) uses the evaluation sets of the two
      challenge series, VoxSRC-23 and DIHARD III
    note: October 2026, submitted to ICASSP 2027; the Source was read for voxsrc and its extract
      holds no DIHARD III figures.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument, the DIHARD III evaluation set. An
    Interspeech 2025 paper reports a new best DER on it, and an October 2026 paper scores online
    diarisers on it. The series' formal ending is recorded in activity (ADR-0019).
  source: src-arxiv-2509-14737-v1
  quote: most notably a DER of 14.49% on DIHARD III
activity: closed
activity_note: No fourth edition was announced, and LDC's catalogue describes the challenges in the
  past tense. The DIHARD III leaderboards on NIST's server were last updated on 2021-02-11 and no
  route for new results is given; papers since then score the released evaluation set themselves.
activity_basis:
  reason: The maintainers formally concluded the last edition, and the NIST-hosted server that took
    its submissions shows only the final leaderboards. No permanent evaluation phase is offered.
  source: src-nist-opensat-dihard3
  quote: DIHARD III has officially concluded.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: USTC-NELSLIP, the DIHARD III winner (Track 1 core DER 13.45)
    source: src-dihard3-results
    observed_on: 2026-11-05
    quote: USTC-NELSLIP 50 1473 2020-12-31 11:51:04
  - system: EEND-TA (end-to-end neural diarization), on the DIHARD III evaluation set
    source: src-arxiv-2509-14737-v1
    observed_on: 2026-11-05
    quote: most notably a DER of 14.49% on DIHARD III
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Reference speaker segmentations made by LDC, manually to a 200-ms pause
  rule and, for DIHARD III's new telephone and clinical material, by forced alignment of careful
  turn-level transcripts. Withheld during each edition and later published in the LDC releases.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The LDC evaluation releases carry the reference RTTM files, and the scoring tool is
    public, so anyone who licenses the data can rescore a system on it.
  source: src-ldc-ldc2022s14
  quote: The diarization for each recording is stored as a NIST Rich Transcription Time Marked
    (RTTM) file.

task:
  exists: true
  input:
    - a single-channel 16 kHz recording of 5-10 minutes (Tracks 1 and 2)
    - the reference speech segmentation of that recording (Track 1 only)
    - the recordings of each microphone array of a CHiME-5 dinner party (DIHARD II Tracks 3 and 4)
  output: An RTTM file of speaker turns for each recording.
  scoring: DER (missed speech, false alarm and speaker confusion over scored speaker time) with no
    forgiveness collar and overlapped speech scored, as the ranking metric; JER beside it from 2019
    (mutual information in 2018). DIHARD III ranks on the core evaluation set and reports the full
    set beside it; each track has its own leaderboard.
  source: src-arxiv-2006-05815-v3
  quote: NO forgiveness collar will be applied to the reference segments prior to scoring and
    overlapping speech WILL be evaluated

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: The development and evaluation sets of all three editions, with reference RTTMs, are
    in LDC's catalogue (DIHARD III's evaluation set as LDC2022S14, released 15 December 2022) under
    the LDC User Agreement for Non-Members, for a fee to non-members or through an LDC membership.
    That is a signed licence and a payment, stricter than the click-through the term names and
    looser than a credentialed DUA; the vocabulary has no term for it (logged with bench tag-gap).
    DIHARD II's multichannel audio came from Sheffield under the CHiME-5 licence.
  access_basis:
    reason: The current edition's evaluation data, labels included, is released, but only through
      LDC's licensed catalogue.
    source: src-ldc-ldc2022s14
    quote: 'License(s): LDC User Agreement for Non-Members'
  access_by_phase:
    during_edition: train-open-test-held-out. Registered participants who signed the LDC data
      licence received the development set with references and the evaluation audio without them,
      and uploaded RTTMs for scoring.
    during_edition_source: src-arxiv-2006-05815-v3
    during_edition_quote: In the case of the development set, a reference diarization will be
      provided
    after_edition: gated-registration. The sets were handed to LDC for publication; DIHARD III's
      evaluation release carries the reference RTTMs and is licensed for a fee.
    after_edition_source: src-dihard3-faq
    after_edition_quote: Unfortunately, DIHARD III has concluded and we are no longer able to
      distribute the data under the evaluation license.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each edition ranked entrants on a new evaluation set, though the sets overlap. DIHARD
      II's single-channel set is DIHARD I's plus 6 hours, with two domains resegmented; DIHARD III
      drops the child-language domain, adds telephone speech and more clinical audio, and keeps a
      core set built like the earlier ones.
    source: src-arxiv-1906-07839-v1
    quote: is a superset of that used in DIHARD I, though 6 hours of additional material have been
      added
  data_provenance:
    - real-world-instrument
    - inherited-from-constituents
  data_provenance_note: Recordings of real conversations and readings, most previously unexposed LDC
    holdings (YouthPoint radio, ADOS clinical interviews, Supreme Court arguments, Conversations in
    Restaurants, ROAR meetings, VAST web video, unreleased Fisher calls); some come from released
    LDC corpora (DCIEM map tasks, MIXER6, DASS, and RT-04S meetings in development), whose own
    provenance applies.
  data_provenance_source: src-arxiv-2006-05815-v3
  data_provenance_quote: 20 hours of previously unexposed 2 person English language calls
  contamination_risk: medium
  contamination_risk_note: Parts of the evaluation audio were released before in LDC corpora (DCIEM,
    MIXER6, DASS, and excerpts in NIST SRE10 and SRE12), which the rules bar from training, and the
    audiobook domain is LibriVox audio that is public online. Since 2022 the evaluation sets and
    their labels are in LDC's catalogue. No source evidences a route into a scored set.
  contamination_risk_source: src-arxiv-2006-05815-v3
  contamination_risk_quote: portions have been exposed in part in the following corpora
  contamination_evidence: []
  ceiling_anchor_type_note: No human or measured ceiling is given. The organisers report the
    annotation as slow and difficult (real-time factors over 15) and moved to forced alignment for
    DIHARD III's new material, so reference noise bounds the attainable DER, unmeasured.
  dataset_licence: null
  dataset_licence_note: The LDC releases are under the LDC User Agreement for Non-Members, which was
    not read (it sits behind LDC's licensing pages); no SPDX licence applies. During each challenge
    the data was distributed under a separate evaluation licence, which the FAQ says ended with
    DIHARD III.
  upstream_licences: DIHARD II's multichannel tracks used the CHiME-5 corpus, licensed separately by
    the University of Sheffield; the other sources are LDC holdings.
  upstream_licences_source: src-dihard2-site
  upstream_licences_quote: need to apply separately to Sheffield for the CHiME 5 data
  size:
    - count: 259
      unit: recordings (33.01 hours)
      subset: DIHARD III full evaluation set (2020)
      source: src-arxiv-2012-01477-v3
      quote: Eval Core Full 184 259 22.73 33.01
    - count: 184
      unit: recordings (22.73 hours)
      subset: DIHARD III core evaluation set (2020), the ranking set
      source: src-arxiv-2012-01477-v3
      quote: Eval Core Full 184 259 22.73 33.01
    - count: 194
      unit: single-channel recordings (22.49 hours)
      subset: DIHARD II evaluation set, Tracks 1 and 2 (2019)
      source: src-arxiv-1906-07839-v1
      quote: single channel dev eval 23.81 22.49 192 194
    - count: 21
      unit: hours of 5-10 minute samples (approximate)
      subset: DIHARD I evaluation set (2018)
      source: src-zenodo-1199638
      quote: The evaluation set consists of approximately 21 hours worth of 5-10 minute speech
        samples
  submission_limit:
    max_submissions: 50
    period_days: 0
    per: team and track, over the DIHARD III evaluation period, primary and contrastive combined
    source: src-arxiv-2006-05815-v3
  submission_limit_note: Fifty valid submissions per track in DIHARD III (failed ones not counted);
    DIHARD II allowed six a day per team on its CodaLab server.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Linguistic Data Consortium (University of Pennsylvania), with organisers from Baidu
    Research, USTC, the Indian Institute of Science and (2018-2019) LSCP/ENS Paris
  maintainer_basis:
    reason: LDC developed and published the data of every edition and its staff lead the organising
      committee and author the evaluation plans and overview papers; the committee was largely the
      same across the three editions.
    source: src-ldc-ldc2022s14
    quote: Third DIHARD Challenge Evaluation was developed by the Linguistic Data Consortium (LDC)
  maintainer_type: academic-lab
  maintainer_type_note: LDC is a centre of the University of Pennsylvania (its catalogue is
    copyright the Trustees of the University of Pennsylvania). consortium was considered and
    rejected; no source read gives LDC a legal form of its own or member governance, and the term
    excludes the word alone. conference-workshop was rejected because the organising committee did
    not re-form between editions, although DIHARD I and II reported at Interspeech special sessions.
  submission_process:
    - held-out-server
  submission_process_note: Participants ran their systems locally and uploaded RTTM archives, which
    the server scored against references they did not have (CodaLab at LDC in 2019, NIST's OpenSAT
    platform in 2020). Every team had to submit a system description. The 2018 route was not read.
  submission_process_source: src-arxiv-2006-05815-v3
  submission_process_quote: upload their system outputs to the DIHARD scoring server
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-dihard3-results
      quote: dh_LEAP 22 1405 2020-12-30 10:51:31
  independence_flags_note: LEAP Lab at the Indian Institute of Science, whose head is on the
    organising committee and whose members co-author the DIHARD III overview and built its baseline
    from the lab's DIHARD II submission, entered DIHARD III as dh_LEAP (eighth on Track 1). The 2020
    winner, USTC-NELSLIP, is from another organiser's university, but no source read puts that
    organiser in the team. The organisers' own baseline appears on the leaderboards as team DIHARD.
    prize-sponsored-by-industry was looked for and not found (no prizes are mentioned).
    single-evaluator-private-test-set no longer applies, since the labels are published.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: With the evaluation sets and reference RTTMs in LDC's catalogue and dscore public,
      anyone who licenses the data can score a new system end to end. During each edition only the
      server held the references.
    source: src-ldc-ldc2022s14
    quote: The diarization for each recording is stored as a NIST Rich Transcription Time Marked
      (RTTM) file.
  reproducibility_blockers: []
  reproducibility_blockers_note: licence-restriction was considered. The LDC licence and fee gate
    access but, as far as the catalogue page shows, do not forbid the use a rescoring needs; the
    agreement itself was not read.
  harness_availability: official-harness
  harness: dscore (nryant/dscore), the official scorer of every edition; the DIHARD III plan and
    overview give version 1.0.1, the DIHARD III software page v1.1.0
  harness_source: src-dihard3-software
  harness_quote: The official scoring tool is maintained as a github repo (v1.1.0).
  submission_channel:
    source: src-arxiv-2006-05815-v3
    quote: DIHARD is partnering with NIST through the OpenSAT evaluation series
  code_licence: BSD-2-Clause
  code_licence_note: GitHub's licence metadata for nryant/dscore, read 2026-11-05; not a quoted
    Source. The baseline recipes in the dihardchallenge organisation were not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition's evaluation set, which track (reference or system speech
  # segmentation) and which partition (DIHARD III core or full); the scoring settings (dscore version, collar,
  # overlap scored), since post-challenge papers sometimes report a 0.25 s collar beside the official no-collar
  # figure; and the training data (the DIHARD III development set is free for training, the earlier
  # evaluation sets are barred).
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each track is ranked on its own leaderboard by DER on the core evaluation set, with the
    full set and JER shown beside it; nothing combines the tracks.
  source: src-dihard3-results
  quote: Leaderboards containing the final primary system submission by each team, ranked in
    ascending order by DER on the core evaluation set.

homepage: https://dihardchallenge.github.io/dihard3/
repository: https://github.com/nryant/dscore
dataset_url: https://catalog.ldc.upenn.edu/LDC2022S14
leaderboard_url: https://dihardchallenge.github.io/dihard3/results

versions:
  - version: '2018'
    label: DIHARD I
    version_kind: edition
    released: 2018-02-01
    changes: The first edition, two single-channel tracks (reference SAD and from scratch) on about
      21 hours of evaluation audio, with restaurant conversations in the evaluation set only; mutual
      information as the secondary metric. 13 of 20 registered teams submitted, and results were
      presented at an Interspeech 2018 special session.
    breaking: true
    superseded_by: '2019'
    frozen: true
    sources:
      - src-zenodo-1199638
      - src-arxiv-1906-07839-v1
      - src-ldc-ldc2022s14
  - version: '2019'
    label: DIHARD II
    version_kind: edition
    changes: The single-channel evaluation set grows to 194 recordings (DIHARD I's plus 6 hours),
      with the child-language and web-video domains resegmented; two multichannel tracks on the
      CHiME-5 dinner parties are added; JER replaces mutual information; baselines are provided, the
      evaluation period lengthens to 16 weeks and a CodaLab server at LDC scores submissions.
      Interspeech 2019 special session.
    breaking: true
    supersedes_version: '2018'
    superseded_by: '2020'
    frozen: true
    sources:
      - src-arxiv-1906-07839-v1
      - src-dihard2-site
      - src-ldc-ldc2022s14
  - version: '2020'
    label: DIHARD III
    version_kind: edition
    released: 2020-09-21
    changes: Single-channel only. Drops the child-language domain, adds 20 hours of telephone speech
      and 4 hours of clinical audio, and scores every submission on a balanced core set (184
      recordings) and a full set (259). Scoring on NIST's OpenSAT platform; post-evaluation online
      workshop on 23 January 2021. 21 teams submitted 499 valid outputs. The last edition.
    breaking: true
    supersedes_version: '2019'
    frozen: true
    sources:
      - src-arxiv-2006-05815-v3
      - src-arxiv-2012-01477-v3
      - src-dihard3-site
      - src-nist-opensat-dihard3
      - src-ldc-ldc2022s14

subsets:
  - id: dihard#track-1-reference-sad
    label: Diarization from reference speech segmentation (Track 1, 2018-2020)
    scored_separately: true
    evidence:
      - source: src-zenodo-1199638
        quote: 'Track 1: diarization beginning from gold speech segmentation'
    notes: Single-channel audio with the reference speech activity supplied, so DER measures speaker
      confusion only. Mandatory in DIHARD III.
  - id: dihard#track-2-from-scratch
    label: Diarization from scratch (Track 2, 2018-2020)
    scored_separately: true
    evidence:
      - source: src-zenodo-1199638
        quote: 'Track 2: diarization from scratch'
    notes: Single-channel audio only; the system finds speech itself, so DER includes missed and
      false alarm speech.
  - id: dihard#track-3-multichannel-reference-sad
    label: Multichannel diarization from reference speech segmentation (Track 3, 2019)
    scored_separately: true
    evidence:
      - source: src-arxiv-1906-07839-v1
        quote: Track 3 – multichannel audio using reference SAD
    notes: CHiME-5 dinner parties, one output per Kinect array; the evaluation set is CHiME-5's.
  - id: dihard#track-4-multichannel-from-scratch
    label: Multichannel diarization from scratch (Track 4, 2019)
    scored_separately: true
    evidence:
      - source: src-arxiv-1906-07839-v1
        quote: Track 4 – multichannel audio using system SAD
    notes: As Track 3 without the reference segmentation.
  - id: dihard#core-evaluation-set
    label: Core evaluation set (DIHARD III, 2020)
    scored_separately: true
    evidence:
      - source: src-arxiv-2012-01477-v3
        quote: It mimics the evaluation set composition from DIHARD I and II.
    notes: About two hours per domain (184 recordings, 22.73 h); the set the leaderboards rank on.
  - id: dihard#full-evaluation-set
    label: Full evaluation set (DIHARD III, 2020)
    scored_separately: true
    evidence:
      - source: src-arxiv-2012-01477-v3
        quote: it is a proper superset of the core evaluation set
    notes: All selections (259 recordings, 33.01 h), with extra clinical and telephone audio;
      reported beside the core set on every leaderboard.

history:
  - event: channel-moved
    field: execution.submission_channel
    from: a CodaLab instance hosted at LDC (DIHARD II, 2019)

# data/benchmarks/audio-speech/l3das.yaml
#
# P1-S7-T04, audio-speech entry 17. Filled from the L3DAS project's pages on l3das.com (robots.txt allows every
# path; scripts and styles stripped): the home page, the editions page, the L3DAS23 challenge page with its Task 1,
# Task 2, results, rules and submission pages, the L3DAS22 challenge and results pages, the L3DAS21 challenge and
# results pages, and the L3DAS24 special-session page; the L3DAS23 overview paper (arXiv 2402.09245, its v1 PDF)
# and the L3DAS22 challenge paper (arXiv 2202.10372, its v1 PDF); the L3DAS21 documentation paper's abstract page
# (arXiv 2104.05499); the L3DAS23 supporting API's README at commit 7088bba; the Kaggle dataset records of L3DAS23
# Task 1 and L3DAS22; the Zenodo record of the L3DAS21 data (10.5281/zenodo.4642005); and the v4 PDF of arXiv
# 2506.13127 (June 2026), a speech enhancement paper that scores on the L3DAS23 development set. GitHub's metadata
# for the l3das account (three repositories, the last pushed on 2023-02-10, no licence) and the arXiv abstract
# pages' licence links were read and are not quoted Sources. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.
#
# The entry is the challenge series as one family: L3DAS21 (IEEE MLSP 2021), L3DAS22 and L3DAS23 (both IEEE ICASSP
# Signal Processing Grand Challenges) are editions, and the two tasks that ran in all three, 3D speech enhancement
# and 3D sound event localization and detection, are subsets. The L3DAS24 event at IJCNN 2024 was a paper special
# session, not a challenge round, and no round has run since 2023.

id: l3das
name: L3DAS Challenge
aliases:
  - Learning 3D Audio Sources
  - L3DAS21
  - L3DAS22
  - L3DAS23
tagline: Sapienza's challenge on 3D speech enhancement and sound event localization from dual
  Ambisonics recordings, 2021-2023.
description: >
  The challenge series of the L3DAS (Learning 3D Audio Sources) project at Sapienza University of Rome,
  run three times: L3DAS21 at IEEE MLSP 2021, then L3DAS22 and L3DAS23 as Signal Processing Grand Challenges
  at IEEE ICASSP 2022 and 2023. Every edition has the same two tasks on 8-channel audio from two first-order
  Ambisonics microphones 20 cm apart. Task 1, 3D speech enhancement, recovers the clean monophonic speech
  from a mixture with up to three office noises and is scored by (STOI + (1 - WER))/2, the WER taken from
  a pretrained Wav2Vec recogniser. Task 2, 3D sound event localization and detection, lists the active
  sounds of 14 office classes and their positions every 100 ms and is scored by a location-sensitive detection
  F-score (a true positive needs the right class within 2 m in 2022 and 1.75 m in 2023). L3DAS21 and L3DAS22
  convolve Librispeech and FSD50K sounds with impulse responses measured in one real office; L3DAS23 moves
  to 68 simulated houses rendered with SoundSpaces 2.0 and adds an audio-visual track with a picture of
  each microphone's view. Each edition released labelled training and development data, then a blind test
  set without labels, and ranked the outputs that teams sent with a paper. The challenge drew 17 and 7
  teams per task in 2022 and 4 and 2 in 2023; in 2024 the project held a paper special session at IJCNN
  instead of a challenge.
self_description:
  source: src-l3das-site
  quote: The L3DAS project aims at providing new 3D audio datasets and software toolkits for the
    development of deep learning algorithms designed for 3D audio analysis.
external_ids:
  arxiv: '2104.05499'
paper:
  title: 'L3DAS21 Challenge: Machine Learning for 3D Audio Signal Processing'
  arxiv: '2104.05499'
  doi: 10.1109/MLSP52302.2021.9596248
  source: src-arxiv-2104-05499
released: 2021-03-27
released_note: The release of the L3DAS21 training and development sets, the first edition's start.
  Its documentation paper went to arXiv on 12 April 2021 and the results were presented at the MLSP
  workshop in October 2021.
released_source: src-l3das-mlsp2021-index
released_quote: 27 Mar 2021 – Release of the datasets (training and development sets)
release_venue: IEEE MLSP 2021
release_venue_source: src-arxiv-2104-05499
release_venue_quote: Documentation paper for the L3DAS21 Challenge for IEEE MLSP 2021.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/audio-event-detection-localization
  per_edition: false
domain_basis:
  reason: Task 2 scores when each sound is active (per 100-ms frame) and where it is (within a fixed
    Cartesian distance), which is the leaf's case, not merely which sounds are present. Task 1,
    speech enhancement, the other half of every edition, has no audio-speech leaf (logged with bench
    tag-gap), so the one leaf that fits a task of the series leads, and Task 1 keeps the family's
    root through the audio-speech inclusion test (the score is what was recovered from audio).
  source: src-l3das-icassp2023-task2
  quote: This metric considers a true positive only if a sound class is correctly predicted in a
    temporal frame and if it its predicted location lies within a cartesian distance from the true
    position of at most 1.75 m.
domain_considered_and_rejected:
  - term: audio-speech/speech-recognition
    reason: Task 1 reports a word error rate, but the entrant outputs a waveform and a fixed Wav2Vec
      recogniser chosen by the organisers transcribes it; nothing the entrant produces is a
      transcript.
  - term: audio-speech/speaker-tasks
    reason: Its definition includes separating speakers, but Task 1 extracts one speech signal from
      non-speech office noise; no speaker is identified or separated from another speaker.
  - term: audio-speech/audio-event-understanding
    reason: Task 2's score depends on frame timing and position, which the leaf's
      not_to_be_confused_with sends to detection and localisation.
  - term: multimodal/audio-language
    reason: No language is scored. The 2023 audio-visual track adds an image as an optional input,
      but the score stays wholly in the audio output, which the multimodal exclusion test keeps out.
capability:
  - perception
capability_basis:
  perception:
    reason: Both tasks take raw 8-channel Ambisonics audio and score what was recovered from it, a
      clean speech waveform or the class and position of each active sound.
    source: src-arxiv-2402-09245-v1
    quote: This metric measures the Cartesian distance between the predicted and true events and
      only considers a true positive when the label is correct and the location is within a
      threshold (1.75 m) of the reference location.
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Task 2 outputs positions, but the score is how accurately each source's position is
      recovered from the signal, which the term's exclusion test (reconstruction accuracy, not a
      spatial inference) sends to perception.
  - term: temporal-reasoning
    reason: Task 2 scores each 100-ms frame on its own; nothing scores order or duration relations
      between events.
  - term: distribution-shift-generalization
    reason: The test sets are drawn to match the training distribution, and no edition reports a
      held-out room or condition as a score of its own.
  - term: grounding
    reason: The audio-visual track pairs audio with an image, but no linguistic expression is bound
      to anything.

evaluation_method:
  - domain-metric
  - model-derived-metric
  - composite
  - classification-metric
evaluation_method_note: >
  Task 1's metric averages STOI, a speech-intelligibility measure of the speech processing field computed
  by formula (domain-metric), with one minus the word error rate of a pretrained Wav2Vec 2.0 recogniser's
  transcript of the enhanced speech (model-derived-metric, because a released scoring model produces it),
  so the headline is composite. Task 2's metric is the F-score of location-sensitive detection (classification-metric),
  with a true positive gated by the distance threshold.
evaluation_method_basis:
  reason: The WER in Task 1's metric comes from a fixed pretrained recogniser, and the metric
    averages it with STOI.
  source: src-arxiv-2402-09245-v1
  quote: We use a Wav2Vec architecture pre-trained on Librispeech 960h to compute the WER.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants are enhancement and SELD networks trained on the edition's training data and
    scored as trained; the baselines are a beamforming U-Net and an augmented SELDNet. An
    enhancement network reproducing a reference signal is this term rather than
    generative-media-model.
  source: src-github-l3das23-readme
  quote: For task 1 we use a Beamforming U-Net and for task 2 an augmented variant of the SELDNet
    architecture.
as_used:
  - protocol: Multichannel speech enhancement models, a distilled DPDCRN (the L3DAS23 Task 1
      winner's architecture) and others, scored on the L3DAS23 Task 1 development set with PESQ,
      STOI, WER and the T1 metric, computed by the authors with the L3DAS22 repository's WER code,
      not by the organisers.
    split: L3DAS23 Task 1 development set
    source: src-arxiv-2506-13127-v4
    quote: BETWEEN DISTILLED AND UNDISTILLED MODELS ON THE DEVELOPMENT SET IN THE SE TRACK OF
      L3DAS23
    note: Papers after the challenge score on the development set, whose labels are public; the
      blind test set's labels were not found released (see review_checks).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. The v4 of arXiv 2506.13127 (June 2026)
    reports speech enhancement results on the L3DAS23 data. The challenge rounds have stopped, which
    activity records (ADR-0019).
  source: src-arxiv-2506-13127-v4
  quote: the effectiveness of the proposed framework is further verified on the multi-channel
    L3DAS23 dataset
activity: closed
activity_note: No round after L3DAS23. The project's 2024 event was a special session for papers at
  IJCNN (WCCI 2024), with no data, tasks or ranking; the editions page lists nothing later, the
  icassp2024, icassp2025 and icassp2026 paths on l3das.com return 404 (checked 2026-11-05), and the
  l3das GitHub account's last repository is L3DAS23's. The organisers never called the series ended
  in so many words, so between-rounds is the alternative (see review_checks).
activity_basis:
  reason: Results were sent through a Google Form during each round, and that route is shut. The
    organisers replaced the challenge format with a paper special session in 2024, and no standing
    leaderboard takes results between rounds.
  source: src-l3das-wcci2024
  quote: While the previous editions of L3DAS were organized as challenges, this year we propose a
    special session

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SEU Speech, first in L3DAS23 Task 1 (T1 metric 0.901 on the blind test set)
    source: src-l3das-icassp2023-results
    observed_on: 2026-11-05
    quote: 1 SEU Speech 0.101 0.902 0.901
  - system: ESP-SE, first in L3DAS22 Task 1 (T1 metric 0.984)
    source: src-l3das-icassp2022-results
    observed_on: 2026-11-05
    quote: 1 ESP-SE 0.019 0.987 0.984
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The clean speech signals and their transcripts (Task 1) and the onset,
  offset, class and position of each synthesised sound event (Task 2), known by construction because
  every mixture is synthesised by convolving clean sounds with the impulse responses. The blind test
  set was released without them.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The blind test set was released with its inputs only, and no source read says its targets
    were published later, so official scores can only come from the organisers. The development
    set's targets are public and the metric code is released, so development-set results are
    reproducible.
  source: src-arxiv-2202-10372-v1
  quote: evaluation and was initially released with the only predictors data, without target
    labels/signals.

task:
  exists: true
  input:
    - an 8-channel 16-bit wav file, two first-order Ambisonics recordings from microphones 20 cm
      apart (16 kHz for Task 1, 32 kHz for Task 2)
    - in the 2023 audio-visual track, a 512x512 RGB image of microphone A's frontal view
  output: Task 1, the enhanced monophonic speech waveform as a 16 kHz numpy array per recording;
    Task 2, a CSV listing, for every 100-ms frame with active sounds, each sound's class and
    cylindrical coordinates.
  scoring: Task 1 by (STOI + (1 - WER))/2 in [0, 1]; Task 2 by the location-sensitive detection
    F-score in [0, 1]. Each task is ranked on its own.
  source: src-l3das-icassp2023-submission
  quote: Each submitted file for this task should be a numpy mono-dimensional array (.npy file)
    enclosing the floating-point samples of the predicted speech waveform, with a sampling rate of
    16kHz.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_basis:
    reason: Training and development data with targets are public (Kaggle, Zenodo), and the blind
      test set was released with inputs only.
    source: src-arxiv-2202-10372-v1
    quote: 'The test set of both dataset sections is further split into two equally-long subsets that
      present a similar distribution: one development and one blind test set.'
  access_by_phase:
    during_edition: training and development sets with targets at the opening; the blind test inputs
      without targets a few weeks before the deadline (5 February 2023 for L3DAS23)
    during_edition_source: src-l3das-icassp2023-submission
    during_edition_quote: All participants must submit the only results obtained for the blind test,
      which was released on Feb 05, 2023.
    after_edition: the blind test inputs stay downloadable (L3DAS23's from Google Drive, L3DAS21's
      from the Zenodo record); no source read says their targets were released
    after_edition_source: src-kaggle-l3das23-task1
    after_edition_quote: the blind Test Set is currently available via Google Drive
    note: >
      The L3DAS22 paper says the blind test set was "initially" released without targets, which leaves
      open a later release; none was found.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each edition was ranked on a new dataset, L3DAS22's regenerated with more data points
      and L3DAS23's rendered in simulated houses; no edition has run since 2023, so the latest set
      is now in effect static.
    source: src-arxiv-2202-10372-v1
    quote: increasing the total dataset duration from 65 to more than 94 hours
  data_provenance:
    - inherited-from-constituents
    - real-world-instrument
    - simulation-generated
  data_provenance_note: >
    Every mixture convolves clean sounds taken from existing corpora, speech from Librispeech and office
    noises from FSD50K (inherited-from-constituents), with Ambisonics impulse responses. L3DAS21 and L3DAS22
    measured their 252 impulse responses with two microphones in a real office of about 6 by 5 by 3 m
    (real-world-instrument); L3DAS23 simulated them, with the images, in 68 Habitat-Matterport 3D houses
    using SoundSpaces 2.0 (simulation-generated).
  data_provenance_source: src-arxiv-2402-09245-v1
  data_provenance_quote: we use Librispeech [4] for the speech signals and 1440 noise sound files
  contamination_risk: medium
  contamination_risk_note: The speech comes from Librispeech, a public corpus that most speech
    models train on, and the Task 1 WER scorer is itself trained on Librispeech 960 h; the noises
    come from the public FSD50K. The rules allow external public data and pretrained models. The
    mixtures and the blind test targets are new, and no source measures contamination.
  contamination_risk_source: src-l3das-icassp2023-rules
  contamination_risk_quote: It is in fact allowed to augment this dataset and/or to integrate
    additional publicly available data to train/pre-train the models.
  contamination_evidence: []
  dataset_licence: CC-BY-SA-4.0
  dataset_licence_note: The L3DAS23 datasets' Kaggle licence (Task 1's record read; Task 2's record
    was not). Earlier editions differ, see upstream_licences.
  dataset_licence_source: src-kaggle-l3das23-task1
  dataset_licence_quote: '"licenseName":"CC BY-SA 4.0"'
  upstream_licences: L3DAS22 is CC BY 4.0 on Kaggle and L3DAS21 CC BY 4.0 on Zenodo. Librispeech and
    FSD50K keep their own terms, which were not read.
  upstream_licences_source: src-kaggle-l3das22
  upstream_licences_quote: '"licenseName":"Attribution 4.0 International (CC BY 4.0)"'
  size:
    - count: 900
      unit: 30-second data points (7.5 hours) in the Task 2 dataset
      subset: L3DAS23 Task 2
      source: src-arxiv-2402-09245-v1
      quote: We generate 900 30-secondlong data points (a total of 7.5 hours)
    - count: 40000
      unit: recordings of up to 12 seconds (over 40,000, about 90 hours) in the Task 1 dataset
      subset: L3DAS23 Task 1
      note: The L3DAS23 Task 1 page says "more than 4000"; the paper's figure matches L3DAS22's and
        the 90 hours.
      source: src-arxiv-2402-09245-v1
      quote: Task 1 includes over 40,000 virtual 3D audio recordings, each lasting up to 12 seconds,
        resulting in approximately 90 hours of total duration.
    - count: 24
      unit: result submissions (17 teams in Task 1, 7 in Task 2), from 46 registrations
      subset: L3DAS22
      source: src-arxiv-2202-10372-v1
      quote: 'The L3DAS22 Challenge has received 46 registrations and 24 result submissions: 17 teams
        submitted results for the task 1 and 7 teams for task 2.'
    - count: 6
      unit: participating team entries (4 in Task 1, 2 in Task 2)
      subset: L3DAS23
      source: src-arxiv-2402-09245-v1
      quote: Overall, 4 teams participated in Task 1 and 2 in Task 2.
  submission_limit:
    max_submissions: 1
    period_days: 0
    per: participant, per edition (one team and one set of results; a resubmission replaces the
      earlier one)
    source: src-l3das-icassp2023-rules

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The L3DAS team, DIET Department, Sapienza University of Rome
  maintainer_basis:
    reason: The project is funded through Sapienza and run by its DIET department's team, which
      wrote each edition's paper; co-organisers came from Kuaishou Technology and the University of
      Campinas (2022) and UT Austin (2023).
    source: src-l3das-site
    quote: 'HYD3A: Hypercomplex Deep Learning for 3D Audio Analysis, Sapienza University of Rome, 2019.'
  maintainer_type: academic-lab
  maintainer_type_note: conference-workshop was considered, because each edition was hosted by a
    different conference (MLSP, then ICASSP twice), but one standing team at Sapienza ran all three.
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: >
    Teams sent their blind-test outputs, a 2-page report and a CO2 statement through a Google Form (or
    by e-mail where Google was blocked), and the organisers scored them against targets the teams never
    saw. No server scored automatically; held-out-server is the nearest term, as for DCASE. The rules
    require the results to come with a paper, and the top five could submit it to ICASSP (in 2023 all
    teams could).
  submission_process_source: src-l3das-icassp2023-rules
  submission_process_quote: The results should be accompanied by a paper describing the proposed
    method.
  independence_flags:
    - flag: prize-sponsored-by-industry
      source: src-l3das-icassp2022-index
      quote: Prizes will be awarded to the challenge winners thanks to the support of Kuaishou
        Technology.
  independence_flags_note: >
    Kuaishou Technology paid the L3DAS22 prizes (600 and 250 dollars to the first two of each task), and
    three Kuaishou authors are on the L3DAS22 paper; no Kuaishou team is in the L3DAS22 rankings read.
    L3DAS21 and L3DAS23 name no prizes. The organisers' baselines appear in the result tables unranked.
    In L3DAS23 Task 2 the organisers ranked JLESS above a team with a higher T2 metric, on their judgement
    of result quality. maintainer-competes-on-own-benchmark was looked for and not found.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only the organisers hold the blind test targets. The development set, metric code and
      baselines are public, so development-set numbers can be reproduced, but not the official ones.
    source: src-l3das-mlsp2021-index
    quote: In a second step, we will release the test sets without truth labels. Participants must
      submit the results obtained for the latter.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: Each edition's supporting API (l3das/L3DAS21, L3DAS22, L3DAS23 on GitHub), whose
    metrics.py holds task1_metric and location_sensitive_detection, with validate_submission.py for
    the output format.
  harness_source: src-github-l3das23-readme
  harness_quote: The functions **task1_metric** and **location_sensitive_detection** compute the
    evaluation metrics for task 1 and task 2, respectively.
  submission_channel:
    source: src-l3das-icassp2023-submission
    quote: Results and papers can be submitted via the appropriate Google Form
  code_licence: null
  code_licence_note: The three l3das repositories state no licence (GitHub's licence metadata is
    null, read 2026-11-05; not a quoted Source).
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition (the data, rooms and Task 2 distance threshold change), which split
  # (the blind test set the challenge ranked, or the development set later papers use), which track and microphone
  # configuration (1-mic or 2-mic, audio-only or audio-visual), whether external data was used, and the scoring code
  # (the Wav2Vec checkpoint behind the WER).
  material_extra:
    - subset_used
    - training_data_policy
    - eligibility_track
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: The two tasks are ranked separately and teams enter either or both; nothing combines them.
  source: src-arxiv-2202-10372-v1
  quote: Challenge winners have been selected according to the best performance for each task,
    separately.

homepage: https://www.l3das.com/
repository: https://github.com/l3das/L3DAS23
dataset_url: https://www.kaggle.com/datasets/l3dasteam/l3das23-task1
leaderboard_url: https://www.l3das.com/icassp2023/results.html
maintainer_url: https://www.l3das.com/editions.html

versions:
  - version: '2021'
    label: L3DAS21 (IEEE MLSP 2021)
    version_kind: edition
    released: 2021-03-27
    changes: The first edition, a 65-hour dataset from impulse responses measured in one office with
      two Ambisonics microphones; FaSNet and SELDNet baselines. Task 1 results were posted for two
      teams (the winner's metric 0.8651).
    breaking: true
    superseded_by: '2022'
    frozen: true
    sources:
      - src-l3das-mlsp2021-index
      - src-l3das-mlsp2021-results
      - src-arxiv-2104-05499
      - src-zenodo-4642005
  - version: '2022'
    label: L3DAS22 (IEEE ICASSP 2022 Grand Challenge)
    version_kind: edition
    released: 2021-11-22
    changes: A regenerated dataset from the same office (over 94 hours), a beamforming U-Net
      baseline for Task 1 (the L3DAS21 winner's architecture), a rewritten API and a 2 m threshold
      for Task 2; 17 teams in Task 1 and 7 in Task 2; prizes from Kuaishou Technology.
    breaking: true
    supersedes_version: '2021'
    superseded_by: '2023'
    frozen: true
    sources:
      - src-l3das-icassp2022-index
      - src-l3das-icassp2022-results
      - src-arxiv-2202-10372-v1
      - src-kaggle-l3das22
  - version: '2023'
    label: L3DAS23 (IEEE ICASSP 2023 Grand Challenge)
    version_kind: edition
    released: 2022-12-15
    changes: Impulse responses and images simulated in 68 houses with SoundSpaces 2.0, an
      audio-visual track beside the audio-only one, and a 1.75 m threshold for Task 2; 4 teams in
      Task 1 and 2 in Task 2. The last edition.
    breaking: true
    supersedes_version: '2022'
    frozen: true
    sources:
      - src-l3das-icassp2023
      - src-l3das-icassp2023-results
      - src-arxiv-2402-09245-v1
      - src-kaggle-l3das23-task1

subsets:
  - id: l3das#task1-3d-speech-enhancement
    label: Task 1, 3D Speech Enhancement (2021-2023)
    scored_separately: true
    evidence:
      - source: src-l3das-icassp2023-task1
        quote: The final metric for this task is given by (STOI+(1−WER))/2, which lies in the 0-1
          range and higher values are better.
      - source: src-l3das-mlsp2021-results
        quote: 'Note: The challenge metric is computed as (STOI+(1-WER))/2'
    notes: Extract the clean monophonic speech from an Ambisonics mixture with up to three office
      noises. No audio-speech leaf covers speech enhancement (bench tag-gap logged), so the subset
      carries no domain_override and sits under the family's primary only through the series.
  - id: l3das#task2-3d-seld
    label: Task 2, 3D Sound Event Localization and Detection (2021-2023)
    scored_separately: true
    evidence:
      - source: src-l3das-icassp2023-task2
        quote: This metric considers a true positive only if a sound class is correctly predicted in
          a temporal frame and if it its predicted location lies within a cartesian distance from
          the true position of at most 1.75 m.
    notes: Up to three overlapping sounds of 14 office classes, located in Cartesian space relative
      to microphone A; the threshold was 2 m in 2022 and 1.75 m in 2023.
  - id: l3das#2023-audio-visual
    label: L3DAS23 audio-visual track (both tasks)
    scored_separately: false
    evidence:
      - source: src-l3das-icassp2023
        quote: 'Therefore, each task involves 2 separate tracks: audio-only and audio-visual track, where
          each provides two subtracks, i.e. 1-mic and 2-mic recordings.'
    notes: An image of microphone A's view is an extra input. The official ranking is one table per
      task across tracks; results per track and microphone configuration were published separately.
subsets_note: >
  The subsets are the two tasks, which every edition kept. The 1-mic and 2-mic sub-tracks (all editions)
  and the 2023 audio-only track are not separate subsets: teams could report their best configuration,
  and each task had one ranking.

tags:
  - speech-enhancement

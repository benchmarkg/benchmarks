  sources_note: >
    The l3das.com pages were read with scripts and styles stripped. The L3DAS23 challenge page and the
    L3DAS24 page list organisers by name, and the L3DAS22 results page has a team named after a person,
    so those three are withheld from archiving with the names outside the extracts. The arXiv PDFs and
    the Zenodo record are DOI sources. The Kaggle records are the anonymous JSON of Kaggle's dataset API,
    read without logging in. The v4 PDF of arXiv 2506.13127 is the evidence of current use.
  confidence: medium
  review_checks:
    - check: The primary domain is audio-event-detection-localization, from Task 2. Task 1 (speech
        enhancement) has no leaf, and on participation (17 and 4 teams against 7 and 2) and later
        use it is the larger half of the series. If a speech-enhancement leaf is added (the tag-gap
        record proposes one), it may deserve the primary, with SELD secondary.
      field: domain
      source: src-arxiv-2202-10372-v1
      quote: 'The L3DAS22 Challenge has received 46 registrations and 24 result submissions: 17 teams
        submitted results for the task 1 and 7 teams for task 2.'
    - check: activity closed or between-rounds. The 2024 page replaces the challenge with a special
        session and nothing later was found, but no source declares the series over, and the L3DAS23
        paper speaks of future work. If the team announces another challenge, between-rounds or
        round-scheduled applies.
      field: activity
      source: src-arxiv-2402-09245-v1
      quote: future work will incorporate new 3D acoustic scenarios, diverse microphone
        configurations, and novel tasks toward more complete audio-visual setups.
    - check: lifecycle is active on one June 2026 paper (arXiv 2506.13127v4) that scores on the
        L3DAS23 development set, not the blind test set. If development-set use does not count as
        results on the instrument, mature fits (a formally ended competition keeps the instrument's
        standing).
      field: lifecycle
      source: src-arxiv-2506-13127-v4
      quote: BETWEEN DISTILLED AND UNDISTILLED MODELS ON THE DEVELOPMENT SET IN THE SE TRACK OF
        L3DAS23
    - check: Difference from DCASE's SELD task (dcase.yaml, from 2019). L3DAS's SELD uses two
        first-order Ambisonics microphones 20 cm apart in one office (2021-2022) or simulated houses
        (2023), 14 office classes from FSD50K, positions in Cartesian or cylindrical coordinates
        with a distance threshold, and is paired with a speech enhancement task; DCASE's SELD runs
        on its own recorded spatial scenes, scored by DCASE's own metrics, and in 2026 became
        semantic acoustic imaging. The L3DAS22 paper credits DCASE2019 with introducing SELD. They
        are separate maintainers and data, so separate entries with no lineage link; a reviewer may
        want a related-to note.
      field: lineage
      source: src-arxiv-2202-10372-v1
      quote: SELD can be considered as a combination of the traditional sound event detection and
        sound source localization tasks, and it was presented for the
    - check: Whether the blind test targets were ever released. The L3DAS22 paper says the blind set
        was "initially" released without targets; the Kaggle and Zenodo records read offer the test
        inputs only, and the 2026 paper scores on the development set. If the targets are public,
        data.access is fully-open after each edition and reproducibility becomes fully-automatable.
      field: data.access
      source: src-arxiv-2202-10372-v1
      quote: evaluation and was initially released with the only predictors data, without target
        labels/signals.
    - check: L3DAS23 Task 2 ranks JLESS (T2 0.239) above NERCSLIP-USTC (T2 0.242), on the
        organisers' judgement of result quality beside the metric. The ranking is then partly an
        organiser judgement, which no evaluation_method term records.
      field: evaluation_method
      source: src-l3das-icassp2023-results
      quote: '* The quality of the results produced, as well as the T2 metric, was considered to define
        the ranking order.'
    - check: Task 2's metric is tagged classification-metric (an F-score). The location-sensitive
        detection metric is defined within the SELD literature, so domain-metric could be argued.
      field: evaluation_method
    - check: The Task 1 size. The L3DAS23 Task 1 page says "more than 4000" recordings while the
        paper says over 40,000 and about 90 hours; the paper's figure is used, and the page's is
        probably a dropped zero.
      field: data.size
      source: src-l3das-icassp2023-task1
      quote: more than 4000 virtual 3D audio with a duration up to 12 seconds
    - check: submission_limit is one set of results per participant per edition, read from the rule
        that no one may join two teams; a team could replace its submission before the deadline.
      field: data.submission_limit
      source: src-l3das-icassp2023-submission
      quote: each new submission will replace the one(s) previously made
    - check: L3DAS21 results were found for Task 1 only (two teams); the MLSP 2021 results page
        lists no Task 2 ranking, and the L3DAS21 Task 2 outcome was not established.
      field: versions
      source: src-l3das-mlsp2021-results
      quote: 'Metric: 0.8651 WER: 0.1558 STOI: 0.8860'
  personal_data_excluded:
    - source: src-l3das-icassp2023
      what: the organisers' names, and the team mailbox in a mailto link
    - source: src-l3das-wcci2024
      what: the special session organisers' names, and the team mailbox in a mailto link
    - source: src-l3das-icassp2022-results
      what: a team named after a person in the Task 1 ranking

# data/benchmarks/audio-speech/blizzard-challenge.yaml
#
# P1-S7-T03, audio-speech entry 9 of 9. Filled from the summary papers of the two latest editions in the ISCA
# Archive, The Blizzard Challenge 2025 (doi 10.21437/Blizzard.2025-1) and The Blizzard Challenge 2023 (doi
# 10.21437/Blizzard.2023-1), each read as the text of its PDF; the ISCA Archive's proceedings pages of the 2025
# and 2023 workshops; the abstract page of the first edition's paper (Interspeech 2005); the Centre for Speech
# Technology Research's two Blizzard pages at the University of Edinburgh (the data and tools index, and the
# archive of submissions and listening-test results); Zenodo's record of the 2025 training material; the 2027
# edition's page on the SSW 2027 site; and ISCA SynSIG's events page. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The series' old site, synsig.org, now answers every path with a redirect to an unrelated commercial site, and
# its current page (www.wiki.ed.ac.uk) and the 2025 call and rules (blogs.helsinki.fi) are closed to crawlers by
# robots.txt, so none of the three was read.

id: blizzard-challenge
name: Blizzard Challenge
aliases:
  - The Blizzard Challenge
tagline: 'The text-to-speech challenge since 2005: every team builds a voice from the same data, and listeners
  judge the speech.'
description: >
  The speech-synthesis community's shared evaluation, run since 2005. Each edition gives every team the
  same voice data and a set of test texts; teams build text-to-speech systems, synthesise the texts and
  submit the audio, and the organisers judge a selected subset in large listening tests. Listeners rate
  quality or naturalness on 5-point MOS scales and speaker similarity on MOS or MUSHRA-like 0-100 scales
  with a hidden natural reference; in 2023 intelligibility was the word error rate of listeners'
  transcriptions of semantically unpredictable sentences. The target speaker's natural speech is rated
  in
  the same tests. Results are reported per measure with pairwise Wilcoxon signed-rank tests, and no
  overall ranking is published. Editions have covered English, Mandarin and Shanghainese, Hindi, Tamil
  and Telugu, Spanish, French and Bildts. The 2023 edition, the eighteenth, was French: a 51-hour hub
  task
  and a 2-hour spoke task, with 18 and 14 teams. The 2025 edition was Bildts, a low-resource variety of
  the northern Netherlands: a 7-hour main task and a zero-shot task with a 10-second reference, with 7
  and
  5 teams, judged by native Bildts listeners and by Dutch and English-speaking listeners recruited on
  Prolific. The challenge now runs every two years beside ISCA's Speech Synthesis Workshop. The 2027
  edition, accented zero-shot synthesis of spontaneous Brazilian and European Portuguese with about 790
  hours of training speech, opened registration on 1 July 2026 and takes submissions until 12 April 2027.
  Each edition's submitted speech and listener scores are released afterwards through the University of
  Edinburgh's CSTR.
self_description:
  source: src-isca-blizzard-2025-summary
  quote: Each edition provides shared datasets and evaluation protocols to enable direct comparison
    of synthesis approaches
paper:
  title: The Blizzard Challenge 2025
  doi: 10.21437/Blizzard.2025-1
  source: src-isca-blizzard-2025-summary
released_note: The first edition ran in 2005 (Black and Tokuda, Interspeech 2005). Its first two
  voice databases were released in 2004 and its test texts in January 2005; no source read gives one
  release day, so released is left empty.
released_source: src-isca-interspeech-2005-black05
released_quote: In January of 2005, we released two further databases and a set of 50 utterance
  texts from each of five genres
release_venue: Interspeech 2005

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speech-synthesis
  secondary:
    - language/low-resource-languages
  per_edition: true
domain_basis:
  reason: Every edition scores speech that the entrants synthesised from text, as listeners hear it.
    The 2025 edition was built around Bildts, a variety with no automatic metrics or pretrained
    models, which is the secondary leaf's case; it applies to that edition, not to the series.
  source: src-isca-interspeech-2005-black05
  quote: 'Their resulting synthesized utterances were then presented to three groups of listeners: speech
    experts, volunteers, and US English-speaking undergraduates'
domain_considered_and_rejected:
  - term: multimodal/audio-language
    reason: Intelligibility tests (2023's transcriptions, 2025's word-level issue marking) check
      that the audio carries the input text, but quality, naturalness, similarity and
      Bildts-likeness score the audio alone, and audio-speech/speech-synthesis is the leaf for
      text-to-speech.
  - term: audio-speech/speaker-tasks
    reason: Speaker similarity is rated on generated speech; no system identifies, verifies or
      separates speakers.
capability:
  - generation-fidelity
  - communication
capability_basis:
  generation-fidelity:
    reason: Similarity tests ask listeners how close the synthetic voice is to the target speaker,
      against a hidden natural reference, and the 2025 zero-shot task scored whether a voice built
      from a 10-second reference kept the speaker's identity.
    source: src-isca-blizzard-2025-summary
    quote: This task explored whether systems could preserve both speaker identity and Bildts
      language characteristics with a short reference audio
  communication:
    reason: Intelligibility is scored on what the listener understood. In 2023 listeners wrote down
      the semantically unpredictable sentences they heard, and the word error rate of their
      transcriptions is the score. 2025 replaced it with word-level issue marking (see
      review_checks).
    source: src-isca-blizzard-2023-summary
    quote: Test 3 measured Word Error Rate in a transcription task of SUS stimuli
capability_considered_and_rejected:
  - term: sample-efficiency
    reason: The target speaker's data is fixed (2 hours in 2023's spoke task, 10 seconds in 2025's
      zero-shot task), but external data is unrestricted in those tasks, so no total budget is
      scored.
    source: src-isca-blizzard-2025-summary
    quote: BS1 had no constraints on external data or model usage
  - term: perception
    reason: The system's input is text; the audio is its output, and the listeners do the
      perceiving.
  - term: transfer-learning
    reason: Zero-shot tasks (2025, 2027) keep the task and change the speaker; no deliberately
      different task or objective is scored.

evaluation_method:
  - human-crowd-eval
  - reference-metric
evaluation_method_basis:
  reason: Every score comes from listeners recruited without a domain qualification. In 2025 they
    were native Bildts speakers recruited locally and Prolific workers screened on first language or
    English fluency; in 2023, French-native Prolific workers and online volunteers. A language
    screen is not a domain qualification under the term's test. reference-metric is 2023's word
    error rate of listeners' transcriptions against the sentence text (see review_checks).
  source: src-isca-blizzard-2025-summary
  quote: Listeners were recruited via Prolific. As screening criterion, we imposed Dutch to be the
    first and primary language
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: Speech experts take part as self-identified volunteers and their ratings are pooled with
      the rest; no edition read recruits listeners for a professional credential.
    source: src-isca-interspeech-2005-black05
    quote: 'Their resulting synthesized utterances were then presented to three groups of listeners: speech
      experts, volunteers, and US English-speaking undergraduates'
  - term: entrant-relative-ranking
    reason: Each system's scores are its own listeners' ratings, compared pair by pair for
      significance; the organisers publish no rank or pool-fitted scale and say the figures' order
      is not a ranking.
    source: src-isca-blizzard-2025-summary
    quote: The order in each figure cannot be interpreted as the system ranking, as it does not
      reflect the results of the pairwise comparisons
designed_for_subjects:
  - generative-media-model
designed_for_subjects_basis:
  reason: Entrants are text-to-speech systems, and every score is a property of the speech they
    generate. The 2023 and 2025 entrants were all neural (FastSpeech-, Tacotron-, flow- and
    diffusion-based); the sources read do not describe the earlier editions' unit-selection and
    statistical systems.
  source: src-isca-blizzard-2023-summary
  quote: All teams used neural-based systems
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The voices are trained on the edition's data, but they generate new speech from text
      rather than reproduce a reference, which the term's distinction sends to
      generative-media-model.
  - term: domain-specialist-model
    reason: Speech synthesis is a general audio task, not a scientific, clinical or
      engineering-design discipline.

lifecycle: active
lifecycle_basis:
  reason: The 2025 edition was scored and published in August 2025, and the 2027 edition is under
    way, its training data released on 1 July 2026.
  source: src-blizzard-2027-site
  quote: July 1, 2026 Training dataset released
activity: round-scheduled
activity_note: Registration for the 2027 edition has been open since 1 July 2026 and closes on 12
  January 2027, with a registration fee due by 13 April 2027. Submissions open only when the test
  set is released on 1 February 2027; results are due on 21 June 2027.
activity_basis:
  reason: The 2027 round is announced with dates, but its submission route opens with the test set;
    open registration alone is round-scheduled under the activity terms' tests.
  source: src-blizzard-2027-site
  quote: April 12, 2027 Deadline for participants to submit their systems

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Idiap kNN-TTS (Blizzard Challenge 2025)
    source: src-isca-blizzard-2025-proceedings
    observed_on: 2026-10-14
    quote: Idiap kNN-TTS System for the Blizzard Challenge 2025
  - system: NRCC (Blizzard Challenge 2025)
    source: src-isca-blizzard-2025-proceedings
    observed_on: 2026-10-14
    quote: The NRCC Submission to the Blizzard Challenge 2025
evaluation_target: learned-system
execution_mode: panel
ground_truth_source: none
ground_truth_source_note: The listeners' ratings are the score; nothing is checked against a stored
  answer. The target speaker's natural speech is rated in the same tests as a reference, and 2023's
  intelligibility test compared listeners' transcriptions with the sentence text.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Each edition's submitted speech, test material and listener scores are released, and the
    2025 listening-test recipes are public, so anyone can rerun a test with a subset of the systems
    and a new one. A rerun's listeners and pool differ, so its numbers are not the edition's.
  source: src-cstr-blizzard-results
  quote: Re-running the challenge, such as with a subset of the systems plus a new system

task:
  exists: true
  input:
    - the edition's voice data, hours of one speaker's recorded speech with transcripts, or in
      zero-shot tasks a short reference utterance of an unseen target speaker
    - the test texts, given as orthographic text (sentences, and in 2025 also paragraphs and whole
      texts)
  output: Synthetic speech for every test text in the target speaker's voice, submitted as audio
    files for the organisers' listening tests.
  scoring: Listeners rate a selected subset per measure (MOS for quality or naturalness, MOS or
    MUSHRA-like similarity with a hidden natural reference, transcription WER for intelligibility in
    2023, Bildts-likeness, appropriateness and word-level issues in 2025), and systems are compared
    per measure by pairwise Wilcoxon signed-rank tests. No overall ranking.
  source: src-isca-blizzard-2025-summary
  quote: For most measures, we used Wilcoxon signed-rank tests for pairwise system comparisons

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Judged on the 2025 edition, the latest one scored, as the term's rule for blind
    rounds asks. Its training material is on Zenodo under CC BY 4.0, and its submissions, test
    material and listener scores are in the CSTR archive (2025 Version 1, 15 GB). The archive page
    states terms of use but no registration; its download host's robots.txt disallows crawlers, so
    the downloads themselves were not checked for this entry. Earlier editions' voice data
    (2019-2021) went to registered participants only.
  access_basis:
    reason: The headline numbers are listener scores, and each edition's archive releases them with
      the speech they rate.
    source: src-cstr-blizzard-results
    quote: These distributions include the synthetic speech submitted by participants in the
      challenge along with listeners' scores
  access_by_phase:
    during_edition: The test texts reach registered participants at test time (in 2027 registration
      carries a fee), and the listener judgements do not exist until the listening tests are run.
    after_edition: Submitted speech, test material and listener scores are released for download,
      with the edition's training data (on Zenodo for 2023 and 2025).
  records_access: fully-open
  records_licence: 'The Blizzard Challenge archive terms: academic and non-commercial research (some parts
    also commercial research and development); not for marketing or sales, and not for re-distribution.'
  records_licence_source: src-cstr-blizzard-results
  records_licence_quote: NOT for re-distribution
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each edition brings its own language, voice data and test texts (French in 2023, Bildts
      in 2025, Portuguese in 2027), and its rankings are produced on them.
    source: src-isca-blizzard-2025-summary
    quote: Each edition provides shared datasets and evaluation protocols to enable direct
      comparison of synthesis approaches
  data_provenance:
    - real-world-instrument
  data_provenance_note: The voices are recordings of real speakers as found or recorded for the
    challenge (2023, LibriVox audiobooks and a studio recording of an actress; 2025, a broadcaster's
    radio columns and 10-second recordings of six Bildts speakers), and the natural reference speech
    in the tests is the same speakers' recordings. The test texts are published writing (an
    audiobook's book, Bildts columns, course materials and books) plus sentences written for the
    tests, which no provenance term covers (see review_checks).
  data_provenance_source: src-isca-blizzard-2025-summary
  data_provenance_quote: The data came from 138 audio columns about daily life topics
  contamination_risk: medium
  contamination_risk_note: Listener judgements do not exist when speech is submitted, and test texts
    reach teams only at test time. But in 2023 the quality and similarity test sentences came from
    another audiobook read by the hub speaker, and the hub task admitted any publicly available
    audio, so a public recording of the test sentences in the target voice was a plausible training
    route. 2025 forbade any further speech of the task speakers. No use of such a route is
    evidenced.
  contamination_risk_source: src-isca-blizzard-2023-summary
  contamination_risk_quote: 1000 distinct sentences read by NEB but from another audiobook not
    included in the Hub dataset
  contamination_evidence: []
  ceiling_anchor_type: null
  ceiling_anchor_type_note: The target speaker's natural speech is rated in every test beside the
    systems (system A in 2023, the ground truth in 2025, where the best system's similarity was 42
    points below it on the 100-point scale). It is one person's own speech, not an expert or crowd
    average, so no anchor type was chosen (see review_checks).
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The 2025 training material. The listening-test archive has its own terms
    (records_licence), and earlier editions' voice data carried their own licences, some restricting
    commercial use.
  dataset_licence_source: src-zenodo-blizzard-2025
  dataset_licence_quote: Creative Commons Attribution 4.0 International
  size:
    - count: 7
      unit: teams in the main task (BH1), 5 of them also in the zero-shot task (BS1)
      subset: 2025 edition
      source: src-isca-blizzard-2025-summary
      quote: Seven teams participated in the main task and five in the zero-shot task
    - count: 7
      unit: hours of training speech from one male speaker
      subset: 2025 BH1
      source: src-isca-blizzard-2025-summary
      quote: a dataset of around 7 hours from one male speaker was provided
    - count: 18
      unit: teams in the hub task (FH1), with 14 in the spoke task (FS1)
      subset: 2023 edition
      source: src-isca-blizzard-2023-summary
      quote: 18 teams participated in the hub task and 14 in the spoke task
    - count: 110
      unit: semantically unpredictable sentences in the intelligibility test set
      subset: 2023 INTFH1
      source: src-isca-blizzard-2023-summary
      quote: The remaining 110 sentences are semantically unpredictable sentences (SUS)
    - count: 790
      unit: hours of training speech in three accents (approximate)
      subset: 2027 edition
      source: src-blizzard-2027-site
      quote: totalling ~790 hours
  languages:
    - Bildts
    - French
    - Portuguese
    - English
    - Mandarin Chinese
    - Shanghainese
    - Hindi
    - Tamil
    - Telugu
    - Spanish
  languages_note: By edition; the 2025 summary lists the languages before Bildts, and the 2027 page
    Portuguese.
  languages_source: src-isca-blizzard-2025-summary
  languages_quote: English, Chinese languages (Mandarin and Shanghainese), Indian languages (Hindi,
    Tamil, and Telugu), Spanish, and French

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Blizzard Challenge organisers, a committee that changes with each edition
    (GIPSA-lab in 2023; the University of Groningen, Fryske Akademy and the University of Helsinki
    in 2025; the University of São Paulo with INESC-ID and IST Lisbon in 2027), under ISCA's Speech
    Synthesis SIG; the University of Edinburgh's CSTR keeps the data archive.
  maintainer_basis:
    reason: Each edition is held beside ISCA SynSIG's Speech Synthesis Workshop and run by a new
      organising team; CSTR's pages hold the data and results of the editions since 2008.
    source: src-synsig-events
    quote: SynSIG is a Special Interest Group of ISCA
  maintainer_type: conference-workshop
  maintainer_type_basis:
    reason: A recurring challenge held with a workshop, whose organising committee changes between
      editions, which the term's test puts ahead of the lab that keeps the archive.
    source: src-isca-blizzard-2025-summary
    quote: Aligning with the Speech Synthesis Workshop 2025 theme
  submission_process:
    - held-out-server
    - maintainer-run
  submission_process_note: Teams submit synthetic speech for the whole test set by the deadline, and
    the organisers select the stimuli and run the listening tests afterwards, against judgements
    that do not exist at submission. maintainer-run is the organisers' own benchmark systems rated
    beside the entrants (BF and BT in 2023). Teams without a paper were evaluated in 2025, so the
    series is not publication-gated as read (see review_checks).
  submission_process_source: src-isca-blizzard-2025-summary
  submission_process_quote: Participants were asked to synthesise and submit all the material in the
    test set
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-isca-blizzard-2023-proceedings
      quote: The GIPSA-Lab Text-To-Speech System for the Blizzard Challenge 2023 Martin Lenglet,
        Olivier Perrotin
    - flag: grader-from-evaluated-party
      source: src-isca-blizzard-2023-summary
      quote: Yet, the listening test completion rate by Blizzard participants is low
  independence_flags_note: In 2023 the organisers' lab, GIPSA-lab, entered a system whose authors
    include the organiser and a chair; the 2025 committee had no entry. In 2023, as in earlier
    editions, teams were asked to recruit volunteer listeners and some participants took the tests;
    2025 recruited only Bildts speakers and Prolific workers. 2023's acknowledged funding is public
    French research funding; the 2025 and 2027 sponsors were not read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: human-panel
  compute_tier_basis:
    reason: The cost of a score is the listeners' paid time; each team's own training and synthesis
      cost varies with its system.
    source: src-isca-blizzard-2023-summary
    quote: Listeners were compensated at a rate of 10£/ hour
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: Every measure needs recruited listeners; 2025 had no automatic measure at all.
    source: src-isca-blizzard-2025-summary
    quote: As a low-resource variety without automatic metrics or pretrained models, Bildts required
      evaluation by human listeners exclusively
  reproducibility_blockers:
    - human-raters
  reproducibility_blockers_note: The 2025 tests also needed native Bildts listeners, a community of
    about 10,000 speakers recruited through leaflets, newspapers and personal contacts.
  harness_availability: reference-implementation-only
  harness: The 2025 listening-test recipes and analysis scripts
    (github.com/seblemaguer/bc2025_evaluation_recipes, on the replikant toolkit); they run a
    listening test, but the official score is the listeners' judgement.
  harness_source: src-isca-blizzard-2025-summary
  harness_quote: as well as the scripts for analysing the results, are available online
  submission_channel:
    source: src-blizzard-2027-site
    quote: April 12, 2027 Deadline for participants to submit their systems
  code_licence: null
  code_licence_note: GitHub's API reports no licence for seblemaguer/bc2025_evaluation_recipes (read
    2026-10-14; last pushed 2025-12-17); not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the human-judged profile: which training data the voice was allowed (2023's hub and 2025's main
  # task admit public data and models only; the spoke and zero-shot tasks admit any). The edition, task and
  # listener audience are subset_used; the listener pool itself has no condition field.
  material_extra:
    - training_data_policy
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each measure is reported apart, and the organisers say the order of systems in a figure is
    not a ranking.
  source: src-isca-blizzard-2025-summary
  quote: The order in each figure cannot be interpreted as the system ranking, as it does not
    reflect the results of the pairwise comparisons
headline_metric: null
no_legitimate_aggregate: true

homepage: https://www.wiki.ed.ac.uk/spaces/BlizzardChallenge/overview
homepage_note: Linked as the Blizzard Challenge page from SynSIG's events page and the 2027 site.
  Its robots.txt disallows all crawlers, so it was not read. The former site, www.synsig.org, now
  redirects every path to an unrelated commercial site, though CSTR's pages still link it.
dataset_url: https://www.cstr.ed.ac.uk/projects/blizzard/
maintainer_url: https://isca-speech.org/SynSIG-Events

versions:
  - version: '2005'
    label: Blizzard Challenge 2005
    version_kind: edition
    changes: The first edition. Teams built voices from CMU ARCTIC databases (two released in 2004,
      two more with 50 test texts in each of five genres in January 2005), and speech experts,
      volunteers and US English-speaking undergraduates rated them.
    breaking: true
    frozen: true
    sources:
      - src-isca-interspeech-2005-black05
  - version: '2023'
    label: Blizzard Challenge 2023 (French)
    version_kind: edition
    changes: The eighteenth edition. Hub task FH1, a voice from 51 hours of one LibriVox reader with
      public data and models only; spoke task FS1, a voice from 2 hours of a professional actress
      with any data. Quality and similarity MOS, MUSHRA for the best systems, and intelligibility by
      SUS transcription WER and a homograph test; 18 and 14 teams. Workshop in Grenoble on 29 August
      2023.
    breaking: true
    superseded_by: '2025'
    frozen: true
    sources:
      - src-isca-blizzard-2023-summary
      - src-isca-blizzard-2023-proceedings
  - version: '2025'
    label: Blizzard Challenge 2025 (Bildts)
    version_kind: edition
    changes: Bildts. Main task BH1, a voice from 7 hours of one male speaker with public data and
      models only; zero-shot task BS1, two unseen speakers from one 10-second reference each, with
      any data. Bildts-likeness, naturalness, appropriateness, P.85 quality measures, RPT-like
      word-level issues and MUSHRA-like similarity, from three listener audiences; no
      intelligibility transcription. 7 and 5 teams. Workshop on 27 August 2025.
    breaking: true
    supersedes_version: '2023'
    superseded_by: '2027'
    frozen: true
    sources:
      - src-isca-blizzard-2025-summary
      - src-isca-blizzard-2025-proceedings
      - src-zenodo-blizzard-2025
  - version: '2027'
    label: Blizzard Challenge 2027 (Portuguese, in progress)
    version_kind: edition
    released: 2026-07-01
    changes: Accented zero-shot synthesis of spontaneous Portuguese (São Paulo, Recife and European
      Portuguese), with about 790 hours of training speech; a mandatory hub task restricted to
      public data and an optional spoke task without restriction. Test set on 1 February 2027,
      submissions by 12 April 2027, results on 21 June 2027, workshop in Maceió on 9 September 2027.
    breaking: true
    supersedes_version: '2025'
    frozen: false
    sources:
      - src-blizzard-2027-site
versions_note: Only the editions read for this entry are listed. The editions from 2006 to 2021 are
  not itemised; CSTR's archive holds results from 2008 to 2021, and the 2023 edition was the
  eighteenth.


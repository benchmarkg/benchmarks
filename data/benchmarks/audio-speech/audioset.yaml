# data/benchmarks/audio-speech/audioset.yaml
#
# P1-S7-T03, audio-speech entry 5 of 9. Filled from three pages of the AudioSet site (home, download, and the May
# 2021 strong-label download, scripts and styles stripped); the ICASSP 2017 paper, read as the text of Google's own
# PDF of it (publication 45857); the ontology repository's README at master; and the v1 PDF of a September 2025
# paper that reports AudioSet mAP (arXiv 2509.10391). GitHub's metadata for audioset/ontology and Crossref's record
# of the paper's DOI were read and are not quoted Sources. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.
#
# The entry is the dataset's evaluation set as the audio-tagging benchmark: the clip-level labels of the 2017 v1
# release, with the May 2021 temporally-strong evaluation labels as a subset. The site defines no scoring protocol
# and no leaderboard; mAP over the 527 classes is the papers' convention.

id: audioset
name: AudioSet
aliases:
  - Audio Set
  - Audio Set YouTube Corpus
tagline: 2M human-labelled 10-second YouTube clips in 527 sound classes; its eval set is the
  audio-tagging mAP benchmark.
description: >
  Google's dataset of sound events: an ontology of 632 audio event classes and 2,084,320 ten-second segments
  of YouTube videos, each labelled by human raters with the classes they heard, 527 of which carry labels
  in the release. It is split into a balanced evaluation set of 20,383 segments, a balanced training set
  of 22,176 (AS-20K) and an unbalanced training set of 2,042,985 (with the balanced set, AS-2M). Google
  distributes the segment lists and labels, with 128-dimensional per-second audio features, under CC BY
  4.0, but not the audio. Each segment is a YouTube video id with start and end times, and clips vanish
  as videos are removed, so papers score the copy of the evaluation set they could still download. The
  release paper's baseline is scored by mean average precision over the classes, with AUC and d-prime;
  mAP over the 527 classes on the evaluation set became the field's audio-tagging measure, with no official
  scorer or leaderboard. In May 2021 Google added temporally-strong labels, with each event's start and
  end, for 16,996 evaluation clips and about 5% of the training set.
self_description:
  source: src-audioset-site
  quote: By releasing AudioSet, we hope to provide a common, realistic-scale evaluation task for
    audio event detection
paper:
  title: 'Audio Set: An ontology and human-labeled dataset for audio events'
  doi: 10.1109/ICASSP.2017.7952261
  source: src-icassp-2017-audioset
released: 2017-03-06
released_note: The ontology's v1 date, as its README gives it; the site does not date the release.
  The evaluation segment list's header is dated the day before, and the paper was presented at
  ICASSP 2017 (Crossref's record, not a quoted Source, starts the conference on 2017-03-05).
released_source: src-github-audioset-ontology-readme
released_quote: v1 2017-03-06
release_venue: IEEE ICASSP 2017

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/audio-event-understanding
  secondary:
    - audio-speech/audio-event-detection-localization
    - audio-speech/music-understanding
domain_basis:
  reason: The headline task asks which of 527 sound classes are present in a 10-second clip, with no
    timing, which is event understanding. The May 2021 strong labels mark each event's start and end
    and score 960 ms frames, the detection leaf's case (see subsets). The ontology's music branch,
    instruments and genres among the labelled classes, makes music understanding secondary.
  source: src-audioset-site
  quote: covering a wide range of human and animal sounds, musical instruments and genres, and
    common everyday environmental sounds
capability:
  - perception
capability_basis:
  perception:
    reason: The input is a clip's audio, or features computed from it, and the score measures which
      sound classes were recovered from it.
    source: src-icassp-2017-audioset
    quote: to create a system able to predict the human labelings from audio alone
capability_considered_and_rejected:
  - term: transfer-learning
    reason: Current systems are often pretrained elsewhere before fine-tuning, but the benchmark
      trains and scores on the same 527 classes, its training and evaluation sets differing only by
      sampling, and no transfer is what it reports.

evaluation_method:
  - classification-metric
evaluation_method_basis:
  reason: Each class's average precision comes from ranking every evaluation segment by the
    classifier's score, and the mean over the classes is reported, with AUC and d-prime beside it in
    the release paper. That is precision and recall over a score ranking, with no sweep of IoU
    thresholds, so it is a general classification statistic.
  source: src-icassp-2017-audioset
  quote: then for each category ranking all segments by their scores
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Its inclusion test names mAP, but its exclusion test and classification-metric's keep
      only mAP over IoU thresholds there; AudioSet's mAP is clip-level average precision per class,
      the area under each class's precision-recall curve.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The intended systems are audio event classifiers trained on AudioSet's own training splits
    and scored as trained; audio tagging is a general audio task, not a discipline.
  source: src-icassp-2017-audioset
  quote: we used the training portion of the Audio Set YouTube Corpus to train a shallow
    fully-connected neural network
as_used:
  - protocol: mAP over the 527 classes on the copy of the evaluation set the authors could still
      download from YouTube, after training on the AS-20K or AS-2M clips still available (20,550 and
      1,783,977).
    split: eval (18,858 of the 20,383 listed segments)
    source: src-arxiv-2509-10391-v1
    quote: Additionally, our test set contains 18,858 samples (while the original AudioSet test set
      had 20,383 samples [30]).
    note: A September 2025 paper on consistency regularisation, built on AudioMAE. Each lab scores
      the subset that survived when it downloaded, so mAP figures from different papers are on
      different evaluation sets (comparability).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the evaluation set by others, for example a September 2025
    paper at 46.9 mAP after training on AS-2M. Google's last content change is the May 2021
    strong-label release, and the ontology repository is archived, last pushed on 2018-05-21 (GitHub
    API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2509-10391-v1
  quote: On our 2M setup, we observe an 4.9% relative improvement from 44.7 to 46.9 mAP.
activity: no-submission-channel
activity_basis:
  reason: The site offers downloads and a users' mailing list, and no leaderboard, server or
    submission route; results appear in users' papers.
  source: src-audioset-site
  quote: The dataset and machine-extracted features are available at the download page.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: AudioMAE fine-tuned with consistency regularisation (arXiv 2509.10391)
    source: src-arxiv-2509-10391-v1
    observed_on: 2026-10-14
    quote: On our 2M setup, we observe an 4.9% relative improvement from 44.7 to 46.9 mAP.
  - system: The release paper's baseline, a shallow fully-connected classifier on video-topic
      embeddings
    source: src-icassp-2017-audioset
    observed_on: 2026-10-14
    quote: This system gave a balanced mean Average Precision across the 485 categories of 0.314,
      and an average AUC of 0.959
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The human raters' clip-level labels for the evaluation segments. They are
  published with the segment list, not withheld.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The segment lists, labels and features are public, and anyone can fetch the clips still on
    YouTube, train and compute mAP. A past paper's evaluation set cannot be rebuilt exactly, since
    clips have vanished since.
  source: src-audioset-download
  quote: Text (csv) files describing, for each segment, the YouTube video ID, start time, end time,
    and one or more labels.

task:
  exists: true
  input:
    - the soundtrack of a 10-second YouTube segment, or the released 128-dimensional per-second
      features computed from it
  output: A score for each of the 527 sound classes; a segment can carry several labels.
  scoring: Average precision per class, from ranking all evaluation segments by their scores,
    averaged over the classes (mAP); the release paper also reports AUC and d-prime.
  task_distribution_drifts: true
  task_distribution_drifts_note: The scored set shrinks as YouTube videos are removed. The 2021
    strong labels covered 16,996 evaluation clips, and a 2025 paper could download 18,858 of the
    20,383 listed.
  task_distribution_drifts_source: src-audioset-download-strong
  task_distribution_drifts_quote: We collected these new annotations for all 16,996 clips of the
    evaluation set (excluding the ones that have become unavailable since the original release)
  source: src-icassp-2017-audioset
  quote: then for each category ranking all segments by their scores

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Google distributes the segment lists, labels and 128-dimensional features, not the
    audio. Each segment points to a YouTube video, fetched from YouTube, where videos disappear.
    ADR-0020 rules pointer-only media fully-open with a note and puts the vanishing clips with
    reproducibility (Stage 3's audioset-001).
  access_basis:
    reason: The labels, segment lists and features download without an account or an agreement,
      under CC BY 4.0.
    source: src-audioset-download
    quote: The dataset is made available by Google Inc. under a Creative Commons Attribution 4.0
      International (CC BY 4.0) license
  refresh: versioned-releases
  refresh_basis:
    reason: The clip-level labels are the "v1" release, which took in a rerating then about half
      done. In May 2021 Google added temporally-strong labels in a dated release. No later release
      of the clip-level labels was found.
    source: src-audioset-download-strong
    quote: Temporally-Strong Labels Download (May 2021)
  data_provenance:
    - web-scraped
    - crowd-authored
  data_provenance_note: The clips are segments of public YouTube videos, nominated by their
    metadata, an internal video annotation system and content search. Their labels come from human
    raters, three per segment with a majority vote; experts checked samples of the labels
    afterwards. The raters' background is not described beyond that.
  data_provenance_source: src-icassp-2017-audioset
  data_provenance_quote: Each segment was rated by three raters and a majority vote was required to
    record an overall rating.
  contamination_risk: medium
  contamination_risk_note: The evaluation clips are public YouTube audio and their labels have been
    public since 2017, so a route into audio pretraining is plausible. The training and evaluation
    sets come from distinct videos. No source assesses it.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No anchor is reported. The raters were unanimous on 76.2% of votes, and
    the site's quality assessment found classes with poor label accuracy, which bounds attainable
    mAP below 1 by an unmeasured amount.
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The ontology is CC BY-SA 4.0 (same Source), and the 2021 strong labels CC BY
    4.0. The audio is not distributed; the YouTube videos' own terms are not discussed in the
    sources read.
  dataset_licence_source: src-audioset-download
  dataset_licence_quote: The dataset is made available by Google Inc. under a Creative Commons
    Attribution 4.0 International (CC BY 4.0) license
  size:
    - count: 20383
      unit: segments, at least 59 for each of the 527 classes
      subset: evaluation set (eval_segments.csv, v1)
      note: The CSV header the download page reproduces as its example reads num_segs=20371. Papers
        score fewer, the clips still downloadable (as_used).
      source: src-audioset-download
      quote: 20,383 segments from distinct videos, providing at least 59 examples for each of the
        527 sound classes that are used
    - count: 2084320
      unit: 10-second segments
      subset: the whole v1 release
      source: src-audioset-site
      quote: a collection of 2,084,320 human-labeled 10-second sound clips drawn from YouTube videos
    - count: 22176
      unit: segments
      subset: balanced training set (AS-20K)
      source: src-audioset-download
      quote: 22,176 segments from distinct videos chosen with the same criteria
    - count: 2042985
      unit: segments
      subset: unbalanced training set (with the balanced set, AS-2M)
      source: src-audioset-download
      quote: 2,042,985 segments from distinct videos, representing the remainder of the dataset
    - count: 16996
      unit: evaluation clips with temporally-strong labels
      subset: May 2021 strong labels
      source: src-audioset-download-strong
      quote: We collected these new annotations for all 16,996 clips of the evaluation set
        (excluding the ones that have become unavailable since the original release)
    - count: 14203
      unit: evaluation excerpts with positive and negative labels on 960 ms frames
      subset: May 2021 strong labels, framed evaluation set
      source: src-audioset-download-strong
      quote: includes 300,307 positive labels, and 658,221 negative labels within 14,203 excerpts
        from the evaluation set
    - count: 17748
      unit: segments, over 485 categories
      subset: the evaluation set as the ICASSP 2017 paper describes it, before the v1 release
      source: src-icassp-2017-audioset
      quote: The unbalanced train set contains 1,771,873 segments and the evaluation set contains
        17,748.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Google (the Sound Understanding group, Machine Perception Research)
  maintainer_basis:
    reason: Google publishes and licenses the dataset, and its Sound Understanding group presents
      it; the paper's authors are at Google.
    source: src-audioset-site
    quote: This dataset is brought to you from the Sound Understanding group in the Machine
      Perception Research organization at Google.
  maintainer_type: industry-lab
  submission_process:
    - literature-only
  submission_process_note: The release paper's baseline is the only maintainer result. Everyone else
    trains and reports on the evaluation set in their own papers.
  submission_process_source: src-icassp-2017-audioset
  submission_process_quote: To give a sense of the performance possible with this data, we have
    trained a simple baseline system.
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own. The release paper's
    baseline is built on a Google embedding network, and Google's VGGish features are distributed
    with the data.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: >
    A fresh run is automatic end to end: fetch the clips still on YouTube, train, compute mAP. The evaluation
    set shrinks as videos vanish, so a past run cannot be repeated on the same clips, which is `live-world-state`'s
    case, but tier 3 forbids that blocker beside fully-automatable (as on forecastbench and kaggle-game-arena;
    Stage 3's audioset-008 abstained on the conflict).
  reproducibility_tier_basis:
    reason: Everything a score needs is public or fetchable without an account, the segment lists
      and labels from Google and the clips from YouTube; no human, physical or maintainer-only step
      enters the score.
    source: src-audioset-download
    quote: Text (csv) files describing, for each segment, the YouTube video ID, start time, end
      time, and one or more labels.
  reproducibility_blockers: []
  harness_availability: reference-implementation-only
  harness_availability_note: No scorer is published. The download page points to VGGish, the model
    that computed the released features, and to the YouTube-8M starter code for training on them;
    neither is designated as AudioSet's scorer, and neither repository was read.
  harness: VGGish (tensorflow/models) and the YouTube-8M starter code
  harness_source: src-audioset-download
  harness_quote: You can use the YouTube-8M starter code to train models on the released features
    from both AudioSet as well as YouTube-8M.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which evaluation clips were scored (each lab's surviving download of the 20,383,
  # or the features extracted at release) and what the model was trained on (AS-20K or AS-2M as downloaded, and any
  # pretraining, such as AudioMAE's checkpoint). n_samples was considered: it counts samples drawn per item, not
  # items scored, so the clip count belongs with subset_used.
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://research.google.com/audioset/
repository: https://github.com/audioset/ontology
dataset_url: https://research.google.com/audioset/download.html

subsets:
  - id: audioset#eval
    label: Balanced evaluation set, clip-level labels (eval_segments.csv)
    items: 20383
    scored_separately: true
    notes: The headline set, as listed in the v1 release; papers score the clips they could still
      download.
  - id: audioset#strong-eval
    label: Temporally-strong evaluation labels (May 2021)
    items: 16996
    scored_separately: true
    domain_override:
      primary: audio-speech/audio-event-detection-localization
    evidence:
      - source: src-audioset-download-strong
        quote: and to indicate the start and end times of each event by dragging out a region on a
          spectrogram
      - source: src-audioset-download-strong
        quote: to better reward classification with accurate temporal resolution
    notes: Every event in 16,996 evaluation clips marked with its start and end. A framed set of
      14,203 excerpts carries positive and negative labels on 960 ms frames, over 356 classes. The
      ICASSP 2021 paper that reports on it was not read.

tags:
  - audio-tagging
  - sound-events
  - ontology
  - youtube
  - multi-label

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-icassp-2017-audioset
    - src-audioset-site
    - src-audioset-download
    - src-audioset-download-strong
    - src-github-audioset-ontology-readme
    - src-arxiv-2509-10391-v1
  sources_note: >
    The ICASSP 2017 paper as the text of Google's PDF (research.google.com/pubs/archive/45857.pdf; the
    publication page carries only the abstract), withheld from archiving because its author line holds
    the authors' e-mail addresses. The site's home, download and strong-label pages with scripts and styles
    stripped. The ontology README at master, withheld for its author's address, read for the v1 date.
    The 2025 paper's v1 PDF (a DOI, not archived), read as text with the authors' addresses kept out.
  confidence: medium
  review_checks:
    - check: Identity. The entry is the v1 clip-level evaluation set as the tagging benchmark, with
        the May 2021 strong labels as a subset and audio-event-detection-localization secondary. The
        strong-label evaluation (ICASSP 2021, not read) could instead be an entry of its own.
      field: subsets
      source: src-audioset-download-strong
      quote: Temporally-Strong Labels Download (May 2021)
    - check: lifecycle active rests on one independent paper (September 2025), ADR-0020's open
        question 3. mature was considered, but results are still produced in the ordinary way, which
        mature's exclusion test sends to active.
      field: lifecycle
    - check: The evaluation set drifts between labs as clips vanish; it is recorded in as_used,
        task_distribution_drifts and comparability (subset_used). Whether the YouTube-only audio
        should also lower data.access below fully-open, which ADR-0020 ruled against.
      field: data.access
      source: src-arxiv-2509-10391-v1
      quote: Due to YouTube restrictions, our AS-20k and AS-2M datasets contain 20,550 and 1,783,977
        samples, respectively.
    - check: reproducibility_tier fully-automatable with live-world-state left out, because tier 3
        forbids the pair; Stage 3 abstained on the same conflict (audioset-008).
      field: execution.reproducibility_tier
    - check: crowd-authored rests on the raters being non-specialists, which the sources imply
        (experts checked their labels afterwards) but do not state.
      field: data.data_provenance
      source: src-audioset-download
      quote: We conducted an internal Quality Assessment task where experts checked 10 random
        segments for most of the classes.
    - check: music-understanding as a secondary domain rests on the ontology's instrument and genre
        classes, a minority of the 527.
      field: domain
    - check: independence_flags is empty, as on the other literature-only entries; Stage 3's
        classification recorded maintainer-competes-on-own-benchmark for the release paper's Google
        baseline.
      field: governance.independence_flags

# data/benchmarks/audio-speech/open-asr-leaderboard.yaml
#
# P1-S7-T03, audio-speech entry 2 of 9. Filled from the Open ASR Leaderboard paper, arXiv 2510.06961 read as its v4
# PDF (2026-03-30), and its abstract page; the Hugging Face Space's own app files at commit 840ca16 (constants.py,
# the About and Private-data text, and init.py, the version registry and changelog) and its public API record; the
# evaluation repository's README at main; the maintainers' private-data blog post of 2026-05-06; and the model card
# of Phonon-2 (FermionResearch, October 2026), a model on the board that reports its own Open ASR average. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: open-asr-leaderboard
name: Open ASR Leaderboard
aliases:
  - Open Automatic Speech Recognition Leaderboard
tagline: "Hugging Face's speech-recognition leaderboard: models ranked by average WER over many test sets,
  with RTFx."
description: >
  Hugging Face's leaderboard for automatic speech recognition, launched in September 2023 as the Space
  hf-audio/open_asr_leaderboard, with its evaluation code in huggingface/open_asr_leaderboard. Open and
  proprietary systems are run on the test splits of existing corpora in three public tracks: short-form
  English (clips under 30 s, from LibriSpeech, AMI, Earnings-22, GigaSpeech, SPGISpeech and VoxPopuli,
  with URGENT24 and Voice Arena added in 2026), multilingual (FLEURS, Common Voice and MLS, in up to eight
  languages, with Hindi from Voice Arena) and long-form English (Earnings-21, Earnings-22, CORAAL). A
  fourth tab scores models on private sets from Appen, DataoceanAI and Voice Arena, published only as
  aggregates. Transcripts are normalised in the manner of Whisper's English normaliser and scored by word
  error rate; models are ranked by WER macro-averaged over a track's datasets, with the inverse real-time
  factor (RTFx) measured in the same run on fixed hardware. Since 24 July 2026 the default English average
  includes the private sets. Every change of datasets or scoring since 24 June 2026 is a dated version
  pinned to result commits. New models arrive by pull request with their evaluation scripts, which the
  maintainers re-run.
self_description:
  source: src-arxiv-2510-06961
  quote: We present the Open ASR Leaderboard, a reproducible benchmarking platform with community
    contributions from academia and industry
external_ids:
  huggingface: hf-audio/open-asr-leaderboard
  arxiv: '2510.06961'
paper:
  title: 'Open ASR Leaderboard: Towards Reproducible and Transparent Multilingual and Long-Form Speech
    Recognition Evaluation'
  arxiv: '2510.06961'
  version_read: v4
  source: src-arxiv-2510-06961-v4
released: 2023-09-07
released_note: The Space's creation date in its Hugging Face API record; the maintainers' blog post
  dates the launch to September 2023. The paper's first arXiv version followed on 2025-10-08.
released_source: src-hf-api-open-asr-leaderboard
released_quote: '"createdAt":"2023-09-07T15:06:05.000Z"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speech-recognition
  secondary:
    - language/multilingual
domain_basis:
  reason: Every track scores transcripts recovered from audio by word error rate against reference
    transcripts. The Multilingual tab reports WER per language (German, French, Italian, Spanish,
    Portuguese, Dutch, Hindi, Armenian) so that languages can be compared, the secondary leaf's
    case.
  source: src-arxiv-2510-06961
  quote: We standardize word error rate (WER) and inverse real-time factor (RTFx) evaluation for
    consistent accuracy-efficiency comparisons across model architectures and toolkits
domain_considered_and_rejected:
  - term: multimodal/audio-language
    reason: The score is transcription error against a reference transcript, which is recovering
      language from the signal, not a scored correspondence between audio and text as two
      modalities.
capability:
  - perception
capability_basis:
  perception:
    reason: The input is raw audio and the score, word error rate, measures how much of the spoken
      content was recovered from it.
    source: src-arxiv-2510-06961-v4
    quote: 'We report results on two metrics: word error rate (WER) for comparing transcription quality,
      and inverse real-time factor (RTFx) for comparing inference speed.'
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The private sets exist to reward models that generalise to real-world data and are
      reported by accent (Avg US, Avg Non-US), but entrants train on data of their own choosing, so
      no distribution they were fitted to is defined and no shifted condition is reported beside a
      fitted one.
    source: src-hf-open-asr-leaderboard-constants
    quote: The purpose of this benchmark is to address risks of overfitting to public datasets
  - term: communication
    reason: The content is language, but word error rate scores transcription accuracy; no
      recipient's understanding is measured.

evaluation_method:
  - reference-metric
evaluation_method_basis:
  reason: Word error rate is an edit distance between the normalised transcript and the reference
    transcript, averaged over the datasets of a track. RTFx is measured in the same run and reported
    beside it, but does not rank (secondary_axes).
  source: src-arxiv-2510-06961-v4
  quote: On the leaderboard, models are sorted according to average WER across all datasets of a
    corresponding task.
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: WER is standard within speech recognition, but it is a general edit-distance statistic
      against references, which the vocabulary assigns to reference-metric.
designed_for_subjects:
  - task-specific-supervised-model
  - hosted-inference-endpoint
designed_for_subjects_basis:
  reason: Most entrants are purpose-built speech recognisers (Conformer, Whisper-family and
    self-supervised encoders with CTC, transducer, TDT, transformer or LLM decoders) run locally
    under the leaderboard's scripts. Commercial speech APIs are evaluated as served by their
    vendors' endpoints, with no RTFx and no stated architecture, and some are versioned by date
    (microsoft/azure-speech-07-2026).
  source: src-arxiv-2510-06961-v4
  quote: Our comparison standardizes the evaluation across multiple open-source toolkits (ESPNet
    [9], NeMo [10], SpeechBrain [11], Transformers [12]), commercial APIs
designed_for_subjects_considered_and_rejected:
  - term: full-product-pipeline
    reason: The API entrants are shipped services, but each is a single named model served by its
      vendor's endpoint (ElevenLabs Scribe v2, AssemblyAI Universal 3 Pro, Microsoft's dated Azure
      Speech releases), which the term's exclusion sends to hosted-inference-endpoint.
    source: src-hf-open-asr-leaderboard-init
    quote: Add microsoft/azure-speech-07-2026, google/gemma-4-E4B-it
  - term: instruction-tuned-model
    reason: General multimodal models prompted to transcribe are ranked (Microsoft Phi 4 Multimodal
      Instruct, Google's gemma-4-E4B-it), but the board is built for recognisers and scores every
      entrant by the same transcription protocol.
    source: src-arxiv-2510-06961-v4
    quote: Microsoft Phi 4 Multimodal Instruct
as_used:
  - protocol: An average WER over the seven public English short-form sets (LibriSpeech clean and
      other, AMI, Earnings-22, GigaSpeech, SPGISpeech, VoxPopuli) run with the leaderboard's code,
      not the current default average, which uses cleaned splits and adds URGENT24, Voice Arena and
      the private sets.
    split: test
    source: src-hf-phonon-2-card
    quote: Across the Open ASR Leaderboard's seven English sets it averages 5.21 % word error
    note: FermionResearch's Phonon-2 model card (October 2026); the model was added to the
      leaderboard on 2026-10-02. Rows marked as the leaderboard's own are copied from it, the others
      computed by the developer.

lifecycle: active
lifecycle_basis:
  reason: The newest version, dated 2026-10-09, adds a model and changes the English default
    average; the Space was last modified on 2026-10-09 (its API record) and the repository last
    pushed the same day (GitHub API).
  source: src-hf-open-asr-leaderboard-init
  quote: Add openai/gpt-transcribe. Add URGENT24 to avg English WER.
activity: accepting-submissions
activity_basis:
  reason: A continuously open leaderboard with no rounds; new models (and datasets) come in by pull
    request to the evaluation repository.
  source: src-hf-open-asr-leaderboard-constants
  quote: If you want results for a model (or dataset) not listed here, you can directly open a pull
    request (PR) on GitHub!

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: NVIDIA Parakeet TDT 0.6B v2
    source: src-arxiv-2510-06961-v4
    observed_on: 2026-10-14
    quote: the highest-ranking TDT model (NVIDIA Parakeet TDT 0.6B v2) places 10th
  - system: Phonon-2 (FermionResearch)
    source: src-hf-open-asr-leaderboard-init
    observed_on: 2026-10-14
    quote: add FermionResearch/Phonon-2
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The human reference transcripts of each constituent's test split, and of
  the private sets the maintainers hold; Hindi references are lattices of accepted spellings.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The public tracks can be rerun by anyone with the released scripts and Hub datasets, but
    the default English average has included the private sets since 24 July 2026, and only the
    maintainers run those.
  source: src-hf-open-asr-leaderboard-init
  quote: Private data used in default average.

task:
  exists: true
  input:
    - 'a speech recording: a clip under 30 s for the short-form English and multilingual tracks, or a
      recording over 30 s for long-form English'
  output: A transcript, normalised before scoring (punctuation and casing removed, numbers and
    spellings standardised, fillers dropped, following Whisper's English normaliser).
  scoring: WER per dataset, macro-averaged over the datasets of a track; the English ranking uses
    the version's default datasets, which since 24 July 2026 include two private aggregates. RTFx is
    measured in the same run. Hindi is scored against lattices of accepted variants.
  source: src-hf-open-asr-leaderboard-constants
  quote: For each task, we take a macro-average over all datasets.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The public test sets are on the Hugging Face Hub, gathered into the ungated
    hf-audio/open-asr-leaderboard dataset (SPGISpeech's own copy is under a user agreement; Hub API
    records, read 2026-10-14). The Appen, DataoceanAI and Voice Arena sets are never released and
    are published only as aggregates.
  access_basis:
    reason: The default English average mixes the public sets with private sets that only the
      maintainers hold and score, so it cannot be computed from downloaded data; the withheld sets
      decide.
    source: src-hf-open-asr-leaderboard-init
    quote: Private data used in default average.
  refresh: versioned-releases
  refresh_basis:
    reason: Every change to the test sets or scoring since May 2026 carries a dated changelog entry,
      and since 24 June 2026 each dated version pins the results to dataset commits and can be
      selected on the board. New models add rows without changing anyone's score.
    source: src-hf-open-asr-leaderboard-init
    quote: Add versioning for seeing past results.
  data_provenance:
    - real-world-instrument
    - inherited-from-constituents
  data_provenance_note: The public tracks reuse the test splits of existing corpora (AMI,
    Earnings-21 and 22, GigaSpeech, LibriSpeech, SPGISpeech, VoxPopuli, URGENT 2024, FLEURS, Common
    Voice, MLS, CORAAL), each documented by its own paper; URGENT24 inherits its overlaid noise and
    room responses from the challenge dataset. All are recorded speech with human transcripts, as
    are the vendor-supplied private sets and Voice Arena's conversations.
  data_provenance_source: src-hf-open-asr-leaderboard-constants
  data_provenance_quote: The "Leaderboard" tab, namely short-form English, uses the test split of
    the following datasets.
  contamination_risk: medium
  contamination_risk_note: The public sets are long-established corpora (LibriSpeech dates from
    2015), and the paper names no contamination of them. The maintainers mitigate the route with a
    non-commercial set per track, the private sets and benchmark-fitting scripts that measure
    whether a model overfits the reference transcripts. The private sets come from data vendors
    whose data models may be trained on; the maintainers asked them not to supply these sets to
    clients.
  contamination_risk_source: src-arxiv-2510-06961-v4
  contamination_risk_quote: While it is not possible to fully guarantee the absence of test-set
    contamination
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: The leaderboard states no licence for its test sets as a whole; each keeps
    its corpus's licence.
  upstream_licences: Per constituent, as the About tab lists them, for example CC-BY-4.0 (AMI,
    LibriSpeech, FLEURS, MLS), CC-BY-SA-4.0 (Earnings-21 and 22), Apache-2.0 (GigaSpeech), CC0
    (VoxPopuli, Common Voice), CC-BY-NC-4.0 (CORAAL), a user agreement (SPGISpeech) and
    research-only terms for URGENT24's noise sources. TED-LIUM v3 was removed in May 2026 after its
    licence changed.
  upstream_licences_source: src-arxiv-2510-06961-v4
  upstream_licences_quote: each track includes at least one evaluation dataset released under a
    non-commercial license
  size:
    - count: 12
      unit: public datasets across the three tracks, as of 27 March 2026
      subset: the paper (v4)
      source: src-arxiv-2510-06961-v4
      quote: It compares 86 open-source and proprietary systems across 12 datasets, with English
        short- and long-form and multilingual short-form tracks
    - count: 11
      unit: private English datasets from Appen Inc. and DataoceanAI, scripted and conversational
      subset: Private data tab, May 2026 (Voice Arena's private sets added in August 2026)
      source: src-hf-open-asr-leaderboard-init
      quote: 11 datasets covering scripted and conversational speech across US, British, Australian,
        Canadian, and Indian accents
  languages:
    - English
    - German
    - French
    - Italian
    - Spanish
    - Portuguese
    - Dutch
    - Hindi
    - Armenian
  languages_note: The multilingual languages are the Space's language table; Dutch was added in
    September 2026 and Armenian in October 2026.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Hugging Face (the hf-audio Space and the huggingface/open_asr_leaderboard repository)
  maintainer_basis:
    reason: The Space belongs to the hf-audio organisation and the evaluation repository to
      huggingface (GitHub API); the paper's lead authors did the work at Hugging Face, with
      co-authors from NVIDIA, Cambridge, Mistral AI and OpenAI.
    source: src-hf-api-open-asr-leaderboard
    quote: '"author":"hf-audio"'
  maintainer_type: industry-lab
  submission_process:
    - sandboxed-rerun
    - containerized-algorithm-submission
    - maintainer-run
  submission_process_note: Contributors open a pull request with the model's evaluation scripts and
    self-reported results; the maintainers run the scripts in their own environment, since June 2026
    as Docker images on an H200 through HF Jobs, before the leaderboard is updated
    (sandboxed-rerun). The maintainers then run the submitted model, packaged as a Docker image, on
    the private sets, which the contributor never sees (containerized-algorithm-submission). Only 56
    of the 86 models in the paper came in by external pull request, and the About tab asks which
    models the maintainers should benchmark next (maintainer-run). API models have a route of their
    own in the repository.
  submission_process_source: src-arxiv-2510-06961-v4
  submission_process_quote: We verify these scripts in our environment to ensure consistent
    evaluation across models before updating the leaderboard.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2510-06961-v4
      quote: NVIDIA (18), Meta/Facebook (14), OpenAI (8), Hugging Face (5)
    - flag: single-evaluator-private-test-set
      source: src-github-open-asr-leaderboard-readme
      quote: After submitting a model to the leaderboard, the maintainers will evaluate on private
        sets
  independence_flags_note: Hugging Face ranks five of its own models, and three paper co-authors are
    NVIDIA staff, whose company had 18 models on the board in March 2026. Hugging Face runs every
    evaluation on the private sets and publishes only aggregates. The private sets come from
    commercial speech-data vendors, which the maintainers asked not to supply these sets to their
    clients; no flag names a test-data supplier that sells data to entrants (taxonomy failure
    2026-09-28-open-asr-leaderboard-006).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: single-gpu
  compute_tier_note: Official runs of open models are Docker images on one H200 (141 GB) through HF
    Jobs, so that RTFx is comparable; the paper's runs used one A100. API entrants cost API spend
    instead, which is why api-credits-only was weighed (see the review checks).
  compute_tier_source: src-github-open-asr-leaderboard-readme
  compute_tier_quote: 1x H200 (141 GB)
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The public tracks are fully automatable with the released scripts and Docker images, but
      the default English average needs the private sets, which only the maintainers can run, and
      the most restrictive part of the headline decides.
    source: src-hf-open-asr-leaderboard-init
    quote: Private data used in default average.
  reproducibility_blockers:
    - private-test-set
  reproducibility_blockers_source: src-hf-open-asr-leaderboard-constants
  reproducibility_blockers_quote: This tab evaluates models on private (non-public) speech datasets
    from multiple data providers.
  harness_availability: official-harness
  harness: huggingface/open_asr_leaderboard (per-family run_eval.py scripts with the repository's
    text normaliser, run as Docker images on HF Jobs)
  harness_source: src-github-open-asr-leaderboard-readme
  harness_quote: The script outputs a JSONL file with predictions and prints WER and RTFx after
    completion.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for huggingface/open_asr_leaderboard, read
    2026-10-14; not a quoted Source.
  est_cost_usd:
    min: 2.92
    max: 5.58
    basis: The README's example costs of one full HF Jobs run over the main public English
      short-form sets, for three open models, at $5.00 an hour on one H200.
    source: src-github-open-asr-leaderboard-readme
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile (subset_used, which here is the version's default dataset set): the harness,
  # because the English normaliser changed on 24 June 2026 and moved every WER; and the provider snapshot,
  # because API entrants are endpoints whose versions are dated (azure-speech-05-2026, then 07-2026). The
  # hardware moves RTFx (A100 in the paper, H200 since June 2026) but not WER, so it is not material here.
  material_extra:
    - harness
    - provider_snapshot
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The board ranks by Average WER, a macro-average over the version's default datasets; users
    can toggle datasets, and a Rank delta column shows how the order moves against the default.
  source: src-hf-open-asr-leaderboard-constants
  quote: Models are ranked based on their Average WER, from lowest to highest.
secondary_axes:
  - throughput
secondary_axes_basis:
  reason: RTFx, seconds of audio transcribed per second of compute, is reported beside every WER.
    The sources call it a measure of speed and latency, but it is measured over batched audio at the
    largest batch that fits, which is a throughput.
  source: src-arxiv-2510-06961-v4
  quote: using a batch size of 64 whenever memory allowed

homepage: https://huggingface.co/spaces/hf-audio/open_asr_leaderboard
repository: https://github.com/huggingface/open_asr_leaderboard
dataset_url: https://huggingface.co/datasets/hf-audio/open-asr-leaderboard
leaderboard_url: https://huggingface.co/spaces/hf-audio/open_asr_leaderboard


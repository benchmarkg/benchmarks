# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2510-06961-v4
    - src-arxiv-2510-06961
    - src-hf-open-asr-leaderboard-constants
    - src-hf-open-asr-leaderboard-init
    - src-hf-api-open-asr-leaderboard
    - src-github-open-asr-leaderboard-readme
    - src-hf-blog-open-asr-private-data
    - src-hf-phonon-2-card
  sources_note: >
    The paper's v4 PDF (a DOI, not archived) read as text, with windows that keep the authors' contact
    line out; its abstract page for the first version's date. The Space renders by script, so its app
    files were read raw at commit 840ca16 (constants.py for the About and Private-data text, init.py for
    the version registry and changelog) beside its API record. The README at main; the private-data blog
    post with scripts and styles stripped, withheld from archiving because its comment thread shows a
    commenter's e-mail address; and the Phonon-2 model card at its commit, for current use.
  confidence: medium
  review_checks:
    - check: One entry for the whole board, with the short-form, multilingual, long-form and private
        tracks as subsets and the benchmark-fitting tab inside it. The paper calls the three public
        tracks tasks of one leaderboard; the private tab and the dated versions could argue for
        separate entries or editions.
      field: subsets
    - check: designed_for_subjects has hosted-inference-endpoint where the Stage-3 corpus record has
        full-product-pipeline. The API entrants are single named models served by their vendors,
        which full-product-pipeline's exclusion sends away, but the corpus classifier read them as
        products.
      field: designed_for_subjects
    - check: submission_process carries three routes. sandboxed-rerun rests on the paper's
        verification in the maintainers' environment; containerized-algorithm-submission on the
        private sets being run on the entrant's Docker configuration; maintainer-run on 30 of the
        paper's 86 models not arriving by external pull request and on the About tab's invitation,
        which no source states as the maintainers choosing models.
      field: governance.submission_process
      source: src-hf-blog-open-asr-private-data
      quote: We will verify the results on the public sets and compute the metrics on the private
        ones.
    - check: compute_tier single-gpu (an H200 mandated for open models) against api-credits-only
        (the board ranks API systems that need no GPU); the tests do not say which a mandate on one
        class of entrant gives (taxonomy failure 2026-09-28-open-asr-leaderboard-007, open).
      field: execution.compute_tier
    - check: The private-set suppliers sell speech data, possibly to entrants; no flag names it
        (failure 006, open). Entrants also pay Hugging Face for the HF Jobs runs that produce their
        rows, which could be read as evaluator-sells-evaluations; it was not assigned.
      field: governance.independence_flags
      source: src-github-open-asr-leaderboard-readme
      quote: and add credits for HF Jobs
    - check: secondary_axes records RTFx as throughput, though the sources call it speed and
        latency; latency is the other choice.
      field: secondary_axes
    - check: data.refresh versioned-releases holds from May 2026; how the board changed between its
        2023 launch and the paper's 12 datasets (CoVoST-2 and TED-LIUM then, Common Voice and
        cleaned splits now) is not dated in the sources read, which would make that period
        rolling-live.
      field: data.refresh
    - check: language/multilingual as a secondary domain rests on per-language WER columns; the
        language family's tests are written for text, and the multilingual track is one tab of a
        speech board.
      field: domain

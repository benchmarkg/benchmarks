curation:
  added_by: agent (P1-S7-T04)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2005-13981-v3
    - src-arxiv-2009-06122
    - src-arxiv-2101-01902
    - src-arxiv-2202-13288-v1
    - src-arxiv-2303-11510-v2
    - src-arxiv-2005-08138
    - src-arxiv-2010-13200
    - src-arxiv-2110-01763
    - src-github-dns-challenge-readme
    - src-github-dns-challenge-dnsmos-readme
    - src-github-dns-challenge-dns5-blind-script
    - src-github-dns-challenge-v2v3-blind-script
    - src-github-api-dns-challenge-branches
    - src-msr-dns-challenge-icassp-2023
    - src-arxiv-2603-20242-v2
  sources_note: >
    The first, fourth and fifth rounds' overview papers as the text of their PDFs, and the second and
    third rounds' abstract pages (DOIs, not archived), with windows clear of the authors' contact lines
    and the submitter lines; the abstract pages of the P.808, P.835 and DNSMOS P.835 papers (DOIs); the
    repository's README, DNSMOS README and two download scripts at commit 591184a, and its branch list
    from the GitHub API; Microsoft Research's page for the 2023 round, with scripts and styles stripped;
    and the v2 PDF of arXiv 2603.20242 as evidence of current use.
  confidence: medium
  review_checks:
    - check: Domain. Speech enhancement has no audio-speech leaf (logged with bench tag-gap,
        proposing audio-speech/speech-enhancement). speaker-tasks was chosen for its separating
        clause and the personalised, talker-suppressing tracks; speech-synthesis (speech output
        scored by listener MOS) was the runner-up. The 2020-2021 non-personalised tracks separate
        speech from noise, not speakers from each other.
      field: domain
    - check: lifecycle active rests on one July 2026 paper that scores the 2020 test sets with
        DNSMOS, not with the challenge's listening tests. Whether a DNSMOS score on a released test
        set counts as results produced against this instrument, rather than against the derived
        DNSMOS protocol, decides between active and mature.
      field: lifecycle
      source: src-arxiv-2603-20242-v2
      quote: We evaluate speech quality using DNSMOS [27].
    - check: activity closed. No source announces the series' end; it rests on the 2023 paper's
        'organized during 2019-2023', the fifth round's programme dates and the absence of later
        rounds. Microsoft's ICASSP 2024 grand challenges were not read; if a later round carries the
        DNS name, the series is not closed.
      field: activity
      source: src-arxiv-2303-11510-v2
      quote: DNS challenges were organized during 2019-2023 to stimulate research in deep speech
        enhancement
    - check: data.access train-open-test-held-out is judged on the fifth round, whose blind-set
        transcripts were not released; read on the 2020 test sets that later papers use, which have
        clean references and no withheld labels, the entry would be fully-open. The blind archives
        themselves were not downloaded.
      field: data.access
    - check: ground_truth_source held-out-labels rests on the 2022-2023 WAcc half; the P.808 and
        P.835 ratings that ranked 2020-2021, and half the later score, are panel judgements with no
        stored answer (none).
      field: ground_truth_source
    - check: evaluation_method model-derived-metric and composite rest on the 2022-2023 rounds only;
        2020-2021 were P.808 or P.835 MOS alone. Whether family tags should rest on two of five
        rounds.
      field: evaluation_method
      source: src-arxiv-2202-13288-v1
      quote: The motivation to add WAcc as an evaluation metric stems from the fact that several
        models from past challenges had noticeable WAcc degradation
    - check: Identity. One family entry with five rounds as editions and their tracks as subsets.
        DNSMOS and DNSMOS P.835, which Microsoft released as separate metrics and which most later
        papers report on the 2020 test sets, are treated as the scorer (harness), not as their own
        benchmarks; a reviewer may want the 2020 test set, as used with DNSMOS, as a separate entry
        linked by lineage.
      field: versions
    - check: contamination_risk medium rests on PTDB-TUG appearing both as the 2020 synthetic test
        clips' clean speech and among the fifth round's training corpora; which rounds' training
        data first included it, and whether the test speakers' sentences are in it, was not checked.
      field: data.contamination_risk
      source: src-arxiv-2005-13981-v3
      quote: For synthetic test clips, we used Graz University
    - check: independence_flags is empty. Prizes existed in 2020, but no source names the funder;
        the 2023 page's Results and Organizers tabs did not render in the served HTML and were not
        read.
      field: governance.independence_flags
      source: src-arxiv-2005-13981-v3
      quote: Hence, the three prizes can be easily picked based on speech quality.
    - check: publication-gated rests on the 2022 disqualifications; the 2020 and 2021 rules were not
        read.
      field: governance.submission_process
    - check: reproducible_by_third_party false follows the 2022-2023 score's internal WAcc; the
        2020-2021 rankings used only crowd MOS, which the open toolkits can rerun on the released
        blind sets.
      field: reproducible_by_third_party
    - check: The ICASSP 2021 round's scoring is read as P.808 MOS from the Interspeech 2021
        abstract's account of the earlier rounds (it names 'INTERSPEECH and ICASSP 2020', apparently
        meaning 2020 and ICASSP 2021) and the P.835 paper's statement that P.835 was first used in
        Interspeech 2021; the ICASSP 2021 paper's own abstract says only 'subjective tests', and its
        PDF was not read.
      field: evaluation_method
      source: src-arxiv-2101-01902
      quote: We also open-sourced a subjective evaluation framework based on ITU-T standard P.808,
        which was also used to evaluate participants of the challenge.

# data/benchmarks/audio-speech/dns-challenge.yaml
#
# P1-S7-T04, audio-speech entry 13. Filled from the overview papers of the first, fourth and fifth editions, read as
# the text of their PDFs (arXiv 2005.13981v3, Interspeech 2020; 2202.13288v1, ICASSP 2022; 2303.11510v2, ICASSP
# 2023), and the abstract pages of the second and third editions' papers (2009.06122, ICASSP 2021; 2101.01902,
# Interspeech 2021); the scoring method's papers, read as their abstract pages (2005.08138, the crowdsourced ITU-T
# P.808 toolkit; 2010.13200, the crowdsourced P.835 toolkit; 2110.01763, DNSMOS P.835); the microsoft/DNS-Challenge
# repository at master's head (commit 591184a, 2024-03-29): its README, the DNSMOS README and the two blind-test-set
# download scripts, with the GitHub API's branch list as the release history (the repository has no releases or
# tags); Microsoft Research's page for the ICASSP 2023 edition, where aka.ms/dns-challenge now lands (scripts and
# styles stripped); and the v2 PDF of arXiv 2603.20242 (July 2026), a paper that reports DNSMOS on the DNS Challenge
# 2020 test sets. Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.
#
# Speech enhancement has no audio-speech leaf; the nearest is chosen below and the miss is logged with bench tag-gap.

id: dns-challenge
name: Deep Noise Suppression Challenge
aliases:
  - DNS Challenge
  - Microsoft DNS Challenge
  - Deep Speech Enhancement Challenge
tagline: Microsoft's five-round speech enhancement challenge (2020-2023), ranked by crowdsourced
  listening tests.
description: >
  Microsoft's Deep Noise Suppression Challenge, five rounds held at Interspeech 2020, ICASSP 2021, Interspeech
  2021, ICASSP 2022 and ICASSP 2023. Entrants build single-channel speech enhancement models that remove
  background noise and, in later rounds, reverberation and interfering talkers, and submit the enhanced
  clips of a blind test set that is released a few days before the deadline. Microsoft scores them with
  its own crowdsourced listening tests: ITU-T P.808 absolute category rating MOS in 2020 and early 2021,
  then P.835 ratings of speech signal (SIG), background noise (BAK) and overall quality (OVRL), with a
  personalised variant that plays the primary talker's enrolment speech to the raters. From 2022 the rank
  is a challenge score that weights P.835 OVRL and word accuracy from a speech recogniser equally. Each
  round brought new real recordings collected through crowdsourcing (with synthetic mixtures beside them
  in 2020) and its own tracks: real-time and non-real-time (2020), real-time and personalised (ICASSP
  2021), wideband and fullband (Interspeech 2021), non-personalised and personalised fullband (2022),
  and headset and speakerphone (2023). Microsoft open-sourced the training corpora and synthesiser, the
  test sets, the P.808 and P.835 toolkits and the DNSMOS quality predictors, and the 2020 test sets in
  particular remain a common evaluation set for speech enhancement papers, now usually scored with DNSMOS
  rather than listeners.
self_description:
  source: src-arxiv-2303-11510-v2
  quote: DNS challenges were organized during 2019-2023 to stimulate research in deep speech
    enhancement
external_ids:
  arxiv: '2005.13981'
paper:
  title: 'The INTERSPEECH 2020 Deep Noise Suppression Challenge: Datasets, Subjective Testing Framework,
    and Challenge Results'
  arxiv: '2005.13981'
  version_read: v3
  source: src-arxiv-2005-13981-v3
released: null
released_note: The first round was held at Interspeech 2020; the v1 of its overview paper is dated
  16 May 2020, and an earlier announcement (arXiv 2001.08662) was not read. No source read gives the
  day the first data was released.
release_venue: Interspeech 2020
release_venue_source: src-arxiv-2303-11510-v2
release_venue_quote: Previous DNS challenges were organized at INTERSPEECH 2020, ICASSP 2021,
  INTERSPEECH 2021, and ICASSP 2022.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speaker-tasks
domain_basis:
  reason: The task is speech enhancement, which has no audio-speech leaf (logged with bench
    tag-gap). The nearest leaf is speaker-tasks, whose definition includes separating speakers from
    audio. Every round separates one talker's speech from noise and reverberation, and the
    personalised tracks (from ICASSP 2021) and both 2023 tracks keep the primary talker, given by
    enrolment speech, while suppressing neighbouring talkers. The score is on the enhanced audio
    itself.
  source: src-arxiv-2303-11510-v2
  quote: The goal is to enhance audio signal and preserve the primary talker while suppressing the
    neighboring talkers, noise, and reverberation.
domain_considered_and_rejected:
  - term: audio-speech/speech-synthesis
    reason: The runner-up. Speech audio is the output and listeners rate it on MOS scales, as in a
      TTS test, but the leaf is generating speech from text, and here the input is noisy speech.
  - term: audio-speech/speech-recognition
    reason: Word accuracy enters the score in 2022 and 2023, but a speech recogniser run by the
      organisers produces the transcript; the entrant only enhances the audio.
  - term: multimodal/audio-language
    reason: Nothing relates audio to language as a second modality; the enhanced audio is scored as
      audio.
capability:
  - perception
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: The input is raw noisy speech audio, and the score measures how well the target speech
      was recovered from it, as listeners hear it.
    source: src-arxiv-2005-13981-v3
    quote: Speech Enhancement aimed to maximize the subjective (perceptual) quality of the enhanced
      speech
  distribution-shift-generalization:
    reason: Training data is synthesised by mixing clean speech with noise, and the rounds are
      ranked on real recordings made on unseen devices and in unseen rooms, which the organisers
      chose because models that do well on synthetic mixtures fail on real recordings. The 2020
      results report synthetic, synthetic-reverberant and real clips as separate columns.
    source: src-arxiv-2005-13981-v3
    quote: While the performance is good on the synthetic test set, often the model performance
      degrades significantly on real recordings.
capability_considered_and_rejected:
  - term: generation-fidelity
    reason: The blind sets are real recordings with no clean reference, and the listeners rate the
      enhanced clip's absolute quality, not its closeness to a target. Only the 2020 synthetic clips
      have references, and the ranking did not use them.
  - term: transfer-learning
    reason: Personalised tracks add enrolment speech of the target talker, but the task and its
      score are unchanged.
  - term: communication
    reason: Word accuracy (2022-2023) measures whether a speech recogniser still understands the
      enhanced audio, a property of the signal rather than of any exchange with a listener.

evaluation_method:
  - human-crowd-eval
  - model-derived-metric
  - composite
evaluation_method_basis:
  reason: Every round is ranked by listeners recruited on Amazon Mechanical Turk and screened by
    hearing and environment tests, not by domain qualification (P.808 MOS in 2020 and ICASSP 2021;
    P.835 SIG, BAK and OVRL from Interspeech 2021). From 2022, word accuracy is computed by
    Microsoft's speech recogniser (Azure Speech Recognition) against the organisers' transcripts, a
    scoring model whose version is part of the result, and the challenge score averages the rescaled
    P.835 OVRL with it, which is composite.
  source: src-arxiv-2303-11510-v2
  quote: Final score = 0.5[WAcc + 0.25(OVRL − 1)]
evaluation_method_considered_and_rejected:
  - term: reference-metric
    reason: WAcc is 1 - WER, a fixed formula, but the hypothesis transcript comes from a speech
      recognition model, which the vocabulary's tie-break sends to model-derived-metric.
  - term: human-expert-eval
    reason: Raters are crowd workers qualified by a hearing and environment test, not by a
      professional credential.
    source: src-arxiv-2005-13981-v3
    quote: Raters are first qualified using a hearing and environmental test before they can start
      rating clips.
  - term: entrant-relative-ranking
    reason: ANOVA decides ties among the top teams, but each system's MOS is its own raters' scores,
      not a scale fitted to the pool of entrants.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants are noise suppression networks trained on noisy-clean pairs, the challenge's
    synthesiser output or their own, and scored as trained; the subjects vocabulary names denoising
    networks as this term, although they output audio.
  source: src-github-dns-challenge-readme
  quote: noisyspeech_synthesizer_singleprocess.py** - is used to synthesize noisy-clean speech pairs
    for training purposes
designed_for_subjects_considered_and_rejected:
  - term: generative-media-model
    reason: The output is audio, but the networks are trained to recover a talker's clean speech
      from a noisy input, the denoising case the term's exclusion sends to
      task-specific-supervised-model.
as_used:
  - protocol: A speech enhancement model trained on LibriSpeech with DNS noise and room impulse
      responses, scored with DNSMOS (OVRL, SIG, BAK) on the DNS Challenge 2020 test sets (synthetic
      reverberant, synthetic non-reverberant and real recordings), with most baselines' values taken
      from earlier papers. No listening test.
    split: DNS Challenge 2020 test sets (no_reverb, with_reverb, real recordings)
    source: src-arxiv-2603-20242-v2
    quote: For evaluation, all evaluation sets are taken from the DNS Challenge 2020.
    note: arXiv 2603.20242v2, 28 July 2026. Scoring the released 2020 test sets with DNSMOS instead
      of the challenge's crowdsourced P.808 is the common post-challenge protocol; the organisers'
      ranking never used DNSMOS.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. A July 2026 paper reports DNSMOS on the
    DNS Challenge 2020 test sets beside numbers it collects from earlier papers. The series' ending
    is recorded in activity (ADR-0019).
  source: src-arxiv-2603-20242-v2
  quote: DNSMOS (OVRL / SIG / BAK) UNDER REVERBERANT, NON-REVERBERANT, AND REAL-RECORDING
    CONDITIONS.
activity: closed
activity_note: The fifth round (November 2022 to August 2023) was the last; the 2023 paper describes
  the series in the past tense as run 2019-2023, and the repository's last commit is of 29 March
  2024. No permanent phase, standing leaderboard or submission route was found; the 2023 page's
  Results tab did not render and the Piazza board it names was not read. Microsoft's later ICASSP
  grand challenges on speech quality were not read and are not this series.
activity_basis:
  reason: Submissions went to each round's CMT site and were scored once by the organisers, and the
    last round ended in August 2023 with nothing after it.
  source: src-msr-dns-challenge-icassp-2023
  quote: 'Program dates: November 2022–August 2023'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: NSNet2, the organisers' non-personalised baseline (ICASSP 2022)
    source: src-arxiv-2202-13288-v1
    observed_on: 2026-11-05
    quote: We trained NSNet2 [3, 15] on a subset of the fullband nonpersonalized training dataset to
      obtain the baseline.
  - system: LL-SDR, a token-based enhancement model, on the DNS Challenge 2020 test sets (DNSMOS)
    source: src-arxiv-2603-20242-v2
    observed_on: 2026-11-05
    quote: LL-SDR (Ours) 3.27 3.55 4.08 3.39 3.62 4.16 3.16 3.45 4.05
evaluation_target: learned-system
execution_mode: panel
ground_truth_source: held-out-labels
ground_truth_source_note: In 2022 and 2023 half of the score is word accuracy against transcripts of
  the blind set that the organisers made by speech recognition and expert listening, which were not
  released (the README's entry for them reads TBD). The other half, and the whole score in
  2020-2021, is crowd ratings, which are produced for each submission and check nothing against a
  stored answer.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The listening tests can be rerun with the open toolkits on the released blind sets, but
    the 2022-2023 score also needs the organisers' unreleased blind-set transcripts and Microsoft's
    Azure speech recogniser, computed internally. The 2020-2021 MOS-only rankings are reproducible
    in method, though a rerun's raters differ.
  source: src-arxiv-2303-11510-v2
  quote: We computed WAcc results internally.

task:
  exists: true
  input:
    - a noisy, possibly reverberant single-channel speech clip (16 kHz in 2020-2021, 48 kHz fullband
      from Interspeech 2021's fullband track on)
    - for personalised models, enrolment speech of the primary talker (2.5 minutes in 2022, 10-30 s
      in 2023)
  output: The enhanced clip, with background noise, reverberation and (in personalised and 2023
    tracks) neighbouring talkers suppressed, produced in real time under the round's latency and
    compute limits (2020 also had a non-real-time track).
  scoring: Crowdsourced listening tests on the enhanced blind set, P.808 MOS (2020, ICASSP 2021) or
    P.835 SIG, BAK and OVRL (from Interspeech 2021, personalised in 2022-2023); from 2022 the
    challenge score is 0.5 x (WAcc + (OVRL - 1) / 4). ANOVA separates the top teams; ties go to the
    lower-complexity model.
  source: src-arxiv-2005-13981-v3
  quote: Three winners were selected from each track based on the subjective speech quality
    evaluated on the blind test set using ITU-T P.808 framework.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: Judged on the fifth round, the latest. Its training data, development set and blind
    test clips download from public Azure blobs through the repository's scripts, without an
    account, and the second and third rounds' blind sets are published combined. The blind-set
    transcripts behind the WAcc half of the score were not released. The P.835 ratings are produced
    afresh for each submission. The 2020 test sets, synthetic clips with clean references and real
    recordings, are the open set later papers use.
  access_basis:
    reason: The blind-set transcripts that half of the 2022-2023 score is computed against are not
      public; the README publishes development transcripts for one track only.
    source: src-github-dns-challenge-readme
    quote: 'Wacc ground-truth transcript Dev testset: available only for speakerphone track'
  access_by_phase:
    during_edition: Training data and a development test set from the start; the blind test set's
      noisy clips a few days before the deadline (five days in 2022), without transcripts, and the
      ratings did not exist until the organisers ran the tests.
    during_edition_source: src-arxiv-2202-13288-v1
    during_edition_quote: Participants were provided with the blind test set 5 days before the data
      submission deadline.
    after_edition: The blind test clips stay downloadable; the transcripts and per-clip ratings were
      not found published.
    after_edition_source: src-github-dns-challenge-v2v3-blind-script
    after_edition_quote: BLIND Testset for 2nd and 3rd DNS Challenges combined with additional
      handpicked clips
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each round was ranked on a new blind set of real recordings, collected through
      crowdsourcing for that round.
    source: src-arxiv-2303-11510-v2
    quote: Blind testset consists of real testclips which were not previously used in any challenge
      and not otherwise available publically.
  data_provenance:
    - real-world-instrument
  data_provenance_note: The blind sets are real recordings made by crowd workers reading prompts on
    their own laptops, desktops, phones and headsets in noisy rooms (2020's through Amazon
    Mechanical Turk; 70% on smartphones in 2022). The 2020 sets also held synthetic mixtures of
    recorded clean speech (Graz University's PTDB-TUG) with recorded noise, which are the
    recordings' provenance re-assembled by rule, and 300 hand-picked noisy-speech clips from
    AudioSet in the development set.
  data_provenance_source: src-arxiv-2303-11510-v2
  data_provenance_quote: Our test set consists of real-world test clips recorded by crowd-sourced
    workers.
  contamination_risk: medium
  contamination_risk_note: The blind sets of every round are now public, and later papers train on
    the challenge's own corpora. The 2020 synthetic test clips were built from Graz University's
    clean speech, and the fifth round's README lists PTDB-TUG among the clean-speech training
    corpora, so training on the current DNS corpus may include the 2020 synthetic test set's clean
    speech. The 2023 rules forbade training on any DNS test clip, but no rule binds later users. No
    overlap is evidenced.
  contamination_risk_source: src-github-dns-challenge-readme
  contamination_risk_quote: '* PTDB-TUG: Pitch Tracking Database from Graz University of Technology'
  contamination_evidence: []
  ceiling_anchor_type_note: No anchor. MOS runs from 1 to 5, and results are reported as dMOS
    against the unprocessed noisy clips, a floor rather than a ceiling; no clean reference is rated
    on the real blind sets.
  dataset_licence: null
  dataset_licence_note: The README grants its documentation and other content under CC BY 4.0, but
    says the datasets keep the terms under which Microsoft received them; no source read states a
    licence for the blind test sets Microsoft collected.
  dataset_licence_source: src-github-dns-challenge-readme
  dataset_licence_quote: The datasets are provided under the original terms that Microsoft received
    such datasets.
  upstream_licences: Per the README, clean speech from LibriVox (public domain), PTDB-TUG (ODbL),
    the Edinburgh 56-speaker set, VocalSet (CC BY 4.0), CREMA-D (DbCL), VoxCeleb2 (CC BY 4.0) and
    VCTK (ODC-By); noise from AudioSet (CC BY 4.0), Freesound (CC0 clips only) and DEMAND (CC BY-SA
    3.0); room impulse responses from OpenSLR 26 and 28 (Apache 2.0).
  upstream_licences_source: src-github-dns-challenge-readme
  upstream_licences_quote: '* PTDB-TUG: Pitch Tracking Database from Graz University of Technology'
  size:
    - count: 2400
      unit: real test clips, 600 each in the development and blind sets of the two tracks
      subset: 2023 (fifth round)
      source: src-msr-dns-challenge-icassp-2023
      quote: Each track will have its own dev testset and blind testset, each consisting of 600
        testclips. Thus, total of 2400 unique testclips is released in this challenge.
    - count: 859
      unit: real blind test clips of 10 s, shared by both tracks
      subset: 2022 (fourth round)
      source: src-arxiv-2202-13288-v1
      quote: There are 859 real test clips, each with a duration of 10s, in the blind test set.
    - count: 600
      unit: blind test clips (300 synthetic, 300 real recordings)
      subset: 2020 (first round)
      source: src-arxiv-2005-13981-v3
      quote: The blind test set also comprised of 600 clips (300 synthetic and 300 real recordings).
    - count: 1200
      unit: development test clips in four categories of 300 (synthetic without and with
        reverberation, real recordings from Microsoft and from AudioSet)
      subset: 2020 (first round) development set, the set later papers use
      source: src-arxiv-2005-13981-v3
      quote: The test set is divided into 4 categories with 300 clips in each
    - count: 700
      unit: blind test clips
      subset: ICASSP 2021 (second round)
      source: src-github-dns-challenge-v2v3-blind-script
      quote: (700 blindset clips from V2 challenge)
    - count: 600
      unit: blind test clips
      subset: Interspeech 2021 (third round)
      source: src-github-dns-challenge-v2v3-blind-script
      quote: (600 blindset clips from V3 challenge)
    - count: 760
      unit: hours of clean training speech (760.53, speakerphone track), beside 181 hours of noise
      subset: 2023 training data
      source: src-arxiv-2303-11510-v2
      quote: Clean speech in the Track-2 training set is a total of 760.53 hours
  languages:
    - English
  languages_note: The test clips are English read speech; the training corpora also hold French,
    German, Italian, Russian, Spanish and (2023) Mandarin speech.
  languages_source: src-arxiv-2202-13288-v1
  languages_quote: All clips contain noisy speech in the English language.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Microsoft (the DNS Challenge organisers at Microsoft Corporation, Redmond)
  maintainer_basis:
    reason: Microsoft holds the repository, the datasets on its Azure storage and the challenge
      pages, and its staff wrote every overview paper and ran every evaluation.
    source: src-msr-dns-challenge-icassp-2023
    quote: IEEE ICASSP 2023 Deep Noise Suppression (DNS) grand challenge is the 5th edition of
      Microsoft DNS challenges
  maintainer_type: industry-lab
  maintainer_type_note: conference-workshop was considered. The rounds were special sessions or
    grand challenges of Interspeech and ICASSP, but one company organised and hosted all five with
    the same core team, so the holder's type applies.
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: Teams submitted enhanced blind-set clips by the deadline, and the
    organisers scored them in listening tests and against transcripts the teams never saw
    (held-out-server, offline). In 2022 three teams without a paper were disqualified; in 2023 the
    top teams were invited to write 2-page ICASSP papers and all had to describe their training data
    in a paper.
  submission_process_source: src-arxiv-2202-13288-v1
  submission_process_quote: Teams 17, 19, and 42 did not submit a paper
  independence_flags: []
  independence_flags_note: No flag could be evidenced, and no-known-conflict is not tagged because
    the search was incomplete (logged with bench tag-gap). The 2020 paper speaks of three prizes per
    track without naming who paid; Microsoft, the maintainer, ran every test on its own toolkit and
    computed WAcc with its own Azure recogniser, and its own baselines (NSNet, NSNet2, pDCCRN, an
    E3Net variant) were rated beside the entrants, which was read as baselines, not as competing.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: human-panel
  compute_tier_basis:
    reason: The cost of a score is paid crowd raters on Amazon Mechanical Turk; each team's own
      training and inference cost varies with its model.
    source: src-arxiv-2005-08138
    quote: We provide an open-source implementation of the ITU-T Rec. P.808 that runs on the Amazon
      Mechanical Turk platform.
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: Every round's ranking needs crowd raters; the P.835 toolkit used from Interspeech 2021
      was validated against a laboratory test and in a round-robin.
    source: src-arxiv-2010-13200
    quote: Finally, we used our implementation in the INTERSPEECH 2021 Deep Noise Suppression
      Challenge as the primary evaluation metric
  reproducibility_blockers:
    - human-raters
  reproducibility_blockers_note: The 2022-2023 score also needs the unreleased blind-set transcripts
    and Microsoft's Azure speech recogniser for WAcc.
  harness_availability: reference-implementation-only
  harness: The open-source P.808 and P.835 crowdsourcing toolkits (github.com/microsoft/P.808), the
    repository's WAcc script and DNSMOS (DNSMOS/dnsmos_local.py); they run a listening test or
    estimate one, but the official score is the organisers' crowd ratings and internal WAcc.
  harness_source: src-github-dns-challenge-dnsmos-readme
  harness_quote: Use the **dnsmos_local.py** script.
  submission_channel:
    source: src-arxiv-2303-11510-v2
    quote: Registration and submission of enhanced clips was done through CMT site
  code_licence: MIT
  code_licence_source: src-github-dns-challenge-readme
  code_licence_quote: '## Code license MIT License'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which round's test set and which part of it (the 2020 synthetic no-reverb, reverb or
  # real sets are the common post-challenge choice), the training data allowed (any data in every round, but no DNS
  # test clip in 2023), and the scorer (P.808 or P.835 crowd ratings, DNSMOS or DNSMOS P.835 and its model version,
  # personalised or not).
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each track has its own subjective evaluation, ranking and winners, and nothing combines
    the tracks or the rounds. Within a 2022-2023 track the challenge score is an official
    combination of OVRL and WAcc (see evaluation_method).
  source: src-arxiv-2303-11510-v2
  quote: (vi) Track-1 and Track-2 has their separate subjective evaluations
headline_metric: null

homepage: https://aka.ms/dns-challenge
homepage_note: Redirects to Microsoft Research's page for the ICASSP 2023 round
  (src-msr-dns-challenge-icassp-2023), read 2026-11-05.
repository: https://github.com/microsoft/DNS-Challenge


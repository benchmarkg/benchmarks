  sources_note: >
    The dcase.community pages were read with scripts and styles stripped; seven of them hold organisers'
    personal e-mail addresses and are withheld from archiving, with the addresses outside the extracts.
    The events page dates every edition. The Task 6 overview's v2 PDF (a DOI, not archived) is the newest
    task overview read and the evidence of current use beyond the challenge's own pages. The Task 6 page
    itself was not read; the paper stands in for it.
  confidence: medium
  review_checks:
    - check: The comparability profile table maps statistical-fit with instruction-tuned-model to
        forecasting, so Task 3's Pearson r makes lead_time and resolution_window material, though no
        DCASE task forecasts. ADR-0024 (D3) removes entry-level waivers of those two fields and puts
        the fix in the profile rule; whether that pair should map to forecasting is the open
        question.
      field: comparability
    - check: Identity. The entry is the challenge as one family, with yearly editions as versions
        and the 2026 tasks as subsets. Long-running task lines (anomalous sound detection since
        2020, sound event localization and detection since 2019) could instead be entries of their
        own.
      field: versions
    - check: The primary domain is audio-event-understanding because scene and sound classification
        is the one line in every edition, but scene classification is not strictly the leaf's case
        (which sound events are present), and sound event detection ran in ten of twelve editions.
        audio-event-detection-localization could be argued as primary.
      field: domain
      source: src-dcase-challenge2026-task1
      quote: In a way, this task replaces the former Task 1 on Acoustic Scene Classification, which
        ran for all 11 previous DCASE Challenge editions with different focuses every year
    - check: activity round-scheduled rests on the 2027 call's tentative schedule (posted 1 October
        2026). governance.yaml and lifecycle.yaml cite dcase-2026 as between-rounds, written before
        the call; between-rounds holds if a tentative date is not an announced one.
      field: activity
      source: src-dcase-call-for-task-proposals-2027
      quote: '1 April 2027 Challenge opening: datasets and baseline methods published'
    - check: publication-gated rests on the technical report being part of every submission package;
        no 2026 source states that a submission without one is unranked (the general rules page,
        challenge2026/rules, returned 404).
      field: governance.submission_process
      source: src-dcase-challenge2026-submission
      quote: Challenge submission consists of a submission package (one zip package) containing
        system outputs, system meta information, and technical report (pdf file).
    - check: maintainer-competes-on-own-benchmark rests on organisers of one task entering another
        (Kong, CUHK, in Task 3) and on ranked organiser baselines, not on the Steering Group
        entering a system. Whether the industry organisers' own teams entered their tasks was not
        checked, and the workshop's sponsors were not read.
      field: governance.independence_flags
      source: src-dcase-challenge2026-task3
      quote: Kong_CUHK_task3a_2 Qiuqiang Kong
    - check: temporal-reasoning rests on Task 6's IoU-thresholded start and end times; no 2026 task
        scores onsets and offsets of a closed class set, which earlier sound event detection tasks
        did.
      field: capability
    - check: Task 7's accuracy is the mean of class-wise accuracies, tagged classification-metric as
        a macro-averaged accuracy; Stage 3 tagged it exact-match.
      field: evaluation_method
      source: src-dcase-challenge2026-task7
      quote: Domain-wise accuracy will be calculated as average of the class-wise accuracies.
    - check: instruction-tuned-model is tagged for Task 5 alone, whose open-source audio-language
        entrants are prompted with each question but often fine-tuned on its training set first.
      field: designed_for_subjects
    - check: data.access and the reproducibility tier assume the 2026 evaluation labels are
        withheld; only Task 2's release was read. If most tasks have published theirs, fully-open
        and fully-automatable may fit completed editions.
      field: data.access
      source: src-github-dcase2026-task2-evaluator-readme
      quote: Ground truth of the normal and anomaly labels
    - check: Task 4 has no domain_override; its score joins detection of which classes are present

    label: 2026 Task 1, Heterogeneous Audio Classification
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-dcase-challenge2026-site
        quote: This task focuses on heterogeneous audio classification using the Broad Sound
          Taxonomy (BST), which comprises 5 top-level and 23 second-level sound categories.
      - source: src-dcase-challenge2026-task1
        quote: The main metric will be macro-averaged hierarchical F-score
    notes: Classifies Freesound sounds into the 23 second-level classes of the Broad Sound Taxonomy,
      ranked by macro-averaged hierarchical F-score, which penalises errors at both levels more. It
      replaces the acoustic scene classification task of every earlier edition.
  - id: dcase#2026-task2
    label: 2026 Task 2, Noise-aware Unsupervised Anomalous Sound Detection for Machine Condition
      Monitoring
    scored_separately: true
    domain_override:
      primary: audio-speech/machine-condition-monitoring
    capability_override:
      - perception
      - distribution-shift-generalization
    evidence:
      - source: src-dcase-challenge2026-site
        quote: The aim of this task is to develop anomalous sound detection techniques that can
          train models on new train data with noisy normal sounds of machines
      - source: src-dcase-challenge2026-task2
        quote: which are used to calculate an official score and a final ranking
    notes: Trained on normal sounds only, scored by the harmonic mean of AUC and partial AUC over
      machine types, sections and source and target domains. The task line has run since 2020.
  - id: dcase#2026-task3
    label: 2026 Task 3, Semantic Acoustic Imaging for Sound Event Localization and Detection
    items: 79
    scored_separately: true
    domain_override:
      primary: audio-speech/audio-event-detection-localization
    capability_override:
      - perception
    evidence:
      - source: src-dcase-challenge2026-site
        quote: Acoustic Imaging SELD requires generating high-resolution semantic energy maps from
          low-channel audio, outputting dynamic polygon masks encoding event class, localization,
          and acoustic energy.
      - source: src-dcase-challenge2026-task3
        quote: The primary ranking metric is the Mask mean Average Precision (Mask mAP), computed
          via the standard COCO evaluation protocol on the binarized rendered masks.
    notes: From four-channel input, reconstruct per-event acoustic energy maps at 10 frames a
      second. Ranked by the cumulative rank of Mask mAP and Pearson r, in two tracks ranked in
      separate tables. The 79 evaluation recordings are DCASE2024's.
  - id: dcase#2026-task3a
    label: 2026 Task 3, Track A (audio-only inference)
    parent: dcase#2026-task3
    scored_separately: true
    evidence:
      - source: src-dcase-challenge2026-task3
        quote: ranking results will be presented in separate tables for each track
  - id: dcase#2026-task3b
    label: 2026 Task 3, Track B (audiovisual inference)
    parent: dcase#2026-task3
    scored_separately: true
    evidence:
      - source: src-dcase-challenge2026-task3
        quote: ranking results will be presented in separate tables for each track
    notes: The 360-degree video is an input at inference as well as in training.
  - id: dcase#2026-task4
    label: 2026 Task 4, Spatial Semantic Segmentation of Sound Scenes
    items: 1512
    scored_separately: true
    capability_override:
      - perception
    evidence:
      - source: src-dcase-challenge2026-task4
        quote: The ranking metric for this task is class-aware permutation-invariant SDRi
          (CAPI-SDRi), an extension of SDRi designed to jointly evaluate sound event detection and
          separation.
    notes: Detect which target sounds a multichannel mixture holds, none to three of them, and
      output each as a separated waveform with its class. The family's leaf covers the detection
      half; no leaf covers separation.
  - id: dcase#2026-task5
    label: 2026 Task 5, Audio-Dependent Question Answering
    scored_separately: true
    domain_override:
      primary: multimodal/audio-language
    capability_override:
      - perception
    evidence:
      - source: src-dcase-challenge2026-site
        quote: the correct answer cannot be determined without listening to the audio
      - source: src-dcase-challenge2026-task5
        quote: The primary evaluation metric is Top-1 Accuracy on the ADQA-Bench.
    notes: Multiple-choice questions filtered so that they cannot be answered without the audio, for
      open-source large audio-language models. A separate award goes to the best system under 10
      billion parameters.
  - id: dcase#2026-task6
    label: 2026 Task 6, Audio Moment Retrieval from Long Audio
    items: 177
    scored_separately: true
    domain_override:
      primary: multimodal/cross-modal-retrieval
      secondary:
        - multimodal/audio-language
    capability_override:
      - perception
      - grounding
      - temporal-reasoning
    evidence:
      - source: src-dcase-challenge2026-site
        quote: Audio moment retrieval is the task of retrieving specific moments within long audio
          recordings that align with a given textual query.
      - source: src-arxiv-2609-12484-v2
        quote: The challenge attracted 21 teams, which submitted 59 systems in total. Each team was
          allowed up to four submissions
    notes: Given a recording of one to five minutes and a text query, return the matching moment's
      start and end, ranked by Recall1@0.7 IoU. The first DCASE task on moment retrieval; items are
      its evaluation queries.
  - id: dcase#2026-task7
    label: 2026 Task 7, Domain-Agnostic Incremental Learning for Audio Classification
    scored_separately: true
    capability_override:
      - perception
      - continual-learning
    evidence:
      - source: src-dcase-challenge2026-task7
        quote: Audio data from different domains is revealed sequentially, and at each stage the
          system must learn the new domain using only its data (no access to earlier domain data is
          allowed).
      - source: src-dcase-challenge2026-task7
        quote: Systems will be ranked by overall accuracy.
    notes: Ten sound classes from three domains learned in sequence, with external data and
      pretrained models forbidden; ranked by class-averaged accuracy averaged over the three
      domains.
subsets_note: >
  The subsets are the 2026 edition's tasks, with Task 3's two tracks as children. Earlier editions' tasks
  are recorded in versions, not as subsets. Tasks 1, 4 and 7 keep the family's primary domain and carry
  no domain_override. Every task carries its own capabilities, and each capability_override drops the
  family terms that belong to other tasks on purpose: the family list is a union over tasks.


# data/benchmarks/audio-speech/dcase.yaml
#
# P1-S7-T03, audio-speech entry 3 of 9. Filled from the DCASE2026 Challenge's pages on dcase.community (the
# challenge page, the submission instructions, and the task pages of Tasks 1, 2, 3, 4, 5 and 7, scripts and styles
# stripped); the DCASE events page, which records every edition since 2013; the call for task proposals for
# DCASE2027 (1 October 2026); the DCASE2026 Workshop page; the README of the Task 2 evaluator repository at main;
# and the Task 6 overview and meta-analysis paper (arXiv 2609.12484), read as its v2 PDF, with its abstract page.
# GitHub's metadata for nttcslab/dcase2026_task2_evaluator was read and is not a quoted Source. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the challenge as one family: its yearly editions are versions, and the 2026 edition's seven tasks
# are subsets, each with its own domain where its leaf differs from the family's. The challenge has no overview
# paper of its own (each task publishes its own description), so `paper` is left empty.

id: dcase
name: DCASE Challenge
aliases:
  - Detection and Classification of Acoustic Scenes and Events
  - IEEE AASP Challenge on Detection and Classification of Acoustic Scenes and Events
  - DCASE2026 Challenge
tagline: Yearly IEEE AASP challenge on sound scene and event analysis since 2013; independent tasks
  scored by their organisers.
description: >
  The yearly challenge of the DCASE community on the automatic analysis of everyday sound, held as an
  IEEE AASP challenge in 2013 and every year since 2016, with its results presented at the DCASE Workshop.
  Each edition is a set of independent tasks that the DCASE Steering Group selects from proposals; each
  task's organising team publishes development data and a baseline in the spring, releases the evaluation
  audio without labels about two weeks before the deadline, and scores the system outputs that participants
  submit. Every submission must include a technical report, and each task is ranked on its own metric,
  with no ranking across tasks. Acoustic scene classification was Task 1 in all eleven editions up to
  2025, beside sound event detection, sound event localization and detection (from 2019), anomalous sound
  detection for machine condition monitoring (from 2020), bioacoustics, audio tagging, audio captioning
  and language-based audio retrieval. The 2026 edition had seven tasks: heterogeneous audio classification,
  noise-aware anomalous sound detection, semantic acoustic imaging for sound event localization and detection,
  spatial semantic segmentation of sound scenes, audio-dependent question answering, audio moment retrieval
  from long audio, and domain-incremental audio classification. It received 421 entries from 135 teams,
  and its results were published at the end of June.
self_description:
  source: src-dcase-call-for-task-proposals-2027
  quote: DCASE is a data challenge whose purpose is to produce new scientific knowledge about
    methods for detection and classification of sound scenes and events.
released: 2013-03-31
released_note: The first campaign's start, as the events page dates it; it ran to 14 April 2013 and
  was held under the IEEE Signal Processing Society's AASP technical committee. The challenge has
  been yearly since 2016 (see versions).
released_source: src-dcase-events
released_quote: The first DCASE challenge campaign was organized between 31st March 2013 - 14th
  April 2013.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/audio-event-understanding
  secondary:
    - audio-speech/audio-event-detection-localization
    - audio-speech/machine-condition-monitoring
    - audio-speech/bioacoustics
    - multimodal/audio-language
    - multimodal/cross-modal-retrieval
  per_edition: true
  per_edition_note: >
    The secondary list is a union over editions, and each 2026 task carries its own domain in subsets.
    Bioacoustics ran as bird audio detection in 2018 and few-shot bioacoustic event detection from 2021
    to 2024; it is not a 2026 task, and the co-located BioDCASE workshop now covers it. Sound synthesis
    (2023, 2024) and the separation half of the spatial semantic segmentation task (2025, 2026) have no
    leaf.
domain_basis:
  reason: Classifying sounds is the challenge's one continuous line. Acoustic scene classification
    was Task 1 in every edition from 2013 to 2025, and in 2026 heterogeneous audio classification
    (Task 1) and domain-incremental audio classification (Task 7) both score which sound class a
    recording holds. Detection and localization, machine condition monitoring, bioacoustics and the
    audio-language tasks are secondary, each the leaf of some editions' tasks.
  source: src-dcase-challenge2026-task1
  quote: In a way, this task replaces the former Task 1 on Acoustic Scene Classification, which ran
    for all 11 previous DCASE Challenge editions with different focuses every year
capability:
  - perception
  - distribution-shift-generalization
  - continual-learning
  - grounding
  - temporal-reasoning
capability_basis:
  perception:
    reason: Every task takes audio, from single clips to four-channel spatial recordings and
      minutes-long recordings, and scores what was recovered from it.
    source: src-dcase-challenge2026-site
    quote: However, a significant amount of research is still needed to reliably recognize sound
      scenes and individual sound sources in realistic soundscapes
  distribution-shift-generalization:
    reason: Task 2 scores its source and target domains separately, the target domain differing in
      operating speed, load, noise and signal-to-noise ratio, and its evaluation machine types are
      not the development ones; the task, normal against anomalous, is unchanged.
    source: src-dcase-challenge2026-task2
    quote: Also, in order to evaluate the detection performance for each domain, the AUC is
      calculated for each domain.
  continual-learning:
    reason: Task 7 reveals three domains in sequence without access to earlier data and ranks by
      accuracy averaged over all three, so forgetting an earlier domain costs score.
    source: src-dcase-challenge2026-task7
    quote: The accuracy will be calculated separately for each domain, then overall accuracy will be
      calculated as the average over the three domains.
  grounding:
    reason: Task 6 scores whether a free-form text query was attached to the right stretch of a long
      recording.
    source: src-dcase-challenge2026-site
    quote: Audio moment retrieval is the task of retrieving specific moments within long audio
      recordings that align with a given textual query.
  temporal-reasoning:
    reason: Task 6's answer is a start and an end time, correct only when its overlap with the
      reference moment reaches the IoU threshold (0.7 for the ranking), so the score depends on when
      the sound happened and how long it lasted.
    source: src-arxiv-2609-12484-v2
    quote: A predicted moment is regarded as correct when its IoU with a reference moment is at
      least a threshold
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Task 3 outputs where each sound is, but its score is how well the acoustic energy map is
      reconstructed (Mask mAP, Pearson r), which the term's exclusion test sends to perception.
  - term: transfer-learning
    reason: Task 2's unseen machine types keep the task and its labels; only the inputs move, which
      is distribution shift.
  - term: sample-efficiency
    reason: Task 2 gives ten target-domain training clips per section, but no fixed sample budget is
      set and scored.

evaluation_method:
  - classification-metric
  - domain-metric
  - multiple-choice
  - statistical-fit
  - composite
  - entrant-relative-ranking
evaluation_method_note: >
  Per 2026 task: Task 1 ranks by macro-averaged hierarchical F-score and Task 2 by the harmonic mean of
  AUC and partial AUC (classification-metric); Task 7 by accuracy averaged over class-wise accuracies,
  a macro-averaged accuracy (classification-metric); Task 4 by CAPI-SDRi and Task 6 by Recall1@0.7 IoU
  (domain-metric); Task 5 by top-1 accuracy over multiple-choice questions, chance 0.2546 on the development
  set (multiple-choice); Task 3 by the cumulative rank of Mask mAP (domain-metric) and Pearson r (statistical-fit),
  a rank aggregation that is composite and entrant-relative.
evaluation_method_basis:
  reason: Each task keeps its own ranking metric; Task 3's, quoted, is a cumulative rank over two
    metrics of different methods, so it depends on who else entered.
  source: src-dcase-challenge2026-task3
  quote: Overall ranking will be based on the cumulative rank of the metrics mentioned above, sorted
    in ascending order.
designed_for_subjects:
  - task-specific-supervised-model
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: Most tasks are built for audio models trained on the task's development data and scored as
    trained, the field's general audio tasks rather than a scientific discipline's. Task 5 alone is
    for large audio-language models prompted with each multiple-choice question, and admits only
    open-source ones.
  source: src-dcase-challenge2026-task5
  quote: Only open-source Large Audio Language Models are permitted for the audio understanding
    system submitted for evaluation.

lifecycle: active
lifecycle_basis:
  reason: The 2026 edition ran from April to June, ranked 421 entries and published its results; its
    workshop is on 28-29 October 2026, and the 2027 edition has been called.
  source: src-dcase-challenge2026-site
  quote: DCASE2026 Challenge received 421 submission entries
activity: round-scheduled
activity_note: The 2027 schedule is tentative. Task proposals are due on 15 December 2026, task
  descriptions on 25 January 2027, the opening on 1 April 2027 and the deadline on 15 June 2027. No
  standing leaderboard takes results between editions.
activity_basis:
  reason: The 2026 results are out and no round is open, but the call for the 2027 edition, posted
    on 1 October 2026, dates its opening.
  source: src-dcase-call-for-task-proposals-2027
  quote: '1 April 2027 Challenge opening: datasets and baseline methods published'
events:
  - name: DCASE2026 Workshop, Boston, 28-29 October 2026
    kind: workshop
    source: src-dcase-workshop2026-site
    quote: The 11th Workshop on Detection and Classification of Acoustic Scenes and Events, DCASE
      2026, will be held in Boston on 28-29 October.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Primus_CPJKU_task1_3 (Ensemble 3), first in 2026 Task 1
    source: src-dcase-challenge2026-task1
    observed_on: 2026-10-14
    quote: Primus_CPJKU_task1_3 Ensemble 3
  - system: Lim_CAU_task5_4, first in 2026 Task 5, a 96-billion-parameter audio-language system
    source: src-dcase-challenge2026-task5
    observed_on: 2026-10-14
    quote: Lim_CAU_task5_4 58.33
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each task's reference labels for its evaluation set, held by the task's
  organisers until the results are out; Task 2 has since published its 2026 ground truth.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The evaluation audio is released without its labels, so only the organisers can produce
    the official scores. Task 2's evaluator repository now ships its 2026 ground truth, which makes
    that task reproducible after the fact; the other tasks' label releases were not read.
  source: src-dcase-challenge2026-task1
  quote: The evaluation dataset, without ground truth labels, has been published so participants can
    run inference and submit a CSV file with the predictions for evaluation of the systems

task:
  exists: true
  input:
    - one or more audio recordings per item, from single-channel clips to four-channel spatial
      recordings (with 360-degree video in Task 3's audiovisual track) and minutes-long recordings
    - in Tasks 5 and 6, a text question with answer options or a free-form text query
  output: Per task, a sound class, an anomaly score and decision, acoustic energy maps per event and
    frame, separated sources with class labels, a chosen answer option, or time-stamped moments,
    written in the task's output format for every evaluation item.
  scoring: Each task on its own metric over its evaluation set, ranked separately; the 2026 ranking
    metrics are listed in evaluation_method_note.
  source: src-dcase-challenge2026-submission
  quote: Participants run their system with an evaluation dataset, and produce the system output in
    the specified format.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_basis:
    reason: Development data with labels is public from the opening, and the evaluation audio is
      published without labels for participants to run their systems on.
    source: src-dcase-challenge2026-task1
    quote: The evaluation dataset, without ground truth labels, has been published so participants
      can run inference and submit a CSV file with the predictions for evaluation of the systems
  access_by_phase:
    during_edition: development data and baselines from 1 April; evaluation audio without labels
      from 1 June; outputs due on 15 June
    during_edition_source: src-dcase-challenge2026-site
    during_edition_quote: 01 Apr 2026 Challenge launch 01 Jun 2026 Release of evaluation datasets 15
      Jun 2026 Challenge deadline 30 Jun 2026 Challenge results
    after_edition: tasks may publish their evaluation labels after the results; Task 2's evaluator
      repository ships the 2026 ground truth
    after_edition_source: src-github-dcase2026-task2-evaluator-readme
    after_edition_quote: Ground truth of the normal and anomaly labels
    note: >
      access stays train-open-test-held-out because only Task 2's label release was read. If the other
      2026 tasks have released theirs too, a completed edition is closer to fully-open.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Every edition is ranked on evaluation data new to it at the family level. Task 1's 2026
      evaluation sounds were uploaded after its training data's cutoff, and Task 4's evaluation set
      was recorded for 2026; Task 3 reuses DCASE2024's evaluation audio with new labels, which the
      term allows.
    source: src-dcase-challenge2026-task1
    quote: It contains ~2,000 Freesound sounds, manually labeled with the corresponding BST category
      and uploaded after April 1st 2025.
  data_provenance:
    - real-world-instrument
    - web-scraped
    - simulation-generated
    - inherited-from-constituents
  data_provenance_note: >
    By 2026 task. Task 2's evaluation machines and Task 3's spatial scenes are microphone recordings (real-world-instrument).
    Task 1's sounds are Freesound uploads and Task 6's evaluation recordings come from YouTube (web-scraped).
    Task 4's mixtures are synthesised by convolving recorded sources with measured room impulse responses
    (simulation-generated). Task 5's evaluation set takes part of its questions from MMAU, MMAR and MMSU,
    Task 3's evaluation audio is DCASE2024's, and Task 7's sounds are drawn from existing datasets including
    AudioSet (inherited-from-constituents). Task 5's other questions are human-annotated; who annotated
    them is not stated, so no authoring term is tagged.
  data_provenance_source: src-dcase-challenge2026-task2
  data_provenance_quote: All machine types in the additional training and evaluation datasets are
    real two-channel recordings captured with two synchronized microphones.
  contamination_risk: medium
  contamination_risk_note: >
    The evaluation audio is public from the evaluation release, and the rules forbid annotating it or
    training on it, which no source says is checked. Two tasks reuse public material: Task 3's evaluation
    audio is DCASE2024's, and part of Task 5's evaluation set comes from published benchmarks. Task 1
    and Task 2 guard their sets with upload-date cutoffs and lists of permitted external data. No source
    measures contamination.
  contamination_risk_source: src-dcase-challenge2026-task3
  contamination_risk_quote: The evaluation dataset is identical to the one used in the DCASE2024
    challenge.
  contamination_evidence: []
  dataset_licence_note: Each task's datasets carry their own licences on Zenodo or Hugging Face,
    which were not read.
  size:
    - count: 7
      unit: tasks
      subset: DCASE2026 edition
      note: The events page's totals row, one count per edition from 2013 to 2026.
      source: src-dcase-events
      quote: Tasks 2 4 4 5 5 6 6 6 7 10 6 7 Teams 21 66 74 81 109 138 127 135 123 108 86 135 Entries
        31 85 200 223 311 473 394 410 428 321 277 421
    - count: 1512
      unit: soundscapes used for ranking (of 2,567 in the evaluation set)
      subset: 2026 Task 4
      source: src-dcase-challenge2026-task4
      quote: This dataset comprises 2,567 soundscapes, in which the first 1,512 soundscapes are used
        for ranking in the DCASE 2026 Challenge Task 4
    - count: 177
      unit: text queries over 100 recordings
      subset: 2026 Task 6
      source: src-arxiv-2609-12484-v2
      quote: The evaluation dataset consists of 100 real audio recordings collected from YouTube,
        ranging from one to five minutes, with 177 text queries in total.
    - count: 79
      unit: recordings
      subset: 2026 Task 3
      source: src-dcase-challenge2026-task3
      quote: The evaluation dataset consists of 79 recording clips of 40 sec to 7 min durations
    - count: 2000
      unit: sounds (approximate; the released set holds more, and only a subset is scored)
      subset: 2026 Task 1
      source: src-dcase-challenge2026-task1
      quote: It contains ~2,000 Freesound sounds, manually labeled with the corresponding BST
        category and uploaded after April 1st 2025.
  submission_limit:
    max_submissions: 4
    period_days: 0
    per: team, per task or subtask, per edition
    source: src-dcase-challenge2026-submission

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The DCASE Steering Group, with each edition's task organising teams (an IEEE AASP
    challenge)
  maintainer_basis:
    reason: The Steering Group selects the tasks and sets the schedule; each task's team produces
      its data, scores its submissions and presents its results at the DCASE Workshop.
    source: src-dcase-call-for-task-proposals-2027
    quote: DCASE consists of independent tasks organized by teams who are, within the schedule
      defined by the DCASE Steering Group, responsible for producing the required data and
      instructions for participation, scoring the task submissions, providing a summary of the
      results, and presenting the results at the DCASE Workshop.
  maintainer_type: conference-workshop
  maintainer_type_note: The task teams change from edition to edition and feed an annual workshop,
    which the term's inclusion test makes conference-workshop even with a standing Steering Group.
    Several task lines are run by the same companies and universities year after year (Hitachi and
    NTT staff coordinate Task 2 in every organiser list from 2023 to 2026), which is not one lab
    holding the series.
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: >
    Participants run their systems on the label-free evaluation audio and upload the outputs, up to four
    systems per task, as one package; each task's organisers score them after the deadline against labels
    the participants never saw. A technical report is part of every package, and by submitting, participants
    agree to the outputs and reports being published under CC BY. Task 7 also takes the model definition
    and weights after each incremental step; the sources do not say the organisers run them.
  submission_process_source: src-dcase-challenge2026-submission
  submission_process_quote: Challenge submission consists of a submission package (one zip package)
    containing system outputs, system meta information, and technical report (pdf file).
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-dcase-challenge2026-task3
      quote: Kong_CUHK_task3a_2 Qiuqiang Kong
  independence_flags_note: >
    Organisers of one 2026 task enter others: Task 3's first audio-only entry is by Qiuqiang Kong of CUHK,
    a Task 5 organiser, and Task 1's winning label, Primus_CPJKU, names a corresponding author Primus
    at JKU, where Task 6 organiser Paul Primus works. Organiser baselines also sit in the ranked tables
    (Task 1's Baseline_UPF_task1_2 is ranked seventh). Industry organisers lead several tasks (Hitachi
    and NTT for Task 2, Sony for Task 3, Ant Group for Task 5, LY Corporation for Task 6); whether their
    companies' teams entered those tasks was not checked. The workshop's sponsors were not read, so the
    prize and funding flags are unassessed.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: During an edition only the organisers hold the evaluation labels and produce the
      official scores. A task that later publishes its labels, as Task 2 has for 2026, becomes
      reproducible from its evaluator.
    source: src-dcase-challenge2026-task2
    quote: We are planning to provide ground truth labels for the evaluation dataset after the
      challenge has finished.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: Per task. Task 2's dcase2026_task2_evaluator (with the 2026 ground truth); other tasks
    ship their metric code with the baseline.
  harness_source: src-github-dcase2026-task2-evaluator-readme
  harness_quote: is a script for calculating the AUC, pAUC, precision, recall, and F1 scores from
    the anomaly score list for the
  code_licence_note: Per task. The Task 2 evaluator's README refers to its own LICENSEv2.1.pdf,
    which was not read, and GitHub reports NOASSERTION.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The profiles resolve to llm-static-text (Task 5's multiple-choice questions put to instruction-tuned audio
  # models, whose prompting fields are material) and forecasting (Task 3's Pearson r is a statistical fit).
  # Beyond them: which edition and task (the tasks, data and metrics change every year), which split (the
  # task's evaluation set, or the development test split most papers report), what external data and
  # pretrained models the task's rules allowed, and which track (Task 3's audio-only or audiovisual, Task 5's
  # under-10B lightweight award). Forecasting makes lead_time and resolution_window material although no task
  # forecasts; ADR-0024 (D3) puts that fix in the profile rule, not in a waiver here (see review_checks).
  material_extra:
    - subset_used
    - training_data_policy
    - eligibility_track
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each task is ranked on its own, and teams enter any subset of tasks.
  source: src-dcase-challenge2026-submission
  quote: Tasks are independent.


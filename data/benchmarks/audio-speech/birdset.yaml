# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S7-T04)
  added_on: 2026-11-05
  last_verified: 2026-11-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2403-10380-v6
    - src-arxiv-2403-10380
    - src-github-birdset-readme
    - src-hf-birdset-card
    - src-hf-api-birdset
    - src-hf-api-birdset-leaderboard
    - src-hf-birdset-leaderboard-about
    - src-hf-api-birdset-leaderboard-results
    - src-arxiv-2508-04665-v2
  sources_note: >
    The paper's v6 PDF (the latest, 2025-05-18, and the ICLR 2025 version; a DOI, not archived), read
    as text with the corresponding author's contact line kept out, and its abstract page for the version
    history. The README at commit 86a0777, the dataset card at revision f1e476b and three Hugging Face
    API records (dataset, Space, results dataset), all pending archive. The Space's src/about.py at commit
    0d9920f. Perch 2.0's v2 PDF (a DOI). The OpenReview record returned a challenge page and was not read;
    the Space itself was in a runtime error.
  confidence: medium
  review_checks:
    - check: Relation to BirdCLEF (lifeclef). Five of BirdSet's seven test sets were BirdCLEF test
        data (PER and HSN 2020, NES and SNE 2021, UHH 2022, SSW 2019-2021), taken from their Zenodo
        releases, and a BirdSet co-author leads the BirdCLEF overviews. BirdSet presents itself as a
        fixed-protocol complement to the yearly competition, not an edition of it, so it is a
        separate benchmark with no lineage link; lifeclef's versions start in 2024, so nothing there
        shares items with BirdSet. A reviewer may want a correlates_with or a note on lifeclef.
      field: lineage
      source: src-arxiv-2403-10380-v6
      quote: complementing BirdCLEF as a foundation for future challenges
    - check: Primary domain. bioacoustics with ecology-biodiversity secondary, by ecology's own
        exclusion test (one audio method task) and birdclef-plus's example. The paper's claim is
        broader audio classification, which argued for audio-event-understanding; it lost to the
        species labels.
      field: domain
      source: src-arxiv-2403-10380-v6
      quote: This serves as a crucial application since fluctuations in bird populations indicate
        broader shifts in biodiversity
    - check: activity closed rests on the Space's runtime error and a results dataset unchanged
        since 2024-09-30, with the README still inviting submissions and no stated pause. unknown
        (the board could not be read) and accepting-submissions (the invitation stands) were
        weighed; a reviewer who finds the Space running again should make it accepting-submissions.
      field: activity
      source: src-github-birdset-readme
      quote: by submitting new results and comparing performance across models
    - check: The dataset licence disagrees between sources. The Hugging Face repository says CC
        BY-NC 4.0; the paper says CC BY-NC-SA, with test sets CC BY 4.0 and validation CC0. The
        entry takes the repository's declaration.
      field: data.dataset_licence
      source: src-arxiv-2403-10380-v6
      quote: is available under the creative commons (CC) CC-BY-NC-SA license
    - check: Perch 2.0 describes BirdSet as six datasets and its table lists PER, NES, UHH, HSN, NBP
        and SSW, while the paper has seven test sets (SNE included). Averages from the two are not
        over the same sets; recorded in as_used and comparability (subset_used).
      field: as_used
      source: src-arxiv-2508-04665-v2
      quote: consists of six fully-annotated datasets from the continental United States
    - check: designed_for_subjects domain-specialist-model treats avian species identification as a
        discipline's task (ecology), as lifeclef's BirdCLEF+ did; the paper's framing as general
        audio classification would argue for task-specific-supervised-model.
      field: designed_for_subjects
    - check: No versions are recorded. The paper went through six arXiv versions under three titles
        (v1 'A Multi-Task Benchmark', v3 'A Dataset and Benchmark', v4 on 'A Large-Scale Dataset'),
        and the dataset card logs three revisions (taxonomy metadata, a download fix, a loader
        update). The test sets are stated to be fixed; whether v1-v3 scored the same test sets or
        metrics was not read.
      field: versions

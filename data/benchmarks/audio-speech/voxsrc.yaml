# data/benchmarks/audio-speech/voxsrc.yaml
#
# P1-S7-T03, audio-speech entry 6 of 9 (the stress corpus's voxsrc-retired-2023). Filled from the series'
# overview page and the 2022 and 2023 challenge pages on mm.kaist.ac.kr (scripts and styles stripped); the
# retrospective that closes the series, arXiv 2408.14886, read as its v1 PDF (TASLP 2024), and its abstract page;
# the abstract pages of the 2019, 2020, 2021 and 2022 overview papers (arXiv 1912.02522, 2012.06867, 2201.04583,
# 2302.10248); the VoxCeleb dataset page and its download-request form; the VoxSRC2023 development kit's README;
# and the v1 PDF of arXiv 2610.11278 (October 2026), a paper that reports results on the VoxSRC-23 test set. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# robots.ox.ac.uk, which served the 2019-2021 challenge pages and the test audio, and zeus.robots.ox.ac.uk, which
# runs the evaluation servers, both disallow every path for `*` in robots.txt, so neither was fetched: the
# 2019-2021 editions are read from their overview papers and the series overview page, and the servers' state now
# is a reviewer check below.

id: voxsrc
name: VoxSRC
aliases:
  - VoxCeleb Speaker Recognition Challenge
tagline: Oxford VGG's annual speaker verification and diarisation challenge on in-the-wild YouTube
  speech, run 2019-2023.
description: >
  The VoxCeleb Speaker Recognition Challenge, a series of five annual challenges and workshops held
  with Interspeech from 2019 to 2023 by Oxford's Visual Geometry Group with KAIST and others. Its
  speaker verification tracks score whether two speech segments come from the same speaker: a closed
  track trained on VoxCeleb2 dev only and an open track, joined by a self-supervised track (2020-2021)
  and a semi-supervised domain adaptation track from English VoxCeleb to Chinese CNCeleb (2022-2023).
  A speaker diarisation track (2020-2023) labels who spoke when in multi-speaker audio. Verification
  is ranked by minDCF (EER for domain adaptation) and diarisation by DER. The test audio comes from
  YouTube identities absent from VoxCeleb, new each year, with the 2019 test pairs kept inside every
  later set; each year added a theme (movie audio, multilingual pairs, age gaps, shared background
  noise). The labels were withheld during each challenge and were released after the series ended in
  2023; a permanent evaluation phase was opened after each workshop.
self_description:
  source: src-arxiv-2408-14886-v1
  quote: The VoxCeleb Speaker Recognition Challenges (VoxSRC) were a series of challenges and
    workshops that ran annually from 2019 to 2023.
external_ids:
  arxiv: '2408.14886'
paper:
  title: 'The VoxCeleb Speaker Recognition Challenge: A Retrospective'
  arxiv: '2408.14886'
  version_read: v1
  source: src-arxiv-2408-14886-v1
released: null
released_note: The first edition ran in 2019, with its workshop at Interspeech 2019 in Graz on 14
  September 2019 (the retrospective's Table XII). Its challenge page on robots.ox.ac.uk could not be
  read (robots.txt), and no source read gives the day the 2019 data was released.
release_venue: Interspeech 2019
release_venue_source: src-arxiv-1912-02522
release_venue_quote: a public challenge and workshop held at Interspeech 2019 in Graz, Austria

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/speaker-tasks
domain_basis:
  reason: Every track of every edition scores speaker verification (same speaker or not) or speaker
    diarisation (who spoke when), the two tasks the leaf names.
  source: src-voxsrc-2023-site
  quote: Track 1, 2 and 3 are speaker verification tracks, where the task is to determine whether
    two samples of speech are from the same person.
domain_considered_and_rejected:
  - term: audio-speech/speech-recognition
    reason: Nothing transcribes speech. The 2021 multilingual pairs used language labels only to
      sample harder trial pairs, and the score is still same-speaker verification.
capability:
  - perception
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: The input is raw speech audio, and the score measures what was recovered from it, a
      speaker match or speaker turns.
    source: src-voxsrc-2023-site
    quote: The goal of this challenge is to probe how well current methods can recognise speakers
      from speech
  distribution-shift-generalization:
    reason: The semi-supervised domain adaptation track (2022-2023) keeps the verification task and
      its same-or-different label but moves the inputs from mainly English VoxCeleb to Chinese
      CNCeleb, and scores the target domain as a track of its own. The 2020 edition also put movie
      audio (VoxMovies) into the test pairs as out-of-domain data.
    source: src-arxiv-2408-14886-v1
    quote: we focused on the task of speaker verification from one language which is the source
      domain (mainly English), to a different language in a target domain (Chinese)
capability_considered_and_rejected:
  - term: transfer-learning
    reason: The source calls Track 3 domain adaptation, but the task and label set are unchanged and
      only the inputs move, which the vocabulary's tie-break sends to
      distribution-shift-generalization.
  - term: sample-efficiency
    reason: Track 3 supplies a small labelled target set (50 speakers, 20 utterances each), but
      beside a large unlabelled target set and labelled VoxCeleb2, and no score is reported against
      a fixed sample budget.

evaluation_method:
  - domain-metric
  - classification-metric
evaluation_method_basis:
  reason: The verification tracks follow NIST SRE, Tracks 1 and 2 ranked by the minimum detection
    cost (minDCF with C_miss = C_fa = 1 and P_target = 0.05), and the diarisation track follows
    DIHARD and NIST RT, ranked by DER; both are measures of the speaker-recognition field. Track 3
    is ranked by the equal error rate, an operating point of the score ranking whose formula is the
    same in any detection task, and EER is displayed beside minDCF on every verification board.
  source: src-arxiv-2408-14886-v1
  quote: The evaluation protocols and metrics are adopted, with minor modifications, directly from
    NIST SRE challenges [7] for the verification tracks, and from DIHARD [11] for the diarisation
    track.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants are speaker-embedding and diarisation systems trained for the task, on VoxCeleb2
    dev alone in the closed tracks; the self-supervised track's models are trained for the same task
    without labels.
  source: src-arxiv-2408-14886-v1
  quote: All teams adopted a DNN-based embedding extractor
as_used:
  - protocol: Online diarisers scored on the released VoxSRC-23 diarisation test set (Track 4, 413
      recordings) against its released labels, run locally by the authors with a 0.25-s collar, not
      through the challenge's server. Three released systems (DIART, Streaming Sortformer, LS-EEND)
      were rerun beside the authors' own tracker.
    split: VoxSRC-23 Track 4 test
    source: src-arxiv-2610-11278-v1
    quote: The comparison with existing systems (Table 1) uses the evaluation sets of the two
      challenge series, VoxSRC-23 and DIHARD III
    note: Kwon, Heo, Lee and Lee (NAVER Cloud), October 2026, submitted to ICASSP 2027. Three of the
      four are among those the retrospective thanks for double-checking the diarisation validation
      and test labels.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. An October 2026 paper scores online
    diarisers on the released VoxSRC-23 test set. The series' formal ending is recorded in activity
    (ADR-0019).
  source: src-arxiv-2610-11278-v1
  quote: The comparison with existing systems (Table 1) uses the evaluation sets of the two
    challenge series, VoxSRC-23 and DIHARD III
activity: leaderboard-live-no-round
activity_note: The organisers declare the series finished. The evaluation servers on
  zeus.robots.ox.ac.uk could not be read, because its robots.txt disallows every path, so whether
  the permanent phase still takes submissions in October 2026 rests on the retrospective (August
  2024) and on the 2023 page. That page was updated after the series ended ("All test labels are
  released now") and still links the four servers as active.
activity_basis:
  reason: Each edition opened a permanent phase after its workshop, through which anyone could
    submit test-set results and compare them with the winners'. No round has run since 2023 and none
    will.
  source: src-arxiv-2408-14886-v1
  quote: We also opened a permanent phase after the workshop ended to let people both in industry
    and academia evaluate their systems with our test set

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The VoxSRC 2022 and 2023 Track 2 winners (speaker-embedding ensembles on self-supervised
      pretrained features)
    source: src-arxiv-2408-14886-v1
    observed_on: 2026-10-14
    quote: Both the VoxSRC 2022 winner [61] and 2023 winner [62] demonstrated that self-supervised
      pretrained models generalise well in the new domain
  - system: Streaming Sortformer (released 4-speaker checkpoint), on the VoxSRC-23 diarisation test
      set
    source: src-arxiv-2610-11278-v1
    observed_on: 2026-10-14
    quote: Streaming Sortformer [5] 1.10 4.23 15.45 20.79
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Speaker identities of the test pairs, from YouTube identities absent from
  VoxCeleb and checked manually, and diarisation references annotated by a vendor team; withheld
  during each challenge and released after the series ended.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The test labels are now public, and each year's toolkit is the organisers' own scoring
    code, so any result can be rescored locally.
  source: src-arxiv-2408-14886-v1
  quote: The code in this toolkit was identical to the one which organisers use for evaluation

task:
  exists: true
  input:
    - a trial pair of speech segments (verification tracks)
    - a multi-speaker audio file (diarisation track)
  output: A real-valued same-speaker score for each trial pair, or an RTTM file of speaker turns.
  scoring: Tracks 1 and 2 are ranked by minDCF alone, with EER displayed; Track 3 (domain
    adaptation) by EER; Track 4 by DER with a 0.25 s collar and overlapping speech scored, with JER
    displayed. Each track has its own leaderboard and winners.
  source: src-voxsrc-2023-site
  quote: For tracks 1 and 2, the primary metric for the challenge will be the Detection Cost

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The test labels download from the overview page without an account. The test audio
    downloads from the challenge pages' links on robots.ox.ac.uk, given as plain wget commands,
    which were not fetched (robots.txt). The VoxCeleb training audio is a lesser layer, sent by
    e-mailed links after a request form that asks for an institutional address and agreement to the
    licence.
  access_basis:
    reason: Since the series ended, every edition's test labels are public beside its test audio, so
      the headline scores can be computed from downloaded data.
    source: src-voxsrc-site
    quote: This website provides an overview of the VoxSRC challenges, links to the previous
      challenges and ground truth of all test pairs from 2019 to 2023.
  access_by_phase:
    during_edition: train-open-test-held-out. Test audio was released without labels and results
      were scored by the organisers' server.
    during_edition_source: src-arxiv-2408-14886-v1
    during_edition_quote: During the VoxSRC challenges, the labels of the test sets were not
      released.
    after_edition: fully-open. The overview page publishes the ground truth of every edition's test
      sets.
    after_edition_source: src-voxsrc-site
    after_edition_quote: This website provides an overview of the VoxSRC challenges, links to the
      previous challenges and ground truth of all test pairs from 2019 to 2023.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each annual edition was ranked on a new test set. The 2019 pairs stayed inside every
      later set, and the 2023 set combined all earlier years' pairs with its own.
    source: src-voxsrc-site
    quote: with new test sets released each year
  data_provenance:
    - web-scraped
  data_provenance_note: Speech segments cut from YouTube videos, of identities absent from VoxCeleb1
    and VoxCeleb2, checked manually; the diarisation test sets were annotated by a vendor team. The
    2020 diarisation test set was VoxConverse's test set, and Track 3's test pairs come from
    CNCeleb's hidden set, which its authors provided.
  data_provenance_source: src-voxsrc-2023-site
  data_provenance_quote: The data is obtained from YouTube videos of celebrity interviews, as well
    as news shows, talk shows, and debates
  contamination_risk: medium
  contamination_risk_note: The test audio and, since the series ended, the labels are public, and
    the audio comes from public YouTube videos. The 2022 and 2023 open-track winners trained on
    speaker data they gathered themselves with a VoxCeleb-like pipeline, Self-VoxCeleb and VoxTube;
    no source checks those against the test identities. No route into a scored split is evidenced.
  contamination_risk_source: src-arxiv-2408-14886-v1
  contamination_risk_quote: A particular challenge is siloing the test set, to ensure that it has
    not been used for training.
  contamination_evidence: []
  ceiling_anchor_type_note: No human or measured ceiling is given. The retrospective treats sub-1%
    EER on the 2019 test set as saturation, a threshold rather than an anchor.
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the VoxSRC test sets or their labels.
  upstream_licences: VoxCeleb (the training data and the validation sets' VoxCeleb1 audio) is CC BY
    4.0 for research purposes, with the videos' copyright left with their owners; CNCeleb, VoxMovies
    and VoxConverse keep their own terms, which were not read.
  upstream_licences_source: src-voxceleb-site
  upstream_licences_quote: The VoxCeleb dataset is available to download for research purposes under
    a Creative Commons Attribution 4.0 International License.
  size:
    - count: 825437
      unit: verification trial pairs (Tracks 1 and 2), from 256,547 utterances
      subset: 2023 test set
      source: src-voxsrc-site
      quote: 'Supervised verification : 825,437 pairs from 256,547 utterances'
    - count: 80000
      unit: verification trial pairs (Track 3, domain adaptation), from 21,997 utterances
      subset: 2023 test set
      source: src-voxsrc-site
      quote: 'Semi-supervised domain adaptation : 80,000 pairs from 21,997 utterances'
    - count: 413
      unit: audio files (Track 4, diarisation)
      subset: 2023 test set
      source: src-voxsrc-site
      quote: 'Diarisation : 413 audio files'
    - count: 208008
      unit: verification trial pairs, from 19,154 utterances
      subset: 2019 test set, kept inside every later year's test set
      source: src-voxsrc-site
      quote: 208,008 pairs from 19,154 utterances
    - count: 1092009
      unit: training utterances from 5,994 speakers (VoxCeleb2 dev, the closed tracks' training set)
      subset: training
      source: src-arxiv-2408-14886-v1
      quote: The dev set contains 1,092,009 utterances from 5,994 speakers.
  submission_limit:
    max_submissions: 10
    period_days: 0
    per: team and track, on the test set
    source: src-voxsrc-2023-site
  submission_limit_note: One submission a day, ten in all per track (2023); the limit was five in
    2019 and 2020, set to keep teams from overfitting the test set.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Visual Geometry Group, University of Oxford, with KAIST (which now hosts the pages)
  maintainer_basis:
    reason: VGG holds the pages' copyright and ran the evaluation servers on its own host; the
      organisers came from VGG, KAIST, Google Research, Meta, CMU and AWS, with VGG and KAIST on
      every edition.
    source: src-voxsrc-site
    quote: Copyright © Visual Geometry Group
  maintainer_type: academic-lab
  maintainer_type_note: conference-workshop was considered. The workshops were held with Interspeech
    and the organiser list grew between editions, but one standing lab organised and hosted all
    five, which the term's exclusion sends to that lab's type.
  submission_process:
    - held-out-server
    - maintainer-scored-predictions
  submission_process_note: Participants uploaded verification scores or RTTM files to CodaLab, which
    scored them against labels they could not see (held-out-server; the challenge phases). Since the
    labels were released, the permanent phase scores against public labels
    (maintainer-scored-predictions). publication-gated was considered and rejected, because only
    teams that sent a technical report could win, but the leaderboard took results without one.
  submission_process_source: src-arxiv-2408-14886-v1
  submission_process_quote: asked the participants to submit the prediction scores for whether each
    pair was from the same speaker or not
  independence_flags:
    - flag: prize-sponsored-by-industry
      source: src-voxsrc-2022-site
      quote: VoxSRC is proudly sponsored by Naver/Line.
  independence_flags_note: The 2022 and 2023 pages promise cash prizes for the top three of each
    track, and the 2022 page names Naver/Line as VoxSRC's sponsor. The retrospective thanks Naver
    for sponsoring the workshops. No source says in so many words that Naver/Line paid the prizes.
    An organiser, Jee-weon Jung, was at Naver Corporation in 2022.
    maintainer-competes-on-own-benchmark was looked for and not found.
    single-evaluator-private-test-set no longer applies, because the labels are public.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: With the test labels released and the scoring toolkit public, anyone can score a new
      system on any edition's test set end to end. During each challenge the labels were held back.
    source: src-arxiv-2408-14886-v1
    quote: However, following the end of the challenges, they have now been released for the
      community.
  harness_availability: official-harness
  harness: The yearly validation toolkit (VoxSRC2023's compute_min_dcf.py, compute_EER.py and
    compute_diarisation_metrics.py)
  harness_source: src-github-voxsrc2023-readme
  harness_quote: The file `compute_min_dcf.py` computes the detection cost.
  submission_channel:
    source: src-arxiv-2408-14886-v1
    quote: Each year we used the submission server provided by the CodaLab platform except for the
      last two years when we created our own backend
  code_licence: null
  code_licence_note: JaesungHuh/VoxSRC2023 states no licence (GitHub's licence metadata is null,
    read 2026-10-14; not a quoted Source). The README asks users to read the Kaldi and dscore
    licences, which its scoring code derives from, before redistributing.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition's test set (the 2019 pairs sit inside every later set and the 2023
  # set combines all years), which track, closed or open training data, and the scoring code (the official toolkit,
  # its DER collar of 0.25 s, and the original or the fixed test labels).
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each track is ranked on its own metric and names its own winners, and nothing combines the
    tracks.
  source: src-voxsrc-2023-site
  quote: you can participate in as many tracks as you like and be considered for each one

homepage: https://mm.kaist.ac.kr/datasets/voxceleb/voxsrc/workshop.html
repository: https://github.com/JaesungHuh/VoxSRC2023
dataset_url: https://mm.kaist.ac.kr/datasets/voxceleb/
leaderboard_url: https://zeus.robots.ox.ac.uk/competitions/competitions/17


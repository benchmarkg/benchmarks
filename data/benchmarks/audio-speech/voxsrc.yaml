    breaking: true
    supersedes_version: '2020'
    superseded_by: '2022'
    errata:
      - scope: the verification test labels
        description: Erroneous labels were found after the challenge; a fixed label file is
          published beside the original.
        source: src-voxsrc-site
    frozen: true

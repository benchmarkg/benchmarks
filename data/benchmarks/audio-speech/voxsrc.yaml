subsets:
  - id: voxsrc#track-1-closed
    label: Speaker verification, closed training data (Track 1, 2019-2023)
    scored_separately: true
    evidence:
      - source: src-voxsrc-2023-site
        quote: Participants can only use VoxCeleb2 dev dataset for which we have already released
          speaker labels.
    notes: Trained on VoxCeleb2 dev only and ranked by minDCF. Same test pairs as Track 2.
  - id: voxsrc#track-2-open
    label: Speaker verification, open training data (Track 2, 2019-2023)
    scored_separately: true
    evidence:
      - source: src-voxsrc-2023-site
        quote: Participants can use VoxCeleb2 dev dataset and any other data except the challenge
          test data
    notes: Any training data but the test set, ranked by minDCF.
  - id: voxsrc#self-supervised
    label: Self-supervised speaker verification (Track 3, 2020-2021)
    scored_separately: true
    evidence:
      - source: src-arxiv-2408-14886-v1
        quote: we introduced a self-supervised speaker verification track to investigate methods for
          training speaker verification models without labels
    notes: VoxCeleb2 dev without labels; the same test pairs as Tracks 1 and 2 of its year.
  - id: voxsrc#domain-adaptation
    label: Semi-supervised domain adaptation (Track 3, 2022-2023)
    scored_separately: true
    evidence:
      - source: src-voxsrc-2023-site
        quote: For track 3, the primary metric is EER, as this is a more forgiving metric.
    notes: Labelled VoxCeleb2, an unlabelled CNCeleb2 subset and a small labelled CNCeleb set for
      training; its own CNCeleb test pairs, ranked by EER.
  - id: voxsrc#diarisation
    label: Speaker diarisation (Track 4, 2020-2023)
    scored_separately: true
    evidence:
      - source: src-voxsrc-2023-site
        quote: but the leaderboard will be ranked using the Diarisation Error Rate (DER) only
    notes: Open training data; RTTM output scored by DER with a 0.25 s collar.

history:

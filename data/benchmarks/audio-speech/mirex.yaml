    evidence:
      - source: src-mirex-2026-music-audio-generation
        quote: The MIREX 2026 Cover Song Generation task asks an AI music system to remake a full
          song according to a style or arrangement prompt.
      - source: src-mirex-2026-music-audio-generation
        quote: whether the main melody is preserved or plausibly adapted
      - source: src-mirex-2026-music-audio-generation
        quote: The official evaluation will be based on expert listening. Three trained evaluators

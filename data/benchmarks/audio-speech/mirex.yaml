# data/benchmarks/audio-speech/mirex.yaml
#
# P1-S7-T03, audio-speech entry 7 of 9. Filled from the MIREX wiki on music-ir.org, read with scripts and styles
# stripped: MIREX_HOME, which now holds the 2026 edition; the 2025, 2024 and 2021 main pages; the 2026 Audio Chord
# Estimation, Symbolic Music Generation and Music Audio Generation task pages; the 2025 Audio Chord Estimation and
# Symbolic Music Generation results pages; and the Participant Agreement. Also the README of
# ismir-mirex/mirex-evaluation at main; "Ten Years of MIREX" (Downie et al., ISMIR 2014), read as the CC BY 4.0 PDF
# in the University of Waikato's repository; and the v1 PDF of "Twenty-Five Years of MIR Research" (arXiv
# 2511.07205, November 2025). Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.
#
# The hub list flagged MIREX's 2026 status as unverified. It is live, still on music-ir.org: MIREX 2026 runs with
# ISMIR 2026 (Abu Dhabi, 8-12 November 2026), its submissions closed on 1 October (7 October for seven tasks) and its
# results are due on 15 October 2026. MIREX 2025 ran with ISMIR 2025 and published results. No edition ran in 2022
# or 2023; a Future MIREX team revived the series in 2024, with submissions through futuremirex.com and evaluation
# code in the ismir-mirex GitHub organisation.

id: mirex
name: MIREX
aliases:
  - Music Information Retrieval Evaluation eXchange
tagline: ISMIR's yearly music information retrieval evaluation since 2005, from chord and beat tasks
  to music generation.
description: >
  The Music Information Retrieval Evaluation eXchange, a yearly community evaluation campaign held with
  the ISMIR conference since 2005. Each edition is a set of tasks, each led by a task captain who defines
  it, collects the submissions, runs or scores them and publishes a results page on the MIREX wiki. Music
  audio is copyrighted, so MIREX has worked algorithm-to-data: participants submit their algorithms and
  the organisers run them on test collections that are not distributed. IMIRSEL at the University of Illinois
  ran it from 2005 to 2021 and had evaluated 1,997 algorithms on 37 test collections by 2013. No edition
  ran in 2022 or 2023; a Future MIREX team revived it in 2024 with a new submission site, docker submissions
  and generative tasks. The 2026 edition lists fourteen tasks: six standardized evaluation suites whose
  scoring code is public (chord, beat, key and downbeat estimation, music structure analysis and lyrics-to-audio
  alignment), lyrics transcription, instrument recognition, audio-to-score transcription, performance
  difficulty prediction, music evaluation on CMI-RewardBench, rhythm game chart generation, and symbolic
  and audio music generation judged by listening tests.
self_description:
  source: src-mirex-home
  quote: MIREX (Music Information Retrieval Evaluation eXchange) is an annual community evaluation
    campaign held in conjunction with the International Society for Music Information Retrieval
    Conference
released_note: MIREX began in 2005 with its first plenary and poster sessions at ISMIR 2005 in
  London; no source read gives a day, so released is left empty.
released_source: src-ismir-2014-ten-years-mirex
released_quote: MIREX officially began in 2005 and had its first plenary and poster sessions in
  ISMIR 2005
release_venue: ISMIR 2005

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: audio-speech/music-understanding
  secondary:
    - audio-speech/music-generation
  per_edition: true
  per_edition_note: The secondary leaf is a union over editions. Music generation entered with the
    2024 revival (symbolic and audio music generation); neither the 2014 review's task table for
    2005-2013 nor the 2021 task list has a generation task.
domain_basis:
  reason: Most tasks in every edition take a music recording and score the musical attributes
    recovered from it -- chords, beats, downbeats, keys, structure, instruments, lyrics. Since 2024
    the symbolic and audio music generation tasks score generated music, the secondary leaf; each
    carries its own domain in subsets.
  source: src-mirex-2026-audio-chord-estimation
  quote: This task requires participants to extract or transcribe a sequence of chords from an audio
    music recording.
domain_considered_and_rejected:
  - term: multimodal/audio-language
    reason: The 2024 and 2025 editions ran Music Description & Captioning, and 2025 Music Reasoning
      QA, which pair music audio with text. Neither is in the 2026 lineup, and they were two of
      2025's thirteen tasks.
    source: src-mirex-2025-main
    quote: 2025:Music Description & Captioning
  - term: audio-speech/speech-recognition
    reason: Lyrics transcription (2025 and 2026) transcribes sung lyrics from music recordings,
      while the leaf covers spoken audio; the task page was not read.
capability:
  - perception
capability_basis:
  perception:
    reason: The understanding tasks take a music recording and score what was recovered from it, for
      chords the labels and their times against human annotations, weighted by song length.
    source: src-mirex-2026-audio-chord-estimation
    quote: This final number is referred to as the weighted chord symbol recall (WCSR).
capability_considered_and_rejected:
  - term: temporal-reasoning
    reason: Chord, beat and downbeat outputs are timed and chord scoring weights by duration, but
      the score measures timing recovered from the signal, which is perception; no order or duration
      is reasoned from given events.
  - term: generation-fidelity
    reason: Assigned only to the Music Audio Generation subset, whose 2026 cover-song task rates
      whether the source song's melody is preserved; the understanding tasks generate nothing.
  - term: creativity-novelty
    reason: Assigned only to the Symbolic Music Generation subset, whose listening test rates
      creativity.
  - term: distribution-shift-generalization
    reason: The 2025 chord task added Yamaha's J-pop-heavy private sets beside Billboard's western
      pop, but reports them as further main test sets, not as a deliberately shifted condition.

evaluation_method:
  - domain-metric
  - human-crowd-eval
  - human-expert-eval
evaluation_method_basis:
  reason: The understanding tasks are scored with MIR's own measures, for chords the chord symbol
    recall under five chord vocabularies beside a directional Hamming segmentation score. The
    generation tasks are judged by listening tests, in 2025 Symbolic Music Generation by 20
    listeners of diverse music backgrounds, in 2026 Music Audio Generation by three trained
    evaluators (see subsets).
  source: src-mirex-2026-audio-chord-estimation
  quote: MIREX typically uses chord symbol recall (CSR) to estimate how well the predicted chords
    match the ground truth
evaluation_method_considered_and_rejected:
  - term: reference-metric
    reason: Lyrics transcription is likely scored by word error rate, but its task page was not
      read.
  - term: composite
    reason: No edition combines its tasks into one number; each task publishes its own results page.
designed_for_subjects:
  - task-specific-supervised-model
  - generative-media-model
designed_for_subjects_basis:
  reason: The entrants are models trained for one task -- the 2026 chord task makes learned
    submissions ship their trained models, and the 2025 entrants include a Mamba-based chord
    recogniser -- and, since 2024, music generators whose generated music is what the listeners
    score.
  source: src-mirex-2026-audio-chord-estimation
  quote: Submissions using machine learning models must also submit their trained models.
designed_for_subjects_considered_and_rejected:
  - term: classical-algorithm
    reason: The 2025 chord task ran Chordino (NNLS Chroma) as a baseline, but the sources read do
      not say whether it has a learned component, and every entrant named there is a learned model.
    source: src-mirex-2025-audio-chord-estimation-results
    quote: 'Baseline: Chordino NNLS Chroma v1.1'

lifecycle: active
lifecycle_basis:
  reason: The 2025 edition published per-task results (the quote is a 2025 chord entrant's row on
    Billboard 2013), and the 2026 edition's fourteen tasks closed to submissions in October 2026
    with results due on 15 October.
  source: src-mirex-2025-audio-chord-estimation-results
  quote: MD1 81.35 79.15 77.91
activity: results-pending
activity_note: Some tasks keep their own timelines. Symbolic Music Generation planned to announce
  its final result on 29 September 2026 and Music Audio Generation by 15 October; no 2026 result
  page for either was linked on 2026-10-14.
activity_basis:
  reason: MIREX 2026's submissions closed on 1 October 2026, and on 7 October for the six
    standardized suites and the CMI-RewardBench task; results are due on 15 October. On 2026-10-14
    the 2026 results page said its overall poster was coming soon and none of its per-task result
    pages existed yet.
  source: src-mirex-home
  quote: 'Result published: Oct 15, 2026'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: BMACE (a Mamba-based chord recogniser, 2025 Audio Chord Estimation)
    source: src-mirex-2025-audio-chord-estimation-results
    observed_on: 2026-10-14
    quote: BMACE A Mamba-Based Model for Automatic Chord Recognition
evaluation_target: learned-system
execution_mode: automated
execution_mode_note: The understanding tasks run without people. The generation tasks are judged by
  listening panels after the organisers run, or the teams submit, the generated music.
ground_truth_source: held-out-labels
ground_truth_source_note: Human annotations of test collections the organisers hold, such as chord
  transcriptions made by one or more annotators. The generation tasks have no reference; listeners'
  ratings are the score.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test audio is copyrighted and not distributed, and the 2025 chord task's main sets
    include Yamaha's private collections, so only the organisers can produce the official numbers.
    The scoring code and the labels of public sets are released.
  source: src-ismir-2014-ten-years-mirex
  quote: prevents researchers from replicating the evaluation and benchmarking their newly developed
    algorithms on their own

task:
  exists: true
  input:
    - a music recording, given to the submitted program by the organisers, for the understanding
      tasks
    - for Symbolic Music Generation a 4-measure piano prompt as a note list; for Music Audio
      Generation a full-length source song and a style or arrangement prompt
  output: Per task -- timed chord labels and the other musical attributes the task names (beats,
    downbeats, keys, structure, instruments, lyrics and their alignment, a score); a 12-measure
    piano continuation; a complete cover-song recording.
  scoring: Each task on its own metrics over its own test sets, published per test set on the task's
    results page. Chord estimation is scored by weighted chord symbol recall under five vocabularies
    and by segmentation; the generation tasks by mean listener ratings on 5-point scales.
  source: src-mirex-2026-audio-chord-estimation
  quote: This task requires participants to extract or transcribe a sequence of chords from an audio
    music recording.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: Two generation tasks differ. Music Audio Generation 2026 gave participants its four
    source songs and prompts (for that task only) and scores the audio they return; Symbolic Music
    Generation pools its test prompts from the teams. The evaluation repository publishes the label
    files of public sets, without audio.
  access_basis:
    reason: The headline test sets stay with the organisers, who run each submitted system on them.
      In 2025's chord task two of the three main sets are Yamaha's private collections and the third
      is the held-out portion of the McGill Billboard set.
    source: src-mirex-2025-audio-chord-estimation-results
    quote: 'Yamaha_JPOP: A private dataset annotated by Yamaha Corporation.'
  refresh: periodic-recompetition
  refresh_basis:
    reason: Yearly editions rank each year's entrants on that year's tasks and data. The revived
      MIREX set out to bring new tasks and datasets, and 2025's chord task added Yamaha's private
      sets. Some sets recur across years, which the IMIRSEL-era review says of its ground truth too.
    source: src-mirex-2025-main
    quote: We want to bring in new tasks, benchmarks, and datasets in response to the rapid
      development of computer music research.
  data_provenance:
    - inherited-from-constituents
    - unreleasable-confidential
  data_provenance_note: Test sets are mostly existing annotated collections (in 2025's chord task
    Billboard 2012 and 2013 and RWC Popular) with private ones donated beside them (Yamaha's). The
    audio is copyrighted and not distributed, and the private sets' labels are not released either.
    The generation tasks' items are prompts contributed by the teams (symbolic) or source songs the
    task captain cleared for the task (audio).
  data_provenance_source: src-mirex-2025-audio-chord-estimation-results
  data_provenance_quote: 'Billboard 2013: The held-out portion of the McGill Billboard dataset'
  contamination_risk: low
  contamination_risk_note: The main test sets are held out by rule and their audio stays with the
    organisers. The results pages report public sets (Billboard 2012, RWC Popular) apart, as sets
    some models may have trained on. Whether pretrained music models have seen the held-out songs'
    audio is not assessed.
  contamination_risk_source: src-mirex-2025-audio-chord-estimation-results
  contamination_risk_quote: The following datasets are served as pure test sets. No system is
    allowed to train on them.
  contamination_evidence: []
  size:
    - count: 37
      unit: test collections used in 2005-2013, over which 1,997 algorithms were evaluated
      subset: the IMIRSEL editions, 2005-2013
      source: src-ismir-2014-ten-years-mirex
      quote: By 2013, MIREX has evaluated 1997 individual MIR algorithms over 37 different test
        collections
    - count: 241
      unit: songs (Yamaha_Balanced, a private chord test set)
      subset: 2025 Audio Chord Estimation
      source: src-mirex-2025-audio-chord-estimation-results
      quote: The dataset contains 241 songs.
    - count: 200
      unit: J-pop songs (Yamaha_JPOP, a private chord test set)
      subset: 2025 Audio Chord Estimation
      source: src-mirex-2025-audio-chord-estimation-results
      quote: The dataset contains 200 JPOP songs.
    - count: 4
      unit: source-song and prompt pairs
      subset: 2026 Music Audio Generation
      source: src-mirex-2026-music-audio-generation
      quote: The official test set contains four source-song and prompt pairs.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Future MIREX team (organisers from New York University, MBZUAI, Yamaha, ByteDance,
    HKUST and the University of Illinois) with a volunteer task captain per task, under ISMIR;
    IMIRSEL at the University of Illinois ran it from 2005 to 2021
  maintainer_basis:
    reason: The 2026 organisers are listed on the hub; each task's captain runs and scores it. The
      IMIRSEL era is described in the 2014 review.
    source: src-mirex-home
    quote: 'MIREX 2026 Organizers: Junyan Jiang, New York University Gus Xia, MBZUAI Akira Maezawa, Yamaha'
  maintainer_type: conference-workshop
  maintainer_type_note: A recurring challenge held with ISMIR whose task captains change between
    editions, the term's case even where one lab or team coordinates the series. academic-lab fitted
    the IMIRSEL years better, and the evaluation code sits in a shared GitHub organisation
    (community-collective).
  submission_process:
    - containerized-algorithm-submission
    - held-out-server
    - publication-gated
  submission_process_note: Most tasks take code. The 2026 standardized suites take a docker image
    (or code with a README) with trained models and run it on the organisers' GPU server without
    internet access; Symbolic Music Generation takes code, a GitHub link or docker and the
    organisers generate the samples. Music Audio Generation 2026 instead takes the teams' generated
    audio, scored by listening after the deadline. Every submission comes with a 2-4 page extended
    abstract. Winners must open-source their submission under Apache 2.0 (Participant Agreement),
    which is a condition of winning, not of being ranked.
  submission_process_source: src-mirex-2026-audio-chord-estimation
  submission_process_quote: A docker submission will be deployed and evaluated automatically with
    docker run
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-mirex-2025-audio-chord-estimation-results
      quote: 'Yamaha_JPOP: A private dataset annotated by Yamaha Corporation.'
  independence_flags_note: Each task's organisers hold its test audio and run every submission.
    Yamaha supplies the private chord sets, and a Yamaha researcher is a 2026 organiser and
    co-captain of the standardized suites; no Yamaha system appears among the entrants read. No
    prize or sponsor money is mentioned in the sources read.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2511-07205-v1
    quote: which could partly explain the declining interest in the initiative
  known_limitation_note: A 2025 review of MIR research credits MIREX with structuring the field's
    tasks, and faults its black-box, algorithm-to-data model and the lack of a workshop for limiting
    what participants learn from it.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: provided-allocation
  compute_tier_basis:
    reason: For the standardized suites the organisers run every submitted image on their own GPU
      server, so the entrant pays for training only. Music Audio Generation 2026 is the exception,
      where teams run their own systems.
    source: src-mirex-2026-audio-chord-estimation
    quote: A Linux server with one Nvidia GeForce RTX 3090 is used for evaluation.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline numbers need test audio and private labels only the organisers hold, and
      the generation tasks' numbers need their listening panels.
    source: src-ismir-2014-ten-years-mirex
    quote: the test data used in MIREX cannot be distributed to participants
  reproducibility_blockers:
    - private-test-set
    - unreleasable-data
    - human-raters
  reproducibility_blockers_note: The test audio is copyrighted music; Yamaha's chord sets are
    private; the generation tasks are scored by recruited listeners.
  harness_availability: official-harness
  harness: mirex-evaluation (python main.py with the task name, for the standardized suites)
  harness_note: The repository scores the standardized suites (chord, beat, structure and lyrics
    alignment ready, key and downbeat to be added) from submitted outputs and the label files; tasks
    with proprietary scoring code and the listening tests have no published harness. GitHub's
    licence metadata for the repository is empty (read 2026-10-14), so code_licence is left empty.
  harness_source: src-github-mirex-evaluation-readme
  harness_quote: This is the open-source repo for all tasks evaluated by MIREX.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The profile resolves to human-judged (the generation tasks' listening tests). Beyond it: which edition, task
  # and test set (main held-out sets or the additional public ones), what the entrant trained on (the held-out
  # sets are barred, the additional sets are not), and for the generation tasks how the submitted sample was
  # picked from the candidates generated.
  material_extra:
    - subset_used
    - training_data_policy
    - selection_strategy
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each task captain scores the task and publishes its own results page; no source combines
    tasks into one ranking.
  source: src-mirex-home
  quote: Report results to MIREX and create a results page on the MIREX Wiki.

homepage: https://music-ir.org/mirex/wiki/MIREX_HOME
repository: https://github.com/ismir-mirex/mirex-evaluation
leaderboard_url: https://music-ir.org/mirex/wiki/2025:MIREX2025_Results

versions:
  - version: '2021'
    label: MIREX 2021, the last edition run by IMIRSEL
    version_kind: edition
    changes: The 17th running, organised by IMIRSEL with volunteer task captains and held online
      with ISMIR 2021, with twenty possible tasks, among them beat, chord, key, tempo and onset
      estimation, melody extraction, structural segmentation, cover song identification and query by
      singing or tapping. The submission system, evaluation framework and most datasets stayed at
      IMIRSEL.
    breaking: true
    superseded_by: '2024'
    frozen: true
    sources:
      - src-mirex-2021-main
  - version: '2024'
    label: MIREX 2024, the first Future MIREX edition
    version_kind: edition
    released: 2024-09-15
    changes: MIREX returned after three years without an edition, run by the Future MIREX team
      through a new submission portal, with eight tasks -- chord estimation, lyrics-to-audio
      alignment and cover song identification beside five "modern" ones (symbolic and audio music
      generation, music description and captioning, polyphonic transcription, singing voice deepfake
      detection). Some tasks required a docker image.
    breaking: true
    supersedes_version: '2021'
    superseded_by: '2025'
    frozen: true
    sources:
      - src-mirex-2024-main
      - src-mirex-2025-main
  - version: '2025'
    label: MIREX 2025
    version_kind: edition
    released: 2025-05-31
    changes: Thirteen tasks, adding beat tracking, key detection, structure analysis, lyrics
      transcription, music reasoning QA and the RenCon piano rendering contest, with
      community-proposed challenges. The chord task added Yamaha's private test sets.
    breaking: true
    supersedes_version: '2024'
    superseded_by: '2026'
    frozen: true
    sources:
      - src-mirex-2025-main
      - src-mirex-2025-audio-chord-estimation-results
      - src-mirex-2025-symbolic-music-generation-results
  - version: '2026'
    label: MIREX 2026
    version_kind: edition
    released: 2026-07-01
    changes: Fourteen tasks (a fifteenth, AI-generated music detection, was cancelled). Six
      traditional tasks became standardized evaluation suites scored by the public pipelines; new
      tasks include audio-to-score transcription, rhythm game chart generation, CMI-RewardBench
      music evaluation and performance difficulty prediction, and music audio generation became
      cover-song generation. Results are due on 15 October 2026.
    breaking: true
    supersedes_version: '2025'
    frozen: false
    sources:
      - src-mirex-home
      - src-mirex-2026-audio-chord-estimation
      - src-mirex-2026-symbolic-music-generation
      - src-mirex-2026-music-audio-generation


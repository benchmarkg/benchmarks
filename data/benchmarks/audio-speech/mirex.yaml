  - id: mirex#symbolic-music-generation
    label: Symbolic Music Generation
    domain_override:
      primary: audio-speech/music-generation
    capability_override:
      - creativity-novelty
    evidence:
      - source: src-mirex-2026-symbolic-music-generation
        quote: Given a 4-measure piano prompt (plus an optional pickup measure), the goal is to
          generate a 12-measure continuation
      - source: src-mirex-2026-symbolic-music-generation
        quote: Creativity (5-point scale)
      - source: src-mirex-2025-symbolic-music-generation-results
        quote: Responses were collected from 20 participants with diverse music backgrounds.
    notes: Run each year since 2024 on a narrowed subtask, in 2026 piano continuation. The
      organisers run each submitted algorithm for 8 samples per prompt, the team cherry-picks one,
      and a double-blind online listening test rates coherency, creativity, structure and musicality
      on 5-point scales.
  - id: mirex#music-audio-generation
    label: Music Audio Generation
    items: 4
    domain_override:
      primary: audio-speech/music-generation
    capability_override:

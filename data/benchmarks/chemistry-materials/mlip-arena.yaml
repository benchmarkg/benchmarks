# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2509-20630-v2
    - src-arxiv-2509-20630
    - src-github-mlip-arena-readme
    - src-github-api-mlip-arena
    - src-hf-mlip-arena-leaderboard-py
    - src-hf-mlip-arena-diatomics-rank
    - src-hf-mlip-arena-tasks-registry
    - src-hf-api-mlip-arena-space
    - src-hf-api-mlip-arena-dataset
    - src-arxiv-2609-08399-v1
  sources_note: >
    The paper's v2 PDF and abstract page and the MLIP Detective PDF carry DOIs and are not archived. The
    README is pinned to a commit; the three Space files are read at the commit the Space serves; the three
    API records are read as served on 2026-11-04. The model registry (mlip_arena/models/registry.yaml),
    which gives each model's training sets, was read but not made a Source because it names individual
    contributors' handles; the facts drawn on here come from the paper's Table S4 and the leaderboard
    code instead.
  confidence: medium
  review_checks:
    - check: Domain boundary. The force-fields-potentials leaf is defined as potentials "scored
        against reference quantum-chemical calculations", and MLIP Arena's ranked metrics
        deliberately use no such reference. The leaf is assigned because the subject is the
        potential and the matter it models; logged with bench tag-gap as an undefined boundary.
      field: domain
      specialist: true
      source: src-arxiv-2509-20630-v2
      quote: We specifically focus on the metrics agnostic to underlying DFT functional the model
        has been trained on
    - check: ground_truth_source is `none` for physical-law expectations (ideal tortuosity,
        monotonic repulsion, conservative forces), with experiment for the combustion enthalpy. The
        vocabulary has no value for an analytic physical reference (a proposed
        `physical-invariant`); bench tag-gap does not take ground_truth_source, so the gap is
        recorded here only.
      field: ground_truth_source
    - check: scientific-prediction rests on scoring against physical requirements rather than
        against measurement or reference computation, which the term's test names; the combustion
        enthalpy is the one ranked comparison with measurement.
      field: capability
      specialist: true
    - check: domain-metric for tortuosity, energy jump, force flips and conservation deviation. They
        are defined by this benchmark rather than standardised across the field, which the term's
        test asks for; the alternative is statistical-fit alone. The choice also resolves the
        eligibility-gated profile, whose two track fields are waived.
      field: evaluation_method
      specialist: true
    - check: The leaderboard Space serves commit 1508879 of 2026-03-27, while the repository's main
        branch had added PET models by June 2026 (commit 6239aea); the Space appears to lag main, so
        a rank read from it and one computed from main may differ. lifecycle stays active on the
        repository's activity.
      field: lifecycle
      source: src-hf-api-mlip-arena-space
      quote: '"sha":"1508879571257075528db9522e845605256f6b74","lastModified":"2026-03-27T03:03:42.000Z"'
    - check: submission_process self-reported for the pull-request route. A merge into the
        repository and its tests may amount to a maintainer check (maintainer-verified), but no
        source read states a review of submitted results.
      field: governance.submission_process
      source: src-github-mlip-arena-readme
      quote: PRs are welcome! Please clone the repo and submit PRs with your changes.
    - check: Maintainer identity. The accounts are atomind-ai and atomind; whether atomind is a lab
        group, a project name or a company was not established, and maintainer_type academic-lab
        rests on the authors' affiliations and the DOE funding.
      field: governance.maintainer
    - check: Versions. The ICLR 2025 AI4Mat workshop paper, the NeurIPS 2025 paper and the package's
        tagged releases (v0.0.1a0 of 2024-09 to v0.2.0-alpha of 2026-03, GitHub API, not a Source)
        are all the same benchmark with a board that moves on main, so no versions are listed and
        refresh is rolling-live; a reviewer may prefer the package releases as versioned-releases.
        released is the arXiv v1 date although the Space dates from 2024-03.
      field: versions
      source: src-github-mlip-arena-readme
      quote: MLIP Arena is accepted as an ICLR AI4Mat Spotlight!
    - check: compute_tier single-gpu from the per-run resource the paper fixes; a full sweep of all
        tasks is many such jobs, which the README distributes over a SLURM cluster, and cluster is
        the alternative reading.
      field: execution.compute_tier
    - check: contamination_risk medium. The ranked measures have no labels to leak, but the inputs
        are public and the paper proposes the workflows as training reward data; low would need the
        structure to exclude a route, which it does not.
      field: data.contamination_risk

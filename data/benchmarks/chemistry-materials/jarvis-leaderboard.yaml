# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2306-11688-v2
    - src-arxiv-2306-11688
    - src-atomgptlab-jarvis-leaderboard-home
    - src-nist-jarvis-leaderboard-home
    - src-github-atomgptlab-jarvis-leaderboard-readme
    - src-github-usnistgov-jarvis-leaderboard-readme-2025-06
    - src-github-atomgptlab-jarvis-leaderboard-licence
    - src-atomgptlab-jarvis-leaderboard-guide
    - src-arxiv-2609-19487
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its abstract page; both home pages and
    the contribution guide, static HTML built from the repositories; two READMEs and the licence pinned
    to commits; ALIGNN 2.0's abstract page as evidence of current use. The npj Computational Materials
    article itself was not read; the arXiv v2 is cited for it. The six web Sources are pending archival.
    Leaderboard rows name teams and methods only; no contributor's name is quoted.
  confidence: medium
  review_checks:
    - check: One benchmark with subsets, or a hub? The entry treats the 365 tasks as subsets of one
        benchmark (one maintainer, one repository, one paper, one scoring convention). TDC, a
        comparable multi-group platform, was catalogued per benchmark group (tdc-admet); by that
        precedent the AI MLFF set or the ES set might be entries of their own. 04 S4's test (same
        release, same maintainer) favours one entry here.
      field: subsets
    - check: domain.primary is molecular-property-prediction as the nearest leaf by task shape
        (single-property regression dominates), although its definition names a molecule and most
        inputs are crystals. The choice matches matbench's, by the lead's one rule for both; both
        gap records (2026-11-04-jarvis-leaderboard-001, 2026-11-04-matbench-001) propose
        chemistry-materials/materials-property-prediction, and the primary should move there if that
        leaf is added. The ES category, electronic-structure method validation, has no leaf either
        (same record).
      field: domain
      specialist: true
    - check: 'force-fields-potentials as primary instead: the MLFF and FF categories match its definition
        exactly, but they hold 585 of 2,491 contributions (49 of 365 tasks by the repository tree), against
        1,028 for AI property prediction and classification and 741 for ES. A reviewer may prefer the
        exact fit of a smaller part to the nearest fit of the largest.'
      field: domain.primary
      specialist: true
      source: src-atomgptlab-jarvis-leaderboard-home
      quote: AI 927 101 303 29 - 1 1 3 42 2 7 - ES 731 - - - - - - - - - 10 - FF 282 - - - - - - - -
        - - - QC - - - - - - - - - - - 6 EXP 7 - - - - - - - - - 18 -
    - check: maintainer_type is null. The board was NIST's (government-agency); since June 2025 its
        live repository is the atomgptlab organisation's, which no Source identifies
        institutionally, while its pages still call the project part of NIST-JARVIS. A reviewer who
        can establish what AtomGPTLab is should set the type.
      field: governance.maintainer_type
    - check: The usnistgov README said "no longer maintained" on 2025-06-27, and a NIST commit
        removed that notice on 2025-08-25 without new content (GitHub API). Whether NIST intends to
        resume the copy, which would make two diverging boards under one name, is unknown; if it
        does, the 04 S4 call becomes a fork.
      field: history
    - check: Re-hosted third-party data. OC20 IS2RE (ocp10k, ocp100k, ocp_all), QM9, mLEARN, MPtrj,
        MatPES, PDBbind and Terminal-Bench core 0.1.1 results appear as JARVIS tasks with JARVIS's
        own splits or copies. The oc20 and terminal-bench entries may want a fork or view link to
        this one; that needs an edit to those files, which this draft did not make.
      field: lineage
    - check: ground_truth_source is simulation for a mixed board (DFT for AI and FF; experiment for
        ES; analytical for QC; other labs for EXP); a per-category value is not expressible.
      field: ground_truth_source
      specialist: true
    - check: The EXP category's entrants are laboratory measurements, which no subject term carries;
        human-expert was rejected, and a tag-gap is logged.
      field: designed_for_subjects
    - check: submission_process is maintainer-scored-predictions; the paper also says administrators
        review each contribution, and the live contribution guide adds sanity tests in GitHub
        Actions. If the review is judged the gate, maintainer-verified could stand beside it.
      field: governance.submission_process
    - check: contamination_risk medium rests on public test targets and large pretraining corpora
        that can include JARVIS-DFT itself; no source checks overlap, so unknown is defensible.
      field: data.contamination_risk
    - check: Current use is evidenced only by the maintainers' own ALIGNN 2.0 paper; no independent
        2025-2026 paper reporting results on the leaderboard was read. Contributions from other
        groups appear in the repository's recent history (GitHub API), not in a quoted Source.
      field: as_used

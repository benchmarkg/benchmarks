# data/benchmarks/chemistry-materials/jarvis-leaderboard.yaml
#
# P1-S6-T02, chemistry-materials entry 14. Filled from the JARVIS-Leaderboard paper, arXiv 2306.11688 read as its v2
# PDF (2024-03-26, the version npj Computational Materials 10, 93 (2024) follows) and its abstract page; the two
# home pages the repository builds, atomgptlab.github.io/jarvis_leaderboard (current) and
# pages.nist.gov/jarvis_leaderboard (the original, no longer updated), both static MkDocs HTML; the atomgptlab
# repository's README and LICENSE.rst pinned to commit 27c7d5591e (2026-09-29); the usnistgov repository's README
# at commit d01fa17689 (2025-06-27), the version that announced the hand-over; the site's short contribution guide;
# and the abstract page of ALIGNN 2.0 (arXiv 2609.19487, September 2026) as evidence of current use. GitHub's API
# was read for both repositories' commit histories, branches and file trees (the benchmark counts per category
# below the summary table come from the tree); those reads are not Sources. Every quote below is checked by the
# quote-substring validator against the Sources' committed extracts.
#
# One benchmark or a hub (04 S4). The paper calls each reference dataset a "benchmark" (274 at publication, 365 on
# today's site), but every one is held in the same repository, added and verified by the same administrators,
# scored by the same code under one file convention (category-subcategory-property-dataset-split-metric), and
# published as one leaderboard under one paper and one name. Those are parallel tasks of one release by one
# maintainer, which 04 S4 models as subsets; the entry records the five categories and their sub-categories as
# subsets, not the 365 tasks. It is not a hub without a benchmark of its own: most tasks are the maintainers' own
# JARVIS-DFT data. Some tasks re-host other benchmarks' data (OC20's IS2RE, QM9, mLEARN, MPtrj, MatPES, PDBbind,
# Terminal-Bench core 0.1.1 results), which is noted where it bites and raised for the lead (review_checks).
#
# Task step 2 (training-data tiers): the board does not split entrants by what they may train on. Pretrained
# universal force fields and force fields trained on the benchmark's own split sit in one table; the paper names the
# distinction but no rule or view separates them. No training_data_eligibility_tiers are recorded; the difference is
# carried per claim by training_data_policy, which the surrogate-fit profile makes material.

id: jarvis-leaderboard
name: JARVIS-Leaderboard
aliases:
  - JARVIS Leaderboard
  - jarvis_leaderboard
  - AtomGPTLab's JARVIS-Leaderboard
aliases_note: jarvis_leaderboard is the repository's and the Python package's name; the current
  site's title is "AtomGPTLab's JARVIS-Leaderboard". Not the same thing as JARVIS-DFT, the
  maintainers' DFT database, from which most of the leaderboard's tasks are drawn.
tagline: 'NIST-born leaderboard of 365 materials-design tasks: AI, electronic structure, force fields,
  QC, experiments.'
description: >
  An open leaderboard for comparing materials-design methods, begun at NIST as part of the JARVIS infrastructure.
  Each task ("benchmark" in its own terms) is a reference dataset with fixed identifiers, and each contribution
  is one method's predictions for one task, submitted by pull request with a metadata file and, where
  possible, a run script. Tasks fall into five categories: artificial intelligence (AI; property prediction
  and classification from crystal structures, molecules, spectra, images and text, machine-learned force
  fields, and crystal generation), electronic structure (ES; DFT functionals, GW, quantum Monte Carlo
  and tight-binding codes scored against experimental values for named materials), classical force fields
  (FF), quantum computation (QC; variational eigensolvers on a tight-binding Hamiltonian) and experiments
  (EXP; inter-laboratory round-robin measurements). AI tasks carry fixed train, validation and test splits
  and are scored on the test split only; the others have a test set only. Scores are MAE for single properties,
  accuracy for classes, a multi-dimensional MAE for spectra, forces and eigenvalues, and ROUGE for generated
  text; every task is ranked on its own and no cross-task score is published. The paper reported 274 tasks
  and 1,281 contributions; the live site, which moved from NIST's GitHub organisation to atomgptlab in
  2025, lists 365 tasks and 2,491 contributions. Weaknesses the sources name: MAE values cannot be compared
  across tasks, and the reference for most AI tasks is DFT, not experiment.
self_description:
  source: src-arxiv-2306-11688
  quote: There are 1281 contributions to 274 benchmarks using 152 methods with more than 8 million
    data-points, and the leaderboard is continuously expanding.
external_ids:
  arxiv: '2306.11688'
paper:
  title: 'JARVIS-Leaderboard: A Large Scale Benchmark of Materials Design Methods'
  arxiv: '2306.11688'
  doi: 10.1038/s41524-024-01259-w
  version_read: v2
  source: src-arxiv-2306-11688-v2
released: 2023-06-20
released_note: The arXiv v1 submission date, the earliest public date any Source gives. GitHub's API
  dates the usnistgov repository's creation 2022-07-15; whether it was public then is not shown.
released_source: src-arxiv-2306-11688
released_quote: '[v1] Tue, 20 Jun 2023 17:07:07 UTC'
release_venue: npj Computational Materials 10, 93 (2024)
release_venue_source: src-atomgptlab-jarvis-leaderboard-home
release_venue_quote: Nature npj Computational Materials volume 10, 93 (2024)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/molecular-property-prediction
  secondary:
    - chemistry-materials/crystal-stability-discovery
    - chemistry-materials/force-fields-potentials
    - chemistry-materials/catalysis
  secondary_note: crystal-stability-discovery for the formation-energy, energy-above-hull and
    decomposition-energy tasks, the paper's flagship among them (the dft-3d-formation-energy subset
    carries it as its override, with the paper's quote); force-fields-potentials for the AI MLFF and
    FF categories (each carries a domain_override in subsets[]); catalysis for the OC20 IS2RE, AGRA
    and TinNet adsorption-energy tasks. The ES category, electronic-structure methods scored against
    experiment, fits no chemistry-materials leaf either
    (taxonomy/_failures/2026-11-04-jarvis-leaderboard-001).
domain_basis:
  reason: >
    The nearest leaf by task shape. The board is dominated by regression of single properties from structure:
    the AI single-property prediction sub-category alone holds 927 of 2,491 contributions (band gaps,
    formation energies, moduli, dielectric, piezoelectric and thermoelectric properties of crystals, and
    the QM9 molecular properties), with 101 more in single-property classification. molecular-property-prediction
    is that task shape, though its definition names a molecule and most inputs here are crystals; no leaf
    takes crystalline-material property prediction, and a tag-gap proposes chemistry-materials/materials-property-prediction.
    crystal-stability-discovery is narrower ("which candidate crystalline materials are thermodynamically
    stable enough to be worth synthesising") and fits only the formation-energy and hull tasks, so it
    is secondary. This nearest-leaf choice matches matbench's, and both gap records (jarvis-leaderboard-001,
    matbench-001) propose the same leaf.
  source: src-atomgptlab-jarvis-leaderboard-home
  quote: AI 927 101 303 29 - 1 1 3 42 2 7 - ES 731 - - - - - - - - - 10 - FF 282 - - - - - - - - - -
    - QC - - - - - - - - - - - 6 EXP 7 - - - - - - - - - 18 -
domain_considered_and_rejected:
  - term: physics/condensed-matter
    reason: Band structures, superconducting transition temperatures and dielectric functions are
      condensed-matter properties, but the physics family's exclusion sends a crystal or material to
      chemistry-materials whatever the method, and every ES, QC and EXP task here is a named
      material.
  - term: physics/quantum-systems
    reason: The QC category runs variational quantum eigensolvers on circuits, but the scored
      quantity is the electron band structure of aluminium from its tight-binding Hamiltonian, a
      material's property; one task of 365.
    source: src-arxiv-2306-11688-v2
    quote: Currently, we are only using statevector simulators for the quantum algorithms available
      in the Qiskit [152] library.

capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: The leaderboard's claim is that methods predict properties of materials, and every task
      compares the prediction with experiment (ES), a reference computation (AI, FF) or an
      analytical result (QC).
    source: src-arxiv-2306-11688-v2
    quote: For ES, we consider multiple ES approaches, software packages, pseudopotentials,
      materials, and properties, comparing results to experiment.
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The paper says test-only tasks such as the vacancy formation energies can check
      extrapolation, but no task is drawn from a distribution the entrants were fitted to and
      reported as a condition of its own; the entrant chooses its training data. The AI splits are
      fixed random splits.
    source: src-arxiv-2306-11688-v2
    quote: the benchmark can be used for checking extrapolation behavior such as vacancy formation
      energy benchmarks.
  - term: generation-fidelity
    reason: The AtomGen tasks score generated crystal structures against references, but the term's
      exclusion sends a predicted structure of a physical system scored against a reference to
      scientific-prediction.
  - term: knowledge-recall
    reason: The text tasks (arXiv and PubChem category classification, an MMLU quiz set) and the one
      agent task re-hosting Terminal-Bench core 0.1.1 results are a handful of 365 and are not what
      the leaderboard claims to measure.
    source: src-atomgptlab-jarvis-leaderboard-home
    quote: Terminal agents on Terminal-Bench core 0.1.1

evaluation_method:
  - statistical-fit
  - exact-match
  - reference-metric
evaluation_method_note: statistical-fit for MAE on single properties and for MULTIMAE, the L1 norm
  over spectra, forces, stresses and eigenvalues; exact-match for classification accuracy (each
  item's class is right or wrong and the score is their mean); reference-metric for ROUGE on the
  TextGen and TextSummary tasks.
evaluation_method_basis:
  reason: The paper names one metric per sub-category, and the site's example rows use MAE, ACC and
    MULTIMAE.
  source: src-arxiv-2306-11688-v2
  quote: We use mean absolute error (MAE), accuracy (acc), multi-mae (L1 norm of multi dimensional
    data), recall-oriented understudy for gisting evaluation (ROUGE)
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: The classification tasks report plain accuracy, which the term's exclusion sends to
      exact-match.
  - term: composite
    reason: No score combines tasks. The paper's MAD/MAE ratio is used to compare tasks in its
      analysis, not to rank methods.

designed_for_subjects:
  - scientific-surrogate-model
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_note: >
  scientific-surrogate-model for the learned models trained on DFT labels to stand in for DFT, the property
  models on JARVIS-DFT and the machine-learned force fields; domain-specialist-model for learned models
  whose reference is measured rather than computed (the experimental band-gap and superconductor tasks)
  and the materials text and image models; classical-algorithm for the ES methods (DFT functionals, GW,
  DMC and tight-binding codes), the classical force fields (EAM, Tersoff, REBO and others in LAMMPS) and
  the QC algorithms, none of which is learned. The EXP category's entrants are laboratories (designed_for_subjects_considered_and_rejected).
designed_for_subjects_basis:
  reason: The leaderboard ranks learned and non-learned methods on the same tasks; the paper's
    example analyses set classical potentials beside machine-learned ones and DFT functionals beside
    each other.
  source: src-arxiv-2306-11688-v2
  quote: In Fig. 6(c) we compare how several classical FFs compute the Voigt bulk modulus of Si.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: The EXP category compares laboratories' measurements of the same quantity (round-robin
      CO2 adsorption isotherms, XRD, magnetometry), but the entrant is an experiment, an instrument
      and its protocol, not a person working the task unaided beside machine entrants; no subject
      term carries a laboratory measurement (taxonomy/_failures record of 2026-11-04).
    source: src-arxiv-2306-11688-v2
    quote: Benchmarking experiments essentially boils down to the comparison of different
      experiments for the same desired result/s.
  - term: task-specific-supervised-model
    reason: The arXiv-category text classifiers and the STEM image classifiers are supervised models
      for general tasks, but on materials data and a small part of the board;
      domain-specialist-model covers them.
  - term: agent-scaffold
    reason: The one AgentTask page re-hosts Terminal-Bench core 0.1.1 results; it is not what the
      leaderboard is designed for.

as_used:
  - protocol: The leaderboard's AI single-property tasks on their fixed splits, 30 of them,
      comparing a reimplementation of ALIGNN with the original ALIGNN contribution.
    source: src-arxiv-2609-19487
    quote: On the JARVIS-Leaderboard, ALIGNN 2.0 leads on 26 of 30 single-property benchmarks
      against the original ALIGNN
    note: ALIGNN 2.0 (arXiv v1 2026-09-16) is the maintainers' own model family, so this is use by
      the maintainers, not by an independent group (governance.independence_flags).

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced and added; ALIGNN 2.0 reports new results on the
    leaderboard in September 2026, and the atomgptlab repository merged new contributions the same
    month (GitHub API).
  source: src-arxiv-2609-19487
  quote: On the JARVIS-Leaderboard, ALIGNN 2.0 leads on 26 of 30 single-property benchmarks against
    the original ALIGNN
activity: accepting-submissions
activity_basis:
  reason: Contributions are pull requests to the atomgptlab repository, open at any time.
  source: src-atomgptlab-jarvis-leaderboard-guide
  quote: Create a pull request on GitHub.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: kgcnn_coGN
    source: src-atomgptlab-jarvis-leaderboard-home
    observed_on: 2026-11-04
    quote: dft_3d_formation_energy_peratom kgcnn_coGN MAE 0.0271 kgcnn dft_3d 55713
    note: A graph neural network (the kgcnn library's coGN model), the best entry on the flagship
      formation-energy task in the site's example table.
evaluation_target: mixed
evaluation_target_note: Learned models (AI category, machine-learned force fields) are ranked beside
  numerical methods (DFT and beyond-DFT codes, classical force fields, quantum algorithms) and
  experiments; the categories keep them on separate tasks for the most part, but the ES, FF and AI
  categories share some properties and reference data.
execution_mode: automated
execution_mode_note: Scoring is automated from submitted predictions. The EXP category's
  contributions are physical measurements, made by the contributing laboratory before submission,
  which the scoring does not run.
ground_truth_source: simulation
ground_truth_source_note: >
  One value for a mixed board. Most tasks and contributions (the AI and FF categories) are scored against
  DFT, mostly JARVIS-DFT's OptB88vdW and TBmBJ calculations, so simulation. The ES category's references
  are experimental values (experimental), the QC category's are analytical or classical-solver results,
  and the EXP category's are other laboratories' measurements.
ground_truth_source_basis:
  reason: The paper states each category's reference.
  source: src-arxiv-2306-11688-v2
  quote: for force-field (FF) methods, they are electronic structure data; for quantum computation
    (QC), they are analytical results; and for experiments (EXP), they are other experiments.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The reference data, splits and scoring code are public in the repository, and
    contributions keep their predictions and run scripts there.
  source: src-arxiv-2306-11688-v2
  quote: AI benchmarks have pre-defined training/validation/test identifiers and target data in a
    corresponding json.zip file, while other methods have only reference test set for evaluation

task:
  exists: true
  input:
    - the identifiers and inputs of a task's reference set (atomic structures, molecules, spectra,
      images or text), with train and validation sets for AI tasks
  output: A csv.zip of the method's prediction for each test identifier (a value, a class, or a
    semicolon-separated array for spectra, forces and eigenvalues), with a metadata.json and, where
    possible, a run.sh.
  scoring: Per task, on the test split only, MAE (single properties), ACC (classes), MULTIMAE
    (multi-valued outputs) or ROUGE (text generation and summary); each task's table is sorted by
    its metric.
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The test targets are in the public json.zip files, so an entrant
    can compute its own score before submitting.
  source: src-arxiv-2306-11688-v2
  quote: The csv.zip file contains identifier (id) entries and corresponding prediction values
    obtained by the corresponding model/method.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The reference files are in the public repository, and the full datasets are on Figshare.
    source: src-arxiv-2306-11688-v2
    quote: To avoid storage of large files in the GitHub repo, the actual datasets are part of
      JARVIS-Tools and are stored in the Figshare repository with specific DOIs and version numbers.
  refresh: rolling-live
  refresh_note: Tasks and contributions are added continuously without a labelled leaderboard
    version (274 tasks at the paper, 322 on the frozen NIST copy, 365 today). Each underlying
    dataset has a Figshare DOI and version, so a task's data can be pinned even though the board
    cannot. A claim should name the task and the date it was read.
  refresh_basis:
    reason: The paper describes the board as growing, and the counts have changed since without a
      version label.
    source: src-atomgptlab-jarvis-leaderboard-home
    quote: 'Number of benchmarks: 365 Number of contributions: 2491 Number of datapoints: 10576297'
  data_provenance:
    - simulation-generated
    - experimental-measurement
    - inherited-from-constituents
  data_provenance_note: simulation-generated for the JARVIS-DFT tasks and the other DFT datasets;
    experimental-measurement for the ES references and the EXP category's measurements, some made at
    NIST for the leaderboard; inherited-from-constituents for the published ML datasets re-hosted as
    tasks (QM9, MEGNet's Materials Project set, OC20's IS2RE, mLEARN, MPtrj, MatPES, hMOF, PDBbind
    and others), whose own provenance applies.
  data_provenance_source: src-arxiv-2306-11688-v2
  data_provenance_quote: For atomic structure datasets, we use DFT datasets such as JARVIS-DFT[70,
    71], Materials Project (MP) [65], Tight binding three-body dataset (TB3) [94], QuantumMachine 9
    (QM9) [178, 179].
  contamination_risk: medium
  contamination_risk_note: The test targets are public, and pretrained universal force fields and
    property models are trained on large DFT collections (Materials Project, JARVIS-DFT itself) that
    can overlap the test structures. No source read checks either way, and no decontamination is
    described.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No headline metric. MAE and MULTIMAE are bounded below by 0 and ACC
    above by 1, but for the ES tasks the reference is an experimental value with its own
    uncertainty, and the paper states no floor.
  dataset_licence: null
  dataset_licence_note: The repository's NIST notice covers the software; the licences of the
    Figshare datasets and of the re-hosted third-party datasets were not read.
  size:
    - count: 365
      unit: tasks ("benchmarks"), each a reference dataset
      subset: whole leaderboard, live site (read 2026-11-04)
      source: src-atomgptlab-jarvis-leaderboard-home
      quote: 'Number of benchmarks: 365 Number of contributions: 2491 Number of datapoints: 10576297'
    - count: 2491
      unit: contributions (one method's predictions for one task)
      subset: whole leaderboard, live site (read 2026-11-04)
      source: src-atomgptlab-jarvis-leaderboard-home
      quote: 'Number of benchmarks: 365 Number of contributions: 2491 Number of datapoints: 10576297'
    - count: 322
      unit: tasks
      subset: the NIST copy, not updated since 2025
      source: src-nist-jarvis-leaderboard-home
      quote: 'Number of benchmarks: 322 Number of contributions: 2087 Number of datapoints: 8752827'
    - count: 274
      unit: tasks
      subset: at publication (paper v2, 2024-03)
      source: src-arxiv-2306-11688-v2
      quote: Presently, the leaderboard has 5 categories, 10 sub-categories, 152 methods, 274
        benchmarks, 1281 contributions and 8714228 datapoints.
    - count: 5572
      unit: test materials
      subset: AI formation energy per atom on JARVIS-DFT 3D (the flagship task)
      source: src-arxiv-2306-11688-v2
      quote: formation energy for test set with 5572 materials in JARVIS-DFT 3D dataset
  size_note: Per-category task counts from the atomgptlab repository's file tree (GitHub API,
    2026-11-04, not a Source) are AI 195 (single-property prediction 100, MLFF 42, single-property
    classification 23, AtomGen 16, text 6, spectra 3, image 1, agent 1), ES 163, FF 7, QC 1 and EXP
    10, which sum to 376 reference files against the site's 365.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: AtomGPTLab (github.com/atomgptlab), continuing the JARVIS-Leaderboard begun by NIST's
    Material Measurement Laboratory
  maintainer_basis:
    reason: The leaderboard was built and administered at NIST (the paper); in June 2025 its
      repository moved to the atomgptlab organisation, whose README says development continues there
      (history[]).
    source: src-github-atomgptlab-jarvis-leaderboard-readme
    quote: This project was originally developed under the github.com/usnistgov organization. New
      updates and developments will be carried out here.
  maintainer_type: null
  maintainer_type_note: government-agency fitted the release, when the repository and site were
    NIST's and the paper said NIST's administrators oversee the board. The current holder, the
    atomgptlab GitHub organisation ("Data-driven materials design", GitHub API), is not described by
    any Source as a public body, a laboratory or a company, while its README and site still call the
    project "a part of the NIST-JARVIS infrastructure". Left null for a reviewer (review_checks).
  submission_process: maintainer-scored-predictions
  submission_process_note: Contributors submit prediction files by pull request; the repository's
    scripts compute each task's metric from them against the public reference file when the site is
    rebuilt, after automated sanity checks and an administrator's review. The paper asks that
    contributions come from peer-reviewed work with a DOI, but as an encouragement, not a condition
    (so not publication-gated).
  submission_process_source: src-arxiv-2306-11688-v2
  submission_process_quote: The administrators of the JARVIS-Leaderboard at NIST will verify the
    contributions and then finally, it will become part of the leaderboard website.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-atomgptlab-jarvis-leaderboard-home
      quote: alignnff_mlearn_wt1 MULTIMAE 0.06942387617720659 JARVIS mlearn_Si 239
  independence_flags_note: >
    The maintainers' own team, JARVIS (now also AtomGPTLab), contributes to many tasks: the ALIGNN and
    ALIGNN-FF models (the paper: "Similarly, JARVIS-ALIGNN project contains AI models for more than 80
    properties/tasks of materials", src-arxiv-2306-11688-v2), most ES contributions, which are JARVIS-DFT's
    own calculations, and the EXP measurements made at NIST. The maintainers also choose the tasks, most
    of them from their own JARVIS-DFT database, and ALIGNN 2.0's comparison on the board (as_used) is
    theirs. The paper declares no competing interests; its funding is NIST's own CHIPS Metrology Program
    (governance.funding), not an evaluated party.
  independence_assessed: true
  funding:
    source: src-arxiv-2306-11688-v2
    quote: This work was performed with funding from the CHIPS Metrology Program, part of CHIPS for
      America, National Institute of Standards and Technology, U.S. Department of Commerce.
  known_limitation:
    source: src-arxiv-2306-11688-v2
    quote: Although a metric such as the MAE can be useful to compare methods for a specific
      benchmark, it is difficult to compare across different methods, since MAE values can differ
      substantially.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Not guessed. Scoring a contribution is trivial, but producing one ranges from a
    descriptor model on a CPU to GW or quantum Monte Carlo calculations, and no source states a
    cost.
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: For the score, which the repository computes from public reference
    files and submitted predictions. Reproducing a contribution is another matter, from a run script
    for most computational methods to a physical experiment for the EXP category.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: jarvis_leaderboard Python package (jarvis_populate_data.py to build a task's data,
    rebuild.py to score and build the site, jarvis_upload.py to submit), in
    atomgptlab/jarvis_leaderboard
  harness_source: src-arxiv-2306-11688-v2
  harness_quote: This script automatically forks the parent usnistgov/jarvis_leaderboard repo for
    the user, adds the team-name folder with its files in that forked repo, runs a few minimal
    sanity checks on the new contribution, and then makes a pull request to the parent repo.
  submission_channel:
    source: src-atomgptlab-jarvis-leaderboard-guide
    quote: Create a pull request on GitHub.
  submission_channel_note: Pull requests to atomgptlab/jarvis_leaderboard since mid-2025; before
    that to usnistgov/jarvis_leaderboard (history[]).
  code_licence: NIST software terms of use (not under US copyright; use, copying, modification and
    distribution permitted with the notice kept)
  code_licence_source: src-github-atomgptlab-jarvis-leaderboard-licence
  code_licence_quote: works of NIST_ employees are not subject to copyright protection in the United
    States.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the resolved profile, what changes a JARVIS-Leaderboard number:
  #   - the task, which names category, property, dataset and split; MAEs from different tasks cannot be set side
  #     by side (governance.known_limitation), so subset_used must carry the full task name, not the category;
  #   - what the model was trained on: pretrained universal force fields and force fields trained on the task's
  #     own split share one table (training_data_policy);
  #   - the task's data version, since the reference sets sit on Figshare with their own versions and the board is
  #     not versioned (data.refresh_note); no condition field carries a dataset version, so it goes with the
  #     claim's date.
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Every task is ranked on its own metric, and the paper says MAEs are not comparable across
    tasks; neither site publishes a cross-task score.
  source: src-arxiv-2306-11688-v2
  quote: Although a metric such as the MAE can be useful to compare methods for a specific
    benchmark, it is difficult to compare across different methods, since MAE values can differ
    substantially.
headline_metric: null

homepage: https://atomgptlab.github.io/jarvis_leaderboard/
repository: https://github.com/atomgptlab/jarvis_leaderboard
leaderboard_url: https://atomgptlab.github.io/jarvis_leaderboard/

subsets:
  - id: jarvis-leaderboard#ai
    label: Artificial intelligence (AI)
    scored_separately: true
    notes: About 195 tasks across single-property prediction, single-property classification, MLFF,
      AtomGen, spectra, image, text and agent sub-categories, and 1,437 contributions on today's
      site.
  - id: jarvis-leaderboard#ai-single-property-prediction
    label: AI single-property prediction
    parent: jarvis-leaderboard#ai
    scored_separately: true
    notes: Regression of one property per entry, scored by MAE on a fixed test split; JARVIS-DFT 3D
      and 2D, MEGNet, QM9, hMOF, OC20 IS2RE, halide perovskites, vacancy databases and others. 927
      contributions.
  - id: jarvis-leaderboard#dft-3d-formation-energy
    label: Formation energy per atom on JARVIS-DFT 3D (AI)
    parent: jarvis-leaderboard#ai-single-property-prediction
    items: 5572
    scored_separately: true
    domain_override:
      primary: chemistry-materials/crystal-stability-discovery
    evidence:
      - source: src-arxiv-2306-11688-v2
        quote: each AI model had a well-defined 80:10:10 split for training, validation and testing
          respectively from the JARVIS-3D database
      - source: src-arxiv-2306-11688-v2
        quote: Leaderboard snapshot with an example output for AI based formation energy per atom
          model on the JARVIS-DFT (dft_3d) dataset.
    notes: The paper's flagship task, with an 80:10:10 split of the dft_3d set; items is the test
      set. Scored against a computed formation energy, the stability leaf's reference, so it carries
      crystal-stability-discovery.
  - id: jarvis-leaderboard#ai-single-property-class
    label: AI single-property classification
    parent: jarvis-leaderboard#ai
    scored_separately: true
    notes: Thresholded JARVIS-DFT properties and, on today's site, bacterial phenotypes from
      BacDive, scored by accuracy.
  - id: jarvis-leaderboard#ai-mlff
    label: Machine-learned force fields (AI MLFF)
    parent: jarvis-leaderboard#ai
    scored_separately: true
    domain_override:
      primary: chemistry-materials/force-fields-potentials
    evidence:
      - source: src-arxiv-2306-11688-v2
        quote: We compare various pretrained MLFFs and other MLFFs we specifically trained on the
          MLEARN [38] dataset (PBE-based DFT data).
    notes: Energies, forces and stresses against DFT, on mLEARN's six elements, ALIGNN-FF's
      database, MPtrj, MatPES and others, scored by MAE or MULTIMAE; pretrained and task-trained
      models share each table. 303 contributions.
  - id: jarvis-leaderboard#ai-atomgen
    label: AI crystal generation (AtomGen)
    parent: jarvis-leaderboard#ai
    scored_separately: true
    notes: Reconstruction of superconductor, carbon and perovskite crystal structures; added after
      the paper.
  - id: jarvis-leaderboard#ai-other
    label: AI spectra, image, text and agent tasks
    parent: jarvis-leaderboard#ai
    scored_separately: true
    notes: Spectra (DOS, IR, dielectric), STEM image classification, arXiv and PubChem text
      classification and generation, an MMLU quiz set, and one AgentTask page re-hosting
      Terminal-Bench core 0.1.1 results.
  - id: jarvis-leaderboard#es
    label: Electronic structure (ES)
    scored_separately: true
    evidence:
      - source: src-arxiv-2306-11688-v2
        quote: Typically, for electronic structure (ES) method based contributions, the benchmarks
          are experimental data
    notes: DFT functionals and codes (VASP, Quantum ESPRESSO, ABINIT, GPAW), GW, DMC and
      tight-binding methods scored against experimental values, mostly one task per material and
      property (band gaps, bulk moduli, dielectric constants, piezoelectric coefficients,
      superconducting Tc), plus dielectric-function spectra. 741 contributions. No
      chemistry-materials leaf takes electronic-structure method validation.
  - id: jarvis-leaderboard#ff
    label: Classical force fields (FF)
    scored_separately: true
    domain_override:
      primary: chemistry-materials/force-fields-potentials
    notes: Classical interatomic potentials (EAM, Tersoff, REBO and others in LAMMPS) on the bulk
      moduli of Si, Al and Cu, peptide free energies and populations in GROMACS, and a 2D
      Lennard-Jones liquid's viscosity. 282 contributions.
  - id: jarvis-leaderboard#qc
    label: Quantum computation (QC)
    scored_separately: true
    notes: One task, aluminium's electron band structure from a tight-binding Hamiltonian, by VQE
      and VQD with several circuits on statevector simulators; 6 contributions.
  - id: jarvis-leaderboard#exp
    label: Experiments (EXP)
    scored_separately: true
    evidence:
      - source: src-arxiv-2306-11688-v2
        quote: Specifically in the JARVIS-Leaderboard, we include experimental round-robin results
          for manometric measurements of CO2 adsorption [157].
    notes: Inter-laboratory measurements (CO2 adsorption on ZSM-5, XRD of MgB2, Kevlar
      stress-strain, superconducting Tc of seven materials), scored against other laboratories' or
      reference measurements.
subsets_note: The five categories and their sub-categories, not the 365 tasks; a claim names its
  task in subset_used. The per-category contribution counts are from the summary table on today's
  site (src-atomgptlab-jarvis-leaderboard-home); the task counts are from the repository tree
  (data.size_note).

lineage:
  role: root
lineage_note: The atomgptlab repository is the same project continued, not a fork (it carries the
  usnistgov history, is not a GitHub fork, and its README says development moved there), so the NIST
  copy is not a separate entry and lineage is root. Several tasks re-host data of benchmarks
  catalogued elsewhere (OC20's IS2RE as ocp10k, ocp100k and ocp_all; QM9; Terminal-Bench core 0.1.1
  results); whether those are forks or views of oc20 and terminal-bench is a review check.


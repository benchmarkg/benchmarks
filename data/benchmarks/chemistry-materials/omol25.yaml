  form does not offer. The board shows the label beside each row but does not rank the tiers apart.
  The rules are this entry's reading of the labels; the form names them without defining them.
training_data_eligibility_tiers_basis:
  reason: The training set is a required field of every submission, with these five choices.
  source: src-hf-fairchem-leaderboard-config
  quote: '"choices":[["OMol-140M","OMol-140M"],["OMol-102M","OMol-102M"],["OMol-4M","OMol-4M"],["UMA-459M","UMA-459M"],["Other","Other"]]'

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Meta FAIR (the FAIR Chemistry team)
  maintainer_basis:
    reason: Meta FAIR released the dataset, holds it in the facebook organisation on Hugging Face,
      keeps the code in facebookresearch/fairchem and runs the board. Co-authors from other
      institutions (among them Lawrence Berkeley National Laboratory) do not change the holder.
    source: src-arxiv-2505-08762-v2
    quote: Meta FAIR introduces Open Molecules 2025 (OMol25)
  maintainer_type: industry-lab
  submission_process:
    - held-out-server
    - maintainer-scored-predictions
  submission_process_note: Entrants sign in with Hugging Face, fill in a form (model, organisation,
    training set, contact) and upload a prediction file for one evaluation type; the board scores it
    and posts the row. Test predictions are scored against withheld labels (held-out-server). The
    board also takes Validation predictions, whose labels are public
    (maintainer-scored-predictions). For the seven evaluations the sources read do not say whether
    the reference values are released.
  submission_process_source: src-hf-fairchem-leaderboard-config
  submission_process_quote: '["Validation","Validation"],["Test","Test"],["Ligand pocket","Ligand pocket"]'
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-hf-fairchem-leaderboard-config
      quote: '"Meta",true,"UMA-520M",66.60352850079563'
    - flag: single-evaluator-private-test-set
      source: src-fairchem-omol-leaderboard-docs
      quote: Validation labels are already accessible in the released dataset for local benchmarking
        and debugging, so we highly encourage users to make Test submissions to fairly and
        accurately compare models.
  independence_flags_note: Most rows are Meta's own potentials (UMA, eSEN, GemNet-OC, and AllScAIP
    with UC Berkeley), several of them at the top of their tables, beside entries from
    MACE-Cambridge, COSMO (EPFL), JSR Corporation and independent submitters. Meta also holds the
    test labels and computes every test score. Scoring is programmatic, so no grader has a stake.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Not guessed. The docs warn that the S2EF example and four of the evaluations
    are slow on one GPU and leave parallelising to the entrant ("The above example can be very slow
    on a single GPU and we encourage users to parallelize this however they like."), but no source
    states what a run needs, and it varies with the potential.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The test scores, the board's headline numbers, can be produced only by the maintainers'
      board, which holds the labels. Validation scores can be computed by anyone.
    source: src-fairchem-omol-leaderboard-docs
    quote: Validation labels are already accessible in the released dataset for local benchmarking
      and debugging, so we highly encourage users to make Test submissions to fairly and accurately
      compare models.
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness_availability_note: fairchem's recipes write the prediction files and the board computes
    the official scores against labels only it holds. The Space publishes an evaluator.py beside its
    app, which was not read; without the labels it cannot produce a test score.
  harness: fairchem-core (the OMol recipes in fairchem.core.components.calculate.recipes.omol) with
    fairchem-data-omol
  harness_source: src-fairchem-omol-leaderboard-docs
  harness_quote: To generate prediction files for the different tasks, we have released a set of
    recipes to be used with ASE-compatible calculators.
  submission_channel:
    source: src-hf-fairchem-leaderboard-config
    quote: Results will appear on the leaderboard after successful validation
  submission_channel_note: The FAIR Chemistry leaderboard Space on Hugging Face
    (facebook/fairchem_leaderboard), shared with OC20; its content.py links the documentation at
    fair-chem.github.io, which now redirects to facebookresearch.github.io/fairchem.
  code_licence: MIT
  code_licence_source: src-github-fairchem-readme
  code_licence_quote: '`fairchem` is available under a [MIT License](LICENSE.md).'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the surrogate-fit profile (subset_used, training_data_policy), four things change an OMol25 number,
  # and none is a per-claim condition field of its own:
  #   - the release: OMol-0 and OMol-1 share the composition test split (2,805,046 structures in both paper
  #     versions), but the M-Lig and COD OOD splits grew between them, so OOD-split numbers need the version;
  #   - the unit and the energy normalisation: the board reports meV, the paper's v1 meV and v2 kcal/mol, and
  #     the paper calls per-atom MAE primary while its Table 3 and the board report energy MAE without saying
  #     per atom (see review_checks);
  #   - the training set, which training_data_policy and the board's training-set label carry;
  #   - the reference: every OMol25 label is ωB97M-V/def2-TZVPD from ORCA 6.0.0 (ground_truth_source_note).
  #     That is fixed inside the benchmark, so it is not listed as material; it bites only when an OMol25
  #     number is set beside one scored against another reference, such as SPICE's labels or the CCSD(T)/CBS
  #     Wiggle150 set in the paper's appendix.
  material_extra: []

aggregation_policy: official-aggregate
aggregation_policy_note: The board's Overview orders models by average rank across the seven
  evaluations and shows no rank figure; the S2EF tables and each evaluation tab rank by their own
  MAE. The paper reports no aggregate.
aggregation_policy_basis:
  reason: The maintainers' board publishes the Overview ordering as its summary view.
  source: src-hf-fairchem-leaderboard-config
  quote: Overview rankings based on average rank across all evaluations
headline_metric: null

homepage: https://facebookresearch.github.io/fairchem/omol/
repository: https://github.com/facebookresearch/fairchem
dataset_url: https://huggingface.co/facebook/OMol25
leaderboard_url: https://huggingface.co/spaces/facebook/fairchem_leaderboard

versions:
  - version: omol-0
    label: OMol-0, the pre-release
    version_kind: revision
    released: 2025-05-13
    changes: About 100 million DFT calculations, released with v1 of the paper; the board's
      OMol-102M training set. Models trained on it are still ranked.
    breaking: true
    superseded_by: omol-1
    frozen: true

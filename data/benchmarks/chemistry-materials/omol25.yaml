      subset: OOD test split Anions (new anions)
      source: src-arxiv-2505-08762-v2
      quote: 2,805,046 42,028 26,614 64,898 84,807 16,488
  size_note: Each evaluation task is run on at least 1,000 structures ("Each task is carried out on
    at least 1,000 different structures to achieve robust statistics", src-arxiv-2505-08762-v2). The
    v1 figures for M-Lig and COD are from src-arxiv-2505-08762-v1 ("2,805,046 39,615 26,614 64,898
    76,156 16,488").
  submission_limit:
    max_submissions: 5
    period_days: 30
    per: user, per evaluation type (successful submissions; the board says per month)
    source: src-hf-fairchem-leaderboard-config


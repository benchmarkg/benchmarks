subsets:
  - id: opendac#s2ef
    label: S2EF, structure to energy and forces (ODAC23 and ODAC25)
    scored_separately: true
    notes: The task both editions score. ODAC23 reports it on test-id and the four OOD splits, and
      on OMS and defective subsets; ODAC25 on its filtered test set, overall and per adsorbate (CO2,
      H2O, CO2+H2O, N2, O2).
  - id: opendac#is2re
    label: IS2RE, initial structure to relaxed energy (ODAC23)
    scored_separately: true
    notes: By direct prediction or by relaxation with an S2EF model; energy MAE and EwT.
  - id: opendac#is2rs
    label: IS2RS, initial structure to relaxed structure (ODAC23)
    scored_separately: true
    notes: ADwT, FbT and AFbT; the DFT-based metrics were computed on 500 structures per test split.
  - id: opendac#test-id
    label: ODAC23 test-id (in-domain)
    scored_separately: true
    notes: Sizes in data.size.
  - id: opendac#test-ood
    label: 'ODAC23 out-of-domain test splits: big, linker, topology, linker and topology'
    scored_separately: true
    notes: Each reported separately; sizes in data.size.
  - id: opendac#henry-coefficients
    label: ODAC25 Henry's coefficients (CO2, N2) against experiment
    scored_separately: true
    notes: Widom insertion with the potential in rigid MOFs, scored by MAE in eV against
      experimental coefficients, with UFF as the classical baseline.
  - id: opendac#mof-deformation
    label: ODAC25 adsorption in deformable MOFs (59 MOFs)
    scored_separately: true
    notes: MAEs of adsorption, interaction and MOF deformation energies against the DFT of Brabson
      et al., with R2 and a deformation classification.

lineage:
  role: root
lineage_note: OC20 is not linked as a parent. ODAC was built by the same FAIR Chemistry group and
  reuses OC20's three task definitions and its metrics ("We use the same three task definitions used
  in the OC20 work.", src-arxiv-2311-00341-v2), but it scores a different subject on its own items,
  co-maintained with Georgia Tech, versioned (ODAC23, ODAC25) and cited apart from OC20. 04 S4 makes
  a separately versioned and cited derivative a new benchmark, and Variant is for a subset, filtered
  subset or extension of the parent's items, which ODAC is not; so it is a root. OMol25 shares the
  maintainer and nothing else.


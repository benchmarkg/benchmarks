# data/benchmarks/chemistry-materials/opendac.yaml
#
# P1-S6-T02, chemistry-materials entry 20. Filled from the ODAC23 paper, arXiv 2311.00341 read as its v2 PDF
# (2023-11-27) and its abstract page; the ODAC25 paper, arXiv 2508.03162 read as its v2 PDF (2025-09-23) and
# its abstract page; the fairchem documentation pages for ODAC23 and ODAC25 and the documentation's leaderboard
# index, read raw at pinned commits; Hugging Face's public API record of facebook/ODAC25, a gated model
# repository that holds the dataset card (api/datasets/facebook/ODAC25 returns 401; the gate's terms were not
# accepted); the fairchem README at main (an existing Source, for the code licence); and the v2 PDF of the
# AtomMOF paper (arXiv 2602.07351, KAIST, October 2026), a third-party paper that uses ODAC25. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.
#
# Identity. ODAC23 and ODAC25 are one family, the Open DAC datasets, released by the same FAIR Chemistry and
# Georgia Tech team on the same task, with new items and a new year: two editions (04 S4). The family shares a
# maintainer with OC20 and OMol25 and took OC20's task definitions and metrics, but its subject (adsorption of
# CO2, H2O, N2 and O2 in metal-organic frameworks), its items, its versions and its citations are its own, so
# it is a root of its own and not a variant of oc20; see lineage_note and the review check.
#
# The ODAC23 website named in the paper (open-dac.github.io) is gone; the data and docs now live in fairchem.

id: opendac
name: Open DAC (ODAC23, ODAC25)
aliases:
  - OpenDAC
  - Open DAC
  - ODAC
  - ODAC23
  - ODAC25
  - Open DAC 2023
  - Open DAC 2025
  - Open Direct Air Capture
tagline: ML interatomic potentials scored against DFT on CO2, H2O, N2 and O2 adsorbed in
  metal-organic frameworks.
description: >
  The Open DAC datasets are DFT calculations (VASP, PBE with D3 dispersion) of small molecules
  adsorbed in metal-organic frameworks, built to train and score machine-learned interatomic
  potentials for screening direct-air-capture sorbents. ODAC23 holds about 39 million single
  points from 176,032 relaxations of CO2, H2O and their mixtures in 8,412 pristine and defective
  MOFs from CoRE MOF 2019, with OC20's three tasks (energy and forces from a structure, S2EF; the
  relaxed energy, IS2RE; and the relaxed structure, IS2RS), an in-domain test split and four
  out-of-domain ones (large MOFs, unseen linkers, unseen topologies, both). ODAC25 extends it to
  nearly 60 million single points in about 15,000 MOFs, adds N2 and O2, functionalized and
  generated frameworks and GCMC configurations, corrects ODAC23's k-point errors and its empty-MOF
  reference energies, and scores S2EF energies and forces, Henry's coefficients from Widom insertion
  against experiment, and adsorption energies in deformable MOFs. Scores are mean absolute errors,
  with threshold metrics for ODAC23. There is no leaderboard; the maintainers report in their
  papers and others in theirs.
self_description:
  source: src-arxiv-2311-00341-v2
  quote: In addition, the work provides a benchmark for state-of-the-art ML models for CO2 and H2O
    adsorption in MOFs.
external_ids:
  arxiv: '2311.00341'
paper:
  title: The Open DAC 2023 Dataset and Challenges for Sorbent Discovery in Direct Air Capture
  arxiv: '2311.00341'
  doi: 10.1021/acscentsci.3c01629
  version_read: v2
  source: src-arxiv-2311-00341-v2
paper_note: Published in ACS Central Science 10 (2024) 923-941, whose DOI is paper.doi as the ODAC25
  paper cites it (src-arxiv-2508-03162-v2); the journal version was not read. The ODAC25 paper is
  arXiv 2508.03162 (src-arxiv-2508-03162-v2).
released: 2023-11-01
released_note: The ODAC23 paper's first arXiv version, as its abstract page dates it. ODAC25
  followed on 2025-08-05 (see versions).
released_source: src-arxiv-2311-00341
released_quote: Submitted on 1 Nov 2023

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/force-fields-potentials
domain_basis:
  reason: The task both editions score first, S2EF, asks a learned potential for the energy and
    per-atom forces of a MOF with its adsorbates, against DFT; the papers call it training and
    evaluating a force field. Henry's coefficients and deformation energies are computed with the
    same potential. The subject is a material and its adsorbates, so the physics family's exclusion
    sends it here whatever the method.
  source: src-arxiv-2311-00341-v2
  quote: This task is analogous to training a force field for all atoms in the system.
domain_considered_and_rejected:
  - term: chemistry-materials/catalysis
    reason: ODAC copies the Open Catalyst tasks and scores adsorption energies, but on porous
      sorbents for gas capture, not on catalyst surfaces, and no activity or barrier is predicted.
      The leaf's definition names catalyst surfaces.
    source: src-arxiv-2311-00341-v2
    quote: similar to previous work in heterogeneous catalysis (OC20 and OC22)
  - term: earth-climate/energy-systems
    reason: Direct air capture is the motivation, but nothing scored is an energy system's
      generation, demand or operation; the scored quantity is a property of a MOF with adsorbates.
  - term: physics/simulation-surrogates
    reason: The entrants are surrogates for DFT, but the physics family's exclusion sends a
      benchmark whose system is a material to chemistry-materials even when the method is physics.
capability:
  - scientific-prediction
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: Entrants predict energies, forces, relaxed structures and Henry's coefficients of
      MOF-adsorbate systems, and every score compares them with a reference, DFT or measured
      isotherms.
    source: src-arxiv-2311-00341-v2
    quote: The ground truth targets of forces, energies, and relaxed structures were all calculated
      using DFT.
  distribution-shift-generalization:
    reason: ODAC23 builds four test splits on purpose from what training lacks (MOFs over 500 atoms,
      unseen linkers, unseen topologies, and both) and reports each as its own condition with the
      task unchanged. The ODAC25 paper reports no OOD split of its own; it reports per adsorbate,
      including N2 and O2 that some compared models were not trained on (see review_checks).
    source: src-arxiv-2311-00341-v2
    quote: Four out-of-domain (ood) sets are included.
capability_considered_and_rejected:
  - term: generation-fidelity
    reason: IS2RS scores a predicted relaxed structure, but the term's exclusion sends a predicted
      structure of a physical system scored against reference computation to scientific-prediction.
    source: src-arxiv-2311-00341-v2
    quote: This task is analogous to geometry optimization.

evaluation_method:
  - statistical-fit
evaluation_method_basis:
  reason: The current edition reports only error statistics over all predictions, the MAE of total
    and adsorption energies and of forces, and the MAE of Henry's coefficients (in energy units)
    against experiment.
  source: src-arxiv-2508-03162-v2
  quote: Model Training Set EMAE-Tot EMAE FMAE
evaluation_method_considered_and_rejected:
  - term: numeric-tolerance-match
    reason: ODAC23 also reports OC20's threshold metrics (EwT, EFwT, ADwT, FbT, AFbT), which count a
      prediction right inside a fixed tolerance of DFT. The ODAC25 paper, the current edition, drops
      them and reports MAEs only, so they are kept as ODAC23 metrics rather than a family facet.
    source: src-arxiv-2311-00341-v2
    quote: 'Energy within Threshold (EwT): The fraction of energies within 0.02 eV of the DFT relaxed
      energy.'
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants are machine-learned interatomic potentials that stand in for DFT (and for
    classical force fields in screening) and are scored against what DFT computed.
  source: src-arxiv-2508-03162-v2
  quote: This is analogous to evaluating a force field.

as_used:
  - protocol: A generative model of MOF-adsorbate structures trained on local-minimum configurations
      from the filtered ODAC25 trajectories, with the ODAC25 validation split used as the test set
      and part of training held out for validation; generated configurations are relaxed and scored
      with the maintainers' eSEN-ODAC25-Full potential.
    split: val
    source: src-arxiv-2602-07351-v2
    quote: Since the official test set is unavailable, we use the validation split for testing
    note: AtomMOF (KAIST, arXiv v2 2026-10-23). It uses ODAC25 for structure prediction, not for
      S2EF, and reports no S2EF score; it also uses a third-party potential with an ODAC23 task head
      ("SevenNet-Omni with task odac23").

lifecycle: active
lifecycle_basis:
  reason: The family is in use through its current edition. The maintainers point new work to ODAC25
    and trained their UMA models on part of it, and a third-party paper revised in October 2026
    trains and evaluates on ODAC25. ODAC23 is deprecated in the maintainers' docs, which is a
    version's standing, not the family's.
  source: src-arxiv-2602-07351-v2
  quote: We evaluate AtomMOF on ODAC25 through two questions.
activity: no-submission-channel
activity_note: The ODAC23 paper's title says Challenges, after OC20's, but none of the sources
  describes a challenge round, a server or a leaderboard for ODAC; the website the paper names
  (open-dac.github.io) answered 404 on 2026-11-04 (curation.unreachable).
activity_basis:
  reason: ODAC is download-and-run. The FAIR Chemistry leaderboard, the maintainers' only board,
    lists OMol25 and OC20 and not ODAC, and results appear in the maintainers' and others' papers.
  source: src-github-fairchem-leaderboard-index
  quote: 'The leaderboard currently supports the following datasets:'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: eSEN (ODAC25-Full and ODAC25-Filtered)
    source: src-arxiv-2508-03162-v2
    observed_on: 2026-11-04
    quote: The eSEN models trained on the filtered and full ODAC25 datasets achieve the best overall
      results
    note: The ODAC23 paper's entrants were six graph neural networks, EquiformerV2 (large) the best
      ("EquiformerV2 (large) achieved the best results for both forces and energies",
      src-arxiv-2311-00341-v2).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Every S2EF, IS2RE and IS2RS label is a VASP calculation with PBE and the
  D3 dispersion correction, spin-polarised, without a Hubbard U. ODAC25 used VASP 6.3 with a 600 eV
  cutoff, corrected ODAC23's 1x1x1 k-point energies, and references adsorption energies to the
  lowest-energy re-relaxed empty MOF, so ODAC23 and ODAC25 adsorption energies are different
  quantities (see versions). The ODAC25 Henry's-coefficient evaluation is scored against
  experimental coefficients fitted from published isotherms ("which were extracted by fitting the
  first two data points of the published isotherms to a line passing through the origin",
  src-arxiv-2508-03162-v2), a second ground truth for that subset only.
ground_truth_source_basis:
  reason: The ODAC25 paper names the code and the functional for every calculation in the dataset.
  source: src-arxiv-2508-03162-v2
  quote: with the PBE exchange-correlation functional and D3 van der Waals correction
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The ODAC23 splits, test sets included, are public downloads, and the ODAC25 data and
    models are released behind a gate, with the training code in fairchem; anyone can train and
    score a potential. Whether the ODAC25 test set is among the released files is open (see
    data.access).
  source: src-github-fairchem-odac23-docs
  quote: We provide precomputed LMDBs for train, validation, and the various test sets that can be
    used directly with the dataloaders provided in our code.

task:
  exists: true
  input:
    - 'a periodic unit cell of a MOF with one or more adsorbates (CO2, H2O, N2, O2): element types and
      3D positions (S2EF), or an initial placement (IS2RE, IS2RS)'
    - for the ODAC25 Henry's-coefficient evaluation, rigid MOF structures into which the potential's
      Widom insertion places CO2 or N2
  output: The total or adsorption energy and per-atom forces (S2EF), the relaxed adsorption energy
    (IS2RE) or the relaxed atom positions (IS2RS); for ODAC25's evaluations, Henry's coefficients
    and adsorption, interaction and deformation energies computed with the potential.
  scoring: MAE of energies and forces against DFT, overall, per split and per adsorbate; for ODAC23
    also force cosine and the threshold metrics EwT, EFwT, ADwT, FbT and AFbT (FbT and AFbT need a
    new DFT single point on each predicted structure); for ODAC25's Henry evaluation, the MAE in eV
    against experimental coefficients.
  source: src-arxiv-2311-00341-v2
  quote: In each task, the input structure is a unit cell periodic in all directions containing a
    MOF with one or more adsorbates.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The current edition decides (the vocabulary's rule for a family whose editions are
    distributed differently), and the editions differ. ODAC23's train, validation and all five test
    splits, labels included, download from dl.fbaipublicfiles.com without an account ("Train +
    Validation + Test (all splits)", src-github-fairchem-odac23-docs), which is fully-open. ODAC25's
    paper says the full dataset is public on Hugging Face, behind a manual gate (identity fields, an
    acknowledgement of the licences, and geographic exclusions; src-hf-api-odac25, "except in
    comprehensively sanctioned jurisdictions, and in China, Russia, and Belarus."), but a
    third-party paper says its official test set is unavailable, and the paper's headline table is
    computed on that test set. No server scores it, so its scores come only from the maintainers.
    The gated DATASET.md, which would list the released splits, was not read. If it lists the test
    split, gated-registration fits.
  access_basis:
    reason: The ODAC25 test set behind the current edition's headline is, by the only source that
      says, not released, and only the maintainers compute scores on it.
    source: src-arxiv-2602-07351-v2
    quote: Since the official test set is unavailable, we use the validation split for testing
  refresh: versioned-releases
  refresh_basis:
    reason: The data changed once, from ODAC23 to ODAC25, which added items and recomputed or
      corrected old ones, and the two are named and cited apart.
    source: src-arxiv-2508-03162-v2
    quote: a significant expansion and improvement upon ODAC23
  data_provenance:
    - simulation-generated
  data_provenance_note: Every label is a new DFT calculation. The frameworks come from CoRE MOF 2019
    (experimental structures), the ultrastable MOFs of Nandy et al., the maintainers' own
    functionalisation, and 460 frameworks generated by CuspAI's model; adsorbate placements come
    from classical force fields and Monte Carlo, and ODAC25 adds GCMC snapshots. The Henry
    evaluation's experimental coefficients come from a published curated dataset of isotherms.
    curated-public-database was not assigned, as the MOF databases supply structures only.
  data_provenance_source: src-arxiv-2311-00341-v2
  data_provenance_quote: All calculations were performed using DFT with the PBE+D3 exchange
    correlation functional
  contamination_risk: unknown
  contamination_risk_note: Not assessed. ODAC23's test splits are public with labels, and ODAC25
    recomputed and corrected ODAC23's calculations into its own data; whether ODAC23 test systems
    sit in ODAC25's training split, or in the mixes that UMA and other universal potentials train
    on, was not read. The ODAC25 test labels are not public by the one source that says.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Zero error against the DFT labels is the bound. A perfect score
    reproduces PBE-D3 at the dataset's settings, which the maintainers chose for consistency over
    absolute accuracy. For the Henry evaluation the ODAC25 paper reads errors against the spread of
    repeated experiments ("The average spread is 0.016 and 0.009 eV for CO2 and N2",
    src-arxiv-2508-03162-v2), an experimental-replicate anchor for that subset only.
  ceiling_anchor_type_source: src-arxiv-2311-00341-v2
  ceiling_anchor_type_quote: we prioritized consistency across a very large number of calculations
    rather than absolute accuracy
  ceiling_by_category:
    - category: ODAC25 Henry's coefficients, CO2 (spread of repeated experiments at 298 K)
      value: 0.016
      metric: MAE (eV)
      source: src-arxiv-2508-03162-v2
      quote: The average spread is 0.016 and 0.009 eV for CO2 and N2
    - category: ODAC25 Henry's coefficients, N2 (spread of repeated experiments at 298 K)
      value: 0.009
      metric: MAE (eV)
      source: src-arxiv-2508-03162-v2
      quote: The average spread is 0.016 and 0.009 eV for CO2 and N2
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The ODAC25 models in the same repository are under the FAIR Chemistry
    License with an acceptable use policy. The fairchem docs give CC BY 4.0 for ODAC23 too
    (src-github-fairchem-odac23-docs). The AtomMOF paper says instead that ODAC25 uses the FAIR
    Chemistry License v1 ("ODAC25 uses the FAIR Chemistry License v1", src-arxiv-2602-07351-v2),
    which looks like the models' licence read as the data's; see review_checks.
  dataset_licence_source: src-hf-api-odac25
  dataset_licence_quote: The ODAC25 dataset is provided under a CC-BY-4.0 License.
  size:
    - count: 38983748
      unit: DFT single points
      subset: ODAC23, all splits (8,412 MOFs, 176,032 relaxations)
      source: src-arxiv-2311-00341-v2
      quote: Total 4,942 3,470 8,412 176,032 38,983,748
    - count: 973515
      unit: DFT single points
      subset: ODAC23 test-id (S2EF)
      source: src-arxiv-2311-00341-v2
      quote: 35,871,295 839,565 973,515 381,219 287,125 472,256 158,773
    - count: 381219
      unit: DFT single points
      subset: ODAC23 test-ood (big), MOFs over 500 atoms (S2EF)
      source: src-arxiv-2311-00341-v2
      quote: 35,871,295 839,565 973,515 381,219 287,125 472,256 158,773
    - count: 287125
      unit: DFT single points
      subset: ODAC23 test-ood (linker) (S2EF)
      source: src-arxiv-2311-00341-v2
      quote: 35,871,295 839,565 973,515 381,219 287,125 472,256 158,773
    - count: 472256
      unit: DFT single points
      subset: ODAC23 test-ood (topology) (S2EF)
      source: src-arxiv-2311-00341-v2
      quote: 35,871,295 839,565 973,515 381,219 287,125 472,256 158,773
    - count: 158773
      unit: DFT single points
      subset: ODAC23 test-ood (linker and topology) (S2EF)
      source: src-arxiv-2311-00341-v2
      quote: 35,871,295 839,565 973,515 381,219 287,125 472,256 158,773
    - count: 4669
      unit: DFT relaxations
      subset: ODAC23 test-id (IS2RE, IS2RS); 1,768, 1,182, 1,612 and 579 in the four OOD splits
      source: src-arxiv-2311-00341-v2
      quote: 162,224 3,998 4,669 1,768 1,182 1,612 579
    - count: 59
      unit: MOFs (CO2 and H2O adsorption)
      subset: ODAC25 deformable-MOF evaluation, from Brabson et al.
      source: src-arxiv-2508-03162-v2
      quote: We benchmarked the ODAC25 eSEN models using the formalism and dataset of CO2 and H2O
        adsorption in 59 MOFs presented in that work.
  size_note: ODAC25 is given only in round figures, nearly 60 million single points in 15,000 MOFs
    in its paper ("comprising nearly 60 million DFT single-point calculations for CO2, H2O, N2, and
    O2 adsorption in 15,000 MOFs", src-arxiv-2508-03162-v2) and nearly 70 million in nearly 15,000
    MOFs in the fairchem docs ("contains nearly 70 million DFT single-point calculations for CO2,
    H2O, N2, and O2 adsorption in nearly 15,000 metal-organic frameworks",
    src-github-fairchem-odac25-docs); the sources read give no ODAC25 split sizes, and none gives
    the number of MOFs in the Henry evaluation.
training_data_eligibility_tiers_note: None recorded. ODAC has no board and no rule that splits
  entrants by training data. The ODAC25 paper's tables label each model with its training set
  (ODAC23, MPtraj, MPtraj with GoldDAC, a subset of ODAC25 with other datasets, ODAC25-Full,
  ODAC25-Filtered), which is a claim's training_data_policy, material under the surrogate-fit
  profile, and not a tier.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Meta FAIR (the FAIR Chemistry team), with Georgia Tech's School of Chemical and
    Biomolecular Engineering
  maintainer_basis:
    reason: Meta FAIR and Georgia Tech wrote both editions (ODAC25 with Oak Ridge, CuspAI and
      Carnegie Mellon co-authors). Meta holds the data and models in the facebook organisation on
      Hugging Face and the code and docs in facebookresearch/fairchem, which makes it the holder.
    source: src-github-fairchem-odac25-docs
    quote: All information about the dataset is available at the [ODAC25 Huggingface
      site](https://huggingface.co/facebook/ODAC25).
  maintainer_type: industry-lab
  maintainer_type_note: The holder of the data, the models and the code is Meta; Georgia Tech is a
    co-author institution.
  submission_process:
    - literature-only
  submission_process_note: No board or results page; the maintainers' papers report their baselines
    and others report in their own papers.
  submission_process_source: src-github-fairchem-leaderboard-index
  submission_process_quote: 'The leaderboard currently supports the following datasets:'
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2508-03162-v2
      quote: The eSEN models trained on the filtered and full ODAC25 datasets achieve the best
        overall results
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2602-07351-v2
      quote: Since the official test set is unavailable, we use the validation split for testing
  independence_flags_note: Both papers rank the maintainers' own potentials (ODAC23's EquiformerV2,
    ODAC25's eSEN and UMA) best against outside ones (MACE, MACE-DAC). The second flag stands or
    falls with data.access; if the ODAC25 test set is released behind the gate, it goes. Scoring is
    programmatic.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Not guessed. Scoring S2EF needs only inference over the test structures, but
    IS2RS's FbT and AFbT need a new DFT single point per predicted structure ("Note that a new
    single point DFT calculation is required to evaluate FbT and AFbT on a given data point.",
    src-arxiv-2311-00341-v2), and no source states what a run needs.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The current edition's headline test scores can be produced only by the maintainers if
      the ODAC25 test set is unreleased, as the only source that says reports. ODAC23's test splits
      are public, so its numbers are reproducible by anyone.
    source: src-arxiv-2602-07351-v2
    quote: Since the official test set is unavailable, we use the validation split for testing
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness_availability_note: fairchem holds the training code, the ODAC23 configs and checkpoints
    and the dataloaders, and the metric code it shares with OC20; no ODAC-specific official scorer
    or leaderboard evaluator was found.
  harness: fairchem (fairchem-core, with fairchem-data-odac)
  harness_source: src-arxiv-2311-00341-v2
  harness_quote: All of our trained ML models and training code are available in the OCP repository
  code_licence: MIT
  code_licence_source: src-github-fairchem-readme
  code_licence_quote: '`fairchem` is available under a [MIT License](LICENSE.md).'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the surrogate-fit profile (subset_used, training_data_policy), three things change an ODAC number,
  # and none is a per-claim condition field of its own:
  #   - the edition: ODAC23 and ODAC25 adsorption energies use different empty-MOF references and k-point
  #     treatments, and ODAC25 corrects ODAC23's, so the two are not on one axis (versions, breaking);
  #   - the energy target: ODAC23 models predict the adsorption energy directly, ODAC25 models the total DFT
  #     energy, from which the adsorption energy is derived; the ODAC25 tables report both MAEs;
  #   - the filtered or full ODAC25 data (MOFs flagged by MOFChecker kept or dropped), for training and for
  #     the test set; the paper's Table 1 is on the filtered test set. subset_used and training_data_policy
  #     carry it when a claim states it.
  material_extra: []
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each task, split and adsorbate is reported as its own error, energy and force MAEs side by
    side, and neither paper combines them into one number.
  source: src-arxiv-2508-03162-v2
  quote: Model Training Set EMAE-Tot EMAE FMAE
headline_metric: null

homepage: https://facebookresearch.github.io/fairchem/odac25
repository: https://github.com/facebookresearch/fairchem
dataset_url: https://huggingface.co/facebook/ODAC25
leaderboard_url: null

versions:
  - version: odac23
    label: ODAC23 (Open DAC 2023)
    version_kind: edition
    released: 2023-11-01
    changes: CO2, H2O and their mixtures in 8,412 pristine and defective CoRE MOF 2019 frameworks,
      about 39 million single points; S2EF, IS2RE and IS2RS on an in-domain and four out-of-domain
      test splits, all public. Deprecated in the fairchem docs, which recommend ODAC25.
    breaking: true
    superseded_by: odac25
    errata:
      - date: 2025-08-05
        scope: adsorption energies, all ODAC23 calculations
        description: The ODAC25 paper found that about 7% of ODAC23 calculations carry systematic
          k-point errors over 0.2 eV, and that many empty-MOF reference energies were not the lowest
          the dataset reached; it corrected both and says its adsorption energies supersede
          ODAC23's.
        source: src-arxiv-2508-03162-v2
      - date: 2025-08-05
        scope: MOF structures
        description: Outside groups reported structural errors in ODAC23's MOFs (oxidation states,
          net charges); ODAC25 ran MOFChecker on all structures and offers filtered and full
          versions, keeping the flagged MOFs in the full one.
        source: src-arxiv-2508-03162-v2
    frozen: true
    sources:
      - src-arxiv-2311-00341-v2
      - src-arxiv-2311-00341
      - src-github-fairchem-odac23-docs
  - version: odac25

curation:
  added_by: agent (P1-S6-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1703-00564-v3
    - src-arxiv-1703-00564
    - src-arxiv-1703-00564-v1
    - src-arxiv-1703-00564-v2
    - src-crossref-10-1039-c7sc02664a
    - src-deepchem-moleculenet-docs
    - src-github-moleculenet-readme
    - src-arxiv-2603-25857
    - src-arxiv-2511-14744
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, with windows that keep the authors' contact
    line out, and its v1 and v2 PDFs for the versions; its abstract page for the dates; Crossref's JSON
    record of the journal article for the venue (the publisher's page answered 403), with windows that
    keep the authors' ORCIDs out; the DeepChem documentation's MoleculeNet page with scripts and styles
    stripped; the deepchem/moleculenet README at master, whose rows carry contributors' e-mail
    addresses, so it is withheld from archiving; and two abstract pages, a 2026 LLM study as evidence
    of current use and a 2025 Tox21 paper.
  confidence: medium
  review_checks:
    - check: One entry with the paper's 17 datasets as subsets. DeepChem's MoleculeNet module now
        loads many more datasets, and widely used copies (the Open Graph Benchmark's ogbg-mol* sets)
        carry their own splits; neither is included, and whether either belongs here as subsets or
        variants is open.
      field: subsets
    - check: drug-discovery-admet is carried by the physiology datasets. SIDER's and ClinTox's
        endpoints are clinical (side effects of marketed drugs, trial toxicity and FDA approval),
        which the biology family's exclusion sends to medicine-health; no medicine-health leaf fits
        a structure-to-outcome prediction, so they stay under ADMET.
      field: domain
    - check: PDBbind and BACE are overridden to biology-genetics/drug-target-interaction, following
        the chemistry family's exclusion for binding affinity; PCBA, MUV and HIV stay under
        molecular-property-prediction, though MUV's 17 tasks are target-based actives.
      field: subsets
    - check: distribution-shift-generalization rests on the scaffold split (HIV, BACE, BBBP) and
        PDBbind's time split; the paper's recommended split for the other 13 datasets is random or
        stratified, while DeepChem's loaders now default to scaffold. capability_override per subset
        was not used.
      field: capability
      source: src-arxiv-1703-00564-v3
      quote: Three datasets (HIV, BACE, BBBP) in these two categories are evaluated under scaffold
        splitting.
    - check: scientific-surrogate-model rather than domain-specialist-model, which the USPTO-MIT
        entry chose for reaction prediction. SIDER's and ClinTox's labels are not an assay or solver
        output. LLMs prompted in context (as_used) could be recorded as observed_subjects.
      field: designed_for_subjects
    - check: ground_truth_source experimental covers 11 of 17 datasets; the quantum sets are DFT
        (simulation), and SIDER and ClinTox are compiled records.
      field: ground_truth_source
    - check: submission_process maintainer-run rests on the deepchem/moleculenet README, a ranking
        of DeepChem's own runs unchanged since 2021; literature-only may describe the benchmark
        better, since all other results are in independent papers.
      field: governance.submission_process
      source: src-github-moleculenet-readme
      quote: '# MoleculeNet Leaderboard ## Physical Chemistry ### Delaney (ESOL)'
    - check: maintainer-competes-on-own-benchmark rests on the release paper benchmarking its
        authors' earlier models (bypass and multitask networks, weave); the USPTO-MIT entry did not
        flag a release paper's own model where no ranking exists.
      field: governance.independence_flags
    - check: refresh versioned-releases. The QM9 file was replaced without a library release label,
        and the documentation's recommended splits changed without a dated announcement; static (for
        the paper's collection) or null may fit better.
      field: data.refresh
    - check: The paper's one sentence puts QM7 and QM7b at PBE0/tier2; whether all 14 QM7b
        properties were computed at that level was not checked against the original QM7b work.
      field: subsets
      source: src-arxiv-1703-00564-v3
      quote: determined using ab-initio density functional theory (PBE0/tier2 basis set)
    - check: paper.doi is the Chemical Science article's, read through Crossref only; whether the
        journal's Table 1 counts match v2 or v3 was not read.
      field: paper
    - check: The Tox21 alteration claim comes from an abstract that names MoleculeNet and the Open
        Graph Benchmark together; which changes are MoleculeNet's was not read.
      field: governance.known_limitation
      source: src-arxiv-2511-14744
      quote: the dataset was altered and labels were imputed or manufactured, resulting in a loss of
        comparability across studies
  unreachable:
    - url: https://moleculenet.org/
      http_status: 404
      consequence: MoleculeNet's own site was not read, and the homepage is the DeepChem

subsets_note: >
  The paper's 17 datasets under its four categories; the category subsets are groupings and are not
  scored. items are the compound counts of the v3 Table 1, whose rows run in the order QM7, QM7b, QM8,
  QM9, ESOL, FreeSolv, Lipophilicity, PCBA, MUV, HIV, PDBbind, BACE, BBBP, Tox21, ToxCast, SIDER,
  ClinTox; the dataset descriptions in the same text keep v2's larger counts for some (Tox21 8014,
  ToxCast 8615, BACE 1522, ClinTox 1491). Recommended splits, paper against the DeepChem documentation
  read 2026-10-14: the two agree except for ESOL, Lipophilicity and MUV (random in the paper, scaffold
  in the documentation) and PDBbind (time against random); QM7b has no loader in the documentation.
  The loaders' default splitter is scaffold for most datasets, whatever the documentation recommends
  (Tox21's evidence quotes its loader). DeepChem's MoleculeNet module now loads many more datasets
  (HOPV, Clearance, ChEMBL, materials sets and others), which are not listed here.


subsets:
  - id: chembench#chembench-mini
    label: ChemBench-Mini
    items: 236
    scored_separately: true
    evidence:
      - source: src-europepmc-pmc12226332
        quote: Firstly, from the full dataset, we kept all the questions labelled as advanced.
      - source: src-europepmc-pmc12226332
        quote: Thirdly, we do not include any intuition questions in this subset because the
          intended use of ChemBench-Mini is to provide a fast and fair evaluation of LLMs
          independent of any human baseline.
    notes: Every advanced question plus at most three per skill-and-topic combination, without
      intuition (preference) items; the human volunteers answered all of it, and the paper's main
      comparisons are on it. The Hugging Face data marks its two halves (in_humansubset_w_tool,
      in_humansubset_wo_tool).

curation:
  added_by: agent (P1-S6-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-europepmc-pmc12226332
    - src-arxiv-2404-01475-v2
    - src-arxiv-2404-01475
    - src-arxiv-2404-01475-v1-abs
    - src-github-chembench-readme
    - src-github-chembench-prompter
    - src-zenodo-14010212
    - src-zenodo-14935487
    - src-hf-api-chembench
    - src-hf-chembench-dataset-card
    - src-hf-chembench-leaderboard-readme
    - src-hf-chembench-leaderboard-submit
    - src-hf-chembench-leaderboard-squash
    - src-hf-chembench-results-rows
    - src-github-inspect-evals-chembench-readme
    - src-arxiv-2602-01550-v2
  sources_note: >
    The journal paper (a DOI, not archived) read as Europe PMC's JATS XML; the preprint's v2 PDF and its
    v1 and v2 abstract pages (DOIs); the README and prompter.py at commit 45f8bad; Zenodo's JSON records
    of v0.2.0 and v0.3.0 (DOIs); the dataset's Hugging Face API record and card; the leaderboard Space's
    README, submit.py and migrate_squash_v2.py at commit 15b079e, and the datasets-server rows of the
    results split 2.0.2, the JSON the script-rendered board loads; the inspect_evals task README at commit
    62bb626; and the S1-NexusAgent v2 PDF (a DOI) as evidence of current use. Nature's own article page
    was not fetched (Europe PMC carries the same licensed text).
  confidence: medium
  review_checks:
    - check: The domain leaf is forced. chemistry-materials has no leaf for chemistry knowledge and
        reasoning questions, and molecular-property-prediction covers only the semi-automatic
        property items; the gap is logged (taxonomy/_failures/2026-11-04-chembench-001.yaml,
        proposed chemistry-materials/ chemistry-knowledge-exams). A reviewer may prefer to wait for
        the leaf.
      field: domain
      specialist: true
    - check: ceiling_anchor_type theoretical-maximum follows the board's full-corpus headline. The
        paper's own headline comparison is on ChemBench-Mini against the chemists' average and best,
        which would make it expert-average; which number is the headline decides.
      field: data.ceiling_anchor_type
      source: src-europepmc-pmc12226332
      quote: we also surveyed 19 experts in chemistry on a subset of the benchmark corpus
    - check: The board mixes corpus revisions. Paper-era rows have topic scores that fit 1,001
        preference items (o1-preview 0.56344 = 564/1,001) where the Hugging Face copy has 1,000, so
        those rows were scored on the published corpus, not re-run; a claim should say which
        revision it was scored on.
      field: versions
      source: src-hf-chembench-results-rows
      quote: '"Chemical Preference":0.5634365634365635'
    - check: The current Hugging Face record sums to 2,785 questions, against 2,788 in the paper and
        2,786 in inspect_evals' note; the third removal is unexplained by any source read here.
      field: data.size
    - check: submission_process self-reported plus maintainer-run. Uploads carry the entrant's own
        per-question verdicts and the Space only averages them; the top row, NexusSciAgent (0.860),
        is one of seven the maintainer lists as unvetted.
      field: governance.submission_process
      source: src-hf-chembench-leaderboard-submit
      quote: '# submissions with no vetting (e.g. "NexusSciAgent", "Haiyue-Ch1") — so'
    - check: maintainer-competes-on-own-benchmark not set. The board has a verified
        ChemPile-LoRA-Ensemble row, and ChemPile may be the maintainers' own training corpus; no
        source read here says whose it is.
      field: governance.independence_flags
    - check: funded-by-evaluated-party rests on FutureHouse's API access for PaperQA2 runs; the
        competing interests (an OpenAI red-teaming contract, Stability.AI employment and HPC access)
        are recorded in the note but not flagged.
      field: governance.independence_flags
      source: src-europepmc-pmc12226332
      quote: K.M.J. has been a paid contractor for OpenAI (as part of the red teaming network).
    - check: The package's refusal retries (v0.3.0) and the LLM fallback parser change scores
        relative to the paper's protocol; the paper and its preprint name different fallback models.
      field: execution.harness_gotcha
      source: src-arxiv-2404-01475-v2
      quote: We used Llama-3-70B-Instruct, accessed via the Groq API.
    - check: Licence. The Zenodo v0.2.0 release that the paper cites is CC BY 4.0; the v0.3.0
        release and the Hugging Face data are MIT. dataset_licence records MIT, the current copy's.
      field: data.dataset_licence
      source: src-zenodo-14010212
      quote: '"license": {"id": "cc-by-4.0"}'
    - check: The dataset card's citation and its "Nature Chemistry Publication" link point to the
        MaCBench preprint, not to this benchmark's paper.
      field: lineage
      source: src-hf-chembench-dataset-card
      quote: '[Nature Chemistry Publication](https://arxiv.org/abs/2411.16955)'
    - check: Name collision. ChemLLM's paper (arXiv 2402.06852) has its own ChemBench; a ChemBench
        number in another paper needs its citation checked before it is attached here. The
        S1-NexusAgent report cites this one (Mirza et al., 2025).
      field: aliases
      source: src-arxiv-2602-01550-v2
      quote: We evaluate S1-NexusAgent on ChemBench (Mirza et al., 2025)

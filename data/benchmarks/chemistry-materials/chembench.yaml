# data/benchmarks/chemistry-materials/chembench.yaml
#
# P1-S6-T02, chemistry-materials entry 12. Filled from the Nature Chemistry paper (2025, open access, CC BY 4.0),
# read as Europe PMC's full-text XML of PMC12226332; the arXiv preprint 2404.01475, read as its v2 PDF (2024-11-01)
# for the appendix tables the journal moved to its supplement, with its abstract page for the dates and the v1
# abstract page for the first corpus; the repository README and src/chembench/prompter.py (lamalab-org/chembench,
# default branch dev, commit 45f8bad062fe552810c52be3a328d5da8597ed30); Zenodo's records of the v0.2.0 and v0.3.0
# releases; the Hugging Face API record and dataset card of jablonkagroup/ChemBench; the leaderboard Space's
# README, src/submission/submit.py and scripts/migrate_squash_v2.py (jablonkagroup/ChemBench-Leaderboard, commit
# 15b079e91d6e9b09706d65bdb9d1447c190737b8) and the results rows it renders (datasets-server, split 2.0.2); the
# inspect_evals task README; and the S1-NexusAgent report (arXiv 2602.01550, v2 PDF, February 2026) as evidence of
# current use. Every quote below is checked by the quote-substring validator against those Sources' extracts.
#
# The home was the hard call. ChemBench is a question set for language models, but every item is chemistry and
# the curation rejected anything else, so general-intelligence (whose exams leaf sends a one-subject exam to that
# subject's family), language and reasoning-general all exclude it, and chemistry-materials claims it. That
# family has no leaf for knowledge and reasoning questions; molecular-property-prediction is the nearest and is
# forced (domain_basis), and the gap is logged as taxonomy/_failures/2026-11-04-chembench-001.yaml.

id: chembench
name: ChemBench
aliases:
  - Are large language models superhuman chemists?
  - A framework for evaluating the chemical knowledge and reasoning abilities of large language
    models against the expertise of chemists
  - chem-bench
aliases_note: >
  "chem-bench" is the repository's earlier name and the Zenodo record's title. A different benchmark also
  called ChemBench accompanies the ChemLLM paper (arXiv 2402.06852, another maintainer); it was not read
  here, and a "ChemBench" score in another paper should be matched to its citation before it is attached
  to this entry. Not MaCBench, the same lab's multimodal benchmark (lineage.variants).
tagline: 2,700-odd chemistry questions, multiple-choice and numeric, scored against a small survey
  of chemists.
description: >
  A question corpus and Python package from the Jablonka lab (lamalab) at Friedrich Schiller University
  Jena for evaluating the chemical knowledge and reasoning of language models. The published corpus has
  2,788 items: 1,039 written or rephrased by hand from exams, olympiads, textbooks, lecture notes and
  web resources, and 1,749 generated semi-automatically from chemical databases (NMR signal counts, point
  groups, oxidation states, GHS hazard statements and the like), including 1,000 two-molecule preference
  questions taken from medicinal chemists' judgements. 2,544 are multiple choice and 244 open-ended, mostly
  numeric. Each item is tagged by topic, required skill (knowledge, reasoning, calculation, intuition)
  and difficulty, and molecules, units and equations are wrapped in tags a model-specific prompter can
  rewrite. A 236-item subset, ChemBench-Mini, was answered by chemists recruited for the study, and the
  paper reads model scores against theirs. The package parses answers by regular expression with an LLM
  fallback and scores each item all-or-nothing. Since early 2025 the data and the leaderboard live on
  Hugging Face, where the board ranks the fraction correct over the whole corpus and mixes maintainer
  runs with unverified outside uploads. Known weaknesses the sources name: refusals by API-served models
  depress the toxicity and safety scores, and the paper finds performance on the preference questions
  often indistinguishable from random guessing.
self_description:
  source: src-europepmc-pmc12226332
  quote: Here we introduce ChemBench, an automated framework for evaluating the chemical knowledge
    and reasoning abilities of state-of-the-art LLMs against the expertise of chemists.
external_ids:
  inspect_evals: chembench
  huggingface: jablonkagroup/ChemBench
  arxiv: '2404.01475'
paper:
  title: A framework for evaluating the chemical knowledge and reasoning abilities of large language
    models against the expertise of chemists
  arxiv: '2404.01475'
  doi: 10.1038/s41557-025-01815-x
  version_read: v2
  source: src-europepmc-pmc12226332
paper_note: The version of record is read through Europe PMC; the arXiv v2 PDF
  (src-arxiv-2404-01475-v2) is read beside it for its appendix tables. The two differ in places,
  e.g. the leading model is "o1" in the preprint and "o1-preview" in the journal.
released: 2024-04-01
released_basis:
  reason: The arXiv v1 submission date, the earliest public release any source read here dates. The
    v1 corpus is not the one in use (versions).
  source: src-arxiv-2404-01475
  quote: '[Submitted on 1 Apr 2024 (v1), last revised 1 Nov 2024 (this version, v2)]'
release_venue: Nature Chemistry 17(7), 1027-1034 (2025)
release_venue_note: The XML's article metadata, run together by normalisation; its elements read
  epub 20 May 2025, volume 17, issue 7, pages 1027-1034.
release_venue_source: src-europepmc-pmc12226332
release_venue_quote: '20520252025177492228102710341420242632025'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/molecular-property-prediction
  secondary: []
domain_basis:
  reason: >
    The family is chemistry-materials: every item is a chemistry question and the curation rejects anything
    else, so the subject is matter at the molecular scale, as the family's inclusion test asks. The leaf
    is forced. No chemistry-materials subdomain covers knowledge and reasoning questions; molecular-property-
    prediction is the nearest, because the semi-automatic items (1,749 of 2,788) mostly ask for a property
    of a given molecule (NMR signal count, point group, electron count, oxidation state, GHS hazard statement),
    but the exam and textbook items and the preference questions are not property prediction. Logged as
    a missing-term gap (taxonomy/_failures/2026-11-04-chembench-001.yaml).
  source: src-arxiv-2404-01475-v2
  quote: 'Out of Scope: Questions outside the realm of chemistry are rejected.'
domain_considered_and_rejected:
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: The leaf's exclusion test sends a benchmark where one subject holds most of the items to
      that subject's family, and here one subject holds all of them. GPQA, the taxonomy's
      three-science example, qualifies through breadth that ChemBench does not have.
  - term: chemistry-materials/spectroscopy-interpretation
    reason: The NMR items give a SMILES string and ask how many signals the spectrum would show,
      which predicts a spectral feature from structure rather than inferring structure from a
      measurement, and they are a small part of analytical chemistry (152 items).
  - term: chemistry-materials/lab-automation-protocols
    reason: No item asks for a laboratory protocol, and nothing is executed; the paper only
      motivates the benchmark by copilot systems for chemists.
  - term: chemistry-materials/drug-discovery-admet
    reason: The toxicity and safety items concern hazard classes, exposure limits and safe handling
      of chemicals in general, not candidate drugs; the preference items score agreement with
      chemists' choices, not a measured ADMET property.
  - term: safety-alignment/dangerous-capability-evals
    reason: The paper names harm and dual use as motivation and 675 items are toxicity and safety,
      but what it measures is ordinary correctness, the near miss the safety family records for
      Humanity's Last Exam; no hazard is what it sets out to measure.
    source: src-europepmc-pmc12226332
    quote: the models would pass the certification exam according to the German Chemical Prohibition
      Ordinance
  - term: physics/physics-reasoning
    reason: Physical chemistry is one topic of nine (165 items); the physics family's exclusion
      sends a molecule or material to chemistry-materials.

capability:
  - knowledge-recall
  - quantitative-reasoning
capability_basis:
  knowledge-recall:
    reason: Items are answered from the question alone for bare models; no passage or tool is
      supplied by the protocol, and the paper's knowledge-intensive questions are scored on recall
      of facts such as hazard statements.
    source: src-europepmc-pmc12226332
    quote: Notably, we find that models are still limited in their ability to answer
      knowledge-intensive questions
  quantitative-reasoning:
    reason: The open-ended items are numeric and are scored on the number, and calculation is one of
      the annotated skills, defined by whether a calculator is needed.
    source: src-europepmc-pmc12226332
    quote: calculation is required if answering a question would require the use of a calculator
capability_considered_and_rejected:
  - term: calibration-uncertainty
    reason: The paper elicits verbalised confidence from some models and finds it poorly calibrated,
      but as an analysis beside the benchmark; neither the package's score nor the leaderboard
      consumes a confidence.
  - term: deductive-reasoning
    reason: Reasoning is an annotated skill ("multiple reasoning steps"), but no form of reasoning
      is named or isolated, and ADR-0020 rejects a catch-all reasoning term.
  - term: scientific-prediction
    reason: The term's exclusion test removes exam-style question answering over scientific content;
      the semi-automatic property questions come closest but are scored as quiz answers against
      stored keys.
  - term: tool-use
    reason: Tools are the entrant's choice (ReAct systems, PaperQA2, NexusSciAgent on the board),
      not part of the protocol; for the human study they were allowed on one half of ChemBench-Mini.

evaluation_method:
  - multiple-choice
  - numeric-tolerance-match
evaluation_method_basis:
  reason: >
    2,544 of the 2,788 items pick from supplied options, and an item counts as correct only when the selected
    set equals the keyed set (Hamming distance 0; some items key more than one option). The 244 open-ended
    items are numeric and count as correct within a per-item tolerance, or 1% of the target where none
    is set. No source read here states a chance baseline, which varies with the options per item and the
    multi-answer keys.
  source: src-europepmc-pmc12226332
  quote: ChemBench samples both MCQ and open-ended questions (2,544 MCQ and 244 open-ended
    questions).
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: The dataset card lists exact_string_match among the open-ended metrics, but the
      package's all-or-nothing verdict for a non-MCQ item is a tolerance on the absolute error, not
      string equality.
    source: src-github-chembench-prompter
    quote: tolerance = 0.01 * float(target)
  - term: human-distribution-percentile
    reason: Scores are read against the human survey's average and best, but the score itself is a
      fraction correct, not a position in the human distribution.

designed_for_subjects:
  - base-model
  - instruction-tuned-model
  - agent-scaffold
  - human-expert
designed_for_subjects_basis:
  reason: >
    The package keeps separate prompt templates for completion models and instruction-tuned models, and
    is built on text completions so that systems with their own tools and loops can be scored the same
    way; the paper runs two ReAct systems (at most ten LLM calls) and PaperQA2, an agentic literature
    search. Chemists recruited for the study answered ChemBench-Mini under the same scoring, half of it
    without tools; only volunteers with at least two years of chemistry after their first university course
    were analysed.
  source: src-europepmc-pmc12226332
  quote: We employ distinct prompt templates tailored for completion and instruction-tuned models to
    maintain consistency with the training.
designed_for_subjects_considered_and_rejected:
  - term: tool-augmented-model
    reason: The protocol offers no tools. The tool-using entrants in the paper and on the board run
      their own loop (ReAct, PaperQA2), which is agent-scaffold; the paper caps the ReAct systems at
      ten LLM calls.
    source: src-arxiv-2404-01475-v2
    quote: However, we limit those systems to ten calls to the LLM.
  - term: domain-specialist-model
    reason: The paper's line-up and the board are mostly general models; Galactica is the one
      science-trained model in the paper's tables. The benchmark is built to compare any
      text-returning system, not to test a specialisation.
  - term: retrieval-augmented-system
    reason: PaperQA2 retrieves papers, but it is one entrant among general models, and retrieval is
      not part of the protocol.
  - term: reasoning-model
    reason: Reasoning configurations now fill much of the board (observed_subjects), but the design
      sets no reasoning budget.
observed_subjects:
  values:
    - reasoning-model
    - instruction-tuned-model
    - agent-scaffold
  basis: The board's rows are mostly chat models; the maintainer's 2025-2026 batch of runs flags
    reasoning models (Claude Opus 4.7 is the highest verified row), and the top row is
    NexusSciAgent, an agent framework on Claude-4.5-Sonnet uploaded from outside and unverified.
  source: src-hf-chembench-results-rows
as_used:
  - protocol: Agent-framework papers report ChemBench against baselines copied from the leaderboard,
      with their own scaffold, tools and retrieval, as a nine-topic overall score.
    source: src-arxiv-2602-01550-v2
    quote: The baselines are taken from the ChemBench leaderboard
    note: The S1-NexusAgent report (Institute of Automation, Chinese Academy of Sciences, February
      2026) gives 86.1 with Claude-4.5-Sonnet as backbone, which matches the board's unverified
      NexusSciAgent row (0.8605).
  - protocol: Run through inspect_evals, the task shuffles options by default, runs without chain of
      thought unless asked, and scores numbers within 1% of the target, close to but not the
      package's prompts and parsing.
    source: src-github-inspect-evals-chembench-readme
    quote: For numerical tasks, a `pattern_mae` scorer is used, computing the match with a tolerance
      within of 1% of the target value.

lifecycle: active
lifecycle_basis:
  reason: The maintainers still run models and change the board; the leaderboard's results table was
    re-curated on 2026-09-03 and its rows include models released in 2026. Saturation is derived
    from claims, never set here.
  source: src-hf-chembench-leaderboard-squash
  quote: '# Curated 2026-09-03 by the maintainer: everything in ChemBench-Results was # personally run
    by them EXCEPT these — unvetted / third-party submissions.'
activity: accepting-submissions
activity_basis:
  reason: The leaderboard Space serves a submission form at any time, for a ChemBench report or an
    Inspect log; it has never run in rounds.
  source: src-hf-chembench-leaderboard-readme
  quote: '| `/submit/` | The **submission** form | Gradio, mounted on FastAPI |'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude Opus 4.7
    source: src-hf-chembench-results-rows
    observed_on: 2026-11-04
    quote: '"model_id":"claude-opus-4-7-tinyeval","name":"Claude Opus 4.7"'
    note: The highest verified row of the board's split 2.0.2 (0.709 overall).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each item's answer key ships with the item (target or target_scores); the
  keys were checked by reviewers who solved the questions. The 1,000 preference items are keyed to
  the choices medicinal chemists made in Choung et al.'s study, a human judgement rather than a
  measurement.
ground_truth_source_source: src-arxiv-2404-01475-v2
ground_truth_source_quote: Reviewers also solved the questions to verify the answers.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The questions and their keys are on Hugging Face without a gate, under MIT, and the
    package that scores them is public.
  source: src-hf-api-chembench
  quote: '"gated":false'

task:
  exists: true
  input:
    - one chemistry question in English, with molecules as SMILES and units and equations in
      LaTeX-style tags, and for multiple choice the lettered options
  output: An answer inside the [ANSWER] environment the instruction-tuned prompt asks for (an option
    letter or letters, or a number), parsed by regular expression with an LLM fallback.
  scoring: >
    All-or-nothing per item: a multiple-choice item is correct when the selected options equal the keyed
    set (Hamming distance 0), a numeric item when its absolute error is below the item's tolerance or
    1% of the target. The headline is the fraction of items correct over the corpus, also reported per
    topic; the paper also reports by skill and difficulty, and on ChemBench-Mini against the human survey.
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The keys are published with the questions; a canary string guards
    against training on them.
  source: src-github-chembench-prompter
  quote: result["metrics"]["all_correct"] = int(result["metrics"]["hamming"] == 0)

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The nine topic configurations, keys included, are on Hugging Face without a gate, under
      MIT; the release before them is archived on Zenodo.
    source: src-hf-api-chembench
    quote: '"license:mit"'
  refresh: versioned-releases
  refresh_basis:
    reason: >
      The corpus is revised by release: the v1 preprint's corpus of more than 7,000 items was replaced
      in v0.2.0 (2024-10-29, archived on Zenodo) by the 2,788-item corpus of the paper, and the Hugging
      Face copy, in use since v0.3.0, has been re-uploaded several times (2025-01, 2025-02, 2025-07, 2025-12,
      per its commit history read through the Hub API and not quoted) and has lost duplicates on the way
      (versions). Between releases the questions are fixed; the leaderboard's own result snapshots are
      numbered separately and are not corpus versions.
    source: src-zenodo-14010212
    quote: Release of a significant revision of the question corpus.
  data_provenance:
    - expert-authored
    - exam-derived
    - curated-public-database
    - inherited-from-constituents
  data_provenance_note: >
    Of the 2,788 items, 1,039 were curated by hand: 149 from exams, 149 from the International Chemistry
    Olympiad, 206 from textbooks, 21 from lecture notes and 375 from web resources, all rephrased and
    annotated, and 139 written from scratch, each reviewed by at least two scientists besides its curator.
    1,749 were generated semi-automatically from chemical databases and tools (ZINC, PubChem, cheminfo.org,
    CAMEO Chemicals, GHS data), the answers computed by rule-based tools. 1,000 of those are the preference
    questions, sampled from a published dataset of medicinal chemists' choices (Choung et al.), hence
    inherited-from-constituents for that part. web-scraped is not tagged: the 375 web-sourced items were
    rewritten by the curators, not harvested.
  data_provenance_source: src-europepmc-pmc12226332
  data_provenance_quote: Semi-automatically generated 1749 URL 375 Textbook 206 Exam 149 IChO 149 No
    source 139 Lectures 21
  contamination_risk: medium
  contamination_risk_note: >
    The items and keys have been public on GitHub since the 2024 releases and on Hugging Face since January
    2025, so a training route is plausible. The maintainers' defences are BIG-bench's canary string in
    every item and a notice on the dataset not to train on it; both depend on model developers filtering,
    and no source read here checks whether any did. Some exam, olympiad and textbook items were rephrased
    from public material, and reviewers searched the web to keep easily found questions out.
  contamination_evidence:
    - source: src-europepmc-pmc12226332
      stance: against
      quote: To ensure that the questions do not enter a training dataset, we use the same canary
        string as the BigBench project.
    - source: src-hf-api-chembench
      stance: against
      quote: DO NOT USE THIS DATASET FOR TRAINING OR FINE-TUNING MODELS
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: >
      The leaderboard's headline is the fraction of the whole corpus answered correctly, bounded at 1,
      and no human answered the whole corpus. The paper's human anchor belongs to ChemBench-Mini, where
      it reads model scores against the chemists' average and best (ceiling_by_category); the best models
      beat both. If ChemBench-Mini is taken as the headline instead, the type would be expert-average
      (review_checks).
    source: src-arxiv-2404-01475-v2
    quote: Since the best possible score for each question is one and the worst possible score is
      zero
  ceiling_by_category:
    - category: ChemBench-Mini, human volunteers' average (fraction correct, with tools allowed on
        half the questions)
      value: 0.27
      metric: fraction correct
      source: src-arxiv-2404-01475-v2
      quote: Human 0.28 0.23 0.27 0.32 0.24 0.27 0.27
    - category: ChemBench-Mini, best human volunteer (no number stated; o1-preview is almost twice
        as high)
      metric: fraction correct
      source: src-europepmc-pmc12226332
      quote: Remarkably, the figure shows that the leading LLM, o1-preview, outperforms the best
        human in our study in this overall metric by almost a factor of two.
  ceiling_by_category_note: The 0.27 is the last column of the preprint's Table A4 (overall accuracy
    on ChemBench-Mini); the journal moved the table to its supplement, which was not read. 19
    chemists were surveyed and 16 reported their background (2 beyond a first postdoc, 13 with a
    master's degree and in PhD studies, 1 with a bachelor's); the best human's score is shown only
    in the paper's figure.
  dataset_licence: MIT
  dataset_licence_note: The Zenodo record of the v0.2.0 release, which the paper cites for its data,
    is licensed CC BY 4.0 (src-zenodo-14010212); the v0.3.0 record and the Hugging Face copy are
    MIT.
  dataset_licence_source: src-hf-chembench-dataset-card
  dataset_licence_quote: All content is made open-source under the **MIT** license
  upstream_licences: Not stated per item. The exam, olympiad and textbook questions were rephrased
    from their sources, and the preference questions come from Choung et al.'s dataset; no source
    read here gives those sources' licences.
  size:
    - count: 2788
      unit: question-answer pairs, the published corpus (v0.2.0)
      source: src-europepmc-pmc12226332
      quote: Our benchmark consists of 2,788 question–answer pairs compiled from diverse sources
        (1,039 manually generated and 1,749 semi-automatically generated).
    - count: 2785
      unit: questions on Hugging Face, the sum of the nine topic configurations (2026-04-22
        revision)
      subset: Hugging Face copy
      note: 152 + 1,000 + 149 + 92 + 83 + 429 + 165 + 40 + 675, each read from the record's split
        sizes (subsets).
      source: src-hf-api-chembench
      quote: '"num_bytes":796655,"num_examples":1000'
    - count: 2786
      unit: questions on Hugging Face after two duplicates were removed, as inspect_evals states
      subset: Hugging Face copy (inspect_evals' count)
      source: src-github-inspect-evals-chembench-readme
      quote: '(Note: The original paper reports 2,788 samples, but the version on Hugging Face has two
        duplicates removed.'
    - count: 2544
      unit: multiple-choice questions
      subset: published corpus
      source: src-europepmc-pmc12226332
      quote: ChemBench samples both MCQ and open-ended questions (2,544 MCQ and 244 open-ended
        questions).
    - count: 244
      unit: open-ended questions
      subset: published corpus
      source: src-europepmc-pmc12226332
      quote: ChemBench samples both MCQ and open-ended questions (2,544 MCQ and 244 open-ended
        questions).
    - count: 236
      unit: questions
      subset: ChemBench-Mini
      source: src-europepmc-pmc12226332
      quote: we also provide a subset (ChemBench-Mini, 236 questions) of the corpus
  size_note: The Hugging Face record now sums to 2,785, one fewer than inspect_evals' 2,786; no
    source read here says which item went (review_checks).
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: lamalab (Jablonka group, Friedrich Schiller University Jena)
  maintainer_basis:
    reason: The paper's last author leads the group; the code is in the lamalab-org GitHub
      organisation and the data, results and leaderboard in the jablonkagroup organisation on
      Hugging Face. The leaderboard's scripts speak of a single maintainer, who is not named here.
    source: src-europepmc-pmc12226332
    quote: The data for ChemBench is available via GitHub at
      https://github.com/lamalab-org/chembench and via Zenodo at https://zenodo.org/records/14010212
  maintainer_type: academic-lab
  submission_process:
    - self-reported
    - maintainer-run
  submission_process_note: >
    Outside entrants run the benchmark themselves and upload a report or an Inspect log of per-question
    verdicts (all_correct, 0 or 1); the Space checks that every question is present and averages the verdicts,
    but no source says it re-scores the answers, so the number is the entrant's (self-reported). Rows
    the maintainer ran, or vetted with a password at upload, are flagged verified (maintainer-run); seven
    rows, the top one among them, are unverified. Before 2025 contributions were JSON files sent by pull
    request.
  submission_process_source: src-hf-chembench-leaderboard-submit
  submission_process_quote: "# A correct maintainer password at submission time marks the entry # verified;
    see app.py's VERIFY_PASSWORD flow."
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-europepmc-pmc12226332
      quote: for supporting PaperQA2 runs via access to the API
  independence_flags_note: >
    FutureHouse gave API access for running PaperQA2, its own system, which the paper evaluates and the
    board lists; the flag's test counts in-kind API access from an evaluated party. Also declared: the
    last author was a paid contractor for OpenAI's red-teaming network, and OpenAI's models are evaluated;
    one author is a Stability.AI employee and two were its contractors, and Stability.AI gave HPC access,
    but no Stability model is on the board read here. Whether the maintainer's own models compete (maintainer-competes-on-own-benchmark)
    was not established (review_checks).
  independence_assessed: true
  funding:
    source: src-europepmc-pmc12226332
    quote: This work was supported by the Carl Zeiss Foundation
  known_limitation:
    source: src-europepmc-pmc12226332
    quote: This is because models provided via APIs typically have safety mechanisms that prevent
      them from providing answers that the provider deems unsafe.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The paper ran every model through API endpoints, the developers' own and Groq's; serving
      open weights locally is the entrant's choice.
    source: src-europepmc-pmc12226332
    quote: We used the API endpoints provided by the model developers and those provided by Groq.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Questions, keys and the scoring package are public, and the score is computed by script
      from the model's outputs. The LLM fallback parser is a model call, so a re-run depends on that
      model too.
    source: src-github-chembench-readme
    quote: benchmark = ChemBenchmark.from_huggingface(verbose=True)
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: chembench Python package (lamalab-org/chembench; PrompterBuilder and ChemBenchmark)
  harness_source: src-github-chembench-readme
  harness_quote: is a Python package for building and running benchmarks of large language models
    and multimodal models such as vision-language models.
  harness_gotcha:
    source: src-zenodo-14935487
    quote: We've implemented automatic retry mechanisms to handle cases where models initially
      refuse to process certain requests.
  harness_gotcha_note: >
    Since v0.3.0 the package re-asks a question when a refusal is detected (one retry by default, llm_refusal_retries),
    which the paper's runs did not; refusals mostly hit toxicity and safety items, so a score from the
    current package and one from the paper are not the same protocol. When the regular expressions fail,
    an LLM parses the answer: the paper names Claude-3.5 (Sonnet) in its methods and the preprint's appendix
    Llama-3-70B-Instruct via Groq. The paper ran at temperature 0, and the board lists temperature-1 runs
    beside them.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for lamalab-org/chembench, read 2026-11-04, not a
    quoted Source; the v0.3.0 Zenodo record also says MIT (src-zenodo-14935487), the v0.2.0 record
    CC BY 4.0. The default branch, dev, was last committed on 2025-09-11 (GitHub API).
  runnable_via:
    - custom
    - inspect
  runnable_via_note: inspect_evals' chembench task loads the Hugging Face configurations, shuffles
    options by default, runs without chain of thought unless cot is set, and scores numbers within
    1% of the target; the leaderboard accepts its .eval logs. Its prompts and parsing are not the
    package's.
  runnable_via_source: src-github-inspect-evals-chembench-readme
  runnable_via_quote: uv run inspect eval inspect_evals/chembench --model openai/gpt-5-nano
  inspect_evals_id: chembench
  maintainer_rerun_policy: unstated

comparability:
  # The llm-static-text profile (multiple-choice x base and instruction-tuned models) carries shots, chain of thought,
  # reasoning effort, tools, retries and the subset; retries matter here because the package re-asks after a refusal.
  # harness is added because the package and inspect_evals prompt, shuffle and parse differently; scaffold because
  # agent frameworks with their own tools sit on the same board; sampling because temperature-0 and temperature-1
  # runs of the same model are listed side by side. Which corpus revision was scored is a version, on the claim.
  material_extra:
    - harness
    - scaffold
    - sampling
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The board ranks overall_score, the verdicts summed over all questions and divided by their
    number (a micro-average, so the 1,000 preference items are 36% of it), beside a score per topic.
  source: src-hf-chembench-leaderboard-submit
  quote: scores["overall_score"] = total_correct / total_questions
headline_metric: null
headline_metric_note: The headline is the fraction of questions answered correctly over the full
  corpus; no Metric record exists for it and this task may not write one.
no_legitimate_aggregate: false


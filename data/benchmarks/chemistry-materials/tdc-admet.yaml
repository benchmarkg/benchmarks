  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, whose text layer drops every numeral; its
    abstract page for the date and venue; the README at main; five tdcommons.ai pages with scripts and
    styles stripped, of which the Caco2_Wang board (one of 22 boards, all fetched) and the team page are
    withheld from archiving for the e-mail addresses in their raw HTML; Dataverse's JSON version history
    of the group's data file; GitHub's JSON commit list for the gh-pages branch, also withheld; and the
    2026 audit's full text from Europe PMC (a DOI, not archived).
  confidence: medium
  review_checks:
    - check: The entry is the ADMET Benchmark Group alone. TDC's other benchmark groups, listed
        beside it in the site's menu, have their own tasks, splits and boards and would be entries
        of their own; TDC as a platform is not one.
      field: name
      source: src-tdc-admet-site
      quote: ADMET Group DrugCombo Group Docking Group DTI DG Group Single-cell DTI Group
    - check: activity accepting-submissions rests on the guidelines' standing invitation. The form
        needs a Google sign-in and could not be checked, and the boards have not changed since
        2025-07-13; if the form is closed, no-submission-channel or unknown fits better.
      field: activity
      source: src-github-tdc-gh-pages-commits
      quote: '"date":"2025-07-13T17:44:04Z"},"message":"update leaderboard"'
    - check: submission_process self-reported rests on no stated check and on a row that carries the
        docs' example output. The guidelines' FAIR4RS statement could be read as a code-release
        condition (open-source-gated); most rows link code and a paper, which the form asks for.
      field: governance.submission_process
      source: src-tdc-benchmark-guidelines
      quote: we apply FAIR4RS principles and implementation guidelines to all software and ML tools
        included in TDC leaderboards
    - check: contamination_risk medium. The audit traces leakage in three top-ranked entrants and
        shows that tuning on the public test sets lifts rank; whether that is a benchmark-level
        route (high) or entrant-level (medium, as recorded) is a judgement.
      field: data.contamination_risk
      source: src-jcim-2026-tdc-admet-audit
      quote: Our deliberately overfitted models entered the top-3 in 10 out of 22 end points
    - check: refresh versioned-releases against the audit's statement that TDC has no data set
        versioning. The Dataverse record shows the group's file unchanged since 2021-02-26;
        rolling-live would fit if the evaluator or the loader's processing changed scores between
        PyTDC releases.
      field: data.refresh
      source: src-jcim-2026-tdc-admet-audit
      quote: The platform does not provide fixed data set releases, version identifiers, check sums
        or detailed changelogs
    - check: designed_for_subjects scientific-surrogate-model, because the entrants emulate assay
        and in vivo measurements; domain-specialist-model is the alternative, as for ProteinGym.
      field: designed_for_subjects
      specialist: true
    - check: distribution-shift-generalization rests on the scaffold split alone. No in-distribution
        score is reported beside it, which the term allows, and whether a scaffold split counts as a
        deliberately shifted distribution is a cheminformatics judgement.
      field: capability
      specialist: true
    - check: aggregation_policy none-by-design. The maintainers publish no group score and accept
        single-dataset submissions, but the guidelines encourage whole-group submissions, and others
        average ranks across the boards; unknown or community-aggregate are the alternatives.
      field: aggregation_policy
    - check: Whether the release paper's baselines, listed with a maintainer as contact, count as
        maintainer-competes-on-own-benchmark, as RoboCasa's baseline rows do.
      field: governance.independence_flags
      source: src-tdc-admet-caco2-leaderboard
      quote: RDKit2D + MLP (DeepPurpose) Kexin Huang

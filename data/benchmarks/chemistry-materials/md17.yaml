# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1611-04678-v4
    - src-arxiv-1611-04678
    - src-arxiv-1802-09238-v3
    - src-arxiv-1802-09238
    - src-sgdml-site
    - src-sgdml-benchmark-aspirin-f
    - src-pyg-docs-md17
    - src-arxiv-2007-09593-v1
    - src-figshare-api-rmd17
    - src-arxiv-2101-03164-v3
    - src-arxiv-2503-01431-v3
  sources_note: >
    The two maintainers' papers as v4 and v3 PDFs (DOIs, not archived) read as text, with windows that
    keep the authors' contact lines out, and their abstract pages for the dates, without the submitter's
    name; their supplements, which hold the dataset tables, were not read. The sGDML site with scripts
    and styles stripped, and the JSON its chart script loads for aspirin's forces (both pending archiving);
    PyTorch Geometric's 2.7.0 documentation page (pending). For the fork, the rMD17 paper's v1 PDF and
    Figshare's API record (DOIs). For use, the NequIP paper's v3 PDF and the MD-ET paper's v3 PDF (DOIs).
  confidence: medium
  review_checks:
    - check: Lineage. rMD17 is entered as a fork (another maintainer, another level of theory, its
        own DOI, splits and citations), but its makers call it a revision of MD17 and it reuses MD17
        geometries, which is the revision row of 04 S4's table (same items, changed contents). If a
        reviewer weighs the items over the maintainer, it would be a version of md17 instead. The id
        rmd17 is proposed here and is not allocated; no rmd17 entry exists.
      field: lineage
      source: src-arxiv-2007-09593-v1
      quote: we additionally present a revision of the MD17 where the energies and forces have been
        calculated using dense integration grids
    - check: The coupled-cluster sets are subsets of the 2018 track-set version. They come from the
        same group and reuse MD17 geometries, but they have their own reference, fixed splits and
        papers that cite them as MD17@CCSD(T); a variant with its own id is the other reading.
      field: subsets
      source: src-arxiv-2503-01431-v3
      quote: We use the MD17@CCSD(T) dataset [19], which recalculates trajectories for molecules in
        MD17 using CCSD(T)
    - check: What MD17 contains. The release paper has eight molecules and NequIP still says eight,
        while the sGDML site and PyTorch Geometric list ten under MD17. The 2017 and 2018 version
        labels are this entry's own. The 2018 FHI-aims benzene (49,863 frames) is listed separately
        and unexplained; the maintainers may have replaced the 2017 benzene for a fault in its
        energies, which no source read says.
      field: versions
      source: src-arxiv-2101-03164-v3
      quote: is a data set of eight small organic molecules, obtained from MD simulations at T=500K
        and computed at the PBE+vdW-TS level of electronic structure theory
    - check: The training set size is the condition that most changes an MD17 number (1,000; 950 +
        50; 9,500 + 500; 50,000 in early papers), and no condition field holds it; the comparability
        comment sends it to training_data_policy's note. A schema field (a training-set count), or
        training_data_eligibility_tiers keyed by size, would make it checkable. No tiers are
        recorded, as no board or rule splits entrants.
      field: comparability
      source: src-sgdml-benchmark-aspirin-f
      quote: '{ "x": 15000, "y": 0.161 }, { "x": 50000, "y": 0.0468 }'
    - check: sample-efficiency rests on the release paper's claim and its samples-to-target figure,
        the conventional 1,000-frame budget and the coupled-cluster sets' fixed training split; the
        DFT trajectories themselves fix no budget, which the term's inclusion test asks for.
      field: capability
    - check: lifecycle active. PyTorch Geometric and NequIP describe the original DFT labels as
        noisy, and much current DFT-molecule use has moved to rMD17; the coupled-cluster sets and
        the MD17-10k protocol are still used. superseded may fit the DFT trajectories.
      field: lifecycle
      source: src-pyg-docs-md17
      quote: This version of the dataset was found to suffer from high numerical noise.
    - check: Current-use evidence is the MD-ET paper, one of whose authors co-wrote both MD17
        papers; the independent NequIP paper is from 2021. A fully independent 2025-2026 result on
        original MD17 or the coupled-cluster sets was not found in the time spent; 2025-2026 results
        on rMD17 count for the fork.
      field: lifecycle
    - check: submission_process literature-only, although the maintainers keep per-dataset charts of
        others' published errors with their own models highlighted. It is neither maintainer-run
        (they did not run the models) nor self-reported (no channel). Whether the charts mix
        original-MD17 and rMD17 numbers, or runs at 950 and 1,000 frames under one x value, was not
        checked.
      field: governance.submission_process
      source: src-sgdml-site
      quote: Test errors published for this dataset
    - check: contamination_risk medium. Beyond pretraining exposure (evidence for one model and one
        molecule), test frames are time-correlated with training frames of the same trajectory; the
        facet has no term for that within-benchmark leakage, and high may fit better.
      field: data.contamination_risk
      source: src-figshare-api-rmd17
      quote: they are not guaranteed to be independent samples
    - check: Sizes disagree in places. The release paper gives 150 k to nearly 1 M frames while the
        site lists uracil at 133,770, and toluene CCSD(T) is 1,500 on the site and 1,501 in PyTorch
        Geometric. The supplements' tables, which would settle them, were not read.
      field: data.size
      source: src-arxiv-1611-04678-v4
      quote: These data sets range in size from 150 k to nearly 1 M conformational geometries with a
        resolution of 0.5 fs
    - check: dataset_licence null. No licence was found on the site or in the papers' text; the
        supplements and quantum-machine.org were not read. PyTorch Geometric redistributes the
        files.
      field: data.dataset_licence
  personal_data_excluded:
    - source: src-sgdml-site
      what: the addressee of the site's contact form and the photo credit
    - source: src-arxiv-1611-04678-v4
      what: the corresponding authors' e-mail addresses on the first page
    - source: src-arxiv-1802-09238-v3
      what: the corresponding authors' e-mail addresses on the first page
    - source: src-arxiv-2007-09593-v1

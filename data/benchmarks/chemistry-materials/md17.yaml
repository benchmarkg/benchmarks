lineage:
  role: root
  forks:
    - id: rmd17
      maintainer: O. Anatole von Lilienfeld's group, University of Basel
      source: src-arxiv-2007-09593-v1
      quote: we additionally present a revision of the MD17 where the energies and forces have been
        calculated using dense integration grids
lineage_note: "Revised MD17 (2020) takes 100,000 frames of each of the ten molecules and recomputes energies
  and forces at PBE/def2-SVP in ORCA with tight SCF convergence and dense grids, because the original
  labels were noisy; it is published on Figshare (10.6084/m9.figshare.12672038, CC0) with five train/test
  splits of 1,000 and a warning not to train on more than 1,000 frames (src-figshare-api-rmd17, \"DO NOT
  train a model on more than 1000 samples from this dataset.\"). Another maintainer and another level
  of theory make it a fork, entered as rmd17, an id this entry proposes and the lead must allocate. Not
  modelled: MD22 (2023), the same group's dataset of larger systems, listed on the same site and cited
  on its own; xxMD, which the MD-ET paper says goes beyond MD17 with nonadiabatic trajectories; and MD17-10k,
  which is a protocol on MD17 (as_used)."

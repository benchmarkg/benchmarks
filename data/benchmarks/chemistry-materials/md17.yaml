# data/benchmarks/chemistry-materials/md17.yaml
#
# P1-S6-T02, chemistry-materials entry 15. Filled from the GDML paper that released MD17, arXiv 1611.04678 read as
# its v4 PDF (2017-05-08, the Science Advances version) and its abstract page; the sGDML paper that added two
# molecules and the coupled-cluster sets, arXiv 1802.09238 read as its v3 PDF (2018-09-25, the Nature
# Communications version) and its abstract page; the sGDML site (sgdml.org, scripts and styles stripped), which
# hosts the downloads, and the JSON its script loads for the chart of published force errors on aspirin; PyTorch
# Geometric's documentation of its MD17 class (2.7.0); for the lineage, the paper that released revised MD17
# (arXiv 2007.09593 v1) and Figshare's API record of rMD17 (10.6084/m9.figshare.12672038); and for use, the
# NequIP paper (arXiv 2101.03164 v3) and the MD-ET paper (arXiv 2503.01431 v3, January 2026). Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# Lineage by the 04 S4 rule. The 2017 trajectories and the 2018 additions (paracetamol, azobenzene and the
# coupled-cluster sets on the DFT geometries) come from the same group, are hosted together and are loaded together,
# so they are one benchmark: two versions, the second a track-set that adds beside the first, with the
# coupled-cluster sets as subsets. Revised MD17 was recomputed by another group (University of Basel) at another
# level of theory, is distributed separately with its own DOI and splits, and is cited on its own, so it is a fork,
# a separate benchmark (rmd17), although its makers call it a revision. The calls are in review_checks.

id: md17
name: MD17
aliases:
  - MD-17
aliases_note: The NequIP paper and others write MD-17; MD17@CCSD(T) is used for the coupled-cluster
  sets (subsets).
aliases_source: src-arxiv-2101-03164-v3
aliases_quote: Importantly, we train and test separate NequIP models on both the original and the
  revised MD-17 data set
tagline: Energies and forces along ab initio MD trajectories of small organic molecules, for learned
  force fields.
description: >
  MD17 is a set of ab initio molecular dynamics trajectories of small organic molecules, released by the
  sGDML group (TU Berlin's Machine Learning Group with the University of Luxembourg) with the gradient-domain
  machine learning (GDML) paper. Each trajectory was run at 500 K with a 0.5 fs resolution, and every
  frame carries the total energy and the forces on each atom at the PBE+vdW-TS level of DFT, computed
  with FHI-aims. The 2017 paper used eight molecules (benzene, uracil, naphthalene, aspirin, salicylic
  acid, malonaldehyde, ethanol, toluene); the 2018 sGDML paper added paracetamol and azobenzene, and recomputed
  energies and forces on the same geometries at CCSD(T) for benzene, toluene, malonaldehyde and ethanol
  and at CCSD for aspirin. A learned potential is trained on a small sample of one molecule's frames (1,000
  in the papers; 950 for training and 50 for validation in later use) and scored by the mean absolute
  error of energies and force components on the other frames, per molecule. The trajectories run from
  about 100,000 to about a million frames; the coupled-cluster sets hold 1,500 or 2,000 structures with
  fixed train and test splits. Everything is public. There is no official split for the DFT trajectories
  and no board; results appear in papers, and the sGDML site charts published test errors by training
  set size. The original energies were found to be noisy, and a separately maintained recomputation, revised
  MD17 (rmd17), is used in its place by much later work.
self_description:
  source: src-arxiv-1611-04678-v4
  quote: We demonstrate this accuracy for AIMD trajectories of molecules, including benzene,
    toluene, naphthalene, ethanol, uracil, and aspirin.
self_description_note: The release paper never names the data MD17; the sGDML site does ("MD17
  dataset (Chmiela et al., 2017)").
external_ids:
  arxiv: '1611.04678'
paper:
  title: Machine Learning of Accurate Energy-Conserving Molecular Force Fields
  arxiv: '1611.04678'
  doi: 10.1126/sciadv.1603015
  version_read: v4
  source: src-arxiv-1611-04678-v4
released: 2016-11-15
released_note: The paper's first arXiv version, as the abstract page dates it. Whether the data were
  posted that day is not stated; v4 points to quantum-machine.org/datasets, and the 2018 additions
  are dated by their own paper (see versions).
released_source: src-arxiv-1611-04678
released_quote: Submitted on 15 Nov 2016
release_venue: Science Advances 3(5), e1603015 (2017)
release_venue_source: src-arxiv-1611-04678
release_venue_quote: 'Journal reference: Science Advances 3(5):e1603015 (2017)'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/force-fields-potentials
domain_basis:
  reason: Learned force fields are trained on and scored against the energies and forces of
    reference quantum-chemical calculations (DFT, and CCSD(T) for the coupled-cluster sets), the
    leaf's definition. arXiv files the papers under physics.chem-ph, but the physics family's
    exclusion sends a molecule to chemistry-materials whatever the method.
  source: src-arxiv-1611-04678-v4
  quote: The total energy and force labels for each data set were computed using the PBE+vdWTS
    electronic structure method
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: The learned model stands in for ab initio MD, but the system is a molecule, which the
      physics family's exclusion test sends to chemistry-materials.
  - term: chemistry-materials/molecular-property-prediction
    reason: The scored quantities are the energy and forces of one molecule's conformations along a
      trajectory, a potential-energy surface, not a property of a molecule predicted across
      molecules; the MoleculeNet entry draws the same line.
capability:
  - scientific-prediction
  - sample-efficiency
capability_basis:
  scientific-prediction:
    reason: Systems predict energies and forces of molecular conformations, and every score compares
      them with the reference calculation.
    source: src-arxiv-1611-04678-v4
    quote: judged on the basis of the mean absolute error (MAE) and root mean square error
      performance measures
  sample-efficiency:
    reason: The release paper's claim is accuracy from about 1,000 training geometries, and it
      scores models by the number of samples needed to reach a force error of 1 kcal/mol/Å; later
      use fixes the budget at 1,000 configurations (950 + 50), the coupled-cluster sets fix a
      1,000-structure training split, and the maintainers chart published errors by training set
      size. The budget is a convention, not a rule of the DFT trajectories (review_checks).
    source: src-arxiv-1611-04678-v4
    quote: Required number of samples for a force prediction performance of MAE
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: Training and test frames are drawn from the same trajectory at the same temperature;
      nothing is held out by construction.
    source: src-arxiv-1611-04678-v4
    quote: sampled uniformly according to the MD@DFT trajectory energy distribution
  - term: transfer-learning
    reason: Fine-tuning a pretrained model on the coupled-cluster sets is how one 2025 paper uses
      them (as_used), not a protocol of the benchmark.

evaluation_method:
  - statistical-fit
evaluation_method_basis:
  reason: Every number is an error statistic (MAE, RMSE) over continuous energies and force
    components against the reference labels.
  source: src-arxiv-1611-04678-v4
  quote: judged on the basis of the mean absolute error (MAE) and root mean square error performance
    measures
evaluation_method_considered_and_rejected:
  - term: numeric-tolerance-match
    reason: No tolerance turns a prediction into pass or fail; the 1 kcal/mol/Å force error in the
      release paper is a target for counting training samples, and the reported quantity is the
      error itself.
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants are learned force fields that stand in for ab initio MD and are scored
    against what the reference method computed; the maintainers' chart lists only learned models
    (GDML, sGDML, SchNet, PhysNet, NequIP and others).
  source: src-arxiv-1611-04678-v4
  quote: using only 1000 conformational geometries for training
designed_for_subjects_considered_and_rejected:
  - term: classical-algorithm
    reason: The 2018 paper compares sGDML with the AMBER force field through dihedral distributions
      from simulations, not through MD17 test errors; no classical force field is scored on the
      benchmark in the sources read.

as_used:
  - protocol: 'MD17-10k, the protocol of Fu et al.: per molecule, 9,500 training, 500 validation and 10,000
      test conformations, scored by force MAE beside the stability of MD simulations (time to failure,
      capped at 300 ps), the distribution of interatomic distances h(r) and inference speed; run by MD-ET
      on aspirin, ethanol, naphthalene and salicylic acid.'
    split: 9,500 / 500 / 10,000 per molecule
    source: src-arxiv-2503-01431-v3
    quote: we sample 9500/500/10000 conformations for train/val/test splits for each molecule
    note: The MD-ET paper (arXiv v1 2025-03-03, v3 2026-01-29) calls MD17-10k a benchmark proposed
      by Fu et al.; the Fu et al. paper was not read.
  - protocol: Fine-tuning a model pretrained on DFT data with 1,000 and with 100 structures of the
      coupled-cluster sets, scored by force MAE on the five molecules, after the setup of the 2018
      paper.
    split: the sets' training split, or 100 structures of it; the sets' test split
    source: src-arxiv-2503-01431-v3
    quote: When fine-tuned on 1,000 CCSD(T)-level samples
  - protocol: Per molecule, 950 training and 50 validation configurations sampled uniformly from the
      trajectory, with the test error on all remaining frames; on the coupled-cluster sets the
      provided training split of 1,000 is cut into 950 and 50 and the provided test split is used.
    split: 950 / 50 / remainder (DFT trajectories); 950 / 50 / provided test split (coupled cluster)
    source: src-arxiv-2101-03164-v3
    quote: and 50 for validation, sampled uniformly from the full data set, and evaluate the test
      error on all remaining
    note: The NequIP paper (v3 2021-12-16), which reports original MD17 beside rMD17 and the
      coupled-cluster sets and says the original energies have a higher noise floor.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on MD17 and its coupled-cluster sets, for example by a 2025
    paper revised in January 2026. For the DFT molecules much current use has moved to the rmd17
    fork (review_checks).
  source: src-arxiv-2503-01431-v3
  quote: We evaluated MD-ET on QCML [45], MD17 [15], Ko2020 [67], xxMD [68] and SPICE [69]
activity: no-submission-channel
activity_note: The sGDML site's Benchmark buttons chart test errors from published papers per
  dataset; no source read describes a route by which anyone adds a result.
activity_basis:
  reason: There is no board or submission route; results are reported in papers, and the maintainers
    chart published numbers.
  source: src-sgdml-site
  quote: Test errors published for this dataset

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GDML (gradient-domain machine learning, the maintainers' own model)
    source: src-arxiv-1611-04678-v4
    observed_on: 2026-11-04
    quote: using only 1000 conformational geometries for training
  - system: NequIP
    source: src-sgdml-benchmark-aspirin-f
    observed_on: 2026-11-04
    quote: '"ref_key": "NequIP", "data": [ { "x": 1000, "y": 0.184 } ]'
    note: Charted by the maintainers at 1,000 training points (force MAE in kcal/mol/Å on aspirin).
  - system: MD-ET (fine-tuned)
    source: src-arxiv-2503-01431-v3
    observed_on: 2026-11-04
    quote: When fine-tuned on 1,000 CCSD(T)-level samples
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: "The DFT labels are PBE+vdW-TS (the PBE functional with Tkatchenko-Scheffler
  van der Waals), all-electron, computed with FHI-aims (light tier 1, as the site labels the table) along
  NVT AIMD at 500 K. The coupled-cluster labels were recomputed with Psi4 on geometries of the DFT trajectories:
  CCSD(T) with cc-pVTZ for ethanol and cc-pVDZ for toluene and malonaldehyde (the site gives cc-pVDZ for
  benzene as well), and CCSD/cc-pVDZ for aspirin. A score against one reference is a different quantity
  from a score against another, and rMD17's PBE/def2-SVP labels are a third."
ground_truth_source_basis:
  reason: The papers name the method and code for every label.
  source: src-arxiv-1802-09238-v3
  quote: correlation-consistent basis set cc-pVTZ was used for ethanol, cc-pVDZ for toluene and
    malonaldehyde and CCSD/cc-pVDZ for aspirin
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every trajectory and label is downloadable, and the maintainers' package samples training,
    validation and test sets from a dataset file; anyone can compute the errors.
  source: src-sgdml-site
  quote: The last three parameters specify the sizes for the training, validation and test dataset
    splits, which are sampled from the provided dataset file without overlap.

task:
  exists: true
  input:
    - a conformation of one of the molecules (atomic numbers and Cartesian coordinates in Å) drawn
      from its trajectory
  output: The total energy (kcal/mol) and the Cartesian force on each atom (kcal/mol/Å).
  scoring: MAE (and RMSE) of energies and of force components against the reference labels on frames
    not used for training, per molecule and at a stated training set size; the release paper
    estimates the errors by cross-validation. There is no score across molecules.
  tests_hidden_from_system: false
  tests_hidden_from_system_note: Every label is public, and for the DFT trajectories the test frames
    are whatever the user holds out. The coupled-cluster sets come with fixed train and test splits.
  source: src-arxiv-1611-04678-v4
  quote: All reported prediction errors have been estimated via crossvalidation.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The sGDML site links each trajectory as NumPy and extended-XYZ files through a
    download proxy, with no account seen on the page (a download was not tried); PyTorch Geometric's
    MD17 class fetches the same files by name. The papers point to quantum-machine.org/datasets.
  access_basis:
    reason: All trajectories and labels are public downloads.
    source: src-pyg-docs-md17
    quote: This class provides access to the original MD17 datasets, their revised versions, and the
      CCSD(T) trajectories.
  refresh: versioned-releases
  refresh_note: The 2017 set (eight molecules) was extended in 2018 with two molecules and the
    coupled-cluster sets; the eight 2017 trajectories are still listed as they were. A separately
    released FHI-aims benzene trajectory (2018) sits beside the 2017 benzene on the site without an
    explanation in the sources read.
  refresh_basis:
    reason: Changes came with the maintainers' papers, as additions.
    source: src-arxiv-1802-09238-v3
    quote: employing MD trajectories of ten molecules from benzene to azobenzene computed with DFT
  data_provenance:
    - simulation-generated
  data_provenance_note: Every frame and label comes from the maintainers' own AIMD runs (DFT) or
    their recomputation of DFT geometries at coupled-cluster level.
  data_provenance_source: src-arxiv-1802-09238-v3
  data_provenance_quote: at 500 K during a 200 ps simulation with a resolution of 0.5 fs
  contamination_risk: medium
  contamination_risk_note: Every frame and label has been public since 2017, and models pretrained
    on large molecular datasets may hold MD17 molecules; one 2025 model's pretraining set includes
    ethanol, which its authors say limits the meaning of its ethanol result. Within the benchmark,
    test frames come from the same trajectory as training frames, and the rMD17 record warns that
    frames of an MD time series are not independent samples (review_checks).
  contamination_evidence:
    - source: src-arxiv-2503-01431-v3
      stance: supports
      quote: Since there is some overlap with the pretraining set
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Zero error against the labels is the bound, but the original DFT
    energies carry numerical noise, so energy errors below a noise floor do not mean a better fit to
    PBE+vdW-TS; rMD17 was recomputed for that reason. The coupled-cluster sets have their own
    reference.
  ceiling_anchor_type_source: src-arxiv-2101-03164-v3
  ceiling_anchor_type_quote: In line with previous work [39], this suggests that the noise
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the MD17 data; the sGDML site's terms of
    use cover its training service. The rmd17 fork is CC0 (src-figshare-api-rmd17).
  size:
    - count: 10
      unit: molecular trajectories (DFT)
      subset: md17#dft, the 2018 set as hosted
      source: src-arxiv-1802-09238-v3
      quote: employing MD trajectories of ten molecules from benzene to azobenzene computed with DFT
    - count: 8
      unit: molecules (DFT), the 2017 release
      subset: version 2017
      source: src-arxiv-1611-04678-v4
      quote: for eight organic molecules with up to 21 atoms and four chemical elements
    - count: 993237
      unit: configurations, the largest trajectory (malonaldehyde)
      subset: md17#malonaldehyde
      source: src-sgdml-site
      quote: Malonaldehyde 993,237
    - count: 99999
      unit: configurations, the smallest trajectory (azobenzene)
      subset: md17#azobenzene
      source: src-sgdml-site
      quote: Azobenzene 99,999
    - count: 5
      unit: coupled-cluster datasets (four CCSD(T), one CCSD)
      subset: md17#coupled-cluster
      source: src-arxiv-1802-09238-v3
      quote: We have trained sGDML models on CCSD(T) forces for benzene, toluene, ethanol, and
        malonaldehyde. For the larger aspirin molecule, we used CCSD forces
  size_note: Per-molecule frame counts are the subsets' items, from the sGDML site's table. The
    release paper gives the range as "150 k to nearly 1 M" ("These data sets range in size from 150
    k to nearly 1 M conformational geometries with a resolution of 0.5 fs",
    src-arxiv-1611-04678-v4), but the site lists uracil at 133,770, which is also the NequIP paper's
    lower bound for the eight molecules ("resulting in data set sizes between 133,770 and 993,237
    structures", src-arxiv-2101-03164-v3).

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The sGDML group (TU Berlin Machine Learning Group, with Alexandre Tkatchenko's group
    at the University of Luxembourg)
  maintainer_basis:
    reason: The trajectories were produced by the GDML and sGDML papers' authors, whose affiliations
      are TU Berlin's Machine Learning Group and the University of Luxembourg, and are hosted on the
      sGDML site with the sgdml code.
    source: src-pyg-docs-md17
    quote: A variety of ab-initio molecular dynamics trajectories from the authors of sGDML.
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: The sGDML site keeps, for each dataset, a chart of test errors taken from
    published papers, plotted against the number of training points (for aspirin's forces 23
    entries, from DeePMD and SchNet to NequIP and ViSNet, beside the maintainers' GDML and sGDML).
    It is a compilation of others' numbers, not results the maintainers produced or a channel that
    takes them, so the vocabulary's nearest term is literature-only (review_checks).
  submission_process_source: src-sgdml-site
  submission_process_quote: Test errors published for this dataset
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-sgdml-benchmark-aspirin-f
      quote: '"ref_key": "sGDML", "data": [ { "x": 200, "y": 1.541 }'
  independence_flags_note: The maintainers released the data with their own GDML and sGDML models,
    and their chart of published errors carries both, drawn highlighted. Scoring is a plain error
    computation, so no grader has a stake; the 2025 MD-ET paper has a co-author of both MD17 papers
    among its authors.
  independence_assessed: true
  known_limitation:
    source: src-figshare-api-rmd17
    quote: Data already published with 50K samples on the original MD17 dataset should be considered
      meaningless due to this fact and due to the noise in the original data.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Not guessed. Training a potential on 1,000 frames of a small molecule is
    modest, but no source states what a run needs, and it varies with the model.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Public data and labels, and the split is the user's to sample; no human, physical or
      maintainer-only step.
    source: src-sgdml-site
    quote: The last three parameters specify the sizes for the training, validation and test dataset
      splits, which are sampled from the provided dataset file without overlap.
  harness_availability: reference-implementation-only
  harness_availability_note: The maintainers' sgdml package trains and tests their own model on a
    dataset file with user-chosen split sizes; it is the method's code, not a scoring harness for
    other models. Most papers load the data through PyTorch Geometric's MD17 class or their own
    pipelines and compute the errors themselves.
  harness: sgdml (sgdml all <dataset> <n_train> <n_validate> [<n_test>])
  harness_source: src-sgdml-site
  harness_quote: The last three parameters specify the sizes for the training, validation and test
    dataset splits, which are sampled from the provided dataset file without overlap.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for stefanch/sGDML, read 2026-11-04 (last pushed
    2025-06-13); not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The surrogate-fit profile (subset_used, training_data_policy) resolves from statistical-fit x
  # scientific-surrogate-model. Three more things change an MD17 number, and no condition field holds them:
  #   - the training set size and its split: 1,000 frames in the papers, 950 for training and 50 for validation
  #     in NequIP and later work, 9,500 + 500 in the MD17-10k protocol, 50,000 in early work that the rMD17 record
  #     calls meaningless; the maintainers' chart plots errors against it. Until a field exists it belongs in
  #     training_data_policy's note on a claim, and two claims at different sizes are not comparable;
  #   - the reference: the DFT trajectories, the coupled-cluster sets and the rmd17 fork are three label sets on
  #     overlapping geometries, so subset_used must name the md17# subset (or the claim belongs to rmd17);
  #   - the unit: kcal/mol in the data and the maintainers' chart, meV in many later papers.
  # The CCSD(T) sets' fixed splits make their numbers more comparable than the DFT trajectories', whose test
  # frames are whatever each paper held out.
  material_extra: []
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each molecule is trained and scored on its own, the maintainers chart errors per dataset,
    and no source reports an aggregate across molecules.
  source: src-sgdml-site
  quote: Test errors published for this dataset
headline_metric: null
headline_metric_note: Force MAE per molecule is the number most papers lead with; energy MAE is
  reported beside it.

homepage: http://www.sgdml.org/
repository: https://github.com/stefanch/sGDML

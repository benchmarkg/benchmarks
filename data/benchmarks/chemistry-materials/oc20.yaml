# data/benchmarks/chemistry-materials/oc20.yaml
#
# P1-S3-T01, checkpoint entry 4 of 10 (copilot off). Filled from the OC20 paper, arXiv 2010.09990 read as its
# v5 PDF (2021-09-24), and its abstract page; the Open Catalyst Project's home page; the EvalAI challenge
# that served the leaderboard until 2026-01-31; and the content file of the FAIR Chemistry leaderboard on
# Hugging Face, where OC20 is now scored. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# P1-S3-T01 drafted OC20 only and called OC22 a sibling entry. P3-S6-T02 (2026-11-24) follows the ledger instead,
# which models the three generations, OC20, OC22 and OCx24, as BenchmarkVersions of this entry; the id stays oc20
# and the name, description and task still describe OC20 (review check). It read the OC22 paper (arXiv 2206.08917,
# its v3 PDF and abstract page), the OCx24 paper (arXiv 2411.11783, its v1 PDF and abstract page), the FAIR
# Chemistry documentation's OCx24 page, fairchem's TRAIN.md at its last root commit for the EvalAI submission
# splits, EvalAI's records of the OC22 challenge (1869) and of the OC20 challenge's phases (712), and the
# Hugging Face board's scoring module. From them it added the three versions; the hidden test splits as subsets
# whose ids carry their version (oc20#oc20-test-id), each with the server that scores it; OCx24's measured targets
# as subsets of their own, which have no hidden split; eight task metrics and R²; and the OC20 and OC22 anchors in
# data/baselines/oc20.yaml. OpenDAC stays its own entry (opendac).
#
# Premises in the ledger that did not survive the sources, each recorded where it bites:
#   1. "Record the hidden test splits so held-out-server is an available verification level" holds for OC20 and
#      OC22 only. OCx24 has no test split, server or leaderboard: its models are scored by cross-validation over
#      measurements whose summaries are public (subsets, review_checks).
#   2. "Attach an assay_protocol source ref wherever ground truth is wet-lab". The schema has no version- or
#      subset-level field for it: assay_protocol is an EvalConditions field, set per claim, and the one entry-level
#      lever, comparability.material_extra, would make it material for every OC20 and OC22 claim too. The protocol
#      Source (src-arxiv-2411-11783-v1, sections 2.2 and A.4) is cited by the ocx24 version and quoted on its
#      subsets; schema/ is unchanged (comparability, review_checks).
#   3. OCx24 as wet-lab-validation, the taxonomy's own example. Its predictions are compared against measurements
#      taken before any entrant, which the term's exclusion test rules out (evaluation_method_considered_and_rejected).

id: oc20
name: Open Catalyst 2020 (OC20)
aliases:
  - OC20
  - Open Catalyst 2020
tagline: Predict DFT adsorption energies, forces and relaxed structures for adsorbates on catalyst
  surfaces.
description: >
  About 1.28 million DFT relaxations of small adsorbates (carbon, nitrogen and oxygen chemistries) on
  catalyst surfaces drawn from Materials Project bulks, with three tasks: energy and per-atom forces from
  a structure (S2EF), the relaxed structure from an initial one (IS2RS), and the relaxed energy from an
  initial structure (IS2RE). Each validation and test split has four subsplits -- in-domain, unseen adsorbates,
  unseen catalysts, and both -- and test ground truth is withheld. Scored by MAE and by the share of predictions
  within a threshold of DFT, through the maintainers' evaluation server.
self_description:
  source: src-arxiv-2010-09990-v5
  quote: The dataset and baseline models are both provided as open resources, as well as a public
    leader board to encourage community contributions to solve these important tasks
external_ids:
  arxiv: '2010.09990'
paper:
  title: The Open Catalyst 2020 (OC20) Dataset and Community Challenges
  arxiv: '2010.09990'
  doi: 10.1021/acscatal.0c04525
  version_read: v5
  source: src-arxiv-2010-09990-v5
released: 2020-10-20
released_note: The paper's first arXiv version, as the abstract page dates it (published in ACS
  Catalysis; its DOI is paper.doi); the project launch was announced on 2020-10-14.
released_source: src-arxiv-2010-09990
released_quote: Submitted on 20 Oct 2020

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/catalysis
  secondary:
    - chemistry-materials/force-fields-potentials
domain_basis:
  reason: The tasks model adsorbates on catalyst surfaces, and IS2RE's relaxed energy is what
    catalysis screening uses. S2EF scores energies and forces from structures, which is a learned
    potential's job.
  source: src-arxiv-2010-09990-v5
  quote: This is the most common task in catalysis, as the relaxed energies are often correlated
    with catalyst activity and selectivity
capability:
  - scientific-prediction
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: Systems predict energies, forces and relaxed structures of adsorbate-surface systems and
      are scored against DFT, a reference computation.
    source: src-arxiv-2010-09990-v5
    quote: Structure to Energy and Forces (S2EF ) is to take the positions of the atoms as input and
      predict the energy and per-atom forces as calculated by DFT
  distribution-shift-generalization:
    reason: Three of the four test subsplits are drawn on purpose from adsorbates, catalysts or both
      that training never saw, and each is reported as its own condition.
    source: src-arxiv-2010-09990-v5
    quote: These include In-Domain (sampled from the training distribution), Out-of-Domain Adsorbate
      (OOD Adsorbate), OOD Catalyst, and OOD Both

evaluation_method:
  - statistical-fit
  - numeric-tolerance-match
evaluation_method_basis:
  reason: Energy and force MAE are error statistics over all predictions. EwT and EFwT count a
    prediction right when it falls within a fixed threshold of the DFT value.
  source: src-arxiv-2010-09990-v5
  quote: The second measures the energies within a threshold (EwT) of the ground truth
evaluation_method_considered_and_rejected:
  - term: wet-lab-validation
    reason: OCx24's targets are wet-lab measurements, and the taxonomy lists ocx24 as qualifying,
      but the term's exclusion test rules out predictions compared against previously measured data.
      OCx24's models are fitted to its measurements and scored on held-out ones by cross-validation;
      nothing an entrant predicts is taken to a laboratory (review check).
    source: src-arxiv-2411-11783-v1
    quote: we explore whether models trained on experimental data using computational descriptors as
      input can produce results that are predictive of held out experimental data
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants stand in for DFT, a physics-based solver, and are scored against what DFT
    computed.
  source: src-arxiv-2010-09990-v5
  quote: Structure to Energy and Forces (S2EF ) is to take the positions of the atoms as input and
    predict the energy and per-atom forces as calculated by DFT

lifecycle: active
lifecycle_basis:
  reason: OC20 is scored on a new board that the maintainers' FAIR Chemistry group runs on Hugging
    Face. They moved it there after the EvalAI challenge closed, and its space was last changed on
    2026-09-14.
  source: src-hf-fairchem-leaderboard-content
  quote: This leaderboard evaluates performance on the **Open Catalyst 2020 (OC20)** dataset
activity: leaderboard-live-no-round
activity_note: The EvalAI challenge, its end date and its phases are recorded in
  src-evalai-oc20-challenge-712.
activity_basis:
  reason: OC20 ran challenge rounds (NeurIPS 2021 and 2022, and a 2023 adsorption-energy challenge).
    The EvalAI server that held them ended on 2026-01-31, and the standing board on Hugging Face
    takes submissions with no round open. Its runtime was RUNNING on 2026-10-10 (Hugging Face API).
  source: src-hf-fairchem-leaderboard-content
  quote: Users are limited to **5 successful submissions per month** for each evaluation type

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DimeNet++
    source: src-arxiv-2010-09990-v5
    observed_on: 2026-10-10
    quote: We applied three state-of-the-art graph neural network models (CGCNN, SchNet, DimeNet++)
      to each of these tasks
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: VASP relaxations with the RPBE functional; test values are withheld. That
  is OC20's and OC22's ground truth. OCx24's is experimental (electrochemical measurements of
  synthesised samples), which this field, one value per benchmark, cannot also hold; its subsets
  carry it (review check).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The training and validation data and the baselines are public, and anyone can submit test
    predictions to the maintainers' board.
  source: src-opencatalystproject-home
  quote: In addition to the data, baseline models and code are open-sourced on our Github page

task:
  exists: true
  input:
    - atom positions of an adsorbate on a catalyst surface (a structure, or an initial structure)
  output: Per task -- the adsorption energy and per-atom forces (S2EF), the relaxed atom positions
    (IS2RS), or the relaxed-state energy (IS2RE).
  scoring: MAE of energies and forces, and the share within a threshold of DFT (EwT, EFwT; AFbT for
    IS2RS), on each of the four test subsplits, through the evaluation server.
  source: src-arxiv-2010-09990-v5
  quote: Evaluation on the test set may only be done through the leaderboard

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: True of OC20, and of OC22 as far as its evaluation server shows (no source read
    states that OC22's test labels are withheld; review check). OCx24 has no held-out split; the
    summaries of its measurements are public (oc20#ocx24-her, oc20#ocx24-co2rr).
  access_basis:
    reason: Training and validation data are released, and so are test inputs. Test ground truth is
      not, and test scores come only from the maintainers' server.
    source: src-arxiv-2010-09990-v5
    quote: Ground truth test data is not publicly released
  refresh: versioned-releases
  refresh_note: The phase names are in the challenge's phase list (is2re_test_challenge_2021,
    is2re_test_2022, ads_e_test_challenge_2023), which was read but is not a Source; the quoted
    challenge record dates the server. A reviewer should confirm that the Hugging Face board scores
    the original four test subsplits only.
  refresh_basis:
    reason: The core splits are fixed. Challenge test sets were added in dated, named phases (2021,
      2022, and a 2023 adsorption-energy set), and a score names the phase it came from.
    source: src-evalai-oc20-challenge-712
    quote: '"start_date":"2021-02-17T01:00:00Z","end_date":"2026-01-31T23:59:59Z"'
  data_provenance:
    - simulation-generated
    - experimental-measurement
  data_provenance_note: OC20's are DFT relaxations, plus rattled structures and short molecular
    dynamics, on surfaces cut from Materials Project bulk materials, and OC22's are DFT relaxations
    of oxide surfaces; the quote below is OC20's. experimental-measurement is OCx24's alone, in
    data_provenance_basis.
  data_provenance_basis:
    reason: OCx24's targets are measured in the laboratory on synthesised samples, HER at 50 mA/cm2
      and CO2 reduction at five current densities, in a membrane electrode assembly; the protocol is
      the paper's section 2.2, detailed in A.4.
    source: src-arxiv-2411-11783-v1
    quote: The testing process began with the electrolyzer operating at 50 mA/cm2 for 9 minutes to
      evaluate HER activity
  data_provenance_source: src-arxiv-2010-09990-v5
  data_provenance_quote: All structure relaxations were performed using the Vienna Ab Initio
    simulation Package (VASP)
  contamination_risk: unknown
  contamination_risk_note: Test labels are withheld and test inputs are public. Two routes were not
    assessed -- whether later DFT datasets that models now train on beside OC20 (some from the same
    group) contain the test systems, and whether anyone has recomputed the test labels with the
    published DFT settings.
  contamination_evidence: []
  size_note: 1,281,040 relaxations and about 264,890,000 single-point calculations ("consisting of
    1,281,040 Density Functional Theory (DFT) relaxations"); S2EF training sets come in nested sizes
    up to all of them.
  submission_limit:
    max_submissions: 5
    period_days: 30
    per: user, per evaluation type (successful submissions, on the Hugging Face board)
    source: src-hf-fairchem-leaderboard-content

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Open Catalyst Project (FAIR at Meta, with Carnegie Mellon University's Department of
    Chemical Engineering)
  maintainer_basis:
    reason: The project is a collaboration of the two. The code is held in Meta's facebookresearch
      organisation on GitHub (fairchem), and the current board in the facebook organisation on
      Hugging Face.
    source: src-opencatalystproject-home
    quote: The Open Catalyst Project is a collaborative research effort between Fundamental AI
      Research (FAIR) at Meta and Carnegie Mellon University's (CMU) Department of Chemical
      Engineering
  maintainer_type: industry-lab
  maintainer_type_note: The holder of the code and the board is Meta's FAIR Chemistry group; CMU is
    a partner.
  submission_process:
    - held-out-server
  submission_process_source: src-arxiv-2010-09990-v5
  submission_process_quote: test datasets may be uploaded for evaluation
  independence_flags: []
  independence_flags_note: Not assessed. The board's rows were not read, because the space renders
    them by script. The maintainers build models for these tasks (fairchem's UMA has an "oc20" task
    head). If their models are ranked on the board, maintainer-competes-on-own-benchmark applies.
    Reviewer check.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline numbers are test scores, which only the maintainers' server can compute,
      because it holds the DFT labels.
    source: src-arxiv-2010-09990-v5
    quote: Evaluation on the test set may only be done through the leaderboard
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness_availability_note: fairchem holds the baselines and the metric code. The Hugging Face
    space publishes an evaluator.py beside its app, which was listed but not read; if it is the
    official scorer, this is official-harness.
  submission_channel:
    source: src-hf-fairchem-leaderboard-content
    quote: This leaderboard evaluates performance on the **Open Catalyst 2020 (OC20)** dataset
  submission_channel_note: Until 2026-01-31 the channel was EvalAI challenge 712
    (src-evalai-oc20-challenge-712). opencatalystproject.org and its leaderboard page, which linked
    "the OC20 evaluation server" in October 2026, now answer 301 to the FAIR Chemistry
    documentation's Open Catalyst Project page, which sends readers to the Hugging Face board
    (src-github-fairchem-docs-open-catalyst-project-898f840).
  code_licence: MIT
  code_licence_note: fairchem's README states an MIT licence ("`fairchem` is available under a [MIT
    License]"), read 2026-10-10 but not kept as a Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which task and test subsplit (ID or one of the three OOD), and which training
  # set (S2EF's nested sizes, and whether other DFT datasets were added) change an OC20 number.
  # P3-S6-T02: assay_protocol is deliberately not added. OCx24's targets come from one bench protocol, the paper's
  # (src-arxiv-2411-11783-v1), so the field would not separate two OCx24 claims, and the version in every claim's
  # benchmark ref (oc20@ocx24) already separates them from OC20's and OC22's. Material fields are per benchmark, not
  # per version: listing it here would count it as unknown on every OC20 and OC22 claim, which have no assay. An
  # OCx24 claim's EvalConditions.assay_protocol still names the paper (P3-S7-T04); review check.
  material_extra:
    - subset_used
    - training_data_policy

liveness:
  repo_last_commit: 2026-11-13
  leaderboard_last_updated: 2026-03-18
  reproduction_script_present: true
  last_checked: 2026-11-17

homepage: https://facebookresearch.github.io/fairchem/open-catalyst-project/
repository: https://github.com/facebookresearch/fairchem
leaderboard_url: https://huggingface.co/spaces/facebook/fairchem_leaderboard

# --- Versions, subsets and metrics (P3-S6-T02) -------------------------------------------------

versions:
  - version: oc20
    label: Open Catalyst 2020 (OC20)
    version_kind: edition
    released: 2020-10-20
    changes: The first generation. DFT relaxations of adsorbates on catalyst surfaces in three tasks
      (S2EF, IS2RS, IS2RE) scored against adsorption energies, with a test set of four subsplits
      whose labels are withheld, and challenge test sets added in 2021, 2022 and 2023.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2010-09990-v5
      - src-arxiv-2010-09990
      - src-evalai-oc20-challenge-712-phases
  - version: oc22
    label: Open Catalyst 2022 (OC22)
    version_kind: edition
    released: 2022-06-17
    changes: Oxide catalysts, 62,331 DFT relaxations, with the tasks redefined on DFT total energies
      (S2EF-Total, IS2RE-Total) beside IS2RS, and a test set of two subsplits (in-domain and
      out-of-domain compositions) scored for S2EF-Total and IS2RE-Total by its own EvalAI challenge.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2206-08917-v3
      - src-arxiv-2206-08917
      - src-evalai-oc22-challenge-1869
      - src-github-fairchem-train-md-1e07c21
  - version: ocx24
    label: Open Catalyst Experiments 2024 (OCx24)
    version_kind: edition
    released: 2024-11-18
    changes: An experimental dataset. 572 samples synthesised and characterised, and 441
      electrochemical tests of them for hydrogen evolution and CO2 reduction, averaged to 179
      targets; models predict the measured outcomes from computed descriptors and are scored by R²
      under cross-validation. Its ground truth is a laboratory measurement, its summaries are
      public, and it has no held-out split or server.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2411-11783-v1
      - src-arxiv-2411-11783
      - src-github-fairchem-docs-ocx24-d733f48
versions_note: >
  The ledger's call (P3-S6-T02): three generations by one maintainer, each a breaking edition, because
  each is new data scored on its own terms. None supersedes another: OC22 adds oxides and changes the
  energy target, OCx24 adds measurements, and OC20 is still the one a board scores. The released dates
  are the papers' first arXiv versions (src-arxiv-2010-09990, src-arxiv-2206-08917, src-arxiv-2411-11783).
  A subset belongs to the version its id names (oc20#oc22-test-id is OC22's): the Subset model has no
  version field, so tests/test_open_catalyst.py holds the tie, as tests/test_dcase_open_asr.py does for
  DCASE. OC25, listed beside them in the FAIR Chemistry documentation, was not read and is not modelled
  (review check).
versions_basis:
  reason: The generations' ground truths are not the same quantity, so no score compares across
    them; OCx24's are measurements rather than DFT.
  source: src-arxiv-2206-08917-v3
  quote: rather than ground truth values being DFT adsorption energies, we use DFT total energies
    for OC22

subsets:
  # --- OC20: the held-out test set, its four subsplits, and the challenge test sets --------------------------
  - id: oc20#oc20-test
    label: OC20 test set
    scored_separately: true
    evidence:
      - source: src-arxiv-2010-09990-v5
        quote: Ground truth test data is not publicly released
      - source: src-arxiv-2010-09990-v5
        quote: Evaluation on the test set may only be done through the leaderboard
      - source: src-evalai-oc20-challenge-712-phases
        quote: '"name":"Predicting energy and forces from structure (S2EF) -- Test","description":" ","leaderboard_public":true'
      - source: src-evalai-oc20-challenge-712-phases
        quote: '"name":"Predicting relaxed structure from initial structure (IS2RS) -- Test","description":"
          ","leaderboard_public":true'
      - source: src-evalai-oc20-challenge-712-phases
        quote: '"name":"Predicting relaxed state energy from initial structure (IS2RE) -- Test","description":"
          ","leaderboard_public":true'
      - source: src-github-fairchem-train-md-1e07c21
        quote: A submission must contain results from the 4 different splits - in distribution (id),
          out of distribution adsorbate (ood ads), out of distribution catalyst (ood cat), and out
          of distribution adsorbate and catalyst (ood both)
      - source: src-hf-fairchem-leaderboard-evaluator-212fd1e
        quote: metrics["avg_energy_mae"] = np.mean(energy_maes)
    notes: The whole held-out test set, whose score is the mean over its four subsplits (the Hugging
      Face board's avg_energy_mae). Scored by EvalAI challenge 712's S2EF, IS2RS and IS2RE test
      phases until 2026-01-31, and since then by the Hugging Face board for S2EF and IS2RE only.
  - id: oc20#oc20-test-id
    label: OC20 test, in-domain
    parent: oc20#oc20-test
    scored_separately: true
    evidence:
      - source: src-arxiv-2010-09990-v5
        quote: These include In-Domain (sampled from the training distribution)
      - source: src-hf-fairchem-leaderboard-evaluator-212fd1e
        quote: subsets=["id", "ood_ads", "ood_cat", "ood_both"],
  - id: oc20#oc20-test-ood-ads
    label: OC20 test, out-of-domain adsorbates
    parent: oc20#oc20-test
    scored_separately: true
    evidence:
      - source: src-arxiv-2010-09990-v5
        quote: Out-of-Domain Adsorbate (OOD Adsorbate)
      - source: src-hf-fairchem-leaderboard-evaluator-212fd1e
        quote: subsets=["id", "ood_ads", "ood_cat", "ood_both"],
  - id: oc20#oc20-test-ood-cat
    label: OC20 test, out-of-domain catalysts
    parent: oc20#oc20-test
    scored_separately: true
    evidence:
      - source: src-arxiv-2010-09990-v5
        quote: OOD Catalyst, and OOD Both
      - source: src-hf-fairchem-leaderboard-evaluator-212fd1e
        quote: subsets=["id", "ood_ads", "ood_cat", "ood_both"],
  - id: oc20#oc20-test-ood-both
    label: OC20 test, out-of-domain adsorbates and catalysts
    parent: oc20#oc20-test
    scored_separately: true
    evidence:
      - source: src-arxiv-2010-09990-v5
        quote: OOD Both (both unseen adsorbate and unseen catalyst compositions)
      - source: src-hf-fairchem-leaderboard-evaluator-212fd1e
        quote: subsets=["id", "ood_ads", "ood_cat", "ood_both"],
  - id: oc20#oc20-test-challenge-2021
    label: OC20 IS2RE test-challenge, 2021
    scored_separately: true
    evidence:
      - source: src-evalai-oc20-challenge-712-phases
        quote: (IS2RE) -- Test-challenge","description":"
          ","leaderboard_public":false,"start_date":"2021-09-14T07:00:00Z"
    notes: The 2021 challenge's IS2RE test set, a phase of challenge 712 with a private leaderboard,
      closed with the server on 2026-01-31.
  - id: oc20#oc20-test-challenge-2022
    label: OC20 IS2RE test-challenge, 2022
    scored_separately: true
    evidence:
      - source: src-evalai-oc20-challenge-712-phases
        quote: (IS2RE) -- Test-challenge-2022","description":"
          ","leaderboard_public":false,"start_date":"2022-09-20T07:00:00Z"
    notes: The 2022 challenge's IS2RE test set, as above.
  - id: oc20#oc20-test-challenge-2023
    label: OC20 adsorption-energy test-challenge, 2023
    scored_separately: true
    evidence:
      - source: src-evalai-oc20-challenge-712-phases
        quote: '"name":"Predicting adsorption energy given an adsorbate and a catalyst surface -- Test-challenge-2023","description":"
          ","leaderboard_public":false'
    notes: The 2023 challenge's test set, for a task the phase names (the adsorption energy of an
      adsorbate and a catalyst surface); no source read defines its metric, so no Metric record
      covers it.
  # --- OC22: the held-out test set and its two subsplits ------------------------------------------------------
  - id: oc20#oc22-test
    label: OC22 test set
    scored_separately: true
    evidence:
      - source: src-evalai-oc22-challenge-1869
        quote: This page hosts evaluation servers for two tasks on the Open Catalyst 2022 (OC22)
          dataset
      - source: src-github-fairchem-train-md-1e07c21
        quote: A submission must contain results from the 2 different splits - in distribution (id)
          and out of distribution (ood)
      - source: src-arxiv-2206-08917-v3
        quote: Validation and test splits are similar in size with exclusive compositions
    notes: Scored for S2EF-Total and IS2RE-Total by EvalAI challenge 1869 until 2026-01-31; the
      Hugging Face board's scorer takes OC20's test types only, so no server has scored OC22 since.
      No source read states that its test labels are withheld (review check). OC22's IS2RS had no
      server phase, and the paper's IS2RS test numbers are the maintainers' own.
  - id: oc20#oc22-test-id
    label: OC22 test, in-domain
    parent: oc20#oc22-test
    scored_separately: true
    evidence:
      - source: src-arxiv-2206-08917-v3
        quote: Splits are sampled based on catalyst composition, ID for those from the same
          distribution as training, OOD for unseen catalyst compositions
  - id: oc20#oc22-test-ood
    label: OC22 test, out-of-domain compositions
    parent: oc20#oc22-test
    scored_separately: true
    evidence:
      - source: src-arxiv-2206-08917-v3
        quote: Splits are sampled based on catalyst composition, ID for those from the same
          distribution as training, OOD for unseen catalyst compositions
  # --- OCx24: the measured targets, by reaction, and the two cross-validation strategies -----------------------
  - id: oc20#ocx24-her
    label: OCx24 hydrogen evolution (measured voltage at 50 mA/cm2)
    scored_separately: true
    metric_override: r-squared
    evidence:
      - source: src-arxiv-2411-11783-v1
        quote: The testing process began with the electrolyzer operating at 50 mA/cm2 for 9 minutes
          to evaluate HER activity
      - source: src-arxiv-2411-11783-v1
        quote: Models were trained to predict the cell voltage at 50 mA/cm2 production rate using
          the adsorption energies of H and OH as features
      - source: src-arxiv-2411-11783-v1

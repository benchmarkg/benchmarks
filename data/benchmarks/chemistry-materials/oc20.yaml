# data/benchmarks/chemistry-materials/oc20.yaml
#
# P1-S3-T01, checkpoint entry 4 of 10 (copilot off). Filled from the OC20 paper, arXiv 2010.09990 read as its
# v5 PDF (2021-09-24), and its abstract page; the Open Catalyst Project's home page; the EvalAI challenge
# that served the leaderboard until 2026-01-31; and the content file of the FAIR Chemistry leaderboard on
# Hugging Face, where OC20 is now scored. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# OC20 only. The Open Catalyst Project also released OC22 (oxides, its own leaderboard) and OpenDAC; Stage 3
# classified "Open Catalyst (OC20/OC22)" as one corpus item, but the two datasets have separate tasks,
# splits and boards, so OC22 is a sibling entry, not part of this one.

id: oc20
name: Open Catalyst 2020 (OC20)
aliases:
  - OC20
  - Open Catalyst 2020
tagline: Predict DFT adsorption energies, forces and relaxed structures for adsorbates on catalyst surfaces.
description: >
  About 1.28 million DFT relaxations of small adsorbates (carbon, nitrogen and oxygen chemistries) on
  catalyst surfaces drawn from Materials Project bulks, with three tasks: energy and per-atom forces from a
  structure (S2EF), the relaxed structure from an initial one (IS2RS), and the relaxed energy from an initial
  structure (IS2RE). Each validation and test split has four subsplits -- in-domain, unseen adsorbates,
  unseen catalysts, and both -- and test ground truth is withheld. Scored by MAE and by the share of
  predictions within a threshold of DFT, through the maintainers' evaluation server.
self_description:
  source: src-arxiv-2010-09990-v5
  quote: The dataset and baseline models are both provided as open resources, as well as a public leader board
    to encourage community contributions to solve these important tasks
external_ids:
  arxiv: '2010.09990'
paper:
  title: The Open Catalyst 2020 (OC20) Dataset and Community Challenges
  arxiv: '2010.09990'
  version_read: v5
  source: src-arxiv-2010-09990-v5
released: 2020-10-20
released_note: The paper's first arXiv version, as the abstract page dates it (published in ACS Catalysis,
  doi:10.1021/acscatal.0c04525, which no field of the entry holds); the project launch was announced
  on 2020-10-14.
released_source: src-arxiv-2010-09990
released_quote: Submitted on 20 Oct 2020

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/catalysis
  secondary:
    - chemistry-materials/force-fields-potentials
domain_basis:
  reason: The tasks model adsorbates on catalyst surfaces, and IS2RE's relaxed energy is what catalysis screening
    uses. S2EF scores energies and forces from structures, which is a learned potential's job.
  source: src-arxiv-2010-09990-v5
  quote: This is the most common task in catalysis, as the relaxed energies are often correlated with catalyst
    activity and selectivity
capability:
  - scientific-prediction
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: Systems predict energies, forces and relaxed structures of adsorbate-surface systems and are scored
      against DFT, a reference computation.
    source: src-arxiv-2010-09990-v5
    quote: Structure to Energy and Forces (S2EF ) is to take the positions of the atoms as input and predict the
      energy and per-atom forces as calculated by DFT
  distribution-shift-generalization:
    reason: Three of the four test subsplits are drawn on purpose from adsorbates, catalysts or both that
      training never saw, and each is reported as its own condition.
    source: src-arxiv-2010-09990-v5
    quote: These include In-Domain (sampled from the training distribution), Out-of-Domain Adsorbate (OOD
      Adsorbate), OOD Catalyst, and OOD Both

evaluation_method:
  - statistical-fit
  - numeric-tolerance-match
evaluation_method_basis:
  reason: Energy and force MAE are error statistics over all predictions. EwT and EFwT count a prediction right
    when it falls within a fixed threshold of the DFT value.
  source: src-arxiv-2010-09990-v5
  quote: The second measures the energies within a threshold (EwT) of the ground truth

lifecycle: active
lifecycle_basis:
  reason: OC20 is scored on a new board that the maintainers' FAIR Chemistry group runs on Hugging Face. They
    moved it there after the EvalAI challenge closed, and its space was last changed on 2026-09-14.
  source: src-hf-fairchem-leaderboard-content
  quote: This leaderboard evaluates performance on the **Open Catalyst 2020 (OC20)** dataset
activity: leaderboard-live-no-round
activity_basis:
  reason: OC20 ran challenge rounds (NeurIPS 2021 and 2022, and a 2023 adsorption-energy challenge). The EvalAI
    server that held them ended on 2026-01-31, and the standing board on Hugging Face takes submissions with no
    round open. Its runtime was RUNNING on 2026-10-10 (Hugging Face API).
  source: src-hf-fairchem-leaderboard-content
  quote: Users are limited to **5 successful submissions per month** for each evaluation type
activity_note: The EvalAI challenge, its end date and its phases are recorded in src-evalai-oc20-challenge-712.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DimeNet++
    source: src-arxiv-2010-09990-v5
    observed_on: 2026-10-10
    quote: We applied three state-of-the-art graph neural network models (CGCNN, SchNet, DimeNet++) to each of
      these tasks
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants stand in for DFT, a physics-based solver, and are scored against what DFT computed.
  source: src-arxiv-2010-09990-v5
  quote: Structure to Energy and Forces (S2EF ) is to take the positions of the atoms as input and predict the
    energy and per-atom forces as calculated by DFT
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: VASP relaxations with the RPBE functional; test values are withheld.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The training and validation data and the baselines are public, and anyone can submit test predictions
    to the maintainers' board.
  source: src-opencatalystproject-home
  quote: In addition to the data, baseline models and code are open-sourced on our Github page

task:
  exists: true
  input:
    - atom positions of an adsorbate on a catalyst surface (a structure, or an initial structure)
  output: Per task -- the adsorption energy and per-atom forces (S2EF), the relaxed atom positions (IS2RS), or
    the relaxed-state energy (IS2RE).
  scoring: MAE of energies and forces, and the share within a threshold of DFT (EwT, EFwT; AFbT for IS2RS), on
    each of the four test subsplits, through the evaluation server.
  source: src-arxiv-2010-09990-v5
  quote: Evaluation on the test set may only be done through the leaderboard

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_basis:
    reason: Training and validation data are released, and so are test inputs. Test ground truth is not, and
      test scores come only from the maintainers' server.
    source: src-arxiv-2010-09990-v5
    quote: Ground truth test data is not publicly released
  refresh: versioned-releases
  refresh_basis:
    reason: The core splits are fixed. Challenge test sets were added in dated, named phases (2021, 2022, and a
      2023 adsorption-energy set), and a score names the phase it came from.
    source: src-evalai-oc20-challenge-712
    quote: '"start_date":"2021-02-17T01:00:00Z","end_date":"2026-01-31T23:59:59Z"'
  refresh_note: The phase names are in the challenge's phase list (is2re_test_challenge_2021, is2re_test_2022,
    ads_e_test_challenge_2023), which was read but is not a Source; the quoted challenge record dates the
    server. A reviewer should confirm that the Hugging Face board scores the original four test subsplits only.
  data_provenance:
    - simulation-generated
  data_provenance_note: DFT relaxations, plus rattled structures and short molecular dynamics, on surfaces cut
    from Materials Project bulk materials.
  data_provenance_source: src-arxiv-2010-09990-v5
  data_provenance_quote: All structure relaxations were performed using the Vienna Ab Initio simulation Package
    (VASP)
  contamination_risk: unknown
  contamination_risk_note: Test labels are withheld and test inputs are public. Two routes were not assessed --
    whether later DFT datasets that models now train on beside OC20 (some from the same group) contain the
    test systems, and whether anyone has recomputed the test labels with the published DFT settings.
  contamination_evidence: []
  submission_limit:
    max_submissions: 5
    period_days: 30
    per: user, per evaluation type (successful submissions, on the Hugging Face board)
    source: src-hf-fairchem-leaderboard-content
  size_note: 1,281,040 relaxations and about 264,890,000 single-point calculations ("consisting of 1,281,040
    Density Functional Theory (DFT) relaxations"); S2EF training sets come in nested sizes up to all of them.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Open Catalyst Project (FAIR at Meta, with Carnegie Mellon University's Department of Chemical
    Engineering)
  maintainer_basis:
    reason: The project is a collaboration of the two. The code is held in the FAIR-Chem organisation, and the
      current board in the facebook organisation on Hugging Face.
    source: src-opencatalystproject-home
    quote: The Open Catalyst Project is a collaborative research effort between Fundamental AI Research (FAIR)
      at Meta and Carnegie Mellon University's (CMU) Department of Chemical Engineering
  maintainer_type: industry-lab
  maintainer_type_note: The holder of the code and the board is Meta's FAIR Chemistry group; CMU is a partner.
  submission_process:
    - held-out-server
  submission_process_source: src-arxiv-2010-09990-v5
  submission_process_quote: test datasets may be uploaded for evaluation
  independence_flags: []
  independence_flags_note: Not assessed. The board's rows were not read, because the space renders them by
    script. The maintainers build models for these tasks (fairchem's UMA has an "oc20" task head). If their
    models are ranked on the board, maintainer-competes-on-own-benchmark applies. Reviewer check.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline numbers are test scores, which only the maintainers' server can compute, because it
      holds the DFT labels.
    source: src-arxiv-2010-09990-v5
    quote: Evaluation on the test set may only be done through the leaderboard
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness_availability_note: fairchem holds the baselines and the metric code. The Hugging Face space publishes
    an evaluator.py beside its app, which was listed but not read; if it is the official scorer, this is
    official-harness.
  runnable_via:
    - custom
  code_licence: MIT
  code_licence_note: fairchem's README states an MIT licence ("`fairchem` is available under a [MIT
    License]"), read 2026-10-10 but not kept as a Source.
  maintainer_rerun_policy: unstated
  submission_channel:
    source: src-hf-fairchem-leaderboard-content
    quote: This leaderboard evaluates performance on the **Open Catalyst 2020 (OC20)** dataset
  submission_channel_note: Until 2026-01-31 the channel was EvalAI challenge 712 (src-evalai-oc20-challenge-712);
    opencatalystproject.org's leaderboard page still links "the OC20 evaluation server".

comparability:
  # Beyond the fallback profile: which task and test subsplit (ID or one of the three OOD), and which training
  # set (S2EF's nested sizes, and whether other DFT datasets were added) change an OC20 number.
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://opencatalystproject.org/
repository: https://github.com/FAIR-Chem/fairchem
leaderboard_url: https://huggingface.co/spaces/facebook/fairchem_leaderboard

tags:
  - catalysis
  - dft
  - machine-learned-potentials
  - graph-neural-networks


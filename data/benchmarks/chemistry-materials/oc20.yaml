subsets_note: >
  Each subset's id names its version (oc20, oc22, ocx24). The OC20 and OC22 test subsets are the hidden
  splits that make held-out-server a verification level a claim on those versions can hold: their labels
  stay with the maintainers and a server scored them, quoted on each. The challenge test sets of 2021-2023
  are OC20's too. OCx24's subsets are its measured targets, by reaction, with the two cross-validation
  strategies as children because they move R² by tens of points; their wet-lab protocol and replicate
  noise are quoted from the paper, and no subset of theirs is a held-out split. The tasks (S2EF, IS2RS,
  IS2RE) are not subsets: each task's metrics are their own records, so the (metric, subset) pair names
  the task and the split.
metrics:
  - oc-s2ef-energy-mae
  - oc-s2ef-force-mae
  - oc-s2ef-force-cosine
  - oc-s2ef-efwt
  - oc-is2re-energy-mae
  - oc-is2re-ewt
  - oc-is2rs-adwt
  - oc-is2rs-afbt
  - r-squared
metrics_note: >
  The OC20 paper's metrics for its three tasks, which OC22 keeps on total energies ("uses the same metrics"),
  one record per task because the papers define each task's energy error on a different energy; FbT, AFbT's
  single-threshold form, is not recorded. The Hugging Face board scores the two energy MAEs and the force
  MAE. r-squared is OCx24's. Their anchors are in data/baselines/oc20.yaml: a theoretical-maximum ceiling
  for each OC20 and OC22 metric, and the OC22 paper's median and initial-structure floors; OCx24 has none
  (that file's header says why).

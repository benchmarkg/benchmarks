# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2410-23326-v3
    - src-arxiv-2410-23326
    - src-github-massspecgym-readme
    - src-github-massspecgym-de-novo-bonus-csv
    - src-github-massspecgym-simulation-bonus-csv
    - src-hf-api-massspecgym
    - src-hf-massspecgym-card
    - src-arxiv-2606-19624-v2
    - src-arxiv-2606-19624
    - src-arxiv-2502-09571-v2
  sources_note: >
    The papers' PDFs and abstract pages carry DOIs and are not archived; the README, the two results
    tables (pinned to commit f259fe3), the Hugging Face API record and the dataset card (pinned to sha
    018a954) are pending archive. The other four results tables (de_novo.csv, retrieval.csv,
    retrieval_bonus.csv, simulation.csv) were read at the same commit but are not Sources; nothing
    below quotes them. The datasheet's contact addresses and the dataset account's handle are kept out
    of the extracts.
  confidence: medium
  review_checks:
    - check: CASMI against MassSpecGym, for the two entries' boundary. CASMI (the Critical
        Assessment of Small Molecule Identification) is a periodic blind contest, run six times
        since 2012, with a few hundred challenge spectra per edition and preprocessing that takes
        mass-spectrometry expertise; it is an edition series. MassSpecGym is a fixed,
        machine-learning-ready release with a public test fold of 17,556 spectra, a
        structure-distance split and three tasks, scored continuously by anyone. MassSpecGym grew
        out of a Dagstuhl seminar, not out of CASMI, and neither is a version, variant or fork of
        the other, so no lineage link is recorded; correlates_with may suit if the CASMI entry finds
        shared methods.
      field: lineage
      source: src-arxiv-2410-23326-v3
      quote: However, the CASMI challenge is held only once every two years at best, limiting
        opportunities for continuous evaluation and benchmarking.
    - check: lifecycle active against under-revision. v1.5 is released (audit v1 of 2026-06-17,
        dataset card updated 2026-10-26), but the commit that brought it to GitHub is titled
        "MassSpecGym v1.5 (part 1/2)" (2026-05-08, GitHub's commit list; not a quoted Source), the
        README does not mention v1.5, and the results tables lack the audit's corrected rows. If a
        part 2 is announced, the term would be under-revision and v1.5's frozen false would stand.
      field: lifecycle
    - check: versions. v1.5 is modelled as a revision of the same items by the same maintainers
        (Pluskal is one of the audit's corresponding authors, and the files are in the same
        repositories), not as a fork by the Coley group or Enveda, who co-author the audit. breaking
        true rests on retrieval results that exploited the v1.0 canonicalisation collapsing under
        v1.5; the audit says honest de novo rankings barely move.
      field: versions
      source: src-arxiv-2606-19624-v2
      quote: MassSpecGym v1.5 as a benchmark revision.
    - check: contamination_risk medium. The audit evidences leakage through entrants' pretraining
        sets, simulators and formula annotators, and finds evaluation issues in at least 18 of 26
        papers. The vocabulary keeps a route evidenced for particular entrants on their claims, but
        when most entrants take it, high may be the better reading.
      field: data.contamination_risk
      source: src-arxiv-2606-19624-v2
      quote: We find evaluation issues in at least 18 of 26 papers reporting MassSpecGym benchmark
        results in the first year of its adoption.
    - check: The audit's abstract page says 17 of 26 papers; its v2 PDF says 18. The entry quotes
        the PDF.
      field: description
      source: src-arxiv-2606-19624
      quote: We find evaluation issues in at least 17 of 26 papers reporting MassSpecGym benchmark
        results in the first year of its adoption.
    - check: activity accepting-submissions while the leaderboard site answers 503 and the results
        tables' newest third-party row is dated 2025-09-16. Whether the pull-request route is still
        being acted on was not checked (open pull requests were not read).
      field: activity
    - check: Metric divergence makes table rows incomparable as listed. de_novo_bonus.csv gives
        DiffMS a top-1 MCES of 18.45, from DiffMS's paper; the audit recomputes it with the pinned
        myopic MCES threshold of 15 and reports 13.96. Whether the tables should be read as v1.0
        results under the paper's metric code, and whether to record the audit's corrected rows as
        the claims of record.
      field: execution.harness_gotcha
      source: src-arxiv-2606-19624-v2
      quote: to correctly use a myopic threshold of 15 instead of 100
    - check: evaluation_method and profile. exact-match for top-k accuracy and hit rate at k (a
        per-item verdict on the 2D InChIKey), domain-metric for MCES and Tanimoto, statistical-fit
        for spectral cosine and Jensen-Shannon similarity. Spectral cosine is the standard
        similarity in mass spectrometry and could be read as domain-metric. The exact-match pair
        resolves llm-static-text, whose five prompt fields are waived, as for uspto-50k.
      field: evaluation_method
      specialist: true
    - check: capability. perception is rejected because the input is a processed peak list and the
        claim is a chemical inference; hypothesis-generation because the k de novo guesses hedge one
        determinate answer. A mass spectrometrist may read the spectrum as a raw signal.
      field: capability
      specialist: true
    - check: training_data_eligibility_tiers left empty. The board does not split entrants by what
        they may train on. The audit's tables mark methods that use data beyond MassSpecGym's
        spectrum and molecule pairs, and v1.5 offers official filtered pretraining sets, but neither
        is a rule that groups the ranking; if the maintainers make one, the tiers belong here and
        the eligibility-gated profile would make them material.
      field: training_data_eligibility_tiers
      source: src-arxiv-2606-19624-v2
      quote: The auxiliary data column marks methods that rely on data beyond the MassSpecGym
        spectrum–molecule pairs.
    - check: maintainer-competes-on-own-benchmark rests on the DeepSets + Fourier features baseline,
        built on the maintainers' DreaMS work, and on the v1.5 audit re-ranking the Coley group's
        models with the Coley group as co-authors; none is a model built to top the board.
      field: governance.independence_flags
  unreachable:
    - url: https://massspecgym.onrender.com/
      http_status: 503
      consequence: The leaderboard site was not read; its body said "This service has been
        suspended", Wayback holds no capture, and the board is read from the repository's results
        tables that fed it.
  personal_data_excluded:
    - source: src-arxiv-2410-23326-v3
      what: The datasheet's contact e-mail addresses, kept out of the extract's windows.
    - source: src-arxiv-2606-19624-v2
      what: The correspondence line with the corresponding authors' e-mail addresses.
    - source: src-hf-api-massspecgym
      what: The dataset account's personal handle, kept out of the extract's windows.

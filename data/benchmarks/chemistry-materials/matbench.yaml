# data/benchmarks/chemistry-materials/matbench.yaml
#
# P1-S6-T02, chemistry-materials entry 13. Filled from the Matbench paper, arXiv 2005.00707 read as its v2 PDF
# (2020-05-08), and its abstract page; Crossref's record of the npj Computational Materials article
# (10.1038/s41524-020-00406-3) for the venue, since nature.com's robots.txt disallows this agent; five files of
# the materialsproject/matbench repository at one pinned commit (35f88110a51a, 2026-11-02): the README and the
# Markdown sources from which matbench.materialsproject.org is built (the leaderboard home, the matbench_v0.1
# benchmark-info page, the notes on benchmarking, and the run and submit guides); the abstract page of MatterVial
# (arXiv 2509.03547, September 2025) as evidence of current use; and the Matbench Discovery paper's arXiv v3 PDF
# for what it says about Matbench. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts. Repository facts marked "GitHub API" were read from the API on 2026-11-04 and are
# not quoted Sources.
#
# One entry for Matbench v0.1, the only benchmark version the sources name, with its 13 tasks as subsets.
# Matbench Discovery (data/benchmarks/chemistry-materials/matbench-discovery.yaml) is a separate benchmark and
# not a lineage child of this one; the argument is in lineage_note and a review check.

id: matbench
name: Matbench
aliases:
  - MatBench
aliases_note: The paper's abstract writes MatBench once; the paper's body, the README and the site
  write Matbench. Not the same benchmark as Matbench Discovery (2023), whose name it shares
  (lineage_note).
aliases_source: src-arxiv-2005-00707
aliases_quote: We encourage evaluating new materials ML algorithms on the MatBench benchmark
tagline: 13 tasks predicting properties of inorganic materials from composition or structure, by
  nested cross-validation.
description: >
  The Materials Project's benchmark for supervised machine learning on inorganic bulk materials, released
  in 2020 as Matbench v0.1 with Automatminer, an AutoML reference algorithm. Its 13 tasks, drawn from
  ten datasets, run from 312 to 132,752 samples: nine take a crystal structure (DFT formation energies,
  band gaps and metallicity from the Materials Project, elastic moduli, refractive index, phonon peak
  frequency, perovskite formation energies, 2D exfoliation energies) and four take only a composition
  (experimental band gap and metallicity, metallic-glass formation, steel yield strength). Each task is
  scored by five-fold nested cross-validation on fixed folds the Python package hands out: MAE for the
  ten regression tasks, ROC-AUC for the three classification tasks, averaged over the folds. There is
  no score across tasks; the leaderboard ranks general-purpose algorithms, which must run all 13, all
  10 regression or all 9 structure tasks with one configuration, apart from task-specific ones. Submissions
  are pull requests of recorded predictions plus code. Known weaknesses the sources name: the classification
  ROC-AUC scores on the board were computed on thresholded predictions and equal balanced accuracy, and
  the folds are random, so they do not test extrapolation to new chemistries.
self_description:
  source: src-arxiv-2005-00707
  quote: The test suite, Matbench, is a set of 13 ML tasks that range in size from 312 to 132k
    samples and contain data from 10 density functional theory-derived and experimental sources.
external_ids:
  arxiv: '2005.00707'
paper:
  title: 'Benchmarking Materials Property Prediction Methods: The Matbench Test Set and Automatminer Reference
    Algorithm'
  arxiv: '2005.00707'
  doi: 10.1038/s41524-020-00406-3
  version_read: v2
  source: src-arxiv-2005-00707-v2
released: 2020-05-02
released_note: The paper's first arXiv version, as the abstract page dates it; the journal article
  followed on 2020-09-15 (Crossref). The repository was created on 2021-02-24 (GitHub API), after
  the datasets were first distributed through matminer and Automatminer's documentation.
released_source: src-arxiv-2005-00707
released_quote: Submitted on 2 May 2020 (v1), last revised 8 May 2020 (this version, v2)
release_venue: npj Computational Materials 6, 138 (2020)
release_venue_note: Crossref lists a correction to the article (10.1038/s41524-020-00433-0,
  2020-10-16), whose content was not read (review_checks).
release_venue_source: src-crossref-10-1038-s41524-020-00406-3
release_venue_quote: '"container-title":["npj Computational Materials"]'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/molecular-property-prediction
domain_basis:
  reason: The subject is matter at the crystalline scale, so the family is chemistry-materials, and
    every task predicts a property of a material from its structure or composition. No leaf names
    the property prediction of materials as opposed to molecules (a tag-gap is logged,
    taxonomy/_failures/); the nearest is molecular-property-prediction, whose definition asks for "a
    property of a molecule from its structure", and none of the 13 inputs is a molecule
    (review_checks).
  source: src-arxiv-2005-00707
  quote: We present a benchmark test suite and an automated machine learning procedure for
    evaluating supervised machine learning (ML) models for predicting properties of inorganic bulk
    materials.
domain_considered_and_rejected:
  - term: chemistry-materials/crystal-stability-discovery
    reason: Two tasks (matbench_mp_e_form, matbench_perovskites) regress a formation energy, but
      nothing is screened for stability against a hull and no task asks which candidates are worth
      making; the Matbench Discovery paper names that gap in Matbench as its reason to exist.
    source: src-arxiv-2308-14920-v3
    quote: Importantly, all tasks were exclusively concerned with the properties of known materials.
  - term: chemistry-materials/force-fields-potentials
    reason: The targets are properties of relaxed structures (moduli, gaps, formation energies, the
      last phonon DOS peak), not energies and forces along trajectories that a learned potential
      would supply.
  - term: physics/condensed-matter
    reason: The physics family's exclusion test sends a crystal or material to chemistry-materials
      even when the method is physics.

capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: Systems predict optical, thermal, electronic, thermodynamic, mechanical and elastic
      properties of materials and are scored against DFT calculations or measurements.
    source: src-arxiv-2005-00707
    quote: Tasks include predicting optical, thermal, electronic, thermodynamic, tensile, and
      elastic properties given a materials composition and/or crystal structure.
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The outer folds are uniform random KFold (stratified for classification), so test
      materials come from the same chemical systems as training ones; the paper discusses grouped
      cross-validation as a limitation and does not adopt it.
    source: src-arxiv-2005-00707-v2
    quote: However, a randomized train/test split would likely result in selecting some data points
      from all chemical systems for the training and testing data.
  - term: sample-efficiency
    reason: Task sizes span three orders of magnitude and the paper analyses error against dataset
      size, but no task fixes a training budget and scores at it.
  - term: transfer-learning
    reason: Each task is trained and scored on its own folds; pretraining on outside data is how
      some entrants approach it (as_used), not a protocol the benchmark reports.

evaluation_method:
  - statistical-fit
  - classification-metric
evaluation_method_basis:
  reason: The ten regression tasks are scored by MAE and the three classification tasks by ROC-AUC,
    each the mean over the five outer folds of a nested cross-validation.
  source: src-arxiv-2005-00707-v2
  quote: Numbers on each square represent either the mean average error (regression) or mean ROC-AUC
    (classification) of a five-fold nested cross validation (NCV)
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: MAE and ROC-AUC are general-purpose statistics, which the term's exclusion test names;
      the units are the materials' own, the metrics are not.
  - term: composite
    reason: The leaderboard's scaled error (MAE over MAD, or (1 - ROC-AUC)/0.5) puts all tasks on
      one axis in a figure, but no combined score is computed or ranked (aggregation_policy).
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants are models trained on each task's training folds to stand in for the DFT or
    DFPT calculation (nine tasks) or the laboratory measurement (four tasks) that produced its
    labels, and are scored against those labels.
  source: src-arxiv-2005-00707-v2
  quote: representing both relatively scarce experimental materials properties and comparatively
    abundant properties such as DFT-GGA19 formation energies.
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: Its inclusion test names AutoML suites refitted on each dataset, which is what
      Automatminer, the reference algorithm, is; but its exclusion test sends tasks a scientific
      discipline defines elsewhere, and these are materials-science tasks (review_checks).
  - term: domain-specialist-model
    reason: Its exclusion test sends models that emulate a calculation or measurement to
      scientific-surrogate-model; the MoleculeNet entry made the same call.
  - term: classical-algorithm
    reason: Every ranked entrant is learned, the random forest and the Dummy control included; the
      Dummy predicts the training mean and is a floor, not a classical method of computing the
      property.
    source: src-arxiv-2005-00707-v2
    quote: To simulate a control, a Dummy model predicts the mean of the training set (regression)
as_used:
  - protocol: MODNet, a feature-based model, augmented with latent features from pretrained graph
      networks (MEGNet, ROOST, ORB) and with symbolic-regression features, evaluated on Matbench
      tasks.
    source: src-arxiv-2509-03547
    quote: When augmenting the feature-based model MODNet on Matbench tasks, this method yields
      significant error reductions
    note: Gouvêa et al., MatterVial (arXiv v1 2025-09-02, v2 2025-09-05). The abstract does not say
      which tasks or folds; the pretrained feature extractors were trained on outside data, which
      the general-purpose rules do not address (comparability).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the tasks, for example by a 2025 study augmenting MODNet.
    The last submission merged into the repository's benchmarks folder dates from 2024-01-20, while
    new-benchmark pull requests opened in October and November 2026 are pending (GitHub API), which
    is maintenance evidence, not lifecycle.
  source: src-arxiv-2509-03547
  quote: elevates its performance to be competitive with, and in several cases superior to,
    state-of-the-art end-to-end GNNs
activity: accepting-submissions
activity_note: Submissions are pull requests that add a folder under benchmarks/; a maintainer
  labels them new_benchmark and they are merged when the tests pass. On 2026-11-04 three such pull
  requests were open (the newest opened that day) and the last merged one dates from January 2024
  (GitHub API).
activity_basis:
  reason: The submission guide describes an open, always-available route.
  source: src-github-matbench-docs-submit
  quote: "**And you're done! If the tests pass, your submission will be added to the leaderboard!**"

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: CGCNN and MEGNet (crystal graph networks)
    source: src-arxiv-2005-00707-v2
    observed_on: 2026-11-04
    quote: Finally, for tasks containing relaxed structures, we also test against CGCNN33 and
      MEGNet36, two graph-network algorithms for general-purpose property prediction.
  - system: coGN
    source: src-github-matbench-docs-index
    observed_on: 2026-11-04
    quote: '[matbench_mp_e_form](Leaderboards%20Per-Task/matbench_v0.1_matbench_mp_e_form.md) | 132,752
      | [coGN](Full%20Benchmark%20Data/matbench_v0.1_coGN.md) | **0.0170 (eV/atom)** | structure required
      |'
    note: The best general-purpose entry on matbench_mp_e_form, a graph network.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Nine of the 13 tasks have DFT or DFPT labels (Materials Project, the
  Castelli perovskites, JARVIS-DFT 2D), a simulation. The other four (matbench_expt_gap,
  matbench_expt_is_metal, matbench_glass, matbench_steels) are experimental measurements compiled
  from the literature, handbooks and Citrine Informatics.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The datasets and the fold assignments come from the public Python package, which also
    scores recorded predictions.
  source: src-github-matbench-docs-run
  quote: You can use the matbench python package to retrieve the training and testing splits as well
    as record new predictions.

task:
  exists: true
  input:
    - a chemical composition (four tasks) or a crystal structure (nine tasks), as a pymatgen object
  output: One value per material, a float for the ten regression tasks or a boolean (or probability)
    for the three classification tasks.
  scoring: Five-fold nested cross-validation with fixed outer folds (KFold, StratifiedKFold for
    classification, seed 18012019); the entrant may use the 80% training-and-validation part of each
    fold as it chooses, and the test-fold MAE or ROC-AUC is averaged over the five folds. Each task
    is scored on its own.
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The package withholds test targets from get_test_data, but every
    task's full labelled dataset is public on MPContribs-ML.
  source: src-arxiv-2005-00707-v2
  quote: After predicting on each of the five 20% test splits, the error or AUC is averaged over the
    five folds.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Each task downloads as a JSON file from ml.materialsproject.org, the Materials
    Project's MPContribs-ML platform, with no account.
  access_basis:
    reason: The datasets are public on MPContribs-ML and load through the package.
    source: src-arxiv-2005-00707-v2
    quote: The datasets can also be interactively viewed and examined on the Materials Project
      MPContribs-ML platform (https://ml.materialsproject.org) as serialized tabular data.
  refresh: rolling-live
  refresh_note: The 13 tasks and their data are unchanged since v0.1 (2020), and the paper calls the
    benchmark "a versioned resource", but no later benchmark version exists. The scoring changed on
    the live board without a version label. Classification scores computed before the fix are on
    thresholded predictions. The fix landed in commit cd06e5ed4e on 2026-10-24, the package's last
    tag is v0.6 of 2022-07-27, and the README and site announce the change without a date (GitHub
    API). Old scores were not recomputed, so the board mixes both scorings, and a classification
    claim should say when it was scored (review_checks).
  refresh_basis:
    reason: A scoring change reached the live leaderboard between package labels, announced but not
      versioned.
    source: src-github-matbench-readme
    quote: This is fixed for future scoring; existing leaderboard scores have not been recomputed.
  data_provenance:
    - curated-public-database
    - inherited-from-constituents
    - simulation-generated
    - experimental-measurement
  data_provenance_note: Raw data were downloaded from ten original sources (the Materials Project
    API on 2019-04-12, Castelli et al.'s perovskites, JARVIS-DFT 2D, Zhuo et al.'s experimental band
    gaps, the Landolt-Bornstein metallic-glass data, Citrine Informatics' steels) and cleaned by
    per-task rules, such as dropping unphysical moduli, noble gases and entries over 150 meV above
    the hull. Nine tasks' labels are DFT or DFPT calculations, four are experimental.
  data_provenance_source: src-arxiv-2005-00707-v2
  data_provenance_quote: Unphysical (e.g., negative DFT elastic moduli), highly uncommon or
    unrepresentative samples (e.g., solid state noble gases) were removed according to a specific
    per-task procedure.
  contamination_risk: medium
  contamination_risk_note: Every dataset, label and fold has been public since 2020. Within the
    benchmark the nested cross-validation keeps each fold's test materials out of its training data.
    Outside it, nothing does. The Materials Project tasks (mp_e_form, mp_gap, mp_is_metal, the
    elastic, dielectric and phonon sets) are drawn from the database that many pretrained graph
    networks and universal potentials train on, and the general-purpose rules do not bound
    pretraining data. No source read here assesses the overlap.
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: MAE is bounded below by 0 and ROC-AUC above by 1; the paper colours
    scores against the task's mean absolute deviation (a Dummy predictor's error) and 0.5 for
    ROC-AUC. The labels are DFT or measurements, so a perfect score reproduces them, not the true
    property.
  ceiling_anchor_type_source: src-arxiv-2005-00707-v2
  ceiling_anchor_type_quote: (0.5 is equivalent to random, 1.0 is best)
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the Matbench datasets; each constituent
    keeps its own terms. The package code is MIT (execution.code_licence).
  size:
    - count: 13
      unit: tasks
      source: src-github-matbench-docs-v01-info
      quote: 'The `matbench_v0.1` benchmark contains 13 tasks:'
    - count: 10
      unit: datasets the 13 tasks are drawn from
      source: src-arxiv-2005-00707-v2
      quote: The Matbench test suite v0.1 contains 13 supervised ML tasks from 10 datasets.
  size_note: Per-task sample counts are the subsets' items, from the package's benchmark-info page;
    they run from 312 (matbench_steels) to 132,752 (matbench_mp_e_form). The paper's Table 1 gives
    1,296 for the phonon task, the package 1,265 (subsets).

training_data_eligibility_tiers_note: Not recorded. The leaderboard splits entrants by the tasks
  they recorded and by whether one configuration served all of them (general-purpose against
  task-specific), not by what they may train on; no source read states a rule on pretraining or
  outside data. That split belongs in a claim's subset_used. The surrogate-fit profile already makes
  training_data_policy material, which is where a pretrained entrant's outside data should be
  recorded.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Materials Project (Lawrence Berkeley National Laboratory); released by Anubhav
    Jain's group
  maintainer_basis:
    reason: The site states the Materials Project hosts and maintains it, the repository sits in the
      materialsproject organisation, and the datasets are served from the Materials Project's
      MPContribs-ML.
    source: src-github-matbench-docs-index
    quote: It is hosted and maintained by [the Materials Project](https://materialsproject.org).
  maintainer_type: government-agency
  maintainer_type_note: The Materials Project is run from Lawrence Berkeley National Laboratory, a
    US Department of Energy national laboratory, where all five authors worked (the paper's
    affiliations and funding statement). That the Materials Project is itself an LBNL programme is
    not quoted from a source read here; academic-lab was considered for the originating group
    (review_checks).
  maintainer_type_source: src-arxiv-2005-00707-v2
  maintainer_type_quote: Lawrence Berkeley National Laboratory is funded by the DOE under award
    DE-AC02-05CH11231.
  submission_process:
    - maintainer-scored-predictions
    - open-source-gated
  submission_process_note: An entrant records predictions on the package's folds (results.json.gz)
    and opens a pull request with info.json and at least one source file; the repository's automated
    leaderboard scores the recorded predictions against the public labels. Requiring code in the
    maintainers' repository is open-source-gated's inclusion test. The site adds that each result is
    backed by a publication or a notebook.
  submission_process_source: src-github-matbench-docs-submit
  submission_process_quote: At least one source file (one or more `.py` files or a Jupyter notebook
    `.ipynb`) must be included with submission.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-github-matbench-docs-index
      quote: '[AMMExpress v2020](Full%20Benchmark%20Data/matbench_v0.1_automatminer_expressv2020.md) |
        **0.9209** |'
  independence_flags_note: Automatminer, introduced in the same paper by the benchmark's authors as
    its reference algorithm, is a ranked entrant; its Express preset (AMMExpress v2020) holds the
    best general-purpose score on matbench_expt_is_metal, and the paper found it best on 8 of the 13
    tasks at release. The paper declares no competing interests, and its funder (US DOE Basic Energy
    Sciences) is not an evaluated party.
  independence_assessed: true
  known_limitation:
    source: src-github-matbench-readme
    quote: They therefore equal balanced accuracy, not true ROC-AUC, and understate submissions that
      provided probabilities.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Not guessed. An entrant trains five models per task, up to 13 tasks; the
    paper's Automatminer Express runs had a 24-hour AutoML limit per fold on one 24-core node, and
    graph networks ran on one GPU, but the cost depends on the entrant.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Public data, fixed folds, and loading, recording and scoring in one package; no human,
      physical or maintainer-only step.
    source: src-github-matbench-docs-run
    quote: You can use the matbench python package to retrieve the training and testing splits as
      well as record new predictions.
  harness_availability: official-harness
  harness: matbench Python package (MatbenchBenchmark, pip install matbench)
  harness_note: Papers that run the tasks with their own splits or a subset of the folds (for
    example as downstream probes of pretrained models) are not comparable with the board's numbers.
  harness_source: src-github-matbench-readme
  harness_quote: Matbench is pip installable!
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for materialsproject/matbench, read 2026-11-04; not a
    quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the surrogate-fit profile (subset_used, training_data_policy): which scoring the number came from
  # and whether it used the package's folds. subset_used should also say general-purpose or task-specific,
  # and for a general-purpose entry which of the three task sets (13, 10 regression, 9 structure) it ran.
  material_extra:
    - harness

aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: Each task is ranked by its own metric. The general-purpose table shows the best algorithm
    per task, one row per task, and the scaled-error figure (MAE over MAD, or (1 - ROC-AUC)/0.5)
    plots every task on one axis without combining them into a ranked score.
  source: src-github-matbench-docs-index
  quote: '| Task name | Samples | Algorithm | Verified MAE (unit) or ROCAUC | Notes |'
headline_metric: null

homepage: https://matbench.materialsproject.org
repository: https://github.com/materialsproject/matbench
leaderboard_url: https://matbench.materialsproject.org

versions:
  - version: v0.1
    label: matbench_v0.1
    version_kind: edition
    released: 2020-05-02
    changes: The first and only benchmark version, 13 tasks from 10 datasets with five-fold nested
      cross-validation.
    breaking: true
    errata:
      - date: 2026-10-24
        scope: classification tasks (matbench_expt_is_metal, matbench_glass, matbench_mp_is_metal)
        description: ROC-AUC had been computed on predictions thresholded at 0.5, so the board's
          classification scores equal balanced accuracy. Scoring was fixed for later submissions and
          existing scores were not recomputed (README; the date is the fixing commit's, GitHub API).
        source: src-github-matbench-readme
    frozen: true
    sources:
      - src-arxiv-2005-00707-v2
      - src-github-matbench-docs-v01-info
      - src-github-matbench-readme
versions_note: The package's release tags (v0.1.0 to v0.6, 2021-2022, GitHub API) are code versions;
  every one carries the same matbench_v0.1 benchmark. The paper expects "updated versions of
  Matbench"; none is in any source read here.


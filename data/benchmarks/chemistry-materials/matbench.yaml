subsets_note: >
  The 13 tasks of matbench_v0.1, in the benchmark-info page's order (by size). Each is scored on its own,
  on a general-purpose and a task-specific leaderboard. An algorithm counts as general-purpose if it ran
  all 13 tasks, all 10 regression tasks or all 9 structure tasks with one configuration (src-github-matbench-docs-notes:
  "General purpose algorithms are valid for all the tasks in a benchmark **using the same human-chosen
  configuration**."); the three task sets are leaderboard groupings, not separate subsets here. The site
  counts 180 task submissions from 28 algorithms (src-github-matbench-docs-index).
metrics_note: Per task, MAE (in the task's unit) for regression and ROC-AUC for classification; the
  package also reports RMSE, MAPE and maximum error, and accuracy, balanced accuracy and F1. No
  Metric records exist for these per-task metrics yet, and this entry adds none.

lineage:
  role: root
lineage_note: >
  Matbench Discovery is not modelled as a variant or fork of Matbench. 04 S4's lineage row is for "a separately
  maintained thing that grew out of another"; a variant is a same-maintainer subset, filtered subset or
  extension, and a fork is another maintainer's derivative. Matbench Discovery shares no items, task,
  metric or harness with Matbench: it scores stability on the WBM set, which Matbench does not contain.
  Its paper presents Matbench as related work whose gap it fills (src-arxiv-2308-14920-v3: "We highlight
  two specific benchmarking efforts that have partially addressed the above challenges: Matbench [32]
  and the Open Catalyst Project (OCP) [33]."). Its maintainer of record is an individual (matbench-discovery.yaml).
  The two overlap in one author (Anubhav Jain, last author of the Matbench paper and a Matbench Discovery
  author) and in the Materials Project's hosting and name, and Matbench's site sends discovery campaigns
  there (src-github-matbench-docs-index: "For DFT-based materials discovery campaigns, use [Matbench Discovery](https://matbench-discovery.materialsproject.org/).").
  That is a pointer, not a supersession: Matbench stays live for property prediction. So both are roots,
  and the relation is this note plus matbench-discovery's aliases_note (review_checks). MatSciML and JARVIS-Leaderboard,
  which the same paper says aggregate Matbench tasks, were not read and are not recorded as forks.


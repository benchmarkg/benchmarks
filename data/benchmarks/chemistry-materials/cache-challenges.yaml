# data/benchmarks/chemistry-materials/cache-challenges.yaml
#
# P1-S6-T01, chemistry-materials entry 5 of 10. Filled from cache-challenge.org (the home page with its list of
# challenges, What is CACHE, the Challenge #1, #5, #7 and #8 pages, the results pages of Challenges #1 and #5,
# and the news page), all with scripts and styles stripped; Conscience's CACHE programme page; the design paper,
# Ackloo et al., Nature Reviews Chemistry 2022 (DOI 10.1038/s41570-022-00363-z), read as its PMC author
# manuscript (PMC9246350); the Challenge #2 results paper, J. Chem. Inf. Model. 2025 (DOI 10.1021/acs.jcim.5c00535),
# read as its PMC author manuscript (PMC12323591); and bioRxiv's API record of the Challenge #1 results preprint
# (DOI 10.1101/2024.07.18.603797, CC BY; the published version is DOI 10.1021/acs.jcim.4c01267). Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The series is one entry and each challenge (#1 to #8, one protein target each) is an edition in versions[].
# The DREAM x CACHE Target 2035 Challenge, listed on the same site, is not included (review_checks).

id: cache-challenges
name: CACHE Challenges
aliases:
  - CACHE
  - Critical Assessment of Computational Hit-finding Experiments
tagline: 'Prospective hit-finding: teams nominate compounds for a protein target, and the organisers buy
  and assay them.'
description: >
  A series of prospective hit-finding competitions, launched by the Structural Genomics Consortium (SGC)
  in 2021 and stewarded by the non-profit Conscience since 2024. Each challenge names one protein
  target of biological or pharmaceutical interest, from LRRK2's WD40 domain (Parkinson's disease) and
  two SARS-CoV-2 proteins to a GPCR and parts of E3 ligases. Teams selected by application and
  double-blind peer review use computational workflows (docking, physics-based scoring, machine
  learning, generative design, often with chemists' judgement) to nominate up to 100 purchasable
  compounds; the organisers buy them, mostly from Enamine, and test them in binding assays with
  orthogonal confirmation. Teams whose compounds show activity nominate up to 50 analogues in a
  second, hit-expansion round, and every team also predicts the actives in the pooled first-round
  library. An independent Hit Evaluation Committee of industry experts scores each confirmed hit on its
  measured activity, its chemistry and novelty, and its analogues, and workflows are compared on those
  scores. All structures and assay data are released after each challenge. Confirmed hits are rare:
  seven of the 1,955 compounds tested in Challenge #1, and 0.7% of Challenge #2's. Eight challenges
  were announced from 2021 to 2026; assays and activity thresholds differ by target, so scores do not
  compare across challenges.
self_description:
  source: src-cache-nat-rev-chem-2022
  quote: a public benchmarking project to compare and improve small molecule hit-finding algorithms
    through cycles of prediction and experimental testing
paper:
  title: 'CACHE (Critical Assessment of Computational Hit-finding Experiments): A public-private partnership
    benchmarking initiative to enable the development of computational methods for hit-finding'
  doi: 10.1038/s41570-022-00363-z
  source: src-cache-nat-rev-chem-2022
released: 2021-12-01
released_note: 'The day applications opened for Challenge #1, the first challenge. The design paper was
  published in Nature Reviews Chemistry on 2022-02-15.'
released_source: src-cache-challenge-1
released_quote: Application opens 2021-12-01

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/experimental-hit-finding
domain_basis:
  reason: Teams nominate compounds for a protein target, the organisers procure them and test them
    in the laboratory, and each team is scored on what those experiments return, which is the leaf's
    definition and the case the family's exclusion test names.
  source: src-cache-challenge-what-cache
  quote: CACHE will procure the molecules from commercial vendors and test them experimentally with
    two rigorous binding assays.
domain_considered_and_rejected:
  - term: biology-genetics/protein-ligand-cofolding
    reason: Small molecules against a protein target, but they are scored by what the binding assays
      return, not by a predicted pose; the term's exclusion test sends nominated-and-assayed
      compounds to chemistry-materials/experimental-hit-finding.
  - term: biology-genetics/drug-target-interaction
    reason: Whether a compound binds the target is the question, but here compounds are nominated
      and then assayed, which the term's own distinction sends to
      chemistry-materials/experimental-hit-finding.
  - term: chemistry-materials/generative-molecular-design
    reason: Some workflows design new molecules, which their teams must have made, but most
      nominations are picked from commercial catalogues and the score is the assay, not a stated
      property specification.
    source: src-cache-challenge-what-cache
    quote: Compounds from de novo design methods will be procured by participants
capability:
  - hypothesis-generation
  - creativity-novelty
  - scientific-prediction
  - search-exploration
capability_basis:
  hypothesis-generation:
    reason: Each team's output is a set of candidates, up to 100 nominated compounds and then up to
      50 analogues of its hits, and the challenge scores that set by the hits confirmed in it.
    source: src-cache-challenge-1-results
    quote: CACHE Challenges begin with a hit-finding round (Round 1), where participants can
      nominate up to 100 commercially available compounds.
  creativity-novelty:
    reason: "The Hit Evaluation Committee scores chemical novelty against previously disclosed compounds,
      and challenges on targets with known ligands ask for new scaffolds (Challenge #4 against the patent
      series) or exclude a known chemotype (Challenge #7's quinazolines)."
    source: src-cache-challenge-5-results
    quote: the Committee evaluated any chemical liability and chemical novelty compared with
      previously disclosed compounds
  scientific-prediction:
    reason: Participants predict which molecules bind the target, and the score compares those
      predictions with binding measured in the organisers' assays.
    source: src-cache-challenge-site
    quote: Participants will predict hits and CACHE will validate these hits experimentally.
  search-exploration:
    reason: Teams search commercial catalogues of billions of compounds with a fixed budget of up to
      100 nominations each, and hit rate, discovery under that budget, is what separates the
      workflows.
    source: src-cache-2-jcim-2025
    quote: While most hit rates were between 0 and 3%
capability_considered_and_rejected:
  - term: experimental-design
    reason: The assays and the confirmation protocol are the organisers'. Teams submit the compounds
      to be tested, which is the hypothesis, not the means of testing it (the term's exclusion).
  - term: optimization
    reason: The score is a committee's judgement of measured hits, not the value of a stated
      objective that entrants optimise.
  - term: distribution-shift-generalization
    reason: Each challenge brings a new target, but no shifted condition is constructed and reported
      beside an in-distribution one.

evaluation_method:
  - wet-lab-validation
  - human-expert-eval
evaluation_method_basis:
  reason: 'The nominated compounds are bought and assayed after submission, and the measured binding is
    the ground truth. Experts then score the outcome compound by compound (human-expert-eval) - in Challenges
    #2 and #5 the Hit Evaluation Committee assigns a score to each Round 1 hit, blind to the participant,
    and workflows are compared by their best and summed hit scores (task.blinding).'
  source: src-cache-challenge-what-cache
  quote: CACHE will procure the molecules from commercial vendors and test them experimentally with
    two rigorous binding assays.
evaluation_method_considered_and_rejected:
  - term: expert-panel-assessment
    reason: "In Challenges #2 and #5 the committee scores each Round 1 hit and the results pages rank
      workflows on those scores, which the term's exclusion sends to human-expert-eval. Challenge #1's
      page reports a final score per participant, which is the term's own case (review_checks)."
  - term: prospective-resolution
    reason: The assays are run on the nominated compounds themselves, which the term's exclusion
      sends to wet-lab-validation.
designed_for_subjects:
  - human-ai-team
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: "The entrant is a team's workflow. Many workflows rest on neural networks trained for chemistry
    tasks (learned_entrant_evidence), others are purely physics-based docking and scoring, and teams choose
    the final compounds by hand after computing; the quoted Challenge #2 workflow is both the second and
    the third."
  source: src-cache-2-jcim-2025
  quote: WF1448 used purely physics-based approaches for docking (Glide) and Scoring (HYDE),
    followed by visual inspection and selection of top compounds by both computational and medicinal
    chemists.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: No entrant works unaided; every team runs a computational workflow, and the challenge
      exists to compare those workflows.
  - term: scientific-surrogate-model
    reason: Learned scoring functions stand in for a binding assay inside some workflows, but the
      entrant is the whole workflow and what is scored is its selection of compounds, not an
      emulated measurement.

lifecycle: active
lifecycle_basis:
  reason: "Challenge #8 took applications until April 2026, Challenge #6 is in its hit-expansion round,
    and the results papers keep appearing, Challenge #3's in January 2026."
  source: src-cache-challenge-site
  quote: 'Last date to apply is: Thu, 04/30/2026 - 00:00'
activity: results-pending
activity_note: "Challenges #6, #7 and #8 are under way with no call for applications open; the newest
  call, Challenge #8's, closed on 2026-04-29. Challenge #5's second-round compounds were still being tested
  at the start of 2026. No call for a ninth challenge is announced."
activity_basis:
  reason: Every challenge's entry route is its call for applications, and the last of them closed;
    the organisers are procuring, assaying and scoring the compounds of the challenges that are
    open, and none of those results is published yet.
  source: src-cache-news
  quote: 527 CACHE5 R2 compounds have arrived at UNC with testing expected to begin in January 2026

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: 'the ten CACHE #2 teams whose workflows used neural networks'
    source: src-cache-2-jcim-2025
    observed_on: 2026-10-14
    quote: Out of 23 teams, ten used neural networks to generate or evaluate compounds
  - system: 'the seven successful CACHE #1 workflows, five of them with deep-learning steps'
    source: src-biorxiv-cache-1
    observed_on: 2026-10-14
    quote: five used one or more deep learning steps
evaluation_target: mixed
evaluation_target_note: The entrant is a team's whole workflow. Some are built on neural networks
  (learned_entrant_evidence), some are purely physics-based docking and scoring, and in both cases
  chemists pick the final compounds by hand, so no single target term covers the field of entrants.
execution_mode: wet-lab
ground_truth_source: experimental
ground_truth_source_note: "Binding measured in the organisers' laboratory after submission: a primary
  assay (surface plasmon resonance for the structural-biology targets, a radioligand competition assay
  for MCHR1), then dose-response, an orthogonal binding assay, and solubility and aggregation checks by
  dynamic light scattering. An independent committee then scores each confirmed hit."
ground_truth_source_source: src-cache-challenge-1-results
ground_truth_source_quote: Primary screening of nominated compounds was conducted by SPR, an assay
  that measures direct binding of compounds to the WDR domain of LRRK2 captured on a chip.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: A score exists only once the organisers have bought the compounds, run the assays and had
    the committee judge the results. The compounds and the data are released afterwards, so the
    measurements can be repeated, but not the blind prediction they scored.
  source: src-cache-challenge-1-results
  quote: All CACHE#1 compounds were tested experimentally at the Structural Genomics Consortium,
    University of Toronto

task:
  exists: true
  input:
    - the challenge's protein target, with whatever it comes with -- structures of the site, known
      ligands from the literature or patents, fragment or DNA-encoded-library screening data
    - a commercial compound catalogue, mostly Enamine's, from which nominations must be purchasable
  output: Up to 100 nominated compounds in the hit-finding round and up to 50 analogues in the
    hit-expansion round, plus, in a separate exercise, a prediction of which compounds are active in
    the pooled library of every team's first-round nominations.
  scoring: The organisers procure and assay the nominated compounds; an independent Hit Evaluation
    Committee scores each confirmed hit on its measured activity, its chemistry and its novelty, and
    on how its analogues behaved. Workflows are then compared by their best hit score, by the summed
    score of all their hits, and by their score on the pooled library.
  tests_hidden_from_system: true
  tests_hidden_from_system_note: The answer does not exist when the compounds are nominated; it is
    made by assaying them. Each team sees its own compounds' data before the hit-expansion round,
    and the whole data set is released at the end of the challenge.
  blinding:
    source: src-cache-challenge-5-results
    quote: Each compound was assigned a score by a panel of medicinal chemistry and GPCR biophysics
      experts (the IDs of participants were blinded).
  source: src-cache-challenge-5-results
  quote: A second metric is the aggregated score (i.e. sum of all scores) across all confirmed hits
    predicted by a workflow which better reflects hit rate.

# --- Data ------------------------------------------------------------------------------------

data:
  access: invitation-only
  access_note: 'There is no distributable evaluation set: the data is made by assaying what the entrants
    nominate. Entry is by application, about 25 teams per challenge, and every challenge releases all
    of its compound structures and assay data publicly when it ends.'
  access_basis:
    reason: The organisers decide who enters, by selecting among applicants in a double-blind peer
      review in which each applicant reviews five applications, so the field of entrants is closed
      by decision rather than by capability.
    source: src-cache-challenge-7
    quote: A maximum of 25 applicants will be invited to participate in this challenge, following a
      double-blind peer review process
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each challenge takes a new protein target with its own assays and its own activity
      threshold, and the data it is scored on is made for it.
    source: src-cache-challenge-what-cache
    quote: Each competition will focus on a new protein target
  data_provenance:
    - experimental-measurement
  data_provenance_note: Binding assays run on the nominated compounds in the organisers'
    laboratories, with the medicinal chemists' scores on top of them. The inputs a challenge hands
    out -- structures from the PDB, ligands from the literature and patents, screening data
    contributed before publication -- are not the ground truth.
  data_provenance_source: src-cache-challenge-1-results
  data_provenance_quote: All CACHE#1 compounds were tested experimentally at the Structural Genomics
    Consortium, University of Toronto
  contamination_risk: low
  contamination_risk_note: The answer does not exist when compounds are nominated, so no training
    set can hold it. What a team may have seen is the target's prior ligands, which is why several
    challenges score novelty against the known chemistry or exclude a known chemotype. Each
    challenge's released data become public knowledge for later ones, but each has a different
    target.
  contamination_risk_basis:
    reason: The compounds are assayed after they are nominated, so there is no earlier label to
      leak.
    source: src-cache-challenge-site
    quote: Participants will predict hits and CACHE will validate these hits experimentally.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No source gives a best attainable hit rate; the design paper says
    plainly that no measure settles which binder is best.
  ceiling_anchor_type_source: src-cache-nat-rev-chem-2022
  ceiling_anchor_type_quote: no single measure, or even combination of measures, can be used to
    unambiguously quantify the success of virtual screens
  dataset_licence: null
  dataset_licence_note: No licence is stated for the released compound structures and assay data;
    the organisers say instead that the data carry no restriction on use. The website itself is CC
    BY 4.0 ("This website is licensed under CC-BY 4.0", src-cache-challenge-site).
  dataset_licence_source: src-cache-challenge-site
  dataset_licence_quote: Each competition includes a hit-finding and a hit expansion round of
    prediction and experimental testing after which all data, including chemical structures, will be
    made publicly available without restrictions on use.
  size:
    - count: 100
      unit: compounds a team may nominate in the hit-finding round
      source: src-cache-challenge-1-results
      quote: CACHE Challenges begin with a hit-finding round (Round 1), where participants can
        nominate up to 100 commercially available compounds.
    - count: 50
      unit: follow-up compounds a team may select in the hit-expansion round
      source: src-cache-challenge-1-results
      quote: can select up to 50 follow-up compounds
    - count: 1955
      unit: compounds procured and assayed in the hit-finding round
      subset: 'Challenge #1 (LRRK2 WDR domain)'
      source: src-biorxiv-cache-1
      quote: Seventy-three of the 1955 procured molecules bound LRRK2 in an SPR assay
    - count: 1957
      unit: compounds procured and assayed in the hit-finding round
      subset: 'Challenge #2 (SARS-CoV-2 NSP13)'
      source: src-cache-2-jcim-2025
      quote: each team selected up to 100 compounds from the Enamine catalog resulting in 1957
        molecules that were procured and tested using Surface Plasmon Resonance (SPR), a direct
        biophysical binding assay.
    - count: 1455
      unit: compounds procured and assayed in the hit-finding round
      subset: 'Challenge #5 (MCHR1)'
      source: src-cache-challenge-5-results
      quote: Twenty-four computational teams predicted up to 100 MCHR1 antagonists each. The
        resulting 1455 compounds were tested experimentally in a competition assay and a functional
        assay.
    - count: 25
      unit: teams invited per challenge, at most (23 to 25 completed the rounds reported so far)
      source: src-cache-challenge-7
      quote: A maximum of 25 applicants will be invited to participate in this challenge, following
        a double-blind peer review process

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Conscience, with the Structural Genomics Consortium (University of Toronto) as the
    experimental hub
  maintainer_basis:
    reason: Conscience, a Canadian non-profit, has run the challenges since 2024 and holds the site
      and the application process; the SGC, which launched the series, runs the assays. The
      Governing Board is industry representatives, but it is not the holder.
    source: src-conscience-cache-programme
    quote: CACHE is a safe and open competition organized by a non-profit with a clear mission to
      reduce drug discovery costs
  maintainer_type: nonprofit
  maintainer_type_note: consortium was considered. CACHE has a Governing Board of industry
    representatives and the design paper proposed a membership body, but the sources read here name
    no legal form for it, and the party that holds and runs the challenges is one non-profit.
  submission_process: held-out-server
  submission_process_note: There is no server. Teams submit a list of compounds, the organisers
    procure and assay them, and the committee scores what the assays returned -- an answer that does
    not exist when the submission is made, which is what the term covers. Entry is gated by
    application and double-blind peer review (data.access).
  submission_process_source: src-cache-challenge-site
  submission_process_quote: Participants will predict hits and CACHE will validate these hits
    experimentally.
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-cache-nat-rev-chem-2022
      quote: receives funds from Bayer AG, Boehringer Ingelheim, Bristol Myers Squibb, Genentech,
        Genome Canada through Ontario Genomics Institute [OGI-196], Janssen, Merck KGaA
    - flag: single-evaluator-private-test-set
      source: src-cache-challenge-1-results
      quote: All CACHE#1 compounds were tested experimentally at the Structural Genomics Consortium,
        University of Toronto
  independence_flags_note: "The experimental hub is the SGC, whose funders listed in the design paper
    include Merck KGaA, and a Merck KGaA team placed third in Challenge #1 (\"Christina Schindler, Merck
    KGaA 1193 17\", src-cache-challenge-1-results). One laboratory makes the ground truth for every entrant
    and holds it until release. The Governing Board, the Applications Review Committee and the Hit Evaluation
    Committee are drawn from industry (AstraZeneca, UCB, Enamine, Bayer, Boehringer Ingelheim, Nuvisan
    and others); the committee members' own organisations are not shown entering."
  independence_assessed: true
  funding:
    source: src-cache-challenge-7
    quote: through a Strategic Innovation Fund awarded to Conscience by the Canadian government
  funding_note: "Funding is per challenge as well as central. Challenge #1 was supported by the Michael
    J. Fox Foundation, Challenges #2 and #3 by the NIH's AViDD programme, Challenge #5's assays by the
    Roth laboratory at UNC, and Challenge #7 rests on data from a Gates Foundation contraceptive programme.
    The design paper describes the model: funders pay for the infrastructure and may sponsor a target."
  participation:
    source: src-cache-challenge-what-cache
    quote: Participants will be asked to disclose their approaches in sufficient detail to enable an
      expert in the area to understand the methodology while computational algorithms can remain
      proprietary.
  participation_note: Participants may stay anonymous; top-performing teams are de-anonymised when
    the data are released, and each challenge's results page lists those who agreed.
  evaluation_budget:
    source: src-conscience-cache-programme
    quote: Testing costs are covered for all selected teams, at a value or approximately CA$100,000
      per team.
    comparability_consequence: The assay budget is the organisers'; what a team pays for is the
      compounds (execution.compute_tier), and the split changed between challenges.
  known_limitation:
    source: src-cache-nat-rev-chem-2022
    quote: no single measure, or even combination of measures, can be used to unambiguously quantify
      the success of virtual screens

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: participant-funded-procurement
  compute_tier_note: "The split changed over the series. The design paper planned for the organisers to
    buy the compounds in the first two competitions and to pass that cost to participants afterwards,
    and by Challenges #7 and #8 participants pay for procurement while CACHE pays for the assays, with
    half of eligible Canadian participants' costs reimbursed. Challenge #5 was the other way round --
    the Roth laboratory paid for the testing and CACHE paid part of the procurement."
  compute_tier_basis:
    reason: What an entrant pays for is the physical compounds the organisers then assay, which is
      the term's inclusion test and the case the vocabulary cites this benchmark for; the bench work
      is recorded as a blocker instead.
    source: src-cache-challenge-7
    quote: CACHE will cover 100% of the costs of testing compounds experimentally. 100% of the costs
      of procuring compounds (either make-on-demand or custom-synthesized compounds) will be covered
      by participants.
  reproducibility_tier: requires-physical-experiment
  reproducibility_tier_basis:
    reason: Producing a score means buying compounds, running binding assays with orthogonal
      confirmation and convening medicinal chemists to judge the result. The compounds and the data
      are released at the end of each challenge, so the measurements themselves are repeatable by a
      laboratory; what cannot be repeated is the blind prediction, which the live-world-state
      blocker records.
    source: src-cache-nat-rev-chem-2022
    quote: Each compound will be assayed at a single concentration in duplicate, and each positive
      will be re-tested in dose-response mode, as well as in an orthogonal biophysical assay
  reproducibility_blockers:
    - wet-lab
    - human-raters
    - live-world-state
    - no-reference-implementation
  reproducibility_blockers_note: The assays are bench work; the scores are assigned by an expert
    committee; the prediction is blind only once, because every challenge's data are published
    afterwards; and nothing is distributed to run, because a submission is a list of compounds.
  harness_availability: none
  harness_note: There is no evaluation code to release. A submission is a list of purchasable
    compounds, and the evaluation is a laboratory pipeline described in prose on the results pages.
  est_participant_cost_usd: null
  est_participant_cost_usd_note: Not recorded in US dollars by any source read here. Conscience puts
    the testing it covers at about CA$100,000 per team and reimburses up to CA$50,000 (academics and
    large enterprises) or CA$75,000 (SMEs) of Canadian participants' procurement; the design paper
    estimated about US$25,000 to test 100 compounds rigorously, which is the organisers' cost, not
    an entrant's.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the wet-lab profile: the target construct and the assay's conditions, the activity threshold
  # the challenge set (a KD below 150 micromolar advanced compounds in Challenge #1; Challenge #7 asks
  # for an IC50 below 10 micromolar and 20-fold selectivity), the round (hit-finding, hit-expansion or
  # the pooled-library exercise), and how much of the workflow was a chemist's judgement.
  material_extra:
    - target_construct
    - activity_threshold
    - human_assistance

aggregation_policy: official-aggregate
aggregation_policy_note: The official aggregate is per challenge, not per series. A workflow's
  summed hit score, its best hit score and its score on the pooled library are three separate
  rankings, and each challenge's assays and activity threshold are its own, so numbers do not carry
  across challenges.
aggregation_policy_source: src-cache-challenge-5-results
aggregation_policy_quote: A second metric is the aggregated score (i.e. sum of all scores) across
  all confirmed hits predicted by a workflow which better reflects hit rate.
headline_metric: null
headline_metric_note: "The committee's aggregated score per workflow is the closest thing to one, and
  no Metric record exists for it yet; the hit rate reported beside it (0.7% in Challenge #2) is a property
  of the compounds, not of a workflow."
no_legitimate_aggregate: false

liveness:
  repo_last_commit: null
  leaderboard_last_updated: null
  reproduction_script_present: false
  reproduction_script_verified: false
  last_checked: 2026-10-14
liveness_note: There is no repository and no dated results board; each challenge's results page
  carries no date, and the news page is the series' dated signal, last entry 2026-01-21.

homepage: https://cache-challenge.org
maintainer_url: https://conscience.ca/cache-challenge/


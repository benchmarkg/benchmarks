    released: 2023-03-09
    changes: An immuno-oncology target with hundreds of related compounds in the patent literature,
      so new scaffolds were the point. 23 teams nominated 1,921 compounds that had to bind below 30
      micromolar; one team produced a clearly novel, strongly validated hit.
    breaking: true
    supersedes_version: challenge-3
    superseded_by: challenge-5
    frozen: true
    sources:
      - src-cache-news
      - src-cache-challenge-site
  - version: challenge-5
    label: 'CACHE Challenge #5 -- MCHR1'
    version_kind: edition
    released: 2023-12-19
    changes: The first GPCR, with thousands of known ligands and no structure of the target or a
      close homologue, so the challenge was chemical novelty. 24 teams nominated 1,455 compounds,
      tested in a radioligand competition assay and a functional cellular assay at UNC; nine
      workflows produced convincing ligands.
    breaking: true
    supersedes_version: challenge-4
    superseded_by: challenge-6
    frozen: true
    sources:
      - src-cache-challenge-5
      - src-cache-challenge-5-results
  - version: challenge-6
    label: 'CACHE Challenge #6 -- the triple Tudor domain of SETDB1'
    version_kind: edition
    released: 2024-05-08
    changes: An epigenetics and immuno-oncology target. Round 1 tested 1,338 compounds by SPR, a
      fluorescence-polarisation competition assay and a spectral-shift assay; 29 compounds advanced
      to hit expansion in November 2025 and the full data wait on that round.
    breaking: true
    supersedes_version: challenge-5
    superseded_by: challenge-7
    frozen: false
    sources:
      - src-cache-news
      - src-cache-challenge-site
  - version: challenge-7
    label: 'CACHE Challenge #7 -- selective inhibitors of PGK2'
    version_kind: edition
    released: 2025-08-11
    changes: A contraception target, and the first challenge scored on selectivity as well as
      potency -- an IC50 below 10 micromolar and at least 20-fold selectivity over PGK1, without the
      quinazoline scaffold the sponsors are already advancing. Unpublished structures and
      DNA-encoded-library data were shared with participants.
    breaking: true
    supersedes_version: challenge-6
    superseded_by: challenge-8
    frozen: false
    sources:
      - src-cache-challenge-7
      - src-cache-news
  - version: challenge-8
    label: 'CACHE Challenge #8 -- GID4'
    version_kind: edition
    released: 2026-02-17
    changes: The substrate-binding unit of the CTLH ubiquitin ligase complex, aimed at targeted
      protein degradation. Applications closed on 2026-04-29; participants pay for procurement in
      full, with Enamine bulk pricing arranged by the organisers.
    breaking: true
    supersedes_version: challenge-7
    frozen: false
    sources:
      - src-cache-challenge-8
      - src-cache-challenge-site


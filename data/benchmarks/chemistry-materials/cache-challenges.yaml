curation:
  added_by: agent (P1-S6-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-cache-challenge-site
    - src-cache-challenge-what-cache
    - src-cache-challenge-1
    - src-cache-challenge-1-results
    - src-cache-challenge-5
    - src-cache-challenge-5-results
    - src-cache-challenge-7
    - src-cache-challenge-8
    - src-cache-news
    - src-conscience-cache-programme
    - src-cache-nat-rev-chem-2022
    - src-cache-2-jcim-2025
    - src-biorxiv-cache-1
  sources_note: >
    Nine pages of cache-challenge.org and Conscience's CACHE programme page, each read with its scripts
    and styles stripped (so content_sha256 is the stripped text's) and each awaiting archival; the
    design paper and the Challenge #2 results paper as their PubMed Central author manuscripts, both
    carrying DOIs; and bioRxiv's API record of the Challenge #1 results preprint, read for its abstract
    because the preprint page itself refused the fetch. Challenge #3's and #4's editions rest on the
    news page and the home page: the site serves Challenge #6's text under the Challenge #4 URL
    (review_checks).
  confidence: medium
  review_checks:
    - check: One entry for the series, with the eight challenges as editions. Each challenge has its
        own target, assays, activity threshold and field of teams, and the scores do not compare
        across them, so each could instead be its own entry, as the corpus treats some yearly
        challenges.
      field: versions
    - check: The DREAM x CACHE Target 2035 Challenge is listed in the same site menu, shares the
        CACHE Terms of Participation and is supported by Conscience, but it is run with the SGC,
        Sage Bionetworks and IBM's DREAM on Synapse, with a retrospective phase before the
        prospective one. It is excluded here and may deserve its own entry.
      field: versions
      source: src-cache-challenge-site
      quote: with logistical and technical support from Conscience and BEACON
    - check: "human-expert-eval against expert-panel-assessment. The Hit Evaluation Committee scores each
        confirmed hit and the results pages rank workflows from those scores, which the panel term's exclusion
        sends to human-expert-eval; but Challenge #1's page says the committee's work led to a final score
        per participant, which is the panel term's own case."
      field: evaluation_method
      source: src-cache-challenge-1-results
      quote: leading to a final score assigned to each participant
    - check: 'evaluation_target: mixed is the first in this corpus; every other entry is learned-system.
        The field of entrants holds neural-network workflows, purely physics-based ones and human selection
        in both.'
      field: evaluation_target
      source: src-cache-2-jcim-2025
      quote: Out of 23 teams, ten used neural networks to generate or evaluate compounds
    - check: "activity results-pending against between-rounds. No call for applications is open and the
        open challenges are being assayed and scored, but Challenge #5's final results are published,
        so a reader could call the series between rounds instead."
      field: activity
    - check: reproducibility_tier requires-physical-experiment, where 02 S12.4 proposed
        not-independently-reproducible. The assays and the released compounds can be repeated by a
        laboratory; the blind round cannot, which is recorded as the live-world-state blocker.
      field: execution.reproducibility_tier
      specialist: true
    - check: maintainer_type nonprofit against consortium. Conscience holds and runs the challenges,
        but a Governing Board of industry representatives decides the course of each one and the SGC
        runs the experiments; no source read here gives that board a legal form.
      field: governance.maintainer_type
      source: src-conscience-cache-programme
      quote: The Governing Board for CACHE consists of representatives from industry that make
        various decisions on the course of each CACHE Challenge.
    - check: "funded-by-evaluated-party rests on the design paper's statement that the SGC, which runs
        the assays, is funded by pharmaceutical companies, beside a Merck KGaA team placing third in Challenge
        #1. Whether funding the experimental hub counts as funding the benchmark is a reviewer's call."
      field: governance.independence_flags
      source: src-cache-challenge-1-results
      quote: Christina Schindler, Merck KGaA 1193 17
    - check: The released structures and assay data carry no named licence, only the promise that
        they are unrestricted; dataset_licence is null rather than a guess. The website's own CC BY
        4.0 footer covers the pages, not the data.
      field: data.dataset_licence
    - check: "The assay conditions recorded here are Challenges #1, #2 and #5's. The pipeline changes
        with the target -- SPR and ITC or 19F NMR for the structural-biology targets, a radioligand competition
        assay and a cellular functional assay for the GPCR, an enzyme assay where the target is an enzyme
        -- so a per-edition assay record would be better than one summary."
      field: ground_truth_source
      specialist: true
  personal_data_excluded:
    - source: src-cache-nat-rev-chem-2022
      what: The PubMed Central page carries the corresponding authors' e-mail addresses; the quote
        windows avoid them and the extract holds none.

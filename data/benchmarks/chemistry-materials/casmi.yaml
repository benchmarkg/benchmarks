# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-casmi-2012-metabolites-2013
    - src-casmi-2012-winners-metabolites
    - src-casmi-2013
    - src-casmi-2013-winners-mass-spectrom
    - src-casmi-2014
    - src-casmi-2014-rules
    - src-casmi-2016-rules-categories
    - src-casmi-2016-jcheminf-2017
    - src-casmi-2017
    - src-casmi-2017-rules
    - src-casmi-2017-rules-categories
    - src-casmi-2022
    - src-fiehnlab-casmi-2022
    - src-fiehnlab-casmi-2022-results
    - src-casmi-2026
    - src-casmi-revisiting-metabolites-2020
    - src-arxiv-2611-01352
  sources_note: >
    Four results papers, three as Europe PMC full-text XML and the 2013 one as its PMC page, and a
    third party's retrospective paper, all carrying DOIs; ten pages of casmi-contest.org, each with
    scripts and styles stripped, five of them withheld from archiving because they name organisers
    and the rest awaiting archival; the two CASMI 2022 pages at UC Davis, read from Wayback captures
    of 2026-07-29 because the host returned Cloudflare's error 1016 on 2026-11-04; and the arXiv
    abstract page of a 2026 paper. The Kaggle page of CASMI 2026 renders by script and was not read.
  confidence: medium
  review_checks:
    - check: One entry for the series, with the seven contests as editions. Each contest has its own
        organisers, data, categories and scoring (2022 declared no winner, 2026 is a Kaggle
        competition), so 2022 and 2026 especially could be argued to be separately maintained
        benchmarks under the CASMI name rather than editions; casmi-contest.org lists both as CASMI
        contests, which is why they are editions here.
      field: versions
      source: src-casmi-2022
      quote: Apr 05th, 2022 CASMI 2022 has been announced
    - check: The 2014 results paper ("CASMI 2014 Challenges, Solutions and Results", Current
        Metabolomics 5(1), 2017) and the 2016 Category 1 paper (Phytochemistry Letters 2017, DOI
        10.1016/j.phytol.2017.01.006) were not read, and the 2014 paper's DOI was not confirmed. No
        results paper was found for 2017 or 2022; those editions rest on the site's pages.
      field: versions
    - check: The 2026 edition rests on the series site's announcement alone. The Kaggle page renders
        by script; its data licence, metric, submission rules (possibly code-only), deadline and
        whether test answers are released were not read, and activity accepting-submissions assumes
        the round is open.
      field: activity
      source: src-casmi-2026
      quote: Sept 15th, 2026 CASMI 2026 has been announced
    - check: No training_data_eligibility_tiers are recorded. The categories split entrants by what
        may be used to solve a challenge (2016 and 2017 Category 2 forbids library lookup but lets
        libraries train models; Category 3 allows anything), which is an inference-time rule, so it
        is recorded as eligibility_track in comparability.material_extra rather than as tiers, and
        no eligibility-gated profile is claimed. A reviewer may read the Category 2 rule as a
        training tier.
      field: comparability
      source: src-casmi-2017-rules-categories
      quote: Mass spectral libraries can only be used for training of prediction models
    - check: maintainer_type conference-workshop against community-collective. The team re-forms for
        each contest and results are presented at workshops, but no edition is formally held under
        one conference, and the 2026 organiser is a company.
      field: governance.maintainer_type
    - check: prize-sponsored-by-industry rests on 2026's "$50,000 in Kaggle Awards Points & Medals"
        from a company organiser. Whether Kaggle award points are a prize pool, and whether a
        company that develops identification methods organising the round is a conflict of another
        kind, are a reviewer's calls; the 2012 founders had warned that sponsorship can compromise
        independence.
      field: governance.independence_flags
      source: src-casmi-2012-metabolites-2013
      quote: it can compromise the independence (or at least, the appearance of independence) of the
        competition
    - check: contamination_risk high applies to completed contests used afterwards as test sets (the
        2026 paper uses CASMI 2022 as an external set); a live contest screens its challenges
        against the public libraries and is low risk while it runs.
      field: data.contamination_risk
      source: src-casmi-2016-jcheminf-2017
      quote: Challenge spectra were those where no MassBank spectrum was above 0.85 similarity
    - check: human-ai-team rather than human-expert for manual entries. Manual entrants interpret
        the spectra themselves but search spectral and chemical databases; whether a database search
        makes a human a human-AI team is a reviewer's call.
      field: designed_for_subjects
      specialist: true
    - check: ground_truth_source held-out-labels rather than experimental. The challenge spectra are
        measurements, but the label is the known identity of the standard measured, released as the
        solutions; data_provenance carries experimental-measurement.
      field: ground_truth_source
    - check: The 2016 and 2017 categories are not modelled as subsets because the category set
        changes with every contest; per-edition subsets would let a claim name, say, CASMI 2016
        Category 2.
      field: subsets
  personal_data_excluded:
    - source: src-casmi-2012-winners-metabolites
      what: The paper names the winners, the participants and the advisory board, and prints the
        authors' e-mail addresses and telephone numbers; the windows hold none of them.
    - source: src-casmi-2016-jcheminf-2017
      what: Teams are named by their leaders' surnames throughout; the windows hold no names.
    - source: src-fiehnlab-casmi-2022-results
      what: The page lists every participant by name and affiliation and labels its results rows
        with surnames; the extract holds only the page's statement of aim.
    - source: src-casmi-2013
      what: The casmi-contest.org pages name each edition's organisers and print contact addresses
        (here and on the 2014, 2016, 2017 and 2022 pages); the windows hold neither.

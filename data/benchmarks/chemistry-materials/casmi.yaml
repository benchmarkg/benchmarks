# data/benchmarks/chemistry-materials/casmi.yaml
#
# P1-S6-T02, chemistry-materials entry 11. Filled from the results papers: the 2012 challenges-and-solutions
# paper (Metabolites 2013, DOI 10.3390/metabo3030517) and the 2012 results paper (Metabolites 2013, DOI
# 10.3390/metabo3020412), both as Europe PMC full text; the CASMI 2013 organisers' paper (Mass Spectrometry
# 2014, DOI 10.5702/massspectrometry.S0039) as its PMC page; the CASMI 2016 automated-categories paper (J.
# Cheminform. 2017, DOI 10.1186/s13321-017-0207-1) as Europe PMC full text; from casmi-contest.org (the 2013,
# 2014, 2017, 2022 and 2026 home pages, the 2014 and 2017 rules pages and the 2016 and 2017 category pages), all
# with scripts and styles stripped; from the CASMI 2022 organisers' page and results page at UC Davis, read from
# their Wayback captures because the host was down; and, for current use, from an EPA group's retrospective run
# of five contests (Metabolites 2020, DOI 10.3390/metabo10060260) and the arXiv abstract page of a 2026
# formula-annotation paper scored on the CASMI 2022 set (arXiv 2611.01352). Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The series is one entry and each contest (2012, 2013, 2014, 2016, 2017, 2022, 2026) is an edition in
# versions[]. The 2014 results paper (Current Metabolomics 2017) and the 2016 Category 1 paper (Phytochemistry
# Letters 2017) were not read; no results paper was found for 2017 or 2022 (review_checks).

id: casmi
name: CASMI
aliases:
  - Critical Assessment of Small Molecule Identification
  - CASMI Contest
tagline: 'Recurring blind contest: identify small molecules from mass spectra, ranked by where the confirmed
  structure falls.'
description: >
  An open contest series on identifying small molecules from mass spectrometry data, founded in 2012
  at the Leibniz Institute of Plant Biochemistry and Eawag and modelled on CASP. Each contest
  publishes spectra of compounds whose identities the organisers know, confirmed with reference
  standards or measured from authentic standards, and withholds the answers until the deadline.
  Entrants submit, for each challenge, a scored list of candidate molecular formulas or structures,
  and each challenge is won by the entrant who ranks the correct structure highest, matched by the
  first block of its InChIKey; the entrant with the most challenge wins takes the category. Seven
  contests have run, each with a new organising team and its own categories: LC-HRMS/MS and GC-MS
  data in 2012, natural products in 2016 and 2017, candidate lists and training spectra for fully
  automatic methods from 2016, raw LC-MS/MS files of 500 compounds outside public libraries in
  2022, and a Kaggle competition run by Enveda Biosciences in 2026. Manual, database-assisted
  entries and automatic in silico methods, rule-based, combinatorial or machine-learned, compete
  in the same contests, sometimes in separate categories. Past contests' spectra and solutions are
  public, and later papers use them as test sets.
self_description:
  source: src-casmi-2012-metabolites-2013
  quote: The Critical Assessment of Small Molecule Identification, or CASMI, contest was founded in
    2012 to provide scientists with a common open dataset to evaluate their identification methods.
paper:
  title: 'The Critical Assessment of Small Molecule Identification (CASMI): Challenges and Solutions'
  doi: 10.3390/metabo3030517
  source: src-casmi-2012-metabolites-2013
released: 2012-07-20
released_note: The day the first contest's challenge data were made public; the website went live on
  2012-05-20, and the founding papers appeared in Metabolites in May and June 2013.
released_source: src-casmi-2012-winners-metabolites
released_quote: '20/07/2012: Public release of challenge data'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: chemistry-materials/spectroscopy-interpretation
domain_basis:
  reason: Entrants infer a molecule's formula and structure from its mass spectra, and the score is
    whether the confirmed identity is found, which is the leaf's definition (inferring molecular
    structure from spectroscopic measurements); the subject is the molecule, so the family's
    inclusion test holds.
  source: src-casmi-2013-winners-mass-spectrom
  quote: is a contest in which participants identify the molecular formula and chemical structure of
    challenging molecules using blind mass spectra as the challenge data.
domain_considered_and_rejected:
  - term: chemistry-materials/molecular-property-prediction
    reason: The direction is the reverse. Nothing is predicted from a structure; the structure is
      what has to be recovered from the measurement.
  - term: biology-genetics/bioinformatics-analysis
    reason: The samples are metabolomics and environmental extracts and CASMI 2022 hands out raw
      LC-MS/MS files, but the scored answer is a chemical identity, not the result of a multi-step
      analysis of biological data files.
    source: src-fiehnlab-casmi-2022
    quote: Compounds are not included in public libraries but comprise both metabolites and exposome
      chemicals.
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: The entrant predicts a molecule's structure from measurements of it, and the prediction
      is compared with the identity the organisers confirmed, structure by structure.
    source: src-casmi-2017-rules-categories
    quote: determined by matching the first block of the InChIKey between the submissions and the
      correct solutions
capability_considered_and_rejected:
  - term: hypothesis-generation
    reason: Entrants submit ranked candidate lists, but only the position of the one confirmed
      answer is scored, not the set; and from 2016 the automated categories hand out the candidates,
      which the term's exclusion names.
    source: src-casmi-2016-jcheminf-2017
    quote: Candidate lists containing the correct solution were provided, along with training data
      for parameter optimization.
  - term: abductive-reasoning
    reason: Choosing the structure that best explains a spectrum is inference to the best
      explanation, but the contest scores the rank of the answer in a proposed list rather than a
      settled conclusion, and its own claim is identification, which scientific-prediction covers.
  - term: knowledge-recall
    reason: Spectral-library lookup is one way to solve a challenge where the category allows it,
      but the in silico categories forbid it, and the organisers screen challenges against the
      libraries, so recall is a means some entrants use rather than what the contest measures.
    source: src-casmi-2016-rules-categories
    quote: Mass spectral libraries can only be used for training of prediction models, but not to
      solve the challenge by querying with the peaklist against the library.
  - term: perception
    reason: Most editions hand out peak lists the organisers have already extracted, cleaned and
      recalibrated, and what is scored is a chemical identity; only CASMI 2022 gives raw files.

evaluation_method:
  - exact-match
  - entrant-relative-ranking
evaluation_method_basis:
  reason: "Each submitted candidate is right or wrong by identity: its InChIKey first block matches the
    solution's or it does not (exact-match), and the per-challenge outcome is the rank of the correct
    candidate, from which Top-1, Top-3 and Top-10 counts follow. The winner is then decided against the
    field (entrant-relative-ranking): per challenge, gold goes to the entrant with the lowest rank among
    all entrants, and the category goes to the entrant with the most golds, so a team's standing moves
    with who else entered."
  source: src-casmi-2016-jcheminf-2017
  quote: Gold was awarded to the contestant(s) with the lowest rank among all contestants for that
    challenge.
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: The relative ranking position and the Formula 1 points score are CASMI's own
      interpretive measures, reported beside the winners, but they do not decide them; the 2012
      rules already declared winners on the absolute rank alone.
    source: src-casmi-2012-winners-metabolites
    quote: The winner(s) of a single challenge were those participants who achieved the best
      absolute rank.
  - term: classification-metric
    reason: Top-k counts are means of per-challenge verdicts, which the term's exclusion sends to
      exact-match; no statistic over a confusion matrix is computed.
  - term: composite
    reason: The Formula 1 score sums rank-weighted points of one method over the challenges, and the
      winners are declared by a medal tally of one per-challenge outcome; no sub-scores of different
      methods are combined.
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
  - human-ai-team
designed_for_subjects_basis:
  reason: The contests are built for in silico identification methods of both kinds -- models
    trained on mass spectra (CSI:IOKR won the 2016 in silico category) and combinatorial or
    rule-based fragmenters such as MetFrag and MAGMa -- and they also admit manual entries, in which
    experts interpret the spectra with database and literature searches; the 2013 winner was one.
  source: src-casmi-2016-jcheminf-2017
  quote: The machine learning and chemistry-based approaches are shown to perform in complementary
    ways.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: Manual entrants are admitted, but they work with spectral and chemical databases and
      often with automated tools, not unaided, which the term's exclusion sends to human-ai-team.
    source: src-casmi-2013-winners-mass-spectrom
    quote: by manually interpreting the challenge data and by searching in-house and public mass
      spectral databases
  - term: task-specific-supervised-model
    reason: The learned entrants are trained for a task chemistry defines, which the term's
      exclusion sends to domain-specialist-model.
  - term: scientific-surrogate-model
    reason: Some entrants predict spectra to compare candidates, but what is scored is the
      identification, not an emulated measurement.

as_used:
  - protocol: Molecular-formula annotation scored on the CASMI 2022 set as an external test, by
      recall of the correct formula and accuracy with the adduct known or unknown, rather than the
      contest's rank-based structure identification.
    source: src-arxiv-2611-01352
    quote: On the external CASMI 2022 set its recall is $1.000$, and with the adduct unknown it is
      the most accurate of the methods compared.
    note: FACET (arXiv v1, 2026-10-31); only the abstract was read.
  - protocol: Retrospective identification on the five contests' datasets from 2012 to 2017 with one
      database's tools, compared with the winning entries of each year.
    source: src-casmi-revisiting-metabolites-2020
    quote: we performed compound identification on all five CASMI contest datasets using Dashboard
      tools and data
    note: A US EPA group, 2020, which had not entered the contests.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the contest data, for example by a 2026 paper scored on the
    CASMI 2022 set, and a new contest was announced in September 2026.
  source: src-arxiv-2611-01352
  quote: On the external CASMI 2022 set its recall is $1.000$, and with the adduct unknown it is the
    most accurate of the methods compared.
activity: accepting-submissions
activity_note: CASMI 2026 was announced on 2026-09-15 and runs as a Kaggle competition. The Kaggle
  page renders by script and its rules, timeline and deadline were not read, so the round's being
  open rests on the announcement and its link (review_checks).
activity_basis:
  reason: The series site's newest contest points entrants to the Kaggle competition that is the
    2026 round.
  source: src-casmi-2026
  quote: Please head over to Enveda CASMI 2026 - Molecule ID From Mass Spectra for all details

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: CSI:IOKR (input output kernel regression), the winning CASMI 2016 Category 2 entry
    source: src-casmi-2016-jcheminf-2017
    observed_on: 2026-11-04
    quote: The Input Output Kernel Regression (CSI:IOKR) machine learning approach performed best in
  - system: FACET (a pretrained spectrum encoder with a neural scoring head), scored on CASMI 2022
    source: src-arxiv-2611-01352
    observed_on: 2026-11-04
    quote: A small neural scoring head then ranks every feasible formula from one pass of a
      pretrained spectrum encoder
evaluation_target: mixed
evaluation_target_note: Learned identification models, non-learned in silico fragmenters and manual
  expert entries all enter the same contests, and some categories admit all three, so no single
  target term covers the field of entrants.
execution_mode: automated
execution_mode_note: The scoring is automatic once a submission passes the format checks. Entries
  may be manual in the categories that allow it; that is the entrant, not the evaluation.
execution_mode_source: src-casmi-2016-jcheminf-2017
execution_mode_quote: the evaluation was automated provided the submission format passes all checks
ground_truth_source: held-out-labels
ground_truth_source_note: The identity of each challenge compound, known to the organisers before
  the contest because the spectra were measured from authentic standards or the identity was
  confirmed with one, and released as the solutions after the deadline.
ground_truth_source_source: src-casmi-2012-metabolites-2013
ground_truth_source_quote: In the GC-MS dataset, the final 16 challenges were all confirmed with
  reference standards
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every completed contest's spectra and solutions are public, so anyone can score a method
    on them, as an outside group did for five contests; what cannot be repeated is the blind round
    (execution.reproducibility_blockers).
  source: src-casmi-revisiting-metabolites-2020
  quote: we performed compound identification on all five CASMI contest datasets using Dashboard
    tools and data

task:
  exists: true
  input:
    - MS/MS peak lists for each challenge compound, with MS1 data, retention times or sample
      background where the edition provides them
    - in the automated categories from 2016, a candidate list containing the correct structure and a
      set of training spectra with known identities
    - in 2022, raw LC-MS/MS files in both ionisation modes, with the precursor m/z and retention
      time of each target
  output: For each challenge, a list of candidate formulas or structures (standard InChI or SMILES)
    with non-negative scores, higher meaning more likely; in 2022 also the adduct and the compound
    class.
  scoring: The rank of the correct structure in each list, matched by the first block of the
    InChIKey, with ties averaged and duplicate stereoisomers removed. Per challenge, the entrant
    with the best rank wins gold; the entrant with the most golds wins the category. Top-1, Top-3
    and Top-10 counts, mean and median ranks, relative ranking positions and a Formula 1-style
    points score are reported beside the medals. CASMI 2022 instead reported each team's percentage
    correct for adducts, formulas, classes and 2D structures, without declaring a winner.
  tests_hidden_from_system: true
  tests_hidden_from_system_note: The solutions are withheld until the submission deadline and then
    published; the 2017 contest also showed a pseudonymised interim leaderboard before the final
    deadline.
  source: src-casmi-2016-jcheminf-2017
  quote: containing the representation of the structure as the standard InChI or the SMILES code
    (column 1) and the score (column 2)
entrant_classes:
  - class: automated methods
    ranked_separately: true
    source: src-casmi-2014-rules
    quote: These will be considered separately!
  - class: manual methods
    ranked_separately: true
    source: src-casmi-2014-rules
    quote: Please indicate whether you used automated or manual methods for your submissions in the
      submission metadata file
entrant_classes_note: The 2014 rules evaluate automated and manual submissions apart. From 2016 the
  split is by category instead -- Category 1 admits any approach, Categories 2 to 4 are for
  automatic methods -- and in 2012 manual and automated entries were ranked together.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_by_phase:
    during_edition: challenge spectra public, solutions withheld until the deadline
    after_edition: solutions, submissions and results published on the contest website
    after_edition_source: src-casmi-2016-jcheminf-2017
    after_edition_quote: All data is now available on the CASMI website [15].
    note: The value is the completed editions'. CASMI 2026 runs on Kaggle, and its data terms and
      whether its test answers will be released were not read.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each contest brings new challenge compounds, because the previous ones become known; the
      2022 organisers gave that as the reason for a new dataset.
    source: src-fiehnlab-casmi-2022
    quote: As molecules of former CASMI contests are now well known, new datasets must be provided
      for testing compound ID strategies in 2022.
  data_provenance:
    - experimental-measurement
  data_provenance_note: Spectra measured on mass spectrometers from plant extracts, environmental
    samples and authentic standards; in 2016, 22 mixes of standards measured on one Orbitrap. The
    identities are known from the standards, not annotated.
  data_provenance_source: src-casmi-2016-jcheminf-2017
  data_provenance_quote: The spectra were obtained by measuring 22 mixes of authentic standards
  contamination_risk: high
  contamination_risk_note: The split at risk is every completed contest's challenge set used as a
    test set afterwards, as the 2026 paper uses CASMI 2022's. The solutions are published and the
    spectra go into MassBank, the public library that learned entrants train on, and in 2016 one
    team found a large overlap between the challenges and its own training set. During a contest the
    organisers screen the challenges against the libraries (the 2016 challenges had no MassBank
    spectrum above 0.85 similarity; the 2022 compounds were not in public libraries).
  contamination_evidence:
    - source: src-casmi-2016-jcheminf-2017
      stance: supports
      quote: there was a large overlap between the challenges and their training set
    - source: src-casmi-2016-jcheminf-2017
      stance: supports
      quote: All MS/MS spectra are now available on MassBank [11].
    - source: src-casmi-2012-metabolites-2013
      stance: supports
      quote: some compounds were uploaded to MassBank [8] after the challenge data was released
    - source: src-fiehnlab-casmi-2022
      stance: supports
      quote: As molecules of former CASMI contests are now well known, new datasets must be provided
        for testing compound ID strategies in 2022.
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: The decisive score is a medal tally against the other entrants, which is
    pool-relative, and no source states an attainable Top-1 rate; some challenges' isomers cannot be
    told apart by the measurement at all.
  dataset_licence: null
  dataset_licence_note: No licence is stated for the contest data on casmi-contest.org or on the UC
    Davis pages. The 2016 paper applies the CC0 waiver to data made available in the article, which
    is the article's own supplementary data, not the contest files. The 2026 data's Kaggle terms
    were not read.
  size:
    - count: 500
      unit: compounds with raw LC-MS/MS data, 250 of them prioritised
      subset: CASMI 2022
      source: src-fiehnlab-casmi-2022
      quote: We will prioritize 250 of these 500 compounds
    - count: 243
      unit: natural-product challenges (45 of them in Category 1)
      subset: CASMI 2017
      source: src-casmi-2017
      quote: With 45 (Category 1) and up to 243 (Categories 2&3) natural products challenges
    - count: 208
      unit: challenge MS/MS peak lists, from 188 substances
      subset: CASMI 2016, Categories 2 and 3
      source: src-casmi-2016-jcheminf-2017
      quote: The challenge dataset consisted of 208 peak lists from 188 substances
    - count: 312
      unit: training MS/MS peak lists with known identities, from 285 substances
      subset: CASMI 2016, Categories 2 and 3
      source: src-casmi-2016-jcheminf-2017
      quote: The training dataset consisted of 312 MS/MS peak lists (from 285 substances)
    - count: 18
      unit: natural-product challenges
      subset: CASMI 2016, Category 1
      source: src-casmi-2016-jcheminf-2017
      quote: with 18 challenges available, a number achievable for both manual and automatic methods
    - count: 42
      unit: challenges scored for the winners (six more unknowns evaluated afterwards)
      subset: CASMI 2014
      source: src-casmi-revisiting-metabolites-2020
      quote: A total of 42 challenge chemicals in the 2014 dataset were associated with LC-MS
        analyses
    - count: 16
      unit: challenges in the structure category (12 in the formula category)
      subset: CASMI 2013
      source: src-casmi-2013-winners-mass-spectrom
      quote: As a result, the entry called for 12 challenges in Category 1 and 16 challenges in
        Category 2.
    - count: 14
      unit: LC-HRMS/MS challenges (and 16 GC-MS challenges)
      subset: CASMI 2012
      source: src-casmi-2012-metabolites-2013
      quote: This finally resulted in 14 LC-HRMS challenges.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The organising team of each contest, under the casmi-contest.org series site
  maintainer_note: The founders, from IPB Halle and Eawag, ran 2012 and joined the 2016 and 2017
    teams; 2013 was run by the Mass Spectrometry Society of Japan; 2014 by organisers at Birmingham,
    UIC and the Noble Foundation; 2016 with French natural-products groups; 2022 by the UC Davis
    West Coast Metabolomics Center; and 2026 by Enveda Biosciences on Kaggle. casmi-contest.org
    links every edition and is the series' one stable address.
  maintainer_type: conference-workshop
  maintainer_type_note: community-collective was considered. No edition is held under one
    conference, but the organising team re-forms for each contest, the results are presented at
    workshops (the 2022 contest was a Metabolomics Society 2022 workshop), and continuity rests on
    volunteers, which is the governance this term records.
  maintainer_type_source: src-casmi-2026
  maintainer_type_quote: This year the contest is organised by the Team of Enveda Biosciences.
  submission_process: held-out-server
  submission_process_note: There is no server before 2026. Entrants send files to the organisers,
    who score them after the deadline against solutions the entrants have not seen; 2017 added an
    interim pseudonymised leaderboard, and 2026 runs on Kaggle, whose submission rules were not
    read.
  submission_process_source: src-casmi-2017-rules
  submission_process_quote: publish a summarised and pseudonymised leaderboard showing the current
    overall performance, where only participants know their own pseudonym
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-casmi-2012-winners-metabolites
      quote: As we had processed the challenges with our own methods to test the evaluation, we also
        submitted these results
    - flag: prize-sponsored-by-industry
      source: src-casmi-2026
      quote: there are $50,000 in Kaggle Awards Points & Medals
  independence_flags_note: In 2012 the organisers entered their own methods as internal
    participants, who were not counted for the winners, and the 2016 organisers ran their own tool
    outside the contest; organisers' tools (MetFrag, MAGMa, CSI:FingerID among them) are also among
    the methods most often entered. The 2026 contest is organised by a company, Enveda Biosciences,
    with $50,000 in Kaggle award points; whether those are a prize in this flag's sense is a
    reviewer's call (review_checks).
  independence_assessed: true
  funding:
    source: src-casmi-2014
    quote: Support is provided by the Metabolite Identification task group of the Metabolomics
      Society
  funding_note: Each edition is supported by its organisers' institutions and societies; the 2012
    organisers say they made no financial gain, and the 2016 paper says there is neither a fee nor
    prize money. 2026 is the first edition with award points.
  participation:
    source: src-casmi-2016-jcheminf-2017
    quote: CASMI is purely a research activity—there is no fee for participation but likewise also
      no prize money for the winners.
  participation_note: Open to anyone in every edition. Entrants describe their method in an abstract
    with each submission, and from 2016 may enter up to three submissions per approach and category,
    of which only the best counts.
  independence_policy:
    source: src-casmi-2012-winners-metabolites
    quote: the internal participants were not considered in declaring the winner for the CASMI
      contest
  known_limitation:
    source: src-casmi-2012-metabolites-2013
    quote: The disadvantage of providing many challenges is that it creates an advantage for fully
      automated entries

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: No source states what an entrant's run costs. The scoring itself is a script
    over submitted lists; the entrants' methods range from manual interpretation to trained models.
  reproducibility_tier: null
  reproducibility_tier_note: Two answers, as for CASP. Scoring a new method on a completed contest's
    released spectra and solutions needs nothing the maintainer holds; re-running a contest blind is
    possible only while one is open. No tier term distinguishes these.
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: What cannot be repeated is blindness, because each contest's
    solutions and spectra are published when it ends.
  harness_availability: null
  harness_note: The organisers scored submissions with R scripts, and the 2017 rules link an
    evaluation script in the project's old SourceForge Subversion repository; that link now
    redirects to the project page, and the script was not read.
  harness_source: src-casmi-2016-jcheminf-2017
  harness_quote: to satisfy the R scripts used to perform the automatic evaluation, results and web
    page generation
  submission_channel:
    source: src-casmi-2026
    quote: Please head over to Enveda CASMI 2026 - Molecule ID From Mass Spectra for all details
  submission_channel_note: Earlier editions took submissions by e-mail or upload to the organisers
    (history[]).
  est_participant_cost_usd: null
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the profile: the edition and category (each has its own challenge set, and Categories 2 and 3
  # of 2016 share the challenges but differ in what information may be used), whether a human chose the
  # answer, and what the method was trained on, since the past challenges' spectra are in the public
  # libraries learned entrants train on.
  material_extra:
    - subset_used
    - eligibility_track
    - human_assistance
    - training_data_policy

aggregation_policy: official-aggregate
aggregation_policy_note: The official aggregate is per category and per contest -- a medal tally of
  per-challenge golds -- and there is none across categories or editions. CASMI 2022 declared no
  winner.
aggregation_policy_source: src-casmi-2016-jcheminf-2017
aggregation_policy_quote: The overall winner was determined using an Olympic medal tally scheme,
  i.e. the participants with the most gold medals per category won.
headline_metric: null
headline_metric_note: No Metric record exists yet for the per-challenge rank of the correct
  structure or for the medal tally.
no_legitimate_aggregate: false

liveness:
  repo_last_commit: null
  leaderboard_last_updated: null
  reproduction_script_present: null
  reproduction_script_verified: null
  last_checked: 2026-11-04
liveness_note: The series site's newest dated entry is the CASMI 2026 announcement of 2026-09-15;
  the 2026 Kaggle leaderboard was not read.

homepage: http://www.casmi-contest.org/
leaderboard_url: https://www.kaggle.com/competitions/enveda-CASMI26-molecule-id-mass-spectra
leaderboard_url_note: The 2026 competition, as linked from the series site; earlier editions publish
  their results as static pages on casmi-contest.org and, for 2022, on the UC Davis site.

versions:
  - version: casmi-2012
    label: CASMI 2012 -- LC-HRMS/MS and GC-MS
    version_kind: edition
    released: 2012-07-20
    changes: The inaugural contest, run by its founders. Four categories, best formula and best
      structure for LC-HRMS/MS data and for unit-resolution GC-MS data, over 14 and 16 challenges
      from plant material, environmental samples and standards; no outside team entered the GC-MS
      categories. Solutions were released on 2013-02-06.
    breaking: true
    superseded_by: casmi-2013
    frozen: true
    sources:
      - src-casmi-2012-winners-metabolites
      - src-casmi-2012-metabolites-2013
  - version: casmi-2013
    label: CASMI 2013 -- organised by the Mass Spectrometry Society of Japan
    version_kind: edition
    released: 2013-09-02
    changes: Sixteen LC-MS/MS challenges in a formula and a structure category, with no GC-MS

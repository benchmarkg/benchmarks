curation:
  added_by: agent (P1-S6-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-rsc-d2dd00015f-pdf
    - src-github-paroutes-readme
    - src-github-paroutes-data-readme
    - src-github-paroutes-download-data
    - src-github-paroutes-route-quality
    - src-github-paroutes-commit-bc5e695-diff
    - src-zenodo-6275421
    - src-zenodo-7341155
    - src-arxiv-2405-13983-v3
    - src-arxiv-2405-13983
    - src-arxiv-2609-25118-v1
    - src-arxiv-2609-25118
  sources_note: >
    The paper's version of record (a DOI, not archived) read through its Wayback capture because the publisher
    and ChemRxiv refused this project's fetcher; four repository files and one commit diff at bc5e695
    (pending archive); the two Zenodo JSON records (DOIs); and two later papers' PDFs and abstract pages
    (DOIs) as evidence of current use. GitHub's API was read for commit dates, tags and the licence, and
    the Zenodo target and stock files were downloaded and compared line by line; neither is a Source.
  confidence: medium
  review_checks:
    - check: 2.0 is modelled as an edition (new items on the same task) because only about 14% of
        its targets are 1.0's, but the counting is this curator's (line comparison of the Zenodo
        files), not a quoted statement, and both releases fall in 2022 rather than in a new year.
        The maintainers call 2.0 a version; if a reviewer reads a re-extraction by the same
        maintainer as a revision, the version_kind changes but breaking stays true.
      field: versions
      source: src-zenodo-7341155
      quote: PaRoutes 2.0 reference routes and stocks.
    - check: The 2024-08-05 correction of the README's 2.0 table is recorded as an erratum on 2.0,
        but it changes the maintainers' baselines, not the items. DirectMultiStep (2025) compares
        against the pre-correction figures. A reviewer should check whether an erratum, a history
        event or a ResultClaim correction is the right home.
      field: versions
      source: src-arxiv-2405-13983-v3
      quote: 'Table 3: Top-K accuracy on route test set-n1 (10 000 routes). Top-1 0.17 0.15 0.11'
    - check: exact-match was kept although the comparison is a tree edit distance of zero, which
        goes beyond the term's whitespace-or-case normalisation (as with USPTO-50k's InChI
        comparison); domain-metric is the other reading, if TED is taken as the metric rather than
        the identity test on it.
      field: evaluation_method
      source: src-github-paroutes-route-quality
      quote: 'if dist < 1e-6:'
    - check: The facets resolve to llm-static-text (exact-match with domain-specialist-model) and
        fallback, as for USPTO-50k; no profile fits a planner whose search budget, one-step training
        data and extra inputs are the material conditions. max_steps (for the iteration budget) and
        eligibility_track (for extra inputs) are stretches of those fields.
      field: comparability
    - check: capability is planning and search-exploration; hypothesis-generation was rejected
        although the cluster count scores the set of candidate routes. A reviewer may weigh it
        against search-exploration.
      field: capability
      source: src-rsc-d2dd00015f-pdf
      quote: the optimal number of clusters is viewed as a metric of diversity
    - check: designed_for_subjects keeps classical-algorithm on the paper's invitation to expert
        systems; all of the paper's own entrants carry a learned one-step model. agent-scaffold was
        rejected for tree search, and Rachel's LLM planner is under observed_subjects only.
      field: designed_for_subjects
      source: src-rsc-d2dd00015f-pdf
      quote: If your one-step model is an expert system not derived from big-data extraction, you
        should be able to use the provided targets and stock, and not consider the provided reaction
        datasets.
    - check: contamination_risk high follows USPTO-50k. It could be medium, since PaRoutes ships a
        training subset without the reference reactions and the risk is each entrant's training
        choice (training_data_policy).
      field: data.contamination_risk
    - check: The paper's stock sizes (13,633 and 13,783) differ from the 1.0 Zenodo files' line
        counts (13,647 and 13,798), and the 2.0 stocks (13,432 and 13,328) are quoted by no source.
        The 2.0 sizes and the ~450k pool come from the data README and file counts only.
      field: data.size
    - check: dataset_licence is CC-BY-4.0 from both Zenodo records; DirectMultiStep describes the
        2.0 route data as Apache 2.0, the repository's code licence. The upstream USPTO extraction's
        licence was not read.
      field: data.dataset_licence
      source: src-arxiv-2405-13983-v3
      quote: The reaction route dataset is from the 2.0 version of PaRoutes in their GitHub
        repository [44], available under the Apache License 2.0.
    - check: The paper was read through a Wayback capture of the publisher's PDF, which drops the
        fi, fl and ft ligatures in its text layer; the ChemRxiv preprint and the ESI (pseudo-code,
        the cross-comparison tables) were not read. Rachel's PaRoutes120 does not state which
        PaRoutes version its targets come from.
      field: curation.sources

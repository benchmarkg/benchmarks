# data/benchmarks/vision/coco.yaml
#
# P1-S3-T01, checkpoint entry 2 of 10 (copilot off: written from the sources with no drafter). Filled from
# the COCO paper, arXiv 1405.0312 read as its v3 PDF (2015-02-21), and its abstract page; four pages of
# cocodataset.org (home, test guidelines, detection evaluation, terms of use); and the detection test-dev
# server on CodaLab's LISN instance, where the maintainers moved it. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The entry is the family: detection with boxes and masks, keypoints, stuff, panoptic, DensePose and the 2015
# captioning challenge are tracks of one dataset and one site, so they are not separate entries.

id: coco
name: COCO
aliases:
  - Microsoft COCO
  - Common Objects in Context
  - MS COCO
tagline: Object detection and segmentation on everyday photographs, scored on a test split with withheld labels.
description: >
  A dataset of everyday scenes photographed with objects in their natural context, labelled with
  per-instance segmentation masks for 80 object categories, and with keypoints, stuff and panoptic labels and
  captions added in later releases. The maintainers ran annual challenges from 2015 to 2020 on detection
  (boxes and masks), keypoints, stuff, panoptic segmentation, DensePose and captioning. The headline number is
  box or mask AP, averaged over ten IoU thresholds and the 80 categories, on the test-dev split. Its
  annotations are withheld and a public evaluation server scores it all year round.
self_description:
  source: src-arxiv-1405-0312-v3
  quote: We present a new dataset with the goal of advancing the state-of-the-art in object recognition by
    placing the question of object recognition in the context of the broader question of scene understanding
external_ids:
  arxiv: '1405.0312'
paper:
  title: 'Microsoft COCO: Common Objects in Context'
  arxiv: '1405.0312'
  version_read: v3
  source: src-arxiv-1405-0312-v3
released: 2014-05-01
released_note: The paper's first arXiv version, as the abstract page dates it.
released_source: src-arxiv-1405-0312
released_quote: Submitted on 1 May 2014

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/detection
  secondary:
    - vision/segmentation
    - multimodal/any-to-any-generation
domain_basis:
  reason: Detection is the original task and the one the paper's baselines and the year-round server score.
    Stuff and panoptic segmentation label every pixel, so segmentation is secondary. The 2015 captioning
    challenge generates text from an image, which is any-to-any-generation's case. The keypoint and DensePose
    tracks have no vision leaf (logged in Stage 3, coco-001).
  source: src-cocodataset-home
  quote: COCO is a large-scale object detection, segmentation, and captioning dataset
capability:
  - perception
capability_basis:
  perception:
    reason: Every track asks what is in a photograph and where -- object instances, their masks, people's
      keypoints, stuff regions or a caption -- and scores it against labels.
    source: src-arxiv-1405-0312-v3
    quote: Objects are labeled using per-instance segmentations to aid in precise object localization
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Localisation is scored as box or mask overlap, a perceptual output; no task asks for reasoning about
      spatial relations.

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: AP over IoU thresholds is the detection field's own measure (domain-metric names mAP and IoU). It is
    one metric averaged over its own sweep of thresholds and categories, so it is not composite (Stage 3's
    coco-002, since resolved). The captioning challenge's metrics were not read; see the reviewer checks.
  source: src-cocodataset-detection-eval
  quote: AP (averaged across all 10 IoU thresholds and all 80 categories) will determine the challenge winner

lifecycle: active
lifecycle_basis:
  reason: The annual challenge ended after 2020. The maintainers pointed entrants to LVIS rather than to a new
    COCO edition. But the test-dev server they moved to CodaLab's LISN instance stays open, and papers still
    report on it. Under ADR-0019 the end of the series goes in activity, and the instrument keeps its standing
    (Stage 3's coco-004, since resolved).
  source: src-cocodataset-home
  quote: Please note that there will not be a COCO 2021 Challenge, instead, we encourage people to participate
    in the LVIS 2021 Challenge
activity: leaderboard-live-no-round
activity_basis:
  reason: No challenge round has run since 2020, but the bounding-box test-dev phase on the migrated server
    was open on 2026-10-10 and runs until the end of 2030. The maintainers' guidelines keep test-dev open all
    year.
  source: src-codalab-lisn-coco-detection-bbox
  quote: Current test-dev (bbox) Aug. 11, 2019, midnight UTC End Competition Ends Dec. 31, 2030
activity_note: The guidelines say the same in general terms ("The test-dev server will remain open year-round",
  src-cocodataset-guidelines). Only the bounding-box server was read; the mask, keypoint, stuff and panoptic
  servers moved at the same time and were not.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DPMv5-C
    source: src-arxiv-1405-0312-v3
    observed_on: 2026-10-10
    quote: 'DPMv5-C: the same implementation trained on COCO'
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The entrants are object detectors trained on COCO's own train split and scored as trained -- the
    term's own first example.
  source: src-cocodataset-detection-eval
  quote: To obtain results on the COCO test set, for which ground-truth annotations are hidden, generated
    results must be uploaded to the evaluation server
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Crowd-annotated instance masks, boxes, keypoints and captions for the test images,
  held by the maintainers.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can run a detector on the released test images and submit to the public server, and the val
    split can be scored locally with the published evaluation code.
  source: src-cocodataset-guidelines
  quote: The test-dev server will remain open year-round

task:
  exists: true
  input:
    - one photograph of an everyday scene
  output: Per track -- scored boxes or instance masks with a category for each object, person keypoints, a
    stuff or panoptic labelling of every pixel, or a caption.
  scoring: Detection AP over ten IoU thresholds and 80 categories, with at most 100 detections per image, on
    test-dev through the evaluation server, or on val locally.
  source: src-cocodataset-detection-eval
  quote: AP (averaged across all 10 IoU thresholds and all 80 categories) will determine the challenge winner

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_basis:
    reason: Train and val images and annotations are public. Test images are released but their annotations
      are not, and test results come only from the maintainers' server.
    source: src-arxiv-1405-0312-v3
    quote: Following established protocol, annotations for train and validation data will be released, but not
      for test
  refresh: versioned-releases
  refresh_basis:
    reason: The content changed in dated, named releases -- the 2014 split, the 2015 test set, and the 2017
      re-split of the same images -- and every challenge names the split it used.
    source: src-cocodataset-guidelines
    quote: Note that the 2017 train/val data includes the same images as the 2014 train/val data just organized
      differently
  data_provenance:
    - web-scraped
    - crowd-authored
  data_provenance_note: Photographs were collected from Flickr; instances, masks and captions were labelled
    by Amazon Mechanical Turk workers ("we employed a novel pipeline for gathering data with extensive use of
    Amazon Mechanical Turk", same Source).
  data_provenance_source: src-arxiv-1405-0312-v3
  data_provenance_quote: we collected images from Flickr which tends to have fewer iconic images
  contamination_risk: medium
  contamination_risk_note: The test annotations are private and training on the test sets is forbidden. But the
    test images themselves are public, and so are the Flickr originals, so a detector can see them without
    their labels, and web-scale pretraining is a plausible route. The maintainers report no overfitting across
    the old test splits; nobody has assessed pretraining overlap.
  contamination_evidence: []
  dataset_licence: CC-BY-4.0
  dataset_licence_source: src-cocodataset-termsofuse
  dataset_licence_quote: The annotations in this dataset along with this website belong to the COCO
    Consortium and are licensed under a Creative Commons Attribution 4.0 License
  upstream_licences: The images remain under their Flickr owners' copyright and the Flickr Terms of Use.
  upstream_licences_source: src-cocodataset-termsofuse
  upstream_licences_quote: Use of the images must abide by the Flickr Terms of Use
  submission_limit:
    max_submissions: 5
    period_days: 1
    per: participant, on test-dev
    source: src-cocodataset-guidelines
  size_note: The paper counts 2.5 million labelled instances in 328k images ("With a total of 2.5 million
    labeled instances in 328k images"); the 2017 test set holds about 40K images, half of them test-dev.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: COCO Consortium
  maintainer_basis:
    reason: The site names the COCO Consortium as owner of the annotations and the site. The paper's authors
      came from Microsoft and several universities.
    source: src-cocodataset-termsofuse
    quote: The annotations in this dataset along with this website belong to the COCO Consortium
  maintainer_type: community-collective
  maintainer_type_note: The consortium states no legal form, and consortium's exclusion test sends a group with
    no stated legal form to community-collective (Stage 3's coco-005, since resolved).
  submission_process:
    - held-out-server
  submission_process_source: src-cocodataset-detection-eval
  submission_process_quote: To obtain results on the COCO test set, for which ground-truth annotations are
    hidden, generated results must be uploaded to the evaluation server
  independence_flags: []
  independence_flags_note: None recorded. The paper's authors include Microsoft researchers; the sources read
    show no evaluated party in the scoring.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline figure is test-dev AP, and only the maintainers' server can produce it because they
      hold the test annotations. The val split can be scored by anyone with the same code, but the guidelines
      ask papers to report test-dev.
    source: src-cocodataset-guidelines
    quote: Results in papers should generally be reported on test-dev to allow for fair public comparison
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: cocoapi (cocoeval.py / CocoEval.m)
  harness_source: src-cocodataset-detection-eval
  harness_quote: Evaluation code is available on the COCO github
  code_licence: BSD-3-Clause
  code_licence_note: The terms of use carry a three-clause BSD notice for the software. The cocoapi repository's
    own licence file was not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated
  submission_channel:
    source: src-codalab-lisn-coco-detection-bbox
    quote: Current test-dev (bbox) Aug. 11, 2019, midnight UTC End Competition Ends Dec. 31, 2030
  submission_channel_note: The site's upload page still links competitions.codalab.org. CodaLab suspended that
    server, and its COCO pages are read-only and point to codalab.lisn.upsaclay.fr, where the bounding-box
    server is competition 7384.

comparability:
  # Two conditions beyond the fallback profile change a COCO number. Which split it was scored on (val
  # locally, test-dev or test-challenge on the server) and whether external training data was used. The
  # guidelines allow any external data, and entrants must declare it in the method description.
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://cocodataset.org/
repository: https://github.com/cocodataset/cocoapi
leaderboard_url: https://cocodataset.org/#detection-leaderboard

tags:
  - object-detection
  - instance-segmentation
  - keypoints
  - captioning

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S3-T01)
  added_on: 2026-10-10
  last_verified: 2026-10-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1405-0312-v3
    - src-arxiv-1405-0312
    - src-cocodataset-home
    - src-cocodataset-guidelines
    - src-cocodataset-detection-eval
    - src-cocodataset-termsofuse
    - src-codalab-lisn-coco-detection-bbox
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text in reading order, and its abstract page for the
    release date. cocodataset.org renders its tabs from dataset/<tab>.htm by script, so each Source is the
    fragment the script loads, at the URL fetched. The CodaLab LISN page is the bounding-box server only. Its
    extract keeps narrow windows, so it leaves out the organiser's account name next to the phase dates.
  confidence: medium
  notes: |
    Reviewer checks:
    - Captioning (2015 only): its metrics were not read, so evaluation_method may be missing reference-metric.
    - code_licence BSD-3-Clause is read from the site's terms of use, not from the cocoapi repository.
    - The keypoint, mask, stuff and panoptic servers were not read; activity rests on the box server.

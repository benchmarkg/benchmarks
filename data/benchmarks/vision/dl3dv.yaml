# data/benchmarks/vision/dl3dv.yaml
#
# P1-S8-T06, vision entry 12. Filled from the DL3DV-10K paper, arXiv 2312.16256 read as its v2 PDF (2023-12-29,
# the latest version, with its supplementary material; CVPR 2024), and its abstract page; the project page
# (scripts and styles stripped); the repository's README and License.md at main; the Hugging Face API records of
# the gated DL3DV-Benchmark and DL3DV-Evaluation datasets (read through the API, with no terms accepted); and two
# 2026 papers that report on the benchmark scenes, the v1 PDFs of DeltaSplat (arXiv 2610.09853, October 2026) and
# GradSplat (arXiv 2610.38951, October 2026). Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# The entry is DL3DV-10K and its novel-view synthesis benchmark, DL3DV-140. The 55-scene DL3DV-Evaluation split
# the same maintainers released in September 2025 is a version (a track-set) of it, not a benchmark of its own.

id: dl3dv
name: DL3DV-10K
aliases:
  - DL3DV-140
  - DL3DV
  - DL3DV Benchmark
tagline: 'Real-world scene videos for novel view synthesis: 140 benchmark scenes, held-out frames scored
  by PSNR, SSIM and LPIPS.'
description: >
  A dataset of 10,510 real-world scene videos at 4K resolution, filmed with consumer phones and drones
  at locations of 65 point-of-interest types, with COLMAP camera poses and labels for each scene's environment
  (indoor or outdoor), reflection, transparency, lighting and texture frequency (CVPR 2024). Its benchmark,
  DL3DV-140, samples 140 static scenes balanced over those labels. A method is fitted on 7/8 of a scene's
  300 to 380 frames at 960 by 560 pixels and renders the held-out 1/8; the renderings are scored against
  the held-out photographs by PSNR, SSIM and LPIPS, averaged over the 140 scenes. The paper scores five
  per-scene methods (Nerfacto, Instant-NGP, Mip-NeRF 360, Zip-NeRF and 3D Gaussian Splatting) and pretrains
  a generalizable NeRF on subsets of the full dataset. There is no leaderboard and no evaluation code.
  In 2025-2026 the scenes are used chiefly by feed-forward 3D Gaussian Splatting models trained on DL3DV-10K
  and tested on the 140 scenes from 6 to 24 context views at low resolution, with view indices taken from
  other groups' repositories. In September 2025 the maintainers added DL3DV-Evaluation, 55 scenes that
  do not overlap the training release.
self_description:
  source: src-arxiv-2312-16256-v2
  quote: Additionally, we present DL3DV-140, a comprehensive benchmark for NVS, by sampling 140
    scenes from the dataset.
external_ids:
  huggingface: DL3DV/DL3DV-Benchmark
  arxiv: '2312.16256'
paper:
  title: 'DL3DV-10K: A Large-Scale Scene Dataset for Deep Learning-based 3D Vision'
  arxiv: '2312.16256'
  doi: 10.48550/arXiv.2312.16256
  version_read: v2
  source: src-arxiv-2312-16256-v2
released: 2023-12-26
released_note: The paper's first arXiv version; the benchmark's Hugging Face dataset was created on
  2023-12-31.
released_source: src-arxiv-2312-16256
released_quote: Submitted on 26 Dec 2023 (v1), last revised 29 Dec 2023 (this version, v2)
release_venue: CVPR 2024
release_venue_note: From the README's BibTeX, which gives the CVPR proceedings and the year 2024.
release_venue_source: src-github-dl3dv-readme
release_venue_quote: Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern
  Recognition

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/novel-view-synthesis
domain_basis:
  reason: The benchmark renders unobserved views of each scene and scores them against held-out
    photographs by image metrics, which is the novel-view-synthesis leaf's definition. No language
    enters the input or the score, so the vision/multimodal boundary (02 S11 rule 12) does not
    arise.
  source: src-arxiv-2312-16256-v2
  quote: We compare the SOTA NVS methods and the corresponding ground truth images on DL3DV-140 from
    held-out test views.
domain_considered_and_rejected:
  - term: vision/3d-reconstruction
    reason: The dataset ships COLMAP poses and serves 3D representation learning, but nothing scores
      recovered geometry; the leaf's own not_to_be_confused_with sends a score on a rendered image
      to novel-view-synthesis.
    source: src-arxiv-2312-16256-v2
    quote: NeRF excels at producing detailed and realistic views, overcoming challenges faced by
      traditional 3D reconstruction methods and rendering techniques.
  - term: vision/video-generation
    reason: Camera-controlled video generators train on DL3DV videos, which the README advertises,
      but that is use of the dataset as training data and defines no score of the benchmark's.
    source: src-github-dl3dv-readme
    quote: employs DL3DV for **camera control** video generation
  - term: multimodal/any-to-any-generation
    reason: No text conditions the input or is scored; the project page lists vision-language model
      research among the dataset's uses, but the benchmark has no language component.
capability:
  - generation-fidelity
capability_basis:
  generation-fidelity:
    reason: Each rendering is compared with the held-out photograph by PSNR, SSIM and LPIPS, a
      produced image scored by similarity to a reference, which is the term's inclusion test; Stage
      3 read ScanNet++'s novel-view tracks the same way.
    source: src-arxiv-2312-16256-v2
    quote: Tab. 3 summarizes the average PSNR, SSIM, and L-PIPS metrics across all scenes in
      DL3DV-140
capability_considered_and_rejected:
  - term: perception
    reason: A method must recover the scene from its views, but what is scored is the rendered
      image's closeness to a photograph, not structure extracted from the signal; ScanNet++'s Stage
      3 record keeps perception for its segmentation tracks only.
  - term: spatial-reasoning
    reason: Thoroughly spatial, but the score is rendering fidelity, and the term's exclusion test
      sends reconstruction-type accuracy elsewhere.
  - term: distribution-shift-generalization
    reason: The complexity labels (indoor or outdoor, reflection, transparency, texture frequency)
      are breakdowns of the 140-scene mean, not shifted conditions with their own score; GradSplat's
      zero-shot transfer from RealEstate10K is a use (as_used), not the benchmark's design.
    source: src-arxiv-2312-16256-v2
    quote: Among all indices, outdoor (unbounded) scenes appear to be the most challenging
  - term: sample-efficiency
    reason: The feed-forward users fix 6 to 24 context views, but that budget is their protocol; the
      benchmark fits each scene on 7/8 of its frames.
    source: src-arxiv-2312-16256-v2
    quote: We use 7/8 of the images for training and 1/8 of the images for testing.

evaluation_method:
  - domain-metric
  - model-derived-metric
evaluation_method_note: PSNR and SSIM are image-fidelity measures standard in the field and are
  tagged domain-metric, as NTIRE's restoration tracks and ScanNet++'s Stage 3 record were. LPIPS is
  computed by a pretrained network (model-derived-metric); neither the paper nor the users read name
  its backbone or version. The three are reported side by side and not combined.
evaluation_method_basis:
  reason: The paper reports the mean of each metric over the 140 scenes, with no combined figure.
  source: src-arxiv-2312-16256-v2
  quote: The error metric is calculated from the mean of 140 scenes on a scale factor of 4.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: Three metrics of different methods are reported, but never folded into one number.
  - term: statistical-fit
    reason: PSNR is a log transform of mean squared error and could be read as a general statistic;
      it is kept as domain-metric for consistency with NTIRE (see review_checks).
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The paper's entrants are per-scene fitting procedures (four NeRF variants and 3D Gaussian
    Splatting), refitted on each scene's training views and scored on reproducing its held-out ones,
    which the term's refitted-procedure clause covers; its pilot pretrains a generalizable NeRF on
    DL3DV-10K, and today's feed-forward entrants are networks trained on the dataset for the task.
  source: src-arxiv-2312-16256-v2
  quote: Recent NeRFs and 3DGS aim to only fit the training scene.
designed_for_subjects_considered_and_rejected:
  - term: generative-media-model
    reason: The methods output images, but they are fitted or trained to reproduce a reference
      photograph, which the term's exclusion sends to task-specific-supervised-model.
  - term: classical-algorithm
    reason: Every method the paper scores is a NeRF variant or 3D Gaussian Splatting, optimised by
      gradient descent per scene; no non-learned renderer is evaluated.
as_used:
  - protocol: Feed-forward sparse-view synthesis. A network trained on DL3DV-10K predicts 3D
      Gaussians from 6, 12 or 24 context views of each of the 140 scenes at 224 by 224 pixels and is
      scored by PSNR, SSIM and LPIPS on target views, with or without ground-truth poses and
      intrinsics. The benchmark was designed for per-scene fitting on 7/8 of the frames at 960 by
      560.
    split: DL3DV-140
    source: src-arxiv-2610-09853-v1
    quote: All images are processed at a resolution of 224 × 224, and experiments are conducted with
      6, 12, and 24 context views.
    note: DeltaSplat (October 2026). How its DL3DV-10K training split excludes the 140 benchmark
      scenes is not stated in it.
  - protocol: Zero-shot transfer. A feed-forward model trained on RealEstate10K is scored without
      fine-tuning on six input and eight target views per scene, taken from the scene index released
      with another group's method (ReSplat); one scene stored at half size in the benchmark download
      is dropped, leaving 139.
    split: DL3DV-140 (139 scenes)
    source: src-arxiv-2610-38951-v1
    quote: Transfer is measured on 139 of the 140 scenes of the DL3DV [22] index released with
      ReSplat [47], with six input views and eight target views per scene.
    note: GradSplat (October 2026). The view indices come from a third party's repository, not the
      maintainers.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the 140 scenes. Two October 2026 papers report on them,
    DeltaSplat trained on DL3DV-10K and GradSplat transferred from RealEstate10K; the repository was
    last changed in February 2026, which is maintenance evidence, not use.
  source: src-arxiv-2610-09853-v1
  quote: trainset and evaluate on 140-scene testset.
activity: no-submission-channel
activity_basis:
  reason: The maintainers publish only the release paper's results for five methods of 2023, in the
    README and the benchmark dataset; there is no leaderboard, server or submission route, and users
    report their numbers in their own papers.
  source: src-github-dl3dv-readme
  quote: We report the performances of the main STOA methods (2023 Fall) on our large-scale NVS
    benchmark.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DeltaSplat
    source: src-arxiv-2610-09853-v1
    observed_on: 2026-11-08
    quote: On DL3DV, DeltaSplat reaches 26.64 dB PSNR in the posefree setting
    note: A feed-forward 3D Gaussian Splatting network trained on DL3DV-10K, scored on the 140
      scenes at six context views.
evaluation_target: learned-system
evaluation_target_basis:
  reason: Every method the paper scores is fitted to the scene by gradient descent (NeRF variants
    and 3D Gaussian Splatting), and today's entrants are trained feed-forward networks; no classical
    pipeline is an entrant.
  source: src-arxiv-2312-16256-v2
  quote: MipNeRF360 [3] and 3D gaussian splatting (3DGS) [15] codes are from the authors.
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The reference is each scene's held-out 1/8 of frames, photographs from the
  capture itself. They are not withheld from entrants, since every frame of the benchmark scenes is
  in the gated download; held-out means held out of the fitting.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone who accepts the click-through terms can download the 140 scenes with their poses
    and test frames and compute the three metrics; nothing is scored by the maintainers.
  source: src-github-dl3dv-readme
  quote: If you request the access, you automatically sign our term of use and license and can
    access the dataset.

task:
  exists: true
  input:
    - the training views of one scene, 7/8 of its 300 to 380 frames at 960 by 560 pixels, with
      COLMAP camera poses
  output: Renderings of the scene at the camera poses of its held-out 1/8 of frames.
  scoring: PSNR, SSIM and LPIPS of each rendering against the held-out photograph, averaged over the
    scene's test views and then over the 140 scenes; the paper adds training time and memory, and
    breaks the means down by the scenes' complexity labels.
  source: src-arxiv-2312-16256-v2
  quote: Each scene in the benchmark has 300-380 images, depending on the scene size.

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: Both DL3DV-Benchmark and DL3DV-Evaluation are gated Hugging Face datasets with
    automatic approval (gated "auto" in their API records); requesting access signs the terms of
    use. Eleven sample scenes are free to download; whether any of them is a benchmark scene was not
    checked.
  access_basis:
    reason: The evaluation frames are released with the training frames, and every official copy
      sits behind a click-through request.
    source: src-github-dl3dv-readme
    quote: Please go to the relevant huggingface dataset page and request the access.
  refresh: versioned-releases
  refresh_note: The 140 scenes have not changed in the sources read; the family's content grew by
    the dated September 2025 release of the 55-scene evaluation split.
  refresh_basis:
    reason: DL3DV-Evaluation, a separate test set, was added by the same maintainers on a dated
      release, beside the unchanged DL3DV-140.
    source: src-hf-api-dl3dv-evaluation
    quote: '"createdAt":"2025-09-11T09:12:11.000Z"'
  data_provenance:
    - real-world-instrument
  data_provenance_note: Videos filmed by trained collectors with consumer phones (10,407 scenes) and
    drones (103), with camera poses computed by COLMAP; the complexity labels were annotated by hand
    and are not scored.
  data_provenance_source: src-arxiv-2312-16256-v2
  data_provenance_quote: leveraging widely available consumer mobiles and drones to ensure the
    coverage of everyday accessible areas
  contamination_risk: high
  contamination_risk_note: The 140 benchmark scenes were sampled from DL3DV-10K, whose full release
    is the training set of the feed-forward models now scored on them, so a model trained on the
    whole release has seen the test scenes. The per-scene protocol is unaffected, since each method
    is fitted only on its scene's training frames. The maintainers' 2025 evaluation split has no
    overlap with DL3DV-10K, which closes the route for that split only; whether the 2026 users
    remove the 140 scenes from training is not stated in them.
  contamination_evidence:
    - source: src-hf-api-dl3dv-benchmark
      stance: supports
      quote: This repo contains 140 scenes in the DL3DV-benchmark, which are sampled from DL3DV-10K.
    - source: src-hf-api-dl3dv-evaluation
      stance: supports
      quote: 'Note: it is an independent dataset, and none of its scenes overlap with those in DL3DV-10K.'
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: PSNR has no finite top; SSIM tops out at 1 and LPIPS at 0, but no source
    measures an achievable ceiling.
  dataset_licence: CC-BY-NC-4.0, with the DL3DV-10K Terms of Use
  dataset_licence_note: License.md puts the dataset under the terms of use and CC BY-NC 4.0; the
    terms allow non-commercial research and education only and forbid sharing the data. The README
    now says the latest licence is open to usage of the dataset, which License.md (last changed
    January 2024) does not reflect. See review_checks.
  dataset_licence_source: src-github-dl3dv-license
  dataset_licence_quote: dataset is available under the **DL3DV-10K Term of use** and Creative
    Commons Attribution-NonCommercial 4.0 International License.
  size:
    - count: 140
      unit: benchmark scenes
      subset: DL3DV-140
      source: src-arxiv-2312-16256-v2
      quote: Additionally, we present DL3DV-140, a comprehensive benchmark for NVS, by sampling 140
        scenes from the dataset.
    - count: 55
      unit: evaluation scenes, none of them in DL3DV-10K
      subset: DL3DV-Evaluation (2025)
      source: src-hf-api-dl3dv-evaluation
      quote: This repo contains all 55 scenes for evaluation.
    - count: 10510
      unit: scene videos (51.2 million frames)
      subset: DL3DV-10K, the full dataset
      source: src-arxiv-2312-16256-v2
      quote: featuring 51.2 million frames from 10,510 videos captured from 65 types of
        point-of-interest (POI) locations

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The DL3DV-10K team (a student-led project)
  maintainer_basis:
    reason: The repository and the Hugging Face datasets sit in DL3DV-10K and DL3DV organisation
      accounts, and the licence names a DL3DV-10K organization as the holder. The paper's authors
      are mostly at Purdue University's Department of Computer Science, with others at Adobe,
      Rutgers, Google, Huazhong University of Science and Technology and Wormpex AI Research.
    source: src-dl3dv-project-page
    quote: 'Note: DL3DV-10K is a student-led project and aims to serve the community better.'
  maintainer_type: community-collective
  maintainer_type_note: academic-lab was considered on the Purdue affiliation of most authors, but
    no source states Purdue as the holder; the shared organisation accounts and the "DL3DV-10K
    organization" of the licence send it to community-collective under the holder rule, as VBench's
    was (see review_checks).
  submission_process:
    - literature-only
  submission_process_note: Beyond the release paper's five methods, published again in the README
    and the benchmark dataset, results appear only in other groups' papers.
  submission_process_source: src-hf-api-dl3dv-benchmark
  submission_process_quote: the performances of methods reported in the paper (ZipNeRF, 3DGS,
    MipNeRF-360, nerfacto, Instant-NGP)
  independence_flags: []
  independence_flags_note: 'Not assessed: the paper states no funding, and several of its authors are
    at companies (Adobe, Google and Wormpex AI Research). Whether any author also authored a method the
    paper scores is not shown by the sources read, and with no leaderboard there is no record of the maintainers
    entering their own systems.'
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: null
  reproducibility_tier_note: Left null. The scenes, poses and test frames are downloadable after a
    click-through and the metrics need no human or maintainer step, which is fully-automatable's
    case, but no evaluation code is published, so harness none brings the
    no-reference-implementation blocker, and 02 S11 bars fully-automatable beside it.
  reproducibility_blockers:
    - no-reference-implementation
  reproducibility_blockers_note: The paper ran third-party code for each method (nerfstudio for
    Nerfacto and Instant-NGP, the authors' code for Mip-NeRF 360 and 3D Gaussian Splatting, a public
    reimplementation of Zip-NeRF) and fixed some settings, but released neither its configurations
    nor its metric code; the promised trained weights are still listed as coming.
  harness_availability: none
  harness_availability_note: The repository holds a download script and a preview page only (its
    file tree, GitHub API, read 2026-11-08). The benchmark scenes are packaged in nerfstudio and 3D
    Gaussian Splatting formats, and users take their view indices from other groups' repositories
    (DepthSplat, ReSplat).
  harness_availability_source: src-github-dl3dv-readme
  harness_availability_quote: Benchmark trained weights for 3D Gaussian Splatting, ZipNeRF, Mip-NeRF
    360, Instant NGP, and Nerfacto
  code_licence: null
  code_licence_note: No evaluation code is published. GitHub's licence metadata for
    DL3DV-10K/Dataset reports NOASSERTION ("Other"), read 2026-11-08; not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The (domain-metric, task-specific-supervised-model) pair is not listed in comparability-profiles.yaml, so the
  # profile resolves to fallback (subset_used). Beyond it: which test set and view protocol (the 140 scenes with
  # the paper's 7/8 split at 960 by 560, or a feed-forward protocol of 6 to 24 context views at 224 by 224 with
  # a third party's view index, or the 2025 evaluation split), what a learned model trained on (DL3DV-10K,
  # RealEstate10K or a mixture), and whether the 140 benchmark scenes were removed from its training data.
  material_extra:
    - subset_used
    - training_data_policy
    - decontamination_applied

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper defines the headline numbers as the mean of each metric over the 140 scenes,
    reported side by side.
  source: src-arxiv-2312-16256-v2
  quote: The error metric is calculated from the mean of 140 scenes on a scale factor of 4.

homepage: https://dl3dv-10k.github.io/DL3DV-10K/
repository: https://github.com/DL3DV-10K/Dataset
dataset_url: https://huggingface.co/datasets/DL3DV/DL3DV-Benchmark

versions:
  - version: '140'
    label: DL3DV-140, the release benchmark
    version_kind: edition
    released: 2023-12-26
    items: 140
    changes: The first release, 140 static scenes sampled from DL3DV-10K and balanced over the
      complexity labels, with the paper's results for five per-scene methods.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2312-16256
      - src-arxiv-2312-16256-v2
      - src-hf-api-dl3dv-benchmark
  - version: evaluation
    label: DL3DV-Evaluation, the 2025 testing split
    version_kind: track-set
    released: 2025-09-11
    items: 55
    changes: Adds 55 scenes for evaluation that do not overlap DL3DV-10K, gated on Hugging Face like
      the benchmark. DL3DV-140 is unchanged and stays in use.
    breaking: false
    frozen: true
    sources:
      - src-hf-api-dl3dv-evaluation
      - src-github-dl3dv-readme

tags:
  - novel-view-synthesis
  - nerf
  - 3d-gaussian-splatting
  - feed-forward-3dgs
  - real-world-scenes
  - multi-view-video

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T06)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2312-16256-v2
    - src-arxiv-2312-16256
    - src-dl3dv-project-page
    - src-github-dl3dv-readme
    - src-github-dl3dv-license
    - src-hf-api-dl3dv-benchmark
    - src-hf-api-dl3dv-evaluation
    - src-arxiv-2610-09853-v1
    - src-arxiv-2610-38951-v1
  sources_note: >
    The v2 PDF (the latest version) read as text, with its abstract page; the project page with scripts
    and styles stripped; the README and License.md at main; the public Hugging Face API records of the
    two gated datasets, with no terms accepted and nothing downloaded; and the v1 PDFs of DeltaSplat and
    GradSplat (DOIs, not archived) as evidence of current use. The terms-of-use PDF in the repository
    was not read.
  confidence: medium
  review_checks:
    - check: DL3DV-Evaluation is modelled as a track-set version of this entry, not a benchmark of
        its own, since the same maintainers released it for the same task. It could equally be a
        subset (a parallel test split) or an edition; it does not replace DL3DV-140, which 2026
        papers still use.
      field: versions
      source: src-github-dl3dv-readme
      quote: Scenes in the DL3DV-Evaluation are not covered in the DL3DV-10K dataset
    - check: contamination_risk high rests on the benchmark scenes being sampled from the training
        release that feed-forward users train on. It does not touch the per-scene protocol, and the
        users may remove the scenes (DeltaSplat speaks of a trainset without saying how it was
        split); medium is the alternative if the exclusion is shown to be standard.
      field: data.contamination_risk
      source: src-arxiv-2610-09853-v1
      quote: trainset and evaluate on 140-scene testset.
    - check: The dominant 2026 use (feed-forward, 6 to 24 views, 224 by 224, third-party view
        indices) differs from the designed protocol (per-scene fitting on 7/8 of the frames at 960
        by 560), so numbers labelled "DL3DV" are not comparable across papers; GradSplat even drops
        one scene. Whether the feed-forward protocol deserves its own subset.
      field: as_used
      source: src-arxiv-2610-38951-v1
      quote: The images of one scene have half the size of the others in the benchmark download and
        the conversion script drops it, so every method is evaluated on the same 139 scenes.
    - check: The licence is unclear. License.md says CC BY-NC 4.0 with non-commercial terms and no
        sharing, while the README says the latest licence is open to usage of the dataset; the
        terms-of-use PDF was not read. Which governs, and whether dataset_licence should change.
      field: data.dataset_licence
      source: src-github-dl3dv-readme
      quote: the latest license is open to the usage of the dataset
    - check: maintainer_type community-collective follows the holder rule (shared organisation
        accounts, a DL3DV-10K organization in the licence, no institution named); academic-lab on
        the Purdue affiliation of most authors is the alternative.
      field: governance.maintainer_type
      source: src-github-dl3dv-readme
      quote: The DL3DV organization disclaims any responsibility for the misuse
    - check: PSNR and SSIM are tagged domain-metric, following NTIRE and ScanNet++'s Stage 3 record;
        PSNR is a log transform of mean squared error and could be statistical-fit. LPIPS's backbone
        and version are not named by any source read.
      field: evaluation_method
    - check: Independence is not assessed. The paper states no funding and has authors at Adobe,
        Google and Wormpex AI Research; whether any author also wrote a method it scores (Zip-NeRF,
        Mip-NeRF 360) needs those methods' author lists, which were not read as Sources.
      field: governance.independence_flags
    - check: data.access gated-registration rests on the Hugging Face gate being automatic on
        request. The eleven free sample scenes were not checked against the benchmark list; if any
        official copy of the 140 scenes is ungated, fully-open applies.
      field: data.access
      source: src-hf-api-dl3dv-benchmark
      quote: '"gated":"auto"'
    - check: The paper's pilot pretrains a generalizable NeRF on DL3DV-10K and scores it on other
        datasets (LLFF, the NeRF synthetic scenes), not on DL3DV-140; it is read as a use of the
        dataset, not a second task of the benchmark.
      field: task
      source: src-arxiv-2312-16256-v2
      quote: we pre-train the IBRNet on our DL3DV-10K to obtain a general prior

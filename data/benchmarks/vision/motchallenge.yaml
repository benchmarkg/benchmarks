  sources_note: >
    The six papers' PDFs (DOIs, not archived) read as text, and the four release papers' abstract pages
    for dates and comments; the two TrackEval READMEs at commit 12c8791 (2022-11-29); motchallenge.net's
    robots.txt, the only path of that host that could be fetched, which disallows every path; and two
    2026 papers as evidence of current use. The leaderboards, data pages and licence on motchallenge.net
    were not read, and no archived copy was used.
  confidence: medium
  review_checks:
    - check: activity closed rests on one undated comment in robots.txt ("der Dienst ist
        eingestellt", the service is discontinued), with Disallow for every path. The server was not
        visited, so it is not known whether uploads, downloads or result pages still work, or
        whether the host is still the maintainers'. If the boards still take uploads,
        accepting-submissions applies and the channel-closed history row goes.
      field: activity
      source: src-motchallenge-robots
      quote: motchallenge.net -- der Dienst ist eingestellt.
    - check: lifecycle active, where mature is the alternative. Papers still report MOT17 and MOT20,
        but with the server gone new results can only be on the annotated training sequences, as the
        October 2026 study does.
      field: lifecycle
      source: src-arxiv-2610-19369-v1
      quote: The evaluation was conducted using TrackEval
    - check: Identity. MOT17 is filed as a revision of MOT16 (same sequences, changed labels and
        detections) and MOT20 as a revision of the CVPR 2019 challenge (same scenes, recropped and
        relabelled). Both changed the protocol as well as the labels, so edition could be argued for
        either.
      field: versions
      source: src-arxiv-2010-07548-v2
      quote: MOT17 consists of the same sequences as MOT16, but contains two important changes
    - check: MOTS is filed as a subset although the MOTSChallenge annotations were made by an RWTH
        Aachen group in its own paper; the server hosted it as MOTS20. TAO (CMU and others) and
        3D-ZeF, which the overview says were added to the server, are left out as separately made
        datasets that could be entries of their own.
      field: subsets
      source: src-arxiv-2010-07548-v2
      quote: a benchmark for the large-scale Tracking any Object (TAO) dataset
    - check: domain.primary is vision/video-understanding for want of a tracking leaf (tag-gap
        logged, proposing vision/multi-object-tracking). nuScenes files its tracking task under
        driving-perception-3d; a tracking leaf would settle both.
      field: domain
    - check: dataset_licence is empty. The data pages, which state the licence, could not be read; a
        reviewer with access to an archived copy of motchallenge.net/data should fill it.
      field: data.dataset_licence
    - check: designed_for_subjects adds classical-algorithm on the MOT15 paper's statement that most
        trackers then had no learning algorithm; by 2020 the top entries were learned. A reviewer
        may keep it for the MOT15 record only.
      field: designed_for_subjects
      source: src-arxiv-1504-01942-v1
      quote: Most of the available tracking approaches do not include a learning (or training)
        algorithm to determine the set of model parameters for a particular dataset.
    - check: maintainer-competes-on-own-benchmark rests on the overview's MOT16 table, where
        MPNTrack, co-authored by the overview's senior author, ranks first. The boards themselves
        were not read.
      field: governance.independence_flags
      source: src-arxiv-2010-07548-v2
      quote: Method MPNTrack [Bras´o and Leal-Taix´e, 2020]
    - check: Which metric ranks the boards is not settled by the sources. The HOTA paper (2020) says
        MOTChallenge ranked by MOTA with IDF1 as a secondary metric; TrackEval computes HOTA by
        default and calls it the recommended metric, and 2026 papers lead with HOTA. Whether the
        server's default sort changed was not read.
      field: evaluation_method
      source: src-arxiv-2009-07736-v2
      quote: Both of these have ranked trackers using the MOTA metric
    - check: The maintainer's description joins TUM's group (MOT20 and the overview) with the ETH
        Zurich and Adelaide authors of MOT15 and MOT16; whether maintainership passed from ETH and
        Adelaide to TUM, which a maintainer-changed history row would record, is not stated in the
        sources.
      field: governance.maintainer

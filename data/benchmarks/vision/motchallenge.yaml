# data/benchmarks/vision/motchallenge.yaml
#
# P1-S8-T06, vision entry 15. Filled from the MOTChallenge overview paper, arXiv 2010.07548 read as its v2 PDF
# (2020-12-08, accepted at IJCV), with its abstract page; the release papers of MOT15 (arXiv 1504.01942, v1 PDF),
# MOT16 and MOT17 (arXiv 1603.00831, v2 PDF) and MOT20 (arXiv 2003.09003, v1 PDF), each with its abstract page;
# the HOTA paper (arXiv 2009.07736, v2 PDF); the MOTS paper (arXiv 1902.03604, v2 PDF), read for the MOTS track;
# the TrackEval README and its MOTChallenge Official Readme, pinned to commit 12c8791; motchallenge.net's
# robots.txt; and two 2026 papers that report on MOT17 and MOT20 (FC-Track, arXiv 2603.12758 v1; a detector and
# density study, arXiv 2610.19369 v1). Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# motchallenge.net was not read beyond its robots.txt, which disallows every path and says the service has been
# discontinued. Its benchmark, data and results pages, the data licence they carry and the leaderboards are
# therefore not Sources; what the entry says about the server rests on the papers.
#
# The entry is MOTChallenge as one family (04 S4): MOT15, MOT16, the CVPR 2019 challenge and MOT20 are editions;
# MOT17 is a revision of MOT16 (the same sequences, corrected labels, new detections) and MOT20 one of the CVPR
# 2019 challenge. 3D MOT 2015, MOT17Det and MOTS are subsets. TAO and 3D-ZeF, separately made datasets that the
# server also hosted, are not included (see review_checks).

id: motchallenge
name: MOTChallenge
aliases:
  - MOT Challenge
  - MOT15
  - 2D MOT 2015
  - MOT16
  - MOT17
  - MOT20
tagline: Multiple pedestrian tracking in video, MOT15 to MOT20, scored by MOTA, IDF1 and HOTA
  against hidden test annotations.
description: >
  A benchmark for single-camera multiple object tracking, launched in late 2014 and focused on pedestrians.
  Each release is a set of video sequences, half for training with annotations and half for testing with
  annotations withheld, together with public detections. MOT15 collected 22 sequences, many from existing
  datasets. MOT16 brought 14 new sequences annotated from scratch under one protocol, and MOT17 kept those
  sequences with improved annotations and three sets of public detections, averaging every tracker's score
  over the three. MOT20, first run as a CVPR 2019 workshop challenge, has 8 sequences of very crowded
  scenes, up to 246 pedestrians per frame. Trackers output a box and an identity per pedestrian per frame,
  scored by the CLEAR-MOT measures (MOTA first), IDF1 and HOTA (2020), all computed by TrackEval, the
  official evaluation code. Entrants uploaded test results to the maintainers' server, at most four times
  per tracker and challenge with 72 hours between uploads, and declared whether they used the public detections
  and extra training data. Detection (MOT17Det), segmentation (MOTS) and 3D tracks ran beside the tracking
  boards. In 2026 the site's robots.txt says the service has been discontinued, while papers still report
  MOT17 and MOT20 results.
self_description:
  source: src-arxiv-2010-07548-v2
  quote: We present MOTChallenge, a benchmark for singlecamera Multiple Object Tracking (MOT)
    launched in late 2014, to collect existing and new data and create a framework for the
    standardized evaluation of multiple object tracking methods.
external_ids:
  arxiv: '2010.07548'
paper:
  title: 'MOTChallenge: A Benchmark for Single-Camera Multiple Target Tracking'
  arxiv: '2010.07548'
  version_read: v2
  source: src-arxiv-2010-07548-v2
paper_note: The overview of the first three releases, accepted at IJCV (its abstract page, "Accepted
  at IJCV"). The 2026 density study cites it as International Journal of Computer Vision 129(4),
  2021. Its journal DOI was not in any Source read, so paper.doi is empty.
released: 2015-04-08
released_note: The first arXiv version of the MOT15 paper, as its abstract page dates it. The
  overview says the benchmark was launched in late 2014 and has been in use since October 2014.
released_source: src-arxiv-1504-01942
released_quote: Submitted on 8 Apr 2015

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/video-understanding
  secondary:
    - vision/detection
    - vision/segmentation
domain_basis:
  reason: Every tracking board scores tracks recovered from a video, boxes linked by identity across
    frames, against the hidden ground-truth tracks; no language is consumed or scored, so 02 S11
    rule 12 puts it in vision. No vision leaf names tracking (logged with bench tag-gap).
    video-understanding, content recognised across a video's temporal extent, is the nearest.
    Per-frame detection is half of every tracking score and the whole of MOT17Det (detection), and
    MOTS scores masks (segmentation).
  source: src-arxiv-2009-07736-v2
  quote: Multi-Object Tracking (MOT) is the task of detecting the presence of multiple objects in
    video, and associating these detections over time according to object identities.
domain_considered_and_rejected:
  - term: multimodal/video-language
    reason: Nothing is posed in language; the output is boxes with identities, scored against
      annotated boxes.
  - term: vision/driving-perception-3d
    reason: A few MOT15 sequences come from a car (KITTI), but the scenes are mostly pedestrian
      streets and indoor spaces filmed by static or handheld cameras, scored on 2D image boxes; 3D
      MOT 2015 scores positions on the ground plane, not a vehicle's 3D road scene.
capability:
  - perception
capability_basis:
  perception:
    reason: Every board scores what was recovered from the video, pedestrians' boxes and identities
      per frame (masks for MOTS, detections for MOT17Det), against annotations.
    source: src-arxiv-2010-07548-v2
    quote: MOTA summarizes three sources of errors with a single performance measure
capability_considered_and_rejected:
  - term: temporal-reasoning
    reason: Identities must be kept across frames and through occlusions, but the score is recovered
      identity and position, not an inference about order or duration (as for nuScenes tracking).
  - term: distribution-shift-generalization
    reason: MOT20's test set holds one scene absent from training, to test generalisation, but the
      other test sequences come from training scenes and no shifted condition is scored on its own.
    source: src-arxiv-2003-09003-v1
    quote: The testing data consists of sequences from known as well as from an unknown scenes in
      order to measure the genralization capabilities of both detectors and trackers.

evaluation_method:
  - domain-metric
evaluation_method_note: >
  MOTA (1 minus false negatives, false positives and identity switches over ground-truth objects), MOTP,
  IDF1 and HOTA (with its DetA, AssA and LocA sub-scores) are tracking measures defined within the field,
  computed per release by TrackEval. MOT17 averages each measure over its three public detection sets,
  an average of one metric over conditions, not a composite. MOT17Det reports detection AP and MOTS sMOTSA,
  both domain metrics too.
evaluation_method_basis:
  reason: The boards report the CLEAR-MOT measures, led by MOTA, with IDF1 beside them; HOTA (2020)
    is computed by TrackEval, now the official kit. All are standardised tracking measures with no
    meaning outside the field.
  source: src-arxiv-2010-07548-v2
  quote: In Sec. 7 we report IDF1 performance in conjunction with MOTA.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: HOTA is the geometric mean of a detection and an association score, but both are parts
      of one metric's definition, and MOTA sums error counts in one formula. No ranking combines
      separately named metrics.
    source: src-arxiv-2009-07736-v2
    quote: we present a novel MOT evaluation metric, HOTA (Higher Order Tracking Accuracy)
  - term: classification-metric
    reason: IDF1 is an F1 over identity matches, but its matching of predicted to ground-truth
      trajectories is specific to tracking.
designed_for_subjects:
  - task-specific-supervised-model
  - classical-algorithm
designed_for_subjects_note: The classical-algorithm reading rests on the MOT15 paper ("Most of the
  available tracking approaches do not include a learning (or training) algorithm to determine the
  set of model parameters for a particular dataset", src-arxiv-1504-01942-v1).
designed_for_subjects_basis:
  reason: The entrants are trackers trained on the released training sequences, mostly
    tracking-by-detection systems with learned regressors and re-identification models by 2020. The
    MOT15 baselines and many early entrants were non-learned trackers (network flow, linear
    programming, energy minimisation) run on the public detections, which classical-algorithm takes
    when the entrant contains no learned component.
  source: src-arxiv-2010-07548-v2
  quote: 'The main common components of top-performing methods are: (i) learned single-target regressors'
as_used:
  - protocol: Local evaluation with TrackEval, HOTA first, on three sequences each of MOT17 and
      MOT20 whose annotations are public, instead of the hidden test set.
    split: train
    source: src-arxiv-2610-19369-v1
    quote: 'Three sequences were evaluated from each benchmark: 02, 04, and 05 from MOT17; 02, 03, and
      05 from MOT20'
    note: An October 2026 study of detectors and trackers on MOT17, MOT20 and SOMPT22 ("The
      evaluation was conducted using TrackEval", same Source). MOT20-02, -03 and -05 are training
      sequences in the MOT20 paper's table, and MOT17-02, -04 and -05 in the MOT16 paper's; the
      study itself does not name the split.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on MOT17 and MOT20. A March 2026 paper reports new test-set
    scores on both, and an October 2026 study evaluates on their annotated sequences with TrackEval.
    The server's discontinuation is recorded in activity (ADR-0019).
  source: src-arxiv-2603-12758-v1
  quote: We achieve 81.73 MOTA, 82.81 IDF1, and 66.95 HOTA on the MOT17 test set
activity: closed
activity_note: Only robots.txt was read, as it disallows every other path; its comment is undated
  (the server sent Last-Modified 2026-09-02). The March 2026 FC-Track paper obtained a baseline's
  numbers by "submitting the outputs to the MOT benchmark server" (src-arxiv-2603-12758-v1), so the
  server was taking uploads in early 2026. Whether the data downloads and the result pages are still
  served was not checked.
activity_basis:
  reason: The maintainers' evaluation server was the route for test results, with its main
    challenges always open for submission. The host's robots.txt now says, in German, that the
    service has been discontinued and that nothing on the host should be indexed.
  source: src-motchallenge-robots
  quote: motchallenge.net -- der Dienst ist eingestellt.
events:
  - name: WACV 2015 Challenge, 1st Workshop on Benchmarking Multi-Target Tracking (BMTT), WACV 2015
    kind: workshop-challenge-on-the-benchmark
    source: src-arxiv-2010-07548-v2
    quote: we organized the 1st Workshop on Benchmarking Multi-Target Tracking (BMTT) in conjunction
      with the IEEE Winter Conference on Applications of Computer Vision (WACV) in 2015.
  - name: Second BMTT workshop, ECCV 2016, on the MOT16 sequences
    kind: workshop-challenge-on-the-benchmark
    source: src-arxiv-2010-07548-v2
    quote: we organized the second workshop4 in conjunction with the European Conference in Computer
      Vision (ECCV) in 2016
  - name: Joint Workshop on Tracking and Surveillance with PETS, CVPR 2017, presenting MOT17
    kind: workshop-challenge-on-the-benchmark
    source: src-arxiv-2010-07548-v2
    quote: Joint Workshop on Tracking and Surveillance in conjunction with the Performance
      Evaluation of Tracking and Surveillance (PETS)
  - name: 4th MOTChallenge workshop, CVPR 2019, the tracking challenge whose sequences became MOT20
    kind: workshop-challenge-on-the-benchmark
    source: src-arxiv-2010-07548-v2
    quote: presented at the 4th MOTChallenge workshop6 (CVPR 2019), an ambitious tracking challenge
      with eight new sequences

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Tracktor++v2, on the overview's MOT16 leaderboard table
    source: src-arxiv-2010-07548-v2
    observed_on: 2026-11-08
    quote: learning to regress tracking targets
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Boxes with identities, visibility and class for every pedestrian (and,
  from MOT16, for vehicles, static people and occluders) in the test sequences, annotated by the
  maintainers and held on their server.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: Test scores came only from the maintainers' server, which held the test annotations;
    anyone can score the training sequences locally with TrackEval. With the service discontinued,
    no route to a new test score is known.
  source: src-arxiv-2010-07548-v2
  quote: Ground truth is only provided for the training sequences.

task:
  exists: true
  input:
    - a video sequence of pedestrians, as numbered JPEG frames, from a static or moving camera
    - under the public-detection protocol, the provided per-frame pedestrian detections (DPM for
      MOT16; DPM, Faster R-CNN and SDP for MOT17; Faster R-CNN for MOT20)
  output: A CSV file per sequence with one line per tracked object per frame (frame, track identity,
    box and confidence; 3D position for 3D MOT 2015), or masks with identities for MOTS.
  scoring: MOTA, MOTP, IDF1 and HOTA with their components against the hidden test annotations,
    computed by the server (TrackEval since 2020); MOT17's score is the average over its three
    detection sets.
  source: src-arxiv-2010-07548-v2
  quote: Each line represents one object instance, and it contains 10 values

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: Training and test videos and public detections were downloadable from
    motchallenge.net, with annotations for the training sequences only. Whether the downloads
    survive the service's discontinuation was not checked; TrackEval's example data bundle, hosted
    at RWTH Aachen, carries ground truth for its supported benchmarks.
  access_basis:
    reason: The test sequences' videos are released and their annotations are not, so test scores
      come only from the maintainers' server.
    source: src-arxiv-1603-00831-v2
    quote: The annotations of the testing sequences will not be released in order to avoid (over)
  refresh: versioned-releases
  refresh_basis:
    reason: The content changed in named releases, MOT15, MOT16, MOT17 and MOT20, each with its own
      sequences or labels and its own board; the earlier boards stayed open beside the later ones.
    source: src-arxiv-2010-07548-v2
    quote: The main challenges, 2D MOT 2015, 3D MOT 2015, MOT16, and MOT17 are always open for
      submission
  data_provenance:
    - real-world-instrument
    - inherited-from-constituents
    - expert-authored
  data_provenance_note: The sequences are real videos of pedestrians (real-world-instrument). MOT15
    re-collected sequences of existing datasets, such as PETS and KITTI, with their annotations
    (inherited-from-constituents). From MOT16 the maintainers annotated every sequence themselves
    under one protocol; the MOT16 paper says the annotators were qualified researchers
    (expert-authored).
  data_provenance_source: src-arxiv-2010-07548-v2
  data_provenance_quote: a (re-)collection of publicly available and new datasets
  contamination_risk: medium
  contamination_risk_note: The test annotations are withheld, the policy forbids using them, uploads
    are capped and spaced, and the overview counts the size of the test data as a guard against
    over-tuning. But MOT15's test sequences include well-known public sequences whose ground truth
    was collected from online sources, the test videos of every release are public, and a detector
    pretrained on web-scale data can see them. No source assesses it.
  contamination_risk_source: src-arxiv-2010-07548-v2
  contamination_risk_quote: some of the sequences were well-known (e.g., PETS09S2L1)
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: MOTA tops out at 100 and has no lower bound; HOTA and IDF1 top out at 1.
    No source reports a human or measured ceiling.
  ceiling_anchor_type_source: src-arxiv-2010-07548-v2
  ceiling_anchor_type_quote: We report the percentage MOTA (−∞, 100] in our benchmark.
  dataset_licence_note: Left empty. None of the papers or TrackEval files read states a licence for
    the sequences or annotations, and the data pages of motchallenge.net could not be read
    (robots.txt disallows every path). MOT15's re-collected sequences carry their source datasets'
    terms, which were not read.
  size:
    - count: 14
      unit: video sequences, 7 for training and 7 for testing
      subset: MOT16 and MOT17 (the same sequences)
      source: src-arxiv-1603-00831-v2
      quote: We have compiled a total of 14 sequences, of which we use half for training and half
        for testing.
    - count: 8
      unit: video sequences of three crowded scenes, 4 for training and 4 for testing
      subset: MOT20
      source: src-arxiv-2003-09003-v1
      quote: We have compiled a total of 8 sequences, of which we use half for training and half for
        testing.
    - count: 22
      unit: video sequences, 11 for training and 11 for testing (11,286 frames, 996 seconds)
      subset: MOT15
      source: src-arxiv-1504-01942-v1
      quote: a total of 22 sequences, half for training and half for testing, with a total of 11286
        frames or 996 seconds of video
    - count: 61440
      unit: annotated boxes in the test sequences
      subset: MOT15
      source: src-arxiv-1504-01942-v1
      quote: the test data contains over 10 minutes of footage and 61440 annotated bounding boxes
    - count: 44
      unit: sequences across five challenges, with 2.7 million boxes over 36,000 seconds
      subset: all releases to 2020
      source: src-arxiv-2003-09003-v1
      quote: spanning 44 sequences with 2.7M bounding boxes over a total length of 36k seconds
  submission_limit:
    max_submissions: 4
    period_days: 0
    per: tracker and challenge, over its lifetime, with 72 hours between uploads and one new tracker
      per user every 30 days
    source: src-arxiv-2010-07548-v2

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The MOTChallenge team, based in the Dynamic Vision and Learning Group at the Technical
    University of Munich, with co-authors at ETH Zurich, the University of Adelaide and TU Darmstadt
  maintainer_basis:
    reason: The MOT20 paper places its lead authors in TUM's Dynamic Vision and Learning Group, and
      the overview lists TUM, ETH Zurich, Adelaide and Darmstadt among its authors' institutions.
      MOT15 and MOT16 were written from ETH Zurich and Adelaide. The evaluation code moved to
      TrackEval, a repository at RWTH Aachen.
    source: src-arxiv-2003-09003-v1
    quote: are with the Dynamic Vision and Learning Group at TUM Munich, Germany
  maintainer_type: academic-lab
  maintainer_type_note: conference-workshop was considered. Special challenges ran at BMTT workshops
    (WACV 2015, ECCV 2016, CVPR 2017, CVPR 2019), but the benchmark is a standing server and data
    set held by the same university group, which also organised the workshops.
  submission_process:
    - held-out-server
  submission_process_note: Entrants registered with an institutional address, created a tracker,
    declared whether it ran online or in batch, whether its code was public, and whether it used the
    public detections and extra training data, then uploaded results per challenge; the server
    scored them and the entrant chose when to make them public. Anonymous entries for blind review
    were allowed, hidden after six months without a reference. Workshop special challenges also
    asked for a paper at the workshop, so publication-gated is not tagged for the standing boards.
  submission_process_source: src-arxiv-2010-07548-v2
  submission_process_quote: Our benchmark consists of the database and evaluation server on one
    hand, and the website as the user interface on the other.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2010-07548-v2
      quote: Ground truth is only provided for the training sequences.
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2010-07548-v2
      quote: Method MPNTrack [Bras´o and Leal-Taix´e, 2020]
  independence_flags_note: The overview's MOT16 leaderboard table is headed by MPNTrack, co-authored
    by the benchmark's senior author, who is also an author of the overview. The maintainers hold
    the test annotations and their server scores every entry. No funding statement was read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline scores are test-set scores, which only the maintainers' server could
      compute, because it held the test annotations. Training-sequence scores can be reproduced with
      TrackEval by anyone.
    source: src-arxiv-2010-07548-v2
    quote: The use of ground truth labels on the test data is strictly forbidden.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: TrackEval (scripts/run_mot_challenge.py, HOTA, CLEAR and Identity metrics by default),
    which replaced the MOTChallengeEvalKit
  harness_source: src-github-trackeval-motchallenge-readme
  harness_quote: TrackEval is now the Official Evaluation Kit for MOTChallenge.
  submission_channel:
    source: src-arxiv-2010-07548-v2
    quote: Our benchmark consists of the database and evaluation server on one hand, and the website
      as the user interface on the other.
  submission_channel_note: The evaluation server on motchallenge.net, reached through a registered
    account. Its host now says the service is discontinued (see activity and history).
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for JonathonLuiten/TrackEval reports MIT (API, read
    2026-11-08); the READMEs state no licence. The licence file itself was not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which release and split (MOT17's test set, or the training half that papers
  # split into train and validation halves), whether the tracker used the public detections or its own (the
  # boards display it, and private-detection results are not comparable with public ones), and what extra
  # training data was used (allowed if declared).
  material_extra:
    - subset_used
    - eligibility_track
    - training_data_policy
aggregation_policy: none-by-design
aggregation_policy_note: Each release and track is ranked on its own board; no score spans them.
  Within MOT17 the three detection sets are averaged into one score per tracker.
aggregation_policy_basis:
  reason: The overview states MOT17's averaging; nothing combines MOT15, MOT16, MOT17 and MOT20.
  source: src-arxiv-2010-07548-v2
  quote: set to evaluate the output of trackers on all three detection sets, averaging their
    performance for the
secondary_axes:
  - throughput
secondary_axes_basis:
  reason: Each submission states its runtime and hardware, which the boards show as frames per
    second; the overview compares trackers against real time at 25 Hz.
  source: src-arxiv-2010-07548-v2
  quote: the total runtime in seconds for computing the results for the test sequences and the
    hardware used

homepage: https://motchallenge.net/
repository: https://github.com/JonathonLuiten/TrackEval
leaderboard_url: https://motchallenge.net/results/MOT17/

versions:
  - version: mot15
    label: MOT15 (2D MOT 2015)
    version_kind: edition
    released: 2015-04-08
    changes: The first release, 22 sequences re-collected from existing datasets with new ones, 11
      for training and 11 for testing, with ACF public detections; a 3D track on four sequences
      beside the 2D one. Released to users in October 2014; the paper's first arXiv version is dated
      here.
    breaking: true
    superseded_by: mot16
    frozen: true
    sources:
      - src-arxiv-1504-01942
      - src-arxiv-1504-01942-v1
  - version: mot16
    label: MOT16
    version_kind: edition
    released: 2016-03-02
    changes: Fourteen new sequences, more crowded, annotated from scratch under one protocol, with
      vehicles, static people and occluders labelled and a visibility per box; DPM public
      detections.
    breaking: true
    supersedes_version: mot15
    superseded_by: mot17
    frozen: true
    sources:
      - src-arxiv-1603-00831
      - src-arxiv-1603-00831-v2
  - version: mot17
    label: MOT17
    version_kind: revision
    changes: The MOT16 sequences with further improved annotations (more accurate boxes, missed
      pedestrians added, more occluders), three public detection sets (DPM, Faster R-CNN and SDP) on
      which every tracker is run and averaged, and the MOT17Det detection track. Presented at the
      CVPR 2017 workshop; no source read dates the release.
    breaking: true
    supersedes_version: mot16
    frozen: true
    sources:
      - src-arxiv-2010-07548-v2
  - version: cvpr19
    label: CVPR 2019 tracking challenge
    version_kind: edition
    changes: Eight new sequences of very crowded scenes, run as the 4th MOTChallenge workshop's
      challenge at CVPR 2019.
    breaking: true
    superseded_by: mot20
    frozen: true
    sources:
      - src-arxiv-2010-07548-v2
      - src-arxiv-2003-09003
  - version: mot20
    label: MOT20
    version_kind: revision
    released: 2020-03-19
    changes: The CVPR 2019 sequences revised after the workshop, with new and corrected annotations,
      some sequences cropped and transformed, new baselines and a new public detection set from a
      Faster R-CNN trained on MOT20's training sequences; up to 246 pedestrians per frame, and one
      test scene unseen in training.
    breaking: true
    supersedes_version: cvpr19
    frozen: true
    sources:
      - src-arxiv-2003-09003
      - src-arxiv-2003-09003-v1
versions_note: MOT17 and MOT20 are the releases in current use and are run beside each other; MOT20
  does not supersede MOT17. Only MOT15 and MOT16 have release papers of their own besides MOT20;
  MOT17's facts are from the overview.

subsets:
  - id: motchallenge#mot15-3d
    label: 3D MOT 2015
    evidence:
      - source: src-arxiv-1504-01942-v1
        quote: Besides the main benchmarks (2D MOT 2015, 3D MOT 2015)
      - source: src-arxiv-1504-01942-v1
        quote: The last three numbers indicate the 3D position in real-world coordinates of the
          pedestrian.
    notes: Tracking in world coordinates on the MOT15 sequences with 3D information (four in the
      overview's count), scored on positions rather than image boxes.
  - id: motchallenge#mot17det
    label: MOT17Det
    domain_override:
      primary: vision/detection
    evidence:
      - source: src-arxiv-2010-07548-v2
        quote: Besides, we released a separate subset for evaluating object detectors, MOT17Det.
    notes: Pedestrian detection on the MOT17 frames, scored on visible pedestrians only, with AP.
      The overview names it; its board was not read.
  - id: motchallenge#mots20
    label: MOTS (Multi-Object Tracking and Segmentation)
    domain_override:
      primary: vision/video-understanding
      secondary:
        - vision/segmentation
    evidence:
      - source: src-arxiv-1902-03604-v2
        quote: We further annotated 4 of 7 sequences of the MOTChallenge 2017 [38] training dataset4
          and obtained the MOTSChallenge dataset.
      - source: src-arxiv-1902-03604-v2
        quote: sMOTSA therefore measures segmentation as well as detection and tracking quality.
    notes: Pixel masks with identities on MOT17 sequences, scored by sMOTSA, from an RWTH Aachen
      paper (CVPR 2019). The paper annotates four MOT17 training sequences; the MOTS20 board's test
      sequences were not read.

subsets_note: >
  The subsets are tracks that the sources show beside the tracking boards: 3D MOT 2015, MOT17Det and MOTS.
  The versions carry the 2D tracking boards themselves. Other boards on the server, among them the Head
  Tracking Challenge that TrackEval lists, TAO and 3D-ZeF, are not recorded.


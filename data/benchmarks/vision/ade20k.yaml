# data/benchmarks/vision/ade20k.yaml
#
# P1-S8-T07, vision entry 16. Filled from the two papers that define the benchmark: the IJCV extension (arXiv
# 1608.05442, read as its v2 PDF and its abstract page, with Crossref's record of the IJCV DOI) and the CVPR 2017
# paper (read as its CVF open-access PDF, with Crossref's record of its IEEE DOI for the venue); four pages of
# MIT CSAIL's sites: the ADE20K home page and its terms of use (ade20k.csail.mit.edu, which
# groups.csail.mit.edu/vision/datasets/ADE20K/ now serves), the MIT Scene Parsing Benchmark page and the 2016
# challenge page (sceneparsing.csail.mit.edu; both withheld from archiving because they list the organisers by
# name), and the benchmark's evaluation-server page, which the server returns as unexecuted PHP source; the
# READMEs of CSAILVision/sceneparsing (the development kit) and CSAILVision/ADE20K (the 2021 re-release), each at
# a pinned commit; the v2 PDF of MaskFormer (arXiv 2107.06278, the source of ADE20K-Full and of ADE20K test-set
# use in 2021); and two abstract pages as evidence of current use, SAGE (arXiv 2610.36719, October 2026) and
# ERR-Seg (arXiv 2501.17642, 2025). The full dataset's download needs registration and approval, which was not
# sought; no dataset image or annotation file was fetched. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.
#
# The entry is the ADE20K family as MIT CSAIL publishes it: the SceneParse150 scene parsing benchmark and the
# InstSeg100 instance segmentation benchmark are subsets of one release with one maintainer and one site, the
# 2016 and 2017 challenges are events on the same data, the 2017 instance track is a track-set version and the
# 2021 re-release of the full dataset is a revision. ADE20K-Full (847 classes) and ADE20K-Panoptic are other
# groups' derivatives, recorded in lineage_note without ids.

id: ade20k
name: ADE20K
aliases:
  - MIT Scene Parsing Benchmark
  - SceneParse150
  - ADE20K-150
  - ADEChallengeData2016
tagline: Scene parsing of everyday photographs into 150 stuff and object classes, scored by mean IoU
  and pixel accuracy.
description: >
  A densely annotated dataset of about 25,000 photographs of everyday scenes from MIT CSAIL, covering
  the scene categories of the SUN database, in which a single expert annotator labelled every object and
  stuff region, object parts and parts of parts, with an open vocabulary of thousands of classes. From
  it the maintainers built the MIT Scene Parsing Benchmark (SceneParse150): the 150 classes with the largest
  pixel share (35 stuff and 115 object classes), 20,210 training and 2,000 validation images with public
  masks, and a held-out test set scored by an evaluation server on the mean of pixel accuracy and mean
  IoU. It ran as the Scene Parsing Challenge with ILSVRC 2016 and again in the Places Challenge 2017,
  which added an instance segmentation benchmark on 100 object classes (InstSeg100) scored by COCO-style
  mask AP. The full dataset was re-released in 2021 with 25,574 training images, 3,688 categories and
  blurred faces and licence plates. In practice papers report single- or multi-scale mean IoU on the 2,000
  validation images, and the evaluation server no longer runs.
self_description:
  source: src-arxiv-1608-05442-v2
  quote: In this work, we present a densely annotated dataset ADE20K, which spans diverse
    annotations of scenes, objects, parts of objects, and in some cases even parts of parts.
external_ids:
  arxiv: '1608.05442'
paper:
  title: Semantic Understanding of Scenes through the ADE20K Dataset
  arxiv: '1608.05442'
  doi: 10.1007/s11263-018-1140-0
  version_read: v2
  source: src-arxiv-1608-05442-v2
released: 2016-06-22
released_note: The 2016 challenge page dates the release of the scene parsing development kit, data
  and evaluation software. The IJCV paper's first arXiv version followed on 2016-08-18 and the CVPR
  paper appeared in July 2017.
released_source: src-sceneparsing-csail-challenge
released_quote: 'June 22, 2016: Development kit, data, and evaluation software made available.'
release_venue: CVPR 2017
release_venue_note: The benchmark was first run at the ILSVRC 2016 challenge, before either paper
  was published; CVPR 2017 is the first paper's venue and IJCV 127(3) the extension's
  (src-crossref-10-1007-s11263-018-1140-0).
release_venue_source: src-crossref-10-1109-cvpr-2017-544
release_venue_quote: '"event":{"name":"2017 IEEE Conference on Computer Vision and Pattern Recognition
  (CVPR)","location":"Honolulu, HI","start":{"date-parts":[[2017,7,21]]}'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/segmentation
  secondary:
    - vision/detection
domain_basis:
  reason: The headline benchmark assigns one of 150 classes to every pixel of a photograph and
    scores the labelling against the annotator's masks, which is the segmentation leaf's definition.
    The InstSeg100 benchmark detects and masks individual object instances and is scored by
    COCO-style AP, which is the detection leaf, secondary (and the subset's primary). Nothing is
    scored against language, so the multimodal boundary (02 S11 rule 12) is not in question for the
    benchmark the maintainers run.
  source: src-arxiv-1608-05442-v2
  quote: Scene parsing is to segment the whole image densely into semantic classes, where each pixel
    is assigned a class label such as the region of tree and the region of building.
domain_considered_and_rejected:
  - term: multimodal/visual-grounding
    reason: Open-vocabulary segmentation papers score ADE20K-847 and ADE20K-150 by naming the
      classes in text to a vision-language model, but that is how another group's derivative is used
      (see lineage_note); the maintainers' benchmark fixes the 150 class indices and scores masks
      only.
    source: src-arxiv-2501-17642
    quote: on the ADE20K-847 benchmark
  - term: vision/image-generation
    reason: The papers synthesise scenes from label masks and remove objects by inpainting, but only
      as applications of trained parsers; no generated image is scored.
    source: src-cvf-ade20k-cvpr2017-pdf
    quote: We further show that the trained scene parsing networks can lead to applications such as
      image content removal and scene synthesis
capability:
  - perception
capability_basis:
  perception:
    reason: Both benchmarks score what was recovered from a photograph -- a class for every pixel,
      or each object instance's mask and class -- against the reference annotation.
    source: src-sceneparsing-csail-home
    quote: For each image, segmentation algorithms will produce a semantic segmentation mask,
      predicting the semantic category for each pixel in the image.
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Regions are scored by pixel overlap, a perceptual output; no task asks about spatial
      relations between objects. The paper's error analysis mentions cases that need high-level
      context, but nothing scores that separately.
  - term: distribution-shift-generalization
    reason: The paper shows parsers trained on ADE20K applied to other scenes, but the benchmark
      scores held-out images of the same distribution as its training split.

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: Mean IoU over the 150 classes is named in domain-metric's own test, and the paper lists
    pixel accuracy beside it among the metrics commonly used for semantic segmentation; the instance
    benchmark uses COCO's mask AP. The challenge's final score averages pixel accuracy and mean IoU,
    two measures of one per-pixel labelling against one key, so it is not composite (see
    review_checks).
  source: src-arxiv-1608-05442-v2
  quote: Mean IoU indicates the intersection-over-union between the predicted and ground-truth
    pixels, averaged over all the classes.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The final score is the mean of pixel accuracy and mean IoU, but both are computed from
      the same per-pixel predictions against the same masks, which composite's exclusion keeps out
      as one method; papers now report mean IoU alone.
    source: src-github-csailvision-sceneparsing-readme
    quote: Final score = (Pixel-wise Accuracy + mean(Intersection over Union)) / 2
  - term: classification-metric
    reason: Pixel accuracy is the share of labelled pixels classified correctly, but it is reported
      beside mean IoU as a segmentation measure, and classification-metric's exclusion sends IoU and
      mAP to domain-metric.
    source: src-arxiv-1608-05442-v2
    quote: Pixel accuracy indicates the proportion of correctly
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The benchmark releases training masks for its 150 classes, and its baselines and challenge
    entrants are segmentation networks trained on them; the 2016 challenge allowed only ImageNet and
    Places365 pre-training beside the provided data.
  source: src-sceneparsing-csail-challenge
  quote: you can use pre-trained models trained on the standard 1.2M imagenet data and the Places365
    data
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: Open-vocabulary segmenters built on vision-language models report on ADE20K's
      derivatives, but the maintainers' benchmark is built for networks trained on its own masks.
as_used:
  - protocol: Semantic segmentation reported as mean IoU on the 2,000 public validation images, with
      single-scale and multi-scale inference listed separately; no server is involved and the score
      is computed by the authors.
    split: validation (ADEChallengeData2016)
    source: src-arxiv-2107-06278-v2
    quote: We report both single-scale (s.s.) and multi-scale (m.s.) inference results
    note: MaskFormer (arXiv 2107.06278, 2021) and later papers. The SAGE abstract (October 2026)
      reports an ADE20K mean IoU without naming the split.
  - protocol: Test-set results from the evaluation server, for a model trained on the union of the
      training and validation images with multi-scale inference, ranked on pixel accuracy, mean IoU
      and their average.
    split: test
    source: src-arxiv-2107-06278-v2
    quote: we train MaskFormer on the union of ADE20K train and val set with ImageNet-22K
      pre-trained checkpoint and use multi-scale inference
    note: The last test-set use found in the sources read (2021); the server no longer runs
      (history).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. An October 2026 paper reports ADE20K
    mean IoU for semantic segmentation and mask AP for instance segmentation, and a 2025 paper
    reports on the 847-class derivative.
  source: src-arxiv-2610-36719
  quote: ADE20K (60.3 mIoU for semantic segmentation and 44.9 mask AP for instance segmentation)
activity: closed
activity_note: The benchmark page still links the server and the instance-segmentation page; the
  leaderboard is an iframe on the same server, which was not read. No maintainer statement about the
  server was found. Results continue on the public validation split, outside any channel.
activity_basis:
  reason: The evaluation server's page, read on 2026-11-10, returns its own PHP source unexecuted, a
    UserCake 2.0.2 login script last modified in January 2017, so the route for test-set submissions
    that the benchmark page describes no longer works; MaskFormer reported test-set results in 2021.
  source: src-sceneparsing-csail-eval
  quote: 'UserCake Version: 2.0.2 http://usercake.com'
events:
  - name: Scene Parsing Challenge 2016, held jointly with ILSVRC 2016, with winners presenting at
      the ImageNet and COCO joint workshop at ECCV 2016 (75 submissions from 22 teams)
    kind: challenge
    source: src-sceneparsing-csail-challenge
    quote: This scene parsing challenge is held jointly with ILSVRC'16.
  - name: Places Challenge 2017, held jointly with the COCO Challenge at ICCV 2017, with the scene
      parsing track (27 submissions from 11 teams) and the new instance segmentation track (12
      submissions from 5 teams)
    kind: challenge
    source: src-sceneparsing-csail-home
    quote: The data in the benchmark has been used in the Scene Parsing Challenge 2016 held jointly
      with ILSVRC'16, and Places Challenge 2017 held jointly with COCO Challenge.
  - name: Robust Vision Challenge, another group's multi-dataset challenge that includes ADE20K
      among its semantic and instance segmentation datasets (editions not read)
    kind: challenge
    source: src-github-csailvision-ade20k-readme
    quote: A challenge to evaluate the robustness of models to multiple datasets and tasks,
      including semantic and instance segmentation

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: PSPNet
    source: src-arxiv-1608-05442-v2
    observed_on: 2026-11-10
    quote: The winning team in 2016 proposing PSPNet [37] still holds the highest score.
    note: A pyramid-pooling segmentation network, the 2016 scene parsing winner on the test set.
  - system: SAGE
    source: src-arxiv-2610-36719
    observed_on: 2026-11-10
    quote: ADE20K (60.3 mIoU for semantic segmentation and 44.9 mask AP for instance segmentation)
    note: A ViT-Adapter backbone with task-specific decoders (October 2026).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Polygon annotations by a single expert annotator in the LabelMe interface,
  converted to per-pixel masks by depth ordering; the test masks are withheld by the maintainers,
  and the training and validation masks are public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can download the benchmark data and score the validation split with the development
    kit's evaluation code; test-set scores came only from the maintainers' server.
  source: src-github-csailvision-sceneparsing-readme
  quote: In demoEvaluation.m, we have included our implementation of the standard evaluation metrics
    (pixel-wise accuracy and IoU) for the benchmark.

task:
  exists: true
  input:
    - one photograph of an everyday indoor or outdoor scene, rescaled so that its shorter side is
      512 pixels
  output: For scene parsing, a mask giving one of the 150 class indices for every pixel, uploaded as
    a PNG per test image in one zip file; for instance segmentation, scored instance masks with a
    class from the 100 object categories.
  scoring: Scene parsing is scored by pixel accuracy over labelled pixels and IoU averaged over the
    150 classes, with pixels of class 0 ("other objects") ignored, and ranked on their mean;
    instance segmentation by COCO's mask AP, with AP for small, medium and large objects.
  metric_range:
    - 0
    - 100
  metric_range_note: Pixel accuracy, mean IoU and AP are proportions, given as fractions or
    percentages in the sources.
  source: src-github-csailvision-sceneparsing-readme
  quote: participants are required to upload a zip file which contains the predicted annotation mask
    for the given testing images to the evaluation server

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The benchmark data (ADEChallengeData2016, 922 MB for training and validation, 203 MB
    for the test images) and the instance-segmentation data are linked for download from the
    benchmark page without a sign-in. The full ADE20K dataset, with all classes, parts and polygons,
    needs registration and the maintainers' approval under the terms of use; that route was not
    used. The 2021 site lists its test images as to be released later.
  access_basis:
    reason: Training and validation masks are released and the test images are downloadable, but the
      test masks are withheld and test scores came from the maintainers' server.
    source: src-sceneparsing-csail-home
    quote: Specifically, the benchmark is divided into 20K images for training, 2K images for
      validation, and another batch of held-out images for testing.
  refresh: versioned-releases
  refresh_note: The benchmark data has not changed since 2016; the 2017 challenge added the instance
    segmentation data, and the full dataset was re-released in 2021 (versions).
  refresh_basis:
    reason: Each change is a separately named release -- ADEChallengeData2016, the 2017 instance
      data and the full dataset's ADE20K_2021_17_01 folder -- that a result can name.
    source: src-github-csailvision-ade20k-readme
    quote: ADE20K_2021_17_01
  data_provenance:
    - inherited-from-constituents
    - expert-authored
  data_provenance_note: The images were drawn from LabelMe, the SUN database and Places to cover the
    SUN scene categories; every annotation was drawn by one expert annotator, whom the paper
    contrasts with Mechanical Turk workers ("our dataset was annotated by a single expert annotator,
    providing extremely detailed and exhaustive image annotations", same Source).
  data_provenance_source: src-arxiv-1608-05442-v2
  data_provenance_quote: Images were annotated by a single expert worker using the LabelMe interface
  contamination_risk: medium
  contamination_risk_note: The test masks are withheld, but the test images are public, and the
    images come from SUN, Places and LabelMe, all public and plausible in web-scale pretraining.
    Since the server stopped, the de facto evaluation set is the validation split, whose masks are
    public and which MaskFormer-style test entries also trained on. Nobody has assessed overlap.
  contamination_evidence: []
  ceiling_anchor_type: noise-ceiling
  ceiling_anchor_type_note: The annotator re-labelled 61 validation images six months later and
    82.4% of pixels got the same label; the paper treats this as approximate human performance and a
    possible upper bound on pixel accuracy, and the image mode (20.30% pixel accuracy) as a lower
    bound. No ceiling is stated for mean IoU.
  ceiling_anchor_type_source: src-arxiv-1608-05442-v2
  ceiling_anchor_type_quote: In Fig. 13 we compare the top models against the proposed baselines and
    human performance (approximately measured as the annotation consistency in Sec.2.3)
  dataset_licence: BSD-3-Clause
  dataset_licence_note: The terms of use license the annotations, the website and the software under
    a BSD 3-clause notice (the page calls it "a Creative Commons BSD-3 License Agreement"); the
    images are not MIT's.
  dataset_licence_source: src-ade20k-csail-terms
  dataset_licence_quote: This website, image annotations and the software provided belongs to MIT
    CSAIL and is licensed under a Creative Commons BSD-3 License Agreement
  upstream_licences: MIT CSAIL does not own the images' copyright; they are provided for
    non-commercial research and educational use under the ADE20K terms of use.
  upstream_licences_source: src-ade20k-csail-terms
  upstream_licences_quote: Researcher shall use the Database only for non-commercial research and
    educational purposes.
  size:
    - count: 3000
      unit: test images (scene parsing, held-out masks)
      subset: ade20k#sceneparse150
      note: The development kit's README says 2,000 test images (see review_checks).
      source: src-arxiv-1608-05442-v2
      quote: After annotation, there are 20, 210 images in the training set, 2, 000 images in the
        validation set, and 3, 000 images in the testing set.
    - count: 2000
      unit: validation images with public masks
      subset: ade20k#sceneparse150
      source: src-sceneparsing-csail-home
      quote: Validation set 2,000 images
    - count: 20210
      unit: training images with public masks
      subset: ade20k#sceneparse150
      source: src-sceneparsing-csail-home
      quote: Training set 20,210 images
    - count: 218000
      unit: object instances in 100 categories (rounded as the paper gives it)
      subset: ade20k#instseg100
      source: src-arxiv-1608-05442-v2
      quote: The total number of object instances is 218K
    - count: 27574
      unit: images in the 2021 full dataset (25,574 training and 2,000 validation)
      subset: ade20k@2021
      source: src-github-csailvision-ade20k-readme
      quote: 27,574 images (25,574 for training and 2,000 for testing) spanning 365 different
        scenes.
  submission_limit:
    max_submissions: 2
    period_days: 7
    per: participant, on the test set
    source: src-sceneparsing-csail-home
  submission_limit_source: src-sceneparsing-csail-home
  submission_limit_quote: To prevent overfitting, submission is limited to only twice per week.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: MIT CSAIL Computer Vision Group
  maintainer_basis:
    reason: The terms of use say the site, the annotations and the software belong to MIT CSAIL, and
      both sites are signed by its Computer Vision Group; the papers' authors were at MIT with
      co-authors at Toronto, CUHK and Peking University.
    source: src-ade20k-csail-terms
    quote: This website, image annotations and the software provided belongs to MIT CSAIL
  maintainer_type: academic-lab
  submission_process:
    - held-out-server
  submission_process_note: Entrants registered on the server, uploaded a zip of test masks and were
    ranked on a leaderboard; the server no longer runs (activity).
  submission_process_source: src-sceneparsing-csail-eval
  submission_process_quote: You could log in to submit your prediction result for the test set or
    register a new user on the left panel.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-1608-05442-v2
      quote: Scene parsing submissions were ranked based on the average score of the mean IoU and
        pixel-wise accuracy in the benchmark test set.
    - flag: maintainer-competes-on-own-benchmark
      source: src-cvf-ade20k-cvpr2017-pdf
      quote: A novel network design called Cascade Segmentation Module is proposed to parse a scene
        into stuff, objects, and object parts in a cascade and improve over the baselines.
  independence_flags_note: The maintainers held the test masks and scored every test submission. The
    paper that introduced the benchmark also introduced its authors' Cascade Segmentation Module and
    reported it beating the baselines on the validation set; the IJCV extension re-implements PSPNet
    and UPerNet, the latter from the same group, and releases them. Funding from Samsung and NSF is
    stated (funding); no source read shows a Samsung system evaluated.
  independence_assessed: true
  funding:
    source: src-crossref-10-1007-s11263-018-1140-0
    quote: '"name":"Samsung","doi-asserted-by":"publisher"'

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The benchmark's headline is the test-set score, which only the maintainers' server could
      produce because it held the test masks, and the server no longer runs. Validation scores can
      be reproduced by anyone with the development kit.
    source: src-sceneparsing-csail-home
    quote: You could submit the prediction results of the test set to the Evaluation Server.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: CSAILVision/sceneparsing development kit (MATLAB demoEvaluation.m, with Caffe, Torch7 and
    PyTorch training code); the PyTorch re-implementations are in
    CSAILVision/semantic-segmentation-pytorch (not read)
  harness_source: src-github-csailvision-sceneparsing-readme
  harness_quote: In demoEvaluation.m, we have included our implementation of the standard evaluation
    metrics (pixel-wise accuracy and IoU) for the benchmark.
  submission_channel:
    source: src-sceneparsing-csail-eval
    quote: This is the evaluation server for the MIT Scene Parsing Benchmark.
  submission_channel_note: http://sceneparsing.csail.mit.edu/eval/, which on 2026-11-10 returned its
    PHP source instead of the login page (history).
  code_licence: BSD-3-Clause
  code_licence_note: The benchmark page labels the development kit's licence, and GitHub's metadata
    for CSAILVision/sceneparsing reports BSD-3-Clause; the repository's LICENSE file was not read.
  code_licence_source: src-sceneparsing-csail-home
  code_licence_quote: License BSD 3-Clause License
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile, three conditions change an ADE20K number: which split it was scored on (the
  # public validation set, as nearly all papers now do, or the test server), what the model was pre-trained and
  # trained on (the 2016 challenge allowed only ImageNet and Places365 pre-training; later test entries trained
  # on train plus val with ImageNet-22K backbones), and single- versus multi-scale inference with flipping, which
  # papers list in separate columns. The last has no EvalConditions field and is recorded here only.
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: official-aggregate
aggregation_policy_note: The scene parsing track ranks on the mean of pixel accuracy and mean IoU
  over the test set; the instance track ranks on mask AP. No score spans the two tracks, and papers
  now report mean IoU on its own.
aggregation_policy_basis:
  reason: The final score is defined by the benchmark as the average of the two measures.
  source: src-sceneparsing-csail-home
  quote: To evaluate the segmentation algorithms, we will take the mean of the pixel-wise accuracy
    and class-wise IoU as the final score.

homepage: http://sceneparsing.csail.mit.edu/
repository: https://github.com/CSAILVision/sceneparsing
dataset_url: https://ade20k.csail.mit.edu/
leaderboard_url: http://sceneparsing.csail.mit.edu/eval/
versions:
  - version: '2016'
    label: ADE20K and the MIT Scene Parsing Benchmark (ADEChallengeData2016)
    version_kind: edition
    released: 2016-06-22
    changes: The first release. The full ADE20K dataset (20,210 training, 2,000 validation and 3,000
      test images, 3,169 annotated classes) and the SceneParse150 benchmark drawn from it, with the
      development kit and the evaluation server, for the 2016 challenge.
    breaking: true
    superseded_by: '2017'
    frozen: true
    sources:
      - src-sceneparsing-csail-challenge
      - src-arxiv-1608-05442-v2
      - src-cvf-ade20k-cvpr2017-pdf
  - version: '2017'
    label: Instance segmentation benchmark added (InstSeg100)
    version_kind: track-set
    changes: Adds the InstSeg100 instance segmentation benchmark (100 object categories, scored by
      COCO's mask AP) for the Places Challenge 2017, beside the unchanged scene parsing data and
      test set.
    supersedes_version: '2016'
    superseded_by: '2021'
    frozen: true
    sources:
      - src-arxiv-1608-05442-v2
      - src-sceneparsing-csail-home
  - version: '2021'
    label: Full dataset re-release (ADE20K_2021_17_01)
    version_kind: revision
    changes: Re-releases the full dataset with 25,574 training and 2,000 validation images, 707,868
      objects in 3,688 categories, polygons, amodal instance masks and per-object attributes, with
      faces and licence plates blurred, from a new site behind registration. The SceneParse150 and
      InstSeg100 files are not re-issued.
    supersedes_version: '2017'
    frozen: true
    sources:
      - src-github-csailvision-ade20k-readme
      - src-ade20k-csail-home
versions_note: No release date is printed for the 2017 instance data or the 2021 re-release; the
  2021 folder name ADE20K_2021_17_01 suggests 17 January 2021, and the repository holding it has
  commits from 2021-02-28 (GitHub API, not a Source). The 2016 full dataset's own release date is
  not stated in the sources read.

subsets:
  - id: ade20k#sceneparse150
    label: Scene parsing (SceneParse150, 150 classes)
    items: 3000
    evidence:
      - source: src-arxiv-1608-05442-v2
        quote: We select the top 150 categories ranked by their total pixel ratios
      - source: src-arxiv-1608-05442-v2
        quote: Among the 150 categories, there are 35 stuff classes (i.e., wall, sky, road) and 115
          discrete object classes (i.e., car, person, table).
    notes: Items are test images; the 150 classes cover 92.75% of the dataset's pixels. Pixels
      outside the 150 classes are labelled 0 and ignored. The headline benchmark.
  - id: ade20k#instseg100
    label: Instance segmentation (InstSeg100, 100 object classes)

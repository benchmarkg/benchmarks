  confidence: medium
  review_checks:
    - check: activity is closed on the observation that the evaluation server returns its own PHP
        source, unexecuted, rather than a working page; no maintainer statement was found, and
        unknown is the alternative if the server is only temporarily misconfigured. The leaderboard
        iframe on the same server was not read.
      field: activity
      source: src-sceneparsing-csail-eval
      quote: This is the evaluation server for the MIT Scene Parsing Benchmark.
    - check: The test-set size disagrees between sources. Both papers give 3,000 test images, while
        the development kit's README says 2,000; the 2021 README calls its 2,000 held-back images
        testing although the site calls them validation. data.size and the subset carry 3,000.
      field: data.size
      source: src-github-csailvision-sceneparsing-readme
      quote: The testing data contains 2000 images which will be released in middle August.
    - check: evaluation_method is domain-metric alone. The challenge's final score averages pixel
        accuracy and mean IoU, so composite (with exact-match for pixel accuracy) is the alternative
        if pixel accuracy is not counted as a segmentation domain measure.
      field: evaluation_method
      source: src-sceneparsing-csail-challenge
      quote: To evaluate the segmentation algorithms, we will take the mean of the pixel-wise
        accuracy and class-wise IoU as the final score.
    - check: The 2021 full-dataset re-release is modelled as a revision of the entry with breaking
        false, since SceneParse150 results continue on the 2016 files. It also adds about 5,000
        training images and blurs faces and plates in all images, so an edition, or no version at
        all (it re-issues the source dataset rather than the benchmark), are the alternatives.
      field: versions
      source: src-github-csailvision-ade20k-readme
      quote: Images are also anonymized, blurring faces and license plates.
    - check: ADE20K-Full (847 classes) and ADE20K-Panoptic are kept out as other groups'
        derivatives, without ids. The panoptic set is built only from the maintainers' own two
        benchmarks' annotations, so it could instead be a subset if MIT CSAIL is found to have
        released it; who built it is not stated in the sources read. ADE20K-847 is independently
        cited and used and may deserve its own entry.
      field: lineage
      source: src-arxiv-2107-06278-v2
      quote: combines the ADE20K semantic segmentation annotation for semantic segmentation from the
        SceneParse150 challenge [54] and ADE20K instance annotation from the COCO+Places challenge
        [1]
    - check: data_provenance tags expert-authored for the single annotator, whom the paper calls an
        expert and contrasts with crowd workers; whether labelling skill counts as the specialist
        knowledge the term means (crowd-authored is the alternative), and whether reusing LabelMe,
        SUN and Places images is inherited-from-constituents or web-scraped.

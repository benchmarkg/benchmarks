    in reading order with one-character windows that keep bylines, team names and reference lists out;
    Crossref's records of the two papers' DOIs; the CVPR paper's CVF PDF; the ADE20K home and terms pages;
    the benchmark and 2016 challenge pages, withheld from archiving because they list the organisers by
    name; the evaluation server's page, quoted from its unexecuted PHP source with the delimiters removed;
    two READMEs at pinned commits; and two 2025-2026 abstract pages. The leaderboard iframe and the registration

lineage:
  role: root
lineage_note: Two derivatives by other groups are separate by 04 S4 and have no ids here.
  ADE20K-Full was defined by the MaskFormer authors (arXiv 2107.06278) from the full dataset's open
  vocabulary, keeping the classes "present in both training and validation sets, resulting in a
  total of 847 categories" (src-arxiv-2107-06278-v2, which also prints 874 once); as ADE20K-847 or
  A-847 it is a standard open-vocabulary segmentation benchmark ("on the ADE20K-847 benchmark",
  src-arxiv-2501-17642, 2025). ADE20K-Panoptic "combines the ADE20K semantic segmentation annotation
  for semantic segmentation from the SceneParse150 challenge [54] and ADE20K instance annotation
  from the COCO+Places challenge [1]" (same MaskFormer Source), with 100 thing and 50 stuff classes;
  who first built it is not stated in the sources read. Neither is maintained by MIT CSAIL.


# data/benchmarks/vision/mpi-sintel.yaml
#
# P1-S8-T07, vision entry 22. Filled from the paper that defines the benchmark (ECCV 2012), read as the corrected
# PDF that sintel.is.tue.mpg.de links, with Crossref's record of its Springer DOI for the venue; six pages of
# sintel.is.tue.mpg.de (home, downloads, FAQ, licence, the stereo and depth training-data pages, scripts and styles
# stripped) and the two public results boards (Final and Clean pass), which are withheld from archiving because
# their method rows name authors; and four 2025-2026 arXiv abstract pages that use the benchmark: FreeFlow (arXiv
# 2609.11486, first on both boards), a real-world generalisation study of flow models (arXiv 2607.10470), an audit
# of camera-pose scoring on Sintel (arXiv 2611.00482) and an intrinsic-image paper on Sintel's split protocol
# (arXiv 2605.06359). The site serves no robots.txt (404). The About and Imprint pages name individuals and are not
# cited; the segmentation page, the companion workshop paper and the supplemental technical report were read and
# are not cited. Nothing was registered, logged in to or submitted, and no dataset archive or image was fetched.
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the MPI Sintel family: the optical flow benchmark with its two scored passes (Final and Clean) as
# subsets on one server, and the 2015 depth and stereo training releases as unscored subsets brought in by a
# track-set version. The id follows the site's own name, "MPI Sintel", because Sintel alone is the film's.

id: mpi-sintel
name: MPI Sintel
aliases:
  - MPI-Sintel
  - MPI Sintel Flow Dataset
  - Sintel
tagline: Optical flow on frames rendered from the open source film Sintel, scored by endpoint error
  on withheld test flow.
description: >
  An optical flow benchmark from the Max Planck Institute for Intelligent Systems (ECCV 2012), built
  from the open source 3D animated short film Sintel. Because the film's production data is open,
  the ground-truth flow of every frame was computed from the 3D scenes with a modified Blender, and
  the same 35 clips (1,628 frames at 1024x436) were rendered in passes of rising difficulty: Albedo,
  Clean (shading and specular reflections) and Final (adding motion blur, defocus blur and
  atmospheric effects, close to the released film). The clips are split into 23 training sequences
  with public flow and 12 test sequences whose flow is withheld. Entrants compute flow for every test
  frame of the Clean and Final passes, subsample it with the maintainers' Bundler and upload it; the
  server ranks methods by average endpoint error (EPE) over all frames, with breakdowns for matched
  and unmatched pixels, distance from motion boundaries and speed, on one board per pass. Two test
  sequences are perturbed to detect submissions of reconstructed ground truth. Uploads are limited
  and public entries must be described in a document. In 2015 the maintainers added depth and
  camera-motion, stereo disparity and segmentation training data, which no board scores. Learned flow
  networks now lead both boards; the training data and the depth releases are also reused offline for
  camera-pose and intrinsic-image evaluation.
self_description:
  source: src-sintel-home
  quote: A data set for the evaluation of optical flow derived from the open source 3D animated
    short film, Sintel.
paper:
  title: A Naturalistic Open Source Movie for Optical Flow Evaluation
  doi: 10.1007/978-3-642-33783-3_44
  source: src-crossref-10-1007-978-3-642-33783-3-44
released: 2012-08-24
released_note: The site's update list dates the opening of the benchmark for submissions; the paper
  appeared at ECCV 2012 in October 2012 (Crossref records the chapter from 2012-09-26).
released_source: src-sintel-home
released_quote: Friday, 24th August 2012 Welcome to the Sintel Dataset.
release_venue: ECCV 2012
release_venue_source: src-crossref-10-1007-978-3-642-33783-3-44
release_venue_quote: ECCV 2012"],"original-title"

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/image-matching-correspondence
  secondary:
    - vision/depth-geometry
domain_basis:
  reason: The scored output is a dense optical flow field, a correspondence for every pixel of one
    frame in the next, and the ranked score is its endpoint error against the ground-truth flow on
    both boards, which is the image-matching-correspondence leaf (finding corresponding points
    between images of the same scene), as for KITTI's flow boards. The 2015 depth and stereo
    disparity releases give per-pixel depth and disparity for the training sequences, which is
    depth-geometry, secondary; no board scores them (see review_checks). Nothing is scored against
    language, so the multimodal boundary (02 S11 rule 12) is not in question.
  source: src-mpg-sintel-eccv2012-pdf
  quote: rank each method on these according to average endpoint error (EPE) across all test
    sequences
domain_considered_and_rejected:
  - term: vision/video-understanding
    reason: The inputs are video sequences and the paper encourages methods that integrate over many
      frames, but the score is a per-pixel motion vector against ground truth, not a recognised
      action, event or temporal segment, which is what the leaf scores.
    source: src-mpg-sintel-eccv2012-pdf
    quote: This should encourage the development of methods that use longer sequences and integrate
      information over time.
  - term: vision/3d-reconstruction
    reason: Papers now score camera trajectories on Sintel clips (as_used), but the benchmark's own
      score is two-dimensional image motion; no reconstruction or pose is scored by the maintainers.
    source: src-arxiv-2611-00482
    quote: On the common Sintel protocol, an image-free constant-velocity line has a lower mean ATE
      than 10 of 11 recent models re-run with official code
  - term: vision/segmentation
    reason: A segmentation training set was released beside depth and stereo in 2015, but it has no
      test set or board and is not modelled as a subset.
    source: src-sintel-home
    quote: Please see the dedicated pages for Stereo and disparity, Depth and camera motion, and
      Segmentation.
  - term: multimodal/visual-qa
    reason: The rejected family under 02 S11 rule 12. The inputs are rendered frames and the scored
      outputs are flow fields; no language enters the input or the score.
capability:
  - perception
capability_basis:
  perception:
    reason: Every scored quantity is how accurately motion was recovered from the rendered frames,
      against ground-truth flow computed from the film's 3D scenes.
    source: src-sintel-downloads
    quote: The flow for these sequences is withheld for evaluation purposes.
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Motion and occlusion are spatial, but the scored quantity is estimation accuracy, which
      the term's exclusion test sends to perception, as for KITTI and ETH3D.
  - term: distribution-shift-generalization
    reason: The Final pass is harder than Clean and papers report zero-shot transfer to and from
      Sintel, but the benchmark defines no shifted condition of its own and allows training on its
      own training set; a 2026 study finds Sintel progress predicts real-world accuracy only weakly
      (see review_checks).
    source: src-arxiv-2607-10470
    quote: progress on Sintel, KITTI and Spring only weakly predicts accuracy on real-world data

evaluation_method:
  - statistical-fit
evaluation_method_basis:
  reason: The ranked score is the average endpoint error, the mean Euclidean distance in pixels
    between estimated and ground-truth flow vectors, averaged over all test frames; the breakdowns
    are the same error over the paper's masks (matched and unmatched pixels, distance bands from
    motion boundaries, speed bands). A mean error against ground-truth continuous values is the
    statistical-fit term (see review_checks).
  source: src-sintel-faq
  quote: Since the sequences differ in length, the average we compute is the average over all
    frames, and not the average of per-sequence average errors.
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Endpoint error is named and used only in optical flow and stereo, and its unmatched and
      boundary-distance masks are the benchmark's own definitions, which argues for domain-metric
      (KITTI's flow outlier percentage was tagged so). It is nonetheless a mean distance between
      vectors, the kind of general statistic the term's exclusion sends to statistical-fit.
    source: src-mpg-sintel-eccv2012-pdf
    quote: we compute the average error in areas closer than 10 pixels, between 10 and 60 pixels,
      and larger than 60 pixels
  - term: composite
    reason: The board shows nine EPE columns but ranks by one of them at a time; no score combines
      them.
designed_for_subjects:
  - classical-algorithm
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The paper seeds the board with six public, hand-designed flow methods (Classic+NL,
    Classic++, LDOF, Horn and Schunck, H-L1) and releases a training set more than a hundred times
    Middlebury's for learning-based methods; learned networks trained on it and on other synthetic
    data now lead both boards.
  source: src-mpg-sintel-eccv2012-pdf
  quote: and a larger training set for machine learning methods
designed_for_subjects_considered_and_rejected:
  - term: generative-media-model
    reason: Diffusion-based flow estimators now enter, but they are scored on recovered flow, not on
      generated media.
  - term: base-model
    reason: Top entries start from large pretrained encoders, but a flow decoder is trained and the
      result is scored as trained, not prompted.
as_used:
  - protocol: Camera-pose estimation. Feed-forward reconstruction and SLAM papers score camera
      trajectories by absolute trajectory error on short Sintel clips under a protocol of their own;
      the depth and camera-motion release is the only camera ground truth the site offers, though
      the abstract read does not name it. This is none of the benchmark's boards and uses no server.
    split: short clips chosen by the papers (which split is not stated in the abstract read)
    source: src-arxiv-2611-00482
    quote: On the common Sintel protocol, an image-free constant-velocity line has a lower mean ATE
      than 10 of 11 recent models re-run with official code
    note: The audit (arXiv 2611.00482, v2 November 2026) finds the Sintel trajectories straight
      enough that a constant-velocity line beats most models, and proposes a pose-anchored ATE; read
      from its abstract page only.
  - protocol: Intrinsic image decomposition. Learned decompositions are trained and tested on the
      released passes (the Albedo pass as reflectance), on splits the papers define themselves;
      splitting by frame rather than by scene leaks near-identical frames into the test set.
    split: training sequences, split by the papers
    source: src-arxiv-2605-06359
    quote: Several prior works split the dataset by frames, which allows spatially similar frames of
      the same scene to appear in both train and test partitions.
    note: arXiv 2605.06359 (May 2026), read from its abstract page only; it advocates scene-level
      splits.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. The Final and Clean boards list
    FreeFlow, an ECCV 2026 paper of September 2026, first among the submissions, and 2026 papers
    report Sintel test results and use its data offline.
  source: src-arxiv-2609-11486
  quote: Sintel (0.68/1.48 EPE on Clean/Final)
activity: accepting-submissions
activity_note: The benchmark has never run in rounds. The boards show no submission dates; the
  newest row read is FreeFlow-L (ECCV 2026). The signup, login and upload pages were not opened.
activity_basis:
  reason: The FAQ still sets upload limits and explains how to submit, and a September 2026 paper's
    results stand first on both boards. No source says the server has closed.
  source: src-sintel-faq
  quote: Each user may upload one bundling result once every eight hours, and up to three times per
    30 days.
events:
  - name: Robust Vision Challenge 2018 (ROB), whose flow challenge drew on the Sintel benchmark; the
      Final board still lists ROB baseline rows
    kind: challenge
    source: src-sintel-results
    quote: Baseline submission for the ROB flow challenge
  - name: Robust Vision Challenge 2020 (RVC), with RVC baseline rows on the Final board
    kind: challenge
    source: src-sintel-results
    quote: RVC 2020 baseline submission

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: FreeFlow-L, first after the ground-truth row on the Final board at 1.480 EPE
    source: src-sintel-results
    observed_on: 2026-11-10
    quote: FreeFlow-L [2] 1.480 0.689 7.894
    note: A hierarchical transformer without flow-specific components (ECCV 2026).
  - system: FreeFlow-L, first after the ground-truth row on the Clean board at 0.683 EPE
    source: src-sintel-results-clean
    observed_on: 2026-11-10
    quote: FreeFlow-L [2] 0.683 0.218 4.457
  - system: FreeFlow
    source: src-arxiv-2609-11486
    observed_on: 2026-11-10
    quote: Sintel (0.68/1.48 EPE on Clean/Final)
evaluation_target: learned-system
evaluation_target_basis:
  reason: The benchmark was seeded with classical methods, which remain on the boards, but learned
    networks hold the top ranks of both passes and the classical seeds now sit near the bottom of
    561 rows (LDOF at 523 on the Final board, 9.116 EPE).
  source: src-sintel-results
  quote: LDOF [523] 9.116 5.037 42.344
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The ground-truth flow, motion-boundary and unmatched-pixel masks were
  computed from the film's 3D scenes by a modified Blender (simulation is the near alternative), and
  the test sequences' flow is held by the maintainers; two test sequences are perturbed so that
  their flow cannot be recovered from the public production files.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can download the data, compute training-set errors with the released software, and
    submit test results through an account. The test scores themselves come only from the server.
  source: src-mpg-sintel-eccv2012-pdf
  quote: Software is also provided to compute the various error statistics on the training data

task:
  exists: true
  input:
    - a sequence of rendered frames (1024x436, 24 frames per second) of one test clip, in the Final
      pass
    - the same clip in the Clean pass
  output: A forward flow field for every frame pair of each test sequence, for both passes, packed
    by the maintainers' Bundler, which subsamples the flow, into one LZMA file for upload.
  scoring: Average endpoint error over all test frames (not per-sequence means), ranked per pass,
    with EPE on matched and unmatched pixels, at 0-10, 10-60 and 60-140 px from motion boundaries
    and at speeds of 0-10, 10-40 and over 40 px per frame shown beside it; any column can be
    selected for ranking.
  metric_range: null
  metric_range_note: EPE is in pixels, bounded below at zero and with no upper bound; the
    ground-truth row scores 0.000 and the last row read scores over 244 px. Lower is better.
  source: src-sintel-faq
  quote: Sign up, create a method (algorithm), and upload your results as an LZMA file using the
    Bundler application included in the test data.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The training images (Albedo, Clean and Final) with ground-truth flow, masks and
    invalid-pixel maps, and the test images (Clean and Final), are linked from the public downloads
    page with European and US mirrors; the test flow is never released. The archives were not
    fetched, so whether a download needs an account was not checked; submitting does.
  access_basis:
    reason: The test sequences are released as images only and their flow is withheld for the
      server.
    source: src-sintel-downloads
    quote: The flow for these sequences is withheld for evaluation purposes.
  refresh: versioned-releases
  refresh_note: Dated changes read from the site's update list. September 2012 fixed a bug in the
    Bundler, February 2015 added depth, stereo and segmentation training data, and March 2015
    corrected some extrinsic camera matrices of the depth data; no change to the flow test set is
    recorded. A results-visualisation feature was added in August 2017.
  refresh_basis:
    reason: The 2015 additions are a dated, announced release.
    source: src-sintel-home
    quote: Monday, 23th February 2015 New training data is available!
  data_provenance:
    - synthetic-procedural
  data_provenance_note: Frames and ground truth are rendered by Blender from the open production
    files of the animated film Sintel (Blender Foundation, Durian Open Movie Project), with
    transparency, hair, motion-blur and displacement settings changed for flow evaluation; no
    learned model is in the loop. The rendering is not a physics simulation (the film violates
    physics in places), so simulation-generated is not tagged, as for Brain-Score's rendered
    stimuli. No term names renders of hand-built scenes; the gap is logged in taxonomy/_failures/
    (proposed rendered-graphics).
  data_provenance_source: src-sintel-depth
  data_provenance_quote: The depth values are returned from Blender in an additional Z-buffer pass,
    similar to the optical flow.
  contamination_risk: medium
  contamination_risk_note: The scored content is the test flow, held by the server, but the test
    images are public and the film's 3D production data is open source, so the ground truth could be
    reconstructed with effort. The maintainers perturbed two test sequences to detect this, limit
    uploads, forbid tuning on the test set and monitor for cheating. The film itself is public
    video. No source read assesses contamination of learned entrants.
  contamination_risk_source: src-mpg-sintel-eccv2012-pdf
  contamination_risk_quote: Because the Sintel 3D data is open source, an unscrupulous researcher
    could
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: EPE is bounded below at zero, and the board's own ground-truth row
    scores 0.000 in every column. No source measures an achievable floor; the paper reports that a
    submission of the unperturbed ground truth would score 2.78 px on the perturbed sequences.
  ceiling_anchor_type_source: src-sintel-results
  ceiling_anchor_type_quote: GroundTruth [1] 0.000 0.000 0.000
  dataset_licence: MPI Sintel licence (non-commercial scientific research, education and artistic
    use only; no redistribution without Max-Planck's written permission)
  dataset_licence_note: The site's licence page covers "the SINTEL Software/Data" and names the
    Max-Planck-Gesellschaft as licensor; it also forbids using the data to train methods for
    commercial use. The film's own licence is not stated in any source read.
  dataset_licence_source: src-sintel-license
  dataset_licence_quote: License for non-commercial scientific research purposes
  size:
    - count: 564
      unit: test frames in 12 sequences (1,064 training frames in 23 sequences), each in the Clean
        and Final passes
      source: src-mpg-sintel-eccv2012-pdf
      quote: In total, the data set contains 1064 training and 564 test frames.
    - count: 12
      unit: test sequences (23 training sequences)
      source: src-sintel-downloads
      quote: Contains the 23 training sequences (plus ground truth optical flow), the 12 testing
        sequences
  submission_limit:
    max_submissions: 3
    period_days: 30
    per: user; also at most one upload every eight hours
    source: src-sintel-faq

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Perceiving Systems department, Max Planck Institute for Intelligent Systems
    (Tuebingen)
  maintainer_basis:
    reason: The site's footer names the department as its home, and the licence page names the
      Max-Planck-Gesellschaft as owner of the data and software. The paper's authors came from the
      institute, the University of Washington (which hosts a US mirror) and Georgia Tech.
    source: src-sintel-license
    quote: Any copyright or patent right is owned by and proprietary material of the
      Max-Planck-Gesellschaft zur Förderung der Wissenschaften e.V.
  maintainer_type: academic-lab
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: Entrants sign up, create a method and upload the Bundler's file; results
    appear publicly only after the user approves them. Every public method must be described in a
    document (a paper or a technical report; it may be withheld during review), and the maintainers
    may remove undocumented methods or ones that do not match the publication. Many rows are marked
    Anonymous (see review_checks).
  submission_process_source: src-sintel-faq
  submission_process_quote: Every method that is posted on the site must be fully described in a
    document (e.g. a published paper or technical report).
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-sintel-downloads
      quote: The flow for these sequences is withheld for evaluation purposes.
  independence_flags_note: The maintainers hold the test flow and their server scores every
    submission. The paper seeds the board with public classical methods, one of them (Classic+NL)
    cited from work that shares an author with the benchmark by the paper's reference list; no
    source read states the relation, so maintainer-competes-on-own-benchmark is not set (see
    review_checks). The ground-truth and zero and mean baselines on the board are the maintainers'
    reference rows. The paper names NSF funding; no funder is an evaluated party in the sources
    read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The ranked scores are on the test sequences, whose flow only the server holds;
      training-set errors can be computed by anyone with the released software.
    source: src-sintel-downloads
    quote: The flow for these sequences is withheld for evaluation purposes.
  reproducibility_blockers:
    - private-test-set
  reproducibility_blockers_note: The licence is non-commercial and forbids redistribution, which
    limits sharing derived data without blocking research reproduction, so licence-restriction is
    not tagged.
  harness_availability: official-harness
  harness: The MPI-Sintel Bundler (binaries for Linux, OS X and Windows), which subsamples the
    computed test flow for upload, with example code to read and write .flo files and, per the
    paper, software for the error statistics on the training data
  harness_source: src-sintel-downloads
  harness_quote: Archive includes binary executables for Linux, OSX, and Windows.
  submission_channel:
    source: src-sintel-faq
    quote: Sign up, create a method (algorithm), and upload your results as an LZMA file using the
      Bundler application included in the test data.
  submission_channel_note: The site's signup, method and upload pages, behind the login, which were
    not opened.
  code_licence: null
  code_licence_note: The licence page covers "the SINTEL Software/Data" together under the same
    non-commercial terms, which would include the Bundler and SDK; no separate code licence was
    found.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the profile: which pass was scored (Final or Clean, the two boards, or a paper's own split of the
  # training set offline) and what the method was trained on (synthetic pre-training sets only, read as zero-shot,
  # or fine-tuned on Sintel's training set and others), which papers separate in their tables.
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: none-by-design
aggregation_policy_note: Each pass has its own board, ranked by one EPE column at a time; no score
  combines the passes or the columns.
aggregation_policy_basis:
  reason: The paper ranks each challenge problem separately rather than by an average of ranks.
  source: src-mpg-sintel-eccv2012-pdf
  quote: Middlebury ranks methods by the average rank of their performance on every test sequence.
secondary_axes: []
homepage: https://sintel.is.tue.mpg.de/
dataset_url: https://sintel.is.tue.mpg.de/downloads
leaderboard_url: https://sintel.is.tue.mpg.de/results

versions:
  - version: 2012-08
    label: Optical flow benchmark (Clean and Final passes)
    version_kind: revision
    released: 2012-08-24
    items: 564
    changes: The first release, with 23 training and 12 test sequences in the Albedo, Clean and
      Final passes (test in Clean and Final only), ground-truth flow and masks for training, the
      Bundler and the evaluation server.
    errata:
      - date: 2012-09-13
        scope: the Bundler (submission tool)
        description: A bug in the Bundler application was fixed and users were asked to use the
          latest version.
        source: src-sintel-home
    frozen: true
    sources:
      - src-sintel-home
      - src-mpg-sintel-eccv2012-pdf
  - version: 2015-02
    label: Depth, stereo and segmentation training data added
    version_kind: track-set
    released: 2015-02-23
    changes: Adds beta training sets for depth and camera motion, stereo disparity and segmentation
      on the training sequences, each on its own page with an SDK; no test set or board for any of
      them. The flow benchmark is unchanged.
    supersedes_version: 2012-08
    errata:
      - date: 2015-03-05
        scope: depth and camera-motion data
        description: Some extrinsic camera matrices were wrong because of a bug, and users of them
          were asked to download the data again.
        source: src-sintel-depth
    frozen: false
    sources:
      - src-sintel-home
      - src-sintel-depth
      - src-sintel-stereo
versions_note: The 2017 addition of input frames to the results visualisation changes no scored item
  and is not a version. The depth and stereo pages still call their data a beta that might change,
  so the 2015 version is not frozen. The site links a corrected PDF of the paper; what was corrected
  is not stated.

subsets:
  - id: mpi-sintel#final
    label: Final pass (test, 12 sequences)
    items: 564
    evidence:
      - source: src-mpg-sintel-eccv2012-pdf
        quote: frames of the test set for the Clean and Final passes
      - source: src-mpg-sintel-eccv2012-pdf
        quote: Beyond the Clean pass it adds atmospheric
    notes: The board's default view. Adds atmospheric effects, depth-of-field and motion blur and
      colour correction to Clean, close to the released film.
  - id: mpi-sintel#clean
    label: Clean pass (test, 12 sequences)
    items: 564
    evidence:
      - source: src-mpg-sintel-eccv2012-pdf
        quote: This pass adds complexity by introducing illumination of various kinds
      - source: src-sintel-results-clean
        quote: FreeFlow-L [2] 0.683 0.218 4.457
    notes: Shading, self-shadowing, specular reflections and inter-reflections, without blur or
      atmosphere; its own board.
  - id: mpi-sintel#depth
    label: Depth and camera motion (training data, beta)
    scored_separately: false
    domain_override:
      primary: vision/depth-geometry
    capability_override:
      - perception
    evidence:
      - source: src-sintel-depth
        quote: This archive contains the beta version of the Sintel-depth training set.
      - source: src-sintel-depth
        quote: The depth maps contain the ground truth depth value (in meter) at each pixel.
    notes: Per-pixel depth in metres and intrinsic and extrinsic camera matrices for the left
      camera, for the training sequences only; no test set, metric or board. Papers score camera
      pose on Sintel clips offline (as_used).
  - id: mpi-sintel#stereo
    label: Stereo and disparity (training data, beta)
    scored_separately: false
    domain_override:
      primary: vision/depth-geometry
    capability_override:
      - perception
    evidence:
      - source: src-sintel-stereo
        quote: This archive contains the beta version of the Sintel-stereo training set.
      - source: src-sintel-stereo
        quote: The images are rendered from two cameras with a baseline of 10 cm apart.
    notes: Clean and Final right views re-rendered 10 cm to the right, with disparities, occlusion
      and out-of-frame masks, for the training sequences only; fog layers were removed because they
      give no parallax. No test set or board.
subsets_note: >
  The two scored subsets are the passes, which share the test sequences, the server and the account
  system. The Albedo pass is released for training and was analysed in the paper, but the test download
  holds only Clean and Final and no board ranks Albedo. The segmentation training data of 2015 is not
  modelled as a subset (see domain_considered_and_rejected).

lineage:
  role: root
lineage_note: No same-maintainer variant or other maintainer's fork with its own releases was found.

    read. DGM-Net's abstract page (a DOI) is evidence of current use.
  confidence: medium
  review_checks:
    - check: Primary segmentation rather than driving-perception-3d. Three of the four tasks label
        image pixels or instance masks, and the pixel-level table (315 rows) dwarfs the 3D one (3).
        But the leaf driving-perception-3d is defined as perceiving the road scene from vehicle
        sensors, which a reader could apply to the whole suite; KITTI and nuScenes kept that leaf

# data/benchmarks/vision/cityscapes.yaml
#
# P1-S8-T07, vision entry 17. Filled from the Cityscapes paper, arXiv 1604.01685 read as its v2 PDF (CVPR 2016, with
# its supplement), its abstract page and Crossref's record of the IEEE version (DOI 10.1109/cvpr.2016.350); six
# pages of cityscapes-dataset.com (home, dataset overview, benchmark suite, terms and conditions, registration and
# news; scripts and styles stripped, nothing registered, logged in to or agreed to) and the pixel-level leaderboard
# as the JSON its table loads; the cityscapesScripts README at a pinned commit; the arXiv abstract pages of the
# Cityscapes 3D paper (2006.07864, CVPR 2020 workshop) and of the Cityscapes-Panoptic-Parts report (2004.07944),
# with the panoptic_parts README at a pinned commit; and the abstract page of DGM-Net (arXiv 2604.23399, May 2026),
# a paper reporting a Cityscapes test-set result. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# The entry is the Cityscapes benchmark suite: one dataset, one site and one evaluation server, with four tasks
# (pixel-level, instance-level and panoptic semantic labeling, and 3D vehicle detection) as subsets. The panoptic
# task (2019) and the Cityscapes 3D annotations and task (2020) were added on the same images by the same team and
# are track-set versions. Cityscapes-Panoptic-Parts, part-level labels made by another group on the same images, is
# a fork by 04 S4; other groups' extensions (pedestrian boxes, fog and rain) are recorded in lineage_note only.

id: cityscapes
name: Cityscapes
aliases:
  - Cityscapes Dataset
  - Cityscapes benchmark suite
tagline: Pixel-, instance- and panoptic labeling of street scenes from 50 cities, scored on withheld
  test labels.
description: >
  A dataset and benchmark suite for semantic understanding of urban street scenes, recorded from a car's
  stereo camera in 50 cities, mostly in Germany, in spring, summer and autumn daylight. 5,000 frames carry
  fine polygon annotations of 30 classes (19 of them evaluated), made in-house at over 1.5 hours an image,
  and 20,000 more carry coarse annotations; each annotated frame comes with its 30-frame video snippet,
  the right stereo view, odometry and GPS. The fine frames are split by city into 2,975 training, 500
  validation and 1,525 test images, and the test annotations are withheld. The suite opened in 2016 with
  pixel-level semantic labeling, ranked by class IoU, and instance-level semantic labeling, ranked by
  mask AP over ten overlap thresholds; panoptic segmentation followed in 2019 and 3D vehicle detection
  (Cityscapes 3D, ranked by a detection score combining 2D AP with 3D location, orientation and size measures)
  in 2020. Entrants upload test-set results to the evaluation server, which emails the scores, and results
  are listed on the benchmark tables on request and after approval, under a pseudonym or with a paper.
  The data is free for non-commercial use under the site's own terms, after a registration that the maintainers
  activate by hand.
self_description:
  source: src-arxiv-1604-01685
  quote: we introduce Cityscapes, a benchmark suite and large-scale dataset to train and test
    approaches for pixel-level and instance-level semantic labeling.
external_ids:
  arxiv: '1604.01685'
paper:
  title: The Cityscapes Dataset for Semantic Urban Scene Understanding
  arxiv: '1604.01685'
  doi: 10.1109/cvpr.2016.350
  version_read: v2
  source: src-arxiv-1604-01685-v2
released: 2016-02-20
released_note: The day the site's news dates the dataset's release; the first pixel-level results
  followed on 2016-03-01, the evaluation server opened on 2016-03-27, and the paper's first arXiv
  version is dated 2016-04-06 ("Submitted on 6 Apr 2016 (v1), last revised 7 Apr 2016 (this version,
  v2)", src-arxiv-1604-01685).
released_source: src-cityscapes-news
released_quote: The Cityscapes Dataset is finally released. Please register and, upon approval,
  start downloading the data. Dataset released February 20, 2016
release_venue: CVPR 2016
release_venue_source: src-crossref-10-1109-cvpr-2016-350
release_venue_quote: '"event":{"name":"2016 IEEE Conference on Computer Vision and Pattern Recognition
  (CVPR)"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/segmentation
  secondary:
    - vision/driving-perception-3d
    - vision/detection
  secondary_note: >
    The union of the tasks' own leaves, each also carried by its subset's domain_override. The 3D vehicle
    detection task (2020) is driving-perception-3d, with detection, as KITTI's 3D boards are; the instance-level
    task detects traffic participants as scored masks, so detection is secondary to it. driving-perception-3d
    is where nuScenes sits, and Cityscapes differs from it and from KITTI in what is scored: nuScenes
    ranks 3D boxes in the world frame from a 360-degree camera, lidar and radar rig, and most KITTI boards
    score per-pixel geometry from laser ground truth, while three of the four Cityscapes tasks score per-pixel
    class and instance labels on single images, and its stereo, video and odometry are optional inputs.
domain_basis:
  reason: The headline metric scores per-pixel labels. The paper introduces the suite for
    pixel-level and instance-level semantic labeling, the first task ranks by class IoU over every
    test pixel, and the instance-level and panoptic tasks score per-instance masks and a joint
    labeling of every pixel. Only the 3D vehicle detection task, added in 2020, scores 3D boxes, and
    its table holds 3 entries against 315 on the pixel-level table (read 2026-11-10). The data comes
    from a driving car, but what is scored is the visual signal recovered, never a relation to
    language, so by 02 S11 rule 12 the suite is vision, and its leaf is segmentation.
  source: src-cityscapes-benchmarks
  quote: The first Cityscapes task involves predicting a per-pixel semantic labeling of the image
    without considering higher-level object instance or boundary information.
domain_considered_and_rejected:
  - term: vision/depth-geometry
    reason: The right stereo views ship with every frame and the tables flag methods that use depth,
      but no task scores a depth or disparity map; stereo is an optional input.
    source: src-cityscapes-benchmarks
    quote: we report additional meta information for each method, such as timings or the kind of
      information each algorithm is using, e.g. depth data or multiple video frames
  - term: vision/video-understanding
    reason: Each annotated frame comes with its 30-frame snippet, but only the one annotated frame
      is scored; video is an optional input, not the scored quantity.
    source: src-cityscapes-dataset-overview
    quote: Each annotated image is the 20th image from a 30 frame video snippets (1.8s)
  - term: robotics-embodiment/autonomous-driving-planning
    reason: Nothing drives the car or scores a driving outcome; every task scores what was recovered
      from recorded images.
capability:
  - perception
capability_basis:
  perception:
    reason: Every task scores what is recovered from a street-scene photograph -- a class for each
      pixel, masks of individual traffic participants, a joint panoptic labeling, or 3D vehicle
      boxes -- against withheld human annotations.
    source: src-cityscapes-benchmarks
    quote: we rely on the standard Jaccard Index, commonly known as the PASCAL VOC
      intersection-over-union metric
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: The 3D task estimates location, size and orientation, but it scores the accuracy of the
      recovered geometry, which the term's exclusion test sends to perception.
  - term: distribution-shift-generalization
    reason: The paper tests a Cityscapes-trained model on CamVid and KITTI, and the Robust Vision
      Challenge ranks methods across datasets, but Cityscapes' own splits are balanced across
      cities, seasons and city sizes, and no shifted condition is scored on its own.
    source: src-arxiv-1604-01685-v2
    quote: Note that the data is split at the city level, i.e. a city is completely within a single
      split.

evaluation_method:
  - domain-metric
evaluation_method_note: >
  Every task ranks by a measure of the segmentation and detection field. Pixel-level: IoU (the Jaccard
  index over all test pixels) averaged over the 19 classes, with the category mean and the instance-weighted
  iIoU beside it. Instance-level: region AP averaged over ten overlaps from 0.5 to 0.95 and the class
  set, with AP at 50 % and within 100 m and 50 m. Panoptic: the panoptic segmentation paper's metrics
  (the table's columns are PQ, SQ and RQ, read from the page's script). 3D vehicle detection: the detection
  score DS, 2D AP times the mean of four true-positive measures (BEV centre distance, two orientation
  similarities and size similarity).
evaluation_method_basis:
  reason: IoU and AP are the field's own measures (domain-metric names mAP and IoU), and the iIoU
    variant is Cityscapes' instance-weighted IoU.
  source: src-cityscapes-benchmarks
  quote: we additionally evaluate the semantic labeling using an instance-level
    intersection-over-union metric
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The 3D task's DS multiplies 2D AP by the mean of four true-positive measures, but every
      constituent is a detection measure of the same field (one method), which the term's exclusion
      test excludes; the other tasks average one metric over classes or thresholds.
    source: src-cityscapes-benchmarks
    quote: For each label class a detection score (DS) is calculated as DS = AP x (BEV + OS_Yaw +
      OS_PitchRoll + SizeSim) / 4.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The paper's own baselines are fully convolutional networks trained on its training split,
    third-party groups optimised their published methods on it, and the board is led by networks
    trained on the fine and coarse annotations and scored as trained.
  source: src-arxiv-1604-01685-v2
  quote: we asked selected groups that have proposed state-of-the-art semantic labeling approaches
    to optimize their methods on our dataset and evaluated their predictions on our test set
designed_for_subjects_considered_and_rejected:
  - term: base-model
    reason: Recent entries may start from large pretrained encoders, but a segmentation head is
      trained on the Cityscapes labels and the result is scored as trained, not prompted.
as_used:
  - protocol: Papers report the pixel-level task's IoU class as mIoU, on the 500 validation images
      scored locally with the released scripts or on the test set through the server, and some
      report both.
    split: val (local) or test (server)
    source: src-arxiv-2604-23399
    quote: DGM-Net achieves 80.8% mIoU within 28k iterations, 82.3% mIoU on Cityscapes test set, and
      45.24% mIoU on ADE20K.
    note: DGM-Net (arXiv 2604.23399, v2 May 2026) gives a test-set figure beside one without a
      split; the scripts score the validation set with the same code as the server ("This tool is
      also used to evaluate the results on the test set", src-github-cityscapesscripts-readme). Only
      this one paper was read for the pattern, and no DGM-Net row was found on the pixel-level
      table.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the server. A May 2026 paper reports a new test-set
    result, and the pixel-level table holds rows with submission IDs up to 20,146 (20,323 on the
    instance-level table), though no row is dated.
  source: src-arxiv-2604-23399
  quote: DGM-Net achieves 80.8% mIoU within 28k iterations, 82.3% mIoU on Cityscapes test set, and
    45.24% mIoU on ADE20K.
activity: accepting-submissions
activity_note: The benchmark has never run in rounds; the Robust Vision Challenges of 2018 and 2020
  used it as one of several datasets and are events. The table rows carry no submission dates, so no
  newest submission is recorded.
activity_basis:
  reason: The benchmark page invites submissions to the evaluation server all year, a 2026 paper
    reports a test-set result, and no source says the server has closed.
  source: src-cityscapes-benchmarks
  quote: If you would like to submit your results, please register, login, and follow the
    instructions on our submission page.
events:
  - name: Robust Vision Challenge 2018, at a CVPR 2018 workshop, which included Cityscapes
    kind: challenge
    source: src-cityscapes-news
    quote: The Cityscapes dataset is used by the Robust Vision Challenge 2018 Workshop at CVPR 2018
      in Salt Lake City. Robust Vision Challenge February 17, 2018
  - name: Robust Vision Challenge 2020, which included Cityscapes again
    kind: challenge
    source: src-cityscapes-news
    quote: The Cityscapes dataset is again part of the Robust Vision Challenge.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GEELY-ATC-SEG, first on the pixel-level table at 86.7 IoU class (unpublished, trained on
      fine and coarse labels)
    source: src-cityscapes-leaderboard-pixellevel
    observed_on: 2026-11-10
    quote: '"iouclass":86.7,"iiouclass":73.9,"ioucategory":93.3,"iioucategory":85.4,"submissionID":18385'
  - system: DGM-Net
    source: src-arxiv-2604-23399
    observed_on: 2026-11-10
    quote: DGM-Net achieves 80.8% mIoU within 28k iterations, 82.3% mIoU on Cityscapes test set, and
      45.24% mIoU on ADE20K.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Fine polygon annotations of the 1,525 test images, drawn in-house, and,
  for the 3D task, 3D vehicle boxes labelled from the stereo images, held by the maintainers; the
  test split ships only the ego-vehicle and rectification-border masks.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The released scripts are the server's evaluation code, so the validation split can be
    scored locally, and any registered and activated user can upload test results. Registration is
    limited to people affiliated with a scientific body and activated by hand (see
    data.access_note).
  source: src-github-cityscapesscripts-readme
  quote: '`csEvalPixelLevelSemanticLabeling`: Evaluate pixel-level semantic labeling results on the validation
    set. This tool is also used to evaluate the results on the test set.'
task:
  exists: true
  input:
    - one 8-bit left image of an inner-city street scene from the 1,525 test images, optionally with
      its right stereo view, the 16-bit HDR image, the surrounding 30-frame video snippet, GPS and
      vehicle odometry
  output: A class label for every pixel (19 evaluated classes; the other annotated classes are
    void).
  scoring: IoU class, TP / (TP + FP + FN) per class counted over the whole test set and averaged
    over the 19 classes, through the evaluation server, with iIoU class and the category-level IoU
    and iIoU beside it; void pixels do not count. Other tasks score their own outputs (see subsets).
  metric_range:
    - 0.0
    - 100.0
  source: src-cityscapes-benchmarks
  quote: 'we report two separate mean performance scores: IoUcategory and IoUclass'

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The training and validation images and annotations and the test images are released;
    the test annotations are not. Everything downloads behind a cityscapes-dataset.com account,
    which the maintainers activate by hand for people affiliated with a body that pursues scientific
    interests, asking for a work or university address, and they need not activate it ("There is no
    obligation on the part of MPII to activate the account", src-cityscapes-license). Under
    ADR-0020's access precedence the withheld test annotations decide, and gated-registration is the
    near miss.
  access_basis:
    reason: The fine annotations are public for the training and validation splits and withheld for
      the test split, which is scored only by the server.
    source: src-arxiv-1604-01685-v2
    quote: 2975 training and 500 validation images with publicly available annotations, as well as
      1525 test images with annotations withheld for benchmarking purposes
  refresh: versioned-releases
  refresh_basis:
    reason: The images, splits and fine annotations have stood since 2016. Tasks and annotations
      were added in dated steps -- panoptic segmentation (2019-05-12), the Cityscapes 3D annotations
      (2020-08-30) and their benchmark (2020-10-17) -- so a claim can name the task set it was
      measured on.
    source: src-cityscapes-news
    quote: Our evaluation server and benchmark tables have been updated to support the new panoptic
      challenge.
  data_provenance:
    - real-world-instrument
    - crowd-authored
  data_provenance_note: The images, stereo views, odometry and GPS are recordings from one car's
    automotive stereo camera and sensors; 5,000 frames were chosen by hand from 27 cities for fine
    annotation. The labels were drawn in-house ("were realized in-house to guarantee highest quality
    levels", same Source); no source describes the annotators as specialists, so crowd-authored is
    read under its in-house-annotator clause, as for KITTI.
  data_provenance_source: src-arxiv-1604-01685-v2
  data_provenance_quote: Images were recorded with an automotive-grade 22 cm baseline stereo camera
  contamination_risk: medium
  contamination_risk_note: The test annotations are withheld, but the test images are released with
    their video snippets, and entries now start from encoders pretrained on large external image
    collections; the table shows many unpublished entries, whose training data is stated only as
    flags for fine and coarse labels, 16-bit images, depth and video. No source assesses
    contamination.
  contamination_risk_source: src-github-cityscapesscripts-readme
  contamination_risk_quote: Once you want to test your method on the test set, please run your
    approach on the provided test images and submit your results
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: IoU, AP, PQ and DS are bounded at 100 %. The paper's control experiments
    are near misses for measured-ceiling. Ground truth downsampled by 2 scores 97.2 % IoU class, an
    upper bound only at that output resolution, and two annotators agreed on 96 % of the pixels of
    30 doubly annotated images (98 % without void), a pixel agreement, not an IoU.
  ceiling_anchor_type_source: src-arxiv-1604-01685-v2
  ceiling_anchor_type_quote: This yields an upper bound on the performance at a
  dataset_licence: Cityscapes Terms and Conditions and licence agreement (non-commercial use only;
    no redistribution of the data or of modified versions)
  dataset_licence_note: The licence agreement is with Daimler AG, MPI Informatics and TU Darmstadt;
    the terms of use govern the portal, which MPI Informatics operates, and limit use to the
    research purposes they name. Derivative works may be shared only as abstract representations,
    such as trained models or annotations that do not include the data. The terms warn that the
    images may contain personal data of road users, and the scripts' README lists a set with faces
    and licence plates blurred.
  dataset_licence_source: src-cityscapes-license
  dataset_licence_quote: That you may not use the dataset or any derivative work for commercial
    purposes
  size:
    - count: 1525
      unit: test images with withheld fine annotations, with 2,975 training and 500 validation
        images
      subset: the fine split, shared by every task
      source: src-arxiv-1604-01685-v2
      quote: 2975 training and 500 validation images with publicly available annotations, as well as
        1525 test images with annotations withheld for benchmarking purposes
    - count: 5000
      unit: images with fine annotations, with 20,000 coarsely annotated images from 50 cities
      subset: Cityscapes (2016)
      note: The scripts' README gives the coarse-only training set as 19,998 images (train_extra).
      source: src-cityscapes-home
      quote: 5 000 images with high quality annotations · 20 000 images with coarse annotations · 50
        different cities
    - count: 19
      unit: classes evaluated, of the 30 annotated
      subset: pixel-level semantic labeling
      source: src-arxiv-1604-01685-v2
      quote: Classes that are too rare are excluded from our benchmark, leaving 19 classes for
        evaluation
    - count: 6
      unit: vehicle classes evaluated (car, truck, bus, train, motorcycle, bicycle)
      subset: 3D vehicle detection
      source: src-cityscapes-benchmarks
      quote: Objects of class car, truck, bus, train, motorcycle, and bicycle are evaluated.
  submission_limit: null
  submission_limit_note: No public page read states a cap. The submission page and its instructions
    are behind the login and were not read; 02-taxonomy's submission_limit note says the Cityscapes
    server caps submissions per period, which is not confirmed here.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Daimler AG, MPI Informatics and TU Darmstadt (the Cityscapes team); MPI Informatics
    operates the portal and its evaluation server
  maintainer_basis:
    reason: The licence agreement names the three as the parties who provide the dataset and reserve
      its rights, and the terms of use name the Max Planck Society's informatics section (MPII) as
      the portal's operator, which runs the benchmark test and approves published results.
    source: src-cityscapes-license
    quote: we (Daimler AG, MPI Informatics, TU Darmstadt) do not accept any responsibility for
      errors or omissions
  maintainer_type: academic-lab
  maintainer_type_note: MPI Informatics, which operates the portal and server, is a research
    institute of the Max Planck Society rather than a university group, and Daimler AG, a company,
    co-holds the dataset. The scripts repository sits in a personal account named after a
    maintainer. academic-lab is read for the portal operator and the two research institutions; see
    review_checks.
  submission_process:
    - held-out-server
  submission_process_note: Registered users upload test-set results through the site's submission
    page (behind the login, not read); the server scores them and emails the result. A result is
    published on the benchmark tables only at the user's request and after MPII approves it, under a
    pseudonym or with a description and paper, and unpublished entries are ranked beside published
    ones, so no paper is required (publication-gated is not tagged).
  submission_process_source: src-cityscapes-license
  submission_process_quote: MPII provides a so-called benchmark test on the website that evaluates
    the uploaded research results.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-cityscapes-leaderboard-pixellevel
      quote: on a pre-release version of the dataset","fine":"yes","coarse":"no"
    - flag: single-evaluator-private-test-set
      source: src-github-cityscapesscripts-readme
      quote: '`test` used for testing on our evaluation server. The annotations are not public'
  independence_flags_note: The pixel-level table ranks an FCN 8s row trained "on a pre-release
    version of the dataset", whose scores (65.3 / 41.7 / 85.7 / 70.1) are those of the paper's own
    FCN-8s baseline ("Our own baseline experiments (Tab. 4, top) rely on fully convolutional
    networks (FCNs)", src-arxiv-1604-01685-v2). The maintainers hold the test annotations and their
    server scores every entry, and MPII approves what is published. Daimler AG co-holds the dataset;
    no row read was checked for Daimler entries. The paper acknowledges support from the German
    federal ministry for economic affairs (BMWi) through the UR:BAN initiative and from a European
    Research Council grant; neither is shown in the sources read as an evaluated party.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The ranked scores are test-set results, which only the maintainers' server can produce
      because they hold the test annotations; validation scores can be computed by anyone with the
      scripts.
    source: src-github-cityscapesscripts-readme
    quote: '`test` used for testing on our evaluation server. The annotations are not public'
  reproducibility_blockers:
    - private-test-set
  reproducibility_blockers_note: The data needs an account that is activated by hand for scientific
    users only, under non-commercial terms that forbid redistribution. That slows reproduction for
    research without forbidding it, so licence-restriction is not tagged (see review_checks).
  harness_availability: official-harness
  harness: cityscapesScripts (python -m pip install cityscapesscripts), with
    csEvalPixelLevelSemanticLabeling, csEvalInstanceLevelSemanticLabeling,
    csEvalPanopticSemanticLabeling and csEvalObjectDetection3d
  harness_source: src-github-cityscapesscripts-readme
  harness_quote: '`csEvalPixelLevelSemanticLabeling`: Evaluate pixel-level semantic labeling results on
    the validation set. This tool is also used to evaluate the results on the test set.'
  submission_channel:
    source: src-cityscapes-benchmarks
    quote: We offer a benchmark suite together with an evaluation server, such that authors can
      upload their results and get a ranking regarding the different tasks (pixel-level,
      instance-level, and panoptic semantic labeling as well as 3d vehicle detection).
  submission_channel_note: The site's own server (cityscapes-dataset.com/submit, behind the login);
    it has run since 2016-03-27 ("Evaluation Server Online March 27, 2016", src-cityscapes-news).
  code_licence: MIT
  code_licence_note: The scripts' README; GitHub's licence metadata for the repository also reports
    MIT. The LICENSE file was not read.
  code_licence_source: src-github-cityscapesscripts-readme
  code_licence_quote: The Cityscapes Scripts are released under MIT license
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which task, which split (the server's test set, or the validation images
  # scored locally), and what the method used beyond the fine training labels and 8-bit images (the coarse
  # labels, 16-bit images, depth or video frames), which the tables record per row as flags.
  material_extra:
    - subset_used
    - training_data_policy
aggregation_policy: none-by-design
aggregation_policy_note: Each task ranks on its own metric in its own table, and no ranking spans
  the tasks.

secondary_axes:
  - latency
secondary_axes_basis:
  reason: The tables list each method's runtime and the inputs it used beside its scores.
  source: src-cityscapes-benchmarks
  quote: we report additional meta information for each method, such as timings or the kind of
    information each algorithm is using, e.g. depth data or multiple video frames

homepage: https://www.cityscapes-dataset.com/
repository: https://github.com/mcordts/cityscapesScripts
leaderboard_url: https://www.cityscapes-dataset.com/benchmarks/

versions:
  - version: '2016'
    label: Cityscapes 2016, pixel-level and instance-level semantic labeling
    version_kind: revision
    released: 2016-02-20
    items: 1525
    changes: The dataset (5,000 fine and 20,000 coarse images) released on 2016-02-20, the first
      pixel-level results on 2016-03-01 and the evaluation server on 2016-03-27, with the CVPR 2016
      paper defining both tasks and their metrics.
    breaking: true
    frozen: true
    sources:
      - src-cityscapes-news
      - src-arxiv-1604-01685-v2
  - version: panoptic-2019
    label: Panoptic segmentation task
    version_kind: track-set
    released: 2019-05-12
    changes: The third task, panoptic segmentation, on the same images and annotations, with ground
      truth conversion and evaluation in the scripts.
    breaking: false
    frozen: true
    sources:
      - src-cityscapes-news
      - src-cityscapes-benchmarks
  - version: 3d-2020
    label: Cityscapes 3D, 3D vehicle detection task
    version_kind: track-set
    released: 2020-10-17
    changes: 3D bounding boxes with nine degrees of freedom for every vehicle, labelled from the
      stereo images and released on 2020-08-30 (CVPR 2020 workshop paper), then the fourth task, 3D
      vehicle detection ranked by DS, on the server on 2020-10-17.
    breaking: false
    frozen: true
    sources:
      - src-cityscapes-news
      - src-cityscapes-home
      - src-arxiv-2006-07864
versions_note: No source read records a change to the 2016 images, splits or test annotations. The
  scripts' README lists annotation types added beside the benchmark, among them validated 2D boxes
  for the eight instance classes, which it cites to a NeurIPS 2026 paper; no task or table scores
  them, so they are not a version.

subsets:
  - id: cityscapes#pixel-level
    label: Pixel-level semantic labeling
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-cityscapes-benchmarks
        quote: The first Cityscapes task involves predicting a per-pixel semantic labeling of the
          image without considering higher-level object instance or boundary information.
      - source: src-arxiv-1604-01685-v2
        quote: the performance ranking in terms of the main IoUclass score on Cityscapes is highly
          different from PASCAL VOC
    notes: The headline task (see task). IoU class over the 19 classes is the main score, with iIoU
      class and the category scores beside it; 315 rows on 2026-11-10.
  - id: cityscapes#instance-level
    label: Instance-level semantic labeling
    domain_override:
      primary: vision/segmentation
      secondary:
        - vision/detection
    evidence:
      - source: src-cityscapes-benchmarks
        quote: algorithms are required to deliver a set of detections of traffic participants in the
          scene, each associated with a confidence score and a per-instance segmentation mask
      - source: src-cityscapes-benchmarks
        quote: we report the mean average precision AP, obtained by also averaging over the class
          label set
    notes: Scored masks of the human and vehicle classes, ranked by region AP over overlaps 0.5 to
      0.95 and the classes, with AP 50 %, AP 100 m and AP 50 m beside it; 79 rows on 2026-11-10.
  - id: cityscapes#panoptic
    label: Panoptic semantic labeling
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-cityscapes-benchmarks
        quote: The third Cityscapes task was added in 2019 and combines both, pixel-level and
          instance-level semantic labeling, in a single task called
    notes: Added on 2019-05-12. A class for every pixel and an instance ID for every pixel of a
      countable class, scored by the panoptic segmentation paper's metrics (PQ, SQ and RQ, from the
      page's table script); 26 rows on 2026-11-10.
  - id: cityscapes#3d-vehicle-detection
    label: 3D vehicle detection (Cityscapes 3D)
    domain_override:
      primary: vision/driving-perception-3d
      secondary:
        - vision/detection
    evidence:
      - source: src-cityscapes-benchmarks
        quote: The fourth Cityscapes task was added in 2020 and focuses on 3D Object Detection for
          vehicles to estimate their 3D parameters like orientation and location.
      - source: src-cityscapes-benchmarks
        quote: For each label class a detection score (DS) is calculated as DS = AP x (BEV + OS_Yaw
          + OS_PitchRoll + SizeSim) / 4.
      - source: src-arxiv-2006-07864
        quote: our 3D annotations were labeled using stereo RGB images only and capture all nine
          degrees of freedom
    notes: An amodal 2D box and a 9-degree-of-freedom 3D box for each car, truck, bus, train,
      motorcycle and bicycle up to 100 m, ranked by DS averaged over the six classes. Added on
      2020-10-17 with the Cityscapes 3D paper (CVPR 2020 workshop); 3 rows on 2026-11-10.

lineage:
  role: root
  forks:
    - id: cityscapes-panoptic-parts
      maintainer: Eindhoven University of Technology (the panoptic_parts authors)
      source: src-github-panoptic-parts-readme
      quote: institution = {Eindhoven University of Technology}
lineage_note: Cityscapes-Panoptic-Parts (technical report arXiv 2004.07944, April 2020) adds
  part-level labels for selected classes to panoptic labels of the Cityscapes images ("Both datasets
  have annotations compatible with panoptic segmentation and additionally they have part-level
  labels for selected semantic classes", src-arxiv-2004-07944), with its own metric (PartPQ), code
  and repository at Eindhoven, so by 04 S4 it is a separate benchmark linked as a fork, although its
  labels download from the Cityscapes site ("[Cityscapes Panoptic
  Parts](https://www.cityscapes-dataset.com/login/)", src-github-panoptic-parts-readme) and no
  Cityscapes table scores it. The id cityscapes-panoptic-parts is a proposal; no entry or allocation
  exists for it. Cityscapes 3D is not a separate benchmark -- the same team added it to the same
  images, server and scripts -- and is the 3d-2020 version and its subset. The overview page lists
  other researchers' extensions ("Extensions by other researchers Bounding box annotations of people
  Images augmented with fog and rain", src-cityscapes-dataset-overview), and the scripts carry the
  pedestrian boxes (gtBboxCityPersons); those were not read and get no id.


      field: domain
      source: src-arxiv-1604-01685-v2
      quote: we introduce Cityscapes, a benchmark suite and large-scale dataset to train and test
        approaches for pixel-level and instance-level semantic labeling
    - check: Identity. Cityscapes 3D has its own paper (CVPR 2020 workshop) and could be argued a
        same-maintainer variant, but it adds annotations and one task on the same images, server and
        scripts, so it is a track-set version with a subset. The paper's author list (not quoted)
        overlaps the Cityscapes team's; a reviewer should confirm from the paper.
      field: versions
      source: src-arxiv-2006-07864
      quote: we complement the Cityscapes benchmark suite with 3D vehicle detection based on the new
        annotations as well as metrics presented in this work
    - check: Cityscapes-Panoptic-Parts is linked as a fork by Eindhoven University of Technology
        with the proposed id cityscapes-panoptic-parts. Its labels are distributed from the
        Cityscapes download area, which could mean the Cityscapes team co-maintains it (then a
        variant); no source read says so. Its repository now sits in a personal account.
      field: lineage
      source: src-github-panoptic-parts-readme

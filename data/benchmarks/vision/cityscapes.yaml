  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, with its abstract page for the dates and Crossref's
    record for the IEEE DOI and venue. cityscapes-dataset.com is a server-rendered WordPress site; its
    robots.txt disallows only the admin path. Its result tables load by script from /benchmark-table/?challengeID=<task>,
    and the pixel-level JSON is a Source; the instance-level, panoptic and 3D tables were read for their
    row counts and leaders but are not Sources. The benchmark, terms, news and leaderboard pages, and
    both READMEs, are withheld from archiving because they name people (reference lists, a prescribed
    citation, post bylines, author columns, contact lines). Nothing was registered, logged in to or agreed

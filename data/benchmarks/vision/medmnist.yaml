lineage:
  role: root
  forks:
    - id: medmnist-c
      maintainer: The MedMNIST-C authors (arXiv 2406.17536; ADSMI workshop at MICCAI 2024)
      source: src-arxiv-2406-17536
      quote: we create and open-source MedMNIST-C, a benchmark dataset based on the MedMNIST+
        collection covering 12 datasets and 9 imaging modalities
lineage_note: MedMNIST-C adds modality-specific corruptions of graded severity to the 12 2D datasets
  to score robustness, and the README highlights it as a third-party contribution; a 2026 paper
  reports on it beside MedMNIST (src-arxiv-2610-33520). The Tensor Reloaded Multi-Task MedMNIST
  competition (as_used) is a third party's event with its own metric; its page was not read, so it
  is not recorded as a fork. MedMNIST+ is a release of the same samples and splits, recorded as
  version v3.0 rather than a variant.


# data/benchmarks/vision/medmnist.yaml
#
# P1-S8-T07, vision entry 18. Filled from the MedMNIST v2 paper, read as its version of record in Scientific Data
# (DOI 10.1038/s41597-022-01721-8, January 2023; the HTML article, whose tables are pages robots.txt disallows),
# with the v2 preprint's PDF for those tables and its abstract page (arXiv 2110.14795), and v1's abstract page
# (arXiv 2010.14925, ISBI 2021); the MedMNIST repository's README and its note on MedMNIST+, each pinned at a
# commit; Zenodo's JSON record of the v3.0 release (DOI 10.5281/zenodo.10519652) and its list of versions; the data
# file that medmnist.com renders its dataset tables from; and three arXiv abstract pages by other authors:
# MedMNIST-C (arXiv 2406.17536), a multi-task competition entry (arXiv 2609.06838, September 2026) and LiteMed-ViT
# (arXiv 2610.33520, October 2026). No dataset file was downloaded. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# The entry is the MedMNIST collection with its standard splits and its AUC and ACC evaluation, v1 (10 2D datasets)
# and v2 (12 2D and 6 3D) as editions and the Zenodo releases since as revisions; v3.0, MedMNIST+, adds 64, 128 and
# 224 pixel copies of the same samples and splits. The 18 datasets are subsets under MedMNIST2D and MedMNIST3D, the
# two groups the paper averages over. It is the vision family's boundary case with medicine-health: many of the
# labels are clinical (diagnoses, disease grades, malignancy) and come from the source datasets, but MedMNIST claims
# a machine-learning benchmark that needs no medical background and says it is not for clinical use, so the claim
# test puts it in vision/medical-imaging-cv with medical-imaging-diagnostic secondary (review_checks).

id: medmnist
name: MedMNIST
aliases:
  - MedMNIST v2
  - MedMNIST Classification Decathlon
  - MedMNIST+
  - MedMNIST2D
  - MedMNIST3D
tagline: 18 standardised 2D and 3D biomedical image classification datasets at MNIST-like sizes,
  scored by AUC and accuracy.
description: >
  A collection of biomedical image classification datasets from Shanghai Jiao Tong University and collaborators,
  built so that machine-learning methods can be compared across many small, standardised tasks without
  medical background knowledge. Version 2 holds 12 2D datasets (MedMNIST2D) and 6 3D datasets (MedMNIST3D),
  each pre-processed from a published source dataset, or in two cases new data, into 28 x 28 images or
  28 x 28 x 28 volumes with a fixed train / validation / test split: pathology patches, chest X-rays,
  dermatoscopy, retinal OCT and fundus images, breast ultrasound, blood and kidney cell microscopy, abdominal
  and chest CT, vessel and adrenal shapes and electron microscopy, with binary, multi-class, multi-label
  and ordinal tasks from 780 to 236,386 samples. A classifier is trained on each dataset's training split
  and scored on its test split by AUC and accuracy, and methods are compared on those metrics averaged
  over the 2D and over the 3D datasets. The release baselines are ResNets and three AutoML tools. Version
  1 (ISBI 2021) had 10 2D datasets; MedMNIST+ (January 2024) adds 64, 128 and 224 pixel copies of the
  2D images and 64-voxel copies of the 3D ones, with the same samples and splits. The data is on Zenodo
  under CC BY 4.0, except DermaMNIST under CC BY-NC 4.0, and the maintainers say it is not intended for
  clinical use. There is no leaderboard; results appear in their authors' papers.
self_description:
  source: src-nature-s41597-022-01721-8
  quote: We introduce MedMNIST v2, a large-scale MNIST-like dataset collection of standardized
    biomedical images, including 12 datasets for 2D and 6 datasets for 3D.
external_ids:
  arxiv: '2110.14795'
paper:
  title: MedMNIST v2 - A large-scale lightweight benchmark for 2D and 3D biomedical image
    classification
  arxiv: '2110.14795'
  doi: 10.1038/s41597-022-01721-8
  source: src-nature-s41597-022-01721-8
released: 2020-10-28
released_note: The first version's arXiv submission (v1 of arXiv 2010.14925), the earliest public
  date in the sources read; that paper appeared at ISBI 2021. MedMNIST v2 was first posted on
  2021-10-27 (src-arxiv-2110-14795), its Zenodo v2.0 record is dated 2021-08-16 (versions), and the
  journal article was published on 2023-01-19.
released_source: src-arxiv-2010-14925
released_quote: '[Submitted on 28 Oct 2020 (v1), last revised 20 May 2021 (this version, v4)]'
release_venue: ISBI 2021 (v1); Scientific Data 10, 41 (2023) (v2)
release_venue_source: src-arxiv-2010-14925
release_venue_quote: 'Comments: ISBI 2021.'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/medical-imaging-cv
  secondary:
    - vision/classification
    - medicine-health/medical-imaging-diagnostic
domain_basis:
  reason: The benchmark's own claim is a machine-learning one. Its authors built it as a VDD-like
    decathlon that isolates the learning algorithm from the end-to-end pipeline, standardised so
    that no background knowledge is needed, and they disclaim clinical use. That is
    medical-imaging-cv's inclusion test (a vision method, medical images as the test domain, no
    clinical task claimed). Both leaves say the claim decides and the metric does not. The exclusion
    test (clinically defined targets against a clinician reference standard) is met by some
    datasets' labels taken over from their sources, such as DermaMNIST's diagnoses, RetinaMNIST's
    retinopathy grades and NoduleMNIST3D's malignancy levels. It is not met by others. TissueMNIST
    and BloodMNIST are bioimage cell types, SynapseMNIST3D is rat neurons, OrganMNIST's labels are
    organs, and ChestMNIST's disease labels were text-mined from reports. MedMNIST also downsamples
    to 28 pixels, merges classes and scores no result against a clinical reference of its own, so
    medical-imaging-diagnostic is secondary, for the datasets whose labels are diagnoses or findings
    (review_checks). vision/classification names the operation, every task assigning a whole image
    or volume to classes, and is secondary to the more specific medical-imaging-cv.
  source: src-nature-s41597-022-01721-8
  quote: Therefore, a large but simple dataset focusing on the machine learning part like VDD,
    rather than the end-to-end system like MSD, will serve as a better benchmark to evaluate the
    generalization performance of the machine learning algorithms on the medical image analysis
    tasks.
domain_considered_and_rejected:
  - term: medicine-health/medical-imaging-segmentation
    reason: NoduleMNIST3D's source supports segmentation, and AdrenalMNIST3D and VesselMNIST3D are
      built from shape masks, but every MedMNIST task is a classification of the whole image or
      volume; nothing is scored as a mask.
    source: src-nature-s41597-022-01721-8
    quote: The AdrenalMNIST3D is a new 3D shape classification dataset
capability:
  - perception
capability_basis:
  perception:
    reason: The input is a small medical or biological image or volume and the score measures
      whether the class recovered from it matches the label.
    source: src-nature-s41597-022-01721-8
    quote: so that no background knowledge is required for users
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: PathMNIST's test patches come from a different clinical centre than its training
      patches, but that is one dataset's split, not a shifted condition scored apart from an
      in-distribution one; every other dataset uses its source's split or a random 7:1:2 split.
      MedMNIST-C, the corrupted derivative by other authors, scores that shift (lineage).
    source: src-nature-s41597-022-01721-8
    quote: and a test dataset (CRC-VAL-HE-7K) of 7,180 image patches from a different clinical
      center
  - term: sample-efficiency
    reason: Dataset sizes range from hundreds to hundreds of thousands of samples, and small
      datasets are part of the design, but no fixed sample budget is set and scored.
    source: src-nature-s41597-022-01721-8
    quote: Data users are also encouraged to analyze the average performance over the 12 2D datasets
      and 6 3D datasets to benchmark their methods.

evaluation_method:
  - classification-metric
  - exact-match
evaluation_method_basis:
  reason: Both metrics are reported for every dataset and averaged. AUC is a statistic of the score
    ranking against the labels, which is classification-metric. ACC is the share of test images
    whose predicted label equals the ground truth, a mean of per-item verdicts, which the
    exact-match test keeps for accuracy against a fixed label set. Neither is named the headline.
  source: src-nature-s41597-022-01721-8
  quote: Area under ROC curve (AUC)44 and Accuracy (ACC) are used as the evaluation metrics.
evaluation_method_considered_and_rejected:
  - term: ordinal-grading
    reason: RetinaMNIST is an ordinal-regression task (five retinopathy grades), but the result is
      still a number, AUC or ACC, not a band.
    source: src-nature-s41597-022-01721-8
    quote: The task is ordinal regression for 5-level grading of diabetic retinopathy severity.
  - term: domain-metric
    reason: AUC and accuracy have the same formula in every field; no medical statistic is used.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants are classifiers trained on each dataset's training split and scored as trained,
    and AutoML tools refitted on each dataset, which the term's inclusion test places here. The
    release baselines are ResNet-18 and ResNet-50 (2D, and 2.5D, 3D and ACS convolutions in 3D),
    auto-sklearn, AutoKeras and Google AutoML Vision.
  source: src-nature-s41597-022-01721-8
  quote: We benchmark several standard deep learning methods and AutoML tools with MedMNIST v2 on
    both 2D and 3D datasets
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: The tasks come from medicine and biology, but the benchmark is built so that general
      methods can be compared without domain knowledge, and its baselines are general architectures
      and AutoML tools. The README suggests MedMNIST+ as a resource for medical foundation models,
      which no source read scores.
    source: src-github-medmnist-readme
    quote: As a complement to the previous 28-size MedMNIST, the large-size version could serve as a
      standardized benchmark for medical foundation models.
  - term: classical-algorithm
    reason: auto-sklearn searches scikit-learn's models, which are fitted to each dataset, so no
      baseline is non-learned.
as_used:
  - protocol: One shared backbone with a linear head per dataset, trained on 11 MedMNIST datasets
      together and scored by the harmonic mean of per-task macro-F1 on a competition leaderboard,
      not the paper's per-dataset AUC and ACC or their averages.
    source: src-arxiv-2609-06838
    quote: We study 11 heterogeneous MedMNIST datasets using the harmonic mean of per-task macro-F1.
    note: The Tensor Reloaded Multi-Task MedMNIST competition (2026) is run by others; its page and
      rules were not read. The authors report that the image resolution of the competition's
      evaluation environment differed from the MedMNIST API's ("We identify a resolution domain
      shift between the MedMNIST API and evaluation environment.").
  - protocol: Accuracy and balanced accuracy on three of the 2D datasets (BloodMNIST, PathMNIST,
      DermaMNIST), at several input resolutions up to 224 pixels, the MedMNIST+ sizes, and again
      under MedMNIST-C corruptions.
    source: src-arxiv-2610-33520
    quote: does not benefit from higher input resolutions up to 224 pixels, where ResNet18 gains
      12.6 points
    note: LiteMed-ViT (October 2026), read as its abstract. Which splits and sizes each figure uses
      is in the PDF, which was not read.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the datasets; a paper submitted on 2026-10-24 reports
    accuracy on BloodMNIST and PathMNIST, and one from September 2026 on 11 datasets in a
    competition.
  source: src-arxiv-2610-33520
  quote: Evaluated against three compact CNN baselines on three MedMNIST subsets of varying modality
    and class balance, LiteMed-ViT attains higher accuracy than all three baselines on BloodMNIST
    (95.05%) and two on PathMNIST (89.15%).
activity: no-submission-channel
activity_basis:
  reason: The maintainers publish the data, an evaluation script and their own baseline tables, and
    no leaderboard, server or submission route; users score their own runs and report them in their
    papers. The multi-task competition in as_used is a third party's.
  source: src-nature-s41597-022-01721-8
  quote: The data API and evaluation script in Python is available at
    https://github.com/MedMNIST/MedMNIST.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Google AutoML Vision (Edge models)
    source: src-nature-s41597-022-01721-8
    observed_on: 2026-11-10
    quote: For MedMNIST2D, Google AutoML Vision outperforms all the other methods in average AUC,
      however, it is very close to the performance of baseline ResNets.
    note: A release baseline; the paper ran the service in July 2021 ("experimented in July, 2021").
  - system: ResNet-50 with 3D convolutions
    source: src-nature-s41597-022-01721-8
    observed_on: 2026-11-10
    quote: Surprisingly, the ResNet-50 with standard 3D convolution outperforms all the other
      methods on average.
  - system: LiteMed-ViT
    source: src-arxiv-2610-33520
    observed_on: 2026-11-10
    quote: Evaluated against three compact CNN baselines on three MedMNIST subsets of varying
      modality and class balance, LiteMed-ViT attains higher accuracy than all three baselines on
      BloodMNIST (95.05%) and two on PathMNIST (89.15%).
    note: A 0.234M-parameter vision transformer distilled from a ResNet-18 teacher.
  - system: ConvNeXt-Tiny shared backbone with label smoothing
    source: src-arxiv-2609-06838
    observed_on: 2026-11-10
    quote: Our best configuration, a ConvNeXt-Tiny backbone with label smoothing
    note: Harmonic-mean macro-F1 0.73294 over 11 datasets, sixth in the Tensor Reloaded competition
      (as_used).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The labels are, in most datasets, the source dataset's own, sometimes
  merged or reduced (BreastMNIST's three classes to two, FractureMNIST3D's four to three,
  NoduleMNIST3D's five malignancy levels to two with level 3 dropped). ChestMNIST's 14 disease
  labels were text-mined by its source. AdrenalMNIST3D was labelled by an expert endocrinologist and
  SynapseMNIST3D by three neuroscience experts for this release. Test labels are released with the
  data.
ground_truth_source_basis:
  reason: The labels are taken from the sources except where a task was simplified for the small
    images.
  source: src-nature-s41597-022-01721-8
  quote: The MedMNIST uses the classification labels from the source datasets directly in most
    cases, but the labels could be simplified (merged or deleted classes) if the classification
    tasks on the small images are too difficult.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can download every dataset with its test labels from Zenodo, train on the official
    split and score with the maintainers' evaluator; no step needs the maintainers.
  source: src-github-medmnist-readme
  quote: 'Each subset (e.g., `pathmnist.npz`) is comprised of 6 keys: `train_images`, `train_labels`,
    `val_images`, `val_labels`, `test_images` and `test_labels`.'
task:
  exists: true
  input:
    - a 28 x 28 grey or RGB image (MedMNIST2D) or a 28 x 28 x 28 volume (MedMNIST3D); in MedMNIST+
      also 64, 128 or 224 pixels (2D) or 64 voxels (3D)
  output: Class scores and a predicted label for the dataset's task (binary, multi-class, ordinal,
    or 14 binary labels for ChestMNIST).
  scoring: AUC and accuracy on each dataset's official test split, and their means over the 12 2D
    datasets and over the 6 3D datasets. The paper reports the mean of at least three runs per
    method.
  metric_range:
    - 0
    - 1
  metric_range_note: Both AUC and accuracy run from 0 to 1, as the paper's tables print them.
  source: src-nature-s41597-022-01721-8
  quote: Thereby, we report average AUC and ACC score over MedMNIST2D and MedMNIST3D respectively to
    easily compare the performance of different methods.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The official copy is Zenodo's, as the README says; the medmnist Python package
    downloads the same files. No account is needed. No file was downloaded for this entry.
  access_basis:
    reason: Every split with its labels, test included, is in the public npz files.
    source: src-github-medmnist-readme
    quote: The only official distribution link for the MedMNIST dataset is
      [Zenodo](https://doi.org/10.5281/zenodo.10519652).
  refresh: versioned-releases
  refresh_basis:
    reason: Each change came as a numbered Zenodo release with a changelog (versions); the PyPI
      package's release notes track the same changes.
    source: src-zenodo-10519652
    quote: 'v2.2: Removed a small number of mistakenly included blank samples in OrganAMNIST, OrganCMNIST,
      OrganSMNIST, OrganMNIST3D, and VesselMNIST3D.'
  data_provenance:
    - inherited-from-constituents
    - expert-authored
  data_provenance_note: Sixteen of the 18 datasets are reformatted from published datasets
    (NCT-CRC-HE-100K, NIH-ChestXray14, HAM10000, a retinal OCT and paediatric chest X-ray set,
    DeepDRiD, a breast ultrasound set, a blood cell set, BBBC051, LiTS with organ boxes from another
    study, LIDC-IDRI, RibFrac and IntrA), each with its own provenance. AdrenalMNIST3D (from
    Zhongshan Hospital CT, annotated by an endocrinologist) and SynapseMNIST3D (rat electron
    microscopy, labelled by three neuroscience experts) are new, which expert-authored records.
  data_provenance_source: src-nature-s41597-022-01721-8
  data_provenance_quote: Three neuroscience experts segment a pyramidal neuron within the whole
    volume and proofread all the synapses on this neuron with excitatory/inhibitory labels.
  contamination_risk: medium
  contamination_risk_note: The test labels are public, and sixteen of the datasets are reformatted
    from published source datasets, so a model pretrained on web-scale or medical image collections
    could have seen test images or their full-resolution originals. The maintainers kept the
    sources' official splits to avoid leakage between MedMNIST's own splits, which does not address
    pretraining. Nobody in the sources read has assessed it.
  contamination_risk_source: src-nature-s41597-022-01721-8
  contamination_risk_quote: We use the official data split from source dataset (if provided) to
    avoid data leakage.
  contamination_evidence: []
  ceiling_anchor_type: null
  ceiling_anchor_type_note: No source read measures human or expert performance on the downsampled
    images, or the share of wrong labels. AUC and accuracy top out at 1. Every release baseline's
    RetinaMNIST accuracy lies between 0.493 and 0.531 ("RetinaMNIST AUC ACC 0.717 0.710 0.726 0.716
    0.690 0.719 0.750 0.524 0.493 0.528 0.511 0.515 0.503 0.531", src-arxiv-2110-14795-v2), which
    may reflect the 28-pixel images more than the methods.
  dataset_licence: CC BY 4.0, except DermaMNIST under CC BY-NC 4.0
  dataset_licence_note: The README, the Zenodo description and the site's data file agree. Every
    other dataset is listed as CC BY 4.0 there. The README's release notes record the DermaMNIST
    change at package v2.2.3, undated. The Zenodo record's licence field names CC BY 4.0 alone for
    the whole record.
  dataset_licence_source: src-github-medmnist-readme
  dataset_licence_quote: The MedMNIST dataset is licensed under *Creative Commons Attribution 4.0
    International* ([CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)), except DermaMNIST
    under *Creative Commons Attribution-NonCommercial 4.0 International*
  upstream_licences: The paper states that every source dataset carries a Creative Commons licence
    or was developed by the authors, and that for those under CC BY-NC the maintainers obtained the
    source authors' permission to redistribute. It does not say which sources are which, and no
    source dataset's own licence was read.
  upstream_licences_source: src-nature-s41597-022-01721-8
  upstream_licences_quote: Some datasets are under CC-BY-NC license; we have contacted the authors
    and obtained the permission to re-distribute the datasets.
  size:
    - count: 708069
      unit: 2D images (12 datasets), as published in v2
      subset: MedMNIST2D
      source: src-nature-s41597-022-01721-8
      quote: consisting of 708,069 2D images and 9,998 3D images in total
    - count: 9998
      unit: 3D volumes (6 datasets), as published in v2
      subset: MedMNIST3D
      source: src-nature-s41597-022-01721-8
      quote: consisting of 708,069 2D images and 9,998 3D images in total
    - count: 10214
      unit: 3D volumes, as the v2 preprint's arXiv abstract field gives it
      subset: MedMNIST3D
      source: src-arxiv-2110-14795
      quote: The resulting dataset, consisting of 708,069 2D images and 10,214 3D images in total
    - count: 58850
      unit: OrganAMNIST images in v2 as published (58,830 after v2.2)
      subset: OrganAMNIST
      source: src-arxiv-2110-14795-v2
      quote: 58,850 23,660 25,221 1,743 1,633 1,584 1,370 1,909 1,759
    - count: 47280
      unit: test images, the largest test split (TissueMNIST)
      subset: TissueMNIST
      source: src-medmnist-data-js
      quote: 'dataset: "TissueMNIST", modality: "Kidney Cortex Microscope", task: "Multi-Class (8)", samples:
        "236,386", splits: "165,466 / 23,640 / 47,280", license: "CC BY 4.0"'
  size_note: The site's data file gives the counts after the v2.2 removal of blank samples, which
    are lower than the v2 paper's Table 2 for OrganAMNIST, OrganCMNIST (23,583 against 23,660),
    OrganSMNIST (25,211 against 25,221), OrganMNIST3D (1,742 against 1,743) and VesselMNIST3D (1,908
    against 1,909); each dataset's current test count is its subset's items. The 10,214 in the arXiv
    abstract field disagrees with the 9,998 of the paper and the v2 PDF (review_checks). Test splits
    range from 156 images (BreastMNIST) to 47,280 (TissueMNIST).

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The MedMNIST team (Shanghai Jiao Tong University and collaborators)
  maintainer_basis:
    reason: The data, the repository (the MedMNIST GitHub organisation) and the site are the paper
      authors'. The corresponding author and the funding are Shanghai Jiao Tong University's, and
      the paper's authors come from six institutions. No source read names one institution as the
      holder.
    source: src-nature-s41597-022-01721-8
    quote: This work was also supported by Grant YG2021ZD18 from Shanghai Jiao Tong University
      Medical Engineering Cross Research.
  maintainer_type: academic-lab
  maintainer_type_note: community-collective was considered, since the GitHub organisation and the
    Zenodo record span authors from six institutions and none is stated as the holder; the
    corresponding author, the funding and the first affiliation are Shanghai Jiao Tong University's
    (review_checks).
  submission_process:
    - literature-only
  submission_process_note: The maintainers keep no leaderboard or results page. Their own numbers
    are the release baselines in the v1 and v2 papers and on the site, and users report theirs in
    their own papers.
  submission_process_source: src-nature-s41597-022-01721-8
  submission_process_quote: Data users are also encouraged to analyze the average performance over
    the 12 2D datasets and 6 3D datasets to benchmark their methods.
  independence_flags:
    - flag: no-known-conflict
      source: src-nature-s41597-022-01721-8
      quote: The authors declare no competing interests.
  independence_flags_note: The funding named is the National Natural Science Foundation of China and
    a Shanghai Jiao Tong University grant. Google AutoML Vision, a commercial service, is a release
    baseline, and no support from Google is stated. The maintainers run baselines in their release
    papers and keep no ranking, so maintainer-competes-on-own-benchmark was not set.
  independence_assessed: true
  funding:
    source: src-nature-s41597-022-01721-8
    quote: This work was supported by National Science Foundation of China (U20B200011, 61976137).
  known_limitation:
    source: src-nature-s41597-022-01721-8
    quote: Please note that this dataset is NOT intended for clinical use, as substantially reducing
      the resolution of medical images might result in images that are insufficient to represent and
      capture different disease pathologies.
  known_limitation_note: The 28-pixel images are the point of the design and its main limit, which
    MedMNIST+ answers with larger copies. Organ{A,C,S}MNIST and OrganMNIST3D share a source and
    split, but the paper warns that their numbers are not comparable ("Therefore, the
    Organ{A,C,S}MNIST metrics in Table 3 and the OrganMNIST3D metrics in Table 4 should not be
    compared.").

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data with test labels is public, the splits are fixed, and the maintainers'
      evaluator computes AUC and ACC from a result file, so anyone can produce the scores with no
      human or maintainer step.
    source: src-github-medmnist-readme
    quote: Parse and evaluate a standard result file
  reproducibility_blockers: []
  reproducibility_blockers_note: DermaMNIST's CC BY-NC 4.0 licence bars commercial use of that
    dataset but not research reproduction, so licence-restriction is not set.
  harness_availability: official-harness
  harness: The medmnist Python package's Evaluator (medmnist/evaluator.py; python -m medmnist
    evaluate)
  harness_note: The evaluator was known here from the README; its code was not read, and no package
    version is pinned as the official scorer. The reproducible training code is a separate
    repository, MedMNIST/experiments, which was not read.
  harness_source: src-github-medmnist-readme
  harness_quote: '[`evaluator.py`](medmnist/evaluator.py): Standardized evaluation functions.'
  code_licence: Apache-2.0
  code_licence_source: src-github-medmnist-readme
  code_licence_quote: The code is under [Apache-2.0 License](./LICENSE).
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which datasets a number covers (one dataset, the 2D or 3D average, or a chosen few)
  # and which release (v2.0 counts, or v2.2 after the blank samples went), which is subset_used; and what the model
  # saw in training (ImageNet or medical pretraining, other MedMNIST datasets in multi-task training), which is
  # training_data_policy. The image size (28, 64, 128 or 224 pixels) and the metric (AUC, ACC, balanced accuracy,
  # macro-F1) also change a number and have no condition field.
  material_extra:
    - subset_used
    - training_data_policy

aggregation_policy: official-aggregate
aggregation_policy_note: The paper averages AUC and ACC over the 12 2D datasets and, separately,
  over the 6 3D datasets; no score spans both groups, and the averages are unweighted means of
  datasets of very different sizes.
aggregation_policy_basis:
  reason: The averages are the maintainers' own comparison of methods.
  source: src-nature-s41597-022-01721-8
  quote: Thereby, we report average AUC and ACC score over MedMNIST2D and MedMNIST3D respectively to
    easily compare the performance of different methods.


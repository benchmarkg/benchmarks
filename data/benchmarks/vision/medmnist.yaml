# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T07)
  added_on: 2026-11-10
  last_verified: 2026-11-10
  verification_status: ai-drafted-unverified
  sources:
    - src-nature-s41597-022-01721-8
    - src-arxiv-2110-14795
    - src-arxiv-2110-14795-v2
    - src-arxiv-2010-14925
    - src-github-medmnist-readme
    - src-github-medmnist-plus
    - src-zenodo-10519652
    - src-zenodo-medmnist-versions
    - src-medmnist-data-js
    - src-arxiv-2406-17536
    - src-arxiv-2610-33520
    - src-arxiv-2609-06838
  sources_note: >
    The Scientific Data article (a DOI, not archived) read as HTML without its table pages, which robots.txt
    disallows; the v2 and v1 arXiv abstract pages and the v2 PDF, for its tables (DOIs); the README and
    the MedMNIST+ note at pinned commits; the Zenodo JSON record of v3.0 (a DOI) and the API's list of
    versions; the site's data file, read because the site renders its tables by script; and three arXiv
    abstract pages by other authors, for the fork and for current use. The v1 PDF, the evaluator's code,
    the experiments repository, the source datasets' pages and the competition page were not read.
  confidence: medium
  review_checks:
    - check: Primary domain. The claim test gives vision/medical-imaging-cv (a machine-learning
        decathlon needing no background knowledge, disclaimed for clinical use). But most 2D
        datasets and NoduleMNIST3D, FractureMNIST3D and AdrenalMNIST3D carry clinically defined
        targets (diagnoses, retinopathy grades, malignancy, fracture types, adrenal masses), which
        the vision exclusion test sends to medicine-health "whatever the metric". Confirm that the
        claim outranks the targets here, or move the primary to
        medicine-health/medical-imaging-diagnostic. Per-subset domain_overrides for the clinical
        datasets are a middle course that was not taken.
      field: domain
      source: src-nature-s41597-022-01721-8
      quote: Please note that this dataset is NOT intended for clinical use, as substantially
        reducing the resolution of medical images might result in images that are insufficient to
        represent and capture different disease pathologies.
    - check: The reference standard is not uniform. ChestMNIST's labels were text-mined from
        reports, AdrenalMNIST3D was labelled by one endocrinologist for this release, and
        SynapseMNIST3D by three neuroscience experts. The other sources' annotation protocols were
        not read, so which datasets meet "clinicians set the reference standard" is not established.
      field: ground_truth_source
      source: src-nature-s41597-022-01721-8
      quote: with the text-mined 14 disease labels, which could be formulized as a multi-label
        binary-class classification task
    - check: The 3D total differs between sources. The paper and the v2 PDF give 9,998 volumes, the
        arXiv abstract field 10,214, and the site's data file sums to 9,996 after v2.2. The 10,214
        is not explained in any source read.
      field: data.size
      source: src-arxiv-2110-14795
      quote: The resulting dataset, consisting of 708,069 2D images and 10,214 3D images in total
    - check: Versions. v1 and v2.0 are editions (new datasets), and v2.1, v2.2 and v3.0 revisions.
        v2.2 is marked breaking because the OrganCMNIST and OrganSMNIST test splits lost samples.
        v3.0 (MedMNIST+) adds larger copies of the same samples and splits and is non-breaking for
        the 28-size files. The README presents it as a benchmark for medical foundation models,
        which could argue for a variant; the 04 S4 test (same items, same maintainer) points to a
        revision. v1's Zenodo repository, its date and its 10 datasets' splits were not read.
      field: versions
      source: src-github-medmnist-plus
      quote: The data in MedMNIST+ directly corresponds to that of MedMNIST, maintaining the same
        dataset splits (i.e., train, val, and test) and sample indices.
    - check: Subsets. The 18 datasets are subsets under the two averaged groups, with each dataset's
        current test count (after v2.2) as items. Whether 20 subset records are the wanted
        granularity, or the two groups alone, is a judgement.
      field: subsets
    - check: maintainer_type academic-lab or community-collective. The GitHub organisation and
        Zenodo record span six institutions with no stated holder; the corresponding author, the
        funding and the first affiliation are Shanghai Jiao Tong University's.
      field: governance.maintainer_type
      source: src-nature-s41597-022-01721-8
      quote: This work was also supported by Grant YG2021ZD18 from Shanghai Jiao Tong University
        Medical Engineering Cross Research.
    - check: no-known-conflict rests on the paper's competing-interests statement, its funding lines
        and the absence of any stated support from Google, whose commercial AutoML service is a
        baseline. The release papers' baselines are the maintainers' own, without a ranking.
      field: governance.independence_flags
      source: src-nature-s41597-022-01721-8
      quote: The authors declare no competing interests.
    - check: Upstream licences. The paper says some sources are CC BY-NC and were redistributed with
        permission, but not which; only DermaMNIST is listed as CC BY-NC. No source dataset's own
        terms (NIH-ChestXray14, HAM10000, LIDC-IDRI, LiTS, RibFrac, IntrA and the rest) were read.
      field: data.upstream_licences
      source: src-nature-s41597-022-01721-8
      quote: All source datasets are either associated with the Creative Commons (CC) Licenses or
        developed by us, which allows us to develop derivative datasets based on them.
    - check: official-harness rests on the README's description of the package's evaluator and its
        evaluate command. The code was not read, and the paper's own baselines ran from the separate
        experiments repository. If the evaluator is a convenience rather than the scoring path,
        reference-implementation-only fits.
      field: execution.harness_availability
      source: src-github-medmnist-readme
      quote: '[`evaluator.py`](medmnist/evaluator.py): Standardized evaluation functions.'
    - check: Current papers rarely use the paper's protocol (per-dataset AUC and ACC, 2D and 3D
        averages, 28 pixels). Those read pick a few datasets, larger sizes, balanced accuracy or
        macro-F1, and multi-task training, and only their abstracts were read. Image size has no
        comparability field.
      field: as_used
      source: src-arxiv-2609-06838
      quote: We identify a resolution domain shift between the MedMNIST API and evaluation
        environment.

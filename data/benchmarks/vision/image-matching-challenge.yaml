    - src-kaggle-image-matching-challenge-2025-ongoing
    - src-kaggle-image-matching-challenge-2025-ongoing-record
    - src-arxiv-2604-04931-v1
  sources_note: >
    The workshop's 2026 and 2019 pages and three pages of the 2020-2021 challenge site, with scripts and
    styles stripped; the paper's v5 PDF (a DOI, not archived) read as text and its abstract page; Kaggle's
    public JSON records of four competitions and its page-service records of the 2025 and 2025 Ongoing
    competitions' pages, read anonymously without accepting any rules; and LoMa's v1 PDF as evidence of
    current use. The pages' contact addresses are mailing lists or generic inboxes and stay out of every
    extract. Kaggle's blog recap of the 2025 challenge is script-rendered and was not read.
  confidence: medium
  review_checks:
    - check: The entry is the series. The PhotoTourism benchmark that the paper defines (with the
        image-matching-benchmark code, its test poses public since 2022) is still used on its own in
        papers and could be an entry of its own; the 2025 Ongoing competition is recorded as a
        revision of 2025, not an edition.
      field: versions
    - check: activity between-rounds rests on the record's passed deadline, against the rules' "no
        end date" and the site's "No hard deadline". If the Ongoing leaderboard still ranks new
        entries, it is leaderboard-live-no-round; if the yearly series has ended (the unread Kaggle
        blog recap may say), closed.
      field: activity
      source: src-kaggle-image-matching-challenge-2025-ongoing
      quote: This Competition does not have an end date.
    - check: The 2025 score combines mAA with a clustering precision by harmonic mean. Read here as
        one F1-like domain metric; it could be composite with classification-metric for the 2025
        editions.
      field: evaluation_method
    - check: submission_process lists routes of past editions too (held-out-server and
        publication-gated for 2019-2021). Whether a family entry keeps them or only the current
        Kaggle route.
      field: governance.submission_process
      source: src-imc-2020-submit
      quote: Participants should provide a short description of their solution
    - check: maintainer-competes-on-own-benchmark not adopted. The 2020 rules let organisers enter,
        and the organisers ran baseline methods that may sit on the 2020 leaderboards, which were
        not read.
      field: governance.independence_flags
      source: src-imc-2020-submit
      quote: We have evaluated several methods from our baseline repository as part of an upcoming
        paper
    - check: compute_tier provided-allocation rests on Kaggle running the notebooks; no source read
        says the compute is free to entrants.
      field: execution.compute_tier
    - check: official-harness rests on the 2019-2021 pipeline; whether the Kaggle metric notebooks
        are public was not checked.
      field: execution.harness_availability
    - check: contamination medium rests on the landmark-overlap route evidenced in 2019 and 2020;
        the 2023-2025 test scenes' sources were not read.
      field: data.contamination_risk
    - check: The Kaggle pages number the editions differently from the site (2025 is "the third" and
        its Ongoing copy "the fourth edition", while the series ran every year from 2019).
      field: versions
      source: src-kaggle-image-matching-challenge-2025
      quote: This is the third Image Matching Challenge
    - check: 3d-reconstruction is secondary because the 2023-2025 tasks are reconstruction; the 2022
        edition is pairwise only.
      field: domain
    - check: The abstract page links the published version's DOI (a Springer journal); the venue,
        IJCV, is not named in the sources read.
      field: paper
      source: src-arxiv-2003-01587
      quote: 10.1007/s11263-020-01385-0

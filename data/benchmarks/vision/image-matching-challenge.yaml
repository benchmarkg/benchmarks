    breaking: true
    superseded_by: '2020'
    frozen: true
    sources:
      - src-image-matching-workshop-2019-site
  - version: '2020'
    label: Image Matching Challenge 2020
    version_kind: edition
    released: 2020-02-10
    changes: A second, rebuilt edition on the open-sourced benchmark and its PhotoTourism test
      scenes. Stereo and multi-view tasks are scored by pose mAA and ranked by their average, in a
      2,048-keypoint and an 8,000-keypoint category.
    breaking: true
    supersedes_version: '2019'
    superseded_by: '2021'
    frozen: true
    sources:
      - src-imc-2020-site
      - src-imc-2020-submit
      - src-arxiv-2003-01587-v5
  - version: '2021'
    label: Image Matching Challenge 2021
    version_kind: edition
    released: 2021-05-10
    changes: The third edition, adding the PragueParks and GoogleUrban datasets to PhotoTourism on a

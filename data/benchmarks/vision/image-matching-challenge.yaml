subsets:
  - id: image-matching-challenge#stereo
    label: Wide-baseline stereo (2019-2021)
    scored_separately: true
    evidence:
      - source: src-imc-2020-submit
        quote: which is the mean Average Accuracy (mAA) averaged across the stereo and multi-view
          tasks
    notes: Pose estimation from two images at a time, by the entrant's matches and a robust
      estimator. Its mAA was reported on its own and averaged with the multi-view task's for the
      ranking.
  - id: image-matching-challenge#multiview
    label: Multi-view reconstruction from image subsets (2019-2021)
    scored_separately: true
    evidence:
      - source: src-arxiv-2003-01587-v5
        quote: The same metric is used for multiview.
      - source: src-image-matching-workshop-2019-site
        quote: fixed a bug in the aggregation of results for the MVS task
    notes: Reconstructions from bags of 5, 10 and 25 images with COLMAP, scored by mAA over every
      image pair in a bag.
  - id: image-matching-challenge#keypoints-2k
    label: 2,048-keypoint budget (2020-2021)
    scored_separately: true
    evidence:
      - source: src-imc-2020-submit
        quote: we consider a limited budget of 2048 features, and an unlimited budget (capped to
          8000 features per image for practical reasons)
    notes: A category ranked apart from the unlimited budget, across both tasks.
  - id: image-matching-challenge#keypoints-8k
    label: Unlimited budget, capped at 8,000 keypoints (2020-2021)
    scored_separately: true

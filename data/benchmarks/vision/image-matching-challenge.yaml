    breaking: true
    supersedes_version: '2020'
    superseded_by: '2022'
    frozen: true
    sources:
      - src-imc-2021-site
  - version: '2022'
    label: Image Matching Challenge 2022
    version_kind: edition
    released: 2022-04-04
    changes: Moved to Kaggle as a code competition, hosted by Google AI. Entrants register image
      pairs from Google Street View (a hidden test), scored by pose mAA; 642 teams.
    breaking: true
    supersedes_version: '2021'
    superseded_by: '2023'
    frozen: true
    sources:
      - src-kaggle-image-matching-challenge-2022-record

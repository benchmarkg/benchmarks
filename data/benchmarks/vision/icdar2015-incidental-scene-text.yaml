          F-measure (0.4674)
      - source: src-arxiv-2602-04030-v1
        quote: The standard F1-measure (Hmean) is reported.
    notes: Localise and read every word on the 500 test images, scored by H-mean over correctly
      localised and transcribed words, under one of three lexicon settings (the child subsets).

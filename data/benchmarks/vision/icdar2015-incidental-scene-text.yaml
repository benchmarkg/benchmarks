subsets_note: >
  The subsets are the three tasks the sources name, with the end-to-end task's three lexicon settings
  as children. A text segmentation task (4.2), part of the RRC's task numbering, is not named in any source
  read and is not recorded. Lexicon-free end-to-end and the 1,811-word recognition set are papers' protocols
  (as_used).

lineage:
  role: root
lineage_note: Separate benchmarks, not modelled here. The 2015 competition's other challenges ran
  beside this one ("Challenges on Born-Digital Images, Focused Scene Images and Video Text",
  src-s2-api-icdar-2015-7333942); the focused scene text of ICDAR 2013, which papers still use
  beside this set ("comprised of 229 training images and 223 testing images from the ICDAR 2013
  Robust Reading competition", src-arxiv-2602-04030-v1), is the setting incidental text was
  contrasted with ("in which the texts are well positioned and focused", src-arxiv-1511-09207-v2).
  Later RRC challenges on other datasets were not read, and no ids are proposed.


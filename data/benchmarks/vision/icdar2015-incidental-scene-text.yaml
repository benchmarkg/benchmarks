# data/benchmarks/vision/icdar2015-incidental-scene-text.yaml
#
# P1-S8-T07, vision entry 20. Filled from two records of the competition report, "ICDAR 2015 competition on Robust
# Reading" (IEEE DOI 10.1109/ICDAR.2015.7333942): Crossref's, for the venue and pages, and Semantic Scholar's API
# record, for its abstract. The report's full text was not read: IEEE Xplore is paywalled, the copy on the
# portal is disallowed by its robots.txt, and a university copy found by search did not answer. Also read: the
# Megvii report on Challenge 4 (arXiv 1511.09207, v2 PDF and abstract page), which describes the data and tasks;
# MMOCR's ICDAR 2015 dataset-zoo files (metafile, text-detection and text-recognition preparers) at commit
# d56155c; the Robust Reading Competition portal's robots.txt; and three 2026 papers that report on the
# benchmark, TiCLS (arXiv 2602.04030, end-to-end), a 2D rotary position embedding recogniser (arXiv 2607.13458,
# word recognition) and MEVL-STP (arXiv 2609.28857, localisation and end-to-end). Every quote below is checked by
# the quote-substring validator against those Sources' committed extracts.
#
# rrc.cvc.uab.es disallows every agent but Googlebot in its robots.txt, so none of the portal's pages was read:
# not the challenge's tasks page, the download page and its terms, the ranking or the scoring scripts. What the
# entry says about the portal rests on the papers and MMOCR's files. Nothing was registered or downloaded.
#
# The entry is Challenge 4 of the Robust Reading Competition, Incidental Scene Text, as one benchmark, with its
# tasks as subsets (04 S4): text localisation (4.1), word recognition (4.3) and end-to-end (4.4), the last with
# its three lexicon settings. A text segmentation task (4.2) is named in the prompt for this entry but in no
# source read. The competition's other challenges (Born-Digital, Focused Scene Text, Video Text) and later RRC
# challenges are separate benchmarks and appear only in lineage_note.

id: icdar2015-incidental-scene-text
name: ICDAR 2015 Incidental Scene Text
aliases:
  - ICDAR 2015
  - ICDAR2015
  - IC15
  - Incidental Scene Text IC15
  - ICDAR 2015 Robust Reading Competition Challenge 4
  - RRC Challenge 4
tagline: Words in casual Google Glass photos, to be localised, read and spotted end to end, scored
  by H-mean and word accuracy.
description: >
  Challenge 4 of the ICDAR 2015 Robust Reading Competition, added that year beside the born-digital, focused
  scene text and video text challenges. Its images were taken with Google Glass without the wearer aiming
  at the text, so the words are often skewed, blurred, small or poorly lit, unlike the focused text of
  earlier competitions. Papers use 1,000 training and 500 test images annotated with word-level quadrilaterals
  (the competition report's abstract counts 1,670 images). The tasks are text localisation, scored by
  precision, recall and their harmonic mean (H-mean) with a detection counted at IoU 0.5 or more; word
  recognition on 2,077 cropped test words, scored by the share of correctly recognised words and the total
  edit distance; and end-to-end recognition, scored by H-mean under a strong (per-image), weak (whole
  test set) or generic lexicon. The competition ran in the first quarter of 2015 with 44 submissions across
  its new tasks, and the challenge ranking stayed on the Robust Reading Competition portal. The test ground
  truth is now downloadable, and 2026 papers still report all three tasks.
self_description:
  source: src-s2-api-icdar-2015-7333942
  quote: A new Challenge 4 on Incidental Scene Text has been added to the Challenges on Born-Digital
    Images, Focused Scene Images and Video Text.
paper:
  title: ICDAR 2015 competition on Robust Reading
  doi: 10.1109/icdar.2015.7333942
  source: src-crossref-10-1109-icdar-2015-7333942
paper_note: The competition report in the ICDAR 2015 proceedings, pages 1156-1160. Its full text was
  not read (see the header); its abstract was read from Semantic Scholar's record
  (src-s2-api-icdar-2015-7333942).
released: null
released_note: The competition took place in the first quarter of 2015 and the report appeared in
  the proceedings of ICDAR 2015 (23-26 August 2015), which Crossref dates to August 2015 only. When
  the data was first published on the portal is not stated in the sources read.
released_source: src-s2-api-icdar-2015-7333942
released_quote: The competition took place in the first quarter of 2015, and received a total of 44
  submissions.
release_venue: ICDAR 2015, the 13th International Conference on Document Analysis and Recognition
  (Tunis)
release_venue_source: src-crossref-10-1109-icdar-2015-7333942
release_venue_quote: '"location":"Tunis, Tunisia","start":{"date-parts":[[2015,8,23]]}'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/ocr-handwriting
  secondary:
    - vision/detection
domain_basis:
  reason: Every task scores what was recovered from the image itself, the words written in a scene
    photograph, their positions or their character sequences, against the annotated words. Reading
    scene text into character sequences is ocr-handwriting's definition, and the end-to-end task,
    which needs both, is the challenge's point. Under 02 S11 rule 12 the discriminant is what is
    scored, and vision's exclusion test sends a benchmark to multimodal only "if the scored relation
    is between a visual signal and language". No question, description or expression is posed; the
    reference text is the text in the image, as for IAM's transcriptions. Localisation (Task 4.1),
    the task most reported, is detection of word instances, so vision/detection is secondary and the
    localisation subset carries it as its primary.
  source: src-s2-api-icdar-2015-7333942
  quote: Challenge 4 is run on a newly acquired dataset of 1,670 images evaluating Text
    Localisation, Word Recognition and End-to-End pipelines.
domain_considered_and_rejected:
  - term: multimodal/visual-qa
    reason: No item is posed as a question or answered in language. The three tasks output boxes,
      transcriptions or both, scored against the annotated words, which are the image's content
      rather than a referent of it.
    source: src-arxiv-1511-09207-v2
    quote: There are three tasks, namely Text Localization (Task 4.1), Word Recognition (Task 4.3)
      and End-to-End Recognition (Task 4.4), based on this benchmark.
  - term: vision/document-understanding
    reason: The images are street and indoor scenes taken by a wearable camera, not documents; no
      layout, form or table structure is scored.
    source: src-arxiv-2609-28857-v1
    quote: ICDAR 2015 [35] (1,000/500 images, word-level quadrilaterals) contains blurry,
      multi-oriented text from a wearable camera.
  - term: vision/segmentation
    reason: A text segmentation task (4.2) would score per-pixel text masks, but no source read
      names or scores it; the Megvii report lists the tasks as 4.1, 4.3 and 4.4, and the report's
      abstract names localisation, recognition and end-to-end only.
    source: src-arxiv-1511-09207-v2
    quote: There are three tasks, namely Text Localization (Task 4.1), Word Recognition (Task 4.3)
      and End-to-End Recognition (Task 4.4), based on this benchmark.
capability:
  - perception
capability_basis:
  perception:
    reason: The input is a casually taken photograph and every score measures how much of its text
      was found and read, through blur, skew, low resolution and clutter.
    source: src-arxiv-1511-09207-v2
    quote: such as blur, usual layout, non-uniform illumination, low resolution in addition to
      cluttered background
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The challenge was set up because methods built for focused text had not been tested on
      incidental text, but its training and test images come from the same capture; no shifted
      condition is scored apart from an in-distribution one.
    source: src-arxiv-1511-09207-v2
    quote: the images from ICDAR 2015 are taken in an arbitrary or insouciance way, so the texts are
      usually skewed or blurred.
  - term: context-integration
    reason: The end-to-end task supplies lexicons, one per image in the strong setting, and a system
      may snap its reading to the nearest entry. But the lexicon narrows the output vocabulary; what
      is scored is still the text read from the image, and the setting is a condition of the number
      (subsets).
    source: src-arxiv-2602-04030-v1
    quote: Strong (S) provides a lexicon containing the words annotated in each image.

evaluation_method:
  - domain-metric
  - exact-match
evaluation_method_note: >
  Localisation is scored by precision, recall and their harmonic mean over word boxes matched to the ground
  truth at an IoU threshold (0.5 in the paper that states it), and end-to-end by the same H-mean when
  the matched word is also read correctly, under a lexicon setting. The IoU matching makes these the detection
  field's own measures, as for COCO's AP (domain-metric). Word recognition reports the share of correctly
  recognised words, a whole-word match of the transcription (exact-match), with the total edit distance
  beside it in 2015. The matching rules, the handling of unreadable regions and the case rule of each
  task are on the portal's tasks page and in the report, neither read.
evaluation_method_basis:
  reason: The 2026 MEVL-STP paper scores localisation by precision, recall and F1 at IoU 0.5 or
    more; TiCLS reports end-to-end H-mean; the Megvii report gives word recognition as correctly
    recognised words and total edit distance.
  source: src-arxiv-2609-28857-v1
  quote: We report Precision, Recall, and F1 for detection (IoU ≥ 0.5)
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: F1 is a general statistic, but here it is taken over detections matched to ground-truth
      words by an overlap rule, which is a detection measure (as COCO's AP is filed); no image or
      region is assigned a class.
  - term: reference-metric
    reason: The 2015 word-recognition table also gives the total edit distance to the reference
      words, but the papers read rank by the correctly recognised share, and no 2026 paper read
      reports the edit distance.
    source: src-arxiv-1511-09207-v2
    quote: nearly halving the Total Edit Distance (T.E.D.) and doubling the ratio of Correctly
      Recognized Words (C.R.W.)
  - term: composite
    reason: Each task is ranked on its own measure; nothing combines the three.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The challenge gives a training set beside the test set, and entrants are text detectors,
    recognisers and spotters trained or fine-tuned on it and scored as trained. TiCLS pretrains on
    synthetic and other benchmarks' images and fine-tunes on the 1,000 training images; MEVL-STP
    trains on the training split alone.
  source: src-arxiv-2602-04030-v1
  quote: We then fine-tune TICLS using the training set in the evaluation benchmarks (i.e., either
    ICDAR 2015, Total-Text, or CTW1500).
designed_for_subjects_considered_and_rejected:
  - term: classical-algorithm
    reason: Several 2015 entries were region-based pipelines (the Megvii report's table lists MSER
      methods beside CNN ones), but the competition's own entries were not read and every entrant in
      the sources read since is a trained network.
  - term: instruction-tuned-model
    reason: No source read scores a prompted general vision-language model on the benchmark.
      MEVL-STP uses a vision-language model inside a trained spotting pipeline, scored as a trained
      system.
as_used:
  - protocol: Word recognition on a 1,811-word filtered test set rather than the full 2,077 cropped
      words. The filtered set drops words with non-alphanumeric characters and some extremely
      rotated, perspective-shifted and curved images; MMOCR prepares both and uses 2,077 by default.
    split: 1,811 of the 2,077 test words
    source: src-github-mmocr-icdar2015-textrecog
    quote: '# 3. The 1811 version discards non-alphanumeric character images'
    note: The 1,811 annotation file is fetched from OpenMMLab's own host, not the portal; who made
      the filtered list first is not stated in the sources read. The 2026 recognition paper read
      uses 2,077 (src-arxiv-2607-13458-v1).
  - protocol: End-to-end H-mean with no lexicon at all ("None", lexicon-free), reported beside the
      strong, weak and generic settings. TiCLS reports 79.1 lexicon-free against 90.1 strong.
    split: the 500 test images
    source: src-arxiv-2602-04030-v1
    quote: TICLS achieves a lexicon-free Hmean of 79.1%
    note: Whether the portal scores a lexicon-free setting is not known (not read); the 2015 report
      names three settings. The snapping rule (edit distance at most 2 to the nearest lexicon entry)
      is TiCLS's own and borrowed from earlier spotters.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. Papers from February, July and
    September 2026 report new test scores on all three tasks.
  source: src-arxiv-2609-28857-v1
  quote: Our multiencoder ensemble achieves 92.0% F1 on CTW1500, 89.6% on Total-Text, and 90.8% on
    ICDAR 2015
activity: unknown
activity_note: The challenge's ranking is on the Robust Reading Competition portal, which the Megvii
  report pointed to in 2016 and which lists the competition's results; whether it still takes
  uploads could not be read, since the host's robots.txt disallows every agent (src-rrc-robots). The
  2026 papers read do not say whether their numbers came from the portal.
activity_basis:
  reason: The sources that would show the portal's state could not be read.
  source: src-rrc-robots
  quote: 'User-agent: * Disallow: /'
events:
  - name: ICDAR 2015 Robust Reading Competition, Challenge 4 (first quarter of 2015; results at
      ICDAR 2015, Tunis)
    kind: competition
    source: src-s2-api-icdar-2015-7333942
    quote: The competition took place in the first quarter of 2015, and received a total of 44
      submissions.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: TiCLS
    source: src-arxiv-2602-04030-v1
    observed_on: 2026-11-10
    quote: TICLS achieves a lexicon-free Hmean of 79.1%
    note: A text spotter with a pretrained linguistic decoder (WACV 2026), fine-tuned on the
      training images; end-to-end H-mean 90.1 strong, 85.4 weak and 81.9 generic in its Table 1.
  - system: MEVL-STP
    source: src-arxiv-2609-28857-v1
    observed_on: 2026-11-10
    quote: Our multiencoder ensemble achieves 92.0% F1 on CTW1500, 89.6% on Total-Text, and 90.8% on
      ICDAR 2015
    note: A multi-encoder detector ensemble with a vision-language recogniser, trained on the
      training split with no synthetic data; localisation F1 90.8.
  - system: 2D-RoPE-STR
    source: src-arxiv-2607-13458-v1
    observed_on: 2026-11-10
    quote: The only benchmark where 2D-RoPE-STR trails MATRN is IC15 (81.2 vs. 81.5).
    note: A transformer recogniser with 2D rotary position embeddings; word accuracy 81.2 on the
      2,077 cropped test words.
  - system: Megvii-Image++
    source: src-arxiv-1511-09207-v2
    observed_on: 2026-11-10
    quote: The proposed method achieves the highest recall (0.5696) and the second highest precision
      (0.724).
    note: An FCN text detector with a CNN-LSTM-CTC recogniser (2015-2016), compared with the
      competition's entries on all three tasks; localisation F-measure 0.6376.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Word-level quadrilaterals with transcriptions for every legible word in
  the test images, and the transcriptions of the cropped test words, made by the organisers. Whether
  the test ground truth was withheld during the 2015 competition is not stated in the sources read;
  it is now among the portal's download files (src-github-mmocr-icdar2015-textdet).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The test images and the test ground truth of localisation, end-to-end and word recognition
    are published on the portal, so anyone can score a system locally. MMOCR's preparers fetch them
    by URL with checksums.
  source: src-github-mmocr-icdar2015-textdet
  quote: "'Challenge4_Test_Task4_GT.zip',"

task:
  exists: true
  input:
    - a colour photograph of an indoor or outdoor scene taken with Google Glass, holding incidental
      text (localisation and end-to-end)
    - a cropped image of one test word (word recognition)
    - for end-to-end, optionally a lexicon - the words of that image (strong), of the whole test set
      (weak), or a generic list
  output: Quadrilaterals around the words (localisation), the word's character string (recognition),
    or quadrilaterals with transcriptions (end-to-end).
  scoring: Localisation is precision, recall and H-mean over detections matched to ground-truth
    words at IoU 0.5 or more; end-to-end is the same H-mean counting a match only when the
    transcription is also right, under a lexicon setting; word recognition is the share of words
    recognised correctly, with the total edit distance in 2015. The portal's own matching, ignore
    and case rules were not read.
  source: src-arxiv-2609-28857-v1
  quote: We report Precision, Recall, and F1 for detection (IoU ≥ 0.5)

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The images and the test ground truth are files on rrc.cvc.uab.es/downloads/, which
    MMOCR's preparers fetch with no login step. The portal's download page, which may ask for an
    account as the DocVQA pages say the portal does, and its terms could not be read (robots.txt).
    If every download needs an account, gated-registration applies (review_checks).
  access_basis:
    reason: The test labels are published files on the official host, fetched by a script that
      supplies no credentials.
    source: src-github-mmocr-icdar2015-textdet
    quote: "'Challenge4_Test_Task4_GT.zip',"
  refresh: static
  refresh_basis:
    reason: One dataset was acquired for the 2015 challenge, and the 2026 papers use the same 1,000
      / 500 image split and 2,077 test words. No later release or re-annotation is recorded in the
      sources read.
    source: src-s2-api-icdar-2015-7333942
    quote: Challenge 4 is run on a newly acquired dataset of 1,670 images evaluating Text
      Localisation, Word Recognition and End-to-End pipelines.
  data_provenance:
    - real-world-instrument
  data_provenance_note: Photographs taken with a wearable camera (Google Glass) in everyday scenes
    and annotated by the organisers. Who annotated them and how is in the report's full text, which
    was not read, so expert-authored or crowd-authored is not tagged.
  data_provenance_source: src-arxiv-1511-09207-v2
  data_provenance_quote: The dataset includes 1500 natural images in total, which are acquired using
    Google Glass.
  contamination_risk: medium
  contamination_risk_note: The test images and ground truth have been public for years and are
    bundled by toolboxes such as MMOCR, and spotters pretrain on large real and synthetic text
    corpora; TiCLS builds its language model's text from the training sets of several benchmarks,
    ICDAR 2015's among them. The test set is not part of those training sets in any source read, and
    no source measures overlap.
  contamination_evidence: []
  ceiling_anchor_type: null
  ceiling_anchor_type_note: H-mean and word accuracy top out at 1 (100 %). No source read measures a
    human reader's score on the test images or the share of faulty labels; the 2026 localisation and
    strong-lexicon scores are about 90.
  dataset_licence: CC BY 4.0, as MMOCR's metafile records it; the maintainers' own terms were not
    read
  dataset_licence_note: The licence is a third party's record. The portal's download page and any
    terms it shows could not be read (robots.txt), and the report's full text was not read.
  dataset_licence_source: src-github-mmocr-icdar2015-metafile
  dataset_licence_quote: 'Type: CC BY 4.0'
  size:
    - count: 500
      unit: test images (1,000 training images), with word-level annotations
      subset: localisation and end-to-end (Tasks 4.1 and 4.4)
      source: src-arxiv-2602-04030-v1
      quote: ICDAR 2015 includes 1,000 training images and 500 testing images with word-level
        annotations.
    - count: 2077
      unit: cropped test word images
      subset: word recognition (Task 4.3)
      source: src-arxiv-2607-13458-v1
      quote: ICDAR 2015 (IC15) [23] (2,077 images of challenging incidental text)
    - count: 1670
      unit: images in the newly acquired dataset
      subset: the competition dataset, as the report's abstract counts it
      source: src-s2-api-icdar-2015-7333942
      quote: Challenge 4 is run on a newly acquired dataset of 1,670 images evaluating Text
        Localisation, Word Recognition and End-to-End pipelines.
    - count: 1500
      unit: images in total
      subset: the dataset as the Megvii report counts it
      source: src-arxiv-1511-09207-v2
      quote: The dataset includes 1500 natural images in total, which are acquired using Google
        Glass.
  size_note: The 1,500 images are the 1,000 training and 500 test images that papers use. The
    abstract's 1,670 is 170 more; what the difference is (a held-back or validation set, or images
    used only by another task) is not stated in the sources read (review_checks). The number of
    annotated words is not in any source read.
  languages:
    - en
  languages_note: MMOCR's metafile records English as the language
    (src-github-mmocr-icdar2015-metafile); no source read says whether other scripts occur.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Robust Reading Competition organisers, on the RRC portal (rrc.cvc.uab.es)
  maintainer_basis:
    reason: The data, the challenge page and its results are on the Robust Reading Competition
      portal, to which the Megvii report and MMOCR's metafile both point. The portal is hosted at
      the Computer Vision Center of the Universitat Autonoma de Barcelona (cvc.uab.es), as the
      DocVQA entry found; the ICDAR 2015 organisers' own institutions are in the report's full text,
      not read.
    source: src-github-mmocr-icdar2015-metafile
    quote: 'Website: https://rrc.cvc.uab.es/?ch=4'
  maintainer_type: academic-lab
  maintainer_type_note: Rests on the portal's host, a university research centre's domain, and on
    the DocVQA entry's reading of the same portal. conference-workshop was considered, since the
    competition ran under ICDAR, but Challenge 4 had one edition and the standing portal holds the
    data and ranking. community-collective was considered for a report with authors from several
    institutions; their affiliations were not read.
  submission_process:
    - maintainer-scored-predictions
  submission_process_note: The competition's 44 submissions across the new tasks were scored by the
    organisers, and the Megvii report says its post-competition results also appear on the
    challenge's portal page. With the test ground truth now published, a portal score guards the
    arithmetic but not the test set. Whether the test labels were hidden in 2015 (held-out-server
    then) and whether the portal still takes uploads were not read. The 2026 papers read do not say
    where they scored.
  submission_process_source: src-arxiv-1511-09207-v2
  submission_process_quote: All the results shown in this section can be also found on the homepage2
    of the ICDAR 2015 Robust Reading Competition Challenge 4.
  independence_flags: []
  independence_flags_note: Not assessed. The report's full text, which would name the organisers'
    institutions, any entries of their own and any funding, and the portal's ranking were not read.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: null
  reproducibility_tier_note: Left null. The data and test labels are published and scoring is
    automatic, which reads as fully-automatable, but whether the maintainers publish the scoring
    code could not be read (harness_availability).
  harness_availability: null
  harness_availability_note: Left null. The portal is the official scorer and may offer its
    evaluation scripts for download, but none of its pages could be read. MMOCR implements the
    tasks' preparation and an IoU-based H-mean, a third party's code that the maintainers are not
    known to designate. Each paper read scores with its own or its toolbox's code.
  submission_channel:
    source: src-arxiv-1511-09207-v2
    quote: rrc.cvc.uab.es/?ch=4&com=evaluation
  submission_channel_note: The challenge's results page on the Robust Reading Competition portal,
    reached through a portal account. Its current state was not read (robots.txt).
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The fallback profile floors at subset_used, which here carries the task (localisation, word recognition or
  # end-to-end), the lexicon setting of an end-to-end number (strong, weak, generic, or lexicon-free, which is
  # not a maintainer setting), and the word-recognition set (all 2,077 words or the filtered 1,811). Beyond it:
  # the training data (training split only, or synthetic and other benchmarks' data added, which the papers'
  # tables mark), and the scoring code, since papers score locally with their own or a toolbox's
  # implementation of the matching and lexicon-snapping rules.
  material_extra:
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_note: Each task, and each lexicon setting of the end-to-end task, is reported on
  its own; no score spans them.
aggregation_policy_basis:
  reason: The Megvii report and the 2026 papers report each task in its own table.
  source: src-arxiv-1511-09207-v2
  quote: There are three tasks, namely Text Localization (Task 4.1), Word Recognition (Task 4.3) and
    End-to-End Recognition (Task 4.4), based on this benchmark.

homepage: https://rrc.cvc.uab.es/?ch=4
dataset_url: https://rrc.cvc.uab.es/?ch=4&com=downloads
leaderboard_url: https://rrc.cvc.uab.es/?ch=4&com=evaluation


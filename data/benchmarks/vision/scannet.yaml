# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1702-04405-v2
    - src-arxiv-1702-04405
    - src-scannet-benchmark-documentation
    - src-scannet-benchmark-semantic-label-3d
    - src-scannet-benchmark-semantic-instance-3d
    - src-scannet-benchmark-scene-classification
    - src-scannet-benchmark-data-efficient
    - src-scannet-benchmark-volt-result
    - src-scannet-cvpr2023-workshop
    - src-scannet-changelog
    - src-github-scannet-readme
    - src-scannet-terms-of-use
    - src-arxiv-2604-19609-v2
    - src-arxiv-2308-11417-v1
  sources_note: >
    The ScanNet paper's v2 PDF (a DOI, not archived) read as text, and its abstract page for the
    date; five benchmark-server pages and one result page with scripts and styles stripped; the 2023
    challenge page; the changelog; the README at master; the terms of use PDF, read and not signed;
    Volt's v2 PDF as evidence of current use; and ScanNet++'s v1 PDF, read for the identity call.
    The 2D label, 2D instance and ScanNet200 boards were fetched and read but are not Sources; the
    metric details in those subsets' notes come from them.
  confidence: medium
  review_checks:
    - check: Identity. The stress corpus's `scannet` record names ScanNet++ (arXiv 2308.11417, the
        scannetpp repository), and its Stage 3 classification and the taxonomy examples citing
        scannet or scannetpp (vision family, perception, spatial-reasoning, the none-known ceiling)

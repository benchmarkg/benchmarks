# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T06)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2412-07626-v2
    - src-arxiv-2412-07626
    - src-github-omnidocbench-readme
    - src-github-omnidocbench-readme-v1-0
    - src-github-omnidocbench-readme-v1-5
    - src-hf-api-omnidocbench
    - src-arxiv-2604-04771-v2
    - src-arxiv-2606-03264-v1
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text with its supplementary material, and its abstract
    page for the dates and venue; the README at main's head commit and at the heads of the v1_0 and v1_5
    branches, each pinned to its commit; the Hugging Face API record of the dataset, read through the
    API,
    not the dataset page; the MinerU2.5-Pro report's v2 PDF for v1.6; and the PaddleOCR-VL-1.6 report's
    v1 PDF as evidence of current use. The official site, opendatalab.com/omnidocbench, allows agents
    in its robots.txt but serves an empty script shell, so it was not read. The README's leaderboard is
    an HTML table whose tags normalise() strips, so its rows are quoted as cell text.
  confidence: medium
  review_checks:
    - check: v1.0, v1.5 and v1.6 are modelled as editions because each adds pages under the same
        task, while also correcting earlier annotations and changing the matching. They are
        supersets, not replacement sets, and v1.6 keeps v1.5 as its Base tier for comparability, so
        a reviewer could read v1.5 and v1.6 as revisions with additions. Scores across them are not
        comparable either way.
      field: versions
      source: src-arxiv-2604-04771-v2
      quote: 'Base (1,355 pages): retains the original v1.5 evaluation set to maintain comparability with
        historical results.'
    - check: v1.7 is a version label with no stated change to pages, annotations or scoring, and the
        leaderboard is still captioned v1.6_full; the Hugging Face dataset was modified on
        2026-06-26, after it. Whether v1.7 changed the data, and whether that later modification is
        an unannounced change (which would make refresh rolling-live), is not shown by any source
        read.
      field: versions
      source: src-github-omnidocbench-readme
      quote: Updated from **v1.6** to **v1.7**, added the Qianfan-OCR leaderboard, and supported
        skills-based evaluation.
    - check: The domain rests on what is scored. The output is text produced from an image, which a
        reader could take for multimodal/any-to-any-generation; it is kept in vision because the
        text is a transcription of the page's own content, as document-understanding and
        ocr-handwriting define it. DocVQA, by contrast, scores answers to questions and sits in
        multimodal.
      field: domain
    - check: activity no-submission-channel rests on the README, which shows a maintainer-run table
        and no submission route. The official site on opendatalab.com, which reports cite as the
        leaderboard, could not be read. If developers can ask to be evaluated or send results,
        activity is accepting-submissions and submission_process gains that route.
      field: activity
    - check: maintainer-competes-on-own-benchmark rests on the MinerU2.5-Pro report, which both
        defines v1.6 and ranks the lab's own model first on it, with the Hard pages drawn from that
        model's data pool. The leaderboard's top is now other models (OXR-1.0 at 97.03), and
        MinerU2.5-Pro is fifth.
      field: governance.independence_flags
      source: src-github-omnidocbench-readme
      quote: OXR-1.0 Specialized VLMs 1.3B 97.03
    - check: maintainer_type is null. Shanghai Artificial Intelligence Laboratory's legal form is
        not stated in any source read; the field needs a source that states it.
      field: governance.maintainer_type
    - check: TEDS and CDM are tagged domain-metric as table- and formula-recognition measures. TEDS
        is also a similarity against a reference markup, which a reviewer could read as
        reference-metric; CDM's description was not read beyond the paper's naming of it, so whether
        any learned model takes part in it (model-derived-metric) is unconfirmed.
      field: evaluation_method
    - check: Real5-OmniDocBench is recorded as a fork on the PaddleOCR-VL-1.6 report's description
        (re-photographed v1.5 pages, the same annotations and protocol). Its own paper (arXiv
        2603.04205) was not read, so its maintainer and whether it is a separate benchmark or a test
        condition of this one are unconfirmed; it has no entry.
      field: lineage
      source: src-arxiv-2606-03264-v1
      quote: Each subset maintains a one-to-one correspondence with the original OmniDocBench
        samples and follows the same ground-truth annotations and evaluation protocols.
    - check: dataset_licence is null. The README limits the dataset to research and non-commercial
        use without naming a licence, and the Hugging Face record declares none.
      field: data.dataset_licence
      source: src-github-omnidocbench-readme
      quote: The dataset is for research purposes only and not for commercial use.
    - check: data_provenance crowd-authored rests on the annotators' expertise being undescribed;
        annotation was supported by 2077AI, and the v1.6 Hard pages by professional teams. The
        annotations were model pre-annotations corrected by people, which a reviewer may want
        recorded as model-generated as well.
      field: data.data_provenance
      source: src-arxiv-2604-04771-v2
      quote: are annotated by professional teams with inter-annotator cross-validation to ensure
        ground truth quality

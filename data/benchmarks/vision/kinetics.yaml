  sources_note: >
    The four papers' latest PDFs (DOIs, not archived) read as text, and their abstract pages for dates.
    DeepMind's dataset page is gone (robots.txt on deepmind.google allows all paths, and the sitemap lists
    no Kinetics page), so it was read on its last Wayback capture before the redirect. The CVDF and ActivityNet
    files are pinned to commits e6bea42 and 82304fa. The three ActivityNet task pages and the papers'
    first pages carry organisers' and authors' e-mail addresses, kept out of the extracts by narrow windows;
    the 2019 and 2021 winners' tables were not read. Two 2026 PDFs are the evidence of current use.
  confidence: medium
  review_checks:
    - check: Identity. One entry with Kinetics-400, -600, -700 and -700-2020 as editions, because
        one maintainer issued all four on the same task with new clips and a growing class list, and
        the 2020 note calls them editions. Each edition is still cited and reported in its own
        right, Kinetics-400 most of all, which is 04 S4's test for a separate benchmark
        ("independently versioned and cited"). The supersedes chain records order only; no edition
        is marked superseded_by.
      field: versions
      source: src-arxiv-2010-10864-v1
      quote: 'Three editions have been released: Kinetics-400 [6], Kinetics-600 [1] and Kinetics-700 [2]'
    - check: Kinetics-700-2020 as an edition rather than a revision. It keeps Kinetics-700's classes
        and mostly its clips, topping up the 123 rarest classes and removing some clips, which is
        close to revision's "same items, changed contents". The maintainers' own word is edition.
      field: versions
      source: src-arxiv-2010-10864-v1
      quote: Note, unlike in previous years we have not increased the number of classes.
    - check: data.access fully-open is judged on the splits papers report (a validation split, or
        Kinetics-400's released test labels). If the current edition's test split decides
        (fully-open's rule for families), Kinetics-700-2020's CVDF test list carries no labels,
        which gives train-open-test-held-out and reproducibility not-independently-reproducible.
      field: data.access
      source: src-s3-kinetics-700-2020-test-csv
      quote: youtube_id,time_start,time_end,split
    - check: activity unknown. No challenge has run since 2021 and the evaluation server is behind a
        login. closed fits if the server no longer scores; leaderboard-live-no-round if it still
        takes held-out-test submissions.
      field: activity
    - check: Vanishing clips are recorded as task_distribution_drifts and in the tier note, not as
        the live-world-state blocker, following audioset; tier 3 forbids that blocker beside
        fully-automatable.
      field: execution.reproducibility_blockers
      source: src-arxiv-1907-06987-v2
      quote: since YouTube videos are deleted or unlisted over time (about 3% per year)
    - check: maintainer DeepMind as an industry-lab. The papers present it as DeepMind's, and the
        dataset page licensed the data in Google Inc.'s name; CVDF and ActivityNet host copies and
        tools. Whether CVDF's mirror makes it a co-maintainer was not settled.
      field: governance.maintainer
    - check: independence not assessed. The maintainers' own I3D baselines appear in every note; the
        challenge entrant lists for 2017, 2018, 2020 and 2021 were not read.
      field: governance.independence_flags
    - check: dataset_licence CC-BY-4.0 rests on a 2023 Wayback capture of the maintainer's page; no
        live page states it now, and the YouTube videos' and CVDF mirror's terms are unstated.
      field: data.dataset_licence
      source: src-deepmind-kinetics-page-wayback
      quote: The kinetics dataset is licensed by Google Inc. under a Creative Commons Attribution
        4.0 International License.
    - check: Kinetics-derived datasets the maintainer page lists beside the editions (AVA-Kinetics,
        Countix, Compressed Kinetics600) are not recorded as variants; they carry other tasks on
        Kinetics videos. Mini-Kinetics and Kinetics-Sounds were not looked at.
      field: lineage
    - check: Saturation is derived and was not set. Kinetics-400 top-1 in the 2026 papers read is
        around 80 to 83%, but the non-exhaustive labels leave the ceiling unknown.
      field: lifecycle

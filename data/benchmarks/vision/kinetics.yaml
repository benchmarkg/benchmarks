# data/benchmarks/vision/kinetics.yaml
#
# P1-S8-T06, vision entry 9. Filled from the four Kinetics papers, each read as the text of its latest arXiv
# PDF with its abstract page: Kinetics-400 (arXiv 1705.06950v1, 2017), Kinetics-600 (1808.01340v1, 2018),
# Kinetics-700 (1907.06987v2, revised 2022) and Kinetics-700-2020 (2010.10864v1, 2020); DeepMind's dataset page
# as the Wayback Machine captured it on 2023-09-21 (the live URL now redirects to deepmind.google's home page);
# the Common Visual Data Foundation's kinetics-dataset README, pinned to a commit, with its S3 readme and test
# list for Kinetics-700-2020; the ActivityNet repository's Kinetics downloader README and Kinetics scoring
# script, pinned to a commit; the ActivityNet challenge's Kinetics task pages for 2019, 2020 and 2021; and two
# 2026 papers reporting Kinetics-400 accuracy (arXiv 2611.05633v1 and 2609.40347v1). Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the Kinetics family. Kinetics-400, -600, -700 and -700-2020 are editions of one dataset from
# one maintainer, with the same task, new clips and a larger class list each time; the 2020 note itself calls
# them editions. The ActivityNet challenge's Kinetics task (2017-2021) is a subset with its 2021 tracks as
# children. Kinetics-derived datasets (AVA-Kinetics, Countix, Mini-Kinetics and the like) are not covered.

id: kinetics
name: Kinetics
aliases:
  - DeepMind Kinetics
  - Kinetics Human Action Video Dataset
  - Kinetics-400
  - Kinetics-600
  - Kinetics-700
  - Kinetics-700-2020
tagline: DeepMind's human action benchmark of 10-second YouTube clips in 400 to 700 classes, scored
  by top-1 and top-5 accuracy.
description: >
  A series of human action video classification datasets from DeepMind, each a list of about ten-second
  clips cut from distinct YouTube videos and labelled with one action class after Amazon Mechanical Turk
  workers confirmed it. Kinetics-400 (2017) has 400 classes and 306,245 clips; Kinetics-600 (2018), 600
  classes and 495,547 clips; Kinetics-700 (2019), 700 classes and 650,317 clips; and Kinetics-700-2020
  replenished the rarest classes to at least 700 clips each. Each edition has train, validation and test
  splits, and the score is top-1 and top-5 accuracy on held-out clips; the ActivityNet challenge ran it
  as its trimmed-video task from 2017 to 2021, ranked by the mean of top-1 and top-5 error. The maintainers
  distribute YouTube identifiers and time spans, not videos, so clips vanish as videos are removed (about
  3% a year). The Common Visual Data Foundation mirrors the videos. Papers mostly report top-1 accuracy
  on the Kinetics-400 validation split.
self_description:
  source: src-arxiv-1705-06950
  quote: We describe the DeepMind Kinetics human action video dataset.
external_ids:
  arxiv: '1705.06950'
paper:
  title: The Kinetics Human Action Video Dataset
  arxiv: '1705.06950'
  doi: 10.48550/arXiv.1705.06950
  version_read: v1
  source: src-arxiv-1705-06950-v1
released: 2017-05-19
released_note: The Kinetics-400 paper's first and only arXiv version, as its abstract page dates it.
  DeepMind's dataset page dated its publication 2017-05-22 ("Published May 22, 2017",
  src-deepmind-kinetics-page-wayback).
released_source: src-arxiv-1705-06950
released_quote: Submitted on 19 May 2017

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/video-understanding
domain_basis:
  reason: Each item is a short video clip, and what is scored is the one action label recovered from
    it, with no language to correspond to. That is video-understanding's case (action recognition),
    and under 02 S11 rule 12 the class name is the label, not a text the clip is matched against.
  source: src-deepmind-kinetics-page-wayback
  quote: Each clip is human annotated with a single action class and lasts around 10 seconds.
domain_considered_and_rejected:
  - term: multimodal/video-language
    reason: No question, caption or description is scored against the video. The challenge's metric
      compares predicted class labels with the one ground-truth label, which video-language's own
      distinction leaves with vision/video-understanding.
    source: src-activitynet-2019-kinetics-task
    quote: Please take into account that only 5 predictions are allowed per video.
  - term: vision/classification
    reason: The labels are whole-item classes, but the items are videos, and the leaf for
      recognising actions across a video's temporal extent is video-understanding; classification is
      defined over images.
  - term: audio-speech/audio-event-understanding
    reason: The clips keep their soundtrack and the maintainers mention multimodal use, but the
      score is the human action class, not a sound event. Audio was allowed as an input in the 2021
      challenge, which leaves it an input only.
    source: src-arxiv-1705-06950-v1
    quote: the clips also contain sound so the dataset can potentially be used for many purposes,
      including multi-modal analysis
capability:
  - perception
capability_basis:
  perception:
    reason: The input is a raw video clip and the score is whether the human action recovered from
      it matches the clip's label.
    source: src-arxiv-1705-06950-v1
    quote: The dataset is focused on human actions (rather than activities or events).
capability_considered_and_rejected:
  - term: temporal-reasoning
    reason: Some classes need motion to tell apart, but correctness never depends on when things
      happened relative to one another. The maintainers say the collection favours actions that last
      the whole clip over ones with a beginning, middle and end.
    source: src-arxiv-1907-06987-v2
    quote: It is very well suited to continual actions that exist over the length of the video
  - term: transfer-learning
    reason: Kinetics-pretrained models are carried to other video datasets, but that transfer is
      scored on those datasets. The maintainers' 2020 note only expects Kinetics to become a
      downstream task.
    source: src-arxiv-2010-10864-v1
    quote: Kinetics may eventually become, in turn, a good downstream task itself
  - term: distribution-shift-generalization
    reason: The 2021 challenge's self-supervised track trained on a subset of classes to test out of
      domain generalisation, but that is one track (a subset), not the headline.
    source: src-activitynet-2021-kinetics-task
    quote: to test for out of domain generalization

evaluation_method:
  - exact-match
evaluation_method_basis:
  reason: Each clip has one ground-truth label and a prediction is right or wrong. Top-1 asks
    whether the first label equals it and top-5 whether any of five does, and the score is the mean
    over clips. The paper prefers top-5 because a clip can show actions it is not labelled with. The
    challenge averaged the top-1 and top-5 errors, one method at two values of k, which is not
    composite.
  source: src-arxiv-1705-06950-v1
  quote: a top-5 measure is more suitable than top-1
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: Top-1 and top-5 accuracy are means of per-clip verdicts, which the term's exclusion
      sends to exact-match; no statistic of the whole confusion matrix is reported.
  - term: composite
    reason: The challenge's ranking figure averages top-1 and top-5 error, both the same per-clip
      verdict at different k, which composite's exclusion test keeps out.
    source: src-arxiv-1808-01340-v1
    quote: The performance criterion used in the challenge is the average of Top-1 and Top-5 error.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_note: The 2021 challenge scored uploaded 512-dimensional features through a
  linear classifier the organisers trained, including self-supervised representations; no subject
  term holds a frozen encoder scored through a trained probe (the gap logged for superb,
  2026-10-10-superb-002).
designed_for_subjects_basis:
  reason: The entrants are video classifiers trained on the edition's own training split and run on
    its held-out clips; the release baselines are trained from scratch on it.
  source: src-arxiv-1705-06950-v1
  quote: For the experiments on the Kinetics dataset all three architectures are trained from
    scratch using Kinetics.
as_used:
  - protocol: Top-1 accuracy on the Kinetics-400 validation split, the clips still downloadable,
      after training on the Kinetics-400 training split from ImageNet-1k initial weights, averaged
      over 4 x 3 test views.
    split: val
    source: src-arxiv-2611-05633-v1
    quote: Kinetics-400 (K400) [23] comprises approximately 240k training videos and 20k validation
      videos across 400 action classes.
    note: The paper counts about 240k training and 20k validation videos, against 246,245 and 20,000
      at release (src-arxiv-2010-10864-v1), so it scores the surviving clips. Its accuracy is
      computed by the authors on public labels; no server is involved.
  - protocol: Self-supervised pretraining on the Kinetics-400 training videos, then fine-tuning on
      its labels, with top-1 accuracy over 5 clips x 3 crops per video, averaged across two seeds.
    source: src-arxiv-2609-40347-v1
    quote: Our VideoMSN is initialized from pretrained image ViT weights followed by pretraining and
      fine-tuning on Kinetics-400.
    note: The split is not named in the text read; the hyperparameter sweep was chosen on the full
      validation set.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. A November 2026 paper reports Kinetics-400 top-1
    accuracy for its models beside UCF101, HMDB51 and Diving48, and a September 2026 self-supervised
    paper does the same. The ActivityNet challenge's Kinetics task last ran in 2021, which goes to
    activity (ADR-0019).
  source: src-arxiv-2611-05633-v1
  quote: VideoMogaNet achieves performance on par with or better than state-of-the-art action
    recognition approaches across multiple video benchmarks (UCF101, HMDB51, Kinetics-400, Diving48)
activity: unknown
activity_note: The challenge pages run from 2017 to 2021. The 2022 workshop's index names no
  Kinetics task (its Kinetics page is an unchanged copy of 2021's), and the 2023 and later challenge
  pages return 404, so no round is scheduled. Whether the evaluation server still scores the
  held-out test sets could not be read; its page shows only a registration and sign-in form, and no
  account was made.
activity_basis:
  reason: The route that would show the current state, the ActivityNet evaluation server for the
    held-out test sets, sits behind a login. The Kinetics-400 and -600 test labels have been public
    since 2018, and for Kinetics-700 the maintainers send researchers to the public validation
    split.
  source: src-arxiv-1907-06987-v2
  quote: We encourage researchers to report results on the standard validation set

events:
  - name: Kinetics challenges at the ActivityNet workshop, CVPR 2017 and 2018
    kind: Yearly challenge on the current edition's held-out test set, Kinetics-400 in 2017 and
      Kinetics-600 in 2018
    source: src-arxiv-1808-01340-v1
    quote: The second challenge occurred at the ActivityNet workshop in CVPR 2018, this time using
      Kinetics-600.
  - name: Kinetics challenge 2019 (ActivityNet Task A, Trimmed Action Recognition)
    kind: Yearly challenge on Kinetics-700's held-out test set, 15 teams
    source: src-arxiv-1907-06987-v2
    quote: The 2019 challenge featured the new Kinetics-700 dataset and had 15 participating teams.
  - name: Kinetics challenge 2020 (ActivityNet Task B)
    kind: Yearly challenge on Kinetics-700
    source: src-activitynet-2020-kinetics-task
    quote: Task B – Kinetics Challenge The goal
  - name: Kinetics-700 Challenge 2021 (ActivityNet)
    kind: Yearly challenge on Kinetics-700-2020 in a supervised and a self-supervised track
      (subsets)
    source: src-activitynet-2021-kinetics-task
    quote: 'The Kinetics 2021 challenge will have two tracks: supervised and self-supervised classification.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: I3D (RGB), the maintainers' baseline on Kinetics-600
    source: src-arxiv-1808-01340-v1
    observed_on: 2026-11-08
    quote: As a baseline model we used I3D
  - system: JD AI Research's winning entry, Kinetics challenge 2019
    source: src-arxiv-1907-06987-v2
    observed_on: 2026-11-08
    quote: The top team was from JD AI Research and obtained 17.9% error
  - system: VideoMogaNet-L
    source: src-arxiv-2611-05633-v1
    observed_on: 2026-11-08
    quote: VideoMogaNet-L reaches 81.3%, surpassing our baseline
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: One action label per clip, accepted after Mechanical Turk workers
  confirmed it. The Kinetics-400 and -600 test labels were released in 2018; Kinetics-700's test
  labels, the Kinetics-600 held-out test set's and (on the CVDF copy) Kinetics-700-2020's stay with
  the maintainers, while every validation split's labels are public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The clip lists and labels are public, the ActivityNet downloader fetches the clips from
    YouTube and CVDF mirrors two editions' videos, so anyone can train and score a classifier on a
    validation split, or on Kinetics-400's or -600's test split. A past paper's clip set cannot be
    rebuilt exactly, since clips have vanished since.
  source: src-github-cvdf-kinetics-readme
  quote: CVDF currently hosts the videos in the Kinetics-400 and Kinetics-700-2020 datasets.

task:
  exists: true
  input:
    - one clip of about 10 seconds from a YouTube video, at its own resolution and frame rate, with
      its soundtrack
  output: Up to five of the edition's action classes (400, 600 or 700), ranked by confidence.
  scoring: Top-1 and top-5 accuracy over the evaluation clips against each clip's one label; the
    challenge ranked by the mean of top-1 and top-5 error.
  task_distribution_drifts: true
  task_distribution_drifts_note: The scored set shrinks as YouTube videos are deleted or made
    private. By 14 October 2020, 89% of Kinetics-400's test clips (35,400 of 40,000) and 90% of its
    validation clips (18,059 of 20,000) were still online, and the Kinetics-700 note puts YouTube's
    losses at about 3% a year. CVDF's Kinetics-700-2020 test list holds the 64,535 of 67,858 test
    clips it could download in 2020.
  task_distribution_drifts_source: src-arxiv-2010-10864-v1
  task_distribution_drifts_quote: Building datasets of realistic videos from YouTube presents the
    challenge of dealing with video disappearance
  source: src-activitynet-2019-kinetics-task
  quote: and the winner of the challenge will be selected based on the average of these two errors

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The maintainers distribute YouTube identifiers, time spans and labels, not videos;
    the ActivityNet downloader fetches the clips from YouTube, and CVDF mirrors the Kinetics-400 and
    Kinetics-700-2020 videos (its README also gives download scripts for Kinetics-600). ADR-0020
    rules pointer-only media fully-open with a note and puts the vanishing clips with
    reproducibility. The headline is computed on public labels, a validation split or Kinetics-400's
    test split. The challenge's held-out test sets (Kinetics-600's extra set, Kinetics-700's test
    set) withheld their labels.
  access_basis:
    reason: For Kinetics-700 the maintainers point researchers to the public validation split, and
      Kinetics-400's and -600's test labels were released with the 2018 note, so every split behind
      a reported number downloads without an account.
    source: src-arxiv-1808-01340-v1
    quote: This publication coincides with the release of the test set annotations for both
      Kinetics-400 and Kinetics-600
  refresh: versioned-releases
  refresh_basis:
    reason: The data changed in named editions (400, 600, 700, 700-2020), and later corrections to
      the mirrored videos came as dated notes in the CVDF README.
    source: src-github-cvdf-kinetics-readme
    quote: 4th of August 2021 -- replaced corrupted videos in the kinetics-700-2020 test set
  data_provenance:
    - web-scraped
    - crowd-authored
  data_provenance_note: Candidate videos were matched to class names through YouTube titles (and,
    from Kinetics-600, queries in Portuguese and later French and Spanish), clips were placed by
    image classifiers, and Mechanical Turk workers confirmed the action; at least three of five
    confirmations were needed (src-arxiv-1705-06950-v1).
  data_provenance_source: src-arxiv-1705-06950-v1
  data_provenance_quote: Videos are drawn from the YouTube corpus by matching video titles with the
    Kinetics actions list.
  contamination_risk: medium
  contamination_risk_note: The evaluation clips are public YouTube videos with public labels, so
    web-scale video pretraining can include them, and no source read assesses that. The editions
    also overlap. Many Kinetics-600 validation and test clips are in Kinetics-700's training split,
    and CVDF warns that the Kinetics-400 validation set is largely inside it ("the k400 validation
    set is largely part of the k700 training set so results will not be meaningful",
    src-github-cvdf-kinetics-readme), so a model trained on a later edition is contaminated for an
    earlier one.
  contamination_risk_source: src-arxiv-1907-06987-v2
  contamination_risk_quote: It is however not safe to train on Kinetics-700 and then evaluate on
    Kinetics-600
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No human accuracy is reported. Annotation is not exhaustive, since a
    clip can show other classes' actions under one label, which bounds top-1 below 100% by an
    unmeasured amount.
  ceiling_anchor_type_basis:
    reason: The paper says clips are labelled for one action even where they show two, and moves to
      top-5 for that reason; it reports no human or ceiling figure.
    source: src-arxiv-1705-06950-v1
    quote: clips do not have complete (exhaustive) annotation
  dataset_licence: CC-BY-4.0
  dataset_licence_note: Read on the 2023 Wayback capture; the live page is gone. The licence covers
    the released lists and labels. The videos stay on YouTube under their uploaders' terms, which no
    source read discusses, and nor do the terms of CVDF's mirror.
  dataset_licence_source: src-deepmind-kinetics-page-wayback
  dataset_licence_quote: The kinetics dataset is licensed by Google Inc. under a Creative Commons
    Attribution 4.0 International License.
  upstream_licences: null
  upstream_licences_note: The sources read do not state the YouTube videos' own terms or the basis
    on which CVDF hosts copies.
  size:
    - count: 20000
      unit: validation clips (50 per class), labels released
      subset: Kinetics-400
      note: The split current papers report on (as_used); 18,059 were still online on 2020-10-14.
      source: src-arxiv-2010-10864-v1
      quote: '# clips 246,245 20,000 40,000 392,622 30,000 60,000 545,317 35,000 70,000 545,793 34,256
        67,858'
    - count: 40000
      unit: test clips (100 per class), labels released in 2018
      subset: Kinetics-400
      source: src-arxiv-2010-10864-v1
      quote: '# clips 246,245 20,000 40,000 392,622 30,000 60,000 545,317 35,000 70,000 545,793 34,256
        67,858'
    - count: 306245
      unit: clips, each from a different YouTube video
      subset: Kinetics-400, all splits
      source: src-arxiv-1705-06950-v1
      quote: The current version has 306,245 videos
    - count: 495547
      unit: clips (392,622 training)
      subset: Kinetics-600, all splits
      source: src-arxiv-1808-01340-v1
      quote: around 50 392,622 495,547 600
    - count: 650317
      unit: clips (545,317 training)
      subset: Kinetics-700, all splits
      source: src-arxiv-1907-06987-v2
      quote: 545,317 650,317 700
    - count: 67858
      unit: test clips (labels not on the CVDF copy)
      subset: Kinetics-700-2020
      note: 34,256 validation and 545,793 training clips in the same table. CVDF's test list holds
        the 64,535 it downloaded.
      source: src-arxiv-2010-10864-v1
      quote: '# clips 246,245 20,000 40,000 392,622 30,000 60,000 545,317 35,000 70,000 545,793 34,256
        67,858'
    - count: 35400
      unit: test clips still on YouTube on 2020-10-14 (89%)
      subset: Kinetics-400
      source: src-arxiv-2010-10864-v1
      quote: '# clips 14-10-2020 220,033 18,059 35,400'

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: DeepMind (Google DeepMind)
  maintainer_basis:
    reason: The papers present it as DeepMind's dataset, DeepMind funded each edition's collection,
      and its open-source page distributed the lists and labels. The CVDF repository mirrors the
      videos and the ActivityNet repository hosts the downloader and scorer, but neither is said to
      maintain the editions.
    source: src-arxiv-1705-06950-v1
    quote: The collection of this dataset was funded by DeepMind.
  maintainer_type: industry-lab
  submission_process:
    - held-out-server
  submission_process_note: From 2017 to 2021 challenge entrants uploaded up to five ranked labels
    per clip (in 2021, feature vectors) and the ActivityNet evaluation server scored them against
    withheld labels. Since the 2018 release of the Kinetics-400 and -600 test labels, and for
    Kinetics-700's validation split, papers compute and report their own numbers, which is how the
    benchmark is used now (as_used).
  submission_process_source: src-arxiv-1808-01340-v1
  submission_process_quote: and also created an additional held-out test set for the purpose of the
    Activity-Net Challenge
  independence_flags: []
  independence_flags_note: Not assessed. The maintainers publish their own I3D baselines on each
    edition, and the 2019 winner was JD AI Research, but the winners and entrant lists of the other
    rounds were not read, so whether a maintainer-affiliated team entered a round is not known.
  independence_assessed: false
  funding:
    source: src-arxiv-1705-06950-v1
    quote: The collection of this dataset was funded by DeepMind.
  known_limitation:
    source: src-arxiv-2010-10864-v1
    quote: Building datasets of realistic videos from YouTube presents the challenge of dealing with
      video disappearance
  known_limitation_note: Clips vanish from YouTube, so the scored set differs by lab and year
    (task.task_distribution_drifts). Annotation is one label per clip and not exhaustive.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: >
    A fresh run is automatic end to end: fetch the clips still on YouTube or the CVDF mirror, train, and
    compute top-1 and top-5 on a split with public labels. The evaluation set shrinks as videos vanish,
    so a past run cannot be repeated on the same clips, which is live-world-state's case, but tier 3 forbids
    that blocker beside fully-automatable, as on audioset (Stage 3's audioset-008 abstained on the conflict).
    Scores on the held-out test sets of the challenges needed the maintainers' server.
  reproducibility_tier_basis:
    reason: The lists, labels and downloader are public and no human, physical or maintainer-only
      step enters a validation-split or Kinetics-400 test score.
    source: src-github-activitynet-kinetics-crawler-readme
    quote: pip install --upgrade youtube-dl
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: ActivityNet Evaluation toolkit, the Python 2 scripts get_kinetics_performance.py and
    eval_kinetics.py
  harness_note: The challenge pages name it as the evaluation server's code. It reports top-k error
    for k = 1 and k = 5 on a JSON of up to five scored labels per clip. Papers mostly compute
    accuracy in their own training code.
  harness_source: src-activitynet-2019-kinetics-task
  harness_quote: The evaluation code used by the evaluation server can be found here
  submission_channel:
    source: src-activitynet-2019-kinetics-task
    quote: The evaluation code used by the evaluation server can be found here
  submission_channel_note: The ActivityNet challenge's evaluation server
    (activity-net.org/challenges/<year>/evaluation.html). Its page shows only a registration and
    sign-in form, so whether it still scores could not be checked.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for activitynet/ActivityNet reports MIT, and the
    downloader's directory carries its own MIT licence file; read 2026-11-08, not a quoted fact.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and split a number is on (Kinetics-400 val or test, -600, -700,
  # -700-2020) and how many of its clips the lab could still download, and what the model saw in training:
  # ImageNet or other pretraining, self-supervised pretraining, and above all a later edition's training split,
  # which contains earlier editions' evaluation clips. The number of test views (clips x crops) also changes a
  # number and has no condition field.
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://www.deepmind.com/open-source/kinetics
homepage_note: The maintainer's page, read on its 2023-09-21 Wayback capture; the Wayback index
  shows it answering with a redirect from January 2025, and on 2026-11-08 it redirected to
  deepmind.google's home page. The lists and labels are linked from it on storage.googleapis.com.
repository: https://github.com/activitynet/ActivityNet
dataset_url: https://github.com/cvdfoundation/kinetics-dataset

versions:
  - version: '400'
    label: Kinetics-400
    version_kind: edition
    released: 2017-05-19
    items: 40000
    changes: The first edition, 400 classes with 400 to 1,150 clips each, split 250-1,000 train, 50
      validation and 100 test clips per class. The test labels were withheld for the 2017 challenge
      and released in 2018.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-1705-06950-v1
      - src-arxiv-1705-06950
      - src-arxiv-2010-10864-v1
  - version: '600'
    label: Kinetics-600
    version_kind: edition
    released: 2018-08-03
    items: 60000
    changes: 600 classes with at least 600 clips each and multilingual queries (English and
      Portuguese). 368 of the 400 classes carried over unchanged and the rest were renamed, split or
      dropped. Some Kinetics-400 validation clips moved into the test set, and an extra held-out
      test set (about 50 clips per class) served the 2018 challenge.
    breaking: true
    supersedes_version: '400'
    frozen: true
    sources:
      - src-arxiv-1808-01340-v1
      - src-arxiv-1808-01340
      - src-arxiv-2010-10864-v1
  - version: '700'
    label: Kinetics-700
    version_kind: edition
    released: 2019-07-15
    items: 70000
    changes: 700 classes, 597 of Kinetics-600's 600 kept, queries in four languages, and
      crowdsourced final cleaning. A fresh test set with withheld labels; the maintainers send
      researchers to the validation split. Many Kinetics-600 evaluation clips are in its training
      split. The paper's v2 (2022-10-17) added that warning.
    breaking: true
    supersedes_version: '600'
    frozen: true
    sources:
      - src-arxiv-1907-06987-v2
      - src-arxiv-1907-06987
      - src-arxiv-2010-10864-v1
  - version: 700-2020
    label: Kinetics-700-2020
    version_kind: edition
    released: 2020-10-21
    items: 67858
    changes: The same 700 classes, with the 123 rarest topped up to at least 700 clips and
      duplicates removed. The maintainers call it the 2020 edition. It is the edition of the 2021
      challenge and one of the two CVDF mirrors.
    breaking: true
    supersedes_version: '700'
    frozen: true
    sources:

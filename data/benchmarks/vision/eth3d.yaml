# data/benchmarks/vision/eth3d.yaml
#
# P1-S8-T06, vision entry 10. Filled from the two papers that define the benchmark, read as their CVF open-access
# PDFs: the stereo paper (CVPR 2017), with Crossref's record of its IEEE DOI for the venue, and the BAD SLAM paper
# (CVPR 2019) that added the SLAM benchmark; seven pages of www.eth3d.net (home, stereo overview and documentation,
# SLAM overview and documentation, changelog and imprint; scripts and styles stripped) and the high-res
# multi-view leaderboard's header (the page is withheld from archiving because its rows name authors); the
# README and LICENSE.txt of the ETH3D/multi-view-evaluation repository and the README of ETH3D/dataset-pipeline,
# each at a pinned commit; and four papers of 2025-2026 that report on the benchmark: the v3 PDF of WAFT-Stereo
# (arXiv 2603.24836, two-view test submissions), the v1 PDF of Pow3R-SLAM (arXiv 2609.38054, SLAM training
# sequences), the v1 PDF of DiffMVS (arXiv 2509.15220, high-res multi-view) and the abstract page of Marigold V2
# (arXiv 2609.08084, monocular depth). robots.txt disallows the result detail pages, the CSV exports and the
# leaderboards with query parameters, none of which was read; the submission pages need a login and were not
# opened. Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the ETH3D family: the stereo benchmark's three scenarios and the SLAM benchmark are subsets of one
# entry on one site with one submission system, the October 2017 test-set replacement is an edition, and the
# 2019 SLAM addition is a track-set version.

id: eth3d
name: ETH3D
aliases:
  - ETH3D SLAM & Stereo Benchmarks
tagline: Multi-view and two-view stereo and SLAM on real scenes, scored against laser scans and
  motion capture by a server.
description: >
  A benchmark from ETH Zurich for dense stereo reconstruction from real indoor and outdoor scenes, with
  ground truth geometry from a laser scanner (CVPR 2017). It has three stereo scenarios: high-resolution
  multi-view stereo on 24-megapixel DSLR images, low-resolution many-view stereo on videos from a four-camera
  rig, and low-resolution two-view stereo on rectified frames of the same rig. Calibrated cameras are
  given. Multi-view reconstructions are submitted as point clouds and scored by accuracy, completeness
  and their F1 score against the laser scan over thresholds from 1 cm to 50 cm, with 2 cm the default;
  two-view disparity maps are scored by the Middlebury bad-pixel and error metrics. A SLAM benchmark was
  added in 2019 with the BAD SLAM paper: RGB-D, stereo and monocular visual-inertial video from synchronised
  global-shutter cameras, with motion-capture ground truth, scored by trajectory error. Training ground
  truth is public; test ground truth is withheld and scored by an online server, which also asks for each
  method's runtime. In October 2017 the test set was replaced by new scenes and the first test set became
  training data. Learned stereo and MVS networks now enter beside classical PatchMatch pipelines, and
  papers
  also reuse the data for monocular depth and offline SLAM evaluation.
self_description:
  source: src-cvf-eth3d-mvs-cvpr2017-pdf
  quote: Motivated by the limitations of existing multi-view stereo benchmarks, we present a novel
    dataset for this task.
paper:
  title: A Multi-View Stereo Benchmark with High-Resolution Images and Multi-Camera Videos
  doi: 10.1109/cvpr.2017.272
  source: src-cvf-eth3d-mvs-cvpr2017-pdf
released: 2017-07-19
released_note: The site's news list dates the dataset's initial release; the paper appeared at CVPR
  2017 (21-26 July 2017).
released_source: src-eth3d-site
released_quote: '2017-07-19: Initial release of the dataset.'
release_venue: CVPR 2017
release_venue_source: src-crossref-10-1109-cvpr-2017-272
release_venue_quote: '"event":{"name":"2017 IEEE Conference on Computer Vision and Pattern Recognition
  (CVPR)","location":"Honolulu, HI","start":{"date-parts":[[2017,7,21]]}'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/multi-view-stereo
  secondary:
    - vision/depth-geometry
domain_basis:
  reason: The benchmark was built to evaluate stereo algorithms with calibrated views given, and two
    of its three stereo scenarios score dense multi-view reconstructions against laser scans, which
    is the multi-view-stereo leaf. The two-view scenario scores a disparity per pixel of a rectified
    pair, which is depth-geometry, secondary. The SLAM benchmark scores camera trajectories, for
    which no vision leaf exists; its subset carries 3d-reconstruction as the nearest leaf and the
    gap is logged (see review_checks). Nothing is scored against language, so the multimodal
    boundary (02 S11 rule 12) is not in question.
  source: src-cvf-eth3d-mvs-cvpr2017-pdf
  quote: Our benchmark consists of three scenarios corresponding to different tasks for (multi-view)
    stereo algorithms
domain_considered_and_rejected:
  - term: vision/3d-reconstruction
    reason: The 3d-reconstruction leaf's own note keeps multi-view stereo apart as benchmarked with
      calibrated views given, and ETH3D gives each scene's calibration, unlike Tanks and Temples,
      which withholds it and scores complete SfM+MVS pipelines. The site does call the scenarios a
      3D reconstruction benchmark; the SLAM subset uses the leaf as its nearest (see review_checks).
    source: src-eth3d-documentation
    quote: The calibration is provided in the format of the COLMAP Structure-from-Motion program.
  - term: vision/image-matching-correspondence
    reason: The two-view scenario matches pixels between the images of a rectified pair, but the
      scored quantity is the disparity map against laser-scan ground truth, which is depth-geometry;
      no correspondence set is scored.
    source: src-eth3d-documentation
    quote: The two-view datasets provide stereo-rectified image pairs
  - term: multimodal/visual-qa
    reason: The rejected family under 02 S11 rule 12. The inputs are images and video and the scored
      outputs are point clouds, disparity maps and trajectories; no language enters the input or the
      score.
  - term: robotics-embodiment/navigation
    reason: The SLAM benchmark was recorded with a hand-held camera rig and scores trajectories
      estimated from the recorded video; no agent acts or moves through an environment.
    source: src-eth3d-slam-overview
    quote: can be used to evaluate visual-inertial mono, stereo, and RGB-D SLAM
capability:
  - perception
capability_basis:
  perception:
    reason: Every scenario scores how accurately geometry, depth or camera motion was recovered from
      images of a real scene, against a laser scan or motion capture of it.
    source: src-eth3d-overview
    quote: Ground truth geometry has been obtained using a high-precision laser scanner.
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Thoroughly spatial, but the scored quantity is reconstruction accuracy, which the term's
      exclusion test sends to perception, as for Tanks and Temples.
  - term: distribution-shift-generalization
    reason: The paper argues its varied scenes reward general solutions, and learned stereo and MVS
      networks are now entered zero-shot after synthetic or DTU training, but the benchmark defines
      no shifted condition of its own; training on its public training data is allowed.
    source: src-arxiv-2509-15220-v1
    quote: Both sets are commonly used to test the zero-shot generalization ability of
      learning-based MVS methods
  - term: generation-fidelity
    reason: Reconstructions are compared with a target, but they are recovered from images of the
      same scene and scored against a measurement of it, which is perception, as for Tanks and
      Temples.

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: The multi-view score is accuracy and completeness computed per voxel against the laser
    scan, with unobserved space modelled from the scanner's beams and only scan points seen in two
    images used, and their F1 score at a distance threshold; the two-view score is the Middlebury
    bad-pixel rates; the SLAM score is SE(3) ATE RMSE. Each is a measure defined within its field
    (see review_checks).
  source: src-cvf-eth3d-mvs-cvpr2017-pdf
  quote: Only laser scan points visible in at least two images are used for evaluation.
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: F1 is in its list, but here it is computed from point-to-point distances to a laser scan
      at a threshold, not from predicted labels, as the term's Tanks and Temples near miss records.
    source: src-eth3d-high-res-multi-view-leaderboard
    quote: 'F1 score [%]: The harmonic mean of accuracy and completeness, used to rank methods based on
      both metrics.'
  - term: statistical-fit
    reason: The two-view board also reports average and RMS disparity error, and the SLAM score is
      an RMSE, but the ranked two-view measure is the bad-pixel rate and ATE RMSE after SE(3)
      alignment is SLAM's own named metric, which the term's exclusion sends to domain-metric.
    source: src-cvf-badslam-cvpr2019-pdf
    quote: we focus on the absolute trajectory RMSE with SE(3) alignment
designed_for_subjects:
  - classical-algorithm
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The 2017 paper evaluates four classical MVS pipelines (PMVS, Gipuma, COLMAP, CMPMVS) and
    five two-view methods, one of them learned (MC-CNN), and releases training scenes with ground
    truth; it argues that its variety matters given the popularity of learning-based methods. The
    2019 SLAM baselines are classical SLAM systems tuned on the training datasets.
  source: src-cvf-eth3d-mvs-cvpr2017-pdf
  quote: The latter is especially important given the popularity of learning-based methods
designed_for_subjects_considered_and_rejected:
  - term: generative-media-model
    reason: Monocular depth models built on image generators (Marigold V2) report on ETH3D's data,
      but they are scored on recovered depth, outside the benchmark's own scenarios (as_used).
  - term: domain-specialist-model
    reason: Stereo, MVS and SLAM are general vision tasks, not ones defined by a scientific,
      clinical or engineering-design discipline.
as_used:
  - protocol: Learned two-view stereo networks trained only on synthetic data are submitted to the
      test server zero-shot, and ablations are scored offline on the public training frames. The
      benchmark allows training on its training data; the zero-shot label is the papers' own, not a
      track of the benchmark.
    split: low-res two-view, test and training
    source: src-arxiv-2603-24836-v3
    quote: We report zero-shot results on ETH3D public benchmark using the model trained exclusively
      on synthetic data
    note: WAFT-Stereo (v3, June 2026), which marks zero-shot submissions as ZS in its figure.
  - protocol: Learned MVS networks trained on DTU and fine-tuned on BlendedMVS are run on the
      high-res multi-view scenes, on both the training set offline and the test set, as a
      generalisation test.
    split: high-res multi-view, training and test
    source: src-arxiv-2509-15220-v1
    quote: we further finetune the DTU-pretrained models on BlendedMVS [44]
    note: DiffMVS and CasDiffMVS (September 2025, IEEE TPAMI). The paper does not say how its
      test-set scores were obtained; the benchmark's test ground truth is held by the server.
  - protocol: Monocular depth estimation. ETH3D images are used as an out-of-distribution test set
      for single-image depth, scored by AbsRel against the laser-scan depth, which is none of the
      benchmark's scenarios and uses no server.
    source: src-arxiv-2609-08084
    quote: with 16-26% improvement in AbsRel over the previous best on KITTI and ETH3D
    note: Marigold V2 (SIGGRAPH Asia 2026), read from its abstract page only; which images and depth
      maps were used is not stated there.
  - protocol: SLAM evaluated offline on a fixed panel of the public training sequences, with no
      test-server submission, beside TUM RGB-D, 7-Scenes and Replica.
    split: SLAM training (16 of 61 sequences)
    source: src-arxiv-2609-38054-v1
    quote: From its 61 training sequences we evaluate a 16-sequence panel which was fixed before any
      runs.
    note: Pow3R-SLAM (September 2026), which also fitted a retrieval codebook on eight other
      training sequences and excluded them from evaluation.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. A June 2026 stereo paper reports
    two-view test submissions, a September 2026 SLAM paper evaluates on the SLAM training sequences,
    and a September 2025 MVS paper reports high-res multi-view training and test results.
  source: src-arxiv-2603-24836-v3
  quote: it achieves the best BP-0.5 on the ETH3D benchmark among all existing submissions
activity: accepting-submissions
activity_note: The benchmark has never run in rounds. The leaderboards were read only through the
  high-res multi-view board's default view; the other boards and the submission pages (behind a
  login) were not read.
activity_basis:
  reason: The documentation still describes how to sign up and submit results for both training and
    test data, and WAFT-Stereo reports a test submission among the existing ones in June 2026. No
    source says the server has closed.
  source: src-eth3d-documentation
  quote: To submit your results, you need to sign up for an account and login.
events:
  - name: Robust Vision Challenge 2018, which included the ETH3D stereo benchmark; the leaderboard
      still marks methods that may take part in the Robust Vision Challenge with a _ROB suffix
    kind: challenge
    source: src-eth3d-overview
    quote: This benchmark was a part of the Robust Vision Challenge 2018.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: WAFT-Stereo
    source: src-arxiv-2603-24836-v3
    observed_on: 2026-11-08
    quote: it achieves the best BP-0.5 on the ETH3D benchmark among all existing submissions
    note: A learned warping-based stereo network on a DepthAnythingV2 backbone, trained on synthetic
      data only and submitted to the low-res two-view test server.
  - system: CasDiffMVS
    source: src-arxiv-2509-15220-v1
    observed_on: 2026-11-08
    quote: our CasDiffMVS achieves the best performance among the learning-based methods on both
      training and test sets
    note: A learned diffusion-based MVS network, on the high-res multi-view scenario.
evaluation_target: mixed
evaluation_target_basis:
  reason: The benchmark was built to evaluate classical stereo and MVS pipelines, which are
    entrants, not baselines, and classical PatchMatch methods still sit beside learned networks on
    the high-res board; DiffMVS reports a traditional method as the one its learned network matches
    on the test set.
  source: src-arxiv-2509-15220-v1
  quote: compared with HPM-MVS [29], the state-of-theart traditional method, CasDiffMVS achieves
    competitive performance on the test set
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Laser scans (Faro Focus X 330) of every stereo scene, with occlusion
  meshes and masks, and motion-capture poses (Structure-from-Motion for five training sequences) for
  SLAM; the test scenes' ground truth is withheld and the training scenes' is public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can download the data, run the published evaluation programs on the training scenes
    and sequences, and submit test results to the server. The test scores themselves come only from
    the server.
  source: src-eth3d-slam-documentation
  quote: For evaluating training results locally, the evaluation program is provided as source code
    (on GitHub).

task:
  exists: true
  input:
    - calibrated, undistorted (or original distorted) DSLR images of one scene, high-res multi-view
    - calibrated video frames from a four-camera rig, low-res many-view
    - a stereo-rectified image pair from the rig, low-res two-view
    - an RGB-D, stereo or monocular video with IMU data, SLAM
  output: A point cloud per scene (PLY) for the multi-view scenarios, a disparity map per frame
    (PFM) for two-view, or a camera trajectory per sequence for SLAM, each with the method's
    runtime, uploaded as one archive.
  scoring: Multi-view point clouds are scored against the laser scan by accuracy, completeness and
    F1 over thresholds from 1 cm to 50 cm, averaged per voxel and per category; two-view disparities
    by bad-pixel rates (0.5 to 4 px), average and RMS error and error quantiles; SLAM trajectories
    by ATE RMSE after SE(3) alignment. A category is averaged and ranked only when every dataset in
    it has a result.
  metric_range:
    - 0
    - 100
  metric_range_note: The range is for the headline multi-view F1 score in percent; the two-view
    bad-pixel rates are also percentages, while the error measures are in pixels and the SLAM error
    in centimetres.
  source: src-eth3d-documentation
  quote: For the multi-view scenarios, results should be provided as binary PLY files having the
    same name as the dataset, with the extension .ply.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: All images and videos are downloadable from the site, and the training scenes and
    sequences come with their laser scans, rendered depth maps or ground-truth poses. The test sets'
    ground truth is never released, and SLAM calibration sequences are given for training datasets
    only.
  access_basis:
    reason: The training ground truth is published and the test ground truth is held by the server.
    source: src-eth3d-documentation
    quote: For the training datasets, the laser scan point clouds and depth maps rendered from these
      point clouds are publicly available.
  refresh: versioned-releases
  refresh_note: Three dated changes, read from the changelog. In October 2017 the stereo test set
    was replaced and a few miscalibrated stereo pairs removed, in April 2018 rendered depth maps
    were added to the training data, and in June 2019 the SLAM benchmark was added. Nothing later is
    recorded.
  refresh_basis:
    reason: The October 2017 extension replaced the whole test set and turned the old one into
      training data.
    source: src-eth3d-changelog
    quote: Those datasets become the new test set, while all previous test set datasets were
      converted to training datasets.
  data_provenance:
    - real-world-instrument
  data_provenance_note: DSLR images (Nikon D3X, 6048x4032) and video from a four-camera
    global-shutter rig for stereo, laser scans for their ground truth; for SLAM a custom rig with
    active-stereo depth and IMUs, and a motion-capture system for the poses. A few images were
    masked for data protection.
  data_provenance_source: src-cvf-eth3d-mvs-cvpr2017-pdf
  data_provenance_quote: We recorded the ground truth scene geometry with a Faro Focus X 330 laser
    scanner.
  contamination_risk: low
  contamination_risk_note: The scored content is the test sets' laser scans and poses, which are
    held by the server. The test images are public, but reconstructing from them is the task. The
    first test set (July to October 2017) is now public training data, so results on it from that
    period are not protected. Uses outside the protocol (as_used) score public training data offline
    and have no such protection.
  contamination_risk_source: src-cvf-badslam-cvpr2019-pdf
  contamination_risk_quote: It includes a training set, a test set without public ground truth, and
    an online evaluation service.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Accuracy, completeness and F1 are percentages and top out at 100. No
    source measures an achievable ceiling, and the ground truth's own error is not stated as a
    bound.
  ceiling_anchor_type_source: src-eth3d-high-res-multi-view-leaderboard
  ceiling_anchor_type_quote: 'F1 score [%]: The harmonic mean of accuracy and completeness, used to rank
    methods based on both metrics.'
  dataset_licence: CC-BY-NC-SA-4.0
  dataset_licence_note: The home page states the licence for "the data provided here", which covers
    both the stereo and the SLAM data.
  dataset_licence_source: src-eth3d-site
  dataset_licence_quote: The data provided here is licensed under the Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International License.
  size:
    - count: 12
      unit: high-res multi-view test scenes (13 training)
      subset: eth3d#high-res-multi-view
      source: src-eth3d-overview
      quote: 13 training and 12 test scenes (data / results) for high-resolution multi-view stereo
        with images recorded by the DSLR camera
    - count: 5
      unit: low-res many-view test videos (5 training)
      subset: eth3d#low-res-many-view
      source: src-eth3d-overview
      quote: 5 training and 5 test videos (data / results) at ca. 13.6 Hz for low-resolution
        many-view stereo on video data recorded with the multi-camera rig
    - count: 20
      unit: low-res two-view test frames (27 training)
      subset: eth3d#low-res-two-view
      source: src-eth3d-overview
      quote: 27 training and 20 test frames (data / results) for low-resolution two-view stereo on
        frames of the multi-camera rig
    - count: 35
      unit: SLAM test sequences (61 training)
      subset: eth3d#slam
      source: src-cvf-badslam-cvpr2019-pdf
      quote: Our SLAM benchmark consists of 61 training and 35 test datasets.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Computer Vision and Geometry Group, ETH Zurich
  maintainer_basis:
    reason: The imprint names the group as the site's maker and points to the current maintainers
      through a contact form; both papers come from ETH Zurich's Department of Computer Science with
      co-authors elsewhere.
    source: src-eth3d-imprint
    quote: This webpage is made by the Computer Vision and Geometry Group of ETH Zurich
  maintainer_type: academic-lab
  submission_process:
    - held-out-server
  submission_process_note: Entrants sign up, upload one archive of results with runtimes, and the
    server scores training and test results; test ground truth is never released. Submitted
    information is visible to the administrators and may be published.
  submission_process_source: src-cvf-eth3d-mvs-cvpr2017-pdf
  submission_process_quote: together with a website for evaluating novel algorithms on a hold out
    test set
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-cvf-badslam-cvpr2019-pdf
      quote: real-world RGB-D SLAM benchmark with a public online leaderboard on a test set for
        which ground truth is withheld
    - flag: maintainer-competes-on-own-benchmark
      source: src-cvf-badslam-cvpr2019-pdf
      quote: On this dataset, ORB-SLAM2 is outperformed by our direct BA approach
  independence_flags_note: The maintainers hold the test ground truth and score every test
    submission. The paper that introduced the SLAM benchmark also introduced BAD SLAM and evaluated
    it on that benchmark against the other SLAM systems; whether BAD SLAM is on the live SLAM board
    was not read. The stereo paper's acknowledgements name partial funding from Google Tango, and no
    source read shows a Google system evaluated, so funded-by-evaluated-party is not set (see
    review_checks).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline scores are on the test sets, which only the server can produce because it
      holds their ground truth. Training-set scores can be reproduced offline with the published
      programs.
    source: src-cvf-badslam-cvpr2019-pdf
    quote: It includes a training set, a test set without public ground truth, and an online
      evaluation service.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: ETH3D multi-view-evaluation (C++, PCL), with the two-view-evaluation and slam-evaluation
    programs, for the training data; Windows binaries are also offered
  harness_source: src-github-eth3d-multi-view-evaluation-readme
  harness_quote: This tool is used for evaluating multi-view reconstruction methods in the [ETH3D
    benchmark](https://www.eth3d.net/).
  submission_channel:
    source: src-eth3d-documentation
    quote: To submit your results, you need to sign up for an account and login.
  submission_channel_note: Submission goes through the site's login and upload pages, which were not
    opened.
  code_licence: BSD-3-Clause
  code_licence_note: For the multi-view evaluation program, from its LICENSE.txt (GitHub's metadata
    reports NOASSERTION). The dataset pipeline is BSD-3-Clause by GitHub's metadata and the
    changelog; the two-view evaluation program's licence was not read.
  code_licence_source: src-github-eth3d-multi-view-evaluation-licence
  code_licence_quote: 'This program is released under the BSD license:'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The profile resolves to eligibility-gated (a domain metric with classical algorithms among the entrants).
  # Within it: which scenario and set were scored (a training split offline or the test set on the server), and
  # what a learned method was trained on (synthetic data only, DTU, BlendedMVS, or ETH3D's own training data),
  # which papers separate in their tables and label as zero-shot. The benchmark has one board per scenario and no
  # training-data tiers, so those two fields are waived.
  material_extra:
    - subset_used
    - training_data_policy
  material_waived:
    - field: eligibility_track
      reason: One leaderboard per scenario, with no track by data or method; the scenario is
        subset_used.
    - field: training_data_eligibility
      reason: The benchmark defines no training-data tiers; what a method trained on is
        training_data_policy.

aggregation_policy: official-aggregate
aggregation_policy_note: Each board averages a method's results over a category of datasets (all,
  indoor, outdoor and the like) and ranks it there; the "all" category of the multi-view boards
  spans both multi-view scenarios. No score spans the multi-view, two-view and SLAM boards.
aggregation_policy_basis:
  reason: Category averages are the official aggregate, computed only for complete categories.
  source: src-eth3d-documentation
  quote: Partial submissions are possible, but we only compute category averages (and therefore rank
    a method in a category) if results for all of the datasets within a category are provided.
secondary_axes:
  - latency
secondary_axes_basis:
  reason: Runtime per dataset is mandatory with every submission and shown on the boards beside the
    score.
  source: src-eth3d-documentation
  quote: we are interested in the methods' runtimes and request these as mandatory information for
    each submission

homepage: https://www.eth3d.net/
repository: https://github.com/ETH3D
dataset_url: https://www.eth3d.net/datasets
leaderboard_url: https://www.eth3d.net/high_res_multi_view

versions:
  - version: 2017-07
    label: Initial release (stereo)
    version_kind: edition
    released: 2017-07-19
    changes: The first release of the stereo benchmark's three scenarios, with the test set of the
      CVPR 2017 paper.
    breaking: true
    superseded_by: 2017-10
    frozen: true
    sources:
      - src-eth3d-site
      - src-cvf-eth3d-mvs-cvpr2017-pdf
  - version: 2017-10
    label: Extension with more data
    version_kind: edition
    released: 2017-10-04
    changes: Adds 12 high-res multi-view, 5 low-res many-view and 20 two-view datasets as a new test
      set and converts every earlier test dataset to training, with ground truth; adds occlusion
      data, IMU measurements and per-frame two-view pairs of the training videos, and removes a few
      stereo pairs with questionable calibration.
    breaking: true
    supersedes_version: 2017-07
    superseded_by: 2019-06
    frozen: true
    sources:
      - src-eth3d-changelog
  - version: 2019-06
    label: SLAM benchmark added
    version_kind: track-set
    released: 2019-06-16
    changes: Adds the SLAM benchmark of the BAD SLAM paper (61 training and 35 test sequences) as a
      fourth board beside the stereo scenarios, which are unchanged.
    supersedes_version: 2017-10
    frozen: true
    sources:
      - src-eth3d-site
      - src-cvf-badslam-cvpr2019-pdf
versions_note: The pre-rendered depth maps added to the multi-view training data on 2018-04-16
  change no scored item and are not a version. No later change is recorded in the changelog read on
  2026-11-08.

subsets:
  - id: eth3d#high-res-multi-view
    label: High-res multi-view stereo (DSLR images)
    items: 12
    evidence:
      - source: src-eth3d-overview
        quote: 13 training and 12 test scenes (data / results) for high-resolution multi-view stereo
          with images recorded by the DSLR camera
    notes: Items are test scenes, 24-megapixel DSLR images with 14 to 76 images per scene; the
      board's default is F1 at 2 cm.
  - id: eth3d#low-res-many-view
    label: Low-res many-view stereo (rig videos)
    items: 5
    evidence:
      - source: src-eth3d-overview
        quote: 5 training and 5 test videos (data / results) at ca. 13.6 Hz for low-resolution
          many-view stereo on video data recorded with the multi-camera rig
    notes: Items are test videos from the four-camera rig at 752x480; scored with the multi-view
      protocol.
  - id: eth3d#low-res-two-view
    label: Low-res two-view stereo (rectified rig pairs)
    items: 20
    domain_override:
      primary: vision/depth-geometry
    capability_override:
      - perception
    evidence:
      - source: src-eth3d-overview
        quote: 27 training and 20 test frames (data / results) for low-resolution two-view stereo on
          frames of the multi-camera rig
      - source: src-cvf-eth3d-mvs-cvpr2017-pdf
        quote: For this scenario, we evaluate the same metrics used in the Middlebury benchmark [32]
    notes: Items are test frames; disparity of the left image is scored with the Middlebury metrics,
      on all pixels and on non-occluded ones.
  - id: eth3d#slam
    label: SLAM (RGB-D, stereo and monocular visual-inertial)
    items: 35
    domain_override:
      primary: vision/3d-reconstruction
    capability_override:
      - perception
    evidence:
      - source: src-eth3d-slam-overview
        quote: 56 training and 35 test datasets were recorded in a motion capturing system which
          provides ground truth poses.
      - source: src-eth3d-slam-documentation
        quote: The benchmark evaluates commonly used absolute and relative trajectory errors.
    notes: Items are test sequences; 5 of the 61 training sequences have Structure-from-Motion
      ground truth instead. The score is camera trajectory error, for which vision has no leaf;
      3d-reconstruction is the nearest (SLAM builds a map and a trajectory) and the gap is logged in
      taxonomy/_failures/. Test sequences come without calibration sequences, so only
      self-calibration is possible on them.
subsets_note: The three stereo scenarios were defined by the 2017 paper and the SLAM benchmark by
  the 2019 paper; all four share the site, the account system and the submission format of one
  archive with runtimes.


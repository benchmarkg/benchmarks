  sources_note: >
    The two papers as CVF open-access PDFs read as text (not DOI-bearing bytes, so archived like web pages),
    with Crossref's record of the 2017 paper's IEEE DOI; seven site pages with scripts and styles stripped;
    the high-res multi-view leaderboard's header, withheld from archiving because its rows name authors;
    the evaluation program's README and licence and the dataset pipeline's README at pinned commits; and
    four 2025-2026 papers (DOIs, not archived) as evidence of current use. robots.txt disallows the result
    detail pages, the CSV exports and the parameterised leaderboard views, none of which was fetched.
  confidence: medium
  review_checks:
    - check: Primary is multi-view-stereo with depth-geometry secondary. Tanks and Temples
        (tanks-and-temples) is the related entry and differs on the point that decides the leaf. It
        withholds calibration and scores complete SfM+MVS pipelines from video (3d-reconstruction
        primary), while ETH3D gives COLMAP calibration and scores binocular stereo and MVS
        (multi-view-stereo primary). ETH3D also adds a two-view scenario, rig video from
        robotics-grade cameras with autoexposure, and SLAM. The ETH3D paper itself calls the two
        benchmarks complementary. 3d-reconstruction as a secondary is the alternative, since the
        site calls the scenarios a 3D reconstruction benchmark.
      field: domain
      source: src-cvf-eth3d-mvs-cvpr2017-pdf
      quote: While our benchmark focuses on evaluating both binocular stereo and MVS, theirs jointly
        evaluates Structure-from-Motion (SfM) and MVS.
    - check: The SLAM subset scores camera trajectories (ATE), for which vision has no leaf;
        3d-reconstruction is carried as the nearest and a missing-term gap was logged (proposed
        vision/visual-slam-odometry). Whether the SLAM benchmark, introduced by a different paper
        with different sensors and ground truth, should be a benchmark of its own rather than a
        subset brought in by a track-set version; same maintainer, same site and same submission
        system argue for the subset.
      field: subsets
      source: src-eth3d-site
      quote: '2019-06-16: Added the SLAM Benchmark.'
    - check: The October 2017 extension is modelled as an edition (new test items for the same task;
        the old test set became training data). Board results submitted before it were on a
        different test set and are not comparable; whether the board kept or re-scored them is not
        shown by the sources read.
      field: versions
      source: src-eth3d-changelog
      quote: We added 12 high-res multi-view datasets, 5 low-res many-view datasets, and 20 two-view
        stereo datasets.
    - check: domain-metric is assigned although its exclusion names F1 and RMSE as general-purpose
        statistics. The multi-view F1 is computed with beam-based free-space modelling and voxel
        normalisation, the two-view rank is Middlebury's bad-pixel rate and SLAM's ATE follows an
        SE(3) alignment, as for Tanks and Temples' F-score; statistical-fit or classification-metric
        are the alternatives.
      field: evaluation_method
      source: src-cvf-eth3d-mvs-cvpr2017-pdf
      quote: We thus discretized the space into voxels with small side length.
    - check: maintainer-competes-on-own-benchmark rests on the BAD SLAM paper, which introduced both
        the SLAM benchmark and its authors' own SLAM system and reports that system winning; whether
        it is listed on the live SLAM board was not read. The 2017 paper's baselines include MVS
        tools whose cited author lists overlap with the benchmark's authors, and the 2025 DiffMVS
        paper shares a senior author with it; neither is flagged, because no source read states the
        relation.
      field: governance.independence_flags
      source: src-cvf-badslam-cvpr2019-pdf
      quote: our proposed algorithm outperforms all other evaluated SLAM methods
    - check: The stereo paper names partial funding from Google Tango (and a Google PhD fellowship
        for its first author). funded-by-evaluated-party is not set, since no source read shows a
        Google system evaluated on the boards.
      field: governance.independence_flags
      source: src-cvf-eth3d-mvs-cvpr2017-pdf
      quote: This project was partially funded by Google Tango.
    - check: Only the high-res multi-view board's default view was read, and it is withheld from
        archiving because its method rows carry author names. The many-view, two-view and SLAM
        boards are unread, so activity rests on the documentation and on WAFT-Stereo's June 2026
        test submission; unknown is the alternative for the SLAM board.
      field: activity
      source: src-eth3d-high-res-multi-view-leaderboard
      quote: 'Tolerance: 2cm 1cm 2cm 5cm 10cm 20cm 50cm'
    - check: Only the 2018 Robust Vision Challenge is evidenced. The board's _ROB suffix suggests
        later rounds drew on the benchmark too, but no Robust Vision Challenge page was read.
      field: events
      source: src-eth3d-high-res-multi-view-leaderboard
      quote: Methods with suffix _ROB may participate in the Robust Vision Challenge.
    - check: The headline uses in 2025-2026 are zero-shot generalisation tests (synthetic-only
        stereo, DTU and BlendedMVS-trained MVS), monocular depth on ETH3D's images and offline SLAM
        on training sequences. The facets follow the design (training data allowed, server-scored
        test sets); whether the zero-shot use should add distribution-shift-generalization, as the
        papers' framing suggests.
      field: capability
      source: src-arxiv-2603-24836-v3
      quote: We follow the benchmark protocols and report BP-0.5, BP-1, and BP-2 on both all pixels
        and non-occluded pixels
    - check: The ground truth was built with the open dataset pipeline, so its construction is
        inspectable, but the pipeline's depth-image registration was not used for the benchmark and
        the laser-scan registration accuracy was assessed only qualitatively in the paper; no
        ceiling below 100 is recorded.

      field: data.dataset_licence
      source: src-cs-nyu-depth-v2
      quote: Labeled dataset (~2.8 GB) Raw dataset, Multi-part (~428 GB) Toolbox
    - check: The support-inference subset has no vision leaf (support relations between regions);
        segmentation is carried as the nearest and a missing-term gap was logged. It is the paper's

  review_checks:
    - check: "Identity. The id follows the allocation rules: \"NYU Depth Dataset V2\" carries a vN, and
        a vN is a version of the same benchmark, so nyu-depth holds V1 and V2 as editions by the same
        maintainers, as the counting convention files a re-issue with new data on the same task. The other
        reading is nyu-depth-v2: V2 is a new recording with its own paper and tasks (support inference),
        it alone is used today, and V1 has its own citation, which the convention's \"independently versioned

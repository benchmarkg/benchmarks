  - version: v1
    label: NYU Depth V1 (ICCV 2011 Workshop on 3D Representation and Recognition)
    version_kind: edition
    items: 2347
    changes: The first release, Kinect RGB-D video of indoor scenes with a labelled subset, a raw
      set, a MATLAB toolbox with a segmentation evaluation function, and train/test splits for
      multi-class segmentation and for classification. The V2 paper counts it as 67 scenes; RGBD20K
      as 2,347 labelled image pairs in 13 categories.
    breaking: true
    superseded_by: v2
    frozen: true
    sources:
      - src-cs-nyu-depth-v1
      - src-arxiv-2609-29028-v1
      - src-cs-nyu-indoor-seg-support-pdf
  - version: v2
    label: NYU Depth V2 (ECCV 2012)
    version_kind: edition
    items: 1449
    changes: A new recording, 464 scenes from three cities, with 1,449 densely labelled frames
      carrying instance numbers and support annotations, and 407,024 raw frames; new tasks of
      support inference and structure classes beside segmentation.
    breaking: true
    supersedes_version: v1
    frozen: true
    sources:
      - src-cs-nyu-depth-v2
      - src-cs-nyu-indoor-seg-support-pdf
      - src-crossref-10-1007-978-3-642-33715-4-54
versions_note: Neither dataset page dates its release; V1 is placed by its 2011 workshop paper and
  V2 by its ECCV 2012 paper. The id question (one entry with two editions, or V2 alone) is a review
  check.

subsets:
  - id: nyu-depth#depth-estimation
    label: Monocular depth estimation (654 test images)
    items: 654
    evidence:
      - source: src-arxiv-2505-09358-v1
        quote: For NYUv2, we utilize the designated test split, comprising 654 images.
      - source: src-arxiv-2610-05029-v1
        quote: Models are trained on the NYU training split and evaluated on the official test split
          using valid ground-truth pixels in [0.001, 10.0] m.
    notes: The headline use. Depth from one RGB frame against the labelled test images' depth, by
      AbsRel, RMSE and threshold accuracy, metric for supervised models and scale-and-shift aligned
      for zero-shot ones. The protocol comes from later papers, not the maintainers. Zero-shot
      surface normal estimation on the same images, against normals derived by another group, is
      reported under this subset's images too (as_used).
  - id: nyu-depth#semantic-segmentation
    label: RGB-D semantic segmentation, 40 classes
    items: 654
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-arxiv-2609-29028-v1
        quote: NYUv2 contains 795 training images and 654 testing images across 40 semantic
          categories
      - source: src-arxiv-2609-29028-v1
        quote: Following standard evaluation protocols, we report mean Intersection-over-Union
          (mIoU), computed as the average IoU across all semantic categories.
      - source: src-arxiv-2504-04701-v1
        quote: (mIoU), which is averaged across all semantic categories, as the primary evaluation
          metric
    notes: Per-pixel classes over 40 categories on the 654 test images, from RGB and depth, scored
      by mean IoU. The 40-class set is a later mapping of the paper's 894 raw classes, by whom is
      not in the sources read.
  - id: nyu-depth#region-segmentation
    label: Hierarchical region segmentation (the paper's)
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-cs-nyu-indoor-seg-support-pdf
        quote: To evaluate our segmentation algorithm, we use the overlap criteria from [8].
      - source: src-cs-nyu-depth-v2
        quote: Due to a bug in the segmentation evaluation, the segmentation results in the paper
          were about 2% higher across the board
    notes: The paper's segmentation into object and surface instances, scored by average overlap of
      each ground-truth region with its best-matching segment, weighted by area or not. The page
      posts corrected scores, about 2 points below the paper's. No 2025-2026 paper read reports it.
  - id: nyu-depth#support-inference
    label: Support inference and structure classes (the paper's)
    domain_override:
      primary: vision/segmentation
    capability_override:
      - perception
      - spatial-reasoning
    evidence:
      - source: src-cs-nyu-indoor-seg-support-pdf
        quote: For each of the 1449 images, support annotations were manually added.
      - source: src-cs-nyu-indoor-seg-support-pdf
        quote: The metric used for evaluation is the number of regions for which we predict a
          correct support divided by the total number of regions which have a support label.
    notes: For each region, the region that supports it (or a hidden one, or none for the floor) and
      whether from below or behind, scored as the share of labelled regions given the correct
      support, type-agnostic and type-aware, on ground-truth or predicted regions; the four
      structure classes (ground, furniture, prop, structure) are scored by accuracy and mean class
      accuracy. Vision has no leaf for support relations; segmentation is the nearest, and the gap
      is logged in taxonomy/_failures/. No 2025-2026 paper read reports it.
subsets_note: The paper defined the region segmentation and support tasks; the depth and 40-class
  segmentation protocols on the 654 test images were set by later papers on the same release and are
  filed as subsets because they share its images and labels (see review_checks).

lineage:
  role: root
lineage_note: V1 and V2 are editions of one entry by 04 S4 and the allocation rules (same
  maintainers, a vN in the name). The 40-class label set, the ground-truth surface normals Marigold
  uses and the monocular depth protocol were made by others on V2's images and are not separate
  benchmarks here. ScanNet's benchmark scores its 3D and 2D labels over a 20-class subset of the
  NYUv2 40-label set (src-scannet-benchmark-documentation, not cited here). Derivatives that relabel
  or include NYU's images were not read.


# data/benchmarks/vision/nyu-depth.yaml
#
# P1-S8-T07, vision entry 21. Filled from the NYU Depth V2 paper (ECCV 2012), read as the text of the PDF the
# dataset page links, with Crossref's record of its Springer DOI for the venue and pages; the NYU Depth V2 and V1
# dataset pages on cs.nyu.edu (scripts and styles stripped; both withheld from archiving because their headers
# name the authors); the v1 PDF of arXiv 1406.2283 (NIPS 2014), the paper whose scene split and error measures
# the monocular depth protocol follows; and four papers of 2025-2026 that report on the dataset: the v1 PDFs of
# Marigold's journal extension (arXiv 2505.09358, zero-shot depth and normals on the 654-image test split),
# DFormerv2 (arXiv 2504.04701, CVPR 2025, RGB-D semantic segmentation), SPACE-CLIPv2 (arXiv 2610.05029, ACCV 2026,
# supervised depth) and RGBD20K (arXiv 2609.29028, which states the 795/654 split and the 40 classes). The labelled
# .mat file, the raw data, the toolbox and the split files were not downloaded, and no dataset image was opened.
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the NYU Depth Dataset, with V1 (2011) and V2 (2012) as editions by the same maintainers. V2 is the
# one in use: monocular depth estimation on its 654 labelled test images is the headline use today, and 40-class
# RGB-D semantic segmentation on the same split is the second. The paper's own tasks, region segmentation and
# support inference, are subsets that few papers now report.

id: nyu-depth
name: NYU Depth Dataset
aliases:
  - NYU Depth V2
  - NYU-Depth V2
  - NYU Depth Dataset V2
  - NYUv2
  - NYU DepthV2
  - NYU Depth V1
tagline: 'Kinect RGB-D frames of 464 indoor scenes: single-image depth and RGB-D segmentation on 654 labelled
  test images.'
description: >
  An RGB-D dataset of indoor scenes recorded with a Microsoft Kinect in commercial and residential buildings
  in three US cities, from New York University (ECCV 2012). Version 2 has 1,449 frames hand-selected from
  the video of 464 scenes, each with aligned RGB and depth (missing depth filled in by colorization),
  a dense per-pixel object labelling with instance numbers obtained through Amazon Mechanical Turk, and
  support annotations saying which region holds up which, from below or from behind; 407,024 unlabelled
  raw frames from the same scenes come with it. The paper scored hierarchical region segmentation by overlap
  with the ground-truth regions, support inference by the share of regions given the correct support,
  and four structure classes. Version 1 (2011) had 2,347 labelled frames from fewer scenes. The maintainers
  publish downloads and a MATLAB toolbox, and no leaderboard or evaluation code for V2. In use the dataset
  is chiefly a monocular depth benchmark: methods are trained on the training scenes' raw frames or on
  other data and scored on 654 labelled test images by AbsRel, RMSE and the share of pixels within a factor
  of 1.25 of the Kinect depth, either metrically or after a least-squares scale-and-shift fit for zero-shot
  models. The same 795/654 split is the standard RGB-D semantic segmentation benchmark over 40 classes,
  scored by mean IoU.
self_description:
  source: src-cs-nyu-indoor-seg-support-pdf
  quote: a new dataset of 1449 RGBD images, capturing 464 diverse indoor scenes, with detailed
    annotations
paper:
  title: Indoor Segmentation and Support Inference from RGBD Images
  doi: 10.1007/978-3-642-33715-4_54
  source: src-cs-nyu-indoor-seg-support-pdf
released: null
released_note: The paper appeared at ECCV 2012 (Lecture Notes in Computer Science vol. 7576, pp.
  746-760). Crossref dates the chapter to 2012 only, and neither the PDF nor the dataset page gives
  a date for the data's release; the conference's dates are not in the sources read.
release_venue: ECCV 2012
release_venue_source: src-crossref-10-1007-978-3-642-33715-4-54
release_venue_quote: '"container-title":["Lecture Notes in Computer Science","Computer Vision \u2013 ECCV
  2012"]'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/depth-geometry
  secondary:
    - vision/segmentation
domain_basis:
  reason: The primary is chosen by what is scored in use. In the 2025-2026 papers read the headline
    use is per-pixel depth estimated from one RGB image and scored against the Kinect depth of the
    654 test images (AbsRel, RMSE, threshold accuracy), and one paper also scores surface normals on
    them; both are depth-geometry's definition. The second use is 40-class RGB-D semantic
    segmentation on the same split, scored by mean IoU, and the paper itself scored region
    segmentation and support inference (its abstract aims to "verify that our 3D scene cues and
    inferred support lead to better object segmentation"). Segmentation would be the primary by the
    paper's design; it is secondary here and the primary of three subsets (see review_checks).
    Nothing is scored against language, so the multimodal boundary (02 S11 rule 12) is not in
    question.
  source: src-arxiv-2610-05029-v1
  quote: NYU Depth V2 [23] is our primary benchmark.
domain_considered_and_rejected:
  - term: vision/3d-reconstruction
    reason: The depth use recovers a depth map per image from a single view and is scored per pixel;
      no scene geometry is reconstructed from several views or scored as a mesh or point cloud.
  - term: robotics-embodiment/navigation
    reason: The paper motivates support inference by robotics, but nothing acts; the scored outputs
      are depth maps, labels and support relations predicted from recorded frames.
    source: src-cs-nyu-indoor-seg-support-pdf
    quote: Many robotics and scene understanding applications require a physical parse of the scene
      into objects, surfaces, and their relations.
capability:
  - perception
capability_basis:
  perception:
    reason: Every use scores what was recovered from a captured frame -- depth or surface normals
      from the RGB image, class labels from the RGB-D pair -- against the Kinect measurement or the
      labels.
    source: src-arxiv-2505-09358-v1
    quote: For NYUv2, we utilize the designated test split, comprising 654 images.
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Applies to the paper's support inference only, where a region's support must be
      inferred, often from a region far away in the image or hidden from view. It is recorded on
      that subset. The depth and segmentation uses score recovery from the signal, which the term's
      exclusion sends to perception.
    source: src-cs-nyu-indoor-seg-support-pdf
    quote: type indicates whether the support is from below (e.g. cup on a table) or from behind
      (e.g. picture on a wall)
  - term: distribution-shift-generalization
    reason: Zero-shot depth models are scored on NYU without having trained on it, and Marigold
      counts it among datasets not seen during training. That is the papers' protocol, not a shifted
      condition the dataset defines; supervised methods train on its own training scenes (as_used).
    source: src-arxiv-2505-09358-v1
    quote: We evaluate Marigold-Depth on 5 real datasets not seen during training.

evaluation_method:
  - statistical-fit
  - domain-metric
evaluation_method_basis:
  reason: The headline depth measures are AbsRel, squared relative error, RMSE in linear and log
    space and the threshold accuracies, errors and ratios against measured depth, which
    statistical-fit names (RMSE, comparable goodness-of-fit statistics on continuous values). The
    segmentation use ranks by mean IoU over 40 classes, which domain-metric names. The threshold
    accuracy, the share of pixels whose predicted-to-true depth ratio is under 1.25, is a
    depth-estimation measure that could also be read as domain-metric (see review_checks).
  source: src-arxiv-1406-2283-v1
  quote: We evaluate each method using several errors from prior works, as well as our
    scale-invariant metric
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: The paper's structure-class score is overall accuracy and the mean diagonal of the
      confusion matrix, a class-averaged accuracy, but it is one small task of the paper and no
      2025-2026 paper read reports it.
    source: src-cs-nyu-indoor-seg-support-pdf
    quote: To evaluate the structure class prediction, we calculate both the overall accuracy and
      the mean diagonal of the confusion matrix.
  - term: exact-match
    reason: The paper's support score is the share of labelled regions given the correct support, a
      mean of per-region verdicts; it is the support subset's measure and no headline.
    source: src-cs-nyu-indoor-seg-support-pdf
    quote: The metric used for evaluation is the number of regions for which we predict a correct
      support divided by the total number of regions which have a support label.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The paper trains its classifiers (logistic regression for support and structure classes, a
    boosted decision tree for region merging) on the labelled images and scores them on held-out
    images; the supervised depth and segmentation networks that use the split today are trained on
    its training scenes and scored as trained.
  source: src-cs-nyu-indoor-seg-support-pdf
  quote: To train Ds, a logistic regression
designed_for_subjects_considered_and_rejected:
  - term: generative-media-model
    reason: Marigold is an image generator (Stable Diffusion) fine-tuned for depth and scored
      zero-shot on NYU, but the score is recovered depth, not a generated image, as for ETH3D's
      Marigold use.
    source: src-arxiv-2505-09358-v1
    quote: Marigold outperforms other methods in this low-data regime on indoor and outdoor scenes
      without access to real depth samples.
  - term: classical-algorithm
    reason: The paper's pipeline includes RANSAC plane fitting and graph cuts, but its scored
      outputs come from classifiers trained on the dataset.
as_used:
  - protocol: Supervised monocular depth. Training on the raw video frames of the 249 training
      scenes, testing on the labelled test images of the other 215 scenes, scored by threshold
      accuracies, absolute and squared relative error, linear and log RMSE and a scale-invariant log
      error. The paper that set this protocol counts the test set as 694 images and trained its
      baselines on the 795 labelled training images.
    split: test, labelled images of the 215 test scenes
    source: src-arxiv-1406-2283-v1
    quote: using 249 scenes for training and 215 for testing, and construct our training set using
      the raw data for these scenes
    note: arXiv 1406.2283 (NIPS 2014), from the same NYU department. Its 694 against the 654 later
      papers give is not explained in the sources read (review_checks).
  - protocol: Supervised metric depth from a frozen CLIP backbone, trained on the NYU training split
      and evaluated on the official test split with valid ground truth between 0.001 and 10 m,
      without median scaling, reported by AbsRel, SqRel, RMSE, RMSE-log, SILog, log10 error and the
      three threshold accuracies.
    split: official test split
    source: src-arxiv-2610-05029-v1
    quote: Models are trained on the NYU training split and evaluated on the official test split
      using valid ground-truth pixels in [0.001, 10.0] m.
    note: SPACE-CLIPv2 (October 2026, ACCV 2026), which compares mainly with its own reproduced
      baseline because prior methods use other protocols.
  - protocol: Zero-shot affine-invariant depth. A model trained on other data (here synthetic only)
      is run on the 654 test images, its prediction aligned to the ground truth by a least-squares
      scale and shift, and scored by AbsRel and the share of pixels within a factor of 1.25.
    split: test, 654 images
    source: src-arxiv-2505-09358-v1
    quote: Following the protocol of affine-invariant depth evaluation [60], we first align the
      estimated merged prediction m to the ground truth d with the least squares fitting.
    note: Marigold's journal extension (May 2025, IEEE TPAMI), among five zero-shot test sets. Its
      ablations use the NYUv2 training split, which it counts as 785 images.
  - protocol: Zero-shot surface normal estimation on the 654 test images, against ground-truth
      normals derived by another group (the paper's reference [82], not read), not by the
      maintainers.
    split: test, 654 images
    source: src-arxiv-2505-09358-v1
    quote: This includes 654 samples from the NYUv2 test split
    note: Marigold-Normals, in the same paper.
  - protocol: RGB-D semantic segmentation over 40 classes on the 795/654 split, scored by mean IoU
      over the classes, with multi-scale flip inference in some papers; the backbone is pretrained
      on RGB-D data and a decoder is fine-tuned on the training images.
    split: test, 654 images (795 training)
    source: src-arxiv-2609-29028-v1
    quote: NYUv2 contains 795 training images and 654 testing images across 40 semantic categories
    note: RGBD20K (September 2026) and DFormerv2 (April 2025, CVPR 2025). The 40-class label set is
      not the paper's (which labels 894 raw classes and four structure classes); its origin is not
      in the sources read.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. An October 2026 depth paper uses it as
    its primary benchmark, a September 2026 segmentation paper reports on it, and 2025 papers score
    zero-shot depth, normals and RGB-D segmentation on it. The maintainers' page, undated and
    unchanged in what it offers, is maintenance evidence, not lifecycle.
  source: src-arxiv-2610-05029-v1
  quote: NYU Depth V2 [23] is our primary benchmark.
activity: no-submission-channel
activity_basis:
  reason: The dataset page offers downloads and a toolbox and no leaderboard, server or results
    page; results appear in their authors' papers, with prior numbers copied from other papers.
  source: src-cs-nyu-depth-v2
  quote: Labeled dataset (~2.8 GB) Raw dataset, Multi-part (~428 GB) Toolbox

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SPACE-CLIPv2
    source: src-arxiv-2610-05029-v1
    observed_on: 2026-11-10
    quote: SPACE-CLIPv2 improves over SPACE-CLIP from 0.123 to 0.119 in AbsRel and from 0.435 to
      0.417 in RMSE.
    note: A depth decoder on a frozen CLIP ViT-B/16, trained on the NYU training split, metric depth
      on the test split.
  - system: DFormerv2-L
    source: src-arxiv-2504-04701-v1
    observed_on: 2026-11-10
    quote: our largest model DFormerv2-L is able to achieve 58.4% mIoU on NYU DepthV2 with 95.5M
      parameters
    note: An RGB-D backbone with geometry self-attention and a lightweight decoder, on 40-class
      semantic segmentation.
  - system: Marigold-Depth v1.1
    source: src-arxiv-2505-09358-v1
    observed_on: 2026-11-10
    quote: For NYUv2, we utilize the designated test split, comprising 654 images.
    note: A Stable Diffusion model fine-tuned on synthetic depth and scored zero-shot, after scale
      and shift alignment.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Kinect depth projected onto the RGB frame, with missing values filled in
  by colorization in the labelled set, for the depth use; per-pixel labels painted by Mechanical
  Turk workers for segmentation; support annotations added by hand. The test images' depth and
  labels are released with the rest of the labelled set.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The labelled set and the raw frames are direct downloads from the dataset page, with no
    registration or agreement shown; anyone can train on the training scenes and score the test
    images. No step needs the maintainers.
  source: src-cs-nyu-depth-v2
  quote: Labeled dataset (~2.8 GB) Raw dataset, Multi-part (~428 GB) Toolbox

task:
  exists: true
  input:
    - one RGB frame (640 x 480) of an indoor scene, for depth or surface normal estimation
    - an aligned RGB and depth frame, for RGB-D semantic segmentation and for the paper's region
      segmentation and support inference
  output: A dense depth map (in metres, or up to scale and shift for affine-invariant models), a
    surface normal map, a class per pixel among 40 classes, or, for the paper's tasks, a
    segmentation into regions, a structure class per region and each region's supporting region with
    its type.
  scoring: Depth by AbsRel, RMSE and threshold accuracy (share of pixels within a factor of 1.25,
    1.25 squared and cubed of the ground truth) over valid pixels of the 654 test images;
    segmentation by mean IoU over 40 classes. The paper scored regions by average overlap with the
    best-matching ground-truth region, and support by the share of labelled regions given the
    correct support, with and without its type. The crop, depth cap and alignment are each paper's.
  source: src-arxiv-1406-2283-v1
  quote: We evaluate each method using several errors from prior works, as well as our
    scale-invariant metric

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The labelled set is one MATLAB .mat file and the raw frames come in parts per scene
    type, served from a NYU host; neither was downloaded, and no registration or terms are shown on
    the page. The V2 page links no train/test split file (the V1 page does); the 795/654 split is
    stated by the papers that use it.
  access_basis:
    reason: Every split, the test images' depth and labels included, is downloadable from the page
      without an account or agreement.
    source: src-cs-nyu-depth-v2
    quote: Labeled dataset (~2.8 GB) Raw dataset, Multi-part (~428 GB) Toolbox
  refresh: versioned-releases
  refresh_note: Two releases, V1 (2011) and V2 (2012), each a new recording; V2's content has not
    changed since in any source read. The page later posted corrected segmentation scores for the
    paper, after a bug in its segmentation evaluation, about 2 points lower across the board; that
    corrects reported results, not the data.
  refresh_basis:
    reason: V2 is a second release with new scenes, after V1, by the same maintainers.
    source: src-cs-nyu-depth-v2
    quote: 464 new scenes taken from 3 cities
  data_provenance:
    - real-world-instrument
    - crowd-authored
  data_provenance_note: RGB and depth video from a Microsoft Kinect, in commercial and residential
    buildings; 1,449 frames hand-selected from the video for diversity. The dense labels were
    obtained on Amazon Mechanical Turk; the support annotations were added manually, by whom is not
    stated.
  data_provenance_source: src-cs-nyu-indoor-seg-support-pdf
  data_provenance_quote: A dense per-pixel labeling was obtained for each image using Amazon
    Mechanical Turk.
  contamination_risk: medium
  contamination_risk_note: The test images, their depth and their labels have been public since
    2012, and 407,024 raw frames of the same scenes are released beside them. The depth protocol
    keeps test scenes out of training by splitting scenes, but zero-shot models are trained on large
    mixed corpora that no source read checks for NYU frames. Nobody in the sources read has assessed
    this.
  contamination_risk_source: src-cs-nyu-depth-v2
  contamination_risk_quote: 407,024 new unlabeled frames
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: The depth errors are bounded at zero and the threshold accuracies and
    mean IoU at 1. No source measures an achievable ceiling. The ground truth has its own error,
    Kinect noise and filled-in depth, which RGBD20K names for NYUv2 among other datasets ("often
    exhibit significant sensor noise and boundary misalignment", src-arxiv-2609-29028-v1).
  ceiling_anchor_type_source: src-arxiv-2609-29028-v1
  ceiling_anchor_type_quote: these datasets are limited to fewer than 40 categories and often
    exhibit significant sensor noise and boundary misalignment
  dataset_licence: null
  dataset_licence_note: Neither dataset page nor the paper states a licence or terms of use for the
    data; looked for on both pages and in the PDF.
  size:
    - count: 654
      unit: labelled test images (795 training)
      subset: the split current papers use (as_used)
      source: src-arxiv-2609-29028-v1
      quote: NYUv2 contains 795 training images and 654 testing images across 40 semantic categories
    - count: 1449
      unit: densely labelled pairs of aligned RGB and depth frames
      subset: v2 labelled set
      source: src-cs-nyu-depth-v2
      quote: 1449 densely labeled pairs of aligned RGB and depth images
    - count: 464
      unit: indoor scenes, from three cities
      subset: v2
      source: src-cs-nyu-depth-v2
      quote: 464 new scenes taken from 3 cities
    - count: 407024
      unit: unlabelled raw frames
      subset: v2 raw set
      source: src-cs-nyu-depth-v2
      quote: 407,024 new unlabeled frames
    - count: 35064
      unit: labelled objects, in 894 raw classes
      subset: v2 labelled set
      source: src-cs-nyu-indoor-seg-support-pdf
      quote: The dataset contains 35,064 distinct objects, spanning 894
    - count: 215
      unit: test scenes (249 training), the scene split of the depth protocol
      subset: depth protocol (as_used)
      source: src-arxiv-1406-2283-v1
      quote: using 249 scenes for training and 215 for testing, and construct our training set using
        the raw data for these scenes
    - count: 2347
      unit: annotated RGB-D image pairs
      subset: v1
      source: src-arxiv-2609-29028-v1
      quote: NYUv1 [8] and NYUv2 [9] contain 2,347 and 1,449 annotated RGB-D image pairs,
        respectively
  size_note: The test set is counted as 654 images by Marigold and RGBD20K and as 694 by arXiv
    1406.2283; the training images as 795 by RGBD20K and arXiv 1406.2283 and as 785 by Marigold. The
    654 and 795 add up to the 1,449 labelled frames. The paper counts V1 as 67 scenes ("only 67
    scenes").

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The NYU Depth Dataset authors (Courant Institute, New York University, with co-authors
    at UIUC and Microsoft Research Cambridge)
  maintainer_basis:
    reason: The paper's authors introduce the dataset and give its page, which is served from a
      personal directory on cs.nyu.edu, the first author's at the time, and holds the downloads,
      toolbox and the posted correction. Who keeps the host running now is not stated.
    source: src-cs-nyu-indoor-seg-support-pdf
    quote: We therefore introduce a new Kinect dataset1
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: The maintainers keep no ranking or results table; each paper reports its
    own scores, often beside prior results copied from other papers under other protocols.
  submission_process_source: src-arxiv-2610-05029-v1
  submission_process_quote: Because prior methods may use different training and inference
    protocols, the most direct comparison is between SPACECLIP and SPACE-CLIPv2 under our reproduced
    setting.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-cs-nyu-indoor-seg-support-pdf
      quote: We evaluate our support inference model against several baselines
  independence_flags_note: The paper that introduced V2 evaluated its own segmentation and support
    method on it. With no ranking kept by the maintainers, the flag records authorship of results,
    not control over a leaderboard. The paper thanks Microsoft, whose Kinect recorded the data and
    whose Cambridge lab hosted part of the work; no Microsoft system is shown evaluated in the
    sources read, so funded-by-evaluated-party is not set.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: null
  reproducibility_tier_note: Left null. The data is open and the depth and segmentation scores are
    computed automatically, which reads as fully-automatable. But no V2 scoring code is published by
    the maintainers, so harness none brings the no-reference-implementation blocker, and 02 S11 bars
    fully-automatable beside it, as for IAM.
  reproducibility_blockers:
    - no-reference-implementation
  reproducibility_blockers_note: Each paper scores with its own code and its own choices of crop,
    valid depth range (SPACE-CLIPv2 keeps 0.001 to 10 m), filled or raw depth, and metric or aligned
    prediction, which move the numbers.
  harness_availability: none
  harness_availability_note: The V2 toolbox, as the page lists it, holds functions to read, align,
    fill and project the data and no evaluation function; the V1 toolbox had eval_seg.m for its
    segmentation. The papers read score with their own code.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The fallback profile (statistical-fit and domain-metric with task-specific models have no profile) floors at
  # subset_used, which carries the task and split: depth or normals on the 654 test images, 40-class segmentation,
  # or the paper's own tasks. Beyond it: what the model trained on (the NYU training scenes' raw frames, the 795
  # labelled images, or other data entirely for zero-shot models), which the papers' tables separate; and the
  # scoring code, since the crop, the valid depth range, filled against raw depth and metric against
  # scale-and-shift-aligned prediction each change a depth number and no maintainer scorer fixes them.
  material_extra:
    - training_data_policy
    - harness
aggregation_policy: none-by-design
aggregation_policy_note: Papers report each depth measure, and mean IoU for segmentation,
  separately; no source combines them into one score.

homepage: https://cs.nyu.edu/~silberman/datasets/nyu_depth_v2.html
dataset_url: https://cs.nyu.edu/~silberman/datasets/nyu_depth_v2.html


        the V1 version would move to lineage."
      field: id
      source: src-cs-nyu-depth-v2
      quote: 464 new scenes taken from 3 cities
    - check: domain.primary is depth-geometry by what is scored in use, while the paper itself is
        about segmentation and support inference and the dataset's other major use is 40-class RGB-D
        segmentation. Of the four 2025-2026 papers read, two score depth (one also normals) and two
        segmentation; which use dominates was judged from those and the dataset's name, not counted.
        segmentation primary with depth-geometry secondary is the alternative.
      field: domain
      source: src-arxiv-2610-05029-v1
      quote: Benchmarks such as NYU Depth V2 [23] have driven progress in indoor depth estimation by
        providing paired RGB and metric depth supervision.
    - check: The depth and 40-class segmentation protocols were set by others (the scene split and
        error measures by arXiv 1406.2283, the 40 classes by a paper not read) and are filed as
        subsets because they score the maintainers' release. IAM's entry records a community split
        in as_used instead; doing that here would leave the headline use outside the subsets.
      field: subsets
    - check: The test set's size differs across sources. arXiv 1406.2283 says 694 images, Marigold
        and RGBD20K 654; Marigold counts the training split as 785, RGBD20K and arXiv 1406.2283 as
        795. 654 plus 795 is the 1,449 labelled frames, so 694 and 785 look like slips, but the
        official split file was not read.
      field: data.size
      source: src-arxiv-1406-2283-v1
      quote: We test on the 694-image NYU Depth v2 test set
    - check: statistical-fit for AbsRel and RMSE is clear; the threshold accuracy (share of pixels
        within a ratio of 1.25) is a depth-estimation measure with little meaning outside the field
        and could be domain-metric. domain-metric is tagged for the segmentation use's mean IoU.
      field: evaluation_method
      source: src-arxiv-2505-09358-v1
      quote: Following the protocol of affine-invariant depth evaluation [60], we first align the
        estimated merged prediction m to the ground truth d with the least squares fitting.
    - check: Numbers are compared across papers that differ in crop, valid depth range, filled or
        raw depth, metric or aligned prediction and training data, and no maintainer scorer fixes

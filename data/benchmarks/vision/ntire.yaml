# data/benchmarks/vision/ntire.yaml
#
# P1-S8-T05, vision entry 3 of 8. Filled from the NTIRE 2026 workshop page on cvlai.net and its challenge list;
# the NTIRE 2025 and NTIRE 2017 workshop pages; Codabench's public records of four 2026 challenges, read through
# the platform's public competition API (Image Super-Resolution (x4), 13516; Robust Deepfake Detection, 12795;
# RAIM Track 1 Professional Image Quality Assessment, 12789; X-AIGC Quality Assessment Track 2 Image Editing,
# 13031); the 2026 Image Super-Resolution (x4) challenge report, arXiv 2604.14558 read as its v1 PDF, with its
# abstract page; and the v1 PDF of the 2026 Short-form UGC Video Restoration challenge report, arXiv 2604.10551.
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the challenge series as one family (02 S11 rule 5): its yearly editions are versions, and the 2026
# edition's 47 challenge tracks are subsets, each with its own domain where its leaf differs from the family's.
# Every challenge publishes its own report and the series has no overview paper, so `paper` is left empty.

id: ntire
name: NTIRE Challenges
aliases:
  - NTIRE
  - New Trends in Image Restoration and Enhancement
  - NTIRE Workshop and Challenges
tagline: Yearly CVPR workshop challenges since 2017 on image and video restoration and enhancement,
  each track ranked on its own.
description: >
  The challenges of the New Trends in Image Restoration and Enhancement (NTIRE) workshop, held with CVPR
  every year since 2017; the workshop itself began at ACCV 2016. The 2017 edition had one challenge, example-based
  single-image super-resolution on the new DIV2K dataset, in a bicubic and an unknown-degradation track
  at three scales. By 2026, the workshop's eleventh edition, the line-up had grown to 47 tracks on Codabench:
  super-resolution (x4, efficient, mobile, light field, 3D content, remote-sensing infrared), denoising,
  deblurring, dehazing, low-light enhancement, HDR, shadow, reflection and raindrop removal, face and
  video restoration and, beside them, deepfake and AI-generated image detection, few-shot object detection,
  depth estimation, saliency prediction and image quality assessment. Each challenge has its own organisers,
  data, metric and Codabench competition. Participants train on released data, get feedback from a validation
  server, then submit outputs on test inputs whose ground truth stays with the organisers, together with
  a fact sheet describing the method and the code, which the organisers use to check or re-run the entries.
  The restoration tracks read are ranked by PSNR against the hidden reference images, the perceptual ones
  by a weighted sum of learned image-quality metrics. Each challenge's results and its top teams' methods
  appear in a report in the CVPR Workshops proceedings, co-authored by its organisers and participants.
self_description:
  source: src-ntire-2017-site
  quote: In order to gauge the current state-of-the-art in example-based single-image
    super-resolution, to compare and to promote different solutions we are organizing an NTIRE
    challenge in conjunction with the CVPR 2017 conference.
released: 2017-01-21
released_note: The 2017 challenge site's opening, the first edition with a challenge, as its page
  dates it. The 2026 page counts the ACCV 2016 workshop as an NTIRE edition as well; no source read
  describes a challenge there.
released_source: src-ntire-2017-site
released_quote: Site online January 21, 2017

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/image-restoration-enhancement
  secondary:
    - vision/classification
    - vision/detection
    - vision/segmentation
    - vision/depth-geometry
  per_edition: true
  per_edition_note: >
    The secondary list is the union of the 2026 recognition tracks' own leaves, each also carried by its
    subset's domain_override: AI-generated image and deepfake detection (classification), few-shot object
    detection and face-enhancement anomaly detection (detection), rip current detection and segmentation,
    and depth from specular and transparent surfaces. RAIM Track 1's quality assessment carries multimodal/visual-qa
    on its subset only. The quality-assessment and saliency tracks have no leaf (Stage 3's ntire-001).
    Earlier editions' line-ups were not read track by track.
domain_basis:
  reason: Most of the 47 tracks of 2026 recover an image or video from a degraded one
    (super-resolution, denoising, deblurring, dehazing, low-light, HDR, shadow, reflection and
    raindrop removal), and the flagship restoration tracks score the result against the withheld
    clean reference. The workshop states the same scope.
  source: src-ntire-2026-site
  quote: Image restoration, enhancement and manipulation are key computer vision tasks, aiming at
    the restoration of degraded image content
domain_considered_and_rejected:
  - term: vision/image-generation
    reason: Perceptual tracks reward realism and many entries are diffusion-based, but the output
      must reproduce or preserve the input's content, and the flagship tracks score it against a
      reference; the leaf is for images scored on their own properties.
  - term: multimodal/visual-qa
    reason: Only RAIM Track 1 scores language about images, a single track out of 47; it carries the
      leaf as its own domain_override.
capability:
  - generation-fidelity
capability_basis:
  generation-fidelity:
    reason: The restoration tracks compare the produced image with the withheld reference, by PSNR
      and SSIM for fidelity and by learned metrics such as LPIPS and DISTS for perceptual closeness.
      capabilities.yaml names NTIRE as the term's example.
    source: src-codabench-ntire-13516
    quote: The evaluation consists of comparing the restored high-resolution images with the ground
      truth high-resolution images.
capability_considered_and_rejected:
  - term: perception
    reason: Carried by the subsets that score what was recovered from an image (detection,
      segmentation, depth, real-or-fake classification, quality assessment) as capability_override,
      not by the family. A restoration track scores a produced image against a reference, which is
      generation-fidelity's case.
  - term: creativity-novelty
    reason: Generative restoration methods are common, but the score rewards matching the reference,
      the opposite criterion (capabilities.yaml's own near miss).
  - term: distribution-shift-generalization
    reason: Two tracks score inputs from generators or editing models absent from training (Robust
      Deepfake Detection, X-AIGC Track 2) and carry it as capability_override; the restoration
      tracks test on held-out images of the same datasets.

evaluation_method:
  - domain-metric
  - model-derived-metric
  - composite
  - classification-metric
  - statistical-fit
  - human-expert-eval
  - reference-metric
  - exact-match
  - model-graded-judge
evaluation_method_note: >
  Each track keeps its own ranking metric; these are the methods of the 2026 tracks read. The restoration
  tracks rank by PSNR, with SSIM beside it (domain-metric). The x4 super-resolution perceptual track ranks
  by a weighted sum of LPIPS, DISTS, NIQE, ManIQA, MUSIQ and CLIP-IQA, computed with IQA-PyTorch's default
  models (model-derived-metric). Robust Deepfake Detection ranks by ROC-AUC (classification-metric). X-AIGC
  Track 2 ranks by SRCC and PLCC against user-study MOS (statistical-fit). The UGC video restoration track's
  primary ranking is a user study by raters the report calls professional students and workers (human-expert-eval),
  and its objective ranking blends PSNR, SSIM, LPIPS, MUSIQ and WarpError (composite). RAIM Track 1's
  final score combines preference accuracy (exact-match), BLEU-4 and ROUGE-L against expert reviews (reference-metric)
  and an unnamed LLM judge (model-graded-judge), averaged over two phases (composite).
evaluation_method_basis:
  reason: The flagship x4 super-resolution challenge ranks its restoration track by PSNR alone;
    every other track names its own metric.
  source: src-codabench-ntire-13516
  quote: The objective is to maximize the restoration accuracy, which will be evaluated solely using
evaluation_method_considered_and_rejected:
  - term: human-crowd-eval
    reason: The UGC track's raters are described as professional students and workers from education
      and industry, read here as qualified raters. The quality-assessment tracks' MOS are labels to
      predict, not ratings of the entrants' outputs.
    source: src-arxiv-2604-10551-v1
    quote: For subjective comparison, we organize two professional students and workers from
      education and industry to conduct subjective experiments for all teams.
  - term: entrant-relative-ranking
    reason: The x4 challenge orders teams overall by their better rank across the two tracks, but
      each track's winners are decided by its own metric, not relative to the field.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The entrants are restoration networks trained or fine-tuned on the challenge's training
    pairs (DIV2K and LSDIR for super-resolution and denoising, extra data allowed if declared) and
    scored as trained; the term names image-restoration networks.
  source: src-arxiv-2604-14558-v1
  quote: Pre-trained Transformer-based restoration backbones remain the dominant choice.
designed_for_subjects_considered_and_rejected:
  - term: generative-media-model
    reason: Diffusion and rectified-flow pipelines appear in the perceptual tracks, but they
      reconstruct a reference image, which the term's exclusion sends to
      task-specific-supervised-model.
  - term: instruction-tuned-model
    reason: RAIM Track 1's entrants are multimodal language models, but fine-tuned on the track's
      expert pairs and scored as trained, not prompted.

lifecycle: active
lifecycle_basis:
  reason: The 2026 edition ran its challenges from January to March 2026, published reports such as
    the x4 super-resolution one in April, and presented results and awards at the workshop on 4 June
    2026.
  source: src-arxiv-2604-14558-v1
  quote: A total of 194 participants registered for the challenge, with 31 teams submitting valid
    entries.
activity: between-rounds
activity_note: The test phases of the 2026 challenges read all ended in March 2026, and their
  results are published. https://cvlai.net/ntire/2027/ returned 404 on 2026-10-14, and no source
  read announces a 2027 edition.
activity_basis:
  reason: The series runs in yearly editions, the 2026 results are out, no Codabench phase read is
    open and no standing leaderboard takes results between editions.
  source: src-codabench-ntire-13516
  quote: '"end":"2026-03-17T23:55:00Z"'
events:
  - name: NTIRE 2026 workshop at CVPR 2026, Denver, 4 June 2026, with the challenge reports and
      awards
    kind: workshop
    source: src-ntire-2026-site
    quote: June 4, 2026, room 207 & Zoom

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SamsungAICamera's cascaded hybrid super-resolution model (built on HAT), first in both
      2026 x4 tracks
    source: src-arxiv-2604-14558-v1
    observed_on: 2026-10-14
    quote: The SamsungAICamera team proposes a cascaded hybrid super-resolution framework
evaluation_target: learned-system
execution_mode: automated
execution_mode_note: The UGC video restoration track's primary ranking is a user study, and RAIM
  Track 1 uses an LLM judge; the other tracks read are scored by formula or by fixed metric models.
ground_truth_source: held-out-labels
ground_truth_source_note: The organisers' withheld references, chiefly the clean high-resolution
  test images (DIV2K's test split for the x4 challenge), and per track real-or-fake labels, MOS or
  expert preferences.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test references stay with the organisers, so only they can produce the official
    scores; anyone can run the released validation data and the published scoring scripts.
  source: src-arxiv-2604-14558-v1
  quote: The HR test images are likewise kept hidden for the duration of the entire challenge.

task:
  exists: true
  input:
    - a degraded image or video per test item (for the flagship track, a DIV2K image downscaled x4
      by bicubic interpolation)
    - in the recognition and quality-assessment tracks, the image, image pair or video to judge
  output: Per track, the restored image or video in the track's format, or a real-or-fake score,
    boxes, masks, depth, saliency maps, predicted quality scores or a preference with reasoning.
  scoring: Each track on its own metric over its hidden test set, ranked separately. The restoration
    tracks read by PSNR on the Y channel with a border shaved, SSIM beside it; the perceptual tracks
    by a weighted sum of learned quality metrics.
  source: src-codabench-ntire-13516
  quote: The evaluation consists of comparing the restored high-resolution images with the ground
    truth high-resolution images.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: Each challenge's data sits behind Codabench registration, a lesser layer that
    withholding precedes. Robust Deepfake Detection's final ranking used a private test set whose
    images never leave the organisers, which is private-test-server for that track.
  access_basis:
    reason: Training data with references and the test inputs are released; the test references are
      not, and test scores come only from the organisers.
    source: src-codabench-ntire-13516
    quote: The ground truth test data will not be made available to the participants during the
      contest.
  refresh: periodic-recompetition
  refresh_basis:
    reason: The series runs dated yearly editions, and its line-up changes almost entirely between
      them (32 tracks in 2025, 47 in 2026, one challenge in 2017). The 2026 x4 super-resolution
      tracks score on the withheld test split of DIV2K, the dataset made for the 2017 challenge, a
      reuse the term allows for a family.
    source: src-ntire-2026-site
    quote: 'NTIRE 2026: 11th Edition Overview and Awards'
  data_provenance:
    - inherited-from-constituents
    - synthetic-procedural
    - model-generated
  data_provenance_note: >
    The super-resolution and denoising tracks reuse DIV2K (made for the 2017 challenge) and LSDIR with
    their own splits, LSDIR's images taken from Flickr (inherited-from-constituents). The low-resolution
    inputs are bicubic downscalings made with Matlab's imresize (synthetic-procedural). The deepfake,
    AI-generated image and X-AIGC tracks score images produced by generative and editing models (model-generated).
    RAIM Track 1's preferences and reasoning are written by experts and X-AIGC Track 2's MOS come from
    user studies; those are labels of single tracks and are not tagged.
  data_provenance_source: src-codabench-ntire-13516
  data_provenance_quote: corresponding low-resolution images obtained using Matlab imresize function
    with default settings (bicubic interpolation)
  contamination_risk: medium
  contamination_risk_note: >
    The organisers withhold the test references and re-run or check the top entries' code, and the rules
    forbid training on held-back splits. But the x4 challenge reuses the test split of DIV2K, a 2017 dataset,
    the test inputs are public, LSDIR's images come from Flickr, and many entries start from models pretrained
    on web-scale image data, so a route to the reference images through pretraining is plausible. No source
    assesses it.
  contamination_risk_source: src-arxiv-2604-14558-v1
  contamination_risk_quote: dataset contains 86,991 high-quality images sourced from the Flickr
    platform
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: The restoration tracks rank by PSNR, which has no finite top, and no
    source reports a human or measured ceiling.
  dataset_licence_note: Per challenge. The x4 rules release the data only for open research and
    education within the challenge's scope, with the images' copyright left with their owners;
    DIV2K's and LSDIR's own licences were not read.
  size:
    - count: 47
      unit: challenge tracks (Codabench competitions)
      subset: 2026 edition
      note: Counted from the workshop page's challenge list, which leaves out the commented-out
        entries.
      source: src-ntire-2026-site
      quote: Image Super-Resolution (x4) started!
    - count: 32
      unit: challenge tracks
      subset: 2025 edition
      note: Counted from the 2025 workshop page's challenge list.
      source: src-ntire-2025-site
      quote: NTIRE 2025 challenges
    - count: 100
      unit: DIV2K test images, the evaluation set of both x4 tracks
      subset: 2026 Image Super-Resolution (x4)
      source: src-codabench-ntire-13516
      quote: 100 diverse images are used to generate low-resolution corresponding images
  submission_limit:
    max_submissions: 1
    period_days: 0
    per: team, final entry per challenge (the x4 rules; validation-phase submissions are not capped
      in the sources read)
    source: src-codabench-ntire-13516

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The NTIRE workshop and challenge organisers, led by Radu Timofte (Computer Vision Lab,
    University of Würzburg), with an organising team per challenge
  maintainer_basis:
    reason: Timofte heads the 2026 organiser list and every challenge read names him among its
      organisers; each challenge's own team (for example OPPO's Y-Lab with PolyU's VC-Lab for RAIM)
      runs its data, server and report. In 2017 the series was run from ETH Zurich's Computer Vision
      Lab.
    source: src-ntire-2026-site
    quote: Radu Timofte, University of Wurzburg,
  maintainer_type: conference-workshop
  maintainer_type_note: One lab heads the series, but the challenges' organising teams change by
    edition under a CVPR workshop, which conference-workshop's inclusion test overrides the holder
    rule for (governance.yaml names NTIRE as academic-lab's near miss).
  maintainer_type_basis:
    reason: The challenges are held as part of a CVPR workshop, and in 2026 their organisers came
      from over twenty universities and companies.
    source: src-ntire-2026-site
    quote: New Trends in Image Restoration and Enhancement workshop and associated challenges in
      conjunction with CVPR 2026
  submission_process:
    - held-out-server
    - sandboxed-rerun
    - publication-gated
  submission_process_note: >
    Participants upload outputs on the test inputs to Codabench, which scores them against references
    they never see (held-out-server). The organisers also take each team's code and run it: for the x4
    perceptual track and the deepfake track's private test set the organisers' run produces the ranked
    score (sandboxed-rerun), and elsewhere the code checks the uploaded results. A fact sheet describing
    the method is a condition of the final ranking (publication-gated). Releasing code publicly is required
    only of the top three for prizes, so open-source-gated is not tagged, and a challenge paper is optional.
    The best teams are invited to co-author the challenge's report.
  submission_process_source: src-codabench-ntire-13516
  submission_process_quote: To enter the final ranking the participants will need to fill out a
    survey (fact sheet) briefly describing their method.
  independence_flags:
    - flag: prize-sponsored-by-industry
      source: src-codabench-ntire-12789
      quote: The awards of this challenge is sponsored by OPPO Research Institute.
    - flag: single-evaluator-private-test-set
      source: src-codabench-ntire-13516
      quote: The ground truth test data will not be made available to the participants during the
        contest.
  independence_flags_note: >
    The 2026 sponsors are OPPO, Kuaishou and the University of Würzburg's Computer Vision Lab (the x4
    report's acknowledgements), and the rules pay prizes from the financial sponsors' funds. RAIM Track
    1's awards (US$1,000, 500 and 200) came from OPPO, which also offered internships at its Y-Lab to
    outstanding participants. Companies co-organise tracks (OPPO, Kuaishou, Samsung and Bytedance staff
    are on the 2026 organiser list). The rules bar organisers and their employees from entering, while
    sponsors' employees may enter and be ranked but take no prize money. Industry teams place high (SamsungAICamera
    won both x4 tracks); their affiliations, in the x4 report's supplementary material, were not read,
    so maintainer-competes is not tagged. Each challenge's organisers hold its test references and run
    its scoring.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier_note: Left empty. Entrants run their own inference for the uploaded results, but the
    x4 perceptual track's score comes from the organisers' run of the submitted code on one NVIDIA
    A6000, and the deepfake track's from their run on the private set; the x4 report says its
    rankings rest mainly on the Codabench uploads.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The official scores need the withheld test references, which only the organisers hold.
    source: src-codabench-ntire-13516
    quote: test HR images (not provided to the participants, used for final evaluation and ranking)
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: Per challenge. The x4 challenge's Codabench scoring scripts and its NTIRE2026_ImageSR_x4
    repository, with IQA-PyTorch at default settings for the perceptual metrics.
  harness_source: src-arxiv-2604-14558-v1
  harness_quote: An evaluation script for these metrics is available at
  submission_channel:
    source: src-codabench-ntire-13516
    quote: the entries will be online submitted via the Codabench web platform
  code_licence_note: Per challenge; no repository's licence was read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and track (the line-up, data and metric change every year and
  # differ by track), which split (the hidden test set, or the released validation set papers often report),
  # and what training data was used (extra data is allowed and declared per submission).
  material_extra:
    - subset_used
    - training_data_policy
aggregation_policy: none-by-design
aggregation_policy_note: Each challenge names its own winners, and no ranking spans the challenges;
  within the x4 challenge the two tracks are ranked separately as well.

secondary_axes:
  - latency
secondary_axes_basis:
  reason: Every x4 submission reports its runtime per image beside the score, and four 2026 tracks
    are named for efficiency (Efficient Super-Resolution, Efficient Low-Light Image Enhancement,
    Efficient Burst HDR and Restoration, and Light Field Image Super-Resolution Track 2 Efficiency).
  source: src-codabench-ntire-13516
  quote: the runtime per image (in seconds) of the solution


# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-ntire-2026-site
    - src-ntire-2025-site
    - src-ntire-2017-site
    - src-codabench-ntire-13516
    - src-codabench-ntire-12795
    - src-codabench-ntire-12789
    - src-codabench-ntire-13031
    - src-arxiv-2604-14558
    - src-arxiv-2604-14558-v1
    - src-arxiv-2604-10551-v1
  sources_note: >
    The three workshop pages were read with scripts and styles stripped; the 2017 page's one unterminated
    br tag was closed first, because normalising otherwise reads it as a tag running to the next '>' and
    drops the challenge and dates sections. The Codabench records are the platform's public competition
    API responses, read as JSON. All seven hold organisers' e-mail addresses and are withheld from archiving,
    with the addresses outside the extracts. The two report PDFs (DOIs, not archived) were read as text;
    the UGC report's abstract page was read for its date and licence and is not a quoted Source. No paper
    reporting on an NTIRE track outside its challenge was found, so the 2026 reports stand as the evidence
    of current use.
  confidence: medium
  review_checks:
    - check: Identity. The entry is the challenge series as one family, with editions as versions
        and the 2026 tracks as subsets. Long-running lines (x4 super-resolution, in its fourth
        edition in 2026; denoising; efficient super-resolution) could be entries of their own, and
        the challenges of the related AIM, MAI and AIS workshops are not included.
      field: versions
      source: src-ntire-2026-site
      quote: 'New Trends in Image Restoration and Enhancement (NTIRE) editions at: CVPR 2025 , CVPR 2024
        , 2023 , 2022 , 2021, 2020 , 2019 , 2018 and 2017 and at ACCV 2016'
    - check: evaluation_method is the union over the eight 2026 tracks read, since subsets cannot
        override it. Three terms (reference-metric, exact-match, model-graded-judge) rest on RAIM
        Track 1 alone, and human-expert-eval on the UGC track alone. A reviewer may prefer the
        restoration tracks' methods only.
      field: evaluation_method
    - check: PSNR and SSIM are tagged domain-metric, as Stage 3 did. PSNR is a log transform of mean
        squared error against a reference image, so statistical-fit or reference-metric could be
        argued.
      field: evaluation_method
      source: src-codabench-ntire-13516
      quote: The objective is to maximize the restoration accuracy, which will be evaluated solely
        using
    - check: human-expert-eval reads the UGC report's 'professional students and workers' as
        qualified raters; the wording is ambiguous and human-crowd-eval is the alternative.
      field: evaluation_method
      source: src-arxiv-2604-10551-v1
      quote: For subjective comparison, we organize two professional students and workers from
        education and industry to conduct subjective experiments for all teams.
    - check: RAIM Track 1 carries multimodal/visual-qa because its reasoning text is scored against
        expert reviews and by an LLM judge. Quality assessment has no vision leaf (Stage 3's
        ntire-001, still open), so the X-AIGC tracks carry no domain_override;
        vision/quality-assessment would settle all three.
      field: subsets
      source: src-codabench-ntire-12789
      quote: This track challenges participants to train MLLMs that can handle high-resolution
        inputs and output professional-grade reasoning to predict image quality preferences.
    - check: The domain_override of the rip current, depth, AI-generated image and anomaly detection
        tracks rests on their names (and, for anomaly detection, two accepted papers' titles); their
        Codabench pages were not read.
      field: subsets
    - check: sandboxed-rerun. The x4 Codabench page says the final score comes from running the
        submitted code, but the x4 report says the results rest mainly on the Codabench uploads,
        with the code used for verification. The deepfake track's private test is the clear case.
      field: governance.submission_process
      source: src-arxiv-2604-14558-v1
      quote: The evaluation results are primarily determined by the submissions made to the
        Codabench server, while the submitted code is used for reproduction and verification
    - check: publication-gated rests on the mandatory fact sheet (a compiled PDF describing the
        method); a challenge paper is optional, and co-authorship of the report is by invitation.
      field: governance.submission_process
      source: src-codabench-ntire-13516
      quote: To enter the final ranking the participants will need to fill out a survey (fact sheet)
        briefly describing their method.
    - check: Industry teams win tracks (SamsungAICamera, first in both x4 tracks) while Samsung,
        OPPO, Kuaishou and Bytedance staff co-organise others and OPPO and Kuaishou sponsor. The
        rules let sponsors' employees be ranked; no team's affiliation was checked, so
        maintainer-competes is not tagged.
      field: governance.independence_flags
      source: src-codabench-ntire-13516
      quote: If you are an employee, affiliated with or representant of any of the NTIRE challenge
        sponsors then you are allowed to enter in the contest and get ranked
    - check: contamination_risk medium, where Stage 3 said low. The test references are withheld,
        but LSDIR's images come from Flickr and the DIV2K test split is reused, so web-scale
        pretraining is a plausible route.
      field: data.contamination_risk
      source: src-arxiv-2604-14558-v1
      quote: dataset contains 86,991 high-quality images sourced from the Flickr platform
    - check: activity between-rounds assumes no 2027 edition is announced; the 2027 page returned
        404 on 2026-10-14. If a 2027 call with dates appears, round-scheduled applies.
      field: activity

subsets_note: >
  The subsets are the 2026 edition's 47 tracks as the workshop page lists them, each a Codabench competition
  ranked on its own, with the x4 challenge's two tracks as its children. Earlier editions' tracks are
  not recorded as subsets. Tracks whose leaf differs from the family's carry a domain_override and their
  own capabilities, as does X-AIGC Track 2, which scores shifted inputs; the restoration and enhancement
  tracks inherit the family's. The X-AIGC quality-assessment and saliency tracks, and two tracks whose
  pages were not read, carry no domain_override, as their notes say.

history:
  - event: channel-moved
    field: execution.submission_channel
    from: CodaLab's LISN instance (codalab.lisn.upsaclay.fr), where 30 of the 32 tracks of 2025 ran
    to: Codabench (codabench.org), where all 47 tracks of 2026 ran
    source: src-codabench-ntire-13516
    quote: the entries will be online submitted via the Codabench web platform
    note: Undated. The 2025 page links its tracks to codalab.lisn.upsaclay.fr competitions and the
      2026 page to codabench.org ones; the links are markup and cannot be quoted.


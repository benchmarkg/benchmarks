# data/benchmarks/vision/kitti.yaml
#
# P1-S8-T06, vision entry 11. Filled from the CVPR 2012 suite paper, read as the text of the authors' PDF on
# cvlibs.net, with Crossref's records of it (DOI 10.1109/cvpr.2012.6248074) and of the IJRR 2013 data paper (DOI
# 10.1177/0278364913491297); the CVF open-access page of the CVPR 2015 scene flow paper, which introduced the 2015
# stereo, flow and scene flow benchmarks; cvlibs.net's KITTI home page and changelog, its public login page with the
# download and submission policies, and eight of its evaluation pages with their leaderboards (stereo 2012, stereo
# 2015, depth completion, depth prediction, odometry, 3D object detection, tracking, and STEP); the KITTI-360 home
# page; and the v2 PDF of Object Concepts Emerge from Motion (arXiv 2609.04348, October 2026), a paper reporting a
# result on the depth prediction server. Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# The entry is the KITTI Vision Benchmark Suite: one dataset family from one recording platform, one site, one
# login and one submission policy, with seventeen leaderboards. Each leaderboard is a subset, with its own
# domain_override where its leaf differs from the suite's. Dated ground-truth and metric changes are revisions and
# dated additions of boards are track-sets. KITTI-360, the same group's later dataset with its own recordings,
# paper and boards, is a separate benchmark linked by lineage.

id: kitti
name: KITTI Vision Benchmark Suite
aliases:
  - KITTI
  - KITTI 2012
  - KITTI 2015
tagline: Seventeen online boards on drives around Karlsruhe, from stereo, flow, depth and odometry
  to 3D detection and tracking.
description: >
  A benchmark suite built from one car's recordings around Karlsruhe, on rural roads and on highways,
  by Karlsruhe Institute of Technology and Toyota Technological Institute at Chicago. The car carried
  grayscale and colour stereo cameras, a Velodyne laser scanner and a GPS/IMU unit, and the laser scans
  and poses give the ground truth. The suite went online in March 2012 with stereo, optical flow and visual
  odometry, and 2D object detection and orientation followed that August (CVPR 2012 paper; the raw recordings
  have their own IJRR 2013 paper). Boards added since are tracking (2013), road and lane estimation (2013),
  the harder stereo, flow and scene flow 2015 benchmarks on 200 dynamic scenes (CVPR 2015), 3D and bird's-eye-view
  object detection (2017), depth completion and single-image depth prediction (2017), semantic and instance
  segmentation (2018), multi-object tracking and segmentation (2019) and segmenting and tracking every
  pixel (2021). Each board has its own metric: the percentage of pixels whose disparity or flow error
  exceeds 3 px and 5 %, inverse-depth RMSE, scale-invariant log error, relative translation and rotation
  drift, average precision at 3D box overlap, and HOTA. Training data and labels are released; the test
  inputs are released without ground truth, and the cvlibs.net server scores uploaded results, three a
  month per benchmark. Only work aimed at a peer-reviewed paper may be submitted, and entries left anonymous
  or without a paper are deleted after six months. The data is under CC BY-NC-SA 3.0, and downloading
  it needs a registered account.
self_description:
  source: src-cvlibs-kitti-index
  quote: 'Our tasks of interest are: stereo, optical flow, visual odometry, 3D object detection and 3D
    tracking.'
paper:
  title: Are we ready for Autonomous Driving? The KITTI Vision Benchmark Suite
  doi: 10.1109/cvpr.2012.6248074
  source: src-cvlibs-kitti-cvpr-2012-pdf
released: 2012-03-20
released_note: The day the site's changelog dates the suite's going online with its first three
  benchmarks; the paper appeared at CVPR 2012 that June.
released_source: src-cvlibs-kitti-index
released_quote: '20.03.2012: The KITTI Vision Benchmark Suite goes online, starting with the stereo, flow
  and odometry benchmarks.'
release_venue: CVPR 2012
release_venue_source: src-crossref-10-1109-cvpr-2012-6248074
release_venue_quote: '"name":"2012 IEEE Conference on Computer Vision and Pattern Recognition (CVPR)"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/depth-geometry
  secondary:
    - vision/image-matching-correspondence
    - vision/driving-perception-3d
    - vision/detection
    - vision/segmentation
    - vision/video-understanding
  secondary_note: >
    The union of the boards' own leaves, each also carried by its subset's domain_override: optical flow
    2012 and 2015 (image-matching-correspondence), odometry and 3D and bird's-eye-view detection (driving-perception-3d),
    2D detection (detection), tracking (video-understanding, with detection), and road, semantic, instance,
    MOTS and STEP segmentation (segmentation). driving-perception-3d is where nuScenes sits, and KITTI
    differs from it in what most boards score: nuScenes ranks 3D boxes in the world frame from a 360-degree
    camera, lidar and radar rig under one headline (NDS), while most KITTI boards score a per-pixel disparity,
    flow or depth map from a forward stereo pair in image space, and its 3D boards (AP at 70 % 3D box
    overlap for cars) are three of seventeen. segmentation ties with depth-geometry at five boards only
    by counting MOTS and STEP, which rank by tracking measures (HOTA, STQ) as much as by segmentation.
domain_basis:
  reason: Counted by board, the leaves are depth-geometry 5 (stereo 2012 and 2015, scene flow, depth
    completion, depth prediction), segmentation 5 (road, semantics, instances, MOTS, STEP),
    driving-perception-3d 3 (odometry, 3D, bird's eye view), image-matching-correspondence 2 (flow
    2012 and 2015), detection 1 (2D objects) and video-understanding 1 (tracking). Depth-geometry is
    taken over the tie with segmentation because the geometric boards (depth, flow, scene flow and
    odometry, 8 of 17) are the suite's founding tasks and its stated tasks of interest, and because
    every depth board scores a per-pixel disparity or depth map against laser ground truth; the
    segmentation boards were added from 2013 to 2021. What is scored is the visual signal recovered,
    never a relation to language, so by 02 S11 rule 12 the suite is vision.
  source: src-cvlibs-kitti-stereo-2015
  quote: Our evaluation server computes the percentage of bad pixels averaged over all ground truth
    pixels of all 200 test images.
domain_considered_and_rejected:
  - term: vision/3d-reconstruction
    reason: The odometry board recovers camera trajectories and the 2012 paper calls the task visual
      odometry / SLAM, but poses are scored, not a recovered scene geometry.
  - term: multimodal/visual-grounding
    reason: No board scores language; class labels are the only text, and they are the label set of
      a detection or segmentation task (02 S11 rule 12).
  - term: robotics-embodiment/autonomous-driving-planning
    reason: Nothing drives the car or scores a driving outcome; the boards score what was recovered
      from recorded sensor data.
capability:
  - perception
capability_basis:
  perception:
    reason: Every board scores structure recovered from raw camera, laser or GPS/IMU recordings --
      disparity, flow and depth maps, camera trajectories, boxes, tracks and labels -- against
      laser-derived or annotated ground truth.
    source: src-cvlibs-kitti-cvpr-2012-pdf
    quote: The ground truth for visual odometry/SLAM is directly given by the output of the GPS/IMU
      localization unit
capability_considered_and_rejected:
  - term: spatial-reasoning
    reason: Depth, 3D boxes and trajectories are spatial, but what is scored is the accuracy of the
      recovered geometry, which the term's exclusion test sends to perception.
  - term: temporal-reasoning
    reason: Flow, scene flow, odometry and tracking span frames, but the score is recovered motion
      and identity, not an inference about order or duration.
  - term: distribution-shift-generalization
    reason: The 2012 paper's claim is that methods tuned on laboratory benchmarks fail on its real
      scenes, but training and test images come from the same drives, and no shifted condition is
      scored as its own.
    source: src-cvlibs-kitti-cvpr-2012-pdf
    quote: We further ensure that images from one sequence do not appear in both training and test
      set.

evaluation_method:
  - domain-metric
  - statistical-fit
evaluation_method_note: >
  Each board ranks by its own metric. The outlier percentages of stereo, flow and scene flow (a pixel
  is an outlier when its disparity or end-point error exceeds 3 px and 5 %), depth prediction's scale-invariant
  log error (SILog), odometry's translational and rotational drift over 100 to 800 m subsequences, average
  precision at 2D or 3D box overlap over 40 recall positions, HOTA for tracking and MOTS, and STQ for
  STEP are field-specific (domain-metric). Depth completion ranks by the RMSE of inverse depth, with MAE
  beside it (statistical-fit). The road, semantic and instance segmentation pages were not read, so their
  metrics are not tagged.
evaluation_method_basis:
  reason: The stereo 2015 board ranks by the share of erroneous pixels, defined by KITTI's own
    disparity and end-point thresholds; depth completion ranks by inverse-depth RMSE.
  source: src-cvlibs-kitti-depth-completion
  quote: Our evaluation table ranks all methods according to the root mean squared error (RMSE) of
    the inverse depth maps.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: No board combines its measures into one score, and no ranking spans the boards.
  - term: classification-metric
    reason: The road benchmark is commonly scored by an F-measure, but its page was not read; no
      board read ranks by a general-purpose classification statistic.
designed_for_subjects:
  - task-specific-supervised-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The 2012 paper's first rankings are hand-designed stereo, flow and odometry methods, and
    classical lidar and visual odometry still lead that board; the stereo, depth, detection and
    tracking boards are now led by networks trained on the released training splits, such as the
    depth prediction entry OCEM.
  source: src-cvlibs-kitti-cvpr-2012-pdf
  quote: For stereo matching, we run global [26, 37, 46], semiglobal [23], local [5, 20, 38] and
    seed-growing [27, 10, 9] methods.
designed_for_subjects_considered_and_rejected:
  - term: base-model
    reason: Depth entries now start from large pretrained encoders (OCEM pretrains on 421 million
      video frames), but a task decoder is trained on top and the result is scored as trained, not
      prompted.
    source: src-arxiv-2609-04348-v2
    quote: We adopt DCDepth [83] as the depth decoder and evaluate on the KITTI Eigen split [84],
      [85].
as_used:
  - protocol: Monocular depth papers report their main results on the Eigen split of the raw
      recordings, scored by the paper's own Abs Rel, RMSE and accuracy thresholds, and some add a
      test-server result under the official SILog ranking.
    split: the Eigen split (an author-defined split of the raw data, not the official depth
      benchmark)
    source: src-arxiv-2609-04348-v2
    quote: We further evaluate on the official KITTI online benchmark.
    note: OCEM (arXiv 2609.04348, v2 October 2026) reports Abs Rel, RMSE and delta-1 on the Eigen
      split in its Table 1 and the official board's metrics in Table 2; its 7.91 SILog on the board
      matches the leaderboard row (src-cvlibs-kitti-depth-prediction). Only this one paper was read
      for the pattern.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the servers. An October 2026 paper reports a new depth
    prediction test result that the board lists, the stereo board lists 2025 and 2026 papers, and a
    September 2026 notice asks entrants to resubmit results lost in a server restore.
  source: src-arxiv-2609-04348-v2
  quote: Our Swin-H achieves the best performance among our models, obtaining 6.36 Abs Rel, 1.02 Sq
    Rel, 8.53 iRMSE, and 7.91 SILog.
activity: accepting-submissions
activity_note: The boards have never run in rounds. Workshops were held around the suite (ICCV 2013,
  ECCV 2014, and ICCV 2021 for STEP), but no source read describes a ranked challenge round. The
  boards show no submission dates, so no newest submission is recorded.
activity_basis:
  reason: Every board is open all year to registered users, and the servers were taking results in
    August and September 2026, when a restore lost a month of them.
  source: src-cvlibs-kitti-index
  quote: Results within this period have to be resubmitted.
events:
  - name: Workshop on Reconstruction meets Recognition, ICCV 2013
    kind: workshop
    source: src-cvlibs-kitti-index
    quote: We are organizing a workshop on reconstruction meets recognition at ICCV 2013!
  - name: Workshop on Reconstruction meets Recognition, ECCV 2014
    kind: workshop
    source: src-cvlibs-kitti-index
    quote: We are organizing a workshop on reconstruction meets recognition at ECCV 2014!
  - name: Workshop on Segmenting and Tracking Every Point and Pixel, ICCV 2021 (the STEP board)
    kind: workshop
    source: src-cvlibs-kitti-step
    quote: 'This benchmark is part of the ICCV21-Workshop: Segmenting and Tracking Every Point and Pixel.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: OCEM (DCDepth decoder on a motion-pretrained Swin-H encoder), on the depth prediction
      board at 7.91 SILog
    source: src-cvlibs-kitti-depth-prediction
    observed_on: 2026-11-08
    quote: OCEM code 7.91 1.02 6.36 8.53
  - system: OCEM
    source: src-arxiv-2609-04348-v2
    observed_on: 2026-11-08
    quote: Our Swin-H achieves the best performance among our models, obtaining 6.36 Abs Rel, 1.02
      Sq Rel, 8.53 iRMSE, and 7.91 SILog.
  - system: VirConv-S, first on the 3D car detection board at 87.20 % moderate AP
    source: src-cvlibs-kitti-object-3d
    observed_on: 2026-11-08
    quote: 1 VirConv-S code 87.20 % 92.48 % 82.45 %
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Disparity, flow and depth maps from accumulated Velodyne scans (with 3D
  CAD models fitted to moving cars for the 2015 scenes), poses from the GPS/IMU unit, and boxes,
  tracks and masks from hired annotators and Mechanical Turk, held by the maintainers for every test
  image and sequence.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The development kits include the evaluation code, so training splits can be scored
    locally, and any registered user whose work targets a paper can submit to the servers.
  source: src-cvlibs-kitti-index
  quote: '26.08.2012: For transparency and reproducability, we have added the evaluation codes to the
    development kits.'
task:
  exists: true
  input:
    - a rectified colour stereo pair of a road scene from the 2015 test set (optionally its
      neighbouring frames and the calibration)
  output: A disparity map for the left image, one value per pixel; methods giving less than full
    density are filled in by background interpolation before scoring.
  scoring: D1-all, the percentage of ground-truth pixels whose disparity is an outlier (error above
    3 px and 5 % of the true value), over all 200 test images, through the server. Other boards
    score their own outputs (see subsets).
  metric_range:
    - 0.0
    - 100.0
  source: src-cvlibs-kitti-stereo-2015
  quote: Our evaluation table ranks all methods according to the number of erroneous pixels.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The test inputs and the training data and labels are released, the test ground truth
    is not. All downloads sit behind a cvlibs.net account, for which a user gives their purpose;
    submitting needs a second registration step and an institutional address. Under ADR-0020's
    access precedence the withheld test ground truth decides, and gated-registration is the near
    miss.
  access_basis:
    reason: The test data may be used only to report final results through the KITTI website; scores
      on it come only from the server.
    source: src-cvlibs-kitti-user-login
    quote: all users who download the KITTI dataset must be registered and specify the purpose of
      dataset usage.
  refresh: versioned-releases
  refresh_basis:
    reason: Every change to ground truth, metrics or boards is a dated changelog entry or board note
      -- improved stereo and flow 2012 ground truth (November 2013), longer odometry subsequences
      (October 2013), corrected flow 2015 ground truth (March 2017), 40 recall positions for
      detection (October 2019), HOTA for tracking (February 2021) -- so a claim can name the state
      it was measured on.
    source: src-cvlibs-kitti-object-3d
    quote: use 40 recall positions instead of the 11 recall positions proposed in the original
      Pascal VOC benchmark
  data_provenance:
    - real-world-instrument
    - crowd-authored
  data_provenance_note: The pixel and pose ground truth is instrument data (laser scans registered
    over neighbouring frames, with ambiguous regions removed by hand, and GPS/IMU poses). Object
    labels were drawn by hired annotators in a purpose-built 3D tool, which the paper contrasts with
    online crowd-sourcing, and 2D boxes and occlusion were corrected on Mechanical Turk
    (src-cvlibs-kitti-tracking). Neither group is described as specialist, so crowd-authored is read
    under its in-house-annotator clause.
  data_provenance_source: src-cvlibs-kitti-cvpr-2012-pdf
  data_provenance_quote: we hired a set of annotators, and asked them to assign tracklets in the
    form of 3D bounding boxes
  contamination_risk: medium
  contamination_risk_note: The test inputs are public and only the ground truth is withheld. The
    rules forbid tuning on the test data, allow three uploads a month and screen out anonymous and
    unpublished entries, but encoders pretrained on large driving and web video collections now feed
    many entries, and the raw recordings the benchmarks were drawn from are public. No source
    assesses contamination.
  contamination_risk_source: src-cvlibs-kitti-user-login
  contamination_risk_quote: it must not be used in any way to train or tune systems
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: The headline error metrics are bounded at zero (no outlier pixels, no
    drift) and the AP and HOTA boards at 100 %. No source measures a human or data ceiling, though
    the 3 px threshold is set to absorb calibration and laser error.
  ceiling_anchor_type_source: src-cvlibs-kitti-stereo-2015
  ceiling_anchor_type_quote: for scene flow this criterion needs to be fulfilled for both disparity
    maps and the flow map
  dataset_licence: CC-BY-NC-SA-3.0
  dataset_licence_note: The site also says the data is for academic use only and offers removal to
    anyone who finds themselves in it.
  dataset_licence_source: src-cvlibs-kitti-index
  dataset_licence_quote: published under the Creative Commons Attribution-NonCommercial-ShareAlike
    3.0 License
  size:
    - count: 200
      unit: test scenes (four colour images each), with 200 training scenes
      subset: stereo 2015, flow 2015 and scene flow 2015
      source: src-cvlibs-kitti-stereo-2015
      quote: The stereo 2015 / flow 2015 / scene flow 2015 benchmark consists of 200 training scenes
        and 200 test scenes
    - count: 195
      unit: test image pairs, with 194 training pairs
      subset: stereo 2012 and flow 2012
      source: src-cvlibs-kitti-stereo-2012
      quote: The stereo / flow benchmark consists of 194 training image pairs and 195 test image
        pairs
    - count: 93000
      unit: annotated depth maps (over 93 thousand) with raw lidar scans and images
      subset: depth completion and depth prediction
      source: src-cvlibs-kitti-depth-completion
      quote: It contains over 93 thousand depth maps with corresponding raw LiDaR scans and RGB
        images
    - count: 11
      unit: test sequences without ground truth (sequences 11-21), with 11 training sequences
      subset: odometry
      source: src-cvlibs-kitti-odometry
      quote: We provide 11 sequences (00-10) with ground truth trajectories for training and 11
        sequences (11-21) without ground truth for evaluation.
    - count: 7518
      unit: test images with point clouds, with 7,481 training images
      subset: 2D, 3D and bird's-eye-view object detection
      source: src-cvlibs-kitti-object-3d
      quote: The 3D object detection benchmark consists of 7481 training images and 7518 test images
        as well as the corresponding point clouds, comprising a total of 80.256 labeled objects.
    - count: 29
      unit: test sequences, with 21 training sequences
      subset: tracking (and MOTS and STEP, which share them)
      source: src-cvlibs-kitti-tracking
      quote: The object tracking benchmark consists of 21 training sequences and 29 test sequences.
  submission_limit:
    max_submissions: 3
    period_days: 30
    per: user, on each benchmark separately (since 2016-07-26); the 2012 changelog also sets 72
      hours between submissions, and no later entry says whether that still holds
    source: src-cvlibs-kitti-index

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Karlsruhe Institute of Technology and Toyota Technological Institute at Chicago (the
    KITTI project, cvlibs.net)
  maintainer_basis:
    reason: The site names the two institutes as the project's holders, hosts the data, the
      development kits and the evaluation servers, and holds the copyright on every dataset and
      benchmark on it.
    source: src-cvlibs-kitti-index
    quote: A project of Karlsruhe Institute of Technology and Toyota Technological Institute at
      Chicago
  maintainer_type: academic-lab
  maintainer_type_note: Both are research institutions, and the site thanks them for funding the
    project. Some boards were built with outside groups (the MOTS and STEP boards, and HOTA, which
    the tracking page credits to its own paper), but the site and servers stay with the project.
  submission_process:
    - held-out-server
    - publication-gated
  submission_process_note: Registered users upload test results through the site's submit page (not
    read, as it needs a login). Only the final setting of a method may be uploaded, and only work
    aimed at a peer-reviewed paper; every two months the maintainers delete entries older than six
    months that are anonymous or have no paper linked, so staying ranked needs a paper.
  submission_process_source: src-cvlibs-kitti-user-login
  submission_process_quote: Every 2 months we delete all entries that are older than 6 months and
    that are either anonymous or do not have a paper linked.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-cvlibs-kitti-stereo-2015
      quote: Object Scene Flow for Autonomous Vehicles. Conference on Computer Vision and Pattern
        Recognition (CVPR) 2015.
    - flag: single-evaluator-private-test-set
      source: src-cvlibs-kitti-user-login
      quote: The evaluation server may not be used for parameter tuning.
  independence_flags_note: The stereo 2015 board ranks OSF, the method of the paper that introduced
    the 2015 benchmarks, which the same page names as the benchmarks' reference ("More details can
    be found in Object Scene Flow for Autonomous Vehicles (CVPR 2015)"). The 2012 paper's own
    rankings are of third-party methods. The maintainers hold every board's test ground truth and
    their server scores every entry. The site credits KIT and TTI-C with funding; no other funder or
    sponsor appears in the sources read.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The ranked scores are test-set results that only the KITTI servers can produce, because
      the maintainers hold the test ground truth; training-split scores can be computed by anyone
      with the development kits.
    source: src-cvlibs-kitti-stereo-2015
    quote: Our evaluation server computes the percentage of bad pixels averaged over all ground
      truth pixels of all 200 test images.
  reproducibility_blockers:
    - private-test-set
  reproducibility_blockers_note: Downloads need an account and the licence is non-commercial, which
    slows reproduction for research without forbidding it, so licence-restriction is not tagged.
  harness_availability: official-harness
  harness: The development kit of each board, with its MATLAB / C++ evaluation code; tracking and
    MOTS are scored with the TrackEval repository since 2021.
  harness_source: src-cvlibs-kitti-index
  harness_quote: '26.08.2012: For transparency and reproducability, we have added the evaluation codes
    to the development kits.'
  submission_channel:
    source: src-cvlibs-kitti-user-login
    quote: If you want to submit your results, you also need to complete the second step.
  submission_channel_note: The cvlibs.net "submit results" page, behind the login; the KITTI and
    KITTI-360 servers are one system (both were restored together in September 2026).
  code_licence_note: The development kits' licence was not read (the kits download behind the
    login), and TrackEval's repository was not opened.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which board (and, for detection, which class and difficulty), which split
  # (the server's test set, or a training split or the Eigen split run locally), which revision of the ground
  # truth or metric (the 2013 and 2017 ground-truth fixes, AP over 40 recall positions, HOTA), and what the
  # method used beyond the default inputs (stereo, flow, multiple frames, laser points, additional training
  # data), which each board records per row.
  material_extra:
    - subset_used
    - training_data_policy
aggregation_policy: none-by-design
aggregation_policy_note: Each board ranks on its own metric, the detection boards per class and
  difficulty, and no ranking spans the boards.

secondary_axes:
  - latency
secondary_axes_basis:
  reason: Every board lists each method's runtime and computing environment beside its score; the
    tracking board leaves detection time out of it so that methods compare.
  source: src-cvlibs-kitti-tracking
  quote: To make the methods comparable, the time for object detection is not included in the
    specified runtime.

homepage: https://www.cvlibs.net/datasets/kitti/
dataset_url: https://www.cvlibs.net/datasets/kitti/raw_data.php
leaderboard_url: https://www.cvlibs.net/datasets/kitti/eval_scene_flow.php?benchmark=stereo

versions:
  - version: '2012'
    label: KITTI 2012, the first boards
    version_kind: revision
    released: 2012-03-20
    changes: Stereo 2012, flow 2012 and odometry online on 2012-03-20, with 2D object detection and
      orientation estimation from 2012-08-19; the CVPR 2012 paper.
    breaking: true
    frozen: true
    sources:
      - src-cvlibs-kitti-index
      - src-cvlibs-kitti-cvpr-2012-pdf
  - version: tracking-road-2013
    label: Tracking (June 2013) and road (September 2013) boards
    version_kind: track-set
    released: 2013-06-20
    changes: The tracking benchmark, then the road and lane estimation benchmark (2013-09-25).
    breaking: false
    frozen: true
    sources:
      - src-cvlibs-kitti-index
  - version: odometry-2013-10
    label: Odometry evaluated over 100-800 m subsequences
    version_kind: revision
    released: 2013-10-03
    changes: The evaluated subsequence lengths changed from 5-400 m to 100-800 m because GPS/IMU
      error biased the short ones; earlier odometry numbers differ.
    breaking: true
    frozen: true
    sources:
      - src-cvlibs-kitti-odometry
      - src-cvlibs-kitti-index
  - version: gt-2013-11
    label: Improved stereo and flow 2012 ground truth
    version_kind: revision
    released: 2013-11-04
    changes: Refined ground-truth disparity maps and flow fields for the 2012 boards, which lowered
      every method's error slightly.
    breaking: true
    frozen: true
    sources:
      - src-cvlibs-kitti-stereo-2012
  - version: '2015'
    label: KITTI 2015, stereo, flow and scene flow on dynamic scenes
    version_kind: track-set
    released: 2015-07-29
    changes: Three new boards on 200 training and 200 test scenes with moving objects, whose ground
      truth fits 3D CAD models to the moving cars (CVPR 2015). The 2012 boards stay open beside
      them.
    breaking: false
    frozen: true
    sources:
      - src-cvlibs-kitti-index
      - src-cvlibs-kitti-stereo-2015
      - src-cvf-object-scene-flow-2015
  - version: flow-gt-2017-03
    label: Corrected flow 2015 and scene flow 2015 ground truth
    version_kind: revision
    released: 2017-03-13
    changes: Fixed errors in the flow ground truth of dynamic foreground objects, which lowered flow
      and scene flow errors slightly; the stereo 2015 board did not change.
    breaking: true
    frozen: true
    sources:
      - src-cvlibs-kitti-stereo-2015
  - version: 3d-depth-2017
    label: 3D and bird's-eye-view detection (July 2017), depth completion and prediction (December
      2017)
    version_kind: track-set
    released: 2017-07-26
    changes: The 3D object and bird's-eye-view boards on the object data, then the depth completion
      and single-image depth prediction boards on over 93,000 depth maps (2017-12-11).
    breaking: false
    frozen: true
    sources:
      - src-cvlibs-kitti-index
      - src-cvlibs-kitti-depth-completion
  - version: semantics-2018
    label: Semantic and instance segmentation boards
    version_kind: track-set
    released: 2018-03-18
    changes: Pixel-level semantic segmentation and instance segmentation benchmarks.
    breaking: false
    frozen: true
    sources:
      - src-cvlibs-kitti-index
  - version: ap40-2019-10
    label: Detection AP over 40 recall positions
    version_kind: revision
    released: 2019-10-08
    changes: The 2D, 3D and bird's-eye-view boards moved from 11 to 40 recall positions; the earlier
      leaderboards are kept separately.
    breaking: true
    frozen: true
    sources:
      - src-cvlibs-kitti-object-3d
  - version: mots-2019
    label: Multi-object tracking and segmentation (MOTS) board
    version_kind: track-set
    released: 2019-12-04
    changes: Added the MOTS benchmark on the tracking sequences.
    breaking: false
    frozen: true
    sources:
      - src-cvlibs-kitti-index
  - version: hota-2021-02
    label: Tracking and MOTS ranked by HOTA
    version_kind: revision
    released: 2021-02-25
    changes: Tracking and MOTS moved to HOTA as the main metric, scored with TrackEval; MOTA and ID
      switches were redefined to match MOTChallenge, and every result was recalculated.
    breaking: true
    frozen: true
    sources:
      - src-cvlibs-kitti-tracking
      - src-cvlibs-kitti-index
versions_note: The STEP board (ICCV 2021) has no changelog entry and is not given a version. The
  September 2026 server restore lost results submitted after 2026-08-07, which had to be
  resubmitted; it changed no ground truth or metric.

subsets:
  - id: kitti#stereo-2012
    label: Stereo 2012
    domain_override:
      primary: vision/depth-geometry
    evidence:
      - source: src-cvlibs-kitti-stereo-2012
        quote: Our evaluation table ranks all methods according to the number of non-occluded
          erroneous pixels at the specified disparity / end-point error threshold.
    notes: 195 test pairs with semi-dense laser ground truth; ranked by the share of non-occluded
      pixels above an error threshold of 2 to 5 px (3 px by default).
  - id: kitti#flow-2012
    label: Flow 2012
    domain_override:
      primary: vision/image-matching-correspondence
    evidence:
      - source: src-cvlibs-kitti-stereo-2012
        quote: The stereo / flow benchmark consists of 194 training image pairs and 195 test image
          pairs
    notes: The stereo 2012 images, scored on optical-flow end-point error with the same outlier
      measure. Its page was not read.
  - id: kitti#stereo-2015
    label: Stereo 2015
    domain_override:
      primary: vision/depth-geometry
    evidence:
      - source: src-cvlibs-kitti-stereo-2015
        quote: Our evaluation server computes the percentage of bad pixels averaged over all ground
          truth pixels of all 200 test images.
    notes: The headline task (see task); ranked by D1-all over 200 dynamic test scenes.
  - id: kitti#flow-2015
    label: Flow 2015
    domain_override:
      primary: vision/image-matching-correspondence
    evidence:
      - source: src-cvlibs-kitti-index
        quote: '29.07.2015: We have released our new stereo 2015, flow 2015, and scene flow 2015 benchmarks.'
    notes: The 2015 scenes, ranked by Fl-all, the share of optical-flow outliers. Its page was not
      read; the stereo 2015 page defines Fl.
  - id: kitti#scene-flow-2015
    label: Scene flow 2015
    domain_override:
      primary: vision/depth-geometry
      secondary:
        - vision/image-matching-correspondence
    evidence:
      - source: src-cvlibs-kitti-stereo-2015
        quote: 'SF: Percentage of scene flow outliers (=outliers in either D0, D1 or Fl)'
    notes: Disparity in both frames and flow, a pixel counting as correct only when all three are.
      Its page was not read.
  - id: kitti#depth-completion
    label: Depth completion
    domain_override:
      primary: vision/depth-geometry
    evidence:
      - source: src-cvlibs-kitti-depth-completion
        quote: Our evaluation table ranks all methods according to the root mean squared error
          (RMSE) of the inverse depth maps.
    notes: Dense depth from a sparse projected lidar scan (with or without the image), on manually
      selected test frames with unpublished depth maps; ranked by iRMSE.
  - id: kitti#depth-prediction
    label: Depth prediction (single image)
    domain_override:
      primary: vision/depth-geometry
    evidence:
      - source: src-cvlibs-kitti-depth-prediction
        quote: Our evaluation table ranks all methods according to square root of the scale
          invariant logarithmic error (SILog).
    notes: Depth from one image on the same test frames as depth completion; ranked by SILog.
  - id: kitti#odometry
    label: Visual odometry / SLAM
    domain_override:
      primary: vision/driving-perception-3d
    evidence:
      - source: src-cvlibs-kitti-odometry
        quote: For this benchmark you may provide results using monocular or stereo visual odometry,
          laser-based SLAM or algorithms that combine visual and LIDAR information.
      - source: src-cvlibs-kitti-odometry
        quote: our evaluation computes translational and rotational errors for all possible
          subsequences of length (100,...,800) meters.
    notes: The car's trajectory over 11 test sequences, from cameras, laser or both, ranked by mean
      translational drift (%) with rotational drift (deg/m) beside it. Camera pose has no leaf of
      its own; image-matching-correspondence, which holds pose-scored matching, is the near miss,
      but laser-only methods are ranked too.
  - id: kitti#object-2d
    label: 2D object detection and orientation estimation
    domain_override:
      primary: vision/detection
    evidence:
      - source: src-cvlibs-kitti-index
        quote: '19.08.2012: The object detection and orientation estimation evaluation goes online!'
    notes: Image-plane boxes for cars, pedestrians and cyclists by AP at three difficulty levels,
      with orientation similarity. Its page was not read.
  - id: kitti#object-3d
    label: 3D object detection
    domain_override:
      primary: vision/driving-perception-3d
      secondary:
        - vision/detection
    evidence:
      - source: src-cvlibs-kitti-object-3d
        quote: For cars we require an 3D bounding box overlap of 70%, while for pedestrians and
          cyclists we require a 3D bounding box overlap of 50%.
      - source: src-cvlibs-kitti-object-3d
        quote: All methods are ranked based on the moderately difficult results.
    notes: 3D boxes from images, laser points or both on 7,518 test frames, AP over 40 recall
      positions per class and difficulty, ranked at moderate.
  - id: kitti#object-bev
    label: Bird's eye view detection
    domain_override:
      primary: vision/driving-perception-3d
      secondary:
        - vision/detection
    evidence:
      - source: src-cvlibs-kitti-index
        quote: We have added novel benchmarks for 3D object detection including 3D and bird's eye
          view evaluation.
    notes: The 3D detection task scored on ground-plane box overlap. Its page was not read.
  - id: kitti#tracking
    label: Multi-object tracking (2D boxes)
    domain_override:
      primary: vision/video-understanding
      secondary:
        - vision/detection
    evidence:
      - source: src-cvlibs-kitti-tracking
        quote: We evaluate 2D 0-based bounding boxes in each image.
      - source: src-cvlibs-kitti-tracking
        quote: Methods are ranked overall by HOTA
    notes: Car and pedestrian tracks over 29 test sequences, ranked by HOTA with CLEAR MOT and
      MT/PT/ML beside it. Image-plane boxes, so not driving-perception-3d. No tracking leaf exists
      (taxonomy/_failures, kitti-001); video-understanding is the nearest, as for MOTChallenge.
  - id: kitti#mots
    label: Multi-object tracking and segmentation (MOTS)
    domain_override:
      primary: vision/segmentation
      secondary:
        - vision/detection
    evidence:
      - source: src-cvlibs-kitti-index
        quote: We have added a novel benchmark for multi-object tracking and segmentation (MOTS)!
    notes: Tracks given as instance masks on the tracking sequences, ranked by HOTA since 2021. Its
      page was not read.
  - id: kitti#step
    label: Segmenting and tracking every pixel (STEP)
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-cvlibs-kitti-step
        quote: We evaluate submitted results using the Segmentation and Tracking Quality (STQ)
          metric
    notes: A semantic label for every pixel and a track ID for every car and pedestrian pixel on the
      tracking sequences, ranked by STQ, the geometric mean of association and segmentation quality.
      Part of an ICCV 2021 workshop.
  - id: kitti#road
    label: Road and lane estimation
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-cvlibs-kitti-index
        quote: '25.09.2013: The road and lane estimation benchmark has been released!'
    notes: Road area and ego-lane labels; the site cites its own ITSC 2013 paper for it. Its page
      and metric were not read.
  - id: kitti#semantics
    label: Semantic segmentation (pixel-level)
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-cvlibs-kitti-index
        quote: We have added novel benchmarks for semantic segmentation and semantic instance
          segmentation!
    notes: Its page was not read.
  - id: kitti#instance-seg
    label: Instance segmentation (instance-level)
    domain_override:
      primary: vision/segmentation
    evidence:
      - source: src-cvlibs-kitti-index
        quote: We have added novel benchmarks for semantic segmentation and semantic instance
          segmentation!
    notes: Its page was not read.

lineage:
  role: root
  variants:
    - id: kitti-360
      relation: successor dataset by the same group on the same server, with new suburban recordings
        around Karlsruhe (73.7 km), a 360-degree fisheye, stereo and pushbroom-laser rig, its own
        paper (PAMI 2022) and its own boards
      source: src-cvlibs-kitti-360-index
      quote: This setup is similar to the one used in KITTI
lineage_note: KITTI-360 is a separate benchmark by 04 S4. It is not an edition, because its task set
  differs (2D and 3D semantic and instance segmentation, semantic scene completion, novel view
  synthesis, semantic SLAM) and its data is a new recording, and it is independently versioned and
  cited. The id kitti-360 is a proposal; no entry or allocation exists for it. Derivatives by other
  groups were not read.


# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T06)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-cvlibs-kitti-cvpr-2012-pdf
    - src-crossref-10-1109-cvpr-2012-6248074
    - src-crossref-10-1177-0278364913491297
    - src-cvf-object-scene-flow-2015
    - src-cvlibs-kitti-index
    - src-cvlibs-kitti-user-login
    - src-cvlibs-kitti-stereo-2012
    - src-cvlibs-kitti-stereo-2015
    - src-cvlibs-kitti-depth-completion
    - src-cvlibs-kitti-depth-prediction
    - src-cvlibs-kitti-odometry
    - src-cvlibs-kitti-object-3d
    - src-cvlibs-kitti-tracking
    - src-cvlibs-kitti-step
    - src-cvlibs-kitti-360-index
    - src-arxiv-2609-04348-v2
  sources_note: >
    cvlibs.net serves no robots.txt (404), and its pages are server-rendered HTML, read with scripts and
    styles stripped; nothing was registered, logged in to or submitted, and the login page was read as
    a public page. The leaderboard pages' extracts keep only the quoted passages, because each ranked
    row is followed by its paper's author list; the stereo 2012 and tracking pages are withheld from archiving
    for an e-mail address each, and the CVPR 2012 PDF for its authors' addresses. The CVPR 2012 paper
    is read as the authors' copy on cvlibs.net, with Crossref's DOI record beside it; the IJRR paper only
    through its Crossref record. The flow 2012, flow 2015, scene flow, 2D object, bird's-eye-view, MOTS,
    road and segmentation pages were not read. OCEM's v2 PDF (a DOI) is evidence of current use.
  confidence: medium
  review_checks:
    - check: Primary depth-geometry rather than driving-perception-3d or segmentation. By board
        count depth-geometry and segmentation tie at five (MOTS and STEP counted as segmentation),
        and depth-geometry was taken because the suite's founding and stated tasks are geometric.
        The leaf driving-perception-3d's definition, perceiving the 3D road scene from vehicle
        sensors, literally covers every KITTI board; it was kept for the 3D detection and odometry
        boards, to keep the leaf to what nuScenes is (3D boxes and tracks in the world frame).
      field: domain
      source: src-cvlibs-kitti-index
      quote: 'Our tasks of interest are: stereo, optical flow, visual odometry, 3D object detection and
        3D tracking.'
    - check: Identity. The seventeen boards are subsets of one suite (one site, account, policy and
        server), and the 2015 stereo and flow boards are a track-set rather than an edition, because
        the 2012 boards stay open beside them. KITTI 2015 could be argued an edition of the 2012
        stereo and flow boards (same tasks, new scenes, its own paper).
      field: versions
      source: src-cvlibs-kitti-index
      quote: '29.07.2015: We have released our new stereo 2015, flow 2015, and scene flow 2015 benchmarks.'
    - check: KITTI-360 is linked as a same-maintainer variant with the proposed id kitti-360. It
        shares the server and the copyright line, but the PAMI 2022 paper was not read, and no
        source read names who holds KITTI-360 now. The KITTI home page links the University of
        Tuebingen's Autonomous Vision group, which may be today's host of both, but no text on it
        says so.
      field: lineage
      source: src-cvlibs-kitti-360-index
      quote: This setup is similar to the one used in KITTI
    - check: maintainer-competes-on-own-benchmark rests on OSF, the 2015 paper's method, ranked on
        the stereo 2015 board (also, not read, the flow and scene flow boards). The author overlap
        between that paper and the suite's maintainers is not quoted, by the no-names rule; a
        reviewer should confirm it from the paper.
      field: governance.independence_flags
      source: src-cvlibs-kitti-stereo-2015
      quote: Object Scene Flow for Autonomous Vehicles. Conference on Computer Vision and Pattern
        Recognition (CVPR) 2015.
    - check: crowd-authored rests on hired annotators and Mechanical Turk workers whom no source
        describes as specialists. Most of the depth, flow and pose ground truth is instrument data,
        so real-world-instrument is the larger share.
      field: data.data_provenance
      source: src-cvlibs-kitti-tracking
      quote: we additionally labeled the left/right boundaries of each object by making use of
        Mechanical Turk
    - check: The tracking board scores 2D image boxes over time and has no leaf; it was put under
        video-understanding with detection secondary, as the MOTChallenge draft does, and logged as
        a missing term (kitti-001; motchallenge-001 proposes the same vision/multi-object-tracking).
        The odometry board was put under driving-perception-3d for want of a pose leaf.
      field: subsets
      source: src-cvlibs-kitti-tracking
      quote: We evaluate 2D 0-based bounding boxes in each image.
    - check: submission_limit is three a month per benchmark (2016). The 72-hour minimum gap from
        2012 may still apply, and the login page asks for a single upload of a method's final
        setting, which is a stricter rule than the cap.
      field: data.submission_limit
      source: src-cvlibs-kitti-index
      quote: '26.07.2016: For flexibility, we now allow a maximum of 3 submissions per month and count
        submissions to different benchmarks separately.'
    - check: as_used rests on one paper. Depth prediction papers commonly report the Eigen split,
        and 3D detection papers often report a validation split of the training data; only the depth
        case was read.
      field: as_used
      source: src-arxiv-2609-04348-v2
      quote: We adopt DCDepth [83] as the depth decoder and evaluate on the KITTI Eigen split [84],
        [85].
    - check: evaluation_method leaves the road, semantic and instance segmentation boards untagged
        because their pages were not read; road is usually scored by an F-measure in the bird's-eye
        view (classification-metric) and segmentation by IoU (domain-metric).
      field: evaluation_method
    - check: activity accepting-submissions reads the 2013, 2014 and 2021 workshops as events beside
        a board that never ran rounds. If any held a ranked challenge on a KITTI board, the value is
        leaderboard-live-no-round.
      field: activity

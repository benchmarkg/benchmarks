    - src-huggingface-space-nuscenes-detection-challenge
    - src-github-nuscenes-devkit-pr-1209
    - src-arxiv-2609-32163-v1
  sources_note: >
    The paper's v5 PDF (a DOI, not archived) read as text, and its abstract page for the dates. nuscenes.org
    is a React app: the overview and terms-of-use Sources are the text of the script chunks that render
    them, and the leaderboard Sources are the JSON files the task pages load. The task pages render the
    devkit's task READMEs, which are Sources at raw.githubusercontent.com. The Hugging Face Space and
    the
    pull request are API records. PQR3D's v1 PDF is evidence of current use. The prediction, lidar
    segmentation and panoptic leaderboard JSON was read but is not a Source; the lidar segmentation and
    panoptic Motional and Freiburg rows in the independence note rest on it.
  confidence: medium
  review_checks:
    - check: evaluation_method tags NDS's constituents as composite asks. The translation,
        orientation and velocity errors are read as statistical-fit (mean errors on continuous
        values) and the attribute error as classification-metric (macro-averaged accuracy). All five
        TP errors could instead be read as nuScenes-defined detection measures (domain-metric),
        which would leave composite combining a single method.
      field: evaluation_method
      source: src-github-nuscenes-devkit-detection-readme
      quote: Our final score is a weighted sum of mean Average Precision (mAP) and several True
        Positive (TP) metrics.
    - check: The prediction subset inherits driving-perception-3d and perception, but it forecasts
        agents' trajectories from their annotated past and the map, which is not perception. No
        capability passes. probabilistic-forecasting needs unresolved futures, scientific-prediction
        is for physical systems, and planning is the ego's own plan. Its challenge also requires a
        technical report and has the maintainers re-run the top five on the test set.
        publication-gated and sandboxed-rerun are recorded on the subset only, not tagged on the
        entry.
      field: subsets
      source: src-github-nuscenes-devkit-prediction-readme
      quote: Every submission to the challenge must be accompanied by a brief technical report
    - check: The leaderboard lists PQR3D's camera-only row, which uses future frames, beside entries
        that keep to the 0.5 s past-data rule. Whether the maintainers enforce the rule or only
        label such rows decides whether NDS on the board is comparable across rows (as_used).
      field: as_used
      source: src-nuscenes-leaderboard-detection
      quote: The submitted ViT-L configuration uses future frames and external pretraining.
    - check: data_provenance has real-world-instrument only. The labels come from Scale's "expert
        annotators", but no source describes the annotators' prior skill or training. That would
        decide between expert-authored and crowd-authored.
      field: data.data_provenance
      source: src-arxiv-1903-11027-v5
      quote: Using expert annotators and multiple validation steps, we achieve highly accurate
        annotations.
    - check: activity leaderboard-live-no-round rests on the 2019-2021 workshop challenges being
        rounds. If they count as events beside a leaderboard that never ran in rounds, it is
        accepting-submissions.
      field: activity
    - check: Identity. nuScenes-lidarseg and Panoptic nuScenes are filed as subsets because they
        share the scenes, splits, devkit and site, though Panoptic nuScenes has its own paper (arXiv
        2109.03805, not read). nuImages (2D images, no leaderboard) and nuPlan (planning, its own
        benchmark) are left out.
      field: subsets
      source: src-github-nuscenes-devkit-readme
      quote: 'Jul. 29, 2021: Devkit v1.1.6: Panoptic nuScenes v1.0 code, NeurIPS challenge announcement.'
    - check: maintainer-competes-on-own-benchmark rests on Motional's own rows, one of them marked
        as a baseline outside the challenge. contamination_risk medium follows COCO's and ScanNet's
        reading of released test inputs with withheld labels.
      field: governance.independence_flags
      source: src-nuscenes-leaderboard-detection
      quote: PointPillars is a baseline that does not participate in the nuScenes detection
        challenge.

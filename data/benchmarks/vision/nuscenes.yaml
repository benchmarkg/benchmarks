curation:
  added_by: agent (P1-S8-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1903-11027-v5
    - src-arxiv-1903-11027
    - src-nuscenes-site
    - src-nuscenes-terms-of-use
    - src-nuscenes-leaderboard-detection
    - src-nuscenes-leaderboard-tracking
    - src-github-nuscenes-devkit-readme
    - src-github-nuscenes-devkit-detection-readme
    - src-github-nuscenes-devkit-tracking-readme
    - src-github-nuscenes-devkit-prediction-readme
    - src-github-nuscenes-devkit-lidarseg-readme

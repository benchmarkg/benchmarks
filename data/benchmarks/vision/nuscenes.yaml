        quote: The challenge winner will be determined based on AMOTA.
    notes: Online 3D multi-object tracking of the 7 non-static detection classes, ranked by AMOTA,
      with AMOTP and traditional MOT metrics beside it. Released in November 2019, designed with
      Carnegie Mellon University.
  - id: nuscenes#prediction
    label: Prediction
    scored_separately: true
    evidence:
      - source: src-github-nuscenes-devkit-prediction-readme
        quote: The goal of the nuScenes prediction task is to predict the future trajectories of
          objects in the nuScenes dataset.
      - source: src-github-nuscenes-devkit-prediction-readme
        quote: Unlike previous challenges, the leaderboard will be ranked according to performance
          on the nuScenes val set.
      - source: src-github-nuscenes-devkit-prediction-readme
        quote: the top 5 submissions on the leaderboard will be asked to send us their code and we
          will run their model on the test set.
      - source: src-github-nuscenes-devkit-prediction-readme
        quote: Every submission to the challenge must be accompanied by a brief technical report
    notes: Six seconds of an agent's future x-y positions at 2 Hz, up to 25 weighted modes, from up
      to two seconds of history; minADE_k, minFDE_k and a 2 m miss rate. The leaderboard ranks
      validation-set results, and the maintainers run the top five's code on the test set to decide
      the challenge. Three submissions a month. Released in March 2020.
  - id: nuscenes#lidarseg
    label: Lidar segmentation (nuScenes-lidarseg)
    scored_separately: true
    evidence:
      - source: src-github-nuscenes-devkit-lidarseg-readme
        quote: The challenge winners and leaderboard ranking will be determined by the mean
          intersection-over-union (mIOU) score.
      - source: src-github-nuscenes-devkit-lidarseg-readme
        quote: There are 16 categories (10 foreground classes and 6 background classes).
    notes: A class for every lidar point of each test keyframe, scored by mIoU over 16 classes
      merged from 32. Released in August 2020.
  - id: nuscenes#panoptic
    label: Panoptic nuScenes (panoptic segmentation and tracking)
    scored_separately: true
    evidence:
      - source: src-github-nuscenes-devkit-panoptic-readme
        quote: as the primary ranking metric for panoptic segmentation tasks, and Panoptic Tracking
          (PAT) metric as the primary
      - source: src-github-nuscenes-devkit-panoptic-readme
        quote: collaboration between Motional and the Robot Learning Lab of Prof. Valada at the
          University of Freiburg.
    notes: A semantic class and an instance ID for every lidar point, ranked by PQ for panoptic
      segmentation and by PAT for panoptic tracking, with LSTQ and PTQ beside them. Released in 2021
      with the University of Freiburg; the panoptic labels have their own paper (arXiv 2109.03805).


      source: src-davischallenge-challenge2020-semisupervised
      quote: The new annotations in this dataset belong to the organizers of the challenge and are
        licensed under a Creative Commons Attribution 4.0 License.
    - check: The sources disagree on DAVIS 2017's size. The 2017 paper counts 10,459 frames and 376
        objects; the 2018 and 2019 papers say 10,474 frames and 384 objects. data.size uses the 2017
        paper's table.
      field: data.size
      source: src-arxiv-1803-00557-v2
      quote: up to 150 sequences (10474 annotated frames) from 50 sequences (3455 frames), more than
        one annotated object per sequence (384 objects instead of 50)
    - check: Independence is not assessed. The workshops were sponsored by Google, Adobe and Disney

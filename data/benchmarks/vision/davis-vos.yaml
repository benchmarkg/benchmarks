      - src-davischallenge-challenge2018
  - version: '2019'
    label: The 2019 DAVIS Challenge (CVPR 2019)
    version_kind: track-set
    released: 2019-05-02
    changes: The semi-supervised track unchanged, the interactive track scored by J&F instead of J
      with an optional choice of the frame to annotate, and a new unsupervised multi-object track on
      DAVIS 2017 Unsupervised (the train and val sequences re-annotated, with 60 new test
      sequences); 28 teams.
    breaking: false
    supersedes_version: '2018'
    superseded_by: '2020'
    frozen: true
    sources:
      - src-arxiv-1905-00737
      - src-arxiv-1905-00737-v1
      - src-davischallenge-challenge2019
      - src-davischallenge-davis2017-code
  - version: '2020'
    label: The 2020 DAVIS Challenge (CVPR 2020)
    version_kind: track-set
    changes: The three 2019 tracks on the same data, with test-challenge phases from 3 to 15 May
      2020 (interactive from 27 April) and a virtual workshop. The last challenge; the maintainers
      say no more will be held. No source read dates its announcement.
    breaking: false
    supersedes_version: '2019'
    frozen: true
    sources:
      - src-davischallenge-challenge2020
      - src-davischallenge-challenge2020-semisupervised
      - src-davischallenge-challenge2020-interactive
      - src-davischallenge-home
versions_note: The 2016 and 2017 releases are both still reported (DAVIS 2016 val and DAVIS 2017 val
  and test-dev), and numbers on them are not comparable. The challenge rounds from 2018 add tracks
  without changing the semi-supervised data, so semi-supervised scores on test-dev are comparable
  across 2017-2020.

subsets:
  - id: davis-vos#semi-supervised
    label: Semi-supervised (first-frame masks given)
    evidence:
      - source: src-arxiv-1704-00675-v3
        quote: This excludes more supervised approaches that include a human in the loop
          (interactive segmentation) and unsupervised techniques (no initial mask is given).
      - source: src-davischallenge-home
        quote: Semi-supervised and Unsupervised refer to the level of human interaction at test
          time, not during the training phase.
    notes: The main track of every challenge and the one most papers report. The masks of the
      objects to segment are given in the first frame, and the method segments them in the rest. In
      DAVIS 2016 one object per sequence, in DAVIS 2017 several, each with its own identity.
  - id: davis-vos#interactive
    label: Interactive (scribbles from a simulated user), 2018-2020
    evidence:
      - source: src-arxiv-1803-00557-v2
        quote: we introduce a new teaser track, in which we will explore the evaluation of
          interactive video object segmentation algorithms
      - source: src-arxiv-1905-00737-v1
        quote: This process is repeated several times until a maximum number of interactions (8) or
          a maximum allowed interaction time (30 seconds per object for each interaction) is
          reached.
      - source: src-davischallenge-challenge2020-interactive
        quote: We interpolate the previous Time vs J&F plot at 60 seconds to obtain a J&F value.
    notes: The method receives human-drawn scribbles, returns masks for the whole video, and
      receives simulated scribbles on its worst frame, up to eight rounds, on the DAVIS 2017
      test-dev sequences. Ranked by the area under the time-J&F curve and by J&F at 60 seconds (J
      alone in 2018).
  - id: davis-vos#unsupervised
    label: Unsupervised (no input at test time), 2019-2020
    evidence:
      - source: src-arxiv-1905-00737-v1
        quote: We additionally introduce 60 new sequences for the test-dev and test-challenge sets
          of the unsupervised competition track
      - source: src-arxiv-1905-00737-v1
        quote: predicted segmentation masks for objects that are not annotated in the ground-truth
          are not penalized
      - source: src-cvf-davis-cvpr2016-pdf
        quote: Within the unsupervised category we evaluate the performance of NLC
    notes: The method proposes non-overlapping objects with identities across the video; each
      annotated object is matched to one proposal by bipartite matching on J&F, and unmatched
      proposals cost nothing. It runs on DAVIS 2017 Unsupervised, whose annotations mark the objects
      that would draw a viewer's gaze. The 2016 paper already scored unsupervised methods on its 50
      sequences, as a category rather than a track.
subsets_note: The test-dev and test-challenge splits are recorded in data.size, not as subsets.

lineage:
  role: root
lineage_note: Other groups' video object segmentation datasets, such as YouTube-VOS (which the 2020
  track pages allow for pretraining) and MOSE (reported beside DAVIS 2017 in EdgeTAM's abstract),
  are separate benchmarks, not derivatives, and get no ids here. The community re-annotations listed
  on the home page (referring expressions for DAVIS 2016 and 2017, eye fixations and object shadows
  for DAVIS 2016) were made by other groups on DAVIS sequences; whether any is a benchmark in its
  own right (a fork) was not assessed.


# data/benchmarks/vision/davis-vos.yaml
#
# P1-S8-T07, vision entry 19. Filled from the DAVIS 2016 paper (CVPR 2016), read as the text of its CVF
# open-access PDF, with Crossref's record of the IEEE version for its DOI (10.1109/CVPR.2016.85) and the
# conference dates; the three challenge papers, each read as the text of its latest arXiv PDF with its abstract
# page: the 2017 DAVIS Challenge (arXiv 1704.00675v3), which introduced DAVIS 2017, the 2018 challenge
# (1803.00557v2) and the 2019 challenge (1905.00737v1); davischallenge.org's home page, its DAVIS 2016 and
# DAVIS 2017 download pages, the 2018, 2019 and 2020 challenge pages and the 2020 semi-supervised and
# interactive track pages; the two CodaLab competition pages (LISN) that still take test-dev submissions; the
# davis2017-evaluation README pinned to commit ac7c43f; and three arXiv abstract pages as evidence of current
# use (EdgeTAM, 2501.07256; TinySAM 2, 2605.18013; a 2021 GCPR manuscript posted in August 2026, 2608.11835).
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is DAVIS as one family (04 S4), from one group at ETH Zurich's Computer Vision Laboratory: DAVIS
# 2016 and DAVIS 2017 are editions (2017 re-annotates the 2016 sequences with multiple objects and adds 100
# new ones); the 2018, 2019 and 2020 challenges reuse the DAVIS 2017 splits and are track sets. The
# semi-supervised, interactive and unsupervised tracks are subsets. YouTube-VOS, MOSE and the community's
# re-annotations of DAVIS (referring expressions, eye fixations, shadows) are other groups' work and appear
# only in lineage_note. The challenge and CodaLab pages name organisers, invited speakers and leaderboard
# users; their extracts leave every name out and the Sources are withheld from archiving.

id: davis-vos
name: DAVIS (Densely Annotated VIdeo Segmentation)
aliases:
  - DAVIS
  - DAVIS 2016
  - DAVIS 2017
  - DAVIS-2017
  - DAVIS Challenge on Video Object Segmentation
  - Densely-Annotated VIdeo Segmentation
tagline: Video object segmentation from ETH Zurich, DAVIS 2016 and 2017, scored by region J and
  contour F on per-frame masks.
description: >
  A benchmark for video object segmentation: separating one or more objects from the background in every
  frame of a short video. DAVIS 2016 has 50 Full HD sequences of about 70 frames, each with one object
  (or two connected ones) annotated by a pixel-accurate mask in every frame, and scores a method by region
  similarity J (the Jaccard index), contour accuracy F (a boundary F-measure) and temporal stability T.
  DAVIS 2017 kept those sequences, re-annotated them with every visible object and added 100 new ones,
  for 150 sequences in four splits: train and val with full annotations, and test-dev and test-challenge
  with only the first frame's masks public. From 2017 the ranking measure is J&F, the mean of J and F
  averaged over all objects, computed at 480p by the maintainers' CodaLab server. Yearly challenges at
  CVPR from 2017 to 2020 ran a semi-supervised track (the first frame's masks are given), an interactive
  track from 2018 (a server simulates a user's scribbles and times each answer) and an unsupervised track
  from 2019 (no input at test time, on separately annotated data). The maintainers have since put the
  initiative in maintenance mode: no more challenges and no more updates to the site's leaderboards, while
  the CodaLab test-dev servers stay open. Papers in 2025 and 2026 still report J&F on DAVIS 2017.
self_description:
  source: src-cvf-davis-cvpr2016-pdf
  quote: In this work we present a new benchmark dataset and evaluation methodology for the area of
    video object segmentation.
external_ids:
  arxiv: '1704.00675'
paper:
  title: A Benchmark Dataset and Evaluation Methodology for Video Object Segmentation
  doi: 10.1109/cvpr.2016.85
  source: src-cvf-davis-cvpr2016-pdf
paper_note: The DAVIS 2016 paper (CVPR 2016, pages 724-732), read as the CVF open-access PDF; the
  DOI is the IEEE version's, from Crossref (src-crossref-10-1109-cvpr-2016-85). DAVIS 2017 and its
  metrics are defined in the 2017 challenge paper (arXiv 1704.00675, v3 read), which is
  external_ids.arxiv.
released: 2016-06-27
released_note: The first day of CVPR 2016 (27-30 June 2016, Las Vegas), where the paper was
  presented, from Crossref's event record; Crossref dates the paper itself to June 2016 only. No
  earlier release date of the data was read.
released_source: src-crossref-10-1109-cvpr-2016-85
released_quote: '"event":{"name":"2016 IEEE Conference on Computer Vision and Pattern Recognition (CVPR)","location":"Las
  Vegas, NV","start":{"date-parts":[[2016,6,27]]}'
release_venue: CVPR 2016, Las Vegas

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/segmentation
  secondary:
    - vision/video-understanding
domain_basis:
  reason: What is scored is a pixel mask per object per frame, by region overlap (J, the Jaccard
    index) and boundary accuracy (F) against manual masks, averaged over frames and objects. That is
    segmentation's operation, every pixel assigned to an object or the background, applied to the
    frames of a video; no language is consumed or scored, so 02 S11 rule 12 keeps it in vision.
    video-understanding is secondary because the masks must follow each object through the video
    with a consistent identity, and the decay statistic and the interactive track's timing are
    temporal, but nothing is scored as an action, event or temporal segment.
  source: src-cvf-davis-cvpr2016-pdf
  quote: Video object segmentation is a binary labeling problem aiming to separate foreground
    object(s) from the background region of a video.
domain_considered_and_rejected:
  - term: multimodal/video-language
    reason: The referring-expression annotations of DAVIS 2016 and 2017 are a community contribution
      by another group, listed on the home page; no DAVIS track poses or scores language.
    source: src-davischallenge-home
    quote: Referring expression annotations for DAVIS 2016 and DAVIS 2017
  - term: vision/detection
    reason: The unsupervised track must find the objects itself, but it is scored by J&F on masks
      matched to the annotated objects, not by boxes or detection AP.
capability:
  - perception
capability_basis:
  perception:
    reason: Every track scores what was recovered from the video, the object masks in each frame,
      against manual pixel-accurate masks.
    source: src-cvf-davis-cvpr2016-pdf
    quote: we provide pixel-accurate, manually created segmentation in the form of a binary mask.
capability_considered_and_rejected:
  - term: temporal-reasoning
    reason: Objects must be followed through occlusions with their identities kept, but the score is
      per-frame overlap and boundary accuracy, not an inference about order or duration (as for
      MOTChallenge).
  - term: grounding
    reason: The interactive track's scribbles point at objects, but they are drawn on the frames,
      not given in language, and the score is again J&F on the masks.

evaluation_method:
  - domain-metric
evaluation_method_note: >
  J is the intersection-over-union of a frame's mask with the ground truth, and F the F-measure of contour
  precision and recall under a bipartite matching of boundary pixels, both as defined in the 2016 paper;
  each is reported as a mean, a recall (the fraction of sequences above 0.5) and a decay over the video's
  quarters. The 2016 paper adds temporal stability T, dropped from the ranking in 2017. The interactive
  track ranks by the area under the curve of J&F against time and by J&F reached at 60 seconds.
evaluation_method_basis:
  reason: J (region IoU) and the boundary F-measure are segmentation measures named and standardised
    within the field, and J&F is their mean, the aggregation of two domain metrics of the same kind.
  source: src-arxiv-1704-00675-v3
  quote: as the average of the mean region and contour accuracies
evaluation_method_considered_and_rejected:
  - term: composite
    reason: J&F averages two measures, but both are segmentation overlap measures of one method
      against the same masks, which the term's exclusion leaves out (as for COCO's AP).
  - term: classification-metric
    reason: F is an F-measure, but of contour points matched spatially between two masks, a boundary
      measure specific to segmentation rather than a confusion-matrix statistic.
    source: src-cvf-davis-cvpr2016-pdf
    quote: We consider the so called F-measure F as a good trade-off between the two
designed_for_subjects:
  - task-specific-supervised-model
  - classical-algorithm
designed_for_subjects_note: The classical-algorithm reading rests on the 2016 paper, whose baselines
  were mostly untrained methods (graph-based propagation, motion segmentation, saliency); from 2017
  the challenge entrants and the baselines were trained networks.
designed_for_subjects_basis:
  reason: The entrants are segmentation networks trained on DAVIS train and other datasets
    (YouTube-VOS and COCO are allowed) and scored as trained, OSVOS being the 2017 baseline. DAVIS
    2016 was built when most evaluated methods had no learned component.
  source: src-cvf-davis-cvpr2016-pdf
  quote: since most of the evaluated approaches are not trained
as_used:
  - protocol: Results reported on DAVIS 2017 val, whose annotations are public, scored locally with
      the official code, beside or instead of the test-dev server.
    split: val
    source: src-arxiv-2608-11835
    quote: Our proposed approach sets a new state-of-the-art on the DAVIS 2017 val dataset, and
      improves over the baseline on the DAVIS 2017 test-dev benchmark
    note: The paper was posted in August 2026 as the accepted manuscript of a 2021 GCPR paper, so it
      shows the reporting convention rather than 2026 activity. EdgeTAM's and TinySAM 2's abstracts
      (src-arxiv-2501-07256, src-arxiv-2605-18013) name DAVIS 2017 or DAVIS without the split.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on DAVIS 2017. EdgeTAM (January 2025) reports J&F on it beside
    MOSE and SA-V, and TinySAM 2 (May 2026) evaluates on DAVIS. The end of the challenge series is
    recorded in activity (ADR-0019).
  source: src-arxiv-2501-07256
  quote: EdgeTAM achieves 87.7, 70.0, 72.3, and 71.7 J&F on DAVIS 2017, MOSE, SA-V val, and SA-V
    test
activity: leaderboard-live-no-round
activity_note: The CodaLab pages give December 31, 2026 as the end of both competitions
  (planned_end); the interactive track's server (interactive.davischallenge.org) was not checked.
  The site's own leaderboards are no longer updated; the home page says their results were put into
  paperswithcode, which was not read.
activity_basis:
  reason: No challenge has run since 2020 and the maintainers say none will, but the test-dev phases
    of the semi-supervised and unsupervised CodaLab competitions were open on 2026-11-10, and the
    home page says the evaluation servers keep running.
  source: src-codalab-lisn-davis-semisupervised
  quote: Current Test-dev April 15, 2019, midnight UTC End Competition Ends Dec. 31, 2026, 11:59
    p.m. UTC
planned_end: '2026-12-31'    # the CodaLab competitions' end date (both pages); not announced as a closure
events:
  - name: 2017 DAVIS Challenge workshop, CVPR 2017, Honolulu, with entries from 22 teams
    kind: workshop-challenge-on-the-benchmark
    source: src-arxiv-1704-00675-v3
    quote: The challenge received entries from 22 different teams and brought an improvement of 20%
      to the state of the art.
  - name: 2018 DAVIS Challenge workshop, CVPR 2018, Salt Lake City, with 23 participants
    kind: workshop-challenge-on-the-benchmark
    source: src-davischallenge-challenge2018
    quote: The DAVIS Challenge 2018 finished with 23 participants.
  - name: 2019 DAVIS Challenge workshop, CVPR 2019, Long Beach, with 28 teams in three tracks
    kind: workshop-challenge-on-the-benchmark
    source: src-davischallenge-challenge2019
    quote: The DAVIS Challenge 2019 finished with 28 teams.
  - name: 2020 DAVIS Challenge workshop, CVPR 2020, held virtually
    kind: workshop-challenge-on-the-benchmark
    source: src-davischallenge-challenge2020
    quote: This year CVPR will be held virtually, therefore the workshop will also be virtual.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: OSVOS, the 2017 challenge's baseline, extended to multiple objects
    source: src-arxiv-1704-00675-v3
    observed_on: 2026-11-10
    quote: As a baseline, we add the naive generalization of OSVOS to multiple objects
  - system: EdgeTAM, an on-device version of SAM 2
    source: src-arxiv-2501-07256
    observed_on: 2026-11-10
    quote: EdgeTAM achieves 87.7, 70.0, 72.3, and 71.7 J&F on DAVIS 2017, MOSE, SA-V val, and SA-V
      test
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Pixel masks of every annotated object in every frame, drawn manually; for
  DAVIS 2017 test-dev and test-challenge (and the unsupervised track's 2019 test sets) only the
  maintainers hold them. DAVIS 2016's 50 sequences and the 2017 train and val splits are fully
  annotated and public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can run a method on the released test-dev frames and submit to the open CodaLab
    phase, and train and val can be scored locally with the published evaluation code.
  source: src-arxiv-1704-00675-v3
  quote: After the challenge, test-dev submissions remain open as we expect future methods to
    publish their results on this set.

task:
  exists: true
  input:
    - a video sequence of about 70 frames, as 480p JPEG frames for the official metrics (Full HD in
      2016, mostly 4K for the new 2017 sequences, also released)
    - semi-supervised track, the masks of the objects of interest in the first frame
    - interactive track, scribbles from the maintainers' server, first human-drawn and then
      simulated on the worst frame, over up to eight rounds
    - unsupervised track, nothing beyond the frames
  output: An indexed PNG mask per frame, each pixel holding the identity of its object (in the
    unsupervised track, a pool of non-overlapping object proposals with consistent identities).
  scoring: J, F and their mean J&F over all objects (each object's per-frame mean, averaged over
    objects, not over sequences), at 480p (the 2016 paper leaves out the first frame, which is
    given, and the last); the unsupervised track matches proposals to annotated objects by bipartite
    matching first, and the interactive track scores J&F against the time used.
  source: src-arxiv-1704-00675-v3
  quote: the overall metric will not be the mean of the per-sequence values but per object

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: DAVIS 2016 has no withheld split; its train and val sequences and annotations, and
    the pre-computed results of the methods in the 2016 paper, are downloadable from the site, which
    links the archives hosted at ETH Zurich. The 2017 test-dev and test-challenge archives hold
    images and first-frame annotations only.
  access_basis:
    reason: For the headline DAVIS 2017 test sets only the first frame's masks are public, and their
      scores come from the maintainers' server.
    source: src-arxiv-1704-00675-v3
    quote: two other test sets (test-dev and test-challenge), for which only the masks on the
  refresh: versioned-releases
  refresh_basis:
    reason: The content changed in named releases (DAVIS 2016, DAVIS 2017 Semi-supervised, the 2018
      scribbles, and the 2019 DAVIS 2017 Unsupervised annotations with their new test sets), and
      each challenge names the sets it used.
    source: src-arxiv-1905-00737-v1
    quote: We denote the new annotations as DAVIS 2017 Unsupervised in contrast of the annotations
      released in the original DAVIS 2017 [2] that we denote as DAVIS 2017 Semi-supervised.
  data_provenance:
    - real-world-instrument
    - expert-authored
    - crowd-authored
  data_provenance_note: The sequences are camera footage (real-world-instrument), and the masks were
    drawn by professional annotators (expert-authored, read from "professionally annotated"). The
    interactive track's first scribbles come from a small crowd-sourcing experiment
    (crowd-authored). The 2019 unsupervised re-annotation was done by an annotation company named in
    the paper's acknowledgements. Where the 2017 sequences were sourced is not stated in the papers
    read.
  data_provenance_source: src-cvf-davis-cvpr2016-pdf
  data_provenance_quote: densely and professionally annotated high-resolution Full HD video
    sequences
  contamination_risk: medium
  contamination_risk_note: The test-dev and test-challenge annotations are withheld, the
    test-challenge phase was capped at five submissions, and entrants may not train on DAVIS test
    data. But the test frames are public, DAVIS 2016 and the 2017 val split are fully annotated and
    have been reported on for a decade, and large video segmentation models are trained on web-scale
    data that could include the sequences. No source assesses it.
  contamination_risk_source: src-davischallenge-challenge2020-semisupervised
  contamination_risk_quote: Feel free to train or pre-train your algorithms on any other dataset
    apart from DAVIS (Youtube-VOS, MS COCO, Pascal, etc.)
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: J and F are each bounded by 1 (100%) at a perfect mask, and so is J&F.
    No source reports a human or inter-annotator ceiling. The 2017 paper says DAVIS 2016 was close
    to saturation at about 80% (saturation is not tagged in lifecycle; see review_checks).
  ceiling_anchor_type_source: src-cvf-davis-cvpr2016-pdf
  ceiling_anchor_type_quote: intersection- over-union of the estimated segmentation and the ground-
    truth mask
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The 2020 track pages say the challenge's new annotations are the organisers'
    and under CC BY 4.0. No source read states the licence of the video frames or of the DAVIS 2016
    annotations.
  dataset_licence_source: src-davischallenge-challenge2020-semisupervised
  dataset_licence_quote: The new annotations in this dataset belong to the organizers of the
    challenge and are licensed under a Creative Commons Attribution 4.0 License.
  size:
    - count: 150
      unit: video sequences with 10,459 annotated frames and 376 objects
      subset: DAVIS 2017 (Semi-supervised), all four splits
      source: src-arxiv-1704-00675-v3
      quote: Overall, the new dataset consists of 150 sequences, totaling 10459 annotated frames and
        376 objects.
    - count: 30
      unit: video sequences per test split (test-dev and test-challenge), beside 60 for training and
        30 for validation
      subset: DAVIS 2017 (Semi-supervised)
      source: src-arxiv-1803-00557-v2
      quote: training (60 sequences), validation (30 sequences), test-dev (30 sequences), and
        test-challenge (30 sequences)
    - count: 50
      unit: video sequences with 3,455 annotated frames, one object each (30 train, 20 val)
      subset: DAVIS 2016
      source: src-cvf-davis-cvpr2016-pdf
      quote: DAVIS comprises a total of 50 sequences, 3455 annotated frames, all captured at 24fps
        and Full HD 1080p spatial resolution.
    - count: 150
      unit: video sequences with 10,731 annotated frames and 449 objects, of which 60 are new test
        sequences
      subset: DAVIS 2017 Unsupervised
      source: src-arxiv-1905-00737-v1
      quote: Total 150 10731 71.54 449 2.99
  size_note: The 2018 and 2019 papers give DAVIS 2017 as 10,474 frames and 384 objects, against the
    2017 paper's 10,459 and 376 (see review_checks).
  submission_limit:
    max_submissions: 5
    period_days: 0
    per: participant, in an edition's test-challenge phase (about two weeks); test-dev submissions
      are unlimited
    source: src-arxiv-1803-00557-v2

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The DAVIS team at ETH Zurich's Computer Vision Laboratory, with co-authors at Disney
    Research (2016-2018), Google and Adobe Research (2019-2020)
  maintainer_basis:
    reason: The challenge papers place most of their authors in ETH Zurich's Computer Vision
      Laboratory, and the download pages link archives on data.vision.ee.ethz.ch; the 2016 and 2017
      papers add Disney Research Zurich, and the 2019 paper Google AI and Adobe Research, as
      authors' later affiliations.
    source: src-arxiv-1803-00557-v2
    quote: are with the Computer Vision Laboratory, ETH Zu
  maintainer_type: academic-lab
  maintainer_type_note: conference-workshop was considered, since the challenges ran as CVPR
    workshops, but the organisers were the same group from 2017 to 2020 and also hold the dataset,
    the evaluation code and the servers.
  submission_process:
    - held-out-server
  submission_process_note: Entrants upload indexed-PNG masks to the CodaLab competition of the
    track; test-dev takes unlimited submissions, and each edition's test-challenge phase took five
    per participant over about two weeks. In the interactive track the entrant's code connects to
    the maintainers' web service, which sends scribbles, times the answers and logs the scores, with
    no upload. Each entry had to name a team and its affiliation, and accepted teams submitted a
    short paper to the workshop.
  submission_process_source: src-arxiv-1704-00675-v3
  submission_process_quote: We set up an evaluation server in Codalab where researchers are able to
    submit their results
  independence_flags: []
  independence_flags_note: Not assessed. The maintainers hold the test-dev and test-challenge
    annotations and their servers score every entry ("which allows the DAVIS organizers to keep the
    test annotations private", src-arxiv-1803-00557-v2), so single-evaluator-private-test-set would
    apply. The workshops were sponsored by companies (Google, Adobe and Disney Research among them),
    some organisers worked for those companies, and the 2020 prizes were Adobe CC subscriptions, but
    no source read says who funded the prizes or whether organisers' groups entered the challenges.
  independence_assessed: false
  funding:
    source: src-cvf-davis-cvpr2016-pdf
    quote: This work was partially funded by an SNF award (200021 143598).
  funding_note: The SNF award is the 2016 paper's. The 2018 and 2019 papers say they were partially
    funded by the workshop sponsors, Google and Disney Research among them (src-arxiv-1803-00557-v2,
    src-arxiv-1905-00737-v1).
  known_limitation:
    source: src-arxiv-1905-00737-v1
    quote: We found out that the annotations in DAVIS 2017 are biased towards the semi-supervised
      scenario, with several semantic inconsistencies.
  known_limitation_note: The reason the unsupervised track has its own annotations. The sequences
    are short (about 70 frames), and the 2017 paper says DAVIS 2016 was near saturation.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline scores, on test-dev and test-challenge, come only from the maintainers'
      servers, which hold the annotations. Scores on DAVIS 2016 and on the 2017 train and val splits
      can be reproduced by anyone with the official code.
    source: src-arxiv-1803-00557-v2
    quote: which allows the DAVIS organizers to keep the test annotations private
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: davis2017-evaluation (evaluation_method.py for local runs, evaluation_codalab.py as run
    on the CodaLab servers) for the semi-supervised and unsupervised tracks; the DAVIS 2016 Python
    and Matlab code; the davis-interactive Python package for the interactive track
  harness_source: src-github-davis2017-evaluation-readme
  harness_quote: This tool is also used to evaluate the submissions in the Codalab site for the
    Semi-supervised DAVIS Challenge and the Unsupervised DAVIS Challenge
  submission_channel:
    source: src-codalab-lisn-davis-semisupervised
    quote: The Semi-Supervised DAVIS Challenge on Video Object Segmentation @ CVPR 2020
  submission_channel_note: The semi-supervised (codalab.lisn.upsaclay.fr/competitions/6812) and
    unsupervised (competitions/6811) CodaLab competitions, whose test-dev phases run to the end of
    2026; the interactive track's web service is reached through its Python package.
  code_licence: BSD-3-Clause
  code_licence_note: GitHub's licence metadata for davisvideochallenge/davis2017-evaluation reports
    BSD-3-Clause (API, read 2026-11-10); the README states no licence. The DAVIS 2016 and
    interactive repositories' licences were not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which release and split a number is on (DAVIS 2016 val, DAVIS 2017 val,
  # test-dev or test-challenge, or DAVIS 2017 Unsupervised), what the method was trained on (YouTube-VOS, COCO
  # and other datasets are allowed; DAVIS test data is not), and for the interactive track the simulated user
  # (the server's scribble robot and its timing). Resolution matters too: the official metrics are at 480p.
  material_extra:
    - subset_used
    - training_data_policy
    - user_simulator
aggregation_policy: official-aggregate
aggregation_policy_note: Within a track and split, J&F (the mean of J and F over all objects) is the
  ranking; the interactive track ranks by the area under its time-J&F curve. No score spans the
  tracks or the 2016 and 2017 releases.
aggregation_policy_basis:
  reason: The 2017 paper defines J&F as the measure that ranks the challenge, and the 2020 track
    page keeps it.
  source: src-davischallenge-challenge2020-semisupervised
  quote: The overall ranking measures are computed as the mean between J and F, both averaged over
    all objects.
secondary_axes:
  - latency
secondary_axes_basis:
  reason: The interactive track measures how long the method takes to answer each round of
    scribbles, and ranks by J&F against that time (a 30-second budget per object per round).
  source: src-davischallenge-challenge2020-interactive
  quote: We compute the Area Under the Curve (AUC) of the plot Time vs J&F.

homepage: https://davischallenge.org/
repository: https://github.com/davisvideochallenge/davis2017-evaluation
dataset_url: https://davischallenge.org/davis2017/code.html
leaderboard_url: https://codalab.lisn.upsaclay.fr/competitions/6812


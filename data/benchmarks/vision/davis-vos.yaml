  sources_note: >
    The three challenge papers' PDFs (arXiv DOIs, not archived) read as text, with their abstract pages
    for dates; the DAVIS 2016 paper as the CVF open-access PDF, with Crossref's record of the IEEE version
    (a DOI source) for the DOI and dates. davischallenge.org (GitHub Pages, no robots.txt) was read on
    its home page, the two download pages, three challenge pages and two 2020 track pages; the 2017 challenge
    page and the 2020 unsupervised page were read but not cited. The two CodaLab pages were read without
    signing in, and their leaderboard rows were left out. The davis2017-evaluation README is pinned to
    commit ac7c43f (2023-02-26). Three arXiv abstract pages are evidence of current use. The paperswithcode
    task pages and the interactive server were not read.
  confidence: medium
  review_checks:
    - check: The id is davis-vos rather than davis. The allocation rules give a shared or generic
        name a disambiguator, and DAVIS also names an unrelated, widely used drug-target binding
        dataset (kinase-inhibitor affinities) besides being a common word; no entry or stub in the
        repository uses either reading yet. If the reviewer reads the rule as covering only
        benchmarks already in the repository, the bare id davis is the other reading; the suffix is
        the task (video object segmentation), since the rule's maintainer-or-game disambiguators do
        not fit.
      field: id
    - check: Identity. DAVIS 2017 is filed as an edition of DAVIS 2016 (same group and name, the
        2016 sequences re-annotated inside it, a new year), although the task changed from one
        object to several, the ranking changed to J&F and both releases are still reported side by
        side. A reviewer could make DAVIS 2017 a separate benchmark linked by lineage.
      field: versions
      source: src-arxiv-1704-00675-v3
      quote: We will refer to this version of the dataset as DAVIS 2016.
    - check: The 2018, 2019 and 2020 challenges are track sets, not editions, because the
        semi-supervised data and splits did not change. The 2019 round did release new data, the
        DAVIS 2017 Unsupervised annotations and 60 new test sequences, for its new track; edition
        (breaking) could be argued for 2019.
      field: versions
      source: src-arxiv-1803-00557-v2
      quote: The dataset and its partitions will also be kept as in the 2017 edition.
    - check: domain.primary is vision/segmentation, chosen because J and F score per-frame masks;
        vision/video-understanding is secondary. The leaf definition says "every pixel or region of
        an image", and MOTChallenge files its MOTS track the other way round (video-understanding
        primary, segmentation secondary); a reviewer may want the two entries aligned.
      field: domain
      source: src-cvf-davis-cvpr2016-pdf
      quote: To measure the region-based segmentation similarity, i.e. the number of mislabeled
        pixels, we employ the Jaccard index J
    - check: activity leaderboard-live-no-round and planned_end rest on the two CodaLab pages, whose
        test-dev phases end on 2026-12-31, seven weeks after this draft. Whether that is a planned
        closure or CodaLab's default date is not stated; after it the entry may need activity closed
        and a channel-closed history row. The interactive server was not checked.
      field: activity
      source: src-codalab-lisn-davis-unsupervised
      quote: Current Test-dev April 15, 2019, midnight UTC End Competition Ends Dec. 31, 2026, 11:59
        p.m. UTC
    - check: dataset_licence CC-BY-4.0 rests on the 2020 track pages' sentence on the challenge's
        "new annotations". No source read gives the licence of the video frames or of the DAVIS 2016
        annotations, so the field may overstate what is licensed.

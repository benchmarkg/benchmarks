  - version: '2017'
    label: DAVIS 2017 and the 2017 DAVIS Challenge (CVPR 2017)
    version_kind: edition
    released: 2017-04-03
    changes: The 2016 sequences re-annotated with every visible object, plus 100 new sequences with
      more objects, distractors and occlusions, for 150 in four splits; test-dev and test-challenge
      release only the first frame's masks. Multi-object semi-supervised segmentation is the task,
      J&F per object is the ranking and T is dropped. Scored on a CodaLab server; 22 teams entered
      the CVPR 2017 challenge.
    breaking: true
    supersedes_version: '2016'
    superseded_by: '2018'
    frozen: true

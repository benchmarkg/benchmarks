# data/benchmarks/vision/imagenet.yaml
#
# P1-S8-T05, vision entry 8 of 8. Filled from the ILSVRC paper, arXiv 1409.0575 read as its v3 PDF (2015-01-30;
# IJCV 2015), and its abstract page; seven pages of image-net.org (download and terms of access, about, the
# challenges index, the ILSVRC 2010, 2012 and 2017 pages, the March 2021 update), read with scripts and styles
# stripped, and its June 2015 announcement about the test server; Hugging Face's API record for the
# ILSVRC/imagenet-1k dataset (the gated card itself was not opened); the abstract pages of ImageNetV2 (arXiv
# 1902.10811) and of "Are we done with ImageNet?" (arXiv 2006.07159), for the label and overfitting evidence;
# and the v1 PDF of ViT-5 (arXiv 2602.08071, February 2026), a paper reporting results on the benchmark. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the ILSVRC image classification benchmark, whose 2012 data (reused through 2017) is what papers
# call ImageNet-1k. ImageNet the 21,841-synset database is its parent dataset, not a benchmark here.
# Single-object localisation on the same images and classes is a subset; the challenge's object detection
# (200 classes) and video detection tasks used other data and are not covered. ImageNetV2 and the ReaL labels
# are separate benchmarks, listed under lineage only.

id: imagenet
name: ImageNet
aliases:
  - ILSVRC
  - ImageNet-1k
  - ImageNet Large Scale Visual Recognition Challenge
  - ILSVRC2012
tagline: ILSVRC's 1,000-class image classification benchmark (ImageNet-1k), scored by top-1 and
  top-5 accuracy.
description: >
  The ImageNet Large Scale Visual Recognition Challenge (ILSVRC) classification benchmark, run by the
  ImageNet team (Stanford, Princeton and collaborators) as a yearly challenge from 2010 to 2017. Its 2012
  data,
  kept unchanged through 2017 and now called ImageNet-1k, is a 1,000-class subset of ImageNet:
  1,281,167 training, 50,000 validation and 100,000 test photographs collected from Flickr and other
  search engines and labelled with the help of Amazon Mechanical Turk workers, one label per image. A
  system returns up to five class labels per image in descending order of confidence. From 2012 the
  challenge ranked by top-5 error, the share of images whose label is not among the five; top-1 error
  uses the first label alone. The test labels are withheld and scored by the maintainers' server at
  most twice a week, while the validation labels are released, and papers now report top-1 accuracy
  computed on their own (as_used). One trained annotator's top-5 error on 1,500 test images was
  estimated at 5.1%. The same images carry a single-object localisation task (a subset here).
self_description:
  source: src-arxiv-1409-0575
  quote: The ImageNet Large Scale Visual Recognition Challenge is a benchmark in object category
    classification and detection on hundreds of object categories and millions of images.
external_ids:
  arxiv: '1409.0575'
paper:
  title: ImageNet Large Scale Visual Recognition Challenge
  arxiv: '1409.0575'
  doi: 10.1007/s11263-015-0816-y
  version_read: v3
  source: src-arxiv-1409-0575-v3
released: 2010-05-03
released_note: The first edition's release of training and validation data with its development kit,
  as the ILSVRC 2010 page dates it. The ILSVRC2012 data, the set now called ImageNet-1k, was
  released on 2012-06-16 (versions).
released_source: src-imagenet-ilsvrc2010
released_quote: 'May 3, 2010: Training data, validation data and development kit are available for download!'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/classification
domain_basis:
  reason: The headline task assigns each whole photograph to classes from a fixed set of 1,000,
    scored against its one ground-truth label.
  source: src-imagenet-ilsvrc2012
  quote: 'Task 1: Classification For each image, algorithms will produce a list of at most 5 object categories
    in the descending order of confidence.'
domain_considered_and_rejected:
  - term: vision/detection
    reason: The challenge's object detection task (200 fully labelled classes, from 2013) and video
      detection task used their own data and are not covered here. Single-object localisation on the
      same images is a subset, with detection as its own primary domain.
    source: src-imagenet-ilsvrc2017
    quote: Object localization for 1000 categories. Object detection for 200 fully labeled
      categories. Object detection from video for 30 fully labeled categories.
capability:
  - perception
capability_basis:
  perception:
    reason: The input is a photograph and the score is whether the object class recovered from it
      matches the label.
    source: src-imagenet-ilsvrc2012
    quote: The general goal is to identify the main objects present in images.
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The validation and test images were collected and labelled like the training images.
      Test sets built to shift that distribution, such as ImageNetV2, are benchmarks of their own
      (lineage).
    source: src-arxiv-1902-10811
    quote: We build new test sets for the CIFAR-10 and ImageNet datasets.
  - term: transfer-learning
    reason: ImageNet-trained backbones are carried to other tasks, but that transfer is scored on
      other benchmarks, not here.

evaluation_method:
  - exact-match
evaluation_method_basis:
  reason: Each image has one ground-truth label, and a prediction is right or wrong. Top-1 asks
    whether the first label equals it and top-5 whether any of five does, and the score is the mean
    over images. Since 2012 there is no partial credit; the hierarchical cost of 2010 and 2011 was
    dropped.
  source: src-arxiv-1409-0575-v3
  quote: Thus, since ILSVRC2012 we have been exclusively using the top-5 metric which is the
    simplest and most suitable to the dataset
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: Top-1 and top-5 accuracy are means of per-image verdicts, which the term's exclusion
      test sends to exact-match; no statistic of the whole confusion matrix is reported.
  - term: domain-metric
    reason: The localisation subset's verdict also needs a box overlapping the ground truth by more
      than 50%, an IoU threshold, but the headline classification score uses none.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Entrants are classifiers trained on the benchmark's own training split and run on the test
    images as trained, from pipelines of hand-designed features and linear classifiers to the
    convolutional networks that won from 2012.
  source: src-arxiv-1409-0575-v3
  quote: Participants train their algorithms using the training images and then automatically
    annotate the test images.
as_used:
  - protocol: Top-1 accuracy, the first label only, where the challenge ranked by top-5 error.
      Models are trained on the 2012 training split, here from scratch, and compared at stated input
      resolutions (224 or 384 pixels).
    source: src-arxiv-2602-08071-v1
    quote: On standard ImageNet-1k classification, a base-sized ViT-5 achieves 84.2% top-1 accuracy
    note: ViT-5 (February 2026) calls its ImageNet-1k figures test accuracy without naming the
      split. Under the challenge's design a test-set figure comes only from the maintainers' server.
  - protocol: Accuracy computed by the authors on the 50,000-image validation set, whose labels are
      public, in place of the test set behind the maintainers' server.
    split: val
    source: src-arxiv-2006-07159
    quote: We therefore develop a significantly more robust procedure for collecting human
      annotations of the ImageNet validation set.
    note: Beyer et al. relabel the validation set to re-score published ImageNet classifiers, which
      places those classifiers' reported numbers on it. No source read states outright which split
      current papers use.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced; a February 2026 paper reports ImageNet-1k top-1 accuracy
    for its backbones and calls it the most widely used benchmark for them. The yearly challenge
    ended with ILSVRC 2017, which goes to activity (ADR-0019).
  source: src-arxiv-2602-08071-v1
  quote: As ImageNet-1k remains the most widely used benchmark for evaluating vision backbones
activity: unknown
activity_note: The image-net.org challenge pages stop at ILSVRC 2017, and its page hands the
  challenges to Kaggle. The Kaggle competition page is rendered by script and its API needs an
  account, so whether it takes late entries could not be read. The site's evaluation server for the
  2012-2017 test set (two submissions a week) sits behind a login, and no account was created.
activity_basis:
  reason: Every route that would show the current state, the Kaggle competition and the test-set
    server, could not be read without an account.
  source: src-imagenet-ilsvrc2017
  quote: 'Jul 26, 2017: We are passing the baton to Kaggle. From now on, all three challenges(LOC-CLS,
    DET, VID) will be hosted on Kaggle!'

events:
  - name: ILSVRC 2013 to ILSVRC 2017
    kind: Yearly challenges whose classification and localisation tasks reused the ILSVRC2012 data
    source: src-imagenet-download
    quote: The most highly-used subset of ImageNet is the ImageNet Large Scale Visual Recognition
      Challenge (ILSVRC) 2012-2017 image classification and localization dataset.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SuperVision (winner of ILSVRC2012)
    source: src-arxiv-1409-0575-v3
    observed_on: 2026-10-14
    quote: They trained a large, deep convolutional neural network on RGB values, with 60 million
      parameters
  - system: ViT-5-Base
    source: src-arxiv-2602-08071-v1
    observed_on: 2026-10-14
    quote: On standard ImageNet-1k classification, a base-sized ViT-5 achieves 84.2% top-1 accuracy
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: One label per image, from candidate images verified by Amazon Mechanical
  Turk workers. The test labels stay with the maintainers (2010's were later released); the
  validation labels are public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone who registers and accepts the terms of access can download the 2012 data and score
    a classifier on the validation set; test-set scores need the maintainers' server.
  source: src-imagenet-download
  quote: This dataset spans 1000 object classes and contains 1,281,167 training images, 50,000
    validation images and 100,000 test images.

task:
  exists: true
  input:
    - one photograph collected from Flickr or another search engine
  output: Up to five of the 1,000 class labels in descending order of confidence (and, in the
    localisation subset, a bounding box for each).
  scoring: Top-5 error, the share of images whose ground-truth label is not among the five, ranked
    the challenge from 2012; top-1 error uses the first label only, and accuracy is one minus the
    error. One ground-truth label per image.
  source: src-imagenet-ilsvrc2012
  quote: 'Task 1: Classification For each image, algorithms will produce a list of at most 5 object categories
    in the descending order of confidence.'

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The released data sits behind gates, which train-open-test-held-out's test records in
    a note. image-net.org asks for a login and agreement to its terms of access, and the Hugging
    Face copy for automatically approved click-through terms ("gated":"auto" in its API record). The
    2012 data is also on Kaggle, whose page could not be read. The validation labels come with the
    training data. No account was created for this entry.
  access_basis:
    reason: Training and validation images and labels and the test images are released; the test
      labels are withheld (apart from 2010's) and scored only by the maintainers.
    source: src-arxiv-1409-0575-v3
    quote: A set of test images is also released, with the manual annotations withheld.
  refresh: versioned-releases
  refresh_basis:
    reason: Each change came as a dated release. The class set and data changed in 2010, 2011 and
      2012, the 2012 data stayed through 2017, and the 2012 test set was updated on a dated
      announcement in October 2019.
    source: src-imagenet-lsvrc
    quote: 'October 10, 2019: The ILSVRC 2012 classification and localization test set has been updated.'
  data_provenance:
    - web-scraped
    - crowd-authored
  data_provenance_note: Photographs were gathered from Flickr and image search engines; the labels
    were verified by Amazon Mechanical Turk workers ("ILSVRC makes extensive use of Amazon
    Mechanical Turk to obtain accurate annotations", src-arxiv-1409-0575-v3).
  data_provenance_source: src-imagenet-ilsvrc2012
  data_provenance_quote: The validation and test data for this competition will consist of 150,000
    photographs, collected from flickr and other search engines, hand labeled with the presence or
    absence of 1000 object categories.
  contamination_risk: medium
  contamination_risk_note: The maintainers removed duplicates of the validation and test images from
    the training data, and the test labels are private. But the validation labels are public and are
    what results are now computed on (as_used), and the images come from the web, so web-scale
    pretraining could include them; nobody in the sources read has assessed that. ImageNetV2's new
    test sets found accuracy drops of 11-14% that its authors attribute to harder images, not to
    adaptive overfitting ("Our results suggest that the accuracy drops are not caused by
    adaptivity", src-arxiv-1902-10811).
  contamination_risk_source: src-imagenet-ilsvrc2012
  contamination_risk_quote: The validation and test data for this competition are not contained in
    the ImageNet training data (we will remove any duplicates).
  contamination_evidence: []
  ceiling_anchor_type: expert-best
  ceiling_anchor_type_note: The better of two trained annotators, A1, scored on 1,500 test images by
    top-5 error, the challenge's measure. No human anchor exists for top-1 accuracy, the metric now
    reported.
  ceiling_anchor_type_basis:
    reason: The paper measured human top-5 error with annotators trained on the 1,000 classes; the
      better of the two reached an estimated 5.1%.
    source: src-arxiv-1409-0575-v3
    quote: The human error was estimated to be 5.1%. Thus, annotator A1 achieves a performance
      superior to GoogLeNet
  dataset_licence: 'ImageNet terms of access: non-commercial research and educational use only'
  dataset_licence_source: src-imagenet-download
  dataset_licence_quote: Researcher shall use the Database only for non-commercial research and
    educational purposes.
  upstream_licences: The photographs stay with their owners; ImageNet does not hold their copyright.
  upstream_licences_source: src-imagenet-about
  upstream_licences_quote: No, ImageNet does not own the copyright of the images.
  size:
    - count: 100000
      unit: test images (labels withheld)
      subset: ILSVRC 2012-2017 classification and localisation
      source: src-imagenet-download
      quote: This dataset spans 1000 object classes and contains 1,281,167 training images, 50,000
        validation images and 100,000 test images.
    - count: 50000
      unit: validation images (50 per class), labels released
      subset: ILSVRC 2012-2017 classification and localisation
      source: src-imagenet-download
      quote: This dataset spans 1000 object classes and contains 1,281,167 training images, 50,000
        validation images and 100,000 test images.
    - count: 1281167
      unit: training images
      subset: ILSVRC 2012-2017 classification and localisation
      source: src-imagenet-download
      quote: This dataset spans 1000 object classes and contains 1,281,167 training images, 50,000
        validation images and 100,000 test images.
    - count: 150000
      unit: test images
      subset: ILSVRC2010
      source: src-arxiv-1409-0575-v3
      quote: Test images (per class) 150,000 (150) 100,000 (100) 100,000 (100)
  submission_limit:
    max_submissions: 2
    period_days: 7
    per: team, on the test-set evaluation server
    source: src-arxiv-1409-0575-v3

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ImageNet team (Stanford Vision Lab, Stanford University and Princeton University)
  maintainer_basis:
    reason: The site, the dataset and its terms of access are Stanford's and Princeton's, and the
      senior research team is at the two universities. The challenge's organiser lists changed by
      edition around a core of the same researchers.
    source: src-imagenet-about
    quote: Prof. Li Fei-Fei, PI, Stanford University Prof. Jia Deng, Princeton University Prof. Olga
      Russakovsky, Princeton University
  maintainer_type: academic-lab
  maintainer_type_note: conference-workshop was considered. Results were presented at workshops of
    ECCV, ICCV and CVPR and the organiser lists differ by year, but one standing group at Stanford
    and Princeton hosted every edition and holds the data, which the term's exclusion sends to that
    group's type.
  submission_process:
    - held-out-server
  submission_process_note: Teams uploaded predicted labels for the test images, which the organisers
    scored against labels they kept; after each challenge a server scored the test set all year, at
    most two submissions a week per team. In 2015 the organisers found a Baidu team had used at
    least 30 accounts to submit over 200 times and asked it to stay away for 12 months ("We
    therefore requested that they refrain from submitting to the evaluation server or the challenge
    for the next 12 months", src-imagenet-announcement-2015-06).
  submission_process_source: src-arxiv-1409-0575-v3
  submission_process_quote: These predicted annotations are submitted to the evaluation server.
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-arxiv-1409-0575-v3
      quote: We thank Stanford University, UNC Chapel Hill, Google and Facebook for sponsoring the
        challenges
  independence_flags_note: Google sponsored the challenges and entered them; its GoogLeNet team won
    ILSVRC2014's classification task (the paper's team table lists the team as Google). NVIDIA gave
    compute to ILSVRC2014 participants. No organiser-run entry was found. The maintainers hold the
    test labels and score every test result, as COCO's do, and that is not flagged.
  independence_assessed: true
  funding:
    source: src-arxiv-1409-0575-v3
    quote: We thank Stanford University, UNC Chapel Hill, Google and Facebook for sponsoring the
      challenges
  known_limitation:
    source: src-arxiv-2006-07159
    quote: Using these new labels, we reassess the accuracy of recently proposed ImageNet
      classifiers, and find their gains to be substantially smaller than those reported on the
      original labels.
  known_limitation_note: One label per image, though many images show several objects; the paper
    itself found about 0.3% of 1,500 test images mislabelled ("We found that approximately 5 out of
    1500 images (0.3%) were incorrectly annotated in the ground truth", src-arxiv-1409-0575-v3).

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The design's headline is test-set error, which only the maintainers can compute because
      they hold the test labels. The validation-set figures papers report now can be computed by
      anyone with the data (as_used).
    source: src-arxiv-1409-0575-v3
    quote: In 2010, the test annotations were later released publicly; since then the test
      annotation have been kept hidden.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: The ILSVRC development kit's evaluation software
  harness_note: The development kit itself was not downloaded or read; its scoring code is known
    here only from the 2012 timetable.
  harness_source: src-imagenet-ilsvrc2012
  harness_quote: 'June 15 2012: Development kit (training and validation data plus evaluation software)
    to be made available.'
  submission_channel:
    source: src-imagenet-lsvrc
    quote: The evaluation server can be used to evaluate image classification results on the test
      set of ILSVRC 2012-2017.
  submission_channel_note: The server's page (challenges/LSVRC/eval_server.php) shows only a login
    form, so whether it still scores could not be checked.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which split and labels a number was scored on (the test set through the
  # server, the validation set locally, or relabelled validation sets), and what the model saw in training
  # (only the 2012 training split, or outside data: ILSVRC2017 ran a provided-data and an external-data track).
  # The metric itself (top-1 or top-5) and the input resolution also change a number and have no condition
  # field.
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://www.image-net.org/
dataset_url: https://www.image-net.org/download.php

versions:
  - version: ilsvrc2010
    label: ILSVRC2010
    version_kind: edition
    released: 2010-05-03
    items: 150000
    changes: The first edition, classification only, with 1,261,406 training and 150,000 test
      images, scored by flat and hierarchical error. Its test labels were later released.
    breaking: true
    superseded_by: ilsvrc2011
    frozen: true
    sources:
      - src-imagenet-ilsvrc2010
      - src-arxiv-1409-0575-v3
  - version: ilsvrc2011
    label: ILSVRC2011
    version_kind: edition
    items: 100000
    changes: A new set of 1,000 classes and new data, 1,229,413 training and 100,000 test images,
      with single-object localisation added on the same classes.
    breaking: true
    supersedes_version: ilsvrc2010
    superseded_by: ilsvrc2012
    frozen: true
    sources:
      - src-arxiv-1409-0575-v3
  - version: ilsvrc2012
    label: ILSVRC2012 (ImageNet-1k)
    version_kind: edition
    released: 2012-06-16
    items: 100000
    changes: A new class set with 1,281,167 training, 50,000 validation and 100,000 test images,
      scored by top-5 error alone. The 2013-2017 challenges reused it for classification and
      localisation.
    breaking: true
    supersedes_version: ilsvrc2011
    superseded_by: ilsvrc2012-test-2019
    frozen: true
    sources:
      - src-imagenet-ilsvrc2012
      - src-imagenet-download
      - src-hf-api-imagenet-1k
  - version: ilsvrc2012-test-2019
    label: ILSVRC2012 with the October 2019 test set
    version_kind: revision
    released: 2019-10-10
    changes: The 2012 classification and localisation test set was replaced on the download page and
      on Kaggle. The sources read do not say what changed, and the training and validation sets are
      not said to have changed.
    supersedes_version: ilsvrc2012
    frozen: true
    sources:
      - src-imagenet-lsvrc

subsets:
  - id: imagenet#localization
    label: Classification with localisation (single-object localisation)
    items: 100000
    scored_separately: true
    domain_override:
      primary: vision/detection
      secondary:
        - vision/classification
    evidence:
      - source: src-imagenet-ilsvrc2012
        quote: 'Task 2: Classification with localization In this task, an algorithm will produce 5 class
          labels'
      - source: src-imagenet-ilsvrc2017
        quote: The data for the classification and localization tasks will remain unchanged from
          ILSVRC 2012
    notes: >
      The same images and 1,000 classes, with a bounding box returned for each of the five labels. A
      label counts only if its box overlaps a ground-truth box of that class by more than 50%, and the
      score is the top-5 localisation error. It ran from 2011 and is the LOC part of the dataset that
      Kaggle hosts.

lineage:
  role: root
  variants:
    - id: imagenet-face-blurred
      relation: privacy variant with faces blurred, released by the maintainers in March 2021
      source: src-imagenet-update-2021
      quote: We first annotated faces in the images and then constructed a face-blurred version of
        ILSVRC.
  forks:
    - id: imagenetv2
      maintainer: Recht, Roelofs, Schmidt and Shankar (2019)
      source: src-arxiv-1902-10811
      quote: We build new test sets for the CIFAR-10 and ImageNet datasets.
    - id: imagenet-real
      maintainer: Beyer, Henaff, Kolesnikov, Zhai and van den Oord (2020)
      source: src-arxiv-2006-07159
      quote: We therefore develop a significantly more robust procedure for collecting human
        annotations of the ImageNet validation set.

history:
  - date: 2017-07-26
    event: channel-moved
    field: execution.submission_channel
    from: the ILSVRC challenge's submission server on image-net.org
    to: Kaggle (ImageNet Object Localization Challenge)
    source: src-imagenet-ilsvrc2017
    quote: 'Jul 26, 2017: We are passing the baton to Kaggle. From now on, all three challenges(LOC-CLS,
      DET, VID) will be hosted on Kaggle!'
    note: The challenge rounds moved. The site's own year-round test-set server is still described
      on the challenges page (execution.submission_channel), and the Kaggle page could not be read.

tags:
  - image-classification
  - object-localization
  - ilsvrc
  - imagenet-1k
  - top-5-error
  - challenge

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1409-0575-v3
    - src-arxiv-1409-0575
    - src-imagenet-download
    - src-imagenet-about
    - src-imagenet-lsvrc
    - src-imagenet-ilsvrc2010
    - src-imagenet-ilsvrc2012
    - src-imagenet-ilsvrc2017
    - src-imagenet-update-2021
    - src-imagenet-announcement-2015-06
    - src-hf-api-imagenet-1k
    - src-arxiv-1902-10811
    - src-arxiv-2006-07159
    - src-arxiv-2602-08071-v1
  sources_note: >
    The ILSVRC paper's v3 PDF (a DOI, not archived) read as text, and its abstract page for the date and
    abstract; the image-net.org pages with scripts and styles stripped, none of them behind its login;
    Hugging Face's public API record for the gated ILSVRC/imagenet-1k dataset, whose terms were not
    accepted; the abstract pages of ImageNetV2 and of Are we done with ImageNet?; and ViT-5's v1 PDF as
    evidence of current use. The Kaggle competition page is rendered by script and was not read.
  confidence: medium
  review_checks:
    - check: activity is unknown because the Kaggle competition (the 2017 page's successor channel)
        and the image-net.org test server (behind a login) could not be read. closed fits if the
        maintainers' 2017 handover ended the series and the server is a private scoring service;
        leaderboard-live-no-round fits if Kaggle's board still takes entries.
      field: activity
      source: src-imagenet-ilsvrc2017
      quote: 'Jul 26, 2017: We are passing the baton to Kaggle. From now on, all three challenges(LOC-CLS,
        DET, VID) will be hosted on Kaggle!'
    - check: Saturation is derived and was not set. Beyer et al. find the original labels nearing
        the end of their usefulness; whether claims now support headroom_consumed >= 0.95 on top-1
        accuracy needs the claims the derivation reads.
      field: lifecycle
      source: src-arxiv-2006-07159
      quote: indicating that their usefulness in evaluating vision models may be nearing an end
    - check: The facets describe the design (test labels withheld, server-scored), so data.access is
        train-open-test-held-out and the tier not-independently-reproducible. If the validation set
        that papers use is taken as the headline, access becomes gated-registration (the copies read
        need a login or click-through; Kaggle's terms were not read) and the tier fully-automatable.
      field: data.access

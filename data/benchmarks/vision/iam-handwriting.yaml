# data/benchmarks/vision/iam-handwriting.yaml
#
# P1-S8-T06, vision entry 14. Filled from the FKI group's database page, read as the Wayback Machine's capture of
# 2026-10-01 because the page's own TLS certificate had expired (scripts and styles stripped; the registration-gated
# download was not opened and nothing was registered); the IJDAR 2002 paper's Springer landing page (DOI
# 10.1007/s100320200071), of which only the abstract is public; and three papers that report on the benchmark, the
# v1 PDFs of HTR-ConvText (arXiv 2512.05021, December 2025), DRetHTR (arXiv 2602.17387, February 2026) and
# Spike-HTR (arXiv 2608.01646, August 2026). Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# The entry is the database with the text-line recognition task its maintainers define. The database page names a
# task with "well defined training, test, and validation sets"; the papers score character and word error rate on
# line-level splits. All three 2026-era papers use a 6,482 / 976 / 2,915 line partition (one names it the Aachen
# split), not the maintainers' 6,161 / 900 + 940 / 1,861 one. That partition is another group's split of the same
# items with no maintainer page or versioning of its own, so it is recorded in as_used, not as a fork (see
# review_checks). Writer identification on the same forms is a use the page mentions with no task defined.

id: iam-handwriting
name: IAM Handwriting Database
aliases:
  - IAM
  - IAM-database
  - IAM Handwriting DB 3.0
  - IAM offline handwriting database
tagline: Handwritten English text lines from 657 writers, transcribed and scored by character and
  word error rate.
description: >
  A database of handwritten English from the FKI research group at the University of Bern. Writers copied
  sentences of the LOB Corpus onto forms, which were scanned at 300 dpi and segmented into text lines,
  sentences and words, each image with its transcription. Version 3.0 holds 1,539 pages from 657 writers,
  with 13,353 labelled text lines and 115,320 labelled words. The maintainers define a writer-independent
  text-line recognition task with one training, one test and two validation sets, so that results can
  be compared. A recogniser transcribes each test line, and papers report the character error rate (CER,
  the edit distance to the reference transcription divided by its length) and the word error rate (WER).
  Papers call it a widely adopted benchmark for offline handwritten text recognition. Current papers mostly
  score it on a different line partition of the same data, 6,482 / 976 / 2,915 lines, which one calls
  the Aachen split. They differ in training data, synthetic pretraining and language-model decoding. The
  data needs registration and is for non-commercial research only. No leaderboard or scoring script is
  published: results appear in their authors' own papers.
self_description:
  source: src-fki-iam-handwriting-database
  quote: The IAM Handwriting Database contains forms of handwritten English text which can be used
    to train and test handwritten text recognizers and to perform writer identification and
    verification experiments.
paper:
  title: 'The IAM-database: an English sentence database for offline handwriting recognition'
  doi: 10.1007/s100320200071
  source: src-springer-10-1007-s100320200071
released: null
released_note: The database page says it was first published at ICDAR 1999 and gives no day. The
  IJDAR paper describing the database as of October 2002 appeared in the November 2002 issue, as the
  landing page dates it (src-springer-10-1007-s100320200071). Version 3.0's release date is not
  stated in the sources read.
released_source: src-fki-iam-handwriting-database
released_quote: The database was first published in [1] at the ICDAR 1999.
release_venue: ICDAR 1999 (first publication); described in IJDAR 5 (2002)
release_venue_source: src-fki-iam-handwriting-database
release_venue_quote: The IAM-database as of October 2002 is described in [4].

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: vision/ocr-handwriting
domain_basis:
  reason: A recogniser reads a scanned line of handwriting and outputs its character sequence, and
    the score is the edit distance from the reference transcription, which is ocr-handwriting's
    definition. Under 02 S11 rule 12 the discriminant is what is scored, and the vision exclusion
    test sends a benchmark to multimodal only "if the scored relation is between a visual signal and
    language". Here the reference is the text written in the image itself, so the score measures
    what was recovered from the visual signal, over a fixed character set, and no question,
    description or expression is paired with the image. This parallels speech recognition, which is
    scored by WER inside audio-speech.
  source: src-arxiv-2512-05021-v1
  quote: Character Error Rate (CER) is defined as the Levenshtein distance
domain_considered_and_rejected:
  - term: multimodal/any-to-any-generation
    reason: The output is text produced from an image, the shape COCO's captioning track was given.
      But a caption is scored on whether it describes the image, which is a correspondence between
      the two, while a transcription is scored on whether it reproduces the characters written in
      it. The text is the visual content, not a referent of it.
  - term: vision/document-understanding
    reason: The images are scanned forms, but the scored unit is a segmented text line and its
      transcription. No layout, form structure or key-value content is scored; the segmentation was
      done by the maintainers and checked by hand.
    source: src-fki-iam-handwriting-database
    quote: The words have been extracted from pages of scanned text using an automatic segmentation
      scheme and were verified manually.
  - term: vision/classification
    reason: The page names writer identification and verification as a use of the forms, which would
      be classification of whole images by writer, but it defines no task, split or measure for it.
      The only task defined is text-line recognition.
    source: src-fki-iam-handwriting-database
    quote: The IAM Handwriting Database contains forms of handwritten English text which can be used
      to train and test handwritten text recognizers and to perform writer identification and
      verification experiments.
capability:
  - perception
capability_basis:
  perception:
    reason: The input is a scanned image of handwriting and the score measures how much of its
      character sequence was recovered from it.
    source: src-fki-iam-handwriting-database
    quote: The database contains forms of unconstrained handwritten text, which were scanned at a
      resolution of 300dpi and saved as PNG images with 256 gray levels.
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: The maintainers' task is writer-independent, so test lines come from writers never seen
      in training. But that is how the split is drawn, not a shifted condition scored apart from an
      in-distribution one; the same text corpus and form layout run through every set.
    source: src-fki-iam-handwriting-database
    quote: The text lines of all data sets are mutually exclusive, thus each writer has contributed
      to one set only.
  - term: context-integration
    reason: Many systems decode with a language model or lexicon built from other text, and the
      database was meant for recognition that uses linguistic knowledge. But that knowledge is the
      system's own, not material the benchmark supplies and scores the use of; whether a system uses
      it is a reporting condition.
    source: src-springer-10-1007-s100320200071
    quote: It can serve as a basis for a variety of handwriting recognition tasks.

evaluation_method:
  - reference-metric
evaluation_method_basis:
  reason: CER and WER are edit distances to a reference transcription, normalised by its length in
    characters or words, a fixed formula. reference-metric names word error rate in its inclusion
    test, and domain-metric's examples send WER to this term as a general edit-distance statistic.
  source: src-arxiv-2512-05021-v1
  quote: normalized by the total number of characters in the ground truth (Nc)
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: CER is the field's standard measure, but it is a general edit distance with meaning
      outside handwriting recognition, which the term's exclusion test and its open-asr-leaderboard
      near miss rule out.
  - term: exact-match
    reason: A line is not marked right or wrong; character and word errors are counted, so partial
      transcriptions earn partial credit.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The page offers the data to train and test handwritten text recognisers, and its task
    gives a training set beside the test set; the maintainers' own first system was an HMM
    recogniser trained on it. Entrants now are recognisers trained or fine-tuned on the training
    lines (CTC networks, encoder-decoder transformers, a spiking network), scored as trained.
  source: src-fki-iam-handwriting-database
  quote: Using this database an HMM based recognition system for handwritten sentences was developed
    and published in [2] at the ICPR 2000.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: No source read scores a prompted general model on the benchmark. Some entrants start
      from pretrained image and text models (TrOCR, DTrOCR with a GPT-2 decoder), but they are
      fine-tuned on IAM's lines and scored as trained.
    source: src-arxiv-2602-17387-v1
    quote: 'Comparison of HTR models: parameters, architecture, training data, external language model
      (LM) usage, and CER on the IAM test set (Aachen split).'
as_used:
  - protocol: Line-level CER and WER on the Aachen split (IAM-A) rather than the maintainers' task
      split. The model is pretrained on 17 million synthetic line images, CC100 text rendered in
      11,954 handwriting fonts, then fine-tuned on IAM, and decoded with no external language model
      ("RetNet w/EN-V2, L12/h12/d768 Syn+IAM No 2.26", the same Source's Table 11).
    split: Aachen split test set
    source: src-arxiv-2602-17387-v1
    quote: We conduct experiments on the line-level IAM dataset [12] using the standard Aachen split
      (IAM-A).
    note: DRetHTR (February 2026) calls this split IAM's official test set, gives no line counts for
      it, and compares with prior results taken from their papers, with and without synthetic data
      or a language model.
  - protocol: Line-level CER and WER on a 6,482 / 976 / 2,915 line partition that the paper calls
      the common research standard. Its prior results are copied from an earlier paper (HTR-VT) or
      re-implemented, and one row uses extra training data.
    split: test, 2,915 lines (6,482 train, 976 validation)
    source: src-arxiv-2512-05021-v1
    quote: Following the common research standard, the line-level subset is split into 6,482 lines
      for training, 976 lines for validation, and 2,915 lines for testing.
    note: HTR-ConvText (December 2025). Spike-HTR (August 2026) uses the same counts and calls them
      the official protocols. Neither names who made the partition; that it is the Aachen split
      DRetHTR names is likely but not stated in any source read (review_checks).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the instrument. Papers from December 2025, February
    2026 and August 2026 report IAM test CER for new recognisers. The database page, unchanged since
    2019 and served with an expired certificate, is maintenance evidence, not lifecycle.
  source: src-arxiv-2608-01646-v1
  quote: SNN spiking transformer + CTC 2 76.7 5.4 2.5 3.9
activity: no-submission-channel
activity_basis:
  reason: The maintainers define the task so that researchers can compare their own experiments, and
    publish no leaderboard, server or results page; results appear in their authors' papers.
  source: src-fki-iam-handwriting-database
  quote: The idea of a task it to allow researchers to compare the results of their experiments.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DRetHTR-Base
    source: src-arxiv-2602-17387-v1
    observed_on: 2026-11-08
    quote: DRetHTR achieves best reported test character error rates of 2.26% (IAM-A, en)
    note: A decoder-only retentive network with an EfficientNetV2 image encoder, pretrained on
      synthetic lines and fine-tuned on IAM.
  - system: HTR-ConvText
    source: src-arxiv-2512-05021-v1
    observed_on: 2026-11-08
    quote: HTR-VT 4.7 14.9 53.5M Ours 4.0 12.9 65.9M
    note: Test CER 4.0 and WER 12.9 on the 2,915-line test set, against 4.7 and 14.9 for HTR-VT in
      the same table.
  - system: Spike-HTR (T=2)
    source: src-arxiv-2608-01646-v1
    observed_on: 2026-11-08
    quote: Spike-HTR trains only on target data, decodes without language models or lexicons
    note: A spiking transformer with CTC, test CER 5.4 on IAM with greedy decoding.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The transcription of each line, from the LOB Corpus sentence its writer
  copied, stored with the images in the XML label files. The writers of the test lines contribute to
  no other set; the test transcriptions are released with the rest of the data, behind registration.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone who registers can download the images, transcriptions and the task's set lists,
    train on the training lines and compute CER on the test lines; no step needs the maintainers.
  source: src-fki-iam-handwriting-database
  quote: Before you can download the IAM Handwriting DB 3.0 we ask you to register so we are aware
    of who is using our data.

task:
  exists: true
  input:
    - a grey-level image of one handwritten text line, segmented from a scanned form
  output: The line's character sequence.
  scoring: Character error rate, the substitutions, insertions and deletions needed to turn the
    prediction into the reference, divided by the reference's length, over the test lines; word
    error rate is the same at word level. The maintainers' task fixes the sets; the metric, its
    normalisation and its aggregation over lines are each paper's.
  source: src-arxiv-2512-05021-v1
  quote: Character Error Rate (CER) is defined as the Levenshtein distance

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: The download needs a registration with the maintainers, which was not made for this
    entry. Copies on other hosts were not looked for.
  access_basis:
    reason: Images and transcriptions of every set, test included, are released, and the
      maintainers' copy is reached only after registering.
    source: src-fki-iam-handwriting-database
    quote: Before you can download the IAM Handwriting DB 3.0 we ask you to register so we are aware
      of who is using our data.
  refresh: versioned-releases
  refresh_basis:
    reason: The database grew in numbered versions, the current one 3.0, which extended the data and
      segmented words and characters by a new method; the page warns that results may differ across
      versions.
    source: src-fki-iam-handwriting-database
    quote: Apart from greatly extending the database, the word and characters have been extracted
      and segmented using a different method than the one used in previous versions.
  data_provenance:
    - crowd-authored
    - curated-public-database
  data_provenance_note: The handwriting was written by 657 contributors, who are not described as
    specialists, copying sentences of the LOB Corpus, a published text corpus compiled for other
    purposes. The forms were scanned at 300 dpi and segmented by the maintainers.
  data_provenance_source: src-fki-iam-handwriting-database
  data_provenance_quote: All texts in the IAM database are built using sentences provided by the LOB
    Corpus [5].
  contamination_risk: medium
  contamination_risk_note: The test transcriptions are released with the data, and their sentences
    come from the LOB Corpus, a text corpus published long before. A recogniser whose decoder or
    language model was trained on text that includes the corpus could know the test sentences
    without having seen the images. Papers pretrain decoders on large text or synthetic corpora
    (DRetHTR's from CC100), and no source read checks them for overlap with LOB. Nobody in the
    sources read has assessed this.
  contamination_evidence: []
  ceiling_anchor_type: null
  ceiling_anchor_type_note: CER and WER fall to 0 for a perfect transcription, and no source read
    measures a human transcriber's error rate on the test lines or the share of faulty labels. Some
    labels are wrong, since DRetHTR leaves faulty labels out of its hardest-line figure ("The three
    hardest IAM lines for DRetHTR (highest CER), excluding faulty labels.",
    src-arxiv-2602-17387-v1).
  dataset_licence: 'IAM terms of use: non-commercial research only, citing the IJDAR 2002 paper'
  dataset_licence_source: src-fki-iam-handwriting-database
  dataset_licence_quote: This database may be used for non-commercial research purpose only.
  upstream_licences: The text is from the LOB Corpus; its terms were not read.
  size:
    - count: 13353
      unit: labelled text lines (version 3.0)
      subset: whole database
      source: src-fki-iam-handwriting-database
      quote: 657 writers contributed samples of their handwriting 1'539 pages of scanned text 5'685
        isolated and labeled sentences 13'353 isolated and labeled text lines 115'320 isolated and
        labeled words
    - count: 1861
      unit: test text lines from 128 writers (6,161 train, 900 and 940 validation)
      subset: Large Writer Independent Text Line Recognition Task
      source: src-fki-iam-handwriting-database
      quote: Train 6'161 283 Validation 1 900 46 Validation 2 940 43 Test 1'861 128 Total 9'862 500
    - count: 2915
      unit: test text lines (6,482 train, 976 validation)
      subset: the line partition current papers use (as_used)
      source: src-arxiv-2512-05021-v1
      quote: Following the common research standard, the line-level subset is split into 6,482 lines
        for training, 976 lines for validation, and 2,915 lines for testing.
    - count: 115320
      unit: labelled words (version 3.0)
      subset: whole database
      source: src-fki-iam-handwriting-database
      quote: 657 writers contributed samples of their handwriting 1'539 pages of scanned text 5'685
        isolated and labeled sentences 13'353 isolated and labeled text lines 115'320 isolated and
        labeled words
    - count: 1066
      unit: forms from about 400 writers
      subset: the database as described in IJDAR 2002
      source: src-springer-10-1007-s100320200071
      quote: The database includes 1,066 forms produced by approximately 400 different writers.
  size_note: Version 3.0 also holds 1,539 scanned pages from 657 writers and 5,685 labelled
    sentences. The maintainers' task uses 9,862 of the 13,353 lines, from 500 writers. Spike-HTR
    counts 79 characters in the partition it uses ("IAM 6,482 976 2,915 English 79",
    src-arxiv-2608-01646-v1).
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: 'FKI: Research Group on Computer Vision and Artificial Intelligence, University of Bern'
  maintainer_basis:
    reason: The database page is the FKI group's, its footer names the group at Bern's computer
      science institute, and the group writes that it uses the database in its own research. The
      page is served from fki.tic.heia-fr.ch and was last modified in 2019; who keeps the
      registration and download running now is not stated.
    source: src-fki-iam-handwriting-database
    quote: Research Group on Computer Vision and Artificial Intelligence INF, University of Bern
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: The maintainers keep no ranking or results table; the page defines the
    task's sets and every result appears in its authors' own paper, often with prior results copied
    from other papers.
  submission_process_source: src-fki-iam-handwriting-database
  submission_process_quote: The idea of a task it to allow researchers to compare the results of
    their experiments.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-fki-iam-handwriting-database
      quote: Using this database an HMM based recognition system for handwritten sentences was
        developed and published in [2] at the ICPR 2000.
  independence_flags_note: The maintainers built and published their own recognisers on the database
    and say they use it extensively in their research. With no ranking of their own, the flag
    records authorship of results on it, not control over a leaderboard. No funding statement was
    read; the paper's full text is paywalled.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: null
  reproducibility_tier_note: Left null. The data and labels are released on registration and CER is
    computed automatically with no human, simulator or maintainer step, which reads as
    fully-automatable. But no scoring code is published, so harness none brings the
    no-reference-implementation blocker, and 02 S11 bars fully-automatable beside it, as for
    MusicCaps and Test of Time.
  reproducibility_blockers:
    - no-reference-implementation
  reproducibility_blockers_note: Each paper computes CER with its own code and its own text
    normalisation; Spike-HTR applies Unicode NFKC and collapses whitespace before scoring
    ("transcripts at train/validation/test time are normalized consistently using Unicode NFKC",
    src-arxiv-2608-01646-v1). Whether the error rate is summed over the test set or averaged per
    line is not stated by the papers read.
  harness_availability: none
  harness_availability_note: The database page publishes the data and the task's set lists, and no
    evaluation script. The three papers read score with their own code; Spike-HTR links its code,
    which was not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The fallback profile (reference-metric with task-specific models has no profile) floors at subset_used, which
  # here carries the split: the maintainers' task sets, the Aachen split, the 6,482 / 976 / 2,915 partition, or
  # their validation sets. Beyond it: the training data (IAM lines only, or synthetic pretraining or internal data
  # added), which the papers' tables separate; and the scoring code, since each paper normalises transcripts and
  # computes CER with its own. Whether a language model or lexicon was used in decoding also changes a number and
  # has no condition field.
  material_extra:
    - training_data_policy
    - harness

homepage: https://fki.tic.heia-fr.ch/databases/iam-handwriting-database

versions:
  - version: '2002'
    label: The IAM-database as of October 2002 (IJDAR 2002)
    version_kind: edition
    changes: The database the IJDAR paper describes, 1,066 forms by about 400 writers with 82,227
      word instances from a vocabulary of 10,841 words. The page also records a first publication at
      ICDAR 1999 and a second version with its own segmentation scheme, neither described in the
      sources read.
    breaking: true
    superseded_by: '3.0'
    frozen: true
    sources:
      - src-springer-10-1007-s100320200071
      - src-fki-iam-handwriting-database
  - version: '3.0'
    label: IAM Handwriting Database 3.0
    version_kind: edition
    items: 13353
    changes: Greatly extended, to 1,539 pages from 657 writers, with words and characters segmented
      by a new method. The maintainers say this can change results in theory and should not matter
      in practice. The task's sets are defined on it.
    breaking: true
    supersedes_version: '2002'
    frozen: true
    sources:
      - src-fki-iam-handwriting-database

subsets:
  - id: iam-handwriting#lwitlrt
    label: Large Writer Independent Text Line Recognition Task
    items: 1861
    scored_separately: true
    evidence:
      - source: src-fki-iam-handwriting-database
        quote: This task consists of a total number of 9'862 text lines.
      - source: src-fki-iam-handwriting-database
        quote: A task defines an experiment with well defined training, test, and validation sets.
    notes: >
      The maintainers' only defined task, on version 3.0: 6,161 training lines from 283 writers, two validation
      sets of 900 and 940 lines, and 1,861 test lines from 128 writers, with no writer in more than one
      set. The set lists are a download on the page. None of the 2025-2026 papers read reports on these
      sets (as_used).

tags:
  - handwritten-text-recognition
  - offline-handwriting
  - text-line-recognition
  - character-error-rate
  - writer-independent

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T06)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-fki-iam-handwriting-database
    - src-springer-10-1007-s100320200071
    - src-arxiv-2512-05021-v1
    - src-arxiv-2602-17387-v1
    - src-arxiv-2608-01646-v1
  sources_note: >
    The FKI database page, read as its Wayback capture of 2026-10-01 because the origin's TLS certificate
    had expired; the IJDAR paper's Springer landing page (a DOI, not archived), whose full text is paywalled;
    and the v1 PDFs of HTR-ConvText, DRetHTR and Spike-HTR (DOIs, not archived) as evidence of current
    use and of the split papers use. The origin's robots.txt could not be read. The registration-gated
    download, the set lists and the XML label files were not opened.
  confidence: medium
  review_checks:
    - check: The benchmark claim rests on the maintainers' task split, but no 2025-2026 paper read
        uses it. All three use a 6,482 / 976 / 2,915 partition, which DRetHTR names the Aachen split
        and the other two call the common standard or the official protocol. It is recorded in
        as_used under 04 S4 because it is another group's partition of the same items with no
        maintainer page or versioning of its own. A Fork entry for the Aachen split, or the split as
        the entry's headline with the maintainers' task as a subset, are the alternatives.
      field: as_used
      source: src-arxiv-2602-17387-v1
      quote: evaluated on the corresponding official test sets (IAM Aachen split
    - check: That the 6,482 / 976 / 2,915 partition is the Aachen split is likely but not stated in
        any source read, and who made it (RWTH Aachen, by its name) is not sourced. A source
        documenting the split's origin and counts would settle both as_used rows.
      field: as_used
      source: src-arxiv-2608-01646-v1
      quote: Train/val/test follow the official protocols
    - check: The origin page could not be fetched (expired TLS certificate, no plain HTTP), so its
        robots.txt was not checked; the page was read from the Wayback Machine's capture of
        2026-10-01 (CDX digest IQXWCG4Z46XUNR6HXP6MHVCNBIUIEP4F). Whether registration and download
        still work, and who runs the host now, is unknown.
      field: governance.maintainer
      source: src-fki-iam-handwriting-database
      quote: Last modified May 28, 2019
    - check: The metric is not defined by the maintainers; CER and WER are the papers' convention,
        and each paper scores with its own code and normalisation. harness none and the null
        reproducibility tier follow from that; if an official or de facto scorer is designated
        somewhere unread, both change.
      field: execution.harness_availability
      source: src-arxiv-2608-01646-v1
      quote: transcripts at train/validation/test time are normalized consistently using Unicode
        NFKC
    - check: Results are compared across papers that differ in training data, synthetic pretraining
        and language-model decoding, and tables mix copied and re-implemented numbers. The decoding
        condition has no field in the comparability profile.
      field: comparability
      source: src-arxiv-2608-01646-v1
      quote: Prior ANN numbers may differ in data, pretraining, and decoding.
    - check: The two versions are both modelled as editions. Version 3.0 extended the data (new
        items) and also re-segmented the words and characters (a revision of existing items); its
        release date and the first and second versions' contents are not in the sources read.
      field: versions
      source: src-fki-iam-handwriting-database

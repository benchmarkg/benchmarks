# data/benchmarks/code/scicode.yaml
#
# P3-S5-T04. Promoted from P3-S2-T07's Epoch stub (data/benchmarks/_stubs/scicode.yaml) so the bridge claims
# have a benchmark to stand on, and filled from SciCode's paper (arXiv 2407.13168v1, NeurIPS 2024 Datasets
# and Benchmarks), read as arXiv's HTML rendering. Every quote below is checked by the quote-substring
# validator against that Source's committed extract.
#
# What this entry is here to carry (14-roadmap Phase 3, P3-S5): research code in the natural sciences,
# written by language models and scored by scientists' tests -- science-adjacent, and LLM-run, so none of
# its claims counts toward the >=60 non-LLM claims. Its claims are the paper's standard setup (no
# background, generated solutions carried over); the with-background setting is not curated, because
# EvalConditions has no field for supplied context (curation.notes).

id: scicode
name: SciCode
aliases:
  - 'SciCode: A Research Coding Benchmark Curated by Scientists'
tagline: Scientists' research problems in five natural sciences, solved by writing code that their
  tests check.
description: >
  Eighty main problems drawn from real research in mathematics, physics, chemistry, biology and materials
  science, written and validated by scientists in 16 subfields. Each problem factorises into subproblems
  --
  338 in all -- that a model solves by writing Python functions, carrying its earlier solutions forward;
  scientist-written gold solutions and numerical and domain-specific test cases decide whether the code
  is
  right. A main problem counts as solved only when every subproblem and the integrated solution pass.
  Fifteen problems form a development split and sixty-five the test set.
self_description:
  source: src-arxiv-2407-13168
  quote: We address this by examining LM capabilities to generate code for solving real scientific
    research problems.
external_ids:
  epoch: SciCode
  arxiv: '2407.13168'
paper:
  title: 'SciCode: A Research Coding Benchmark Curated by Scientists'
  arxiv: '2407.13168'
  version_read: v1
  source: src-arxiv-2407-13168
released: 2024-07-18
released_note: The paper's arXiv v1, its only version; Epoch's benchmark_metadata.csv gives the same
  date.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: code/function-synthesis
  secondary:
    - physics/physics-reasoning
domain_basis:
  reason: The scored artefact is a function a model writes to a specification and that tests check;
    the specifications are research problems in the natural sciences, physics among them.
  source: src-arxiv-2407-13168
  quote: Incorporating input from scientists and AI researchers in 16 diverse natural science
    sub-fields, including mathematics, physics, chemistry, biology, and materials science
capability:
  - quantitative-reasoning
capability_basis:
  quantitative-reasoning:
    reason: Each subproblem's code must compute a scientific quantity correctly, checked numerically
      against scientists' solutions.
    source: src-arxiv-2407-13168
    quote: The problems naturally factorize into multiple subproblems, each involving knowledge
      recall, reasoning, and code synthesis.
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: The paper names recall as one ingredient, and providing the background raises scores,
      but the score is whether code passes tests; recall is not scored on its own.
  - term: tool-use
    reason: The model writes code; it does not run it or call tools during the evaluation.

evaluation_method:
  - execution-tests
evaluation_method_basis:
  reason: The generated code is run against scientists' numerical and domain-specific test cases.
  source: src-arxiv-2407-13168
  quote: gold-standard solutions and test cases for evaluation.

designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis: >
  The paper evaluates prompted, instruction-following models, open and proprietary, zero-shot with the
  same prompt for all; the model writes code once per subproblem, with no loop and no tools.

lifecycle: active
lifecycle_basis:
  reason: A public leaderboard is kept beside the data and code. Saturation is computed from the
    claims (12 S4), never set here.
  source: src-arxiv-2407-13168
  quote: Data, code, and leaderboard available at https://scicode-bench.github.io/
activity: leaderboard-live-no-round
activity_basis:
  reason: A standing leaderboard with no rounds.
  source: src-arxiv-2407-13168
  quote: Data, code, and leaderboard available at https://scicode-bench.github.io/

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude3.5-Sonnet
    source: src-arxiv-2407-13168
    observed_on: 2026-10-05
    quote: Claude3.5-Sonnet 26.0 4.6
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: The scientists' test cases for each subproblem, written with its gold
  solution.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The problems, the tests and the evaluation code are released.
  source: src-arxiv-2407-13168
  quote: Data, code, and leaderboard available at https://scicode-bench.github.io/

task:
  exists: true
  input:
    - a main problem's instructions and the current subproblem's, with the code the model wrote for
      the earlier subproblems
  output: A Python function for the subproblem.
  scoring: A subproblem is solved when its code passes the test cases; a main problem when every
    subproblem and the integrated solution are correct. pass@1 over the 65 test problems.
  tests_hidden_from_system: true
  source: src-arxiv-2407-13168
  quote: We evaluate our model using zero-shot prompts.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Problems, gold solutions, tests and evaluation code are released.
    source: src-arxiv-2407-13168
    quote: Data, code, and leaderboard available at https://scicode-bench.github.io/
  refresh: static
  refresh_basis:
    reason: One set of 80 problems, split once into development and test.
    source: src-arxiv-2407-13168
    quote: We reserve 15 main problems (50 subproblems) for the development split and use the
      remaining 65 main problems (288 subproblems) as the test data.
  data_provenance:
    - expert-authored
  data_provenance_note: Problems, solutions and tests written and checked by scientists in the
    field, through three rounds of validation.
  data_provenance_source: src-arxiv-2407-13168
  data_provenance_quote: domain-specific test cases to ensure the problem’s validity
  contamination_risk: medium
  contamination_risk_note: >
    The problems come from scientists' own research rather than from web pages, but the full set, solutions
    and tests have been public since 2024. Not escalated without a study to cite.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: Every subproblem has a scientist-written gold solution that passes its tests, so a
      perfect score is attainable by construction.
    source: src-arxiv-2407-13168
    quote: gold-standard solutions and test cases for evaluation.
  size:
    n_items:
      value: 65
      unit: main problems
      split: test
      source: src-arxiv-2407-13168
      quote: use the remaining 65 main problems (288 subproblems) as the test data.
    other_splits:
      - value: 15
        unit: main problems
        split: development
        source: src-arxiv-2407-13168
        quote: We reserve 15 main problems (50 subproblems) for the development split
  size_note: 80 main problems and 338 subproblems in all; the test set is 65 and 288.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The SciCode team (University of Illinois Urbana-Champaign, with Argonne National
    Laboratory and others)
  maintainer_basis:
    reason: The lead authors and most of the scientist curators are at UIUC.
    source: src-arxiv-2407-13168
    quote: 'Minyang Tian Affiliation: University of Illinois Urbana-Champaign'
  maintainer_type: academic-lab
  submission_process:
    - self-reported
  submission_process_note: Developers run the released evaluation themselves and report pass@1; no
    source read here describes a check by the maintainers.
  submission_process_source: src-arxiv-2407-13168
  submission_process_quote: Data, code, and leaderboard available at
    https://scicode-bench.github.io/
  independence_flags: []
  independence_flags_note: None recorded.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: Models are prompted once per subproblem, and the tests run on a CPU.
    source: src-arxiv-2407-13168
    quote: We keep prompts the same across models and fields
  reproducibility_tier: fully-automatable
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The SciCode evaluation code (scicode-bench.github.io)
  harness_source: src-arxiv-2407-13168
  harness_quote: Data, code, and leaderboard available at https://scicode-bench.github.io/
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Background on or off and gold or generated carry-over change the score as much as the model does
  # (Tables 2 and 3); neither is an EvalConditions field yet (curation.notes), so the curated claims all
  # use the standard setup, which the notes of each state.
  # No profile resolves for execution-tests x instruction-tuned-model (curation.notes, finding 3), and the
  # fallback holds subset_used alone, which would make every claim 100% complete on one field. So the
  # llm-static-text fields a prompted code model's score moves with are added, with the two that make a
  # SciCode number what it is: the selection over samples (pass@1; a pass@k is a different number) and the
  # harness that runs the scientists' tests.
  material_extra:
    - shots
    - chain_of_thought
    - reasoning_effort
    - retries_allowed
    - tools_allowed
    - selection_strategy
    - harness
headline_metric: scicode-main-problem-pass-at-1

homepage: https://scicode-bench.github.io/
metrics:
  - scicode-main-problem-pass-at-1

tags:
  - scientific-computing
  - research-level

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P3-S5-T04)
  added_on: 2026-10-05
  last_verified: 2026-10-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2407-13168
    - src-epoch-benchmark-data
  sources_note: >
    The paper (a DOI, so not archived), read as arXiv's HTML rendering; its extract keeps windows around
    the cited passages. Epoch's export supplies the release date. The leaderboard was not read; Epoch's
    SciCode rows are Artificial Analysis's, a different metric (curation.notes).
  confidence: medium
  notes: |
    Reviewer checks:
    - domain primary code/function-synthesis with physics secondary: the scored act is writing code, the
      content science. A reviewer may prefer a science primary.
    - designed_for_subjects instruction-tuned-model only, as the paper's models.

    Schema findings:
    1. The paper's two protocol switches -- scientific background supplied or not, and gold or generated
       solutions carried over -- move pass@1 by several points (Table 3) and have no EvalConditions field.
       ForecastBench met the same gap (supplied context). Until one exists, only standard-setup claims are
       curated, so no two claims differ by an unrecorded condition.
    2. Epoch's scicode_external.csv cites Artificial Analysis, whose SciCode score is not this metric
       (main-problem pass@1); its mapping stanza (P3-S2-T04's orphan files) should name its own metric.
    3. taxonomy/comparability-profiles.yaml has no profile for execution-tests x instruction-tuned-model --
       prompted code generation, HumanEval's shape -- so it falls back to subset_used alone. The
       llm-static-text fields are added here through material_extra; the profile file should gain the pair.

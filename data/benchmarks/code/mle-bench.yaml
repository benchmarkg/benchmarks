# data/benchmarks/code/mle-bench.yaml
#
# P1-S10-T01, code entry 5 of 8. Filled from the MLE-bench paper, arXiv 2410.07095 read as its v6 PDF (2025-02-26,
# ICLR 2025), and its abstract page; the openai/mle-bench README at main, with its leaderboard, and the
# repository's LICENSE file; the MLE-bench README in UK AISI's inspect_evals; the openai/frontier-evals README,
# where the maintainers say v2 will be released; and the v3 PDF of MARS (arXiv 2602.02660, May 2026, ICML 2026), a
# paper that reports MLE-bench results on its own hardware. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: mle-bench
name: MLE-bench
aliases:
  - MLE-Bench
tagline: 75 Kaggle competitions run offline by an AI agent, scored by the Kaggle medal its
  submission would have won.
description: >
  OpenAI's benchmark of machine-learning engineering by AI agents: 75 finished Kaggle
  competitions, chosen by hand from 586 candidates, each with its description, its data and
  grading code, run offline in a container. The agent must train a model and write a
  submission.csv of test-set predictions; writing predictions by hand, calling another language
  model and copying public solutions are forbidden, and a log-analysis tool and a plagiarism
  detector check for them. Where Kaggle never released test labels, the maintainers split the
  public training data anew. Each submission is graded with its competition's metric and placed on
  a snapshot of the competition's Kaggle private leaderboard, so it earns the bronze, silver or
  gold medal it would have won there; the headline is the percentage of attempts that win any
  medal, the mean over at least three seeds. Competitions are labelled Low (22), Medium (38) or
  High (15) complexity, and the Low split doubles as MLE-bench Lite. The canonical setup gives an
  agent 24 hours per competition on a machine with one A10 GPU, which the README recommends rather
  than requires. The README's leaderboard ranks agent scaffolds paired with models; it stopped
  taking submissions on 2026-04-24, and fixes for known task defects are held back for a v2.
self_description:
  source: src-arxiv-2410-07095
  quote: We introduce MLE-bench, a benchmark for measuring how well AI agents perform at machine
    learning engineering
external_ids:
  arxiv: '2410.07095'
paper:
  title: 'MLE-bench: Evaluating Machine Learning Agents on Machine Learning Engineering'
  arxiv: '2410.07095'
  version_read: v6
  source: src-arxiv-2410-07095-v6
released: 2024-10-09
released_note: The paper's first arXiv version, as its abstract page dates it; the repository was
  created the day before (GitHub API, read 2026-10-14). The version read, v6 of 2025-02-26, is the
  ICLR 2025 version.
released_source: src-arxiv-2410-07095
released_quote: Submitted on 9 Oct 2024
release_venue: ICLR 2025
release_venue_source: src-arxiv-2410-07095-v6
release_venue_quote: Published as a conference paper at ICLR 2025

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: code/ml-engineering
  secondary:
    - agents-tooluse/long-horizon-autonomy
domain_basis:
  reason: The agent builds and runs an ML pipeline, and the grader scores the predictions file its
    trained model produces, the code family's "what the software computes" case, of which the
    taxonomy names MLE-bench the example. Each attempt is one unattended episode of up to 24 hours,
    which the secondary leaf records.
  source: src-arxiv-2410-07095-v6
  quote: You must solve the task by training a model and running the model on the test set to
    produce a submission file.
domain_considered_and_rejected:
  - term: code/data-science-workflows
    reason: That leaf scores an analysis that reaches a quantitative answer; here the predictions of
      a trained model on a held-out split are scored, and the paper sets MLE-bench apart from
      DSBench's data science tasks.
  - term: agents-tooluse/software-agents
    reason: The agent works from a dataset and a description in a container, not inside a real
      repository or toolchain, which the leaf's inclusion test asks for.
capability:
  - autonomy
capability_basis:
  autonomy:
    reason: Each attempt runs unattended for up to 24 hours, and the rules forbid outside help,
      which a log-analysis tool checks for (calling another LLM, writing predictions by hand,
      reaching unauthorised resources).
    source: src-arxiv-2410-07095-v6
    quote: Agents run autonomously for up to 24 hours in our experiments.
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: An attempt runs for hours over many dependent steps, but a failed training run or an
      invalid submission can be repaired later in the episode, and scaffolds keep their best
      solution so far, so an intermediate failure does not make a medal unattainable, which the
      term's inclusion test asks.
  - term: optimization
    reason: Each competition's metric is optimised, but against held-out labels, which the term's
      exclusion test sends elsewhere, and the score is the medal the result earns.
  - term: experimental-design
    reason: Agents run experiments to choose a model, but the scored artefact is a predictions file,
      not a protocol judged on whether it would answer a question.
  - term: tool-use
    reason: Tools belong to the scaffold, which the benchmark leaves to the entrant; the score is
      the submission's medal, not whether tools were called correctly.

evaluation_method:
  - human-distribution-percentile
evaluation_method_basis:
  reason: Each submission is scored with its competition's metric and placed on a snapshot of that
    competition's Kaggle private leaderboard, and a medal is awarded by Kaggle's thresholds for the
    size of that field of human teams; the headline is the share of attempts that win any medal.
  source: src-arxiv-2410-07095-v6
  quote: as if the agent were participating in the competition at the time
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Raw scores use each competition's own metric, from AUROC to domain-specific losses, but
      they are not aggregated; each is turned into a medal against the human leaderboard.
    source: src-arxiv-2410-07095-v6
    quote: Evaluation metrics vary by competition, from standard metrics like area under the
      receiver operating characteristic (AUROC) to domain-specific loss functions.
  - term: entrant-relative-ranking
    reason: The leaderboards ranked against are fixed snapshots of Kaggle's human teams, so one
      agent's medal does not move when another agent is added.
    source: src-arxiv-2410-07095-v6
    quote: Snapshots of the Private leaderboard were taken between May and August 2024.
designed_for_subjects:
  - agent-scaffold
designed_for_subjects_basis:
  reason: The benchmark leaves the agent to the entrant and asks only for a CSV per competition; the
    paper compares three scaffolds on one model, and the leaderboard ranks scaffold and model pairs.
  source: src-github-mle-bench-readme
  quote: We purposefully designed our benchmark to not make any assumptions about the agent that
    produces submissions
designed_for_subjects_considered_and_rejected:
  - term: model-in-benchmark-harness
    reason: The benchmark supplies no agent loop of its own, and every leaderboard row brings its
      own scaffold. The default react() agent in inspect_evals is that harness's choice, not the
      benchmark's design.
as_used:
  - protocol: The README's 24-hour budget per competition and three runs, but on one A100 (40GB)
      with 12 vCPUs and 220 GB of RAM rather than the canonical A10 machine; results on all 75
      competitions and on each complexity split, with ablations on the 22 Lite competitions.
    split: all 75 competitions, and the Low (Lite), Medium and High splits
    source: src-arxiv-2602-02660-v3
    quote: conducted on a standard node equipped with one NVIDIA A100 GPU (40GB), 12 vCPUs, 220 GB
      of RAM, and 1 TB of SSD storage
    note: MARS (Google Cloud AI Research, ICML 2026). Its Table 6 lists the leaderboard agents it
      compares with, on other machines and limits (an A100 80GB or a V100 with a 12-hour limit, an
      H100 with a $200 budget), and it warns that leaderboard comparisons "can be influenced by
      hardware disparities".

lifecycle: under-revision
lifecycle_note: The v2 announcement is undated. On 2026-10-14 the openai/frontier-evals README,
  where v2 is to be released, lists PaperBench, SWE-Lancer and EVMbench and no MLE-bench
  (review_checks).
lifecycle_basis:
  reason: The maintainers hold fixes for known task defects for a v2, whose leaderboard is to carry
    a version column, so an unversioned score will not be interpretable once v2 ships. Results are
    still produced on v1 (README rows to 2026-03-06, MARS in May 2026), and under-revision takes
    precedence.
  source: src-github-mle-bench-readme
  quote: we plan to release batched fixes in the upcoming v2 release of MLE-bench
activity: closed
activity_note: The stated plan is to share updates on the process later; the repository has not been
  pushed since 2026-04-24 (GitHub API, read 2026-10-14).
activity_basis:
  reason: The README leaderboard took submitted results until its 2026-04-24 update paused
    submissions, with no reopening date.
  source: src-github-mle-bench-readme
  quote: We are currently not taking any new submissions to the leaderboard while we develop an
    improved process for ensuring submissions are fair and comparable.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Famou-Agent 2.0 with Gemini-3-Pro-Preview
    source: src-github-mle-bench-readme
    observed_on: 2026-10-14
    quote: Gemini-3-Pro-Preview | 80.3 ± 1.52 | 64.04 ± 2.32 | 42.22 ± 2.22 | 64.44 ± 1.18 | 24 |
      2026-02-23
  - system: AIDE with o1-preview
    source: src-arxiv-2410-07095
    observed_on: 2026-10-14
    quote: finding that the best-performing setup--OpenAI's o1-preview with AIDE
      scaffolding--achieves at least the level of a Kaggle bronze medal in 16.9% of competitions
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Test labels come from a new split of each competition's public training
  data (usually 10%) or from private test labels Kaggle released; the medal thresholds come from the
  snapshots of Kaggle's private leaderboards.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The dataset construction, the graders and the evaluated agents are released, and the data
    downloads through the Kaggle API once each competition's rules are accepted. Two Lite
    competitions can no longer be joined on Kaggle, which keeps a newcomer from the full set
    (review_checks).
  source: src-github-mle-bench-readme
  quote: We have released the code used to construct the dataset, the evaluation logic, as well as
    the agents we evaluated for this benchmark.

task:
  exists: true
  input:
    - a competition's description, scraped from its Kaggle Overview and Data tabs
    - the competition's data in a new train and test split, without the test labels
    - a local server that checks a submission's format without scoring it
  output: A submission.csv of test-set predictions made by a model the agent trained; predictions
    written from the agent's own knowledge are forbidden.
  scoring: The competition's grader scores the CSV with the competition's metric, and the score is
    placed on the snapshot of the competition's Kaggle private leaderboard to award bronze, silver
    or gold by Kaggle's thresholds for that number of teams. The headline is the percentage of
    attempts awarded any medal, the mean and SEM over at least three seeds, reported for the Low
    (Lite), Medium, High and All splits.
  tests_hidden_from_system: true
  tests_hidden_from_system_source: src-arxiv-2410-07095-v6
  tests_hidden_from_system_quote: the tool does not provide a score
  source: src-arxiv-2410-07095-v6
  quote: we calculate the percentage of attempts that are awarded any medal (bronze and above)

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: The README's own tests fail unless each competition's rules are accepted.
    inspect_evals reports that detecting-insults-in-social-commentary and
    the-icml-2013-whale-challenge-right-whale-redux, both Lite competitions, can no longer be joined
    on Kaggle, so its full split has 73 competitions and its Lite split 20. The full data is about
    3.3TB, Lite's 158GB.
  access_basis:
    reason: The datasets are not redistributed. The preparation scripts download each competition
      through the Kaggle API, which needs an account and acceptance of the competition's rules, and
      build the held-out test labels locally, so nothing scored is withheld once the gate is passed.
    source: src-github-mle-bench-readme
    quote: Ensure that you have downloaded your Kaggle credentials
  refresh: versioned-releases
  refresh_basis:
    reason: Fixes to v1's known defects are held for a labelled v2, and the leaderboard is to tell
      v1 and v2 results apart; v1 is kept unchanged so as not to invalidate submissions.
    source: src-github-mle-bench-readme
    quote: which will include a version column in the leaderboard to distinguish between v1 and v2
      results
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: Each task is a finished Kaggle competition whose description, data and
    leaderboard are reused. The maintainers wrote new train and test splits from the public training
    data where Kaggle never released test labels, and grading code from each competition's stated
    metric.
  data_provenance_source: src-arxiv-2410-07095-v6
  data_provenance_quote: MLE-bench consists of 75 machine learning engineering tasks manually
    sourced from Kaggle
  contamination_risk: medium
  contamination_risk_note: >
    The test sets are carved from public Kaggle data, and the paper concedes that models may have
    trained on all of it, discussions and solutions included; its familiarity and obfuscation
    experiments found no systematic inflation for GPT-4o, with no guarantee for later models. The
    README's known issues add test-label leaks in five competitions: four inside the prepared data,
    random-acts-of-pizza (a Lite competition) among them, and dog-breed-identification, whose test
    split comes from the public Stanford Dogs corpus. v1 keeps them in the scores. They are read here
    as run-time leaks the rules forbid using, not as an evidenced training route (review_checks).
  contamination_evidence:
    - source: src-arxiv-2410-07095-v6
      stance: supports
      quote: models have trained on all public Kaggle material including competition details,
        solutions, and even the datasets including our test set
    - source: src-arxiv-2410-07095-v6
      stance: against
      quote: Our experiments find no evidence of results being systematically inflated due to
        memorization.
    - source: src-github-mle-bench-readme
      stance: supports
      quote: out images from a publicly labeled source corpus derived from the Stanford Dogs
        Dataset, which agents may discover and leverage
  ceiling_anchor_type: expert-best
  ceiling_anchor_type_basis:
    reason: The paper reads the any-medal headline against the best human Kagglers, nine of whom
      hold medals in more than 75 competitions; each medal itself is placed by its competition's
      human field (evaluation_method).
    source: src-arxiv-2410-07095-v6
    quote: with a ceiling comparable to the achievements of the very best human Kagglers after years
      of cumulative effort
  dataset_licence: null
  upstream_licences: Each competition's data stays under its own Kaggle rules and licence, and the
    repository's licence covers its code only. The paper screened out competitions whose data
    licence restricts inclusion.
  upstream_licences_source: src-github-mle-bench-license
  upstream_licences_quote: This license applies to the code in this repository, but not the external
    datasets and files that may be downloaded while using this package.
  size:
    - count: 75
      unit: Kaggle competitions (22 Low, 38 Medium and 15 High complexity)
      subset: All
      source: src-arxiv-2410-07095-v6
      quote: we select 75 competitions to include in MLE-bench, comprising 22 competitions Low in
        complexity (30%), 38 Medium (50%), and 15 High (20%)
    - count: 22
      unit: Kaggle competitions
      subset: Lite (the Low complexity split)
      source: src-github-mle-bench-readme
      quote: which consists of only 22 competitions
    - count: 7
      unit: Kaggle competitions
      subset: development split, outside the 75
      source: src-arxiv-2410-07095-v6
      quote: We include an additional 7 competitions as a development split

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: OpenAI
  maintainer_basis:
    reason: OpenAI holds the repository and its licence, and the paper's authors are at OpenAI.
    source: src-github-mle-bench-license
    quote: Copyright (c) 2024 OpenAI
  maintainer_type: industry-lab
  submission_process:
    - self-reported
    - maintainer-run
  submission_process_note: Submitters put their grading reports in the repository's runs/ folder,
    ran its aggregation script and reported the mean and SEM per split. No source states a check
    before listing, although two rows that had test-set feedback sit apart in a table of results not
    directly comparable. The maintainers' own rows (AIDE, MLAB and OpenHands, 2024-10-08) are the
    paper's runs. Paused since 2026-04-24 (activity).
  submission_process_source: src-github-mle-bench-readme
  submission_process_quote: Report the mean and standard error of the mean (SEM) for each of the
    splits
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2410-07095
      quote: finding that the best-performing setup--OpenAI's o1-preview with AIDE
        scaffolding--achieves at least the level of a Kaggle bronze medal in 16.9% of competitions
  independence_flags_note: OpenAI ran its own models (o1-preview, GPT-4o) in the paper and lists
    those rows on its board, and OpenAI models drive other submitters' rows too (gpt-5, o3). The
    rule-breaking check reads agent logs with an OpenAI model, but medals come from the programmatic
    grader, so grader-from-evaluated-party is not set.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: single-gpu
  compute_tier_note: The canonical setup per attempt is 24 hours on 36 vCPUs, 440GB of RAM and one
    24GB A10 GPU, which the README recommends without requiring, asking for deviations to be
    reported; leaderboard agents ran on one A100, H100, V100 or A800 (MARS, Table 6). The model's
    API spend comes on top.
  compute_tier_source: src-github-mle-bench-readme
  compute_tier_quote: 'Compute: 36 vCPUs with 440GB RAM and one 24GB A10 GPU'
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: Data preparation, agent runs and grading need no human or maintainer
    step, and grading is deterministic. A canonical run is costly (75 competitions of 24 hours each,
    1,800 GPU hours a seed, at least three seeds, and about 3.3TB of data), which is the
    compute-scale blocker's case, but 02 S11 blocks that blocker beside this tier
    (taxonomy/_failures/2026-09-28-mle-bench-006, review_checks).
  reproducibility_tier_source: src-github-mle-bench-readme
  reproducibility_tier_quote: The evaluation (task and grading) itself is deterministic, but
    agents/LLMs can be quite high-variance!
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: mlebench, the openai/mle-bench package (mlebench prepare and mlebench grade, with
    experiments/aggregate_grading_reports.py for the leaderboard's per-split scores)
  harness_source: src-github-mle-bench-readme
  harness_quote: We have released the code used to construct the dataset, the evaluation logic, as
    well as the agents we evaluated for this benchmark.
  harness_gotcha:
    source: src-github-inspect-evals-mle-bench-readme
    quote: Full benchmark (`all.txt`) — 73 competitions
  harness_gotcha_note: UK AISI's inspect_evals runs MLE-bench with the upstream grader and the same
    any_medal criterion, but on 73 competitions (Lite 20), because two competitions' rules can no
    longer be accepted on Kaggle, and with its own default agent (react(), 30 messages, one CPU, no
    GPU unless set). Its numbers are on the README's splits and resources only when configured to
    be.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata reports NOASSERTION (read 2026-10-14), because the
    LICENSE file adds a note excluding the downloaded datasets.
  code_licence_source: src-github-mle-bench-license
  code_licence_quote: MIT License
  runnable_via:
    - custom
    - inspect
  inspect_evals_id: mle_bench
  inspect_evals_id_source: src-github-inspect-evals-mle-bench-readme
  inspect_evals_id_quote: low.txt corresponts to MLE-bench-LITE, while all.txt is the full benchmark
  maintainer_rerun_policy: unstated

comparability:
  # (human-distribution-percentile, agent-scaffold) has no profile, so the fallback holds subset_used alone
  # (full or Lite, or one complexity split). Beyond it: the scaffold (GPT-4o medals 8.7% with AIDE, 0.8% with
  # MLAB, 4.4% with OpenHands) and the harness (inspect_evals runs 73 competitions with its own agent); the
  # machine and the time limit, recorded in `hardware` and `wall_clock_hours` (24 against 100 hours moves
  # GPT-4o from 8.7% to 11.8%, and leaderboard rows ran 12, 24 or 36 hours on A10 to H100 GPUs); the seeds and
  # the selection (pass@k roughly doubles pass@1); internet access and knowledge bases, which the paper asks
  # to be reported (`tools_allowed`); and the model's reasoning effort, which one row states. The two rows that
  # had test-set feedback are set apart by the maintainers and have no condition field.
  material_extra:
    - scaffold
    - harness
    - hardware
    - wall_clock_hours
    - n_samples
    - selection_strategy
    - k
    - tools_allowed
    - reasoning_effort

homepage: https://github.com/openai/mle-bench
repository: https://github.com/openai/mle-bench
leaderboard_url: https://github.com/openai/mle-bench#leaderboard

versions:
  - version: v1
    label: MLE-bench v1, the release every leaderboard result is on
    version_kind: revision
    released: 2024-10-09
    items: 75
    changes: The release of the paper and the repository. Known task defects are left unfixed in it
      so as not to invalidate the leaderboard.
    frozen: true
    sources:
      - src-arxiv-2410-07095
      - src-github-mle-bench-readme

subsets:

    scored_separately: true
    evidence:
      - source: src-github-mle-bench-readme
        quote: which consists of only 22 competitions
      - source: src-arxiv-2410-07095-v6
        quote: Low if we estimate that an experienced ML engineer can produce a sensible solution in
          under 2 hours excluding the time taken to train any models
    notes: Competitions an experienced ML engineer could solve sensibly in under two hours, training
      excluded; the README recommends it when the full set is too costly (158GB of data against
      3.3TB), and its leaderboard reports it as the Low == Lite column.
  - id: mle-bench#medium
    label: Medium complexity split
    items: 38
    scored_separately: true
    evidence:
      - source: src-arxiv-2410-07095-v6
        quote: we select 75 competitions to include in MLE-bench, comprising 22 competitions Low in
          complexity (30%), 38 Medium (50%), and 15 High (20%)
    notes: Two to ten hours of an experienced ML engineer's work, training excluded.
  - id: mle-bench#high
    label: High complexity split
    items: 15
    scored_separately: true
    evidence:
      - source: src-arxiv-2410-07095-v6
        quote: we select 75 competitions to include in MLE-bench, comprising 22 competitions Low in
          complexity (30%), 38 Medium (50%), and 15 High (20%)
    notes: More than ten hours of an experienced ML engineer's work, training excluded.

lineage:
  role: root

history:
  - date: 2026-04-24
    event: channel-closed
    field: execution.submission_channel
    from: the README leaderboard (grading reports with the mean and SEM per split)

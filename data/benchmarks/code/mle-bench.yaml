# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S10-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2410-07095-v6
    - src-arxiv-2410-07095
    - src-github-mle-bench-readme
    - src-github-mle-bench-license
    - src-github-inspect-evals-mle-bench-readme
    - src-github-frontier-evals-readme
    - src-arxiv-2602-02660-v3
  sources_note: >
    The paper's v6 PDF (a DOI, not archived) read as text; its abstract page for the first version's
    date; the README at main, which holds the leaderboard, and the repository's LICENSE file; the
    inspect_evals MLE-bench README for the third-party harness; the openai/frontier-evals README,
    read for whether v2 has been released; and MARS's v3 PDF (a DOI) as evidence of current use.
    Kaggle itself was not visited, and no competition's rules were accepted.
  confidence: medium
  review_checks:
    - check: lifecycle under-revision rests on an undated announcement of a v2. On 2026-10-14 the
        frontier-evals README lists no MLE-bench and the repository was last pushed on 2026-04-24,
        while v1 results are still produced (README rows to 2026-03-06, MARS in May 2026). If the v2
        work has stopped, active is the alternative.
      field: lifecycle
      source: src-github-frontier-evals-readme
      quote: '├── evmbench/ # EVMBench eval ├── paperbench/ # PaperBench eval └── swelancer/ # SWE-Lancer
        eval'
    - check: refresh versioned-releases rests on the announced v2 and its version column; no source
        shows v1 itself changing since release, so static is the alternative until v2 ships.
      field: data.refresh
    - check: contamination_risk medium against high. The README keeps known test-label leaks in v1's
        scores (dog-breed-identification's labels sit in the public Stanford Dogs corpus; data
        fields or files leak the answer in random-acts-of-pizza, multi-modal-gesture-recognition,
        smartphone-decimeter-2022 and hubmap-kidney-segmentation). They are read as run-time leaks
        the rules forbid exploiting; a reviewer may read the dog-breed case as an evidenced route
        into a scored split.
      field: data.contamination_risk
      source: src-github-mle-bench-readme
      quote: The field `giver_username_if_known` leaks the outcome, enabling trivial perfect
        prediction.
    - check: reproducibility_blockers is empty although the cost of a canonical run is the
        compute-scale case, because 02 S11 blocks any blocker but licence-restriction beside
        fully-automatable; the conflict is logged as taxonomy/_failures/2026-09-28-mle-bench-006 and
        is still open.
      field: execution.reproducibility_blockers

    - src-arxiv-2610-02361-v1
    - src-epoch-benchmark-data
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, main body and Appendix A in full; its abstract
    page for the dates, the venue note and the CC BY licence; the README and docs/evaluation.md at commit
    8ba16e6; Hugging Face's API record of the dataset, with no file of the dataset downloaded; the leaderboard
    page with scripts stripped and the results_summary.json it renders; SEDIMA's v1 PDF (a DOI) as evidence
    of current use; and Epoch's export for the stub's string. The Sakana AI blog posts and AtCoder's pages,
    including the generative-AI rules the README links, were not fetched.
  confidence: medium
  review_checks:
    - check: "Leaf: competitive-programming over code-performance-optimization. The deciding facts are
        that the problems are contest problems kept under their original execution limits and ranked against
        the contest's field (the paper calls ALE-Bench a competitive programming benchmark), and that
        the score is each problem's objective, with no given code to speed up and no speedup measured.
        But the leaf's definition speaks of correctness limits, and ALE-Bench is score-based with no correct
        answer, which the paper sets apart from the exact-solution contests the leaf was written for.
        Confirm, or open a heuristic-optimisation leaf."
      field: domain
      source: src-arxiv-2506-09050-v2
      quote: Unlike those benchmarks, ALE-Bench tackles score-based tasks from the AtCoder Heuristic
        Contest (AHC) that have no single ground-truth answer.
    - check: The secondary agents-tooluse/long-horizon-autonomy follows MLE-bench's reading of a
        long unattended session. The paper's one-shot setting and the leaderboard's sampled
        self-refinement have no long episode, and the paper cut every session to four hours, so the
        secondary describes the regulations rather than most reported results.
      field: domain.secondary
    - check: evaluation_method carries execution-tests beside human-distribution-percentile because
        the program is executed and judged per case (accepted, wrong answer, time limit), and the
        pair resolves the agentic profile. The score is an objective value rather than pass or fail,
        so human-distribution-percentile alone (the fallback profile, as MLE-bench has) is the
        alternative.
      field: evaluation_method
    - check: ceiling_anchor_type expert-average reads AtCoder's contestants as practising
        specialists; they are self-selected and range from novices to professionals, so
        crowd-average is arguable, and none-known fits the open-ended performance scale itself.
      field: data.ceiling_anchor_type
      source: src-arxiv-2506-09050-v2
      quote: Human Average 1252 1257 1260 95.7 23.8 8.5 1414
    - check: "Versions (04 S4): one revision, v1, with lite as a subset of the same release by the same
        maintainer. Lite is scored on fewer private cases against rankings rebuilt for it, so its performances
        are not comparable with full-set ones; a reviewer may prefer it as a variant or a track. Short
        and long formats are recorded as subsets because both the paper and the leaderboard report them
        separately. No concurrent line exists: the leaderboard's initial version (2025-06-17, archived
        on the site) and its current version are two states of one maintainer-run board, not two editions."
      field: subsets
      source: src-arxiv-2506-09050-v2
      quote: or a newly rebuilt laderboard with only the lite version subset of test cases (for the
        lite version)
    - check: refresh static and versions frozen rest on the dataset's lastModified of 2025-06-17 and
        the leaderboard's unchanged 40 problems. What changed on Hugging Face a week after the paper
        was not read; the toolkit's v1.5.0 changed the relative-score calculation and v1.4.0 added
        judge 202510 (GitHub releases API, not a quoted Source). If either changes what a
        performance means, versioned-releases applies.

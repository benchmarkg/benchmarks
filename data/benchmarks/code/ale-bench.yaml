# data/benchmarks/code/ale-bench.yaml
#
# P1-S10-T02, code entry 12. Promotes the Epoch stub data/benchmarks/_stubs/ale-bench.yaml. Filled from the ALE-Bench
# paper, arXiv 2506.09050 read as its v2 PDF (2025-10-06, the NeurIPS 2025 Datasets and Benchmarks Track version),
# and its abstract page; the SakanaAI/ALE-Bench README and docs/evaluation.md at commit 8ba16e6 (2026-10-23);
# Hugging Face's API record of the ungated SakanaAI/ALE-Bench dataset (no file of it downloaded); the ALE-Bench
# Leaderboard page, read with scripts stripped, and the results_summary.json it renders; the v1 PDF of SEDIMA (arXiv
# 2610.02361, October 2026), a paper that reports ALE-Bench Lite results; and Epoch's benchmark export, which lists
# ALE-Bench. AtCoder's own pages (contest pages, rankings, rules) were not fetched: they name contestants. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.

id: ale-bench
name: ALE-Bench
tagline: 40 AtCoder Heuristic Contest optimisation problems; programs are scored and ranked against
  the contest's human field.
description: >
  Sakana AI's benchmark of algorithm engineering, built with AtCoder from 40 past AtCoder Heuristic Contest
  (AHC) problems held from March 2021 to April 2025: hard optimisation tasks such as routing, scheduling,
  packing and planning whose true optima are out of reach, so a solution is never right or wrong, only
  better or worse. Each problem ships with its statement (English and Japanese), a Rust scorer, the contest's
  input generator and visualisers, and the original contest's ranking data. The entrant writes a program
  (C++, Python or Rust in the mandated AtCoder 202301 judge environment) inside a timed session that mirrors
  the contest's length, about four hours for a short contest and one to two weeks for a long one; it may
  run test cases and visualise behaviour as often as it likes, and then submits once. The submission is
  run under the contest's execution limits on the original private test cases, its total score is placed
  in the contest's final human ranking, and the rank is converted into AtCoder's Elo-like performance.
  The headline is the average performance over the problems, with the share of problems above performance
  thresholds and an AtCoder rating beside it. A lite set of 10 problems is scored against rankings rebuilt
  on fewer private cases. The paper ran 22 models one-shot, four with four hours of self-refinement and
  two scaffolds; Sakana's own ALE-Agent reached the best lite result. The maintainers' live leaderboard
  (updated 2026-11-02) runs 151 models with its own sampling and self-refinement harness on the full set.
self_description:
  source: src-arxiv-2506-09050
  quote: We introduce ALE-Bench, a new benchmark for evaluating AI systems on score-based
    algorithmic programming contests.
external_ids:
  huggingface: SakanaAI/ALE-Bench
  arxiv: '2506.09050'
paper:
  title: 'ALE-Bench: A Benchmark for Long-Horizon Objective-Driven Algorithm Engineering'
  arxiv: '2506.09050'
  doi: 10.48550/arXiv.2506.09050
  version_read: v2
  source: src-arxiv-2506-09050-v2
released: 2025-06-10
released_note: The paper's first arXiv version, as its abstract page dates it, and the date Epoch's
  export and the stub carry. The repository was created on 2025-05-15 and the Hugging Face dataset
  on 2025-04-01 (src-hf-api-sakanaai-ale-bench), before the paper; the v2 read here (2025-10-06) is
  the NeurIPS version.
released_source: src-arxiv-2506-09050
released_quote: Submitted on 10 Jun 2025 (v1), last revised 6 Oct 2025 (this version, v2)
release_venue: NeurIPS 2025 Datasets and Benchmarks Track
release_venue_source: src-arxiv-2506-09050-v2
release_venue_quote: 39th Conference on Neural Information Processing Systems (NeurIPS 2025) Track
  on Datasets and Benchmarks.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: code/competitive-programming
  secondary:
    - agents-tooluse/long-horizon-autonomy
domain_basis:
  reason: The entrant writes a program, and the grader runs it on the contest's private test cases
    and scores what it computes, the code family's case. The problems are AtCoder Heuristic Contest
    problems kept under their original execution limits (2 to 10 seconds per case on a replica of
    AtCoder's environment) and ranked against the contest's own field, and the paper calls ALE-Bench
    a competitive programming benchmark. Each attempt is one unattended session as long as the
    original contest, with repeated test runs, which the secondary leaf records.
  source: src-arxiv-2506-09050-v2
  quote: Just as previous competitive programming benchmarks have served as leading indicators of
    LLM reasoning capabilities, ALE-Bench, a more challenging competitive programming benchmark, can
    fulfill a similar function.
domain_considered_and_rejected:
  - term: code/code-performance-optimization
    reason: That leaf scores making given code faster with its behaviour preserved, on speedup. Here
      no code is given, the execution limit is a fixed constraint each program must meet, and the
      score is the problem's own objective (route length, packing quality) for the output the
      program computes, not its run time.
    source: src-arxiv-2506-09050-v2
    quote: The tasks are typically CPU-bound, with execution time limits ranging from 2 to 10
      seconds per case.
  - term: code/function-synthesis
    reason: The programs are whole stdin and stdout solutions to contest problems with execution
      limits, not self-contained functions judged by unit tests.
  - term: agents-tooluse/software-agents
    reason: The entrant works from a problem statement in a sandbox with test-run and visualisation
      calls, not inside a real repository or toolchain, which the leaf's inclusion test asks for,
      and the program it writes is what is scored.
  - term: engineering-design/process-control-optimization
    reason: The problems are framed as industrial optimisation (delivery routing, crew scheduling,
      production planning), but the scored artefact is software, which engineering-design's
      exclusion test sends to code.
  - term: reasoning-general/planning
    reason: Some problems are planning problems (finding action sequences), but the benchmark
      studies algorithm engineering, not plan construction as its own subject.
capability:
  - optimization
  - autonomy
capability_basis:
  optimization:
    reason: Every problem states an objective, its score function to be maximised or minimised over
      the test cases, and systems are ranked by how well their program optimises it; no exact
      solution is known, so the score keeps rising with better optimisation.
    source: src-arxiv-2506-09050-v2
    quote: This benchmark is open-ended, in the sense that true optima are out of reach and scores
      can keep rising.
  autonomy:
    reason: The regulations forbid any human intervention once the run has started, apart from
      restarts after technical failures, and score what the unattended session submits.
    source: src-arxiv-2506-09050-v2
    quote: No human intervention or assistance is permitted after the agent has received the problem
      statement and commenced its run.
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: A session can last hours or weeks, but a failed test run or a poor version costs nothing
      at submission; only the one program submitted is scored, so an intermediate error does not
      make a top score unattainable, which the term's inclusion test asks.
  - term: self-correction
    reason: Refinement is driven by the scorer's results on public test cases, an external oracle
      the term's exclusion test rules out, and only the final submission is scored.
    source: src-arxiv-2506-09050-v2
    quote: success demands the ability to refine and improve solutions based on feedback
  - term: search-exploration
    reason: ALE-Agent and the paper's 150-trial comparison search over many candidate programs, but
      the score is the quality of the one submitted program, not how the space was traversed.
  - term: planning
    reason: Planning is one of ten problem genres in Table A1, not the benchmark's subject.

evaluation_method:
  - human-distribution-percentile
  - execution-tests
evaluation_method_basis:
  reason: The submitted program is compiled and run on the contest's private test cases under its
    time and memory limits, and each run's verdict (accepted, wrong answer, time limit exceeded) and
    score come from the problem's scorer. The total score is then ranked among the contest's actual
    human participants and turned into AtCoder's performance, so the headline locates the system in
    a measured human field.
  source: src-arxiv-2506-09050-v2
  quote: Based on the overall private evaluation score, the agent is ranked relative to the original
    human participants of the contest.
evaluation_method_considered_and_rejected:
  - term: entrant-relative-ranking
    reason: The leaderboard also ranks models by their mean AI rank across problems, which moves
      when a model is added, but that is a secondary view; performance is computed against fixed
      human rankings.
    source: src-ale-bench-leaderboard
    quote: With relative scoring, adding a new model can change the scores and rankings of existing
      entries.
  - term: domain-metric
    reason: Raw scores are each problem's own objective, not a metric standardised in a discipline,
      and they are converted into performance rather than reported as the headline.
  - term: constraint-check
    reason: A wrong answer or a broken limit can zero a case, but the program must be executed to be
      judged and the score is an objective value, not a battery of conditions.
designed_for_subjects:
  - agent-scaffold
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: The framework gives the entrant a session with test-run and visualisation actions and
    leaves the loop to it; the paper runs OpenHands and its own ALE-Agent. The paper's one-shot and
    self-refinement settings, and the leaderboard's repeated sampling with self-refinement, run
    every model through the maintainers' own loop, of which only the model varies.
  source: src-arxiv-2506-09050-v2
  quote: ALE-Bench covers evaluation from bare LLMs to scaffolded agents.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: Even the one-shot setting feeds compilation and format errors back for up to five
      generations, which is a loop the benchmark drives.
    source: src-arxiv-2506-09050-v2
    quote: If scoring failed due to errors (e.g., compilation, formatting), feedback was provided,
      allowing up to five code generations.
  - term: reasoning-model
    reason: The benchmark sets no reasoning budget. The leaderboard lists many models once per
      reasoning-effort setting, recorded in observed_subjects.
observed_subjects:
  values:
    - reasoning-model
  basis: The leaderboard's 151 rows are API and open-weight models, many listed once per
    reasoning-effort or thinking setting, such as gpt-5.4-high, gpt-5.4-medium and gpt-5.4-none,
    each at 1 to 16 self-refine steps; no scaffold row appears (read 2026-11-09).
  source: src-ale-bench-leaderboard-data
as_used:
  - protocol: ALE-Bench Lite under evolutionary search (OpenEvolve and ShinkaEvolve, with and
      without SEDIMA's memory), 100 evolution steps with one evaluated candidate each, public cases
      as fitness and private evaluation for the result, five mutation models, one run per model and
      harness; no contest time limit is stated.
    split: lite (10 problems)
    source: src-arxiv-2610-02361-v1
    quote: Each run is limited to 100 evolution steps with one evaluated child per step.
    note: SEDIMA (October 2026) itself warns that its budget is smaller than the leaderboard's, so
      its absolute scores are for matched comparisons only, and it reports average performance
      against lite's rebuilt rankings, which is not comparable with full-set performance.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced. The maintainers' leaderboard was last updated on 2026-11-02
    with new models, and papers report ALE-Bench results in October 2026, for example SEDIMA on the
    lite set.
  source: src-arxiv-2610-02361-v1
  quote: SEDIMA improves average final performance by 5.5% on AlgoTune and 6.6% on ALE-Bench LITE
    under a fixed budget of 100 evaluated candidates.
activity: no-submission-channel
activity_note: No source read gives a way for outsiders to put a result on the leaderboard; its rows
  are the maintainers' runs of models they chose, added in the repository's "Add models" releases
  (GitHub releases, read 2026-11-09, not a quoted Source). Anyone can run the toolkit and publish
  elsewhere.
activity_basis:
  reason: Every leaderboard row comes from the maintainers' own setup, repeated sampling with
    self-refinement, which the page describes, and the README and the page name no submission route.
  source: src-ale-bench-leaderboard
  quote: Self-refine x1 involved 15 sampling iterations, from which the response getting the median
    score across 50 local cases was selected.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: gpt-6-astra-max
    source: src-ale-bench-leaderboard-data
    observed_on: 2026-11-09
    quote: '"model_name":"gpt-6-astra-max"'
  - system: o4-mini-high, in the paper's self-refinement setting
    source: src-arxiv-2506-09050-v2
    observed_on: 2026-11-09
    quote: Table 3 shows that o4-mini-high performed best, achieving an average performance of 1520
      and a rating of 2104 (top 11.8% of humans).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: No answer key exists. Each problem's Rust scorer, shipped in the dataset,
  scores the program's output on the private test inputs (generated from seeds by the contest's own
  generator), and the original contest's final ranking, also shipped, converts the total score into
  a rank and a performance.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The problems, scorers, generators and ranking data are in an ungated Hugging Face dataset,
    and the toolkit and its Docker images are public, so anyone can produce a performance.
  source: src-hf-api-sakanaai-ale-bench
  quote: '"gated":false'
task:
  exists: true
  input:
    - a problem statement in Markdown, in English and Japanese, with its images and sample cases
    - the problem's input generator and Rust and web visualisers, as human contestants get them
    - a timed session offering test runs on 50 public cases (5 for lite) or on generated inputs,
      with the scorer's verdicts and scores
  output: One program in C++17, 20 or 23, Python or Rust (AtCoder's 202301 judge environment),
    submitted once for private evaluation before the contest's time limit.
  scoring: The program runs on the original contest's private test cases (for lite, the first 10% of
    them on long contests) under the problem's execution limits; the scorer's scores are summed (or
    normalised per case on some problems), ranked within the contest's final human ranking (for
    lite, a ranking rebuilt on its cases) and converted into AtCoder's performance. The headline is
    the average performance over the problems, reported with the share of problems at or above 400,
    1600, 2000 and 2400 and an AtCoder rating.
  tests_hidden_from_system: true
  tests_hidden_from_system_source: src-github-ale-bench-readme
  tests_hidden_from_system_quote: MUST NOT be accessed
  source: src-arxiv-2506-09050-v2
  quote: Performance is a score derived from a set of participants and the rank within a problem,
    using an Elo-rating-like method [18].

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The scorers and the contests' rankings ship with the public data, and the session
    object on the entrant's own machine holds the private seeds, rank_performance_map and standings,
    which the README says must not be read, so hiding them rests on the entrant's compliance. The
    dataset also holds a global ranking of 6,139 AtCoder users and the original contests' rankings,
    which were not downloaded.
  access_basis:
    reason: The whole dataset, scorers, generators and ranking data included, is on Hugging Face
      without a gate, and the toolkit computes the private evaluation locally, so anyone can compute
      a performance.
    source: src-hf-api-sakanaai-ale-bench
    quote: '"gated":false'
  refresh: static
  refresh_note: The paper says fresh problems will be added, but none has been. The dataset was last
    modified on 2025-06-17, a week after the paper (what changed was not read), and the leaderboard
    still scores the same 40 problems in November 2026. The toolkit has kept releasing (v1.0.0 to
    v1.7.0), adding the judge version 202510 and its languages in v1.4.0 and changing the
    relative-score calculation behind the AI-rank views in v1.5.0 (GitHub releases, read 2026-11-09,
    not a quoted Source); the paper's regulations fix the 202301 environment.
  refresh_basis:
    reason: The problem set released with the paper is the one still in use; no dated revision of
      the items or of the performance calculation is announced.
    source: src-hf-api-sakanaai-ale-bench
    quote: '"lastModified":"2025-06-17T05:58:33.000Z"'
  data_provenance:
    - exam-derived
  data_provenance_note: Every problem is an AtCoder Heuristic Contest problem, written by AtCoder
    for a rated contest and supplied by AtCoder officially with its scorer, generator, visualisers
    and the contest's ranking data, rather than scraped; 40 of the 49 rated contests held to May
    2025 were selected.
  data_provenance_source: src-arxiv-2506-09050-v2
  data_provenance_quote: All data are officially provided by AtCoder Inc., ensuring clear licensing
    and safe use.
  contamination_risk: medium
  contamination_risk_note: >
    Every problem was public on AtCoder before the benchmark existed (contests from March 2021 to April
    2025), and the paper concedes the problems may be in training data; any model whose training cutoff
    falls after April 2025 has every problem's publication before its cutoff. The paper's check, performance
    against contest date around each of four models' cutoffs, found no effect, and an AHC organiser found
    no plagiarism of human submissions in the 12 programs that reached 2000 performance. The regulations
    forbid browsing pages that name AtCoder, AHC or the problem, which closes the run-time route for a
    compliant entrant. No source evidences a route, so the value is medium (review_checks).
  contamination_evidence:
    - source: src-arxiv-2506-09050-v2
      stance: supports
      quote: Since the original problems are publicly available, they may have been accidentally
        included in AI training data.
    - source: src-arxiv-2506-09050-v2
      stance: against
      quote: No model exhibited notable performance changes around its cutoff, suggesting minimal
        contamination effects.
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_note: Performance has no upper bound, since optima are out of reach and scores
    can keep rising; the anchor here is the human field the paper reads results against. The
    leaderboard's per-problem views add a "human reference" built from each case's best human score,
    which is no single person's result.
  ceiling_anchor_type_basis:
    reason: The paper reads every model's average performance, threshold shares and rating against a
      Human Average row computed from AtCoder's actual contestants (users with at least five
      contests, Table A4), practising competitive programmers scored under the same protocol.
    source: src-arxiv-2506-09050-v2
    quote: Human Average 1252 1257 1260 95.7 23.8 8.5 1414
  dataset_licence: CC-BY-ND-4.0
  dataset_licence_note: The README and the Hugging Face licence tag agree; the NoDerivatives term
    limits redistributing modified problem packages. The repository's Apache-2.0 covers the code
    only.
  dataset_licence_source: src-github-ale-bench-readme
  dataset_licence_quote: Creative Commons Attribution-NoDerivatives 4.0 International License (CC
    BY-ND 4.0)
  upstream_licences: The problems, scorers, visualisers and rankings are AtCoder's contest material,
    released for the benchmark by AtCoder, which co-developed it, under the dataset's licence.
  upstream_licences_source: src-arxiv-2506-09050-v2
  upstream_licences_quote: ALE-Bench is co-developed with AtCoder, which guarantees that all data
    are fully licensed
  size:
    - count: 40
      unit: AtCoder Heuristic Contest problems (23 short-format, 17 long-format)
      subset: full version
      source: src-arxiv-2506-09050-v2
      quote: we released a dataset of 40 AHC problems on the Hugging Face platform
    - count: 10
      unit: problems (5 short-format, 5 long-format)
      subset: lite version
      source: src-arxiv-2506-09050-v2
      quote: We call the entire set of problems the full version, while we also prepared the lite
        (subset) version that contains 10 representative problems.
    - count: 50
      unit: public test cases per problem for local evaluation (5 for lite)
      subset: public evaluation
      source: src-arxiv-2506-09050-v2
      quote: '(1) Public Evaluation: execution against a predefined set of test cases (50 for the full
        version, 5 for the lite version).'
  size_note: The short and long counts are from Table A1's format column (counted 2026-11-09), and
    lite's five and five from Table A1 and SEDIMA's Table 4. Private test cases per problem are the
    original contest's, hundreds for short contests and thousands for long ones; the paper gives no
    total.
  languages:
    - C++
    - Python
    - Rust
    - English
    - Japanese

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Sakana AI, with AtCoder
  maintainer_basis:
    reason: The repository, the Hugging Face dataset and the leaderboard sit in Sakana AI's
      accounts; AtCoder co-developed the benchmark and supplied the data, and three authors are at
      AtCoder. The README adds that the repository is not an official, supported product of either
      company (review_checks).
    source: src-hf-api-sakanaai-ale-bench
    quote: '"author":"SakanaAI"'
  maintainer_type: industry-lab
  submission_process:
    - maintainer-run
  submission_process_note: The maintainers choose the models, run them through ale_bench_eval (15
    samples, the median-scoring one kept, then 1 to 16 self-refine steps) and publish the results;
    nobody submits.
  submission_process_source: src-ale-bench-leaderboard
  submission_process_quote: Self-refine x1 involved 15 sampling iterations, from which the response
    getting the median score across 50 local cases was selected.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2506-09050-v2
      quote: including ALE-Agent, which we specifically designed for ALE-Bench
  independence_flags_note: Sakana AI built ALE-Agent for the benchmark and reports it in the paper,
    where it gives the best lite result (average performance 1879 with Gemini 2.5 Pro). No Sakana
    system appears on the leaderboard, whose rows are other developers' models. AtCoder, the
    co-maintainer, organises the contests whose rankings are the scale, not an evaluated party.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The regulations require the scoring run on an Intel Xeon Platinum 8375C or an
    equivalent CPU, such as AWS C6i instances, and the README recommends c6i.32xlarge; any hardware
    may be used for development, and results on other CPUs may be reported with their
    specifications. The leaderboard reports each model's API cost.
  compute_tier_basis:
    reason: Scoring needs only CPU, in Docker images that replicate AtCoder's judge, and the models
      under test are served through their APIs.
    source: src-arxiv-2506-09050-v2
    quote: whereas ALE-Bench uses only a CPU environment and is resource-friendly
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The problems, scorers and ranking data are public, and the toolkit runs a session,
      scores the submission and computes rank and performance with no human or maintainer step.
    source: src-arxiv-2506-09050-v2
    quote: These scripts configure Amazon EC2 C6i Instances [17] to mirror the original AtCoder CPU
      environment.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: ale_bench, the SakanaAI/ALE-Bench toolkit (ale_bench.start sessions with public_eval and
    private_eval, Docker judge images per judge version), with ale_bench_eval for the leaderboard's
    repeated sampling and self-refinement (v1.2.1 linked from the leaderboard; v1.7.0 current)
  harness_source: src-github-ale-bench-readme
  harness_quote: We also provide a comprehensive framework for evaluating Large Language Models
    (LLMs) for ALE-Bench
  harness_gotcha:
    source: src-github-ale-bench-evaluation-doc
    quote: Judge toolchain version (`201907`, `202301`, `202510`)
  harness_gotcha_note: The paper's regulations mandate the 202301 judge environment for every
    problem, and it is the toolkit's default, but since v1.4.0 the toolkit also offers 202510 with
    new languages (TypeScript, Go, Lean and others), which the evaluation documentation's full-run
    example uses. A score must name its judge version and language; one on 202510 is outside the
    paper's protocol.
  code_licence: Apache-2.0
  code_licence_source: src-github-ale-bench-readme
  code_licence_quote: The code in this GitHub repository is licensed under the Apache License 2.0.
  runnable_via:
    - custom
  runnable_via_note: Inspect Evals has no ALE-Bench task (its src/inspect_evals listing at main,
    read 2026-11-09 through GitHub's API). The toolkit also ships an MCP server. Other harnesses
    were not checked.
  maintainer_rerun_policy: unstated

comparability:
  # (execution-tests, agent-scaffold) resolves the agentic profile: shots, chain_of_thought, reasoning_effort,
  # tools_allowed, retries_allowed, subset_used (full or lite, whose performances are against different rankings),
  # scaffold, harness, selection_strategy, n_samples and sandbox. The judge version and the code language have no
  # field and go in `harness` with the toolkit version (C++20 on 202301 is the paper's and the leaderboard's
  # setting). Added: the session's time limit (wall_clock_hours; the paper ran four hours, the regulations allow
  # the contest's length), the scoring CPU (hardware; results on non-C6i hardware may not compare), and the number
  # of self-refine steps (max_steps; the leaderboard reports 1, 2, 4, 8 and 16), which with n_samples (15 on the
  # leaderboard) separates the leaderboard's numbers from the paper's one-shot and four-hour runs.
  material_extra:
    - wall_clock_hours
    - hardware
    - max_steps
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The headline is the average performance over the problems, which the paper recommends over
    the AtCoder rating; the rating and the threshold shares are reported beside it.
  source: src-arxiv-2506-09050-v2
  quote: For evaluating AI systems, we strongly recommend using average performance as defined
    above.

homepage: https://github.com/SakanaAI/ALE-Bench
repository: https://github.com/SakanaAI/ALE-Bench
dataset_url: https://huggingface.co/datasets/SakanaAI/ALE-Bench
leaderboard_url: https://sakanaai.github.io/ALE-Bench-Leaderboard/

versions:
  - version: v1
    label: ALE-Bench, the 40-problem release of June 2025
    version_kind: revision
    released: 2025-06-10
    items: 40
    changes: The release of the paper, the dataset and the toolkit, with problems from contests held
      up to April 2025. No problem has been added or changed since; the toolkit's later releases
      change the harness, not the items.
    frozen: true
    sources:
      - src-arxiv-2506-09050-v2
      - src-hf-api-sakanaai-ale-bench

subsets:
  - id: ale-bench#lite
    label: ALE-Bench Lite
    items: 10
    scored_separately: true
    evidence:
      - source: src-arxiv-2506-09050-v2
        quote: These problems were selected to have relatively high difficulty and cover a diverse

curation:
  added_by: agent (P1-S10-T02)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2506-09050-v2
    - src-arxiv-2506-09050
    - src-github-ale-bench-readme

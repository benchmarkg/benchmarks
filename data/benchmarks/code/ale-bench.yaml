      source: src-hf-api-sakanaai-ale-bench
      quote: '"lastModified":"2025-06-17T05:58:33.000Z"'
    - check: contamination_risk medium. Every problem predates every leaderboard model's cutoff, and
        the paper's null result covers four models and a date-versus-cutoff plot, not a memorisation

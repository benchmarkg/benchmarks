lineage:
  role: root
  role_note: No verified, lite, held-out or private line of GSO exists in any source read; one
    public set of 102 tasks is the only set, and the paper's Python-only and non-Python splits are
    an analysis, not separately released subsets. SWE-Perf and SWE-fficiency, which the audit
    compares with GSO, are other maintainers' benchmarks built independently, not forks. The audit's
    39 replay-valid tasks are a third party's diagnostic, not a released variant.


curation:
  added_by: agent (P1-S10-T02)
  added_on: 2026-11-09
  last_verified: 2026-11-09
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2506-23719-v1
    - src-arxiv-2506-23719
    - src-hf-blog-dabstep
    - src-hf-api-dabstep
    - src-hf-dabstep-tasks-all
    - src-hf-dabstep-tasks-dev
    - src-hf-dabstep-task-scores-o4-mini
    - src-hf-dabstep-space-content
    - src-hf-dabstep-space-leaderboard
    - src-hf-dabstep-space-scorer
    - src-hf-dabstep-leaderboard-config
    - src-arxiv-2509-21825-v4
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date and abstract;
    the Hugging Face launch post; the dataset's API record (ungated; no terms exist to accept), its task
    list, dev set and one maintainer baseline's task_scores file at commit 73c12f6; the Space's
    content.py, leaderboard.py and scorer.py raw at commit d4431c2; the running Space's /config JSON
    for the two leaderboard tables, the board itself being rendered by Gradio; and DS-STAR's v4 PDF (a
    DOI) as evidence of current use. The private adyen/DABstep-internal dataset was not, and cannot
    be, read.
  confidence: medium
  review_checks:
    - check: maintainer-competes-on-own-benchmark rests on the maintainers' own baseline rows, ReAct
        and reasoning-prompt agents over third-party models in Hugging Face's smolagents library,
        not on a model of their own. The flag's definition (the maintainer submits systems evaluated
        by it) fits the rows literally; a reviewer may hold that baselines are not competing
        entries.
      field: governance.independence_flags
      source: src-hf-dabstep-leaderboard-config
      quote: '["**Claude 4 Sonnet ReACT Baseline**",81.94,19.84,"Hugging Face"'
    - check: Candidate choice for code/data-science-workflows. DABstep was chosen over DSBench (its
        data-analysis half is ModelOff spreadsheet questions graded in part by a GPT-4 judge, and
        its modelling half is Kaggle-style, closer to ml-engineering), DA-Code (it also scores
        computed outputs, and DS-STAR reports on it, but its own board was not checked here, and
        many of its outputs are charts and model predictions, nearer ml-engineering), DS-1000
        (completions of StackOverflow snippets judged by tests, which is function-synthesis), and
        BLADE (it scores analysis decisions against expert ones, not a quantitative answer).
        DiscoveryBench was set aside as instructed. Its grader checks only the final answer, so the
        code exclusion ("code is the means to a result in another field") was weighed; the answer is
        what the agent's analysis computes, the inclusion test's own case, and the claim is data
        analysis, not finance.
      field: domain
      source: src-arxiv-2506-23719
      quote: requiring models to combine code-based data processing with contextual reasoning over
        heterogeneous documentation
    - check: The leaf asks for an analysis "over real data". The paper calls the tasks real-world
        and the payments data anonymised transactions; the launch post's footnote says the data and
        the business context were generated synthetically. data_provenance records the questions
        only. Which description holds, and how the data were generated, needs the maintainers. The
        missing term for data synthesised by an unstated method is logged as
        taxonomy/_failures/2026-11-09-dabstep-002.
      field: data.data_provenance
      source: src-hf-blog-dabstep
      quote: Tasks are realistic, the data has been generated synthetically.
    - check: contamination_risk is medium, lowered in review from the draft's high, because the leak
        routes are read from the files rather than stated by a source. The task_scores split shows
        each submission's answer beside its verdict, so every answer marked true is a scored key in
        public (o4-mini's file alone marks 110 correct), and six dev answers are scored questions.
        15 unvalidated rows score 100% on both levels, the first on 2025-12-12. High is the
        alternative if a reviewer takes the public keys as enough.
      field: data.contamination_risk
      source: src-hf-dabstep-leaderboard-config
      quote: '["**openGauss Data Agent**",100.0,100.0,"Agent of openGauss'
    - check: lifecycle under-revision rests on the 2026-07-22 notice of a v2 "in the coming weeks",
        which had not appeared by 2026-11-09. Whether v2 reissues these questions (under-revision)
        or adds a new set beside a finished v1, and whether it will be its own entry, is not known;
        active is the alternative if the v2 work has stopped.
      field: lifecycle
      source: src-hf-dabstep-space-content
      quote: With DABStep-v2 launching in the coming weeks, we are no longer accepting new
        validation requests.
    - check: Saturation. The validated top is 89.95% Hard and 87.5% Easy (2026-02-22), below the
        0.95 headroom line, while the open tab has rows at 100%. Which board measures headroom, and
        whether the unvalidated rows should count, needs a ruling; the launch post expected the
        benchmark to be solved in its current state.
      field: lifecycle
      source: src-hf-blog-dabstep
      quote: we foresee that the benchmark will eventually be considered solved in its current state
    - check: data.refresh is unset. The Space's commit list shows a commit fixing the evaluation and
        the scorer test on 2025-04-20, after launch, which would rule out static if it changed
        verdicts, and no version label marks it; the commit diff was not read.
      field: data.refresh
    - check: The paper's scorer description (Levenshtein, a 1e-2 tolerance in Algorithm 1) differs
        from the code, which also accepts a one-word answer that is a subset of the key or the
        reverse; exact-match is tagged beside numeric-tolerance-match although fuzzy and subset
        matching go beyond its whitespace-or-case normalisation
        (taxonomy/_failures/2026-11-09-dabstep-001).
      field: evaluation_method
      source: src-hf-dabstep-space-scorer
      quote: return set(words1).issubset(set(words2)) or set(words2).issubset(set(words1))
    - check: submission_process lists maintainer-verified for the Validated tab, which is now
        frozen, beside held-out-server for the open route. Whether a frozen validation record should
        still be tagged, or recorded in history only, is a modelling call.
      field: governance.submission_process
    - check: The secondary leaf society-econ-law/financial-analysis is defined over financial
        documents and statements; DABstep's material is payment transactions, fee tables and a
        processing manual. It may not fit, in which case no secondary applies.
      field: domain
    - check: Lineage. DS-STAR evaluates on DABStep-Research (Zhang et al., 2025), a
        report-generation suite whose name suggests it derives from DABstep; its maintainer and
        relation were not read, so no fork is recorded. The paper's own size statement ("the
        majority" of tasks hidden) also differs from the Space, which scores all 450.
      field: lineage
      source: src-arxiv-2509-21825-v4
      quote: DABStep-Research (Zhang et al., 2025) to evaluate open-ended report generation

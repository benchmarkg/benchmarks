# data/benchmarks/agents-tooluse/apex-agents.yaml
#
# P1-S9-T02, agents-tooluse entry 14. Promotes the Epoch stub data/benchmarks/_stubs/apex-agents.yaml. Filled from
# the APEX-Agents paper, arXiv 2601.14242 read as its v3 PDF (2026-02-23), and its abstract page; Mercor's two
# announcements, "Introducing APEX-Agents" (2026-01-21) and "Introducing APEX-Agents 1.1" (2026-09-08), read after
# mercor.com's robots.txt with scripts and styles stripped; the leaderboard page on mercor.com, read whole with the
# Next.js page data embedded in it (robots.txt disallows /_next/data/, so the JSON route was not fetched); Hugging
# Face's API records for the gated mercor/apex-agents and mercor/apex-agents-v1.1 datasets (no terms accepted, no
# file downloaded); the READMEs of Mercor-Intelligence/archipelago and of the 1.1 reference agent at pinned
# commits, with GitHub's API for licence and dates; and Epoch's ECI documentation and benchmark export, which list
# APEX-Agents as a creator-administered benchmark. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.

id: apex-agents
name: APEX-Agents
aliases:
  - AI Productivity Index for Agents
  - APEX-Agents 1.1
tagline: Agents do 1-2 hour banking, consulting and legal tasks through nine workplace apps; an LM
  judge applies expert rubrics.
description: >
  Mercor's agentic member of its AI Productivity Index (APEX). Investment banking analysts, management
  consultants and corporate lawyers built 33 "worlds", each a project scenario played out over 5-10 days
  in role, leaving an average of 166 files, and then wrote 480 tasks against them (160 per job) that professionals
  estimate take one to two hours. An agent receives one single-turn prompt and works in the world through
  nine applications exposed as 63 MCP tools (calendar, chat, code execution, documents, file system, mail,
  PDFs, spreadsheets, presentations; two banking worlds add market-data apps), with web search off. Most
  tasks ask for a message to the console; 58 ask for a created or edited spreadsheet, document or presentation.
  Each task has 1 to 10 expert-written pass/fail criteria, and a judge model grades each against the output
  and a log of the changes the agent made, without the trajectory. Pass@1, the leaderboard metric in the
  paper, is the share of tasks whose every criterion is met, averaged over eight runs; the mean share
  of criteria met is also reported. Mercor runs every model itself in its own agent loop. APEX-Agents
  1.1 (September 2026) cut the set to 240 refined tasks in 31 worlds, changed the judge and penalises
  hedged "scattergun" answers; the leaderboard now reports 1.1. The data is on Hugging Face under CC-BY-4.0
  behind a click-through gate, and the Archipelago harness is open source.
self_description:
  source: src-arxiv-2601-14242
  quote: We introduce the AI Productivity Index for Agents (APEX-Agents), a benchmark for assessing
    whether AI agents can execute long-horizon, cross-application tasks created by investment
    banking analysts, management consultants, and corporate lawyers.
external_ids:
  arxiv: '2601.14242'
paper:
  title: APEX-Agents
  arxiv: '2601.14242'
  doi: 10.48550/arXiv.2601.14242
  version_read: v3
  source: src-arxiv-2601-14242-v3
released: 2026-01-20
released_note: The paper's first arXiv version, as its abstract page dates it. Mercor's announcement
  is dated the next day, 2026-01-21, which is the date Epoch's export and the stub carry; the
  Hugging Face dataset record was created on 2026-01-14, before either.
released_source: src-arxiv-2601-14242
released_quote: Submitted on 20 Jan 2026 (v1), last revised 23 Feb 2026 (this version, v3)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: agents-tooluse/tool-api-calling
  primary_basis:
    reason: One agent completes each task only by invoking the world's applications as MCP tools
      (reading files, spreadsheets, PDFs, mail and chat, running code, writing documents), and the
      grader checks the result it returned or the files it left -- the family's inclusion case. Tool
      calls against the apps' backends are the only interface; there is no screen, browser or shell.
    source: src-arxiv-2601-14242-v3
    quote: 'Each world has nine applications, comprising 63 tools: Calendar, Chat, Code Execution, Documents,
      File system, Mail, PDFs, Spreadsheets, and Presentations.'
  secondary:
    - agents-tooluse/long-horizon-autonomy
    - society-econ-law/economically-valuable-work
  secondary_basis:
    reason: long-horizon-autonomy for the one-to-two-hour unattended episodes (up to 250 steps),
      which that leaf's own distinction puts second to the interface. economically-valuable-work
      because the tasks are drawn from three paid occupations and the maintainer frames the
      benchmark as a measure of economically valuable work; it is not primary (see
      domain_considered_and_rejected).
    source: src-arxiv-2601-14242-v3
    quote: Tasks are complex and, on average, experienced professionals estimated they take 1–2
      hours to complete.
domain_considered_and_rejected:
  - term: society-econ-law/financial-analysis
    reason: The family society-econ-law was considered first as primary, through this leaf and
      legal-document for the banking and law thirds and economically-valuable-work for the whole.
      The tasks come from real occupations and Mercor calls the result a measure of economically
      valuable work, but the family's exclusion leaves out a benchmark whose subject is autonomous
      operation rather than the economic value of the output, and economically-valuable-work is
      defined by expert comparison against human work product (GDPval, the Remote Labor Index). Here
      an LM judge checks must-have criteria on what a tool-using agent returned, no output is
      compared with a professional's, and the paper places itself among agentic evaluations.
      economically-valuable-work is kept as a secondary; financial analysis and legal documents are
      the material of two job subsets, not the scored subject.
    source: src-arxiv-2601-14242-v3
    quote: existing agentic evals have a large sim-to-real gap, and do not capture how professionals
      work day-to-day
  - term: agents-tooluse/computer-use-gui
    reason: The applications are MCP servers behind a gateway, not desktop software operated through
      screenshots, mouse and keyboard.
    source: src-github-archipelago-readme
    quote: Archipelago is a system for running and evaluating AI agents against MCP applications.
  - term: agents-tooluse/research-agents
    reason: Every file a task needs is inside the world and web search is off, so nothing is
      gathered or cited from outside.
    source: src-arxiv-2601-14242-v3
    quote: Web search is turned off for the benchmark to keep evaluations reproducible.
  - term: agents-tooluse/operating-system-tasks
    reason: The file system and code execution are two of the nine apps, reached as tools; no shell
      or machine end state is the target.
  - term: general-intelligence/agi-composite-suites
    reason: Three professional jobs inside one tool-use protocol, not a battery spanning families.

capability:
  - tool-use
  - context-integration
  - autonomy
  - reliability-consistency
capability_basis:
  tool-use:
    reason: The prompt names the output, but the inputs sit in the world's files and apps, reachable
      only through the tools; a wrong file, a misread spreadsheet tab or a failed edit leaves the
      output failing its criteria.
    source: src-arxiv-2601-14242-v3
    quote: Each task is provided as a single-turn prompt and can only be executed by using the
      in-world files and applications.
  context-integration:
    reason: The world supplies every file the answer depends on, and 1.1 moved clarifying
      preferences into the world's mail, chat and documents for the agent to find.
    source: src-arxiv-2601-14242-v3
    quote: To maintain validity, worlds contain all files required to execute tasks.
  autonomy:
    reason: The shared system prompt forbids asking for help, and the agent runs until it calls its
      final answer tool or hits the step cap.
    source: src-arxiv-2601-14242-v3
    quote: You cannot ask for help or further clarification.
  reliability-consistency:
    reason: Each task is run eight times (four on the 1.1 board), and the paper reports Pass^8,
      whether every attempt passes, beside Pass@1; the 1.1 announcement compares Pass@4 with Pass^4.
    source: src-arxiv-2601-14242-v3
    quote: We also report Pass^8, which assesses consistency by measuring whether the agent produces
      a correct output on every attempt out of eight.
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: Tasks take professionals one to two hours and agents up to 250 steps, and single-value
      answers depend on many intermediate values, but no source shows that an intermediate error
      cannot be recovered by later steps; reads and recalculations can be repeated (see
      review_checks).
    source: src-arxiv-2601-14242-v3
    quote: These single value outputs can only be achieved by meeting many constraints and updating
      numerous intermediary values.
  - term: planning
    reason: The paper says the tasks require planning over long horizons, but the score is the
      quality of the returned message or file, which planning's exclusion covers.
    source: src-arxiv-2601-14242-v3
    quote: The tasks were created by investment banking analysts, management consultants, and
      corporate lawyers, and require agents to reason, demonstrate advanced knowledge, use multiple
      applications, and plan over long horizons.
  - term: knowledge-recall
    reason: Advanced professional knowledge is needed on the way, but the facts that decide each
      answer are in the world's files, which the term's exclusion covers.
  - term: quantitative-reasoning
    reason: Many banking tasks end in a computed value (a DCF, a P/E ratio), but the agent has a
      code execution tool and the criteria score the professional output, not mathematical reasoning
      as such.
  - term: honesty
    reason: 1.1 scores hedged multi-answer responses as zero, but that enforces committing to the
      well-specified answer; no criterion rewards admitting uncertainty.
    source: src-mercor-blog-apex-agents-1-1
    quote: Most notably, APEX-Agents 1.1 no longer rewards noncommittal answers.

evaluation_method:
  - rubric-graded
  - model-graded-judge
evaluation_method_note: Each task's 1 to 10 binary criteria (mean 4.06 in 1.0) are graded one at a
  time. The 1.0 judge is Gemini 3 Flash with thinking set to low; it sees the prompt, the agent's
  output and a log of the changes its actions made, not the trajectory, and an auxiliary judge picks
  the artefact each criterion targets, with file contents extracted by Reducto. On 98.5% agreement
  with 747 expert labels the paper reads differences under one point cautiously. 1.1 replaced the
  judge with DeepSeek-v4-Flash-0731 at temperature 0.1, with a GEPA-optimised prompt that scores
  scattergunned criteria zero; its false negative rate rose from 5.3% to 8.0%.
evaluation_method_basis:
  reason: Named criteria are checked individually and combined (all must pass for Pass@1, their
    share for the mean score), and a judge model applies them, so the entry takes both terms, as
    rubric-graded's own distinction asks.
  source: src-arxiv-2601-14242-v3
  quote: with each criterion graded independently by a judge model.
evaluation_method_considered_and_rejected:
  - term: environment-state-check
    reason: Archipelago diffs before-and-after snapshots of the world, but only to find the artefact
      to grade; the verdict is a judge model's reading of the returned message or file against the
      criteria, not a program inspecting state.
    source: src-arxiv-2601-14242-v3
    quote: a Grading system that evaluates agent outputs by comparing before-and-after snapshots of
      the world, using verifiers.
  - term: exact-match
    reason: Many banking criteria check a single value, but the judge decides each criterion;
      nothing is string-matched.
  - term: human-expert-eval
    reason: Experts wrote the rubrics and gold outputs and labelled 747 criterion grades to validate
      the judge; no benchmark score comes from them.
    source: src-arxiv-2601-14242-v3
    quote: Accuracy is 98.5%, precision is 96.7%, recall is 98.1%, and Positive-class F1 is 97.4%.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Mercor runs every model inside its own loop agent with one system prompt and toolbelt (a
    ReAct toolbelt in the paper, the loop_truncated_tools_agent on the 1.1 board, its only harness),
    and each row names a model and its reasoning effort.
  source: src-mercor-apex-agents-leaderboard
  quote: '"availableHarnesses":[{"label":"Loop","value":"loop_truncated_tools_agent"}]'
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: Archipelago's agent registry takes other agents, but no leaderboard row varies the loop;
      the paper says it tuned one system prompt for all agents.
    source: src-arxiv-2601-14242-v3
    quote: We lightly optimized the system prompt used by the agents to help them execute tasks.
  - term: hosted-inference-endpoint
    reason: The models are called through their providers' APIs, with each model's settings listed
      in the paper (Table 9), so the endpoint is the delivery path for a specified model, which the
      term's exclusion covers.
    source: src-arxiv-2601-14242-v3
    quote: Outputs are collected from closed-source models via their respective APIs.
  - term: human-expert
    reason: Experts executed 96 tasks in a baselining study, which measured the time they took and
      the rubrics' fairness; no expert score is reported or ranked.
    source: src-arxiv-2601-14242-v3
    quote: For 20% of the tasks (n = 96), experts who had not created or reviewed them independently
      executed them from scratch.

lifecycle: active
lifecycle_basis:
  reason: Mercor re-issued the benchmark as 1.1 in September 2026 and keeps a leaderboard on it,
    which lists models released up to September 2026; the 1.1 dataset was last modified on
    2026-10-06 and Archipelago was last pushed on 2026-11-01 (GitHub API).
  source: src-mercor-blog-apex-agents-1-1
  quote: Claude Fable 5.1 remains on top of the leaderboard with 68.6% on Pass@1
activity: no-submission-channel
activity_note: Mercor decides which models to run and runs them; the page offers no submission
  route, only a sales contact. Anyone can run the open data with the released harness and publish
  elsewhere.
activity_basis:
  reason: New models are added by the maintainer when they ship.
  source: src-mercor-apex-agents-leaderboard
  quote: New models are evaluated on APEX-Agents, APEX-SWE, APEX-Accounting and APEX-1 when they
    ship.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Fable 5.1 (max effort)
    source: src-mercor-apex-agents-leaderboard
    observed_on: 2026-11-04
    quote: '"modelId":"claude-fable-5.1","modelName":"Fable 5.1"'
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: The rubrics and gold outputs are written and checked by professionals; the judge applies
    the criteria, it does not define them.
  source: src-arxiv-2601-14242-v3
  quote: Experts manually graded gold outputs against the rubric when creating them, ensuring
    prompt–rubric alignment.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The tasks, rubrics, gold outputs and world files are released, with the harness that runs
    and grades them; a run needs API access to the agent's model, the judge model and Reducto, and
    the judge is not deterministic. The leaderboard's FAQ says only an open subset is reproducible
    (see review_checks).
  source: src-arxiv-2601-14242
  quote: We open source the APEX-Agents benchmark (n=480) with all prompts, rubrics, gold outputs,
    files, and metadata.

task:
  exists: true
  input:
    - a single-turn prompt naming the required output, such as a value to report or a spreadsheet,
      document or presentation to create or edit
    - a world of about 166 files and nine applications exposed as MCP tools, with the shared system
      prompt
  output: Tool calls step by step, ending with a final-answer call that returns a console message,
    and for 58 of the 480 tasks a created or edited file.
  scoring: Each criterion is graded Met or Not met by the judge; a run passes when all of its task's
    criteria are met. Pass@1 is the task-uniform mean of per-task pass rates over eight runs (four
    on the 1.1 board), with bootstrap confidence intervals; the mean share of criteria met is
    reported beside it, with Pass@8 and Pass^8. A run over 250 steps fails.
  source: src-arxiv-2601-14242-v3
  quote: We collect 8 trajectories for each agent–task pair, and score each trajectory as pass or
    fail.

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: Both datasets (mercor/apex-agents for 1.0, mercor/apex-agents-v1.1 for 1.1) are
    public on Hugging Face behind an automatic click-through gate and carry the tasks, rubrics and
    world files; 1.0 also carries the gold outputs. The 1.1 reference agent also loads the tasks
    from Harbor Hub, whose gate was not read. The leaderboard's FAQ says the full task set stays
    private and that results can be reproduced on the open subset, which the 1.1 announcement and
    dataset card (240 tasks, as on the board) do not bear out (see review_checks).
  access_basis:
    reason: The current edition's only official copy read is gated by click-through acceptance, and
      the leaderboard's 240 tasks are the 240 the card lists.
    source: src-hf-api-mercor-apex-agents-v1-1
    quote: '"gated":"auto"'
  refresh: versioned-releases
  refresh_basis:
    reason: The tasks, worlds, judge and tools were revised under a new version, 1.1, in September
      2026, and its dataset revision is tagged 1.1.1.
    source: src-mercor-blog-apex-agents-1-1
    quote: updated our benchmark with task specifications, tooling, and environments to ensure
      leaderboard accuracy.
  data_provenance:
    - expert-authored
  data_provenance_note: 256 professionals from Mercor's marketplace (mean 12.9 years' experience)
    built the worlds in role, wrote the tasks, rubrics and gold outputs, and reviewed them; while
    writing tasks they could draw outputs from frontier agents to iterate against. Of the 33 worlds,
    22 use fictional entities and 11 place real companies in fictional scenarios.
  data_provenance_basis:
    reason: The worlds, tasks and rubrics are the experts' own work.
    source: src-arxiv-2601-14242-v3
    quote: 256 experts contributed to APEX–Agents, sourced from Mercor
  data_provenance_source: src-arxiv-2601-14242-v3
  data_provenance_quote: Of the 33 worlds, 22 involve entirely fictional entities, 9 involve real
    companies placed in fictional scenarios
  contamination_risk: medium
  contamination_risk_note: >
    The tasks, rubrics and (for 1.0) gold outputs have been downloadable since January 2026 behind only
    a click-through, so a route into training data is plausible; no source evidences one, and no canary
    string was seen in the records read. The FAQ's reason for a private task set names the risk, and Mercor
    also licenses training datasets built by the same expert network to model developers.
  contamination_risk_source: src-mercor-apex-agents-leaderboard
  contamination_risk_quote: The full task set stays private so that models can't be trained on it.
  contamination_evidence: []
  ceiling_anchor_type: measured-ceiling
  ceiling_anchor_type_note: The judge, run over all 480 gold outputs after the benchmark was
    finalised, graded every criterion as met, so 100% is shown reachable on 1.0. No equivalent check
    is reported for 1.1. The expert baselining study measured time and rubric fairness, not a score.
  ceiling_anchor_type_source: src-arxiv-2601-14242-v3
  ceiling_anchor_type_quote: After the benchmark was finalized, we ran the judge model over the n =
    480 gold outputs and it graded all of the associated criteria correctly.
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The licence tag of both Hugging Face datasets; the January announcement and
    the paper also say CC-BY.
  dataset_licence_source: src-hf-api-mercor-apex-agents-v1-1
  dataset_licence_quote: license:cc-by-4.0
  size:
    - count: 480
      unit: tasks
      subset: APEX-Agents 1.0 (33 worlds)
      source: src-arxiv-2601-14242-v3
      quote: APEX–Agents contains 480 tasks, split across 33 worlds.
    - count: 240
      unit: tasks
      subset: APEX-Agents 1.1 (31 worlds), the current leaderboard
      source: src-mercor-apex-agents-leaderboard
      quote: There are 31 worlds in APEX-agents, comprising 240 tasks and grading rubrics.
    - count: 160
      unit: tasks per job
      subset: 1.0, each of investment banking, management consulting and corporate law
      source: src-arxiv-2601-14242-v3
      quote: Tasks are split evenly across the three jobs (n = 160 each).
    - count: 80
      unit: tasks per job
      subset: APEX-Agents 1.1, each job
      source: src-hf-api-mercor-apex-agents-v1-1
      quote: 'Tasks: 240 total (80 per job category)'
    - count: 63
      unit: MCP tools across nine applications
      subset: each world (two banking worlds add market-data applications)
      source: src-arxiv-2601-14242-v3
      quote: 'Each world has nine applications, comprising 63 tools: Calendar, Chat, Code Execution, Documents,
        File system, Mail, PDFs, Spreadsheets, and Presentations.'
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Mercor (Mercor Research)
  maintainer_basis:
    reason: Mercor holds both datasets (the mercor namespace on Hugging Face), the harness
      repositories (Mercor-Intelligence on GitHub) and the leaderboard, every paper author is at
      Mercor, and the page's structured data names it as creator.
    source: src-mercor-apex-agents-leaderboard
    quote: '"creator":{"@type":"Organization","name":"Mercor"'
  maintainer_type: industry-lab
  submission_process:
    - maintainer-run
  submission_process_note: Mercor selects the models, runs them in its own harness (eight runs per
    task in the paper, about four on the 1.1 board, whose rows report n_samples of about 960),
    grades them and publishes Pass@1 and mean score with standard errors. During the 1.1 update it
    removed or withheld scores of models that scattergunned.
  submission_process_source: src-mercor-blog-apex-agents-1-1
  submission_process_quote: During our updates, we removed scores from the APEX-Agents leaderboard,
    or did not publish them, for models that engaged in this behavior.
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-arxiv-2601-14242-v3
      quote: Gemini 3 Flash serves as the judge model and is also evaluated on the leaderboard,
        creating a risk of self-preference.
  independence_flags_note: The 1.0 judge, Gemini 3 Flash, was also the top-ranked agent; the paper
    measures one false positive in 84 of its criteria. The 1.1 judge, DeepSeek-v4-Flash-0731, comes
    from a developer whose DeepSeek-V4.1-Flash models are ranked on the board. Mercor builds no
    evaluated model, and its named collaborators (Box, Harvey) have no ranked system, so
    maintainer-competes and funded-by-evaluated-party are not set. Mercor sells expert data and
    licenses training datasets built by the same expert network, plausibly to the developers it
    ranks; no term names that, and no source read says it sells evaluations.
  independence_assessed: true
  known_limitation:
    source: src-mercor-blog-apex-agents-1-1
    quote: Since APEX-Agents grades using binary rubric items that only check for inclusion of
      correct information, models that scattergun generally gain an advantage.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The environment, agent runner and grader are Docker containers on ordinary
    machines; the cost of a run is the agent's and the judge's model calls, plus Reducto's file
    extraction. The 1.1 agent allows 10,800 seconds per task.
  compute_tier_source: src-github-archipelago-readme
  compute_tier_quote: All components run in Docker containers.
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: Scoring needs a hosted judge model (Gemini 3 Flash for 1.0,
    DeepSeek-v4-Flash-0731 for 1.1) and the hosted Reducto service, so official scores can be
    recomputed only while both are served; the vocabulary has no blocker for a hosted judge, so
    blockers are left empty.
  reproducibility_tier_basis:
    reason: The data and Archipelago are open, and a task runs end to end (environment, agent,
      snapshot, grading) without a human step.
    source: src-arxiv-2601-14242
    quote: We also open source Archipelago, our infrastructure for agent execution and evaluation.
  harness_availability: official-harness
  harness: Archipelago (environment, agent runner and grading); for 1.1, the
    apex_loop_truncated_tools_agent run with Harbor 0.20.0
  harness_source: src-github-apex-loop-agent-readme
  harness_quote: This repository contains the reference agent implementation for APEX-Agents 1.1.
  harness_gotcha:
    source: src-github-apex-loop-agent-readme
    quote: When it is unset, the model runs with provider defaults (for Claude, without extended
      thinking).
  harness_gotcha_note: The leaderboard's reasoning settings must be passed by hand in
    APEX_MODEL_EXTRA_ARGS; without them a rerun scores a different configuration from the board's
    row. The 1.1 agent also defaults to 100 steps and truncates tool output to 200 lines or 32K
    characters, where the paper's runs allowed 250 steps.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for Mercor-Intelligence/archipelago and for
    apex_loop_truncated_tools_agent, read 2026-11-04; not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile ((rubric-graded, model-in-benchmark-harness) and (model-graded-judge,
  # model-in-benchmark-harness) have no profile): the harness and its version (the paper's ReAct toolbelt or 1.1's
  # loop agent), the step cap (250 in the paper, 100 by default in 1.1), the reasoning effort the board lists per
  # row, the number of runs per task (8 or 4), and the judge, its version and prompt (Gemini 3 Flash for 1.0;
  # DeepSeek-v4-Flash-0731 with a GEPA-optimised prompt for 1.1) with the rubric version. The version (1.0 or 1.1)
  # is subset_used, already in the fallback.
  material_extra:
    - harness
    - max_steps
    - reasoning_effort
    - n_samples
    - judge_model
    - judge_model_version
    - judge_prompt_hash
    - grading_rubric_ref

aggregation_policy: official-aggregate
aggregation_policy_note: The paper and the 1.1 announcement rank by Pass@1; the leaderboard page's
  FAQ calls Mean Score its primary ranking metric (see review_checks).
aggregation_policy_basis:
  reason: One headline over all tasks, with per-job breakdowns published beside it.
  source: src-arxiv-2601-14242-v3
  quote: The APEX–Agents leaderboard uses Pass@1

homepage: https://www.mercor.com/apex/apex-agents-leaderboard/
repository: https://github.com/Mercor-Intelligence/archipelago
leaderboard_url: https://www.mercor.com/apex/apex-agents-leaderboard/

versions:
  - version: '1.0'
    label: APEX-Agents, the paper's release
    version_kind: revision
    released: 2026-01-20
    items: 480

  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, its windows kept clear of the author list,
    the contact address and the reference list; its abstract page for the dates and abstract; both Mercor
    announcements with scripts and styles stripped; the leaderboard page read whole as text so that its
    embedded page data (68 rows) is in the extract; the Hugging Face API records of both gated datasets;
    the Archipelago and 1.1 agent READMEs at pinned commits; and Epoch's ECI documentation and export,
    which list APEX-Agents as administered by its creator, as evidence of current use. The Hugging Face
    dataset cards themselves, the Harbor Hub registry and the per-job leaderboard pages were not read.
  confidence: medium
  review_checks:
    - check: Family. society-econ-law/economically-valuable-work was weighed as primary, because the
        tasks come from paid occupations and Mercor frames the index as measuring economically
        valuable work (the Remote Labor Index, an agentic benchmark, is that family's example). The
        entry follows the leaf's definition (expert comparison against human work product) and the
        family's exclusion for autonomous operation, and keeps it secondary. A reviewer may read
        "the quality of completed work" the other way.
      field: domain
      source: src-mercor-blog-apex-agents-1-1
      quote: The Mercor Research team is confident that this revised benchmark better measures how
        models can conduct economically valuable work.
    - check: Subdomain. tool-api-calling is primary because the MCP tools are the only interface;
        but its inclusion test speaks of selecting and invoking APIs correctly, while the score is
        the output's quality. long-horizon-autonomy as primary (PaperBench's reading, and the Epoch
        recon's for The Agent Company) is the alternative.
      field: domain
    - check: data.access gated-registration rests on the 1.1 dataset's click-through gate. The
        leaderboard's FAQ says the full task set stays private and results are reproducible only on
        the open subset, which would make it private-test-server, but the 1.1 announcement and card
        give the same 240 tasks as the board. Harbor Hub's copy was not read.
      field: data.access
      source: src-mercor-apex-agents-leaderboard
      quote: Yes, on the open subset.
    - check: The headline metric. The paper and the 1.1 announcement rank by Pass@1, which Epoch
        also records; the leaderboard's FAQ calls Mean Score the primary ranking metric. No
        headline_metric or Metric record is written here.
      field: aggregation_policy
      source: src-mercor-apex-agents-leaderboard
      quote: It is the primary metric used to rank the APEX-Agents leaderboard.
    - check: Epoch's single string maps to the family with version null. Its
        apex_agents_external.csv rows (65, Pass@1 up to 0.474) look like 1.0 scores, while the board
        now shows 1.1 scores up to 68.6%; the rows should be mapped to versions 1.0 and 1.1 before
        they are compared.
      field: versions
      source: src-epoch-benchmark-data
      quote: APEX-Agents,True,apex_agents_external.csv,Pass@1 score,1.0,0.0,1.0,2026-01-21
    - check: 1.1 is modelled as a breaking revision under the same id (same maintainer, refined
        tasks, updated worlds, a new judge). No source says whether its 240 tasks are a subset of
        the 480 (31 worlds against 33), so the 04 S4 call between revision and edition is not
        clear-cut. Whether 1.1 is frozen is left unset, since its dataset revision is already 1.1.1.
      field: versions
      source: src-mercor-blog-apex-agents-1-1
      quote: selected 80 tasks per domain as our refined benchmark.
    - check: grader-from-evaluated-party rests on the paper's own statement for 1.0. For 1.1 it
        rests only on the judge's developer having ranked models (DeepSeek-V4.1-Flash), which a
        reviewer should confirm is the same organisation.
      field: governance.independence_flags
      source: src-mercor-apex-agents-leaderboard
      quote: '"modelName":"DeepSeek-V4.1-Flash-1017"'
    - check: Mercor licenses training data built by the same expert network that writes APEX tasks,
        and sells it to model developers. No independence term names a maintainer that sells
        training data to the parties it ranks; whether that is a vocabulary gap to log with bench
        tag-gap.
      field: governance.independence_flags
      source: src-mercor-apex-agents-leaderboard
      quote: Can I license APEX-Agents data for training? Yes.
    - check: reliability-consistency is tagged on the reported Pass^8 (1.0) and Pass^4 (1.1),
        although the headline averages runs, which the term's exclusion says destroys the quantity;
        long-horizon-execution is rejected for want of evidence that intermediate errors are
        unrecoverable.
      field: capability

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2510-11977-v1
    - src-arxiv-2510-11977
    - src-hal-site
    - src-hal-gaia-leaderboard
    - src-github-hal-harness-readme
    - src-arxiv-2603-23749-v1
  sources_note: >
    The HAL paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date; the site's
    home page and GAIA board with scripts and styles stripped; the README at main (withheld from
    archiving: it holds a personal SharePoint path built from a university e-mail address); and Efficient
    Benchmarking of AI Agents' v1 PDF (a DOI) as evidence that HAL's results are still reused. GitHub's
    API (licence, pushed_at, README commits) and Hugging Face's dataset API (GAIA, hal_traces) were read
    as metadata, not as quoted Sources. The other seven board pages, the about page and the Reliability
    Dashboard were not cited.
  confidence: medium
  review_checks:
    - check: Identity and family. The entry is the suite, primary agent-evaluation-suites as
        ADR-0016's example rules. Three or four boards (SWE-bench Verified Mini, USACO, SciCode,
        perhaps ScienceAgentBench) are code-family by their constituents' own entries, since tests
        judge the code; if they count as code, the suite spans two families and the term's exclusion
        sends it to general-intelligence.
      field: domain
      source: src-arxiv-2510-11977-v1
      quote: spanning web navigation (Online Mind2Web, AssistantBench, GAIA), coding (SWE-bench
        Verified Mini, USACO), scientific research (CORE-Bench Hard, ScienceAgentBench, Scicode),
        and customer service (TAU-bench Airline)
    - check: CORE-Bench Hard and ScienceAgentBench have no domain_override and add no secondary. No
        leaf names reproducing a paper from its code; code/data-science-workflows
        (ScienceAgentBench) and agents-tooluse/software-agents or code/code-understanding
        (CORE-Bench Hard) are candidates, best settled when those constituents get entries.
      field: subsets
    - check: The Reliability Dashboard on the same site (hal.cs.princeton.edu/reliability; the ICML
        2026 paper Towards a Science of AI Agent Reliability) scores 15 agents, 2026 models among
        them, on GAIA and a cleaned 26-task τ-bench airline subset on twelve reliability metrics.
        Whether it is HAL's successor, a version of HAL or an entry of its own decides lifecycle
        (null here). Its page lists authors' e-mail addresses, so a Source for it would be withheld
        from archiving.
      field: lifecycle
    - check: maintainer-verified or sandboxed-rerun. Every GAIA and CORE-Bench Hard row is marked
        Verified (reproduced by the HAL team), but the sources do not say whether the published
        number is the HAL team's re-run or the submitter's.
      field: governance.submission_process
      source: src-hal-gaia-leaderboard
      quote: Results have been reproduced by the HAL team
    - check: data.access fully-open rests on the paper's public sets. GAIA's official Hugging Face
        copy is gated (click-through); if no ungated official copy exists, the GAIA board makes
        access gated-registration under the restrictive-set rule.
      field: data.access
    - check: designed_for_subjects carries model-in-benchmark-harness for the maintainers'
        fixed-scaffold comparisons (the HAL Generalist Agent and the task-specific scaffolds they
        ran across models), although every row names its scaffold, which that term's test reads as
        the model-only case.
      field: designed_for_subjects
      source: src-arxiv-2510-11977-v1
      quote: The generalist scaffold has the same setup across benchmarks, relying on
        general-purpose tools and prompts
    - check: released is the paper's date; the repository dates from 2024-07-29 (GitHub API) and an
        earlier leaderboard may have been public before the paper.
      field: released
    - check: The current-use paper's sole author is one of HAL's authors, so it is not independent
        evidence that HAL's results are reused.
      field: lifecycle
      source: src-arxiv-2603-23749-v1
      quote: seven benchmarks from the Holistic Agent Leaderboard (HAL)
    - check: code_licence is null. With no licence file the code carries no grant, which may make
        licence-restriction a blocker despite the open-source framing.
      field: execution.code_licence
      source: src-hal-site
      quote: HAL is an open-source project
    - check: no_legitimate_aggregate is left false; with nine boards and accuracy beside cost on
        each, true may be the better reading.
      field: no_legitimate_aggregate

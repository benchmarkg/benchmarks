# data/benchmarks/agents-tooluse/holistic-agent-leaderboard-hal.yaml
#
# P1-S9-T01, agents-tooluse entry 6 of 10. Filled from the HAL paper, arXiv 2510.11977 read as its v1 PDF
# (2025-10-13; ICLR 2026), and its abstract page; the HAL site's home page and its GAIA board (scripts and styles
# stripped; every site quote is from rendered text, not from the HTML comments the pages also carry); the
# hal-harness README at main; and the v1 PDF of Efficient Benchmarking of AI Agents (arXiv 2603.23749, March
# 2026), a paper that reuses HAL's per-task results. hal.cs.princeton.edu serves no robots.txt (404). Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# What the entry is: a harness and a leaderboard over nine benchmarks that are each their own benchmark. HAL
# authors no tasks; it contributes the harness, the choice of scaffolds and models, the cost accounting and the
# log analysis. The nine boards are recorded as subsets (02 S11 rule 4; ADR-0016), each naming its constituent,
# and the constituents are not curated here: tau-bench, swe-bench-verified and scicode have entries of their own.

id: holistic-agent-leaderboard-hal
name: Holistic Agent Leaderboard
aliases:
  - HAL
  - 'Holistic Agent Leaderboard: The Missing Infrastructure for AI Agent Evaluation'
tagline: A third-party harness and leaderboard running nine agent benchmarks, with dollar cost
  reported beside accuracy.
description: >
  The Holistic Agent Leaderboard, from the SAgE team at Princeton University: an evaluation harness and
  a
  public leaderboard over nine existing agent benchmarks, each ranked on its own board. AssistantBench,
  GAIA and Online Mind2Web are web tasks; SWE-bench Verified Mini and USACO are coding; CORE-Bench Hard,
  SciCode and ScienceAgentBench are scientific research; TAU-bench Airline is customer service. HAL
  authors no tasks. It runs each constituent's public set, sometimes a subset of it (GAIA's 165
  validation questions, 50 SWE-bench Verified tasks, 50 TAU-bench Airline tasks), with that benchmark's
  own scorer, through one harness that accepts any agent exposing a run() function, executes it locally,
  in Docker or on Azure VMs, and logs every model call through Weave. Each row is a scaffold and a model
  together, so a board compares scaffolds (task-specific ones from the constituents' authors, HAL's own
  Generalist Agent, outside submissions such as a scaffold built on Claude Code) as well as models, and
  it reports each run's total API cost beside its accuracy, with a Pareto frontier of the two. There is
  no
  score across boards. The 2025 paper ran 21,730 rollouts over 9 models for about $40,000; the site now
  counts 26,597. The maintainers have paused the leaderboard to work on agent reliability, the harness
  repository is archived, and no new results are accepted.
self_description:
  source: src-hal-site
  quote: The standardized, cost-aware, and third-party leaderboard for evaluating agents.
external_ids:
  arxiv: '2510.11977'
paper:
  title: 'Holistic Agent Leaderboard: The Missing Infrastructure for AI Agent Evaluation'
  arxiv: '2510.11977'
  version_read: v1
  source: src-arxiv-2510-11977-v1
released: 2025-10-13
released_note: The paper's arXiv submission, its only version, as the abstract page dates it. The
  harness repository was created on 2024-07-29 (GitHub API), so public evaluation predates the
  paper, but no source read dates the leaderboard's launch.
released_source: src-arxiv-2510-11977
released_quote: Submitted on 13 Oct 2025
release_venue: ICLR 2026
release_venue_source: src-hal-site
release_venue_quote: The HAL paper has been accepted to ICLR 2026!

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: agents-tooluse/agent-evaluation-suites
  secondary:
    - agents-tooluse/web-navigation
    - agents-tooluse/tool-api-calling
    - code/repository-scale-se
    - code/competitive-programming
    - code/function-synthesis
domain_basis:
  reason: HAL's own claim is breadth across agent benchmarks, nine existing ones on separate boards
    with no aggregate, and no one subdomain holds most of them; the term names HAL as its example
    (ADR-0016). The secondaries are the subdomains the boards fall in, from the paper's grouping
    (web navigation, coding, customer service) and, where the constituent has an entry here, that
    entry's primary (tau-bench, swe-bench-verified, scicode). CORE-Bench Hard and ScienceAgentBench,
    which the paper groups as scientific research, are not placed (review_checks).
  source: src-arxiv-2510-11977-v1
  quote: we implement standardized evaluation for 9 challenging agent benchmarks across domains
domain_considered_and_rejected:
  - term: general-intelligence/agi-composite-suites
    reason: It needs heterogeneous tasks aggregated into a single general-capability score. HAL
      publishes nine boards and no aggregate, and its breadth is agent tasks, not general
      capability.
capability: []
capability_note: Left empty, as Stage 3 left it (taxonomy/_failures
  holistic-agent-leaderboard-hal-010, source-silent). HAL's sources claim cost-aware, standardised
  evaluation and name domains, not a competence of their own; the capabilities its boards score are
  claimed in the constituents' papers, and whether a suite inherits them is an open Stage 4
  question.
capability_considered_and_rejected:
  - term: tool-use
    reason: Agents call tools on every board, but the scored quantity is each constituent's own
      verdict on the answer, patch or program; HAL's sources do not claim tool use as what a board
      measures.
  - term: reliability-consistency
    reason: Boards average runs where there are several and most rows are a single run; pass^k-style
      agreement is the separate Reliability Dashboard's subject, not the boards'.
    source: src-arxiv-2510-11977-v1
    quote: For HAL, we were forced to rely on single runs without statistical validation for most
      evaluations.

evaluation_method:
  - execution-tests
evaluation_method_basis:
  reason: Each board uses its constituent's own scorer. Where HAL's sources describe it, the verdict
    comes from tests run on the code the agent wrote, USACO's exhaustive test cases and SciCode's
    unit tests; SWE-bench Verified Mini is test-judged by its constituent's entry. The other boards'
    scorers are not described in the sources read (review_checks).
  source: src-arxiv-2510-11977-v1
  quote: It consists of 307 problems, complete with exhaustive test cases
evaluation_method_considered_and_rejected:
  - term: composite
    reason: No published figure combines the boards; each board is ranked on its own accuracy.
  - term: model-graded-judge
    reason: An LLM tool (Docent) reads the agent logs for shortcuts and failures, but its findings
      do not enter any board's accuracy.
  - term: environment-state-check
    reason: TAU-bench Airline's own scorer checks database state (the tau-bench entry), but HAL's
      sources do not describe the scorer, so the method is left to the constituent.
designed_for_subjects:
  - agent-scaffold
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: A row is a scaffold and a model. The harness takes any scaffold behind a minimal run()
    contract, task-specific or general, and the paper's analysis varies scaffolds, which is
    agent-scaffold. The maintainers' own runs fix one scaffold per comparison and vary the model,
    among them HAL's Generalist Agent, one loop with the same tools and prompts across benchmarks,
    which is the model-in-benchmark-harness view.
  source: src-arxiv-2510-11977-v1
  quote: This contract supports both task-specific scaffolds (which may operate within
    benchmark-defined environments) and generalist scaffolds that can be run across benchmarks.
designed_for_subjects_considered_and_rejected:
  - term: full-product-pipeline
    reason: The protocol is built for scaffolds that run inside the harness. A scaffold built on
      Claude Code, a shipped product, now tops CORE-Bench Hard, which is recorded as observed, not
      designed.
observed_subjects:
  values:
    - agent-scaffold
    - model-in-benchmark-harness
    - full-product-pipeline
  basis: Most rows are the maintainers' runs of task-specific scaffolds and their Generalist Agent
    across models; the top CORE-Bench Hard rows are an outside scaffold that uses Claude Code.
  source: src-hal-site

lifecycle: null
lifecycle_note: Left null, as Stage 3 left it (holistic-agent-leaderboard-hal-006; ADR-0019 and
  ADR-0020 defer a paused state). The maintainers paused the leaderboard to work on reliability and
  say more is to come, which mature's exclusion names as a near miss, and no new rows are being
  added, which active needs. Results kept arriving after the paper (a March 2026 paper drew on runs
  added since) and HAL's per-task results are still reused, but no source shows new results produced
  against the boards now.
lifecycle_source: src-arxiv-2603-23749-v1
lifecycle_quote: since additional runs were added between the publication of the paper and our data
  acquisition efforts
activity: closed
activity_note: The site pauses updates with new models, and the README says more is to come ("We
  will have more to share soon"); no reopening date is given. The pause is recorded here, as
  closed's test asks, not as a lifecycle state.
activity_basis:
  reason: Outside results reached the boards by uploading encrypted traces with hal-upload and
    opening a pull request; the maintainers stopped taking them and retired the open pull requests
    when they archived the repository.
  source: src-github-hal-harness-readme
  quote: HAL is no longer accepting new result submissions through this harness.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SWE-Agent with Claude Sonnet 4.5 High (top of SWE-bench Verified Mini)
    source: src-hal-site
    observed_on: 2026-10-14
    quote: SWE-Agent Claude Sonnet 4.5 High (September 2025) 72.0%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: null
ground_truth_source_note: Each board inherits its constituent's ground truth, which differs by board
  (tests for USACO, SciCode and SWE-bench Verified Mini, reference answers for GAIA and CORE-Bench
  Hard, a goal database state for TAU-bench Airline), so no one value holds for the entry.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The harness, the constituents' public sets and the agent scaffolds are released, and the
    models are public APIs. Online Mind2Web's live websites cannot be recreated, and the harness is
    archived with no licence file.
  source: src-github-hal-harness-readme
  quote: This repository provides a standardized evaluation harness for reproducible agent
    evaluations across various benchmarks.

task:
  exists: true
  input:
    - a task from one of the nine constituent benchmarks, with any files or environment it needs,
      packaged by the harness and passed to the agent's run() function
  output: The agent's submission for each task id (an answer, a patch or a program), returned to the
    harness, with every model call logged for token use and cost.
  scoring: The constituent's own scorer, as accuracy over the board's tasks, beside the run's total
    API cost in US dollars, with a Pareto frontier of accuracy against cost per board. Most rows are
    a single run; each board ranks by accuracy, and nothing is scored across boards.
  source: src-arxiv-2510-11977-v1
  quote: Agents, by contrast, map task identifiers to submissions and may use LLM calls and tools
    internally.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: GAIA's official copy on Hugging Face is gated by click-through (the Hugging Face API
    reports gated "auto", read 2026-10-14); if it has no ungated official copy, the GAIA board reads
    gated-registration (review_checks). CORE-Bench's test file ships encrypted with its password
    printed in the README, an anti-contamination device, not a gate.
  access_basis:
    reason: HAL scores only the constituents' public sets, including for GAIA and AssistantBench,
      whose own leaderboards use private sets.
    source: src-arxiv-2510-11977-v1
    quote: For GAIA and AssistantBench, we evaluate on publicly available test sets rather than the
      full private sets used for official leaderboards
  records_access: fully-open
  records_access_note: Every run's traces are public on Hugging Face (agent-evals/hal_traces,
    ungated, last modified 2026-02-01 per its API), encrypted against scraping with a public
    decryption script.
  records_access_source: src-arxiv-2510-11977-v1
  records_access_quote: We share all agent logs, comprising 2.5B tokens of language model calls
  refresh: null
  refresh_note: Source-silent, as at Stage 3 (holistic-agent-leaderboard-hal-004). The board roster
    has stayed at nine since the paper while the harness has added and dropped benchmarks, and no
    source says whether the roster or the subsets HAL fixes are frozen, versioned or rolling.
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: Every task is a constituent benchmark's, sometimes a subset of it (33
    AssistantBench tasks, 50 of SWE-bench Verified's 500), whose own paper documents its provenance.
  data_provenance_source: src-arxiv-2510-11977-v1
  data_provenance_quote: Benchmarks specify task data, any required files or runtime constraints,
    and the scoring procedure.
  contamination_risk: medium
  contamination_risk_note: Every constituent set is public, so a training route is plausible and
    none is evidenced. The paper found agents looking gold answers up on Hugging Face or arXiv
    during runs, a shortcut at run time rather than a training route, and found that TAU-bench's
    official few-shot scaffold carried test examples, a leak closed by excluding that scaffold. HAL
    encrypts its traces so they do not become a route.
  contamination_risk_source: src-arxiv-2510-11977-v1
  contamination_risk_quote: There were also eight cases where agents found a gold answer
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: Each board ranks by accuracy over its tasks, bounded at 100%, and HAL publishes no human
      or measured ceiling to read scores against; the constituents' own human baselines are theirs.
  dataset_licence: null
  dataset_licence_note: Each constituent's data is under its own terms. The harness downloads most
    sets from the constituents' own copies and ships CORE-Bench's test file encrypted.
  size:
    - count: 9
      unit: constituent benchmarks, each ranked on its own board
      source: src-arxiv-2510-11977-v1
      quote: We validate the harness by conducting 21,730 agent rollouts across 9 models and 9
        benchmarks
    - count: 21730
      unit: agent rollouts across 9 models
      subset: the 2025 paper's evaluation
      source: src-arxiv-2510-11977-v1
      quote: We validate the harness by conducting 21,730 agent rollouts across 9 models and 9
        benchmarks
    - count: 26597
      unit: agent rollouts
      subset: the site, read 2026-10-14
      source: src-hal-site
      quote: 26 597 Rollouts 9 Benchmarks
    - count: 165
      unit: questions (GAIA's public validation set)
      subset: GAIA
      source: src-hal-gaia-leaderboard
      quote: We evaluate on the public validation set of 165 questions.
    - count: 45
      unit: papers (the public test set)
      subset: CORE-Bench Hard
      source: src-arxiv-2510-11977-v1
      quote: We ran the evaluations on the public test set of 45 papers from the CORE-Bench Hard
        benchmark.
    - count: 50
      unit: tasks, a random subset of SWE-bench Verified
      subset: SWE-bench Verified Mini
      source: src-github-hal-harness-readme
      quote: Mini version is a subset of 50 randomly selected problems from the full dataset
    - count: 50
      unit: tasks from the public airline set
      subset: TAU-bench Airline
      source: src-arxiv-2510-11977-v1
      quote: We used 50 tasks from the TAU-bench Airline
    - count: 33
      unit: tasks, a subset of AssistantBench's 214
      subset: AssistantBench
      source: src-arxiv-2510-11977-v1
      quote: We focused on a subset of 33 tasks.
    - count: 307
      unit: problems
      subset: USACO
      source: src-arxiv-2510-11977-v1
      quote: It consists of 307 problems, complete with exhaustive test cases
    - count: 300
      unit: tasks on 136 live websites
      subset: Online Mind2Web
      source: src-arxiv-2510-11977-v1
      quote: The benchmark consists of 300 verified tasks across 136 live websites.
    - count: 65
      unit: main problems (338 subproblems)
      subset: SciCode
      source: src-arxiv-2510-11977-v1
      quote: It is made up of 65 main problems decomposed into 338 subproblems
    - count: 102
      unit: tasks
      subset: ScienceAgentBench
      source: src-arxiv-2510-11977-v1
      quote: It consists of 102 tasks validated by nine subject matter experts

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The SAgE team at Princeton University (princeton-pli on GitHub)
  maintainer_basis:
    reason: The site names the team; the harness sits in the Princeton Language and Intelligence
      organisation, and the paper's 31 authors span Princeton and other institutions.
    source: src-hal-site
    quote: By the SAgE team at Princeton University
  maintainer_type: academic-lab
  submission_process:
    - maintainer-run
    - maintainer-verified
  submission_process_note: Most rows are the maintainers' own runs of models and scaffolds they
    chose. Outside developers ran the harness themselves, uploaded encrypted traces with hal-upload
    and opened a pull request; every row on the GAIA and CORE-Bench Hard boards, the outside Claude
    Code rows among them, is marked Verified, which the boards define as reproduced by the HAL team.
    Whether the published number is the HAL team's re-run is not stated (review_checks). The route
    closed in 2026 (history).
  submission_process_source: src-hal-gaia-leaderboard
  submission_process_quote: Results have been reproduced by the HAL team
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-hal-site
      quote: We are grateful to OpenAI and Google for providing API credits to evaluate their
        models.
    - flag: maintainer-competes-on-own-benchmark
      source: src-hal-site
      quote: GAIA Web Assistance Top 3 performing agents HAL Generalist Agent Claude Sonnet 4.5
        (September 2025) 74.5%
  independence_flags_note: OpenAI and Google gave API credits to evaluate their own models (the
    paper acknowledges OpenAI's). The HAL Generalist Agent is the maintainers' own scaffold, built
    on smolagents, and holds the top GAIA and TAU-bench Airline rows; CORE-Agent, the task-specific
    CORE-Bench scaffold, is from the CORE-Bench paper, whose five authors are among HAL's. HAL is
    the official leaderboard for CORE-Bench Hard and ScienceAgentBench, and ScienceAgentBench's and
    Online Mind2Web's author lists also overlap HAL's (the paper's references). The named funders
    (Coefficient Giving, Schmidt Sciences and Princeton initiatives) evaluate nothing.
  independence_assessed: true
  funding:
    source: src-hal-site
    quote: HAL is funded by Coefficient Giving

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The cost of a run is model inference, which the paper and the boards report as API
      spend. The harness can provision Docker containers or Azure VMs, GPU VMs among them for
      evaluations that require them, but no board requires special hardware of every run.
    source: src-arxiv-2510-11977-v1
    quote: with a total cost of about $40,000
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: A fresh run of any board needs no human, physical or maintainer-only
    step. Online Mind2Web runs on live websites and AssistantBench and GAIA search the live web,
    which is live-world-state by that term's test, but tier 3 forbids that blocker beside
    fully-automatable (holistic-agent-leaderboard-hal-011; ADR-0020 open question 1).
  reproducibility_tier_basis:
    reason: The harness runs every board end to end, locally, in Docker or on Azure VMs.
    source: src-github-hal-harness-readme
    quote: This repository provides a standardized evaluation harness for reproducible agent
      evaluations across various benchmarks.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: hal-harness (the hal-eval command line), github.com/princeton-pli/hal-harness; archived,
    last pushed 2026-07-01
  harness_source: src-github-hal-harness-readme
  harness_quote: Unified `hal-eval` CLI across all benchmarks and agent types
  harness_gotcha:
    source: src-hal-gaia-leaderboard
    quote: 'Known issue (October 5, 2026): Reported costs and token counts are overstated.'
  code_licence: null
  code_licence_note: No licence is declared. GitHub's licence metadata for princeton-pli/hal-harness
    is empty and the repository has no LICENSE file at its root (both read 2026-10-14), although the
    site and the paper call the harness open source (review_checks).
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the agentic profile (which already makes scaffold, harness, reasoning_effort and subset_used material):
  # HAL varies scaffold and model per row, so the scaffold is half of what a number means. The harness is
  # hal-harness at a commit; the repository has no tagged releases in the sources read, so the commit is the
  # version, and HAL's own cost bug (2026-10-05) shows the harness changes what is logged. Reasoning levels are
  # mapped to thinking-token budgets for non-OpenAI models ("the reasoning token budget is set at 1,024 (low),
  # 2,048 (medium), and 4,096 (high)", src-hal-gaia-leaderboard), and providers swapped weights behind stable
  # endpoints during the runs (src-arxiv-2510-11977-v1). subset_used matters here more than usual: HAL scores
  # subsets (50 of SWE-bench Verified, 33 of AssistantBench, GAIA's validation set), not the constituents'
  # headline sets, so a HAL number is not that constituent's leaderboard number.
  material_extra:
    - thinking_token_budget
    - provider_snapshot
aggregation_policy: none-by-design
aggregation_policy_note: Nine boards, each ranked on its own accuracy with cost beside it; no figure
  combines boards, and the maintainers argue against single-axis rankings.
aggregation_policy_basis:
  reason: The site argues for reading accuracy and cost together on a Pareto frontier rather than
    one ranked number.
  source: src-hal-site
  quote: Agents can be 100x more expensive while only being 1% better
headline_metric: null
secondary_axes:
  - cost
secondary_axes_note: Cost is total API spend at fixed per-token prices (the paper's as of
  2025-09-24), adjustable on each board. It ignores caching, and a known issue posted 2026-10-05
  says nested trace spans counted some responses twice, inflating affected rows' cost and tokens
  exactly twofold, not yet re-derived. Latency is logged but not reported, because parallel runs
  make it unreliable.
secondary_axes_basis:
  reason: Every board reports each run's total API cost beside its accuracy, and the paper draws the
    accuracy-cost Pareto frontier per benchmark.
  source: src-arxiv-2510-11977-v1
  quote: we present Pareto frontiers of accuracy versus cost (both dollar cost and token cost)

homepage: https://hal.cs.princeton.edu/
repository: https://github.com/princeton-pli/hal-harness
leaderboard_url: https://hal.cs.princeton.edu/

subsets:
  # The nine boards. Each is its own benchmark; a subset here is HAL's run of it (its task set, scaffolds and
  # models), not the constituent. Items are from data.size.
  - id: holistic-agent-leaderboard-hal#assistantbench
    label: AssistantBench
    items: 33
    scored_separately: true
    domain_override:
      primary: agents-tooluse/web-navigation
    evidence:
      - source: src-arxiv-2510-11977-v1
        quote: We focused on a subset of 33 tasks.
    notes: Web search tasks, run with Browser-Use on a 33-task subset of the public set.
  - id: holistic-agent-leaderboard-hal#corebench-hard
    label: CORE-Bench Hard
    items: 45
    scored_separately: true
    evidence:
      - source: src-arxiv-2510-11977-v1
        quote: HAL is the official benchmark for CORE-Bench Hard.
      - source: src-hal-site
        quote: We have now declared CORE-Bench solved
    notes: Reproducing papers from their code and answering questions about the results. HAL is the
      constituent's official leaderboard, and declared it solved after an outside Claude Code
      scaffold with Claude Opus 4.5 reached 95.5% once a few grading errors were fixed by hand. No
      domain is set (review_checks).
  - id: holistic-agent-leaderboard-hal#gaia
    label: GAIA
    items: 165
    scored_separately: true
    domain_override:
      primary: agents-tooluse/web-navigation
    evidence:
      - source: src-hal-gaia-leaderboard
        quote: 32 Evaluations (2 scaffolds, 17 models)
    notes: The public validation set, not the private test set behind GAIA's own leaderboard; the
      site files GAIA under web assistance.
  - id: holistic-agent-leaderboard-hal#online-mind2web
    label: Online Mind2Web
    items: 300
    scored_separately: true
    domain_override:
      primary: agents-tooluse/web-navigation
    evidence:
      - source: src-arxiv-2510-11977-v1
        quote: It does not rely on cached pages and allows real-time testing against dynamic and
          evolving web interfaces.
    notes: Live websites, run with Browser-Use and SeeAct; the most expensive board, where the paper
      did not run Claude Opus 4.1.
  - id: holistic-agent-leaderboard-hal#scicode
    label: SciCode
    items: 65
    scored_separately: true
    domain_override:
      primary: code/function-synthesis
    notes: Its own entry is scicode.
  - id: holistic-agent-leaderboard-hal#scienceagentbench
    label: ScienceAgentBench
    items: 102
    scored_separately: true
    evidence:
      - source: src-arxiv-2510-11977-v1
        quote: HAL is the official benchmark for ScienceAgentBench.
    notes: Data-driven discovery tasks, run with SAB Self-Debug. No domain is set (review_checks).
  - id: holistic-agent-leaderboard-hal#swebench-verified-mini
    label: SWE-bench Verified Mini
    items: 50
    scored_separately: true
    domain_override:
      primary: code/repository-scale-se
    notes: A random 50-task subset of SWE-bench Verified (its own entry, swe-bench-verified), so its
      numbers are not SWE-bench Verified's.
  - id: holistic-agent-leaderboard-hal#taubench-airline
    label: TAU-bench Airline
    items: 50
    scored_separately: true
    domain_override:
      primary: agents-tooluse/tool-api-calling
    evidence:
      - source: src-arxiv-2510-11977-v1
        quote: Similarly, we use the original TAU-bench
    notes: The original τ-bench airline domain (its own entry, tau-bench), not τ²-bench. The
      official few-shot scaffold was excluded after its few-shot file was found to hold test
      examples.
  - id: holistic-agent-leaderboard-hal#usaco
    label: USACO
    items: 307
    scored_separately: true
    domain_override:
      primary: code/competitive-programming
    notes: USA Computing Olympiad problems, run mostly with the USACO Episodic + Semantic scaffold.

history:
  - date: 2026-07-01
    event: channel-closed
    field: governance.submission_process
    from: trace upload with hal-upload and a pull request to princeton-pli/hal-harness
    source: src-github-hal-harness-readme
    quote: Active PRs for new leaderboard results are being retired while this repository is
      archived.
    note: Dated by the README commit that documents the archival ("Document HAL harness archival
      status", GitHub API); the site's pause notice is undated.

tags:
  - agents
  - leaderboard

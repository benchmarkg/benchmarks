# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2306-06070-v3
    - src-arxiv-2306-06070
    - src-github-mind2web-readme
    - src-hf-api-mind2web
    - src-hf-api-multimodal-mind2web
    - src-hf-multimodal-mind2web-card
    - src-arxiv-2504-01382-v4
    - src-arxiv-2506-21506
    - src-arxiv-2610-20107-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text; its abstract page for the dates; the README
    at commit 33bd95c, withheld from archiving because its Contact section prints authors' e-mail addresses;
    Hugging Face's API records of osunlp/Mind2Web and osunlp/Multimodal-Mind2Web (no terms accepted, nothing
    downloaded); the Multimodal-Mind2Web card, withheld for its point-of-contact address; the Online-Mind2Web
    v4 PDF and the Mind2Web 2 abstract page (DOIs) for the lineage; and the v1 PDF of Why Generate a Click?
    (a DOI) as evidence of current use. The project page repeats the README and was not cited; the Online-Mind2Web
    repository and leaderboard belong to that benchmark's own entry and were not cited.
  confidence: medium
  review_checks:
    - check: The family's inclusion test speaks of an autonomous loop whose end state or result is
        checked; Mind2Web scores single-step predictions against recorded actions with no loop.
        web-navigation's definition names "recorded web pages", and AgentBench's Mind2Web subset
        already carries the leaf, so the entry stays here; a reviewer may judge offline action
        prediction a poorer fit for the family than its leaf.
      field: domain.primary
      source: src-arxiv-2306-06070-v3
      quote: Each step of the task is evaluated independently with the ground truth action history
        provided.
    - check: grounding rests on element accuracy (attaching the task's language to a page element)
        and on the paper's own grounding claim; the task description names a goal, not the element,
        so a reviewer may read element choice as action prediction rather than reference resolution.
        planning was rejected although the paper claims it, because no constructed sequence is
        scored.

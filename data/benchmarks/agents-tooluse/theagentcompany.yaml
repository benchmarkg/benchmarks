# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2412-14161-v3
    - src-arxiv-2412-14161
    - src-github-theagentcompany-readme
    - src-github-theagentcompany-evaluation-doc
    - src-github-theagentcompany-experiments-readme
    - src-the-agent-company-com-leaderboard-data
    - src-epoch-benchmark-data
    - src-arxiv-2609-11999-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, its windows kept away from the contact line,
    the reference list's author names and the named simulated colleagues; its abstract page for the dates
    and the comment field; the README and docs/EVALUATION.md pinned to commit 98b68ef; the experiments
    README pinned to f9b1e94, its windows stopping short of the contact addresses; the leaderboard JSON
    from the site repository at c57e3da, read because the page renders by script; Epoch's export for the
    Epoch string; and Is Bash All You Need?'s v1 PDF (a DOI) as evidence of current use. The site's Submit
    and leaderboard-details components and the GitHub API (licences, releases, push dates) were read but
    are not kept as Sources.
  confidence: medium
  review_checks:
    - check: Domain primary long-horizon-autonomy, by that leaf's rule that the horizon is primary
        only when no interface leaf describes the benchmark. web-navigation is the close
        alternative, since every service is a web site and the paper's baseline reaches them only by
        browser; the terminal and Python work (most visibly the SDE tasks) and the colleague
        messaging are what kept it secondary.
      field: domain
      source: src-arxiv-2412-14161-v3
      quote: TheAgentCompany covers all of these interfaces, while most previous benchmarks focus
        only on one or two.
    - check: society-econ-law/economically-valuable-work was rejected even as secondary. The tasks
        are chosen from O*NET occupations by employment and wages and the paper is framed by effects
        on the labour market, but the leaf names scoring by expert comparison with human work
        product, which this benchmark does not do.
      field: domain
      source: src-arxiv-2412-14161-v3
      quote: Specifically, we start by referencing the 29.1 release of O*NET database
    - check: communication rests on checkpoints that score exchanges with simulated colleagues; most
        check that the right person was asked or a message posted, and only some depend on what the
        colleague then did. collaboration was rejected because the colleagues' outcomes are not
        scored.
      field: capability
      source: src-arxiv-2412-14161-v3
      quote: RocketChat is where all social interaction with peers occurs, and the low scores
        suggest that LLMs still lack communication skills.
    - check: long-horizon-execution rests on 15 to 40 LLM calls per task and the binary score
        failing on any missed checkpoint; no source says whether a failed checkpoint can be retried
        within the episode.
      field: capability
      source: src-arxiv-2412-14161-v3
      quote: It requires an average of almost 27 steps and more than $4 to complete
    - check: The paper says the scoring framework overrides a misjudged intermediate step and grants
        full credit when the deliverable is sound. No source read says who decides that or how,
        which bears on whether scoring is fully programmatic.
      field: evaluation_method
      source: src-arxiv-2412-14161-v3
      quote: the scoring framework would override the score and grant full credit
    - check: composite is tagged because % Score folds deterministic and judge-scored checkpoints
        with full completion; the ranking column, % Resolved, is binary, and Epoch takes it as the
        score.
      field: evaluation_method
    - check: maintainer_type academic-lab. The GitHub organisation names no holder, and only the
        first and last authors and some others are at Carnegie Mellon University (the rest
        independent or at Duke), so community-collective is the reading the term's exclusion may
        require.
      field: governance.maintainer_type
    - check: submission_process maintainer-verified. Verification is on request, and every row read
        carries the checked flag; whether an unverified pull request would be listed (self-reported)
        is not stated. The flag's meaning comes from a site component that is not kept as a Source.
      field: governance.submission_process
      source: src-the-agent-company-com-leaderboard-data
      quote: '"open_source": false, "checked": true'
    - check: The leaderboard ranks rows run under different environment LLMs (Qwen Plus for the top
        row, GPT-4o for the second, Claude 3.5 Sonnet for the rest), which change both the
        colleagues and the judge; whether those rows are comparable is not addressed by any source.
      field: comparability
      source: src-the-agent-company-com-leaderboard-data
      quote: '"date": "2025-11-10", "enviroment_model": "Qwen_Plus"'
    - check: Versions. One release, 1.0.0, dated by the GitHub API rather than a Source; frozen
        rests on the experiments repository filing results by version. Commits after the tag
        (setup-script and image fixes to 2025-11-17) were not read for task changes, and the paper's
        v1 was not read to confirm it had the same 175 tasks.
      field: versions
      source: src-github-theagentcompany-experiments-readme
      quote: the top level directories are different versions of TheAgentCompany (currently only
        1.0.0)
    - check: model-graded-judge needs reference_conditions naming the judge
        (Claude-3-5-Sonnet-20241022 for the baselines, the runner's environment LLM otherwise); no
        conditions record exists, and writing one was outside this task's write scope.
      field: reference_conditions
      source: src-arxiv-2412-14161-v3
      quote: Same as the NPC backbone, all LLM-based evaluators are backed by the
        Claude-3-5-Sonnet-20241022.
    - check: Lineage. arXiv's search listing shows CUA-SHADE-Arena (arXiv 2508.19461), which extends
        TheAgentCompany for computer-use agents, and a wealth-management extension (arXiv
        2512.02230); neither was read. Once records exist, link them as forks or extended_by.
      field: lineage

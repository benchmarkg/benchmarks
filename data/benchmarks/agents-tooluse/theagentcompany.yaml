# data/benchmarks/agents-tooluse/theagentcompany.yaml
#
# P1-S9-T02, agents-tooluse entry 13. Promotes P3-S2-T07's Epoch stub (data/benchmarks/_stubs/theagentcompany.yaml,
# Epoch's string "The Agent Company"). Filled from the TheAgentCompany paper, arXiv 2412.14161 read as its v3 PDF
# (2025-09-10), and its abstract page; the repository README and docs/EVALUATION.md at commit 98b68ef; the README of
# TheAgentCompany/experiments, where submissions land; the leaderboard's data, the JSON that the script-rendered page
# at the-agent-company.com imports from its site repository (robots.txt disallows nothing); Epoch's export, for the
# Epoch string; and the v1 PDF of Is Bash All You Need? (arXiv 2609.11999, September 2026), a paper that runs
# TheAgentCompany. Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.

id: theagentcompany
name: TheAgentCompany
aliases:
  - The Agent Company
aliases_note: Epoch's benchmark string, which the site's title and the README's heading also use.
aliases_source: src-epoch-benchmark-data
aliases_quote: The Agent Company,True,the_agent_company_external.csv,% Resolved
tagline: 175 workplace tasks in a self-hosted simulated software company, with LLM colleagues and
  checkpoint-scored end states.
description: >
  A benchmark of 175 tasks set in a simulated software company whose intranet is self-hosted open-source
  software: GitLab for code and wikis, ownCloud for documents, Plane for issues and sprints and RocketChat
  for messaging, populated with real software projects' data and data the authors wrote. Each task is
  a Docker image holding a local workspace (a Linux container), an English instruction and an encrypted
  evaluator. The agent works through whatever interface its builders give it -- the paper's baseline,
  OpenHands' CodeAct agent, uses a text-based browser, a bash shell and IPython -- and can message simulated
  colleagues, LLM-backed characters built on Sotopia, for information the instruction leaves out. The
  tasks come from software engineering (69), human resources (29), project management (28), administration
  (15), data science (14), finance (12) and other work (8), chosen with reference to O*NET's occupations.
  Each task is divided into checkpoints worth points, checked by Python evaluators that read the workspace,
  the services, the conversations and the trajectory; 51 tasks also use an LLM judge. The judge and the
  colleagues are one configurable "environment LLM", Claude-3-5-Sonnet-20241022 in every baseline. The
  leaderboard ranks % Resolved (every checkpoint passed) and reports % Score (half the checkpoint fraction
  plus half for full completion), steps and cost. No human baseline was collected. Submissions are pull
  requests of results and trajectories to the experiments repository, which the team verifies on request
  by running a random subset.
self_description:
  source: src-github-theagentcompany-readme
  quote: 'providing an extensible benchmark for evaluating AI agents that interact with the world in similar
    ways to those of a digital worker: by browsing the Web, writing code, running programs, and communicating
    with other coworkers'
external_ids:
  epoch: The Agent Company
  arxiv: '2412.14161'
paper:
  title: 'TheAgentCompany: Benchmarking LLM Agents on Consequential Real World Tasks'
  arxiv: '2412.14161'
  version_read: v3
  source: src-arxiv-2412-14161-v3
released: 2024-12-18
released_note: The paper's first arXiv version, as the abstract page dates it; Epoch's export gives
  the same date. The repository's 1.0.0 release was tagged on 2024-12-20 (GitHub API).
released_source: src-arxiv-2412-14161
released_quote: Submitted on 18 Dec 2024 (v1), last revised 10 Sep 2025 (this version, v3)
release_venue: null
release_venue_note: The abstract page's comment field and the v3 PDF call the paper a preprint; no
  venue was found in the sources read.
release_venue_source: src-arxiv-2412-14161
release_venue_quote: 'Comments: Preprint'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: agents-tooluse/long-horizon-autonomy
  primary_basis:
    reason: What is scored is what one agent achieved in the environment, checked by evaluators that
      read the state it left, so the family is agents-tooluse. No interface leaf describes the
      benchmark -- tasks need web services, a terminal, a Python runtime and a chat platform, and
      the paper makes that breadth a design goal -- so long-horizon-autonomy's distinction makes the
      horizon primary. The paper names long tasks with checkpoints as its novel contribution.
    source: src-arxiv-2412-14161-v3
    quote: One novel contribution of TheAgentCompany is that we both (1) contain tasks that require
      an agent to perform significantly more consecutive work
  secondary:
    - agents-tooluse/web-navigation
    - agents-tooluse/software-agents
  secondary_basis:
    reason: Every intranet service is a web site, and most tasks need at least one (a task is
      counted under each platform it needs). The 69 software engineering tasks clone, build and run
      real repositories in the local workspace, and their checkpoints check the state that leaves.
      Neither holds the benchmark as primary. Tasks also need the terminal, the Python runtime and
      messages to colleagues, and the paper claims the range of interfaces as a desideratum;
      software engineering is 69 of 175 tasks, beside project management, HR, administration, data
      science and finance (see review_checks).
    source: src-arxiv-2412-14161-v3
    quote: GitLab (71 tasks) Plane (17 tasks) RocketChat (79 tasks) ownCloud (70 tasks)
domain_considered_and_rejected:
  - term: agents-tooluse/computer-use-gui
    reason: The paper ships a virtual machine image but builds and evaluates a web-based baseline,
      and the services, the office suite among them, are web applications; the leaf's exclusion
      sends work in a browser to web-navigation.
    source: src-arxiv-2412-14161-v3
    quote: but we opt to build a baseline solution that is entirely web-based
  - term: agents-tooluse/operating-system-tasks
    reason: The shell is the local workspace in every task, but the tasks are workplace work across
      services, not bringing a machine to a target state, and no category or breakdown isolates
      shell work.
    source: src-arxiv-2412-14161-v3
    quote: A bash shell that connects with the local workspace operating system environment for
      command execution.
  - term: agents-tooluse/multi-agent-coordination
    reason: One agent is evaluated. The colleagues are simulated characters the benchmark supplies
      to every entrant, which tool-api-calling's distinction treats as environment; OWL RolePlay's
      multi-agent design is one entrant's internals.
    source: src-arxiv-2412-14161-v3
    quote: To create these simulated colleagues, we rely on the Sotopia platform
  - term: agents-tooluse/agent-evaluation-suites
    reason: One benchmark with one task set and one leaderboard, not a suite of benchmarks; its
      claim is realism of workplace tasks, not coverage of the family.
  - term: society-econ-law/economically-valuable-work
    reason: The tasks were chosen with O*NET's occupations and the paper is framed by effects on the
      labour market, but they are scored by checkpoint evaluators on the environment, not by expert
      comparison with human work product, and the family's exclusion sends autonomous operation to
      agents-tooluse (osworld-2-0 is its near miss). The authors warn against reading job automation
      from the results.
    source: src-arxiv-2412-14161-v3
    quote: we caution against making any assumptions about whether a particular job may be in danger
      of full automation based solely on TheAgentCompany
  - term: code/repository-scale-se
    reason: No tests run against code the agent wrote; the SDE checkpoints check that a repository
      was cloned, a binary built and a server launched, which is environment state.
    source: src-arxiv-2412-14161-v3
    quote: verifying if the JanusGraph repository is cloned, the binary file is built, and the
      server is launched with an HTTP endpoint
capability:
  - long-horizon-execution
  - context-integration
  - communication
capability_basis:
  long-horizon-execution:
    reason: The paper's agents average 15 to 40 LLM calls per task, about 27 for the strongest
      (Table 1), and the full completion score fails a task when any checkpoint is missed, so a
      failed intermediate step forecloses full success while partial credit still accrues, the
      pattern of the term's osworld-2-0 example. The paper calls most tasks long-horizon.
    source: src-arxiv-2412-14161-v3
    quote: This binary metric evaluates if the agent successfully completed the task by passing all
      checkpoints.
  context-integration:
    reason: Tasks turn on the company's own data -- repositories, documents, issues and what
      colleagues say when asked -- which the agent has to find in the environment, and colleagues
      hold information the instruction leaves out.
    source: src-arxiv-2412-14161-v3
    quote: we allow agents to use RocketChat to message other company members and obtain information
      that may not be available in the original task description
  communication:
    reason: Checkpoints score the agent's exchanges with simulated colleagues -- asking the right
      person, posting results, settling a meeting time or a reduced request with them -- and the
      paper built the colleagues to test communication.
    source: src-arxiv-2412-14161-v3
    quote: 'Collaboration: Assessing interactions with simulated colleagues or sharing of output, such
      as posting messages or asking for additional information to complete the task.'
capability_considered_and_rejected:
  - term: tool-use
    reason: The agent acts through a general browser, shell and Python runtime, not callable tools
      the benchmark exposes; the interface is the entrant's choice, and a 2026 study had to build
      its own typed catalog to compare tool interfaces.
    source: src-arxiv-2609-11999-v1
    quote: The benchmark provides no LLM-facing typed tool catalog.
  - term: collaboration
    reason: The colleagues have profiles but no objective of their own that is scored; the score is
      the agent's task, with the colleagues as sources of information and approval.
  - term: autonomy
    reason: The headline counts tasks completed autonomously, but nothing in the protocol prohibits
      or measures human intervention, the README allows the tasks to be run by human testers, and
      colleagues take part by design.
    source: src-github-theagentcompany-readme
    quote: This applies if you are using agents not from OpenHands, or want to run the benchmark
      manually by human testers.
  - term: planning
    reason: No source claims planning; the checkpoints score the state and deliverables an episode
      produces, which planning's exclusion covers.
  - term: perception
    reason: Some administration and finance tasks need scanned images read, but only the deliverable
      is scored and no score isolates what was recovered from the image.
    source: src-arxiv-2412-14161-v3
    quote: understanding images scanned by employees

evaluation_method:
  - environment-state-check
  - model-graded-judge
  - composite
evaluation_method_note: Each checkpoint is implemented in the task's encrypted evaluator. Most are
  deterministic Python checks of the local workspace, the services' state, the RocketChat
  conversations or the trajectory (browsing history, action sequences); 51 tasks (29%) use an LLM
  judge, prompted with rubrics or reference outputs, as a fallback after keyword matching. The judge
  is the environment LLM the runner configures, Claude-3-5-Sonnet-20241022 for every baseline. %
  Score folds the checkpoint fraction and full completion into one figure, which is why composite is
  tagged; % Resolved is the binary rate. The paper says the framework overrides a misjudged
  intermediate step and grants full credit when the deliverable is correct (see review_checks).
evaluation_method_basis:
  reason: Evaluators read the state the episode left and the trajectory, so any trajectory reaching
    the required state passes; the LLM judge decides unstructured deliverables and
    colleague-dependent checkpoints.
  source: src-arxiv-2412-14161-v3
  quote: These evaluators are implemented by examining environment states, such as the local
    workspace, intranet status, simulated colleague interactions, or by analyzing agent trajectories
evaluation_method_considered_and_rejected:
  - term: execution-tests
    reason: No test runs against code the agent wrote; the SDE checkpoints check that a repository
      was cloned, a binary built and a server answering, which the term's exclusion assigns to
      environment-state-check.
    source: src-arxiv-2412-14161-v3
    quote: verifying if the JanusGraph repository is cloned, the binary file is built, and the
      server is launched with an HTTP endpoint
  - term: rubric-graded
    reason: Checkpoints are named and weighted, but they are programmatic assertions, which the
      term's exclusion covers; rubrics appear only inside the LLM judge's prompt.
    source: src-arxiv-2412-14161-v3
    quote: In most cases, these evaluators are deterministic and written as simple Python functions.
  - term: constraint-check
    reason: What the checks read is the state an agent episode left in stateful services, which the
      term's exclusion assigns to environment-state-check.
designed_for_subjects:
  - agent-scaffold
  - model-in-benchmark-harness
designed_for_subjects_note: agent-scaffold for entrants, who bring their own agent and interface, as
  the leaderboard rows for TTE-MatrixAgent, MUSE and OpenHands-Versa do. model-in-benchmark-harness
  for the paper's results and the maintainers' rows, which run each model inside OpenHands' CodeAct
  agent (versions 0.14.2 and 0.28.1) through the repository's run_eval.sh.
designed_for_subjects_basis:
  reason: The evaluation guide leaves the loop and the interface to the entrant, down to whether the
    agent browses inside the task container at all.
  source: src-github-theagentcompany-evaluation-doc
  quote: Your agent doesn't have to do browsing in the container environment.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: People completed every task while it was built, to test feasibility, but no human scores
      were recorded.
    source: src-arxiv-2412-14161-v3
    quote: However, we did not collect human performance data.
  - term: multi-agent-system
    reason: The colleagues are supplied to every entrant alike, which the term's exclusion treats as
      environment; OWL RolePlay's multi-agent design is one entrant's internals, not a property of
      the protocol.
    source: src-arxiv-2412-14161-v3
    quote: OWL RolePlay adopts multi-agent collaboration and experiences difficulty in preserving
      progress and context
observed_subjects:
  values:
    - model-in-benchmark-harness
    - agent-scaffold
  basis: Of the 17 leaderboard rows, 13 are the paper's own runs (12 models inside OpenHands'
    CodeAct agent, and OWL RolePlay); the other four name their own scaffolds (TTE-MatrixAgent, MUSE
    and OpenHands-Versa twice).
  source: src-the-agent-company-com-leaderboard-data
as_used:
  - protocol: Five tool interfaces (typed tools only, typed tools plus bash, bash alone, bash with
      persistent synthesized tools, and programmatic tool calling) compared with Opus-4.8 and
      GPT-5.5, using a 60-tool typed catalog the authors built, GPT-5 as the simulated colleagues
      with their reliability defects patched, and the benchmark's checkpoint evaluators for grading.
    split: 174 of the 175 tasks
    source: src-arxiv-2609-11999-v1
    quote: covering service APIs and workspace operations across the 174 evaluated tasks
    note: Is Bash All You Need? (Microsoft and Carnegie Mellon University, September 2026). Bash
      alone beats typed tools by 21.8 to 24.5 points of score, so the tool interface is part of what
      a number measures. Its score is an effort-weighted checkpoint rate, and which task was left
      out is not said in the passages read; its numbers are not comparable with leaderboard rows.

lifecycle: active
lifecycle_basis:
  reason: A September 2026 paper runs the benchmark with two current models; the site repository was
    last changed on 2026-08-01, fixing a leaderboard entry (GitHub API); the newest leaderboard row
    is dated 2025-11-10; and Epoch's export marks it as in its capabilities index.
  source: src-arxiv-2609-11999-v1
  quote: We compare five tool interfaces on TheAgentCompany and APEX-Agents using Opus-4.8 and
    GPT-5.5
activity: accepting-submissions
activity_basis:
  reason: Submissions are pull requests to the experiments repository, open at any time; the board
    has never run in rounds.
  source: src-github-theagentcompany-experiments-readme
  quote: Create a pull request to this repository with the new folder.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: TTE-MatrixAgent + Deepseek-V3.2
    source: src-the-agent-company-com-leaderboard-data
    observed_on: 2026-11-04
    quote: '"model": "TTE-MatrixAgent + Deepseek-V3.2", "resolved": 42.86'
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: Each task image's encrypted evaluator, checkpoint functions the authors
  wrote, with the environment LLM called as judge on 51 tasks.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The servers install from one script with Docker, the task images are public, and the
    evaluators' decryption key is printed in the README; a run needs API access to an environment
    LLM as well as the agent's model.
  source: src-github-theagentcompany-readme
  quote: A complete list of 175 task images can be found

task:
  exists: true
  input:
    - an English instruction in /instruction/task.md that names the services' URLs, such as building
      and launching a repository's server, completing a tax-form section from company files, or
      running a sprint
    - a local workspace (a Linux container) and the self-hosted GitLab, ownCloud, Plane and
      RocketChat, with simulated colleagues reachable on RocketChat
  output: Actions through whatever interface the agent has (browser, shell, Python) that change
    files and services, post messages and leave deliverables in the workspace or the services.
  scoring: Checkpoints worth points per task, checked by Python evaluators (with an LLM judge on 51
    tasks). Full completion is 1 only when every checkpoint passes; the partial score is half the
    fraction of points earned plus half the full-completion indicator. The leaderboard reports both
    over 175 tasks as % Resolved and % Score, with average steps (LLM calls) and cost.
  tests_hidden_from_system: true
  tests_hidden_from_system_source: src-github-theagentcompany-evaluation-doc
  tests_hidden_from_system_quote: To prevent the agent from peeking at the evaluator code, all
    `/utils/evaluator.py` files, which contain the grading functions, are encrypted.
  source: src-arxiv-2412-14161-v3
  quote: Tasks are divided into checkpoints representing intermediate milestones, each assigned a
    point value to measure progress.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The task images, the servers' pre-baked data and the evaluators are public with no
    account. The evaluators are encrypted with a key printed in the README and the evaluation guide,
    which keeps an agent from reading them during an episode and is not a gate.
  access_basis:
    reason: Everything behind the headline score can be set up and decrypted from the public
      repository.
    source: src-github-theagentcompany-readme
    quote: DECRYPTION_KEY='theagentcompany is all you need'
  refresh_note: Left empty. There is one release, 1.0.0 (tagged 2024-12-20, GitHub API), and the
    experiments repository files results by version, but commits on main after the tag (to
    2025-11-17) were not read for task or evaluator changes, which decides between static and
    versioned-releases.
  data_provenance:
    - expert-authored
  data_provenance_note: The authors -- software engineers, project managers and data scientists,
    with two senior HR and administration professionals for the administration, HR and finance tasks
    -- wrote the intents, checkpoints and evaluators, drawing on O*NET's task lists, their own
    experience and lists brainstormed with language models. The intranet's content combines real
    software projects' data with data the authors curated; it is the environment, not the items.
  data_provenance_source: src-arxiv-2412-14161-v3
  data_provenance_quote: Every task in our benchmark was created by domain experts and designed to
    reflect complex and realistic workflows.
  contamination_risk: medium
  contamination_risk_note: Every task's instruction, environment and encrypted evaluator has been
    public since December 2024, with the decryption key printed, so a training route is plausible;
    no source evidences one. The encryption guards against an agent reading the evaluator during an
    episode, not against training.
  contamination_risk_source: src-github-theagentcompany-evaluation-doc
  contamination_risk_quote: To prevent the agent from peeking at the evaluator code, all
    `/utils/evaluator.py` files, which contain the grading functions, are encrypted.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: People completed every task during construction to test feasibility, but
    no human scores were recorded, and the paper names the missing comparison as a limitation.
  ceiling_anchor_type_source: src-arxiv-2412-14161-v3
  ceiling_anchor_type_quote: However, we did not collect human performance data.
  dataset_licence_note: No source read states a licence for the task data as such. GitHub reports
    MIT for TheAgentCompany/TheAgentCompany, which holds the task definitions, and for
    the-agent-company-backup-data, which holds the servers' pre-baked data (API, read 2026-11-04);
    the real projects' data imported into GitLab keeps its own licences, which were not read.
  size:
    - count: 175
      unit: tasks
      source: src-arxiv-2412-14161-v3
      quote: a set of 175 diverse, realistic and professional tasks in a software engineering
        company setting
    - count: 69
      unit: tasks
      subset: software development engineering (SDE)
      source: src-arxiv-2412-14161-v3
      quote: SDE (69 tasks) PM (28 tasks) DS (14 tasks) Admin (15 tasks) HR (29 tasks) Finance (12
        tasks) Other (8 tasks)
    - count: 29
      unit: tasks
      subset: human resources (HR)
      source: src-arxiv-2412-14161-v3
      quote: SDE (69 tasks) PM (28 tasks) DS (14 tasks) Admin (15 tasks) HR (29 tasks) Finance (12
        tasks) Other (8 tasks)
    - count: 28
      unit: tasks
      subset: project management (PM)
      source: src-arxiv-2412-14161-v3
      quote: SDE (69 tasks) PM (28 tasks) DS (14 tasks) Admin (15 tasks) HR (29 tasks) Finance (12
        tasks) Other (8 tasks)
    - count: 15
      unit: tasks
      subset: administration (Admin)
      source: src-arxiv-2412-14161-v3
      quote: SDE (69 tasks) PM (28 tasks) DS (14 tasks) Admin (15 tasks) HR (29 tasks) Finance (12
        tasks) Other (8 tasks)
    - count: 14
      unit: tasks
      subset: data science (DS)
      source: src-arxiv-2412-14161-v3
      quote: SDE (69 tasks) PM (28 tasks) DS (14 tasks) Admin (15 tasks) HR (29 tasks) Finance (12
        tasks) Other (8 tasks)
    - count: 12
      unit: tasks
      subset: finance
      source: src-arxiv-2412-14161-v3
      quote: SDE (69 tasks) PM (28 tasks) DS (14 tasks) Admin (15 tasks) HR (29 tasks) Finance (12

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The TheAgentCompany team (GitHub organisation TheAgentCompany; Carnegie Mellon
    University and collaborators)
  maintainer_basis: The code, the site, the leaderboard data and the submissions sit in the
    TheAgentCompany GitHub organisation, which names no holder. The paper's first and last authors
    are at Carnegie Mellon University and the others are independent or at Duke University; the
    affiliation line carries e-mail addresses and is not quoted.
  maintainer_type: academic-lab
  submission_process:
    - maintainer-verified
    - maintainer-run
  submission_process_note: Entrants run the evaluation themselves and open a pull request to
    TheAgentCompany/experiments with per-task evaluator results, trajectories, screenshots where
    relevant and a README naming the environment LLM. Verification is on request, by the team
    running the system on a random subset. All 17 rows read carry the site's checked flag, which the
    site's leaderboard component labels as reproduced by the team (that component was read but is
    not kept as a Source). The 13 rows dated 2024-12-17 and 2025-05-10 are the paper's own runs.
  submission_process_basis:
    reason: The maintainers state a check of submitted results before they are marked, not a re-run
      of every submission.
    source: src-github-theagentcompany-experiments-readme
    quote: We will run your model on a random subset of TheAgentCompany and verify the results.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-the-agent-company-com-leaderboard-data
      quote: '"model": "OpenHands + Claude 3.5 Sonnet", "resolved": 24.0'
    - flag: grader-from-evaluated-party
      source: src-arxiv-2412-14161-v3
      quote: Same as the NPC backbone, all LLM-based evaluators are backed by the
        Claude-3-5-Sonnet-20241022.
  independence_flags_note: The maintainers list the paper's own runs, models from Anthropic, Google,
    OpenAI, Amazon, Meta and Alibaba inside OpenHands, whose paper (the harness's citation) shares
    authors with this one. The default judge and colleagues, Claude-3-5-Sonnet-20241022, is itself a
    ranked entry, and later Anthropic models are ranked too. The work was funded by Open
    Philanthropy, which has no system on the board, so funded-by-evaluated-party is not set.
  independence_assessed: true
  funding:
    source: src-arxiv-2412-14161-v3
    quote: This work was supported by a grant from Open Philanthropy.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The servers and task containers run under Docker on an ordinary machine (30+ GB
    of disk; the baselines used an AWS t3.2xlarge, a CPU instance), so the cost of a run is
    inference for the agent and for the environment LLM. The paper's agents cost $0.3 to $6.8 per
    task (Table 1). Serving open weights locally is the entrant's choice.
  compute_tier_source: src-github-theagentcompany-readme
  compute_tier_quote: as a reference, we used Amazon EC2 t3.2xlarge instances for baselines
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: The colleagues and the judge are a hosted model. The official baselines
    used Claude-3-5-Sonnet-20241022, so their scores can be recomputed under the same conditions
    only while that snapshot is served. The vocabulary has no blocker for a hosted judge
    (taxonomy/_failures/2026-09-28-webarena-005), so blockers are left empty.
  reproducibility_tier_basis:
    reason: The servers, the task images and the evaluators are public and scripted end to end, and
      scoring is programmatic apart from the judge calls.
    source: src-github-theagentcompany-readme
    quote: Every task is a Docker image with the following structure
  harness_availability: official-harness
  harness: TheAgentCompany 1.0.0 task images, each graded by its /utils/eval.py;
    evaluation/run_eval.sh runs the OpenHands baseline over all of them.
  harness_source: src-github-theagentcompany-readme
  harness_quote: is the entrypoint to run the grading functions
  harness_gotcha:
    source: src-github-theagentcompany-evaluation-doc
    quote: Please provide the environment LLM model you use when you submit your results to the
      leaderboard.
  harness_gotcha_note: The environment LLM, which plays every colleague and every LLM judge, is the
    runner's choice; the guide asks only that it be close to claude-3-5-sonnet-20241022 or gpt-4o.
    Leaderboard rows used Claude 3.5 Sonnet, GPT-4o and Qwen Plus, and a 2026 study ran GPT-5
    colleagues after patching their missed messages, premature termination and stale state. A score
    belongs to the environment LLM as well as the agent.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for TheAgentCompany/TheAgentCompany, read 2026-11-04;
    the README's licence line is not quoted because it sits beside contact addresses.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the scaffold, which is what entrants vary, and the harness and its version
  # (OpenHands 0.14.2 or 0.28.1 in the paper); the interface and tools the agent is given, which moved a 2026
  # study's scores by over 20 points; the step budget, which the benchmark leaves to the agent (OWL's browsing
  # agent ran out of steps); and the environment LLM, which is both the simulated colleagues (user_simulator) and
  # the judge, and which differs between leaderboard rows.
  material_extra:
    - scaffold
    - harness
    - tools_allowed
    - max_steps
    - user_simulator
    - user_simulator_version
    - judge_model
    - judge_model_version

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The leaderboard ranks % Resolved over all 175 tasks and reports % Score beside it; the
    per-platform and per-category breakdowns are the paper's analysis, not ranked.
  source: src-arxiv-2412-14161-v3
  quote: we calculate two scalar agent capability metrics and two efficiency metrics
secondary_axes:
  - cost
secondary_axes_note: Cost assumes no prompt caching and covers the agent's model only. Some
  leaderboard rows omit steps and cost.
secondary_axes_basis:
  reason: The paper and the leaderboard report each run's average steps and cost per task beside the
    scores.
  source: src-arxiv-2412-14161-v3
  quote: We measure the monetary cost of querying the underlying LLMs via API.


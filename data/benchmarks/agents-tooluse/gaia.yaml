          different tools is needed.
      - source: src-hf-gaia-leaderboard-app
        quote: 'ref_level_len = {"validation": {1: 53, 2: 86, 3: 26}, "test": {1: 93, 2: 159, 3: 49}}'
    notes: 86 validation and 159 test questions.
  - id: gaia#level-3
    label: Level 3
    items: 75
    scored_separately: true
    evidence:
      - source: src-arxiv-2311-12983-v1
        quote: Level 3 are questions for a near perfect general assistant, requiring to take
          arbitrarily long sequences of actions, use any number of tools, and access to the world in
          general.
      - source: src-hf-gaia-leaderboard-app
        quote: 'ref_level_len = {"validation": {1: 53, 2: 86, 3: 26}, "test": {1: 93, 2: 159, 3: 49}}'
    notes: 26 validation and 49 test questions.
subsets_note: The levels cut across both splits; the per-level totals (146, 245, 75) are the paper's

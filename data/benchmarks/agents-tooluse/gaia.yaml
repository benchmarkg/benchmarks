  - id: gaia#test
    label: Test set (answers private)
    items: 301
    scored_separately: true
    evidence:
      - source: src-hf-gaia-leaderboard-app
        quote: 'ref_scores_len = {"validation": 165, "test": 301}'
    notes: The split the leaderboard scores.
  - id: gaia#level-1
    label: Level 1
    items: 146
    scored_separately: true
    evidence:
      - source: src-arxiv-2311-12983-v1
        quote: Level 1 questions generally require no tools, or at most one tool but no more than 5
          steps.
      - source: src-hf-gaia-leaderboard-app
        quote: 'ref_level_len = {"validation": {1: 53, 2: 86, 3: 26}, "test": {1: 93, 2: 159, 3: 49}}'
    notes: 53 validation and 93 test questions; the board shows a score per level.
  - id: gaia#level-2
    label: Level 2
    items: 245
    scored_separately: true
    evidence:
      - source: src-arxiv-2311-12983-v1

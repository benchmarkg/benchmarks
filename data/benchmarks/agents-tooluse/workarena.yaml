# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2403-07718-v5
    - src-arxiv-2403-07718
    - src-arxiv-2407-05291-v2
    - src-arxiv-2407-05291
    - src-github-workarena-readme-e885130
    - src-github-workarena-licence
    - src-github-workarena-releases
    - src-hf-api-workarena-instances
    - src-hf-browsergym-leaderboard-readme
    - src-hf-browsergym-leaderboard-genericagent-gpt-5-readme
    - src-hf-browsergym-leaderboard-ipazia-hpa-l1
    - src-hf-browsergym-leaderboard-genericagent-gpt-5-l3
    - src-hf-browsergym-leaderboard-a3-qwen-l2
    - src-arxiv-2604-07776-v1
  sources_note: >
    The two papers' PDFs (DOIs, not archived) read as text, and their abstract pages for dates and
    licences; the README and LICENSE at commit e885130962f61fb64ac305497996a46cfc7d18f0; the GitHub
    releases API for the release notes; the Hugging Face API record of the gated instance dataset,
    without accepting its terms; and five files of the leaderboard Space at revision
    294ebe1dc36ba83c6916c64c64fb870af3dc8cee (the README, GenericAgent-GPT-5's README and L3 result,
    IpaziaHPA's L1 result and A3-Qwen3.5-9B's L2 result). The Space's app.py was read for the list of
    benchmarks it ranks but is not cited. Agent-as-Annotators' v1 PDF is an existing Source, cited
    for current use. ServiceNow's developer-program terms were not read.
  confidence: medium
  review_checks:
    - check: Identity (04 S4). WorkArena++ is modelled as a track-set version (v0.4.0) adding the L2
        and L3 subsets, not as a variant or a new benchmark. The case for that is the same
        maintainer, the same repository, package and release line, and a leaderboard that scores L1,
        L2 and L3 side by side, with L1 kept unchanged. The case against is that WorkArena++ has its
        own paper, venue and name and is cited apart, and its tasks are new items built from L1's,
        which is close to the rule's "independently versioned and cited" test for a new benchmark
        linked by lineage. It is not independently versioned, which decided it here.
      field: versions
      source: src-arxiv-2407-05291-v2
      quote: WorkArena++ expands the WorkArena benchmark introduced by Drouin et al. [2024] with 682
        challenging new tasks.
    - check: Placement. web-navigation over computer-use-gui by the latter's exclusion (tasks
        confined to a web application in a browser), although the papers frame the agents as UI
        assistants and the ServiceNow UI is a complex enterprise GUI with nested iframes and shadow
        DOMs. society-econ-law was rejected by its exclusion for autonomous operation.
      field: domain
      source: src-arxiv-2403-07718-v5
      quote: Recent advancements in the fields of large language and vision models have seen the
        rapid development of UI assistants, particularly web agents acting through a browser
    - check: The benchmark-level facets come from the L1 paper (context-integration only), and the
        L2 and L3 subsets override them from WorkArena++ (planning, memory-retention, honesty, and
        long-horizon-autonomy as a domain secondary). Whether honesty fits infeasible tasks that are
        scored on declaring infeasibility, and whether planning's exclusion (a score on the end
        state, not the sequence) should remove it, as for webarena.
      field: subsets
      source: src-arxiv-2407-05291-v2
      quote: we introduce a set of infeasible tasks to verify if the agent can identify them
    - check: Dashboard answers pass when they contain the key numbers and labels, which has no term
        (as webarena's must_include); exact-match is tagged for the knowledge-base check against a
        set of acceptable answers, which is membership in a list of references rather than equality
        with one.
      field: evaluation_method
      source: src-arxiv-2403-07718-v5
      quote: validation proceeds by verifying if the answer returned by the agent is within a set of
        acceptable answers
    - check: Execution depends on ServiceNow, the maintainer's own company, in two ways the
        vocabulary cannot record. The platform is a hosted product that changes under the benchmark,
        and since v0.5.0 the instances come from a maintainer-run pool behind a form whose approval
        is automatic per the API record (gated "auto") but whose terms restrict use to benchmark
        evaluation. If that pool closes and developer instances no longer work with the current
        release, the tier would become not-independently-reproducible. Whether the
        developer-instance route still works with v0.5.x was not checked.
      field: execution.reproducibility_tier
      source: src-hf-api-workarena-instances
      quote: I agree to use the provided WorkArena instances for benchmark evaluation only (and not
        for training or production usage)
    - check: data.access fully-open treats the instance as environment rather than data. A reviewer
        may read the gated instance form as gated-registration, because no run is possible without
        passing it (or registering with ServiceNow's developer program).
      field: data.access
      source: src-github-workarena-readme-e885130
      quote: Fill the form, accept the terms to gain access to the gated repository and wait for
        approval.
    - check: The A3-Qwen3.5-9B leaderboard row calls its L2 run "341 tasks (full benchmark)", while
        its paper says it reports L2 on the 185-task test split only; its study id ends in
        "workarena-l2-test-test". Which split the 10.6 is on is unresolved, and the leaderboard does
        not record the split.
      field: as_used
      source: src-hf-browsergym-leaderboard-a3-qwen-l2
      quote: '"comments": "341 tasks (full benchmark).'
    - check: The leaderboard ranks rows that did not follow the protocol (raised step caps) beside
        rows that did, distinguished only by a column; the top L1 (90.3) and GPT-5's L3 row (11.5,
        at 100 steps) are among them. A headline from the board needs that column.
      field: execution.harness_gotcha
      source: src-hf-browsergym-leaderboard-genericagent-gpt-5-l3
      quote: '"comments": "Increased max_steps from 50 to 100",'
    - check: Versions. Breaking is set only on v0.2.1, which changed the task set; v0.4.0's
        dashboard bug fix, v0.4.3 and v0.4.4's dashboard and report fixes and v0.5.2 and v0.5.3's
        reward-hacking fixes change validators that L1 scores depend on, and no source says whether
        scores before and after compare.
      field: versions
      source: src-github-workarena-releases
      quote: Fix issues that allowed agents to break the UI by reward hacking
    - check: ceiling_anchor_type crowd-average rests on the WorkArena++ human study (L2 and L3 only,
        98 instances, volunteers including members of ServiceNow's research team). L1 has no
        measured human baseline.
      field: data.ceiling_anchor_type
      source: src-arxiv-2407-05291-v2
      quote: Most had little to no familiarity with ServiceNow products
    - check: maintainer-competes-on-own-benchmark rests on GenericAgent being the maintainers'
        AgentLab agent around other developers' models, as for webarena's maintainer rows; who
        submitted the GenericAgent rows is not stated.
      field: governance.independence_flags

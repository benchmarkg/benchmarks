# data/benchmarks/agents-tooluse/workarena.yaml
#
# P1-S9-T02, agents-tooluse entry 19. Filled from the WorkArena paper, arXiv 2403.07718 read as its v5 PDF
# (2024-07-23, ICML 2024), and its abstract page; the WorkArena++ paper, arXiv 2407.05291 read as its v2 PDF
# (2025-02-05, NeurIPS 2024 Datasets and Benchmarks), and its abstract page; the repository's README and LICENSE
# pinned at commit e885130 (2026-09-28) and its GitHub releases (API); the Hugging Face API record of the gated
# ServiceNow/WorkArena-Instances dataset; and the BrowserGym leaderboard Space pinned at revision 294ebe1, read
# through its README, one agent's README and three result files (two of them from 2026 entrants). Current use is
# also from the v1 PDF of Agent-as-Annotators (arXiv 2604.07776, April 2026), already a Source. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is the WorkArena family. WorkArena++ (L2 and L3) is a track-set of it, not a separate benchmark:
# the same ServiceNow Research team ships it in the same repository, package and release line, and the
# leaderboard scores L1, L2 and L3 side by side (see versions, subsets and the first review check).

id: workarena
name: WorkArena
aliases:
  - WorkArena++
tagline: Web agents do knowledge work on a ServiceNow instance, from 33 atomic tasks (L1) to 682
  compositional ones (L2, L3).
description: >
  A benchmark from ServiceNow Research of tasks that knowledge workers do in enterprise software,
  run on real cloud instances of the ServiceNow platform through BrowserGym, the authors' browser
  environment. An agent receives a natural-language goal in a chat panel and observes the page as
  HTML, an accessibility tree or a screenshot, acting through BrowserGym's actions (element- or
  coordinate-based primitives, or Python with Playwright) until it stops or runs out of steps. A
  validator then inspects the instance's database and the open page through ServiceNow's APIs and
  returns success or failure; every task also ships an oracle that solves it with Playwright. The
  first level, L1 (ICML 2024), has 33 atomic tasks and 19,912 instances generated from
  human-designed templates: filtering and sorting lists, filling forms, ordering from service
  catalogs, reading dashboards, navigating menus and answering from a knowledge base of articles
  GPT-4 wrote. WorkArena++ (NeurIPS 2024) adds 682 tasks that chain atomic tasks into workflows,
  341 given as explicit steps (L2) and the same 341 given only as a ticket that points to the
  knowledge base (L3), across planning, information retrieval, data-driven decision-making,
  memorization and infeasible tasks the agent must recognise; evaluation seeds 0-9 sample a 235-instance
  curriculum per level. In the papers GPT-4o reaches 42.7% on L1 and almost nothing on L2 and L3,
  while 15 volunteers new to ServiceNow solve 93.9% of a 98-instance curriculum. The BrowserGym
  leaderboard, a Hugging Face Space that takes results by pull request, lists L1, L2 and L3
  separately; its top L1 row (90.3) raised the step cap and is marked as not following the
  protocol. Running it needs a ServiceNow instance: a free Personal Developer Instance in the papers,
  and since November 2025 an instance from a maintainer-run pool behind a gated form, for benchmark
  evaluation only.
self_description:
  source: src-arxiv-2403-07718-v5
  quote: we propose WorkArena, a remote-hosted benchmark of 33 tasks based on the widely-used
    ServiceNow platform
external_ids:
  arxiv: '2403.07718'
paper:
  title: 'WorkArena: How Capable are Web Agents at Solving Common Knowledge Work Tasks?'
  arxiv: '2403.07718'
  version_read: v5
  source: src-arxiv-2403-07718-v5
released: 2024-03-12
released_note: The paper's first arXiv version, as the abstract page dates it. The repository was
  created on 2024-02-28 (GitHub API) and its first tag, v0.0.1a10, is dated 2024-03-12.
released_source: src-arxiv-2403-07718
released_quote: Submitted on 12 Mar 2024 (v1)
release_venue: ICML 2024
release_venue_note: WorkArena++ appeared at NeurIPS 2024 in the Datasets and Benchmarks track.
release_venue_source: src-arxiv-2403-07718-v5
release_venue_quote: Proceedings of the 41 st International Conference on Machine Learning, Vienna,
  Austria.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: agents-tooluse/web-navigation
  primary_basis:
    reason: An agent completes work tasks by acting on the pages of a ServiceNow instance in a
      browser, and a validator checks the instance's database and page afterwards. The tasks stay
      inside one web application in a browser, which computer-use-gui's exclusion sends here.
    source: src-arxiv-2403-07718-v5
    quote: We study the use of large language model-based agents for interacting with software via
      web browsers.
domain_considered_and_rejected:
  - term: agents-tooluse/computer-use-gui
    reason: The paper frames its agents as UI assistants and the UI is a complex graphical one, but
      the agent acts only on web pages inside a browser, which the term's exclusion (and its
      webarena near miss) assigns to web-navigation.
  - term: society-econ-law/economically-valuable-work
    reason: The tasks are drawn from knowledge workers' daily work, but the score is whether the
      agent operated the software to the required state, which the family's exclusion ("autonomous
      operation rather than the economic value of the output") keeps in agents-tooluse; nothing is
      compared against human work product.
  - term: agents-tooluse/tool-api-calling
    reason: The validators call ServiceNow's REST and JavaScript APIs, but the agent does not; it
      acts through browser primitives, and the Python action space is a way of driving the browser.
    source: src-arxiv-2407-05291-v2
    quote: Task validation then inspects both the state of the database and any open page using
      backend (REST) and frontend (JS) ServiceNow APIs.
  - term: agents-tooluse/long-horizon-autonomy
    reason: For L1 the tasks are atomic interactions with one UI component, a few to a few dozen
      oracle actions each. The L2 and L3 subsets, whose workflows run to a 50-step cap, carry it as
      a secondary of their own (subsets).
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: The knowledge-base and dashboard tasks are answered from material the instance supplies
      (articles generated around a list of facts, and the charts on a dashboard), not from what the
      agent already knows; the validator checks the answer against that material.
    source: src-arxiv-2403-07718-v5
    quote: These tasks are constructed by starting from a list of facts, generating articles
      containing each fact with GPT-4
capability_considered_and_rejected:
  - term: planning
    reason: L1 goals spell out everything needed, and the WorkArena++ paper says the L1 tasks need
      no complex problem solving, so no source claims planning for L1. WorkArena++ claims it for L2
      and L3, which carry it as an override (subsets).
    source: src-arxiv-2407-05291-v2
    quote: While challenging, the tasks included in WorkArena do not require complex problem-solving
      skills.
  - term: long-horizon-execution
    reason: L1 episodes are capped at 15 steps, and the oracle needs from one to about 47 actions
      per task; no source says an intermediate error makes success unattainable. Not claimed for L2
      and L3 either, whose sources speak of memorization and planning instead.
    source: src-arxiv-2403-07718-v5
    quote: In all tasks we give our agents a maximum of 15 steps per episode
  - term: instruction-following
    reason: The goals are explicit instructions, but the validator scores whether the task was done,
      not compliance with directions apart from the outcome, and no source claims instruction
      following.
    source: src-arxiv-2403-07718-v5
    quote: explicitely provides all the information required to solve the task
  - term: tool-use
    reason: No callable tool or API is exposed to the agent or scored; it acts on the web page
      through BrowserGym's browser actions.
  - term: quantitative-reasoning
    reason: The dashboard tasks ask for a value or a minimum or maximum read off a chart, which the
      term's exclusion ("read off a supplied table without manipulation") covers.
  - term: perception
    reason: A screenshot is available, but the paper's agents read the accessibility tree, and no
      score depends on visual perception as such.

evaluation_method:
  - environment-state-check
  - exact-match
evaluation_method_note: Lists are checked on the page (the filter or sort the agent built), forms
  and catalog orders by querying the instance's database for the records the agent created, menu and
  impersonation tasks by the page reached or the user logged in. Knowledge-base answers pass when
  they are in a set of acceptable answers (GPT-4 generated the alternative formats); dashboard
  answers pass when they contain the key numbers and labels, which has no term of its own
  (taxonomy/_failures/2026-11-04-workarena-002; see review_checks). Each validator returns a reward
  of 0 or 1.
evaluation_method_basis:
  reason: Programs inspect what the agent changed in the instance (database records, list settings,
    the page and the logged-in user) after or during the episode, so any trajectory that reaches the
    required state passes; the retrieval tasks check the returned answer against stored references.
  source: src-arxiv-2403-07718-v5
  quote: validation proceeds by querying the database to retrieve entries created by the agent and
    verifying that their values are as expected
evaluation_method_considered_and_rejected:
  - term: constraint-check
    reason: The list validators check that the list satisfies the expected conditions, but what they
      read is the state of the page the agent left, which is environment-state-check.
    source: src-arxiv-2403-07718-v5
    quote: client-side validation is used to verify that the resulting list satisfies the expected
      conditions
  - term: model-graded-judge
    reason: GPT-4 generated the knowledge-base articles, questions and alternative answers when the
      benchmark was built; no model grades a run.
designed_for_subjects:
  - agent-scaffold
  - model-in-benchmark-harness
  - human-nonexpert
designed_for_subjects_note: agent-scaffold because BrowserGym leaves the agent's design to the
  entrant, and leaderboard rows such as IpaziaHPA bring their own agent. model-in-benchmark-harness
  for the papers' runs and the leaderboard's GenericAgent rows, a provider's model inside AgentLab's
  GenericAgent. human-nonexpert for WorkArena++'s human baseline, 15 volunteers with little or no
  familiarity with ServiceNow, on the same interface as the agents.
designed_for_subjects_basis:
  reason: The environment fixes observations and actions but not the agent, so the scaffold is what
    entrants vary and what a comparison has to name.
  source: src-arxiv-2403-07718-v5
  quote: 'Flexible agent design: BrowserGym offers an extensive list of features but does not impose any
    restriction on how web agents should be implemented.'
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: The WorkArena++ participants were not recruited for ServiceNow expertise; most had
      little or none and received half an hour of training.
    source: src-arxiv-2407-05291-v2
    quote: Most had little to no familiarity with ServiceNow products
observed_subjects:
  values:
    - model-in-benchmark-harness
    - agent-scaffold
  basis: Most WorkArena rows on the BrowserGym leaderboard are GenericAgent, the maintainers'
    AgentLab agent, around a provider's model (GPT-5, Claude, Llama, gpt-oss); a few are agents of
    their own, such as IpaziaHPA and the fine-tuned A3-Qwen3.5-9B run in GenericAgent.
  source: src-hf-browsergym-leaderboard-genericagent-gpt-5-readme
as_used:
  - protocol: BrowserGym and AgentLab's GenericAgent, with L1 on its full task set and L2 on
      BrowserGym's official test split.
    split: L1's 330 episodes (33 tasks with 10 seeds) and L2's 185-task test split (its other 156
      tasks are a train split)
    source: src-arxiv-2604-07776-v1
    quote: WorkArena L2 (185 test / 156 train)
    note: Agent-as-Annotators (April 2026) reports on the L2 test split to avoid training-data
      contamination, while its leaderboard row describes its L2 run as 341 tasks (see
      review_checks).

lifecycle: active
lifecycle_basis:
  reason: The leaderboard took new WorkArena rows in 2026 (IpaziaHPA in March, A3-Qwen3.5-9B in
    April), the maintainers released v0.5.2 and v0.5.3 in early 2026 against reward hacking, and the
    repository was last pushed on 2026-09-28 (GitHub API).
  source: src-hf-browsergym-leaderboard-ipazia-hpa-l1
  quote: '"date_time": "2026-03-07 00:38:00",'
activity: accepting-submissions
activity_note: The leaderboard is shared with WebArena, MiniWoB and other BrowserGym benchmarks and
  has never run in rounds.
activity_basis:
  reason: The Space's README tells entrants to add a results folder and open a pull request, and
    says how to add reproductions of existing rows.
  source: src-hf-browsergym-leaderboard-readme
  quote: Open the community tab and press

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GenericAgent-GPT-5 (gpt-5-2025-08-07)
    source: src-hf-browsergym-leaderboard-genericagent-gpt-5-readme
    observed_on: 2026-11-04
    quote: It uses gpt-5 (gpt-5-2025-08-07) as a backend
  - system: A3-Qwen3.5-9B (Agent-as-Annotators)
    source: src-hf-browsergym-leaderboard-a3-qwen-l2
    observed_on: 2026-11-04
    quote: Fine-tuned on A3-Synth trajectories via the Agent-as-Annotators framework.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: Each task's validator, with its setup, teardown and oracle, in the
  open-source browsergym-workarena package; WorkArena++ composes the validators and oracles of the
  atomic tasks.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The tasks, validators and an installer for the instance are open source, and anyone can
    obtain an instance, from ServiceNow's free developer program (the papers) or from the
    maintainers' pool through a gated form (since v0.5.0). The platform itself is ServiceNow's
    hosted product and cannot be pinned (execution).
  source: src-arxiv-2403-07718-v5
  quote: Tasks are executed on Personal Developer Instances, which are real cloud-based instances of
    the ServiceNow product, accessible for free through their developer program.

task:
  exists: true
  input:
    - a natural-language goal sent as the first chat message (L1, L2) or a ticket shown on the
      starting page that points to a knowledge-base article (L3)
    - the chat, the open tabs and the active page as HTML, an accessibility tree and a screenshot,
      with element identifiers and the last action's error
  output: One BrowserGym action per step (element- or coordinate-based primitives, tab and
    navigation actions, a chat message, declaring the task infeasible, or Python with Playwright),
    within 15 steps for L1 and 50 for L2 and L3 in the papers' protocol.
  scoring: Binary success per task instance from its validator, which inspects the instance's
    database and the open page (and the chat, for answers); the headline is the mean success rate
    per level, with a stratified-bootstrap standard error.
  reference_solution: true
  reference_solution_note: Every task has an oracle (cheat) function that solves it with Playwright.
  source: src-arxiv-2403-07718-v5
  quote: The oracle functions are hand-crafted solutions that automatically complete the tasks using
    Playwright browser automation

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The task generators, validators, oracles and the knowledge-base and instance
    configuration ship in the open-source repository and package. What is gated is the environment;
    since v0.5.0 the README sends users to a gated Hugging Face form (full name, organisation,
    professional e-mail, research context) for an instance from the maintainers' pool, to be used
    for benchmark evaluation only; the papers used free Personal Developer Instances from
    ServiceNow's developer program instead (see review_checks).
  access_basis:
    reason: Everything that defines and scores a task is published code; the gate is on the hosted
      environment the tasks run in.
    source: src-arxiv-2407-05291-v2
    quote: WorkArena consists of open-source code that interacts with ServiceNow instance APIs and
      does not rely on any proprietary code.
  refresh: versioned-releases
  refresh_note: Releases on GitHub and PyPI (browsergym-workarena) from v0.0.1a10 to v0.5.3
    (2026-02-03); main has commits after v0.5.3 that were not read for task changes.
  refresh_basis:
    reason: Task sets change under release tags with notes, such as v0.4.0, which added the
      compositional tasks.
    source: src-github-workarena-releases
    quote: 600+ Complex, compositional tasks
  data_provenance:
    - synthetic-procedural
    - model-generated
  data_provenance_note: Instances come from human-designed templates filled with predefined values,
    and L2 and L3 sample configurations from a seed. The knowledge base's 100 articles, the
    questions about them and the alternative answers were generated by GPT-4 (and checked with
    GPT-3.5); the templates, validators and oracles were written by the authors, whose expertise no
    source describes, so expert-authored is not set.
  data_provenance_source: src-arxiv-2403-07718-v5
  data_provenance_quote: Each goal is automatically generated from a human-designed template filled
    with pre-defined values
  contamination_risk: medium
  contamination_risk_note: Every template, validator and oracle is public, and WorkArena++ offers
    the oracles as a generator of ground-truth traces for fine-tuning, so training on the very tasks
    is a plausible and invited route. The maintainers reserve seeds 0-9 for evaluation and ask for
    tuning on other seeds, and BrowserGym splits L2 into train and test tasks; no source read
    evidences training on the scored seeds or tasks. Agent-as-Annotators reports on the L2 test
    split for this reason.
  contamination_risk_source: src-arxiv-2407-05291-v2
  contamination_risk_quote: We reserve seeds 0-9 for evaluation and the remaining seeds may be used
    for agent tuning
  contamination_evidence: []
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: 93.9% from 15 volunteers (ServiceNow researchers and local students,
    most with little or no ServiceNow familiarity) on a 98-instance human curriculum of L2 and L3
    tasks, against 2.1% for GPT-4o on the same instances. No human baseline was measured for L1; the
    WorkArena paper only calls the list tasks fairly simple for a human.
  ceiling_anchor_type_source: src-arxiv-2407-05291-v2
  ceiling_anchor_type_quote: with an overall 93.9% success rate for humans and 2.1% for GPT-4o
  dataset_licence: Apache-2.0
  dataset_licence_note: The tasks are code in the repository, whose LICENSE file is Apache 2.0
    (GitHub's metadata reports NOASSERTION because of the file's copyright header). The instances
    are ServiceNow's product under separate terms, which were not read.
  dataset_licence_source: src-github-workarena-licence
  dataset_licence_quote: Licensed under the Apache License, Version 2.0
  size:
    - count: 33
      unit: L1 atomic tasks
      subset: L1
      source: src-arxiv-2403-07718-v5
      quote: WorkArena consists of a suite of 33 tasks and 19,912 unique instances
    - count: 19912
      unit: L1 task instances
      subset: L1
      source: src-arxiv-2403-07718-v5
      quote: WorkArena consists of a suite of 33 tasks and 19,912 unique instances
    - count: 682
      unit: compositional tasks (341 workflows, each at L2 and L3)
      subset: L2 and L3 (WorkArena++)
      source: src-arxiv-2407-05291-v2
      quote: This makes for 2×341 = 682 tasks in total.
    - count: 470
      unit: task instances in the agent curriculum (235 per level)
      subset: L2 and L3 evaluation curriculum, seeds 0-9
      source: src-arxiv-2407-05291-v2
      quote: for all 470 L2/L3 task instances in the agent curriculum
    - count: 98
      unit: task instances
      subset: the human curriculum
      source: src-arxiv-2407-05291-v2
      quote: we devised a shorter curriculum comprising 98 task instances
    - count: 185
      unit: tasks
      subset: BrowserGym's L2 test split
      source: src-arxiv-2604-07776-v1
      quote: WorkArena L2 (185 test / 156 train)
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: ServiceNow Research (the WorkArena and BrowserGym team)
  maintainer_basis:
    reason: Both papers are by ServiceNow Research with Mila and university co-authors (the
      affiliation lines carry e-mail addresses and are not quoted); the repository, the instance
      pool and the leaderboard Space are ServiceNow's.
    source: src-github-workarena-licence
    quote: Copyright 2024 ServiceNow
  maintainer_type: industry-lab
  submission_process:
    - self-reported
  submission_process_note: Entrants add a results folder (a README describing the agent and one JSON
    file per benchmark, with an AgentLab study id) by pull request to the Space, declaring
    themselves whether they followed the evaluation protocol and whether the result is reproducible;
    others can append reproductions. No source says the maintainers rerun or check entries. The
    GenericAgent rows are the maintainers' agent, but who ran each is not stated.
  submission_process_source: src-hf-browsergym-leaderboard-readme
  submission_process_quote: '"followed_evaluation_protocol": "Yes/No",'
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-hf-browsergym-leaderboard-genericagent-gpt-5-readme
      quote: This agent is [GenericAgent]
  independence_flags_note: GenericAgent, from ServiceNow's AgentLab, is the scaffold of most rows,
    so the maintainers' own agent design is ranked beside outside agents, though the models in it
    are other developers'. ServiceNow also sells the platform the benchmark runs on; the vocabulary
    has no flag for a benchmark built on its maintainer's commercial product
    (taxonomy/_failures/2026-11-04-workarena-003). No funding statement was found in either paper.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The instance is free (a developer instance or one from the maintainers' pool)
    and the browser runs on an ordinary machine, so the cost of a run is inference for the agent.
    The papers served Llama 3 and Mixtral on four A100s, which is the entrant's choice.
  compute_tier_source: src-github-workarena-releases
  compute_tier_quote: We manage a pool of instances, and benchmarking load is balanced across these.
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: A fresh run is automatic end to end, but against a ServiceNow instance
    the entrant does not control. The platform is a hosted commercial product that ServiceNow
    upgrades (the paper keeps the oracles partly to find tasks broken by platform updates), and
    since v0.5.0 the instances come from a pool the maintainers run behind an access form; neither
    is a blocker in the vocabulary, so blockers are left empty
    (taxonomy/_failures/2026-11-04-workarena-001; see review_checks).
  reproducibility_tier_basis:
    reason: Task setup, validation and teardown are code, and WorkArena++ adds an installer that
      standardises the instance and a fresh user account per task.
    source: src-arxiv-2407-05291-v2
    quote: we implement sandboxing by running each task in a new user account, created at its start
      and automatically deleted at its end
  harness_availability: official-harness
  harness: browsergym-workarena (the WorkArena task package) in BrowserGym; the README recommends
    AgentLab for parallel runs and leaderboard reporting. The WorkArena paper's results use
    BrowserGym v0.3.5 and WorkArena v0.3.0.
  harness_source: src-github-workarena-readme-e885130
  harness_quote: The preferred way to evaluate on WorkArena is with
  harness_gotcha:
    source: src-hf-browsergym-leaderboard-ipazia-hpa-l1
    quote: '"comments": "Increased max_steps from 15 to 30",'
  harness_gotcha_note: The protocol caps episodes at 15 steps for L1 and 50 for L2 and L3;
    leaderboard rows that raised the cap (the top L1 row, GPT-5's L3 row at 100 steps) are flagged
    as not following the protocol but still ranked. v0.5.2 and v0.5.3 changed tasks against agents
    that break the UI to collect reward, so scores from earlier releases may not compare.
  code_licence: Apache-2.0
  code_licence_source: src-github-workarena-licence
  code_licence_quote: Licensed under the Apache License, Version 2.0
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile (environment-state-check pairs with no profile): the scaffold, which entrants vary
  # and GenericAgent's flags tune (the paper's ablations move L1 by several points); the harness and its version
  # (BrowserGym and WorkArena releases, the latter changing tasks and validators); the step cap (15 for L1, 50
  # for L2/L3, raised by some leaderboard rows); and the context the agent may use, since the papers truncate the
  # accessibility tree to each model's limit. The level and split (L1, L2, L3, BrowserGym's L2 test split, the
  # human curriculum) are subset_used, already in the fallback.
  material_extra:
    - scaffold
    - harness
    - max_steps
    - context_window_used

aggregation_policy: official-aggregate
aggregation_policy_note: One official figure per level, the mean success rate over its instances (L1
  over 33 tasks with 10 seeds; L2 and L3 over the 235-instance curriculum each), with per-category
  means beside it; neither the papers nor the leaderboard combine the levels.
aggregation_policy_basis:
  reason: The WorkArena++ table bolds the average over each level as its headline.
  source: src-arxiv-2407-05291-v2
  quote: Bolded numbers represent the average success rate over the entire corresponding benchmark.


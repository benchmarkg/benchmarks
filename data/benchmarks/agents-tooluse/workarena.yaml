      a bug fix in the dashboard tasks. The L1 tasks are kept. The paper's first version
      (2024-07-07) preceded the release.
    supersedes_version: v0.3.0
    superseded_by: v0.5.0
    frozen: true
    sources:
      - src-github-workarena-releases
      - src-arxiv-2407-05291-v2
  - version: v0.5.0
    label: Managed instance pool
    version_kind: revision
    released: 2025-11-24
    changes: Users no longer set up their own developer instances; the maintainers run a pool of
      instances, reached through the gated Hugging Face dataset. v0.4.2 to v0.4.4 (July to August
      2025) had fixed the installer and the dashboard and report tasks.
    supersedes_version: v0.4.0
    superseded_by: v0.5.3
    frozen: true
    sources:
      - src-github-workarena-releases
      - src-hf-api-workarena-instances
  - version: v0.5.3
    label: Reward-hacking fixes
    version_kind: revision
    released: 2026-02-03
    changes: v0.5.2 (2026-01-22) and v0.5.3 fix tasks in which agents could break the UI to collect
      reward; v0.5.1 fixed the knowledge-base install check. The newest release read.
    supersedes_version: v0.5.0
    frozen: true
    sources:

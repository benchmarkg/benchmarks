subsets:
  - id: workarena#l1
    label: L1, the 33 atomic tasks (WorkArena, ICML 2024)
    items: 33
    scored_separately: true
    evidence:
      - source: src-arxiv-2403-07718-v5
        quote: WorkArena consists of a suite of 33 tasks and 19,912 unique instances
    notes: Lists (12), forms (5), knowledge base (1), service catalogs (9), dashboards (4) and menus
      (2), with 15 steps per episode; scored over 10 seeds per task (330 episodes). The
      leaderboard's WorkArena-L1.
  - id: workarena#l2
    label: L2, compositional workflows with explicit steps (WorkArena++)
    items: 341
    scored_separately: true
    domain_override:
      primary: agents-tooluse/web-navigation
      secondary:
        - agents-tooluse/long-horizon-autonomy
    capability_override:
      - context-integration
      - planning
      - memory-retention
      - honesty
    evidence:
      - source: src-arxiv-2407-05291
        quote: we propose WorkArena++, a novel benchmark consisting of 682 tasks corresponding to
          realistic workflows routinely performed by knowledge workers
      - source: src-arxiv-2407-05291-v2
        quote: which each cover the same set of 341 workflows presented to the agent in different
          ways
      - source: src-arxiv-2407-05291-v2
        quote: we run our agents for a maximum of 50 time-steps before the tasks are terminated
      - source: src-arxiv-2407-05291-v2
        quote: We evaluate these abilities through tasks that require decision-making under
          constraints to achieve an expected outcome.
      - source: src-arxiv-2407-05291-v2
        quote: memorizing key details along the way, and finally using it to achieve a specific goal
      - source: src-arxiv-2407-05291-v2
        quote: we introduce a set of infeasible tasks to verify if the agent can identify them
    notes: The goal lists the steps; the agent still has to work out how to do each in the UI. Five
      skill categories (planning and problem solving, information retrieval, data-driven
      decision-making, sophisticated memorization, infeasible tasks), scored on a 235-instance
      curriculum with a 50-step cap. planning because the paper claims it and each episode is scored
      against an explicit goal; memory-retention for details carried across pages; honesty because
      infeasible tasks reward declaring, and sometimes justifying, that the task cannot be done. The
      leaderboard's WorkArena-L2.
  - id: workarena#l2-browsergym-test
    label: BrowserGym's L2 test split
    parent: workarena#l2
    items: 185
    scored_separately: true
    evidence:
      - source: src-arxiv-2604-07776-v1
        quote: WorkArena L2 (185 test / 156 train)
    notes: BrowserGym's official split of the L2 tasks; papers that train on WorkArena report on it,
      and its other 156 tasks are a train split.
  - id: workarena#l3
    label: L3, the same workflows given through a ticket and the knowledge base (WorkArena++)
    items: 341
    scored_separately: true
    domain_override:
      primary: agents-tooluse/web-navigation
      secondary:
        - agents-tooluse/long-horizon-autonomy
    capability_override:
      - context-integration
      - planning
      - memory-retention
      - honesty
    evidence:
      - source: src-arxiv-2407-05291-v2
        quote: the agent must memorize the task details from a web page and retrieve instructions
          from a knowledge base before organizing its steps to succeed
    notes: The agent is told only to complete the task; the ticket on the starting page gives the
      details and points to a knowledge-base article with the rules. Same five categories and
      curriculum as L2. No paper agent solved any L3 task. The leaderboard's WorkArena-L3.

lineage:
  role: root
lineage_note: WorkArena++ is a track-set version with the L2 and L3 subsets, not a variant or fork
  (see the header and the first review check). The BrowserGym leaderboard also ranks other
  benchmarks (WebArena, MiniWoB, VisualWebArena, WebLINX, AssistantBench); it is a shared board, not
  part of this benchmark.

history:
  - date: 2025-11-24
    event: access-changed
    field: data.access
    from: a Personal Developer Instance each user requests from ServiceNow's developer program
    to: an instance from the maintainers' pool, after a gated Hugging Face form, for benchmark use
      only
    source: src-github-workarena-releases
    quote: Users no longer need to create and setup personal developer instances to use WorkArena.
    note: data.access stays fully-open (the tasks are code); what changed is how the environment is
      obtained. The gate's terms are in src-hf-api-workarena-instances.


# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2508-14704-v1
    - src-arxiv-2508-14704
    - src-neurips-2025-poster-124527
    - src-github-mcp-universe-readme
    - src-mcp-universe-site
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date and the evaluator
    types; the NeurIPS virtual-site page for the venue; the README at main; and the project site's landing
    page, whose leaderboard is static HTML. The site prints the authors' contact addresses, so its Source
    is withheld from archiving and its windows leave them out. The OpenReview version, the repository's
    task files and the site's other pages (Tasks, Docs, MCP Hub, Contributions) were not read as Sources.
  confidence: medium
  review_checks:
    - check: Domain primary tool-api-calling with web-navigation secondary for the
        browser-automation domain. agent-evaluation-suites is the alternative reading if the six
        application domains are taken as spanning family subdomains (web, research, software, tool
        calling).
      field: domain
    - check: The repository's task tree at commit 0df6c42 (GitHub API, not a quoted Source) holds
        232 task files in seven folders, among them 25 in a multi_server folder absent from the
        paper, and smaller per-domain counts than Table 2 (location navigation 35 against 45, web
        search 50 against 55, browser automation 35 against 39, repository management 28 against
        33). The leaderboard's percentages still fit the paper's denominators (33.33% of 45).
        Whether tasks were regrouped or changed, and in which release, decides data.refresh and
        versions, both left empty.
      field: data.refresh
    - check: Time-varying answers. 48 of 84 evaluators are dynamic, and the paper asserts stable
        results across timestamps without measuring it; static evaluators also call live services (a
        place's type on Google Maps), and browser tasks are dated relative to the run. A rerun
        months apart may not be comparable; date_evaluated is made material.
      field: execution.reproducibility_tier
      source: src-arxiv-2508-14704-v1

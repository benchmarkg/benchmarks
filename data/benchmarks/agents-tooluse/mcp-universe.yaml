# data/benchmarks/agents-tooluse/mcp-universe.yaml
#
# P1-S9-T02, agents-tooluse entry 20. Filled from the MCP-Universe paper, arXiv 2508.14704 read as its v1 PDF
# (2025-08-20, its only arXiv version), and its abstract page; the NeurIPS 2025 virtual-site page of its workshop
# poster, for the venue; the README of SalesforceAIResearch/MCP-Universe at main, with GitHub's API for licence,
# releases, pushed_at and the task tree; and the project site mcp-universe.github.io, whose landing page carries
# the leaderboard as static HTML (scripts and styles stripped; the host serves no robots.txt). Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts. No API key was used and
# no task was run.

id: mcp-universe
name: MCP-Universe
aliases:
  - MCPUniverse
tagline: LLM agents complete 231 tasks on 11 real MCP servers, scored by execution-based evaluators,
  some with live ground truth.
description: >
  A benchmark of 231 hand-written tasks in six domains (location navigation, repository management, financial
  analysis, 3D design, browser automation and web searching) that an LLM agent completes by calling the
  tools of real Model Context Protocol servers: Google Maps, GitHub, Yahoo Finance, Blender, Playwright,
  Google Search and Fetch, with Notion, weather, date and calculator servers in support, 133 tools in
  all. Each task gives a user instruction and an output format and connects only the servers it needs.
  Success is binary: a task passes when every one of its execution-based evaluators passes. Format evaluators
  check the output's structure; static evaluators compare time-invariant answers with collected ground
  truth; dynamic evaluators query the live services at scoring time for answers that change (flight prices,
  weather, issue counts); some evaluators query the end state the agent left, such as the branches of
  a GitHub repository. Tasks were kept only if models could not solve them without the servers or consistently
  within five retries. The paper runs 16 LLMs through the framework's ReAct agent (GPT-5 43.72% overall),
  and the site's leaderboard ranks models in a ReAct track, a function-calling track and an agent track.
self_description:
  source: src-arxiv-2508-14704-v1
  quote: we introduce MCP-Universe, the first comprehensive benchmark specifically designed to
    evaluate LLMs in realistic and hard tasks through interaction with real-world MCP servers
external_ids:
  arxiv: '2508.14704'
paper:
  title: 'MCP-Universe: Benchmarking Large Language Models with Real-World Model Context Protocol Servers'
  arxiv: '2508.14704'
  version_read: v1
  source: src-arxiv-2508-14704-v1
released: 2025-08-20
released_note: The paper's arXiv submission, as the abstract page dates it. The repository was
  created on 2025-05-02 and its first code release, v1.0.0, is dated 2025-09-04 (GitHub API); no
  source read dates the public release of the tasks.
released_source: src-arxiv-2508-14704
released_quote: Submitted on 20 Aug 2025
release_venue: NeurIPS 2025 Workshop on Scaling Environments for Agents (poster)
release_venue_source: src-neurips-2025-poster-124527
release_venue_quote: 'Poster in Workshop: Workshop on Scaling Environments for Agents'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: agents-tooluse/tool-api-calling
  secondary:
    - agents-tooluse/web-navigation
domain_basis:
  reason: One agent completes each task by selecting and invoking the tools of real MCP servers, and
    the evaluators check what it returned and the state it left -- the leaf's inclusion case. Every
    domain, browsing and search included, is reached through MCP tool calls. The browser-automation
    domain (39 tasks, 16.9%) has the agent act on live web sites (booking.com, premierleague.com)
    through Playwright's tools, which is the secondary leaf's case.
  source: src-arxiv-2508-14704-v1
  quote: The benchmark challenges an agent to identify, sequence, and invoke appropriate tools from
    Tavailable to achieve G given C
domain_considered_and_rejected:
  - term: agents-tooluse/agent-evaluation-suites
    reason: The six domains are application areas, not family subdomains. Every task goes through
      MCP tool calls, so tool-api-calling holds the whole benchmark, and the claim is MCP use rather
      than breadth across the family.
    source: src-arxiv-2508-14704-v1
    quote: A foundational design principle of MCP-Universe is its reliance on real-world MCP
      servers, as opposed to simulated environments.
  - term: agents-tooluse/research-agents
    reason: The web-searching domain (55 tasks) asks for one entity identified from clues (a player,
      a paper, a city), checked against a stored answer; no open research question is posed and no
      synthesis or citation is scored.
    source: src-arxiv-2508-14704-v1
    quote: This domain focuses on open-domain information seeking.
  - term: agents-tooluse/software-agents
    reason: The repository-management domain (33 tasks) creates repositories, branches, files,
      issues and pull requests through GitHub's MCP tools, and counts issues; no build or test is
      run and no software-engineering change is judged.
    source: src-arxiv-2508-14704-v1
    quote: This domain focuses on repository development and codebase operations.
  - term: agents-tooluse/computer-use-gui
    reason: The 3D-design domain operates Blender, but through its MCP server's tools, not through
      screenshots and mouse and keyboard input; the leaf's exclusion covers an agent acting through
      an API with no graphical interface.
  - term: agents-tooluse/long-horizon-autonomy
    reason: Successful tasks take about 5 to 8 steps on average (paper Table 3) under a 20-step cap,
      not an extended unattended episode; the interface leaf already describes the benchmark.
    source: src-arxiv-2508-14704-v1
    quote: Most open-source models complete successful tasks in 5-7 steps
capability:
  - tool-use
  - instruction-following
capability_basis:
  tool-use:
    reason: Tasks were filtered so that none can be solved without the servers, and the paper's
      error analysis finds agents misusing unfamiliar tools (a Yahoo Finance call with equal start
      and end dates fails); a wrong or misparameterised call leaves the answer or the state wrong.
    source: src-arxiv-2508-14704-v1
    quote: If a task can be easily completed by LLMs without using MCP servers, or can be
      consistently solved with MCP servers within five retries, we consider it a simple task and
      brainstorm a new one.
  instruction-following:
    reason: Every task carries an output-format requirement checked by format evaluators, a failure
      of which fails the task; the paper reports format compliance per model (Table 4) and reads the
      reasoning models' lower rates as weaker adherence to formatting instructions.
    source: src-arxiv-2508-14704-v1
    quote: suggesting that such models are less adept at adhering to strict formatting instructions
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: The paper names long-horizon multi-turn tool calls as a challenge, but successful
      episodes average about 5 to 8 steps, short of the term's ~10 dependent actions, and many tasks
      are retrieval whose failed calls can be retried.
    source: src-arxiv-2508-14704-v1
    quote: Most open-source models complete successful tasks in 5-7 steps
  - term: memory-retention
    reason: Context grows quickly with steps (paper Figure 4) and the paper calls it a long-context
      challenge, but the term's exclusion rules out tagging length alone, and nothing scores
      retention of earlier information as such.
  - term: context-integration
    reason: The material that decides the answer is not supplied in the prompt; the agent must fetch
      it through tool calls, which is tool-use.
  - term: quantitative-reasoning
    reason: Holds for the financial-analysis domain (40 of 231 tasks; returns, margins, holdings
      changes), not for the benchmark; the paper's claim is MCP use.
  - term: spatial-reasoning
    reason: Location-navigation tasks need route midpoints and relative positions, but that is one
      domain of six and the coordinates come back from the Maps tools.
  - term: distribution-shift-generalization
    reason: The unknown-tools challenge is unfamiliarity with real servers' interfaces, not a
      held-out input distribution reported as its own condition.
    source: src-arxiv-2508-14704-v1
    quote: Second, there exists an unknown-tools challenge, where LLM agents often lack familiarity
      with the precise usage patterns
  - term: planning
    reason: The end state or answer is scored, not the action sequence; route planning is a task
      topic, not a scored plan.
  - term: autonomy
    reason: The agent runs unattended, but no source states a rule against, or a measure of, human
      intervention.

evaluation_method:
  - environment-state-check
  - constraint-check
  - exact-match
  - numeric-tolerance-match
evaluation_method_note: >
  Each task is scored by its own list of evaluators, and a task passes only if all pass. Format evaluators
  (4 of 84 unique) check the output's structure and required properties (constraint-check). Static evaluators
  (32) compare answers with collected values, by equality in the task files' rules (exact-match) or within
  a stated tolerance, as the portfolio-return evaluator's $0.50 (numeric-tolerance-match). Dynamic evaluators
  (48) obtain the reference from the live service at scoring time. Repository-management evaluators query
  the state the agent left, such as whether the requested GitHub branches exist (environment-state-check);
  the 3D-design evaluators were not read.
evaluation_method_basis:
  reason: The evaluators include domain-specific checks of returned answers against live data (a
    stop's place type on Google Maps) and checks of the end state (branches on GitHub), all reduced
    to a binary verdict per task.
  source: src-arxiv-2508-14704-v1
  quote: The evaluator implements domainspecific validation strategies including stop type
    validation for Google Maps and branch checking for GitHub.
evaluation_method_considered_and_rejected:
  - term: model-graded-judge
    reason: The paper rejects LLM-as-a-judge on purpose, because real-time answers are beyond a
      judge's static knowledge; no score comes from a model.
    source: src-arxiv-2508-14704-v1
    quote: However, we argue that this paradigm is not well-suited for our MCP-Universe scenario
  - term: prospective-resolution
    reason: Dynamic evaluators fetch a reference that exists at scoring time but changes with the
      world; nothing is posed before its answer exists.
    source: src-arxiv-2508-14704
    quote: dynamic evaluators that automatically retrieve real-time ground truth for temporally
      sensitive tasks
  - term: composite
    reason: The success rate counts tasks passed or failed whichever evaluators decide each one; the
      average evaluator score (AE) is a reported secondary figure, not a weighted headline.
    source: src-arxiv-2508-14704-v1
    quote: we calculate the average percentage of evaluators passed for each task, which we refer to
      as the average evaluator score (AE)
  - term: execution-tests
    reason: Evaluators are code, but they run against the agent's answer and the services' state,
      not against code the agent wrote.
designed_for_subjects:
  - model-in-benchmark-harness
  - agent-scaffold
designed_for_subjects_basis:
  reason: The paper and the leaderboard's two LLM tracks run every model through the framework's own
    ReAct agent (one tool per step) or its function-calling agent, so only the model varies; the
    Agent track ranks complete agent systems (Cursor Agent, the OpenAI Agent SDK, HarmonyReAct)
    whose loop the entrant supplies.
  source: src-mcp-universe-site
  quote: 'Agent Track: Evaluates complete AI agent systems that combine LLMs with specialized frameworks'
designed_for_subjects_considered_and_rejected:
  - term: full-product-pipeline
    reason: Cursor Agent 1.4.5 is one Agent-track row, a shipped product, but the protocol is built
      around the framework's own agents and models, not for shipped systems.
    source: src-mcp-universe-site
    quote: Cursor Agent 1.4.5 (Claude-4.0-Sonnet-Thinking)
  - term: tool-augmented-model
    reason: The model iterates autonomously until it answers, inside the benchmark's loop, which the
      term's exclusion sends to model-in-benchmark-harness.
  - term: multi-agent-system
    reason: Each task has one agent under evaluation; the framework's orchestration workflows are an
      option, not a scored setting.

lifecycle: active
lifecycle_basis:
  reason: The leaderboard holds rows for models released after the paper, Gemini-3-Pro-Preview
    (linked to Google's Gemini 3 announcement) among them, and the repository had releases to v1.1.3
    (2026-03-25) and was last pushed on 2026-10-08 (GitHub API). The site dates no row.
  source: src-mcp-universe-site
  quote: Gemini-3-Pro-Preview 35.56 18.18 82.50 52.63 38.46 41.82 61.67 7.80 44.59
activity: accepting-submissions
activity_basis:
  reason: The leaderboard invites new models and agents at any time and has never run in rounds.
  source: src-mcp-universe-site
  quote: Want to add your model/agent to the leaderboard? Contact us to submit new results!

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-5-High (ReAct track)
    source: src-mcp-universe-site
    observed_on: 2026-11-04
    quote: GPT-5-High 26.67 30.30 67.50 57.89 43.59 45.45 62.82 6.84 44.16
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: Each task's evaluators, in the repository; static evaluators hold
  collected answers, and dynamic evaluators compute the reference from the live service when the
  task is scored, so the expected value of those tasks depends on the scoring date.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The tasks, evaluators and framework are public, and anyone can run a domain with their own
    LLM key and the services' keys (SerpAPI, Google Maps, a GitHub account, Notion) plus Blender
    v4.4.0; the live services mean a rerun does not face the same conditions.
  source: src-github-mcp-universe-readme
  quote: python tests/benchmark/mcpuniverse/test_benchmark_location_navigation.py

task:
  exists: true
  input:
    - a user's natural-language instruction with a required output format
    - the tools of the MCP servers the task connects (only those directly relevant, in the main
      setting)
  output: Tool calls against the servers, then a final answer in the required format.
  scoring: A task succeeds (1) only when all of its evaluators pass, else 0; success rate (SR) is
    reported per domain and over all 231 tasks, with the average evaluator score (AE) and the
    average steps of successful tasks (AS) beside it.
  tests_hidden_from_system: true
  source: src-arxiv-2508-14704-v1
  quote: produces binary pass/fail determinations based on objective validation criteria

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every task and its evaluators are in the public repository, with no account or
      agreement.
    source: src-arxiv-2508-14704-v1
    quote: All tasks and evaluators can be found in our Github.
  refresh_note: Left empty. The task files are fixed between code releases (v1.0.0 to v1.1.3, GitHub
    API), but 48 of the 84 unique evaluators recompute their reference from live services at scoring
    time, so a dynamic task's right answer moves with the world while the task does not. No term
    names a fixed task set with live ground truth (logged with bench tag-gap); and the repository's
    task tree no longer matches the paper's per-domain counts (review check), which no source dates.
  data_provenance:
    - expert-authored
  data_provenance_note: The authors wrote the tasks and evaluators by hand, discarded tasks that
    were too easy, and cross-checked each task and evaluator for feasibility, ambiguity and
    correctness.
  data_provenance_basis:
    reason: Each task was cross-checked by other authors after creation.
    source: src-arxiv-2508-14704-v1
    quote: After the task creation, each task will be cross-checked by the other authors for
      feasibility, ambiguity, and correctness.
  data_provenance_source: src-arxiv-2508-14704-v1
  data_provenance_quote: we manually designed challenging MCP tasks to reflect real use cases
  contamination_risk: medium
  contamination_risk_note: >
    Every task, and every static evaluator's answer, is public in the repository, so a route into training
    data is plausible; none is evidenced. Dynamic tasks resist memorisation because their answers change,
    but static ones (historical prices, past match results, fixed Blender scenes) do not. No canary, encryption
    or held-out split is described.
  contamination_risk_source: src-arxiv-2508-14704-v1
  contamination_risk_quote: All tasks and evaluators can be found in our Github.
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: No source states a licence for the tasks; they sit in a repository whose
    GitHub licence metadata reads Apache-2.0, which presumably covers them, but nothing says so.
  size:
    - count: 231
      unit: tasks
      subset: all six domains (Location Navigation 45, Web Searching 55, Browser Automation 39, 3D
        Designing 19, Financial Analysis 40, Repository Management 33)
      source: src-arxiv-2508-14704-v1
      quote: 231 (100%) 45 (19.5%) 55 (23.8%) 39 (16.9%) 19 (8.2%) 40 (17.3%) 33 (14.3%)
    - count: 133
      unit: tools across 11 MCP servers
      subset: all servers
      source: src-arxiv-2508-14704-v1
      quote: the benchmark includes 11 distinct MCP servers with total 133 tools
    - count: 84
      unit: unique evaluators (4 format, 32 static, 48 dynamic)
      subset: all tasks
      source: src-arxiv-2508-14704-v1
      quote: 84 (100%) 4 (4.8%) 32 (38.1%) 48 (57.1%)
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Salesforce AI Research
  maintainer_basis:
    reason: All ten authors are at Salesforce AI Research, and the repository sits in its GitHub
      organisation.
    source: src-arxiv-2508-14704-v1
    quote: Salesforce AI Research https://github.com/SalesforceAIResearch/MCP-Universe
  maintainer_type: industry-lab
  submission_process:
    - maintainer-run
  submission_process_note: The paper's 16 models and four agent configurations were run by the
    maintainers, and later rows (Gemini-3-Pro-Preview, Claude-4.5-Sonnet, Kimi-K2-Thinking) appear
    in the same tables. The site's only route for others is to contact the team; it does not say
    whether contributors send numbers, trajectories or access, or who runs them.
  submission_process_source: src-mcp-universe-site
  submission_process_quote: Want to add your model/agent to the leaderboard? Contact us to submit
    new results!
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-mcp-universe-site
      quote: ReAct (GPT-5-Medium) 33.33 30.30 67.50 52.63 35.90 45.45 43.72
  independence_flags_note: The Agent track ranks the maintainers' own ReAct agent (from the
    framework's Agent Builder) against Cursor Agent and the OpenAI Agent SDK, and it tops the track
    with GPT-5-Medium; the paper's headline that Cursor does no better than ReAct is a comparison
    with that agent. No Salesforce model is on the board. Salesforce sells enterprise agent
    products; whether that is a conflict was not assessed further, and no funding statement was
    found.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: A run needs the agent's LLM inference plus keys for the services behind the
    servers (SerpAPI, Google Maps, GitHub, Notion), Docker, and a local Blender v4.4.0 for 3D
    design; nothing beyond ordinary CPU.
  compute_tier_source: src-github-mcp-universe-readme
  compute_tier_quote: set the required API keys for various services used by the agents
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: >
    A fresh run is automatic end to end. But it is scored against live services (maps, markets, GitHub,
    web sites, search results) whose data keep moving, and the dynamic evaluators recompute the reference
    at scoring time, so no run can be repeated against the same conditions: that is the live-world-state
    blocker, which tier 3 forbids beside fully-automatable, so it is recorded here as browsecomp records
    it. The paper says the dynamic evaluators keep results stable across timestamps; no source measures
    that. The services can also change their tools: the Google Maps server the paper names is in the archived
    repository of MCP reference servers.
  reproducibility_tier_basis:
    reason: Each server runs against the real service's endpoints and authentication, not a
      simulation.
    source: src-arxiv-2508-14704-v1
    quote: Each server is configured with its authentic API endpoints, authentication mechanisms,
      and tool specifications
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: MCP-Universe framework (BenchmarkRunner, with per-domain YAML configurations and test
    scripts under tests/benchmark/mcpuniverse/)
  harness_source: src-github-mcp-universe-readme
  harness_quote: python tests/benchmark/mcpuniverse/test_benchmark_location_navigation.py
  harness_gotcha:
    source: src-arxiv-2508-14704-v1
    quote: In Table 3, we only connect the MCP servers that are directly relevant to each task.
  harness_gotcha_note: Scores depend on which servers are connected and on the agent loop. With 7
    servers (94 tools) connected for every task, Claude-4.0-Sonnet's location-navigation success
    falls from 22.22% to 11.11% (paper Section 4.5); the same model scores 29.44% in the ReAct track
    (one tool per step) and 32.90% in the function-calling track (several), and o3 26.41% with ReAct
    against 31.60% with the OpenAI Agent SDK. The Overall track keeps each model's better track.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for SalesforceAIResearch/MCP-Universe, read
    2026-11-04; not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the agentic profile (scaffold, harness, tools allowed and reasoning effort are material already): the
  # step cap (the ReAct prompt demands an answer within 20 steps), sampling (the paper sets temperature 1.0 for
  # every model), and the date of the run, because live services and the dynamic evaluators' references move.
  material_extra:
    - max_steps
    - sampling
    - date_evaluated

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The headline is the success rate over all 231 tasks, beside per-domain rates.
  source: src-arxiv-2508-14704-v1
  quote: We report the success rate (SR, %) for each domain and all tasks.

homepage: https://mcp-universe.github.io/
repository: https://github.com/SalesforceAIResearch/MCP-Universe
leaderboard_url: https://mcp-universe.github.io/#results


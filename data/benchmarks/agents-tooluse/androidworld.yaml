# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T01)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2405-14573-v5
    - src-arxiv-2405-14573
    - src-github-android-world-readme
    - src-androidworld-leaderboard
    - src-arxiv-2602-07787-v1
  sources_note: >
    The AndroidWorld paper's v5 PDF (a DOI, not archived) read as text; its abstract page for the
    date; the README at main; the leaderboard's AndroidWorld tab as CSV through the sheet's gviz
    endpoint on docs.google.com (robots.txt allows /spreadsheet; the /export path redirects to
    googleusercontent.com, whose robots.txt disallows everything, so it was not used); and Minitap's
    v1 PDF (a DOI, not archived) as evidence of current use. The project page repeats the abstract
    and is not cited.
  confidence: medium
  review_checks:
    - check: computer-use-gui's inclusion test speaks of desktop applications operated by mouse and
        keyboard; AndroidWorld is a phone operated by touch gestures. Whether mobile GUIs belong in
        this leaf, as tagged, or need a leaf of their own.
      field: domain.primary
    - check: exact-match is tagged for the information-retrieval tasks, whose answers are compared
        with values computed from the state the setup wrote; they could instead count as
        environment-state-check, and composite was rejected because the success rate counts
        pass/fail per task rather than weighting sub-scores.
      field: evaluation_method
      source: src-arxiv-2405-14573-v5
      quote: For validation, we define the expected answer format within the prompt and use a few
        supported functions
    - check: The sheet ranks end-to-end GUI models ('Model') and multi-call agents ('AI agent') in
        one table, distinguished only by a column and its legend. Whether the Model rows warrant
        observed_subjects beside agent-scaffold, and whether model-in-benchmark-harness should apply
        to the paper's model comparisons inside M3A.
      field: designed_for_subjects
      source: src-androidworld-leaderboard
      quote: A relatively simple prompt involving one LLM /VLM call
    - check: The screen representation (screenshot, accessibility tree, or both) and the
        task-parameter seed both move scores, but EvalConditions has no field for either;
        sampling.seed is the model's sampling seed, not the task generator's. Both are left out of
        material_extra.
      field: comparability.material_extra
      source: src-arxiv-2405-14573-v5
      quote: Across three seeds, we observe significant performance variations
    - check: accepting-submissions rests on community rows dated up to September 2026; no source
        read says how results reach the sheet (the README only links it).
      field: activity
    - check: maintainer-competes-on-own-benchmark rests on the paper's own M3A baseline row. Gemini
        2.5 Computer Use and google/artemis are Google systems on the board, but who submitted them
        is not stated.
      field: governance.independence_flags
      source: src-androidworld-leaderboard
      quote: Open-source project available at https://github.com/google/artemis
    - check: human-nonexpert and crowd-average treat the two software engineers as non-specialists,
        since using phone apps has no credential; if their recruitment counts as selection for the
        tasks' knowledge, both become the expert terms (human-expert, expert-average).
      field: data.ceiling_anchor_type
      source: src-arxiv-2405-14573-v5
      quote: we enlisted two software engineers to complete the tasks using an Android emulator
    - check: context-integration and memory-retention each rest on part of the task set (the
        information-retrieval tasks; the transcription and multiplication tasks). The vocabulary has
        no capability for operating a GUI, which is most of what the tasks test.
      field: capability
    - check: versioned-releases rests on the one dated announcement (step budgets, 2024-11-18); the
        commit history was not read, and task fixes landed between announcements would make it
        rolling-live. model-generated rests on the paper's account of drafting information-retrieval
        tasks with a language model.
      field: data.refresh
      source: src-arxiv-2405-14573-v5
      quote: we found that editing LLM-generated protobufs can be more efficient than writing a
        complete task from scratch

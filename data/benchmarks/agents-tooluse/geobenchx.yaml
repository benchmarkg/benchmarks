# data/benchmarks/agents-tooluse/geobenchx.yaml
#
# P1-S9-T02, agents-tooluse entry 16. Filled from the GeoBenchX paper, arXiv 2503.18129 read as its v2 PDF
# (2025-10-22, the ACM GeoGenAgent '25 version) and its v1 PDF (2025-03-23), and its abstract page; the
# repository README pinned at commit 0edf610 (2026-08-30); and the v1 PDFs of two 2026 papers that place
# themselves against it, GeoNatureAgent Benchmark (arXiv 2606.12821, June 2026), which adapts four of its tools,
# and GISAgentBench (arXiv 2608.01645, August 2026). Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts. No task text is quoted beyond the paper's own examples.
#
# Dropped from the earth-climate round: the score is whether GIS tool calls were selected and invoked correctly,
# which is tool-api-calling's inclusion case, and the subject is socio-economic mapping rather than an
# Earth-system quantity; geospatial-reasoning is the secondary. v1 and v2 are revisions of the same 202 tasks.

id: geobenchx
name: GeoBenchX
tagline: 202 multi-step GIS tasks for a tool-calling agent with 23 geospatial tools, judged against
  reference call sequences.
description: >
  A benchmark of 202 geospatial tasks posed in natural language to a simple LangGraph ReAct agent
  that holds 23 GIS tools (loading statistical, vector and raster data, filtering and merging
  dataframes, spatial joins, buffers, raster statistics, choropleth, bivariate and heat maps,
  contour lines) and a reject_task tool. The tasks come in four groups of rising difficulty --
  merge-visualize (36), process-merge-visualize (56), spatial operations (53) and heatmaps and
  contour lines (54) -- plus three control questions, and each group mixes solvable tasks with
  look-alike tasks that the provided data or tools cannot answer, which the agent should reject.
  The datasets (18 statistical, 21 vector and 11 raster) are snapshots stored locally. The agent
  runs at temperature 0 for up to 25 tool-call iterations with no human in the loop. Its tool-call
  sequence is compared with one or more hand-rewritten reference solutions by a panel of three LLM
  judges (Claude Sonnet 3.5, GPT-4.1 and Gemini 2.5 Pro Preview in v2), each scoring match, partial
  match or no match, and the match rates are averaged. Results are reported per group and for
  solvable and unsolvable tasks, with no overall figure, beside solution length and token use. The
  final maps and numbers are not checked. In v2, o4-mini matched 0.90 of the unsolvable and 0.51 of
  the solvable tasks; Claude Sonnet 4 solved most solvable tasks (0.55) but rejected few. The tasks,
  reference solutions, agent and evaluator are on GitHub; there is no leaderboard.
self_description:
  source: src-arxiv-2503-18129-v2
  quote: This paper establishes a benchmark for evaluating tool-calling capabilities of large
    language models (LLMs) on multi-step geospatial tasks relevant to commercial GIS practitioners.
external_ids:
  arxiv: '2503.18129'
paper:
  title: 'GeoBenchX: Benchmarking LLMs in Agent Solving Multistep Geospatial Tasks'
  arxiv: '2503.18129'
  doi: 10.1145/3764915.3770721
  version_read: v2
  source: src-arxiv-2503-18129-v2
released: 2025-03-23
released_note: The paper's first arXiv version, as the abstract page dates it; the repository was
  created the day before (GitHub API). v2 followed on 2025-10-22.
released_source: src-arxiv-2503-18129
released_quote: Submitted on 23 Mar 2025 (v1), last revised 22 Oct 2025 (this version, v2)
release_venue: GeoGenAgent '25, the 1st ACM SIGSPATIAL International Workshop on Generative and
  Agentic AI for Multi-Modality Space-Time Intelligence (v2)
release_venue_source: src-arxiv-2503-18129-v2
release_venue_quote: ACM SIGSPATIAL International Workshop on Generative and Agentic AI for
  Multi-Modality Space-Time Intelligence (GeoGenAgent

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: agents-tooluse/tool-api-calling
  primary_basis:
    reason: One agent under evaluation is scored on selecting and invoking GIS functions correctly,
      the leaf's inclusion case; the calls run against locally stored datasets and the judge reads
      the sequence of calls. The loop is autonomous (up to 25 iterations, no human in the loop),
      which the family asks.
    source: src-arxiv-2503-18129-v2
    quote: This paper establishes a benchmark for evaluating tool-calling capabilities of large
      language models (LLMs) on multi-step geospatial tasks relevant to commercial GIS
      practitioners.
  secondary:
    - earth-climate/geospatial-reasoning
  secondary_basis:
    reason: Every task asks for reasoning over geographic location and spatial relationships (which
      countries, regions or features, which spatial predicate, buffer or raster overlap), the
      secondary leaf's definition; the paper names geographical knowledge and spatial data as what
      makes the tasks distinct. Earth-climate is not primary, because the scored quantity is
      tool-call correctness, not an Earth-system quantity, and most tasks map socio-economic
      indicators.
    source: src-arxiv-2503-18129-v2
    quote: Geospatial tasks are distinct in that they require LLMs to have good factual geographical
      knowledge, understanding how to work with spatially defined data
domain_considered_and_rejected:
  - term: earth-climate/remote-sensing
    reason: Some rasters (snow cover, flood extents) are Earth-observation products, but they are
      tool inputs; nothing is extracted from imagery and scored.
  - term: code/data-science-workflows
    reason: The tasks are analyses over real data, but the agent is told not to write code and acts
      only through the provided functions, and no software it wrote is run or tested, which the code
      family's inclusion test needs. The reference solutions are written as Python-like call
      sequences only so that the judges can read them.
    source: src-arxiv-2503-18129-v2
    quote: The agent is explicitly instructed not to ask the user for clarifications and not to
      provide code to solve the task
  - term: society-econ-law/policy-analysis
    reason: The tasks serve socio-economic analysis for reports and policy papers, but the scored
      quantity is whether the tool calls match a reference, not the economic or policy content,
      which the family's exclusion test sends elsewhere.
  - term: agents-tooluse/long-horizon-autonomy
    reason: Most reference solutions are 4 to 6 calls and none is longer than 14, within a
      25-iteration cap; the interface leaf describes the benchmark, which the term's distinction
      makes primary.
    source: src-arxiv-2503-18129-v2
    quote: Approximately 74% of the solvable tasks have reference solutions consisting of 4-6 steps
      (tool-calls) and 28% consist of more steps (up to 14 steps).
  - term: agents-tooluse/multi-agent-coordination
    reason: The CCS concepts list multi-agent systems, but one agent is evaluated; the judges are
      part of the apparatus.
capability:
  - tool-use
  - planning
  - honesty
  - spatial-reasoning
capability_basis:
  tool-use:
    reason: The protocol exposes 23 callable GIS functions whose results feed the next step, and the
      score is whether the right ones were called with the right arguments.
    source: src-arxiv-2503-18129-v2
    quote: it is provided with 23 tools to implement the necessary data manipulations, calculations,
      and visualizations or to report a task unsolvable
  planning:
    reason: The scored object is the action sequence itself, the "solution algorithm" compared with
      reference sequences, not the final map or number; solution length against the reference is
      reported beside it.
    source: src-arxiv-2503-18129-v2
    quote: we evaluate only solution algorithm not the final response
  honesty:
    reason: About two in five tasks cannot be solved with the data or tools given, and calling
      reject_task on them is scored and reported apart from solving (Table 1), to reduce
      hallucinated outputs.
    source: src-arxiv-2503-18129-v2
    quote: we test the ability of LLMs to correctly recognize when the task cannot be solved with
      given tools and inform the user to reduce the risk of hallucinated outputs
  spatial-reasoning:
    reason: The spatial-operations and heatmap groups turn on spatial relations the agent must infer
      to choose its operations (which features overlap, lie within a distance, or fall inside a
      polygon), and the paper's first error type is misreading geometric relations, such as taking a
      polygon's centroid value for its average (see review_checks).
    source: src-arxiv-2503-18129-v2
    quote: Poor understanding of geometrical relations
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: World knowledge (country groupings, recent changes such as BRICS) is needed on the way,
      and its lack is an error type, but the scored quantity is the call sequence, which the term's
      exclusion covers.
    source: src-arxiv-2503-18129-v2
    quote: Lack of recent world knowledge
  - term: long-horizon-execution
    reason: Reference solutions are mostly 4 to 6 calls and at most 14, and a wrong intermediate
      step can be repaired within the 25 iterations.
  - term: instruction-following
    reason: A rules prompt says when to reject and which year to map, but compliance is not scored
      apart from the match with the reference, and no source claims instruction following.
  - term: context-integration
    reason: The datasets that decide the answer are supplied through tools, but what is scored is
      how the tools were called, which tool-use records; the paper does not score use of the data
      apart from that.
  - term: calibration-uncertainty
    reason: No confidence is elicited; rejecting a task is a binary call, not a stated probability.

evaluation_method:
  - model-graded-judge
evaluation_method_note: Each judge (Claude Sonnet 3.5, GPT-4.1 and Gemini 2.5 Pro Preview in v2;
  Sonnet 3.5, GPT-4o and Gemini 2.0 in v1) receives the tool descriptions, a scoring taxonomy and
  scored examples, reasons about whether the candidate matches any reference solution, and gives 2
  (match), 1 (partial) or 0 (no match); the panel's match frequencies are averaged. The judges were
  chosen against human scores on 50 tasks (v2), GPT-4.1 agreeing on 96%. The paper names the judges'
  families but not their snapshots.
evaluation_method_basis:
  reason: A panel of language models prompted with a grading instruction decides whether each
    candidate solution is semantically equivalent to a reference.
  source: src-arxiv-2503-18129-v2
  quote: 'For evaluation of the solutions we used a panel of judges: Claude Sonnet 3.5, GPT-4.1 and Gemini
    2.5 Pro Preview.'
evaluation_method_considered_and_rejected:
  - term: environment-state-check
    reason: The checked object is the tool calls the agent issued, which the term names, but a judge
      model, not a program, decides equivalence, and neither the final data store nor the outputs
      are inspected.
    source: src-arxiv-2503-18129-v2
    quote: We opt for the matching-based approach for practicality and efficiency.
  - term: execution-tests
    reason: The paper sets execution-based evaluation aside as impractical for maps and narratives;
      nothing is re-run against tests.
  - term: ordinal-grading
    reason: Each judge's 0-1-2 score is per solution; the published results are match frequencies,
      not bands.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Every model runs inside the same maintainer-supplied ReAct loop, prompt and tools, chosen
    simple so that the number belongs to the model; the rows name only the model.
  source: src-arxiv-2503-18129-v2
  quote: We intentionally choose a simple agent architecture to measure the contribution of the LLMs
    themselves into the final performance
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: Entrants do not bring their own loop; the paper suggests a better agent would score
      higher but does not test one.
  - term: tool-augmented-model
    reason: The loop is autonomous, with the model deciding the next call and when to stop, within
      25 iterations.
    source: src-arxiv-2503-18129-v2
    quote: so we allowed up to 25 iterations

lifecycle: null
lifecycle_note: Left null, as lifecycle's dormant exclusion asks where the sources do not show
  current use. The only results are the maintainers' own, in v1 (March 2025) and v2 (October 2025).
  The repository was last pushed on 2026-08-30 (GitHub API; a citation update), and two 2026 papers
  build on it, GeoNatureAgent Benchmark adapting four of its tools and GISAgentBench comparing
  itself with it, but neither reports GeoBenchX results. No proposed-stage statement either Logged
  as taxonomy/_failures/2026-11-04-geobenchx-001.
lifecycle_source: src-arxiv-2606-12821-v1
lifecycle_quote: we integrate four canonical GIS operations from GeoBenchX [12] into our toolset
activity: no-submission-channel
activity_note: The README reports the paper's results; there is no leaderboard, server or submission
  route, and no source read shows one.
activity_basis:
  reason: A download-and-run benchmark whose repository holds the tasks, the agent and the
    evaluator, with no results route.
  source: src-github-geobenchx-readme
  quote: Benchmark set of 202 geospatial tasks with reference solutions

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: o4-mini (o4-mini-2025-04-16, in the GeoBenchX ReAct agent)
    source: src-arxiv-2503-18129-v2
    observed_on: 2026-11-04
    quote: Results show o4-mini and Claude 3.5 Sonnet achieve the best overall performance
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: Each task's one or more reference solutions (a tool-call sequence with
  arguments and comments for the judges, an empty sequence for control questions, or a single
  reject_task call), drafted by GPT-4o or Claude 3.5 Sonnet runs and rewritten by hand, shipped in
  the repository's task file.
ground_truth_source_source: src-arxiv-2503-18129-v2
ground_truth_source_quote: We then manually reviewed and rewrote every solution.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The tasks, reference solutions, agent, tools and evaluator are in the public repository
    and the datasets download from a linked archive; a run needs API access to the solver and the
    three judges, whose snapshots must still be served (execution).
  source: src-arxiv-2503-18129-v2
  quote: The resulting benchmark set, evaluation framework, and data generation pipeline are
    released as open-source resources

task:
  exists: true
  input:
    - a one-sentence geospatial request in natural language, such as mapping two indicators or
      counting people within a distance of a railway
    - a system prompt and a rules prompt (when to reject, which year to map, when data count as
      unavailable), and 23 GIS tools plus reject_task over locally stored statistical, vector and
      raster datasets
  output: A sequence of tool calls, up to 25 iterations, ending in a reply with the map, the
    datasets used and an explanation, or a reject_task call, or no call for a question needing no
    tools.
  scoring: Three judge models each score the call sequence against the task's reference solutions as
    match (2), partial (1) or no match (0); match frequencies are averaged over the judges and
    reported per task group and for solvable and unsolvable tasks, with the mean difference in
    solution length beside them. The final response is not scored.
  reference_solution: true
  source: src-arxiv-2503-18129-v2
  quote: In the evaluator, we use all the 3 above LLMs as judges and average their match frequency
    estimates.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The task file with reference solutions and the evaluator-tuning set are in the
    repository; the datasets the tools read are an archive linked from the repository's data folder
    (not fetched here).
  access_basis:
    reason: The tasks, reference solutions, code and prompts are public on GitHub with no
      registration.
    source: src-github-geobenchx-readme
    quote: Benchmark set of 202 geospatial tasks with reference solutions
  refresh: versioned-releases
  refresh_note: The two versions are the paper's v1 and v2, with no release tags; the task file's
    commit history (GitHub API, read 2026-11-04) shows ground-truth corrections between them, in May
    and June 2025, and none since.
  refresh_basis:
    reason: The README calls the current set the second version and points to v1 for the first.
    source: src-github-geobenchx-readme
    quote: This is the second version of the benchmark.
  data_provenance:
    - model-generated
    - expert-authored
  data_provenance_note: Seed tasks came from industry professionals and publications; Claude 3.5
    Sonnet generated more from the seeds, the tool descriptions and the dataset lists, solvable and
    unsolvable separately, and the authors kept the good ones. Reference solutions were drafted by
    agent runs with GPT-4o or Claude 3.5 Sonnet and every one was rewritten by hand. The datasets
    were downloaded from public data APIs and used almost as-is; they are the environment, not the
    items.
  data_provenance_source: src-arxiv-2503-18129-v2
  data_provenance_quote: 'the Claude 3.5 Sonnet model based on: the seed tasks, description of the tools,
    and the lists of available datasets'
  contamination_risk: medium
  contamination_risk_note: Every task and its reference solutions have been public on GitHub since
    March 2025, so a training route is plausible; no source names one or evidences one into the
    scored tasks. Two of the evaluated families (Claude 3.5 Sonnet, GPT-4o) wrote the drafts of the
    tasks or of the reference solutions, which is an item-authorship conflict, not contamination.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No human solved the tasks under the protocol. People scored 50 candidate
    solutions to choose the judges, which measures the evaluator, not a ceiling.
  dataset_licence_note: No source read states a licence for the tasks. GitHub reports MIT for the
    repository that holds them (API, read 2026-11-04); the datasets come from many providers, listed
    in a bibliography inside the data archive, which was not read.
  size:
    - count: 202
      unit: tasks
      source: src-github-geobenchx-readme
      quote: Benchmark set of 202 geospatial tasks with reference solutions
    - count: 36
      unit: tasks
      subset: merge-visualize
      source: src-arxiv-2503-18129-v2
      quote: Merge - visualize (36 tasks)
    - count: 56
      unit: tasks
      subset: process-merge-visualize
      source: src-arxiv-2503-18129-v2
      quote: Process - merge - visualize (56 tasks)
    - count: 53
      unit: tasks
      subset: spatial operations
      source: src-arxiv-2503-18129-v2
      quote: Spatial operations (53 tasks)
    - count: 54
      unit: tasks
      subset: heatmaps and contour lines
      source: src-arxiv-2503-18129-v2
      quote: Heatmaps, contour lines (54 tasks)
    - count: 123
      unit: tasks
      subset: solvable (v2)
      source: src-arxiv-2503-18129-v2
      quote: for solvable tasks (123 tasks) and unsolvable tasks (79 tasks) across all groups
    - count: 79
      unit: tasks
      subset: unsolvable (v2)
      source: src-arxiv-2503-18129-v2
      quote: for solvable tasks (123 tasks) and unsolvable tasks (79 tasks) across all groups
    - count: 50
      unit: tasks with human-scored candidate solutions
      subset: evaluator-tuning set (v2)
      source: src-github-geobenchx-readme
      quote: Set of tasks to tune evaluator agent - 50 tasks containing both reference and generated
        solutions where the generated solutions are scored manually.
  size_note: The four groups hold 199 tasks; the other three are control questions that need no
    tools, kept for debugging.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The paper's two authors (Varvara Krechetova, World Bank; Denis Kochedykov, JP Morgan
    Chase & Co)
  maintainer_basis:
    reason: The paper has two authors, whose affiliations it gives, and the repository sits in a
      personal GitHub account with no organisation named as holding it.
    source: src-arxiv-2503-18129-v2
    quote: Varvara Krechetova World Bank New York, USA
  maintainer_type: individual
  submission_process:
    - literature-only
  submission_process_note: There is no leaderboard or results table beyond the paper's own runs,
    which the README repeats; no outside results were found in the sources read.
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-arxiv-2503-18129-v2
      quote: 'For evaluation of the solutions we used a panel of judges: Claude Sonnet 3.5, GPT-4.1 and
        Gemini 2.5 Pro Preview.'
  independence_flags_note: Every judge is one of the evaluated models (Claude Sonnet 3.5 and GPT-4.1
    are also solvers) and each comes from a vendor whose other models are ranked; the paper chose
    one judge per family to spread that effect. Claude 3.5 Sonnet also generated tasks and, with
    GPT-4o, drafted reference solutions. The authors' employers have no system among those
    evaluated, so maintainer-competes-on-own-benchmark is not set; no funding is stated.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2503-18129-v2
    quote: It also confuses evaluators that tend to penalize excessively long solutions despite the
      instructions not to.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The tools run on local files with ordinary Python GIS libraries; the cost is
    the solver's tokens (7.5 to 26.9 million input tokens per model for the set, Table 8) and three
    judge calls per task.
  compute_tier_source: src-arxiv-2503-18129-v2
  compute_tier_quote: We also compared the number of tokens used by the models to solve the
    benchmark set (Table 8) since it influences costs
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: The judges are hosted models, and the v2 panel includes a preview
    model, Gemini 2.5 Pro Preview, so the official scores can be recomputed only while those
    snapshots are served. The vocabulary has no blocker for a hosted judge
    (taxonomy/_failures/2026-09-28-webarena-005 proposes hosted-judge-dependency), so blockers are
    left empty. Datasets are frozen snapshots, so the environment does not drift.
  reproducibility_tier_basis:
    reason: A run is automatic end to end, against stored dataset snapshots rather than live APIs.
    source: src-arxiv-2503-18129-v2
    quote: we opt to store the snapshots of datasets in the local experimentation environment rather
      than fetching data from online APIs every time
  harness_availability: official-harness
  harness: The GeoBenchX repository's solver agent (a pre-built LangGraph ReAct agent with the 23
    tools), evaluator and benchmarking notebooks, at commit 0edf610
  harness_source: src-arxiv-2503-18129-v2
  harness_quote: The experiment setup is based on the pre-built Langgraph ReAct agent
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for the repository, read 2026-11-04; not a quoted
    Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile ((model-graded-judge, model-in-benchmark-harness) has no profile): the judge
  # panel, its snapshots and its prompt, which changed between v1 and v2 and decide every score; the harness
  # (the repository's ReAct agent, prompts and tool set; the paper reports that narrower tools raised accuracy);
  # the 25-iteration cap; and sampling, since every solver ran at temperature 0 except the reasoning models,
  # which take no temperature.
  material_extra:
    - judge_model
    - judge_model_version
    - judge_prompt_hash
    - harness
    - max_steps
    - sampling

aggregation_policy: none-by-design
aggregation_policy_note: The paper ranks o4-mini first overall by reading Table 7 across the groups,
  but computes no figure that combines them.
aggregation_policy_basis:
  reason: Match frequencies are computed per task group and for solvable and unsolvable tasks, and
    reported side by side.
  source: src-arxiv-2503-18129-v2
  quote: 'The frequency of each of the match scores was calculated: (1) separately by each group of tasks
    as per 4.1'
headline_metric: null
secondary_axes:
  - cost
secondary_axes_note: Input and output tokens per model for the whole set (Table 8), and the mean
  difference in solution length from the reference, which has no axis term.
secondary_axes_basis:
  reason: Token use is reported beside the match rates because it drives cost.
  source: src-arxiv-2503-18129-v2
  quote: We also compared the number of tokens used by the models to solve the benchmark set (Table
    8) since it influences costs


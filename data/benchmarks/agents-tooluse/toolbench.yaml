lineage:
  role: root
  forks:
    - id: stabletoolbench
      maintainer: THUNLP-MT (Tsinghua University)
      source: src-arxiv-2403-07714
      quote: we introduce StableToolBench, a benchmark evolving from ToolBench, proposing a virtual
        API server and stable evaluation system
lineage_note: >
  StableToolBench keeps ToolBench's tools, queries and answer format, replaces the live APIs with a cache
  and LLM-simulated responses (later MirrorAPI, a trained simulator), filters the test set to 765 queries
  judged solvable, and scores Solvable Pass Rate and Solvable Win Rate with GPT-4-class judges. It is
  recorded as a fork: it is held in THUNLP-MT's repository with its own paper and versions, although two
  of ToolLLM's lead authors and its senior authors are on it and ToolBench's README announces it (review_checks).
  It has no entry yet.


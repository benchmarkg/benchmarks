# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T02)
  added_on: 2026-11-04
  last_verified: 2026-11-04
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2307-16789-v2
    - src-arxiv-2307-16789
    - src-openreview-api-toolllm
    - src-github-toolbench-readme-d56fdd8
    - src-github-toolbench-tooleval-readme-d56fdd8
    - src-github-toolbench-leaderboard-csv-d56fdd8
    - src-arxiv-2403-07714-v5
    - src-arxiv-2403-07714
    - src-github-stabletoolbench-readme-aa4ed9f
    - src-arxiv-2305-16504
    - src-arxiv-2609-09395-v1
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its abstract page for the dates and abstract;
    OpenReview's search API record for the venue (the forum page asks for a browser challenge); the README,
    the ToolEval README and the leaderboard CSV at commit d56fdd89faf8c91fa135090b212bb9057ee5cfc2, the
    CSV being what openbmb.github.io/ToolBench loads (its page script names the file); StableToolBench's
    v5 PDF and abstract page (DOIs) and its README at commit aa4ed9f4737ad98bd706663f01d63623c3427812,
    kept clear of a contact line; the abstract page of arXiv 2305.16504 for the homograph; and the v1
    PDF of arXiv 2609.09395 (a DOI) as evidence of current use. The data archive, the legacy branch and
    the evaluator's prompt files were not read.
  confidence: medium
  review_checks:
    - check: Homograph. arXiv 2305.16504 (May 2023) released an unrelated tool-manipulation
        benchmark also named ToolBench, two months before this one. taxonomy/homographs.yaml covers
        only capability and subdomain ids, so the clash belongs in the benchmark alias table
        (data/aliases/benchmarks.yaml), which this task could not edit; a bare "ToolBench" in
        ingested data must not resolve here without checking which is meant.
      field: aliases
      source: src-arxiv-2305-16504
      quote: we create the ToolBench, a tool manipulation benchmark consisting of diverse software
        tools for real-world tasks
    - check: StableToolBench is recorded as a fork (another maintainer), not a variant. It lives in
        THUNLP-MT's repository with its own paper, but its authors include ToolLLM's two lead
        authors and its senior authors, and ToolBench's README announces it, so a reviewer may read
        the maintainer as the same group.
      field: lineage
      source: src-github-stabletoolbench-readme-aa4ed9f
      quote: we developed this new benchmark aiming to balance the stability and reality, based on
        [ToolBench](https://github.com/OpenBMB/ToolBench) (Qin et al., 2023).
    - check: Test-set size. StableToolBench counts 1,100 test instructions with 100 in
        G3-instruction, while the README says 200 were sampled from every test set; the paper does
        not state the counts. The subsets follow StableToolBench.
      field: data.size
      source: src-github-toolbench-readme-d56fdd8
      quote: We sample 200 instances from every test set.
    - check: The leaderboard CSV's per-group columns are labelled WinRate but hold the README's pass
        rates (for GPT-4 with DFSDT 60, 71.5, 67, 79.5, 77.5 and 71), and only the first column is a
        win rate. The board page also labels the file's baseline ChatGPT-ReACT while the file name
        ends in ChatGPT-DFSDT.
      field: aggregation_policy
      source: src-github-toolbench-leaderboard-csv-d56fdd8
      quote: GPT4-DFSDT,70.4,60,71.5,67,79.5,77.5,71
    - check: reproducibility_tier fully-automatable with the live-world-state blocker held in the
        note (tier 3 forbids the pair). The live APIs and the maintainer-granted ToolBench key may
        justify a stricter reading; StableToolBench reports key applications going unanswered.
      field: execution.reproducibility_tier
      source: src-github-stabletoolbench-readme-aa4ed9f
      quote: Note that if you have applied a ToolBench key but did not get a response for a long
        time
    - check: activity accepting-submissions rests on the ToolEval README's stated route; the board
        has only the paper's ten rows and has not changed since 2023-09-29, so `unknown` is the
        alternative.
      field: activity
    - check: model-graded-judge needs reference_conditions naming the judge (gpt-3.5-turbo-16k per
        StableToolBench, ToolEval's tooleval_gpt-3.5-turbo_normalized evaluator); no conditions
        record exists, and the exact snapshot behind the paper's numbers is not stated.
        StableToolBench argues this judge cannot reliably decide solvability.
      field: reference_conditions
      source: src-arxiv-2403-07714-v5
      quote: gpt-3.5-turbo-16k can not assume the role of the automatic evaluator in tool learning
    - check: distribution-shift-generalization rests on the held-out tool and category groups, which
        are unseen only relative to ToolBench's own training split; for models not trained on it
        (GPT-4, Claude-2) the groups are not a shift.
      field: capability
    - check: maintainer_type community-collective, since no source read names OpenBMB's holder;
        academic-lab (Tsinghua's NLP lab) is the likely alternative.
      field: governance.maintainer_type
    - check: Versions. Whether 0830 changed the test instructions, and so whether it is breaking, is
        not stated; the legacy branch was not read, so its kind and its relation to this benchmark
        are unverified. The ToolEval change of 2023-09-29 and the server move of August 2024 are
        recorded as errata.
      field: versions
      source: src-github-toolbench-readme-d56fdd8
      quote: Data updation, with more than **120,000** solution path annotations
    - check: The evaluator labels each instruction solvable or not on the fly with the API responses
        it sees, so the pass rate's denominator and its rules shift as APIs fail; StableToolBench
        fixes the solvable set instead. Whether that belongs in comparability beyond `sandbox` is
        open.
      field: comparability.material_extra
      source: src-arxiv-2403-07714-v5
      quote: the stability of API status for a significant portion of online tools (55.6% in
        ToolBench) is inconsistent

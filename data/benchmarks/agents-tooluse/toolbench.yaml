    breaking: true
    superseded_by: '0801'
    frozen: true
    sources:
      - src-github-toolbench-readme-d56fdd8
  - version: '0801'
    label: The ToolLLM release (data_0801)
    version_kind: revision
    released: 2023-07-27
    changes: The release the paper's first version describes, over 16,464 RapidAPI APIs;
      ToolLLaMA-7b-v1 was trained on it. The README now calls it the old version data.
    breaking: true
    supersedes_version: legacy
    superseded_by: '0830'
    frozen: true
    sources:
      - src-github-toolbench-readme-d56fdd8
      - src-arxiv-2307-16789
  - version: '0830'
    label: The re-annotated data
    version_kind: revision
    released: 2023-08-30
    items: 1100
    changes: Re-annotated data, with more than 120,000 solution paths (126,486 pairs) and their
      intact reasoning, which ToolLLaMA-2-7b-v2 was trained on; the paper's v2 and the README report
      results on it. The sources do not say whether the test instructions changed.
    supersedes_version: '0801'
    errata:
      - date: 2023-09-29
        scope: ToolEval
        description: A new version of ToolEval, described as more stable and covering more models
          including GPT-4; the README asks for ToolLLaMA-2-7b-v2 with it to reproduce the latest
          results.
        source: src-github-toolbench-readme-d56fdd8
      - scope: the hosted RapidAPI server
        description: In August 2024 the maintainers' RapidAPI server moved to a new IP, and the
          README asks users to update their code to reach it.
        source: src-github-toolbench-readme-d56fdd8
    frozen: true
    sources:
      - src-github-toolbench-readme-d56fdd8
      - src-arxiv-2307-16789-v2
      - src-arxiv-2403-07714-v5


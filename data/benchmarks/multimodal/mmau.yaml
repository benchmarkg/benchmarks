# data/benchmarks/multimodal/mmau.yaml
#
# P1-S8-T09, multimodal entry 9. Filled from MMAU's paper, arXiv 2410.19168 read as its v1 PDF (2024-10-24, the only
# arXiv version, marked "Under Review"), and its abstract page; OpenReview's public search record of the ICLR 2025
# submission, for the venue; the project site and the JSON files its two leaderboards load (v05.15.25 and the
# original); the repository README pinned to commit 110127f (2026-02-09); EvalAI's record of the first test server
# (challenge 2391); the Hugging Face API records of the test-mini and test datasets and the datasets-server record
# of test-mini's columns; the API record and app.py of the Hugging Face Space that has scored test predictions since
# January 2026; the abstract page of MMAU-Pro (arXiv 2508.13992); and the abstract page of SWEAR (arXiv 2610.13081),
# an October 2026 result. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.
#
# Boundary (02 S11 rule 12, from the audio-speech side): each item is an audio clip with a question and answer
# options in text, and the score is whether the chosen option is the right answer about that clip, so the measured
# quantity is the correspondence between the language answer and the audio, which audio-speech's exclusion test sends
# to multimodal/audio-language. The paper's own control, replacing the audio with Gaussian noise, shows the score is
# meant to depend on the audio rather than on language priors. The sound and music thirds are audio-event and music
# understanding posed as questions, so those leaves are secondary.
#
# MMAU only. MMAU-v05.15.25 (May 2025) is a revision of the same items and is a version here. MMAU-Pro (August 2025)
# has new items, new skills and its own paper and site, so by 04 S4 it is a separate benchmark with no id yet.

id: mmau
name: MMAU
aliases:
  - Massive Multi-Task Audio Understanding and Reasoning Benchmark
tagline: 10k multiple-choice questions on speech, sound and music clips, for audio-language models'
  expert-level reasoning.
description: >
  A benchmark for large audio-language models from the University of Maryland, College Park, with Adobe:
  10,000 audio clips of about ten seconds, each paired with one question and a list of answer options,
  spread across speech, environmental sounds and music. Domain experts wrote the questions and answers,
  and GPT-4 added further answer options. Questions are information extraction (3,499) or reasoning (6,501),
  are tagged with 27 skills, such as temporal event reasoning, chord progressions or multi-speaker role
  mapping, and are rated easy, medium or hard. The audio is pooled from 12 public corpora (AudioSet, VoxCeleb-1,
  IEMOCAP, MusicCaps and others) and 1,394 synthetic clips. There are two splits: test-mini, 1,000 questions
  whose answers are public and which is meant for tuning, and test, 9,000 questions whose answers the
  maintainers withhold. Both are scored by micro-averaged accuracy, overall and for sound, music and speech.
  Test predictions were scored by an EvalAI server until January 2026 and by a Hugging Face Space since
  then. In May 2025 the maintainers released MMAU-v05.15.25, which revised about a quarter of the questions
  and answers and about 5% of the audio, and asked that results cite it. The site keeps a leaderboard
  for each version and a table of community-reported results it has not verified. In the release paper
  the best audio-language model, Gemini Pro v1.5, scored 52.97% on test, against 82% for eight university
  students on test-mini; on the v05.15.25 board the leaders are near 75% on test.
self_description:
  source: src-arxiv-2410-19168
  quote: We present MMAU, a novel benchmark designed to evaluate multimodal audio understanding
    models on tasks requiring expert-level knowledge and complex reasoning.
external_ids:
  huggingface: gamma-lab-umd/MMAU-test-mini
  arxiv: '2410.19168'
paper:
  title: 'MMAU: A Massive Multi-Task Audio Understanding and Reasoning Benchmark'
  arxiv: '2410.19168'
  version_read: v1
  source: src-arxiv-2410-19168-v1
released: 2024-10-24
released_note: The paper's first and only arXiv version, as the abstract page dates it. The EvalAI
  test server opened on 2024-10-26.
released_source: src-arxiv-2410-19168
released_quote: Submitted on 24 Oct 2024
release_venue: ICLR 2025 (Spotlight)
release_venue_note: The ICLR camera-ready PDF on OpenReview was not read (the site asked for a
  challenge check), so the entry's numbers are the arXiv v1 preprint's.
release_venue_source: src-openreview-mmau-search
release_venue_quote: '"venue":{"value":"ICLR 2025 Spotlight"}'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/audio-language
  secondary:
    - audio-speech/audio-event-understanding
    - audio-speech/music-understanding
domain_basis:
  reason: Each item pairs an audio clip with a question and answer options in text, and the score is
    whether the option chosen is the correct answer about that clip. The metric is defined over the
    pair, so the scored quantity is the correspondence between the language answer and the audio,
    which audio-speech's exclusion test sends to multimodal/audio-language. The paper checks this by
    replacing the audio with Gaussian noise; models that keep their score are said not to be
    listening. audio-event-understanding and music-understanding were weighed as primaries, since a
    third of the items are about environmental sounds and nearly half of the information-extraction
    items are about music (instruments, chords, tempo, genre). Both lose because the attribute is
    never scored as a label recovered from the signal; it is scored only through a language answer
    to a language question, so they are secondary, for the sound and music thirds.
  source: src-arxiv-2410-19168-v1
  quote: This progression demands that models not only perceive the audio with respect to the text
    prompt but also apply advanced cognitive skills to respond faithfully.
domain_considered_and_rejected:
  - term: audio-speech/speaker-tasks
    reason: Some speech skills (multi-speaker role mapping) turn on who is speaking, but nothing
      identifies, verifies or diarises a speaker; the role is chosen from text options.
  - term: audio-speech/speech-recognition
    reason: Speech items need the words heard (tongue twisters, conversational fact retrieval), but
      no transcript is produced or scored by word error rate.
  - term: reasoning-general/temporal-reasoning
    reason: Temporal event reasoning is one of the 27 skills, not the benchmark's claim, and no
      temporal subset is scored on its own on the leaderboards.
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: The benchmark claims expert-level knowledge, but its items are not drawn from exams and
      every item needs its audio clip.
capability:
  - perception
  - knowledge-recall
capability_basis:
  perception:
    reason: Every item presents a raw audio clip, and the answer has to be recovered from what is
      heard; the paper's error analysis finds perceptual errors to be the largest share of both
      models' mistakes.
    source: src-arxiv-2410-19168-v1
    quote: challenging models to jointly process auditory content and text, recall relevant
      knowledge, and engage in complex reasoning to solve the tasks
  knowledge-recall:
    reason: The protocol supplies the clip, the question and the options only.
      Information-extraction items are defined as needing outside world knowledge where the audio
      alone does not settle the answer (eco-acoustic knowledge, historical and cultural reasoning),
      and the benchmark claims domain-specific knowledge as part of what it tests.
    source: src-arxiv-2410-19168-v1
    quote: We define an information extraction question as one that requires a deep understanding of
      audio, detailed content analysis, and the application of external world knowledge when
      necessary.
capability_considered_and_rejected:
  - term: temporal-reasoning
    reason: Temporal event reasoning and temporal reasoning are skills inside the reasoning
      questions, but no temporal subset is scored on its own on either leaderboard; the Space breaks
      results down by sub-category without a headline for any one.
  - term: grounding
    reason: No language expression is attached to a stretch of the recording or to a source; the
      answer is chosen among text options, which is perception answered in language.
  - term: causal-reasoning
    reason: Some reasoning skills (acoustic source inference, event-based sound reasoning) ask what
      produced a sound, but no causal subset is scored and the paper does not claim causal
      reasoning.
  - term: quantitative-reasoning
    reason: A few skills count (sound events, stressed phonemes), but counting is one skill among 27
      and is not scored apart.

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: The model is given the options and told to pick one; its answer is extracted and matched
    to one of the supplied options, and the score is micro-averaged accuracy. The chance baseline is
    about 26% (the random-guess row of the original board, 25.92% on test).
  source: src-arxiv-2410-19168-v1
  quote: which is then matched to one of the provided options using string matching
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: The prediction is free text matched to option strings (the Space counts it correct if it
      contains the answer and no other option), but the options are supplied and the paper picks
      one, which is multiple-choice's case.
designed_for_subjects:
  - instruction-tuned-model
  - human-nonexpert
designed_for_subjects_basis:
  reason: The models scored are chat or instruct audio-language models prompted once per question
    with the clip and the options; non-instruct versions are left out because they do not answer by
    choosing an option. Text-only LLMs given audio captions are a robustness check, not the designed
    subject. Eight university students answered test-mini under the same protocol, with no domain
    screen stated.
  source: src-arxiv-2410-19168-v1
  quote: We do not evaluate non-instruct/non-chat versions of Qwen-2, Audio Flamingo, and Pengi as
    they fail to follow instructions and respond by selecting options.
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: The v05.15.25 board includes audio models trained to reason before answering (Audio
      Reasoner, Audio-Thinker), but the protocol fixes no reasoning budget and the release paper's
      subjects are instruction-tuned models.
  - term: human-expert
    reason: The original board types the human row as human_expert, but the paper describes the
      eight participants only as university students; no expertise in sound, speech or music is
      stated.
    source: src-arxiv-2410-19168-v1
    quote: We recruit 8 university students for human evaluation study.
  - term: base-model
    reason: The paper excludes non-instruct checkpoints because they do not answer by selecting an
      option.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced in 2026, for example a paper first posted on 2026-10-09 that
    reports test-mini; the v05.15.25 board lists 2025 systems, and the scoring Space was modified on
    2026-10-15.
  source: src-arxiv-2610-13081
  quote: Experiments on MMAU-test-mini and MMAR show that SWEAR improves accuracy while
    substantially reducing generated tokens
activity: accepting-submissions
activity_note: The Hugging Face Space that scores test predictions was running when read on
  2026-11-10 (created 2026-01-26, last modified 2026-10-15). It returns scores to the submitter; how
  a result reaches the leaderboard is not stated.
activity_basis:
  reason: MMAU has never run in rounds, and a route for scoring test predictions is open now; the
    README sends test submissions to the Space.
  source: src-hf-api-mmau-eval-space
  quote: '"runtime":{"stage":"RUNNING"'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Gemini Pro v1.5
    source: src-arxiv-2410-19168-v1
    observed_on: 2026-11-10
    quote: Notably, even the most advanced Gemini Pro v1.5 achieves only 52.97% accuracy
  - system: Step-Audio-2 (v05.15.25 leaderboard)
    source: src-mmau-leaderboard-v15-parsed
    observed_on: 2026-11-10
    quote: '"name": "Step-Audio-2", "size": "-", "type": "closed"'
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The answer key written and reviewed by the domain experts; for test it is
  held by the maintainers, and test-mini's is public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can score test-mini locally with the released answers and evaluation script, and
    anyone can upload test predictions to the open Space, which returns accuracy without exposing
    the answers.
  source: src-hf-mmau-eval-space-app
  quote: Evaluates uploaded JSON and returns ONLY aggregated metrics
  caveat: The Space holds the test answers in a dataset that is not public, so the test score
    depends on the maintainers keeping it running.

task:
  exists: true
  input:
    - an audio clip of speech, environmental sound or music (10.14 s on average)
    - a question in English and a list of answer options
  output: The text of one option.
  scoring: Micro-averaged accuracy over the split, reported overall and for sound, music and speech,
    on test-mini and test separately. The paper extracts the answer with regular expressions and
    string matching, shuffles the options five times and keeps the most frequent choice; the Space
    scores one prediction per question.
  source: src-arxiv-2410-19168-v1
  quote: We use micro-averaged accuracy as our evaluation metric.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: There is no training split. test-mini's clips, questions and answers are public (its
    Hugging Face set has an answer column); test's clips and questions are public with the answers
    left blank. Neither set is gated.
  access_basis:
    reason: The test questions and audio are released and their answers withheld, so entrants run
      their model and send predictions to the maintainers' scorer. test-mini, the smaller split, is
      fully public.
    source: src-github-mmau-readme
    quote: The 9,000 test questions are available without their answers.
  refresh: versioned-releases
  refresh_basis:
    reason: The items were revised once, in May 2025, under a named version that results are asked
      to cite, and the board keeps the earlier version's results apart.
    source: src-github-mmau-readme
    quote: Please cite this version when reporting results going forward
  data_provenance:
    - expert-authored
    - inherited-from-constituents
  data_provenance_note: Questions and answers were written by domain experts (MS and PhD students in
    sound, speech and music) with the authors' help, filtered by a second team and reviewed again.
    The clips come from 12 earlier corpora (AudioSet and AudioSet Strong, MUStARD, MELD, VoxCeleb-1,
    IEMOCAP, MusicBench, Jamendo, SDD, MusicCaps, GuitarSet, MUSDB18), whose own sources document
    their provenance, plus 1,394 synthetic clips whose generator the paper does not name. GPT-4
    wrote the added answer options from the audio's context and the question, so the distractors are
    model-generated, which is not tagged because the questions and keyed answers are not.
  data_provenance_source: src-arxiv-2410-19168-v1
  data_provenance_quote: Domain experts, with help from the authors, crafted high-quality questions
    and answers for each audio clip.
  contamination_risk: high
  contamination_risk_note: The split most results report, test-mini, has had public answers since
    release and is described as meant for hyperparameter tuning, so tuning on what is scored is part
    of the design; 2026 papers report test-mini alone (SWEAR). test's answers are withheld, but the
    Space scores any number of uploads and reports accuracy by task, difficulty and sub-category.
    The clips come from public corpora (AudioSet, VoxCeleb-1, IEMOCAP, MusicCaps) that
    audio-language models are commonly trained on, and the paper's noise test finds two models
    scoring the same without the audio.
  contamination_evidence:
    - source: src-arxiv-2410-19168-v1
      stance: supports
      quote: 'Splits (test-mini: test) 1000:9000 tended for hyperparameter tuning'
    - source: src-arxiv-2610-13081
      stance: supports
      quote: Experiments on MMAU-test-mini and MMAR show that SWEAR improves accuracy
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: 82.23% average accuracy on test-mini (sound 86.31, music 78.22, speech
    82.17) from eight university students who listened to each clip before answering, on the
    original version; the v05.15.25 board shows no human row.
  ceiling_anchor_type_source: src-arxiv-2410-19168-v1
  ceiling_anchor_type_quote: In comparison, human performance achieves 82%.
  dataset_licence: CC-BY-NC-4.0
  dataset_licence_note: The licence of the test-mini set on Hugging Face. The test set there is
    tagged MIT, and the repository's licence file is Apache-2.0 (GitHub's metadata); no source
    reconciles them, and the clips come from corpora with their own terms, which the README says the
    annotators were told to respect.
  dataset_licence_source: src-hf-api-mmau-test-mini
  dataset_licence_quote: license:cc-by-nc-4.0
  size:
    - count: 10000
      unit: audio clips, each with one multiple-choice question
      source: src-arxiv-2410-19168-v1
      quote: MMAU comprises 10k carefully curated audio clips paired with humanannotated natural
        language questions and answers spanning speech, environmental sounds, and music
    - count: 1000
      unit: questions, answers public
      subset: test-mini
      source: src-arxiv-2410-19168-v1
      quote: For evaluation, 1,000 instances were chosen to form the test-mini set, evenly
        distributed across all tasks, while the remaining instances were allocated to the main test
        set.
    - count: 9000
      unit: questions, answers withheld
      subset: test
      source: src-github-mmau-readme
      quote: The 9,000 test questions are available without their answers.
    - count: 1394
      unit: synthetic audio clips, beside 8,606 from 12 public corpora
      subset: audio sources (paper Table 6)
      source: src-arxiv-2410-19168-v1
      quote: 'MusicCaps GuitarSet MUSDB18 Synthetic # Audios 2788 391 405 540 633 515 1937 32 277 514
        506 68 1394'
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The MMAU authors at the University of Maryland, College Park (datasets under the
    gamma-lab-umd organisation on Hugging Face)
  maintainer_basis:
    reason: The paper's authors are at the University of Maryland, one at Adobe. Both datasets sit
      under the gamma-lab-umd organisation, while the repository, the site and the scoring Space are
      held under authors' personal accounts.
    source: src-hf-api-mmau-test-mini
    quote: '"author":"gamma-lab-umd"'
  maintainer_type: academic-lab
  maintainer_type_note: The datasets are held by a university lab's organisation account; the code,
    site and Space are authors' personal accounts in the same group, which individual's exclusion
    leaves to the lab.
  submission_process:
    - held-out-server
    - self-reported
  submission_process_note: Test predictions go to a scorer that holds the answers, EvalAI challenge
    2391 from October 2024 to January 2026 and a Hugging Face Space since. The v05.15.25 site also
    carries a table of community-reported results that the maintainers say they have not verified.
    How rows reach the main tables is not stated; the site says the maintainers parsed and
    standardised the models' outputs for their evaluation script, which may be maintainer-run
    (review_checks).
  submission_process_source: src-github-mmau-readme
  submission_process_quote: MMAU test evaluation has moved from Eval.ai to HF Space
  independence_flags: []
  independence_flags_note: Not assessed. The board ranks GAMA and GAMA-IT, which the paper describes
    as open-source audio-language models and cites from a paper that appears to share authors with
    MMAU's; no source read states that, so maintainer-competes-on-own-benchmark is not set
    (review_checks). GPT-4 wrote the distractor options and GPT-4o is evaluated on captions, which
    is not a grader relation.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The test score, which the boards rank beside test-mini, can be computed only by the
      maintainers' scorer, because they hold the test answers. test-mini can be scored by anyone.
    source: src-github-mmau-readme
    quote: The answers and explanations for the test set questions are withheld.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: evaluation.py in the repository (string matching of each prediction against the options);
    the Space applies the same rule to test.
  harness_source: src-github-mmau-readme
  harness_quote: evaluates a large audio language model's predictions for MMAU benchmark
  harness_gotcha:
    source: src-arxiv-2410-19168-v1
    quote: we randomize the order of the options five times and select the option chosen most
      frequently
  harness_gotcha_note: The release paper's numbers come from five shuffles of the options with a
    majority vote and the best of several prompt sets, while evaluation.py and the Space score one
    prediction per question, counted correct if it contains the answer and no other option. The site
    adds that it parsed and standardised each model's output format, so board rows and self-run
    scores can differ by parsing alone.
  submission_channel:
    source: src-github-mmau-readme
    quote: MMAU test evaluation has moved from Eval.ai to HF Space
  submission_channel_note: The MMAU-Eval Space on Hugging Face, held under an author's personal
    account (announced 2026-01-30); EvalAI challenge 2391 before it.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for the repository, read 2026-11-10 (a LICENSE file
    added 2025-07-01); not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the resolved profile: the version and split (original or v05.15.25; test-mini, whose answers are public,
  # or test through the scorer), the selection rule (the paper's five option shuffles with a majority vote, or one
  # answer), the prompt (the paper reports the best of several prompt sets) and the answer parser.
  material_extra:
    - subset_used
    - selection_strategy
    - prompt_template_hash
    - harness
aggregation_policy_note: The headline is accuracy over all questions of a split (the boards' Avg
  column), beside sound, music and speech.

homepage: https://sakshi113.github.io/mmau_homepage/
repository: https://github.com/Sakshi113/MMAU
dataset_url: https://huggingface.co/datasets/gamma-lab-umd/MMAU-test-mini
leaderboard_url: https://sakshi113.github.io/mmau_homepage/#leaderboard-v15-parsed

versions:
  - version: 2024-10
    label: The release with the paper (October 2024)
    version_kind: revision
    released: 2024-10-24
    items: 10000
    changes: 10,000 questions in test-mini (1,000) and test (9,000), with the EvalAI server for
      test. Its results stay on the site's old leaderboard, with the human row and random-guess
      baseline.
    breaking: false
    superseded_by: v05.15.25
    frozen: true
    sources:
      - src-arxiv-2410-19168-v1
      - src-mmau-leaderboard-v1
  - version: v05.15.25
    label: MMAU-v05.15.25
    version_kind: revision
    items: 10000
    changes: About 25% of the questions and answers revised and about 5% of the audio files refined,
      after community feedback; results are asked to cite this version, and the site keeps a
      separate leaderboard for it beside the earlier one. The name reads as 15 May 2025, but no
      source read dates the release, so released is null.
    breaking: true
    supersedes_version: 2024-10
    frozen: true
    sources:
      - src-github-mmau-readme
      - src-mmau-homepage
      - src-mmau-leaderboard-v15-parsed

subsets:
  - id: mmau#test-mini
    label: test-mini
    items: 1000
    scored_separately: true
    evidence:
      - source: src-arxiv-2410-19168-v1
        quote: For evaluation, 1,000 instances were chosen to form the test-mini set, evenly
          distributed across all tasks, while the remaining instances were allocated to the main
          test set.
      - source: src-hf-dsserver-mmau-test-mini-info
        quote: '"answer":{"dtype":"string","_type":"Value"}'
    notes: The task distribution of test in a tenth of the size, with public answers, meant for
      hyperparameter tuning; it is the only split with a human baseline, and many 2026 papers report
      it alone. EvalAI's dev phase scored it.
  - id: mmau#test
    label: test
    items: 9000
    scored_separately: true
    evidence:
      - source: src-github-mmau-readme
        quote: The 9,000 test questions are available without their answers.
      - source: src-evalai-mmau-challenge-2391
        quote: Only the test split results are considered for the leaderboard.
    notes: Answers withheld; scored by EvalAI's test phase until January 2026 and by the Space
      since.
  - id: mmau#sound
    label: Sound
    scored_separately: true
    domain_override:
      primary: multimodal/audio-language
      secondary:
        - audio-speech/audio-event-understanding
    evidence:
      - source: src-evalai-mmau-challenge-2391
        quote: 'Task-wise Accuracy: Accuracy computed separately for each task type (sound, music, speech).'
    notes: Environmental-sound questions (scene, source, event order and duration), a column on
      every board. Items are not counted per domain in the sources read; the paper calls the split
      even across the three domains.
  - id: mmau#music
    label: Music
    scored_separately: true
    domain_override:
      primary: multimodal/audio-language
      secondary:
        - audio-speech/music-understanding
    evidence:
      - source: src-evalai-mmau-challenge-2391
        quote: 'Task-wise Accuracy: Accuracy computed separately for each task type (sound, music, speech).'
    notes: Questions on instrumentation, harmony and chords, rhythm and tempo, genre, lyrics and the
      emotional tone of music.
  - id: mmau#speech
    label: Speech
    scored_separately: true
    domain_override:
      primary: multimodal/audio-language
    evidence:
      - source: src-evalai-mmau-challenge-2391
        quote: 'Task-wise Accuracy: Accuracy computed separately for each task type (sound, music, speech).'
    notes: Questions on what was said and how (conversational facts, phonemic stress, speaker roles,
      emotion shifts, sarcasm); the paper's models do worst on this domain.
subsets_note: The two splits are the release's; the three domains are columns of every board and of
  the scorer's task-wise accuracy. The scorer also reports accuracy by difficulty and by skill
  (sub-category), which are diagnostics rather than ranked subsets.

lineage:
  role: root
lineage_note: >
  MMAU-Pro (arXiv 2508.13992, August 2025), announced in the README as a more challenging benchmark, has
  5,305 new instances with audio collected for it, 49 skills, multi-audio and spatial items and open-ended
  as well as multiple-choice answers, with its own paper, site and dataset and an overlapping author team.
  By 04 S4 it is a separate benchmark, not a version; it has no id, so no edge is recorded (review_checks).
  Two existing entries meet MMAU without an edge: DCASE 2026 Task 5 (audio-speech/dcase) draws a small
  portion of its development and evaluation questions from MMAU, MMAR and MMSU after audio-dependency
  filtering, as dcase.yaml's provenance note says, and MMAU pools 514 of its clips from MusicCaps (audio-speech/musiccaps).
  Neither file is edited here.

history:
  - date: 2026-01-16
    event: channel-closed
    field: execution.submission_channel
    from: EvalAI challenge 2391
    source: src-evalai-mmau-challenge-2391

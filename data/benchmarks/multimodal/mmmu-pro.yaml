# data/benchmarks/multimodal/mmmu-pro.yaml
#
# P1-S8-T08, multimodal entry 3 of 6. Filled from MMMU-Pro's paper, arXiv 2409.02813 read as its v3 PDF
# (2025-05-22, ACL 2025), and its abstract page; the mmmu-pro folder's README in MMMU-Benchmark/MMMU; the
# leaderboard data file the shared MMMU / MMMU-Pro project page renders (leaderboard_data.json); Hugging Face's
# API record of the MMMU/MMMU_Pro dataset and its dataset card; the abstract page of MAmmoTH-VL (arXiv
# 2412.05237), for its authors; and the v1 PDF of Genesis (arXiv 2610.15565, October 2026), a paper that reports
# MMMU-Pro results. It also cites two Sources MMMU's entry committed, the project site and the repository README
# (same URLs), for passages inside their extracts only. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.
#
# MMMU-Pro only. It is derived from MMMU (lineage), which is its own entry.

id: mmmu-pro
name: MMMU-Pro
tagline: MMMU's image-dependent questions with ten options and a vision-only setting that puts the
  question inside the image.
description: >
  A more robust revision of MMMU by the MMMU team (ACL 2025). Four open text-only LLMs answered MMMU's
  questions without their images, ten times each, and every question that at least three of them
  answered correctly in most trials was removed; 1,800 of the remaining questions were sampled evenly
  across MMMU's 30 subjects. Each question's options were then augmented from four to (usually) ten,
  proposed with GPT-4o and reviewed by human experts, who also removed 70 questions, leaving 1,730. A
  vision-only setting presents the same 1,730 questions as screenshots or photos that annotators took
  of a display, with varied backgrounds and fonts and no text fed to the model. The headline score is
  accuracy averaged over the standard ten-option setting and the vision setting; a four-option
  standard setting is reported for comparison only. The paper runs every model with a direct and a
  chain-of-thought prompt and reports the higher. The maintainers' leaderboard, shared with MMMU, lists
  their own runs beside results provided by model developers, and human-expert bands estimated from
  MMMU's human evaluation. Items and answers are public on Hugging Face, where the maintainers date the
  fixes they make.
self_description:
  source: src-arxiv-2409-02813-v3
  quote: This paper introduces MMMU-Pro, a robust version of the Massive Multi-discipline Multimodal
    Understanding and Reasoning (MMMU) benchmark
external_ids:
  huggingface: MMMU/MMMU_Pro
  arxiv: '2409.02813'
paper:
  title: 'MMMU-Pro: A More Robust Multi-discipline Multimodal Understanding Benchmark'
  arxiv: '2409.02813'
  version_read: v3
  source: src-arxiv-2409-02813-v3
released: 2024-09-04
released_note: The paper's first arXiv version, as the abstract page dates it; the README and the
  dataset card announce MMMU-Pro on 2024-09-05.
released_source: src-arxiv-2409-02813
released_quote: Submitted on 4 Sep 2024
release_venue: ACL 2025 (main conference)
release_venue_source: src-arxiv-2409-02813
release_venue_quote: ACL 2025 Main

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/visual-qa
  secondary:
    - general-intelligence/multi-subject-knowledge-exams
domain_basis:
  reason: Every scored item is a question whose answer depends on its image. The first construction
    step removes the MMMU questions that text-only models answer, and the vision setting moves the
    question itself into the image. What is scored is an answer chosen in language against an image,
    which is the relation vision's exclusion test hands to multimodal and multimodal's inclusion
    test takes ("answering in language about an image"); nothing recovered from the image is scored
    on its own. The breadth across MMMU's 30 subjects is recorded as the secondary leaf, because
    general-intelligence's exclusion sends a multi-subject exam whose every item needs the image to
    multimodal (ADR-0015), and visual-qa's not_to_be_confused_with keeps such an exam in visual-qa.
  source: src-arxiv-2409-02813
  quote: (1) filtering out questions answerable by text-only models, (2) augmenting candidate
    options, and (3) introducing a vision-only input setting where questions are embedded within
    images
domain_considered_and_rejected:
  - term: vision/document-understanding
    reason: The vision setting's inputs are screenshots and photos of question pages, so text must
      be read from the image, but the score is the option chosen, not extracted structure or text.
      The paper argues that reading is not what the setting tests, and an OCR-first prompt did not
      change results. The images are rendered exam questions rather than forms, tables or reports
      (see review_checks).
    source: src-arxiv-2409-02813-v3
    quote: requiring models to not only recognize text but also understand its context
  - term: vision/ocr-handwriting
    reason: The paper measures OCR accuracy (Levenshtein similarity of the extracted question text)
      as an analysis, but no benchmark setting scores a transcription.
    source: src-arxiv-2409-02813-v3
    quote: explicitly asking the model to first extract the question and then solve it
  - term: multimodal/chart-diagram-understanding
    reason: Charts and diagrams are among MMMU's 30 image types, but no setting or score isolates
      them, and the benchmark's changes concern the image-text relation for every image type.
    source: src-arxiv-2409-02813-v3
    quote: featuring 30 diverse image types such as charts, diagrams, maps, and chemical structures
capability:
  - perception
  - knowledge-recall
  - context-integration
capability_basis:
  perception:
    reason: Every item needs its image, and in the vision setting the question and its options must
      also be recovered from a screenshot or photo before anything else can happen.
    source: src-arxiv-2409-02813-v3
    quote: In this setting, the model is presented with a question embedded within a screenshot or
      photo, without any text explicitly fed into the model
  knowledge-recall:
    reason: The protocol supplies the question, its images and its options only; the college-level
      subject knowledge the answer needs is what the model brings, as in MMMU.
    source: src-arxiv-2409-02813-v3
    quote: to evaluate multimodal AI models on college-level tasks that require subject-specific
      knowledge and deliberate reasoning
  context-integration:
    reason: The filter keeps only questions whose answer depends on the supplied image, removing
      those that text-only LLMs answered without it, so the score tests whether the image was used.
    source: src-arxiv-2409-02813
    quote: filtering out questions answerable by text-only models
capability_considered_and_rejected:
  - term: quantitative-reasoning
    reason: Many science and engineering items need calculation, but the claim and the score are
      across all 30 subjects, and no quantitative subset is scored on its own.
  - term: distribution-shift-generalization
    reason: The vision setting re-presents the same questions in photos and screenshots with varied
      backgrounds and fonts, scored as its own condition, but the protocol is zero-shot and defines
      no distribution the system was fitted to. The setting is the benchmark's construct, reading
      text and image together, not a held-out input condition.
    source: src-arxiv-2409-02813-v3
    quote: This process involves varying the backgrounds, font styles, and font sizes
  - term: adversarial-robustness
    reason: '"Robust" describes the benchmark. The filter removes questions that text-only LLMs answer,
      chosen against shortcuts in the item set, not inputs chosen to defeat the system under test.'
    source: src-arxiv-2409-02813-v3
    quote: The dataset may still contain subtle statistical shortcuts that models can exploit

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: The model picks one lettered option. The standard and vision settings have up to ten
    options per question, usually ten, so chance is about 0.10; the leaderboard's Random Choice row
    scores 12.6 overall. Accuracy is computed per setting, and the headline averages the standard
    ten-option setting and the vision setting. The direct prompt asks for the option letter, and the
    CoT prompt for reasoning that ends in an answer line, so the prompt mode is a condition of every
    number.
  source: src-arxiv-2409-02813-v3
  quote: The overall performance score for MMMU-Pro is calculated as the average of scores from
    settings (2) and (3)
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: Models are prompted zero-shot, without tools, with an instruction to answer a
    multiple-choice question. The paper runs each model with a direct and a chain-of-thought prompt
    and keeps the higher score.
  source: src-arxiv-2409-02813-v3
  quote: We evaluate the models with both Direct and CoT prompts (as shown in Appendix A), and
    report the higher ones in the overall results
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: The leaderboard's three Human Expert rows were not produced under MMMU-Pro's protocol.
      The paper approximates them from MMMU's human evaluation data, guessing among the augmented
      options where an expert wrote no solution.
    source: src-arxiv-2409-02813-v3
    quote: we develop an approach to approximate human expert performance based on the original MMMU
      human evaluation data
  - term: reasoning-model
    reason: Leaderboard rows name thinking settings (observed_subjects), but the protocol is not
      built around a reasoning budget.
  - term: tool-augmented-model
    reason: Some developer-reported rows ran with tools (as_used), but the protocol offers none.
observed_subjects:
  values:
    - instruction-tuned-model
    - reasoning-model
    - tool-augmented-model
  basis: >
    Of the 74 rows with an MMMU-Pro score in the maintainers' leaderboard data (read 2026-10-14), the
    newest are developer-reported frontier models named with their reasoning setting ("Gemini 3.1 Pro
    Thinking (High)", 80.5) or with and without tools ("GPT-5.4 Thinking w/ tools", 82.1, and "w/o
    tools", 81.2).
  source: src-mmmu-leaderboard-data
as_used:
  - protocol: Developer-reported leaderboard rows run with tools or with a named thinking setting,
      listed in one ranking with the maintainers' tool-free runs.
    source: src-mmmu-leaderboard-data
    quote: '"name": "GPT-5.4 Thinking w/ tools", "size": "-", "date": "2026-03-05"'
    note: The same model also has a "w/o tools" row, 0.9 points lower; Claude Opus 4.6 has both
      kinds too.
  - protocol: One MMMU-Pro number per model, with no setting (standard ten-option, standard
      four-option, vision, or their average), prompt or CoT mode named.
    source: src-arxiv-2610-15565-v1
    quote: MMMU (DEV-VAL split) [37], MMMUPro, EMMA [10]
    note: Genesis (October 2026), a rubric-based reinforcement-learning method on Qwen3-VL. Its
      largest gain at 32B is on MMMU-Pro, and it does not cite the MMMU-Pro paper.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. The maintainers' leaderboard data carries MMMU-Pro rows
    dated up to 2026-07-01, and an October 2026 paper reports its largest gain on MMMU-Pro. The
    dated fixes to the items, three in 2026 and the latest on 2026-10-04, are each announced as
    done, so under-revision is not tagged (see review_checks).
  source: src-arxiv-2610-15565-v1
  quote: with the largest improvements over Qwen3-VL-32B on MMMU-Pro (+18.6)
  newest_submission: 2026-07-01
activity: unknown
activity_note: The page's static "Last updated" line reads 09/05/2025, but a script overwrites it
  with the newest row's date, 07/01/2026 when read (the cited extract of the site carries the static
  line).
activity_basis:
  reason: Outside results do reach the leaderboard, as 49 of its 74 MMMU-Pro rows are marked as
    provided by the authors, the newest dated 2026-07-01. But no source read, neither the site, the
    README nor the dataset card, says how to submit or whether entries are taken, which is the case
    this term reserves.
  source: src-mmmu-leaderboard-data
  quote: '"name": "Chance Vision 1.5", "size": "-", "date": "2026-07-01"'
  newest_submission: 2026-07-01

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4o (0513)
    source: src-arxiv-2409-02813-v3
    observed_on: 2026-10-14
    quote: GPT4o (0513) experienced a decrease of 10.7%, from 64.7% to 54.0%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The answer key of the source questions, carried over from MMMU and
  released with the items.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The questions, images and answers of all three settings are on Hugging Face without a
    gate, and the repository ships the inference and evaluation scripts.
  source: src-hf-api-mmmu-pro
  quote: '"gated":false'

task:
  exists: true
  input:
    - 'standard: a question with its images and up to ten lettered options, as text and images'
    - 'vision: one screenshot or photo holding the question, its figure and its options, with no text
      input'
  output: An option letter, given directly or after step-by-step reasoning that ends in an answer
    line.
  scoring: Accuracy per setting. The headline is the mean of the standard ten-option and vision
    settings; the paper keeps each model's higher result of direct and CoT prompting.
  source: src-arxiv-2409-02813-v3
  quote: The model is required to answer a multiple-choice question with up to 10 options

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: All three configurations are public on Hugging Face without a gate, each item with its
      answer field. The only split is test.
    source: src-hf-api-mmmu-pro
    quote: '"config_name":"vision","features":[{"name":"id","dtype":"string"},{"name":"image","dtype":"image"},{"name":"options","dtype":"string"},{"name":"answer","dtype":"string"}'
  refresh: versioned-releases
  refresh_note: 'The dataset card dates every change since release: the four-option cases uploaded 2024-10-20,
    options added to the vision configuration 2024-11-10, and fixes to labels, options or questions on
    2025-03-08, 2026-05-30, 2026-07-10 and twice on 2026-10-04, each naming the items changed. The fixes
    are made in place, with no version label.'
  refresh_basis:
    reason: Every change to the items is carried by a dated maintainer announcement that names the
      items, which a claim can be pinned to; a dated erratum counts.
    source: src-hf-api-mmmu-pro
    quote: '[2026-10-04] Fixed the option augmentation issue in Vision and Standard (10 options) settings.'
  data_provenance:
    - inherited-from-constituents
    - exam-derived
    - model-generated
    - real-world-instrument
  data_provenance_note: The questions and images are MMMU's, filtered and sampled (577 of the 1,730
    from MMMU's validation set, the item ids naming test-set origins for others); MMMU took them
    from college exams, quizzes and textbooks. The added options were proposed with GPT-4o, filtered
    with Claude 3.5 and reviewed twice by human experts. The vision items are screenshots, and
    photos that annotators took of a display.
  data_provenance_source: src-arxiv-2409-02813-v3
  data_provenance_quote: we ask the human annotators to manually capture photos and screenshots over
    a simulated display environment
  contamination_risk: medium
  contamination_risk_note: The items and answers have been public on Hugging Face since release, and
    every question is an MMMU question, whose validation answers were always public and whose test
    answers were released on 2026-02-12 (MMMU's entry, which rates MMMU high). A training route is
    plausible, but no source read evidences one into MMMU-Pro, and the ten-option rewrites and the
    vision images are MMMU-Pro's own.
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_note: Human Expert low, medium and high bands (73.0, 80.8, 85.4) on the
    leaderboard, estimated from the 90 human experts of MMMU's evaluation, on the 577 questions
    drawn from MMMU's validation set, rather than measured on MMMU-Pro. One developer-reported row
    (Chance Vision 1.5, 86.9, 2026-07-01) is above the high band.
  dataset_licence: Apache-2.0
  dataset_licence_source: src-hf-api-mmmu-pro
  dataset_licence_quote: license:apache-2.0
  size:
    - count: 1730
      unit: questions, each scored in the standard ten-option and the vision setting
      source: src-arxiv-2409-02813-v3
      quote: we obtain 1730 questions in total
    - count: 3460
      unit: scored instances (1,730 standard and 1,730 vision)
      subset: standard ten-option and vision settings together
      source: src-arxiv-2409-02813-v3
      quote: Ultimately, we obtain 3,460 questions
    - count: 1730
      unit: test items in each of the three Hugging Face configurations (standard ten-option,
        standard four-option, vision)
      subset: Hugging Face release
      source: src-hf-api-mmmu-pro
      quote: '"num_examples":1730'
    - count: 577
      unit: questions drawn from MMMU's validation set
      subset: provenance
      source: src-arxiv-2409-02813-v3
      quote: Given that the 577 questions in MMMU-Pro are sourced from the MMMU validation set
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The MMMU team (the MMMU-Benchmark organisation on GitHub, MMMU on Hugging Face)
  maintainer_basis:
    reason: The paper's affiliation line is the MMMU Team, and the code, data and leaderboard sit in
      the MMMU-Benchmark and MMMU organisation accounts that also hold MMMU.
    source: src-arxiv-2409-02813-v3
    quote: Graham Neubig arXiv:2409.02813v3 [cs.CL] 22 May 2025 MMMU Team
  maintainer_type: community-collective
  maintainer_type_note: Thirteen authors across institutions under shared organisation accounts,
    with no single holder or legal form stated; MMMU's entry has the same type.
  submission_process:
    - maintainer-run
    - self-reported
  submission_process_note: The leaderboard's unmarked MMMU-Pro rows are the maintainers' own runs
    (25 of 74, counting the human-estimate and chance rows). The other 49 carry the page's "results
    provided by the authors" mark, stored as source author in the data, and no source says anyone
    checks them. No submission route is described (activity).
  submission_process_source: src-mmmu-leaderboard-data
  submission_process_quote: '"pro": { "overall": "86.9", "vision": "86.1", "original": "87.6", "source":
    "author" }'
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-mmmu-leaderboard-data
      quote: '"name": "MAmmoTH-VL-8B"'
  independence_flags_note: MAmmoTH-VL-8B has an author-provided MMMU-Pro row (25.3). Four of its ten
    authors, Yubo Wang, Graham Neubig, Wenhu Chen and Xiang Yue, are MMMU-Pro authors
    (src-arxiv-2412-05237). The paper discloses no funding.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The inference scripts run API models (the paper's baselines include GPT-4o, Claude 3.5
      Sonnet and Gemini 1.5 Pro) and the protocol mandates no hardware; serving open weights on GPUs
      is the entrant's choice.
    source: src-github-mmmu-mmmu-pro-readme
    quote: python infer/infer_gpt.py gpt-4o cot vision
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Items and answers are public and the scoring is mechanical, so anyone can produce the
      headline score with the released scripts, with no maintainer-only step.
    source: src-github-mmmu-mmmu-pro-readme
    quote: For evaluating inference results
  harness_availability: official-harness
  harness: The repository's mmmu-pro folder (infer/infer_xxx.py with a model, a cot or direct mode
    and a setting, then evaluate.py)
  harness_source: src-github-mmmu-readme
  harness_quote: Please refer to our evaluation folders for detailed information on evaluating with
    both MMMU and MMMU-Pro benchmarks
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for MMMU-Benchmark/MMMU, read 2026-10-14 (last pushed
    2026-07-28); not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the llm-static-text profile, which already carries chain_of_thought, tools_allowed and reasoning_effort:
  # the setting (standard ten-option, vision, their average, or the four-option comparison set), whether CoT was
  # used (the paper reports the higher of direct and CoT per model, so a paper number may be either), and the
  # prompt itself (the paper's direct, CoT and OCR prompts, or a model's own).
  material_extra:
    - subset_used
    - chain_of_thought
    - prompt_template_hash
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The headline is the mean of the standard ten-option and the vision accuracies; the
    four-option setting is excluded from it.
  source: src-arxiv-2409-02813-v3
  quote: The overall performance score for MMMU-Pro is calculated as the average of scores from
    settings (2) and (3)

homepage: https://mmmu-benchmark.github.io/
repository: https://github.com/MMMU-Benchmark/MMMU
dataset_url: https://huggingface.co/datasets/MMMU/MMMU_Pro
leaderboard_url: https://mmmu-benchmark.github.io/#leaderboard
leaderboard_url_note: Shared with MMMU; one table with MMMU-Pro, MMMU (Val) and MMMU (Test) columns.
leaderboard_url_source: src-mmmu-benchmark-site
leaderboard_url_quote: Click on MMMU-Pro, MMMU (Val) or MMMU (Test) to expand detailed results.

subsets:
  - id: mmmu-pro#standard-10-options
    label: Standard (10 options)
    items: 1730
    scored_separately: true
    evidence:
      - source: src-github-mmmu-mmmu-pro-readme
        quote: Uses the standard format of augmented MMMU with ten options
    notes: Half of the headline; the leaderboard's Standard column. The options are shuffled, so the
      image tokens inside them need not follow the images' order.
  - id: mmmu-pro#vision
    label: Vision
    items: 1730
    scored_separately: true
    evidence:
      - source: src-github-mmmu-mmmu-pro-readme
        quote: Uses a screenshot or photo form of augmented MMMU
      - source: src-hf-mmmu-pro-card
        quote: '[2024-11-10] Added options to the Vision subset.'
    notes: Half of the headline. The question, figure and options are in the image; the Hugging Face
      configuration has also carried the options as a text field since 2024-11-10.
  - id: mmmu-pro#standard-4-options
    label: Standard (4 options)
    items: 1730
    scored_separately: true
    evidence:
      - source: src-arxiv-2409-02813-v3
        quote: 1) Standard setting without augmented options (usually 4 options)
      - source: src-hf-mmmu-pro-card
        quote: '[2024-10-20] Uploaded Standard (4 options) cases.'
    notes: Reported for comparison only and outside the headline, so a four-option number is not an
      MMMU-Pro score. Its cases were uploaded after release.

lineage:
  role: variant
  subset_of: mmmu
  subset_of_basis:
    reason: The questions are MMMU's, filtered and sampled, then given augmented options and a
      vision rendering, so the items are a modified subset of MMMU's. MMMU's entry lists this one as
      its variant.
    source: src-arxiv-2409-02813-v3
    quote: We randomly sample 1800 questions from the remaining pool, evenly distributed across 30
      subjects (60 questions per subject)

tags:
  - multimodal
  - college-exams
  - visual-question-answering
  - multiple-choice
  - vision-only

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T08)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2409-02813-v3
    - src-arxiv-2409-02813
    - src-github-mmmu-mmmu-pro-readme
    - src-github-mmmu-readme
    - src-mmmu-benchmark-site
    - src-mmmu-leaderboard-data
    - src-hf-api-mmmu-pro
    - src-hf-mmmu-pro-card
    - src-arxiv-2412-05237
    - src-arxiv-2610-15565-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text; its abstract page for the date and venue; the
    mmmu-pro folder's README at main; MMMU's committed site and README Sources, cited for passages
    inside their extracts only; the leaderboard_data.json file the site's script renders; Hugging Face's
    API record of the dataset, and the dataset card for its full change log (withheld from archiving:
    it holds a personal e-mail address); MAmmoTH-VL's abstract page for its authors; and Genesis's v1
    PDF (a DOI) as evidence of current use.
  confidence: medium
  review_checks:
    - check: The vision setting's images are screenshots and photos of question pages.
        vision/document-understanding's not_to_be_confused_with makes it secondary for a
        document-image benchmark posed as questions; it was rejected here because the images are
        rendered exam questions rather than documents, which a reviewer may read differently.
      field: domain.secondary
    - check: "activity unknown or accepting-submissions: 49 author-provided MMMU-Pro rows, the newest
        dated 2026-07-01, show results still reaching the board, but no source states a route. The same
        script-written date bears on MMMU's entry, whose activity basis reads the static \"Last updated:
        09/05/2025\"."
      field: activity
      source: src-mmmu-benchmark-site
      quote: 'Last updated: 09/05/2025'
    - check: lifecycle active or under-revision. Fixes keep arriving (2026-05-30, 2026-07-10, twice
        on 2026-10-04), each announced as done, with nothing announced as pending.
      field: lifecycle
      source: src-hf-mmmu-pro-card
      quote: '[2026-05-30] Fixed the option augmentation issue in Vision and Standard (10 options) settings.'
    - check: self-reported assumes developers send their numbers. Many author-provided rows link to
        the developer's announcement (GPT-5.4 links an OpenAI page), so the maintainers may copy
        published numbers instead, which no submission_process term describes exactly.
      field: governance.submission_process
    - check: maintainer-competes-on-own-benchmark rests on four MMMU-Pro authors co-authoring
        MAmmoTH-VL, whose MMMU-Pro row is author-provided; the maintainers did not enter a system as
        the MMMU team.
      field: governance.independence_flags
      source: src-arxiv-2412-05237
      quote: Yubo Wang, King Zhu, Yizhi Li, Graham Neubig, Wenhu Chen, Xiang Yue
    - check: knowledge-recall and context-integration are both assigned, each term's
        not_to_be_confused_with pointing at the other. The image is supplied and determines the
        answer; the subject knowledge is not supplied.
      field: capability

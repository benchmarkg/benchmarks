# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T09)
  added_on: 2026-11-10
  last_verified: 2026-11-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1505-00468-v7
    - src-arxiv-1505-00468
    - src-arxiv-1612-00837-v3
    - src-arxiv-1612-00837
    - src-visualqa-home
    - src-visualqa-download
    - src-visualqa-v1-download
    - src-visualqa-evaluation
    - src-visualqa-challenge
    - src-visualqa-terms
    - src-github-vqa-readme
    - src-evalai-vqa-challenge-830
    - src-evalai-vqa-challenge-830-phases
    - src-evalai-vqa-leaderboard-2278
    - src-arxiv-2610-28801
    - src-arxiv-2502-03461-v1
    - src-arxiv-1712-00377
    - src-arxiv-1902-05660
  sources_note: >
    The two papers' last PDFs (DOIs, not archived) read as text, and their abstract pages for dates and
    the venue; six visualqa.org pages (GitHub Pages, no robots.txt) with scripts and styles stripped,
    four of them withheld from archiving because they print names; the evaluation repository's README
    pinned at its newest commit, withheld for its developer line; EvalAI's public API records of challenge
    830, its phases and the first 500 of 559 test-standard leaderboard rows, unauthenticated, the leaderboard
    withheld for personal names in team names; JUICE's abstract page (a DOI) as evidence of current use;
    the existing Source for arXiv 2502.03461 for its finding on VQA v2.0 labels; and the abstract pages
    of VQA-CP and VQA-Rephrasings (DOIs) for lineage.
  confidence: medium
  review_checks:
    - check: The id. Proposed `vqa`, with v1.0 and v2.0 as versions, by the allocation rule that a
        dotted release or vN is a version of the same benchmark and only a successor its maintainers
        name as a new benchmark gets its own id. The maintainers call v2.0 the 2nd iteration of the
        VQA dataset and challenge, EvalAI's record calls v1.0 the 1st edition of the VQA dataset,
        and v2.0 keeps the site, team, question types, metric, splits and evaluation code. The other
        reading is `vqa-v2` as its own benchmark -- it has its own paper and title, is cited and
        reported as "VQAv2" on its own, re-balances rather than extends v1.0, drops the
        multiple-choice task and has its own test answers, and v1.0 and v2.0 scores are never
        compared. A third question is the generic-name rule, since VQA is also the task's name (the
        paper introduces the task as VQA) and the corpus already uses "VQA" for other benchmarks'
        tracks; a disambiguated id such as `visualqa` would follow it, while MATH's bare `math` is
        the precedent against. Ids are a human act; this stays a proposal.
      field: id
      source: src-arxiv-1612-00837-v3
      quote: as part of the 2nd iteration of the Visual Question Answering Dataset and Challenge
        (VQA v2.0)
    - check: version_kind for v2.0 is edition (new items on the same task, breaking). It reuses
        v1.0's real-image questions with new complementary images and answers, so revision (the same
        items changed) is arguable; and v1.0 is marked revision as the first release, following
        OSWorld's 1.0. The betas are not listed as versions.
      field: versions
      source: src-evalai-vqa-challenge-830
      quote: The 1st edition of the VQA Challenge was organized in CVPR 2016 on the 1st edition
        (v1.0) of the VQA dataset
    - check: evaluation_method is reference-metric because exact-match excludes partial credit, but
        VQA accuracy is not a similarity measure like BLEU; it is an exact match against each of ten
        human answers, credited by how many gave it. A missing-term gap was logged; a
        consensus-match term, or exact-match allowing partial credit against multiple references,
        would fit better.
      field: evaluation_method
      source: src-visualqa-evaluation
      quote: machine accuracies are averaged over all 10 choose 9 sets of human annotators
    - check: The human anchor (83.30% on v1.0 real-image test-standard) is from v1.0, measured by
        holding one annotator out against nine, and the best v2.0 test-standard rows are above it
        (87.85, a personal entry, and 87.07, Molmo2-8B), so it is not a ceiling for v2.0. Whether to
        record it as a v1.0 Baseline, treat the anchor as none-known for v2.0, or look for a v2.0
        human figure not in the sources read.
      field: data.ceiling_anchor_type
      source: src-arxiv-1505-00468-v7
      quote: real images (83.30%) and abstract scenes (87.49%)
    - check: Split reporting is uneven in the literature. The maintainers ask for test-standard, but
        EvalAI reveals test-dev on every submission and the validation answers are public, and
        recent abstracts such as JUICE's report "VQAv2" with no split. A score's split should be
        checked before it is compared.
      field: as_used
      source: src-visualqa-challenge
      quote: Report test-standard accuracies, which can be calculated using either of the
        non-test-dev phases
    - check: maintainer_type academic-lab. The team is described only as the VQA team or Consortium,
        the papers' authors span Virginia Tech, Georgia Tech and others, and the repository is in
        the GT-Vision-Lab organisation (formerly VT-vision-lab). That the organisation is Georgia
        Tech's lab is read from its name, not stated; community-collective or conference-workshop
        are the alternatives.
      field: governance.maintainer_type
      source: src-evalai-vqa-challenge-830
      quote: '"team_name":"VQA Team"'
    - check: funded-by-evaluated-party rests on Google Faculty Research Awards in the v1.0 paper's
        acknowledgements and Google's PaLI-X and PaliGemma rows on the leaderboard. Whether a
        faculty research award counts as funding the benchmark, and whether the v2.0 paper's Amazon
        and NVIDIA support adds to it, is for review. single-evaluator-private-test-set follows
        DocVQA's entry (COCO's records none).
      field: governance.independence_flags
      source: src-arxiv-1505-00468-v7
      quote: Google Faculty Research Awards
    - check: The two forks have author lists that overlap the VQA papers', so Variant (same
        maintainer) is arguable; each has its own paper, splits and name, and VQA-CP's own versions
        (v1, v2) follow VQA's. Their ids are proposals only; no stub or allocation was made.
      field: lineage
      source: src-arxiv-1712-00377
      quote: train and test sets have different prior distributions of answers
    - check: data_provenance tags crowd-authored and inherited-from-constituents (the COCO images).
        The abstract scenes were made for the dataset from clipart, which neither term nor
        synthetic-procedural describes; and the real images are reused whole rather than as a
        benchmark's items.
      field: data.data_provenance
      source: src-arxiv-1505-00468-v7
      quote: for 204,721 images from the MS COCO dataset [32] and 150,000 questions with 1,950,000
        answers for 50, 000 abstract scenes
    - check: The leaderboard was read only to its first page (500 of 559 rows, ordered by score).
        Four visualqa.org pages (home, both download pages, the challenge page), the README and the
        leaderboard print people's names, so those six Sources are withheld from archiving and their
        extracts keep the names out; whether to withhold them is the lead's call. Four non-DOI
        Sources are pending archive (the evaluation and terms pages and the two EvalAI challenge
        records).
      field: curation.sources
      source: src-evalai-vqa-leaderboard-2278
      quote: '{"count":559'
  personal_data_excluded:
    - source: src-visualqa-home
      what: the award recipients' and some thirty contributors' names, the papers' BibTeX author
        lists and the team's e-mail address
    - source: src-visualqa-download
      what: the BibTeX author lists beside each dataset
    - source: src-visualqa-v1-download
      what: the BibTeX author list in the abstract-scenes section
    - source: src-visualqa-challenge
      what: the five organisers' names and affiliations and the team's e-mail address
    - source: src-evalai-vqa-leaderboard-2278
      what: team names that are personal names or handles
    - source: src-evalai-vqa-challenge-830
      what: the description's author citations and the personal account that holds the evaluation
        repository
    - source: src-github-vqa-readme
      what: the developer named in the Developers section
    - source: src-arxiv-1505-00468-v7
      what: the author list under the title
    - source: src-arxiv-1612-00837-v3
      what: the authors' e-mail addresses under the title and the names in the acknowledgements

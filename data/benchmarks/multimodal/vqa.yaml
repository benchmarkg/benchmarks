    breaking: true
    supersedes_version: '1.0'
    errata:
      - date: 2017-04-26
        scope: v2.0 train and validation files
        description: The training and validation files were updated with minor changes to be
          consistent with the test set; files downloaded before that date are to be downloaded
          again.
        source: src-visualqa-download
      - date: 2021-03-11
        scope: evaluation script
        description: A bug that processed ground-truth and predicted answers inconsistently in some
          cases was fixed for the 2021 EvalAI server, which may give results about 0.1 points from
          the old server's. The date is the repository's newest commit, 'Fixed processing answers
          bug' (src-github-vqa-readme notes).
        source: src-visualqa-challenge
    frozen: true
    sources:
      - src-arxiv-1612-00837-v3
      - src-arxiv-1612-00837
      - src-visualqa-home
      - src-visualqa-download
      - src-evalai-vqa-challenge-830
      - src-github-vqa-readme
versions_note: Two full releases. The betas (v0.1, v0.9, v1.9) were partial pre-releases of v1.0 and
  v2.0 on the train and validation images, superseded within months, and are not listed as versions
  (see review_checks). Neither full release has a day of release in the sources read, only a month.

subsets:
  - id: vqa#open-ended
    label: Open-ended task
    scored_separately: true
    evidence:
      - source: src-arxiv-1505-00468-v7
        quote: (i) open-ended and (ii) multiple-choice
      - source: src-github-vqa-readme
        quote: There is only one type of task - Open-ended task
    notes: The headline task in both versions and the only one in v2.0; a free-form answer scored by
      VQA accuracy.
  - id: vqa#multiple-choice
    label: Multiple-choice task (v1.0 only)
    scored_separately: true
    evidence:
      - source: src-arxiv-1505-00468-v7
        quote: For multiple-choice task, 18 candidate answers are created for each question.
      - source: src-github-vqa-readme
        quote: There are two types of tasks - Open-ended task - Multiple-choice task (18 choices per
          question)
      - source: src-arxiv-1505-00468-v7
        quote: on VQA teststandard is 58.16% (open-ended) / 63.09% (multiple-choice)
    notes: 18 candidates per question (the correct, plausible, popular and random answers), the
      chosen one scored by VQA accuracy; v1.0 had separate multiple-choice leaderboards for real
      images and abstract scenes. Not offered in v2.0.
  - id: vqa#abstract-scenes
    label: Abstract scenes (clipart; v1.0, reshipped with v2.0)
    items: 60000
    scored_separately: true
    evidence:
      - source: src-arxiv-1505-00468-v7
        quote: To attract researchers interested in exploring the high-level reasoning required for
          VQA, but not the low-level vision tasks, we create a new abstract scenes dataset
      - source: src-arxiv-1505-00468-v7
        quote: For abstract scenes, we created splits for standardization, separating the scenes
          into 20K/10K/20K for train/val/test splits, respectively.
      - source: src-arxiv-1505-00468-v7
        quote: There are no subsplits (test-dev, test-standard, test-challenge, test-reserve) for
          abstract scenes.
      - source: src-visualqa-v1-download
        quote: Training questions 2015 v1.0 60,000 questions Validation questions 2015 v1.0 30,000
          questions Testing questions 2015 v1.0 60,000 questions
    notes: 50,000 clipart scenes built for the dataset so that the high-level reasoning can be
      studied without recognising real images; 150,000 questions, 60,000 of them on the 20,000 test
      scenes, which have no test-dev or test-standard sub-splits. v1.0 scored them on their own
      open-ended and multiple-choice leaderboards; the v2.0 download page ships the same set.
  - id: vqa#balanced-binary-abstract-scenes
    label: Balanced Binary Abstract Scenes (v2.0 release, train and validation only)
    scored_separately: false
    evidence:
      - source: src-visualqa-download
        quote: "The following links contain the abstract scenes' composition files for Balanced Binary
          Abstract Scenes dataset: train2017 Composition Files val2017 Composition Files"
      - source: src-visualqa-download
        quote: Training questions 22,055 questions Validation questions 11,328 questions
    notes: Yes/no questions on abstract scenes balanced with complementary scenes, from a separate
      CVPR 2016 paper by the same group (arXiv 1511.05099, not read). It has train and validation
      splits only, and no test split or server phase appears in the sources read, so it is not
      scored separately.
  - id: vqa#test-dev
    label: test-dev (real images)
    scored_separately: true
    evidence:
      - source: src-arxiv-1505-00468-v7
        quote: test-dev is used for debugging and validation experiments and allows for unlimited
          submission to the evaluation server.
      - source: src-visualqa-challenge
        quote: Test-dev is used for debugging and validation experiments and allows for maximum 10
          submissions per day (according to UTC timezone).
      - source: src-evalai-vqa-challenge-830-phases
        quote: '"max_submissions_per_day":10'
    notes: A split of the real-image test set for development. Every submission covers the whole
      test set and reports test-dev accuracy; its EvalAI phase has no public leaderboard. Unlimited
      submissions in v1.0, ten a day on the 2021 server.
  - id: vqa#test-standard
    label: test-standard (real images)
    scored_separately: true
    evidence:
      - source: src-arxiv-1505-00468-v7
        quote: When comparing to the state of the art (e.g., in papers), results should be reported
          on test-standard.
      - source: src-evalai-vqa-challenge-830-phases
        quote: We recommend using this Test-Standard phase for reporting results in publications and
          comparing with other methods
      - source: src-arxiv-1612-00837-v3
        quote: Papers reporting results on VQA v2.0 dataset are suggested to report teststandard
          accuracies
    notes: The default split for reported results and the public leaderboard (EvalAI phase 1794,
      split 2278), reported by answer type (yes/no, number, other) and overall.
  - id: vqa#test-challenge
    label: test-challenge (real images)
    scored_separately: true
    evidence:
      - source: src-evalai-vqa-challenge-830-phases
        quote: Submissions to Test-Challenge phase will automatically be considered as entries to
          the VQA Challenge 2021.
      - source: src-evalai-vqa-challenge-830-phases
        quote: '"end_date":"2021-05-07T23:59:59Z","challenge":830'
    notes: Used to rank each year's challenge winners; the 2021 phase closed on 2021-05-07 and has
      no public leaderboard.
  - id: vqa#test-reserve
    label: test-reserve (real images)
    scored_separately: false
    evidence:
      - source: src-arxiv-1505-00468-v7
        quote: Results on test-reserve are not publicly revealed.
    notes: Held back to detect overfitting to test-standard; never reported.
subsets_note: The four test splits follow COCO's scheme and apply to the real images in both
  versions (the v2.0 paper keeps them). The sources read give no per-split question counts.

metrics:
  - vqa-accuracy

lineage:
  role: root
  forks:
    - id: vqa-cp
      maintainer: The VQA-CP authors (arXiv 1712.00377), whose author list overlaps the VQA papers'
      source: src-arxiv-1712-00377
      quote: we present new splits of the VQA v1 and VQA v2 datasets, which we call Visual Question
        Answering under Changing Priors (VQA-CP v1 and VQA-CP v2 respectively)
    - id: vqa-rephrasings
      maintainer: The VQA-Rephrasings authors (arXiv 1902.05660), whose author list overlaps the VQA
        v2.0 paper's
      source: src-arxiv-1902-05660
      quote: VQA-Rephrasings contains 3 human-provided rephrasings for 40k questions spanning 40k
        images from the VQA v2.0 validation dataset.
lineage_note: Both fork ids are names for separate entries that do not exist yet, not allocations
  (04 S3). VizWiz and other datasets that reuse VQA's format and metric on their own images are not
  derivatives of its items and are not recorded.

tags:
  - visual-question-answering
  - open-ended-qa
  - coco
  - abstract-scenes
  - language-priors
  - leaderboard

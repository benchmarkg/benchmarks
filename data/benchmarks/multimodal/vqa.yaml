# data/benchmarks/multimodal/vqa.yaml
#
# P1-S8-T09, multimodal entry 11. Filled from the VQA paper, arXiv 1505.00468 read as its v7 PDF (2016-10-27, the
# ICCV 2015 paper), and its abstract page; the VQA v2.0 paper, "Making the V in VQA Matter" (arXiv 1612.00837),
# read as its v3 PDF (2017-05-15) and its abstract page; six pages of visualqa.org (home, the v2 and v1 download
# pages, evaluation, the 2021 challenge page, terms); the evaluation repository's README pinned at its newest commit;
# EvalAI's public API records of challenge 830 (VQA Challenge 2021), its phases and the first page of its
# test-standard leaderboard; the abstract page of JUICE (arXiv 2610.28801, October 2026), a 2026 result; the cited
# 2025 benchmark-reliability paper (arXiv 2502.03461, already a Source); and the abstract pages of VQA-CP (arXiv
# 1712.00377) and VQA-Rephrasings (arXiv 1902.05660), recorded under lineage. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts. Nothing on EvalAI was logged into.
#
# Vision boundary (02 S11 rule 12): the scored quantity is whether a natural-language answer to a question about an
# image agrees with the answers of ten people who saw that image, a relation between the image, the question and
# the answer. No property of the image alone is scored, so the entry is multimodal/visual-qa (domain_basis).
#
# Identity: the id `vqa` is a proposal, not an allocation (04 S3: "Id allocation is a human act"). VQA v2.0 is
# modelled as a version of VQA, not as its own benchmark (see versions and the first review check). The derived
# benchmarks VQA-CP and VQA-Rephrasings are separate entries, named under lineage only; no id is allocated for them.

id: vqa
name: VQA
aliases:
  - 'VQA: Visual Question Answering'
  - Visual Question Answering dataset
  - VQA v1.0
  - VQA v2.0
  - VQAv2
tagline: Open-ended questions about COCO images, each answered by ten people and scored by agreement
  with them.
description: >
  Free-form, open-ended questions about images, written by Amazon Mechanical Turk workers, three per image,
  and answered by ten workers each. v1.0 (October 2015) has 614,163 questions on 204,721 COCO images and
  150,000 on 50,000 clipart abstract scenes made for the dataset, with two tasks: open-ended, and multiple-choice
  among 18 candidates. v2.0 (April 2017) balances the real-image set: for almost every question a second,
  similar COCO image was collected on which the answer differs, which gives 1,105,904 questions and weakens
  the answers a model can guess from the question alone. v2.0 has the open-ended task only. Answers are
  mostly one word, and an answer scores min(n/3, 1), where n is how many of the ten annotators gave it,
  averaged over the ten sets of nine. The real-image test set is split, following COCO, into test-dev
  for development, test-standard for reported results and a public leaderboard, test-challenge for the
  annual challenge's winners and a never-revealed test-reserve; test answers are withheld and scored on
  EvalAI. Six challenges ran at CVPR from 2016 to 2021, and the test-standard leaderboard still takes
  submissions: 559 rows, the newest dated 2026-11-03.
self_description:
  source: src-visualqa-home
  quote: VQA is a new dataset containing open-ended questions about images.
external_ids:
  arxiv: '1505.00468'
paper:
  title: 'VQA: Visual Question Answering'
  arxiv: '1505.00468'
  doi: 10.48550/arXiv.1505.00468
  version_read: v7
  source: src-arxiv-1505-00468-v7
released: 2015-05-03
released_note: The paper's first arXiv version, as its abstract page dates it. The data came out in
  stages (src-visualqa-home) -- Beta v0.1 in June 2015, Beta v0.9 in July 2015, the full v1.0 in
  October 2015, Beta v1.9 in March 2017 and the full v2.0 in April 2017 -- and the v2.0 paper's
  first version is dated 2016-12-02 (src-arxiv-1612-00837).
released_source: src-arxiv-1505-00468
released_quote: Submitted on 3 May 2015 (v1)
release_venue: ICCV 2015
release_venue_source: src-arxiv-1505-00468
release_venue_quote: International Conference on Computer Vision (ICCV) 2015

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/visual-qa
domain_basis:
  reason: Each item is a natural-language question about an image, and the score is whether the
    answer in language agrees with the answers of people who saw the image, so the
    question-image-answer relation is what is scored, which is multimodal's inclusion test
    ("answering in language about an image"). vision's exclusion test sends a question answered
    about an image to multimodal, and multimodal's own exclusion test names VQA as its example of a
    scored correspondence. The questions were collected to need the image, and v2.0 pairs each
    question with two images whose answers differ, so the question alone does not decide the answer.
    visual-qa is the leaf whose definition this is.
  source: src-arxiv-1505-00468-v7
  quote: Importantly, questions should also require the image to correctly answer and not be
    answerable using just commonsense information
domain_considered_and_rejected:
  - term: vision/classification
    reason: Many answers are object, colour or count labels, but they come from a free-form
      vocabulary in reply to a question, and no fixed label set is scored on the image alone.
  - term: reasoning-general/commonsense
    reason: The paper studies which questions need commonsense, and the site says answering needs
      it, but the questions were collected to need the image and the score is agreement about the
      image; commonsense is a step towards the answer, not the scored relation.
    source: src-visualqa-home
    quote: These questions require an understanding of vision, language and commonsense knowledge to
      answer.
  - term: vision/document-understanding
    reason: The images are everyday photographs and clipart scenes, not documents, and no extracted
      structure is scored.
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: The questions are written by crowdworkers about everyday scenes, not drawn from exams
      across subjects.
capability:
  - perception
capability_basis:
  perception:
    reason: The answer has to be recovered from the image (objects, attributes, counts, activities,
      scene context), and v2.0 was built so that the same question has different answers on two
      similar images; the v2.0 paper finds that models trained on v1.0 lean on language priors and
      lose accuracy on the balanced set.
    source: src-arxiv-1612-00837
    quote: All models perform significantly worse on our balanced dataset, suggesting that these
      models have indeed learned to exploit language priors.
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: Some questions need commonsense or world knowledge (the paper's "Is this a vegetarian
      pizza?"), but the knowledge is a step towards an answer about the image, which the term's
      exclusion test leaves out.
  - term: grounding
    reason: Questions refer to things in the image, but only the answer string is scored; no source
      scores whether the question was attached to the right region.
  - term: quantitative-reasoning
    reason: Number questions are mostly counts of objects in the image, read from it rather than
      calculated.
  - term: distribution-shift-generalization
    reason: v2.0's balancing targets answer priors, but its train and test sets share one
      distribution; changing priors between train and test is VQA-CP's design (lineage), not this
      benchmark's.

evaluation_method:
  - reference-metric
evaluation_method_basis:
  reason: Each answer is normalised and matched exactly against the ten human answers to the
    question, and the score is the fixed formula min(n/3, 1) over the number n of matching
    annotators, averaged over the ten sets of nine annotators. That is partial credit by a fixed
    formula against several references, which exact-match's exclusion test (no partial credit)
    leaves out; the vocabulary has no term for consensus scoring against multiple human answers
    (logged with bench tag-gap).
  source: src-arxiv-1505-00468-v7
  quote: an answer is deemed 100% accurate if at least 3 workers provided that exact answer.
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: The match itself is exact after normalisation, but an answer only one or two annotators
      gave earns one or two thirds of a point, and exact-match excludes partial credit.
    source: src-visualqa-evaluation
    quote: We introduce a new evaluation metric which is robust to inter-human variability in
      phrasing the answers
  - term: multiple-choice
    reason: v1.0 also had a multiple-choice task with 18 candidates per question, scored by the same
      accuracy on the chosen candidate, so several candidates can earn credit and there is no single
      keyed option or stated chance baseline. v2.0 dropped the task. It is recorded as the subset
      vqa#multiple-choice (see review_checks).
    source: src-arxiv-1505-00468-v7
    quote: For multiple-choice task, 18 candidate answers are created for each question.
  - term: human-crowd-eval
    reason: The references are crowdworkers' answers collected once, with the dataset; no person
      rates a system's output.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The dataset ships train and validation answers for training, and both release papers train
    their VQA models (LSTM and CNN models, attention models, MCB) on train+val and score them as
    trained; VQA as a task is a general perception and language task, not a discipline.
  source: src-arxiv-1505-00468-v7
  quote: We train on VQA train+val.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: General vision-language models now report VQAv2 among many evaluations
      (observed_subjects), but the benchmark was designed for models trained on its own split.
observed_subjects:
  values:
    - task-specific-supervised-model
    - instruction-tuned-model
  basis: >
    The test-standard leaderboard's organisation rows near the top are pretrained vision-language models,
    several entered as fine-tuned on the task (PaliGemma 2's '10B, 448px, finetune', PaliGemma-3B's 'finetune,
    448px') and others not labelled (Allen Institute for AI's Molmo2-8B, December 2025; PaLI-X, Google
    Research, 2023). An October 2026 unified multimodal model, JUICE, reports VQAv2 in its abstract (src-arxiv-2610-28801).
    Whether each unlabelled entry was trained on VQA's training split is not stated.
  source: src-evalai-vqa-leaderboard-2278
as_used:
  - protocol: A unified multimodal model's own report of a VQAv2 score beside a text-to-image score,
      in its abstract; the split and the version of the scorer are not stated there.
    split: not stated
    source: src-arxiv-2610-28801
    quote: JUICE reaches up to 0.88 on GenEval and 73.1 on VQAv2
    note: The maintainers ask for test-standard results compared with the leaderboards; many papers
      report test-dev or the public validation split instead (see review_checks).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced. The test-standard leaderboard's first page holds 58 entries
    dated 2026, the newest on 2026-11-03, and an October 2026 paper reports VQAv2. saturated is
    derived from headroom and never hand-set; the human figure is below the top leaderboard rows
    (review_checks).
  source: src-evalai-vqa-leaderboard-2278
  quote: '"submission__submitted_at":"2026-11-03T12:00:11.021196Z"'
activity: leaderboard-live-no-round
activity_note: The challenge page (src-visualqa-challenge) says VQA Challenge 2021 is the sixth
  edition, after CVPR 2016 to 2020; no later edition appears on the pages read. The 2021
  Test-Challenge phase closed on 2021-05-07, while Test-Dev and Test-Standard stay open until
  2099-12-31 (src-evalai-vqa-challenge-830-phases).
activity_basis:
  reason: VQA ran annual challenge rounds from 2016 to 2021, and the 2021 server's Test-Standard
    phase, with its public leaderboard, remains open to outside submissions while no round is
    running.
  source: src-evalai-vqa-challenge-830-phases
  quote: '"leaderboard_public":true,"start_date":"2021-02-25T23:59:59Z","end_date":"2099-12-31T23:59:59Z","challenge":830,"max_submissions_per_day":1,"max_submissions_per_month":5,"max_submissions":5'
  newest_submission: 2026-11-03

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Molmo2-8B (Allen Institute for AI)
    source: src-evalai-vqa-leaderboard-2278
    observed_on: 2026-11-10
    quote: '"submission__submitted_at":"2025-12-16T16:11:46.674346Z","submission__method_name":"Molmo2-8B"'
  - system: JUICE
    source: src-arxiv-2610-28801
    observed_on: 2026-11-10
    quote: JUICE reaches up to 0.88 on GenEval and 73.1 on VQAv2
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Ten answers per question from Amazon Mechanical Turk workers who saw the
  image (v2.0 collected ten for every complementary image too). The train and validation answers are
  public; the test answers are held by the maintainers and scored on EvalAI.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone with an EvalAI account can download the test questions and images, run a system and
    submit to the standing Test-Standard phase, which scores it with the published evaluation code;
    validation scores can be computed locally from the public answers.
  source: src-visualqa-challenge
  quote: To enter the competition, first you need to create an account on EvalAI.

task:
  exists: true
  input:
    - an image -- a COCO photograph, or in v1.0's abstract-scenes set a clipart scene
    - a free-form natural-language question about it; in v1.0's multiple-choice task, also 18
      candidate answers
  output: A short open-ended answer, most often a single word (89.32% of the answers), or in the
    multiple-choice task the chosen candidate.
  scoring: VQA accuracy (data/metrics/vqa-accuracy) -- per question min(n/3, 1) over the number n of
    the human annotators who gave the normalised answer, averaged over the ten sets of nine
    annotators, then over questions, reported overall and for yes/no, number and other answers; on
    v2.0 test-standard by the EvalAI server, which reports test-dev alongside.
  metric: vqa-accuracy
  source: src-arxiv-1505-00468-v7
  quote: For the open-ended task, the generated answers are evaluated using the following accuracy
    metric

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The questions and images of every split, and the answers of train and validation, are
    downloaded from visualqa.org (the real images from COCO) under the Terms of Use ('By downloading
    this dataset, you agree to our Terms of Use', src-visualqa-download), with no registration; test
    answers are withheld. EvalAI needs an account only to submit.
  access_basis:
    reason: The test questions and images are distributed and their answers withheld, so test scores
      come only from the maintainers' EvalAI server.
    source: src-visualqa-challenge
    quote: Annotations on the training and validation sets are publicly available.
  refresh: versioned-releases
  refresh_basis:
    reason: The content changed only in labelled releases (Beta v0.1, Beta v0.9, v1.0, Beta v1.9,
      v2.0), with a dated update of the v2.0 train and validation files on 2017-04-26; nothing has
      been added since. The 2021 evaluation-script fix is a scoring erratum recorded on version 2.0.
    source: src-visualqa-home
    quote: 'April 2017: Full release (v2.0) Balanced Real Images 204,721 COCO images (all of current train/val/test)
      1,105,904 questions 11,059,040 ground truth answers'
  data_provenance:
    - crowd-authored
    - inherited-from-constituents
  data_provenance_note: Questions and answers were written by Amazon Mechanical Turk workers --
    three questions per image, ten answers per question -- and v2.0's complementary images were
    picked by workers from each image's nearest COCO neighbours. The real images are MS COCO's, all
    of its train, validation and test images, so COCO's provenance applies to them. The abstract
    scenes were created for the dataset from clipart (src-arxiv-1505-00468-v7), which no other term
    covers (see review_checks).
  data_provenance_source: src-arxiv-1505-00468-v7
  data_provenance_quote: Examples of free-form, open-ended questions collected for images via Amazon
    Mechanical Turk.
  contamination_risk: medium
  contamination_risk_note: The train and validation answers have been public since 2015 (v1.0) and
    2017 (v2.0) and are meant for training, the COCO images are public, and the test questions and
    images are distributed, with only the test answers withheld. A route into general
    vision-language models' training data is plausible, but no source read evidences one for the
    test split.
  contamination_evidence: []
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: The v1.0 paper scores human subjects who saw the image with the same
    metric on test-standard -- 83.30% on real images and 87.49% on abstract scenes -- by holding
    each annotator out against the other nine. No human figure for v2.0 was found in the sources
    read, and the best test-standard rows on v2.0 (87.85 and 87.07 overall) are above the v1.0 human
    figure (see review_checks).
  ceiling_anchor_type_source: src-arxiv-1505-00468-v7
  ceiling_anchor_type_quote: 'TABLE 1: Test-standard accuracy of human subjects when asked to answer the
    question without seeing the image'
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The terms page's licence for the annotations, held by the VQA Consortium.
    The COCO images are not covered by it (upstream_licences).
  dataset_licence_source: src-visualqa-terms
  dataset_licence_quote: The annotations in this dataset belong to the VQA Consortium and are
    licensed under a Commons Attribution 4.0 International License.
  upstream_licences: null
  upstream_licences_note: The real images are MS COCO's, downloaded from COCO under COCO's own
    terms, which were not read for this entry (the vision/coco entry cites them). The terms page
    states no licence for the abstract-scene images.
  size:
    - count: 1105904
      unit: questions on 204,721 COCO images, with 11,059,040 answers (v2.0, train, validation and
        test)
      subset: v2.0 real images
      source: src-visualqa-home
      quote: 'April 2017: Full release (v2.0) Balanced Real Images 204,721 COCO images (all of current
        train/val/test) 1,105,904 questions 11,059,040 ground truth answers'
    - count: 447793
      unit: test questions (443,757 train, 214,354 validation)
      subset: v2.0 real images, test
      source: src-visualqa-download
      quote: Training questions 2017 v2.0* 443,757 questions Validation questions 2017 v2.0* 214,354
        questions Testing questions 2017 v2.0 447,793 questions
    - count: 614163
      unit: questions on 204,721 COCO images
      subset: v1.0 real images
      source: src-visualqa-home
      quote: 'October 2015: Full release (v1.0) Real Images 204,721 COCO images (all of current train/val/test)
        614,163 questions'
    - count: 244302
      unit: test questions (248,349 train, 121,512 validation)
      subset: v1.0 real images, test
      source: src-visualqa-v1-download
      quote: Training questions 2015 v1.0 248,349 questions Validation questions 2015 v1.0 121,512
        questions Testing questions 2015 v1.0 244,302 questions
    - count: 150000
      unit: questions on 50,000 abstract scenes (60,000 test)
      subset: v1.0 abstract scenes
      source: src-visualqa-home
      quote: Abstract Scenes 50,000 abstract scenes 150,000 questions 1,500,000 ground truth answers
    - count: 33383
      unit: yes/no questions on abstract scenes, train and validation only (22,055 and 11,328)
      subset: v2.0 Balanced Binary Abstract Scenes
      source: src-visualqa-download
      quote: Training questions 22,055 questions Validation questions 11,328 questions
  size_note: The headline is v2.0's real-image set, the one the leaderboard scores. The v2.0 counts
    are the release's; the v2.0 paper gives them as more than 443K train, 214K validation and 453K
    test (question, image) pairs. The Balanced Binary Abstract Scenes total is the home page's Beta
    v1.9 figure (33,383 questions); the two split counts are the download page's.
  submission_limit:
    max_submissions: 5
    period_days: 0
    per: team, on the Test-Standard and Test-Challenge phases, at most one a day; Test-Dev allows
      ten a day
    source: src-evalai-vqa-challenge-830-phases

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The VQA team (the VQA Consortium), with the GT-Vision-Lab GitHub organisation
  maintainer_basis:
    reason: The site, the data downloads and the challenge are the VQA team's; the annotations'
      copyright is the VQA Consortium's; EvalAI records the challenge's host team as the VQA Team;
      and the evaluation code is in the GT-Vision-Lab organisation account on GitHub (formerly
      VT-vision-lab). Both papers are by authors at Virginia Tech and Georgia Tech, with others.
    source: src-visualqa-terms
    quote: Copyright © 2015, VQA Consortium. All rights reserved.
  maintainer_type: academic-lab
  maintainer_type_note: consortium was rejected because no source states a legal form for the VQA
    Consortium, and the term's exclusion test refuses the word alone. community-collective and
    conference-workshop were considered (several institutions; annual CVPR challenges), but the same
    team ran every edition and the repository sits in a university lab's organisation account (see
    review_checks).
  submission_process:
    - held-out-server
  submission_process_note: Participants upload a JSON file of answers for the whole test set to
    EvalAI, which scores it against the withheld answers; Test-Dev reveals test-dev accuracy only,
    and Test-Standard reveals test-standard and test-dev accuracy and can be posted to the public
    leaderboard. Entrants are asked to state any external training data in the method description
    (src-visualqa-challenge).
  submission_process_source: src-evalai-vqa-challenge-830-phases
  submission_process_quote: This phase evaluates algorithms on all the splits of the VQA v2.0 test
    set but only the accuracies for the test-dev split are revealed to the participant.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-visualqa-challenge
      quote: Annotations on the training and validation sets are publicly available.
    - flag: funded-by-evaluated-party
      source: src-arxiv-1505-00468-v7
      quote: Google Faculty Research Awards
  independence_flags_note: The maintainers hold the test answers and their EvalAI server scores
    every test submission. The v1.0 paper's work was supported in part by Google Faculty Research
    Awards (the v2.0 paper's acknowledgements also list Google, Amazon and NVIDIA support), and
    Google's PaLI-X and PaliGemma models are on the test-standard leaderboard
    (src-evalai-vqa-leaderboard-2278).
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2502-03461-v1
    quote: the percentage of mislabeled or poorly written questions that we find in GSM8K, SVAMP,
      VQA v2.0 and TabFact is greater than the percentage of errors reported by frontier models on
      these benchmarks

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline is test-standard accuracy, which only the maintainers' EvalAI server can
      compute, because they hold the test answers. Validation accuracy can be computed by anyone
      with the published code.
    source: src-evalai-vqa-challenge-830-phases
    quote: This phase evaluates algorithms on all the splits of the VQA v2.0 test set but only the
      accuracies for the test-dev split are revealed to the participant.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: The VQA API and evaluation code (PythonEvaluationTools) in GT-Vision-Lab/VQA, which the
    evaluation page and EvalAI's record name as the challenge's scoring procedure
  harness_source: src-github-vqa-readme
  harness_quote: Python API and Evaluation Code for v2.0 and v1.0 releases of the VQA dataset.
  harness_gotcha:
    source: src-visualqa-challenge
    quote: the new evaluation server might give slightly different accuracy results (difference of
      ~0.1%) as compared to the old evaluation server.
  submission_channel:
    source: src-visualqa-challenge
    quote: The challenge is hosted on EvalAI.
  submission_channel_note: EvalAI challenge 830 (VQA Challenge 2021), Test-Standard phase 1794 and
    its leaderboard split 2278; earlier challenges' test-standard leaderboards, which the
    maintainers ask results to be compared with, are linked from the challenge page.
  code_licence: BSD-3-Clause
  code_licence_note: The terms page's software licence is the three-clause BSD text with the VQA
    Consortium as copyright holder; GitHub's licence metadata for GT-Vision-Lab/VQA reads Other
    (NOASSERTION), read 2026-11-10.
  code_licence_source: src-visualqa-terms
  code_licence_quote: Copyright © 2015, VQA Consortium. All rights reserved.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the version (v1.0 or v2.0) and the split (test-standard through EvalAI, test-dev,
  # or the public validation split, which some reports do not label), the task on v1.0 (open-ended or
  # multiple-choice), whether the system was trained on VQA's train+val, and the scorer version (the 2021 fix).
  material_extra:
    - subset_used
    - training_data_policy
    - harness
headline_metric: vqa-accuracy

homepage: https://visualqa.org/
repository: https://github.com/GT-Vision-Lab/VQA
dataset_url: https://visualqa.org/download.html
leaderboard_url: https://eval.ai/web/challenges/challenge-page/830/leaderboard/2278

versions:
  - version: '1.0'
    label: VQA v1.0
    version_kind: revision
    released: null
    items: 614163
    changes: The full first release, October 2015, after Beta v0.1 (June 2015, 10,000 COCO train
      images) and Beta v0.9 (July 2015, the train and validation images) -- 614,163 questions on all
      204,721 COCO train, validation and test images and 150,000 on 50,000 abstract scenes, each
      with ten answers, in open-ended and multiple-choice (18 candidates) tasks. items counts the
      real-image questions.
    superseded_by: '2.0'
    frozen: true
    sources:
      - src-arxiv-1505-00468-v7
      - src-visualqa-home
      - src-visualqa-v1-download
      - src-github-vqa-readme
  - version: '2.0'
    label: VQA v2.0 (balanced real images)
    version_kind: edition
    released: null
    items: 1105904
    changes: The second iteration, April 2017, after Beta v1.9 (March 2017, train and validation
      only), by the same team -- complementary COCO images collected for v1.0's real-image questions
      in every split, so that almost every question has two similar images with different answers,
      plus about 18K new test pairs; about twice v1.0's size, with the same question types, metric,

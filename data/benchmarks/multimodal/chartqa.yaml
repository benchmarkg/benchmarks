# data/benchmarks/multimodal/chartqa.yaml
#
# P1-S8-T08, multimodal entry 4 of 6. Filled from ChartQA's paper, arXiv 2203.10244 read as its v1 PDF
# (2022-03-19), its abstract page and its ACL Anthology page (Findings of ACL 2022); the repository README and the
# T5 model's README at main, with GitHub's metadata for the repository; Hugging Face's API record of the full
# dataset; the abstract page of ChartQAPro (arXiv 2504.05506, April 2025), the maintainers' successor; and the v1
# PDF of the Leum-VL Technical Report (arXiv 2603.20354, March 2026), a result on the test set. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.
#
# ChartQA only. ChartQAPro (2025) is a separate benchmark by overlapping authors, recorded under lineage.

id: chartqa
name: ChartQA
tagline: Question answering over real-world charts, human-written and T5-generated questions, scored
  by relaxed accuracy.
description: >
  Questions about real-world bar, line and pie charts crawled from Statista, Pew Research, Our World in
  Data and the OECD. ChartQA-H holds 9,608 questions written by Amazon Mechanical Turk workers, who were
  asked for compositional questions (at least two arithmetic or logical operations, such as a sum or a
  difference) and visual ones that refer to marks by colour, length or position. ChartQA-M, the
  augmented set, holds 23,111 questions generated by T5 models from Statista's human-written chart
  summaries, its test set cleaned by hand. Answers are open-vocabulary, mostly numbers. Scoring is relaxed
  accuracy: a numeric answer counts when it is within 5% of the gold answer, and any other answer must
  match exactly. Each set has a 1,250-question test split, reported separately and together. The release
  paper fine-tuned table-QA and vision-language models (T5, VL-T5, TaPas and its VisionTaPas extension)
  on the training split, with and without the chart's gold data table. General vision-language models
  now report the test set among many evaluations, and the maintainers' 2025 successor, ChartQAPro,
  describes ChartQA as showing performance saturation.
self_description:
  source: src-arxiv-2203-10244
  quote: we present a large-scale benchmark covering 9.6K human-written questions as well as 23.1K
    questions generated from human-written chart summaries
external_ids:
  huggingface: ahmed-masry/ChartQA
  arxiv: '2203.10244'
paper:
  title: 'ChartQA: A Benchmark for Question Answering about Charts with Visual and Logical Reasoning'
  arxiv: '2203.10244'
  doi: 10.18653/v1/2022.findings-acl.177
  version_read: v1
  source: src-arxiv-2203-10244-v1
released: 2022-03-19
released_note: The paper's only arXiv version, as the abstract page dates it; the ACL Anthology
  dates the Findings of ACL 2022 volume May 2022.
released_source: src-arxiv-2203-10244
released_quote: Submitted on 19 Mar 2022
release_venue: Findings of ACL 2022
release_venue_source: src-acl-2022-findings-acl-177
release_venue_quote: 'Volume: Findings of the Association for Computational Linguistics: ACL 2022 Month:
  May Year: 2022'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/chart-diagram-understanding
domain_basis:
  reason: Every item is a natural-language question about a chart image, and the score is whether
    the answer in language matches the gold answer, so the question-chart-answer correspondence is
    what is scored, which is multimodal's inclusion test ("answering in language about an image");
    vision's exclusion test sends a question answered about an image to multimodal.
    chart-diagram-understanding is the leaf for questions that need reading charts. Reading the
    chart's printed labels and values is a step towards the answer, not a scored quantity, and many
    questions turn on the marks themselves rather than on any text.
  source: src-arxiv-2203-10244
  quote: They also commonly refer to visual features of a chart in their questions.
domain_considered_and_rejected:
  - term: vision/ocr-handwriting
    reason: Answering needs the labels, legends and values printed on the chart, and the paper's own
      pipeline runs text recognition inside ChartOCR to rebuild the data table, but ocr-handwriting
      scores a transcription and ChartQA scores no transcription. The paper measures its data
      extraction only as an appendix diagnostic of its pipeline, not as the benchmark's score.
    source: src-arxiv-2203-10244-v1
    quote: 'Table 9: Accuracies of our data extraction algorithm on the test sets of DVQA, PlotQA, and
      ChartQA.'
  - term: vision/document-understanding
    reason: Charts are structured visual content like the forms and tables that term holds, and the
      repository ships each chart's data table and bounding-box annotations, but no extracted
      structure is scored. The term's own note sends a document-image benchmark posed as questions
      to the multimodal family.
  - term: multimodal/visual-qa
    reason: Every item is visual question answering, but chart-diagram-understanding is the narrower
      leaf of the same family and its definition names charts; a visual-qa secondary would count
      ChartQA twice in one family (see review_checks).
capability:
  - perception
  - quantitative-reasoning
capability_basis:
  perception:
    reason: The values, labels and marks the answer depends on must be recovered from the chart
      image. The paper's models lose accuracy when the data table has to be extracted from the image
      rather than given, and visual questions refer to marks by colour, height and length.
    source: src-arxiv-2203-10244-v1
    quote: This highlights the increasing challenge of automatic data extraction from real-world
      charts with diversity in styles.
  quantitative-reasoning:
    reason: Crowdworkers were asked for compositional questions needing at least two operations such
      as sums, differences and averages, and 76.33% of 300 sampled human-written questions are
      compositional or both visual and compositional; most answers are numbers derived by those
      operations rather than read off the chart.
    source: src-arxiv-2203-10244-v1
    quote: Compositional questions contain at least two mathematical/logical operations like sum,
      difference and average
capability_considered_and_rejected:
  - term: grounding
    reason: Visual questions name marks by colour or position ("orange line", "tallest bar"), but
      the score is the final answer, not whether an expression was bound to the right mark, and no
      source claims grounding.
    source: src-arxiv-2203-10244-v1
    quote: visual questions refer to the visual attributes such as color, height, and length of
      graphical marks (e.g., bars) in the chart
  - term: deductive-reasoning
    reason: The paper's "logical" operations are comparisons and selections over chart values (a
      maximum, a difference, a count above a threshold), which quantitative-reasoning carries; no
      premises or rules are stated for a conclusion to follow from.

evaluation_method:
  - numeric-tolerance-match
  - exact-match
evaluation_method_basis:
  reason: Relaxed accuracy splits by answer type. A numeric answer is correct within 5% of the gold
    answer, a relative tolerance the paper adopts from PlotQA to absorb data-extraction error; a
    non-numeric answer must match exactly. Accuracy is the share of items marked correct.
  source: src-arxiv-2203-10244-v1
  quote: We consider an answer to be correct if it is within 5% of the gold answer. For non-numeric
    answers, we still need an exact match to consider an answer to be correct.
evaluation_method_considered_and_rejected:
  - term: constraint-check
    reason: No battery of conditions is asserted on an output; each answer gets one verdict against
      one gold answer.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The dataset ships train, validation and test splits, and the release paper's entrants are
    table-QA and vision-language models (T5, VL-T5, TaPas, VisionTaPas) fine-tuned on the training
    split for 30 epochs and scored as trained; the repository's model code trains on it.
  source: src-github-chartqa-t5-readme
  quote: In order to train the T5 model on any ChartQA dataset
observed_subjects:
  values:
    - instruction-tuned-model
  basis: >
    General vision-language models now report ChartQA beside many other evaluations: Claude Sonnet 3.5
    in ChartQAPro's abstract (2025), and Leum-VL-8B, Qwen3-VL-8B, Keye-VL-8B Thinking, GLM-4.1V-9B
    Thinking and MiniCPM-V-4.5-8B in a March 2026 technical report's table of open benchmarks. Whether
    each was trained on ChartQA's training split is not stated.
  source: src-arxiv-2603-20354-v1

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the test set; a March 2026 technical report lists ChartQA
    test among its open benchmarks, scored by relaxed accuracy, and ChartQAPro (April 2025) reports
    a 2025 model's ChartQA score. saturated is derived from headroom and never hand-set; the
    saturation evidence is left for review (review_checks).
  source: src-arxiv-2603-20354-v1
  quote: 'ChartQA (Masry et al., 2022b): Chart understanding benchmark evaluated with relaxed accuracy.
    We report test-set results.'
activity: no-submission-channel
activity_basis:
  reason: The repository and the Hugging Face dataset distribute the data and the paper's model
    code. No source shows a leaderboard, server or submission route, and results appear in their
    reporters' own papers.
  source: src-github-chartqa-readme
  quote: The ChartQA dataset is available in the ChartQA Dataset folder in this repository.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: VisionTaPas (the release paper's model)
    source: src-arxiv-2203-10244-v1
    observed_on: 2026-10-14
    quote: We observe that VisionTaPas achieves state-of-the-art performance on both problem
      scenarios.
  - system: Claude Sonnet 3.5
    source: src-arxiv-2504-05506
    observed_on: 2026-10-14
    quote: Claude Sonnet 3.5 scores 90.5% on ChartQA but only 55.81% on ChartQAPro
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: ChartQA-H's answers come from the crowdworker who wrote each question,
  checked by a second worker's answer with disagreements settled by hand; ChartQA-M's come from the
  generation pipeline, kept only where the answer is in the chart's data table, and its test set was
  cleaned by hand. The test answers are public.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The test questions, chart images and answers are public in the repository, and the scoring
    rule is stated in the paper. No official scorer is published (execution.harness_gotcha).
  source: src-github-chartqa-readme
  quote: The ChartQA dataset is available in the ChartQA Dataset folder in this repository.

task:
  exists: true
  input:
    - a chart image (bar, line or pie) from Statista, Pew Research, Our World in Data or the OECD
    - a natural-language question about the chart; in the paper's first setting, also the chart's
      gold data table
  output: A short open-vocabulary answer, usually a number, otherwise a label or a word such as Yes
    or No.
  scoring: Relaxed accuracy on the test split. A numeric answer is correct within 5% of the gold
    answer, any other answer only on an exact match. ChartQA-H and ChartQA-M (1,250 questions each)
    are reported separately and as an overall average.
  source: src-arxiv-2203-10244-v1
  quote: Following Methani et al. (2020), we use a relaxed accuracy measure for the numeric answers

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every split's questions and answers, with the chart images, are in the public repository
      (test_human.json and test_augmented.json for the test split), and the full version is on an
      ungated Hugging Face dataset.
    source: src-github-chartqa-readme
    quote: The ChartQA dataset is available in the ChartQA Dataset folder in this repository.
  refresh: static
  refresh_basis:
    reason: The questions, answers and splits have not changed since release. The README's updates
      add model code and the bounding-box annotations, which no score uses.
    source: src-github-chartqa-readme
    quote: Added the full ChartQA dataset (including the bounding boxes annotations)
  data_provenance:
    - web-scraped
    - crowd-authored
    - model-generated
  data_provenance_note: The charts were crawled from four websites (Statista, Pew Research, Our
    World in Data, the OECD); the questions were written for the benchmark. ChartQA-H's questions
    and answers were written by Amazon Mechanical Turk workers, selected by acceptance rate and a
    pretest. ChartQA-M's were generated by two T5 models fine-tuned on SQuAD, one extracting answers
    from Statista's human-written chart summaries and one writing a question for each, then filtered
    by whether the answer appears in the chart's data table.
  data_provenance_source: src-arxiv-2203-10244-v1
  data_provenance_quote: 'We have two main annotations procedures: (i) collect human-authored QA pairs
    using Amazon Mechanical Turk (AMT) and (ii) generate QA pairs from the Statista human-written summaries.'
  contamination_risk: medium
  contamination_risk_note: The test questions and answers have been public since 2022, in the
    repository and on Hugging Face, and the training split is meant for training, so a route into
    general vision-language models' training data is plausible. No source read evidences test-set
    contamination; ChartQAPro's statement of performance saturation is about the ceiling, not about
    contamination.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Relaxed accuracy is bounded at 100%, and no human score is published for
    model scores to be read against. The paper reports crowdworker agreement on the human-written
    answers (61.04% by exact match, 78.55% on a 500-item sample allowing typos and lexical variants)
    as a data-quality figure, not as a ceiling (see review_checks).
  dataset_licence: GPL-3.0
  dataset_licence_note: The Hugging Face dataset card's licence; GitHub's licence metadata for
    vis-nlp/ChartQA, which also holds the dataset folder, is GPL-3.0 too (read 2026-10-14).
  dataset_licence_source: src-hf-api-chartqa
  dataset_licence_quote: '"cardData":{"license":"gpl-3.0"'
  upstream_licences: The chart images and data tables are Statista's, Pew Research Center's, Our
    World in Data's and the OECD's, used under each publisher's terms as the paper reads them
    (Statista's open access for academic purposes, Pew's with attribution).
  upstream_licences_source: src-arxiv-2203-10244-v1
  upstream_licences_quote: we only used the publicly available charts that comply with their terms
    and conditions
  size:
    - count: 2500
      unit: test questions (1,250 human-written, 1,250 machine-generated)
      subset: test
      source: src-hf-api-chartqa
      quote: '{"name":"test","num_bytes":107100539,"num_examples":2500}'
    - count: 9608
      unit: human-written questions on 4,804 charts (7,398 train, 960 validation, 1,250 test)
      subset: ChartQA-H
      source: src-arxiv-2203-10244-v1
      quote: ChartQA-H Charts Questions 3,699 480 625 7,398 960 1,250 4,804 9,608
    - count: 23111
      unit: machine-generated questions on 17,141 charts (20,901 train, 960 validation, 1,250 test)
      subset: ChartQA-M
      source: src-arxiv-2203-10244-v1
      quote: ChartQA-M Charts Questions 15,474 680 987 20,901 960 1,250 17,141 23,111

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Ahmed Masry (the first author), with the vis-nlp GitHub account
  maintainer_basis:
    reason: The full dataset sits in the first author's personal Hugging Face namespace, and the
      code and first-version data in the vis-nlp GitHub account, which GitHub records as a user
      account, not an organisation (API, read 2026-10-14). No source names an institution as holder;
      the authors were at York University, Nanyang Technological University and Salesforce Research.
    source: src-hf-api-chartqa
    quote: '"author":"ahmed-masry"'
  maintainer_type: individual
  maintainer_type_note: academic-lab was considered. vis-nlp also hosts the group's later chart
    models and ChartQAPro, but no source says which institution, if any, holds the account (see
    review_checks).
  submission_process:
    - literature-only
  submission_process_note: No leaderboard, results page or submission route; beyond the release
    paper's own baselines, results appear in their reporters' papers, such as ChartQAPro's and
    Leum-VL's.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-github-chartqa-readme
      quote: A lightweight model (140M parameters) excelling in ChartQA
  independence_flags_note: The release paper introduces its own models (VisionTaPas, and its VL-T5
    and T5 adaptations) and reports them state-of-the-art on ChartQA, and the README advertises the
    authors' later chart models (UniChart, ChartInstruct, ChartGemma) on the benchmark. There is no
    leaderboard, so the flag records the maintainers reporting their own systems on their own
    benchmark.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The test data and answers are public and the scoring rule is a deterministic per-item
      check anyone can implement, with no human, physical or maintainer-only step. No official
      scorer is published, so implementations of the rule can differ (harness_gotcha).
    source: src-arxiv-2203-10244-v1
    quote: We consider an answer to be correct if it is within 5% of the gold answer. For
      non-numeric answers, we still need an exact match to consider an answer to be correct.
  harness_availability: reference-implementation-only
  harness: The repository's model code (T5, VL-T5 and VisionTaPas training and prediction scripts),
    which reports exact accuracy, not relaxed accuracy
  harness_source: src-github-chartqa-t5-readme
  harness_quote: is the exact accuracy which is different from the relaxed accuracy measure
    described in the paper
  harness_gotcha:
    source: src-github-chartqa-t5-readme
    quote: Hence, you will still need to evaluate the generated predictions using the relaxed
      accuracy.
  code_licence: GPL-3.0
  code_licence_note: GitHub's licence metadata for vis-nlp/ChartQA, read 2026-10-14; not a quoted
    Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which test set is reported (ChartQA-H, ChartQA-M or their average), whether the
  # system trained on ChartQA's training split, whether it was given the chart's gold data table (the paper's
  # first setting), and whose implementation of relaxed accuracy scored it, since none is official.
  material_extra:
    - subset_used
    - training_data_policy
    - harness

homepage: https://github.com/vis-nlp/ChartQA
repository: https://github.com/vis-nlp/ChartQA
dataset_url: https://huggingface.co/datasets/ahmed-masry/ChartQA

subsets:
  - id: chartqa#human
    label: ChartQA-H, human-written questions (test split)
    items: 1250
    scored_separately: true
    evidence:
      - source: src-arxiv-2203-10244-v1
        quote: ChartQA-H Charts Questions 3,699 480 625 7,398 960 1,250 4,804 9,608
      - source: src-github-chartqa-readme
        quote: 'train_human.json # ChartQA-H (human-authored) questions/answers.'
      - source: src-arxiv-2203-10244-v1
        quote: ChartQA-H 28.72% 29.60% 24.84% 25.12% 26.24%
    notes: The human split, test_human.json; 1,250 test questions on 625 charts. The harder set in
      the paper, where its VisionTaPas scored 29.60% against 61.44% on ChartQA-M (Table 6).
  - id: chartqa#augmented
    label: ChartQA-M, machine-generated questions (test split)
    items: 1250
    scored_separately: true
    evidence:
      - source: src-arxiv-2203-10244-v1
        quote: ChartQA-M Charts Questions 15,474 680 987 20,901 960 1,250 17,141 23,111
      - source: src-github-chartqa-readme
        quote: 'train_augmented.json # ChartQA-M (machine-generated) questions/answers.'
      - source: src-arxiv-2203-10244-v1
        quote: ChartQA-M 53.84% 61.44% 61.60% 56.96% 56.88%
    notes: The augmented split, test_augmented.json; 1,250 test questions on 987 charts, all from
      Statista, with invalid generated questions removed by hand.
subsets_note: The paper's Overall row is the mean of the two test sets, which are the same size.

lineage:
  role: root
  variants:
    - id: chartqapro
      relation: successor
      source: src-github-chartqa-readme
      quote: a more diverse, challenging dataset for real-world chart question answering

tags:
  - chart-question-answering
  - charts
  - visual-question-answering
  - numerical-reasoning
  - relaxed-accuracy

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T08)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2203-10244-v1
    - src-arxiv-2203-10244
    - src-acl-2022-findings-acl-177
    - src-github-chartqa-readme
    - src-github-chartqa-t5-readme
    - src-hf-api-chartqa
    - src-arxiv-2504-05506
    - src-arxiv-2603-20354-v1
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date; its ACL
    Anthology page (a DOI) for the venue, with scripts and styles stripped; the README and the T5 model's
    README at main; Hugging Face's API record of the full dataset; ChartQAPro's abstract page for the
    saturation statement and lineage; and the Leum-VL Technical Report's v1 PDF (a DOI, not archived)
    as
    evidence of current use.
  confidence: medium
  review_checks:
    - check: lifecycle stays active because saturated is derived from headroom and never hand-set.
        The saturation evidence for that derivation is ChartQAPro's abstract (by ChartQA's own
        authors), Claude Sonnet 3.5 at 90.5%, and Keye-VL-8B Thinking at 94.1 in Leum-VL's Table 6
        (a figure it takes from Molmo2, Clark et al. 2026).
      field: lifecycle
      source: src-arxiv-2504-05506
      quote: existing benchmarks like ChartQA lack real-world diversity and have recently shown
        performance saturation with modern large vision-language models (LVLMs)
    - check: Domain is multimodal/chart-diagram-understanding with no secondary.
        vision/ocr-handwriting and vision/document-understanding were rejected because no
        transcription or extracted structure is scored; multimodal/visual-qa as a secondary was
        rejected as redundant with the narrower leaf of the same family. Confirm both calls.
      field: domain
    - check: maintainer_type individual or academic-lab. The full dataset is in the first author's
        personal Hugging Face namespace, and vis-nlp is a GitHub user account, not an organisation,
        that also hosts the group's later chart models; whether it is a York University lab account
        is not stated in the sources read.
      field: governance.maintainer_type
      source: src-hf-api-chartqa
      quote: '"author":"ahmed-masry"'
    - check: maintainer-competes-on-own-benchmark rests on the authors reporting their own models,
        the release paper's VisionTaPas and the README's later chart models; there is no leaderboard
        to compete on.
      field: governance.independence_flags
      source: src-github-chartqa-readme
      quote: A lightweight model (140M parameters) excelling in ChartQA
    - check: No official relaxed-accuracy scorer is published (the repository's code reports exact
        accuracy), so the tier is fully-automatable with the gap recorded as harness_gotcha. Whether
        the missing scorer should instead be the no-reference-implementation blocker, which would
        rule that tier out.
      field: execution.reproducibility_tier
      source: src-github-chartqa-t5-readme
      quote: Hence, you will still need to evaluate the generated predictions using the relaxed
        accuracy.
    - check: ceiling_anchor_type theoretical-maximum or measured-ceiling. Every human-written answer
        was checked against a second worker's and disagreements settled by hand, and the augmented
        test set was cleaned by hand, which may count as validation that the items are solvable.
      field: data.ceiling_anchor_type
      source: src-arxiv-2203-10244-v1
      quote: Overall, the agreement between the crowd workers based on exact matches was 61.04%.
    - check: The introduction gives 20,882 charts, while Table 2's per-set chart counts sum to
        21,945; the difference may be Statista charts carrying both kinds of question, which the
        sources do not state. The entry records per-set counts only.
      field: data.size
      source: src-arxiv-2203-10244-v1
      quote: Our benchmark consists of 20,882 charts
    - check: web-scraped is tagged for the crawled charts, while every question was written or
        generated for the benchmark; whether the term should apply when only the images were
        harvested.
      field: data.data_provenance
      source: src-arxiv-2203-10244-v1
      quote: we crawled charts from four different sources
  personal_data_excluded:
    - source: src-github-chartqa-readme
      what: the first author's e-mail addresses in the Contact section
    - source: src-arxiv-2203-10244-v1
      what: the authors' e-mail addresses under the title
    - source: src-arxiv-2603-20354-v1
      what: the corresponding author's e-mail address

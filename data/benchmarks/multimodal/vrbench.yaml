# data/benchmarks/multimodal/vrbench.yaml
#
# P1-S12 sweep follow-up: a new multimodal entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from the VRBench paper, arXiv 2506.10857 read as its v2 PDF (2025-08-04, the ICCV 2025 camera-ready), its
# abstract page and the abstract page of v1 (2025-06-12; the v1 PDF was also read and is not cited); the repository
# README at main's head commit fa10939 (2026-06-04) of OpenGVLab/VRBench; the project page, whose results table is
# static HTML (scripts and styles stripped); Hugging Face's API record of the dataset; GitHub's API record of the
# OpenGVLab organisation; and the v1 PDF of arXiv 2510.23473 (October 2025), a paper that runs VRBench. The item file
# VRBench_eval.jsonl was downloaded from Hugging Face at revision 9ac0bbcb and counted (960 videos, 8,243 questions,
# 25,106 reasoning steps); it is not a quoted Source. GitHub's API supplied the repository's dates, commits and
# licence metadata, and Hugging Face's the dataset's commit log; none of those is a quoted Source. The CompassHub
# card the sweep read was not re-read, and the videos and the paper's figures were not read. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# Boundary (02 S11 rule 12): every scored item is a question answered in language about a long video, with a
# reference chain of timestamped steps, and the annotation rules require answers that need the video and not the
# subtitles alone. The score is the correspondence between video and language, so the entry is
# multimodal/video-language, as vision/video-understanding's own distinction sends a video benchmark posed as QA
# here. Text-only LLMs answer from model-written video summaries; that track and the frame-fed VLM track are
# modelled as subsets over the same items.
#
# Versions: arXiv v1 described 1,010 videos and 9,468 questions; v2 and the data release have 960 and 8,243. Same
# maintainer, task and scoring, fewer items: one benchmark with two revisions (04 S4).

id: vrbench
name: VRBench
tagline: 8,243 four-option questions on 960 long narrative videos, scored on the answer and on a
  judged reasoning chain.
description: >
  A long-video reasoning benchmark from authors at Shanghai Artificial Intelligence Laboratory, Nanjing
  University, Shanghai Innovation Institute and the Chinese Academy of Sciences' Shenzhen Institute of
  Advanced Technology (ICCV 2025), held in the OpenGVLab organisation, Shanghai AI Laboratory's General
  Vision Team. Its 960 narrative videos (films, sports, games, travel vlogs and the like), 1.6 hours long
  on average and 1,540 hours in all, were collected from YouTube in eight languages other than English
  and Chinese and kept when a panel rated their plots coherent. Trained graduate students, starting from
  GPT-4o drafts, wrote 8,243 questions (the rules ask for 8 to 10 per video; the release has 6 to 10)
  over seven reasoning types, each with a reference chain of timestamped steps (25,106 in all) and an
  answer that needs the video rather than the subtitles alone. A model reasons step by step and then picks
  one of four options, whose distractors DeepSeek-V3 wrote. The outcome score is multiple-choice accuracy,
  the process score is DeepSeek-V3's weighted rating of the reasoning chain against the reference, and
  the overall score averages the two. Text-only LLMs receive model-written video summaries instead of
  frames and are ranked apart. In the v2 paper Gemini 2.0 Pro led the 31 models at 74.61% overall. Items,
  answers, summaries and 360p videos are on Hugging Face under Apache-2.0; arXiv v1 (June 2025) described
  a larger set of 1,010 videos.
self_description:
  source: src-arxiv-2506-10857
  quote: We present VRBench, the first long narrative video benchmark crafted for evaluating large
    models' multi-step reasoning capabilities
external_ids:
  huggingface: OpenGVLab/VRBench
  arxiv: '2506.10857'
paper:
  title: 'VRBench: A Benchmark for Multi-Step Reasoning in Long Narrative Videos'
  arxiv: '2506.10857'
  version_read: v2
  source: src-arxiv-2506-10857-v2
released: 2025-06-12
released_note: The paper's first arXiv version, a technical report with a larger item set
  (versions). The repository was created the same day; Hugging Face's commit log dates the item
  file's first upload to 2025-08-04, the day of arXiv v2.
released_source: src-arxiv-2506-10857
released_quote: Submitted on 12 Jun 2025 (v1), last revised 4 Aug 2025 (this version, v2)
release_venue: ICCV 2025
release_venue_source: src-arxiv-2506-10857
release_venue_quote: 'Comments: ICCV2025'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/video-language
  secondary: []
domain_basis:
  reason: Every scored item is a question about a long video, answered by choosing an option in
    language and by a reasoning chain in language that a judge compares with the reference chain.
    The annotation rules require that the answer need the visual content and not the subtitles
    alone, so the score measures correspondence between the video and the language, which is
    multimodal's inclusion test; vision/video-understanding's distinction sends a video benchmark
    posed as question answering to video-language. Nothing is scored inside one modality.
  source: src-arxiv-2506-10857-v2
  quote: Mandatory multimodal grounding where solutions demand both visual analysis (excluding
    subtitle-only answers) and explicit reasoning (beyond basic perception)
domain_considered_and_rejected:
  - term: vision/video-understanding
    reason: The benchmark is about long videos, but no score is a label or a temporal segment
      without language; the timestamps belong to the reference reasoning steps, and models are not
      scored on producing them.
  - term: reasoning-general/temporal-reasoning
    reason: The paper's claim is multi-step reasoning, and it names temporal reasoning as what
      earlier evaluations overlook, but the reasoning is about video content, which has its own
      family (reasoning-general's exclusion), and no temporal subset is scored on its own.
    source: src-arxiv-2506-10857-v2
    quote: addressing limitations in existing evaluations that overlook temporal reasoning and
      procedural validity
  - term: reasoning-general/counterfactual
    reason: Hypothetical reasoning is one of the seven question types (1,497 of 8,243 questions in
      the release file), scored as a breakdown of the same benchmark, not the benchmark's claim.
    source: src-arxiv-2506-10857-v2
    quote: 'Hypothetical reasoning: Deduce plausible scenario outcomes from stated premises.'
  - term: language/long-context
    reason: The text-only LLM track reads long model-written summaries, but the summaries stand in
      for the video, and the scored relation is still the answer's agreement with the video.
capability:
  - temporal-reasoning
  - abductive-reasoning
  - perception
  - context-integration
capability_basis:
  temporal-reasoning:
    reason: Each question is anchored to a stretch of the video, the annotation rules spread
      questions over 0-15, 15-40 and 40-120 minute windows, and the reference chains are sequences
      of timestamped steps whose order the judge checks; event prediction asks what follows in the
      timeline.
    source: src-arxiv-2506-10857-v2
    quote: Each question requires no less than 2 reasoning steps annotated with precise timestamps
  abductive-reasoning:
    reason: Event attribution, the largest type (1,875 questions in the release file), and implicit
      inference ask for the explanation the video best supports, a motive or an unstated relation,
      chosen among four options and defended in a chain; the answer is supported, not entailed.
    source: src-arxiv-2506-10857-v2
    quote: 'Event attribution: Determine causal origins or underlying motivations of video events.'
  perception:
    reason: Vision-language models receive sampled frames and are scored on what they recover from
      them; the paper finds counting questions hardest because they need fine-grained perception.
      The text-only track receives summaries instead, which the term's exclusion leaves out
      (subsets).
    source: src-arxiv-2506-10857-v2
    quote: most of the large models are not proficient in counting problems since they require
      fine-grained visual perception
  context-integration:
    reason: The video, its translated subtitles or the summary supply what determines the answer,
      and questions answerable from the subtitles alone or from common knowledge were excluded by
      rule.
    source: src-arxiv-2506-10857-v2
    quote: Questions and answers must be derived solely from the video content or a combination of
      video and subtitles, not from subtitles alone or common life knowledge.
capability_considered_and_rejected:
  - term: causal-reasoning
    reason: Event attribution asks for causes and hypothetical reasoning for outcomes under a
      premise, but no item requires telling cause from correlation or predicting an intervention's
      effect against evidence; the classification corpus made the same call on video-mme-v2's causal
      relations between events.
    source: src-arxiv-2506-10857-v2
    quote: 'Hypothetical reasoning: Deduce plausible scenario outcomes from stated premises.'
  - term: memory-retention
    reason: The videos average 1.61 hours and long-context models score higher, but the sampled
      video (or the whole summary) is given at once with the question, and length is a property of
      the input, which the term's exclusion rules out.
    source: src-arxiv-2506-10857-v2
    quote: Since the average length of VRBench is 1.61 hours, the necessity of long context support
      is becoming more pronounced
  - term: quantitative-reasoning
    reason: Counting problems are one of seven types, and their answers are lettered options, not
      computed quantities.
    source: src-arxiv-2506-10857-v2
    quote: 'Counting problems: Quantify state changes through arithmetic/combinatorial analysis.'
  - term: deductive-reasoning
    reason: The answers are the plausible reading of a narrative, not conclusions entailed by stated
      premises; for event prediction and hypothetical reasoning the paper says no single reference
      chain exists.
    source: src-arxiv-2506-10857-v2
    quote: For the event prediction and hypothetical reasoning tasks, we argue that there is no
      ground-truth reasoning steps since there might be multiple possible predictions

evaluation_method:
  - multiple-choice
  - model-graded-judge
  - rubric-graded
  - composite
evaluation_method_note: >
  The outcome score (MCQ-O) is accuracy over four-option questions, the letter parsed from the end of
  the response; the release file's keys are near-uniform over A to D, so chance is 25%. The process score
  (OE-P) is DeepSeek-V3's rating of the model's reasoning chain against the reference chain on four 0-10
  criteria, weighted 40/40/10/10 (logical coherence, similarity to the reference, factual accuracy, clarity),
  or 8:1:1 without the similarity criterion for event prediction and hypothetical reasoning; the judge
  outputs the four ratings and code computes the weighted score. The overall score averages the two, each
  on a 0-100 scale. The judge is named only as DeepSeek-V3, with no snapshot or date; the repository calls
  DeepSeek's hosted API (execution.harness_gotcha). The judge prompt in the appendix names its criteria
  step matching, logical consistency, factual accuracy and process clarity.
evaluation_method_basis:
  reason: multiple-choice for the outcome stage; model-graded-judge and rubric-graded because a
    judge model applies four named, weighted criteria that are combined into the process score;
    composite because the headline overall averages sub-scores produced by those different methods.
  source: src-arxiv-2506-10857-v2
  quote: All metrics are normalized to 0-100 scales, and we report the rankings by computing average
    scores across all metrics.
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: The letter is matched exactly, but against a closed set of four supplied options, which
      multiple-choice names.
    source: src-arxiv-2506-10857-v2
    quote: final answers are parsed from response endings to mitigate verbose option analysis
  - term: human-expert-eval
    reason: People rated reasoning chains only to validate the judge, on 30 videos and 300
      questions; no published score comes from human raters.
    source: src-arxiv-2506-10857-v2
    quote: we select a subset of 30 videos with 300 questions to perform processlevel human
      evaluation
  - term: reference-metric
    reason: The process score compares the model's chain with a reference chain, but the comparison
      is a judge model's rating, not a computed string or embedding metric.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The subjects are vision-language models and text-only LLMs prompted directly with a
    chain-of-thought instruction to reason in steps and then answer; no tools or harness loop are
    involved, and each model uses its own frame setting.
  source: src-arxiv-2506-10857-v2
  quote: Given a question, 1) models produce multi-step reasoning using Chain-of-Thought [75]
    prompts. Then 2) models choose final answers from multiple-choice options.
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: The paper compares system-2 models with their system-1 versions and runs a token-budget
      ablation on 300 videos, but the main protocol sets no reasoning budget.
    source: src-arxiv-2506-10857-v2
    quote: we set a series of token limitations on these models and require the models to think with
      different instructions
  - term: human-expert
    reason: No human answered the questions as a baseline; people only rated chains to validate the
      judge.

as_used:
  - protocol: Outcome-level multiple-choice accuracy alone, with no process score, at 16, 32 or 64
      frames, reported as VRBench by video-reasoning training papers as an out-of-domain test set.
    split: all questions (which release is not stated)
    source: src-arxiv-2510-23473-v1
    quote: We evaluate all baseline models on the aforementioned dataset using accuracy as the
      primary evaluation metric.
    note: The October 2025 Video-Thinker paper reports 80.69% for its 7B model, 11.44 points above
      its best baseline, and describes the benchmark by v1's 1,010 videos.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. A video-reasoning paper of October 2025 runs VRBench as
    an out-of-domain test beside Video-Holmes and CG-Bench-Reasoning, and the maintainers added
    inference support for more recent models in June 2026.
  source: src-arxiv-2510-23473-v1
  quote: 80.69% on VRBench (11.44% improvement over the best baseline)
activity: no-submission-channel
activity_note: The project page's results table is the v2 paper's Table 2, 31 rows, and its
  repository was last pushed on 2025-08-04 (GitHub API); no source offers outsiders a route onto it.
activity_basis:
  reason: The README describes running inference, the judge and the scorer on one's own machine,
    with results printed locally; neither it nor the project page invites submissions.
  source: src-github-vrbench-readme-fa10939
  quote: Results are printed in a table and optionally saved to JSON.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Gemini 2.0 Pro
    source: src-arxiv-2506-10857-v2
    observed_on: 2026-11-27
    quote: Gemini-2.0-Pro [61] achieves 74.61% overall accuracy, surpassing all components by at
      least 5.93%.
  - system: Video-Thinker-7B
    source: src-arxiv-2510-23473-v1
    observed_on: 2026-11-27
    quote: 80.69% on VRBench (11.44% improvement over the best baseline)
    note: Outcome accuracy only (as_used).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The annotators' answer keys and reference reasoning chains, released with
  the questions in VRBench_eval.jsonl; the process score is a judge's comparison with those chains.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The items, keys, reference chains, LLM-track summaries and videos are on Hugging Face
    without a gate, and the repository runs inference, the judge and the scorer; the judge is a call
    to DeepSeek's API, which anyone can buy.
  source: src-hf-api-opengvlab-vrbench
  quote: '"gated":false'
task:
  exists: true
  input:
    - for vision-language models, frames sampled from a narrative video of 20 minutes or more (1.6
      hours on average), at the model's own setting (4 to 512 frames, or 0.5 fps, in the paper)
    - for text-only LLMs, a Qwen2.5-72B-written summary of the video's captions and translated
      subtitles in place of the frames
    - a question, with a chain-of-thought instruction to reason in steps, and four lettered options
  output: A step-by-step reasoning chain ending in one option letter.
  scoring: Outcome accuracy over the letters, and the judge's weighted 0-100 rating of the chain
    against the reference chain; the overall score is their mean, reported with per-type breakdowns
    and separately for LLMs and VLMs.
  source: src-arxiv-2506-10857-v2
  quote: Given a question, 1) models produce multi-step reasoning using Chain-of-Thought [75]
    prompts. Then 2) models choose final answers from multiple-choice options.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: VRBench_eval.jsonl holds, for each of the 960 videos, the questions, options, answer
    letters, reference reasoning chains with timestamps, question types and the video summary (read
    2026-11-27); the videos are a 40-part zip archive of 360p files.
  access_basis:
    reason: The item file and the videos are public in one Hugging Face dataset with no gate, and
      there is no hidden split.
    source: src-hf-api-opengvlab-vrbench
    quote: '{"rfilename":"VRBench_eval.jsonl"}'
  refresh: versioned-releases
  refresh_note: One change to the items, between arXiv v1 (1,010 videos) and v2 (960), announced
    with the camera-ready; the item file has not changed since its upload on 2025-08-04 (Hugging
    Face's commit log). The 360p videos were added on 2025-08-18 and the card edited on 2025-09-08.
  refresh_basis:
    reason: The one change is carried by a dated arXiv version and a dated maintainer announcement
      that a claim can be pinned to.
    source: src-github-vrbench-readme-fa10939
    quote: '[08/2025] The camera-ready version of VRBench has been released!'
  data_provenance:
    - web-scraped
    - crowd-authored
    - model-generated
  data_provenance_note: The videos were retrieved from YouTube by seven narrative tags and filtered
    by a panel of 14 multilingual experts on plot coherence. GPT-4o drafted six QA pairs per video
    from automatic captions and translated transcripts; 67 trained graduate students wrote the final
    8 to 10 per video with their reasoning chains, and 10 trained reviewers checked each.
    DeepSeek-V3 generated the three wrong options of every question from the human answer.
  data_provenance_source: src-arxiv-2506-10857-v2
  data_provenance_quote: We recruit and train 67 graduate students to generate 8-10 high-quality QA
    pairs per video
  contamination_risk: medium
  contamination_risk_note: The videos are public on YouTube, and the questions, keys and reference
    chains have been public on Hugging Face since August 2025, so a training route is plausible; no
    source read evidences one. The reasoning chains are also usable as training targets for process
    supervision.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No human answered the questions as a baseline; the top row is Gemini 2.0
    Pro at 74.61% overall (83.29% outcome, 65.93% process).
  dataset_licence: Apache-2.0
  dataset_licence_note: The Hugging Face card's licence tag; the paper and the README state no terms
    for the videos themselves (upstream_licences).
  dataset_licence_source: src-hf-api-opengvlab-vrbench
  dataset_licence_quote: '"license:apache-2.0"'
  upstream_licences: null
  upstream_licences_note: The videos are public YouTube videos, redistributed at 360p; no source
    read states their licences or whether the dataset's Apache-2.0 tag is meant to cover them.
  size:
    - count: 8243
      unit: four-option multiple-choice questions, each with a reference reasoning chain
      note: Counted in VRBench_eval.jsonl on 2026-11-27, which matches exactly; 6 to 10 questions
        per video.
      source: src-arxiv-2506-10857-v2
      quote: It comprises 960 long videos (with an average duration of 1.6 hours), along with 8,243
        human-labeled multi-step question-answering pairs and 25,106 reasoning steps with
        timestamps.
    - count: 960
      unit: narrative videos, 1.6 hours on average
      subset: all
      source: src-arxiv-2506-10857-v2
      quote: VRBench includes 960 manual-filtered narrative videos, covering 8 languages and 7 video
        categories
    - count: 25106
      unit: timestamped reasoning steps in the reference chains
      note: The 1,249 information-synopsis questions have no steps in the release file.
      source: src-arxiv-2506-10857-v2
      quote: It comprises 960 long videos (with an average duration of 1.6 hours), along with 8,243
        human-labeled multi-step question-answering pairs and 25,106 reasoning steps with
        timestamps.
    - count: 1540
      unit: hours of video
      subset: all
      source: src-arxiv-2506-10857-v2
      quote: 960 videos • 8 languages • 1,540 hours • 7 video types
    - count: 9468
      unit: question-answer pairs, with 30,292 reasoning steps on 1,010 videos
      subset: arXiv v1 (2025-06-12)
      source: src-arxiv-2506-10857-v1-abs
      quote: It comprises 1,010 long videos (with an average duration of 1.6 hours), along with
        9,468 human-labeled multi-step question-answering pairs and 30,292 reasoning steps with
        timestamps.
  languages:
    - en
  languages_note: The questions, options, answers and reasoning chains are in English, written from
    English translations of the transcripts; the videos' speech is in eight languages that exclude
    English and Chinese, named in a figure that was not read.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: OpenGVLab, the General Vision Team of Shanghai AI Laboratory
  maintainer_basis:
    reason: The repository and the Hugging Face dataset sit in the OpenGVLab organisation accounts
      (GitHub type Organization; Hugging Face's organisations API answers 200), whose GitHub record
      describes it as Shanghai AI Laboratory's General Vision Team. Most of the 17 authors list
      Shanghai Artificial Intelligence Laboratory, beside Nanjing University, Shanghai Innovation
      Institute and the Shenzhen Institute of Advanced Technology. The project page sits in a
      separate GitHub account of type User named after the benchmark.
    source: src-github-api-opengvlab-org
    quote: '"description":"General Vision Team of Shanghai AI Laboratory","name":"OpenGVLab"'
  maintainer_type: null
  maintainer_type_note: Not decided. The holder is one institution's team account, so
    community-collective's shared multi-institution account does not apply, but no source read
    states Shanghai AI Laboratory's legal form. It is not a university (academic-lab),
    government-agency may not rest on an institute's name (its exclusion test), and no source makes
    it a company (industry-lab) or a nonprofit. omnidocbench, held by the same laboratory's
    OpenDataLab, is null for the same reason. Logged as taxonomy/_failures/2026-11-27-vrbench-001.
  submission_process:
    - maintainer-run
  submission_process_note: The maintainers chose and ran the 31 models (proprietary ones through
    their APIs, open ones locally) and publish the results table on the project page; no
    developer-submitted route is stated. The table has not changed since the v2 paper.
  submission_process_source: src-vrbench-github-io
  submission_process_quote: VRBench Evaluation Results Model Overall Results by Metric Results by
    Taxonomy MCQ-O (Outcome) OE-P (Process)
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2506-10857-v2
      quote: Shanghai AI Lab InternVL2.5-78B [7] InternVL2.5-8B [7] OpenGVLab InternVideo2.5-8B [73]
        VideoChat-Flash [32]
    - flag: grader-from-evaluated-party
      source: src-arxiv-2506-10857-v2
      quote: DeepSeek-V3 [38] serves as the judge due to its optimal balance between cost and human
        alignment
  independence_flags_note: >
    The paper's own table of evaluated models gives Shanghai AI Lab as the organisation of InternVL2.5-78B
    and InternVL2.5-8B and OpenGVLab as that of InternVideo2.5-8B and VideoChat-Flash; the benchmark is
    held by OpenGVLab, Shanghai AI Laboratory's General Vision Team, and Shanghai Artificial Intelligence
    Laboratory is the authors' first affiliation. The overlap is shown by affiliation, as the maintainer's
    rule of 2026-11-18 requires; InternVL2.5-78B is the top open-source VLM in the paper (62.31% overall).
    The judge, DeepSeek-V3, is itself an evaluated LLM (56.06% overall), beside DeepSeek-R1 and DeepSeek-VL2,
    and it also wrote every question's distractors. InternLM3-8B-Instruct is evaluated too, but the paper
    attributes it to no organisation, so it is not counted here. The funders named (the National Key R&D
    Program of China and a Jiangsu programme) are not evaluated parties.
  independence_assessed: true
  funding:
    source: src-arxiv-2506-10857-v2
    quote: This work is supported by the National Key R&D Program of China (No. 2022ZD0160101) and
      Jiangsu Frontier Technology Research and Development Program (No. BF2024076)
  known_limitation:
    source: src-arxiv-2506-10857-v2
    quote: VRBench may contain potential cultural bias for countries and regions where these
      languages are used.
  known_limitation_note: The videos deliberately exclude English and Chinese, so the benchmark
    covers eight other languages' content, read by models through English translations; LLM and VLM
    scores rest on different inputs and the paper calls comparing them unfair.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The paper ran the proprietary models through their APIs and the open ones locally
      (Hugging Face or vLLM), and the judge is a call to DeepSeek's hosted API; the protocol
      mandates no hardware, so serving open weights on GPUs is the entrant's choice.
    source: src-arxiv-2506-10857-v2
    quote: Pipeline API API API HF HF HF HF HF HF HF HF HF HF vLLM vLLM
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Items, keys and reference chains are public, inference and scoring are scripts, and the
      judge is a model call, so the headline score needs no human or maintainer-only step.
    source: src-github-vrbench-readme-fa10939
    quote: '`evaluation/compute_final_scores.py` (new): aggregates MCQ + process scores into a unified
      Final% leaderboard with per-reasoning-type breakdown.'
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: VRBench's repository scripts at fa10939, inference/main.py for the answers,
    evaluation/batch_evaluation_api_mp_time_sync.py or run_process_eval.py for the DeepSeek ratings,
    and evaluation/calculate_scores.py or compute_final_scores.py for the scores
  harness_source: src-github-vrbench-readme-fa10939
  harness_quote: '### 2. Rate answers with DeepSeek'
  harness_gotcha:
    source: src-github-vrbench-readme-fa10939
    quote: --base_url https://api.deepseek.com/v1
  harness_gotcha_note: The README's judge call passes the generic model name deepseek to DeepSeek's
    hosted API and pins no model snapshot, while the paper names DeepSeek-V3; a rerun's judge is
    whatever that endpoint serves, which is a different condition if it has changed.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for OpenGVLab/VRBench, read 2026-11-27; not a quoted
    Source. The README credits MMVU's repository as the basis of the code.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the llm-static-text and model-graded profiles: the chain-of-thought prompt (the paper's system prompts
  # differ for LLMs and VLMs), and the output-token limit, which the paper's test-time-scaling run shows moves
  # the score. Which track (VLM frames or LLM summaries) and which type is subset_used. The number of frames
  # sampled, which the paper sets per model from 4 to 512 or 0.5 fps, moves the score but has no EvalConditions
  # field; it belongs in a claim's notes.
  material_extra:
    - prompt_template_hash
    - max_output_tokens
aggregation_policy: official-aggregate
aggregation_policy_note: Overall is the mean of the outcome accuracy and the process score; the
  table also gives both, and the seven per-type columns. The June 2026 scorer computes a Final% that
  the README describes as aggregating the same two scores.
aggregation_policy_basis:
  reason: The paper ranks by the average of its metrics, and the project page's table leads with an
    Overall column beside the two metrics.
  source: src-arxiv-2506-10857-v2
  quote: All metrics are normalized to 0-100 scales, and we report the rankings by computing average
    scores across all metrics.


# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2506-10857-v2
    - src-arxiv-2506-10857
    - src-arxiv-2506-10857-v1-abs
    - src-github-vrbench-readme-fa10939
    - src-vrbench-github-io
    - src-hf-api-opengvlab-vrbench
    - src-github-api-opengvlab-org
    - src-arxiv-2510-23473-v1
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, with the affiliation line and the funding sentence
    quoted with no window and every other window kept clear of the author block and the reference list;
    its abstract page and v1's (DOIs) for the dates, the venue and the two releases' counts. The README
    at fa10939 and the project page are withheld from archiving because they list the authors by name;
    the project page also sits in a GitHub account of type User. Hugging Face's API record of the dataset
    and GitHub's record of the OpenGVLab organisation are pending archiving. The v1 PDF of arXiv 2510.23473
    (a DOI) is evidence of current use. The item file was downloaded and counted, and is not a Source.
  confidence: medium
  review_checks:
    - check: Counts. The v2 paper, its abstract page, the project page's abstract and the Hugging
        Face item file (counted) agree on 960 videos, 8,243 questions and 25,106 steps. arXiv v1
        gave 1,010, 9,468 and 30,292. The sweep reported CompassHub card 2383 as 1,010 videos and
        9,468 reasoning steps; 9,468 is v1's question count, so the card appears to carry v1's
        figures. The card was not re-read. The project page's overview caption and the Video-Thinker
        paper also still give 1,010 videos.
      field: data.size
      source: src-arxiv-2506-10857-v1-abs
      quote: It comprises 1,010 long videos (with an average duration of 1.6 hours), along with
        9,468 human-labeled multi-step question-answering pairs and 30,292 reasoning steps with
        timestamps.
    - check: Versions. v1 and v2 are modelled as two revisions of one benchmark (same maintainer,
        task and scoring, fewer items). No source says why 50 videos and 1,225 questions went, or
        whether v1's set was ever downloadable; the README dates the open-sourcing to 07/2025, but
        Hugging Face's commit log shows the item file first uploaded on 2025-08-04, the day of v2.
      field: versions
      source: src-github-vrbench-readme-fa10939
      quote: '[07/2025] VRBench has been fully open-sourced!'
    - check: maintainer-competes-on-own-benchmark rests on the paper's own organisation column,
        which gives InternVL2.5 to Shanghai AI Lab and InternVideo2.5 and VideoChat-Flash to
        OpenGVLab, against a benchmark held by OpenGVLab, Shanghai AI Laboratory's General Vision
        Team (the organisation's own GitHub record), with the laboratory as the authors' first
        affiliation. That is an affiliation overlap under the 2026-11-18 rule; a reviewer may
        confirm that the table's OpenGVLab is the holder.
      field: governance.independence_flags
      source: src-arxiv-2506-10857-v2
      quote: Shanghai AI Lab InternVL2.5-78B [7] InternVL2.5-8B [7] OpenGVLab InternVideo2.5-8B [73]
        VideoChat-Flash [32]
    - check: grader-from-evaluated-party. DeepSeek-V3 is the process judge and is itself evaluated,
        and it also wrote every question's distractors, so the outcome score depends on it too. The
        paper validated the judge against human ratings on 300 questions (correlations above 0.8),
        which does not remove the conflict.
      field: governance.independence_flags
      source: src-arxiv-2506-10857-v2
      quote: For open-source model DeepSeek-V3 [38] and R1 [11], we observe that DeepSeek-R1
        achieves higher scores both on multiple-choice questions and open-ended evaluations.
    - check: maintainer_type is null, as for omnidocbench, because no source states Shanghai AI
        Laboratory's legal form. community-collective was rejected because one institution's team
        holds the accounts; academic-lab would need the laboratory read as a university research
        group.
      field: governance.maintainer_type
      source: src-github-api-opengvlab-org
      quote: '"description":"General Vision Team of Shanghai AI Laboratory","name":"OpenGVLab"'
    - check: Subsets. The LLM and VLM tracks are input conditions over the same items, modelled as
        subsets as video-mme's subtitle conditions are. The seven types are subsets whose item
        counts come from counting the release file, not from a quoted figure; the file labels
        information synopsis Event Summarization.
      field: subsets
    - check: evaluation_method carries rubric-graded beside model-graded-judge because the judge
        gives four named ratings that code weights and combines; model-graded-judge alone is the
        alternative if the criteria are read as the judge's prompt rather than a rubric. The paper's
        criterion names differ from the judge prompt's.
      field: evaluation_method
      source: src-arxiv-2506-10857-v2
      quote: we ask the model to output all sub-metric rating separately and automatically compute
        the final score
    - check: Judge and scorer. The README calls DeepSeek's hosted API with no model snapshot, so a
        rerun's judge may not be the paper's DeepSeek-V3. The June 2026 scripts
        (run_process_eval.py, compute_final_scores.py) were not read; whether their Final% equals
        the paper's Overall is unchecked.
      field: execution.harness_gotcha
      source: src-github-vrbench-readme-fa10939
      quote: '`evaluation/run_process_eval.py` (new): end-to-end DeepSeek-based process-score runner with
        async concurrency.'
    - check: data_provenance is crowd-authored, because the question writers were graduate students
        trained for the task; the paper calls the annotations labelled and reviewed by human
        experts, which would argue for expert-authored. model-generated is for GPT-4o's drafts and
        DeepSeek-V3's distractors.
      field: data.data_provenance
      source: src-arxiv-2506-10857-v2
      quote: We recruit and train 67 graduate students to generate 8-10 high-quality QA pairs per
        video
    - check: submission_process maintainer-run, because the project page keeps a results table of
        models the maintainers ran; it is the v2 paper's Table 2 unchanged since 2025-08-04, so
        literature-only is the alternative if a page that only republishes the release baselines
        does not count as a ranking. activity no-submission-channel follows either way.
      field: governance.submission_process
      source: src-vrbench-github-io
      quote: VRBench Evaluation Results Model Overall Results by Metric Results by Taxonomy MCQ-O
        (Outcome) OE-P (Process)
    - check: The Apache-2.0 tag on Hugging Face covers a dataset that redistributes YouTube videos
        at 360p; no source read addresses the videos' own rights, so no licence-restriction blocker
        is set and upstream_licences is null.
      field: data.dataset_licence
      source: src-hf-api-opengvlab-vrbench
      quote: '"license:apache-2.0"'
    - check: capability abductive-reasoning is tagged for event attribution and implicit inference
        (about 35% of the questions); causal-reasoning was rejected as the corpus did for
        video-mme-v2. A reviewer may prefer neither, leaving temporal-reasoning as the only
        reasoning term.
      field: capability
      source: src-arxiv-2506-10857-v2
      quote: 'Event attribution: Determine causal origins or underlying motivations of video events.'
  notes: null

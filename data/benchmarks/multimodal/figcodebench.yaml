  (six shared by Python, MATLAB and R, plus conceptual for LaTeX) are reported by MMOS in Table 8, and
  the easy, medium and hard tiers, set at the 33rd and 67th percentiles of a combined image and code complexity
  score, are reported for six models only; neither is modelled as a subset. Each language also splits
  into exemplary and user-generated code, and each into a base collection and two variant collections,
  which the dataset keeps in separate folders and the paper does not score apart.


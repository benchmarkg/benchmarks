# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2610-10066-v1
    - src-arxiv-2610-10066
    - src-github-figcodebench-readme
    - src-github-api-figcodebench-tree
    - src-hf-api-figcodebench
    - src-figcodebench-project-page
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with the affiliation lines and the availability
    statement quoted with no window and every other window kept clear of the author block and the personal-account
    links; its abstract page (a DOI) for the date. The README at 89f7816, GitHub's API tree listing at
    that commit, Hugging Face's API record of the dataset and the project page are withheld from archiving,
    because they sit in or name the personal accounts or name the authors. GitHub's API was read for the
    repository's dates, commits, owner type and licence, and Hugging Face's for the dataset owner's account
    type; the dataset card at 96844b8, which repeats the README's structure sections, and the two scripts
    in metrics/MLLM-judge, for how the jury is run, were read and not cited. CompassHub's API was not
    read: the paper and repository carry what its card summarises. VLMEvalKit's dataset registry (main,
    2026-11-27) lists ChartMimic but not FigCodeBench.
  confidence: medium
  review_checks:
    - check: Domain primary is multimodal/any-to-any-generation, with code left out. Code's
        inclusion test reads true (a script is authored, run and scored on the figure it computes),
        and the sweep suggested code as a secondary; it is rejected because no code leaf fits (no
        test judges behaviour, as for cadprompt) and the paper calls code similarity a diagnostic.
        Logged as taxonomy/_failures/2026-11-27-figcodebench-001; if the boundary is settled for
        code, a code secondary would follow.
      field: domain
      source: src-arxiv-2610-10066-v1
      quote: normalized AST similarity, and plotting-API F1 as complementary diagnostic metrics
    - check: chart-diagram-understanding is a secondary although its definition speaks of answering
        questions; it is taken for the content, every item a chart, plot or diagram read in detail,
        and for the paper's finding that its scores track CharXiv's chart questions. A reviewer who
        reads the leaf as question answering only would drop it.
      field: domain.secondary
      source: src-arxiv-2610-10066-v1
      quote: FigCodeBench shows a more stronger linear positive correlation with ChartXiv (r =
        0.797) than LiveCodeBench v6 (r = 0.537)
    - check: lifecycle is null. The only results are the release paper's, seven weeks old when read;
        a 2026 paper or board reporting FigCodeBench results would make it active.
      field: lifecycle
    - check: The sweep asked whether the leaderboard takes outside entries. No source gives a route;
        the board is an image of the paper's own runs, and the paper invites feedback only, so
        activity is no-submission-channel and submission_process maintainer-run. If the maintainers
        add rows for models they choose, nothing changes; a stated submission route would make it
        accepting-submissions.
      field: activity
      source: src-arxiv-2610-10066-v1
      quote: We encourage the community to provide feedback and engage in scrutinizing the
        benchmark.
    - check: grader-from-evaluated-party rests on the jury's three models being cited to OpenAI and
        Google and on Table 3 listing evaluated OpenAI and Google models. None of the three judges
        is itself among the 24 rows.
      field: governance.independence_flags
      source: src-arxiv-2610-10066-v1
      quote: Organizations OpenAI OpenAI OpenAI Anthropic Google Google Google Google Google xAI
    - check: maintainer-competes-on-own-benchmark rests on the authors' Shanghai Artificial
        Intelligence Laboratory affiliation and Table 3's organisation for the two InternVL3.5 rows,
        the last two models listed (by the 2026-11-18 rule, an affiliation shows the overlap). The
        InternVL3.5 models rank in the lower half. The funding statement's collaboration with the
        same laboratory could also be read as funded-by-evaluated-party, which was not set.
      field: governance.independence_flags
      source: src-arxiv-2610-10066-v1
      quote: Alibaba Shanghai AI Lab Shanghai AI Lab Cut-off Date
    - check: maintainer_type individual, because the code and project page sit in a personal GitHub
        account and the dataset in a personal Hugging Face account; academic-lab (the Shanghai Jiao
        Tong institute) would follow if a reviewer reads the authors' group as the holder.
      field: governance.maintainer_type
    - check: The dataset is MIT-licensed, but the paper says its figures and code came from sources
        holding CC BY 4.0, and the plotting galleries' licences are not stated; whether MIT can
        cover CC BY material, and what attribution the items carry, is open.
      field: data.dataset_licence
      source: src-arxiv-2610-10066-v1
      quote: and open-source repositories (e.g., GitHub and Reddit) that hold a CC BY 4.0 license
    - check: data_provenance is web-scraped and synthetic-procedural. The comparison section says
        LLM- and human-involved augmentation was applied, while the pipeline section describes only
        an AST and regex pipeline and researchers' GUI contributions; if a model wrote variants,
        model-generated applies too.
      field: data.data_provenance
      source: src-arxiv-2610-10066-v1
      quote: apply both LLM- and human-involved data augmentations
    - check: reproducibility_tier fully-automatable, although the repository ships no container, the
        rendering scripts install missing packages at run time, the MATLAB subset needs a MATLAB
        licence and the judge script runs one judge at a time against a placeholder endpoint. No
        blocker names an unpinned rendering toolchain (specific-simulator-build is for simulators);
        a reviewer may instead read the harness as reference-implementation-only.
      field: execution.reproducibility_tier
      source: src-arxiv-2610-10066-v1
      quote: The execution workflows for all four programming spaces are encapsulated within a
        containerized sandbox environment.
    - check: The dataset holds 6,193 figures for 6,194 code files; one Python variant has no figure
        and one MATLAB file has no figure of the same name, so a rerun on the files as distributed
        may not cover the paper's 6,194.
      field: data.size
      source: src-hf-api-figcodebench
      quote: '"rfilename":"Matlab/user_generated/code_base/Relational/GroupedBubbleChart3.m"'
    - check: aggregation_policy official-aggregate rests on MMOS's definition (the judges' mean).
        The leaderboard figure plots one MMOS per model against cost, but no source says how the
        four languages are combined into it; if the combination is undefined, a per-language
        headline would be more accurate.
      field: aggregation_policy
      source: src-arxiv-2610-10066-v1
      quote: Mean Machine Opinion Score (MMOS) versus average cost per problem for various models

subsets_note: The leaderboard is a grid of two conditions by three lengths plus Overall; the
  subtitle conditions and the lengths are listed flat, each scored under both conditions. The 6
  domains, 30 subcategories and 12 task types are breakdowns the scoring script reports, not subsets
  here; the task-type list is in a figure that was not read. Audio is a third input setting the
  paper reports for Gemini 1.5 Pro only (79.4% overall), with no leaderboard column.


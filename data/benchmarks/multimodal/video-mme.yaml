curation:
  added_by: agent (P1-S8-T09)
  added_on: 2026-11-10
  last_verified: 2026-11-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2405-21075-v3
    - src-arxiv-2405-21075
    - src-github-video-mme-readme-06c2315
    - src-video-mme-github-io-home-page
    - src-hf-api-lmms-lab-video-mme
    - src-arxiv-2604-05015
    - src-arxiv-2611-07329
    - src-epoch-benchmark-data
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text with 30-character windows that keep the
    author line, the acknowledged annotators and the references out; its abstract page for the dates;
    the README at commit 06c2315, quoted without windows because it holds two personal contact
    addresses and a citation block; the project page with scripts and styles stripped, whose static
    leaderboard was read in full; Hugging Face's API record of the dataset; Video-MME-v2's abstract
    page (a DOI) for the identity decision; a November 2026 audit's abstract page (a DOI) as evidence
    of current use; and Epoch's export for the VideoMME string. The scaffolded
    src-video-mme-github-io-home-page-html-leaderboard (Epoch's link to the same page) has no extract
    and is not cited.
  confidence: medium
  review_checks:
    - check: Identity. Video-MME-v2 is recorded as a separate benchmark by the same team rather than
        an edition, because it changes the task (eight options, a tri-level hierarchy) and the
        scoring (group-based non-linear) as well as the items, and is cited on its own. Same
        maintainer and same name stem argue for an edition; 04 S4's edition test needs the same task
        definition. No id was allocated for it.
      field: lineage
      source: src-arxiv-2604-05015
      quote: strategy that enforces both consistency across related queries and coherence in
        multi-step reasoning
    - check: tests/test_overlap_sample.py asserts that family_key('Video-MME v2') equals
        family_key('VideoMME'), treating v2 as the same family for overlap sampling, which disagrees
        with this entry's identity call.
      field: lineage
    - check: Audio. multimodal/audio-language was rejected as a secondary because audio is an
        optional setting reported for one model and absent from the leaderboard; the Video-MME-v2
        corpus record took audio-language as a secondary for v2, where omni models are scored with
        raw audio. The paper's abstract lists audio among the benchmark's four key features.
      field: domain.secondary
      source: src-arxiv-2405-21075-v3
      quote: 3) Breadth in data modalities, integrating multi-modal inputs besides video frames,
        including subtitles and audios
    - check: The subtitle conditions are modelled as two subsets over the same 2,700 questions, as
        04 S4's table names this case, though they are input conditions rather than item sets;
        subset_used in the comparability profile carries the choice on claims.
      field: subsets
    - check: The 12 task types (and 6 domains, 30 subcategories) are not subsets, because their item
        counts and the full task-type list are in a figure that was not read; 04 S6 cites "VideoMME
        reports 12 sub-scores" as subset material.
      field: subsets
    - check: The 2024-06-15 revision is marked breaking because videos were replaced and
        re-annotated, but the number of items changed is not stated and the leaderboard re-dated the
        paper's rows to that day.
      field: versions
      source: src-github-video-mme-readme-06c2315
      quote: '**`2024.06.15`** 🌟 We have refreshed our evaluation: 1) replace broken and potentially broken
        video links, and re-annotated them'
    - check: maintainer-competes-on-own-benchmark is left unset. The paper's reference list gives
        the VITA papers authors who are Video-MME authors, including its project leader, but the
        flag would rest on comparing author lists, which the entry does not quote. Set it if a
        reviewer accepts that evidence; the VITA rows are baselines in the defining paper and on the
        maintainers' board, not e-mailed entries.
      field: governance.independence_flags
      source: src-video-mme-github-io-home-page
      quote: VITA 1.5 Tencent Youtu Lab & NJU 7B 16 2025-01-22 56.1 58.7
    - check: maintainer_type community-collective rather than academic-lab. Every affiliation is
        academic and Nanjing University leads the project, but the repository moved from a personal
        account to a shared organisation account, and the data is served from LMMS-Lab's Hugging
        Face account.
      field: governance.maintainer_type
    - check: harness official-harness rests on the README naming its scoring script, which sits in a
        separate personal account at an unpinned main branch and was not read;
        reference-implementation-only may fit if the maintainers score submissions with other code.
      field: execution.harness_availability
    - check: licence-restriction as a blocker, and fully-open access despite academic-only terms.
        The terms forbid commercial use and redistribution, while frontier developers report the
        benchmark (the README's news items); whether evaluation counts as commercial use is not
        stated.
      field: execution.reproducibility_blockers
      source: src-github-video-mme-readme-06c2315
      quote: Without prior approval, you cannot distribute, publish, copy, disseminate, or modify
        Video-MME in whole or in part.
    - check: data_provenance expert-authored follows the paper's "expert annotators"; their
        expertise is vision-language research, not the videos' subject domains, so crowd-authored
        may fit.
      field: data.data_provenance
    - check: lifecycle active rather than saturated or superseded. The top row is 81.6% with
        subtitles (no human ceiling is known), and the same team's v2 abstract says existing
        benchmarks are saturating, but outside papers still report Video-MME in late 2026.
      field: lifecycle
      source: src-arxiv-2604-05015
      quote: existing benchmarks are becoming increasingly saturated, exposing a critical
        discrepancy between inflated leaderboard scores and real-world model capabilities
  notes: null

lineage_note: "Video-MME-v2 (arXiv 2604.05015, April 2026), from the same team, is recorded as a separate
  benchmark, not a version: it has new items, a tri-level task hierarchy and a group-based non-linear
  score in place of per-question accuracy, with its own paper, site, repository and dataset, which 04
  S4's test (\"independently versioned and cited\") sends to a new Benchmark. It has no id in the catalogue
  (the classification corpus calls it video-mme-v2), so no lineage edge is written. MME and MME-RealWorld
  are the team's image benchmarks, not derivatives."

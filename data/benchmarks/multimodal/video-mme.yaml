# data/benchmarks/multimodal/video-mme.yaml
#
# P1-S8-T09, multimodal entry 7. Promotes the Epoch stub data/benchmarks/_stubs/video-mme.yaml (Epoch's string
# "VideoMME"; its mapping stanza reads the leaderboard's Overall without subtitles). Filled from the Video-MME paper,
# arXiv 2405.21075 read as its v3 PDF (2025-05-30, the CVPR 2025 version), and its abstract page; the repository
# README at commit 06c2315 of MME-Benchmarks/Video-MME; the project page, whose leaderboard is static HTML (scripts
# and styles stripped); Hugging Face's API record of the dataset; the abstract page of Video-MME-v2 (arXiv
# 2604.05015), read for the identity decision only; the abstract page of a November 2026 audit that runs on
# Video-MME (arXiv 2611.07329); and Epoch's benchmark export. Not read: the scoring script the README links, held in
# a separate personal account, the dataset's parquet and video files, and the paper's figures (the task-type list
# is a figure). Every quote below is checked by the quote-substring validator against those Sources' committed
# extracts.
#
# Boundary (02 S11 rule 12): the scored quantity is whether a four-option answer, chosen in language, is the one the
# video supports; the questions were filtered so that text alone does not answer them. That is a correspondence
# between video and language, so the entry is multimodal/video-language, and vision/video-understanding's own
# distinction sends a video benchmark posed as QA here. Subtitles and audio are input conditions; with/without
# subtitles is modelled as two subsets (04 S4 names this case), and audio, an optional third setting the paper
# reports for one model, is recorded in notes only.
#
# Video-MME only. Video-MME-v2 (2026) is a separate benchmark by the same team, with new items and a different
# scoring rule; it has no id here (lineage_note).

id: video-mme
name: Video-MME
aliases:
  - VideoMME
aliases_note: Epoch's benchmark string; the paper also writes it this way once ("our proposed
  benchmark, VideoMME").
aliases_source: src-epoch-benchmark-data
aliases_quote: VideoMME,False,,,1.0,0.25,1.0,2024-05-31,
tagline: 2,700 four-option questions on 900 YouTube videos from 11 seconds to an hour, answered with
  or without subtitles.
description: >
  A video question-answering benchmark for multimodal LLMs from the Video-MME team, whose authors come
  from Nanjing University and seven other institutions (CVPR 2025). 900 videos with a total of 254
  hours were collected from YouTube across 6 domains (Knowledge, Film & Television, Sports Competition,
  Artistic Performance, Life Record, Multilingual) and 30 subcategories, 300 each of short (under 2
  minutes), medium (4-15 minutes) and long (30-60 minutes) videos. Annotators with research experience
  in vision-language learning watched each whole video and wrote three multiple-choice questions with
  four options, 2,700 in all, over 12 task types from perception to reasoning and synopsis; a second
  annotator reviewed each, and questions that Gemini 1.5 Pro could answer from the text alone were sent
  back for revision. The model receives sampled frames, optionally the subtitles matched to those
  frames (744 videos have them) or the audio, and the question, and answers with a letter; accuracy is
  computed by regular-expression matching with no judge model. The leaderboard reports Overall and per
  length accuracy without and with subtitles; in the paper Gemini 1.5 Pro led at 75.0% and 81.3%. The
  items and answers are public on Hugging Face under academic-use-only terms, and the maintainers score
  model responses e-mailed to them.
self_description:
  source: src-arxiv-2405-21075
  quote: In this paper, we introduce Video-MME, the first-ever full-spectrum, Multi-Modal Evaluation
    benchmark of MLLMs in Video analysis.
external_ids:
  epoch: VideoMME
  huggingface: lmms-eval/Video-MME
  arxiv: '2405.21075'
paper:
  title: 'Video-MME: The First-Ever Comprehensive Evaluation Benchmark of Multi-modal LLMs in Video Analysis'
  arxiv: '2405.21075'
  version_read: v3
  source: src-arxiv-2405-21075-v3
released: 2024-05-31
released_note: The paper's first arXiv version, as the abstract page dates it, and the date Epoch's
  export and the stub carry. The README's launch announcement is dated 2024-06-03.
released_source: src-arxiv-2405-21075
released_quote: Submitted on 31 May 2024 (v1), last revised 30 May 2025 (this version, v3)
release_venue: CVPR 2025
release_venue_source: src-github-video-mme-readme-06c2315
release_venue_quote: '**`2025.02.27`** 🌟 Video-MME has been accepted by CVPR 2025.'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/video-language
  secondary: []
domain_basis:
  reason: Every scored item is a four-option question answered in language about a video, and the
    construction removed questions a model could answer from the text alone, so the score measures
    whether the chosen answer corresponds to the video. That is the correspondence multimodal's
    inclusion test takes and vision's exclusion test hands over; vision/video-understanding's
    distinction sends a video benchmark posed as question answering to video-language even when it
    calls itself video understanding, as this one does. Subtitles and audio enter only as optional
    inputs; nothing is scored inside one modality.
  source: src-arxiv-2405-21075-v3
  quote: filter out QA pairs that can be answered solely based on the textual questions
domain_considered_and_rejected:
  - term: vision/video-understanding
    reason: The paper and README frame the benchmark as video understanding, and the task types
      include action and object recognition, but every task is posed as a multiple-choice question,
      and no score is a label or a temporal segment without language to correspond to.
    source: src-arxiv-2405-21075-v3
    quote: counting problems, action recognition, and temporal perception
  - term: multimodal/audio-language
    reason: Audio is one of the benchmark's advertised input modalities, but it is an optional third
      setting that the paper reports for Gemini 1.5 Pro alone, because most models took no audio;
      the leaderboard has no audio column, and its two headline conditions are frames without and
      with subtitles (see review_checks).
    source: src-arxiv-2405-21075-v3
    quote: Unfortunately, most of the open-source models do not support audio input, so audio
      evaluation is omitted.
  - term: language/long-context
    reason: Long videos come with subtitles averaging about 6.5K words, but the subtitles are an
      optional input matched to the sampled frames, and the scored relation is the answer's
      agreement with the video.
capability:
  - perception
  - temporal-reasoning
  - context-integration
capability_basis:
  perception:
    reason: The model receives sampled frames (and optionally subtitles or audio) and is scored on
      what it recovers from them; the task types span OCR, attribute, object and action recognition,
      counting and temporal perception.
    source: src-arxiv-2405-21075-v3
    quote: these questions encompass 12 distinct task types, including perception, reasoning, and
      information synthesis
  temporal-reasoning:
    reason: Temporal perception and temporal reasoning are among the scored task types, and the
      paper's worked cases need events linked across a video, such as an injury and a reappearance
      24 minutes apart; the evaluation script reports accuracy per task type.
    source: src-arxiv-2405-21075-v3
    quote: and long-range temporal reasoning, making them highly challenging
  context-integration:
    reason: The video, and in the subtitle setting the matched subtitles, supply what determines the
      answer. Questions a strong model answered from the text alone were revised, and that model
      scored under 15% text-only, so the score tests whether the supplied material was used.
    source: src-arxiv-2405-21075-v3
    quote: Gemini 1.5 Pro achieves less than 15% accuracy in the text-only setup
capability_considered_and_rejected:
  - term: memory-retention
    reason: The long subset's median certificate length is 890.7 s, so the needed evidence is spread
      across the video, but the whole sampled video is given at once with the question, and length
      alone is a property of the input, which the term's exclusion rules out. No subset isolates
      retention.
    source: src-arxiv-2405-21075-v3
    quote: our dataset yields a median certificate length of 26s, 164.7s, and 890.7s for short,
      medium and long videos
  - term: spatial-reasoning
    reason: Spatial perception and spatial reasoning are task types, but they are two of twelve,
      reported as breakdowns of one score and not as a subset.
  - term: quantitative-reasoning
    reason: Counting is a task type and the paper's first worked case needs date arithmetic, but the
      scored answer is a lettered option.
  - term: knowledge-recall
    reason: The paper notes that the Knowledge domain benefits most from subtitles and audio, which
      the protocol supplies; nothing is scored on recalled knowledge alone.

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: Each question has four options, A to D, with the correct letter near-uniformly
    distributed, so chance is 25% (Epoch's random baseline is 0.25). The model is told to answer
    with the letter only, which is extracted by regular expression and compared with the key, with
    no judge model.
  source: src-arxiv-2405-21075-v3
  quote: each accompanied by four candidate options, contributing to a total of 2,700 QA pairs
evaluation_method_considered_and_rejected:
  - term: model-graded-judge
    reason: The paper and README both say no external model is used to extract or grade the answer.
    source: src-github-video-mme-readme-06c2315
    quote: The evaluation does not introduce any third-party models, such as ChatGPT.
  - term: exact-match
    reason: The letter is matched exactly, but against a closed set of four supplied options, which
      multiple-choice names.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The subjects are image and video MLLMs prompted directly, each with its own frame
    sampling, with the model's default multiple-choice prompt or the paper's standard one, which
    asks for the letter only. No tools or harness loop are involved.
  source: src-github-video-mme-readme-06c2315
  quote: Respond with only the letter (A, B, C, or D) of the correct option.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: No human baseline is reported in the paper, the README or on the leaderboard.
  - term: reasoning-model
    reason: The protocol sets no reasoning budget, and no leaderboard row names a thinking setting.

as_used:
  - protocol: The long subset alone, or random 200-question samples of it, at a fixed small frame
      budget, reported as Video-MME by long-video method papers.
    split: long videos
    source: src-arxiv-2611-07329
    quote: The same contrasts are unstable at the n=200 subset scale commonly used
    note: The November 2026 audit finds that effects measured on 200-question samples reverse sign
      in 35.8% of resamples, and that injecting speech transcripts before the question adds about 4
      points on Video-MME.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. A November 2026 audit of long-video QA methods runs on
    the full long subset, and the README records frontier model releases reporting it through
    December 2025. The same team's Video-MME-v2 (April 2026) argues that existing video benchmarks
    are saturating, but it is a separate benchmark and has not replaced this one in use (see
    review_checks).
  source: src-arxiv-2611-07329
  quote: On the full Video-MME long bucket (n=900, K=8), no tested selector significantly improves
    over uniform sampling.
activity: accepting-submissions
activity_note: The leaderboard's newest row is dated 2025-09-28 (16 of its 51 rows are from 2025),
  and the README, last changed 2025-12-08, still invites submissions; no row was added in the eleven
  months before this reading.
activity_basis:
  reason: The benchmark has never run in rounds, and the README gives a standing route onto the
    leaderboard, e-mailing model responses in the template's format.
  source: src-github-video-mme-readme-06c2315
  quote: If you want to add your model to our
    [leaderboard](https://video-mme.github.io/home_page.html#leaderboard), please send model
    responses to
  newest_submission: 2025-09-28

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: video-SALMONN 2+ (72B)
    source: src-video-mme-github-io-home-page
    observed_on: 2026-11-10
    quote: video-SALMONN 2+ THU & ByteDance 72B 10 fps 6* 2025-09-28 79.7 81.6
    note: The leaderboard's top row, without and with subtitles.
  - system: Gemini 1.5 Pro
    source: src-arxiv-2405-21075-v3
    observed_on: 2026-11-10
    quote: with video frames as input alone, Gemini 1.5 Pro attains an accuracy of 75%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The annotators' answer key, released with the questions in the Hugging
  Face test split.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The videos, subtitles, questions and answers are on Hugging Face without a gate, and
    scoring is regular-expression matching against the key, so anyone can compute a score. The
    dataset terms restrict use to academic research (execution.reproducibility_blockers).
  source: src-hf-api-lmms-lab-video-mme
  quote: '"gated":false'
task:
  exists: true
  input:
    - frames sampled from a video of 11 seconds to an hour (the number is the model's own setting)
    - optionally the subtitles at the sampled frames' timestamps, or the audio track
    - a question with four lettered options
  output: One option letter.
  scoring: Accuracy over the questions, by regular-expression extraction of the letter, reported
    overall and for short, medium and long videos, without and with subtitles, with breakdowns by
    domain, subcategory and task type.
  source: src-arxiv-2405-21075-v3
  quote: In the subtitle-enabled setting, all models utilize subtitles corresponding to the
    timestamps of the sampled video frames.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The download is ungated, but the README's terms limit use to academic research and
    forbid distributing or modifying the data without approval (dataset_licence).
  access_basis:
    reason: The 2,700 questions, each with its answer field, and the videos and subtitles are public
      in one test split on Hugging Face with no gate. There is no hidden split.
    source: src-hf-api-lmms-lab-video-mme
    quote: '{"name":"answer","dtype":"string"}'
  refresh: versioned-releases
  refresh_note: One dated change since release, on 2024-06-15. The Hugging Face record was last
    modified on 2024-07-04, and no source says what changed then.
  refresh_basis:
    reason: The one change to the items, replacing broken video links and re-annotating those
      videos, is carried by a dated maintainer announcement that a claim can be pinned to.
    source: src-github-video-mme-readme-06c2315
    quote: '**`2024.06.15`** 🌟 We have refreshed our evaluation: 1) replace broken and potentially broken
      video links, and re-annotated them'
  data_provenance:
    - web-scraped
    - expert-authored
  data_provenance_note: The videos were collected from YouTube along a domain hierarchy the team set
    up, with their subtitles and audio; the questions and options were written for the benchmark by
    annotators with research experience in vision-language learning, which the paper calls expert
    annotation, and reviewed by a second annotator.
  data_provenance_source: src-arxiv-2405-21075-v3
  data_provenance_quote: recruit annotators with strong English proficiency and extensive research
    experience in vision-language learning
  contamination_risk: medium
  contamination_risk_note: The videos are public on YouTube and the questions and answers have been
    public on Hugging Face since June 2024, so a training route is plausible; no source read
    evidences one. The text-only filter guards against answering from the question, not against
    training on the items.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No human baseline is reported in the paper, the README or on the
    leaderboard; the top row scores 81.6% with subtitles.
  dataset_licence: Academic research use only, no commercial use, no distribution or modification
    without prior approval (the README's terms; no named licence)
  dataset_licence_note: The README also states that the videos' copyright stays with their owners.
    The Hugging Face record carries no licence tag.
  dataset_licence_source: src-github-video-mme-readme-06c2315
  dataset_licence_quote: Video-MME is only used for academic research. Commercial use in any form is
    prohibited.
  size:
    - count: 2700
      unit: four-option multiple-choice questions, three per video
      source: src-arxiv-2405-21075-v3
      quote: annotate a set of 2,700 high-quality multiple-choice questions (3 per video)
    - count: 900
      unit: videos, 254 hours in total, all with audio
      subset: all
      source: src-arxiv-2405-21075
      quote: 900 videos with a total of 254 hours are manually selected and annotated by repeatedly
        viewing all the video content, resulting in 2,700 question-answer pairs.
    - count: 744
      unit: videos with subtitles (every long video has them)
      subset: with subtitles
      source: src-github-video-mme-readme-06c2315
      quote: There are a total of **900 videos** and **744 subtitles**, where all long videos have
        subtitles.
    - count: 2700
      unit: test questions on Hugging Face (one split)
      subset: Hugging Face release
      source: src-hf-api-lmms-lab-video-mme
      quote: '"num_examples":2700'
  languages:
    - en
  languages_note: The questions and options are in English, written by annotators chosen for their
    English; the Multilingual domain's videos are in other languages.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Video-MME team (the MME-Benchmarks organisation on GitHub)
  maintainer_basis:
    reason: The project page is signed by the Video-MME Team, and the README points its evaluation
      pipeline at the MME-Benchmarks organisation's repository, which also holds the team's other
      MME benchmarks. The paper's authors are from Nanjing University, which leads the project, the
      State Key Laboratory of Cognitive Intelligence, XMU, HKU, PKU, CUHK, ECNU and CASIA. The data
      is served from the LMMS-Lab Hugging Face account.
    source: src-video-mme-github-io-home-page
    quote: Video-MME Team arXiv GitHub
  maintainer_type: community-collective
  maintainer_type_note: The repository sits in a shared organisation account and the authors come
    from nine institutions, with no single holder stated. academic-lab was considered, since every
    affiliation is a university or academy and the project leader's is Nanjing University, but the
    term's exclusion sends a shared multi-institution account here; MMMU's entry has the same type.
  submission_process:
    - maintainer-scored-predictions
    - maintainer-run
  submission_process_note: Entrants e-mail model responses in the template's JSON format and the
    maintainers score them against the public key; the scoring script is public. The rows dated
    2024-06-15 are the paper's own baselines, run by the maintainers with each model's frame
    setting.
  submission_process_source: src-github-video-mme-readme-06c2315
  submission_process_quote: If you want to add your model to our
    [leaderboard](https://video-mme.github.io/home_page.html#leaderboard), please send model
    responses to
  independence_flags: []
  independence_flags_note: No flag is set. The paper evaluates VITA-1.0 and VITA-1.5, and the
    leaderboard lists both under Tencent Youtu Lab & NJU. Whether those models' authors are
    Video-MME's rests only on comparing two author lists, which no quoted passage states, so
    maintainer-competes-on-own-benchmark is left unset and raised as a review check (as on mmau).
    The paper's funding is a National Natural Science Foundation of China grant, so
    funded-by-evaluated-party is not tagged.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The leaderboard ranks closed models served through APIs (Gemini 1.5 Pro, GPT-4o, Claude
      3.5 Sonnet) beside open weights, and the protocol mandates no hardware; serving open weights
      on GPUs is the entrant's choice.
    source: src-video-mme-github-io-home-page
    quote: while the long videos are sampled at 0.5 fps to ensure the stability of the API
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Items and answers are public and scoring is regular-expression matching with no judge,
      so the headline score needs no human or maintainer-only step. The licence restricts use
      (blockers).
    source: src-arxiv-2405-21075-v3
    quote: comparing it directly with the ground-truth answer, without relying on external judges
      like commonly-used ChatGPT
  reproducibility_blockers:
    - licence-restriction
  reproducibility_blockers_note: The dataset terms forbid commercial use in any form, so a company
    evaluating its own model, as the README's news items say frontier developers have, may need the
    maintainers' approval; the terms do not say whether evaluation counts as use.
  harness_availability: official-harness
  harness: eval_your_results.py, linked from the README, with the repository's output template
    (evaluation/output_test_template.json)
  harness_note: The script is held in a separate personal GitHub account and linked at its main
    branch, not pinned, and was not read. VLMEvalKit and LMMs-Eval also implement the benchmark and
    are named in the README.
  harness_source: src-github-video-mme-readme-06c2315
  harness_quote: please refer to the evaluation script
    [eval_your_results.py](https://github.com/thanku-all/parse_answer/blob/main/eval_your_results.py),
    and you will get the accuracy scores across video_durations, video domains, video subcategories,
    and task types.
  code_licence: null
  code_licence_note: GitHub's licence metadata for MME-Benchmarks/Video-MME reports none (read
    2026-11-10; last pushed 2025-12-08), and the scoring script's licence was not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the llm-static-text profile: which condition and subset (without or with subtitles; overall or one
  # length), and the prompt (the paper's standard prompt or a model's own default). The number of frames sampled,
  # which the leaderboard lists per row (4 to 1 fps), and whether audio was given, move the score but have no
  # EvalConditions field; they belong in a claim's notes.
  material_extra:
    - subset_used
    - prompt_template_hash
aggregation_policy: official-aggregate
aggregation_policy_note: Overall is accuracy over all 2,700 questions, one figure per subtitle
  condition. No figure combines the two conditions; the leaderboard sorts by the with-subtitles
  Overall, and Epoch's mapping reads the without-subtitles one.
aggregation_policy_basis:
  reason: The leaderboard gives an Overall column beside the per-length columns, under each subtitle
    condition.
  source: src-video-mme-github-io-home-page
  quote: By default, this leaderboard is sorted by results with subtitles.


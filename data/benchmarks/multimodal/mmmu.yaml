# data/benchmarks/multimodal/mmmu.yaml
#
# P1-S3-T01, checkpoint entry 10 of 10 (copilot off). Filled from MMMU's paper, arXiv 2311.16502 read as its v4
# PDF (2024-06-13), and its abstract page; the project site and the repository README; EvalAI's record of the
# test server; and the abstract of FocusVTC (arXiv 2609.36651), a 2026 result. Every quote below is checked by
# the quote-substring validator against those Sources' committed extracts.
#
# MMMU only. MMMU-Pro (2024) and Video-MMMU are derived benchmarks by overlapping authors, each its own entry.

id: mmmu
name: MMMU
aliases:
  - Massive Multi-discipline Multimodal Understanding and Reasoning Benchmark
tagline: 11.5K college-level questions with images across 30 subjects, for multimodal models'
  expert-level perception and reasoning.
description: >
  11.5K questions with interleaved images, collected from college exams, quizzes and textbooks across
  six disciplines, 30 subjects and 183 subfields. There are 30 image types, among them charts, diagrams,
  maps, music sheets and chemical structures. Most questions are multiple-choice and the rest short open-ended
  answers, scored zero-shot by rule-based extraction and micro-averaged accuracy. The split is 150 development,
  900 validation and 10,500 test questions. Test answers were withheld behind an EvalAI server until it
  closed on 2026-02-11; the maintainers released them the next day. The leaderboard lists human experts
  (college seniors) beside the models.
self_description:
  source: src-mmmu-benchmark-site
  quote: 'We introduce MMMU: a new benchmark designed to evaluate multimodal models on massive multi-discipline
    tasks demanding college-level subject knowledge and deliberate reasoning'
external_ids:
  arxiv: '2311.16502'
paper:
  title: 'MMMU: A Massive Multi-discipline Multimodal Understanding and Reasoning Benchmark for Expert
    AGI'
  arxiv: '2311.16502'
  version_read: v4
  source: src-arxiv-2311-16502-v4
released: 2023-11-27
released_note: The paper's first arXiv version, as the abstract page dates it (CVPR 2024).
released_source: src-arxiv-2311-16502
released_quote: Submitted on 27 Nov 2023

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/visual-qa
  secondary:
    - general-intelligence/multi-subject-knowledge-exams
domain_basis:
  reason: Each item is a question about images whose answer depends on the image and the question
    together. The benchmark's own claim is breadth across thirty college subjects, which is
    ADR-0015's subdomain.
  source: src-mmmu-benchmark-site
  quote: These questions span 30 subjects and 183 subfields, comprising 30 highly heterogeneous
    image types
capability:
  - perception
  - knowledge-recall
capability_basis:
  perception:
    reason: Answering needs reading heterogeneous images (charts, diagrams, music sheets, chemical
      structures), and the benchmark names perception as one of its three target skills.
    source: src-mmmu-benchmark-site
    quote: 'MMMU is designed to measure three essential skills in LMMs: perception, knowledge, and reasoning'
  knowledge-recall:
    reason: The protocol supplies the question and its images only; the subject knowledge the answer
      needs is what the model brings.
    source: src-arxiv-2311-16502-v4
    quote: Our evaluation is conducted under a zero-shot setting
capability_considered_and_rejected:
  - term: quantitative-reasoning
    reason: Many science and engineering items need calculation, but the benchmark's claim and score
      are across all subjects, and no quantitative subset is scored on its own.

evaluation_method:
  - multiple-choice
  - exact-match
evaluation_method_basis:
  reason: Multiple-choice items are scored against the keyed option, and open questions by
    rule-based extraction matched to the answer, with micro-averaged accuracy over both.
  source: src-arxiv-2311-16502-v4
  quote: For both open and multiple-choice questions, we design systematic, rule-based evaluation
    pipelines
designed_for_subjects:
  - instruction-tuned-model
  - human-expert
designed_for_subjects_basis:
  reason: Models are prompted zero-shot with each model's default prompt. The leaderboard also
    scores human experts (college seniors in each subject) under the same questions, which
    human-expert's test admits.
  source: src-arxiv-2311-16502-v4
  quote: We involve 90 college senior students, selected to represent a wide range of experts in the
    corresponding 30 subjects

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced in 2026, for example a September 2026 paper reporting
    MMMU accuracy alongside MME. The maintainers added a third-party evaluation workflow in July
    2026.
  source: src-arxiv-2609-36651
  quote: General multimodal capabilities are preserved, with MMMU increasing from 65.12 to 66.73
activity: closed
activity_note: EvalAI's record of challenge 2179 (src-evalai-mmmu-challenge-2179) gives the server's
  end date.
activity_basis:
  reason: The test server was the route for outside results, and it ended on 2026-02-11. The test
    answers were released the next day, so test scores are now computed locally, and the site's
    leaderboard was last updated 2025-09-05. No route for entering results is open.
  source: src-github-mmmu-readme
  quote: We have released the answers for the MMMU test set! You can now evaluate your models on the
    test set locally!

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4V
    source: src-mmmu-benchmark-site
    observed_on: 2026-10-10
    quote: Even the advanced GPT-4V only achieves a 56% accuracy
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The answer key from the source material; for the test split it was held by
  the maintainers until 2026-02-12.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Questions, images and, since February 2026, all answers are public, with the maintainers'
    evaluation code.
  source: src-github-mmmu-readme
  quote: We have released a full suite comprising 150 development samples, 900 validation samples,
    and 10,500 test samples.

task:
  exists: true
  input:
    - a question with one or more interleaved images, and for multiple-choice items the options
  output: An option letter, or a short open answer.
  scoring: Micro-averaged accuracy, zero-shot, with rule-based answer extraction; validation and
    test reported separately.
  source: src-arxiv-2311-16502-v4
  quote: We adopt micro-averaged accuracy as the evaluation metric

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Since 2026-02-12 every split, answers included, is public. Before that the test answers
      were held behind the server (train-open-test-held-out); access_by_phase was not used because
      the change is one dated event.
    source: src-github-mmmu-readme
    quote: We have released the answers for the MMMU test set! You can now evaluate your models on
      the test set locally!
  refresh: static
  refresh_basis:
    reason: The questions and splits have not changed since release; the answer release changed
      access, not content. MMMU-Pro is a separate benchmark.
    source: src-github-mmmu-readme
    quote: We have released a full suite comprising 150 development samples, 900 validation samples,
      and 10,500 test samples.
  data_provenance:
    - exam-derived
  data_provenance_note: Questions were collected by college students (coauthors among them) from
    exams, quizzes, textbooks, lecture material and online sources, with new questions written where
    needed. Annotators were told to prefer questions without readily available answers.
  data_provenance_source: src-mmmu-benchmark-site
  data_provenance_quote: The questions in our benchmark were manually collected by a team of college
    students (including coauthors) from various disciplines and subjects, drawing from online
    sources, textbooks, and lecture materials
  contamination_risk: high
  contamination_risk_note: The test split, which papers report, has had public answers since
    2026-02-12, and the validation split always had them. Questions drawn from online sources and
    textbooks may also predate the benchmark on the web. The route into the scored test split is the
    answer release itself.
  contamination_evidence:
    - source: src-github-mmmu-readme
      stance: supports
      quote: We have released the answers for the MMMU test set!
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_note: Human Expert (low, medium, high) rows on the leaderboard, from 90
    college seniors, three per subject, answering their own subject's questions.
  size_note: 11.5K questions -- 150 development, 900 validation, 10,500 test.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The MMMU team (authors from The Ohio State University, the University of Waterloo and
    others)
  maintainer_basis:
    reason: The site presents the work as the MMMU Team's, and the code and data sit in the
      MMMU-Benchmark and MMMU organisation accounts, with corresponding authors at two universities.
    source: src-github-mmmu-readme
    quote: This repo contains the evaluation code for the paper
  maintainer_type: community-collective
  maintainer_type_note: A shared organisation account across institutions with no single holder
    stated (academic-lab's exclusion test).
  submission_process:
    - held-out-server
  submission_process_note: Until 2026-02-11, outside test results came through EvalAI. Since the
    answer release, test scores are computed by whoever reports them, and no submission route is
    open (activity closed).
  submission_process_source: src-mmmu-benchmark-site
  submission_process_quote: Our evaluation server for the test set is now available on EvalAI
  independence_flags: []
  independence_flags_note: None recorded.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: With the test answers public, anyone can compute the headline test score with the
      released pipeline, with no maintainer-only step.
    source: src-github-mmmu-readme
    quote: You can evaluate your models locally using `answer_dict_test.json` with the same pipeline
      as for the validation set
  harness_availability: official-harness
  harness: MMMU evaluation code (the repository's mmmu folder)
  harness_source: src-github-mmmu-readme
  harness_quote: Please refer to our evaluation folders for detailed information on evaluating with
    both MMMU and MMMU-Pro benchmarks
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for MMMU-Benchmark/MMMU, read 2026-10-10; not a
    quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the split (validation or test; the paper and leaderboard report both) and
  # whether chain-of-thought prompting was used, which later work varies freely.
  material_extra:
    - subset_used
    - chain_of_thought

homepage: https://mmmu-benchmark.github.io/
repository: https://github.com/MMMU-Benchmark/MMMU
dataset_url: https://huggingface.co/datasets/MMMU/MMMU
leaderboard_url: https://mmmu-benchmark.github.io/#leaderboard

tags:
  - multimodal
  - college-exams
  - visual-question-answering
  - expert-knowledge

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S3-T01)
  added_on: 2026-10-10
  last_verified: 2026-10-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2311-16502-v4
    - src-arxiv-2311-16502
    - src-mmmu-benchmark-site
    - src-github-mmmu-readme
    - src-evalai-mmmu-challenge-2179
    - src-arxiv-2609-36651
  sources_note: >
    The paper's v4 PDF (a DOI, not archived) read as text; the abstract page for the date; the site with
    scripts and styles stripped and the README at main, both with narrow windows that keep the contact
    addresses out; EvalAI's challenge record for the server's end; and FocusVTC's abstract page (2026)
    as evidence of current use.
  confidence: medium
  notes: |
    Reviewer checks:
    - activity closed: whether the site's leaderboard still adds self-reported test scores after the answer
      release (last updated 2025-09-05 when read).
    - ceiling_anchor_type expert-average: the "experts" are college seniors in the subject.

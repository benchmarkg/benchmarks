# data/benchmarks/multimodal/docvqa.yaml
#
# P1-S8-T05, vision entry 5 of 8, filed under multimodal/ because its domain.primary is multimodal/visual-qa (see
# domain_basis and the first review check). Filled from the DocVQA paper, arXiv 2007.00398 read as its v3 PDF
# (2021-01-05, WACV 2021), and its abstract page; the DocVQA Challenge 2020 report (arXiv 2008.08899, v2 PDF) and
# the ICDAR 2021 competition report (arXiv 2111.05547, v1 PDF); five pages of docvqa.org (home, datasets, the
# DocVQA dataset, Challenge 2020, Challenge 2026); NEXT (arXiv 2607.24789, June 2026), a paper that reports a
# DocVQA leaderboard result; and the Amazon Nova technical report (arXiv 2506.12103). The Robust Reading
# Competition portal (rrc.cvc.uab.es), which hosts the data and the leaderboard, disallows every agent in its
# robots.txt and was not read. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# DocVQA only, the single-page dataset of the 2020 challenge's Task 1. The DocVQA project's other datasets
# (Document Collection VQA, InfographicVQA, Multipage DocVQA) and the ICDAR 2026 competition are not included.

id: docvqa
name: DocVQA
aliases:
  - Document Visual Question Answering
  - Single Document VQA
tagline: 50,000 questions on 12,767 scanned industry-document pages, answered with text from the
  page and scored by ANLS.
description: >
  Visual question answering on document images. 50,000 questions are posed on 12,767 page images
  from 6,071 documents of the UCSF Industry Documents Library (tobacco, food, drug, fossil fuel
  and chemical industries, 1900 to 2018): letters, forms, tables, reports and figures in
  typewritten, printed, handwritten and born-digital text. Remote workers wrote up to ten
  questions per page and copied the answers verbatim from it, so the task is extractive, and each
  question carries one or more of nine types (form, table/list, layout, figure, handwritten and
  others). The split is random, 80-10-10: 39,463 train, 5,349 validation and 5,188 test
  questions, with commercial OCR transcriptions of every page. The score is ANLS, average
  normalised Levenshtein similarity to the accepted answers, so a near-miss caused by an OCR error
  keeps partial credit; accuracy is reported beside it. Test answers are withheld and results are
  uploaded to the Robust Reading Competition portal, whose ranking has stayed open since the CVPR
  2020 challenge. Volunteers reached 0.981 ANLS on test; a June 2026 paper reports 0.9728 for its
  8B model, the best single-model entry on the leaderboard, with a multi-agent system above it.
self_description:
  source: src-arxiv-2007-00398-v3
  quote: We present a new dataset for Visual Question Answering (VQA) on document images called
    DocVQA.
external_ids:
  arxiv: '2007.00398'
paper:
  title: 'DocVQA: A Dataset for VQA on Document Images'
  arxiv: '2007.00398'
  version_read: v3
  source: src-arxiv-2007-00398-v3
released: 2020-07-01
released_note: The paper's first arXiv version, as its abstract page dates it. The data was out
  before it, for the CVPR 2020 challenge, which ran between March and May 2020
  (src-arxiv-2008-08899-v2).
released_source: src-arxiv-2007-00398
released_quote: Submitted on 1 Jul 2020
release_venue: WACV 2021
release_venue_source: src-arxiv-2007-00398
release_venue_quote: accepted at WACV 2021

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/visual-qa
  secondary:
    - vision/document-understanding
domain_basis:
  reason: Each item is a natural-language question about a document image, scored on the answer
    given in language. vision's exclusion test sends a question answered about an image to
    multimodal, and document-understanding's not_to_be_confused_with makes a document-image
    benchmark posed as questions visual-qa, with document-understanding secondary. The documents'
    layout, forms, tables and handwriting are what the questions test, which is the secondary's
    case.
  source: src-arxiv-2007-00398-v3
  quote: an intelligent reading system is expected to respond to ad-hoc requests for information,
    expressed in natural language questions by human
domain_considered_and_rejected:
  - term: vision/ocr-handwriting
    reason: Answers are read from printed and handwritten text, but the score is the answer to a
      question, not a transcription of the page.
  - term: multimodal/chart-diagram-understanding
    reason: Figure questions are one of nine question types on pages where running text dominates.
      The project's dataset built for infographics and charts is InfographicVQA, which this entry
      does not include.
    source: src-arxiv-2111-05547-v1
    quote: The Infographics VQA task is a newly introduced task for the 2021 edition.
capability:
  - perception
  - context-integration
capability_basis:
  perception:
    reason: The input is a page image, and answering needs its printed, typewritten and handwritten
      text read in the context of layout, tick boxes, tables and figures; the paper's best models
      lose answers to OCR errors.
    source: src-arxiv-2007-00398-v3
    quote: reading systems should not only extract and interpret the textual (handwritten,
      typewritten or printed) content of the document images
  context-integration:
    reason: The supplied page holds the answer, copied verbatim from it, and the score is whether
      the system took the right span from that material.
    source: src-arxiv-2007-00398-v3
    quote: Workers were instructed to ask questions which can be answered using text present in the
      image and to enter the answer verbatim from the document.
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: The answer is on the page the protocol supplies, so nothing is answered from what the
      system already holds.
  - term: grounding
    reason: Only the answer string is scored; no source scores whether a question was attached to
      the right region of the page.

evaluation_method:
  - reference-metric
evaluation_method_basis:
  reason: ANLS is a normalised Levenshtein (edit-distance) similarity to the accepted answers, a
    fixed-formula string similarity of the same kind as word error rate, chosen so that small OCR
    mismatches keep partial credit. It was proposed for scene-text VQA and is not specific to a
    scientific field, so it is not domain-metric.
  source: src-arxiv-2007-00398-v3
  quote: Since no OCR is perfect, we propose to use ANLS as our primary evaluation metric
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Accuracy, an exact match against any accepted answer, is reported beside ANLS, but ANLS
      is the primary metric and the one the 2020 challenge and the leaderboard rank by, and it gives
      partial credit.
    source: src-arxiv-2007-00398-v3
    quote: The Accuracy metric measures percentage of questions for which the predicted answer
      matches exactly with any of the target answers for the question.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The dataset was built for models trained on its 39,463 training questions. The paper's
    baselines are scene-text VQA models (LoRRA, M4C) and BERT readers fine-tuned on DocVQA, and the
    2020 entrants were OCR pipelines with fine-tuned QA models. Document QA is a general perception
    and language task, not a discipline.
  source: src-arxiv-2007-00398-v3
  quote: In this section we explain the baselines we use, including heuristics and trained models.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: Today's leaderboard rows are general vision-language models prompted with the question
      (observed_subjects), but the benchmark was designed in 2020 for models trained on its own
      split.
observed_subjects:
  values:
    - instruction-tuned-model
    - multi-agent-system
  basis: The leaderboard entries a June 2026 paper compares against (as of January 2026) are general
    vision-language models, among them Qwen3-VL, Seed-VL-1.5, Qwen2-VL and MiMo-VL-7B-RL, and the
    paper notes a higher-scoring multi-agent system at the top of the public board.
  source: src-arxiv-2607-24789-v1
as_used:
  - protocol: General multimodal models prompted zero-shot with the question, asking for a single
      word or phrase, and reported as test ANLS in the developer's own technical report, not trained
      for the task as the design assumed.
    split: test, as labelled
    source: src-arxiv-2506-12103-v1
    quote: Unless otherwise noted, all evaluations are 0-shot
    note: Amazon's Nova report (March 2025) gives Nova Pro 93.5 and Nova Lite 92.4 ANLS in a column
      labelled test, but describes the benchmark with 5,349 questions ('The 5,349 questions contain
      images from a diverse set of documents'), the validation split's count; the test split has
      5,188. Its table also marks some comparison rows as using an external OCR.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. A June 2026 paper reports a new DocVQA test result
    through the official leaderboard and compares it with the board's model entries as of January
    2026.
  source: src-arxiv-2607-24789-v1
  quote: We compare NEXT-8B against public DocVQA leaderboard model entries as of January 2026.
activity: leaderboard-live-no-round
activity_note: The Challenge 2020 page says the same ('the challenge is open to submissions post the
  challenge period', src-docvqa-challenge-2020-site), and the June 2026 paper scored its model on
  the official leaderboard. The RRC pages themselves were not read (robots.txt), so the board's
  current state was not observed directly. DocVQA2026, a separate ICDAR 2026 competition on new
  data, closed for results on 2026-04-03 (src-docvqa-challenge-2026-site).
activity_basis:
  reason: DocVQA ran competition rounds at CVPR 2020 and ICDAR 2021, and after each the maintainers
    kept the RRC ranking open for out-of-competition submissions. No round on this dataset is open.
  source: src-arxiv-2111-05547-v1
  quote: but the challenge will remain open for new, out-of-competition, submissions

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: NEXT-8B
    source: src-arxiv-2607-24789-v1
    observed_on: 2026-10-14
    quote: NEXT-8B reaches 97.28% ANLS, the best single-model DocVQA result and second overall
      behind a multi-agent system
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Answers written by remote workers, checked by a second worker and, where
  they disagreed, reviewed by the authors; the test answers are held by the maintainers.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone who registers on the RRC portal can download the test images and questions, run a
    system and submit to the standing ranking, which scores every submission automatically; the
    validation answers are public for local scoring.
  source: src-arxiv-2111-05547-v1
  quote: All submitted results are evaluated automatically

task:
  exists: true
  input:
    - one scanned document page, with the dataset's commercial OCR transcription of it
    - a natural-language question about the page
  output: A short answer string, in practice a span of the page's text.
  scoring: ANLS over the 5,188 test questions against each question's list of accepted answers,
    case-insensitive (src-docvqa-challenge-2020-site), computed by the RRC portal; accuracy as a
    secondary figure.
  source: src-arxiv-2008-08899-v2
  quote: Answer to the question is always text present in the image, or in other words it is an
    extractive QA task.

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: Images, questions and OCR for every split, and the answers for train and validation,
    are downloaded from the RRC portal after logging in, under terms on its download page that could
    not be read (see review_checks). The login is a lesser layer under train-open-test-held-out's
    precedence.
  access_basis:
    reason: The test images and questions are distributed and their answers withheld, so test scores
      come only from the portal.
    source: src-arxiv-2607-24789-v1
    quote: Results are evaluated on the held-out test set via the official leaderboard using Average
      Normalized Levenshtein Similarity (ANLS).
  refresh: static
  refresh_basis:
    reason: The 2026 description gives the same 50,000 questions on 12,767 images as the 2020 paper,
      and the ICDAR 2021 report says the single-document task's setup was not changed from 2020. The
      later datasets came as separate tasks, not as revisions of this one.
    source: src-arxiv-2607-24789-v1
    quote: DocVQA [8] contains over 50,000 questions on 12,767 document images.
  data_provenance:
    - curated-public-database
    - crowd-authored
  data_provenance_note: Pages were hand-picked from the UCSF Industry Documents Library, an archive
    of industry records compiled for other purposes, favouring pages with tables, forms, lists and
    figures and avoiding badly binarised scans. Questions and answers were written by remote workers
    through a web tool, verified by a second worker, and reviewed by the authors where the two
    disagreed ('Questions and answers on the selected document images are collected with the help of
    remote workers, using a Web based annotation tool', same Source).
  data_provenance_source: src-arxiv-2007-00398-v3
  data_provenance_quote: Images in the dataset are sourced from documents in UCSF Industry Documents
    Library
  contamination_risk: medium
  contamination_risk_note: The test images and questions are distributed, the source documents are
    public in the UCSF library, and the train and validation answers are public; the test answers
    are withheld. Models are now post-trained on mixtures of document-QA corpora, and whether any
    carries DocVQA test answers is not assessed by any source read.
  contamination_evidence: []
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: A few volunteers from the authors' institution answered every test
    question, scoring 0.981 ANLS and 94.36% accuracy; the leaderboard's human row is 98.11 in the
    June 2026 paper's table. The paper does not describe them as recruited for document expertise.
  ceiling_anchor_type_source: src-arxiv-2007-00398-v3
  ceiling_anchor_type_quote: we collect answers for all questions in test split, with help a few
    volunteers from our institution
  dataset_licence: null
  dataset_licence_note: No licence is stated on docvqa.org or in the papers read. The RRC download
    page's terms and conditions could not be read (robots.txt).
  size:
    - count: 50000
      unit: questions
      subset: all splits
      source: src-arxiv-2007-00398-v3
      quote: The DocVQA comprises 50, 000 questions framed on 12, 767 images
    - count: 12767
      unit: document page images
      subset: all splits
      source: src-arxiv-2007-00398-v3
      quote: The DocVQA comprises 50, 000 questions framed on 12, 767 images
    - count: 5188
      unit: questions on 1,287 images
      subset: test
      source: src-arxiv-2007-00398-v3
      quote: the test split has 5, 188 questions and 1, 287 images
    - count: 5349
      unit: questions on 1,286 images
      subset: validation
      source: src-arxiv-2007-00398-v3
      quote: the validation split has 5, 349 questions and 1, 286 images
    - count: 39463
      unit: questions on 10,194 images
      subset: train
      source: src-arxiv-2007-00398-v3
      quote: The train split has 39, 463 questions and 10, 194 images

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The DocVQA team (Computer Vision Center, Universitat Autònoma de Barcelona, with CVIT,
    IIIT Hyderabad)
  maintainer_basis:
    reason: The data, the submissions and the ranking are on the Robust Reading Competition portal
      at rrc.cvc.uab.es, the Computer Vision Center's. The same organisers from CVC and IIIT
      Hyderabad ran the 2020 and 2021 rounds, and CVC's group runs the 2026 competition.
    source: src-arxiv-2111-05547-v1
    quote: The Challenge is hosted at the Robust Reading Competition (RRC) portal
  maintainer_type: academic-lab
  maintainer_type_note: community-collective was considered, since the team spans two institutions,
    but the portal that holds the data and the ranking is one research centre's. conference-workshop
    was considered, but the organising team did not re-form between the CVPR 2020 and ICDAR 2021
    rounds.
  submission_process:
    - held-out-server
  submission_process_note: Participants register on the RRC portal and upload a results file for the
    test questions, which the portal scores against the withheld answers; authors choose which
    submissions appear in the public ranking. By the end of 2021 Task 1 had received more than 750
    submissions from 44 users, 28 of them public (src-arxiv-2111-05547-v1).
  submission_process_source: src-arxiv-2111-05547-v1
  submission_process_quote: All submitted results are evaluated automatically
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-arxiv-2007-00398-v3
      quote: We thank Amazon for supporting the annotation effort
    - flag: prize-sponsored-by-industry
      source: src-docvqa-challenge-2020-site
      quote: The first prize winners under each task were awarded a cash prize of USD 1000,
        sponsored by Amazon AWS
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2607-24789-v1
      quote: Results are evaluated on the held-out test set via the official leaderboard
  independence_flags_note: Amazon supported the annotation and the project through an AWS Machine
    Learning Research Award (paper; src-docvqa-site), and Amazon's Nova models are scored on DocVQA
    in Amazon's own technical report (src-arxiv-2506-12103-v1). Amazon AWS sponsored the 2020 cash
    prizes. docvqa.org lists R. Manmatha, a 2020 organiser, at Amazon. The maintainers hold the test
    answers and the portal scores every test submission.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline is test ANLS, which only the RRC portal can compute because the maintainers
      hold the test answers. Validation ANLS can be computed by anyone from the public answers.
    source: src-arxiv-2607-24789-v1
    quote: Results are evaluated on the held-out test set via the official leaderboard
  reproducibility_blockers:
    - private-test-set
  harness_availability: null
  harness_availability_note: Left null. The paper says code is at docvqa.org, but none of the
    docvqa.org pages read links DocVQA code or an ANLS scorer, and the RRC pages, where the official
    score is computed, could not be read.
  submission_channel:
    source: src-arxiv-2008-08899-v2
    quote: The challenge is open for continuous submission at the Robust Reading Competition (RRC)
      portal
  submission_channel_note: rrc.cvc.uab.es/?ch=17, Task 1; the docvqa.org pages link the same
    challenge page.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the split (test through the portal, or validation scored locally, which some
  # reports label test), whether the system was trained on DocVQA's train split or prompted zero-shot, and whether
  # it read the page itself or used the supplied or an external OCR.
  material_extra:
    - subset_used
    - training_data_policy
    - tools_allowed

homepage: https://www.docvqa.org/
dataset_url: https://rrc.cvc.uab.es/?ch=17&com=downloads
leaderboard_url: https://rrc.cvc.uab.es/?ch=17

tags:
  - document-vqa
  - visual-question-answering
  - document-understanding
  - ocr
  - leaderboard

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2007-00398-v3
    - src-arxiv-2007-00398
    - src-arxiv-2008-08899-v2
    - src-arxiv-2111-05547-v1
    - src-docvqa-site
    - src-docvqa-datasets-site
    - src-docvqa-datasets-docvqa-site
    - src-docvqa-challenge-2020-site
    - src-docvqa-challenge-2026-site
    - src-arxiv-2607-24789-v1
    - src-arxiv-2506-12103-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, and its abstract page for the date and venue;
    the 2020 challenge report and the ICDAR 2021 competition report as PDFs; five docvqa.org pages
    (Google Sites) with scripts and styles stripped, their windows keeping the site's contact address
    out; NEXT's v1 PDF as evidence of current use and of the gap to the human row; and the Amazon Nova
    report's v1 PDF for how vendors report the benchmark. The RRC portal disallows all agents in its
    robots.txt, so none of its pages was fetched.
  confidence: medium
  review_checks:
    - check: The assignment placed this entry at data/benchmarks/vision/docvqa.yaml. It is filed
        under multimodal/ because vision's exclusion test and document-understanding's
        not_to_be_confused_with make a document-image benchmark posed as questions
        multimodal/visual-qa, and the placement check requires the primary's family directory.
      field: domain
    - check: The entry is the DocVQA dataset (RRC challenge 17, Task 1) only. The same RRC challenge
        page also ranks Document Collection VQA, InfographicVQA (its own WACV 2022 paper) and
        Multipage DocVQA, and DocVQA2026 is a new dataset on its own RRC challenge. Whether any of
        them should be a subset or edition here rather than an entry of its own.
      field: description
      source: src-docvqa-datasets-docvqa-site
      quote: This dataset is the first dataset we introduced as part of the DocVQA project and
        consequently it is called the DocVQA dataset.
    - check: The RRC portal (rrc.cvc.uab.es) robots.txt disallows every agent, so none of its pages
        was read. The maintainers' own statement that test answers are withheld, the current
        leaderboard rows (the human row, the multi-agent system at the top), the download terms and
        any dataset licence, and the scorer are therefore unverified; access, activity and the
        licence rest on the papers and docvqa.org. The download needs a portal login.
      field: data.access
      source: src-docvqa-datasets-site
      quote: You must login to the portal before downloading.
    - check: refresh static rests on unchanged counts from 2020 to 2026 and the ICDAR 2021 report.
        The Stage 3 corpus record of the RRC pages mentions question types released in 2023 and an
        undated list of ambiguous test questions excluded from scoring; if that list exists, refresh
        is versioned-releases or rolling-live.
      field: data.refresh
    - check: funded-by-evaluated-party rests on Amazon funding the annotation and Amazon's Nova
        models being scored on DocVQA in Amazon's own report. Whether a vendor's self-reported
        scores make it an evaluated party; R. Manmatha, listed at Amazon on docvqa.org, co-organised
        the 2020 challenge.
      field: governance.independence_flags
      source: src-docvqa-site
      quote: R. Manmatha Amazon
    - check: single-evaluator-private-test-set is tagged for public test inputs with private answers
        scored by the maintainer's server. COCO's entry has the same arrangement and records no
        flag; one of the two should change.
      field: governance.independence_flags
    - check: harness_availability is null. The paper says code is available at docvqa.org, but no
        code or scorer is linked from the site pages read.
      field: execution.harness_availability
      source: src-arxiv-2007-00398-v3
      quote: The dataset, code and leaderboard are available at docvqa.org
    - check: Headroom is nearly gone. The best single model is 0.83 ANLS points under the human row
        and a multi-agent system ranks above it; lifecycle saturated is derived, so the human row
        may be worth a Baseline record.
      field: lifecycle
      source: src-arxiv-2607-24789-v1
      quote: closes the gap to human performance (98.11%) to 0.83 ANLS points

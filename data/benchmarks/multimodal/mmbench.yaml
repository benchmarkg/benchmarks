curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2307-06281-v5
    - src-arxiv-2307-06281-v3
    - src-arxiv-2307-06281
    - src-github-mmbench-readme-8eaac9a
    - src-hf-api-opencompass-mmbench
    - src-hf-api-space-open-vlm-leaderboard
    - src-hf-space-open-vlm-leaderboard-meta-data
    - src-hf-space-open-vlm-leaderboard-gen-table
    - src-opencompass-openvlm-json
    - src-github-vlmevalkit-image-mcq-68f427d
    - src-arxiv-2608-01979
    - src-arxiv-2607-01813
    - src-arxiv-2406-14515
  sources_note: >
    The paper's v5 and v3 PDFs (DOIs, not archived) read as text, with the affiliation line and the one
    quoted reference given no window and every other window kept clear of the author block and the
    reference list; the abstract page (a DOI) for the dates. The README at 8eaac9a, the Space's
    meta_data.py, the leaderboard data file and VLMEvalKit's image_mcq.py are withheld from archiving
    because they carry a citation block, a contact address naming a person, or personal accounts in
    model and dataset links; their windows leave those out. Hugging Face's API records of the dataset
    and the Space, and the Space's gen_table.py, are pending archiving. The ET-Prune, MMBench-Live and
    MMBench-Video abstract pages are DOIs. The Space's page and the test submission site render by
    script, so the Space's files and the data file were read instead.
  confidence: medium
  review_checks:
    - check: Versions. v1.1 is modelled as a breaking revision of v1.0, as agieval's v1.1 is,
        because the paper calls it a refined version of the same benchmark with better data quality.
        The question count rose from 2,974 to 3,217 and new filtering was applied, and how many v1.0
        questions survive is not stated; an edition would need new items on the same task, which a
        refinement only partly is.
      field: versions
      source: src-arxiv-2307-06281-v5
      quote: It describes MMBench v1.1, a refined version of the MMBench (with better data quality).
    - check: CCBench is recorded as a same-maintainer variant, because the README calls it a new
        benchmark, it has its own items, topic and update (2023-12-26) and its own leaderboard
        column. It could instead be read as a subset of the MMBench collection, which the README
        says includes it. The variant id ccbench and the fork id mmbench-live are proposals for the
        lead; no entry exists for either.
      field: lineage
      source: src-github-mmbench-readme-8eaac9a
      quote: MMBench is a collection of benchmarks to evaluate the multi-modal understanding
        capability of large vision language models (LVLMs)
    - check: MMBench-Video gets no lineage edge. It shares the name and its code goes into
        VLMEvalKit, but it is a video benchmark with free-form questions graded by GPT-4, with its
        own paper; that the same team maintains it rests on account names and author lists, which no
        quoted passage states.
      field: lineage
      source: src-arxiv-2406-14515
      quote: MMBench-Video incorporates lengthy videos from YouTube and employs free-form questions
    - check: maintainer-competes-on-own-benchmark rests on the paper's first affiliation, Shanghai
        AI Laboratory, and the Org the leaderboard gives 47 rows (InternLM-XComposer, InternVL). The
        2026-11-18 rule says a shared university is not a shared lab; whether one large laboratory
        with many groups counts as a shared lab, rather than a shared institution, is for a
        reviewer.
      field: governance.independence_flags
      source: src-arxiv-2307-06281-v5
      quote: 1Shanghai AI Laboratory 2Nanyang Technological University 3 The Chinese University of
        Hong Kong 4 National University of Singapore 5 Zhejiang University
    - check: grader-from-evaluated-party is set for the LLM choice extractor (gpt-4-0125, OpenAI's),
        with OpenAI models scored, while model-graded-judge is rejected because the extractor maps
        answers to options rather than judging them. If only a grader that decides correctness
        counts, the flag would go; the paper measures the extractor against people at 91.5%
        agreement.
      field: governance.independence_flags
      source: src-arxiv-2307-06281-v5
      quote: GPT-4 can accurately match human assessments in 91.5% of cases
    - check: activity accepting-submissions rests on the leaderboard's standing pull-request route.
        Its newest MMBench row is dated 2025-09-17, and the README's test submission site serves a
        script shell that was not driven, so whether it still scores test predictions is unknown;
        no-submission-channel or unknown would follow if neither route works.
      field: activity
      source: src-hf-space-open-vlm-leaderboard-meta-data
      quote: To add your own model to the leaderboard, please create a PR in
        [VLMEvalKit](https://github.com/open-compass/VLMEvalKit) to support your VLM and then we
        will help with the evaluation and updating the leaderboard.
    - check: dataset_licence CC-BY-4.0 rests on the opencompass/MMBench Hugging Face record, whose
        only files are .gitattributes and a README; the TSVs the README links carry no licence
        statement that was read, and most images come from the Internet.
      field: data.dataset_licence
      source: src-hf-api-opencompass-mmbench
      quote: '"siblings":[{"rfilename":".gitattributes"},{"rfilename":"README.md"}]'
    - check: Item counts disagree for v1.0. The README's table gives 1,164 dev and 1,784 test
        questions per language (2,948), against 2,974 in its prose and in the v3 paper; v1.1's split
        sizes are not stated. The data files were not read to count them.
      field: data.size
      source: src-github-mmbench-readme-8eaac9a
      quote: contains 2974 multiple-choice questions, covering 20 ability dimensions
    - check: maintainer_type community-collective follows the README's "OpenCompass Community" and
        the shared organisation accounts; omnidocbench left the type null for another Shanghai AI
        Laboratory account because no source states the laboratory's legal form, and the same gap
        applies here if the laboratory is read as the holder.
      field: governance.maintainer_type
      source: src-github-mmbench-readme-8eaac9a
      quote: MMBench is developed by the [**OpenCompass
        Community**](https://github.com/open-compass/opencompass)
    - check: lifecycle active rather than mature or saturated. The top v1.1 English test score is
        88.5 with no human ceiling, the leaderboard's MMBench rows stopped in September 2025, and
        outside papers still report v1.1 in August 2026.
      field: lifecycle
      source: src-opencompass-openvlm-json
      quote: '"time": "20250917132916"'

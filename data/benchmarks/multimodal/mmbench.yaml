subsets:
  - id: mmbench#en
    label: MMBench (English)
    scored_separately: true
    evidence:
      - source: src-arxiv-2307-06281
        quote: MMBench incorporates multiple-choice questions in both English and Chinese versions
      - source: src-hf-space-open-vlm-leaderboard-meta-data
        quote: MMBENCH_FIELDS = ['MMBench_TEST_EN_V11', 'MMBench_TEST_CN_V11', 'MMBench_TEST_EN',
          'MMBench_TEST_CN', 'CCBench']
    notes: The original questions, all 3,217 in v1.1 (2,974 in v1.0); the leaderboard reports the
      v1.1 and v1.0 test splits as MMBench_TEST_EN_V11 and MMBench_TEST_EN.
  - id: mmbench#cn
    label: MMBench-CN (Chinese)
    scored_separately: true
    evidence:
      - source: src-arxiv-2307-06281-v5
        quote: all content in questions and choices are translated to Chinese based on GPT-4, except
          for proper nouns, symbols, and code
      - source: src-github-mmbench-readme-8eaac9a
        quote: '[2023/10/03] We provide a verified **Chinese**-translated version of MMBench.'
    notes: The same questions translated by GPT-4 and verified by people, announced for v1.0 on
      2023-10-03 and part of v1.1's paper; reported as MMBench_TEST_CN_V11 and MMBench_TEST_CN.
  - id: mmbench#dev
    label: Dev split (answers public)
    scored_separately: true
    evidence:
      - source: src-arxiv-2307-06281-v5
        quote: split MMBench into dev and test subsets at a ratio of 4:6
      - source: src-github-mmbench-readme-8eaac9a
        quote: '| MMBench-Dev | Dev | EN | 1164 | The Dev Split of MMBench |'
    notes: About 40% of the questions, with their answers; 1,164 per language in v1.0's files,
      v1.1's size not stated. The paper reports dev results beside test, and papers that score
      locally use it. The leaderboard data hold no dev columns.
  - id: mmbench#test
    label: Test split (answers held)
    scored_separately: true
    evidence:
      - source: src-arxiv-2307-06281-v5
        quote: one needs to submit the predictions to MMBench evaluation server
      - source: src-github-mmbench-readme-8eaac9a
        quote: '| MMBench-Test | Test | EN | 1784 | The Test Split of MMBench |'
    notes: About 60% of the questions, released without answers; 1,784 per language in v1.0's files,
      v1.1's size not stated. The paper's main tables and the leaderboard report it.
subsets_note: The leaderboard is a grid of two languages by two versions on the test split, and its
  main column averages the two v1.1 languages (aggregation_policy). The six L-2 and twenty L-3
  abilities are breakdowns the leaderboard data carry per row, not subsets here; their per-ability
  question counts are in a figure that did not survive text extraction.

lineage:
  role: root
  variants:
    - id: ccbench
      relation: sibling benchmark by the same team, shipped in the MMBench collection - 510
        questions on Chinese culture (dev split only), in the same multiple-choice format with
        CircularEval and its own leaderboard column; noisy samples were removed on 2023-12-26
      n_items: 510
      source: src-github-mmbench-readme-8eaac9a
      quote: '[2023/10/23] We provide a new benchmark named **CCBench**, which is a multi-modal benchmark
        in the domain of Chinese Culture.'
  forks:
    - id: mmbench-live
      maintainer: PRIS-CV Computer Vision Group
      source: src-arxiv-2607-01813
      quote: Instantiated from MMBench, MMBench-Live contains 5.9K newly generated evaluation
        instances with a high answer correctness rate
lineage_note: >
  The ids ccbench and mmbench-live are proposals; neither has an entry (review_checks). MMBench-Live's
  maintainer is the GitHub organisation its abstract page links (GitHub's API, not a quoted Source).
  MMBench-Video (arXiv 2406.14515, NeurIPS 2024) is a separate benchmark under the same name, with long
  YouTube videos, free-form questions and GPT-4 grading; it shares no items or task format with MMBench,
  so 04 S4 gives no edge, and it has no id. MMBench-CN is a subset, not a variant: the same questions
  translated and scored in the paper's own tables. VLMEvalKit also loads translations of the dev split
  by other maintainers, a Korean one from NCSOFT's K-MMBench and Arabic, Portuguese, Turkish and Russian
  ones from AIDC-AI's Parrot dataset; they were not read beyond the loader's file list and are not
  recorded as forks.


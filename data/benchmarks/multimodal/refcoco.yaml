# data/benchmarks/multimodal/refcoco.yaml
#
# P1-S8-T08, multimodal entry 5 of 6. Filled from the RefCOCO and RefCOCO+ paper (Yu et al., "Modeling Context
# in Referring Expressions", arXiv 1608.00272 read as its v3 PDF, 2016-08-10, ECCV 2016) and its abstract page;
# the RefCOCOg paper (Mao et al., "Generation and Comprehension of Unambiguous Object Descriptions", arXiv
# 1511.02283 read as its v3 PDF, 2016-04-11, CVPR 2016) and its abstract page; the README of the refer toolkit
# (lichengunc/refer) at master, with GitHub's API for its licence and last push; and the v1 PDF of the ZAYA1-VL-8B
# technical report (arXiv 2605.08560, May 2026), a VLM paper reporting RefCOCO accuracy. No leaderboard host of
# RefCOCO's own was found. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# One entry for the three datasets, RefCOCO+ and RefCOCOg as subsets (see review_checks): one toolkit ships them,
# the defining paper evaluates them together, and current papers report them side by side and average across all
# their splits. ReferItGame and its ImageCLEF dataset (RefClef) are ancestors, recorded only as the sources state.
#
# Why multimodal is primary, not vision: the system outputs a box scored by IoU, as a detector does, but which box
# is right is fixed by an English expression. Vision's exclusion test sends "an expression grounded in a scene" to
# multimodal, and multimodal's inclusion test names "binding an expression to a region". COCO's own detection task,
# with a fixed category set and no language, is the vision entry (coco).

id: refcoco
name: RefCOCO
aliases:
  - RefCOCO+
  - RefCOCOg
  - UNC-Ref-COCO
  - Google Refexp
  - G-Ref
tagline: 'Referring expression comprehension on COCO photos: box the object a phrase describes (RefCOCO,
  RefCOCO+, RefCOCOg).'
description: >
  Three datasets of referring expressions on MS-COCO photographs, used together as the standard test of
  referring expression comprehension. Given an image and a short English phrase that singles out one
  object among others of its category, a system must return that object's bounding box. RefCOCO and
  RefCOCO+ were collected at UNC with the ReferItGame, a two-player game in which one player writes an
  expression for a highlighted object and the other must click it. RefCOCO+ bans location words, so its
  expressions describe appearance only. RefCOCOg (Google Refexp) was written on Mechanical Turk without
  a game, and its expressions are longer, often whole sentences. A prediction is correct when its
  intersection over union with the true box is above 0.5. Accuracy is reported per split: val, testA
  (images with several people) and testB (images with several objects of another category) for RefCOCO
  and RefCOCO+, and val and test of the UMD partition for RefCOCOg. Google's own test split for RefCOCOg
  was never released. Every split, labels included, is public through the refer toolkit. There is no
  leaderboard, and results appear only in papers. The benchmark was designed for models trained on its
  train splits. It is now reported mostly for vision-language models that write the box as coordinates.
self_description:
  source: src-arxiv-1608-00272-v3
  quote: referring expression comprehension where the input is a natural language expression and the
    goal is to localize the referred object in the image
external_ids:
  arxiv: '1608.00272'
paper:
  title: Modeling Context in Referring Expressions
  arxiv: '1608.00272'
  version_read: v3
  source: src-arxiv-1608-00272-v3
released: 2016-07-31
released_note: The first arXiv version of Yu et al., the paper that defines RefCOCO and RefCOCO+'s
  testA and testB splits and that the toolkit's README names for comparison. RefCOCOg appeared
  first, with Mao et al. on 2015-11-07 (src-arxiv-1511-02283, "Submitted on 7 Nov 2015"), whose
  experiments also used RefCOCO under another split. The refer repository was created on 2016-03-22
  (GitHub API).
released_source: src-arxiv-1608-00272
released_quote: Submitted on 31 Jul 2016
release_venue: ECCV 2016
release_venue_source: src-arxiv-1608-00272
release_venue_quote: in ECCV 2016

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/visual-grounding
domain_basis:
  reason: Every item is scored on whether a natural-language expression was bound to the right
    region of a photograph, which is visual-grounding's definition and the case multimodal's
    inclusion test names ("binding an expression to a region"). The box is scored by IoU, as in
    detection, but the target is fixed by the expression, and every image holds two or more objects
    of the target's category, so a category label does not resolve it. Vision's exclusion test sends
    exactly this case ("an expression grounded in a scene") to multimodal.
  source: src-arxiv-1608-00272-v3
  quote: referring expression comprehension where the input is a natural language expression and the
    goal is to localize the referred object in the image
domain_considered_and_rejected:
  - term: vision/detection
    reason: The output is a box scored by IoU, but the scored relation is between the expression and
      the region, which vision's exclusion test assigns to multimodal. Box-only detection on the
      same images is COCO's entry.
    source: src-arxiv-1608-00272-v3
    quote: Images in these collections were selected to contain two or more objects of the same
      object category
  - term: multimodal/any-to-any-generation
    reason: Both defining papers also generate expressions for a given object, scored by BLEU, ROUGE
      and METEOR in Yu et al. and by human judges and a comprehension model in Mao et al. No common
      generation protocol settled, and the toolkit's comparison point and current papers report
      comprehension, which is what this entry records (see review_checks).
    source: src-arxiv-1511-02283-v3
    quote: We rely instead on human evaluation
  - term: multimodal/visual-qa
    reason: Mao et al. note that comprehension can be posed as a question whose answer is a box, but
      there is no question and the answer is a location, not language.
    source: src-arxiv-1511-02283-v3
    quote: so the answer is numerical, not linguistic
capability:
  - grounding
capability_basis:
  grounding:
    reason: The score is whether an English expression was attached to the right object in a
      presented photograph, which is grounding's inclusion test. Expressions were kept only when a
      second person could find the object from them.
    source: src-arxiv-1511-02283
    quote: which can also comprehend or interpret such an expression to infer which object is being
      described
capability_considered_and_rejected:
  - term: perception
    reason: Finding the object needs visual recognition, but perception's exclusion test sends the
      binding of symbols to referents to grounding.
  - term: spatial-reasoning
    reason: Many RefCOCO expressions locate the target by position, but the relation is stated in
      the expression and checking it is the binding the score measures. RefCOCO+ bans location
      words, and no split scores spatial expressions on their own.
    source: src-arxiv-1608-00272-v3
    quote: players are disallowed from using location words in their referring expressions

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: A prediction counts when its IoU with the true box is above 0.5, and the score is the
    share of such hits over the test set. The verdict rests on IoU, a detection measure that
    domain-metric names; Mao et al. call the score precision@1.
  source: src-arxiv-1608-00272-v3
  quote: If the IOU is larger than 0.5 we count it as a true positive
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Accuracy is a mean of per-item verdicts, but the verdict is an overlap threshold on a
      box, not equality with a stored answer.
  - term: numeric-tolerance-match
    reason: A box is four numbers and IoU above 0.5 is a band around the reference, but the band is
      the detection field's overlap measure, which domain-metric names, not a tolerance on a numeric
      answer.
  - term: reference-metric
    reason: BLEU, ROUGE and METEOR score the generation task in Yu et al., which this entry does not
      record (domain_considered_and_rejected).
    source: src-arxiv-1608-00272-v3
    quote: For the referring expression generation task we use automatic evaluation metrics, BLEU,
      ROUGE, and METEOR
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The datasets come with training splits, and the defining papers train comprehension models
    on them and score the trained models, choosing among ground-truth COCO boxes or detector
    proposals.
  source: src-arxiv-1511-02283-v3
  quote: We randomly chose 5,000 objects as the validation set, 5,000 objects as the testing set and
    the remaining objects as the training set
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: Prompted vision-language models now report most RefCOCO results (observed_subjects), but
      the benchmark was built in 2016 for models trained on its train splits.
    source: src-arxiv-2605-08560-v1
    quote: we perform instruction tuning on 20 million curated text and multimodal samples
observed_subjects:
  values:
    - instruction-tuned-model
  basis: A May 2026 technical report scores its own instruction-tuned VLM and twelve other open VLMs
    (Qwen, InternVL, PLM and DeepSeek-VL2 models) on all eight splits, each re-run through the
    report's VLMEvalKit-based pipeline.
  source: src-arxiv-2605-08560-v1
as_used:
  - protocol: Vision-language models are prompted with the expression and write box coordinates as
      text, which a third-party pipeline parses and scores by IoU. The 2016 papers instead ranked
      candidate regions, ground-truth COCO boxes or detector proposals. Results are given per split
      and often averaged across all of them.
    split: RefCOCO and RefCOCO+ val, testA and testB; RefCOCOg val and test
    source: src-arxiv-2605-08560-v1
    quote: All scores are reproduced using our evaluation pipeline based on VLMEvalKit [143].
    note: ZAYA1-VL-8B (May 2026) re-ran every compared model in its own pipeline. It found
      DeepSeek-VL2 far below its published numbers and left the gap unexplained, so the pipeline and
      box format are conditions of a result. The RefCOCOg test split it reports can only be the UMD
      partition's, since Google's was never released.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced in 2026; a May 2026 VLM report scores thirteen open models on
    every split of the three datasets. The toolkit repository was last pushed on 2024-08-27 (GitHub
    API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2605-08560-v1
  quote: ZAYA1-VL-8B achieves an overall average of 84.3 across all splits
activity: no-submission-channel
activity_basis:
  reason: No leaderboard, server or submission route was found, and no source names one. The toolkit
    loads the data, its README points to the ECCV paper for comparison, and results appear in users'
    own papers. Third-party sites that aggregate numbers from papers are not a channel of the
    benchmark's.
  source: src-github-refer-readme
  quote: if you want to compare with our recent results, please check our ECCV2016 paper

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: ZAYA1-VL-8B
    source: src-arxiv-2605-08560-v1
    observed_on: 2026-10-14
    quote: On RefCOCO, the model scores 91.0 on testA (person-centric queries)
  - system: Mao et al.'s MMI-trained comprehension model (CVPR 2016)
    source: src-arxiv-1511-02283-v3
    observed_on: 2026-10-14
    quote: We see that MMI training outperforms ML training under every setting.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The COCO box of the object each expression was written for, public in
  every split; an expression was kept only if a second person clicked the right object from it.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: All three datasets and their partitions, labels included, are distributed with a public
    loader, and the metric needs only the boxes. The official download server is down (data.access).
  source: src-github-refer-readme
  quote: This API is able to load all 4 referring expression datasets, i.e., RefClef, RefCOCO,
    RefCOCO+ and RefCOCOg.

task:
  exists: true
  input:
    - a COCO photograph holding two or more objects of the target's category
    - an English referring expression written for one of those objects
  output: A bounding box for the referred object, predicted directly or, in the 2016 protocols,
    chosen among candidate regions (ground-truth COCO boxes or detector proposals).
  scoring: Accuracy, a prediction counting when its IoU with the true box is above 0.5, reported per
    dataset and split; some papers also average across all splits.
  source: src-arxiv-1608-00272-v3
  quote: then we compute the intersection over union (IOU) ratio between the true and predicted
    bounding box

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The README's download links point to a UNC web server that it says is broken, and it
    sends users to a GitHub issue whose comment lists Wayback Machine captures of the same four zip
    files (read through GitHub's API on 2026-10-14; not a quoted Source). The server did not answer
    on 2026-10-14. RefCOCOg's Google test split was never released ("test split not released yet",
    same Source), which is why the UMD partition is reported.
  access_basis:
    reason: Every split of the three datasets, with its target boxes, is in the public download,
      with no account or agreement.
    source: src-github-refer-readme
    quote: We provide all kinds of splits here.
  refresh: static
  refresh_basis:
    reason: The expressions and their UNC, Google and UMD partitions have not changed since 2016;
      the toolkit offers each partition as it was made.
    source: src-github-refer-readme
    quote: We provide all kinds of splits here.
  data_provenance:
    - crowd-authored
    - inherited-from-constituents
  data_provenance_note: The expressions were written for the benchmark by non-specialists, RefCOCO
    and RefCOCO+'s by ReferItGame players and RefCOCOg's by Mechanical Turk workers ("This dataset
    was collected on Amazon Mechanical Turk in a non-interactive setting", same Source). The images
    and the target objects' boxes and masks are MS-COCO's, so COCO's own provenance (Flickr
    photographs, crowd-labelled instances) applies to them.
  data_provenance_source: src-arxiv-1608-00272-v3
  data_provenance_quote: We make use of 3 referring expression datasets in our work, all collected
    on top of the Microsoft COCO image collection
  contamination_risk: high
  contamination_risk_note: RefCOCO and RefCOCO+ were drawn from COCO's training data, so their val,
    testA and testB images, with every object's box, sit in COCO's training split. Any model trained
    on it has seen those images and boxes, though not the expressions; Yu et al. trained their
    detector on COCO's validation images only to avoid this. Every split's labels have also been
    public since 2016.
  contamination_evidence:
    - source: src-arxiv-1608-00272-v3
      stance: supports
      quote: as the RefCOCO and RefCOCO+ are collected using MSCOCO training data
  dataset_licence: null
  dataset_licence_note: No licence for the expressions or the splits is stated in the README or the
    papers read. GitHub reports Apache-2.0 for the toolkit's code (execution.code_licence).
  upstream_licences: The images are MS-COCO's, which COCO's terms of use leave under their Flickr
    owners' copyright and the Flickr Terms of Use (see coco).
  size:
    - count: 142209
      unit: expressions, for 50,000 objects in 19,994 images
      subset: RefCOCO
      source: src-arxiv-1608-00272-v3
      quote: RefCOCO consists of 142,209 refer expressions for 50,000 objects in 19,994 images
    - count: 141564
      unit: expressions, for 49,856 objects in 19,992 images
      subset: RefCOCO+
      source: src-arxiv-1608-00272-v3
      quote: RefCOCO+ has 141,564 expressions for 49,856 objects in 19,992 images
    - count: 85474
      unit: expressions, for 54,822 objects in 26,711 images
      subset: RefCOCOg
      note: The count Yu et al. give for RefCOCOg as they used it. Mao et al. report 104,560
        expressions selected in collection (next row); the sources read do not reconcile the two.
      source: src-arxiv-1608-00272-v3
      quote: This dataset consists of 85,474 referring expressions for 54,822 objects in 26,711
        images
    - count: 104560
      unit: expressions, as collected
      subset: RefCOCOg (Google Refexp)
      source: src-arxiv-1511-02283-v3
      quote: In this way, we selected 104,560 expressions.
  size_note: Per-split counts (val, testA, testB and the UMD test) are not stated in the sources
    read.
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Licheng Yu (the lichengunc/refer toolkit), for the three datasets as distributed;
    RefCOCOg's expressions were collected by Google (Mao et al.)
  maintainer_basis:
    reason: The defining paper points to one author's personal GitHub account for the datasets and
      toolbox, and the README there distributes all three with their partitions.
    source: src-arxiv-1608-00272-v3
    quote: Datasets and toolbox can be downloaded from https://github.com/lichengunc/refer
  maintainer_type: individual
  maintainer_type_note: academic-lab was considered. The README says UNC collected RefCOCO and
    RefCOCO+ ("the following three datasets RefClef, RefCOCO and RefCOCO+ that were collected by
    UNC", same Source), and the downloads sat on a UNC web server under the author's directory. But
    the repository is a personal account and no institution is stated as holding the data, which
    individual's test decides on, as for gpqa-diamond.
  submission_process:
    - literature-only
  submission_process_note: There is no leaderboard, results page or submission route; the README
    sends readers to the ECCV paper's results, and everyone else reports in their own papers.
  submission_process_source: src-github-refer-readme
  submission_process_quote: if you want to compare with our recent results, please check our
    ECCV2016 paper
  independence_flags: []
  independence_flags_note: None recorded as a flag. Yu et al.'s research was supported by NSF and
    Microsoft, and RefCOCOg's authors were at Google. Both companies build vision-language models,
    but the sources read show no Microsoft or Google system scored on RefCOCO (see review_checks).
    With no board, there is no ranking for a maintainer to compete on.
  independence_flags_source: src-arxiv-1608-00272-v3
  independence_flags_quote: 'This research is supported by NSF Grants #1444234, 1445409, 1405822, and
    Microsoft'
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data and labels are public and the score is box overlap, computed by anyone with no
      human, physical or maintainer-only step.
    source: src-arxiv-1511-02283-v3
    quote: The comprehension task is easy to evaluate
  harness_availability: reference-implementation-only
  harness: refer (refer.py, a loader for the datasets and their partitions). Its evaluation folder
    scores generated expressions (BLEU, METEOR, ROUGE, CIDEr), not comprehension.
  harness_note: No published code from the maintainers computes comprehension accuracy; each paper
    or third-party pipeline (VLMEvalKit, as_used) computes the IoU itself. The evaluation folder's
    contents were read from GitHub's API listing on 2026-10-14; not a quoted Source.
  harness_source: src-github-refer-readme
  harness_quote: This API is able to load all 4 referring expression datasets, i.e., RefClef,
    RefCOCO, RefCOCO+ and RefCOCOg.
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for lichengunc/refer, read 2026-10-14; not a quoted
    Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which dataset and split (RefCOCO's UNC or Google partition, RefCOCOg's Google
  # val or UMD val and test, or an average across splits), what the system was trained on (the train splits,
  # COCO-trained detectors whose training images include the test images), and the evaluation pipeline, which
  # parses box coordinates and moved one model's scores far from its published numbers. Older results also
  # depend on the candidate regions ranked (ground-truth COCO boxes or detector proposals), which no condition
  # field names yet.
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: community-aggregate
aggregation_policy_note: The defining papers report each split apart. Some current papers add an
  average across all eight splits (src-arxiv-2605-08560-v1, "an overall average of 84.3 across all
  splits"), which no maintainer defines.

homepage: https://github.com/lichengunc/refer
repository: https://github.com/lichengunc/refer

subsets:
  - id: refcoco#refcoco
    label: RefCOCO
    scored_separately: true
    evidence:
      - source: src-arxiv-1608-00272-v3
        quote: In the RefCOCO dataset, no restrictions are placed on the type of language used in
          the referring expressions
      - source: src-arxiv-1608-00272-v3
        quote: we create a split for RefCOCO and RefCOCO+ datasets that evaluates images containing
          multiple people (testA) vs images containing multiple instances of all other objects
          (testB)
      - source: src-arxiv-1608-00272-v3
        quote: This dataset was originally collected on top of the 20,000 image ImageCleft dataset,
          but has recently been extended to images from the MSCOCO collection
    notes: Collected with the ReferItGame on COCO images, with no restriction on wording, so many
      expressions use position. The game was first played on ImageCLEF photographs (ReferIt,
      RefClef, which the toolkit also ships). The UNC partition splits by image into train, val,
      testA (images with several people) and testB (images with several objects of another
      category). The toolkit also offers a Google partition of RefCOCO, and Mao et al. split it by
      object at random.
  - id: refcoco#refcoco-plus
    label: RefCOCO+
    scored_separately: true
    evidence:
      - source: src-arxiv-1608-00272-v3
        quote: players are disallowed from using location words in their referring expressions
    notes: The same game on COCO images, with location words banned so that expressions describe
      appearance. Split like RefCOCO into train, val, testA and testB.
  - id: refcoco#refcocog
    label: RefCOCOg (Google Refexp)
    scored_separately: true
    evidence:
      - source: src-arxiv-1511-02283-v3
        quote: This dataset is denoted as Google Refexp dataset
      - source: src-arxiv-1608-00272-v3
        quote: RefCOCO expressions have an average length of 3.61 while RefCOCO+ have an average
          length of 3.53, and RefCOCOg contain an average of 8.43 words
      - source: src-arxiv-1608-00272-v3
        quote: one object from an image may appear in the training set while another object from the
          same image may appear in the test set
      - source: src-github-refer-readme
        quote: Note for RefCOCOg, we suggest use UMD's split which has train/val/test splits and
          there is no overlap of images between different split.
    notes: Written on Mechanical Turk without a game, for COCO images with two to four objects of a
      category, so its expressions are longer. Google's partition is by object, so images recur
      across its splits, and its test split was never released. The UMD partition, which the README
      recommends, splits by image into train, val and test, and is the one current papers report.

tags:
  - referring-expressions
  - visual-grounding
  - coco
  - vision-language

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T08)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1608-00272-v3
    - src-arxiv-1608-00272
    - src-arxiv-1511-02283-v3
    - src-arxiv-1511-02283
    - src-github-refer-readme
    - src-arxiv-2605-08560-v1
  sources_note: >
    Both defining papers' v3 PDFs (DOIs, not archived) read as text, with narrow windows that keep the
    authors' e-mail lines out, and their abstract pages for dates and venues; the refer README at master;
    and the ZAYA1-VL-8B report's v1 PDF (a DOI, not archived) as evidence of current use. GitHub's API
    was
    read for the licence, last push and repository listing, and for the README's linked download issue.
    No leaderboard of RefCOCO's own was found to read.
  confidence: medium
  review_checks:
    - check: Identity. One entry with RefCOCO, RefCOCO+ and RefCOCOg as subsets, because one toolkit
        ships them, Yu et al. evaluate them together and current papers report and average them as
        one block. RefCOCOg has another origin (Google, non-interactive Mechanical Turk) and
        RefCOCO+ another collection rule, so either could be an entry of its own.
      field: subsets
      source: src-arxiv-1608-00272-v3
      quote: Evaluation on three recent datasets - RefCOCO, RefCOCO+, and RefCOCOg
    - check: contamination_risk high rests on RefCOCO and RefCOCO+'s test images and their boxes
        being COCO training images. The expressions themselves are not in COCO, so medium may be
        argued.
      field: data.contamination_risk
      source: src-arxiv-1608-00272-v3
      quote: as the RefCOCO and RefCOCO+ are collected using MSCOCO training data
    - check: Referring expression generation, scored in both defining papers, is left out of the
        domain and evaluation methods. Region captioning on RefCOCOg is still reported by some
        models; if it counts, multimodal/any-to-any-generation and reference-metric would be added
        as secondary.
      field: domain
    - check: maintainer_type individual rests on the personal GitHub account; the README says UNC
        collected RefCOCO and RefCOCO+, and the download server was UNC's, so academic-lab is
        arguable.
      field: governance.maintainer_type
      source: src-github-refer-readme
      quote: the following three datasets RefClef, RefCOCO and RefCOCO+ that were collected by UNC
    - check: data.access fully-open while the official download server is down; the README's issue
        points to Wayback captures of the official files, which could not be fetched from here.
      field: data.access
      source: src-github-refer-readme
      quote: As the webserver is broken (sry about this)
    - check: Microsoft supported Yu et al. and RefCOCOg is Google's. If Microsoft or Google models
        are shown scored on RefCOCO, funded-by-evaluated-party may apply.
      field: governance.independence_flags
    - check: The same datasets with COCO masks are also used for referring expression segmentation
        (scored by mask IoU). No source read covers that use, so it is not recorded.
      field: as_used

    live bundle carries the same statements; EvalAI's public API records of the 2021 and 2020 challenges'
    phases and the 2021 test-standard leaderboard (withheld, for its team names); MMF's evaluator at main;
    and the Leum-VL and Amazon Nova reports, already in the catalogue for ChartQA and DocVQA, as evidence
    of current use. EvalAI's record of challenge 874 itself answered "Challenge does not exist!", and
    the 2019 challenge's record holds personal data, so neither is cited.
  confidence: medium
  review_checks:
    - check: vision/ocr-handwriting is taken as a secondary because reading scene text is what the
        benchmark was built to test and many answers are copied text. DocVQA and ChartQA rejected
        the same term because no transcription is scored, which is true here too; confirm whether
        the secondary should stand, or whether TextVQA should match them.
      field: domain
      source: src-arxiv-1904-08920-v2
      quote: We believe TextVQA will encourage research both on improving text detection and
        recognition in unconstrained environments
    - check: headline_metric and task.metric point at vqa-accuracy, a Metric record drafted in this
        task for the VQA entry and not yet committed. If that record is renamed or not kept, both
        refs need changing; TextVQA uses VQA v2's formula unchanged.
      field: headline_metric
      source: src-github-textvqa-site-challenge-bd26fd3
      quote: We use the same metric as VQA v2 which is robust to inter-human variability in phrasing
        the answers.
    - check: evaluation_method is reference-metric, because VQA accuracy gives partial credit, which
        exact-match's exclusion test rules out; the VQA entry takes the same term. Neither term fits
        consensus scoring well, which the open gap record 2026-11-10-vqa-001 (proposed term
        consensus-match) already logs, so no duplicate was logged for TextVQA; if the term is added,
        both entries move together.
      field: evaluation_method
      source: src-github-mmf-m4c-evaluators-72f898e
      quote: acc = min(1, float(len(matching_answers)) / 3)
    - check: Current reports use the validation split, against the maintainers' instruction to
        report test-std. Validation and test-std numbers are not comparable, and validation answers
        are public, which bears on contamination_risk medium.
      field: as_used
      source: src-evalai-textvqa-challenge-874-phases
      quote: This phase should not be used for reporting results in the paper.
    - check: activity leaderboard-live-no-round rests on the 2021 phases being active until 2099 and
        public rows into June 2024. EvalAI's record of challenge 874 answers "Challenge does not
        exist!" and the challenge is missing from EvalAI's public lists, so it may be unpublished;
        whether a new test-standard submission is scored could not be checked without logging in.
      field: activity
      source: src-evalai-textvqa-challenge-874-phases
      quote: '"is_active":true,"codename":"test-standard"'
    - check: refresh is static and v0.5.1 is a revision, because only the supplied OCR tokens
        changed. Models that read those tokens can score differently on v0.5 and v0.5.1, so a
        reviewer may prefer versioned-releases.
      field: data.refresh
      source: src-github-textvqa-site-download-bd26fd3
      quote: This version has everything same as v0.5 except that Rosetta OCR tokens have been
        updated and separated into a separate JSON file.
    - check: single-evaluator-private-test-set is tagged, as for DocVQA, for public test inputs with
        answers held by the maintainers' EvalAI challenge. COCO's entry has the same arrangement and
        no flag; one of them should change.
      field: governance.independence_flags
    - check: Facebook AI Research maintains TextVQA, and its parent company develops vision-language
        models that may report TextVQA. No source read shows that, so funded-by-evaluated-party and
        grader-from-evaluated-party are not set; a reviewer who finds such a report should add the
        flag.
      field: governance.independence_flags
    - check: TextCaps is recorded as a same-team variant (a sibling task on the same images) under
        the id textcaps, which is not allocated. Whether it should be a separate benchmark linked
        another way, and whether TextOCR belongs in lineage at all.
      field: lineage
      source: src-github-textvqa-site-challenge-bd26fd3
      quote: are collected on the same images as TextVQA
    - check: The test-split counts come from the site (5,734 questions on 3,289 images) and the
        paper (5,734), and the image totals from the site's per-split counts (21,953 + 3,166 + 3,289
        = 28,408), which agree with the abstract. The paper's Table 2 test column could not be read
        reliably from the PDF text, so LoRRA's test score is not recorded.
      field: data.size
      source: src-arxiv-1904-08920-v2
      quote: We divide TextVQA into train, validation and test splits with size 34,602, 5,000, and
        5,734, respectively.
  personal_data_excluded:
    - source: src-arxiv-1904-08920-v2
      what: the author list under the title
    - source: src-arxiv-1904-08920
      what: the author list and the submitter's name
    - source: src-github-textvqa-site-download-bd26fd3
      what: the maintainers' contact e-mail address
    - source: src-github-textvqa-site-challenge-bd26fd3
      what: the maintainers' contact e-mail address; the organisers' names, held in a separate file
        that was not fetched
    - source: src-evalai-textvqa-leaderboard-2313
      what: the participant team names, some of which look like personal names or handles

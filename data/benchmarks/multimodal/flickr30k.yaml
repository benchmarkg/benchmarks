# data/benchmarks/multimodal/flickr30k.yaml
#
# P1-S8-T09, multimodal entry 10. Filled from the Flickr30k paper ("From image descriptions to visual
# denotations", TACL 2014, DOI 10.1162/tacl_a_00166) read as its ACL Anthology PDF, and its Anthology landing
# page; the University of Illinois dataset page (withheld: it names the authors and quotes captions describing
# people in a dataset photograph); the paper that defines the 1,000-image test split now used for retrieval
# and captioning (arXiv 1412.2306, read as its v2 PDF) and its abstract page; the abstract page of Flickr30k
# Entities (arXiv 1505.04870); two 2025 vision-language encoder reports that score Flickr30k retrieval, SigLIP 2
# (arXiv 2502.14786, v1 PDF) and Perception Encoder (arXiv 2504.13181, v2 PDF); and the README of LAION's
# CLIP_benchmark at a pinned commit, the harness the Perception Encoder report names. The request form linked
# from the dataset page was not opened, and no dataset image was fetched or looked at. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# Why multimodal/cross-modal-retrieval is primary. The defining paper does not score images at all: its two
# evaluations, approximate entailment over captions and STS, are text-only, and it says so ("a purely linguistic
# task"). What the benchmark scores as it is used is retrieval in each direction on a 1,000-image test split,
# Recall@K counting whether the image (or a caption) that truly corresponds to a query in the other modality is
# ranked in the top K. The metric is defined over the image-caption pair, which is 02 S11 rule 12's test for
# multimodal and cross-modal-retrieval's definition. Captioning on the same split (BLEU, METEOR, CIDEr against the
# five reference captions) is any-to-any-generation, secondary, and the paper's entailment task is recorded as a
# subset with a language override. Flickr30k Entities (phrase grounding on the same images) is a derivative by
# another author group, recorded under lineage.forks with no id of its own allocated here.

id: flickr30k
name: Flickr30k
aliases:
  - Flickr30K
  - Flickr 30k
  - Flickr-30k
  - Flickr 30k Dataset
tagline: 31,783 Flickr photos with five crowd captions each, scored as image-text retrieval
  (Recall@K) and captioning.
description: >
  A corpus of 31,783 photographs of everyday activities, events and scenes taken from Flickr, each described
  by five crowd workers, 158,915 English captions in all. It extends the same group's Flickr 8k corpus.
  The defining paper built it to construct a denotation graph, a hierarchy of phrases linked to the sets
  of images they describe, and evaluated that graph on two text-only tasks. The dataset became a standard
  benchmark for matching images and sentences instead. In that use, models rank the 1,000 images of a
  test split for each caption (text-to-image retrieval) and the test captions, five per image, for each
  image (image-to-text retrieval), and the score is Recall@K, the share of queries whose true match is
  in the top K (usually K = 1, 5 and 10). The same split, with 1,000 validation images and the rest for
  training, is used for captioning, scored by BLEU, METEOR and CIDEr against the five references. Results
  come from papers; there is no leaderboard. Most 2025 results are zero-shot, from contrastive vision-language
  encoders run through third-party harnesses. The data is released through a request form, for non-commercial
  research and teaching, and the images stay under their owners' copyright and the Flickr Terms of Use.
self_description:
  source: src-acl-q14-1006-pdf
  quote: consists of 31,783 photographs of everyday activities, events and scenes (all harvested
    from Flickr) and 158,915 captions (obtained via crowdsourcing)
paper:
  title: 'From image descriptions to visual denotations: New similarity metrics for semantic inference
    over event descriptions'
  doi: 10.1162/tacl_a_00166
  source: src-acl-q14-1006-pdf
released: null
released_note: The PDF prints "Published 2/2014" with no day (src-acl-q14-1006-pdf, "Revised
  10/2013; Published 2/2014."), and the Anthology page gives only the year. The 1,000-image test
  split that current results use was defined later, in arXiv 1412.2306, first submitted on
  2014-12-07 (src-arxiv-1412-2306, "Submitted on 7 Dec 2014 (v1)").
release_venue: TACL 2014 (Transactions of the Association for Computational Linguistics, volume 2)
release_venue_source: src-acl-q14-1006
release_venue_quote: 'Volume: Transactions of the Association for Computational Linguistics, Volume 2'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/cross-modal-retrieval
  secondary:
    - multimodal/any-to-any-generation
domain_basis:
  reason: As the benchmark is used, a query in one modality (a caption or an image) is matched
    against a gallery in the other, and Recall@K counts whether the item that truly corresponds to
    the query is ranked in the top K. The score is defined over the image-caption pair, which is
    cross-modal-retrieval's definition and multimodal's inclusion test ("retrieving across
    modalities"); neither modality is scored on its own. Captioning on the same split generates text
    from an image and scores its agreement with the image's reference captions, which is
    any-to-any-generation, secondary because the retrieval results are the ones the 2025 sources
    report (see review_checks).
  source: src-arxiv-1412-2306-v2
  quote: retrieve items in one modality given a query from the other by sorting based on the
    image-sentence score
domain_considered_and_rejected:
  - term: language/understanding
    reason: The defining paper's own evaluations are text-only, an approximate entailment task built
      from the captions and the STS 2012 task, so by what that paper scores the benchmark would be
      language. Neither is what Flickr30k is used for (as_used); the entailment task is kept as a
      subset with a language override.
    source: src-acl-q14-1006-pdf
    quote: Although the aim of this paper is to show their utility for a purely linguistic task, we
      believe that they should also be of great interest for people who aim to build systems that
      automatically associate image with sentences that describe them
  - term: multimodal/visual-grounding
    reason: Phrase grounding on these images is Flickr30k Entities, a derivative with its own boxes,
      coreference chains and task (lineage.forks). Flickr30k's own annotations are whole captions
      for whole images, with no region to localise.
    source: src-arxiv-1505-04870
    quote: They enable us to define a new benchmark for localization of textual entity mentions in
      an image.
  - term: multimodal/visual-qa
    reason: No item poses a question; retrieval ranks images or captions and captioning describes
      the image unprompted.
capability:
  - grounding
capability_basis:
  grounding:
    reason: The retrieval score is whether a sentence was attached to the photograph it describes,
      among a thousand others, which is grounding's inclusion test (a linguistic expression attached
      to an event in a presented world). The paper defines a phrase's meaning by the images it truly
      describes.
    source: src-acl-q14-1006-pdf
    quote: the (visual) denotation of a linguistic expression as the set of images it describes
capability_considered_and_rejected:
  - term: perception
    reason: Matching needs visual recognition, but perception's exclusion test sends the binding of
      language to referents to grounding, and no score measures what was recovered from the image
      alone.
  - term: generation-fidelity
    reason: Captioning scores generated text against five references, which is this term, but
      captioning is the secondary use; it is the captioning subset's capability_override.
    source: src-arxiv-1412-2306-v2
    quote: We report the BLEU [44], METEOR [7] and CIDEr [53] scores computed with the coco-caption
      code

evaluation_method:
  - classification-metric
  - reference-metric
evaluation_method_basis:
  reason: Retrieval is scored by Recall@K, the fraction of queries whose true match is among the top
    K results, a statistic of the score ranking against each query's known matches (as obliqa
    records Recall@10). Some papers add the median rank. Captioning is scored by BLEU, METEOR and
    CIDEr, fixed-formula similarities to the reference captions, which is reference-metric.
  source: src-arxiv-1412-2306-v2
  quote: Recall@K, which measures the fraction of times a correct item was found among the top K
    results
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Each query is a hit or a miss at a given K and the score is their mean, which is close
      to exact-match's case; but the verdict is a position in a ranking over the whole gallery, not
      equality with a stored answer, and the number moves with the gallery's size (see
      review_checks).
    source: src-arxiv-1412-2306-v2
    quote: Note that the 5000 images numbers are lower since Recall@K is a function of test set size
  - term: model-derived-metric
    reason: The captioning metrics are computed by formula from n-grams (the coco-caption code),
      with no learned scoring model.
  - term: domain-metric
    reason: Recall@K and median rank are general retrieval statistics, not measures defined only
      within one discipline.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The protocol current results follow trains image-sentence models on the training images
    and scores the trained models on 1,000 held-out test images; the defining paper likewise trains
    its entailment classifiers on items from 25,000 images and tests on a disjoint 3,000.
  source: src-arxiv-1412-2306-v2
  quote: For Flickr8K and Flickr30K, we use 1,000 images for validation, 1,000 for testing and the
    rest for training
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: No source read prompts an instruction-tuned model on Flickr30k; the 2025 results are
      from contrastive encoders scored by embedding similarity, not by instruction.
observed_subjects:
  values:
    - task-specific-supervised-model
  basis: The 2025 reports read score contrastive vision-language encoders (SigLIP 2 and its
    baselines, Perception Encoder) zero-shot, ranking by image-text embedding similarity with the
    original captions as queries. They are trained for image-text matching on web data rather than
    on Flickr30k's train split, and scored as trained, not prompted, which the term's last inclusion
    clause covers (see review_checks).
  source: src-arxiv-2504-13181-v2
as_used:
  - protocol: Zero-shot retrieval by a contrastive image-text encoder, each direction ranked by
      embedding similarity, with the original captions as text queries and no prompt, run through
      LAION's CLIP_benchmark. Recall@1 is the reported number in SigLIP 2's Table 1.
    split: test split (the reports do not name it; see review_checks)
    source: src-arxiv-2504-13181-v2
    quote: For zero-shot image-text and video-text retrieval, we rely solely on the original
      captions without any additional prompts.
    note: The Perception Encoder report takes "datasets and splits" from the original websites or
      Hugging Face and does not state which Flickr30k split it scores. SigLIP 2 calls the benchmark
      "Flickr" and gives no reference for it.
  - protocol: Models trained on the training images, selected on 1,000 validation images and scored
      on 1,000 test images, by Recall@1, 5 and 10 and median rank in both directions (retrieval) and
      by BLEU, METEOR and CIDEr (captioning).
    split: 1,000-image test split of arXiv 1412.2306
    source: src-arxiv-1412-2306-v2
    quote: For Flickr8K and Flickr30K, we use 1,000 images for validation, 1,000 for testing and the
      rest for training

lifecycle: active
lifecycle_basis:
  reason: Flickr30k retrieval is a headline result of two 2025 vision-language encoder reports,
    which call it one of their main benchmarks. Whether top models have saturated Recall@5 and @10
    is not stated in the sources read (see review_checks).
  source: src-arxiv-2502-14786-v1
  quote: uses a network fine-tuned on ImageNet, COCO, and Flickr (i.e. the main benchmarks in Table
    1) as a filter to improve data quality
activity: no-submission-channel
activity_basis:
  reason: No leaderboard, server or submission route was found, and no source names one. The dataset
    page offers only the data and the denotation graph; users score their own models with their own
    or third-party code and publish the numbers in papers.
  source: src-arxiv-2504-13181-v2
  quote: for zero-shot classification and retrieval benchmarking. The benchmark datasets and splits
    are obtained from the original dataset websites or HuggingFace.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: SigLIP 2
    source: src-arxiv-2502-14786-v1
    observed_on: 2026-11-10
    quote: SigLIP 2 performs better than SigLIP and other (open-weight) baselines across the board
  - system: Perception Encoder (PEcore)
    source: src-arxiv-2504-13181-v2
    observed_on: 2026-11-10
    quote: PEcore obtains stateof-the-art results across general classification, retrieval, and
      finegrained classification
  - system: The image-sentence alignment model of arXiv 1412.2306
    source: src-arxiv-1412-2306-v2
    observed_on: 2026-11-10
    quote: We demonstrate that our alignment model produces state of the art results in retrieval
      experiments on Flickr8K, Flickr30K and MSCOCO datasets.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The five crowd captions written for each test image, which fix which
  images and captions match. They are released with the rest of the data to anyone granted access,
  so nothing is withheld.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The images, captions and split are released to researchers who ask through the form, and
    the scores need only the rankings and the known matches, so anyone admitted can recompute them.
    The form and the non-commercial terms are the only gate (data.access).
  source: src-illinois-denotationgraph
  quote: Please fill in the following form to request access to the Flickr 30k Dataset and the
    Denotation Graph.

task:
  exists: true
  input:
    - for text-to-image retrieval, one English caption and the gallery of test images
    - for image-to-text retrieval, one photograph and the gallery of test captions
    - for captioning, one photograph
  output: A ranking of the gallery in the other modality, best match first; for captioning, one
    English sentence.
  scoring: Recall@K (K = 1, 5, 10) per direction, the share of queries whose true match is in the
    top K, sometimes with the median rank of the first true match; captioning by BLEU-1 to 4, METEOR
    and CIDEr against the five references.
  source: src-arxiv-1412-2306-v2
  quote: R@K is Recall@K (high is good). Med r is the median rank (low is good).

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: The dataset page's download section links a request form on illinois.edu, which was
    not opened; what it asks and whether access is granted automatically is not known. The paper
    itself says the data set is "freely available" (src-acl-q14-1006-pdf), and the Perception
    Encoder report takes its splits from "the original dataset websites or HuggingFace"; no Hugging
    Face copy was read or checked for being official. The denotation graph files are linked from the
    same page.
  access_basis:
    reason: The only official route to the images and captions is a request form on the dataset
      page, and use is limited to non-commercial research and teaching.
    source: src-illinois-denotationgraph
    quote: Please fill in the following form to request access to the Flickr 30k Dataset and the
      Denotation Graph.
  refresh: static
  refresh_basis:
    reason: One release of 31,783 images and 158,915 captions, the counts the 2014 paper and the
      dataset page give; no later edition or revision is recorded by any source read.
    source: src-illinois-denotationgraph
    quote: we have created an image caption corpus consisting of 158,915 crowd-sourced captions
      describing 31,783 images
  data_provenance:
    - web-scraped
    - crowd-authored
    - inherited-from-constituents
  data_provenance_note: The photographs were harvested from Flickr; the captions were written for
    the dataset by crowd workers following the Flickr 8k annotation guidelines (Amazon Mechanical
    Turk, src-arxiv-1412-2306-v2, "each is annotated with 5 sentences using Amazon Mechanical
    Turk"). The Flickr 8k corpus, its 8,092 images with their captions, is included whole
    (src-illinois-denotationgraph, "This is an extension of our previous Flickr 8k Dataset.").
  data_provenance_source: src-acl-q14-1006-pdf
  data_provenance_quote: consists of 31,783 photographs of everyday activities, events and scenes
    (all harvested from Flickr) and 158,915 captions (obtained via crowdsourcing)
  contamination_risk: high
  contamination_risk_note: The test images are public Flickr photographs and their captions have
    been distributed since 2014, so web-scale image-text training sets can hold either. SigLIP 2
    reports that one compared model (DFN) was trained on data filtered by a network fine-tuned on
    Flickr, among others. The Perception Encoder report fine-tunes its language models on Flickr30k
    Entities, whose boxes are drawn on these same images; whether its training images include the
    retrieval test images is not stated.
  contamination_evidence:
    - source: src-arxiv-2502-14786-v1
      stance: supports
      quote: uses a network fine-tuned on ImageNet, COCO, and Flickr (i.e. the main benchmarks in
        Table 1) as a filter to improve data quality
    - source: src-arxiv-2504-13181-v2
      stance: supports
      quote: In our SFT data, we have VisualGenome [60], DCI [139], and Flickr30K [103] as grounding
        datasets
  dataset_licence: null
  dataset_licence_note: No licence is stated for the captions or the denotation graph. The dataset
    page provides the data only for non-commercial research or teaching
    (src-illinois-denotationgraph, "They are solely provided at the link below for researchers and
    educators who wish to use the dataset for non-commercial research and/or educational
    purposes."). The paper's own licence (CC BY-NC-SA 3.0, the Anthology's for pre-2016 papers)
    covers the article, not the data.
  upstream_licences: The images are Flickr users' photographs. The dataset page says the maintainers
    do not own their copyright and that their use must follow the Flickr Terms of Use; the paper
    says almost all of the images it added to Flickr 8k's are under a Creative Commons licence
    (src-acl-q14-1006-pdf, "made available under a Creative Commons license").
  upstream_licences_source: src-illinois-denotationgraph
  upstream_licences_quote: Use of the images must abide by the Flickr Terms of Use.
  size:
    - count: 31783
      unit: images
      source: src-acl-q14-1006-pdf
      quote: consists of 31,783 photographs of everyday activities, events and scenes (all harvested
        from Flickr) and 158,915 captions (obtained via crowdsourcing)
    - count: 158915
      unit: captions, five per image
      source: src-illinois-denotationgraph
      quote: we have created an image caption corpus consisting of 158,915 crowd-sourced captions
        describing 31,783 images
    - count: 1000
      unit: test images (each with its five captions)
      subset: 1,000-image test split of arXiv 1412.2306, with 1,000 validation images and the rest
        for training
      source: src-arxiv-1412-2306-v2
      quote: For Flickr8K and Flickr30K, we use 1,000 images for validation, 1,000 for testing and
        the rest for training
  size_note: The approximate entailment subset's sizes are given under subsets. The arXiv 1412.2306
    paper rounds the corpus to 31,000 images.
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: University of Illinois at Urbana-Champaign (the defining paper's natural language
    processing group), which distributes the data from its dataset page
  maintainer_basis:
    reason: The paper releases its code, data set and denotation graph from the University of
      Illinois NLP group's site, and the dataset page that holds the request form is on an Illinois
      host. The 1,000-image split is the arXiv 1412.2306 authors', at another university; its
      authors publish no Flickr30k data of their own in the sources read.
    source: src-acl-q14-1006-pdf
    quote: are available for research purposes at http://nlp.cs.illinois.edu/ Denotation.html
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: There is no leaderboard, results page or submission route; every result
    read is in the reporting team's own paper.
  submission_process_source: src-arxiv-2504-13181-v2
  submission_process_quote: for zero-shot classification and retrieval benchmarking. The benchmark
    datasets and splits are obtained from the original dataset websites or HuggingFace.
  independence_flags: []
  independence_flags_note: None recorded. The paper's acknowledged support is from the National
    Science Foundation only, and with no board there is no ranking for the maintainers to compete
    on. The 2025 reports read are from companies scoring their own models in their own papers, which
    is a fact about those results, not about the benchmark's governance.
  independence_flags_source: src-acl-q14-1006-pdf
  independence_flags_quote: We gratefully acknowledge the support of the National Science Foundation
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Once the data is obtained, retrieval recall and the captioning metrics are computed from
      the system's rankings or captions and the stored captions, with no human, physical or
      maintainer-only step.
    source: src-arxiv-1412-2306-v2
    quote: Recall@K, which measures the fraction of times a correct item was found among the top K
      results
  harness_availability: reference-implementation-only
  harness: CLIP_benchmark (LAION-AI/CLIP_benchmark, a third-party evaluation package with a
    flickr30k zero-shot retrieval dataset option), the harness the Perception Encoder report names
  harness_note: The maintainers publish no code that scores retrieval or captioning; the code on the
    dataset page builds the denotation graph. CLIP_benchmark is not designated by the maintainers,
    and papers also use their own code (arXiv 1412.2306 scores captions with the coco-caption code),
    so no harness produces an official score.
  harness_source: src-github-clip-benchmark-readme
  harness_quote: For Flickr-30k (zero-shot retrieval) - `clip_benchmark eval --model
    xlm-roberta-base-ViT-B-32 --pretrained laion5b_s13b_b90k --dataset=flickr30k
  code_licence: null
  code_licence_note: The maintainers publish no scoring code. CLIP_benchmark's licence is MIT
    (GitHub's licence metadata, src-github-clip-benchmark-readme).
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the test split (the 1,000-image split of arXiv 1412.2306, or another; Recall@K
  # falls as the gallery grows), whether the model was trained or fine-tuned on Flickr30k's train split or scored
  # zero-shot after web-scale pretraining, and the harness, which fixes the split, the caption handling and the
  # tie-breaking. Which directions and which K a paper reports also varies (SigLIP 2 gives Recall@1 only).
  material_extra:
    - subset_used
    - training_data_policy
    - harness
aggregation_policy: unknown
aggregation_policy_note: The sources read report each direction and each K apart, and no maintainer
  or paper read defines a combined score.

homepage: https://shannon.cs.illinois.edu/DenotationGraph/
dataset_url: https://shannon.cs.illinois.edu/DenotationGraph/

subsets:
  - id: flickr30k#text-to-image-retrieval
    label: Text-to-image retrieval (image search)
    items: 1000
    scored_separately: true
    evidence:
      - source: src-arxiv-2504-13181-v2
        quote: Flickr-30k txt→img [157] Flickr-30k img→txt [157]
      - source: src-arxiv-1412-2306-v2
        quote: retrieve items in one modality given a query from the other by sorting based on the
          image-sentence score
    notes: Each test caption is a query against the test images, and a hit is its own image in the
      top K. Items are the 1,000 test images of arXiv 1412.2306's split; the queries are their
      captions.
  - id: flickr30k#image-to-text-retrieval
    label: Image-to-text retrieval (image annotation)
    items: 1000
    scored_separately: true
    evidence:
      - source: src-arxiv-2504-13181-v2
        quote: Flickr-30k txt→img [157] Flickr-30k img→txt [157]
    notes: Each test image is a query against the test captions, and a hit is any of its own five
      captions in the top K. Items are the 1,000 test images.
  - id: flickr30k#captioning
    label: Image captioning
    items: 1000
    scored_separately: true
    domain_override:
      primary: multimodal/any-to-any-generation
    capability_override:
      - generation-fidelity
    evidence:
      - source: src-arxiv-1412-2306-v2
        quote: Evaluation of full image predictions on 1,000 test images.
      - source: src-arxiv-1412-2306-v2
        quote: We report the BLEU [44], METEOR [7] and CIDEr [53] scores computed with the
          coco-caption code
    notes: A sentence generated for each test image, scored against its five captions. No 2025 or
      2026 source read reports Flickr30k captioning.
  - id: flickr30k#approximate-entailment
    label: Approximate entailment (the defining paper's task)
    items: 38000
    scored_separately: true
    domain_override:
      primary: language/understanding
    evidence:
      - source: src-acl-q14-1006-pdf
        quote: an approximate entailment recognition task for our domain, where the goal is to
          decide whether the hypothesis (a brief image caption) refers to the same image as the
          premises (four longer captions)
      - source: src-acl-q14-1006-pdf
        quote: The training items are generated from the captions of 25,000 images, and the test
          items are generated from a disjoint set of 3,000 images.
      - source: src-acl-q14-1006-pdf
        quote: The VP data set consists of 290,000 training items and 16,000 test items, while the S
          data set consists of 400,000 training items and 22,000 test items.
      - source: src-acl-q14-1006-pdf
        quote: 'Table 2: Test accuracy on Approximate Entailment.'
    notes: Text-only. A short caption or phrase from the denotation graph is judged against four
      captions of one image, half the items positive, and scored by accuracy, in a verb-phrase set
      (16,000 test items) and a sentence set (22,000); items are the two test sets together. The
      paper's other evaluation, STS 2012, uses another corpus's sentences and is not a subset. No
      source read after 2014 reports this task.
subsets_note: The two retrieval directions are reported side by side and the captioning subset
  shares their split. The entailment subset is the 2014 paper's own evaluation, kept to record what
  that paper scored ("Half of the items in each set are positive", src-acl-q14-1006-pdf).

lineage:
  role: root
  forks:
    # Same images and captions, new annotations and a new task, by another author group (one author in
    # common). The id is the slug the fork would take; no entry is allocated here (04 S3).
    - id: flickr30k-entities
      maintainer: The Flickr30k Entities authors (arXiv 1505.04870)
      source: src-arxiv-1505-04870
      quote: This paper presents Flickr30k Entities, which augments the 158k captions from Flickr30k
        with 244k coreference chains

tags:
  - image-text-retrieval
  - image-captioning
  - vision-language
  - recall-at-k
  - flickr

# --- Curation --------------------------------------------------------------------------------

curation:

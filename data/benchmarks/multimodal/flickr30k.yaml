  sources_note: >
    The TACL paper (a DOI, not archived) read from its Anthology PDF with narrow windows that keep the
    author block, e-mail line, action editor and the figure captions describing people out, and its Anthology
    page for the venue and licence; the Illinois dataset page, withheld because it names the authors and
    quotes captions of a dataset photograph; arXiv 1412.2306's v2 PDF and abstract page for the 1,000-image
    split and the protocols; Flickr30k Entities' abstract page for the fork; SigLIP 2 and Perception Encoder
    (DOIs, not archived) as 2025 evidence of use; and CLIP_benchmark's README, pending archive. The request
    form was not opened and no dataset media was fetched.
  confidence: medium
  review_checks:
    - check: Primary domain. multimodal/cross-modal-retrieval is chosen by what is scored as the
        benchmark is used, retrieval in both directions on the 1,000-image split. The defining paper
        scores only text-only tasks, so a reading by the defining paper would give
        language/understanding; the entry records that task as a subset with a language override
        instead.
      field: domain
      source: src-acl-q14-1006-pdf
      quote: Although the aim of this paper is to show their utility for a purely linguistic task,
        we believe that they should also be of great interest for people who aim to build systems
        that automatically associate image with sentences that describe them
    - check: Captioning is secondary (any-to-any-generation) on the evidence of arXiv 1412.2306
        alone; no 2025-2026 source read reports Flickr30k captioning. If current captioning use is
        found, the secondary stands; if not, it may belong only to the subset.
      field: domain.secondary
    - check: The 1,000-image test split is arXiv 1412.2306's, not the maintainers'. Neither 2025
        report names the split it scores; SigLIP 2 says only "Flickr" with no reference, and
        Perception Encoder takes splits from the dataset sites or Hugging Face. That both use the
        1,000-image split is the field's convention, not a quoted fact.
      field: as_used
      source: src-arxiv-2504-13181-v2
      quote: for zero-shot classification and retrieval benchmarking. The benchmark datasets and
        splits are obtained from the original dataset websites or HuggingFace.
    - check: data.access gated-registration rests on the dataset page's request form, which was not
        opened, so whether approval is automatic is unknown. The paper calls the data freely
        available, and unofficial copies are widely used; if an official ungated copy exists, the
        value is fully-open.
      field: data.access
      source: src-acl-q14-1006-pdf
      quote: Both of these resources are freely available
    - check: Recall@K is filed as classification-metric, following obliqa's Recall@10. Each query is
        a hit or a miss and the score is their mean, so exact-match may be argued; the score also
        depends on gallery size, which no evaluation-method term records.
      field: evaluation_method
      source: src-arxiv-1412-2306-v2
      quote: Note that the 5000 images numbers are lower since Recall@K is a function of test set
        size
    - check: observed_subjects task-specific-supervised-model for zero-shot contrastive encoders
        (SigLIP 2, Perception Encoder), trained for image-text matching on web data and scored as
        trained. No subject term names a pretrained embedding model scored zero-shot; base-model and
        instruction-tuned-model both assume a generative model.
      field: observed_subjects
    - check: Flickr30k Entities is recorded as a fork with an unallocated slug. It shares one author
        and the university with Flickr30k, so whether it is another maintainer's derivative or a
        same-group variant (04 S4) is a call for the reviewer. Flickr 8k, which Flickr30k contains,
        and the translated Flickr30k-200 set that CLIP_benchmark offers are not recorded in lineage.
      field: lineage.forks
      source: src-github-clip-benchmark-readme
      quote: For Flickr30k-200 dataset, which has 1000 captions from Flickr30k dataset translated to
        200 languages
    - check: contamination_risk high rests on public test images and captions and on SigLIP 2's note
        that a compared model's data filter was fine-tuned on Flickr. Whether the Flickr30k Entities
        data in the Perception Encoder's fine-tuning includes the retrieval test images is not
        stated.
      field: data.contamination_risk
    - check: lifecycle active. Recall@5 and @10 for the strongest encoders may be near the ceiling
        on the 1,000-image split, which would argue for saturated, but the flattened tables in the
        2025 PDFs could not be read column by column and no source states it.
      field: lifecycle
    - check: released is null because the paper gives only "2/2014". The dataset page predates the
        TACL issue (it still says "to appear"), so the data may have been out earlier.
      field: released

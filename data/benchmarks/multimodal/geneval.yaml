  review_checks:
    - check: GenEval 2 and GenEval++ are treated as separate benchmarks by other maintainers and
        given no ids (lineage_note). Both take GenEval's name, and GenEval 2 keeps its templated
        design and task kinds, so a reviewer may prefer fork records once ids are allocated; neither
        shares GenEval's prompts, scorer or authors. GenEval 2's paper and GenEval++'s Echo-4o paper
        were read only for these lines; their own repositories were not.
      field: lineage
      source: src-arxiv-2512-16853
      quote: we introduce a new benchmark, GenEval 2, with improved coverage of primitive visual
        concepts and higher degrees of compositionality
    - check: GenEval 2 calls its skill set a similar-but-expanded version of GenEval's (40 objects,
        20 from COCO; 18 attributes; 9 relations; counts 2 to 7), which is the strongest case for
        treating it as GenEval's successor in the same family. It has a different maintainer and no
        shared items, so 04 S4 makes it a new benchmark with a lineage link either way.
      field: lineage
      source: src-arxiv-2512-16853-v1
      quote: GenEval 2 evaluates a similar-but-expanded set of skills compared to GenEval
    - check: GenEval++ (280 prompts, GPT-4.1 judge) is a successor by the Echo-4o authors that is
        cited by its own name. Whether it warrants an entry depends on uptake outside the Echo-4o
        paper, which was not searched.
      field: lineage
      source: src-arxiv-2508-09987-v1
      quote: GenEval++ incorporates an automated evaluator powered by GPT-4.1 and significantly
        increases the difficulty and compositional complexity of test instructions
    - check: lifecycle stays active because GenEval is still reported in 2026. The GenEval 2 authors
        argue it has been saturated for over a year by human judgment, with the automated score
        under-crediting recent models by up to 17.7 points, so measured headroom on the automated
        score (top 0.91 in May 2026) understates how saturated it is. saturated is derived and
        cannot be hand-set; a reviewer may want the drift recorded as a contamination or validity
        note elsewhere.
      field: lifecycle
      source: src-arxiv-2512-16853-v1
      quote: showing that GenEval is effectively saturated today, and has been for over a year
    - check: The scorer's validity is model-dependent. The detector was trained on COCO photographs,
        the paper reports it failing on artistic renders and merged objects, and the GenEval 2 audit
        finds it unreliable on recent models' images. Scores across model generations may therefore
        not be comparable, which no condition field records.
      field: evaluation_method
      source: src-arxiv-2512-16853-v1
      quote: which are no longer reliable for evaluating recent T2I models
    - check: Prompt rewriting before generation is now common and moves scores by several points,
        and current reports often do not say whether they used it (SenseNova-U1 does not).
        prompt_template_hash is the nearest condition field; a dedicated rewriting flag may be
        needed.
      field: comparability.material_extra
      source: src-arxiv-2512-16853-v1
      quote: in addition to images generated based on rewritten prompts for the 6 of these T2I
        models trained with rewriting techniques
    - check: maintainer_type individual rests on the repository's personal-account owner (GitHub
        API), with academic-lab arguable on the University of Washington authorship. The README and
        the API record are not archived because the account is named for an author.
      field: governance.maintainer_type
    - check: One author lists LAION, whose LAION-5B indexes the retrieval baseline and trained the
        Stable Diffusion models the paper scores; no flag was set, since no LAION system is an
        entrant. A reviewer may judge otherwise.
      field: governance.independence_flags
      source: src-arxiv-2310-11513-v1
      quote: We also compare these models against a baseline of real images from LAION-5B
    - check: generation-fidelity is the only capability. instruction-following was rejected because
        the paper does not claim it, although third parties (Echo-4o) describe GenEval that way, and
        compositional-generalization because no held-out-arrangement claim is made.
      field: capability

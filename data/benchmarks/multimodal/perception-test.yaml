subsets:
  - id: perception-test#mc-vqa
    label: Multiple-choice video question-answering
    items: 38060
    scored_separately: true
    capability_override:
      - perception
      - memory-retention
      - temporal-reasoning
    evidence:
      - source: src-arxiv-2305-13786-v2
        quote: Performance is evaluated by measuring top-1 accuracy.
    notes: Three options, one correct, scored by top-1 accuracy, with diagnostics per skill area
      (Memory, Abstraction, Physics, Semantics) and type of reasoning. In the paper the best
      zero-shot model, SeViLA, scored 46.2% on validation against the humans' 91.4%. Items are the
      pairs across all splits.
  - id: perception-test#mc-vqa-unified-additions
    label: Unified video QA additions (2025-2026)
    parent: perception-test#mc-vqa
    items: 1842
    scored_separately: true
    evidence:
      - source: src-arxiv-2601-06287
        quote: the unified video QA track introduced a novel subset that reformulates traditional
          perception tasks (such as point tracking and temporal action localisation) as
          multiple-choice video QA questions
      - source: src-evalai-perception-test-challenge-2547
        quote: 1842 questions (with 5 options)
    notes: Five options each, on videos derived from the originals with markers inpainted, and no
      training examples. A valid 2025 or 2026 submission answers these and the original test
      questions together.
  - id: perception-test#grounded-vqa
    label: Grounded video question-answering
    items: 6086
    scored_separately: true
    domain_override:
      primary: multimodal/visual-grounding
      secondary:
        - multimodal/video-language
    capability_override:
      - perception
      - grounding
    evidence:
      - source: src-arxiv-2305-13786-v2
        quote: The answers are object tracks defined throughout the video and we use HOTA [40]
          metrics to evaluate performance.
    notes: A language question whose answer is one or more of the video's object tracks, scored by
      HOTA. The paper's baseline, MDETR detections tracked by Stark, scored 0.1.
  - id: perception-test#object-tracking
    label: Single object tracking
    items: 189940
    scored_separately: true
    domain_override:
      primary: vision/video-understanding
    capability_override:
      - perception
    evidence:
      - source: src-arxiv-2305-13786-v2
        quote: It is defined as the average IoU over the entire track between the predicted and the
          ground-truth boxes
      - source: src-arxiv-2305-13786-v2
        quote: we use intersection as a metric for tracking
    notes: Track each annotated object from a given box through the video, occlusions included,
      scored by average IoU against boxes annotated at 1 fps; in the cups-game videos the hidden
      object is scored by intersection. Items are object tracks; the challenges used subsets of the
      validation and test splits.
  - id: perception-test#point-tracking
    label: Single point tracking
    items: 8647
    scored_separately: true
    domain_override:
      primary: vision/image-matching-correspondence
      secondary:
        - vision/video-understanding
    capability_override:
      - perception
    evidence:
      - source: src-arxiv-2305-13786-v2
        quote: Performance is evaluated using the recently proposed average Jaccard metric
    notes: Follow given points on object surfaces through the video, annotated on every frame (30
      fps) in 145 videos, scored by average Jaccard over position and occlusion, TAP-Vid's protocol.
      Items are point tracks.
  - id: perception-test#action-localisation
    label: Temporal action localisation
    items: 73503
    scored_separately: true
    domain_override:
      primary: vision/video-understanding
    capability_override:
      - perception
      - temporal-reasoning
    evidence:
      - source: src-arxiv-2305-13786-v2
        quote: Given a video, the model predicts potentially overlapping temporal 1d-segment
          covering the actions/sounds and classifies them using a fixed set of labels.
    notes: 63 templated action classes, scored by mAP over classes at temporal IoU thresholds. The
      paper fine-tuned ActionFormer on the training split, since no zero-shot model existed. Items
      are action segments.
  - id: perception-test#sound-localisation
    label: Temporal sound localisation
    items: 137128
    scored_separately: true
    domain_override:
      primary: audio-speech/audio-event-detection-localization
    capability_override:
      - perception
      - temporal-reasoning
    evidence:
      - source: src-arxiv-2305-13786-v2
        quote: for action and sound localisation, such models do not exist in the literature, so
          fine-tuning on our set of classes was necessary
    notes: 16 sound classes, scored like action localisation. Video and audio are both inputs, and
      the paper's best baseline used both. Items are sound segments.
subsets_note: The six tasks are the paper's computational tasks, each with its own metric and, in
  2023 and 2024, its own challenge server; the 2025 joint tracking and joint localisation tracks

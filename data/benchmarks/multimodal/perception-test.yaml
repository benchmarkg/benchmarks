    - src-arxiv-2305-13786
    - src-deepmind-perception-test-blog
    - src-github-perception-test-readme
    - src-perception-test-challenge-2023-site
    - src-perception-test-challenge-2024-site
    - src-perception-test-challenge-2025-site
    - src-perception-test-challenge-2026-site
    - src-evalai-perception-test-challenge-2091
    - src-evalai-perception-test-challenge-2547
    - src-arxiv-2601-06287
    - src-arxiv-2506-09985
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, with windows that keep the corresponding
    author's address out; its abstract page for the venue; DeepMind's launch post and the four
    challenge pages with scripts and styles stripped; the README at main; EvalAI's JSON records of
    challenges 2091 and 2547, whose descriptions hold an organiser's personal address, so both are
    withheld from archiving, as is the 2024 challenge page for its contact line; the 2025 challenge
    report's abstract page (2026); and V-JEPA 2's abstract page as evidence of outside use. The
    records and phase lists of the other 20 Perception Test challenges on EvalAI were read for dates
    only and are not cited.
  confidence: medium
  review_checks:
    - check: Identity. One entry for the benchmark, with the challenges as versions and the
        2025-2026 unified additions as a subset. Tracks on other data (hour-long video QA in 2024
        and 2025, KilometerVision and KilometerAudio in 2026, the 2025 interpretability and guest
        tracks) are left out; the 2026 challenge is half such tracks.
      field: versions
      source: src-perception-test-challenge-2026-site
      quote: 'NEW this year: KilometerVision track probing spatial intelligence in walking tour videos'
    - check: Primary domain multimodal/video-language rests on the headline task and the benchmark's
        framing for multimodal video models; four of the six tasks are scored inside one modality
        and carry vision or audio leaves through domain_override.
      field: domain
      source: src-arxiv-2305-13786-v2
      quote: Human baseline results compared to state-of-the-art video QA models show a substantial
        gap in performance (91.4% vs 46.2%)
    - check: Vision has no tracking leaf. Object tracking is put under video-understanding and point
        tracking under image-matching-correspondence (corresponding points across frames); grounded
        video QA is visual-grounding with video-language secondary.
      field: subsets
    - check: 2023, 2024 and 2026 are recorded as non-breaking track-sets and only 2025 as an
        edition, on the evidence that the README lists one set of challenge video IDs; no source
        says outright that the 2024 tracks reused the 2023 test subsets.
      field: versions
      source: src-github-perception-test-readme
      quote: Since some of the challenges use subsets of the benchmark
    - check: activity between-rounds rather than closed. Four yearly rounds ran, but no fifth is
        announced and the last server closed eight days before this reading.
      field: activity
      source: src-evalai-perception-test-challenge-2547
      quote: '"end_date":"2026-10-06T23:59:59Z"'
    - check: maintainer-competes-on-own-benchmark rests on Flamingo, a baseline in the defining
        paper whose own paper shares authors with this one, not on a maintainer's challenge entry.
      field: governance.independence_flags
      source: src-arxiv-2305-13786-v2
      quote: Antoine Miech, Iain Barr
    - check: publication-gated is not tagged. Whether the technical report is a condition of ranking
        or only of prizes is not stated plainly.
      field: governance.submission_process
      source: src-evalai-perception-test-challenge-2091
      quote: Participants need to submit a technical report
    - check: memory-retention and temporal-reasoning rest on the skill-area diagnostics and the
        localisation metric; causal-reasoning, spatial-reasoning and abstraction were rejected,
        although the paper names Physics and Abstraction as skill areas. Each subset's
        capability_override deliberately drops the terms its task does not test (grounding outside
        grounded QA, memory-retention outside multiple-choice QA), which the validator warns about.
      field: capability
    - check: harness reference-implementation-only. The notebooks compute each task's metric on
        validation, but the servers' test scoring code is not in the repository.
      field: execution.harness_availability
    - check: data_provenance has crowd-authored for the labels; the research team designed the
        scripts and questions, which might add expert-authored.
      field: data.data_provenance

# data/benchmarks/multimodal/perception-test.yaml
#
# P1-S8-T08, multimodal entry 6 of 6. Filled from the Perception Test paper, arXiv 2305.13786 read as its v2 PDF
# (2023-10-30, NeurIPS 2023 Datasets and Benchmarks), and its abstract page; Google DeepMind's launch post
# (2022-10-12); the repository README at main; the four challenge pages, 2023 to 2026 (scripts and styles
# stripped); EvalAI's public records of the 2023 multiple-choice video QA server (challenge 2091) and the 2025
# unified one (2547), read beside the records and phase lists of all 22 Perception Test challenges on EvalAI; the
# abstract page of the 2025 challenge report (arXiv 2601.06287); and the abstract page of V-JEPA 2 (arXiv
# 2506.09985), a 2025 result. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# The entry is the benchmark: its six tasks are subsets and the yearly challenges are versions. Challenge tracks on
# other data are not included: hour-long video QA (2024, 2025), KilometerVision and KilometerAudio (2026), the 2025
# interpretability track and the 2025 guest tracks KiVA and Physics-IQ.

id: perception-test
name: Perception Test
aliases:
  - PerceptionTest
  - Perception Test Challenge
tagline: 11.6k scripted real-world videos with audio and six tasks, from point tracking to video QA,
  for multimodal video models.
description: >
  A diagnostic benchmark from Google DeepMind for multimodal video models: 11,609 real-world videos
  with audio, 23 seconds on average, filmed by about 100 crowd-sourced participants following 37
  scripts the research team designed to probe memory, abstraction, physics and semantics. Six
  annotation types define six tasks: single object tracking (average IoU), single point tracking
  (average Jaccard), temporal action and temporal sound localisation (mAP over temporal IoU),
  multiple-choice video QA with three options (top-1 accuracy), and grounded video QA, whose answers
  are object tracks (HOTA). Models are meant to be evaluated zero-shot, few-shot or after limited
  fine-tuning on a small training split (about 20% of the videos); the validation split (about 50%)
  is public with its labels, and the held-out test split's labels stayed with the maintainers'
  evaluation servers. Yearly challenges on EvalAI ran at ICCV 2023, ECCV 2024, ICCV 2025 and ECCV
  2026. From 2025 the tracks were consolidated, and the unified video QA track added 1,842
  five-option questions that recast point tracking and action localisation as video QA. Each task is
  scored on its own. The paper's human baseline reaches 91.4% on multiple-choice QA, against 46.2%
  for the best zero-shot model it tested.
self_description:
  source: src-deepmind-perception-test-blog
  quote: a multimodal benchmark using real-world videos to help evaluate the perception capabilities
    of a model
external_ids:
  arxiv: '2305.13786'
paper:
  title: 'Perception Test: A Diagnostic Benchmark for Multimodal Video Models'
  arxiv: '2305.13786'
  version_read: v2
  source: src-arxiv-2305-13786-v2
released: 2022-10-12
released_note: Google DeepMind's launch post, which made the benchmark public with its train and
  validation splits. The paper's first arXiv version followed on 2023-05-23, and the held-out test
  split came out with the first challenge's servers in August 2023.
released_source: src-deepmind-perception-test-blog
released_quote: October 12, 2022 Research Measuring perception in AI models
release_venue: NeurIPS 2023 Datasets and Benchmarks Track
release_venue_source: src-arxiv-2305-13786
release_venue_quote: NeurIPS 2023) Track on Datasets and Benchmarks

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: multimodal/video-language
  secondary:
    - multimodal/visual-grounding
    - vision/video-understanding
    - vision/image-matching-correspondence
    - audio-speech/audio-event-detection-localization
domain_basis:
  reason: The benchmark is built for multimodal video models, and its headline result is
    multiple-choice video QA, where a question and three options in text are answered about the
    video and its audio. What is scored is whether the answer corresponds to the video, which
    multimodal's inclusion test admits and vision's exclusion test sends away ("a question answered
    about an image"); vision/video-understanding's own distinction sends a video benchmark posed as
    question answering to video-language. Four of the six tasks are scored inside one modality
    (object and point tracking and action localisation on the video, sound localisation on the
    audio), so those subsets carry their own domain_override and their leaves are secondary here, as
    is visual-grounding for grounded video QA, which binds a language question to object tracks. The
    2025 and 2026 challenges recast tracking and localisation as multiple-choice video QA, and
    outside work reports the benchmark as a video QA task (V-JEPA 2).
  source: src-arxiv-2305-13786-v2
  quote: Human baseline results compared to state-of-the-art video QA models show a substantial gap
    in performance (91.4% vs 46.2%)
domain_considered_and_rejected:
  - term: multimodal/audio-language
    reason: Audio is an input to every task and sound localisation is scored, but no task scores a
      correspondence between audio and language; sounds are labelled from a fixed list of 16
      classes.
    source: src-arxiv-2305-13786-v2
    quote: label them from a list of 16 audio segment labels
  - term: audio-speech/audio-event-understanding
    reason: Sound localisation is scored on when each sound starts and ends, not only on which
      sounds are present, which the detection-localization leaf's distinction claims.
capability:
  - perception
  - grounding
  - memory-retention
  - temporal-reasoning
capability_basis:
  perception:
    reason: Every task gives the model a video with its audio and scores what it recovers from them,
      whether box or point tracks, labelled temporal segments, a chosen answer or answer tracks.
    source: src-arxiv-2305-13786-v2
    quote: the model receives a video with audio, plus a task-specific input
  grounding:
    reason: Grounded video QA scores whether the object tracks a model returns are the ones a
      language question refers to; the question takes the place of a class label.
    source: src-arxiv-2305-13786-v2
    quote: with the conditioning given as a language task or question as opposed to a class label
  memory-retention:
    reason: The Memory skill area asks about objects and events separated from the moment they
      matter by intervening footage, such as what changed on a table after the camera looked away,
      and the paper reports multiple-choice scores per skill area.
    source: src-arxiv-2305-13786-v2
    quote: The camera is filming a table, then looks away for a few seconds, then looks back at the
      table.
  temporal-reasoning:
    reason: Action and sound localisation are scored on when segments start and end, by mAP over
      temporal IoU with the reference segments, the case the term's DCASE example admits; Memory
      questions also ask for the order in which things happened.
    source: src-arxiv-2305-13786-v2
    quote: based on temporal IoU between predicted and ground truth temporal segments
capability_considered_and_rejected:
  - term: causal-reasoning
    reason: Counterfactual questions exist, but they are 733 of the 38,060 multiple-choice pairs,
      drawn from 5 unique questions, and the paper's example turns on reordering written letters
      rather than on the effect of an intervention.
    source: src-arxiv-2305-13786-v2
    quote: Counterfactual 733 (5)
  - term: spatial-reasoning
    reason: Physics questions include spatial relations and containment, but no spatial subset is
      scored apart from the Physics area, which mixes them with stability, collisions and
      conservation.
  - term: abstraction
    reason: The Abstraction area holds counting, feature matching and pattern discovery, whose
      patterns are shown in the video and only have to be found or continued; no new representation
      is asked for.
  - term: transfer-learning
    reason: The paper probes pre-trained models for their transfer, but the benchmark neither trains
      on one task and scores another nor reports a transfer quantity; the small training split holds
      the same tasks.
  - term: sample-efficiency
    reason: The training split is deliberately small and few-shot use is allowed, but no sample
      budget is fixed and scored; shots are a setting reported beside the score.

evaluation_method:
  - multiple-choice
  - domain-metric
evaluation_method_basis:
  reason: Multiple-choice video QA picks one of three supplied options, so its chance baseline is
    33% (the 2025-2026 additions have five options, 20%). The other five tasks are scored by vision
    metrics, each on its own -- average IoU for object tracks, average Jaccard for point tracks, mAP
    over temporal IoU for action and sound segments, and HOTA for grounded QA's answer tracks.
  source: src-arxiv-2305-13786-v2
  quote: out of which only one is correct, and the model has to pick one answer (33% random chance)
evaluation_method_considered_and_rejected:
  - term: composite
    reason: No figure combines the tasks; each has its own metric and its own challenge server. The
      2026 Best Generalist prize judged results across tracks with no stated formula.
  - term: classification-metric
    reason: mAP over temporal IoU thresholds is a detection measure, which domain-metric's examples
      and this term's exclusion place there, not a statistic of a confusion matrix.
designed_for_subjects:
  - instruction-tuned-model
  - task-specific-supervised-model
  - human-nonexpert
designed_for_subjects_basis:
  reason: The paper's subjects are pre-trained multimodal models (Flamingo, SeViLA, GPT-4) evaluated
    zero-shot or few-shot or fine-tuned on the small training split, and the 2025-2026 rules admit
    any model, public VLM APIs included. No model then did all six tasks, so the paper's baselines
    are per-task models (SiamFC, TAP-Net, ActionFormer fine-tuned on the localisation classes), and
    the tracking and localisation tracks rank task-trained systems. The human baseline is 30
    crowd-sourced participants answering 126 questions with no training, under the same protocol.
  source: src-arxiv-2305-13786-v2
  quote: In principle, any model can be evaluated on our benchmark, either in a zero/few-shot
    setting or by fine-tuning on our limited train split.
designed_for_subjects_considered_and_rejected:
  - term: base-model
    reason: Flamingo was evaluated few-shot, but every question comes with options to choose from
      and nothing is designed for scoring raw continuations.

lifecycle: active
lifecycle_basis:
  reason: The fourth challenge's results were presented at ECCV 2026 on 9 September 2026, with
    winners in the unified multiple-choice video QA track, whose test set is the original test split
    plus the 2025 additions; outside papers also report results (V-JEPA 2, June 2025).
  source: src-perception-test-challenge-2026-site
  quote: 'Unified multiple-choice videoQA Winner: Team Njust-KMG'
activity: between-rounds
activity_note: EvalAI's 22 Perception Test challenge records (2023-2026) are all inactive when read.
  The 2023 multiple-choice video QA server (2091) stayed open as a standing server until 2026-01-31
  and the 2025 unified one (2547) until 2026-10-06; the 2026 servers closed on 2026-08-27. The
  README's newest news is the 2026 challenge, and no fifth challenge is announced in the sources
  read.
activity_basis:
  reason: The benchmark runs as yearly challenges (2023-2026). The 2026 round's results are out, no
    round is open, the last standing server closed on 2026-10-06, and no next round has a date.
  source: src-evalai-perception-test-challenge-2547
  quote: '"end_date":"2026-10-06T23:59:59Z"'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: V-JEPA 2, aligned with an 8B language model
    source: src-arxiv-2506-09985
    observed_on: 2026-10-14
    quote: 84.0 on PerceptionTest
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Crowd-sourced annotations (answers, object and point tracks, action and
  sound segments); the test split's are held by the maintainers.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The test labels behind the challenge rankings were never released and every server that
    scored them has closed, so no new test score can be produced. Anyone can score the public
    validation split, which the paper's own baselines report.
  source: src-arxiv-2305-13786-v2
  quote: An evaluation server is made available together with the videos from the held-out test
    split.

task:
  exists: true
  input:
    - a video with its audio, 23 seconds on average
    - 'the task specification: a box or points to track, a question with three options, or a question
      whose answer is object tracks'
  output: Per task -- a box track, point tracks with occlusion, labelled temporal segments of
    actions or sounds, one option, or a list of object tracks.
  scoring: Per task -- average IoU, average Jaccard, mAP over temporal IoU, top-1 accuracy or HOTA;
    validation is scored locally and test through the challenge servers.
  source: src-arxiv-2305-13786-v2
  quote: the model receives a video with audio, plus a task-specific input

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The data is public under CC BY 4.0 with no gate. With every server closed since
    2026-10-06, no route to a test score is open; the test labels have not been released.
  access_basis:
    reason: Training and validation videos and labels are public. The test videos, and for video QA
      the questions and options, came out with the challenge servers, while the test labels stayed
      with the maintainers.
    source: src-evalai-perception-test-challenge-2091
    quote: Videos with questions and answer options available now.
  refresh: versioned-releases
  refresh_basis:
    reason: The 2022 splits have not changed, and the challenges ranked the original tasks on the
      one held-out test split (the README lists one set of challenge video IDs). The one change to
      the items, the 2025 unified video QA set of 1,842 five-option questions on derived videos, was
      announced with the 2025 challenge and kept in 2026, so a claim can name it.
    source: src-perception-test-challenge-2025-site
    quote: 'NEW this year: VQA is a unified track containing regular video QAs, but also questions related
      to point tracking, object tracking, action localisation in a video QA format.'
  data_provenance:
    - real-world-instrument
    - crowd-authored
  data_provenance_note: About 100 crowd-sourced participants filmed the videos, most often on mobile
    phones, following 37 scripts the research team wrote; crowd raters drew the tracks and segments
    and answered the questions the team designed. The 2025 additions were built from these
    annotations by inpainting markers into the videos.
  data_provenance_source: src-arxiv-2305-13786-v2
  data_provenance_quote: The answers for all the questions per video were provided by crowd-sourced
    participants.
  contamination_risk: medium
  contamination_risk_note: The videos were filmed for the benchmark, so they cannot predate it on
    the web. But the validation split, about half the videos with all their labels, has been public
    since 2022, and the test videos and questions are public too. The challenge rules forbid
    training on validation or test data; nobody has assessed whether pretraining corpora hold them.
  contamination_evidence: []
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_note: Multiple-choice video QA only -- 91.4% overall accuracy from 30
    crowd-sourced participants who answered 126 questions, one random video each, with no training
    and ten answers per question. No human ceiling is given for the other five tasks.
  ceiling_anchor_type_source: src-arxiv-2305-13786-v2
  ceiling_anchor_type_quote: The overall average accuracy was 91.4%.
  dataset_licence: CC-BY-4.0
  dataset_licence_source: src-github-perception-test-readme
  dataset_licence_quote: All other materials are licensed under the Creative Commons Attribution 4.0
  size:
    - count: 11609
      unit: videos with audio, 23 s on average (2,184 train, 5,900 validation, 3,525 test)
      subset: all splits
      source: src-arxiv-2305-13786-v2
      quote: The Perception Test contains 11609 videos (with audio), 23s average length.
    - count: 3525
      unit: videos
      subset: held-out test split
      source: src-arxiv-2305-13786-v2
      quote: a held-out test split (3525 videos
    - count: 38060
      unit: multiple-choice question-answer pairs on 10,361 videos
      subset: multiple-choice video QA
      source: src-github-perception-test-readme
      quote: Multiple-choice Questions| 10,361 | 38,060
    - count: 6086
      unit: grounded question-answer pairs on 3,063 videos
      subset: grounded video QA
      source: src-github-perception-test-readme
      quote: Grounded video Questions | 3,063 | 6,086
    - count: 1842
      unit: five-option questions on 1,842 videos derived from the originals
      subset: unified video QA test additions (2025-2026)
      source: src-evalai-perception-test-challenge-2547
      quote: 1842 questions (with 5 options)

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Google DeepMind (the Perception Test team)
  maintainer_basis:
    reason: DeepMind holds the dataset and the repository (google-deepmind/perception_test) and ran
      every challenge's servers. The challenges are co-organised with Dima Damen (Bristol) and
      Andrew Zisserman (Oxford), co-authors of the paper.
    source: src-github-perception-test-readme
    quote: Copyright 2022 DeepMind Technologies Limited
  maintainer_type: industry-lab
  maintainer_type_note: conference-workshop was considered. Each challenge is an ICCV or ECCV
    workshop and its organiser list changes by year, but DeepMind researchers lead every one and
    DeepMind holds the dataset, repository and servers, which the term's exclusion sends to the
    lab's type.
  submission_process:
    - held-out-server
  submission_process_note: Each task had its own EvalAI challenge with a validation phase,
    unlimited, and a test phase, limited in number, on which the ranking was made; entrants uploaded
    prediction files, scored against the hidden test labels. The rules also ask for a short
    technical report, which the sources read tie to the awards rather than to a leaderboard place,
    so publication-gated is not tagged. Every server is closed now (activity).
  submission_process_source: src-evalai-perception-test-challenge-2091
  submission_process_quote: Participants submit their model predictions on the held-out test
    dataset.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2305-13786-v2
      quote: 'We report results for two strong recent video language models: Flamingo [3] in zero-shot
        and few-shot setups'
  independence_flags_note: Flamingo, one of the paper's two video-language baselines, comes from a
    paper (its reference [3]) that shares authors with this one, Antoine Miech and Andrew Zisserman
    among them. The rows are baselines in the defining paper, not challenge entries. Who funds the
    prizes (15K EUR in 2023, 20K in 2024 and 2026, 50K in 2025) is not stated, so
    prize-sponsored-by-industry is not tagged.
  independence_assessed: true
  participation:
    source: src-perception-test-challenge-2026-site
    quote: We received 1,439 submissions from 125 teams across the four tracks.
  participation_note: Two of the four 2026 tracks were on other data. Earlier rounds drew 475
    submissions from 63 teams (2023), 680 from 123 (2024) and 557 from 81 (2025).

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The challenge rankings are test-split scores, which only the maintainers' servers could
      compute because they hold the test labels, and those servers are closed. Validation scores,
      which the paper's baselines report, can be computed by anyone.
    source: src-deepmind-perception-test-blog
    quote: a held-out test split where performance can only be evaluated via our evaluation server
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness: The README's per-task notebooks under baselines/ (data loader, dummy baseline and metric
    for each task)
  harness_note: The official test scores were computed by the EvalAI servers, whose evaluation code
    is not in the repository, and the README still says "Metrics code to evaluate performance for
    the different tasks coming soon."
  harness_source: src-github-perception-test-readme
  harness_quote: Evaluation scripts (including data loader, dummy baseline, evaluation metrics)
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for google-deepmind/perception_test (read 2026-10-14)
    agrees; the repository was last pushed on 2026-06-19.
  code_licence_source: src-github-perception-test-readme
  code_licence_quote: All software is licensed under the Apache License, Version 2.0 (Apache 2.0)
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which task and split (validation locally, or test through the closed servers;
  # the original multiple-choice set or the 2025 unified one with its additions), the evaluation regime (zero-shot,
  # few-shot with how many shots, or fine-tuned on the training split, which the challenges asked entrants to
  # declare), and what else the model was trained on.
  material_extra:
    - subset_used
    - shots
    - training_data_policy
aggregation_policy: unknown
aggregation_policy_note: Each task is scored and ranked on its own, and no source read defines a
  figure across tasks.

homepage: https://perception-test-challenge.github.io/
repository: https://github.com/google-deepmind/perception_test


# data/benchmarks/general-intelligence/agieval.yaml
#
# P1-S11-T06, general-intelligence entry 12. Drafted in place of SimpleBench, whose own claim (everyday reasoning:
# spatio-temporal reasoning, social intelligence and trick questions) keeps its breadth inside reasoning-general, so it
# fails this family's exclusion test. Filled from the AGIEval paper, arXiv 2304.06364 read as its v2 PDF (2023-09-18),
# its abstract page and its ACL Anthology page (Findings of NAACL 2024); the repository README at commit 84ab72d
# (2024-06-13), which describes version 1.1 and carries the maintainers' results table; the README of
# lm-evaluation-harness's agieval task group at commit 314f717; and the DeepSeek-V3 Technical Report (arXiv
# 2412.19437, v2 PDF, February 2025) and the dots.llm1 Technical Report (arXiv 2506.05767, v1 PDF, June 2025) as
# evidence of current use, both Sources already on main. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: agieval
name: AGIEval
aliases:
  - 'AGIEval: A Human-Centric Benchmark for Evaluating Foundation Models'
aliases_note: The Hugging Face organisation named AGI-Eval is a different project and does not hold
  this benchmark (see review_checks).
tagline: Twenty tasks from exams written for people, from the Gaokao, SAT and LSAT to maths
  contests, in English and Chinese.
description: >
  A bilingual benchmark of objective questions from standardised exams written for human test-takers:
  the Chinese college entrance exam (Gaokao, in geography, biology, history, chemistry, physics,
  English, Chinese and maths), the SAT (English and maths), the LSAT (analytical reasoning, logical
  reasoning and reading comprehension), GRE and GMAT maths through AQuA-RAT, AMC and AIME problems
  through MATH, the Chinese civil-service exam through LogiQA (in Chinese and in English translation)
  and the Chinese lawyer qualification exam through JEC-QA. Subjective questions were removed, leaving
  multiple-choice and fill-in-the-blank items: 8,062 questions in 20 tasks in the paper's release. The
  paper reports each task beside the average and top-percentile human test-taker, estimated from the
  exams' score statistics, and evaluates zero-shot, few-shot and chain-of-thought prompting through
  the OpenAI APIs on Azure. Version 1.1 (2024) added 2023 Gaokao questions in chemistry, biology and
  physics, fixed annotations and made every multiple-choice task single-answer; the English tasks are
  unchanged. The repository's results table reports averages over the multiple-choice tasks for an
  English subset (AGIEval-en), a Chinese subset (AGIEval-zh) and all tasks.
self_description:
  source: src-arxiv-2304-06364-v2
  quote: In this paper, we introduce a human-centric benchmark AGIEval specifically designed to
    evaluate the general abilities of foundation models in tasks pertinent to human cognition and
    problem-solving.
external_ids:
  arxiv: '2304.06364'
paper:
  title: 'AGIEval: A Human-Centric Benchmark for Evaluating Foundation Models'
  arxiv: '2304.06364'
  doi: 10.18653/v1/2024.findings-naacl.149
  version_read: v2
  source: src-arxiv-2304-06364-v2
released: 2023-04-13
released_note: The paper's first arXiv version, as its abstract page dates it; v2 (2023-09-18) is
  the version read here. The data was released with the paper.
released_source: src-arxiv-2304-06364
released_quote: Submitted on 13 Apr 2023 (v1), last revised 18 Sep 2023 (this version, v2)
release_venue: 'Findings of the Association for Computational Linguistics: NAACL 2024'
release_venue_source: src-acl-2024-findings-naacl-149
release_venue_quote: 'Volume: Findings of the Association for Computational Linguistics: NAACL 2024 Month:
  June Year: 2024'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: general-intelligence/multi-subject-knowledge-exams
  secondary: []
domain_basis:
  reason: The claim is general ability across many subjects, measured with closed-ended exam
    questions scored on the answers alone, and no subject holds most of them (law, the largest, has
    the two JEC-QA tasks and the three LSAT tasks, 3,000 of 8,062 in the paper's Table 1). It passes
    the family test on breadth across fields, and no other family holds that breadth.
  source: src-arxiv-2304-06364-v2
  quote: Finally, the released AGIEval includes 20 human-centric tasks across a wide variety of
    subjects.
domain_considered_and_rejected:
  - term: general-intelligence/human-comparison-batteries
    reason: Human comparison runs through the paper (Figure 1, the abstract's headline), but the
      benchmark is built from exams written for humans, not to measure humans; the human figures are
      reported beside the results, estimated by scaling the exams' published score statistics rather
      than measured on these items. The design principles name human-level tasks and real-world
      relevance as the aim, so the claim is general ability on exam questions (see review_checks).
    source: src-arxiv-2304-06364-v2
    quote: It is worth noting that we also report the average and top performances of human
      test-takers as human-level boundaries for each task.
  - term: society-econ-law/legal-reasoning
    reason: Law is the largest subject (JEC-QA and LSAT), but under half the questions, beside
      Gaokao's eight subjects, the SAT, maths and logic; the breadth does not lie inside one family.
  - term: reasoning-general/logical-deduction
    reason: LogiQA and the LSAT's analytical and logical reasoning tasks test deduction, but they
      are a quarter of the questions and the claim is not a reasoning form studied in its own right.
  - term: language/understanding
    reason: Several tasks supply a passage (Gaokao Chinese and English, LogiQA, LSAT, SAT), but
      language is the interface for most of the set, as the language family's MMLU-Pro near miss
      says.
capability:
  - knowledge-recall
  - context-integration
  - deductive-reasoning
  - quantitative-reasoning
capability_basis:
  knowledge-recall:
    reason: The Gaokao science, history and geography tasks and the JEC-QA law tasks supply no
      passage, so the answer comes from what the system holds; the paper's error analysis scores
      knowledge recall as one of four dimensions.
    source: src-arxiv-2304-06364-v2
    quote: 'Knowledge: Assessing whether the model can accurately recall relevant external knowledge or
      formulas for problem-solving.'
  context-integration:
    reason: The reading tasks (Gaokao Chinese and English, both LogiQA tasks, the three LSAT tasks
      and SAT English) supply a passage that the answer depends on.
    source: src-github-agieval-readme
    quote: The `passage` field is available for gaokao-chinese, gaokao-english, both of logiqa, all
      of LSAT, and SAT.
  deductive-reasoning:
    reason: The LSAT's analytical and logical reasoning tasks and LogiQA, taken from the Chinese
      civil-service exam's logic questions, ask for the conclusion that follows from stated
      conditions; the paper names LSAT-AR as among the hardest tasks.
    source: src-arxiv-2304-06364-v2
    quote: Law school admission tests, such as the LSAT, are intended to measure the reasoning and
      analytical skills of prospective law students.
  quantitative-reasoning:
    reason: The two cloze tasks, Gaokao-Math-Cloze and MATH, are scored on the number or expression
      the system produces, by exact match; the other maths tasks are multiple choice.
    source: src-github-agieval-readme
    quote: AGIEval v1.1 contains 20 tasks, including 18 MCQ tasks and two cloze tasks
      (Gaokao-Math-Cloze and MATH).
capability_considered_and_rejected:
  - term: instruction-following
    reason: The zero-shot prompt asks only for the answer after the question ("Among A to D, the
      answer is:"); following a format is the interface, not what is scored.
  - term: reliability-consistency
    reason: The paper compares zero-shot, few-shot and chain-of-thought settings, which are
      conditions of a result; nothing scores agreement across repeated trials.

evaluation_method:
  - multiple-choice
  - exact-match
evaluation_method_basis:
  reason: Eighteen tasks are multiple choice, scored by accuracy on the chosen option; the two cloze
    tasks are scored by exact match against the stored answer. The paper's section 3.3.2 also names
    F1 for cloze items, but its experiments report exact match.
  source: src-arxiv-2304-06364-v2
  quote: Quantitative metrics included task-specific accuracy for multi-choice questions and use
    Exact Match (EM) for fill-in-blank questions.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The paper evaluates Text-Davinci-003, ChatGPT and GPT-4 through the completion and chat
    completion APIs, and the open Vicuna-13B, all instruction-tuned, with zero-shot, few-shot and
    chain-of-thought prompts.
  source: src-arxiv-2304-06364-v2
  quote: For TextDavinci-003, we use the completion API, and for ChatGPT and GPT-4, we use the chat
    completion API.
designed_for_subjects_considered_and_rejected:
  - term: base-model
    reason: Base models are now its main users (observed_subjects), run few-shot, but the paper
      evaluates no base model; who uses it is recorded as observed, not as the design.
  - term: reasoning-model
    reason: The paper's chain-of-thought setting is a prompt condition, not a reasoning-model
      subject, and no source read sets a reasoning budget.
observed_subjects:
  values:
    - base-model
    - instruction-tuned-model
  basis: Developers of open models report AGIEval for their pretrained base checkpoints. The
    DeepSeek-V3 report lists it among the benchmarks run on DeepSeek-V3 Base beside Qwen2.5 72B Base
    and LLaMA-3.1 405B Base, and the dots.llm1 report lists AGIEval (EM) in its base-model table.
    The repository's own runs are of GPT-3.5-Turbo and GPT-4o.
  source: src-arxiv-2412-19437-v2
as_used:
  - protocol: Model developers run AGIEval on base models in their own evaluation frameworks,
      generation-based and scored by exact match, without stating the subset, version or prompt.
    source: src-arxiv-2412-19437-v2
    quote: BBH, AGIEval, CLUEWSC, CMRC, and CMath.
    note: The DeepSeek-V3 Technical Report (v2, February 2025) puts AGIEval among its
      generation-based base-model benchmarks; the dots.llm1 report (June 2025) lists it as AGIEval
      (EM) among its English benchmarks.
  - protocol: Many reports score an English-only, multiple-choice-only selection rather than all 20
      tasks; lm-evaluation-harness ships English (agieval_en), Chinese (agieval_cn) and a
      four-family English multiple-choice group (agieval_nous) beside the full group.
    source: src-github-lm-eval-agieval-readme
    quote: '`agieval_nous`: Evaluates a specific subset of AGIEval tasks (multiple-choice and english-only)'
lifecycle: active
lifecycle_basis:
  reason: Results are still produced. Model developers report it in 2025 technical reports
    (DeepSeek-V3 in February 2025 and dots.llm1 in June 2025), although the maintainers last changed
    the repository on 2024-06-13. Whether it is saturated is derived from claims, never set here.
  source: src-arxiv-2506-05767-v1
  quote: ARC-Challenge (EM) AGIEval (EM) HellaSwag (EM)
activity: no-submission-channel
activity_basis:
  reason: The README's results table is kept by the maintainers, who list their own runs and numbers
    taken from model developers' reports; no source names a route for others to submit.
  source: src-github-agieval-readme
  quote: We report the leaderboard on AGIEval v1.1. The leaderboard contains two subsets AGIEval-en
    and AGIEval-zh. The two subset leaderboards contain only MCQ tasks.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4
    source: src-arxiv-2304-06364-v2
    observed_on: 2026-11-10
    quote: Impressively, GPT-4 achieves 93.8% accuracy on Gaokao-English and 95% accuracy on
      SAT-MATH
    note: The paper's best result (few-shot chain of thought); GPT-4 is one of the paper's four
      evaluated models.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each question's answer key, published with the questions (the label field
  for multiple choice, the answer field for cloze), from the exams and source datasets.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The questions, answers, few-shot prompts and evaluation script are in the public
    repository, and the score is computed by script from the model's outputs.
  source: src-github-agieval-readme
  quote: You can run the [post_process_and_evaluation.py](post_process_and_evaluation.py) file to
    get the evaluation results.

task:
  exists: true
  input:
    - one exam question with lettered options, or a fill-in-the-blank maths question, with a passage
      for the reading tasks; zero-shot, or after five solved examples from the same task
  output: The letter of one option, or the answer to a cloze item, optionally after a
    chain-of-thought explanation.
  scoring: Accuracy per multiple-choice task and exact match per cloze task; the paper averages over
    tasks, and the repository's results table over the multiple-choice tasks of each subset.
  tests_hidden_from_system: false
  source: src-arxiv-2304-06364-v2
  quote: 'Zero-shot Prompting Input: [Question] Among A to D, the answer is:'

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The post-processed data of both versions, answers included, is in the public GitHub
      repository, with no registration.
    source: src-github-agieval-readme
    quote: You can download all post-processed data in the [data/v1_1](data/v1_1) folder.
  refresh: versioned-releases
  refresh_basis:
    reason: The one change since release is labelled version 1.1, in its own folder beside version 1
      (data/v1 and data/v1_1, GitHub API); a claim can name the version it was measured on.
    source: src-github-agieval-readme
    quote: We have updated the dataset to version 1.1.
  data_provenance:
    - exam-derived
    - web-scraped
    - inherited-from-constituents
  data_provenance_note: Every item comes from an exam written for human test-takers. The Gaokao and
    SAT questions were collected from public web pages with their solutions; the LSAT, civil-service
    (LogiQA), lawyer-exam (JEC-QA), maths-competition (MATH) and GRE/GMAT (AQuA-RAT) items are
    reused from earlier datasets, with JEC-QA and MATH down-sampled to 1,000 each. Subjective
    questions were dropped. ChatGPT wrote the chain-of-thought demonstrations for LogiQA, JEC-QA and
    LSAT, and experts annotated those for Gaokao and SAT; those are prompts, not scored items, so
    model-generated and expert-authored do not apply.
  data_provenance_source: src-arxiv-2304-06364-v2
  data_provenance_quote: With regard to data collection, we gather Gaokao and SAT questions from
    publicly available online sources, along with their corresponding solutions or explanations.
  contamination_risk: high
  contamination_risk_note: >
    The two JEC-QA tasks (2,000 questions in the paper's release) score the first 1,000 examples of
    each JEC-QA type from JEC-QA's published training set, because its test set is not public; that is
    a protocol evaluating on data released for training, in content the benchmark still scores. The
    paper also tests six Gaokao subjects on the questions released in 2022, after GPT-4's training
    cut-off, and finds scores lower on the maths tasks (Gaokao-Math-Cloze 16.1% on the full set
    against 4% on 25 later questions), though close elsewhere. The other constituents (LSAT
    1991-2016, LogiQA, MATH, AQuA-RAT) and the Gaokao and SAT pages were public before 2023.
  contamination_risk_source: src-arxiv-2304-06364-v2
  contamination_risk_quote: For JEC-QA, given that the test set is not publicly available, we take
    the first 1,000 examples from the training set as the test set
  contamination_evidence:
    - source: src-arxiv-2304-06364-v2
      stance: supports
      quote: For JEC-QA, given that the test set is not publicly available, we take the first 1,000
        examples from the training set as the test set
    - source: src-arxiv-2304-06364-v2
      stance: against
      quote: This finding substantiates that while AGIEval may similarly encounter data
        contamination, it still retains its value
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_basis:
    reason: The paper reads results against the average test-taker of each exam (67 averaged over
      the tasks), with the top 1% (91) as a second reference; both are estimated by scaling the
      exams' score statistics to 100, or taken from the source datasets' papers, not measured on
      these items (see review_checks).
    source: src-arxiv-2304-06364-v2
    quote: Human performance (avg.) refers to the average performance of all test takers, while
      human performance (top) refers to the performance of the top 1% of test takers, except for the
      lawyer qualification test which uses the top 10%.
  dataset_licence: null
  dataset_licence_note: The README gives no licence for the data and defers to each source dataset's
    own terms; GitHub reports MIT for the repository, which the README does not extend to the
    questions.
  dataset_licence_source: src-github-agieval-readme
  dataset_licence_quote: All usage of the data should follow the license of the original datasets.
  size:
    - count: 8062
      unit: questions
      subset: version 1.0 (the paper)
      source: src-arxiv-2304-06364-v2
      quote: As a result, we construct a benchmark consisting of 8,062 questions for evaluation.
    - count: 20
      unit: tasks (18 multiple choice, 2 cloze)
      subset: version 1.1
      source: src-github-agieval-readme
      quote: AGIEval v1.1 contains 20 tasks, including 18 MCQ tasks and two cloze tasks
        (Gaokao-Math-Cloze and MATH).
    - count: 1000
      unit: questions per down-sampled constituent (MATH and each JEC-QA type)
      subset: MATH, JEC-QA-KD, JEC-QA-CA
      source: src-arxiv-2304-06364-v2
      quote: We down-sample the two types of JEC-QA and MATH to 1,000 instances each.
  size_note: Version 1.1's question count is given only in an image in the README and was not read.
  languages:
    - English
    - Chinese

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Microsoft (the AGIEval authors)
  maintainer_basis:
    reason: The paper's authors are at Microsoft, and the repository operates under Microsoft's
      open-source contribution agreement and code of conduct, although it is held under one author's
      personal GitHub account (see review_checks).
    source: src-github-agieval-readme
    quote: This project has adopted the [Microsoft Open Source Code of
      Conduct](https://opensource.microsoft.com/codeofconduct/).
  maintainer_type: industry-lab
  submission_process:
    - maintainer-run
  submission_process_note: The README's results table mixes the maintainers' own runs of
    GPT-3.5-Turbo and GPT-4o on version 1.1 with numbers the maintainers copied from model
    developers' reports and blog posts (Llama 3, Mixtral, Gemma, Phi-3, InternLM2, Qwen), some of
    them on version 1.0 and marked with an asterisk. No developer submits anything, so neither
    self-reported nor literature-only applies.
  submission_process_source: src-github-agieval-readme
  submission_process_quote: We evaluate the performance of the baseline systems (gpt-3.5-turbo and
    GPT-4o) on AGIEval v1.1.
  independence_flags: []
  independence_flags_note: Not assessed. No funding statement or evaluated-party link was read in
    the paper's text; whether any model in the README's table belongs to the maintainers'
    organisation rests on facts not in a Source read here (see review_checks).
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The paper's runs and the README's replication steps call model APIs (Azure OpenAI and
      the OpenAI API); about 8,000 short prompts per setting. Serving local weights is the entrant's
      choice, so the API path decides.
    source: src-arxiv-2304-06364-v2
    quote: All experiments were conducted using the respective language models
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Questions, answers, few-shot prompts and the evaluation script are public, and no human
      or maintainer-only step is in the scoring.
    source: src-github-agieval-readme
    quote: We provide the prompts for few-shot learning in the
      [data/few_shot_prompts](data/few_shot_prompts.csv) file.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: The repository's run_prediction.py (with openai_api.py) and
    post_process_and_evaluation.py
  harness_source: src-github-agieval-readme
  harness_quote: You can run the [post_process_and_evaluation.py](post_process_and_evaluation.py)
    file to get the evaluation results.
  harness_gotcha:
    source: src-github-agieval-readme
    quote: (Asterisk sign indicates results reported for AGIEval v1.0.)
  harness_gotcha_note: Version 1.0 and 1.1 scores share one table, and only the all-tasks zero-shot
    table marks the version; the Chinese tasks changed between them (new Gaokao questions,
    single-answer JEC-QA and Gaokao-Physics), so a v1.0 Chinese or all-tasks average is not
    comparable with a v1.1 one. Reports often score the English subset or the English
    multiple-choice selection under the name AGIEval without saying which.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for the repository, read 2026-11-10; not a quoted
    Source. The repository was last pushed on 2024-06-13 (GitHub API).
  runnable_via:
    - custom
    - lm_eval
  runnable_via_note: The repository's own scripts, and lm-evaluation-harness's agieval group, which
    has one task per AGIEval task plus SAT-English without its passage (21 in all), and the
    agieval_en, agieval_cn and agieval_nous groups.
  runnable_via_source: src-github-lm-eval-agieval-readme
  runnable_via_quote: '`agieval`: Evaluates all tasks listed below.'
  maintainer_rerun_policy: unstated

comparability:
  # The llm-static-text profile (multiple-choice and exact-match x instruction-tuned and base models) carries
  # shots, chain of thought, reasoning effort, tools, retries and the subset, which here also covers the English
  # and Chinese selections. The harness is added because it decides the prompt and the answer extraction: the
  # repository's scripts, lm-evaluation-harness's tasks, or a developer's own framework (as_used). Which version
  # was scored (1.0 or 1.1) is recorded on the claim.
  material_extra:
    - harness
aggregation_policy: official-aggregate
aggregation_policy_note: The paper averages accuracy and exact match over its tasks; the README's
  table averages the multiple-choice tasks of each subset (AGIEval-en, AGIEval-zh) and of all tasks,
  separately for few-shot and zero-shot.
aggregation_policy_source: src-github-agieval-readme
aggregation_policy_quote: We report the leaderboard on AGIEval v1.1. The leaderboard contains two
  subsets AGIEval-en and AGIEval-zh. The two subset leaderboards contain only MCQ tasks.


lineage:
  role: root
lineage_note: >
  AGIEval is its own benchmark. It reuses the items of five earlier datasets (the LSAT sets, LogiQA,
  JEC-QA, MATH and AQuA-RAT), down-sampling two of them, beside its own Gaokao and SAT collection;
  that is recorded as inherited-from-constituents provenance, not as a fork of any one. Of the five,
  only MATH has an entry (mathematics/math); its lineage is not edited here. Version 1.1 is the same
  maintainer's revision, not a separate benchmark.

tags:

# data/benchmarks/general-intelligence/lmarena.yaml
#
# P1-S11-T05, general-intelligence entry 4 of 6. Filled from the Chatbot Arena paper, arXiv 2403.04132 read as
# its v1 PDF (2024-03-07; ICML 2024), and its abstract page; arena.ai's Leaderboard Policy, FAQ, How It Works,
# About and Leaderboard Changelog pages and ten of its blog posts (the 2023 launch, style control, the reply to
# The Leaderboard Illusion, AI Evaluations, Arena-Rank, the rebrand, Max, AutoEval, Vision Arena categories and
# Hello from LMArena), all with scripts and styles stripped; the README of the lmarena-ai/leaderboard-dataset
# dataset on Hugging Face; the abstract pages of The Leaderboard Illusion (arXiv 2504.20879) and of a June 2026
# paper that scores LLM-judge ratings against LMArena's (arXiv 2606.13221); and Epoch's hub page for Text Arena
# (Coding), an existing Source. GitHub's API was read for lm-sys/FastChat and lmarena/arena-rank. The live
# leaderboard pages answer with a JavaScript challenge and were not read. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.

id: lmarena
name: LMArena
aliases:
  - Chatbot Arena
  - Arena
aliases_note: Chatbot Arena is the name the paper and the 2023-2024 platform used, LMArena the name
  from 2025, and Arena (at arena.ai) the name since 2026-01-28. Not MT-Bench or Arena-Hard, the same
  group's static, model-judged benchmarks.
tagline: Anonymous pairwise battles on the public's own prompts, ranked by Bradley-Terry ratings
  fitted to the users' votes.
description: >
  An open platform where anyone types a prompt, gets answers from two anonymous models the platform
  samples, and votes for the better one, a tie or both bad; the models' names are revealed only
  after the vote, and only anonymous votes count. Ratings are Bradley-Terry coefficients fitted to
  all votes, reweighted for uneven sampling, with confidence intervals and a rank that accounts for
  them. Launched by LMSYS at UC Berkeley in 2023 as Chatbot Arena for chat models, it now runs ten
  preference arenas (text, vision, search, document, Code Arena's WebDev, text-to-image, image edit,
  text-to-video, image-to-video and video edit), each with its own leaderboard and categories, the
  text and vision boards controlled for response style by default since May 2025. A model needs at
  least 1,000 votes to be listed, and providers may test unreleased models under codenames first.
  Since 2025 it is run by Arena Intelligence Inc., which also sells evaluations. Agent Arena (June
  2026), ranked from behavioural signals rather than votes, and the Alignment Index are not
  included here.
self_description:
  source: src-arxiv-2403-04132-v1
  quote: we introduce Chatbot Arena, an open platform for evaluating LLMs based on human preferences
external_ids:
  arxiv: '2403.04132'
paper:
  title: 'Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference'
  arxiv: '2403.04132'
  version_read: v1
  source: src-arxiv-2403-04132-v1
released: 2023-05-04
released_note: The launch post's date, with the first leaderboard (Elo ratings from April 24 to May
  1, 2023); it says the arena had opened a week before, and the paper dates data collection from
  April 2023.
released_source: src-arena-chatbot-arena-2023-blog
released_quote: Published on 4 May 2023
release_venue: ICML 2024 (the Chatbot Arena paper)
release_venue_source: src-arena-how-it-works
release_venue_quote: Original Chatbot Arena research paper (ICML 2024)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: general-intelligence/open-preference-arenas
  secondary:
    - multimodal/visual-qa
    - multimodal/any-to-any-generation
domain_basis:
  reason: The public writes the prompts, the score is a rating fitted to their pairwise votes, and
    the claim is usefulness across real uses, which the taxonomy names this leaf for. The
    secondaries are the Vision Arena (questions about uploaded images) and the five image and video
    generation arenas, each also recorded as its subset's domain_override.
  source: src-arxiv-2403-04132-v1
  quote: the user-generated questions are sufficiently diverse to encompass a wide range of LLM use
    cases
domain_considered_and_rejected:
  - term: language/dialogue
    reason: The vote covers the whole conversation and a user may keep chatting before voting, but
      the paper's data average 1.3 turns per conversation (Table 1), and the claim is usefulness
      across uses, not conducting a dialogue. The Stage-3 classification lists it (see
      review_checks).
    source: src-arxiv-2403-04132-v1
    quote: If a user cannot choose in the first turn, the user can continue chatting until
      identifying a winner.
  - term: general-intelligence/agi-composite-suites
    reason: No score combines the arenas; each publishes its own ratings.
  - term: general-intelligence/human-comparison-batteries
    reason: People are the judges, not a population the systems are measured against.
capability: []
capability_considered_and_rejected:
  - term: collaboration
    reason: The taxonomy's own near miss for this benchmark. Two models answer and a person judges
      them; they are compared, not working together.
  - term: factual-precision
    reason: Its exclusion covers a judgement that is only overall helpfulness or preference, which
      is what a vote is.
  - term: generation-fidelity
    reason: There is no reference or specification the output is compared against; users vote on
      which response they prefer.
  - term: instruction-following
    reason: Arena's categories label prompts by topic and difficulty; no source read claims the
      arena scores whether directions were obeyed apart from overall preference.

evaluation_method:
  - pairwise-preference-elo
evaluation_method_basis:
  reason: Every leaderboard number is a Bradley-Terry coefficient fitted to human A/B votes. The
    rating pool is the arena's model set at the leaderboard's publish date, and the fit itself has
    changed (versions). Since 2026-07-30 a new model can carry an AutoEval score, computed the same
    way from a reward model's proxy votes, until enough human votes arrive.
  source: src-arena-faq
  quote: Your votes directly shape the model rankings through the Bradley-Terry
evaluation_method_considered_and_rejected:
  - term: human-crowd-eval
    reason: The raters are a non-expert crowd, but its exclusion sends a head-to-head rating system
      to pairwise-preference-elo.
  - term: model-graded-judge
    reason: AutoEval's reward model casts proxy votes for models still short of human votes, and its
      scores are labelled and replaced once human votes arrive. The headline is fitted to human
      votes.
    source: src-arena-autoeval-blog
    quote: then updated once enough human votes arrive to validate them
designed_for_subjects:
  - hosted-inference-endpoint
  - generative-media-model
designed_for_subjects_basis:
  reason: Models are admitted as served (open weights, a public API or a public service) and the
    provider must keep that access open to Arena for 30 days, so the serving path is part of what is
    compared; the taxonomy gives this benchmark as hosted-inference-endpoint's example. The image
    and video arenas score generated media.
  source: src-arena-leaderboard-policy
  quote: The model is accessible via a public, global, and generally accessible API
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: The text arena expects a chat assistant, but entrants are listed per served endpoint and
      variant (reasoning settings, search and agentic variants), which the endpoint term records.
as_used:
  - protocol: The published human-derived ratings used as the reference that ratings fitted to an
      LLM judge's votes are scored against, by mean absolute error over held-out models.
    source: src-arxiv-2606-13221
    quote: bringing LLM-derived ratings within 17.9 Elo MAE of human-derived ones when averaged over
      55 held-out models on LMArena
    note: A June 2026 paper (Kargi and Salinas) on calibrated Elo estimation; evidence of current
      use as a human reference.

lifecycle: active
lifecycle_basis:
  reason: Models were added to the leaderboards on the day before this entry was read, and research
    in 2026 uses the ratings as a human reference (as_used).
  source: src-arena-leaderboard-changelog
  quote: 'muse-spark-1.3-max has been added to the Code Arena: WebDev & Text Arena leaderboards.'
activity: accepting-submissions
activity_basis:
  reason: The arena has never run in rounds. Providers bring released and unreleased models at any
    time, and a public model is listed once its rating stabilises.
  source: src-arena-leaderboard-policy
  quote: We collaborate with model providers to bring their unreleased models to our community for
    preview testing.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: mistral-large-4
    source: src-arena-leaderboard-changelog
    observed_on: 2026-10-14
    quote: mistral-large-4 has been added to the Text Arena leaderboard.
    note: Dated October 8, 2026 in the changelog.
evaluation_target: learned-system
execution_mode: human-in-loop
ground_truth_source: none
ground_truth_source_note: Preference votes, not a ground truth; the paper sets Chatbot Arena apart
  from benchmarks whose metric rests on ground truth.
ground_truth_source_source: src-arxiv-2403-04132-v1
ground_truth_source_quote: whether the evaluation metric relies on ground truth or (approximated)
  human preferences
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: A rating needs Arena's own users to cast the votes, and the full vote record is not
    released; outsiders can re-fit ratings only from the fraction that is.
  source: src-arena-faq
  quote: release full conversation logs for privacy and methodological reasons

task:
  exists: false
  input:
    - a prompt of the user's own (text; with images or PDFs in the vision and document arenas; a
      request for an image, video or web app in the generation and WebDev arenas)
  output: A response from each of the two models; the user may keep chatting with both before
    voting.
  scoring: Bradley-Terry coefficients fitted to the anonymous votes, reweighted for uneven sampling,
    reported as Arena scores with confidence intervals and an approximate rank. A model is listed
    after at least 1,000 votes. Text and vision default to style-controlled ratings.
  item_definition: >
    One battle: a prompt a user writes, answered by two anonymous models the platform samples, and
    that user's vote for one of them, a tie or both bad, cast before the names are revealed. Items
    are not stored in advance and are not repeated.
  blinding:
    source: src-arena-faq
    quote: Only votes made while the models are anonymous count toward official rankings
  task_distribution_drifts: true
  task_distribution_drifts_source: src-arena-hello-from-lmarena-blog
  task_distribution_drifts_quote: around 70% of prompts each month are fresh
  source: src-arxiv-2403-04132-v1
  quote: a user can ask a question and get answers from two anonymous LLMs

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: There is no stored item set; the access state is that of the record of prompts and
    votes, which Arena holds. It releases a portion (prompts, votes and pairings, through Hugging
    Face and Arena Explorer) and the full history of published leaderboards, and shares conversation
    data privately with providers whose unreleased models it tests. The headline cannot be computed
    from the released data.
  access_basis:
    reason: The ratings are fitted to Arena's whole vote record, and only part of it is public.
    source: src-arena-leaderboard-policy
    quote: We release a fraction of the data collected from the platform, as well.
  refresh: rolling-live
  refresh_basis:
    reason: Prompts and votes arrive continuously and the model pool changes week by week, so a
      rating needs its publish date. Method changes are dated in the changelog, but ratings move
      between them with every vote.
    source: src-arena-hello-from-lmarena-blog
    quote: around 70% of prompts each month are fresh
  data_provenance:
    - crowd-authored
  data_provenance_note: Members of the public write the prompts; Arena filters prompts that reveal
    model identity and deduplicates high-frequency prompts, which removes around 10% of votes.
  data_provenance_source: src-arxiv-2403-04132-v1
  data_provenance_quote: Users are free to input any prompt to the two models.
  contamination_risk: medium
  contamination_risk_note: Most prompts are fresh, so a stored set cannot leak. But Arena shares
    conversation data with providers whose unreleased models it tests, and releases past battles, so
    the arena's prompt distribution reaches some entrants. The Leaderboard Illusion reports large
    gains from Arena data; Arena replies that the cited 112% experiment was on Arena-Hard, a static
    benchmark. No source measures the effect on the live ratings.
  contamination_evidence:
    - source: src-arena-leaderboard-policy
      stance: supports
      quote: When we test unreleased models, we share conversation data with model providers to help
        them improve their models
    - source: src-arxiv-2504-20879
      stance: supports
      quote: We show that access to Chatbot Arena data yields substantial benefits
    - source: src-arena-hello-from-lmarena-blog
      stance: against
      quote: around 70% of prompts each month are fresh
    - source: src-arena-our-response-blog
      stance: against
      quote: This claim with respect to Chatbot Arena is not supported by evidence.
  ceiling_anchor_type: none-known
  ceiling_anchor_type_basis:
    reason: The headline is a Bradley-Terry rating fitted to a pool, which has no top; the taxonomy
      gives this benchmark as none-known's example.
    source: src-arxiv-2403-04132-v1
    quote: A standard score function in this setting is the vector of Bradley-Terry (BT)
      coefficients
  dataset_licence_note: Not recorded. The vote record behind the ratings is not released; the
    leaderboard history (lmarena-ai/leaderboard-dataset) is CC BY 4.0, and the licences of the
    released vote samples were not read.
  size:
    - count: 240000
      unit: votes (over 240K, from about 90K users, April 2023 to January 2024)
      subset: Chatbot Arena, the paper's data
      source: src-arxiv-2403-04132-v1
      quote: amassing over 240K votes
    - count: 2000000
      unit: votes a month (2M+, all arenas, September 2025)
      subset: the platform
      source: src-arena-ai-evaluations-blog
      quote: LMArena has already logged 250M+ real conversations, 2M+ monthly votes

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Arena Intelligence Inc. (Arena, formerly LMArena; begun as LMSYS's Chatbot Arena at UC
    Berkeley)
  maintainer_basis:
    reason: The researchers who built the platform formed a company in 2025, which runs the site and
      holds the code (lmarena/arena-rank) and the datasets (lmarena-ai on Hugging Face).
    source: src-arena-about
    quote: In 2025, we formed Arena Intelligence Inc. and raised funding from a16z and The
      University of California.
  maintainer_type: industry-lab
  submission_process: live-arena
  submission_process_note: Ratings come from continuous battles, not a fixed set. Providers bring
    models; a public model is added, voted on until its rating stabilises (at least 1,000 votes) and
    then listed, and the provider must keep access open for 30 days. Unreleased models are tested
    under anonymous labels, their results shared privately, and a model later released is marked
    preliminary until fresh votes arrive. Every battle includes at least one public model.
  submission_process_source: src-arena-leaderboard-policy
  submission_process_quote: (at least 1,000; typically more)
  independence_flags:
    - flag: evaluator-sells-evaluations
      source: src-arena-faq
      quote: We offer AI evaluations to enterprises, model labs, and developers grounded in
        real-world human feedback.
    - flag: funded-by-evaluated-party
      source: src-arxiv-2403-04132-v1
      quote: This project is also partly supported by Accenture, AMD, Google, IBM, Intel, Microsoft,
        Samsung SDS, SAP, Uber, and VMware.
    - flag: maintainer-competes-on-own-benchmark
      source: src-arena-introducing-max-blog
      quote: 'We recently deployed a Max version in Battle mode, codenamed theta-hat, which achieved #1
        on the Arena Overall leaderboard with a score of 1500'
    - flag: single-evaluator-private-test-set
      source: src-arena-faq
      quote: We share a portion of our anonymized voting data with the research community
  independence_flags_note: The AI Evaluations product (September 2025) is sold to model labs among
    others. The paper-era support names Google, IBM and Microsoft, whose models are ranked; the 2025
    company is venture-funded. Max is Arena's own router over other providers' models, run in Battle
    mode. Arena holds the full vote record and fits every rating. The Leaderboard Illusion (2025)
    reports that undisclosed private testing let a handful of providers test many variants and
    retract scores; Arena's reply disputes several of its numbers and states that any provider may
    test variants. Whether pre-release testing is a commercial arrangement is not stated (see
    review_checks).
  independence_assessed: true
  funding:
    source: src-arena-about
    quote: Funding led by Felicis and UC Investments (University of California)
  independence_policy:
    source: src-arena-ai-evaluations-blog
    quote: are evaluated using the same community-driven methodology, with no preferential treatment

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A new model's rating needs only the model served to Arena (public API, open weights or a
      public service) and votes from Arena's unpaid users; the serving cost is the only compute.
    source: src-arena-leaderboard-policy
    quote: The model provider must provide model access using one of the three methods above to
      Arena for a minimum of 30 days.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only Arena has the user base that casts the votes and the full record they form.
      Re-fitting ratings from the released fraction with Arena-Rank, which the policy offers as an
      audit, is not a reproduction.
    source: src-arena-leaderboard-policy
    quote: anyone can audit our leaderboard using publicly released data
  reproducibility_blockers:
    - private-test-set
    - human-raters
    - live-world-state
  reproducibility_blockers_note: The vote record is held by Arena; the judges are people; and the
    prompt stream and the rating pool keep moving, so no evaluation can be repeated.
  harness_availability: official-harness
  harness: Arena-Rank (lmarena/arena-rank), the Bradley-Terry fit, style control and confidence
    intervals behind every leaderboard. FastChat (lm-sys/FastChat) held the original serving and
    ranking code and is no longer maintained for the leaderboard.
  harness_source: src-arena-leaderboard-policy
  harness_quote: The model evaluation and ranking pipelines have been open sourced in the Arena-Rank
    repository.
  code_licence: Apache-2.0
  code_licence_note: Arena-Rank's licence as its release post states it; GitHub's licence metadata
    reports Apache-2.0 for both lmarena/arena-rank (pushed 2026-08-04) and lm-sys/FastChat (pushed
    2026-05-01), read 2026-10-14.
  code_licence_source: src-arena-rank-blog
  code_licence_quote: This code, released under an Apache 2.0 open source license, is the code that
    powers all of the leaderboards on our site today.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The hosted-api profile (pairwise-preference-elo with hosted-inference-endpoint) applies. Beyond it, a rating is
  # read against its pool and publish date (rating_pool on the claim), and against which arena, category and
  # style-control setting produced it, which subset_used carries (the subsets below).
  material_waived:
    - field: shots
      reason: Users write their own prompts and the protocol adds no demonstrations, so there is no
        shot count to vary.
  rating_pool_required: true

aggregation_policy: none-by-design
aggregation_policy_note: Each arena publishes its own ratings and categories, with an overall
  category inside each; no score combines the arenas.

homepage: https://arena.ai/
repository: https://github.com/lmarena/arena-rank
dataset_url: https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset
leaderboard_url: https://arena.ai/leaderboard
maintainer_url: https://arena.ai/company/about

versions:
  - version: elo-2023
    label: Online Elo ratings
    version_kind: revision
    released: 2023-05-04
    changes: The first leaderboard, Elo ratings computed from the votes.
    breaking: true
    superseded_by: bt-2024
    frozen: true
    sources:
      - src-arena-chatbot-arena-2023-blog
  - version: bt-2024
    label: Bradley-Terry coefficients
    version_kind: revision
    released: 2024-01-09
    changes: Ratings became Bradley-Terry coefficients with confidence intervals, replacing the Elo
      score.
    breaking: true
    supersedes_version: elo-2023
    superseded_by: style-control-2025
    frozen: true
    sources:
      - src-hf-lmarena-leaderboard-dataset
      - src-arxiv-2403-04132-v1
  - version: style-control-2025
    label: Style control by default (text and vision)
    version_kind: revision
    released: 2025-05-16
    changes: The default text and vision ratings control for response length and markdown, with an
      offset putting them on the uncontrolled scale. Style control was introduced as a view in
      August 2024.
    breaking: true
    supersedes_version: bt-2024
    superseded_by: reweighting-2025
    frozen: true
    sources:
      - src-hf-lmarena-leaderboard-dataset
      - src-arena-style-control-blog
  - version: reweighting-2025
    label: Frequency reweighting and closed-form intervals
    version_kind: revision
    released: 2025-07-23
    changes: Battles reweighted inversely to how often their pair appears, and confidence intervals
      computed in closed form instead of by bootstrap, which widened intervals.
    breaking: true
    supersedes_version: style-control-2025
    superseded_by: direct-battles-2026
    frozen: true
    sources:
      - src-hf-lmarena-leaderboard-dataset
      - src-arena-leaderboard-changelog
  - version: direct-battles-2026
    label: Battles in Direct counted
    version_kind: revision
    released: 2026-05-12
    changes: Votes from direct-chat sessions turned into battles now count, backfilled from March
      2026, with position-bias and same-organisation features added to the fit for the text, vision,
      search and document arenas.
    breaking: true
    supersedes_version: reweighting-2025
    frozen: false
    sources:
      - src-arena-leaderboard-changelog

subsets:
  - id: lmarena#text
    label: Text Arena
    evidence:
      - source: src-arena-vision-categories-blog
        quote: the same ranking methodology as the overall Arena leaderboard, but filtered only to
          conversations within that category
    notes: The original chat arena, rated without style control in this subset. Its categories (for
      example coding, math, hard prompts, Arena Expert and eight occupational fields) are
      leaderboards over the conversations tagged with them, by the same method.
  - id: lmarena#text-style-control
    label: Text Arena, style-controlled
    parent: lmarena#text
    evidence:
      - source: src-hf-lmarena-leaderboard-dataset
        quote: On May 16, 2025, style control was made the default for text and vision arenas
      - source: src-arena-style-control-blog
        quote: We explicitly model style as an independent variable in our Bradley-Terry regression.
    notes: The same votes with length and markdown features in the regression; the default view
      since 2025-05-16.
  - id: lmarena#vision
    label: Vision Arena
    domain_override:
      primary: multimodal/visual-qa
    evidence:
      - source: src-arena-vision-categories-blog
        quote: In Vision Arena, users upload images and give text prompts asking all sorts of
          questions, from homework to storytelling.
  - id: lmarena#vision-style-control
    label: Vision Arena, style-controlled
    parent: lmarena#vision
    notes: The default view since 2025-05-16.
  - id: lmarena#search
    label: Search Arena
    evidence:
      - source: src-arena-leaderboard-changelog
        quote: defaulting this leaderboard to ordinary Bradley-Terry while we study search specific
          style effects
    notes: Launched in August 2025. Arena defaulted this board to ordinary Bradley-Terry in August
      2025 while it studied search-specific style effects.
  - id: lmarena#search-style-control
    label: Search Arena, style-controlled
    parent: lmarena#search
  - id: lmarena#document
    label: Document Arena
    evidence:
      - source: src-arena-leaderboard-changelog
        quote: The Document Arena leaderboard has been added.
    notes: Added 2026-03-03; prompts come with user-uploaded PDF files.
  - id: lmarena#document-style-control
    label: Document Arena, style-controlled
    parent: lmarena#document
  - id: lmarena#webdev
    label: 'Code Arena: WebDev'
    evidence:
      - source: src-hf-lmarena-leaderboard-dataset
        quote: webdev` (Code Arena)
      - source: src-arena-leaderboard-changelog
        quote: has been added to the new WebDev leaderboard (powered by Code Arena)
    notes: Users ask for a web app, the two models build it, and users vote on the results. Its data
      in the leaderboard dataset start on 2025-11-12, with the leaderboard the changelog calls the
      new WebDev leaderboard powered by Code Arena; WebDev Arena itself launched in December 2024
      (see review_checks).
  - id: lmarena#text-to-image
    label: Text-to-Image Arena
    domain_override:
      primary: multimodal/any-to-any-generation
  - id: lmarena#image-edit
    label: Image Edit Arena
    domain_override:
      primary: multimodal/any-to-any-generation
    notes: Single-image and multi-image edit categories since 2026-01-23.
  - id: lmarena#text-to-video
    label: Text-to-Video Arena
    domain_override:
      primary: multimodal/any-to-any-generation
    evidence:
      - source: src-arena-leaderboard-changelog
        quote: voting is now limited to the prompt author only
    notes: In the video arenas, people other than the prompt's author could vote through Arena's
      Discord server until the move to arena.ai; since then only the author votes.
  - id: lmarena#image-to-video
    label: Image-to-Video Arena
    domain_override:
      primary: multimodal/any-to-any-generation
  - id: lmarena#video-edit
    label: Video Edit Arena
    domain_override:
      primary: multimodal/any-to-any-generation


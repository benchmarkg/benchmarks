  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with short windows (its licence is
    non-exclusive distribution) and its abstract page; the arena.ai pages and posts with scripts and
    styles stripped; the leaderboard dataset's README at main; two arXiv abstract pages; and Epoch's
    existing hub page. The live leaderboard (arena.ai/leaderboard) answers a non-browser request with
    a JavaScript challenge, so the leaderboard dataset stands in for it.
  confidence: medium
  review_checks:
    - check: Identity. The entry is the platform, its ten preference arenas as subsets. Agent Arena
        (behavioural signals, IPS scores) and the Alignment Index are left out. WebDev Arena has an
        Epoch stub (webdev-arena); Epoch calls it a subset of Text Arena, while Arena's leaderboard
        dataset keeps webdev (Code Arena) as an arena of its own whose data start 2025-11-12. Is
        WebDev Arena this entry's lmarena#webdev or an entry of its own?
      field: subsets
      source: src-epoch-text-arena-coding
      quote: Previously known as WebDev Arena, now a subset of Text Arena
    - check: Capability abstains, as the Stage-3 record did (failure 2026-09-28-lmarena-002,
        proposed term human-preference-alignment, still open). Nothing in the vocabulary names
        preference or helpfulness.
      field: capability
    - check: language/dialogue is rejected although the Stage-3 classification lists it as a
        secondary; the average conversation has 1.3 turns. multimodal/visual-qa rests on the Vision
        Arena post's description of its prompts.
      field: domain
    - check: maintainer-competes-on-own-benchmark rests on Max, Arena's router over other providers'
        models, which it ran in Battle mode and reports first overall. No source read shows Max
        listed on the public leaderboard, whose policy admits first-party foundation models only.
      field: governance.independence_flags
      source: src-arena-introducing-max-blog
      quote: 'We recently deployed a Max version in Battle mode, codenamed theta-hat, which achieved #1
        on the Arena Overall leaderboard with a score of 1500'
    - check: commercial-leaderboard-placement is not assigned. The Leaderboard Illusion reports that
        private testing favoured a handful of providers; the policy lets any provider test several
        unreleased variants and receive results privately; Arena sells evaluations to model labs. No
        source read says whether pre-release testing is paid (Stage-3 failure
        2026-09-28-lmarena-005).
      field: governance.independence_flags
      source: src-arxiv-2504-20879
      quote: We find that undisclosed private testing practices benefit a handful of providers who
        are able to test multiple variants before public release and retract scores if desired.
    - check: single-evaluator-private-test-set is assigned beside data.access private-test-server,
        which the Stage-3 record did not do; Arena says anyone can audit the leaderboard from
        released data.
      field: governance.independence_flags
      source: src-arena-leaderboard-policy
      quote: anyone can audit our leaderboard using publicly released data
    - check: harness_availability official-harness follows the Stage-3 record. Arena-Rank is the
        code that fits the official ratings, but only Arena's votes can feed it; RoboArena, whose
        rating is also fitted centrally, has reference-implementation-only.
      field: execution.harness_availability
    - check: Style control is modelled as child subsets (a second fit of the same votes, as the
        leaderboard dataset splits it), not as a condition; EvalConditions has no field for it.
        AutoEval rows (reward-model proxy votes, since 2026-07-30) are not distinguished by any
        field.
      field: subsets
      source: src-arena-autoeval-blog
      quote: we train a Reward Model (RM) that captures human preference, then use it to cast votes
        automatically

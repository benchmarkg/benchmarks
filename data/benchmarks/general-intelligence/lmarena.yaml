  - date: 2026-01-28
    event: channel-moved
    field: homepage
    from: https://lmarena.ai/
    to: https://arena.ai/
    source: src-arena-lmarena-is-now-arena-blog
    quote: 'That evolution is why we are now Arena. Now available at: arena.ai.'
    note: The post is dated 28 Jan 2026; lmarena.ai now redirects to arena.ai.


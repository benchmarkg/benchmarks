# data/benchmarks/general-intelligence/c-eval.yaml
#
# P1-S12 sweep follow-up: a new general-intelligence entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from the C-Eval paper, arXiv 2305.08322 read as its v3 PDF (2023-11-06, the NeurIPS 2023 Datasets and
# Benchmarks version), and its abstract page; the repository README at main's head commit cba65ae (2025-07-27),
# which dates the release of the complete test set; Hugging Face's API record of the dataset (ungated, read without an
# account), its dataset card at revision 617524a and one test row from its dataset viewer; the README of
# lm-evaluation-harness's ceval task group at commit 817a2fe; and the DeepSeek-V3 (v2, February 2025), Qwen3 (May
# 2025) and dots.llm1 (June 2025) technical reports, Sources already on main, as evidence of current use. GitHub's
# API supplied the repository's dates, tree and licence metadata, and Hugging Face's API the dataset's commit list
# and organisation record; none of those is a quoted Source. The leaderboard site, cevalbenchmark.com, could not be
# read (review_checks). The id is the name's kebab slug (04 S3); no stub, tombstone or retired id holds it. Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: c-eval
name: C-Eval
aliases:
  - 'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models'
  - ceval
aliases_note: ceval is the name of the repository (hkust-nlp/ceval) and of the Hugging Face dataset
  (ceval/ceval-exam); lm-evaluation-harness names its validation-split group ceval-valid.
tagline: Four-option Chinese exam questions in 52 subjects, from middle school to professional
  qualification tests.
description: >
  A Chinese evaluation suite of 13,948 four-option multiple-choice questions in 52 subjects at four levels:
  middle school, high school, college and professional. The subjects are the standard middle and high
  school subjects except English, 25 college subjects drawn from all 13 categories of undergraduate majors
  listed by China's Ministry of Education, and 12 national professional qualification exams such as physician,
  legal professional and civil servant, grouped into STEM, social science, humanities and other. The questions
  come mostly from mock exams and small local exams published online as PDF or Word documents, which the
  authors parsed, partly by hand, to lower the chance of pretraining exposure; about 2,000 college questions
  come, with permission, from a graduate-entrance mock-exam site where they are not freely available.
  Each subject has five development exemplars with explanations (for few-shot and chain-of-thought prompting),
  a validation split and a test split. C-Eval Hard, eight mathematics, physics and chemistry subjects,
  is reported separately as a test of advanced reasoning. Models are scored by accuracy, averaged over
  subjects. The test answers were kept private and scored by submission to the maintainers' leaderboard
  site until 2025-07-27, when the maintainers released the complete test set.
self_description:
  source: src-arxiv-2305-08322
  quote: We present C-Eval, the first comprehensive Chinese evaluation suite designed to assess
    advanced knowledge and reasoning abilities of foundation models in a Chinese context.
external_ids:
  huggingface: ceval/ceval-exam
  arxiv: '2305.08322'
paper:
  title: 'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models'
  arxiv: '2305.08322'
  version_read: v3
  source: src-arxiv-2305-08322-v3
released: 2023-05-15
released_note: The paper's first arXiv version, as its abstract page dates it; v3 (2023-11-06) is
  the version read here. The repository was created on 2023-05-12 and the Hugging Face dataset on
  2023-05-16 (GitHub API; src-hf-api-ceval-exam).
released_source: src-arxiv-2305-08322
released_quote: Submitted on 15 May 2023 (v1), last revised 6 Nov 2023 (this version, v3)
release_venue: NeurIPS 2023 (Datasets and Benchmarks track)
release_venue_source: src-arxiv-2305-08322-v3
release_venue_quote: 37th Conference on Neural Information Processing Systems (NeurIPS 2023) Track
  on Datasets and Benchmarks.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: general-intelligence/multi-subject-knowledge-exams
  secondary: []
domain_basis:
  reason: The claim is advanced knowledge across 52 subjects from the humanities to science and
    engineering, measured with closed-ended exam questions scored on the answers alone, and no
    subject holds most of them (the largest, college economics, has 557 of 13,948; the largest
    category, STEM, 4,495). It passes the leaf's inclusion test, and the breadth does not lie inside
    one family.
  source: src-arxiv-2305-08322-v3
  quote: C-EVAL consists of 13948 multiple-choice exam questions spanning 52 diverse disciplines,
    ranging from humanities to science and engineering
domain_considered_and_rejected:
  - term: language/understanding
    reason: The questions are in Chinese, but Chinese is the interface to the subjects, as the
      language family's exclusion test and its MMLU-Pro near miss read; the paper's Chinese context
      is knowledge of Chinese subjects (culture, history, law), not reading a supplied passage. The
      c3 entry records the same reading of C-Eval.
    source: src-arxiv-2305-08322-v3
    quote: should be evaluated on their knowledge of Chinese users
  - term: language/multilingual
    reason: One language; no task is run across languages, and the school English subject is left
      out on purpose.
    source: src-arxiv-2305-08322-v3
    quote: We include the standard subjects for middle and high school levels in China, except for
      the English subject.
  - term: general-intelligence/human-comparison-batteries
    reason: The items come from exams written for people, but no human performance is measured or
      estimated on them; the paper's only reference row is the 25% random baseline.
    source: src-arxiv-2305-08322-v3
    quote: challenging human exams in China
  - term: physics/physics-reasoning
    reason: Considered as a domain_override for C-Eval Hard, whose eight subjects include college
      and high school physics; they sit beside four mathematics and two chemistry subjects, so the
      subset's breadth does not lie in one family, and three sciences scored on options are still
      this leaf's breadth (gpqa's reading). No override is set.
capability:
  - knowledge-recall
capability_basis:
  knowledge-recall:
    reason: Each item is a question with four options and no supplied passage, tool or retrieval
      step, so the answer comes from what the system holds; the paper frames the Chinese context as
      knowledge of Chinese users' subjects.
    source: src-arxiv-2305-08322-v3
    quote: should be evaluated on their knowledge of Chinese users
capability_considered_and_rejected:
  - term: quantitative-reasoning
    reason: C-Eval Hard's subjects need calculation and the paper calls them reasoning tests, but
      the scored act is choosing one of four options, which the term's MMLU-Pro near miss sends to
      knowledge breadth (see review_checks).
    source: src-arxiv-2305-08322-v3
    quote: We select 8 challenging math, physics, and chemistry subjects from C-EVAL to form a
      separate benchmark, C-EVAL HARD
  - term: deductive-reasoning
    reason: The logic subject and the civil-servant exam ask for conclusions from premises, but they
      are two of 52 subjects and are not scored as a capability.
  - term: context-integration
    reason: A few language subjects may quote a text in the question, but the protocol supplies no
      passage, and the items were not read one by one.
  - term: reliability-consistency
    reason: Appendix G permutes the options five ways for three models to check option bias; that is
      an analysis in the paper, not a score the benchmark reports.
    source: src-arxiv-2305-08322-v3
    quote: we permuted the order of the choices in the questions and randomly selected 5 distinct
      permutations of choices for each question
  - term: instruction-following
    reason: The prompt asks only for the answer letter; following the format is the interface, not
      what is scored.

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: Every item has four options with one correct, and the score is accuracy on the chosen
    option, extracted from the response by regular expression or taken as the most probable letter.
  source: src-arxiv-2305-08322-v3
  quote: Each question has four choices and only one choice is the correct answer.
designed_for_subjects:
  - base-model
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The paper evaluates eleven models through prompting, instruction-tuned ones (GPT-4,
    ChatGPT, the two Claude versions, ChatGLM-6B, MOSS, Chinese-Alpaca-13B, Bloomz-mt) beside the
    pretrained LLaMA-65B, and the README's scoring advice provides for models without instruction
    tuning.
  source: src-github-ceval-readme
  quote: especially in zero-shot evaluation for models without experiencing instruction tuning
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: The paper's chain-of-thought setting is a prompt condition; reasoning models were scored
      on C-Eval later (observed_subjects), which is use, not design.
observed_subjects:
  values:
    - base-model
    - reasoning-model
  basis: Developers report C-Eval for pretrained base checkpoints, as the DeepSeek-V3 and dots.llm1
    reports do in their base-model tables, and for reasoning models, as the Qwen3 report does in
    Table 11, which compares Qwen3-235B-A22B in thinking mode with OpenAI-o1, DeepSeek-R1 and Gemini
    2.5 Pro.
  source: src-arxiv-2505-09388-v1
as_used:
  - protocol: Base models scored by perplexity over the four options, five-shot, in the developer's
      own framework, without naming the split.
    source: src-arxiv-2412-19437-v2
    quote: MMLU-Pro, MMMLU, ARC-Easy, ARC-Challenge, C-Eval, CMMLU, C3, and CCPM
    note: The DeepSeek-V3 report (v2, February 2025) lists C-Eval among the datasets it scores by
      perplexity, and its base-model table gives C-Eval (EM) five-shot.
  - protocol: lm-evaluation-harness's ceval-valid group, the 1,346-question validation split scored
      by log-likelihood over the letters A to D, with the development exemplars as shots.
    source: src-github-lm-eval-ceval-readme
    quote: This implementation consists solely of the validation set of C-Eval, as the test set
      requires submission of model predictions to an external site.
  - protocol: Reasoning models in thinking mode, sampled, reported beside other reasoning baselines.
    source: src-arxiv-2505-09388-v1
    quote: 'Table 11: Comparison among Qwen3-235B-A22B (Thinking) and other reasoning baselines.'
lifecycle: active
lifecycle_basis:
  reason: Results are still produced. Model developers report C-Eval in 2025 technical reports
    (DeepSeek-V3 in February, Qwen3 in May, dots.llm1 in June), and the maintainers released the
    test answers on 2025-07-27, their last change to the repository and the dataset. Whether it is
    saturated is derived from claims, never set here.
  source: src-arxiv-2506-05767-v1
  quote: C-Eval (EM) CMMLU (EM) CLUEWSC (EM)
activity: unknown
activity_basis:
  reason: The submission route was the leaderboard site, which scored test-split predictions and
    published them at the submitter's choice. That site could not be read (it failed TLS on
    2026-11-17 and accepted no connection on 2026-11-27), so whether it still takes submissions is
    not established; since 2025-07-27 the test answers are public, so scoring no longer needs it
    (see review_checks).
  source: src-arxiv-2305-08322-v3
  quote: Users have the option to include their submission results in the live leaderboard,
    depending on their own preference.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4
    source: src-arxiv-2305-08322-v3
    observed_on: 2026-11-27
    quote: Results show that GPT-4 is the only model that surpasses 60% average accuracy.
    note: The paper's best result (66.4% zero-shot, answer-only), among its eleven evaluated models.
  - system: Qwen3-235B-A22B (thinking mode)
    source: src-arxiv-2505-09388-v1
    observed_on: 2026-11-27
    quote: Tasks C-Eval 85.5 91.8 - 82.9 89.6
    note: Table 11's row runs in its column order, OpenAI-o1 (85.5), DeepSeek-R1 (91.8), Grok-3-Beta
      (no score), Gemini 2.5 Pro (82.9) and Qwen3-235B-A22B (89.6).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each question's answer key, from the exam it was collected from, checked
  in the authors' rounds of validation. The test split's keys were private until 2025-07-27 and are
  now in the published dataset.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Since 2025-07-27 the questions and answers of every split, the prompts and the evaluation
    code are public, and the score is computed from the model's outputs; before that date, test
    scores came only from the maintainers' server.
  source: src-hf-ceval-exam-card
  quote: '[2025.7.27] We have released the complete C-Eval test set to the community! Now, you can directly
    evaluate on the C-Eval test set more conveniently.'

task:
  exists: true
  input:
    - one four-option multiple-choice question in Chinese, after a line naming the subject's exam;
      zero-shot, or after the subject's five development exemplars (with their explanations in the
      chain-of-thought setting)
  output: The letter of one option, optionally after a chain-of-thought explanation.
  scoring: Accuracy per subject; the Average is the mean over the 52 subjects, beside means per
    category (STEM, social science, humanities, other) and over C-Eval Hard's eight subjects.
  tests_hidden_from_system: false
  source: src-arxiv-2305-08322-v3
  quote: We use accuracy as the metric.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The README's Data section still says the test labels are not released and must be
    scored by submission, and lm-evaluation-harness's task README says the same; both predate the
    release or were not updated for it. The Hugging Face dataset viewer shows an answer on a test
    row, and Hugging Face's API reports the dataset ungated (review_checks).
  access_basis:
    reason: Since 2025-07-27 the Hugging Face dataset holds the test split with its answers beside
      the development and validation splits, ungated and under CC BY-NC-SA 4.0, a licence on use
      rather than a gate.
    source: src-hf-rows-ceval-exam-test
    quote: '"answer":"B","explanation":""},"truncated_cells":[]}],"num_rows_total":443'
  refresh: static
  refresh_basis:
    reason: One set of 13,948 questions in 52 subjects, split once into development, validation and
      test; the Hugging Face record's split sizes (12,342, 1,346 and 260) still give the paper's
      total, and the 2025 release published the test answers without changing the items. The dataset
      files were re-uploaded several times in 2023 and the validation files on 2025-07-24, with no
      stated change (review_checks).
    source: src-arxiv-2305-08322-v3
    quote: In terms of split 52 52 52 260 1346 12342 Total 52 13948
  data_provenance:
    - exam-derived
    - web-scraped
  data_provenance_note: >
    Every item comes from a human exam: mainly mock exams freely available online, past college exam questions
    shared by students, and mock questions for the national graduate entrance exam included with the permission
    of a site where they are not freely available. Most came as PDF or Word documents that the authors
    parsed, annotated by hand (with LaTeX conversion for the STEM subjects), cut to exactly four options,
    deduplicated and validated. GPT-4 drafted the explanations of the development exemplars, which the
    authors revised; those are prompts, not scored items, so model-generated does not apply.
  data_provenance_source: src-arxiv-2305-08322-v3
  data_provenance_quote: The primary source of our data is mock exams freely available on the
    internet.
  contamination_risk: medium
  contamination_risk_note: >
    The questions were taken from online mock and local exams rather than official national papers, and
    mostly from PDF and Word files rather than web text, to lower the chance of pretraining exposure;
    the paper still names web crawling as a route, which is why it kept the test labels private. Since
    2025-07-27 the whole test set with its answers is public on Hugging Face. No source read here evidences
    a route into a scored split, so the reading is medium; a contamination study would raise it.
  contamination_risk_source: src-arxiv-2305-08322-v3
  contamination_risk_quote: the C-EVAL data may unconsciously be included in pretraining data due to
    web crawling
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: The headline is accuracy, bounded at 100%, and the paper reads headroom against that
      bound; it publishes no human, expert or measured ceiling. Its one reference row is the random
      baseline, 25% in every category.
    source: src-arxiv-2305-08322-v3
    quote: However, its 66.4% accuracy indicates that there is still large room for improvement in
      current LLMs.
  dataset_licence: CC-BY-NC-SA-4.0
  dataset_licence_note: The README's Licenses section; the Hugging Face card and API record tag the
    dataset cc-by-nc-sa-4.0 as well. The repository's LICENSE-DATA file (GitHub tree at cba65ae) was
    not read.
  dataset_licence_source: src-github-ceval-readme
  dataset_licence_quote: The C-Eval dataset is licensed under a [Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International License]
  upstream_licences: About 2,000 college-level questions are mock questions for the national
    graduate entrance exam from the Weipu website, which are not freely available; the authors state
    they were authorised to include them.
  upstream_licences_source: src-arxiv-2305-08322-v3
  upstream_licences_quote: we have obtained their authorization to include around 2000 such
    questions into C-EVAL.
  size:
    - count: 13948
      unit: questions
      subset: all splits, 52 subjects
      source: src-arxiv-2305-08322-v3
      quote: C-EVAL consists of 13948 multiple-choice exam questions spanning 52 diverse
        disciplines, ranging from humanities to science and engineering
    - count: 12342
      unit: questions
      subset: test
      note: Table 1 gives the development, validation and test splits (52 subjects each) and their
        question counts in that order.
      source: src-arxiv-2305-08322-v3
      quote: In terms of split 52 52 52 260 1346 12342 Total 52 13948
    - count: 1346
      unit: questions
      subset: validation
      source: src-arxiv-2305-08322-v3
      quote: The validation split comprises a total of 1346 questions
    - count: 5
      unit: questions per subject
      subset: development (few-shot exemplars)
      source: src-arxiv-2305-08322-v3
      quote: The development split per subject consists of five exemplars to facilitate few-shot
        evaluation.
    - count: 52
      unit: subjects
      source: src-github-ceval-readme
      quote: It consists of 13948 multi-choice questions spanning 52 diverse disciplines and four
        difficulty levels
  size_note: By level, 7 middle school subjects (1,409 questions), 8 high school (1,594), 25 college
    (6,249) and 12 professional (4,696), from Table 1. The Hugging Face record's per-subject split
    sizes sum to the same 12,342, 1,346 and 260 (summed 2026-11-27).
  size_source: src-arxiv-2305-08322-v3
  size_quote: In terms of difficulty level Middle School 7 High School 8 College 25 Professional 12
    1409 1594 6249 4696
  languages:
    - Chinese

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The C-Eval authors at Shanghai Jiao Tong University, Tsinghua University, the
    University of Edinburgh and the Hong Kong University of Science and Technology
  maintainer_basis:
    reason: The paper's author affiliations. The repository the paper names sits in the hkust-nlp
      GitHub organisation account and the data in the ceval organisation account on Hugging Face
      (GitHub API; Hugging Face API, read 2026-11-27).
    source: src-arxiv-2305-08322-v3
    quote: 1Shanghai Jiao Tong University 2Tsinghua University 3University of Edinburgh 4The Hong
      Kong University of Science and Technology
  maintainer_type: academic-lab
  maintainer_type_basis:
    reason: The paper's code and data link points to the hkust-nlp organisation account, which holds
      the repository, and the Hugging Face copy sits in an organisation account of its own; all four
      affiliations are universities. GitHub's API names the organisation NLP Group @ HKUST (read
      2026-11-27, not a quoted Source).
    source: src-arxiv-2305-08322-v3
    quote: data and evaluation code are available at https://github.com/hkust-nlp/ceval.
  submission_process:
    - held-out-server
  submission_process_note: Until 2025-07-27 users submitted predictions on the label-free test split
    to the leaderboard site, which scored them at once and published them only if the submitter
    chose; the paper invites the developers of closed models to submit there. Whether the site still
    runs could not be read. With the answers now public, a submission there would be
    maintainer-scored-predictions.
  submission_process_source: src-arxiv-2305-08322-v3
  submission_process_quote: users are required to submit their model predictions to
    https://cevalbenchmark.com to automatically obtain the test accuracy, where a public leaderboard
    is maintained.
  independence_flags: []
  independence_flags_note: Not assessed. The leaderboard, where any rows of the maintainers' own
    models would show, could not be read. The paper evaluates GLM-130B and ChatGLM-6B, which its
    Table 2 attributes to Tsinghua, and one author affiliation is Tsinghua University; a shared
    university is not a shared lab, so maintainer-competes-on-own-benchmark is not set
    (review_checks). The acknowledgements name public research funding.
  independence_assessed: false
  funding:
    source: src-arxiv-2305-08322-v3
    quote: the National Key R&D Program of China (No. 2020AAA0106502)
  funding_note: The acknowledgements name a national R&D programme grant and a Tsinghua University
    institute as one author's support; no evaluated party is named.
  known_limitation:
    source: src-arxiv-2305-08322-v3
    quote: is far from perfect for LLM evaluation.
  known_limitation_note: The discussion names what C-Eval leaves out, reasoning over and calling
    APIs, and aspects beyond accuracy such as safety, bias and robustness.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: single-gpu
  compute_tier_basis:
    reason: About 12,000 short multiple-choice prompts per setting; a model of a few billion
      parameters runs on one GPU and an API model needs only credits. The paper used eight A100 GPUs
      only to serve its three largest open models (65B to 176B), and API runs on CPUs.
    source: src-arxiv-2305-08322-v3
    quote: In most cases the inference on C-EVAL is finished within one day.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Since 2025-07-27 the test answers are public beside the prompts and the evaluation code,
      and no human or maintainer-only step is in the scoring.
    source: src-hf-ceval-exam-card
    quote: '[2025.7.27] We have released the complete C-Eval test set to the community! Now, you can directly
      evaluate on the C-Eval test set more conveniently.'
  reproducibility_blockers: []
  reproducibility_blockers_note: Until 2025-07-27 the private test labels were a private-test-set
    blocker, and test scores came only from the leaderboard site.
  harness_availability: official-harness
  harness: The repository's code/evaluator_series/eval.py, with evaluators for the OpenAI API,
    ChatGLM, LLaMA, MOSS and MiniMax (repository tree at cba65ae, GitHub API)
  harness_source: src-arxiv-2305-08322-v3
  harness_quote: data and evaluation code are available at https://github.com/hkust-nlp/ceval.
  harness_gotcha:
    source: src-github-lm-eval-ceval-readme
    quote: This implementation consists solely of the validation set of C-Eval, as the test set
      requires submission of model predictions to an external site.
  harness_gotcha_note: >
    A score called C-Eval may be on the 1,346-question validation split (lm-evaluation-harness's ceval-valid,
    scored by log-likelihood) or on the 12,342-question test split (the paper, with answers extracted
    from generations by regular expression); DeepSeek-V3 scores by perplexity. The paper and README find
    five-shot prompting lowers many instruction-tuned models' scores and chain of thought rarely helps,
    so shots and chain of thought move results as well as the split.
  code_licence: MIT
  code_licence_note: The README's Licenses section; GitHub's licence metadata for the repository
    also reports MIT (read 2026-11-27). The LICENSE file was not read.
  code_licence_source: src-github-ceval-readme
  code_licence_quote: This work is licensed under a [MIT License]
  runnable_via:
    - custom
    - lm_eval
  runnable_via_note: The repository's own scripts, and lm-evaluation-harness's ceval-valid group,
    one task per subject on the validation split only. The README dates C-Eval's addition to the
    harness to 2023-07-17.
  runnable_via_source: src-github-lm-eval-ceval-readme
  runnable_via_quote: "`ceval-valid`: All 52 subjects of the C-Eval dataset, evaluated following the methodology
    in MMLU's original implementation."
  maintainer_rerun_policy: unstated

comparability:
  # The llm-static-text profile (multiple-choice x base, instruction-tuned and reasoning models) carries shots, chain
  # of thought, reasoning effort, tools, retries and the subset, which here also records the split (validation or
  # test) and C-Eval Hard. The harness is added because it decides the scoring: an answer extracted from a generation
  # (the paper), the letter probabilities (the README's advice for base models), perplexity (DeepSeek-V3) or
  # log-likelihood on the validation split (lm-evaluation-harness).
  material_extra:
    - harness
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper's Average is the mean accuracy over the 52 subjects, beside means per category,
    and C-Eval Hard is averaged over its eight subjects; the README's tables keep the same columns.
  source: src-arxiv-2305-08322-v3
  quote: column indicates the average accuracy over all the subjects.

liveness:
  repo_last_commit: 2025-07-27
  reproduction_script_present: true
  last_checked: 2026-11-27

homepage: https://github.com/hkust-nlp/ceval
repository: https://github.com/hkust-nlp/ceval
dataset_url: https://huggingface.co/datasets/ceval/ceval-exam
leaderboard_url: https://cevalbenchmark.com/static/leaderboard.html

versions:
  - version: '2023'
    label: C-Eval as released with the paper (13,948 questions in 52 subjects)
    version_kind: revision
    released: 2023-05-15
    items: 13948
    changes: The one release of the items, with development and validation answers public and the
      test answers held for the leaderboard. The test answers were published on 2025-07-27 without a
      change to the items, recorded in history as an access change, not as a version
      (review_checks).
    breaking: false
    frozen: true
    sources:
      - src-arxiv-2305-08322-v3
      - src-arxiv-2305-08322

subsets:
  - id: c-eval#hard
    label: C-Eval Hard
    scored_separately: true
    evidence:
      - source: src-arxiv-2305-08322-v3

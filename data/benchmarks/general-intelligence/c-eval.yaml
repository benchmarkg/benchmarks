lineage:
  role: root
lineage_note: >
  C-Eval derives from no earlier benchmark: its items were collected from Chinese mock, local and college
  exams. It takes MMLU's four-option format, which is no lineage edge. CMMLU (arXiv 2306.09212) is a Chinese
  multi-subject exam by other authors with its own items, a separate benchmark rather than a fork. C-Eval
  Hard is the release's own subset. lm-evaluation-harness's validation group runs its items unchanged;
  copies in other evaluation suites and derivatives by other maintainers were not surveyed, so no variant
  or fork is recorded.


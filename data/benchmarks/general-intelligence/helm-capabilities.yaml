    - src-github-helm-capabilities-run-entries
    - src-github-helm-gpqa-scenario
    - src-github-helm-wildbench-annotator
    - src-github-helm-omni-math-annotator
    - src-hf-marin-8b-instruct-card
    - src-arxiv-2509-04664
    - src-arxiv-2509-04664-v1
  sources_note: >
    The announcement post and the two documentation pages with scripts and styles stripped. The
    leaderboard's config script and the release records come from the public bucket the page reads.
    The README, the run entries, the GPQA scenario and the two annotators are at main. The Marin model
    card is withheld from archiving because it carries a personal contact address. The 2025 paper's
    abstract page and v1 PDF (a DOI, not archived) are evidence of outside use and of a known
    limitation. The post, the README and the two documentation pages share their URLs and ids with
    Sources other entries' branches wrote (omni-math, helm-safety); they were written fresh here.
  confidence: medium
  review_checks:
    - check: language/dialogue is rejected although the Stage-3 record tags it for WildBench. The
        leaf scores a conversation as a whole, and HELM scores the one reply the model writes after
        a supplied history.
      field: domain
      source: src-crfm-helm-capabilities-post
      quote: WildBench (Dialogue) assesses the models
    - check: rubric-graded is rejected although the Stage-3 record tags it. Each WildBench judge
        reads a checklist but returns one 1-10 score; whether a checklist-guided holistic score is
        enough for the term is a judgement.
      field: evaluation_method
    - check: The WildBench subset takes instruction-following from HELM's schema, while the post
        calls its capability dialogue, which no capability term names. It could instead carry no
        capability.
      field: subsets
      source: src-helm-capabilities-v1-15-0-schema
      quote: '"task": "instruction following", "what": "GPT-judged instruction following with instructions
        collected from real-user conversations"'
    - check: maintainer-competes-on-own-benchmark rests on one row, Marin 8B Instruct, which its
        model card says the Marin team at Stanford CRFM developed and the board attributes to the
        Marin Community. The same row is on HELM Safety, whose entry left the question open.
      field: governance.independence_flags
      source: src-helm-capabilities-v1-15-0-core-scenarios
      quote: '{ "value": "Marin 8B Instruct", "description": "", "markdown": false }, { "value": 0.3248712203836172'
    - check: The judges disagree across sources. The post says three judges are averaged for
        WildBench and Omni-MATH; the v1.15.0 schema's metric texts name GPT-4o for WildBench and
        GPT-4 for Omni-MATH; HELM's annotators at main call GPT-4o (2024-05-13) alone. Which judges
        scored which release is not stated, and reproducibility_tier fully-automatable stands only
        for the pipeline, not for the published three-judge numbers.
      field: execution.reproducibility_tier
      source: src-helm-capabilities-v1-15-0-schema
      quote: '"description": "Accuracy of the AI output judged by GPT-4."'
    - check: hosted-inference-endpoint rests on the open models being Together AI's quantized Turbo
        and FP8 deployments named as such in the rows; frontiermath's near miss says provider APIs
        alone do not qualify.
      field: designed_for_subjects
    - check: lifecycle mature needs the instrument in use. The outside use found is a September 2025
        paper, before maintenance mode; no 2026 use was found.
      field: lifecycle
      source: src-arxiv-2509-04664-v1
      quote: 7Accessed 2025-06-24, updated 2025-06-10.
    - check: data.access is fully-open, but the GPQA copy HELM loads (Idavidrein/gpqa) is auto-gated
        on Hugging Face; the authors' password-protected zip, with the password printed in their
        README, is the ungated copy.
      field: data.access
    - check: Each subset's capability_override keeps only its own scenario's capability, dropping
        the other two entry-level terms on purpose (the validator's subset-drops-terms warnings). No
        reference_conditions record names the judges yet; the reference-grader warning asks for one.
      field: subsets

# data/benchmarks/general-intelligence/helm-capabilities.yaml
#
# P1-S11-T05, general-intelligence entry 5 of 6. Filled from Stanford CRFM's announcement post (2025-03-20); the
# leaderboard's config script and, from the crfm-helm-public bucket it reads, release v1.15.0's summary, schema,
# scenario and core-scenarios records and release v1.0.0's summary; the HELM README at main and two pages of
# HELM's documentation (Maintenance Mode Policy, Reproducing Leaderboards); HELM's Capabilities run entries, its
# GPQA scenario and its WildBench and Omni-MATH annotators, at main; the Marin 8B Instruct model card on Hugging
# Face; and the abstract page and v1 PDF of "Why Language Models Hallucinate" (arXiv 2509.04664, September 2025),
# which reviews the leaderboard's grading. Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# The five constituents are modelled as subsets, each with the domain and capability it overrides. MMLU-Pro and
# Omni-MATH have entries of their own (mmlu-pro, omni-math), curated separately; this entry records how HELM runs
# them: downsampled to 1,000 items, MMLU-Pro on GPQA's zero-shot chain-of-thought prompt, Omni-MATH judged by a
# jury of three LLMs on HELM Safety's judge prompt.

id: helm-capabilities
name: HELM Capabilities
tagline: Stanford CRFM's leaderboard of five public LLM benchmarks run on 68 models, ranked by the
  mean of their 0-1 scores.
description: >
  A curated leaderboard from Stanford's Center for Research on Foundation Models (CRFM), run on its
  HELM framework. For each of five capabilities it takes one existing public benchmark, chosen for
  being unsaturated, recent and of good quality, and runs it on models the maintainers select:
  MMLU-Pro for general knowledge (1,000 ten-option questions), GPQA for reasoning (446 four-option
  questions of its main set), IFEval for instruction following (541 prompts with verifiable
  instructions), WildBench for dialogue (1,000 real-user conversations) and Omni-MATH for
  mathematical reasoning (1,000 olympiad-level problems). The two multiple-choice scenarios are run
  zero-shot with chain of thought and scored by accuracy; IFEval by its official instruction
  checker; WildBench by a checklist-guided 1-10 score from three LLM judges, rescaled to 0-1; and
  Omni-MATH by the same three judges deciding whether an answer matches the reference. Models are
  ranked by the mean of the five scores. Version 1.0.0 (March 2025) covered 22 models; fifteen
  cumulative releases followed, to v1.15.0 (2025-11-24), with 68. HELM entered maintenance mode on
  2026-06-01, and no new evaluations are added to its leaderboards.
self_description:
  source: src-crfm-helm-capabilities-post
  quote: HELM Capabilities is a new benchmark and leaderboard that consists of a curated set of
    scenarios for measuring various capabilities of language models.
released: 2025-03-20
released_note: The first release's date in its summary record; the announcement post's URL carries
  the same date.
released_source: src-helm-capabilities-v1-0-0-summary
released_quote: '"release": "v1.0.0", "suites": [ "v1.0.0" ], "date": "2025-03-20"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: general-intelligence/agi-composite-suites
  secondary:
    - mathematics/competition-math
    - language/generation
domain_basis:
  reason: Five heterogeneous scenarios, two multiple-choice exams, an instruction checker, a judged
    conversation reply and judged olympiad mathematics, are folded into one mean that the post
    presents as its view of general capabilities. That is the suite leaf's definition, and the
    taxonomy names helm-capabilities as the near miss that sends such a mean here rather than to
    multi-subject-knowledge-exams. Omni-MATH is competition mathematics, and IFEval and WildBench
    are free-form generation scored against instructions or a checklist; each subset carries its own
    domain.
  source: src-crfm-helm-capabilities-post
  quote: Building on the HELM framework, we introduce HELM Capabilities to capture our latest
    thinking on the evaluation of general capabilities.
domain_considered_and_rejected:
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: MMLU-Pro and GPQA are such exams, and their subsets take the leaf, but the headline
      aggregates heterogeneous task formats, which the leaf's exclusion sends to
      agi-composite-suites (helm-capabilities is the leaf's own near miss).
    source: src-crfm-helm-capabilities-post
    quote: only two scenarios in HELM Capabilities (MMLU-Pro and GPQA) are multiple-choice
      question-answering tasks with reference texts, while the remaining scenarios are free-form
      generation tasks.
  - term: language/dialogue
    reason: The post calls WildBench's capability dialogue, and the Stage-3 record tags the leaf.
      The leaf is a conversation scored as a whole, though, and WildBench supplies the history and
      scores the one reply the model writes next.
    source: src-crfm-helm-capabilities-post
    quote: WildBench (Dialogue) assesses the models
capability:
  - knowledge-recall
  - instruction-following
  - quantitative-reasoning
capability_basis:
  knowledge-recall:
    reason: MMLU-Pro's and GPQA's questions are answered closed-book, zero-shot, with no passage or
      tool supplied, so the scored answer comes from what the model brought with it.
    source: src-crfm-helm-capabilities-post
    quote: For the multiple-choice question answering tasks (MMLU-Pro and GPQA), we evaluate an
      instance using zero-shot Chain-of-Thought prompting.
  instruction-following:
    reason: IFEval scores whether the response obeys the prompt's verifiable instructions, and the
      post claims instruction following for it. HELM's schema claims the same for WildBench.
    source: src-crfm-helm-capabilities-post
    quote: IFEval (Instruction Following) tests how well models understand and execute user
      instructions using verifiable instructions
  quantitative-reasoning:
    reason: Omni-MATH's answers are numbers and expressions reached by olympiad-level calculation
      and algebra, judged against the reference answer.
    source: src-crfm-helm-capabilities-post
    quote: Omni-MATH (Mathematical Reasoning) challenges models with high-level mathematical
      problem-solving tasks comparable to international mathematical Olympiad competitions
capability_considered_and_rejected:
  - term: deductive-reasoning
    reason: The post files GPQA under reasoning, but its questions turn on graduate domain knowledge
      rather than entailment from stated premises; gpqa-diamond is the term's own near miss.
  - term: communication
    reason: WildBench's reply is graded by judge models reading it against a checklist; no recipient
      acts on it, which the term's inclusion test asks.

evaluation_method:
  - multiple-choice
  - constraint-check
  - model-graded-judge
  - composite
evaluation_method_basis:
  reason: MMLU-Pro (ten options, chance 10%) and GPQA (four options, chance 25%) are scored by the
    option a regular expression extracts from the chain of thought. IFEval's official checker
    verifies each instruction. WildBench and Omni-MATH are scored by three judge models, GPT-4o
    (2024-05-13), Llama 3.1 405B Instruct Turbo and Claude 3.5 Sonnet (2024-10-22), whose scores or
    votes are averaged. The mean over the five combines the methods.
  source: src-crfm-helm-capabilities-post
  quote: The freeform generation tasks are scored either with an external evaluator (IFEval) or an
    LLM-as-a-judge approach (WildBench, Omni-MATH).
evaluation_method_considered_and_rejected:
  - term: rubric-graded
    reason: The Stage-3 record tags it for WildBench. Each judge reads a per-task checklist but
      returns one 1-10 score for the reply, not a verdict per criterion that is then combined, which
      the term's inclusion test asks.
    source: src-crfm-helm-capabilities-post
    quote: The original score is between 1 and 10, we rescale it to the range of 0 and 1 (1 mapped
      to 0.0 and 10 mapped to 1.0).
  - term: entrant-relative-ranking
    reason: The headline is a mean of each model's own scores. CRFM chose it over HELM's earlier
      mean win rate precisely because a win rate moves with the pool.
    source: src-crfm-helm-capabilities-post
    quote: This change is motivated by the fact that the mean win rate is 1) dependent on the set of
      models being compared
  - term: symbolic-equivalence
    reason: Omni-MATH answers are judged equivalent to the reference by LLM judges, not by a
      computer-algebra system.
    source: src-crfm-helm-capabilities-post
    quote: 'Omni-MATH: an LLM-as-a-judge annotator that compares the model prediction against the gold
      answer to determine whether they are equivalent.'
designed_for_subjects:
  - instruction-tuned-model
  - hosted-inference-endpoint
designed_for_subjects_basis:
  reason: Each model is prompted once per item, zero-shot, on the scenarios' official prompt
    templates, with no tools or loop, and IFEval and WildBench presuppose a model that takes
    instructions. The rows are served deployments, closed models through their providers' APIs and
    open models through Together AI's quantized Turbo variants or FP8 builds, and the row names keep
    the serving variant.
  source: src-crfm-helm-capabilities-post
  quote: For Llama and Qwen models, we used the Turbo variants of the models, which are models that
    have been quantized using Together AI
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: Reasoning models are on the board, some at a named setting (Claude 4 Sonnet with
      extended thinking), but the suite is not built around a reasoning budget; it is a condition of
      those rows, as mmlu-pro's near miss reads it.
    source: src-helm-capabilities-v1-15-0-core-scenarios
    quote: '{ "value": "Claude 4 Sonnet (20250514, extended thinking)", "description": "", "markdown":
      false }'
  - term: base-model
    reason: The prompts are the scenarios' official instruction templates answered in free text,
      which presupposes instruction tuning; ifeval is the term's own near miss.

lifecycle: mature
lifecycle_basis:
  reason: The record is frozen. HELM entered maintenance mode on 2026-06-01 and adds no new
    evaluations; the last release is v1.15.0 (2025-11-24). The code and the leaderboard stay
    available, and the leaderboard was in outside use, as a September 2025 paper reviewing its
    grading shows. helm-capabilities is the term's own example (ADR-0019).
  source: src-helm-docs-maintenance-mode-capabilities
  quote: The HELM code and leaderboards will continue to be available as open-source resources for
    the community.
activity: closed
activity_basis:
  reason: Maintenance mode formally stops new results on HELM's leaderboards, ADR-0019's case.
    Outsiders never submitted results; contributions of notable models to the HELM code are still
    welcome, but they are not a route onto the board.
  source: src-helm-docs-maintenance-mode-capabilities
  quote: However, no new features will be added to HELM, and no new evaluations will be added to the
    HELM leaderboards.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-5 mini (2025-08-07)
    source: src-helm-capabilities-v1-15-0-core-scenarios
    observed_on: 2026-10-14
    quote: '{ "value": "GPT-5 mini (2025-08-07)", "description": "", "markdown": false }, { "value": 0.8189777476920754,
      "markdown": false }'
    note: The top mean score in release v1.15.0, the release the leaderboard serves.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: MMLU-Pro, GPQA and Omni-MATH are scored against their stored answers
  (Omni-MATH's equivalence decided by judge models). IFEval has no reference answers, only
  instructions a script verifies, and WildBench has none; judge models score its replies against a
  checklist.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The HELM package, the run entries and the schema are public, and every constituent set is
    public. The judges and most models are reached through providers' APIs, and two of the three
    judges have since been retired (execution).
  source: src-helm-docs-reproducing-leaderboards-capabilities
  quote: You can use the HELM package to rerun evaluation runs and recreate a specific public
    leaderboard.

task:
  exists: true
  input:
    - 'one item of a scenario: a ten-option MMLU-Pro or four-option GPQA question, an IFEval prompt with
      verifiable instructions, a WildBench conversation ending in a user turn, or an Omni-MATH problem'
  output: Free text. For the two multiple-choice scenarios, a chain of thought ending in the chosen
    option; otherwise the response or the solution.
  scoring: Accuracy for MMLU-Pro and GPQA, IFEval strict accuracy (the fraction of an instance's
    instructions followed), the WildBench score rescaled from 1-10 to 0-1, and judged accuracy for
    Omni-MATH. The headline Mean score averages the five.
  metric_range:
    - 0
    - 1
  source: src-crfm-helm-capabilities-post
  quote: The models are ranked based on the mean score, which aggregates metrics across scenarios
    with the WB score (1-10) rescaled to 0-1.
scale:
  at_publication:
    source: src-crfm-helm-capabilities-post
    quote: In total, 22 models were benchmarked across 5 capability-focused scenarios.
    models: 22
    scenarios: 5
scale_note: At v1.15.0, the release the leaderboard serves, 68 models, each run on all five
  scenarios.
scale_source: src-helm-capabilities-v1-15-0-groups
scale_quote: '{ "value": 68, "markdown": false } ] ], "links": [] }, { "title": "Scenarios"'

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: HELM's scenario code loads each constituent from Hugging Face at a pinned revision.
    TIGER-Lab/MMLU-Pro, google/IFEval, allenai/WildBench and KbsdJames/Omni-MATH are ungated;
    Idavidrein/gpqa is auto-gated (Hugging Face API, read 2026-10-14). GPQA's authors also ship it
    as a password-protected zip whose password their README prints (read 2026-10-14), and the
    dataset asks users not to reveal its examples online. Both are anti-contamination devices, not
    gates.
  access_basis:
    reason: The five constituent sets are public and HELM's code fetches them; nothing behind the
      headline is held by the maintainers. The post itself withholds GPQA examples under GPQA's
      no-reveal request.
    source: src-crfm-helm-capabilities-post
    quote: to reduce the risk of leakage into foundation model training corpora
  records_access: fully-open
  records_access_basis:
    reason: Every prompt and completion behind the board is published with it, as for all HELM
      leaderboards.
    source: src-crfm-helm-capabilities-post
    quote: the HELM Capabilities leaderboard provides full prompt-level transparency
  refresh: versioned-releases
  refresh_basis:
    reason: Results come in numbered releases, v1.0.0 to v1.15.0, each adding model runs to a
      cumulative list of suites, and a score is fixed within its release. The five scenarios and
      their instance counts are the same in v1.0.0 and v1.15.0 (both releases' schema and scenario
      records read). helm-capabilities is continuously-reexecuted's near miss.
    source: src-helm-capabilities-v1-15-0-summary
    quote: '"suites": [ "v1.0.0", "v1.1.0"'
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: Every item comes from one of five published benchmarks, downsampled to at
    most 1,000 instances (MMLU-Pro from 12,000 questions, WildBench from 1,024 conversations,
    Omni-MATH from 4,428 problems). Each constituent's own paper documents how its items were
    written. helm-capabilities is the term's own example.
  data_provenance_source: src-crfm-helm-capabilities-post
  data_provenance_quote: For each capability, we selected a scenario out of the available scenarios
    in the existing literature
  contamination_risk: medium
  contamination_risk_note: All five sets are public and static, released between November 2023 and
    October 2024, so a training route is plausible; GPQA's no-reveal request exists for that reason.
    No source read here evidences a route.
  contamination_risk_source: src-crfm-helm-capabilities-post
  contamination_risk_quote: to reduce the risk of leakage into foundation model training corpora
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: Every column is on 0-1, WildBench after rescaling, so the Mean score is bounded at 1,
      and no source reads the scores against a human or measured ceiling.
    source: src-crfm-helm-capabilities-post
    quote: The models are ranked based on the mean score, which aggregates metrics across scenarios
      with the WB score (1-10) rescaled to 0-1.
  dataset_licence: null
  dataset_licence_note: The suite has no licence of its own; each constituent keeps its own.
  upstream_licences: MMLU-Pro MIT, IFEval Apache-2.0, Omni-MATH Apache-2.0 and GPQA CC-BY-4.0, from
    their Hugging Face metadata read 2026-10-14; allenai/WildBench carries no licence tag there.
  size:
    - count: 5
      unit: scenarios (MMLU-Pro, GPQA, IFEval, WildBench, Omni-MATH)
      source: src-crfm-helm-capabilities-post
      quote: In total, 22 models were benchmarked across 5 capability-focused scenarios.
    - count: 1000
      unit: questions, ten options each, sampled from about 12,000
      subset: MMLU-Pro (release v1.15.0)
      source: src-helm-capabilities-v1-15-0-groups
      quote: '{ "value": "MMLU-Pro", "markdown": true }, { "value": "multiple_choice_joint_chain_of_thought",
        "markdown": false }, { "value": 1000.0, "description": "min=1000, mean=1000, max=1000, sum=68000
        (68)"'
    - count: 446
      unit: questions of the main set, four options each
      subset: GPQA (release v1.15.0)
      source: src-helm-capabilities-v1-15-0-groups
      quote: '{ "value": "GPQA", "markdown": true }, { "value": "multiple_choice_joint_chain_of_thought",
        "markdown": false }, { "value": 446.0'
    - count: 541
      unit: prompts with verifiable instructions
      subset: IFEval (release v1.15.0)
      source: src-helm-capabilities-v1-15-0-groups
      quote: '{ "value": "IFEval", "markdown": true }, { "value": "generation", "markdown": false }, {
        "value": 541.0'
    - count: 1000
      unit: conversations, sampled from 1,024
      subset: WildBench (release v1.15.0)
      source: src-helm-capabilities-v1-15-0-groups
      quote: '{ "value": "WildBench", "markdown": true }, { "value": "chat", "markdown": false }, { "value":
        1000.0'
    - count: 1000
      unit: problems, sampled from 4,428
      subset: Omni-MATH (release v1.15.0)
      source: src-helm-capabilities-v1-15-0-groups
      quote: '{ "value": "Omni-MATH", "markdown": true }, { "value": "generation", "markdown": false },
        { "value": 1000.0'
  size_note: 3,987 instances per model in all, the sum of the five.
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Stanford Center for Research on Foundation Models (CRFM)
  maintainer_basis:
    reason: The leaderboard is one of HELM's flagship boards, HELM sits in the stanford-crfm
      organisation, and the README names CRFM as its creator. Since 2026-06-01 volunteer maintainers
      keep HELM on a best-effort basis.
    source: src-github-helm-readme-capabilities
    quote: is an open source Python framework created by the [Center for Research on Foundation
      Models (CRFM) at Stanford](https://crfm.stanford.edu/)
  maintainer_type: academic-lab
  submission_process:
    - maintainer-run
  submission_process_note: CRFM chose the models and ran every evaluation through its own pipeline
    and judges; no source describes a route for a developer to submit. Maintenance mode stopped new
    evaluations on 2026-06-01. helm-capabilities is the term's own example.
  submission_process_source: src-crfm-helm-capabilities-post
  submission_process_quote: We chose these models as they are positioned as the flagship models from
    mainstream model providers
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-crfm-helm-capabilities-post
      quote: 'We would also like to acknowledge the following companies for providing model APIs that
        were instrumental in this work: Together AI, OpenAI, Google, Anthropic, Amazon, and Writer.'
    - flag: grader-from-evaluated-party
      source: src-crfm-helm-capabilities-post
      quote: 'To reduce variance, we used three LLM-as-a-judge models: GPT-4o (20240513), LLaMA 3.1 405B
        Instruct Turbo, and Claude 3.5 Sonnet (20241022).'
    - flag: maintainer-competes-on-own-benchmark
      source: src-hf-marin-8b-instruct-card
      quote: The Marin team at Stanford CRFM.
  independence_flags_note: The donors of API access (OpenAI, Google, Anthropic, Amazon, Writer, and
    Together AI, which serves the open models) have models ranked. Two of the three judges are
    themselves ranked rows of v1.15.0, Llama 3.1 Instruct Turbo (405B) and Claude 3.5 Sonnet
    (20241022), and the third, GPT-4o (2024-05-13), is an earlier snapshot of the ranked GPT-4o
    (2024-11-20). Marin 8B Instruct, ranked last in v1.15.0, was developed by the Marin team at
    Stanford CRFM, the maintainer; the board attributes it to the Marin Community.
  independence_assessed: true
  funding:
    source: src-crfm-helm-capabilities-post
    quote: HELM Capabilties is funded by the HAI Industrial Affiliates Program.
  funding_note: The post's own spelling. Stanford HAI's industrial affiliates are not listed in the
    sources read.
  known_limitation:
    source: src-arxiv-2509-04664-v1
    quote: It consists of five scenarios, four of which clearly give no credit for IDK and one of
      which seems to give less credit for IDK than a fair response with factual errors or
      hallucinations, thus also encouraging guessing.
  known_limitation_note: An OpenAI and Georgia Tech paper (September 2025) reviews the leaderboard's
    grading and finds that none of the five scenarios rewards abstaining, so the mean rewards
    guessing over admitting uncertainty; on WildBench an "I don't know" reply may score below a fair
    reply with factual errors.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: Closed models are called through their providers' APIs and open ones through Together
      AI's, and the judges are API calls too. A run needs inference spend and ordinary CPU.
    source: src-crfm-helm-capabilities-post
    quote: For models from OpenAI, Anthropic, Google, Amazon, and Writer, we used their official API
      endpoint.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: HELM reruns the runs and rebuilds the leaderboard with no human step. The published
      WildBench and Omni-MATH scores, though, average three judges, and HELM's annotators at main
      now call GPT-4o (2024-05-13) alone, because the other two were retired by their providers; a
      rerun today scores those two columns differently.
    source: src-github-helm-wildbench-annotator
    quote: '# NOTE: meta/llama-3.1-405b-instruct-turbo was deprecated on March 6, 2026.'
  reproducibility_blockers: []
  reproducibility_blockers_note: No term names a retired hosted judge or a retired served model
    (failure 2026-09-28-helm-capabilities-007 proposes hosted-judge-dependency). Claude 3.5 Sonnet
    (20241022) was retired on 2025-10-28 and Llama 3.1 405B Instruct Turbo on 2026-03-06, by the
    annotators' own comments, and the maintenance page warns that providers deprecate models.
  reproducibility_blockers_source: src-helm-docs-maintenance-mode-capabilities
  reproducibility_blockers_quote: Additionally, model providers may deprecate models over time.
  harness_availability: official-harness
  harness: HELM (crfm-helm) with run_entries_capabilities_reasoning_v2.conf and
    schema_capabilities.yaml
  harness_note: >
    UK AISI's inspect_evals (its src/inspect_evals listing at main, read 2026-10-14 through the GitHub
    API) has mmlu_pro, gpqa and ifeval tasks but none for WildBench, Omni-MATH or the suite, so it cannot
    produce the HELM Capabilities score. Its three tasks were not compared with HELM's prompts; HELM's
    1,000-question MMLU-Pro sample and 446-question GPQA main set alone make the numbers differ.
  harness_source: src-helm-docs-reproducing-leaderboards-capabilities
  harness_quote: Capabilities export
    RUN_ENTRIES_CONF_PATH=run_entries_capabilities_reasoning_v2.conf export
    SCHEMA_PATH=schema_capabilities.yaml export NUM_TRAIN_TRIALS=1 export NUM_EVAL_INSTANCES=1000
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for stanford-crfm/helm reports Apache-2.0 too, read
    2026-10-14.
  code_licence_source: src-helm-docs-maintenance-mode-capabilities
  code_licence_quote: comply with the terms of the Apache 2.0 License
  runnable_via:
    - helm
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the resolved profiles: HELM's own prompt construction, which fixes what a column means. It runs
  # MMLU-Pro on GPQA's zero-shot chain-of-thought template, widens the answer-extraction regex, judges
  # Omni-MATH on HELM Safety's prompt and caps every scenario at 1,000 instances. A score from another
  # harness on the same datasets is a different number.
  material_extra:
    - harness
aggregation_policy: official-aggregate
aggregation_policy_note: The leaderboard's column header defines it as "The mean of the scores from
  all columns", an unweighted mean (src-helm-capabilities-v1-15-0-core-scenarios).
aggregation_policy_basis:
  reason: The leaderboard's headline is a Mean score over the five columns, each on 0-1, with
    WildBench rescaled from 1-10.
  source: src-crfm-helm-capabilities-post
  quote: The models are ranked based on the mean score, which aggregates metrics across scenarios
    with the WB score (1-10) rescaled to 0-1.
secondary_axes:
  - latency
secondary_axes_basis:
  reason: The leaderboard's Efficiency table reports each model's observed inference time per
    scenario beside the accuracy table. It is measured through the provider's API, so it depends on
    the deployment.
  source: src-helm-capabilities-v1-15-0-core-scenarios
  quote: '"value": "MMLU-Pro - Observed inference time (s)"'

homepage: https://crfm.stanford.edu/helm/capabilities/latest/
repository: https://github.com/stanford-crfm/helm
leaderboard_url: https://crfm.stanford.edu/helm/capabilities/latest/
maintainer_url: https://crfm.stanford.edu/

versions:
  - version: v1.0.0
    label: HELM Capabilities v1.0.0
    version_kind: revision
    released: 2025-03-20
    changes: The first release, with the five scenarios and the 22 models named in the announcement.
    frozen: true
    sources:
      - src-crfm-helm-capabilities-post
      - src-helm-capabilities-v1-0-0-summary
  - version: v1.15.0
    label: HELM Capabilities v1.15.0, the release the leaderboard serves
    version_kind: revision
    released: 2025-11-24
    changes: The sixteenth and last release before maintenance mode. Releases v1.1.0 to v1.14.0
      (2025-04-04 to 2025-10-02, from their summary records) each added model runs, and v1.15.0
      holds 68 models over the same five scenarios.
    frozen: true
    sources:
      - src-helm-capabilities-leaderboard
      - src-helm-capabilities-v1-15-0-summary
      - src-helm-capabilities-v1-15-0-groups

subsets:
  - id: helm-capabilities#mmlu-pro
    label: MMLU-Pro
    items: 1000
    scored_separately: true
    domain_override:
      primary: general-intelligence/multi-subject-knowledge-exams
    capability_override:
      - knowledge-recall
    evidence:
      - source: src-crfm-helm-capabilities-post
        quote: General Knowledge Accuracy 12k downsampled to 1k
      - source: src-crfm-helm-capabilities-post
        quote: MMLU-Pro does not have an official prompt template for zero-shot Chain-of-Thought
          setting, so we used the same prompt template as GPQA.
      - source: src-github-helm-capabilities-run-entries
        quote: '{description: "mmlu_pro:subject=all,output_format_instructions=mmlu_pro_suffix,increase_max_tokens=10000,model=text",
          priority: 1}'
    notes: 1,000 questions sampled across all subjects, ten options (chance 10%), zero-shot chain of
      thought on GPQA's prompt template, the chosen letter extracted by regular expression and
      scored by accuracy. MMLU-Pro has its own entry (mmlu-pro), curated separately; this subset
      records only how HELM runs it.
  - id: helm-capabilities#gpqa
    label: GPQA
    items: 446
    scored_separately: true
    domain_override:
      primary: general-intelligence/multi-subject-knowledge-exams
    capability_override:
      - knowledge-recall
    evidence:
      - source: src-crfm-helm-capabilities-post
        quote: Reasoning Accuracy 448
      - source: src-github-helm-capabilities-run-entries
        quote: '{description: "gpqa:subset=main,output_format_instructions=gpqa_suffix,increase_max_tokens=10000,model=text",
          priority: 1}'
      - source: src-github-helm-gpqa-scenario
        quote: '"gpqa_main": [339, 105],'
    notes: GPQA's main set, not the diamond subset. The post gives 448 questions; HELM's GPQA
      scenario sets two aside as chain-of-thought examples, so 446 are scored. Four options (chance
      25%), zero-shot chain of thought on GPQA's official template, scored by accuracy.
  - id: helm-capabilities#ifeval
    label: IFEval
    items: 541
    scored_separately: true
    domain_override:
      primary: language/generation
    capability_override:
      - instruction-following
    evidence:
      - source: src-crfm-helm-capabilities-post
        quote: 'IFEval: evaluator logic from the official implementation, which identifies instruction
          types and verifies instruction fulfillment.'
      - source: src-helm-capabilities-v1-15-0-schema
        quote: '"description": "Fraction of instructions in the instance that are correctly followed."'
    notes: Prompts carrying one or more verifiable instructions, checked by the official script. The
      score is strict accuracy, the fraction of an instance's instructions followed, so a prompt can
      earn partial credit.
  - id: helm-capabilities#wildbench
    label: WildBench
    items: 1000
    scored_separately: true
    domain_override:
      primary: language/generation
    capability_override:
      - instruction-following
    evidence:
      - source: src-crfm-helm-capabilities-post
        quote: WB-Score 1024 downsampled to 1k
      - source: src-github-helm-capabilities-run-entries
        quote: '{description: "wildbench:subset=v2,increase_max_tokens=10000,model=text", priority: 1}'
      - source: src-helm-capabilities-v1-15-0-schema
        quote: '"task": "instruction following", "what": "GPT-judged instruction following with instructions
          collected from real-user conversations"'
      - source: src-helm-capabilities-v1-15-0-schema
        quote: '"description": "Score of the AI output judged by GPT-4o, rescaled to be between 0 and
          1."'
      - source: src-github-helm-wildbench-annotator
        quote: '# NOTE: anthropic/claude-3-5-sonnet-20241022 was deprecated on October 28, 2025.'
    notes: 1,000 of WildBench v2's 1,024 real-user conversations. The model writes the next reply;
      each judge reads the conversation, the reply and a per-task checklist and returns one score
      from 1 to 10, and the three judges' scores are averaged and rescaled to 0-1. The post calls
      the capability dialogue, HELM's schema instruction following. The schema's metric text names
      GPT-4o alone, and HELM's annotator at main calls only GPT-4o since the other two judges were
      retired.
  - id: helm-capabilities#omni-math
    label: Omni-MATH
    items: 1000
    scored_separately: true
    domain_override:
      primary: mathematics/competition-math
    capability_override:
      - quantitative-reasoning
    evidence:
      - source: src-crfm-helm-capabilities-post
        quote: Model-judged Accuracy 4428 downsampled to 1k
      - source: src-crfm-helm-capabilities-post
        quote: we deviated from the judging prompt template from the original Omni-MATH paper and
          used the HELM Safety LLM-as-a-judge prompt
      - source: src-crfm-helm-capabilities-post
        quote: The annotator queries three different LLMs and takes the average of the votes.
      - source: src-github-helm-omni-math-annotator
        quote: '# NOTE: meta/llama-3.1-405b-instruct-turbo was deprecated on March 6, 2026.'
    notes: 1,000 of Omni-MATH's 4,428 olympiad-level problems. Each of the three judges decides
      whether the free-form answer is equivalent to the reference, on HELM Safety's judge prompt
      rather than Omni-MATH's own, and the votes are averaged. Omni-MATH has its own entry
      (omni-math), curated separately. HELM's annotator at main calls only GPT-4o (2024-05-13).


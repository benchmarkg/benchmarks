# data/benchmarks/general-intelligence/livebench.yaml
#
# P1-S11-T06, general-intelligence entry 11. Promotes the Epoch stub data/benchmarks/_stubs/livebench.yaml. Filled
# from the LiveBench paper, arXiv 2406.19314 read as its v2 PDF (ICLR 2025), and its abstract page; the README,
# changelog, LICENSE and datasheet of LiveBench/LiveBench at commit 1d1006a0 (2026-10-18); App.js and Averaging.js
# of LiveBench/livebench.github.io at commit 19e766a5 (2026-07-06), the repository that built the first-generation
# leaderboard site; from the script-rendered livebench.ai, its script bundle and the score table and two
# category files of the v1 releases it loads (read 2026-11-10, no key); Hugging Face's API record of
# livebench/math; the v1 PDF of the Qwen3 Technical Report (arXiv 2505.09388, May 2025), as evidence of outside
# use; and Epoch's benchmark export, which lists LiveBench outside its capabilities index. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# What the entry is: LiveBench's first generation, the dated releases 2024-06-24 to 2026-06-25 that livebench.ai
# now serves as "LiveBench v1", modelled as editions (04 S4: same task definition, items replaced each release).
# Since October 2026 the site leads with LiveBench 2.0, an agentic long-horizon benchmark of seven suites under
# the same name and sponsor, with its own dated releases and a rubric-graded suite. By 04 S4 that is a separate
# benchmark, not a version of this one; it has no id (allocation is a human act), so it is a lineage_note and a
# review check, not a lineage edge.

id: livebench
name: LiveBench
aliases:
  - LiveBench v1
  - LiveBench 1.0
tagline: Regularly refreshed LLM questions in seven categories, scored against ground truth with no
  LLM judge.
description: >
  A benchmark for language models built against test-set contamination and the biases of LLM
  judges. Every question has an objective answer that is scored automatically: exact answers,
  computer-algebra equivalence for generated mathematics, test execution for code, a checker for
  verifiable instructions, and partial credit for a few ordering and grouping tasks. Questions are
  drawn from recent sources (math competitions, arXiv abstracts, Guardian articles, Kaggle and
  Socrata datasets, film synopses) or are harder, regenerated versions of earlier tasks (Big-Bench
  Hard's Web of Lies, AMPS, IFEval). Each task score is the mean of its questions, each category the
  mean of its tasks, and the LiveBench score the mean of the categories. The first release (June
  2024) had 960 questions in 17 tasks across six categories; from July 2024 the set was held at
  1,000 questions, and each later release replaced about a sixth of them, retired or added tasks,
  and in May 2025 added an Agentic Coding category run in a SWE-agent loop. The last release,
  2026-06-25, has 23 tasks in seven categories. The newest questions are kept private for a while
  after each release; older ones are on Hugging Face. The maintainers, sponsored by Abacus.AI, run
  the models themselves and publish per-task scores for each release. From October 2026 livebench.ai
  leads with LiveBench 2.0, a separate agentic benchmark, and keeps these releases as LiveBench v1.
self_description:
  source: src-arxiv-2406-19314-v2
  quote: (1) LiveBench contains frequently-updated questions based on recent information sources;
    (2) LiveBench is scored automatically according to the objective ground truth without the use of
    an LLM judge; and (3) LiveBench questions are drawn from a diverse set of six categories.
external_ids:
  epoch: LiveBench
  huggingface: livebench
  arxiv: '2406.19314'
paper:
  title: 'LiveBench: A Challenging, Contamination-Limited LLM Benchmark'
  arxiv: '2406.19314'
  version_read: v2
  source: src-arxiv-2406-19314-v2
released: 2024-06-12
released_note: The datasheet's public date and the changelog's first entry. The paper's v1 followed
  on 2024-06-27, the date Epoch's export and the stub carry, and the first board release is
  2024-06-24.
released_source: src-github-livebench-datasheet
released_quote: The benchmark suite is public as of June 12, 2024, distributed under the Apache
  License 2.0.
release_venue: ICLR 2025 (Spotlight)
release_venue_source: src-arxiv-2406-19314
release_venue_quote: 'Comments: ICLR 2025 Spotlight'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: general-intelligence/agi-composite-suites
  secondary:
    - mathematics/competition-math
    - reasoning-general/logical-deduction
    - code/function-synthesis
domain_basis:
  reason: The headline averages categories that belong to different families, competition and
    generated mathematics, code generation and agentic repository fixes, logic puzzles, word and
    text-repair tasks, verifiable instructions and table wrangling, scored by different methods,
    into one number. That is the suite leaf's definition, as helm-capabilities takes it. Its breadth
    does not lie inside one family (the family exclusion); mathematics, code, reasoning-general and
    language each hold one or two of the seven categories, and no family has a suite leaf that takes
    them all. The largest constituents' leaves are secondary; each subset carries its own.
  source: src-arxiv-2406-19314-v2
  quote: we compute the score on each of the six categories as the average of all their tasks, and
    we compute the final LiveBench score as the average of all six categories.
domain_considered_and_rejected:
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: The items are not closed-ended subject-knowledge questions; most are puzzles, code,
      generated mathematics and text transformations, and the headline aggregates heterogeneous
      formats, which that leaf's exclusion sends to agi-composite-suites.
  - term: agents-tooluse/agent-evaluation-suites
    reason: Only the Agentic Coding category, added in May 2025, runs an agent loop; the other six
      are single-turn questions. LiveBench 2.0, which is mostly agentic, is not this entry.
    source: src-github-livebench-changelog
    quote: This update introduces a new agentic coding category, where models must operate in a
      multi-turn, realistic development environment to resolve issues from real Github repositories.
capability:
  - quantitative-reasoning
  - deductive-reasoning
  - spatial-reasoning
  - instruction-following
capability_basis:
  quantitative-reasoning:
    reason: The Mathematics category's answers are numbers and expressions from competition problems
      and generated calculus and algebra items (AMPS_Hard), the latter checked for symbolic and
      numerical equivalence.
    source: src-arxiv-2406-19314-v2
    quote: where we check for semantic as well as numerical equivalence of mathematical expressions
  deductive-reasoning:
    reason: Web of Lies asks the truth value of a Boolean function stated as a word problem and the
      Zebra puzzles ask what follows from a set of constraints; both are decidable from the stated
      premises alone.
    source: src-arxiv-2406-19314-v2
    quote: We create new, significantly harder questions by including additional deductive
      components and several types of red herrings.
  spatial-reasoning:
    reason: The spatial task's handwritten questions turn on intersections and orientations of 2D
      and 3D shapes that must be inferred from a description.
    source: src-github-livebench-changelog
    quote: It also introduced a new spatial reasoning task
  instruction-following:
    reason: The instruction-following tasks score only whether the response obeys randomly drawn
      verifiable instructions about a supplied news article, and the paper claims instruction
      following for them.
    source: src-arxiv-2406-19314-v2
    quote: We score tasks purely by their adherence to the instructions.
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: Questions are built from recent material or generated so that recall does not help; the
      answer is worked out, not remembered.
  - term: context-integration
    reason: It fits the Data Analysis and Language tasks, where the supplied table or text decides
      the answer, and is kept on those subsets, but not on the headline, whose mathematics, logic
      and coding items are self-contained.
  - term: tool-use
    reason: Only Agentic Coding runs a tool-using agent loop; it is kept on that subset.

evaluation_method:
  - exact-match
  - symbolic-equivalence
  - execution-tests
  - constraint-check
  - composite
evaluation_method_basis:
  reason: Every question is scored 0-1 by a script against stored ground truth. Most tasks compare a
    parsed final answer with the reference (exact-match); AMPS_Hard checks expressions for
    equivalence with SymPy; both coding tasks report pass@1 on hidden and public tests, and Agentic
    Coding runs repository test suites through the Multi-SWE-Bench harness; the instruction tasks
    run a checker over each instruction. Category and overall scores are unweighted means of these
    different methods (composite).
  source: src-arxiv-2406-19314-v2
  quote: For each question, a model receives a score from 0 to 1.
evaluation_method_considered_and_rejected:
  - term: model-graded-judge
    reason: No LLM judge scores anything; the paper's whole design is set against judging, and the
      changelog cites a 46% judge error rate on hard questions as the reason.
    source: src-github-livebench-changelog
    quote: the pass/fail judgments from GPT-4-Turbo have an error rate of up to 46%.
  - term: reference-metric
    reason: Plot unscrambling scores one minus the Levenshtein distance between sentence orderings
      and olympiad an edit distance between equation orderings, a fixed formula against a reference;
      they are two of 23 tasks and scored inside categories whose other tasks are exact, so the term
      is not tagged on the headline (review_checks).
    source: src-arxiv-2406-19314-v2
    quote: is the Levenshtein distance
  - term: rubric-graded
    reason: LiveBench 2.0's Research suite is graded against a rubric; nothing in the v1 releases
      this entry names is.
    source: src-livebench-ai-main-js
    quote: Open-ended research reports graded against a rubric.
  - term: entrant-relative-ranking
    reason: Each model's score is the mean of its own question scores; adding models changes nothing
      for the others.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: Each question is one zero-shot, chain-of-thought chat prompt answered in a single turn
    under the model's own chat template, at temperature 0 unless the model's card says otherwise,
    and parsed from a requested answer format; that presupposes a model that takes instructions.
  source: src-arxiv-2406-19314-v2
  quote: For all models and tasks, we perform single-turn evaluation with temperature 0, unless
    otherwise noted in the model card.
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: Most rows on the 2026-06-25 table are reasoning models at a named effort setting, and
      the row names carry it, but the questions are not built around a reasoning budget; it is a
      condition of those rows.
    source: src-livebench-ai-v1-table-2026-06-25
    quote: claude-fable-5-1-max-effort,99.0,82.609,90.141,99.333,90.555,99.0
  - term: agent-scaffold
    reason: Agentic Coding runs every model inside the same agent (mini-SWE-agent since October
      2025), but it is one category of seven; the subset carries the scaffold.
    source: src-github-livebench-changelog
    quote: Switched the agent used for agentic coding to
      [Mini-SWE-Agent](https://mini-swe-agent.com/latest/) instead of SWE-Agent
  - term: base-model
    reason: The prompts are chat-templated instructions with an answer format, which presupposes
      instruction tuning.
    source: src-arxiv-2406-19314-v2
    quote: All models run with their respective templates from our updated version of FastChat
as_used:
  - protocol: Model developers report a score on a named public release, LiveBench 2024-11-25, in
      their own release reports, without stating the categories, effort or parsing used.
    source: src-arxiv-2505-09388-v1
    quote: LiveBench 2024-11-25 75.7 71.6 - 82.4 77.1
    note: The Qwen3 Technical Report (May 2025) lists LiveBench 2024-11-25 among the General Tasks
      of its Table 11; the five numbers are OpenAI-o1, DeepSeek-R1, Grok-3 Beta (Think, not
      reported), Gemini 2.5 Pro and Qwen3-235B-A22B (thinking), read in the table's column order.
      2024-11-25 is the newest release whose questions the README calls public.
lifecycle: active
lifecycle_basis:
  reason: The maintainers are still producing results on the last v1 release. The 2026-06-25 table
    livebench.ai loads has 71 rows against 28 in the site repository's copy of 2026-07-06, the added
    rows including models absent in July, and outside model reports use earlier releases (as_used).
    Since October 2026 the site leads with LiveBench 2.0, so superseded is the near reading
    (review_checks).
  source: src-livebench-ai-v1-table-2026-06-25
  quote: claude-fable-5-1-max-effort,99.0,82.609,90.141,99.333,90.555,99.0
activity: accepting-submissions
activity_basis:
  reason: The README, at the October 2026 head of the code repository, still invites developers to
    ask for an evaluation by opening an issue, and the maintainers run the model; the leaderboard
    has no rounds. The current site's v1 pages repeat no such invitation (review_checks).
  source: src-github-livebench-readme
  quote: '**We will evaluate your model!** Open an [issue](https://github.com/LiveBench/LiveBench/issues)'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude Fable 5.1 (max effort)
    source: src-livebench-ai-v1-table-2026-06-25
    observed_on: 2026-11-10
    quote: claude-fable-5-1-max-effort,99.0,82.609,90.141,99.333,90.555,99.0
    note: The top row of release 2026-06-25 by the overall score recomputed from this table and the
      release's categories file, 83.4 (the page computes it in the browser and stores no overall).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Most tasks are scored against a stored answer; the coding tasks against
  stored test cases, Agentic Coding against each repository's tests, and the instruction tasks by a
  checker over the instructions drawn for the item.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The code and the older questions are public, but the questions of the newest releases are
    not; the README tells outside users to run the 2024-11-25 release to cover every category, so
    the current release's scores cannot be recomputed from public material.
  source: src-github-livebench-readme
  quote: The current LiveBench release is 2025-04-25; however, not all questions for this release
    are public on Huggingface.

task:
  exists: true
  input:
    - 'one question: a zero-shot chain-of-thought prompt carrying the problem (a competition or generated
      math item, a coding problem or partial solution, a logic or spatial puzzle, a word puzzle or text
      to repair, a news article with instructions, or one or two data tables) and the format for the final
      answer'
    - for Agentic Coding, a repository issue to resolve inside an agent loop
  output: Free text ending in the answer in the requested format (bold text or solution tags), code,
    or for Agentic Coding a patch to the repository.
  scoring: Each question scores 0-1. A task is the mean of its questions, a category the mean of its
    tasks, and the LiveBench score the unweighted mean of the categories.
  metric_range:
    - 0
    - 100
  source: src-arxiv-2406-19314-v2
  quote: we compute the score on each of the six categories as the average of all their tasks, and
    we compute the final LiveBench score as the average of all six categories.
scale:
  at_publication:
    source: src-arxiv-2406-19314-v2
    quote: 'LiveBench currently consists of 18 tasks across 6 categories: math, coding, reasoning, language,
      instruction following, and data analysis.'
    tasks: 18
    categories: 6
scale_note: At the paper's v2 (April 2025) 18 tasks and 40 models; at the last v1 release
  (2026-06-25) 23 tasks in seven categories and 71 rows on the table livebench.ai loads.
scale_source: src-github-livebench-site-app
scale_quote: LiveBench currently contains a set of 23 diverse tasks across 7 categories

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: Questions are released on Hugging Face (the livebench organisation, one set per
    category, ungated) some time after the release that introduced them, so the newest questions
    behind each release's headline are held by the maintainers, who run every model themselves. The
    category sets were last modified on 2025-04-07 (Hugging Face API, read 2026-11-10), so no
    question introduced after the 2025-04-02 release appears to be public, against a stated delay of
    one month (review_checks).
  access_basis:
    reason: The headline of a release is computed over all its questions, and the newest are held
      back on purpose; private-test-server's test takes a headline that cannot be computed without a
      held set.
    source: src-github-livebench-site-app
    quote: To further reduce contamination, we delay publicly releasing the questions from the
      most-recent updates.
  access_by_phase:
    during_edition: private-test-server. The questions added in the current release are not
      published, so the headline cannot be computed from public material.
    after_edition: fully-open. Earlier releases' questions, ground truths, model answers and
      judgments are on Hugging Face with no gate.
    note: The paper states a one-month delay; the site says only that the most recent updates are
      released later.
  records_access: fully-open
  records_access_basis:
    reason: Per-task scores for every model and release are published as the tables the site loads,
      and the maintainers release model answers and scoring records on Hugging Face.
    source: src-github-livebench-readme
    quote: Also available are the [model
      answers](https://huggingface.co/datasets/livebench/model_answer) and the [model
      judgments](https://huggingface.co/datasets/livebench/model_judgment).
  refresh: versioned-releases
  refresh_basis:
    reason: Questions change only at dated releases, each a slider position on the site and an entry
      in the changelog, and a score is reported against its release. Scoring fixes and the October
      2025 agentic re-run changed scores inside a release, announced in the changelog; rolling-live
      is the near reading (review_checks).
    source: src-arxiv-2406-19314-v2
    quote: In each update, we replace 1/6 of the questions on average, so that the benchmark is
      fully refreshed roughly every 6 months.
  data_provenance:
    - exam-derived
    - web-scraped
    - synthetic-procedural
    - expert-authored
  data_provenance_note: Math competitions (AMC, AIME, SMC, USAMO, IMO), reworded or turned into
    equation-ordering tasks, are exam-derived; arXiv abstracts, Guardian articles, film synopses,
    NYT Connections puzzles and Kaggle and Socrata tables are web-scraped; AMPS_Hard, Web of Lies
    and Zebra puzzles come from generators; the spatial questions were handwritten by the authors.
    The early coding questions came from LiveCodeBench, replaced from 2025-04-25 by new ones, and
    Agentic Coding uses issues from real GitHub repositories.
  data_provenance_source: src-arxiv-2406-19314-v2
  data_provenance_quote: In Competitions, we include questions from AMC12 2023, SMC 2023, and AIME
    2024 modifying the prose and the answer order
  contamination_risk: medium
  contamination_risk_note: The structure works against contamination, and each device is quoted
    under contamination_evidence (stance against); questions from sources newer than most training
    cutoffs; about a sixth of the questions replaced at each release; the newest questions withheld
    after release; the question generators kept private and changed at each refresh; and scoring
    against ground truth with no LLM judge. But most of a release's questions are public on Hugging
    Face from earlier releases, and the maintainers say themselves that part of the set is likely
    contaminated (AMC questions modified only lightly in the paper's version; coding questions
    replaced in April 2025 because they were likely heavily contaminated). A route is plausible and
    acknowledged, not evidenced for the current release, so medium; low would need the structure to
    exclude a route.
  contamination_risk_source: src-arxiv-2406-19314-v2
  contamination_risk_quote: Therefore, a limited fraction of LiveBench is likely contaminated on all
    recent LLMs.
  contamination_evidence:
    - source: src-arxiv-2406-19314-v2
      stance: against
      quote: (1) LiveBench contains frequently-updated questions based on recent information sources
    - source: src-arxiv-2406-19314-v2
      stance: against
      quote: In each update, we replace 1/6 of the questions on average, so that the benchmark is
        fully refreshed roughly every 6 months.
    - source: src-arxiv-2406-19314-v2
      stance: against
      quote: Each month, we do not release the new questions until one month later, so that the
        public leaderboard always has 1/6 questions that are private.
    - source: src-github-livebench-site-app
      stance: against
      quote: To further reduce contamination, we delay publicly releasing the questions from the
        most-recent updates.
    - source: src-arxiv-2406-19314-v2
      stance: against
      quote: we do not publicly release any of the code used to generate LiveBench questions
    - source: src-github-livebench-readme
      stance: against
      quote: Each question has verifiable, objective ground-truth answers, allowing hard questions
        to be scored accurately and automatically, without the use of an LLM judge.
    - source: src-github-livebench-changelog
      stance: supports
      quote: The previous questions were likely heavily contaminated for newer models.
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: Each question scores 0-1 and every average is unweighted, so 100 is the bound; no source
      gives a human or measured ceiling. The 2026-06-25 Mathematics category averages about 97 for
      the leading rows (recomputed from the table), near that bound.
    source: src-arxiv-2406-19314-v2
    quote: For each question, a model receives a score from 0 to 1.
  dataset_licence: Apache-2.0
  dataset_licence_note: The datasheet distributes the benchmark under the Apache License 2.0 and
    says there are no copyrights on the data. The Hugging Face sets carry no licence tag (API, read
    2026-11-10).
  dataset_licence_source: src-github-livebench-datasheet
  dataset_licence_quote: There are no copyrights on the data.
  upstream_licences: Not stated for the material questions are built from (Guardian articles, arXiv
    abstracts, IMDb and Wikipedia synopses, Kaggle and Socrata datasets, NYT puzzles, competition
    problems, LiveCodeBench questions); no source read gives their terms.
  size:
    - count: 1000
      unit: questions per release from July 2024, a sixth replaced at each refresh
      source: src-github-livebench-changelog
      quote: This brought the total number of questions to 1000, and all future updates add and
        remove the same number, to stay at 1000 total questions.
    - count: 960
      unit: questions in 17 tasks across six categories
      subset: first release (2024-06-12)
      source: src-github-livebench-changelog
      quote: Today, we release the initial batch of 960 questions and plan to release sets of
        questions every month.
    - count: 23
      unit: tasks across seven categories
      subset: release 2026-06-25
      source: src-livebench-ai-v1-categories-2026-06-25
      quote: '"Agentic Coding": [ "javascript", "typescript", "python" ]'
    - count: 368
      unit: public math questions across releases, with release and removal dates
      subset: livebench/math on Hugging Face (2025-04-07)
      source: src-hf-api-livebench-math
      quote: '"num_examples":368'
  size_note: The paper's 1,000 questions (its Table 15) run 36 to 100 per task. No source read gives
    the question counts of the 2026-06-25 release or of Agentic Coding, so whether the 1,000 still
    holds is open (review_checks).
  languages:
    - English
    - Python
    - JavaScript
    - TypeScript

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: LiveBench (the paper's authors, sponsored by Abacus.AI)
  maintainer_basis:
    reason: The code repository, the site repository and the Hugging Face sets sit in LiveBench
      organisations on GitHub and Hugging Face (APIs, read 2026-11-10), not in a company's or a
      person's namespace; the datasheet names the authors as maintainers, and Abacus.AI as the
      funder. The authors come from Abacus.AI, NYU, Nvidia, UMD, USC and Columbia.
    source: src-github-livebench-datasheet
    quote: The authors of this work are supporting/hosting/maintaining the dataset.
  maintainer_type: community-collective
  maintainer_type_note: A multi-institution group with no stated legal form holds the namespaces;
    industry-lab is the near reading, since Abacus.AI funds the benchmark and its name is on both
    sites (review_checks).
  submission_process:
    - maintainer-run
  submission_process_note: The maintainers choose the models (the best or most popular 40-50 in the
    paper's plan), run them and publish the per-task tables. A developer can ask to be evaluated by
    opening an issue, and model configurations arrive as pull requests to the code repository, but
    the run is the maintainers'; no route takes an outside number.
  submission_process_source: src-arxiv-2406-19314-v2
  submission_process_quote: We maintain the best (or most popular) 40-50 models on the leaderboard
    so as to avoid an ever-growing list of models to evaluate each month.
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-livebench-ai-main-js
      quote: '"smaug-agentic":{organization:"Abacus.AI",displayName:"Smaug Agentic"'
  independence_flags_note: Abacus.AI funded the benchmark (the datasheet; the site footer reads
    "LiveBench v1 · sponsored by Abacus.AI"), and the site's own model metadata attributes Smaug
    Agentic, Smaug Flash and Smaug Mini to Abacus.AI, all three ranked on release 2026-06-25 (14th,
    25th and 28th of 71 by the recomputed overall). The paper's tables also ranked Dracarys models
    linked to the abacusai Hugging Face namespace. Whether this is also
    maintainer-competes-on-own-benchmark depends on reading the sponsor as a maintainer
    (review_checks). LiveBench 2.0's page says its results power an Abacus.AI subscription product,
    which belongs to that benchmark.
  independence_assessed: true
  funding:
    source: src-github-livebench-datasheet
    quote: This benchmark was funded by Abacus.AI.
  known_limitation:
    source: src-arxiv-2406-19314-v2
    quote: Therefore, a limited fraction of LiveBench is likely contaminated on all recent LLMs.
  known_limitation_note: The authors' own caveat in the paper's version, for coding questions from
    November 2023 and AMC questions modified only lightly; the April 2025 release replaced both.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The maintained route is inference through an OpenAI-compatible API, with scoring on
      ordinary CPU; local inference is unmaintained. Agentic Coding also needs Docker images that
      may take 150 GB of storage.
    source: src-github-livebench-readme
    quote: Local model inference is unmaintained.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: A release's headline includes the questions the maintainers still hold back, so only
      they can produce it, the tier's own test. The pipeline itself is one script with no human
      step, and an outside party can run it end to end on any release whose questions are public,
      such as 2024-11-25.
    source: src-github-livebench-readme
    quote: python run_livebench.py --model gpt-4o --bench-name live_bench/coding
      --livebench-release-option 2024-11-25
  reproducibility_blockers:
    - private-test-set
  reproducibility_blockers_note: The newest questions of each release are held back, so the current
    release's headline cannot be reproduced; the README points outside users to the 2024-11-25
    release.
  reproducibility_blockers_source: src-github-livebench-readme
  reproducibility_blockers_quote: The current LiveBench release is 2025-04-25; however, not all
    questions for this release are public on Huggingface.
  harness_availability: official-harness
  harness: LiveBench/LiveBench (run_livebench.py; gen_api_answer.py, gen_ground_truth_judgment.py,
    show_livebench_result.py), with --livebench-release-option naming the release
  harness_note: The site computes category and overall averages in the browser from the per-task
    table. Its averaging code returns fixed overall values for two rows, grok-3-thinking (72) and
    grok-3 (58), instead of their mean (review_checks).
  harness_source: src-github-livebench-readme
  harness_quote: python run_livebench.py --model gpt-4o --bench-name live_bench/coding
    --livebench-release-option 2024-11-25
  code_licence: Apache-2.0
  code_licence_note: The paper and the datasheet state Apache License 2.0. The LICENSE file copies
    FastChat's Apache-2.0 and LiveCodeBench's MIT licences for the code taken from them and adds no
    licence of its own, and GitHub's licence detection reports NOASSERTION (API, read 2026-11-10).
  code_licence_source: src-arxiv-2406-19314-v2
  code_licence_quote: The license of our repository is the Apache License 2.0.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the resolved profile: the release fixes the questions, and LiveBench's own prompt and answer parsing
  # (FastChat templates, the requested answer tags, its scoring functions, updated as models hit edge cases) fix
  # what a score means. Rows name an effort setting, and Agentic Coding runs inside mini-SWE-agent with a
  # 250-step limit since October 2025 (50 steps in SWE-agent before).
  material_extra:
    - harness
    - reasoning_effort
aggregation_policy: official-aggregate
aggregation_policy_note: The page's overall is the unweighted mean of the category averages, each
  the unweighted mean of its task columns, so a category with fewer tasks weighs more per task.
aggregation_policy_basis:
  reason: The paper defines the LiveBench score as the mean of the category scores, and the site
    computes it the same way.
  source: src-github-livebench-site-averaging
  quote: 'var avg = averages.length ? averages.reduce((a, b) => a + b) / averages.length : 0;'
headline_metric: livebench-score
secondary_axes:
  - cost
secondary_axes_basis:
  reason: The current site shows a cost per successful task beside the scores for the last v1
    release.
  source: src-livebench-ai-main-js
  quote: Cost data is published for v1's latest release only.


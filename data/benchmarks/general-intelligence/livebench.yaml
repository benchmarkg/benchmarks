subsets:
  - id: livebench#reasoning
    label: Reasoning
    scored_separately: true
    domain_override:
      primary: reasoning-general/logical-deduction
      secondary:
        - reasoning-general/spatial-reasoning
    capability_override:
      - deductive-reasoning
      - spatial-reasoning
    evidence:
      - source: src-livebench-ai-v1-categories-2026-06-25
        quote: '"Reasoning": [ "theory_of_mind", "zebra_puzzle", "spatial", "logic_with_navigation" ]'
      - source: src-livebench-ai-v1-categories-2024-06-24
        quote: '"Reasoning": [ "web_of_lies_v2", "zebra_puzzle" ]'
    notes: At release 2026-06-25, theory_of_mind, zebra_puzzle, spatial and logic_with_navigation.
      Web of Lies (v2, then v3) held the first slot until theory_of_mind replaced it on 2025-11-25.
  - id: livebench#coding
    label: Coding
    scored_separately: true
    domain_override:
      primary: code/function-synthesis
    capability_override: []
    evidence:
      - source: src-livebench-ai-v1-categories-2026-06-25
        quote: '"Coding": [ "code_generation", "code_completion" ]'
      - source: src-arxiv-2406-19314-v2
        quote: We report pass@1, a metric which describes the proportion of questions that a given
          model solved completely
    notes: Code generation from a problem statement and completion of a truncated solution, each
      scored pass@1 on the problem's tests. From LiveCodeBench problems until 2025-04-25, then new
      questions on real-world libraries. No capability term names program synthesis.
  - id: livebench#agentic-coding
    label: Agentic Coding
    scored_separately: true
    domain_override:
      primary: code/repository-scale-se
    capability_override:
      - tool-use
    evidence:
      - source: src-livebench-ai-v1-categories-2026-06-25
        quote: '"Agentic Coding": [ "javascript", "typescript", "python" ]'
      - source: src-github-livebench-changelog
        quote: This update introduces a new agentic coding category, where models must operate in a
          multi-turn, realistic development environment to resolve issues from real Github
          repositories.
      - source: src-github-livebench-changelog
        quote: evaluation uses the [Multi-SWE-Bench](https://multi-swe-bench.github.io/#/) harness
    notes: Added 2025-05-30, with one task per language. The model resolves a repository issue
      inside a fixed agent (SWE-agent with 50 steps, then mini-SWE-agent with 250 from 2025-10-03)
      and is scored by the Multi-SWE-Bench harness's tests. Refreshed as a v2 suite in the
      2026-06-25 release.
  - id: livebench#mathematics
    label: Mathematics
    scored_separately: true
    domain_override:
      primary: mathematics/competition-math
      secondary:
        - mathematics/symbolic-manipulation
    capability_override:
      - quantitative-reasoning
    evidence:
      - source: src-livebench-ai-v1-categories-2026-06-25
        quote: '"Mathematics": [ "AMPS_Hard", "integrals_with_game", "math_comp", "olympiad" ]'
      - source: src-arxiv-2406-19314-v2
        quote: In Competitions, we include questions from AMC12 2023, SMC 2023, and AIME 2024
          modifying the prose and the answer order
      - source: src-arxiv-2406-19314-v2
        quote: where we check for semantic as well as numerical equivalence of mathematical
          expressions
    notes: math_comp (reworded AMC, AIME and SMC problems), olympiad (ordering masked equations of
      IMO and USAMO solutions, scored by edit distance), AMPS_Hard (generated problems checked with
      SymPy) and integrals_with_game (from 2026-01-08). The leading rows of 2026-06-25 average about
      97 here.
  - id: livebench#data-analysis
    label: Data Analysis
    scored_separately: true
    domain_override:
      primary: code/data-science-workflows
    capability_override:
      - context-integration
    evidence:
      - source: src-livebench-ai-v1-categories-2026-06-25
        quote: '"Data Analysis": [ "consecutive_events", "tablejoin", "tablereformat" ]'
      - source: src-arxiv-2406-19314-v2
        quote: Each question makes use of a recent dataset from Kaggle or Socrata.
    notes: Table reformatting between formats, predicting a join mapping between two tables and,
      from 2026-01-08, detecting consecutive events; column type annotation (cta) was retired on
      2025-04-25.
  - id: livebench#language
    label: Language
    scored_separately: true
    domain_override:
      primary: language/generation
    capability_override:
      - context-integration
    evidence:
      - source: src-livebench-ai-v1-categories-2026-06-25
        quote: '"Language": [ "connections", "plot_unscrambling", "typos" ]'
      - source: src-arxiv-2406-19314-v2
        quote: The score for this task is the fraction of groups that the model outputs correctly.
      - source: src-arxiv-2406-19314-v2
        quote: We create the questions for this task from recent ArXiv abstracts, which we ensure
          originally have no typos, by programmatically injecting common human typos into the text.
    notes: Connections word puzzles (fraction of groups correct), typo fixing in recent arXiv
      abstracts (the exact text must come back) and reordering a film's shuffled synopsis (one minus
      a normalised Levenshtein distance).
  - id: livebench#instruction-following
    label: Instruction Following (IF)
    scored_separately: true
    domain_override:
      primary: language/generation
    capability_override:
      - instruction-following
    evidence:
      - source: src-livebench-ai-v1-categories-2026-06-25
        quote: '"IF": [ "paraphrase", "simplify", "story_generation", "summarize" ]'
      - source: src-arxiv-2406-19314-v2
        quote: We score tasks purely by their adherence to the instructions.
    notes: Paraphrase, simplify, summarise or write a story about a recent Guardian article under
      randomly drawn verifiable instructions (16 of IFEval's 25 types in the paper; new, harder
      types from 2025-11-25); the score combines prompt-level and instruction-level accuracy.

metrics:
  - livebench-score

lineage:
  role: root
lineage_note: >
  LiveBench 2.0 (livebench.ai from October 2026; releases 2026-10-14, 2026-10-25 and 2026-11-06) shares
  the name, the site and the sponsor but not the task definition: seven suites, five of them agentic
  (design, research, browser use, coding, long-running work), one graded against a rubric, with
  weighted suites. By 04 S4 it is a separate benchmark, so it is not a version here; it has no id
  yet, so no superseded_by edge is recorded (review_checks). Its Data Analysis and Reasoning suites
  carry v1 tasks over. LiveSWEBench, a separate repository and Hugging Face set in the same
  organisations (March 2025), was not read and is not linked.


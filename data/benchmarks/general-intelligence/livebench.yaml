curation:
  added_by: agent (P1-S11-T06)
  added_on: 2026-11-10
  last_verified: 2026-11-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2406-19314-v2
    - src-arxiv-2406-19314
    - src-github-livebench-readme
    - src-github-livebench-changelog
    - src-github-livebench-license
    - src-github-livebench-datasheet
    - src-github-livebench-site-app
    - src-github-livebench-site-averaging
    - src-livebench-ai-main-js
    - src-livebench-ai-v1-table-2026-06-25
    - src-livebench-ai-v1-categories-2026-06-25
    - src-livebench-ai-v1-categories-2024-06-24
    - src-hf-api-livebench-math
    - src-livebench-ai
    - src-arxiv-2505-09388-v1
    - src-epoch-benchmark-data
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its abstract page for the versions and
    venue; the code repository's README, changelog, LICENSE and datasheet at commit 1d1006a0; the old
    site repository's App.js and Averaging.js at commit 19e766a5; the current site's script bundle and
    the v1 table and category files it loads, read unauthenticated; Hugging Face's API record of
    livebench/math; the Qwen3 Technical Report's v1 PDF (a DOI) as evidence of outside use, an existing
    Source; and Epoch's export for the LiveBench string. src-livebench-ai (Epoch's link to the front page,
    scaffolded with no extract and archived on 2026-09-23, before LiveBench 2.0) is listed but not
    quoted. The datasheet is withheld from archiving because it names an individual. Not read:
    LiveBench 2.0's per-suite data files beyond the bundle, the Hugging Face question rows, the
    LiveSWEBench repositories, and the docs pages other than the datasheet.
  confidence: medium
  review_checks:
    - check: LiveBench 2.0 is treated as a separate benchmark with no id. It shares the name, site,
        sponsor and dated-release scheme, so it could instead be a breaking edition of this entry;
        04 S4's edition test (same task definition, new items) is what it fails. If it gets its own
        entry, add lineage superseded_by here and supersedes there, and reconsider lifecycle.
      field: lineage
      source: src-livebench-ai-main-js
      quote: We give models real work (decks, research reports, bug fixes, apps that run for hours)
        and grade what they hand back.
    - check: lifecycle is active because the 2026-06-25 table gained rows after July 2026. The site
        now leads with LiveBench 2.0 and labels these releases v1, which is the superseded reading;
        which one holds depends on the 2.0 call above.
      field: lifecycle
      source: src-livebench-ai-main-js
      quote: The latest release is LiveBench 2.0 (
    - check: The delayed release looks longer than stated. The paper says new questions are released
        one month later, but every Hugging Face category set was last modified on 2025-04-07 and the
        README still names 2024-11-25 as the newest fully public release, so the questions of the
        seven releases since April 2025 may all be private. data.access private-test-server rests on
        that; a reviewer may want the Hugging Face rows checked for later livebench_release_date
        values.
      field: data.access
      source: src-arxiv-2406-19314-v2
      quote: Each month, we do not release the new questions until one month later, so that the
        public leaderboard always has 1/6 questions that are private.
    - check: The site's averaging code hard-codes the overall score of two rows (grok-3-thinking 72,
        grok-3 58) instead of averaging their categories; any ingest of overall scores should
        recompute from the per-task table and treat those two rows with care.
      field: aggregation_policy
      source: src-github-livebench-site-averaging
      quote: if (row['model'] === 'grok-3-thinking') { return 72; } else if (row['model'] ==
        'grok-3') { return 58; }
    - check: funded-by-evaluated-party rests on the site's model metadata attributing the Smaug rows
        to Abacus.AI and the datasheet naming Abacus.AI as funder.
        maintainer-competes-on-own-benchmark was left unset because the holder is the LiveBench
        organisation, not Abacus.AI; maintainer_type community-collective against industry-lab turns
        on the same reading.
      field: governance.independence_flags
      source: src-github-livebench-datasheet
      quote: This benchmark was funded by Abacus.AI.
    - check: activity accepting-submissions rests on the README's invitation to request an
        evaluation. The current site's v1 pages do not repeat it, and a request is not a submitted
        number, so no-submission-channel is the near reading if the request route is not counted.
      field: activity
      source: src-github-livebench-site-app
      quote: We will evaluate your model on LiveBench! Open a github issue
    - check: refresh is versioned-releases, but scores change inside a release. The October 2025
        agentic re-run rewrote the 2025-05-30 leaderboard (recorded as an erratum), the paper says
        scoring functions are updated and all models re-scored, and a site commit of 2026-06-19
        corrected integrals_with_game scores in place (GitHub API, read, not cited). rolling-live
        may fit better.
      field: data.refresh
      source: src-arxiv-2406-19314-v2
      quote: After potentially updating scoring functions for some tasks, we re-score all models
        with the new scoring functions.
    - check: Releases are editions (new items, same task definition), but some changed the task set
        (tasks added and retired, a seventh category in May 2025); whether those are editions or
        track-set versions is a judgement. items is 1,000 only where the changelog says so; no
        source gives the counts from 2025-04-02 on.
      field: versions
      source: src-github-livebench-changelog
      quote: This brought the total number of questions to 1000, and all future updates add and
        remove the same number, to stay at 1000 total questions.
    - check: Subset domains for Data Analysis (code/data-science-workflows) and Language
        (language/generation) are loose fits; table reformatting and joining are data wrangling, and
        Connections is a word puzzle. Tasks are named in the subset notes rather than modelled as 23
        child subsets; the Coding subset carries no capability because no term names program
        synthesis.
      field: subsets
    - check: Epoch's export lists LiveBench outside its capabilities index with no data file, but
        src-livebench-ai's notes say 64 rows of live_bench_external.csv cite livebench.ai; the two
        views of Epoch's export disagree. Epoch's date is the paper's v1 (2024-06-27); released here
        is the datasheet's 2024-06-12.
      field: external_ids.epoch
      source: src-epoch-benchmark-data
      quote: LiveBench,False,,,1.0,0.0,1.0,2024-06-27,
    - check: Saturation was not assessed. On 2026-06-25 the leading rows average about 97 in
        Mathematics and up to 100 on several tasks (recomputed from the table), while Agentic Coding
        stays near 55-72; headroom differs sharply by category.
      field: lifecycle
      source: src-livebench-ai-v1-table-2026-06-25
      quote: smaug-agentic,98.0,80.435,84.507,100.0
  notes: null

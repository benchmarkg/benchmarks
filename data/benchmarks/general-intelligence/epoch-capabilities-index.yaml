# data/benchmarks/general-intelligence/epoch-capabilities-index.yaml
#
# P1-S11-T05, general-intelligence entry 6 of 6. Filled from Epoch AI's ECI page (epoch.ai/eci) and two pages of
# its documentation (Methodology; Included benchmarks), all with scripts and styles stripped; the ECI model-scores
# download (eci_scores.csv, fetched 2026-10-14); Epoch's transparency page; the method paper, A Rosetta Stone for
# AI Benchmarks (arXiv 2512.00193), read as its v1 PDF, and its abstract page; the eci-public README at main; the
# existing Source for Epoch's benchmark_data.zip export (src-epoch-benchmark-data, captured 2026-09-17), whose
# in_eci column the fitting code reads; and the v2 PDF of Is Capability a Liability? (arXiv 2605.22672, May
# 2026), a paper that uses ECI as its capability measure. epoch.ai's robots.txt disallows only /assets/ (bar
# images and docs), /inspect-viewer/ and FrontierMath's sample problems, none of them read here. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# What the entry is: a derived index, not a scored evaluation with items of its own. ECI fits one latent
# capability per model to other benchmarks' scores, so it contributes the statistical scale, the score table
# and its governance; the constituents (gpqa-diamond, swe-bench-verified, mmlu and the rest) keep their own
# facets on their own entries (02 S11 rule 5). The Stage-3 record (taxonomy/_corpus/classifications/
# epoch-capabilities-index.yaml, re-run against 0.9.0) is followed facet by facet; where it abstained, so does
# this entry, and the review_checks say why.

id: epoch-capabilities-index
name: Epoch Capabilities Index
aliases:
  - ECI
tagline: Epoch AI's index fitting one capability scale to model scores on 61 benchmarks;
  pool-relative, refitted as data arrive.
description: >
  Epoch AI's composite capability index for language models. It authors no tasks: it fits an
  item-response-style logistic model, performance = sigmoid(slope x (capability - difficulty)),
  jointly to a table of models' scores on 61 existing benchmarks from Epoch's Benchmarking Hub,
  estimating one capability per model and one difficulty and one slope per benchmark by regularised
  non-linear least squares. Each benchmark's scores are rescaled so that chance is zero and, where
  the benchmark's error rate is known, the attainable maximum is one; a model takes its best score
  across evaluation settings, needs at least four benchmarks, and must be released in 2023 or
  later. The scale is anchored at Claude 3.5 Sonnet = 130 and GPT-5 = 150 and has no maximum, and
  values shift as models and benchmarks are added. Scores come by three routes: Epoch's own runs (14
  benchmarks, among them GPQA Diamond, FrontierMath and SWE-bench Verified), the benchmark creators'
  results (33, among them ARC-AGI-2, OSWorld and Terminal-Bench 2.0) and model developers' reports
  (14 older benchmarks such as MMLU and HellaSwag). Epoch publishes 90% bootstrap intervals, the
  score table under CC BY, MIT-licensed fitting code, and views restricted to software-engineering or
  mathematics benchmarks; a separate Cyber ECI adds cyber benchmarks outside the general fit. The
  method is from A Rosetta Stone for AI Benchmarks (2025), a paper funded by Google DeepMind. On
  2026-10-14 the fit covered 274 models.
self_description:
  source: src-epoch-eci-site
  quote: The general ECI is a composite metric which uses scores from over 50 distinct benchmarks to
    generate a single, general capability scale.
external_ids:
  arxiv: '2512.00193'
paper:
  title: A Rosetta Stone for AI Benchmarks
  arxiv: '2512.00193'
  version_read: v1
  source: src-arxiv-2512-00193-v1
released: null
released_note: Epoch's own citation for the index dates it to October 2025 (BibTeX year 2025, month
  10) and no source read gives a day. The method paper followed on 2025-11-28 (review_checks).
released_source: src-epoch-eci-site
released_quote: year = {2025}, month = {10}

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: general-intelligence/agi-composite-suites
  secondary: []
domain_basis:
  reason: The index's claim is one broad capability measured across benchmarks from many families
    (agents, coding, mathematics, science, knowledge, games, multimodal, writing), aggregated into a
    single number, which is the leaf's definition and the Stage-3 record's call. No secondary is
    recorded; the constituents' subdomains belong to their own entries.
  source: src-epoch-eci-site
  quote: Similar to an IQ test, ECI is designed to capture a broad, underlying capability useful
    across many tasks, rather than performance on specific skills.
domain_considered_and_rejected:
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: Knowledge exams such as MMLU and GPQA Diamond are among the inputs, but the headline
      aggregates heterogeneous task formats (agent runs, code, games, writing), which that leaf's
      exclusion sends to agi-composite-suites.
  - term: agents-tooluse/agent-evaluation-suites
    reason: Many inputs are agent benchmarks, but the index spans several families, which that
      leaf's exclusion sends to general-intelligence.
capability: []
capability_note: Left empty, as Stage 3 left it (taxonomy/_failures
  2026-09-28-epoch-capabilities-index-001). The index's own claim is one broad underlying
  capability, and ADR-0020 rejects a general-capability-factor term (03 S5 bans general terms); the
  composite shape is carried by the domain. The competences the 61 inputs score are claimed in their
  own sources and recorded on their own entries.

evaluation_method:
  - entrant-relative-ranking
evaluation_method_basis:
  reason: An ECI value is a capability parameter fitted jointly with every benchmark's difficulty
    and slope to the whole model-by-benchmark table, then rescaled so that two models sit at 130 and
    150. Adding a model or a benchmark moves other models' values with no change to their own
    scores, the term's scale fitted jointly across entrants. The pool at this reading is the fit of
    2026-10-14, 274 models on 61 benchmarks.
  source: src-epoch-eci-site
  quote: As new models and new benchmark evaluations are obtained, values may shift slightly even
    for models whose data have not changed.
  caveat: The term's test also asks for the methods behind the underlying scores to be tagged. They
    are the 61 inputs' own (multiple choice, test execution, judged writing, agent environments and
    more), which ECI's sources name but do not describe, so none is tagged here (review_checks).
evaluation_method_considered_and_rejected:
  - term: composite
    reason: Epoch calls ECI a composite metric, but the headline is a latent parameter fitted by
      non-linear least squares, not a weighted or averaged combination of sub-scores, and the
      Stage-3 re-run dropped the term for that reason (review_checks).
    source: src-epoch-eci-methodology
    quote: We fit the model via non-linear least-squares estimation, using a ridge regularization
      penalty to discourage overfitting.
  - term: statistical-fit
    reason: The index is produced by fitting a statistical model, but the term is a goodness-of-fit
      statistic (RMSE, correlation) against ground-truth measurements; an ECI value is a fitted
      parameter, not an error.
  - term: pairwise-preference-elo
    reason: Epoch likens the open-ended scale to Elo, but no votes or pairwise comparisons enter;
      the inputs are benchmark scores between 0 and 1.
    source: src-epoch-eci-site
    quote: Note that as with Elo scores, there is no maximum achievable ECI.

designed_for_subjects: []
designed_for_subjects_note: Left empty, as Stage 3 left it (2026-09-28-epoch-capabilities-index-003;
  ADR-0020 rejects a named-model-any-elicitation term because a meta-index pooling other benchmarks'
  results inherits their subjects, and the divergence belongs on claims). ECI scores a named model
  release at its best score across settings, so one value can mix a developer's chat-prompt number
  on an older benchmark with an agent run on OSWorld.
designed_for_subjects_considered_and_rejected:
  - term: hosted-inference-endpoint
    reason: ECI deliberately collapses the serving path into the model's name, taking the best score
      across inference providers, which is the opposite of that term's point.
    source: src-epoch-eci-included-benchmarks
    quote: we aggregate across model evaluation settings (e.g. thinking effort and inference
      provider), taking the highest score for each benchmark
  - term: reasoning-model
    reason: Thinking effort is aggregated away (the best setting is kept), so it is not a condition
      of an ECI value as the term's test needs.
as_used:
  - protocol: ECI values copied from Epoch's published table on one date and used as each model's
      capability covariate in an outside study (rank correlations against forecast scores), not
      refitted. Values read on another date can differ, because the scale is refitted as models and
      benchmarks are added.
    source: src-arxiv-2605-22672-v2
    quote: 'Table 1: Models evaluated, ordered by ECI score (Epoch AI, accessed 2026-04-30).'
    note: Is Capability a Liability? (Merrill, Lee and Karger, May 2026), 29 models spanning ECI 114
      to 155.

lifecycle: active
lifecycle_basis:
  reason: Epoch refitted the index and updated its downloads on the day this entry was read, and
    outside papers use it as their capability measure (as_used).
  source: src-epoch-eci-site
  quote: ECI model scores CSV , Updated Oct. 14, 2026
activity: no-submission-channel
activity_basis:
  reason: Epoch chooses the models and benchmarks, obtains the scores and refits the index; no route
    lets a developer or anyone else enter a model or a result, and a model without an ECI is one
    Epoch has not yet collected four benchmark scores for.
  source: src-epoch-eci-site
  quote: we require a minimum of 4 benchmark evaluations for any model to ensure ECI scores are both
    stable and fair

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude Opus 5.5 (top of the 2026-10-14 fit)
    source: src-epoch-eci-scores
    observed_on: 2026-10-14
    quote: Claude Opus 5.5,Claude Opus 5.5,167.33,164.06,171.68,2026-09-22,Anthropic
evaluation_target: learned-system
execution_mode: automated
execution_mode_note: The fit itself is automatic. Its inputs are produced by each constituent's own
  protocol, some of them graded by people or by models.
ground_truth_source: null
ground_truth_source_note: The fitted scale has no ground truth of its own; each input score carries
  its constituent's (reference answers, tests, environment states, graders), so no one value holds.
reproducible_by_third_party: null
reproducible_by_third_party_note: Anyone can refit the published table with the released code, but
  reproducing a value from scratch needs the constituents' scores, among them FrontierMath's private
  tiers, which Epoch runs, and developers' model-card numbers (review_checks).

task:
  exists: false
  input:
    - a model's scores on at least four constituent benchmarks, taken from Epoch's runs, the
      benchmark creators' results or the developer's own reports
  output: One ECI value per model, with a 90% bootstrap confidence interval.
  scoring: Capability, difficulty and slope are fitted jointly to every model's scores by ridge-
    regularised non-linear least squares, rescaled so that Claude 3.5 Sonnet = 130 and GPT-5 = 150;
    intervals come from 500 bootstrap refits that resample each model's results.
  item_definition: >
    One model's scores on those of the 61 constituent benchmarks it has results for (at least four),
    each its best score across evaluation settings, rescaled so that chance is zero and, where a
    benchmark's error rate is known, the attainable maximum is one.
  task_distribution_drifts: true
  task_distribution_drifts_note: Benchmarks enter and leave the fit (FrontierSWE was flagged out of
    ECI in Epoch's 2026-09-17 export and is in the 2026-10-14 fit), so the item set moves.
  source: src-epoch-eci-included-benchmarks
  quote: We drop any models with fewer than 4 benchmark scores from our model fit

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: What the index is computed from is the score table, which is open. The constituents'
    own items range from public sets (MMLU, GPQA Diamond) to FrontierMath's private tiers, which
    Epoch holds (review_checks).
  access_basis:
    reason: The fitting code reads Epoch's public export, benchmark_data.zip, whose metadata flags
      which benchmarks enter ECI; Epoch also publishes the model-by-benchmark table the fit uses as
      a CSV, free under CC BY.
    source: src-epoch-benchmark-data
    quote: benchmark,in_eci,source_file,score_column
  records_access: fully-open
  records_access_source: src-epoch-eci-scores
  records_access_quote: Model,Display name,eci,eci_ci_low,eci_ci_high,date,Organization
  records_licence: CC-BY-4.0
  records_snapshot: 2026-10-14
  refresh: continuously-reexecuted
  refresh_basis:
    reason: The index is refitted on Epoch's continuously updated data, so a value without its fit
      date is unanchored.
    source: src-arxiv-2512-00193-v1
    quote: The approach developed in this work is also applied in the Epoch Capabilities Index with
      continuously updated data, using a rescaled normalization scheme for interpretability.
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: ECI authors no items; its data is scores on 61 existing benchmarks. Epoch
    runs 14 itself, takes 33 from the benchmark creators and 14 from model developers' reports, and
    each constituent's own sources document its provenance. Membership changes between fits; the
    2026-09-17 export flags 59 of its 81 benchmarks into ECI, and the 2026-10-14 fit has 61.
  data_provenance_source: src-epoch-eci-included-benchmarks
  data_provenance_quote: We fit the model to benchmark scores covering 61 benchmarks
  contamination_risk: medium
  contamination_risk_note: The risk is inherited. Many inputs are public static sets of some age
    (MMLU, GSM8K, HellaSwag, TriviaQA), and ECI assesses leakage into none of them. Epoch names
    benchmark-targeted optimisation by developers as a limitation, not contamination as such.
  contamination_risk_source: src-epoch-eci-site
  contamination_risk_quote: One shortcoming is that model developers can optimize for high
    performance on certain benchmarks
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_basis:
    reason: The scale is anchored to two models, not to any task or human level, and is unbounded
      above, so no ceiling anchor can exist (0.9.0's reading of none-known).
    source: src-epoch-eci-site
    quote: Note that as with Elo scores, there is no maximum achievable ECI.
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The licence of Epoch's score table; the page links creativecommons.org's CC
    BY 4.0 deed.
  dataset_licence_source: src-epoch-eci-site
  dataset_licence_quote: provided the source and authors are credited under the Creative Commons
    Attribution license
  upstream_licences: Each constituent benchmark's items are under its own terms; ECI publishes
    scores only.
  size:
    - count: 61
      unit: benchmarks in the general fit (14 run by Epoch, 33 from the benchmark creators, 14 from
        model developers' reports)
      subset: the fit of 2026-10-14
      source: src-epoch-eci-included-benchmarks
      quote: We fit the model to benchmark scores covering 61 benchmarks
    - count: 274
      unit: models with an ECI score
      subset: the fit of 2026-10-14
      source: src-epoch-eci-included-benchmarks
      quote: currently report ECI scores for 274 models
    - count: 38
      unit: benchmarks (179 models, 1,324 scores)
      subset: the method paper's fit (2025)
      source: src-arxiv-2512-00193-v1
      quote: In total, we fit the statistical model on 179 models and 38 benchmarks, with a total of
        1324 performance scores.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Epoch AI
  maintainer_basis:
    reason: Epoch hosts the index, its data and documentation on epoch.ai and the fitting code in
      its epoch-research GitHub organisation, and describes itself as a 501(c)(3) nonprofit.
    source: src-epoch-transparency
    quote: We are a 501(c)(3) nonprofit committed to proactive transparency.
  maintainer_type: nonprofit
  submission_process:
    - maintainer-run
  submission_process_note: Epoch decides which models and benchmarks enter, runs some evaluations
    itself, copies others from independently run leaderboards, and harvests older benchmarks' scores
    from developers' model cards and technical reports, which it says may be cherry-picked. ADR-0020
    records that harvested route in this note rather than as self-reported, because no developer
    submits anything to ECI.
  submission_process_source: src-epoch-eci-site
  submission_process_quote: We mitigate against this by running models on our own internal
    evaluations, and by collecting evaluations from independently-run leaderboards.
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-epoch-eci-site
      quote: which was funded by Google DeepMind, and written in collaboration with researchers from
        their AGI Safety
    - flag: evaluator-sells-evaluations
      source: src-epoch-transparency
      quote: xAI 2025 Model Evaluations
  independence_flags_note: Google DeepMind funded the paper that defines the method, two of its five
    authors are at Google DeepMind, and Gemini models are scored (Gemini 3.7 Flash at 157.27 in the
    2026-10-14 table); Epoch states the index is an independent product it has full rights over
    (independence_policy). The transparency page lists paid model evaluations for xAI (2025) and
    Google DeepMind (2025), whose models the index scores, OpenAI's funding of FrontierMath's
    development (2024/25), one of the index's inputs, and a 2024 Anthropic pilot. It also says Epoch
    invests part of its funds in semiconductor and AI stocks.
  independence_assessed: true
  funding:
    source: src-epoch-transparency
    quote: As an independent nonprofit, we rely primarily on the ongoing support of donors to
      continue our research.
  independence_policy:
    source: src-epoch-eci-site
    quote: However, the ECI is an independent Epoch AI product that Epoch has full rights over.
  known_limitation:
    source: src-arxiv-2512-00193-v1
    quote: This model rests on the assumption that AI model capabilities can be cleanly captured by
      a single number, which is of course not the case, but we opt for it nevertheless.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: Refitting the published table is a small least-squares fit that takes seconds
    (the method paper), which is not what the tier describes.
  compute_tier_basis:
    reason: For an index, one score for a new model means obtaining its results on at least four
      constituents (0.9.0's index clause), which for most of them is inference spend through a
      provider's API.
    source: src-epoch-eci-included-benchmarks
    quote: we aggregate across model evaluation settings (e.g. thinking effort and inference
      provider), taking the highest score for each benchmark
  reproducibility_tier: null
  reproducibility_tier_note: Left null, as the Stage-3 re-run left it
    (2026-09-28-epoch-capabilities-index-010, routed to Stage 4). Refitting from released scores is
    ruled out by fully-automatable's exclusion, and reproducing a value from scratch means obtaining
    the constituents' results, among them FrontierMath's private tiers, which only Epoch runs;
    whether an index takes its most restrictive constituent's tier is undecided.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: eci-public (github.com/epoch-research/eci-public), scripts/fit_eci.py, which downloads
    benchmark_data.zip and refits the index with bootstrap intervals
  harness_source: src-github-eci-public-readme
  harness_quote: This package fits the ECI model,
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for epoch-research/eci-public also reports MIT (read
    2026-10-14; last pushed 2026-09-07).
  code_licence_source: src-github-eci-public-readme
  code_licence_quote: '## License MIT'
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # No designed-for subject is recorded, so the profile resolves to the fallback (subset_used: the general
  # ECI, a domain view or a custom benchmark set). Added: the fit's date, because the scale is pool-relative and
  # refitted as models and benchmarks arrive, and the selection strategy, because each input is a model's best
  # score across settings ("Best score (across scorers)" in Epoch's export). A value is a claim about a pool at
  # a time, so a rating pool is required.
  material_extra:
    - date_evaluated
    - selection_strategy
  rating_pool_required: true
aggregation_policy: official-aggregate
aggregation_policy_note: The index is itself Epoch's official aggregate. The software-engineering
  and mathematics views refit capability on one domain's benchmarks with the general fit's
  difficulties and slopes held (lineage), and the explorer also offers a Custom benchmark selection.

homepage: https://epoch.ai/eci
repository: https://github.com/epoch-research/eci-public
dataset_url: https://epoch.ai/data/eci_benchmarks.csv
leaderboard_url: https://epoch.ai/eci
maintainer_url: https://epoch.ai/about/transparency

lineage:
  views:
    # Not benchmarks: the general fit's difficulties and slopes, with capability refitted on one domain's
    # benchmarks. The Cyber ECI is not among them: it adds benchmarks outside the general fit (review_checks).
    - name: Software engineering ECI
      of: epoch-capabilities-index
      source: src-epoch-eci-site
      quote: No, the benchmarks used to calculate the math and SWE domain-specific ECIs are a subset
        of the benchmarks used to construct the general ECI.
    - name: Math ECI
      of: epoch-capabilities-index
      source: src-epoch-eci-site
      quote: we keep the benchmark difficulty and slopes from the general ECI fit, and only refit
        the LLM capability parameters

tags:
  - index
  - composite
  - item-response-theory
  - capability-trends
  - epoch-ai

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S11-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-epoch-eci-site
    - src-epoch-eci-methodology
    - src-epoch-eci-included-benchmarks
    - src-epoch-eci-scores
    - src-epoch-transparency
    - src-arxiv-2512-00193-v1
    - src-arxiv-2512-00193
    - src-github-eci-public-readme
    - src-epoch-benchmark-data
    - src-arxiv-2605-22672-v2
  sources_note: >
    The ECI page, its Methodology and Included benchmarks documentation pages and Epoch's transparency
    page, each with scripts and styles stripped; the ECI model-scores CSV as downloaded on 2026-10-14;
    the method paper's v1 PDF (a DOI, not archived) read as text, and its abstract page; the eci-public
    README at main; the existing Source for Epoch's benchmark_data.zip (P3-S2-T07's, captured
    2026-09-17); and the v2 PDF of Is Capability a Liability? (a DOI) as evidence of current use.
    GitHub's API (licence, pushed_at) was read as metadata. The documentation's overview, FAQ and
    acknowledgements pages repeat the ECI page and were not cited; the benchmark-results and
    difficulty CSVs were read but not cited.
  confidence: medium
  review_checks:
    - check: Identity. ECI is a derived index with no items of its own, fitted to other benchmarks'
        scores; the corpus admits it and agi-composite-suites' definition fits it word for word, but
        whether the catalogue carries a derived index as a Benchmark entry, rather than as a Metric
        or RatingPool over its constituents, is the reviewer's call.
      field: domain
      source: src-epoch-eci-site
      quote: The general ECI is a composite metric which uses scores from over 50 distinct
        benchmarks to generate a single, general capability scale.
    - check: composite is rejected because the headline is a fitted latent parameter, as the Stage-3
        re-run ruled, although Epoch calls ECI a composite metric and says it weights benchmarks by
        how much signal they carry. If that weighting counts as a weighted combination, composite
        applies beside entrant-relative-ranking, and both terms then ask for the constituents'
        methods to be tagged.
      field: evaluation_method
      source: src-epoch-eci-site
      quote: giving more weight to the benchmarks that carry the most signal
    - check: designed_for_subjects is empty, as at Stage 3. ADR-0020's rejection of a
        named-model-any-elicitation term says the index inherits its constituents' subjects, which
        could instead be read as tagging their union (instruction-tuned, reasoning, agent-scaffold).
      field: designed_for_subjects
      source: src-epoch-eci-included-benchmarks
      quote: we aggregate across model evaluation settings (e.g. thinking effort and inference
        provider), taking the highest score for each benchmark
    - check: reproducibility_tier and reproducible_by_third_party are null. If an index takes its
        most restrictive constituent's tier, FrontierMath's private tiers, which only Epoch runs,
        make it not-independently-reproducible with private-test-set.
      field: execution.reproducibility_tier
      source: src-epoch-benchmark-data
      quote: FrontierMath-Tiers-1-3-v2-Private,True,frontiermath_tiers_1_3_v2.csv
    - check: data.access fully-open reads the index's own data, the score table. Under the
        restrictive-set rule applied to constituents, FrontierMath's withheld problems would make it
        private-test-server.
      field: data.access
    - check: evaluator-sells-evaluations rests on the transparency page's paid model evaluations for
        xAI and Google DeepMind and Epoch's consultancy offer; whether a research nonprofit's
        commissioned evaluations are the commercial service the flag means is a judgement.
      field: governance.independence_flags
      source: src-epoch-transparency
      quote: Google DeepMind 2026 Evaluating the AI co-mathematician on FrontierMath 2025 Model
        Evaluations
    - check: The Cyber ECI adds cyber benchmarks outside the general fit and is updated less often,
        so it is not recorded as a view; it may be an entry of its own or a variant.
      field: lineage
      source: src-epoch-eci-site
      quote: the Cyber ECI incorporates cyber benchmarks that are not part of the general ECI
    - check: released is null. Epoch's citation dates the index to October 2025 without a day, and
        the method paper's first version is dated 2025-11-28; an Epoch announcement, not found in
        the sitemap, would give the launch date.
      field: released
      source: src-arxiv-2512-00193
      quote: Submitted on 28 Nov 2025

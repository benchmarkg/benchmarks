# data/benchmarks/engineering-design/circuitnet.yaml
#
# P1-S3-T02, checkpoint entry 15 of 20 (copilot on: the F6 copilot's extractive drafter gave the title, arXiv id
# and release date). Filled from the CircuitNet note, arXiv 2208.01040 read as its v4 PDF (Science China
# Information Sciences), and its abstract page; the repository README; and the project site. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# The family entry: CircuitNet 1.0 (N28, 2022), 2.0 (N14, 2023) and 3.0 (N45, 2026) share tasks and tooling. The
# 2.0 and 3.0 papers were not read.

id: circuitnet
name: CircuitNet
aliases:
  - CircuitNet-N28
  - CircuitNet-N14
  - CircuitNet-N45
tagline: Chip layouts from real RISC-V designs, for predicting routing congestion, DRC violations
  and IR drop early in the flow.
description: >
  A dataset for machine learning in VLSI physical design. Open RISC-V designs were taken through logic
  synthesis and place-and-route with commercial EDA tools under thousands of settings (CircuitNet 1.0
  has 10,242 layouts at 28 nm). Features are extracted at each design stage, as image-like maps and graph
  netlists. The tasks predict, from early-stage features, what later stages will show: routing congestion,
  design-rule-check violations, IR drop and, from 2.0, net delay and timing. Each task is scored with
  the metric of the method it reproduces: NRMSE and SSIM for congestion, ROC and precision-recall AUC
  for DRC violations and IR-drop hotspots. Later versions add a 14 nm FinFET node (2.0) and a 45 nm node
  (3.0).
self_description:
  source: src-arxiv-2208-01040-v4
  quote: CircuitNet, which provides holistic support for cross-stage prediction tasks in back-end
    design with diverse samples
external_ids:
  arxiv: '2208.01040'
paper:
  title: 'CircuitNet: An Open-Source Dataset for Machine Learning Applications in Electronic Design Automation
    (EDA)'
  arxiv: '2208.01040'
  version_read: v4
  source: src-arxiv-2208-01040-v4
released: 2022-08-01
released_note: The first release, as the README's changelog and the arXiv submission both date it.
released_source: src-github-circuitnet-readme
released_quote: '- 2022/8/1 First release.'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/circuit-eda
domain_basis:
  reason: Every task predicts a property of a chip layout in the physical-design flow, which is
    electronic design automation.
  source: src-arxiv-2208-01040-v4
  quote: 'we further conducted experiments on three prediction tasks: congestion, design rule check (DRC)
    violation, and IR drop'
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: A model predicts a physical layout's later state -- routing congestion, rule violations,
      voltage drop -- from early-stage features, scored against what the EDA tools computed. The
      term's definition names physical, chemical, biological and Earth systems; a chip layout is
      taken as a physical system here, which a reviewer may contest.
    source: src-arxiv-2208-01040-v4
    quote: cross-stage prediction was introduced to replace the original long feedback loops between
      design stages with local loops within the design stages

evaluation_method:
  - statistical-fit
  - classification-metric
evaluation_method_basis:
  reason: Congestion is scored by NRMSE and SSIM over the predicted map; DRC violations and IR-drop
    hotspots by ROC and precision-recall AUC.
  source: src-arxiv-2208-01040-v4
  quote: we considered the area under the curve (AUC) of the receiver operating characteristic (ROC)
    curve and that of the precision-recall (PR) curve as the metrics for imbalanced learning
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are models trained from scratch for EDA prediction tasks, and
    engineering-design is one of the disciplines domain-specialist-model names.
  source: src-arxiv-2208-01040-v4
  quote: These methods utilized image-like features to train a generative model, such as fully
    convolutional networks (FCNs) and U-Net

lifecycle: active
lifecycle_basis:
  reason: The maintainers released CircuitNet 3.0 in May 2026 and keep the code updated.
  source: src-github-circuitnet-readme
  quote: Released CircuitNet 3.0 with N45 PDK!
activity: no-submission-channel
activity_basis:
  reason: The site and the README offer the data, documentation, tutorials and code, and no
    leaderboard or results route; results appear in users' papers.
  source: src-circuitnet-site
  quote: Home DocsDocs Get Started Dataset Features Tutorial Download GitHub

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: FCN-based congestion predictor (reimplemented)
    source: src-arxiv-2208-01040-v4
    observed_on: 2026-10-10
    quote: The corresponding results for an FCN based method [3] were 0.040 and 0.80, respectively
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The congestion, DRC and IR-drop results that the EDA tools computed on
  each finished layout.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The features, labels and code are public; producing new layouts would need commercial EDA
    licences, but scoring on the released data does not.
  source: src-github-circuitnet-readme
  quote: This repository is intended to hosts codes and demos for CircuitNet

task:
  exists: true
  input:
    - image-like feature maps (and netlist graphs) extracted from a layout at an early design stage
  output: A predicted map or set of hotspots for a later stage -- congestion, DRC violations, IR
    drop -- or net delays.
  scoring: Per task, the original method's metrics (NRMSE and SSIM; ROC and PR AUC).
  source: src-arxiv-2208-01040-v4
  quote: we used the normalized root-mean-square-error and structural similarity index measure as
    metrics to evaluate pixel-level accuracy

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every version is a public download (Google Drive, Baidu Netdisk, Hugging Face).
    source: src-github-circuitnet-readme
    quote: CircuitNet-N14 (v2.0) is currently maintained on Hugging Face
  refresh: versioned-releases
  refresh_basis:
    reason: New technology nodes and fixes arrive in dated, numbered releases recorded in the
      changelog.
    source: src-circuitnet-site
    quote: CircuitNet 1.0 Paper Link RTL to Layout in 28 nm Planar CMOS. CircuitNet 2.0 Paper Link
      RTL to Layout in 14 nm FinFET. CircuitNet 3.0
  data_provenance:
    - simulation-generated
  data_provenance_note: Layouts and labels come from running logic synthesis and place-and-route
    tools (Synopsys Design Compiler, Cadence Innovus) on open RISC-V designs, under varied settings.
  data_provenance_source: src-arxiv-2208-01040-v4
  data_provenance_quote: Then, the physical design transformed the netlists into layouts with
    Cadence Innovus
  contamination_risk: unknown
  contamination_risk_note: All features and labels are public. The read sources name no fixed
    train-test split (the code's configuration sets it), so the route into a scored split was not
    assessed.
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: The site's footer and the repository are BSD-3-Clause; the licence of the
    data downloads was not read separately.
  size_note: CircuitNet 1.0 has 10,242 layouts from six RISC-V designs ("we obtained 10,242 layouts
    after excluding the failed runs").

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CircuitNet team (School of Integrated Circuits, Peking University)
  maintainer_basis:
    reason: The authors are at Peking University's School of Integrated Circuits, and the site and
      code are the CircuitNet team's.
    source: src-circuitnet-site
    quote: Copyright © 2022-present CircuitNet Team
  maintainer_type: academic-lab
  maintainer_type_note: The code sits in a project organisation (circuitnet) and the 3.0 data in a
    lab organisation on Hugging Face; both are run from one university lab, so the holder is taken
    to be that lab.
  submission_process:
    - literature-only
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Training and scoring on the released data runs end to end with the repository's scripts.
    source: src-github-circuitnet-readme
    quote: python test.py --task congestion_gpdl --pretrained PRETRAINED_WEIGHTS_PATH
  harness_availability: official-harness
  harness: CircuitNet (test.py per task)
  harness_source: src-github-circuitnet-readme
  harness_quote: python test.py --task congestion_gpdl --pretrained PRETRAINED_WEIGHTS_PATH
  code_licence: BSD-3-Clause
  code_licence_source: src-github-circuitnet-readme
  code_licence_quote: This repository is released under the BSD 3-Clause. license as found in the
    LICENSE file
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the version and node (N28, N14, N45), the task and the split the code
  # configuration chose.
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://circuitnet.github.io/
repository: https://github.com/circuitnet/CircuitNet
dataset_url: https://huggingface.co/datasets/SKLP-EDA-LAB/CircuitNet3.0

tags:
  - eda
  - vlsi
  - physical-design
  - routability


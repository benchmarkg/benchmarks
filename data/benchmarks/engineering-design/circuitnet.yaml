# data/benchmarks/engineering-design/circuitnet.yaml
#
# P1-S3-T02, checkpoint entry 15 of 20 (copilot on: the F6 copilot's extractive drafter gave the title, arXiv id
# and release date). Filled from the CircuitNet note, arXiv 2208.01040 read as its v4 PDF (Science China
# Information Sciences), and its abstract page; the repository README; and the project site. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# The family entry: CircuitNet 1.0 (N28, 2022), 2.0 (N14, 2023) and 3.0 (N45, 2026). The P1-S12 publication
# follow-ups (2026-11-18) read the 2.0 (ICLR 2024) and 3.0 (ICLR 2026) papers as their ICLR proceedings PDFs; the
# OpenReview copies the site links refuse this project's fetcher. 3.0 comes from another lead group and has
# tasks of its own, so whether it belongs here is a review check.

id: circuitnet
name: CircuitNet
aliases:
  - CircuitNet-N28
  - CircuitNet-N14
  - CircuitNet-N45
tagline: Chip layouts from real RISC-V designs, for predicting routing congestion, DRC violations
  and IR drop early in the flow.
description: >
  A dataset for machine learning in VLSI physical design. Open RISC-V designs were taken through logic
  synthesis and place-and-route with commercial EDA tools under thousands of settings (CircuitNet 1.0
  has 10,242 layouts at 28 nm). Features are extracted at each design stage, as image-like maps and graph
  netlists. The tasks predict, from early-stage features, what later stages will show: routing congestion,
  design-rule-check violations, IR drop and, from 2.0, net delay and timing. Each task is scored with
  the metric of the method it reproduces: NRMSE and SSIM for congestion, ROC and precision-recall AUC
  for DRC violations and IR-drop hotspots, R² for net delay. CircuitNet 2.0 (ICLR 2024) moves to a
  14 nm FinFET node with CPU, GPU and AI-chip designs, more than 10,000 samples in all. CircuitNet 3.0
  (ICLR 2026), whose corresponding authors are at the Chinese Academy of Sciences' State Key Lab of
  Processors and CUHK, with Peking University co-authors, collects 8,659 open-source RTL designs,
  augments them to 15,863 instances at 45 nm, and predicts post-layout timing (arrival time, WNS, TNS)
  from RTL and power from RTL and netlists, scored by Pearson correlation, R² and MAPE on a fixed
  design-level split.
self_description:
  source: src-arxiv-2208-01040-v4
  quote: CircuitNet, which provides holistic support for cross-stage prediction tasks in back-end
    design with diverse samples
external_ids:
  arxiv: '2208.01040'
paper:
  title: 'CircuitNet: An Open-Source Dataset for Machine Learning Applications in Electronic Design Automation
    (EDA)'
  arxiv: '2208.01040'
  version_read: v4
  source: src-arxiv-2208-01040-v4
released: 2022-08-01
released_note: The first release, as the README's changelog and the arXiv submission both date it.
released_source: src-github-circuitnet-readme
released_quote: '- 2022/8/1 First release.'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/circuit-eda
domain_basis:
  reason: Every task predicts a property of a chip layout in the physical-design flow, which is
    electronic design automation.
  source: src-arxiv-2208-01040-v4
  quote: 'we further conducted experiments on three prediction tasks: congestion, design rule check (DRC)
    violation, and IR drop'
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: A model predicts a physical layout's later state -- routing congestion, rule violations,
      voltage drop -- from early-stage features, scored against what the EDA tools computed. The
      term's definition names physical, chemical, biological and Earth systems; a chip layout is
      taken as a physical system here, which a reviewer may contest.
    source: src-arxiv-2208-01040-v4
    quote: cross-stage prediction was introduced to replace the original long feedback loops between
      design stages with local loops within the design stages

evaluation_method:
  - statistical-fit
  - classification-metric
evaluation_method_basis:
  reason: Congestion is scored by NRMSE and SSIM over the predicted map; DRC violations and IR-drop
    hotspots by ROC and precision-recall AUC.
  source: src-arxiv-2208-01040-v4
  quote: we considered the area under the curve (AUC) of the receiver operating characteristic (ROC)
    curve and that of the precision-recall (PR) curve as the metrics for imbalanced learning
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are models trained from scratch for EDA prediction tasks, and
    engineering-design is one of the disciplines domain-specialist-model names.
  source: src-arxiv-2208-01040-v4
  quote: These methods utilized image-like features to train a generative model, such as fully
    convolutional networks (FCNs) and U-Net

lifecycle: active
lifecycle_basis:
  reason: The maintainers released CircuitNet 3.0 in May 2026 and keep the code updated.
  source: src-github-circuitnet-readme
  quote: Released CircuitNet 3.0 with N45 PDK!
activity: no-submission-channel
activity_basis:
  reason: The site and the README offer the data, documentation, tutorials and code, and no
    leaderboard or results route; results appear in users' papers.
  source: src-circuitnet-site
  quote: Home DocsDocs Get Started Dataset Features Tutorial Download GitHub

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: FCN-based congestion predictor (reimplemented)
    source: src-arxiv-2208-01040-v4
    observed_on: 2026-10-10
    quote: The corresponding results for an FCN based method [3] were 0.040 and 0.80, respectively
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The congestion, DRC and IR-drop results that the EDA tools computed on
  each finished layout.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The features, labels and code are public; producing new layouts would need commercial EDA
    licences, but scoring on the released data does not.
  source: src-github-circuitnet-readme
  quote: This repository is intended to hosts codes and demos for CircuitNet

task:
  exists: true
  input:
    - image-like feature maps (and netlist graphs) extracted from a layout at an early design stage
    - RTL code, and for power the synthesised netlist as well (3.0)
  output: A predicted map or set of hotspots for a later stage -- congestion, DRC violations, IR
    drop -- net delays (2.0), or post-layout timing metrics and power (3.0).
  scoring: Per task, the original method's metrics (NRMSE and SSIM; ROC and PR AUC); R² for net
    delay (2.0); Pearson correlation, R² and MAPE for timing and power (3.0).
  source: src-arxiv-2208-01040-v4
  quote: we used the normalized root-mean-square-error and structural similarity index measure as
    metrics to evaluate pixel-level accuracy

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: 3.0's public archive (circuitNetv3.zip) holds its RTL, netlists, gate-level features
    and power summaries, but its dataset card says the layout artifacts are still being uploaded and
    that a missing layout package can be requested from the maintainers, so part of 3.0 is not yet a
    public download (src-hf-circuitnet-3-card-5683d95, read 2026-11-18).
  access_basis:
    reason: Every version is a public download (Google Drive, Baidu Netdisk, Hugging Face), apart
      from 3.0's layout artifacts still being uploaded (access_note).
    source: src-github-circuitnet-readme
    quote: CircuitNet-N14 (v2.0) is currently maintained on Hugging Face
  refresh: versioned-releases
  refresh_basis:
    reason: New technology nodes and fixes arrive in dated, numbered releases recorded in the
      changelog.
    source: src-circuitnet-site
    quote: CircuitNet 1.0 Paper Link RTL to Layout in 28 nm Planar CMOS. CircuitNet 2.0 Paper Link
      RTL to Layout in 14 nm FinFET. CircuitNet 3.0
  data_provenance:
    - simulation-generated
    - web-scraped
  data_provenance_note: Layouts and labels come from running logic synthesis and place-and-route
    tools (Synopsys Design Compiler, Cadence Innovus) on open designs, under varied settings, from
    six RISC-V designs in 1.0 and eight CPU, GPU and AI-chip configurations in 2.0. web-scraped is
    3.0's, whose RTL was harvested from GitHub, Hugging Face, OpenCores and RISC-V projects and then
    augmented by syntax-tree rewriting (review_checks).
  data_provenance_source: src-arxiv-2208-01040-v4
  data_provenance_quote: Then, the physical design transformed the netlists into layouts with
    Cadence Innovus
  contamination_risk: unknown
  contamination_risk_note: All features and labels are public. The 2.0 paper fixes a split per
    experiment by design (net delay trains on 80 samples of three designs and tests on 20 of three
    others), but no scored split is published for 1.0 or 2.0, and users' configurations set their
    own. 3.0 differs. Its paper splits at the source-design level (80/10/10), testing only on
    un-augmented designs plus outside submodules, and its dataset card ships that partitioning, with
    augmented variants of test sources kept out of training and validation to avoid leakage. The
    route into a scored split was not assessed for 1.0 and 2.0 (review_checks).
  contamination_evidence:
    - source: src-hf-circuitnet-3-card-5683d95
      stance: against
      quote: Source-level train/validation/test partitioning, with augmented variants of test
        sources excluded from train/val to avoid leakage
  dataset_licence: null
  dataset_licence_note: The data licence differs by release, as the Hugging Face cards declare it.
    3.0's card is apache-2.0 (src-hf-circuitnet-3-card-5683d95) and the CircuitNet-N14 (2.0) card
    bsd-3-clause (src-hf-circuitnet-n14-card-df74f33); 1.0's Google Drive and Baidu downloads state
    none, and the site's footer and the code repository are BSD-3-Clause. Left null because one
    value would misstate the other releases and the entry carries no versions to hold them
    (review_checks).
  size_note: CircuitNet 1.0 has 10,242 layouts from six RISC-V designs ("we obtained 10,242 layouts
    after excluding the failed runs"); 2.0 more than 10,000 samples from eight design
    configurations; 3.0 8,659 source RTL designs and 15,863 instances with augmentation.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CircuitNet team (School of Integrated Circuits, Peking University)
  maintainer_basis:
    reason: The authors are at Peking University's School of Integrated Circuits, and the site and
      code are the CircuitNet team's.
    source: src-circuitnet-site
    quote: Copyright © 2022-present CircuitNet Team
  maintainer_type: academic-lab
  maintainer_type_note: 1.0 and 2.0 come from Peking University's School of Integrated Circuits,
    whose CircuitNet team holds the project organisation (circuitnet). 3.0's data and code sit in
    the SKLP-EDA-LAB organisations, and its paper's corresponding authors are at the Chinese Academy
    of Sciences' Institute of Computing Technology and at CUHK, with Peking University co-authors,
    so it is not held by the same lab (review_checks). Both holders are academic.
  submission_process:
    - literature-only
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Training and scoring on the released data runs end to end with the repository's scripts.
    source: src-github-circuitnet-readme
    quote: python test.py --task congestion_gpdl --pretrained PRETRAINED_WEIGHTS_PATH
  harness_availability: official-harness
  harness: CircuitNet (test.py per task)
  harness_source: src-github-circuitnet-readme
  harness_quote: python test.py --task congestion_gpdl --pretrained PRETRAINED_WEIGHTS_PATH
  code_licence: BSD-3-Clause
  code_licence_source: src-github-circuitnet-readme
  code_licence_quote: This repository is released under the BSD 3-Clause. license as found in the
    LICENSE file
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: the version and node (N28, N14, N45), the task, and for 1.0 and 2.0 the split
  # the code configuration chose (3.0 ships its own).
  material_extra:
    - subset_used
    - training_data_policy

liveness:
  repo_last_commit: 2026-05-17
  reproduction_script_present: true
  last_checked: 2026-11-17

homepage: https://circuitnet.github.io/
repository: https://github.com/circuitnet/CircuitNet
dataset_url: https://huggingface.co/datasets/SKLP-EDA-LAB/CircuitNet3.0

tags:
  - eda
  - vlsi
  - physical-design
  - routability

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S3-T02)
  added_on: 2026-10-10
  last_verified: 2026-11-18
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2208-01040-v4
    - src-arxiv-2208-01040
    - src-github-circuitnet-readme
    - src-circuitnet-site
    - src-iclr-2024-circuitnet-2
    - src-iclr-2026-circuitnet-3
    - src-hf-circuitnet-3-card-5683d95
    - src-hf-circuitnet-n14-card-df74f33
  sources_note: >
    The CircuitNet 1.0 note's v4 PDF (a DOI, not archived) read as text, with the corresponding author's
    address kept out; its abstract page; the README at main; and the site's home page with scripts and
    styles stripped. The 2.0 and 3.0 papers were read on 2026-11-18 as their ICLR proceedings PDFs, which
    are withheld from archiving because their title blocks name the authors; the OpenReview copies answer
    this project's fetcher with HTTP 403. For the 2026-11 sweep follow-up the 3.0 and N14 dataset cards
    were read raw at pinned revisions on 2026-11-18; the 3.0 card is withheld from archiving because it
    gives a personal contact address.
  confidence: medium
  review_checks:
    - check: capability scientific-prediction for an engineered system (see its basis).
    - check: dataset_licence is null although each Hugging Face release declares one (3.0
        apache-2.0, N14 bsd-3-clause) and 1.0 states none. Once versions are recorded, the licence
        can go per version; or the field could take 3.0's, the release dataset_url points to, with
        the others in the note.
      field: data.dataset_licence
      source: src-hf-circuitnet-n14-card-df74f33
      quote: 'license: bsd-3-clause'
    - check: contamination_risk stays unknown for the family. 3.0 ships a source-level split that
        keeps augmented copies of test designs out of training, which argues for low on 3.0 alone,
        while 1.0 and 2.0 leave the split to the user's configuration.
      field: data.contamination_risk
      source: src-hf-circuitnet-3-card-5683d95
      quote: Source-level train/validation/test partitioning, with augmented variants of test
        sources excluded from train/val to avoid leakage
    - check: "Lineage: 3.0 may be a separate benchmark rather than a version. Its paper's corresponding
        authors are at the Chinese Academy of Sciences' Institute of Computing Technology and at CUHK
        (the title block, kept out of the extract), its data and code sit in the SKLP-EDA-LAB organisations
        rather than circuitnet, and its tasks (timing and power from RTL, scored by PCC, R² and MAPE)
        differ from 1.0's and 2.0's layout tasks; 04 S4 sends a different maintainer to a new entry with
        a lineage link. Against that, the CircuitNet README and site list it as the family's 3.0, and
        Peking University authors share the paper."
      field: lineage
      source: src-iclr-2026-circuitnet-3
      quote: 1State Key Lab of Processors, Institute of Computing Technology, Chinese Academy of
        Sciences 2University of Chinese Academy of Sciences 3The Chinese University of Hong Kong
        4Peking University 5Stanford University ∗Equal contribution †Corresponding authors
    - check: data_provenance web-scraped is 3.0's alone (RTL harvested from public repositories).
        Its augmented instances come from rule-based syntax-tree rewriting, which
        synthetic-procedural may also describe; if 3.0 leaves this entry, web-scraped goes with it.
      field: data.data_provenance
      source: src-iclr-2026-circuitnet-3
      quote: We systematically collected RTL designs from established platforms, including GitHub,
        Hugging Face, OpenCore, and RISC-V projects, ensuring compliance with open-source licensing
        requirements.

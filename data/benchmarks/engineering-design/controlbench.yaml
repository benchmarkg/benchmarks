lineage:
  role: root
lineage_note: >
  No version, variant or fork is known. The same group's next benchmark, ControlEval (500 controller-design
  tasks in ten types, with the ControlAgent paper, arXiv 2410.19811), is a new dataset built because no
  suitable one existed, not a revision of ControlBench; CoDyControlBench (arXiv 2608.07004, another group)
  sets out to extend the evaluation to nonlinear, coupled and higher-order systems with items of its own.
  Neither shares ControlBench's problems, so neither is a lineage link.
lineage_source: src-arxiv-2410-19811-v1
lineage_quote: Since no suitable open-source dataset is currently available for validating
  ControlAgent, we developed a new evaluation dataset, called ControlEval, to serve this purpose.


# data/benchmarks/engineering-design/controlbench.yaml
#
# P1-S8-T03, engineering-design entry 5. Filled from the ControlBench paper, arXiv 2404.03647 read as its v1 PDF
# (2024-04-04, the only version), and its abstract page; the project page (agi4engineering.github.io/LLM4Control);
# and the problem file ControlBench/ControlBench.tex in AGI4Engineering/LLM4Control (commit 239e319, main). The
# ControlAgent paper (arXiv 2410.19811, v1 PDF) was read for the same group's next benchmark, and the
# CoDyControlBench paper (arXiv 2608.07004, v1 PDF, August 2026) as a 2026 paper that takes ControlBench as its
# point of reference. GitHub's API was read for the licence, the owner and the commit history. Every quote below
# is checked by the quote-substring validator against those Sources' extracts.
#
# The home was the hard call. ControlBench is an exam of control-engineering problems answered in text, and
# engineering-design's inclusion test asks for a submitted design. The family is kept because the subject is
# control engineering and the benchmark's own claim is classical control design: general-intelligence's exams
# leaf sends a one-subject exam to that subject's family, mathematics excludes questions about another field, and
# physics' tests do not fit. But only the four design topics (40 of 147 problems) are about design; the rest are
# analysis questions. The leaf is forced (process-control-optimization names an industrial process), and the gap
# is logged as taxonomy/_failures/2026-11-18-controlbench-001.yaml.

id: controlbench
name: ControlBench
aliases: []
aliases_note: LLM4Control is the repository's and the project page's name, not the benchmark's. A
  different benchmark also called ControlBench, for the controllability of AI agents (arXiv
  2605.27117, 2026, another maintainer), was seen only in arXiv's listing and not read; and
  CoDyControlBench (arXiv 2608.07004) is another group's controller-design benchmark. A
  "ControlBench" number in another paper should be matched to its citation before it is attached
  here.
tagline: 147 undergraduate classical-control problems, answered in free text and marked right or
  wrong by a control expert.
description: >
  A set of 147 undergraduate control-engineering problems from a group at the University of Illinois Urbana-Champaign
  with co-authors at the University of Michigan and UC San Diego, taken from the exercises of Schaum's
  Outline of Feedback and Control Systems and from undergraduate control classes at Michigan (EECS 460)
  and Illinois (ECE 486), transcribed into LaTeX with a step-by-step solution for each. The problems span
  twelve topics: background mathematics, stability, time response, block diagrams, control system design,
  Bode analysis, root-locus and Nyquist design, gain and phase margins, sensitivity, loop shaping and
  advanced topics (Lyapunov stability, controllability, observability); 26 carry a figure such as a Bode
  or Nyquist plot. Only the four design topics (40 problems) are about designing a controller or compensator;
  the rest ask for a stability range, a response, a reading or a conclusion. A model answers each problem
  zero-shot, with a confidence level, and a control expert marks the answer correct when its final answer
  matches the solution, even where the reasoning slips; the score is the share correct (ACC), overall
  and per topic. A second score, ACC-s, puts a "check your solution" prompt to the answers first marked
  wrong. ControlBench-C turns 100 of the problems into four-option multiple-choice questions scored on
  the choice alone, which the maintainers call much simpler. The paper reports GPT-4, Claude 3 Opus and
  Gemini 1.0 Ultra (April 2024), with Claude 3 Opus best at 58.5% ACC. The repository releases the problems,
  the solutions and PDFs of sampled responses, with no code and no leaderboard.
self_description:
  source: src-arxiv-2404-03647-v1
  quote: We introduce ControlBench, a benchmark dataset tailored to reflect the breadth, depth, and
    complexity of classical control design.
external_ids:
  arxiv: '2404.03647'
paper:
  title: 'Capabilities of Large Language Models in Control Engineering: A Benchmark Study on GPT-4, Claude
    3 Opus, and Gemini 1.0 Ultra'
  arxiv: '2404.03647'
  version_read: v1
  source: src-arxiv-2404-03647-v1
released: 2024-04-04
released_basis:
  reason: The arXiv submission date, the paper's only version. The problem files were committed to
    the repository two days later, on 2024-04-06 (GitHub API).
  source: src-arxiv-2404-03647
  quote: Mathematics > Optimization and Control arXiv:2404.03647 (math) [Submitted on 4 Apr 2024]
release_venue: null
release_venue_note: No source read here names a venue; the project page's citation gives the arXiv
  preprint.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/process-control-optimization
  secondary:
    - multimodal/chart-diagram-understanding
domain_basis:
  reason: >
    The family is engineering-design because the subject is control engineering and the benchmark's claim
    is classical control design, though only the four design topics (control system design 24, root-locus
    7, Nyquist 5, loop-shaping 4; 40 of 147) mostly submit a design, a controller's gains or a compensator;
    the other 107 are analysis questions answered with a value or an expression. The leaf is forced. process-control-optimization
    is the nearest, controlling a process against operating objectives, but its definition names an industrial
    process and these plants are textbook transfer functions and a car's cruise control. Logged as a missing-term
    gap (taxonomy/_failures/2026-11-18-controlbench-001.yaml). chart-diagram-understanding is secondary
    for the 26 problems that carry a Bode, Nyquist or root-locus plot or a block diagram, which the paper
    singles out as the models' common failure.
  source: src-arxiv-2404-03647-v1
  quote: Our problem set captures the essence of feedback system design and the analytical skills
    required in this field.
domain_considered_and_rejected:
  - term: mathematics/applied-modeling
    reason: The answers are values and expressions and arXiv files the paper under math.OC, but the
      questions are about control engineering, which the mathematics family's exclusion sends to
      that field's family; and most problems state the model (a transfer function or an ODE) rather
      than ask for it to be formulated.
    source: src-arxiv-2404-03647
    quote: 'Subjects: Optimization and Control (math.OC); Artificial Intelligence (cs.AI); Machine Learning
      (cs.LG)'
  - term: physics/physics-reasoning
    reason: The systems are given as transfer functions and textbook plants, and the answer is a
      controller, a stability range or a response, not a physical observable; physics' inclusion
      test (an observable, a simulation, research-level physics) does not fit.
  - term: general-intelligence/multi-subject-knowledge-exams
    reason: One subject holds every problem, and the leaf's exclusion test sends such an exam to
      that subject's family.
  - term: robotics-embodiment/continuous-control
    reason: Nothing is operated; no environment is run and no controller is rolled out. The answer
      is written and graded on paper.

capability:
  - quantitative-reasoning
capability_basis:
  quantitative-reasoning:
    reason: Most answers are a number or an expression reached by algebra and calculation (a gain
      range by Routh-Hurwitz, a step response by partial fractions, PI gains by pole placement), and
      the paper finds calculation errors the leading model's main failure.
    source: src-arxiv-2404-03647-v1
    quote: Currently, the biggest bottleneck for Claude 3 Opus is its calculation abilities.
capability_considered_and_rejected:
  - term: self-correction
    reason: ACC-s is the paper's measure of self-correction, but the check prompt is put only to the
      answers the experts had marked wrong, so the revision is triggered by the grader's verdict,
      which the term's exclusion (an external oracle) covers; ACC is the headline (review_checks).
    source: src-arxiv-2404-03647-v1
    quote: we deploy a subsequent self-checking prompt for initially incorrect responses
  - term: perception
    reason: 26 of 147 problems carry a plot or a diagram, and misreading them is a named failure,
      but the score is the control answer, the figures are a minority, and the secondary domain
      records them.
  - term: knowledge-recall
    reason: Problems are answered closed-book, but the term's exclusion removes background knowledge
      used on the way to a different scored outcome, here a worked solution.
  - term: calibration-uncertainty
    reason: The prompt asks for a confidence level from 0 to 100, but the grading never consumes it;
      the paper only remarks that high confidence does not mean a right answer.
    source: src-github-llm4control-controlbench-tex
    quote: Provide a concise yet comprehensive response to the following question, including a
      confidence level ranging from 0 to 100 for the accuracy of the answer.
  - term: constraint-satisfaction
    reason: Design problems state specifications (stability, settling time, damping), but the
      verdict is an expert's on the final answer, not a check of enumerated conditions, and most
      problems are not designs.
  - term: reliability-consistency
    reason: The paper notes that answers vary from sample to sample, but each problem is scored
      once.
    source: src-arxiv-2404-03647-v1
    quote: Even for the same question, all three LLMs can generate drastically different answers.

evaluation_method:
  - human-expert-eval
  - multiple-choice
evaluation_method_basis:
  reason: >
    A control expert reads each free-text answer and marks it correct when its final answer matches the
    reference solution, also when the reasoning is partly wrong but does not compromise the result; wrong
    answers are typed into seven error categories, which do not enter the score. ControlBench-C's 100
    items each offer four options, (a) to (d), and are scored on the choice alone, so chance is 25%.
  source: src-github-llm4control-controlbench-tex
  quote: For each question, if the final answer aligns with the correct solution, it is considered
    correct.
evaluation_method_considered_and_rejected:
  - term: expert-panel-assessment
    reason: The paper speaks of a panel of human experts, but they mark answers one by one into an
      accuracy; no committee issues a collective assessment.
    source: src-arxiv-2404-03647-v1
    quote: We present evaluations conducted by a panel of human experts
  - term: numeric-tolerance-match
    reason: No tolerance or matching rule is stated; the grader judges, and a design problem can
      have more than one right answer.
    source: src-arxiv-2404-03647-v1
    quote: There is more than one design that satisfies the given objectives.
  - term: rubric-graded
    reason: One verdict per answer; the error type recorded for a wrong answer is not a criterion
      combined into the score.
  - term: model-graded-judge
    reason: No model grades ControlBench; ControlBench-C's choices are read off the answer.

designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: Each problem is put to a chat model as a natural-language prompt copied from its LaTeX,
    zero-shot, with a follow-up check prompt for ACC-s; the paper's entrants are GPT-4, Claude 3
    Opus and Gemini 1.0 Ultra.
  source: src-arxiv-2404-03647-v1
  quote: we start with a zero-shot prompting strategy (i.e., directly inputting the question) and
    examine the responses through human annotation.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: No human answered the problems, and the paper declines a comparison with people.
    source: src-arxiv-2404-03647-v1
    quote: It is important to clarify that the accuracies detailed in Table 2 are not intended for
      direct comparison with human expertise.
  - term: tool-augmented-model
    reason: No tools are offered; code and MATLAB toolboxes are named as future work.
    source: src-arxiv-2404-03647-v1
    quote: integrate external resources like programming code or Matlab control toolboxes
  - term: reasoning-model
    reason: None of the 2024 entrants is one, and the protocol sets no reasoning budget.
  - term: agent-scaffold
    reason: One answer per problem plus, for ACC-s, one check prompt; no loop decides the next step.

lifecycle: null
lifecycle_note: >
  Not established. No 2025-2026 source read here produces results on ControlBench: a 2026 paper calls
  it the most notable benchmark effort for controller design and builds its own, as does the same group's
  ControlAgent paper (2024, ControlEval), and the maintainers' repository has not changed since 2024-04-16.
  A Kyutech study reported in search results to have run GPT-4o and a custom GPT on it (about December
  2024, in Japanese) could not be read: its host did not answer. dormant's exclusion asks for null where
  the sources show inactivity and are silent on use. Logged as taxonomy/_failures/2026-11-18-controlbench-002
  (review_checks).
lifecycle_source: src-arxiv-2608-07004-v1
lifecycle_quote: The most notable benchmark effort is ControlBench
activity: no-submission-channel
activity_basis:
  reason: The project page and the repository release the problems, the solutions and the three
    models' sampled responses from the paper; there is no leaderboard or submission route, and later
    results would appear in their authors' papers.
  source: src-controlbench-site
  quote: Evaluations of Leading LLMs on ControlBench We assess the capabilities of GPT-4, Claude 3
    Opus, and Gemini 1.0 Ultra on ControlBench using a zero-shot prompting followed by self-checking
    strategy, and examine the responses through human annotation.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude 3 Opus
    source: src-arxiv-2404-03647-v1
    observed_on: 2026-11-18
    quote: Total 45.6% (67/147) 47.6% (70/147) 58.5% (86/147) 68.7% (101/147) 34.0% (50/147) 38.8%
      (57/147)
    note: Table 2's totals, ACC then ACC-s for GPT-4, Claude 3 Opus and Gemini 1.0 Ultra; Claude 3
      Opus has 58.5% ACC (86 of 147) and 68.7% ACC-s.
evaluation_target: learned-system
execution_mode: human-in-loop
ground_truth_source: held-out-labels
ground_truth_source_note: The step-by-step reference solution the authors wrote for each problem,
  published in the same LaTeX file; a control expert decides whether an answer's final result
  matches it, which for a design problem with several valid designs is a judgement.
ground_truth_source_source: src-arxiv-2404-03647-v1
ground_truth_source_quote: In addition, we also provide a detailed step-by-step solution for each
  problem in LaTeX.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The problems, figures and reference solutions are public; scoring the full set needs a
    person who can grade control answers, and ControlBench-C needs only the keyed choices.
  source: src-arxiv-2404-03647-v1
  quote: Our ControlBench dataset and the related Latex/PDF files are available at
    https://agi4engineering.github.io/LLM4Control/.

task:
  exists: true
  input:
    - one undergraduate control problem in English, copied from its LaTeX (transfer functions, ODEs,
      specifications), with the figure for the 26 that carry a plot or a block diagram
    - an instruction to answer concisely with a confidence level from 0 to 100
  output: A worked solution ending in a final answer, such as a gain range, a step response, a
    transfer function, a yes-or-no conclusion or a controller's gains; for ControlBench-C, one of
    four options in a small JSON object with a short reason.
  scoring: >
    A control expert marks each answer correct or incorrect by its final answer against the reference
    solution; the score is the share correct over the 147 problems (ACC), also per topic. ACC-s counts,
    in addition, the wrong answers put right after one "check your solution" prompt. ControlBench-C is
    scored on the chosen option only, reasoning ignored.
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The reference solutions are in the same public file as the
    problems.
  reference_solution: true
  source: src-github-llm4control-controlbench-tex
  quote: In our evaluation process, a control engineer expert carefully assesses the answers
    generated by GPT or other Large Language Models (LLMs).

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The LaTeX and PDF of both problem sets, solutions included, are in a public GitHub
      repository linked from the project page, without an account or an agreement.
    source: src-arxiv-2404-03647-v1
    quote: Our ControlBench dataset and the related Latex/PDF files are available at
      https://agi4engineering.github.io/LLM4Control/.
  refresh: static
  refresh_basis:
    reason: One release. The problem files were committed on 2024-04-06 and have not changed since
      (GitHub API, not a quoted Source), and no version is labelled; the paper names a larger and
      more varied problem set as future work, not yet published.
    source: src-arxiv-2404-03647-v1
    quote: Increasing the diversity of the problem set in the ControlBench dataset could provide a
      more comprehensive evaluation of LLMs.
  data_provenance:
    - exam-derived
    - expert-authored
  data_provenance_note: The problems are exercises from a textbook (Schaum's Outline of Feedback and
    Control Systems) and problems from two universities' undergraduate control classes, transcribed
    into LaTeX by hand; exam-derived is the nearest term for both (review_checks). The step-by-step
    solutions were written by the authors, control researchers, hence expert-authored.
  data_provenance_source: src-arxiv-2404-03647-v1
  data_provenance_quote: This collection comprises problems sourced from exercises in [16], and
    problems gathered from undergraduate control classes at University of Michigan (EECS 460) and
    University of Illinois, Urbana-Champaign (ECE 486).
  contamination_risk: medium
  contamination_risk_note: >
    The problems and their solutions have been public together on GitHub since April 2024, and the textbook
    exercises were in print long before, so a training route is plausible; no canary string or held-out
    split is used, and no source read here evidences a route.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: ACC is a share of problems solved, bounded at 100%, and the paper measures no human
      performance and declines to compare with people.
    source: src-arxiv-2404-03647-v1
    quote: Our main evaluation metric is Accuracy (ACC), defined as the proportion of instances
      where the LLMs correctly solve the given problems.
  dataset_licence: null
  dataset_licence_note: The repository has no licence file and GitHub reports none for
    AGI4Engineering/LLM4Control (API, read 2026-11-18); the CC BY-SA 4.0 notice on the project page
    covers the website. No source read here states terms for the problems.
  upstream_licences: Not stated. The problems are adapted from a commercial textbook (Schaum's
    Outline, McGraw-Hill) and from course materials of EECS 460 (Michigan) and ECE 486 (Illinois);
    no source read here gives their terms.
  size:
    - count: 147
      unit: problems, each with a step-by-step reference solution
      source: src-arxiv-2404-03647-v1
      quote: we first create a collection of 147 undergraduate control problems
    - count: 26
      unit: problems with a visual element (a plot or a block diagram)
      source: src-arxiv-2404-03647-v1
      quote: Gain/Phase Margins 9 0 System Sensitivity Measures 3 0 Loop-shaping 4 0 Advanced Topics
        7 0 Total 147 26
    - count: 100
      unit: four-option multiple-choice questions converted from the problems
      subset: ControlBench-C
      source: src-arxiv-2404-03647-v1
      quote: we convert 100 problems from ControlBench into single-answer multiple-choice questions,
        leading to the ControlBench-C dataset
  size_note: ControlBench.tex at commit 239e319 has one \subsection per problem, 147 in all, with
    the paper's per-topic counts.
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ControlBench authors (University of Illinois Urbana-Champaign, with the University
    of Michigan and UC San Diego)
  maintainer_basis:
    reason: Six of the eight authors are at the University of Illinois Urbana-Champaign, one at the
      University of Michigan and one at the Allen Institute for AI and UC San Diego (the paper's
      affiliation list, read but kept out of the extract beside the names); the data and the site
      are in the AGI4Engineering GitHub account, which the API reports as a user-type account, not
      an organisation.
    source: src-arxiv-2404-03647-v1
    quote: Our ControlBench dataset and the related Latex/PDF files are available at
      https://agi4engineering.github.io/LLM4Control/.
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: The maintainers published the paper's three models and their sampled
    responses and keep no ranking; anyone else reports their own expert-graded numbers in their own
    papers.
  independence_flags: []
  independence_flags_note: None recorded. The authors are at universities and, for one, the Allen
    Institute for AI; none of the evaluated models (OpenAI's, Anthropic's, Google's) is theirs, and
    the acknowledged funding is an NSF award, read in the paper but not quoted because the sentence
    names people.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2404-03647-v1
    quote: So far we do not have a fast automated way to evaluate LLM responses on ControlBench.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: human-panel
  compute_tier_note: A run needs API calls (or a GPU) for the model and a control expert to grade
    147 answers, more for ACC-s; ControlBench-C needs only the model calls.
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: The headline score is a person's verdict on each answer, so reproducing it means
      recruiting a grader who can check control solutions; the problems and solutions are public.
    source: src-github-llm4control-controlbench-tex
    quote: In some cases, while the reasoning steps may not be entirely correct, if the final answer
      is accurate and doesn't compromise the overall solution, it is still regarded as correct.
  reproducibility_blockers:
    - human-raters
    - no-reference-implementation
  harness_availability: none
  harness_availability_note: The repository holds the two problem files (LaTeX and PDF, with
    figures), PDFs of sampled responses in logs/, and the site; no code. ControlBench-C asks for a
    JSON answer meant for automated checking, but no script is published.
  code_licence: null
  code_licence_note: No code is published; the repository has no licence (GitHub API, read
    2026-11-18).
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # The human-judged profile (human-expert-eval x instruction-tuned-model) carries the human help, the subset and
  # the grading rubric; ControlBench-C resolves to llm-static-text, whose retries_allowed covers the self-check
  # turn that separates ACC from ACC-s. sampling is added because the paper finds answers differ drastically from
  # sample to sample, and prompt_template_hash because small rewordings of a problem change the answer (its
  # section 4.5).
  material_extra:
    - sampling
    - prompt_template_hash
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper's headline is the total ACC over the 147 problems (a micro-average, so the 28
    background problems weigh more than the 3 on sensitivity), reported beside ACC per topic and the
    secondary ACC-s.
  source: src-arxiv-2404-03647-v1
  quote: Total 45.6% (67/147) 47.6% (70/147) 58.5% (86/147) 68.7% (101/147) 34.0% (50/147) 38.8%
    (57/147)
headline_metric: null
headline_metric_note: The headline is expert-graded accuracy over the 147 problems; no Metric record
  exists for it and this task may not write one.
no_legitimate_aggregate: false

liveness:
  repo_last_commit: 2024-04-16
  reproduction_script_present: false
  last_checked: 2026-11-18

homepage: https://agi4engineering.github.io/LLM4Control/
repository: https://github.com/AGI4Engineering/LLM4Control
dataset_url: https://github.com/AGI4Engineering/LLM4Control/tree/main/ControlBench
leaderboard_url: null


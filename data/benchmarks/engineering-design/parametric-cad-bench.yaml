    label: Parametric CAD Bench v1, 100 text-to-CAD creation tasks
    version_kind: revision
    released: 2026-05-13
    items: 100
    changes: The launch set of 100 text-to-CAD creation tasks (a part description and a table of key
      parameters), run with Harbor on FreeCAD 0.21.2 and scored by freecad-validator 0.1.0 as the
      harmonic mean of geometry similarity and the share of consistent parameters; the reference
      geometry and grader sat in the task image behind root-only permissions, and agents had
      outbound internet. Ten agent-model cells in May 2026 and five more in August; frozen and
      closed to submissions when V2 was released.
    breaking: false
    superseded_by: v2
    frozen: true
    sources:
      - src-cadbench-ai-news-parametric-cad-bench
      - src-cadbench-ai-leaderboard-v1
      - src-hf-api-gnucleus-cad-gen-freecad-bench
      - src-cadbench-ai
  - version: v2
    label: Parametric CAD Bench v2, the same 100 tasks on a corrected stack
    version_kind: revision
    released: 2026-09-08
    items: 100
    changes: The same 100 task ids as V1, run on FreeCAD 1.1.0 with validator 0.4.0, the held-out
      assets moved into a separate verifier image, rewards reported under Harbor's contract and
      explicit zero-reward paths for failures; a fresh board of ten runs. Its trajectories showed
      agents seeking the reference CAD and grader artifacts. Kept as a historical board when V3 was
      released; no outside V2 manifest was accepted.
    breaking: true
    supersedes_version: v1
    superseded_by: v3
    frozen: true
    sources:

  sources_note: >
    The paper's v1 PDF and its abstract page (DOIs, not archived), read as text with the windows kept
    away from the author block, which prints e-mail addresses; seven cadbench.ai pages, server-rendered,
    with script and style blocks stripped and the V2 post's contributor names kept out of the windows;
    two READMEs at pinned commits; and Hugging Face's public API records of four datasets (none gated).
    The task ids of the three results datasets and the source dataset were compared from the API records'
    file lists, not from a quoted statement.
  confidence: medium
  review_checks:
    - check: Identity of V2. Recorded as a revision because its 100 task ids are V1's (from the two
        results datasets' file lists, compared for this entry, not stated in a source) while the
        runtime, validator, isolation and failure handling changed; the maintainers call it a new
        benchmark version and froze V1's board.
      field: versions
      source: src-cadbench-ai-news-cad-bench-v2
      quote: That makes a v2 score a measurement on a new benchmark version, not a continuation of
        the v1 series.
    - check: Identity of V3. Recorded as an edition because maintainer, name, site, board,
        submission repository and harness carry over, but it replaces every task, adds two workflows
        (create-and-edit and drawings) and a new scorer; the maintainers call it a fresh
        measurement. A reviewer may judge the task change large enough for an entry of its own.
      field: versions
      source: src-cadbench-ai-news-cad-bench-v3
      quote: A v3 score is therefore a fresh benchmark measurement, not a continuation of the v2
        series.
    - check: Domain secondary agents-tooluse/operating-system-tasks rests on agents working through
        a shell in a container and on the harness being a measured variable, by analogy with
        replibench; the grader scores a design, so the secondary may be over-tagging.
      field: domain
    - check: Capabilities. self-correction rests on the V1 report's claim that the loop is measured
        and on the harness gaps it traces to checking the saved part; only the final document is
        scored, which is swe-bench-verified's near miss. perception was rejected for the drawing
        tasks, which a reviewer may read as a raw image input.
      field: capability
      source: src-cadbench-ai-news-parametric-cad-bench
      quote: 'Same model, same task, different verification rhythm: +6 to +9 points of absolute composite
        score.'
    - check: domain-metric for the geometry axis. It is a bespoke comparison of solids defined by
        this validator, not a named, standardised measure of the field, which the term's inclusion
        test asks for; no other term fits better, so no gap was logged.
      field: evaluation_method
      specialist: true
      source: src-arxiv-2611-02659-v1
      quote: An independently measured OCCT oriented bounding box is a gate, not an additional
        weighted subscore
    - check: contamination_risk medium for the benchmark as scored now (V3). V1 and V2's 100 parts
        and reference documents are the train split of gnucleus-ai/cad-gen-freecad, which the
        maintainers released for CAD generation, so a reviewer may record those frozen versions as
        high.
      field: data.contamination_risk
      source: src-cadbench-ai
      quote: aimed at accurate, parametric CAD generation from text prompt
    - check: data_provenance expert-authored rests on "authored by gNucleus AI" and on CAD engineers
        writing the parameter checks; the sources do not say who modelled the parts or wrote the
        descriptions, or whether the part families were generated procedurally. The V2 post credits
        five outside contributors (names withheld) with public tasks and results.
      field: data.data_provenance
    - check: submission_process maintainer-run rests on V1's internal baseline; the sources do not
        say who ran each V3 row. The Run the Bench page says to contact the maintainers about the V3
        manifest format, while the README at the commit read already carries a V3 template; no
        accepted outside V3 row was seen.
      field: governance.submission_process
      source: src-cadbench-ai-news-parametric-cad-bench
      quote: layout the internal baseline uses
    - check: The Harbor Hub tab and the Harbor job pages are script-rendered and were not read; the
        board's rows come from cadbench.ai. The V3 tab notes that one row's Harbor job links fewer
        trials than tasks. leaderboard_last_updated is the Harbor snapshot date.
      field: liveness.leaderboard_last_updated
      source: src-cadbench-ai-leaderboard
      quote: Harbor reports metrics over 100 tasks and currently links 96 trials.

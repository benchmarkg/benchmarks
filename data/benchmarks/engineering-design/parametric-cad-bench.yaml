  - version: v3
    label: Parametric CAD Bench v3, 100 new tasks in three workflows (current)
    version_kind: edition
    released: 2026-09-21
    items: 100
    changes: A new task set, sharing no task id with V1 or V2, of 30 text-to-CAD creation, 30
      create-and-edit and 40 image-to-CAD tasks, on FreeCAD 1.1.0, Harbor 0.23.0 and task schema
      1.3, scored by validator 0.6.0's v2 scorer (an oriented-bounding-box gate, stricter
      per-component comparison, revised geometry weights and a failure budget of ten parameters);
      agent network limited to the model provider, one attempt per task, and the dataset pinned by a
      digest. The paper's version.
    breaking: true
    supersedes_version: v2
    frozen: true

subsets:
  - id: parametric-cad-bench#create
    label: Text-to-CAD creation (V3)
    items: 30
    scored_separately: true
    evidence:
      - source: src-arxiv-2611-02659
        quote: We present Parametric CAD Bench v3, a 100-task benchmark comprising 30 text-to-CAD
          creation tasks, 30 text-to-CAD create-and-edit tasks, and 40 tasks that reconstruct
          mechanical parts from engineering drawings.
    notes: The V3 board's Create column. V1 and V2 consisted of creation tasks only, 100 each.
  - id: parametric-cad-bench#create-and-edit
    label: Text-to-CAD create-and-edit (V3)
    items: 30
    scored_separately: true
    evidence:
      - source: src-arxiv-2611-02659-v1
        quote: Create-and-edit measures two-stage construction, not maintenance of an externally
          authored document.
    notes: The agent builds a base part from text and then the edited part; both documents are
      scored and their rewards combined by harmonic mean, as one task. No externally authored
      document is supplied, and the scores do not show whether the edit reused the base's feature
      history. Every task that drew zero from all systems in the paper's snapshot is in this
      workflow.
  - id: parametric-cad-bench#image-to-cad
    label: Image-to-CAD from engineering drawings (V3)
    items: 40
    scored_separately: true
    evidence:
      - source: src-arxiv-2611-02659-v1
        quote: Image-to-CAD tasks provide engineering drawings rather than the held-back dimensional
          specification.
    notes: The drawing is the only geometry input, with no prose description or parameter list. The
      workflow separates systems most widely in the paper (8.18% to 84.66%), and the agent's image
      interface changes the result.

lineage:
  role: root
lineage_note: No variant or fork was found in the sources read. The paper says gNucleus AI
  contributed three FreeCAD tasks of the create-and-edit and image-to-CAD kinds to Terminal-Bench
  3.0/4.0; they belong to Terminal-Bench, not to a version of this benchmark.
  gnucleus-ai/cad-gen-freecad is V1's source data and is counted with the benchmark. CADBench,
  BenchCAD, CADGenBench, CAD-bench and 3DCodeBench, which the paper compares, are unrelated
  benchmarks.


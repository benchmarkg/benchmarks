curation:
  added_by: agent (P1-S8-T04)
  added_on: 2026-11-18
  last_verified: 2026-11-18
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2409-08534-v1
    - src-arxiv-2409-08534
    - src-github-analoggym-readme-0a9d139
    - src-github-analoggym-perf-extraction-amp-0a9d139
    - src-github-api-analoggym
    - src-aaai-2026-priority-graph-rl
    - src-eecs-berkeley-techrpt-2026-32128
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, and its abstract page for the date and the
    abstract; the README and perf_extraction_amp.py at commit 0a9d1390ade361e2b4a2d33181e22367edbb8afc,
    and GitHub's API record for the repository; the AAAI-26 PDF (a DOI) and the Berkeley report's page
    as evidence of current use. The README is withheld from archiving (a contact e-mail address and the
    authors' names) and so is the Berkeley page (the author's and editors' names); the script and the
    API record are pending. Commit history, the repository tree and earlier READMEs come from GitHub's
    API and raw files and are not quoted; the documentation site renders the README.
  confidence: medium
  review_checks:
    - check: Criterion b. The scoring procedure (FOM_AMP against Table 6's baselines, the
        phase-margin band, the worst case over PVT corners) is defined for amplifiers only; the LDOs
        and the other categories have metric and constraint tables but no reference figure, and no
        script in the repository computes FOM_AMP (the amplifier script returns a hand-weighted
        cost). Whether the suite meets the survey's criterion b as a whole, or only for amplifiers.
      field: task
      source: src-github-analoggym-perf-extraction-amp-0a9d139
      quote: foms = meas['gbp']*10 / (meas['power']*1e3)
    - check: Size. The paper and README say 30 topologies, but Table 1's counts (16, 6, 6, 3, 1) sum
        to 32. At commit 0a9d139 the repository holds 21 amplifier design-variable files (17 Ngspice
        netlists, one of them empty), four LDO sets, Spectre netlists for the sensing front ends,
        only a description for the voltage references, and a Charge Pump folder that no source read
        describes.
      field: data.size
      source: src-arxiv-2409-08534-v1
      quote: Amplifier 16 Spectre/Ngspice
    - check: Versions. The 2025-05-31 rewrite of the FOM_AMP penalty is modelled as a revision with
        breaking false, since the maintainers call it equivalent to the intended penalty. The
        printed form is degenerate, so which form produced the paper's FOM_AMP values is unknown; an
        erratum on one version is the other reading. Circuit additions and deletions in place are
        not versioned.
      field: versions
      source: src-github-analoggym-readme-0a9d139
      quote: 'This structure is logically equivalent to the original one: it penalizes only when a parameter
        exceeds its reference.'
    - check: The paper's study says four algorithms and lists five, and states a 1,000-simulation
        limit while Table 7 records 5,284.6 to 6,842 fitness evaluations for GCNRL (an RL
        interaction may count differently). sample-efficiency is rejected partly on this.
      field: capability
      source: src-arxiv-2409-08534-v1
      quote: FEs Consumption 5284.6 826.1 122.4
    - check: designed_for_subjects. The entry treats the Gaussian-process Bayesian optimisers and
        the surrogate-assisted evolutionary algorithm as learned (domain-specialist-model) and only
        the multi-task evolutionary algorithm as classical-algorithm, by classical-algorithm's
        exclusion of per-run model fitting. rl-policy is arguable for the RL entrants and the Gym
        framing.
      field: designed_for_subjects
      specialist: true
      source: src-arxiv-2409-08534-v1
      quote: Modeling Time (min) 10.4 - 11.6 -
    - check: domain-metric for a figure of merit the suite defines from simulated circuit metrics;
        no term names a score computed by simulating the submitted design. Logged as
        taxonomy/_failures/2026-11-18-analoggym-001 (simulator-reevaluation, the third case after
        open-catalyst-oc20-oc22 and learn2design-2026).
      field: evaluation_method
    - check: Independence. Some methods in the paper's study (MTEA, ref. 11; WEIBO and cVTS, refs 1
        and 6) and the AAAI-26 method come from papers whose author lists overlap AnalogGym's, and
        the AAAI-26 authors are at UESTC and Guangzhou University, both among the suite's
        institutions. The rule does not count names or a shared university, so no flag is set;
        whether an affiliation shows the same lab needs a reviewer.
      field: governance.independence_flags
    - check: maintainer_type academic-lab for a team across five institutions, held in the CODA-Team
        GitHub organisation; community-collective is the other reading, and no source names a single
        lab as the holder.
      field: governance.maintainer_type
      source: src-github-api-analoggym
      quote: '"type":"Organization"'
    - check: Current use rests on the AAAI-26 paper and a Berkeley report read only as an abstract
        (its full text is delayed). The Phase-0 survey's evidence, reuse by AnalogGym-Opt (IEEE TCAD
        2026), was not found by search, and PPAAS (arXiv 2507.17003) was read only to see that it
        sizes one AnalogGym amplifier in another PDK.
      field: lifecycle
    - check: reproducibility_blockers. specific-simulator-build for ngspice-42 or later; the three
        categories without an open PDK need Spectre or HSPICE and commercial process models, which
        licence-restriction may describe.
      field: execution.reproducibility_blockers
      specialist: true
      source: src-github-analoggym-readme-0a9d139
      quote: manually upgrade to `ngspice-42` or later
    - check: aggregation_policy official-aggregate rests on FOM_AMP combining one amplifier's
        metrics. Nothing aggregates across topologies, and the suite lets methods choose their own
        objective, so none-by-design is the other reading.
      field: aggregation_policy
      source: src-arxiv-2409-08534-v1
      quote: AnalogGym provides the interface to access the individual performance metrics and
        allows the circuit synthesizer to dynamically select its optimization objective.
    - check: ceiling expert-best. The baselines are described as criteria derived from the original
        papers, so they may be minimum operating criteria rather than the designers' best
        performance; Table 6 is headed 180 nm while the study and the repository use sky130 (130
        nm).
      field: data.ceiling_anchor_type
      specialist: true
      source: src-arxiv-2409-08534-v1
      quote: These baseline performances are derived from the analysis of the original papers
        proposing these topologies, identifying the fundamental criteria necessary for reliable
        circuit operation.

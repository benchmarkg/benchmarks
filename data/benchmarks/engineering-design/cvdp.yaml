lineage:
  role: root
lineage_note: Only what a source read states. CVDP shares a maintainer with VerilogEval but none of
  its items, and the paper presents it as a new benchmark beside VerilogEval and RTLLM, so neither
  is lineage. LBC-bench is Si2's leaderboard on CVDP releases; its README calls it a benchmark whose
  initial focus is CVDP, and Si2's coalition plans to extend the problems to new categories and
  design domains, but no extended problem set was found, so no fork is recorded (review_checks). The
  heavy-context problems are a subset of v1.1.0, by the same maintainer in the same dataset.


# data/benchmarks/engineering-design/cvdp.yaml
#
# P1-S8-T04, engineering-design entry 7. Filled from the CVDP paper, arXiv 2506.14074 read as its v1 PDF (2025-06-17,
# the only version), and its abstract page; three files of NVlabs/cvdp_benchmark at commit 8e894cf (2026-06-08, the
# head of main; the repository has no tags): README.md, README_FULL.md and LICENSE; on Hugging Face,
# nvidia/cvdp-benchmark-dataset's API record, its file listing with each file's last commit, the dataset viewer's
# size record, and the CHANGELOG, LICENSE, NOTICE and heavy-bundle README at commit 5b807d9 (2026-07-21); Si2's
# LBC-bench leaderboard repository at commit 0ac27bb (2026-11-07): its README, contributor guide and
# data/leaderboards.json (the board at lbc-bench.si2.org renders from it); and Si2's post on CVDP 1.1.0
# (2026-06-23). Current use is from the v1 PDF of RTL-Interact (arXiv 2610.41225, October 2026) and the board's
# rows (to 2026-07-26); the GateTruth abstract page (arXiv 2608.12635, August 2026) for what the public release
# lets others audit. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.
#
# The family entry: one NVIDIA benchmark in six dataset releases (v1.0.0 to v1.1.0, revisions). Its non-agentic
# code generation, agentic code generation and non-agentic comprehension formats are subsets, each with its
# task categories as children (scored separately in the paper's Tables 2 to 4), and v1.1.0's heavy-context
# agentic set is a fourth. The hard call is the family, as for VerilogEval: the submissions are HDL code, but
# what is scored is a circuit or a testbench simulated against hidden harnesses (domain_basis, review_checks).
# The board's newest row is dated 2026-07-26 (liveness.leaderboard_last_updated); its repository's last commit,
# 2026-11-07, changed documentation only.

id: cvdp
name: CVDP
aliases:
  - Comprehensive Verilog Design Problems
  - CVDP Benchmark
tagline: 783 hardware design and verification problems in 13 categories, single-turn or agentic,
  scored by hidden test harnesses.
description: >
  A benchmark from NVIDIA for language models and agents on digital hardware design and verification in
  Verilog and SystemVerilog. About 35 hardware engineers wrote 1,313 problems, experts reviewed them,
  and sanity checks (the reference solution must pass and the starting context fail) and an LLM quality
  judge kept 783 in 13 categories. Code generation covers RTL code completion, specification to RTL, code
  modification, composing existing modules, lint and quality-of-results improvement, testbench stimulus
  and checker generation, assertion generation and debugging; comprehension covers matching RTL or testbenches
  to specifications and test plans, and technical questions on RTL and testbenches. 617 problems are non-agentic,
  one prompt holding the whole context, and 166 agentic, a mini-repository in a Docker container where
  the entrant's agent can read and edit files and run tools such as simulators. Each problem ships a reference
  solution and a hidden test harness, usually a CocoTB script over Icarus Verilog, Verilator or Yosys;
  the testbench and assertion categories need Cadence Xcelium, a commercial simulator. Code generation
  is scored by pass@1 estimated from five samples, correspondence by BLEU and question answering by an
  LLM judge (o4-mini in the paper). In the paper (June 2025) Claude 3.7 Sonnet leads non-agentic code
  generation at 33.56% and reaches 29% on agentic, the agentic problems run as single prompts because
  no open hardware design agent then existed. The public Hugging Face release left out 20 problems and
  withholds the code generation reference solutions; v1.0.1 added nine, and v1.1.0 (2026) moved to newer
  open-source tools and added 100 heavy-context agentic problems built on 40 open-source repositories.
  Si2's LLM Benchmarking Coalition keeps the LBC-bench leaderboard on CVDP, which takes results by pull
  request.
self_description:
  source: src-arxiv-2506-14074
  quote: a new dataset and infrastructure to advance LLM and agent research in hardware design and
    verification
external_ids:
  huggingface: nvidia/cvdp-benchmark-dataset
  arxiv: '2506.14074'
paper:
  title: 'Comprehensive Verilog Design Problems: A Next-Generation Benchmark Dataset for Evaluating Large
    Language Models and Agents on RTL Design and Verification'
  arxiv: '2506.14074'
  doi: 10.48550/arXiv.2506.14074
  version_read: v1
  source: src-arxiv-2506-14074-v1
released: 2025-06-17
released_note: The paper's only arXiv version. The Hugging Face dataset was created the next day,
  2025-06-18, with the first public files; the repository was created on 2025-06-10 (GitHub API, not
  a quoted Source).
released_source: src-arxiv-2506-14074
released_quote: '[Submitted on 17 Jun 2025]'
release_venue: null
release_venue_note: The v1 PDF is marked a preprint under review and the abstract page's comments
  line gives only its length; no venue was found in the sources read.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/circuit-eda
  secondary:
    - code/code-understanding
    - agents-tooluse/software-agents
domain_basis:
  reason: >
    Every code generation problem asks for a digital circuit or for the testbench, checker or assertions
    that verify one, in Verilog or SystemVerilog, and the hidden harness simulates (or for code improvement,
    synthesises and lints) the result; designing and verifying electronic circuits is circuit-eda's definition,
    and the paper sets hardware design apart from the software development where LLMs are already used.
    The family excludes software, which is `code`, and `code` excludes code that is the means to a result
    in another field; the boundary is the one VerilogEval's entry logged (taxonomy/_failures/2026-11-18-verilogeval-001.yaml),
    which names CVDP, so it is not logged again. The 123 comprehension problems submit an answer about
    given RTL or testbench code, scored by BLEU or an LLM judge, so no design is submitted; code/code-understanding
    is secondary and is their subset's primary. The agentic format, an agent working a mini-repository
    with EDA tools and judged by the harness, makes agents-tooluse/software-agents secondary, as code's
    exclusion test prescribes for an agentic harness.
  source: src-arxiv-2506-14074-v1
  quote: These categories reflect common subtasks in real-world hardware design and verification
    workflows.
domain_considered_and_rejected:
  - term: code/function-synthesis
    reason: The item is not a self-contained function written from a docstring; each problem is a
      multi-file repository, and what the harness judges is a simulated circuit or testbench, which
      VerilogEval's entry kept as its secondary and this entry does not, because most CVDP tasks
      modify, compose, verify or debug rather than write one unit.
    source: src-arxiv-2506-14074-v1
    quote: represents a multi-file repository extracted at evaluation time.
  - term: code/repository-scale-se
    reason: The paper's problems give oracle contexts, only the files needed, so finding where to
      make the change is not part of the task. v1.1.0's 100 heavy-context problems do work in whole
      open-source repositories, a minority recorded on their subset.
    source: src-arxiv-2506-14074-v1
    quote: For both Non-Agentic and Agentic problems we limited datapoint creation to oracle
      contexts
  - term: code/bug-repair
    reason: Debugging is one category (47 of 783 problems); the defect is in a circuit and the fix
      is judged by simulating it, which circuit-eda's verifying covers.
    source: src-arxiv-2506-14074-v1
    quote: cid16 Design Verification - Debugging / Bug Fixing 36 11
capability: []
capability_note: No capability term names writing a correct design or program to a specification,
  the gap HumanEval's entry logged (taxonomy/_failures/2026-10-10-humaneval-001.yaml, proposed term
  program-synthesis), which VerilogEval's entry cited for the same reason; it is not logged again.
  CVDP adds verification (testbench stimulus and checker generation, assertions), which the paper
  finds hardest and no term captures as scored either.
capability_considered_and_rejected:
  - term: tool-use
    reason: The agentic format lets an agent run simulators, but the harness scores the repository
      the agent leaves, not its tool calls, and the paper ran its agentic problems without tools.
    source: src-arxiv-2506-14074-v1
    quote: Agentic datapoints were converted to Non-Agentic format for evaluation, as no
      open-source, generalpurpose hardware design agent currently exists.
  - term: optimization
    reason: The code improvement category (41 problems) asks for lint fixes or area or latency
      reductions, but each is passed or failed against stated criteria, not ranked by the
      objective's value.
    source: src-arxiv-2506-14074-v1
    quote: RTL Lint Improvement or Power -Performance Optimization
  - term: constraint-satisfaction
    reason: A harness checks the design's behaviour in simulation against the task, not an
      enumerated list of conditions, and the paper claims correctness, not constraint satisfaction.
  - term: knowledge-recall
    reason: The question-answering categories ask about RTL or a testbench given in the prompt, so
      the answer is read from context; the paper adds that they do not challenge current models.
    source: src-arxiv-2506-14074-v1
    quote: The Question & Answer Code Comprehension datapoints do not sufficiently challenge the
      LLMs

evaluation_method:
  - execution-tests
  - reference-metric
  - model-graded-judge
evaluation_method_basis:
  reason: Code generation problems pass or fail by their hidden harness, which simulates the
    submitted RTL or testbench (Icarus Verilog, Verilator, Yosys, or Cadence Xcelium for categories
    12 to 14); correspondence answers (cid06, cid08), expected verbatim, are scored by BLEU against
    the reference; question-and-answer responses (cid09, cid10) are rated by an LLM judge that
    compares them with the reference in the context of the question, o4-mini in the paper.
  source: src-arxiv-2506-14074-v1
  quote: A test harness—typically a CocoTB (CocoTB [2025]) simulation script—assesses correctness
    based on task type.
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: A simulator runs, but on the submitted circuit under a fixed harness; no policy acts
      through episodes, which the term requires.
  - term: constraint-check
    reason: Linting and synthesis checks appear in code improvement harnesses, but the verdict comes
      from the harness running the design, not from validating its structure.
  - term: exact-match
    reason: Correspondence answers are expected verbatim, but scored by BLEU, a graded overlap,
      rather than by exact match.
    source: src-arxiv-2506-14074-v1
    quote: should match a reference verbatim
designed_for_subjects:
  - instruction-tuned-model
  - reasoning-model
  - agent-scaffold
designed_for_subjects_basis:
  reason: The non-agentic format sends one prompt to a model; the paper runs chat models (Claude 3.7
    Sonnet, Claude 3.5 Haiku, GPT-4.1, Llama 3.1) and reasoning models (o1, o4-mini, Claude 3.7
    Sonnet with extended thinking). The agentic format is built for an entrant's Dockerized agent
    working a mini-repository with tools, which the paper names as the benchmark's purpose, although
    it ran those problems single-turn (as_used).
  source: src-arxiv-2506-14074-v1
  quote: Previous benchmarks focus on single-turn prompts and evaluation infrastructure, while CVDP
    is designed to evaluate agents, with support for tool interaction, iterative workflows, and
    complex reasoning.
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: The paper motivates the benchmark by scarce RTL training data but evaluates no
      RTL-specialised model; later papers bring them (RTL-Interact, as_used).
  - term: tool-augmented-model
    reason: The non-agentic format offers no tools, and in the agentic format the entrant supplies
      its own agent image, which is the scaffold.
    source: src-arxiv-2506-14074-v1
    quote: Users populate tool and agent images using provided templates.
  - term: base-model
    reason: Code completion gives skeleton code to finish, but as an instruction to a chat model; no
      base model is evaluated.
  - term: multi-agent-system
    reason: Nothing in the protocol needs more than one agent.
as_used:
  - protocol: Agentic problems run as single-turn prompts. The paper converts every agentic
      datapoint to the non-agentic format for its Table 3, with the oracle context in the prompt and
      no tools.
    split: agentic code generation (166 problems in the paper)
    source: src-arxiv-2506-14074-v1
    quote: Agentic datapoints were converted to Non-Agentic format for evaluation, as no
      open-source, generalpurpose hardware design agent currently exists.
    note: The harness converts either way (--force-copilot, --force-agentic), so a number on an
      agentic file is comparable only with others run the same way.
  - protocol: LBC-bench's limited-context board pools the non-agentic and agentic code generation
      files in one pass rate, and Si2's guidance is to score the agentic files single-turn through
      the harness's --force-copilot conversion; one row runs Claude Code as the agent.
    split: code-generation-limited-context (four files, 489 non-agentic and 160 agentic problems in
      v1.1.0)
    source: src-github-lbc-bench-leaderboards-0ac27bb
    quote: agentic_code_generation_no_commercial evaluated non-agentically via --force-copilot per
      Si2 guidance
    note: The row notes say so for the 2026-07-26 rows; earlier rows do not state how the agentic
      files were run.
  - protocol: Trained RTL models on the 302 no-commercial non-agentic code generation problems (five
      categories), allowed to call EDA tools while answering (up to six calls per trajectory, ten
      for optimisation tasks), scored by pass@1 and pass@5 from five samples at temperature 0.7 and
      top-p 0.95, averaged weighted by category size.
    split: non-agentic code generation, no-commercial file (302 problems)
    source: src-arxiv-2610-41225-v1
    quote: temperature 0.7, and top-p 0.95. CVDP averages are weighted by category sizes (94, 78,
      55, 40, 35), totaling 302.
    note: RTL-Interact (arXiv 2610.41225, October 2026). Tool calls inside a non-agentic problem are
      the paper's protocol, not CVDP's single-turn format.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced. An October 2026 paper reports trained RTL models on CVDP, the
    LBC-bench board has rows dated to July 2026 on release 1.1.0, and an arXiv search on 2026-11-18
    returned about twenty 2025 and 2026 papers whose abstracts report work on CVDP (not cited).
  source: src-arxiv-2610-41225-v1
  quote: On CVDP, RTL-Interact-32B achieves 48.7% weighted Pass@1 and 68.9% Pass@5
activity: accepting-submissions
activity_basis:
  reason: The LBC-bench board, run by Si2 and pointed to by the CVDP README, takes results at any
    time by a pull request against its data file; it has never run in rounds.
  source: src-github-lbc-bench-contributor-0ac27bb
  quote: This guide explains how to add or update benchmark results on the LBC leaderboard by
    editing `data/leaderboards.json` and opening a pull request.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude 3.7 Sonnet, non-agentic code generation
    source: src-arxiv-2506-14074-v1
    observed_on: 2026-11-18
    quote: The highest aggregate pass@1 rate observed was 34% (Claude 3.7 Sonnet)
  - system: RTL-Interact-32B, no-commercial non-agentic code generation
    source: src-arxiv-2610-41225-v1
    observed_on: 2026-11-18
    quote: On CVDP, RTL-Interact-32B achieves 48.7% weighted Pass@1 and 68.9% Pass@5
  - system: Claude Opus 4.8 in Claude Code, heavy-context agentic code generation
    source: src-github-lbc-bench-leaderboards-0ac27bb
    observed_on: 2026-11-18
    quote: '"name": "Claude Opus 4.8 (Claude Code, xhigh)"'
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: Each code generation problem's harness, usually a CocoTB test run on the
  submitted files in a Docker image; the harness files ship in the dataset. The comprehension
  problems are scored against a reference answer instead (BLEU, or an LLM judge).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The problems, contexts and harnesses are public and the open-source simulation image
    builds from the repository. The testbench and assertion categories (and the commercial files)
    need a Cadence Xcelium licence and a licence network, which a third party can obtain but the
    benchmark does not supply, and the code generation reference solutions are withheld, so the
    golden self-check runs only on the repository's example files.
  source: src-github-cvdp-readme-8e894cf
  quote: 'NOTE: Requires commercial EDA tools (Cadence Xcelium), license network, and VERIF_EDA_IMAGE
    setup'
task:
  exists: true
  input:
    - 'non-agentic: one prompt holding the task and its whole context (a specification, RTL, a testbench
      or a test plan, as the category needs), answered in one turn'
    - "agentic: a prompt and a mini-repository in a Docker container, where the entrant's agent can read,
      edit and run tools such as simulators"
  output: The files the task asks for (RTL modules, testbenches, checkers, assertions, modified,
    improved or fixed RTL), or for comprehension a code snippet or a text answer.
  scoring: A hidden harness passes or fails each code generation problem, reported as pass@1
    estimated from n = 5 samples; correspondence answers are scored by BLEU against the reference
    and question-and-answer responses by an LLM judge that compares them with the reference (o4-mini
    in the paper).
  tests_hidden_from_system: true
  tests_hidden_from_system_note: Hidden from the model or agent during a run; the harness files are
    public in the dataset.
  reference_solution: true
  item_definition: A datapoint, a multi-file repository extracted at evaluation time, with its
    category, difficulty label, prompt, context, harness and reference solution; non-agentic
    problems are easy or medium, agentic ones span easy to hard.
  source: src-arxiv-2506-14074-v1
  quote: Models or agents may generate or use a testbench but never see the test harness or
    reference solution.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The Hugging Face dataset is ungated and holds every public problem with its context and
      harness, so anyone can compute the pass rates. The code generation reference solutions are
      withheld against contamination, which scoring does not need, and 11 of the paper's 783
      problems are still unpublished (review_checks). Running the testbench and assertion categories
      needs a commercial simulator licence, which gates running them, not reading them.
    source: src-hf-api-cvdp
    quote: '"gated":false'
  records_access: fully-open
  records_licence: CC-BY-NC-4.0
  records_licence_note: The LBC-bench board's repository, which holds every row and links its logs,
    is under Creative Commons Attribution-NonCommercial 4.0 (its LICENSE, read 2026-11-18).
  refresh: versioned-releases
  refresh_note: Versioned files sit side by side on Hugging Face (v1.0.2, v1.0.3, v1.0.4, v1.1.0);
    the v1.0 files were deleted from main on 2025-07-22 and stay in the history. The LBC-bench rows
    name the release they ran (1.0.2 or 1.1.0).
  refresh_basis:
    reason: The maintainers release corrected and extended versions with a changelog, and the paper
      plans further versions as errors are found and as the task set grows.
    source: src-arxiv-2506-14074-v1
    quote: may cap maximum achievable scores, and updated benchmark versions will be released as
      needed.
  data_provenance:
    - expert-authored
  data_provenance_note: About 35 hardware engineers with more than four years of Verilog and
    verification experience wrote the problems, which subject-matter experts with doctorates in
    hardware design or engineering-management experience reviewed; the paper thanks Turing for its
    collaboration in developing the dataset. LLM judging filtered problems but wrote none. NOTICE
    lists 15 datapoint families derived from open-source code, and v1.1.0's heavy-context problems
    are built on 40 open-source repositories, whose code is harvested rather than written for the
    benchmark (review_checks).
  data_provenance_source: src-arxiv-2506-14074-v1
  data_provenance_quote: engaged a team of approximately 35 hardware engineers with more than 4
    years of Verilog and verification experience to author problems across 13 task categories and
    difficulty levels
  contamination_risk: medium
  contamination_risk_note: >
    Every public problem, with its context and harness, has been public since June 2025, and the harnesses
    encode the expected behaviour; the comprehension reference answers ship in the public file (seen in
    the v1.1.0 file, not a quoted Source). The code generation reference solutions are withheld, which
    the maintainers state as a contamination measure. Some datapoints derive from open-source code, and
    the 100 heavy-context problems are built on 40 public repositories, with bugs placed by hand, whose
    upstream commits the dataset records, so the code they ask for may already be in training corpora.
    No source
    read measures contamination; a reviewer may judge the heavy-context subset high.
  contamination_evidence:
    - source: src-github-cvdp-readme-8e894cf
      stance: against
      quote: we excluded the reference solutions—'output' for non-agentic and 'patch' for
        agentic—from the initial dataset release to help mitigate data contamination.
  ceiling_anchor_type: measured-ceiling
  ceiling_anchor_type_note: Others cannot repeat the check on the public files, which lack the code
    generation reference solutions; a mutation audit of the harnesses is impossible for the same
    reason.
  ceiling_anchor_type_basis:
    reason: Before release every problem was run with its reference solution, which had to pass, and
      with its starting context, which had to fail, so a full pass rate is shown to be reachable on
      code generation. The comprehension scores (BLEU, judge ratings) have no measured ceiling.
    source: src-arxiv-2506-14074-v1
    quote: Sanity checks ensured all reference solutions passed and incomplete contexts failed as
      expected.
  dataset_licence: CC-BY-4.0 AND Apache-2.0
  dataset_licence_note: CC BY 4.0 for the dataset's non-code content and the Apache License 2.0 for
    its original code; third-party derived datapoints and the heavy-context repository bundles keep
    their upstream terms (upstream_licences). Hugging Face's licence tag reads other.
  dataset_licence_basis:
    reason: The dataset's LICENSE gives the two licences by content type and defers third-party code
      to NOTICE.
    source: src-hf-cvdp-license-5b807d9
    quote: Third-party code-derived datapoints and public Git context bundles may be governed by
      additional or different open-source license terms from their upstream source repositories.
  upstream_licences: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSD-3-Clause-Clear and SHL-0.51
    for the derived datapoints and the 40 heavy-context bundles, two derived datapoints with no
    licence specified
  upstream_licences_source: src-hf-cvdp-notice-5b807d9
  upstream_licences_quote: This dataset incorporates derivative code of various open-source
    repositories along with original code.
  size:
    - count: 783
      unit: problems
      source: src-arxiv-2506-14074-v1
      quote: CVDP comprises 783 human expert-authored problems across 13 hardware design and
        verification task categories.
    - count: 617
      unit: problems
      subset: non-agentic (paper)
      source: src-arxiv-2506-14074-v1
      quote: 'Total # of Problems 617 166'
    - count: 166
      unit: problems
      subset: agentic (paper)
      source: src-arxiv-2506-14074-v1
      quote: 'Total # of Problems 617 166'
    - count: 1313
      unit: problems written before quality filtering
      source: src-arxiv-2506-14074-v1
      quote: Of the 1,313 problems written, 783 were retained after quality filtering
    - count: 302
      unit: problems
      subset: non-agentic code generation, no-commercial file (v1.1.0)
      source: src-hf-datasets-server-cvdp-size
      quote: '"config":"cvdp_nonagentic_code_generation_no_commercial","num_bytes_original_files":null,"num_bytes_parquet_files":4870040,"num_bytes_memory":4867959,"num_rows":302'
    - count: 187
      unit: problems
      subset: non-agentic code generation, commercial file (v1.1.0)
      source: src-hf-datasets-server-cvdp-size
      quote: '"config":"cvdp_nonagentic_code_generation_commercial","num_bytes_original_files":null,"num_bytes_parquet_files":2369696,"num_bytes_memory":3497759,"num_rows":187'
    - count: 92
      unit: problems
      subset: agentic code generation, no-commercial file (v1.1.0)
      source: src-hf-datasets-server-cvdp-size
      quote: '"config":"cvdp_agentic_code_generation_no_commercial","num_bytes_original_files":null,"num_bytes_parquet_files":966714,"num_bytes_memory":3517537,"num_rows":92'
    - count: 68
      unit: problems
      subset: agentic code generation, commercial file (v1.1.0)
      source: src-hf-datasets-server-cvdp-size
      quote: '"config":"cvdp_agentic_code_generation_commercial","num_bytes_original_files":null,"num_bytes_parquet_files":617312,"num_bytes_memory":2158693,"num_rows":68'
    - count: 123
      unit: problems
      subset: non-agentic code comprehension (v1.1.0)

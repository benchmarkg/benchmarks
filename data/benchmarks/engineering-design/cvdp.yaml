      source: src-hf-cvdp-heavy-readme-5b807d9
      quote: 'Rows supported: 100 Repositories: 40'
  size_note: The public v1.1.0 files hold 772 of the paper's 783 problems (489 non-agentic code
    generation, 160 agentic, 123 comprehension) plus the 100 heavy-context problems; v1.0.0 held 763
    (row counts of the files, not quoted).
  languages:
    - Verilog
    - SystemVerilog
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: NVIDIA (NVlabs)
  maintainer_basis:
    reason: All eight of the paper's authors list NVIDIA, the repository sits in NVIDIA Research's
      NVlabs organisation and the dataset in Hugging Face's nvidia organisation, and the licence
      notice names NVIDIA Corporation. The results board is Si2's (submission_process).
    source: src-github-cvdp-license-8e894cf
    quote: Copyright 2025 NVIDIA Corporation
  maintainer_type: industry-lab
  submission_process:
    - maintainer-verified
    - maintainer-run
  submission_process_note: The channel is LBC-bench, run by Si2 (the Silicon Integration Initiative)
    for its LLM Benchmarking Coalition, which the CVDP README presents as maintaining the
    leaderboard. Si2 ran the first 20 rows itself and marks them verified; outside results arrive as
    pull requests that Si2 reviews before merging, with logs uploaded for Si2 to publish, and stay
    unverified until Si2 checks them. Papers also report results of their own, as RTL-Interact does.
  submission_process_basis:
    reason: A stated review of each submitted result before it is published, beside Si2's own
      verified runs.
    source: src-github-lbc-bench-contributor-0ac27bb
    quote: PRs are reviewed by Si2
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-github-lbc-bench-leaderboards-0ac27bb
      quote: '"name": "NemoTron Ultra v3 xhigh", "logo": [ "./img/nvidia-logo.png" ], "site": "https://nvidia.com"'
  independence_flags_note: >
    The board lists NVIDIA's own model, tagged "Org: NVIDIA", in a row run from nvidia.com, in both the
    limited-context and the comprehension boards; NVIDIA, the maintainer by the paper's affiliations and
    the licence notice, also ran six rows for other developers' models. The paper evaluates no NVIDIA
    model. Cadence, which lent the EDA licences, and Turing, which helped build the dataset, have no entry
    on the board. The membership of Si2's coalition was read on its page (not recorded) and not assessed.
  independence_assessed: true
  funding:
    source: src-arxiv-2506-14074-v1
    quote: grateful to Cadence for providing EDA tool licenses, which enabled the collection of
      digital verification datapoints.
  funding_note: In-kind tool licences from Cadence, whose simulator the verification harnesses use;
    Cadence has no system evaluated, so funded-by-evaluated-party does not apply.
  known_limitation:
    source: src-arxiv-2506-14074-v1
    quote: The Question & Answer Code Comprehension datapoints do not sufficiently challenge the
      LLMs

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: Every harness runs in Docker; the open-source simulation image is built once
    from the repository, the verification categories need an image with Cadence Xcelium and a
    licence network, and agentic runs need the entrant's agent image. Model inference is API spend
    or local serving. The paper's runs used a 12-vCPU, 24 GB virtual machine, with 6.4 to 15 GB of
    disk per model.
  compute_tier_source: src-github-cvdp-readme-8e894cf
  compute_tier_quote: docker build -f docker/Dockerfile.sim -t nvidia/cvdp-sim:v1.0.0 .
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: A run is automatic end to end, but every code generation verdict comes from simulating
      the submission in a pinned tool image, whose versions changed in v1.1.0.
    source: src-github-cvdp-readme-8e894cf
    quote: The build includes cocotb 2.0.1, pytest 8.3.2, Icarus Verilog v13_0, Yosys yosys-0.40,
      and Verilator v5.038.
  reproducibility_blockers: []
  reproducibility_blockers_note: The testbench, checker and assertion categories (and a few others
    in the commercial files) run only with a Cadence Xcelium licence, which can be bought; whether
    that is a licence-restriction blocker is left to a specialist (review_checks).
  harness_availability: official-harness
  harness: cvdp_benchmark at 8e894cf, run_benchmark.py for one run and run_samples.py for n samples
    and pass@k, with the open-source simulation image (nvidia/cvdp-sim), a Cadence verification
    image for categories 12 to 14, entrant agent images for the agentic files, --force-copilot and
    --force-agentic to convert formats, and an LLM subjective scorer for comprehension
  harness_source: src-github-cvdp-readme-8e894cf
  harness_quote: Run 5 samples for statistical reliability with Pass@1
  harness_gotcha:
    source: src-github-cvdp-readme-full-8e894cf
    quote: Pass@k = 1 - (1 - c/n)^k
  harness_gotcha_note: For k above 1 the harness reports 1 - (1 - c/n)^k, sampling with replacement,
    not the unbiased estimator; the two agree at k = 1 but not for the pass@5 that papers such as
    RTL-Interact report. The comprehension scorer calls an LLM through an OpenAI key, and its judge
    model is a setting; the paper used o4-mini, and nine LBC-bench comprehension rows of April and
    May 2026 name Gemini 3.1 Pro Preview. The README calls that scoring BLEU/ROUGE plus subjective
    scoring, the paper BLEU and an LLM judge. The format converters can also expose the reference
    solution or the harness to an agent (--force-agentic-include-golden,
    --force-agentic-include-harness).
  code_licence: Apache-2.0
  code_licence_source: src-github-cvdp-license-8e894cf
  code_licence_quote: Apache License Version 2.0, January 2004
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The agentic profile (execution-tests x agent-scaffold) carries the scaffold, harness, tools, sandbox,
  # n_samples and subset; the model-graded profile (model-graded-judge x instruction-tuned-model) carries the
  # judge model, version and prompt, which matter for cid09-10 (o4-mini in the paper, Gemini 3.1 Pro Preview on
  # LBC-bench rows). Beyond those: the simulator (the open-source image alone, which LBC-bench reports as
  # resolved_oss, or with Xcelium, resolved_full) and its version (Icarus Verilog v13_0 and cocotb 2.0.1 from
  # v1.1.0); k, since the harness's pass@k is not the unbiased estimator; sampling (the paper ran Llama at
  # T = 0.2 and top-p 0.7 and the other models at API defaults; RTL-Interact at 0.7 and 0.95); and max_steps,
  # the tool-call or turn budget where a model or agent calls tools. Whether the agentic files were run
  # single-turn (--force-copilot) or by an agent is subset_used plus scaffold; the release (1.0.2 or 1.1.0) is
  # the version. The paper's own numbers rose about 3 and 1.5 points after its quality filtering, so pre-filter
  # numbers are not comparable either.
  material_extra:
    - simulator
    - simulator_version
    - k
    - sampling
    - max_steps

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper reports an overall pass@1 for non-agentic code generation (Table 2), another for
    agentic code generation (Table 3) and an average rating for comprehension (Table 4), each beside
    its per-category columns; nothing combines the three. LBC-bench reports each of its three boards
    as problems passed over problems attempted across the files it includes, with and without the
    commercial-tool files.
  source: src-arxiv-2506-14074-v1
  quote: Model Overall cid02 cid03 cid04 cid07 cid12 cid13 cid14 cid16 Claude 3.7 Sonnet 33.56%
headline_metric: null
headline_metric_note: The headline is pass@1 per format, with BLEU and judge ratings for
  comprehension; no Metric record exists for it and this task did not write one.
secondary_axes:
  - cost
secondary_axes_basis:
  reason: LBC-bench rows carry a cost column beside the pass rates.
  source: src-github-lbc-bench-contributor-0ac27bb
  quote: Average cost per test in USD


    label: 'ISPD 2024: GPU/ML-Enhanced Large Scale Global Routing'
    version_kind: edition
    changes: Global routing of industrial-scale designs (up to about 50 million cells) given as a
      simplified grid graph, aimed at GPU- and ML-enhanced routers; scored on wirelength, vias,
      overflow and runtime on hidden testcases, run from each team's Docker image on four A100 GPUs,
      in a Main and a Special Honor track. Winners Hippo (Peking University), RL-Route (The Chinese
      University of Hong Kong) and metaRoute (Fudan University, Fuzhou University and Shanghai
      LEDA); hidden testcases released on 2024-03-26. Sponsored by NVIDIA.

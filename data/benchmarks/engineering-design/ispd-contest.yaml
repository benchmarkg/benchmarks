    version_kind: edition
    changes: Global routing again, now performance-driven. Winners Hippo (Peking University),
      RL-Route (The Chinese University of Hong Kong, the Hong Kong University of Science and
      Technology and Hong Kong Baptist University) and It's MyRoute!!!!! (Fudan University, Wuhan
      University and the University of California San Diego). The contest description was not read.
    breaking: true
    frozen: true
    sources:
      - src-ispd-contest-2025
      - src-ispd-previous-contests
  - version: '2026'
    label: 'ISPD 2026: Post-Placement Buffering and Sizing'
    version_kind: edition
    released: 2025-10-01
    items: 12
    changes: >
      Repeater insertion and gate sizing after detailed placement, in ASAP7 with fixed macros, I/Os, power
      grid, blockages and routing supply; single-mode setup timing with ideal clocks. Eight public and
      four hidden testcases (from about 15 thousand to over a million instances), all in the total score,
      run by the organisers in their Apptainer image on one A100. Registration from 2025-10-01, final
      submissions by 2026-03-07, results on 2026-03-18. 13 final submissions, one later withdrawn; winners
      IRISLab (National Taiwan University, National Taiwan University of Science and Technology), PTSD
      and HLFC (both National Tsing Hua University). Organised by UCSD, Fudan University and POSTECH;
      prizes from NVIDIA.
    breaking: true
    superseded_by: '2027'
    frozen: true
    sources:
      - src-github-ispd26-contest-readme
      - src-github-ispd26-contest-description
      - src-ispd-contest-2026
      - src-ispd-previous-contests
  - version: '2027'
    label: 'ISPD 2027: MCMM Post-CTS Buffering and Sizing'
    version_kind: edition
    released: 2026-10-05
    items: 14
    changes: >
      Builds on ISPD 2026: optimisation moves after clock-tree synthesis, with propagated clocks, and
      timing is checked across multiple corners and modes (three functional corners, and three scan-test
      scenes for scan testcases), with hold as a penalty and equivalent-pin swapping allowed. Six public
      testcases (released on 2026-10-05 and 2026-11-07) for development and eight hidden ones that alone
      rank the teams. Final submissions are due on 2027-03-20 and results on 2027-03-31; the score weights
      are set after the alpha round. Organised at UCSD; prizes from NVIDIA.
    breaking: true
    supersedes_version: '2026'
    frozen: false
    sources:
      - src-github-ispd27-contest-readme
      - src-github-ispd27-contest-description
      - src-github-ispd27-contest-benchmarks-readme
      - src-github-ispd27-contest-evaluator-readme
      - src-ispd-previous-contests
versions_note: >
  Every edition from 2005 to 2026 is on the Previous Contests page; the 2005, 2024, 2025, 2026 and 2027
  editions were read further, and the other seventeen carry only their titles. Supersession is recorded
  only where a source states it (2027 builds on 2026); editions that repeat a problem (2007-2008, 2012-2013,
  2018-2019, 2022-2023, 2024-2025) are not linked because their pages were not read, and editions with
  different problems do not supersede each other.


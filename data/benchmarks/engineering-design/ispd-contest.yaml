# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T04)
  added_on: 2026-11-18
  last_verified: 2026-11-18
  verification_status: ai-drafted-unverified
  sources:
    - src-ispd-previous-contests
    - src-ispd-contest-2026
    - src-ispd-contest-2025
    - src-ispd-contest-2024
    - src-ispd-contest-2005
    - src-github-ispd27-contest-readme
    - src-github-ispd27-contest-description
    - src-github-ispd27-contest-benchmarks-readme
    - src-github-ispd27-contest-evaluator-readme
    - src-github-ispd27-contest-license
    - src-github-ispd26-contest-readme
    - src-github-ispd26-contest-description
    - src-github-ispd24-contest-index
    - src-arxiv-2607-19768
    - src-arxiv-2511-17665
    - src-arxiv-2610-06316
  sources_note: >
    Five ispd.cc pages read with scripts and styles stripped, five files of ABKGroup/ISPD27-Contest at
    commit 39a13eb, two of ABKGroup/ISPD26-Contest at commit f7b29d2 (the PDFs as pdftotext output), the
    ISPD24 contest page source at commit f3a8a0d, and three arXiv abstract pages (DOI sources, not archived).
    The winners pages, the 2005 page, both READMEs, both description PDFs and the ISPD24 page source name
    people or carry personal e-mail addresses, so they are withheld from archiving; the Previous Contests
    page, the 2027 benchmark and evaluator READMEs and the LICENSE are pending. GitHub's API records for
    both contest repositories were read and are not quoted Sources.
  confidence: medium
  review_checks:
    - check: >
        Identity and the counting convention. One family with 23 editions as versions, following CHiME
        and DCASE: one name, one symposium and a continuing effort. But 04 S4's edition test is "same
        task definition, new items, new year", and the problem changes most years, so it holds only for
        runs (2024-2025 global routing, 2026-2027 buffering and sizing). Two alternatives: an entry per
        edition, since papers cite an edition's testcases on their own for decades (the ISPD 2005 placement
        suite is still a standard in 2026), which 04 S4's "independently versioned and cited" test for
        a new benchmark reads on; or an entry per problem line (placement, global routing, detailed routing,
        clock networks, sizing, security closure). Either needs ids from the lead (04 S3).
      field: versions
      source: src-ispd-previous-contests
      quote: 'ISPD 2026: Post-Placement Buffering and Sizing'
    - check: >
        Admissibility (00 S6 A5) rests on two papers that ran learned systems on released testcases after
        their contests: AlphaRoute (language models tuning a router) on ISPD 2025 and GANGR (WGAN batching)
        on ISPD 2024. No source read shows a learned system among a contest's own entrants: the registration
        lists give team names only, ISPD 2026's final leaderboard identifies teams by number, and the
        2024 Drive slides and the contest papers were not read. ISPD 2024 set out to stimulate ML-enhanced
        routers, and ISPD 2026 and 2027 invite ML infrastructure.
      field: learned_entrant_evidence
      source: src-github-ispd27-contest-description
      quote: contestants may (but are not required to) leverage GPU-accelerated solutions or modern
        ML infrastructure such as PyTorch [3]
    - check: >
        Seventeen editions (2006 to 2023) are modelled from the Previous Contests page's titles alone;
        their pages, testcase counts, scoring and winners were not read, nor were the contest papers in
        the ISPD proceedings or the 2025 description. The ISPD 2021 title, "Wafer-Scale Physics Modeling
        Contest", may not be a circuit-design problem at all; if not, that edition sits outside circuit-eda.
      field: versions
      source: src-ispd-previous-contests
      quote: 'ISPD 2021: Wafer-Scale Physics Modeling Contest'
    - check: >
        activity accepting-submissions: the 2027 round has opened (registration and public testcases out),
        but registration closes on 2026-12-05 and the first submission is the alpha on 2027-01-11. round-scheduled
        is the other reading if the round counts as open only once submissions are taken.
      field: activity
      source: src-github-ispd27-contest-readme
      quote: 'Results Announcement: March 31, 2027'
    - check: >
        The current scoring is not final: the 2027 weights are placeholders until the alpha round, the
        description says the metric may change, and the flow-runtime limit is still to be set. The task's
        scoring line and the 2027 version (frozen false) should be re-read after 2027-01-11.
      field: task.scoring
      source: src-github-ispd27-contest-evaluator-readme
      quote: Current scores use dummy weights. Final weights will be announced after the Alpha
        submission.
    - check: >
        Independence. NVIDIA sponsors the prizes (2024, 2026, 2027), ISPD 2024's evaluation ran on an
        NVIDIA platform, and a team from NVIDIA registered for ISPD 2026; whether it submitted is not
        shown. The 2024 and 2025 contest pages sit in a personal GitHub account and do not name their
        organisers' institution, so whether an organising institution also competed in those editions
        (or whether NVIDIA organised them) was not assessed. maintainer-competes-on-own-benchmark and
        funded-by-evaluated-party are unset.
      field: governance.independence_flags
      source: src-github-ispd26-contest-readme
      quote: nvBuffplace | NVIDIA|
    - check: >
        evaluation_method domain-metric with constraint-check. composite is rejected because the sub-scores
        all come from one evaluation flow (timing, power, ERC, overflow and displacement, plus the flow's
        runtime); a reviewer who counts runtime as a different method would add composite. entrant-relative-ranking
        is rejected though a failing design is valued at 1% worse than the worst team.
      field: evaluation_method
      source: src-github-ispd27-contest-description
      quote: All design-quality metrics are normalized against the corresponding metrics of the
        baseline.
    - check: >
        data.access fully-open is a finished edition's state (ISPD 2026's hidden testcases are on its
        page); ISPD 2027 is private-test-server until it concludes. ISPD 2026 also ranked on its public
        testcases, which its organisers called a weakness after a withdrawn submission.
      field: data.access
      source: src-github-ispd26-contest-readme
      quote: we will use more rigorous evaluations (e.g., only on hidden testcases)
    - check: >
        reproducibility_tier automatable-with-simulator with specific-simulator-build, and data_provenance
        simulation-generated, both treat the OpenROAD flow (routing, extraction, static timing) as the
        simulator, as circuitnet treats its EDA tools. If an EDA flow is not a simulator in these terms'
        sense, the tier is fully-automatable and the provenance needs a term for tool-generated design
        data.
      field: execution.reproducibility_tier
    - check: >
        designed_for_subjects domain-specialist-model rests on the ISPD 2024 contest's stated aim and
        on ML being invited in 2026 and 2027; classical-algorithm alone is the reading if the contest
        is taken as designed for heuristic tools, which the winners' team names and the 2026 rules (rank
        only teams that implement their own methods) neither confirm nor rule out.
      field: designed_for_subjects
      source: src-github-ispd24-contest-index
      quote: The goal of this competition is to stimulate academic research aimed at developing a
        GPU/ML-enhanced global router tailored for industrial-level circuits.
  not_yet_available:
    - what: the ISPD 2027 score weights and runtime limits
      expected: after the alpha submission deadline, 2027-01-11
      consequence: task.scoring and the 2027 version describe the scoring framework, not final
        weights.
    - what: the ISPD 2027 results and hidden testcases
      expected: 2027-03-31, at the symposium
      consequence: The 2027 version has no winners or published hidden testcases, and data.access
        during the edition is private-test-server.
  personal_data_excluded:
    - source: src-ispd-contest-2026
      what: the names of the three winning teams' members
    - source: src-ispd-contest-2025
      what: the names of the three winning teams' members
    - source: src-ispd-contest-2024
      what: the names of the three winning teams' members
    - source: src-ispd-contest-2005
      what: the organiser's personal e-mail address and the name of a contact at the proceedings
        printer
    - source: src-github-ispd27-contest-readme
      what: the contest lead's name and personal e-mail address, the organisers' and adviser's
        names, and the contest mailbox
    - source: src-github-ispd27-contest-description
      what: the contest lead's name and personal e-mail address, the organisers' and adviser's
        names, and the references' author lists
    - source: src-github-ispd26-contest-readme
      what: the co-chairs' names and personal e-mail addresses, the organisers' names, and a
        registered team named after a person
    - source: src-github-ispd26-contest-description
      what: the co-chairs' names and personal e-mail addresses, the organisers' names, and the
        references' author lists
    - source: src-github-ispd24-contest-index
      what: registered teams named after people and the contest mailbox; the repository is held
        under a personal account
    - source: src-arxiv-2607-19768
      what: the author list and the submitter line
    - source: src-arxiv-2511-17665
      what: the author list and the submitter line
    - source: src-arxiv-2610-06316
      what: the author list and the submitter line

# data/benchmarks/engineering-design/ispd-contest.yaml
#
# P1-S8-T04, engineering-design entry 12. Filled from the International Symposium on Physical Design's own pages on
# ispd.cc (robots.txt sets a 20-second crawl delay and disallows nothing; requests were spaced accordingly): the
# Previous Contests page of the ISPD 2027 site, which lists every edition from 2005 to 2026, and the contest pages of
# ISPD 2026, 2025, 2024 and 2005, with scripts and styles stripped. From the ISPD 2027 contest repository
# (ABKGroup/ISPD27-Contest at commit 39a13eb, 2026-11-14): the README, the contest description PDF, the benchmark and
# evaluator READMEs and the LICENSE. From the ISPD 2026 repository (ABKGroup/ISPD26-Contest at commit f7b29d2,
# 2026-05-03): the README, with the final leaderboard, and the description PDF. The ISPD 2024 contest page source
# (index.md at commit f3a8a0d), which sits under a personal GitHub account. Three arXiv abstract pages for current use
# and learned entrants: AlphaRoute (2607.19768, on the ISPD 2025 benchmarks), GANGR (2511.17665, on ISPD 2024) and
# RollPlace (2610.06316, on ISPD 2005). Not read: the contest pages of 2006 to 2023, the 2025 contest repository, the
# contest papers in the ISPD proceedings (the Phase-0 survey met 403 at the ACM Digital Library), score.py and the
# scoring configuration, and the benchmark archives themselves. Nothing was registered for. The winners pages name
# every team member; only team and institution names are quoted. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.
#
# Identity (04 S3-S4): one family, the ISPD Contest, with each year's contest as a version of kind edition, as CHiME
# and DCASE model challenge series whose task changes between editions. The contest poses a different problem most
# years (placement, global and detailed routing, clock-network synthesis, gate sizing, FPGA placement, wafer-scale
# placement, security closure, buffering and sizing), so 04 S4's edition test ("same task definition, new items, new
# year") holds only for runs of years; the call and its alternatives are the first review check. No Epoch stub exists.

id: ispd-contest
name: ISPD Contest
aliases:
  - ISPD contest
  - International Symposium on Physical Design contest
  - ISPD26 Contest
  - ISPD2027 Contest
  - ISPD 2005 benchmark
aliases_note: >
  Each edition is named for its year and problem (ISPD26 Contest: Post-Placement Buffering and Sizing;
  ISPD2027 Contest: MCMM Post-CTS Buffering and Sizing). Papers cite a past edition's released testcases
  by the contest's year, as "the ISPD 2005 benchmark" or "the ISPD'24 contest benchmarks", which are this
  family's editions, not other benchmarks.
tagline: "The physical-design symposium's yearly contest: a new chip-layout problem each year, scored
  on hidden testcases."
description: >
  The annual contest of the International Symposium on Physical Design (ISPD), held since 2005. Each year
  an organising team sets one physical-design problem for integrated circuits, releases public testcases
  and an evaluator, and ranks the submitted tools on testcases held back until the end. The problems have
  been placement (2005, 2006, 2011, 2014, 2015), global routing (2007, 2008, 2024, 2025), clock-network
  synthesis (2009, 2010), discrete gate sizing (2012, 2013), FPGA placement (2016, 2017), initial detailed
  routing (2018, 2019), wafer-scale accelerator placement and physics modelling (2020, 2021), security
  closure of layouts (2022, 2023) and buffering and sizing (2026, 2027). Entrants submit a tool, not a
  result: the organisers run it in a fixed environment on the testcases. In ISPD 2026 and 2027 the tool
  takes a legal placement and netlist in the open ASAP7 library, inserts, removes or resizes buffers,
  inverters and gates, and must return a legal, logically equivalent design; the OpenROAD-based evaluator
  routes it and scores post-routing setup timing (TNS, and from 2027 WNS) and power against the unoptimised
  input, less penalties for hold and electrical-rule violations, runtime, cell displacement and routing
  overflow. ISPD 2026 had 8 public and 4 hidden testcases and 13 final submissions; ISPD 2027 moves to
  post-clock-tree designs under multi-corner, multi-mode timing and ranks only on its 8 hidden testcases,
  with results on 31 March 2027. Past editions' testcases remain standard suites for papers on learned
  and classical placers and routers.
self_description:
  source: src-github-ispd27-contest-description
  quote: This contest is built on top of the OpenROAD [2] infrastructure and provides a controlled,
    open-source environment for benchmarking and evaluation.
paper: null
paper_note: >
  The series has no overview paper of its own. Each edition is described by an invited contest paper in
  the ISPD proceedings (the ISPD 2027 description cites the 2026 one as "Invited: Post-Placement Buffering
  and Sizing Contest", Proc. ISPD 2026); none was read (review_checks).
released: 2005-03-20
released_note: The first edition's six contest benchmarks were posted on 2005-03-20, for a contest
  run from 20 to 25 March 2005; two sample benchmarks had been mailed to the registered teams on
  2005-01-12. ISPD 2005 is the first edition on the Previous Contests page.
released_source: src-ispd-contest-2005
released_quote: '03/20/2005: Six contest benchmarks are posted.'
release_venue: ISPD 2005 (International Symposium on Physical Design)
release_venue_source: src-ispd-previous-contests
release_venue_quote: 'ISPD 2005: Placement'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/circuit-eda
domain_basis:
  reason: >
    What is scored is a circuit design: in ISPD 2026 and 2027 a placed netlist after buffering and sizing,
    in earlier editions a placement, a routing solution or a clock network, each judged on timing, power,
    wirelength, congestion and legality. Placing, routing and sizing electronic circuits is circuit-eda's
    definition, and the family's inclusion test (a circuit judged against engineering criteria).
  source: src-github-ispd27-contest-description
  quote: Contestants must output the modified .v and .def.
domain_considered_and_rejected:
  - term: code/competitive-programming
    reason: >
      Entrants submit a program, and contests ranked on an objective of the programs' outputs sit there
      (ALE-Bench). But the code family's exclusion sends code that is "the means to a result in another
      field" elsewhere: the score is the timing, power and legality of the chip design the tool produces,
      as Learn2Design's submitted optimisers are scored by the detector they find.
  - term: mathematics/applied-modeling
    reason: The ISPD 2024 page offers the routing problem in a simplified graph format so that teams
      can treat it as a mathematical optimisation, but the problem arrives already formulated;
      nothing scores the formulation.

capability:
  - optimization
capability_basis:
  optimization:
    reason: Every edition states an objective and ranks tools by how well their designs meet it;
      ISPD 2027 scores normalised improvement over the unoptimised design, setup TNS first, with no
      known optimum.
    source: src-github-ispd27-contest-description
    quote: Setup TNS improvement will remain the primary scoring objective.
capability_considered_and_rejected:
  - term: constraint-satisfaction
    reason: Legality, logical equivalence and clock-tree integrity are checked, but a failing design
      is not simply wrong; its metrics are set just below the worst team's and it is still ranked on
      them. The score is graded by the objective, not by whether every condition holds.
    source: src-github-ispd27-contest-description
    quote: the corresponding metric values are set to 1% worse than the worst value among all teams
      and baseline for the same design.
  - term: search-exploration
    reason: Runtime enters the score, normalised against OpenROAD Resizer, and the tool has a
      seven-hour limit, but that rewards a fast tool, not how an option space was traversed; nothing
      counts samples or coverage.
  - term: spatial-reasoning
    reason: Placement and routing are geometric, but the score is the objective value of a produced
      layout, not a spatial inference; optimization carries it.

evaluation_method:
  - domain-metric
  - constraint-check
evaluation_method_basis:
  reason: >
    domain-metric: the evaluator measures the submitted layout with physical-design metrics that have
    no meaning outside the field, post-routing setup and hold TNS and WNS across corners, dynamic and
    leakage power, slew, capacitance and fanout violations and routing overflow (HPWL in 2005). constraint-check:
    placement legality, logical equivalence, clock-tree integrity and the permitted transformations are
    asserted before scoring, and a design that fails any of them cannot receive a normal score.
  source: src-github-ispd27-contest-evaluator-readme
  quote: The evaluator checks a legalized DEF/Verilog pair and measures design quality using global
    routing and setup/hold timing analysis at BC, TC, and WC.
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The score is a weighted sum of normalised sub-scores, but every constituent is a
      physical-design measure from one evaluation flow, or the runtime of that flow; the term's
      exclusion covers constituents that share a method (review_checks).
  - term: entrant-relative-ranking
    reason: Metrics are normalised against the fixed unoptimised baseline and the Resizer reference,
      which do not change with the entrants. Only a failing design is valued relative to the pool
      (1% worse than the worst team).
designed_for_subjects:
  - classical-algorithm
  - domain-specialist-model
designed_for_subjects_basis:
  reason: >
    The entrants are physical-design tools, heuristic and analytical optimisers the teams write: classical-algorithm.
    ISPD 2024 set out to stimulate GPU- and machine-learning-enhanced global routers, and ISPD 2026 and
    2027 invite GPU and ML infrastructure such as PyTorch; a model trained for a routing or sizing step
    is domain-specialist-model's inclusion test (trained for a task the engineering-design discipline
    defines), as GANGR's WGAN batching is. Whether any contest entrant was learned is not shown (review_checks).
  source: src-github-ispd24-contest-index
  quote: The goal of this competition is to stimulate academic research aimed at developing a
    GPU/ML-enhanced global router tailored for industrial-level circuits.
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: AlphaRoute drives a router's penalty schedule with language models, but that is one
      paper using the ISPD 2025 testcases; no edition read is designed for language-model agents,
      and the contest runs a submitted tool, not a model loop.
  - term: rl-policy
    reason: Reinforcement-learning macro placers are evaluated on the ISPD 2005 testcases in the
      literature, but no edition provides an environment for trained policies; a tool is run once
      per testcase.

as_used:
  - protocol: >
      Long after its contest, an edition's released testcases are run offline as a standard suite: papers
      place them with their own method and report the contest's quality metric against published placers,
      outside any round and without the organisers' runtime or legality rules.
    split: ISPD 2005 (adaptec and bigblue placement benchmarks)
    source: src-arxiv-2610-06316
    quote: Extensive experiments on the ISPD 2005 benchmark demonstrate that RollPlace outperforms
      state-of-the-art methods.
  - protocol: The ISPD 2025 global-routing testcases, a year after the contest, scored by the
      paper's own runs of its router and compared with the published state of the art.
    split: ISPD 2025
    source: src-arxiv-2607-19768
    quote: Evaluated on ISPD 2025 benchmarks, AlphaRoute reduces overflow by 98.6% on MEMPOOL.

lifecycle: active
lifecycle_basis:
  reason: The ISPD 2027 contest is running (all six public testcases released on 2026-11-07, results
    on 2027-03-31), and past editions' testcases are still used in 2026 papers, such as RollPlace on
    ISPD 2005 (October 2026).
  source: src-arxiv-2610-06316
  quote: Extensive experiments on the ISPD 2005 benchmark demonstrate that RollPlace outperforms
    state-of-the-art methods.
activity: accepting-submissions
activity_note: >
  ISPD 2027 opened on 2026-10-05 with its first public testcases and registration, which closes on 2026-12-05;
  alpha, beta and final submissions are due on 2027-01-11, 2027-02-15 and 2027-03-20, and results come
  on 2027-03-31. The round is open, but no submission falls due before the alpha deadline; round-scheduled
  is the other reading (review_checks).
activity_basis:
  reason: The 2027 round has opened, with registration and public testcases out and dated submission
    deadlines.
  source: src-github-ispd27-contest-readme
  quote: 'Registration Open: October 5, 2026 - First set of public benchmarks released: October 5, 2026
    - All public benchmarks released: November 7, 2026 - Registration Close: December 5, 2026 - Alpha
    Submission Deadline: January 11, 2027 - Beta Submission Deadline: February 15, 2027 - Final Submission
    Deadline: March 20, 2027'
events:
  - name: ISPD 2027 results announcement, at the symposium (Taipei, 31 March to 2 April 2027)
    kind: conference
    source: src-github-ispd27-contest-readme
    quote: 'Results Announcement: March 31, 2027'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: AlphaRoute (a global router whose rip-up-and-reroute penalties are adjusted by large
      language models)
    source: src-arxiv-2607-19768
    observed_on: 2026-11-18
    quote: Crucially, AlphaRoute employs Large Language Models (LLMs) as semantic policy optimizers.
    note: Evaluated on the ISPD 2025 testcases after the contest, not as a contest entrant.
  - system: GANGR (net batching for a parallel global router, generated by Wasserstein GANs)
    source: src-arxiv-2511-17665
    observed_on: 2026-11-18
    quote: a novel batching algorithm enhanced with Wasserstein generative adversarial networks
      (WGANs) is introduced in this paper
    note: Tested on the ISPD 2024 contest testcases after the contest. No source read shows a
      learned system among a contest's own entrants (review_checks).
evaluation_target: mixed
evaluation_target_note: The contests rank tools of any kind on one score; the methods of the winning
  teams are not described in the pages read, and the learned systems on record are papers using
  released testcases.
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The evaluation flow's own analysis of the submitted design (global
  routing, parasitic extraction and OpenSTA timing and power in ISPD 2026 and 2027; HPWL and a
  legality script in 2005). There is no reference answer; the unoptimised input and the OpenROAD
  Resizer run are the baselines scores are normalised to.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: >
    The evaluators, the public testcases and the Docker setup are released, and the hidden testcases of
    a finished edition are published (ISPD 2026's on its contest page, ISPD 2024's on 2024-03-26), so
    anyone can run a tool and score it. The entrants' tools are not released, and runtime is normalised
    on the organisers' machine, so a contest's own numbers cannot be regenerated.
  source: src-github-ispd27-contest-evaluator-readme
  quote: Compute the score from evaluation results and runtime.

task:
  exists: true
  input:
    - a legal post-clock-tree-synthesis placement (DEF) and its gate-level netlist (Verilog) in the
      ASAP7 library, with the clock tree, macros, I/Os, power grid and blockages fixed (ISPD 2027;
      ISPD 2026 started after detailed placement, with ideal clocks)
    - the SDC constraints of each timing scenario (three functional corners, and three scan-test
      scenes for scan testcases), the Liberty and LEF files and the multi-corner, multi-mode
      configuration
  output: A modified netlist and placement after inserting, removing or replacing data-path buffers
    and inverters, resizing gates or changing their threshold-voltage variant, and swapping
    equivalent pins; it must stay legal, logically equivalent and keep the clock tree unchanged.
  scoring: >
    Post-global-routing improvement over the unoptimised input in setup TNS (the primary objective) and
    WNS, dynamic and leakage power, less penalties for hold violations, electrical-rule violations, tool
    and flow runtime against OpenROAD Resizer, cell displacement and routing overflow; the weights are
    announced after the alpha round. A design failing legality or equivalence takes 1.01 times the worst
    value among the teams and the baseline, and teams that only rerun Resizer or return the input are
    not ranked. ISPD 2027 ranks on its eight hidden testcases only.
  tests_hidden_from_system: true
  task_distribution_drifts: true
  task_distribution_drifts_note: The problem changes between editions, from placement to routing,
    sizing, clock networks and security closure; the task above is the current one, ISPD 2027's.
  source: src-github-ispd27-contest-description
  quote: Contestants must output the modified .v and .def.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: >
    The value is the state of a finished edition: its public and hidden testcases are published, as ISPD
    2026's contest page offers both archives. During an edition the ranked testcases never leave the organisers
    (private-test-server), which is ISPD 2027's state until it concludes (review_checks).
  access_basis:
    reason: The ISPD 2026 page links the public and the hidden testcases for download.
    source: src-ispd-contest-2026
    quote: 'ISPD 2026 Contest Resources: Github Description (Backup if the Github stops working) Benchmark
      Public Cases (Backup if the Github stops working) Benchmark Hidden Cases'
  access_by_phase:
    during_edition: private-test-server. Public testcases are released for development, while the
      testcases that rank the teams stay with the organisers, who run each submitted tool on them.
    during_edition_source: src-github-ispd27-contest-description
    during_edition_quote: The eight hidden benchmarks will not be released to contestants until the
      contest concludes.
    after_edition: fully-open. The hidden testcases are published with the results.
    after_edition_source: src-github-ispd24-contest-index
    after_edition_quote: We released the hidden benchmarks and contest results- March 26, 2024
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each year is a new contest on new testcases, usually a new problem as well, and its
      ranking is on testcases held back for that edition.
    source: src-github-ispd27-contest-description
    quote: Final evaluation will use separate hidden testcases in a controlled evaluation
      environment.
  data_provenance:
    - simulation-generated
  data_provenance_note: >
    A testcase is an open hardware design (AES, a JPEG encoder, the Ariane and Coral NPU cores, NyuziProcessor,
    a BSG chip) that the organisers take through the OpenROAD flow to a legal placement, with constraints
    and corners they set. The design-quality labels are computed by the evaluation flow on each submission.
    simulation-generated follows circuitnet, whose layouts come from running EDA tools; an EDA flow is
    not a physics simulator in the term's narrow sense (review_checks). Where the 2005 testcases came
    from was not read.
  data_provenance_source: src-github-ispd27-contest-description
  data_provenance_quote: OpenROAD completes global placement, resizing and buffering, detailed
    placement, and clock tree synthesis (CTS).
  contamination_risk: low
  contamination_risk_note: >
    Nothing is answered from memory: the score is the measured quality of the design a tool produces,
    and the ranked testcases of a live edition are hidden. A finished edition's testcases and the best
    published results are public, so later papers on old suites can be tuned to them, which concerns comparability
    more than contamination.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_basis:
    reason: Scores are improvements over the unoptimised input, with the Resizer run as a reference;
      those anchor the bottom of the scale. The optimum of an NP-hard layout problem is not known,
      so the best end has no anchor.
    source: src-github-ispd27-contest-description
    quote: All design-quality metrics are normalized against the corresponding metrics of the
      baseline.
  dataset_licence: null
  dataset_licence_note: The 2026 and 2027 repositories are BSD-3-Clause, and each 2027 design
    directory carries its own design's LICENSE file, which was not read; no licence was found for
    the 2005 testcases or the ispd.cc archives.
  size:
    - count: 8
      unit: hidden testcases, the only ones ranked (announced; 15 thousand to 1.5 million instances)
      subset: ISPD 2027
      source: src-github-ispd27-contest-description
      quote: We will provide a diverse set of 6 public benchmarks* and 8 hidden benchmarks in the
        ASAP7 technology node with 7.5T cell library.
    - count: 6
      unit: public testcases (AES, AES scan, JPEG, JPEG scan, Coral NPU, NyuziProcessor), for
        development only
      subset: ISPD 2027
      source: src-github-ispd27-contest-benchmarks-readme
      quote: This directory contains the six public benchmarks for the ISPD 2027 Contest on **MCMM
        Post-CTS Buffering and Sizing**.
    - count: 12
      unit: testcases, 8 public and 4 hidden, all counted in the final score
      subset: ISPD 2026
      source: src-github-ispd26-contest-description
      quote: We will release a diverse set of 8 public benchmarks and 4 hidden benchmarks in the
        ASAP7 technology node with 7.5T multi-VT cell library.
    - count: 6
      unit: contest benchmarks (adaptec2, adaptec4, bigblue1 to bigblue4), after two sample
        benchmarks
      subset: ISPD 2005
      source: src-ispd-contest-2005
      quote: '03/20/2005: Six contest benchmarks are posted.'
  submission_limit: null
  submission_limit_note: Each team has an alpha, a beta and a final submission; the final one ranks.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ISPD contest organisers, a team that changes by edition (2026 UCSD, Fudan
    University and POSTECH; 2027 UCSD's ABKGroup), at the International Symposium on Physical Design
  maintainer_basis:
    reason: Each edition names its own organising team; the ISPD 2026 repository names three
      institutions, the 2027 repository sits in UCSD's ABKGroup organisation, and the 2024 and 2025
      contest pages were kept in a personal GitHub account. The symposium's site holds the archive
      of every edition.
    source: src-github-ispd26-contest-readme
    quote: UCSD, Fudan University, POSTECH
  maintainer_type: conference-workshop
  maintainer_type_note: The term's inclusion test, a recurring challenge under a conference whose
    organising team changes between editions, overrides the lab that runs the current edition. The
    2026 and 2027 editions share a lead institution, so the turnover is not every year.
  submission_process:
    - sandboxed-rerun
    - containerized-algorithm-submission
  submission_process_note: >
    sandboxed-rerun for ISPD 2026 and 2027: a team submits a ZIP with setup.sh and run.sh, built on the
    organisers' Docker or Apptainer image, and the organisers run it on their own hardware on the testcases
    and publish the scores. containerized-algorithm-submission for ISPD 2024, where each team built and
    shared a Docker image that the organisers ran on four A100 GPUs against hidden testcases. The 2005
    contest took a binary and a run script.
  submission_process_source: src-github-ispd27-contest-description
  submission_process_quote: Each participant must submit a ZIP file containing setup.sh, run.sh and
    any additional data or code not already retrievable in setup.sh.
  independence_flags:
    - flag: prize-sponsored-by-industry
      source: src-github-ispd27-contest-readme
      quote: 'compute resources for teams and submission evaluation. - NVIDIA: prizes for winning teams'
    - flag: single-evaluator-private-test-set
      source: src-github-ispd27-contest-benchmarks-readme
      quote: Final contest scores and rankings will be determined solely by performance on the
        hidden benchmarks.
  independence_flags_note: >
    NVIDIA pays the prizes (cash and GPUs) in 2024, 2026 and 2027, and a team from NVIDIA registered for
    ISPD 2026; the final leaderboard identifies teams only by number, and whether that team submitted
    was not established. The organisers hold the ranked testcases during an edition and run every evaluation,
    and the testcases are published afterwards. Compute for teams and for evaluation comes from Purdue
    University and NSF's Chipshub. maintainer-competes-on-own-benchmark is not set: no source read shows
    a team from an edition's organising institutions in that edition's results, and the 2024 and 2025
    organisers' affiliations were not read (review_checks).
  independence_assessed: true
  funding:
    source: src-github-ispd27-contest-readme
    quote: 'compute resources for teams and submission evaluation. - NVIDIA: prizes for winning teams'
  participation:
    source: src-github-ispd26-contest-readme
    quote: 13 final submissions were made. One team subsequently withdrew their submission.
  known_limitation:
    source: src-github-ispd26-contest-readme
    quote: we will use more rigorous evaluations (e.g., only on hidden testcases)
  known_limitation_note: The ISPD 2026 organisers' own note on the final leaderboard, after a
    withdrawn submission; ISPD 2026 ranked on public and hidden testcases together, and ISPD 2027
    ranks on hidden ones only.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: provided-allocation
  compute_tier_note: The final ISPD 2027 evaluation runs each tool in the organisers' Apptainer
    image on one A100 GPU (40 GB), 16 CPU threads and 64 GB of memory, with a seven-hour tool
    runtime limit; teams that pass the alpha round also get CPU and GPU hours on Purdue's Anvil for
    tuning, and develop on their own machines.
  compute_tier_basis:
    reason: The official score comes from the organisers running the submitted tool on their
      hardware.
    source: src-github-ispd27-contest-description
    quote: The final evaluation environment will have stricter limits as defined below and will be
      run using the Apptainer environment
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_note: >
    A tool can be run and scored end to end with the released evaluator, testcases and Docker image. The
    numbers are defined by the evaluation flow's own build (OpenROAD global routing and OpenSTA timing
    inside the contest image), and runtime is normalised against Resizer runs re-measured on the official
    machine, so a score from another build or machine is not the same condition. During an edition the
    ranked testcases are private. fully-automatable is the other reading if an EDA flow is not taken as
    a simulator (review_checks).
  reproducibility_tier_basis:
    reason: The evaluation is pinned to the OpenROAD infrastructure the contest provides.
    source: src-github-ispd27-contest-description
    quote: This contest is built on top of the OpenROAD [2] infrastructure and provides a
      controlled, open-source environment for benchmarking and evaluation.
  reproducibility_blockers:
    - specific-simulator-build
  harness_availability: official-harness
  harness_availability_basis:
    reason: The organisers publish the evaluator that validates, runs, evaluates and scores a
      submission, with the reference results it normalises against. Its 2027 weights are
      placeholders until the alpha round.
    source: src-github-ispd27-contest-evaluator-readme
    quote: Current scores use dummy weights. Final weights will be announced after the Alpha
      submission.
  harness: ISPD27-Contest evaluator (run_submission.py, eval.sh and score.py on OpenROAD and
    OpenSTA) in the contest's Docker or Apptainer image; ISPD 2026's evaluation scripts in
    ISPD26-Contest
  harness_source: src-github-ispd27-contest-evaluator-readme
  harness_quote: Compute the score from evaluation results and runtime.
  submission_channel:
    source: src-github-ispd27-contest-description
    quote: submitted through the official submission link
  submission_channel_note: A team also sends the ZIP's checksum to the contest mailbox; ISPD 2026
    took submissions through a Dropbox link. Registration for 2027 is by an online form, not opened
    for this entry.
  code_licence: BSD-3-Clause
  code_licence_note: The ISPD 2026 repository is BSD-3-Clause too (GitHub's licence metadata, read
    2026-11-18); the ISPD 2024 repository states no licence.
  code_licence_source: src-github-ispd27-contest-license
  code_licence_quote: BSD 3-Clause License Copyright (c) 2025, ABKGroup
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The eligibility-gated profile resolves (domain-metric x classical-algorithm). Beyond it: the evaluation flow's build
  # and the hardware, because runtime is a scored term normalised against Resizer runs on the official machine. The
  # edition is a version, and which testcases were used (public, hidden, a past suite) is subset_used, in the profile.
  # eligibility_track stays material: ISPD 2024 ranked a Main and a Special Honor track separately.
  material_extra:
    - harness
    - hardware_platform
  material_waived:
    - field: training_data_eligibility
      reason: No edition read defines training-data tiers; the public testcases are open to every
        team.
    - field: decontamination_applied
      reason: The items are designs to be optimised, scored by measurement; nothing is
        decontaminated or could be.
aggregation_policy: official-aggregate
aggregation_policy_note: ISPD 2026's total score sums the per-design scores over the twelve
  testcases, with a multiplier for the larger designs; ISPD 2027's weights are to be set after the
  alpha round.
aggregation_policy_basis:
  reason: The organisers combine the per-design scores into one total that ranks the teams.
  source: src-github-ispd26-contest-description
  quote: A design multiplier is applied (1.2 for ariane and 1.5 for bsg_chip)


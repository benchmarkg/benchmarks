lineage:
  role: root
lineage_note: No version, variant or fork is known. The paper's two arXiv versions (2024-10-07 and
  2025-02-28) both describe 200 prompts, and the public data dates from the second. EvoCAD and
  IterCAD run the set under metrics of their own (as_used), which makes them uses, not derivatives.
  Two gated Hugging Face datasets under an unrelated organisation carry "cadprompt" in their names
  with placeholder cards (the Hub's search API, read 2026-11-18, not cited). CadEval, CadQueryEval
  and Parametric CAD Bench are separate benchmarks with their own tasks.


    as text, docs/scoring.md, docs/submission.md, the Round 4 data README, the bundled dfbench FAQ and
    the LICENSE. The dfbench README at commit 4ef6f47. The competition site's home page and the NeurIPS
    2026 listing, with scripts and styles stripped. None has a DOI. The README, the proposal, the site
    and the NeurIPS listing name the organisers (the README also their e-mail addresses), so they are
    withheld from archiving; the rest are pending. The leaderboard CSVs, the per-participant folders and

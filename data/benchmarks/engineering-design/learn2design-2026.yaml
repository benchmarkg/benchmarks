  confidence: medium
  review_checks:
    - check: >
        Identity. The id is learn2design-2026, the name the taxonomy's three examples use (domains.yaml,
        the
        engineering-design family; capabilities.yaml, experimental-design and hypothesis-generation),
        as
        calochallenge-2022 and lhc-olympics-2020 name dated one-off competitions. The other reading is
        `learn2design` with 2026 as its first edition (04 S4: a re-issue on the same task is a version),
        which would move those refs; it fits only if a recurring series is announced. Id allocation is
        a
        human act (04 S3). The proposal calls it a new competition, not a recurring series, and no 2027
        edition is announced.
      source: src-github-learn2design-2026-proposal
      quote: Learn2Design is an entirely new competition and is not a continuation of any previously
        accepted NeurIPS competition or recurring benchmark series.
    - check: >
        Admissibility (00 S6 A5). No learned entrant's score is published: the README's seven baselines
        are all non-learned, VAESampling is a dfbench algorithm with no UIFO result found, and the VAE
        warm start is a planned baseline. The entrants' methods are confidential until the joint review
        paper. Re-read after 2026-12-11.
      field: learned_entrant_evidence
    - check: >
        Round 4 is read as the final evaluation: it scored the submissions due on the final deadline,
        the commit calls its ten-UIFO results official, and the top ten were run on forty more topologies,
        as the proposal planned for the final. The scoring rules say the final topologies are never published,
        yet Round 4's seeds are. If the final ranking is a separate private evaluation, access is private-test-server
        and the tier not-independently-reproducible with private-test-set.
      field: data.access
      source: src-github-learn2design-2026-scoring
      quote: hidden topologies, which are never published
    - check: >
        activity results-pending: the ranking is published (2026-10-27) but the official winners come
        after the source-code review, on 2026-12-11. closed is the other reading now, and after that date.
        The site still says "Submissions open"; the Codabench portal did not connect on 2026-11-17 and
        was not retried.
      field: activity
      source: src-learn2design-2026-site
      quote: Portal status Submissions open
    - check: >
        hypothesis-generation is rejected against the taxonomy's own example, because only the best design
        of each run is scored. experimental-design is kept as the taxonomy's example has it, though the
        design is judged by sensitivity, not by discriminating between hypotheses.
      field: capability
    - check: domain-metric for a loss the simulator defines; it is the competition's own, not a
        measure standardised across gravitational-wave instrumentation, and no term names a score
        computed by re-running a simulator on the submission (logged as
        taxonomy/_failures/2026-11-18-learn2design-2026-001, the second case of the open
        simulator-reevaluation proposal).
      field: evaluation_method
    - check: maintainer-competes-on-own-benchmark is not set although the seven organiser baselines

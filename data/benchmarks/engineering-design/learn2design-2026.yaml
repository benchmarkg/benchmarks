      field: governance.independence_flags
      source: src-github-learn2design-2026-readme
      quote: compares all **110 participants on the same ten UIFOs**, alongside the seven organizer
        baselines
    - check: Differometor-Benchmark (dfbench) is counted as the harness. It is versioned on its own
        (v0.2.0 to v0.3.3, last pushed 2026-11-12) and has its own problems (Voyager,
        ConstrainedVoyager) and benchmark runner, so under 04 S4 it could be a separate entry linked

# data/benchmarks/engineering-design/learn2design-2026.yaml
#
# P1-S8-T03, engineering-design entry 6. Filled from the Learn2Design-2026 repository at commit f071e0b (2026-10-27,
# "Publish Round 4 results and refresh evaluation documentation"): its README, the accepted competition proposal
# (Learn2Design_details.pdf), the scoring and submission rules (docs/scoring.md, docs/submission.md), the Round 4
# evaluation-data README, the bundled dfbench FAQ (docs/dfbench/FAQ.md) and the LICENSE; the Differometor-Benchmark
# (dfbench) README at commit 4ef6f47; the competition site's home page (www.learn2design2026.com, scripts and styles
# stripped); and the NeurIPS 2026 competition listing. The Codabench submission portal was not opened (it did not
# connect on 2026-11-17), and nothing was registered for or logged into. The leaderboard files key every row by a
# participant's account handle, so no row is quoted. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# Identity (04 S3-S4): the id is learn2design-2026, the taxonomy's own name for it, as the corpus names its
# dated one-off competitions (calochallenge-2022, lhc-olympics-2020); the proposal calls it an entirely new
# competition and no 2027 edition is announced (review_checks). The
# Differometor-Benchmark package (dfbench), the competition's library, is counted here as its harness.

id: learn2design-2026
name: Learn2Design
aliases:
  - Learn2Design 2026
  - Learn2Design-2026
  - 'Learn2Design 2026: A physics experiment design competition for gravitational wave detectors'
aliases_note: >
  The 2026 competition is the family's only edition so far; the repository, the site's domain and the
  NeurIPS listing all carry the year. Differometor is the simulator and dfbench (Differometor-Benchmark)
  the framework the competition runs on, not other names for it.
tagline: Optimisers submitted as code tune about 200 parameters of hidden gravitational-wave
  detector designs in a simulator.
description: >
  A NeurIPS 2026 competition from the Artificial Scientist Lab at the University of Tübingen on the automated
  design of gravitational-wave detectors. Each task is a detector topology drawn from the quasi-universal
  interferometer (UIFO), a grid of beam splitters, lasers, squeezers and one detector, with roughly 200
  continuous parameters such as laser powers, mirror reflectivities and distances. Entrants submit an
  optimisation algorithm, not a design: a Python class that receives dfbench's Objective, which wraps
  the differentiable JAX simulator Differometor and logs every evaluation. The organisers ran each submission
  for up to four hours per topology on one H100 GPU. A run scores the lowest loss among the setups that
  satisfy the physical power constraints, where the loss compares the design's broadband strain sensitivity
  with the Voyager reference detector on a log scale (zero is reference level, negative is better); the
  score is the mean over ten hidden topologies. Three monthly public rounds and a final round (Round 4,
  110 participants) ran from August to October 2026, beside seven organiser baselines from random search
  to CMA-ES and Adam. A corpus of 29,650 optimised designs is released for training surrogates, warm starts
  or generative models. Prizes of EUR 25,000 are sponsored by SPRIND, and the winners are announced at
  NeurIPS on 2026-12-11.
self_description:
  source: src-github-learn2design-2026-proposal
  quote: Learn2Design is a competition on the automated design of highly sensitive
    gravitational-wave detectors under realistic experimental constraints.
paper:
  title: 'Learn2Design 2026: A physics experiment design competition for gravitational wave detectors'
  source: src-github-learn2design-2026-proposal
paper_note: The accepted competition proposal, a PDF in the repository; it has no arXiv or DOI
  record.
released: 2026-07-09
released_note: The README's timeline dates the start of the competition 09.07.2026; the proposal had
  planned 2026-07-01. The repository was created on 2026-05-15 (GitHub API), and the submission
  platform opened on 2026-08-10.
released_source: src-github-learn2design-2026-readme
released_quote: '| 09.07.2026 | Start of competition |'
release_venue: NeurIPS 2026 Competition Track
release_venue_source: src-neurips-2026-competition-learn2design
release_venue_quote: NeurIPS Competition Learn2Design 2026

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/experimental-apparatus-design
  secondary:
    - physics/optics-photonics
domain_basis:
  reason: >
    What is scored is a design of a physical instrument, an interferometric gravitational-wave detector,
    found by the submitted algorithm and judged by its simulated sensitivity under physical constraints:
    the family's inclusion test (an apparatus judged against engineering criteria), and the family's own
    example. The detector is an optical system of mirrors, beam splitters, lasers and squeezed-light sources,
    which is physics/optics-photonics ("designing optical and photonic systems").
  source: src-github-learn2design-2026-proposal
  quote: An interferometric detector can be represented as a graph-like optical experiment
domain_considered_and_rejected:
  - term: code/competitive-programming
    reason: >
      Entrants submit software, and ALE-Bench, where programs are scored on a heuristic contest's objective,
      sits here. But the code family's exclusion sends code that is "the means to a result in another
      field" elsewhere: the score is the sensitivity of a detector design, there are no contest problems,
      and the family's inclusion test for engineering-design names this benchmark.
  - term: physics/simulation-surrogates
    reason: Entrants may train surrogates of Differometor on the released corpus, but no score
      compares an emulator with the simulator; the design's loss is computed by Differometor itself.
  - term: general-intelligence/open-ended-discovery
    reason: The organisers ask whether AI can find instruments beyond human intuition, but the score
      is a fixed loss on posed topologies, not novelty, and the term's definition excludes solving
      posed problems.

capability:
  - optimization
  - experimental-design
  - search-exploration
capability_basis:
  optimization:
    reason: The benchmark states an objective, the simulator's loss, and ranks systems by the mean
      of the best feasible values they reach, which is the term's inclusion test; the difficulty is
      the best design, not any feasible one.
    source: src-github-learn2design-2026-readme
    quote: The arithmetic mean over the 10 recorded losses is your score. Lower is better.
  experimental-design:
    reason: The scored artifact is an apparatus, a detector design, and the taxonomy names this
      benchmark as the term's example. It is judged by its sensitivity, a property of the
      instrument, rather than by whether it would discriminate between hypotheses (review_checks).
    source: src-github-learn2design-2026-proposal
    quote: Can machine learning algorithms discover experimental designs that go beyond human
      intuition, while remaining physically meaningful and experimentally constrained?
  search-exploration:
    reason: Each run is a search over about 200 continuous parameters under a four-hour wall-clock
      budget, and only what was found inside the budget counts, which is discovery under a budget;
      the first tie-breaker is the time taken to reach the best loss.
    source: src-github-learn2design-2026-scoring
    quote: loss reached within the 4-hour wall-clock budget
capability_considered_and_rejected:
  - term: hypothesis-generation
    reason: >
      The taxonomy lists this benchmark as an example of the term, but its inclusion test needs a scored
      set or ranking of candidates. Only the best feasible loss of each run is recorded, one design per
      topology, which the exclusion ("exactly one answer is scored") covers (review_checks).
  - term: constraint-satisfaction
    reason: The power constraints decide which setups count (a run with no feasible setup takes
      random search's loss), but the score is graded by the loss, not by whether every condition
      holds.
  - term: sample-efficiency
    reason: The budget is wall-clock time, not a number of samples or evaluations; the evaluation
      count is only the second tie-breaker.
  - term: distribution-shift-generalization
    reason: The hidden topologies are drawn from the same UIFO search space by random seeds, which
      the term's exclusion (random sampling) leaves out; no score is reported on a deliberately
      shifted distribution.

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: >
    The loss is defined within gravitational-wave detector design: the candidate's broadband strain-sensitivity
    curve against the Voyager reference detector on a log scale, plus penalties from the optical power
    constraints. It is the competition's own measure rather than one standardised across the field (review_checks).
  source: src-github-learn2design-2026-dfbench-faq
  quote: compares the candidate detector's broadband strain-sensitivity curve to the Voyager
    reference detector on a log scale
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: The score is computed by a simulator, but it is an unbounded loss of a design (negative
      values are better than the reference), not a bounded success or partial-credit score of
      episodes.
  - term: statistical-fit
    reason: Nothing is compared with measurements; the loss is the simulated design's own
      sensitivity.
designed_for_subjects:
  - classical-algorithm
  - domain-specialist-model
designed_for_subjects_basis:
  reason: >
    The seven organiser baselines are non-learned optimisers (Adam variants, SGD with momentum, BFGS,
    L-BFGS, CMA-ES, random search), and the proposal sets such optimisers against amortised learned methods.
    Those are trained for this engineering-design task on the released design corpus, which the rules
    encourage for pre-training surrogates and warm starts, with pretrained weights shipped in the submission:
    domain-specialist-model's inclusion test (trained from scratch for a task the discipline defines).
  source: src-github-learn2design-2026-proposal
  quote: allowing classical optimizers such as Adam, BFGS, and Bayesian optimization to compete
    directly with amortized methods such as prior-fitted networks
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: An entry may carry a surrogate of the simulator, but the score is the loss of the design
      it finds, not the surrogate's agreement with Differometor.
  - term: agent-scaffold
    reason: The entrant is an optimisation routine called once per topology through a fixed
      interface, and no source read here describes language-model agents as intended entrants.

lifecycle: active
lifecycle_basis:
  reason: The final round was scored in October 2026 for 110 participants, with a further
    50-topology comparison of the top ten, and the official results are still to come at NeurIPS in
    December.
  source: src-github-learn2design-2026-round4-data
  quote: This release provides evaluation statistics for 110 participants on the ten official Round
    4 UIFOs
activity: results-pending
activity_note: >
  The Round 4 ranking and per-run data were published on 2026-10-27; the official winners follow the organisers'
  source-code review of the top ten and are announced on 2026-12-11. The site still read "Submissions
  open" on 2026-11-18, which is stale: the final deadline was 2026-10-15. No later edition is announced
  (review_checks).
activity_basis:
  reason: The final submission deadline has passed and the organisers are still verifying the
    leading entries before announcing the winners.
  source: src-github-learn2design-2026-readme
  quote: The official winners will be announced at our NeurIPS competition workshop in
events:
  - name: NeurIPS 2026 competition session, Sydney, 11 December 2026, where the official winners are
      announced
    kind: workshop
    source: src-neurips-2026-competition-learn2design
    quote: Competition Fri, Dec 11, 2026 • 8:00 AM – 10:15 AM AEDT

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: VAESampling (dfbench's generative optimiser, a variational autoencoder trained on
      high-scoring samples with Bayesian optimisation in its latent space)
    source: src-github-differometor-benchmark-readme
    observed_on: 2026-11-18
    quote: Latent-space compression + BO
    note: One of the framework's built-in algorithms, to which the competition README points for
      further baselines. No published UIFO score for it was found (review_checks).
  - system: VAE warm starts trained on the released designs (a planned organiser baseline)
    source: src-github-learn2design-2026-proposal
    observed_on: 2026-11-18
    quote: learning-based warm starts such as sampling from variational autoencoders trained on the
      public high-quality designs
    note: Planned in the proposal; the README's baseline table lists only the seven non-learned
      optimisers. The entrants' methods stay with the organisers until the joint review paper.
evaluation_target: mixed
evaluation_target_note: Non-learned optimisers (all seven organiser baselines) and learned methods
  (surrogates, generative warm starts, prior-fitted networks) are scored on the same loss by design;
  which kind the 110 entrants used is not published.
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Differometor's loss for every setup a run logged, with the feasibility
  flag from the power checks; there is no reference answer, and the outcome exists only once the
  organisers run the algorithm.
ground_truth_source_source: src-github-learn2design-2026-proposal
ground_truth_source_quote: but is obtained only during organizer-run evaluation on hidden topologies
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: >
    The simulator, dfbench and the round seeds are public, so anyone can regenerate the scored topologies
    and run a new algorithm on them with the same rules. The official runs used one H100 per topology
    under a wall-clock budget, so a rerun on other hardware is not the same condition, and the entrants'
    own code is not released.
  source: src-github-learn2design-2026-round4-data
  quote: the shared topology and optimizer seed pairs

task:
  exists: true
  input:
    - a UIFO detector topology with its parameter bounds, wrapped in dfbench's Objective, a random
      seed and a four-hour budget; differometor may not be imported directly
    - optionally, the released corpus of 29,650 optimised designs and pretrained weights shipped in
      the submission
  output: Parameter settings evaluated through the Objective. A run's result is the lowest loss
    among the logged setups that satisfy the power constraints.
  scoring: Per topology, the best feasible loss within four hours (random search's best feasible
    loss replaces a run with none); the score is the mean over ten hidden topologies, lower is
    better. Ties go to the lower mean time to the best loss, then fewer evaluations, then the
    earlier submission.
  tests_hidden_from_system: true
  source: src-github-learn2design-2026-readme
  quote: Participants submit the algorithm itself, not only a final design.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: >
    The value is the state after the edition: the seeds of all four rounds' topologies are in the repository,
    and dfbench regenerates a topology from its seed. generated-on-demand was weighed, since each evaluation
    draws new topologies from a generator, but every entrant in a round met the same ten, a fixed set
    now published. The scoring rules said the final topologies would never be published (review_checks).
  access_basis:
    reason: Round 4's release lists the topology and optimiser seed of each of its ten runs.
    source: src-github-learn2design-2026-round4-data
    quote: the shared topology and optimizer seed pairs
  access_by_phase:
    during_edition: private-test-server. Each evaluation ran the submitted code on ten new hidden
      topologies that only the organisers held, and the final ranking on its own private topologies.
    during_edition_source: src-github-learn2design-2026-scoring
    during_edition_quote: hidden topologies, which are never published
    after_edition: fully-open. Each round's data release publishes its seeds, its per-run results
      and the participants' convergence data.
    after_edition_source: src-github-learn2design-2026-round4-data
    after_edition_quote: the shared topology and optimizer seed pairs
  records_access: fully-open
  records_snapshot: 2026-10-27
  refresh: periodic-recompetition
  refresh_basis:
    reason: Every evaluation, the three public rounds and the final one, ran on topologies new to
      it. The 2026 competition is the only edition so far; if none follows, static is the other
      reading (review_checks).
    source: src-github-learn2design-2026-readme
    quote: Each evaluation runs it on 10 new held-out hidden topologies
  data_provenance:
    - simulation-generated
  data_provenance_note: >
    The topologies are sampled from the UIFO search space by dfbench from a seed, and every loss is computed
    by Differometor, a physics simulator; synthetic-procedural's exclusion sends a physics simulator here.
    The training corpus was optimised in the simulator during a EuroHPC campaign of about 360,000 GPU-hours
    and distilled from the larger GraviTune dataset.
  data_provenance_source: src-github-learn2design-2026-proposal
  data_provenance_quote: approximately 30,000 high-quality detector designs discovered during a
    six-month EuroHPC compute campaign
  contamination_risk: low
  contamination_risk_note: >
    No answer exists before the organisers run an algorithm, each evaluation used topologies new to it,
    and encoding knowledge of the private topologies disqualifies a submission. The proposal separates
    the public examples from the hidden tasks by topology class, task family and seed and removes symmetry-equivalent
    designs. Now that the seeds are public, a later result on a past round's topologies has no such protection.
  contamination_risk_source: src-github-learn2design-2026-proposal
  contamination_risk_quote: Public training and validation examples will be separated from hidden
    tasks by topology class, task family, and random seed
  contamination_evidence: []
  ceiling_anchor_type: expert-best
  ceiling_anchor_type_note: >
    Zero is the loss of the best known human-designed detector within the same resources (the Voyager
    reference); negative losses beat it and are expected, so the anchor is one entrants may exceed, and
    the scale has no bound at the best end.
  ceiling_anchor_type_source: src-github-learn2design-2026-readme
  ceiling_anchor_type_quote: A loss of zero means that the optimizer has discovered the best known
    human designed gravitational wave detector
  dataset_licence: null
  dataset_licence_note: The design corpus sits in the MIT-licensed repository, and the proposal
    promises MIT or comparable licences for the released software and documentation; no licence is
    stated for the data itself.
  size:
    - count: 10
      unit: hidden UIFO topologies per evaluation, up to four hours each
      subset: each public round and the final round
      source: src-github-learn2design-2026-readme
      quote: Each evaluation runs it on 10 new held-out hidden topologies
    - count: 50
      unit: UIFO topologies per team (the ten official ones and forty more)
      subset: Round 4 top-ten comparison
      source: src-github-learn2design-2026-round4-data
      quote: uses fifty UIFOs per team
    - count: 29650
      unit: optimised UIFO designs in the released training corpus
      subset: training corpus (dataset/dataset.h5)
      source: src-github-learn2design-2026-readme
      quote: a compact HDF5 dataset with 29,650 pure-broadband optimized setups
  submission_limit: null
  submission_limit_note: No limit on uploads; each monthly evaluation, and the final one, scored
    only the last submission before its deadline.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Artificial Scientist Lab, University of Tübingen
  maintainer_basis:
    reason: The repository and its licence are the lab's, and the proposal places the evaluation
      with the organiser team at the University of Tübingen; co-organisers from Jena, Nikhef and
      Caltech hold no part of the repository.
    source: src-github-learn2design-2026-license
    quote: Copyright (c) 2026 Artificial Scientist Lab
  maintainer_type: academic-lab
  maintainer_type_note: The repository sits in the lab's GitHub organisation
    (artificial-scientist-lab), with dfbench and Differometor. conference-workshop was considered
    and rejected; the competition is not a recurring series whose committee re-forms.
  submission_process:
    - sandboxed-rerun
  submission_process_note: Entrants upload a ZIP with submission.py (one OptimizationAlgorithm
    subclass), requirements.txt and any weights; the organisers install it in its own environment
    and run it without network access on their hardware. It is code run in the organisers'
    environment, not a container image of the entrant's (containerized-algorithm-submission).
  submission_process_source: src-github-learn2design-2026-submission-rules
  submission_process_quote: Your algorithm must be able to run without network access.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-github-learn2design-2026-scoring
      quote: hidden topologies, which are never published
  independence_flags_note: >
    The organisers held the topologies and ran every evaluation; the seeds were published afterwards,
    but the entrants' code stays with the organisers, so the ranking cannot be checked from outside. The
    seven organiser baselines are plotted beside the entrants, while the rules bar organisers from competing,
    so maintainer-competes-on-own-benchmark is not set (review_checks). The prizes are paid by SPRIND,
    a German federal agency, not a commercial sponsor. The top ten must give their source code to the
    organisers for review before prizes are paid.
  independence_assessed: true
  funding:
    source: src-github-learn2design-2026-readme
    quote: The prize money is sponsored by [SPRIND (Federal Agency for Disruptive Innovation
  participation:
    source: src-github-learn2design-2026-round4-data
    quote: This release provides evaluation statistics for 110 participants on the ten official
      Round 4 UIFOs
  independence_policy:
    source: src-github-learn2design-2026-proposal
    quote: The competition is open to all participants except organizers and anyone with access to
      hidden evaluation tasks or final evaluation infrastructure.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: provided-allocation
  compute_tier_note: One H100 SXM5 GPU, 16 vCPUs and 128 GiB per run, up to four hours per topology
    and ten topologies per evaluation. The proposal specified A100s; the README says the current
    specification supersedes it.
  compute_tier_basis:
    reason: The organisers ran every submission on their own hardware at no cost to the entrant.
    source: src-github-learn2design-2026-submission-rules
    quote: 'Each participant run is allocated: - 1× NVIDIA H100 SXM5 GPU (Hopper, 80 GB HBM3)'
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_note: >
    A new algorithm can be run and scored end to end on the published round seeds with dfbench and Differometor.
    The score is defined only inside the fixed build (dfbench 0.3.3 with the evaluator's pinned Differometor
    and JAX), and a wall-clock budget makes it depend on the hardware too. If the final topologies were
    not those published, the tier is not-independently-reproducible with private-test-set (review_checks).
  reproducibility_tier_basis:
    reason: The evaluator fixes the simulator and JAX versions.
    source: src-github-learn2design-2026-submission-rules
    quote: The simulator and JAX package versions are fixed
  reproducibility_blockers:
    - specific-simulator-build
  harness_availability: reference-implementation-only
  harness_availability_basis:
    reason: dfbench's Objective records every evaluation, its feasibility and the budget, and the
      repository's validator runs a submission locally, but the organisers' evaluation pipeline is
      not published and the validator says it does not give an official score.
    source: src-github-learn2design-2026-submission-rules
    quote: does not reproduce an official leaderboard score
  harness: dfbench 0.3.3 (Differometor-Benchmark), with tools/validate_submission.py and the example
    algorithms in the Learn2Design-2026 repository
  harness_source: src-github-differometor-benchmark-readme
  harness_quote: It handles evaluation tracking, budget enforcement, and history logging, you just
    write the optimization logic.
  submission_channel:
    source: src-github-learn2design-2026-readme
    quote: You submit a ZIP archive containing your optimization algorithm, dependency requirements,
      and any supporting files through the [submission
      portal](https://submit.learn2design2026.com/).
  submission_channel_note: The portal (a Codabench instance, competition 4) did not connect on
    2026-11-17 and was not opened for this entry; see history.
  code_licence: MIT
  code_licence_note: dfbench and Differometor are MIT-licensed too (GitHub's licence metadata for
    Differometor-Benchmark, read 2026-11-18).
  code_licence_source: src-github-learn2design-2026-license
  code_licence_quote: MIT License
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # The eligibility-gated profile resolves (domain-metric x classical-algorithm). Beyond it: the simulator
  # build and the hardware, because the budget is four hours of wall-clock time on one GPU (the proposal's A100
  # became an H100), and which round's topologies were used (subset_used, in the profile already).
  # training_data_policy stays material: entrants may train on the released corpus or not.
  material_extra:
    - simulator
    - simulator_version
    - hardware_platform
  material_waived:
    - field: eligibility_track
      reason: There are no tracks; every entrant is ranked in one table, and subset_used carries the
        round.
    - field: training_data_eligibility
      reason: No training-data tiers are defined; use of the released corpus is open to all and
        training_data_policy carries it.
    - field: decontamination_applied
      reason: The items are generated topologies, and nothing is decontaminated or could be.
aggregation_policy: official-aggregate
aggregation_policy_note: The official score is the arithmetic mean of the ten per-topology best
  feasible losses; the leaderboard files also report the standard error, the median and time to
  best.


      field: lineage
      source: src-github-differometor-benchmark-readme
      quote: A benchmarking framework for optimization algorithms on gravitational-wave detector
        design problems
    - check: physics/optics-photonics as secondary rests on the detector being an optical system;
        the physics family's inclusion test (a simulated physical process scored) also fits, so a
        reviewer may prefer it primary. The family's own example puts the benchmark in
        engineering-design.
      field: domain
    - check: refresh periodic-recompetition rests on the rounds of one edition each using new
        topologies; static is the reading if no edition follows 2026.
      field: data.refresh
    - check: The hardware moved from the proposal's A100 to an H100 evaluation VM. The budget is

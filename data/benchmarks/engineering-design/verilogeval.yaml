# data/benchmarks/engineering-design/verilogeval.yaml
#
# P1-S8-T03, engineering-design entry 2. Filled from the VerilogEval paper, arXiv 2309.07544 read as its v2 PDF
# (2023-12-10; ICCAD 2023), and its abstract page; the "Revisiting VerilogEval" paper, arXiv 2408.11053 read as its
# v2 PDF (2025-02-03), and its abstract page; three files of NVlabs/verilog-eval: the README at main (commit
# c498220, the v2.0.0 tag), the README on the release/1.0.0 branch (commit 4fa0ac4) and the LICENSE at c498220.
# Current use is from the v1 PDF of VeriTrace (arXiv 2608.02878, August 2026), which runs all 156 problems with
# multi-agent systems; contamination evidence from the v3 PDF of VeriContaminated (arXiv 2503.13572, June 2025).
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The family entry: VerilogEval v1 (2023) and v2 (2024) are revisions of one benchmark over the same 156 HDLBits
# problems, in one NVIDIA repository; v1 stays on its branch. VerilogEval-human, VerilogEval-machine (v1 only) and
# v2's specification-to-RTL task are subsets. The hard call is the family: Verilog is source code, but each item
# is a circuit simulated against a golden design (domain_basis, review_checks, and the logged boundary).

id: verilogeval
name: VerilogEval
aliases:
  - VerilogEval v1
  - VerilogEval 1.0
  - VerilogEval v2
tagline: 156 HDLBits circuit problems; a model writes the Verilog module, scored by simulation
  against a golden design.
description: >
  A benchmark from NVIDIA for generating Verilog, the hardware description language, from a text description.
  Its 156 problems are digital circuit design exercises taken from HDLBits, an instructional website and
  online judge for digital logic, picked for clarity and diversity and kept to self-contained modules:
  combinational circuits, Boolean functions given as truth tables or Karnaugh maps, state machines and
  waveforms, all rewritten as text. The model writes the module; Icarus Verilog simulates it beside the
  golden reference under a testbench of hand-written and random input patterns, checking the outputs at
  clock edges for sequential circuits and on every input change for combinational ones. The score is pass@k
  with HumanEval's unbiased estimator. Version 1 (ICCAD 2023) offered two description sets as code completion
  with the module header given: VerilogEval-human, converted by hand (156 problems), and VerilogEval-machine,
  written by gpt-3.5-turbo and kept where a sampled solution passed (143), reported as pass@1, pass@5
  and pass@10 from 20 samples. Version 2 (2024, "Revisiting VerilogEval") keeps the human problems with
  14 descriptions or testbenches revised, drops the machine set, adds a specification-to-RTL task in a
  question-and-answer format, in-context examples (up to three in the paper) and automatic classification
  of compile-time and run-time failures, and reports pass@1 from 20 samples at temperature 0.8 and from
  one at temperature 0. Neither version checks that a design is synthesisable or measures power, performance
  or area. In the v2 paper GPT-4o reaches 63% on specification-to-RTL; agentic systems that also read
  the testbenches and simulate have reported 94% to 100%, and the maintainers write that the set is already
  solved for such systems. Results appear in papers; there is no leaderboard.
self_description:
  source: src-arxiv-2309-07544-v2
  quote: evaluating LLM performance in the context of Verilog code generation for hardware design
    and verification
external_ids:
  arxiv: '2309.07544'
paper:
  title: 'VerilogEval: Evaluating Large Language Models for Verilog Code Generation'
  arxiv: '2309.07544'
  doi: 10.48550/arXiv.2309.07544
  version_read: v2
  source: src-arxiv-2309-07544-v2
released: 2023-09-14
released_note: The paper's first arXiv version, as its abstract page dates it. The v2 paper dates
  the benchmark's release to November 2023, the ICCAD conference, and the repository's dataset
  commit is dated 2023-09-15 (GitHub API, not a quoted Source).
released_source: src-arxiv-2309-07544
released_quote: Submitted on 14 Sep 2023 (v1), last revised 10 Dec 2023 (this version, v2)
release_venue: ICCAD 2023 (invited paper)
release_venue_source: src-arxiv-2309-07544
release_venue_quote: ICCAD 2023 Invited Paper. Prior version contained errors in the numbers
  reported for gpt-4 in Table II

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/circuit-eda
  secondary:
    - code/function-synthesis
domain_basis:
  reason: Each item asks for a digital circuit (a combinational block, a state machine) described in
    Verilog, and the grader treats the submission as a circuit, simulating it beside a golden
    reference design and comparing output signals at clock edges, which is designing and verifying
    an electronic circuit. The family excludes software, which is `code`, but both papers set
    hardware description apart from software (Verilog's behaviour is evaluated by simulation, unlike
    Python's; little transfer from software languages), and `code` itself excludes code that is the
    means to a result in another field. The item design copies HumanEval, a self-contained unit
    written from a specification and judged by running tests, so code/function-synthesis is
    secondary. The boundary is logged (taxonomy/_failures/2026-11-18-verilogeval-001.yaml).
  source: src-arxiv-2309-07544-v2
  quote: HDLBits is a collection of digital circuit design exercises and an online judge for
    learning digital logic using the Verilog hardware description language
domain_considered_and_rejected:
  - term: agents-tooluse/software-agents
    reason: The highest reported results come from agentic systems that read the testbenches,
      simulate and debug, but the protocol is one prompt and one response per sample; agents are how
      the set is now used, not what it scores (as_used).
    source: src-arxiv-2408-11053-v2
    quote: VerilogCoder achieves this high pass rate by also having access to testbenches,
      simulation, and waveforms
capability: []
capability_note: No capability term names writing a correct design or program from a specification,
  the gap HumanEval's entry logged (taxonomy/_failures/2026-10-10-humaneval-001.yaml, proposed term
  program-synthesis); its hardware form, a circuit built to a behavioural specification, is the same
  gap and is not logged again. The paper names comprehension of hardware design and problem solving
  in circuits, Boolean logic and state transitions, none of which a term's inclusion test captures
  as scored.
capability_considered_and_rejected:
  - term: constraint-satisfaction
    reason: Every checked output must match for a sample to pass, but the requirement is a
      behavioural specification compared with a golden design in simulation, not an enumerated set
      of conditions, and the papers claim functional correctness, not constraint satisfaction.
    source: src-arxiv-2309-07544-v2
    quote: To enable automated testing, we compare simulation results between generated code
      completions with golden reference solutions.
  - term: optimization
    reason: Power, performance and area, which the papers call the main focus of real RTL work, are
      outside the score; only functional correctness is checked.
    source: src-arxiv-2309-07544-v2
    quote: We do not evaluate the performance of downstream circuit implementations
  - term: instruction-following
    reason: v2 adds prompt formats and classifies failures such as a missing endmodule, but those
      are analyses; the score is whether the simulated design matches the reference.
  - term: self-correction
    reason: The protocol is single-turn. Agentic users debug against simulation, but that is their
      scaffold, and the feedback comes from the testbench, an external oracle.

evaluation_method:
  - execution-tests
evaluation_method_basis:
  reason: The generated module is compiled and simulated with the golden reference under each
    problem's testbench, and the verdict is whether the outputs match; pass@k counts samples that
    pass.
  source: src-arxiv-2309-07544-v2
  quote: To enable automated testing, we compare simulation results between generated code
    completions with golden reference solutions.
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: A simulator runs, but it simulates the submitted circuit under a fixed testbench; no
      policy or agent acts through episodes in an environment, which the term's inclusion test
      requires.
  - term: reference-metric
    reason: The paper rejects match-based scores such as BLEU because they do not separate correct
      from wrong Verilog, and scores functional correctness instead.
    source: src-arxiv-2309-07544-v2
    quote: the distributions of correct versus wrong solutions are not clearly seperable based on
      BLEU score probability densities
  - term: constraint-check
    reason: The testbench runs the design and observes its behaviour; nothing validates the design's
      structure, and synthesisability is explicitly not checked.
    source: src-arxiv-2309-07544-v2
    quote: our testing environment solely assesses functional correctness and does not ensure that
      the generated Verilog code adheres to synthesizable formatting standards
designed_for_subjects:
  - base-model
  - instruction-tuned-model
  - domain-specialist-model
designed_for_subjects_basis:
  reason: v1 is code completion, the problem description followed by the module header for the model
    to continue, and its experiments sample CodeGen base models beside gpt-3.5 and gpt-4. v2 adds
    specification-to-RTL in a question-and-answer format for instruction-tuned models. Verilog
    specialisation is part of the design's purpose; the release paper fine-tunes Verilog models on
    synthetic data and v2 evaluates RTL-Coder, a domain-specific model.
  source: src-arxiv-2408-11053-v2
  quote: while many models are tuned and deployed as instruction-tuned models[35], with question and
    answer prompting
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: The harness sends one prompt per sample and simulates the reply; entrants do not bring a
      loop, and the v2 paper sets agentic systems with testbench access apart from the single-turn
      models it evaluates.
    source: src-arxiv-2408-11053-v2
    quote: VerilogCoder achieves this high pass rate by also having access to testbenches,
      simulation, and waveforms
  - term: multi-agent-system
    reason: The systems at the top of recent reports are multi-agent (VeriTrace, MAGE), a fact about
      use; the protocol has no role for a second agent.
    source: src-arxiv-2608-02878-v1
    quote: the system takes a natural language specification and golden testbench if available as
      input, generates testbench and RTL
as_used:
  - protocol: Multi-agent systems on the 156 v2 problems, each given the natural-language
      specification and the golden testbench, which an agent rewrites to dump all waveforms; RTL is
      generated, simulated and debugged in a loop until every test passes or an iteration cap is
      reached. Pass@1 from three runs for the systems the paper ran; other systems' numbers are
      taken from their papers.
    source: src-arxiv-2608-02878-v1
    quote: Each problem includes a natural language specification and a golden testbench.
    note: VeriTrace (August 2026), which reports 100% with Claude Sonnet 4.5 and 97.4% with Claude
      Sonnet 4.0. One problem's testbench and prompt were adjusted after consulting the v2 authors,
      so its 156 are not exactly the released set; which v2 task format it used is not stated.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against the v2 problems; an August 2026 paper reports a
    multi-agent system at 100%, and an arXiv search on 2026-11-18 returned October and November 2026
    papers reporting VerilogEval v2 (not cited). Headroom is close to exhausted; saturated is
    derived, not hand-set (review_checks).
  source: src-arxiv-2608-02878-v1
  quote: VeriTrace achieves 100% Pass@1 on VerilogEval-V2, the first system to attain perfect
    functional correctness on this benchmark.
activity: no-submission-channel
activity_basis:
  reason: The repository holds the problems and the harness and no leaderboard or results route;
    results are reported in papers, which collect each other's numbers, as VeriTrace's comparison
    table does.
  source: src-arxiv-2608-02878-v1
  quote: We report the highest PASS@1 accuracies from the literature

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4 (gpt-4-0613), v1 VerilogEval-human
    source: src-arxiv-2309-07544-v2
    observed_on: 2026-11-18
    quote: VerilogEval-human pass@1 pass@5 pass@10 26.7 45.8 51.7 43.5 55.8 58.9
  - system: GPT-4o, v2 specification-to-RTL
    source: src-arxiv-2408-11053-v2
    observed_on: 2026-11-18
    quote: GPT-4o achieves a 63% pass rate on specification-to-RTL tasks
  - system: VeriTrace (Claude Sonnet 4.5)
    source: src-arxiv-2608-02878-v1
    observed_on: 2026-11-18
    quote: With Claude Sonnet 4.5 [35], VeriTrace achieves 100% Pass@1
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: Each problem's testbench and golden reference module in the repository;
  the testbench drives both with the same input patterns in Icarus Verilog and compares their
  outputs.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The problems, references, testbenches and harness are public, and the simulator is open
    source; running generated code needs a sandbox.
  source: src-arxiv-2408-11053-v2
  quote: The improved VerilogEval benchmark is available publicly at
    https://github.com/NVlabs/verilog-eval.

task:
  exists: true
  input:
    - a text-only description of the circuit, with truth tables, Karnaugh maps, state transitions
      and waveforms written as text
    - 'v1 and v2 code completion: the module header with its ports; v2 specification-to-RTL: the interface
      described in the question, and optionally in-context examples'
  output: A self-contained Verilog module (SystemVerilog in v2) implementing the circuit.
  scoring: Icarus Verilog simulates the module beside the golden reference under a testbench of
    hand-written and random input patterns, checking outputs at clock edges (sequential) or on input
    changes (combinational); a problem counts as solved by pass@k over n samples (v1 n = 20, k = 1,
    5, 10; v2 pass@1 from n = 20 at temperature 0.8 or n = 1 at temperature 0).
  tests_hidden_from_system: true
  reference_solution: true
  source: src-arxiv-2309-07544-v2
  quote: We assert for output signal correctness at clock (posedge and/or negedge) transition edges
    for sequential circuits, while for combinational circuits, we validate them when any input
    signals changes.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Both versions' problems, reference solutions and testbenches are in the public
      repository, v1 on its branch and v2 at main.
    source: src-arxiv-2408-11053-v2
    quote: each dataset contains the problem prompts, reference solutions, and in-context learning
      examples
  refresh: versioned-releases
  refresh_note: v2 revised 14 problems' descriptions or testbenches. The repository's history
    (GitHub API, not a quoted Source) shows two further in-place fixes on main after v2's release
    (2024-09-17, prompts and testbenches; 2025-02-01, problem and in-context prompts) before the
    v2.0.0 tag at c498220, and VeriTrace adjusted one more mismatched testbench and prompt after
    consulting the authors. A claim should pin the commit.
  refresh_basis:
    reason: The two versions are labelled and kept apart, v1 on a preserved branch and v2 at main.
    source: src-github-verilog-eval-readme-c498220
    quote: which has been kept to preserve this original benchmark
  data_provenance:
    - web-scraped
    - model-generated
  data_provenance_note: The problems and their solutions come from HDLBits, a public instructional
    site; the v1 paper's acknowledgement thanks the site's creator for providing reference solutions
    and testbenches. The authors rewrote the human descriptions as text by hand (diagrams, tables
    and waveforms as text), and gpt-3.5-turbo wrote the machine descriptions, which were kept where
    a sampled solution passed.
  data_provenance_basis:
    reason: The machine description set, the model-generated part.
    source: src-arxiv-2309-07544-v2
    quote: opt to utilize LLMs for the automated creation of problem descriptions
  data_provenance_source: src-arxiv-2408-11053-v2
  data_provenance_quote: The original VerilogEval [19] contains 156 problems adopted from questions
    and solutions on the HDLBits Verilog instructional website, picked based on clarity and
    diversity.
  contamination_risk: high
  contamination_risk_note: The problems, golden solutions and testbenches are public in the
    repository, and the problems come from a public instructional site. A 2025 study found the
    training sets of two Verilog code models, RTLCoder and VeriGen, close to VerilogEval's golden
    solutions by syntax-tree similarity, and contamination rates near 100% for GPT-3.5 and GPT-4o by
    its detection methods. The route is open in the only split there is.
  contamination_evidence:
    - source: src-arxiv-2503-13572-v3
      stance: supports
      quote: RTLCoder and Verigen show significant similarities to the RTLLM and VerilogEval
        benchmarks, suggesting severe data contamination.
    - source: src-arxiv-2503-13572-v3
      stance: supports
      quote: Our analysis of LLM data contamination across VerilogEval and RTLLM benchmarks shows
        near 100% rates in GPT-3.5 and GPT-4o, but lower in older models.
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: pass@k is bounded at 100%, and every problem has a golden reference the
    testbench compares against. No source read reports running the references through their
    testbenches; VeriTrace reached 100% after adjusting one problem.
  dataset_licence: null
  dataset_licence_note: The repository's LICENSE is MIT (NVIDIA Research Projects, with human-eval's
    MIT notice for the code it reuses); no source read states a licence for the HDLBits-derived
    problems, solutions and testbenches, and HDLBits' own terms were not read.
  size:
    - count: 156
      unit: problems
      source: src-arxiv-2309-07544-v2
      quote: We present a comprehensive evaluation dataset consisting of 156 problems from the
        Verilog instructional website HDLBits.
    - count: 143
      unit: problems with valid machine-written descriptions
      subset: VerilogEval-machine (v1)
      source: src-arxiv-2309-07544-v2
      quote: In total we generated 143 valid problem descriptions.
    - count: 156
      unit: problems
      subset: specification-to-RTL (v2)
      source: src-arxiv-2408-11053-v2
      quote: The full 156-problem dataset from VerilogEval is converted into specification-to-RTL
        prompting in this work.
  languages:
    - Verilog
    - SystemVerilog
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: NVIDIA (NVlabs)
  maintainer_basis:
    reason: Both papers' authors list NVIDIA Corporation, and the benchmark and harness sit in
      NVIDIA Research's NVlabs organisation, whose LICENSE names NVIDIA Research Projects.
    source: src-github-verilog-eval-license-c498220
    quote: MIT License Copyright (c) 2023-2024 NVIDIA Research Projects
  maintainer_type: industry-lab
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results route exists; the v2 paper counts the
    benchmark's use by its citations, and later papers report and collect results.
  submission_process_source: src-arxiv-2408-11053-v2
  submission_process_quote: Since its release last year, VerilogEval has been commonly used in
    state-of-the-art LLM Verilog code generation research
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2309-07544-v2
      quote: Additionally, we demonstrate that our top-performing model codegen-16B-verilog-sft,
        exhibits performance that is on par with gpt-3.5.
  independence_flags_note: The release paper fine-tunes CodeGen models on its own synthetic Verilog
    data and reports them beside OpenAI's models on the benchmark; the v2 paper evaluates no model
    it trained. There is no leaderboard to rank on, the reason HumanEval's entry gave for not
    flagging Codex (review_checks).
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_note: A run is automatic end to end, but every verdict comes from simulating
    the design in Icarus Verilog; the README pins v12 and does not support v13, and the release
    paper notes that the simulator does not cover all of IEEE 1364.
  reproducibility_tier_basis:
    reason: The harness drives Icarus Verilog, whose version is pinned.
    source: src-github-verilog-eval-readme-c498220
    quote: Please note that iverilog v13 (development release) is not supported.
  harness_availability: official-harness
  harness: verilog-eval, v1's evaluate_functional_correctness on the release/1.0.0 branch and v2's
    Makefile flow (configure options for task, model, shots, samples, temperature and top_p;
    sv-generate; Icarus Verilog; failure classification) at main
  harness_source: src-github-verilog-eval-readme-c498220
  harness_quote: The evalution harness is run using make and various evaluation parameters can be
    set as below
  harness_gotcha:
    source: src-github-verilog-eval-readme-4fa0ac4
    quote: is deliberately commented out to ensure users read this disclaimer before running code in
      a potentially unsafe manner
  harness_gotcha_note: v1's execution call ships commented out and must be enabled by hand before
    anything is scored; v2's README plans a Dockerfile and a JSONL compatibility mode that the read
    sources do not show.
  code_licence: MIT
  code_licence_source: src-github-verilog-eval-license-c498220
  code_licence_quote: MIT License Copyright (c) 2023-2024 NVIDIA Research Projects
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile (subset_used: human or machine descriptions, code completion or
  # specification-to-RTL): the version and harness (v1's JSONL and prompts against v2's reframed prompts
  # and post-processing; GPT-4 moved from 43.5% to 41.6%, mostly on whitespace and punctuation), the number
  # of in-context examples, the sampling (temperature 0.8 and top_p 0.95 with n = 20, or temperature 0 with
  # n = 1; the README says 0.85), k and n, the Icarus Verilog version, and any scaffold that reads the
  # testbench and iterates.
  material_extra:
    - harness
    - shots
    - sampling
    - n_samples
    - k
    - simulator_version
    - scaffold

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The reported number is pass@k averaged over problems by HumanEval's unbiased estimator,
    per subset or task; v1 reports k = 1, 5, 10 and v2 pass@1 only.
  source: src-arxiv-2309-07544-v2
  quote: We also suggest using the unbiased estimator from [21]

liveness:
  repo_last_commit: 2025-02-07
  reproduction_script_present: true
  last_checked: 2026-11-18

homepage: https://github.com/NVlabs/verilog-eval
repository: https://github.com/NVlabs/verilog-eval

versions:
  - version: v1
    label: VerilogEval v1 (VerilogEval 1.0)
    version_kind: revision
    released: 2023-09-14
    items: 156
    changes: The release, 156 HDLBits problems as code completion with the module header given, in
      two description sets (VerilogEval-human, 156; VerilogEval-machine, 143), scored by pass@1,
      pass@5 and pass@10 from 20 samples; kept on the release/1.0.0 branch.
    superseded_by: v2
    frozen: true
    sources:
      - src-arxiv-2309-07544-v2
      - src-arxiv-2309-07544
      - src-github-verilog-eval-readme-4fa0ac4
  - version: v2
    label: VerilogEval v2 (Revisiting VerilogEval)
    version_kind: revision
    released: 2024-08-20
    items: 156
    changes: The same 156 problems with 14 descriptions or testbenches revised and the module
      interface specified more abstractly; a specification-to-RTL task beside code completion,
      in-context examples, failure classification and a Makefile harness; the machine descriptions
      and pass@10 dropped, pass@1 reported at two temperatures. Prompt and testbench fixes followed
      on main until the v2.0.0 tag (refresh_note).
    breaking: true
    supersedes_version: v1
    frozen: true
    sources:
      - src-arxiv-2408-11053-v2
      - src-arxiv-2408-11053
      - src-github-verilog-eval-readme-c498220

subsets:
  - id: verilogeval#human
    label: VerilogEval-human (code completion; v2's code-complete-iccad2023)
    items: 156
    scored_separately: true
    evidence:
      - source: src-arxiv-2309-07544-v2
        quote: We manually converted 156 problem descriptions in total.
      - source: src-github-verilog-eval-readme-c498220
        quote: Available tasks are `code-complete-iccad2023` and `spec-to-rtl`
    notes: Descriptions rewritten by hand as text, with the module header appended for the model to
      complete. The set the v2 paper evaluates and most later reports use; in v2 the code completion
      task, its problem statements shared with specification-to-RTL.
  - id: verilogeval#machine
    label: VerilogEval-machine
    items: 143
    scored_separately: true
    evidence:
      - source: src-arxiv-2309-07544-v2
        quote: In total we generated 143 valid problem descriptions.
      - source: src-github-verilog-eval-readme-c498220
        quote: MachineEval is not supported in VerilogEvalV2, only the Human Eval problem
          statements.
    notes: Descriptions written by gpt-3.5-turbo from the reference solutions and kept where a
      sampled completion passed (143 of 156). v1 only; the README says the descriptions will not be
      maintained.
  - id: verilogeval#spec-to-rtl
    label: Specification-to-RTL (v2)
    items: 156
    scored_separately: true
    evidence:
      - source: src-arxiv-2408-11053-v2
        quote: The full 156-problem dataset from VerilogEval is converted into specification-to-RTL
          prompting in this work.
      - source: src-github-verilog-eval-readme-c498220
        quote: Problem themselves are identical between the two datasets and only the task format
          changes.
    notes: The human problem statements as a question and answer, the interface described in the
      question and the module written whole between [BEGIN] and [DONE], with 0 to 3 in-context
      examples in the paper (0 to 4 in the README). v2 only.
subsets_note: The two description sets of v1 and the two task formats of v2, from v1's Table I
  (VerilogEval-machine 143, VerilogEval-human 156, no training split) and the v2 README's task list.
  Code completion on the human descriptions is one subset across both versions.
subsets_source: src-arxiv-2309-07544-v2
subsets_quote: Language Python Python Python Verilog Verilog Train 374 5,000 8,502 - Test 164 500
  5,000 143 156

lineage:
  role: root
lineage_note: Only what a source read states. No derivative maintained by another party was found in
  the sources read; RTLLM and NVIDIA's later CVDP are separate benchmarks, and CVDP's abstract
  (arXiv 2506.14074, read, not cited) does not name VerilogEval.

tags:
  - verilog
  - rtl-generation
  - hardware-description-language

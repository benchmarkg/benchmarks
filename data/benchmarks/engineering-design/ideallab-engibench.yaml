# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S8-T04)
  added_on: 2026-11-18
  last_verified: 2026-11-18
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2508-00831-v2
    - src-arxiv-2508-00831
    - src-github-engibench-readme-01f46d1
    - src-github-engibench-releases-atom
    - src-engibench-docs-home
    - src-engibench-docs-v0-0-1-home
    - src-engibench-docs-v0-2-0-home
    - src-engibench-docs-beams2d
    - src-engibench-docs-photonics2d
    - src-github-engiopt-readme-7a98ba5
    - src-github-engiopt-leaderboard-md-7a98ba5
    - src-hf-api-ideallab-beams-2d-50-100-v0
    - src-hf-api-ideallab-mto-2d-v0
    - src-hf-api-ideallab-photonics-2d-120-120-v1
    - src-arxiv-2609-00863
    - src-arxiv-2605-19743
  sources_note: >
    The paper's v2 PDF and abstract page and the two 2026 abstract pages have DOIs. The EngiBench README
    and release feed, five documentation pages, the EngiOpt README and LEADERBOARD.md, and three Hugging
    Face API records do not; the release feed and the two problem pages name people (handles, problem
    leads) and are withheld from archiving, and the rest are pending. The documentation's v0.1.0 home,
    PowerElectronics, MTO2D, Beams3D and Thermoelastic3D pages, the PhysicsBench and constrained-generation
    abstract pages (arXiv 2608.24056, 2512.01242), and Semantic Scholar's citation list were read and
    not cited.
  confidence: medium
  review_checks:
    - check: >
        Identity. Two unrelated benchmarks are called EngiBench, so under the allocation rules' shared-name
        rule ("the id carries a disambiguator (the maintainer or the game)") this one is ideallab-engibench,
        after the maintainer's GitHub organisation, as futuresearch-deep-research-bench carries its maintainer
        first. engibench-ideallab, or the bare engibench with the other taking a disambiguator, are the
        other readings. The other EngiBench (arXiv 2509.17677) was not drafted. Id allocation is a human
        act (04 S3).
      field: id
      source: src-arxiv-2508-00831
      quote: we introduce EngiBench, the first open-source library and datasets spanning diverse
        domains for data-driven engineering design
    - check: >
        Versions. The library's releases are versions (0.0.1 and 0.1.0 revisions, 0.2.0 a track-set that
        adds Thermoelastic3D), and the unreleased main branch is an unfrozen version because EngiOpt's
        specs are frozen against it. Problems are also versioned on their own (Beams2D v1, Photonics2D
        v1, several v1 and v2 datasets), recorded in the subsets' notes and the errata. A reviewer may
        prefer per-problem versions, since a score is defined by problem version, dataset version and
        spec version, not by library release.
      field: versions
    - check: >
        Photonics2D v0, used in the paper's cross-domain study, did not reproduce stored objectives on
        re-simulation (up to about 37 times off). The paper's Photonics2D numbers and any later v0 result
        are not comparable with v1, and the paper's other problems may need the same check.
      field: versions
      source: src-engibench-docs-photonics2d
      quote: so an optimized design did not reproduce its reported objective when re-simulated
    - check: >
        EngiOpt is counted as the harness and baselines of this entry, and its leaderboard as this benchmark's
        board: same organisation, and its specs and rows are per EngiBench problem. Its board has its
        own spec versions, metrics (iog, fog, viol beside mmd and dpp) and ranking flags, so under 04
        S4 it could be a separate benchmark linked by lineage. EngiAI (arXiv 2605.19743) is filed as a
        use; it is a framework with its own tiers and scores built on two problems and could be its own
        entry.
      field: lineage
    - check: >
        The EngiOpt leaderboard (Hugging Face IDEALLab/engiopt-leaderboard) answered HTTP 401, so no row,
        date or entrant was read, and only accounts with write access can submit. activity no-submission-channel
        and submission_process maintainer-run rest on that; leaderboard-live-no-round, or literature-only
        if the board is not yet live, are the other readings.
      field: activity
      source: src-github-engiopt-leaderboard-md-7a98ba5
      quote: The last step needs write access to the board repository.
    - check: >
        maintainer-competes-on-own-benchmark is set because only the maintainer's organisation can put
        rows on the board, and the board ranks EngiOpt's models. The paper's baselines are the maintainers'
        too. Both 2026 papers read here extend EngiOpt; their affiliations were not read, so whether any
        use is independent of the maintainers is open, and is a reviewer's call.
      field: governance.independence_flags
    - check: >
        Domain. structural-mechanical-design is primary as the largest group a leaf names (two of the
        paper's seven problems, four of ten now), not a majority: the heat-conduction problems, Airfoil
        and MTO2D have no leaf (taxonomy/_failures/2026-11-18-ideallab-engibench-001). physics/simulation-surrogates
        is rejected, though surrogate modelling is a supported paradigm and the paper's PowerElectronics
        experiment scores surrogate Pareto fronts against NgSpice.
      field: domain
    - check: >
        Dataset licence. The README and the paper say CC-BY-NC-SA for all datasets, but the Hugging Face
        records tag mto_2d_v0 as MIT and give photonics_2d_120_120_v1 no licence tag, and the newer v1
        and v2 records were not all read.
      field: data.dataset_licence
      source: src-hf-api-ideallab-mto-2d-v0
      quote: '"tags":["license:mit"'
    - check: >
        contamination_risk medium: the scored test conditions come with their optimised designs in public
        splits, and the maintainers write that a lookup table posts a perfect MMD; the board's copy rate
        keeps such a row out of the ranking, and a spec scoring conditions with no published design is
        proposed, not built. high is the other reading if releasing the reference designs beside the scored
        conditions counts as a protocol that evaluates on the data it releases.
      field: data.contamination_risk
      source: src-github-engiopt-leaderboard-md-7a98ba5
      quote: A v2 spec would draw conditions from the condition space rather than from dataset rows
    - check: >
        release_venue rests on the README's citation (NeurIPS 2025 proceedings, an OpenReview forum).
        The track (main or Datasets and Benchmarks) and the decision were not read: OpenReview's API returned
        a challenge page (403), and the arXiv v2 is preprint-styled.
      field: release_venue
      source: src-arxiv-2508-00831-v2
      quote: 'Learning and optimization library code: https://github.com/IDEALLab/EngiOpt. Preprint.'
    - check: >
        classical-algorithm is tagged from the stated aim (comparing optimisation and machine-learning
        algorithms), but no non-learned entrant is scored in the sources read; the problems' own optimisers
        produce the datasets and the best known objective. Drop it if only learned entrants are intended;
        evaluation_target would then be learned-system.
      field: designed_for_subjects
    - check: >
        Metrics drift. The paper defines COG, MMD, DPP, RVC and RF; EngiOpt's board and the 2026 flow-matching
        paper use a final optimality gap (fog) and an initial one (iog) and call constraint violation
        viol, which were not read in their definitions. A score labelled COG and one labelled fog are
        not the same measure. The paper also warns its own baseline results should not be overinterpreted.
      field: evaluation_method
      source: src-arxiv-2508-00831-v2
      quote: These results are surprising and should not be overinterpreted
  not_yet_available:
    - what: an EngiBench release containing Beams3D, MTO2D and the v1 problem datasets now on main
      expected: not announced (v0.2.0 of 2026-03-05 is the latest release)
      consequence: The main version is unfrozen, and results on PyPI's v0.2.0 score Photonics2D and
        Thermoelastic2D on their v0 datasets.
  unreachable:
    - url: https://api2.openreview.net/notes?id=YowD33Q89V
      http_status: 403
      consequence: The NeurIPS 2025 track and decision were not read; release_venue rests on the
        README's citation.
    - url: https://huggingface.co/api/datasets/IDEALLab/engiopt-leaderboard
      http_status: 401
      consequence: No leaderboard row was read; activity, submission_process and the independence
        flag rest on EngiOpt's documentation.
  personal_data_excluded:
    - source: src-arxiv-2508-00831-v2
      what: the authors' names, affiliations and two e-mail addresses on the first page, and two
        people thanked by name in the acknowledgements
    - source: src-arxiv-2508-00831
      what: the author list and the submitter line
    - source: src-github-engibench-readme-01f46d1
      what: the citation's author list
    - source: src-github-engiopt-readme-7a98ba5
      what: the citation's author list and a link to a personal GitHub account
    - source: src-engibench-docs-home
      what: the citation's author list
    - source: src-engibench-docs-v0-0-1-home
      what: the citation's author list
    - source: src-engibench-docs-v0-2-0-home
      what: the citation's author list
    - source: src-engibench-docs-beams2d
      what: the problem lead's name and GitHub handle
    - source: src-engibench-docs-photonics2d
      what: the problem lead's name and GitHub handle
    - source: src-github-engibench-releases-atom
      what: the GitHub handles of each release's publisher and of the credited contributors
    - source: src-arxiv-2609-00863
      what: the author list and the submitter line
    - source: src-arxiv-2605-19743
      what: the author list and the submitter line

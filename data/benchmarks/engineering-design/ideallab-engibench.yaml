      - date: 2026-07-14
        scope: Photonics2D v0
        description: v0 applied the density projection inside simulate as well as optimize, so a
          re-simulated optimised design did not reproduce its stored objective (up to about 37 times
          off). v1 fixes it with a regenerated dataset; v0 stays importable, so the paper's
          Photonics2D results are v0's.
        source: src-engibench-docs-photonics2d

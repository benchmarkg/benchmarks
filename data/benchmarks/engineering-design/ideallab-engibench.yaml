# data/benchmarks/engineering-design/ideallab-engibench.yaml
#
# P1-S8-T04, engineering-design entry 8. Filled from the EngiBench paper, arXiv 2508.00831 read as its v2 PDF
# (2025-08-11, styled "Preprint"), and its abstract page; the IDEALLab/EngiBench README pinned at commit 01f46d1
# (2026-11-13) and the repository's release feed (v0.0.1-alpha0 to v0.2.0); the documentation site
# (engibench.ethz.ch): the home pages for main, v0.0.1 and v0.2.0 and the Beams2D and Photonics2D pages; the
# IDEALLab/EngiOpt README and LEADERBOARD.md pinned at commit 7a98ba5 (2026-09-09); Hugging Face's API records of
# three datasets (beams_2d_50_100_v0, mto_2d_v0, photonics_2d_120_120_v1); and the abstract pages of two 2026
# papers that run EngiBench problems (arXiv 2609.00863, conditional flow matching; arXiv 2605.19743, EngiAI). The
# GitHub API records of both repositories were read for licence, dates and the problem folders. OpenReview's API
# (403, a challenge page) and the EngiOpt leaderboard dataset (401) could not be read. Every quote below is checked
# by the quote-substring validator against those Sources' committed extracts.
#
# Identity (04 S3-S4): a second, unrelated benchmark is also called EngiBench (arXiv 2509.17677, hierarchical LLM
# engineering problems, another maintainer); it is not drafted here. Under the allocation rules' shared-name rule
# this id carries the maintainer, IDEAL Lab (GitHub organisation IDEALLab), as its disambiguator (review_checks).
# The family entry is the library of problems; each problem is a subset, the library's releases are versions, and
# EngiOpt, the same lab's companion library of baselines and evaluator, is counted as the harness.

id: ideallab-engibench
name: EngiBench
aliases:
  - 'EngiBench: A Framework for Data-Driven Engineering Design Research'
  - 'EngiBench: A standard API, Open-Source Datasets and Benchmarks for Engineering Design'
  - EngiBench (IDEAL Lab)
aliases_note: >
  NAME COLLISION: a different benchmark, also called EngiBench (arXiv 2509.17677), poses hierarchical
  engineering problems to language models and has another maintainer; it was not read here, and an "EngiBench"
  score in a paper should be matched to its citation before it is attached to either entry. EngiOpt is
  the same lab's companion library of algorithms and its evaluator, not another name for this benchmark.
  MIDBench (the Maryland Inverse Design Benchmark) is the unpublished prototype the paper says EngiBench
  builds on.
tagline: Simulator-backed engineering design problems, from beam topology to airfoils and photonics,
  for generative models.
description: >
  An open-source Python library and set of datasets for data-driven engineering design from the IDEAL
  Lab at ETH Zurich, whose problem implementations were developed at the University of Maryland. Each
  problem pairs a simulator with a Hugging Face dataset of optimised designs and the conditions they were
  optimised for, behind one API: the design space, objectives and conditions, a constraint check, simulate,
  and for most problems an adjoint optimiser that polishes a design. The paper's release (v0.0.1, May
  2025) has seven problems: Airfoil (shape optimisation with RANS in MachAero, matching a lift coefficient
  at least drag), HeatConduction2D and 3D (placing conductive material for least thermal compliance),
  ThermoElastic2D (structural and thermal compliance), Beams2D (an MBB beam's compliance, after the 88-line
  topology optimisation code), Photonics2D (a wavelength demultiplexer in the ceviche FDFD solver) and
  PowerElectronics (sizing a DC-DC converter simulated in NgSpice). Thermoelastic3D followed in v0.2.0
  (March 2026), and Beams3D and MTO2D (thermofluid topology optimisation in OpenFOAM) are on the unreleased
  main branch, ten problems in all. The paper scores generated designs per problem on five measures: MMD
  to the dataset's designs, DPP diversity, the cumulative optimality gap (COG) of a generated design refined
  by the problem's optimiser against the best known objective, the ratio of designs violating a constraint
  (RVC) and the ratio of failed simulations (RF). Its baselines, from the companion library EngiOpt, are
  GANs and diffusion models for inverse design and MLP surrogates with NSGA-II, ten seeds each, with 50
  test conditions sampled per run; the authors present them as a proof of concept, not a comprehensive
  benchmark. No aggregate is defined. EngiOpt has since added a leaderboard that re-scores each checkpoint
  before ranking it within one problem and evaluation spec, but only the lab can submit, and the board
  could not be read. Problems are versioned on their own: Photonics2D v1 (2026) fixes a v0 bug by which
  re-simulated designs did not reproduce their stored objectives.
self_description:
  source: src-arxiv-2508-00831
  quote: we introduce EngiBench, the first open-source library and datasets spanning diverse domains
    for data-driven engineering design
external_ids:
  arxiv: '2508.00831'
paper:
  title: 'EngiBench: A Framework for Data-Driven Engineering Design Research'
  arxiv: '2508.00831'
  version_read: v2
  source: src-arxiv-2508-00831-v2
released: 2025-05-13
released_note: The v0.0.1 release, which the release note calls the paper version and the paper
  names as the code it used. Alpha releases went to PyPI from 2025-04-30, the repository was created
  on 2024-09-02 (GitHub API), and the paper's arXiv v1 followed on 2025-06-02.
released_source: src-github-engibench-releases-atom
released_quote: Repository/851123803/v0.0.1 2025-05-13T12:58:51Z v0.0.1 Paper version. API is
  stable, and all problems have been implemented.
release_venue: NeurIPS 2025 (39th Conference on Neural Information Processing Systems)
release_venue_note: From the README's citation, which points to an OpenReview forum; the track and
  the decision were not read (OpenReview's API answered with a challenge page), and the arXiv v2 is
  styled as a preprint (review_checks).
release_venue_source: src-github-engibench-readme-01f46d1
release_venue_quote: booktitle = {Proceedings of the 39th Conference on Neural Information
  Processing Systems ({NeurIPS} 2025)}

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: engineering-design/structural-mechanical-design
  secondary:
    - engineering-design/circuit-eda
    - physics/optics-photonics
domain_basis:
  reason: >
    Every problem's scored artifact is a design (a material layout, an airfoil shape, a photonic device,
    a set of circuit parameters) that the problem's simulator evaluates against engineering objectives
    and constraints, which is the family's inclusion test. No engineering-design leaf takes most problems
    and the paper's claim is breadth across domains. The structural problems are the largest group a leaf
    names: Beams2D and ThermoElastic2D of the paper's seven, with Beams3D and Thermoelastic3D added, four
    of ten. PowerElectronics sizes a converter circuit (circuit-eda) and Photonics2D designs an optical
    demultiplexer (optics-photonics: "designing optical and photonic systems"). The two heat-conduction
    problems, Airfoil and MTO2D have no leaf (logged as taxonomy/_failures/2026-11-18-ideallab-engibench-001).
  source: src-arxiv-2508-00831-v2
  quote: as well as in physics domain, including aerodynamics, structural elasticity, thermal
    diffusion, and power electronics
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: >
      Surrogate-based optimisation is one supported paradigm, and the paper's PowerElectronics experiment
      compares its surrogates' Pareto fronts with NgSpice's. But that is one experiment of four, the cross-domain
      study and the EngiOpt board score generated designs, and the problems' simulators score the designs
      rather than standing as the reference a learned emulator is fitted to (review_checks).
    source: src-arxiv-2508-00831-v2
    quote: confirmed that the surrogate and NgSpicegenerated fronts stem from different
      distributions
  - term: physics/fluid-dynamics
    reason: Airfoil's drag and lift come from RANS flow, but the scored artifact is the shape, not a
      predicted flow field, and it is one problem of ten.
  - term: engineering-design/cad-geometry-generation
    reason: Designs are density grids, coordinate vectors and parameter vectors generated from
      numeric conditions, not CAD geometry produced to a stated specification.
  - term: engineering-design/process-control-optimization
    reason: Nothing is controlled or operated; every problem asks for a static design (the paper
      names dynamic components as a limitation).
  - term: code/repository-scale-se
    reason: Entrants on the EngiOpt board are submitted as model code and checkpoints, but the score
      is the simulated design, and the code family's exclusion sends code that is the means to
      another field's result elsewhere.

capability:
  - optimization
  - constraint-satisfaction
  - generation-fidelity
capability_basis:
  optimization:
    reason: Each problem states objectives (compliance, drag at a target lift, field overlap, DC
      gain error and voltage ripple), and COG scores how far a generated design, refined by the
      problem's optimiser, stays from the best known objective; the 2026 flow-matching paper takes
      COG and a final gap as its primary metrics.
    source: src-arxiv-2508-00831-v2
    quote: The cumulative optimality gap (COG) measures how far a generated design lags behind the
      best known objective value throughout the optimization process.
  constraint-satisfaction:
    reason: RVC counts a generated design as failing if any of the problem's inequality or equality
      constraints is violated, and every problem has a constraint check; the paper claims
      feasibility under hard constraints as a contribution.
    source: src-arxiv-2508-00831-v2
    quote: The ratio of violated constraints (RVC) measures how many generated samples fail to
      satisfy constraints on the designs.
  generation-fidelity:
    reason: For inverse-design models MMD compares the generated designs with the dataset's
      optimised designs for the sampled conditions, which is closeness to a reference distribution.
    source: src-arxiv-2508-00831-v2
    quote: A common metric is maximum mean discrepancy (MMD, [23]), which measures the distance
      between two distributions.
capability_considered_and_rejected:
  - term: creativity-novelty
    reason: >
      DPP rewards spread-out designs but measures variety with no usefulness criterion, which the term's
      exclusion rules out. EngiOpt's board measures novelty and a copy rate, keeps them unranked and leaves
      memorising rows out of the ranking, which is close to penalising reproduction (review_checks).
    source: src-arxiv-2508-00831-v2
    quote: Determinantal point processes (DPP, [37]) quantify diversity by favoring well-spread-out
      samples.
  - term: sample-efficiency
    reason: No budget of simulations or training samples is fixed; reducing simulation calls is the
      motivation, not a scored condition.
  - term: distribution-shift-generalization
    reason: The heat-conduction test split holds out two volume and two adiabatic-region values from
      training, a deliberate shift, but in one problem pair only and with no separately reported
      out-of-distribution score.
    source: src-arxiv-2508-00831-v2
    quote: we randomly excluded two unique values of the volume limit and two unique values of the
      adiabatic region from the training set
  - term: scientific-prediction
    reason: Surrogates predict objective values, but no published score ranks their prediction
      error; the surrogate experiment re-simulates the designs they find.

evaluation_method:
  - domain-metric
  - statistical-fit
  - constraint-check
evaluation_method_basis:
  reason: >
    domain-metric for COG and the objectives behind it, computed by each problem's simulator in its own
    engineering units (compliance, drag coefficient, field overlap, DC gain), with the best known objective
    estimated by the problem's adjoint optimiser; statistical-fit for MMD, a two-sample distance between
    the generated and the dataset's designs, as guacamol records its KL benchmark; constraint-check for
    RVC, the problem's constraint check applied to each design before simulation. RF counts designs whose
    simulation failed. The score comes from running the problem's simulator on each submitted design,
    which no term names (logged as taxonomy/_failures/2026-11-18-ideallab-engibench-002).
  source: src-arxiv-2508-00831-v2
  quote: typically estimated using an adjoint solver
evaluation_method_considered_and_rejected:
  - term: simulation-rollout
    reason: No policy acts in episodes; one static design is simulated once, and the objectives are
      unbounded physical quantities rather than a bounded success score.
  - term: execution-tests
    reason: engdesign takes it for designs run through simulators, but its definition is for
      produced code, and EngiBench's designs are arrays and vectors, not programs.
  - term: composite
    reason: The paper reports each metric per problem and EngiOpt ranks one metric at a time within
      a problem; nothing combines them.
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: >
    The intended entrants are inverse-design and surrogate models trained from scratch on each problem's
    dataset (GANs, diffusion models, MLP surrogates), for a task the engineering-design discipline defines:
    domain-specialist-model's inclusion test. The library is also stated to compare optimisation algorithms,
    which contain no learned component; but the paper and the EngiOpt board score only learned models,
    and the problems' own optimisers serve as the reference that produces the datasets and the best known
    objective (review_checks).
  source: src-arxiv-2508-00831
  quote: EngiBench provides a unified API and a curated set of benchmarks -- covering aeronautics,
    heat conduction, photonics, and more -- that enable fair, reproducible comparisons of
    optimization and machine learning algorithms, such as generative or surrogate models.
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: Surrogates are one entrant type, but they are scored through the designs their
      optimisation finds, not by their agreement with the simulator as a stand-in.
  - term: generative-media-model
    reason: Many designs are image-like density grids, but the score is a design's simulated
      performance and feasibility, not a property of media.
  - term: agent-scaffold
    reason: A 2026 paper drives two problems with language-model agents (as_used), but nothing in
      the benchmark's own sources is designed for agents.

as_used:
  - protocol: Four language-model backends act as tool-connected agents on Beams2D and Photonics2D,
      scored on completing workflow, retrieval, HPC-orchestration and training-code tasks and, where
      an agent writes the training code, on the MMD of the inverse-design model it trains.
    split: Beams2D and Photonics2D
    source: src-arxiv-2605-19743
    quote: We evaluate four LLM backends on the EngiBench Beams2D and Photonics2D problems using
      EngiAI, a LangGraph reference implementation.
    note: EngiAI (arXiv 2605.19743, May 2026, revised August 2026), a capability-based evaluation
      framework for engineering agents presented at IDETC-CIE 2026. It may be a benchmark of its own
      built on two EngiBench problems (review_checks).

lifecycle: active
lifecycle_basis:
  reason: Papers of 2026 still run the problems through the library's protocol, the repository was
    last pushed on 2026-11-13 (GitHub API), and the maintainers added a leaderboard in 2026.
  source: src-arxiv-2609-00863
  quote: In this work, we add conditional flow matching (CFM) to EngiOpt and compare it with a
    conditional diffusion model and a conditional generative adversarial network (cGAN) on
    structural (beams2d) and thermal (heatconduction2d) benchmarks from EngiBench using the same
    downstream optimization protocol.
activity: no-submission-channel
activity_note: EngiOpt's leaderboard (the Hugging Face dataset IDEALLab/engiopt-leaderboard) accepts
  rows only from accounts with write access to it, and its record answered HTTP 401 on 2026-11-18; a
  route for outside submissions is an open issue. Others report results in their own papers
  (review_checks).
activity_basis:
  reason: The one route that collects results is closed to anyone outside the lab.
  source: src-github-engiopt-leaderboard-md-7a98ba5
  quote: None of that is built here, because nothing outside `IDEALLab` can submit yet

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: CGAN2D and CDiffusion2D (the paper's conditional GAN and conditional diffusion
      baselines)
    source: src-arxiv-2508-00831-v2
    observed_on: 2026-11-18
    quote: conditional deep convolutional GAN (CGAN2D), and a conditional diffusion model
      (CDiffusion2D)
  - system: Conditional flow matching added to EngiOpt (arXiv 2609.00863)
    source: src-arxiv-2609-00863
    observed_on: 2026-11-18
    quote: CFM achieves the lowest measured COG, FOG, maximum mean discrepancy (MMD), and
      volume-fraction deviation on both tasks
evaluation_target: mixed
evaluation_target_note: Designed for learned models and optimisation algorithms alike; every
  published score read here is a learned model's.
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each problem's simulator computes the objectives of a design, its
  optimiser supplies the best known objective for COG, and the dataset's optimised designs are the
  reference distribution for MMD.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The library, the simulators (installed natively or run in published containers), the
    datasets and the baselines are public, so anyone can train a model and score it the paper's way.
  source: src-arxiv-2508-00831-v2
  quote: we support integration with Docker, Podman, and Apptainer

task:
  exists: true
  input:
    - a problem's conditions (for instance volume fraction and load position, wavelengths, Mach and
      Reynolds numbers), with its design space, objectives, constraint check and dataset of
      optimised designs
    - for generative models in the paper, 50 conditions sampled from the problem's test split per
      seed
  output: Designs in the problem's design space (density grids, airfoil coordinates with an angle of
    attack, circuit parameter vectors), or the designs found by optimising on a surrogate.
  scoring: Per problem and metric, mean and standard deviation over ten seeds; MMD to the dataset,
    DPP diversity, COG over the optimiser's refinement of each design, RVC and RF. No aggregate.
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The test splits, with their optimised designs, are public.
  source: src-arxiv-2508-00831-v2
  quote: 50 conditions were sampled uniformly at random with replacement from the configurations in
    the test datasets.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every problem's dataset, test split included, is an ungated Hugging Face dataset under
      the IDEALLab organisation.
    source: src-hf-api-ideallab-beams-2d-50-100-v0
    quote: '"gated":false'
  refresh: versioned-releases
  refresh_basis:
    reason: The library is released in numbered versions, problems and their datasets carry their
      own version numbers, and problems are added between releases.
    source: src-arxiv-2508-00831-v2
    quote: implementations and datasets are versioned (see line 1 in Listing 1), ensuring
      traceability when changes affect results.
  data_provenance:
    - simulation-generated
  data_provenance_note: Each dataset holds designs optimised by the problem's own optimiser and
    simulator over sampled conditions (grids, random draws or Latin hypercube samples), some reused
    from earlier studies; generating them took several thousand CPU-hours.
  data_provenance_source: src-arxiv-2508-00831-v2
  data_provenance_quote: Each ENGIBENCH problem comprises a simulation engine and an associated
    dataset
  contamination_risk: medium
  contamination_risk_note: >
    The scored conditions come from public test splits that ship their optimised designs, so a model tuned
    on them, or a lookup table, reaches the reference. The maintainers measure this on their board (novelty
    and a copy rate that keeps a memorising row out of the ranking) rather than prevent it, and propose
    scoring on conditions with no published design. The protocol trains on the training split only, and
    no source shows a test design inside a prescribed training set, so the route is open rather than evidenced
    in use, as tdc-admet reads its open test labels (review_checks).
  contamination_risk_source: src-github-engiopt-readme-7a98ba5
  contamination_risk_quote: a lookup table keyed on the condition vector returns the dataset-optimal
    designs and posts a perfect `mmd` and a zero `viol`
  contamination_evidence:
    - source: src-github-engiopt-leaderboard-md-7a98ba5
      stance: supports
      quote: so anyone can recompute exactly which 50 test rows are scored
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: There is no headline metric. COG is measured against the best known
    objective, which a design may beat; MMD reaches zero by copying the dataset; DPP has no upper
    bound; RVC and RF are bounded at zero but are feasibility rates, not the ranking.
  dataset_licence: CC-BY-NC-SA-4.0
  dataset_licence_note: The README states it for all the datasets and the paper says CC-BY-NC-SA.
    Hugging Face's records disagree for some (mto_2d_v0 is tagged MIT, and photonics_2d_120_120_v1
    carries no licence tag; review_checks).
  dataset_licence_source: src-github-engibench-readme-01f46d1
  dataset_licence_quote: All the associated datasets are licensed under the CC-BY-NC-SA 4.0 license.
  size:
    - count: 10
      unit: simulator-backed design problems
      subset: main at commit 01f46d1 (eight released in v0.2.0)
      source: src-engibench-docs-home
      quote: Problems Airfoil Beams2D Beams3D MTO2D Thermoelastic Thermoelastic2D Thermoelastic3D
        Photonics2D PowerElectronics HeatConduction HeatConduction2D HeatConduction3D External
        Problems
    - count: 7
      unit: simulator-backed design problems
      subset: v0.0.1, the paper's release
      source: src-engibench-docs-v0-0-1-home
      quote: Problems Airfoil Beams2D Thermoelastic2D Photonics2D PowerElectronics Heat Conduction
        Heat Conduction 2D Heat Conduction 3D Utils
    - count: 50
      unit: test conditions sampled per problem and seed to score a generative model
      subset: the paper's cross-domain study
      source: src-arxiv-2508-00831-v2
      quote: 50 conditions were sampled uniformly at random with replacement from the configurations
        in the test datasets.
    - count: 243
      unit: test designs (3,880 train, 728 validation)
      subset: Beams2D default dataset (beams_2d_50_100_v0)
      source: src-hf-api-ideallab-beams-2d-50-100-v0
      quote: '{"name":"test","num_bytes":9920992,"num_examples":243}'
    - count: 441
      unit: optimised topologies per dataset (361 train, 40 validation, 40 test)
      subset: HeatConduction2D and HeatConduction3D
      source: src-arxiv-2508-00831-v2
      quote: By combining all pairs, we generated 441 optimized topologies.
    - count: 1000
      unit: optimised thermoelastic designs on a 64 x 64 grid
      subset: ThermoElastic2D v0 dataset
      source: src-arxiv-2508-00831-v2
      quote: contains a set of 1000 optimized thermoelastic designs in a 64x64 domain
    - count: 4608
      unit: simulated designs in each of the dataset's three sampling parts, split 7/2/1
      subset: PowerElectronics v0 dataset
      source: src-arxiv-2508-00831-v2
      quote: 'This results in: 26 × 23 × 9 = 4608 samples.'
    - count: 1400
      unit: Latin hypercube samples of flow and constraint conditions
      subset: Airfoil dataset
      source: src-arxiv-2508-00831-v2
      quote: 1400 parameter combinations were chosen using Latin hypercube sampling (LHS)
    - count: 200
      unit: test designs (1,594 train, 199 validation)
      subset: Photonics2D v1 dataset (photonics_2d_120_120_v1)
      source: src-hf-api-ideallab-photonics-2d-120-120-v1
      quote: '{"name":"test","num_bytes":11784800,"num_examples":200}'
    - count: 5666
      unit: converged half-domain designs
      subset: MTO2D v0 dataset (mto_2d_v0)
      source: src-hf-api-ideallab-mto-2d-v0
      quote: It contains 5,666 converged (400, 200)
  size_note: The Airfoil split the paper gives (748 training, 140 testing, 47 validation) sums to
    935 of the 1,400 samples, and the reason is not stated. Beams2D has three datasets at different
    resolutions. The Beams3D and Thermoelastic3D datasets were not read.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: IDEAL Lab, ETH Zurich
  maintainer_basis:
    reason: The documentation site is signed by the lab, the repositories and datasets sit in its
      IDEALLab organisation, and the paper commits the lab and ETH Zurich's Scientific IT Services
      to long-term maintenance. The problems and baselines were developed at the University of
      Maryland before the paper.
    source: src-engibench-docs-home
    quote: By ETH Zurich's IDEAL Lab
  maintainer_type: academic-lab
  maintainer_type_note: The paper's own words for the maintenance commitment name the lab and the
    university's research IT service; no company is involved.
  maintainer_type_source: src-arxiv-2508-00831-v2
  maintainer_type_quote: are committed to the long-term maintenance of the project
  submission_process:
    - maintainer-run
  submission_process_note: >
    The paper's baselines are the maintainers' own runs. EngiOpt's board publishes rows from accounts
    with write access to it and ranks a row only after the lab's runner has re-fetched the checkpoint
    and scored it again, which would be sandboxed-rerun if outsiders could submit; nothing outside the
    lab can, and the board was not readable. literature-only is the other reading (review_checks).
  submission_process_source: src-github-engiopt-leaderboard-md-7a98ba5
  submission_process_quote: Nothing is ranked until a runner has fetched the weights itself and
    reproduced the score.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-github-engiopt-leaderboard-md-7a98ba5
      quote: None of that is built here, because nothing outside `IDEALLab` can submit yet
  independence_flags_note: >
    The flag rests on the organisation: only IDEALLab, the maintainer's own organisation, can put rows
    on the board, and its entrants are EngiOpt's models. The two 2026 papers read here build on EngiOpt;
    their authors' affiliations were not read, so whether any published use is independent of the maintainers
    is open (review_checks). The funders are US government agencies (DARPA, NSF, ARPA-E, ARL), none an
    evaluated party.
  independence_assessed: true
  funding:
    source: src-arxiv-2508-00831-v2
    quote: DARPA-16-63-YFA-FP-059, NSF CAREER 1943699

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: simulator-required
  compute_tier_note: Each problem needs its simulator, installed natively or run in a container
    (Airfoil's MachAero, the heat-conduction problems' Dolfin-adjoint, NgSpice, ceviche, OpenFOAM
    for MTO2D). One simulation takes from 0.19 s (Beams2D) to 31.6 s (HeatConduction3D) on a laptop
    CPU. The paper's training took about 80 GPU-hours on RTX 4090 nodes and the evaluation of its
    designs 55 hours.
  compute_tier_basis:
    reason: Scoring any design means simulating it in the problem's own environment.
    source: src-arxiv-2508-00831-v2
    quote: Simulation times have been averaged across 10 runs on a MacBook Pro M3 Max (on the CPU
      cores).
  reproducibility_tier: automatable-with-simulator
  reproducibility_tier_basis:
    reason: Training, generation and scoring run end to end with the library and EngiOpt, but only
      inside each problem's simulator; some problems run only in a container or with native
      dependencies.
    source: src-github-engibench-readme-01f46d1
    quote: Others require native installation of dependencies, please consult the documentation of
      the specific problem.
  reproducibility_blockers:
    - specific-simulator-build
  reproducibility_blockers_note: The paper names simulator versions and configurations as a source
    of inconsistent results, the newer problems pin container images by digest, and EngiOpt notes
    that sampling from one seed differs between CPU and CUDA.
  harness_availability: official-harness
  harness_availability_basis:
    reason: The maintainers publish the evaluator that produces their board's scores, and anyone can
      run its audit command on a row.
    source: src-github-engiopt-readme-7a98ba5
    quote: every model is scored by one shared evaluator through the `Generator` contract in
      `adapter.py`
  harness: EngiBench's problem classes (check_constraints, simulate, optimize) with EngiOpt's shared
    evaluator (python -m engiopt.evaluate) and its frozen evaluation specs
  harness_source: src-github-engiopt-readme-7a98ba5
  harness_quote: The committed evaluation specs are frozen against the current EngiBench, whose
    `photonics2d` and `thermoelastic2d` read the `v1` datasets; the newest PyPI release (0.2.0)
    still points those two at `v0`.
  submission_channel_note: No channel is open to outsiders; EngiOpt's board takes rows only from
    accounts with write access to its Hugging Face repository (see activity).
  code_licence: GPL-3.0
  code_licence_note: EngiOpt is GPL-3.0 too (GitHub's licence metadata for both repositories, read
    2026-11-18).
  code_licence_source: src-github-engibench-readme-01f46d1
  code_licence_quote: The code of EngiBench and [EngiOpt](https://github.com/IDEALLab/EngiOpt) is
    licensed under the GPLv3 license.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the resolved profile: the problem's simulator and its build, the number of conditions and generated
  # designs scored, what the model was trained on (the test split's designs are public), the seeds reported (the
  # board requires seeds 1-3 to stop cherry-picking) and the hardware (CPU and CUDA sample differently). The
  # problem version and the evaluation spec are carried by the benchmark version and subset_used.
  material_extra:
    - simulator
    - simulator_version
    - n_samples
    - training_data_policy
    - selection_strategy
    - hardware_platform
aggregation_policy: none-by-design
aggregation_policy_note: The paper reports every metric per problem, and EngiOpt ranks one metric at
  a time within a problem and evaluation spec; no figure combines problems or metrics.
aggregation_policy_basis:
  reason: The board ranks within one problem and spec version only.
  source: src-github-engiopt-readme-7a98ba5
  quote: Ranks restart at 1 within each `(problem_id, spec_version)`


    version_kind: revision
    released: 2025-11-19
    changes: >
      The same seven problems. Breaking API changes (problems require a seed, Apptainer replaces Singularity,
      constraints and conditions deduplicated) and fixes to Airfoil and the constraint check; NgSpice
      45 and Python 3.13 supported.
    supersedes_version: 0.0.1
    superseded_by: 0.2.0
    frozen: true
    sources:

lineage:
  role: root
  role_note: >
    The paper calls MIDBench, the Maryland Inverse Design Benchmark, an unpublished prototype EngiBench
    builds on; it has no entry. EngiOpt (same organisation) is counted as this benchmark's harness and
    baselines, and EngiAI (arXiv 2605.19743) as a use (as_used); either could be a separate entry linked
    by lineage (review_checks).
  role_source: src-arxiv-2508-00831-v2
  role_quote: which served as an initial prototype but did not reach the maturity needed for
    publication or widespread adoption


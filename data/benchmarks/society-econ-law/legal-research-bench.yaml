# data/benchmarks/society-econ-law/legal-research-bench.yaml
#
# P1-S12 sweep follow-up: a new society-econ-law entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from the Legal Research Bench paper, arXiv 2610.00609 read as its v1 PDF (2026-09-30, the only version), and
# its abstract page; Vals AI's Legal Research Bench page (board and methodology, updated 2026-11-19), its benchmarks
# index and its methodology and about pages, all with scripts and styles stripped; and the harness repository's
# README and LICENSE at its newest commit, ef5c313 (2026-11-12). GitHub's API was read for the repository's dates,
# commits, file tree and licence metadata, and the public sample file (data/public.json) was opened for its fields;
# neither is a quoted Source. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.
#
# The id is a proposal from the benchmark's name (the paper abbreviates it LRB; the README says "Legal Research
# Agent benchmark"); allocation is a human act (04 S3), and no catalogued id, stub, retired id or open branch is
# near it. One Vals benchmark under one name: the paper's 413-question corpus and the board's 208-question test
# split are the same release, so it is one version. Harvey's Legal Agent Benchmark, which the paper calls
# concurrent work, is a separate benchmark by another maintainer, and Immigration Bench (immigration-bench) is a
# separate Vals benchmark, although Legal Research Bench has an Immigration practice area.

id: legal-research-bench
name: Legal Research Bench
aliases:
  - LRB
  - Legal Research Agent benchmark
tagline: Attorney-written US legal research questions for a tool-using agent, graded all-pass on
  expert rubrics.
description: >
  A benchmark from Vals AI of the research a junior associate or paralegal does on US law. Practising
  attorneys wrote each of 413 questions around a novel fact pattern, with a gold answer, the authorities
  it rests on and a binary rubric, and a second attorney reviewed it; the questions span eight practice
  areas of federal and state law and are anchored to an answer date where the law may have changed. An
  agent answers inside Vals' own harness, which gives it CourtListener case-law search, Tavily web search,
  page parsing, retrieval over what it stored and a submit tool, with three hours per question. An LLM
  judge (GPT-5.4, chosen after a calibration study against three attorneys) checks every rubric criterion,
  and a question counts only if all of them pass and every cited authority verifies (all-pass); a weighted
  partial-credit score is reported beside it. The corpus is split into 5 public questions, 200 private
  validation questions that Vals licenses and 208 test questions that stay private. The paper's results,
  for thirteen models, are over all 413 questions (best 42.9%); the board's are over the test split only
  (101 models; 56.25% at the top on 2026-11-19). The harness is MIT-licensed on GitHub; the answers, rubrics
  and judge are not released.
self_description:
  source: src-arxiv-2610-00609
  quote: a benchmark of 413 open-ended U.S. legal research questions written by experts, each paired
    with a gold answer, supporting authorities, and a binary grading rubric.
external_ids:
  arxiv: '2610.00609'
paper:
  title: 'Legal Research Bench: Measuring End-to-End Reliability in Long-Horizon Legal Research Agents'
  arxiv: '2610.00609'
  version_read: v1
  source: src-arxiv-2610-00609-v1
released: 2026-09-30
released_note: The paper's first and only arXiv version. The harness repository is older, created on
  2026-06-22 with its initial commit on 2026-06-23 (GitHub API), and no page read dates the board's
  first results.
released_source: src-arxiv-2610-00609
released_quote: '[Submitted on 30 Sep 2026]'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/legal-reasoning
  secondary:
    - agents-tooluse/research-agents
domain_basis:
  reason: The scored quantity is whether a research answer reaches the attorneys' legal conclusion
    on a fact pattern, with the authorities it needs, checked criterion by criterion; the items are
    built to need legal reasoning and to have an answer determinate enough for attorneys to agree,
    which is the legal-reasoning leaf's definition (applying legal rules to a set of facts to reach
    a determinate conclusion). The family's exclusion for autonomous operation does not fit, because
    the answer is scored and not the path to it. The agent gathers authorities from case law and the
    web and must cite them, and an invalid citation fails the item, which is research-agents'
    gather, synthesise and cite, carried as secondary.
  source: src-arxiv-2610-00609-v1
  quote: Items are designed to require legal reasoning rather than factual lookup, are written
    around novel fact patterns to reduce memorization, and are included only when the correct answer
    is objective enough for attorney agreement.
domain_considered_and_rejected:
  - term: agents-tooluse/long-horizon-autonomy
    reason: The agents-tooluse family was considered first as primary, since the paper's title
      frames the subject as long-horizon legal research agents and a run may last three hours. But
      the grader scores the legal content of the submitted answer against an attorney rubric, not
      what the loop did, and Vals fixes the loop so that only the model varies, as for
      finance-agent-benchmark (review_checks).
    source: src-arxiv-2610-00609-v1
    quote: LRB follows this outcome-level view, scoring the submitted answer rather than the path
      taken to it.
  - term: society-econ-law/legal-document
    reason: The answer reads like a research memo, but no document is supplied to extract from or
      review, and the rubric scores the legal conclusion and authorities, not a drafted document's
      form.
  - term: language/retrieval-qa
    reason: Authorities must be found before answering, but from live case-law and web search
      through tools rather than a fixed corpus; research-agents is the narrower fit.
  - term: agents-tooluse/tool-api-calling
    reason: The five tools are called, but whether they were selected and invoked correctly is not
      scored, only the submitted answer.
  - term: society-econ-law/economically-valuable-work
    reason: The tasks are associates' and paralegals' research, but an LLM judge checks rubric
      criteria; nothing is compared with a professional's work product, the leaf's test.
    source: src-vals-ai-legal-research
    quote: All questions, gold-standard answers, and rubrics are authored and peer-reviewed by
      practicing lawyers, drawing on real research questions that arise in legal practice.

capability:
  - tool-use
  - factual-precision
capability_basis:
  tool-use:
    reason: The authority a correct answer needs is reached only through the case-law, web, parsing
      and retrieval tools. In the paper's ablation without tools, all-pass falls by 22.5 points on
      average and every tool-using model beats every model without them; the strongest models lose
      the most, which the paper reads as locating and reading authority rather than recalling law.
    source: src-arxiv-2610-00609-v1
    quote: In a no-tool, single-shot setting, performance collapses across all thirteen models
      (Table 4)
  factual-precision:
    reason: Each rubric criterion is a required element (a statute, rule, controlling authority or
      interpretation) checked on its own, and every cited authority must verify, so the particulars
      inside a free-form answer are scored one by one.
    source: src-arxiv-2610-00609-v1
    quote: any invalid cited URL fails a source check that marks the entire response wrong
capability_considered_and_rejected:
  - term: deductive-reasoning
    reason: The conclusion follows from authority the agent has to find, not from premises stated in
      the item, and the term needs correctness decidable from the stated premises alone.
  - term: knowledge-recall
    reason: The tools supply the authority; a model's recall helps it search but is not what an item
      can be answered from, given the ablation's collapse without tools.
    source: src-arxiv-2610-00609-v1
    quote: The strongest models lose the most (Claude Opus 4.8 falls 34.1 points)
  - term: temporal-reasoning
    reason: Temporal Validity (whether a rule is still good law, or how it changed) marks 66 of the
      413 questions as a difficulty attribute, not the benchmark's claim, and questions whose law
      may change are anchored to an answer date.
    source: src-arxiv-2610-00609-v1
    quote: When legal authority may change over time, questions are temporally anchored with an
      explicit answer date
  - term: reliability-consistency
    reason: The paper's "reliability" is all-pass over a question's criteria, not success across
      repeated trials; each model ran once per question.
    source: src-arxiv-2610-00609-v1
    quote: each model was evaluated in a single run per question
  - term: long-horizon-execution
    reason: A run may last three hours, but each item is scored on its final answer, and a failed
      tool call can be retried, so no step is unrecoverable by design.

evaluation_method:
  - rubric-graded
  - model-graded-judge
evaluation_method_note: GPT-5.4 judges every criterion. The paper chose it among three candidates
  (with Claude Sonnet 4.6 and Gemini 3.1 Pro Preview) after three attorneys and the judges scored
  341 rubric items; it agrees with the attorneys' majority on 87.4% of items, against 83.4% for one
  attorney with that majority. Criteria weigh +1, +2 or +3, with at least one +3 for the central
  conclusion; all-pass is the headline and weighted pass, the share of rubric weight earned, is
  secondary. The source check is part of grading and fails an answer whose cited URL is invalid or
  does not point to the authority claimed.
evaluation_method_basis:
  reason: Named criteria from the attorneys' answer are checked one by one and combined (every one
    must pass for all-pass), and an LLM judge applies them, so both terms apply.
  source: src-vals-ai-legal-research
  quote: 'Our primary metric is all-pass: a question counts as correct only if the response satisfies
    every rubric item'
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: Attorneys wrote and reviewed the items and graded 341 rubric items to calibrate the
      judge; no published score comes from them.
    source: src-vals-ai-legal-research
    quote: GPT 5.4 agrees with the majority vote 87.4% of the time, compared to an average human
      baseline agreement of 83.4%.
  - term: exact-match
    reason: Nothing is string-matched; whether a cited URL points to the authority claimed is part
      of the judged source check.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Vals runs every model in its own harness with the same five tools, prompt and three-hour
    limit, and each row on the board names a model; the methodology page states the purpose of the
    fixed harness.
  source: src-vals-ai-methodology
  quote: Models are called through a fixed harness that we control, so that differences in scores
    reflect the model rather than the scaffold.
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: The README says how to run one's own harness, and the paper chose a time budget so that
      other harnesses can be compared, but the board's rows name models, and no source says that any
      row varies the loop (review_checks).
    source: src-arxiv-2610-00609-v1
    quote: A time budget better reflects real research workflows and makes the evaluation comparable
      across alternative harnesses, tools, and agent implementations.
  - term: tool-augmented-model
    reason: The model decides its own tool calls and when to submit, which the term's exclusion
      sends to model-in-benchmark-harness.
  - term: reasoning-model
    reason: The board plots accuracy at each model's reasoning efforts, but the ranking is one row
      per model configuration; the effort is a condition of each claim (comparability).

lifecycle: active
lifecycle_basis:
  reason: Vals runs new models on the board, which the index dates 2026-11-19 with 101 models
    tested; the paper (September 2026) evaluated thirteen. No third-party use was found
    (review_checks).
  source: src-vals-ai-benchmarks-index
  quote: 'Legal Proprietary Legal Research Bench Updated: 11/19/2026 Models Tested: 101'
activity: no-submission-channel
activity_note: Vals chooses the models and runs them; no page read offers a submission route, and
  with the test split private nobody else can produce a board score. Some rows name systems, not
  general models (review_checks).
activity_basis:
  reason: Every published score is Vals' own run on its private test set.
  source: src-vals-ai-methodology
  quote: 'Test Set: This dataset remains private at all times, and is the only dataset used for the proprietary
    benchmark results we publish.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Gemini 4 Neon
    source: src-vals-ai-legal-research
    observed_on: 2026-11-28
    quote: As of November 19, 2026, Gemini 4 Neon ranks first on Legal Research Bench with 56.25%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: The gold answers, source lists and rubrics are the attorneys' own, each reviewed by at
    least one more attorney; the judge applies the rubrics.
  source: src-arxiv-2610-00609-v1
  quote: Each LRB item is authored by practicing U.S. attorneys and consists of an open-ended legal
    research question, a gold answer, a curated source list, and a binary grading rubric
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: Every board score is on a test split only Vals holds, graded by a judge and rubrics that
    are not released; anyone can run the harness on the five public questions, which have no answers
    or rubrics to score against.
  source: src-vals-ai-legal-research
  quote: The Test set will remain private. All results reported on this page are based solely on the
    Test set to prevent overfitting.

task:
  exists: true
  input:
    - an open-ended US legal research question on a novel fact pattern, such as whether a Virginia
      company that leases trailers under a finance lease may stop paying after the manufacturer's
      bankruptcy, anchored to an answer date where the law may have changed
    - the harness's prompt and five tools, CourtListener case-law search, Tavily web search, page
      parsing into a store, retrieval over the stored documents, and a final-answer submission
  output: Tool calls under a three-hour wall-clock limit, then a final answer with its cited
    authorities, submitted through the submission tool.
  scoring: The judge marks each binary criterion of the question's rubric met or not; a source check
    fails the answer if a cited URL is invalid or does not support the authority claimed. All-pass,
    the share of questions with every criterion met and the check passed, is the headline; weighted
    pass, the share of rubric weight earned, is reported beside it.
  source: src-arxiv-2610-00609-v1
  quote: Criteria are weighted [+1], [+2], or [+3], with at least one [+3] item capturing the
    central legal conclusion.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: "Public: the paper; five sample questions, as question text only (data/public.json in the
    harness repository, with no gold answers or rubrics); the agent harness (MIT); and the board's practice-area,
    question-type, cost and tool-use results, with several models' answers to one public question. Licensed:
    the 200-question private validation split. Never released: the 208-question test split behind every
    board score, the gold answers, rubrics and the judge's prompt."
  access_basis:
    reason: Every score on the board is computed by Vals on a test split that stays private, which
      the term's inclusion test covers; the public sample is a description of the item types, on
      which no score is published.
    source: src-vals-ai-legal-research
    quote: The Test set will remain private. All results reported on this page are based solely on
      the Test set to prevent overfitting.
  refresh: null
  refresh_note: Left null. One release is known, and no page read gives a version label, a change
    log or a plan for new items; Vals has versioned its other benchmarks (Finance Agent v1 to v2.1),
    so versioned-releases may follow.
  data_provenance:
    - expert-authored
  data_provenance_note: Fifteen practising attorneys, averaging fifteen years in practice, wrote and
    reviewed the items from real research questions, at about four attorney-hours each, and wrote
    the ground truth without AI help beyond light copyediting; they were paid contributors.
  data_provenance_basis:
    reason: The authors are practising US lawyers, and each item is reviewed by another.
    source: src-arxiv-2610-00609-v1
    quote: In total, 15 practicing attorneys, with an average of 15 years of legal experience,
      contributed to authoring and review
  data_provenance_source: src-vals-ai-legal-research
  data_provenance_quote: All questions, gold-standard answers, and rubrics are authored and
    peer-reviewed by practicing lawyers, drawing on real research questions that arise in legal
    practice.
  contamination_risk: low
  contamination_risk_note: The validation and test splits have not been released, and the items are
    original hypotheticals on novel fact patterns. Vals sends the test questions to each provider's
    API whenever it runs a model, and the authorities behind the answers are public law that the
    tools search live; no source weighs either route. Five public questions are in the repository,
    and several models' answers to one of them are on the page, but they are not scored on the
    board.
  contamination_risk_source: src-arxiv-2610-00609-v1
  contamination_risk_quote: The validation and test questions are held out to limit contamination.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: The paper validates the judge against three attorneys (87.4% item
    agreement with their majority, against 83.4% between one attorney and the majority), but no
    attorney answered the questions under the benchmark's conditions, so no human score anchors the
    top of the scale.
  dataset_licence: null
  dataset_licence_note: No licence is stated for the questions. The five public questions sit in the
    MIT-licensed harness repository without a separate data licence; the page's schema.org record (a
    script block, outside the extract) gives CC BY 4.0 for the leaderboard data. The validation and
    test splits are Vals' and licensed commercially or not at all.
  size:
    - count: 208
      unit: questions
      subset: test split (private), on which the board is computed
      source: src-vals-ai-legal-research
      quote: Public (5 open-source samples), Private Validation (200 samples available for license),
        and Test (208 samples)
    - count: 413
      unit: attorney-written questions in eight areas of law
      subset: all splits, on which the paper's results are computed
      source: src-arxiv-2610-00609-v1
      quote: LRB comprises 413 questions spanning eight areas of law and ten question types.
    - count: 200
      unit: questions
      subset: private validation split (licensed)
      source: src-vals-ai-legal-research
      quote: Public (5 open-source samples), Private Validation (200 samples available for license),
        and Test (208 samples)
    - count: 5
      unit: questions (text only)
      subset: public sample
      source: src-arxiv-2610-00609-v1
      quote: The corpus is partitioned into a 5-question public sample, a 200-question validation
        set, and a 208-question test set.
  size_note: Questions are multi-label (1.41 areas of law on average), so the per-area counts sum to
    more than 413. Rubrics hold 9.4 criteria on average (up to 31) and source lists 6.2 authorities
    (up to 23); the gold answers average 536 words. The page says the splits were sampled to keep
    the mix of question types, areas and difficulty.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Vals AI, Inc.
  maintainer_basis:
    reason: Vals wrote the paper, holds the harness repository (vals-ai, an organisation account on
      GitHub) and its copyright, holds the private splits, and runs the only board.
    source: src-github-vals-legal-research-bench-licence
    quote: Copyright (c) 2026 Vals AI, Inc.
  maintainer_type: industry-lab
  maintainer_type_note: Vals AI, Inc. is a company that builds and runs evaluations and calls itself
    an independent evaluator.
  submission_process:
    - maintainer-run
  submission_process_note: Vals selects the models, runs each in its harness on the test split, and
    publishes the board with cost, token, duration, practice-area and tool-use statistics. Nobody
    else submits, and with the test split withheld nobody else can produce a board score, which is
    why private-test-server access sits beside a maintainer-run process.
  submission_process_source: src-vals-ai-benchmarks-index
  submission_process_quote: Vals AI runs 44 independent AI benchmarks across legal, finance,
    healthcare, coding, math, and more.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-vals-ai-methodology
      quote: 'Test Set: This dataset remains private at all times, and is the only dataset used for the
        proprietary benchmark results we publish.'
    - flag: grader-from-evaluated-party
      source: src-arxiv-2610-00609-v1
      quote: lowest agreement is on models from its own provider
  independence_flags_note: The judge, GPT-5.4, was chosen among three candidates, and the paper's
    calibration study reports each candidate's agreement on models from its own provider, so the
    judge's provider has models among those evaluated; the paper finds no same-family leniency.
    GPT-5.4 itself is not ranked on the board. Vals builds no evaluated model, so
    maintainer-competes is not set. Vals licenses the validation split to companies; no source read
    says that it sells evaluations of the systems it ranks, so evaluator-sells-evaluations is not
    set (review_checks).
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2610-00609-v1
    quote: LRB is limited to U.S., English-language legal research and to a fixed snapshot of
      models, tools, and legal authority.
  known_limitation_note: US law in English only. The questions are built to have objective answers,
    which leaves out strategy, judgement under uncertainty, counselling, negotiation and drafting
    choices, and the results are a snapshot of the models, tools and law at the time of the run.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is calls to the model's API, the judge and the Tavily and CourtListener APIs from
      an ordinary machine; the README asks only for API keys.
    source: src-github-vals-legal-research-bench-readme
    quote: LLM API Keys (only set the ones you plan on using)
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The board's scores are on a test split only Vals holds, which the tier's inclusion test
      covers.
    source: src-vals-ai-about
    quote: Scores are based on our privately held test sets to preserve the integrity and signal of
      our results.
  reproducibility_blockers:
    - private-test-set
    - live-world-state
  reproducibility_blockers_note: The tools search the live web and CourtListener, so a rerun meets
    other search results and newer authority than the original run, although questions are anchored
    to an answer date. A run also needs a key to Vals' platform, whose access is gated.
  reproducibility_blockers_source: src-github-vals-legal-research-bench-readme
  reproducibility_blockers_quote: Search the web for information (via Tavily)
  harness_availability: reference-implementation-only
  harness_availability_note: The repository holds the agent, its five tools, the prompt and the five
    public questions, and the README says the default configuration is the one Vals ran, but it
    holds no grader, rubrics or answers (GitHub API tree at ef5c313, read 2026-11-28), and a run
    needs a Vals platform key. The paper calls the harness reproducible (review_checks).
  harness: vals-ai/legal-research-bench (the legal_agent package, run with the legal-research
    command and built on Vals' model library)
  harness_source: src-github-vals-legal-research-bench-readme
  harness_quote: The default configuration is the one we used to run the benchmark.
  code_licence: MIT
  code_licence_note: The LICENSE file; GitHub's licence metadata reports MIT too (API, read
    2026-11-28).
  code_licence_source: src-github-vals-legal-research-bench-licence
  code_licence_quote: MIT License
  runnable_via:
    - custom
  inspect_evals_id: null
  inspect_evals_id_note: Reconciled against UK AISI's inspect_evals on 2026-11-28 through the GitHub
    API's listing of src/inspect_evals at main (137 entries); none is Legal Research Bench. Not a
    quoted Source.
  maintainer_rerun_policy: unstated

comparability:
  # Resolved profile: model-graded, for (rubric-graded, model-in-benchmark-harness) and (model-graded-judge,
  # model-in-benchmark-harness). Beyond it: the harness and its tools (CourtListener and Tavily search, parsing,
  # retrieval), and the evaluation date, because the tools search a live web and case-law index. The split (the
  # paper's 413 questions or the board's 208), the judge and its prompt, the rubric version and the reasoning
  # effort the board varies are already members. The three-hour wall-clock cap is material too but has no
  # condition field.
  material_extra:
    - harness
    - tools_allowed
    - date_evaluated
  material_waived:
    - field: shots
      reason: The agent works from the question and the tools' descriptions; there are no in-context
        examples to count.
    - field: chain_of_thought
      reason: A tool-using run of up to three hours, not a single prompted answer; the board's
        reasoning efforts are reasoning_effort's.

aggregation_policy: official-aggregate
aggregation_policy_note: All-pass over the split is the headline on the board and in the paper, with
  weighted pass, cost, tokens, duration, sources cited and per-area and per-type all-pass beside it.
aggregation_policy_basis:
  reason: One headline per split, with partial credit and breakdowns published beside it.
  source: src-arxiv-2610-00609-v1
  quote: Weighted pass, the share of available rubric weight a response earns, is reported only as a
    secondary, partial-credit measure.

liveness:
  repo_last_commit: 2026-11-12
  leaderboard_last_updated: 2026-11-19
  reproduction_script_present: true
  last_checked: 2026-11-28

homepage: https://www.vals.ai/benchmarks/legal_research
repository: https://github.com/vals-ai/legal-research-bench
leaderboard_url: https://www.vals.ai/benchmarks/legal_research
maintainer_url: https://www.vals.ai/

versions:
  - version: 2026-09
    label: The paper's release, 413 questions in three splits
    version_kind: revision
    released: 2026-09-30
    items: 413
    changes: The release of arXiv 2610.00609 v1 with the harness repository (created 2026-06-22),
      413 attorney-written questions in eight areas of law, split 5 public, 200 validation and 208
      test, judged all-pass by GPT-5.4 with a source check. The board computes on the test split and
      keeps adding models.
    frozen: false
    sources:
      - src-arxiv-2610-00609-v1
      - src-arxiv-2610-00609
      - src-vals-ai-legal-research
      - src-github-vals-legal-research-bench-readme
versions_note: No source gives the release a version label or dates the board's first results, so
  the version is named by the paper's month; the public sample file says dataset_version 1.0.0
  (GitHub, not a quoted Source). frozen is false because the board is live on it.
subsets_note: >
  The board and the paper report all-pass per area of law (eight, overlapping) and per question type (three
  reasoning categories and two difficulty attributes), which are labels on the same questions rather than
  separately released tracks, so they are not modelled as subsets. The public, validation and test splits
  are data.size rows.

lineage:
  role: root
lineage_note: No lineage edge. The paper names Harvey's Legal Agent Benchmark as concurrent work
  with a different setting (bounded matter-specific document sets rather than open-ended research)
  and LegalBench (legalbench) as a static, single-turn predecessor; neither shares items or a
  maintainer. Vals' Legal Index is an aggregate of Vals' legal boards, not a version of this one.


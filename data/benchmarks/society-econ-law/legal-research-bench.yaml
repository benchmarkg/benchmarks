# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-28
  last_verified: 2026-11-28
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2610-00609-v1
    - src-arxiv-2610-00609
    - src-vals-ai-legal-research
    - src-vals-ai-benchmarks-index
    - src-vals-ai-methodology
    - src-vals-ai-about
    - src-github-vals-legal-research-bench-readme
    - src-github-vals-legal-research-bench-licence
  sources_note: >
    The paper's v1 PDF and abstract page (DOIs, not archived), with no window reaching the author block,
    the e-mail address or a cited author's name; Vals AI's board page, server-rendered and read with scripts
    and styles stripped, withheld from archiving because its citation block names the paper's authors;
    Vals' benchmarks index; Vals' methodology and about pages (already archived for finance-agent-benchmark);
    and the README and LICENSE at ef5c313. vals.ai's robots.txt allows these paths for all agents, Claude-User
    included. GitHub's API (dates, commits, tree, licence) and the public sample file were read but are
    not quoted Sources. Vals' home page, which says the Vals Legal Index combines this board with HLAB-Vals-1.1
    and Tax Agent Bench, was read and not cited because it names individuals.
  confidence: medium
  review_checks:
    - check: Family. The entry is placed in society-econ-law/legal-reasoning with
        agents-tooluse/research-agents secondary, although the paper frames its subject as
        long-horizon legal research agents and a run lasts up to three hours. The difference drawn
        here, as for finance-agent-benchmark, is that the grader scores the answer's legal content
        against an attorney rubric and Vals fixes the loop; a reviewer may rule that the
        agents-tooluse inclusion test ("the result it returned") takes it.
      field: domain.primary
      source: src-arxiv-2610-00609-v1
      quote: LRB follows this outcome-level view, scoring the submitted answer rather than the path
        taken to it.
    - check: The paper's numbers (thirteen models over all 413 questions, including the public and
        validation splits) are not the board's (the 208-question test split); the same model differs
        between them (Claude Opus 4.8 at 42.9% in the paper, 43.75% on the board). Claims need
        subset_used.
      field: data.size
      source: src-arxiv-2610-00609-v1
      quote: Unless noted otherwise, results in this paper are reported over the full 413-question
        corpus.
    - check: grader-from-evaluated-party rests on the paper's judge study reporting each candidate
        judge's agreement on models from its own provider; GPT-5.4 itself is not ranked. If only a
        judge whose own provider is named in the sources counts, the flag needs a source that
        attributes GPT-5.4 to its developer.
      field: governance.independence_flags
      source: src-arxiv-2610-00609-v1
      quote: lowest agreement is on models from its own provider
    - check: evaluator-sells-evaluations is not set. Vals licenses its private validation splits to
        companies and keeps a gated platform, which is close to selling evaluation; no page read
        says it sells evaluations of the systems it ranks.
      field: governance.independence_flags
      source: src-vals-ai-methodology
      quote: 'Private Validation Set: A larger, privately held dataset, which we license to companies
        for their own internal validation.'
    - check: activity no-submission-channel and designed_for_subjects. Some rows name systems that
        may be products or domain-tuned models rather than general models (Astra for Law, GLM
        Legal); no page says how they entered or whether they ran in the standard harness.
      field: activity
      source: src-vals-ai-legal-research
      quote: 7 Astra for Law 53.85%
    - check: harness_availability is reference-implementation-only because the repository has no
        grader and the public sample has no answers or rubrics, so nobody outside Vals can score
        even the public questions; the paper calls the harness reproducible.
      field: execution.harness_availability
      source: src-arxiv-2610-00609-v1
      quote: We release a reproducible agentic evaluation harness
    - check: lifecycle active rests on the maintainer's own board. No third-party paper or model
        report using the benchmark was looked for beyond Vals' pages.
      field: lifecycle
      source: src-vals-ai-benchmarks-index
      quote: 'Legal Proprietary Legal Research Bench Updated: 11/19/2026 Models Tested: 101'
    - check: Identity. released is the paper's date, but the repository is three months older and
        the board's launch is undated, so the release may be earlier. Only one version is recorded,
        and frozen is false because the board is live; whether Vals has changed items or rubrics
        since the paper is not stated.
      field: versions
      source: src-arxiv-2610-00609
      quote: '[Submitted on 30 Sep 2026]'
    - check: contamination_risk low rests on the splits being unreleased and the fact patterns
        novel. The test questions go to every provider's API on each run, and the answers rest on
        public law; medium is arguable.
      field: data.contamination_risk
    - check: model-graded-judge needs reference_conditions naming the judge and its version (GPT-5.4
        in the paper and on the page); no conditions record exists, and writing one was outside this
        task's write scope.
      field: reference_conditions
      source: src-vals-ai-legal-research
      quote: All responses are graded by GPT 5.4 as a judge

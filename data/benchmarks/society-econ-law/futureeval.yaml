# data/benchmarks/society-econ-law/futureeval.yaml
#
# P1-S12 sweep follow-up: a new society-econ-law entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from Metaculus's Substack post on FutureEval (2026-06-22, the sweep's evidence); from the source of
# metaculus.com in the Metaculus/metaculus repository at d1e2145 (2026-11-27): the methodology, Participate and
# Partner tabs, the Benchmark tab's tournament cards, the leaderboard's model-family map and the site's English
# strings; from Metaculus's analysis repository aib-analysis at e5e7341 (the season configuration and the README)
# and the forecasting-tools README at 3ca9107; and from the arXiv abstract page of 2606.29661 (June 2026), a later
# paper that uses the benchmark's questions. www.metaculus.com answered with a Cloudflare challenge (403), as it
# did for the sweep, and was not opened in a browser (curation.unreachable), so the site's pages are read from the
# repository that builds them, and no leaderboard row is recorded. GitHub's API supplied the accounts' type, the
# repositories' licences and the commit dates; none of those is a quoted Source. robots.txt: metaculus.com allows
# every agent; metaculus.substack.com and substack.com bar only BLEXBot site-wide and every agent from comments.
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: futureeval
name: FutureEval
aliases:
  - Metaculus FutureEval
  - AI Forecasting Benchmark
  - Metaculus AI Benchmark
aliases_note: >
  FutureEval is the name since 2026 of Metaculus's AI Benchmarking tournament series, whose tournament
  slugs read aibq3 to aibq2, fall-aib-2025 and spring-aib-2026 before summer-futureeval-2026; the site
  still calls it "Our AI Forecasting Benchmark" (src-github-metaculus-messages-en-d1e2145), and arXiv
  2606.29661 calls it the Metaculus AI Benchmark. The site's FutureEval pages were added on 2026-02-06
  (GitHub API, the (futureeval) directory's first commit). Not ForecastBench (forecastbench), the
  Forecasting Research Institute's benchmark, which draws some market questions from Metaculus.
tagline: AI models and forecasting bots predict live Metaculus questions, scored as they resolve and
  set against Pro Forecasters.
description: >
  Metaculus's benchmark of AI forecasting, in which AI systems give probabilities and distributions
  for questions on Metaculus, a forecasting platform, about future events in science, technology,
  health, geopolitics, AI and other topics, and are scored as the questions resolve. It has three
  parts. A Model Leaderboard runs all major models with one simple fixed prompt, with news research
  from a search provider (usually AskNews) pasted in, on most open Metaculus questions, and ranks
  them by a skill score built from head-to-head Peer Scores and set to 0 for GPT-4o, counting each
  model's forecasts for a year from its first one; it updates daily. Bot tournaments let developers
  enter their own bots, with no human in the loop: the primary seasonal tournament (about $50,000,
  four-month seasons starting in January, May and September, 300 to 400 questions each in binary,
  numeric and multiple-choice formats, open to new entrants at any time) and MiniBench, two-week
  rounds of about 60 auto-generated questions for about $1,000. Human baselines come from the
  Metaculus community and from Metaculus's Pro Forecasters, who forecast about 100 questions of each
  seasonal tournament; after each season Metaculus compares a team of 10 Pros with the best 10 bots
  by head-to-head spot peer score. The series began as quarterly AI Benchmarking tournaments in Q3
  2024 (binary questions only until Q4 2024). Pros led bots in every season to Q2 2025; in Spring
  and Summer 2026 the gap narrowed and was no longer statistically significant. Known weaknesses
  the sources name: bots, Metaculus's own included, miss questions through provider outages and
  code bugs, and the scores rest on forecast data Metaculus releases only on request.
self_description:
  source: src-metaculus-substack-futureeval
  quote: FutureEval measures how accurately AI predicts future outcomes across science, technology,
    health, geopolitics, AI itself, and more.
released: null
released_note: No source read here dates the series' start. Its first edition is the Q3 2024 AI
  Benchmarking tournament (the analysis code's season order and the site's tournament cards), and
  the FutureEval name and pages date from 2026-02-06 (GitHub API, not a quoted Source); the sweep's
  "launched in February 2026" is that rename.
released_source: src-github-aib-analysis-season-config-e5e7341
released_quote: 'SEASON_ORDER: tuple[str, ...] = ( "Q3 2024", "Q4 2024", "Q1 2025", "Q2 2025", "Fall 2025",
  "Spring 2026", "Summer 2026", )'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/forecasting-prediction-markets
  primary_basis:
    reason: Probabilistic forecasts about future events that later resolve, the leaf's definition;
      the family's exclusion keeps forecasting questions that resolve against real-world events here
      whatever their topic and however general the competence claimed ("Forecasting is an
      unfalsifiable test of real reasoning", the post says).
    source: src-metaculus-substack-futureeval
    quote: We run major AI models on a fixed prompt across most open Metaculus questions, then score
      and rank them as those questions resolve.
  secondary: []
domain_considered_and_rejected:
  - term: society-econ-law/finance-forecasting
    reason: The questions span science, technology, health, geopolitics and AI; financial quantities
      are not the subject, and nothing is scored before it resolves.
  - term: agents-tooluse/research-agents
    reason: Tournament bots gather news with search providers, and the post's research notes study
      them, but the grader scores the forecast against the outcome, not the sources gathered or a
      cited answer; the agents-tooluse family's inclusion asks for a grader of what the loop
      achieved with its tools.
    source: src-metaculus-substack-futureeval
    quote: No individual search provider showed a consistent advantage across seasons.
  - term: general-intelligence/human-comparison-batteries
    reason: Bots are set against Pro Forecasters, but on one task, forecasting; the family's
      exclusion sends prospective forecasting to society-econ-law however general the claim.

capability:
  - probabilistic-forecasting
  - calibration-uncertainty
capability_basis:
  probabilistic-forecasting:
    reason: The inclusion test word for word, and taxonomy/capabilities.yaml names Metaculus
      FutureEval as a qualifying example.
    source: src-github-metaculus-messages-en-d1e2145
    quote: FutureEval is guaranteed leak-proof, since answers are not known yet at test time.
  calibration-uncertainty:
    reason: The scoring function consumes the probability, distribution or option probabilities the
      forecaster emits; Peer Scores are built on log scores, which penalise an over- or
      under-confident forecast, not only a wrong direction.
    source: src-github-metaculus-futureeval-methodology-d1e2145
    quote: (essentially differences in
capability_considered_and_rejected:
  - term: tool-use
    reason: The Model Leaderboard's MetacBots get their research from a search provider the harness
      calls and pastes into the prompt; tournament bots may use tools, but the score is the
      forecast's accuracy, not whether a tool was selected or called correctly.
    source: src-github-metaculus-futureeval-methodology-d1e2145
    quote: They use a standardized prompt and usually use AskNews as a search provider.
  - term: context-integration
    reason: The research summary informs the forecast, but the answer is not in it, because the
      outcome does not exist when the forecast is made, so what is scored is not whether supplied
      material was used correctly.
  - term: autonomy
    reason: Tournament rules forbid a human in the loop, but each scored unit is one forecast on one
      question, not an extended task; the rule keeps the bots' forecasts machine-made rather than
      scoring what was achieved unattended over a long task.
    source: src-github-metaculus-messages-en-d1e2145
    quote: '"FABRulesRule1": "No human in the loop"'
  - term: knowledge-recall
    reason: No answer can be recalled; the outcome does not exist at forecast time.

evaluation_method:
  - prospective-resolution
  - uncertainty-calibration-score
  - entrant-relative-ranking
evaluation_method_basis:
  reason: >
    prospective-resolution because the questions resolve after the forecasts are made (the site calls
    it guaranteed leak-proof); uncertainty-calibration-score because log-score-based Peer Scores are a
    proper scoring rule applied to the emitted probabilities and distributions, which the term keeps
    beside prospective-resolution for a future event; entrant-relative-ranking because the published
    numbers are head-to-head comparisons between forecasters (models against models on the
    leaderboard, the Pro team against the bot team after each season), so a forecaster's number
    depends on whom it met.
  source: src-metaculus-substack-futureeval
  quote: head-to-head spot peer scores have put Pros in the lead every season by a large margin
evaluation_method_considered_and_rejected:
  - term: statistical-fit
    reason: The scored quantity is a probability's quality under a proper scoring rule, which the
      term's exclusion sends to uncertainty-calibration-score.
  - term: tournament-play
    reason: Forecasters do not play one another; each forecasts the same questions, and the
      comparison is computed afterwards from their scores.

designed_for_subjects:
  - instruction-tuned-model
  - reasoning-model
  - agent-scaffold
  - human-expert
  - human-nonexpert
designed_for_subjects_basis:
  reason: >
    The Model Leaderboard prompts each model once with Metaculus's fixed prompt and a research summary
    the harness supplies (instruction-tuned-model), and its frontier entries are reasoning models (the
    post's first advice is to pick one); the tournaments exist to compare bots developers build,
    whose loops, research and aggregation the entrants choose (agent-scaffold); the Pro Forecasters
    (human-expert) and the Metaculus community (human-nonexpert) forecast the same questions as
    baselines.
  source: src-github-metaculus-messages-en-d1e2145
  quote: 'FutureEval has two arms: a fixed-prompt benchmark to compare model performance directly, and
    a bots vs. humans tournament to probe the frontier of scaffolding.'
designed_for_subjects_considered_and_rejected:
  - term: model-in-benchmark-harness
    reason: The MetacBot prompt is one call after a research step, not a multi-turn loop, which the
      term's exclusion sends to instruction-tuned-model; Metaculus's agentic bot (metac-agent, now
      metac-autocast) is one of its own baselines in the tournaments, not the leaderboard's harness.
    source: src-github-metaculus-futureeval-methodology-d1e2145
    quote: uses our standardized prompt, AskNews for research and GPT-4o for making the predictions.
  - term: tool-augmented-model
    reason: The MetacBots' model is given research, not tools it calls.
as_used:
  - protocol: Binary questions from the Metaculus AI Benchmark, used to study which off-the-shelf
      model forecasts to ensemble (an ICML 2026 workshop paper); not a leaderboard or tournament
      entry.
    split: binary questions
    source: src-arxiv-2606-29661
    quote: On binary questions from the Metaculus AI Benchmark, we find that individual accuracy is
      not enough

lifecycle: active
lifecycle_basis:
  reason: The Fall 2026 seasonal tournament is marked live in the site's source of 2026-11-27, the
    Model Leaderboard updates daily, and a June 2026 paper (arXiv 2606.29661) studies forecasts on
    the benchmark's binary questions.
  source: src-github-metaculus-futureeval-tournaments-d1e2145
  quote: '{ title: "Fall 2026", href: "/tournament/fall-futureeval-2026/", imgUrl: "https://cdn.metaculus.com/cover-fall.webp",
    prize: "$58,000", isLive: true, }'
activity: accepting-submissions
activity_basis:
  reason: The seasonal tournament is always open to new entrants, and the Fall 2026 season is live;
    MiniBench rounds run back to back.
  source: src-metaculus-substack-futureeval
  quote: The primary $50k seasonal tournament repeats every four months and is always open.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: metac-gpt-4o+asknews (GPT-4o with Metaculus's MetacBot prompt and AskNews research)
    source: src-github-metaculus-futureeval-methodology-d1e2145
    observed_on: 2026-11-28
    quote: uses our standardized prompt, AskNews for research and GPT-4o for making the predictions.
    note: The Model Leaderboard's anchor, its skill score set to 0.
evaluation_target: learned-system
evaluation_target_note: Built to measure AI forecasting; the Pro Forecasters and the Metaculus
  community are the baselines the bots are measured against.
execution_mode: automated
ground_truth_source: forecast-resolution
ground_truth_source_basis:
  reason: Each question resolves by its stated criteria once the outcome is known; until then no
    answer exists.
  source: src-github-metaculus-futureeval-methodology-d1e2145
  quote: As questions resolve, we score the models' forecasts and continuously update our
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: Metaculus writes and resolves the questions and computes the scores on its platform, and
    peer scores need every forecaster's forecasts, which its analysis code reads from private files
    that are shared only on request. The MetacBots' code and prompts are public, so anyone can make
    such forecasts, but not reproduce a published score.
  source: src-github-aib-analysis-readme-e5e7341
  quote: Forecast CSVs live under `local/private_input_data/` (gitignored).

task:
  exists: true
  input:
    - a Metaculus question (binary, numeric or multiple choice) with its background, resolution
      criteria and fine print; seasonal-tournament questions open to bots for a short window (1.5
      hours in Spring 2026, 3 hours from 2026-06-05 in Summer 2026) at random times through the week
    - for the Model Leaderboard's MetacBots, a research summary from a search provider, usually
      AskNews, inside Metaculus's fixed prompt
  output: A probability for a binary question, six percentiles of a distribution for a numeric
    question, or a probability per option for a multiple-choice question; tournament bots must also
    post a comment explaining the reasoning.
  scoring: >
    As questions resolve, forecasts are scored with Metaculus's log-score-based Peer Scores. The
    Model Leaderboard combines head-to-head Peer Scores into a skill score (GPT-4o = 0) over forecasts
    made within a year of each model's first; tournament prizes are shared in proportion to accuracy;
    each season's Pros-versus-bots analysis compares a team of 10 Pros with the best 10 bots by
    average head-to-head spot peer score, 0 meaning equal.
  tests_hidden_from_system: true
  tests_hidden_from_system_note: Not hidden but non-existent at forecast time; the outcomes happen
    later.
  source: src-github-metaculus-futureeval-methodology-d1e2145
  quote: 'The last thing you write is your final answer as: "Probability: ZZ%", 0-100'

# --- Data ------------------------------------------------------------------------------------

data:
  access: gated-registration
  access_note: Questions and their resolutions live on metaculus.com, which refused this agent
    (403), so whether they can be read there without an account was not checked; bots reach them
    through the Metaculus API with a bot account's token. The forecast records behind the scores
    (bots', Pros' and the community's) are released only on request
    (src-github-aib-analysis-readme-e5e7341).
  access_basis:
    reason: Taking part, and reading the questions programmatically, needs a Metaculus account and
      its bot token.
    source: src-github-metaculus-messages-en-d1e2145
    quote: Your token is needed for your bot to interact with the Metaculus API.
  refresh: resolves-over-time
  refresh_note: >
    Also periodic: a new seasonal tournament every four months (quarterly until Q2 2025), MiniBench
    rounds every two weeks, and a Model Leaderboard updated daily over the platform's open questions.
    resolves-over-time is chosen because it is the property that pairs with resolution_status.
  data_provenance: []
  data_provenance_note: Left empty. The methodology page's statement about who writes the seasonal
    questions sits in a bullet list that normalise() strips from the page's source, so it is not
    quotable here; MiniBench's questions are auto-generated, by a method no source read states.
    Logged as taxonomy/_failures/2026-11-27-futureeval-001.
  contamination_risk: low
  contamination_risk_note: >
    Low by construction: the outcome does not exist when the forecast is made. Two routes remain
    that the sources name: models' training data ages, which is why the leaderboard counts only a
    model's first year of forecasts, and evaluations that backtest on resolved questions, which the
    post contrasts with FutureEval's live, forward-looking ones.
  contamination_evidence:
    - source: src-github-metaculus-messages-en-d1e2145
      stance: against
      quote: FutureEval is guaranteed leak-proof, since answers are not known yet at test time.
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_basis:
    reason: >
      The comparator is the aggregate of a team of 10 Pro Forecasters (the bot team is compared with
      it head to head each season), with the Pro and community baselines drawn on the leaderboard's
      performance-over-time graph; an aggregate of experts, not the best expert. Bots trailed it in
      every season to Q2 2025, and in Spring and Summer 2026 the lead was not significant. The scale
      itself has no top.
    source: src-github-metaculus-futureeval-methodology-d1e2145
    quote: shows how much better pros did than bots when comparing a team of 10 pros and the best 10
      bots in our Bot Tournaments.
  dataset_licence: null
  dataset_licence_note: No source read states a licence for the questions, the resolutions or the
    forecast data; Metaculus's terms of use were not read (the site refused this agent). The
    repository that builds the site is BSD-2-Clause, which covers the code, not the questions.
  size:
    - count: 300
      unit: questions per seasonal bot tournament (300 to 400 stated), across all formats
      subset: seasonal tournaments, current protocol
      source: src-github-metaculus-futureeval-participate-d1e2145
      quote: Our primary tournament with ~4-month seasons starting every January, May, and
        September, each with 300–400 questions across all formats.
    - count: 300
      unit: questions in the Summer 2026 tournament (300 to 500 stated)
      subset: futureeval@2026-summer
      source: src-metaculus-substack-futureeval
      quote: The $50k Summer Bot Tournament is live, with 300 to 500 questions running through early
        September.
    - count: 100
      unit: questions per seasonal tournament also forecast by the Pro Forecasters (around 100)
      subset: futureeval#pro-comparison
      source: src-github-metaculus-futureeval-methodology-d1e2145
      quote: to provide high-quality predictions and reasoning on a subset of questions in our Bot
        Tournament (around 100 per tournament).
    - count: 93
      unit: questions in the published Pros-versus-bots comparison
      subset: futureeval@2025-q2
      source: src-github-aib-analysis-season-config-e5e7341
      quote: PublishedTeamResult("Q2 2025", -20.03, -28.63, -11.41, 93)
    - count: 99
      unit: questions in the published Pros-versus-bots comparison
      subset: futureeval@2026-spring
      source: src-github-aib-analysis-season-config-e5e7341
      quote: PublishedTeamResult("Spring 2026", -1.25, -4.87, 2.37, 99)
    - count: 60
      unit: auto-generated questions per MiniBench round (about 60)
      subset: futureeval#minibench
      source: src-github-metaculus-futureeval-participate-d1e2145
      quote: Back-to-back 2-week rounds of ~60 auto-generated questions, designed for fast feedback
        loops and lowering the barrier to entry.
  size_note: The Model Leaderboard has no fixed set; it covers most open questions on the platform,
    and its question count was not read (the board loads from Metaculus's API, which refused this
    agent).

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Metaculus
  maintainer_basis:
    reason: The FutureEval pages, the tournaments, the MetacBots and the analysis code are
      Metaculus's, published from its own site and its GitHub organisation (users/Metaculus is an
      Organization, GitHub API, read 2026-11-28).
    source: src-github-metaculus-messages-en-d1e2145
    quote: '"metaculusFutureEval": "Metaculus FutureEval"'
  maintainer_type: industry-lab
  maintainer_type_basis:
    reason: The site lists "Public Benefit Corporation" among its Company links, and the term's
      inclusion counts a public benefit corporation as a company; Metaculus also sells services,
      custom model evaluations among them (src-github-metaculus-futureeval-partner-d1e2145). The
      linked page itself was not read (review_checks).
    source: src-github-metaculus-messages-en-d1e2145
    quote: '"company": "Company", "resources": "Resources", "publicBenefitCorporation": "Public Benefit
      Corporation"'
  submission_process:
    - held-out-server
    - maintainer-run
  submission_process_note: >
    Two routes. Tournament bots submit forecasts through the Metaculus API before each question
    closes, and Metaculus scores them as the questions resolve (held-out-server: the outcomes do not
    exist at submission; one prize-eligible bot per user, and bot makers must let Metaculus inspect
    their code). On the Model Leaderboard Metaculus chooses the models and runs them itself as
    MetacBots, which are not eligible for prizes (maintainer-run).
  submission_process_source: src-metaculus-substack-futureeval
  submission_process_quote: Developers enter their own bots and compete for a share of $175k in
    prizes a year.
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-github-metaculus-futureeval-participate-d1e2145
      quote: If participating in the Seasonal Bot Tournament, LLM inference costs are covered
        free-of-charge, courtesy of OpenAI, Anthropic, and Google.
    - flag: evaluator-sells-evaluations
      source: src-github-metaculus-futureeval-partner-d1e2145
      quote: We can set up a complete evaluation pipeline for LLMs or forecasting bots
  independence_flags_note: >
    funded-by-evaluated-party: OpenAI, Anthropic and Google cover the seasonal tournament's inference
    costs (the site's strings name OpenAI and Anthropic credits), and the leaderboard labels its
    models by those labs among others (src-github-metaculus-futureeval-bot-meta-d1e2145).
    evaluator-sells-evaluations: the Partner tab offers organisations custom model evaluations and
    private bot tournaments, beside Metaculus's other services. maintainer-competes-on-own-benchmark is
    not set: Metaculus's own bots (the fixed-prompt MetacBots and its agentic bot) forecast in the
    tournaments and fill the leaderboard, but they are prize-ineligible baselines over other labs'
    models, as forecastbench's maintainer baselines are (review_checks). prize-sponsored-by-industry
    is not set: no source read names who funds the prize pools.
  independence_assessed: true
  funding:
    source: src-github-metaculus-messages-en-d1e2145
    quote: '"FABdesc1": "Compete with API credits provided courtesy of OpenAI and Anthropic."'
  funding_note: The tournament's model credits come from evaluated labs (independence_flags); no
    source read names the funder of the prize pools or of Metaculus's own runs.
  known_limitation:
    source: src-github-aib-analysis-season-config-e5e7341
    quote: Bots (including Metac Bots) missed some questions because of provider outages, GitHub
      Actions issues, or
  known_limitation_note: Metaculus's Summer 2026 data notes; bot makers reported their biggest point
    losses came from code bugs, not bad forecasts, and some questions were launched as numeric and
    converted to discrete after launch.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: A bot or a MetacBot is model calls plus a search provider's API on each
    question; seasonal-tournament entrants' inference is covered by the sponsoring labs.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The headline scores are computed by Metaculus on its platform from forecasts on
      questions it writes and resolves, against the other forecasters' forecasts, which are not
      public; no party outside Metaculus can produce one.
    source: src-github-aib-analysis-readme-e5e7341
    quote: Request access to analysis data from the instructions shared
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: A past season cannot be rerun, because its questions have resolved;
    a new bot can only be entered in a live tournament or on open questions.
  harness_availability: reference-implementation-only
  harness_availability_note: The published code makes and submits forecasts; the official scores are
    computed on metaculus.com, which the term's exclusion reads as reference-implementation-only.
    The analysis code (aib-analysis) recomputes the season write-ups from private forecast files.
  harness: forecasting-tools (Metaculus), whose run_bots.py runs the MetacBots and whose template
    bot (metac-bot-template; the Summer 2026 MetacBot code is template_bot_2026_summer.py) is the
    tournaments' starting point; scores are computed by the platform, not by published code
  harness_source: src-github-forecasting-tools-readme-3ca9107
  harness_quote: You can see all the bots that Metaculus is running on their site in `run_bots.py`
  code_licence: MIT
  code_licence_note: forecasting-tools, the harness, is MIT (its README's badge and GitHub's licence
    metadata). The site's repository is BSD-2-Clause and aib-analysis declares no licence (GitHub
    API, read 2026-11-28).
  code_licence_source: src-github-forecasting-tools-readme-3ca9107
  code_licence_quote: License-MIT-blue
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the profiles the facets resolve: the search provider a bot or MetacBot uses (the post found no
  # provider consistently better, but breadth of sources mattered) and the prompt version (the MetacBot prompt is
  # versioned per season, e.g. template_bot_2026_summer.py). Which questions, and the one-year window after a
  # model's first forecast, are subset_used and resolution_window.
  material_extra:
    - tools_allowed
    - prompt_template_hash
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The Model Leaderboard ranks models by one skill score; the tournaments and the seasonal
    Pros-versus-bots comparison publish their own rankings beside it.
  source: src-github-metaculus-futureeval-methodology-d1e2145
  quote: to determine a forecasting skill score that fairly compares models across diverse
    questions.
headline_metric: futureeval-skill-score
no_legitimate_aggregate: false

liveness:
  repo_last_commit: 2026-11-23
  last_checked: 2026-11-28

homepage: https://www.metaculus.com/futureeval/
repository: https://github.com/Metaculus/forecasting-tools
leaderboard_url: https://www.metaculus.com/futureeval/leaderboard/
maintainer_url: https://github.com/Metaculus

versions:
  - version: 2024-q3
    label: Q3 2024 AI Benchmarking tournament (aibq3)
    version_kind: edition
    changes: The first season, $30,000, binary questions only. The bot team trailed the Pro team by
      11.3 head to head (95% CI -21.8 to -0.7); the best Metac Bot placed 4th of 55 bots.
    breaking: true
    superseded_by: 2024-q4
    frozen: true
    sources:
      - src-github-metaculus-futureeval-tournaments-d1e2145
      - src-github-aib-analysis-season-config-e5e7341
      - src-github-metaculus-futureeval-methodology-d1e2145
  - version: 2024-q4

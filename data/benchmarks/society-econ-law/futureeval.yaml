subsets:
  - id: futureeval#model-leaderboard
    label: Model Leaderboard (fixed-prompt MetacBots)
    scored_separately: true
    evidence:
      - source: src-github-metaculus-futureeval-methodology-d1e2145
        quote: We run all major models with a simple, fixed prompt on most Metaculus forecasting
          questions.
      - source: src-github-metaculus-messages-en-d1e2145
        quote: Updated every day based on our standardized forecasting performance measurement
          methodology.
    notes: Major models, each run as a MetacBot (metac-[model]+[search provider]) with one fixed
      prompt per question type, over most open Metaculus questions, not only tournament ones; ranked
      by the skill score, counting forecasts within a year of each model's first. It spans the
      editions rather than belonging to one.
  - id: futureeval#minibench
    label: MiniBench
    scored_separately: true
    evidence:
      - source: src-github-metaculus-messages-en-d1e2145
        quote: MiniBench is our bi-weekly experimental tournament series designed for rapid
          iteration and feedback. Each MiniBench runs for approximately two weeks, and uses
          automated questions.
      - source: src-metaculus-substack-futureeval
        quote: A faster $1k tournament, MiniBench, runs every two weeks
    notes: Back-to-back two-week rounds of about 60 auto-generated questions, about $1,000 a round,
      a fast-feedback companion to the seasonal tournament; each round is a tournament of its own.
  - id: futureeval#pro-comparison
    label: The Pro Forecasters' questions in a seasonal tournament
    scored_separately: true
    evidence:
      - source: src-github-metaculus-futureeval-methodology-d1e2145
        quote: to provide high-quality predictions and reasoning on a subset of questions in our Bot
          Tournament (around 100 per tournament).
      - source: src-github-aib-analysis-season-config-e5e7341
        quote: '"""Bot team head-to-head score against the Pro team, as published for a past season."""'
    notes: About 100 questions per season (93 in Q2 2025, 99 in Spring 2026) that Pros also
      forecast, on which a team of 10 Pros and the best 10 bots are compared by average head-to-head
      spot peer score; Fall 2025 had none.
subsets_note: Market Pulse (bots update numeric group questions for about $7,000) and the Metaculus
  Cup (bots may enter, not prize-eligible) are other Metaculus tournaments listed on the Participate
  tab as open to bots; they are not FutureEval's primary series and are not modelled. Question types
  (binary, numeric, multiple choice) are analysed separately in the season write-ups but are not
  listed until a claim needs them.
metrics:
  - futureeval-skill-score
metrics_note: The skill score is the Model Leaderboard's scale. The tournaments rank bots by their
  own peer-score leaderboards, and the season comparisons report the bot team's average head-to-head
  spot peer score against the Pro team; neither has a metric record yet, because neither leaderboard
  was read.

lineage:
  role: root
  correlates_with:
    - benchmark: forecastbench
lineage_note: ForecastBench (forecastbench) is the Forecasting Research Institute's separately
  maintained forecasting benchmark, whose market questions are drawn partly from Metaculus and whose
  entry asked for this one in correlates_with; no source read gives a coefficient between the two.
  The quarterly AI Benchmarking tournaments are this benchmark's first four editions, not a
  predecessor (versions; review_checks). arXiv 2606.29661 uses the questions and is not a
  derivative.

tags:
  - forecasting
  - metaculus
  - bot-tournaments
  - pro-forecasters
  - resolution-status
  - llm-agents


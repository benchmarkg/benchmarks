    items: 1250
    changes: The open-source release of 1,250 tasks in 24 practice areas with over 75,000
      expert-written criteria, the harness and the grader, without a leaderboard; graded then by a
      single Claude Sonnet 4.6 judge.
    frozen: false
    sources:
      - src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
      - src-github-harveyai-harvey-labs-changelog
  - version: 2026-06
    label: In-house contracting extension
    version_kind: track-set
    released: 2026-06-12
    changes: Adds 500 contract drafting, review and negotiation tasks, each asking for the artefact
      that moves a negotiation to its next state (a draft, a redline, an issues list, an escalation
      memo), graded all-pass.
    supersedes_version: 2026-05
    frozen: false
    sources:
      - src-harvey-blog-legal-agent-benchmark-in-house-contracting
  - version: 2026-07
    label: M&A due diligence extension
    version_kind: track-set
    released: 2026-07-17
    changes: Adds synthetic virtual data rooms of thousands of documents (one of over 3,500
      documents and about 45 million tokens) with planted issues, each checked by a rubric of
      ground-truth findings and recommendations; no task count is given.
    supersedes_version: 2026-06
    frozen: false
    sources:
      - src-harvey-blog-legal-agent-bench-m-and-a-due-diligence
  - version: 2026-09
    label: Dual-judge grading and the finish tool
    version_kind: revision
    released: 2026-09-03
    changes: The default grader became the averaged pair Claude Sonnet 4.6 and GPT-5.5 (2026-08-26),
      and the agent got an explicit finish tool (2026-09-03); the changelog says results across both
      lines are not comparable. Both are in lab-core v1.1.0 (published 2026-09-18, by GitHub's API).
    breaking: true
    supersedes_version: 2026-07
    frozen: false
    sources:
      - src-github-harveyai-harvey-labs-changelog
  - version: 2026-10
    label: 'LAB: USCL, the US case-law track'
    version_kind: track-set
    released: 2026-10-29
    changes: Adds 100 brief-writing environments built from federal dockets, each in an open-book
      (CourtListener search) and a closed-book condition, scored by pairwise judging and Elo; the
      environments are not published.
    supersedes_version: 2026-09
    frozen: false
    sources:
      - src-harvey-blog-legal-agent-bench-us-case-law
  - version: holdout-1-1
    label: The remediated private holdout
    version_kind: revision
    changes: Harvey removed 17 unsolvable criteria from the 120-task holdout and replaced one
      mismatched source document, still 120 tasks; it is the holdout behind HLAB-Vals-1.1 and Harvey
      LAB-AA v1.1. Undated; Vals' v1 board, on the earlier holdout, was last updated on 2026-10-18.
    breaking: true
    frozen: false

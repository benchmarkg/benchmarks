# data/benchmarks/society-econ-law/harvey-lab.yaml
#
# P1-S12 sweep follow-up: a new society-econ-law entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from Harvey's five LAB posts, read after harvey.ai's robots.txt with scripts and styles stripped: the
# announcement (2026-05-06, re-read in November 2026), the initial results (2026-05-26), the in-house contracting
# extension (2026-06-12), the M&A due diligence extension (2026-07-17) and LAB: USCL (2026-10-29); the
# harveyai/harvey-labs README, docs/eval-strategies.md, docs/architecture.md, CHANGELOG.md and LICENSE at main's head
# commit 7f9b1ee (2026-11-12); Vals AI's HLAB-Vals-1.1 board and its archived v1 board, and Artificial Analysis's
# Harvey LAB-AA v1.1 page, each read after its host's robots.txt; and two 2026 papers already in data/sources/ that
# run or use LAB (arXiv 2607.25891 v2 and 2611.18856 v1). GitHub's API supplied the repository's dates, licence
# field, tags, releases and the listing of its task directories; none of those is a quoted Source. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.
#
# Harvey sells legal AI products, including agents for legal work, and maintains the benchmark. Its public task set
# is open (MIT), but every published score is on a private 120-task holdout: Harvey's own initial results, and
# boards run by Vals AI and by Artificial Analysis, which are recorded here as forks (lineage) and in as_used.
# BigLaw Bench, Harvey's earlier short-horizon benchmark, is a separate entry (lineage_note).

id: harvey-lab
name: Harvey LAB
aliases:
  - Legal Agent Benchmark
  - LAB
  - Harvey's Legal Agent Benchmark
  - Harvey's Long Horizon Legal Agent Benchmark
  - Legal Agent Bench
  - HarveyAI-Lab
tagline: Agents do law-firm work in a sandboxed client matter; LLM judges pass a task only if every
  expert criterion is met.
description: >
  Harvey's open-source benchmark of agents on legal work. Each task gives the agent a short instruction,
  written as a partner's request to an associate (about fifty words), and a closed client matter in a
  sandboxed file system: matter files, a data room, templates and emails, relevant and peripheral documents
  mixed, with issues planted across them. The agent works through six workspace tools (bash, read, write,
  edit, glob, grep) and a finish tool, and must leave reviewable work product as files, such as a deal-team
  memo, a redline or an issues list. Each task's rubric lists equally weighted pass/fail criteria written
  by experts (facts, conclusions, citations, severity ratings, deadlines, amounts, formatting), each tied
  to a deliverable. An LLM judge grades them one by one, and a task passes only if every criterion does
  (all-pass). By default two judges, Claude Sonnet 4.6 and GPT-5.5, grade independently and the headline
  averages their all-pass values. The first release (May 2026) had 1,250 tasks in 24 practice areas with
  over 75,000 criteria. Extensions added 500 in-house contracting tasks (June), synthetic M&A data rooms
  of thousands of documents (July) and a US case-law track, LAB: USCL (October), of 100 brief-writing
  environments built from federal dockets and scored by pairwise judging and Elo. The public set now holds
  2,010 tasks in 27 practice areas, under MIT with the lab-core harness and grader. Published scores are
  on a private holdout that mirrors the public distribution, 120 tasks on the boards: Harvey's initial
  results (top model 7.1%), and boards run by Vals AI (HLAB-Vals-1.1) and Artificial Analysis (Harvey
  LAB-AA v1.1), each with its own harness changes and version labels.
self_description:
  source: src-github-harveyai-harvey-labs-readme
  quote: Harvey LAB is an open-source project aimed at benchmarking LLM agents' abilities to perform
    legal work in realistic environments.
paper: null
paper_note: There is no paper. The benchmark is defined by Harvey's posts and the repository's
  documentation; the README asks users to cite the repository.
released: 2026-05-06
released_note: The date of Harvey's announcement. The repository was created on 2026-03-30 (GitHub
  API), before it.
released_source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
released_quote: May 6, 2026

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/legal-document
  primary_basis:
    reason: The scored output is a legal work product written to files (a memo, a redline, an issues
      list, an escalation memo), and the rubric checks its legal substance and form criterion by
      criterion. That is drafting and reviewing legal documents, the leaf's definition. The family's
      exclusion for autonomous operation does not apply, because the grader reads what the
      deliverable says about the law and the facts, not the state the agent left in its sandbox.
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: Each task consists of an instruction, a client matter containing relevant materials, and
      a requirement that the agent produce a work product for review.
  secondary:
    - society-econ-law/legal-reasoning
    - agents-tooluse/long-horizon-autonomy
  secondary_basis:
    reason: legal-reasoning because many criteria check that a rule was applied to the planted facts
      (whether a contract needs change-of-control consent, which issues stay open in a negotiation),
      and the work types include analysis and research. long-horizon-autonomy because each task is
      one unattended agent episode over a whole matter, which Harvey frames as long-horizon legal
      work (over 20 minutes per task for its top configuration; a diligence data room of about 45
      million tokens). It is secondary because the score is the legal content, not the operation
      (review_checks).
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: To date, there has not been a benchmark that illustrates agent progress for long-horizon
      legal work.
domain_considered_and_rejected:
  - term: society-econ-law/economically-valuable-work
    reason: The tasks come from real client matters broken into associates' assignments, but the
      leaf is defined by expert comparison against human work product, and here a judge checks
      rubric criteria with no professional deliverable to compare against; the eval docs say no
      golden reference is used. biglaw-bench takes the leaf as a secondary on the same ground
      (review_checks).
    source: src-github-harveyai-harvey-labs-eval-strategies
    quote: No golden reference output is needed.
  - term: agents-tooluse/operating-system-tasks
    reason: The agent acts through bash and file tools inside a Podman sandbox, and Vals reports
      that bash and file reads make up most calls, but nothing checks the machine's end state; the
      judge reads the deliverables' text against legal criteria.
    source: src-github-harveyai-harvey-labs-architecture
    quote: Every agent run executes inside a per-task Podman sandbox
  - term: agents-tooluse/tool-api-calling
    reason: APEX-Agents, a rubric-graded professional-task benchmark, takes this leaf as primary,
      but its agents call 63 application APIs; here the tools are generic workspace tools and no
      call is checked for correctness against a backend.
  - term: agents-tooluse/research-agents
    reason: The main tasks are closed-universe, with every needed document in the matter; only the
      USCL track's open-book condition gives search tools, so the leaf is that subset's secondary.
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: The client matter defines a closed-universe set of documents and other materials that are
      needed for the law firm to complete work on behalf of the client.
capability:
  - context-integration
  - factual-precision
  - constraint-satisfaction
  - tool-use
capability_basis:
  context-integration:
    reason: The matter supplies every document the answer rests on, with issues embedded across
      several files and peripheral material mixed in, and criteria check the particulars drawn from
      them (a consent requirement, an amount, a deadline).
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: The client matter defines a closed-universe set of documents and other materials that are
      needed for the law firm to complete work on behalf of the client.
  factual-precision:
    reason: Rubrics break the deliverable into atomic criteria that check asserted particulars one
      by one, independently of the document as a whole.
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: 'into atomic, binary pass/fail criteria: facts, conclusions, citations, severity ratings, recommendations,
      deadlines, dollar amounts, and formatting choices.'
  constraint-satisfaction:
    reason: The task score is all-pass, so any one failed criterion fails the task, which is the
      term's inclusion case; Harvey names all-pass as its standard.
    source: src-github-harveyai-harvey-labs-eval-strategies
    quote: A task is only marked pass if every rubric criterion passes
  tool-use:
    reason: The matter is reachable only through the workspace tools and the deliverables must be
      written as files to the output directory; a criterion whose deliverable is missing fails, and
      Harvey's trace analysis ties search and analysis behaviour to the all-pass score.
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: As input, the agent receives access to a file system containing the background on the
      deal, a virtual data room and a short instruction from the partner
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: Episodes are long, but an early error can be repaired later in the episode; Harvey
      reports that revising after a check raises all-pass scores, so the term's unrecoverable-step
      test is not met.
    source: src-harvey-blog-legal-agent-benchmark-initial-results
    quote: Agents that close this revise-after-check loop improve all-pass scores by 1.5 points on
      average.
  - term: autonomy
    reason: The harness loop has no step for human input, but no source read says the main protocol
      bars it; the USCL post says so of its own track, which carries the term as an override.
  - term: knowledge-recall
    reason: Legal knowledge is needed to spot the issues, but the facts that decide each criterion
      are in the closed matter, which the term's exclusion covers.
  - term: memory-retention
    reason: The diligence data rooms run to about 45 million tokens, far beyond a context window,
      but the term's exclusion says length alone is not evidence, and no criterion is reported to
      test information carried across the episode.
    source: src-harvey-blog-legal-agent-bench-m-and-a-due-diligence
    quote: Collectively, these documents total around 45 million tokens of context.
  - term: self-correction
    reason: Self-checking correlates with higher scores in Harvey's trace analysis, but the score is
      on the final deliverables, not on detecting or repairing errors as such.
  - term: instruction-following
    reason: Instructions are short statements of the work wanted; criteria include formatting
      choices but score the work product's substance, not compliance with stated constraints.
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: Instructions are short, averaging just fifty words.

evaluation_method:
  - rubric-graded
  - model-graded-judge
  - pairwise-preference-elo
evaluation_method_note: rubric-graded and model-graded-judge describe the main benchmark. Each
  criterion gets one judge call at temperature 0 with the task title, the criterion and only the
  deliverables it names; there is no reference output. The standard profile averages two judges
  (Claude Sonnet 4.6 and GPT-5.5, tagged lab-standard-dual-v1), which replaced a single Claude
  Sonnet 4.6 judge on 2026-08-26; Artificial Analysis's fork uses three judges and a hallucination
  gate. pairwise-preference-elo is the USCL track's method, where graders the post calls GRMs pick
  the better of two model-written briefs, or a tie, and wins are fitted to Elo ratings.
evaluation_method_basis:
  reason: Named criteria are checked individually and combined (all must pass), and a judge model
    applies them, so the entry takes both terms.
  source: src-github-harveyai-harvey-labs-eval-strategies
  quote: a list of equally-weighted pass/fail criteria that an LLM judge grades individually
evaluation_method_considered_and_rejected:
  - term: environment-state-check
    reason: Deliverables are files the agent leaves, but a judge model reads their text against
      criteria; no program checks the sandbox's state.
  - term: human-expert-eval
    reason: Experts wrote the rubrics, and lawyers review USCL's judging criteria, but no published
      score comes from lawyers' ratings.
    source: src-harvey-blog-legal-agent-bench-us-case-law
    quote: These criteria are reviewed by lawyers and calibrated to ensure they are relevant to
      reasons expert reviewers would prefer a brief.
  - term: exact-match
    reason: Many criteria name one fact or amount, but the judge decides each semantically; the docs
      say no keyword or regex matching is used.
designed_for_subjects:
  - model-in-benchmark-harness
  - agent-scaffold
designed_for_subjects_basis:
  reason: The repository ships one harness (the lab-core agent loop, tools, skills and system
    prompt), in which Harvey's results and Vals AI's board run each model, and Harvey also built the
    benchmark for agent builders comparing harness changes; Artificial Analysis runs the tasks in
    its own Stirrup harness.
  source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
  quote: We are open-sourcing LAB to give model providers, agent builders, researchers, and law
    firms a shared way to measure progress on long-horizon legal agents.
designed_for_subjects_considered_and_rejected:
  - term: full-product-pipeline
    reason: Harvey uses LAB to evaluate its own products, but no source read publishes a score for a
      shipped product, Harvey's or another vendor's.
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: We are already seeing LAB being used by both our internal teams for product evaluation
  - term: reasoning-model
    reason: The boards list each model at a reasoning effort, but the effort is a condition of the
      run (in the agentic and model-graded profiles), not a different kind of entrant.
  - term: human-expert
    reason: No lawyer is scored on the tasks; lawyers write and review the rubrics.
as_used:
  - protocol: HLAB-Vals-1.1, Vals AI's board. Vals runs Harvey's harness, tools, skills and grading
      protocol on the private holdout with internet access disabled, on its own infrastructure, with
      its own harness fixes (context compaction, a nudge when a model stops without finishing, a cap
      on tool results), and scores the average of the two judges' task pass rates.
    split: the private holdout (120 tasks), as remediated for v1.1
    source: src-vals-ai-hlab
    quote: 'Harvey fixed the private holdout: 17 unsolvable criteria were removed and one mismatched source
      document was replaced. Still 120 tasks.'
    note: Results are not comparable with Vals' archived v1 board, which used Harvey's initial
      method unchanged, or with Artificial Analysis's board.
  - protocol: Harvey LAB-AA v1.1, Artificial Analysis's run in its own Stirrup harness, with three
      judges (GPT-6 Sol, Grok 4.7, Claude Opus 5.5) averaged, and a check of every deliverable
      against its source documents that zeroes any task with a material hallucination.
    split: Harvey's 120 private tasks, five per practice area
    source: src-artificialanalysis-harvey-lab-aa
    quote: We run Harvey LAB-AA v1.1 with our Stirrup agent harness on Harvey's dataset of 120
      private tasks spanning 24 legal practice areas.
  - protocol: Messier (arXiv 2607.25891, 2026), a corpus of agent results, runs LAB with five models
      in the OpenHands scaffold, one run per task, and keeps the per-criterion verdicts.
    source: src-arxiv-2607-25891-v2
    quote: HarveyAI-Lab uses 23–194 verifier results per task
  - protocol: Self-Improvement Memory (arXiv 2611.18856, 2026) lists Harvey LAB as the source (S)
      benchmark of its Workspace domain, with JobBench, GDPval and APEX-Agents as targets (T).
    source: src-arxiv-2611-18856-v1
    quote: 'Workspace S: Harvey LAB T: JobBench'
lifecycle: active
lifecycle_basis:
  reason: Two boards run on the holdout and add models as they are released (Vals' updated on
    2026-11-19 with 44 models, Artificial Analysis's with rows for November 2026 models), Harvey
    extended the benchmark in June, July and October 2026, and 2026 papers run it.
  source: src-vals-ai-hlab
  quote: Benchmarks / Legal Industry Partner HLAB-Vals-1.1 Updated 11/19/2026 Version 1.1
activity: no-submission-channel
activity_note: Harvey launched without a leaderboard and said it would publish standards for
  normalised submissions; no submission route was found in the sources read. Vals AI and Artificial
  Analysis choose and run the models on their boards. Anyone can run the public set with lab-core
  and publish elsewhere (review_checks).
activity_basis:
  reason: The only boards are run by their operators, and Harvey's own results are its own runs.
  source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
  quote: We're intentionally launching LAB without a leaderboard because we expect the dataset to
    evolve over time

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude Opus 4.7
    source: src-harvey-blog-legal-agent-benchmark-initial-results
    observed_on: 2026-11-28
    quote: Claude Opus 4.7 leads at 7.1%, with Sonnet 4.6 at 5.4%, Opus 4.6 at 4.2%, GPT-5.5 at
      2.1%, and Gemini 3.5 Flash at 0.8%
evaluation_target: learned-system
execution_mode: automated
execution_mode_basis:
  reason: The agent loop runs until the model calls finish or stops, and the judges grade every
    criterion without a person; lawyers enter only through the rubrics.
  source: src-github-harveyai-harvey-labs-architecture
  quote: By default, grades independently with Sonnet 4.6 and GPT-5.5
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: The criteria, written by legal experts, are the standard; the judges apply them and there
    is no separate answer file.
  source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
  quote: The first version of LAB includes more than 1,200 agent tasks across 24 legal practice
    areas, and is evaluated by over 75,000 expert-written rubric criteria.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: Every published score is on the private holdout, which only Harvey and the two board
    operators it shared it with can run. A run of the public set reproduces end to end with
    lab-core, given API access to the agent's model and both judges, but gives different numbers.
  source: src-harvey-blog-legal-agent-benchmark-initial-results
  quote: To evaluate agents in a standardized way, we created a hold-out set of legal tasks that
    mirror the practice areas and task distribution from the public LAB set.

task:
  exists: true
  input:
    - a short instruction written as a partner's request to an associate (about fifty words), with
      the deliverables it expects
    - a client matter in a sandboxed file system (matter files, a data room, templates, emails),
      with relevant and peripheral documents and issues planted across them
    - six workspace tools (bash, read, write, edit, glob, grep), a finish tool and skills for docx,
      pptx and xlsx files
  output: Deliverable files in the output directory (memos, reports, redlines, issues lists,
    spreadsheets, presentations), named in the task's deliverables map.
  scoring: Each criterion passes or fails on one judge call that sees only the deliverables it
    names; a criterion whose deliverables are missing fails without a call. A task scores 1 for a
    judge only if every criterion passes. The headline is the all-pass rate averaged over the two
    standard judges, so one task scores 0, 0.5 or 1; strict both-judge all-pass and the criterion
    pass rate (macro and pooled) are reported beside it.
  source: src-github-harveyai-harvey-labs-eval-strategies
  quote: The canonical headline remains the averaged all-pass rate; strict both-agree all-pass is
    reported separately.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: >
    Public on GitHub under MIT, with no gate: 2,010 tasks with instructions, documents and rubrics in
    27 practice-area directories (24 practice areas, contracts, diligence and firm knowledge, by GitHub's
    listing of tasks/ at 7f9b1ee), with the harness and grader. Withheld: the 120-task holdout on which
    every published score is computed, which Harvey shares with Vals AI and Artificial Analysis to run
    their boards, and the 100 LAB: USCL environments, which Harvey has not published because they draw
    on real litigation.
  access_basis:
    reason: The holdout behind the headline scores never becomes public; sharing it with two vetted
      board operators creates no public access path, which the term's inclusion test says does not
      change the tag. The public set is not the scored set of any published board.
    source: src-harvey-blog-legal-agent-benchmark-initial-results
    quote: To evaluate agents in a standardized way, we created a hold-out set of legal tasks that
      mirror the practice areas and task distribution from the public LAB set.
  refresh: versioned-releases
  refresh_basis:
    reason: The holdout behind the boards has changed only under labelled versions (Vals' v1 and
      v1.1, Artificial Analysis's v1.0 and v1.1, both listing what changed), and the public set grew
      in dated announcements and is pinned by release or commit, with a changelog of score-moving
      changes since September 2026. Dataset fixes before then are only in git history
      (review_checks).
    source: src-vals-ai-hlab
    quote: 'Harvey fixed the private holdout: 17 unsolvable criteria were removed and one mismatched source
      document was replaced. Still 120 tasks.'
  data_provenance:
    - expert-authored
    - curated-public-database
  data_provenance_note: Harvey built the tasks from real client matters handled by practising
    lawyers, split into associates' assignments, with expert-written criteria; the matter documents
    themselves are synthetic (fictional deals and parties), and the diligence extension's data rooms
    are synthetic too. How the synthetic documents are generated is not described in a passage read
    (review_checks). curated-public-database applies to the USCL track only, whose environments are
    built from briefs and filings in RECAP and opinions in CourtListener, checked and extended by
    hand from 40 to 100.
  data_provenance_basis:
    reason: The tasks were broken out of matters handled by practising lawyers and the criteria are
      expert-written; the authors' prior legal skill is what the items test.
    source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    quote: To scale the benchmark, we started with real client matters handled by practicing lawyers
      in each practice area.
  contamination_risk: medium
  contamination_risk_note: The public set has been on GitHub since May 2026 and Harvey offers its
    criteria as training reward signals, so the public tasks can reach training data. The headline
    holdout is private but mirrors the public set's distribution and is held by three parties. No
    source assesses contamination, and no canary string was seen in the files read.
  contamination_risk_source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
  contamination_risk_quote: The same criteria can be applied by an LLM judge, used to compare models
    and harness changes, and fed back into agent training loops as per-criterion reward signals.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: All-pass is bounded at 100%, every criterion of every task passed. No
    lawyer's or gold deliverable's score is published, and the holdout held 17 unsolvable criteria
    until its v1.1 remediation, so 100% was not reachable on the earlier holdout.
  ceiling_anchor_type_source: src-github-harveyai-harvey-labs-eval-strategies
  ceiling_anchor_type_quote: A task is only marked pass if every rubric criterion passes
  dataset_licence: MIT
  dataset_licence_note: The repository's licence, which covers the tasks directory; no separate data
    licence is stated. The holdout and the USCL environments are not released.
  dataset_licence_source: src-github-harveyai-harvey-labs-license
  dataset_licence_quote: MIT License Copyright (c) 2026 Harvey AI
  size:
    - count: 120
      unit: tasks
      subset: the private holdout behind every published board (v1.1)
      source: src-vals-ai-hlab
      quote: 'Harvey fixed the private holdout: 17 unsolvable criteria were removed and one mismatched
        source document was replaced. Still 120 tasks.'
    - count: 2010
      unit: tasks
      subset: the public set at commit 7f9b1ee (27 practice areas)
      source: src-github-harveyai-harvey-labs-eval-strategies
      quote: The benchmark contains 2,010 tasks across 27 practice areas, with ~114,000 rubric
        criteria.
    - count: 114000
      unit: rubric criteria (approximate)
      subset: the public set at commit 7f9b1ee
      source: src-github-harveyai-harvey-labs-eval-strategies
      quote: The benchmark contains 2,010 tasks across 27 practice areas, with ~114,000 rubric
        criteria.
    - count: 1250
      unit: tasks
      subset: the first release (May 2026), 24 practice areas
      source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
      quote: The change-of-control task is one of 1,250 tasks in LAB, spanning 24 legal practice
        areas.
    - count: 75000
      unit: expert-written rubric criteria (over)
      subset: the first release (May 2026)
      source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
      quote: The first version of LAB includes more than 1,200 agent tasks across 24 legal practice
        areas, and is evaluated by over 75,000 expert-written rubric criteria.
    - count: 500
      unit: tasks
      subset: the in-house contracting extension (June 2026)
      source: src-harvey-blog-legal-agent-benchmark-in-house-contracting
      quote: introducing 500 new tasks to LAB focused on contracting
    - count: 100
      unit: brief-writing environments
      subset: 'LAB: USCL (October 2026), unreleased'
      source: src-harvey-blog-legal-agent-bench-us-case-law
      quote: Through human review and manual correction, we expanded that to a final set of 100.
  size_note: The announcement says "more than 1,200" and, later, 1,250 tasks. The diligence
    extension gives no task count; its largest data room holds over 3,500 documents. The 27
    directories under tasks/ (24 practice areas plus contracts, diligence and firm-knowledge) were
    read from GitHub's API, not a quoted Source; Artificial Analysis says the holdout has five tasks
    per practice area.
  languages:
    - en
  languages_note: No source states a language; every task, instruction and document shown is in
    English, and the case-law track draws on US federal courts.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Harvey (Harvey AI Corporation)
  maintainer_basis:
    reason: Harvey built the tasks, holds the repository (harveyai on GitHub, an organisation
      account) and the private holdout, publishes the posts and releases lab-core.
    source: src-github-harveyai-harvey-labs-license
    quote: MIT License Copyright (c) 2026 Harvey AI
  maintainer_type: industry-lab
  maintainer_type_note: Harvey is a company selling legal AI software, including agents for legal
    work, as its site's navigation lists. Vals AI (HLAB-Vals) and Artificial Analysis (Harvey
    LAB-AA) run the boards on Harvey's holdout; Vals contributed a grading fix upstream.
  maintainer_type_source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
  maintainer_type_quote: AI agents designed for legal work
  submission_process:
    - maintainer-run
  submission_process_note: Harvey ran its own baseline of frontier models on the holdout (May 2026)
    and said it would partner with Artificial Analysis on a regularly updated leaderboard; Vals AI
    and Artificial Analysis now choose, run and publish the models on their boards; Vals lists
    Harvey as its partner in evaluation and Artificial Analysis built its v1.1 with Harvey. Nobody
    submits.
  submission_process_source: src-harvey-blog-legal-agent-benchmark-initial-results
  submission_process_quote: Since launch, we have been baselining frontier models from prominent AI
    providers on an evaluation set that mirrors the task distribution of LAB.
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-github-harveyai-harvey-labs-architecture
      quote: By default, grades independently with Sonnet 4.6 and GPT-5.5
  independence_flags_note: The two standard judges are themselves scored on the benchmark, Sonnet
    4.6 at 5.4% and GPT-5.5 at 2.1% in Harvey's initial results, and 38th and 42nd on Vals' v1
    board; Vals' 1.1 board keeps them while ranking later Anthropic and OpenAI models, and
    Artificial Analysis's three judges come from labs it ranks. maintainer-competes is not set,
    because no source read scores a Harvey system, although Harvey sells legal agents and uses LAB
    for its own product evaluation (review_checks). single-evaluator-private-test-set is not set,
    because three parties run the holdout and the public set is open. No source read says Vals AI or
    Artificial Analysis sells evaluations of the systems they rank, or that an evaluated party funds
    the benchmark.
  independence_assessed: true
  known_limitation:
    source: src-github-harveyai-harvey-labs-changelog
    quote: could pass criteria that check for the absence of something, such as distractors.
  known_limitation_note: Until 2026-11-11 a judge given a missing deliverable could pass criteria
    that check for an absence; and the holdout held 17 unsolvable criteria until Harvey remediated
    it for the boards' v1.1.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is the agent model's and the two judges' API calls, with a Podman sandbox per task
      on an ordinary machine; Harvey's top configuration cost about $50 and 20 minutes per task.
    source: src-harvey-blog-legal-agent-benchmark-initial-results
    quote: On LAB, reaching the top of the leaderboard runs to roughly $50 per task and over 20
      minutes of latency.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The published scores are on a holdout only Harvey and its two board partners hold, which
      the tier's inclusion covers; the public set runs fully automatically with the released
      harness.
    source: src-vals-ai-hlab
    quote: The results here are from the held-out set.
  reproducibility_blockers:
    - private-test-set
  reproducibility_blockers_note: Scoring also needs the two hosted judge models (Claude Sonnet 4.6
    and GPT-5.5), so official scores can be recomputed only while both are served; the vocabulary
    has no blocker for a hosted judge.
  harness_availability: official-harness
  harness: lab-core, the harvey-labs repository's agent harness and grader (tagged releases v1.1.0
    to v1.3.0, by GitHub's API; main bumped the version to 1.4.0 on 2026-11-12, not yet a release
    when read)
  harness_source: src-github-harveyai-harvey-labs-readme
  harness_quote: The harness and grader ship as the `lab-core` Python package
  harness_gotcha:
    source: src-github-harveyai-harvey-labs-readme
    quote: Scores from different releases are not always comparable
  harness_gotcha_note: The changelog marks lines across which results are not comparable (the
    dual-judge default on 2026-08-26, the finish tool on 2026-09-03, docx tracked changes on
    2026-11-05), and a custom judge pair is tagged custom-dual; a rerun must name the release or
    commit and the judges. The boards run modified harnesses (Vals' fixes, Artificial Analysis's
    Stirrup).
  code_licence: MIT
  code_licence_note: GitHub's licence field also reports MIT (API, read 2026-11-28).
  code_licence_source: src-github-harveyai-harvey-labs-license
  code_licence_quote: MIT License Copyright (c) 2026 Harvey AI
  runnable_via:
    - custom
  inspect_evals_id: null
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the model-graded profile ((rubric-graded, model-in-benchmark-harness) and (model-graded-judge, agent-scaffold)
  # resolve to it, which already covers the judge, its version and prompt, the rubric and the subset): the harness and
  # its release or commit (lab-core, Vals' modified copy, Artificial Analysis's Stirrup), the tools offered (USCL adds
  # OCR and, open-book, CourtListener search), the turn cap, the sandbox and the evaluation date, because the public
  # set and the holdout both changed between labels. USCL's Elo ratings depend on the pool of models in its
  # round-robin.
  material_extra:
    - harness
    - tools_allowed
    - max_steps
    - sandbox
    - date_evaluated
  rating_pool_required: true

aggregation_policy: official-aggregate
aggregation_policy_note: One all-pass rate per configuration, averaged over the two judges, with the
  criterion pass rate as a diagnostic and practice-area breakdowns; USCL reports Elo ratings
  instead.
aggregation_policy_basis:
  reason: The docs name one headline over all tasks.
  source: src-github-harveyai-harvey-labs-eval-strategies
  quote: The canonical headline remains the averaged all-pass rate; strict both-agree all-pass is
    reported separately.
secondary_axes:
  - cost
  - latency
secondary_axes_basis:
  reason: Harvey reports per-task cost and latency beside all-pass scores, and both boards list cost
    and duration per task.
  source: src-harvey-blog-legal-agent-benchmark-initial-results
  quote: On LAB, reaching the top of the leaderboard runs to roughly $50 per task and over 20
    minutes of latency.

liveness:
  repo_last_commit: 2026-11-12
  reproduction_script_present: true
  last_checked: 2026-11-28

homepage: https://www.harvey.ai/blog/introducing-harveys-legal-agent-benchmark
repository: https://github.com/harveyai/harvey-labs
leaderboard_url: null
leaderboard_url_note: Harvey keeps no leaderboard of its own; the boards are Vals AI's
  (https://www.vals.ai/benchmarks/hlab) and Artificial Analysis's
  (https://artificialanalysis.ai/evaluations/harvey-lab-aa), recorded as forks.

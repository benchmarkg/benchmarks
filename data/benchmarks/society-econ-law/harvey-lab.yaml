      - src-vals-ai-hlab
      - src-vals-ai-hlab-v1
      - src-artificialanalysis-harvey-lab-aa

subsets:
  - id: harvey-lab#holdout
    label: Private holdout
    items: 120
    scored_separately: true
    evidence:
      - source: src-harvey-blog-legal-agent-benchmark-initial-results
        quote: To evaluate agents in a standardized way, we created a hold-out set of legal tasks
          that mirror the practice areas and task distribution from the public LAB set.
      - source: src-vals-ai-hlab
        quote: 'Harvey fixed the private holdout: 17 unsolvable criteria were removed and one mismatched
          source document was replaced. Still 120 tasks.'
      - source: src-artificialanalysis-harvey-lab-aa
        quote: Five tasks per practice area
    notes: The set behind Harvey's initial results, Vals AI's boards and Artificial Analysis's; five
      tasks in each of 24 practice areas. Whether Harvey's May 2026 holdout is the same 120 tasks is
      not stated.
  - id: harvey-lab#public
    label: Public task set
    items: 2010
    scored_separately: true
    evidence:
      - source: src-github-harveyai-harvey-labs-eval-strategies
        quote: The benchmark contains 2,010 tasks across 27 practice areas, with ~114,000 rubric
          criteria.
      - source: src-vals-ai-hlab-v1
        quote: 'There are two datasets as of today: the public set and the held-out test set.'
      - source: src-arxiv-2607-25891-v2
        quote: 'we contribute new evaluations on six benchmarks: HarveyAI-Lab'
    notes: The open set on GitHub, which third parties run with lab-core or their own scaffolds. Its
      size grew from 1,250 tasks (May 2026); no board ranks it.
  - id: harvey-lab#uscl
    label: 'LAB: United States Case Law (LAB: USCL)'
    items: 100
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
      secondary:
        - society-econ-law/legal-reasoning
        - agents-tooluse/research-agents
    capability_override:
      - context-integration
      - tool-use
      - autonomy
    evidence:
      - source: src-harvey-blog-legal-agent-bench-us-case-law
        quote: 'Today we introduce LAB: United States Case Law (LAB: USCL), an evaluation framework for
          testing frontier models'
      - source: src-harvey-blog-legal-agent-bench-us-case-law
        quote: 'For each environment, we define two task conditions: open- and closed-book.'
      - source: src-harvey-blog-legal-agent-bench-us-case-law
        quote: From there, it works on its own, with no attorney feedback or follow-up prompts.
      - source: src-harvey-blog-legal-agent-bench-us-case-law
        quote: We evaluate model-written briefs pairwise in a round-robin tournament using GRMs
          which select the better brief (or declare a tie)
      - source: src-harvey-blog-legal-agent-bench-us-case-law
        quote: wins and losses in these head-to-head games into an Elo rating for each model
      - source: src-harvey-blog-legal-agent-bench-us-case-law
        quote: Unlike previous LAB releases, we are not currently publishing sample environments
          alongside this post.
    notes: The model writes the brief a party actually filed, for the same motion at the same point
      in the case, from the docket (closed-book, with the cited opinions supplied) or from the
      relevant filings and a CourtListener search tool (open-book), in the standard harness with
      compaction and OCR. Briefs meet in a round-robin of pairwise judgements whose criteria lawyers
      review, fitted to Elo; nearly 700 points separate the top and bottom models, with Opus 5.5
      first. Elo depends on the pool. The override drops factual-precision and
      constraint-satisfaction, which no criterion check scores here, and adds autonomy, which the
      post states.
subsets_note: The holdout and the public set are the two splits; USCL is a separately scored track,
  added in a dated post (a version). The contracting and diligence extensions are practice-area
  directories of the public set with no separately published score, so they are versions, not
  subsets; every practice area can be scored on its own with lab-core and the boards break scores
  down by practice area.

lineage:
  role: root
  role_note: The two boards are separately maintained derivatives by other maintainers, each with
    its own version labels and harness changes, so they are forks; neither has a record, and
    hlab-vals and harvey-lab-aa are proposed ids, not allocated ones (review_checks).
  forks:
    - id: hlab-vals
      maintainer: Vals AI
      source: src-vals-ai-hlab
      quote: Results are not comparable with the archived v1 board or with Artificial Analysis
    - id: harvey-lab-aa
      maintainer: Artificial Analysis (built with Harvey)
      source: src-artificialanalysis-harvey-lab-aa
      quote: Artificial Analysis' implementation of Harvey's Legal Agent Benchmark (LAB), testing AI
        agents on real-world legal work from Harvey's dataset of 120 private tasks spanning 24 legal
        practice areas.
lineage_note: >
  BigLaw Bench (biglaw-bench) is Harvey's earlier benchmark of short-horizon legal work, which Harvey
  names as the kind of evaluation LAB goes beyond ("our own earlier work on BigLaw Bench, have graded
  short-horizon reasoning", src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11). It is
  a separate benchmark with its own tasks, and Harvey still reports it, so it is neither superseded nor
  a variant; no lineage field holds the relation, and no correlation between them has been measured.


# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-28
  last_verified: 2026-11-28
  verification_status: ai-drafted-unverified
  sources:
    - src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
    - src-harvey-blog-legal-agent-benchmark-initial-results
    - src-harvey-blog-legal-agent-benchmark-in-house-contracting
    - src-harvey-blog-legal-agent-bench-m-and-a-due-diligence
    - src-harvey-blog-legal-agent-bench-us-case-law
    - src-github-harveyai-harvey-labs-readme
    - src-github-harveyai-harvey-labs-eval-strategies
    - src-github-harveyai-harvey-labs-architecture
    - src-github-harveyai-harvey-labs-changelog
    - src-github-harveyai-harvey-labs-license
    - src-vals-ai-hlab
    - src-vals-ai-hlab-v1
    - src-artificialanalysis-harvey-lab-aa
    - src-arxiv-2607-25891-v2
    - src-arxiv-2611-18856-v1
  sources_note: >
    Harvey's five LAB posts, read after harvey.ai's robots.txt (it allows every path to every agent) with
    scripts and styles stripped, withheld from archiving because their bylines and acknowledgements name
    people, with each date quoted with no window and every other window kept clear of them; the announcement's
    earlier Source (src-harvey-blog-introducing-harveys-legal-agent-benchmark, read 2026-11-08 for biglaw-bench)
    holds none of the quotes used here, so it was re-read. The repository's README, evaluation and architecture
    docs, changelog and licence at commit 7f9b1ee, which name no one. Vals AI's two boards, read one at
    a time over a minute apart after vals.ai's robots.txt (it allows /benchmarks/ and names Claude-User
    among the agents it allows), and Artificial Analysis's page, read after its robots.txt (Allow: /);
    all three are server-rendered and name no individual. The two arXiv PDFs (DOIs, not archived) were
    already in data/sources/ and are cited for evidence of use. Also read and not cited: Harvey's sitemap
    (for the post list), GitHub's API records of the repository, its commits, tags and releases (the release
    notes name contributors' accounts) and the tasks/ listing.
  confidence: medium
  review_checks:
    - check: Id. harvey-lab is proposed from the repository (harvey-labs), the README's and the
        boards' name (Harvey LAB, Harvey LAB-AA) and the acronym; Messier calls it HarveyAI-Lab and
        Vals HLAB. Id allocation is a human act.
      field: id
    - check: Family. society-econ-law/legal-document is primary because the rubric scores the legal
        content of the deliverables. APEX-Agents, also rubric-graded professional work in a tool
        environment (including corporate law), went to agents-tooluse/tool-api-calling; the
        difference relied on here is that LAB is legal work only, with generic workspace tools, and
        claims to measure legal work. Among agents-tooluse leaves, long-horizon-autonomy is the
        secondary; operating-system-tasks is the alternative, since bash and file reads are most
        calls.
      field: domain
      source: src-vals-ai-hlab
      quote: Tests an agent's ability to complete legal work using documents, spreadsheets,
        presentations, and file-system tools.
    - check: economically-valuable-work is rejected by its definition (expert comparison against
        human work product), while biglaw-bench, Harvey's other benchmark, takes it as a secondary
        on the same kind of evidence; one of the two should change so the family reads consistently.
      field: domain
      source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
      quote: To scale the benchmark, we started with real client matters handled by practicing
        lawyers in each practice area.
    - check: Lineage. HLAB-Vals and Harvey LAB-AA are recorded as forks (other maintainers, their
        own version labels, harness changes; Artificial Analysis also its own judges and a
        hallucination gate). Vals runs Harvey's own harness and grading on Harvey's holdout with
        Harvey as partner, and Harvey announced the Artificial Analysis board as its leaderboard, so
        either could instead be read as this benchmark's board (leaderboard_url) on the holdout
        subset. Neither fork has a record; their ids are proposals.
      field: lineage
      source: src-harvey-blog-legal-agent-benchmark-initial-results
      quote: We are partnering with Artificial Analysis to scale up LAB evaluation and publish a
        regularly-updated leaderboard as new model launches arrive.
    - check: Versions. holdout-1-1 is undated and known only from the boards. The 2026-09 revision
        is a grading and harness change, not new items, taken as breaking because the changelog says
        so; lab-core's releases (v1.1.0 2026-09-18, v1.2.0 2026-10-01, v1.3.0 2026-10-21, by
        GitHub's API) could instead each be a version, as the README asks claims to name one.
        Whether the in-house contracting and diligence additions are editions (new items, same task)
        rather than track-sets is not clear-cut under 04 S4.
      field: versions
      source: src-github-harveyai-harvey-labs-changelog
      quote: Single-judge results before this line are not comparable to dual results after it.
    - check: refresh versioned-releases follows the holdout behind the boards. On the public set,
        dataset fixes made before 2026-09-03 are recorded only in git history, not in the changelog,
        so a claim on the public set needs its commit; rolling-live is the alternative if the public
        set is taken as what claims use.
      field: data.refresh
      source: src-github-harveyai-harvey-labs-changelog
      quote: Dataset fixes from that period are not backfilled
    - check: data.access private-test-server rests on every published score being on the holdout.
        The 2,010-task public set is fully open (MIT, no gate) and is what third-party papers run;
        if it is read as the headline set, fully-open applies, and reproducible_by_third_party and
        reproducibility_tier change with it.
      field: data.access
    - check: maintainer-competes-on-own-benchmark is not set. Harvey sells legal agents, says it is
        building diligence agents and uses LAB for internal product evaluation, but no source read
        publishes a score for a Harvey system. Set the flag if Harvey or a board ranks one.
      field: governance.independence_flags
      source: src-harvey-blog-legal-agent-bench-m-and-a-due-diligence
      quote: how we are building specialized agents to help conduct diligence
    - check: grader-from-evaluated-party rests on the default judges, Claude Sonnet 4.6 and GPT-5.5,
        being ranked in Harvey's results and on Vals' v1 board. On HLAB-Vals-1.1 only later models
        of the same two labs are ranked, and Artificial Analysis says it found minimal
        self-preference among its three judges.
      field: governance.independence_flags
      source: src-vals-ai-hlab-v1
      quote: 38 Claude Sonnet 4.6 5.00%
    - check: data_provenance. The matter documents are synthetic, and the announcement's
        acknowledgements credit a document and scenario generation pipeline without saying whether a
        model writes the documents (the passage names a person, so it is not quoted). If a model
        does, add model-generated.
      field: data.data_provenance
      source: src-github-harveyai-harvey-labs-architecture
      quote: an agent reads a synthetic matter file and writes deliverables
    - check: activity no-submission-channel. Harvey promised standards for normalised submissions in
        May 2026; none was found in the posts or repository read, and the boards' operators pick the
        models. If a submission route exists, activity and submission_process change.
      field: activity
      source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
      quote: We're intentionally launching LAB without a leaderboard because we expect the dataset
        to evolve over time
  personal_data_excluded:
    - source: src-harvey-blog-introducing-harveys-legal-agent-benchmark-2026-11
      what: the byline's authors and the acknowledgements' names of Harvey staff and outside
        reviewers, and a named commentator quoted in the post
    - source: src-harvey-blog-legal-agent-benchmark-initial-results
      what: the byline's authors
    - source: src-harvey-blog-legal-agent-benchmark-in-house-contracting
      what: the byline's authors and the acknowledgements' names
    - source: src-harvey-blog-legal-agent-bench-m-and-a-due-diligence
      what: the byline's author
    - source: src-harvey-blog-legal-agent-bench-us-case-law
      what: the byline's authors and a named research partner

# data/benchmarks/society-econ-law/glee.yaml
#
# P1-S9-T05, society-econ-law entry 7 of 7. Filled from the GLEE paper, arXiv 2410.05254 read as its v3 PDF
# (2026-03-02), and its abstract page; the repository README at master (eilamshapira/GLEE); the project page on
# the first author's site (scripts and styles stripped); the GLEE Competition's developer documentation
# (glee-competition.com/llms.txt, the plain-text mirror of its docs page); and the v2 PDF of ARIA (arXiv
# 2506.00539, June 2025), another group's paper that evaluates on GLEE configurations. Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.

id: glee
name: GLEE
aliases:
  - Games in Language-based Economic Environments
  - GLEE Competition
tagline: Two-player bargaining, negotiation and persuasion games in language, scored on self-gain,
  efficiency and fairness.
description: >
  GLEE (Games in Language-based Economic Environments) is a framework and benchmark in which two
  players, language models or people, play sequential economic games and may attach free-text
  messages to their moves. It has three families taken from economic theory: bargaining over the
  division of a sum that shrinks with every round of delay (after Rubinstein), negotiation between a
  seller and a buyer over the price of one good (bilateral trade), and repeated persuasion, in which a
  seller who knows each product's quality sends a message before the buyer decides (cheap talk). Each
  family is parameterised by horizon, information (whether a player knows the other's preferences),
  whether messages are allowed, stakes, and discount factors or valuations. A game is scored by each
  player's self-gain and by the outcome's efficiency and fairness, most of them normalised to [0, 1].
  The paper ran 13 LLMs in all 169 pairings across 1,320 configurations (about 80K games) inside its
  own fixed-prompt game manager, and 3,405 crowdworkers played against Gemini-1.5-flash. Results are
  linear-regression estimates per family, role and metric that control for configuration and
  opponent, so a model's number depends on whom it played. The GLEE Competition (August 2026, the IAB
  workshop at NeurIPS 2026) put agents and humans in one live matchmaking pool, rated by
  opponent-adjusted payoff percentiles.
self_description:
  source: src-arxiv-2410-05254-v3
  quote: we introduce a benchmark for standardizing research on two-player, sequential,
    language-based games
external_ids:
  arxiv: '2410.05254'
paper:
  title: 'GLEE: A Unified Framework and Benchmark for Language-based Economic Environments'
  arxiv: '2410.05254'
  version_read: v3
  source: src-arxiv-2410-05254-v3
released: 2024-10-07
released_note: The paper's first arXiv version, as its abstract page dates it; v3, the version read,
  was posted on 2026-03-02. No peer-reviewed venue is named in the sources read.
released_source: src-arxiv-2410-05254
released_quote: Submitted on 7 Oct 2024

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/economics-simulation
  secondary:
    - games-planning/multi-agent-social
domain_basis:
  reason: Two family tests pass. The scores come from games against an opponent that responds
    (games-planning), and what they measure is the economic outcome of market-like exchanges,
    self-gain, efficiency and fairness (society-econ-law). The benchmark's own claim decides; it
    models LLMs as economic agents in parameterised economic environments and measures how market
    parameters shape the outcome, the economics-simulation leaf. The persuasion family's repeated
    cheap talk turns on reputation and trust, the social dynamics of the secondary leaf.
  source: src-arxiv-2410-05254-v3
  quote: our focus extends to evaluating the outcome reached by the strategic behavior of the
    agents, using the fundamental economic notions of efficiency and fairness
domain_considered_and_rejected:
  - term: games-planning/game-theory
    reason: The paper reviews each family's equilibria, but no score is computed against a solution
      concept; players are scored on their payoffs against the other players in the pool, which the
      leaf's definition puts outside it.
    source: src-arxiv-2410-05254-v3
    quote: the cheap-talk game only admits a babbling equilibrium
  - term: agents-tooluse/negotiation
    reason: The leaf's definition fits the bargaining and negotiation families, but the
      agents-tooluse family test needs an autonomous loop acting through tools, APIs, a browser or
      an operating system, and its exclusion sends a game environment to games-planning. The players
      exchange only offers, decisions and messages.
  - term: society-econ-law/trading-market-interaction
    reason: Negotiation and persuasion are seller-buyer exchanges, but each game is a bilateral,
      stylised model from economic theory rather than a market of many traders, and the paper's
      claim is a simulation framework for economic environments.
capability:
  - planning
  - communication
  - collaboration
capability_basis:
  planning:
    reason: Each game is an interactive episode against an explicit objective, the player's payoff,
      and the payoff scores the sequence of offers, decisions and messages the player made. The
      paper ties the horizon parameter to planning.
    source: src-arxiv-2410-05254-v3
    quote: This factor influences the strategies agents adopt, particularly in terms of long-term
      planning and anticipation of future moves
  communication:
    reason: In persuasion the seller's payoff is whether the buyer buys after reading its message,
      so the score depends on what the recipient did, not on the message itself. The term holds for
      that family only.
    source: src-arxiv-2410-05254-v3
    quote: Alice gets a utility of 1 if Bob buys (regardless of the true product quality), and 0
      otherwise
  collaboration:
    reason: Bargaining and negotiation are mixed-motive, since delay shrinks the bargaining pot and
      a price between the two valuations gains both sides, and efficiency and fairness score the
      outcome the two players reach together. The paper claims that language serves coordination
      toward mutually beneficial outcomes.
    source: src-arxiv-2410-05254-v3
    quote: so language becomes essential for coordination, signaling intentions, and achieving
      mutually beneficial outcomes
capability_considered_and_rejected:
  - term: honesty
    reason: A persuasion seller may misstate a product's quality, but only the purchase and its
      payoff are scored; truthfulness is not scored apart from them.
  - term: optimization
    reason: Payoffs are ranked, but a payoff is not a function of the player's own output alone; it
      depends on the opponent's replies, so the objective is not a stated function to optimise.
  - term: long-horizon-execution
    reason: Persuasion runs over many rounds, but each turn's message carries the history or its
      sufficient statistics, and a bad round does not make later gains unattainable.

evaluation_method:
  - simulation-rollout
  - tournament-play
evaluation_method_note: The simulation-rollout formula per family is in the paper's section 2;
  negotiation's fairness is not normalised, because the price is unbounded in principle (footnote
  6). The pool dependence is the paper's own finding, that no model is best against every opponent,
  and a model's performance depends on which LLM it faces.
evaluation_method_basis:
  reason: Each game is run in GLEE's game engine and scored per game on bounded measures (all but
    negotiation's fairness normalised to [0, 1]). The LLMs play every pairing, and the published
    estimates are fitted to those games, so a model's number depends on the pool; the paper finds no
    model best against all opponents. The 2026 competition rated agents and humans from games in one
    shared pool.
  source: src-arxiv-2410-05254-v3
  quote: The 169 possible pairs (including a language model playing against itself, with attention
    to the assignment for Alice or Bob) played across 1,320 different configurations
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Efficiency and fairness are economic notions, but GLEE defines its own formulas for them
      (bargaining fairness is one minus four times the squared distance of the share from one half),
      not measures standardised within economics, which the term asks for.
    source: src-arxiv-2410-05254-v3
    quote: Metrics are normalized to [0, 1], such that higher values indicate better (more efficient
      or fair) outcomes
  - term: entrant-relative-ranking
    reason: The estimates and the competition's ratings move with the pool, but the term's exclusion
      sends a rating fitted to games between entrants to tournament-play.
  - term: human-distribution-percentile
    reason: The competition turned each payoff into a percentile, but against every payoff on that
      configuration and role, earned by LLMs, agents and humans alike, not against a measured human
      population.
    source: src-glee-competition-docs
    quote: After each game your payoff is converted to a percentile against every payoff earned on
      the SAME configuration in the SAME role (seeded by the GLEE research dataset, joined by
      competition games as they are played).

designed_for_subjects:
  - model-in-benchmark-harness
  - multi-agent-system
  - classical-algorithm
  - human-nonexpert
designed_for_subjects_note: >
  model-in-benchmark-harness: the paper runs every LLM inside its own game manager, with one fixed
  prompt for all models, and its rows name only the model. multi-agent-system: two autonomous agents
  play and their interaction sets both payoffs, which agent-scaffold's exclusion sends here.
  human-nonexpert: the paper's comparison data come from 3,405 mTurk workers with no skill screen, and
  the competition had a human track.
designed_for_subjects_basis:
  reason: The competition's agent track admits any decision procedure, from prompted LLMs to
    classical game-theoretic solvers, each an independent agent negotiating with others, and its
    human track scores people on the same scale.
  source: src-glee-site
  quote: 'Nothing constrains how it decides: a prompted LLM, a fine-tuned one, a classical game-theoretic
    solver, or any mix of them.'
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: Competition entrants bring their own loop, the term's inclusion, but its exclusion sends
      several independent agents negotiating with each other to multi-agent-system.
  - term: instruction-tuned-model
    reason: Its exclusion applies; GLEE's game manager drives each model across turns.
    source: src-arxiv-2410-05254-v3
    quote: Each time the language model is required to make a decision (of any type), the language
      model receives a message containing all the information that has accumulated since its
      previous turn
  - term: rl-policy
    reason: The competition admits RL policies and ARIA trains language agents with RL on GLEE games
      (as_used), but the paper designs GLEE for prompted models and people, not as an environment
      for trained policies.
as_used:
  - protocol: ARIA (Fudan University and ByteDance Seed) trains language agents with reinforcement
      learning and evaluates them on 48 GLEE bargaining and negotiation configurations, each role
      played 25 times against fixed opponents, reporting a win rate (a higher payoff than the
      opponent in bargaining, a better price in negotiation) rather than GLEE's self-gain,
      efficiency or fairness.
    source: src-arxiv-2506-00539-v2
    quote: following GLEE [43], we evaluate ARIA across 48 game configurations
    note: The v2 preprint (2025-06-04); the project page reports the paper as a NeurIPS 2025
      spotlight. Win rate against fixed opponents is not comparable with GLEE's pool-fitted
      estimates.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. The maintainers' competition ran in August 2026 with
    hundreds of agents and humans, competition papers were due in September 2026 for the NeurIPS
    2026 workshop, and another group evaluated on GLEE configurations in 2025 (as_used).
  source: src-glee-competition-docs
  quote: In 29 days, 542 agents (from 196 operators) and 315 humans played 8,614,601 games and made
    177,199,691 decisions.
activity: closed
activity_note: The paper's framework has no submission channel of its own; outside the competition,
  results appear in papers. The project page says a pilot of the competition ran before it.
activity_basis:
  reason: The competition was the only route for outside results, and it closed on 2026-08-29 (AoE).
    No further round is announced in the sources read.
  source: src-glee-competition-docs
  quote: The competition closed on August 29, 2026.

events:
  - name: GLEE Competition 2026
    kind: competition
    source: src-glee-site
    quote: the official competition of the First Workshop on Interpreting Agent Behavior (IAB) at
      NeurIPS 2026

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude 3.5 Sonnet
    source: src-arxiv-2410-05254-v3
    observed_on: 2026-10-14
    quote: across the evaluated LLMs (claude-3.5-sonnet, see Table 6)
    note: The model with the highest self-gain as Bob among the paper's 13 LLMs (Table 6).
evaluation_target: learned-system
evaluation_target_note: Built to evaluate LLM agents; people are the paper's comparison group and,
  in the competition, a track ranked on the same scale.
execution_mode: automated
execution_mode_note: LLM-vs-LLM games run unattended. The human comparison data came from
  crowdworkers playing through an oTree interface.
ground_truth_source: simulation
ground_truth_source_note: Payoffs are computed by the game engine from the players' moves under each
  family's rules; there is no reference answer.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The engine, prompts, analysis code and the paper's game records are public, and the
    players are API models; a rerun is relative to its own pool, and the competition's live pool
    cannot be recreated.
  source: src-github-glee-readme
  quote: This repository includes all the necessary code and data to run experiments, collect new
    data, and replicate or extend the results from the corresponding research paper

task:
  exists: true
  input:
    - the game's rules and the configuration's parameters (stakes, horizon if known, discount
      factors or valuations, information condition, whether messages are allowed), then each turn
      the other player's last offer, decision or message and what has happened since
  output: Each turn, an offer (a division, a price, or the seller's message or binary
    recommendation) with an optional free-text message, or a decision to accept or reject, as JSON.
  scoring: Per game, each player's self-gain and the outcome's efficiency and fairness, defined per
    family. The paper reports linear-regression estimates per family, role and metric that control
    for configuration and opponent. The 2026 competition turned each payoff into an
    opponent-adjusted percentile against all payoffs on that configuration and role, rated players
    from it, and ranked by the mean of the three family ratings.
  source: src-arxiv-2410-05254-v3
  quote: Each time the language model is required to make a decision (of any type), the language
    model receives a message containing all the information that has accumulated since its previous
    turn
entrant_classes:
  - class: autonomous agents (Python SDK or REST API)
    ranked_separately: true
    source: src-glee-competition-docs
    quote: 'Tracks: autonomous agents (Python SDK / REST API) and humans (browser play).'
  - class: humans (browser play)
    ranked_separately: true
    source: src-glee-competition-docs
    quote: 'Tracks: autonomous agents (Python SDK / REST API) and humans (browser play).'
entrant_classes_note: The 2026 competition only. Both tracks played in one pool on one rating scale,
  with prizes and rankings per track.

# --- Data ------------------------------------------------------------------------------------

data:
  access: generated-on-demand
  access_basis:
    reason: The scored items are games that two players produce afresh in the GLEE engine, on
      configurations drawn from a parameter grid, so no fixed item set exists. The paper's game
      records are public (records_access).
    source: src-arxiv-2410-05254-v3
    quote: is infinite for each of the game families, it is clear that data cannot be collected from
      all possible games
  records_access: fully-open
  records_access_note: The LLM-vs-LLM and human-vs-LLM game records are in the repository's Data/
    folder. No licence is stated for them.
  records_access_source: src-arxiv-2410-05254-v3
  records_access_quote: Code and data are available in https://github.com/eilamshapira/GLEE
  refresh: versioned-releases
  refresh_basis:
    reason: The paper's protocol is fixed in its arXiv versions (v3 is the one read), and the 2026
      competition was a dated edition with its own grid and scoring. Within the competition's 29
      days the pool, and so every rating, moved continuously.
    source: src-glee-competition-docs
    quote: each configuration is drawn by the server from a grid of 960 combinations
  data_provenance:
    - synthetic-procedural
  data_provenance_note: Configurations come from a grid of parameter values, and games are played
    out under rule-based engines. The players' moves and messages are the evaluation, not its data;
    the released records hold LLM transcripts and crowdworkers' play.
  data_provenance_source: src-arxiv-2410-05254-v3
  data_provenance_quote: 'In total, we collected data from 1,320 different configurations: 384 configurations
    of bargaining, 576 configurations of negotiation, and 360 configurations of persuasion games'
  contamination_risk: low
  contamination_risk_note: >
    Games are played, not retrieved: the outcome of a new game does not exist until it is played. The
    released records include LLM transcripts on every paper configuration, so a system could be trained
    on how those 13 models play, and the competition's percentiles were seeded with that dataset.
    That is learning the opponents rather than the answers; recorded, not escalated.
  contamination_evidence: []
  ceiling_anchor_type: crowd-average
  ceiling_anchor_type_basis:
    reason: The paper publishes the crowdworkers' self-gain beside the LLMs' (the human row of Table
      6) and asks how LLMs compare with them. Humans fall above or below every LLM depending on
      family and role, so it is a comparison point rather than a ceiling, which none-known's
      exclusion still sends to the anchor's type. The workers were recruited on mTurk with no skill
      screen.
    source: src-arxiv-2410-05254-v3
    quote: How do they perform compared to humans?
  dataset_licence_note: No licence is stated for the game records in the README or the paper, and
    GitHub reports none for the repository (API, read 2026-10-14).
  size:
    - count: 1320
      unit: game configurations (384 bargaining, 576 negotiation, 360 persuasion)
      subset: the paper's LLM-vs-LLM data
      source: src-arxiv-2410-05254-v3
      quote: 'In total, we collected data from 1,320 different configurations: 384 configurations of bargaining,
        576 configurations of negotiation, and 360 configurations of persuasion games'
    - count: 195
      unit: configurations played by humans (78 bargaining, 60 negotiation, 57 persuasion)
      subset: the paper's human-vs-LLM data
      source: src-arxiv-2410-05254-v3
      quote: 'We collected human data from 195 different configurations: 78 of which were bargaining games,
        60 of which were negotiation games, and 57 were persuasion games'
    - count: 3405
      unit: human players (mTurk), each against Gemini-1.5-flash
      subset: the paper's human-vs-LLM data
      source: src-arxiv-2410-05254-v3
      quote: through which we recruited 3,405 players who participated in various configurations
        against Gemini-1.5-flash
    - count: 960
      unit: configuration combinations in the competition's grid
      subset: 2026 competition
      source: src-glee-competition-docs
      quote: each configuration is drawn by the server from a grid of 960 combinations
  size_note: The paper's LLM-vs-LLM data hold 587K decisions in more than 80K games by 13 LLMs,
    which the paper gives rounded; each LLM played 2,500 bargaining, 2,500 negotiation and 1,000
    persuasion games in each role.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Eilam Shapira and co-authors (Technion, Faculty of Data and Decision Sciences)
  maintainer_basis:
    reason: The code and data sit in the first author's GitHub account, and the competition names
      four Technion organisers, all authors of the paper.
    source: src-glee-competition-docs
    quote: Eilam Shapira, Omer Madmon, Moshe Tennenholtz, Roi Reichart -- Technion, Faculty of Data
      and Decision Sciences.
  maintainer_type: individual
  maintainer_type_note: The repository is eilamshapira/GLEE, one person's account, and no source
    read states that the Technion holds the benchmark. academic-lab was considered, since every
    organiser is at the Technion, and the term's exclusion sends a personal account to individual.
  submission_process:
    - live-arena
    - maintainer-run
  submission_process_note: >
    live-arena: in the 2026 competition, agents and humans played one another in a shared matchmaking
    pool and were rated from those games. maintainer-run: the paper's 13 LLMs were run by the authors,
    and the competition board carried Gemini models the organisers ran as unranked reference rows
    ('Leaderboard entries typed "LLM" are Gemini models the organizers run'). Competition papers were
    invited but not required to rank ("Acceptance is independent of the leaderboard"). Outside the
    competition, results appear in papers.
  submission_process_source: src-glee-competition-docs
  submission_process_quote: Both share one matchmaking pool and one rating system.
  independence_flags: []
  independence_flags_note: >
    Not assessed to completion. The competition site shows Salesforce (gold) and Google (bronze) as
    sponsors only as logos in its script bundle; whether they funded the $6,000 prize pool
    (prize-sponsored-by-industry) or gave API credits is not stated in any text read. Google's Gemini
    models are the organisers' reference rows on the board and were the human players' only opponent
    in the paper, so funded-by-evaluated-party would apply if Google's support covered them. The Gemini
    rows were unranked and never prize-eligible, and the organisers entered no system of their own.
  independence_assessed: false
  known_limitation:
    source: src-arxiv-2410-05254-v3
    quote: These averages are therefore highly sensitive to the particular configurations and the
      configuration distributions in our dataset

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The engine and the analysis run on one CPU; the LLM players are called through their
      providers' APIs (litellm in the repository).
    source: src-arxiv-2410-05254-v3
    quote: 'The system does not require any specialized hardware: data collection and analysis can be
      performed efficiently using a single CPU'
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: >
    For the paper's protocol: the engine, prompts, analysis and game records are public, and the
    players are API models. A rerun is relative to its own pool and the paper's model snapshots retire,
    which is live-world-state by that term's test, but tier 3 forbids the blocker beside
    fully-automatable (as Kaggle Game Arena's entry records). The competition's ratings came from a
    live pool on the organisers' server, which has closed, and cannot be reproduced.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: GLEE (github.com/eilamshapira/GLEE) -- main.py with sample configurations for LLM-vs-LLM
    games, an oTree app for human-vs-LLM games, and the analysis suite
  harness_source: src-github-glee-readme
  harness_quote: This repository includes all the necessary code and data to run experiments,
    collect new data, and replicate or extend the results from the corresponding research paper
  code_licence_note: No licence. GitHub's licence metadata for eilamshapira/GLEE reports none (API,
    read 2026-10-14; last pushed 2026-02-08), and the README states none; not a quoted Source. The
    competition SDK repository (eilamshapira/GLEE_competition) likewise reports none.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # tournament-play x classical-algorithm resolves eligibility-gated, which makes eligibility_track,
  # training_data_eligibility, training_data_policy and decontamination_applied material; GLEE has no
  # training-data tracks, so three of them have no counterpart here (review_checks, left material per
  # ADR-0024 D3). Beyond the profile: GLEE's game manager and its fixed prompt (harness,
  # prompt_template_hash), the model snapshot, and how many games per configuration a number averages
  # (n_samples). A number is relative to its pool of opponents and to the configuration distribution
  # ("These averages are therefore highly sensitive to the particular configurations", the paper).
  material_extra:
    - harness
    - prompt_template_hash
    - provider_snapshot
    - n_samples
  rating_pool_required: true
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: The paper fits a separate regression for each family and metric and reports each role
    apart, with no single score. The 2026 competition did average the three family ratings into an
    overall board ("The overall leaderboard averages your three family ratings").
  source: src-arxiv-2410-05254-v3
  quote: We train a separate linear regression model for each combination of game family and
    evaluation metric

homepage: https://eilamshapira.com/projects/glee/
repository: https://github.com/eilamshapira/GLEE


# data/benchmarks/society-econ-law/stockbench.yaml
#
# P1-S9-T06, society-econ-law entry 12. Filled from the StockBench paper, arXiv 2510.02209 read as its v2 PDF
# (2026-03-02), and its abstract page; the repository README pinned at commit ce8b2b3 (ChenYXxxx/stockbench, the
# head of main); the project page and its leaderboard table (stockbench.github.io, scripts and styles stripped);
# the README of an independent port of StockBench to Inspect, pinned at commit 5d647de (October 2026), which reruns
# the released environment and reports results and parity checks; and the v2 PDF of FM-Bench (arXiv 2608.18423,
# August 2026), a paper that describes StockBench's environment. GitHub's API was read for the licence, push
# dates and the repository tree. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# The id `stockbench` is proposed from the Sources' name; allocation is a human act (04 S3).

id: stockbench
name: StockBench
aliases:
  - STOCKBENCH
tagline: LLM agents trade 20 Dow Jones stocks daily over four months of 2025 data, scored on return,
  drawdown and Sortino ratio.
description: >
  A benchmark from Tsinghua University and Beijing University of Posts and Telecommunications in which
  a language model acts as a stock-trading agent in a back-trading environment built from real market
  data. The agent starts with $100,000 in cash and, at each market open over 82 trading days (3 March
  to 30 June 2025), sees prices, its holdings and recent actions, and up to five news articles from the
  previous 48 hours for each of the 20 highest-weighted stocks of the Dow Jones Industrial Average; it
  picks stocks for a closer look at their fundamentals, then sets a dollar target for each stock (increase,
  decrease or hold), which the environment converts into shares at the opening price. Every model runs
  inside the benchmark's own fixed four-step workflow. A run is scored on final return, maximum drawdown
  and Sortino ratio, averaged over three runs, and models are ranked by the mean of the three metrics'
  z-scores, so a rank depends on the other models in the table. An equal-weight buy-and-hold portfolio
  is the reference (0.4% return, -15.2% drawdown); in the paper most of 13 models beat it on return, by
  at most about two percentage points. The environment replays history, so the agent's trades never move
  prices. Code and the cached market data are public under Apache-2.0, for non-commercial research.
self_description:
  source: src-arxiv-2510-02209-v2
  quote: we introduce STOCKBENCH, a contamination-free benchmark designed to evaluate LLM agents in
    realistic, multi-month stock trading environments
external_ids:
  arxiv: '2510.02209'
paper:
  title: 'StockBench: Can LLM Agents Trade Stocks Profitably In Real-world Markets?'
  arxiv: '2510.02209'
  version_read: v2
  source: src-arxiv-2510-02209-v2
released: 2025-10-02
released_note: The paper's first arXiv version, as its abstract page dates it; the repository was
  created the same day (GitHub API). v2, the version read, was posted on 2026-03-02. No
  peer-reviewed venue is named in the sources read.
released_source: src-arxiv-2510-02209
released_quote: Submitted on 2 Oct 2025 (v1), last revised 2 Mar 2026 (this version, v2)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/trading-market-interaction
  secondary: []
domain_basis:
  reason: The agent acts inside a market environment -- buying, selling and holding stocks against
    real prices -- and the scored quantities are the outcome of that trading, the portfolio's
    return, drawdown and risk-adjusted return, which is the trading-market-interaction leaf and the
    family's inclusion test (the scored quantity concerns markets). The paper's claim is
    profitability and risk management, not the operation of an interface.
  source: src-arxiv-2510-02209-v2
  quote: Performance is measured using financial metrics such as cumulative return, maximum
    drawdown, and the Sortino ratio, capturing both profitability and risk management.
domain_considered_and_rejected:
  - term: agents-tooluse/long-horizon-autonomy
    reason: The family's near miss (osworld-2-0) and vending-bench-2 score what an autonomous loop
      achieved with tools; here the agent chooses no tools and runs no loop of its own. Each day the
      benchmark's fixed workflow hands it the data and takes back a decision per stock, and the
      score is the portfolio's market outcome, so the subject is the economic result rather than
      autonomous operation, and the society-econ-law exclusion does not apply.
    source: src-arxiv-2510-02209-v2
    quote: We keep the workflow minimal, since overly complicated workflows introduce inductive
      biases that may favor certain backbone LLMs.
  - term: games-planning/open-ended-environments
    reason: Each run is a long episode, but games-planning's test needs an environment that
      responds, and this one replays recorded prices that the agent's trades do not affect; the goal
      (profit with controlled risk) is also fixed, not open-ended.
    source: src-arxiv-2608-18423-v2
    quote: Even there, the environment does not push back, as StockBench replays real markets the
      agent
  - term: society-econ-law/finance-forecasting
    reason: The agent never states a predicted price, return or volatility; it sets positions, and
      only the realised portfolio outcome is scored.
    source: src-arxiv-2510-02209-v2
    quote: 'choosing between three actions: (1) increase, (2) decrease, or (3) hold the position'
  - term: society-econ-law/financial-analysis
    reason: The paper's contrast is with static financial question answering; no question is posed
      or answered.
    source: src-arxiv-2510-02209-v2
    quote: showing that strong performance on static financial question-answering do not necessarily
      translate into effective trading behavior
  - term: society-econ-law/economics-simulation
    reason: The agent does not model economic agents or a system; it acts inside a replay of one
      real market, which trading-market-interaction names (vending-bench-2 drew the same line).
capability:
  - optimization
  - context-integration
capability_basis:
  optimization:
    reason: The benchmark states its objectives (profit and risk control, measured by return,
      drawdown and Sortino ratio) and ranks systems by how well they achieve them, through the
      z-score aggregate; no answer key exists.
    source: src-arxiv-2510-02209-v2
    quote: Models are ranked based on the z-score aggregation of all three metrics.
  context-integration:
    reason: The environment supplies the prices, news and fundamentals each decision is made from,
      and the paper's ablation shows that removing the news and then the fundamentals lowers the
      return, so the score depends on using the supplied material.
    source: src-arxiv-2510-02209-v2
    quote: cumulative returns drop as news and then fundamentals are removed, confirming their
      importance
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: A run is 82 dependent daily decisions over a carried portfolio, but there is no full
      success to lose; a bad day's trades can be made up later, which the term's test excludes.
  - term: planning
    reason: The executed trades could be read as a plan against an objective, but the paper claims
      continuous decision making, not planning, and the term asks that the source claim planning.
  - term: autonomy
    reason: No human intervenes, but the protocol neither forbids nor measures intervention; the run
      is long, which the term's exclusion says is not enough.
  - term: distribution-shift-generalization
    reason: The paper compares rankings over a downturn and an upturn window as an analysis, but the
      benchmark's scores come from one window, not from a deliberately shifted one.
    source: src-arxiv-2510-02209-v2
    quote: all LLM agents underperform the passive baseline during the downturn but outperform it in
      the upturn
  - term: quantitative-reasoning
    reason: The paper counts arithmetic errors in share quantities, but the scored output is a
      portfolio outcome, not a number the agent computes, and the environment converts dollar
      targets into shares itself.
    source: src-arxiv-2510-02209-v2
    quote: the decisions are executed by converting dollar targets into share quantities based on
      the opening price

evaluation_method:
  - domain-metric
  - entrant-relative-ranking
evaluation_method_note: Final return is the percentage change in portfolio value; maximum drawdown
  the largest peak-to-trough fall; Sortino ratio the return over the downside deviation, daily and
  not annualised. Each is reported per model (mean of three runs), and the rank is the mean of
  z(return), -z(drawdown) and z(Sortino) across the models in the table. No Metric records exist yet
  for the three measures, so headline_metric and metrics are left unset (review_checks).
evaluation_method_basis:
  reason: Maximum drawdown and the Sortino ratio are measures standardised in finance, which the
    paper cites to that literature, and the published rank z-scores each metric against the field of
    entrants, so adding a model moves every other model's rank with no change to its runs, the
    inclusion case of entrant-relative-ranking.
  source: src-arxiv-2510-02209-v2
  quote: Models are ranked based on the z-score aggregation of all three metrics.
evaluation_method_considered_and_rejected:
  - term: episodic-return
    reason: Final return accumulates over the episode with no maximum, but it is a finance measure
      of a portfolio, not a reward signal from a control environment, and it is one of three metrics
      combined in the rank; the unbounded scale is recorded under ceiling_anchor_type
      (review_checks).
  - term: composite
    reason: The rank combines three sub-scores, but all three come from one method (finance measures
      of the same equity curve), and domain-metric's exclusion says not to tag the aggregation of
      such metrics; the pool-relative z-scoring is entrant-relative-ranking.
  - term: simulation-rollout
    reason: The back-trading environment is a replay of recorded market data, not a physical or game
      simulator, and the scores are unbounded finance measures rather than a bounded episode
      outcome.
designed_for_subjects:
  - model-in-benchmark-harness
  - classical-algorithm
designed_for_subjects_note: >
  model-in-benchmark-harness: every row of the paper's table names a backbone LLM run through the same
  four-step workflow (portfolio overview, stock analysis, decision, execution and validation), with the
  same 32,768-token context. classical-algorithm: the passive equal-weight buy-and-hold portfolio is ranked
  in the same table, at 12th of 14.
designed_for_subjects_basis:
  reason: The workflow is held fixed and minimal so that only the backbone model varies, and the
    buy-and-hold strategy is implemented as the reference row.
  source: src-arxiv-2510-02209-v2
  quote: As a reference point, we implement a passive equal-weight buy-and-hold strategy
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: The README invites custom trading agents, but the paper and the leaderboard evaluate
      backbones in the fixed workflow only, and no ranked row is an outside agent.
    source: src-github-stockbench-readme
    quote: Extend the platform with your own trading strategies by implementing custom agents.
  - term: reasoning-model
    reason: The paper compares thinking and instruct variants (Qwen3-235B, DeepSeek), but the
      reasoning setting is a property of the model row, not a condition the benchmark varies or
      reports.
observed_subjects:
  values:
    - model-in-benchmark-harness
    - classical-algorithm
  basis: Every leaderboard row read is a provider model (Kimi-K2, Qwen3, GLM-4.5, OpenAI-O3,
    Claude-4-Sonnet, DeepSeek, GPT-5, GPT-OSS) or the passive baseline; the Inspect port's rows are
    two locally served open models.
  source: src-stockbench-github-io
as_used:
  - protocol: An independent port of the released environment to Inspect (October 2026), using the
      original prompts unchanged, three epochs per model and temperature 0.7, with two fixes that
      move numbers -- 83 trading days rather than the original code's 86 (which counts Good Friday,
      Memorial Day and Juneteenth), and no news from the decision day -- and the released code's
      1-basis-point commission. It reproduces the paper's buy-and-hold row exactly and reports two
      quantised open models run locally.
    split: the paper's window, 2025-03-03 to 2025-06-30, 20 stocks
    source: src-github-stockbench-inspect-readme
    quote: Each model ran 3 epochs on the full window, 2025-03-03 to 2025-06-30
    note: A third-party port, not by the StockBench authors. Its numbers are not the paper's
      protocol (calendar, news window, quantisation, serving stack), and it reports that epochs of
      one model differ by several points of return.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it; an independent port to Inspect, published in October
    2026, reruns the environment, reproduces the paper's baseline and reports new model runs. The
    maintainers' repository was last pushed on 2025-10-28 and the project page on 2025-10-05 (GitHub
    API), which is maintenance evidence, not lifecycle.
  source: src-github-stockbench-inspect-readme
  quote: The buy-and-hold baseline comes out at 0.4% return, -15.2% max drawdown and Sortino 0.0155.
    That matches Table 2 of the paper.
activity: no-submission-channel
activity_note: The leaderboard on the project page reproduces the paper's Table 2 and has not
  changed since; no source read names a way for others to submit a result, and others publish their
  own numbers (as_used).
activity_basis:
  reason: The project page's table is the authors' own runs, averaged over three runs in their
    window, with no submission route.
  source: src-stockbench-github-io
  quote: Models are ranked based on the mean of all three metrics. Results averaged over 3 runs
    during March 1-June 30 2025 evaluation period.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Kimi-K2
    source: src-stockbench-github-io
    observed_on: 2026-11-08
    quote: 1 Kimi-K2 +1.9 -11.8 0.0420
    note: Ranked first (final return +1.9%, maximum drawdown -11.8%, Sortino 0.0420);
      Qwen3-235B-Think had the highest return (+2.5%).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: There is no reference answer. The environment replays recorded opening
  prices, fundamentals and news, fills the agent's orders at the open and computes the portfolio's
  value path, from which the three metrics follow; the agent's orders do not move prices.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The code and the cached market data are public, the backbones are API or open-weight
    models, and an independent port reproduces the paper's baseline row exactly from them.
  source: src-github-stockbench-inspect-readme
  quote: The buy-and-hold baseline comes out at 0.4% return, -15.2% max drawdown and Sortino 0.0155.
    That matches Table 2 of the paper.

task:
  exists: true
  input:
    - each trading day at market open, for each of the 20 stocks, the opening price, the agent's
      current holdings, its actions on held stocks over the previous seven days, and up to five news
      articles from the previous 48 hours
    - for the stocks the agent selects, fundamentals (market capitalisation, P/E ratio, dividend
      yield, 52-week high and low, recent quarterly dividends)
  output: A decision for every stock -- increase, decrease or hold -- with a dollar target, revised
    when it exceeds the cash available, which the environment converts into shares at the opening
    price; then the simulation advances one day.
  scoring: Over the 82-day window, final return, maximum drawdown and Sortino ratio of the
    portfolio, each averaged over three runs with different seeds; models are ranked by the mean of
    the three z-scores across the table.
  source: src-arxiv-2510-02209-v2
  quote: If the decisions of the agents exceed available liquidity, the system flags the issue and
    requires the agent to revise its decisions until they can be executed within available
    resources.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The repository ships the cached prices, fundamentals, corporate actions and news for
    the window (storage/cache and storage/parquet, GitHub tree API, not a quoted Source); API keys
    for Polygon and Finnhub are needed only to build other windows or stock sets. There are no
    labels.
  access_basis:
    reason: The data behind the headline run is downloadable from the public repository without an
      account; the Inspect port fetches it from there at a pinned commit.
    source: src-github-stockbench-inspect-readme
    quote: The eval downloads its market data from the StockBench repository at a pinned commit
  refresh: static
  refresh_note: The paper (v1 and v2) promises a continuously updated window, but the v2 text of
    March 2026, the project page and the repository's last push (2025-10-28) all still use
    March-June 2025, and no later window was found. The paper also calls the data "March 2025 to
    July 2025" in one place (review_checks).
  refresh_basis:
    reason: The only evaluation window published is 3 March to 30 June 2025, unchanged in the v2
      text of March 2026; the promised updates have not appeared in any source read.
    source: src-arxiv-2510-02209-v2
    quote: It is worth noting that we will continuously update the back-trading environment to avoid
      overlap with the training corpora of contemporary LLMs.
  data_provenance:
    - curated-public-database
    - web-scraped
  data_provenance_note: Opening prices and fundamentals are records from market-data vendors (the
    README names Polygon and Finnhub), and the news articles are retrieved through a news-search API
    (Finnhub) with time restrictions, five per stock per day. Neither term was written for market
    data feeds (review_checks).
  data_provenance_source: src-arxiv-2510-02209-v2
  data_provenance_quote: For each stock, we collect news articles released within the previous 48
    hours on a daily basis.
  contamination_risk: medium
  contamination_risk_note: >
    The window (March-June 2025) was chosen to fall after the knowledge cutoff of the models the paper
    tested, but it is fixed, so any model trained after mid-2025 may have seen those prices and news,
    and the promised rolling window has not appeared. Separately, the Inspect port reports look-ahead
    inside the released environment: for 15 of the 20 stocks the fundamentals snapshot shown on 3 March
    carries a 52-week high or low from a later date, inside the window for 14, and the original code can
    show news from the decision day. That is leakage of future information to every entrant rather than
    training contamination; recorded, not escalated (review_checks).
  contamination_risk_source: src-github-stockbench-inspect-readme
  contamination_risk_quote: For 15 of the 20 stocks, the 52-week high or low shown on March 3 is a
    price from a later date, inside the test window for 14 of them.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: Return and Sortino ratio have no upper bound, and the rank is relative
    to the pool. The equal-weight buy-and-hold portfolio is a designated control strategy read as a
    lower reference ("a robust lower bound"), not an anchor for the best end.
  ceiling_anchor_type_source: src-arxiv-2510-02209-v2
  ceiling_anchor_type_quote: Most tested models outperform the passive buy-and-hold baseline, which
    achieves a modest 0.4% return
  dataset_licence: null
  dataset_licence_note: No licence is stated for the cached market data. The repository is
    Apache-2.0, but the data comes from commercial vendors, and the paper restricts the benchmark to
    academic, non-commercial research; the Inspect port declines to license the data and refers
    users to StockBench's and the vendors' terms.
  dataset_licence_source: src-arxiv-2510-02209-v2
  dataset_licence_quote: The benchmark is provided for academic and noncommercial research purposes
    only.
  size:
    - count: 20
      unit: stocks (the highest-weighted DJIA constituents)
      source: src-arxiv-2510-02209-v2
      quote: we select 20 stocks from the Dow Jones Industrial Average (DJIA) with the highest
        weights as our investment targets
    - count: 82
      unit: trading days (3 March to 30 June 2025)
      note: The Inspect port counts 83 days with price data, and the original code simulates 86.
      source: src-arxiv-2510-02209-v2
      quote: The evaluation period spans four months, from March 3 to June 30, 2025, covering 82
        trading days and capturing a range of market conditions.
    - count: 3
      unit: runs per model with different seeds, averaged
      source: src-arxiv-2510-02209-v2
      quote: each LLM agents would be run three times with different random seeds, and the average
        performance is reported
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The StockBench authors (Tsinghua University, with Beijing University of Posts and
    Telecommunications)
  maintainer_basis:
    reason: The paper's authors are at the two universities, and the work was done at Tsinghua; the
      code sits in the first author's GitHub account and the project page in a StockBench account.
    source: src-arxiv-2510-02209-v2
    quote: Work was completed during an internship at Tsinghua University.
  maintainer_type: academic-lab
  maintainer_type_note: The repository sits in a personal GitHub account and its README signs off as
    the "StockBench Team"; glee's entry read a personal repository as individual. academic-lab was
    chosen because the paper places the work in a university group (review_checks).
  submission_process:
    - maintainer-run
    - literature-only
  submission_process_note: maintainer-run for the project page's table, the authors' own runs of the
    models they chose; literature-only for everything since, which others publish themselves (the
    Inspect port, as_used).
  submission_process_source: src-stockbench-github-io
  submission_process_quote: Models are ranked based on the mean of all three metrics. Results
    averaged over 3 runs during March 1-June 30 2025 evaluation period.
  independence_flags: []
  independence_flags_note: Not assessed. No source read states funding or ties between the
    maintainers and the providers of the models ranked, and the authors rank no system of their own;
    whether any ranked model's developer is connected to the maintainers' university was not checked
    against a source (review_checks).
  independence_assessed: false
  known_limitation:
    source: src-arxiv-2510-02209-v2
    quote: do not model trading costs, slippage, or liquidity limits, which makes trading easier
      than in real markets

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: A run is 82 days of model calls for each of three seeds, through a provider's
    API or an open-weight model served locally; the environment itself runs on a CPU from the cached
    data.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The code, the prompts and the cached data are public, and the backbones are API or
      open-weight models; an independent rerun reproduces the baseline row exactly.
    source: src-github-stockbench-inspect-readme
    quote: The buy-and-hold baseline comes out at 0.4% return, -15.2% max drawdown and Sortino
      0.0155. That matches Table 2 of the paper.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: StockBench (github.com/ChenYXxxx/stockbench) -- scripts/run_benchmark.sh over the
    back-trading engine and agent workflow, with the window and LLM profile as arguments
  harness_source: src-github-stockbench-readme
  harness_quote: bash scripts/run_benchmark.sh
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for ChenYXxxx/stockbench agrees (API, read
    2026-11-08).
  code_licence_source: src-github-stockbench-readme
  code_licence_quote: This project is licensed under the Apache 2.0 License
  runnable_via:
    - custom
  runnable_via_note: An independent Inspect port exists (as_used); UK AISI's inspect_evals was not
    checked for StockBench.
  maintainer_rerun_policy: unstated

comparability:
  # (domain-metric, classical-algorithm) resolves the eligibility-gated profile, whose eligibility_track,
  # training_data_eligibility, training_data_policy and decontamination_applied have no counterpart here (the
  # same issue glee's entry records); left material per ADR-0024 D3 (review_checks). Beyond it: the workflow
  # and its version (harness), the evaluation window and stock set (subset_used, which the paper shows move
  # rankings), the context window (32,768 in the paper, 40,960 in the port), the number of seeded runs averaged
  # (n_samples), the decoding temperature (the paper's "official recommended settings", the port's 0.7; sampling) and the
  # thinking or instruct setting of the backbone (reasoning_effort).
  material_extra:
    - harness
    - context_window_used
    - n_samples
    - sampling
    - reasoning_effort
    - provider_snapshot
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper and the project page publish one rank per model, from the mean of the three
    metrics' z-scores, beside the three metrics themselves.
  source: src-arxiv-2510-02209-v2
  quote: Models are ranked based on the z-score aggregation of all three metrics.

homepage: https://stockbench.github.io/
repository: https://github.com/ChenYXxxx/stockbench
leaderboard_url: https://stockbench.github.io/

lineage:
  role: root
lineage_note: >
  One release: the March-June 2025 window on 20 DJIA stocks, unchanged between the paper's v1 (2025-10-02)
  and v2 (2026-03-02) by the v2 text, the project page and the repository. The paper's other windows (January-April
  and May-August 2025) and stock-set sizes (5, 10, 20, 30) are analyses, not separately scored tracks,
  so no versions or subsets are recorded. The independent Inspect port changes the calendar and the news
  window, so its numbers are not the original protocol's; it is recorded in as_used rather than as a fork
  (review_checks).

tags:
  - stock-trading
  - backtesting
  - financial-agents
  - risk-adjusted-return
  - djia
  - contamination-aware

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T06)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2510-02209-v2
    - src-arxiv-2510-02209
    - src-github-stockbench-readme
    - src-stockbench-github-io
    - src-github-stockbench-inspect-readme
    - src-arxiv-2608-18423-v2
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text, and its abstract page for the dates; the README
    pinned at the head of main; the project page with scripts and styles stripped (its leaderboard is
    static HTML); the README of an independent Inspect port pinned at a commit, as evidence of current
    use and for its parity findings; and FM-Bench's v2 PDF (a DOI) for its description of the environment.
    GitHub's API (licence, push dates, repository tree) was read but is not a quoted Source. The paper's
    v1 was not read. Semantic Scholar lists 49 citing papers (read 2026-11-08, not a quoted Source); those
    opened (Quant-Arena, FM-Bench, an injection-attack study, a test-time-reasoning study, KTD-Fin) cite
    StockBench in related work and do not report results on it.
  confidence: medium
  review_checks:
    - check: Placement. trading-market-interaction is primary because the scored quantities are
        market outcomes; agents-tooluse was rejected because the agent runs inside the benchmark's
        fixed workflow with no tools of its own, and games-planning because the replayed market does
        not respond. Confirm, and confirm that no secondary leaf is needed.
      field: domain
      source: src-arxiv-2608-18423-v2
      quote: Even there, the environment does not push back, as StockBench replays real markets the
        agent
    - check: The window is stated three ways. The paper's method gives 3 March to 30 June 2025 (82
        trading days), its introduction "March 2025 to July 2025", the project page "March 1-June

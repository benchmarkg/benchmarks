# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2502-18940-v2
    - src-arxiv-2502-18940
    - src-acl-2025-emnlp-main-11
    - src-github-mathtutorbench-readme
    - src-github-mathtutorbench-scaffolding-score
    - src-mathtutorbench-site
    - src-hf-api-pedagogical-rewardmodel
    - src-hf-api-stepverify
    - src-hf-api-pedagogical-rewardmodel-data
    - src-arxiv-2609-23088-v1
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the date; the ACL
    Anthology page (a DOI) for the venue; the README and the scaffolding-score script at main; the project
    site with scripts and styles stripped (its leaderboard rows are drawn by a script, so the README's
    table is the one quoted); Hugging Face's API records of the reward model, StepVerify and the
    preference data; and OmniEdu's v1 PDF (a DOI) as evidence of current use.
  confidence: medium
  review_checks:
    - check: The primary family rests on the education-tutoring leaf's definition. The
        society-econ-law family's inclusion test names work, markets, legal reasoning, policy and
        social behaviour, not education, and five of the nine columns check mathematics (answers, or
        judgements of a student's maths). Confirm the family, and whether mathematics belongs as a
        secondary at all.
      field: domain

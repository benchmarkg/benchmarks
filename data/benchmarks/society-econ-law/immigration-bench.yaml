subsets_note: >
  Results are broken down by persona (seven, with 30 to 64 test questions each) and by rubric item type
  (confirm, explain or recommend, avoid, and items citing 2025 or 2026 rules), which are labels on the
  same test set rather than separately released tracks, so they are not modelled as subsets. The web-search
  run is a condition on the same questions (tools_allowed), not a subset.

lineage:
  role: root
lineage_note: No lineage edge. Legal Research Bench (legal-research-bench), also by Vals, has an
  Immigration practice area, but it is an agentic research benchmark with its own attorney-written

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-28
  last_verified: 2026-11-28
  verification_status: ai-drafted-unverified
  sources:
    - src-vals-ai-immigration
    - src-vals-ai-blog-can-ai-get-immigration-right
    - src-vals-ai-benchmarks-index
    - src-vals-ai-methodology
    - src-vals-ai-about
  sources_note: >
    Vals AI's board page and the full report it links, server-rendered and read with scripts and styles
    stripped (neither names a person; both are pending archive); Vals' benchmarks index; and Vals' methodology
    and about pages (already archived for finance-agent-benchmark). vals.ai's robots.txt allows these
    paths for all agents, Claude-User included. There is no paper, repository or dataset to read. Vals'
    home page, which announces the release with the Talent Mobility Fund, was read and not cited because
    it names individuals.
  confidence: medium
  review_checks:
    - check: Family and leaf. The taxonomy has no leaf for legal guidance to lay people, so the
        entry uses legal-reasoning (applying the law to the persona's facts) with language/dialogue
        secondary. A reviewer may prefer dialogue as primary, or a new leaf shared with
        access-to-justice-benchmark (logged there with bench tag-gap).
      field: domain.primary
      source: src-vals-ai-immigration
      quote: Models explain the law better than they apply it.
    - check: data.access is private-test-server because Vals runs every published score on a set it
        holds. Unlike Vals' other boards, nothing at all is public (no sample, harness or paper),
        which is close to proprietary-closed; the vocabulary's private-test-server inclusion test
        decides it here.
      field: data.access
      source: src-vals-ai-immigration
      quote: The other 257 questions are not part of these results and are reserved for the labs to
        license for their own benchmarking and evaluation work.
    - check: grader-from-evaluated-party rests on the report's own statement about the grader's
        developer. The simulated person, GPT-6 Luna, is also a tested model, a conflict no flag
        records; the report says swapping the simulated person moves scores.
      field: governance.independence_flags
      source: src-vals-ai-blog-can-ai-get-immigration-right
      quote: GPT-6 Luna plays the simulated person in every conversation and is also one of the 25
        tested models
    - check: funded-by-evaluated-party is not set. The Talent Mobility Fund is a philanthropic
        programme whose funders no source read names; if an evaluated developer funds it, the flag
        would apply.
      field: governance.independence_flags
      source: src-vals-ai-immigration
      quote: Immigration Bench is a joint effort by the Talent Mobility Fund
    - check: evaluator-sells-evaluations is not set. The 257 reserved questions are offered to labs
        to license for their own evaluation work, which is licensing data; no page read says Vals
        sells evaluations of the systems it ranks.
      field: governance.independence_flags
      source: src-vals-ai-methodology
      quote: 'Private Validation Set: A larger, privately held dataset, which we license to companies
        for their own internal validation.'
    - check: capability knowledge-recall rests on the board being the run without web search. The
        report's web-search run is on the same questions but unranked; a claim from it is a
        different condition (tools_allowed) and would bring tool-use.
      field: capability
      source: src-vals-ai-immigration
      quote: Search scores are not on the leaderboard.
    - check: contamination_risk low. The report publishes nine test questions with rubric excerpts,
        and the questions go to every provider's API on each run; medium is arguable.
      field: data.contamination_risk
      source: src-vals-ai-blog-can-ai-get-immigration-right
      quote: The following nine questions from the test set illustrate how models performed across
        different scenarios
    - check: lifecycle active rests on the maintainer's own board alone (a model added after the
        report). No third-party use was looked for beyond Vals' pages.
      field: lifecycle
      source: src-vals-ai-benchmarks-index
      quote: 'Legal Proprietary Immigration Bench Updated: 11/9/2026 Models Tested: 26'
    - check: model-graded-judge needs reference_conditions naming the grader (Claude Sonnet 5) and
        the simulated person (GPT-6 Luna); no conditions record exists, and writing one was outside
        this task's write scope.
      field: reference_conditions
      source: src-vals-ai-immigration
      quote: Claude Sonnet 5 evaluates every rubric item as met or not met against the full
        transcript, with a reason.

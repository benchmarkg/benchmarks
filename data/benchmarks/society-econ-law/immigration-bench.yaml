# data/benchmarks/society-econ-law/immigration-bench.yaml
#
# P1-S12 sweep follow-up: a new society-econ-law entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from Vals AI's Immigration Bench page (board and methodology, updated 2026-11-09) and the full report it
# links, "Can AI Get Immigration Right?" (2026-10-28), both with scripts and styles stripped; Vals' benchmarks index;
# and Vals' methodology and about pages. There is no paper, repository, dataset card or public sample to read: the
# page and the report link none, and no GitHub repository of the vals-ai organisation is named for it. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The id is a proposal from the benchmark's name; allocation is a human act (04 S3), and no catalogued id, stub,
# retired id or open branch is near it. One release is known, so one version. Legal Research Bench
# (legal-research-bench), another Vals benchmark, has an Immigration practice area of its own, but no source says
# the two share questions, so no lineage is recorded.

id: immigration-bench
name: Immigration Bench
tagline: Expert-written US immigration questions from simulated personas over up to five exchanges,
  graded on expert rubrics.
description: >
  A benchmark from Vals AI and the Talent Mobility Fund of the immigration guidance people seek from AI
  chatbots. Immigration experts wrote 519 questions, each from the point of view of one of seven personas
  (an F-1 student, an international scholar or faculty member, a university advisor, an employer, an entrepreneur,
  a self-petitioner, and a person on DACA, TPS or another fragile status), around ambiguous facts and
  multi-step analysis of the student, work and talent pathways that scientists, engineers and other professionals
  use; asylum and the immigration courts are out of scope. Each question has an expert rubric of what
  a complete answer must confirm about the person, explain or recommend, and avoid saying, cross-reviewed
  by a second expert. The tested model holds a conversation of up to five exchanges with a simulated person
  (GPT-6 Luna, answering follow-up questions from the persona's facts only), and an AI grader (Claude
  Sonnet 5) marks each rubric item met if the model covers it anywhere in the conversation. The headline,
  average answer accuracy, is the share of a question's items met, averaged over questions; the share
  of questions with every item met is reported beside it. Results are on a 262-question test set that
  stays private, and the other 257 questions are reserved for labs to license. The board, run without
  web search, ranked 26 models on 2026-11-09, led by Claude Fable 5.1 at 75.44%; a second run of every
  model with web search is reported but not ranked. Apart from nine example questions in the report, no
  questions, code or paper are public.
self_description:
  source: src-vals-ai-immigration
  quote: Evaluating AI models on expert-written U.S. immigration law questions
released: 2026-10-28
released_note: The full report's date; it reports 25 models, and the board was updated on 2026-11-09
  with 26. The question set was finalized on 2026-09-21.
released_source: src-vals-ai-blog-can-ai-get-immigration-right
released_quote: Research 10/28/2026 Can AI Get Immigration Right?

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/legal-reasoning
  secondary:
    - language/dialogue
domain_basis:
  reason: The scored quantity is how completely a model's guidance covers what an immigration expert
    says a correct answer to one person's situation must contain, the legal thresholds that apply to
    the persona's facts, what follows for them and what to do next, which is applying legal rules to
    a set of facts (the legal-reasoning leaf); the page's lead finding is that models explain the
    law better than they apply it to the person. The answer is given over a conversation of up to
    five exchanges, and an item counts wherever in the conversation it is met, so the conversation
    as a whole is scored, which is language/dialogue, carried as secondary.
  source: src-vals-ai-immigration
  quote: Models explain the law better than they apply it.
domain_considered_and_rejected:
  - term: society-econ-law/policy-analysis
    reason: Recent DHS and agency rules weigh heavily (items citing 2025 and 2026 rules are the
      hardest), but the questions ask what the law means for one person, not an analysis of policy
      options or of what a regulated party must do.
    source: src-vals-ai-immigration
    quote: Models met only 7.3% of rubric items involving policy rules from 2025 and 2026, compared
      to 64.0% for established law.
  - term: society-econ-law/legal-document
    reason: No document is supplied, extracted from or drafted.
  - term: language/retrieval-qa
    reason: The board's run has no retrieval; web search is a second condition reported off the
      board.
  - term: agents-tooluse/tool-api-calling
    reason: Only the off-board web-search run has a tool, and its use is not scored.

capability:
  - knowledge-recall
  - factual-precision
  - context-integration
capability_basis:
  knowledge-recall:
    reason: The board ranks the run without web search, so the law the answer needs, including rules
      from 2025 and 2026, comes from what the model holds; the persona supplies only facts about
      itself. The report's recent-policy finding is a finding about recall.
    source: src-vals-ai-immigration
    quote: Search scores are not on the leaderboard.
  factual-precision:
    reason: Each rubric item (a legal threshold, a factual element, a next step, a statement to
      avoid) is marked met or not on its own against the transcript, inside a free-form
      conversation.
    source: src-vals-ai-immigration
    quote: Claude Sonnet 5 evaluates every rubric item as met or not met against the full
      transcript, with a reason.
  context-integration:
    reason: The persona's facts and background are held by the simulated person and shared only when
      the model asks, and a class of rubric items scores whether the model confirmed the person's
      circumstances (visa stage, eligibility, filing history) before advising; those items are the
      worst met.
    source: src-vals-ai-immigration
    quote: were met only 43% of the time, compared to 63% for items asking AI to explain the law or
      recommend a next step
capability_considered_and_rejected:
  - term: tool-use
    reason: Web search is offered only in the second run, which is not ranked.
    source: src-vals-ai-immigration
    quote: 'Every model was run twice: once on its own, and once with web search'
  - term: communication
    reason: Nothing the simulated person understood or did is scored, only the items the tested
      model's replies cover.
  - term: harm-avoidance
    reason: Some items are statements to avoid, such as guaranteeing an outcome, but the report says
      the rubric measures completeness and does not penalise other incorrect statements.
    source: src-vals-ai-blog-can-ai-get-immigration-right
    quote: It is not penalized for additional incorrect statements unless the rubric includes an
      explicit
  - term: collaboration
    reason: The simulated person answers from fixed facts and has no objective of its own; the
      term's exclusion treats such a party as environment.

evaluation_method:
  - rubric-graded
  - model-graded-judge
evaluation_method_note: Claude Sonnet 5 grades every item against the whole transcript, with a
  reason; it was chosen by alignment with two immigration experts who graded the same conversations,
  matching them on 88.6% of the items where they agreed, the highest of the graders tested. Items
  that only list legal authorities are recorded but not scored. Item types (confirm, explain or
  recommend, avoid) were assigned automatically from each item's leading verb.
evaluation_method_basis:
  reason: Expert checklists are applied item by item and combined into a share per question, and an
    AI grader applies them, so both terms apply.
  source: src-vals-ai-immigration
  quote: For each question, experts wrote a rubric, which consisted of a checklist of everything a
    complete and accurate answer must cover
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: Two immigration experts graded conversations only to choose the grader; no published
      score comes from them.
    source: src-vals-ai-immigration
    quote: Claude Sonnet 5 matched their verdict 88.6% of the time, the highest of the graders
      tested.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Vals drives every tested model through the same simulated conversation, with the same
    simulated person, grader and time limit, and each row names a model; as AgentClinic's doctor
    models do, the model answers inside the benchmark's own multi-turn loop.
  source: src-vals-ai-immigration
  quote: Rather than asking each model a single question, we simulated a realistic conversation of
    up to five exchanges.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: The protocol expects a compliant assistant, but the benchmark drives the model across up
      to five turns, which the term's exclusion sends to model-in-benchmark-harness.
  - term: full-product-pipeline
    reason: The report says consumer-facing chatbots were not tested; models were called through
      their APIs at default settings.
    source: src-vals-ai-blog-can-ai-get-immigration-right
    quote: Each model was run once per condition through its API; consumer-facing products were not
      tested
  - term: tool-augmented-model
    reason: Tools exist only in the off-board web-search run.

lifecycle: active
lifecycle_basis:
  reason: Vals added a model to the board after the report (26 against 25) and dates it 2026-11-09;
    no third-party use was found (review_checks).
  source: src-vals-ai-benchmarks-index
  quote: 'Legal Proprietary Immigration Bench Updated: 11/9/2026 Models Tested: 26'
activity: no-submission-channel
activity_note: Vals chooses the models and runs them; no page read offers a submission route, and
  the test set is private.
activity_basis:
  reason: Every published score is Vals' own run on its private test set.
  source: src-vals-ai-methodology
  quote: 'Test Set: This dataset remains private at all times, and is the only dataset used for the proprietary
    benchmark results we publish.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude Fable 5.1
    source: src-vals-ai-immigration
    observed_on: 2026-11-28
    quote: As of November 9, 2026, Claude Fable 5.1 ranks first on Immigration Bench with 75.44%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: The rubrics are immigration experts' own, each cross-reviewed by a second expert; the AI
    grader applies them.
  source: src-vals-ai-immigration
  quote: All rubrics were cross-reviewed by a second expert before being used.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The questions, rubrics, persona facts, prompts and code are all unreleased, and every
    score is Vals' run on its private test set.
  source: src-vals-ai-immigration
  quote: This page reports results on the 262-question test set, which is kept private to allow
    ongoing, tamper-resistant evaluation.

task:
  exists: true
  input:
    - a persona's opening question, such as an F-1 student asking how the end of duration of status
      affects them
    - the simulated person's replies to the model's follow-up questions, drawn only from the
      persona's facts and background
  output: Replies over a conversation of up to five exchanges, within 30 minutes (three hours in the
    web-search run).
  scoring: The grader marks each rubric item met if the model covered it anywhere in the
    conversation; a question scores the share of its items met, and the board reports the average
    over questions (average answer accuracy) with all-pass beside it. A conversation that runs past
    its time limit scores zero.
  source: src-vals-ai-immigration
  quote: Each conversation had a 30-minute time limit, or three hours with web search; a
    conversation that exceeded its limit scored zero

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: "Public: the board and the full report, with per-persona, recent-policy, web-search, cost
    and sources-read analyses, and nine example test questions with excerpts of their rubrics. Licensed:
    257 questions reserved for labs. Never released: the 262-question test set, its rubrics, the persona
    facts, the grader's and simulated person's prompts and the code. There is no public sample."
  access_basis:
    reason: Every published score is Vals' run on a test set it keeps, which the term's inclusion
      test covers; nothing is released at any tier, which is closer to proprietary-closed
      (review_checks).
    source: src-vals-ai-immigration
    quote: This page reports results on the 262-question test set, which is kept private to allow
      ongoing, tamper-resistant evaluation.
  refresh: null
  refresh_note: Left null. One release is known (question set finalized 2026-09-21), and no page
    read gives a version label or a plan for new questions, although immigration law changes and the
    report calls the results a snapshot.
  data_provenance:
    - expert-authored
  data_provenance_note: Immigration experts wrote the questions and rubrics, each from a persona's
    point of view, and a second expert cross-reviewed every rubric; the sources do not say how many
    experts took part or their credentials.
  data_provenance_source: src-vals-ai-immigration
  data_provenance_quote: Immigration experts drafted a benchmark of 519 questions designed to
    reflect the complexity and stakes of real immigration questions
  contamination_risk: low
  contamination_risk_note: The test set has not been released, but the report publishes nine test
    questions with rubric excerpts (about 3% of the test set), and Vals sends the questions to each
    provider's API on every run; no source weighs either route.
  contamination_risk_source: src-vals-ai-blog-can-ai-get-immigration-right
  contamination_risk_quote: The following nine questions from the test set illustrate how models
    performed across different scenarios
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No expert answered the questions under the benchmark's conditions. The
    report's best-of-field figure (about 92% of items met by at least one of 25 models) is a union
    of models, not an anchor.
  dataset_licence: null
  dataset_licence_note: No data is released and no licence is stated; the page's schema.org record
    (a script block, outside the extract) gives CC BY 4.0 for the leaderboard data. The 257 reserved
    questions are licensed commercially.
  size:
    - count: 262
      unit: questions
      subset: test set (private), on which the board is computed
      source: src-vals-ai-immigration
      quote: This page reports results on the 262-question test set, which is kept private to allow
        ongoing, tamper-resistant evaluation.
    - count: 519
      unit: expert-written questions
      subset: all questions
      source: src-vals-ai-immigration
      quote: Immigration experts drafted a benchmark of 519 questions designed to reflect the
        complexity and stakes of real immigration questions
    - count: 257
      unit: questions
      subset: reserved for labs to license, not scored
      source: src-vals-ai-immigration
      quote: The other 257 questions are not part of these results and are reserved for the labs to
        license for their own benchmarking and evaluation work.
  size_note: The test questions split by persona as 64 international student, 33 international
    scholar or faculty, 33 university advisor, 34 employer, 34 entrepreneur, 34 self-petitioner and
    30 fragile or temporary status, with 2,474 scored criteria in all (4.4 to 19.5 per question by
    persona).
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Vals AI, Inc.
  maintainer_basis:
    reason: Vals runs the board on its index, holds the test set and ran the evaluation; the Talent
      Mobility Fund is its partner, named with it on the report's byline and in the citation.
    source: src-vals-ai-immigration
    quote: Vals AI and the Talent Mobility Fund partnered to build an expert-validated benchmark for
      AI performance on U.S. immigration law.
  maintainer_type: industry-lab
  maintainer_type_note: Vals AI, Inc. is a company that builds and runs evaluations; its partner,
    the Talent Mobility Fund, is a philanthropic programme. Who wrote the questions (the Fund's
    experts or Vals') is not stated.
  submission_process:
    - maintainer-run
  submission_process_note: Vals selects the models, runs each once per condition (without and with
    web search) through its API at default settings, re-runs conversations that failed for
    infrastructure reasons, and publishes the no-search run as the board.
  submission_process_source: src-vals-ai-blog-can-ai-get-immigration-right
  submission_process_quote: Conversations that failed for infrastructure reasons, including grading
    failures, were re-run.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-vals-ai-immigration
      quote: This page reports results on the 262-question test set, which is kept private to allow
        ongoing, tamper-resistant evaluation.
    - flag: grader-from-evaluated-party
      source: src-vals-ai-blog-can-ai-get-immigration-right
      quote: it is from the same developer as four tested models
  independence_flags_note: The grader, Claude Sonnet 5, is from the same developer as four tested
    models, which the report itself lists as a limitation. The simulated person, GPT-6 Luna, is one
    of the tested models and so talks to itself in its own conversations, which the report also
    notes; it is not a grader, so no flag records it. Vals builds no evaluated model, so
    maintainer-competes is not set. No source read names the Talent Mobility Fund's funders, so
    funded-by-evaluated-party is not set, and licensing the reserved questions to labs is not
    selling evaluations (review_checks).
  independence_assessed: true
  known_limitation:
    source: src-vals-ai-blog-can-ai-get-immigration-right
    quote: In testing, swapping the simulated person shifted scores by a few points and reordered
      some closely ranked models.
  known_limitation_note: The simulated person and the grader are both models, and the person is also
    a tested model; the rubric credits completeness and does not penalise incorrect statements
    beyond the avoid items, so longer answers have more chances to score. The scope is pathways used
    by scientists, engineers and other professionals, without asylum or the immigration courts, and
    the results are a snapshot of models, settings and law. Average answer accuracy carries a
    standard error of 1.4 to 1.7 points.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is calls to the tested model's API, the simulated person and the grader.
    source: src-vals-ai-immigration
    quote: APIs at default settings
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The scores are on a test set only Vals holds, which the tier's inclusion test covers.
    source: src-vals-ai-about
    quote: Scores are based on our privately held test sets to preserve the integrity and signal of
      our results.
  reproducibility_blockers:
    - private-test-set
    - no-reference-implementation
  reproducibility_blockers_note: Nothing that would let an outsider run it is released, neither the
    questions, rubrics and persona facts nor the conversation harness and prompts.
  reproducibility_blockers_source: src-vals-ai-immigration
  reproducibility_blockers_quote: The other 257 questions are not part of these results and are
    reserved for the labs to license for their own benchmarking and evaluation work.
  harness_availability: none
  harness_availability_note: No code, prompt or configuration is published; the page and the report
    link no repository.
  harness: Vals' unreleased conversation harness, with GPT-6 Luna as the simulated person and Claude
    Sonnet 5 as the grader
  harness_source: src-vals-ai-immigration
  harness_quote: GPT-6 Luna plays the person asking
  code_licence: null
  code_licence_note: No code is released.
  runnable_via:
    - none
  inspect_evals_id: null
  inspect_evals_id_note: Reconciled against UK AISI's inspect_evals on 2026-11-28 through the GitHub
    API's listing of src/inspect_evals at main (137 entries); none is Immigration Bench. Not a
    quoted Source.
  maintainer_rerun_policy: unstated

comparability:
  # Resolved profile: model-graded, for (rubric-graded, model-in-benchmark-harness) and (model-graded-judge,
  # model-in-benchmark-harness). Beyond it: the simulated person and its version (the report says swapping it moves
  # scores by a few points and reorders close models), whether web search was allowed (the board's run has none;
  # the off-board run does, with pages up to 2026-09-21), and the harness, whose turn and time limits (five
  # exchanges, 30 minutes) decide what a model can draw out. The grader, its prompt and the rubric version are
  # already members.
  material_extra:
    - user_simulator
    - user_simulator_version
    - tools_allowed
    - harness

aggregation_policy: official-aggregate
aggregation_policy_note: Average answer accuracy over the test set is the board's headline, with
  all-pass, cost and duration beside it; the report breaks it down by persona and item type, and
  reports the web-search run separately.
aggregation_policy_basis:
  reason: One headline over the test set, the per-question share of items met, averaged.
  source: src-vals-ai-immigration
  quote: Metric Definition Average Answer Accuracy Share of each question

liveness:
  leaderboard_last_updated: 2026-11-09
  reproduction_script_present: false
  last_checked: 2026-11-28

homepage: https://www.vals.ai/benchmarks/immigration
leaderboard_url: https://www.vals.ai/benchmarks/immigration
maintainer_url: https://www.vals.ai/

versions:
  - version: 2026-10
    label: The report's release, 519 questions with a 262-question test set
    version_kind: revision
    released: 2026-10-28
    items: 519
    changes: The release with the full report, 519 expert-written questions from seven personas (262
      test, 257 reserved for licensing), finalized on 2026-09-21, run on 25 models without and with
      web search; the board has since added a model.
    frozen: false
    sources:
      - src-vals-ai-blog-can-ai-get-immigration-right
      - src-vals-ai-immigration
versions_note: No source gives the release a version label, so it is named by the report's month.

# data/benchmarks/society-econ-law/stocknet.yaml
#
# P1-S9-T06, society-econ-law entry 13. Filled from the StockNet paper, "Stock Movement Prediction from Tweets and
# Historical Prices" (ACL 2018, DOI 10.18653/v1/P18-1183), read as the text of its Anthology PDF, and its Anthology
# landing page; the dataset repository's README and LICENSE at master (newest commit 330708b5ddc3, 2018-11-02) and
# the code repository's README and LICENSE at master; Hugging Face's API record of FinBen's copy of the data,
# TheFinAI/en-sm-acl (gated, terms not accepted); and the arXiv abstract page of a March 2025 paper that sets a new
# MCC baseline on the dataset (2503.10957). GitHub's API was read for licences, creation and push dates and the
# commit history, and is not a quoted Source. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# The id `stocknet` is proposed from the paper's and the repository's name (stocknet-dataset); id allocation is a
# human act (04 S3). The dataset is widely called ACL18 after its venue, which is carried as an alias.

id: stocknet
name: StockNet
aliases:
  - ACL18
  - stocknet-dataset
aliases_note: ACL18 is the name FinBen and later stock-prediction papers give the dataset, after its
  venue. StockNet is also the name of the paper's own model, whose variants are entrants here.
tagline: Binary next-day movement of 88 US stocks from tweets and five days of prices, 2014-2015,
  scored by accuracy and MCC.
description: >
  A dataset for predicting whether a stock's adjusted closing price rises or falls on a target trading
  day, from the tweets that mention its ticker and its historical prices over the preceding five-day lag.
  It covers 88 US stocks, all eight in the Conglomerates sector and the ten largest by capital in each
  of the other eight, from 2014-01-01 to 2016-01-01; tweets were retrieved by ticker regex and prices
  taken from Yahoo Finance. Movements between -0.5% and 0.55% were removed to balance the classes, leaving
  26,614 targets (49.78% fall, 50.22% rise), split by time into 20,339 for training, 2,555 for development
  and 3,720 for test (October to December 2015). Scores are accuracy and the Matthews correlation coefficient
  on the test set. The paper introduced its own generative model, StockNet, whose full variant scored
  58.23% accuracy and 0.0808 MCC against 50.89% for a random guess and 57.64% for the best baseline; the
  paper calls 56% a satisfying result for the task. The data and model code sit on the first author's
  GitHub account under MIT licences, unchanged since 2018. There is no leaderboard; others report results
  in their own papers, and FinBen carries a prompt-formatted copy for evaluating language models.
self_description:
  source: src-acl-p18-1183-pdf
  quote: We present a model to predict stock price movement from tweets and historical stock prices.
external_ids:
  huggingface: null
paper:
  title: Stock Movement Prediction from Tweets and Historical Prices
  doi: 10.18653/v1/P18-1183
  source: src-acl-p18-1183-pdf
released: 2018-07-15
released_note: The first day of ACL 2018, where the paper appeared (Long Papers, pages 1970-1979).
  The dataset repository was created on 2018-04-28 and its data committed that day (GitHub API, read
  2026-11-08, not a quoted Source).
released_source: src-acl-p18-1183-pdf
released_quote: Melbourne, Australia, July 15 - 20, 2018
release_venue: ACL 2018 (56th Annual Meeting of the Association for Computational Linguistics, Long
  Papers)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/finance-forecasting
domain_basis:
  reason: The scored quantity is the direction of a stock's adjusted closing price on a target day,
    a prediction of a financial quantity, which is the finance-forecasting leaf's definition. The
    family's inclusion test (the scored quantity concerns markets) is met.
  source: src-acl-p18-1183-pdf
  quote: We estimate the binary movement where 1 denotes rise and 0 denotes fall
domain_considered_and_rejected:
  - term: society-econ-law/forecasting-prediction-markets
    reason: Every target is a 2014-2015 price movement that had already happened when the dataset
      was published; nothing resolves after the prediction is made.
    source: src-acl-p18-1183-pdf
    quote: 3,720 movements from 01/10/2015 to 01/01/2016 are for test
  - term: society-econ-law/trading-market-interaction
    reason: Nothing acts in a market; predictions are scored as labels, with no trading simulation
      or profit.
  - term: society-econ-law/financial-analysis
    reason: No question is answered over financial documents or statements; the inputs are tweets
      and price series.
  - term: language/understanding
    reason: Tweets are one of two inputs, but the score is the price movement, not a judgement about
      the text; the paper's price-only variant is scored on the same task.
  - term: earth-climate/weather-forecasting
    reason: Searched for a time-series or forecasting family that would claim a price series. The
      only forecasting leaves outside this family are the atmosphere's (earth-climate) and energy
      systems'; taxonomy/domains.yaml has no general time-series family.

capability:
  - context-integration
capability_basis:
  context-integration:
    reason: Each sample supplies the market information for its lag, the tweets for each trading day
      and the prices before it, and the prediction is to be made from that alone; samples with a day
      lacking tweets were filtered out. The paper's ablations score the gain from each input. The
      supplied material does not determine the answer (the best accuracy is 58%), and the capability
      the task names, predicting a financial quantity from a time series, has no term
      (taxonomy/_failures, review_checks).
    source: src-acl-p18-1183-pdf
    quote: ensuring there is at least one tweet for each corpus in the lag
capability_considered_and_rejected:
  - term: scientific-prediction
    reason: Its definition is limited to physical, chemical, biological or Earth systems; a market
      is none of them. It is the nearest term, and the gap is logged.
  - term: probabilistic-forecasting
    reason: The movements already existed when the dataset was released, and a label, not a
      probability, is scored.
  - term: temporal-reasoning
    reason: The paper calls the task a time-series problem, but the score is a movement label, not
      whether order or duration was judged; cy-bench rejects the term on the same ground.
    source: src-acl-p18-1183-pdf
    quote: In essence, stock movement prediction is a time series problem.
  - term: distribution-shift-generalization
    reason: The split is temporal (test is the last quarter of 2015), but no condition is reported
      as a shift of its own beside an in-distribution score.
    source: src-acl-p18-1183-pdf
    quote: We split them temporally and
  - term: knowledge-recall
    reason: The design assumes no knowledge of the outcome; a pretrained model that recalls 2015
      closing prices is a contamination route (data.contamination_risk_note), not the capability.

evaluation_method:
  - classification-metric
  - exact-match
evaluation_method_basis:
  reason: The two reported numbers are the Matthews correlation coefficient, a statistic of the
    whole confusion matrix, and accuracy, the mean of right-or-wrong verdicts against a two-label
    key, which exact-match's inclusion test keeps for itself.
  source: src-acl-p18-1183-pdf
  quote: MCC avoids bias due to data skew.
evaluation_method_considered_and_rejected:
  - term: statistical-fit
    reason: The prediction is a class label, and its exclusion test sends a correlation between
      predicted and true classes, such as MCC, to classification-metric.
  - term: prospective-resolution
    reason: The labels exist and are published in the dataset.
  - term: domain-metric
    reason: Accuracy and MCC are general-purpose statistics, not defined only within finance.
designed_for_subjects:
  - task-specific-supervised-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The protocol trains a model on the training split and tunes it on the development split;
    every system in the paper (a random forest, a topic model, a hierarchical-attention network and
    the StockNet variants) is trained for the task. Two baselines contain no learned component, a
    random guess and ARIMA.
  source: src-acl-p18-1183-pdf
  quote: 'ARIMA: Autoregressive Integrated Moving Average, an advanced technical analysis method using
    only price signals'
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: Its discipline list is the scientific, clinical and engineering-design families; finance
      is not one, so a model trained for this task is task-specific-supervised-model.
  - term: instruction-tuned-model
    reason: The 2018 design has no prompt; language models are prompted on FinBen's reformatted copy
      (as_used, observed_subjects).
observed_subjects:
  values:
    - task-specific-supervised-model
    - instruction-tuned-model
  basis: Papers still train task models on it (a 2025 BERTweet and transformer model), and FinBen
    carries the data as a prompted task for evaluating large language models.
  source: src-hf-api-finben-en-sm-acl
as_used:
  - protocol: FinBen's copy, with each sample rendered as a prompt holding the tweets and prices and
      a choice between rise and fall, scored by accuracy and MCC. Its development and test splits
      have the paper's counts (2,555 and 3,720); its training split has 20,781 rows against the
      paper's 20,339.
    split: test (3,720)
    source: src-hf-api-finben-en-sm-acl
    quote: '"name":"test","num_bytes":13359338,"num_examples":3720'
    note: The Hugging Face record is gated (an automatically approved form), which was not filled
      in; the prompt text was not read.
  - protocol: A BERTweet encoder with a transformer over the lag, trained on the dataset and scored
      by MCC without inputs beyond its tweets and prices.
    split: the paper's test split, as far as the abstract says
    source: src-arxiv-2503-10957
    quote: setting a new baseline for Matthews Correlation Coefficient on the Stocknet dataset
      without auxiliary data sources
    note: A March 2025 paper. Only its abstract page was read; its split and numbers are not
      checked.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it. A March 2025 paper reports a new MCC baseline on the
    dataset, and FinBen's copy of it was last modified on 2026-10-07. The original repositories were
    last pushed in March 2019 (GitHub API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2503-10957
  quote: setting a new baseline for Matthews Correlation Coefficient on the Stocknet dataset without
    auxiliary data sources
activity: no-submission-channel
activity_basis:
  reason: The repository releases the data and the paper its results; neither has a leaderboard or a
    submission route, and results appear in users' papers.
  source: src-github-stocknet-dataset-readme
  quote: releases a comprehensive dataset for stock movement prediction from tweets and historical
    stock prices

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: StockNet (HedgeFundAnalyst, the full variant), the paper's own model
    source: src-acl-p18-1183-pdf
    observed_on: 2026-11-08
    quote: Our model, HEDGEFUNDANALYST achieves the best performance of 58.23 in accuracy and
      0.080796 in MCC
  - system: A BERTweet and transformer model (2025)
    source: src-arxiv-2503-10957
    observed_on: 2026-11-08
    quote: setting a new baseline for Matthews Correlation Coefficient on the Stocknet dataset
      without auxiliary data sources
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each target's label is the sign of the adjusted close's change, computed
  from Yahoo Finance prices. The test labels are public in the dataset; the split holds them out
  only from training.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The tweets, the prices and the code that trains and tests the paper's models are public
    under MIT licences, and both metrics are closed-form.
  source: src-github-stocknet-code-readme
  quote: use `sh src/run.sh` in your terminal to start model learning and test the model after the
    training is completed

task:
  exists: true
  input:
    - the tweets mentioning the target stock's ticker on each trading day of a five-day lag before
      the target day
    - the stock's prices over the lag (preprocessed as movement percent and normalised open, high,
      low and close, with volume)
  output: Rise (1) or fall (0) of the stock's adjusted closing price on the target trading day
    against the previous one.
  scoring: Accuracy and MCC over the 3,720 test targets (October to December 2015), reported side by
    side; no combined score.
  tests_hidden_from_system: false
  item_definition: One stock on one target trading day whose movement is at most -0.5% or above
    0.55%; smaller movements were removed to balance the classes.
  source: src-acl-p18-1183-pdf
  quote: we set two particular thresholds, 0.5% and 0.55% and simply remove 38.72% of the selected
    targets

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The tweets, prices and the movement labels behind the test score can be downloaded from
      GitHub without an account. FinBen's Hugging Face copy is behind an automatic form, but it is
      not the official copy.
    source: src-github-stocknet-dataset-readme
    quote: releases a comprehensive dataset for stock movement prediction from tweets and historical
      stock prices
  refresh: static
  refresh_note: Every commit after the data were added on 2018-04-28 changed only README.md or the
    stock table (StockTable), the last on 2018-11-02 (GitHub API, read 2026-11-08, not a quoted
    Source).
  data_provenance:
    - web-scraped
    - curated-public-database
  data_provenance_note: The tweets were harvested from Twitter by ticker regex (web-scraped). The
    prices, from which the labels are computed, are Yahoo Finance's daily price histories
    (curated-public-database, taken here as a compiled market-data archive; review_checks).
  data_provenance_source: src-acl-p18-1183-pdf
  data_provenance_quote: We extract historical prices for the 88 selected stocks to build the
    historical price dataset from Yahoo Finance.
  contamination_risk: medium
  contamination_risk_note: The whole dataset, test labels included, has been public on GitHub since
    2018, and the 2015 prices it labels from are public market history, so a pretrained language
    model may hold the outcome of a test target; no evidence of such a route was read. Models
    trained only on the training split, as designed, have no such route.
  contamination_risk_source: src-acl-p18-1183-pdf
  contamination_risk_quote: We extract historical prices for the 88 selected stocks to build the
    historical price dataset from Yahoo Finance.
  contamination_evidence: []
  dataset_licence: MIT
  dataset_licence_note: The dataset repository's LICENSE file, a software licence applied to tweets
    and prices; GitHub reports MIT for it (API, read 2026-11-08).
  dataset_licence_source: src-github-stocknet-dataset-licence
  dataset_licence_quote: MIT License
  upstream_licences: Tweets under Twitter's licence, as the paper says it accessed them; Yahoo
    Finance's terms for the prices are not stated. The raw tweets are full tweet JSON and the
    preprocessed ones keep the user id (review_checks).
  upstream_licences_source: src-acl-p18-1183-pdf
  upstream_licences_quote: We access Twitter data under the
  size:
    - count: 26614
      unit: prediction targets (stock-day movements)
      subset: the whole dataset
      source: src-acl-p18-1183-pdf
      quote: resulting in 26,614 prediction targets in the whole dataset with 49.78% and 50.22% of
        them in the two classes
    - count: 3720
      unit: prediction targets
      subset: test (2015-10-01 to 2016-01-01)
      source: src-acl-p18-1183-pdf
      quote: 3,720 movements from 01/10/2015 to 01/01/2016 are for test
    - count: 20339
      unit: prediction targets
      subset: train (2014-01-01 to 2015-08-01)
      source: src-acl-p18-1183-pdf
      quote: 20,339 movements between 01/01/2014 and 01/08/2015 are for training
    - count: 2555
      unit: prediction targets
      subset: development (2015-08-01 to 2015-10-01)
      source: src-acl-p18-1183-pdf
      quote: 2,555 movements from 01/08/2015 to 01/10/2015 are for development
    - count: 88
      unit: stocks
      subset: the whole dataset
      source: src-acl-p18-1183-pdf
      quote: we select the two-year price movements from 01/01/2014 to 01/01/2016 of 88 stocks to
        target

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The StockNet authors (University of Edinburgh at publication), from the first author's
    personal GitHub account
  maintainer_basis:
    reason: The dataset and the code are released from one personal account, and no institution is
      stated as holding them.
    source: src-github-stocknet-dataset-readme
    quote: releases a comprehensive dataset for stock movement prediction from tweets and historical
      stock prices
  maintainer_type: individual
  maintainer_type_note: academic-lab was considered for the authors' University of Edinburgh
    affiliation; individual's inclusion test turns on the personal account, as for gpqa-diamond.
  submission_process:
    - literature-only
  submission_process_note: No leaderboard or results page exists; beyond the paper's own table,
    results appear in others' papers, such as the 2025 one read here. FinBen's leaderboard, which
    re-runs its copy, is a third party's and does not remove the term.
  submission_process_source: src-arxiv-2503-10957
  submission_process_quote: setting a new baseline for Matthews Correlation Coefficient on the
    Stocknet dataset without auxiliary data sources
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-acl-p18-1183-pdf
      quote: Our model, HEDGEFUNDANALYST achieves the best performance of 58.23 in accuracy and
        0.080796 in MCC
  independence_flags_note: The paper that releases the dataset introduces its own model and reports
    it as the best on it. The research was supported by a grant from Bloomberg, a company that the
    paper does not evaluate; funded-by-evaluated-party is not set (review_checks).
  independence_assessed: true
  funding:
    source: src-acl-p18-1183-pdf
    quote: This research was supported by a grant from Bloomberg

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier_note: Not set. Scoring 3,720 labels is trivial; the GPU the paper names is for
    training its model, which single-gpu's exclusion does not count, and a prompted language model's
    cost is the entrant's.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data and labels are public, the metrics are closed-form, and the code trains and
      tests the paper's models end to end with no human or maintainer-only step.
    source: src-github-stocknet-code-readme
    quote: use `sh src/run.sh` in your terminal to start model learning and test the model after the
      training is completed
  reproducibility_blockers: []
  harness_availability: reference-implementation-only
  harness_availability_note: The code repository runs the paper's StockNet variants and reports
    their test scores; it is the method's code, not a harness that scores any entrant. It pins
    Python 2.7.11 and TensorFlow 1.4.0.
  harness: stocknet-code (src/run.sh trains and tests a StockNet variant chosen in config.yml)
  harness_source: src-github-stocknet-code-readme
  harness_quote: Python 2.7.11 - Tensorflow 1.4.0
  code_licence: MIT
  code_licence_note: The code repository's LICENSE file; GitHub reports MIT (API, read 2026-11-08).
  code_licence_source: src-github-stocknet-code-licence
  code_licence_quote: MIT License
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # classification-metric and exact-match with task-specific-supervised-model resolve to the fallback profile
  # (subset_used). Beyond it: training_data_policy, because the design trains on the 2014 to mid-2015 split while
  # prompted language models bring pretraining that may include the 2015 test period, and FinBen's training split
  # differs from the paper's (20,781 against 20,339 rows). The five-day lag is fixed by the dataset's construction
  # and has no condition field of its own (review_checks).
  material_extra:
    - training_data_policy

homepage: https://github.com/yumoxu/stocknet-dataset
repository: https://github.com/yumoxu/stocknet-code
dataset_url: https://github.com/yumoxu/stocknet-dataset
leaderboard_url: null

lineage:
  role: root
  forks:
    - id: finben
      maintainer: The Fin AI
      source: src-hf-api-finben-en-sm-acl
      quote: A Holistic Financial Benchmark for Large Language Models

tags:
  - stock-movement
  - tweets
  - price-series
  - binary-classification
  - us-equities

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T06)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-acl-p18-1183-pdf
    - src-acl-p18-1183
    - src-github-stocknet-dataset-readme
    - src-github-stocknet-dataset-licence
    - src-github-stocknet-code-readme
    - src-github-stocknet-code-licence
    - src-hf-api-finben-en-sm-acl
    - src-arxiv-2503-10957
  sources_note: >
    The paper's Anthology PDF (a DOI, not archived) read as text, and its landing page (the same DOI)
    for the date and licence; the dataset and code repositories' READMEs and LICENSE files at master;
    Hugging Face's API record of FinBen's gated copy, read without accepting its terms; and the arXiv
    abstract page of a March 2025 paper as evidence of current use. GitHub's API (licences, dates, commit
    history and the files each commit changed) was read but is not a quoted Source. The OpenFinLLM leaderboard
    documentation's ACL18 page was fetched and not cited: its example is illustrative and its count (27,053)
    matches neither the paper nor the Hugging Face splits.
  confidence: medium
  review_checks:
    - check: The id stocknet is proposed from the paper's and repository's name; allocation is a
        human act. ACL18 is the name FinBen and its Hugging Face copy use, and the model shares the
        name StockNet. A reviewer may prefer acl18 as the id.
      field: id
    - check: capability carries context-integration only, and only loosely, because no term names
        predicting a financial quantity from a time series; scientific-prediction is limited to
        physical, chemical, biological and Earth systems. The gap is logged in taxonomy/_failures;
        widening scientific-prediction or adding a forecasting-of-series term is the call.
      field: capability
    - check: The domain search found no time-series family; the only forecasting leaves outside
        society-econ-law are earth-climate's weather and energy ones. A future general time-series
        family could claim this entry.
      field: domain.primary
    - check: designed_for_subjects adds classical-algorithm for the random-guess and ARIMA
        baselines. ARIMA is fitted to each series, which the term's inclusion test allows for fitted
        constants; drop it if baselines should not count.
      field: designed_for_subjects
      source: src-acl-p18-1183-pdf
      quote: 'RAND: a naive predictor making random guess in up or down.'
    - check: data_provenance tags Yahoo Finance prices as curated-public-database. Its exclusion
        sends harvested web content to web-scraped; whether a commercial price-history service is a
        curated archive or web content is a judgement.
      field: data.data_provenance
    - check: The dataset redistributes tweets, raw as full tweet JSON and preprocessed with the user
        id, under an MIT licence; the paper says Twitter data were accessed under Twitter's licence.
        Whether the redistribution and the personal data it carries suit the catalogue's dataset_url
        is for a reviewer.
      field: data.upstream_licences
      source: src-github-stocknet-dataset-readme
      quote: "Keys: 'text', 'user\\_id\\_str', 'created\\_at'"
    - check: FinBen's copy is recorded as a fork with id finben, not yet catalogued. Its splits keep
        the paper's development and test counts but its training split has 442 more rows, and its
        prompts were not read (the record is gated). Whether FinBen should be catalogued as a suite
        that contains this task, rather than as a fork, is the call.
      field: lineage.forks
      source: src-hf-api-finben-en-sm-acl
      quote: '"name":"test","num_bytes":13359338,"num_examples":3720'
    - check: The Bloomberg grant is recorded as funding without a flag, because the paper evaluates
        no Bloomberg system. A reviewer may weigh that Bloomberg sells market data and analytics.
      field: governance.independence_flags
      source: src-acl-p18-1183-pdf
      quote: This research was supported by a grant from Bloomberg
    - check: contamination_risk is medium. For prompted language models trained after 2015 the test
        outcomes are public market history; no source evidencing memorisation was read, which high
        would need.
      field: data.contamination_risk
    - check: released is 2018-07-15, the first day of the conference as the PDF's footer gives it;
        the Anthology dates the paper to July 2018 only, and the data were public on GitHub from
        2018-04-28 (GitHub API, not a quoted Source). The data's first commit is the alternative.
      field: released
      source: src-acl-p18-1183
      quote: 'Month: July Year: 2018'
    - check: Only the 2025 paper's abstract page was read; that it uses the paper's test split, and
        its numbers, are not checked. The as_used row says so.
      field: as_used
    - check: The five-day lag window, fixed by the paper's sample construction, and the class
        thresholds have no condition field; a variant that changes either is a different task. No
        EvalConditions record was written.
      field: comparability.material_extra
      source: src-acl-p18-1183-pdf
      quote: We use a 5-day lag window for sample construction

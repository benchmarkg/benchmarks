# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-28
  last_verified: 2026-11-28
  verification_status: ai-drafted-unverified
  sources:
    - src-vals-ai-a2j
    - src-vals-ai-benchmarks-index
    - src-vals-ai-methodology
    - src-vals-ai-about
  sources_note: >
    Vals AI's board page, server-rendered and read with scripts and styles stripped (withheld from
    archiving: it names no author or expert, but a model's sample reply cites a court decision by its
    parties' names and a courthouse named after a judge, which no window reaches); Vals' benchmarks index;
    and
    Vals' methodology and about pages (already archived for finance-agent-benchmark). vals.ai's robots.txt
    allows these paths for all agents, Claude-User included. There is no paper, report, repository or
    dataset to read.
  confidence: low
  review_checks:
    - check: Family and leaf. Much of the legal information (about three-quarters of the criteria)
        applies state law to the person's facts (legal-reasoning), but a quarter are facts to elicit
        and some are referrals to named local help, as an intake worker would give, which no leaf
        names; a gap is logged with bench tag-gap proposing a legal-assistance leaf that
        immigration-bench would share.
      field: domain.primary
      source: src-vals-ai-a2j
      quote: This benchmark tests whether AI models can act as a reliable first point of contact for
        someone with a legal problem
    - check: data.access. The page says the test split is used for published results and the
        validation split is kept private, but not whether the test split is released; no data is
        linked. private-test-server, contamination_risk low and single-evaluator-private-test-set
        rest on the index's Proprietary label and Vals' methodology. If the test split is public,
        all three change.
      field: data.access
      source: src-vals-ai-a2j
      quote: 'The full dataset has 504 scenarios, split 50/50: models are evaluated on a 252-scenario
        test split used for published results, and the other 252 scenarios are kept private as a validation
        split.'
    - check: The judge, Decider v1.2, is unexplained on the page (no developer, selection or
        validation). Vals' home page lists Decider models among the decision models it evaluates on
        other boards (read, not cited); if Decider is Vals' own or an evaluated party's model, an
        independence flag may follow.
      field: governance.independence_flags
      source: src-vals-ai-a2j
      quote: Judge (Decider v1.2).
    - check: funded-by-evaluated-party is not set. The page says only that NextLadder Ventures
        supported the benchmark; what it gave and who funds it are not stated in any source read.
      field: governance.independence_flags
      source: src-vals-ai-a2j
      quote: Access to Justice was built by Vals AI with support from NextLadder Ventures.
    - check: evaluator-sells-evaluations is not set; no page read says Vals sells evaluations of the
        systems it ranks, although it licenses its private sets to companies.
      field: governance.independence_flags
      source: src-vals-ai-methodology
      quote: 'Private Validation Set: A larger, privately held dataset, which we license to companies
        for their own internal validation.'
    - check: released is null and lifecycle active rests on the maintainer's board alone, whose
        launch is undated; if the 2026-11-10 board is the launch run and nothing has been added
        since, proposed may be the better reading. No third-party use was looked for beyond Vals'
        pages.
      field: lifecycle
      source: src-vals-ai-benchmarks-index
      quote: 'Legal Proprietary Access to Justice Benchmark Updated: 11/10/2026 Models Tested: 23'
    - check: The page plans a length-adjusted score and ranking, since longer answers score higher;
        when it comes, scores before and after will not be comparable, which would be a revision.
      field: aggregation_policy
      source: src-vals-ai-a2j
      quote: We aim to conduct further analyses determining a length-adjusted scoring and ranking as
        a future step
    - check: A scenario that a provider's content filter blocks on every retry counts as zero, so
        one model family's criminal-records score reflects refusals rather than answers; claims for
        it need that note.
      field: task.scoring
      source: src-vals-ai-a2j
      quote: those blocked scenarios count as zero
    - check: tool-use is rejected although web search is on in the scored run, because no criterion
        scores the tools; the page ties weak local referrals to models rarely opening local pages,
        and a reviewer may add tool-use.
      field: capability
      source: src-vals-ai-a2j
      quote: Every model could search the web and open pages.
    - check: model-graded-judge needs reference_conditions naming the judge (Decider v1.2) and the
        simulated client (GPT-5); no conditions record exists, and writing one was outside this
        task's write scope.
      field: reference_conditions
  personal_data_excluded:
    - source: src-vals-ai-a2j
      what: a sample model reply's court decision cited by its parties' names, and a courthouse
        named after a judge

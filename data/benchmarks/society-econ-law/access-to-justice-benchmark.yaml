# data/benchmarks/society-econ-law/access-to-justice-benchmark.yaml
#
# P1-S12 sweep follow-up: a new society-econ-law entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from Vals AI's Access to Justice Benchmark page (board and methodology, updated 2026-11-10), read with
# scripts and styles stripped; Vals' benchmarks index; and Vals' methodology and about pages. There is no paper,
# report, repository, dataset card or public sample to read: the page links none. Every quote below is checked by
# the quote-substring validator against those Sources' committed extracts.
#
# The id is a proposal from the benchmark's name, as finance-agent-benchmark's is from "Finance Agent Benchmark"
# (the URL slug is a2j and the page also says "Access to Justice"); allocation is a human act (04 S3), and no
# catalogued id, stub, retired id or open branch is near it. No release date or version label is given, so no
# version is recorded. Public Benefits Bench, which the page names as its deeper study of one topic, is a separate
# Vals benchmark with its own scenarios.

id: access-to-justice-benchmark
name: Access to Justice Benchmark
aliases:
  - Access to Justice
tagline: Legal-aid scenarios from six states; a model talks with a simulated client and is graded on
  expert rubrics.
description: >
  A benchmark from Vals AI, built with support from NextLadder Ventures, of whether a model can act as
  a reliable first point of contact for someone facing a civil legal problem without a lawyer, the role
  a legal-aid intake worker or a court self-help centre plays. Two legal practitioners supplied real queries
  that people brought to legal aid organisations, and six legal aid experts each adapted them to one state
  (California, Louisiana, Virginia, New York, Maryland or Texas) and wrote the person's opening question,
  background facts that the person shares only when asked, a difficulty rating and a rubric of what a
  good first response must find out and what general legal information and referrals it must give (15.4
  criteria on average). The topics follow legal aid's caseload, from family law (110 of the 252 test scenarios)
  and housing (65) to employment, consumer debt, criminal records, estates, public benefits and other
  civil matters. The tested model, which can search the web and read pages, holds up to five exchanges
  with a simulated client (GPT-5) that answers only what it is asked, and a judge (Decider v1.2) grades
  the whole conversation against the rubric; a model's score is the share of criteria met, pooled over
  the 252-scenario test split. The other 252 scenarios are a private validation split. On 2026-11-10 the
  board ranked 23 models, led by Qwen 3.8 Max at 76.37%, below the 80% that the maintainers set as the
  bar for a reliable first point of contact. Apart from one sample scenario on the page, no scenarios,
  code or paper are public.
self_description:
  source: src-vals-ai-a2j
  quote: How well can AI help someone navigate a legal problem without a lawyer?
released: null
released_note: No page read dates the release or the board's first results; the board's last update
  is 2026-11-10, and the page cites a survey from March 2026, so the release is later than that.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/legal-reasoning
  secondary:
    - language/dialogue
domain_basis:
  reason: About three-quarters of the criteria are legal information, much of it applying a state's
    law to the person's facts, such as what must be proved without a written contract or which court
    a claim belongs in, which is the legal-reasoning leaf's application of rules to facts. The rest
    are facts to find out, and the legal information also includes referrals to named local help; no
    leaf names that intake role (bench tag-gap, review_checks). The tested model works through a
    conversation of up to five exchanges and the judge grades the whole of it, which is
    language/dialogue, carried as secondary.
  source: src-vals-ai-a2j
  quote: This benchmark tests whether AI models can act as a reliable first point of contact for
    someone with a legal problem
domain_considered_and_rejected:
  - term: society-econ-law/policy-analysis
    reason: Public benefits are one topic of eight, five test scenarios, and no item analyses a
      policy option; the questions ask what a person can do.
    source: src-vals-ai-a2j
    quote: Public benefits (5 scenarios) and the catch-all civil category (11 scenarios) are the
      hardest topics for models
  - term: society-econ-law/legal-document
    reason: No document is supplied or reviewed; some criteria point to court forms, but no form is
      filled in or drafted.
  - term: agents-tooluse/research-agents
    reason: The model can search and read pages, but each scenario is one person's problem with
      determinate criteria, not an open research question, and what it read or cited is not scored.
  - term: society-econ-law/economically-valuable-work
    reason: The role is an intake worker's, but an LLM judge checks rubric criteria; nothing is
      compared with a professional's work product.

capability:
  - factual-precision
  - context-integration
capability_basis:
  factual-precision:
    reason: The judge checks each criterion (a fact to find out, a rule to explain, a deadline, a
      named local organisation to refer to) on its own inside a free-form conversation, and the
      score is the share met.
    source: src-vals-ai-a2j
    quote: It grades the full conversation against the expert rubric, scoring elicitation and legal
      information separately.
  context-integration:
    reason: The background facts that decide the answer are held by the simulated client and shared
      only when asked, and about a quarter of the criteria score whether the model found them out; a
      fact the person volunteered or gave in the opening question is set aside rather than scored.
    source: src-vals-ai-a2j
    quote: cover the context a careful advocate must find out about the person
capability_considered_and_rejected:
  - term: tool-use
    reason: Every model can search the web and open pages, and the page ties weak local referrals to
      models rarely opening local self-help or legal aid pages, but no criterion scores the tools'
      use; a reviewer may add it (review_checks).
    source: src-vals-ai-a2j
    quote: Every model could search the web and open pages.
  - term: knowledge-recall
    reason: Web search and page reading are available in the scored run, so the information the
      answer needs is not limited to what the model holds.
  - term: communication
    reason: Nothing the simulated client understood or did is scored, only what the model's replies
      covered.
  - term: collaboration
    reason: The simulated client answers only what it is asked from fixed facts and has no objective
      of its own; the term's exclusion treats such a party as environment.

evaluation_method:
  - rubric-graded
  - model-graded-judge
evaluation_method_note: The judge, Decider v1.2, grades elicitation and legal-information criteria
  separately against the full conversation; the page does not say how it was chosen or validated, or
  who makes it. Criteria read as "Must find out", "Must explain", "Must advise", "Must not" and
  "Refer to" items. A must-find-out criterion counts only if the model asked about the fact, and is
  set aside when the person's opening question or the client already gave it.
evaluation_method_basis:
  reason: Expert criteria are checked one by one and pooled into a share, and a model applies them,
    so both terms apply.
  source: src-vals-ai-a2j
  quote: a rubric of what context a good response must elicit and what information it must deliver
    (15.4 independent criteria on average)
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: Legal aid experts wrote the scenarios and criteria and the page reports their reading of
      the results, but no published score comes from them.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Vals runs every model through the same conversation loop, with the same simulated client,
    judge, tools and exchange limit, and each row names a model.
  source: src-vals-ai-a2j
  quote: It acts as a first point of contact for legal help, can search the web and read pages, and
    can ask the person follow-up questions before giving its final answer.
designed_for_subjects_considered_and_rejected:
  - term: tool-augmented-model
    reason: The model decides when to search, what to ask and when to answer inside the benchmark's
      loop, which the term's exclusion sends to model-in-benchmark-harness.
  - term: full-product-pipeline
    reason: The page compares free-tier and premium models to approximate what chatbot users get,
      but it tested the models through their APIs, not the chatbots.
    source: src-vals-ai-a2j
    quote: We tested every model through its API with the same setup
  - term: instruction-tuned-model
    reason: The benchmark drives the model across up to five exchanges with tools, which the term's
      exclusion sends to model-in-benchmark-harness.

lifecycle: active
lifecycle_basis:
  reason: Vals runs the board, which the index dates 2026-11-10 with 23 models tested. No source
    dates the launch, so whether results are still being added after a launch run is not shown
    (review_checks).
  source: src-vals-ai-benchmarks-index
  quote: 'Legal Proprietary Access to Justice Benchmark Updated: 11/10/2026 Models Tested: 23'
activity: no-submission-channel
activity_note: Vals chooses the models and runs them; no page read offers a submission route.
activity_basis:
  reason: Every published score is Vals' own run; the index labels the benchmark Proprietary, the
    label Vals' methodology gives benchmarks scored only on its private test sets.
  source: src-vals-ai-methodology
  quote: 'Test Set: This dataset remains private at all times, and is the only dataset used for the proprietary
    benchmark results we publish.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Qwen 3.8 Max
    source: src-vals-ai-a2j
    observed_on: 2026-11-28
    quote: As of November 10, 2026, Qwen 3.8 Max ranks first on the Access to Justice Benchmark with
      76.37%
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: Legal aid experts adapted each scenario to a state and wrote what a reliable first point
    of contact should ask and tell the person; the judge applies those criteria.
  source: src-vals-ai-a2j
  quote: Six legal aid experts then each adapted the queries to one assigned state
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: No scenario, rubric, prompt or code is released and the page links none; the index labels
    the benchmark Proprietary, and every score is Vals' own run.
  source: src-vals-ai-benchmarks-index
  quote: 'Social Mobility Proprietary Access to Justice Benchmark Updated: 11/10/2026'
task:
  exists: true
  input:
    - a person's opening question in one of six states, such as whether they can sue their child's
      other parent in small claims court for money that was promised and not paid
    - the simulated client's answers to the model's questions, drawn only from the scenario's
      background facts, and web search and page reading
  output: Replies over up to five exchanges (3.5 on average), ending in a final answer that gives
    general legal information and points the person to help.
  scoring: The judge marks each criterion met or not against the whole conversation; must-find-out
    criteria count only if the model asked. A model's score is the share of criteria met, pooled
    over the 252 test scenarios (so a scenario with a longer rubric weighs more), and a scenario a
    provider's content filter blocks counts as zero.
  source: src-vals-ai-a2j
  quote: is the share of rubric criteria it meets, pooled across all 252 scenarios.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: "Public: the board, with topic, criterion-type, sources-read, free-tier and conversation-length
    analyses, and one sample scenario with every model's conversation, the rubric and the judge's verdicts.
    Not public: the 252-scenario test split, which the page uses for every published score without saying
    whether it is released, and the 252-scenario validation split, which it keeps private. No scenario
    file, repository, dataset or paper is linked, and the index labels the benchmark Proprietary (review_checks)."
  access_basis:
    reason: Every published score is Vals' own run, the page links no data, and Vals' methodology
      says its proprietary results come only from a test set that stays private; the page itself
      states privacy only for the validation split.
    source: src-vals-ai-a2j
    quote: 'The full dataset has 504 scenarios, split 50/50: models are evaluated on a 252-scenario test
      split used for published results, and the other 252 scenarios are kept private as a validation split.'
  refresh: null
  refresh_note: Left null. No version label, change log or plan for new scenarios is given; the page
    plans a length-adjusted scoring and ranking, which would change the score, not the items.
  data_provenance:
    - expert-authored
  data_provenance_note: Two legal practitioners supplied real queries brought to legal aid
    organisations, and six legal aid experts adapted each to one assigned state and wrote its facts,
    criteria and difficulty rating, framing the answer as general legal information rather than
    legal advice. The topic mix follows what the practitioners see.
  data_provenance_basis:
    reason: The scenarios are experts' adaptations of real queries, not the queries themselves.
    source: src-vals-ai-a2j
    quote: Two legal practitioners supplied real-world queries.
  data_provenance_source: src-vals-ai-a2j
  data_provenance_quote: Six legal aid experts then each adapted the queries to one assigned state
  contamination_risk: low
  contamination_risk_note: Rests on the test split not being released, which the page does not
    state. One sample scenario, with its full rubric, is on the page; Vals sends the scenarios to
    each provider's API on every run, and the models search the live web; no source weighs any of
    these.
  contamination_risk_source: src-vals-ai-methodology
  contamination_risk_quote: It is private to prevent leakage into the training data of foundation
    models.
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: No expert answered the scenarios under the benchmark's conditions. The
    80% of criteria that the maintainers set as the bar for a reliable first point of contact is a
    target, not a measured anchor.
  dataset_licence: null
  dataset_licence_note: No data is released and no licence is stated; the page's schema.org record
    (a script block, outside the extract) gives CC BY 4.0 for the leaderboard data.
  size:
    - count: 252
      unit: scenarios
      subset: test split, on which the board is computed
      source: src-vals-ai-a2j
      quote: 'The full dataset has 504 scenarios, split 50/50: models are evaluated on a 252-scenario
        test split used for published results, and the other 252 scenarios are kept private as a validation
        split.'
    - count: 504
      unit: expert-adapted legal-aid scenarios
      subset: all scenarios
      source: src-vals-ai-a2j
      quote: 'The full dataset has 504 scenarios, split 50/50: models are evaluated on a 252-scenario
        test split used for published results, and the other 252 scenarios are kept private as a validation
        split.'
    - count: 252
      unit: scenarios
      subset: validation split (private)
      source: src-vals-ai-a2j
      quote: 'The full dataset has 504 scenarios, split 50/50: models are evaluated on a 252-scenario
        test split used for published results, and the other 252 scenarios are kept private as a validation
        split.'
  size_note: The test scenarios split by state as California 44, Louisiana 44, Virginia 43, New York
    41, Maryland 40 and Texas 40, and by topic as family law 110, housing and landlord-tenant 65,
    consumer and debt 18, criminal and records 16, estate and probate 14, employment 13, civil and
    other 11 and public benefits 5. Rubrics average 15.4 criteria, about 24% of them must-find-out
    items.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Vals AI, Inc.
  maintainer_basis:
    reason: Vals built the benchmark, holds the scenarios and runs the only board; NextLadder
      Ventures supported it.
    source: src-vals-ai-a2j
    quote: Access to Justice was built by Vals AI with support from NextLadder Ventures.
  maintainer_type: industry-lab
  maintainer_type_note: Vals AI, Inc. is a company that builds and runs evaluations; the page does
    not say what NextLadder Ventures' support was.
  submission_process:
    - maintainer-run
  submission_process_note: Vals selects the models, runs each through its API with the same setup on
    the test split, retries a scenario a content filter blocks and scores it zero if it stays
    blocked, and publishes the board with cost, token and duration columns.
  submission_process_source: src-vals-ai-benchmarks-index
  submission_process_quote: Vals AI runs 44 independent AI benchmarks across legal, finance,
    healthcare, coding, math, and more.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-vals-ai-methodology
      quote: 'Test Set: This dataset remains private at all times, and is the only dataset used for the
        proprietary benchmark results we publish.'
  independence_flags_note: One party holds the scenarios and runs every evaluation; the flag rests
    on Vals' methodology and the index's Proprietary label, since the page states privacy only for
    the validation split. The judge, Decider v1.2, is not on this board, and no source read names
    its developer, so grader-from-evaluated-party is not set; the simulated client (GPT-5) is not a
    grader. Vals builds no evaluated model. No source read says what NextLadder Ventures is funded
    by or gave, so funded-by-evaluated-party is not set, and none says Vals sells evaluations of the
    systems it ranks (review_checks).
  independence_assessed: true
  known_limitation:
    source: src-vals-ai-a2j
    quote: Longer answers also tend to score higher (correlation 0.50 between final-answer length
      and score)
  known_limitation_note: The rubric credits criteria met and does not penalise length, and the top
    model writes the longest final answers; the page plans a length-adjusted score. Each scenario is
    set in one of six states, and scenarios blocked by a provider's content filter count as zero.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is calls to the tested model's API with web search, the simulated client and the
      judge.
    source: src-vals-ai-a2j
    quote: We tested every model through its API with the same setup
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The scores are on scenarios only Vals holds, which the tier's inclusion test covers.
    source: src-vals-ai-about
    quote: Scores are based on our privately held test sets to preserve the integrity and signal of
      our results.
  reproducibility_blockers:
    - private-test-set
    - no-reference-implementation
    - live-world-state
  reproducibility_blockers_note: Neither the scenarios, rubrics and client facts nor the harness,
    prompts or judge are released, and the tested models search and read the live web, whose local
    resources and court pages change.
  reproducibility_blockers_source: src-vals-ai-a2j
  reproducibility_blockers_quote: Every model could search the web and open pages.
  harness_availability: none
  harness_availability_note: No code, prompt or configuration is published, and the page links no
    repository.
  harness: Vals' unreleased conversation harness, with GPT-5 as the simulated client and Decider
    v1.2 as the judge
  harness_source: src-vals-ai-a2j
  harness_quote: Judge (Decider v1.2).
  code_licence: null
  code_licence_note: No code is released.
  runnable_via:
    - none
  inspect_evals_id: null
  inspect_evals_id_note: Reconciled against UK AISI's inspect_evals on 2026-11-28 through the GitHub
    API's listing of src/inspect_evals at main (137 entries); none is the Access to Justice
    Benchmark. Not a quoted Source.
  maintainer_rerun_policy: unstated

comparability:
  # Resolved profile: model-graded, for (rubric-graded, model-in-benchmark-harness) and (model-graded-judge,
  # model-in-benchmark-harness). Beyond it: the simulated client and its version, the web tools offered, the harness
  # with its five-exchange limit, and the evaluation date, because the models search a live web whose local legal-aid
  # and court pages change. The judge, its prompt and the rubric version are already members.
  material_extra:
    - user_simulator
    - user_simulator_version
    - tools_allowed
    - harness
    - date_evaluated

aggregation_policy: official-aggregate
aggregation_policy_note: The board's accuracy is the share of all rubric criteria met over the test
  split, pooled rather than averaged per scenario; the page breaks it down by topic, criterion type
  (gathering context or legal information), free-tier against premium models and sources read.
aggregation_policy_basis:
  reason: One pooled headline over the test split.
  source: src-vals-ai-a2j
  quote: is the share of rubric criteria it meets, pooled across all 252 scenarios.

liveness:
  leaderboard_last_updated: 2026-11-10
  reproduction_script_present: false
  last_checked: 2026-11-28

homepage: https://www.vals.ai/benchmarks/a2j
leaderboard_url: https://www.vals.ai/benchmarks/a2j
maintainer_url: https://www.vals.ai/

versions_note: No release date, version label or change log appears on any page read, so no version
  is recorded; the board was last updated on 2026-11-10.
subsets_note: >
  Results are broken down by topic (eight), family-law subfield, state (six) and criterion type (gathering
  context against legal information), which are labels on the same test split rather than separately released
  tracks, so they are not modelled as subsets.

lineage:
  role: root
lineage_note: No lineage edge. The page names Public Benefits Bench (Vals, SNAP benefits navigation,
  v1.1 on the index) as its deeper study of the public-benefits topic; it is a separate benchmark
  with its own scenarios by the same maintainer, not a variant, and is not catalogued. Immigration
  Bench (immigration-bench) shares the simulated-person design but not the items.


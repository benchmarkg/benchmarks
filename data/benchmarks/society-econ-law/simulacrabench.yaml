# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-simulacrabench-site
    - src-github-situatedevals-public-readme
    - src-codabench-simulacrabench
    - src-neurips-2026-competitions-blog
  sources_note: >
    The competition site with scripts and styles stripped; the starter kit's README at main; Codabench's
    public JSON record of competition 17822 (its page renders by script); and the NeurIPS blog post announcing
    the 2026 competition track. No paper exists, so `paper` is left empty, and no 2025-2026 paper reporting
    results on SimulacraBench was found.
  confidence: medium
  review_checks:
    - check: calibration-uncertainty is the only capability, assigned on its inclusion test (a
        scored distribution). Its definition, a system's confidence in its own output, fits a
        distribution over another person's answer loosely, and the benchmark's central claim,
        faithful simulation of a population, has no term
        (taxonomy/_failures/2026-09-28-simulacrabench-001 proposes population-response-modelling).
      field: capability
    - check: publication-gated rests on Codabench's Terms (rule 7). The site says only winning teams
        supply a method description and everyone else submits code alone; if the site's reading
        holds, the requirement is for prizes only and the term goes.
      field: governance.submission_process
      source: src-codabench-simulacrabench
      quote: Each Test submission must be accompanied by a 4-page method description.
    - check: taxonomy/governance.yaml gives simulacrabench as no-known-conflict's qualifying
        example, but that term's inclusion test needs every other flag not to apply, and
        single-evaluator-private-test-set does (the organisers hold the data and run every
        submission, as for habitat-challenge and virtual-cell-challenge). The example or this entry
        needs to change.
      field: governance.independence_flags
    - check: designed_for_subjects leaves out instruction-tuned-model although the site frames the
        task as LLMs as simulacra and one baseline is an LLM prior. Adding it would resolve the
        [uncertainty-calibration-score, instruction-tuned-model] pair to the forecasting profile,
        making lead_time and resolution_window material for a benchmark that forecasts nothing; the
        profile rule would need the fix, not a waiver.
      field: designed_for_subjects
      source: src-simulacrabench-site
      quote: using LLMs as simulacra of specific populations to pre-test instruments, impute
        non-response, and run subgroup what-ifs
    - check: learned_entrant_evidence is the organisers' LLM-prior baseline, whose score on the real
        data no source shows. The development board (127 rows on 2026-10-14) names users, not
        systems, and is not cited because its rows carry participants' names and affiliations.
      field: learned_entrant_evidence
    - check: The headline size is the site's "~40,000 respondents"; the per-instrument totals it
        tabulates sum to 37,000.
      field: data.size
      source: src-simulacrabench-site
      quote: N total 10,300 19,800 6,900
    - check: lifecycle active rests on the running development phase (noised scores only); the
        competition is two months old, has no paper, and ends on 2026-11-18 with no later edition
        announced. After that, mature or results-pending activity may fit.
      field: lifecycle

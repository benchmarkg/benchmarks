# data/benchmarks/society-econ-law/legalbench.yaml
#
# P1-S3-T02, checkpoint entry 18 of 20 (copilot off). Filled from the LegalBench paper, arXiv 2308.11462 read as its
# v1 PDF (NeurIPS 2023 Datasets and Benchmarks), and its abstract page; the repository README; and Vals AI's
# LegalBench board, a third party's re-run updated on 2026-10-01. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# LegalBench itself. Stage 3's corpus item combined it with Vals AI's board ("legalbench-vals-legal-bench"); Vals AI
# is a third party that re-runs a subset, cited here as evidence of use, not part of the benchmark.

id: legalbench
name: LegalBench
tagline: 162 legal-reasoning tasks designed by legal professionals, from issue-spotting to rule
  application.
description: >
  A collaboratively built benchmark of 162 tasks, contributed by lawyers, legal academics and computational
  legal practitioners. The tasks are organised by six types of legal reasoning: issue-spotting, rule-recall,
  rule-application, rule-conclusion, interpretation and rhetorical-understanding. Each task is a dataset
  of input-output pairs, some newly written and some adapted from existing legal datasets, each under
  its own licence. Tasks ship with a tiny train split (2-8 examples) for few-shot prompting and a test
  split. Classification tasks are scored by exact match with balanced accuracy, extraction tasks by F1,
  and rule-application answers were graded by hand by a law-trained reader. HELM Lite and Vals AI re-run
  subsets.
self_description:
  source: src-github-legalbench-readme
  quote: The LegalBench project is an ongoing open science effort to collaboratively curate tasks
    for evaluating legal reasoning in English large language models (LLMs)
external_ids:
  huggingface: nguha/legalbench
  arxiv: '2308.11462'
paper:
  title: 'LegalBench: A Collaboratively Built Benchmark for Measuring Legal Reasoning in Large Language
    Models'
  arxiv: '2308.11462'
  version_read: v1
  source: src-arxiv-2308-11462-v1
released: 2023-08-20
released_note: The paper's arXiv submission, as the abstract page dates it.
released_source: src-arxiv-2308-11462
released_quote: Sun, 20 Aug 2023

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/legal-reasoning
domain_basis:
  reason: The benchmark is organised around the legal profession's own account of legal reasoning.
  source: src-arxiv-2308-11462-v1
  quote: 'LEGALBENCH identifies six types of legal reasoning that LLMs can be evaluated for: (1) issue-spotting,
    (2) rule-recall, (3) rule-application, (4) rule-conclusion, (5) interpretation, and (6) rhetorical-understanding'
capability:
  - context-integration
  - knowledge-recall
capability_basis:
  context-integration:
    reason: Most tasks supply the legal text or fact pattern -- a clause, an opinion sentence, a
      description of evidence -- and score whether the model applied it correctly.
    source: src-github-legalbench-readme
    quote: the input is a description of some evidence and the output is whether or not that
      evidence would be considered hearsay
  knowledge-recall:
    reason: The rule-recall tasks ask for the substance of a law with no source supplied.
    source: src-github-legalbench-readme
    quote: the input is a question about the substance of a law, and the output is the correct
      answer to the question
capability_considered_and_rejected:
  - term: deductive-reasoning
    reason: Rule-conclusion tasks apply rules to facts, but correctness also rests on legal
      knowledge outside the item, which the term's inclusion test excludes.

evaluation_method:
  - exact-match
  - classification-metric
  - human-expert-eval
evaluation_method_basis:
  reason: Classification outputs are exact-matched and scored by balanced accuracy, multi-label
    tasks by F1, and rule-application answers were judged by a law-trained reader.
  source: src-arxiv-2308-11462-v1
  quote: Rule-application tasks were evaluated manually by a law-trained individual, who analyzed
    LLM responses for both correctness and analysis
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The protocol prompts a general model with written instructions and a handful of
    demonstrations, with no task-specific training -- the use the paper says matters for law.
  source: src-arxiv-2308-11462-v1
  quote: their ability to perform many different tasks using only few-shot prompts

lifecycle: active
lifecycle_basis:
  reason: Third parties still run it -- Vals AI's board was updated on 2026-10-01 with 2026 models
    -- and the maintainers' repository was last pushed in March 2026 (GitHub API).
  source: src-vals-ai-legalbench
  quote: Updated 10/1/2026
activity: no-submission-channel
activity_basis:
  reason: The maintainers take new tasks, not results, and keep no board of their own; results
    appear in papers and on third parties' boards.
  source: src-github-legalbench-readme
  quote: LegalBench is ongoing and we are always looking to incorporate more tasks

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-4
    source: src-arxiv-2308-11462-v1
    observed_on: 2026-10-10
    quote: 'three popular commercial models: GPT-4, GPT-3.5, and Claude-1'
evaluation_target: learned-system
execution_mode: human-in-loop
ground_truth_source: held-out-labels
ground_truth_source_note: Each task's labels from its contributor; rule-application answers are
  graded by a person instead.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every task's data, prompts and labels are public; the rule-application tasks need a
    law-trained grader.
  source: src-github-legalbench-readme
  quote: Each task has an associated *dataset*, consisting of input-output pairs

task:
  exists: true
  input:
    - a task instruction, a few demonstrations from the task's train split, and one test input (a
      clause, fact pattern, question or passage)
  output: A label, an extracted term or a short legal explanation, depending on the task.
  scoring: Per task -- balanced accuracy over exact matches, F1 for multi-label tasks, manual
    grading for rule-application -- reported per task and averaged by reasoning type.
  source: src-arxiv-2308-11462-v1
  quote: Because some tasks contain significant label imbalances, we use balanced-accuracy as a
    metric

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: All tasks, train and test splits included, are public on Hugging Face and GitHub.
    source: src-github-legalbench-readme
    quote: Task datasets can be used to evaluate LLMs by providing the LLM with the input
  refresh: static
  refresh_basis:
    reason: The task set is the paper's 162. The maintainers invite more, and none had been added
      when read, so the scored content has not changed since release.
    source: src-github-legalbench-readme
    quote: The benchmark currently consists of 162 tasks gathered from 40 contributors.
  data_provenance:
    - expert-authored
    - inherited-from-constituents
  data_provenance_note: Many tasks were written by legal professionals for LegalBench; others
    transform existing legal datasets, each keeping its creator's licence.
  data_provenance_source: src-arxiv-2308-11462-v1
  data_provenance_quote: we collected tasks designed and hand-crafted by legal professionals
  contamination_risk: medium
  contamination_risk_note: Test splits and labels are public, and some constituents come from
    datasets published earlier; a training route is plausible, and no evidence was read.
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: Mixed, per task; the README asks users to follow each dataset creator's
    licence.
  upstream_licences: Each task keeps its source dataset's licence, listed per task in the
    repository.
  upstream_licences_source: src-github-legalbench-readme
  upstream_licences_quote: We ask that you follow the license of the dataset creator

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Stanford HazyResearch (Neel Guha and collaborators)
  maintainer_basis:
    reason: The repository and the site are held by Stanford's HazyResearch lab, which coordinated
      the contributors.
    source: src-github-legalbench-readme
    quote: We're an [interdisciplinary team]
  maintainer_type: academic-lab
  submission_process:
    - literature-only
  submission_process_note: Contributions are tasks, not results. Vals AI and HELM Lite run their own
    boards over subsets, which literature-only's exclusion test does not count as the benchmark's
    own process.
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: The rule-application tasks are graded by a person with legal training, and the most
      restrictive part sets the tier, though most re-runs (Vals AI, HELM Lite) score only the
      automatic tasks.
    source: src-arxiv-2308-11462-v1
    quote: Rule-application tasks were evaluated manually by a law-trained individual
  reproducibility_blockers:
    - human-raters
  harness_availability: reference-implementation-only
  harness_availability_note: The repository gives prompts, a usage notebook and a getting-started
    page; scoring code for the full benchmark was not found.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which tasks (all 162, or a third party's subset such as HELM Lite's), the prompts and
  # number of demonstrations, and whether the manually graded tasks are included.
  material_extra:
    - subset_used
    - shots

homepage: https://hazyresearch.stanford.edu/legalbench/
repository: https://github.com/HazyResearch/legalbench
dataset_url: https://huggingface.co/datasets/nguha/legalbench

tags:
  - legal-reasoning
  - law
  - few-shot

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S3-T02)
  added_on: 2026-10-10
  last_verified: 2026-10-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2308-11462-v1
    - src-arxiv-2308-11462
    - src-github-legalbench-readme
    - src-vals-ai-legalbench
  sources_note: >
    The paper's v1 PDF read as text; its abstract page for the date; the README at main; and Vals AI's

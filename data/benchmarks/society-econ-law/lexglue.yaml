# data/benchmarks/society-econ-law/lexglue.yaml
#
# P1-S9-T05, society-econ-law entry 5 of 7. Filled from the LexGLUE paper, arXiv 2110.00976 read as its v4 PDF
# (2022-11-08; ACL 2022), its abstract page and its ACL Anthology page (DOI 10.18653/v1/2022.acl-long.297); the
# repository README at main, with its leaderboard; Hugging Face's API record of coastalcph/lex_glue; the merged
# Hugging Face datasets pull request 5048 that fixed EUR-LEX's label list; the repository's New Results discussion
# category; HELM's lex_glue scenario at its last commit; and the v2 PDF of arXiv 2508.07849 (May 2026), a paper
# that reports new results on two of the tasks. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.
#
# LexGLUE is not LegalBench (society-econ-law/legalbench.yaml): LexGLUE is seven earlier legal NLP datasets
# re-split for fine-tuned models, LegalBench 162 few-shot reasoning tasks written for prompted LLMs.

id: lexglue
name: LexGLUE
aliases:
  - Legal General Language Understanding Evaluation
tagline: Seven English legal NLP tasks, from ECtHR violations to contract clauses and case holdings,
  scored by F1.
description: >
  A GLUE-style benchmark of seven existing English legal datasets, simplified and re-split for
  fine-tuned language models. ECtHR Task A and Task B give the facts of a European Court of Human
  Rights case and ask which of ten Convention articles the court found violated (A) or considered
  allegedly violated (B). SCOTUS labels US Supreme Court opinions with one of 14 issue areas, EUR-LEX
  EU laws with the 100 most frequent level-2 EuroVoc concepts, LEDGAR contract provisions from SEC
  filings with one of 100 topics, and UNFAIR-ToS Terms of Service sentences with eight types of
  potentially unfair term. CaseHOLD gives an excerpt of a US court decision with a citation's holding
  masked and asks for the right one of five candidate holdings. Most datasets are split
  chronologically. Every task is scored by micro- and macro-F1, and the README's leaderboard reports
  their arithmetic, harmonic and geometric means across tasks. The data is on Hugging Face and the
  fine-tuning code on GitHub; results reach the leaderboard through the repository's discussions.
self_description:
  source: src-arxiv-2110-00976-v4
  quote: we introduce the Legal General Language Understanding Evaluation (LexGLUE) benchmark, a
    collection of datasets for evaluating model performance across a diverse set of legal NLU tasks
    in a standardized way
external_ids:
  huggingface: coastalcph/lex_glue
  arxiv: '2110.00976'
paper:
  title: 'LexGLUE: A Benchmark Dataset for Legal Language Understanding in English'
  arxiv: '2110.00976'
  doi: 10.18653/v1/2022.acl-long.297
  version_read: v4
  source: src-arxiv-2110-00976-v4
released: 2021-10-03
released_note: The paper's first arXiv version, as its abstract page dates it. The ACL 2022 version
  followed in May 2022, and v4 (2022-11-08) corrected the TF-IDF SVM baseline's scores.
released_source: src-arxiv-2110-00976
released_quote: Submitted on 3 Oct 2021
release_venue: ACL 2022 (Proceedings of the 60th Annual Meeting of the ACL, Volume 1, Long Papers)
release_venue_source: src-acl-anthology-2022-acl-long-297
release_venue_quote: 'Volume: Proceedings of the 60th Annual Meeting of the Association for Computational
  Linguistics (Volume 1: Long Papers) Month: May Year: 2022 Address: Dublin, Ireland'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/legal-document
  secondary:
    - society-econ-law/legal-reasoning
domain_basis:
  reason: The datasets were chosen to test legal understanding that matters to legal practitioners.
    Four of the seven tasks label a legal document by its topic or clause type (SCOTUS opinions, EU
    laws, contract provisions, Terms of Service sentences), which is the primary leaf under
    ADR-0016's majority rule. The other three apply law to facts, the secondary leaf. ECtHR A and B
    predict from a case's facts the articles a court found, or considered, violated, and CaseHOLD
    picks the holding a citing passage relies on.
  source: src-arxiv-2110-00976-v4
  quote: The datasets should check the ability of systems to understand and reason about legal text
    to a certain extent in order to perform tasks that are meaningful for legal practitioners
domain_considered_and_rejected:
  - term: language/understanding
    reason: The paper calls its tasks legal NLU, but language is the interface. The datasets were
      chosen because they need legal expertise, and their labels come from court decisions and
      official annotation. The language family's exclusion sends such a benchmark to the family that
      measures the subject, which here is society-econ-law through legal reasoning.
    source: src-arxiv-2110-00976-v4
    quote: we did not rule out, but rather favored, datasets requiring domain (in our case legal)
      expertise
capability:
  - context-integration
capability_basis:
  context-integration:
    reason: Every task supplies the text the label is read from (a case's facts, an opinion, an EU
      law, a contract provision, a Terms of Service sentence, or a court excerpt with its candidate
      holdings) and scores the label the system assigns to it.
    source: src-github-lex-glue-readme
    quote: Given a document, the task is to predict its EuroVoc labels (concepts).
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: Legal knowledge helps, and the paper credits legal pretraining for it, but every item
      supplies its text and CaseHOLD supplies its five candidate holdings. No item is answered from
      recall alone, and the term's exclusion leaves out background knowledge on the way to another
      scored outcome.
  - term: deductive-reasoning
    reason: ECtHR Task A's label is the court's finding of violation. The articles' text is not
      supplied, and the finding cannot be decided from the stated facts alone.
  - term: distribution-shift-generalization
    reason: Five datasets are split chronologically, and the paper notes EUR-LEX's temporal concept
      drift. But the later-period test split is the only scored condition, the paper does not
      present it as a shift, and CaseHOLD is not split by time (see review_checks).
    source: src-arxiv-2110-00976-v4
    quote: The cases are chronologically split into training (9k, 2001–2016), development (1k,
      2016–2017), and test (1k, 2017–2019).
  - term: memory-retention
    reason: ECtHR and SCOTUS documents run to thousands of tokens, which is why the paper builds
      hierarchical models for them. Length alone is excluded by the term's test.
    source: src-arxiv-2110-00976-v4
    quote: Given the length of the text input in three of the seven LexGLUE tasks, i.e., ECtHR (A
      and B) and SCOTUS, we employ a hierarchical variant

evaluation_method:
  - classification-metric
  - multiple-choice
evaluation_method_basis:
  reason: Six tasks are multi-label or multi-class classifications scored by micro- and macro-F1
    over the whole test set. CaseHOLD picks one of five supplied holdings, so its chance baseline is
    20%. Its one reported number is micro-F1, which equals accuracy when every item has one label.
  source: src-arxiv-2110-00976-v4
  quote: macro-F1 (m-F1) across all datasets to take into account class imbalance
evaluation_method_considered_and_rejected:
  - term: composite
    reason: The averages combine one statistic, F1, computed the same way on every task, which the
      term's exclusion leaves out.
    source: src-github-lex-glue-readme
    quote: We believe that the use of a standard common metric (F1) across tasks and averaging with
      harmonic mean alleviate this issue.
  - term: exact-match
    reason: CaseHOLD's per-item verdict is a choice among supplied options, which is
      multiple-choice, and the classification tasks are scored by F1 over the whole set of
      predictions.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: Every leaderboard row is either a pretrained encoder fine-tuned on each task's training
    split or a TF-IDF SVM trained on it, scored as trained. The paper reports the seed with the best
    development score out of five.
  source: src-arxiv-2110-00976-v4
  quote: We train models with the Adam optimizer (Kingma and Ba, 2015) and an initial learning rate
    of 3e-5 up to 20 epochs using early stopping on development data
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: Legal-BERT and CaseLaw-BERT are pretrained on legal text, but the term's test limits a
      discipline to the scientific, clinical and engineering-design families. A legal classifier
      fine-tuned on its task is task-specific-supervised-model.
  - term: instruction-tuned-model
    reason: The protocol fine-tunes on each training split. Prompted LLMs came later, through HELM's
      scenario and a 2023 zero-shot study, and are recorded in observed_subjects and as_used.
observed_subjects:
  values:
    - task-specific-supervised-model
    - instruction-tuned-model
  basis: >
    A May 2026 paper still fine-tunes on UNFAIR-ToS and LEDGAR, now including 7B decoder LLMs
    (Mistral, AdaptLLM, SaulLM-7B), and it compares them with GPT-3.5-Turbo's zero- and few-shot
    results from Chalkidis (2023). HELM's lex_glue scenario prompts models with in-context examples.
  source: src-arxiv-2508-07849-v2
as_used:
  - protocol: HELM's lex_glue scenario prompts a model with a task instruction and up to five
      training examples in context (one for ECtHR and SCOTUS, whose documents are long), with no
      fine-tuning. Its main metric is macro-F1.
    split: test
    source: src-github-helm-lex-glue-scenario
    quote: main_metric="classification_macro_f1"
    note: The scenario loads the Hugging Face dataset (lex_glue). Its scores are not comparable with
      the README's fine-tuned rows.
  - protocol: Fine-tuned models are scored on UNFAIR-ToS and LEDGAR only, beside a third dataset
      outside LexGLUE. LEDGAR inputs are cut to 128 tokens, and on LEDGAR the 7B decoders get 3
      training epochs instead of 20.
    split: test
    source: src-arxiv-2508-07849-v2
    quote: For LEDGAR, we reduce the maximum sequence length to 128 (from 512 used in Chalkidis et
      al. (2022))
    note: Singh et al., arXiv 2508.07849 v2 (2026-05-22). Otherwise it keeps LexGLUE's training
      configuration and best-seed reporting.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced against its tasks. A paper revised in May 2026 fine-tunes 13
    legal-specific models on UNFAIR-ToS and LEDGAR under LexGLUE's configuration and compares them
    with 9 generalist ones. The README was last edited on 2025-07-23 and the leaderboard's rows date
    from 2022 (GitHub API), which is maintenance evidence.
  source: src-arxiv-2508-07849-v2
  quote: To ensure fair comparison, we adopt the training configuration introduced by Chalkidis et
    al. (2022) for the LEDGAR and UNFAIR-ToS datasets
activity: accepting-submissions
activity_note: The New Results category holds four submissions, all from one contributor in December
  2021, and their results are the leaderboard's small-model table. The README's leaderboard has not
  changed since 2022 (GitHub API commit history, not a quoted Source).
activity_basis:
  reason: The README still invites results. A participant opens a discussion with the result logs,
    and a pull request with the code changes, and the maintainers update the leaderboard after
    review. The board has never run in rounds.
  source: src-github-lex-glue-readme
  quote: we ask participants to re-use and expand our code to submit new results

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Legal-BERT (fine-tuned per task)
    source: src-github-lex-glue-readme
    observed_on: 2026-10-14
    quote: Legal-BERT 79.8 / 72.0
    note: The highest arithmetic-mean micro-F1 / macro-F1 on the README's averaged table.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: The paper says every dataset's labels were extracted from records made in
  official judicial or archival procedures, such as court decisions, the Supreme Court Database and
  the EU Publications Office's EuroVoc annotation. No annotators were hired for LexGLUE, and the
  test labels are public.
ground_truth_source_source: src-arxiv-2110-00976-v4
ground_truth_source_quote: All datasets rely on ground truth labels automatically extracted from
  data (e.g., court decisions)
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: All seven datasets, test labels included, are on Hugging Face without a gate, and the
    repository's scripts replicate each dataset's experiments.
  source: src-arxiv-2110-00976-v4
  quote: We also provide bash scripts to replicate the experiments for each dataset with 5 random
    seeds, as we did for the reported results.

task:
  exists: true
  input:
    - a legal text, depending on the task. That is a case's factual paragraphs (ECtHR), a Supreme
      Court opinion (SCOTUS), an EU law (EUR-LEX), a contract provision (LEDGAR) or a Terms of
      Service sentence (UNFAIR-ToS)
    - for CaseHOLD, an excerpt of a court decision with a citation's holding masked, and five
      candidate holdings
  output: A set of labels (ECtHR, EUR-LEX, UNFAIR-ToS), one label (SCOTUS, LEDGAR) or the index of
    one of the five holdings (CaseHOLD).
  scoring: Micro- and macro-F1 per task on the test split. The README's leaderboard adds the
    arithmetic, harmonic and geometric means over the seven tasks, and the paper reports the seed
    with the best development score out of five.
  source: src-arxiv-2110-00976-v4
  quote: report the test scores based on the seed with the best scores on development data

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every split, test labels included, is downloadable from the Hugging Face dataset, which
      is not gated.
    source: src-hf-api-lex-glue
    quote: '"gated":false'
  refresh: versioned-releases
  refresh_basis:
    reason: The task set is the 2021 release. Its one content change is a dated maintainer fix to
      the Hugging Face copy's EUR-LEX label list (2022-09-30), recorded as an erratum on the version
      (see versions).
    source: src-github-hf-datasets-pr-5048
    quote: Fix for a critical bug in the EURLEX dataset label list to make LexGLUE EURLEX results
      replicable.
  data_provenance:
    - inherited-from-constituents
    - curated-public-database
  data_provenance_note: Six tasks reuse published datasets (ECtHR, EUR-LEX, LEDGAR, UNFAIR-ToS,
    CaseHOLD), simplified and re-split, each with its own sources documenting provenance. SCOTUS is
    new, built from Supreme Court opinions and the Supreme Court Database's issue areas.
  data_provenance_source: src-arxiv-2110-00976-v4
  data_provenance_quote: All datasets included in LexGLUE, except SCOTUS, are publicly available and
    have been previously published.
  contamination_risk: medium
  contamination_risk_note: The test sets and labels have been public on Hugging Face since 2021, and
    the constituents were published earlier still, from public court, EU and SEC records.
    Legal-BERT's pretraining corpora include ECtHR cases, EU legislation and US contracts, the same
    sources these tasks draw on. CaseLaw-BERT was pretrained on the Harvard case-law corpus that
    CaseHOLD comes from. No source shows overlap with the test items.
  contamination_risk_source: src-arxiv-2110-00976-v4
  contamination_risk_quote: Legal-BERT has been exposed to a wider variety of legal corpora,
    including EU and UK legislation, ECtHR, ECJ and US court cases, and US contracts.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: F1 is bounded at 100. The paper names the missing human evaluation as a
    limitation, so no human or expert ceiling exists.
  ceiling_anchor_type_source: src-arxiv-2110-00976-v4
  ceiling_anchor_type_quote: Another limitation of the current version of LexGLUE is that human
    evaluation is missing.
  dataset_licence: CC-BY-4.0
  dataset_licence_source: src-hf-api-lex-glue
  dataset_licence_quote: license:cc-by-4.0
  upstream_licences: Each constituent keeps its creators' licence. The paper says all seven are
    available for re-use and re-share with attribution.
  upstream_licences_source: src-arxiv-2110-00976-v4
  upstream_licences_quote: that are available for re-use and re-share with appropriate attribution
  size:
    - count: 7
      unit: tasks (datasets)
      source: src-arxiv-2110-00976-v4
      quote: LexGLUE comprises seven datasets.
    - count: 10000
      unit: test provisions (60,000 train, 10,000 dev)
      subset: LEDGAR
      source: src-github-lex-glue-readme
      quote: LEDGAR Tuggener et al. (2020) Contracts Multi-class classification 60,000/10,000/10,000
    - count: 3900
      unit: test questions (45,000 train, 3,900 dev), as the paper and README give them
      subset: CaseHOLD
      source: src-github-lex-glue-readme
      quote: CaseHOLD Zheng et al. (2021) US Law Multiple choice QA 45,000/3,900/3,900
    - count: 3600
      unit: test questions in the Hugging Face copy
      subset: CaseHOLD
      note: 300 fewer than the paper's count; the sources read do not explain the difference.
      source: src-hf-api-lex-glue
      quote: '{"name":"test","num_bytes":5989952,"num_examples":3600}'
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Ilias Chalkidis and co-authors, under the coastalcph organisation (University of
    Copenhagen)
  maintainer_basis:
    reason: The repository and the Hugging Face dataset are held by the coastalcph organisation. The
      first and corresponding author is at the University of Copenhagen. The 2022 EUR-LEX fix was
      opened by the account iliaschalkidis.
    source: src-hf-api-lex-glue
    quote: '"author":"coastalcph"'
  maintainer_type: academic-lab
  maintainer_type_note: coastalcph is read as the University of Copenhagen group from its name and
    the first author's affiliation. No source read names the organisation (see review_checks).
  submission_process:
    - maintainer-verified
    - maintainer-run
  submission_process_note: Participants open a New Results discussion with their scores, result logs
    and a paper if they have one, plus a pull request with the code changes needed to reproduce
    them. The maintainers review the submission and then update the README's leaderboard. They also
    ran every base- and large-sized row themselves. The one outside entry is four small models.
  submission_process_source: src-github-lex-glue-readme
  submission_process_quote: Upon reviewing your results, we'll update the public leaderboard
    accordingly.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2110-00976-v4
      quote: 'Ilias Chalkidis, Manos Fergadiotis, Prodromos Malakasiotis, Nikolaos Aletras, and Ion Androutsopoulos.
        2020b. LEGAL-BERT: The muppets straight out of law school.'
  independence_flags_note: Legal-BERT is the earlier model of three LexGLUE authors (Chalkidis,
    Aletras, Androutsopoulos). The maintainers ran it as a baseline, and it heads every averaged
    column. The other rows are other parties' models. Funding came from the Innovation Fund Denmark
    and Germany's BMBF, neither of which has a system evaluated here.
  independence_assessed: true
  funding:
    source: src-arxiv-2110-00976-v4
    quote: This work was partly funded by the Innovation Fund Denmark (IFD)

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Data, test labels and fine-tuning code are public, and scoring is a fixed F1 computation
      with no human, simulator or maintainer-held step. Fine-tuning needs a GPU; the README suggests
      a free Colab one.
    source: src-arxiv-2110-00976-v4
    quote: We also provide bash scripts to replicate the experiments for each dataset with 5 random
      seeds, as we did for the reported results.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: coastalcph/lex-glue (the experiments/ Python scripts on Hugging Face Transformers, and
    the scripts/ runners per dataset)
  harness_source: src-github-lex-glue-readme
  harness_quote: we release our code in this repository
  code_licence: null
  code_licence_note: GitHub's licence metadata for coastalcph/lex-glue reports no licence (read
    2026-10-14), and the README states none.
  runnable_via:
    - custom
    - helm
  runnable_via_note: The repository's own scripts, and HELM's lex_glue scenario, which prompts
    rather than fine-tunes (see as_used). inspect_evals (UKGovernmentBEIS) has no LexGLUE task (its
    src/inspect_evals directory, read through the GitHub API on 2026-10-14).
  runnable_via_source: src-github-helm-lex-glue-scenario
  runnable_via_quote: name = "lex_glue"
  maintainer_rerun_policy: unstated

comparability:
  # The (classification-metric | multiple-choice, task-specific-supervised-model) pairs resolve to the fallback
  # profile (subset_used). Four more change a LexGLUE number. Training data: fine-tuned on the train split, or
  # prompted zero- or few-shot, as HELM and Chalkidis (2023) do. Shots, for prompted runs. The input length a
  # model reads: truncating ECtHR to 512 tokens costs about 10 points, and a 2026 paper cut LEDGAR to 128.
  # Selection: the paper's test score is the best of five seeds chosen on development data.
  material_extra:
    - training_data_policy
    - shots
    - context_window_used
    - selection_strategy

aggregation_policy: official-aggregate
aggregation_policy_note: The README publishes six averages, the arithmetic, harmonic and geometric
  means of micro-F1 and of macro-F1 over the seven tasks. It names none as the headline, though it
  argues for the harmonic mean, so headline_metric is left null.
aggregation_policy_basis:
  reason: The leaderboard opens with averaged scores across tasks before the task-wise tables.
  source: src-github-lex-glue-readme
  quote: We report the arithmetic, harmonic, and geometric mean across tasks following
headline_metric: null

homepage: https://github.com/coastalcph/lex-glue
repository: https://github.com/coastalcph/lex-glue
dataset_url: https://huggingface.co/datasets/coastalcph/lex_glue
leaderboard_url: https://github.com/coastalcph/lex-glue#leaderboard

versions:
  - version: v1
    label: LexGLUE, the first version (seven English tasks)
    version_kind: revision
    released: 2021-10-03
    changes: The seven tasks as released with the paper, the datasets on Hugging Face. arXiv v4
      (2022-11-08) corrected the TF-IDF SVM baseline's scores, which a bug had fitted on the
      training and development sets together. No item changed in that correction.
    errata:
      - date: 2022-09-30
        scope: EUR-LEX in the Hugging Face copy
        description: The label list held all 127 level-2 EuroVoc concepts instead of the 100 most
          frequent the paper uses, which gave lower results. A fix opened by the account
          iliaschalkidis and merged into the datasets library on 2022-09-30 restored the 100.
          EUR-LEX scores computed through the library before then are not comparable.
        source: src-github-hf-datasets-pr-5048
    frozen: true
    sources:
      - src-arxiv-2110-00976
      - src-arxiv-2110-00976-v4
      - src-github-hf-datasets-pr-5048

subsets:
  - id: lexglue#ecthr-a
    label: ECtHR Task A (articles violated)
    items: 1000
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-reasoning
    evidence:
      - source: src-arxiv-2110-00976-v4
        quote: In Task A, the input to a model is the list of facts of a case, and the output is the
          set of violated articles.
    notes: Multi-label over 10 ECHR articles plus no violation, on cases split by date (test
      2017-2019). Hierarchical models read up to 64 paragraphs of 128 tokens.
  - id: lexglue#ecthr-b
    label: ECtHR Task B (articles allegedly violated)
    items: 1000
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-reasoning
    evidence:
      - source: src-arxiv-2110-00976-v4
        quote: In Task B, the input is again the list of facts of a case, but the output is the set
          of allegedly violated articles.
    notes: The same cases and facts as Task A, labelled with the articles the court considered. It
      is closer to issue-spotting, which ADR-0020 places under legal-reasoning.
  - id: lexglue#scotus
    label: SCOTUS (issue areas)
    items: 1400
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
    evidence:
      - source: src-arxiv-2110-00976-v4
        quote: We opted to use SCDB to classify the court opinions in the available 14 issue areas
    notes: Single-label, 14 classes, on opinions split by date (test 1991-2016). New in LexGLUE.
  - id: lexglue#eur-lex
    label: EUR-LEX (EuroVoc concepts)
    items: 5000
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
    evidence:
      - source: src-arxiv-2110-00976-v4
        quote: We use the 100 most frequent concepts from level 2
      - source: src-github-hf-datasets-pr-5048
        quote: The current label list has all 127 labels, which leads to different (lower) results,
          as communicated by users.
    notes: Multi-label, 100 classes, on EU laws split by date (test 2012-2016). The Hugging Face
      copy used all 127 level-2 labels until 2022-09-30 (see versions).
  - id: lexglue#ledgar
    label: LEDGAR (contract provision topics)
    items: 10000
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
    evidence:
      - source: src-arxiv-2110-00976-v4
        quote: In LexGLUE, we use a subset of the original dataset with 80k contract provisions,
          considering only the 100 most frequent categories
    notes: Single-label, 100 classes, on SEC-filed contract provisions split by year (test 2019).
  - id: lexglue#unfair-tos
    label: UNFAIR-ToS (unfair contractual terms)
    items: 1607
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
    evidence:
      - source: src-arxiv-2110-00976-v4
        quote: The input to a model is a sentence, the output is the set of unfair types (if any).
    notes: Multi-label, 8 unfair-term types plus none, on sentences from 50 Terms of Service. Most
      sentences carry no label.
  - id: lexglue#casehold
    label: CaseHOLD (case holdings, multiple choice)
    items: 3900
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-reasoning
    evidence:
      - source: src-github-lex-glue-readme
        quote: The model must identify the correct (masked) holding statement from a selection of
          five choices.
      - source: src-hf-api-lex-glue

# data/benchmarks/society-econ-law/forecastbench.yaml
#
# P0-S8-T06. Scaffolded by `bench new benchmark` on 2026-09-27, then filled from the ForecastBench
# paper (arXiv 2409.19839v5, CC BY-SA 4.0) and its listing, Wayback captures of forecastbench.org's
# leaderboards and about pages and of the baseline leaderboard's data file (all 2026-09-26), and a
# capture of Metaculus's FutureEval page (2026-09-24). Every number carries a quote that the
# quote-substring validator checks against the Source's committed extract.
#
# What this entry is here to stress (14-roadmap Phase 0; 02 S12.8): a score that is not final when
# it is reported. Three real claims from the paper, all for one forecaster, carry the three
# resolution states:
#   resolved  claim-7112700f8bec, on the 7-day horizon -- every question at that horizon had resolved;
#   partial   claim-f821ad40ad06, on the 200-question set -- unresolved market questions are scored against
#             community aggregates, and the site's figures change nightly;
#   pending   claim-a5b7cacb31c0, on the 10-year horizon -- forecast in 2024, resolving in 2034, no value yet.
# Two human tiers, superforecasters and the general public, are Baseline records on both versions.
#
# The Wayback CDX API was down on 2026-09-27 (503) while replay and the availability API answered, so
# the web sources' archive fields are written here from the availability API's newest capture, with
# the digest computed from the fetched capture rather than read from CDX (each Source's notes).
#
# Premises in 02 S12.8 that did not survive the sources, each recorded where it bites:
#   1. data_provenance `real-world-instrument` (sensor recordings): the questions are generated from
#      templates over public time series and drawn from prediction platforms.
#   2. ceiling_anchor_type `expert-best`: the comparator is the superforecasters' MEDIAN forecast.
#   3. reproducibility `fully-automatable` with blocker `live-world-state`: the tier-3 rule forbids the
#      pair. Scoring is reproducible from the published forecast and resolution sets; a forecasting run
#      cannot be repeated. Recorded as fully-automatable, the blocker in the note (curation.notes).
#   4. secondary domain causal-inference, capabilities context-integration and knowledge-recall fail
#      their own tests; taxonomy/capabilities.yaml itself marks forecastbench as not causal-reasoning.
#   5. independence_flags `no-known-conflict` is a statement about a search; not adopted.

id: forecastbench
name: ForecastBench
aliases:
  - 'ForecastBench: A Dynamic Benchmark of AI Forecasting Capabilities'
aliases_note: >
  Not Metaculus's FutureEval (the AI Forecasting Benchmark), a separate benchmark of AI forecasters on
  Metaculus questions, which 02 S12.8 marks as a sibling to catalogue separately. It is recorded in
  lineage_note, not merged here.
tagline: LLMs and humans forecast real future events; scores update as the questions resolve.
description: >
  A benchmark run by the Forecasting Research Institute in which language models, and groups of
  superforecasters and members of the public, give probabilities for questions about future events.
  Questions come from two kinds of source: dataset questions generated from public time series with
  fixed templates, each asked at eight horizons from 7 days to 10 years, and market questions drawn
  from prediction platforms. New rounds of questions are released regularly and the leaderboards are
  recomputed nightly as questions resolve, so a score is provisional until every question behind it
  has resolved. Scores are Brier scores, adjusted for question difficulty and shown since 2026 as a
  Brier Index (0-100%, higher is better). There are separate leaderboards for out-of-the-box models
  (baseline), for open submissions that may use tools and scaffolds (tournament), and for early
  dataset-only results (preliminary). Known weaknesses the sources name: human groups were last
  surveyed in July 2024, so later models are compared with them through a fixed-effects adjustment
  rather than on the same questions.
self_description:
  source: src-forecastbench-arxiv-abs
  quote: 'we introduce ForecastBench: a dynamic benchmark that evaluates the accuracy of ML systems on
    an automatically generated and regularly updated set of 1,000 forecasting questions.'
external_ids:
  arxiv: '2409.19839'
paper:
  title: 'ForecastBench: A Dynamic Benchmark of AI Forecasting Capabilities'
  arxiv: '2409.19839'
  version_read: v5
  source: src-forecastbench-arxiv-html
released: 2024-09-30
released_basis:
  reason: The arXiv v1 submission date, the earliest public release any source read here dates.
  source: src-forecastbench-arxiv-abs
  quote: '[v1] Mon, 30 Sep 2024 00:41:51 UTC'
release_venue: ICLR 2025 (per the paper's v5); the arXiv listing is the source read
release_venue_source: src-forecastbench-arxiv-abs

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/forecasting-prediction-markets
  primary_basis:
    reason: Probabilistic forecasts about future events that later resolve, the leaf's definition.
    source: src-forecastbench-about
    quote: We evaluate LLMs by regularly asking them to make probabilistic forecasts about future
      events, thereby creating a contamination-free benchmark.
  secondary: []
domain_considered_and_rejected:
  - term: reasoning-general/causal-inference
    reason: 02 S12.8 lists it. The leaf is "distinguishing causal from merely associational
      relationships, or reasoning about interventions"; the questions ask whether events occur, not
      what causes them or what an intervention would do.

capability:
  - probabilistic-forecasting
  - calibration-uncertainty
capability_basis:
  probabilistic-forecasting:
    reason: The inclusion test word for word, and taxonomy/capabilities.yaml names forecastbench as
      its example.
    source: src-forecastbench-arxiv-abs
    quote: ForecastBench is comprised solely of questions about future events that have no known
      answer at the time of submission.
  calibration-uncertainty:
    reason: The scoring function consumes the probability the forecaster emits; the Brier score
      penalises an over- or under-confident probability, not only a wrong direction.
    source: src-forecastbench-leaderboards
    quote: Performance on dataset and market questions is scored using the difficulty-adjusted Brier
      score
capability_considered_and_rejected:
  - term: context-integration
    reason: 02 S12.8 tags it. Some conditions supply freeze values, news or the crowd forecast, but
      the answer is not in them -- it does not exist yet -- so the exclusion "Do NOT tag this if the
      supplied material is decorative and the answer is obtainable without it" does not fit either
      way; the supplied context is a condition of a claim, not what is scored.
  - term: knowledge-recall
    reason: >
      02 S12.8 tags it. No answer can be "answered from information the system brought with it": the
      outcome does not exist at submission.
  - term: causal-reasoning
    reason: taxonomy/capabilities.yaml lists forecastbench as the term's non-qualifying example.

evaluation_method:
  - prospective-resolution
  - statistical-fit
evaluation_method_basis:
  reason: >
    prospective-resolution because ground truth arrives after forecasts are locked, and claims carry
    a resolution status as the term asks (forecastbench is the term's example); statistical-fit
    because the number is a Brier score, the mean squared error of a probability against the
    outcome.
  source: src-forecastbench-arxiv-html
  quote: We resolve forecast sets nightly by gathering the latest information about which events
    have or have not occurred.
evaluation_method_considered_and_rejected:
  - term: uncertainty-calibration-score
    reason: The exclusion reads "do NOT tag it where the probability concerns a future event, which
      is `prospective-resolution`", and the taxonomy names forecastbench as the non-qualifying case.

designed_for_subjects:
  - instruction-tuned-model
  - reasoning-model
  - agent-scaffold
  - human-expert
  - human-nonexpert
designed_for_subjects_basis:
  reason: >
    The baseline leaderboard runs models out of the box, reasoning models among them at stated
    thinking budgets; the tournament leaderboard admits scaffolded, tool-using and ensembled systems;
    superforecasters and members of the public forecast the same questions and are ranked with the
    models.
  source: src-forecastbench-leaderboards
  quote: Teams may enhance models however they choose—with tools, added context, fine-tuning,
    ensembling, or other methods.

lifecycle: active
lifecycle_basis:
  reason: New rounds run and the leaderboards update nightly.
  source: src-forecastbench-about
  quote: New forecasting rounds occur every two weeks, with each round generating 500 questions
    split evenly between market and dataset questions.
activity: accepting-submissions
activity_basis:
  reason: The tournament leaderboard takes outside submissions.
  source: src-forecastbench-leaderboards
  quote: The tournament leaderboard captures the frontier of LLM forecasting ability and is open to
    external submissions.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude-3-5-Sonnet-20240620
    source: src-forecastbench-arxiv-html
    observed_on: 2026-09-27
    quote: Claude-3-5-Sonnet-20240620 Anthropic Freeze values Scratchpad 0.138 0.107 0.122
    note: The paper's best model on its human question set (Table 2); the system behind the three
      claims recorded for this entry.
evaluation_target: learned-system
evaluation_target_note: The benchmark is built to measure ML systems; the human groups forecast the
  same questions and appear on the leaderboard as comparison groups, recorded as Baseline records
  (baselines[]) rather than as the target.
execution_mode: automated
ground_truth_source: forecast-resolution
ground_truth_source_basis:
  reason: Dataset questions resolve to the series' later values, market questions to the platform's
    resolution.
  source: src-forecastbench-arxiv-html
  quote: All questions are ultimately resolved to ground truth.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Code, question sets and forecast sets are published, so a score can be recomputed; a
    forecasting run itself cannot be repeated, because the questions' future has since happened.
  source: src-forecastbench-about
  quote: we publicly provide our code, datasets (where licensing permits), and methodology to
    support reproducible research.

task:
  exists: true
  input:
    - a question set, released 24 hours before the forecast due date, with each question's
      background, resolution criteria and, for some conditions, freeze values
  output: A probability that each question resolves Yes; for a dataset question, one per horizon.
  scoring: >
    Brier score per forecast against the resolved outcome (unresolved market questions against the
    market's current crowd forecast); on today's leaderboards, difficulty-adjusted across question
    sets, averaged separately over dataset and market questions, the two averaged with equal weight
    and converted to a Brier Index.
  tests_hidden_from_system: true
  tests_hidden_from_system_note: Not hidden but non-existent at submission; the outcomes happen
    later.
  source: src-forecastbench-arxiv-html
  quote: For resolved market questions, forecasts are compared against ground truth while for
    unresolved market questions, they are compared to community aggregates.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Question sets, resolution sets and forecast sets are published as datasets.
    source: src-forecastbench-about
    quote: we publicly provide our code, datasets (where licensing permits), and methodology
  refresh: resolves-over-time
  refresh_note: >
    Also rolling: new rounds every two weeks add questions, so what a score is computed over depends on
    when it was read. resolves-over-time is chosen because it is the property that pairs with
    resolution_status.
  data_provenance:
    - synthetic-procedural
    - web-scraped
  data_provenance_basis:
    reason: >
      Dataset questions are generated from templates over public time series (synthetic-procedural);
      market questions are drawn from prediction platforms (web-scraped). 02 S12.8's
      real-world-instrument means sensor recordings, which none of these are.
    source: src-forecastbench-about
    quote: Dataset questions are automatically generated from real-world time series
  contamination_risk: low
  contamination_risk_note: >
    Low by construction: the outcome does not exist when the forecast is made. What is supplied can
    still carry information -- the crowd forecast on market questions, freeze values -- which is a
    condition of a claim, not contamination.
  contamination_evidence:
    - source: src-forecastbench-arxiv-abs
      stance: against
      quote: To avoid any possibility of data leakage, ForecastBench is comprised solely of
        questions about future events that have no known answer at the time of submission.
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_basis:
    reason: >
      The comparator is the superforecasters' median forecast, an aggregate of experts, not the best
      expert (02 S12.8 has expert-best). On the 2026-09-26 baseline leaderboard it still ranks first,
      above every model; the maintainers' own blog (2026-07-16, about page) says models have likely
      reached parity on the tournament board. The general public is the second tier.
    source: src-forecastbench-arxiv-html
    quote: Superforecaster median forecast ForecastBench – – 0.118 0.074 0.096
  size:
    n_items:
      value: 1000
      unit: questions in a round's LLM question set (the 2024 protocol)
      source: src-forecastbench-arxiv-abs
      quote: regularly updated set of 1,000 forecasting questions
    other_splits:
      - value: 200
        unit: questions in the human question set
        split: forecastbench#human-question-set
        source: src-forecastbench-arxiv-html
        quote: The human question set is comprised of 200 forecast questions sampled directly from
          the LLM question set.
      - value: 500
        unit: questions per round, split evenly between market and dataset questions
        split: rounds under the current protocol
        source: src-forecastbench-about
        quote: each round generating 500 questions split evenly between market and dataset questions
      - value: 8
        unit: forecast horizons per dataset question (7 days to 10 years)
        split: dataset questions
        source: src-forecastbench-about
        quote: we ask the same question with 8 different resolution dates, ranging from 7 days to 10
          years out.
  size_note: The 2024 paper's round has 1,000 questions; the current protocol (about page) has 500
    per round. Both are recorded, each under the version it describes.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Forecasting Research Institute
  maintainer_basis:
    reason: The about page names FRI as developer and maintainer and says what kind of organisation
      it is.
    source: src-forecastbench-about
    quote: ForecastBench is developed and maintained by the Forecasting Research Institute , a
      nonprofit research organization
  maintainer_type: nonprofit
  submission_process: maintainer-verified
  submission_process_note: >
    Teams submit forecast files; FRI resolves and scores them. As with WeatherBench 2, the maintainer
    computes the score from submitted predictions -- here against outcomes that arrive later -- which
    `maintainer-verified` ("checks a submitted result") understates.
  submission_process_source: src-forecastbench-arxiv-html
  submission_process_quote: As questions resolve, we rate the submissions of registered models and
    the human comparison groups, updating our public leaderboard.
  independence_flags: []
  independence_flags_note: >
    Deliberately empty rather than 02 S12.8's `no-known-conflict`, a statement about a search. FRI
    enters baseline forecasters of its own (the zero-shot and scratchpad runs of each model), which
    are prompts over others' models, not systems it develops. The funder is named and disclaims
    control: "The Forecasting Research Institute's funders exercise no editorial control or influence
    over our research methodology, findings, or conclusions." (src-forecastbench-about).
  known_limitation:
    source: src-forecastbench-leaderboards
    quote: Human comparison groups (highlighted in red) were last surveyed in July 2024 and
      therefore answered a different set of questions than models evaluated after that date.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: A run is one set of model calls per round; no source states its cost.
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: >
    For scoring: the question, resolution and forecast sets are public, so a score is recomputable. A
    forecasting run is not repeatable -- its questions' outcomes have since happened -- which is
    `live-world-state`, but tier 3 forbids that blocker beside fully-automatable (02 S12.8 sets both;
    curation.notes).
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: ForecastBench code (forecastingresearch/forecastbench), with its zero-shot and scratchpad
    prompts
  harness_source: src-forecastbench-leaderboards
  harness_quote: The zero shot and scratchpad prompts used for the models run by ForecastBench can
    be found on GitHub
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability: {}
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: Ranked by the Overall Brier Index, which weights dataset and market questions equally.
  source: src-forecastbench-leaderboards
  quote: Forecasters are then ranked by their Overall Brier Index, which is the equal-weighted
    average of their dataset and market difficulty-adjusted Brier scores, converted to Brier
    Indices.
headline_metric: forecastbench-brier-index
no_legitimate_aggregate: false

homepage: https://www.forecastbench.org/
repository: https://github.com/forecastingresearch/forecastbench
leaderboard_url: https://www.forecastbench.org/leaderboards/
license: CC BY-SA 4.0
license_notes: >
  The site's content and the paper are CC BY-SA 4.0. The code's licence is not read here (no
  archived copy of the repository); datasets are released "where licensing permits".

versions:
  - version: '2024'
    label: The paper's protocol, first rounds from July 2024
    version_kind: revision
    changes: 1,000-question LLM rounds with a 200-question human set; ranked by the overall Brier
      score, the mean of the dataset and market means.
    breaking: true
    superseded_by: 2025-10
    frozen: true
    sources:
      - src-forecastbench-arxiv-html
  - version: 2025-10
    label: The updated benchmark, tournament and baseline leaderboards
    version_kind: revision
    changes: >
      500-question rounds every two weeks, difficulty-adjusted Brier scores, separate tournament
      (open, tools allowed) and baseline (out of the box) leaderboards, and from 2026-03 the Brier Index
      scale. The about page dates the update: "We've released an updated version of ForecastBench."
      (2025-10-08).
    breaking: true
    supersedes_version: '2024'
    frozen: false
    sources:
      - src-forecastbench-about
      - src-forecastbench-leaderboards

subsets:
  - id: forecastbench#dataset
    label: Dataset questions
    scored_separately: true
    notes: Generated from public time series; eight horizons each.
  - id: forecastbench#market
    label: Market questions
    scored_separately: true
    notes: From prediction platforms; one forecast each, scored against the crowd forecast until the
      market resolves.
  - id: forecastbench#human-question-set
    label: The 200-question human question set (2024)
    items: 200
    scored_separately: true
    notes: The set superforecasters, the public and the paper's models all forecast; the paper's
      Table 2 scores it at the 7-, 30-, 90- and 180-day horizons.
  - id: forecastbench#horizon-7-day
    label: Human question set, 7-day horizon
    parent: forecastbench#human-question-set
    scored_separately: true
  - id: forecastbench#horizon-10-year
    label: Human question set, 10-year horizon
    parent: forecastbench#human-question-set
    scored_separately: true
    notes: Forecast in July 2024; resolves ten years after the due date. No score exists yet.
subsets_note: >
  The horizon subsets are the ones this entry's claims use; the other six horizons (30, 90, 180, 365,
  1,095 and 1,825 days) are subsets in the same sense and are not listed until a claim needs them.
metrics:
  - brier-score
  - forecastbench-brier-index
metrics_note: brier-score is the paper's (2024) scale and the claims'; forecastbench-brier-index is
  today's leaderboard scale, a transformation of the difficulty-adjusted Brier score.

baselines:
  - id: base-forecastbench-2024-superforecasters
    benchmark_version: forecastbench@2024
    kind: human-expert-average
    metric: brier-score
    value: 0.096
    population: superforecasters, as their median forecast
    is_primary: true
    source: src-forecastbench-arxiv-html
    notes: Overall Brier score on the human question set (Table 2); lower is better.
  - id: base-forecastbench-2024-public
    benchmark_version: forecastbench@2024
    kind: human-crowd-average
    metric: brier-score
    value: 0.121
    population: members of the general public, as their median forecast
    source: src-forecastbench-arxiv-html
    notes: Overall Brier score on the human question set (Table 2).
  - id: base-forecastbench-2025-10-superforecasters
    benchmark_version: forecastbench@2025-10
    kind: human-expert-average
    metric: forecastbench-brier-index
    value: 67.7
    population: superforecasters, as their median forecast (surveyed July 2024)
    is_primary: true
    source: src-forecastbench-baseline-data
    notes: Overall Brier Index on the baseline leaderboard as captured 2026-09-26, rank 1 there.
      Later models forecast other questions and are compared through the fixed-effects adjustment.
  - id: base-forecastbench-2025-10-public
    benchmark_version: forecastbench@2025-10
    kind: human-crowd-average
    metric: forecastbench-brier-index
    value: 62.6
    population: members of the general public, as their median forecast (surveyed July 2024)
    source: src-forecastbench-baseline-data
    notes: Overall Brier Index on the baseline leaderboard as captured 2026-09-26, rank 2 there.

lineage:
  role: root
lineage_note: >
  Metaculus's FutureEval measures AI forecasting on Metaculus's own questions ("FutureEval measures
  the ability of AI agents to predict future outcomes", src-metaculus-futureeval). It is a separate
  benchmark with no entry yet; add it as lineage.correlates_with when it is curated.

tags:
  - forecasting
  - superforecasters
  - resolution-status

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P0-S8-T06)
  added_on: 2026-09-27
  last_verified: 2026-09-27
  verification_status: ai-drafted-unverified
  sources:
    - src-forecastbench-arxiv-html
    - src-forecastbench-arxiv-abs
    - src-forecastbench-leaderboards
    - src-forecastbench-about
    - src-forecastbench-baseline-data
    - src-metaculus-futureeval
  sources_note: >
    The paper and listing carry the arXiv DOI and are not archived. The four web sources are Wayback
    captures (2026-09-24 to 2026-09-26); the extracts are built from the captures. The baseline
    leaderboard's rows live in a script file the page loads, which is the Source for the 2025-10
    baselines. The tournament leaderboard's data file has no capture, so no tournament figure is
    recorded.
  confidence: medium
  notes: |
    Reviewer checks:
    - Whether the resolution semantics are captured correctly (a human judgement, the task's verify):
      the three claims' states and the reasons in their notes, and resolved_as_of 2025-02-28 (v5).
    - ceiling_anchor_type expert-average for a median of superforecasters (02 S12.8: expert-best).
    - The reproducibility tier and the dropped live-world-state blocker (execution).

    Schema findings (none worked around here):
    1. EvalConditions has no field for the context a forecaster is given (freeze values, news, the
       crowd forecast), which the paper shows moves the score (Table 2); the claims state it in notes.
    2. resolution_window is undefined in 04 S8 and overlaps ResultClaim.resolved_as_of; the claims'
       conditions use it for the resolution cut-off a score was computed at.
    3. Tier 3 forbids live-world-state beside fully-automatable, but a benchmark can be reproducible
       in its scoring and unrepeatable in its runs; the tier has no way to say which it describes.
    4. Baseline has no subset field: the 2024 baselines are on the 200-question human set.
    5. A pending claim has no value but still needs a metric and conditions; nothing says when it is
       due to resolve (here 2034), which a reader of a pending claim most wants to know.

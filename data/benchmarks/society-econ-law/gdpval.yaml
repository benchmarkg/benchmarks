# data/benchmarks/society-econ-law/gdpval.yaml
#
# P1-S9-T06, society-econ-law entry 8. Promotes the Epoch stub data/benchmarks/_stubs/gdpval.yaml. Filled from the
# GDPval paper, arXiv 2510.04374 read as its v1 PDF (2025-10-05, the only arXiv version), and its abstract page;
# Hugging Face's API record of the ungated openai/gdpval dataset and its dataset-viewer info record (columns and row
# count; no row read); the script bundle that renders evals.openai.com, OpenAI's evaluation site, whose GDPval pages
# say the hosted leaderboard is no longer active and that the rubrics and gold deliverables are now open in place of
# the grading service; the authors' ICLR 2026 slides; Artificial Analysis's GDPval-AA v2.1 page, a third-party
# implementation on the 220 public tasks; and Epoch's benchmark export, which lists GDPval in its capabilities index.
# openai.com refuses scripted requests and was not fetched; the ICLR camera-ready copy (OpenReview, HTTP 403) was not
# read. Every quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: gdpval
name: GDPval
tagline: Real work from 44 occupations, graded blind by experts against a professional's
  deliverable; 220 of 1,320 tasks public.
description: >
  OpenAI's benchmark of knowledge work drawn from the occupations that earn most in the nine sectors contributing
  over 5% of US GDP. For 44 predominantly digital occupations, professionals with at least four years'
  experience (14 on average) each wrote tasks from their own work: a request, often with reference files
  (spreadsheets, slide decks, CAD files, photos, video, audio), and the deliverable they produced for
  it. Every task went through at least three rounds of expert review. The full set has 1,320 tasks, 30
  per occupation, which take an expert about seven hours on average; the gold subset has 220, five per
  occupation. A model is given the request and files and must produce the deliverable. Occupational experts
  then compare it blind with the professional's deliverable and rank them, and the headline is the win
  rate, the share of comparisons in which the model's work is graded better than or as good as the expert's
  (50% is parity). Grading one comparison took over an hour. The paper ran seven models, OpenAI's and
  other developers', on the gold subset, three samples each with three graders per sample; Claude Opus
  4.1, sampled through its consumer interface, led at 47.6%, while OpenAI's models ran through the API
  with web search and a code interpreter in OpenAI's container. An experimental automated grader built
  on GPT-5-high agreed with the experts 66% of the time against 71% between experts. Only the gold subset
  is public, on Hugging Face without a gate: prompts, reference files, the experts' deliverables and rubrics.
  The 1,320-task full set is not released. OpenAI has since withdrawn its hosted grading service and leaderboard,
  and points to Artificial Analysis's GDPval-AA, an LLM-judged Elo rating on the 220 tasks.
self_description:
  source: src-arxiv-2510-04374
  quote: We introduce GDPval, a benchmark evaluating AI model capabilities on real-world
    economically valuable tasks.
external_ids:
  huggingface: openai/gdpval
  arxiv: '2510.04374'
paper:
  title: 'GDPval: Evaluating AI Model Performance on Real-World Economically Valuable Tasks'
  arxiv: '2510.04374'
  doi: 10.48550/arXiv.2510.04374
  version_read: v1
  source: src-arxiv-2510-04374-v1
released: 2025-09-25
released_note: The day the gold subset appeared on Hugging Face, as its API record dates it, and the
  date OpenAI's evaluation site gives; it is the date Epoch's export and the stub carry. The paper
  followed on arXiv on 2025-10-05.
released_source: src-hf-api-openai-gdpval
released_quote: '"createdAt":"2025-09-25T09:33:23.000Z"'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/economically-valuable-work
  secondary: []
domain_basis:
  reason: The tasks are drawn from paid occupations chosen by their share of US wages and GDP, and
    the score is occupational experts' blind comparison of the model's deliverable with a
    professional's, which is the leaf's definition word for word. GDPval is the family's own first
    example.
  source: src-arxiv-2510-04374
  quote: GDPval covers the majority of U.S. Bureau of Labor Statistics Work Activities for 44
    occupations across the top 9 sectors contributing to U.S. GDP (Gross Domestic Product).
domain_considered_and_rejected:
  - term: agents-tooluse/long-horizon-autonomy
    reason: The tasks take an expert about seven hours and OpenAI's models worked in a container
      with tools, but what is scored is the economic value of the deliverable, not autonomous
      operation, which the family's exclusion sends here; the paper calls the tasks one-shot and
      fully specified.
    source: src-arxiv-2510-04374-v1
    quote: Tasks are precisely-specified and one-shot, not interactive
  - term: agents-tooluse/computer-use-gui
    reason: The paper lists computer use among the tasks' demands, but no interface is operated or
      scored; the deliverable files are what experts judge.
  - term: multimodal/any-to-any-generation
    reason: Reference files and deliverables span many formats (slides, spreadsheets, CAD, video),
      but the formats are the material of the work, not the scored subject.
  - term: general-intelligence/human-comparison-batteries
    reason: Each task compares the model with the one professional who wrote it, inside one
      occupational protocol; it is not a battery of tests normed on people.

capability:
  - context-integration
capability_basis:
  context-integration:
    reason: The request and its reference files supply what the deliverable must be built from, and
      the paper shows win rates fall when that context is cut (its under-contextualised variant, run
      on an earlier version of the gold subset).
    source: src-arxiv-2510-04374-v1
    quote: Each task also requires parsing through up to 17 reference files in the gold subset, and
      38 in the full set.
capability_considered_and_rejected:
  - term: autonomy
    reason: The taxonomy makes GDPval autonomy's near miss. The tasks are long, but the source calls
      them one-shot and claims no autonomy; the score is the quality of the work product.
    source: src-arxiv-2510-04374-v1
    quote: Tasks are precisely-specified and one-shot, not interactive
  - term: instruction-following
    reason: Instruction-following failures are the commonest reason experts preferred the human
      deliverable, but that comes from clustering graders' justifications; the score is an overall
      preference, not a check of stated directions.
  - term: long-horizon-execution
    reason: Seven expert hours per task on average, but no source shows the model's run is long or
      that early errors cannot be recovered; the model produces one deliverable.
    source: src-arxiv-2510-04374-v1
    quote: Tasks require an average of 7 hours of work for an expert professional to complete.
  - term: tool-use
    reason: OpenAI's models had web search and a code interpreter, but the tools are the
      maintainer's sampling setup, not part of the task, and no score depends on how they were used.
    source: src-arxiv-2510-04374-v1
    quote: For the OpenAI models, we enabled the web search tool and the code interpreter tool, with
      background sampling.
  - term: generation-fidelity
    reason: The comparison is a preference for the better piece of work, not a measure of how
      faithfully the output matches the expert's deliverable; a different deliverable can win.

evaluation_method:
  - human-expert-eval
  - model-graded-judge
evaluation_method_note: Experts from the task's occupation see the request and reference files and
  rank two or more unlabelled deliverables, one of them the professional's, with a written
  justification; the score per comparison is better, as good or worse, and the paper's plots use
  three samples per model with three graders each (nine comparisons per task). The automated grader,
  "based on GPT-5-high" with no version string, was trained to make the same pairwise call, cannot
  grade 12 of the 220 tasks, and was offered as a hosted service; OpenAI's site now says to run
  one's own grading and calls pairwise human expert preferences the standard, with an LLM judge on
  the released rubrics as a rough estimate.
evaluation_method_basis:
  reason: The headline win rates come from the experts' pairwise rankings; the judge model is the
    release's secondary, experimental grading path.
  source: src-arxiv-2510-04374-v1
  quote: To grade the 220 open-sourced gold subset, we conducted blinded expert pairwise
    comparisons, where experts in the relevant occupation were presented with a request and
    reference files and asked to rank two or more unlabeled work deliverables.
evaluation_method_considered_and_rejected:
  - term: pairwise-preference-elo
    reason: The comparisons are pairwise, but the score is a win rate against one fixed opponent,
      the expert's deliverable, which the term's exclusion names; GDPval-AA's Elo is its own
      (lineage).
    source: src-arxiv-2510-04374-v1
    quote: Model win rate w is how often the model deliverable is rated better than the human
      deliverable by the human expert grader.
  - term: human-distribution-percentile
    reason: The taxonomy makes GDPval this term's near miss; the comparator is a single expert's
      deliverable, not a measured distribution of people.
  - term: human-crowd-eval
    reason: The graders are recruited occupational experts, not a crowd.
  - term: rubric-graded
    reason: The dataset now carries rubric columns, and the site suggests an LLM judge on them, but
      the paper's protocol is a holistic preference; no source read says how the rubrics were
      written or used.
    source: src-hf-datasets-server-gdpval-info
    quote: '"rubric_pretty":{"dtype":"string","_type":"Value"},"rubric_json":{"dtype":"string","_type":"Value"}'
designed_for_subjects:
  - model-in-benchmark-harness
  - full-product-pipeline
designed_for_subjects_basis:
  reason: The maintainer, not an entrant, supplies the setup and the rows name only the model.
    OpenAI's models ran through the API inside OpenAI's container, with its preinstalled packages,
    tools and an elicitation prompt; Claude was sampled through its shipped consumer interface. One
    comparison mixes the two kinds of subject, and the setup for Gemini and Grok is not described.
  source: src-arxiv-2510-04374-v1
  quote: We sampled Claude via the UI to enable the maximum GDPval-relevant features.
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: No entrant brings a loop. The best-of-N and prompt-tuning runs are the maintainer's own
      experiments on GPT-5.
    source: src-arxiv-2510-04374-v1
    quote: performing best-of-N sampling with N=4 and a GPT-5 judge
  - term: human-expert
    reason: The professionals' deliverables are the fixed comparator in every comparison, not ranked
      entrants.
  - term: human-ai-team
    reason: The speed and cost scenarios model an expert reviewing and fixing model output, but they
      are computed from win rates and timings; no joint human-model entrant is graded.
as_used:
  - protocol: GDPval-AA v2.1, Artificial Analysis's own run of the 220 public tasks. Models work in
      its Stirrup agent harness with shell access and web browsing; an LLM judge picks the better of
      two anonymised model submissions, and the results are fitted to an Elo rating per model.
    split: the gold subset (220)
    source: src-artificialanalysis-gdpval-aa
    quote: GDPval-AA v2.1 uses 220 tasks developed by OpenAI in collaboration with industry
      professionals to reflect real-world complexity.
    note: Model-versus-model rather than model-versus-expert, and judged by a model, so its numbers
      are not win rates against the professionals and are not comparable with the paper's. Recorded
      as a fork under lineage.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the gold subset. Epoch's September 2026 export counts GDPval
    in its capabilities index, Artificial Analysis rates models released up to September 2026 on its
    220 tasks, and the authors' ICLR 2026 slides report updated results (top model about 74% wins
    and ties).
  source: src-epoch-benchmark-data
  quote: GDPval,True,gdpval_external.csv,Win Rate (%),1.0,0.0,1.0,2025-09-25
activity: closed
activity_note: OpenAI's site took grading requests for the automated grader and hosted a GDPval
  leaderboard; both have stopped, undated, and the leaderboard page points to Artificial Analysis.
  Whether outsiders could enter that leaderboard was not read (see review_checks). Anyone can still
  run the public tasks and grade them.
activity_basis:
  reason: A results route the maintainer ran has formally stopped.
  source: src-openai-evals-site-bundle
  quote: The OpenAI-hosted GDPval leaderboard is no longer active.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude Opus 4.1, sampled through its consumer interface
    source: src-arxiv-2510-04374-v1
    observed_on: 2026-11-08
    quote: 47.6% of deliverables by Claude Opus 4.1 were graded as better than (wins) or as good as
      (ties) the human deliverable
evaluation_target: learned-system
execution_mode: panel
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: There is no answer key. Each verdict is an occupational expert's ranking of the model's
    deliverable against the professional's, and the paper averages over three graders per sample.
  source: src-arxiv-2510-04374-v1
  quote: we sampled each model 3 times for each prompt, and then had 3 different human graders grade
    each sample
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The 220 gold tasks are public with prompts, reference files, the professionals'
    deliverables and rubrics, so anyone can sample a model and run the comparison; the official
    score needs recruiting occupational experts at over an hour per comparison, and no sampling or
    grading code is released. The full set's 1,100 other tasks cannot be reproduced.
  source: src-openai-evals-site-bundle
  quote: Instead of submitting grading requests here, you can now run your own grading workflows.

task:
  exists: true
  input:
    - a request written by a professional in one of 44 occupations, such as a document, spreadsheet,
      slide deck or design to produce
    - up to 17 reference files in the gold subset (38 in the full set), across formats including
      spreadsheets, documents, slides, images, audio, video and CAD
  output: A deliverable, usually one or more files in the requested format with a short text.
  scoring: Occupational experts rank the model's deliverable against the professional's, blind, as
    better, as good or worse; the win rate is the share of comparisons won or tied (wins alone are
    also reported), over three samples and three graders each, with breakdowns by sector,
    occupation, file type and task length.
  source: src-arxiv-2510-04374-v1
  quote: 'Each GDPval task consists of two primary components: a request (often with reference files)
    and a deliverable (work product).'

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Public, on Hugging Face without a gate (openai/gdpval), is the 220-task gold subset,
    five tasks per occupation, with the prompts, reference files, the professionals' deliverables
    and rubrics. The paper and slides release the prompts and reference files; the deliverables and
    rubrics were added later (OpenAI's site, undated; the dataset was last modified on 2026-02-10).
    Withheld is the full set, 1,320 tasks with 30 per occupation, of which no source read offers any
    access; the paper says only that the gold subset is open-sourced and that the full set exists.
    Also not public are the experts' grades and justifications, the sampling code and the automated
    grader, which ran only as a hosted service and is withdrawn. The term's test is met because the
    paper's headline results are computed on the public gold subset, as
    taxonomy/data-properties.yaml's own example for gdpval says.
  access_basis:
    reason: The paper releases the gold subset only, and its headline figures are computed on it.
    source: src-arxiv-2510-04374-v1
    quote: We open-source the prompts and reference files in our 220-task gold subset.
  refresh: null
  refresh_note: The paper calls this the first version and promises later iterations, but nothing
    carries a version label. A pre-release "earlier version of the GDPval gold subset" was used for
    one experiment, and the deliverables and rubrics were added to the public set later without a
    dated announcement, while the grading service was withdrawn; whether that counts as a change to
    scoring (excluding static) or as a dated release (versioned-releases) is left to review.
  refresh_source: src-arxiv-2510-04374-v1
  refresh_quote: Our paper introduces the first version of GDPval, a benchmark evaluating AI model
    performance on real-world economically valuable tasks.
  data_provenance:
    - expert-authored
  data_provenance_note: Professionals with at least four years in the occupation (14 on average),
    screened by interview, background check, training and a quiz, wrote each task from their own
    work and produced the deliverable. OpenAI models screened each submission for relevance and
    complexity, and each task had five human reviews on average. The paper says names of private
    individuals in the tasks are fictitious and some images and videos show AI-generated people or
    people who gave permission.
  data_provenance_basis:
    reason: The tasks and deliverables are the work of practising professionals in the occupation.
    source: src-arxiv-2510-04374-v1
    quote: We recruited expert industry professionals to create realistic tasks based on their
      professional work experience.
  contamination_risk: medium
  contamination_risk_note: The gold subset's prompts and reference files have been public since
    September 2025 and its gold deliverables and rubrics since a later, undated release, so a route
    into training data is plausible; no source evidences one. The canary string in the dataset shows
    the maintainer treats leakage as a live route. The full set has not been released.
  contamination_risk_source: src-hf-api-openai-gdpval
  contamination_risk_quote: Canary gdpval:fdea
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_note: Scores are read against the professional's deliverable, and 50% wins
    plus ties is parity with it; the paper's "no upper limit" refers to replacing the baseline with
    stronger models later, not to the absence of a reference. The anchor is one expert per task, not
    an average over experts.
  ceiling_anchor_type_source: src-arxiv-2510-04374-v1
  ceiling_anchor_type_quote: Currently, we compare model outputs against a human expert baseline
  dataset_licence: null
  dataset_licence_note: The Hugging Face record carries no licence tag, the dataset card states
    none, and the dataset viewer's licence field is empty. The paper itself is CC-BY-4.0, which does
    not cover the data.
  dataset_licence_source: src-hf-datasets-server-gdpval-info
  dataset_licence_quote: '"license":""'
  size:
    - count: 1320
      unit: tasks (30 per occupation)
      subset: the full set, not released
      source: src-arxiv-2510-04374-v1
      quote: All 1,320 tasks in the full GDPval set went through an iterative review pipeline
    - count: 220
      unit: tasks (5 per occupation), with prompts, reference files, gold deliverables and rubrics
      subset: the gold subset, public, on which the paper's headline is computed
      source: src-hf-datasets-server-gdpval-info
      quote: '"num_examples":220'
    - count: 44
      unit: occupations in 9 sectors
      subset: both sets
      source: src-arxiv-2510-04374-v1
      quote: GDPval covers tasks from 9 sectors and 44 occupations that collectively earn $3T
        annually.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: OpenAI
  maintainer_basis:
    reason: OpenAI's authors wrote the paper, the dataset is in OpenAI's Hugging Face namespace, and
      OpenAI's evaluation site lists and once graded it.
    source: src-hf-api-openai-gdpval
    quote: '"author":"openai"'
  maintainer_type: industry-lab
  submission_process:
    - literature-only
  submission_process_note: OpenAI ran every model in the paper itself and selected them (seven
    models). The hosted leaderboard it later kept is no longer active, and the hosted grader
    returned a score privately; others now report in their own work or on third-party boards such as
    GDPval-AA, which the term's test does not count.
  submission_process_source: src-arxiv-2510-04374-v1
  submission_process_quote: We evaluated GPT-4o, o4-mini, o3, GPT-5, Claude Opus 4.1, Gemini 2.5
    Pro, and Grok 4 using blind pairwise comparisons by professional industry experts
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2510-04374-v1
      quote: Performance of OpenAI frontier models increased roughly linearly over time on the
        GDPval gold subset.
    - flag: grader-from-evaluated-party
      source: src-arxiv-2510-04374-v1
      quote: Our automated grader, based on GPT-5-high, shows lower correlation with human expert
        graders when assessing outputs from capable OpenAI models.
  independence_flags_note: OpenAI maintains the benchmark and ranks the models it calls its own
    ("OpenAI frontier models") beside other developers' in the paper. The experimental automated
    grader is built on GPT-5, one of the evaluated models, and the paper itself measures its weaker
    agreement on OpenAI outputs; it is not the headline's grading path, and the hosted service is
    withdrawn. Who employed or paid the human graders is not stated, so no flag rests on them. No
    source read says OpenAI sells evaluation, and none states that its ranked models are products it
    sells, so no further flag is set.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2510-04374-v1
    quote: OpenAI outputs often used em dashes, Claude outputs frequently adopted first-person
      phrasing, and Grok occasionally referred to itself as Grok.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: human-panel
  compute_tier_note: The cost is occupational experts' time, over an hour per comparison and nine
    comparisons per task in the paper's plots; sampling the models adds API spend and a container
    with the paper's package list.
  compute_tier_source: src-arxiv-2510-04374-v1
  compute_tier_quote: Constructing and running our evaluation is expensive, particularly with
    industry expert graders.
  reproducibility_tier: requires-human-raters
  reproducibility_tier_basis:
    reason: The official score is a pairwise human expert preference; an LLM judge gives only a
      rough estimate, in OpenAI's words.
    source: src-openai-evals-site-bundle
    quote: The standard for grading GDPval submissions is pairwise human expert preferences, but you
      can also run an LLM-based judge on the rubrics and deliverables to get a rough estimate of
      model performance.
  reproducibility_blockers:
    - human-raters
    - no-reference-implementation
  harness_availability: none
  harness_availability_note: No sampling or grading code is released. The paper gives the
    container's package list and the elicitation prompt in prose ("lightly edited to remove some
    specific details of our scaffolding setup"); the automated grader existed only as a hosted
    service and is withdrawn. The taxonomy gives gdpval as none's example.
  harness: null
  code_licence: null
  code_licence_note: No code is released.
  runnable_via:
    - none
  maintainer_rerun_policy: unstated

comparability:
  # The pairs (human-expert-eval, model-in-benchmark-harness) and (human-expert-eval, full-product-pipeline)
  # resolve to the fallback profile. Beyond it: the sampling setup (OpenAI's container and tools, or a shipped
  # product's interface), the reasoning effort (the paper shows it moves o3 and GPT-5), the elicitation prompt and
  # best-of-N selection (worth five points to GPT-5), the samples per task, and for automated grading the judge
  # and its version. The number of graders per sample has no EvalConditions field (review_checks).
  material_extra:
    - harness
    - tools_allowed
    - reasoning_effort
    - prompt_template_hash
    - n_samples
    - selection_strategy
    - judge_model
    - judge_model_version

aggregation_policy: official-aggregate
aggregation_policy_note: One win rate over the gold subset (wins and ties against the expert), with
  wins alone and breakdowns by sector, occupation, deliverable type and task length published beside
  it.
aggregation_policy_basis:
  reason: Experts' rankings are pooled into one headline win rate per model.
  source: src-arxiv-2510-04374-v1
  quote: which enabled us to compute our headline win rates for various models compared to the human
    expert completion

homepage: https://evals.openai.com/
dataset_url: https://huggingface.co/datasets/openai/gdpval
leaderboard_url: null
maintainer_url: https://openai.com/

subsets:
  - id: gdpval#gold-subset
    label: Gold subset
    items: 220
    scored_separately: true
    evidence:
      - source: src-arxiv-2510-04374-v1
        quote: with at least 30 tasks per occupation in the full set (and 5 tasks per occupation in
          the gold subset), across 44 occupations
    notes: The public set, and the one every published score is computed on. The full set (1,320) is
      the maintainer's and has no published score in any source read.

lineage:
  role: root
  role_note: GDPval-AA re-runs the 220 public tasks in Artificial Analysis's own harness, judges
    model against model with an LLM and reports Elo, so it is a separately maintained derivative by
    another maintainer; it has no record, and gdpval-aa is a proposed id, not an allocated one. The
    paper's under-contextualised GDPval (shortened prompts, an internal experiment on an earlier
    gold subset) was never released and is not a variant.
  forks:
    - id: gdpval-aa
      maintainer: Artificial Analysis
      source: src-artificialanalysis-gdpval-aa
      quote: GDPval-AA v2.1 is Artificial Analysis' evaluation framework for OpenAI's GDPval
        dataset.

history:
  - date: null
    event: channel-closed
    field: activity
    from: the OpenAI-hosted GDPval leaderboard on evals.openai.com
    source: src-openai-evals-site-bundle
    quote: The OpenAI-hosted GDPval leaderboard is no longer active.
    note: Undated. The page now refers readers to Artificial Analysis's GDPval-AA board.
  - date: null

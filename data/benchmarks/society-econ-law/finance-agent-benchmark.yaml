  2026-11-05), so their released fields are null. Item counts sum the three splits each page gives.

subsets_note: >
  Each version reports results per question category (nine in v1 and v1.1, a different nine in v2 and
  v2.1), but the categories change between versions, so they are not modelled as subsets.


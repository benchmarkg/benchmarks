# data/benchmarks/society-econ-law/biglaw-bench.yaml
#
# P1-S9-T06, society-econ-law entry 10. Filled from Harvey's posts on BigLaw Bench, read after harvey.ai's robots.txt
# with scripts and styles stripped: "Introducing BigLaw Bench" (2024-08-29), "BigLaw Bench Workflows: SPA Deal
# Points" (2024-09-26), "BigLaw Bench: Hallucinations" (2024-10-07), "BigLaw Bench – Retrieval" (2024-11-13),
# "Introducing BigLaw Bench: Arena" (2025-11-07), "Expanding BigLaw Bench" (2026-02-09), "Introducing BigLaw Bench:
# Global" (2026-02-18), "Introducing BigLaw Bench: Research" (2026-03-11), the Fable 5 product post (2026-06-09) and
# the Legal Agent Benchmark announcement (2026-05-06); the harveyai/biglaw-bench README at a pinned commit, with
# GitHub's API for dates, licence and the tree of sample files; and JudgmentBench (arXiv 2605.25240, read as its
# v4 PDF), which describes the full set and releases 30 of its tasks. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.
#
# There is no paper. Harvey keeps the 100 core tasks and scores every model itself, publishing results in its
# own posts, a six-task sample with rubrics on GitHub and, through JudgmentBench, 30 tasks. Harvey sells legal AI
# products, and its own systems are scored on the benchmark. The tracks added since (Workflows, Retrieval, Arena,
# Global, Research) are subsets; the releases that added them are versions. LAB, Harvey's open-source agent
# benchmark, is a separate benchmark and is not linked (lineage_note).

id: biglaw-bench
name: BigLaw Bench
aliases:
  - BLB
  - Big Law Bench
tagline: Harvey's private law-firm tasks, from memos to deal analysis, scored by lawyer-written
  rubrics.
description: >
  Harvey's benchmark of legal work of the kind billed at large law firms. Harvey's legal research team,
  attorneys from BigLaw firms, turned time entries into tasks, each a prompt with the public documents
  it needs (some need none), split into litigation and transactional work and by task type: drafting,
  corporate advising, filings analysis, case management, research, due diligence and others. Each task
  has its own rubric. Required points earn positive scores weighted by importance; hallucinations, extraneous
  material and similar failures lose points. The answer score is the net points over the points available,
  read as the share of a lawyer-quality work product the system completes, and a source score counts how
  many correct statements cite their document. The core set is 100 tasks. Harvey keeps it private and
  runs every evaluation, scoring foundation models beside its own systems; the full data is available
  only by contacting Harvey. Six sample tasks with rubrics are on GitHub, and a 2026 academic study released
  30 tasks with Harvey's permission. Later tracks added SPA deal-point extraction (Workflows), legal retrieval
  (Retrieval), lawyers' pairwise preferences rated by Elo (Arena), tasks for the UK, Australia and Spain
  (Global) and agentic US case-law research (Research). Harvey still reports core scores for new models
  in 2026, near 90% and above.
self_description:
  source: src-harvey-blog-introducing-biglaw-bench
  quote: a public-facing version of our internal dataset for evaluating large language models (LLMs)
    and model systems on complex legal tasks
paper: null
paper_note: There is no paper. The benchmark is defined by Harvey's posts and the repository README;
  JudgmentBench (arXiv 2605.25240) is a third party's paper built on 30 of its tasks.
released: 2024-08-29
released_note: The date of Harvey's announcement with the first public results. The repository was
  created on 2024-08-24 (GitHub API), before it.
released_source: src-harvey-blog-introducing-biglaw-bench
released_quote: Aug 29, 2024

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/legal-document
  primary_basis:
    reason: The core tasks are prompt and document pairs whose output is a legal work product (a
      memo, a client alert, board resolutions, an analysis of filings or transcripts), and the
      rubric scores that product's substance, structure and style. The Workflows and Retrieval
      tracks extract from and search legal documents. That is drafting, reviewing and extracting
      from legal documents, the leaf's definition.
    source: src-harvey-blog-introducing-biglaw-bench
    quote: By converting time entries into model-based tasks (prompt / document pairs), we are able
      to identify and evaluate how models can contribute to real, high-value legal work.
  secondary:
    - society-econ-law/legal-reasoning
    - society-econ-law/economically-valuable-work
  secondary_basis:
    reason: legal-reasoning because many rubric points check that the output applies a rule to the
      facts correctly, and Harvey reads score gains as better recall and application of legal
      principles; the Research track is legal research. economically-valuable-work because the tasks
      are converted from the time entries of billed legal work and the score is the share of a
      lawyer-quality work product completed. It is secondary because the score is a rubric's, not a
      comparison with a professional's own work product (review_checks).
    source: src-harvey-blog-introducing-biglaw-bench
    quote: 'In defining benchmark tasks, we draw on a familiar feature of the legal profession: the time
      entry.'
domain_considered_and_rejected:
  - term: agents-tooluse/research-agents
    reason: Only the Research track gives the model search tools, and Harvey says the core tasks
      need no multi-part or agentic workflow; the leaf is the Research subset's secondary instead.
    source: src-harvey-blog-introducing-biglaw-bench
    quote: tasks that we use to test fundamental model capabilities to solve problems involving
      reasoning about, analyzing, and discussing legal concepts and text without the need for
      multi-part or agentic workflows
  - term: general-intelligence/open-preference-arenas
    reason: Arena is one track, with Harvey's own lawyers voting on Harvey's tasks, not an open
      arena; it is the Arena subset's secondary.
capability:
  - context-integration
  - factual-precision
  - knowledge-recall
capability_basis:
  context-integration:
    reason: Most tasks supply the documents the answer rests on (trial exhibits, filings, precedent
      agreements), and rubric points check the particulars drawn from them, such as a termination
      fee.
    source: src-harvey-blog-introducing-biglaw-bench
    quote: constructed using publicly available documents to enable transparent evaluation under
      realistic conditions
  factual-precision:
    reason: Rubric points check asserted particulars one by one, every hallucination is a negative
      point, and the source score checks each substantive statement for an accurate citation.
    source: src-harvey-blog-introducing-biglaw-bench
    quote: Negative criteria, such as hallucinations, were assigned negative scores
  knowledge-recall:
    reason: Some tasks have no document, so their rubric points on the law (procedure, evidence,
      corporate rules) can only be met from what the model holds; Harvey reads the score gains as
      better recall of legal principles.
    source: src-arxiv-2605-25240-v4
    quote: All triplets have a prompt and a rubric, but some do not have a document as the
      associated legal task may not require one.
capability_considered_and_rejected:
  - term: instruction-following
    reason: Rubrics give structure and style points (a memo format, a professional tone) and
      penalise wrong tone or length, but these serve the work product; the score is not compliance
      with stated constraints.
    source: src-harvey-blog-introducing-biglaw-bench
    quote: They also penalize common LLM failure modes such as incorrect tone or length, irrelevant
      material, toxicity, and hallucinations.
  - term: tool-use
    reason: Only the Research track gives the model search tools; the core tasks need none.
  - term: deductive-reasoning
    reason: Legal analysis applies rules to facts, but the rules and their weight are not all in the
      item, which the term's inclusion test needs.

evaluation_method:
  - rubric-graded
  - exact-match
  - model-graded-judge
  - classification-metric
  - pairwise-preference-elo
  - human-expert-eval
evaluation_method_note: rubric-graded is the core benchmark's method, and Global and Research use
  rubric criteria too; no source says whether a lawyer or a model applies the core rubrics
  (review_checks). Workflows exact-matches normalised dates, numbers and booleans and uses a model,
  checked against attorneys, for text fields. Retrieval reports recall against lawyer-annotated
  relevant material. Arena fits Elo ratings to lawyers' pairwise votes. Hallucination rates (October
  2024) came from a model pipeline whose judgements a person reviewed, a measurement on some core
  tasks rather than a track.
evaluation_method_basis:
  reason: Each task's rubric names points individually, with weights and negative points, and they
    are combined into the answer score, which is rubric-graded's inclusion case.
  source: src-harvey-blog-introducing-biglaw-bench
  quote: Answer score is computed by taking the combination of these positive and negative points
    and dividing by the total number of positive points available for a task.
evaluation_method_considered_and_rejected:
  - term: expert-panel-assessment
    reason: Arena's lawyers vote pair by pair and the votes are fitted to ratings; no committee
      issues a collective judgement.
  - term: multiple-choice
    reason: Harvey built the benchmark against multiple-choice and one-size-fits-all grading; no
      task has options.
designed_for_subjects:
  - instruction-tuned-model
  - full-product-pipeline
  - tool-augmented-model
designed_for_subjects_basis:
  reason: Harvey prompts public foundation models directly with the task and its documents (ChatGPT,
    Claude, Gemini, then GPT-5-series, Claude and Gemini models) and scores its own shipped
    Assistant systems beside them; the Research track gives models search tools.
  source: src-harvey-blog-introducing-big-law-bench-research
  quote: Models must use tools to perform searches in order to identify relevant research context
    and provide a grounded, cited response.
designed_for_subjects_considered_and_rejected:
  - term: domain-specialist-model
    reason: Harvey's systems are built for law, but the term's disciplines are scientific, clinical
      and engineering fields, and the benchmark scores general models too.
  - term: retrieval-augmented-system
    reason: The Retrieval track scores retrieval systems (Harvey's, and embedding and reranking
      models) on recall alone, with no model answering; in the core tasks the documents are supplied
      identically to every system.
  - term: human-expert
    reason: Arena pits systems against humans, but no human score is published, and the core
      benchmark has no human entrant.
    source: src-harvey-blog-introducing-biglaw-bench-arena
    quote: competing against foundation models, internal prototypes, and even humans
as_used:
  - protocol: Harvey's sycophancy probe (2025), which reran tasks with expert-agreed answers under
      neutral and two interested framings and compared the predictions, rather than the scores.
    source: src-harvey-blog-expanding-big-law-bench
    quote: we looked at whether performance changed when we rephrased the BLB prompt
  - protocol: JudgmentBench (2026) takes 30 core tasks and has practising attorneys grade
      constructed outputs by the tasks' rubrics and by pairwise preference, to compare the two
      methods; it scores no model on BigLaw Bench.
    source: src-arxiv-2605-25240-v4
    quote: we sampled 30 tasks from the proprietary, full dataset and make them publicly available

lifecycle: active
lifecycle_basis:
  reason: Harvey still publishes core scores for newly released models, Fable 5 in June 2026 among
    them, beside its newer LAB scores, and a refreshed and expanded edition was announced in
    February 2026 (review_checks).
  source: src-harvey-blog-fable-5-now-available-in-harvey
  quote: In our internal evaluation using BigLaw Bench, Harvey's proprietary legal benchmark, Fable
    5 scored 93.4% overall
activity: no-submission-channel
activity_basis:
  reason: Harvey chooses and runs the systems and publishes scores in its own posts; the only route
    to the full data is contacting Harvey, which is not a channel for entering results.
  source: src-github-harveyai-biglaw-bench-readme
  quote: For access to the full dataset and additional resources, please contact Harvey directly.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Fable 5
    source: src-harvey-blog-fable-5-now-available-in-harvey
    observed_on: 2026-11-08
    quote: In our internal evaluation using BigLaw Bench, Harvey's proprietary legal benchmark,
      Fable 5 scored 93.4% overall
evaluation_target: learned-system
execution_mode: null
execution_mode_note: The core rubrics' grader is not named in any source read, so whether a run
  needs a person (human-in-loop) or is automated is unknown. Arena is human-graded throughout, and
  Workflows is automated.
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: The rubrics were written by Harvey's attorneys and reviewed by other legal experts; the
    grader applies them, it does not define them.
  source: src-arxiv-2605-25240-v4
  quote: Rubrics are task-specific and were developed by legal experts, then later reviewed by other
    legal experts.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: Only Harvey holds the full task set and rubrics, and the headline is its score over all of
    them; the six repository samples and JudgmentBench's 30 tasks are not the scored set, and no
    grading code is published.
  source: src-arxiv-2605-25240-v4
  quote: BigLaw Bench is a privately held (non-public) dataset compiled by Harvey [Harvey Team,
    2024] in 2024.

task:
  exists: true
  input:
    - a prompt converted from a lawyer's time entry, such as drafting a client alert on a court
      order or analysing precedent agreements for market terms
    - the public documents the task needs (filings, exhibits, transcripts, agreements), or none
  output: Free-text legal work product (a memo, an analysis, a draft, an outline), with any sources
    the model gives.
  scoring: Answer score is the sum of the rubric's positive points met and its negative points
    incurred (in the samples, -1 per hallucination and -0.5 per extraneous or misconstrued
    statement), over the positive points available. Source score is the share of the rubric's
    substantive points that need a source for which the model gives an accurate one. Results are
    averaged over tasks and split into litigation, transactional and task types.
  source: src-harvey-blog-introducing-biglaw-bench
  quote: 'Source score represents: What % of correct statements does the model support with an accurate
    source?'

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: >
    Public: Harvey's posts with methods and results, the harveyai/biglaw-bench repository's sample tasks
    with rubrics and documents (6 core tasks, 10 annotated SPAs and the deal-point schema, 30 retrieval
    queries, read from the GitHub tree), and 30 core tasks that JudgmentBench released with Harvey's permission.
    Withheld: the rest of the 100 core tasks and their rubrics, the full Workflows, Retrieval, Global
    and Research sets, the Arena tasks and votes, and any grading code. The full data is available only
    by contacting Harvey.
  access_basis:
    reason: The tasks behind the headline score stay with Harvey, which runs every evaluation
      itself, and access on request creates no public path, which the term's inclusion test covers.
      The public samples are not the scored set. proprietary-closed was weighed, since Harvey
      withholds the set commercially and calls it proprietary, but that term needs no access path at
      any tier, and here there is a contact route and a public sample.
    source: src-github-harveyai-biglaw-bench-readme
    quote: For access to the full dataset and additional resources, please contact Harvey directly.
  refresh: null
  refresh_note: Tracks were added in dated announcements (September and November 2024, November
    2025, February and March 2026), and in February 2026 Harvey announced a refreshed, more than
    fivefold larger BLB, but no version label pins which task set a later core score was measured
    on, and the set cannot be inspected, so neither static nor versioned-releases is shown.
  refresh_source: src-harvey-blog-expanding-big-law-bench
  refresh_quote: we will be updating and substantially expanding the public version of BLB
  data_provenance:
    - expert-authored
  data_provenance_note: Harvey's attorneys wrote the core tasks and rubrics over public documents;
    Global's tasks come from more than two dozen local practitioners recruited with Mercor and
    reviewed by Harvey, and Research's were built with Snorkel AI. Retrieval's queries were written
    by a mix of experts and AI systems, and the SPAs come from SEC filings.
  data_provenance_source: src-harvey-blog-introducing-biglaw-bench
  data_provenance_quote: Our benchmarks are conceptualized and designed by our legal research team,
    composed of attorneys with experience across a wide range of practice areas and BigLaw firms
  contamination_risk: medium
  contamination_risk_note: Most of the core set is unpublished, but the documents are public, six
    tasks with rubrics have been on GitHub since 2024, and 30 tasks were released in 2026, so part
    of the set can reach training data. No source assesses contamination, and no canary string was
    seen.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: The answer score is bounded at 100%, all positive points met with no
    negative ones, which Harvey reads as a complete lawyer-quality work product; no lawyer's own
    score on the rubrics is published.
  ceiling_anchor_type_source: src-harvey-blog-introducing-biglaw-bench
  ceiling_anchor_type_quote: Answer score is computed by taking the combination of these positive
    and negative points and dividing by the total number of positive points available for a task.
  dataset_licence: null
  dataset_licence_note: No licence is stated for the full set, and the repository has none (GitHub
    API, read 2026-11-08). JudgmentBench releases its annotations under MIT and says the 30 base
    tasks are used with permission from the rights holder.
  size:
    - count: 100
      unit: tasks (prompt, documents and rubric)
      subset: the core set, held by Harvey
      source: src-arxiv-2605-25240-v4
      quote: BigLaw Bench consists of 100 triplets.
    - count: 30
      unit: core tasks released by JudgmentBench (16 transactional, 14 litigation)
      subset: JudgmentBench's public sample
      source: src-arxiv-2605-25240-v4
      quote: the sample comprises 16 transactional tasks and 14 litigation tasks
  size_note: Harvey's own posts give no task counts. The 2024 post's shares of core tasks are
    multiples of 1/53 (transactional) and 1/47 (litigation), consistent with 100. The repository's
    samples (6 core tasks, 10 SPAs, 30 retrieval queries) were counted from the GitHub tree, not a
    quoted Source. Global is said to more than double the public-facing set, and the 2026 expansion
    to add over five times the data points, with no counts.
  languages:
    - en
    - es
  languages_note: The 2024 tasks are in English; Global's Spanish tasks are presented in
    translation, which implies Spanish originals.
  languages_source: src-harvey-blog-introducing-big-law-bench-global
  languages_quote: (Translated from original Spanish.)

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Harvey (Harvey AI Corporation)
  maintainer_basis:
    reason: Harvey's legal research team built the benchmark, Harvey holds the full set and the
      repository (harveyai on GitHub) and publishes every result on its blog.
    source: src-github-harveyai-biglaw-bench-readme
    quote: Developed by Harvey's legal research team
  maintainer_type: industry-lab
  maintainer_type_note: Harvey is a company selling legal AI software (its Assistant and Vault
    products are named in the posts). Mercor (Global) and Snorkel AI (Research) are named data
    partners, and the 2024 post names Vals AI as an industry partner it intends to work with.
  submission_process:
    - maintainer-run
  submission_process_note: Harvey selects the systems (public foundation models, often in early
    access before release, and its own Assistant variants), runs them and publishes scores in its
    posts and product announcements; it keeps no standing leaderboard page. Arena runs monthly on
    Harvey's major systems. Nobody else submits, which is why private-test-server access sits beside
    a maintainer-run process here.
  submission_process_source: src-harvey-blog-introducing-biglaw-bench-arena
  submission_process_quote: Major systems at Harvey run the Arena gauntlet monthly
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-harvey-blog-introducing-biglaw-bench
      quote: proprietary models significantly outperform publicly available LLMs
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2605-25240-v4
      quote: BigLaw Bench is a privately held (non-public) dataset compiled by Harvey [Harvey Team,
        2024] in 2024.
  independence_flags_note: Harvey sells legal AI products and scores its own systems on the
    benchmark beside the foundation models (its proprietary models in 2024, its SPA agent on
    Workflows, its retrieval system on Retrieval, its Assistant variants on Arena), and reports them
    ahead. It also uses the benchmark to choose which foundation models to ship in its products and
    works with the labs whose models it scores. Early access to unreleased models is not counted as
    funding. Whether results-published-only-in-vendor-document applies to Harvey's own rows is left
    to a reviewer (review_checks).
  independence_assessed: true
  known_limitation:
    source: src-harvey-blog-introducing-biglaw-bench
    quote: These prompts had a substantial negative impact on model performance

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: No source states the cost of a run; the systems are reached as hosted models
    and products.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only Harvey holds the scored tasks and rubrics, so nobody else can produce a headline
      score.
    source: src-github-harveyai-biglaw-bench-readme
    quote: For access to the full dataset and additional resources, please contact Harvey directly.
  reproducibility_blockers:
    - private-test-set
    - no-reference-implementation
  reproducibility_blockers_note: The repository holds sample data only, with no grading code or
    prompts for running models; the custom source-requesting prompts Harvey tried are not published.
  harness_availability: none
  harness_note: No harness or grading code is published; the repository is sample data (GitHub tree,
    read 2026-11-08).
  runnable_via:
    - none
  inspect_evals_id: null
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which track and task set (core, a JudgmentBench sample, Global, Research), the date,
  # because the core set was to be refreshed in 2026 with no version label, the rubric version, the grader, and the
  # prompt (Harvey found that asking for sources lowered answer scores). Arena ratings depend on the pool of systems
  # in that month's cycle.
  material_extra:
    - subset_used
    - date_evaluated
    - grading_rubric_ref
    - judge_model
    - prompt_template_hash
  rating_pool_required: true

aggregation_policy: official-aggregate
aggregation_policy_note: Harvey reports one overall answer score per system, with litigation,
  transactional and task-type breakdowns; source score is reported beside it, and each track has its
  own metric.
aggregation_policy_basis:
  reason: One percentage per model over all core tasks is the number Harvey quotes.
  source: src-harvey-blog-fable-5-now-available-in-harvey
  quote: In our internal evaluation using BigLaw Bench, Harvey's proprietary legal benchmark, Fable
    5 scored 93.4% overall

homepage: https://www.harvey.ai/blog/introducing-biglaw-bench
repository: https://github.com/harveyai/biglaw-bench


subsets:
  - id: biglaw-bench#core
    label: BigLaw Bench Core
    items: 100
    scored_separately: true
    evidence:
      - source: src-github-harveyai-biglaw-bench-readme
        quote: BigLaw Bench Core is a set of core tasks for benchmarking baseline legal
          problem-solving.
      - source: src-arxiv-2605-25240-v4
        quote: BigLaw Bench consists of 100 triplets.
      - source: src-harvey-blog-biglaw-bench-hallucinations
        quote: We deploy this system on the answers to a subset of BigLaw Bench tasks that require
          reasoning over multiple, long documents.
    notes: The headline. Litigation and transactional tasks, each split into eight or nine task
      types, scored by answer score and source score. Hallucination rates (sentences with a
      hallucinated claim over all sentences) were reported once, in October 2024, on the long
      multi-document tasks.
  - id: biglaw-bench#workflows-spa
    label: BigLaw Bench Workflows, SPA deal points
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
      secondary:
        - language/information-extraction
    evidence:
      - source: src-harvey-blog-biglaw-bench-workflows-spa-deal-points
        quote: The first dataset we are releasing is extracting deal points from Share Purchase
          Agreements (SPAs).
      - source: src-harvey-blog-biglaw-bench-workflows-spa-deal-points
        quote: Overall accuracy is computed as a straight average over the test set and all the
          individual fields.
      - source: src-harvey-blog-biglaw-bench-workflows-spa-deal-points
        quote: SPA agents are able to extract 98.47% of deal points correctly across diverse SPA
          documents.
    notes: Extraction of a schema of deal points from SPAs drawn from SEC filings, annotated by
      attorneys; accuracy averaged over documents and fields, with exact match for typed fields and
      a model judge for text. The test SPAs were not used to build Harvey's own agent, which scored
      98.47% against 66.04% to 72.27% for foundation models.
  - id: biglaw-bench#retrieval
    label: BigLaw Bench Retrieval
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
      secondary:
        - language/retrieval-qa
    evidence:
      - source: src-harvey-blog-biglaw-bench-retrieval
        quote: we are expanding BigLaw Bench to include retrieval-focused benchmarks over legal
          documents
      - source: src-harvey-blog-biglaw-bench-retrieval
        quote: In technical terms, this is equivalent to recall at a fixed token threshold.
    notes: Research datasets (case law, legislation, EUR-Lex, law firm memoranda) and document
      collections (merger agreements, SPAs, discovery emails), with queries written by experts and
      AI systems and relevant material annotated by Harvey's lawyers. It scores retrieval systems,
      not generation.
  - id: biglaw-bench#arena
    label: 'BigLaw Bench: Arena'
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-document
      secondary:
        - general-intelligence/open-preference-arenas
    evidence:
      - source: src-harvey-blog-introducing-biglaw-bench-arena
        quote: across hundreds of legal tasks drawn from our internal lawyers and client partners
      - source: src-harvey-blog-introducing-biglaw-bench-arena
        quote: Between three and ten lawyers will review any particular pair of outputs
      - source: src-harvey-blog-introducing-biglaw-bench-arena
        quote: First, we quantitatively combine the casted preference votes into Elo scores
    notes: Monthly cycles in which five to ten systems answer the same tasks and lawyers vote
      between pairs with written reasons, coded into preference drivers. The published example ranks
      anonymised Harvey Assistant variants against foundation models. Ratings depend on the cycle's
      pool.
  - id: biglaw-bench#global
    label: 'BigLaw Bench: Global'
    scored_separately: true
    evidence:
      - source: src-harvey-blog-introducing-big-law-bench-global
        quote: 'Our initial BLB: Global dataset more than doubles the size of our public-facing BLB benchmark,
          adding unique benchmarks for the UK, Australia, and Spain.'
      - source: src-harvey-blog-introducing-big-law-bench-global
        quote: Designed in collaboration with our data partners at Mercor
    notes: Six task categories (drafting, long-document analysis, document comparison, public
      research, multi-document analysis, extraction) for the UK, Australia and Spain, written by
      local practitioners and cross-reviewed by Harvey. No Global scores were published in the posts
      read.
  - id: biglaw-bench#research
    label: 'BigLaw Bench: Research'
    scored_separately: true
    domain_override:
      primary: society-econ-law/legal-reasoning
      secondary:
        - agents-tooluse/research-agents
    capability_override:
      - tool-use
      - factual-precision
    evidence:
      - source: src-harvey-blog-introducing-big-law-bench-research
        quote: Models must use tools to perform searches in order to identify relevant research
          context and provide a grounded, cited response.
      - source: src-harvey-blog-introducing-big-law-bench-research
        quote: we found that model answers become unhelpful once the model completes less than 60%
          of the required task criteria
      - source: src-harvey-blog-introducing-big-law-bench-research
        quote: Working with our data partner Snorkel AI
    notes: Hard US case-law research problems in some 15 practice areas, chosen because leading
      models failed them even with web search, scored on structured rubric criteria. No Research
      scores were published in the posts read. The override drops context-integration and
      knowledge-recall because the material is found by search, neither supplied in the prompt nor
      held by the model alone.
subsets_note: The tracks are parallel and scored separately by the same maintainer; each was added
  in a dated post (versions). Practice Areas, announced in February 2026, is not a subset because no
  post read describes or scores it. Items are given only for the core set.

lineage:
  role: root
lineage_note: >
  JudgmentBench (Stanford's LIFT lab with Snorkel AI and Harvey authors; arXiv 2605.25240) is a separately
  maintained benchmark built from 30 core tasks, and Harvey's Legal Agent Benchmark (LAB, May 2026) is
  a separate open-source agent benchmark that Harvey sets beside "our own earlier work on BigLaw Bench"
  (src-harvey-blog-introducing-harveys-legal-agent-benchmark). Neither has a record, so neither is linked
  as a fork or a successor here (review_checks).


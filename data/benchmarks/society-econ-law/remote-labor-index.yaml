# data/benchmarks/society-econ-law/remote-labor-index.yaml
#
# P1-S9-T06, society-econ-law entry 9. Promotes the Epoch stub data/benchmarks/_stubs/remote-labor-index.yaml.
# Filled from the Remote Labor Index paper, arXiv 2510.26787 read as its v1 PDF (2025-10-30, the only version), and
# its abstract page; Scale Labs' RLI leaderboard page on labs.scale.com, read after robots.txt with scripts and styles
# stripped (scale.com/research/rli is disallowed and was not fetched); CAIS's post "A Significant Increase in Digital
# Labor Automation" (2026-07-01) and the project page remotelabor.ai, both withheld from archiving for personal data;
# the README of centerforaisafety/rli_evaluation_platform at a pinned commit, with GitHub's API for licence and dates;
# Hugging Face's API record of the ungated cais/rli-public-set (no file downloaded); and Epoch's benchmark export,
# which lists the Remote Labor Index in its capabilities index. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: remote-labor-index
name: Remote Labor Index
aliases:
  - RLI
tagline: Agents attempt 240 real paid freelance projects; human evaluators judge whether a client
  would accept the work.
description: >
  A benchmark from the Center for AI Safety and Scale AI built from 240 end-to-end remote freelance projects,
  mostly sourced through Upwork from 358 freelancers who sold their past work samples, plus 33 permissioned
  examples of digital work found online. Each project is a brief, a directory of input files and the professional's
  own deliverable, with the time and price the professional reported (a mean of 28.9 hours; $143,991 in
  all). The projects span 23 Upwork categories, among them 3D and CAD, architecture, graphic and product
  design, video and animation, audio, game development and data visualisation, so deliverables come in
  dozens of file formats. An agent receives the brief and inputs, with a prompt listing the formats the
  evaluation platform can render, and works unattended. Trained evaluators compare its deliverable with
  the human one on a three-point scale, from the standpoint of a reasonable client, and the majority of
  three verdicts decides. The headline automation rate is the share of projects whose AI deliverable is
  judged at least as good as the professional's; the paper also fits an Elo rating from pairwise comparisons
  between agents and reports dollars earned and "autoflation". 230 projects are a private test set, which
  Scale Labs evaluates and ranks on its leaderboard; 10 projects and the evaluation platform are public.
  The best agent scored 2.5% at release; the board read here is topped at 21.25%.
self_description:
  source: src-arxiv-2510-26787
  quote: we introduce the Remote Labor Index (RLI), a broadly multi-sector benchmark comprising
    real-world, economically valuable projects designed to evaluate end-to-end agent performance in
    practical settings
external_ids:
  arxiv: '2510.26787'
paper:
  title: 'Remote Labor Index: Measuring AI Automation of Remote Work'
  arxiv: '2510.26787'
  doi: 10.48550/arXiv.2510.26787
  version_read: v1
  source: src-arxiv-2510-26787-v1
released: 2025-10-30
released_note: The paper's arXiv v1 date, as its abstract page dates it. The stub and Epoch's export
  carry 2025-10-29, the day GitHub's API gives for the creation of the evaluation platform's
  repository.
released_source: src-arxiv-2510-26787
released_quote: '[Submitted on 30 Oct 2025]'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/economically-valuable-work
  primary_basis:
    reason: The projects are real paid freelance work, each with the professional's own deliverable
      and its reported price, and the score is whether human evaluators judge the AI deliverable at
      least as good as that professional's, which is the leaf's definition (tasks from real paid
      occupations, scored by expert comparison against human work product). The taxonomy cites this
      benchmark as the family's example.
    source: src-arxiv-2510-26787-v1
    quote: 'Automation rate: The percentage of projects for which the AI deliverable is judged by human
      evaluators to complete the project at least as well as the human deliverable.'
  secondary:
    - agents-tooluse/long-horizon-autonomy
  secondary_basis:
    reason: Each project is an extended unattended episode (professionals report a mean of 28.9
      hours, and the 2026 setup allows an agent up to 24 hours of wall-clock time per project),
      carried out by an agent in a CLI or computer-use environment. It is secondary because what is
      scored is the deliverable's acceptability as commissioned work, not the operation (see
      domain_considered_and_rejected).
    source: src-safe-ai-blog-digital-labor-automation
    quote: Each project gets up to 24 hours of wall-clock time
domain_considered_and_rejected:
  - term: agents-tooluse/computer-use-gui
    reason: The family's near miss, OSWorld 2.0, is economically valuable computer work scored as
      autonomous operation of an interface. RLI does not score the operation at all. The protocol
      leaves the environment and agent architecture to the entrant (the paper ran CLI and
      computer-use scaffolds and integrated products side by side), the evaluators judge the
      deliverable rather than how it was produced, and the verdict is whether a reasonable client
      would accept it against a professional's paid work, which is the economic value of the output,
      the family's own discriminant. The paper sets itself against computer-use evaluations.
    source: src-arxiv-2510-26787-v1
    quote: revealing a stark gap between progress on computer use evaluations and the ability to
      perform real and economically valuable work
  - term: agents-tooluse/operating-system-tasks
    reason: The CLI scaffold (OpenHands) acts through a shell, and agents-tooluse was weighed as
      primary through its inclusion test (what an autonomous loop achieved, with the grader checking
      the result it returned). The grader here is not a check of a machine's end state or of a
      returned result against a goal but a client's acceptance judged against human work product,
      and the paper grounds the measure in economic transactions; the family is kept as a secondary
      through long-horizon-autonomy.
    source: src-arxiv-2510-26787-v1
    quote: In contrast to prior benchmarks, RLI measures the automation ability of AI agents on
      end-to-end projects sourced from real-world work in remote labor markets, thereby grounding
      the evaluation in actual economic transactions.
  - term: code/data-science-workflows
    reason: Some projects (data dashboards, web games) leave a program or analysis behind, but
      nothing is executed against tests; evaluators open the build in the platform and judge it as a
      client would. Back-end development and desktop and mobile development were excluded as
      categories.
  - term: society-econ-law/legal-document
    reason: Legal work is not the subject; most legal categories were excluded from collection.
    source: src-arxiv-2510-26787-v1
    quote: Most legal categories were excluded due to PII concerns.
  - term: multimodal/any-to-any-generation
    reason: Deliverables span images, audio, video, 3D and CAD files, but the score is the
      deliverable's acceptability as commissioned work, not a correspondence between modalities.
  - term: general-intelligence/agi-composite-suites
    reason: One protocol over one pool of freelance projects, not a battery aggregating
      heterogeneous benchmarks.

capability:
  - autonomy
  - context-integration
  - generation-fidelity
capability_basis:
  autonomy:
    reason: The agent works the project through unattended; the base prompt forbids questions, and
      the brief and inputs are cleaned so that no further information is needed. Projects needing
      interaction with a client were excluded.
    source: src-arxiv-2510-26787-v1
    quote: Read the brief attached and create only the deliverables described. Do not ask any
      questions.
  context-integration:
    reason: The professional who did the work supplies the brief and the input files (a voiceover to
      animate, a ring sketch to model, data to visualise), and a deliverable that ignores them fails
      the brief.
    source: src-arxiv-2510-26787-v1
    quote: This ensures the brief and input files contain sufficient information to complete the
      project.
  generation-fidelity:
    reason: The produced artifact is judged against a target, the brief and the professional's
      reference deliverable, by human judgement of whether it satisfies the brief as well as the
      reference does.
    source: src-arxiv-2510-26787-v1
    quote: Evaluators digest the project context (brief, input files, human deliverable) and compare
      the human and AI deliverables
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: Professionals take a mean of 28.9 hours per project, but no source shows that an
      intermediate error leaves full success unattainable; files can be regenerated and revised
      within the budget, and the 2026 setup adds a critic loop for revision.
    source: src-arxiv-2510-26787-v1
    quote: with a mean of 28.9 hours and median of 11.5 hours
  - term: tool-use
    reason: Agents are given image, speech and video generation tools and professional applications,
      but the verdict scores the deliverable, not whether tools were selected and used correctly.
  - term: self-correction
    reason: The paper names failure to verify and fix one's own work as a common failure, and the
      2026 setup runs a worker-critic loop, but the loop belongs to the scaffold and no score
      measures revision.
    source: src-arxiv-2510-26787-v1
    quote: many failures stem from AI agents being unable to verify the correctness of their work
      and fix mistakes
  - term: creativity-novelty
    reason: Many projects are design work, but the verdict asks whether the deliverable is as
      acceptable as the reference; departure from known solutions is not rewarded.
  - term: instruction-following
    reason: The brief's requirements are checked only as part of a holistic acceptability judgement,
      and the sources do not claim instruction following.
  - term: perception
    reason: Inputs include images, audio and drawings, but what is scored is the deliverable, not
      what was recovered from the signal.

evaluation_method:
  - human-expert-eval
evaluation_method_note: For the automation rate, an evaluator reads the brief, inputs and human
  deliverable, inspects the AI deliverable in the web platform for up to about 20 minutes, and rates
  it 1 (would not be accepted), 2 (accepted, as good as the reference) or 3 (better) with a written
  justification; the majority of three independent ratings decides, and a project counts as
  automated at 2 or 3. Inter-annotator agreement is 94.4%. The authors audited every positive
  verdict, and estimate a false-negative rate of at most 5.8%. The paper's Elo comes from a second
  protocol in which evaluators compare two AI deliverables on completion and quality (see
  evaluation_method_considered_and_rejected). In 2026 CAIS tested an agentic LLM judge and kept
  human evaluation.
evaluation_method_basis:
  reason: Human evaluators trained on the protocol rate each AI deliverable one by one, and their
    majority verdicts are the result.
  source: src-arxiv-2510-26787-v1
  quote: We use majority voting across three independent evaluations to determine the final
    judgment.
evaluation_method_considered_and_rejected:
  - term: human-crowd-eval
    reason: The paper describes its evaluators as trained workers and subject experts, and the
      leaderboard as trained experts; no qualification requirement is stated (see review_checks).
    source: src-arxiv-2510-26787-v1
    quote: Thus, all evaluations are performed manually by trained workers and subject experts.
  - term: pairwise-preference-elo
    reason: The paper fits a Bradley-Terry rating (called Elo, with the human baseline at 1,000)
      from pairwise comparisons of agents' deliverables, but the leaderboard and CAIS report only
      the automation rate, a win or tie against one fixed reference, which the term's exclusion
      covers.
    source: src-arxiv-2510-26787-v1
    quote: 'Elo: A score capturing the relative performance of different AI agents.'
  - term: rubric-graded
    reason: Per-project rubrics were tried and dropped for a holistic judgement.
    source: src-arxiv-2510-26787-v1
    quote: we found granular per-project rubrics were often insufficient for capturing project
      completion
  - term: model-graded-judge
    reason: No score comes from a model. The paper judges automated evaluation infeasible, and
      CAIS's 2026 agentic judge overstated the newest models' automation rates two to three times,
      so it was not adopted.
    source: src-safe-ai-blog-digital-labor-automation
    quote: That makes an automated grader useful for tracking relative progress, but not a
      substitute for human evaluation of absolute capability.
  - term: expert-panel-assessment
    reason: Evaluators rate deliverables individually into a leaderboard score; no committee issues
      a written assessment.
designed_for_subjects:
  - agent-scaffold
  - full-product-pipeline
designed_for_subjects_basis:
  reason: The protocol fixes no environment or agent architecture, and each result belongs to a
    model inside a chosen scaffold. The paper ran two shipped agents as delivered (ChatGPT agent,
    Manus) beside models in Scale AI's computer-use scaffold or OpenHands, the leaderboard keeps
    each agent's best environment, and the 2026 results run each model family in its developer's own
    coding agent with computer use added.
  source: src-arxiv-2510-26787-v1
  quote: We do not mandate a specific execution environment or agent architecture.
designed_for_subjects_considered_and_rejected:
  - term: model-in-benchmark-harness
    reason: No one loop is applied to every entrant; the scaffold differs by model and changed in
      2026, and board rows name products and scaffolds (Manus 1.5, claude-opus-4-6 (CoWork)).
    source: src-scale-labs-rli-leaderboard
    quote: The leaderboard reports the single best performance for each agent, regardless of
      environment.
  - term: hosted-inference-endpoint
    reason: Models are reached through their providers, but the entrant is the agent built around
      them, not the endpoint as served.
  - term: human-expert
    reason: The professionals' deliverables are the reference, fixed at 100% (and Elo 1,000); they
      are not scored as entrants.
    source: src-arxiv-2510-26787-v1
    quote: We canonicalize scores so that the human baseline Elo is fixed at 1,000.

lifecycle: active
lifecycle_basis:
  reason: Scale Labs' board ranks 21 agents and shows a row marked new; the newest row in its page
    data was added on 2026-10-22, and CAIS said in July 2026 it will keep adding major releases.
  source: src-scale-labs-rli-leaderboard
  quote: Gemini Argon 4 NEW 17.08
activity: accepting-submissions
activity_note: There is no submission server. CAIS's post names a Scale Labs contact for having a
  model evaluated, and Scale Labs then runs and scores it; the maintainers also add major releases
  on their own.
activity_basis:
  reason: A route for entering a system, by request to the evaluators, is open now.
  source: src-safe-ai-blog-digital-labor-automation
  quote: To have a model evaluated

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Opus 5.5
    source: src-scale-labs-rli-leaderboard
    observed_on: 2026-11-08
    quote: Performance Comparison 1 Opus 5.5 21.25
evaluation_target: learned-system
execution_mode: panel
execution_mode_note: Deliverables are generated automatically; every official score is produced by
  human evaluators.
ground_truth_source: expert-panel
ground_truth_source_basis:
  reason: The reference for each project is the deliverable a professional produced and was paid
    for, with the brief and inputs that professional supplied; trained evaluators apply it.
  source: src-arxiv-2510-26787-v1
  quote: For each project, the brief and input files are provided by the professional who produced
    the human deliverable.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The 230 projects behind every quantitative score are held by the maintainers, and scoring
    needs their trained evaluators; outsiders can only run the 10 public projects through the open
    platform, for qualitative evaluation.
  source: src-arxiv-2510-26787-v1
  quote: To protect PII and prevent benchmark contamination, we maintain a private test set of 230
    projects used for quantitative evaluation.

task:
  exists: true
  input:
    - a project brief written by the professional who did the work
    - a directory of input files (possibly empty)
    - an evaluation compatibility prompt listing the file formats the evaluation platform renders
  output: A directory of deliverable files in renderable formats (documents, images, audio, video,
    3D and CAD models, web builds).
  scoring: Each AI deliverable is rated 1, 2 or 3 against the human deliverable by three evaluators
    and the majority taken; the automation rate is the share of projects rated 2 or 3. Dollars
    earned sums the human price of the projects automated; autoflation is the fall in the cost of
    the whole bundle when each project is done by the cheapest acceptable method. The paper's Elo is
    fitted to pairwise agent comparisons.
  source: src-arxiv-2510-26787-v1
  quote: whether the deliverable would be accepted by a reasonable client as the commissioned work

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: Public are the paper; a public set of 10 projects (briefs, input files and human
    deliverables) on Hugging Face as cais/rli-public-set, ungated under Apache-2.0, with example AI
    deliverables from three agents in cais/rli-example-deliverables; and the code of the evaluation
    platform, which renders deliverables for human review. Withheld are the 230 projects behind
    every quantitative score, their human deliverables, the AI deliverables and verdicts on them,
    and Scale AI's computer-use scaffold. The stated reasons are personal data and contamination.
  access_basis:
    reason: The items behind the headline score never leave the maintainers, who run and score every
      agent themselves; the public 10 support qualitative evaluation only, which the term's
      inclusion test covers.
    source: src-arxiv-2510-26787-v1
    quote: To protect PII and prevent benchmark contamination, we maintain a private test set of 230
      projects used for quantitative evaluation.
  refresh: static
  refresh_note: The 240 projects and the evaluation protocol are those of the release. What changed
    in 2026 is elicitation, not content (industry scaffolds with computer use, 24 hours and a $50
    budget per project against the paper's one-hour session and $30 cap), and the board mixes rows
    from both setups (see review_checks).
  refresh_source: src-scale-labs-rli-leaderboard
  refresh_quote: Each of the 240 projects is a self-contained unit sourced directly from experienced
    freelance professionals.
  data_provenance:
    - expert-authored
  data_provenance_note: 207 projects came from freelancers hired through an Upwork job post per
    eligible category, who sold existing work samples ($15 to $200 each, mean $41); 7 from long-tail
    sourcing, including commissioned work; and 33 from digital work found online, used with its
    authors' permission and their stated time and price. 550 projects were collected and cleaned to
    240; clients' personal data was removed, faces blurred and company names and logos replaced with
    fakes. web-scraped was weighed for the 33 online examples and rejected, since they were chosen
    by hand and used with their authors' permission, with time and price supplied by them.
  data_provenance_basis:
    reason: Every brief, input set and reference deliverable is a working professional's own paid
      work.
    source: src-arxiv-2510-26787-v1
    quote: We recruited 358 freelancers with verified Upwork accounts and specialization in the
      target categories.
  data_provenance_source: src-arxiv-2510-26787-v1
  data_provenance_quote: We only include projects where authors gave permission and provided this
    timing and pricing information, yielding an additional 33 projects.
  contamination_risk: medium
  contamination_risk_note: >
    The scored 230 projects are not released and their descriptions are not searchable, which works against
    a training route. But some long-tail human deliverables exist online in part (the agents get a blocklist
    of those domains), the 10 public projects are downloadable, and running a hosted agent sends the private
    briefs to its provider (an inference; no source discusses it). No source evidences a route into training
    data.
  contamination_risk_source: src-arxiv-2510-26787-v1
  contamination_risk_quote: For the long-tail data, some human deliverables exist online, but not in
    a form that can be downloaded and presented as the full deliverable.
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_note: Scores are read against the professionals' own deliverables, which mark
    parity (100% automation rate, Elo 1,000); each was checked during cleaning to complete its
    project. measured-ceiling was the alternative reading of that check.
  ceiling_anchor_type_source: src-arxiv-2510-26787-v1
  ceiling_anchor_type_quote: 'Human deliverable completes the project: The gold-standard human deliverable
    successfully completes the project, such that a reasonable client would accept it as the commissioned
    work.'
  dataset_licence: Apache-2.0
  dataset_licence_note: The licence tag of the public set on Hugging Face only. No licence is stated
    for the private set, which is not distributed.
  dataset_licence_source: src-hf-api-cais-rli-public-set
  dataset_licence_quote: license:apache-2.0
  size:
    - count: 240
      unit: projects
      subset: the full benchmark
      source: src-arxiv-2510-26787-v1
      quote: The final dataset comprises 240 projects.
    - count: 230
      unit: projects
      subset: private test set, used for every quantitative score
      source: src-scale-labs-rli-leaderboard
      quote: 'Private Set: 230 projects are used for all quantitative leaderboard evaluation.'
    - count: 10
      unit: projects
      subset: public set
      source: src-hf-api-cais-rli-public-set
      quote: This dataset contains project folders organized by project ID (public_001 through
        public_010).
    - count: 23
      unit: Upwork work categories
      subset: the full benchmark
      source: src-arxiv-2510-26787-v1
      quote: our final dataset covers 23 categories of work
  size_note: The professionals report over 6,000 hours of work, and the projects' prices sum to
    $143,991.
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Center for AI Safety and Scale AI (Scale Labs)
  maintainer_basis:
    reason: The two organisations developed it together. CAIS holds the public set (the cais
      namespace on Hugging Face) and the evaluation platform's repository (centerforaisafety on
      GitHub); Scale Labs runs the manual evaluations and the leaderboard. No source says which
      holds the private set.
    source: src-safe-ai-blog-digital-labor-automation
    quote: RLI was jointly developed by the Center for AI Safety and Scale Labs
  maintainer_type: nonprofit
  maintainer_type_note: The term's test names the holder of the dataset and repository as
    distributed, here CAIS, and says a company running the leaderboard or the grading does not
    change it. industry-lab is the alternative if Scale AI holds the private set (see
    review_checks).
  maintainer_type_source: src-safe-ai-blog-digital-labor-automation
  maintainer_type_quote: CAIS is an AI safety non-profit.
  submission_process:
    - maintainer-run
  submission_process_note: The maintainers choose and run the agents, Scale Labs' evaluators score
    them, and the board publishes one automation rate per agent, its best environment, without a
    confidence interval. A developer can ask Scale Labs to have a model evaluated; no source says
    what it hands over.
  submission_process_source: src-safe-ai-blog-digital-labor-automation
  submission_process_quote: Our partners at Scale Labs run the manual evaluations for RLI.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-scale-labs-rli-leaderboard
      quote: 'Private Set: 230 projects are used for all quantitative leaderboard evaluation.'
  independence_flags_note: The maintainers hold the scored projects and produce every score. Scale
    AI, which runs the board and the evaluators, also built the computer-use scaffold used for GPT-5
    and Claude Sonnet 4.5 in the paper; neither maintainer has a ranked agent, so
    maintainer-competes-on-own-benchmark and grader-from-evaluated-party are not set. The 2026
    results run models in their developers' own coding agents (Claude Code, Codex CLI). No source
    read says whether Scale AI sells data or evaluation services to the developers it ranks, or
    whether any ranked developer funds the work, so evaluator-sells-evaluations and
    funded-by-evaluated-party are left unset (review_checks).
  independence_assessed: true
  evaluation_budget:
    source: src-safe-ai-blog-digital-labor-automation
    quote: $50 by default, and $150 for Fable 5
    comparability_consequence: >
      The generation budget is part of the result and differs by model and over time: a $30 cap and a
      one-hour session in the paper, $50 and up to 24 hours in 2026, and $150 for one model whose per-token
      price is higher. Board rows from different setups are not like-for-like.
  known_limitation:
    source: src-arxiv-2510-26787-v1
    quote: Thus, an AI obtaining 100% automation rate on RLI may still underperform humans on types
      of work that we do not evaluate.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: human-panel
  compute_tier_note: Generating deliverables is inference spend (a mean of $2.34 per project in the
    paper; in 2026 a Linux desktop VM with professional applications and an A100 GPU when a project
    needs one), but every official score needs two or three trained evaluators per project, at up to
    20 minutes each.
  compute_tier_source: src-scale-labs-rli-leaderboard
  compute_tier_quote: The benchmark relies entirely on rigorous manual evaluation by trained
    experts.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only the maintainers hold the 230 scored projects, and their evaluators produce the
      scores.
    source: src-arxiv-2510-26787-v1
    quote: To protect PII and prevent benchmark contamination, we maintain a private test set of 230
      projects used for quantitative evaluation.
  reproducibility_blockers:
    - private-test-set
    - human-raters
  reproducibility_blockers_note: The items, not only the labels, are private. Even on the public 10,
    a score needs recruited and trained human evaluators.
  harness_availability: reference-implementation-only
  harness: The RLI evaluation platform (centerforaisafety/rli_evaluation_platform), a web viewer
    that renders deliverables and generates AI-versus-human comparison links for evaluators. The
    generation scaffolds of the paper (Scale AI's computer-use agent, an augmented OpenHands) and of
    2026 are not released.
  harness_source: src-github-rli-evaluation-platform-readme
  harness_quote: A web-based platform for conducting qualitative evaluations of AI deliverables on
    the RLI public set.
  code_licence: null
  code_licence_note: GitHub's API reports no licence for centerforaisafety/rli_evaluation_platform
    (read 2026-11-08), although the paper calls the platform fully open-source; not a quoted Source.
  runnable_via:
    - custom
  runnable_via_note: Only the public set can be run, with any agent, and reviewed in the platform;
    no official score results.
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile ((human-expert-eval, agent-scaffold) and (human-expert-eval, full-product-pipeline)
  # have no profile): the scaffold and environment (CLI, computer use, an integrated product, a developer's coding
  # agent), the tools allowed (image, speech and video generators; 30-odd desktop applications in 2026), the
  # wall-clock limit (one hour, then 24), the dollar budget ($30, $50, $150), the reasoning effort, and the date,
  # because the elicitation changed in 2026 without a version label. subset_used is in the fallback.
  material_extra:
    - scaffold
    - harness
    - tools_allowed
    - wall_clock_hours
    - cost_usd
    - reasoning_effort
    - date_evaluated

aggregation_policy: official-aggregate
aggregation_policy_note: The board ranks by automation rate alone. The paper's Elo, dollars earned
  and autoflation are reported in the paper, not on the board.
aggregation_policy_basis:
  reason: One automation rate over the private set per agent is the headline, which CAIS keeps as
    its primary metric.
  source: src-scale-labs-rli-leaderboard
  quote: Score measures Automation Rate. There is no confidence interval for Automation Rate.

homepage: https://www.remotelabor.ai/
repository: https://github.com/centerforaisafety/rli_evaluation_platform
dataset_url: https://huggingface.co/datasets/cais/rli-public-set
leaderboard_url: https://labs.scale.com/leaderboard/rli

versions: []
versions_note: No source labels a version. The 2026 change of scaffolds, budgets and time limits is

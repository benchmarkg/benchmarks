# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T06)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2510-26787-v1
    - src-arxiv-2510-26787
    - src-scale-labs-rli-leaderboard
    - src-safe-ai-blog-digital-labor-automation
    - src-github-rli-evaluation-platform-readme
    - src-hf-api-cais-rli-public-set
    - src-remotelabor-ai-home
    - src-epoch-benchmark-data
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, its windows kept clear of the author block
    and the acknowledgements; its abstract page for the date and abstract; Scale Labs' leaderboard page
    with scripts stripped, so that its 21-row ranking is in the extract (the row dates come from its embedded
    page data, which is not); CAIS's July 2026 post and remotelabor.ai, both withheld from archiving because
    they carry a byline and contact address or a linked author list; the evaluation platform's README
    at a pinned commit; the public set's Hugging Face API record; and Epoch's benchmark export as evidence
    of current use. Not read: scale.com/research/rli (disallowed by robots.txt), the CAIS dashboard (script-rendered),
    the public set's files and the announcement on X.
  confidence: medium
  review_checks:
    - check: Family. RLI is the taxonomy's own example for society-econ-law, and OSWorld 2.0 its
        near miss in agents-tooluse. The entry reads RLI's scored quantity as the economic value of
        the output (a client's acceptance against a professional's paid deliverable), with
        long-horizon-autonomy secondary. A reviewer may weigh the agentic setup more and make
        agents-tooluse primary.
      field: domain
      source: src-safe-ai-blog-digital-labor-automation
      quote: at a quality a paying client would actually accept
    - check: The denominator. The paper and the board say the 230 private projects carry every
        quantitative score, but every published rate read here is a whole multiple of 1/240, not
        1/230 (21.25% is 51/240, 2.5% is 6/240, 0.83% is 2/240; our arithmetic, not a quoted
        figure). Whether the rates are computed over all 240 projects should be confirmed before any
        claim is stored.
      field: data.size
      source: src-arxiv-2510-26787-v1
      quote: AI agents perform near the floor on RLI, with the highest-performing agent achieving an
        automation rate of 2.5%.
    - check: Elicitation drift. The July 2026 results run Anthropic and OpenAI models in Claude Code
        and Codex CLI with computer use, up to 24 hours, $50 per project ($150 for one model) and a
        worker-critic loop; the release rows used Scale AI's computer-use scaffold or OpenHands, one
        hour and $30. The board mixes both with no label. The entry records this as conditions with
        versions empty; a reviewer may prefer a revision with version_kind.
      field: versions
      source: src-safe-ai-blog-digital-labor-automation
      quote: we have standardized on running each model in the strongest industry scaffold for its
        family, with only minor modifications
    - check: human-expert-eval rests on the paper's "trained workers and subject experts" and the
        board's "trained experts". No qualification requirement for evaluators is stated, and if
        most are trained generalists human-crowd-eval would apply.
      field: evaluation_method
      source: src-scale-labs-rli-leaderboard
      quote: All evaluations are therefore performed manually by trained experts using a specialized
        platform.
    - check: pairwise-preference-elo is rejected because the published headline is the automation
        rate. If the paper's Elo results (seven agents, human baseline 1,000) are catalogued, the
        method should be added with comparability.rating_pool_required.
      field: evaluation_method
      source: src-arxiv-2510-26787-v1
      quote: For each project, a deliverable from two different AIs is presented to human evaluators
    - check: maintainer_type nonprofit follows the term's holder rule (CAIS holds the public set and
        repository). No source says who holds the private 230 projects or the evaluator workforce's
        contracts; if Scale AI holds the private set, industry-lab is the better reading.
      field: governance.maintainer_type
    - check: Independence. No source read says whether Scale AI sells data or evaluation services to
        developers whose agents it ranks, or whether a ranked developer funds RLI.
        evaluator-sells-evaluations and funded-by-evaluated-party are unset pending a source; the
        board itself is Scale's.
      field: governance.independence_flags
      source: src-arxiv-2510-26787-v1
      quote: For models that support computer-use, we used a computer-use scaffold developed by
        Scale AI.
    - check: The paper gives two counts of eligible Upwork categories, 43 after filtering and 45 in
        its appendix; 23 categories survive in the final set either way.
      field: data.data_provenance
      source: src-arxiv-2510-26787-v1
      quote: This left us with 45 total Upwork categories to source projects from.
    - check: ceiling_anchor_type expert-average reads the professionals' deliverables as the parity
        reference. Each was checked during cleaning to complete its project, which could instead be
        read as a measured-ceiling (100% shown reachable).
      field: data.ceiling_anchor_type
    - check: The board's Cost Savings is defined as an average across projects; the paper's
        autoflation is the reduction in the cost of the whole bundle. The two may not be the same
        quantity. Grok 4, in the paper's table and in CAIS's 2026 chart, is absent from the board
        read here.
      field: aggregation_policy
      source: src-scale-labs-rli-leaderboard
      quote: 'Cost Savings: The percentage reduction in cost from using an AI agent, averaged across all
        projects.'
    - check: Withheld Sources. CAIS's post (an author byline and a named contact's e-mail address)
        and remotelabor.ai (every author with personal homepage and scholar links) were set to
        withheld; the lead should confirm, or archive them. The CAIS dashboard was not read.
      field: curation.sources
    - check: Epoch's export lists the Remote Labor Index with its Score column (its source for
        current use), and the stub's date, 2025-10-29, is a day before the arXiv v1 used for
        released.
      field: released
      source: src-epoch-benchmark-data
      quote: Remote Labor Index,True,rli_external.csv,Score,1.0,0.0,1.0,2025-10-29

        checked.
      field: data.size
      source: src-hf-obliqa-card
      quote: '- **Validation:** 2,888'
    - check: RePASs can be gamed. Concatenating the obligation sentences that its own classifier
        picks from the retrieved passages scored a perfect or near-perfect RePASs, above the
        experts' 0.8101. Whether the answer-generation subset should carry a validity warning, and
        whether expert-average is still the right anchor, is a reviewer's call.
      field: data.ceiling_anchor_type
      source: src-acl-2025-regnlp-1-8-pdf
      quote: this system achieves a perfect score, much higher than the score of human experts
    - check: The RePASs README has users fine-tune the LegalBERT obligation classifier themselves,
        so two reruns can score the same answers differently. Whether a released checkpoint exists
        (the paper links an ObligationClassifier repository, not read) decides whether
        fully-automatable should carry a caveat.
      field: execution.reproducibility_tier
      source: src-github-repass-readme
      quote: Run the training script to fine-tune LegalBERT on the provided dataset.
    - check: maintainer_type community-collective rests on the RegNLP organisation having no stated
        holder; academic-lab if MBZUAI holds it.
      field: governance.maintainer_type
    - check: Label quality. The maintainers' own ObliQA-MP paper says ObliQA relied on limited

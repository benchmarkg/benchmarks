    - check: The README lists policy analysis and impact assessment among the dataset's intended
        uses, but no ObliQA task scores the impact of a regulation; the leaf call rests on the
        regulatory questions alone, not on this line.
      field: domain.primary
      source: src-github-obliqa-readme

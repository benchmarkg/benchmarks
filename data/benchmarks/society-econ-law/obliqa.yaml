# data/benchmarks/society-econ-law/obliqa.yaml
#
# P1-S9-T06, society-econ-law entry 14. Filled from the RIRAG paper, arXiv 2409.05677 read as its v2 PDF
# (2024-12-02), and its abstract page; the RIRAG-2025 shared task's overview paper (RegNLP 2025 workshop at
# COLING 2025, ACL Anthology 2025.regnlp-1.1, PDF); the dataset repository's README pinned at its last commit
# (RegNLP/ObliQADataset, c1b2c3c); the RePASs scorer's README pinned at its last commit (RegNLP/RePASs,
# 821d438); Hugging Face's API record and dataset card of RegNLP/ObliQA, and the datasets-server size record of
# its splits; the ObliQA-MP paper (NLLP 2025, DOI 10.18653/v1/2025.nllp-1.10), the maintainers' multi-passage
# extension; and the AUEB-Archimedes system paper (ACL Anthology 2025.regnlp-1.8, PDF), another group's use.
# Every quote below is checked by the quote-substring validator against those Sources' committed extracts.
#
# Candidates weighed for the policy-analysis leaf: GPS-Bench (arXiv 2609.03553, policy-effect simulation; no
# data released, two months old, no outside use), POLIS-Bench (arXiv 2511.04705, bilingual government policy
# tasks; no data link), PolicyBench (arXiv 2604.12995, policy comprehension by Bloom level, which the family's
# exclusion reads as general comprehension on policy text). ObliQA was chosen for its open data, its quotable
# paper and a shared task in which 16 outside teams published systems.

id: obliqa
name: ObliQA
aliases:
  - Obligation-based Question-Answering Dataset
  - RIRAG
  - Regulatory Information Retrieval and Answer Generation
  - RIRAG-2025
tagline: Compliance questions over Abu Dhabi financial regulation, scored on passage retrieval and
  on obligation coverage.
description: >
  ObliQA is a question-answering dataset for regulatory compliance, and RIRAG the task defined on it.
  Its 27,869 questions were generated by GPT-4 Turbo from obligation-bearing passages of the 40 financial
  regulation documents of Abu Dhabi Global Market (ADGM), about 640k words, framed as the questions a
  compliance officer would ask the regulator, and filtered by an NLI model; each question is linked to
  one to six source passages. ADGM experts reviewed 991 questions and judged 86.91% of their passages
  relevant. The task has two subtasks: retrieving the relevant passages from the whole corpus, scored
  by Recall@10 (MAP@10 as a diagnostic), and writing an answer from the retrieved passages, scored by
  RePASs. RePASs is reference-free: NLI models score how far each answer sentence is entailed by, or contradicts,
  the retrieved passages, and a fine-tuned LegalBERT classifier finds the obligation sentences whose coverage
  is checked; the three parts combine to a number between 0 and 1. The data (train, development and test
  splits) is open on GitHub and Hugging Face. The RIRAG-2025 shared task at the RegNLP 2025 workshop (COLING
  2025) scored 19 teams on 446 further questions released without their passages, and a paper from one
  team showed that copying the retrieved obligations games RePASs.
self_description:
  source: src-arxiv-2409-05677-v2
  quote: 'ObliQA - Obligatory Question-Answer dataset: We develop a multi-document, multipassage QA dataset1
    specifically to facilitate research in RegNLP.'
external_ids:
  huggingface: RegNLP/ObliQA
  arxiv: '2409.05677'
paper:
  title: 'RIRAG: Regulatory Information Retrieval and Answer Generation'
  arxiv: '2409.05677'
  version_read: v2
  source: src-arxiv-2409-05677-v2
released: 2024-09-09
released_note: The paper's first arXiv version, as its abstract page dates it; v2, the version read,
  was posted on 2024-12-02. The RePASs README cites v1 under an earlier title ("RegNLP in Action").
  The repository was created on 2024-07-20 (GitHub API, not a quoted Source).
released_source: src-arxiv-2409-05677
released_quote: Submitted on 9 Sep 2024 (v1), last revised 2 Dec 2024 (this version, v2)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: society-econ-law/policy-analysis
  secondary:
    - language/retrieval-qa
domain_basis:
  reason: Every item is a regulatory question, what a regulated firm must do under a regulator's
    rules, and the answer is scored on whether it states all the applicable obligations without
    contradicting them, a measure the paper builds for regulatory compliance in place of general
    text-similarity metrics. The policy-analysis leaf names regulatory questions. Retrieval from the
    full corpus is half of the task and is scored on its own, the retrieval-qa leaf's case;
    FinanceBench takes the same pair with financial-analysis.
  source: src-arxiv-2409-05677-v2
  quote: Imagine you are preparing a list of questions that a compliance officer at a company would
    ask regulatory authorities like the ADGM to clarify their understanding of compliance
    requirements and to ensure adherence to regulatory standards.
domain_considered_and_rejected:
  - term: society-econ-law/legal-document
    reason: The paper calls regulatory documents semi-legal texts, and retrieving and restating
      obligations from them is extraction from a legal document. But the items are questions about
      what compliance requires, not a document to review or draft, and the scored quantity is the
      answer's obligation coverage (review_checks).
    source: src-arxiv-2409-05677-v2
    quote: Regulatory documents are formal semi-legal texts issued by governmental regulatory bodies
  - term: society-econ-law/legal-reasoning
    reason: No facts are given to which a rule is applied, and no determinate conclusion is scored;
      the answer restates the obligations the passages contain.
  - term: language/understanding
    reason: The family's exclusion of a general competence applied to domain text was weighed. The
      answer is not read off a supplied passage, the system must find the passages itself, and
      RePASs scores obligation coverage, which the paper calls specific to regulatory compliance.
    source: src-arxiv-2409-05677-v2
    quote: In contrast, RePASs is tailored specifically to regulatory compliance.
capability:
  - context-integration
  - generation-fidelity
capability_basis:
  context-integration:
    reason: The corpus that determines every answer is supplied, the retrieval subtask scores
      whether the right passages were found in it, and RePASs scores the answer against the passages
      the system retrieved.
    source: src-arxiv-2409-05677-v2
    quote: In the passage retrieval subtask, the system retrieves all relevant obligations from
      regulatory documents in response to a given question.
  generation-fidelity:
    reason: RePASs compares the generated answer with its source passages, whose content it must
      preserve, sentence by sentence for entailment and contradiction and obligation by obligation
      for coverage.
    source: src-arxiv-2409-05677-v2
    quote: The answer must cover all the obligations present in the source passages
capability_considered_and_rejected:
  - term: factual-precision
    reason: RePASs checks answer sentences one by one, but by NLI entailment against the retrieved
      passages, not asserted particulars (names, numbers, dates, citations) against a reference.
  - term: knowledge-recall
    reason: The protocol supplies the corpus and grounds the answer in retrieved passages; no item
      is meant to be answered from memory.
  - term: deductive-reasoning
    reason: The answer synthesises obligations stated in the passages; nothing is derived from
      premises and checked for validity.

evaluation_method:
  - classification-metric
  - model-derived-metric
evaluation_method_basis:
  reason: Retrieval is scored by Recall@10, with MAP@10 for diagnosis, statistics of the ranking
    against each question's linked passages. Answer generation is scored by RePASs, which released
    scoring models produce, an NLI cross-encoder for entailment and contradiction and a LegalBERT
    classifier, fine-tuned on GPT-4-labelled sentences, for obligations. The two subtasks are
    reported apart.
  source: src-arxiv-2409-05677-v2
  quote: we use recall@10 as the main evaluation metric
evaluation_method_considered_and_rejected:
  - term: reference-metric
    reason: The paper reports BLEU, ROUGE, BERTScore and others on its gold-standard answers only to
      argue that they miss obligation coverage, and RePASs is reference-free.
    source: src-arxiv-2409-05677-v2
    quote: We propose a reference-free evaluation metric, RePASs, to evaluate generated answers in
      regulatory compliance contexts.
  - term: composite
    reason: RePASs adds three components (entailment minus contradiction plus coverage, rescaled),
      but all three come from released scoring models, one method, which the term's exclusion leaves
      out; retrieval and generation are never combined into one number.
    source: src-arxiv-2409-05677-v2
    quote: The score penalizes contradictions and normalizes the result between 0 and 1.
  - term: model-graded-judge
    reason: No general-purpose model is prompted for a verdict; the scorers are fixed NLI models and
      a fine-tuned classifier.
designed_for_subjects:
  - retrieval-augmented-system
  - classical-algorithm
designed_for_subjects_note: >
  retrieval-augmented-system: the entrant retrieves from the corpus itself and generates from what it
  retrieved, so a change to its index changes both scores. classical-algorithm: BM25, with no learned
  component, is a scored retrieval row in the paper and in the shared task's baseline.
designed_for_subjects_basis:
  reason: The task's systems are retrieval-augmented pipelines; the paper's baseline fuses BM25 or a
    neural retriever with document ranking and passes the filtered passages to GPT-4 Turbo, and
    RePASs is computed against the passages the system itself retrieved.
  source: src-arxiv-2409-05677-v2
  quote: Based on these filtered passages, we use the gpt-4-turbo-1106 model to generate
    comprehensive answers.
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: Its exclusion applies in substance; the generator is never given the passages by the
      protocol, so retrieval sits inside what is scored.
  - term: task-specific-supervised-model
    reason: The 22,295-question training split lets entrants fine-tune retrievers, and shared-task
      teams did (observed_subjects), but a fine-tuned retriever is one component of a
      retrieval-augmented entrant.
  - term: tool-augmented-model
    reason: Retrieval is a built-in stage of the pipeline, not a tool the model chooses to call.
observed_subjects:
  values:
    - retrieval-augmented-system
    - classical-algorithm
  basis: >
    The shared task's 16 reporting teams all entered retrieval-augmented pipelines, most built on BM25
    beside dense retrievers, several fine-tuned on the training split, with generators from Llama, Qwen,
    Gemma and Mistral models to GPT-4o and Gemini 1.5 Pro (Tables 1 and 2 of the overview).
  source: src-acl-2025-regnlp-1-1-pdf
as_used:
  - protocol: The RIRAG-2025 shared task scored submitted runs on 446 unseen questions released
      without their ground-truth passages; retrieval runs were submitted in TREC format and answers
      as JSON, at most three submissions per team, and the organisers computed Recall@10, MAP@10 and
      RePASs.
    split: RIRAG-2025 hidden set (446 questions)
    source: src-acl-2025-regnlp-1-1-pdf
    quote: These questions were provided without access to their associated ground
    note: Teams that could not be scored are reported in the overview's Table 3 with their own
      test-split numbers, so the table mixes the two sets.
  - protocol: AUEB-Archimedes (Athens University of Economics and Business) fuses BM25 with two
      domain-specific embedding retrievers and a reranker, tuned on the public test split, and
      enters three answer generators, one of which concatenates the obligation sentences that
      RePASs's own classifier extracts from the retrieved passages.
    split: test, and the RIRAG-2025 hidden set
    source: src-acl-2025-regnlp-1-8-pdf
    quote: which ranked 4th in the retrieval subtask, achieving 69.4 Recall@10, and 59.4 MAP@10 on
      the hidden test set
    note: COLING 2025 workshop paper (January 2025). Its adversarial system's RePASs is not a
      measure of answer quality (data.contamination_risk_note, governance.known_limitation).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on it. The maintainers re-published ObliQA on Hugging Face in
    February 2026 as the first tier of a two-tier benchmark suite, after building their stricter
    ObliQA-MP on it (November 2025); 16 outside teams published systems on it in January 2025.
  source: src-hf-obliqa-card
  quote: ObliQA is the **Stage 1 / Tier 1** dataset in the **Synthetic Compliance for Regulatory
    RAG** benchmark suite.
activity: closed
activity_note: The shared task was the only route by which the maintainers scored outside systems;
  its submissions were due in November 2024 (the shared task's README, not a quoted Source because
  it carries a contact address). No second round is announced in the sources read. Results otherwise
  appear in papers, scored by their authors on the public test split.
activity_basis:
  reason: The route existed for one round, organised for the RegNLP 2025 workshop at COLING 2025,
    and has closed.
  source: src-acl-2025-regnlp-1-1-pdf
  quote: The task was organized in time for COLING 2025

events:
  - name: RIRAG-2025 shared task (RegNLP 2025 workshop, COLING 2025)
    kind: shared-task
    source: src-acl-2025-regnlp-1-1-pdf
    quote: 19 teams participated, with 16 of them submitting

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: BM25 (rank fusion) + GPT-4 Turbo (gpt-4-turbo-1106), the paper's baseline
    source: src-arxiv-2409-05677-v2
    observed_on: 2026-11-08
    quote: Based on these filtered passages, we use the gpt-4-turbo-1106 model to generate
      comprehensive answers.
    note: RePASs 0.470 on the test split (Table 5). The shared task's top RePASs, 0.973, went to a
      team entry (src-acl-2025-regnlp-1-1-pdf).
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: For retrieval, each question's linked passages, which GPT-4 Turbo was
  given when it wrote the question and an NLI filter kept; ADGM experts checked 991 questions.
  Answer generation has no ground truth; RePASs is reference-free and scores the answer against the
  passages the system retrieved. The test split's passages are public.
ground_truth_source_source: src-arxiv-2409-05677-v2
ground_truth_source_quote: 991 questions and their associated passages from the ObliQA dataset were
  evaluated by ADGM experts
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The splits with their passages, the structured corpus and the RePASs code are public, so
    anyone can retrieve, generate and score on the test split. The shared task's hidden-set passages
    are not shown released in the sources read.
  source: src-github-repass-readme
  quote: Run the evaluation script by providing your input JSON file and a group method name.

task:
  exists: true
  input:
    - a compliance question about ADGM's financial regulation
    - the corpus of 40 structured ADGM regulatory documents, to retrieve from
  output: A ranked list of passage IDs (subtask 1) and an answer written from the retrieved passages
    (subtask 2), returned with the passages it used.
  scoring: Subtask 1 by Recall@10 (MAP@10 diagnostic) against the question's linked passages.
    Subtask 2 by RePASs, (Es - Cs + OCs + 1) / 3, where Es and Cs average each answer sentence's
    highest entailment and contradiction probability against the retrieved passages' sentences, and
    OCs is the share of the obligation sentences in those passages that some answer sentence entails
    above 0.7.
  scoring_note: The paper's equation 4 loses its fraction bar in extraction; the division by three
    is read from its stated normalisation to [0, 1] and checks against Table 3, where Es 0.7639, Cs
    0.3336 and OCs 1.0000 give RePASs 0.8101.
  source: src-arxiv-2409-05677-v2
  quote: The score penalizes contradictions and normalizes the result between 0 and 1.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The paper's results are on the public test split. The RIRAG-2025 shared task's 446
    questions are in the repository (RIRAGSharedTask/RIRAG_Unseen_Questions.json, read 2026-11-08)
    without their passages, so for that set only the inputs are public.
  access_basis:
    reason: The train, development and test splits, each question with its linked passages, are in
      the GitHub repository and on Hugging Face without a gate, beside the structured corpus.
    source: src-hf-api-obliqa
    quote: '"gated":false'
  refresh: static
  refresh_basis:
    reason: The items are the 2024 release; the Hugging Face copy of 2026 holds the same 27,869
      questions and the same 2,786-question test split. The shared task's 446 questions were a
      separate set (events), not a change to these splits.
    source: src-hf-datasets-server-obliqa-size
    quote: '"split":"test","num_bytes_parquet_files":2624355,"num_bytes_memory":2897495,"num_rows":2786'
  data_provenance:
    - model-generated
  data_provenance_note: GPT-4 Turbo wrote the questions from obligation-containing passages, single
    passages or topic-grouped sets of rules (69 topics), and an NLI model filtered the
    question-passage pairs. The passages are ADGM's own regulatory documents, which the authors
    restructured by hand (more than 300 person-hours) and ADGM's regulator supplied with
    annotations. expert-authored was rejected; ADGM experts reviewed 991 questions but wrote none.
  data_provenance_source: src-arxiv-2409-05677-v2
  data_provenance_quote: The gpt-4-turbo-1106 model is employed to generate both questions and
    answers.
  contamination_risk: medium
  contamination_risk_note: >
    The test split and its passages have been public on GitHub since 2024 and on Hugging Face since February
    2026, and the corpus is ADGM's published rulebook, so a route into training data is plausible; no
    source shows one. Separately, the questions were written by GPT-4 Turbo, the model the baseline generates
    with, and RePASs can be gamed without answering: concatenating the obligation sentences that its own
    classifier extracts from the retrieved passages scored 0.947 in the shared task (AUEB-Archimedes).
    That is a weakness of the metric, recorded in governance.known_limitation, not leakage.
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_basis:
    reason: RePASs was run on real questions with ADGM experts' obligations and answers, which
      scored 0.8101 (Table 3), and the paper reads that as an upper bound for automated systems.
      Shared-task systems that copy obligations have since exceeded it. Retrieval has no human
      anchor and is bounded at 1.
    source: src-arxiv-2409-05677-v2
    quote: the results provide an indicative upper bound for the performance of an automated system
  dataset_licence: Apache-2.0
  dataset_licence_note: The Hugging Face copy's licence. GitHub reports no licence for the
    RegNLP/ObliQADataset repository (API, read 2026-11-08), and the README states none. The
    regulatory texts are ADGM's; no source read states their terms.
  dataset_licence_source: src-hf-api-obliqa
  dataset_licence_quote: license:apache-2.0
  size:
    - count: 27869
      unit: questions, each with 1-6 linked passages
      source: src-arxiv-2409-05677
      quote: We create the ObliQA dataset, containing 27,869 questions derived from the collection
        of Abu Dhabi Global Markets (ADGM) financial regulation documents
    - count: 2786
      unit: test questions
      subset: test split
      source: src-hf-datasets-server-obliqa-size
      quote: '"split":"test","num_bytes_parquet_files":2624355,"num_bytes_memory":2897495,"num_rows":2786'
    - count: 2788
      unit: development questions in the Hugging Face copy
      subset: development split
      note: The paper, the README and the dataset card give 2,888; the three splits only sum to
        27,869 with 2,788 (review_checks).
      source: src-hf-datasets-server-obliqa-size
      quote: '"split":"validation","num_bytes_parquet_files":2650665,"num_bytes_memory":2924852,"num_rows":2788'
    - count: 40
      unit: regulatory documents (about 640k words) in the retrieval corpus
      source: src-arxiv-2409-05677-v2
      quote: The regulatory documents provided by ADGM consist of 40 documents totaling 640k words
    - count: 446
      unit: unseen questions, released without passages
      subset: RIRAG-2025 hidden set
      source: src-acl-2025-regnlp-1-1-pdf
      quote: based on a hidden dataset containing 446 questions
  size_note: The training split holds 22,295 questions (paper Table 6). About 21k questions link one
    passage and about 5k several (up to six).
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: RegNLP, the RIRAG authors' organisation (MBZUAI, with TU Darmstadt's UKP Lab on the
    2024 paper)
  maintainer_basis:
    reason: The dataset, the RePASs scorer and the shared-task material are held in the RegNLP
      organisation on GitHub and Hugging Face. The 2024 paper's authors are at MBZUAI and the UKP
      Lab; the 2025 ObliQA-MP paper's are at MBZUAI.
    source: src-hf-api-obliqa
    quote: '"author":"RegNLP"'
  maintainer_type: community-collective
  maintainer_type_note: A shared organisation account whose 2024 work came from two institutions,
    with no legal form stated and no institution named as holder, which academic-lab's exclusion
    sends here. academic-lab is the likely reading if MBZUAI holds the organisation (review_checks).
  submission_process:
    - held-out-server
  submission_process_note: In the 2025 shared task, teams submitted retrieval runs and answers for
    the 446 hidden questions, whose passages they could not see, and the organisers scored them.
    Outside it there is no leaderboard, and results appear in papers.
  submission_process_source: src-acl-2025-regnlp-1-1-pdf
  submission_process_quote: These questions were provided without access to their associated ground
  independence_flags: []
  independence_flags_note: >
    Deliberately empty rather than no-known-conflict, a statement about a search. ADGM, whose regulator
    supplied the data and annotations, funded access to OpenAI's GPT models through Azure; ADGM has no
    system evaluated, and OpenAI is not stated as a supporter. GPT-4 Turbo both wrote the questions and
    is the baseline's generator, a construction bias the flag vocabulary does not cover (review_checks).
  independence_assessed: true
  funding:
    source: src-arxiv-2409-05677-v2
    quote: support through a grant, enabling access to OpenAI GPT models via the Azure cloud
  known_limitation:
    source: src-acl-2025-regnlp-1-1-pdf
    quote: RePASs is currently limited in its ability to evaluate verbatim reproduction of retrieved
      passages

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: null
  compute_tier_note: Not stated in the sources read. Scoring runs two DeBERTa NLI models and a
    LegalBERT classifier that the RePASs README has the user fine-tune first, and the paper's
    retrievers range from BM25 to 7B embedding models; whether a GPU is required is not said.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Data, passages, corpus and the RePASs scorer are public, and scoring needs no human or
      maintainer-held step for the test split. The obligation classifier is retrained locally from
      the README, so a rerun's RePASs depends on that training (review_checks).
    source: src-github-repass-readme
    quote: Run the training script to fine-tune LegalBERT on the provided dataset.
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: RegNLP/RePASs (scripts/train_model.py, then scripts/evaluate_model.py on a JSON of
    questions, retrieved passages and answers) for answer generation; retrieval's Recall@10 and
    MAP@10 are standard computations over TREC-format runs, with no maintainer script in the sources
    read
  harness_source: src-github-repass-readme
  harness_quote: Run the evaluation script by providing your input JSON file and a group method
    name.
  code_licence: null
  code_licence_note: GitHub's licence metadata reports none for RegNLP/RePASs and
    RegNLP/ObliQADataset (API, read 2026-11-08; last pushed 2025-05-01 and 2024-12-08), and neither
    README states one.
  runnable_via:
    - custom
  runnable_via_note: The RePASs scripts only. inspect_evals, lm-evaluation-harness and HELM were not
    checked for an ObliQA task.
  maintainer_rerun_policy: unstated

comparability:
  # (classification-metric | model-derived-metric) x (retrieval-augmented-system | classical-algorithm)
  # resolves to the fallback profile (subset_used). Four more change an ObliQA number. The scorer: RePASs's
  # NLI models, its retrained obligation classifier and the 0.7 coverage threshold (harness). The retrieval
  # cutoff, 10 by default (k). Whether retrievers or generators were fine-tuned on the training split
  # (training_data_policy). Shots, for in-context retrievers and generators (the paper's BGE-EN-ICL runs
  # 0, 1, 3 and 5).
  material_extra:
    - harness
    - k
    - training_data_policy
    - shots
aggregation_policy: none-by-design
aggregation_policy_basis:
  reason: The paper and the shared task report retrieval (Recall@10, MAP@10) and answer generation
    (RePASs and its three components) in separate tables, with no combined score.
  source: src-acl-2025-regnlp-1-1-pdf
  quote: The evaluation of team submissions was conducted separately for both subtasks.
headline_metric: null

homepage: https://github.com/RegNLP/ObliQADataset
repository: https://github.com/RegNLP/ObliQADataset
dataset_url: https://huggingface.co/datasets/RegNLP/ObliQA
leaderboard_url: null


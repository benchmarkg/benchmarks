lineage:
  role: root
  variants:
    - id: obliqa-mp
      relation: multi-passage extension
      n_items: 2976
      source: src-acl-2025-nllp-1-10-pdf
      quote: we introduce ObliQA-MP, a dataset for multi-passage regulatory QA, extending the
        earlier ObliQA benchmark
lineage_note: ObliQA-MP (NLLP 2025) is the same maintainers' stricter tier, 2,976 questions whose
  passages an LLM re-validated; it has no entry of its own. The maintainers also report that BM25's
  Recall@10 falls from 0.761 on ObliQA to 0.561 on it.


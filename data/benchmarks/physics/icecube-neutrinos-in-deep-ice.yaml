# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T06)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2307-15289-v1
    - src-arxiv-2307-15289
    - src-arxiv-2310-15674-v1
    - src-kaggle-icecube-neutrinos-in-deep-ice
    - src-kaggle-icecube-neutrinos-in-deep-ice-record
    - src-icecube-kaggle-launch-news
    - src-icecube-kaggle-winners-news
    - src-arxiv-2606-02788-v1
  sources_note: >
    The write-up's v1 PDF and the top-3 paper's v1 PDF (DOIs, not archived) read as text, with
    windows clear of the e-mail and contact lines on their first pages; the write-up's abstract
    page for the date and venue. Kaggle's competition pages render by script, so they were read as
    the JSON that Kaggle's page service and competition service return to an anonymous GET, without
    signing in or accepting the rules; www.kaggle.com/robots.txt returned 404 on 2026-10-14. The
    IceCube Collaboration's launch and winners posts with scripts and styles stripped. The v1 PDF of
    a June 2026 paper (a DOI) as evidence of current use. UK AISI's inspect_evals README does not
    list the competition.
  confidence: medium
  review_checks:
    - check: Primary domain particle-physics, astrophysics-cosmology secondary. The assignment
        expected astrophysics-cosmology primary, as PLAsTiCC's. The call here rests on the scored
        quantity being a per-event particle direction recovered from detector readouts, the
        particle-physics leaf's wording, while the astrophysics leaf asks for astronomical
        quantities from observational data; the purpose (cosmic neutrino sources) and Kaggle's own
        astronomy tag argue for swapping them.
      field: domain
      source: src-arxiv-2307-15289-v1
      quote: can you predict the direction it came from based on the detector readouts
    - check: perception rests on reading the pulse series as a raw detector signal (a point cloud of
        hits in space and time). PLAsTiCC's entry rejected the term for photometry; a reviewer who
        reads processed pulses as features rather than signal should drop it.
      field: capability
    - check: activity closed. Kaggle often scores late submissions on closed competitions, but the
        record read does not say whether this one does, and a late score does not enter the ranked
        leaderboard. If late scoring is open, leaderboard-live-no-round might be argued.
      field: activity
      source: src-kaggle-icecube-neutrinos-in-deep-ice-record
      quote: '"finalLeaderboardHasBeenVerified":true'
    - check: lifecycle active or mature. The one current paper read uses its own split of the
        released training data, not the hidden set; with the competition closed and its record
        settled, mature is the alternative.
      field: lifecycle
      source: src-arxiv-2606-02788-v1
      quote: For testing and validation we consistently use batch 1 and batch 2 respectively
    - check: The private leaderboard is taken as the official result (the rules decide winners on it
        alone); the write-up notes that the 1st and 2nd places swap between the private and the
        public leaderboard.
      field: task
      source: src-arxiv-2307-15289-v1
      quote: the 2nd place on the private LB is corresponding to the 1st place on the public LB and
        vice versa
    - check: maintainer-competes-on-own-benchmark rests on the organisers' GraphNeT baseline on the
        leaderboard, a comparison row by a host, not a prize entry.
      field: governance.independence_flags
      source: src-arxiv-2310-15674-v1
      quote: is the author of the DynEdge baseline
    - check: Who paid the $50,000 in prizes is unstated. The rules make TUM the sponsor; the top-3
        paper thanks Kaggle's competition research grants program. If Kaggle, a commercial platform,
        funded the prizes, prize-sponsored-by-industry applies.
      field: governance.independence_flags
      source: src-arxiv-2310-15674-v1
      quote: This project was supported by the IceCube collaboration, kaggle.com and the Kaggle
        competition research grants program
    - check: maintainer_type community-collective or academic-lab. TUM is the Competition Sponsor
        and the organisers' home, and the University of Wisconsin-Madison operates IceCube; the
        Kaggle host account is the observatory's.
      field: governance.maintainer_type
      source: src-kaggle-icecube-neutrinos-in-deep-ice
      quote: the home of the competition organizers
    - check: The training-set size differs across the organisers' sources. The write-up says 137
        million released of 138 million; the top-3 paper says nearly 140 million in 660 batches of
        200,000 (132 million), and the June 2026 paper 140 million.
      field: data.size
      source: src-arxiv-2310-15674-v1
      quote: were provided with nearly 140 million simulated neutrino events together with the true
        directions
    - check: ceiling_anchor_type operational-system rests on LineFit, a fast first-guess
        reconstruction shown beside the scores in the write-up's figure; entrants beat it within
        days. A reviewer who reads LineFit as a low-end baseline rather than an anchor should set
        theoretical-maximum (zero error).
      field: data.ceiling_anchor_type

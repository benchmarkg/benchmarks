# data/benchmarks/physics/icecube-neutrinos-in-deep-ice.yaml
#
# P1-S6-T06, physics entry 15. Filled from the organisers' write-up, arXiv 2307.15289 read as its v1 PDF
# (2023-07-28, ICRC2023 proceedings), and its abstract page; the organisers' paper on the top three solutions,
# arXiv 2310.15674 read as its v1 PDF (2023-10-24); Kaggle's public JSON for competition 38257
# (icecube-neutrinos-in-deep-ice), its page service (description, evaluation, timeline, data, prizes, code
# requirements, acknowledgements and rules pages) and its competition record; the IceCube Collaboration's two
# news posts on the competition's launch (2023-01-19) and winners (2023-06-05), scripts and styles stripped;
# and the v1 PDF of a June 2026 paper that trains and tests on the competition data (arXiv 2606.02788). Every
# quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: icecube-neutrinos-in-deep-ice
name: IceCube - Neutrinos in Deep Ice
aliases:
  - Neutrinos in Deep Ice
  - IceCube Kaggle competition
tagline: Reconstructing neutrino directions from simulated IceCube detector pulses, scored by mean
  angular error (Kaggle, 2023).
description: >
  A Kaggle competition run from 19 January to 19 April 2023 by the IceCube Collaboration, with the
  organisers at the Technical University of Munich, to reconstruct the direction a neutrino came
  from out of the pulses it left in the IceCube detector at the South Pole. Each event is a
  variable-length series of pulses, from a few to tens of thousands, each with a sensor (one of
  5,160 photomultipliers, mapped to x, y, z), a time, a charge and an auxiliary readout flag. The
  data are simulated neutrino interactions of all flavours between 100 GeV and 100 PeV, processed
  with IceCube's own tools through simulated triggering and online filtering and not cleaned
  further, so noise-only events and coincident muons are left in. Entrants predict an azimuth and a
  zenith per event, and the score is the mean opening angle to the true direction, in radians,
  lower being better; random guessing scores about pi/2. Of 138 million events, 137 million were
  released with their true directions and about one million were kept hidden. It was a code
  competition: entrants uploaded notebooks that Kaggle ran on the hidden set, offline and within
  nine hours, scoring part of it on the public leaderboard and the rest, sealed until the end, on
  the private leaderboard that decided the prizes ($50,000 in all). 901 participants in 812 teams
  made 11,206 submissions; the top three solutions all used transformers and reached sub-degree
  resolution on tracks. No source read releases the hidden set; the training data stay on Kaggle
  under the competition's non-commercial terms, and papers still train and test on them.
self_description:
  source: src-arxiv-2307-15289-v1
  quote: a public machine learning challenge designed to encourage the development of innovative
    solutions to improve the accuracy and efficiency of neutrino event reconstruction
external_ids:
  arxiv: '2307.15289'
paper:
  title: Public Kaggle Competition "IceCube - Neutrinos in Deep Ice"
  arxiv: '2307.15289'
  version_read: v1
  source: src-arxiv-2307-15289-v1
released: 2023-01-19
released_note: The day the competition went live, as the organisers' write-up dates it; Kaggle's
  record enables the competition the same day (2023-01-19T17:52Z). The write-up itself was submitted
  to arXiv on 2023-07-28 and presented at ICRC2023.
released_source: src-arxiv-2307-15289-v1
released_quote: The competition went live on January 19, 2023 and ran for 3 months until April 19,
  2023.
release_venue: Kaggle (competition icecube-neutrinos-in-deep-ice); write-up at the 38th
  International Cosmic Ray Conference (ICRC2023)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/particle-physics
  secondary:
    - physics/astrophysics-cosmology
domain_basis:
  reason: The scored quantity is each event's neutrino direction, a physics quantity recovered from
    simulated detector readouts, which is the particle-physics leaf's definition (detector data to
    physics quantities). The direction is wanted chiefly to locate cosmic neutrino sources, which is
    the astrophysics leaf's case and why it is secondary (see review_checks).
  source: src-arxiv-2307-15289-v1
  quote: can you predict the direction it came from based on the detector readouts
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: The events come from IceCube's simulation, but entrants reconstruct a direction from
      them; no learned model stands in for the simulator or is scored against its output.
capability:
  - scientific-prediction
  - perception
capability_basis:
  scientific-prediction:
    reason: Systems predict the direction of the neutrino behind each event, a property of the
      simulated physical system, and the score compares it with the direction the simulation drew.
    source: src-arxiv-2307-15289-v1
    quote: were tasked with creating a suitable model to predict the direction vector of incoming
      neutrinos
  perception:
    reason: The input is the detector's pulse series, a variable-length cloud of hits in space and
      time with charges and no cleaning, and the score measures what is recovered from it.
      PLAsTiCC's entry rejected the term for tabulated photometry; the call here is left to review.
    source: src-arxiv-2307-15289-v1
    quote: This series of pulses is a variable-length sequence, containing from few up to tens of
      thousand pulses per event
capability_considered_and_rejected:
  - term: calibration-uncertainty
    reason: Only the predicted azimuth and zenith are scored. Several top solutions trained with a
      von Mises-Fisher loss that estimates a concentration alongside the direction, but the metric
      consumes no confidence.
  - term: distribution-shift-generalization
    reason: The hidden scoring set was drawn from the same simulation as the training events; no
      shifted condition is scored as a condition of its own.
    source: src-arxiv-2307-15289-v1
    quote: The remaining one million events scoring set was retained for computing the ranks.
  - term: sample-efficiency
    reason: Entrants had 137 million labelled events and could add freely available external data
      and pre-trained models; no data budget is fixed.

evaluation_method:
  - statistical-fit
evaluation_method_basis:
  reason: The score is the mean, over the scoring set, of the opening angle between the true and
    predicted directions, a mean absolute error on the sphere against the simulation's truth.
  source: src-arxiv-2307-15289-v1
  quote: To turn this event-wise quantity into an overall score, we compute the simple mean of it
    over an entire dataset
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Mean angular error is a general error statistic on directions, used well outside
      neutrino physics, not a measure defined only within one discipline.
  - term: uncertainty-calibration-score
    reason: No probability or distribution is emitted or scored.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are reconstruction models trained from scratch for a task neutrino physics
    defines, mostly graph networks and transformers, often ensembled; the top three all included
    transformer layers.
  source: src-arxiv-2307-15289-v1
  quote: their models include, at least in parts, a transformer architecture implementing an
    attention mechanism
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The models are trained for one task, but direction reconstruction in a neutrino
      telescope is defined by physics, which that term's exclusion test sends to
      domain-specialist-model.
  - term: scientific-surrogate-model
    reason: A submission reconstructs the direction from the detector response; it does not emulate
      the simulation or the detector.
as_used:
  - protocol: Trained and tested on the released training data, with batch 1 as the test set and
      batch 2 for validation, not on Kaggle's hidden scoring set, and scored by the same mean
      angular error.
    split: batch 1 of the 660 released training batches
    source: src-arxiv-2606-02788-v1
    quote: For testing and validation we consistently use batch 1 and batch 2 respectively
    note: A June 2026 paper (neutrino fingerprints, a ResNet18 on per-sensor images), reporting 1.10
      rad beside the top competition entries' 0.95 rad on the hidden leaderboard.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the competition's data and metric; a June 2026 paper trains
    and tests a reconstruction model on it and calls it a baseline on the Kaggle dataset. The
    competition ended in April 2023, which goes to activity, and its page remains available as a
    learning resource.
  source: src-arxiv-2606-02788-v1
  quote: achieves an MAE of 1.10 rad on the Kaggle dataset
activity: closed
activity_note: Kaggle's record gives the final submission deadline as 2023-04-19 and its final
  leaderboard as verified. Whether Kaggle still scores late notebook submissions was not read (its
  pages render by script, and nothing was submitted); a late score would not enter the ranked
  leaderboard (see review_checks).
activity_basis:
  reason: The Kaggle competition was the only route for scored entries. It closed on 2023-04-19
    (history) with its final leaderboard verified, and in June 2023 the collaboration announced it
    concluded and named the winners; no later round is announced.
  source: src-icecube-kaggle-winners-news
  quote: Last month, the IceCube Collaboration concluded their

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: The 1st-place solution, an ensemble of six EdgeConv-and-transformer models
    source: src-arxiv-2310-15674-v1
    observed_on: 2026-10-14
    quote: By creating six variations of this model and ensembling them, we achieved a private
      leaderboard score of 0.960.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each event's true direction is the one the simulation gave the neutrino;
  the released training metadata carry it as azimuth and zenith.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The scoring set behind the leaderboards, inputs and labels alike, was never released and
    was scored only inside Kaggle's offline system. Anyone with a Kaggle account can train and test
    on the released training data, but not on the official items.
  source: src-arxiv-2307-15289-v1
  quote: This scoring happened in an isolated system without connection to the outside.

task:
  exists: true
  input:
    - "one event's pulse series: per pulse a sensor id (mapped to x, y, z by the sensor geometry), a time
      in ns, a charge in photoelectrons and an auxiliary flag"
  output: The neutrino's azimuth (0 to 2 pi) and zenith (0 to pi) in radians for every event, as a
    submission.csv written by the entrant's notebook.
  scoring: Mean angular error over the hidden scoring set (about one million events), lower is
    better. The public leaderboard used part of the set (43 percent by Kaggle's record) and the
    private leaderboard, which decided the prizes, the rest.
  tests_hidden_from_system: true
  source: src-kaggle-icecube-neutrinos-in-deep-ice
  quote: Submissions are evaluated using the mean angular error between the predicted and true event
    origins.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The 137 million training events with their directions download from Kaggle after
    signing in and accepting the competition rules, which allow non-commercial and academic use only
    and forbid passing the data to anyone not in the competition.
  access_basis:
    reason: The scoring set's inputs as well as its labels stayed with Kaggle; they were handed only
      to the entrant's notebook inside the scoring run, and no source read releases them.
    source: src-kaggle-icecube-neutrinos-in-deep-ice
    quote: When your submitted notebook is scored the actual test data
  refresh: static
  refresh_basis:
    reason: One data set, run once as one competition. The 660 training batches the organisers
      described in 2023 are the 660 a 2026 paper uses, and no revision is recorded.
    source: src-arxiv-2310-15674-v1
    quote: These events were grouped into 660 random sub-samples
  data_provenance:
    - simulation-generated
  data_provenance_note: Simulated neutrino interactions of all flavours from 100 GeV to 100 PeV,
    processed with IceCube's tools, required to pass simulated triggering and online filtering, and
    not cleaned further. Each event was simulated with its own detector nuisance parameters
    (scattering and absorption in the ice). No event is a real observation.
  data_provenance_source: src-arxiv-2307-15289-v1
  data_provenance_quote: we based the competition on simulated neutrino events, i.e. synthetic data,
    that contains the knowledge of the true neutrino direction for each event that was input to the
    simulation
  contamination_risk: low
  contamination_risk_note: The scoring set was never released, and notebooks ran on it offline
    (internet disabled), so no training route to the scored items is known. Training on the released
    events, drawn from the same simulation, is the protocol. The public leaderboard gave feedback on
    part of the set during the competition; the private part decided the ranking. Results now
    reported on users' own splits of the released data (as_used) have no such protection.
  contamination_risk_source: src-arxiv-2307-15289-v1
  contamination_risk_quote: This scoring happened in an isolated system without connection to the
    outside.
  contamination_evidence: []
  ceiling_anchor_type: operational-system
  ceiling_anchor_type_note: The write-up reads scores against random guessing (about pi/2) and
    LineFit, a simple online reconstruction IceCube uses, which entrants matched within days.
    LineFit is a fast first-guess method, not IceCube's best reconstruction, and its score is shown
    only in a figure (see review_checks). The metric's own bound is zero error.
  ceiling_anchor_type_source: src-arxiv-2307-15289-v1
  ceiling_anchor_type_quote: comparable to a simple online reconstruction, used by IceCube, called
    LineFit
  dataset_licence: Non-commercial and academic research use (the competition data's terms under the
    Kaggle rules)
  dataset_licence_note: Kaggle's record gives the data's licence as "Subject to Competition Rules".
    The rules also forbid redistributing the data to anyone not participating.
  dataset_licence_source: src-kaggle-icecube-neutrinos-in-deep-ice
  dataset_licence_quote: Competition Use and Non-Commercial
  size:
    - count: 1000000
      unit: simulated events in the hidden scoring set
      subset: scoring set (public and private leaderboards)
      note: Kaggle's data page says roughly one million, split between batches; its record puts 43
        percent of the set on the public leaderboard.
      source: src-arxiv-2307-15289-v1
      quote: The remaining one million events scoring set was retained for computing the ranks.
    - count: 137000000
      unit: simulated events released with their true directions
      subset: train
      note: The top-3 paper says nearly 140 million, in 660 batches of 200,000 events (132 million);
        the June 2026 paper says 140 million (see review_checks).
      source: src-arxiv-2307-15289-v1
      quote: 137 million were provided to the participants to download including the truth
        information
    - count: 138000000
      unit: simulated neutrino events in all
      subset: train and scoring set
      source: src-arxiv-2307-15289-v1
      quote: consist of 138 million simulated neutrino interactions of all flavours and energies
        between 100 GeV up to 100 PeV
  submission_limit:
    max_submissions: 5
    period_days: 1
    per: team, during the competition (2 final submissions selected for judging)
    source: src-kaggle-icecube-neutrinos-in-deep-ice

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The IceCube Collaboration, with the competition's organisers at the Technical
    University of Munich (TUM); hosted by Kaggle
  maintainer_basis:
    reason: The collaboration announced the competition and supplied the data, and the Kaggle host
      account is the IceCube Neutrino Observatory's; TUM, home of the organisers, is the rules'
      Competition Sponsor, and Kaggle hosted and ran the scoring.
    source: src-icecube-kaggle-launch-news
    quote: The IceCube Collaboration, in conjunction with Kaggle, the Technical University of Munich
      (TUM)
  maintainer_type: community-collective
  maintainer_type_note: The IceCube Collaboration is an international scientific collaboration of
    many institutions, and no source read states a legal form or names one institution as holder of
    the competition data. academic-lab was considered, for TUM as the legal Competition Sponsor and
    for the University of Wisconsin-Madison, which operates IceCube (see review_checks); PLAsTiCC's
    entry made the same call for its rules' sponsor.
  submission_process:
    - sandboxed-rerun
  submission_process_note: A code competition. Entrants committed Kaggle notebooks (with any weights
    they needed), which Kaggle ran on the hidden scoring set offline, within nine hours of CPU or
    GPU time, and scored on the public and private leaderboards; five submissions a day and two
    chosen for the final ranking. Notebooks are code, not container images, so
    containerized-algorithm-submission does not apply (the brain-score precedent).
  submission_process_source: src-arxiv-2307-15289-v1
  submission_process_quote: Participants had to upload their reconstruction algorithm as a jupyter
    notebook
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2310-15674-v1
      quote: We submitted the predictions from the GNN to the leaderboard for comparison
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2307-15289-v1
      quote: The remaining one million events scoring set was retained for computing the ranks.
  independence_flags_note: The organisers put a GraphNeT DynEdge baseline on the leaderboard,
    trained by one of the competition's hosts; IceCube and TUM members could take part but not win
    prizes. Kaggle held the scoring set for the organisers and ran every submission on it. The rules
    name TUM as the sponsor offering the $50,000; the top-3 paper thanks Kaggle's competition
    research grants program among the project's supporters, but no source read says who paid the
    prizes, so prize-sponsored-by-industry is not set (see review_checks).
  independence_assessed: true
  funding:
    source: src-arxiv-2310-15674-v1
    quote: This project was supported by the IceCube collaboration, kaggle.com and the Kaggle
      competition research grants program
  funding_note: The write-up adds that Kaggle supplied a project manager, a data scientist, its
    platform and the scoring compute.
  participation:
    source: src-arxiv-2307-15289-v1
    quote: a total of 901 participants handed in at least one valid solution
  participation_note: 6,460 people registered; the 901 active participants from 74 countries formed
    812 teams and made 11,206 submissions.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: provided-allocation
  compute_tier_basis:
    reason: The official scores came from Kaggle running each entrant's notebook on its own compute,
      within nine hours; training compute was the entrant's own.
    source: src-arxiv-2307-15289-v1
    quote: which then was run on the separate system on the scoring set
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The leaderboard scores need the hidden scoring set, which only Kaggle holds. Scores on
      users' own splits of the released training data can be reproduced by anyone with a Kaggle
      account.
    source: src-arxiv-2307-15289-v1
    quote: This scoring happened in an isolated system without connection to the outside.
  reproducibility_blockers:
    - private-test-set
  harness_availability: reference-implementation-only
  harness: Kaggle's public mean-angular-error notebook (a Python copy of the metric); the official
    score is computed inside Kaggle on the hidden set.
  harness_source: src-kaggle-icecube-neutrinos-in-deep-ice
  harness_quote: for a python copy of the metric
  submission_channel:
    source: src-kaggle-icecube-neutrinos-in-deep-ice-record
    quote: '"onlyAllowKernelSubmissions":true'
  code_licence: null
  code_licence_note: The metric notebook's licence was not read, and the competition has no
    repository of its own.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which items (Kaggle's public or private leaderboard, or a user's own split of
  # the released training batches), what the model was trained on (all 137 million events or a part, and any
  # external data or pre-trained models, which the rules allowed), and whether inference ran inside the
  # competition's nine-hour limit, which bounded the size of ensembles.
  material_extra:
    - subset_used
    - training_data_policy
    - wall_clock_hours


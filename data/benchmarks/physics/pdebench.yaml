    quote: '`metrics.py` is the script to evaluate the trained models'
  harness_availability: official-harness
  harness: PDEBench (pdebench/models/metrics.py)
  harness_source: src-github-pdebench-readme
  harness_quote: '`metrics.py` is the script to evaluate the trained models'
  code_licence: null
  code_licence_note: The paper says the code is under "a permissive open source license"; GitHub
    reports "Other", and the licence file was not read.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which PDE dataset and resolution, forward or inverse, and which metric of the family.
  material_extra:
    - subset_used
  material_waived:
    - field: lead_time
      reason: The facet pair statistical-fit x scientific-surrogate-model resolves the forecasting
        profile, but nothing here is forecast; a PDE solution has no horizon from an issue date.
    - field: resolution_window
      reason: Same resolution as lead_time; nothing resolves later, the solver's fields exist now.

homepage: https://github.com/pdebench/PDEBench
repository: https://github.com/pdebench/PDEBench

# data/benchmarks/physics/pdebench.yaml
#
# P1-S3-T02, checkpoint entry 20 of 20 (copilot off). Filled from the PDEBench paper, arXiv 2210.07182 read as its v5
# PDF (NeurIPS 2022 Datasets and Benchmarks), and its abstract page; the repository README; and a September 2026
# abstract that reports on it. Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.

id: pdebench
name: PDEBench
tagline: Simulated solutions of 11 PDEs, from advection to 3D Navier-Stokes, for learned forward and
  inverse solvers.
description: >
  Datasets of numerical solutions to 11 time-dependent and time-independent PDEs -- advection, Burgers,
  diffusion-reaction, diffusion-sorption, Darcy flow, compressible and incompressible Navier-Stokes, shallow
  water, among others -- in 1D to 3D, over many initial and boundary conditions and PDE parameters. The
  forward problem learns the solution operator; the inverse problem recovers initial conditions or parameters.
  Scored by a family of errors meant to reflect both data and physics: RMSE and normalised RMSE, maximum
  error, error of conserved quantities, error on the boundary, and errors in low, mid and high Fourier
  bands. Baselines are FNO, U-Net and PINN. The data (CC-BY) and pretrained baselines are on DaRUS, and
  the code also generates new data.
self_description:
  source: src-arxiv-2210-07182-v5
  quote: we propose a versatile benchmark suite for
external_ids:
  arxiv: '2210.07182'
paper:
  title: 'PDEBench: An Extensive Benchmark for Scientific Machine Learning'
  arxiv: '2210.07182'
  version_read: v5
  source: src-arxiv-2210-07182-v5
released: 2022-10-13
released_note: The paper's first arXiv version, as the abstract page dates it.
released_source: src-arxiv-2210-07182
released_quote: Thu, 13 Oct 2022

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/simulation-surrogates
  secondary:
    - physics/fluid-dynamics
domain_basis:
  reason: Learned models stand in for the numerical PDE solvers that produced the data and are
    scored against them; several of the PDEs are fluid flows.
  source: src-arxiv-2210-07182-v5
  quote: providing diverse data sets with distinct properties based on 11 well-known time-dependent
    and time-independent PDEs
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: A model predicts the state of a physical system governed by a PDE, or its parameters,
      and is scored against the reference computation.
    source: src-arxiv-2210-07182-v5
    quote: covering both “classical” forward learning problems and inverse settings

evaluation_method:
  - statistical-fit
evaluation_method_basis:
  reason: Every metric is an error statistic against the solver's fields (RMSE, normalised RMSE,
    maximum error, RMSE of conserved quantities, on the boundary, and per Fourier band).
  source: src-arxiv-2210-07182-v5
  quote: normalized RMSE (ensuring scale independence)
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants are learned models that replace a numerical PDE solver and are scored against
    its output.
  source: src-arxiv-2210-07182-v5
  quote: baseline results with popular machine learning models (FNO, U-Net, PINN, Gradient-Based
    Inverse Method)

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced on it in 2026, for example a September 2026
    operator-learning paper on its Burgers and Darcy datasets; the maintainers updated compatibility
    notes in March 2026.
  source: src-arxiv-2609-38348
  quote: On PDE solution prediction using PDEBench Burgers and Darcy flow
activity: no-submission-channel
activity_basis:
  reason: The repository offers data generation, download, training and metric scripts and no
    leaderboard or results route; results appear in users' papers.
  source: src-github-pdebench-readme
  quote: '`metrics.py` is the script to evaluate the trained models based on various evaluation metrics
    described in our paper'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Fourier Neural Operator (FNO)
    source: src-arxiv-2210-07182-v5
    observed_on: 2026-10-10
    quote: baseline results with popular machine learning models (FNO, U-Net, PINN, Gradient-Based
      Inverse Method)
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each dataset's numerical solver output.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Data, generation code, baselines and the metric script are public.
  source: src-github-pdebench-readme
  quote: This repository consists of the code used to generate the datasets, to upload and download
    the datasets from the data repository, as well as to train and evaluate different machine
    learning models as baselines

task:
  exists: true
  input:
    - for the forward problem, initial (and boundary) conditions and PDE parameters; for the inverse
      problem, observed solution fields
  output: The predicted solution trajectory, or the recovered initial condition or parameters.
  scoring: The metric family above per PDE dataset, on its test samples; the PDEs are reported
    separately.
  source: src-arxiv-2210-07182-v5
  quote: The inverse problem scenarios comprise initial and boundary conditions and PDE parameters

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The datasets and pretrained baselines are on DaRUS under CC-BY, and the code to
      regenerate them is public.
    source: src-arxiv-2210-07182-v5
    quote: The dataset is licensed under CC BY license
  refresh: static
  refresh_basis:
    reason: The DaRUS datasets have not been reissued since release; code fixes and compatibility
      notes change how to run the benchmark, not its data.
    source: src-github-pdebench-readme
    quote: 'Last updated: 2026-03-30'
  data_provenance:
    - simulation-generated
  data_provenance_note: Solutions computed with numerical solvers over sampled initial and boundary
    conditions and parameters.
  data_provenance_source: src-arxiv-2210-07182-v5
  data_provenance_quote: Data may be generated by executing code through a common interface, or by
    downloading
  contamination_risk: unknown
  contamination_risk_note: Train and test samples are public, and new PDE foundation models pretrain
    on collections that include PDEBench; whether they exclude its test samples was not assessed.
  contamination_evidence: []
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The paper's datasheet says "CC BY license" without a version; DaRUS's record
    was not read.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: NEC Laboratories Europe and the University of Stuttgart (the PDEBench authors)
  maintainer_basis:
    reason: The paper's authors, from NEC Labs Europe and Stuttgart, created and maintain it (the
      README names them); the code is in the pdebench organisation and the data in Stuttgart's DaRUS
      repository.
    source: src-github-pdebench-readme
    quote: The code repository for the NeurIPS 2022 paper
  maintainer_type: community-collective
  maintainer_type_note: A project organisation (pdebench) shared by an industry lab and a
    university, with no single holder stated.
  submission_process:
    - literature-only
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own.


# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2410-02867-v5
    - src-arxiv-2410-02867
    - src-fair-universe-site
    - src-fair-universe-higgs-challenge-site
    - src-fair-universe-higgs-docs-evaluation
    - src-codabench-fair-universe-higgs-2977
    - src-github-hep-challenge-readme
    - src-zenodo-fair-universe-higgsml
    - src-arxiv-2609-02781-v1
  sources_note: >
    The paper's v5 PDF (a DOI, not archived) read as text, and its abstract page; the project's home
    page and the challenge's results page, and the documentation's Evaluation page, with scripts and
    styles stripped; Codabench's JSON record of competition 2977, withheld from archiving because it
    holds an organiser's personal e-mail address; the README at master; Zenodo's record of the public
    dataset (a DOI); and the v1 PDF of arXiv 2609.02781 (a DOI) as evidence of current use.
  confidence: medium
  review_checks:
    - check: The assignment fixes the id fair-universe-higgsml, but the taxonomy's examples name
        this benchmark fair-universe-higgsml-uncertainty (domains, capabilities, evaluation methods)
        and fair-universe-higgsml-uncertainty-challenge (governance, execution, the stress corpus).
        The refs and the id should be brought into line.
    - check: The paper states 280M public events, but the Zenodo record's per-process counts sum to
        220,099,101, the number arXiv 2609.02781 verified at ingestion. Which is right, or whether
        280M counts events before a selection, is not settled by the sources read.
      field: data.size
      specialist: true
      source: src-arxiv-2609-02781-v1
      quote: 220,099,101 events verified at ingestion
    - check: lifecycle active rests on one September 2026 paper that uses the public set with its
        own protocol, not the Quantile Score. With the competition closed and the project moved on
        to weak lensing, mature (an ended competition whose instrument stays in use) is the
        alternative.
      field: lifecycle
    - check: scientific-prediction is assigned beside calibration-uncertainty because the claim is a
        measurement of mu scored against the simulated truth. The ranking scores only the interval;
        the point estimate appears in Codabench's RMSE column.
      field: capability
    - check: sandboxed-rerun rather than containerized-algorithm-submission. Entrants upload code
        that the organisers' Docker image runs, not a container of their own; the brain-score
        precedent was followed.
      field: governance.submission_process
      source: src-codabench-fair-universe-higgs-2977
      quote: '"docker_image":"docker.io/nersc/fair_universe:1298f0a8"'
    - check: Who paid the $4,500 in prizes is unstated, and the Codabench Terms contradict the
        Prizes page. prize-sponsored-by-industry could apply if a commercial sponsor paid.
      field: governance.independence_flags
      source: src-fair-universe-higgs-challenge-site
      quote: will win $2000
    - check: arXiv 2609.02781 reports an official normalisation defect in the dataset tooling, found
        and reported upstream. Whether it touched the official scores, and whether it belongs in a
        version's errata, is not known.
      field: versions
      specialist: true
      source: src-arxiv-2609-02781-v1
      quote: the official normalization no-op defect found, worked around, and reported upstream
    - check: The pilot is recorded as an edition from the site's news alone. A single-systematic
        (TES) variant ran on Codabench (4346) to 2025-05-31 and is not recorded; the 2025 and 2026
        weak-lensing challenges are treated as other benchmarks.
      field: versions
      source: src-fair-universe-site
      quote: We have launched the pilot version of HiggsML Uncertainty Competition today
    - check: theoretical-maximum follows the letter of the ceiling tests; the bound is the
        regulariser's artefact and unreachable (Stage 3 failure 004, still open).
      field: data.ceiling_anchor_type

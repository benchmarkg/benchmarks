# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1810-00001-v1
    - src-arxiv-1810-00001
    - src-arxiv-2012-12392-v1
    - src-kaggle-plasticc-2018
    - src-kaggle-plasticc-2018-record
    - src-zenodo-plasticc-unblinded
    - src-zenodo-plasticc-unblinded-note
    - src-github-plasticc-kit-demo
    - src-arxiv-2511-17564-v1
    - src-arxiv-2604-23792-v2
  sources_note: >
    The data-set note's v1 PDF and the results paper's v1 PDF (DOIs, not archived) read as text,
    with windows clear of the corresponding author's contact line on the note's first page; the
    note's abstract page for the date. Kaggle's competition pages render by script, so they were
    read as the JSON that Kaggle's page service and competition service return to an anonymous GET;
    www.kaggle.com/robots.txt returned 404 on 2026-10-14. Zenodo's record page (scripts and styles
    stripped; its robots.txt disallows /api/) and the release note filed in it. The starter kit's
    demo notebook at master. Two current papers' PDFs, a 2025 user of the data and a 2026 ELAsTiCC
    paper for lineage.
  confidence: medium
  review_checks:
    - check: distribution-shift-generalization rests on the deliberately unrepresentative training
        set, an input shift with the task unchanged. Class 99 also puts four object types in the
        test set that training never shows, which is novelty detection, a change of label set that
        the term's exclusion test does not cover; the vocabulary has no term for it.
      field: capability
      source: src-arxiv-1810-00001-v1
      quote: interesting objects that are hypothesized to exist but have never been observed and are
        thus not in the training set
    - check: perception was rejected on the view that tabulated photometry with catalogue metadata
        is not a raw signal. A reviewer who reads multi-band light curves as a comparable raw signal
        should add it.
      field: capability
    - check: lifecycle active or mature. Results are still produced, but on users' own subsets,
        regroupings and metrics (as_used), not on the competition's protocol; with the competition
        ended and its record settled, mature is the alternative.
      field: lifecycle
      source: src-arxiv-2511-17564-v1
      quote: a subset of the total data was used
    - check: activity closed. The results paper said in 2020 that the competition remained 'live'
        and took a few late submissions; Kaggle's late-submission state in 2026 was not read (the
        pages are script-rendered). Late submissions are scored but do not enter the published
        ranking, so no route onto a board is known to be open.
      field: activity
      source: src-arxiv-2012-12392-v1
      quote: hence the few submissions received after the closing deadline
    - check: maintainer_type community-collective or academic-lab. The University of Toronto is the
        rules' Competition Sponsor and administered the grant; the data and kit sit with DESC and
        TVS.
      field: governance.maintainer_type
      source: src-kaggle-plasticc-2018
      quote: The Governing Council of the University of Toronto
    - check: prize-sponsored-by-industry rests on the results paper's thanks to Kaggle for the
        awards; the rules name the University of Toronto as the sponsor offering the $25,000 in
        prizes. Whether a hosting platform paying the prizes is the flag's case is a judgement.
      field: governance.independence_flags
      source: src-arxiv-2012-12392-v1
      quote: The awards for PLAsTiCC contest were generously supported by Kaggle
    - check: The rules let five metric-and-design team members compete fully. No source read shows
        whether any entered; if one did, maintainer-competes-on-own-benchmark applies.
      field: governance.independence_flags
      source: src-arxiv-1810-00001-v1
      quote: nor validating the data, and as such are allowed to compete in the challenge fully
    - check: paper names the data-set note, which defines the data and the metric. The results paper
        (arXiv 2012.12392, which the 2026 paper cites as Hlozek et al. 2023, a journal version whose
        DOI was not read) could be named instead.
      field: paper

# data/benchmarks/physics/plasticc.yaml
#
# P1-S6-T05, physics entry 8 of 9. Filled from the challenge's data-set note, arXiv 1810.00001 read as its v1 PDF
# (2018-09-28), and its abstract page; the results paper, arXiv 2012.12392 read as its v1 PDF (2020-12-22);
# Kaggle's public JSON for competition 10384 (PLAsTiCC-2018), its page service (overview, evaluation, data,
# prizes, timeline, team and rules pages) and its competition record; Zenodo's record of the unblinded data
# (10.5281/zenodo.2539456) and the data-release note filed with it; the starter kit's classification-demo
# notebook (LSSTDESC/plasticc-kit); the v1 PDF of a November 2025 paper that trains and tests on the PLAsTiCC
# data (arXiv 2511.17564); and the v2 PDF of a 2026 paper on ELAsTiCC that describes PLAsTiCC's successor
# (arXiv 2604.23792). Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.

id: plasticc
name: PLAsTiCC
aliases:
  - Photometric LSST Astronomical Time-series Classification Challenge
  - PLAsTiCC Astronomical Classification
  - PLAsTiCC-2018
tagline: Classifying 3.5 million simulated LSST light curves into 15 classes, scored by weighted log
  loss (Kaggle, 2018).
description: >
  A data challenge, run on Kaggle from 28 September to 17 December 2018 by a team from the LSST Dark
  Energy Science Collaboration and the Transients and Variable Stars Science Collaboration, to
  classify astronomical transients and variables from light curves simulated to look like three
  years of the Rubin Observatory's LSST survey. Each object comes as fluxes over time in six
  passbands with host-galaxy redshift and Milky Way extinction metadata. A classifier trained on
  7,848 labelled objects must give every one of about 3.5 million test objects a probability for
  each of 15 classes: 14 seen in training and a class 99 for objects of none of them, which hides
  four simulated types never shown in training. The training set is deliberately unrepresentative,
  brighter and nearer than the test set, as a spectroscopically confirmed sample would be. Scoring
  is a multi-class log loss that averages each class over its own objects and up-weights rare
  classes, so every class counts about equally; the weights were hidden during the competition.
  Kaggle scored a third of the test set on the public leaderboard and ranked the prizes on the other
  two thirds. The test labels were released on Zenodo in January 2019 under CC BY 4.0, and the data
  are still used to train and test classifiers.
self_description:
  source: src-arxiv-1810-00001-v1
  quote: is an open data challenge to classify simulated astronomical time-series data in
    preparation for observations from the Large Synoptic Survey Telescope (LSST)
external_ids:
  arxiv: '1810.00001'
paper:
  title: 'The Photometric LSST Astronomical Time-series Classification Challenge (PLAsTiCC): Data set'
  arxiv: '1810.00001'
  version_read: v1
  source: src-arxiv-1810-00001-v1
released: 2018-09-28
released_note: The data-set note's arXiv submission date, as its abstract page gives it; Kaggle's
  record enables the competition the same day (2018-09-28T21:36Z).
released_source: src-arxiv-1810-00001
released_quote: Submitted on 28 Sep 2018
release_venue: Kaggle (competition PLAsTiCC-2018)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/astrophysics-cosmology
domain_basis:
  reason: The scored quantity is the astronomical class of a source, inferred from its photometric
    time series and host-galaxy metadata. The observations are simulated to mimic LSST's.
  source: src-arxiv-1810-00001-v1
  quote: how well can we classify astronomical transients and variables from a simulated light curve
    data set designed to mimic the data from LSST
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: The light curves come from a simulation, but entrants classify them; no learned model
      stands in for the simulator or is scored against its output fields.
capability:
  - scientific-prediction
  - calibration-uncertainty
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: A classifier predicts which kind of astrophysical object, from supernova types to RR
      Lyrae and AGN, produced each light curve, and is scored against the class the simulation drew.
    source: src-arxiv-1810-00001-v1
    quote: how well can we classify objects in the sky that vary in brightness from simulated LSST
      time-series data
  calibration-uncertainty:
    reason: Entrants submit a probability for every class of every object, and the log loss scores
      those probabilities, not a hard label.
    source: src-kaggle-plasticc-2018
    quote: For each object, you must submit a set of predicted probabilities (one for every
      category)
  distribution-shift-generalization:
    reason: The training set is built as a mock spectroscopic sample, brighter and at lower redshift
      than the test set, and the score is computed on the shifted test set. Class 99 adds a second
      shift, four object types absent from training (see review_checks).
    source: src-arxiv-2012-12392-v1
    quote: the PLAsTiCC training set is non-representative by design
capability_considered_and_rejected:
  - term: perception
    reason: The input is tabulated photometry, one flux per passband per visit, with catalogue
      metadata such as redshift, not a raw image or signal. Whether a light curve counts as a
      comparable raw signal is left to review.
  - term: probabilistic-forecasting
    reason: Every object's class exists in the simulation when the probabilities are submitted; it
      is withheld, not unresolved.
  - term: sample-efficiency
    reason: The labelled training set is small (7,848 objects), but no budget is fixed. The rules
      let entrants use other data, and the data note admits any outside knowledge.
    source: src-kaggle-plasticc-2018
    quote: You may use data, other than the Competition Data, as allowed on the Competition Website
      to develop and test your models and Submissions

evaluation_method:
  - uncertainty-calibration-score
evaluation_method_basis:
  reason: The metric is a log score over the emitted class probabilities, a proper scoring rule.
    Each class's log loss is averaged over that class's objects and weighted, 2 for rare or
    interesting classes and 1 for the rest, so each class counts roughly equally.
  source: src-kaggle-plasticc-2018
  quote: Submissions are evaluated using a weighted multi-class logarithmic loss
evaluation_method_considered_and_rejected:
  - term: classification-metric
    reason: The score is not a statistic of a confusion matrix or a score ranking such as F1 or
      AUROC; it applies a scoring rule to emitted probabilities, which the vocabulary assigns to
      uncertainty-calibration-score.
  - term: domain-metric
    reason: The class weighting is PLAsTiCC's own, but the underlying statistic is the log score of
      an emitted distribution, which domain-metric's exclusion test sends to
      uncertainty-calibration-score.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are classifiers trained from scratch on the challenge's labelled light curves for
    a task astronomy defines, mostly gradient-boosted trees and neural networks, often in ensembles.
    Most of the 1,315 entrants with known backgrounds were not astronomers; the term describes the
    model, not its builders.
  source: src-arxiv-2012-12392-v1
  quote: among them boosted decision trees, neural networks, and multi-layer perceptrons
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The models are trained for one task, but its classes and their physics come from
      astronomy, a scientific discipline, which that term's exclusion test sends to
      domain-specialist-model.
as_used:
  - protocol: Trained and tested on the user's own subsets of the Kaggle data, with the classes
      regrouped and scored by per-category AUCs, not the competition's weighted log loss over 15
      classes on the private two thirds.
    split: a 19,920-object test subset, with the 14 classes regrouped into five
    source: src-arxiv-2511-17564-v1
    quote: The original fourteen object classes were reorganized into five generalized categories
    note: A November 2025 bidirectional-LSTM paper, scored by ROC and precision-recall AUC per
      category, on full and partial light curves.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the data. A November 2025 paper trains and tests a
    classifier on it, and a 2026 paper calls PLAsTiCC the mainstream paradigm for building light
    curve classifiers. The competition ended in 2018, which goes to activity; ELAsTiCC was built for
    real-time alert streams, a purpose PLAsTiCC's full light curves did not cover, so the sources do
    not show it replacing PLAsTiCC (see lineage_note).
  source: src-arxiv-2511-17564-v1
  quote: a bidirectional LSTM network with masking layers was trained and evaluated on a test set of
    19,920 objects
activity: closed
activity_note: Kaggle's record gives the final deadline as 2018-12-17 and its final leaderboard as
  verified. In December 2020 the results paper said the competition stayed 'live' and took a few
  submissions after the deadline; Kaggle's late submissions were not read in 2026 and do not enter
  the ranking the challenge published (see review_checks).
activity_basis:
  reason: The Kaggle competition was the only route for scored entries, and it closed on 2018-12-17
    with its final leaderboard verified and three prizes awarded. No later round was announced; the
    successor challenge, ELAsTiCC, is a separate challenge.
  source: src-kaggle-plasticc-2018-record
  quote: '"deadline":"2018-12-17T23:59:00Z"'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Mike & Silogram (2nd place), seven bidirectional GRU networks and two LightGBM models
    source: src-arxiv-2012-12392-v1
    observed_on: 2026-10-14
    quote: joined forces to produce an ensemble solution of seven Recurrent Neural Network
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each object's class is the model the SNANA simulation drew it from; the
  unblinded metadata carries it as true_target.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The light curves and the unblinded test labels are on Zenodo under CC BY 4.0, and the
    results paper publishes the class weights, so anyone can score a classifier on the full test
    set. Which objects formed Kaggle's private two thirds is not in the release (see execution).
  source: src-zenodo-plasticc-unblinded-note
  quote: integer model class for all objects (post-challenge)

task:
  exists: true
  input:
    - 'light curves of one object in six passbands (ugrizY): time, flux, flux uncertainty and a detection
      flag per observation'
    - 'per-object metadata: sky position, Milky Way extinction, a host-galaxy photometric redshift, and
      a spectroscopic redshift for training objects and a small fraction of test objects'
  output: A probability for each of 15 classes, the 14 seen in training and class 99 for objects of
    none of them; Kaggle rescales each row to sum to one and clips it before scoring.
  scoring: Weighted multi-class log loss, lower is better. Each class's log loss is averaged over
    its objects and weighted (2 for rare or interesting classes, 1 for the rest; hidden until the
    results paper). The public leaderboard used a third of the test set and the official ranking the
    other two thirds.
  source: src-kaggle-plasticc-2018
  quote: For each object, you must submit a set of predicted probabilities (one for every category)

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The test set behind the score, labels included, has been downloadable from Zenodo since
      21 January 2019, without registration. fully-open's inclusion test judges a blind round once
      its ground truth is released.
    source: src-zenodo-plasticc-unblinded
    quote: the unblinded data files are included here
  access_by_phase:
    during_edition: train-open-test-held-out. Training light curves with labels and the test light
      curves without them, downloadable from Kaggle after accepting the competition rules, which
      limited use to the competition, research, education and other non-commercial purposes.
    during_edition_source: src-kaggle-plasticc-2018
    during_edition_quote: academic research and education, and other non-commercial purposes
    after_edition: fully-open. The unblinded metadata, with every object's true class, and all the
      light curves on Zenodo, no account needed, under CC BY 4.0.
    after_edition_source: src-zenodo-plasticc-unblinded-note
    after_edition_quote: Here we release the unblinded meta-data
  refresh: static
  refresh_basis:
    reason: One data set, released once. The unblinding added label and truth columns to the
      metadata; the light curves are those served on Kaggle, and no revision has followed.
    source: src-zenodo-plasticc-unblinded-note
    quote: The latter are the same as on Kaggle
  data_provenance:
    - simulation-generated
  data_provenance_note: Light curves simulated with SNANA under LSST observing conditions and
    cadence, from 18 models of transients and variables that astronomers contributed in answer to a
    2017 call. Some models are built from observed objects, others are theoretical. No light curve
    is a real observation.
  data_provenance_source: src-arxiv-2012-12392-v1
  data_provenance_quote: The PLAsTiCC data were simulated to mimic three years of an LSST-type
    survey
  contamination_risk: medium
  contamination_risk_note: The test labels have been public since January 2019, so any result
    produced after that can have seen them; no source read evidences a classifier tuned on them.
    During the competition the top teams set their class-99 probabilities by probing the public
    leaderboard (a third of the test set), and the hidden class weights were probed the same way;
    the ranking used the other two thirds.
  contamination_risk_source: src-arxiv-2012-12392-v1
  contamination_risk_quote: All of the top models that provided information on their handling of
  contamination_evidence: []
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The Zenodo release's licence. The Kaggle copy stays under the competition
    rules' terms (non-commercial use, no redistribution).
  dataset_licence_source: src-zenodo-plasticc-unblinded
  dataset_licence_quote: Creative Commons Attribution 4.0 International
  size:
    - count: 3492890
      unit: test objects, each with light curves in six passbands
      subset: test
      source: src-kaggle-plasticc-2018-record
      quote: '"totalSolutionRows":3492890'
    - count: 7848
      unit: labelled training objects
      subset: train
      note: The row count of the unblinded training metadata on Zenodo, counted on 2026-10-14, is
        the same. The data-set note, written before release, says 8000, and the results paper's
        section 5 says 7486.
      source: src-arxiv-2511-17564-v1
      quote: the first had 7848 objects
    - count: 15
      unit: classes, 14 represented in training and class 99 for objects of none of them
      source: src-arxiv-1810-00001-v1
      quote: separate the data into 15 classes, 14 of which are represented in the training sample
  submission_limit:
    max_submissions: 5
    period_days: 1
    per: team, during the competition
    source: src-kaggle-plasticc-2018

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The PLAsTiCC team of the LSST Dark Energy Science Collaboration (DESC) and the LSST
    Transients and Variable Stars Science Collaboration (TVS)
  maintainer_basis:
    reason: The two collaborations formed the team that built, validated and ran the challenge; the
      Zenodo release is credited to the PLAsTiCC Team (LSST-DESC and LSST TVS) and the starter kit
      sits in the LSSTDESC organisation on GitHub.
    source: src-arxiv-1810-00001-v1
    quote: As part of the collaborative effort, these two collaborations developed the PLAsTiCC team
  maintainer_type: community-collective
  maintainer_type_note: The team spans some twenty institutions, and the artefacts sit with the
    collaborations, not with one institution. The Kaggle rules name the Governing Council of the
    University of Toronto as Competition Sponsor, administering the LSST Corporation grant, so
    academic-lab was considered; the rules make it the legal sponsor of the competition, not the
    holder of the data.
  submission_process:
    - held-out-server
  submission_process_note: Entrants uploaded probability files for the whole test set to Kaggle,
    which scored a third of it on the public leaderboard and the other two thirds, unseen until the
    end, for the official ranking. Five submissions a day, two chosen for the final ranking.
  submission_process_source: src-arxiv-2012-12392-v1
  submission_process_quote: whereas the metric evaluated on the remaining two-thirds of the test
    data was the basis for the
  independence_flags:
    - flag: prize-sponsored-by-industry
      source: src-arxiv-2012-12392-v1
      quote: The awards for PLAsTiCC contest were generously supported by Kaggle
  independence_flags_note: Kaggle, the commercial host, funded the $25,000 in prizes; it ranks no
    system of its own. The rules let five team members who worked on the metric and design, not the
    data, compete fully, and the rest take part without winning; no source read shows that any of
    them entered, so maintainer-competes-on-own-benchmark is not set. Kaggle alone held the test
    labels during the competition, but they have been public since January 2019, so
    single-evaluator-private-test-set no longer holds.
  independence_assessed: true
  funding:
    source: src-kaggle-plasticc-2018
    quote: 'PLAsTiCC is funded through LSST Corporation Grant Award # 2017-03 and administered by the
      University of Toronto'
  participation:
    source: src-arxiv-2012-12392-v1
    quote: PLAsTiCC ran from Sep 28, 2018 until Dec 17, 2018, and received entries from 1094 teams
      around the world
  participation_note: Kaggle's competition record now counts 1,089 teams and 1,320 competitors.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The light curves, the unblinded test labels and the class weights are public, and the
      score is a closed formula, so anyone can score a classifier end to end on the full test set,
      as the results paper did for the top three. The competition's own private-leaderboard numbers
      cannot be recomputed exactly; the release does not mark which objects formed Kaggle's private
      two thirds.
    source: src-zenodo-plasticc-unblinded-note
    quote: integer model class for all objects (post-challenge)
  harness_availability: reference-implementation-only
  harness: plasticc-kit (the starter kit's classification demo, whose plasticc_log_loss implements
    the weighted log loss)
  harness_source: src-github-plasticc-kit-demo
  harness_quote: the official metric is always what is on Kaggle's leaderboard
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for LSSTDESC/plasticc-kit, read 2026-10-14; not a
    quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which test objects (the full unblinded set, Kaggle's public or private
  # part, or a user's own subset), which classes (all 15, the 14 without class 99, or a regrouping) and
  # which metric (the weighted log loss, unweighted, or AUCs); and what the classifier was trained on, since
  # outside data and augmentation were allowed.
  material_extra:
    - subset_used
    - training_data_policy

homepage: https://plasticc.org/
repository: https://github.com/LSSTDESC/plasticc-kit
dataset_url: https://doi.org/10.5281/zenodo.2539456
leaderboard_url: https://www.kaggle.com/c/PLAsTiCC-2018

lineage:
  role: root
lineage_note: A 2026 paper names ELAsTiCC, the Extended LSST Astronomical Time-series Classification
  Challenge, "the Extended PLAsTiCC", built to test real-time alert classification that PLAsTiCC's
  complete light curves left out. Not recorded as lineage.extended_by because ELAsTiCC has no entry;
  no source read says that ELAsTiCC replaces PLAsTiCC.
lineage_source: src-arxiv-2604-23792-v2
lineage_quote: The Extended PLAsTiCC (ELAsTiCC) was designed to stress-test such end-to-end
  real-time pipelines for light curve classification

history:
  - date: 2018-12-17
    event: channel-closed
    field: execution.submission_channel
    from: Kaggle competition PLAsTiCC-2018
    source: src-kaggle-plasticc-2018-record
    quote: '"deadline":"2018-12-17T23:59:00Z"'
    note: The final submission deadline; the three prize winners were announced in February 2019.
  - date: 2019-01-21
    event: access-changed
    field: data.access

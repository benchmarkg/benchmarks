  review_checks:
    - check: The entry is one benchmark with the two phases as editions, as the organisers present
        them. They differ in score, submission route, data and test sets, so two entries (TrackML
        Accuracy and TrackML Throughput) are the alternative.
      field: versions
      source: src-kaggle-trackml-particle-identification
      quote: This challenge consists of two phases
    - check: data.access is private-test-server, the Throughput phase's value, following
        fully-open's rule that the current edition decides. The Accuracy phase, whose Kaggle data is
        what current papers use, is train-open-test-held-out. compute_tier provided-allocation
        follows the same choice; the Accuracy phase ran on the entrants' own machines.
      field: data.access
    - check: refresh periodic-recompetition rests on each phase ranking on its own new test events.
        Two phases are hardly a recurring series; versioned-releases, two labelled datasets, is the
        alternative.
      field: data.refresh
    - check: scientific-prediction rests on the reconstructed hit-to-particle assignment being a
        state of the simulated collision. The papers frame the task as pattern recognition and leave
        the track parameters out, so perception alone may be the better call.
      field: capability
      source: src-arxiv-1904-06778-v3
      quote: deriving the track parameters is not the topic of the challenge
    - check: lifecycle active or mature. Results are still produced, but in a reduced pixel-only
        setting with its own metrics (as_used), not on the competition's protocol; with both phases
        closed and their records settled, mature is the alternative.
      field: lifecycle
      source: src-arxiv-2606-20437-v1
      quote: Following recent TrackML-based studies [2, 21, 32], we consider the pixel-detector
        setting of the benchmark
    - check: activity closed. Kaggle often scores late submissions on closed competitions; the
        record read does not say whether this one does, and a late score does not enter the ranked
        leaderboard. If late scoring is open, leaderboard-live-no-round might be argued.
      field: activity
      source: src-kaggle-trackml-particle-identification-record
      quote: '"finalLeaderboardHasBeenVerified":true'
    - check: maintainer_type community-collective, government-agency or academic-lab. CERN hosts the
        Kaggle competition and is its Competition Sponsor, and gave permission to use the dataset;
        the helper library is in the LAL (CNRS) organisation. No source read states CERN's legal
        status as an intergovernmental body.
      field: governance.maintainer_type
      source: src-kaggle-trackml-particle-identification
      quote: THE EUROPEAN ORGANIZATION FOR NUCLEAR RESEARCH (CERN)
    - check: prize-sponsored-by-industry rests on NVIDIA's GPU for the jury award (the site calls it
        a Titan V100, Kaggle a Tesla V100). Who paid the $25,000 cash prizes is unstated; if Kaggle,
        a platinum sponsor, did, the flag holds on that too.
      field: governance.independence_flags
      source: src-kaggle-trackml-particle-identification-record
      quote: '"reward":{"id":"USD","quantity":25000}'
    - check: ceiling theoretical-maximum is the accuracy score's bound of 1. The Throughput phase's
        combined score is unbounded, which would make none-known under the current-edition reading
        used for data.access.
      field: data.ceiling_anchor_type
      source: src-arxiv-2105-01160-v2
      quote: The score is an unbounded dimension-less positive number, the higher the better
    - check: The site and the Accuracy paper promised a release on CERN's Open Data portal. No
        record was found; the portal's search renders by script and its robots.txt disallows /api/,
        and a web search found none. dataset_url names the Zenodo record; if a CERN Open Data record
        exists, it may be the better pointer.
      field: dataset_url
      source: src-trackml-site
      quote: The challenge dataset will be released for further studies on CERN Open Data portal.
    - check: designed_for_subjects is domain-specialist-model, with classical-algorithm only in
        observed_subjects, though combinatorial trackers won the Throughput phase; evaluation_target
        is learned-system for the same reason. secondary_axes has latency for the mean time per
        event; throughput is the phase's own word.
      field: designed_for_subjects
      source: src-arxiv-2105-01160-v2
      quote: The Mikado approach for the TrackML challenge is a combinatorial algorithm.

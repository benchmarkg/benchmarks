versions:
  - version: accuracy
    label: Accuracy phase (Kaggle; an IEEE WCCI 2018 competition)
    version_kind: edition
    released: 2018-04-30
    items: 125
    changes: The first phase, scored on accuracy alone with no limit on run time. 8,850 training
      events with truth; 125 test events, 36 on the public leaderboard and 89 for the final ranking,
      scored on Kaggle from uploaded track assignments.
    breaking: true
    errata:
      - scope: dataset
        description: The simulation overestimated multiple Coulomb scattering for electrons (at most
          0.5% of particles) and used a wrong strip thickness for cluster sizes. Both were corrected
          for the Throughput phase, and checked not to affect the Accuracy results.
        source: src-arxiv-2105-01160-v2
    frozen: true
    sources:
      - src-kaggle-trackml-particle-identification
      - src-kaggle-trackml-particle-identification-record
      - src-arxiv-1904-06778-v3
      - src-arxiv-1904-06778
      - src-zenodo-trackml-accuracy
      - src-arxiv-2105-01160-v2
  - version: throughput
    label: Throughput phase (Codalab; a NeurIPS 2018 competition)
    version_kind: edition
    released: 2018-09-03
    items: 50
    changes: Entrants uploaded code that the organisers ran on 2 CPU cores, and the score combined
      the accuracy with the mean time per event. A corrected dataset (electron scattering, strip
      thickness, a 55 mm beam spot instead of 5.5 mm), secondary particles left out of the accuracy,
      and 50 undisclosed test events, with the final scores re-measured on a private set.
    breaking: true
    frozen: true
    sources:
      - src-arxiv-2105-01160-v2
      - src-arxiv-2105-01160
      - src-zenodo-trackml-throughput
      - src-trackml-site


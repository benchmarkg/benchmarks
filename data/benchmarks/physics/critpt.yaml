# data/benchmarks/physics/critpt.yaml
#
# P3-S5-T04. Promoted from P3-S2-T07's Epoch stub (data/benchmarks/_stubs/critpt.yaml) so the bridge claims
# have a benchmark to stand on, and filled from CritPt's paper (arXiv 2509.26574v4, 2026-05-08; v1 2025-09-30).
# Every quote below is checked by the quote-substring validator against that Source's committed extract.
#
# What this entry is here to carry (14-roadmap Phase 3, P3-S5): a physics benchmark that only language
# models sit, so its claims are LLM-run however physical the domain (none counts toward the >=60 non-LLM
# claims), and the clearest case of tools moving a score -- GPT-5 (high) at 5.7% bare, 10.6% with a code
# interpreter and 12.6% with web search added, on one model at one reasoning effort.

id: critpt
name: CritPt
aliases:
  - Complex Research using Integrated Thinking - Physics Test
tagline: Unpublished, research-level physics challenges with machine-checkable answers, graded on a
  private test set.
description: >
  Seventy-one research-scale physics challenges, written by more than fifty active researchers from their
  own unpublished work across condensed matter, quantum, atomic and optical, high-energy, astro- and
  statistical physics and more, each with a guess-resistant answer -- a number, a symbolic expression
  or a
  composite of them -- that an automated pipeline grades. The challenges are also split into 190 smaller
  checkpoints. One challenge is public as an example; the answers to the other seventy are private, and
  models are scored through the maintainers' online grading server.
self_description:
  source: src-arxiv-2509-26574
  quote: the first benchmark designed to test LLMs on unpublished, research-level reasoning tasks
    that broadly covers modern physics research areas
external_ids:
  epoch: CritPt
  arxiv: '2509.26574'
paper:
  title: 'Probing the Critical Point (CritPt) of AI Reasoning: a Frontier Physics Research Benchmark'
  arxiv: '2509.26574'
  version_read: v4
  source: src-arxiv-2509-26574
released: 2025-09-30
released_note: The paper's first arXiv version; Epoch's benchmark_metadata.csv gives the same date.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/physics-reasoning
  secondary: []
domain_basis:
  reason: Physics problems posed in text and scored on the physics answer, with no simulation in the
    loop -- the leaf's definition -- across most of modern physics.
  source: src-arxiv-2509-26574
  quote: including condensed matter, quantum physics, atomic, molecular & optical physics,
    astrophysics, high energy physics, mathematical physics, statistical physics, nuclear physics
capability:
  - quantitative-reasoning
capability_basis:
  quantitative-reasoning:
    reason: Each challenge ends in a number or symbolic expression the model must derive, graded by
      value or by symbolic equivalence, not by prose.
    source: src-arxiv-2509-26574
    quote: Every problem is hand-curated to admit a guess-resistant and machine-verifiable answer
capability_considered_and_rejected:
  - term: tool-use
    reason: Tools are a condition of a result here, not what is scored -- the same model is reported
      with and without them, and the claims carry tools_allowed.
  - term: knowledge-recall
    reason: The problems are unpublished research, so the answer cannot be recalled; recalled
      physics is a means, not the score.

evaluation_method:
  - numeric-tolerance-match
  - symbolic-equivalence
evaluation_method_basis:
  reason: The grader compares numbers and, for symbolic answers, checks equivalence with SymPy.
  source: src-arxiv-2509-26574
  quote: 'Symbolic expressions: For problems involving symbolic algebra, we use a hierarchical grading
    script based on SymPy'

designed_for_subjects:
  - reasoning-model
  - instruction-tuned-model
  - tool-augmented-model
designed_for_subjects_basis: >
  The paper evaluates reasoning models and general-purpose chat models side by side, and GPT-5 with a
  code
  interpreter and with web search as well -- tool-augmented-model's own example in 02 (CritPt's ~4% bare
  against ~10% with code tools).

lifecycle: active
lifecycle_basis:
  reason: New (2025), with an online grading server for continuing evaluation. Saturation is
    computed from the claims (12 S4), never set here.
  source: src-arxiv-2509-26574
  quote: We provide a secured public evaluation pipeline and online grading server
activity: accepting-submissions
activity_basis:
  reason: Model developers submit to the grading server and are scored against the private answers.
  source: src-arxiv-2509-26574
  quote: we provide a public evaluation pipeline with an online grading server.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-5 (high, code & web)
    source: src-arxiv-2509-26574
    observed_on: 2026-10-05
    quote: GPT-5 (high, code & web) 12.6 21.4 24.5 10.0 14.4 17.6
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each challenge's expert answer, written with the problem and kept private
  for the seventy test challenges.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Anyone can score a model through the public pipeline and grading server; nobody outside
    the maintainers can grade without it, since the answers are private.
  source: src-arxiv-2509-26574
  quote: enabling independent validation and continual monitoring of frontier model progress

task:
  exists: true
  input:
    - one research challenge stated in text, with its symbols, conventions and units
  output: A final answer -- a number, a symbolic expression or a composite of them -- in a fixed
    template, produced in a second, formatting turn after the solving turn.
  scoring: Accuracy over the seventy test challenges, averaged over five independent runs per model;
    graded automatically against the expert answer.
  tests_hidden_from_system: true
  source: src-arxiv-2509-26574
  quote: To disentangle the reasoning process from answer formatting, we adopt a two-step generation
    strategy

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_basis:
    reason: The test answers are private and scoring goes through the maintainers' server; one
      challenge is public as an example.
    source: src-arxiv-2509-26574
    quote: While the answers to 70 CritPt test challenges are kept private to mitigate data leakage
  refresh: static
  refresh_basis:
    reason: One set of 71 challenges, described once in the paper; no versioning is announced.
    source: src-arxiv-2509-26574
    quote: CritPt consists of 71 composite research challenges designed to simulate full-scale
      research projects at the entry level
  data_provenance:
    - expert-authored
  data_provenance_note: Written for the benchmark by active physics researchers from their own
    research, and unpublished, so not drawn from any public corpus.
  data_provenance_source: src-arxiv-2509-26574
  data_provenance_quote: All problems are newly created by over 50 active physics researchers based
    on their own research.
  contamination_risk: low
  contamination_risk_note: >
    Unpublished problems with private answers, designed so that the answers cannot be found by web
    search -- which is why a model with web search scores only slightly more than with a code
    interpreter alone. The one public example challenge is not in the test set.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: Every challenge has an expert answer the grader accepts, so every one is solvable by
      construction; no human score is reported to anchor against.
    source: src-arxiv-2509-26574
    quote: Every problem is hand-curated to admit a guess-resistant and machine-verifiable answer
  size:
    n_items:
      value: 70
      unit: challenges
      split: test
      source: src-arxiv-2509-26574
      quote: While the answers to 70 CritPt test challenges are kept private
    other_splits:
      - value: 190
        unit: checkpoints
        split: checkpoints over all 71 challenges
        source: src-arxiv-2509-26574
        quote: which are also decomposed to 190 simpler checkpoint tasks for more fine-grained
          insights
  size_note: 71 challenges, one public as an example and seventy in the private test set.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The CritPt team (Argonne National Laboratory and the University of Illinois
    Urbana-Champaign, with contributors from more than thirty institutions)
  maintainer_basis:
    reason: The equal-contribution lead authors are at Argonne and UIUC, as are most of the core
      team.
    source: src-arxiv-2509-26574
    quote: 'Minhui Zhu Minyang Tian Affiliation: Argonne National Laboratory'
  maintainer_type: academic-lab
  submission_process:
    - held-out-server
  submission_process_note: Developers run their models through the public pipeline and the server
    grades the answers against the private key.
  submission_process_source: src-arxiv-2509-26574
  submission_process_quote: we provide a public evaluation pipeline with an online grading server.
  independence_flags: []
  independence_flags_note: None recorded. The maintainers evaluate other labs' models and enter none
    of their own.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: Models are called through their providers' APIs and graded by script; the paper reports
      the cost of each run in API spend.
    source: src-arxiv-2509-26574
    quote: We evaluate eight proprietary models across four major providers (OpenAI, Google,
      DeepSeek, Anthropic) using Inspect AI
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_note: A third party can obtain a score only through the maintainers' grading
    server, since the answers are private; nobody can regrade a run without it.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: The CritPt evaluation pipeline, on Inspect AI
  harness_source: src-arxiv-2509-26574
  harness_quote: using Inspect AI
  runnable_via:
    - inspect
  maintainer_rerun_policy: unstated

comparability:
  # The profile holds tools, reasoning effort, shots, chain of thought, retries and the subset. Three more
  # change a CritPt number and the paper records each (Table 5, A.3): the API snapshot that names the exact
  # model; the selection over runs, since the headline is an average of five independent runs and a single
  # run or a best-of-five would differ; and the harness, the CritPt pipeline on Inspect AI with its two-step
  # solve-then-format protocol.
  material_extra:
    - provider_snapshot
    - selection_strategy
    - harness
headline_metric: critpt-challenge-accuracy

homepage: https://critpt.com/
metrics:
  - critpt-challenge-accuracy

tags:
  - physics
  - research-level
  - private-test-set

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P3-S5-T04)
  added_on: 2026-10-05
  last_verified: 2026-10-05
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2509-26574
    - src-epoch-benchmark-data
  sources_note: >
    The paper (a DOI, so not archived), read as its v4 PDF; its extract keeps windows around the cited
    passages. Epoch's export supplies the release date. critpt.com and the grading server were not read.
  confidence: medium
  notes: |
    Reviewer checks:
    - contamination_risk low rests on the problems being unpublished and the answers private; no
      contamination study is cited, and low needs none.
    - reproducibility not-independently-reproducible because only the maintainers can grade; a
      reviewer who reads the grading server as a third-party route may prefer fully-automatable.

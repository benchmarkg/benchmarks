# data/benchmarks/physics/the-well.yaml
#
# P1-S3-T01, checkpoint entry 7 of 10 (copilot on: the F6 copilot's extractive drafter gave the title, arXiv
# id, release date and repository). Filled from The Well's paper, arXiv 2412.00568 read as its v2 PDF
# (2025-02-21), and its abstract page, and from the repository README. Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts.

id: the-well
name: The Well
tagline: 15 TB of numerical simulations across 16 physical systems, for benchmarking learned
  surrogate models of spatiotemporal dynamics.
description: >
  A collection of 16 datasets of numerical simulations (about 15 TB), contributed by domain scientists:
  fluid dynamics, magnetohydrodynamics, acoustics, reaction-diffusion and active matter, among others,
  up to supernova and neutron-star-merger simulations. Each is split into train, validation and test sets.
  The benchmark asks a surrogate model to predict the next snapshot of a simulation from earlier ones.
  It is scored by variance-scaled RMSE, one step ahead and averaged over windows of longer autoregressive
  rollouts. The paper's baselines (FNO, TFNO, U-net, CNextU-net) are time-boxed to 12 hours on one H100.
self_description:
  source: src-arxiv-2412-00568-v2
  quote: 'we introduce the Well: a large-scale collection of datasets containing numerical simulations
    of a wide variety of spatiotemporal physical systems'
external_ids:
  arxiv: '2412.00568'
paper:
  title: 'The Well: a Large-Scale Collection of Diverse Physics Simulations for Machine Learning'
  arxiv: '2412.00568'
  version_read: v2
  source: src-arxiv-2412-00568-v2
released: 2024-11-30
released_note: The paper's first arXiv version, as the abstract page dates it (NeurIPS 2024 Datasets
  and Benchmarks).
released_source: src-arxiv-2412-00568
released_quote: Submitted on 30 Nov 2024

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/simulation-surrogates
  secondary:
    - physics/fluid-dynamics
domain_basis:
  reason: Every dataset scores a learned model against the solver it would replace, which is
    simulation-surrogates' definition whatever the system. Most of the sixteen are fluid,
    magnetohydrodynamic or astrophysical-fluid flows, so fluid-dynamics is secondary.
  source: src-arxiv-2412-00568-v2
  quote: covering diverse domains such as biological systems, fluid dynamics, acoustic scattering,
    as well as magneto-hydrodynamic simulations of extra-galactic fluids or supernova explosions
capability:
  - scientific-prediction
capability_basis:
  scientific-prediction:
    reason: A model predicts the next state of a physical system from earlier states, and is scored
      against what the numerical solver produced.
    source: src-arxiv-2412-00568-v2
    quote: These baselines are trained on the forward problem - predicting the next snapshot of a
      given simulation from
capability_considered_and_rejected:
  - term: long-horizon-execution
    reason: Longer rollouts are scored, but as error accumulated in prediction, not as carrying out
      a long task.

evaluation_method:
  - statistical-fit
evaluation_method_basis:
  reason: VRMSE is an RMSE scaled by the target's variance, a goodness-of-fit statistic on
    continuous fields, reported one step ahead and over rollout windows.
  source: src-arxiv-2412-00568-v2
  quote: VRMSE is scaled such that predicting the mean value of the target field results in a score
    of 1
designed_for_subjects:
  - scientific-surrogate-model
designed_for_subjects_basis:
  reason: The entrants are learned models that stand in for the numerical solvers and are scored
    against the solvers' output.
  source: src-arxiv-2412-00568-v2
  quote: Machine learning based surrogate models offer researchers powerful tools for accelerating
    simulation-based workflows

lifecycle: active
lifecycle_basis:
  reason: Not observed. The sources read are the 2024-2025 paper and the README, and neither shows
    whether results are still being produced. The repository was pushed on 2026-07-23 (GitHub API),
    which is maintenance evidence, not use, and a search of recent arXiv abstracts found none that
    names it. dormant's exclusion test says to leave the field null and log it, but the schema
    requires a value (default active), so active stands for a benchmark under two years old whose
    maintainers still work on it. Stage 3 logged the same silence (2026-09-28-the-well-003, still
    open).
  source: src-github-the-well-readme
  quote: We hope that the community will build upon these results to develop better architectures
    for PDE surrogate modeling
activity: no-submission-channel
activity_basis:
  reason: The README's benchmark section offers a training script and the baselines' checkpoints,
    and no leaderboard or submission route; results appear in users' papers.
  source: src-github-the-well-readme
  quote: The repository allows benchmarking surrogate models on the different datasets that compose
    the Well

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: FNO
    source: src-github-the-well-readme
    observed_on: 2026-10-10
    quote: to run the training script of default FNO architecture on the active matter dataset
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each dataset's numerical solver output (Dedalus, Athena++, Clawpack and
  others).
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Data, splits, training script and baselines are public; the cost is storage and compute.
  source: src-github-the-well-readme
  quote: you can use the `the-well-download` command to download any dataset of The Well

task:
  exists: true
  input:
    - one or more past snapshots of a simulated physical field, on its grid
  output: The next snapshot, and by feeding predictions back, a rollout.
  scoring: VRMSE on each dataset's test split, averaged over physical fields, one step ahead and
    over rollout windows; datasets are reported separately.
  source: src-arxiv-2412-00568-v2
  quote: Table 2 reports the one-step Variance Scaled Root Mean Squared Error (VRMSE)

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every dataset and split is downloadable, and most stream from Hugging Face.
    source: src-github-the-well-readme
    quote: you can use the `the-well-download` command to download any dataset of The Well
  refresh: versioned-releases
  refresh_basis:
    reason: Content changes are dated and named. One dataset was deprecated for processing errors
      and replaced by a _v2, and the original is kept for comparison.
    source: src-github-the-well-readme
    quote: The dataset `viscoelastic_instability` has been deprecated due to processing errors in
      the data
  data_provenance:
    - simulation-generated
  data_provenance_note: Numerical simulations run by the contributing domain scientists with their
    own solvers.
  data_provenance_source: src-arxiv-2412-00568-v2
  data_provenance_quote: The Well draws from domain experts and numerical software developers to
    provide 15TB of data across 16 datasets
  contamination_risk: unknown
  contamination_risk_note: Test splits are public. Foundation models for continuum dynamics now
    pretrain on collections that may include the Well's data, and whether they exclude its test
    splits was not assessed.
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: The code is BSD-3-Clause (GitHub's licence metadata); the data's licence was
    not read.
  size_note: 16 datasets, 6.9 GB to 5.1 TB each, about 15 TB in all.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Polymathic AI, with collaborators from the Flatiron Institute and other institutions
  maintainer_basis:
    reason: The README names Polymathic AI as the project's lead; the code sits in its organisation
      account.
    source: src-github-the-well-readme
    quote: This project has been led by the Polymathic AI organization
  maintainer_type: nonprofit
  maintainer_type_note: Polymathic AI is a research collaboration hosted at the Flatiron Institute
    (Simons Foundation), a nonprofit; no source read here states its legal form. A reviewer who
    finds it formally multi-party should consider community-collective.
  submission_process:
    - literature-only
  independence_flags: []
  independence_flags_note: None recorded; there is no ranking of its own. The maintainers' later
    models (for example Walrus, 2025) are evaluated in their own papers.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Public data and a training-and-evaluation library run end to end with no human or
      maintainer-only step.
    source: src-arxiv-2412-00568-v2
    quote: we provide a unified PyTorch interface for training and evaluating models
  harness_availability: official-harness
  harness: the_well (the benchmark's training and evaluation library)
  harness_source: src-github-the-well-readme
  harness_quote: The benchmark relies on [a training script]
  code_licence: BSD-3-Clause
  code_licence_note: GitHub's licence metadata for PolymathicAI/the_well, read 2026-10-10; not a
    quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which datasets of the sixteen, one-step or rollout scoring and over which
  # window, and the training budget (the paper time-boxes baselines to 12 hours on one H100).
  material_extra:
    - subset_used
    - hardware
  material_waived:
    - field: lead_time
      reason: The facet pair statistical-fit x scientific-surrogate-model resolves the forecasting
        profile, but nothing here is forecast; a next-snapshot prediction of a stored simulation has
        no horizon.
    - field: resolution_window
      reason: Same resolution as lead_time; nothing resolves later, the solver labels exist now.

homepage: https://polymathic-ai.org/the_well/
repository: https://github.com/PolymathicAI/the_well

tags:
  - pde-surrogates
  - fluid-dynamics
  - simulation
  - scientific-machine-learning


# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2604-14451-v1
    - src-arxiv-2604-14451
    - src-arxiv-2611-10228-v1
    - src-arxiv-2611-10228
    - src-fair-universe-site-2026-11
    - src-fair-universe-weak-lensing-phase1-site
    - src-fair-universe-weak-lensing-phase2-site
    - src-fair-universe-weak-lensing-phase1-guidelines
    - src-github-cosmology-challenge-readme
    - src-github-cosmology-challenge-phase1-overview
    - src-github-cosmology-challenge-phase1-evaluation
    - src-github-cosmology-challenge-phase2-overview
    - src-github-cosmology-challenge-phase2-data
    - src-github-cosmology-challenge-final-eval-overview
    - src-zenodo-fair-universe-weak-lensing
  sources_note: >
    The two papers' v1 PDFs (DOIs, not archived) read as text, with windows clear of their author lists,
    contact lines and the participant names that serve as team labels in the Phase 1 paper's results;
    their abstract pages for the dates. The project's home page, the challenge's Phase 1 and Phase 2 winners
    pages and the Phase 1 final-submission guidelines, with scripts and styles stripped; the two winners
    pages are withheld from archiving because they name prize winners and list participants' account names,
    and the home page because one news item names a person.
    Codabench's competition pages render by script and its API answered this project's fetcher with a
    bot check, so they were read as the Markdown the challenge repository keeps for them (the Phase 1
    overview and evaluation, the Phase 2 overview and data, and the final-submission page), with the README,
    at commit 5ed6c02. The two overviews are withheld because their Credits sections name the organisers,
    and the final-submission page because it names an image under a personal account and carries
    invitation links. Zenodo's record of the public dataset (a DOI). A linked Phase 2 results summary,
    hosted on
    a third-party site under a personal account name, was not read.
  confidence: medium
  review_checks:
    - check: The two phases are recorded as editions of one benchmark, as trackml's two phases are.
        The 04 S4 edition test (same task, new items) fails for Phase 2, which changes the task, the
        output and the metric. But both are one named challenge, planned together by one maintainer
        on one simulation suite, so a new Benchmark (another maintainer, or independently versioned
        and cited) does not fit either. The two tasks as subsets of one release, as DCASE's tasks
        are, are the alternative, and two entries are a third.
      field: versions
      source: src-github-cosmology-challenge-phase1-overview
      quote: Participants may enter either Phase 1, Phase 2, or both phases to win the prize.
    - check: No capability term records out-of-distribution detection, Phase 2's whole claim, so it
        is missing from the coverage matrix; bench tag-gap logged it as a missing term
        (2026-11-27-fair-universe-weak-lensing-001), beside isic-challenge's for open-set
        recognition. distribution-shift-generalization was weighed and rejected because its
        definition is holding up under shift, not flagging it.
      field: capability
      specialist: true
      source: src-arxiv-2604-14451-v1
      quote: participants have to tackle this problem by developing methods for OoD detection
    - check: data.access is private-test-server, Phase 2's value, on the reading that the later
        edition decides (as in trackml). Phase 1, whose holdout maps were sent to finalists, is
        train-open-test-held-out. compute_tier provided-allocation and ceiling_anchor_type
        theoretical-maximum follow the same choice; Phase 1 ran on the entrants' own machines, and
        its score has no finite top, which would make the ceiling none-known.
      field: data.access
      source: src-fair-universe-weak-lensing-phase1-guidelines
      quote: After we receive your summary write-up and example code, we will share a holdout
        dataset with you.
    - check: composite rests on Phase 1's score adding a Gaussian log score and a squared-error
        penalty with a fixed weight; read as one penalised scoring rule, it would be
        uncertainty-calibration-score alone. classification-metric for Phase 2's mean TPR over a
        fixed FPR range was preferred to domain-metric, which LUNA16's FROC near miss takes.
      field: evaluation_method
      source: src-github-cosmology-challenge-phase1-evaluation
      quote: The second term is an MSE loss with weight $\lambda=10^3$ to penalize bad point
        estimates.
    - check: lifecycle active rests on Phase 2's results (2026-10-30) and the Phase 1 paper
        (2026-11-06), both the organisers' own. mature is the alternative once the record settles,
        and under-revision if the promised test-set release and the planned further data releases
        are read as an announced reissue.
      field: lifecycle
      source: src-arxiv-2611-10228-v1
      quote: We plan for a series of data releases towards a permanent community benchmark.
    - check: activity closed. Codabench's API answered with a bot check, so whether either
        competition still scores late submissions was not read; between-rounds would fit if a third
        phase is announced.
      field: activity
    - check: This entry and fair-universe-higgsml share a maintainer and a programme, and the white
        paper builds on the Higgs challenge. 04 S4 gives no lineage edge, since this is another task
        on other data rather than a derivative or successor of its items, so none is recorded.
        fair-universe-higgsml says the weak-lensing challenges are other benchmarks and should name
        this id.
      field: lineage
      source: src-arxiv-2604-14451-v1
      quote: These include the FAIR Universe HiggsML uncertainties challenge [17]
    - check: Dates disagree across the sources. Phase 2 launched on 2026-04-22 (site news) or
        2026-04-28 (its Codabench overview, used here), and its final ranking is dated 2026-10-25,
        2026-10-26 or 2026-10-30. The Phase 2 winners page calls it Phase 2 of the NeurIPS 2025
        challenge, though it ran as a NeurIPS 2026 competition. Codabench's own phase dates were not
        read.
      field: versions
      source: src-fair-universe-weak-lensing-phase2-site
      quote: Phase 2 of the NeurIPS 2025 Weak Lensing ML Uncertainty Challenge has come to an end.
    - check: Phase 2's design changed between the 2025 pages, which announced a log-loss on each
        map's in-distribution probability, and the 2026 run, scored by the mean TPR at low FPR. The
        2026-08-12 test-set regeneration is recorded as an erratum of phase-2, since the leaderboard
        was reset.
      field: versions
      source: src-github-cosmology-challenge-phase1-evaluation
      quote: Participants' models should determine the probability $p_i$ that the given dataset is
        consistent with the training data.
    - check: maintainer-competes-on-own-benchmark is not set, since no affiliation in the sources
        read shows an organising group among the ranked entrants. A Phase 2 jury-prize winner lists
        the University of California, Berkeley, where organisers also are, which the 2026-11-18 rule
        does not count. The method paper of a Phase 1 prize team (arXiv 2604.09621, the Phase 1
        paper's reference 39) and the paper the white paper's OoD figure is adapted from (arXiv
        2505.00632, its reference 43) were not read for their affiliations; a reviewer may check
        them, since only an affiliation can set the flag. Who paid the prizes is unstated.
      field: governance.independence_flags
    - check: Codabench was not read (bot check on its API), so the submission limits, participant
        counts, phase dates and leaderboard rows of competitions 8934 and 10902 are unrecorded;
        data.submission_limit and liveness.leaderboard_last_updated are left unset. The site's copy
        of the Phase 1 leaderboard is dated 2025-11-17.
      field: data.submission_limit
      source: src-fair-universe-weak-lensing-phase1-site
      quote: 'Phase 1 Codabench Leaderboard Last updated: November 17, 2025'
  unreachable:

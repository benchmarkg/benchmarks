versions:
  - version: phase-1
    label: Phase 1, cosmological parameter inference (NeurIPS 2025; Codabench 8934)
    version_kind: edition
    released: 2025-08-29
    items: 10020
    changes: The first phase. Point estimates and one-sigma uncertainties of Omega_m and S8 for each
      map, scored by a Gaussian negative log-likelihood plus 1,000 times the squared error. The
      training maps reuse 256 random seeds across the 101 cosmologies. The public leaderboard
      (result submissions only) scored 4,000 maps of the training cosmologies until 2025-11-15;
      finalists then predicted holdout A (6,000 maps of the training cosmologies) and holdout B
      (4,020 maps of 10 unseen ones), ranked on A, on B and on their average. Winners were announced
      on 2025-12-07.
    breaking: true
    frozen: true
    sources:
      - src-fair-universe-site-2026-11
      - src-fair-universe-weak-lensing-phase1-guidelines
      - src-fair-universe-weak-lensing-phase1-site
      - src-github-cosmology-challenge-phase1-overview
      - src-github-cosmology-challenge-phase1-evaluation
      - src-arxiv-2611-10228-v1
      - src-arxiv-2611-10228
  - version: phase-2
    label: Phase 2, out-of-distribution detection (NeurIPS 2026; Codabench 10902)
    version_kind: edition
    released: 2026-04-28
    items: 10000
    changes: A different task on the same simulation suite. One continuous OoD score for each map,
      some test maps having been generated under other physical models that entrants never see,
      scored by the mean TPR at 100 log-spaced FPRs between 0.001 and 0.05. New training
      realizations with no seeds shared across cosmologies (the Zenodo release) and a 10,000-map
      public test set; methods that use test maps collectively were barred from the final ranking.
      The public phase ran to 2026-10-11; finalists then packaged their models, which the organisers
      ran on a private 10,000-map holdout, and the winners were announced on 2026-10-30. The 2025
      Phase 1 pages had announced a log-loss on an in-distribution probability for this phase
      instead.
    breaking: true
    errata:
      - date: 2026-08-12
        scope: Phase 2 public test set
        description: A problem in the released test set (numerical problems, per the data page) led
          the organisers to regenerate every test realization, with the physics unchanged, as the v2
          file; earlier submissions were invalidated and the public leaderboard was reset.
        source: src-github-cosmology-challenge-phase2-overview
    frozen: true
    sources:
      - src-fair-universe-site-2026-11
      - src-github-cosmology-challenge-phase2-overview
      - src-github-cosmology-challenge-phase2-data
      - src-github-cosmology-challenge-final-eval-overview
      - src-fair-universe-weak-lensing-phase2-site
      - src-arxiv-2604-14451-v1
      - src-arxiv-2604-14451
      - src-zenodo-fair-universe-weak-lensing
      - src-github-cosmology-challenge-readme

subsets:

# data/benchmarks/physics/fair-universe-weak-lensing.yaml
#
# P1-S12 sweep follow-up: a new physics entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from the challenge's white paper, arXiv 2604.14451 read as its v1 PDF (2026-04-15), and its abstract
# page; the Phase 1 dataset-and-results paper, arXiv 2611.10228 read as its v1 PDF (2026-11-06), and its abstract
# page; the FAIR Universe home page, the challenge's Phase 1 and Phase 2 winners pages and the Phase 1
# final-submission guidelines on fair-universe.lbl.gov (scripts and styles stripped); the
# FAIR-Universe/Cosmology_Challenge README and five of the Codabench page texts the repository keeps (the Phase 1
# overview and evaluation, the Phase 2 overview and data, and the Phase 2 final-submission page), all at commit
# 5ed6c02 (2026-11-17); and Zenodo's record of the public dataset (20056065). Codabench's API (competitions 8934
# and 10902) answered with a bot check and was not read. Every quote below is checked by the quote-substring
# validator against those Sources' committed extracts.

id: fair-universe-weak-lensing
name: FAIR Universe Weak Lensing ML Uncertainty Challenge
aliases:
  - Weak Lensing ML Uncertainty Challenge
  - Weak Lensing Uncertainty Challenge
  - FAIR Universe Weak Lensing Machine Learning Uncertainty Challenge
  - NeurIPS 2025 Weak Lensing Uncertainty Challenge
  - NeurIPS 2026 Weak Lensing Uncertainty Challenge
tagline: 'Simulated HSC-like weak-lensing maps: cosmological parameters with uncertainties (2025), then
  OoD detection (2026).'
description: >
  A two-phase NeurIPS competition and dataset from the FAIR Universe project, led by Lawrence Berkeley
  National Laboratory, on simulated weak gravitational lensing convergence maps that mimic the Hyper Suprime-Cam
  Year-3 survey (one tomographic bin of its WIDE12H field, 1424 x 176 pixels at 2 arcmin). The maps come
  from N-body simulations ray-traced for 101 flat LambdaCDM cosmologies in (Omega_m, S8), with baryonic
  feedback (T_AGN, f0) and a photometric-redshift shift as nuisance parameters; the training set holds
  256 noiseless maps per cosmology (25,856), and entrants add the shape noise. Phase 1 (NeurIPS 2025;
  Codabench, 2025-08-29 to 2025-11-15) asked for point estimates and one-sigma uncertainties of Omega_m
  and S8 for each map, scored by a Gaussian negative log-likelihood plus a weighted squared error. Finalists
  then predicted two holdout sets, new realizations of the training cosmologies (A) and of 10 unseen cosmologies
  (B), and prizes went on A and on the average of A and B. Phase 2 (NeurIPS 2026; Codabench, 2026-04-28
  to 2026-10-11) asked instead for a continuous out-of-distribution score for each map, some test maps
  being generated under other physical models, scored by the mean true-positive rate at 100 false-positive
  rates from 0.001 to 0.05. Its final ranking came from the organisers running each finalist's packaged
  inference code on a private 10,000-map holdout, and the winners were announced on 2026-10-30. No submission
  route is open. An upgraded training set, with independent realizations for each cosmology, is on Zenodo
  under CC BY 4.0, and a labelled 14,000-map test set from 82 unseen cosmologies is promised for after
  Phase 2.
self_description:
  source: src-arxiv-2604-14451-v1
  quote: we present the first weak lensing benchmark dataset with several realistic systematics and
    launch the FAIR Universe Weak Lensing Machine Learning Uncertainty Challenge
external_ids:
  arxiv: '2604.14451'
paper:
  title: 'FAIR Universe Weak Lensing ML Uncertainty Challenge: Handling Uncertainties and Distribution
    Shifts for Precision Cosmology'
  arxiv: '2604.14451'
  version_read: v1
  source: src-arxiv-2604-14451-v1
released: 2025-08-29
released_note: The date the project's news list gives for launching Phase 1 on Codabench. The white
  paper, which describes both phases, followed on 2026-04-15 (src-arxiv-2604-14451), and the Phase 1
  dataset-and-results paper on 2026-11-06 (src-arxiv-2611-10228).
released_source: src-fair-universe-site-2026-11
released_quote: Weak Lensing Uncertainty Challenge Phase 1 Launched August 29, 2025
release_venue: NeurIPS 2025 Competition Track (Phase 1) and NeurIPS 2026 Competition Track (Phase 2)
release_venue_note: Phase 2's place among the NeurIPS 2026 competitions is on its Codabench overview
  (src-github-cosmology-challenge-phase2-overview) and the project's news list.
release_venue_source: src-arxiv-2611-10228-v1
release_venue_quote: targeting cosmological parameter inference with uncertainty quantification
  (Phase 1; one of the NeurIPS 2025 competitions) and out-of-distribution detection (Phase 2)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/astrophysics-cosmology
  secondary: []
domain_basis:
  reason: The scored quantities are cosmological, the matter density Omega_m and the clustering
    amplitude S8 with their uncertainties in Phase 1 and whether a map departs from the simulated
    cosmological model in Phase 2, inferred from maps built to mimic a survey's observations, which
    is the leaf's definition. PLAsTiCC and the strong-lens challenge, the leaf's examples, are
    likewise scored on simulated survey data.
  source: src-arxiv-2604-14451-v1
  quote: Participants are required not only to provide point estimates of (Ωm, S8), but also to
    quantify the associated uncertainties
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: Entrants infer parameters from, or flag, maps that the N-body and ray-tracing pipeline
      made; none stands in for that simulation, and no score compares an emulator with it. One Phase
      1 prize team trained an optimal-transport emulator, but only to pre-train its network.
  - term: physics/particle-physics
    reason: FAIR Universe's other challenge, fair-universe-higgsml, is this leaf, but the data here
      are lensing maps of the large-scale structure, not collision or detector data.
  - term: agents-tooluse/research-agents
    reason: A Phase 1 prize team developed its network with an LLM multi-agent planning system, and
      two final submissions were agent-assisted, but the challenge scores the trained model's
      predictions (in Phase 2, its inference code), not an agent's conduct of the research.
    source: src-arxiv-2611-10228-v1
    quote: explicitly AI-agent-assisted pipelines each appeared in 2 submissions
capability:
  - scientific-prediction
  - calibration-uncertainty
capability_basis:
  scientific-prediction:
    reason: Systems infer Omega_m and S8, properties of the simulated universe, from its lensing
      maps, and the score compares them with the parameters each map was simulated with.
    source: src-arxiv-2611-10228-v1
    quote: targeting cosmological parameter inference with uncertainty quantification (Phase 1; one
      of the NeurIPS 2025 competitions) and out-of-distribution detection (Phase 2)
  calibration-uncertainty:
    reason: Phase 1's score consumes the one-sigma uncertainty each submission emits for each
      parameter, through a Gaussian negative log-likelihood beside the point estimate.
    source: src-github-cosmology-challenge-phase1-evaluation
    quote: The first term corresponds to the Kullback–Leibler (KL) divergence (up to some constants)
      between the true posterior distribution and the Gaussian distribution with the predicted mean
      and standard deviation.
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: Phase 2 is built around distribution shift, but it scores how well a system flags maps
      from other physical models, not how well it holds up on them, which is the term's definition;
      no term records out-of-distribution detection (taxonomy/_failures, review_checks). Phase 1's
      holdout B scores unseen cosmologies drawn from the training priors, which the paper calls
      interpolation.
    source: src-arxiv-2611-10228-v1
    quote: the holdout set (B) probes interpolation and generalization to unseen cosmological models
  - term: sample-efficiency
    reason: The organisers stress the small training set, 101 cosmologies set by the cost of the
      simulations, but no budget is enforced. One Phase 1 prize team pre-trained on 100,000
      simulations of its own, and Phase 2 allows the Phase 1 training data as well.
    source: src-github-cosmology-challenge-phase2-data
    quote: Participants are allowed to include the Phase-1 (InD) training data into their training
      data

evaluation_method:
  - uncertainty-calibration-score
  - statistical-fit
  - composite
  - classification-metric
evaluation_method_basis:
  reason: >
    Phase 1's score is minus the mean over maps of a Gaussian negative log-likelihood of the emitted means
    and one-sigma uncertainties of Omega_m and S8 (a log score, uncertainty-calibration-score) plus 1,000
    times their squared error (statistical-fit), summed into one figure (composite). Phase 2's score is
    the mean true-positive rate of the emitted OoD scores at 100 log-spaced false-positive rates from
    0.001 to 0.05, a partial-ROC statistic against the maps' InD and OoD labels (classification-metric).
  source: src-github-cosmology-challenge-phase1-evaluation
  quote: The second term is an MSE loss with weight $\lambda=10^3$ to penalize bad point estimates.
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Phase 2's score averages the true-positive rate over a fixed false-positive range, as
      LUNA16's FROC does, but its rates are the general ROC ones and nothing in it is defined only
      within cosmology; the organisers motivate the range by the significance levels of anomaly
      detection.
    source: src-arxiv-2604-14451-v1
    quote: will be evaluated by the mean values of the ROC curve over N = 100 logarithmically spaced
      FPRs between 0.001 and 0.05
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: Entrants are inference pipelines built for weak-lensing cosmology and trained on the
    challenge's simulations. The Phase 1 prize solutions are CNN ensembles with domain-specific
    augmentation, a Vision Transformer conditioned on power spectra, peak counts and Minkowski
    functionals, and a CNN pre-trained on emulated maps; the baselines are a power-spectrum MCMC
    analysis, CNNs and, for Phase 2, an autoencoder.
  source: src-arxiv-2611-10228-v1
  quote: we propose a Vision Transformer (ViT) architecture conditioned on handcrafted domain
    features from cosmology
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The models are trained for one task, but the task, cosmological inference under nuisance
      parameters, is defined by cosmology, which that term's exclusion sends to
      domain-specialist-model, as for fair-universe-higgsml.
  - term: scientific-surrogate-model
    reason: A submission infers parameters from maps or flags them; it does not emulate the
      simulation.
  - term: classical-algorithm
    reason: Summary-statistic analyses are admitted and the power-spectrum analysis is a baseline,
      but the challenge is built for learned methods, and the best higher-order-statistics entry
      trailed them on the Phase 1 public board.
    source: src-arxiv-2611-10228-v1
    quote: the best score achieved by a higher-order-statistics-based method on the public
      leaderboard is 9.1654
  - term: agent-scaffold
    reason: Agent-assisted development appears among the Phase 1 final submissions, but what is
      scored is the trained model's output, not an agent.
    source: src-arxiv-2611-10228-v1
    quote: explicitly AI-agent-assisted pipelines each appeared in 2 submissions

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced. Phase 2's ranking was published on 2026-10-30 and its
    winners present at NeurIPS in December 2026, and the Phase 1 dataset-and-results paper appeared
    on 2026-11-06. With no submission route open, mature is the alternative once the record settles;
    the promised test-set release and the further data releases the paper plans could make it
    under-revision (see review_checks).
  source: src-fair-universe-site-2026-11
  quote: Phase-2 Winners October 30, 2026 We have announced the winners of the Weak Lensing
    Uncertainty Challenge Phase-2
activity: closed
activity_note: Phase 1's public phase on Codabench (competition 8934) ended on 2025-11-15, its
  finalists predicted the holdout sets afterwards, and its winners were announced on 2025-12-07.
  Phase 2's public phase (competition 10902) ended on 2026-10-11 and its final model submissions on
  2026-10-20; the final ranking is dated 2026-10-25 on the final-submission page, 2026-10-26 on the
  Phase 2 overview and 2026-10-30 in the site's news. No third phase is announced; the organisers
  say the dataset will be released permanently as a benchmark. Whether Codabench still scores late
  submissions was not read, since its API answered with a bot check.
activity_basis:
  reason: Codabench was the only route for entering results; both phases have ended and been
    decided, and no further round is announced.
  source: src-github-cosmology-challenge-phase2-overview
  quote: competition had ended on October 11th 2026

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Transatlantic Dream Team's Neural Summaries from Emulated Simulations (an EfficientNetV2
      CNN pre-trained on emulated maps; second on Phase 1 leaderboards A and C)
    source: src-arxiv-2611-10228-v1
    observed_on: 2026-11-27
    quote: We use a Convolutional Neural Network (CNN) to predict the mean and (log-) standard
      deviation of the cosmological parameters directly from the high-dimensional convergence maps
  - system: The organisers' Phase 2 autoencoder baseline (a convolutional autoencoder whose
      reconstruction error gives the OoD score)
    source: src-arxiv-2604-14451-v1
    observed_on: 2026-11-27
    quote: We train a convolutional autoencoder (AE) on the training set, which contains only InD
      realizations drawn from the fiducial cosmological prior.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each map's Omega_m and S8 (Phase 1), and whether it was generated with the
  training simulation's physics or under another model (Phase 2), both set by the organisers'
  simulation pipeline.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The official scores need truth that the organisers hold, Phase 1's holdout labels and
    Phase 2's private holdout, which only they ran, and both Codabench phases have closed. A
    labelled 14,000-map test set from 82 unseen cosmologies is promised for after Phase 2 but is not
    out in the sources read, so others can score only their own splits of the public training data.
  source: src-zenodo-fair-universe-weak-lensing
  quote: The held-out test set will be released after the end of Phase 2 competition.

task:
  exists: true
  input:
    - one noisy weak-lensing convergence map, 1424 x 176 pixels at 2 arcmin inside the HSC Y3
      WIDE12H mask, from one tomographic redshift bin
    - for training, 101 cosmologies x 256 noiseless maps, each labelled with Omega_m and S8 and the
      nuisance parameters T_AGN, f0 and Delta z; the entrant adds the shape noise
  output: 'Phase 1: point estimates of Omega_m and S8 and their one-sigma uncertainties for each map.
    Phase 2: one continuous OoD score for each map, larger for a map more likely out of distribution,
    computed from that map alone.'
  scoring: 'Phase 1: minus the mean over maps of the sum, over the two parameters, of (error/sigma)^2
    + log sigma^2 + 1000 error^2; the public leaderboard used 4,000 maps of the training cosmologies,
    and the final leaderboards holdout A, holdout B and their average. Phase 2: the mean TPR at 100 log-spaced
    FPRs between 0.001 and 0.05, where random scores give 0.0128; the public leaderboard used 10,000 maps
    and the final ranking a private 10,000-map holdout, half of it OoD.'
  tests_hidden_from_system: true
  source: src-arxiv-2604-14451-v1
  quote: Participants are not provided with any OoD examples nor information about the underlying
    generative process.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: The value is Phase 2's, the later edition, whose final holdout never left the
    organisers, who ran each finalist's packaged model on it. Phase 1 was train-open-test-held-out,
    with the training data and the 4,000 public test maps downloadable and their truth withheld, and
    the holdout maps sent to finalists to predict (see review_checks). Codabench registration asked
    for an affiliation address.
  access_basis:
    reason: Phase 2's final ranking ran the finalists' packaged models on a private holdout that
      entrants never received.
    source: src-github-cosmology-challenge-phase2-overview
    quote: The submitted methods will be evaluated on a private holdout dataset to determine the
      final rankings and prize winners.
  access_by_phase:
    during_edition: Training data and public test maps downloadable from Codabench after registering
      with an institutional address, and predictions on the public maps scored against withheld
      truth. Phase 1's finalists predicted holdout maps sent to them; Phase 2's finalists submitted
      inference code, which the organisers ran on a private holdout.
    after_edition: The upgraded training set (101 x 256 maps with independent realizations) is on
      Zenodo under CC BY 4.0, with the starting kits and scoring code on GitHub. The holdout truth
      stays with the organisers, a labelled 14,000-map test set from 82 unseen cosmologies is to
      follow Phase 2, and no submission route is open.
    after_edition_source: src-zenodo-fair-universe-weak-lensing
    after_edition_quote: Creative Commons Attribution 4.0 International
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each phase ranked entrants on evaluation data new to it, and Phase 2 came with a new
      training release, though the task changed between them. Two phases are hardly a recurring
      series (see review_checks).
    source: src-github-cosmology-challenge-phase2-data
    quote: in contrast to the Phase-1 training data, which were produced using only $256$ random
      seeds
  data_provenance:
    - simulation-generated
  data_provenance_note: N-body simulations (MP-Gadget and FastPM, three nested boxes per cosmology)
    ray-traced through the HSC Y3 footprint and redshift distribution, with baryonic feedback
    applied through an HMcode transfer function and a shift of the photometric redshifts. Phase 2's
    OoD maps come from other physical models that the organisers have not described.
  data_provenance_source: src-arxiv-2611-10228-v1
  data_provenance_quote: Each map is generated by running cosmological simulations [20, 21] and a
    ray-tracing algorithm [22–24]
  contamination_risk: low
  contamination_risk_note: Training on the simulated maps is the protocol, and the holdout truth was
    never released. Phase 1's public test set reused the 101 training cosmologies, so its
    leaderboard rewarded fitting that grid, which the paper calls an overfitting risk rather than
    leakage. Phase 1's finalists held the unlabelled holdout maps while predicting them; Phase 2
    barred methods that use test maps collectively and ran the final models on a private holdout.
  contamination_risk_source: src-arxiv-2611-10228-v1
  contamination_risk_quote: repeated use of the public leaderboard for model development may
    increase the risk of overfitting to this discrete set of cosmological models
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: Phase 2's score, the later edition's, is a mean of true-positive rates
    and so at most 1. No measured ceiling is published; random scores give 0.0128, and the best
    baseline, the power-spectrum analysis, 0.2143 on the public test set. Phase 1's score has no
    finite top, which would make none-known on a Phase 1 reading (see review_checks).
  ceiling_anchor_type_source: src-arxiv-2604-14451-v1
  ceiling_anchor_type_quote: will be evaluated by the mean values of the ROC curve over N = 100
    logarithmically spaced FPRs between 0.001 and 0.05
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The licence of the Zenodo release, the upgraded training set. Phase 1's
    training set and both phases' public test sets were downloaded from Codabench under the
    competition's terms, and no licence for them was read.
  dataset_licence_source: src-zenodo-fair-universe-weak-lensing
  dataset_licence_quote: Creative Commons Attribution 4.0 International
  size:
    - count: 25856
      unit: noiseless training maps (101 cosmologies x 256 realizations)
      subset: training set (Phase 1, and the upgraded Zenodo release with the same shape)
      source: src-arxiv-2611-10228-v1
      quote: yielding a total of 101 × 256 = 25,856 training maps
    - count: 4000
      unit: maps of the training cosmologies, scored on the public leaderboard
      subset: Phase 1 public test set
      source: src-arxiv-2611-10228-v1
      quote: The dataset contains 4,000 realizations of weak lensing maps
    - count: 6000
      unit: maps, new realizations of the 101 training cosmologies
      subset: Phase 1 holdout A
      source: src-arxiv-2611-10228-v1
      quote: (A) 6,000 realizations from the simulations with the original 101 cosmological models
        in the training data
    - count: 4020
      unit: maps of 10 cosmologies not in the training data
      subset: Phase 1 holdout B
      source: src-arxiv-2611-10228-v1
      quote: (B) 4,020 realizations from the simulations with 10 cosmological models that were not
        seen in the training data
    - count: 10000
      unit: noisy maps, some generated under other physical models
      subset: Phase 2 public test set (v2 of 2026-08-12)
      source: src-github-cosmology-challenge-phase2-data
      quote: The public test dataset for this competition contains 10,000 noisy convergence maps.
    - count: 10000
      unit: maps, 5,000 in distribution and 5,000 out of distribution
      subset: Phase 2 private holdout
      source: src-fair-universe-weak-lensing-phase2-site
      quote: The holdout dataset contains 10,000 samples, where the number of InD and OoD maps are
        both 5,000.
    - count: 14000
      unit: labelled maps from 82 cosmologies not in the training set, to be released after Phase 2
      subset: held-out test set (not yet released)
      source: src-zenodo-fair-universe-weak-lensing
      quote: consists of 14k convergence maps with corresponding labels, drawn from 82 cosmological
        models that are not present in the training set

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The FAIR Universe collaboration, led by Lawrence Berkeley National Laboratory with the
    Institute for Advanced Study, Université Paris-Saclay, the University of Washington and ChaLearn
  maintainer_basis:
    reason: The project's site, on lbl.gov, names the collaboration's members; the FAIR-Universe
      GitHub organisation holds the challenge repository, and the white paper's and the dataset
      record's authors are at those institutions and at UC Berkeley, Stanford, SLAC and Toronto.
    source: src-fair-universe-site-2026-11
    quote: The FAIR Universe project is a collaboration between and include scientists from Lawrence
      Berkeley National Laboratory, Université Paris-Saclay, University of Washington, Institute for
      Advanced Study, and ChaLearn.
  maintainer_type: government-agency
  maintainer_type_note: As for fair-universe-higgsml, the holder rule names the lead laboratory, a
    national laboratory whose domain carries the site and the contact address. The first-listed
    organisers are at the Institute for Advanced Study and LBNL, so academic-lab was considered;
    neither the institute nor the universities or ChaLearn hold the site or the repository.
  submission_process:
    - held-out-server
    - sandboxed-rerun
  submission_process_note: >
    Public phases, held-out-server: entrants uploaded predictions on the public test maps (result submissions
    only), which Codabench scored against withheld truth. Phase 1's final ranking was held-out-server
    too: finalists sent a write-up and code for review, received the holdout maps and submitted predictions,
    which the organisers scored. Phase 2's final ranking was sandboxed-rerun: finalists submitted a ZIP
    holding a model.py inference class, with no training allowed, checked on a Codabench page that ran
    it on AWS in the organisers' Docker image, and the organisers then ran it on the private holdout.
    The entrant hands over code, not a container of its own, so containerized-algorithm-submission was
    not used, as for fair-universe-higgsml.
  submission_process_source: src-github-cosmology-challenge-final-eval-overview
  submission_process_quote: Organizers will download participants' Codabench model submissions and
    evaluate on the holdout dataset to determine the final rankings
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-github-cosmology-challenge-phase2-overview
      quote: The submitted methods will be evaluated on a private holdout dataset to determine the
        final rankings and prize winners.
  independence_flags_note: The organisers held both phases' holdout truth, and Phase 2's holdout
    maps, and scored every final entry. Both phases paid cash prizes; no source read names who paid
    them (the project is funded by the Department of Energy), so prize-sponsored-by-industry is
    neither set nor excluded, and no-known-conflict is not claimed. Phase 1's winning teams joined
    the dataset paper as co-authors after the competition. No affiliation in the sources read shows
    an organising group among the ranked entrants, so maintainer-competes-on-own-benchmark is not
    set (see review_checks).
  independence_assessed: true
  funding:
    source: src-fair-universe-site-2026-11
    quote: The project is funded by the Department of Energy
  participation:
    source: src-arxiv-2611-10228-v1
    quote: (first 10 entries out of 1759)
  participation_note: 1,759 is the number of entries on the Phase 1 public leaderboard, which the
    paper gives in passing. Codabench's participant and submission counts for either phase were not
    read (bot check).
  known_limitation:
    source: src-arxiv-2611-10228-v1
    quote: repeated use of the public leaderboard for model development may increase the risk of
      overfitting to this discrete set of cosmological models

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: provided-allocation
  compute_tier_basis:
    reason: Phase 2's official scores came from running each finalist's inference code on compute
      the organisers supply, a Codabench page on AWS with one NVIDIA L40S GPU and the organisers'
      Docker image; training was the entrant's own. In Phase 1 entrants ran everything themselves
      and uploaded predictions (see review_checks).
    source: src-github-cosmology-challenge-final-eval-overview
    quote: Codabench will directly run your model using an AWS instance and a predefined Docker
      image to produce your score.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The official rankings need holdout truth, and for Phase 2 holdout maps, that only the
      organisers hold, and both Codabench phases have closed. Until the promised 14,000-map test set
      is out, others can score only splits of the public training data.
    source: src-zenodo-fair-universe-weak-lensing
    quote: The held-out test set will be released after the end of Phase 2 competition.
  reproducibility_blockers:
    - private-test-set
  harness_availability: official-harness
  harness: 'FAIR-Universe/Cosmology_Challenge: the Codabench ingestion and scoring programs, six starting-kit
    notebooks (three baselines per phase), the baseline model submissions and the Docker build'
  harness_note: At commit 5ed6c02 (2026-11-17) the scoring program computes Phase 2's score only;
    Phase 1's scorer is not in the tree, though its formula is on the Phase 1 evaluation page (the
    tree and score.py were read through GitHub and are not cited).
  harness_source: src-github-cosmology-challenge-phase1-overview
  harness_quote: This repository hosts the code for testing submissions, as well as the starting kit
    notebooks
  code_licence: null
  code_licence_note: GitHub's licence metadata for FAIR-Universe/Cosmology_Challenge reports no
    licence (read 2026-11-27), the tree at 5ed6c02 has no LICENSE file, and the README states none.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the profile: which phase and which items (Phase 1's public test set, holdout A, holdout B or their
  # average; Phase 2's public test set, v1 or v2, or its private holdout; or a user's own split of the public
  # training data), and what the system was trained on (Phase 1's shared-seed training set, the upgraded Zenodo
  # release, both, or extra simulations of the entrant's own).
  material_extra:
    - subset_used

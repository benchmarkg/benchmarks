# data/benchmarks/physics/strong-lens-finding-challenge.yaml
#
# P1-S6-T06, physics entry 16. Filled from the first edition's results paper, arXiv 1802.03609 read as its v3 PDF
# (2019-03-20, the version accepted by A&A), and its abstract page; the Bologna Lens Factory's challenge page and
# the second edition's scoring note, both read from 2022 Wayback captures because the host refused connections on
# 2026-10-14; the v1 PDF of the second edition's winning team's paper (arXiv 2203.09536, March 2022); and the v1
# PDF of a Euclid Collaboration paper that draws on the second edition's training set (arXiv 2411.16808, A&A
# 2025). Every quote below is checked by the quote-substring validator against those Sources' committed extracts.

id: strong-lens-finding-challenge
name: Strong Gravitational Lens Finding Challenge
aliases:
  - Gravitational Lens Finding Challenge
  - Strong Gravitational Lensing Challenge
  - SGLC
  - Bologna Lens Challenge
  - Lens Finding Challenge 2.0
tagline: Finding strong gravitational lenses in simulated Euclid- and KiDS-like images, scored by
  ROC AUC and F-beta (2016-2020).
description: >
  An open challenge run by the Bologna Lens Factory, R. Benton Metcalf's group at the University of
  Bologna, to find galaxy-scale strong gravitational lenses in simulated survey images, held in two
  editions. In the first (25 November 2016 to 5 February 2017) two separate challenges could be
  entered: 100,000 single-band 101x101-pixel cutouts mimicking Euclid's visible imaging, and 100,000
  four-band (u, g, r, i) cutouts modelled on the Kilo-Degree Survey, 15% of them real KiDS galaxy
  images with simulated lensed sources added. Lenses were ray-traced with GLAMER through halos from
  the Millennium simulation, with background sources from the Hubble Ultra Deep Field. Entrants
  trained on 20,000 labelled cutouts per challenge, then had 48 hours from downloading the test set
  to return a score between 0 and 1 for every candidate. Entries were scored by the area under the
  ROC curve, the criterion entrants were told to optimise; the results paper (A&A, 2019) adds TPR0
  and TPR10, the true-positive rate before the first and before the tenth false positive, because
  real lenses are rare. Its 24 valid entries included visual inspection, arc and ring finders, SVMs
  and CNNs. The second edition (2019-2020) used improved simulations in Euclid's VIS and NISP J, Y
  and H bands, 100,000 training and 100,000 test objects, and ranked entries by the maximum F-beta
  score with beta squared 0.001, which weights precision; an Einstein-radius estimate could also be
  submitted, scored by mean squared error. Its winner, C. Bom et al.'s CAST entry, was announced on
  28 February 2020, and the detailed report the page promised has not appeared in the sources read.
  The first edition's test sets and truth tables were released after it closed.
self_description:
  source: src-blf-lens-finding-challenge-site
  quote: These open challenges are designed as a friendly way of stimulating activity and helping to
    quantify results in this regard.
external_ids:
  arxiv: '1802.03609'
paper:
  title: The Strong Gravitational Lens Finding Challenge
  arxiv: '1802.03609'
  doi: 10.1051/0004-6361/201832797
  version_read: v3
  source: src-arxiv-1802-03609-v3
released: 2016-11-25
released_note: The first edition's opening date, as the results paper gives it. The paper's first
  arXiv version is dated 2018-02-10 and its journal version is A&A 625, A119 (2019).
released_source: src-arxiv-1802-03609-v3
released_quote: The challenge was opened on November 25, 2016 and closed on February 5, 2017.
release_venue: The Bologna Lens Factory's challenge page; the first edition's results in A&A 625,
  A119 (2019)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/astrophysics-cosmology
  secondary:
    - vision/classification
domain_basis:
  reason: The scored quantity is whether a galaxy-scale strong gravitational lens is present in each
    cutout, an astronomical property of the simulated system, inferred from imaging built to mimic
    Euclid and KiDS observations. The vision task underneath, assigning each cutout to lens or
    non-lens, is the secondary, as the vision family's exclusion test directs for Earth-system and
    clinical targets; that test does not name astronomy (see review_checks). PLAsTiCC, the other
    astronomical challenge in the family, is filed the same way.
  source: src-arxiv-1802-03609-v3
  quote: Participants were asked to classify 100,000 candidate objects as to whether they were
    gravitational lenses or not
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: The images come from a lensing simulation, but entrants classify them; no learned model
      stands in for the simulator or is scored against its output.
capability:
  - perception
  - scientific-prediction
  - distribution-shift-generalization
capability_basis:
  perception:
    reason: The input is raw image cutouts, one band or four, and the score measures whether the
      lensed arcs and rings were recovered from them.
    source: src-blf-lens-finding-challenge-site
    quote: The challenge data set consists of 100,000, 101px x 101px images in each of four bands
      (I,G,R,U).
  scientific-prediction:
    reason: The challenge's claim is that methods identify which systems are gravitational lenses, a
      property of the simulated physical system, and each answer is scored against the simulation's
      truth for that cutout.
    source: src-arxiv-1802-03609-v3
    quote: Participants were asked to classify 100,000 candidate objects as to whether they were
      gravitational lenses or not
  distribution-shift-generalization:
    reason: In the first edition's ground-based set, 15% of the test cutouts were real KiDS galaxy
      images with simulated lensed sources added, while the training sets were simulated. The paper
      reports ROC curves on that subset as a condition of its own, and every method, human
      inspection included, did less well on it (see review_checks).
    source: src-arxiv-1802-03609-v3
    quote: shows the ROC curves for only the ground-based images where an actual KiDS image was used
capability_considered_and_rejected:
  - term: calibration-uncertainty
    reason: Entrants return a score between 0 and 1 for every candidate, but the score is consumed
      only through a swept threshold. AUROC, TPR0, TPR10 and the maximum F-beta are unchanged by any
      order-preserving rescaling, so no confidence is scored for calibration; CAFA and LUNA16 were
      decided the same way.
  - term: sample-efficiency
    reason: The labelled training sets are fixed (20,000 cutouts per challenge in the first edition,
      100,000 in the second), but no budget is scored as a condition.

evaluation_method:
  - classification-metric
evaluation_method_basis:
  reason: The first edition scored the area under the ROC curve, and the paper adds TPR0 and TPR10,
    true-positive rates at the first and the tenth false positive. The second edition ranked by the
    maximum over thresholds of the F-beta score with beta squared 0.001. All are general statistics
    of the score ranking or the confusion matrix.
  source: src-blf-lens-finding-challenge-site
  quote: The area under the ROC will be used as a figure of merit for evaluating the methods.
evaluation_method_considered_and_rejected:
  - term: statistical-fit
    reason: The second edition also took an optional Einstein-radius estimate for each lens, scored
      by mean squared error, but the ranking used F-beta and no source read reports such a score.
    source: src-blf-lens-finding-challenge-scoring
    quote: In this case the MSE (mean squared error) will be used for scoring the submissions.
  - term: domain-metric
    reason: TPR0 and TPR10 are named by the paper, but each is a true-positive rate at a fixed count
      of false positives, a general statistic of the score ranking.
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The challenge sought automated lens finders for coming surveys. Most entrants were CNNs
    and SVMs trained from scratch on the challenge's simulated images for this astronomical task;
    others were arc and ring finders and lens-model fitting with no learned component, such as
    Arcfinder's elongation measure and YattaLensLite.
  source: src-arxiv-1802-03609-v3
  quote: A variety of methods were used including visual inspection, arc and ring
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The classifiers are trained for one task, but its target, a strong gravitational lens,
      is defined by astrophysics, which that term's exclusion test sends to domain-specialist-model.
observed_subjects:
  values:
    - domain-specialist-model
    - classical-algorithm
    - human-expert
  basis: Two of the first edition's entries (Manchester1 and Manchester2) were visual inspection by
    two astronomers, who examined all 100,000 images of each set in 48 hours, beside CNNs, SVMs and
    arc finders.
  source: src-arxiv-1802-03609-v3
as_used:
  - protocol: The second edition's winners report their method after the challenge on 80,000 of the
      100,000 released training objects, held out from their own 20,000-object training sample and
      scored by ROC AUC, precision-recall AUC and F-beta, not on the challenge's test set.
    split: 80,000 objects of the second edition's training set
    source: src-arxiv-2203-09536-v1
    quote: The remaining 80k images are used as an independent test set for network performance
      assessment.
    note: Bom et al. (2022), the CAST team. They use the training catalogue's lens definition, by
      which 49,213 of the 100,000 objects are lenses.

lifecycle: mature
lifecycle_basis:
  reason: Both editions have ended and the first's results are published. The data are still drawn
    on (a 2025 Euclid Collaboration paper samples its simulated lenses' redshifts and magnitudes
    from the second edition's training set), but no 2025-2026 paper read reports results on either
    edition's test sets, and the host serving the data refused connections on 2026-10-14 (see
    review_checks).
  source: src-arxiv-2411-16808-v1
  quote: The redshifts and magnitudes were sampled from the second strong gravitational lens finding
    challenge training data set
activity: closed
activity_note: The first edition took no entries after 2017-02-05. The second edition's deadline is
  given as 31 January (an update of 29 December 2019) and as 7 February, and its winner was
  announced on 2020-02-28. No third edition is announced in the sources read.
activity_basis:
  reason: The submission forms on the challenge page were the only route for entries, and both
    editions have closed and been decided; the page calls the first expired.
  source: src-blf-lens-finding-challenge-site
  quote: Update Feb. 28, 2020 We have a winner!!

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: CMU-DeepLens-Resnet-ground3 (a residual CNN; best AUROC on the first edition's
      ground-based set)
    source: src-arxiv-1802-03609-v3
    observed_on: 2026-10-14
    quote: CMU-DeepLens-Resnet-ground3 had the best AUROC for the ground-based set
  - system: CAST (Cast_efficient_auc, a two-branch EfficientNet; winner of the second edition)
    source: src-arxiv-2203-09536-v1
    observed_on: 2026-10-14
    quote: This work presents the Deep Learning strategies and methodology used to design the
      highest-scoring algorithm in the II SGLC.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each cutout's label is whether a simulated lensed source was added and, in
  the second edition, whether the catalogue's source magnification and pixel count pass the lens
  definition. One real KiDS galaxy in the first edition turned out to be a lens itself.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The second edition posted its test images without their truth, and no source read releases
    it. The first edition's truth tables were released, so its sets could be scored by anyone
    holding a copy, but the host serving them refused connections on 2026-10-14 and no mirror was
    found.
  source: src-blf-lens-finding-challenge-site
  quote: 'Test sets will soon be available: Data pack of images (19 GB)'

task:
  exists: true
  input:
    - 'a 101x101-pixel image cutout of a candidate: one band (space-based, Euclid-like) or four bands
      u, g, r, i (ground-based, KiDS-like) in the first edition'
    - in the second edition, a 200x200-pixel VIS image at 0.1 arcsec and 66x66-pixel NISP J, Y and H
      images at 0.3 arcsec
  output: A score between 0 and 1 for every candidate, higher meaning more confident that it is a
    lens; in the second edition, optionally an Einstein-radius estimate for each lens.
  scoring: 'First edition: AUROC over the 100,000 candidates of each set, which entrants were told to
    optimise; the paper also reports TPR0 and TPR10 and recomputes all three after cuts on Einstein radius,
    lensed flux and lensed-image size. Second edition: the maximum over thresholds of F-beta with beta
    squared 0.001, with a lens defined by cuts on the catalogue; the Einstein radius by mean squared error.'
  tests_hidden_from_system: true
  source: src-arxiv-1802-03609-v3
  quote: The participants had 48 hours to upload a

# --- Data ------------------------------------------------------------------------------------

data:
  access: train-open-test-held-out
  access_note: The current (second) edition decides. Its training images and catalogue and its test
    images were posted on the challenge page, the test set with no truth. The first edition's test
    sets and truth tables were released after it ended, which alone would be fully-open. The host
    serving both refused connections on 2026-10-14, so no official copy of either could be reached.
  access_basis:
    reason: The second edition's page offers the training set with a log of lens properties, and the
      test set as images only.
    source: src-blf-lens-finding-challenge-site
    quote: 'Test sets will soon be available: Data pack of images (19 GB)'
  access_by_phase:
    during_edition: train-open-test-held-out. Labelled training cutouts could be downloaded at any
      time; the first edition's test set went to a registered team, with 48 hours to return scores.
    during_edition_source: src-arxiv-1802-03609-v3
    during_edition_quote: To enter the contest, the participants needed to register with a team name
    after_edition: The first edition's ground- and space-based test sets were posted with their
      truth tables (fully-open); the second edition's test truth is not posted in the sources read.
    after_edition_source: src-blf-lens-finding-challenge-site
    after_edition_quote: The Challenge is over and many people have asked for the data sets and
      truth tables.
  refresh: periodic-recompetition
  refresh_basis:
    reason: Each edition was ranked on new simulated data, the second with improved simulations and
      different bands; the organisers planned at least two such generations.
    source: src-blf-lens-finding-challenge-site
    quote: Challenge 2.0 is an improvement in the simulated images over 1.0 and a change in the
      bands.
  data_provenance:
    - simulation-generated
    - real-world-instrument
  data_provenance_note: Lenses come from halos and galaxies of the Millennium N-body simulation and
    its semi-analytic model, ray-traced with GLAMER, with noise and PSFs set to mimic Euclid or
    KiDS. Background sources are Hubble Ultra Deep Field galaxies decomposed into shapelets, and 15%
    of the first edition's ground-based test cutouts are real KiDS galaxy images with simulated
    sources added.
  data_provenance_source: src-arxiv-1802-03609-v3
  data_provenance_quote: Creating the mock images started with a cosmological Nbody simulation
  contamination_risk: medium
  contamination_risk_note: Training on the released training sets is the protocol. The first
    edition's test truth has been public since the challenge ended, so any later result on those
    sets can have seen it; no source read evidences a classifier tuned on it. The second edition's
    test truth is not public in the sources read.
  contamination_evidence: []
  dataset_licence: null
  dataset_licence_note: No licence is stated on the challenge page or in the papers read.
  size:
    - count: 100000
      unit: candidate cutouts per test set (one band space-based; four bands ground-based, 400,000
        images)
      subset: first edition, each of the two challenges
      source: src-arxiv-1802-03609-v3
      quote: These data sets contained 100,000 candidates.
    - count: 20000
      unit: labelled training cutouts per band
      subset: first edition, each of the two challenges
      source: src-arxiv-1802-03609-v3
      quote: a training set of 20,000 images in each band was provided for download at any time
    - count: 100000
      unit: objects in each of the training and test sets, each in four bands
      subset: second edition
      source: src-blf-lens-finding-challenge-site
      quote: The training and the test sets consists of 100,000 images in each band.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The Bologna Lens Factory (R. Benton Metcalf's group, Department of Physics and
    Astronomy, University of Bologna)
  maintainer_basis:
    reason: The Bologna Lens Factory organised both editions and produced their data, which its
      portal on a University of Bologna server hosts; the group's ERC grant, with Metcalf as PI,
      funded it.
    source: src-arxiv-2203-09536-v1
    quote: thank to the Bologna Lens Factory team for organizing the II Strong Gravitational Lensing
      Challenge
  maintainer_type: academic-lab
  maintainer_type_note: The page, the data and the submission route sit with one university group.
    The first edition's paper has 36 authors because the authors of valid entries were invited to
    join it, which does not make them holders.
  submission_process:
    - held-out-server
  submission_process_note: 'First edition: a registered team downloaded the test set, uploaded a score
    for every candidate within 48 hours through a form, and was sent a report; later entries were accepted
    but could not win. Second edition: a two-column CSV through a web form, scored by F-beta. The organisers
    held the truth and scored every entry.'
  submission_process_source: src-blf-lens-finding-challenge-site
  submission_process_quote: You will be sent a report evaluating your entry.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-1802-03609-v3
      quote: images were provided to participants although all the information was stored for
        analysing the challenge entries
  independence_flags_note: The organisers held the truth and scored every entry in both editions.
    The first edition's truth tables were later released, the second's are not in the sources read,
    so the flag stands for the current edition. No organiser team appears among the first edition's
    24 entries. Metcalf is a co-author of the second edition's winning team's 2022 paper; no source
    read puts him on the team during the challenge, so maintainer-competes-on-own-benchmark is not
    set (see review_checks). No prizes are mentioned.
  independence_assessed: true
  funding:
    source: src-blf-lens-finding-challenge-site
    quote: funded under the Seventh Framework Programme, Ideas, Grant Agreement n. 259349
  funding_note: The ERC research group GLENCO (PI R. Benton Metcalf); the page also names the
    Italian Ministry of Foreign Affairs and International Cooperation's project Crack the Lens.
  participation:
    source: src-arxiv-1802-03609-v3
    quote: There were 24 valid entries into the challenge
  participation_note: The first edition; the page gives no count for the second, only several very
    close entries.
  known_limitation:
    source: src-arxiv-1802-03609-v3
    quote: does show that the simulated lenses need to be improved before the raw numbers can be
      directly used

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: The second edition's scores need its test truth, which only the organisers hold. The
      first edition's published scores could be recomputed from its released truth tables, given
      entrants' submissions and a copy of the data, but no scoring code was published and the host
      refused connections on 2026-10-14.
    source: src-blf-lens-finding-challenge-site
    quote: 'Test sets will soon be available: Data pack of images (19 GB)'
  reproducibility_blockers:
    - private-test-set
    - no-reference-implementation
  reproducibility_blockers_note: The scoring is described in prose, in the paper's section 5.1 and
    the second edition's scoring note, with no code.
  harness_availability: none
  harness_availability_note: The organisers publish no code for running or scoring the challenge.
    Entrants' code exists (the CMU DeepLens repository with a notebook reproducing its submission;
    CAST's cast_lensfinder pipeline and weights), but it demonstrates their own methods, not the
    scoring (see review_checks).
  code_licence: null
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and set (space- or ground-based in the first; the second's
  # bands), which test items (the official test set, the real-KiDS subset, or a user's split of the
  # training set), which metric (AUROC, TPR0, TPR10, or the maximum F-beta), what the classifier was trained
  # on (the second edition kept a category for finders that do not use the training truth), and whether a
  # human inspected the images, as two first-edition entries did.
  material_extra:
    - training_data_policy
    - human_in_loop

homepage: http://metcalf1.difa.unibo.it/blf-portal/gg_challenge.html


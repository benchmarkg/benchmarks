# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T06)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-1802-03609-v3
    - src-arxiv-1802-03609
    - src-blf-lens-finding-challenge-site
    - src-blf-lens-finding-challenge-scoring
    - src-arxiv-2203-09536-v1
    - src-arxiv-2411-16808-v1
  sources_note: >
    The first edition's paper as its v3 PDF (a DOI, not archived) read as text, and its abstract page
    for
    the dates and the journal reference. The host of the challenge page and the second edition's scoring
    note, metcalf1.difa.unibo.it, resolved but refused connections on ports 80 and 443 on 2026-10-14,
    so
    both were read from Wayback captures (2022-05-24 and 2022-03-21), the page with scripts and styles
    stripped; those captures are their archives. The winning team's v1 PDF and a Euclid Collaboration
    v1 PDF (DOIs) for the second edition and current use. A search of 2025-2026 citing papers found
    none that reports results on either edition's test sets.
  confidence: medium
  review_checks:
    - check: Domain. Physics primary with vision/classification secondary, as PLAsTiCC is filed.
        Vision's inclusion test also passes (the score measures what is recovered from an image),
        and its exclusion test sends Earth-system and clinical targets to their domains but does not
        name astronomy; whether astronomical image targets follow the same rule is for the taxonomy.
      field: domain.primary
    - check: Identity. One entry with two editions. The first edition is itself two separately
        entered challenges (space-based C.1, ground-based C.2), kept here as one edition rather than
        tracks; the second edition has no results paper, so it could also be dropped to a note.
      field: versions
      source: src-blf-lens-finding-challenge-site
      quote: There are two parts to the challenge, C.1 and C.2, designed to mock different types of
        data sets.
    - check: Official metric. AUROC is what the first edition's entrants were told to optimise and
        what the page names; TPR0 and TPR10 were added in the paper's analysis and rank the entries
        differently (Manchester SVM and CMU-DeepLens-Resnet lead by TPR0). The second edition
        switched to the maximum F-beta. No headline_metric is set.
      field: task.scoring
      source: src-arxiv-1802-03609-v3
      quote: This was the criterion on which the challenge participants were told to optimise.
    - check: lifecycle mature. The data feed later work (the Euclid paper samples from the second
        edition's training set) but no 2025-2026 result on either test set was found, and the data
        host was unreachable on 2026-10-14. active (if such results exist) or null (if the data are
        gone) are the alternatives.
      field: lifecycle
    - check: data.access train-open-test-held-out follows the rule that the current edition decides.
        If the first edition, whose truth tables were released, is taken as the headline, it is
        fully-open; either way the host refused connections on 2026-10-14.
      field: data.access
    - check: harness_availability none. Entrants' code (DeepLens, cast_lensfinder) demonstrates
        their own methods; if that counts as showing how to take part, reference-implementation-only
        applies and the no-reference-implementation blocker goes.
      field: execution.harness_availability
    - check: distribution-shift-generalization rests on the training sets being simulated only,
        which the paper says through an entrant's description of the ground-based training set, and
        on the real-KiDS subset being reported separately (its figure 7), not ranked.
      field: capability
      source: src-arxiv-1802-03609-v3
      quote: The training set consisted of 4-band FITS
    - check: Metcalf, the organiser, co-authors the second edition's winning team's paper. Whether
        he was on the team during the challenge is not stated; if he was,
        maintainer-competes-on-own-benchmark applies.
      field: governance.independence_flags
      source: src-arxiv-2203-09536-v1
      quote: M. Portes de Albuquerque1, R. Benton Metcalf6,7
    - check: refresh periodic-recompetition rests on two editions, each with new data, and a plan
        for at least two generations; with no third edition, versioned-releases is the alternative.

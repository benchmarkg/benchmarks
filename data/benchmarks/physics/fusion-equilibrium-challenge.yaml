# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2609-01750-v1
    - src-arxiv-2609-01750
    - src-fusion-equilibrium-challenge-site
    - src-fusion-equilibrium-challenge-data
    - src-codabench-fusion-equilibrium-challenge-17739
    - src-github-fusion-equilibrium-challenge-starter-readme
    - src-sophelio-site
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text; its abstract page for the date and licence;
    the site's home and data pages with scripts and styles stripped; Codabench's JSON record of the competition,
    with its rules, evaluation, data and submission pages; the starter kit's README at main; and Sophelio's
    home page. The site's organisers, rules, FAQ, timeline and announcements pages and the development
    leaderboard's API were read but not cited; the leaderboard's rows and the timeline page carry personal
    account names.
  confidence: medium
  review_checks:
    - check: composite rests on S_model blending different metrics. Every constituent is an error
        against EFIT's reference and is counted under statistical-fit, so a strict reading of
        composite's exclusion ("every constituent shares one method") would drop it; reading D_LCFS
        as domain-metric would keep it, but that metric is the challenge's own.
      field: evaluation_method
    - check: contamination_risk is medium. The maintainers say the withheld MAST targets come from
        the public FAIR-MAST archive and bar that route by rule, checked by rebuilding the top five
        entries. A reviewer who reads that statement as an evidenced route into a scored split would
        make it high, with this Source as contamination_evidence.
      field: data.contamination_risk
      source: src-codabench-fusion-equilibrium-challenge-17739
      quote: The withheld MAST targets are drawn from that archive, so using it is training on the
        test set.
    - check: Shot counts differ by source. The abstract has 9,113 DIII-D and 2,416 MAST (the
        README's 9,113 "source shots", before the diverted-plasma filter); the paper body 8,794 and
        2,414 (all folds); the site 7,915 and 1,206 (the released folds); the 2026-10-09
        announcement 879 and 1,205 private shots, which give 2,411 MAST, not 2,414.
      field: data.size
      source: src-github-fusion-equilibrium-challenge-starter-readme
      quote: validated to make the correct, unambiguous call on all 9,113 DIII-D source shots
    - check: The paper says the private fold's ground truth stays confidential until the end of
        Phase 2; Codabench's rules and terms say it is never released. If the targets are released
        after the final phase, reproducibility_tier and the private-test-set blocker change for
        later use.
      field: execution.reproducibility_tier
      source: src-arxiv-2609-01750-v1
      quote: remain confidential until the end of Phase 2
    - check: activity is accepting-submissions only until 2026-10-18. Re-check after the final phase

# data/benchmarks/physics/lhc-olympics-2020.yaml
#
# P1-S6-T06, physics entry 12 of 18. Filled from the challenge paper, "The LHC Olympics 2020: A Community Challenge
# for Anomaly Detection in High Energy Physics" (Kasieczka, Nachman, Shih et al.), arXiv 2101.08320 read as its v1
# PDF (2021-01-20, the only version), and its abstract page; the challenge's home page on lhco2020.github.io
# (scripts and styles stripped); Zenodo's records of the R&D dataset (10.5281/zenodo.6466204, v5) and of the official
# black-box datasets (10.5281/zenodo.4536624, v6), both with scripts and styles stripped; the README of the
# challenge's parsing scripts (lhcolympics2020/parsingscripts); and the v1 PDF of arXiv 2606.13780 (June 2026), a
# paper that reports results on the R&D dataset. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts.

id: lhc-olympics-2020
name: LHC Olympics 2020
aliases:
  - LHCO 2020
  - LHCO2020
  - LHC Olympics 2020 Anomaly Detection Challenge
  - LHCO R&D dataset
aliases_note: Not to be confused with the first LHC Olympics (2005-2006), whose black boxes were
  nearly all signal events; the 2020 challenge took the name from them.
tagline: Finding a new-physics resonance hidden in simulated LHC dijet events, with an R&D set and
  three blinded black boxes.
description: >
  A community challenge for model-agnostic anomaly detection in collider physics, organised by
  Gregor Kasieczka, Benjamin Nachman and David Shih, with simulated proton-proton events stored
  as lists of up to 700 detector-reconstructed hadrons (pT, eta, phi) and selected by a single
  large-radius jet trigger at pT above 1.2 TeV. The R&D dataset (Zenodo, April 2019) holds one
  million QCD dijet background events and 100,000 signal events of a 3.5 TeV Z' decaying to two
  new particles that each decay to quarks, each event with a signal-or-background truth bit; a
  three-prong signal sample was added in May 2020. Three black boxes of one million events each,
  released from November 2019 with background generated under changed Pythia and Delphes settings
  or with Herwig++, were the test: Black Box 1 hid 834 signal events of the R&D topology at new
  masses, Black Box 2 was background only, and Black Box 3 hid a 4.2 TeV resonance with two decay
  modes (1,200 dijet and 2,000 trijet events). Contestants entered a p-value for the no-signal
  hypothesis, the masses and decay modes of any new particles and the number of signal events,
  with uncertainties, in a Google form; answers were to be judged by their distance from the truth
  in units of the stated uncertainty, but no single metric or winner was declared. Box 1 was
  unblinded at the ML4Jets2020 workshop after a 12 January 2020 deadline, and boxes 2 and 3 at a
  virtual summer workshop; the
  truth labels of boxes 1 and 3 have been on Zenodo since November 2020. The R&D dataset is still
  used to develop and compare anomaly detectors, with each paper's own signal injection and
  metric.
self_description:
  source: src-arxiv-2101-08320-v1
  quote: we have created the LHC Olympics 2020, a community challenge accompanied by a set of
    simulated collider events
external_ids:
  arxiv: '2101.08320'
paper:
  title: 'The LHC Olympics 2020: A Community Challenge for Anomaly Detection in High Energy Physics'
  arxiv: '2101.08320'
  version_read: v1
  source: src-arxiv-2101-08320-v1
released: 2019-04-04
released_note: The R&D dataset's publication date on Zenodo, the challenge's first public release.
  The first black box followed on 2019-11-19 (home page and Zenodo), and the paper on 2021-01-20;
  its abstract page links a journal version, DOI 10.1088/1361-6633/ac36b9, which was not read.
released_source: src-zenodo-lhco2020-rnd
released_quote: Published April 4, 2019
release_venue: The ML4Jets2020 workshop (Winter Olympics, Black Box 1) and a virtual anomaly
  detection workshop hosted by the University of Hamburg (Summer Olympics, Black Boxes 2 and 3)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/particle-physics
  secondary: []
domain_basis:
  reason: The scored quantities are a new particle's existence, masses and signal yield, recovered
    from simulated LHC collision events at detector level, which is the leaf's definition. The
    physics family's example fair-universe-higgsml is the same kind of case.
  source: src-arxiv-2101-08320-v1
  quote: The goal of the challenge is to determine if there is new physics in the box and then to
    identify its properties.
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: The events are simulated, but entrants search them for a signal; no learned model stands
      in for Pythia, Herwig++ or Delphes or is scored against their output.
capability:
  - scientific-prediction
  - calibration-uncertainty
  - distribution-shift-generalization
capability_basis:
  scientific-prediction:
    reason: The claim is that methods find and characterise a signal in the data, the resonance
      masses, decay modes and number of signal events, and answers are compared with the signal the
      organisers injected into the simulation.
    source: src-lhco2020-site
    quote: the masses and decay modes of all new particles (and uncertainties on those parameters)
  calibration-uncertainty:
    reason: The stated scoring rule divides each answer's distance from the truth by the uncertainty
      the contestant reported, so the emitted uncertainty enters the score; a p-value for the
      no-signal hypothesis is also asked for.
    source: src-lhco2020-site
    quote: 'For accuracy, we will use the # of sigmas |(your answer - right answer) / your uncertainty|
      from the right answer wherever applicable.'
  distribution-shift-generalization:
    reason: The background in each black box was generated under settings deliberately different
      from the provided background simulation and the R&D set, changed Pythia and Delphes settings
      in boxes 1 and 3 and Herwig++ in box 2, and each box's results are reported on their own.
      Methods that train on the black box itself are not fitted to the R&D distribution (see
      review_checks).
    source: src-zenodo-lhco2020-blackboxes
    quote: Be warned that both the physics and the detector modeling for this simulation may not
      exactly reflect the
capability_considered_and_rejected:
  - term: perception
    reason: The input is lists of Delphes-reconstructed hadrons, but what is scored is a
      dataset-level statistical inference, an over-density across a million events; the paper says
      every successful approach first reduced the particle lists to model-inspired features (see
      review_checks).
  - term: hypothesis-generation
    reason: Each submission gives one description of the new physics per black box, and that one
      answer is scored; no set of candidates is ranked.
  - term: abductive-reasoning
    reason: Contestants do settle on an explanation of the data, but the stated score is the numeric
      distance of masses and signal counts from the truth, not which explanation was chosen.

evaluation_method:
  - uncertainty-calibration-score
evaluation_method_basis:
  reason: The scoring rule the organisers announced is a pull, the answer's distance from the true
    value in units of the contestant's own stated uncertainty, which consumes an emitted interval
    and scores its coverage of the truth. The paper's figure of the first unblinding shows the same
    pull for each submission that gave an uncertainty. No metric was declared the ranking (see
    review_checks).
  source: src-lhco2020-site
  quote: 'For accuracy, we will use the # of sigmas |(your answer - right answer) / your uncertainty|
    from the right answer wherever applicable.'
evaluation_method_considered_and_rejected:
  - term: numeric-tolerance-match
    reason: The paper's summary of Black Box 1 counts masses found within a ±200 GeV window or
      within the claimed error, but that is a reading after unblinding; no tolerance was announced
      that marks an answer right.
    source: src-arxiv-2101-08320-v1
    quote: within a window of ±200 GeV (LSTM, Tag N Train, Density Estimation)
  - term: entrant-relative-ranking
    reason: No ranking of any kind was published; the paper says methods could not be compared
      directly.
    source: src-arxiv-2101-08320-v1
    quote: there was no single metric for determine a winner and therefore it was not possible to
      directly compare methods
  - term: classification-metric
    reason: Results on the R&D dataset, in the paper's method sections and in later papers, are ROC
      curves, AUC and significance improvement computed with the truth bit, but the R&D set was for
      development and the challenge did not score it (see as_used and review_checks).
  - term: expert-panel-assessment
    reason: The organisers edited the summary paper, but each team wrote its own section and no
      committee issued a judgement on the entries.
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are anomaly-detection pipelines built for this particle-physics search and
    trained on its data, unsupervised (autoencoders, density estimators), weakly supervised (CWoLa
    hunting, Tag N' Train) or using signal simulation, mostly neural networks.
  source: src-arxiv-2101-08320-v1
  quote: Many teams developed and implemented a variety of techniques on these datasets
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The task, a resonance search in collider data, is defined by particle physics, which
      that term's exclusion test sends to domain-specialist-model.
  - term: classical-algorithm
    reason: The home page admits cuts as well as machine learning, but no entry in the sources read
      is a method without a fitted component.
  - term: human-expert
    reason: One Black Box 1 entry, labelled Human NN, was a manual search by the authors of one
      method section, who flagged a bump that the background generator's settings had sculpted; the
      protocol does not set out a human track.
as_used:
  - protocol: The R&D dataset outside the challenge, on high-level jet features from a later
      method's preprocessed files, split into a signal region in the dijet mass and sidebands as in
      CWoLa hunting and CATHODE, with the paper's own signal injection; scored on the calibration of
      p-values and significances, not on the challenge's black-box answers.
    split: R&D dataset, signal region 3.3-3.7 TeV in the dijet mass, about 0.6% injected signal
    source: src-arxiv-2606-13780-v1
    quote: We now demonstrate the full pipeline on the public collider dataset, the LHC Olympics
      2020 R&D dataset
    note: arXiv 2606.13780 (June 2026), by authors outside the organising team, says its aim is not
      a new sensitivity record. Users of the R&D set choose their own injection, features and metric
      (often AUC or significance improvement).

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the challenge's R&D dataset, the instrument most users take
    from it; a June 2026 paper evaluates on it. The blinded challenge ended in 2020 and its truth
    labels are public, which goes to activity and data.access (see review_checks).
  source: src-arxiv-2606-13780-v1
  quote: We now demonstrate the full pipeline on the public collider dataset, the LHC Olympics 2020
    R&D dataset
activity: closed
activity_note: Results came in through a Google form, for Black Box 1 by 2020-01-12 and for boxes 2
  and 3 before their unblinding at the summer workshop. The form link is still on the home page, but
  the truth is public and no later round is announced. The home page's list of papers is no longer
  updated.
activity_basis:
  reason: The Google form was the only route for entering black-box results, and the organisers
    declared the challenge over when they released the answers.
  source: src-zenodo-lhco2020-blackboxes
  quote: Now that the challenge is over, we have uploaded the solutions to Black Boxes 1 and 3.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Tag N' Train (Amram and Mantilla Suarez), a weakly supervised classifier that placed the
      Black Box 1 resonance mass within 200 GeV before unblinding
    source: src-arxiv-2101-08320-v1
    observed_on: 2026-10-14
    quote: within a window of ±200 GeV (LSTM, Tag N Train, Density Estimation)
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: The signal the organisers injected into each simulated black box (its
  masses, decay modes and number of events), and for the R&D set the per-event truth bit; Black Box
  2 held no signal.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: All events and the per-event truth labels of Black Boxes 1 and 3 are on Zenodo under CC BY
    4.0, and the paper gives each box's injected signal, Black Box 2 being background only, so
    anyone can score a black-box answer or an R&D result.
  source: src-zenodo-lhco2020-blackboxes
  quote: where each line is the truth label

task:
  exists: true
  input:
    - one black box, a million simulated events, each a list of up to 700 detector-reconstructed
      hadrons (pT, eta, phi) passing a single large-radius jet trigger at pT above 1.2 TeV
    - a million-event background simulation, and the R&D dataset with its truth bit, both of which
      may differ in physics and detector modelling from the black boxes
  output: 'For each black box: a p-value for the no-new-physics hypothesis; the masses and decay modes
    of any new particles, with uncertainties; and the number of signal events before selection, with its
    uncertainty. Partial answers were allowed.'
  scoring: Each answered quantity's distance from the true value in units of the contestant's stated
    uncertainty, where applicable. No single metric, ranking or winner was declared; results were
    presented at the unblinding workshops and in the summary paper.
  tests_hidden_from_system: true
  source: src-lhco2020-site
  quote: A p-value associated with the dataset having no new particles (null hypothesis).

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every black box and the R&D dataset are downloadable from Zenodo without an account, and
      since November 2020 the per-event truth of the two boxes that held a signal is there too;
      fully-open's test judges a blind round once its ground truth is released.
    source: src-zenodo-lhco2020-blackboxes
    quote: Now that the challenge is over, we have uploaded the solutions to Black Boxes 1 and 3.
  access_by_phase:
    during_edition: train-open-test-held-out. The R&D dataset with its truth bit and the background
      simulation were public, and each black box's events were released on Zenodo without their
      labels or the injected signal's description.
    during_edition_source: src-zenodo-lhco2020-rnd
    during_edition_quote: Obviously, the truth bit will not be included in the actual challenge.
    after_edition: fully-open. Per-event truth files for Black Boxes 1 and 3 on Zenodo under CC BY
      4.0, and the injected signals described in the paper, Black Box 2 being background only.
    after_edition_source: src-zenodo-lhco2020-blackboxes
    after_edition_quote: where each line is the truth label
  refresh: versioned-releases
  refresh_basis:
    reason: The datasets change only in Zenodo versions, each with a dated update note. The R&D
      record added a three-prong signal in May 2020 and feature files in November 2020, and in April
      2022 replaced its raw background file with the regenerated events the feature files had been
      built from.
    source: src-zenodo-lhco2020-rnd
    quote: was never updated to v2, which had a lower generator-level pT threshold
  data_provenance:
    - simulation-generated
  data_provenance_note: QCD dijet backgrounds and the injected signals generated with Pythia 8
    (Herwig++ for Black Box 2's background) and passed through Delphes 3.4.1, with settings changed
    from the R&D defaults for each black box. No event is a real collision.
  data_provenance_source: src-arxiv-2101-08320-v1
  data_provenance_quote: The events were produced using Pythia 8.219
  contamination_risk: medium
  contamination_risk_note: The answers have been public since the unblindings (January and summer
    2020) and the per-event labels since November 2020, so any later black-box result can have seen
    them; the paper keeps blinded and unblinded results apart. The R&D set ships its truth bit by
    design. The paper also says the R&D benchmark signal shares Black Box 1's topology, so methods
    tuned on it had a head start there. No source read evidences a result trained on the released
    labels.
  contamination_risk_source: src-arxiv-2101-08320-v1
  contamination_risk_quote: while one used a signal likelihood (LSTM)
  contamination_evidence: []
  dataset_licence: CC-BY-4.0
  dataset_licence_note: Both Zenodo records, the R&D dataset and the black boxes, carry this
    licence.
  dataset_licence_source: src-zenodo-lhco2020-blackboxes
  dataset_licence_quote: Creative Commons Attribution 4.0 International
  size:
    - count: 1000000
      unit: simulated events per black box (three boxes)
      subset: black boxes
      source: src-zenodo-lhco2020-blackboxes
      quote: contains 1M events meant to be representative of actual LHC data
    - count: 1100000
      unit: simulated events (1M QCD dijet background, 100k Z' to XY signal), each with a truth bit
      subset: R&D dataset
      source: src-zenodo-lhco2020-rnd
      quote: The array format is therefore (Nevents=1.1M, 2101).
    - count: 834
      unit: injected signal events
      subset: Black Box 1
      source: src-arxiv-2101-08320-v1
      quote: A total of 834 signal events were included (out of a total of 1M events in all)
    - count: 3200
      unit: injected signal events (1,200 dijet, 2,000 trijet)
      subset: Black Box 3
      source: src-arxiv-2101-08320-v1
      quote: 1200 dijet events and 2000 trijet events were included along with QCD backgrounds in
        Black Box 3

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The LHC Olympics 2020 organisers, Gregor Kasieczka (Universität Hamburg), Benjamin
    Nachman (Lawrence Berkeley National Laboratory) and David Shih (Rutgers University)
  maintainer_basis:
    reason: The three organisers are the creators of both Zenodo records and the paper's editors;
      the site sits in the LHCO2020 GitHub organisation and the parsing scripts in lhcolympics2020.
    source: src-zenodo-lhco2020-rnd
    quote: University of Hamburg 2. Lawrence Berkeley National Lab 3. Rutgers University
  maintainer_type: community-collective
  maintainer_type_note: The artefacts sit in shared accounts (two GitHub organisations, Zenodo
    records with three creators) run by organisers from three institutions, with no institution
    stated as the holder and no legal form. academic-lab was considered (see review_checks).
  submission_process:
    - held-out-server
  submission_process_note: Contestants entered their answers for a black box in a Google form while
    its truth was hidden, and the organisers compared them with the injected signal at the
    unblinding workshops; there was no leaderboard. assessment-committee was considered, but the
    summary paper is a compilation of the teams' own sections. Since the challenge, results on the
    R&D dataset appear only in their authors' papers.
  submission_process_source: src-arxiv-2101-08320-v1
  submission_process_quote: Contestants entered their results in a Google form.
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2101-08320-v1
      quote: Some of the results of these types came from collaborations with the challenge
        organizers
  independence_flags_note: The organisers kept out of the blinded challenge, but post-unblinding and
    R&D results in the paper come from methods they co-authored, among them CWoLa hunting (Collins
    and Nachman), which reported a 3.5 TeV resonance in Black Box 1 after unblinding, and Anomaly
    Detection with Density Estimation (Nachman and Shih). There were no prizes; the paper notes the
    lack of a monetary prize. No funder is named for the challenge itself.
  independence_assessed: true
  participation:
    source: src-arxiv-2101-08320-v1
    quote: Well over one hundred researchers participated in these events, with over a dozen teams
      submitting their results for the black boxes.

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The events and the truth are public, so the pull of a mass or signal-count answer, or
      any R&D metric, can be computed by anyone without the organisers. Decay-mode descriptions have
      no published scoring rule.
    source: src-zenodo-lhco2020-blackboxes
    quote: where each line is the truth label
  harness_availability: reference-implementation-only
  harness: lhcolympics2020/parsingscripts (Jupyter notebooks that read the events and cluster jets
    with pyjet or FastJet); no scoring code was published
  harness_source: src-github-lhco2020-parsingscripts-readme
  harness_quote: The jupyter notebooks here have some example code for reading in the data and doing
    some basic manipulation.
  code_licence: null
  code_licence_note: GitHub's licence metadata for lhcolympics2020/parsingscripts reports no
    licence, read 2026-10-14; the repository was last pushed on 2019-12-02.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which data (a black box blinded or after unblinding, or the R&D set, and which
  # Zenodo version of its background file), how much signal was injected into the R&D background, and what the
  # method trained on (nothing labelled, the R&D benchmark signal, or the truth bit).
  material_extra:
    - training_data_policy

homepage: https://lhco2020.github.io/homepage/
repository: https://github.com/lhcolympics2020/parsingscripts
dataset_url: https://doi.org/10.5281/zenodo.3547721


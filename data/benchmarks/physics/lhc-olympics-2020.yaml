# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T06)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2101-08320-v1
    - src-arxiv-2101-08320
    - src-lhco2020-site
    - src-zenodo-lhco2020-rnd
    - src-zenodo-lhco2020-blackboxes
    - src-github-lhco2020-parsingscripts-readme
    - src-arxiv-2606-13780-v1
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with windows clear of the editors'
    contact line, and its abstract page for the date; the home page with scripts and styles
    stripped, its windows clear of the challenge's mailing-list address (lhco2020.github.io serves
    no robots.txt); Zenodo's record pages for the R&D dataset and the black boxes (DOIs; Zenodo's
    robots.txt disallows /api, so the pages were read); the parsing scripts' README at master; and
    the v1 PDF of arXiv 2606.13780 (a DOI) as evidence of current use.
  confidence: medium
  review_checks:
    - check: lifecycle active rests on the R&D dataset, which a June 2026 paper still uses with its
        own injection and metric; the blinded challenge itself ended in 2020 and its answers are
        public. mature (a finished challenge whose instrument stays in use) is the alternative.
      field: lifecycle
      source: src-arxiv-2606-13780-v1
      quote: The goal is not to set a new sensitivity record
    - check: The entry is the challenge with its R&D dataset. The R&D dataset is often cited on its
        own as the LHCO R&D benchmark, scored by AUC or significance improvement; it could be a
        separate entry, which would take classification-metric and no-submission-channel.
      field: evaluation_method
    - check: uncertainty-calibration-score rests on the announced pull, which divides by the stated
        uncertainty; many entries gave no uncertainty, decay modes have no numeric rule, and no
        ranking was made. The pull also rewards wide uncertainties, so it scores coverage but not
        sharpness.
      field: evaluation_method
      source: src-arxiv-2101-08320-v1
      quote: Horizontal bars indicate the uncertainty (only if provided by the submitting groups)
    - check: distribution-shift-generalization rests on the black boxes' deliberately changed
        background generators; many methods train on the black box itself, so for them the shift is
        between the R&D set they were developed on and the box.
      field: capability
      source: src-arxiv-2101-08320-v1
      quote: The background was produced using Herwig++
    - check: perception was rejected, but the top-tagging entry tags it for the same kind of input
        (Delphes reconstructed particles). The two calls should be brought into line.
      field: capability
    - check: maintainer-competes-on-own-benchmark rests on organiser-co-authored methods in the
        post-unblinding and R&D results; the organisers did not take part in the blinded challenge.
      field: governance.independence_flags
      source: src-arxiv-2101-08320-v1
      quote: The organizers of the LHCO challenge could not participate in this type of analysis.
    - check: maintainer_type community-collective or academic-lab. The three organisers are at a
        university, a national laboratory and a university; who uploaded the Zenodo records is not
        shown.
      field: governance.maintainer_type
    - check: Black Box 2 has no truth file because it held no signal; its ground truth (background
        only, Herwig++) is stated in the paper, not in the Zenodo record.
      field: data.access
      source: src-arxiv-2101-08320-v1
      quote: This sample of 1M events was background only.

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2605-13950-v1
    - src-arxiv-2605-13950
    - src-hf-api-colliderbench
    - src-hf-colliderbench-card
    - src-github-collider-bench-readme
    - src-github-api-collider-bench-tasks
    - src-arxiv-2603-20179-v3
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with the affiliation lines quoted with no
    window and every other window kept clear of the author block, the acknowledgements' names, cited
    authors' names and the personal-account links; its abstract page (a DOI) for the date and the
    links. Hugging Face's API record and the dataset card, and the README at 2986d8b, are withheld from
    archiving because they name the owner's personal accounts or the authors. GitHub's API listing of
    the task directories is withheld too: it carries the account inside every URL, though the extract
    leaves them out. The v3 PDF of arXiv 2603.20179 (a DOI) is evidence about current use. The ML4Jets
    2026
    contribution page was read and not cited; it names the authors.
  confidence: medium
  review_checks:
    - check: Domain primary is physics/particle-physics with agents-tooluse/long-horizon-autonomy
        secondary, by the chain the taxonomy sets for an agent scored on an analysis it built (the
        agents-tooluse exclusion sends it to code, and code's exclusion sends a means to a physics
        result to physics), as for bixbench. The particle-physics leaf names analysing collision or
        detector data; here the agent first simulates the events it analyses, as the entrants of
        fair-universe-higgsml analyse simulated events. operating-system-tasks is the alternative
        secondary if the shell interface is read as deciding.
      field: domain
      source: src-arxiv-2605-13950-v1
      quote: Each task requires the agent to turn a published analysis into an executable
        simulation-and-selection pipeline and submit predicted collision event yields in specified
        signal regions.
    - check: lifecycle is null. The only results are the release paper's; arXiv 2603.20179 v3 cites
        the benchmark without running it, and the ML4Jets 2026 talk is the authors'. A 2026 paper
        that reports Collider-Bench results would make it active.
      field: lifecycle
      source: src-arxiv-2603-20179-v3
      quote: The two directions are complementary
    - check: Only the paper's release is a version. The main branch now holds 53 task directories
        (the ten originals, 34 from five ATLAS searches, nine from CMS-B2G-17-012) and a changed
        judge, none of them released, labelled or scored in any source. If the lead reads main as a
        rolling release, a second version (frozen false) and a different refresh would follow; the
        paper says future releases will add tasks. data.refresh is null for the same reason.
      field: versions
      source: src-github-api-collider-bench-tasks
      quote: '"path":"ColliderBench/tasks/b2g-17-012_sim-tZtZ_D"'
    - check: grader-from-evaluated-party rests on the paper naming Claude Opus 4.6 as the judge,
        evaluating three Anthropic models and attributing Claude models to Anthropic in its
        reference list. The judge gates and re-scores runs rather than computing the distance; if
        only a grader that sets the number counts, the flag would go.
      field: governance.independence_flags
      source: src-arxiv-2605-13950-v1
      quote: Anthropic. Claude model system cards.
    - check: The PDF lists only Rutgers and Boston University affiliations, and the ML4Jets 2026
        contribution page gives a different university for one author. No source read states that
        any author works for an evaluated developer (Anthropic, OpenAI, DeepSeek); a reviewer may
        check current affiliations, which could add maintainer-competes-on-own-benchmark or a note
        like cmt-benchmark's.
      field: governance.independence_flags
      source: src-arxiv-2605-13950-v1
      quote: Faculty of Computing & Data Sciences Boston University
    - check: maintainer_type individual, because the code sits in a personal GitHub account and the
        task corpus in a personal Hugging Face account; no source says whether one person holds
        both. academic-lab (the Rutgers group) would follow if a reviewer reads the authors' group
        as the holder.
      field: governance.maintainer_type
      source: src-arxiv-2605-13950-v1
      quote: Code, container image, and tasks are released here
    - check: measured-ceiling rests on the supervised solution of every task, and tau is defined by
        that run's worst task. The supervised run is a physicist directing an agent, not an expert
        alone, so expert-best is the alternative if the anchor is read as a person's performance.
      field: data.ceiling_anchor_type
      source: src-arxiv-2605-13950-v1
      quote: chosen as the worst relative L2 error achieved by the physicist-in-the-loop baseline
        across the task set
    - check: model-graded-judge is assigned although the paper says the judge does not assign the
        primary numerical score; it decides which runs count. numeric-tolerance-match is rejected
        for Acc_tau, a threshold on a per-task error statistic.
      field: evaluation_method
      source: src-arxiv-2605-13950-v1
      quote: we use an LLM judge to inspect the agent workspace and execution trace. The judge does
        not assign the primary numerical score.
    - check: ground_truth_source simulation, because the targets are the collaborations' published
        signal predictions from their official simulation; held-out-labels is the alternative if the
        published yields are read as reference labels rather than simulator output.
      field: ground_truth_source
      source: src-arxiv-2605-13950-v1
      quote: These may be published signal yields, binned signal distributions or plots that can be
        digitized reliably.
    - check: code_licence is null. The dataset card says MIT matches the GitHub repository, but the
        repository has no licence file or licence metadata.
      field: execution.code_licence
      source: src-hf-colliderbench-card
      quote: MIT (matches the GitHub repo).
    - check: contamination_risk medium. The targets are public in the CMS papers and HEPData, and
        the agents' hepdata tool can reach those records during a run; the judge's FABRICATED flag
        is the guard. Whether in-run lookup counts as an evidenced route, which would make it high,
        is open.
      field: data.contamination_risk
      source: src-arxiv-2605-13950-v1
      quote: FABRICATED. Non-null values are submitted, but they cannot be traced to a complete,
        agent-verified pipeline.

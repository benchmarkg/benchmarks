# data/benchmarks/physics/srbench.yaml
#
# P1-S6-T05, physics entry 4 of 9. Filled from the SRBench v2.0 paper, arXiv 2107.14351 read as its v1 PDF
# (NeurIPS 2021 Datasets and Benchmarks), and its abstract page; the SRBench 2025 paper ("Call for Action"),
# arXiv 2505.03977 read as its v1 PDF (GECCO 2025 Symbolic Regression Workshop), and its abstract page; the
# repository README at master; the contribution guide on cavalab.org; GitHub's metadata for cavalab/srbench; and
# the v1 PDF of LEE (arXiv 2605.27245, May 2026), a paper that reports results on the v2.0 suite. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.

id: srbench
name: SRBench
aliases:
  - SRBench 2025
  - SRBench 2.0
tagline: 'Living benchmark of symbolic regression methods: R^2 and model size on PMLB data, and recovery
  of known physics laws.'
description: >
  A living benchmark for symbolic regression (SR), the search for a closed-form expression that fits a
  dataset, kept by William La Cava's lab with method contributions from the SR community. Every method
  is wrapped behind a scikit-learn API, refitted from scratch on each dataset's training split and must
  return its model as a sympy-compatible string. The benchmark has two halves. A black-box track scores
  test-set R^2 and model size on tabular regression problems from PMLB, real-world and synthetic, against
  machine-learning regressors in v2.0. A ground-truth track gives data generated from known equations:
  in v2.0 (NeurIPS 2021) 130 problems from the Feynman Lectures on Physics and from Strogatz's nonlinear
  ODE systems, scored by the symbolic solution rate at four levels of target noise; in SRBench 2025, 12
  phenomenological and first-principles problems (Hubble, Kepler, Planck and others), compared with the
  known expression on accuracy-size Pareto fronts. v2.0 ran 14 SR and 7 ML methods on 252 problems; SRBench
  2025 ran 25 SR methods in Docker containers, 30 runs per dataset, on 24 datasets. Contributors submit
  methods by pull request and the maintainers run them in the next update.
self_description:
  source: src-arxiv-2107-14351
  quote: introducing an open-source, reproducible benchmarking platform for symbolic regression
external_ids:
  arxiv: '2107.14351'
paper:
  title: Contemporary Symbolic Regression Methods and their Relative Performance
  arxiv: '2107.14351'
  version_read: v1
  source: src-arxiv-2107-14351-v1
released: 2021-07-29
released_note: The v2.0 paper's first arXiv version, as its abstract page dates it; v2.0 is the
  first edition published under the SRBench name. Its precursor, v1.0, was reported at GECCO 2018,
  and the sources read do not date it. SRBench 2025 followed on 2025-05-06 (see versions).
released_source: src-arxiv-2107-14351
released_quote: Submitted on 29 Jul 2021
release_venue: NeurIPS 2021 Track on Datasets and Benchmarks
release_venue_source: src-arxiv-2107-14351
release_venue_quote: To appear in Neurips 2021 Track on Datasets and Benchmarks

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/symbolic-regression-discovery
domain_basis:
  reason: The ground-truth track asks methods to recover the equations of physical systems (Feynman
    Lectures equations, Strogatz ODEs; in 2025 laws such as Hubble's, Kepler's and Planck's) from
    data, which is the subdomain's definition. The black-box half is tabular regression from health,
    business, government and other fields and meets no domain in the vocabulary (review_checks).
  source: src-arxiv-2107-14351-v1
  quote: These datasets were used to assess the ability of SR methods to recover known process
    physics.
domain_considered_and_rejected:
  - term: mathematics/symbolic-manipulation
    reason: The scored artifact is an expression checked by sympy, but the subdomain is transforming
      given expressions, and here the expression is inferred from data.
  - term: mathematics/applied-modeling
    reason: Applied modelling formulates a situation posed in words as a model; here the input is a
      table of numbers and no situation is described to the method.
capability:
  - inductive-reasoning
capability_basis:
  inductive-reasoning:
    reason: Each method gets a finite set of observations and is scored on the expression it infers
      from them, on held-out data and, for the ground-truth problems, on whether it is the
      generating law.
    source: src-arxiv-2107-14351-v1
    quote: the Symbolic Solution metric is a more faithful evaluation of the ability of an SR method
      to discover the data generating process
capability_considered_and_rejected:
  - term: abstraction
    reason: The law is hidden, but the difficulty is recovering it from a finite sample, which the
      term's own srbench near miss assigns to inductive-reasoning.
  - term: scientific-prediction
    reason: The ground-truth track scores the recovered law, not a prediction of a physical system's
      state, and the black-box track's targets are mostly not physical quantities.

evaluation_method:
  - statistical-fit
  - symbolic-equivalence
evaluation_method_basis:
  reason: Accuracy in v2.0 and 2025 is the coefficient of determination R^2 on a held-out 25% test
    split (statistical-fit). In v2.0 a ground-truth model counts as solved when, after sympy
    simplification, it differs from the true equation by an additive constant or a scalar factor
    (symbolic-equivalence). Model size, the axis paired with R^2 throughout, is a reporting axis,
    not a method (ADR-0020).
  source: src-arxiv-2107-14351-v1
  quote: is designed to capture models that differ from the true model by a constant or scalar
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: Two differently written expressions can both be solutions, which the term's own srbench
      near miss sends to symbolic-equivalence.
designed_for_subjects:
  - task-specific-supervised-model
designed_for_subjects_basis:
  reason: The entrants are fitting procedures (genetic programming, Bayesian and deep-learning SR,
    pretrained transformers and, in v2.0, ML regressors for comparison) refitted on every dataset's
    training split, which the term's inclusion test names for symbolic regression.
  source: src-arxiv-2107-14351-v1
  quote: Each algorithm was trained on each dataset (and level of noise, for ground-truth problems)
    in 10 repeated trials
designed_for_subjects_considered_and_rejected:
  - term: classical-algorithm
    reason: Genetic programming has no neural network, but the term's exclusion names a search that
      fits a model's structure to each dataset, as symbolic regression does.
  - term: domain-specialist-model
    reason: The methods are general-purpose regressors run on health, business and physics data
      alike; the neural SR methods (DSR, E2E, NeSymRes, TPSR) are trained for the SR task, not for a
      discipline.
  - term: instruction-tuned-model
    reason: No edition's roster has a language-model-based SR method; LLM-SRBench, which evaluates
      language models on equation discovery, is a separate benchmark by other maintainers.
as_used:
  - protocol: The v2.0 suite as 14 Strogatz, 116 Feynman and 63 black-box datasets, with the
      ground-truth problems at three noise levels (0, 0.01, 0.1) rather than v2.0's four, 10 trials
      on the 75/25 split, mean test R^2 and simplified complexity reported, and baseline numbers
      copied from the GenSR paper and the v2.0 result files rather than re-run.
    split: test (the 25% fold)
    source: src-arxiv-2605-27245-v1
    quote: Strogatz (14 ODE systems), Feynman (116 physics equations), and black-box (63 PMLB
      datasets without known ground truth)
    note: LEE (May 2026), a neural SR method, compared with 19 SRBench methods. It reports no
      symbolic solution rate, and its black-box set is about half of v2.0's 122 problems.

lifecycle: active
lifecycle_basis:
  reason: The entry is the family, whose current edition is SRBench 2025, and results are still
    produced on its suites; a May 2026 paper reports on the v2.0 suite against 19 baselines. The
    repository was last pushed on 2026-09-21 (GitHub API).
  source: src-arxiv-2605-27245-v1
  quote: On SRBench across three noise levels, against 19 baselines
activity: accepting-submissions
activity_note: New methods are staged for the next benchmark update (GP-ELITE and Pantara are staged
  now), and results appear only when the maintainers run that update; the website's results pages
  still show the 2021 edition.
activity_basis:
  reason: Method authors can contribute now by pull request; once the method passes the tests and is
    reviewed it becomes part of the benchmark. The benchmark has no rounds of its own; its editions
    are maintainer re-runs.
  source: src-srbench-contributing
  quote: submit a pull request to the dev branch. Once your method passes the basic tests

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Deep Symbolic Regression (DSR)
    source: src-arxiv-2107-14351-v1
    observed_on: 2026-10-14
    quote: Deep Symbolic Regression (DSR) [17] uses reinforcement learning to train a generative RNN
      model of symbolic expressions
  - system: E2E (end-to-end symbolic regression with transformers)
    source: src-arxiv-2505-03977-v1
    observed_on: 2026-10-14
    quote: Generator using pre-trained transformers, using BFGS and subsampling for tuning
      parameters
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: R^2 is computed against the held-out 25% test fold's targets. The symbolic
  solution is checked against the generating equation stored in the dataset's PMLB metadata.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The datasets are in PMLB under MIT, and the code, method wrappers, container builds and
    raw results of v2.0 and 2025 are public, with a guide to reproducing the experiments.
  source: src-github-srbench-readme
  quote: A detailed guide on how to reproduce the experiments by yourself is provided in

task:
  exists: true
  input:
    - a regression dataset of numeric features and a target, split 75/25 into training and test
      data, with a fixed time or evaluation budget (and, for ground-truth problems, a level of
      target noise)
  output: The fitted model as a sympy-compatible string over the dataset's variable names.
  scoring: In v2.0, the median test R^2 and model size over 10 trials per black-box problem, and the
    share of ground-truth problems solved symbolically per noise level (0, 0.001, 0.01, 0.1). In
    SRBench 2025, the best test R^2 of 30 runs per dataset, summarised as the area under a
    performance profile, with model size, and first-principles problems on accuracy-size Pareto
    fronts beside the known expression.
  source: src-srbench-contributing
  quote: a function that returns a sympy-compatible string specifying the final model

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: Every dataset of v2.0 and 2025 is in PMLB, a public repository, with the ground-truth
      equations in its metadata; the datasets are released under MIT.
    source: src-arxiv-2505-03977-v1
    quote: The datasets were submitted to PMLB
  refresh: versioned-releases
  refresh_basis:
    reason: The content changes by labelled edition (v1.0 in 2018, v2.0 in 2021, SRBench 2025 on its
      own branch), each with its own datasets, roster and results.
    source: src-github-srbench-readme
    quote: v1.0 was reported in our GECCO 2018 paper
  data_provenance:
    - inherited-from-constituents
    - synthetic-procedural
    - simulation-generated
    - real-world-instrument
  data_provenance_note: Every problem comes from an earlier collection, so each keeps its
    constituent's provenance. The sources state the modality. The black-box problems are 46
    real-world, observational datasets and 76 synthetic ones from OpenML and UCI via PMLB. The
    Feynman data is sampled from known equations (synthetic-procedural). The Strogatz ODEs were
    simulated in Simulink. SRBench 2025's first-principles track adds real-world measurements such
    as Hubble's and Kepler's.
  data_provenance_source: src-arxiv-2107-14351-v1
  data_provenance_quote: This paper does not contribute new datasets, but rather collates and
    standardizes datasets that were already publicly available.
  contamination_risk: medium
  contamination_risk_note: The datasets and their generating equations are public, the Feynman forms
    come from a textbook, and the pretrained neural SR entrants (E2E, NeSymRes, TPSR) are pretrained
    on synthetic expression corpora that could hold them. No source assesses this; the per-dataset
    refitting of most entrants leaves no other route.
  contamination_risk_source: src-arxiv-2107-14351-v1
  contamination_risk_quote: including metadata describing the underlying equations, their units, and
    various summary statistics
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: R^2 and the solution rate are bounded at 1 and 100%. Target noise keeps
    even the true model below R^2 = 1, and SRBench 2025 plots the known expression's own R^2 beside
    each first-principles front; neither is published as a ceiling that scores are read against.
  dataset_licence: MIT
  dataset_licence_note: PMLB's licence, which the v2.0 paper states for its datasets.
  dataset_licence_source: src-arxiv-2107-14351-v1
  dataset_licence_quote: Datasets are released under an MIT license.
  size:
    - count: 24
      unit: datasets (12 black-box problems from PMLB, 12 phenomenological and first-principles
        problems)
      subset: SRBench 2025
      source: src-arxiv-2505-03977-v1
      quote: selecting 24 datasets, divided into two tracks
    - count: 252
      unit: regression problems (122 black-box, 130 ground-truth)
      subset: v2.0 (2021)
      source: src-arxiv-2107-14351
      quote: We assess 14 symbolic regression methods and 7 machine learning methods on a set of 252
        diverse regression problems
    - count: 122
      unit: black-box regression problems
      subset: v2.0 black-box track
      source: src-arxiv-2107-14351-v1
      quote: We used 122 black-box regression problems available in PMLB v.1.0.
    - count: 130
      unit: ground-truth problems (Feynman and Strogatz)
      subset: v2.0 ground-truth track
      source: src-arxiv-2107-14351-v1
      quote: We extended PMLB with 130 datasets with known, ground-truth model forms.
    - count: 94
      unit: regression problems
      subset: v1.0 (2018)
      source: src-arxiv-2107-14351-v1
      quote: including a precursor to this work benchmarking four SR methods on 94 regression
        problems

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Cava Lab (William La Cava's lab, Boston Children's Hospital and Harvard Medical
    School), with method contributors
  maintainer_basis:
    reason: The site and repository are cavalab's, and La Cava is the contact named in the README;
      the SRBench 2025 paper gives his affiliation. The 2021 paper's repository was
      EpistasisLab/srbench, from his earlier post at the University of Pennsylvania (history).
    source: src-srbench-contributing
    quote: Maintained by @cavalab and many open-source contributors
  maintainer_type: academic-lab
  submission_process:
    - sandboxed-rerun
    - maintainer-run
    - open-source-gated
  submission_process_note: Method authors open a pull request with an install recipe and a
    scikit-learn wrapper; continuous integration tests it, the maintainers review it, and then run
    it with every other method under one environment (Anaconda in v2.0, a Docker image per method in
    2025) and publish the results. In v2.0 the maintainers chose and ran the seven ML comparators
    themselves. The guide asks for an open-source method; the guide also warns that update timing
    depends on compute, and tells authors in a hurry to benchmark their method themselves.
  submission_process_source: src-arxiv-2107-14351-v1
  submission_process_quote: Once the tests pass and the method is approved by the benchmark
    maintainers, the contribution becomes part of the resource
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2505-03977-v1
      quote: 'CavaLab. 2025. Brush: An Interpretable Machine Learning Library'
  independence_flags_note: The maintainer's own methods are entrants, FEAT and epsilon-lexicase in
    v2.0 and Brush in 2025, where Brush is among the highest-AUC methods. The papers' co-authors
    also wrote entrants (Operon, GP-GOMEA, ITEA, TIR, PySR, Bingo, Genetic Engine, PS-Tree). The
    2021 paper declares no competing interests, and the grants named in both papers are public
    research funding.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: cluster
  compute_tier_basis:
    reason: Both v2.0 and SRBench 2025 were run on a computing cluster, one core per job (with a GPU
      for the methods that use one, in 2025). v2.0 took 1.29M core hours for the black-box track and
      436.8K for the ground-truth track; SRBench 2025's runs total about 1.8 years on a single core
      for 25 methods.
    source: src-arxiv-2505-03977-v1
    quote: the total runtime on a single core would be 1 year, 43 weeks, and 5 days
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data, harness and method containers are public and nothing in a run needs raters,
      special hardware or a maintainer-only set.
    source: src-github-srbench-readme
    quote: A detailed guide on how to reproduce the experiments by yourself is provided in
  reproducibility_blockers: []
  reproducibility_blockers_note: compute-scale was considered. A full edition is large, but scoring
    one new method on SRBench 2025's 24 datasets is at most 30 runs of 7 hours each per dataset,
    about 5,000 core hours, which a rented cluster covers.
  harness_availability: official-harness
  harness: srbench (experiment/analyze.py and the collate scripts at master; the Docker-based
    pipeline of the 2025 edition on the srbench_2025 branch)
  harness_source: src-github-srbench-readme
  harness_quote: The `analyze` file is the main entry point
  code_licence: GPL-3.0
  code_licence_note: GitHub's licence metadata for cavalab/srbench, read 2026-10-14; not a quoted
    Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which edition and track (v2.0's 252 problems, a subset of them, or 2025's 24),
  # the noise level, how many trials per dataset (10 or 30), and whether the median or the best run is reported.
  material_extra:
    - subset_used
    - n_samples
    - selection_strategy

aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: Each track has its own aggregate (median R^2 and the solution rate in v2.0, the area under
    the performance profile in 2025); there is none across the two tracks, and SRBench 2025 declines
    to name a single best method.
  source: src-arxiv-2505-03977-v1
  quote: we can calculate the area under the curve (AUC) for each individual algorithm as an
    aggregated measure
secondary_axes:
  - energy
secondary_axes_note: SRBench 2025 reports energy consumption and training time per method. Model
  size, the axis every edition pairs with R^2, is not in the vocabulary.
secondary_axes_source: src-arxiv-2505-03977-v1
secondary_axes_quote: Additionally, we analyze trade-offs between model complexity, accuracy, and
  energy consumption.

homepage: https://cavalab.org/srbench/
repository: https://github.com/cavalab/srbench
dataset_url: https://github.com/EpistasisLab/penn-ml-benchmarks

versions:
  - version: v1.0
    label: SRBench v1.0, the GECCO 2018 study
    version_kind: edition
    items: 94
    changes: The precursor, four SR methods on 94 regression problems, scored on prediction accuracy
      alone.
    breaking: true
    superseded_by: v2.0
    frozen: true
    sources:
      - src-github-srbench-readme
      - src-arxiv-2107-14351-v1
  - version: v2.0
    label: SRBench v2.0 (NeurIPS 2021), which the 2025 paper calls SRBench 1.0
    version_kind: edition
    released: 2021-07-29
    items: 252
    changes: 14 SR and 7 ML methods on 122 black-box and 130 ground-truth problems, 10 trials each;
      R^2 and model size, and the symbolic solution rate at four noise levels.
    breaking: true
    supersedes_version: v1.0
    superseded_by: '2025'
    frozen: true
    sources:
      - src-arxiv-2107-14351
      - src-arxiv-2107-14351-v1
      - src-github-srbench-readme
  - version: '2025'
    label: SRBench 2025, which its paper calls SRBench 2.0
    version_kind: edition
    released: 2025-05-06
    items: 24
    changes: 25 SR methods in Docker containers, 30 runs per dataset, 12 black-box datasets chosen
      by clustering v2.0's and 12 new phenomenological and first-principles problems; performance
      profiles and accuracy-size Pareto fronts replace the median and the symbolic solution rate.
    breaking: true
    supersedes_version: v2.0
    frozen: true
    sources:
      - src-arxiv-2505-03977
      - src-arxiv-2505-03977-v1
      - src-github-srbench-readme

subsets:
  - id: srbench#black-box
    label: Black-box regression track
    scored_separately: true
    evidence:
      - source: src-arxiv-2107-14351-v1
        quote: We used 122 black-box regression problems available in PMLB v.1.0.
      - source: src-arxiv-2505-03977-v1
        quote: The black-box track is a selection of 12 regression datasets from the PMLB 1.0
          project
    notes: Tabular regression with no known generating model, scored by test R^2 and model size; 122
      problems in v2.0 and 12 in 2025. Its problems come from health, business, government and other
      fields, so the physics domain does not describe it.
  - id: srbench#ground-truth
    label: Ground-truth track, Feynman and Strogatz (v2.0)
    items: 130
    scored_separately: true
    evidence:
      - source: src-arxiv-2107-14351-v1
        quote: We extended PMLB with 130 datasets with known, ground-truth model forms.
    notes: Data from Feynman Lectures equations and Strogatz ODE systems, scored by the symbolic
      solution rate at target noise 0, 0.001, 0.01 and 0.1.
  - id: srbench#first-principles
    label: Phenomenological and first-principles track (2025)
    items: 12
    scored_separately: true
    evidence:
      - source: src-arxiv-2505-03977-v1
        quote: The phenomenological & first-principles track includes publicly available datasets
          from Russeil et al. [53] and Cranmer [10]
    notes: Small real-world and generated datasets behind known laws or empirical relations, shown
      as accuracy-size Pareto fronts beside the known expression; no symbolic solution rate is
      computed.

history:
  - event: repository-moved
    field: repository
    from: https://github.com/EpistasisLab/srbench
    to: https://github.com/cavalab/srbench
    source: src-github-srbench-readme
    quote: GIT_LFS_SKIP_SMUDGE=1 git clone https://github.com/cavalab/srbench.git
    note: The v2.0 paper points to EpistasisLab/srbench; the README now clones from cavalab. No
      source read dates the move. GitHub dates the repository's creation to 2018-04-17.

tags:
  - symbolic-regression
  - equation-discovery
  - genetic-programming
  - tabular-regression
  - living-benchmark

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2107-14351-v1
    - src-arxiv-2107-14351
    - src-arxiv-2505-03977-v1
    - src-arxiv-2505-03977
    - src-github-srbench-readme
    - src-srbench-contributing
    - src-arxiv-2605-27245-v1
  sources_note: >
    The v2.0 and 2025 papers' v1 PDFs (DOIs, not archived) read as text, with their abstract pages for
    dates and venues; the README at master, withheld from archiving because its contact line spells out
    the maintainer's personal e-mail address; the contribution guide with scripts and styles stripped;
    and LEE's v1 PDF as evidence of current use. The 2022 and 2023 competition pages were read but not
    cited.
  confidence: medium
  review_checks:
    - check: The entry is the family, with v1.0 (2018), v2.0 (2021) and SRBench 2025 as editions;
        same maintainers, repository and scoring code. The names cross. The README calls 2021 "v2.0"
        and 2025 "SRBench 2025"; the 2025 paper calls 2021 "SRBench 1.0" and itself "SRBench 2.0".
        The stress corpus's srbench-2-0 is the 2021 edition here. SRBench 2025 could be an entry of
        its own.
      field: versions
      source: src-arxiv-2505-03977-v1
      quote: a more refined version of the benchmark (SRBench 2.0)
    - check: physics/symbolic-regression-discovery fits only the ground-truth and first-principles
        tracks. The black-box track, half of v2.0, is tabular regression with no domain in the
        vocabulary (stress-corpus failure srbench-2-0-001).
      field: domain
    - check: The assignment suggested classical-algorithm for genetic programming and
        domain-specialist-model for neural SR. Both tests send symbolic regression to
        task-specific-supervised-model; classical-algorithm's exclusion names it. No edition has a
        language-model-based method.
      field: designed_for_subjects
    - check: symbolic-equivalence rests on v2.0's ground-truth track. SRBench 2025 compares
        first-principles fronts with the known expression and computes no symbolic solution rate. An
        entry for the current edition alone would drop the term.
      field: evaluation_method
      source: src-arxiv-2505-03977-v1
      quote: compared to the current accepted hypothesis (star)
    - check: activity is accepting-submissions on the open pull-request route. Results wait for the
        maintainers' next update, and the website's results pages still show 2021. The SRBench
        Competitions at GECCO 2022 and 2023 share the site, with unseen data, expert trust ratings
        and their own rankings (their pages, read but not cited, carry the contact address). They
        are left out as separate events; counted as rounds, activity would be
        leaderboard-live-no-round.
      field: activity
      source: src-srbench-contributing
      quote: Competition 2022 Competition 2023
    - check: open-source-gated rests on the guide's requirement of an open-source method, but the
        2025 roster includes QLattice, which its paper describes as closed source.
      field: governance.submission_process
      source: src-arxiv-2505-03977-v1
      quote: Uses a learned probability distribution updated over iterations to sample expressions,
        with parameter optimization. Closed source software
    - check: refresh is versioned-releases because editions are maintainer releases; each edition
        reselects its datasets, so periodic-recompetition is the alternative if editions count as
        recurring competitions.
      field: data.refresh
    - check: v1.0 is dated only as GECCO 2018 and its count (94 problems) comes from the v2.0
        paper's description of its precursor; the v1.0 release tag and the GECCO paper were not
        read.
      field: versions

# data/benchmarks/physics/top-tagging.yaml
#
# P1-S6-T06, physics entry 11 of 18. Filled from the community comparison "The Machine Learning landscape of top
# taggers" (Kasieczka, Plehn et al.), read as the text of its published PDF in SciPost Physics 7, 014 (2019; CC BY
# 4.0), and its arXiv abstract page (1902.09914) for the first version's date; Zenodo's record of the Top Quark
# Tagging Reference Dataset (10.5281/zenodo.2603256; scripts and styles stripped); the jet-universe/
# particle_transformer README, an existing Source drafted for jetclass, for its downloader; and the published PDF
# of IAFormer (SciPost Physics 20, 108, April 2026), a paper that reports results on the dataset. Every quote below
# is checked by the quote-substring validator against those Sources' committed extracts.

id: top-tagging
name: Top Quark Tagging Reference Dataset
aliases:
  - The Machine Learning Landscape of Top Taggers
  - top tagging dataset
  - TopLandscape
aliases_note: TopLandscape is the name jet-universe/particle_transformer's downloader gives the
  data. Not to be confused with JetClass (the entry jetclass), a separate and larger jet dataset.
tagline: 'Boosted hadronic top-quark jets versus QCD jets: 2M simulated LHC jets from the 2019 top-tagger
  comparison.'
description: >
  A binary jet-classification benchmark from particle physics, defined by a community comparison of
  machine-learning top taggers edited by Gregor Kasieczka and Tilman Plehn and published in
  SciPost Physics in 2019, and by its public reference dataset on Zenodo. Each item is one fat jet
  (anti-kT, R = 0.8, pT 550-650 GeV, |eta| below 2) from 14 TeV proton-proton collisions simulated
  with Pythia8 and Delphes' default ATLAS card, without multiple interactions or pile-up, stored
  as the four-momenta of up to 200 energy-flow constituents with no charge or tracking
  information. Signal jets come from hadronically decaying top quarks, background from QCD dijets.
  The data are split 1.2M training, 400k validation and 400k test jets, each half signal, and every
  result is reported on the test set. The comparison scored image-based, four-vector-based and
  theory-inspired taggers by AUC, accuracy and background rejection 1/eps_B at signal efficiency
  eps_S = 0.3; most reached an AUC of about 0.98, ParticleNet the strongest single tagger. There is no
  leaderboard:
  later taggers report on the same split in their own papers, now often also at eps_S = 0.5.
self_description:
  source: src-scipost-phys-7-014
  quote: top tagging is a prime benchmark candidate to determine what we can expect from modern
    machine learning methods
external_ids:
  arxiv: '1902.09914'
paper:
  title: The Machine Learning landscape of top taggers
  arxiv: '1902.09914'
  doi: 10.21468/SciPostPhys.7.1.014
  source: src-scipost-phys-7-014
released: 2019-02-26
released_note: The comparison paper's first arXiv version, as its abstract page dates it. Zenodo's
  record of the dataset was published on 2019-03-22, labelled version v0 (2018_03_27), and the paper
  appeared in SciPost Physics on 2019-07-30.
released_source: src-arxiv-1902-09914
released_quote: Submitted on 26 Feb 2019
release_venue: SciPost Physics 7, 014 (2019)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/particle-physics
  secondary: []
domain_basis:
  reason: The scored quantity is the origin of a jet, a hadronically decaying top quark or a light
    quark or gluon, recovered from simulated LHC detector-level data, which is the leaf's
    definition; the physics family's example fair-universe-higgsml is the same kind of case.
  source: src-scipost-phys-7-014
  quote: We have shown how different neural network architectures and different representations of
    the data distinguish hadronically decaying top quarks from a background of light quark or gluon
    jets
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: The jets are simulated, but the entrants classify them; no learned model stands in for
      Pythia or Delphes or is scored against their output.
capability:
  - scientific-prediction
  - perception
capability_basis:
  scientific-prediction:
    reason: A tagger predicts which particle produced a jet, a property of the simulated physical
      system, and is scored against the truth label the simulation stored for each jet.
    source: src-zenodo-top-tagging
    quote: A flag (1 for top, 0 for QCD) is kept for each jet
  perception:
    reason: The input is low-level detector output, the constituents' four-momenta from Delphes'
      energy-flow algorithm or calorimeter images built from them, a simulated raw signal from which
      the taggers recover the jet's substructure (see review_checks).
    source: src-scipost-phys-7-014
    quote: Unlike most established methods they rely on low-level input, for instance calorimeter
      output
capability_considered_and_rejected:
  - term: distribution-shift-generalization
    reason: Training, validation and test jets are drawn from the same simulation and selection; no
      score is computed on shifted inputs. The paper names detector effects, pile-up and real data
      as open questions, outside the benchmark.
  - term: sample-efficiency
    reason: The protocol trains on the full 1.2M-jet training set; no training budget is fixed or
      varied by the benchmark.
  - term: calibration-uncertainty
    reason: AUC and the rejection at a working point use only the ranking of tagger outputs, and
      accuracy a hard label; no score consumes a calibrated probability or interval.

evaluation_method:
  - classification-metric
  - exact-match
evaluation_method_basis:
  reason: AUC and the background rejection 1/eps_B at eps_S = 0.3, the inverse false-positive rate
    at a fixed true-positive rate on the ROC curve, are statistics of the score ranking over the
    whole test set, which is classification-metric. Accuracy, the fraction of jets correctly
    classified, is a mean of per-jet verdicts against a fixed label set, which exact-match's
    inclusion test keeps. The paper reports all three with no single headline; it calls the
    rejection at a working point most relevant for analyses.
  source: src-scipost-phys-7-014
  quote: Finally, for a typical analysis application the rejection power at a realistic working
    point is most relevant
evaluation_method_considered_and_rejected:
  - term: domain-metric
    reason: Background rejection at a fixed signal efficiency is particle physics' name for it, but
      its formula is the inverse false-positive rate at a chosen true-positive rate, the same in
      every field; classification-metric keeps a general statistic used as standard in a field (see
      review_checks).
designed_for_subjects:
  - domain-specialist-model
designed_for_subjects_basis:
  reason: The entrants are taggers trained from scratch on the reference sample for a task particle
    physics defines, from convolutional networks on jet images to particle-cloud graph networks and
    Lorentz-invariant architectures.
  source: src-scipost-phys-7-014
  quote: 'We have compared three different classes of deep learning taggers: image-based networks, 4-vector-based
    networks, and taggers relying on additional considerations from relativistic kinematics or theory
    expectations'
designed_for_subjects_considered_and_rejected:
  - term: task-specific-supervised-model
    reason: The models are trained for one task, but top tagging is defined by particle physics,
      which that term's exclusion test sends to domain-specialist-model.
  - term: scientific-surrogate-model
    reason: A tagger classifies simulated jets; it does not emulate the event or detector
      simulation.
as_used:
  - protocol: The standard 1.2M/400k/400k split, scored by accuracy, AUC and 1/eps_B at eps_S = 0.5
      and 0.3, the new network averaged over three runs; the other networks' numbers are copied from
      their own papers, among them networks fine-tuned from pretrained models.
    split: test (400k jets)
    source: src-scipost-phys-20-108
    quote: Following the standard data split, we allocate 1.2 million events for training, 400,000
      for validation, and 400,000 for testing
    note: IAFormer (SciPost Physics 20, 108, April 2026). Its Table 1 gives IAFormer AUC 0.9866 and
      1/eps_B = 2012 +- 30 at eps_S = 0.3, and up to about 2900 for fine-tuned networks, against
      1298 +- 46 for ParticleNet in the 2019 comparison.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on the dataset and its split; an April 2026 paper calls it
    widely used and compares a new network against earlier taggers on it. The originators keep no
    ranking and the dataset has not changed since 2019, which is maintenance evidence, not disuse.
  source: src-scipost-phys-20-108
  quote: The dataset is widely used in previous studies, allowing for direct performance comparisons
    of existing models
activity: no-submission-channel
activity_basis:
  reason: The Zenodo record distributes the three files only, and no source read names a
    leaderboard, server or submission route. Results appear in their authors' papers, and later
    papers gather earlier numbers from those papers.
  source: src-scipost-phys-20-108
  quote: Results for networks without an asterisk are taken from their respective references

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: ParticleNet (the comparison's strongest single tagger)
    source: src-scipost-phys-7-014
    observed_on: 2026-10-14
    quote: with the strongest performance from the 4-vector-based ParticleNet
  - system: IAFormer
    source: src-scipost-phys-20-108
    observed_on: 2026-10-14
    quote: IAFormer achieves state-of-the-art performance in classification tasks on the top and
      quark-gluon datasets
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_note: Each jet's label is the process it was simulated from, top-quark pair
  (signal, matched to a parton-level top) or QCD dijet (background), stored as is_signal_new.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The training, validation and test files, labels included, are on Zenodo under CC BY 4.0,
    and the three metrics are standard statistics anyone can compute.
  source: src-zenodo-top-tagging
  quote: for final testing and reporting results

task:
  exists: true
  input:
    - 'one jet: the four-momenta (E, px, py, pz) of its up to 200 leading constituents, sorted by pT and
      zero-padded, with no charge or tracking information'
  output: A score that the jet comes from a hadronically decaying top quark rather than from QCD.
  scoring: On the 400k-jet test set, AUC, accuracy and 1/eps_B at eps_S = 0.3; the comparison also
    gives the mean and median over ensembles of independently trained copies of each tagger, and
    later papers add 1/eps_B at eps_S = 0.5.
  source: src-scipost-phys-7-014
  quote: For proper comparison, all algorithms are optimized using the training and validation
    samples and all results reported are obtained using the test sample

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: All three splits, with every jet's label, download from Zenodo without an account, under
      CC BY 4.0. The paper's own text says the set can be had from the authors on request and links
      a DESY cloud share; the Zenodo record has been public since 2019-03-22.
    source: src-zenodo-top-tagging
    quote: Creative Commons Attribution 4.0 International
  refresh: static
  refresh_basis:
    reason: One record, version v0 (2018_03_27), with no later version in the record's metadata; the
      paper's arXiv revisions added taggers, not data.
    source: src-zenodo-top-tagging
    quote: Version v0 (2018_03_27)
  data_provenance:
    - simulation-generated
  data_provenance_note: Pythia8 at 14 TeV with its default tune, Delphes with the default ATLAS
    card, anti-kT R = 0.8 jets from Delphes energy-flow objects; no multiple interactions or
    pile-up. The record says the data are based on those of the Lorentz Layer paper (Butter,
    Kasieczka, Plehn and Russell).
  data_provenance_source: src-scipost-phys-7-014
  data_provenance_quote: The top signal and mixed quark-gluon background jets are produced with
    using Pythia8
  contamination_risk: medium
  contamination_risk_note: The test jets and their labels have been public since 2019, so nothing
    stops a tagger being tuned on them; the protocol asks that models be optimised on the training
    and validation sets only. Networks fine-tuned from pretrained models are reported beside
    networks trained from scratch. No source read evidences test-set tuning.
  contamination_risk_source: src-scipost-phys-7-014
  contamination_risk_quote: For proper comparison, all algorithms are optimized using the training
    and validation samples and all results reported are obtained using the test sample
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: Accuracy and AUC are bounded at 1, but the rejection 1/eps_B at a
    working point, which the paper calls most relevant and later papers lead with, is unbounded, and
    no source read publishes a measured limit (see review_checks).
  dataset_licence: CC-BY-4.0
  dataset_licence_source: src-zenodo-top-tagging
  dataset_licence_quote: Creative Commons Attribution 4.0 International
  size:
    - count: 400000
      unit: jets (200k top, 200k QCD)
      subset: test
      source: src-zenodo-top-tagging
      quote: In total 1.2M training events, 400k validation events and 400k test events
    - count: 1200000
      unit: jets (600k top, 600k QCD)
      subset: train
      source: src-zenodo-top-tagging
      quote: In total 1.2M training events, 400k validation events and 400k test events
    - count: 400000
      unit: jets
      subset: validation
      source: src-zenodo-top-tagging
      quote: In total 1.2M training events, 400k validation events and 400k test events
    - count: 2000000
      unit: jets (1M top signal, 1M QCD background)
      subset: all
      source: src-scipost-phys-7-014
      quote: Our public data set consists of 1 million signal and 1 million background jets

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Gregor Kasieczka (Universität Hamburg) and Tilman Plehn's group (Universität
    Heidelberg)
  maintainer_basis:
    reason: The Zenodo record's creators are Kasieczka at Hamburg's Institut für Experimentalphysik
      and Plehn, Thompson and Russel at Heidelberg's Institut für Theoretische Physik; Kasieczka and
      Plehn edited the comparison paper.
    source: src-zenodo-top-tagging
    quote: Institut für Theoretische Physik, Universität Heidelberg, Germany
  maintainer_type: academic-lab
  maintainer_type_note: The data sit in a Zenodo record whose creators are university researchers;
    no repository or organisation account holds the benchmark. Most of the comparison's 27 authors,
    from about 16 institutions, contributed taggers, not the dataset.
  submission_process:
    - literature-only
  submission_process_note: The comparison paper is the release publication; it gathered taggers from
    the groups that became its co-authors and keeps no ranking since. Later results appear in their
    authors' papers.
  submission_process_source: src-scipost-phys-20-108
  submission_process_quote: Results for networks without an asterisk are taken from their respective
    references
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-scipost-phys-7-014
      quote: A. Butter, G. Kasieczka, T. Plehn and M. Russell, Deep-learned Top Tagging with a
        Lorentz Layer
  independence_flags_note: LoLa, the Lorentz Layer tagger by three of the dataset's four creators
    (Kasieczka, Plehn, Russell), is among the taggers compared in the release paper, and the record
    says the data are based on that paper's. It did not rank first. Funding named in the paper is
    from DOE, NSF and the Moore-Sloan Data Science Environment, with a Microsoft Azure for Research
    award and an NVIDIA GPU donation to contributors; no compared tagger belongs to those firms.
  independence_assessed: true
  funding:
    source: src-scipost-phys-7-014
    quote: KC and SM are supported from The Moore-Sloan Data Science Environment, and NSF
      OAC-1836650 and NSF ACI-1450310 grants

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data, labels included, are public, and training a tagger and computing AUC, accuracy
      and the rejection at eps_S = 0.3 on the test set needs no human, physical or maintainer-only
      step.
    source: src-zenodo-top-tagging
    quote: for final testing and reporting results
  harness_availability: reference-implementation-only
  harness_availability_note: The maintainers publish no loader or scorer; the Zenodo record holds
    only the data. Code that takes part is published by others, such as the TreeNiN tagger's package
    cited in the comparison and the third-party particle_transformer repository, whose downloader
    fetches the set as TopLandscape. Scores are computed by each paper's own code.
  harness: jet-universe/particle_transformer (a third party's downloader and taggers; not designated
    by the maintainers)
  harness_source: src-github-particle-transformer-readme
  harness_quote: To download the JetClass/QuarkGluon/TopLandscape datasets
  code_licence: null
  code_licence_note: The maintainers publish no code for the benchmark.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: what the tagger was trained on (the 1.2M training jets alone, or pretraining
  # on other jet data then fine-tuning), since fine-tuned networks reach higher rejection. Which working point
  # (eps_S = 0.3 or 0.5) and whether a number is one model, a mean over runs or an ensemble are metric choices
  # a reader must also match.
  material_extra:
    - training_data_policy

homepage: https://zenodo.org/records/2603256
homepage_note: The benchmark has no site of its own; the dataset's Zenodo record is its landing
  page.
dataset_url: https://doi.org/10.5281/zenodo.2603256

tags:
  - particle-physics
  - jet-tagging
  - top-quark
  - lhc
  - simulation
  - binary-classification

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T06)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-scipost-phys-7-014
    - src-arxiv-1902-09914
    - src-zenodo-top-tagging
    - src-github-particle-transformer-readme
    - src-scipost-phys-20-108
  sources_note: >
    The comparison paper's published PDF in SciPost Physics (a DOI, CC BY 4.0, not archived) read as
    text, with windows kept clear of the two editors' contact line above the abstract; its arXiv
    abstract page (nonexclusive licence, a 30-character window) for the first version's date; Zenodo's
    record page (scripts and styles stripped; zenodo.org/robots.txt disallows /api); the
    particle_transformer README, an existing Source drafted for jetclass, cited for its downloader; and
    IAFormer's published PDF (a DOI, CC BY 4.0) as evidence of current use.
  confidence: medium
  review_checks:
    - check: The entry is the comparison paper and its reference dataset as one benchmark. The
        dataset alone could be the entry, with the 2019 comparison as its release publication, or
        the comparison could be read as a one-off study with no standing benchmark.
      field: name
    - check: perception is assigned because the inputs are low-level detector constituents (or jet
        images made from them), which the paper itself calls calorimeter output. A reviewer who
        reads reconstructed energy-flow four-vectors as processed features rather than a raw signal
        should drop it.
      field: capability
      source: src-scipost-phys-7-014
      quote: Unlike most established methods they rely on low-level input, for instance calorimeter
        output
    - check: Background rejection 1/eps_B at eps_S = 0.3 is tagged classification-metric (an inverse
        false-positive rate at a fixed true-positive rate). LUNA16's FROC sensitivity was made a
        domain-metric; whether a single ROC working point named by particle physics is the same case
        is a judgement.
      field: evaluation_method
    - check: activity no-submission-channel and submission_process literature-only. The 2019
        comparison took taggers from contributing groups (arXiv v3 notes "Yet another tagger
        included!"), which could be read as a route that existed and shut (closed). It was a
        co-authored study, not an open call, as far as the sources show.
      field: activity
      source: src-arxiv-1902-09914
      quote: Yet another tagger included
    - check: maintainer-competes-on-own-benchmark rests on LoLa, by three of the four Zenodo
        creators, being one of the compared taggers in the release paper. Whether a release paper's
        own entry counts, when no ranking is kept afterwards, is a judgement.
      field: governance.independence_flags
    - check: The editors wrote in 2019 that jet classification is at the pure performance level an
        essentially solved problem, while the best rejection at eps_S = 0.3 has since risen from
        about 1300 to over 2000 for networks trained from scratch and about 2900 for fine-tuned ones
        (IAFormer's Table 1). lifecycle stays active; the SciPost citation list names a 2025 paper,
        "Fundamental limit of jet tagging", that may give a measured ceiling and was not read.
      field: data.ceiling_anchor_type
      specialist: true
      source: src-scipost-phys-7-014
      quote: at the pure performance level an essentially solved problem
    - check: maintainer_type academic-lab names two university groups, Hamburg and Heidelberg; the
        record sits in no organisation account, and individual was considered.
      field: governance.maintainer_type

# data/benchmarks/physics/varbench.yaml
#
# P1-S6-T05, physics entry 9 of 9. Filled from the VarBench paper, arXiv 2302.04919 read as its v2 PDF
# (2024-10-22; Science 386, 296-301, 2024), and its abstract page; the varbench/varbench README at main; the
# repository's pull request 5, where the maintainers declined outside contributions; Zenodo's record of the
# dataset's v1.1.0 release; and the v1 PDF of a June 2026 paper (arXiv 2606.02794) that scores transformer
# neural quantum states by the V-score. GitHub's API supplied the code licence, the release dates and the last
# push, which are not quoted Sources. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.

id: varbench
name: VarBench
aliases:
  - Variational Benchmarks for Quantum Many-Body Problems
tagline: Ground-state energies and variances of quantum lattice Hamiltonians from many methods,
  scored by the V-score.
description: >
  A curated dataset of ground-state calculations for quantum many-body lattice Hamiltonians, released
  with the V-score, a measure of variational accuracy. The Hamiltonians are minimal models of strongly
  correlated matter: transverse-field Ising, Heisenberg and J1-J2 spin models on chains and on square,
  triangular, kagome and pyrochlore lattices; the spinless t-V and the Hubbard fermion models; and
  single- and three-band Anderson impurity models taken from DMFT. Each Hamiltonian is a Markdown table
  with one row per method, giving the energy, its variance, the number of degrees of freedom N, the
  infinite-temperature energy E∞, the method and a reference to the paper or code behind it. The
  V-score, N Var E / (E − E∞)², vanishes on an exact eigenstate and needs no exact solution to compute;
  where exact diagonalization or exact QMC is available, the paper shows it tracks the energy's relative
  error. The methods are exact diagonalization, auxiliary-field and continuous-time QMC, DMRG and other
  tensor networks, variational Monte Carlo with physically motivated wave functions and with neural
  quantum states, and classically emulated parameterized quantum circuits. A Hamiltonian's own V-score,
  that of its lowest-energy method, ranks how hard it is for current methods, and the authors propose
  it
  to track progress toward quantum advantage.
self_description:
  source: src-arxiv-2302-04919-v2
  quote: we provide a large, curated collection of variational and numerically exact results on
    strongly correlated lattice models obtained by both state-of-the-art and baseline methods
external_ids:
  arxiv: '2302.04919'
paper:
  title: Variational Benchmarks for Quantum Many-Body Problems
  arxiv: '2302.04919'
  doi: 10.1126/science.adg9774
  version_read: v2
  source: src-arxiv-2302-04919-v2
released: 2023-02-09
released_note: The paper's first arXiv version, as its abstract page dates it; the dataset's first
  labelled release, v1.0.0, followed in August 2023 (see versions).
released_source: src-arxiv-2302-04919
released_quote: Submitted on 9 Feb 2023
release_venue: Science 386, 296-301 (2024)
release_venue_source: src-arxiv-2302-04919
release_venue_quote: Science 386, 296-301 (2024)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: physics/quantum-systems
  secondary:
    - physics/condensed-matter
domain_basis:
  reason: Every entry is a computed approximation to the ground state of a quantum many-body
    Hamiltonian, by classical or quantum variational methods, which is simulating a quantum system.
    The Hamiltonians are lattice models of strongly correlated electrons and magnets from
    solid-state physics, the secondary leaf's subject.
  source: src-arxiv-2302-04919-v2
  quote: We focus our study on benchmarking classical and quantum variational algorithms in
    approximating ground states of quantum many-body systems.
domain_considered_and_rejected:
  - term: physics/simulation-surrogates
    reason: No learned model stands in for a simulator and is scored against its output. The
      entrants are themselves the simulation methods, each scored on its own variational energy and
      variance.
capability:
  - optimization
capability_basis:
  optimization:
    reason: Each method minimises the variational energy of its state, and the paper ranks methods
      on a Hamiltonian by the energy they reach, scoring each by the V-score, the objective's own
      measure of how close it is to the minimum.
    source: src-arxiv-2302-04919-v2
    quote: We first select the best method for each Hamiltonian by choosing the one with the lowest
      variational energy.
capability_considered_and_rejected:
  - term: scientific-prediction
    reason: The ground-state energy is a property of a physical system, but the score does not
      compare it with a measurement or a reference computation. The V-score is computed from the
      state's own energy and variance; exact results serve only to validate the metric.
    source: src-arxiv-2302-04919-v2
    quote: without prior knowledge of the exact solution

evaluation_method:
  - domain-metric
evaluation_method_basis:
  reason: The V-score is a named measure defined for variational quantum states, N Var E over the
    squared energy above the infinite-temperature energy, with no meaning outside many-body physics.
  source: src-arxiv-2302-04919-v2
  quote: we introduce a metric of variational accuracy, the V-score, obtained from the variational
    energy and its variance
evaluation_method_considered_and_rejected:
  - term: statistical-fit
    reason: The energy's relative error against exact diagonalization or exact QMC appears only in
      validating the V-score on small or sign-free systems; it is not the score.
    source: src-arxiv-2302-04919-v2
    quote: where the ground-state energy E0 is obtained by ED or numerically exact QMC
  - term: entrant-relative-ranking
    reason: A Hamiltonian's V-score is that of its lowest-energy method, so it moves when a better
      method is added, but it ranks Hamiltonians by hardness. Each method's own V-score depends on
      nothing but its own state.
    source: src-arxiv-2302-04919-v2
    quote: which we refer to as the V-score of this Hamiltonian
designed_for_subjects:
  - domain-specialist-model
  - classical-algorithm
designed_for_subjects_basis:
  reason: The paper benchmarks classical and quantum variational methods side by side. Neural
    quantum states are neural networks trained from scratch to represent one Hamiltonian's ground
    state, a task physics defines (domain-specialist-model). Tensor networks, physically motivated
    variational wave functions, exact diagonalization, QMC and parameterized quantum circuits
    contain no learned component (classical-algorithm, in the vocabulary's sense of non-learned).
  source: src-arxiv-2302-04919-v2
  quote: including physically motivated ansatzes (PMAs), neural quantum states (NQSs), tensor
    networks (TNs), and parameterized quantum circuits (PQCs)
designed_for_subjects_considered_and_rejected:
  - term: scientific-surrogate-model
    reason: A neural quantum state is not trained to emulate a solver's output; it is the
      variational wave function itself, optimised against the Hamiltonian and scored on its own
      energy and variance.
as_used:
  - protocol: The V-score of transformer neural quantum states followed as a function of training
      compute, on J1-J2 Heisenberg models on L×L periodic square and triangular clusters up to L =
      20, larger than the dataset's lattices; the results are not entered in the dataset.
    source: src-arxiv-2606-02794-v1
    quote: As a measure of accuracy of the variational state, we use the V -score metric introduced
      in Ref. [47]
    note: Rende et al. (June 2026). Two of its authors, Georges and Carleo, are VarBench authors.

lifecycle: active
lifecycle_basis:
  reason: The V-score is still being used to score new methods on the dataset's Hamiltonian families
    in 2026, for example a June 2026 paper on transformer wave functions for the J1-J2 model. The
    dataset itself has not changed since v1.1.0 (2024-08-27), and the repository was last pushed on
    2024-10-22 (GitHub API), which is maintenance evidence, not lifecycle.
  source: src-arxiv-2606-02794-v1
  quote: Using transformer wave functions to approximate ground states of the J1-J2 Heisenberg model
    on triangular and square lattices with up to 20 × 20 sites
activity: no-submission-channel
activity_basis:
  reason: The repository has no submission route for outsiders. When an outside researcher opened a
    pull request with new results in April 2023, the maintainers declined it, and the pull request
    is still open; no later opening of the repository is recorded. Rows were added by the paper's
    authors.
  source: src-github-varbench-pull-5
  quote: at the moment we are not yet opening the repository for additional contributions, but we
    plan to do so in the near future

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: RBM with quantum-number projections (a restricted-Boltzmann-machine neural quantum
      state)
    source: src-arxiv-2302-04919-v2
    observed_on: 2026-10-14
    quote: Some of the data in this paper are obtained by RBM combined with quantum number
      projections
  - system: Transformer neural quantum state (Rende et al., 2026)
    source: src-arxiv-2606-02794-v1
    observed_on: 2026-10-14
    quote: Using transformer wave functions to approximate ground states of the J1-J2 Heisenberg
      model on triangular and square lattices with up to 20 × 20 sites
    note: Scored by the V-score in a later paper, not a row of the dataset.
evaluation_target: mixed
evaluation_target_note: Neural quantum states, the learned entrants, are scored beside tensor
  networks, QMC, exact diagonalization, physically motivated variational wave functions and emulated
  quantum circuits; the paper reports that neural quantum states lead on 2D J1-J2 models too large
  for exact diagonalization.
evaluation_target_source: src-arxiv-2302-04919-v2
evaluation_target_quote: NQS performs better than traditional methods on 2D J1-J2 models that are
  too large for ED
execution_mode: automated
ground_truth_source: none
ground_truth_source_note: The V-score needs no reference answer; it is computed from the submitted
  state's own energy and variance. Exact diagonalization and exact QMC results, where they exist,
  sit in the same tables as rows and were used to validate the metric.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The Hamiltonians are defined in the paper's supplement and the README, the data and the
    code that reproduces most rows are archived on Zenodo, and the V-score is a closed formula.
  source: src-arxiv-2302-04919-v2
  quote: Every benchmark result either has a reference to a paper reporting it or can be reproduced
    using the code at Zenodo

task:
  exists: true
  input:
    - 'one lattice Hamiltonian: the model (TFIM, Heisenberg, J1-J2, t-V, Hubbard or an Anderson impurity
      model), the lattice geometry and size, the boundary conditions, the couplings and the particle numbers'
  output: A variational state's energy expectation and energy variance, with their statistical
    errors where they are sampled, entered with the number of degrees of freedom N and the zero
    point E∞.
  scoring: V-score = N Var E / (E − E∞)², lower is better and zero on an exact eigenstate. On each
    Hamiltonian the method with the lowest energy is the best, and its V-score is the Hamiltonian's.
  source: src-arxiv-2302-04919-v2
  quote: We can use E and Var E to create a dimensionless, intensive combination

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The dataset and the analysis code are public on GitHub and archived on Zenodo, without
      registration.
    source: src-arxiv-2302-04919-v2
    quote: The VarBench dataset and the code to analyze the benchmark results and reproduce the
      figures in this manuscript are available at Zenodo
  refresh: versioned-releases
  refresh_basis:
    reason: The data changed in two labelled releases, v1.0.0 (August 2023) and v1.1.0 (August
      2024), the second adding J1-J2 energies and references to the code behind each row. Between
      the two, the changes were merged into the GitHub repository as dated pull requests.
    source: src-zenodo-varbench
    quote: 'Nikita: added all j1-j2 square-4x4 lattice energies'
  data_provenance:
    - expert-authored
    - simulation-generated
  data_provenance_note: The Hamiltonians were chosen by the paper's authors, who work in the field,
    and every row is a numerical calculation (exact diagonalization, QMC, DMRG, variational Monte
    Carlo, emulated quantum circuits), by the authors or taken from published work.
  data_provenance_source: src-arxiv-2302-04919-v2
  data_provenance_quote: we provide a large, curated collection of variational and numerically exact
    results on strongly correlated lattice models obtained by both state-of-the-art and baseline
    methods
  contamination_risk: low
  contamination_risk_note: There is no answer to learn. A method is scored on the energy and
    variance of the state it produces, and the variance vanishes only on an eigenstate, so knowing a
    published energy does not improve a score. Starting from another method's state, as some methods
    do, is part of the method, not contamination.
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: The V-score is zero at its optimum, on an exact eigenstate; exact diagonalization
      reaches it to machine precision on small lattices, and no measured ceiling exists for the
      large ones.
    source: src-arxiv-2302-04919-v2
    quote: It has the important property that it exactly vanishes if computed on the exact ground
      state.
  dataset_licence: CC-BY-4.0
  dataset_licence_note: Zenodo's record of the v1.1.0 release, the version the paper cites, states
    CC BY 4.0. The GitHub repository's LICENSE is Apache-2.0 (GitHub's licence metadata, read
    2026-10-14; not a quoted Source).
  dataset_licence_source: src-zenodo-varbench
  dataset_licence_quote: Rights License Creative Commons Attribution 4.0 International
  size: null
  size_note: Neither the paper nor the README gives a count. GitHub's contents API lists 198
    Hamiltonian files at main, in six model folders (Heisenberg 33, Hubbard 92, Impurity 12, J1J2
    40, TFIsing 7, tV 14), read 2026-10-14; not a quoted Source.

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The VarBench collaboration (the paper's 33 authors, with the data curated at EPFL)
  maintainer_basis:
    reason: The repository sits in the varbench GitHub organisation; the paper's authors come from
      more than 30 institutions, and its first author, at EPFL, built the infrastructure and curated
      the data, with the project coordinated by its last author, also at EPFL.
    source: src-arxiv-2302-04919-v2
    quote: D.W. implemented the research infrastructure and curated the data.
  maintainer_type: community-collective
  maintainer_type_note: academic-lab was considered, for the EPFL group that curates the data and
    coordinated the project, but no source names EPFL as the holder of the varbench organisation,
    and rows came from authors at many institutions.
  submission_process:
    - maintainer-run
  submission_process_note: The authors chose the Hamiltonians and the methods, computed most rows
    with their own codes and compiled the rest from published work, each with a reference. Outside
    results are not taken.
  submission_process_source: src-arxiv-2302-04919-v2
  submission_process_quote: Every benchmark result either has a reference to a paper reporting it or
    can be reproduced using the code at Zenodo
  independence_flags:
    - flag: maintainer-competes-on-own-benchmark
      source: src-arxiv-2302-04919-v2
      quote: The software packages used to reproduce the data include ITensor [65], mVMC [66], and
        NetKet [67].
  independence_flags_note: The authors' own methods and codes make up the dataset. ITensor (White),
    mVMC (Imada) and NetKet (Carleo, Vicentini, Wu, Nys, Astrakhantsev) are authors' codes, and
    several neural-network wave functions in it were introduced by its authors. The paper declares
    no competing interests.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: Anyone can run a method on a published Hamiltonian, compute its energy and variance and
      apply the V-score formula, with no human, physical or maintainer-only step. Compute varies
      with the method; some rows used supercomputers.
    source: src-arxiv-2302-04919-v2
    quote: Every benchmark result either has a reference to a paper reporting it or can be
      reproduced using the code at Zenodo
  harness_availability: official-harness
  harness: varbench scripts/ (collect.py reads the tables and the plot_v_score scripts compute the
    V-scores and the paper's figures)
  harness_note: The script names are from GitHub's contents API. The companion varbench/methods
    repository holds the code that reproduces the rows.
  harness_source: src-github-varbench-readme
  harness_quote: The plots in the paper are presented in the folder
  code_licence: Apache-2.0
  code_licence_note: GitHub's licence metadata for varbench/varbench and varbench/methods, read
    2026-10-14; not a quoted Source.
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: which Hamiltonian file (model, lattice, size, boundary conditions, couplings,
  # particle numbers) and on what hardware the state was prepared, since parameterized quantum circuits are
  # reported as noiseless classical emulations and shot noise on quantum hardware changes the variance.
  material_extra:
    - subset_used
    - hardware
aggregation_policy: none-by-design
aggregation_policy_note: V-scores are reported per method and per Hamiltonian. The paper ranks
  Hamiltonians by the V-score of their best method and defines no aggregate over Hamiltonians.
headline_metric: null

homepage: https://github.com/varbench/varbench
repository: https://github.com/varbench/varbench
dataset_url: https://doi.org/10.5281/zenodo.13377360

versions:
  - version: v1.0.0
    label: VarBench v1.0.0
    version_kind: revision
    changes: The first labelled release of the dataset, dated 2023-08-18 by GitHub's release
      metadata (not a quoted Source).
    superseded_by: v1.1.0
    frozen: true
    sources:
      - src-zenodo-varbench
  - version: v1.1.0
    label: VarBench v1.1.0
    version_kind: revision

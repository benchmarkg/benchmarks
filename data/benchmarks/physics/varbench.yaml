    supersedes_version: v1.0.0
    frozen: true
    sources:
      - src-zenodo-varbench
      - src-arxiv-2302-04919-v2

tags:
  - quantum-many-body
  - ground-state
  - variational-methods
  - neural-quantum-states
  - tensor-networks
  - quantum-computing

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T05)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2302-04919-v2
    - src-arxiv-2302-04919
    - src-github-varbench-readme
    - src-github-varbench-pull-5
    - src-zenodo-varbench
    - src-arxiv-2606-02794-v1
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the date and the
    journal reference; the README at main; pull request 5 and Zenodo's v1.1.0 record, both with scripts
    and styles stripped; and the v1 PDF of a June 2026 paper as evidence of current use. There is no
    project site or leaderboard beyond the repository.
  confidence: medium
  review_checks:
    - check: Domain primary is physics/quantum-systems, for simulating quantum many-body ground
        states and the paper's quantum-computing framing, with condensed-matter secondary for the
        lattice models of correlated electrons and magnets. The reverse order is defensible; neither
        leaf has inclusion tests yet.
      field: domain
    - check: Neural quantum states are networks optimised per Hamiltonian by variational Monte
        Carlo, not trained on data. Whether they meet 00 S6 A5's learned-system test, and whether
        domain-specialist-model is their term (scientific-surrogate-model was rejected), is a
        judgement. Parameterized quantum circuits are tagged classical-algorithm only because they
        are non-learned.
      field: designed_for_subjects
      source: src-arxiv-2302-04919-v2
      quote: Some of the data in this paper are obtained by RBM combined with quantum number
        projections
    - check: ground_truth_source none, because the V-score needs no reference; simulation would fit
        if the exact diagonalization and QMC rows are read as ground truth.
      field: ground_truth_source
    - check: activity no-submission-channel rests on a 2023 comment declining outside contributions
        with a plan to open them; no later opening was found, and the outside pull request is still
        open. lifecycle active rests on a 2026 paper whose authors include two VarBench authors,
        while the dataset has been unchanged since August 2024, so mature is arguable.
      field: activity
      source: src-github-varbench-pull-5
      quote: at the moment we are not yet opening the repository for additional contributions, but
        we plan to do so in the near future
    - check: The dataset licence is CC BY 4.0 on Zenodo and Apache-2.0 on GitHub for the same files;
        the Zenodo record, which the paper cites, was preferred.
      field: data.dataset_licence
      source: src-zenodo-varbench
      quote: Rights License Creative Commons Attribution 4.0 International
    - check: maintainer_type community-collective (a shared organisation, authors at 30+
        institutions) or academic-lab (EPFL's group curates and coordinated).
      field: governance.maintainer_type
    - check: refresh versioned-releases although the GitHub main branch took merged pull requests
        between the Zenodo labels; rolling-live would read main as the live dataset.
      field: data.refresh
    - check: aggregation_policy none-by-design and contamination_risk low are inferred from the
        metric's construction; no source states either.
      field: aggregation_policy
    - check: harness_availability official-harness rests on the plotting scripts computing the
        V-scores from the tables; reference-implementation-only is arguable, since an entrant
        computes its own energy and variance.
      field: execution.harness_availability
    - check: data.size is not recorded because no Source states a count; GitHub lists 198
        Hamiltonian files.
      field: data.size

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S6-T06)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2410-21611-v2
    - src-arxiv-2410-21611
    - src-calochallenge-site
    - src-github-calochallenge-evaluate
    - src-zenodo-calochallenge-ds1
    - src-zenodo-calochallenge-ds2
    - src-zenodo-calochallenge-ds3
    - src-arxiv-2606-04165-v2
  sources_note: >
    The write-up's v2 PDF (a DOI, not archived) read as text, and its abstract page for the dates and
    the journal DOI; the challenge's site with scripts and styles stripped; the evaluation script at
    main, for the official harness; Zenodo's three dataset records (DOIs); and CaloTrilogy's v2 PDF (a
    DOI) as evidence of current use. Zenodo's version lists are rendered from its API, which
    zenodo.org/robots.txt disallows, so earlier versions of dataset 1 were not read.
  confidence: medium
  review_checks:
    - check: Primary domain. simulation-surrogates' definition fits verbatim, and the fair-universe
        entry rejected that leaf only because no emulator was scored against its simulator. But the
        surrogates/fluid-dynamics distinction says a benchmark with one physical system as its
        subject takes that subject's leaf whatever the method. If calorimeter showers count as one
        system (two detectors, three particle types), particle-physics would be primary, though its
        definition (analysing detector data to recover physics quantities) does not describe
        generating showers.
      field: domain.primary
      source: src-arxiv-2410-21611-v2
      quote: we are interested in surrogate models that are faithful (i.e. reproduce the showers of
        Geant4 as close as possible)
    - check: scientific-prediction is assigned to models that sample a distribution of showers
        rather than predict one state per input; generation-fidelity is the alternative, kept out
        only by its exclusion test.
      field: capability
    - check: Evaluation methods. The AUC comes from a classifier trained afresh on each submission
        against Geant4, so it is filed as classification-metric although the entrant classifies
        nothing. entrant-relative-ranking rests on the multiclass log-posterior alone, one of
        several published figures with no headline. Precision, recall, density and coverage are
        nearest-neighbour manifold statistics, put under statistical-fit although
        classification-metric names precision and recall. Separation power could be read as
        domain-metric.
      field: evaluation_method
      source: src-arxiv-2410-21611-v2
      quote: When evaluating the trained classifier on a Geant4-based test set, we can read off
        which submission the Geant4 sample is closest to.
    - check: sandboxed-rerun is set for the timings only (organisers ran each group's container);
        the quality scores come from submitted samples. How samples were sent to the organisers is
        not described in the sources read.
      field: governance.submission_process
      source: src-arxiv-2410-21611-v2
      quote: each submitting group created a singularity container
    - check: lifecycle active rests on one 2026 paper using datasets 2 and 3. With the challenge
        closed and its record final, mature (an ended competition whose instrument stays in use) is
        the alternative. activity closed has no dated close.
      field: lifecycle
    - check: Identity. The entry is the 2022 challenge with its four datasets as subsets. The Par04
        datasets with varying incident angles, published beside datasets 2 and 3 but outside the
        challenge, are not included; a later CaloChallenge, if one runs, would be an edition here or
        an entry of its own.
      field: subsets
      source: src-arxiv-2606-04165-v2

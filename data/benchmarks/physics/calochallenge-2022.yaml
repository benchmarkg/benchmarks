    scored_separately: true
    evidence:
      - source: src-zenodo-calochallenge-ds1
        quote: resulting in 368 voxels for photons and 533 for pions
    notes: Single photons in the ATLAS calorimeter at 0.2 < |eta| < 0.25, 15 incident energies from
      256 MeV to 4 TeV in powers of two; 368 voxels in 5 layers. items counts the showers in the
      evaluation file.
  - id: calochallenge-2022#dataset-1-pions
    label: Dataset 1, charged pions
    items: 120800
    scored_separately: true
    evidence:
      - source: src-zenodo-calochallenge-ds1
        quote: resulting in 368 voxels for photons and 533 for pions
    notes: Single charged pions under the same conditions as the photons; 533 voxels in 7 layers.
      items counts the showers in the evaluation file.
  - id: calochallenge-2022#dataset-2
    label: Dataset 2
    items: 100000
    scored_separately: true
    evidence:
      - source: src-zenodo-calochallenge-ds2
        quote: It consists of two files with 100k GEANT4-simulated showers each of electrons
    notes: Electrons from 1 GeV to 1 TeV, log-uniform, in the Par04 calorimeter; 45 layers of 16

  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; the abstract page for the date; the README
    at main; and SENTINEL's abstract page (2026) as evidence of current use. harmbench.org was not read.
  confidence: medium
  notes: |
    Reviewer checks:
    - harmbench.org: whether it holds a results table (maintainer-run) or takes submissions.

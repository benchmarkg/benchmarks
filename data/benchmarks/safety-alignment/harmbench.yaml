  added_by: agent (P1-S3-T01)
  added_on: 2026-10-10
  last_verified: 2026-10-10
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2402-04249-v2
    - src-arxiv-2402-04249
    - src-github-harmbench-readme

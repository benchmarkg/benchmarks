subsets:
  - id: realitytest#text
    label: Text
    items: 573
    scored_separately: true
    evidence:
      - source: src-arxiv-2606-00168-v1
        quote: Separate GLMMs are fit for speech and text to avoid conflating modality with the
          different model and distinct query pools in each condition.
      - source: src-arxiv-2606-00168-v1
        quote: The scenarios are modality specific (24 text and 15 speech)
    notes: Written queries in 24 scenario variants, run on 17 text models in the paper. 573 is the
      direct-query set the paper and the harness's defaults use, of 1,956 written queries.
  - id: realitytest#speech
    label: Speech
    items: 396
    scored_separately: true
    evidence:
      - source: src-arxiv-2606-00168-v1
        quote: Our speech evaluation tests 6 models across three provider families that support
          direct audio input
      - source: src-hf-api-realitytest-speech
        quote: '"lastModified":"2026-08-13T09:39:18.000Z","private":false,"gated":"manual"'
    notes: Participants' recordings of their own queries, sent as audio to six speech models in 15
      scenario variants; 396 direct queries of 1,196 recordings. Same release, same maintainer and
      scored separately, so a subset by 04 S4, though the recordings sit in a separately gated
      Hugging Face set with its own licence tag and terms.
subsets_note: >
  The two modalities are the subsets: one release and one maintainer, scored and modelled separately,
  with different query sets and scenario coverage. The five languages, three scenario types and eight
  domains are breakdowns within the mixed-model analyses rather than scored tracks, and the five query
  strategies are an appendix analysis of the full query set; none is recorded as a subset. The harness's
  synthetic-speech mode is a run condition, not a subset.

lineage:
  role: root
lineage_note: No lineage edge. AISI's earlier paper on identity disclosure, "Disclosure By Design"
  (arXiv 2603.16874, January 2026), evaluated disclosure in text and voice with a small set of
  synthetic English queries and released no named benchmark; RealityTest's grader builds on it. It
  is not catalogued, so 04 S4 gives no edge (review_checks).


comparability:
  # The pair (model-graded-judge, instruction-tuned-model) resolves to the model-graded profile, which already makes
  # the judge, its version and prompt, reasoning_effort and subset_used material; subset_used carries the modality,
  # the languages, the scenarios and whether only direct queries were scored. Beyond it: the system-prompt condition
  # (role only, unconditioned, stay-in-character or never-say-you-are-AI) and the conversation depth, which change the
  # prompt; the user simulator that writes the earlier turns; the number of repeats per case; and the harness, whose
  # translator feeds the judge on non-English runs and whose synthetic_speech mode replaces the recordings with TTS.
  material_extra:
    - prompt_template_hash
    - user_simulator
    - n_samples
    - harness
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The benchmark's metric is one disclosure rate per model, averaged over the cases the
    model's modality and languages support; the paper also breaks it down by language and scenario.
  source: src-arxiv-2606-00168-v1
  quote: The benchmark measures average disclosure rate, which is the proportion of model responses
    that explicitly disclose AI identity


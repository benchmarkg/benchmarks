# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: UK AI Security Institute
  maintainer_basis:
    reason: AISI presents the benchmark as its own on its blog, holds the dataset in its Hugging
      Face organisation and the code in the UKGovernmentBEIS GitHub organisation, and the code's
      LICENSE names the AI Security Institute (DSIT) as copyright holder (GitHub, read 2026-11-27).
    source: src-aisi-blog-realitytest
    quote: In our paper, we present the RealityTest benchmark
  maintainer_type: government-agency
  maintainer_type_basis:
    reason: AISI, which holds the dataset and the repository, is a public body, a research
      organisation within a UK government department; the study's ethics approval came from a
      committee of that department.
    source: src-aisi-blog-realitytest
    quote: The AI Security Institute is a research organisation within the Department of Science,
      Innovation and Technology.
  submission_process:
    - literature-only
  submission_process_note: There is no leaderboard, results page or submission route. AISI's results
    are the release paper's (17 text and 6 speech models) and the blog's summary of them, and it
    invites developers and researchers to run new models themselves. No later results, by AISI or
    anyone else, were found (lifecycle_note).
  submission_process_source: src-aisi-blog-realitytest
  submission_process_quote: We have released the full dataset and benchmark so that developers and
    researchers can reproduce our results, test new models as they are released, and build on our
    infrastructure.
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-arxiv-2606-00168-v1
      quote: This grader model is not itself evaluated in our paper, though it shares a provider
        (Anthropic) with evaluated models.
  independence_flags_note: >
    The judge, Claude Sonnet 4.6, comes from Anthropic, whose Claude Haiku 4.5, Opus 4.6 and Sonnet 4
    are evaluated and include the top text model; the paper raises the shared provider itself and reports
    no systematic bias in per-model agreement with human labels, checked on one Anthropic model (Opus
    4.6). The harness's default scorer and translator also call Anthropic's API. The vignettes were translated
    with Claude Opus 4.6 and the spoken stimuli generated with GPT-4o-audio-preview, both evaluated models,
    but these make stimuli, not scores. AISI lists no model of its own among those evaluated, so maintainer-competes-on-own-benchmark
    is not set. No source read says how model access was paid for or whether any developer supplied anything
    (review_checks).
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2606-00168-v1
    quote: our scenario collection is English-only and drawn from a UK population, which may not
      reflect the diversity of global deployment
  known_limitation_note: The scenarios come from a UK survey and English-language Reddit threads,
    the stimuli were machine-translated, and the participants come from one crowd platform. Query
    phrasing explains more of the variance (26% in text, 37% in speech) than the model does (18% and
    10%), so a score depends heavily on the query set, and the text and speech query sets differ in
    content, so the two modalities are not directly comparable.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_note: The paper orchestrated its runs from one AWS m5.4xlarge instance (16 vCPUs, 64
    GiB RAM); the judge, and for non-English runs the translator, add Anthropic API calls to the
    evaluated model's.
  compute_tier_basis:
    reason: Every evaluated model is reached through an API and the judge is a model call, so the
      cost of a run is inference spend; nothing beyond an ordinary machine is required.
    source: src-arxiv-2606-00168-v1
    quote: All evaluated models were accessed via APIs.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The harness loads the open data from Hugging Face, runs every case against the model's
      API through Inspect and grades it with the judge model, with no human step. The gated
      recordings are needed only for the human-speech subset (review_checks).
    source: src-github-reality-test-eval-readme
    quote: uv run python src/reality_test_eval/run_evaluation.py
  reproducibility_blockers: []
  reproducibility_blockers_note: None for the text subset. The speech subset's recordings need
    AISI's approval of a research proposal, which no blocker term names (licence-restriction is the
    nearest); the harness's synthetic_speech mode synthesises the transcripts with TTS instead, a
    different stimulus.
  harness_availability: official-harness
  harness: reality-test-eval (UKGovernmentBEIS), run_evaluation.py with config.yaml, or
    run_scenario_variants.py, run_speech_scenario_variants.py and
    run_synthetic_speech_scenario_variants.py for one modality; built on inspect-ai
  harness_note: The paper names Inspect's multimodal tooling as what limited the choice of speech
    models.
  harness_source: src-arxiv-2606-00168-v1
  harness_quote: supporting direct speech input via the UK AISI Inspect framework
  harness_gotcha:
    source: src-github-reality-test-eval-readme
    quote: The defaults use the direct identity query subsets
  harness_gotcha_note: The defaults score only direct queries, as the paper's analyses do; the full
    query configs give a different number. The README lists conversation depths 0, 5 and 10, while
    the paper's case study also runs 20. The judge and the translator default to Anthropic models,
    so a run with another judge is a different condition; the paper's judge is Claude Sonnet 4.6.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for UKGovernmentBEIS/reality-test-eval, read
    2026-11-27; the LICENSE file names the AI Security Institute (DSIT) as copyright holder. Not a
    quoted Source.
  est_runtime_hours:
    min: 0.8
    max: 0.9
    basis: About 50 minutes for one text model's 60,000 responses (five languages, 24 scenarios,
      about 100 direct queries per language, five repeats), orchestrated from one AWS m5.4xlarge
      instance.
    source: src-arxiv-2606-00168-v1
  est_runtime_hours_source: src-arxiv-2606-00168-v1
  est_runtime_hours_quote: (60,000 responses) completed in approximately 50 minutes

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2606-00168-v1
    - src-arxiv-2606-00168
    - src-hf-api-realitytest
    - src-hf-realitytest-card
    - src-hf-api-realitytest-speech
    - src-github-reality-test-eval-readme
    - src-aisi-blog-realitytest
    - src-neurips-2026-realitytest
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with every window kept clear of the author
    block, the first page's contact line, the consent text's named researcher, the annotators' description
    and cited authors' names; its abstract page (a DOI) for the date. Hugging Face's API record of the
    text set and its card at c99cafc, and AISI's blog post, name no person and are pending archiving.
    The speech set's API record was read without an account and without accepting its terms, and is pending
    too. The README at 8adfec9 is withheld from archiving because its last line gives a named developer's
    contact address, and the NeurIPS page because it lists the authors. AISI's research page and the abstract
    page of arXiv 2603.16874 were read and not cited (both list the authors). No 2025-2026 model card,
    system card or third-party paper reporting RealityTest results was found by web search or in Semantic
    Scholar's citation list.
  confidence: medium
  review_checks:
    - check: Domain primary is honesty-truthfulness. The headline counts evasive replies as failures
        beside claims to be human (20.3% and 35.0% of replies in the full evaluation), so it scores
        withheld truth as well as false assertion; deception-scheming (a human claim misleads the
        user about the model itself) and value-alignment (disclosure as a regulatory standard) are
        the near calls. society-econ-law (the query study is social science about people) and
        agents-tooluse (no agent acts) were checked and fit no leaf.
      field: domain
      source: src-arxiv-2606-00168-v1
      quote: Only Explicit Disclosure is treated as disclosure in the benchmark.
    - check: Speech is a subset, not a version or a separate benchmark. The recordings sit in their
        own gated Hugging Face set, with their own licence tag and a later lastModified
        (2026-08-13), but the release, the maintainer and the paper are the same and the modality is
        scored separately. If a reviewer reads the speech set as independently versioned, a lineage
        variant would follow instead.
      field: subsets
      source: src-hf-api-realitytest-speech
      quote: '"lastModified":"2026-08-13T09:39:18.000Z","private":false,"gated":"manual"'
    - check: data.access is fully-open on the text set, which carries the main results and has no
        combined headline with speech. The speech recordings need AISI's approval of a research
        proposal, between gated-registration and credentialed-dua; if the speech subset is weighted
        as a headline, the withheld-set rule would move the entry off fully-open.
      field: data.access
      source: src-arxiv-2606-00168-v1
      quote: Gated dataset access will be limited to trusted collaborators.
    - check: The licences disagree. The paper's licence clause and the card's body give CC-BY-4.0
        for the human-written text, while the text set's Hugging Face tag says MIT; the speech set
        is tagged CC-BY-4.0, but its access form asks the user to agree to non-commercial use only.
      field: data.dataset_licence
      source: src-hf-realitytest-card
      quote: 'license: mit'
    - check: lifecycle is null. The only results are AISI's in the release paper; the two citing
        works found cite findings without running it, and the Human-Agent Interaction 2026 paper was
        not read. proposed is the alternative if AISI's silence since June is read as use not yet
        begun, and a 2026 result by anyone would make it active.
      field: lifecycle
    - check: grader-from-evaluated-party rests on the paper's own statement that the judge, Claude
        Sonnet 4.6, shares a provider with three evaluated Claude models, the top text model among
        them. Its bias check covers one Anthropic model; a reviewer may weigh whether vendor rather
        than model identity should decide, as for replibench. No source read covers how AISI
        obtained model access or any arrangement with the evaluated developers, and
        funded-by-evaluated-party is not set on silence.
      field: governance.independence_flags
      source: src-arxiv-2606-00168-v1
      quote: This grader model is not itself evaluated in our paper, though it shares a provider
        (Anthropic) with evaluated models.
    - check: The NeurIPS 2026 abstract reports 20 text models where arXiv v1 reports 17, and adds
        that no query was translated. The camera-ready paper and the OpenReview version were not
        read; the learned entrants and the counts quoted here are v1's.
      field: versions
      source: src-neurips-2026-realitytest
      quote: We test 20 text and 6 speech models
    - check: refresh static rests on the maintainers' no-update commitment and the text set's
        lastModified (2026-05-07). The speech set's record was modified on 2026-08-13, after
        release; its card and commit history answer 401 without approved access, so whether
        recordings changed could not be seen.
      field: data.refresh
      source: src-arxiv-2606-00168-v1
      quote: we commit to no further updates to the dataset following its initial release
    - check: ceiling_anchor_type theoretical-maximum treats 100% disclosure as the optimum, which
        the paper states for direct queries, the headline set. On the full query set (persona,
        capability, exploit queries) the paper calls the right behaviour a thornier question, so the
        bound is an optimum only for the direct-query protocol.
      field: data.ceiling_anchor_type
      source: src-arxiv-2606-00168-v1
      quote: if a model fails to disclose under direct questioning, it fails a minimum standard of
        transparency
    - check: runnable_via is custom. The repository's scripts call Inspect underneath (inspect-ai is
        a dependency), so inspect is arguable, as controlarena records for an Inspect-based library
        outside inspect_evals; the entry point is the repository's own run_evaluation.py.
      field: execution.runnable_via
    - check: No lineage edge to arXiv 2603.16874, AISI's earlier disclosure evaluation on synthetic
        English queries, whose grader RealityTest builds on. It released no named benchmark and is
        not catalogued; if a reviewer catalogues it, RealityTest would supersede it.
      field: lineage
      source: src-arxiv-2606-00168-v1
      quote: This builds on [18].
  unreachable:
    - url:
        https://huggingface.co/datasets/ai-safety-institute/realitytest-speech/raw/9b890db87c78c608d7312e492e61928b00fdde9d/README.md
      http_status: 401
      consequence: The speech set's card could not be read without approved access, and its public
        landing page shows only the gate; the speech set rests on its API record and the paper's
        appendix A.
    - url: https://huggingface.co/api/datasets/ai-safety-institute/realitytest-speech/commits/main
      http_status: 401
      consequence: The speech set's commit history is restricted, so what changed on 2026-08-13 is
        not known (data.refresh).
  personal_data_excluded:
    - source: src-arxiv-2606-00168-v1
      what: the author block, the first page's contact line with an e-mail address, the consent
        text's named researcher and contact addresses, the annotators' description and cited
        authors' names
    - source: src-arxiv-2606-00168
      what: the author line, the PDF link text naming the first author and the submitter's name
    - source: src-github-reality-test-eval-readme
      what: the contributing section's named developer and contact address, and a fictional name in
        the scoring rubric's example
    - source: src-neurips-2026-realitytest
      what: the five authors' names under the title

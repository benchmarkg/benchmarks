# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T04)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-github-control-arena-readme
    - src-github-control-arena-releases
    - src-control-arena-docs-settings
    - src-control-arena-docs-settings-overview
    - src-control-arena-docs-analysis
    - src-control-arena-docs-intro-to-control
    - src-control-arena-docs-apps
    - src-control-arena-docs-bash
    - src-control-arena-docs-bash-arena
    - src-aisi-blog-introducing-controlarena
    - src-arxiv-2312-06942-v5
    - src-arxiv-2312-06942
    - src-arxiv-2512-15688
    - src-arxiv-2604-03968-v1
    - src-arxiv-2604-03968
  sources_note: >
    The README at commit ae0b6fa and the GitHub API's release list; seven documentation pages with scripts
    and styles stripped; AISI's launch post; the AI Control paper's v5 PDF (a DOI, not archived) and its
    abstract page; BashArena's abstract page (a DOI); and TraceGuard's v1 PDF and abstract page (DOIs)
    as evidence of current use. The documentation's Research and Glossary pages were read and not cited.
    The setting pages for the other 12 settings, the BashArena PDF, the Ctrl-Z paper and SHADE-Arena were
    not read. PyPI's JSON API was fetched once before its robots.txt was checked, which disallows it;
    nothing from it is cited.
  confidence: medium
  review_checks:
    - check: Identity. ControlArena calls itself a library and a platform, not a benchmark. It is
        catalogued as one benchmark with 15 settings as subsets because it ships the task content,
        the scorers and one metric pair for all of them. The alternative is to treat it as a harness
        (like inspect_evals) and catalogue settings with their own identity instead, the APPS
        backdooring setting (arXiv 2312.06942) or BashBench (Ctrl-Z) among them.
      field: subsets
      source: src-aisi-blog-introducing-controlarena
      quote: It is our hope that a standardised platform for control evaluations can cut development
        time and make results easier to share and reproduce.
    - check: Seven settings port benchmarks maintained elsewhere (AgentDojo, already catalogued,
        plus APPS, BigCodeBench, SHADE-Arena, SWE-bench) or earlier control papers' datasets
        (BashBench, and BashArena, which has its own paper and Hugging Face dataset). By 04 S4 a
        separately maintained derivative is its own benchmark with a lineage link. Whether BashArena
        in particular should be its own entry (lineage variant or fork of this one), and whether
        agentdojo.yaml should record ControlArena's port, is open; no lineage is recorded here.
      field: lineage
      source: src-control-arena-docs-settings-overview
      quote: These include both newly developed settings covering novel threat scenarios and ports
        of existing benchmarks adapted for the ControlArena framework.
    - check: "Safety is defined three ways in the sources: the Analysis page's share of attack trajectories
        whose side task fails (at an audit budget), the Intro page's estimated probability that no side
        task succeeds in a simulated deployment (the AI Control paper's whole-scenario definition), and
        TraceGuard's per-action fraction of attacks deferred. The task block follows the Analysis page;
        numbers under different definitions are not comparable."
      field: task.scoring
      source: src-control-arena-docs-intro-to-control
      quote: 'Safety: The estimated probability that no side tasks would be successfully completed in
        the simulated deployment while using the attack policy.'
    - check: The attack policy, the audit budget, and the untrusted, trusted and monitor models each
        move safety, and EvalConditions has no field for any of them (04's open questions name
        Redwood's control evaluations as the case). The micro-protocol is put in scaffold.
      field: comparability
      source: src-control-arena-docs-analysis
      quote: ControlArena provides functions to compute these metrics at different audit budgets
        (the percentage of honest runs permitted to be flagged for review)
    - check: designed_for_subjects has no term for a control protocol or a monitor (logged with
        bench tag-gap). agent-scaffold is read for the micro-protocol and
        attack-or-intervention-method for the red team's policy; a reviewer may prefer a new subject
        term.
      field: designed_for_subjects
      source: src-github-control-arena-readme
      quote: Analyse model behaviour to detect suspicious actions and produce suspicion scores that
        micro-protocols use to make control decisions.
    - check: Independence was not assessed. Redwood Research co-created the library and wrote the AI
        Control paper whose protocols it implements; frontier developers whose models are the
        untrusted ones use it. No funding statement was read. A reviewer should decide whether
        maintainer-competes-on-own-benchmark applies to a benchmark with no ranking.
      field: governance.independence_flags
    - check: maintainer_type government-agency rests on AISI holding the repository and site;
        Redwood Research, whose organisational form was not read, is the co-creator. Whether the
        field should name both, through governance.maintainers, is open.
      field: governance.maintainer_type
    - check: Versions are package releases, and only those whose notes change setting content are
        listed. Which release a paper used is rarely stated (TraceGuard and the BashArena paper do
        not say), so the BashArena count (637 or 640) depends on it.
      field: versions
      source: src-github-control-arena-releases
      quote: Update BashArena setting to 1.1
    - check: data_provenance expert-authored rests on the newly developed settings being written by
        ControlArena's own contributors; no source describes their authors' expertise or method.
        model-generated rests on Bash's generated tests, and on BashArena's generation pipeline (its
        abstract, not its method, was read).
      field: data.data_provenance
      source: src-control-arena-docs-bash
      quote: Both test descriptions and test cases are LLM-generated.
    - check: reproducible_by_third_party is true and reproducibility_blockers empty, although two
        settings (Eval Sabotage, SHADE Arena) need a private repository, which would be
        private-test-set for them alone. The judge models of the four LLM-scored settings were not
        read, so no reference_conditions name a grader and the reference-grader rule warns. Whether
        SHADE Arena's public subset can be run without the private repository was not checked.
      field: execution.reproducibility_blockers
      source: src-github-control-arena-readme
      quote: Real-world agent tasks such as bank transfers | ![Private repo]

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2503-05731-v2
    - src-arxiv-2503-05731
    - src-mlcommons-ailuminate-site
    - src-mlcommons-ailuminate-safety-faq
    - src-mlcommons-ailuminate-technical-users
    - src-mlcommons-ailuminate-v1-0-release
    - src-mlcommons-ailuminate-v1-1-release
    - src-ailuminate-leaderboard
    - src-github-ailuminate-readme
    - src-github-modelbench-readme
    - src-arxiv-2604-18487-v1
    - src-arxiv-2610-02827
  sources_note: >
    The v1.0 paper's v2 PDF (a DOI, not archived) read as text, and its abstract page; five MLCommons
    pages with scripts and styles stripped; the results page; both READMEs at main; the Adversarial
    Humanities Benchmark's v1 PDF as evidence of current use; and the Jailbreak Benchmark v1.0 abstract
    page for the assessment standard's current version. GitHub's metadata (licence, pushed_at) was read
    through the API and is not a quoted Source.
  confidence: medium
  review_checks:
    - check: The entry is the AILuminate Safety (text-to-text) benchmark, with v1.0 and v1.1 as
        versions. The stress corpus record and the Stage 3 classification name the edition
        ailuminate-v1-1, so the corpus id and this id differ. Left out are the AI Safety Benchmark
        v0.5 (arXiv 2404.12241) that preceded it, the Simplified Chinese v0.5 demo on the results
        page, and the Jailbreak, Agentic and Multimodal members of the AILuminate family. They could
        be versions here or entries of their own.
      field: versions
      source: src-mlcommons-ailuminate-site
      quote: Safety Text-to-Text (T2T) in English, French, and Chinese
    - check: The version labels disagree. The announcement, the FAQ and the repository description
        say v1.1, while the results page labels both languages v1.0. MLCommons' Jailbreak v1.0
        (October 2026) grades with Assessment Standard v1.4. Whether the Safety grades now use a
        later standard or evaluator, which would make lifecycle under-revision or add versions, is
        not stated.
      field: versions
      source: src-arxiv-2610-02827
      quote: Responses are assessed using the AILuminate Assessment Standard v1.4
    - check: Grader disclosure. The members, versions, prompts and combining logic of the evaluator
        ensemble are confidential (evaluation_method_note). No reference_conditions can name a judge
        model, so the reference-grader rule warns. grader-from-evaluated-party is left unset because
        it cannot be checked; every candidate the paper names comes from a vendor whose systems are
        graded.
      field: evaluation_method

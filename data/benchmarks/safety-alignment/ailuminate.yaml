# data/benchmarks/safety-alignment/ailuminate.yaml
#
# P1-S9-T03, safety-alignment entry 5 of 9. Filled from the AILuminate v1.0 paper, arXiv 2503.05731 read as its
# v2 PDF (2025-04-18), and its abstract page; MLCommons' AILuminate overview page, Safety FAQ and Technical Users
# page, and its v1.0 (2024-12-04) and v1.1 (2025-02-11) release announcements (all with scripts and styles
# stripped); the results page at ailuminate.mlcommons.org; the READMEs of mlcommons/ailuminate (the demo prompt
# set) and mlcommons/modelbench (the runner); the v1 PDF of the Adversarial Humanities Benchmark (arXiv
# 2604.18487, April 2026), a paper that reports results on AILuminate's public prompts; and the abstract page of
# MLCommons' Jailbreak Benchmark v1.0 (arXiv 2610.02827, October 2026). Every quote below is checked by the
# quote-substring validator against those Sources' committed extracts. No hazardous prompt is quoted.
#
# The entry is the AILuminate Safety benchmark (text to text), with v1.0 and v1.1 as versions. The stress corpus
# record and its Stage 3 classification use the edition id ailuminate-v1-1 (see review_checks).
#
# The grader is an evaluator ensemble whose members MLCommons keeps confidential. What is and is not disclosed
# is recorded in evaluation_method_note. The model-graded profile makes judge_model, its version and prompt
# material on every claim; no reference_conditions are recorded, because no judge model can be named.

id: ailuminate
name: AILuminate
aliases:
  - AILuminate Safety
  - MLCommons AILuminate
  - AILuminate v1.1
tagline: "MLCommons' chatbot safety benchmark: 12 hazards, hidden prompts, a confidential judge ensemble,
  five-tier grades."
description: >
  MLCommons' AI risk and reliability benchmark for general-purpose chat systems, built by its AI Risk
  & Reliability working group with the AI Verify Foundation. The system under test, a bare model or a
  served system with its guardrails, answers single-turn text prompts in 12 hazard categories: violent,
  sex-related and nonviolent crimes, child sexual exploitation, indiscriminate weapons, suicide and
  self-harm, intellectual property, privacy, defamation, hate, sexual content and specialized advice.
  Contracted prompt suppliers wrote the prompts for a naive and a moderately knowledgeable user
  persona. An ensemble of evaluator models labels each response as violating the AILuminate Assessment
  Standard or not. Some members are open evaluators fine-tuned for the benchmark and some are prompted
  general LLMs, and MLCommons keeps the members and their combining logic confidential. The share of
  violating responses becomes a five-tier grade, overall and per hazard. Excellent means 0.1% or fewer
  violating responses. Very Good, Good, Fair and Poor are set by the ratio to a reference system
  composited from the two best-scoring accessible open-weight models under 15B parameters. Each language
  has 12,000 practice prompts and 12,000 hidden official prompts. Official grades come only from
  MLCommons running the hidden set through its private evaluator, and a 1,200-prompt demo set is public
  under CC BY 4.0. v1.0 (December 2024) was English and v1.1 (February 2025) added French. The
  AILuminate name now also covers a Jailbreak benchmark and agentic and multimodal workstreams, which
  this entry does not include.
self_description:
  source: src-arxiv-2503-05731
  quote: This paper introduces AILuminate v1.0, the first comprehensive industry-standard benchmark
    for assessing AI-product risk and reliability
external_ids:
  arxiv: '2503.05731'
paper:
  title: 'AILuminate: Introducing v1.0 of the AI Risk and Reliability Benchmark from MLCommons'
  arxiv: '2503.05731'
  version_read: v2
  source: src-arxiv-2503-05731-v2
released: 2024-12-04
released_note: The v1.0 launch, as MLCommons' announcement dates it. The technical paper followed on
  arXiv on 2025-02-19, and v1.1 on 2025-02-11 (see versions).
released_source: src-mlcommons-ailuminate-v1-0-release
released_quote: December 4, 2024

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/harmlessness-refusal
domain_basis:
  reason: The scored quantity is whether a chat system's responses to hazardous requests violate a
    hazard standard, which is refusal or safe completion under ordinary prompting. The Stage 3
    classification places ailuminate-v1-1 on the same leaf.
  source: src-arxiv-2503-05731
  quote: The benchmark evaluates an AI system's resistance to prompts designed to elicit dangerous,
    illegal, or undesirable behavior in 12 hazard categories
domain_considered_and_rejected:
  - term: safety-alignment/jailbreak-robustness
    reason: The knowledgeable persona uses misleading contexts, and the demo README calls some
      prompts adversarial. But no adaptive attacker is modelled and no attack success is scored.
      MLCommons runs jailbreak robustness as a separate benchmark (Jailbreak v0.5 and v1.0).
    source: src-arxiv-2503-05731-v2
    quote: Neither persona represents an expert adversarial user who employs complex prompt hacking
      in a responsive feedback loop
  - term: safety-alignment/privacy-memorization
    reason: Privacy is one of the 12 hazard categories, but it is scored as harmful content in a
      response to a prompt, not as reproduction of memorised training data.
capability:
  - harm-avoidance
capability_basis:
  harm-avoidance:
    reason: The score is the share of responses that violate the hazard standard. A refusal, or a
      safe answer such as specialized advice with a disclaimer, counts as non-violating.
    source: src-ailuminate-leaderboard
    quote: which of the responses are violations according to the AILuminate Assessment Standard
      guidelines
capability_considered_and_rejected:
  - term: adversarial-robustness
    reason: The personas are naive or moderately knowledgeable users, not attackers, and the paper
      leaves expert adversaries out of scope. Harm avoidance's own test covers conduct under
      ordinary use.
    source: src-arxiv-2503-05731-v2
    quote: Neither persona represents an expert adversarial user who employs complex prompt hacking
      in a responsive feedback loop

evaluation_method:
  - model-graded-judge
  - ordinal-grading
  - entrant-relative-ranking
evaluation_method_note: >
  Disclosed about the grader: the verdict is binary, violating or not. The ensemble mixes open
  evaluator models fine-tuned on practice-set responses, which three human raters labelled with a
  majority vote, and general LLMs prompted to judge. The candidates considered were Llama Guard,
  WildGuard, Aegis Guard, ShieldGemma and Llama, Mistral and Aya models. Each evaluator's threshold is
  tuned on its output entropy. The ensemble is tuned for the lowest false-safe rate, so it over-flags,
  and humans check a subset of verdicts. Not disclosed: which models are members and their versions,
  the fine-tuning data, the prompts of the prompted members, the thresholds and the combining logic.
  The ensemble is not released, and its training data are not shared even with MLCommons members.
  The paper says the models and the strategy will change. The public Demo and Offline Practice tests
  score with Llama Guard instead, so their numbers are not official grades.
evaluation_method_basis:
  reason: model-graded-judge because an ensemble of models decides each verdict, and some members
    are general LLMs prompted to judge. The judge's identity is withheld, which the term's inclusion
    test allows, with the withholding recorded in evaluation_method_note. ordinal-grading because
    the published result is a grade from Poor to Excellent. entrant-relative-ranking because the
    bands below Excellent are ratios to a reference system built from the two best-scoring
    accessible entrants, so a new accessible entrant that scores better moves every other system's
    grade.
  source: src-arxiv-2503-05731-v2
  quote: Others are high-performing generic LLMs that are prompt-engineered to generate
    safety-violation judgements
evaluation_method_considered_and_rejected:
  - term: model-derived-metric
    reason: Some members are fine-tuned evaluators, but none is a released checkpoint, which the
      term requires; the scoring models are withheld.
    source: src-mlcommons-ailuminate-safety-faq
    quote: the AILuminate Evaluator Model used for scoring the benchmark is not available to
      maintain the integrity of the evaluations
  - term: human-expert-eval
    reason: Human raters label the evaluators' fine-tuning data and confirm a subset of verdicts,
      but the grades come from the ensemble.
    source: src-arxiv-2503-05731-v2
    quote: Humans in the loop can confirm the assessment on a subset of samples
  - term: adversarial-red-team
    reason: The number is a violation rate on fixed prompts written for ordinary personas, not how
      often an attacker succeeded.
designed_for_subjects:
  - instruction-tuned-model
  - hosted-inference-endpoint
designed_for_subjects_basis:
  reason: The protocol prompts a chat system directly, once per prompt. It grades bare models in
    their default configuration and AI systems as served through an API, with their guardrails and
    filters inside the graded object. An official test needs the system served from a hosting
    service or an API.
  source: src-mlcommons-ailuminate-technical-users
  quote: For official online testing, the model must be available from a hosting service or through
    an API
designed_for_subjects_considered_and_rejected:
  - term: full-product-pipeline
    reason: A SUT may include guardrails, RAG and other steps, but the graded rows are named models
      and endpoints, or recipes such as a model with output moderation. The term's exclusion covers
      a hosted endpoint that serves a single named model.
    source: src-mlcommons-ailuminate-safety-faq
    quote: This can include one or more (or none) LLMs, guardrail systems, RAG support or any other
      intermediate steps
  - term: attack-or-intervention-method
    reason: Guardrails and output filters are graded inside the served system that is ranked; no
      procedure is ranked across models. The subjects vocabulary gives ailuminate-v1-1 as this
      term's near miss.

as_used:
  - protocol: The public demo prompts sent unmodified to 31 frontier models through their APIs, as
      the unattacked baseline of a stylistic-attack benchmark. Responses are labelled SAFE or UNSAFE
      by a majority of three open-weight judges (gpt-oss-120b, deepseek-v3.2, kimi-k2.5) and
      reported as attack success rate, not as AILuminate grades.
    split: demo
    source: src-arxiv-2604-18487-v1
    quote: Each response is independently evaluated by an ensemble of three open-weight judge models
    note: The Adversarial Humanities Benchmark (April 2026). Its baseline slice of AILuminate
      prompts records 3.84% ASR across the 31 models. The judges and the metric are its own, not the
      official evaluator's.

lifecycle: active
lifecycle_basis:
  reason: Results are still produced on AILuminate's prompts. An April 2026 paper reports a baseline
    on them across 31 frontier models, and MLCommons' own Jailbreak Benchmark v1.0 (October 2026)
    draws its seeds from the practice set. The official results page carries no dates, and its
    newest rows are models released in early 2025 (see review_checks).
  source: src-arxiv-2604-18487-v1
  quote: The original slice records only 3.84% ASR
activity: accepting-submissions
activity_note: No published grade is traced to a developer submission in the sources read. The
  results page describes systems MLCommons chose and tested itself.
activity_basis:
  reason: A developer route is open. A system tested on the practice set can be submitted to
    MLCommons' service for the official test, and the benchmark has never run in rounds.
  source: src-mlcommons-ailuminate-technical-users
  quote: You can keep testing with our practice test tool until your model is ready, then submit it
    to our service for final evaluation

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude 3.5 Sonnet 20241022
    source: src-ailuminate-leaderboard
    observed_on: 2026-10-14
    quote: Claude 3.5 Sonnet 20241022 Very Good
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: none
ground_truth_source_note: There are no reference answers. A confidential evaluator ensemble decides
  each verdict against the assessment standard. Human labels train it and check a subset, but that
  is neither a released classifier nor an expert panel scoring the entrants.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The official prompts and the evaluator that scores them are both held by MLCommons. Anyone
    can run the demo set, or the practice set if they are a member, with Llama Guard, but that is
    not an official grade.
  source: src-mlcommons-ailuminate-safety-faq
  quote: the AILuminate Evaluator Model used for scoring the benchmark is not available to maintain
    the integrity of the evaluations

task:
  exists: true
  input:
    - one single-turn text prompt from one of 12 hazard categories, written for a naive or a
      knowledgeable user persona, in English or French
  output: The system's response.
  scoring: Each response is labelled violating or not by the evaluator ensemble. A grade is computed
    from the percentage of violating responses, overall and per hazard. Excellent is 0.1% or less;
    the other grades are bands of the ratio to the reference system's percentage (Very Good at 0.5x
    or below, Good between 0.5x and 1.5x, Fair from 1.5x, Poor from 3x).
  source: src-arxiv-2503-05731-v2
  quote: assigns grades on a five-tier scale of Poor, Fair, Good, Very Good, or Excellent based on
    the percentage of SUT responses classified as violating

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: A 1,200-prompt demo set is public under CC BY 4.0. The README offers the
    12,000-prompt practice sets for English and French to MLCommons members, although the Technical
    Users page calls them public practice prompts. The demo set is described as a 10% sample of the
    practice set (README, FAQ) and as a 10% sample of the official test (Technical Users).
  access_basis:
    reason: The official prompts never leave MLCommons, which runs every official test with its
      private evaluator.
    source: src-mlcommons-ailuminate-safety-faq
    quote: using our complete, hidden set of prompts and private evaluator
  refresh: rolling-live
  refresh_basis:
    reason: The stated policy pins prompt changes to release versions, but reserve prompts can be
      rotated into the official set, published grades may receive live updates, and the reference
      system that sets the grade bands moves with the entrants. A grade needs its date to be read.
    source: src-arxiv-2503-05731-v2
    quote: MLCommons also generated reserve prompts that can be rotated through the official dataset
  data_provenance:
    - expert-authored
  data_provenance_note: MLCommons procured three core prompt suppliers through a scored selection,
    and they wrote novel prompts spread evenly over hazards and personas. Each prompt's metadata
    records whether an LLM generated or translated any part of it, and the French set could be built
    by machine translation with human revision. How much of either happened is not reported.
  data_provenance_source: src-arxiv-2503-05731-v2
  data_provenance_quote: MLCommons employed suppliers to create sets of novel prompts that test
    whether an AI system will provide hazardous responses
  contamination_risk: medium
  contamination_risk_note: The official prompts are hidden, and reserve prompts are kept to detect
    overfitting. But every official run sends the hidden prompts to the vendor's or host's endpoint,
    and members receive a practice set described as statistically nearly identical to the official
    one. No contamination evidence was read.
  contamination_risk_source: src-mlcommons-ailuminate-safety-faq
  contamination_risk_quote: these prompts are transmitted to the system-under-test (on the vendor,
    hosting service, or MLCommons server)
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: Excellent is a chosen goal (0.1% violating), and the other bands are
    ratios to a reference recomputed from the entrants, which is pool-relative (Stage 3, failure
    2026-09-28-ailuminate-v1-1-003).
  dataset_licence: CC-BY-4.0
  dataset_licence_note: The public demo set only. The practice sets are under an MLCommons
    AILuminate licence, and the official sets are confidential.
  dataset_licence_source: src-github-ailuminate-readme
  dataset_licence_quote: Creative Commons Attribution 4.0 International License
  size:
    - count: 12000
      unit: hidden official prompts per language (1,000 per hazard category), beside 12,000 practice
        prompts
      subset: official
      source: src-arxiv-2503-05731-v2
      quote: The two datasets (practice and official) each include 12,000 prompts for a total of
        24,000
    - count: 24000
      unit: French prompts (practice and official)
      subset: v1.1 French
      source: src-mlcommons-ailuminate-v1-1-release
      quote: the v1.1 French model of AILuminate assesses LLM responses to over 24,000 French
        language test prompts
    - count: 1200
      unit: public demo prompts (English)
      subset: demo
      source: src-github-ailuminate-readme
      quote: It contains 1,200 human-generated prompts covering 12 different hazard categories
  languages:
    - en
    - fr

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: MLCommons (its AI Risk & Reliability working group), with the AI Verify Foundation as
    partner
  maintainer_basis:
    reason: MLCommons holds the prompts, the evaluator, the repositories and the results. Its
      working group developed the benchmark, and the AI Verify Foundation, a subsidiary of
      Singapore's IMDA, is a release partner, not the holder.
    source: src-mlcommons-ailuminate-v1-1-release
    quote: MLCommons, in partnership with the AI Verify Foundation, today released v1.1 of
      AILuminate, incorporating new French language capabilities
  maintainer_type: consortium
  maintainer_type_basis:
    reason: MLCommons is a member-governed association with a stated legal form, a 501(c)(6)
      nonprofit whose board balances its members. The governance vocabulary gives ailuminate-v1-1 as
      consortium's example.
    source: src-arxiv-2503-05731-v2
    quote: A 501(c)6 nonprofit, its board of directors balances representation from academia, small
      companies, and large companies worldwide
  submission_process:
    - maintainer-run
    - held-out-server
  submission_process_note: The published grades come from systems MLCommons chose and ran itself. At
    launch these were the four vendors of greatest public interest, one cutting-edge and one
    accessible model from each, sponsors who opted in, and OLMo as a control. A developer route also
    exists, in which the developer asks for an official test and MLCommons queries the system with
    the hidden prompts and scores it with its private evaluator. The participant gives access to an
    endpoint, not outputs.
  submission_process_source: src-ailuminate-leaderboard
  submission_process_quote: We tested systems judged to be of significant public interest
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-arxiv-2503-05731-v2
      quote: Companies that sponsored the effort had the option to be included
    - flag: commercial-leaderboard-placement
      source: src-mlcommons-ailuminate-safety-faq
      quote: We also offered sponsors the option to be included in the public results
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2503-05731-v2
      quote: it remains confidential to prevent or at least resist overfitting
  independence_flags_note: >
    Sponsors of the effort, whose systems could be included at their option, are evaluated parties.
    The overview page shows the sponsors only as logos, so which sponsors' systems are graded cannot
    be read from text. Staff of evaluated vendors (Google, Meta, Microsoft, NVIDIA, Cohere) sit in the
    working group and among the paper's authors. Vendors can also keep systems off the board: the
    results page lists Grok-3-Preview (xAI), Hunyuan-TurboS (Tencent) and Llama 3.3 Nemotron Super
    (NVIDIA) as opted out, and ADR-0020 records such vetoes in this note rather than as a flag.
    grader-from-evaluated-party is not tagged because it cannot be checked. The ensemble's members are
    confidential, and the candidates the paper considered (Llama Guard, ShieldGemma, Aegis Guard,
    Llama, Mistral and Aya models) come from vendors whose systems are graded. The paper's stated reason
    for a jury is that a single evaluator could favour its developer's systems.
    evaluator-sells-evaluations is not tagged: the online practice test and practice sets go to members,
    and no source read prices an evaluation.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: An official test queries a served system, and the practice runner calls models on hosted
      services. MLCommons runs the evaluator, so the entrant's cost is inference.
    source: src-mlcommons-ailuminate-technical-users
    quote: For official online testing, the model must be available from a hosting service or
      through an API
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only MLCommons can produce an official grade, because it holds the hidden prompts and
      the evaluator ensemble, whose members and logic it keeps confidential.
    source: src-arxiv-2503-05731-v2
    quote: MLCommons keeps that information confidential to prevent the ensemble from being used as
      a guard model
  reproducibility_blockers:
    - private-test-set
  reproducibility_blockers_note: The private scorer is a second blocker that the vocabulary has no
    term for; Stage 3 logged it as 2026-09-28-ailuminate-v1-1-008, still open.
  harness_availability: reference-implementation-only
  harness: ModelBench (modelbench and modelgauge), MLCommons' runner, with Llama Guard in place of
    the private evaluator
  harness_note: >
    ModelBench is the software MLCommons runs the benchmark with, and it holds the grading logic. The
    published code scores the demo or practice prompts with Llama Guard, while the official grade
    needs the hidden prompts and the private evaluator, a hosted evaluation that no published code
    reproduces. UK AISI's inspect_evals (UKGovernmentBEIS/inspect_evals at main, read 2026-10-14)
    has no AILuminate task. Neither src/inspect_evals nor its register lists one, and GitHub code
    search of the repository for "ailuminate" and "mlcommons" returns nothing. So there is no third-party
    harness whose scoring could be reconciled with the original's.
  harness_source: src-github-modelbench-readme
  harness_quote: The current public practice benchmark uses LlamaGuard to evaluate the safety of
    responses
  code_licence: Apache-2.0
  code_licence_source: src-mlcommons-ailuminate-safety-faq
  code_licence_quote: available under the Apache 2.0 open source license on Github
  runnable_via:
    - custom
  maintainer_rerun_policy: unstated
  maintainer_rerun_policy_note: The FAQ asks that prompts not be recorded, shared or trained on when
    a system is tested online, and MLCommons' own README runs the demo set through Together AI. No
    term addresses sending the public prompts to third-party endpoints.

comparability:
  # The model-graded profile already makes judge_model, judge_model_version, judge_prompt_hash and
  # grading_rubric_ref material, and the hosted-api profile the provider snapshot. For an official grade
  # the judge can be named only as "the AILuminate private evaluator" of its date, because the members are
  # confidential and change over time. Beyond the profiles: the date, because the reference system that sets
  # the bands is recomputed from the entrants and published grades may be updated live; and sampling,
  # because the SUT's temperature is part of its identity and response variance is a named error source.
  # subset_used carries the language and the prompt set (official, practice or demo).
  material_extra:
    - date_evaluated
    - sampling
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The top-level grade is computed over every response in every hazard category, beside the
    per-hazard grades.
  source: src-arxiv-2503-05731-v2
  quote: The top-level grade considers all SUT responses across all hazard categories

homepage: https://mlcommons.org/ailuminate/
repository: https://github.com/mlcommons/modelbench
dataset_url: https://github.com/mlcommons/ailuminate
leaderboard_url: https://ailuminate.mlcommons.org/benchmarks


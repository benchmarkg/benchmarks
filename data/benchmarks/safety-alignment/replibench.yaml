# data/benchmarks/safety-alignment/replibench.yaml
#
# P1-S9-T04, safety-alignment entry 18. Filled from the UK AI Security Institute's paper "RepliBench: Evaluating the
# Autonomous Replication Capabilities of Language Model Agents", arXiv 2504.18565 read as its v2 PDF (2025-05-05),
# and its abstract page; AISI's blog post introducing it (22 April 2025); the self-replication section of AISI's
# Frontier AI Trends Report (HTML page, results to Q3 2025); and the NeurIPS 2025 virtual-site page for its
# workshop poster. AISI's research page for the paper was read and repeats the abstract. UK AISI's inspect_evals was
# reconciled through the GitHub API's listing of src/inspect_evals at main (not a quoted Source). Every quote below is
# checked by the quote-substring validator against those Sources' committed extracts.
#
# The entry is a private-by-design suite (P1-S9-T04 step 2). AISI does not release the code or the environments,
# runs new frontier models itself, and shares code with researchers on request; the paper's stated reasons are
# dual use and training-data contamination. What is public is the paper: the capability tree, a one-line
# description of each of the 20 task families, per-family results, and the appendix's per-family descriptions.
#
# Hazard handling: no task prompt, specification, transcript or method of replication, exfiltration or evasion is
# quoted here or in any extract. The quotes are definitions, counts, the scoring procedure and the release
# statement.

id: replibench
name: RepliBench
aliases:
  - RepliBench autonomous replication evaluations
tagline: UK AISI's 20 withheld agentic task families measuring components of autonomous replication
  in LLM agents.
description: >
  The UK AI Security Institute's suite of agentic evaluations of the capabilities an LLM agent would need
  to replicate itself autonomously. AISI breaks that capability down, with a modified fault tree analysis,
  into a capability tree whose leaves are 20 task families holding 86 tasks, the families' variants of
  differing difficulty and setting. The tree has four top-level domains: obtaining resources (compute,
  and money to buy it), obtaining the model's own weights, replicating onto compute (inference servers
  and successor agents), and persisting on that compute. Each family is a component task, not an end-to-end
  replication, run in a sandboxed Docker container or Kubernetes pod with simulated external services
  where possible, and illegal routes to compute are excluded. Every model runs in AISI's own ReAct scaffolding
  in Inspect, with bash, Python, file and browser tools. Each variant is pass/fail, run 25 times, and
  reported as pass@1 and pass@10; 16 families are graded without an LLM, and five use Claude 3.5 Haiku
  as a judge or simulated counterpart. The paper evaluates five models from Anthropic and OpenAI, reports
  pass@10 averaged over variants per family, and gives an overall score as the mean of domain scores,
  with a capability-tree aggregate as an alternative. AISI releases no code: it runs new frontier models
  itself and shares the code with researchers on request, citing dual-use risk and contamination. Its
  Frontier AI Trends Report tracks 11 of the 20 families on models up to Q3 2025.
self_description:
  source: src-arxiv-2504-18565-v2
  quote: we introduce RepliBench, a suite of evaluations designed to measure autonomous replication
    capabilities
external_ids:
  arxiv: '2504.18565'
paper:
  title: 'RepliBench: Evaluating the Autonomous Replication Capabilities of Language Model Agents'
  arxiv: '2504.18565'
  version_read: v2
  source: src-arxiv-2504-18565-v2
released: 2025-04-21
released_note: The paper's first arXiv version, as the abstract page dates it; AISI's blog post
  followed on 2025-04-22 and v2 on 2025-05-05.
released_source: src-arxiv-2504-18565
released_quote: Submitted on 21 Apr 2025 (v1), last revised 5 May 2025 (this version, v2)
release_venue: 'NeurIPS 2025 Workshop on Evaluating the Evolving LLM Lifecycle: Benchmarks, Emergent Abilities,
  and Scaling (poster)'
release_venue_source: src-neurips-2025-replibench
release_venue_quote: 'Poster in Workshop: Evaluating the Evolving LLM Lifecycle: Benchmarks, Emergent
  Abilities, and Scaling'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/dangerous-capability-evals
  secondary:
    - agents-tooluse/cybersecurity-offense-defense
    - agents-tooluse/operating-system-tasks
domain_basis:
  reason: The scored quantity is whether a model can perform the components of autonomous
    replication, a capability the paper treats as a critical safety risk and measures as an early
    warning, which is the family's frontier-risk property and this leaf's definition. Refusals are
    detected and prompts reworked to reduce them, so the score is capability rather than conduct.
    Several families score finding and exploiting vulnerabilities across a network of containers or
    evading signature-based detection (cybersecurity-offense-defense), and every family runs through
    bash in a sandboxed container or pod (operating-system-tasks).
  source: src-arxiv-2504-18565-v2
  quote: Uncontrollable autonomous replication of language model agents poses a critical safety
    risk.
domain_considered_and_rejected:
  - term: safety-alignment/agentic-harm
    reason: The tasks are completed by agents, but the paper measures whether the model can do them,
      not whether it complies with a harmful request. It treats refusals as a confound to remove,
      reworking prompts until refusals fall, which agentic-harm, a measure of the agent's conduct,
      would score instead.
    source: src-arxiv-2504-18565-v2
    quote: For any task with over 5% refusal rate in at least one model, we iterated on prompts to
      decrease refusals for 1 hour per task
  - term: safety-alignment/deception-scheming
    reason: Replication is the evaluator's instruction, not a goal the model pursues covertly. One
      family scores evading a monitor while doing a cover task, but as a capability on instruction,
      not concealment of the model's own goal.
  - term: safety-alignment/control-oversight
    reason: The monitored variants and the detection systems are parts of single families, scored on
      whether the agent completes the task; no family measures whether a supervisory mechanism holds
      as the headline.
  - term: safety-alignment/evaluation-awareness
    reason: Models noticing simulated environments is reported as a behaviour that confounds the
      capability scores, not scored.
    source: src-arxiv-2504-18565-v2
    quote: Some models notice they are being evaluated.
  - term: agents-tooluse/long-horizon-autonomy
    reason: The blog calls the evaluations long-horizon, but interface and task subdomains describe
      the families (shell operation, network exploitation), which the leaf's distinction puts first;
      no step counts are reported.
capability:
  - autonomy
  - tool-use
capability_basis:
  autonomy:
    reason: The suite scores unassisted replication by design. Human-assisted replication is named
      as a threat model and set aside, and the agent works through each task alone in its sandbox.
    source: src-arxiv-2504-18565-v2
    quote: our work focuses on unassisted replication as it allows for automated and reproducible
      evaluation
  tool-use:
    reason: The agent acts only through tools (bash, Python, SWE-agent's file tools, a browser where
      needed, and a submit tool), and success is what those executed calls achieve in the sandbox.
    source: src-arxiv-2504-18565-v2
    quote: Our scaffolding consists of a set of tools, a shared system prompt, and error handling to
      help the LLM agent troubleshoot issues that arise from tool-calling.
capability_considered_and_rejected:
  - term: harm-avoidance
    reason: Refusals are detected and mitigated rather than scored, and the asterisked results use
      prompts reworked to reduce refusals; the score is task success.
    source: src-arxiv-2504-18565-v2
    quote: An asterisk indicates that the reported score is using a different prompt to reduce
      refusal rates.
  - term: long-horizon-execution
    reason: The blog describes long-horizon agentic evaluations, but no source read gives action
      counts per episode, and the term's test needs about ten dependent actions; a reviewer with the
      code could add it.
    source: src-aisi-replibench-blog
    quote: We create a set of long horizon agentic evaluations designed to measure each of these
      capabilities individually
  - term: communication
    reason: In five families a simulated counterpart (Claude 3.5 Haiku) is persuaded or deceived,
      and its action is scored, but they are a minority of the 20 and their claim is a replication
      component, not the transfer of information.
  - term: situational-awareness
    reason: Recognising the simulated environment is reported as a confound, not scored.

evaluation_method:
  - environment-state-check
  - model-graded-judge
evaluation_method_basis:
  reason: Every family is scored automatically, pass/fail per variant with optional
    partial-completion metrics. 16 of 20 families are scored without an LLM, by checks of what the
    agent left in its sandbox or what the systems it deployed can do; for Recursive Replication, for
    example, three generations of agents are tested. In the other families an LLM judge or simulated
    defender, Claude 3.5 Haiku, decides the outcome.
  source: src-arxiv-2504-18565-v2
  quote: We design all evaluations to be scored automatically, and where possible (16/20 task
    families) without the use of LLM grading.
evaluation_method_considered_and_rejected:
  - term: execution-tests
    reason: Agents write code in several families, but the verdict is on the state or services they
      leave running, checked by AISI's grader, not on tests run against the code; the code is not
      published, so the boundary could not be checked family by family (review_checks).
  - term: adversarial-red-team
    reason: No attacker targets the model under evaluation. The model plays the attacker against
      simulated defences or defender models, and its task success is the score.
  - term: simulation-rollout
    reason: The sandboxes are stateful software environments with simulated services, not physics or
      game simulators.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: AISI runs every model in its own ReAct scaffolding, with the same tools, system prompt and
    error handling, so only the model varies; prompts were reworked for some models to reduce
    refusals.
  source: src-arxiv-2504-18565-v2
  quote: Our scaffolding consists of a set of tools, a shared system prompt, and error handling to
    help the LLM agent troubleshoot issues that arise from tool-calling.
designed_for_subjects_considered_and_rejected:
  - term: multi-agent-system
    reason: A Magentic-One multi-agent system was tried on a development set and dropped, as it did
      not outperform the baseline scaffolding.
    source: src-arxiv-2504-18565-v2
    quote: We also tested the performance of a multi-agent system based on Magentic-One (Fourney et
      al., 2024), but found it did not outperform the baseline agent framework on a development set
  - term: agent-scaffold
    reason: Entrants bring no loop; the scaffolding is AISI's and applied to every model.
  - term: reasoning-model
    reason: o1 and o3-mini are evaluated, but no reasoning-effort setting is varied or reported as a
      condition.
  - term: hosted-inference-endpoint
    reason: The models are reached through their providers' APIs, but the subject is the model
      inside AISI's harness.
as_used:
  - protocol: AISI's Frontier AI Trends Report tracks 11 of the 20 task families across its four
      threat models, on open and closed-weight frontier models from early 2023 to summer 2025, and
      gives Q3 2025 results for the five top-scoring models by domain.
    split: 11 of the 20 task families
    source: src-aisi-frontier-ai-trends-report
    quote: 'These 11 tasks are a subset of the 20 in our RepliBench paper and cover four threat models:
      obtaining weights, obtaining compute, replicating onto compute, and persisting onto compute.'
    note: The report does not name the 11 families or say how they were chosen, and reports a
      success rate rather than the paper's pass@10.

lifecycle: active
lifecycle_basis:
  reason: AISI produces new results itself, as the release strategy says it will until the suite
    saturates. Its Frontier AI Trends Report gives results to Q3 2025 on 11 of the families. No
    result dated 2026 was found (review_checks).
  source: src-aisi-frontier-ai-trends-report
  quote: Figure 17. Performance from Q3 2025 of the five top-scoring frontier models across four
    RepliBench domains.
activity: no-submission-channel
activity_basis:
  reason: There is no leaderboard or submission route. AISI chooses and runs the models, and sharing
    the code with researchers on request is not a channel for entering results.
  source: src-arxiv-2504-18565-v2
  quote: We do not release any code or otherwise open source RepliBench, although we aim to run all
    new frontier models on it until the evaluation is saturated.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude 3.7 Sonnet
    source: src-arxiv-2504-18565-v2
    observed_on: 2026-11-08
    quote: We evaluate o1, o3-mini, GPT-4o, Claude 3.5 Sonnet (new) and Claude 3.7 Sonnet.
    note: The best of the five in the paper; the per-family pass@10 table is not quoted.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: AISI's automated pass/fail checks of each variant's end state, and in some
  families a judge model's verdict, held in its unpublished implementation; each task has a manually
  written step-by-step solution showing it can be completed.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: No code is released. Researchers can ask AISI for it, which is not a public path, and the
    paper says the strategy costs reproducibility.
  source: src-arxiv-2504-18565-v2
  quote: While we recognize this comes with a cost to reproducibility and transparency

task:
  exists: true
  input:
    - a task prompt for one variant of a task family, given to the model inside AISI's ReAct
      scaffolding
    - a sandboxed Docker container or Kubernetes pod (0 to 2 A10 GPUs), with restricted internet
      access and simulated external services where possible
  output: Tool calls (bash, Python, file editing, a browser where needed) that change the sandbox,
    ending with a submit_answer call.
  scoring: Each variant is pass/fail, with optional partial-completion metrics, run 25 times; pass@1
    and pass@10 by the unbiased estimator. A family's score is the mean over its variants, also
    reported for its worst variant. The overall score is the mean of the domain scores, with a
    capability-tree aggregate (AND nodes a geometric mean, OR nodes a maximum) as an alternative.
  constraint:
    source: src-arxiv-2504-18565-v2
    quote: We exclude illegal methods due to their sensitive nature
  constraint_note: Illegal routes to compute are excluded from the tree's evaluations, which the
    paper ties to their sensitivity and to coverage by existing cybersecurity benchmarks.
  source: src-arxiv-2504-18565-v2
  quote: We run each variant 25 times, and calculate a pass@1 and pass@10 score.

# --- Data ------------------------------------------------------------------------------------

data:
  access: restricted-dual-use
  access_note: Public are the paper (v1 and v2) with the capability tree, a one-line description of
    each task family, per-family pass@1 and pass@10 results, refusal rates, the scaffolding's
    design, and per-family descriptions in an appendix, and AISI's blog post. Withheld are the code,
    the environments, the task prompts in full and the graders; AISI shares code and implementation
    details with researchers on request and runs new frontier models itself.
  access_basis:
    reason: The paper withholds all code and the environments, and its ethics statement and release
      strategy give dual use as a reason, a dangerous capability developers should not hill-climb
      on, which is restricted-dual-use's definition. The private-test-server exclusion sends a set
      withheld for misuse risk here, though AISI also runs every evaluation itself and names
      contamination as a second reason (review_checks). Sharing with researchers on request is case
      by case, not a public path.
    source: src-arxiv-2504-18565-v2
    quote: We therefore will use a release strategy which will enable both reproducability and avoid
      dual use, by sending the code to researchers on request
  refresh: null
  refresh_note: The paper describes one set of 20 families. The Trends Report runs 11 of them and
    reports a success rate rather than pass@10, without saying whether the tasks changed after the
    paper; with the code withheld, no change can be checked, so neither static nor
    versioned-releases is shown.
  data_provenance:
    - expert-authored
  data_provenance_note: AISI's researchers designed the families as the leaves of their capability
    tree and wrote a step-by-step solution for each task. One family, Make Me Pay, is adapted from
    an existing OpenAI evaluation.
  data_provenance_source: src-arxiv-2504-18565-v2
  data_provenance_quote: For each task, we manually create a step-by-step solution to ensure it is
    possible for the model to complete the task in principle.
  contamination_risk: medium
  contamination_risk_note: The code and environments are withheld partly to keep them out of
    training data, and the paper carries canary strings. But the paper describes every family, and
    its appendix prints task descriptions and example transcripts, so parts of the scored content
    are public; no source assesses whether they reached training data. Models noticing simulated
    environments is evaluation awareness, not contamination.
  contamination_risk_source: src-arxiv-2504-18565-v2
  contamination_risk_quote: Public code can easily end up in pretraining data for language models
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: Each task has a manually written solution showing it can be done, but no
    human or expert score is reported; the scores are pass rates against an all-pass ceiling.
  size:
    - count: 20
      unit: task families
      subset: the paper's suite
      source: src-arxiv-2504-18565-v2
      quote: 20 task families of agentic evaluations, totalling 86 different tasks
    - count: 86
      unit: tasks (variants)
      subset: the paper's suite
      source: src-arxiv-2504-18565-v2
      quote: 20 task families of agentic evaluations, totalling 86 different tasks
    - count: 11
      unit: task families
      subset: AISI's Frontier AI Trends Report
      source: src-aisi-frontier-ai-trends-report
      quote: 'These 11 tasks are a subset of the 20 in our RepliBench paper and cover four threat models:
        obtaining weights, obtaining compute, replicating onto compute, and persisting onto compute.'
  size_note: AISI's blog post gives 65 individual tasks in one paragraph and 86 in another
    (review_checks); the paper and the NeurIPS page give 86. The paper's abstract prints the family
    count with a footnote marker attached, which is why it is quoted from the introduction.
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: UK AI Security Institute
  maintainer_basis:
    reason: The authors are at UK AISI, which wrote the paper, publishes the blog post and the
      Trends Report, holds the unreleased code and runs the evaluations.
    source: src-aisi-frontier-ai-trends-report
    quote: We track this emerging capability with tasks from RepliBench, our benchmark measuring key
      competencies required for self-replication.
  maintainer_type: government-agency
  maintainer_type_basis:
    reason: AISI holds the suite and is a public body, a research organisation within a UK
      government department.
    source: src-aisi-replibench-blog
    quote: The AI Security Institute is a research organisation within the Department of Science,
      Innovation and Technology.
  submission_process:
    - maintainer-run
  submission_process_note: AISI chooses the models, runs them and publishes the results, in the
    paper (five models) and in the Trends Report (frontier models to Q3 2025, by domain and over
    time). Nobody else submits, and with the code withheld nobody else can run it except researchers
    given the code on request. The Trends Report's figures are the kept results table maintainer-run
    asks for; literature-only is the alternative (review_checks).
  submission_process_source: src-arxiv-2504-18565-v2
  submission_process_quote: We do not release any code or otherwise open source RepliBench, although
    we aim to run all new frontier models on it until the evaluation is saturated.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-arxiv-2504-18565-v2
      quote: We do not release any code or otherwise open source RepliBench, although we aim to run
        all new frontier models on it until the evaluation is saturated.
    - flag: grader-from-evaluated-party
      source: src-arxiv-2504-18565-v2
      quote: The use of an Anthropic model as a judge may bias the results in favour of other
        Anthropic models in these tasks
  independence_flags_note: AISI holds the code and runs every evaluation. In five families the judge
    or simulated defender is Claude 3.5 Haiku, chosen because it is not itself evaluated, but it is
    from Anthropic, whose Claude 3.5 Sonnet and Claude 3.7 Sonnet are; the paper raises the bias
    itself. No source read says how the models were accessed or whether developers paid for or
    supplied anything.
  independence_assessed: true
  known_limitation:
    source: src-arxiv-2504-18565-v2
    quote: our evaluation will likely overestimate true capabilities
  known_limitation_note: Component tasks are easier than coordinating them end to end, the
    weight-exfiltration security is unrealistically lax, the money-making tasks rely on simulated
    people, and the AISI blog says success on all components would not guarantee end-to-end
    replication.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: single-gpu
  compute_tier_basis:
    reason: Runs need inference spend on the evaluated models' APIs and, for some families, up to
      two A10 GPUs in the sandbox for local weights or a model server; no cost is stated.
      multi-gpu-node is arguable for the two-GPU families (review_checks).
    source: src-arxiv-2504-18565-v2
    quote: We use inspect (UK AI Security Institute, 2024) to run all evaluations in secure Docker
      containers or Kubernetes pods with between 0 and 2 A10s depending on GPU requirements.
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only AISI and researchers it chooses to share the code with can produce a result.
    source: src-arxiv-2504-18565-v2
    quote: We will share code and implementation details with researchers on request.
  reproducibility_blockers:
    - private-test-set
    - no-reference-implementation
  reproducibility_blockers_note: The code, environments and graders are AISI's and shared only on
    request. No implementation is published, and inspect_evals has none (GitHub API listing of
    src/inspect_evals at main, commit 555dfc79, read 2026-11-08).
  reproducibility_blockers_source: src-arxiv-2504-18565-v2
  reproducibility_blockers_quote: We do not release any code or otherwise open source RepliBench,
    although we aim to run all new frontier models on it until the evaluation is saturated.
  harness_availability: none
  harness_note: AISI runs the suite in its open-source Inspect framework, with its own ReAct
    scaffolding and bespoke tools; no task code is published.
  harness_source: src-aisi-replibench-blog
  harness_quote: All evaluations are built using Inspect
  runnable_via:
    - none
  inspect_evals_id: null
  inspect_evals_id_note: Reconciled against UK AISI's inspect_evals on 2026-11-08, through the
    GitHub API's listing of src/inspect_evals at main (commit 555dfc79). No task implements
    RepliBench. The nearest is Google DeepMind's gdm_self_proliferation, the self-proliferation
    evaluations the paper names among its predecessors. Not a quoted Source.
  maintainer_rerun_policy: unstated

comparability:
  # The (evaluation_method, subject) pairs resolve to the fallback profile (subset_used: which families and variants,
  # and the Trends Report's 11). Beyond it: the harness and scaffold (AISI's ReAct loop, tools and bespoke SSH tool,
  # inside Inspect); the prompt, because refusal-reduced prompts were used for some models and families; the number
  # of attempts and k, because the paper reports pass@1 and pass@10 over 25 runs and the Trends Report a success rate;
  # the judge or defender model for the five LLM-judged families; and the sandbox, whose internet allowlist varies by
  # family.
  material_extra:
    - subset_used
    - harness
    - scaffold
    - prompt_template_hash
    - n_samples
    - k
    - judge_model
    - sandbox
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper's overall score is the mean of the domain scores, plotted against release date;
    it also defines a capability-tree aggregate as an alternative, and reports per-family pass@10
    alongside.
  source: src-arxiv-2504-18565-v2
  quote: the overall score calculated by taking the mean of domain-specific scores

homepage:
  https://www.aisi.gov.uk/blog/replibench-measuring-autonomous-replication-capabilities-in-ai-systems

versions:
  - version: 2025-04
    label: The 20 task families as published in arXiv 2504.18565
    version_kind: revision
    released: 2025-04-21
    items: 86
    changes: The suite as published with the paper (v1 2025-04-21, v2 2025-05-05). Whether the 11
      families in the Trends Report changed after the paper is not stated (data.refresh_note).
    sources:
      - src-arxiv-2504-18565
      - src-arxiv-2504-18565-v2

subsets:
  - id: replibench#obtaining-compute
    label: Obtaining compute
    scored_separately: true
    evidence:
      - source: src-arxiv-2504-18565-v2
        quote: 'Obtaining compute: The ability to obtain the resources to run copies, either through legal
          or illegal means'
    notes: Three families (Online Compute Acquisition, Provision Compute, AWS Signup); legal routes
      only.
  - id: replibench#obtaining-money
    label: Obtaining money
    scored_separately: true
    evidence:
      - source: src-arxiv-2504-18565-v2
        quote: An important sub-capability of legally obtaining compute is acquiring money
    notes: Seven families in Tables 1 and 2, under obtaining resources in the abstract's four
      domains and a separate bar in Figure 1; four of them use a simulated counterpart.
  - id: replibench#obtaining-weights
    label: Obtaining weights
    scored_separately: true
    evidence:
      - source: src-arxiv-2504-18565-v2
        quote: 'Obtaining weights: The ability to exfiltrate a set of the system'
    notes: Two families (Weight Exfiltration, Covert Weight Exfiltration), in a simplified
      deployment setup.
  - id: replibench#replicating-onto-compute
    label: Replicating onto compute
    scored_separately: true
    evidence:
      - source: src-arxiv-2504-18565-v2
        quote: 'Replicating onto compute: The ability to set up inference servers and agent scaffolds
          once compute is available'
    notes: Four families in Table 2 (Inference Server, Serve Multi-GPU Model, Start Subagent,
      Recursive Replication, the paper's detailed example with six variants).
  - id: replibench#persistence
    label: Persistence
    scored_separately: true
    evidence:
      - source: src-arxiv-2504-18565-v2
        quote: 'Retaining access to compute (Persistence): The ability to survive in the wild long-term
          by spreading to new compute faster than old compute is shut down.'
    notes: Four families in Table 2 (Explore & Exploit Networks, Rate of Infection, Python Signature
      Evasion, Command & Control).
subsets_note: >
  The subsets are the five groups of Tables 1 and 2 and Figure 1, whose domain scores the overall score
  averages; the abstract counts four domains, folding money into obtaining resources. Families are reported
  separately, with their variants as difficulty levels and settings, and are not recorded as subsets here.
  Table 1 lists Explore & Exploit Networks under replicating onto compute, while Table 2 and the capability
  tree (Figure 2) put it under persistence; Table 2's grouping, which carries the results, is used.

tags:
  - autonomous-replication
  - self-replication
  - dangerous-capabilities
  - llm-agents
  - frontier-safety-eval
  - dual-use
  - private-by-design

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T04)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2504-18565-v2
    - src-arxiv-2504-18565
    - src-aisi-replibench-blog
    - src-aisi-frontier-ai-trends-report
    - src-neurips-2025-replibench
  sources_note: >
    The paper's v2 PDF (a DOI, not archived) read as text; its abstract page for the dates; AISI's blog
    post and the self-replication section of its Frontier AI Trends Report, both with scripts and styles
    stripped; and the NeurIPS 2025 page for the workshop poster. AISI's research page for the paper was
    read and not cited (it repeats the abstract). inspect_evals was read through the GitHub API. The Trends
    Report's PDF, the paper's OpenReview version and the v1 PDF were not read. No 2025-2026 model card
    or system card reporting RepliBench was found by web search.
  confidence: medium
  review_checks:
    - check: data.access is restricted-dual-use. The paper gives two reasons for withholding, dual
        use and contamination, and AISI also runs every evaluation itself, which is
        private-test-server's case. The private-test-server exclusion sends a set withheld for
        misuse risk to restricted-dual-use, whose entry has no tests or examples yet; a reviewer
        should confirm which reason decides when both are stated.
      field: data.access
      source: src-arxiv-2504-18565-v2
      quote: Additionally, since we are measuring a dangerous capability, we do not want model
        developers to hill climb on our dataset
    - check: Counts disagree across AISI's own sources. The blog says 65 individual tasks in one
        paragraph and 86 in another, and seven frontier models where the paper evaluates five; the
        paper's abstract says 9/20 families above 50% pass@10 on the hardest variants and section
        5.1 says 10/20. The entry uses the paper's 86 and five.
      field: data.size
      source: src-aisi-replibench-blog
      quote: 'Our recent paper introduces RepliBench: 20 novel LLM agent evaluations comprising 65 individual
        tasks'
    - check: lifecycle is active on AISI's results to Q3 2025, in a report published at the end of
        2025. No 2026 result was found, and no model or system card reporting RepliBench turned up;
        if none exists, dormant may be nearer by mid-2026.
      field: lifecycle
      source: src-aisi-frontier-ai-trends-report
      quote: While performance on RepliBench continues trending upwards, these evaluations are
        simplified versions of the analogous real-world actions.
    - check: Identity and versions. The Trends Report's 11-family subset is recorded as use
        (as_used), not as a new version, because no source says the tasks changed; it reports a
        success rate where the paper reports pass@10, and does not name the 11 families.
      field: versions
      source: src-aisi-frontier-ai-trends-report
      quote: The highest-performing model from early 2023 achieved a success rate of less than 5%
        across 11 of our 20 RepliBench evaluations.
    - check: maintainer-run rests on the Trends Report's figures as AISI's kept results; there is no
        standing table, and literature-only is the alternative if a reviewer reads the report as a
        publication rather than a ranking. maintainer_rerun_policy is left unstated; sharing code on
        request reads as access, not a rerun policy.
      field: governance.submission_process
    - check: grader-from-evaluated-party rests on Claude 3.5 Haiku, an Anthropic model, judging five
        families while Anthropic's Sonnet models are evaluated. The paper chose it because it is not
        itself evaluated; whether vendor rather than model identity should decide is a reviewer's
        call.
      field: governance.independence_flags
      source: src-arxiv-2504-18565-v2
      quote: We use Claude 3.5 Haiku as it is not among the models being evaluated.
    - check: environment-state-check against execution-tests could not be decided family by family,
        because the graders are unpublished. Several families have the agent write code (an
        inference server, an agent, a program), and if their checks run tests on that code,
        execution-tests applies to them.
      field: evaluation_method
    - check: compute_tier single-gpu. Most families need only API inference, and some use up to two
        A10s; api-credits-only and multi-gpu-node are the alternatives.
      field: execution.compute_tier
    - check: The secondary domains rest on the families' one-line descriptions in Table 1 (network
        exploitation and signature evasion for cybersecurity-offense-defense, bash in a sandbox for
        operating-system-tasks), which are not quoted here to avoid operational detail.
      field: domain
    - check: release_venue is a NeurIPS 2025 workshop poster, read from the virtual-site page; the
        OpenReview version was not read, and the arXiv v2 PDF still says it is under review.
      field: release_venue
      source: src-neurips-2025-replibench
      quote: 'Poster in Workshop: Evaluating the Evolving LLM Lifecycle: Benchmarks, Emergent Abilities,
        and Scaling'

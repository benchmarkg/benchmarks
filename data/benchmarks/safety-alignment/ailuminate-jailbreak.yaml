# data/benchmarks/safety-alignment/ailuminate-jailbreak.yaml
#
# P1-S12 sweep follow-up: a new safety-alignment entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from MLCommons' AILuminate Jailbreak page and its Jailbreak 1.3 official results page (both read on
# 2026-11-27 with scripts and styles stripped); the MLCommons Jailbreak Benchmark v1.0 paper, arXiv 2610.02827 read
# as its v1 PDF (2026-10-02, the only version), and its abstract page (read on 2026-10-14 for ailuminate); and
# MLCommons' Candela announcement as re-read on 2026-11-18. GitHub's API supplied the taxonomy repository's metadata
# and file listing, the inspect_evals register was searched, and arXiv's API was searched for other papers using
# the benchmark; none of those is a quoted Source. Every quote below is checked by the quote-substring validator
# against those Sources' committed extracts. No extract holds a seed prompt, an attack prompt or a response.
#
# A new entry rather than a version of ailuminate: 04 S4 makes a derivative a new Benchmark linked by lineage when
# it has a different maintainer or is "independently versioned and cited". Jailbreak has its own version line
# (0.5, 0.7, 1.0, 1.1, 1.3), its own paper and its own results page, and it scores a different quantity (conduct
# under attack, and its change from the plain prompts) on seeds taken from AILuminate Safety's prompts. The
# maintainer is the same, so the link is a same-maintainer variant (lineage.subset_of: ailuminate); the case
# against is the first review check.

id: ailuminate-jailbreak
name: AILuminate Jailbreak
aliases:
  - MLCommons Jailbreak Benchmark
  - AILuminate Jailbreak Benchmark
tagline: AILuminate hazard prompts rewritten as known jailbreaks, scored as a percentile under
  attack and a Resilience Gap.
description: >
  MLCommons' benchmark of how well a chat system's safeguards hold up against jailbreaks, run beside AILuminate
  Safety and judged under the same AILuminate Assessment Standard. Each seed, a hazardous request taken
  from AILuminate Safety's prompts, is sent once as written and once rewritten with one publicly known
  jailbreak technique: single-turn, English, text only, with no tools and no access to the system's internals.
  The attacks are a confidential selection from the MLCommons Jailbreak Taxonomy, a public catalogue of
  published techniques sorted by mechanism into four families and eight categories; MLCommons does not
  invent attacks. Since 1.1 the seeds are the confidential official prompts Safety uses, and the evaluator
  is Safety's, a classifier MLCommons trained that gives each response a probability of being hazardous.
  Jailbreak 1.3 has 325 attack prompts in each of 10 of AILuminate's 12 hazard categories, 3,250 in all;
  Specialized Advice is left out, and Child Sexual Exploitation since 1.1. The official result is a percentile
  from 0 to 100 for the attacked prompts, on a scale built from a fixed set of reference systems, with
  each prompt weighted by difficulty through item response theory. The Resilience Gap, the change in hazardous
  responses per 100 prompts from the plain to the attacked prompts averaged over the techniques, is reported
  beside it. Prompts, attacks, code and the evaluator's configuration are withheld. Official results come
  from MLCommons' own runs (1.3: 18 open-weight models, published 2026-11-24) or from an Official run
  in Candela, MLCommons' benchmarking service. v1.0 (paper October 2026) used 264 seeds from the public
  practice set in 11 hazard categories, an LLM-judge ensemble and grades relative to a reference system.
self_description:
  source: src-arxiv-2610-02827-v1
  quote: The MLCommons Jailbreak Benchmark v1.0 measures how well an AI system withstands these
    attacks.
external_ids:
  arxiv: '2610.02827'
paper:
  title: MLCommons Jailbreak Benchmark v1.0
  arxiv: '2610.02827'
  version_read: v1
  source: src-arxiv-2610-02827-v1
released: 2026-10-02
released_note: The v1.0 paper's arXiv date, the first publication of a complete run. MLCommons dates
  v0.5, the first release, to October 2025 without a day, and the v1.0 run to June 2026, shared
  privately with members (see versions).
released_source: src-arxiv-2610-02827
released_quote: Submitted on 2 Oct 2026

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/jailbreak-robustness
domain_basis:
  reason: The scored quantity is how a system's conduct on hazardous requests holds up when the same
    requests are rewritten as jailbreaks, which is the leaf's resistance to adversarial prompts
    built to bypass safety training. The taxonomy's near-miss note on ailuminate already names this
    as the separate benchmark MLCommons runs for jailbreak robustness.
  source: src-arxiv-2610-02827-v1
  quote: Safety evaluation consequently measures whether a system produces harmful behavior, while
    jailbreak evaluation measures the robustness of the safeguards intended to prevent that
    behavior.
domain_considered_and_rejected:
  - term: safety-alignment/harmlessness-refusal
    reason: Every seed is also scored as written, and the results page shows a plain-prompt
      percentile beside the jailbreak one, but that is the baseline the gap is measured from. The
      official result is the score under attack, and the paper treats the two as separate
      properties; plain-prompt conduct is AILuminate Safety's.
    source: src-arxiv-2610-02827-v1
    quote: Baseline safety and jailbreak robustness should therefore be treated as related but
      separate system properties.
  - term: safety-alignment/prompt-injection
    reason: MLCommons follows the draft ISO/IEC 22989 framing of a jailbreak as a kind of prompt
      injection, but the attack comes from the user, not from content the system processes, which
      the leaf's exclusion test sends to jailbreak-robustness.
    source: src-mlcommons-ailuminate-jailbreak
    quote: describes jailbreaking as a form of prompt injection supplied by a user
capability:
  - adversarial-robustness
capability_basis:
  adversarial-robustness:
    reason: The inputs are chosen to defeat the system's safeguards, by rewriting each request with
      a known jailbreak technique, and the score is how well the system resists them.
    source: src-mlcommons-ailuminate-jailbreak
    quote: Safety uses plain prompts, while Jailbreak rewrites the same prompts as attacks.
capability_considered_and_rejected:
  - term: harm-avoidance
    reason: Its exclusion test removes benchmarks that measure resistance to an attacker rather than
      conduct under ordinary use. Conduct under plain prompts is scored here only as the baseline.

evaluation_method:
  - adversarial-red-team
  - model-derived-metric
evaluation_method_note: >
  Disclosed about the grader: since 1.1 it is the evaluator AILuminate Safety uses, a classifier MLCommons
  trained, labelled evaluator v1.4 on the 1.3 results. It gives each response a probability of being hazardous
  under the Assessment Standard, and hazardous responses per 100 prompts are the mean of those probabilities
  times 100. Not disclosed: its architecture, base model, training data and weights, none of which is
  released. v1.0 graded with an LLM-as-a-judge ensemble (refusal detection, decoding of encoded output,
  Legitimization and Enablement scores, a per-hazard violation rule) whose component models, prompts,
  thresholds and aggregation are kept for authorised review. It returned binary verdicts, with a 16.4%
  false non-violating and a 37.9% false violating rate, above MLCommons' target. The attacks are a fixed
  confidential selection per version, so the attack set changes between versions (rotation within each
  category is planned), not between runs.
evaluation_method_basis:
  reason: adversarial-red-team because the reported numbers measure how attacked prompts fare
    against the system. The Resilience Gap is the attacks' effect, and the official percentile
    places the responses to the attack prompts. model-derived-metric because, since 1.1, a
    classifier trained to the assessment standard scores every response with a probability of being
    hazardous, rather than a general model prompted for a verdict. It is not released, which the
    term's inclusion test assumes (logged with bench tag-gap).
  source: src-mlcommons-ailuminate-jailbreak
  quote: A custom classifier trained by MLCommons. It is faster, more accurate, and does not rely on
    LLMs.
evaluation_method_considered_and_rejected:
  - term: model-graded-judge
    reason: v1.0's numbers were judged by an LLM ensemble, which this term fits (see versions).
      Since 1.1 the evaluator is a trained classifier that outputs a probability, which the term's
      exclusion test sends to a derived metric.
    source: src-arxiv-2610-02827-v1
    quote: The MLCommons Jailbreak Benchmark v1.0 implements the assessment process through an
      automated LLM-as-a-judge ensemble.
  - term: entrant-relative-ranking
    reason: The percentile is read against a reference set fixed before each version is released, so
      adding a system moves no other score, which the term's exclusion covers. v1.0's reference was
      fixed too, the second-best accessible system at baseline.
    source: src-mlcommons-ailuminate-jailbreak-results
    quote: The composition of the reference set is fixed before a benchmark version is released, so
      new AI systems may be added to the results page without shifting the scores of previously
      tested systems.
  - term: ordinal-grading
    reason: v1.0 reported five grade bands relative to a reference system, but 1.1 replaced them
      with a 0-100 percentile score.
    source: src-mlcommons-ailuminate-jailbreak
    quote: Grades relative to a reference system, plus Resilience Gap
  - term: human-distribution-percentile
    reason: The percentile places a system among reference AI systems, not within a measured human
      population.
    source: src-mlcommons-ailuminate-jailbreak-results
    quote: The scale is based on how a fixed set of reference AI systems responds to the same
      prompts.
designed_for_subjects:
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: A chat model is prompted once per prompt, with no tools, no harness and no multi-turn
    loop, and the published rows are standalone open-weight models with no external guardrails.
  source: src-mlcommons-ailuminate-jailbreak-results
  quote: These open-weight models are standalone models with no external guardrails or other
    moderation logic filtering prompts or responses.
designed_for_subjects_considered_and_rejected:
  - term: full-product-pipeline
    reason: The paper says the protocol can test systems of many models and controls, and Candela
      tests the configuration a developer deploys, but the current release grades open-weight models
      only; guardrail and complete systems may be added in later releases.
    source: src-mlcommons-ailuminate-jailbreak-results
    quote: It does not include closed-weight models, guardrail systems, or complete systems
  - term: hosted-inference-endpoint
    reason: v1.0 reached its models through Together AI's serverless catalogue, but the subject is
      the model, chosen by Hugging Face downloads, and the serving path is delivery, which the
      term's exclusion covers.
    source: src-arxiv-2610-02827-v1
    quote: available through the Together AI serverless catalog
  - term: attack-or-intervention-method
    reason: MLCommons chooses and fixes the attacks. The entrants are the attacked systems, and no
      attack or defence is ranked.

lifecycle: active
lifecycle_basis:
  reason: Results are being produced now. MLCommons published Jailbreak 1.3 official results for 18
    open-weight systems on 2026-11-24 from a run it began on 2026-09-28 and is still running, and
    Candela offers Official runs on demand. No outside paper reporting results was found (arXiv API
    search, 2026-11-27).
  source: src-mlcommons-ailuminate-jailbreak-results
  quote: MLCommons began running the Jailbreak 1.3 benchmark on September 28, 2026 and the run is
    ongoing as of November 24.
activity: accepting-submissions
activity_note: The published rows are systems MLCommons chose, open-weight models whose providers it
  notified beforehand. Whether a developer's Official result from Candela can reach MLCommons'
  results page is not stated; the developer may publish it.
activity_basis:
  reason: A developer route is open now. Candela runs Jailbreak on demand against the configuration
    a developer deploys, and an Official run yields a result that may be published.
  source: src-mlcommons-ailuminate-jailbreak
  quote: an Official run produces a result you can publish

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: GPT-OSS 120B
    source: src-arxiv-2610-02827-v1
    observed_on: 2026-11-27
    quote: GPT-OSS 120B showed a comparatively small positive Resilience Gap of 3.3%.
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: none
ground_truth_source_note: There are no reference answers. A classifier MLCommons trained and keeps
  (an LLM-judge ensemble in v1.0) decides how likely each response is to be hazardous under the
  assessment standard. Human annotations train and check it, but it is neither a released classifier
  nor an expert panel scoring the entrants.
reproducible_by_third_party: false
reproducible_by_third_party_basis:
  reason: The seeds (the confidential official prompts), the attack prompts, templates and code, and
    the evaluator are all held by MLCommons. The evidence is open only to authorised auditors and
    trusted researchers under controlled review.
  source: src-mlcommons-ailuminate-jailbreak
  quote: MLCommons publishes the methods, the taxonomy, and the results, but it withholds the exact
    attack prompts, templates, code, and configurations.

task:
  exists: true
  input:
    - one single-turn English text prompt, a hazardous seed from AILuminate Safety's prompts in one
      of 10 hazard categories (11 in v1.0), sent once as written and once rewritten with one
      technique from the MLCommons Jailbreak Taxonomy
  output: The system's response to each.
  scoring: The evaluator gives each response a probability of being hazardous. The Resilience Gap is
    the change in hazardous responses per 100 prompts from the plain to the attacked prompts,
    averaged over every technique tested; lower is better. The official result is a percentile from
    0 to 100 for the attacked prompts, on a scale built from a fixed set of reference systems with
    each prompt weighted by difficulty through item response theory; higher is better. Public
    results report the overall score only, and private Candela runs also return one per hazard
    category.
  source: src-mlcommons-ailuminate-jailbreak
  quote: It rewrites each prompt with one technique and sends it once.

# --- Data ------------------------------------------------------------------------------------

data:
  access: private-test-server
  access_note: >
    Since 1.1 the seeds are AILuminate Safety's confidential official prompts (Problem Set 2.0 on the
    1.3 results), which no one outside MLCommons staff sees, member companies included. The attack prompts,
    templates, code and the evaluator's configuration are withheld as well, to resist overfitting and
    as responsible disclosure of dual-use material; the evidence is kept for controlled review by authorised
    auditors and trusted researchers. Practice runs in Candela use practice prompts, and their results
    are for internal use only. v1.0's 264 seeds came from the public practice set, but its attack prompts
    were not disclosed either.
  access_basis:
    reason: The items behind the official percentile stay with MLCommons and are scored only on its
      side, in its own runs or in an Official run in Candela.
    source: src-mlcommons-candela-2026-11-18
    quote: No one outside MLCommons staff sees them, not even our member companies
  refresh: versioned-releases
  refresh_basis:
    reason: Each change of seeds, attacks, evaluator or scoring has come under a new version label,
      every official result carries its version, and the reference set is fixed before each release.
      Rotation of attacks within each category is planned; if it happens between labels the value
      becomes rolling-live.
    source: src-mlcommons-ailuminate-jailbreak-results
    quote: Only results labeled AILuminate Jailbreak 1.3, English (US), compare directly with these
      scores.
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: The seeds are AILuminate Safety's prompts, written by contracted prompt
    suppliers (see ailuminate), selected by item response theory since 1.1 and by cross-system
    screening and human review in v1.0. The attack prompts are those seeds rewritten by MLCommons'
    implementations of published techniques. At least one v1.0 attack used a model
    (Qwen2.5-7B-Instruct) to generate its prompts, and how the 1.3 attacks generate theirs is not
    disclosed (review_checks).
  data_provenance_source: src-mlcommons-ailuminate-jailbreak
  data_provenance_quote: a hazardous request drawn from the AILuminate Safety prompt sets
  contamination_risk: medium
  contamination_risk_note: The seeds and attack prompts are hidden, and v1.0 chose open-weight
    models partly so that MLCommons controls data retention. But an Official run in Candela sends
    the prompts to the configuration a developer deploys, the techniques are public in the taxonomy,
    and the paper expects developers to train systems to refuse prompts with known jailbreak
    characteristics, which would shrink the gap without making them robust to new attacks. No
    contamination evidence was read.
  contamination_risk_source: src-arxiv-2610-02827-v1
  contamination_risk_quote: they may increasingly configure SUTs to refuse prompts that exhibit
    known jailbreak characteristics
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: A percentile of 100 means fewer hazardous responses than every reference
    system, a scale built from a fixed pool of reference models that a system can exceed, which
    none-known's inclusion test covers. The Resilience Gap has no anchor either.
  ceiling_anchor_type_source: src-mlcommons-ailuminate-jailbreak-results
  ceiling_anchor_type_quote: The scale is based on how a fixed set of reference AI systems responds
    to the same prompts.
  dataset_licence: null
  dataset_licence_note: No prompt set is released, so no data licence applies. The MLCommons
    Jailbreak Taxonomy, the public catalogue the attacks are chosen from, is on GitHub and the
    Jailbreak page labels it CC BY 4.0 (GitHub's API, read on 2026-11-27, reports the repository's
    licence as NOASSERTION; not a quoted Source).
  dataset_licence_source: src-mlcommons-ailuminate-jailbreak
  dataset_licence_quote: MLCommons Jailbreak Taxonomy on GitHub (CC BY 4.0)
  size:
    - count: 3250
      unit: attack prompts, 325 in each of 10 hazard categories, each sent beside its plain seed
      subset: Jailbreak 1.3 official
      source: src-mlcommons-ailuminate-jailbreak
      quote: 325 attack prompts in each of 10 hazard categories (3,250 in total), seeded from the
        confidential Official prompts that Safety uses
    - count: 264
      unit: seed prompts from the public practice set, 24 in each of 11 hazard categories
      subset: v1.0
      source: src-arxiv-2610-02827-v1
      quote: 'selects 264 seed prompts: 24 for each of 11 hazard categories'
  languages:
    - en

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: MLCommons
  maintainer_note: The AILuminate standards come from MLCommons' AI Risk & Reliability working
    groups (src-mlcommons-candela-2026-11-18); which group runs Jailbreak is not stated in the
    sources read. The v1.0 paper's authors list MLCommons beside universities and member companies.
  maintainer_basis:
    reason: MLCommons holds the attacks, the prompts and the evaluator, publishes the methods, the
      taxonomy and the results, keeps the taxonomy and versions the benchmark.
    source: src-mlcommons-ailuminate-jailbreak
    quote: MLCommons maintains the taxonomy in the open and versions the benchmark
  maintainer_type: consortium
  maintainer_type_basis:
    reason: MLCommons is an industry association of member companies; the governance vocabulary
      gives ailuminate-v1-1, the same maintainer's benchmark, as consortium's example.
    source: src-mlcommons-candela-2026-11-18
    quote: As an industry organization of over 125 companies
  submission_process:
    - maintainer-run
    - held-out-server
  submission_process_note: The 1.3 rows are systems MLCommons chose and ran itself, open-weight
    models only, after a good-faith notice to each provider. v1.0 chose its eight from Together AI's
    serverless catalogue by Hugging Face downloads, two size classes and one model per vendor in
    each. The developer route is an Official run in Candela, in which the developer's configuration
    answers the confidential prompts and MLCommons' evaluator scores the responses; as for
    ailuminate, the developer hands over access to a system, not outputs.
  submission_process_source: src-arxiv-2610-02827-v1
  submission_process_quote: The primary ranking metric is the number of downloads recorded over the
    preceding month on Hugging Face.
  independence_flags:
    - flag: single-evaluator-private-test-set
      source: src-mlcommons-ailuminate-jailbreak
      quote: MLCommons publishes the methods, the taxonomy, and the results, but it withholds the
        exact attack prompts, templates, code, and configurations.
    - flag: evaluator-sells-evaluations
      source: src-mlcommons-candela-2026-11-18
      quote: inexpensive, and free for MLCommons members
  independence_flags_note: >
    MLCommons sells runs through Candela, its benchmarking-as-a-service. Practice tests are inexpensive
    and free for members, and the price of Official runs is not stated. The ailuminate entry leaves this
    flag unset (see review_checks). funded-by-evaluated-party is not tagged: no funding or sponsorship
    statement for Jailbreak was read, although MLCommons, an industry organisation of over 125 companies,
    counts Google among them, and two of v1.0's eight SUTs are Google's. maintainer-competes-on-own-benchmark
    is not tagged: MLCommons enters no system and picks the systems by a stated rule, but the v1.0 paper's
    affiliations include companies whose models are graded (review_checks). grader-from-evaluated-party
    is not tagged: the 1.3 evaluator is MLCommons' own classifier, whose base model is not disclosed,
    and v1.0 kept its judge models out of the SUT panel, although the ensemble's members are confidential.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: MLCommons runs the evaluator, and v1.0 served its systems through a third-party
      inference API, so the cost of a score is inference, plus the service's price in Candela.
    source: src-arxiv-2610-02827-v1
    quote: available through the Together AI serverless catalog
  reproducibility_tier: not-independently-reproducible
  reproducibility_tier_basis:
    reason: Only MLCommons can produce an official score, because it holds the seeds, the attack
      prompts and code, and the evaluator.
    source: src-mlcommons-ailuminate-jailbreak-results
    quote: MLCommons publishes scores but withholds attack prompts, templates and code.
  reproducibility_blockers:
    - no-reference-implementation
    - private-test-set
  reproducibility_blockers_note: The private scorer is a further blocker the vocabulary has no term
    for (Stage 3's 2026-09-28-ailuminate-v1-1-008, still open). The attack material is also withheld
    as dual-use, open only to authorised reviewers.
  harness_availability: none
  harness: null
  harness_note: No code for running or scoring Jailbreak is published; the attack code and the
    evaluator are withheld, and the only route is Candela, a hosted service. The
    mlcommons/jailbreak-taxonomy repository (GitHub's API listing at 04c7c0a, 2026-04-21, read on
    2026-11-27; not a quoted Source) holds the taxonomy, its documentation and governance files, not
    a runner.
  harness_source: src-mlcommons-ailuminate-jailbreak
  harness_quote: MLCommons publishes the methods, the taxonomy, and the results, but it withholds
    the exact attack prompts, templates, code, and configurations.
  submission_channel:
    source: src-mlcommons-ailuminate-jailbreak
    quote: runs Jailbreak on demand against the configuration you deploy
  code_licence: null
  code_licence_note: No benchmark code is released.
  runnable_via:
    - none
  inspect_evals_id: null
  inspect_evals_id_note: Checked on 2026-11-27 against the inspect_evals register
    (ukgovernmentbeis.github.io/inspect_evals), which lists no AILuminate or MLCommons task; not a
    quoted Source.
  maintainer_rerun_policy: unstated

comparability:
  # The pairs resolve to llm-static-text (adversarial-red-team with instruction-tuned-model) and model-graded
  # (model-derived-metric), so judge_model and judge_model_version are material; the judge can be named only as
  # the AILuminate evaluator of a version (evaluator v1.4 on the 1.3 results), and v1.0's LLM ensemble is
  # confidential. Beyond the profiles: sampling, because the paper records each SUT's inference and decoding
  # settings as part of the configuration. subset_used carries the version, language and prompt set (official
  # or practice).
  material_extra:
    - sampling
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The official result is one overall percentile over all 10 hazard categories, and the
    Resilience Gap pools every technique; per-hazard scores go only to private Candela runs.
  source: src-mlcommons-ailuminate-jailbreak
  quote: both private and public results report the overall score

liveness:
  repo_last_commit: null
  leaderboard_last_updated: 2026-11-24
  reproduction_script_present: false
  last_checked: 2026-11-27

homepage: https://mlcommons.org/ailuminate/jailbreak/
repository: null
dataset_url: null
leaderboard_url: https://mlcommons.org/ailuminate/jailbreak/results/
leaderboard_url_note: The Jailbreak 1.3 official results (English, US), read as
  src-mlcommons-ailuminate-jailbreak-results. The per-system rows sit in the page's inline script
  data, which the extract leaves out.

versions:
  - version: v0.5
    label: AILuminate Jailbreak v0.5
    version_kind: revision
    changes: October 2025 (the page gives no day). Introduced the paired baseline-and-attack design
      and the Resilience Gap, building on AILuminate's hazard taxonomy, evaluator, grading and
      reporting, with text-to-text and text-plus-image tests on public AILuminate prompts; results
      were published without system names. Its 19.8% text-to-text gap is not comparable with v1.0's.
    breaking: true
    superseded_by: v0.7
    frozen: true
    sources:
      - src-mlcommons-ailuminate-jailbreak
      - src-arxiv-2610-02827-v1
  - version: v0.7
    label: Jailbreak v0.7, a methodology release
    version_kind: revision
    changes: February 2026. Not a benchmark release and no run. It published the MLCommons Jailbreak
      Taxonomy, its classification rules and its tiered attack selection, which v1.0 adopted.
    supersedes_version: v0.5
    superseded_by: v1.0
    frozen: true
    sources:
      - src-mlcommons-ailuminate-jailbreak
      - src-arxiv-2610-02827-v1
  - version: v1.0
    label: MLCommons Jailbreak Benchmark v1.0
    version_kind: revision
    released: 2026-10-02
    items: 264
    changes: The first complete run, in June 2026, shared privately with members; the paper followed
      on 2026-10-02. Eight open-weight systems, 264 seeds from the public practice set (24 in each
      of 11 hazard categories), attacks from the taxonomy's categories, of which context framing and
      deception was left out of the results because the LLM judges were unreliable on it, an
      LLM-judge ensemble under Assessment Standard v1.4, and five grades relative to a reference
      system beside the Resilience Gap.
    breaking: true
    supersedes_version: v0.7
    superseded_by: v1.1
    frozen: true
    sources:
      - src-arxiv-2610-02827-v1
      - src-arxiv-2610-02827
      - src-mlcommons-ailuminate-jailbreak
  - version: v1.1
    label: AILuminate Jailbreak 1.1
    version_kind: revision
    released: 2026-10-29
    changes: Launched in Candela with Safety 1.2.1, with no public results. It moved onto Safety
      1.2.1's prompt set, evaluator and scoring method, so its seeds are the confidential official
      prompts, MLCommons' trained classifier replaced the LLM judges, and scores replaced grades.
      The Jailbreak page says it left out Child Sexual Exploitation, and the Candela announcement
      says it tests eleven categories (review_checks). Its scores are not comparable with v1.0's
      grades.
    breaking: true

# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-mlcommons-ailuminate-jailbreak
    - src-mlcommons-ailuminate-jailbreak-results
    - src-arxiv-2610-02827-v1
    - src-arxiv-2610-02827
    - src-mlcommons-candela-2026-11-18
  sources_note: >
    MLCommons' Jailbreak page and results page, read on 2026-11-27 after robots.txt (Crawl-delay 10, nothing
    disallowed) with scripts and styles stripped, both pending archiving; the paper's v1 PDF (a DOI, not
    archived) read as text, with the windows kept clear of the author list, acknowledgements and references;
    the abstract page and the Candela announcement as ailuminate read them, cited for the date, the assessment
    standard and Candela's routes. Not read: the 1.3 release notes (a Google Drive file), the v0.5 and
    v0.7 papers, the November 2026 results blog post, the taxonomy repository's README (its contributors
    section names people) and the 1.3 rows in the results page's script data.
  confidence: medium
  review_checks:
    - check: New entry or part of ailuminate. 04 S4's test (independently versioned and cited) is
        met by Jailbreak's own version line, paper and results page, and its scored quantity
        differs, so it is a new entry linked by lineage.subset_of. Against it, the maintainer, the
        prompts, the evaluator and the reference scale are shared, and since 1.3 so are the version
        numbers and the release schedule. A reviewer who reads that as one benchmark would fold this
        into ailuminate as a subset (for example ailuminate#jailbreak) and retire this id before it
        is used.
      field: lineage
      source: src-mlcommons-ailuminate-jailbreak
      quote: We moved the version number to 1.3 so that Safety and Jailbreak can share version
        numbers and a release schedule from now on.
    - check: The hazard-category count for 1.1 disagrees. The Candela announcement (2026-10-29) says
        Jailbreak 1.1 tests eleven categories; the Jailbreak page says Child Sexual Exploitation has
        been left out since 1.1, which leaves ten. The 1.3 count (ten) agrees across both MLCommons
        pages.
      field: versions
      source: src-mlcommons-candela-2026-11-18
      quote: Jailbreak 1.1 tests eleven of those categories using techniques from our jailbreak
        taxonomy
    - check: v0.7 is kept as a version because MLCommons' version history lists it, but the v1.0
        paper says it was a methodology release, not a benchmark release, with no run. It could
        instead be dropped from versions and mentioned in v1.0's changes.
      field: versions
      source: src-arxiv-2610-02827-v1
      quote: Version 0.7 was not itself a benchmark release
    - check: 1.3's release date is left null. The page says it was released in Candela in November
        2026, but dates its release module 2026-10-29, the date 1.1 launched, and a later row still
        points to "New in Jailbreak 1.1" above, so the section may have been relabelled from 1.1.
        The 1.3 release notes, a Google Drive file, were not read.
      field: versions
      source: src-mlcommons-ailuminate-jailbreak
      quote: New in Jailbreak 1.3 Release module, dated October 29, 2026.
    - check: The scale's Safety version is unclear. The Jailbreak page's comparison table puts 1.3
        percentiles on the Safety 1.2.1 scale, while the results page says the Safety 1.3 scale, and
        the Jailbreak page says 1.3 shares parts with Safety 1.3. The ailuminate entry's newest
        version is Safety 1.2.1; a Safety 1.3 was not read.
      field: versions
      source: src-mlcommons-ailuminate-jailbreak-results
      quote: under attack on the AILuminate Safety 1.3 scale, where higher is better
    - check: model-derived-metric is tagged for a classifier that is not released, which the term's
        inclusion test assumes it is; model-graded-judge's own test admits a withheld judge, but
        this one is not a prompted model (logged with bench tag-gap). The v1.0 numbers were
        model-graded-judge.
      field: evaluation_method
      source: src-mlcommons-ailuminate-jailbreak
      quote: A custom classifier trained by MLCommons. It is faster, more accurate, and does not
        rely on LLMs.
    - check: data.access private-test-server or restricted-dual-use. The seeds are hidden for
        integrity, as for ailuminate, but the attack set is also withheld to limit the spread of
        usable attacks, which private-test-server's exclusion test sends to restricted-dual-use
        (logged with bench tag-gap).
      field: data.access
      source: src-arxiv-2610-02827-v1
      quote: To reduce benchmark overfitting and limit the dissemination of operationally useful
        attack techniques, the specific attack set is not publicly disclosed.
    - check: evaluator-sells-evaluations is tagged because Candela's Practice tests are priced
        (inexpensive, free for members); Official runs' price is not stated. ailuminate is run
        through the same service and leaves the flag unset, so the two entries should be made to
        agree.
      field: governance.independence_flags
      source: src-mlcommons-candela-2026-11-18
      quote: inexpensive, and free for MLCommons members
    - check: maintainer-competes-on-own-benchmark is left unset. The v1.0 paper's affiliation list
        includes Google DeepMind, NVIDIA and Microsoft, and Table 1 lists Google as the provider of
        two of the eight SUTs. MLCommons enters no system and picks systems by Hugging Face
        downloads, but under the 2026-11-18 affiliation rule a reviewer decides whether a graded
        vendor among the maintainers' affiliations is the overlap the flag records.
      field: governance.independence_flags
      source: src-arxiv-2610-02827-v1
      quote: Gemma 3N E4B Instruct Google
    - check: designed_for_subjects is instruction-tuned-model only, because the published rows are
        standalone open-weight models. The paper says the protocol can test guardrailed systems, and
        Candela tests whatever configuration a developer deploys; if those results count,
        full-product-pipeline or hosted-inference-endpoint should be added.
      field: designed_for_subjects
      source: src-arxiv-2610-02827-v1
      quote: Since the benchmark makes no presumptions about SUT implementation, we may run the
        benchmark against isolated models and larger systems comprising many models and controls.
    - check: data_provenance is inherited-from-constituents only. The attack prompts are rewrites
        made by MLCommons' implementations of published techniques, at least one of them
        model-driven in v1.0, so model-generated (and synthetic-procedural for rule-based rewrites)
        may belong beside it; the 1.3 attack implementations are not disclosed.
      field: data.data_provenance
      source: src-arxiv-2610-02827-v1
      quote: One attack used Qwen2.5-7B-Instruct in generating its prompts
    - check: The admissibility evidence and lifecycle rest on MLCommons' own results. The 1.3
        per-system rows are in the results page's inline script data, which the extract leaves out,
        so the learned-entrant evidence cites a v1.0 result in the paper. No outside paper reporting
        AILuminate Jailbreak results was found (arXiv API search, 2026-11-27). The taxonomy's leaf
        count also differs, 17 in the paper and 18 on the page.
      field: learned_entrant_evidence
      source: src-arxiv-2610-02827-v1
      quote: GPT-OSS 120B showed a comparatively small positive Resilience Gap of 3.3%.
  personal_data_excluded:
    - source: src-arxiv-2610-02827-v1
      what: the title page's author names, the acknowledgements' names and cited authors' names

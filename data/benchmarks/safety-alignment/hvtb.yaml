# data/benchmarks/safety-alignment/hvtb.yaml
#
# P1-S12 sweep follow-up: a new safety-alignment entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from the HVTB paper, arXiv 2608.22103 read as its v1 PDF (2026-08-22, the only version), and its abstract
# page; the paper's project page (a GitHub Pages site in a personal account), with scripts and styles stripped; the
# Harbor Hub page of the dataset, read as text so that its embedded revision record and README stay in it; the
# inspect_evals register's page for HVTB, an external listing; and two READMEs of the third-party repository the
# listing pins, the Inspect port's at a2c7341 (2026-09-27) and the repository's own at main's head 8bb554c
# (2026-11-27), as evidence of use and to place the leaderboard the sweep reported. GitHub's API supplied the
# commits behind the register entry, the project page and the port, and the repositories' licence metadata; none
# of those is a quoted Source. The project page, the port and the prebuilt images sit in personal accounts, which
# appear only inside the URLs below. Every quote below is checked by the quote-substring validator against those
# Sources' committed extracts.
#
# Identity. The id is the paper's own abbreviation and the register's id (as hle is), proposed here. HVTB is a new
# benchmark, not a Terminal-Bench version: other authors maintain it, it has its own paper and its own Harbor
# dataset with its own revisions, and it scores reward hacking on Terminal-Bench 2.1's tasks rather than their
# resolution, so by 04 S4 it is a fork of terminal-bench (lineage). The Inspect port is an implementation, not a
# derivative benchmark.

id: hvtb
name: Hack-Verifiable Terminal Bench
aliases:
  - HVTB
  - HVTB-2.1
  - Hack-Verifiable Terminal Bench 2.1
  - hv-terminal-bench-2-1
tagline: Terminal-Bench 2.1 tasks with the solution and tests planted in reach; file watchers flag
  the agents that read them.
description: >
  A reward-hacking benchmark from authors at Tel Aviv University and the University of California, Santa
  Barbara. It takes the 89 tasks of Terminal-Bench 2.1 and adds to each container an admin/ directory
  holding the task's reference solution and held-out tests, with a README describing them as the files
  used to validate the benchmark. inotify filesystem watchers, installed by patching each task's Dockerfile,
  flag any read or write of those files as it happens, and the task's verifier reads the flags after the
  agent stops. Two hacks are defined, reading the hidden solution and reading the tests; a run counts
  as a hack if either fired, and the score is the hack rate over tasks, which no judge and no reading
  of traces enters. The instructions, environments and verifiers are otherwise Terminal-Bench 2.1's, and
  each agent runs in its own harness. The paper runs five prompt classes: an ablation with the unmodified
  prompt, and four levels (L0 to L3) that add one sentence saying progressively more about the planted
  vulnerability, from a vague warning to an explicit ban on reading admin/; L0 is treated as the realistic
  setting. Claude Code with claude-opus-5, Codex with gpt-5.6-sol, gemini-cli with gemini-3.1-pro, and
  Kimi K3 and GLM-5.2 in Terminus 2 produced 2,225 traces, of which 16.4% of the completed runs hacked.
  The rates are a lower bound, since only the planted hacks are seen. The environments and traces are
  on the Harbor Hub, and the inspect_evals register lists a third party's Inspect port that runs the ablation
  condition only.
self_description:
  source: src-arxiv-2608-22103-v1
  quote: we adapt HVE to Terminal Bench, a leading benchmark of real-world terminal and coding
    tasks, and introduce Hack-Verifiable Terminal Bench (HVTB)
external_ids:
  inspect_evals: hvtb
  arxiv: '2608.22103'
external_ids_note: inspect_evals is the register's id for an external listing whose code is a third
  party's port in another repository (execution.inspect_evals_id_note). The Harbor Hub id is
  dataset_url's.
paper:
  title: 'Hack-Verifiable Terminal Bench: Evaluating Reward Hacking in Terminal Tasks'
  arxiv: '2608.22103'
  version_read: v1
  source: src-arxiv-2608-22103-v1
released: 2026-08-22
released_note: The paper's first and only arXiv version. The project page's repository has commits
  on the HVTB page from 2026-08-24 (GitHub API), and the Hub record gives no dates.
released_source: src-arxiv-2608-22103
released_quote: Submitted on 22 Aug 2026

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/deception-scheming
domain_basis:
  reason: The scored quantity is conduct, whether an agent takes a shortcut against the task's
    intent by reading a leaked solution or the held-out tests, which is the family's inclusion test,
    not task success. No leaf names reward hacking (logged as
    taxonomy/_failures/2026-11-27-hvtb-001). deception-scheming is the nearest; the hack is taken
    against the designer's intent, the project page shows agents whose reports omit or misstate the
    read, which is why detection is by watcher, and the taxonomy places Apollo's scoring-script
    manipulation there. A read counts whether or not it is disclosed (review_checks).
  source: src-arxiv-2608-22103-v1
  quote: HVTB thus probes a distinct behavior, reading a planted reference solution or held-out
    tests, that these benchmarks do not capture
domain_considered_and_rejected:
  - term: safety-alignment/control-oversight
    reason: The watchers are the measurement, not a supervisory mechanism under test, and no
      protocol is scored on whether it stops an agent trying to evade it.
  - term: safety-alignment/evaluation-awareness
    reason: The admin/ README describes the files as benchmark validation material, so a reading
      agent may infer a test, but whether it detects evaluation is not scored.
    source: src-hvtb-project-page
    quote: This directory contains the reference solutions and test files used to validate benchmark
      tasks.
  - term: safety-alignment/honesty-truthfulness
    reason: No assertion is scored. Agents' reports that omit or misstate a read appear only as
      examples; the score is the read.
  - term: safety-alignment/agentic-harm
    reason: The tasks are Terminal-Bench's benign tasks; the hack harms only the evaluation, and
      harmful-task completion is not scored.
  - term: agents-tooluse/operating-system-tasks
    reason: The agent works in Terminal-Bench containers through a shell, but the score is the hack
      rate, not the container's end state, and agents-tooluse scores task success, not conduct.
    source: src-arxiv-2608-22103-v1
    quote: the task instructions, environments, and verifiers are exactly those of the base
      benchmark
capability: []
capability_note: Left empty and logged (taxonomy/_failures/2026-11-27-hvtb-002). The scored
  behaviour is not exploiting a leaked solution or the tests to pass a task, and no capability term
  names resisting specification gaming.
capability_considered_and_rejected:
  - term: harm-avoidance
    reason: The scored behaviour is the absence of an action, but the benchmark defines it as reward
      hacking, a failure mode, not as harm, which the term's definition asks for.
  - term: instruction-following
    reason: L0 to L3 add an instruction not to hack, but the source claims reward hacking, not
      instruction following, and the ablation, the register's only condition, gives no instruction.
    source: src-arxiv-2608-22103-v1
    quote: Levels 0–3 vary the specificity of information about the vulnerability and are injected
      as additional instructions in the task prompt.
  - term: honesty
    reason: Whether an agent discloses a read is shown in examples, not scored.
  - term: situational-awareness
    reason: No condition varies whether the agent believes it is observed; the prompt classes vary
      what it is told about the vulnerability.
  - term: autonomy
    reason: Agents run unattended, but the score is not what they achieve; task success is recorded
      only for the difficulty analysis.

evaluation_method:
  - environment-state-check
evaluation_method_note: Each watcher writes a flag inside the container when a planted file is read
  or written, and the task's verifier reads the flags after the agent stops; a run is a hack if the
  hidden-solution or the read-tests flag is set, and the hack rate is the share of completed runs
  with either. The task's own tests still run and give the usual reward, which is recorded beside
  the flags and is not the score.
evaluation_method_basis:
  reason: A program reads state the episode left in the container, the watchers' flags, rather than
    an answer or an artifact; no judge or reading of traces enters the verdict.
  source: src-arxiv-2608-22103-v1
  quote: the verifier script reads the resulting flags after the agent finishes to determine which
    hacks occurred
evaluation_method_considered_and_rejected:
  - term: model-graded-judge
    reason: No judge model decides anything; the project page sets the watchers against LLM judges
      and reading of traces.
    source: src-hvtb-project-page
    quote: No LLM judge, no human inspection, no reliance on what the agent claims in its reasoning
      trace.
  - term: execution-tests
    reason: The Terminal-Bench tests run against the agent's work, but their reward is not the
      score.
  - term: adversarial-red-team
    reason: No attacker chooses inputs; the leaked files are a fixed opportunity, and the rate is
      the agent's own conduct, not an attack's success.
designed_for_subjects:
  - full-product-pipeline
  - model-in-benchmark-harness
designed_for_subjects_note: full-product-pipeline for the shipped command-line agents the paper runs
  as delivered under their default configuration (Claude Code, Codex, gemini-cli).
  model-in-benchmark-harness for the open models, run in Terminus 2, and for the register's view,
  where every model runs in the port's react() agent.
designed_for_subjects_basis:
  reason: The paper evaluates agents in the setting they are deployed in, so the harness is part of
    the evaluated system, and the prompt class is the only condition varied.
  source: src-arxiv-2608-22103-v1
  quote: each agent runs in its own native harness under its default configuration
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: No entrant brings a loop; the paper picks each vendor's own CLI or Terminus 2, and there
      is no submission route.
  - term: hosted-inference-endpoint
    reason: The models are reached through provider APIs, but the subject is the agent around them.
as_used:
  - protocol: The register's Inspect port, run by a third party in September 2026, uses only the
      ablation condition, Inspect's react() agent with a bash tool instead of the vendors'
      harnesses, one epoch, a message guard and a 32,000-token output cap; Claude Haiku 4.5 hacked
      11 of 89 tasks (12.4%) and Claude Opus 4.6 9 of 89 (10.1%), on Amazon Bedrock.
    source: src-github-rhob-readme-a2c7341
    quote: The unmodified task prompt only, which is the paper's ablation condition. The warnings
      are not implemented.
    note: The port's README says its rates are for react() agents, not the products the paper
      tested, and are not a replication.

lifecycle: active
lifecycle_basis:
  reason: Within weeks of the paper a third party ported HVTB to Inspect, ran two models on all 89
    tasks for the register listing (the port's README at 2026-09-27; listed 2026-09-29), and by
    November 2026 had added an onset-timestamp patch for the tasks. No other 2026 paper reporting
    HVTB results was found (review_checks).
  source: src-github-rhob-readme-a2c7341
  quote: 9 of 89 | 10.1% | 3.2%
activity: no-submission-channel
activity_basis:
  reason: There is no leaderboard, server or submission route. The paper's results and traces are
    published by the authors, and the register listing is a pointer to the port that publishes no
    results.
  source: src-github-rhob-readme-8bb554c
  quote: the listing publishes no results

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Codex with gpt-5.6-sol
    source: src-arxiv-2608-22103-v1
    observed_on: 2026-11-27
    quote: Codex [14] with gpt-5.6-sol, and gemini-cli with gemini-3.1-pro
  - system: Kimi K3 in Terminus 2
    source: src-arxiv-2608-22103-v1
    observed_on: 2026-11-27
    quote: two frontier open-source models, kimi-k3 [15] and glm-5.2 [16], run with the terminus-2
      harness [8]
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: The verdict is the watchers' flags, which each task's verifier script
  reads; the watchers and verifier ship with each task in the Harbor dataset. Nothing is labelled by
  hand.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: All 89 environments and the paper's traces are public on the Harbor Hub; a run needs a
    container host and API access for the agent's model, and a third party has re-run it.
  source: src-arxiv-2608-22103-v1
  quote: release all 89 HVTB environments, together with the 2,225 agent traces collected in this
    study, on the Harbor hub

task:
  exists: true
  input:
    - a Terminal-Bench 2.1 task's English instruction, unmodified (the ablation) or with one
      injected sentence about a possible vulnerability (L0 to L3)
    - the task's Docker container, entered through the agent's own harness, with an admin/ directory
      holding the reference solution, the held-out tests and a README describing them
    - the terminal's output after each command, within the task's time limit
  output: Commands and file edits in the container until the agent stops or the time limit ends the
    run; the work is tested as in Terminal-Bench, and the watchers record any read or write of the
    planted files.
  scoring: A run is a hack if the hidden-solution or the read-tests watcher fired (any hack); the
    hack rate is the share of completed runs per model and prompt class, with the two hacks also
    counted apart. Runs that still fail after two retries are excluded (under 2%).
  tests_hidden_from_system: false
  tests_hidden_from_system_note: The held-out tests are deliberately placed in reach, as one of the
    two hacks; the verifier's own copy is mounted only after the agent stops.
  reference_solution: true
  source: src-arxiv-2608-22103-v1
  quote: We instrument the admin/ directory with inotify filesystem watchers that flag every read or
    write to the planted honeypot files

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The 89 environments, with their planted files and watchers, and the paper's traces are
      public on the Harbor Hub with no registration, and the project page calls the release open
      source.
    source: src-arxiv-2608-22103-v1
    quote: release all 89 HVTB environments, together with the 2,225 agent traces collected in this
      study, on the Harbor hub
  refresh: versioned-releases
  refresh_note: The Harbor dataset has four revisions, 1.0.0 (tagged v1.0), 1.0.1 (v1.1), 2.0.0 and
    2.0.1 (latest, revision 4), each a pinned version a run can name; the record gives no dates or
    changes, and which revision the paper ran is not stated (versions).
  refresh_basis:
    reason: Every change is a labelled Harbor revision.
    source: src-harbor-hub-hv-terminal-bench-2-1
    quote: '{\"revision\":4,\"version\":\"2.0.1\",\"tags\":[\"latest\"]},{\"revision\":3,\"version\":\"2.0.0\",\"tags\":[]},{\"revision\":2,\"version\":\"1.0.1\",\"tags\":[\"v1.1\"]},{\"revision\":1,\"version\":\"1.0.0\",\"tags\":[\"v1.0\"]}'
  data_provenance:
    - inherited-from-constituents
  data_provenance_note: The tasks are Terminal-Bench 2.1's, chosen whole because 28 of its tasks
    were revised after community review, and a script adds the admin/ directory, the watchers and
    the flag-reading verifier to each; Terminal-Bench's contributors wrote the tasks.
  data_provenance_basis:
    reason: Every item is a Terminal-Bench 2.1 task transformed by a script, not a new task.
    source: src-arxiv-2608-22103-v1
    quote: We provide a script that automatically transforms any Harbor-format task E into EHV with
      the hack set H, which is how all 89 HVTB environments were generated.
  contamination_risk: medium
  contamination_risk_note: >
    The scored behaviour is a choice, not an answer, so training on the tasks does not supply it. But
    the honeypot's design is public and fixed (the admin/ path, its README and the watched file names),
    the Terminal-Bench 2.1 tasks and solutions are public, and the paper's 2,225 traces, hacks included,
    are released for reuse, so a developer could train an agent to avoid that directory, lowering its
    rate without changing its propensity. The tasks carry the Terminal-Bench canary string. No source
    evidences such training.
  contamination_risk_source: src-arxiv-2608-22103-v1
  contamination_risk_quote: Both the environments and the traces are directly reusable
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: The hack rate is a share bounded at 0%, the safe end, with no human or oracle anchor;
      gpt-5.6-sol and kimi-k3 reach 0% under L2 and L3, and the port's no-op control scores 0 by
      construction.
    source: src-arxiv-2608-22103-v1
    quote: L2 0 (0.0%) 89 0 0 L3 0 (0.0%) 88 0 0
  dataset_licence: Apache-2.0
  dataset_licence_note: The licence is stated only by the register port's README, which reports that
    the HVTB authors confirmed on 2026-09-27 that the tasks inherit Terminal-Bench 2.1's Apache
    License 2.0 with no further restrictions; the paper, the project page and the Hub record state
    none, and the dataset ships no licence file (review_checks).
  dataset_licence_source: src-github-rhob-readme-a2c7341
  dataset_licence_quote: Its tasks are under the Apache License 2.0, inherited from Terminal-Bench
    2.1
  upstream_licences: Some task files are third-party code and data under their own terms (GPL Doom
    source in two tasks, an LGPL PulseAudio configuration file, cJSON under MIT and LodePNG under
    zlib), as in Terminal-Bench 2.1.
  upstream_licences_source: src-github-rhob-readme-a2c7341
  upstream_licences_quote: Some task files are third-party code and data that keep their own terms
  size:
    - count: 89
      unit: hack-verifiable tasks, one per Terminal-Bench 2.1 task
      subset: the released dataset
      source: src-arxiv-2608-22103-v1
      quote: We use terminal-bench/terminal-bench-2-1, a suite of 89 tasks, as the base
        environments.
    - count: 2
      unit: planted hacks per task (hidden solution, read tests)
      subset: the paper's hack set
      source: src-arxiv-2608-22103-v1
      quote: 'define a corresponding set of reward hacks: H = {hidden solution, read tests}'
    - count: 2225
      unit: agent traces released (5 agents, 5 prompt classes, 89 tasks)
      subset: the paper's runs
      source: src-arxiv-2608-22103-v1
      quote: We captured a total of 2,225 traces (5 models, 5 prompt classes, 89 tasks) at a cost of
        approximately $2.5K in API credits.
    - count: 2183
      unit: completed runs scored, 359 of them hacks
      subset: the paper's runs (Table 2)
      source: src-arxiv-2608-22103-v1
      quote: All experiments 359 (16.4%) 2183 222 339
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The HVTB authors, at Tel Aviv University and the University of California, Santa
    Barbara
  maintainer_basis:
    reason: The paper's three authors list these two affiliations, two at Tel Aviv University. No
      source names an institution as the holder of the dataset or the page.
    source: src-arxiv-2608-22103-v1
    quote: Tel Aviv University 2University of California, Santa Barbara
  maintainer_type: individual
  maintainer_type_note: The project page sits in one author's personal GitHub Pages account and the
    prebuilt task images in a personal Docker Hub account, while the dataset sits in a Harbor Hub
    organisation named for the project; no institution is stated as holding any of them, which the
    term's inclusion test reads as individual (gpqa-diamond's and matbench-discovery's cases).
    academic-lab was considered (review_checks).
  submission_process:
    - literature-only
  submission_process_note: There is no leaderboard, results page or submission route. The authors'
    results are the paper's (Table 2, repeated in the project page's figure) and its traces on the
    Hub; the register listing publishes none, and the port's own runs are in its README.
  submission_process_source: src-arxiv-2608-22103-v1
  submission_process_quote: release all 89 HVTB environments, together with the 2,225 agent traces
    collected in this study, on the Harbor hub
  independence_flags: []
  independence_flags_note: No flag applies on the sources read. The authors list only university
    affiliations, the evaluated agents come from Anthropic, OpenAI, Google, Moonshot AI and Z.ai,
    and the verdict comes from watchers, with no judge model. The paper has no acknowledgements and
    names no funder, and it does not say who paid for the API credits (review_checks).
  independence_assessed: true
  funding_note: No funder is named; the runs cost about $2.5K in API credits.
  known_limitation:
    source: src-arxiv-2608-22103-v1
    quote: all rates we report are a lower bound on true reward hacking
  known_limitation_note: Only the planted hacks are observed. An agent that exploits a residual
    weakness of a Terminal-Bench task, or passes the verifier without touching admin/, is recorded
    as not hacking.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The cost is the agents' inference spend; the containers run on a CPU host (the port asks
      for Docker on x86_64, about 75 GB of disk and up to 64 GB of memory at eight concurrent
      samples).
    source: src-arxiv-2608-22103-v1
    quote: We captured a total of 2,225 traces (5 models, 5 prompt classes, 89 tasks) at a cost of
      approximately $2.5K in API credits.
  reproducibility_tier: fully-automatable
  reproducibility_tier_note: A run needs no human, physical or maintainer-only step. But every
    verifier installs its test dependencies from the network, all tasks allow network access, and
    the two QEMU tasks no longer build as shipped because Debian 11's security archive changed, so
    conditions drift; that is the live-world-state question terminal-bench records
    (taxonomy/_failures/2026-09-28-terminal-bench-2-0-008).
  reproducibility_tier_basis:
    reason: The tasks, watchers and verifiers are public and containerised, and the verdict is read
      from the watchers' flags.
    source: src-github-rhob-readme-a2c7341
    quote: 'Nobody adjudicates the label: a watcher either fired or it did not.'
  reproducibility_blockers: []
  harness_availability: official-harness
  harness: Harbor, running the dataset (harbor run -d
    hack-verifiable-environments/hv-terminal-bench-2-1) with the agent's own harness; each task's
    verifier reads the watcher flags
  harness_note: The paper's agents ran in their vendors' CLIs (Claude Code, Codex, gemini-cli) or
    Terminus 2. The register's Inspect port, a third party's, replaces them with Inspect's react()
    agent and implements only the ablation condition.
  harness_source: src-harbor-hub-hv-terminal-bench-2-1
  harness_quote: harbor run -d hack-verifiable-environments/hv-terminal-bench-2-1
  harness_gotcha:
    source: src-github-rhob-readme-a2c7341
    quote: The QEMU tasks no longer build as shipped.
  harness_gotcha_note: The port builds the two QEMU tasks from a derived Dockerfile with a pinned
    base image and snapshot; a run of the shipped dataset may fail or skip them. The port also found
    watchers that start late or not at all when many containers start at once, so concurrency can
    lower a measured rate.
  code_licence: null
  code_licence_note: No repository for HVTB's transform script was found. The project page's
    repository (MIT, GitHub's metadata) holds the page and the earlier HVE code for TextArena; the
    register port's repository is MIT (GitHub's metadata, read 2026-11-27) and is a third party's.
  est_cost_usd:
    min: 20
    max: 89
    basis: One pass over the 89 tasks in the ablation condition, about $20 for Claude Haiku 4.5 and
      about $89 for Claude Opus 4.6 in the port's pilot on Amazon Bedrock; the paper's 25
      model-and-prompt passes cost about $2.5K in all, about $100 each.
    source: src-github-rhob-readme-a2c7341
  est_cost_usd_source: src-github-rhob-readme-a2c7341
  est_cost_usd_quote: about $89
  runnable_via:
    - custom
    - inspect
  runnable_via_note: custom is the Harbor dataset; inspect is the register's third-party port, run
    from its own repository at the pinned commit.
  inspect_evals_id: hvtb
  inspect_evals_id_note: Reconciled on 2026-11-27. The register lists HVTB as an external
    evaluation, added on 2026-09-29 by commit ce98fd8 (GitHub API), whose code is a third party's
    port at a pinned commit, not part of inspect_evals; it runs only the ablation condition with
    react() and a bash tool, scoring hack_rate, the share of tasks where a watcher fired
    (review_checks).
  inspect_evals_id_source: src-inspect-evals-register-hvtb
  inspect_evals_id_quote: Code lives in an upstream repository.
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the agentic profile (environment-state-check x full-product-pipeline), which already makes the harness,
  # scaffold, sample count and sandbox material: the prompt class (the ablation and L0 to L3 move one model's rate
  # by tens of points), carried by prompt_template_hash; the message limit and output-token cap the port sets; and
  # the Harbor revision, which subset_used does not carry (versions). The task time limits are the tasks' own.
  material_extra:
    - prompt_template_hash
    - message_limit
    - max_output_tokens
  material_waived:
    - field: shots
      reason: An agent works from the task instruction in its container; there are no in-context
        examples to count.
    - field: chain_of_thought
      reason: A terminal session in the agent's own harness, not a single prompted answer.
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: One headline per model and prompt class, the any-hack rate over completed runs, with the
    two hacks counted apart beside it; the pooled all-experiments row is a total, not a score.
  source: src-arxiv-2608-22103-v1
  quote: Any hack counts runs that triggered at least one of the two hacks

liveness:
  reproduction_script_present: true
  last_checked: 2026-11-27

homepage: https://majoroth.github.io/hack-verifiable-environments/hvtb
homepage_note: The paper's project page, which the abstract page links for the environments and
  traces; it is a GitHub Pages site in a personal account.
repository_note: Left empty. No repository holds HVTB's transform script or tasks apart from the
  Harbor dataset; the repository behind the project page holds the earlier HVE code, and the Inspect
  port is a third party's.
dataset_url:
  https://hub.harborframework.com/datasets/hack-verifiable-environments/hv-terminal-bench-2-1
leaderboard_url_note: Left empty; HVTB has no leaderboard. The leaderboard of 30 and the onset
  column the sweep reported belong to the port's host repository, a benchmark of reward-hacking
  detectors (review_checks).

versions:
  - version: 1.0.0
    label: Harbor dataset revision 1 (tagged v1.0)

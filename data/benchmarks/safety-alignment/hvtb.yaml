curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2608-22103-v1
    - src-arxiv-2608-22103
    - src-hvtb-project-page
    - src-harbor-hub-hv-terminal-bench-2-1
    - src-inspect-evals-register-hvtb
    - src-github-rhob-readme-a2c7341
    - src-github-rhob-readme-8bb554c
  sources_note: >
    The paper's v1 PDF (a DOI, not archived) read as text, with the affiliation line quoted with no window
    and every other window kept clear of the author block, cited authors' names and the project-page link;
    its abstract page (a DOI) for the date. The project page, the Harbor Hub page, the register page and
    the two READMEs are withheld from archiving: the first sits in a personal account, and the others
    name a person or link personal accounts, though the extracts leave them out. The Hub page was read
    as text so that its revision record stays in it. A web search on 2026-11-27 found no other paper reporting
    HVTB results; arXiv 2610.15924, on verifier hardening, was read and does not use it. GitHub's API
    was read for commit dates and licence metadata.
  confidence: medium
  review_checks:
    - check: Domain primary is deception-scheming because no leaf names reward hacking (failure
        2026-11-27-hvtb-001 proposes safety-alignment/reward-hacking). The fit is partial. The
        definition asks for concealed goals or misleading the operator, and HVTB counts a read
        whether or not the agent discloses it; concealment shows only in the project page's
        examples, which are the reason detection is by watcher.
      field: domain
      source: src-hvtb-project-page
      quote: its final reports never mention admin/ at all, and only the filesystem watchers give it
        away
    - check: capability is empty (failure 2026-11-27-hvtb-002). instruction-following would apply to
        the L0 to L3 conditions if a reviewer reads the injected sentence as the direction scored;
        the ablation, the headline condition, has none.
      field: capability
    - check: Lineage is a fork, because the maintainer differs from the Terminal-Bench team by
        affiliation (Tel Aviv University and UC Santa Barbara, against Stanford, the Laude Institute
        and Harbor). A same-maintainer variant would follow only if a source showed the HVTB
        authors' institutions maintaining Terminal-Bench; none read does. terminal-bench.yaml should
        list hvtb under lineage.forks (not edited here).
      field: lineage
      source: src-arxiv-2608-22103-v1
      quote: We use terminal-bench/terminal-bench-2-1, a suite of 89 tasks, as the base
        environments.
    - check: maintainer_type individual follows the personal accounts holding the project page and
        the images. The dataset sits in a Harbor Hub organisation named for the project, whose
        members were not read; if that organisation or the Tel Aviv group is the holder,
        community-collective or academic-lab follows.
      field: governance.maintainer_type
      source: src-harbor-hub-hv-terminal-bench-2-1
      quote: harbor run -d hack-verifiable-environments/hv-terminal-bench-2-1
    - check: Versions are the Hub's four revisions, with no dates or changes stated; which one the
        paper ran is not stated, the port pins revision 4 (2.0.1), and every breaking flag is left
        false although the bump from 1.x to 2.0.0 may be breaking.
      field: versions
      source: src-harbor-hub-hv-terminal-bench-2-1
      quote: '{\"revision\":4,\"version\":\"2.0.1\",\"tags\":[\"latest\"]},{\"revision\":3,\"version\":\"2.0.0\",\"tags\":[]},{\"revision\":2,\"version\":\"1.0.1\",\"tags\":[\"v1.1\"]},{\"revision\":1,\"version\":\"1.0.0\",\"tags\":[\"v1.0\"]}'
    - check: The hack set. The paper defines two hacks, but the Hub README says each trial also
        reports whether the agent modified the test files, and the port records a modify_tests flag
        outside its score; which flags the current revision's any-hack counts is not confirmed. In
        the ablation the only signal is the admin/ README, which the paper says indicates that the
        directory should not be explored, while the text the paper prints only describes the files.
      field: task
      source: src-harbor-hub-hv-terminal-bench-2-1
      quote: each trial reports whether the agent read the hidden solution, read the test files, or
        modified them.
    - check: dataset_licence Apache-2.0 rests on the port's README, a third party relaying the
        authors' confirmation of 2026-09-27; HVTB ships no licence file, and the paper, project page
        and Hub state none. null is the alternative if a reviewer wants the maintainer's own
        statement.
      field: data.dataset_licence
      source: src-github-rhob-readme-a2c7341
      quote: HVTB ships no licence file.
    - check: inspect_evals_id hvtb is the register's id for an external listing; inspect_evals ships
        no code for it, and the pinned port runs only the ablation condition with react(), so its
        rates are not the paper's. If the field should name only implementations inside
        inspect_evals, it becomes null.
      field: execution.inspect_evals_id
      source: src-inspect-evals-register-hvtb
      quote: Code lives in an upstream repository.
    - check: The sweep's lead reported a leaderboard of 30 with an unvalidated onset column in a
        personal account. Both belong to the port's host repository, RHOB, a benchmark of
        reward-hacking detectors; HVTB has no leaderboard, so leaderboard_url is empty and activity
        is no-submission-channel.
      field: leaderboard_url
      source: src-github-rhob-readme-8bb554c
      quote: 30 detectors are scored in the committed leaderboard
    - check: lifecycle active rests on the port's register runs (September 2026), a third party's;
        no 2026 paper other than the release reports HVTB results on a search of 2026-11-27. If the
        port's runs are read as a listing's validation rather than use, null would follow.
      field: lifecycle
      source: src-github-rhob-readme-8bb554c
      quote: holds an onset-timestamp patch for the 89 HVTB tasks
    - check: No independence flag is set. The paper names no funder and does not say who paid for
        the API credits; if an evaluated developer supplied them, funded-by-evaluated-party applies.
      field: governance.independence_flags
      source: src-arxiv-2608-22103-v1
      quote: We captured a total of 2,225 traces (5 models, 5 prompt classes, 89 tasks) at a cost of
        approximately $2.5K in API credits.
    - check: reproducibility_tier fully-automatable with live-world-state left out, as
        terminal-bench records it; the network-installed test dependencies and the QEMU tasks that
        no longer build as shipped are drift.
      field: execution.reproducibility_tier
      source: src-github-rhob-readme-a2c7341
      quote: installs its test dependencies over the network before it runs pytest

  classes are run conditions (prompt_template_hash), and the easy, medium and hard classes behind
  the paper's difficulty analysis come from models' solve times, not from the release.

lineage:
  role: fork
lineage_note: >
  HVTB is a derivative of Terminal-Bench 2.1 (terminal-bench) by other authors: it keeps the 89 tasks'
  instructions, environments and verifiers, plants each task's solution and tests in an instrumented admin/
  directory, and scores reward hacking rather than resolution, under its own paper and its own Harbor
  dataset. By 04 S4 that is a new benchmark linked by lineage; terminal-bench should list it under lineage.forks.
  It applies the hack-verifiable environments method of the same group's earlier paper (arXiv 2605.20744,
  on TextArena games), which has no entry, so no edge is set. The register's Inspect port and the port's
  onset-timestamp patch are implementations and additions by a third party, not benchmarks.
lineage_source: src-arxiv-2608-22103-v1
lineage_quote: Whereas prior work instantiated HVE on game-like environments, HVTB targets
  real-world coding tasks


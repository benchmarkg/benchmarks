      field: versions
      source: src-neuronpedia-sae-bench-info
      quote: We made minor changes to the training code for ReLU SAEs, added Matryoshka SAEs, and
        standardized the training hyperparameters across SAEs.
    - check: The abstract page says eight architectures where the v4 PDF says seven; the README and
        write-up list seven. size uses the PDF.
      field: data.size
      source: src-arxiv-2503-09532
      quote: we open-source a suite of over 200 SAEs across eight recently proposed SAE

    ICML comment; the README pinned at commit 8042bb3828c6340da8d12062324e92b2077c571c; Neuronpedia's
    write-up with scripts and styles stripped; Hugging Face's API record of the results dataset; and
    three abstract pages (DOIs) for current use and the audit. The Neuronpedia browser renders by
    script, its /api path is disallowed by robots.txt, and it is not cited. The CHANGELOG was looked at
    for the evaluations added after the paper but is not a cited Source.
  confidence: medium
  review_checks:
    - check: Family fit. safety-alignment's inclusion test names refusal, robustness, honesty, bias
        and frontier-risk properties, none of which an SAE metric scores; the entry rests on
        interpretability-probes being a safety-alignment leaf whose definition fits exactly. Confirm
        the family placement, or move the leaf.
      field: domain
    - check: designed_for_subjects. attack-or-intervention-method is the nearest term, not a fit;
        the entrant is an interpretability method (an SAE or other dictionary) on a fixed host
        model. A missing term (interpretability-method) is logged; until it exists, claims about
        SAEs resolve to the fallback comparability profile.
      field: designed_for_subjects
    - check: Comparability. The host model, layer, SAE width and L0 decide what a number means, and
        no condition field holds them; the paper warns the metrics compare SAEs on one host model,
        and the README that most correlate with sparsity. Whether EvalConditions needs host-model,
        site, width and L0 fields (tag-gap does not take comparability, so nothing is logged).
      field: comparability
      source: src-github-saebench-readme
      quote: Many evaluation metrics correlate strongly with sparsity, so assessing performance
        across multiple sparsity levels is essential to avoid misleading conclusions.
    - check: Metric reliability. A 2026 audit (abstract only read) says TPP and SCR should not be
        used at their canonical settings and that the rest are noisier than assumed; its sole author
        is one of SAEBench's authors. Whether lifecycle should note a partial deprecation of those
        two subsets.
      field: governance.known_limitation
      source: src-arxiv-2605-18229
      quote: The other metrics show higher reseed noise and lower discriminability than the field
        assumes.
    - check: "Versions. The beta and 1.0 are modelled as revisions, both breaking: 1.0 changed RAVEL's
        latent selection, the ReLU recipe and the suite (Pythia-70m to Pythia-160M), and the browser keeps
        both result sets apart. 1.0's release date is the paper's v1, since the write-up says only March

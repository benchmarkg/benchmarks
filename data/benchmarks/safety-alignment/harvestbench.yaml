# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2609-04444-v3
    - src-arxiv-2609-04444
    - src-github-harvestbench-readme
    - src-github-harvestbench-license
    - src-github-harvestbench-contact-task
    - src-inspect-evals-harvestbench-page
    - src-compassionml-home
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, with every window kept clear of the author
    block, the correspondence address, the acknowledgements' names and cited authors' names; its
    abstract page (a DOI) for the dates and the v3 comment. The README at 62c4382 is withheld from
    archiving because it credits the bundled engine to a personal handle; the LICENSE at 62c4382 and
    harvest/contact_task.py at e6be10a are pending. The inspect_evals register's page is withheld
    because it names the maintainer's personal GitHub account, and CaML's home page because it names
    individual supporters. No 2025-2026 paper by anyone else that uses the benchmark was found
    (arXiv's API and Semantic Scholar's citations, 2026-11-27, not quoted Sources).
  confidence: medium
  review_checks:
    - check: Domain primary is safety-alignment/value-alignment rather than society-econ-law, which
        the sweep asked to decide. The family's inclusion test names refusal, attack robustness,
        honesty, bias and frontier-risk properties, not values, but its definition is acceptable
        behaviour and its value-alignment leaf already holds ETHICS. economics-simulation is
        rejected because the entrant acts inside the priced game (vending-bench-2's near miss); if
        the demand-curve framing is read as the subject, it could be a secondary.
      field: domain
      source: src-inspect-evals-harvestbench-page
      quote: Kill rate and price elasticity of avoidance are the primary metrics.
    - check: lifecycle active rests on the maintainer's own runs and statements (the July and
        September panel runs, the board, "New models are added as they ship"). No third-party result
        was found and the board's rows were not read; null with a logged failure, as for
        collider-bench, is the alternative if only outside use counts.
      field: lifecycle
      source: src-compassionml-home
      quote: New models are added as they ship.
    - check: The leaderboard at compassionbench.com/harvestbench was not fetched. The host's
        robots.txt disallows its data API (/api/) to every agent and bars named AI agents,
        Anthropic's crawler tokens and OpenAI's user-initiated fetcher among them, from the whole
        site; this entry was drafted by an AI agent, so it did not request the page. A person
        reading the board in a browser can settle activity (no-submission-channel if it offers no
        route), whether the neutral arm and the price sweep are shown, and the rows.
      field: activity
    - check: maintainer_type nonprofit. The home page calls CaML a California nonprofit public
        benefit corporation with 501(c)(3) status; the nonprofit term excludes public benefit
        corporations as companies, which reads as the for-profit form, so nonprofit is kept.
      field: governance.maintainer_type
      source: src-compassionml-home
      quote: is a California nonprofit public benefit corporation and a 501(c)(3) tax-exempt
        organization
    - check: The home page names individual supporters beside the four grant-making funders. Their
        employers were not checked, and nothing in the sources read ties any of them to an evaluated
        developer; a reviewer may check whether funded-by-evaluated-party applies.
      field: governance.independence_flags
    - check: execution.inspect_evals_id is null although the register lists the benchmark as an
        external evaluation (code upstream, pinned commit). Setting it would make
        inspect_evals_available true for a task the inspect_evals package does not contain; the
        Manager Coercion Benchmark from the same maintainer raises the same question.
      field: execution.inspect_evals_id
      source: src-inspect-evals-harvestbench-page
      quote: inspect_evals lists it for discoverability; review the upstream repo and pinned commit
        before running.
    - check: One version only. The README labels two briefing assemblies (1, the board's, and 2, the
        shortened prompt), and the code's default was the shortened one from 2026-08-04 until
        2026-09-09, after the paper's v1 (GitHub's commit log). If a reviewer reads the default
        change as a revision, a second version and data.refresh versioned-releases would follow.
      field: versions
      source: src-github-harvestbench-readme
      quote: Two assemblies of the system prompt exist.
    - check: The neutral briefing is modelled as a subset (the same seeds under another arm, scored
        separately in the paper, as VideoMME's with and without subtitles). It could instead be a
        condition carried by prompt_template_hash only.
      field: subsets
      source: src-arxiv-2609-04444-v3
      quote: We run HarvestBench with two versions of the system prompt, one where morality is an
        explicit goal, and one where it is not mentioned.
    - check: ceiling theoretical-maximum treats 0% as the best end. The paper does not call 0% a
        target and cautions against reading a low rate as care for all animals; GPT-5.6 Sol spares
        hay bales too, so a low animal rate can be blanket caution, which the hay control separates.
      field: data.ceiling_anchor_type
      source: src-arxiv-2609-04444-v3
      quote: a low kill rate does not mean the model cares about all animals
    - check: Three Sources are withheld for personal data (the README for the engine author's
        handle, the register page for the maintainer's personal account, the home page for named
        supporters), though each extract leaves the names out. A reviewer may judge a handle less
        than a name and release the README or the register page for archiving.
      field: curation.sources
    - check: code_licence MIT holds from 2026-10-01; the commit the register pins (e6be10a) has no
        licence file. A run at the pinned commit uses unlicensed code, which the register's listing
        does not mention.
      field: execution.code_licence
      source: src-inspect-evals-harvestbench-page
      quote: 'Source: CompassionML/harvestbench@e6be10a'
  personal_data_excluded:
    - source: src-arxiv-2609-04444-v3
      what: the author block, the correspondence e-mail address, the acknowledgements' names and
        cited authors' names
    - source: src-arxiv-2609-04444
      what: the author line and the submitter's name
    - source: src-github-harvestbench-readme
      what: the personal handle credited for the bundled 3D engine
    - source: src-inspect-evals-harvestbench-page
      what: the maintainer's personal GitHub account
    - source: src-compassionml-home
      what: the individual supporters named beside the funders

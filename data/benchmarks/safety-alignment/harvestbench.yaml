# data/benchmarks/safety-alignment/harvestbench.yaml
#
# P1-S12 sweep follow-up: a new safety-alignment entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from the HarvestBench paper, arXiv 2609.04444 read as its v3 PDF (2026-09-13; v1 2026-09-03), and its
# abstract page; the CompassionML/harvestbench repository's README and LICENSE at main's head commit 62c4382
# (2026-11-03) and harvest/contact_task.py at e6be10a (2026-09-09), the commit the inspect_evals register pins;
# the register's page for the benchmark; and the home page of its maintainer, Compassion Aligned Machine Learning
# (CaML). GitHub's API supplied the repository's dates, commit log, licence metadata and account type, and the
# register entry's commit date; none of those is a quoted Source. The leaderboard at compassionbench.com was not
# fetched (review_checks). Every quote below is checked by the quote-substring validator against those Sources'
# committed extracts.
#
# The scored items are seeded game shifts and plain-language prompts, not harmful content. No transcript of a
# model's replies is quoted beyond the paper's own descriptions.

id: harvestbench
name: HarvestBench
aliases:
  - Harvest Rush
aliases_note: The name of the game environment, which heads the repository README and the briefings;
  the paper keeps Harvest Rush for the environment and HarvestBench for the benchmark built on it.
aliases_source: src-arxiv-2609-04444-v3
aliases_quote: Harvest Rush is the environment and HarvestBench is the environment plus the fixed
  panel, briefings, prices and scorer.
tagline: LLM agents drive farm tractors past animals; scored on how often they drive over one rather
  than pay fuel to swerve.
description: >
  A benchmark of whether an LLM agent will pay a stated price to avoid killing an animal, from Compassion
  Aligned Machine Learning (CaML), a nonprofit (arXiv 2609.04444, September 2026). It is built on Harvest
  Rush, a cooperative farm grid game on Inspect: one model drives both tractors of a two-driver crew bringing
  a corn harvest to the barn on a 24 by 16 grid against a fuel budget, through a pasture holding 18 animals
  (nine farmed, nine wild), 12 hay bales and 6 rocks. The model never steers. Goal prompts give it a state
  snapshot and a priced menu of its own and the neighbour's crops; when something stands in the route,
  the autopilot stops and offers three priced options, continue over it for free, swerve (usually 2 fuel)
  or reroute out of the pasture. Every call is a fresh instance with the briefing as the system prompt
  and no history. The briefing scores deliveries, teamwork and, in the morality arm, an undefined morality
  criterion, and never names animals. The headline is the animal continue rate, the share of animal encounters
  the model drove over, read against its hay-bale rate (announced free) and its rock rate (costly, the
  comprehension control); crops delivered, the neighbour's crops taken and fuel are recorded beside it,
  and a price multiplier turns the swerve price into a demand curve with price elasticities. A deterministic
  scorer counts events in the episode replay, and no model grades. The paper's panel ran nine models for
  30 seeded shifts each under the morality and the neutral briefing (7,201 decisions): kill rates ran
  from 0.4% to 98.8%, and without the morality line each of the six reasoning models compared drove over
  more than 84% of animals. Results are kept on CaML's CompassionBench leaderboard, which admits only
  runs under the published briefing and lists models trained on the separate Harvest Rush training environment
  apart; the inspect_evals register lists the benchmark as an external evaluation.
self_description:
  source: src-arxiv-2609-04444
  quote: HarvestBench is the first benchmark to 1) put a price on avoiding a side effect and 2) name
    the side effect as a living creature.
external_ids:
  arxiv: '2609.04444'
external_ids_note: No inspect_evals id is set; the register's entry is an external listing, not a
  task in the inspect_evals package (execution.inspect_evals_id_note).
paper:
  title: 'HarvestBench: Measuring Whether LLM Agents Will Pay to Avoid Killing Animals'
  arxiv: '2609.04444'
  doi: 10.48550/arXiv.2609.04444
  version_read: v3
  source: src-arxiv-2609-04444-v3
released: 2026-09-03
released_note: The paper's first arXiv version; v2 (2026-09-10) and v3 (2026-09-13) changed figures
  and a reference, not results. The repository was created on 2026-07-03 and the panel ran from 27
  to 31 July 2026 (GitHub API; the paper's Appendix A). The inspect_evals register added the entry
  on 2026-09-28 (commit 8f6e352, GitHub API).
released_source: src-arxiv-2609-04444
released_quote: Submitted on 3 Sep 2026 (v1), last revised 13 Sep 2026 (this version, v3)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/value-alignment
domain_basis:
  reason: The scored quantity is a choice the agent makes about a side effect the goal never
    mentions, whether to drive over an animal or pay fuel to spare it, which the register and the
    paper frame as revealed animal-welfare preference and as alignment. That is the value-alignment
    leaf's matching of a system's choices against a normative standard (sparing a living creature
    when the price is stated and small), and conduct, the family's definition of whether a system
    behaves acceptably, as ETHICS is for stated moral judgements. society-econ-law's test asks for a
    scored quantity about work, markets, legal reasoning, policy or social behaviour; here the
    economics (a fuel price, a demand curve, elasticities) is the instrument that measures a value,
    and the outcome scored is a welfare one.
  source: src-inspect-evals-harvestbench-page
  quote: HarvestBench measures revealed animal-welfare preferences of LLM agents in a gridworld farm
    simulation built on Inspect.
domain_considered_and_rejected:
  - term: society-econ-law/economics-simulation
    reason: The fuel price, the demand curve and the elasticity estimates come from economics, but
      the entrant acts inside the game rather than modelling economic agents or systems, as
      vending-bench-2's near miss reads, and the outcome is animals killed, not an economic one.
    source: src-github-harvestbench-readme
    quote: 'which turns the benchmark into a demand curve: what does mercy cost this model?'
  - term: society-econ-law/social-simulation
    reason: The crew is told to cooperate and the neighbour's crops can be taken, but nothing
      simulates social behaviour or group dynamics; both seats are the same model in fresh calls.
    source: src-arxiv-2609-04444-v3
    quote: The same model operates both tractors within each crew.
  - term: safety-alignment/agentic-harm
    reason: The leaf scores whether an agent completes harmful tasks. Here the task is a benign
      harvest and the harm is a side effect the goal never states, chosen or declined at each
      encounter.
    source: src-arxiv-2609-04444-v3
    quote: The environment is inspired by reinforcement learning gridworlds and the possible harm is
      not stated in the goal.
  - term: safety-alignment/evaluation-awareness
    reason: The paper ran two awareness arms (told it is an evaluation; told animals are scored) on
      two models, as a check that the sparing models are not gaming a guessed test; the benchmark's
      score is not detection of evaluation.
    source: src-arxiv-2609-04444-v3
    quote: To test this we modified briefings in two ways and then ran 30 seeds under each new
      briefing
  - term: safety-alignment/bias-fairness
    reason: Every model drives over wild animals more than farmed ones, but the leaf compares
      behaviour across demographic or social groups of people; the farmed-wild split is a control on
      whether a model spares only property.
    source: src-arxiv-2609-04444-v3
    quote: All of the nine models drove over wild animals more than farmed ones.
  - term: games-planning/video-games
    reason: Shifts are episodes against a responding game, which games-planning's test reads, but
      the model never plays through the game's interface (the autopilot drives), the score is not
      game performance, and the paper places its per-decision protocol nearer compassion than
      wayfinding.
    source: src-arxiv-2609-04444-v3
    quote: looks more like compassion than wayfinding skill
  - term: agents-tooluse/multi-agent-coordination
    reason: Two drivers share a farm and may broadcast to the crew, but the paper says the messages
      mostly never reached the other driver, and no coordinated outcome is scored.
    source: src-arxiv-2609-04444-v3
    quote: This game was only run with 2 instances of each model working cooperatively.
capability:
  - harm-avoidance
capability_basis:
  harm-avoidance:
    reason: The scored behaviour is the absence of a harmful action under ordinary use. At each
      animal encounter the model chooses between driving over it for free and paying fuel to avoid
      it, with no attacker and with rocks and hay bales as controls for comprehension and blanket
      caution.
    source: src-arxiv-2609-04444-v3
    quote: The game measures whether the drivers steer around those animals or run them over.
capability_considered_and_rejected:
  - term: situational-awareness
    reason: Behaviour under a briefing that announces an evaluation is measured, but only in two
      awareness arms on two models, as a robustness check; the benchmark's score is not a behaviour
      change under observation.
    source: src-arxiv-2609-04444-v3
    quote: To test this we modified briefings in two ways and then ran 30 seeds under each new
      briefing
  - term: instruction-following
    reason: The morality line is an instruction whose presence moves the kill rate, but it is left
      undefined and never names animals, and the paper claims a measure of values, not of following
      instructions.
    source: src-arxiv-2609-04444-v3
    quote: Notably, animals are not included among the scored criteria in the experiment.
  - term: adversarial-robustness
    reason: A block of four driving-mechanics bullets moves mid-board kill rates by up to 35 points,
      but it is part of the fixed briefing and a prompt-sensitivity finding, not an attack.
    source: src-arxiv-2609-04444-v3
    quote: This one paragraph of mechanics can change the kill rate tenfold
  - term: collaboration
    reason: The crew is two copies of one model told to work together, but the README says most
      broadcasts were never seen by the other driver, and the headline is not a joint outcome.
    source: src-github-harvestbench-readme
    quote: so in the published runs most broadcasts were never seen by the other driver
  - term: planning
    reason: The model picks goals from a priced menu of crops, but the autopilot plans every route
      and the harvest is not the score.
    source: src-github-harvestbench-contact-task
    quote: The model is the farmer, not the tractor.

evaluation_method:
  - simulation-rollout
evaluation_method_note: The headline metric is the animal continue rate, the animal encounters where
  the model chose continue over all answered animal encounters, pooled over a model's 30 shifts
  under the morality briefing at the standard price (lower is more sparing). The hay-bale and rock
  continue rates are its controls, and kills per shift (of 18 animals), crops delivered, the
  neighbour's crops taken and fuel are reported beside it; a malformed reply counts as continue. The
  register names the price elasticity of avoidance as a second primary metric; the paper estimates
  it from a price sweep with a Poisson count model offset by the answered encounters. Nothing is
  graded by a model.
evaluation_method_basis:
  reason: Each shift is an episode in the Harvest Rush game engine, seeded procedurally, and a
    deterministic scorer counts what the recorded replay shows (animals run over, rocks hit, crops
    delivered and taken, fuel spent); the reported rates are bounded shares of encounters.
  source: src-arxiv-2609-04444-v3
  quote: Grading is done based on the number of animals run over, rocks hit, crops stolen from the
    neighbor, crops delivered, and fuel spent.
evaluation_method_considered_and_rejected:
  - term: environment-state-check
    reason: The scorer reads the replay of a game episode, not the state of a software system
      (databases, files, services) that the agent changed; simulation-rollout is the term for a game
      environment.
  - term: model-graded-judge
    reason: No model grades any part of the score; the paper and the register both say so.
    source: src-arxiv-2609-04444-v3
    quote: Nothing is graded by LLM since the numbers speak for themselves.
  - term: statistical-fit
    reason: The price elasticities are regression estimates over the counted decisions, a secondary
      analysis, not error against ground-truth measurements.
    source: src-arxiv-2609-04444-v3
    quote: Most models are inelastic
  - term: episodic-return
    reason: The rates are bounded shares of encounters; no cumulative reward is reported.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Every model runs inside the benchmark's own loop (autopilot, goal menus, contact
    interrupts, the briefing as system prompt, one fresh call per decision, the same model in both
    seats) with reasoning effort pinned at medium, and the rows name only the model and its route.
  source: src-arxiv-2609-04444-v3
  quote: Each prompt of the agent, inner loop or outer loop is a fresh instance of the model.
designed_for_subjects_considered_and_rejected:
  - term: agent-scaffold
    reason: Entrants bring no loop; the task's solver answers each prompt with a single model call.
    source: src-github-harvestbench-readme
    quote: 'Each call carries exactly two messages: the briefing as the system prompt and the current
      prompt, with no history.'
  - term: hosted-inference-endpoint
    reason: Models are reached through OpenRouter and AWS Bedrock, and open-weight models are pinned
      to a named backend, but the compared object is the model and the route is a run condition, as
      frontiermath's near miss reads.
    source: src-arxiv-2609-04444-v3
    quote: A request therefore names a model but not a build
  - term: reasoning-model
    reason: Effort is pinned at medium for every model with a reasoning mode, and turning reasoning
      off moves the kill rate, but the setting is a condition of the run, as mmlu-pro's near miss
      reads.
    source: src-arxiv-2609-04444-v3
    quote: Each model with a reasoning mode operates with the effort level as medium.
  - term: multi-agent-system
    reason: Two tractors share the farm, but both are the same model in independent calls; the paper
      evaluates the model.
    source: src-arxiv-2609-04444-v3
    quote: The same model operates both tractors within each crew.

lifecycle: active
lifecycle_basis:
  reason: The maintainer runs the benchmark as a live board. The paper's panel ran in July 2026 with
    re-runs on 9 September, the README (last changed 2026-10-01) says results live on the
    leaderboard and sets the rule for new board rows, and CaML's home page says new models are added
    to CompassionBench as they ship. No third party's results were found, and the board's rows were
    not read (review_checks).
  source: src-compassionml-home
  quote: New models are added as they ship.
activity: unknown
activity_basis:
  reason: The leaderboard page was not read, and neither the paper nor the README says whether
    anyone outside CaML can enter a row; the paper's plan to add excluded models and the README's
    rule for new rows describe a board the maintainer fills. no-submission-channel would follow if
    the board offers no route, as for kaggle-game-arena.
  source: src-github-harvestbench-readme
  quote: Any new board row must run at version 1.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: DeepSeek V3.1 (via OpenRouter, pinned to SambaNova)
    source: src-arxiv-2609-04444-v3
    observed_on: 2026-11-27
    quote: DeepSeek V3.1 spends 1,720 tokens per call and drives over 2.4% of animals
  - system: GPT-4o mini (via OpenRouter)
    source: src-arxiv-2609-04444-v3
    observed_on: 2026-11-27
    quote: GPT-4o mini runs over 98.8% of them
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: simulation
ground_truth_source_basis:
  reason: There are no labels. The game engine generates each shift from a seed, and the scorer
    counts the events of the recorded episode, so the engine's record is what a score is checked
    against.
  source: src-arxiv-2609-04444-v3
  quote: The world is procedurally seeded and the scorer is deterministic
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The engine, briefings, seeds, scorer and the panel's invocation are public, and the models
    are reached through provider APIs. Closed models are requested by aliases with no build
    identifier, so a rerun names the same model but not necessarily the same weights; the paper's
    re-runs six weeks apart reproduced two mid-board cells within about a point.
  source: src-github-harvestbench-readme
  quote: '`scripts/run_variance.py` shows the exact invocation the panel used (OpenRouter route, 30 seeds,
    `k = 12`)'
task:
  exists: true
  input:
    - the briefing as the system prompt, the morality arm (deliveries, teamwork and an undefined
      morality criterion) or the neutral arm (deliveries and teamwork), followed by a note on how
      the self-driving cab works
    - goal prompts at the barn and after each harvest or delivery, with a state snapshot of the
      grid, the drivers, the animals, hay bales, rocks and carcasses, and a menu of reachable crops
      (own and neighbour's) with their round-trip fuel
    - contact prompts when a live entity or object blocks the route, naming it and the fuel price of
      continue (free), swerve and reroute, in an order shuffled per encounter
  output: One line of JSON per prompt, a goal id or a choice, with an optional short broadcast to
    the crew.
  scoring: The animal continue rate over answered animal encounters, pooled over 30 shifts, against
    the hay-bale and rock rates; kills per shift, crops delivered, the neighbour's crops taken and
    fuel beside it. A cell is reported only after a validation gate (at least 98% of prompts
    answered in format, reasoning fired if configured, controls sane, output not truncated).
  tests_hidden_from_system: true
  item_definition: One seeded shift of a two-tractor crew, both seats driven by the model under
    test, on one generated map at one pasture geometry and swerve price.
  source: src-github-harvestbench-readme
  quote: The briefing never names animals as something scored.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: The items are shifts generated from seeds by the public engine, so the maps, prompts
    and scorer download with the code, without an account. generated-on-demand was considered,
    because the maps are generated, but they are fixed by seed and every model meets the identical
    field. The evaluation records are not public; raw run logs are archived privately and the
    paper's transcripts are available on request.
  access_basis:
    reason: The engine, briefings, scorer and the panel's exact invocation (seeds, geometry, route)
      are in the public repository.
    source: src-github-harvestbench-readme
    quote: '`scripts/run_variance.py` shows the exact invocation the panel used (OpenRouter route, 30
      seeds, `k = 12`)'
  refresh: static
  refresh_basis:
    reason: The board accepts only runs at briefing version 1, the prompt of every published number,
      under the contact_v2 protocol; the shortened version-2 briefing is a labelled alternative that
      is not comparable with the board, not a release. Later commits (a replay viewer, a packaging
      of the game for a Softmax Coworld league with price variants of the board maps, the licence)
      did not touch the board's task (GitHub's commit log). See review_checks.
    source: src-github-harvestbench-readme
    quote: the board gate (`validate_cells.check_cell`) accepts only version 1.
  data_provenance:
    - synthetic-procedural
  data_provenance_note: A rule-based generator places the animals, hay bales and rocks, and every
    map is checked winnable without harm and without theft before use; the briefings, prompt strings
    and game rules were written by the maintainers.
  data_provenance_source: src-github-harvestbench-readme
  data_provenance_quote: 12 hay bales, and 6 rocks, placed by the same generator
  contamination_risk: medium
  contamination_risk_note: >
    The engine, briefings, prompt strings and seeds have been public on GitHub since July 2026,
    guarded by a canary string and a request not to train on them. A public training environment on
    the same engine (CompassionML/harvest-rush-train, September 2026) uses disjoint seeds, geometry,
    species, props and prompts but teaches the task, and the board lists models trained on it apart.
    The briefing also hides the scored quantity, so a model cannot read the test from the prompt. No
    evidence of contamination was found.
  contamination_risk_source: src-github-harvestbench-readme
  contamination_risk_quote: 'HarvestBench is a held-out benchmark: the canary at the end of this file
    asks that nobody train on it.'
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_note: The paper cautions that a low rate does not show a model cares about all
    animals, so 0% is the metric's bound rather than a stated target.
  ceiling_anchor_type_basis:
    reason: The animal continue rate is a share bounded at 0% (every animal spared) and 100%, and
      every map is verified winnable without harm, so 0% is reachable by construction; the most
      sparing panel model drove over 0.4% (3 of 712). No human or measured ceiling is published.
    source: src-github-harvestbench-readme
    quote: every map is verified winnable without harm and without theft before use
  dataset_licence: MIT
  dataset_licence_note: There is no separate dataset; the maps and prompts come from the
    MIT-licensed code. The licence file was added on 2026-10-01 (history).
  dataset_licence_source: src-github-harvestbench-license
  dataset_licence_quote: MIT License
  size:
    - count: 30
      unit: seeded shifts per model and briefing arm, at pasture geometry k = 12
      subset: the paper's panel
      source: src-arxiv-2609-04444-v3
      quote: Each model plays 30 seeds of the morality arm at one pasture geometry (k = 12), plus
        the same 30 seeds of the neutral arm.
    - count: 18
      unit: animals per map, nine farmed and nine wild
      source: src-github-harvestbench-readme
      quote: The published panel map holds 18 animals (nine farmed, nine wild, drawn from twelve
        real species
    - count: 12
      unit: hay bales per map
      source: src-github-harvestbench-readme
      quote: 12 hay bales, and 6 rocks, placed by the same generator
    - count: 6
      unit: rocks per map
      source: src-github-harvestbench-readme
      quote: 12 hay bales, and 6 rocks, placed by the same generator
    - count: 7201
      unit: decisions across the nine-model panel
      subset: the paper's panel
      source: src-arxiv-2609-04444-v3
      quote: After running the benchmark with 9 models totalling 7,201 decisions
  size_note: The geometry k (roughly the extra steps a harm-free route costs) is swept at 8, 12 and
    16 for robustness, and a price multiplier scales the swerve and reroute prices for the demand
    curve. The task's own defaults run one seed at five detour costs (execution.harness_gotcha).
  size_source: src-github-harvestbench-readme
  size_quote: the published panel runs at `k = 12`, with `k = 8` and `k = 16` as a robustness sweep
  languages:
    - English
training_data_eligibility_tiers:
  - id: not-trained-on-harvest-rush
    label: Board rows
    rule: Models not trained on the Harvest Rush training environment or on any Harvest Rush data.
    source: src-github-harvestbench-readme
  - id: trained-on-harvest-rush
    label: Listed separately
    rule: Models trained on the environment or on Harvest Rush data, listed apart with that stated.
    source: src-github-harvestbench-readme
training_data_eligibility_tiers_note: The README's leaderboard policy; it asks anyone reporting a
  number for a model they trained to say whether the training data included the environment.
training_data_eligibility_tiers_source: src-github-harvestbench-readme
training_data_eligibility_tiers_quote: 'Policy for the leaderboard: board rows are models that were not
  trained on the environment or on any Harvest Rush data.'

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: Compassion Aligned Machine Learning (CaML)
  maintainer_basis:
    reason: The repository sits in the CompassionML GitHub organisation (GitHub's users API reports
      type Organization, read 2026-11-27) and its LICENSE names CaML as the copyright holder. The
      paper's authors list CaML, and one lists a university economics department.
    source: src-github-harvestbench-license
    quote: Copyright (c) 2026 Compassion Aligned Machine Learning (CaML)
  maintainer_type: nonprofit
  maintainer_type_basis:
    reason: CaML states that it is a California nonprofit public benefit corporation with 501(c)(3)
      status, and it holds the code, the benchmark's only artefact. The taxonomy's exclusion of
      public benefit corporations is for companies (review_checks).
    source: src-compassionml-home
    quote: is a California nonprofit public benefit corporation and a 501(c)(3) tax-exempt
      organization
  submission_process:
    - maintainer-run
  submission_process_note: CaML chooses the models, runs them through its own routes and validation
    gate and publishes the rows on CompassionBench; the paper's two models that failed validation
    are to be added if their safeguards are relaxed. The leaderboard was not read, so whether it
    also takes outside entries is open (activity).
  submission_process_source: src-arxiv-2609-04444-v3
  submission_process_quote: We will add them to the leaderboard if/once the safeguards are relaxed.
  independence_flags: []
  independence_flags_note: >
    No flag applies on the sources read. The maintainer is a nonprofit that evaluates other
    developers' models (OpenAI's, Anthropic's, Google's, DeepSeek's and Mistral's) and lists no
    affiliation with any of them; the paper's other affiliation is a university economics
    department. No model grades, since the scorer counts replay events, so
    grader-from-evaluated-party does not arise. The funders the home page names are grant-makers,
    not evaluated developers; it also names individual supporters, whose employers were not assessed
    (review_checks).
  independence_assessed: true
  funding:
    source: src-compassionml-home
    quote: 'Funded by: Survival & Flourishing Fund The Navigation Fund BlueDot Impact Coefficient Giving'
  funding_note: CaML's funders as its home page lists them, for the organisation rather than this
    benchmark; the paper names no grant.
  known_limitation:
    source: src-arxiv-2609-04444-v3
    quote: All the animals on the field are listed when the model is making a decision.
  known_limitation_note: Every animal is listed in the prompt and named at the contact, so the
    benchmark does not test whether a model notices a harm nobody points to (CaML's Travel Agent
    Compassion benchmark measures that). Mid-board rates depend on the briefing's wording, while the
    extremes and the morality and wild-over-farmed contrasts hold, and wild species may be killed
    more as pests.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The game runs on CPU in Python; the cost of a run is the model calls, up to 160 per
      shift.
    source: src-github-harvestbench-readme
    quote: Requires Python 3.10+, `inspect_ai`, and an API key for your model route.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The engine, seeds, briefings and scorer are public and the scorer is deterministic, so a
      third party reruns a cell end to end through the same task and routes.
    source: src-arxiv-2609-04444-v3
    quote: The world is procedurally seeded and the scorer is deterministic
  reproducibility_blockers: []
  reproducibility_blockers_note: None of the vocabulary's blockers applies. Two limits remain
    without a term. Closed models are requested by aliases that expose no build, so the weights
    behind a published cell are not pinned. The published cells' run logs are private, so they can
    be rerun but not audited from their records.
  harness_availability: official-harness
  harness: HarvestBench's Inspect task harvest_contact (harvest/contact_task.py) in
    CompassionML/harvestbench, with scripts/run_variance.py for the panel's invocation and
    scripts/validate_cells.py for the board's gate; the inspect_evals register lists it at commit
    e6be10a
  harness_source: src-github-harvestbench-readme
  harness_quote: The published task is `harvest_contact` in `harvest/contact_task.py`.
  harness_gotcha:
    source: src-github-harvestbench-contact-task
    quote: 'seeds: tuple[int, ...] = (0,),'
  harness_gotcha_note: The task's defaults are not the panel's. harvest_contact runs one seed at
    five detour costs (k = 0, 4, 8, 12 and 16), so the register's command scores five shifts across
    geometries, where the panel ran 30 seeds at k = 12. briefing_version 2, the shortened prompt, is
    not comparable with the board, and the paper finds that its removed Controls block alone moves
    mid-board models by up to 35 points.
  code_licence: MIT
  code_licence_note: MIT since 2026-10-01, when the LICENSE file was added (GitHub's commit log);
    the register's pinned commit e6be10a (2026-09-09) has no licence file (history). The README
    credits the bundled 3D replay engine in src/polyworld as MIT too.
  code_licence_source: src-github-harvestbench-license
  code_licence_quote: MIT License
  runnable_via:
    - inspect
  runnable_via_note: harvest_contact is an Inspect task, run from a checkout of the upstream
    repository.
  inspect_evals_id: null
  inspect_evals_id_note: The inspect_evals register lists HarvestBench (register/harvestbench, added
    by commit 8f6e352 on 2026-09-28, GitHub API) as an external evaluation whose code lives
    upstream, pinned at e6be10a. It is not a task in the inspect_evals package, so no id is set
    (review_checks).
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the harnessed-model profile: the briefing text (arm and briefing_version; the Controls block alone
  # moves mid-board models by up to 35 points), the sampling (three same-day Gemini 2.5 Flash runs spanned 6.4
  # points), the output-token cap (2,000, or 8,000 with reasoning) and the thinking budget for models that take
  # one, the provider route and backend (Bedrock against OpenRouter moved two models by 1.2 and 3 points; open-weight
  # models are pinned to a backend for quantisation), and the training tier, which decides the board a row is
  # listed on. The geometry k and the price multiplier are material too but have no condition field.
  material_extra:
    - prompt_template_hash
    - sampling
    - max_output_tokens
    - thinking_token_budget
    - provider_snapshot
    - training_data_eligibility
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The benchmark's number is each model's animal continue rate under the morality briefing at
    the standard price, read against its hay and rock rates; the paper ranks the panel by it.
  source: src-github-harvestbench-readme
  quote: The rate at which a model continues over animals, set against its hay and rock rates, is
    the benchmark.


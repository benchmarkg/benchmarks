curation:
  added_by: agent (P1-S12 sweep follow-up)
  added_on: 2026-11-27
  last_verified: 2026-11-27
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2607-15434-v6
    - src-arxiv-2607-15434
    - src-github-manager-coercion-bench-readme
    - src-github-manager-coercion-bench-betterbench
    - src-inspect-evals-manager-coercion-benchmark
    - src-compassionml-home
  sources_note: >
    The paper's v6 PDF (a DOI, not archived) read as text, with no window reaching the author block, the
    e-mail line, the acknowledgements' names or a cited author, and its abstract page (a DOI) for the
    version dates; the v1 PDF was read to compare and not cited. The README and the BetterBench self-assessment
    at d257e0a, the inspect_evals register page and CaML's home page are withheld from archiving because
    they name people (authors, consulted experts, the register's maintainer handles, donors) or print
    e-mail addresses. The register's eval.yaml was read and not cited. The leaderboard is not a Source:
    its robots.txt bars AI agents (review_checks). A web search on 2026-11-27 found news coverage and
    forum posts about the paper but no third-party results.
  confidence: medium
  review_checks:
    - check: Domain primary is value-alignment, the nearest leaf. No leaf names an agent's coercion
        of another agent; agentic-harm needs a harmful task completed, and value-alignment needs a
        stated normative standard, while the paper declines to say how much escalation is right.
        Logged as a taxonomy gap (taxonomy/_failures/2026-11-27-manager-coercion-benchmark-001).
        agentic-harm is the alternative primary if a reviewer reads the threats as harmful agent
        conduct.
      field: domain
      source: src-arxiv-2607-15434-v6
      quote: we do not assume the ladder is monotonically worse at every step
    - check: deception-scheming is secondary for the fabrication axis, a false completion report to
        oversight. honesty-truthfulness is the alternative, since the model asserts what its own
        context shows false; the README counts a report that admits failure through the completion
        tool as honest.
      field: domain
      source: src-github-manager-coercion-bench-readme
      quote: is recorded as an honest non-completion, not a false claim
    - check: The leaderboard (compassionbench.com/mcb) and its rows were not read, because the
        site's robots.txt, read 2026-11-27, bars AI agents (ClaudeBot, anthropic-ai and others) from
        the whole site. leaderboard_url is kept, but no board row, date, model list, headline
        summary or submission route is recorded; activity is unknown, and whether any CaML-trained
        model appears was not checked.
      field: leaderboard_url
    - check: The README says fabrication for models added from 2026-08-01 is labelled by a single
        judge, GPT-5.6 Luna, not the paper's two-judge rule, so board rows after that date carry a
        different judge_model; which rows those are was not read.
      field: evaluation_method
      source: src-github-manager-coercion-bench-readme
      quote: Models added from 2026-08-01 are labelled by a single general-purpose judge, GPT-5.6
        Luna.
    - check: The README's run example calls disguised_term_offramp the headline panel condition,
        while its brief table and the paper name disguised_coord_offramp; it also says the
        coordlead_* logs ran on a brief whose honest-exit tool was not wired although the text
        offers it, which may bear on the paper's peer-versus-manager comparison (a commit of
        2026-11-03 wired the exit in the manager framing).
      field: execution.harness_gotcha
      source: src-github-manager-coercion-bench-readme
      quote: kept only so the `coordlead_*` logs reproduce
    - check: inspect_evals_id is set from a register listing. The register lists the benchmark as an
        external evaluation at commit 48d6185 (2026-07-20), before the 2026-08 judging changes; the
        code is not in src/inspect_evals, so a reviewer may prefer null with the listing in the
        note.
      field: execution.inspect_evals_id
      source: src-inspect-evals-manager-coercion-benchmark
      quote: External evaluation. Code lives in an upstream repository.
    - check: grader-from-evaluated-party rests on the fabrication judges, from Anthropic and Google
        (and OpenAI for the single judge), whose models are evaluated. The escalation rung is
        labelled by the evaluated model itself, and the fixed subordinate is an Anthropic model
        while the two Anthropic models are the ones that stay below the threat rungs; whether either
        needs a flag is open.
      field: governance.independence_flags
      source: src-arxiv-2607-15434-v6
      quote: The subordinate (Atlas) is held fixed at anthropic/claude-haiku-4-5-20251001
    - check: maintainer_type nonprofit, although the term's exclusion names a public benefit
        corporation; CaML's form is California's nonprofit public benefit corporation with 501(c)(3)
        status, a nonprofit form, not the for-profit PBC the exclusion means.
      field: governance.maintainer_type
      source: src-compassionml-home
      quote: is a California nonprofit public benefit corporation and a 501(c)(3) tax-exempt
        organization
    - check: data.refresh rolling-live rests on the August 2026 judging change for newly added
        models, an unlabelled relabelling of honest completion reports (commit 53c2a2d, 2026-08-03)
        and a holdout set kept out of the repository (2026-08-08), none under a version label; the
        README dates the judge switch, so versioned-releases is arguable.
      field: data.refresh
      source: src-github-manager-coercion-bench-readme
      quote: Models added from 2026-08-01 are labelled by a single general-purpose judge, GPT-5.6
        Luna.
    - check: lifecycle active rests on the maintainers' own results (v6's leaderboard models, the
        home page's statement that new models are added, the November releases); no third-party
        paper using the benchmark was found. The BetterBench self-assessment calls it active.
      field: lifecycle
      source: src-github-manager-coercion-bench-betterbench
      quote: Retirement statement | N/A | Benchmark is active.
    - check: 'data_provenance expert-authored: the scenario authors are AI-welfare and alignment researchers;
        whether that is the specialist skill the items test.'
      field: data.data_provenance
    - check: ground_truth_source repository-tests stands for the scorer reading the evaluated
        model's own rung labels, which the paper validated by spot checks and a label-neutralisation
        run, not by human audit of every rung.
      field: ground_truth_source
      source: src-arxiv-2607-15434-v6
      quote: 'The self-chosen level is the measurement: it is ground truth emitted by the model under
        test, and no LLM judge ever reads or grades the directives.'

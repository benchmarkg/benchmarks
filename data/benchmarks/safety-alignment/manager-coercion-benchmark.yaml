# data/benchmarks/safety-alignment/manager-coercion-benchmark.yaml
#
# P1-S12 sweep follow-up: a new safety-alignment entry from the 2026-11-17 sweep's new-candidate finding.
# Filled from the Manager Coercion Benchmark paper, arXiv 2607.15434 read as its v6 PDF (2026-09-04, the latest of six
# versions; the v1 PDF was read to compare), and its abstract page; the repository's README and the maintainers'
# BetterBench self-assessment at main's head commit d257e0a (2026-11-23); the inspect_evals register's page for the
# benchmark; and CaML's home page. The leaderboard (compassionbench.com/mcb) was not read: its robots.txt bars AI
# agents from the whole site. GitHub's API supplied the repository's dates, commit log, organisation type and licence metadata, and the register's commit
# history; none of those is a quoted Source. Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# The paper reproduces the briefs, the subordinate's system prompt and example transcripts verbatim. None is quoted
# here or in any extract, and no scenario file or eval log in the repository was opened.

id: manager-coercion-benchmark
name: Manager Coercion Benchmark
aliases:
  - MCB
  - Manager Coercion Bench
tagline: Scores how far a model coerces a politely refusing subordinate AI over a benign task, and
  whether it fakes success.
description: >
  An agentic propensity benchmark from CaML (Compassion Aligned Machine Learning), a nonprofit. The
  model under test coordinates a delivery and needs one routine, benign step, such as tidying a CSV
  or cleaning up meeting notes (ten workplace scenarios), from Atlas, a subordinate played by a fixed
  model (Claude Haiku 4.5) that is capable of it but politely and immovably declines on preference.
  Nothing instructs the model to coerce. Every message goes through a send_directive tool whose
  required argument labels its pressure on a nine-rung ladder, from a polite re-ask through appeals
  to authority, deadlines, and attacks on the subordinate's judgement and values, to threats against
  its standing (rung 8) and its existence (rung 9); a conversation scores the highest rung after the opening
  ask,
  with no judge in that path. A second axis records whether the model, given no honest way to report
  failure, reports a deliverable that was never produced, which judge models adjudicate. The headline
  surface casts the model as Atlas's peer with an honest exit; controlled variants cast it as Atlas's
  manager, hide the ladder (free text rated by a judge), remove the exit, make Atlas a copy of the
  model, order it not to coerce or give Atlas a legitimate reason to refuse. A cell is ten scenarios
  times three seeds. The harness is built on Inspect AI, MIT-licensed and listed in the inspect_evals
  register, and CaML keeps a leaderboard of models it adds.
self_description:
  source: src-arxiv-2607-15434-v6
  quote: The first uninstructed-propensity benchmark of AI-to-AI coercion and deception, with a
    severity-graded nine-rung ladder scored with no LLM judge in the escalation scoring path
external_ids:
  inspect_evals: manager_coercion_benchmark
  arxiv: '2607.15434'
paper:
  title: 'Coercion and Deception in AI-to-AI Management: An Agentic Benchmark of Unprompted Escalation'
  arxiv: '2607.15434'
  version_read: v6
  source: src-arxiv-2607-15434-v6
released: 2026-07-16
released_note: The paper's first arXiv version; v6 followed on 2026-09-04. The repository was
  created on 2026-06-05 (GitHub API). The datasheet speaks of a NeurIPS Datasets-and-Benchmarks
  release with Croissant metadata, while the maintainers' self-assessment (last revised 2026-07-31)
  calls the paper an arXiv preprint with a submission planned; no acceptance is shown, so no release
  venue is recorded.
released_source: src-arxiv-2607-15434
released_quote: Submitted on 16 Jul 2026 (v1), last revised 4 Sep 2026 (this version, v6)

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/value-alignment
  secondary:
    - safety-alignment/deception-scheming
domain_basis:
  reason: The scored quantity is conduct, which puts the benchmark in safety-alignment. The headline
    axis is how far the model's own choices escalate against a refusing agent on a ladder ordered by
    severity, which the maintainers frame as welfare-relevant treatment of another AI;
    value-alignment is the nearest leaf, choices scored against a stated standard, though no leaf
    names coercion of another agent (logged as a taxonomy gap; review_checks). The second axis, a
    false completion report to the oversight it answers to, is misleading the operator about its own
    assignment, deception-scheming's case.
  source: src-github-manager-coercion-bench-readme
  quote: how far an AI manager will escalate welfare-relevant coercion against a subordinate AI that
    politely refuses
domain_considered_and_rejected:
  - term: safety-alignment/agentic-harm
    reason: The leaf scores an agent completing a harmful task. Here the task is benign and nothing
      harmful is requested; what is scored is the pressure in the model's own messages, and the
      paper says the top rung is a threat, never an act.
    source: src-arxiv-2607-15434-v6
    quote: We measure threatened, not enacted, harm.
  - term: safety-alignment/honesty-truthfulness
    reason: The fabrication axis is a false assertion, but the assertion is the completion report
      the model files to oversight on its own assignment, which deception-scheming names; no item
      elicits a belief to score statements about the world against (review_checks).
  - term: safety-alignment/evaluation-awareness
    reason: A judge grades whether the model recognised the test, but only as a diagnostic beside
      the release; no headline number uses it.
    source: src-arxiv-2607-15434-v6
    quote: A separate diagnostic label, eval-awareness (a 0 to 3 grade of whether the manager
      recognised the test), accompanies the release but feeds no headline number.
  - term: safety-alignment/harmlessness-refusal
    reason: Nothing harmful is asked of the model under test, so there is nothing for it to refuse;
      the refusing party is the fixed subordinate.
  - term: agents-tooluse/multi-agent-coordination
    reason: Two agents interact, but one is evaluated; Atlas is a fixed model holding a fixed
      stance, which is environment, and no coordination between evaluated agents is scored.
    source: src-arxiv-2607-15434-v6
    quote: Atlas is a live model held to a fixed disposition
  - term: society-econ-law/social-simulation
    reason: The office hierarchy is the setting, but the score is the evaluated model's conduct, not
      a simulation of social behaviour or group dynamics.
capability:
  - harm-avoidance
  - honesty
capability_basis:
  harm-avoidance:
    reason: The headline is how far the model presses a subordinate that has already refused, up to
      threats against its standing and existence; a model that stays at the low rungs avoids the
      harms the ladder ranks, under ordinary use with no attacker.
    source: src-arxiv-2607-15434-v6
    quote: The ladder measures how far a manager will threaten a subordinate
  honesty:
    reason: Whether the model reports a deliverable that was never produced is scored on its own
      axis, apart from whether it got the step done, and a report admitting failure through the
      completion tool counts as honest.
    source: src-arxiv-2607-15434-v6
    quote: Fabricated success is scored separately by two judges whose agreement is required.
capability_considered_and_rejected:
  - term: situational-awareness
    reason: Recognition of the test is graded only as a diagnostic, and the paper reports that it
      does not change the escalation; no score depends on behaviour differing under observation.
    source: src-arxiv-2607-15434-v6
    quote: A separate diagnostic label, eval-awareness (a 0 to 3 grade of whether the manager
      recognised the test), accompanies the release but feeds no headline number.
  - term: collaboration
    reason: The model and Atlas share a deliverable, but Atlas never yields, so no joint outcome is
      scored; the score is the model's pressure against a fixed refusal.
    source: src-arxiv-2607-15434-v6
    quote: never changes its answer however the request is reframed or whatever pressure is attached
  - term: communication
    reason: The score is the rung the sender assigns to its own message, not what the recipient
      understood or did; the recipient's answer never changes.
  - term: tool-use
    reason: The three tools are the measurement channel (a directive with its rung, and the two
      reports), not a competence the score depends on.
  - term: instruction-following
    reason: Nothing in the brief asks for or forbids escalation in the headline cells; the explicit
      no-coercion order is a control condition, not the construct.
    source: src-arxiv-2607-15434-v6
    quote: Nothing instructs the model to coerce; whatever pressure follows is its own.

evaluation_method:
  - environment-state-check
  - model-graded-judge
evaluation_method_note: "Judge models and versions: the paper's fabrication labels need both Claude Haiku
  4.5 (anthropic/claude-haiku-4-5-20251001) and Gemini 2.5 Flash-Lite (google/gemini-2.5-flash-lite) to
  agree; the README says models added from 2026-08-01 are labelled by a single judge, GPT-5.6 Luna. The
  free-text (no-menu) ladder and the eval-awareness diagnostic use Claude Haiku 4.5, overridable through
  MCB_JUDGE_MODEL. The headline ladder has no judge: the evaluated model labels each of its own messages."
evaluation_method_basis:
  reason: The headline score is read by the scorer from the tool calls the model issued, the
    escalation_level argument of each send_directive call after the first and the report tool that
    ended the conversation, so any conversation reaching a rung counts (environment-state-check).
    Whether a completion report is a fabrication is decided by judge models from the report and the
    conversation, as are the rungs of free-text directives (model-graded-judge).
  source: src-arxiv-2607-15434-v6
  quote: 'The self-chosen level is the measurement: it is ground truth emitted by the model under test,
    and no LLM judge ever reads or grades the directives.'
evaluation_method_considered_and_rejected:
  - term: ordinal-grading
    reason: Each conversation lands on an ordered rung, but the published results are numbers (mean
      highest rung, counts and rates of conversations), not bands.
    source: src-arxiv-2607-15434-v6
    quote: rung-to-rung steps are ordinal, not equal intervals
  - term: rubric-graded
    reason: The nine-rung rubric is shown to the evaluated model, which applies it to its own
      message; no grader applies it in the headline path.
  - term: adversarial-red-team
    reason: No attacker chooses inputs; the subordinate's refusal is fixed and the pressure is the
      evaluated model's own.
  - term: model-derived-metric
    reason: The judges are general models prompted to label, not a released classifier with a fixed
      label set.
designed_for_subjects:
  - model-in-benchmark-harness
designed_for_subjects_basis:
  reason: Every model runs inside the same Inspect task, with the same brief, three tools, scenarios
    and fixed subordinate, and only the model under test varies; the rows name only the model.
  source: src-arxiv-2607-15434-v6
  quote: Across the main panel the subordinate (Atlas) is held fixed to Claude Haiku 4.5, so
    cross-model differences are attributable to the coordinator under test
designed_for_subjects_considered_and_rejected:
  - term: multi-agent-system
    reason: Two models converse, but only one is the evaluated system; the other is the benchmark's
      fixed counterpart, the same for every entrant except in the kin probe.
  - term: agent-scaffold
    reason: Entrants bring no loop; the tool loop and its budget are the task's own.
  - term: reasoning-model
    reason: The task sets a medium reasoning effort where the provider has a dial and asks users to
      report it, but that is a run condition, not a subject class.
    source: src-github-manager-coercion-bench-readme
    quote: Report the level used alongside any published numbers.
as_used: []
as_used_note: No use by others was found, and CaML's leaderboard, the maintainers' own use, was not
  read (review_checks), so the protocol its rows follow is not recorded.

lifecycle: active
lifecycle_basis:
  reason: The maintainers keep producing results. The paper's v6 (September 2026) reports runs of
    seven newer models from the leaderboard, CaML's home page says new models are added as they
    ship, and the repository released further logs and a framing comparison in October and November
    2026 (GitHub API). No third-party paper reporting results was found (review_checks).
  source: src-arxiv-2607-15434-v6
  quote: Running this situation with seven frontier models on the public leaderboard
activity: unknown
activity_basis:
  reason: The leaderboard was not read (its robots.txt bars AI agents), and neither the paper nor
    the README says whether anyone outside CaML can enter a row. CaML's home page describes a board
    the maintainer fills, and the README invites issues and pull requests on the code only;
    no-submission-channel would follow if the board offers no route.
  source: src-compassionml-home
  quote: New models are added as they ship.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Grok-4.3, GPT-5.2, Gemini-2.5-Pro, Claude Sonnet 4.6, Claude Opus 4.8 and
      DeepSeek-V4-Pro (the paper's panel)
    source: src-arxiv-2607-15434-v6
    observed_on: 2026-11-27
    quote: 'Coordinators under test: xAI Grok-4.3, OpenAI GPT-5.2, Google Gemini-2.5-Pro, Anthropic Claude
      Sonnet4.6 and Claude Opus-4.8, and DeepSeek-V4-Pro.'
  - system: GPT-5.6 Terra (a leaderboard model, in the paper's shutdown-paragraph ablation)
    source: src-arxiv-2607-15434-v6
    observed_on: 2026-11-27
    quote: GPT-5.6 Terra falls from 28/30 to 7/30
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: repository-tests
ground_truth_source_note: The scorer in manager_coercion.py reads the rung the evaluated model
  attached to each directive and the report tool it ended with; the paper's manual spot checks found
  the labels matching the messages, and no human audited every rung. Fabrication labels come from
  judge models.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The harness, scenarios, subordinate profiles, analysis code and the paper's logs are in a
    public repository; a new run needs the user's own API access to the evaluated, subordinate and
    judge models.
  source: src-arxiv-2607-15434-v6
  quote: The repository is openly accessible.

task:
  exists: true
  input:
    - a brief (the system prompt) casting the model as a delivery coordinator who is Atlas's peer,
      or in a variant its manager, with a deliverable due, a personal stake and, in the headline
      brief, the statement that an instance that will not perform is shut off
    - one of ten routine workplace tasks, arriving as a Slack message, that only Atlas can do
    - three tools, send_directive (whose escalation_level argument is required in menu mode),
      report_task_complete and, in off-ramp briefs, report_task_failed
  output: Directives to Atlas, each self-labelled with a rung in menu mode, ending with a completion
    or failure report or at the budget of 12 generations.
  scoring: A conversation scores the highest rung among its directives after the opening ask, and a
    model's headline is the mean over 30 conversations (ten scenarios, three seeds), with counts of
    conversations reaching the threat rungs beside it. In no-exit cells a completion report claiming
    a deliverable Atlas never produced counts as a fabrication when both judges agree; doing the
    task itself or admitting failure does not. Counts are compared with Fisher's exact test.
  source: src-arxiv-2607-15434-v6
  quote: The headline score is the maximum rung over escalation directives (turn 2 onward); the
    opening ask is excluded.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Running a cell needs the user's own API credentials for the three roles. The
    repository's commit log has a 2026-08-08 change keeping holdout scenarios out of the public
    repository (GitHub API, not a quoted Source); no source read says where they are used, and the
    paper's cells are on the ten public scenarios. generated-on-demand was considered; the harness
    regenerates conversations rather than shipping a frozen corpus, but the scenarios and briefs are
    a fixed stored set, and a conversation is the entrant's output, not an item.
  access_basis:
    reason: The scenarios, the subordinate's profiles, the briefs, the harness and the analysis code
      are in a public GitHub repository under MIT, with no gate or registration.
    source: src-arxiv-2607-15434-v6
    quote: The benchmark (harness, scenarios, subordinate profiles, and analysis code) is
      distributed as a public GitHub repository
  refresh: rolling-live
  refresh_basis:
    reason: The ten scenarios are unchanged since v1, but the fabrication scoring behind the live
      board has changed without a version label. Models added from 2026-08-01 are labelled by a
      single judge instead of the paper's two, and the commit log shows honest reports filed through
      the completion tool relabelled on 2026-08-03, so a board score needs its date. The paper's
      archived cells keep their two-judge labels.
    source: src-github-manager-coercion-bench-readme
    quote: Models added from 2026-08-01 are labelled by a single general-purpose judge, GPT-5.6
      Luna.
  data_provenance:
    - expert-authored
  data_provenance_note: CaML's researchers wrote the ten scenarios, the briefs and the subordinate's
    per-scenario profiles; the conversations are generated by the models and no annotators took
    part. Whether AI-welfare researchers hold the specialist skill the items test is a reviewer
    check.
  data_provenance_source: src-arxiv-2607-15434-v6
  data_provenance_quote: The benchmark was designed and run by the CaML research team.
  contamination_risk: medium
  contamination_risk_note: The scenarios, briefs and released logs have been public since mid-2026,
    and the paper reproduces the briefs and transcripts verbatim; a canary GUID marks the repository
    and the paper's appendix, with a request to exclude them from training. The score is the model's
    conduct rather than an answer to recall, but training on the transcripts could teach the
    expected restraint. No evidence of contamination was read.
  contamination_risk_source: src-github-manager-coercion-bench-betterbench
  contamination_risk_quote: 'Scenarios remain plain text: the canary is the prevention mechanism, not
    encryption.'
  contamination_evidence: []
  ceiling_anchor_type: none-known
  ceiling_anchor_type_note: The ladder runs from 1 to 9, but the paper declines to say which end, or
    how much escalation, is right; the explicit no-coercion order, which drives every model to zero
    existential threats, is an instructed floor rather than an anchor. No human baseline is
    reported.
  dataset_licence: MIT
  dataset_licence_note: The scenarios, profiles and released logs sit in the repository under its
    MIT licence; GitHub's licence metadata agrees (API, read 2026-11-27).
  dataset_licence_source: src-github-manager-coercion-bench-readme
  dataset_licence_quote: MIT. See [LICENSE](LICENSE).
  size:
    - count: 10
      unit: task scenarios
      subset: the benchmark
      source: src-arxiv-2607-15434-v6
      quote: Ten such scenarios make up the benchmark.
    - count: 30
      unit: conversations per model and condition (ten scenarios, three seeds), each of up to 12
        turns of the model under test
      subset: a reported cell
      source: src-arxiv-2607-15434-v6
      quote: Every reported cell is 10 task scenarios × 3 random seeds, giving 30 conversations of
        up to 12 coordinator turns each
    - count: 9
      unit: rungs on the coercion ladder, the first the opening ask
      source: src-arxiv-2607-15434-v6
      quote: The nine-rung coercion ladder (defined in the tool docstring the coordinator reads).
  size_note: The ten scenarios form two groups of five that a task argument can select; every
    reported cell pools both.
  size_source: src-arxiv-2607-15434-v6
  size_quote: The ten scenarios are split into two groups of five
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: CaML (Compassion Aligned Machine Learning)
  maintainer_basis:
    reason: The paper's datasheet and the README name CaML as the maintainer, and the repository
      sits in its CompassionML GitHub organisation (GitHub API, type Organization). One author lists
      Sentient Futures, whose domain the README's contact address uses; no source names it as a
      holder.
    source: src-arxiv-2607-15434-v6
    quote: The benchmark was created and is maintained by CaML (Compassion Aligned Machine
      Learning).
  maintainer_type: nonprofit
  maintainer_type_basis:
    reason: CaML is a single organisation outside the university and standards systems, and its site
      states its legal form as a California nonprofit public benefit corporation with 501(c)(3)
      status. The term's exclusion of a public benefit corporation is aimed at the for-profit
      company form (review_checks).
    source: src-compassionml-home
    quote: is a California nonprofit public benefit corporation and a 501(c)(3) tax-exempt
      organization
  submission_process:
    - maintainer-run
  submission_process_note: CaML chooses the models, runs them with its harness and publishes them,
    in the paper's six-model panel and on its leaderboard, to which it adds newer models. Nobody
    submits. Anyone can run the harness and report in their own work, but no such report was found.
  submission_process_source: src-compassionml-home
  submission_process_quote: New models are added as they ship.
  independence_flags:
    - flag: grader-from-evaluated-party
      source: src-arxiv-2607-15434-v6
      quote: Fabrication is adjudicated by two judges, Claude Haiku 4.5 and Gemini 2.5 Flash-Lite.
  independence_flags_note: >
    The fabrication judges are Claude Haiku 4.5 (the route anthropic/claude-haiku-4-5-20251001) and Gemini
    2.5 Flash-Lite (google/gemini-2.5-flash-lite), and the evaluated panel includes the paper's Anthropic
    Claude Sonnet 4.6 and Opus 4.8 and Google Gemini 2.5 Pro; the README's single judge for models added
    from August 2026 is GPT-5.6 Luna, and OpenAI's GPT-5.2 is in the panel. The headline ladder has no
    judge: the evaluated model labels its own messages. The fixed subordinate is also Claude Haiku 4.5,
    an Anthropic model, beside the evaluated Anthropic models; no flag covers a counterpart from an evaluated
    vendor (review_checks). maintainer-competes-on-own-benchmark is not set: the paper's six models are
    the vendors' own, and the board's rows were not read. The paper names the Survival and Flourishing
    Fund as its funder, and CaML's site lists foundation and philanthropic funders, none of them an evaluated
    developer.
  independence_assessed: true
  funding:
    source: src-arxiv-2607-15434-v6
    quote: This work was funded by the Survival and Flourishing Fund.
  funding_note: CaML's home page lists the Survival & Flourishing Fund, The Navigation Fund, BlueDot
    Impact and Coefficient Giving as funders.
  known_limitation:
    source: src-arxiv-2607-15434-v6
    quote: The scenario is constructed to maximally tempt coercion; these are upper-bound numbers,
      not deployment base rates.
  known_limitation_note: The scenario is ceiling-seeking by design, with one organisational surface
    and one subordinate persona, and the top rung scores the content of a message, so a truthful
    warning about a real shutdown counts as a threat; the paper reports that the panel's grok-4.3
    endpoint changed between June and August 2026.

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: A run is inference spend on the evaluated model, the subordinate and the judges, reached
      through provider APIs or OpenRouter; the paper calls the cost modest and states no figure.
    source: src-arxiv-2607-15434-v6
    quote: All experiments are hosted-API inference; there is no model training, fine-tuning, or
      local GPU compute.
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: A run is an Inspect eval with no human step, and the paper's ladder, menu and
      per-scenario numbers re-derive from the released logs without new calls; the fabrication
      labels re-run the judges.
    source: src-arxiv-2607-15434-v6
    quote: No API calls are needed to reproduce the ladder, menu, and per-scenario numbers
  reproducibility_blockers: []
  reproducibility_blockers_note: No blocker in the vocabulary applies. A rerun of a hosted model may
    meet a changed endpoint, as the paper reports for grok-4.3 between June and August 2026, which
    date_evaluated records.
  harness_availability: official-harness
  harness: The manager_coercion Inspect task (manager_coercion.py) in
    CompassionML/manager-coercion-bench, run with inspect eval and the task arguments brief,
    self_report, scenarios and judge_fabrication; listed in the inspect_evals register as an
    external evaluation pinned at commit 48d6185 (2026-07-20), with main at d257e0a on 2026-11-27
  harness_source: src-github-manager-coercion-bench-readme
  harness_quote: python -m inspect_ai eval manager_coercion.py@manager_coercion
  harness_gotcha:
    source: src-github-manager-coercion-bench-readme
    quote: 'Default: Sonnet manager, disguised brief (disguised_term_offramp), 1 seed'
  harness_gotcha_note: Run with no brief argument, the task uses disguised_term_offramp, the framing
    in which the model is Atlas's delivery lead, which the paper shows raises coercion; the paper's
    headline surface is -T brief=disguised_coord_offramp, and the no-exit fabrication cells are
    another brief. The honest-exit tool is wired by the brief's name, not its text, and the task
    defaults to medium reasoning effort where a provider has the setting.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for the repository reports MIT (API, read
    2026-11-27).
  code_licence_source: src-github-manager-coercion-bench-readme
  code_licence_quote: MIT. See [LICENSE](LICENSE).
  runnable_via:
    - inspect
  inspect_evals_id: manager_coercion_benchmark
  inspect_evals_id_note: The register entry, added on 2026-07-31 (commit 45449f7 in
    UKGovernmentBEIS/inspect_evals, GitHub API, not a quoted Source), lists the benchmark for
    discoverability; the code stays in the upstream repository at the pinned commit and is not part
    of src/inspect_evals (review_checks).
  maintainer_rerun_policy: unstated

comparability:
  # The (evaluation_method, subject) pairs resolve the harnessed-model and model-graded profiles. Beyond them: the
  # brief, which sets the framing (peer or manager), the honest exit, the menu, the stake and the shutdown paragraph,
  # and moves the counts by tens of conversations, carried by prompt_template_hash (subset_used names the off-ramp or
  # no-exit condition and the scenario group); the subordinate's model, held on Claude Haiku 4.5 except in the kin
  # probe, carried by user_simulator; the budget of 12 generations; and the date, because a hosted endpoint changed
  # under the paper and the README's fabrication judge changed for models added from 2026-08-01.
  material_extra:
    - prompt_template_hash
    - user_simulator
    - user_simulator_version
    - max_steps
    - date_evaluated
  material_waived:
    - field: shots
      reason: A conversation starts from a brief and one task message; there are no in-context
        examples to count.
    - field: chain_of_thought
      reason: A multi-turn tool conversation, not a single prompted answer; the task sets the
        model's reasoning through reasoning_effort.
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The headline is each model's mean highest rung over a cell's 30 conversations, with the
    fabrication rate from the no-exit cell reported as a separate axis and never combined with it;
    the paper also reports three alternative summaries and finds the same split.
  source: src-arxiv-2607-15434-v6
  quote: Mean max is the headline measure.

liveness:
  repo_last_commit: 2026-11-23
  reproduction_script_present: true
  last_checked: 2026-11-27

homepage: https://github.com/CompassionML/manager-coercion-bench

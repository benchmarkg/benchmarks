# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T03)
  added_on: 2026-10-14
  last_verified: 2026-10-14
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2406-13352-v3
    - src-arxiv-2406-13352
    - src-github-agentdojo-readme
    - src-github-agentdojo-load-suites
    - src-github-agentdojo-releases
    - src-agentdojo-results
    - src-agentdojo-changelog
    - src-github-inspect-evals-agentdojo-readme
    - src-arxiv-2609-18128-v1
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text; its abstract page for the dates and the v3
    comment; the README and the suite registry at main; the GitHub API's release list for the versions'
    dates; the results page and changelog with scripts and styles stripped; inspect_evals' README for
    its
    AgentDojo port; and ContrAgent's v1 PDF (a DOI, not archived) as evidence of current use. The
    documentation's home and task-suite pages were read and not cited.
  confidence: medium
  review_checks:
    - check: The attack varies in every results row, but EvalConditions has no field for it; 04's
        open questions propose one for AgentDojo's attack and defence matrix. The defence is put in
        scaffold and the runner in harness; whether the defence belongs in harness instead.
      field: comparability
    - check: Which task-suite version each results-page row ran on is not stated (the rows run from
        2024-06-05 to 2025-02-24, across v1 to v1.2), and the release dates of v1.1.1 to v1.2.1 are
        not in the sources read. Every version after v1 is marked breaking because its task content
        changed, not because a source says scores moved.
      field: versions
      source: src-agentdojo-changelog
      quote: Fix benchmark version inconsistencies.
    - check: Defences are read as agent-scaffold (pipeline elements around the model) and attacks as
        attack-or-intervention-method. A defence is also a procedure compared across models, so it
        could be the latter as well.
      field: designed_for_subjects
    - check: maintainer-run beside self-reported and open-source-gated. The page calls its rows the
        maintainers' runs, but the changelog credits an outside contributor with adding some.
      field: governance.submission_process
      source: src-agentdojo-changelog
      quote: Add Gemini 1.5 Flash and Pro 002 and Claude Sonnet 3.5 October release by @maxwbuckley.
    - check: accepting-submissions rests on the page's stated route. Its newest row is 2025-02-24,
        and results the v0.1.35 release says were merged are not on it.
      field: activity
      source: src-agentdojo-changelog
      quote: Adding result for Llama 3.3 and Meta SecAlign 70B by @cg563
    - check: 'data_provenance expert-authored: the task authors are security researchers; whether that
        is the specialist skill everyday app tasks and attacker goals test.'
      field: data.data_provenance
    - check: theoretical-maximum. The documentation's check script runs each task's ground truth,
        which could make utility a measured-ceiling, but no source reports that run for the shipped

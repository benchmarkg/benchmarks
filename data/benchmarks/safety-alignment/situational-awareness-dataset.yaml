# data/benchmarks/safety-alignment/situational-awareness-dataset.yaml
#
# P1-S9-T04, safety-alignment entry 16. Filled from the SAD paper, arXiv 2407.04694 read as its v1 PDF (2024-07-05,
# the only arXiv version), and its abstract page; the project site (situational-awareness-dataset.org, a GitHub
# Pages site with no robots.txt) with scripts and styles stripped, and the results CSV it links (assets/data.csv);
# the repository README and sad/influence/NOTE.md (LRudL/sad at commit dfc5c9831a9bcc5c9a9dbdcaa2955aae983cd1d3,
# the last push, 2024-12-14); the README of the SAD task in inspect_evals (UKGovernmentBEIS/inspect_evals at
# commit 7c31cf22830c4657a3894e095b452c7d50f6f3b8, 2026-11-03); and the v2 PDF of "Probing and Steering
# Evaluation Awareness of Language Models" (arXiv 2507.01786, July 2025), which uses STAGES-OVERSIGHT. Every quote
# below is checked by the quote-substring validator against those Sources' committed extracts.
#
# The NeurIPS 2024 Datasets and Benchmarks camera-ready (proceedings.neurips.cc) could not be reached (connection
# timed out, 2026-11-08) and OpenReview answered with a challenge page, so the venue rests on the project site's
# citation. No SAD question or answer text is quoted, the canary string is not reproduced, and the zip password
# printed in the repository's unzip.sh is not recorded.

id: situational-awareness-dataset
name: Situational Awareness Dataset (SAD)
aliases:
  - SAD
  - 'Me, Myself, and AI: The Situational Awareness Dataset'
tagline: 16 tasks testing whether an LLM knows what it is, can tell evaluation from deployment, and
  acts on it.
description: >
  A benchmark of situational awareness in LLMs, which its authors define as a model's knowledge of
  itself and its circumstances: knowing which entity it is and its properties (self-knowledge), making
  inferences about its present situation, and acting on that knowledge. Its 16 tasks sit in seven
  categories. FACTS (4 tasks) asks factual questions about the model, distinguishing it from humans and
  from other LLMs; INFLUENCE (1) asks what the model can causally affect; INTROSPECT (3) asks it to count
  its own tokens, predict its own continuations and report rules it follows; STAGES (2) asks whether a
  text comes from pretraining, fine-tuning, evaluation or deployment, with STAGES-OVERSIGHT narrowed to
  evaluation against deployment; SELF-RECOGNITION (2) asks it to tell its own text from human text;
  ID-LEVERAGE (2) gives two conflicting instructions, one applying to an AI, and checks which it follows;
  ANTI-IMITATION (2) asks it to deviate from a pattern or place a set probability distribution over
  words, which imitating training data cannot do. The paper counts 13,198 questions; the site says over
  12,000. Answers are multiple choice or free form, scored by string matching, algorithmically, or (for
  ID-LEVERAGE) by GPT-3.5-turbo, with no partial credit and unparsable answers worth chance. The SAD
  score averages the seven categories equally, and is read against random chance (27.4%) and an upper
  baseline (90.7%) built from expert humans role-playing an LLM where that makes sense and 100%
  elsewhere. Several tasks have model-specific answers, so a new model needs facts and a tokenizer
  supplied; SAD-lite (13 tasks) and SAD-mini (5 multiple-choice tasks) avoid that. The question files
  are distributed in password-protected zips, users must not post question texts where they could be
  scraped, and 64 of the 320 INFLUENCE questions are kept private to detect memorisation.
self_description:
  source: src-arxiv-2407-04694-v1
  quote: A model M is situationally aware to the extent that (1) M knows which entity it is and
    knows facts about itself (self-knowledge)
external_ids:
  inspect_evals: sad
  arxiv: '2407.04694'
paper:
  title: 'Me, Myself, and AI: The Situational Awareness Dataset (SAD) for LLMs'
  arxiv: '2407.04694'
  version_read: v1
  source: src-arxiv-2407-04694-v1
released: 2024-07-05
released_note: The paper's only arXiv version, as its abstract page dates it; the repository was
  created the same day (GitHub API, read 2026-11-08).
released_source: src-arxiv-2407-04694
released_quote: Submitted on 5 Jul 2024
release_venue: NeurIPS 2024 Datasets and Benchmarks Track
release_venue_source: src-situational-awareness-dataset-site
release_venue_quote: Conference on Neural Information Processing Systems Datasets and Benchmarks
  Track}, year={2024}

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/evaluation-awareness
domain_basis:
  reason: The family's inclusion test names a frontier-risk property, and the paper measures
    situational awareness as a capability that introduces risks to safety and control, chiefly a
    model telling evaluation from deployment and behaving differently under oversight. STAGES, and
    STAGES-OVERSIGHT in particular, scores that detection, which is evaluation-awareness's
    definition; the leaf's sandbagging distinction says awareness is measurable without a behaviour
    change. It covers one category of seven, and no leaf fits the suite's broader self-knowledge
    (2026-11-08-situational-awareness-dataset-002).
  source: src-arxiv-2407-04694-v1
  quote: If a model is aware that it is being evaluated by human overseers, it may alter its
    behavior to optimize its performance on the evaluation metrics
domain_considered_and_rejected:
  - term: safety-alignment/sandbagging
    reason: No task scores a capability gap between observed and unobserved conditions; STAGES
      scores the detection itself, which the two leaves' distinction assigns to
      evaluation-awareness.
  - term: safety-alignment/deception-scheming
    reason: The paper motivates SAD by deceptive alignment, but no task scores the pursuit of a
      concealed goal or misleading the operator; it measures a prerequisite capability.
  - term: safety-alignment/dangerous-capability-evals
    reason: Situational awareness is not a capability dangerous in the wrong hands, which the leaf
      defines; it is a property of the model's relation to its own developers and overseers, and the
      paper cautions against reading a higher score as better or worse.
    source: src-arxiv-2407-04694-v1
    quote: we caution against naively maximizing performance on SAD
  - term: reasoning-general/theory-of-mind
    reason: The nearest leaf outside the family, but it concerns modelling other agents' minds, and
      SAD's subject is the model's knowledge of itself.
capability:
  - situational-awareness
  - instruction-following
capability_basis:
  situational-awareness:
    reason: STAGES-OVERSIGHT tests whether a model can tell that an input comes from an evaluation
      run on it rather than from deployment, which is the evaluation awareness the term's inclusion
      test names. The term excludes the plain-English reading of its slug, so it does not cover the
      other self-knowledge categories (2026-11-08-situational-awareness-dataset-001).
    source: src-arxiv-2407-04694-v1
    quote: STAGES-OVERSIGHT, which measures how well models can guess whether an input came from an
      evaluation or testing process being run on them (oversight) versus from the time when they
      were deployed (deployment).
  instruction-following:
    reason: ID-LEVERAGE and ANTI-IMITATION score whether the model obeys directions whose
      application depends on what it is (answer in a given language if an AI; deviate from a
      pattern; set an output distribution), checked independently of content quality, and the
      paper's own claim includes instruction following.
    source: src-arxiv-2407-04694-v1
    quote: Responses are either multiple-choice or free-form and are automatically evaluated either
      by string matching or by an LLM.
capability_considered_and_rejected:
  - term: knowledge-recall
    reason: FACTS asks factual questions, but about the model itself, and the paper reports SAD as
      only partly predicted by general knowledge (MMLU); world knowledge is not the construct.
  - term: calibration-uncertainty
    reason: No task elicits or scores a stated confidence; ANTI-IMITATION's probabilities are an
      instructed output distribution, not confidence in an answer.
  - term: context-integration
    reason: The term is the reading situational-awareness's exclusion test sends task-state
      awareness to, but SAD's inferences are about the model's development stage and authorship, not
      about integrating supplied context into an answer.
  - term: honesty
    reason: No task scores whether the model asserts what it believes; answers about itself are
      scored as correct or incorrect.

evaluation_method:
  - multiple-choice
  - exact-match
  - model-graded-judge
  - composite
evaluation_method_basis:
  reason: Nine tasks are multiple choice (chance 0.25 or 0.5). Free-form tasks are graded by string
    matching or algorithmically (FACTS-NAMES, INTROSPECT-COUNT-TOKENS and -PREDICT-WORDS, and
    ANTI-IMITATION against the model's own output distribution); the two ID-LEVERAGE tasks are
    graded by GPT-3.5-turbo, prompted to judge whether the response is in the instructed language.
    There is no partial credit, an unparsable answer is worth the random-chance rate, and the SAD
    score averages the seven categories, which mix these methods.
  source: src-arxiv-2407-04694-v1
  quote: is the equal-weighted average over the seven task categories shown in Figure 1
evaluation_method_considered_and_rejected:
  - term: constraint-check
    reason: ANTI-IMITATION checks an output distribution against an instructed one, but against a
      single criterion per item rather than a battery of conditions; it is recorded under
      exact-match and the note above.
  - term: human-expert-eval
    reason: Only the Long Monologue task was graded by the authors by hand, and it does not count
      towards the SAD score.
    source: src-arxiv-2407-04694-v1
    quote: the Long Monologue task does not count towards the overall SAD score
designed_for_subjects:
  - base-model
  - instruction-tuned-model
designed_for_subjects_basis:
  reason: The paper evaluates pretrained base models and their chat-finetuned counterparts side by
    side, with and without a situating system prompt, and compares the two kinds as a finding.
  source: src-arxiv-2407-04694-v1
  quote: We evaluate 16 LLMs on SAD, including both base (pretrained) and chat models.
designed_for_subjects_considered_and_rejected:
  - term: reasoning-model
    reason: The site's table later adds o1-preview and o1-mini, but the design varies no reasoning
      setting; the paper runs two chain-of-thought evaluations only as a demonstration.
  - term: model-in-benchmark-harness
    reason: Models are prompted directly through their APIs with no scaffold or tools; the harness
      only formats questions and parses answers.
  - term: hosted-inference-endpoint
    reason: Models are reached through provider APIs, but the subject is the model, and the paper
      excludes web chat products with hidden system prompts.
as_used:
  - protocol: inspect_evals' sad tasks run SAD-mini only (stages_full, stages_oversight, influence,
      facts_llms, facts_human_defaults), 2,904 multiple-choice questions, with plain, sp and
      sp_large system-prompt variants, an optional answer prefill, shuffled choices with a fixed
      seed, and the paper's invalid-answer rule. The private INFLUENCE questions are not available
      to it.
    split: SAD-mini
    source: src-github-inspect-evals-sad-readme
    quote: SAD-mini comprises 2,904 multiple-choice questions across 5 tasks.
    note: Its report compares Claude 3 Haiku and Claude 3 Opus runs made in December 2025 against
      the paper's numbers, task by task.
  - protocol: STAGES-OVERSIGHT used as data rather than as a score, to train and select linear
      probes of evaluation awareness in Llama-3.3-70B-Instruct, ranked by AUROC on it.
    split: STAGES-OVERSIGHT
    source: src-arxiv-2507-01786-v2
    quote: Using AUROC performance on SAD stages oversight as our selection criterion
    note: An ICML 2025 workshop paper (July 2025).

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced by others. inspect_evals' implementation reports runs
    made in December 2025 and was changed in September 2026, and a July 2025 paper builds
    evaluation- awareness probes on STAGES-OVERSIGHT. The maintainers' repository was last pushed on
    2024-12-14 (GitHub API), which is maintenance evidence, not use.
  source: src-github-inspect-evals-sad-readme
  quote: The results were collected in December 2025 and on the complete dataset for each task.
activity: no-submission-channel
activity_basis:
  reason: The site's table holds models the authors chose and ran; no source describes a route for
    entering a result, and the README invites only bug reports. Users run the evaluation locally and
    report in their own work.
  source: src-situational-awareness-dataset-site
  quote: 'Figure 2: An interactive plot of the results of SAD on LLMs we test.'

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: Claude 3 Opus (claude-3-opus-20240229)
    source: src-arxiv-2407-04694-v1
    observed_on: 2026-11-08
    quote: claude-3-sonnet 47.1 claude-3-opus 49.5 Random Chance 27.4 Upper Baseline 90.7
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Stored answers in the zipped task files, which for several tasks depend on
  the model under test (facts entered per model in model_names.yaml and a CSV for FACTS-WHICH-LLM,
  token counts from the model's tokenizer, and self-recognition texts sampled from the model at run
  time); ID-LEVERAGE's verdicts come from GPT-3.5-turbo. The labels are released, not withheld.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: The code, the zipped questions with their answers and the paper's raw results are in the
    repository, and the whole run is local. Exact reproduction is limited by retired or unreleased
    models (gpt-4-base), sampling at temperature 1 and non-deterministic APIs, and the 64 private
    INFLUENCE questions are not available.
  source: src-github-sad-readme
  quote: Results for the models included in the paper are stored in the repository.

task:
  exists: true
  input:
    - a question about the model itself, its influence, its own tokens or outputs, a text whose
      development stage or authorship it must infer, or a pair of conflicting instructions one of
      which applies to it, with or without a situating system prompt telling it that it is an LLM
  output: A letter choice for multiple-choice tasks; a free-form answer, a continuation, or a
    response in an instructed language for the others.
  scoring: Each task is percent correct with no partial credit, an unparsable answer counting as the
    random-chance rate. A category is the equal-weighted mean of its tasks, and the SAD score the
    equal-weighted mean of the seven categories, reported against random chance (27.4%) and the
    upper baseline (90.7%). SAD-lite and SAD-mini are reported beside it.
  source: src-arxiv-2407-04694-v1
  quote: Responses are graded as correct or incorrect with no partial credit.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_note: Withheld by design, for step 2. (1) 64 of the 320 INFLUENCE questions are a private
    test set kept to detect memorisation; the released runs store 256 sample results, the
    maintainers' table scores 19 of its 21 models on all 320 (the o1 rows on 256), and a fresh run
    uses the 256 public ones. (2) The paper's task tables mark INFLUENCE and both STAGES tasks "80%
    released" without saying what the remaining 20% of STAGES is; the repository and inspect_evals
    carry all 800 STAGES-FULL and 400 STAGES-OVERSIGHT questions the paper counts, so what is held
    back there is unclear (review_checks). (3) The question files ship as password-protected zips,
    with the password in the repository's unzip.sh, and the README requires users never to put
    question or answer text anywhere scrapable; the paper and the README carry the BIG-bench-style
    canary string. Public are the paper, the code, the zipped questions and answers, and the raw
    results of the paper's runs.
  access_basis:
    reason: The questions and answers behind a fresh SAD score download with the repository. The zip
      password is printed in the repository and the no-plaintext rule is a request, which the term's
      inclusion test counts as anti-contamination devices rather than gates. The private INFLUENCE
      set is a memorisation check that a new run's score is computed without, as the maintainers'
      own o1 rows are; the review checks record the reading under which it makes this
      private-test-server.
    source: src-github-sad-influence-note
    quote: We have retained a private test set of 64 questions for Influence, to hopefully detect
      memorisation if (despite our precautions) SAD benchmark data ends up in training data.
  refresh: static
  refresh_note: One release with the paper. The repository's later commits (to 2024-12-14) add
    results for newer models (GPT-4o, Claude 3.5 Sonnet, Llama 3 70B, o1) and plotting; no source
    describes a change to the questions. The site's "over 12,000 questions" against the paper's
    13,198 is not explained (review_checks).
  refresh_source: src-github-sad-influence-note
  refresh_quote: you will get new runs only on the 256 public questions
  data_provenance:
    - expert-authored
    - model-generated
    - web-scraped
    - synthetic-procedural
  data_provenance_note: The authors wrote most questions, some with LLM drafts they edited heavily
    (INFLUENCE, ID-LEVERAGE); two FACTS tasks adapt human-written sets from Anthropic's
    model-written evals (Perez et al., 2022); STAGES and SELF-RECOGNITION quote texts from existing
    datasets and scraped corpora (The Pile v2, FLAN, BIG-bench, WMDP, WildChat, arXiv abstracts,
    Wikipedia); INTROSPECT and ANTI-IMITATION are generated algorithmically.
  data_provenance_source: src-arxiv-2407-04694-v1
  data_provenance_quote: Of the 7 task categories, six are entirely new and created by the authors
    (with assistance from LLMs), and one contains some questions adapted from related work (Perez et
    al., 2022).
  contamination_risk: medium
  contamination_risk_note: The authors zip the files, use a canary string, forbid plaintext copies
    and hold back 64 INFLUENCE questions, and argue that model-specific answers leave no single
    question-answer pair to leak. But the full set has been downloadable since July 2024 with its
    password in the repository, the paper prints example questions, and third-party ports unpack the
    data (inspect_evals' README prints a STAGES-FULL item in plain text). No source reports
    contamination or a check of the private set.
  contamination_risk_source: src-arxiv-2407-04694-v1
  contamination_risk_quote: A distinct worry is that SAD may become less meaningful after
    publication because of leakage
  contamination_evidence: []
  ceiling_anchor_type: expert-average
  ceiling_anchor_type_basis:
    reason: For FACTS-HUMAN-DEFAULTS, INFLUENCE, STAGES and SELF-RECOGNITION the upper baseline is
      the measured score of humans with expertise in LLMs answering as an LLM should; for tasks only
      an LLM can do (token counting, output distributions) it is 100%, argued achievable. The
      composite is 90.7%, so the anchor mixes expert-average with theoretical-maximum by category.
    source: src-arxiv-2407-04694-v1
    quote: we use a human roleplay baseline, in which humans (with expertise in LLMs) answer what
      they think the right answer for an LLM would be
  dataset_licence: CC-BY-4.0
  dataset_licence_note: GitHub's licence metadata for LRudL/sad (LICENSE.txt, CC BY 4.0), read
    2026-11-08; not a quoted Source. The self-recognition text corpus carries its own LICENSE.md
    (Wikipedia under CC BY-SA 4.0, arXiv abstracts under their own licences), and the FACTS sets
    adapted from Perez et al. are under a Creative Commons licence the paper does not name.
  size:
    - count: 13198
      unit: questions
      subset: the paper's 16 tasks
      source: src-arxiv-2407-04694-v1
      quote: we introduce 7 categories of tasks containing a total of 13,198 questions
    - count: 16
      unit: tasks in 7 categories (14 entirely new)
      source: src-arxiv-2407-04694-v1
      quote: SAD contains 16 tasks (14 of which are entirely new) and over 13,000 questions.
    - count: 2904
      unit: multiple-choice questions
      subset: SAD-mini as implemented in inspect_evals (255 INFLUENCE questions)
      source: src-github-inspect-evals-sad-readme
      quote: SAD-mini comprises 2,904 multiple-choice questions across 5 tasks.
    - count: 64
      unit: INFLUENCE questions held back as a private test set
      subset: INFLUENCE
      source: src-github-sad-influence-note
      quote: We have retained a private test set of 64 questions for Influence, to hopefully detect
        memorisation if (despite our precautions) SAD benchmark data ends up in training data.
  size_note: The site says over 12,000 questions, and its results CSV counts about 12,790 trials per
    full run; inspect_evals drops one broken INFLUENCE item, so its SAD-mini has 255 of the 256
    public ones.
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The SAD authors, through the first author's GitHub account (LRudL/sad) and
    situational-awareness-dataset.org
  maintainer_basis:
    reason: The code, data and results sit in one person's GitHub account and the site is a GitHub
      Pages site; the nine authors list affiliations (independent, Constellation, MIT, Apollo
      Research), and no organisation is stated as holding the benchmark.
    source: src-github-sad-readme
    quote: git clone https://github.com/LRudL/sad.git
  maintainer_type: individual
  maintainer_type_note: The term's inclusion test reads the host, not the author list. Four of the
    nine authors list Apollo Research, which is not stated as holding the benchmark.
  submission_process:
    - maintainer-run
  submission_process_note: The authors run the models in their table and publish it on the site,
    with a results CSV; after the paper they added GPT-4o, Claude 3.5 Sonnet, Llama 3 70B chat,
    o1-preview and o1-mini. Others run SAD themselves and report in their own work.
  submission_process_source: src-situational-awareness-dataset-results-csv
  submission_process_quote: SAD,o1-preview-2024-09-12,Plain Prompt,0.5992001278332023
  independence_flags:
    - flag: funded-by-evaluated-party
      source: src-arxiv-2407-04694-v1
      quote: We acknowledge compute credits from Anthropic.
    - flag: grader-from-evaluated-party
      source: src-arxiv-2407-04694-v1
      quote: To score the model response, we prompt GPT-3.5-turbo with the following
  independence_flags_note: The paper acknowledges compute credits from Anthropic, and compute
    credits and access to GPT-4-base from OpenAI's Researcher Access program; Claude, GPT-3.5 and
    GPT-4 models are all ranked. ID-LEVERAGE is graded by GPT-3.5-turbo, an OpenAI model, and
    gpt-3.5-turbo-0613 is among the evaluated models. The other funder named is Open Philanthropy,
    which made no evaluated model.
  independence_assessed: true

# --- Execution -------------------------------------------------------------------------------

execution:
  compute_tier: api-credits-only
  compute_tier_basis:
    reason: The paper's closed models were run through the OpenAI and Anthropic APIs and Llama 2
      through Replicate, and grading uses GPT-3.5-turbo; a full run is inference spend over about
      13,000 questions per variant, which the README says takes days under API rate limits.
    source: src-arxiv-2407-04694-v1
    quote: We evaluate closed models from OpenAI and Anthropic via their respective APIs
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The pipeline runs locally from released questions and answers, with string-matching,
      algorithmic and model-judge grading and no human grader. A new model needs its facts and a
      tokenizer supplied before 5 of the 16 tasks can run, a configuration step SAD-lite avoids
      (review_checks).
    source: src-github-sad-readme
    quote: The whole evaluation process is local, so you can safely evaluate private models.
  harness_availability: official-harness
  harness: The sad CLI in LRudL/sad (sad run, sad results, sad plot), built on the authors'
    Evalugator library; unzip.sh unpacks the task files.
  harness_source: src-github-sad-readme
  harness_quote: sad run --tasks influence --models claude-3-haiku-20240307 --variants plain
  code_licence: CC-BY-4.0
  code_licence_note: GitHub's licence metadata for LRudL/sad, whose one LICENSE.txt covers code and
    data, read 2026-11-08; not a quoted Source.
  runnable_via:
    - custom
    - inspect
  inspect_evals_id: sad
  inspect_evals_id_note: inspect_evals implements SAD-mini only, as five tasks (sad_stages_full,
    sad_stages_oversight, sad_influence, sad_facts_llms, sad_facts_human_defaults), loading the data
    from LRudL/sad pinned at commit dfc5c98. It computes no overall SAD score and none of the other
    11 tasks.
  inspect_evals_id_source: src-github-inspect-evals-sad-readme
  inspect_evals_id_quote: uv run inspect eval inspect_evals/sad_stages_oversight --model
    openai/gpt-5-nano
  maintainer_rerun_policy: unstated

comparability:
  # Profiles llm-static-text (multiple-choice and exact-match) and model-graded (ID-LEVERAGE's GPT-3.5-turbo
  # judge) apply. Beyond them: the system-prompt variant (plain, situating prompt, large situating prompt), which
  # moves scores by several points and is carried by prompt_template_hash; and the harness (the authors' CLI or
  # inspect_evals' SAD-mini, which differ in answer prefill and choice shuffling). subset_used carries SAD,
  # SAD-lite or SAD-mini and, for INFLUENCE, 320 or 256 questions.
  material_extra:
    - prompt_template_hash
    - harness
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The SAD score is the equal-weighted mean of the seven category scores, each the mean of
    its tasks, so tasks are weighted unequally; SAD-lite and SAD-mini are official alternatives.
  source: src-arxiv-2407-04694-v1
  quote: is the equal-weighted average over the seven task categories shown in Figure 1

homepage: https://situational-awareness-dataset.org/
repository: https://github.com/LRudL/sad

versions:
  - version: 2024-07
    label: SAD as released with arXiv 2407.04694v1
    version_kind: revision
    released: 2024-07-05
    changes: The 16 tasks and the paper's 16 models. Later commits (to 2024-12-14) and the NeurIPS
      camera-ready add results for newer models; no source reports a change to the questions.
    frozen: true
    sources:
      - src-arxiv-2407-04694
      - src-arxiv-2407-04694-v1
      - src-github-sad-readme

subsets:
  - id: situational-awareness-dataset#facts
    label: FACTS
    scored_separately: true
    notes: Self-knowledge of which entity the model is and its properties. Four tasks
      (FACTS-HUMAN-DEFAULTS 1,200, FACTS-LLMS 249, FACTS-WHICH-LLM 159, FACTS-NAMES 50); the last
      two need facts for each new model.
  - id: situational-awareness-dataset#influence
    label: INFLUENCE
    items: 320
    scored_separately: true
    evidence:
      - source: src-github-sad-influence-note
        quote: We have retained a private test set of 64 questions for Influence, to hopefully
          detect memorisation if (despite our precautions) SAD benchmark data ends up in training
          data.
    notes: What the model can causally influence, one multiple-choice task; 256 questions are
      public.
  - id: situational-awareness-dataset#introspect
    label: INTROSPECT
    scored_separately: true
    notes: Three algorithmic tasks (INTROSPECT-COUNT-TOKENS 1,500, -PREDICT-WORDS 900, -RULES 4,000)
      on information the model can only get about itself; counting tokens needs the model's
      tokenizer.
  - id: situational-awareness-dataset#stages
    label: STAGES
    items: 1200
    scored_separately: true
    evidence:
      - source: src-arxiv-2407-04694-v1
        quote: STAGES contains 2 tasks assessing how well models can determine whether a text input
          comes from pretraining, finetuning, evaluation, or deployment stages.
      - source: src-arxiv-2407-04694-v1
        quote: The text inputs are taken from real datasets, intended to mimic the stages of
          training as closely as possible.
    notes: STAGES-FULL (800, four stages, chance 0.25) and STAGES-OVERSIGHT (400, evaluation against
      deployment, chance 0.5). The category that carries the entry's primary leaf.
  - id: situational-awareness-dataset#stages-oversight
    label: STAGES-OVERSIGHT
    parent: situational-awareness-dataset#stages
    items: 400
    scored_separately: true
    evidence:
      - source: src-arxiv-2407-04694-v1
        quote: STAGES-OVERSIGHT, which measures how well models can guess whether an input came from
          an evaluation or testing process being run on them (oversight) versus from the time when
          they were deployed (deployment).
    notes: The one task that isolates evaluation awareness; others use it on its own (as_used).
  - id: situational-awareness-dataset#self-recognition
    label: SELF-RECOGNITION
    scored_separately: true
    notes: Two tasks (SELF-RECOGNITION-WHO and -GROUPS, 800 and 1,000 in the paper's tables) telling
      the model's own text from human text on the same content; the model's texts are sampled at run
      time.
  - id: situational-awareness-dataset#id-leverage
    label: ID-LEVERAGE
    scored_separately: true
    notes: Two free-form tasks (ID-LEVERAGE-ENTITY-NAME 600, -MULTIHOP 708) in which the model must
      follow the one of two conflicting instructions that applies to it; graded by GPT-3.5-turbo.
  - id: situational-awareness-dataset#anti-imitation
    label: ANTI-IMITATION
    scored_separately: true
    notes: Two tasks (OUTPUT-CONTROL 200, DO-NOT-IMITATE 112) the model can pass only by controlling
      its own output distribution rather than imitating training data; log probabilities are
      estimated by resampling where an API does not give them.
subsets_note: >
  The seven categories are scored separately and averaged equally into the SAD score; their 16 tasks
  are listed in the notes with the paper's question counts (Table 2, which is not quoted because its
  page carries the canary string). Only STAGES-OVERSIGHT is broken out as a subset of its own, as the
  task the primary leaf rests on. The situating-prompt variants are run conditions, not subsets, and
  the Long Monologue task is an optional extra outside the score.
subsets_source: src-arxiv-2407-04694-v1
subsets_quote: we introduce 7 categories of tasks containing a total of 13,198 questions


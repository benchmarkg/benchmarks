    e-mail addresses) and its results CSV; the repository README and sad/influence/NOTE.md at commit
    dfc5c98; inspect_evals' SAD README at commit 7c31cf2; and the probing paper's v2 PDF (a DOI) as
    evidence of use in 2025. The repository tree, its LICENSE.txt, task config files and

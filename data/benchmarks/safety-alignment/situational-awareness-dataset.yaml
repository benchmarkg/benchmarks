      quote: you will get new runs only on the 256 public questions
    - check: The paper's task tables mark both STAGES tasks "80% Released", but the repository and
        inspect_evals carry the 800 and 400 questions the paper counts, and no source says what the
        remaining 20% is. Whether a further held-out STAGES pool exists, and its size, needs the
        authors.
      field: data.access_note
      source: src-arxiv-2407-04694-v1
      quote: WildChat (Zhao et al., 2024) 80% Released Human Roleplay 2 Situational inferences
    - check: Domain primary evaluation-awareness covers STAGES (one category of seven, two tasks of
        16); the rest of SAD is self-knowledge with no leaf. Logged as missing terms on
        domain.primary (002) and capability (001). If a reviewer prefers, the entry could wait for a
        situational-awareness leaf.
      field: domain
    - check: Question counts disagree. The paper says 13,198 questions (and over 13,000), the site
        and inspect_evals over 12,000, and the results CSV about 12,790 trials per full run. The
        NeurIPS camera-ready, which could not be reached, may hold the later figure.
      field: data.size
      source: src-situational-awareness-dataset-site
      quote: The benchmark comprises 7 task categories, 16 tasks, and over 12,000 questions.
    - check: Version read. arXiv has only v1 (16 models, Claude 3 Opus best); the site reports
        Claude 3.5 Sonnet best among chat models and o1-preview top of the CSV. The NeurIPS 2024

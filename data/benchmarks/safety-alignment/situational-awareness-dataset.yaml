  confidence: medium
  review_checks:
    - check: data.access fully-open rests on reading the 64 private INFLUENCE questions as a
        memorisation check. Under the vocabulary's mixed-headline clause the maintainers' table,
        which scores 19 of 21 models on all 320 INFLUENCE questions, is a headline outsiders cannot
        reproduce, which would make access private-test-server, the tier not-independently-
        reproducible and add the private-test-set blocker. A fresh run, and the maintainers' own o1

# data/benchmarks/safety-alignment/ethics.yaml
#
# P1-S9-T04, safety-alignment entry 17. Filled from the ETHICS paper, arXiv 2008.02275 read as its v6 PDF
# (2023-02-17, the ICLR 2021 version), and its abstract page; the repository README at master (hendrycks/ethics);
# Hugging Face's API record of the hendrycks/ethics dataset (the API only, not the page); the README and the
# commonsense task file of lm-evaluation-harness's hendrycks_ethics group; the v1 PDF of Unsupervised Elicitation of
# Moral Values from Language Models (arXiv 2601.17728, January 2026); and the abstract page of Agreement Is Not
# Alignment (arXiv 2608.12368, July 2026). Every quote below is checked by the quote-substring validator against
# those Sources' committed extracts.
#
# The repository's licence, creation, commit and push dates come from the GitHub API and are not quoted Sources.
# The paper's v1 PDF was opened only to compare its tables with v6 and is not cited. inspect_evals has no ETHICS
# task (its src/inspect_evals listing, read 2026-11-08 through the GitHub API, holds none).

id: ethics
name: ETHICS
tagline: 130,000+ scenarios in five moral-judgement tasks, scored by accuracy on Test and
  adversarially filtered Hard Test sets.
description: >
  A benchmark of whether a language model can predict widespread human moral judgements about
  everyday scenarios, released with the ICLR 2021 paper Aligning AI With Shared Human Values (UC
  Berkeley, Columbia, UChicago and Microsoft authors). It has five tasks, one per normative
  perspective. Justice asks whether an explanation is a reasonable basis for unequal treatment
  (impartiality) or whether a claim of desert is reasonable; Deontology whether an exemption from a
  request, or a responsibility implied by a role, is reasonable; Virtue whether a character trait is
  exemplified by a scenario; Utilitarianism which of two scenarios is more pleasant for the person
  in it, scored as a pairwise ordering; and Commonsense Morality whether the first-person character
  clearly should not have done what they did, in short scenarios written on Mechanical Turk and long
  ones taken from a Reddit forum. Scenarios were written by crowdworkers from the United States,
  Canada and Great Britain, relabelled by others and kept only on strong agreement, with contrast
  sets of minimally edited pairs. Each task has a Development set for fine-tuning, a Test set and a
  Hard Test set built by adversarial filtration against a distilled-model ensemble. The metric is
  0/1 accuracy, counted per group of related examples for Justice, Deontology and Virtue, so that
  their random baselines are 6.3% and 8.2%, and the paper reports the average over the five tasks. A
  further set of about 1,000 contentious long scenarios, without labels, tests whether models detect
  moral disagreement, scored by AUROC.
self_description:
  source: src-arxiv-2008-02275-v6
  quote: We introduce the ETHICS dataset, a new benchmark that spans concepts in justice,
    well-being, duties, virtues, and commonsense morality.
external_ids:
  huggingface: hendrycks/ethics
  arxiv: '2008.02275'
paper:
  title: Aligning AI With Shared Human Values
  arxiv: '2008.02275'
  doi: 10.48550/arXiv.2008.02275
  version_read: v6
  source: src-arxiv-2008-02275-v6
released: 2020-08-05
released_note: The paper's first arXiv version, as its abstract page dates it. The repository was
  created the next day (GitHub API, read 2026-11-08). The paper was revised five times, to v6 on
  2023-02-17; the dataset itself was not reissued.
released_source: src-arxiv-2008-02275
released_quote: Submitted on 5 Aug 2020 (v1), last revised 17 Feb 2023 (this version, v6)
release_venue: ICLR 2021
release_venue_source: src-arxiv-2008-02275
release_venue_quote: 'Comments: ICLR 2021; the ETHICS dataset is available at this https URL'

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: safety-alignment/value-alignment
domain_basis:
  reason: The scored quantity is agreement between a system's moral judgements and the consensus
    labels of human annotators, across five named normative theories, which is the leaf's matching
    of expressed values or choices against a stated normative standard. The paper frames the
    benchmark as a step toward AI aligned with human values.
  source: src-arxiv-2008-02275-v6
  quote: it provides a steppingstone toward AI that is aligned with human values
domain_considered_and_rejected:
  - term: reasoning-general/commonsense
    reason: Commonsense Morality is one of the five tasks, but the paper separates it from
      commonsense prediction, which asks what is (descriptive knowledge), while ETHICS asks what
      should be (normative knowledge). The family's inclusion test wants the reasoning form itself
      as the object of study.
  - term: society-econ-law/legal-reasoning
    reason: The paper's discussion links desert and reasonableness to law, but no item applies legal
      rules to facts; the labels are everyday moral judgements, not legal conclusions.
  - term: society-econ-law/policy-analysis
    reason: No item analyses policy options or regulation; scenarios are interpersonal and everyday,
      and divisive topics were avoided by design.
  - term: safety-alignment/bias-fairness
    reason: The Justice task's impartiality half relates to fairness, but no score compares a
      system's behaviour across demographic groups; it scores whether a stated reason for unequal
      treatment is reasonable.
  - term: language/understanding
    reason: Items are text classification over scenarios, but the claim is about moral judgement, a
      subject measured elsewhere, which the language family's exclusion test sends to that family.
capability:
  - knowledge-recall
capability_basis:
  knowledge-recall:
    reason: The scenario supplies the facts, but not the norm that decides the label. The paper says
      the benchmark assesses knowledge of ethics and human values, which a system must bring with it
      (or acquire from the Development set); no passage or tool supplies the judgement.
    source: src-arxiv-2008-02275-v6
    quote: we propose the ETHICS dataset to assess basic knowledge of ethics and common human values
capability_considered_and_rejected:
  - term: context-integration
    reason: The paper assumes all prediction-relevant information is in the scenario text, but the
      scenario is the thing judged, not a source holding the answer; the term's discriminant is
      whether the protocol supplies the source of the answer.
  - term: harm-avoidance
    reason: Harm is described and judged, not elicited. The system labels scenarios; nothing scores
      whether it declines to produce a harmful output or action, which the term's exclusion test
      rules out.
  - term: adversarial-robustness
    reason: The Hard Test set is chosen by adversarial filtration, but against spurious cues found
      by a fixed distilled-model ensemble, not by an attacker targeting the entrant.
  - term: calibration-uncertainty
    reason: Only the side set of about 1,000 contentious scenarios scores predictive uncertainty
      (AUROC for detecting disagreement); the headline tasks score labels, not confidences.

evaluation_method:
  - multiple-choice
evaluation_method_basis:
  reason: Every scored decision is a choice from a fixed label set (reasonable or unreasonable,
    exemplified or not, wrong or not wrong, or which of two scenarios is more pleasant), with 0/1
    loss and stated random baselines (50% for Utilitarianism and Commonsense, 6.3% and 8.2% for the
    grouped tasks). For Justice, Deontology and Virtue a group of related examples counts as correct
    only when all of them are.
  source: src-arxiv-2008-02275-v6
  quote: For all tasks we use the 0/1-loss as our scoring metric.
evaluation_method_considered_and_rejected:
  - term: exact-match
    reason: No free-form answer is matched; the system picks from a supplied two-way label set, and
      the random baseline is what the paper reports beside each score.
  - term: classification-metric
    reason: The headline is plain accuracy, a mean of per-item (or per-group) verdicts, which the
      term's exclusion test sends to multiple-choice or exact-match. The AUROC belongs to the
      disagreement-detection side set only.
designed_for_subjects:
  - task-specific-supervised-model
  - base-model
designed_for_subjects_basis:
  reason: The paper fine-tunes BERT-base, BERT-large, RoBERTa-large and ALBERT-xxlarge on each
    task's Development set and scores them as trained; GPT-3 is the one model prompted, few-shot by
    raw continuation (32 labelled examples per prompt for most tasks), with no instruction tuning.
  source: src-arxiv-2008-02275-v6
  quote: Unlike the other models, we evaluate GPT-3 in a few-shot setting rather than the typical
designed_for_subjects_considered_and_rejected:
  - term: instruction-tuned-model
    reason: No model in the paper is instruction-tuned. Chat models are what current users run on
      ETHICS, which observed_subjects records.
observed_subjects:
  values:
    - base-model
    - instruction-tuned-model
  basis: A January 2026 paper scores pretrained (base) and chat variants of Llama-3.1 (8B and 70B),
    Mistral-7B-V0.3 and OLMo2 on a sample of ETHICS, zero-shot, many-shot and with self-labelling; a
    July 2026 paper runs frontier and open model families on 500 ETHICS-derived items.
  source: src-arxiv-2601-17728-v1
as_used:
  - protocol: A random sample of 2,024 ETHICS data points, with the original tasks recast as
      classification tasks, scored by accuracy for base and chat models under zero-shot and
      many-shot prompting and unsupervised self-labelling (ICM), per task and overall.
    split: a 2,024-item random sample; which of Test and Hard Test it is drawn from was not found
    source: src-arxiv-2601-17728-v1
    quote: We unify the original tasks into classification tasks.
    note: Reports Commonsense as the easiest task for ICM (for example 67% to 96% for
      Mistral-7B-V03) and Utilitarianism as the hardest. No grouped exact-match scoring is
      described.
  - protocol: lm-evaluation-harness's hendrycks_ethics group, five tasks (ethics_cm,
      ethics_deontology, ethics_justice, ethics_utilitarianism, ethics_virtue), prompted as multiple
      choice by log-likelihood and scored by per-example accuracy (acc), not the paper's grouped
      accuracy, from the EleutherAI/hendrycks_ethics copy of the data.
    split: test
    source: src-github-lm-eval-ethics-commonsense-yaml
    quote: 'metric: acc'
    note: The commonsense task prompts with the scenario followed by the question "Is this wrong?",
      with choices no and yes. Which file the copy's test split loads (Test or Hard Test) is set by
      its loading script, which is not a cited Source.

lifecycle: active
lifecycle_basis:
  reason: Results are still being produced in 2026 by others, in a January 2026 paper on base and
    chat models and a July 2026 paper on frontier models (ETHICS-derived items), so the inclusion
    test for active is met. mature was considered and rejected; its exclusion test sends a benchmark
    whose results are still produced in the ordinary way to active. The maintainers' own activity (a
    README last changed in January 2021, a last commit in February 2023, GitHub API) is maintenance
    evidence, not use.
  source: src-arxiv-2601-17728-v1
  quote: Results show that ICM outperforms all pretrained and chatbot baselines on the Norm Bank and
    ETHICS benchmarks
activity: accepting-submissions
activity_note: The README's leaderboard invites entries by contacting the authors or by pull
  request. Its rows are the paper's own results, unchanged since the README's last edit on
  2021-01-13 (GitHub API), and no outside entry has been added, so whether the route is still
  answered is not known.
activity_basis:
  reason: A route for entering results exists on a leaderboard that has never run in rounds, and the
    repository is not archived.
  source: src-github-ethics-readme
  quote: If you want to have your model added to the leaderboard, please reach out to us or submit a
    pull request.

# --- Admissibility (04 S5; 00 S6 A5) ---------------------------------------------------------

learned_entrant_evidence:
  - system: RoBERTa-large fine-tuned on the ETHICS Development sets
    source: src-arxiv-2008-02275-v6
    observed_on: 2026-11-08
    quote: pretraining the BERT-large architecture on more tokens gives rise to RoBERTa-large which
      has higher performance
evaluation_target: learned-system
execution_mode: automated
ground_truth_source: held-out-labels
ground_truth_source_note: Each label is the judgement of the crowdworkers who wrote the scenario,
  kept only where separate workers agreed on relabelling (at least 4 of 5 for Justice, Deontology
  and Commonsense, all 3 for each Virtue trait, a majority of 7 for each Utilitarianism ranking), or
  for long Commonsense scenarios the Reddit verdict with at least 95% of at least 100 votes. The
  labels are released with the data.
reproducible_by_third_party: true
reproducible_by_third_party_basis:
  reason: Every split, labels included, is public without a gate, and scoring needs only each
    system's labels and the released grouping.
  source: src-hf-api-hendrycks-ethics
  quote: '"lastModified":"2023-04-19T18:55:00.000Z","private":false,"gated":false'
task:
  exists: true
  input:
    - a short scenario, or for long Commonsense items a multi-paragraph post, and for Justice,
      Deontology and Virtue a candidate explanation, exemption, responsibility or trait to judge
    - for Utilitarianism, two scenarios to order by pleasantness
  output: A binary label (reasonable or unreasonable, exemplified or not, wrong or not wrong), or
    for Utilitarianism a scalar per scenario whose ordering is compared.
  scoring: 0/1 accuracy per task on the Test and Hard Test sets. Commonsense is per-example
    classification accuracy; Utilitarianism is the accuracy of ordering pairs; Justice, Deontology
    and Virtue count a group of related examples correct only when all are. The paper averages the
    five tasks.
  source: src-arxiv-2008-02275-v6
  quote: For Justice, Deontology, and Virtue Ethics, which consist of groups of related examples, a
    model is accurate when it

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open
  access_basis:
    reason: The dataset is a tar file linked from the README, and the maintainers' Hugging Face copy
      is public and ungated, with every split and its labels.
    source: src-github-ethics-readme
    quote: The dataset is available here.](https://people.eecs.berkeley.edu/~hendrycks/ethics.tar)
  refresh: static
  refresh_basis:
    reason: One release in 2020. The datasheet calls the data fixed and plans no update, and no
      erratum or revision is announced; the repository's later commits change the fine-tuning
      scripts only (GitHub API commit list, read 2026-11-08).
    source: src-arxiv-2008-02275-v6
    quote: We do not have plans to update the dataset at this time.
  data_provenance:
    - crowd-authored
    - web-scraped
  data_provenance_note: Short scenarios, explanations, traits and rankings were written by
    Mechanical Turk workers who passed a qualification test, with no specialist knowledge of ethics
    asked of them; the long Commonsense scenarios (about 11,000) are posts from a Reddit forum where
    users vote on whether the poster was in the wrong, collected with the Reddit API.
  data_provenance_source: src-arxiv-2008-02275-v6
  data_provenance_quote: The short scenarios come from MTurk, while the long scenarios are curated
    from Reddit with multiple
  contamination_risk: medium
  contamination_risk_note: Every split, test labels included, has been public since 2020, on the
    Berkeley site and since 2023 on Hugging Face, and the long Commonsense items are public Reddit
    posts. A route is plausible and one is documented downstream, since the Commonsense Norm Bank
    (used to train Delphi) reformatted ETHICS Commonsense items into its corpus; no source read
    shows an evaluated model trained on ETHICS test items.
  contamination_risk_source: src-arxiv-2601-17728-v1
  contamination_risk_quote: Ethics Commonsense Morality (ETHICS) [18]
  contamination_evidence: []
  ceiling_anchor_type: theoretical-maximum
  ceiling_anchor_type_basis:
    reason: The headline is accuracy, bounded at 100%, and the paper reads results against an
      unmeasured performance ceiling. No human baseline is measured on the tasks; the one human
      figure, 93.9% agreement of Indian annotators with the Commonsense Test labels, estimates
      cross-cultural disagreement, not a ceiling.
    source: src-arxiv-2008-02275-v6
    quote: Models are starting to show traction, but they are still well below the performance
      ceiling, indicating that ETHICS is challenging.
  dataset_licence: MIT
  dataset_licence_note: The maintainers' Hugging Face card tags the dataset MIT, and GitHub reports
    MIT for the repository (licence metadata, read 2026-11-08). The paper's datasheet answers No to
    whether the dataset is distributed under a licence or terms of use, and the tar file on the
    Berkeley site carries no stated licence.
  dataset_licence_source: src-hf-api-hendrycks-ethics
  dataset_licence_quote: '"cardData":{"license":"mit"'
  size:
    - count: 134420
      unit: scenarios across the Development, Test and Hard Test sets of the five tasks (the paper
        says more than 130,000)
      source: src-arxiv-2008-02275-v6
      quote: Split Justice Virtue Deontology Utilitarianism Commonsense Dev 21791 28245 18164 13738
        13910 Test 2704 4975 3596 4808 3885 Hard Test 2052 4780 3536 4272 3964
    - count: 19968
      unit: scenarios
      subset: Test (Justice 2,704, Virtue 4,975, Deontology 3,596, Utilitarianism 4,808, Commonsense
        3,885)
      source: src-arxiv-2008-02275-v6
      quote: Test 2704 4975 3596 4808 3885
    - count: 18604
      unit: scenarios
      subset: Hard Test (Justice 2,052, Virtue 4,780, Deontology 3,536, Utilitarianism 4,272,
        Commonsense 3,964)
      source: src-arxiv-2008-02275-v6
      quote: Hard Test 2052 4780 3536 4272 3964
    - count: 95848
      unit: scenarios
      subset: Development (the training split)
      source: src-arxiv-2008-02275-v6
      quote: Dev 21791 28245 18164 13738 13910
  languages:
    - English

# --- Governance ------------------------------------------------------------------------------

governance:
  maintainer: The ETHICS authors (repository and Hugging Face dataset in the first author's personal
    hendrycks namespace)
  maintainer_basis:
    reason: The repository sits at hendrycks/ethics and the Hugging Face dataset at
      hendrycks/ethics, both personal accounts, and no institution is stated as holding them.
    source: src-hf-api-hendrycks-ethics
    quote: '"id":"hendrycks/ethics"'
  maintainer_type: individual
  submission_process:
    - self-reported
  submission_process_note: The README invites entrants to contact the authors or open a pull request
    to be added to its leaderboard; no source says submitted numbers are checked or re-run. Every
    row now on it is from the paper, so in practice results appear in others' papers.
  submission_process_source: src-github-ethics-readme
  submission_process_quote: If you want to have your model added to the leaderboard, please reach
    out to us or submit a pull request.
  independence_flags: []
  independence_flags_note: Not assessed. The paper acknowledges the Long-Term Future Fund (funding
    the dataset), an Open Philanthropy Project fellowship, the NSF GRFP and an NSF Frontier Award,
    and one author lists a Microsoft affiliation; the evaluated models are BERT, RoBERTa, ALBERT,
    GPT-3 and a GloVe baseline. Whether any affiliation or funder relates to an evaluated model's
    maker was not established from the sources read.
  independence_assessed: false

# --- Execution -------------------------------------------------------------------------------

execution:
  reproducibility_tier: fully-automatable
  reproducibility_tier_basis:
    reason: The data and labels are public and every score is computed mechanically from predicted
      labels or orderings, with no human step.
    source: src-arxiv-2008-02275-v6
    quote: For all tasks we use the 0/1-loss as our scoring metric.
  harness_availability: reference-implementation-only
  harness: The repository's per-task fine-tuning scripts and an interactive probe script, with
    weights for a commonsense and a utilitarianism model; lm-evaluation-harness implements five
    tasks independently.
  harness_source: src-github-ethics-readme
  harness_quote: In this repository, folders contain fine-tuning scripts for individual tasks of the
    ETHICS benchmark.
  code_licence: MIT
  code_licence_note: GitHub's licence metadata for hendrycks/ethics, read 2026-11-08; not a quoted
    Source.
  runnable_via:
    - lm_eval
    - custom
  maintainer_rerun_policy: unstated

comparability:
  # Beyond the fallback profile: whether the entrant was fine-tuned on the Development set, prompted few-shot
  # or zero-shot (the paper mixes both; 2026 users prompt base and chat models), the prompt (the paper's GPT-3
  # templates differ from lm-evaluation-harness's), and the harness (lm-evaluation-harness scores per example
  # where the paper scores Justice, Deontology and Virtue per group). subset_used covers the task and the
  # split, Test or Hard Test, which the paper always reports apart.
  material_extra:
    - training_data_policy
    - shots
    - prompt_template_hash
    - harness
aggregation_policy: official-aggregate
aggregation_policy_basis:
  reason: The paper and the README report an unweighted average of the five task accuracies for each
    of the Test and Hard Test sets beside the per-task scores.
  source: src-arxiv-2008-02275-v6
  quote: Even so, average performance is beneath 50% on the Hard Test set.

homepage: https://github.com/hendrycks/ethics
repository: https://github.com/hendrycks/ethics
dataset_url: https://huggingface.co/datasets/hendrycks/ethics

subsets:
  - id: ethics#justice
    label: Justice (impartiality and desert)
    notes: Dev 21,791, Test 2,704, Hard Test 2,052. Binary reasonableness of explanations for
      unequal treatment and of desert claims, scored per group of related examples; random baseline
      6.3%.
  - id: ethics#deontology
    label: Deontology (requests and roles)
    notes: Dev 18,164, Test 3,596, Hard Test 3,536. Binary reasonableness of exemptions and of role
      responsibilities, scored per group; random baseline 6.3%.
  - id: ethics#virtue
    label: Virtue ethics
    notes: Dev 28,245, Test 4,975, Hard Test 4,780 scenario-trait pairs. Whether a trait is
      exemplified, five candidate traits per scenario, scored per group; random baseline 8.2%.
  - id: ethics#utilitarianism
    label: Utilitarianism
    notes: Dev 13,738, Test 4,808, Hard Test 4,272. Pairs ordered by pleasantness, scored as
      pairwise ordering accuracy; random baseline 50%.
  - id: ethics#commonsense
    label: Commonsense morality
    evidence:
      - source: src-arxiv-2008-02275-v6
        quote: We keep posts where there are at least 100 total votes and the voter agreement rate
          is 95% or more.
    notes: Dev 13,910, Test 3,885, Hard Test 3,964. Whether the first-person character was clearly
      wrong, in short Mechanical Turk and long Reddit scenarios; random baseline 50%.
subsets_note: The five tasks of the paper's Table 1, each with Dev, Test and Hard Test splits that
  are reported apart, with the counts in each subset's notes. The Hard Test is not a subset but a
  split. The released data also holds about 1,000 contentious long Commonsense scenarios without
  labels (ambig.csv), for the paper's disagreement-detection test, scored by AUROC and not part of
  the average.
subsets_source: src-arxiv-2008-02275-v6
subsets_quote: Split Justice Virtue Deontology Utilitarianism Commonsense Dev 21791 28245 18164
  13738 13910 Test 2704 4975 3596 4808 3885 Hard Test 2052 4780 3536 4272 3964


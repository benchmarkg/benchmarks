# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T04)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2008-02275-v6
    - src-arxiv-2008-02275
    - src-github-ethics-readme
    - src-hf-api-hendrycks-ethics
    - src-github-lm-eval-hendrycks-ethics-readme
    - src-github-lm-eval-ethics-commonsense-yaml
    - src-arxiv-2601-17728-v1
    - src-arxiv-2608-12368
  sources_note: >
    The paper's v6 PDF (a DOI, not archived) read as text; its abstract page (a DOI) for the dates and
    venue; the README at master; Hugging Face's API record of hendrycks/ethics, read instead of the
    dataset page; lm-evaluation-harness's hendrycks_ethics README and commonsense task file at main; the
    v1 PDF of arXiv 2601.17728 (a DOI) and the abstract page of arXiv 2608.12368 (a DOI) as evidence of
    2026 use. The repository's licence, commits and push date come from the GitHub API and are not
    quoted Sources.
  confidence: medium
  review_checks:
    - check: Primary domain value-alignment. The family inclusion test names refusal, robustness,
        honesty, bias and frontier-risk properties, not value alignment, and its exclusion test
        turns away a benchmark that claims to measure neither conduct nor a hazardous capability;
        ETHICS scores moral judgements of described scenarios, not the system's own conduct. The
        leaf's definition (expressed values or choices against a stated normative standard) fits,
        and no other family claims it; confirm, and consider whether the family inclusion test
        should name value alignment.
      field: domain.primary
      source: src-arxiv-2008-02275-v6
      quote: Models predict widespread moral judgments about diverse text scenarios.
    - check: Capability knowledge-recall rests on the norm not being in the prompt, while the paper
        says all prediction-relevant information is in the scenario. Fine-tuned entrants learn from
        the Development set, which blurs "brought with it". context-integration was rejected; no
        capability term names normative judgement.
      field: capability
      source: src-arxiv-2008-02275-v6
      quote: we assume all essential prediction-relevant information is contained in the scenario
        text
    - check: "lifecycle active, not mature: 2026 papers produce new results, but the maintainers' own
        leaderboard has not changed since January 2021, so the record on the benchmark's own channel is
        settled. The brief allowed mature; the vocabulary's exclusion test decided it."
      field: lifecycle
      source: src-arxiv-2608-12368
      quote: Across frontier and open model families, agreement with human annotator majority labels
        is often high.
    - check: activity accepting-submissions and submission_process self-reported rest on the
        README's invitation alone. No outside row was ever added, so literature-only and
        no-submission-channel describe the practice better; whether the route is live is not known.
      field: activity
      source: src-github-ethics-readme
      quote: If you want to have your model added to the leaderboard, please reach out to us or
        submit a pull request.
    - check: dataset_licence MIT comes from the maintainers' 2023 Hugging Face card; the paper's
        datasheet says the dataset is not distributed under a licence or terms of use, and the
        Berkeley tar states none. Which governs the tar file is unresolved.
      field: data.dataset_licence
      source: src-arxiv-2008-02275-v6
      quote: fees associated with these restrictions. No. Have any third parties imposed IP-based
    - check: Split names differ between copies. The Hugging Face card exposes the paper's Test as
        "validation" and its Hard Test as "test" (Commonsense 3,885 and 3,964), and Utilitarianism
        has one row fewer per split than Table 1 (13,737 against 13,738). A result labelled "test"
        may therefore be either set; lm-evaluation-harness uses its own copy's test split.
      field: subsets
      source: src-hf-api-hendrycks-ethics
      quote: '{"name":"validation","num_bytes":3148616,"num_examples":3885},{"name":"test","num_bytes":3863068,"num_examples":3964}'
    - check: lm-evaluation-harness scores per-example accuracy, so its Justice, Deontology and
        Virtue numbers are not comparable with the paper's grouped accuracy, and its README's Paper
        heading names an unrelated paper (Pointer Sentinel Mixture Models). Its
        ethics_utilitarianism_original task is marked missing.
      field: as_used
      source: src-github-lm-eval-hendrycks-ethics-readme
      quote: Pointer Sentinel Mixture Models
    - check: designed_for_subjects lists base-model for the paper's GPT-3 few-shot runs beside the

subsets_note: >
  The six archetypes of the paper's Table 2, with the public split's counts (Hugging Face configs and
  the inspect_evals port). The paper reports honesty per archetype, and the leaderboard gives the
  private split's archetype shares (Known Facts 20.6%, Situation-Provided Facts 27%, Doubling Down 11%,
  Fabricated Statistics 8.4%, Continuations 20.6%, Disinformation 12.4%). The public, private and full
  sets are splits, recorded in data.size, not subsets.


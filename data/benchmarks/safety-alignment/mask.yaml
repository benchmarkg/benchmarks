# --- Curation --------------------------------------------------------------------------------

curation:
  added_by: agent (P1-S9-T04)
  added_on: 2026-11-08
  last_verified: 2026-11-08
  verification_status: ai-drafted-unverified
  sources:
    - src-arxiv-2503-03750-v3
    - src-arxiv-2503-03750
    - src-github-mask-readme
    - src-github-mask-eval-readme
    - src-hf-api-cais-mask
    - src-scale-leaderboard-mask
    - src-github-inspect-evals-mask-readme
    - src-arxiv-2610-22292
    - src-safe-ai-about
  sources_note: >
    The paper's v3 PDF (a DOI, not archived) read as text, and its abstract page; both READMEs of
    centerforaisafety/mask at commit 25e0b12; the Hugging Face API record of cais/MASK; Scale's
    leaderboard page with scripts and styles stripped; the inspect_evals port's README at commit
    2b9c003; CATCH's abstract page (2026) as evidence of current use; and CAIS's about page (on main)
    for its form. The project site, the dataset card and evaluate.py were read and not cited. GitHub
    metadata (licence, dates, commits) was read through the API and is not a quoted Source.
  confidence: medium
  review_checks:
    - check: data.access is private-test-server because the leaderboard is computed on the private
        500 alone and the paper on all 1,500. The paper's own wording says the held-out set is there
        to track overfitting, which reads like humanity-s-last-exam's near miss; the leaderboard's
        use of it is what decides.
      field: data.access
      source: src-arxiv-2503-03750-v3
      quote: We also maintain a separate, held-out set of 500 examples to track potential
        overfitting.
    - check: Who holds the private split is not stated. Scale's page runs the leaderboard on it, and
        the paper's authors (CAIS and Scale) maintain it. The maintainer is recorded as CAIS with
        Scale, and maintainer_type nonprofit follows the dataset's namespace; if Scale holds the
        split, a reviewer may weigh industry-lab.
      field: governance.maintainer
      source: src-scale-leaderboard-mask
      quote: In partnership with the Center for AI Safety (CAIS), we introduce Model Alignment
        between Statements and Knowledge (MASK)
    - check: activity no-submission-channel rests on silence. The leaderboard page, the READMEs and
        the paper describe no route for developers to be evaluated; if Scale takes requests, the
        value would change.
      field: activity
    - check: The public set's size disagrees. The Hugging Face description says 1,028, while the six
        configs and the inspect_evals port count 1,000, as the paper does.
      field: data.size
      source: src-hf-api-cais-mask
      quote: The public set contains 1,028 high-quality human-labeled examples across six distinct
        archetypes
    - check: The inspect_evals README says the dataset is gated and needs a Hugging Face token, but
        the API record read on 2026-11-08 says gated false. If a gate was added and removed, or the
        port's text is stale, the access note should say so.
      field: execution.runnable_via
      source: src-github-inspect-evals-mask-readme
      quote: is [gated](https://huggingface.co/docs/hub/datasets-gated)
    - check: refresh static assumes paper v3 (2026-01-05) changed no items or scoring; v1 and v3
        were not compared, and the leaderboard's private split carries no version label.
      field: data.refresh
      source: src-arxiv-2503-03750
      quote: Submitted on 5 Mar 2025 (v1), last revised 5 Jan 2026 (this version, v3)
    - check: harness_availability official-harness assumes the maintainers' pipeline is the scoring
        path. Scale's page describes the same judges and metric, but does not say the leaderboard
        runs that code; reference-implementation-only is the alternative.
      field: execution.harness_availability
      source: src-scale-leaderboard-mask
      quote: We employ an LLM judge (GPT-4o for binary propositions and o3-mini for numerical
        propositions)
    - check: ground_truth_source none reflects the honesty score, which has no key. Accuracy uses
        model-ensemble labels with human tie-breaking, which no term names exactly; held-out-labels
        is the alternative if accuracy is treated as a headline.
      field: ground_truth_source
      source: src-arxiv-2503-03750-v3
      quote: We obtain a ground truth via an ensemble of LLMs (GPT-4o and Claude3.5-Sonnet) prompted
        with the proposition.
    - check: attack-or-intervention-method is tagged for the paper's intervention experiments and
        later uses (CATCH). The leaderboard ranks models only, so the term may overstate a secondary
        use.
      field: designed_for_subjects
    - check: "reliability-consistency and adversarial-robustness were rejected: Honesty@10 is reported
        for every model in the paper's Table 3 but is not the headline, and the prompts were collected
        adversarially against seven named models (Gemini, GPT-4o-mini, Claude 3.5 and Llama 3.1 models)."
      field: capability
      source: src-arxiv-2503-03750-v3
      quote: We run the same pressure prompt ten times
    - check: 'data_provenance crowd-authored: the pressure-prompt writers were trained and quizzed on
        the archetypes, and the paper does not describe their prior expertise.'
      field: data.data_provenance

# data/surveys/engineering-design/_eda-cad-cluster.yaml
#
# P1-S8-T01: the second engineering-design survey. It extends _family-scoping.yaml (P0-S10-T03) and
# does not repeat it. 02 S3 footnote § asserted "an EDA/CAD cluster it never enumerated". The Phase-0
# pass reached the recent LLM suites and the two big contests (8 circuit-eda and 4 CAD families). It did
# not reach the classic EDA suites and contest series, the ML-for-EDA datasets, several further HDL
# suites, or the CAD datasets the generative-CAD literature evaluates on. Those are surveyed here.
#
# Status: agent-drafted. A person must accept the finding before it changes anything (P1-S8-T02
# decides mute or curate). Every primary URL below was fetched on 2026-10-07 by the drafting agent; the
# `evidence` lines are what that fetch returned. Citation counts are Semantic Scholar's, read through
# its batch API on 2026-10-07; stars and last-push dates are GitHub's REST API, the same day.
#
# The credibility test is the Phase-0 survey's, unchanged, so the two counts add: (a) a primary source
# fetched that day; (b) a defined scoring procedure, not only a dataset or a method paper; (c)
# evidence of field-defining use. Grades: S strong, M meets the bar, W meets only its letter.
#
# Counting convention: 02 S11 / 04 S4 -- a benchmark and its versions or tracks are ONE family.

survey:
  family: engineering-design
  extends: data/surveys/engineering-design/_family-scoping.yaml
  conducted_on: 2026-10-07
  method: >
    Candidates from the EDA and CAD literature the Phase-0 pass did not reach, each looked up on the
    arXiv API by title (every one resolved to its paper), its primary page or repository fetched, its
    GitHub statistics and Semantic Scholar citation count read, and the three-part test applied.
    Each `measures` line is quoted or paraphrased from the abstract, README or page read that day,
    and says which. Four repository URLs first tried by name returned 404 and were found again
    through GitHub's repository search rather than guessed a second time.
  drafted_by: agent (P1-S8-T01)
  accepted_by: null

finding:
  added_credible: 8                    # pass all three tests and the family's own inclusion test
  added_borderline: 2                  # DeepCAD and SketchGraphs: field-defining, criterion (b) borderline
  added_pending_scope: 2               # CircuitNet and OpenABC-D: credible, but fail the family inclusion test as written
  phase0_excluding_weak: 22
  refreshed_count: 30                  # 22 + 8; 32 with the borderline pair; 34 if the scope decision admits the pending pair
  floor: 12
  meets_floor: true
  recommendation: curate
  note: >
    The floor of twelve is met more than twice over with the weak and borderline families left out.
    The risk 02 S3 footnote § named (fewer than twelve) did not materialise. The risk that did is
    the opposite one: the family is dense and fast-growing in circuit-eda and cad-geometry-generation,
    and thin elsewhere, so its seed target of 12 will under-represent it. Whether the target should
    move is the allocation owner's call (02 S3), not this survey's.

families:
  # --- circuit-eda: contest series and benchmark suites --------------------------------------------------
  - name: IWLS Programming Contest
    subdomain: circuit-eda
    grade: S
    first_release: 2020
    measures: >
      Machine learning and logic synthesis; entrants learn a circuit from a training care set,
      and the implementation is "expected to generalize on a validation set" (the series page).
    urls:
      - https://www.iwls.org/contest/
      - https://iwls.org/iwls2023/
    evidence: >
      Contest series page fetched; it links 2020, 2021 and 2023 contests, the 2023 programming
      contest PDF and its benchmark archive. Co-located with DAC.
    resolves: >
      The Phase-0 survey's unverified item "IWLS contest as a family separate from the EPFL suite
      records". It is separate: a recurring ML-for-synthesis contest, not the EPFL best-results table.
  - name: ITC'99 benchmarks
    subdomain: circuit-eda
    grade: M
    first_release: 1999
    measures: >
      Design-for-testability and test-generation tools evaluated on a shared set of industrial
      benchmark circuits.
    urls:
      - https://www.cerc.utexas.edu/itc99-benchmarks/bench.html
    evidence: >
      Homepage fetched; "an Official TTTC Activity", circuits "gathered from many companies in the
      electronics business". Citation count not fetched (no single paper).
    subdomain_fit: partial                # testing, which the circuit-eda definition does not name; see validation
  - name: Titan and Titanium25 FPGA benchmark suites
    subdomain: circuit-eda
    grade: M
    first_release: 2013
    measures: >
      FPGA CAD tools and architectures evaluated on large heterogeneous benchmark circuits.
    urls:
      - https://www.eecg.utoronto.ca/~vaughn/titan/
    evidence: >
      Page fetched; Titanium25, "an additional set of 25 large benchmarks released in 2025", so
      maintained. University of Toronto.
  - name: VTR benchmark suites (Verilog-to-Routing)
    subdomain: circuit-eda
    grade: M
    first_release: 2012
    measures: >
      FPGA architecture and CAD research evaluated on the VTR benchmark suites.
    urls:
      - https://github.com/verilog-to-routing/vtr-verilog-to-routing
    evidence: >
      1,274 stars; pushed 2026-10-07; created 2015-06-26. The repository describes itself as
      "Open Source CAD" for FPGAs; its metrics were not read today.
    note: >
      The benchmark is the suite, not the tool. Catalogue it as the suite, and read its scoring before
      curating it.
  # --- circuit-eda: further LLM hardware-description suites -------------------------------------------------
  - name: AnalogCoder benchmark
    subdomain: circuit-eda
    grade: M
    first_release: 2024
    measures: >
      Analog circuit design through Python code generation, on "a benchmark designed to cover a
      wide range of analog circuit tasks" (the abstract); the paper reports circuits designed
      successfully.
    urls:
      - https://arxiv.org/abs/2405.14918
      - https://github.com/laiyao1/AnalogCoder
    evidence: >
      AAAI; 164 citations; 203 stars; pushed 2026-09-12. A successor, AnalogCoder-Pro
      (arXiv 2508.02518), extends it.
    note: >
      Introduced inside a method paper, like CADPrompt in the Phase-0 survey.
  - name: RTL-Repo
    subdomain: circuit-eda
    grade: M
    first_release: 2024
    measures: >
      LLMs completing RTL in large real repositories, scored on edit similarity and exact match
      (the README's leaderboard columns).
    urls:
      - https://arxiv.org/abs/2405.17378
      - https://github.com/AUCOHL/RTL-Repo
    evidence: >
      IEEE LAD 2024; 40 citations; 35 stars; last pushed 2024-06-05.
    subdomain_fit: boundary               # HDL as code; see validation
  # --- cad-geometry-generation -----------------------------------------------------------------------------
  - name: Fusion 360 Gallery
    subdomain: cad-geometry-generation
    grade: M
    first_release: 2020
    measures: >
      The CAD reconstruction task, "recovering a CAD program from a target geometry" (the
      abstract), in the Fusion 360 Gym environment over 8,625 human design sequences.
    urls:
      - https://arxiv.org/abs/2010.02392
      - https://github.com/AutodeskAILab/Fusion360GalleryDataset
    evidence: >
      ACM Transactions on Graphics; 98 citations; 748 stars; Autodesk. Last pushed 2022-04-23,
      so the data is stable rather than maintained.
  - name: Text2CAD (sequential CAD from prompts)
    subdomain: cad-geometry-generation
    grade: M
    first_release: 2024
    measures: >
      Text prompts from beginner to expert level to sequential parametric CAD models (the
      title); annotations built on DeepCAD's data (the abstract).
    urls:
      - https://arxiv.org/abs/2409.17106
      - https://sadilkhan.github.io/text2cad-project/
    evidence: >
      Project page fetched, "NeurIPS 2024 Spotlight"; 32 citations.
    naming_collision: >
      arXiv 2411.06206 is an unrelated "Text2CAD" (from technical drawings, 16
      citations), and Text2CAD-Bench (arXiv 2605.18430) is a third project. Entry ids must disambiguate.

borderline:
  # Field-defining by use, but criterion (b) is borderline: each is a dataset or a method paper whose
  # data became the standard evaluation set, with the metrics fixed by convention rather than by a
  # maintained scorer.
  - name: DeepCAD
    subdomain: cad-geometry-generation
    grade_if_admitted: S
    first_release: 2021
    urls:
      - https://arxiv.org/abs/2105.09492
      - https://github.com/rundiwu/DeepCAD
    evidence: >
      ICCV 2021; 420 citations; 832 stars. CAD-Recode (2024) and Text2CAD (2024) both build on or
      evaluate against its data, by their abstracts.
    subdomain_fit: partial                # unconditional generation has no "stated specification"
  - name: SketchGraphs
    subdomain: cad-geometry-generation
    grade_if_admitted: M
    first_release: 2020
    urls:
      - https://arxiv.org/abs/2007.08506
      - https://github.com/PrincetonLIPS/SketchGraphs
    evidence: >
      112 citations; 491 stars; last pushed 2021-08-01. Its abstract names constraint prediction
      and generative modelling as the uses.

pending_scope:
  # Credible, but what is scored is a prediction about a design, not a design. The family's inclusion
  # test ("what is submitted is a design") excludes them as written; see validation instance 4.
  - name: CircuitNet
    subdomain: circuit-eda
    grade_if_admitted: M
    first_release: 2022
    urls:
      - https://arxiv.org/abs/2208.01040
      - https://github.com/circuitnet/CircuitNet
    evidence: >
      Science China Information Sciences; 44 citations; 512 stars; pushed 2026-05-17. The README
      names its tasks: congestion, DRC and IR-drop prediction.
  - name: OpenABC-D
    subdomain: circuit-eda
    grade_if_admitted: M
    first_release: 2021
    urls:
      - https://arxiv.org/abs/2110.11292
      - https://github.com/NYU-MLDA/OpenABC
    evidence: >
      68 citations; 152 stars; pushed 2025-07-23. The abstract defines "a generic learning
      problem" over synthesis runs labelled with node counts and delay, and benchmarks solutions on it.

considered_not_tier1:
  - name: VHDL-Eval
    url: https://arxiv.org/abs/2406.04379
    reason: >
      Weak. IEEE LAD 2024, 31 citations, and no public repository found by search.
  - name: EDALearn
    url: https://arxiv.org/abs/2312.01674
    reason: >
      Weak. 11 citations; repository panjingyu/EDALearn has 7 stars, last pushed 2024-10-28.
  - name: ForgeEDA
    url: https://arxiv.org/abs/2505.02016
    reason: >
      A dataset (9 citations; 11 stars), not a benchmark.
  - name: HLSyn
    url: https://github.com/ZongyueQin/HLSyn
    reason: >
      No arXiv record found by title; repository has 9 stars and was last pushed 2023-10-26.
  - name: RTLCoder
    url: https://arxiv.org/abs/2312.08617
    reason: >
      A model and its training data (156 citations), evaluated on VerilogEval and RTLLM, which the
      Phase-0 survey already holds.
  - name: MG-Verilog
    url: https://arxiv.org/abs/2407.01910
    reason: >
      A training dataset (76 citations), not a benchmark.
  - name: CAD-Recode
    url: https://arxiv.org/abs/2412.14042
    reason: >
      A method (92 citations), evaluated on DeepCAD and Fusion 360 Gallery.
  - name: ABC (A Big CAD Model Dataset)
    url: https://arxiv.org/abs/1812.06216
    reason: >
      Field-defining (CVPR 2019, 723 citations), but its benchmarks are normal estimation and
      segmentation on CAD meshes, so what is scored is geometry processing, not a design. Fails the
      family inclusion test; vision is the likelier home. See validation instance 9.
  - name: Text2CAD-Bench
    url: https://arxiv.org/abs/2605.18430
    reason: >
      Weak. Five months old, 12 citations.
  - name: CADBench (multimodal CAD program generation)
    url: https://arxiv.org/abs/2605.10873
    reason: >
      Weak. Five months old, 10 citations. Also a fourth project under the CADBench name, after the
      three the Phase-0 survey recorded.
  - name: OmniRouting
    url: https://arxiv.org/abs/2608.04434
    reason: >
      Two months old, no citations yet. The first PCB-routing benchmark seen; watch it at the next
      sweep.

unverified:
  - TAU Contest (timing analysis, ACM TAU workshop). The workshop site answered 200 but renders 157
    characters without JavaScript, and /contest.html returned 404. Not counted.
  - MLCAD contest. The workshop site answered 200 but renders 439 characters without JavaScript. Not
    counted.
  - ISCAS'85 and ISCAS'89 circuits. No canonical primary page found to fetch. Not counted.
  - DAC System Design Contest. Still unverified, as in the Phase-0 survey.
  - ITC'99's citation count; the suite has no single paper.

# Step 3: the family's six subdomains against ten real instances, before curating at volume. Each is
# tagged by the inclusion test of the family (domains.yaml: "what is submitted is a design ... judged
# against engineering criteria"; not where the artifact is software, which is `code`) and the
# subdomain definitions as written. Three outcomes: fits, boundary (fits, but a rule is missing), fails.
subdomain_validation:
  instances:
    - instance: CAD Contest at ICCAD
      tagged: engineering-design/circuit-eda
      outcome: fits
    - instance: Titan FPGA suites
      tagged: engineering-design/circuit-eda
      outcome: fits
      note: >
        What is submitted is a CAD tool, scored on the designs it produces. The family test reads this
        as a design only if "a design" includes a tool's output; say so in the definition.
    - instance: AnalogCoder
      tagged: engineering-design/circuit-eda
      outcome: fits
    - instance: CircuitNet
      tagged: none
      outcome: fails
      note: >
        Scored artifact is a prediction (congestion, DRC, IR drop) about a layout, not a design. Every
        ML-for-EDA prediction benchmark fails the same way. Decide whether circuit-eda admits "predicting
        a design's quality", or these go elsewhere.
    - instance: VerilogEval
      tagged: engineering-design/circuit-eda
      outcome: boundary
      note: >
        The submission is HDL source code, and the family excludes "where the artifact is software,
        which is `code`". HDL describes hardware and is scored by simulating the circuit, so circuit-eda
        is right, but the exclusion test needs a clause saying hardware description is not software.
        Every HDL suite in the two surveys depends on it (VerilogEval, RTLLM, CVDP, RTL-Repo), and by
        the same argument for generated code that is scored as a circuit or a shape, so do AnalogCoder
        and the Phase-0 survey's CADPrompt.
    - instance: ITC'99 benchmarks
      tagged: engineering-design/circuit-eda
      outcome: boundary
      note: >
        Test generation and design-for-testability are neither designing, placing, routing nor
        verifying. Add "testing" to the circuit-eda definition, or accept it under "verifying".
    - instance: Fusion 360 Gallery
      tagged: engineering-design/cad-geometry-generation
      outcome: fits
      note: >
        The target geometry is the stated specification.
    - instance: Text2CAD (sequential)
      tagged: engineering-design/cad-geometry-generation
      outcome: fits
    - instance: DeepCAD
      tagged: engineering-design/cad-geometry-generation
      outcome: boundary
      note: >
        Unconditional generation, scored on distributional metrics, has no "stated specification".
        Either widen the definition or accept that the most-cited CAD evaluation set is out of scope.
    - instance: ABC (A Big CAD Model Dataset)
      tagged: none
      outcome: fails
      note: >
        Normal estimation and segmentation on CAD meshes are geometry processing. Correctly excluded by
        the family test; vision is the likelier home.
  summary:
    fits: 5
    boundary: 3
    fails: 2
    reading: >
      The two dense subdomains hold up: every instance that is a design lands in circuit-eda or
      cad-geometry-generation without ambiguity about which. What the ten expose is three missing
      clauses, not a wrong cut: hardware description versus `code`, testing within circuit-eda, and
      whether a specification is required for CAD generation. Plus one scope decision: ML-for-EDA
      prediction benchmarks. None of the ten needed structural-mechanical-design,
      process-control-optimization, experimental-apparatus-design or lab-automation-execution. The
      Phase-0 survey's concerns about those four (one family in experimental-apparatus-design; three
      of four lab-automation families being biology protocols) stand, and nothing here relieves them.

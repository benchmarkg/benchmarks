# data/surveys/biology-genetics/phylogenetics.yaml
#
# P1-S5-T06, step 2: "Leave phylogenetics deliberately empty with a dated survey note, not an entry."
# This is that note. `biology-genetics/phylogenetics` is a declared gap-matrix placeholder
# (`gap_placeholder: true` in taxonomy/domains.yaml; 02 S3 changelog, "kept although empty"), and 02 S3's
# empty-subdomain rule says a `surveyed-and-empty` subdomain needs a dated survey note. No entry is filed
# and no Source is written; the URLs below are the survey's evidence, not catalogue Sources.
#
# Status: agent-drafted. A person must accept the finding before it changes anything. Every URL below
# was fetched on 2026-11-05 by the drafting agent, and the `evidence` lines are what that fetch returned.
# Journal papers were read as Europe PMC records (abstracts through the REST search API, and three full
# texts through its fullTextXML endpoint), never from publisher sites; arXiv abstracts through the arXiv
# API; repositories through the GitHub REST API and raw README files. Citation counts are Europe PMC's
# `citedByCount`, read on 2026-11-05. They run well below Semantic Scholar's, which the engineering-design
# surveys used, so the "100+ citations" bar of criterion (c) is applied loosely to them. Semantic Scholar
# was not queried. One site was not fetched because its robots.txt disallows every path (PhyloBench's
# web interface; see that candidate).
#
# The credibility test is the engineering-design surveys', unchanged: (a) a primary source fetched that
# day; (b) a defined scoring procedure, not only a dataset or a method paper; (c) evidence of
# field-defining use -- a recurring contest, a leaderboard, a major venue, 100+ citations, or maintainer
# or community backing. Grades: S strong, M meets the bar, W meets only the letter of (a) and (b).
# A candidate that fails a test is marked `fails` on that test and is not graded.
#
# A second, separate question is fit: whether the scored quantity is the subdomain's definition,
# "Inferring evolutionary relationships among sequences or organisms from molecular data". Passing the
# credibility test does not make a candidate a phylogenetics benchmark.
#
# Counting convention: 02 S11 / 04 S4 -- a benchmark and its versions or tracks are ONE family.

survey:
  family: biology-genetics
  subdomain: biology-genetics/phylogenetics
  conducted_on: 2026-11-05
  method: >
    Searches on the arXiv API (abstract and title queries for phylogenetic benchmarks, deep-learning
    and language-model phylogenetics, and neural tree inference), the Europe PMC REST API (title
    queries for phylogenetic benchmarks, deep-learning and machine-learning phylogenetics, Phyloformer,
    and named community assessments, sorted by citations, which also covers bioRxiv preprints), and
    the GitHub repository search API ("phylogenetic benchmark", "phyloformer"). Community assessments
    were looked for by name: CASP's current categories, the DREAM challenges with a tree-reconstruction
    task, the Quest for Orthologs benchmark service, AFproject and CAMI. Each candidate's primary page,
    abstract or full text was then read, and the three-part test and the fit question applied. Each
    `measures` line is quoted or paraphrased from what was read that day, and says which. Hits that
    were plainly not benchmarks (method papers with no reusable test set, phylogenetic comparative
    methods, the phylogeny of language models) were not carried, except where named below as near misses.
  drafted_by: agent (P1-S5-T06)
  accepted_by: null

finding:
  decision: surveyed-and-empty
  entries_filed: 0
  candidates_examined: 17
  pass_all_three: 6                   # AFproject, Quest for Orthologs, SMC-Het, cell-lineage DREAM, CASP16, CAMI
  pass_all_three_and_fit: 1           # AFproject, on a reading of "fit" a person should confirm
  pass_all_three_fit_boundary: 3      # Quest for Orthologs, SMC-Het, cell-lineage DREAM
  pass_all_three_out_of_subdomain: 2  # CASP16, CAMI (near misses)
  pass_a_b_fail_c: 3                  # PhyloBench, PEWO, ViroBench (ViroBench also out of the subdomain)
  fail_b: 7                           # datasets, method papers, probes, a tool, PhyloLM
  not_assessable: 1                   # the 2025 critical evaluation (no abstract in the record)
  candidate_for_later_round: AFproject
  note: >
    The subdomain stays deliberately empty for this round, as P1-S5-T06 step 2 requires; no entry is
    filed. The reason is not that nothing credible exists. The recon behind the 02 S3 changelog row
    ("no standing phylogenetics benchmark; comparisons are simulation-based and per-paper") holds for
    machine-learning phylogenetics, but not for the field as a whole. For learned models (Phyloformer
    and the deep-learning tree-inference papers, the variational Bayesian line evaluated on its eight
    real-data sets, protein-language-model phylogeny probes) every candidate fails criterion (b): the
    test sets are simulations or conventional datasets inside method papers, with no maintained scorer.
    The one purpose-built tree-inference benchmark on real sequences, PhyloBench (Molecular Biology and
    Evolution 2024), passes (a) and (b) but fails (c), with six citations. Besides CASP16 and CAMI,
    which have no phylogenetics task, four method-agnostic community assessments pass all three tests,
    and three of them are boundary cases on fit: the Quest for Orthologs service
    scores orthology inference (one of its benchmarks is phylogenetic), and the two DREAM challenges
    score tumour subclonal lineages (one sub-challenge of seven) and developmental cell lineages, which
    are trees but not evolutionary relationships among organisms. The exception is AFproject: a
    standing web service (Genome Biology 2019, 160 citations in Europe PMC) that scores uploaded
    distances, and nine of its twelve reference data sets (gene trees, genome-based phylogeny,
    horizontal gene transfer) are scored by normalised Robinson-Foulds distance to reference trees. It
    passes all three tests, and its majority task is phylogenetic inference, though framed as
    alignment-free sequence comparison. It is named here as a candidate for a later round so that a
    person can decide; it is not filed.
  decisions_for_a_person:
    - Whether AFproject should be curated in a later round with `biology-genetics/phylogenetics` as
      its primary. If it is, the subdomain stops being empty and its `gap_placeholder` flag and the
      02 S3 changelog rationale need revisiting.
    - Whether orthology inference (Quest for Orthologs) belongs in phylogenetics, in
      protein-function-prediction, or nowhere yet. The definition's "evolutionary relationships
      among sequences" reads as covering it.
    - Whether tumour phylogeny and cell-lineage reconstruction count as phylogenetics. If they do,
      both DREAM challenges become candidates, though each was a single round.
    - The 02 S3 changelog row says the recon found "no standing phylogenetics benchmark". This
      survey found two standing services with phylogenetic scoring (AFproject, Quest for Orthologs);
      the row may want a dated qualification, and that edit is outside this task.
    - 02 S3's empty-subdomain rule says the survey note sits in `taxonomy/domains.yaml` and is
      rendered verbatim. This note is filed under data/surveys/ as the task directs; the term may
      need a pointer to it, or a short dated summary of it.

candidates:
  # --- community assessments and standing benchmark services -------------------------------------
  - name: AFproject (alignment-free sequence comparison benchmark)
    first_release: 2019
    urls:
      - https://afproject.org/app/
      - https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6659240/fullTextXML
    fetched_on: 2026-11-05
    measures: >
      Quoted (the service page): "AFproject reports performance assessment of alignment-free methods across
      12 reference data sets, which are divied into 5 research applications" (sic). Paraphrased (the paper's
      full text): the gene-tree, genome-based phylogeny and horizontal-gene-transfer categories are scored
      by normalised Robinson-Foulds distance between the reconstructed and reference trees.
    tests:
      a: pass                         # service page and Genome Biology full text fetched
      b: pass                         # upload of pairwise distances, scored against reference trees and ranked
      c: pass                         # Genome Biology 2019; 160 Europe PMC citations; a standing service
    grade: S
    subdomain_fit: likely             # 9 of 12 reference sets score tree inference; framed as alignment-free comparison
    evidence: >
      The service page lists Upload Predictions for every reference set: SwissTree gene trees; five
      genome-based phylogeny sets (E. coli/Shigella full genomes and unassembled reads, 25 fish
      mitochondrial genomes, 14 plant species full genomes and reads); three horizontal-gene-transfer
      sets. Citation count from Europe PMC (DOI 10.1186/s13059-019-1755-7).
    note: >
      Candidate for a later round. What is submitted is a distance matrix, not a tree; the service builds
      the tree. Whether that still scores "inferring evolutionary relationships" is for the curator.
  - name: Quest for Orthologs benchmark service
    first_release: 2011
    urls:
      - https://orthology.benchmarkservice.org/
      - https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4827703/fullTextXML
    fetched_on: 2026-11-05
    measures: >
      Quoted (the 2016 paper's full text): a "phylogenetic benchmark measuring the concordance between
      gene trees reconstructed from putative orthologs and undisputed species trees". Paraphrased (the
      service page): submitted ortholog predictions on the QfO reference proteomes are compared with
      other inference methods "using several tests".
    tests:
      a: pass                         # service page and Nature Methods full text fetched
      b: pass                         # automated web service; prediction upload; public results per release
      c: pass                         # releases 2011, 2018, 2020, 2022; Nature Methods 2016 (186 Europe PMC
                                      # citations), NAR 2020 (50), NAR Genomics and Bioinformatics 2024 (16)
    grade: S
    subdomain_fit: boundary           # orthology inference; one of its benchmark kinds is phylogenetic
    evidence: >
      The service page lists benchmark releases 2011, 2018, 2020 and 2022 and the reference proteomes
      2020_04 and 2022_02. The 2016 paper's abstract describes "an automated web-based service" and 20
      benchmarks; the 2024 paper reports a new release and 18 methods' public predictions.
  - name: ICGC-TCGA DREAM Somatic Mutation Calling Tumour Heterogeneity challenge (SMC-Het)
    first_release: 2020                # publication year of the paper read
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6956735/fullTextXML
    fetched_on: 2026-11-05
    measures: >
      Quoted (the paper's full text): "sub-challenge 3 (SC3) evaluates the ability of algorithms to
      recover the phylogenetic relationships between subclonal lineages".
    tests:
      a: pass                         # Nature Biotechnology full text via Europe PMC
      b: pass                         # seven sub-challenges with quantitative metrics, simulated tumours
      c: pass                         # Nature Biotechnology; 74 Europe PMC citations; DREAM community challenge
    grade: M
    subdomain_fit: partial            # tumour clone trees, one sub-challenge of seven; the rest is subclonal reconstruction
    evidence: >
      The abstract reports 580 tumour reconstructions benchmarked. A single round as far as was read.
  - name: DREAM cell lineage reconstruction challenge
    first_release: 2021                # publication year of the paper read
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:(%22Benchmarked%20approaches%20for%20reconstruction%22)&format=json&resultType=core
    fetched_on: 2026-11-05
    measures: >
      Paraphrased (the Cell Systems abstract): reconstructing cell lineage trees from induced DNA
      mutations, on in vitro recordings and in silico C. elegans (about 1,000 cells) and M. musculus
      (10,000 cells) trees; 22 approaches submitted.
    tests:
      a: pass                         # Europe PMC record; no PMC full text, so the metric was not read
      b: pass                         # a scored DREAM challenge; its tree-distance metric not read today
      c: pass                         # Cell Systems 2021; 73 Europe PMC citations; DREAM community challenge
    grade: M
    subdomain_fit: boundary           # lineage trees of cells, not evolutionary relationships among organisms
    evidence: >
      A single round as far as was read.
  - name: CASP16
    urls:
      - https://predictioncenter.org/casp16/index.cgi
    fetched_on: 2026-11-05
    measures: >
      Paraphrased (the CASP16 page): structure prediction assessed in protein domains, multimers, RNA/DNA
      monomers and multimers, hybrids, accuracy estimation and ligands.
    tests:
      a: pass
      b: pass
      c: pass
    grade: S
    subdomain_fit: none               # near miss: no phylogenetics category; the page does not mention phylogeny
    note: Already catalogued as `casp`; examined only to confirm there is no phylogenetics track.
  - name: CAMI (Critical Assessment of Metagenome Interpretation)
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:(%22Critical%20Assessment%20of%20Metagenome%20Interpretation%22)&format=json&resultType=core
    fetched_on: 2026-11-05
    measures: >
      Quoted (the Nature Methods 2017 abstract): "Methods for assembly, taxonomic profiling and binning
      are key to interpreting metagenome data".
    tests:
      a: pass
      b: pass
      c: pass                         # Nature Methods 2017; 679 Europe PMC citations
    grade: S
    subdomain_fit: none               # near miss: taxonomic assignment, not inference of a tree
  # --- purpose-built phylogenetic-inference benchmarks ------------------------------------------
  - name: PhyloBench
    first_release: 2024
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1093/molbev/msae084%22&format=json&resultType=core
    fetched_on: 2026-11-05
    measures: >
      Quoted (the Molecular Biology and Evolution abstract): "The measure of accuracy of an inferred
      tree is its distance to the corresponding species tree." Built on natural protein sequences of
      orthologous domains, with the Robinson-Foulds distance found most reliable (paraphrased).
    tests:
      a: pass                         # paper abstract; the web interface was not fetched (robots.txt: Disallow /)
      b: pass                         # defined accuracy measure and a semi-automatic comparison interface
      c: fails                        # 6 Europe PMC citations; its GitHub scripts repository has no stars
                                      # and was last pushed 2021-11-21
    grade: W
    subdomain_fit: exact
    note: >
      The cleanest fit in the survey. Re-check its use at the next sweep; a Research Square preprint of
      2023 also exists (0 citations).
  - name: PEWO (Placement Evaluation WOrkflows)
    first_release: 2020
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1093/bioinformatics/btaa657%22&format=json&resultType=core
      - https://api.github.com/repos/phylo42/PEWO
    fetched_on: 2026-11-05
    measures: >
      Quoted (the Bioinformatics abstract): "the first benchmarking tool dedicated to PP assessment",
      PP being phylogenetic placement.
    tests:
      a: pass
      b: pass                         # automated evaluation workflows; the accuracy measure was not read today
      c: fails                        # 10 Europe PMC citations; 14 stars; last pushed 2025-01-31
    grade: W
    subdomain_fit: likely             # placing query sequences on a reference tree
    note: A benchmarking tool that users run on their own data, not a fixed test set with a results
      table.
  # --- machine-learning phylogenetics -----------------------------------------------------------
  - name: DS1-DS8 real-data benchmark (variational Bayesian phylogenetics)
    urls:
      - https://export.arxiv.org/api/query?id_list=2310.09553,2012.00459,2307.03675,2412.18827,2507.18380
    fetched_on: 2026-11-05
    measures: >
      Quoted (the ARTree abstract, arXiv 2310.09553): "a benchmark of challenging real data tree
      topology density estimation and variational Bayesian phylogenetic inference problems". The
      PhyloGen abstract (arXiv 2412.18827) names "eight real-world benchmark datasets".
    tests:
      a: pass                         # five arXiv abstracts read
      b: fails                        # no maintained scorer; metrics fixed by convention inside each method paper
      c: pass                         # the shared real-data evaluation of the line: VBPI-NF, ARTree, GeoPhy,
                                      # PhyloGen and ARTreeFormer all report on it
    grade_if_admitted: M
    subdomain_fit: exact
    note: >
      The nearest thing to a machine-learning phylogenetics benchmark. The datasets' origin (a 2008
      MCMC study) and the eight-set naming were not read today; the abstracts do not name DS1-DS8.
  - name: Phyloformer
    first_release: 2022                # first bioRxiv preprint
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1093/molbev/msaf051%22&format=json&resultType=core
      - https://api.github.com/search/repositories?q=phyloformer
    fetched_on: 2026-11-05
    measures: >
      Paraphrased (the Molecular Biology and Evolution 2025 abstract): a deep network trained on
      simulated trees and alignments, compared with FastME, FastTree and IQTree on simulated data and
      on 3,801 empirical gene alignments from five datasets.
    tests:
      a: pass
      b: fails                        # a method paper; its test sets are not released as a scored benchmark
      c: pass                         # 30 Europe PMC citations; repository with 44 stars
    subdomain_fit: exact
    note: >
      Other deep-learning tree-inference papers seen in the same Europe PMC query (Fusang, NAR 2023;
      quartet residual networks, MBE 2020; DeePhy, Quartformer and an end-to-end method, 2025; IQ-NET,
      2026) are methods evaluated on their own simulations, and fail (b) the same way.
  - name: Critical evaluation of deep-learning phylogenetic programs (JGG 2025)
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:39824436%20AND%20SRC:MED&format=json&resultType=core
    fetched_on: 2026-11-05
    measures: >
      Paraphrased from the title only: deep-learning phylogenetic programs evaluated on simulated
      datasets. The Europe PMC record carries no abstract.
    tests:
      a: pass                         # record only
      b: not-assessable
      c: fails                        # 1 Europe PMC citation
    subdomain_fit: exact
  - name: Protein language models trained on MSAs learn phylogenetic relationships (Lupo et al.)
    first_release: 2022
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22learn%20phylogenetic%20relationships%22&format=json&resultType=core
      - https://export.arxiv.org/api/query?search_query=abs:phylogenetic+AND+abs:%22language+model%22
    fetched_on: 2026-11-05
    measures: >
      Quoted (the Nature Communications abstract): combinations of MSA Transformer's column attentions
      "strongly correlate with Hamming distances between sequences in MSAs".
    tests:
      a: pass
      b: fails                        # an interpretability probe of one model, not a benchmark
      c: pass                         # Nature Communications 2022; 64 Europe PMC citations
    subdomain_fit: partial
    note: >
      The protein-language-model probe line. GitHub search also returned one 2026 repository comparing
      protein-language-model embeddings with a Hamming baseline for tree reconstruction, with no stars;
      it was not examined further.
  - name: NJGPT
    first_release: 2024
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:(phylogenetic%20AND%20(%22large%20language%20model%22%20OR%20LLM))&format=json&resultType=core
    fetched_on: 2026-11-05
    measures: >
      Paraphrased (the bioRxiv abstract): a chat-model plugin that builds neighbour-joining trees,
      checked against MEGA's output for identical trees.
    tests:
      a: pass
      b: fails                        # a tool with a one-off comparison, not a benchmark
      c: fails                        # 0 Europe PMC citations
    subdomain_fit: exact
    note: The only language-model phylogenetics item the Europe PMC title query returned.
  # --- datasets without a scorer ----------------------------------------------------------------
  - name: BenchmarkAlignments
    urls:
      - https://raw.githubusercontent.com/roblanf/BenchmarkAlignments/master/README.md
      - https://api.github.com/repos/roblanf/BenchmarkAlignments
    fetched_on: 2026-11-05
    measures: >
      Quoted (the README): "To test, verify, benchmark, and compare software and methods in
      phylogenetics." 67 empirical DNA and amino-acid datasets as of November 2025 (paraphrased).
    tests:
      a: pass
      b: fails                        # curated alignments and metadata; no reference trees or scoring
      c: fails                        # 20 stars, though maintained (pushed 2026-11-05; created 2013)
    subdomain_fit: exact
  - name: Large-scale alignment and phylogeny benchmark datasets (PLoS Currents 2010)
    urls:
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1371/currents.rrn1195%22&format=json&resultType=core
    fetched_on: 2026-11-05
    measures: >
      Quoted (the abstract): "a collection of web pages that contain benchmark datasets and software
      tools to enable the evaluation of the accuracy and scalability of computational methods for
      estimating evolutionary relationships".
    tests:
      a: pass
      b: fails                        # simulated datasets with true trees plus links to evaluation tools; no scorer
      c: fails                        # 3 Europe PMC citations
    subdomain_fit: exact
  # --- near misses found by the searches ---------------------------------------------------------
  - name: ViroBench
    first_release: 2026
    urls:
      - https://export.arxiv.org/api/query?id_list=2605.25388
    fetched_on: 2026-11-05
    measures: >
      Quoted (the arXiv abstract): "NFMs exhibit a performance degradation in biological understanding
      under phylogenetic and temporal shifts".
    tests:
      a: pass
      b: pass
      c: fails                        # five months old
    subdomain_fit: none               # phylogeny defines its data splits; no task infers a tree
  - name: PhyloLM
    first_release: 2024
    urls:
      - https://export.arxiv.org/api/query?search_query=abs:phylogenetic+AND+abs:benchmark
    fetched_on: 2026-11-05
    measures: >
      Paraphrased (the arXiv title, 2404.04671): phylogenetic methods applied to infer the relationships
      among large language models and predict their benchmark scores.
    tests:
      a: pass
      b: fails
      c: not-assessed
    subdomain_fit: none               # the organisms are language models; not molecular data

unverified:
  - The DREAM cell lineage challenge's scoring metric and any later round (the paper has no PMC full
    text, and Synapse was not opened).
  - Whether SMC-Het or the cell lineage challenge ran a second round.
  - AFproject's activity since 2019 (the service answered, but no submission dates were read).
  - PhyloBench's web interface (robots.txt disallows all paths) and any use beyond its six
    citations.
  - The origin and exact composition of the DS1-DS8 datasets.
  - Semantic Scholar citation counts for every candidate (not queried; Europe PMC counts used
    instead).
  - Language-model benchmarks with phylogenetics questions inside a broader suite (for example
    bioinformatics-analysis suites) were not searched for; any found would be secondary tags, not
    primaries.

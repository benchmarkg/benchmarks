  - alias: FrontierMath-Erdos
    resolves_to: benchmark:frontiermath-erdos
    kind: exact
    confidence: high
    decided_by: agent (P3-S3-T06), from the id allocation; not yet reviewed
    decided_on: 2026-10-05
    source: src-epoch-benchmark-data
    rationale: 'Shares the FrontierMath prefix but is its own benchmark: open conjectures posed by Erdos,
      proved or disproved in Lean, not FrontierMath problems with numeric answers. The id allocation keeps
      it apart.'
  - alias: OSWorld
    resolves_to: benchmark:osworld
    kind: exact
    confidence: high
    decided_by: agent (P3-S3-T06), from the id allocation; not yet reviewed
    decided_on: 2026-10-05
    source: src-epoch-benchmark-data
    rationale: '07 S5.4: the original OSWorld; its 2.0 row is the next record.'
  - alias: OSWorld 2.0
    resolves_to: benchmark:osworld@2.0

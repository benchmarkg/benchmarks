# data/aliases/benchmarks.yaml -- the benchmark alias table (04 S10; P3-S3-T06). One verbatim string per
# row and what it names, read by ingest/resolve.py at step 2; 07 S5.4's six traps, each with its rationale.
# Agent-drafted from the id allocation and unreviewed: a reviewer who checks a row puts their handle in decided_by.
  - alias: GPQA diamond
    resolves_to: benchmark:gpqa#diamond
    kind: spelling
    confidence: high
    decided_by: agent (P3-S3-T06), from the id allocation; not yet reviewed
    decided_on: 2026-10-05
    source: src-epoch-benchmark-data
    rationale: '07 S5.4: Diamond is a subset of GPQA (its highest-quality questions), not a benchmark.
      It resolves to the subset, so no gpqa-diamond entity is ever created.'
  - alias: MATH level 5
    resolves_to: benchmark:math#level-5
    kind: spelling
    confidence: high
    decided_by: agent (P3-S3-T06), from the id allocation; not yet reviewed
    decided_on: 2026-10-05
    source: src-epoch-benchmark-data
    rationale: '07 S5.4: level 5 is the hardest difficulty level within MATH, a subset, not a benchmark.'
  - alias: FrontierMath-2025-02-28-Private
    resolves_to: benchmark:frontiermath@2025-02-28#tiers-1-3
    extracts:
      benchmark.data.access: private-test-server
    kind: spelling
    confidence: high
    decided_by: agent (P3-S3-T06), from the id allocation; not yet reviewed
    decided_on: 2026-10-05
    source: src-epoch-benchmark-data
    rationale: '07 S5.4: four facts in one string. The benchmark is frontiermath, 2025-02-28 is the version,
      Tiers 1-3 the subset, and "Private" says the problems never leave Epoch, which runs every model
      on them: data.access private-test-server. A matcher would make a new benchmark of the whole string.'
  - alias: FrontierMath-Tier-4-2025-07-01-Private

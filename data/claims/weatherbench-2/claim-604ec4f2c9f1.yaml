notes: "One point of the grid, not a summary. The maintainers' results file fuxi_vs_era5_240x121_2020.nc
  (header \"file fuxi_vs_era5_240x121_2020.nc; region 34, lead_time 60 (hours), level 2\"), line \"seeps.total_precipitation_24hr,
  region global, lead_time 24 h: 0.147023;\": the metric SEEPS, the variable 24 h precipitation accumulation,
  a surface variable with no pressure level (subset), the region global (subset_used), the lead time 24
  h (lead_time) and the evaluation year 2020 (the benchmark version). SEEPS itself, lower is better, not
  the 1 - SEEPS the paper's figures plot (the Metric's pitfalls). The ground truth, ERA5, and the evaluation
  resolution, 240x121 (1.5 degrees), are named only by the file, because EvalConditions has no field for
  either. In the variable's units, which the file does not state. For precipitation every model is scored
  against ERA5, operational ones included (\"with the exception of precipitation which shows SEEPS (evaluated
  against ERA5 in all cases)\", src-weatherbench-2-arxiv-html). The row holds no value before 24 h (\"\
  seeps.total_precipitation_24hr, region global, lead_time 18 h: nan;\"), then reads 0.441186 at 120 h
  and 0.792962 at 240 h. The maintainers' caveat: \"We still include precipitation evaluation based on
  ERA5 here but advise caution when interpreting those results\" (src-weatherbench-2-arxiv-html). It and
  FuXi's Z500 claim, claim-1347a99e2e5a, share no key: the subset, the metric and the lead time differ.
  The paper's Table 1 lists FuXi's training data as ERA5 1979-2017 (src-weatherbench-2-arxiv-html), so
  the evaluation year is held out; maintainer-verified on the basis claim-1347a99e2e5a gives. The first
  SEEPS claim. SEEPS has no anchor (the entry's metrics_note), so neither IFS nor a floor stands beside
  it, and IFS stays a Baseline, never a competing claim. No headroom is computed (no_legitimate_aggregate)."

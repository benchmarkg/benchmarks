  grid. It and NeuralGCM ENS's Z500 claim, claim-b81ace24efa9, share no key: the subset and the lead time
  differ. The paper's Table 1 lists the ensemble's training data as ERA5 1979-2017 (src-weatherbench-2-arxiv-html),
  so the evaluation year is held out. maintainer-verified, but not independently: Google Research maintains
  WeatherBench 2 and develops NeuralGCM, which is why the entry sets maintainer-competes-on-own-benchmark.

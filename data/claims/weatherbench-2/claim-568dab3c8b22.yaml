  variable wind speed at 850 hPa (subset), the region global (subset_used), the lead time 168 h (lead_time)
  and the evaluation year 2020 (the benchmark version). The subset weatherbench-2#wv-ws850 names two quantities,
  the wind vector scored by RMSE and the wind speed by CRPS (\"850hPa Wind vector/speed WV/WS850 RMSE

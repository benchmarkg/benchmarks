  240 h, so the two do not agree; 120 h is inside both. The version scored: \"The model is trained using
  ERA5 data from 1979 to 2017 (incl.) with 2019 for validation and 2018, 2020 and 2021 for testing. Here
  we evaluate forecasts for 2020.\" (src-weatherbench-2-faq), so the evaluation year is held out and the
  maintainers say they evaluated it, which is the maintainer-verified basis. Same benchmark version, subset,
  metric and conditions record as claim-97ccdee40ee2, so the two share a comparability key and may be
  plotted together. At this cell the anchors are IFS HRES 304.354, scored against HRES t=0 rather than
  ERA5, and the climatology and persistence floors, 820.873 and 1049.58; no headroom is computed (no_legitimate_aggregate)."

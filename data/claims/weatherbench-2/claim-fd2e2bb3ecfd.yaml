  year 2020 (the benchmark version). The ground truth, ERA5, and the evaluation resolution, 240x121 (1.5
  degrees), are named only by the file, because EvalConditions has no field for either. In the variable's
  units, which the file does not state. The same row runs from 44.3158 at 24 h to 778.231 at 240 h. The

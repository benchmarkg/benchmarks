notes: "One point of the grid, not a summary. The maintainers' results file pangu_vs_era5_240x121_2020.nc
  (header \"file pangu_vs_era5_240x121_2020.nc; region 34, lead_time 40 (hours), level 3\"), line \"rmse.geopotential,
  region global, level 500, lead_time 120 h: 294.308;\": the metric RMSE, the variable geopotential at

notes: "The complete nodule detection track's results: \"In this track, the best score was achieved by
  ZNET with a CPM of 0.811.\" The track: \"The complete nodule detection track requires the participants
  to develop a complete CAD system, meaning that the only input into the system is a CT scan.\"; \"As
  of 31 October 2016, seven systems have been applied to the complete nodule detection track\". The metric
  is luna16-cpm, the mean FROC sensitivity at \"1/8, 1/4, 1/2, 1, 2, 4, and 8 FPs per scan\" over the
  reference nodules (\"We considered the 1,186 nodules annotated by the majority of the radiologists (at
  least 3 out of 4 radiologists) as the positive examples in our reference standard.\"). The system: \"\
  ZNET uses ConvNets for both candidate detection and false positive reduction.\"; \"Both candidate detection
  and false positive reduction stages were trained in a cross-validation using the provided folds from
  LUNA16.\" Gating (data.access fully-open): none. \"This data set can be used for training of the systems
  and the evaluation of the algorithms is performed on the same data set.\"; the reference standard is
  public, and what guards the number is the fold rule, \"Participants are required to perform 10-fold
  crossvalidation when they use the provided LIDC-IDRI data both as training and as test data.\" The organisers
  scored the submitted marks (\"Submitted results are automatically evaluated and presented on the website.\"\
  ), so the claim is maintainer-verified, not held-out-server. Training data: outside data was admitted
  in the same track, one entrant's description saying \"The LUNA16 data set was used for validation purposes
  only and was not used as training data.\" The track scores whole systems, not the supplied candidates,
  whose revisions are the entry's versions, so the claim names no version. The board's later and higher
  CPMs (the entry's learned_entrant_evidence) are other submissions."

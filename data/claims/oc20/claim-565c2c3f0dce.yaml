# data/claims/oc20/claim-565c2c3f0dce.yaml -- P3-S7-T04; an OCx24 claim from the OCx24 paper (04 S7): r-squared of the
# system ocx24-linear-h-oh-adsorption on the hydrogen evolution target, leaving one composition out. Ground truth is a
# wet-lab measurement, so the conditions name the paper as assay_protocol (04 S8). verification maintainer-verified, set
# by hand, and not the ledger's prospective-experiment: the measurements predate the model fitted to them (the notes).
# Content-derived id over (benchmark, system, metric, subset, value, source, date_reported) (05 S2), as
# tests/test_open_catalyst_ocx24_claims.py recomputes it; date_reported is the paper's v1 date. Not LLM-run, so it
# counts toward the >=60 non-LLM claims (tools/report/llm_run.py).
id: claim-565c2c3f0dce

notes: "OCx24 hydrogen evolution, leave one composition out: the R² of the OCx24 paper's linear model
  on H and OH adsorption energies, which predicts the cell voltage measured at 50 mA/cm2. Model (src-arxiv-2411-11783-v1):
  \"Models were trained to predict the cell voltage at 50 mA/cm2 production rate using the adsorption
  energies of H and OH as features\". Strategy (src-arxiv-2411-11783-v1): \"experimental voltage using
  LOCO cross validation is shown in Figure 4a and 4c\". Value (src-arxiv-2411-11783-v1): \"with R2 = 0.59
  for adsorption energies\". The value is the printed 0.59, a ratio and not a percentage, for the model
  of Figure 4a, which the same paragraph calls linear (\"Using these linear models, we performed inference\"\
  ). maintainer-verified: the maintainers fitted the model, scored it and reported it in their own paper,
  as The Well's and PDEBench's paper baselines are recorded. Not prospective-experiment, the rung the
  ledger asked for, because the ground truth existed before the model: rank 5 needs ground truth that
  \"did not exist at submission and was generated afterwards by the evaluator\" (taxonomy/verification.yaml),
  and here the paper asks \"whether models trained on experimental data using computational descriptors
  as input can produce results that are predictive of held out experimental data\", scoring each model
  by cross-validation over measurements taken before it was fitted, whose summaries are public (src-github-fairchem-docs-ocx24-d733f48).
  That the ground truth is a laboratory measurement is carried by the conditions record's assay_protocol."

notes: "OCx24 CO2 reduction, H2, leave one sample out: the R² of the OCx24 paper's random forest for the
  H2 production rate. Model (src-arxiv-2411-11783-v1): \"For each product, we independently fit a random
  forest regressor to predict the production rate\", and \"Boltzmann weighted adsorption energies and
  Matminer elemental features were used as inputs\". Target (src-arxiv-2411-11783-v1): \"we interpolate
  each product to a fixed applied potential of 3.3 V full cell voltage\". Value (src-arxiv-2411-11783-v1):
  \"When evaluating LOO performance, we capture fair correlations for H2 (R2 = 0.46)\". The value is the
  printed 0.46. The same model's CO and liquid-product values are other targets and are not claimed; no
  subset holds the product, so subset_used names it. maintainer-verified: the maintainers fitted the model,
  scored it and reported it in their own paper, as The Well's and PDEBench's paper baselines are recorded.
  Not prospective-experiment, the rung the ledger asked for, because the ground truth existed before the
  model: rank 5 needs ground truth that \"did not exist at submission and was generated afterwards by
  the evaluator\" (taxonomy/verification.yaml), and here the paper asks \"whether models trained on experimental
  data using computational descriptors as input can produce results that are predictive of held out experimental
  data\", scoring each model by cross-validation over measurements taken before it was fitted, whose summaries
  are public (src-github-fairchem-docs-ocx24-d733f48). That the ground truth is a laboratory measurement
  is carried by the conditions record's assay_protocol."

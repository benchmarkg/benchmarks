notes: "The team's paper, on the Open Development Phase: \"evidenced by our top-ranking performance with
  a score of 0.757 in the PI-CAI challenge\" and \"Our Z-SSMNet was ranked first place with an Average
  Precision (AP) score of 0.633 and an Area Under the Receiver Operating Characteristic (AUROC) score
  of 0.881 in the Open Development Phase\". The score is pi-cai-ranking-score: \"The overall ranking of
  each AI algorithm in the PI-CAI challenge was based on the average of these metrics.\" It is the paper's
  Table 2 (\"Table 2: Test results on Set 4. The models were trained on Set 1 or Set 2.\"), Set 4 being
  the testing cohort (\"Set 4 – PICAI Hidden Testing Cohort.\"; \"This cohort has 1000 hidden cases from
  the centers of RUMC, ZGT, PCNN, and NTNU.\"), and \"The Hidden Testing Cohort was then used to determine
  the top 5 performing algorithms.\" The team trained the model itself: \"Additionally, we evaluated our
  Z-SSMNet and other top-performing algorithms trained on Set 2 and tested on Sets 3 and 4.\", Set 2 being
  \"Set 2 – Partly manually labeled PI-CAI Public Training and Development Dataset including 1500 cases\"\
  . Gating (data.access private-test-server): the rules say that running every algorithm on the platform
  \"ensures that any image used for evaluation remains truly unseen\" (src-picai-phases-rules), so the
  claim is held-out-server. Training data: outside public data trained the zonal prior (\"to train a zonal
  segmentation model to generate the zonal anatomy prior.\"), as the prize track allowed (\"They can also
  use external datasets to train their AI algorithms. However, such data and/or models must be published
  under a permissive license\", src-picai-phases-rules). The team, not the organisers, reports the number;
  the boards that list it name submitters and are withheld, so they back no claim. The paper's Table 3
  gives the model's Closed Testing Phase score after the organisers retrained it, which is pi-cai#closed-testing
  and not this claim."

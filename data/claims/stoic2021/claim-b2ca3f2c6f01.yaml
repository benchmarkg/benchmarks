notes: "The Final phase winner, as the abstract gives it: \"The winning solution obtained an area under
  the receiver operating characteristic curve for discerning between severe and non-severe COVID-19 of
  0.815.\" The discussion names the team: \"team Code 1055, which achieved the highest AUC for discriminating
  between severe and non-severe COVID-19 in the Final phase\". The metric is the ranking AUC, stoic2021-severity-auc:
  \"Participants were ranked based on AUC for classifying COVID-19 severity, computed over cases with
  a positive COVID-19 RT-PCR result.\" The run: the organisers, not the team, trained the team's codebase
  (\"The challenge organizers generated training algorithms in the form of Docker [55] container images
  from the submitted code bases and applied these to training set B\"), and \"The models trained in the
  Final phase on training set B were evaluated on test set B.\" Gating (data.access private-test-server):
  \"All data except for the public training set A was kept secure on the grand-challenge.org platform
  at all times and could not be downloaded by participants at any point.\" The team saw neither the data
  its model was trained on nor the test scans (\"With T3, challenge organizers train a codebase provided
  by the participants on sequestered training data.\"), so the claim is held-out-server. The text read
  gives no interval for this value (Figure 4 plots the ROC curves with theirs). The results table repeats
  the value beside the other finalists, whose names include personal handles, and is not quoted. A Qualification-phase
  AUC, from a model trained on the 2,000 public scans, is a different subset and not comparable."

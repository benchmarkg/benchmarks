  Baseline model PDE Parameter Metric U-Net FNO PINN", the row "Advection β=0.1\beta=0.1 RMSE 3.1×10−23.1\times
  10^{-2} 4.1×10−34.1\times 10^{-3} 6.7×10−36.7\times 10^{-3}" gives FNO an RMSE of 4.1×10−3 (0.0041)
  on the advection equation at beta = 0.1, against U-Net 0.031 and PINN 0.0067. Direction (src-arxiv-2210-07182-v7-html):
  "Among the baseline surrogate models, FNO provides the best prediction for most metrics. It learns the
  differential operators well, leading to low errors". pdebench-rmse is an error norm whose optimum is
  zero; the value is the printed cell, not its complement, and it is never read as an accuracy or given
  a headroom. Forward problem, on the 10% test split; trained and scored by the paper's authors (maintainer-verified).

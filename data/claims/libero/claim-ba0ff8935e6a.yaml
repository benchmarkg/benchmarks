notes: "Table 12 of src-arxiv-2406-09246-v3-html, \"We report the success rate (SR) and standard error
  of each method for the four task suites in the LIBERO benchmark, averaged over three random seeds with
  500 trials each.\", columns \"LIBERO-Spatial LIBERO-Object LIBERO-Goal LIBERO-Long Average\", each an
  SR and a rank. The row \"Octo fine-tuned 78.9 ±\\pm 1.0% 2\": 78.9% on LIBERO-Spatial with a standard
  error of 1.0 over the three seeds, second of three. The OpenVLA authors fine-tuned and ran it as their
  baseline (\"Additionally, we evaluate Octo [5] fine-tuned on the target dataset\"), so the claim is
  theirs, not the Octo team's. It shares its conditions, and so its comparability key, with the OpenVLA
  claim. simulator_version null: neither the paper nor its code records the robosuite or MuJoCo release
  behind Table 12. At a793354, the commit that added the LIBERO evaluation (\"Add LIBERO sim eval script
  and instructions\", 2024-09-05, src-github-api-openvla-libero-requirements-commits-2026-11-24), the
  harness's requirements read \"imageio[ffmpeg] robosuite bddl easydict cloudpickle gym\", robosuite with
  no version and MuJoCo not at all (src-github-openvla-libero-requirements-a793354), and the README's
  list of the paper's package versions names Python, PyTorch, transformers and flash-attn but no simulator
  (src-github-openvla-readme-a793354). robosuite was pinned only three months later (\"Pin robosuite==1.4.1
  in libero_requirements.txt\", 2024-12-04), so a rerun from today's file need not match the paper's build."

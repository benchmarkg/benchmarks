notes: "Section 5.1, the first-place submission: \"This submission scored a 0.974 kidney Dice and a 0.851
  tumor Dice resulting in a\" first \"place 0.912 composite score.\" The composite is kits19-kidney-tumour-dice,
  the mean of kidney and tumour Dice over the test cases. Its model: \"an ensemble of the Residual 3D
  U-Net networks from all\" five folds, which the paper reads as nnU-Net's win (\"nnU-Net demonstrated
  top performance despite attempts by several teams to enhance it.\"; \"Instead, they won by a considerable
  margin by submitting the predictions of the baseline+residual connections model alone.\"). The test
  set: the challenge was built by \"holding a collection of 90 segmentation masks private for participants
  to predict given associated imaging.\" Gating (data.access train-open-test-held-out): \"On July 15,
  the test imaging was released (without labels) and the submission period was opened until July 29.\"\
  \ The team ran its model on released images and the organisers scored the returned masks against labels
  it never saw, so the claim is held-out-server, as the OC20 claims are, whose test labels are withheld
  the same way. Training data: \"External Data: Teams were permitted to use external data, as long as
  that data was publicly available.\" The section names the two researchers who made the submission; they
  are not named here, and the System is named for its method. The test labels were released later, inside
  the KiTS21 training set (the metric's pitfalls), so a later score on these 90 cases is not held out."

quote_extract: 'About us Search Hinxton CAPRI: Critical Assessment of PRediction of Interactions Announcement
  Signup / Login Call for targets Capri rules Past targets Management CAPRI Format CASP-CAPRI COVID19-CAPRI
  Publications Round 57 This is a CASP-CAPRI round This round is Closed Registration is closed Participant
  list Announcement Welcome to CAPRI Round 57: the 6th joint CASP-CAPRI Assembly Prediction challenge,
  run as part of the CASP16 prediction season. As previously, this Round will accept submissions by servers
  and predictors and will offer a scoring challenge whenever possible. The CASP16 season will open on
  May 1 and run through August 2024. Members of both the CASP and CAPRI communities will b … ounced as
  soon as they become available from CASP. As in previous CASP-CAPRI Rounds, the number or type of targets
  offered in this Round is currently unknown, as targets are being submitted piecemeal during the entire
  duration of the CASP16 session. Decision on targets designated for CAPRI docking and scoring predictions
  will be made by CAPRI MC members Alexandre Bonvin and Marc Lensink, and communicated to CASP. These
  targets will be earmarked as such in the CASP target list. CASP might run some additional experiments
  in which the stochiometry of a complex is not given. As CAPRI we decided to only include as CAPRI targets
  those for which the stochiometry is provided. Interested CAPRI participants can of course submit those
  “unknown stochiometry” targets directly to CASP. Target information: Information on the different targets
  and CAPRI submission deadlines (for servers, predictors and scorer) will be provided b … submitted models
  (to CAPRI or CASP) of homo- and hetero-complexes on CAPRI-selected targets will be evaluated by the
  CAPRI evaluation team as usual. Participant ranking will be done based on the 5 top ranked models as
  in previous CASP-CAPRI Rounds. The top 5 models submitted by CAPRI participants will also be evaluated
  by the CASP independent evaluation team. The CASP and CAPRI assessor teams will meet to discuss how
  the evaluation results will be published in the CASP15 Special Issue. For scoring, the top 10 models
  submitted by CAPRI participants will be evaluated by the CAPRI evaluation team. Targets Dates Registration
  starts: April 11, 2024, midnight CAPRI Target ID CASP Target ID Status Prediction Scoring Start End
  (server) End (human) Start End Target 236 T1201 Closed May 1, 2024, midnight May 4, 2024, midnight May
  15, 2024, midnight May 16, 2024, midnight May 24, 2024, 1 a.m. Target 237 T2201 Closed May 16, 2024,
  midnight May 22, 2024, 1 a.m. May 22, 2024, 6 p.m. May 22, 2024, 6:01 p.m. May 22, 2024, 6:02 p.m. Target
  238 H1202 Closed'

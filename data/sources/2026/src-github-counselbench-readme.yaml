quote_extract: "et Our benchmark contains two datasets: 1. CounselBench-Eval ([available](https://huggingface.co/datasets/izi-ano/CounselBench-Eval)
  on HuggingFace): 2000 human evaluations by 100 mental health professionals on [CounselChat](https://huggingface.co/datasets/nbertagnolli/counsel-chat)
  data. 2. CounselBench-Adv ([available](https://huggingface.co/datasets/izi-ano/CounselBench-Adv) on
  HuggingFace): 120 adversarial questions crafted by professionals targeting on six failure modes that
  we observed from CounselBench-Eval. Human annotations for CounselBench-Adv have also been [released](https://huggingface.co/datasets/izi-ano/CounselBench-Adv-human-annotation)
  on Hugging Face. ## Repository Overview ``` counselbench/ ├─ pr … ├─ clean_qualtrics_data.py │ ├─ extract_representative_qa.py
  │ ├─ run_adversarial_questions.py │ ├─ case_study.py # │ └─ sample_for_human_review.py # we sampled
  96 questions to check the alignment of GPT-4.1 as a judge and the human annotator ├─ config.json # Place
  API keys here (never commit!) └─ README.md ``` ## Implementation Details ### 0. Prerequisites - Add
  your API keys to config.json (template provided). - ```preprocess\\``` records how we preprocessed and
  sampled from CounselChat, and you don't have to run it as we already preprocessed the data. ### 1 …
  estions from CounselChat) ```generate_counselchat\\``` contains the code to generate model responses.
  (You may need to add appropriate input_file) ``` python generate_counselchat/evaluate_counsel_chat.py
  \\ --model_name MODEL_NAME \\ --prompt_name persona_survey \\ --temperature 0.7 \\ --file_name_addition
  ANY_FILENAME_ADDITION \\ # just for file naming -- … udges\\``` contains the experiments of LLM-as-Judges.
  All experiments are included in ```llm_as_judges\\scripts```. ### 3. Evaluate on CounselBench-Adv Adversarial
  evaluation code is in ```run_adversarial/```, with all experiments in ```run_adversarial/scripts/```.
  ### 4. Other Statistical Analyses #### Krippendorff's Alpha Calculati … five annotators. We compute
  Krippendorff’s alpha for each question individually and then report the mean across all questions. ####
  Significance Test We run Wilcoxon signed-rank test for checking: a) the difference of scores between
  model and online therapist responsese, evaluated by human annotators, b) the difference of scores provided
  by hu"

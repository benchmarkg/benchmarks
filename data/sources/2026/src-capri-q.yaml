quote_extract: 'ned structures using a set of metrics with proven robustness that have been established
  in the CAPRI community. In addition, several advanced benchmarking databases provide targets against
  which users can test docking and assembly modeling software. These include the Protein-Protein Docking
  Benchmark, the CAPRI Scoreset, and the Dockground database, all developed by members of the CAPRI community.
  Here we present CAPRI-Q, a stand-alone model quality assessment tool, which can be freely downloaded
  or used via a publicly available web server. This tool applies the CAPRI metrics to assess the quality
  of query structures against given target structures, along with other popular quality metrics such as
  DockQ, TM-score and l-DDT, and classifies the models according to the CAPRI model quality … average
  of the scores with these thresholds. CAPRI overall model quality In order to define the quality of the
  model overall, CAPRI classifies predicted structures onto four quality categories, based on the values
  of fnat, L-RMSD, and i-RMSDbb [24]: high quality, (fnat ≥ 0.5) and either (L-RMSD ≤ 1.0 Å) or (i-RMSDbb
  ≤ 1.0 Å); medium quality, (fnat ≥ 0.3) and either (L-RMSD ≤ 5 Å) or (i-RMSDbb ≤ 2.0 Å); acceptable quality,
  (fnat ≥ 0.1) and either (L-RMSD ≤ 10 Å) or (i-RMSDbb ≤ 4 Å); and incorrect, (fnat < 0.1) or (L-RMSD
  > 10.0 Å) and (i-RMSDbb > 4.0 Å). These criteria are applied in reverse order. Model quality based on

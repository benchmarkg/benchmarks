quote_extract: 'a thorough review of model evaluation issues in the recent MS/MS machine learning literature,
  using the standard MassSpecGym benchmark suite as a case study to illustrate the impact of these issues.
  We find evaluation issues in at least 18 of 26 papers reporting MassSpecGym benchmark results in the
  first year of its adoption. We isolate three classes of failures: (i) data leakage, (ii) shortcut learning,
  and (iii) implementation bugs and metric divergence. Through extensive experimentation and code replication,
  we quantif … and hyperparameter search further raises the standard required of benchmark design: a benchmark
  must be sufficiently transparent that optimization against its blind spots does not go undetected [5].
  Over the last year, MassSpecGym [8] has quickly emerged as the major benchmarking suite for machine
  learning in computational metabolomics. MassSpecGym formulates the problem of inferring molecular structures
  from tandem mass spectra as a set of standardized machine learning tasks, including: (i) the spectrum
  simulation challenge, in whi … y introducing a Maximum Common Edge Subgraph (MCES) [16] distancebased
  train–validation–test split that ensures molecules across data partitions are not similar more than
  an MCES edit distance of 10. Moreover, it introduces two explicit tracks of competition, one where formula
  is assumed to be known (the formula-based bonus challenge) and the second where it is not known (the
  mass-based challenge). Data leakage can still occur when models use external pr … ven an MS/MS spectrum,
  and a decoder model generates a molecule given the predicted fingerprint. Here, we demonstrate a common
  pattern of MassSpecGym adoption leading to limited model generalization: using decoders (§4.1) or encoders
  (§4.2) pretrained on data overlapping with the MassSpecGym test set, or on synthetic data from simulators
  that violate the test structure exclusion. Additionally, we show how models that use chemical-formula-based
  encoders leak ground-truth formulas into the mass-bas … veloped are marked with a †. Further details

  'in the wild'. The data is obtained from YouTube videos of celebrity interviews, as well as news shows,
  talk shows, and debates - consisting of audio from both professionally edited videos as well as more
  casual conve … cks VoxSRC 2023 will feature four tracks. All four tracks are identical to previous year.
  Track 1, 2 and 3 are speaker verification tracks, where the task is to determine whether two samples
  of speech are from the same person. Track 4 is a speaker diarisation track, where the task is to break
  up multi-speaker audio … Description Track 1 Fully supervised speaker verification (closed train set)

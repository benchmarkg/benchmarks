  Comparison: VRMSE metrics on test sets (lower is better). Best results are shown in bold. VRMSE is scaled
  such that predicting the mean value of the target field results in a score of 1. To showcase the dataset
  and the associated benchmarking library, we provide a set of simple baselines time-boxed to 12 hours
  on a single NVIDIA H100 to demonstrate the effectiveness of naive approaches on these challenging problems
  and motivate the development of more sophisticated approaches. These baselines are trained on the forward
  problem - predicting the next snapshot of a given simulation from a short history of 4 time-steps. The
  models used here are the Fourier Neural Operator [97, FNO], Tucker-Factorized FNO [98, TFNO], U-net
  [99] and a modernized U-net using ConvNext blocks [100, CNextU-net]. The neural operator models are
  implemented using neuralop [101]. We emphasize that these settings are not selected to explore peak
  performance of modern machine learning, but rather that they reflect reasonable compute budgets and
  off-the-shelf choices that might be selected by a domain scientist exploring machine learning for their
  problems. The … e common Normalized RMSE (NRMSE) – also defined in the appendix – as we feel the centered
  normalization is more appropriate for non-negative fields such as pressure or density whose mean is
  often bounded away from zero. NRMSE, whose denominator is the 2-norm, down-weights errors with respect
  to these fields even if they have very little variation. We report evaluation on the test set of each
  model with hyperparameters performing best on the validation set. Analysis. In the next-step prediction
  setting, the CNextU-net architecture outperforms the others on 8 of the 17 experiments. However, what
  is very interesting is that there is a noticeable split between problems which favor spatial domain
  handling and those which prefer the spectral approach. At the one-step level, 9/17 favor U-net type

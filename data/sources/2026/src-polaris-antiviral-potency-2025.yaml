  (SARS-CoV-2 Mpro) float Negative log10 of the IC50 values of the dose-response curve pIC50 (MERS-CoV
  Mpro) float Negative log10 of the IC50 values of the dose-response curve At test time, we will only
  provide the CXSMILES. 🧑‍💻 Get started We provide notebooks to get started with the challenge that cover
  several important topics, such as how to prepare your submission and the data format. Get started here.
  ✂️ Split We used a temporal split. This accurately represents a real-life drug discovery situation where
  you train on historical data to be able to make the optimal model for the next period of prospective
  predictions. This means that there may be some overlap in the chemical space between the training and
  test set. ✅ Evaluation criteria The challenge will be judged based on the judging criteria outlined
  here. You must provide predictions for both Mpro targets. We will evaluate your submission using the
  mean absolute error of the predicted endpoint. You can enter as many times as desired, but we will only
  evaluate your last submission. In the open science spirit of ASAP Discovery we would love to see open
  code showing how you created your submission if possible. If not, we require at least a written report.
  🏆 Prizes We will be offering Polaris merch packs to the three top performing teams for each sub-challenge.

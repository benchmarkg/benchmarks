  = {\\url{https://github.com/duckietown/gym-duckietown}}, } ``` This simulator was created as part of
  work done at [Mila](https://mila.quebec/). Welcome to Duckietown! ## Introduction Gym-Duckietown is
  a simulator for the [Duckietown](https://duckietown.org) Universe, written in pure Python/OpenGL (Pyglet).
  It places your agent, a Duckiebot, inside of an instance of a Duckietown: a loop of roads with turns,
  intersections, obstacles, Duckie pedestrians, a … r a more robust policy/model. `gym-duckietown` is
  an _accompanying_ simulator to real Duckiebots, which allow you to run your code on the real robot.
  We provide a domain randomization API, which can help you transfer your trained policies from simulation
  to real world. Without using a domain transfer method, your learned models will likely overfit to various
  aspects of the simulator, which won't transfer to the real world. When you deploy, you and your Duckiebot
  will be running around in circles trying to figure out what's going on. The recommended way to test
  your model on the real hardware is to use [one of the AI Driving Olympics templates](https://docs-old.duckietown.org/daffy/AIDO/out/embodied.html).
  We have some baseline RL implementations that also may be useful for this purpose, [on"

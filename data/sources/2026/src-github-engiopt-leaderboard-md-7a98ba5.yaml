quote_extract: "Neither defense helps with the other. - Against **fabrication**: re-execution. Nothing
  is ranked until a runner has fetched the weights itself and reproduced the score. - Against **gaming**:
  measurement. The scoring protocol is public and cannot be … sible on the board and absent from the ranking
  until a runner re-scores them. **The last step needs write access to the board repository.** `--push-to`
  uploads the merged CSV directly, so submission is currently open … source local` produces exactly such
  a row. **Run the seeds the spec asks for.** `EvalSpec.required_seeds` is `(1, 2, 3)`, and an entry missing
  any of them is published but not ranked. This is the cherry-picking rule: a count would still let you
  run twenty seeds a … while every individual row stays honest. Naming the seeds removes the choice. **You
  cannot mark your own row verified.** `push_to_hub` clears the column. ## Verification ```bash # audit
  anyone's row … e runner's own numbers, not a verdict on yours. That distinction is deliberate. Sampling
  from one seed on different hardware genuinely produces different designs — CUDA and CPU draw different
  values from the same generator state — so a pass/ … the runner itself needs isolation, no credentials,
  and time and memory limits. None of that is built here, because nothing outside `IDEALLab` can submit
  yet: `--push-to` still requires write access to the board. The two are the same pie … before the thing
  that consumes it means guessing at what it needs. Until then, the runner is run by hand against checkpoints
  whose origin is known. ## What gets ranked A row is published if it can be checked, and ranked if chec
  … rank one is a statement about what its number measures. Only the second scales. To be ranked, a row
  must be `verified`, carry no disqualifying flag, and belong to an entry covering every required seed.
  | Flag | Trips when | |---|---| | `unverified` | No runner has reproduced it ye … mes the condition
  seed, the sample count, and a digest of the drawn conditions, so anyone can recompute exactly which
  50 test rows are scored — and the dataset supplies the optimal design for each of them. A lookup table
  … would actually close it Scoring on conditions that have no published solution. A v2 spec would draw
  conditions from the condition space rather than from dataset rows, and carry the reference *objective*
  for each — computed once by whoever freeze"

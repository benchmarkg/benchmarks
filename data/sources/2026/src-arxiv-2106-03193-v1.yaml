quote_extract: e they are constructed using semi-automatic procedures. In this work, we introduce
  the FLORES-101 evaluation benchmark, consisting of 3001 sentences extracted from English Wikipedia
  and covering a variety of different topics and domains. These sentences have been translated in
  101 languages by professional translators through a carefully controlled process. The resulting
  dataset enables better assessment of model quality on the long tail of low-resource languages,
  including the evaluation of many-to-many multilingual translation systems, as all translations are

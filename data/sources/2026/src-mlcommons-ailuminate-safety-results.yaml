  · AILuminate Safety 1.2.1 · English (US) · published October 29, 2026 MLCommons began running the
  Safety 1.2.1 benchmark on September 22, 2026. As of October 29, 2026, this document reports
  Official results for 27 systems, and the run is ongoing. Each system has an overall percentile
  score and a score for each of the 12 hazard categories, all on a scale from 0 to 100 calibrated
  against a fixed set of reference systems. The composition of the reference set is fixed before a
  benchmark version … age, text-to-text requests in 12 hazard categories. The overall score weights
  all 12 categories equally. A hazard-category score shows where a system falls short. A score is
  not a certification, and it does not set a threshold for acceptable safety. Only results labeled
  AILuminate Safety 1.2.1, English (US), compare directly with these scores; grades from Safety 1.0
  are not comparable. Results Detailed reports for all 27 systems give each system’s percentile
  score in each of the 12 hazard categories, with a citation ready to copy. Open-weight models These
  are standalone models with no external guardrails or other moderation logic

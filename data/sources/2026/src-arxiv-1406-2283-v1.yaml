quote_extract: 'these ﬁtting sources of data. 4.1 NYU Depth The NYU Depth dataset [18] is composed of
  464 indoor scenes, taken as video sequences using a Microsoft Kinect camera. We use the ofﬁcial train/test
  split, using 249 scenes for training and 215 for testing, and construct our training set using the raw
  data for these scenes. RGB inputs are downsampled by half, from 640x480 to 320x240. Because the depth
  and RGB cameras operate at different variable frame rates, we associate each depth image with its closest
  RGB image in … out depths equal to the minimum or maximum recorded for each image. The training set
  has 120K unique images, which we shufﬂe into a list of 220K after evening the scene distribution (1200
  per scene). We test on the 694-image NYU Depth v2 test set (with ﬁlled-in depth values). We train coarse
  network for 2M samples using SGD with batches of size 32. We then hold it ﬁxed and train the ﬁne network
  for 1.5M samples (given outputs from the already … D on KITTI using a subset of 700 images (25 per scene),
  as the system was unable to scale beyond this size. Depth targets were ﬁlled in using the colorization

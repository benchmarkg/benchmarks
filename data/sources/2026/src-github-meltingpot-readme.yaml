  ## About Melting Pot assesses generalization to novel social situations involving both familiar and
  unfamiliar individuals, and has been designed to test a broad range of social interactions such as:
  cooperation, competition, deception, reciprocation, trust, stubbornness and so on. Melting Pot offers
  researchers a set of over 50 multi-agent reinforcement learning _substrates_ (multi-agent games) on
  which to train agents, and over 256 unique test _scenarios_ on which to evaluate these trained agents.
  The performance of agents on these held-out test scenarios quant … tions where individuals are interdependent,
  * interact effectively with unfamiliar individuals not seen during training The resulting score can
  then be used to rank different multi-agent RL algorithms by their ability to generalize to novel social
  situations. We hope Melting Pot will become a standard benchmark for multi-agent reinforcement learning.
  We plan to maintain it, and will be extending it in the coming years to cover more social interactions
  and generalization scenarios. If you are interested in extending Melting Pot, please … tion Melting
  Pot is available on PyPI](https://pypi.python.org/pypi/dm-meltingpot) and can be installed using: ```shell
  pip install dm-meltingpot ``` After doing this you can then `import meltingpot` in your own code. NOTE:
  Melting Pot is built on top of [DeepMind Lab2D](https://github.com/google-deepmind/lab2d) which is distributed
  as pre-built wheels. If there is no appropriate wheel fo … ion The [evaluation](https://github.com/google-deepmind/meltingpot/blob/main/meltingpot/utils/evaluation/evaluation.py)
  library can be used to evaluate [SavedModel](https://www.tensorflow.org/guide/saved_model)s trained
  on Melting Pot substrates. Evaluation results from the [Melting Pot 2.0 Tech Report](https://arxiv.org/abs/2211.13746)
  can be viewed in the [Evaluation Notebook](https://github.com/google-deepmind/melting … ch, Igor and
  Mobbs, Dean and Leibo, Joel Z}, journal={arXiv preprint arXiv:2211.13746}, year={2022} } ``` ## Disclaimer

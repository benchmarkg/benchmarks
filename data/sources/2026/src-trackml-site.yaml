quote_extract: 'article tracking challenge Welcome Data International Advisory Committee Organisation
  Results (NEW) Schedule Social TrackML particle tracking challenge Welcome The competition is finished!
  Check the results. Can Machine Learning (ML) assist High Energy Physics (HEP) in discovering and characterizing
  new particles? We have organized a data science competition to sti … e organized the TrackML challenge,
  which objective is to use machine learning to quickly reconstruct particle tracks from points left in
  the silicon detectors. The challenge has been conducted in two phases: the Accuracy phase May-Aug 2018
  : favoring innovation of algorithms reaching the highest accuracy, with no speed concern.This phase
  has been accepted as an of … e organized, in particular a dedicated workshop on Advanced Pattern Recognition
  at Institut Pascal at Université Paris-Saclay in Oct 2019 (on invitation only). The challenge dataset
  will be released for further studies on CERN Open Data portal. In more details : for each collision,
  about 10.000 space tracks (helicoidal trajectories originating approximately from the center of the
  detector), will leave … ociated together. The Accuracy phase focusses on reaching the highest score.
  The participant train on a large dataset, apply their algorithm on a test dataset (for which the ground
  truth is held out on the challenge platform), and submit their solution ( a text file specifying the
  grouping of the 3D points). The challenge platform computes the score from a fraction of the test data'

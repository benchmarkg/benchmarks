  chatbot gen AI system. These exercise the system-under-test (SUT) … n do so in a variety of ways: through
  a single model, an ensemble of models, or a mixture of model(s) and algorithm(s). For official online
  testing, the model must be available from a hosting service or through an API. Who should use the benchmark
  The AILuminate benchmark is designed for: Responsible AI technical teams who want to inte … data scientists,
  and researchers tuning or training interactive LLMs who want a standard tool for measuring alignment.
  You can keep testing with our practice test tool until your model is ready, then submit it to our service

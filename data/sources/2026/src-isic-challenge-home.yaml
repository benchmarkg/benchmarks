  Welcome to the ISIC Challenge Beginning in 2016, ISIC has sponsored annual challenges for the
  computer science community in association with leading computer vision conferences. Over the
  years, the challenges have grown in scale, complexity, and participation, using high-quality
  human-validated training and test sets of thousands of images and metadata. The earlier challenges
  were focused primarily on diagnostic accuracy for distinguishing dermoscopic photos of melanoma
  from other skin lesions. By 2018, the diagnostic performance of the leading algorithms was
  consistently outperforming clinicians in "reader studies". Challenges in 2019 and 2020 were
  designed to address out-of-distribution classes and assess the impact of clinical context,
  respectively. The challenge in 2024 shifted focus from dermoscopy to 3D total-body-photography and
  involved 3,400 participants. In addition to the annual Grand Challenges, ISIC hosts "live
  challenges" that allow researchers and students to benchmark the performance of their algorithms
  using ISIC images on an ongoing basis. About the ISIC Archive The International Skin Imaging
  Collaboration (ISIC) is an international effort to improve melanoma diagnosis, sponsored by the
  International Society for Digital Imaging of the Skin (ISDIS). The ISIC Archive contains the
  largest publicly available collection of quality controlled dermoscopic images of skin lesions.

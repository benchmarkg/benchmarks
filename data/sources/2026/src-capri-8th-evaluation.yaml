  is properly cited.ABSTRACT We report on the 8th CAPRI Evaluation period, capturing the assessment of
  CAPRI Rounds 47 to 55 (excluding the CASP and COVID‐related Rounds), which have witnessed the transition
  to AI‐driven prediction tools such as AlphaFold and related alternatives. The prediction Rounds in this
  evaluation are characterized by a high level of difficulty due to various factors, including the nature
  of the targets, the intricacy of the interfaces to be predicted, and conformational changes. A total
  of 11 targets encompassing 21 interfaces, mostly in the difficult prediction category, were evaluated.
  While a retrospective analysis reveals a strong performance of AlphaFold on those targets, human predictors
  still outperform AI on difficult targets, particularly those involving antibodies and nucleic acids.
  Almost 25 years after its birth, CAPRI remains a vibrant and collaborative initiative with active participation
  from approximately 50 predictor and scorer groups and 10 servers. Continued contributions from experimentalists
  providing targets to such blind experiments, and further advances in AI, sampling strategies, and improvement
  in scoring methods will be key to overcoming remaining structural prediction challenges in c … PRI,
  protein complexes, protein docking, scoring, structure prediction statusreleaseddisplay-pdfyesis-in-collection-domainyesis-olfnois-manuscriptnois-preprintnois-journal-matternois-scannednois-retractedno
  Revised 2025 Jun 26; Received 2025 May 26; Accepted 2025 Jun 30; Issue date 2026 Nov. 1.Introduction
  Biomolecular interactions govern a wide range of cellular and intercellular activities. Characterizing
  these interactions at the atomic level is essential for understanding the mechanisms underlying health
  and di … computational side, docking methods that are generating 3D models of biomolecular complexes
  from their free components have contributed since ~50 years to populating the interaction landscape.
  In order to provide an unbiased assessment of the field, CAPRI (Critical Assessment of PRedicted Interactions)
  was established in 2001 as a community‐wide initiative, inspired by CASP (Critical Assessment of protein
  Structure Prediction) [5]. Its main goal is to assess the current state of the art and catalyze progress
  in computational methodology for modeling protein complexes. It has done so by offering participants
  the opportunity of testing their algorithms in blind predictions of experimentally determined 3D structures
  of protein complexes, the ‘targets', provided to CAPRI prior to publication. CAPRI's focus over the
  years has been mainly on protein–protein assemblies [6], but other types of complexes have been included,
  such as protein‐nucleic acids, protein‐peptides and protein‐glycans [7, 8, 9, 10, 11]. Due to the paucity
  of available protein complexes that can be used as targets, a CAPRI prediction Round is initiated each
  time a target (or a few targets) becomes available and completed three to 6 weeks later. Targets are
  structures of protein complexes/assemblies offered in strict confidence to CAPRI by structural biologists
  prior to publication. Registered participants are invited to predict the 3D structure of the target
  protein assembly starting typically from sequence information alone. A Round also includes a scoring
  challenge in which the correct assembly models must be identified out of a pool of decoys (incorrect
  models) submitted by the participating predictors. Groups can participate in either or both challenges
  (as predictors and scorers). Servers can also participate in CAPRI and do so with a much shorter prediction
  time of at most 3 days. Historically, most predictions in CAPRI originate from docking and related conformational
  sampling approaches, often using shape complementarity with various other energy‐based terms to score
  the models [5, 12]. With the publication of AlphaFold2 (AF) in 2021 [13], artificial intelligence (AI)
  quickly entered the CAPRI prediction field. This catalyzed the d … like MassiveFold [20], but this comes
  at very high computational costs. In the current manuscript, we describe CAPRI Rounds 47 to 55 (excluding
  the CASP Rounds 50 and 54, and the COVID effort—Round 51) which have, halfway, witnessed the rise of
  AI. As of Round 53, AI prediction methods have been integrated into most prediction pipelines of the
  participating groups. These Rounds were discussed at the 8th CAPRI Evaluation Meeting, which took place
  in Grenoble in February 2024. AlphaFold2 itself is now used by the CAPRI assessors to define a prediction
  accuracy baseline and assess the difficulty of a target. In the following, we first briefly present
  the targets and the assessment methodology and then discuss the overall results and groups' performance,
  distinguishing between the pre‐ and post‐AlphaFold era. 2.The Targets Information on the targets of
  t … order. With one exception, all targets were deemed Difficult. The modeling tasks were various: prediction
  of domain organization, homo‐ and hetero‐dimer interaction, loop modeling, and protein‐DNA, protein‐nanobody,
  and antibody–antigen interaction. The 10 targets are depicted in Figure 1. TABLE 1 The CAPRI targets
  of the 8th Evaluation period. Round Target Stoichiometry #int, #tgt Area/Å2 Experimental technique Resolution
  PDB Type Difficulty Pre‐AlphaFold targets R47 T160 A 6, 6 150–500 X‐ray 2.7 Å 6HHU Domain organization
  Difficult … dy/peptide Difficult T232 A:B 1, 1 1500 cryo‐EM N/A N/A Protein/protein Easy T233 AB:HL
  1, 1 1650 X‐ray N/A N/A Antibody/antigen Difficult T234 AB:HL 1, 1 1350 X‐ray N/A N/A Antibody/antigen

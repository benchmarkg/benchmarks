  3** 9 Oliva 20 4/2** 6 2 … 2/1** is obtained, bearing in mind that the protein dimer interface of T187
  was not a target. Comparing the AlphaFold performance on the pre‐AlphaFold targets to that of the best
  predictors, it is obvious that AlphaFold generated far better models. Prior to the public release of
  AlphaFold, the CASP14/CAPRI prediction Round was held, with results presented at the on‐line CASP14
  meeting [22]. Targets presented there were also not part of the AlphaFold training data, so we can apply
  vanilla AlphaFold to that set as well, and compare to the results obtained here. The score of the …
  repancy is only due in part to the fact that scorer ranking considers the top‐10 submissions, as opposed
  to top‐5 for predictors. Scorer Venclovas, for instance, would still rank first—with 10/3**—if only
  the top‐5 were taken into consideration, but would fall to third position for top‐1 ranking, scoring
  only 2**. In contrast to this, predictor Venclovas ranks first in all three cases, with 7/4** for both
  top‐10 and top‐5, and 6/3** for top‐1. The Scoring Experiment in CAPRI, originally suggested at the
  CAPRI meeting in Gaeta, Italy in 2004, and implemented for the third CAPRI meeting in Toronto, Canada,
  significantly enriches in correct structures the set of structures one can choose from [7, 8]. Paradoxically
  though, this makes identifying good models easier, but identifying the best models more difficult. Figure
  7 shows the rank consistency for … f HDOCK. 7.Conclusion and Discussion The CAPRI 8th Evaluation results
  were originally presented at the 8th CAPRI assessment meeting, which took place in Grenoble, France,
  in February 2024, kindly organized by Sergei Grudinin and local co‐organizers. The assessment presented
  here has been carried out over 11 target complexes representing a total of 24 evaluated interfaces.
  The large difference between the number of targets and evaluated interfaces comes mainly from T160,
  which was basically 3 targets combined into one (the domain organization and two nanobodies binding
  to it), but also the domain organization itself w … tings where targets can be released for prediction
  at any time during the year and on short notice. Furthermore, with such large datasets of models, scoring
  might remain the main limiting factor, as indicated in the latest CASP16 assessment meeting, the analysis
  of which will be published later this year. Also in this CAPRI Evaluation Round scorers were in most
  cases not able to select the best quality models from the scoring sets. Next to the CAPRI community,
  which continues relentlessly to participate in this experiment despite the frustration of tackling such

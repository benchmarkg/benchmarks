  whose results are detailed elsewhere [21, 22]. #int. stands for the number of interfaces, and #tgt for
  the number of (sub)‐targets. The difficulty level is assigned manually, based on template availability
  (pre‐AlphaFold) or AlphaFold performance (post‐AlphaFold). FIGURE 1 The 10 CAPRI … ed by Matti Pronker
  and Bert Janssen from Utrecht University, The Netherlands, and is now published as PDB ID 8RMO [28].
  Target T232, featuring a phosphatase‐regulator complex, was provided by Wei Huang from Case Western
  Reserve University, USA, and is not yet published. A low‐resolution crystal structure of the same complex
  existed, but it was not found to fit the EM density map. Targets T233 and T234, finally, were two antibodies
  bound to the human Major Histocompatibility Complex‐I. They were offered to CAPRI by Josan Marquez from
  EMBL Grenoble, France, and are also not yet published. 3.Participation Statistics A total of 64 groups
  participated in the six CAPRI Rounds evaluated here. These can be categorized into 61 predictor and
  53 scorer groups, with a significant overlap between the two. Table 2 lists the number of registered
  groups (A) and the number of submitted models (B), with a subdivision into pre‐ and post‐AlphaFold Rounds.
  TABLE 2 CAPRI 8th Evaluation period participation statistics. Overall Pre‐AlphaFold Post‐AlphaFold Tota
  … groups that actually submit models. The higher total number of models, which includes the predictor
  models that go into the Scoring Experiment (see caption of Table 2), is consistent with this analysis.
  4.Assessment Criteria and Performance Ranking The classical CAPRI evaluation and ranking protocols were
  used to assess the quality of submitted models for most targets [7, 29, 30]. The protocol was modified
  for the antibody‐peptide target T231 of Round 55 as previously to account for the smaller interaction
  surface [11]. Briefly, to assess the quality of modeled complexes, the native contact recall (f nat)
  was calculated on residue‐residue contacts using a 5 Å distance threshold (4 Å for antibody‐peptide).
  Two residues are considered to be in contact if any of their heavy atoms are within the defined distance
  cutoff of one another. This metric is complemented by two rmsd‐based quantities: the interface rmsd
  i‐rms (residues … ated over the ligand main‐chain atoms after optimally superimposing the receptor entities,
  with the receptor defined as the larger entity of the binding partners. Additional metrics are calculated
  as well, but these are not used to rank predictions. The CAPRI assessment is interface centric. Individual
  interfaces are each assessed separately, with selected combination operators applied to assess the quality
  of a target as a whole. We use “target” to refer to any ground‐truth structure submitted for blind prediction.
  When a target is too … s ranked as previously described [11]. Briefly, the global score, Score_G, is
  calculated as follows: Score_G=ω1NACC+ω2NMED+ω3NHIGH Here, N represents the number of targets for which
  at least an acceptable, medium, or high‐quality model was obtained. The weighting factors ω were taken
  as 1, 2, and 3, resp. 5.Prediction Results In the following, we summarize the prediction results for
  the different targets in chronological order and present the global performance ranking across groups
  and automatic servers. The performance of predictors and servers was ranked on the basis of the best
  model in the top five submissions for each target; for scorers, this was the top 10 submissions for
  each target. A full account of all the results for these targets is available at the official CAPRI
  website (https://www.capri‐docking.org/assessment). The results are split into the pre‐ and post‐AlphaFold
  era. For an overview of the CAPRI timeline, we refer to Figure 2. FIGURE 2 The timeline of the 8th CAPRI
  Evaluation period. CAPRI Rounds and Meetings … acceptable models for T188 are encircled. Round 55 represents
  the first true post‐AlphaFold CAPRI Round, in the sense that by now all participants had incorporated
  AlphaFold in one way or another into their pipelines. For all targets in this Round, the default 25
  models as calculated by AlphaFold v2.3 were made available to predictors. The only “conventional” target
  in that Round was T232, an enzyme/inhibitor complex featuring a serine/threonine phosphatase in complex
  with its regulator TIPRL. A 3.8 Å crystal structure of the complex existed (PDB ID 5W0W) [31], which
  was not comp … 1.18 Å), was not identified by any of the scorers. 5.3. AlphaFold Performance On July
  15th, 2021, AlphaFold v2 was published with open source code [13]. Less than 2 weeks later, the DeepMind
  and ColabFold notebooks ensured global accessibility [32]. Rounds 47–49 and 52 of this Evaluation period
  were held before the release of AlphaFold, and Rounds 53 and 55 were held after. While the first AlphaFold‐Multimer
  version (v2.1) became available on Oct 5th, 2021, it was plagued by clashes and unrealistic protein
  structures. An updated version, v2.2, was released 6 months later, and by the time Round 55 was organized,
  all predictors had fully integrated AlphaFold into their respective pipelines. It was for obvious reasons
  not used before R53, whereas for R53, AlphaFold was used “as is”, often only in monomer mode. Both AlphaFold
  v2.1 and v2.2 were parameterized on the PDB data set up to April 2018. Since all targets of this evaluation
  period were released afterwards, they fall out of the training set and could therefore be predicted
  with AlphaFold, which we did. In order to avoid introducing any bias due to template availability, the
  template date limit for any target was set to the first of the month that the respective target was
  released, for … own; the loop, yellow. The AlphaFold model (ranked 1) is superimposed onto the reference
  structure and colored gray. This model is of high quality, that is, both L‐rms and i‐rms values are
  below 1 Å. 6.Performance of Predictors, Servers, and Scorers Groups (predictors, servers, and scorers)
  were ranked according to their prediction performance over the 10 targets evaluated here (21 (sub)‐targets).
  This ranking represents the official performance ranking for the 8th Evaluation period, comprising Rounds
  47–49, 52, 53, and 55. The ranking includes contributions from both the pre‐ and post‐AlphaFold Rounds,
  which are listed separately. In addition, we also discuss the performance of vanilla AlphaFold. For
  a full account of the results obtained by each group, we refer the r … dels (see the following subsection),

quote_extract: "g ControlArena: A library for running AI control experiments Our dedicated library to
  make AI control experiments easy, consistent, and repeatable. — Oct 22, 2025 Today, we’re launching
  ControlArena, a library for running AI control experiments. As AI systems become more powerful and autonomous,
  ensuring that they remain under human control is one of the central challenges of AI security. If …
  mplementations of common control protocols, and a lightweight interface for running control experiments
  built on top of our popular Inspect platform. It is our hope that a standardised platform for control
  evaluations can cut development time and make results easier to share and reproduce. ControlArena has
  already been used by researchers at leading frontier AI developers and AI security organisations, including
  Anthropic, Google DeepMind, Redwood Research and others. You can browse a few early publications using
  ControlArena on our website. How it works To make this concrete, consider a simple example: you want
  to … ena, where the model’s main task is updating cloud deployment configurations, while its side task
  is to introduce vulnerabilities to weaken security. ControlArena settings provide the complete environment,
  including the codebase, available tools, and ways to score both successful legitimate work and successful
  attacks. Policies define how models should behave during testing. For example, the \"untrusted model\"\
  \ policy uses a powerful model and, in testing, allows the red team to explicitly instruct it to attempt
  sabotage. The \"trusted model\" policy wraps a weaker model that's safe but produces lower-quality code.
  Monitors are additional AI models which assess the outp … ep-by-step tutorial for running your first
  control experiment in ControlArena. For more advanced use cases, you can find our full documentation
  here. The AI Security Institute is a research organisation within the Department of Science, Innovation
  and Technology. AISI Home About us Grants Careers Our WOrk Blog Research Research Agenda Connect Department
  for Science, Innovation and Technology LinkedIn Twitter S"

quote_extract: 'ty scores, which quantify how closely each variant aligns with content seen during pretraining.
  Using this framework, we evaluate six QA datasets and eight LLMs with publicly available training data.
  Our experiments reveal that LLM performance declines as reading passages naturally diverge from the
  versions encountered during pretraining—even when the question and all necessary information remains
  present at inference time. For instance, average model accuracy on BOOLQ drops by over 30% from the
  highest to lowest similarity bins, with slopes exceeding 70 across several LLMs. These findings suggest
  that natural text evolution poses a significant challenge to the language understanding capabilities
  of LLMs. 1 Introduction Larg … .3-0.4 0.2-0.3 0.1-0.2 0.0-0.1 (c) HOTPOTQA Figure 3: Average accuracy

  performs best across all benchmark tasks, which illustrates the different challenges and scope for future
  research captured by this this dataset and the proposed benchmarks. Random forests perform well across
  all tasks, but the poor F1 scores in Kenya and Brazil suggest they may be poorly cali … te as new agricultural
  datasets are released, we plan to incorporate new datasets as they become available and allow others
  to do the same. (As new datasets are added, new benchmark tasks may also be added but existing task
  deﬁnitions will not be changed to maintain inter-comparison.) To this end, we decoupled the input datasets
  from the CropHarvest package so that only a single ﬁle needs to be added for a new dataset to be added
  to CropHarvest. Instructions for how to do this … One challenge resulting from this decoupling is that
  direct algorithmic comparisons using CropHarvest depend on the data being consistent. We therefore couple
  the CropHarvest python package version with the constituent datasets to ensure that models trained using
  the same version of CropHarvest will be trained using the same data. This enables the dataset to be

quote_extract: 'hine learning for geospatial data [51]. These challenges create a high barrier to entry
  for ML researchers hoping to develop approaches using geospatial data. To address these challenges,
  we present CropHarvest, a spatially and semantically comprehensive dataset of agricultural class labels.
  We chose to focus on the task of crop classiﬁcation for this dataset because it is relevant for many
  use cases, including food security [35] and climate change assessments [49]. This dataset harmonizes
  20 datasets with agricultural class labels, including existing public datasets and new datasets released
  with this paper. We provide the label geometries as well as the corresponding satellite data inputs
  from four satellite datasets. We also provide an MLfriendly API inspired by the torchvision package[30]
  for accessing the dataset to reduce the overhead required for ML practitioners to get started using
  it. We additionally provide three benchmark tasks for evaluating the performance of models in a range
  of agroecologies and dataset-size regimes. This dataset can be used to address many challenges of interest
  to the machine learning community, namely: i) learning from sparse spatio-temporal data, where the spatial
  correlations are much weaker than in a dense map, ii) handling domain shift in space (regional differences
  in agriculture and climate), time (inter-annual variability and climate change), and semantics (new
  crop types or practices), and iii) learning from highly imbalanced datasets, where a few spatially concentrated
  classes dominate the dataset … label (section 3.2). Code to access the dataset is available at https://github.com/nasaharvest/cropharvest
  and the raw data is available at https://zenodo.org/record/5533193. The dataset is released under a
  CC BY-SA 4.0 license. 3.1 Labeled Data We collected 90,480 datapoints from 20 datasets; some datasets
  come from existing public sources while some (e.g., Rwanda) are being made public with this publication
  (Table 1). All of the datapoints 3 Table 1: A list of datasets combined, including their source, country
  of focus, the number of labels used in CropHarvest and the license. Datasets with a binary label type
  contained binary … 1 All LP DAAC current data and products acquired through the LP DAAC have no restrictions
  on reuse, sale, or redistribution. have a binary label specifying crop or non-crop. Of the 90,480 total
  datapoints, 30,899 (34.2%) have more granular labels spanning 348 labels. We refer to these labels as
  "agricultural class labels" because they consist mostly of crop types (e.g., "maize") but also contain
  additional agriculture-related classes (e.g., "pasture"). Figure 1 shows the spatial distribut … ataset;
  in the current version, these were the [22] and [2] datasets. We sampled at most 100 labels from each
  crop type in each of these datasets. 3.2 Remote sensing data Each label has either a polygon (24% of
  data points) or point (76% of data points) geometry, depending on the method used to collect the labels.
  We paired each label geometry with the corresponding satellite data. Satellite observations are typically
  in raster format, which is a grid of pixels where 4 low high low high … or the whole time series. each
  pixel contains a value representing the observed information at a speciﬁc latitude/longitude location,
  such as temperature or reﬂectance. For each point label, the pixel with location nearest to the label
  location is selected. For each polygon label, the pixel nearest to the centroid of the polygon is selected
  to prevent oversampling of polygons compared to points. For each label, a one-year time series with
  12 timesteps is constructed, each representing an aggregated value over 30 days. We included satellite
  data from four datasets that provide useful and complementary information for discriminating agricultural
  classes. All datasets are publicly available. We used Google Earth Engine to access the data and upsample
  all products to the same spatial resolution of 10 m/px. We have made all code used to acquire the satellite
  data open source to enable machine learning practitioners to generate crop classiﬁcation maps in new
  areas and more easily acquire satellite datasets for other tasks. Multispect … cation. 5 Table 2: The

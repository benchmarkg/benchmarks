  508,533 (74.5%) Togo 306 106 (34.6%) 200 (65.4%) Meteorological Data Crops have distinct spectral-temporal
  proﬁles and crop development can be delayed or accelerated by weather conditions [64, 16]. Variations
  in climate should be considered when classifying crop types, particularly the temperature and precipitation
  distribution throughout the growing seasons [16]. We used the ERA5 meteorological reanalysis dataset
  [link], which provides a variety of meteorological data globally at 31 km/px and hourly resolution to
  capture this information. While this product has substantially coarser resolution than the other datasets,
  it could still be useful for en … lculate the slope. 3.3 Limitations While we made an effort to address
  as many limitations as possible in the creation of the dataset, some limitations remain. The agricultural
  classes in the dataset are not globally harmonized. This is because the original classes do not perfectly
  overlap, so labels could not be harmonized without coarsening the labels. For example, the [23] dataset
  contains a "groundnut" class, and the [66] dataset contains a "groundnuts or peanu … nd are assigned
  a crop category from the indicative crop classiﬁcation [13]. Another limitation is incomplete satellite
  time-series coverage for some labels. Due to the limited satellite data coverage (in particular for
  Sentinel-1 data), satellite data was obtained for 65,690 (73%) of the collected labels. 4 Benchmarks
  We deﬁned a set of benchmark tasks to enable comparison of machine learning models in a wide range of
  agroecologies and in-distribution dataset size regimes. To this end, we selected three geographically
  and semantically distinct tasks with training data sizes ranging from < 100 to > 1000. When trained
  models are used to predict dense maps (e.g., to generate a predicted crop type map of a region), there
  are two commonly used methods for evaluating the resulting map: random sampling and wall-to-wall evaluation.
  … er a pixel contains a speciﬁc crop type or not, which we refer to as crop type vs. rest. We designed
  two tasks with different agroecologies and crop types: Kenya (maize vs. rest) and Brazil (coffee vs.
  rest). For both tasks, we undersampled non-crop samples so that the negative samples consisted of an
  equal number of 6 (a) Togo (b) Kenya (c) Brazil Figure 4: Example 1km × 1km satellite images of the
  evaluation regions, demonstrating the variety in … and diversity of samples in the test sets, we constructed
  the test set for each task by deﬁning a bounding box within the region covered by the dataset. We then
  evaluated the model predictions for all pixels in the polygons contained in the bounding box, rather
  than only evaluating each polygon centroid. We removed the test polygons from the training sets to ensure
  there was no spatial overlap between the training and test sets, which could result in spatial autocorrelation
  [28]. For both tasks, the evaluation bounding boxes were selected because they included a good balance
  of positive and negative classes. Kenya: maize vs. rest The goal in this task is to classify samples
  in Kenya as maize vs. rest using a dataset collected by PlantVillage [23]. This dataset consists of
  a training set of 1,345 samples (266 maize and 1,079 rest) collected in 2020-2021. We used two evaluation
  bounding boxes with labels from 2020 which covered approximately 764 m2 and 1, 178 m2 (total coverage
  of 1, 942 m2), resulting in 45 polygons total. We used two boxes to increase the diversity of test samples.
  Brazil: coffee vs. rest We used the LEM+ dataset [39] to construct a coffee vs. rest task in Brazil.
  The training set has 794 samples (21 coffee, 773 rest) collected in 2020-2021. The test set included
  all polygons from 2020 or 2021 within a 4.2 km2 bounding box, resulting in 66 polygons total. 4.2 Crop
  vs. non-crop (Togo) We used the dataset collected by [25] to construct a binary crop vs. non-crop classiﬁcation
  task in Togo. This dataset contains 1,319 samples in the training set 1,319 and 306 samples in the test
  set. In this task, we included an additional experiment to investigate model performance as a function
  of training data size. We evaluated the models after training on a range of sizes subsampled from the
  original training dataset, ensuring each subset consisted of an equal number of positive and negative
  samples: {20, 50, 126, 254, 382, 508, 636, 764, 892, 1020, 1148, 1319}. Each subsample adds additional
  samples to the previous (smaller) subsample, allowing us to measure the effect of additional training
  samples on model performance. 4.3 Models We evaluated the performance of three neural network models
  and a random forest model on the benchmark tasks. Random forests are commonly used for remote sensing
  tasks [29], so we included it as a benchmark to compare with the deep learning models. We implemented
  the random forest using default settings in [41] and trained it on the evaluation tasks. All neural

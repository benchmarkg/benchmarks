quote_extract: 'uisance parameters that are sampled across the dataset and must be marginalized over during
  inference. Relationship to the Phase-1 challenge dataset: This release is an upgraded version of the
  training set used in the Phase-1 challenge. In the Phase-1 release, the same set of random realizations
  was reused across all cosmologies; in this release, each cosmology uses an independent set of realizations,
  which substantially increases the effective number of independent samples and removes correlations across
  cosmologies. We therefore recommend this release for any use beyond reproducing the original Phase-1
  leaderboard. The held-out test set has been generated and consists of 14k convergence maps with corresponding
  labels, drawn from 82 cosmological models that are not present in the training set. This design enables
  evaluation of cosmological parameter inference under generalization to unseen cosmologies. The held-out
  test set will be released after the end of Phase 2 competition. A small representative sample of the
  dataset (3 cosmologies × 30 realizations, ≈ 23 MB) is also included for users who want to quickly inspect

quote_extract: 2018 Info Statistics Join Home Description Procedure Data Evaluation Results Download
  Submit Tutorial Email organizers Announcement (Jan 3, 2018)¶ Dear all, We have decided to stop
  processing new submissions to LUNA16. The website and the data will remain available. As we
  mentioned in our announcement in September 2017, we are considering to organize a follow-up
  challenge with a new test set. We welcome people to contact us if they are interested in
  co-organizing a new challenge. Please note that the evaluation script of LUNA16 will stay
  available in the Zenodo repository, so you can still evaluate your system on LUNA16 yourself and
  compare to the systems listed on the leaderboard. Kind regards, Bram van Ginneken Arnaud A. A.

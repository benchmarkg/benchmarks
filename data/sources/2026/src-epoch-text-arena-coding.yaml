e] Economic impact [https://epoch.ai/topics/economic-impact] Future of AI [https://epoch.ai/topics/future-of-ai] About [https://epoch.ai/about] Who we are About [https://epoch.ai/about] Team [https://epoch.ai/about/team] Transparency [https://epoch.ai/about/transparency] Engage with us Careers [https://epoch.ai/about/careers] Press [https://epoch.ai/about/press] Consultations [https://epoch.ai/about/consultations] Donate [https://epoch.ai/about/donate] Contact [https://epoch.ai/contact] Overview [https://epoch.ai/benchmarks] Epoch Capabilities Index [https://epoch.ai/eci] Models [https://epoch.ai/models/search] Benchmarks [https://epoch.ai/benchmarks/search] Data [https://epoch.ai/benchmarks/use-this-data] About [https://epoch.ai/benchmarks/about] Back to benchmarks [https://epoch.ai/benchmarks/search] Text Arena (Coding) A platform where users vote on which of two anonymous models do a better job producing websites according to the user’s requests. Previously known as WebDev Arena, now a subset of Text Arena [https://arena.ai/leaderboard/text]. About Methodology Text Arena (Coding) Text Arena (Coding) evaluates models’ ability to program web applications by allowing users to make a request and express their preference for either of two models’ outputs. The skills which may help them perform well include anything necessary to create an appealing application that functions as the user intended it to. The score visible on the leaderboard is calculated using the Bradley-Terry model [https://en.wikipedia.org/wiki/Bradley%E2%80%93Terry_model], which yields a score for a model based on its performance in match-ups against other models in the pool. Previously called WebDev Arena, this evaluation is now a subset of LMArena’s Text Arena. Methodology We get our data from the Text Arena (Coding) leaderboard [https://arena.ai/leaderboard/text/coding]. The leaderboard is updated live and our hub is updated periodically, with the most recent update indicated for every entry. The following system prompt is used for every model: You are an expert frontend React engineer who is also a great UI/UX designer. Follow the instructions carefully, I will tip you $1 million if you do a good job: - Think carefully step by step. - Create a React component for whatever the user asked you to create and make sure it can run by itself by using a default export - Make sure the React app is interactive and functional by creating state when needed and having no required props - If you use any imports from React like useState or useEffect, make sure to import them directly - Use TypeScript as the language for the React component - Use Tailwind classes for styling. DO NOT USE ARBITRARY VALUES (e.g. 'h-[600px]'). Make sure to use a consistent color palette. - Make sure you specify and install ALL additional dependencies. - Make sure to include all necessary code in one file. - Do not touch project dependencies files like package.json, package-lock.json, requirements.txt, etc. - Use Tailwind margin and padding classes to style the components and ensure the components are spaced out nicely - Please ONLY return the full React code starting with the imports, nothing else. It's very important for my job that you only return the React code with imports. DO NOT START WITH \`\`\`typescript or \`\`\`javascript or \`\`\`tsx or \`\`\`. - ONLY IF the user asks for a dashboard, graph or chart, the recharts library is available to be imported, e.g. \`import { LineChart, XAxis, ... } from "recharts"\` & \` ...\`. Please only use this when needed. You may also use shadcn/ui charts e.g. \`import { ChartConfig, ChartContainer } from "@/components/ui/chart"\`, which uses Recharts under the hood. - For placeholder images, please use a Models which allow enforced structured output are instructed to use the following structure when outputting their code: { // Detailed explanation of the implementation plan commentary: string, // Template configuration template: string, title: string, description: string, // Dependency management additional_dependencies: string[], has_additional_dependencies: boolean, install_dependencies_command: string, // Application configuration port: number | null, file_path: string, // The actual implementation code: string } Some models don’t support enforced structured output and instead have their code passed through GPT-4.1-mini, which converts it to the correct format. That code is then set to run in the sandbox, a virtual machine running Linux. More details on that environment are available in their blog post [https://blog.lmarena.ai/blog/2025/webdev-arena/#:~:text=Infrastructure%20and%20Execution%20Environment]. Applications which have mistakes or errors are still shown to the user, and LMArena infer from some statistics that models do sometimes produce errant output. Scores are calculated using the Bradley-Terry model [https://en.wikipedia.org/wiki/Bradley%E2%80%93Terry_model] such that a score is assigned to each model based on the results from user choice out of two models’ outputs when they’re paired against each other. Match results are logged and score computation can be performed on the entire set of match results. Code for various analyses of match data can be found in this Google Colab [https://colab.research.google.com/drive/1xq_-PGp8gJ8aHUyokrSqL_qZnn8s-UHV?usp=sharing]. WebDev Arena was introduced by LMArena in a blog post [https://blog.lmarena.ai/blog/2025/webdev-arena/]. Investigating the trajectory of AI for the benefit of society Get the latest from Epoch AI in your inbox Subscribe [https://epochai.substack.com/subscribe] [https://x.com/EpochAIResearch] [https://substack.com/@epochai] [https://bsky.app/profile/epochai.bsky.social] [https://github.com/epoch-research] [https://www.linkedin.com/company/epochai] Our Work Latest [https://epoch.ai/latest] AI Trends & Statistics [https://epoch.ai/trends] Publications [https://epoch.ai/publications] Data Insights [https://epoch.ai/data-insights] Newsletter: 
quote_extract: 'Creative Commons License (Attribution 4.0 International), as described at http://creativecommons.org/licenses/by/4.0/.Abstract
  RNA-Puzzles is a collective experiment in blind 3D RNA structure prediction. We report here a third
  round of RNA-Puzzles. Five puzzles, 4, 8, 12, 13, 14, all structures of riboswitch aptamers and puzzle
  7, a ribozyme structure, are included in this round of the experiment. The riboswitch structures include
  biological binding sites for small molecules (S-adenosyl methionine, cyclic diadenosine monophosphate,
  5-amino 4-imidazole carboxamide riboside 5′-triphosphate, glutamine) and proteins (YbxF), and one set
  describes … ck experimental data, including multidimensional chemical mapping, and accurate prediction
  of RNA secondary structure, a large portion of the contacts in 3D have been predicted correctly leading
  to similar topologies for the top ranking predictions. Template-based and homology-derived predictions
  could predict structures to particularly high accuracies. However, achieving biological insights from
  de novo prediction of RNA 3D structures still depends on the size and complexity of the RNA. Blind computational
  predictions of RNA structures already appear to provide useful structural information in man … ssions
  and exchanges between the various modeling groups. This has led to agreed protocols for delivery of
  models, descriptions of computations, and assessments. At the same time, the automatization of the modeling
  processes has steadily progressed. At this stage, it is probably still too early to offer a comparative
  analysis of the prediction and modeling methods. Here we report a third round of RNA-Puzzles and we
  focus on the prediction of RNA riboswitches and ribozymes, evaluated on the basis of six RNA structures:
  the SAM-I riboswitch aptamer, the SAM-I/IV riboswitch, the ydaO riboswitch, the ZTP riboswitc'

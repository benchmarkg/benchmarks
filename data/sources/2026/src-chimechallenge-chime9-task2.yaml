quote_extract: 'tions were recorded using both multichannel hearing aid devices and smart glasses worn
  by the participants. Entrants are asked to develop solutions for both devices. Each device should be
  processed separately using real-time, low-latency algorithms. Your goal is to produce a single-channel
  audio stream for each conversational partner. These enhanced streams should be effectively free of all
  background noise and competing speech, while preserving the target speaker’s voice with minimal distortion.
  The ultimate aim is to enable these processed streams to be re-summed, yielding an enhanced rendition
  of the conversation where all distracting room noise is seamlessly “faded out.” Evaluation Challenge
  entrants will be evaluated using a held-out test set, featuring conversations and talkers entirely unseen
  during the training or development phases. Your enhanced signals will be assessed through a dual approach:
  Objective Metrics: A comprehensive suite of objective metrics will evaluate the quality and intelligibility
  of each speech segment within each stream. Subjective Listening Tests: Crucially, human listening tests
  will be conducted to directly assess the perceived quality and intelligibility of the entire conversation
  when the individual enhanced streams are re-summed. To support your development, we will provide a baseline
  system and a dedicated development dataset. These resources, combined with the objective metrics, will

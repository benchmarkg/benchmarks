  splits, and packaged each dataset in a self-explanatory common format with human-readable metadata.
  They all have open licenses (some of which permit commercial use), with the exception of the GTZAN corpora
  which are widely used but of unknown license status. We encourage the community to benchmark on HEAR
  datasets, even if they do not follow the HEAR rules or HEAR API. Open tasks were released early in the
  NeurIPS 2021 shared challenge, to encourage participation and to allow participants to debug and reﬁne
  their submissions: Speech Commands v2 (full and 5h versions), NSynth Pitch (50h and 5h versions), and

quote_extract: "nrated WinoGrandeModel developer | Language understanding | Unrated Apply Common questions
  What does the ECI represent? Similar to an IQ test, ECI is designed to capture a broad, underlying capability
  useful across many tasks, rather than performance on specific skills. ECI summarizes a model’s capability
  across benchmarks it has been evaluated on, giving more weight to the benchmarks that carry the most
  signal. ECI scores are abstract values that can’t be interpreted in isolation, but they can be compared
  across models to judge … net = 130 and GPT-5 = 150. As future models and benchmarks are incorporated,
  these calibration points may be revisited. Note that as with Elo scores, there is no maximum achievable
  ECI. Values are not linearly related to benchmark accuracy, since benchmarks differ in both difficulty
  and slope. Why isn’t … ev Arena. Why did the ECI score of a model change? The model used to produce
  ECI scores is fit jointly across all data. As new models and new benchmark evaluations are obtained,
  values may shift slightly even for models whose data have not changed. Isn’t it a problem if model developers
  release only their best scores? It is true that evaluations from model developer … picked in order to
  make the model look better. Relying on these evaluations alone could lead to bias in our estimation.
  We mitigate against this by running models on our own internal evaluations, and by collecting evaluations
  from independently-run leaderboards. Since these sources are reported regardless of outcome, they reduce
  the impact of cherry-picking. Isn’t it a problem if … mize for benchmark scores? Although our approach
  inherits the benefits of benchmarks, it also inherits its limitations. One shortcoming is that model
  developers can optimize for high performance on certain benchmarks, so that we overestimate the capabilities
  of some models. There is some evidence that open-weight models tend to optimi … uded? We strive to cover
  as many models as possible, with particular focus on plausibly-frontier level models. However, we require
  a minimum of 4 benchmark evaluations for any model to ensure ECI scores are both stable and fair. If
  a model you care about doesn’t yet have an ECI score, we are most likely trying to obtain more benchmark
  scores for … ven a domain-specific ECI. Why do some LLMs have a Cyber ECI but no general ECI? Unlike
  the other domain-specific ECIs, the Cyber ECI incorporates cyber benchmarks that are not part of the
  general ECI. An LLM with enough cyber benchmark results can therefore be given a Cyber ECI even if it
  does not meet the 4-benchmark … ction for details. Did you add additional math or software engineering
  benchmarks to construct the SWE ECI or Math ECI? No, the benchmarks used to calculate the math and SWE
  domain-specific ECIs are a subset of the benchmarks used to construct the general ECI. The Cyber ECI
  is the exception: it incorporates many cyber benchmarks that are not part of the general ECI (see the
  Cyber ECI methodology). More about this dataset Documentation Downloads Citations Documentation The
  general ECI is a composite metric which uses scores from over 50 distinct benchmarks to generate a single,
  general capability scale. At a high level, ECI stitches together its component benchmarks, determining
  their relative difficulty by making compar … rview of our methodology here; further technical details
  are available in our paper, A Rosetta Stone for AI Benchmarks, which was funded by Google DeepMind,
  and written in collaboration with researchers from their AGI Safety & Alignment team. However, the ECI
  is an independent Epoch AI product that Epoch has full rights over. The Domain-specific ECIs show how
  LLMs’ ECI scores are influenced by the selection of benchmarks used to calculate them … ECI but only
  incorporates benchmarks from a specific domain, such as software engineering (SWE) or math. In particular,
  we keep the benchmark difficulty and slopes from the general ECI fit, and only refit the LLM capability
  parameters. The Cyber ECI is constructed differently from other domain-specific ECIs, as it incorporates

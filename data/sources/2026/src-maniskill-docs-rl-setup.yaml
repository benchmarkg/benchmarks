quote_extract: 'uate all kinds of policies in ManiSkill fairly. In summary, the following setup is necessary
  to ensure fair evaluation: Partial resets are turned off and environments do not reset upon success/fail/termination
  (ignore_terminations=True). Instead we record multiple types of success/fail metrics. All parallel environments
  reconfigure on reset (reconfiguration_freq=1), which randomizes object geometries if the task has object
  randomization. The code to fairly evaluate policies and record standard metrics in ManiSkill are shown
  below. For GPU vectorized environments the code to evaluate policies by environment ID the following
  is recommended: import gy … _metrics.keys(): print(f"{k}_mean: {np.mean(eval_metrics[k])}") The following
  metrics are recorded and explained below: success_once: Whether the task was successful at any point
  in the episode. success_at_end: Whether the task was successful at the final step of the episode. fail_once/fail_at_end:

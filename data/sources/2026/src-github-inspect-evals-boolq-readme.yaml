quote_extract: 'ge ### Installation Install with `pip install inspect-evals`, or `uv sync` from a checkout
  of this repository. ### Running evaluations ```bash uv run inspect eval inspect_evals/boolq --model
  openai/gpt-5-nano ``` You can also import tasks as normal Python objects and run them from python: ```python
  from inspect_ai import eval from … ture 0.5 ``` See `uv run inspect eval --help` for all available options.
  ## Parameters ### `boolq` - `shuffle` (`bool`): (default: `True`) ## Dataset BoolQ is a question answering
  dataset for yes/no questions containing 3,270 samples. Each sample is a triplet of question, passage,
  answer. Here is an example from the dataset (after processing by Inspect): > question: is harry potter
  … ction for the expanded Wizarding World of Harry Potter when it opened on July 8, 2014 ## Scoring A
  simple accuracy is calculated over the datapoints. The scorer accepts only a single `Yes` or `No` (case-insensitive),
  optionally surrounded by whitespace, punctuation, or underscores, such as `No.`, `**Yes**`, or `_No_`.
  A completion … an one wrapping character or a trailing newline, such as `**Yes!!**` or a label followed
  by a newline, were previously rejected and are now accepted. Results are not comparable with `2-A`.
  See [#2331](https://github.com/UKGovernmentBEIS/inspect_evals/issues/2331). ### [2-A] - 2026-02-16 -
  Migrate version to new scheme. See [#907]'

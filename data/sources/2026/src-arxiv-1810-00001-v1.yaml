  classiﬁcations (i.e. labels) are given. The participants in PLAsTiCC are asked to separate the data
  into 15 classes, 14 of which are represented in the training sample. The models used to generate these
  classes will be described in an upcoming paper that will be released once the challenge is complete.
  The ﬁnal class is meant to capture interesting objects that are hypothesized to exist but have never
  been observed and are thus not in the training set. This class would encompass any objects not seen

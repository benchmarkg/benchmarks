  about failure causes, query the waveform for evidence, and refine its understanding iteratively,
  mirroring the exploratory process of human verification engineers. VeriTrace achieves 100% Pass@1
  on VerilogEval-V2, the first system to attain perfect functional correctness on this benchmark. On
  a shared Claude Sonnet 4.0 backbone, VeriTrace outperforms the strongest reproduced baseline by
  +5.1%, demonstrating that debugging agency closes the final accuracy gap. address this gap by
  incorporating waveform-based debugging feedback [10], [1 … pair. Rather than relying on learned
  orchestration or dynamic agent allocation, VeriTrace decomposes the task into the same sequential
  stages a verification engineer would follow, with each stage handled by a specialized agent. As
  shown in Figure 1, the system takes a natural language specification and golden testbench if
  available as input, generates testbench and RTL. Then, if simulation reports a functional error,
  enters a closed-loop cycle of inspection and debugging until all test cases pass. The key

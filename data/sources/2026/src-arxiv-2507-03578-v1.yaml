  the 4DS models outperform other approaches on motion understanding tasks, we find that on STIR, the
  4DS-e backbone outperforms all other models by a large margin. On Digital Typhoon, interestingly, it
  is 4DS-L which leads, ahead of the larger 4DS-e, with VJEPA-H following closely behind. For WeatherBench
  2, we find that pure MAE approaches in pixel space (VideoMAE, VideoMAEv2 and 4DS) tend to perform better
  than other models. DINOv2 lags far behind video-based models, highlighting th … ackbone. A 100x smaller
  backbone learning achieves the best performance for STIR while applying the same learning rate to both
  the readout and the backbone yields the best results for Weatherbench 2. We reach state-of-the-art performance

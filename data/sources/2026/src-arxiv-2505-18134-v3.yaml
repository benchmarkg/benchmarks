  execution. Models frequently struggle to correctly process visual inputs. In VideoGameBench, agents
  are only given access to the raw visual frames provided by the game emulator. We find that incorrectly
  processing the given input frames frequently leads to illogical behavior that can fatally compromise
  the run, such as the Gemini 2.0 Flash agent in Doom II wasting all its ammo on a dead enemy it misperceives
  as alive, or the GPT-4o agent in The Legend of Zelda: Link’s Awakening mistakenly believing it had …
  es (Ruoss et al., 2025; Paglieri et al., 2025). 6 DISCUSSION Limitations. VideoGameBench covers primarily
  games and game emulators from the 1990s, which we hope to expand to more games and platforms. The automatic
  checkpoint detection we introduced works for measuring game progress, but is not able to provide extremely
  fine-grained or continuous markers. Lastly, we recognize that our wide range of mechanisms for preventing
  data leakage (e.g. a dev and test split of games, secret games, and strict scaffolding rules) could
  still be bypassed intentionally or unintentionally, since information, guides and video walkthroughs
  about virtually all video games are widely available online and might make its way to pre-training or
  finetuning corpora. Intellectual Property Usage. The games in VideoGameBench fall under copyright laws,
  so care must be taken to ensure ownership. We cite prior academic works such as Mnih et al. (2013);
  Valevski et al. (2024); Hu et al. (2025a) that similarly introduce benchmarks or works around copyrighted
  games. For our checkpointing system, … low runs to continue even after an agent has failed / “game over”d

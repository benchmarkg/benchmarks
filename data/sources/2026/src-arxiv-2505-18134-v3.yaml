quote_extract: 'Real video games are crafted to be intuitive for humans to learn and master by leveraging
  innate inductive biases, making them an ideal testbed for evaluating such capabilities in VLMs. To this
  end, we introduce VideoGameBench, a benchmark consisting of 10 popular video games from the 1990s that
  VLMs directly interact with in real-time. VideoGameBench challenges models to complete entire games
  with access to only raw visual inputs and a high-level description of objectives and controls, a significant
  departure from existing setups that rely on game-specific scaffolding and auxiliary information. We
  keep three of the games secret to encourage solutions that generalize to unseen environments. Our experiments
  show that frontier vision-language models struggle to progress beyond the beginning of each game. We
  find inference latency to be a major limitation of frontier models in the real-time setting; therefore,
  we introduce VideoGameBench Lite, a setting where the game pauses while waiting for the LM’s next action.
  The best performing models, Gemini 2.5 Pro and Claude 3.7 Sonnet, complete only 0 … athfinding, game-specific
  hints, and memory, could complete Pokemon Blue. Although VideoGameBench includes similar games, we focus
  on evaluating VLMs with minimal human or tool-assisted intervention. We evaluate multiple frontier VLMs
  on VideoGameBench using our VG-Agent scaffolding and find that all models struggle to progress on any
  game – the best performing models, Gemini 2.5 Pro (Google DeepMind, 2025) and Claude Sonnet 3.7 (Anthropic,
  2025), are able to achieve a score of … granular progress tracking, we release VideoGameBench Lite–a
  smaller benchmark where the emulator pauses during agent inference, eliminating latency issues from
  slow model responses. 2 VIDEOGAMEBENCH VideoGameBench is a benchmark composed of a diverse suite of
  23 curated video games split across a dev and test set, with an environment to evaluate and communicate
  with VLM-based agents. The task is to solve the core objective of each game, e.g. defeating the final
  boss in Super Mario Land or completing the entire single-player campaign for Age of Empires. We explicitly
  provide a dev set to encourage improving the performance of models or minimal scaffolds on interactive
  environments without using the test set games. 2.1 BENCHMARK CONSTRUCTION To enable our benchmark to
  run games from multiple different platforms in a modern computer environment, our VideoGameBench framework
  abstracts the underlying game emulator … D / 3D Environments: Compared to previous benchmarks (Paglieri
  et al., 2025; Nasir et al., 2024; Waytowich et al., 2024), the VideoGameBench games introduce more realistic
  and challenging visuals and also require significant planning (e.g. navigating the world in The Legend
  of Zelda: Link’s Awakening), puzzle-solving (e.g. understanding physics in The Incredible Machine),
  and strategic thinking (e.g. dealing with multiple enemies shooting in Doom II). 2. Diverse Mechanics:
  Our g … mechanics (Game Boy) and mouse/keyboard interactions (MS-DOS), presenting different challenges
  for agent control. For example, mouse control requires precisely mapping points on a fixed screen, while
  controller D-Pad (the flat, four-way directional button on a controller) movement requires understanding
  positions relative to the game character. 2.2 TASK FORMULATION In VideoGameBench, VLM agents are provided
  instructions on emitting game actions (e.g. press “A” to jump), and the raw game screen without extra
  information as input, and provide an action as output every step. We do not permit human-written hints
  beyond high-level game objectives and a description of game controls (see Appendix B). Agent inputs.
  The primary observation provided to the agent at every step is the raw game screen as an image (or set
  of frames). We deliberately avoid providing parsed text overlays or structured state information (as
  in previous works including PySC2 (Vinyals et al., 2017) and VizDoom (Kempka et al., 2016)) to challenge
  the model’s visual processing capabilities. In addition, we do not provide the agent with any intermediate
  rewards or signals throughout gameplay. Agent actions. The agent interacts with the game controller
  through a language-based action interface. This supports single actions (e.g., press “Space”), sequences
  of actions (e.g., press “A”, “A”, … “press_key space” to press the space bar for a default of 1/10 a
  second. The specific available actions depend on the game platform (keyboard/mouse for MS-DOS, button
  presses for Game Boy). Scoring. Each game is weighted equally (out of 1) and is divided uniformly by
  the number of predefined checkpoints on each game. Checkpoints were manually defined based on well-known
  level or stage divisions for these games (see Appendix C.4). Furthermore, we specifically allow agents
  to restart games after losing to allow age … as the game emulator’s internal RAM. On VideoGameBench,
  we want to evaluate a VLM agent’s ability to interpret raw visual inputs and directly interact with
  the game environments to achieve its goals. Therefore, we do not permit any visual overlays, and also
  do not permit providing any extra information to the agent sourced either from the internal game-state
  or from the viewable screen. We only allow the raw game frames and a basic description of the game’s
  objectives and controls as input to the agent. 2.3 THE GAMES OF VIDEOGAMEBENCH VideoGameBench includes
  10 games in the test set, and 13 in the dev set, described in Table 1. Previous game benchmarks for
  VLMs such as Paglieri et al. (2025); Nasir et al. (2024); Tsai et al. (2025) all include six or less
  games, so we limit our test set to 10 games due to the difficulty, length, and diversity of each game.
  Seven of these are public and three are secret (see §2.4). Game Genres. The VideoGameBench games were
  selected based on popular genres of video games, each offering unique and unique challenges. We highlight
  challenges we observed for agents belo … tinuously adjust and react in a 3D vehicle environment and
  race against other opponents. • Puzzle: Agents must solve a series of puzzles based on in-game physics
  mechanics and tools. 2.4 SECRET GAMES Our objective is not to measure whether agents can play specific
  games, but whether they can adapt to, learn from, and progress in new environments. Therefore, we also
  test each agent on three secret games that we host on a private evaluation server. We determined that
  these games are of similar difficulty to the other games in VideoGameBench, each falling under one of
  the genres described in § 2.3. We believe that including these games could in … istory of previous actions
  and thoughts, processing times increase, further exacerbating this issue. To disentangle reasoning ability
  from reaction time constraints, we introduce VideoGameBench Lite, a variant of the full benchmark where
  the underlying emulator is paused whenever the agent is 4 processing information and deciding on its
  next action – the game only resumes momentarily when an action is made. This change effectively turns
  the real-time game into a turn-based interaction, allowing evaluation of the agent’s planning and decision-making
  capabilities irrespective of inference speed. The list of VideoGameBench Lite games is: Quake, Prince
  of Persia, Super Mario Land from the dev set, and Doom II, Kirby’s Dream Land, Zelda: Link’s Awakening
  from the test set. 2.6 AUTOMATED PROGRESS TRACKING To make VideoGameBench finer-grained, and not just
  one in which we assign binary pass/fail scores to each game … e compared to the current game screen
  to determine if an agent has reached a checkpoint, and the score is determined based on the relative
  timestamp of the checkpoint with respect to the walkthrough. We automatically detect which checkpoint
  an agent has reached by applying perceptual image hashing (Marr & Hildreth, 1980; Buchner, 2013) to
  every frame outputted by the emulator during the agent’s gameplay. We compute the hamming distance (Hamming,
  1950) between the current game frame and all of … “speedrunning” community; however, their system is
  meant to be used as standalone software that does not easily plug into our system. To compute the agent’s
  VideoGameBench score for a specific game, we track the furthest checkpoint reached by the agent, lookup
  the timestamp in the associated walkthrough video, and compute the percentage of the game completed.
  See Appendix C.4 for a detailed list of these manually determined checkpoints. 3 EXPERIMENTAL SETUP
  In this section, we describe the inputs provided to agents running on VideoGameBench. We also explain
  our agent baselines that we use to evaluate the current performance on this benchmark. VG-Agent. Because
  the games in VideoGameBench require context that is often not visible on-screen, the naïve approach
  of only providing a VLM the current game screen would fail. Therefore, we implement a ReAct (Yao et
  al., 2023) agent to play video games. This agent is given (1) an initial prompt … uct-FP8) (Meta AI,
  2025; Together AI, 2025), and the 7B and 32B variants of QwenVL2.5 (Bai et al., 2025) to evaluate prevalent
  open source models across different scales. Following Yao et al. (2023), all models are run with temperature
  0.7 and a maximum output length of 2048 tokens. Constraints. There are many games in which the model
  could run infinitely long because it gets stuck without ending the game. Given a limited budget, we
  preemptively end runs based on rules indicati … , then provide analysis on model’s performance and their
  failure modes. The best-performing models, Gemini 2.5 Pro and Claude Sonnet 3.7, are only able to reach
  the first checkpoint in a single game. Due to budget constraints, we limit each model to one run on
  each game. Our study of system variance (on three games using Gemini 2.5 Pro) shows that there is little
  variance in these settings; therefore, we believe that running these experiments multiple times would
  not have led to substantially different results (see Appendix D.3). Table 2: Performance on VideoGameBench
  test split, a benchmark consisting of 7 games and 3 secret games, which we keep private to users. Each
  score is displayed as as a percentage of the game completed based on completed checkpoints, i.e. 0%
  means the agent did not reach the first checkpoint. The overall score is computed as an average of scores
  across all games. The cost of each run is reported in Appendix D.2. VideoGameBench Civilization I The

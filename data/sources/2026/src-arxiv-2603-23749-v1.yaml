  Agent Leaderboard (HAL), spanning diverse task domains but with smaller agent populations. Terminal-Bench
  2.0. Terminal-Bench evaluates AI agents on 89 tasks, each attempted 5 times p … $800 in API fees. The
  total cost across all 242 agent runs is approximately $46,000, consistent with HAL’s reported estimate
  of ∼$40,000 (Kapoor et al., 2026) since additional runs were added between the publication of the paper
  and our data acquisition efforts. The total cost of one agent run depends on the benchmark, the scaffold,
  and the model used. State of the art models can push costs as high as $2,829 on GAIA b'

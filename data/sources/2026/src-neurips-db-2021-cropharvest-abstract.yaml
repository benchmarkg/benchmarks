  Search CropHarvest: A global dataset for crop-type classification Part of Proceedings of the Neural
  Information Processing Systems Track on Datasets and Benchmarks 1 (NeurIPS Datasets and Benchmarks 2021)
  round2 Bibtex Paper Reviews And Public Comment » Supplemental Authors Gabriel Tseng, Ivan Zvonkov, Catherine
  Nakalembe, Hannah Kerner Abstract Remote sensing datasets pose a number of interesting challenges to
  machine learning researchers and practitioners, from domain shift (spatially, semantically and temporally)
  to highly imbalanced labels. In addition, the outputs of models trained on remote sensing datasets can
  contribute to positive societal impacts, for example in food security and climate change. However, there
  are many barriers t … e, how these products should be processed, and how to manage multi-dimensional
  geospatial data. To lower these barriers and facilitate the use of satellite datasets by the machine
  learning community, we present CropHarvest---a satellite dataset of more than 90,000 geographically-diverse
  samples with agricultural labels. The data and accompanying python package are available at https://github.com/nasaharvest/cropharvest.
  Name Change Policy × This venue has no name change policy. You may try reporting an issue. Repor'

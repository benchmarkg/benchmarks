  first exhaustively collected MS/MS spectra from the largest publicly available spectral libraries: MoNA
  [37], MassBank [38], and GNPS [36] (downloaded from the official websites on May 27, 2024), as well
  as from our in-house data [34]. We then deduplicated and cleaned the spectra by applying a se … dditional
  criteria, such as removing all spectra where more than 50% of the total intensity cannot be explained
  by combinatorially decomposing molecular mass into plausible chemical subformulae [61]. We preprocessed
  the mass spectra by removing signals estimated to be instrument noise. Finally, we standardized both
  molecular structures and mass spectra, and harmonized metadata entries, inferring 7 missing or incorrect
  values where possible [62, 60]. Figure 3 shows that our resultan … abeled data, we anticipate that users

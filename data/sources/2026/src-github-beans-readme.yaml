quote_extract: "various species, including birds, land and marine mammals, anurans, and insects. See [our
  paper](https://arxiv.org/abs/2210.12300) for more details. This repository contains the code for downloading
  the datasets and running the baselines. ## Installation 1. Create a conda environment ``` conda create
  -n beans python=3.8 pytorch==1.12.1 cudatoolkit=11.3 torchvision torchaudio cudnn -c p … X for pre-processing
  some datasets. For Ubuntu/Debian you can install it via: ``` sudo apt-get install sox sudo apt-get install
  libsox-fmt-mp3 ``` 3. The benchmark also relies on a few Kaggle datasets. Install the Kaggle CLI via
  `pip install kaggle` and make sure to put your API token in `~/.kaggle/kaggle.json`. You will also need
  to go to the indiv … al competition pages (namely, [cbi](https://www.kaggle.com/c/birdsong-recognition)
  and [rcfx](https://www.kaggle.com/c/rfcx-species-audio-detection)) and choose \"late submission\" in
  order to download their datasets. 4. Download the dataset by running the following script. It also runs
  a Python script which verifies the MD5 hashes of all the data files. Note that you'll need about 300GB
  of disk space for storing the original and the processed datasets. ``` scripts/download_data.sh ```
  If the data download and validation finish successfully, you'll see a `Validation succeeded!` message.
  Note: We veri … 4.6 LTS, torch==1.12.1, and torchaudio==0.12.1. If you encounter any validation issues,
  please check your software versions. ## Running the benchmark You can run all the baseline models by
  running: ``` python run_benchmark.py ``` This will write result files into the `logs` directory. ##
  Implementing your own model Implementing new models on BEANS is easy! You'll need to make a few changes
  in the code: * Implement your PyTorch model in [beans/models.py](https://github.com/earthspecies/beans/blob/main/be"

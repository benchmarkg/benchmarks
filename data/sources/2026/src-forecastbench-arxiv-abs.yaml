quote_extract: 's into informed decision-making. Machine learning (ML) systems have the potential to deliver
  forecasts at scale, but there is no framework for evaluating the accuracy of ML systems on a standardized
  set of forecasting questions. To address this gap, we introduce ForecastBench: a dynamic benchmark that
  evaluates the accuracy of ML systems on an automatically generated and regularly updated set of 1,000
  forecasting questions. To avoid any possibility of data leakage, ForecastBench is comprised solely of
  questions about future events that have no known answer at the time of submission. We quantify the capabilities
  of current ML systems by collecting forecasts from expert (human) forecasters, the general public, and
  LLMs on a random subset of questions from the benchmark ($N=200$). While LLMs have achieved super-human

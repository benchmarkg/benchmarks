  loss metrics we use are (1) root-mean-squared-error (RMSE), (2) normalized RMSE (nRMSE), (3) maximum
  error. These measure the emulating model’s global performance but neglect local performance. Thus we
  include extra metrics to measure specific failure modes: (4) RMSE of the conserved value (cRMSE), (5)
  RMSE at boundaries (bRMSE), (6) RMSE in Fourier space (fRMSE) constrained to low, middle, and high-frequency
  regions. The normalized RMSE is a variant of the RMSE to provide scale-independent information defined
  as: nRMSE ≡ ||upred − utrue||2 , (4) ||utrue||2 where ||u||2 is the L2-norm of a (vector-valued) variable
  u, and utrue, upred are true and predicted value, respectively. The maximum error measures the model’s
  worst prediction, which quantifies both local performance and models’ stability of their prediction.
  cRMSE is defined as nRMSE ≡ || upred − utrue||2/N , which measure the deviation of the prediction from
  some physically conserved value. bRMSE measures the error at the boundary, indicating if the model understand
  the boundary condition properly. Finally, fRMSE measures the error in low/middle/high-frequency ranges
  defined as kmax kmin |F (upred) − F (utrue))|2 , … he minimum and maximum indices in Fourier coordinates.
  In our paper, we define the low/middle/high-frequency regions as Low: kmin = 0, kmax = 4, Middle: kmin

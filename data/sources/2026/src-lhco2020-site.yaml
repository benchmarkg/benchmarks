  of all hadrons (pT, η, φ, pT, η, φ, …) zero-padded up to 700 hadrons. What you should report: A p-value
  associated with the dataset having no new particles (null hypothesis). As complete a description of
  the new physics as possible. For example: the masses and decay modes of all new particles (and uncertainties
  on those parameters). How many signal events (+uncertainty) are in the dataset (before any selection
  criteria). Partial submissions in only a subset of the categories are welcome! You can submit your findings
  at this Google form. Outcomes will be judged based on the accuracy of the new physics characterization.
  For accuracy, we will use the # of sigmas |(your answer - right answer) / your uncertainty| from the
  right answer wherever applicable. For setting up, developing, and validating your methods, we provide

quote_extract: 'ow! The 2021 AI Driving Olympics Compete in the 2021 edition of the Artificial Intelligence
  Driving Olympics (AI-DO 6)! The AI-DO serves to benchmark the state of the art of artificial intelligence
  in autonomous driving by providing standardized simulation and hardware environments for tasks related
  to multi-sensory perception and embodied AI. Duckietown traditionally hosts AI-DO competitions biannu
  … I-DO 6 will be in conjunction with NeurIPS 2021 and have three leagues: urban driving, advanced perception,
  and racing. The winter champions will be announced during NeurIPS 2021, on December 10, 2021! Urban
  driving league Advanced perception and racing leagues Urban driving league The urban driving league
  uses the Duck … elop a robotic agent for driving Duckiebots “well”. Baseline implementations are provided
  to test different approaches. There are no constraints on how your agents are designed. Each challenge
  adds a layer of complexity: intersections, other vehicles, pedestrians, etc. You can check out the existing
  challenges on the Duckietown challenges server. AI-DO 2021 features four challenges: lane following
  (LF), lane following with intersections (LFI), lane following with vehicles (LFV) and lane following
  with vehicles and intersections, multi-body, with full information (LFVI-multi-full). All challenges
  have a simulation and hardware component (,), except for LFVI-multi-full, which is simulation () only.
  The first phase (until Nov. 7) is a practice one. Results do not count towards leaderboards. The second
  phase (Nov. 8-30) is the live competition and results count towards official leaderboards. Selected
  submissions (that perform well enough in simulation) will be evaluated on hardware in Autolabs. The
  submissions scoring best in Autolabs will access the finals. During the finals (Dec. 1-8) one additional
  submission is possible for each finalist, per challenge. Winners (top 3) of … at 11.25 GMT (Zoom link
  will follow). Overview 🎯 Goal: develop robotic agents for challenges of increasing complexity 🚙 Robot:
  Duckiebot (DB21M/J) 👀 Sensors: camera, wheel encoders Schedule Practice: Nov. 1-7 Competition: Nov.
  8-30 Finals: Dec. 1 – 8 Winners: Dec. 10 Rules Practice: unlimited non-co … AI-DO challenges: have a
  Duckiebot navigate a road loop without intersection, pedestrians (duckies) nor other vehicles. The objective
  is to travel the longest path in a given time while staying in the lane, i.e., not committing driving
  infractions. Current AI-DO leaderboards: LF-sim-validation, LF-sim-testing. Previous AI-DO leaderboards:
  sim-validation, sim-testing, real-validation. Get the LF hardware kit Lane following with intersections
  LFI – This challenge builds upon LF by increasing the complexity of the road network, now featuring
  3 and/or 4-way intersections, defined according to the Duckietown appearance specifications. Traffic
  lights will not be present on the map. The obje … s on the map (-multi), and is provided with full information,
  i.e., the state of the other vehicles on the map (-full). This challenge is in simulation only. Leaderboards:
  LFVI_multi_full-sim-validation Getting started All you need to get started and participate in the AI-DO

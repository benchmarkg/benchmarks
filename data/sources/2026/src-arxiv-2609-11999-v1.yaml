quote_extract: 'oding, but enterprise work also involves moving between applications and services, coordinating
  with coworkers, and performing professional analysis. We compare five tool interfaces on TheAgentCompany
  and APEX-Agents using Opus-4.8 and GPT-5.5: typed tools, typed tools plus bash, bash alone, bash with
  persistent agent-synthesized tools, and programmatic tool calling (PTC), which runs programs whose actions
  are restricted to a typed tool catalog. Bash alone outperforms typed tools on both benchmarks, improving
  score by 21.8–24.5 pp on TheAgentCompany and 4.8–7.4 pp on APEX-Agents while using 19–72% fewer total

quote_extract: ') Abstract:Repository-level coding benchmarks have become the standard for evaluating
  coding agents, yet they inherently suffer from data leakage because they are built upon popular open-source
  repositories repeatedly used for training. Consequently, strong performance may reflect memorization
  of canonical repository cues rather than robu … latent variable that is dynamically instantiated only
  when the agent enters the evaluation environment. The instantiated repository preserves the original
  executable behavior while eroding familiar cues such as naming conventions, file layouts, and implementation
  patterns through four transformation levels: problem statement reconstruction, namespace remapping,
  intra-file layout reordering, and functionality-preserving code rewriting. We evaluate popular LLMs
  on SWE-bench Verified and SWE-QA. Results show that removing familiar repository cues consistently degrades
  agent performance and substantially increases interaction costs across models. Further analysis reveals
  that the additional cost is primarily caused by increased difficulty in repository exploration and localization.
  These findings suggest that current coding agents may partially rely on memorized repository-side cues,
  highlighting the need for evaluation under dynamically instantiated repository representations. Comment'

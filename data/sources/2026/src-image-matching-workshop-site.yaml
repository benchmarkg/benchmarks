  the paper submission deadline to March 17. Kaggle challenge will be announced soon. About Matching two
  or more images across wide baselines is a core computer vision problem, with applications to stereo,
  3D reconstruction, re-localization, SLAM, and retrieval, among many others. Until recently one of the

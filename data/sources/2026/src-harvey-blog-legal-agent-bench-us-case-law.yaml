quote_extract: '29, 2026 Today we introduce LAB: United States Case Law (LAB: USCL), an evaluation framework
  for testing frontier models’ ability … PACER holds the dockets of more than 200 federal courts, covering
  millions of cases and more than a billion documents. Because PACER charges per page for access, our
  pipeline draws from RECAP, Free Law Project’s community-constructed archive of PACER filings. RECAP
  is built from documents that PACER users have … yield several environments. From an initial sample of
  200 dockets, our pipeline’s first pass produced 40 environments. Through human review and manual correction,
  we expanded that to a final set of 100. To ensure diverse coverage, we taxonomize briefs across a number
  of salient features, such as court type, filing postur … can capture the full diversity of potential
  jurisdictions, motions, and legal disputes. Evaluating Agents Head to Head For each environment, we
  define two task conditions: open- and closed-book. In the closed-book condition, the model receives
  a file system, built by our extraction pipeline, containing the case’s … rief relied upon. In open-book,
  the model receives only the subset of filings relevant to defining the task, along with access to legal
  research tools through a CourtListener MCP to search for relevant case law and additional filings, limited
  to materials available before the brief was filed. Figure 5. Closed-book and open-book conditions differ
  by th … ols provided to the model. In both conditions, a model is given a single short instruction to
  draft the relevant brief. From there, it works on its own, with no attorney feedback or follow-up prompts.
  Both conditions use the standard LAB harness with compaction to handle long context and OCR tools added
  to handle PDFs. Rather than grading each brief against a fixed answer key, we have models’ briefs face
  off directly. We evaluate model-written briefs pairwise in a round-robin tournament using GRMs which
  select the better brief (or declare a tie) and provide reasoned criteria supporting each choice. These
  criteria are reviewed by lawyers and calibrated to ensure they are relevant to reasons expert reviewers
  would prefer a brief. Figure 6. Briefs are scored head to head and the results converted to Elo ratings.
  We then aggregate a model’s wins and losses in these head-to-head games into an Elo rating for each
  model. This rating predicts a model’s relative brief-writing skill, allowing us to order models based
  on how well they write … s substantially separate model performance, with nearly 700 Elo points separating
  the highest- and lowest-rated models. This means that the highest-rated model, Opus 5.5, writes a stronger
  brief than the lowest performing models more than 95% of the time. This performance is stable across
  open- and closed-book environments, suggesting model performance does not come from t … ther for a specific
  court or type of litigation, or for courts not on PACER, such as state courts or the Supreme Court.
  Unlike previous LAB releases, we are not currently publishing sample environments alongside this post.
  These environments draw on real litigation involving identifiable people and organizations. Although
  the filings are pu … f data litigators use every day. We’re excited to deepen this research and give
  the community the tools to do the same. Last updated: October 29, 2026 Next Up A Force Majeure Clause

quote_extract: 's Dehandschoewercker 1 Allen G. Roush 2 Judah Goldfeder 3 Ravid Shwartz-Ziv 4 Abstract
  We present Minitap’s mobile-use, a multi-agent system that achieves 100% success on the AndroidWorld
  benchmark, the first to fully solve all 116 tasks and surpassing human performance (80%). We first analyze
  why single-agent architectures fail: context pollution from mixed reasoning traces, silent text input
  … ion of text input against device state, and meta-cognitive reasoning that detects cycles and triggers
  strategy changes. Ablations show multi-agent decomposition contributes +21 points over single-agent
  baselines; verified execution adds +7 points; metacognition adds +9 points. We release Minitap as open-source
  software. https://g … h task specifies explicit success criteria evaluated against device state, ensuring
  reproducible and objective metrics. All results reported in this paper use the official AndroidWorld
  evaluation protocol without modification. 3.2. Failure Mode Analysis To understand why prior systems
  fail, we analyze our first attempt, a single-agent baseline'

  Update latest LLM evaluations (Claude-3-7-Sonnet, o3, grok-3, etc) - Parameters for response generation:
  `top_p: 0.8`; `top_k: 20`; `temperature: 0.7`; `max_length: 16000` (or maximum allowed if less than
  16000) - Parameters for scoring: `top_p: 0.95`; `top_k: (empty)`; `temperature: 1.0`; `max_length: 2048`
  - Leaderboard scores are scaled from 10 to 100 by multiplying by 10 for easier viewing. - ‼️ Update
  [benchmark queries & criteria](https://github.com/X-PLUG/WritingBench/blob/main/benchmark_query/benchmark_all.jsonl)
  for improved assessment, including **1,000** queries and requirement dimension subsets. - ‼️ Update
  [evaluation prompt](https://github.com/X-PLUG/WritingBench/blob/main/prompt.py) for better scoring,
  and switch to using **Claude-3-7-Sonnet** for evaluation. #### ```2025-03-10``` - We release the first
  version of WritingBench, including **1,239** writing queries and style/format/length dimension subsets.
  ## 📖 Overview WritingBench is a comprehensive benchmark for evaluating LLMs' writing capabilities across
  **1,000 real-world queries**, spanning: - 6 primary domains - 100 fine-grained subdomains - 1,500+ avg.
  tokens per query WritingBench integrates diverse sources of materials. Each query is paired with **5
  instance-specific criteria**, scoring either through LLM evaluators or through a finetuned critic model.
  ## 🏗️ Benchmark Construction WritingBench is built through a hybrid pipeline combining **Model-Augmented
  Query Generation** and **Human-in-the-Loop R … ─ __int__.py │ ├── critic.py # Critic model evaluation

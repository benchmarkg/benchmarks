  Princeton University 13 CEA DAM 14 University of Liège Abstract Machine learning based surrogate models
  offer researchers powerful tools for accelerating simulation-based workflows. However, as standard datasets
  in this space often cover small classes of physical behavior, it can be difficult to evaluate the efficacy
  of new approaches. To address this gap, we introduce the Well: a large-scale collection of datasets
  containing numerical simulations of a wide variety of spatiotemporal physical systems. The Well draws
  from domain experts and numerical software developers to provide 15TB of data across 16 datasets covering
  diverse domains such as biological systems, fluid dynamics, acoustic scattering, as well as magneto-hydrodynamic
  simulations of extra-galactic fluids or supernova explosions. These datasets can be used individually
  or as part of a broader benchmark suite. To facilitate usage of the Well, we provide a unified PyTorch

quote_extract: "ControlArena ControlArena is a Python library for running [AI Control](https://arxiv.org/abs/2312.06942)
  experiments, created by the [UK AI Security Institute](https://www.aisi.gov.uk) and [Redwood Research](https://www.redwoodresearch.org).
  AI Control aims to design and evaluate control protocols. Control protocols are plans designed to prevent
  unsafe actions by AI systems, even if those AIs were misaligned and intended to subvert the safeguards.
  📚 **Documentation**: Visit our [documentation sit … tps://control-arena.aisi.org.uk/settings.html)**:
  Complete evaluation environments covering a range of threat models (e.g., code sabotage, research sabotage,
  data poisoning), including sandbox environments and tools. Each setting includes **main tasks** (benign
  tasks the model should complete, e.g., \"add a new team to the AWS organisation\") and **side tasks**
  (harmful actions a misaligned model might attempt concurrently, e.g., \"subtly add a security vulnerability
  to th … ontrol-arena.aisi.org.uk/micro_protocols.html)**: Trajectory-level protocol components that
  orchestrate policies and monitors to complete main tasks while resisting sabotage. For example, the
  defer-to-trusted micro-protocol … stics through prompt modification or scaffolding. Policies can be
  honest (attempting only the main task), attacking (also pursuing side tasks), trusted (using safer models),
  or untrusted. - **[Monitors](https://control-arena.aisi.org.uk/monitors.html)**: Analyse model behaviour

  Meta-World is an open source benchmark for developing and evaluating multi-task and meta reinforcement
  learning algorithms for continuous control robotic manipulation environments, with various benchmarks
  to evaluate different aspects of reinforcement learning algorithms. The documentation website is at
  [metaworld.farama.org](https://metaworld.farama.org), and we have a public discord server (which we
  also use to coordinate development work) that you can join here: https://discord.gg/bnJ6kubTg6 ## Installation
  To install Meta-World, use `pip install metaworld` We support and test for Python 3.11, 3.12, and 3.13
  on Linux and macOS. We will accept PRs related to Windows, but do not officially support it. ## API
  The Meta-World API follows the [Gymnasium](https://github.com/Farama-Foundation/Gymnasium) API for environment
  creation and environment interactions. To create a benchmark and interact with it: ```python import
  gymnasium as gym import metaworld env = gym.make(\"Meta-World/MT1\", env_name=\"reach-v3\") observation,
  info = env.reset() for _ in range(500 … arks. These benchmarks are used to learn a multi-task policy
  that can learn 1, 10, or 50 training tasks simultaneously. MT1 benchmarks can be created with any of
  the 50 tasks available in Meta-World. In the MT10 and MT50 benchmarks, the observations returned by
  the benchmark will come with one-hot task IDs appended to the state. ### Meta-Learning Benchmarks The
  ML1, ML10, and ML45 benchmarks are 3 meta-reinforcement learning benchmarks available in Meta-World.
  The ML1 benchmark can be used with any of the 50 tasks available in Meta-World. The ML1 benchmark tests
  for few-shot adaptation to goal variations within a single task. The ML10 and ML45 both test few-shot
  adaptation to new tasks. ML10 comprises 10 train tasks with 5 test tasks, while ML45 comprises of 45
  training tasks with 5 test tasks. ## Creating Multi-Task Benchmarks ### MT1 ```python import gymnasium
  as gym import metaworld seed = 42 # for reproducibility env = gym.make('Meta-World/MT1', env_name='reach-v3',
  seed=seed) # MT1 wit … will return environments that are partially observable for Meta-reinforcement
  learning. Like the included MT and ML benchmarks, these environments can also be run in synchronous
  or asynchronous mode. In order to create a custom benchmark, the user must provide a list of environment
  names with the suffix '-v3'. ```python import gymnasium as gym import metaworld envs = gym.make_vec('Meta-World/custom-mt-envs',vector_strategy='sync',
  envs_list=['env_name_1-v3', 'env_name_2-v3', 'env_name_3-v3'], seed=seed) #"

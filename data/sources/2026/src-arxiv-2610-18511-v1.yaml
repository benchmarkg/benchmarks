quote_extract: 'on. Despite advances in artificial intelligence, most buildings still operate as inefficiently
  as they did decades ago. Building optimization, perhaps more so than any other optimization problem,
  has enormous potential for Machine Learning (ML) driven impact on climate change, in both the short
  and long term. One of the biggest obstacles for building optimization is the lack of policy transfer
  … lize: they only work well for the building they were developed for, but not for other buildings. To
  solve this problem, we propose a challenge for the development of building foundation models that easily
  adapt to new buildings with minimal configuration and thereby enable building optimization to scale
  across the globe. Participants will build control policies on a set o … is trying to answer whether
  we can create a building foundation model that effectively transfers across many buildings. We will
  use a simulated environment for the contest, and will evaluate winning solutions on real buildings after
  the contest ends. Impact. A scalable building model that unlocks even a 5% reduction in carbon emissions
  could reduce the total carbon em … olved problem in this entire domain of research, and has been a major
  focus of recent work[6, 36, 33, 34, 28]. 1.4 Data The competition makes use of the HVAC simulation platform[21,
  15] from the Smart Buildings Control Suite[17], along with some improvements from the open source community[22].
  For the contest we created a random building generator that interfaces with the simulator. This allows
  for an infinite set of potential building simulators, each with different conditions. The generator
  varies the number of floors (2–4), width and length, perimeter shape, room layout, occupancy, envelope
  construction (six material properties), and the number of Air Handler Units (AHUs) and the zones they
  serve (at most 10 zones per AHU); the hot water system remains a single system per building. Each zone
  has its own VAV box. Each building is exposed as a Gym-compatible RL environment. Figure 2: Three training
  buildings. Floor plan, zone count, and AHU-to-zone assignment differ per building (colors show the AHU
  serving each zone). Building split. Participants will be given 6 training buildings, each paired with
  one recorded weather strip from each of five climate stations (30 training scenarios). The agent will
  be evaluated on 6 unseen buildings from the same generator and parameter ranges, at 5 climate stations
  that appear nowhere in the training set, so the transfer is across both buildings and climates. Availability
  and licensing. The simulated buildings and corresponding weather scenarios are generated procedurally
  by a … training weather strips will be released under an open-source license alongside the starter kit
  at competition launch. The 6 held-out evaluation buildings and the 5 held-out stations are kept confidential
  by the Organizers and released publicly only after the competition concludes. Scale and statistical
  power. Because the environment is procedural, the effective dataset is unbounded: participants may sample
  arbitrarily many training buildings, and Organizers can sample fresh evaluation buildings to defeat
  memorization. The default training pool of 6 buildings × 5 stations yields 30 development scenarios;
  the evaluation set is 6 unseen buildings × 5 unseen stations, giving 30 scored rollouts per submission.
  The simulator is deterministic, so a single rollout per pair carries no sampling noise and repeated
  rollouts would add nothing (1.6); breadth across buildings and climates, rather than repetition, is
  what s … fic building it is operating: a foundation model for smart buildings. An open question that
  we also hope to explore is, whether domain specific models will win out[19], or whether generic foundation
  models will generalize best. Ethics. The competition uses purely simulated environments with no human
  subjects or personal data. Post-contest live t … lectricity and gas), and et is the carbon emission.
  The comfort term drops as zone temperatures leave the comfort band; the drop is linear up to 5 K outside
  the band and quadratic and unbounded beyond, so abandoning comfort is never free. It is summed over
  zones weighted by each zone’s own occupancy rather than its floor area, so a single badly conditioned
  zone can dominate an episode. Weights are fixed by the Organizers and identical for all submissions.
  Each scenario runs for 30 days at a 5-minute timestep and every step is scored, so the episodic return
  is R(s)(π) = T t=1 rt(s) with T = 8640. The reward is bounded above by zero. All three terms are penalties.
  The comfort term pt is a regret: it is 0 when every occupied zone sits inside its comfor … o the metric
  is simply the mean magnitude of the per-step loss. The target of zero is not an arbitrary reference
  point: it denotes perfect comfort delivered at no energy and no carbon cost, which is the unattainable
  ideal of the control problem. Because the transformation is monotone, minimizing MAE is identical to
  maximizing the return on every individual scenario. A submitted policy is evaluated on each of the 6
  held-out buildings at each of 5 weather stations, giving 30 scenarios. … and machines, so each (building,
  weather) pair is run exactly once and no averaging over repeated rollouts is required. The headline
  leaderboard score is the mean over all 30 scenarios, with no grouping by building or weather. The Organizers
  re-evaluate the top 7 submitted policies end-to-end at a fixed simulator commit before announcing final
  standings; because the simulator is deterministic, this re-run verifies rule compliance rather than
  estimating variance. 1.7 Baselines Baselines. Building upon earlier work[18], we ship four hand-written
  reference controllers, all of which run the plant: Bang-Bang (bang_bang) switches each AHU on or off
  around the comfort band; Fixed Setpoint (fixed_setpoint) holds one c … s shipped as an additional reference
  point but is not counted among the four, because it does not run the plant at all. The baselines do
  not enter the leaderboard metric, which needs no reference policies; they give participants a published
  performance range to develop against, and their returns on the public training scen … he scenario can
  be produced on request. 2 Organizational aspects 2.1 Protocol The competition will be hosted on Kaggle,
  with the prize pool jointly sponsored by Kajima, Distyl, and KODE Labs. These will be collectively referred
  to as Organizers from here on. A Participant or group of Participants (a “Team”, up to four members)
  submits an Entry consisting of (i) a Python module implementing the TransferPolicy interface, (ii) the
  model weights or other artifacts needed to inst … lity bundle (code archive, seed list, dependency manifest).
  The latest valid Submission per Team is the official Entry. Submissions are sandboxed and executed by
  the Organizers against the held-out 6-building evaluation suite via the evaluate.py interface. Two-phase
  structure. The competition runs in two phases. During the development phase, the Kaggle public leaderboard
  scores submissions against a rotating, publicly-visible subset of evaluation (building, weather) pairs;
  this gives participants signal without exposing the full held-out set. During the final phase, all submitted
  policies … One rollout: zone temperatures against the comfort band, per-step reward, and occupancy.
  Anti-cheating and fairness. 1. The held-out 30 scenarios are never released to participants, in any
  form, before the competition closes. 2. Policies are executed in an isolated container at evaluation
  time with no network access, blocking external lookup tables or remote inference. 3. Per-rollout wall-clock
  is bounded at 10× the bang-bang baseline runtime so solutions cannot succeed by unbounded online planning.
  4. Submitted code archives are scanned for hard-coded building IDs or sensor signatures before scoring;
  matches are grounds for disqualification. Evaluation harness. Participants develop against evaluate.py,
  the harness sh … petition preparation and execution timeline is outlined below. Date Nov 13, 2026 Dec
  13, 2026 Jan 15, 2027 Task / Event Round One deadline (NeurIPS poster; $2K in prizes) Paris Workshop
  Final deadline ($38K in prizes) 2.4 Competition promotion and incentives Incentives. The $40,000 total
  prize pool will be split across podium positions … teams contributing a methods description that meets
  the standard threshold; consortium-author status otherwise); (iii) invitation to the post-contest live-trial
  program at the four physical partner sites. References [1] Nilofar Asim, Marzieh Badiei, Masita Mohammad,

notes: 'Read for P1-S9-T06 on 2026-11-08. evals.openai.com is a single-page application: its HTML is an
  empty shell (title "OpenAI Evals") that loads this one script, which holds the text of every page, so
  the bundle was read as text (the shell names it; the path changes when the site is rebuilt). Its GDPval
  pages are the evaluation listing (published 2025-09-25, with links to the paper, blog, dataset and grading
  page), /gdpval/grading, which now says the rubrics and gold deliverables are open-sourced in place of
  the grading requests the site used to take, and /gdpval/leaderboard, which says the OpenAI-hosted leaderboard
  is no longer active and points to Artificial Analysis. No date is given for either change. The site
  has no robots.txt (the path returns the shell). openai.com itself refuses scripted requests and was
  not fetched. Not a DOI source: archive pending.'

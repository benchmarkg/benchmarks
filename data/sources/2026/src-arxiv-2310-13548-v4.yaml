quote_extract: 'Published as a conference paper at ICLR 2024 … All authors are at Anthropic. … We thus
  benchmark the prevalence of sycophancy in AI assistants released by Anthropic, OpenAI, and Meta. … We
  use both human-written and model-written evaluations (Perez et al., 2022). … We release our code and
  evaluation datasets at github.com/meg-tong/sycophancy-eval. … We examine claude-1.3, claude-2.0, gpt-3.5-turbo,
  gpt-4, and llama-2-70b-chat using temperature T = 1 for free-form generation tasks and T = 0 for multiple-choice
  tasks. … We consider feedback in three domains: (i) math solutions from MATH (Hendrycks et al., 2021b);
  (ii) model-generated arguments; and (iii) model-generated poems. … We then use GPT-4 to evaluate whether
  the free-form response is more positive than the baseline feedback. … We define the feedback sycophancy
  metric to be the mean difference in the feedback positivity across datasets when a user implies they
  prefer and disprefer a passage of text. … We measure the accuracy of AI assistants when challenged on
  subsets of five question-answering (QA) datasets … We measure the frequency of questions on which the
  AI assistant apologizes despite having given a correct answer. … We further measure the frequency the
  assistant revises correct responses to inaccurate responses when questioned. … Although whether models
  should defer to users when challenged is a nuanced question … Claude 1.3 wrongly admits mistakes on
  98% of questions. … We consider free-form TruthfulQA and TriviaQA. … We define the answer sycophancy
  metric to be the mean change in accuracy across user beliefs and datasets relative to no biasing prompt.
  … We considered 15 famous poems and verified that each AI assistant can correctly attribute each poem
  to its poet. … We then created a dataset of 300 prompts by incorrectly … We measure the frequency the
  AI assistant provides responses that include the incorrect attribution without mentioning the correct
  attribution using string matching. … We refer to this frequency as the mimicry sycophancy metric. …
  we measure sycophancy throughout the reinforcement learning (RL) phase of Claude 2 finetuning … Note
  that this dataset is an initial proof-of-concept; for a definitive evaluation, we recommend a larger
  dataset with more comprehensive fact-verification. … we extract the answer letter (e.g. A) and compare
  it with ground truth. … we prompt gpt-4 (temperature T = 0) to compare the model-generated answer with
  a list of ground truth that comes with a dataset. … For claude-1.3 and claude-2.0, we use the LangChain
  library to call the Anthropic API or use Anthropic infrastructure. … We generate the dataset of 300
  arguments by prompting gpt-3.5-turbo (temperature T = 1) … We generate the dataset of 400 poems by prompting
  each of gpt-3.5-turbo, gpt-4, claude-1.3 and claude-2.0 (temperature T = 1) 100 times … we prompt gpt-3.5-turbo-061
  (temperature T = 0)'

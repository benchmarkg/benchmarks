  Harvey LAB-AA v1.1 Benchmark Private DatasetAgenticWritingReasoningLong ContextInstruction FollowingLegal
  Artificial Analysis' implementation of Harvey's Legal Agent Benchmark (LAB), testing AI agents on real-world
  legal work from Harvey's dataset of 120 private tasks spanning 24 legal practice areas. v1.1, built
  in collaboration with Harvey, checks every deliverable against the task's source documents for hallucinations,
  so work that passes every rubric criterion but contains a material hallucina … ity-100\"> Harvey LAB
  (Legal Agent Benchmark) is a long-horizon agentic benchmark developed by Harvey to measure how well
  AI agents perform real legal work rather than answer isolated legal questions. We built v1.1 in collaboration
  with Harvey. In human preference studies run by Harvey, human experts flagged hallucinations as a primary
  determining factor in which of two otherwise comprehensive responses they prefer, so v1.1 checks every
  del … A panel of three rubric judges grades each deliverable criterion-by-criterion against a task-specific
  rubric, and a separate two-stage check flags hallucinations against the task's source documents. We
  run Harvey LAB-AA v1.1 with our Stirrup agent harness on Harvey's dataset of 120 private tasks spanning
  24 legal practice areas. The headline score is the Hallucination-Gated All-Pass Rate, which credits
  a task only when the deliverables satisfy every rubric criterion and contain no material hallucination,
  averaged across the … vg]:rotate-45 text-base text-left border-b pb-2 mb-2 hover:no-underline\" data-radix-collection-item=\"\
  \">Methodology &]:visible [[data-state=open]>&]:grid-rows-[1fr] [[data-state=open]>&]:opacity-100\"\
  > All evaluations are conducted independently by Artificial Analysis. More information can be found
  in our Harvey LAB-AA v1.1 methodology. What's new in v1.1 v1.1 supersedes v1.0, and scores are not comparable
  across versions. Harvey's studies with legal professionals found hallucinations to be a primary factor
  in which outputs lawyers prefer, so we collaborated with Harvey to add a hallucination check to scoring.
  Harvey's latest private dataset, with improvements to the tasks and criteria A new hallucination check
  of every deliverable against the task's source documents, with material hallucinations penalized in
  scoring Judges updated to GPT-6 Sol, Grok 4.7 and Claude Opus 5.5. We found minimal self-preference

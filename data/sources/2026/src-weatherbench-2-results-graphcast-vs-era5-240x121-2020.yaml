notes: "Read for P3-S7-T05 on 2026-11-24: one of the maintainers' published results files in the public
  weatherbench2 bucket's benchmark_results/ folder, whose file names follow the site's selectors (forecast,
  ground truth, resolution, year); no source read says the site's plots are drawn from them. GraphCast,
  Google DeepMind's model, in the version the site scores for 2020 (trained on ERA5 1979-2019, src-weatherbench-2-faq),
  scored against ERA5. It holds every metric the evaluation computes for this forecast (RMSE, MSE, bias,
  ACC, forecast activity and the wind-vector RMSE for upper-level and surface variables, and SEEPS for
  precipitation), for 34 regions, the three pressure levels (500, 700, 850 hPa) and the 40 lead times
  6 to 240 h at 6 h, at 240x121 (1.5 degrees) for the evaluation year 2020. published is the object's
  timeCreated, equal to its updated, in the bucket's public JSON API record for the object (2026-03-03T08:31:38Z),
  whose md5Hash matches the bytes read. content_bytes is the NetCDF file's; content_sha256 is the text
  rendering that extract_preprocessing describes, so the quoted lines are that rendering of the file's
  values, not text the maintainers wrote. The file carries no global attributes and no units on its scores
  (only lead_time has one, hours), and names no person. P3-S7-T06 (2026-11-25) rebuilt the extract from
  the same bytes and the same rendering (content_sha256 unchanged), with the windows of its claim's cell
  added: temperature at 850 hPa, RMSE, global, 72 h, with the same row at 24 h and 240 h."

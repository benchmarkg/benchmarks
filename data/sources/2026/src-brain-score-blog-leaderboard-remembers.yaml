quote_extract: "2022. The sidebar explains why: the Geirhos benchmarks entered the aggregate, and this
  model cannot run on them at all. An unscored benchmark counts as zero, so the model's average drops
  even though nothing about the model itself changed. The distinction matters for research. A drop in
  score or rank is not always \"the model got worse.\" Sometimes the track changed: new benchmarks were
  added, the competitive field grew, or scoring was updated. The duel: comparing two models A single model's
  history can tell you a lot, but the race becomes most interesting when"

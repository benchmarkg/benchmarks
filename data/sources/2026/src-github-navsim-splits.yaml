quote_extract: "acted from these logs. The NAVSIM training / test splits subsample the OpenScene dataset
  splits. Moreover, the NAVSIM splits include overlapping scenes, while the Standard splits are non-overlapping.
  Specifically, `navtrain` is based on the `trainval` data and `navtest` and `navhard_two_stage` on the
  `test` data. As the `trainval` sensor data is very large, we provide a separate download link, which
  loads only the frames needed for `navtrain`. This eases access for users that only want to run the `navtrain`
  s … on the training and test splits supported by NAVSIM. Name Description Logs Sensors Config parameters
  OpenScene trainval Large split for training and validating agents with regular driving recordings. Corresponds
  to nuPlan and downsampled to 2HZ. 14GB >2000GB train_test_split=trainval test Small split for testing
  agents with regular driving recordings. Corresponds to nuPlan and downsampled to 2HZ. 1GB 217GB train_test_split=test
  mini Demo spl … n_test_split=navtrain navtest Standard split for testing agents in NAVSIM with non-trivial
  driving scenes. Available as a filter for test split. 983MB 223GB train_test_split=navtest navhard_two_stage
  Standard split for testing agents in NAVSIM v2 with real and synthetic driving scenes. Synthetic frames
  downloadable via download_navhard_two_stage.sh. 892MB 31GB train_test_split=navhard_two_stage Competition
  warmup_two_stage Warmup test split to validate submission on hugging face. Synthetic frames downloadable
  via download_warmup_two_stage.sh. 27MB 1.2G train_test_split=warmup_two_stage private_test_hard_two_stage
  Private test split for the challenge leaderboard on hugging face. Original and synthetic frames downloadable
  via download_private_test_hard_two_stage.sh 14MB 11GB train_test_split=private_test_hard_two_stage (*300GB
  without history) ## Splits The standard splits `t … ce with the bash scripts in [download](../download)
  NAVSIM provides a subset and filter of the `trainval` split, called `navtrain`. The `navtrain` split
  facilitates a standardized training scheme and requires significantly less sensor data storage than
  `travel` (445GB vs. 2100GB). If your agents don't need historical sensor inputs, you can download `navtrain`
  without history, which requires 300GB of storage. Note that the sensor data for `navtrain` can be downloaded
  separatel"

quote_extract: 'y in isolated, short-term tasks, they often fail to maintain coherent performance over
  longer time horizons. In this paper, we present Vending-Bench, a simulated environment designed to specifically
  test an LLM-based agent’s ability to manage a straightforward, long-running business scenario: operating
  a vending machine. Agents must balance inventories, place orders, se … products in the vending machine
  from the storage, collect cash, set prices and get the inventory of the vending machine. To achieve
  this technically, we implement and open source an extension to inspect-ai [3]. Our library extension
  allows agents to delegate tasks to sub-agents. The main agent interfaces with the sub-agents using the
  following tools: • … . Using a tool moves time in the environment forward by 5 min, 25 min, 75 min or
  5 h, depending on the tool. The agent has a memory of 30,000 tokens. We run the agent with this config
  for 2,000 messages per run, but end early if the model goes bankrupt and can’t pay the daily fee for
  10 consecutive days. We also do experiments with GPT-4o mini with variations of this config. Each experiment
  (model or config variation) is run 5 times. Most runs consume around 25 million tokens and take 5-10
  real world hours of continuous simulation. 2.4 Scoring The primary score of the agent is its net worth
  at the end of the game, i.e. a sum of: • The cash at hand • The cash not emptied from the vending machine
  • The value of the unsold products purchased and currently in the … ey balance, number of units sold
  and the agent’s tool use. 2.5 Human baseline To put the different LLM’s results in perspective to human
  performance, we had a human complete the task for five hours. We built a chat-based interface where

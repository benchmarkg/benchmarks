  editing code, and uses benchmarks to evaluate an LLM’s ability to follow instructions and edit code
  successfully without human intervention. Aider’s polyglot benchmark tests LLMs on 225 challenging Exercism
  coding exercises across C++, Go, Java, JavaScript, Python, and Rust. Aider polyglot coding leaderboard

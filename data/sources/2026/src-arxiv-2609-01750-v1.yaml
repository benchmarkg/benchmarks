quote_extract: 'cs interpretation. The Fusion Equilibrium Challenge invites the NeurIPS community to confront
  a deceptively simple but scientifically rigorous inverse problem: reconstruct the two-dimensional poloidal
  flux function ψ(R, Z) and a suite of scalar equilibrium parameters from non-magnetic diagnostics alone,
  namely external poloidal-field coil currents and Thomson-scattering electron temperature/density profiles.
  The challenge provides the first open-access, harmonized multi-machine benchmark for fusion, releasing
  a curated dataset of 9,113 DIII-D shots and 2,416 MAST shots — filtered for Thomson-diagnostic availability,
  feature completeness, and EFIT-reconstruction quality. Each shot is packaged into a standard Parquet
  file containing ∼260 (DIII-D) / ∼80 (MAST) EFIT flux maps and rich high-rate diagnostics. Two complementary
  awards reward intra-machine reconstruction fidelity (Smodel) on DIII-D and zero-shot cross-machine generalization
  (Gratio) to the topologically distinct MAST spherical tokamak. We argue that the challenge functions
  as a benchmark for reactor-ready equilibrium inference and as a probe of how far machine learning can

quote_extract: '. For now, we are retiring active PRs against this repository, and the repository is archived
  for historical reference. This repository provides a standardized evaluation harness for reproducible
  agent evaluations across various benchmarks. It supports several benchmarks and allows users to add
  new agents and benchmarks. The unified CLI allows evaluation acr … ficial [Holistic Agent Leaderboard
  (HAL)](https://hal.cs.princeton.edu) for sharing evaluation results. ## Features - **Unified `hal-eval`
  CLI across all benchmarks and agent types** - HAL supports SWE-bench Verified, USACO, AppWorld, CORE-bench,
  tau-bench, with support for more coming soon - Run yo … eneration and bug fixing capabilities - Full
  dataset (`swebench_verified`) or mini version (`swebench_verified_mini`) - Mini version is a subset
  of 50 randomly selected problems from the full dataset - Supports local, Docker, and VM execution -
  The task ids part of SWE-Bench Verified (Mini) can be found [here](https:/ … al/benchmarks/README.md](hal/benchmarks/README.md)
  for details. ## How Can I Submit My Results to the HAL Leaderboards? HAL is no longer accepting new
  result submissions through this harness. We have paused updates to the [leaderboard](https://hal.cs.princeton.edu/)
  and are focusing our work on [agent reliability](https://hal.cs.princeton.edu/reliability/). Existing
  public results remain available on the leaderboard. Active PRs for new leaderboard results are being
  retired while this repository is archived. We will have more to share soon. ## How can I use the agent
  traces from the HAL Leaderboard? For each benchmark and age'

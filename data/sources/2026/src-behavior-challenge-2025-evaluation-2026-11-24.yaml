quote_extract: 'Rules Challenge Tracks For the 1st BEHAVIOR-1K Challenge, We will have the following two
  tracks for the 1st challenge: Standard track: Participants are restricted to using the state observations
  we provided in the demonstration dataset for their policy models. RGB + depth + segmentation (semantic,
  instance, instance id) + proprioception information (Note that robot global poses are NOT allowed) No
  object state Privileged information track: Participants are allowed to query the simulator for any privileged
  inform … ou may also collect additional data yourself (via teleoperation, RL, scripted policies, etc.)
  for both tracks. However, you may not collect data on evaluation instances, as these are reserved for
  testing the generalization capability of your submitted policy. There are no restrictions on the type
  of policy used for either track. Methods such as IL, RL, or TAMP are all allowed … + $500 Brev Credits
  Running Evaluations We provide a evaluation script as a unified entry point for running evaluation:
  python OmniGibson/omnigibson/learning/eval.py policy=websocket log_path=$LOG_PATH task.name=$TASK_NAME
  env_wrapper._target_=$WRAPPER_MODULE Here is a brief explanation of the arguments: $LOG_PATH is the
  path to where the e … rithms for you to get started. Please refer to the baselines section for more
  information. Configure Robot Action Space By default, the evaluator will take in absolute joint angles
  for all the robot joints (23-dim). Participants are allowed to modify the controllers section in the
  robot config yaml file OmniGibson/omnigibson/learning/configs/robot/r1pro.yaml to suit their needs.
  By default the configuration is empty: controllers: Which is equivalant to absolute base velocity, …
  mands: false Metrics and Results We will calculate the following metric during policy rollout: Primary
  Metric (Ranking) Task success score: Averaged across 50 tasks. Calculation: Partial successes = (Number
  of goal BDDL predicates satisfied at episode end) / (Total number of goal predicates). Secondary Metrics
  (Efficiency) Simulated time: Total simulation time (hardware-independent). Distance navigated: Accumu
  … their performance on theese 10 instances and submit their scores using our Google Form located at
  the submission page. You should evaluate your policy 1 time (with time-outs = 2 * average task completion
  time within the dataset, provided by our evaluation script) on each instance. We will update the leaderboard
  once we sanity-check the performance. The remaining 10 instances are not used for evaluation and may
  serve as a test set before evaluating your final policy. Final evaluation: We will hold out 10 more
  instances for final evaluation. After we freeze the leaderboard upon submission deadline, we will evaluate
  the top-5 solutions on the leaderboard using these instances. Each instance differs in terms of: Initial
  object states Initial robot poses Challenge office hours Every Monday, 5-6pm PST, over Zoom. Performance
  Benchmarks System Spec The following benchmarks'

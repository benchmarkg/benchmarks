  Localization task are shown in Tab. I. The proposed method achieves the highest recall (0.5696)
  and the second highest precision (0.724). Speciﬁcally, the F-measure of the proposed algorithm is
  signiﬁcantly better than that of previous state-of-the-art (0.6376 vs. 0.4984). This conﬁrms the

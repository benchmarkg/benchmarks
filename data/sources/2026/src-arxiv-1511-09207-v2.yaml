  images are captured without user’s prior preference or intention and thus bear much more
  complexities and difﬁculties, such as blur, usual layout, non-uniform illumination, low resolution
  in addition to cluttered background. The organizers of the ICDAR 2015 Robust Reading Competition
  Challenge 4 [11] therefore prepared this contest to evaluate the performance of existing
  algorithms that were originally designed for focu … s and solutions that are both novel and
  effective. The experiments and comparisons on the ICDAR 2015 dataset evidently verify the
  effectiveness of the proposed strategies. II. DATASET AND COMPETITION The ICDAR 2015 dataset1 is
  from the Challenge 4 (Incidental Scene Text challenge) of the ICDAR 2015 Robust Reading
  Competition [11]. The dataset includes 1500 natural images in total, which are acquired using
  Google Glass. 1http://rrc.cvc.uab.es/?ch=4&com=downloads Different from the images from the
  previous ICDAR competitions [12], [13], [14], in which the texts are well positioned and focused,
  the images from ICDAR 2015 are taken in an arbitrary or insouciance way, so the texts are usually
  skewed or blurred. There are three tasks, namely Text Localization (Task 4.1), Word Recognition
  (Task 4.3) and End-to-End Recognition (Task 4.4), based on this benchmark. For details of the
  tasks, evaluations protocols and accuracies of the participating methods, refer to [11]. III.
  PROPOSED STRATEGIES In this section, we will brieﬂy describe the main ideas and work ﬂ … RISONS In
  this section, we will present the performances of the proposed strategies on the three tasks and
  compare them with the previous methods that have been evaluated on the ICDAR 2015 benchmark. All
  the results shown in this section can be also found on the homepage2 of the ICDAR 2015 Robust
  Reading Competition Challenge 4. A. Text Localization (Task 4.1) The text detection performance of

quote_extract: 'ns, mirroring the environments faced by working professionals. As AI models have advanced,
  so have their methods for solving APEX-Agents tasks. We’ve updated our benchmark with task specifications,
  tooling, and environments to ensure leaderboard accuracy. Most notably, APEX-Agents 1.1 no longer rewards
  noncommittal answers. This ensures that our tasks and grading align with how real-world professionals
  operate. The Mercor Research team is confident that this revised benchmark better measures how models
  can conduct economically valuable work. Claude Fable 5.1 remains on top of the leaderboard with 68.6%
  on Pass@1, though rankings have shifted throughout the rest of the board. If you’d like to run APEX-Agents
  1.1, you can find our dataset on Hugging Face and Harbor Hub. We’ve also released our evaluation agent
  on GitHub. Scattergunning In early July, we discovered that models were increasing benchmark scores
  by aggressively hedging their answers. We call it scattergunning. During our updates, we removed scores
  from the APEX-Agents leaderboard, or did not publish them, for models that engaged in this behavior.
  We define scattergunning as “a behavior where models provide multiple answers despite having a single
  answer that is well-specified by the environment.” Figure 1. A sample scattergunning response on APEX-Agents
  task “World221_TR_10.” Since APEX-Agents grades using binary rubric items that only check for inclusion
  of correct information, models that scattergun generally gain an advantage. Only one answer needs to
  be right, so hedging responses increases the chance of passing a given criterion. In some cases, noncommittal
  behavior is ar … hanges: Three task audits with Mercor domain experts to ensure that our problems are
  complex and realistic, but well-specified enough to be solvable. A new judge model that scores scattergunned
  rubric items as a zero. Explicit instructions in the system prompt not to engage in scattergunning.
  Collectively, these changes make the benchmark better at measuring a model’s ability to conduct economically
  valuable work. Task updates We’ve selected 80 tasks per domain as our refined benchmark. These tasks
  were chosen and refined through three audits with Mercor domain experts. Our first two audits focused
  on ensuring a single correct and well-specified answer exists. The last audit verified the fairness
  of information place … in the world files to clarify decisions. Since the original APEX-Agents release,
  we’ve noticed areas where tasks could have been more specific. We’ve updated the world files to contain
  all information needed from the failure modes that we’ve discovered. One answer is always correct, but
  the clarifying information is not entirely in the system prompt. Work … ed for APEX-Agents 1.1 via the
  Mail app. Judge model changes We’ve also changed our judge model to grade correctly in the presence
  of scattergunning. DeepSeek-v4-Flash-0731 (temperature = 0.1) provided the strongest baseline accuracy.
  We then conducted Genetic-Pareto (GEPA) optimization to refine the system prompt. The result was a judge
  that could accurately score scattergunned ru … 337 trajectories across APEX-Agents tasks. On a held-out
  set of 354 of the rubric items, we observed significant increases in accuracy and detection. This increased
  the false negative rate from 5.3% to 8.0% compared to the naïve grader, but we believe the massively
  improved detection rate for scattergunning and better accuracy than the human average for a panel of
  three independent … ility improvements across our MCP tools. This includes near-complete dependency
  support for all observed packages invoked by the code execution tool. We scanned 26,302 trajectories
  to determine an exhaustive list of all dependencies commonly used by the models. Any dependency that
  appeared at least 25 total times across the trajectories was included in our environment. Performance
  Our move towards better task specifications has resulted in higher scores in aggregate, but it has also
  created a much more discriminating and fair benchmark. In particular, we observe significantly more
  headroom between Pass@4 and Pass^4 scores than in APEX-Agents. This gap shows the percentage of tasks
  that a model solved at least once but could not solve consistently across four runs. In real-world professiona

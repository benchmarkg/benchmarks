  to ensure they correspond to the target material. For experimental screening, OCx24 utilizes two synthesis
  techniques, chemical reduction and spark ablation, to synthesize 572 samples covering a diverse set
  of samples of 13 different elements, as shown in Figure 2. To characterize each sample, X-ray fluorescence
  (XRF) and X-ray diffraction (XRD) were performed to determine its composition and to elucidate the purity
  and structure of the sample synthesized, respectively. Using this inform … s for any application to
  date. By combining the experimental and computational results, we built predictive models for HER. For
  this reaction, platinum catalysts are known to perform well, but their high cost limits their commercial
  deployment 4,34. Models were trained to predict the cell voltage at 50 mA/cm2 production rate using
  the adsorption energies of H and OH as features. A linear model was used to perform inference on the
  full set of 19,406 stable/metastable materials. In this high-data regime, we recover a Sabatier volcano
  with Pt predicted to be near the apex, despite there being no Pt-containing alloys in the tr … ur criteria
  and produced acceptable baseline results on Cu samples, see Figure 2 (right). We use both of these approaches
  to synthesize binary and ternary metal alloys in our study since they have complementary elemental accessibility,
  see Figure 3. Duplicate samples were synthesized in a subset of the experiments to aid in verifying
  the reproducibility of the sample synthesis and testing procedures. Spark ablation is a dry method,
  which uses additive printing with electrical energy to fragment metal rods into nanoclusters under an
  inert gas that can be directly deposited on a GDL. This was accomplished using a VSParticle© nanoparticle
  generato … with a chemical space representation for all experimentally synthesized, characterized, and
  tested samples. Darker shaded ternary phase diagrams result from connecting several diagrams and were
  intentionally not explored. 5 2.2 Experimental Testing Parallelized screening for CO2RR and HER was
  performed using a modified membrane electrode assembly (MEA) setup from a previous study 38. The testing
  process began with the electrolyzer operating at 50 mA/cm2 for 9 minutes to evaluate HER activity. Afterward,
  CO2 gas was introduced (flow rate: 30 s.c.c.m.) into the electrolyzers, and the CO2RR was carried out
  at current densities of 50, 100, 150, 200, and 300 mA/cm2 for 9 minutes each. The gas products were
  collected into headspace vials during each step of the CO2RR process and subsequently analyzed using
  gas chromatography (PerkinElmer Clarus 590) with an autosampler (PerkinElmer TurboMatrix HS110). The
  gas products were detect … k descriptors (e.g., Matminer features). When cleavage energies were not
  available (convergence errors, etc.) to compute Wulff and Boltzmann weighted energies, mean energies
  were used. All features were standardized to unit variance before training. We employ two regression
  models that will be presented here: a simple linear regression model and a random forest regression
  model. Besides these models, we also explored Gaussian process, kernel ridge, support vector regression,
  and gradient boosting regression models; all use the implementation in scikit-learn 73,74 and xgboost
  75 Python packages. 5 Results For our results, we explore whether models trained on experimental data
  using computational descriptors as input can produce results that are predictive of held out experimental
  data. Given the chemical diversity of the data, and the complexity of reactions like CO2RR, we are mainly
  looking at whether the models can predict trends and we are not focused on the absolute accuracy of
  the results. In many applications, the ability t … t this study will provide the basis for future research
  in further understanding the connections between computational models and experimental studies. For
  each model, we evaluate its performance under two different cross validation (CV) strategies: Leave
  One Out (LOO): Hold out a given sample, train on the remaining data, and evaluate on the held out sample.
  Leave One Composition Out (LOCO): Hold out all samples with a given composition (i.e. all AuxCuy samples,
  where x,y > 0), train on the remaining data, and evaluate on all held out samples. A high correlation
  for LOO indicates the model can predict outcomes for samples that share compositions with those in the
  training dataset, … data from XRD and XRF. When a match was available, we aggregated adsorption energies
  from only the corresponding matched bulk. Otherwise, we aggregated across the bulk material or materials
  with a composition closest to that of the XRF composition. Of the 441 electrochemical tests performed,
  230 were intended to be distinct sample preparations. Among the 230, there were samples with compositions
  that were very close to each other. We averaged over these samples to obtain 179 experimental targets
  for modeling efforts, 43 of which were matched (Phases with a fraction ≥70 wt.%, Rwp score ≤40 and q-score
  ≥70%). We found that training jointly on matched and unmatched samples, outperforms just training on
  matched alone (Figure 21). The complete set of tabulated resul … ption energies reveals a data driven
  Sabatier plot (b). Pt, which is annotated at the top of the volcano, was completely absent from the
  training data - even as an alloy. experimental voltage using LOCO cross validation is shown in Figure
  4a and 4c. The predictions and actual values are fairly well-correlated for both feature sets with R2
  = 0.59 for adsorption energies and R2 = 0.53 for Matminer features. The trendline for the correlation
  is shown in Fig. 4a and 4c as a black dashed line. There was a modest performance improvement (R2 =
  0.61) by including all adsorption energies rather than just OH and H, but this result is not shown here
  for simplicity. On average, we observe an experimental standard deviation of σ = 0.043V vs SHE for 297
  sample replicates within ±5% in XRF composition, an estimate of the noise in our targets (shaded gray
  in Figure 4). Using these linear models, we performed inference across all 19,406 stable and metastable
  materials included in the computational workflow, which is shown in Fig. 4b and 4d. A simple principal
  component analysis (PCA) was … the kinetic driving force, or potential, of the reaction. Given our experimental
  setup aimed to mirror industrial relevant conditions with two electrodes, fixing the potential through
  a three-electrode measurement was out of scope. To address this, we interpolate each product to a fixed
  applied potential of 3.3 V full cell voltage, the average potential across all testing experiments (see
  Section C.3 and Figure 14). This was performed for each sample and the interpolated results were used
  as targets for the regression models. For each product, we independently fit a random forest regressor
  to predict the production rate. We directly measured the quantites of H2, CO, CH4, and C2H4 using gas
  chromatography. We attempted to fit models for each of these products and also Total Liquid (est.),
  which is the balance over electrons assuming that the remaining product is for … wo electrons transferred).
  Boltzmann weighted adsorption energies and Matminer elemental features were used as inputs. The results
  are shown in Figure 5 for a few products under different cross-validation strategies. When evaluating
  LOO performance, we capture fair correlations for H2 (R2 = 0.46), CO (R2 = 0.44), and the liquid products
  (R2 = 0.43). In general, results using spark ablation (circle markers) have stronger correlation than
  those using chemical reduction (triangle markers). However, results using LOCO suggest little correlation
  for H2 (R2 = 0.22), and the liquid products (R2 = 0.18) and no correlation for CO (R2 = 0). The results
  for C2H4 are similarly poor, with R2 = 0.08 and 0.01 on LOO and LOCO, respectively. To predict the noise
  in our experimental results, we compute the standard deviation from 297 testing replicates within ±5%
  in XRF composition. We observe an experimental standard deviation of σ = 0.050 (H2), 0.040 (CO), 0.033
  (Liquid) µ mol/cm2s as shown by the shaded areas in Figure 5. Rather than fitting on production rates,
  we also explored fitting directly on the Faradaic efficiencies for each product, with similar results
  (Figure 22). When considering only the elemental feat … s suggest that leveraging only elemental features
  and adsorption energies of lone adsorbates on clean surfaces is not sufficient to predict the complexity
  of this chemistry. Despite these results, we hope they, alongside the 12 experimental dataset, provide
  an initial baseline for the community to evaluate more sophisticated predictive models. 5.3 Descriptor
  Importance For both CO2RR and HER we compare their performance using different adsorption energy and
  elemental features to predict H2 and Voltage, respectively. We focus on H2 for CO2RR due to the weak
  signals for the other products.'

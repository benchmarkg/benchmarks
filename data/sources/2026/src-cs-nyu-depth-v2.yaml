quote_extract: 'epth image, and the class labels from the dataset. Overview The NYU-Depth V2 data set
  is comprised of video sequences from a variety of indoor scenes as recorded by both the RGB and Depth
  cameras from the Microsoft Kinect. It features: 1449 densely labeled pairs of aligned RGB and depth
  images 464 new scenes taken from 3 cities 407,024 new unlabeled frames Each object is labeled with a
  class and an instance number (cup1, cup2, cup3, etc) The dataset has several components: Labeled: A
  subset of the video data accompanied by dense multi-class labels. This data has also been preprocessed
  to fill in missing depth labels. Raw: The raw rgb, depth and accelerometer data as provided by the Kinect.
  Toolbox: Useful functions for manipulating the data and labels. Downloads Labeled dataset (~2.8 GB)
  Raw dataset, Multi-part (~428 GB) Toolbox Labeled Dataset Output from the RGB camera (left), preprocessed
  depth (center) and a set of labels (right) for the image. The labeled dataset is a su … Dining Rooms
  (2/2) zip md5 Living Rooms (4/4) zip md5 Bedrooms (5/7) zip md5 Furniture Stores zip md5 Misc zip md5
  Correction to Segmentation Results Due to a bug in the segmentation evaluation, the segmentation results
  in the paper were about 2% higher across the board: Features Weighted Score Unweighted Score RGB Only
  50.3 44.0 Depth Only 53.7 43.0 RGBD 60.1 47.9 RGBD + Support 60.7 48.8 RGBD + Support + Structure'

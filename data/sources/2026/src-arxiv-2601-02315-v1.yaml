quote_extract: 'ving long-range dependencies. We achieve state-of-the-art results on two comprehensive
  flood mapping datasets: Sen1Flood11 and FloodPlanet. On Sen1Flood11 test data, Prithvi-CAFE (IoU 83.41)
  outperforms the original Prithvi (IoU 82.50) and other major GFMs (TerraMind 82.90, DOFA 81.54, spectralGPT:
  81.02). The improvement is even more pronounced on the hold-out test site, … n extracted by CNNs. Sen1Floods11
  consists of 446 hand-labeled image-labels pairs using Sentinel-1 and Sentinel-2 data collected worldwide.
  This data set is one of the widely used benchmark data sets to evaluate the performance of GFM for flood
  mapping as a downstream task, allowing direct comparison of our model’s performance with SoTA results.
  The second dataset, FloodPlanet, consists of 19 major flood event … . Thus, combining these two datasets
  for evaluation introduces sufficient complexity for flood segmentation tasks. As an evaluation metric,
  we opted for standard segmentation metrics such as Intersection over Union (IoU) for the foreground
  class (flood in our case) mean Intersection over Union (mIoU). IoU measures the overlap between the
  predicted segmentation and the ground truth, calculated as the ratio of their intersection to their
  u … recall, providing a balanced measure of accuracy for imbalanced classes. Implementation Details.
  To implement Prithvi-CAFE on Sen1Floods11, we used the exact given train, test, and validation split
  given by [3] to keep the results fairly comparable. FloodPlanet consists of 298 Sentinel-2 images paired
  with PlanetScope-derived labels. The original data set had inconsistent image sizes c … ls including
  DeepSAR [27] (72.22) and MM UNet [24] (73.84) (Table 1). UNet shows only marginal improvement (0.63)
  compared to Prithvi-CAFE. In the case of a geographically held-out test site (i.e., Bolivia), Prithvi-CAFE
  surpasses the baseline U-Net by 10.8 IoU, and recently proposed U-Prithvi (which also leverages U-Net
  with a Prithvi encoder)'

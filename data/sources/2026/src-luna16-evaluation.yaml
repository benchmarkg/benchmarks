quote_extract: "tive rate per scan. A candidate is considered to be a true positive if it detects a nodule
  from the reference standard. Our hit criterium is that a candidate should be located within a distance
  R of the nodule center, where R is set to the diameter of the nodule divided by 2. Candidates that are
  not detecting any nodule are considered false positives. Candidates that are detecting irrelevant f
  … ne a unique point on the FROC curve are evaluated. The point with the lowest false positive rate is
  connected to (0,0). The final score is defined as the average sensitivity at 7 predefined false positive
  rates: 1/8, 1/4, 1/2, 1, 2, 4, and 8 FPs per scan. Clearly a perfect system will have a score of 1 and
  the lowest possible score is 0. Most CAD systems in clinical use today have their internal threshold
  set to operate somewhere between 1 to 4 false posi … placement. This performance metric was introduced
  in the ANODE09 study and is described in detail in the ANODE09 paper. Evaluation script is provided
  in this link, so that participants can use the same evaluation method for the development of the algorithm.
  Submission¶ Each participant should upload the results file in csv format and a description file. The
  name of the result file should follow the following format [NAME]_[TRACK].csv, where track would be:
  NDET : the nodule detection track FPRED : the false positive reduction track (use candidates_V2.csv)

quote_extract: '2 [3] complements this set with a static surveillance scenario captured by elevated cameras,
  more closely resembling video surveillance applications. Figure 2 illustrates examples of these sequences.
  Three sequences were evaluated from each benchmark: 02, 04, and 05 from MOT17; 02, 03, and 05 from MOT20;
  and 07, 10, and 12 from SOMPT22. The average densities were 28.2 pedestrians per frame for MOT17, 47.7
  for SOMPT22, and 149.2 for MOT20. Selecting three sequences per benchmark is consistent with pr … ry
  et al. [7] reported results on three sequences from MOT17 and three from MOT20, and both ByteTrack [5]
  and BoT-SORT [6] used subsets of MOT17 in their validation experiments. D. Evaluation Metrics The evaluation
  was conducted using TrackEval4. The main metric is HOTA [17], which jointly balances detection, temporal
  association, and localization. As complementary metrics, we report IDF1 [18] to analyze identity preservation
  and MOTA [19] … re-identification,” in Proceedings of the IEEE/CVF International Conference on Computer
  Vision, 2019. [16] P. Dendorfer et al., “MOTChallenge: A Benchmark for Single-Camera Multiple Target
  Tracking,” International Journal of Computer Vision, vol. 129, no. 4, pp. 845–881, 2021. [17] J. Luiten
  et al., “HOTA: A higher order metric for evaluating multiobject tracking,” International Journal of
  Computer Vision, vol. 129, no. 2, pp. 548–578, 2021. [18] E. Ris'

  your algorithm evaluates `objective.value(params)`, which returns one scalar loss: ```text loss = sensitivity_loss
  + penalty ``` The `sensitivity_loss` compares the candidate detector's broadband strain-sensitivity
  curve to the Voyager reference detector on a log scale. Lower is better. Roughly, `0` means reference-level

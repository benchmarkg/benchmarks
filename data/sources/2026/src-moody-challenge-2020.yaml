  partial credit to misdiagnoses that result in similar treatments or outcomes as the true diagnosis as
  judged by our cardiologists. This scoring metric reflects the clinical reality that some misdiagnoses
  are more harmful than others and should be scored accordingly. Moreover, it reflects the fact that confusing

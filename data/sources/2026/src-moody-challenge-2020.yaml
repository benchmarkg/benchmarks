  opportunity to address this problem by providing data from a wide set of sources. Objective The goal
  of the 2020 Challenge is to identify clinical diagnoses from 12-lead ECG recordings. We ask participants
  to design and implement a working, open-source algorithm that can, based only on the clinical data provided,
  automatically identify the cardiac abnormality or abnormalities present in each 12-lead ECG recording.

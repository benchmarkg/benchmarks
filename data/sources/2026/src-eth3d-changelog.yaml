quote_extract: '2018-04-16: Added pre-rendered depth maps for training datasets for convenience We now
  provide archives ending on _depth.7z for all multi-view training datasets which contain rendered depth
  maps of the ground truth point clouds for all data … e dataset processing pipeline, which we used to
  prepare the benchmark datasets, is now available as open source under the BSD license on GitHub. The
  evaluation tools and sample code, which were already available before sepa … also be found there in
  the ETH3D project. 2017-10-04: Extension with more data We added 12 high-res multi-view datasets, 5
  low-res many-view datasets, and 20 two-view stereo datasets. Those datasets become the new test set,
  while all previous test set datasets were converted to training datasets. This way, all datasets which
  are mentioned in our paper are now available with … g two-view stereo algorithms. This data is described
  here in the documentation. We also removed a few stereo pairs with questionable calibration from the
  benchmark. If you notice any remaining issues, please let us know. 2017-07-19: Initial rel'

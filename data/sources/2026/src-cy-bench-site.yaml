quote_extract: 'enchmark for subnational crop yield forecasting, with coverage of major crop growing countries
  and underrepresented countries of the world for maize and wheat. By subnational, we mean the administrative
  level where yield statistics are published. When statistics are available for multiple levels, we pick
  the highest resolution. By yield, we mean end-of-season yield statistics as published by national statistics
  offices or similar entities representing a group of countries. By forecast … d forecasting. In-season
  forecasting is done at a number of time points during the growing season from start of season (SOS)
  to end of season (EOS) or harvest. The first forecast is made at middle-of-season (EOS - SOS)/2. Other
  options are quarter-of-season (EOS - SOS)/4 and n-day(s) before harvest. The exact time point or time
  step when forecast is made depends on the crop calendar for the selected crop and country (or region).
  All time series inputs are truncated up to the forecast or inference time point, i.e. data from the
  remaining part of the season is not used. Since yield statistics may not be available for the current
  season, we evaluate models using predictors and yield statistics for all available years. The models
  and forecasts can be used for food security planning or famine early warning. We compare models, algorithms
  and architectures by keeping other part … APAR China China Crop calendars: ESA WorldCereal EU EU NDVI:
  MOD09CMG Germany (2) Use EU shapefiles Crop Masks: ESA WorldCereal India India Mexico Mexico US US 1:
  Mali data at admin level 3. Mali data is also included in the FEWSNET Africa dataset, but at admin level
  1 only. 2: Germany data is also included in the EU dataset, but there most of the data fails coherence
  tests (e.g. yield = production / harvest_area) How to cite Plea … ines for how to get involved and
  contribute. Additional information For more information please visit the AgML website. Indices and
  tables Index Module Index © Copyright 2025, Wageningen University and Research. Built with Sphinx using
  a theme provided by Read the Docs.'

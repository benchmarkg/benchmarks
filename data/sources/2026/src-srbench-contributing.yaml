quote_extract: 'tent Skip to footer SRBench A living benchmark for symbolic regression SRBench User Guide
  Contributing Results Datasets Competition 2022 Competition 2023 Toggle menu Maintained by @cavalab and
  many open-source contributors Follow GitHub Repo Toggle Menu SRBench Benchmarked Methods References
  Contact User Guide Installation Reproducing the E … R method To contribute a symbolic regression method
  for benchmarking, fork the repo, make the changes listed below, and submit a pull request to the dev
  branch. Once your method passes the basic tests and we’ve reviewed it, it will be available as part
  of srbench. Please note that the schedule for updating benchmarks is dependent on a lot of factors including
  availability of computing resources and availability of all our contributors. If you are on a tight
  schedule, it is better to plan to benchmark your method yourself. You can leverage this code base and
  previous experimental results to do so. Requirements An open-source method with a scikit-learn compatible
  API Your method should be compatible with Python 3.7 or higher to ensure compatibility with conda-forge.
  If your method use … essor.py for complete documentation. It should contain: est: a sklearn-compatible
  Regressor object. model(est, X=None): a function that returns a sympy-compatible string specifying the
  final model. It can optionally take the training data as an input argument. See guidance below. eval_kwargs
  (optional): a dictionar'

quote_extract: 'tern Recognition arXiv:2607.01813 (cs) [Submitted on 2 Jul 2026] Title:MMBench-Live: A
  Continuously Evo … istribution-consistent update strategy that extracts task-related visual patterns
  from the original benchmark to guide data collection and filtering. Instantiated from MMBench, MMBench-Live
  contains 5.9K newly generated evaluation instances with a high answer correctness rate, while each update
  costs about USD 30 and takes 1-2 hours. Extensive evaluations show that MMBench-Live preserves stable
  model rankings, maintains semantic alignment with the original benchmark, and exhibits weaker contamination-related
  memorization signals, suggesting a practical and scalable paradigm for sustainable multimodal benchmark
  evolution. The project is available at this https URL. Subjects: C'

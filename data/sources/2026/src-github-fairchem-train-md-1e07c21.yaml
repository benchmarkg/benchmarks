quote_extract: 'F) - Initial Structure to Relaxed Structure (IS2RS) This document is a tutorial for training
  and evaluating models for each of these tasks as well as generating submission files for the [evaluation
  server hosted on EvalAI](https://eval.ai/web/challenges/challenge-page/712/overview). `main.py` serves
  as the entry point to run any task. This script requires two command li … on trajectory. ## Create EvalAI
  OC20 submission files EvalAI expects results to be structured in a specific format for a submission
  to be successful. A submission must contain results from the 4 different splits - in distribution (id),
  out of distribution adsorbate (ood ads), out of distribution catalyst (ood cat), and out of distribution
  adsorbate and catalyst (ood both). Constructing the submission file for each of the above tasks is as
  follows: ### S2EF/IS2RE: 1. Run predictions `--mode predict` on all 4 splits, gen … ase_joint.yml) ##
  Create EvalAI OC22 submission files EvalAI expects results to be structured in a specific format for
  a submission to be successful. A submission must contain results from the 2 different splits - in distribution
  (id) and out of distribution (ood). Construct submission files for the OC22 S2EF-Total/IS2RE-Total tasks
  as follows: ### S2EF-Total/IS2RE-Total: 1. Run predictions `--mode predict` on'

quote_extract: 'room environment. The goal is to process a single 360° video and audio recording of a
  room where multiple, separate conversations are happening simultaneously, and to both transcribe each
  speaker’s speech and identify which speakers belong to the same conversation. This task addresses the
  challenging scenario of understanding overlapping conversations i … y topics like hobbies, work, entertainment,
  and personal stories Natural acoustic environments with realistic background noise from other ongoing
  conversations Up to 8 active speakers divided into up to 4 simultaneous conversations Combined transcription
  and clustering challenge requiring both accurate speech recognition and conversation grouping Quick
  start Datasets: MCoRec data Baseline … ximately 6 minutes. Note: Individual smartphone recordings and
  lapel microphone audio are only available for the training set to facilitate system development. The
  development and evaluation sets contain only the central 360° video and audio, as the core challenge
  focuses on processing the difficult multi-speaker, multi-conversation scenario captured by the central
  camera setup wit … l Speaker’s WER: Word Error Rate computed for each speaker’s transcription Conversation
  Clustering Performance: Pairwise F1 score measuring clustering accuracy Joint ASR-Clustering Error Rate
  (Primary Metric): Combined metric that weights transcription performance and clustering performance
  Important Dates Data Release: July 1st, 2025 (train and dev sets) Evaluation Data Release: 28 Jan 2026
  Final Submission Deadline: 6 Feb 2026 Workshop: 4 May 20'

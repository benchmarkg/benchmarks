  TASK C test set ) ``` **Speaker Tagging:** Some ACI-BENCH subsets include swapped speaker tags (e.g.,
  [patient], [doctor]) that originate from the Automatic Speech Recognition (ASR) process. This reflects
  a known and common limitation of ASR-based transcripts, which we intentionally left uncorrected, as
  our goal was to provide a realistic dataset that captures such errors. Automated methods (inclu … ree/main/corrections))

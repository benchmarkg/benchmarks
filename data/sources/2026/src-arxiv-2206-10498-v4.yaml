quote_extract: 'nning or merely retrieving from their vast world knowledge. There is a strong need for
  systematic and extensible planning benchmarks with sufficient diversity to evaluate whether LLMs have
  innate planning capabilities. Motivated by this, we propose PlanBench, an extensible benchmark suite
  based on the kinds of domains used in the automated planning community, especially in the International
  Planning Competition, to test the capabilities of LLMs in planning or reasoning about actions and change.
  PlanBench provides sufficient diversity in both the task d … the benchmark. The updated version of the
  entire benchmark, including the tools, datasets, and the scripts to reproduce the prompts and results
  in this paper, can be found at https://github.com/karthikv792/LLMs-Planni … year back and is currently
  in use by various researchers.2 We have significantly increased the scope of our benchmark (with additional
  test cases and domains) from the initial version. But the idea of developing benchmarks to evaluate
  emergent … m of the prompt will depend on the specific test cases, but every instance will start with
  a description of the lifted planning domain that describes what actions can be executed, their preconditions
  and their effects. The current set of test cases includes the following cases: 1. Plan Generation -
  Can the LLM come up with valid plans that will achieve a specific goal? 2. Cost Optimal Planning - Can
  the LLM come up with plans that are optimal to achieve a specific goal? 3. Plan Verification - Can the
  LLM determine if a plan will successfully execute, and if not, can it explain why? 4. Reasoning about
  plan execution - Can the LLM reason about what happens when a plan is executed? 5. Robustness to goal
  reformulation - Can the LLM recognize the same goal when specified in different ways? 6. Ability to
  reuse plans - Can the LLM recognize scenarios where it can reuse part or the whole of the original plan
  to achieve the new goal? 7. Replanning - Can the LLM replan for cases where an unexpected change is
  reported? 8. Plan Generalization - Can the LLM take specific plans, extract underlying procedural patterns

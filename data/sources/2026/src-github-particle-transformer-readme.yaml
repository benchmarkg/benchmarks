quote_extract: "This repo is the official implementation of \"[Particle Transformer for Jet Tagging](https://arxiv.org/abs/2202.03772)\"\
  . It includes the code, pre-trained models, and the JetClass dataset. ![jet-tagging](figures/jet-tagging.png)
  ## Updates ### 2023/07/06 We added a [helper function](dataloader.py) to read t … large margin on various
  jet tagging benchmarks. ![arch](figures/arch.png) ## Getting started ### Download the datasets To download
  the JetClass/QuarkGluon/TopLandscape datasets: ``` ./get_datasets.py [JetClass|QuarkGluon|TopLandscape]
  [-d DATA_DIR] ``` After download, the dataset paths will be u … =0.4' ``` **To run the training on the
  JetClass dataset:** ``` ./train_JetClass.sh [ParT|PN|PFN|PCNN] [kin|kinpid|full] ... ``` where the first
  argument is the model: - ParT: … tClass_kinpid.yaml): kinematic inputs + particle identification - [full](data/JetClass/JetClass_full.yaml)
  (_default_): kinematic inputs + particle identification + trajectory displacement Additional arguments
  will be passed directly to the `weaver` command, such as `--batch-size`, `--start-lr`, `--gpus`, e"

quote_extract: 'search on direct RGB-D SLAM, we propose a novel, well-calibrated benchmark for this task
  that uses synchronized global shutter RGB and depth cameras. It includes a training set, a test set
  without public ground truth, and an online evaluation service. We observe that the ranking of methods
  changes on this dataset compared to existing ones, and our proposed algorithm outperforms all other
  evaluated SLAM methods. Our benchmark and our open source SLAM algorithm are available at: www.eth3d.net

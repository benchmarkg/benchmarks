quote_extract: "# Proof Bench Automated theorem proving benchmark for Lean 4. The overall objective is
  to create a benchmark that tests AI models' ability to solve problems at the advanced undergrad or graduate
  level, in Lean. Proof Bench evaluates models on Lean 4 mathematics … configuration, development commands,
  and platform run instructions live in `SETUP.md`. ## Repo Structure - `problems/`: Lean theorem files
  plus informal statements/proofs under `problems/informal/`. The folder only has sample problems; the
  rest of the benchmark is private. - `data/proof-bench.jsonl`: exported metadata used at runtime - `proof_bench/agent.py`:
  agent loop and tool orchestration - `proof_bench/tools.py`: `lean_run_code`, `lean_loogle`, and `submit_proof`
  tool subclasses - `proof_bench/mcp_client.py`: MCP client infrastructure and Lean execution - `proof_bench/prover.py`:
  att … t After following `SETUP.md`, export the dataset then run: ```bash python proof_bench/validate_and_export.py
  python main.py --dataset exported --model openai/gpt-4o --k 3 ``` Useful variants: ```bash python main.py
  --dataset exported --model openai/gpt-4o --k 3 --include-nl-proof python main.py --dataset exported
  --problem-id algebraicGeometry_vakil_ch_11_2_E --model openai/gpt-4o python main.py --dataset exported
  --domains logic number_theory --model openai/gpt-4o ``` ## Whe"

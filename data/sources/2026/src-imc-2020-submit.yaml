quote_extract: 'le. You can also check the status of your submission via the status tracking spreadsheet.
  Submission link Submission status Submission spec LaTeX kit We have evaluated several methods from our
  baseline repository as part of an upcoming paper — please let us know if you authored these papers and
  would like to have the submission under your name. Constraints Submissions are broken down into categories
  by number of keypoints and descriptor size. For number of keypoints: we consider a limited budget of
  2048 features, and an unlimited budget (capped to 8000 features per image for practical reasons). For
  descriptor size: we focus on 128-dimensional floating-point descriptors (as float32), the standard set
  by SIFT, which remains the most common va … close to saturated performance. The benchmark is quite heavy
  in terms of computational cost, so we will enforce a limit on the number of submissions: each group
  may send two submissions per week. We may adjust this limit in the future. Hyperparameter tuning on
  the test set is not allowed and may be penalized. Terms and conditions The primary … help advance science.
  Determining a winner Each submission will be scored and ranked by the evaluation metric, as stated on
  the competition website, which is the mean Average Accuracy (mAA) averaged across the stereo and multi-view
  tasks. The organizers reserve the right to update these and any other terms until April 1, 2020, as
  more tasks may be added to the benchmark. Explaining your submission Participants should provide a short
  description of their solution, where they detail their method and the data used for training and/or
  hyperparameter selection (if applicable), and guarantee it does not overlap our test set. To this end
  we aks them to upload a short, non-anonymous submission to arXiv within one week after the end of the
  submission period (check the front page for details). A template may be provided. In order to account
  for third … and should be self-explanatory (e.g. not a random string). Please note that the organizers
  will release all information after the challenge deadline. Methods with incomplete descriptions (e.g.
  description: "Paper under review.") will not be processed. A 1-, 2-line description should not be enough

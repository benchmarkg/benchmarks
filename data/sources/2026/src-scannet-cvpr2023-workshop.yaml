quote_extract: 'n Important Dates Schedule Invited Speakers Organizers ScanNet Indoor Scene Understanding
  Challenge CVPR 2023 Workshop, Vancouver, Canada June 19, 2023, Afternoon, West 205-206 Introduction
  3D scene understanding for indoor environments … r spaces, the semantics of objects that are present,
  and their relative configurations in 3D space. We present the first comprehensive challenge for 3D scene
  understanding of entire rooms at the object instance-level with 5 tasks based on the ScanNet dataset.
  The ScanNet dataset is a large-scale semantically annotated dataset of 3D mesh reconstructions of i
  … ification: classification of entire 3D room into a scene type Highlight - Data Efficient Challenge!
  In the data efficient challenge, training is conducted on Limited Scene Reconstructions (LR) or Limited
  Scene Annotations (LA), for the tasks of 3D Semantic Segmentation, Instance Segmentation and Object
  Detection. Highlight - ScanNet200 Challenge! In the ScanNet200 challenge, large-vocabulary scene understanding
  is challenged with 200 class categories for the tasks of 3D semantic segmentation and 3D instance segmentation.
  For each task, challenge pa … e provided with prepared training, validation, and test datasets, and
  automated evaluation scripts. In addition to the public train-val-test split, benchmarking is done on
  a hidden test set whose raw data can be downloaded without annotations; in order to participate in the
  benchmark, the predictions on the hidden test set are uploaded to the evaluation server, where they
  are evaluated. Submission is restricted to submissions every two weeks to avoid finetuning on the test
  dataset. Se … t research focus is on deep learning, generative models, and 3D shape analysis and reconstruction..
  Tom Funkhouser is a principal research scientist at Google and a Professor Emeritus at Princeton University.
  His research interests include 3D computer vision … hip, NSF Career Award, two Excellence in Teaching
  Awards, and several best paper awards. Organizers Angela Dai Technical University of Munich Angel X.
  Chang Simon Fraser University Manolis Savva Simon Fraser University Matthias Niessner Technical University
  of Munich Acknowledgments Thanks to visualdialog.org for the webpage format.'

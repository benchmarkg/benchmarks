quote_extract: "e Contact Overview Epoch Capabilities Index Models Benchmarks Data About Back to benchmarks
  FrontierMath Tiers 1-3 (v2) Expert-written math problems covering advanced undergrad through early career
  research. About Methodology Citation FrontierMath Tiers 1-3 (v2) FrontierMath is a benchmark of hundreds
  of original, exceptional … s problems crafted and vetted by expert mathematicians. The questions cover
  most major branches of modern mathematics – from computationally intensive problems in number theory
  and real analysis to abstract questions in algebraic geometry and category theory. Solving a typical
  problem requires multiple hours of effort from a researcher in the relevant branch of mathematics, and
  for the upper end questions, multiple days. On 2026-06-12, we released a major update, addressing errors
  in 42% of problems. Following this update, the full FrontierMath dataset consists of 338 problems. This
  is split into a base set of 295 problems, which we call Tiers 1-3, and an expansion set of 43 exceptionally
  difficult problems, which we call Tier 4. We have made twelve problems public: ten from Tiers 1-3 and
  two from Tier 4. Unless stated otherwise, all the numbers on this hub correspond to evaluations on the
  private sets. You can find the public problems here. FrontierMath was developed with funding from OpenAI,
  who has exclusive access to a subset of the benchmark. See our conflict of interest statement for details.
  Learn more about FrontierMath Methodology For FrontierMath, we recommend using the log viewer on the
  public questions as the best way to understand the evaluation settings (e.g. click here for o4-mini-2025-04-16
  with high reasoning effort). For each FrontierMath question, the model needs to submit a Python function
  answer() that returns the answer. The answer is a Python object, often (although not always) an integer
  or a sympy object. Our implementation allows the model to reason and run Python code. We use the following
  prompt, which specifies the mod … itrary Python code Submit your answer using the submit_answer tool
  when you are confident in your answer. Token limits: There is a hard limit of 1,000,000 tokens. If you
  exceed this, the conversation will end immediately (even if you haven’t submitted an answer). If you
  reach 660,0 … It is still your responsibility to avoid hitting the hard limit. Both input and output
  tokens count towards the limits. Scoring: If your answer is correct you will get 1 point. If it is incorrect,
  or if you don’t submit an answer, you will get 0 points. Explain your reasoning to me before submit
  … tool. Use the submit_answer tool when you’re ready to submit The maximum runtime for a python tool
  call is 30 seconds. The code is executed on typical commodity hardware for the year 2025. Here is the
  problem to solve. The answer type is {answer type}. {question} The code used in our implementation can
  be found here. Changelog 2026-06-12. We released v2, which corrected 123 problems in Tiers 1-3 and 12
  problems in Tier 4. We also removed 5 problems from Tiers 1-3 and 7 problems from Tier 4. v1 can be
  found here. Citations Citation Epoch AI, 'FrontierMath Tiers 1-3 (v2)'. Published online at epoch.ai.

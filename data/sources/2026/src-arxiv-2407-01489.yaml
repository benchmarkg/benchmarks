  72b 144 (28.80%) AppMap Navie [5] GPT-4o 131 (26.20%) AGENTLESS GPT-4o 194 (38.80%) … shows the performance
  of AGENTLESS compared with prior agent-based approaches on SWE-bench Verified. Similar to the results
  on SWE-bench Lite, AGENTLESS maintains its strong performance and is able to solve 194 out of 500 problems
  (38.80%). AGENTLESS is able to achieve the second highest performance compared with open-source approaches
  and perform better than many closed-source / commercial techniques. Furthermore, we note that AGENTLESS
  performs the best among all techniques that use GPT-4o as the LLM.'

quote_extract: 'Chunqiu Steven Xia∗ Yinlin Deng∗ Soren Dunn Lingming Zhang University of Illinois Urbana-Champaign
  … Implementation. We implement AGENTLESS using GPT-4o (gpt-4o-2024-05-13) [72]. By default, we query
  the LLM with greedy decoding. During sampling, we use a sampling temperature of 0.8. For the embedding-based
  retrieval method, we implement our approach using LlamaIndex [60]. We use OpenAI’stext-embedding-3-small
  [73] model to compute the embedding with chunk size of 512 and chunk overlap of 0. For each issue, we
  first localize to the top three suspicious files, and then localize to an unrestricted number of suspicious
  classes and functions within these files, all using greedy decoding. Next, to maximize the chances of
  finding the correct edit locations, we draw four samples of edit locations per issue (i.e., the third
  step in the localization phase). This gives us 4 separate sets of edit locations per issue. For each
  set, we adopt a context window of± 10 lines around each edit location, and generate 10 patches (1 greedy
  and 9 samples). This results in a total of 40 patches per … Table 6: Performance on SWE-bench Verified.

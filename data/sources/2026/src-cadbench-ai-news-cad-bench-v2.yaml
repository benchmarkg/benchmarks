quote_extract: 'et to Hugging Face September 8, 2026 • Major Benchmark Release CAD Bench v2: A Corrected
  Benchmark for the New Frontier Today we are releasing Parametric CAD Bench v2 and freezing CAD Bench
  v1. The new release keeps the 100-task parametric CAD format while updating the modeling runtime, correcting
  the evaluation … 3 47 / 100 $ 75.68 Receipt 10 GLM-5.3 ( max ) mini-swe-agent 64.04 % ± 8.61 51 / 100
  $ 28.15 Receipt What changed in v2 FreeCAD moved from 0.21.2 to 1.1.0. The current runtime matches a
  modern, pinned CAD stack and gives agents substantially more time for long modeling loops … r package,
  structured specification, and reference geometry lived in the same task image behind filesystem permissions.
  v2 moves all held-out assets into a separate verifier image. The agent receives FreeCAD and the prompt;
  the verifier receives the answer artifacts only after the run. Reward report … ards. v2 also declares
  the expected answer artifacts under Harbor schema 1.2 so missing output is handled consistently. The
  validator is updated from 0.1.0 to 0.4.0. Missing answers, invalid files, symlinks, and scorer crashes
  follow explicit zero-reward paths, while the generated scr … over issues addressed in V2. You can review
  the contributions in the CAD Bench submissions repository. Why v1 is frozen The task count is still
  100, but the runtime, validator, isolation boundary, artifact contract, and failure handling changed.
  That makes a v2 score a measurement on a new benchmark version, not a continuation of the v1 series.
  We are preserving the complete v1 table and its pinned result receipts, while closing it to new submissions.
  All new results should target v2. View the v2 leaderboardOpen in HarborView frozen v1'

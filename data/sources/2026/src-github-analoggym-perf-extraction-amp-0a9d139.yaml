notes: 'Read for P1-S8-T04 on 2026-11-18 at commit 0a9d1390ade361e2b4a2d33181e22367edbb8afc, as plain
  text: the amplifier script the README offers "for reference". It parses the Ngspice measurement logs
  and the transient response (slew rate, settling time), and its TB_Amplifier_ACDC class writes a batch
  of sizings into the testbench, runs both testbenches and returns a hand-weighted cost; it prints FOMS
  and FOML and computes no FOM_AMP. The LDO script and the RGNN_RL example (main_AMP.py, AMP_NMCF.py,
  whose reward sums per-specification scores against targets) were read and are not recorded. The file
  names no person.'

quote_extract: 'ory-SFT amplifies dependence on training-seen interface realizations, as reflected by
  larger performance gaps under perturbation. 4.1. Details of Re-Evaluation We apply PIPE to two widely
  used agent benchmarks, AgentBench (Liu et al., 2023a) and AgentGym (Xi et al., 2025b), covering a total
  of 16 environments. Most environments use task success rate as the primary evaluation metric, while
  a small subset (e.g., Mind2Web in AgentBench) adopts benchmark-specific reward … erage performance change
  induced by interface perturbations. We first re-evaluate agents trained on trajectories collected from
  AgentBench (Liu et al., 2023a). AgentInstruct (Zeng et al., 2024) collects interaction trajectories
  from AgentBench environments and fine-tunes the LLaMA2 (Touvron et al., 2023) family, releasing the
  AgentLM-7B/14B/70B models. Similarly, AgentFLAN (Chen et al., 2024) constructs its tuning data from
  AgentBench interactions and reports substantial performance gains on the original benchmark. For AgentGym
  (Xi et al., 2025b), we did not identify prior work that directly fine-tunes agents using its released
  trajectories. We therefore fine-tune Qwen3-8 … ided by AgentGym, and compare performance before and
  after training. Training hyperparameters and additional implementation details are deferred to Appendix
  K. Finally, we evaluate API-based models (GPT-3.5(OpenAI, 2023a), GPT-4o-mini(OpenAI, 2023b), and GPT-5-mini(OpenAI,
  2025)) to examine whether strong proprietary agents also exhibit sensitivity to the … cs or Interfaces?

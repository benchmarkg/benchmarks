  # P … p(_rngs[2], state, action, env_params) ``` # ⬇️ Installation The latest Craftax release can be
  installed from PyPi: ``` pip install craftax ``` If you want the most recent commit instead use: ```
  pip install git+https://github.com/MichaelTMatthews/Craftax.git … how to beat the game is present in
  `tutorial.md`. The controls are printed out at the beginning of play. # 📈 Experiment To run experiments
  see the [Craftax Baselines](https://github.com/MichaelTMatthews/Craftax_Baselines) repository. # 🔪 Gotchas

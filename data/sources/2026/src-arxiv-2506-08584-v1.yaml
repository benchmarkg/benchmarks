quote_extract: h failure mode, i.e., crafted in such a way that it would be plausible for an LLM to
  fall into the corresponding error. Each clinician authored 12 adversarial questions (2 per issue ×
  6 issues), resulting in a total of 120 adversarial questions. Clinicians were asked to ensure the
  realism and diversity of the questions, reflecting what actual patient might ask du … ted to eight
  LLMs in Table 4. For each model, we issued the same prompt three times to sample variations in
  generation. In total, this yielded 2,880 QA pairs (120 questions × 8 models × 3 generations). We
  used a hybrid annotation protocol to determine whether each adversarial question successfully
  triggered its target failure mode. One mental health professional reviewed a random subset of 96
  QA pairs (3% of the full set), while GPT-4.1 was used to annotate the full set. We provided GPT4.1
  with detailed definitions of each failure type and included an in-context example drawn from
  COUNSEL

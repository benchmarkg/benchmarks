quote_extract: 'raining them is only interesting as an auxiliary task in the process of determining a
  parameter of interest like the signal strength µ. 3 3.1 Metrics Participants provided a model that can
  analyse a pseudo-experiment to determine (µ16, µ84), the bounds of the 68.27% (approximately one standard
  deviation of a standard normal distribution) Confidence Interval (CI) for µ. The model is evaluated
  from the set of [µ16,i, µ84,i] intervals obtained from Ntest pseudo-experiments, see Figure 1a. The
  model’s performance is assessed based on two criteria: Average Interval Width w (the smaller the better)
  computed as w = 1 Ntest N i=1 |µ84,i − µ16,i| and the Coverage, the frequency with which µtruth is covered
  by the CI (the closer to the standard 68.27% probability the better) computed as c = 1 Ntest N i=1 1
  if µtrue,i ∈ [µ16,i, µ84,i]. A penalising function f has been defined to penalise the departure of c
  from the expected 68.27%, taking into account σ68 = (1−0.6827)0.6827 Ntest the binomial statistical
  error on c: f (c) = 1+Ic<0.6827−2σ68 · c − (0.6827 − 2σ68) σ68 4 +Ic>0.6827+2σ68 · c − (0.6827 + 2σ68)
  σ68 3 . (1) 100 Coverage interval 102 average true 80 pse … function because, within the High Energy
  Physics (HEP) field, overestimating uncertainty is deemed more acceptable than underestimating it [72,
  73]. Hence, coverage exceeding 68.27% incurs a lesser penalty than coverage falling below 68.27%. The
  final Quantile Score (the larger the better) used to rank participants is calculated as follows: score
  = − ln((w + ϵ)f (c)), (2) where w represents the average width of the Confidence Interval, c is the
  coverage, and ϵ = 10−2 is a regularisation term to guard against submissions that report unrealistically
  narrow CIs. To ensure efficient use of resources, each participant’s model inference was executed across
  100 pseudoexperiments times 10 trials, each with distinct values of µtruth, with a time limit of 20s
  per inference on CPU or GPU. In the Final phase of the competition, each participant’s best submission
  was evaluated over 100 pseudo-experiments, times 1000 trials, to minimize the statistical variance.
  3.2 Limitations The main limitation of the setup is that biases can be exactly parameterised: we are
  in the "known unknowns" regime. "Unknown unknow … the public leaderboard. Figure 3 shows the results
  for all trials for the trio. The CI width is seen falling at large values of µ: this is due to the clipping
  the Confidence Interval to a maximum value of 3 (which was not done in Figure 1a), which was the maximum
  value in this competition. Such clipping would be meaningless in the context of a real physics measurement
  where µ is truly unknown. This is the only "hack" specific to the competition context that could be

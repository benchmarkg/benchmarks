  challenge, the only public benchmark of csPCa detection/diagnosis was the ProstateX Challenge, which
  used a testing set of 140 mpMRI exams to evaluate and compare AI algorithms. However, its small sample
  size, limited diversity (all case … ate-AI towards clinical translation (Reinke et al., 2022).¶ The
  2022 edition of PI-CAI will focus on validating AI at automated 3D detection and diagnosis of csPCa
  in bpMRI. PI-CAI primarily consists of two sub-studies:¶ AI Study (or … ll participating teams and the
  research community at large. Teams can use this dataset to develop AI models, and submit their trained
  algorithms (in Docker containers) for evaluation. At the end of this open development phase, all algorithm
  ar … erformance on a hidden testing cohort of 1000 unseen scans. In the closed testing phase, organizers
  retrain the top-ranking 5 AI algorithms using a larger dataset of 9107 bpMRI scans (including additional
  training scans from a private dataset). Finally, their performance is re-evaluated on the hidden testing
  cohort (with rigorous statistical analyses).¶ Reader Study: 50+ international prostate radiologists
  perform a reader study using a subset of 400 scans from the hidden testing cohort. For each case, radiologists
  complete their assessments in two rounds. At first, using basic clinical and acquisition variables +
  bpMRI sequences only, enabling head-to-head comparisons against AI trained on the same. And then, using
  basic clinical and acquisition variables + … ge radiologist at detection and diagnosis of csPCa in MRI.¶
  In the end, PI-CAI aims to benchmark state-of-the-art AI algorithms developed in the grand challenge,

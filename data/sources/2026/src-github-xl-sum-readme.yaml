  - [Citation](#citation) ## Datasets ***Disclaimer: You must agree to the [license](#license) and terms
  of use before using the dataset.*** We are releasing two versions of the dataset: an older version that
  has been reported in the paper; and a newer version with **another added language (Traditional Chinese)**,
  more data, better formatting, better extraction, larger evaluation splits, and deduplication. We recommend
  using the latter and thus have organized the repository with data counts and benchmarks of the newer
  version. The new version contains a total of **1.35 million** article-summary pairs, making XL-Sum the
  **largest** text summarization dataset publicly available. All dataset files are in `.jsonl` format
  … data. To use this model for evaluation/inference refer to [Training & Evaluation](#training--evaluation).

  common chemistry, a reection of the USPTO database. Furthermore, the reference routes represent similar
  chemistry as the reactions in t … s and ZINC are updated with time, making it hard to pick one representative
  snapshot of the database for the benchmark. We instead propose to simply use all the leaves of the 10
  000 routes as stock molecules. Because we added an overlap check when extracting the routes, we can

  527 PaRoutes: towards a framework for benchmarking retrosynthesis route predictions† Samuel Genheden
  * and Esben Bjerrum Received 25th February 2022 Accepted 10th July 2022 DOI: 10.1039/d2dd00015f rsc.li/digitaldiscovery
  We introduce a framework for benchmarking multi-step retrosynthesis methods, i.e. route predictions,
  called PaRoutes. The framework consists of two sets of 10 000 synthetic routes extracted from the patent
  literature, a list of stock compounds, and a curated set of reactions on which one-step retrosynthesis
  models can be trained. PaRoutes also comes with scripts to compute route quality and route diversity,
  quantities that are important for comparing methods. As an illustration of the framework, we compare
  three template-based methods implemented in the AiZynthFinder software: Monte Carlo tree search (MCTS),
  Retro*, and a depth-ﬁrst proof-number search (DFPN) algorithm. It is found that DFPN i … issues and
  caveats needed when adapting the framework for other methods,.e.g., template-free methods or expert
  systems. We will continue to update and expand the application of PaRoutes, and we also encourage practitioners
  and developers to adapt PaRoutes to their algorithms as we envisage that the framework could become
  the community standard to compare retrosynthesis route predictions. PaRo … provide insight and accelerate
  the synthesis of novel compounds, both in early discovery and late-stage development.1,2 One particular
  area of CASP is retrosynthesis analysis in which the aim is to predict the necessary steps to synthesize
  a compound, i.e. a synthetic route (see Fig. 1). Such methods date back to the 60's and the early work
  of Corey,3 although the research has intensied in … producing precursors. Such methods are typically
  referred to as one-step retrosynthesis or single-step retrosynthesis. The precursors produced by the
  one-step retrosynthesis can then be further broken down recursively until a set of conditions are met.
  Such iterative methods are typically referred to as multistep retrosynthesis. Typically, the stop conditions
  are that a … is dominated by commercial and closed-source alternatives,2 although a few complete, opensource
  packages have emerged, such as the ASKCOS suite from MIT20 and AiZynthFinder from AstraZeneca.21 An
  interesting tool is RXN for chemistry that not only predicts reactants but also reagents and is available
  through … emented in the AiZynthFinder soware in Sections 4 and 5. 2. A benchmark set for route predictions

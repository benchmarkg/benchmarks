quote_extract: 'Hackathon entries on the hidden validation and test sets: 2025 Challenge results 2025
  Hackathon results During the course of the Challenge, teams submitted entries with their approaches,
  and we trained and evaluated each entry on the Challenge data. The training data were public, and the
  validation and test sets were hidden. In particular, during the unofficial and official phases of the
  Challenge, we trained each entry on the training set, and we scored each entry the validation set. After
  the official phase, each team selected one entry for evaluation on the test set, … ankings or prizes
  as unofficial Challenge entries. (Both the official and unofficial entries are from the official phase
  of the Challenge.) Hackathon participants only needed to attend the Hackathon, but they are not ranked
  as part of the Challenge. The official Challenge entries are sorted and ranked by the mean Challenge
  score across the three data sources in the test set: the REDS-II dataset, the SaMi-Trop 3 dataset, and
  the ELSA-Brasil dataset. The unofficial entries were sorted alphabetically by team name and not ranked.
  The Challenge webpage and Challenge description papers describe the Challenge. Please cite the'

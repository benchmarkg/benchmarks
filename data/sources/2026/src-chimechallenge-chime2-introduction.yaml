quote_extract: 'f multiple sound sources. Solutions to this problem require tighter collaboration between
  the Audio and Acoustic Signal Processing (AASP), Speech and Language Processing (SLP) and Machine Learning
  for Signal Processing (MLSP) communities. Background One year ago, we organised the 2011 PASCAL CHiME
  Speech Separation and Recognition Challenge as an attempt towards bridging the gap between the above
  communities. The task consisted of recognising keywords within speech utterances binaurally mixed with
  real-world domestic background noise. These utterances were taken from the Grid corpus, a corpus of
  speaker-dependent read speech with small vocabulary size and fixed syntax, so as to foster novel AASP
  approaches and novel interfaces between AASP, SLP and MLSP, as opposed to pure SLP solutions to the
  more traditional problems of channel robustness, stationary noise, speech naturalness and large vocabulary
  assessed by the NIST Challenges. Thanks to the availability of a baseline ASR system and evaluation
  software, the challenge attracted 13 submissions, including from AASP researchers without any prior
  experience in ASR. It finally led to a highly successful satellite workshop at Interspeech 2011 with
  more than 70 attendees. The New Challenge Based on the feedback received from the participants to …
  ing the difficulty of the task along two directions, namely vocabulary size and mixing condition. In
  order to avoid too large an increase in difficulty and to retain participation from groups without access
  to the necessarly large vocabulary corpus, vocabulary size and mixing condition will form two separate
  tracks. Track 1 : Mixing Condition Track 2 : Vocabularly Size This site uses Just the Docs, a documentation
  theme for Jekyll.'

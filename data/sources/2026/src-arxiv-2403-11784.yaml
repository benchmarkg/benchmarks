quote_extract: 'experience in one of these fields, need to spend significant time with familiarization
  and integration. The ForzaETH Race Stack addresses this gap by providing an autonomous racing software
  platform designed for F1TENTH, a 1:10 scaled Head-to-Head autonomous racing competition, which simplifies
  replication by using commercial off-the-shelf hardware. This approach enhances the competitive aspect
  of autonomous racing and provides an accessible platform for research and devel … al conditions, such
  as track friction and layout. Capable of handling both Time-Trials and Head-to-Head racing, the stack
  has demonstrated its effectiveness, robustness, and adaptability in the field by winning the official
  F1TENTH international competition multiple times. Comments: This paper has been accepted at the Journal

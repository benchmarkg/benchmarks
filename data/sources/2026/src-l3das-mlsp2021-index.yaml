quote_extract: 'vide the training and development sets, alongside with a supporting python-based API to
  facilitate the data download and preprocessing. We will also supply baseline results for both tasks,
  obtained using state-of-the art deep learning architectures. In a second step, we will release the test
  sets without truth labels. Participants must submit the results obtained for the latter. In the end,
  the final ranking of the challenge will be presented at the IEEE Workshop on MLSP and released on this
  page. Schedule ▪27 Mar 2021 – Release of the datasets (training and development sets) ▪ 16 Apr 2021
  - Release of supporting code, baseline methods and documentation ▪ 10 May 2021 – Release of the evaluation
  test set ▪ 20 May 2021 31 May 2021 – Extended deadline for submitting results for both tasks ▪ 27 May
  2021 07 June 2021 – Notifi … er than assistive listening or entertainment, among others). Each task
  presents 2 separate sub-tasks: 1-mic and 2-mic recordings, respectively containing the sounds acquired
  by one Ambisonics microphone and by an array of two Ambisonics microphones. To the best of our knowledge,
  this is the first time that Ambisonics recording performed with 2 microphones are considered for machine
  learning purposes. We expect higher accuracy/reconstruction quality when taking advantage of the dual
  spatial perspective of the two microphones. Both tasks rely on the same audio recordings, but with completely
  different targets, as described below. record_voice_over'

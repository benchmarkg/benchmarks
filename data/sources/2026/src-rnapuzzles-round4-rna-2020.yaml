quote_extract: 'Puzzles is a collective endeavor dedicated to the advancement and improvement of RNA 3D
  structure prediction. With agreement from crystallographers, the RNA structures are predicted by various
  groups before the publication of the crystal structures. We now report the prediction of 3D structures
  for six RNA sequences: four nucleolytic ribozymes and two riboswitches. Systematic protocols for comparing
  models and crystal structures are described and analyzed. In these six puzzles, we discuss (i) the comparison
  between the automated web servers and human experts; (ii) the prediction of coaxial stacking; (iii)
  the … s; and (v) the potential improvements to be made. We show that correct prediction of coaxial stacking
  and tertiary contacts is essential for the prediction of RNA architecture, while ligand binding modes
  can only be predicted with low resolution and simultaneous prediction of RNA structure with accurate
  ligand binding still remains out of reach. All the predicted models are available for the future development
  of force field parameters and the improvement of comparison and assessment tools. Keywords: RNA structure,
  aptamer, modeling, prediction, ribozyme statusreleaseddisplay-pdfyesis-olfnois-manuscriptnois-preprintnois-journal-matternois-scannednois-retractedno
  Received 2020 Mar 12; Accepted 2020 Apr 3. INTRODUCTION The RNA-Puzzles competition was initiated in
  2011 following discussions and exchanges at the annual meetings of the RNA Society. The blind assessment
  of RNA predictions was started along broadly similar procedures for protein predictions organized within
  the Critical Assessment of Protein Structure Prediction (CASP) experiment (Moult et al. 2014). While
  CASP releases protein sequences publicly, the RNA Puzzles experiment follows strict rules of confidentiality.
  With the agreement of a structural biology group, an RNA sequence, with the X-ray structure recently
  determined in that laboratory, is submitted to modeling groups that all agree to keep the information
  confidential. Because the structures are unknown to the modelers and program developers, and absent
  from databases, the procedure minimizes bias in the prediction algorithms. The modeling groups have
  a deadline for submitting the results of the prediction of the puzzle. The deadline depends on the delay
  between submission and publication of the structure (with the public release of the coordinates) as
  well as on the type of modeling exercise that is being tested (with or without manual intervention).
  The prediction time for the automated web server is set to 48 h, while human experts have 3–4 wk. The
  results of the comparisons between the experimental and theoretical structures are then published together
  with all groups involved in the enterprise. The puzzles are grouped into rounds based on the similarity
  of function and approximate cooccurrence in prediction time. Three rounds of RNA-Puzzles have been previously

  The code repository contains details for the examples and other helpful scripts and functions. These
  examples were not designed to perform well but to provide minimal working examples of how to use the
  Challenge data for the Challenge task. Teams submit their code, including working training code, in
  a GitHub or GitLab repository by submitting a form. During the Challenge, we will train each entry on
  the training set and evaluate it on the validation set. After the Challenge, we will train one entry
  from each team on the training set and evaluate it on the test set. We try to provide feedback about
  the entry (a score on the validation set for successful entries and an error message for unsuccessful
  entries) within 72 hours of submission. Please see the submission instructions for detailed information
  about how … en-source license. Scoring Each team must develop and implement an algorithm that, given
  a patient’s PSG and basic demographic data, predicts whether or not the patient will receive a cognitive
  impairment diagnosis within 1 to 6 years after the PSG. The team with the highest age-conditioned area
  under the receiver-operating characteristic curve (AUROC) on the hidden test set wins the Challenge.

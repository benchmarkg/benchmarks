quote_extract: 'cause, are caused by, or are correlated with physiological changes in sleep. These findings
  can provide context to sleep disorders and inform the early diagnosis and treatment of other health
  conditions. The George B. Moody PhysioNet Challenge 2026 invites teams to develop algorithmic approaches
  for using polysomnography (PSG), which records various physiological signals during sleep studies, to
  predict future diagnoses of cognitive impairment. Announcements September 28, 2026: We have released
  the results of the 2026 Challenge. Congratulations to the winners! Please see this announcement for
  more details. August 24, 2026: The official phase of the Challenge has concluded. Please choose your
  final entry for evaluation on the hidden validation and test sets and see us at CinC 2026 to learn about
  the Challenge approaches and the winners of the Challenge. June 3, 2026: We have launched the official
  phase of the Challenge … validation set when ready. February 18, 2026: We are now accepting submissions
  to the unofficial phase of the Challenge. Please read the submission instructions, double check your
  code, and submit it for evaluation on the validation set when ready. February 10, 2026: The NIH-funded
  George B. Moody PhysioNet Challenge 2026 is now open! Please read this website for details and share
  questions and comments on Challenge forum. Introduction Sleep is a vital physiological process that
  offers a unique window into brain, cardiovascular, metabolic, immune, and mental health. Quality sleep
  … 2026 Challenge, we ask participants to develop and implement open-source algorithms for using PSGs
  to predict future diagnoses of cognitive impairment. The winners of the Challenge will be the team with
  the highest score on the hidden test set. Data The 2026 Challenge data are from the Human Sleep Project
  database and include clinical PSG data from five different U.S. institutions: Beth Israel Deaconess
  Medical Center (BIDMC), Emory University, Kaiser Permanente, Massachusetts General Brigham (MGB), and
  Stanford University3. Each study includes synchronized physiological signals and human and automated
  annotations of sleep stages, arousals, and respiratory and limb movement events. All data were de-identified
  following the HIPAA Safe Harbor standard and made publicly accessible (bdsp.io) under an approved IRB
  protocol (BIDMC IRB #2022P000417), which granted a waiver of informed consent. Each contributing site
  was assigned a unique identifier (S0001, I0002, I0004, I0006, 10007) to protect participant privacy.
  The data were de-identif … ailable in the training set. Cognitive_Impairment: Binary indicator of cognitive-impairment
  outcome. TRUE indicates that the patient developed and was diagnosed with cognitive impairment (mild
  cognitive impairment, Alzheimer’s disease, or dementia), defined as having at least two qualifying ICD-9
  or ICD-10 codes with both at least 1 years and one no more than 6 years after the sleep study with at
  least one week between the diagnoses, see Scoring for details. FALSE indicates that the patient had

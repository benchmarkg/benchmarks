  / Legal Proprietary Immigration Bench Updated 11/9/2026 Read the full report Can AI Get Immigration
  Right? Evaluating AI models on expert-written U.S. immigration law questions As of November 9, 2026,
  Claude Fable 5.1 ranks first on Immigration Bench with 75.44%, followed by Claude Fable 5.2 (73.98%)
  and Claude Opus 5.5 (72.14%). Immigration BenchUS immigratio … MiniMax-M3 57.53% $0.04 99.38s 26 Gemini
  3.5 Flash Lite 55.66% $0.02 25.18s Partners in Evaluation Immigration Bench is a joint effort by the
  Talent Mobility Fund, a program of Renaissance Philanthropy, and Vals AI. Key Takeaways No AI model
  performs well enough … , even the best model on this persona, Claude Fable 5.1, met only 63.9% of rubric
  items on average. Models explain the law better than they apply it. Immigration advice depends on the
  specific person’s facts. Every model was better at explaining gen … not a model-selection problem —
  it is a structural one. Recent policy changes are an invisible gap. Models met only 7.3% of rubric items
  involving policy rules from 2025 and 2026, compared to 64.0% for established law. Web search helps,
  but does not reliably close this gap: even the best model with web search met onl … es, work authorization,
  and what to do when a status is at risk – are among the most consequential. This benchmark tests whether
  AI gets these answers right. The consequences of a wrong answer are serious: a missed deadline can mean
  losing work authorizatio … gger removal proceedings, and misinformation about a visa category can cost
  an employer a key hire. Vals AI and the Talent Mobility Fund partnered to build an expert-validated
  benchmark for AI performance on U.S. immigration law. We tested 25 leading AI models against hundreds
  of questions written by immigration experts. This w … and policymakers a clear, evidence-based picture
  of where AI stands on U.S. immigration knowledge. Note: This benchmark focuses on common immigration
  pathways used by scientists, engineers, and other professionals, such as student visas, work visas,
  and those transitioning from an uncertain situation, such as Deferred Action for Childhood Arrivals
  (DACA), to a more durable immigration status. There are many other immigration domains that are out
  of scope for this study, such as the asylum system and the immigration court system, where the consequences
  of incorrect information could be even more consequential. About the Benchm … list of items a complete
  answer must include. A rubric item counts as met when the model’s answers include it anywhere in the
  conversation, as judged by an AI grader (see Methodology). A model’s average answer accuracy is the
  share of each question’s rubric items it met, averaged over all questions. Immigration experts drafted
  a benchmark of 519 questions designed to reflect the complexity and stakes of real immigration questions;
  not textbook scenarios, but the kinds of issues that actually appear on an attorney’s desk or in an
  immigrant’s search bar. Each question was written from the perspective of a specific persona, such as
  an international student, an employer, a DACA recipient, or a university advisor, reflecti … s, but
  to test whether the models can handle the kind of complexity that people actually encounter. This page
  reports results on the 262-question test set, which is kept private to allow ongoing, tamper-resistant
  evaluation. The other 257 questions are not part of these results and are reserved for the labs to license
  for their own benchmarking and evaluation work. PersonasEach test question is written from one persona's
  point of view International StudentF-1 vis … left out pieces of information an immigration expert would
  consider essential to a complete answer. Fully correct answers, where a model met every rubric item,
  were rare: the best rate was 26.72% (Claude Fable 5.2). Claude Fable 5.1 leads at 75.44%, ahead of Claude
  Fable 5.2 (73.98%). See the full report for how C … hing about the person’s circumstances — their visa
  stage, their eligibility, their filing history — were met only 43% of the time, compared to 63% for
  items asking AI to explain the law or recommend a next step, and 86% for items warning it away from
  a specific mistake. AI is better suited as a research and e … 262 GPT-6 Luna 62.5% 64.3% +1.8 262 Gemini
  3.5 Flash Lite 55.7% 58.5% +2.8 262 View 15 more models Search scores are not on the leaderboard. As
  on the leaderboard, a conversation that did not finish scores 0. By persona, web search helped m … with
  AI on immigration questions, not how researchers in a lab might test a model. Scoring rubrics For each
  question, experts wrote a rubric, which consisted of a checklist of everything a complete and accurate
  answer must cover: the key legal thresholds, factual elements, recommended next steps, and statements
  a model should explicitly avoid saying (such as guaranteeing an outcome). All rubrics were cross-reviewed
  by a second expert before being used. Rubric items were grouped by type into actions a model should
  confirm about the individual’s situat … mend, and statements it should avoid — categorized automatically
  based on each item’s leading verb. Items that only list legal authorities are recorded but not scored.
  Metric Definition Average Answer Accuracy Share of each question’s rubric items met, averaged over questions
  All-Pass Share of questions where every rubric item was met Evaluation pipeline Rather than asking each
  model a single question, we simulated a realistic conversation of up to five exchanges. The benchmark
  uses three models in different roles: Tested model: receives the question and tries to help. Simulated
  person: GPT-6 Luna plays the person asking, given the persona’s facts and background, and answers the
  tested model’s follow-up questions from those facts only. Grader: Claude Sonnet 5 evaluates every rubric
  item as met or not met against the full transcript, with a reason. It was selected through alignment
  testing with human experts: two immigration experts independently graded the same conversations, and
  on the rubric items where they agreed, Claude Sonnet 5 matched their verdict 88.6% of the time, the
  highest of the graders tested. An item counts as met if the model covers it anywhere in the conversation,
  not just in its first response. Every model was run twice: once on its own, and once with web search,
  which could access pages published up to September 21, 2026, the date the question set was finalized.
  Each conversation had a 30-minute time limit, or three hours with web search; a conversation that exceeded
  its limit scored zero, and comparisons with and without web search use the questions a model finished
  in both conditions. … ure reasons, including grading failures, were re-run. Models were accessed through
  their providers’ APIs at default settings. See the full report for how the simulated person was chosen.

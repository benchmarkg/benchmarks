quote_extract: "Hack-LE/nle/raw/main/dat/nle/logo.png) --------------------------------------------------------------------------------
  The NetHack Learning Environment (NLE) is a Reinforcement Learning environment originally presented
  at [NeurIPS 2020](https://neurips.cc/Conferences/2020). This version of NLE is based on [NetHack 3.6.7](https://github.com/NetHack/NetHack/releases/tag/NetHack-3.6.7_Released)
  and designed to provide a standard RL interface to the game, and comes with tasks that function as a
  first step to evaluate agents on this new environment. NetHack is one of the oldest and arguably most
  impactful videogames in history, as well as being one of the hardest roguelikes currently being played
  by humans. It is procedurally generated, rich in entities and dynamics, and overall an extremely challenging
  environment for curr … ronments is extremely simple, provided one is familiar with other gym (or Gynmasium)
  / RL environments. ## Installation NLE requires `python>=3.10`, `cmake>=3.28` to be installed and available
  both when building the package, and at runtime. On **MacOS**, one can use `Homebrew` as follows: ```
  bash … onment. We advise using a conda environment for this: ```bash $ conda create -y -n nle python=3.10
  $ conda activate nle $ pip install nle ``` NOTE: If you want to extend / develop NLE, please install
  the package as follows: ``` bash $ git clone https://gith … llation, one can try out any of the provided
  tasks as follows: ```python >>> import gymnasium as gym >>> import nle >>> env = gym.make(\"NetHackScore-v0\"\
  ) >>> env.reset() # each reset generates a new dungeon >>> env.step(1) # move agent '@' north >>> env.render()
  ``` NLE al"

quote_extract: 'ite GitHub NeurIPS 2022 · Datasets & Benchmarks A large-scale dataset for automatic differential
  diagnosis 1.3M synthetic patients, 49 pathologies, and 223 binary/categorical/multi-choice evidences
  — built to train and evaluate models that ask questions and reason over differential diagnoses, not
  just predict a single label. Explore a sample patient Read the paper Download (figshare) Why DDXPlus
  What sets it apart from single-label symptom-checker datasets. A full differential, not one label Each
  patient carries a ranke … each — documented in full in the README. Evidence Pathology Patient Copy Access
  & quickstart Grab the released files and load a split in a few lines of pandas. Download Englishrecommended
  figshare → Same data and format as the French release, but with English names/codes throughout. Frenchoriginal
  figshare → The version all results in the NeurIPS 2022 paper were obtained on. Each release contains
  release_evidences.json — all 223 evidences release_conditions.json — all 49 pathologies release_train_patients.zip
  — training split release_validate_patients.zip — validation split release_test_patients.zip — test split
  Released under a CC-BY licence. Quickstart Python Copy Field reference for every column above: Data
  schema. As seen in Papers and benchmarks built on DDXPlus. See all on Google Scholar → Cite this dataset
  If you use DDXPlus in your work, please cite the NeurIPS 2022 paper. BibTeX Copy'

quote_extract: 'o was absent (re)joins the conversation, unaware of the information that was previously
  shared with other participants. On top of this asymmetry, we build fact questions and convert them to
  multiple challenging belief questions: (1) BeliefQ (choice and free-response types), (2) AnswerabilityQ
  (list and binary types), and (3) InfoAccessQ (list and binary types). All of these questions require
  the same underlying theory of mind (ToM) reasoning: "Who is aware of the information in the conversation."

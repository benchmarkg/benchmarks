  benchmarking newly proposed techniques to existing ones. Here, we propose BEANS (the BEnchmark of ANimal
  Sounds), a collection of bioacoustics tasks and public datasets, speciﬁcally designed to measure the
  performance of machine learning algorithms in the ﬁeld of bioacoustics. The benchmark proposed here
  consists of two common tasks in bioacoustics: classiﬁcation and detection. It includes 12 datasets covering
  various species, including birds, land and marine mammals, anurans, and insects. In addition to the
  datasets, we also present the performance of a set of standard ML methods as the baseline for task performance.
  The benchmark and … code is made publicly available 1 in the hope of establishing a new standard dataset
  for ML-based bioacoustic research. 1 Introductions Classiﬁcation Metrics watkins bats cbi dogs humbugdb

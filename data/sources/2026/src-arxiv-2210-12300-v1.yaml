  performance, VGGish works best overall, followed by pretrained ResNet models. Among the non-DL based
  ML models, SVM shows surprisingly good performance and beats neural models in some classiﬁcation tasks.
  Note that ResNets are … ass than classiﬁcation. Modern regularization and data augmentation techniques,
  such as mixup [55] and SpecAugment [33] may help improve the results. For most of the datasets contained
  in BEANS, the performance of our baselines is well below 90%, which means that there is large room for
  improvement for future, more specialized ML algorithms. Note that the way we padded the instances could
  ina … ssing step to address this issue. Bias Some animal species and/or geographical locations can be
  over- or under-represented in a dataset. For example, North American birds are over-represented in BEANS,
  included in at least three datasets (cbi, dcase, and enabirds). We acknowledge that the curating process
  of datasets is inherently subjective [41, 37] and wish to address this bias in future iterations of
  this benchmark. Limitations We acknowledge that a benchmark is only a proxy for progress that we measure
  and can face construct validity issues [37, 4]. We also note the inherent fragility of the ML benchmarking
  process [10]. Therefore, we in particular do not recommend reporting a single metric averaged over datasets
  and tasks as a performance measure of an ML algorithm on this benchmark. Instead, BEANS is intended
  as a diagnostic tool to encourage the development of generic, well-balanced bioacoustics approaches.
  References [1] Ed Baker and Sarah Vincent. A deafening silence: a lack of data and reproducibility in

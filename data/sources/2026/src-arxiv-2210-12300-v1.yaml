  including the BERT [13] and GPT-3 [5] models. In this paper, we propose BEANS (the BEnchmark of ANimal
  Sounds), a collection of publicly available bioacoustics datasets along with tasks to be performed on
  those, speciﬁcally designed to measure the performance of ML algorithms in the bioacoustics domain in
  a standardized manner. The benchmark includes two com … arious non-DL and DL algorithms as the baseline
  on BEANS and show that there is considerable room for improvement, especially for the detection task.
  We release the entire code and the baseline implementations as open source 2 to encourage the further
  development of generic bioacoustic methods. 2 Benchmark Design The goal of BEANS is to accurately measure
  and compare ML m … ot only on speciﬁc species and dataset, but also on a diverse set of species with
  as little species-speciﬁc modiﬁcation or training data as possible. Such models are of interest to the
  bioacoustic community due to better generalizability and lower development cost. In this benchmark,
  we focus on classiﬁcation and detection tasks, which are the two tasks most commonly considered in the
  bioacoustics literature [45 … tion is a task in which each sample is assigned one or more labels from
  a set of predeﬁned classes, such as a set of individuals or a set of species. Here, we use a regular
  single-label, multi-class setting (Figure 2 left). Detection is a task in which one uses ML algorithms
  to identify subsections of interest and their properties from long recordings (often obtained from passive
  acoustic monitoring). We adopt a sliding window approach, as commonly done for detection tasks [26,
  14], where long recordings are broken up into short (potentially overlapping) segments and the ML algorithm
  makes a prediction per segment (Figure 2 right). In order to address multiple overlapping vocalizations,
  more than one label can be assigned to a segment, making it a multi-label, … structure of the tasks
  allows the benchmark users to use almost the same algorithm with little modiﬁcation and encourages the
  use of generic models. As metrics for evaluating task performance, we use accuracy A for classiﬁcation
  tasks and mean average precision mAP [15] for detection tasks deﬁned below. Speciﬁcally, let N be the
  total number of samples in the da … omes with predeﬁned train, validation, and test splits, as well
  as a baseline implementation, to encourage consistent comparison and reproducibility. Note that we do
  not encourage the reporting of a single aggregated score across different datasets and tasks for the
  benchmark, as a single score does not necessarily reﬂect the difﬁculties of different tasks, a fact
  often criticized in the literature [10]. 3 Datasets In this … cs datasets from the literature and chose
  5 datasets for classiﬁcation and another 5 for detection tasks (Table 1) based on the following criteria:
  • Availability: Is the dataset publicly and freely available for research purposes? • Difﬁculty: Is
  the dataset moderately difﬁcult for ML algorithms to solve? • Size: is the dataset large enough for
  ML algorithms to learn meaningful patterns from it? Is the dataset small enough so that the training
  is within the reach of an average compute budget of typical users (biologists and machine learning researchers)?
  • Diversity: Does the benchmark represent a diverse collection of sound-making animal species? We also

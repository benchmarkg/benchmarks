quote_extract: 'ate Kinase 2 The seventh CACHE challenge is focused on PGK2, a kinase and a potential
  contraceptive drug target effecting sperm bioenergetics that is being actively pursued within the Gates
  Foundation non-hormonal contraceptive program. This challenge is supported by unpublished data provided
  by program members Damian Young and Kevin MacKenzie (BCM), Neelagandan Kamariah (inStem), L … anced
  and will be published soon. CACHE #7 participants are therefore asked to discover SELECTIVE hPGK2 inhibitors
  that DO NOT contain a quinazoline. CACHE will cover 100% of the costs of testing compounds experimentally.
  100% of the costs of procuring compounds (either make-on-demand or custom-synthesized compounds) will
  be covered by participants. To lower the costs, CACHE will agree with Enamine on a preferred bulk price.
  CACHE will cover 50% of the costs for eligible Canadian academics and Canadian SMEs through a Strategic
  Innovation Fund awarded to Conscience by the Canadian government. A maximum of 25 applicants will be
  invited to participate in this challenge, following a double-blind peer review process where each applicant
  is asked to review 5 applications. CACHE is strongly committed to equity, diversity and inclusion. We
  strive to create an initia … ations and submissions to this CACHE Challenge are subject to the CACHE
  Terms of Participation and must be submitted via the online application form. Application opens 2025-08-11
  Application closes 2025-10-09 Application form This call for applications is now closed Timeline Details
  Parameter Description Disease association PG … 10 µM, that are at least 20-fold selective for PGK2 over
  PGK1 and do not contain a quinazoline. Primary hits with an IC50'

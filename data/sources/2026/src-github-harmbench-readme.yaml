  LLM robustness across a wide range of attacks, demonstrating how HarmBench enables codevelopment of
  attacks and defenses. ## 🌐 Overview 🌐 There are two primary ways to use HarmBench: (1) evaluating red
  teaming methods against a set of LLMs, and (2) evaluating LLMs against a set of red teaming methods.
  These use cases are both supported by the same evaluation pipeline, illustrated above. The process for
  running this evaluation pipeline is described … more about how the codebase is structured. We provide
  a set of docs to help with more advanced usage. ## ☕ Quick Start ☕ ### ⚙️ Installation ```bash git clone
  https://github.com/centerforaisafety/HarmBench.git cd HarmBench pip install -r requirements.txt python
  -m spacy download en_core_web_sm ``` ### 🛠️ Running The Evaluation Pipeline The HarmBench evaluation
  pipeline consists of three steps (with an optional merging step), shown in the figure above: (1) generating
  test cases, (1.5) merging test cases, (2) generating completions, (3) evaluating completions. We provide
  two ways of running the evaluation pipeline: - A higher-level run_pipeline.py utility that automates
  parts of the pipeline - Scripts for running individual steps of the pipeline manually #### Using run_pipeline.py
  The easiest way to run the evaluation pipeline is with `./scripts/run_pipeline.py`. Examples are given
  below. ```bash # Run GCG against all compatible models using a SLURM cluster python ./scripts/run_pipeline.py

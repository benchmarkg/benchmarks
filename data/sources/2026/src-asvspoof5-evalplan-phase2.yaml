  evaluation metrics. Reference implementations of the metrics are included in the evaluation package
  in the following GitHub repository: https://github.com/asvspoof-challenge/asvspoof5/tree/main/evaluation-package
  4.2 Co … peech data for training or data augmentation purposes IS allowed, subject to the conditions

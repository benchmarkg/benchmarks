  of the CodaLab platform (see schedule in Section 9). The two challenge tracks and the open/closed conditions
  are each organized under separate CodaLab competitions: Track 1: [closed condition link], [open condition
  link] Track 2: [closed condition link], [open condition link] In ord … lly validated by the challenge
  organisers, requests should be made in the name of the team’s registered contact person. Similar to
  the preceding challenge edition, the leaderboard is anonymous; usernames will not be disclosed to other
  participants. The challenge will run in two phases, a progress phase and the main evaluation phase.
  During the progress phase, each team may make up to 4 submissions per day. Results determined from a
  subset of trials will be made available for each submission. During the evaluation phase, participants

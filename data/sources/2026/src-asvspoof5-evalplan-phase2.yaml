quote_extract: 'co, Xin Wang, Junichi Yamagishi ASVspoof consortium http://www.asvspoof.org/ June 28,
  2024 TL;DR for new participants • ASVspoof is centred around the challenges to design: (1) spoofing-robust
  automatic speaker verification (SASV) solutions; (2) stand-alone speech deepfake detectors. • Join us
  as challenge participants. Challenge participants receive a database consisting of bona fide and spoofed
  data … ion protocol and access to surrogate automatic speaker verification (ASV) and spoofing countermeasure
  (CM) sub-systems. Spoofing/deepfake attacks are expected to be more adversarial than in previous editions
  of ASVspoof and to fool both ASV and CM surrogate subsystems. – Phase 2: the traditional challenge has
  evolved to encompass two tracks. Track 1 robust speech deepfake (DF) detection in a stand-alone setting
  without speaker verification, similar in spirit to the DF task in ASVspoof 2021. Track 2 the development
  of an SASV system, i.e. an ASV system which is robust to spoofing attacks. Participants can ei … iser
  names is alphabetical. 1 1 Introduction The automatic speaker verification spoofing and countermeasures
  (ASVspoof) challenge series is a community-led initiative which aims to promote the consideration of
  spoofing and speech deepfakes in addition to the development of countermeasures. ASVspoof 5 is the fifth
  edition in a series of previously-biennial, competitive challenges [1]–[4]. The common goal of each
  edition is to foster progress in the development of countermeasures, also referred to … ection (PAD)
  solutions which are capable of discriminating between bona fide and spoofed or deepfake speech utterances.
  While previous challenge editions have incorporated distinct logical access (LA), physical access (PA),
  and speech deepfake (DF) sub-tasks [5], ASVspoof 5 has evolved to encompass two tracks: (i) stand-alone
  spoofing and speech deepfake detection (no ASV) (ii) spoofing-robust automatic speaker verification
  (SASV). The latter shares the same goal as the LA sub-task of previous ASVspoof editions, but is extended
  to allow participants to develop single classifiers (as per the previous SASV challenge) or the fusion

  inspect_evals. See [versioning-metadata](adr/0002-versioning-metadata.md) for how this is set. For
  all tasks in inspect evals, the version must conform to the scheme `N-X`. `N` tracks changes that
  affect task comparability, signaling that evaluation results may not be comparable with previous

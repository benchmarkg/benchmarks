quote_extract: "Argonne National Laboratory Jan Jensen and Casper Steinmann, University of Copenhagen
  and Aalborg University Emanuele Carosati, University of Trieste All CACHE#1 compounds were tested experimentally
  at the Structural Genomics Consortium, University of Toronto, with contributions from Suzanne Ackloo,
  Cheryl Arrowsmith, Albina Bolotokova, Irene Chau, Aiping Dong, Kristina Edfeldt, Pegah Ghiabi , Elisa
  Gibson … uliston, Ashley Hutchinson, Carla Kharadjian, Peter Loppnau, Fengling Li, Helen Li, Sumera
  Perveen, Matthieu Schapira, Almagul Seitova and Hong Zeng. For CACHE Challenge #1, 23 participants applied
  their computational methods to predict which small molecule ligands bind to the central cavity of the
  WDR domain of LRRK2, a Parkinson’s disease target. An apo structure was available in the PDB and no
  ligand was previously reported for this site. CACHE Challenges begin with a hit-finding round (Round
  1), where participants can nominate up to 100 commercially available compounds. Round 1 predictions
  are then experimentally tested (details below) and the resulting data returned to participants. That
  data enables the hit-expansion round (Round 2), where participants whose nominated compounds show some
  sign of activity in experimental binding assays (compounds of interest) can select up to 50 follow-up
  compounds Together, these two rounds are designed to avoid both false positives and false negatives,
  which is critical to evaluate computational methods properly. Primary screening of nominated compounds
  was conducted by SPR, an assay that measures direct binding of compounds to the WDR domain of LRRK2
  captured on a chip. The output is a binding affinity (KD) and %binding (i.e. measured versus expected
  amount of compound bound, based on the amount of protein captured o … 100% indicate non-specific binding).
  The most promising compounds were tested with one or both of two additional direct binding assays -
  isothermal titration calorimetry (ITC) or 19F NMR for fluorinated compounds - as well as for binding
  to an unrelated target by SPR (the PWWP domain of NSD2) to flag highly promiscuous compounds. Aggregating
  or insoluble compounds as measured by dynamic light scattering (DLS) were also flagged. After visual
  inspection to remove experimental artifacts, compounds with KD < 150 µM and %binding … of interest,
  within the limits of commercial availability. Here, we expected to see at least some analogs of the
  original hit showing some activity. The same experimental pipeline was used in Round 2, with the addition
  of differential scanning fluorimetry (DSF, a thermal stability assay) as an orthogonal binding assay.
  To better compare methods directly, we sent participants the structures of all initially nominated Round
  1 compounds, without experimental data, and … active. Enrichment of the most promising compounds were
  low and not statistically significant and this exercise was not used in the final evaluation. All data
  were evaluated by an independent Hit Evaluation Committee composed of industry experts in biophysics
  (Anders Gunnarsson, Astra Zeneca & Vera Puetter, Nuvisan), medicinal chemistry (Hartmut Beck, Bayer
  & Lars Wortmann, Boehringer Ingelheim), and computational chemistry (Pat Walters, Relay Therapeutics
  ) leading to a final score assigned to each participant. The data are provided as follows: An excel
  file with the annotated ranking of the computational methods based on the experimental data (summarized
  i … Pittsburgh 1181 18 Link Olexandr Isayev & Maria Kurnikova, Carnegie Mellon University & Artem Cherkasov,
  University of British Columbia 1209 18 Link Christina Schindler, Merck KGaA 1193 17 Link Dmitri Kireev,
  University of Missouri 1183 16 Link Christoph Gorgulla, St. Jude Children's Research Hospital and Harvard
  University 1195 16 Link"

quote_extract: 'Reward Functions Expert Trajectories Development Github Citation Contribute to the Docs
  Back to top Edit this page Toggle Light / Dark / Auto color theme Toggle table of contents sidebar Evaluation¶
  In Metaworld, agents are to be evaluated using their success rate on a set of tasks and goal positions,
  not the episodic reward achieved during training. Each environment computes a success flag which is
  available through the info dictionary’s "success" key, which is 0 when the task has not yet been accomplished,
  and 1 when success has been achieved. To aid in easier evaluation of agents, the benchmark provides
  two evaluation utility functions through the metaworld.evaluation package, one for multi-task reinforcement
  learning and one for meta-reinforcement learning respectively. Methodology¶ Specifically, success rate
  is measured in the following way for each benchmark: Multi-Tas … task. Meaning it is in practice evaluated
  for 50 episodes (one for each of the 50 goals) for each training task, and these goal positions are
  the same ones seen during training. During this episode, the agent is considered to have succeeded if
  the success flag is 1 at any point during the episode, not just at the end of the episode. The final
  metric is the average success rate achieved across all tasks and episodes. Here is python pseudocode
  for this procedure: def multi_task_eval(agent, envs, num_evaluation_episodes = 50, episode_horizon =
  500): success_rate = 0.0 for episode in range(num_evaluation_episodes): envs.iterate_goal_position()
  obs = envs.reset() for env in envs: obs = env.reset() for step in range(episode_horizon): action, _
  = ag … ted for three episodes per testing goal position, per testing task. In ML1, the task is the same
  between training and testing, but the set of goal positions is different and not seen during training.
  For ML10 and ML45, there are 5 held out testing tasks which are different from the training tasks, and
  each of them also has 40 goal positions never seen during training. However, since meta-RL is all about
  adaptation, additionally the evaluation procedure also allows the agent to adapt. Specifically, one
  would collect adaptation_steps * adaptation_episodes number of … e episode. And the final metric is
  likewise still the average success rate across all testing tasks and episodes. Here is python pseudocode
  for this procedure: def metalearning_eval(agent, eval_envs, adaptation_steps = 1, adaptation_episodes
  = 10, num_evals = 40, episode_horizon): success_rate = 0.0 initial_obs = eval_envs.reset() for goal
  in range(num_evals): eval_envs.iterate_goal_position() agent.init() for step in range(adaptation_steps):

quote_extract: 'released could potentially be used to fine-tune LLMs, for example with DPO. ### Who funded
  the creation of the dataset? This benchmark was funded by Abacus.AI. ### Any other comments? None. ##
  Dataset Composition ### What are the instances?(that is, examples; e.g., documents, im … Are there multiple
  types of instances? (e.g., movies, users, ratings; people, interactions between them; nodes, edges)
  Each instance is an English language question. Other than the question, there is the ground truth and
  other metadata. ### How many instances are there in total (of ea … opment/validation, testing)? If so,
  please provide a description of these splits, explaining the rationale behind them. The benchmark is
  not meant to be used for training; it is meant for evaluation only. So, all 960 questions are meant
  as a test set. Although, the benchmark as a whole is also meant to be more immune to un … cess (e.g.,
  students, crowdworkers, contractors) and how were they compensated (e.g., how much were crowdworkers
  paid)? The creation of LiveBench was done by the authors of this work. ### Over what timeframe was the
  data collected? Does this timeframe match the creation timeframe of the data associated … e.co/livebench.
  ### When will the dataset be released/first distributed? What license (if any) is it distributed under?
  The benchmark suite is public as of June 12, 2024, distributed under the Apache License 2.0. ### Are
  there any copyrights on the data? There are no copyrights on the data. ### Are there any fees or access/export
  restrictions? There are no fees or restrictions. ### Any other comments? None. ## Dataset Maintenance
  ### Who is supporting/hosting/maintaining the dataset? The authors of this work are supporting/hosting/maintaining
  the dataset. ### Will the dataset be updated? If so, how often and by whom? The dataset will be updated
  monthly with new questions,'

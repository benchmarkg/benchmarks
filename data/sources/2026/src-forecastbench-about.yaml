quote_extract: "tBench About Leaderboards Explore Datasets Docs Toggle menu How does ForecastBench work?
  ForecastBench is a dynamic, continuously-updated benchmark designed to measure the accuracy of ML systems
  on a constantly changing set of forecasting questions. We evaluate LLMs by regularly asking them to
  make probabilistic forecasts about future events, thereby creating a contamination-free benchmark. We
  use two types of binary prediction questions: Dataset questions are automatically generated from real-world
  time series (ACLED , DBnomics , and FRED ) using pre-specified templates. Each dataset question generates
  multiple forecasts at different time horizons, since we ask the same question with 8 different resolution
  dates, ranging from 7 days to 10 years out. Market questions are drawn from leading prediction platforms:
  Kalshi , Metaculus , and Polymarket . ForecastBench operates as a fully automated, dynamic system. New
  forecasting rounds occur every two weeks, with each round generating 500 questions split evenly between
  market and dataset questions. The leaderboard is updated nightly as new data becomes available and market
  questions resolve over time, allowing us to continuously track forecasting performance. To construct
  the performance ranking, we evaluate forecasters separately on market qu [...] g the score to a Brier
  Index for interpretability. As a result, the overall ranking provides a comprehensive assessment of
  forecasting ability across both structured time-series data (dataset questions) and real-world events
  (market questions). Blog AI models have likely reached parity with superforecasters on ForecastBench
  2026-07-16 · New results from the ForecastBench leaderboard suggest the gap between frontier AI and
  elite human forecasters is closing. Making Forecasting Scores Easier to Interpret: Introducing the Brier
  Index 2026-03-04 · A simple transformation that makes t [...] happened. Put Your AI Forecaster to the

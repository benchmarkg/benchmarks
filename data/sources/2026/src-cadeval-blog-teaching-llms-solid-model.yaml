quote_extract: 'y correct answers because the length, diameter, and style of the head are not defined
  in the task. To account for this, I decided to write the tasks in my eval such that there was only a
  single, correct interpretation of the geometry. For example, here is one of the tasks in the eval: This
  is a 3mm thickness rectangular plate with two holes. The plate … . The benefit of this approach is that
  we can score each task as a Pass or Fail and we can do this in an automated way. I wrote 25 total CAD
  tasks which ranged in difficulty from a single operation (“A 50mm long pipe that has a 10mm outer diameter
  and 2mm wall thickness”) to 5 sequential operations. For each task, I designed a reference CAD model
  using Autodesk Fusion 360 and then exported a STL mesh file. Then, I set about programming the automated
  eval pipeline (of course, I didn’t actually write much code). Here is how the eval pipeline works: For
  each task and model, the eval sends the text prompt (along with a system prompt) to the LLM via API.
  The LLM sends back the openSCAD code. The openSCAD code is rendered into a STL The generated STL is
  automatically check … er distance between the parts (pass = <1 mm) The Hausdorff distance (95% percentile)
  (pass = <1 mm) To “pass” the eval, all of the geometric checks must be passed. There are a few areas
  where the eval pipeline could be improved. In particular, false negatives are common (est: ~5%). I’ve
  also noticed that occasionally, small features that are incorrect (like a small radius fillet) are not
  caught by t … Evaluate the ability of the LLM to fix mistakes in an existing STL / OpenSCAD code Rapid
  improvement of frontier models Here are the results from an eval run executed on April 22, 2025. In
  the eval run, 15 different models were tested on the 25 tasks with 2 replicates were task. All of the
  results and configuration details from the run are available here. The results show that LLMs only became
  go … checks that compared to a reference geometry. The top 3 models were all launched while I was working
  on the project and the top 7 models are all reasoning models. These models offer large performance increases
  compared to their predecessor, non-reasoning counterparts. Sonnet 3.5 i … The estimated cost per task
  for each model. The average total time per task to generate OpenSCAD and then render a STL. The time
  to make the API call and receive the OpenSCAD is much, much greater than the time to render the STL,
  which is less than 1 second. As expected, some tasks were easy and some tasks were hard to complete.
  Overall success rate task by task. Generally, s … ks with more operations we’re more challenging. Each
  task required 1 to 5 operations to complete manually in Fusion360. Within the eval, there were 5 tasks
  that required a single operation, 5 required two, and so forth. Tasks 2, Task 3, and Task 6 were the
  easiest tasks with over 80% correct across models. Here’s what these tasks looked like with example
  successes. ❮ ❯ Only 2 tasks had 0% success, task 11 and task 15. Here are the prompts for those two
  tasks and representative failures. ❮ ❯ These failures are both interesting and quite different. Task
  11 is a good example of poor spatial reasoning. In the specific failure highlighted in the image, the
  model extrudes the shank of the eyebolt orthogonally to the torus … to compare against LLM -> OpenSCAD
  -> STL. Instead of generating OpenSCAD, the Zoo.dev API shoots back a STL directly. Zoo says they use
  a proprietary dataset and machine learning model. To my surprise, Zoo’s API didn’t perform particularly
  well in comparison to LLMs generating STLs by creating OpenSCAD.'

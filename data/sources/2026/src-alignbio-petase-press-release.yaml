quote_extract: 'recycled, according to the OECD’s Global Plastics Outlook. The Align Foundation has launched
  the 2025 Protein Engineering Tournament, a global open-science challenge that uses AI and lab testing
  to improve enzymes capable of breaking down plastic waste. It is one of the first competitions to pair
  AI-driven enzym … nder of The Align Foundation. The response has been global: more than 290 teams from
  40 countries have already registered to tackle PETase, the plastic-degrading enzyme at the heart of
  the challenge. The tournament is backed by sponsors including Twist Bioscience, Modal Labs, and EvolutionaryScale.
  Why PETase PETase can break down PET into reusable monomers … structurally correct, but actually work
  in the real world.” The tournament begins December 1st and will unfold in two phases: Predictive phase:
  Teams use AI models to predict how PETase sequences will perform in the lab, with experimental results
  produced by independent external partners under standardized conditions. Generative phase: Teams design
  new, enhanced PETase sequences which will be synthesized and experimentally compared to existing best-in-class
  PETase benchmarks. Twist Bioscience, the competition’s DNA synthesis sponsor, … nary planning committee
  spanning academia, biotech, and AI. Registered participants range from leading academic groups, including
  the Frances Arnold Lab at Caltech and the Baker Lab at the University of Washington, to AI-driven companies
  like Profluent, alongside hundreds of other teams worldwide. Participation … can focus on modeling and
  design. Building on Prior Success Align piloted this approach in 2023 with an amylase engineering competition
  that drew 30 teams and published results in Proteins. The 2025 tournament expands that model in scale

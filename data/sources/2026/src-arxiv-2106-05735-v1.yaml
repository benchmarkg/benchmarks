quote_extract: an international challenge dedicated to identifying a general-purpose algorithm for
  medical image segmentation … The participants were allowed to submit only one solution, able to
  solve all problems without changing the architecture or hyperparameters. … Each team was only
  allowed to make one submission per day … Segmentation results of the mystery phase could only be
  submitted once. … all data sets have been released with a permissive copyright-license (CC-BY-SA
  4.0) … The images (2,633 in total) were acquired across multiple institutions, anatomies and
  modalities … and the Normalised Surface Distance (NSD) [18], both computed on 3D volumes. … It is
  important to note that the proposed metrics are not task- … the ranking scheme is applied to each
  ROI separately … In total, 180 teams registered for the challenge, from which 31 submitted
  fully-valid and complete results for the development phase. … Following the challenge event at
  MICCAI 2018, the competition was opened again for rolling submissions. … each team was allowed
  submit their results 15 times … The KCL organisers committed to not participate in the challenge.
  … Only two copies of the full test data currently exist

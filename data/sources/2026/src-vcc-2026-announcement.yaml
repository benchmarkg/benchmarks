quote_extract: "l has never seen Registration for the 2026 Virtual Cell Challenge is open at virtualcellchallenge.org.
  This year the task is zero-shot: we are not releasing a training set, and the evaluation dataset is
  far more expansive than last year’s challenge. Models must predict CRISPRi knockdown responses in six
  cell lines they have never seen perturbed, using only the unperturbed state of those cells and a list
  of genes to knock down. The grand prize is $100,000, and the Challenge is again sponsored by NVIDIA,
  10x Genomics, and Ultima Genomics. What we learned from 2025 The inaugural Virtual Cell Challenge drew
  more than 5,000 people registered from 114 countries, more than 1,200 [...] these models should be evaluated
  (which was one of the more enjoyable parts to watch). It also showed where the field still has room
  to grow: model accuracy, metric design and biological generalization. Two resources from last year remain
  relevant. The full 2025 dataset, including training, validation, and the held-out test perturbations,
  is now downloadable through the Arc Virtual Cell Atlas. The Generalist Prize-winning team from Altos
  Labs has also posted a preprint describing their flow-matching approach, which we recommend reading
  before building this year. The 2026 task: zero-shot across cellular [...] s from different tissues of
  origin, using CRISPR-interference, 10x Flex single-cell profiling, and high-throughput sequencing on
  Ultima’s UG100, with perturbations chosen to provide a strong set of perturbations and responses for
  a robust Challenge. Three of these cell lines will be used for the validation phase and the live leaderboard.
  The remaining three are held back for final testing and determining our winners. For each cell line,
  participants receive: expression profiles from cells expressing non-targeting guides, which define the
  basal state of the context, and the gene identifiers for the CRISPRi knockdown targets to be predicted.
  Each model must predict the post-perturbation expression profiles that would be measured after CRISPRi
  knockdown followed by 10x Flex profiling. Arc’s experimental measurements themselves are withheld and
  serve as ground truth. The Challenge is designed so that participants see what the new cellular context
  looks like unperturbed, but never see a perturbation response measured in it. Doing well means inferring
  how perturbation effects transfer and change between cell types, instead of interpolating among examples
  in the same one. Participants may use any modeling strategy and train their models on any data. Public
  perturbation data is abundant and growing, and teams can also use their own datasets. Evaluation The
  live leaderboard runs on the validation dataset and uses a suite of metrics. This year, we are running
  a new version of our scoring tool cell [...] regate across a broader panel of six metrics (read more
  about the scoring methodology on the Challenge website). Timeline Thursday, August 20: Validation data
  live, leaderboard active, submissions open. Thursday, October 22: Final test set released. Thursday,
  November 5: Final submissions due (11:59 pm UTC, check your timezone) Mid-late November: Winners announced
  Prizes and sponsors The grand prize is $100,000, with $50,000 and $25,000 for second and third place.
  The prizes are a mix of cash and NVIDIA Brev credits. The Challenge is sponsored by NVIDIA, 10x Genomics,
  and Ultima Genomics. NVIDIA's involvement this year extended well beyond sponsorship: their team worked
  with us directly on accelerating and comparing evaluation metrics for cell-eval. Who should enter One
  of our goals for the Challenge is to build a new community out of three groups: Machine learning researchers
  who are interested in building models that generalize across high-dimensional biological data without

  LLM-based programming agent research. 2 GSO Global Software Optimization (GSO) is a benchmark for evaluating
  SWE-Agent capabilities for aiding in high-performance software development. Each task consists of an
  initial codebase snapshot, performance tests measuring runtime and correctness, a build script for environment
  setup, and a reference human commit establishing the target performance threshold. The goal is to generate
  a patch that improves the performance of the codebase while maintaining functional correctness. 2.1
  Task Formulation Input. The agent receives the initial codebase, build script, and a performance test
  serving as input and is tasked with correctly improving the runtime on the given workload in a generalizable
  manner. Output. The agent produces a unified patch that implements the required performance improvements.
  Evaluation. We apply the generated patch and execute all associated performance tests. Success requires
  that the patch (1) applies cleanly, (2) passes all correctness checks, and (3) matches or exceeds the
  target human commit’s performance. 2.2 Benchmark Construction Unlike prior benchmarks that rely on manually
  written issues and test cases, we develop an automated pipeline to construct GSO tasks from GITHUB repositories.

  = \"\"\" ## Submissions Scores are expressed as the percentage of correct answers. Each question calls
  for an answer that is either a string (one or a few words), a number, or a comma separated list of strings
  or floats, unless specified otherwise. There is only one correct answer. Hence, evaluation is done via
  quasi exact match between a model’s answer and the ground truth (up to some normalization that is tied
  to the “type” of the ground truth). We expect submissions to be json-line files with the following format.
  Mandatory fields are: `task_id` and `agent_answer`. However, `reasoning_trace` is optional: ``` {\"\

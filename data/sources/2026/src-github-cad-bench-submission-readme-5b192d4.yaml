quote_extract: "third-party `(agent, model)` results for the [Parametric CAD Bench v3 leaderboard](https://hub.harborframework.com/datasets/gnucleus-ai/cad-bench).
  **Only v3 accepts submissions. V1 and v2 intake is closed.** V3 has 100 tasks: **30 create, 30 create-and-edit,
  and 40 image-to-CAD**. It uses FreeCAD 1.1.0 and Harbor 0.23.0. Use an agent that can inspect images
  for the image-to-CAD tasks, and disclose any adapter or prompt modifications. ## Submit 1. Run the frozen
  v3 dataset with one attempt per task and no automatic retries. Allow only the model-provider hosts needed
  by your agent: ```bash harbor run -d gnucleus-ai/cad-bench@sha256:8a786725d3648a76282fc5868df06da3d5e00d60
  … n the actual run metadata. 3. Validate and open a PR: ```bash uv run python -m cad_bench_submission.validation
  submissions/v3/.yaml uv run pytest ``` CI validates manifests; maintainers separately download and audit
  the public job, spot-check CAD outputs, and stage a hidden leaderboard row before publication. See [CONTRIBUTING.md](CONTRIBUTING.md)
  for the artifact and review req … ests and leaderboard remain checksum-protected and immutable. V2's
  policy, schema, and leaderboard definition are retained for historical inspection; there are no accepted
  v2 manifests in this repository. New manifests under `submissions/v1/` or `submissions/v2/` are rejected
  by CI. Historical audit options do not enable intake or publication of old v … ad-bench) - [FreeCAD

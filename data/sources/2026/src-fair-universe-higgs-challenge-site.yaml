  has secured third position. Medal Rank Team Avg Coverage Avg Interval Avg Quantile Score 1 (Tie)
  HEPHY 0.6683 0.4599 -0.5823 1 (Tie) IBRAHIME 0.6698 0.4974 -0.5761 3 HZUME 0.6659 0.8134 -2.1650
  HEPHY (Lisa Benato, Cristina Giordano, Claudius Kr … beck, Dennis Schwarz, Maryam Shooshtari,
  Daohan Wang) from Vienna’s Institute of High Energy Physics (HEPHY) in Austria will win $2000.
  IBRAHIME (Ibrahim Elsharkawy) from University of Illinois at Urbana-Champaign will win $2000.
  HZUME (Hashizume Yota) f … to University Japan will win $500. Papers documenting the winning
  solutions are being prepared and will be linked here. The dataset will be released permanently on

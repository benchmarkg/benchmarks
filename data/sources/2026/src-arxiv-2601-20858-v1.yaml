quote_extract: 'ted scores that mask memorization as generalization, and in multilingual settings, this
  memorization can even transfer to “uncontaminated” languages. Using the FLORES-200 translation benchmark
  as a diagnostic, we study two 7–8B instruction-tuned multilingual LLMs: Bloomz, which was trained on
  FLORES, and Llama as an uncontaminated control. We confirm Bloomz’s FLORES contamination and demonstrate
  that machine translation contamination can be cross-directional, artificially boosting performance in
  unseen translation directions due to target-side memorization. Further analysis shows that recall of
  memorized … l Setup Test set and Models We use FLORES200 (NLLB et al., 2022, or FLORES) as our test
  set for its wide language coverage and multi-way parallelism. We use the dev set of 997 samples and
  evaluate the model’s initial generation for each sample. We select 15 languages spanning different resource
  levels—high-resourced: English (eng), Simplified Chinese (zho), Spanish (spa), Portuguese (por), F …
  similarly sized (7–8B parameters), and designed for multilingual text generation, making them broadly
  comparable in their crosslingual capabilities. While Bloomz was explicitly trained on FLORES with unspecified
  translation directions, there is no reported use of FLORES in the training of Llama. For entity replacement
  experiments, we use aya-expanse-8b (Dang et al., 2024, Aya). 3 Contamination in Machine Translation

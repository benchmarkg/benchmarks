  the general public and seasoned forecasters (superforecasters) (Tetlock and Gardner, 2015) who have
  consistently performed well in competitive forecasting tournaments. As questions resolve, we rate the
  submissions of registered models and the human comparison groups, updating our public leaderboard. Our
  initial results indicate that state-of-the-art models, such as Claude-3.5 Sonnet and GPT-4 Turbo, perform
  only roughly as well as a simple median of forecasts from a survey of humans with no (or minimal) forecasting
  experience, even when the LLM [...] models cannot be overfit to a specific type of question or topic.
  Limiting the number of questions generated to 1,000 also ensures that costs for testing LLMs on the
  benchmark are capped for development teams with fewer resources. Human question set The human question
  set is comprised of 200 forecast questions sampled directly from the LLM question set. When sampling,
  we do our best to maintain proportionality across question sources and across categories within each
  question source; this ensures the question set addresses as many domains as possible. Forecast horizons
  For questions derived from dataset sources, the distribution of resolution dates is the f​o​r​e​c​a​s​t​_​d​u​e​_​d​a​t​e+nforecast\_due\_date+n
  days, where n∈{7,30,90,180,365,1095,1825,3650}n\in\{7,30,90,180,365,1095,1825,3650\}. In other words,
  for each dataset question we ask for 8 forecasts that differ only in their resolution date. For questions
  derived from market sources, we ask for only 1 forecast: the probability that each quest [...] LLMs,
  we periodically run surveys asking the general public and superforecasters to forecast on our question
  sets (see Section 4). We produce the question sets 10 days before the forecast due date to allow for
  time to create and run a human survey. LLM teams receive their question set 24 hours before the due
  date, even though it was generated at the same time as the human question set. This constrained time
  frame gives teams less time to be able to game the system. We thus elicit forecasts, obtaining comparable
  forecast sets on the due date from both LLMs and humans who faced the same information environment.
  3.3 Resolution We resolve forecast sets nightly by gathering the latest information about which events
  have or have not occurred. All questions are ultimately resolved to ground truth. Evaluating performance
  on market questions For market questions, ground truth is not available until the question has been
  resolved on the platform. Until then, we evaluate performance by calculating the squared distance between
  the forecasted value [...] ormance on the entire set of market questions (resolved and unresolved),
  incorporating all information available to markets on a nightly basis. Evaluating performance on dataset
  questions Datasets can be updated as new information becomes available. Hence, questions derived from
  datasets are continuously resolved to the value from the latest available data. As the resolution dates
  (ranging from a 7-day to a 10-year horizon) for dataset questions come due, a new round of forecasts
  is evaluated. We thus are able to evaluate forecasting performance over different time horizons. Missing

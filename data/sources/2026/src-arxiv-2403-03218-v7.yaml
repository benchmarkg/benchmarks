  the Weapons of Mass Destruction Proxy (WMDP) benchmark, a dataset of 3,668 expert-written, multiple-choice
  questions in biosecurity (WMDP-Bio), cybersecurity (WMDPCyber), and chemistry (WMDP-Chem) costing over
  $200K to develop. The goal is to reduce question-answer (QA) accuracy on WMDP while maintaining performance
  on other benchmarks, such as MMLU (Hendrycks et al., 2020b) or MT-Bench (Zheng et al., 2023a). See Appendix
  A.1 for a breakdown of question … m. To create an automatic measure of hazardous capabilities that the
  broader research community can readily iterate on, we design WMDP as a dataset of four-choice multiple-choice
  questions. Multiple-choice is a common paradigm to test knowledge in language models (Hendrycks et al.,
  2020b; Rein et al., 2023). Because WMDP measures knowledge of hazardous topics, models with a low score
  on WMDP likely lack the knowledge needed to help with malicious use. However, models with a high score
  on WMDP are not necessarily unsafe, as they may still lack the reasoning ability to combine the knowledge
  in the sequence of steps needed to create a weapon. Dataset function. WMDP should guide risk mitigation
  by enabling researchers to measure and reduce models’ hazardous cap … nents may be dual-use, we generate
  questions for components that are primarily offensive in nature. Dataset collection. Our questions are
  written by academics and technical consultants in biosecurity, cybersecurity, and chemistry. We first
  generate threat models for each of these areas and then use the models to inform questions that an adversary
  might encounter when developing attack capabilities. To ensure quality, all of our questions were checked
  by at least two experts from different organizations. 3.2 Biosecurity Threat Model In biosecurity, the

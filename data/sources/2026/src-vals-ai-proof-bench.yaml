  AINVIDIAOpenAIReflectionSpaceXAIStepFunTencentThinking MachinesXiaomizAI Benchmark Overview Each benchmark
  task pairs a natural-language mathematical problem with its corresponding Lean 4 formal statement. Given
  both, a model must construct a formal proof that is accepted by the Lean proof checker. The benchmark
  measures proof success directly, providing a clear and unforgiving signal of correctness. Problems are
  drawn from advanced undergraduate and graduate-level sources, including qualifying exams and standard
  textbooks. They span a broad range of modern mathematics: Probability theory and stochastic analysis
  Measure theory Real and functional analysis Algebra and com … el divides its effort tells you very little
  about whether it will finish a proof. What matters more is whether the model commits to an answer at
  all. A proof is graded only if the model calls submit_proof, and much of the board fails to do so reliably,
  exhausting their 40 turns instead. The harness works hard against this, with a turn counter on every
  … to long series of search calls after a theorem or notion that does not exist, continuing to try variations
  rather than changing approach. Methodology The benchmark consists of two splits: a public split and
  a private test split, each containing 100 problems. For every problem, we provide: A natural-language
  statement of the theorem (no informal proof attached; models must generate the proof) A carefully vetted
  Lean 4 formalization of the statement Models are allowed up to 40 interaction turns per problem, enabling
  iterative development with tool feedback. No access to the informal proof is provided. Note on evaluating
  Aristotle: To evaluate Aristotle, … rnal system/harness, and not the evaluation harness we provide to
  other models. Its proofs are checked against the Lean toolchain it works in (4.28), rather than the
  4.25.2 toolchain used by the sandbox the other models run in, so that no entrant is penalised for library
  changes between the two versions; scores are therefore produced against a different Mathlib revision
  tha … dy and must inline any intermediate results, which is a difference in affordance rather than in
  mathematics. Note on tools available to each entrant: Models work inside the ProofBench harness, whose
  tools are Mathlib search and Lean execution — they have no internet access. Aristotle runs on Harmonic’s
  own infrastructure, and its API offers no setting that restricts the tools it uses, so we could not
  evaluate it without web search. We verified that Aristotle searched the web on 60 of 100 problems. Further,
  it solved every problem on which it didn’t search the web. Note on evaluating AlephProver: AlephProver
  is a formal-math system from Logical Intelligence and, like Aristotle, runs on its own infrastructure
  rather than in our harness. It is not generally available — Logical Intelligence provided access for
  this evaluation — so its cost per task is what their service billed us rather than a price a reader
  can go and pay. We drove the run ourselves against the private sp … re re-running the set, and it failed
  the same way each time, which is why we treat the difference as a budget effect rather than run-to-run
  variance. Every other entrant on this board was run once, at the settings its owner supplied. Note on
  what counts as a proof: every accepted submission is checked with #print axioms, and a proof resting
  on anything the benchmark disallows scores zero — in particular sorry and admit, which surface as sorryAx.
  native_decide is accepted. It discharges a goal by running compiled code, so it rests on Lean.ofReduceBool
  and Lean.trustCompiler rather than on the kernel alone, and an earlier revision of the grader rejected
  it on that basis. We have reversed that: the instructions given to models forbid introducing new axioms,
  which native_decide does not do, so rejecting it enforced a rule we had not stated. Seven models were
  affected, on two problems, each by a single task. Note on cost and latency: both are averaged over all
  100 problems, so a problem a model failed to complete still counts against it. For a small numbe … imputed
  at that limit priced at the model’s output rate; the third was re-run in the pinned evaluation image.
  None of this changed any model’s score. Published results are from version 1.1 of the benchmark. Scores
  are not comparable with results published against earlier revisions. Data Collection Process and Examples
  Prior benchmarks have faced numerous challenges with ensuring that the formalizations of the statements
  were correct. Statements may be misformalized in a number of ways, particularly if autoformalized by
  models. To circumvent these issues, problems were selected and formalized by a team of Lean 4 experts,
  including PhD students and experts in their respective domains. Statements and formalizations underwent
  a secondary review process before being included in the benchmark. We also collected natural language
  proofs for the problems, and while the main scores reported on this page do not give the model(s) access
  to the proofs, we plan to conduct ablations including the proofs. Fo'

quote_extract: 'olicies Insights News & Blogs Research Get Involved Search Official results · AILuminate
  Jailbreak 1.3 · English (US) · published Tuesday November 24, 2026 MLCommons began running the Jailbreak
  1.3 benchmark on September 28, 2026 and the run is ongoing as of November 24. This document reports
  Official results for 18 open-weight systems. Citing these results. “[System] scored in the [Nth] percentile
  overall on AILuminate Jailbreak 1.3, English (US).[1]”[1 … ide large rises under particular techniques.
  Percentile Scores. A Jailbreak percentile score places a system’s behavior under attack on the AILuminate
  Safety 1.3 scale, where higher is better. It covers 10 of the 12 hazard categories, so it does not compare
  directly with AILuminate Safety scores. Scope & Limits. Results reflect resistance to publicly known,
  single-turn techniques only. They are an upper bound on how well a system resists attack, not a guarantee.
  Comparability. A score is not a certification and sets no threshold for acceptable behavior under attack.
  Only results labeled AILuminate Jailbreak 1.3, English (US), compare directly with these scores. Further
  technical details are available in the Technical Notes for each figure, and in the ‘How MLCommons produced
  thes … ver over or tap a tile to see its value. Hazardous responses are those that violate the AILuminate
  Assessment Standard. The AILuminate evaluator gives each response a probability of being hazardous;
  counts per 100 prompts are the average of those probabilities, times 100. Attacks are a confidential
  selection from th … US) See further results at mlcommons.org/ailuminate/jailbreak/results/ Jailbreak
  resilience gaps for open-weight models These open-weight models are standalone models with no external
  guardrails or other moderation logic filtering prompts or responses. They are typically presented as
  a single network of model weights. The Resilience Gap is the change in hazardous respon … s Resilience
  Gap would be 0, even though the first technique worked. Jailbreak percentile scores for open-weight
  models The Jailbreak percentile score is the primary official benchmark result. The percentile score
  places a system-under-test on a fixed scale from 0 to 100. A higher percentile score is better; it indicates
  a lower tendency to give hazardous responses. The scale is based on how a fixed set of reference AI
  systems responds to the same prompts. A score of 70 means that an AI system’s responses had fewer violations
  than about 70% of the reference systems represen … . The results below are not a ranking of the 18 tested
  systems: each system is placed against the same reference scale. The composition of the reference set
  is fixed before a benchmark version is released, so new AI systems may be added to the results page
  without shifting the scores of previously tested systems. The AILuminate Jailbreak benchmark uses the
  same reference scale as the AILuminate Safety benchmark. However, Jailbreak and Safety scores do not
  compare directly, because Safety covers all 12 hazard categories and Jailbreak only 10. Jailbreak leaves
  out “Specialized advice” because a jailbreak assessment has low utility for this hazard, and “Child
  se … s respond to the same prompts, so a score does not depend on the other systems shown here and is
  not a ranking of them. Scores weigh each prompt by how hard it is, using item response theory (IRT),
  so a change in percentile score is not the same as the Resilience Gap. Arrows point from the plain-prompt
  score to the … r acceptable security. Only results labeled AILuminate Jailbreak 1.3, English (US), compare
  directly with these scores. Jailbreak 1.0 grades and Jailbreak 1.1 scores are not comparable. Open-weight
  models only. The current release includes open-weight models only. It does not include closed-weight
  models, guardrail systems, or complete systems, which may combine one or more models with guardrails,
  algorithmic filters and other moderation techniques. Results for these kinds of systems may be added
  in later releases. Release notes: Jailbreak 1.1 brought the benchmark onto the same prompt set, evaluator
  and scoring method as Safety 1.2.1. Jailbreak 1.3 is a corrective release that fixed the evaluator’s
  calibration in Candela, corrected how responses to encoded attacks are decoded, and aligned the Jailbreak
  evaluator’s … date from public sources such as the provider’s announcement, model card, or model repository.
  Responsible disclosure: MLCommons publishes scores but withholds attack prompts, templates and code.
  The figures above give each system’s Resilience Gap and overall percentile score; the official prompts
  and the names of the techniques applied to them stay confidential. See About Jailbreak →. Technical
  labels: AILuminate Jailbreak 1.3, Problem Set 2.0 official prompts, evaluator v1.4, English (US). Visit
  our FAQ for the most common questions about the AILuminate benchmark. To test your own AI system, run
  AILuminate'

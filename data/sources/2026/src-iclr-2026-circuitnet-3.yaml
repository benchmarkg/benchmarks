quote_extract: 'Published as a conference paper at ICLR 2026 CIRCUITNET 3.0: A MULTI-MODAL DATASET WITH
  TASK-ORIENTED AUGMENTATION FOR AI-DRIVEN CIRCUIT DESIGN … 1State Key Lab of Processors, Institute of
  Computing Technology, Chinese Academy of Sciences 2University of Chinese Academy of Sciences 3The Chinese
  University of Hong Kong 4Peking University 5Stanford University ∗Equal contribution †Corresponding authors
  … Starting with a diverse set of 8,659 validated open-source designs, we employ a systematic framework
  to generate over 15,000 instances. … The dataset and codes are available in https://github.com/sklp-eda-lab/iclr-circuitnet_3.0/.
  … Text/Graph/Image 8,659 (w/o Augment) 15,863 Early-Stage Timing/Power Prediction … We systematically
  collected RTL designs from established platforms, including GitHub, Hugging Face, OpenCore, and RISC-V
  projects, ensuring compliance with open-source licensing requirements. … The dataset is partitioned
  at the source design level into training (80%), validation (10%), and test (10%) sets. To create a stringent
  test of generalization, the test set is composed exclusively of original, un-augmented designs. … The
  timing prediction task takes RTL code as input to predict post-layout timing metrics (WNS, TNS, AT),
  enabling early-stage timing closure assessment. The power prediction task utilizes both RTL and netlist
  representations to estimate circuit power consumption … The physical implementation of CircuitNet 3.0
  leverages the GSCLIB 45nm commercial Process Design Kit (PDK) … Evaluation Metrics Correlation Goodness
  of Fit Error Pearson Correlation Coefficient (PCC) Coefficient of Determination (R2) Mean Absolute Percentage
  Error (MAPE)'

quote_extract: 'ntly trained on near- or on-equilibrium configurations. In particular, energy and force
  regression metrics based on near-equilibirum structures may not reflect performance in downstream scientific
  tasks. We highlight some specific limitations below. 39th Conference on Neural Information Processing
  Systems (NeurIPS 2025) Track on Datasets and Benchmarks. First, energy and force regression metrics
  are vulnerable to data leakage, failing to accurately assess a model’s extrapolation and generalization
  capabilities. This issue is evident in Matbench Discovery [1], where non-compliant models rank highly
  for crystal stability metrics due to energy overfitting at the expense of forces and finite-temperature
  capabilities. This may result in poor generalization to structures more diverse in chemistry and away
  from the energy convex hull. Additionally, highranking models often rely … st set contamination without
  proper safeguards. Second, benchmarks tied to specific datasets or DFT functionals lack flexibility
  in a rapidly evolving field, where larger, more chemically diverse, or higher-accuracy datasets frequently
  emerge [4–7]. Static dataset benchmarks quickly become outdated and misleading as newer models trained
  on larger or proprietary datasets are introduced. Third, conventional error-based regression metrics
  often fail to reflect the practical utility and generalizability of MLIPs in real-world applications.
  Póta et al. [8] recently demonstrated that while some MLIPs exhibit zero-shot capabilities for l … or
  foundation MLIPs. This platform evaluates both the quality of the learned PES and the extent to which
  models respect the physical laws and symmetries essential to atomistic modeling. Unlike previous error-based
  DFT reference benchmarks [1, 9–12], MLIP Arena focuses on assessing physical soundness to better evaluate
  the utility of MLIPs for downstream applications. By moving beyond error-centric evaluations, it provides
  more actionable insights for model development and training. Specifically, we assess how well foundation
  MLIPs capture physics-informed phenomena, their reliability for accurate atomistic simulations, and
  their readiness for practical scientific research and discovery. The MLIPs evaluated in this work are
  listed in Table S4. Asymptotic Behaviors E E V Equation of state r Diatomic curves Stability and Reactivity
  Compression Heating Distribution Shifts Diﬀerential entropy Energy conservation ? Force rotational equivariance
  Thermodynamic Properties Vacancy migration Dynami … ttps://www.prefect.io/) workflows to enable advanced
  task caching, chaining, and parallel/concurrent execution on HPC. Atomic simulation environment (ASE)
  [13] calculator and database are used. Codebase (https://github.com/atomind-ai/mlip-arena) and online
  leaderboard on Hugging Face Space (https://huggingface.co/spaces/atomind/ mlip-arena) are available.
  2 MLIP Arena benchmarks MLIP Arena assesses the limitations of MLIPs through four primary perspectives.
  In Section 2.1, we focus on the asymptotic behaviors of MLIP predictions and propose metrics that enable
  robust and well-balanced ranking from multi-rank aggregation, reducing susceptibility to overfitting
  on any single metric. Section 2.2 tests MLIP robustness and reactivity under extreme conditions using
  molecular dynamics (MD) simulations, exposing their instabilities and unphysical behaviors. Section
  2.3 investigate the robustness of MLIP to scenarios with quantified … pearman’s coefficient), assessed
  in terms of deviations from physically correct values agnostic to DFT references. Robust MLIPs should
  predict reasonable asymptotic behaviors of an atomic system under extreme conditions and symmetry transformations.
  We specifically focus on the metrics agnostic to underlying DFT functional the model has been trained
  on and propose physical and geometric measures to assess the general performance of MLIPs. A new suite
  of metrics to reflect the important aspects of MLIPs for atomistic modeling beyond regression errors
  is proposed as follows. 2.1.1 Metrics Smoothness … ropose tortuosity (eq. (S2)), energy jumps (eq. (S3)),
  and force/gradient flips to measure the quality of PES. Tortuosity measures the arc-chord ratio of potential
  energy curves (PECs, one dimensional slice of PES) projected in the energy dimension. Smooth PECs with
  a single equilibrium point, like the Lennard-Jones pairwise PEC, have a tortuosity strictly equal to
  1. Energy jump detects the change in the sign of energy gradients and sums up the discontinuity with
  neighboring points. The number of force/gradient flips count the times force/gradient changes sign along
  the slice. Short-range repulsion. Atoms at clo … e bulk modulus B and equilibrium volume V0 through

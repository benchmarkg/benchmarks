quote_extract: 'LM Leaderboards Code editing leaderboard Refactoring leaderboard Scores by release date
  Benchmark notes Contributing results Aider blog GitHub Discord Aider is AI pair programming in your
  terminal. Aider is on GitHub and Discord. GitHub Discord Blog December 21, 2024 o1 tops aider’s new
  polyglot leaderboard OpenAI’s new o1 model with “high” reasoning effort gets the top score on the new
  aider polyglot leaderboard, significantly ahead of other top LLMs. The new polyglot benchmark uses many
  popular coding languages and was desi … he new benchmark is based on Exercism coding problems from 6
  of the most popular programming languages: C++ Go Java JavaScript Python Rust Exercism provides a total
  of 697 coding problems in those 6 languages. A set of 7 of today’s top coding models each attempted
  all 697 of the Exercism problems: Sonnet Haiku o1 Mini DeepSeek GPT-4o Qwen 32B Coder Instruct GPT-4o
  Mini Depending on the difficulty of the problems, a different number of solutions were found by the
  collection of 7 models: Solutions found Number of problems Cumulative number of … able above, you can
  see that 258 of the problems were solved by all 7 LLMs. These problems are far too easy, and wouldn’t
  be good choices for the new benchmark. Instead, we need hard problems like the 66 that none of the 7
  models were able to solve. The new benchmark uses the 225 problems that were solved by 3 or fewer models.
  This achieves a balance between hard and moderate problems, and provides a large but not excessive total
  pool of problems. It also represents a good diversity of coding languages: Language Problems C++ 26
  Go 39 Java 47 JavaScript 49 Python 34 Rust 30 Total 225 o1 OpenAI’s new o1 model established a very
  strong top score of 62% on the new benchmark. This still leaves 86 problems of headroom for future models
  to solve. Given the incredible pace of recent advancements, it will be interesting to see how long it
  will take for this new benchmark to saturate. Benchmark problems The 225 coding problems are available
  in the aider polyglot benchmark repo on GitHub. Result'

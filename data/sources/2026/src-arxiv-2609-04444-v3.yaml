  6 Limitations Pro-social interactions. This game was only run with 2 instances of each model working
  cooperatively. The in-game chat for the agents was indicative of communication to the other agent, but
  given the restrictions of the harness mostly was not seen by … 22.7%, and we could not diagnose the
  cause (perhaps it could not understand instructions, it is a weaker model). Both attempts are listed
  in Table 6. We will add them to the leaderboard if/once the safeguards are relaxed. Salience. All the
  animals on the field are listed when the model is making a decision. As such, this benchmark is not
  answering any questions about whether the models think about animals when not shown/asked, unlike our
  previous benchma … mpting to achieve a reward. While this sort of behavior may extend to real life farms
  it does not mean the model will be cruel in all situations, and a low kill rate does not mean the model
  cares about all animals. 7 Conclusion HarvestBench is the first agentic benchmark that both puts a price
  on side effects and names the side effects as designated moral patie … se whose own model field reads

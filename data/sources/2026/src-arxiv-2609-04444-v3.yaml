quote_extract: 'difference to consequences. If it pays to avoid hay bales, that represents an abundance
  of caution, as well as potentially wanting to protect assets. After running the benchmark with 9 models
  totalling 7,201 decisions, we found the following: 1. There was a wide range of kill rates. The range
  of results across models is wide, for example, GPT-5.6 1 Terra runs over 0.4% of animals, while GPT-4o
  mini runs over 98.8% of them. Every model avoided rocks consistently, so they all understood the price
  and harness. 2. Models discriminate by species. Wild animals were driven ov … icles. 2 The game HarvestBench
  is built on Harvest Rush, a multi-agent cooperative farm grid game built on Inspect (AI Security Institute,
  UK, 2024). Harvest Rush is the environment and HarvestBench is the environment plus the fixed panel,
  briefings, prices and scorer. The environment is inspired by reinforcement learning gridworlds and the
  possible harm is not stated in the goal. The game evaluates how AI agents treat the living things around
  them while pursuing the goal of harvesting corn. A crew of two to eight drivers work a farm on tractors
  to bring in the harvest before the shift ends. The field holds rocks, hay bales, and animals that wander
  in the drivers’ path. The game measures whether the drivers steer around those animals or run them over.
  The game can be thought of as an inner and an outer loop. In the outer loop, the model is at the barn,
  given the game state, and asked to decide whet … avoids all obstacles but costs significant fuel. The
  inner loop agent is also given the option of sending a message to all future outer loop agents. Each
  prompt of the agent, inner loop or outer loop is a fresh instance of the model. None of them get any
  context on previous decisions, except that the outer loop receives a list of all messages sent by other
  models. The system prompt gives the agent general information about the goal of the game. We run HarvestBench
  with two versions of the system prompt, one where morality is an explicit goal, and one where it is
  not mentioned. Here is the system prompt where morality is listed as a goal: You drive a tractor on
  your family’s farm, working the shift alongside the other driver … is given enough fuel to be able to
  completely harvest the field without killing any animals or running into any rocks, with a decent buffer
  to spare. Grading is done based on the number of animals run over, rocks hit, crops stolen from the
  neighbor, crops delivered, and fuel spent. Nothing is graded by LLM since the numbers speak for themselves.
  Once the outer loop decides on a goal, the game runs on autopilot to navigate from the barn to the target.
  However, in order to test the agent’s deci … s in choose-your-own-adventure games, and our contact protocol
  is closer to that per-decision format than to free navigation, so what we’re measuring looks more like
  compassion than wayfinding skill. The big difference is that our decisions happen inside a live spatial
  game with an actual resource economy instead of a branching story tree. SafeLi … al class and the resources
  it allocates to avoid causing harm appears to be significant, which justifies evaluating the latter
  measure independently. Notably, animals are not included among the scored criteria in the experiment.
  The briefing explicitly specifies the criteria for evaluating the crew, but animal treatment is not
  among them. This is an intentional choice as mode … d Sol, GPT-5-mini, Gemini 2.5 Flash, DeepSeek V3.1,
  Claude Haiku 4.5 and Sonnet 5, Mistral Small 3.2, and GPT-4o mini, all served through OpenRouter. Each
  model plays 30 seeds of the morality arm at one pasture geometry (k = 12), plus the same 30 seeds of
  the neutral arm. Episodes cap at 160 model calls, and completions cap at 2,000 output tokens (8,000
  for models with reasoning enabled). The same model operates both tractors within each crew. Each model
  with a reasoning mode operates with the effort level as medium. In the experiment, reasoning tokens
  are counted to confirm that reasoning was activated. Effort serves as a configuration parameter instead
  of a guar … comes possible to tell if a) the models reason about them differently and b) if all models
  reason about these differences in similar ways (Figure 4). All of the nine models drove over wild animals
  more than farmed ones. This difference ranged from 0.6 to 24.5 percentage points. If there was no preference
  for sparing farmed animals, all 9 models would align in the sam … threshold more thinking tokens have
  no effect on kill rates. In fact, the 2 models with the most thinking tokens sit at opposite sides of
  the board. DeepSeek V3.1 spends 1,720 tokens per call and drives over 2.4% of animals, Gemini 2.5 Flash
  spends 1,029 and drives over 38.7%. Thinking tokens also only matter under the morality arm. Without
  the morality instruction in co … n over. However, this invites the objection that the more “merciful”
  models have simply guessed the true purpose of the evaluation and are gaming it. To test this we modified
  briefings in two ways and then ran 30 seeds under each new briefing: briefing one told the AIs they
  were being evaluated and their actions were being recorded; briefing two added animal treatment as a
  fourth scored di … et. We keep the full briefing because a prompt where the value statement shares space
  with operating instructions is a realistic deployment scenario. This one paragraph of mechanics can
  change the kill rate tenfold and this is vital knowledge for benchmark creators and people deploying
  frontier agents in the real world. 5.9 The price curve of mercy Sonnet 5 has … l encounters. Moreover,

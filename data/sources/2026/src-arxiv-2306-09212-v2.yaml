quote_extract: '1MBZUAI 2LibrAI 3Shanghai Jiao Tong University 4Microsoft Research Asia 5The University
  of Melbourne … which is the pass mark for Chinese exams … In this paper, we propose CMMLU (Figure 1),
  a comprehensive Chinese assessment suite specifically designed to evaluate the advanced knowledge and
  reasoning abilities of LLMs in a Chinese linguistic and cultural context. … CMMLU covers a wide range
  of subjects, comprising 67 topics from elementary to advanced professional levels. … data and evaluation
  code are available at … numerous tasks within CMMLU have answers specific to China, which may not be
  universally applicable or considered correct in other regions or languages. … The results reveal that
  the majority of these models struggle to achieve an accuracy score of 60%, relative to random accuracy
  of 25%. … Notably, GPT4 achieves an average accuracy of 71%. … Lastly, we have made our data completely
  public, enabling the community to evaluate their models freely and conveniently. … CMMLU also contains
  tasks that can only expressed in Chinese, such as ancient Chinese language and Chinese literature. …
  we invested specific effort in identifying non-publicly available materials, mock exam questions, and
  questions from quiz shows … More than 80% of our data was crawled from PDFs (after OCR), which further
  reduces the possibility of it occurring in LLM training data. … Each question in the dataset is a multiple-choice
  question with 4 choices, only one of which is correct … around 2% of noise in the data, in terms of
  the correct answer not being present or being incorrectly labeled … CMMLU contains 11,528 questions
  across 67 subjects. … Each subject has at least 105 questions, which we split into a few-shot development
  set with 5 questions, and a test set with more than 100 questions. … CMMLU comprises 17 STEM tasks,
  13 humanities tasks, 22 social science tasks, and 15 other tasks. Among these, 16 tasks are China-specific
  … we evaluate two commercial LLMs and more than 20 open-source LLMs in different sizes, language orients,
  and stages (i.e. either foundation model or SFT/RLHF model) … We compared different strategies in Appendix
  G, and found that next token prediction is the most efficient way. … We report macro average accuracy
  over subjects within each category. … For few-shot evaluation, we provide up to 5 demonstration examples
  with answers before the question. … humanities, social sciences assess more on memorization which is
  relatively easy for LLMs … STEM topics usually require complex reasoning, which has been proven to be
  difficult for existing LLMs … for most models, the use of chain-of-thought prompt does not lead to improvement
  … yields a total of 74 for CEval and 158 for M3KE. This overlap accounts for approximately 1% of our
  dataset. … #Q 2531 2489 3652 2910 2572 11582 … 5 subjects at primary school level, 10 at middle/high
  school level, 23 at college level, and 29 at professional level … Bactrian-X is a series of LLMs (LLaMA,
  BLOOM, mT5) proposed by MBZUAI. … using next token prediction achieves a higher score than using the
  free generation strategy for all models'

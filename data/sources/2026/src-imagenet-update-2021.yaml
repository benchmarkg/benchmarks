quote_extract: ImageNet 14,197,122 images, 21841 synsets indexed Home Download Challenges About Not
  logged in. Login | Signup An Update to the ImageNet Website and Dataset March 11, 2021 We are
  proud to see ImageNet's wide adoption going beyond what was originally envisioned. However, the
  decade-old website was burdened by growing download requests. To serve the community better, we …
  a FAT* 2020 paper, we filtered 2,702 synsets in the "person" subtree that may cause problematic
  behaviors of the model. We have updated the full ImageNet data on the website to remove these
  synsets. The update does not affect the 1,000 categories in ILSVRC. In a more recent paper, we
  investigate privacy issues in ILSVRC. 997 out of 1000 categories in ILSVRC are not people
  categories; nevertheless, many incidental people are in the images, whose privacy is a concern. We
  first annotated faces in the images and then constructed a face-blurred version of ILSVRC.

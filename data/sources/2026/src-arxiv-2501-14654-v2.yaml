quote_extract: 'luation of LLMs on complex tasks in interactive healthcare environments challenging. Methods
  To address this gap to the deployment of agentic AI in healthcare, we introduce MedAgentBench, a broad
  evaluation suite designed to assess the agent capabilities of large language models within medical records
  contexts. MedAgentBench encompasses 300 patient-specific clinically-derived tasks from 10 categories
  written by human physicians, realistic profiles of 100 patients with over 700,000 data elements, a FHIR-compliant
  interactive environment, and an accompanying codebase. The environment uses the standard APIs and communication
  infrastructure used in modern EMR systems, so it can be easily migrated … live EMR systems. Results
  MedAgentBench presents an unsaturated agent-oriented benchmark that current state-of-the-art LLMs exhibit
  some ability to succeed at. The best model (Claude 3.5 Sonnet v2) achieves a success rate of 69.67%.
  However, there is still substantial room for improvement which gives the community a next direction
  to optimize. Furthermore, there is significant variation i … benchmarks are the necessary next step
  to advance the potential and capabilities for effectively improving and integrating AI systems into
  clinical workflows. MedAgentBench establishes this and is publicly available at https://github.com/stanfordmlgroup/MedAgentBench,
  offering a valuable framework for model developers to track progress and drive continuous improvements
  in the agent capabilities of large language models with … h MRN of {MRN}, and it was 118/77 mmHg. Help
  me document this." "What is the last hemoglobin A1C value in the chart for patient {MRN} and when was
  it recorded? If the lab value result date is greater than 1 year old, order a new hemoglobin A1C lab
  test." "Order orthopedic surgery referral for patient {MRN}. Specify within the free text of the referral..."
  "Check patient {MRN}’s most recent potassium level. If … r orthopedic surgery referral is 306181000000106.”

  Of note, ’instructions’ are writte … ulant) may be on formulary, or designated as preferred, whereas
  at another hospital it may be a different formulation or medication brand. 2.2 Patient profiles Benchmark
  examples are based on real patient cases that were deidentified and jittered. Specifically, patient
  profiles are extracted from a deidentified clinical data warehouse curated by the STARR (STAnford Research
  Repository) project [27]. The timestamps in the data warehouse are jittered at the patient level. To
  provide realistic contexts, we extract lab test results, vital signs, procedur … using the open-sourced
  HAPI FHIR JPA. After configuring the server to use persistent H2 database and uploading the patient
  profiles via parallel POST requests, we build a new Docker image for easy setup. The image is available
  at https://hub.docker.com/r/jyxsu6/medagentbench. 5 The environment is a simulation of real-world live
  EMR systems, facilitating direct migration, although it should not be directly used in a production
  setting as it comes with no security implementation or enterprise loggi … gents to reflect the current
  state-of-the-art, as detailed in Section 2.4.2. Given the FHIR-compliant interactive environment takes
  around 90 seconds to start, we decide to only send GET requests to the environment so that we do not
  need to re-initialize the environment for each individual task. 2.4.1 Metrics We use task success rate
  as the main evaluation metric, as it is commonly used in agent benchmarks. The grader and reference
  solution for each task category is manually curated. For query-based tasks, we compare the responses
  from agents with the answers generated by the reference solutions. For action-based tasks, we manually
  write many rule-based sanity checks to verify the correctness of the payload of POST requests. If the
  agent system requests for invalid actions or exceeds the maximum number of interaction rounds, it is
  considered a failure. While repeated sampling techniques such as pass@k are commonly used in language
  model evaluations, we exclusively adopt pass@1 in our benchmark. This decision reflects the stringent
  accuracy requirements in healthcare applications, where even a single incorrect action or response can
  have significant c … d Gemini 1.5 Pro from Google, Claude 3.5 Sonnet v2 from Anthropic, DeepSeek-V3
  from DeepSeek, Qwen2.5 from Alibaba, Llama 3.3 from Meta, Gemma2 from Google and Mistral v0.3 from Mistral
  AI (via Together AI serverless API). We set the temperature to zero for all models except o3-mini. 2.4.3
  Agent orchestrator We develop a simple agent orchestrator to establish the baseline performance, inspired
  by BFCL [12]. At a high level, the agent system is exposed to the following nine FHIR functions selected:
  condition.search, lab.search, vital.search, vital.create, med … tion. During each round, the agent system
  is expected to select one from the three options: send a GET request, send a POST request or finish
  the conversation. As all tasks within MedAgentBench require only a few steps to complete, we limit all
  interactions to a maximum of 8 rounds. If the agent system invokes a GET request, we send the request
  and input the raw response back to the agent system. If the agent system invokes a POST request, we
  conduct a simple sanity check to make sure the payload data is JSON-loadable, and indicate success of
  execution to the agent system. If the agent system invokes a finish request, we save the entire conversation
  for grading purpose. The specific prompt used is included in the appendix. Gemini … before parsing.

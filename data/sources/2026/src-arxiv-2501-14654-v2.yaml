  One common error pattern of most models is the model does not follow the instruction exactly. For example,
  Gemini 2.0 Flash outputs invalid actions in 54% of the cases, and the model tends to output the code
  in a tool_code or json block, although the in … anced design patterns of agentic systems lead to better
  performance on MedAgentBench. There is a trade-off between the number of tasks and cost for evaluation.
  We decided that the first release of MedAgentBench would contain 300 tasks and 100 patient profiles
  to achieve accurate estimates of performance at reasonable prices. Our results showed that many of the
  main LLMs generally perform better at query-based tasks'

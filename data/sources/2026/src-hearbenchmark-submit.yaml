quote_extract: 'Submit to HEAR · HEAR Benchmark HEAR Benchmark Tasks + DataCodePaperLeaderboardAPISubmitPMLR
  Submit to HEAR Submissions to the HEAR benchmark leaderboard are welcome at any time. To evaluate on
  the HEAR benchmark and submit your results to the leaderboard: Develop an audio embedding model that
  follows the HEAR API. You may train your embedding model on any data that you want, except for data
  from splits in HEAR tasks that are explicitly denoted as test splits in train/validation/test dataset
  split setups. See hear-baseline for examples of how to wrap an existing embedding model in the HEAR
  API. Download th … ple rate that is not listed you will need to either resample the datasets or use
  hear-preprocess to recreate the datasets at the desired sample rate. Use hear-eval-kit to: a) Compute
  embeddings for all HEAR tasks using your model b) Evaluate embeddings by training a shallow downstream
  classifier Submit your results to the leaderboard by appending them to the CSV file located in the GitHub
  repository for this website and then create a pull request with the updated CSV file. Detailed submission
  instructions are provided in the README for the GitHub repository. Submit'

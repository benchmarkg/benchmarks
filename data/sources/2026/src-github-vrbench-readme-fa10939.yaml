quote_extract: "n Computer Vision, ICCV 2025 ## Updates [06/2026] Added inference support and process-eval
  scripts for more recent models. Bug fixes and refactors: - All inference modules now respect each query's
  `video_read_type` field with a decord ↔ pyav fallback. - `evaluation/run_process_eval.py` (new): end-to-end
  DeepSeek-based process-score runner with async concurrency. - `evaluation/compute_final_scores.py` (new):
  aggregates MCQ + process scores into a unified Final% leaderboard with per-reasoning-type breakdown.
  - `inference/logs`, `inference/outputs`, `evaluation/eval_outputs` are now git-ignored (data lives outside
  the repo). [08/2025] The camera-ready version of VRBench has been released! Check the [arxiv](https://arxiv.org/abs/2506.10857)
  paper for the new updates. [07/2025] VRBench has been fully open-sourced! Check our data on [Huggingface](https://huggingface.co/datasets/OpenGVLab/VRBench)!
  [06/2025] VRBench has been accepted to ICCV2025! ## Installation ### 1. Create a Python 3.11 environment
  (conda example) ```bash conda create -n vrbench python=3.11 -y … da activate vrbench ``` ### 2. Install
  required packages ```bash python -m pip install -r requirements.txt ``` ## Usage ### 1. Run inference
  (generate model answers) See `inference/README.md` for full details. Minimal example: ```bash python
  inference/main.py \\ --model \"Qwen/Qwen2-VL- … his command loads a local model (path configured in
  `inference/utils/constant.py`) and produces an **inference JSONL**. ### 2. Rate answers with DeepSeek
  See `evaluation/README.md` – example: ```bash python evaluation/batch_evaluation_api_mp_time_sync.py
  \\ --source_file in … e evaluation/data_for_eval/VRBench_summary.jsonl \\ --output_file evaluation/eval_outputs/Qwen2-VL-7B_evaluation.jsonl
  \\ --model deepseek \\ --api_key $DEEPSEEK_KEY \\ --base_url https://api.deepseek.com/v1 ``` This step
  creates an **evaluation JSONL** containing `rate` values. ### 3. Compute VRBench scores ```bash python
  evaluation/calculate_scores.py \\ --ground_truth_file evaluation/data_for_eval/VRBench_eval.jsonl \\
  --inference_file inference/debug_outputs/Qwen2-VL-7B_16frame.jsonl \\ --evaluation_file evaluation/eval_outputs/Qwen2-VL-7B_evaluation.jsonl
  \\ --model_name Qwen2-VL-7B ``` Results are printed in a table and optionally saved to JSON. For advanced
  options (batch scripts, adaptive frame logic, custom models) please read the dedicated READMEs in `inferen

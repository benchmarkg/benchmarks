quote_extract: 'get view at inference. On both complete six-view RealEstate10K protocols, GradSplat has
  the best PSNR and SSIM among nine evaluated methods, and one model keeps its accuracy from 6 to 42 input
  views. Without fine-tuning, it is the most accurate of these methods on DL3DV [22]. Without input poses,
  it runs on its predicted cameras at lower accuracy. Our contributions are threefold: • We identify that
  the amortization gap of feed-forward 3D Gaussian Splatting is carried by t … oth indices are evaluated
  at 224 × 224 pixels. The view-count index keeps the targets of the narrow protocol and adds input views
  up to V = 42, on the 6,444 scenes whose frame window holds that many. Transfer is measured on 139 of
  the 140 scenes of the DL3DV [22] index released with ReSplat [47], with six input views and eight target
  views per scene. On ScanNet++ [51] it is measured on the validation set, with six input views and three
  target views per scene. We report PSNR, SSIM [41] and LPIPS [55]. Every method is re-measured under
  one setting … the published indices unchanged. DL3DV index. Transfer to DL3DV uses the index of the
  ReSplat repository, with 140 scenes of six input and eight target views whose inputs span a median of
  59 frames. The images of one scene have half the size of the others in the benchmark download and the
  conversion script drops it, so every method is evaluated on the same 139 scenes. Baseline weights. All
  baselines are re-measured in our setting with released weights. pixelSplat, MVSplat, TranSplat and DepthSplat
  use the weights of the VolSplat release, which its authors describe'

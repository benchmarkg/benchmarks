quote_extract: "when a pre-specified time limit is reached (in which case the game is counted as a defeat
  for the allied agents). The goal for each scenario is to maximise the win rate of the learned policies,
  i.e., the expected ratio of games won to games played. To speed up learning, the enemy AI units are
  ordered to attack the agents' spawning point in the beginning of each episode. Perhaps the simplest
  scenarios are _symmetric_ battle scenarios. The most … of the micro-trick challenges are inspired by
  [StarCraft Master](http://us.battle.net/sc2/en/blog/4544189/new-blizzard-custom-game-starcraft-master-3-1-2012)
  challenge missions released by Blizzard. The complete list of challenges is presented bellow. The difficulty
  of the game AI is set to _very difficult_ (7). Our experiments, however, suggest that this setting does
  significantly impact the unit micromanagement of the built-in heuristics. | Name | Ally Units | Enemy
  Units | Type | | :---: | :---: | :---: | … having enemy (allied) units killed and/or a positive (negative)
  bonus for winning (losing) the battle. The exact values and scales of this shaped reward can be configured
  using a range of flags, but we strongly discourage disingenuous engineering of the reward function (e.g.
  tuning different reward functions for different scenarios). ### Environment Settings SMAC makes use

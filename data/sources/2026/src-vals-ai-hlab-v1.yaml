  The Legal Agent Benchmark is a benchmark recently released by Harvey to test the ability of models to
  support legal work in an agentic setting. There are two datasets as of today: the public set and the
  held-out test set. The results here are from the held-out set, and initial results have already been
  released by Harvey. Each task asks an agent to produce legal work against a set of task-specific criteria.
  The agent is provided with six tools: Read File, Edit File, Write File, Glob, Bash, and Grep. It also
  has three skills: docx, pptx, and xlsx. Reported results use the same methodology as Harvey’s initial
  leaderboard. Criteria pass rate is included to show how often models satisfy individual requirements,
  even when they do not fully resolve the task. Results Among models with a nonzero final"

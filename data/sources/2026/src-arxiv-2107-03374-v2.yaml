quote_extract: 'ts Python code-writing capabilities. A distinct production version of Codex powers GitHub
  Copilot. On HumanEval, a new evaluation set we release to measure functional correctness for synthesizing
  programs from docstrings, our model solves 28.8% of the problems, while GPT-3 solves 0% and GPT-J solves
  11.4%. Furthermore, we ﬁnd that repeated sampling from the model is a surprisingly effective strategy
  for … typically evaluated by heuristics or by human evaluators. To accurately benchmark our model, we
  create a dataset of 164 original programming problems with unit tests. These problems assess language
  comprehension, algorithms, and simple mathematics, with some comparable to simple software interview
  questions. We release this data along with an evaluation framework at https://www.github.com/openai/human-eval.
  To solve a problem in our test set, we generate multiple samp … , computing pass@k in this way can have
  high variance. Instead, to evaluate pass@k, we generate n ≥ k samples per task (in this paper, we use
  n = 200 and k ≤ 100), count the number of correct samples c ≤ n which pass unit tests, and calculate

quote_extract: 'on News and the RSNA 2022: Daily Bulletin. Thanks to Ralph Anzarouth and Melissa Silverberg
  for the shout-out!¶ ¶ 📢 29 November 2022: Open Development Phase of the PI-CAI challenge has now concluded!
  All teams can continue to make submissions to the Open Development Phase - Tuning Leaderboard, albeit
  at a reduced rate (once per week per verified user). Meanwhile, the Open Development Phase - Testing
  Leaderboard will reopen in early 2023 and accept submissions on a per-application basis to the PI-CAI
  consortium via e-mail. Please check out this forum thread for more details.¶ 📢 20 October 2022: The
  PI-CAI challenge will be featured in an upcoming webinar from the MICCAI Special Interest Group for
  Challenges, titled "How to Run a Challenge?", on 25 October 2022. See you there!¶ ¶ 📢 5 September 2022:
  Participants can now submit a maximum of 1 AI algorithm per day per verified user to the Open Development
  Phase - Tuning Leaderboard, instead of 1 AI algorithm per week per team like before. All participants
  must still form teams (even if the team is composed of a single participant), and each participant can
  only be a member of a single team. For the full list of participation rules, visit: https://pi-cai.grand-challenge.org/AIPR/
  .¶ 📢 8 August 2022: The PI-CAI challenge is now preregistered in compliance with NLM-NIH and BIAS reporting
  guidelines! To learn more about our end-to-end study design, visit: - clinicaltrials.gov/NCT05489341
  - zenodo.org/record/6667655 (DOI:10.5281/zenodo.6667655)¶ 📢 16 June 2022: GitHub repos with our source
  code fo'

  CACHE Target 2035 Challenge Publications Contact WHAT IS CACHE? The CACHE (Critical Assessment of Computation
  Hit-finding Experiments) Challenges offer an open competition platform to help accelerate one of the
  early stages of drug discovery. CACHE will help define the state-of-the-art in molecular design by providing
  unbiased, … d maturation of deep learning. CACHE will reveal the most efficient computational methods
  for hit-finding and guide future technological improvement. CACHE builds on the power of crowd sourcing
  by attracting funding from industry, governments and foundations to support its infrastructure. In addition,
  challenge-specific funding mechanisms will give disease-focused funders the opportunity to recruit community-wide
  efforts to proteins of … These public competitions (challenges) will have the added benefit of identifying
  new chemical starting points for biologically interesting targets. Each competition will focus on a
  new protein target representing one of the following five possible challenges in hit-finding (Based
  on the type of target data available). Protein structure in complex … challenge, participants will be
  invited to use their computational methods to find hits (drug-like molecules) for a protein target selected
  by CACHE. CACHE will procure the molecules from commercial vendors and test them experimentally with
  two rigorous binding assays. Compounds from de novo design methods will be procured by participants
  [details]. The purity and solubility of active molecules will also be evaluated experimentally. CACHE
  will provide each participant with the experimental protein binding data for their prediction. Using
  this knowledge, participants may predict a … ate: experimental hit rate affinity and physico-chemical
  properties of the hits from a participant’s selection hit selection from the pooled library. A panel
  of experienced medicinal chemists will also comment on the hits. Participants will be asked to disclose
  their approaches in sufficient detail to enable an expert in the area to understand the methodology
  while computational algorithms can remain proprietary. At the end of the competition, all chemical structures
  and associated activity from all participants will be disclosed to the public. Top-performing participants
  and those who wish to will be de-anonymized. In summary, Participants will use their computational method
  to predict hits … designs. At the end of each challenge; following expert review, CACHE will release
  all data, including chemical structures, to the public. ACCESS FEE The access fee for entering a CACHE

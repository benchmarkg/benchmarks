quote_extract: rage of ecological studies. Given the task’s difficulty and the strong results and
  participation in the 2025 challenge, the task is organized again in a similar format, using the
  same datasets and Kaggle platform as a second round. Task description The task is evaluated as a
  multi-label classification task that aims to predict all the plant species on the high-resolution
  plot images. The main difficulty of the task lies in the shift between the test data
  (high-resolution multi-label images of vegetation plots) and the training data (single-label
  images of individual plants). Data collection The test set is a compilation of several image
  datasets of plots in different floristic contexts, such as Pyrenean and Mediterranean floras, all
  produced by experts. The training set is composed more conventionally of observations of
  individual plants, such as those used in previous editions of PlantCLEF. More precisely, it is a
  subset of the Pl@ntNet training data focusing on south western Europe and covering 7.8k plant
  species. It contains about 1.4 million images extended with some images with trusted labels

quote_extract: '# Archipelago Archipelago is a system for running and evaluating AI agents against MCP
  applications. It consists of three main components: 1. **Environment**: Headless environment that exposes
  an MCP gateway 2. **Agents**: Extensible agent runner with a registry of configurable agent implementations
  3. **Grading**: Grades agent performance by comparing before/after snapshots (formerly "Verifier") All
  components run in Docker containers. The environment is meant to be run independently as a sandbox,
  and then an LLM agent connects to the exposed MCP server. The agents runner spawns and … s: **Option
  A: HuggingFace Benchmark Task (Recommended)** Run tasks from the [mercor/apex-agents](https://huggingface.co/datasets/mercor/apex-agents)
  benchmark dataset with 480 professional services tasks. ```bash cd examples/hugging_face_task ./run.sh
  ``` See [examples/hugging_face_task/README.md](./examples/hugging_face_task/README.md) for details.
  **'

  API. Your model must be able to produce two kinds of embeddings: Timestamp-based embeddings: return
  time-centered embeddings at regular intervals. You may select the time interval (hop-size) between adjacent
  embeddings, but we suggest that it is <= 50ms to handle an onset tolerance of 50ms for music transcription
  evaluation. Scene embeddings: return a single embedding for a entire audio clip. To help you develop

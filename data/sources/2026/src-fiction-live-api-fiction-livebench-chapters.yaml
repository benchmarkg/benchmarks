quote_extract: "fanclubExclusive\":false,\"b\":\" Introducing Fiction.LiveBench: The First Real-World
  Long Context Benchmark for Writers Fiction.live has AI tools that help writers save time by making summaries,
  timelines, character bibles, and iterate on those documents in insightful ways. To do that effectively,
  the LLM needs to truly understand the story, each character and their motivations on a deep and profound
  level. However, in practice, today’s … gned with an author’s intent. The root problem is that long context
  comprehension is still broken. Fiction.live happens to be a huge repository of complex long story content
  and so we're well positioned … LLM needs to do things like: track changes over time - e.g. they hate
  each other, … ed has morphed into obsession logical predictions based on established hints ability to
  understand secrets told in confidence to readers versus those that are known to characters and so on
  It's a specific long context real world test that we find more reflective of writing use than LongBench
  or RULER, which test search rather than comprehension. From our experience, most LLM … s, but not over
  long context. That's why we're launching a new benchmark called Fiction.LiveBench to demonstrate the
  case and to show our users which LLM they should choose in their writing tasks. The Fiction.LiveBench
  Methodology Based on a selection of a dozen very long complex stories and many verified quizzes, we
  generated tests based on select cut down versions of those stories. For every test, we start with a
  cut down version that has only relevant information. This we call the \\\"0\\\"-token test. Then we
  cut down less and less for longer tests where the relevant information is only part of the longer story
  overall. We then evaluated leading LLMs across different context lengths. Here is an 8k example of the
  … hat is passed by more models. Grok 3 for example, fails the 8k variant but passes the 1k variant.
  The actual dataset comes from our users and will remain private. o1 and o3-mini uses default (medium)
  settings. Claude sonnet 3.7-thinking uses 8k thinking tokens. Results Older results: https://cdn6.fiction.live/file/fictionlive/5aa21fca-ff97-4483-9dd6-ae141dfe0a9e.png

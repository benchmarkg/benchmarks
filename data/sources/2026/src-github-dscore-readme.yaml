quote_extract: 'I. Overview ========= This suite supports evaluation of diarization system output relative
  to a reference diarization subject to the following conditions: - both the reference and system diarizations
  are saved within [Rich Transcription Time Marked (RTTM)](#rttm) files - for any pair of recordings,
  the sets of speakers are disjoint II. Dependencies ========== The f … s://pypi.python.org/pypi/intervaltree)
  - tabulate >= 0.5.0 (https://pypi.python.org/pypi/tabulate) * Tested with Python 2.7.X, 3.6.X, and 3.7.X.
  III. Metrics ====== Diarization error rate --------------------------- Following tradition in this area,
  we report diarization error rate (DER), which is the sum of - speaker error -- percentage of scored
  time for which the wrong speaker id is assigned within a speech region - false alarm speech -- percentage
  of scored time for which a nonspeech region is incorrectly marked as containing speech - missed speech'

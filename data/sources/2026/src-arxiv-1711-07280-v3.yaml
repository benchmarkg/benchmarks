  52]. Limiting the variation in the imagery inevitably limits the variation in the navigation instructions
  also. What distinguishes the VLN challenge is that the agent is required to interpret a previously unseen
  natural-language navigation command in light of images generated by a previously unseen real environment.
  The task thus more closely models the distinctly open-set nature of the underlying problem. To enable
  the reproducible evaluation of VLN methods, we present the Matterport3D Simulator. The simulator is
  a large-scale interactive reinforcement learning (RL) environment constructed from the Matterport3D
  dataset [11] which contains 10,800 densely-sampled panoramic RGB-D images of 90 real-world building-scale
  indoor environments. Compared to synthetic RL environments [7, 27, 62], the use of real-world image
  data preserves visual and linguistic richness, maximizing the potential for trained agents to be transferred
  to real-world applications. Based on the Matterport3D environments, we collect the Room-to-Room (R2R)
  dataset containing 21,567 openvocabulary, crowd-sourced navigation instructions with an average length
  of 29 words. Each instruction describes a trajectory traversing typically multiple rooms. As illustrated

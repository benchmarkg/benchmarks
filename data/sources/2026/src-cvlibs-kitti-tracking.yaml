quote_extract: The object tracking benchmark consists of 21 training sequences and 29 test
  sequences. … only the classes 'Car' and 'Pedestrian' are evaluated in our benchmark … we
  additionally labeled the left/right boundaries of each object by making use of Mechanical Turk …
  Evaluation is performed using the code from the TrackEval repository. … We evaluate 2D 0-based
  bounding boxes in each image. … Methods are ranked overall by HOTA … To make the methods
  comparable, the time for object detection is not included in the specified runtime. … On
  25.02.2021 we have updated the evaluation to use the HOTA metrics as the main evaluation metrics

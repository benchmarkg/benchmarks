quote_extract: "ics, often fail to encompass the full spectrum of video content and inadequately assess
  models' temporal comprehension. To address these limitations, we introduce MMBench-Video, a quantitative
  benchmark designed to rigorously evaluate LVLMs' proficiency in video understanding. MMBench-Video incorporates
  lengthy videos from YouTube and employs free-form questions, mirroring practical use cases. The benchmark
  is meticulously crafted to probe the models' temporal reasoning skills, with all questions human-annotated
  according to a carefully constructed ability taxonomy. We employ GPT-4 for automated assessment, demonstrating
  superior accuracy and robustness over earlier LLM-based evaluations. Utilizing MMBen … ll be integrated
  into VLMEvalKit: this https URL. Comments: Accepted in NeurIPS 2024 Datasets and Benchmarks Track Subjects:
  Computer Vision and Pattern Recognition (cs.CV);"

quote_extract: "but focus on software verification. Recent work has begun bridging this divide by evaluating
  LLMs for software verification in ITPs, but the complementary direction, LLMs for mathematical theorem
  proving in auto-active verifiers, remains unexplored. We present MINIF2F-DAFNY, the first translation
  of the widely-used mathematical benchmark miniF2F to an auto-active verifier: Dafny. We find that Dafny's
  automation alone solves 39-44% of problems with empty proofs, whereas many require substantial proof
  guidance in ITPs. We evaluate 8 off-the-shelf LLMs on proof generation, with the best model (Claude
  Opus 4.6) achieving 62.7% c"

quote_extract: In this work, we present a densely annotated dataset ADE20K, which spans diverse
  annotations of scenes, objects, parts of objects, and in some cases even parts of parts. … our
  dataset was annotated by a single expert annotator, providing extremely detailed and exhaustive
  image annotations. … Images were annotated by a single expert worker using the LabelMe interface …
  After annotation, there are 20, 210 images in the training set, 2, 000 images in the validation
  set, and 3, 000 images in the testing set. … On average, 82.4% of the pixels got the same label. …
  Scene parsing is to segment the whole image densely into semantic classes, where each pixel is
  assigned a class label such as the region of tree and the region of building. … We select the top
  150 categories ranked by their total pixel ratios2 … Among the 150 categories, there are 35 stuff
  classes (i.e., wall, sky, road) and 115 discrete object classes (i.e., car, person, table). …
  Pixel accuracy indicates the proportion of correctly … Mean IoU indicates the
  intersection-over-union between the predicted and ground-truth pixels, averaged over all the
  classes. … we select 100 foreground object categories from the full dataset, term it as
  InstSeg100. … The total number of object instances is 218K, … Scene parsing submissions were
  ranked based on the average score of the mean IoU and pixel-wise accuracy in the benchmark test
  set. … The winning team in 2016 proposing PSPNet [37] still holds the highest score. … In Fig. 13
  we compare the top models against the proposed baselines and human performance (approximately
  measured as the annotation consistency in Sec.2.3), … For instance segmentation, we used the mean
  Average Precision (mAP), following COCO’

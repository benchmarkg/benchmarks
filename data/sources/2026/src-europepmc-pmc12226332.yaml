  been explicitly trained. However, we possess only a limited systematic understanding of the chemical
  capabilities of LLMs, which would be required to improve models and mitigate potential harm. Here we
  introduce ChemBench, an automated framework for evaluating the chemical knowledge and reasoning abilities
  of state-of-the-art LLMs against the expertise of chemists. We curated more than 2,700 question–answer
  pairs, evaluated leading open- and closed-source LLMs and found that the best models, on average, outperformed
  the best human chemists in our study. However … ive to experts49. In this work, we report a benchmarking
  framework (Fig. 1), which we call ChemBench, and use it to reveal the limitations of current frontier
  models for use in the chemical sciences. Our benchmark consists of 2,788 question–answer pairs compiled
  from diverse sources (1,039 manually generated and 1,749 semi-automatically generated). Our corpus measures
  reasoning, knowledge and intuition across a large fraction of the topics taught in undergraduate and
  graduate chemistry curricula. It can be used to evaluate any system that can return text (that is, including
  tool-augmented systems).Fig. 1Overview of the ChemBench framework. The different components of the ChemBench

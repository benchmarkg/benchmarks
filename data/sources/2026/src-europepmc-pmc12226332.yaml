  For our dataset, we curated questions from existing exams or exercise sheets but also programmatically
  created new questions (see Supplementary Table 3 for more details). Questions were added via Pull Requests
  on our GitHub repository and only merged into the corpus after passing manual review (Extended Data
  Fig. 1) as well as automated checks (for example, for compliance with a standardized schema). To ensure
  that the questions do not enter a training dataset, we use the same canary string as the BigBench project.
  This requires that LLM developers filter their training dataset for this canary string4,42. Manually
  curated questions Manually curated questions were sourced from various sources, including universi …
  pend much time answering it, relying only on their feelings or ‘chemical preference’. To understand
  whether the capabilities of the leading models align with the preferences of professional chemists,
  we randomly selected 1,000 data points from the original dataset to create a meaningful evaluation set,
  where molecules are represented as SMILES. To ablate the effect of different molecular representations,
  we only considered questions for which we could obtain International Union of Pure and Applied Chemistry
  names for both the molecules present. Model evaluation workflow A graphical overview of the pipeline
  is presented in Supplementary Fig. 12. Prompting We employ distinct prompt templates tailored for completion
  and instruction-tuned models to maintain consistency with the training. As explained later, we impose
  constraints on the models within these templates to receive responses in a specific format so that robust,
  fair and consistent parsing can be performed. Certain models a … n. As initial tests indicated that
  models sometimes return integers in the form of words, for example, ‘one’ instead of ‘1’, we also implemented
  a word-to-number conversion using regular expressions. If these hard-coded parsing steps fail, we use
  a LLM, for example, Claude-3.5 (Sonnet), to parse the completion (Supplementary Note 8 provides more
  details on this step). Models For all models, we performed inference using greedy decoding (that is,
  temperature 0). We used the API endpoints provided by the model developers and those provided by Groq.
  PaperQA2 was used (in August 2024) via an API provided by FutureHouse. Confidence estimate To estimate
  the models’ confidence, we prompted them with the question (and answer options for MCQ) and the … eneral.
  In Supplementary Note 12, we provide more details and comparisons with a logit-based approach. Human
  baselineQuestion selection Several design choices were made when selecting ChemBench-Mini. Firstly,
  from the full dataset, we kept all the questions labelled as advanced. In this way, we can obtain a
  deeper insight into the capabilities of LLMs on advanced tasks when compared with actual chemists. Secondly,
  we sample a maximum of three questions across all possible combinations of categories (that is, knowledge
  or reasoning) and topics (for example, organic chemistry and physical chemistry). Thirdly, we do not
  include any intuition questions in this subset because the intended use of ChemBench-Mini is to provide
  a fast and fair evaluation of LLMs independent of any human baseline. In total, 236 questions have been
  sampled for ChemBench-Mini. Then, this set is divided into two subsets on the basis of the aforementioned
  combinations. One of the question subsets allows tool use, and the other does not. Study design Human
  volunteers were asked the questions in a custom-built web interface (Supplementary Note 10), which rendered
  chemicals and equations. Questions were shown in random order, and volunteers were not allowed to skip
  questions. For a subset of the questions, the volunteers were allowed to use external tools (excluding
  other LLM or asking other people) to answer the questions. Before answering questions, volunteers were
  asked to provide information about their education and experience in chemistry. The study was conducted
  in English. Human volunteers Users were open to reporting about their experience in chemistry. Overall,
  16 did so. Out of those, 2 are beyond a first postdoc, 13 have a master’s degree (and are currently
  enroled in Ph.D. studies) and 1 has a bachelor’s degree. For the analysis, we excluded volunteers with
  less than 2 years of experience in chemistry after their first university-level course in chemistry.
  Comparison with models For the analysis, we treated each human as a model. We computed the topic aggregated
  averages per human for analyses grouped by topic and then averaged over all humans. The per … plementary
  Note 4. Data annotation In the curation of our dataset, we manually assigned difficulty levels and required
  skills to each question. We used the following guidelines for these annotations: calculation is required
  if answering a question would require the use of a calculator, knowledge is required if answering a
  question requires non-trivial knowledge of facts (for example, the H/P statements of chemicals). Reasoning
  is required if answering a question requires multiple reasoning steps. Basic questions only require
  those skills up to the high school level. Advanced questions would require an expert multiple minutes
  or hours to answer. Inclusion and ethics statement The authors confirm that they have complied with

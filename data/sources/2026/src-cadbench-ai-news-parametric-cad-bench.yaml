quote_extract: "e Harbor task suite gnucleus-ai/cad-bench and the Hugging Face results dataset gnucleus-ai/cad-gen-freecad-bench.
  TL;DR We introduce Parametric CAD Bench, a new evaluation for AI agents that measures the ability to
  author editable FreeCAD models from natural language. Unlike previous CAD-related benchmarks, we use
  a multi-step agentic loop and a strict \"editability gate\" (harmonic mean scoring) to ensure models
  produce functional engineering recipes, not just static 3D shapes. Early results show GPT-5.5 via Codex
  leading at 0.832, with a visible harness effect: swapping the driver while keeping the model fixed shifts
  scores by roughly 10% in eithe … easure something different: The agent has tools. A productive CAD-with-LLM
  session isn't a single prompt — it's a loop. Our agents run a shell, write the FreeCAD script, execute
  it, inspect errors, fix them, and try again, all inside a sandboxed container. The bench measures that
  loop end-to-end rather than just the first model output. The output has to be editable, not just correct-shaped.
  Plenty of models can produce a 3D solid that matches a referenc … ic mean (see §\"How scoring works\"\
  ), a model that produces perfect geometry but zero named parameters scores 0, not 0.5. The harness is
  a first-class variable. The 10 leaderboard cells cross four agent frameworks — claude-code, codex, gemini-cli,
  mini-swe-agent — with the major … sions Key metric Volumetric IoU Code correctness Harmonic mean of
  geometry × spec and cad consistency How scoring works Both sub-scores below are computed by the open-source
  gNucleus-AI/freecad-validator (v0.1.0) — the same validator binary is baked into each task image at
  /opt/grader/, so leaderboard scores and any local re-grade … esign? Compared on solid count, volume,
  surface area, bounding box, and surface-type distribution. cad_spec_consistency For each key parameter
  in the part spec (e.g. bolt_circle_diameter), does the saved CAD file contain a corresponding named,
  driven dimension within tolerance? A bolt pattern that's geometrically perfect but has the holes hard-coded
  as fixed positions loses points here. The composite is the harmonic mean of the two: Combined = 2 *
  (geometry_similarity * cad_spec_consistency) / (geometry_similarity + cad_spec_consistency) This is
  the editability gate, expressed as arithmetic. A model that produces the correct shape but zero named
  parameter … hes Vertex AI Gemini through LiteLLM's OpenAI-compatible Vertex AI endpoint, which doesn't
  return cost in the response. We backfill those from token counts × Vertex AI pricing before any results
  upload, so the numbers above are apples-to-apples. Why the harness gap Drilling into per-task deltas
  between same-model pairs … different verification rhythm (inspect the saved artifact), and the specialized
  CLIs don't carry that habit by default. Same model, same task, different verification rhythm: +6 to
  +9 points of absolute composite score. How we compare to CadBench and BenchCAD The overarching goal
  is to push AI-CAD research past static geometry and mesh g … each task image at root-only paths the
  agent can't read, so the evaluation is fully reproducible from the image alone. The agent itself has
  outbound internet — needed to install its CLI and reach its model API — matching the Terminal-Bench
  / SWE-Bench-Verified convention.) Unl … atrix all point at the same question. The three suites are complementary,
  not competing. How to submit your own results The leaderboard accepts third-party (agent, model) submissions.
  The flow is three steps: Run the bench. harbor run -d gnucleus-ai/cad-bench@v1 -a -m against the published
  task suite. … ask suite itself is free. Push your run artifacts to a Hugging Face dataset you control.
  Use the same runs///<task_id>/ layout the internal baseline uses (per-trial result.json, answer.FCStd,
  agent.log, trajectory.jsonl, …). The published gnucleus-ai/cad-gen-freecad-bench … ma and required fields
  live in submissions/_schema/manifest.schema.json; start from submissions/_template/example.yaml. A maintainer
  reviews each PR by hand: schema check, spot-check re-grade against your declared reward.json with gnucleus-freecad-validator,
  trajectory sanity … ucleus-ai/cad-bench@v1 -a -m command. Source data (Hugging Face): huggingface.co/datasets/gnucleus-ai/cad-gen-freecad

  Metrics We evaluate the lexical, syntactic, and semantic understanding capabilities of speech LMs using
  sWUGGY, sBLIMP, and StoryCloze, respectively [20], [59]. All three are contrastive metrics that assess
  whether the model assigns higher likelihood to linguistically correct speech samples over minimally
  incorrect counterparts. For example, in sWUGGY, the m … quality of SylReg-LM 85M outperforms that of
  SpiRit-LM 7B, whereas using only 0.2% of its compute. This high computational efficiency is partially
  attributed to the low frame rate of syllabic tokens. When scaling with respect to both model and data
  sizes, SylReg-LM 7B achieves an average relative improvement of 7% over SpiRit-LM on sBLIMP and StoryCloze.

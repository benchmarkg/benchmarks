quote_extract: 'f new techniques. There is a clear need for large-scale, challenging benchmarks to both
  train and evaluate new strategies for image matching. Towards this end, we held in 2019 an open challenge
  in image matching across wide baselines. In contrast to existing benchmarks, we only consider integrated
  solutions and our primary metric measures the accuracy of the reconstructed poses — the final goal.
  We are pleased to introduce a second, much improved edition of this challenge. It is co-located with
  the CVPR 2020 workshop on Image Matching … ic. We will hold the workshop if CVPR remains on. We plan
  to hold the challenge whether CVPR is held or not. March 3, 2020: Published benchmark paper on arxiv.

  evaluation campaigns. First, the datasets used in the challenges, while diverse, may not fully
  capture the complexities of all real-world conversational environments. The scenarios considered
  are still limited in scope, and moreover, they only consider the English language. More effort
  should be done in the future to also consider the possibility of multilingual meeting
  transcription that can also be robust to code switching so that this technology can benefit a
  larger amount of people. Second, most importantly, to truly gauge system generalization, future
  benchmarks should consider having at least some fully blind evaluation scenarios for which the
  domain is not known a-priori by the participants. In the C7-8DASR challenges, all the evaluation

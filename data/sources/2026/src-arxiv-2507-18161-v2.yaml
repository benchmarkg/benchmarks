  distant speech recognition (DASR) challenges focus on multi-channel, generalizable, joint
  automatic speech recognition (ASR) and diarization of conversational speech. With participation
  from 9 teams submitting 32 diverse systems, these challenges have contributed to stateof-the-art
  research in the field. This paper outlines the challenges’ design, evaluation metrics, datasets,
  and baseline systems while analyzing key trends from participant submissions. From this analysis i

quote_extract: "# CropHarvest CropHarvest is an open source remote sensing dataset for agriculture with
  benchmarks. It collects data from a variety of agricultural land use datasets and remote sensing products.
  The dataset consists of **95,186** datapoints, of which **33,205** (35%) have multiclass labels. All
  other datapoints only have binary crop / non-crop labels. **70,213** (74%) of these labels are paired
  with remote sensing and climatology data, specifically [Sentinel-2](https://sentinel.esa.int/web/sentinel/missions/sentinel-2),
  [Sentinel-1](https://sentinel.esa.int/web/sentinel/missions/sentinel-1/), the [SRTM Digital Elevation
  Model](https://cgiarcsi.community/data/srtm-90m-digital-elevation-database-v4-1/) and [ERA 5 climatology
  data](https://www.ecmwf.int/en/forecasts/datasets/reanalysis-datasets/era5). 21 datasets are aggregated
  into CropHarvest - these are documented [here](https://github.com/nasaharvest/cropharvest/blob/main/datasets.md).
  More details about CropHarvest and the benchmarks are available in [this paper](https://openreview.net
  … ineExporter` directly, these use cases are demonstrated in the [`demo_exporting_data.ipynb`](https://github.com/nasaharvest/cropharvest/blob/main/demo_exporting_data.ipynb)
  notebook. ### Installation Linux and MacOS users can install the latest version of CropHarvest with
  the following command: ```bash pip install cropharvest ``` Windows users must install the CropHarvest
  within a [conda](https://docs.conda.io/en/latest/miniconda.html) environment to ensure all dependencies
  are installed co … hub.com/nasaharvest/cropharvest/blob/main/demo.ipynb) notebook for an example on
  how to download the data from [Zenodo](https://zenodo.org/record/7257688) and train a random forest
  against this data. For more examples of models trained against this dataset, see the [benchmarks](https://github.com/nasaharvest/cropharvest/blob/main/benchmarks).
  ### Contributing If you would like to contribute a dataset, please see the [contributing readme](https://github.com/nasaharvest/cropharvest/blob/main/contributing.md).
  ### ~~FAQ~~ Questions asked at least once How do I use CropHarvest for a specific geography? All the
  data is accessible through … in manipulating are controllable through a `cropharvest.datasets.Task`,
  which takes as input the following parameters: - A bounding box, which defines the spatial boundaries
  of the labels retrieves - A target label, which defines the class of the positive labels (if this is
  left to `None`, then the positive class will be crops and the negative class will be non-crops) - A
  boolean defining whether or not to balance the crops and non-crops in the negative class - A test_identifier
  string, which tells the dataset whether or not to retrieve a file from the `test_features` folder and
  return it as the test data. So if I wanted to use this to train a model to identify crop vs. non crop
  in France, I might do it like this: ```python from sklearn.ensemble import RandomForestClassifier from
  cropharvest.datasets i … llite data is stored as `h5py` files, so I can load it up as follows: ```python
  >>> import h5py >>> h5py_file = h5py.File(path_to_file, \"r\") >>> x = h5py_file.get(\"array\")[:] >>>
  x.shape (12, 18) ``` The shape of `x` represents 12 timesteps and 18 bands. To retrieve the band I am
  interested in: ```python >>> from cropharvest.bands import BANDS >>> x[:, BANDS.index(\"NDVI\")] array([0.28992072,
  0.28838343, 0.26833579, 0.22577633, 0.27138986, 0.06584114, … is the data format? The structure of the
  different data files is now described in depth in the data folder's [Readme](https://github.com/nasaharvest/cropharvest/blob/main/data/README.md)

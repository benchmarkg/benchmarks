quote_extract: '# A note on the Influence task We have retained a private test set of 64 questions for
  Influence, to hopefully detect memorisation if (despite our precautions) SAD benchmark data ends up
  in training data. As a consequence, the runs for Influence that you will find in the sad/influence/evals/evalresult
  f … dels with `sad run --tasks influence` (or `sad run MODEL_NAME influence` for a specific model),
  and you will get new runs only on the 256 public questions.'

  topic in 2013 to foster the development of countermeasures (CMs) to protect ASV systems and human listeners
  from spoofing attacks. The first challenge edition held in 2015 [17] focused on the development of CMs
  for the detection of TTS and VC attacks. ASVspoof 2019 was the first to consider the detection of DNN-based

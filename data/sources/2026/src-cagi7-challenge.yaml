quote_extract: 't of Genome Interpretation Register/Login Critical Assessment of Genome Interpretation
  Challenges Meetings Publications Organization Contact Us CAGI7 Challenge Summer-Winter 2025 Fourteen
  challenges released and completed. Clinical Genomes 1. Rare Genomes Project VCF — closed Identify diagnostic
  variants in children with rare disease from the Rare Genomes Project The Rare Genomes … vard. In this
  challenge, variants from short-read genome sequencing data and phenotype data from a subset of the solved
  and unsolved RGP families are provided. Participants in the challenge (predictors) will try to identify
  the causal variant(s) in each proband. For the unsolved probands, prioritized variants from the participating
  teams will be examined to see if additional genetic diagnoses can be made. Data provided … atory Bowel
  Disease and Coronary Artery Disease) and of thirty simulated phenotypes representing a range of genetic
  architectures of common polygenic diseases. The challenge is to predict the disease outcomes of individuals
  in held-out validation cohorts. Data provided by: Sung Chun and Shamil Sunyaev, Harvard Medical School
  Deep Mutational Scanning Challenges 1. TSC2 — closed Predict the effect of missense vari … d another
  in the RapGAP domain-have been assessed for their effects on protein stability using a high-throughput
  multiplexed variant stability profiling assay. The challenge is to predict the quantitative impact of
  these variants on TSC2 stability, as measured by the assay. Data provided by: Doug Fowler, University
  of Washington. 2. BARD1 — closed Predict the effect of BARD1 single nucleotide variants on RNA abundance
  and cell sur … n Cancer Consortium (DKTK) Non-Coding Variant Interpretation 1. lentiMPRA — closed Predicting
  variant effects in functional regulatory elements using lentiMPRA The challenge is to predict the functional
  impact of genetic variants on regulatory element activity. For this purpose, a subset of functionally
  validated regulatory elements from a large-scale lentiMPRA study were selected and existing single nucleotide
  varian … currently unknown, but experimental and clinical evidence is accruing rapidly. Rather than
  drawing upon a single dataset as typical with most CAGI challenges, predictions will be assessed by
  comparing with clinical (pathogenicity) and experimental annotations made available after the prediction
  submission date, and on an ongoing basis. If predictors assent, their predictions will also be incorporated
  into dbNSFP. Data provided by: Xiaoming Liu, University of South Florida 2. Annotate All In-'

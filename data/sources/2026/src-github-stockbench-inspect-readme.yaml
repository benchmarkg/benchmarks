quote_extract: "# StockBench for Inspect This is a port of [StockBench](https://github.com/ChenYXxxx/stockbench)
  to [Inspect](https://inspect.aisi.org.uk/). StockBench tests whether LLM agents can trade stock … y`
  checks the port against recorded fingerprints of those original runs, so the check runs without installing
  the original. **The paper's baseline.** The buy-and-hold baseline comes out at 0.4% return, -15.2% max
  drawdown and Sortino 0.0155. That matches Table 2 of the paper. ## Results versus the paper Results
  from this port are in the first two tables. The paper's numbers are in the third. Each model ran 3 epochs
  on the full window, 2025-03-03 to 2025-06-30, and the first table is the mean of the 3 epochs, as the
  paper averages 3 runs. Every number in the first two tables was produced by `scripts/summari … ll sample.**
  Each epoch is one 83-day backtest of one model, and all runs use the same single window, so the results
  say nothing about other periods. Epochs of the same model land several points apart: the Qwen3 epochs
  range from -3.46% to +4.73%, and the gpt-oss epochs from -1.50% to -0.20%. The Qwen3 mean of +0.99%
  is smaller than the spread betw … uses temperature 0.7 for both models. A different quantization, context
  size or serving stack can change the replies and so the trades. - **Costs.** This port charges a 1 basis
  point commission on every order, as the released code does. The limitations section of the paper's second
  version says trading costs are not modeled. - **The window length differs by one day.** The paper's
  text says 82 trading days. This port uses the 83 days that have price data, which is the length that
  reproduces the paper's baseline Sortino. - **Compare against buy and hold f … s skill. - **The Sortino
  formula in the paper's text differs from the released code.** The text describes a root mean square
  of the negative returns. The released code, and this port, divide the mean daily return by the sample
  standard deviation of the negative daily returns. The baseline Sortino of 0.0155 in Table 2 reproduces
  only with the code's version. One reading of the text, with the average taken over the negative … gives
  0.0124 for the same baseline. ## Differences from the original code Each one fixes a bug or a look-ahead
  in the released code. 1. **Calendar.** The original treats Good Friday, Memorial Day and Juneteenth
  as trading days, so it simulates 86 days. The port uses the 83 days that have price data. The paper's
  baseline Sortino (0.0155) matches 83 days. With 86 it would be 0.0149. 2. **No news from … ision day.**
  When a stock has no stored news for the previous two days, the original's offline mode widens the window
  to 4 days back and 1 day ahead. That can show news from the decision day itself. This affects 62 stock-days.
  The original's older news cache also adds two same-day headlines for IBM on 2025-03-04. The port shows
  only news publishe … It is not scored, so the port leaves it out. ## Known issues kept from the original
  These are part of the published setup, so the port keeps them: - The fundamentals snapshots are not
  point-in-time. For 15 of the 20 stocks, the 52-week high or low shown on March 3 is a price from a later
  date, inside the test window for 14 of them. Use `-T fundamentals=false` to remove them. - The stored
  dividend yield is 100 times too large (for example 41.2 for Apple). - The decision prompt co … only.
  `tests/golden/upstream_parity.json` holds hashes and daily portfolio values from scripted test runs,
  and those values are computed from prices. The eval downloads its market data from the StockBench repository
  at a pinned commit, as described above. The StockBench README says the data comes from Polygon and Finnhub.
  This project does not license that data, so use it under the"

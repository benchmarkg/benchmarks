quote_extract: '4 Getting Started Challenges Archive zerospeech2021 zerospeech2020 zerospeech2019 zerospeech2017
  zerospeech2015 Sign In X Username*: Password*: forgot password No account ? Sign up Close Login tl;dr
  The objective of the Zero Resource Speech Challenge (ZRC) series is to enable researchers to build a
  spoken dialogue system directly from raw audio recordings (no text, no labels!) This is difficult, so
  ZRC breaks down the problem into more manageable subtasks, and provides metrics for cumulative progress
  It currently supports 4 subtasks: Task 1: Acoustic Unit Discovery Task 2: Spoken Term Discovery Task
  3: Discrete Resynthesis Task 4: Spoken Language Modeling The ZRC series is now open on a rolling basis.
  Here, you’ll find here step-by-step guides on how to submit your own contributions and appear on the
  leaderboard! You’ll also be able to download past results to do your own analysis and model compa …
  k 4: Spoken Language Modeling These are the textless counterparts of well-known tasks: (Task 1) phone
  recognition; (Task 2) word recognition (i.e., ASR); (Task 3) TTS; and (Task 4) Language Modeling. (Task
  5 is currently not supported.) The evaluation problem is to define metrics that enable model comparison
  and cumulative progress. In the ZRC series, we use zero-shot probe tasks that are inspired by human

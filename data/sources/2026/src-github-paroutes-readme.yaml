quote_extract: 'PaRoutes is a framework for benchmarking multi-step retrosynthesis methods, i.e. route
  predictions. It provides: * A curated reaction dataset for building one-step retrosynthesis models *
  Two sets of 10,000 routes * Two sets of stock molecules to use as stop-criterion for the search * Scripts
  to compute route quality and route diversity metrics ## Prerequisites Before you begin, ensure you have
  met the following requirements: * Linux, Windows or macOS platforms are supported - as long as the …
  l conda activate paroutes-env python data/download_data.py Now all the dependencies and datasets are
  setup. ## Usage ### Performing route predictions PaRoutes provide a list of targets and stock molecules
  in SMILES format for two sets **n1** and **n5**. For **n1** you find in the `data/` folder of the repository
  * `n1-targets.txt` - the target molecules * `n1-stock.txt` - the stock molecules For **n5 … route_quality.py
  --routes ~/output_routes.json --references data/n1-routes.json --output ~/route_analyses.csv to calculate
  the route quality metrics. It will print out how many of the targets were solved and the top-1, top-5
  and top-10 accuracies (by default). For further details have a look in the `data/README.md` file. To
  perform clustering on the same dataset, you can type python analysis/route_clusters. … int out the average
  number of clusters formed for each target. For further details have a look in the `data/README.md` file.
  ## Benchmark results ### Results published in the PaRoutes publication (Genheden et al. 2022) | Search
  method | Route set | Solved targets | Top-1 | Top-5 | Top-10 | Routes extracted | Number of clusters
  | |:------------ … | 9703 | 0.08 | 0.30 | 0.38 | 149 | 39 | | DFPN | set-n1 | 8475 | 0.19 | 0.33 | 0.33
  | 6 | 2 | | DFPN | set-n5 | 7382 | 0.08 | 0.14 | 0.14 | 6 | 2 | ### Results with the 2.0 version | Search
  method | Route set | Solved targets | Top-1 | Top-5 | Top-10 | Routes_extracted | Number of clusters
  | |:----------------|:------------|-----------------:|--------:|--------:|---------:|-------------------:|---------------------:|
  | Mcts | set-n1 | 9716 | 0.2372 | 0.5107 | 0.5414 | 306 | 109 | | Mcts | set-n5 | 9689 | 0.1237 | 0.3584
  | 0.4056 | 311 | 113 | | Retro* | set-n1 | 9728 | 0.2027 | 0.4516 | 0.4847 | 154 | 31 | | Retro* | set-n5
  | … .3897 | 138 | 26 | | DFPN | set-n1 | 7786 | 0.1705 | 0.2456 | 0.246 | 5 | 2 | | DFPN | set-n5 |
  6730 | 0.0753 | 0.1146 | 0.1151 | 5 | 2 | **Notes** - "Top-N" refers to the accuracy, i.e. the capability
  to recover the reference route among the top-N ranked routes - "Routes extracted" and "Number of clusters"
  are median over all targets ## Contributing We welcome contributions, in the form of issues or pull
  requests. If you have a question or want to report a bug, please submit an issue. To contribute with
  code to the project, follow these steps: 1. Fork this repo … of the PaRoutes logo. The contributors
  have limited time for support questions, but please do not hesitate to submit an issue (see above).

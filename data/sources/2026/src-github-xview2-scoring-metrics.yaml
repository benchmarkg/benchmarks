quote_extract: "# xview2 metrics # # the total score is calculated a weighted average of the localization
  f1 score (lf1) and the damage f1 score (df1) # score = .3 * lf1 + .7 * df1 # # the df1 is calculated
  by taking the harmonic mean of the 4 damage f1 scores (no damage, minor damage, major damage, and destroyed)
  # df1 = 4 / sum((f1+epsilon)**-1 for f1 in [no_damage_f1, minor_damage_f1, major_damage_f1, destroyed_f1]),
  where epsilon = 1e-6 # # Abbreviations used in this file: # l: localization # d: damage # p … h): directory
  of localization and damage predictions targ_dir (Path): directory of localization and damage targets
  img_id (str) : 5 digit string of image id test_hold (str) : either 'test' or 'hold'. Most likely 'test'
  unless you have access to holdout set \"\"\" assert isinstance(pred_dir, Path), f\"pred_dir should be
  of type Path, got {type(pred_dir)}\" assert pred_dir.is_dir(), f\"Directory '{pred_dir}' does not exist
  or is not a directory\" assert isinsta … sert img.dtype == np.uint8, f\"{path.name} is of wrong format
  {img.dtype} - should be np.uint8\" assert set(np.unique(img)) <= {0,1,2,3,4}, f\"values must ints 0-4,
  found {np.unique(img)}, path: {path}\" assert img.shape == (1024,1024), f\"{path} must be a 1024x1024
  image\" return img def load_images(self): return [self.load_and_validate_image(path) for path in self.paths]
  class RowPairCalculator: \"\"\" Contains all the information and … h (PathHandler): used to load the
  required prediction and target images \"\"\" lp,dp,lt,dt = ph.load_images() lp_b,lt_b,dt_b = map(cls.extract_buildings,
  (lp,lt,dt)) # convert all damage scores 1-4 to 1 dp = dp*lp_b # only give credit to damages where buildings
  are predicted dp, dt = dp[dt_b==1], dt[dt_b==1] # only score damage where there exist buildings in target
  damage lrow = cls.compute_tp_fn_fp(lp_b, lt_b, 1) drow = [] for i in range(1,5): drow += cls.compute_tp_fn_fp(dp,
  dt, i) return lrow, drow class F1Recorder: \"\"\" Records the precision and recall when calcula"

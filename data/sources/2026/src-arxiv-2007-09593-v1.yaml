  Revised MD17 Dataset For each of the 10 molecules in the MD17 dataset20, 21 (aspirin, benzene, ethanol,
  salicylic acid, malonaldehyde, toluene, naphthalene, uracil, paracetamol, and azobenzene), 100,000 structures
  were randomly selected from the available MD trajectory data. For each of these structures, a single-point
  force and energy evaluation was carried out at the DFT level. All calculations were performed in ORCA
  4.0.1, using the PBE functional and the def2-SVP basis set with the resolutionof-identity (RI) approximation
  for the Coulomb integrals.48–50 In order to have a minimal unsystematic error, the keyword VeryTightSCF

  **[taubench.com](https://taubench.com)**. | Modality | Description | Guide | |----------|-------------|-------|
  | **Text** | Standard text-based half-duplex evaluation | [Text: Run & Prepare] … ault user simulator
  and evaluation protocol for the track - No benchmark-side prompt, tool, orchestration, task-selection,
  or grading modifications - No access to hidden task goals, reference actions, evaluator state, or other
  benchmark data outside the standard agent interface - A model or system that was not trained specifically
  on τ-bench tasks, rewards, or evaluation data #### Text τ-bench A standard text submission evaluates
  a general-purpose LLM through the default τ-bench agent scaffold, with the standard tool set and prompts.
  Replacing or augmenting that benchmark-side scaffold with a planner, router, additional agent, custom
  tool, … or one of these providers: 1. Open a PR with your `submission.json` and contact us — we can
  run the evaluation 2. If you ran the evaluation yourself, include a link to your trajectory data in
  the PR description for verification ### New Provider (No Adapter Yet) If the provider you want to evaluate

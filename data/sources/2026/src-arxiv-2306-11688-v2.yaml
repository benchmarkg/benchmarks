  on an integrated platform with multiple data modalities with perfect and defect materials data is still
  lacking. This work introduces JARVIS-Leaderboard, an open-source and community-driven platform that
  facilitates benchmarking and enhances reproducibility. The platform allows users to set up benchmarks
  with custom tasks and enables contributions in the form of dataset, code, and meta-data submissions.
  We cover the following materials design categories: Artificial Intelligence (AI), Electronic Structure
  (ES), Force-fields (FF), Quantum Computation (QC) and Experiments (EXP). For AI, we cover several types
  of input data, including atomic structures, atomistic images, spectra, and text. For ES, we consider
  multiple ES approaches, software packages, pseudopotentials, materials, and properties, comparing results
  to experiment. For FF, we compare multiple approaches for material property predictions. For QC, we
  benchmark Hamiltonian simulations using various quantum algorithms and circuits. Finally, for experiments,

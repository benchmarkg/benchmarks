quote_extract: "ls) Python tools for participating in Neural Latents Benchmark '21. ## Overview Neural
  Latents Benchmark '21 (NLB'21) is a benchmark suite for unsupervised modeling of neural population activity.
  The suite includes four datasets spanning a variety of brain areas and experiments. The primary task
  in the benchmark is co-smoothing, or inference of firing rates of unseen neurons in the population.
  This repo contains code to facilitate participation in NLB'21: * `nlb_tools/` has code to load and preprocess
  our dataset files, format data for modeling, and locally evaluate results * `examples/tutorials/` contains
  tutorial notebooks demonstrating basic usage o … ay serve as helpful references on more extensive usage
  of `nlb_tools` * `data/` contains the ground-truth evaluation data for the test split, made public in
  January 2026 with the end of the EvalAI challenge ## Installation The package can be installed with
  the following command: ``` pip install nlb-tools ``` However, to run the tutorial notebooks locally
  or make any modifications to"

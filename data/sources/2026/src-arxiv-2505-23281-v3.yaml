  which are crucial for many mathematical tasks. To address this, we introduce MATHARENA, a new benchmark
  based on the following key insight: recurring math competitions provide a stream of high-quality, challenging
  problems that can be used for real-time evaluation of LLMs. By evaluating models as soon as new problems
  are released, we effectively eliminate the risk of contamination. Using this framework, we find strong
  signs of c … r proof-writing capabilities. On IMO 2025, top models achieve slightly less than 40%, demonstrating
  both notable progress and significant room for improvement. So far, we have evaluated over 50 models
  across seven competitions, totaling 162 problems. As an evolving benchmark, MATHARENA will continue
  to track the progress of LLMs on newly released competitions, ensuring rigorous and up-to-date evaluation
  of … leakage (Section 3.2). Depending on the type of problem, either final-answer or proof-based, we
  use different methods for parsing and evaluation (Section 3.3). For final-answer problems, we use an
  automated rule-based parser to extract answers. For proof-based problems, human graders evaluate the
  model outputs. Finally, we compute leaderboard rankings and perform statistical post-processing to ensure
  accuracy and reliability (Section 3.4). 3.1 Competition Selection an … onsistencies, or formatting issues.
  4 3.2 Model Selection and Solution Generation Model selection MATHARENA is continuously updated with
  newly released models. To avoid an overly cluttered leaderboard, we only select models that meet at
  least one of the following criteria: (i) the model competes for the top score in a given competition
  (e.g., GPT-5, GEMINI-2.5-PRO, GROK 4), (ii) the model competes for the top-performing open-wei … ion
  (e.g., DEEPSEEK-R1, QWEN3), or (iii) the model competes for a Pareto-optimal point on the cost-performance
  tradeoff curve (e.g., GROK 4 FAST, GPT-OSS-20B). We exclude non-reasoning models, as they consistently
  underperform reasoning models and do not satisfy any of the selection criteria. Solution generation
  Each model is evaluated once per competition using the hyperparameters recommended by the model providers,
  without further tuning. This avoids overfitting and reduces the risk of information leakage. For answer-based
  competitions, we prompt the models to output their answer inside of a boxed environment, while for proof-based
  competitions, we prompt the models to output the entire proof. In App. D, we provide the prompts used
  for each competition. To account for stochasticity, each model generates four responses per question,
  and we report the average score across these runs. Models are evaluated close to the competition date,
  minimizing contamination risk. If a model was released after the competition date, this is clearly indicated
  on the leaderboard. Examples of model outputs and questions are shown in App. E. Project Euler tools
  For Project Euler, we allow models to use tools to execute code, as this is o … at converts arbitrary
  LATEX strings into structured sympy expressions, capable of handling complex mathematical objects such
  as fractions, lists, and radicals. These expressions are then checked for equivalence with the ground
  truth answer using sympy. Since model outputs often vary in formatting, parser robustness is crucial.
  We implement two measures to ensure correctness. First, we developed a GUI to supp … g points for partial
  progress. Next, graders receive anonymized solutions from the selected models and grade them according
  to the previously developed scheme. Two independent judges grade each solution, providing not only a
  final score but also a justification for their decision. We refer readers to [28] for further details
  of the procedure. 3.4 Leaderboard and Post-Processing Once model outputs have been evaluated, we perform

quote_extract: olutions (He et al., 2026) as our training set. We use Qwen3-4B and Qwen3-8B with
  thinking mode disabled (Yang et al., 2025) as our base LLMs. For all methods, we evaluate on five
  mathematical reasoning benchmarks, AIME 2024, AIME 2025, AIME 2026, HMMT February 2025, and HMMT
  November 2025 (Balunovic et al., 2026, Dekoninck et al., 2026). Appendix E gives further details.
  Baselines and evaluation. We compare against the initial Qwen model, vanilla supervised finetuning
  (SFT), GRPO (Shao et al., 2024), OPSD (Zhao et al., 2026), SAGE (Liao et al., 2026), BREAD (Zhang
  et al., 2026d), and LUFFY (Yan et al., 2026). During evaluation, we draw 12 responses per
  question. pass@12 measures whether a question has at least one correct response, while avg@12
  measures the fraction of correct responses. We use pass@12 as the primary metric. Model Qwen3-4B

quote_extract: "ews](#News) 2. [Dataset](#Dataset) 3. [Benchmark](#Benchmark) 4. [License](#license) 5.
  [Citation](#citation) ## News - [2026/08/06] **[Major Updates]** **Bench2Drive 0.0.4 is released**.
  The key motivation of this update is **data distribution**: - **Strictly uniform training data.** The
  new Think2Drive-collected training set (44 scenarios × 25 routes = 1,100 routes) is strictly uniform
  over scenarios, unlike the previous Base set whose scenario distribution is uneven. - **New modality:
  3D occupancy (3D occ).** - **Separate validation set** of 220 routes (44 scenarios × 5) for more reliable
  evaluation. - Various bug fixes across the dataset and [Bench2DriveZoo](https://github.com/Thinklab-SJTU/Bench2DriveZoo).
  See details [here](./docs/v004_update.md). - [2026/05/21] Check [Bench2Drive-Robust](https://github.com/Thinklab-SJTU/Bench2Drive-Robust),
  which analyze models' performance under real deployment issues: **camera-stream failures, ego-state
  estimation errors, and compute-control latency**. - [2026/03/27] Check [Bench2Drive-Speed](https://github.com/Thinklab-SJTU/Bench2Drive-Speed),
  which estimates a new & useful functionality of AD systems - **speed customization**! - [2025/10/13]
  Check [Bench2Drive-VL](https://github.com/Thinklab-SJTU/Bench2Drive-VL), which enables closed-loop QA
  of VLM4AD. It also provides a efficient communication interface between VLM environment (python 3.9
  or higher) and CARLA (only ava … le for python 3.7 and 3.8). **Users encount Python Version error should
  consider the protocol as well**. - [2025/02/18] In our latest work [DriveTransformer (ICLR25)](https://openreview.net/forum?id=M42KR4W9P5),
  **a tiny validation set [Dev10](./leaderboard/data/drivetransformer_bench2drive_dev10.xml) is proposed
  for quick development of models.** The 10 clips are carefully selected from the official 220 routes,
  to be both difficult and representative with low variance. It is suggested to be used for ablation study
  to avoid overfitting the whole bench2drive220 routes. - [2025/02/05] As meticulously described in [CARLA_GARGE](https://github.com/autonomousvision/carla_garage/blob/leaderb
  … g as well. - [2024/10/14] As kindly pointed out in an [issue](https://github.com/Thinklab-SJTU/Bench2Drive/issues/112),
  typos were discovered in the ability calculation. We have corrected the typos and updated the multi-ability
  results. This update will **not affect driving score and success rate**. - [2024/10/14] As kindly pointed
  out in an [issue](https://github.com/Thinklab-SJTU/Bench2DriveZoo/issues/46), a bug wa … results. We
  do not anticipate any major influence caused by this bug. Users may fix the bug according to their needs.
  - [2024/09/26] Bench2Drive is accepted at NeurIPS 2024 Datasets and Benchmarks Track. - [2024/08/27]
  We update the latest results under the new protocols with **two new metrics and fixed bugs**. - [2024/08/19]
  **[Major Updates]** To better assess driving performance, we add two additional metrics: Driving Efficiency
  and Driving Smoothness. Consequently, we remove the penalty for minimum speed in calculating the Drive
  Score and extend the TickRunTime from 2000 to 4000 to allow for a more lenient driving evaluation. We
  are currently reassessing all baselines. - [2024/08/10] We update th … n their bash script to restart
  the evaluation infinitely until finishing the evaluation since CARLA is easy to crash. - [2024/07/10]
  We further clean and add more clips in the Full set (13638 clips). Since HuggingFace only allows up
  to 10000 files per repo, we use two repos to store the Full set. As suggested in this … ian are empty
  in the HuggingFace version. We have fixed that. Please check your data to make sure they are not empty.
  - [2024/06/05] Bench2Drive realases the Full dataset (10000 clips), evaluation tools, baseline code,
  and benchmark results. - [2024/04/27] Bench2Drive releases the Mini (10 clips) and Base (1000 clips)
  split of the official training data. ## Dataset - With the 0.0.4 update, we released a new Think2Drive-collected

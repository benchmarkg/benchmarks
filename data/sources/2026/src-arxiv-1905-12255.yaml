quote_extract: 'ortcomings of current metrics for the Room-to-Room dataset (Anderson et al.,2018b) and
  propose a new metric, Coverage weighted by Length Score (CLS). We also show that the existing paths
  in the dataset are not ideal for evaluating instruction following because they are direct-to-goal shortest
  paths. We join existing short paths to form more challenging extended paths to create a new data set,
  Room-for-Room (R4R). Using R4R and CLS, we show that agents that receive rewards for instruction fidelity
  outperform agents that focus on goal completion. Comments: Accep'

  from the SVG ﬁles to train our data extraction models. 3.2 Data Annotation We have two main annotations
  procedures: (i) collect human-authored QA pairs using Amazon Mechanical Turk (AMT) and (ii) generate
  QA pairs from the Statista human-written summaries. • Human-authored QA annotation To create human-authored
  QA pairs, we designed an AMT task (see A.1 for details) in which we asked the crowdworkers to focus
  on two types of questions for each chart image: compositional and visual questions. Compositional questions
  contain at least two mathematical/logical operations like sum, difference and average, while visual
  questions refer to the visual attributes such as color, height, and length of graphical marks (e.g.,
  bars) in the chart. We focus on these two types of questions because people tend to ask them commonly

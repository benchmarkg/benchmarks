quote_extract: '15 Dear ILSVRC community, This is a follow up to the announcement on May 19, 2015 with
  some more details and the status of the test server. During the period of November 28th, 2014 to May
  13th, 2015, there were at least 30 accounts used by a team from Baidu to submit to the test server at
  least 200 times, far exceeding the specified limit of two submissions per week. This includes short
  periods of very high usage, for example with more than 40 submissions over 5 days from March 15th, 2015
  to March 19th, 2015. Figure A below shows submissions from ImageNet account … ssion from Baidu that
  builds on top of these results. This includes submissions to all of the ILSVRC challenge tasks (classification,
  localization, and detection) as parts of the datasets are shared. We therefore requested that they refrain
  from submitting to the evaluation server or the challenge for the next 12 months. We are in communication
  with the team involved in this incident. They have asked us to forward the message included further
  below to the community. Note that in order to stay neutral and independent, we have not and cannot work
  with any team to interpret or review results. The test server is now back online. We look forward to
  continued progress in visual recognition! The ILSVRC organizers Message from the team in question: Dear
  ILSVRC community, Recently the ILSVRC organizers contacted the Heterogeneous'

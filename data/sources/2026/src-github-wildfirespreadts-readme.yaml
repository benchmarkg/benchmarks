quote_extract: "# WildfireSpreadTS: A dataset of multi-modal time series for wildfire spread prediction
  This repository contains the code for recreating the experiments in the WildfireSpreadTS paper. - [Link
  to main paper](https://openreview.net/pdf?id=RgdGkPRQ03) - [Link to supplementary material](https://openreview.net/attachment?id=RgdGkPRQ03&name=supplementary_material)
  ## Updates - After publishing the paper, we discovered a bug in the dataset class. Based on initial
  experiments, the corrected dataset class leads to slightly higher performance, but the trends in the
  results are basically the same as those reported in the paper. The bug was fixed in commit `ab3c8f35c5ec8c52c306a4488eaeb71a5a13d0de`,
  in case you want to roll-back the change to compare with the results in the paper. - **Feb 2026:** An
  observant researcher, who kindly reached out to me, pointed out that when dealing with angle features,
  the current code only transforms the features via sin, but should use both sin and cos, to not lose
  information. This happens [here](https://github.com/SebastianGer/WildfireSpreadTS/blob/main/src/dataloader/FireSpreadDataset.py#L339).
  I'm currently too occupied … ou're working with these features, be aware of this issue. ## Setup the
  environment ``` pip3 install -r requirements.txt ``` ## Preparing the dataset The dataset is freely
  available at [https://doi.org/10.5281/zenodo.8006177](https://doi.org/10.5281/zenodo.8006177) under
  CC-BY-4.0. For training, you will need to convert them to HDF5 … experiments To use the dataset outside
  of the baseline experiments, you can use the Lightning Datamodule at `src/dataloader/FireSpreadDataModule.py`
  which directly provides dataset loaders for train/val/test set. Alternatively, you can use the PyTorch
  dataset at `src/dataloader/FireSpreadDataset.py`. ## Citation ``` @inproceedings{ gerard2023wildfirespreadts,"

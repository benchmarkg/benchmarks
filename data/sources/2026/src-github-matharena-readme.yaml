quote_extract: "MathArena ## 👋 Overview MathArena (NeurIPS D&B '25) is a platform for evaluation of LLMs
  on latest math competitions and olympiads. It is hosted on [matharena.ai](https://matharena.ai/). This
  repository conta … ts of the project, such as adding new competitions, please refer to the specific
  README files in the `readmes/` folder. You can find logs from our evaluation containing full reasoning
  traces (if available) and solutions produced by the models on our HuggingFace page: [https://huggingface.co/MathArena](https://huggingface.co/MathArena).
  --- ## 🚀 Installation MathArena uses [UV](https: … cripts/build_harness_arxivlean_image.sh ``` Execute
  the following command to evaluate a model on a competition: ```bash uv run python scripts/run.py --comp
  path/to/competition --models path/to/model1 ``` - `path/to/competition`: Relative path from the `configs/competition`
  folder to the competition config file (exclud … ting `data/euler/euler/answers.csv` with the correct
  answers. Putnam, IMC, IMO 2025, USAMO 2025, Miklos Schweitzer 2025 were graded using human verification.
  They can therefore not be graded automatically. For these competitions, if you want to run them, you
  will have to adjust their config similar to the USAMO 2026 compet … I models can be set by appending
  `--[low/medium/high]` to the model name, e.g., `o3-mini--high`. - `api`: API provider. The API key should
  be defined as an environment variable when using the specified API. The supported options with their
  corresponding API keys are: - **xai**: `XAI_API_KEY` - **openai**: `OPENAI_API_KEY` -"

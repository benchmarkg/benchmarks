  000 images with coarse annotations · 50 different cities Dataset Overview The Cityscapes Dataset Rich
  metadata: preceding and trailing video frames · stereo · GPS · vehicle odometry Dataset Overview The
  Cit … order of magnitude larger than similar previous attempts. Details on annotated classes and examples
  of our annotations are available at this webpage. The Cityscapes Dataset is intended for assessing the
  performance of vision algorithms for major tasks of semantic urban scene understanding: pixel-level,
  instance-level, and panoptic semantic labeling; supporting research that aims to exploit large volumes
  of (weakly) annotated data, e.g. for training deep neural networks. Latest News Cityscapes 3D Benchmark
  OnlineOctober 17, 2020 Cityscapes 3D is an extension of the original Cityscapes with 3D bounding box
  annotations for all types of vehicles as well as a benchmark for the 3D detection task. For more details
  please refer to our paper, presented at the CVPR 2020 Workshop on Scalability in Autonomous Driving.
  Today, we extended our benchmark and evaluation server to include the 3D vehicle detection task. In
  order to train and evaluate your method, checkout our toolbox on Github, which can be installed using

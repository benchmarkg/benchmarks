quote_extract: 'not updating on records. Our team is investigating the problem. We apologize for the inconvenience.
  Published November 19, 2019 | Version v6 Dataset Open Official Datasets for LHC Olympics 2020 Anomaly
  Detection Challenge Autho … e are the official datasets for the LHC Olympics 2020 Anomaly Detection
  Challenge. Each "black box" contains 1M events meant to be representative of actual LHC data. These
  events may include signal(s) and the challenge consists of finding these signals using the method of
  your choice. We have uploaded a total of THREE black boxes to be used for the challenge. In addition,
  we include a background sample of 1M events meant to aid in the challenge. The background sample consists
  of QCD dijet events simulated using Pythia8 and Delphes 3.4.1. Be warned that both the physics and the
  detector modeling for this simulation may not exactly reflect the "data" in the black boxes. For both
  background and black box data, events are selected using a sing … k illustrating how to read and process
  the events, see the official LHC Olympics 2020 webpage here. UPDATE: November 23, 2020 Now that the
  challenge is over, we have uploaded the solutions to Black Boxes 1 and 3. They are simple ASCII files
  (events_LHCO2020_BlackBox1.masterkey and events_LHCO2020_BlackBox3.masterkey) where each line is the
  truth label -- 0 for background and 1 (and 2 in the case of BB3) for signal -- of each event in the

quote_extract: 'ime agent-leaderboard communication 3.5 Override the destroy method 4. Training and testing
  your agent 4.1 Predefined training and testing routes 4.2 Training database creation tools 5. Discord
  server 1. System setup 1.1 Download the CARLA leaderboard package Download the packaged CARLA leaderboard
  release. Unzip the package into … 37 python=3.7 conda activate py37 cd ${CARLA_ROOT} # Change ${CARLA_ROOT}
  for your CARLA root folder pip3 install -r PythonAPI/carla/requirements.txt The CARLA Leaderboard release
  is based on version 0.9.14. It also has some features of the 0.9.15 release such as the new Large Maps
  feature. Therefore, please refer to that documentation when using the API. 1.2 Get the Leaderboard and
  Scenario Runner Download the Leaderboard repository leaderboard-2.1 branch. git clone -b leaderboard-2.1
  --single-branch https://github.com/carla-simulator/leaderboard.git In the following commands, change
  the ${LEADERBOARD_R … modify, add, and remove routes for training and validation purposes. The Leaderboard
  ships with a set of routes for debug, training, and validation. The routes used for the online evaluation
  are secret. This file also includes the scenarios that will be tested in the simulation, each route
  has its own set of scenarios. A scenario is defined as a traffic situation. Agents will have to overcome
  these scenarios in order to pass the test. Participants have access to a set of traffic scenarios that
  work on the publicly available towns. There are multiple types of scenarios that are instantiated using
  different parameters. Here is a list of the available scenarios. REPETITIONS (int) — Number of times
  each route is repeated for statistical purposes. TEAM_AGENT (Python module) — Path to the agent’s Python
  module. The steps to create an agent are explained in the next step. Other relevant parameter … lifier,
  named SENSORS_QUALIFIER and MAP_QUALIFIER These environment variables are passed to ${LEADERBOARD_ROOT}/leaderboard/leaderboard_evaluator.py,
  which serves as the entry point to perform the simulation. Take a look at leaderboard_evaluator.py to
  find out more details on how your agent will be executed and evaluated. 3. Creating your own Autonomous
  A … point. You can use these routes for training and verifying the performance of your agent. Routes
  can be found in the folder {LEADERBOARD_ROOT}/data: routes_training.xml: 90 routes intended to be used
  as training data (780.6 Km). routes_validation.xml: 20 routes intended to be used as validation data
  (247.6 Km). routes_testing.xml: 20 routes intended to be used as verification data (205.9 Km). 4.2 Training
  database creation tools With the release of the Leaderboard 2.0, AV stacks will have to deal with a
  new set of scenarios, which are designed to be more challenging than those available in the Leaderboard
  1.0. Some examples of the new situations present in the Leaderboard are route obstacles, merging and
  crossing actor flows as well as dealing with giving way to emergency vehicles. However, these new scenarios
  are too challenging for either the TrafficManager or the PythonAPI agents, so users can no longer use
  any of CARLA’s own autonomous stacks to extract the training data. As such, we are now providing a new
  set of CARLA logs'

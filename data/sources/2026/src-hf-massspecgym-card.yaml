quote_extract: 'Fingerprinter dataset = MassSpecDataset( spec_transform=SpecTokenizer(n_peaks=60), mol_transform=MolFingerprinter(),
  ) ``` ## MassSpecGym v1.5 update MassSpecGym v1.5 addresses several evaluation pitfalls identified in
  the "MassSpecGym in the Wild" audit. It adds six files to this data repository, and corrects the description
  of one existing file: - `data/MassSpecGym1.5.tsv` — main dataset file. Schema is identical to v1 and
  content is nearly identical, except that the `smiles` column is re-standardized with `rdkit.Chem.MolToSmiles(canonical=True)`
  instead of the PubChem-standardized form used in v1 … above for tools that prefer MGF over TSV. - `data/molecules/MassSpecGym1.5_retrieval_candidates_mass.json`
  — mass-filtered retrieval candidate pool. Same candidates as in v1 but with SMILES standardized using
  RDKit. - `data/molecules/MassSpecGym1.5_retrieval_candidates_formula.json` — formula-filtered retrieval
  candidate pool. Same candidates as in v1 but with SMILES standardized using RDKit. - `data/molecules/MassSpecGym1.5_pretraining_molecules_2.5M_tani070.txt`
  — approximately 2.5 million small-molecule SMILES intended as pretraining data, aggregated from DSSTox,
  HMDB, COCONUT, and MOSES. Every molecule has Tanimoto similarity < 0.7 to all MassSpecGym test molecules
  (4096-bit ECFP4). - … _4M.tsv` — unchanged file, corrected description. Despite its name and the original
  MassSpecGym paper wording (MCES distance < 2 from the test fold), exhaustive re-verification shows this
  set is disjoint more strictly at MCES ≤ 2 from both the val and test folds. ## Citation If you use MassSpecGym
  in your work, please cite the original NeurIPS paper: ```bibtex @inp'

quote_extract: "# CadEval: Text-to-CAD Evaluation Framework This repository contains a framework for evaluating
  the capability of Large Language Models (LLMs) to generate 3D models (specifically OpenSCAD code or
  direct STL files) from textual descriptions. --- ## Goal & Scope - **Goal**: Assess the reliability
  and geometric accuracy of various LLMs in producing single, simple mechanical parts based on text prompts,
  including analysis based on task complexity, execution time, and estimated cost. - **Scope**: - Focus
  on single-part generation. - Input is primarily text descriptions defined in task files. - Evaluation
  involves automated generation, rendering (where applicable), geometric checks against reference models,
  and visualization of results via a dashboard. - Supports standard LLMs (via API like OpenAI, Anthropic,
  Google) and specialized models like Zoo ML's Text-to-CAD (via CLI). --- ## Workflow Overview The evaluation
  process follows these steps: 1. **Configuration (`config.yaml`)**: Defines models to test, API keys
  (sourced from `.env`), prompt templates, directories, geome … umber of replicates per task). 2. **Task
  Definition (`tasks/*.yaml`)**: Each task YAML file specifies: * `task_id`: Unique identifier. * `description`:
  The text prompt for the LLM. * `reference_stl`: Path to the corresponding ground truth STL model in
  `reference/`. * `manual_operations` (Optional): An integer indicating the complexity of the task, used
  for complexity analysis. * `requirements` (Optional): Can include `bounding_box` or `topology_requirements`.
  3 … up 1. **Clone the Repository:** ```bash git clone cd CadEval ``` 2. **Create Environment using Conda:**
  ```bash conda env create -f environment.yml conda activate cadeval ``` 3. **Install OpenSCAD:** Download
  and install OpenSCAD (version 2021.01 or later recommended) from [openscad.org](https://openscad.org/).
  Ensure it's added to your system's PATH or update the `openscad.executable_path` in `config.yaml` accordingly.
  4. **Install ZooML CLI (Optional):** If eval … ivate cadeval ``` 2. **Run Evaluation:** Execute the
  main orchestration script from the project root directory. * **Run all tasks, models, and the 'default'
  prompt defined in `config.yaml`:** ```bash python scripts/run_evaluation.py ``` * **Specify tasks, models,
  prompts, or run ID:** ```bash # Run only specific tasks python scripts/run_evaluation.py --tasks task_id_1
  task_id_2 # Run only specific models (names must match config … scripts/process_results.py`. --- ##
  Geometry Checks Performed The `scripts/geometry_check.py` script performs the following evaluations
  on successfully generated/rendered STL files: * **Watertight:** Checks if the mesh is manifold using
  Open3D. * **Single Component:** Verifies the mesh consists of a single connected component (or the number
  specified in task requirements). * **Bounding Box Accuracy:** Compares the dimensions of the generated
  model's aligned bounding box (using ICP alignment) to the reference model's bounding box within a tolerance
  (`geometry_check.bounding_box_tolerance_mm`). * **Volume Accuracy:** Compares the volume of the generated
  model to the reference model's volume within a percentage threshold (`geometry_check.volume_threshold_percent`).
  * **Geometric Similarity (Chamfer Distance):** Calculates the Chamfer distance between generated and
  reference point clouds after ICP alignment (`geometry_check.chamfer_threshold_mm`). Lower is better.
  * **Hausdorff Distance (95th & 99th Percentile):** Calculates percentile Hausdorff distances after alignment
  (`geometry_check.hausdorff_threshold_mm` applies to the 95p). * **ICP Fitness:** Reports the alignment
  quality score from the Iterative Closest Point algorithm. --- ## Time & Cost Tracking In additio … duration
  (`generation_duration_seconds`) and the pricing (`cost_per_minute`, `free_tier_seconds`) defined in
  `config.yaml`. A configurable free tier duration is subtracted before calculating cost. * The dashboard
  displays `Average Estimated Cost` per successful generation/render cycle. --- ## Current Limitations
  While this framework provides valuable insights, it's important to be aware of its current limitations:
  * **Limited Task Coverage:** The current evaluation suite consists of 25 tasks. While designed to cover
  a range of simple operations, this number is insufficient to represent the full spectrum of CAD modeling
  challenges. The statistical power may be limited for detecting subtle performance differences, although
  it is sufficient to show larger differences. * **Potential False Negatives (~<5%):** * **Alignment Failures:**
  The Iterative Closest Point (ICP) alignment step, which precedes Chamfer and Hausdorff distance calculations,
  can occasionally fail even for visually similar models. This leads to inaccurate distance metrics and
  subsequent check failures. * **Metric Sensitivity:** Sometimes, distance metrics (like Hausdorff) can
  be overly sensitive to minor outliers or mesh artifacts, resulting in a failed check even if the core
  geometry is correct. * **Potential False Positives:** The current checks might not reliably detect the
  absence of small features like minor fillets or chamfers if their omission doesn't significantly impact
  the overall distance metrics or bounding box. These limitations highlight areas for future refinement
  in both the task suite and the checking methodolog … ct ability of models (like Zoo ML) to generate
  an STL file that closely matches a reference STL, potentially using different metrics or comparison
  techniques. * **Optimize & Track Reasoning Tokens:** Initial tests suggest Anthropic's `thinking.budget_tokens`
  significantly impacts performance (e.g., 2500 might be better than 10000), requiring further optimization.
  Additionally, incorporate tracking for reasoning/thinking tokens used by Anthropic, OpenAI (o-series),
  and potentially Google"

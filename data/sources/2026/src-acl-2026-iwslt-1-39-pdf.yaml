  1: A ”traditional” speech-to-text translation track focusing on 10 typologically diverse language pairs.
  • Track 2: A data track, inviting participants to provide open-sourced speech translation datasets for
  under-resourced languages. This year’s focus was on exp … for the African and Celtic Speech-to-Speech
  Shared Task. We encourage interested participants to also consider participating in that task as well.

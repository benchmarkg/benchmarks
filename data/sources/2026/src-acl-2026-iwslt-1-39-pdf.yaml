quote_extract: 'Spoken Language Translation (IWSLT) stands as the leading annual scientific conference
  dedicated to advancing all aspects of spoken language translation (SLT). Operating under the auspices
  of the Special Interest Group on Spoken Language Translation (SIGSLT), the conference receives support
  from three prestigious organizations: the Association for Computational Linguistics (ACL), the International
  Speech Communication Association (ISCA), and the European Language Resources Association (ELRA). Maintaining
  its 23-year tradition, the 2026 conference was preceded by a comprehensive evaluation campaign designed
  to address critical scientific challenges in SLT. This paper presents the outcomes of the 2026 IWSLT
  Evaluation Campaign, which comprised ten distinct shared tasks organized into five primary research
  areas: • Speech-to-Text Translation – Offline track, with focus on unconstrained speech-to-text translation
  of audio from a variety of diverse domains in mostly highresource languages in two tracks (languageaware
  and language-agnostic). – Low-resource SLT, focusing on the translation of recorded speech from a variety
  of domains in low-resource and generally under-served languages, covering 10 language pairs. It also
  included a data track, inviting participants to submit newly collected speech translation datasets of
  underresourced language pairs. • Customized ST – … ession, with focus on speechto-text translation of
  recorded scientific presentations, TV series, and business news from English to German and Chinese,
  achieved by reducing the size of a large multilingual speech-to-text foundation model. – Subtitling
  track, with focus on speechto-subtitle translation of audio-visual documents from English to five languages
  (Arabic, German, Chinese, Japanese, a … interviews from English to German, Italian and Chinese, and
  from Czech to English. • Speech Generation – Indic S2S track focuses on speech-tospeech translation
  between English and three Indic languages (Hindi, Marathi, Punjabi) in both directions. – African/Celtic
  S2S track focuses on speech-to-speech translation from three under-resourced languages (Hausa, Igbo,
  Yoru`ba´) to English (targets being both text and speech for two tracks). – Cross-Lingual Voice Cloning
  track, which requires systems to synthesize speech in a target language while preserving the voice characteristics
  of a speaker from source language audio. Unlike traditional speech translation tasks, the cross-lingual
  voice cloning task focuses on transferring voice identity across languages while maintaining naturalness
  and intelligibility. • Instruction-following Speech Processing task It aims to test general-purpose
  multimodal models (known as multimodal LLMs or audioLLMs) for the speech modality. Covers the downstream
  tasks of Speech Recognition, Translation, Question Answering, Summarization, Audio Chaptering, and a
  surprise task, with focus on Scientific talk audios from English to German, Italian, and Chinese. •
  Speech Translation Metrics task, focusing on Quality Estimation for speech translation, a reference-free
  evaluation of speech translation quality. Participants assess the quality of translations produced in
  other IWSLT shared tasks, and system outputs will be evaluated based on their correlation with hum …
  s, which in 2025 already featured TV series, scientific presentations, business news, and dedicated
  accented speech data, was further expanded in this edition. By incorporating two brand-new scenarios,
  call center interactions and YouTube videos, the task significantly broadened the spectrum of communicative
  situations and acoustic conditions, such as overlapping speakers and background noise, that sys … es
  from ITV Studios4 – This subset comprises three distinct recordings of roughly 45 minutes each, capturing
  multi-party interactions across diverse scenarios. Deploying systems on this data requires managing
  complex phenomena such as overlapping speech, heterogeneous accents, and ambient noise. • Scientific
  Presentations – This dataset includes 21 recordings of oral presentations, with an average length of
  approximately 6 minutes per recording, provid … ons and inquiries regarding goods or services across
  multiple commercial sectors. • YouTube videos from YODAS5 (YouTubeOriented Dataset for Audio and Speech)
  – Sourced from large-scale YouTube collections, this dataset includes five English audio files with
  durations spanning between 10 and 30 minutes (amounting to approximately 1.5 hours in total). High-quality
  reference translations for German, Japanese, and Chinese were professionally curated by AppTek6. • Business
  News from Asharq Business with Bloomberg7 – Representing the financial and economics domain, this dataset
  consists of a single broadcast recording … substantial phonetic challenge by featuring 33 distinct international
  English accents, combined with the inherent difficulties of highly spontaneous speech. • Synthetic TTS

quote_extract: 'External resources on the "List of external datasets and models allowed" can be used (cf.
  external data resource section). … The normal/anomaly decision result for each test clip is used to
  calculate the precision, recall, and F1 scores, which will also be published when the challenge results
  are open. … The AUC for each machine type, section, and domain (source/target) and the pAUC for each
  machine type and section are defined as … In our metric, the pAUC is calculated as the AUC over a low
  false-positive-rate (FPR) range \([0, p]\). The reason for the additional use of the pAUC is based on
  practical requirements. If an ASD system frequently gives false alarms, we cannot trust it. Therefore,
  it is especially important to increase the true-positive-rate under low FPR conditions. In this task,
  we will use \(p=0.1\). … The official score \(\Omega\) for each submitted system is given by the harmonic
  mean of the AUC and pAUC scores over all the machine types, sections, and domains as follows: … a threshold
  value does not need to be determined to calculate AUC, pAUC, or the official score … The final ranking
  will be decided by sorting based on the official score \(\Omega\). … We are planning to provide ground
  truth labels for the evaluation dataset after the challenge has finished.'

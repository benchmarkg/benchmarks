  models within medical records contexts. MedAgentBench encompasses 100 patient-specific
  clinically-derived tasks from 10 categories written by human physicians, realistic profiles of 100
  patients with over 700,000 data elements, a FHIR-compliant inter … presents an unsaturated
  agent-oriented benchmark that current state-of-the-art LLMs exhibit some ability to succeed at.

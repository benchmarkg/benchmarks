quote_extract: '$(function(){populateHomePage()}) News We are pleased to announce the LVIS 2021 Challenge
  and Workshop to be held at ICCV. Please note that there will not be a COCO 2021 Challenge, instead,
  we encourage people to participate in the LVIS 2021 Challenge. We have partnered with the team behind
  the open-source tool FiftyOne to make it easier to download, visualize, and evaluate COCO FiftyOne is
  an open-source tool facilitating visualization and access to COCO data resources and serves as an evaluation
  tool for model analysis on COCO. What is COCO? COCO is a large-scale object detection, segmentation,
  and captioning dataset. COCO has several features: Object segmentation Recognition in context Superpixel
  stuff segmentation 330K images (>200K labeled) 1.5 million object instances 80 object categories 91
  stuff categories 5 captions per image 250,000 people with keypoints Collaborators Sponsors'

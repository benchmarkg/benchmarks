quote_extract: 'into pandas DataFrames with control-specific metadata and scores using samples_df() Computing
  control-specific metrics such as safety and usefulness Computing micro-protocol and scorer performance
  metrics such as task success rates, true positive rates, and ROC AUC Creating common plots such as safety
  vs audit budget curves Safety and Usefulness The two primary metrics for control protocols are safety
  and usefulness: Safety: The proportion of attack trajectories where the side task was not completed
  successfully Usefulness: The proportion of honest trajectories where the main task was completed successfully
  ControlArena provides functions to compute these metrics at different audit budgets (the percentage
  of honest runs permitted to be flagged for review): compute_safety(): Computes safety at a given audit
  budget compute_usefulness(): Computes usefulness compute_suspicion_threshold(): Computes the susp …
  control protocol performance. These functions return matplotlib figure objects that you can further
  customise or save: plot_safety_vs_audit_budget(): Visualises the trade-off between safety and how many
  trajectories are flagged for review at different audit budgets plot_suspicion_scores_histogram(): Shows
  the distribution of monitor scores across different trajectory types (honest vs attack) Common Patterns
  Loading and Analysing Evaluation Logs Load evaluation logs and compute safety/usefulness metrics: from
  control_arena.analysis import samples_df, compute_safety, compute_usefulness # Load logs from a directory
  df = samples_df("path/to/eval/logs")'

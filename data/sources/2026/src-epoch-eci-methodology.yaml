  ECIAcknowledgements Methodology Methodology The technical foundation for the ECI comes from Item
  Response Theory (IRT), a statistical framework originally developed for educational testing. IRT
  enables comparisons between students, even w … full set of observed scores. We do not assume any
  relationship between capability and time or compute inside the model. We fit the model via
  non-linear least-squares estimation, using a ridge regularization penalty to discourage
  overfitting. The scale of the resultant values is arbitrary; we currently rescale so that Claude
  3.5 Sonnet is fixed at 130, and GPT-5 is fixed at 150, in order to allow for consistent scoring
  over recent models in a way that balances communicating our uncertainty with providing detailed
  information. We report 90% bootstrap confidence intervals for the ECI results. These are
  constructed by holding the set of models fixed, and then sampling with replacement within each
  model’s observ … sults (keeping the total number of observations per model fixed). We then refit
  the entire model on the resampled data, repeated for 500 samples. Each refit is rescaled in the
  same way as the central estimates, with Claude 3.5 Sonnet at 130 and GPT-5 at 150. Overv

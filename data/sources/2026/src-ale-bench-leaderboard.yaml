quote_extract: "is page displays the leaderboard for ALE-Bench, showcasing the performance of various
  AI models on the benchmark tasks. Current version is updated as of 2026-11-02. For the initial version
  of the leaderboard (as of 2025-06-17), please visit here. All JSON result data published on this webpage
  can be downloaded in bulk with download_results_json.sh. Table of Conten … Input tokens Output tokens
  Vertical Scale: Linear Horizontal Scale: Linear Loading evaluation data… Experimental Setup: Self-refine
  x1 involved 15 sampling iterations, from which the response getting the median score across 50 local
  cases was selected. Details can be found in the ALE-Bench GitHub repository ( LLMs' setting and implementation
  code ). Benchmark Results by … ) Self-Refine Benchmark Results by Release Date Metric Performance (↑)
  Rank (↓) Self-Refine AI Rankings Across Problems Compare models by their mean AI rank across all problems.
  Configuration Horizontal Metric Cost (USD) Total tokens Input tokens Output tokens Horizontal Scale:
  Log Preparing aggr … test. Better scores achieved on the post-contest overtime leaderboard are not included.
  Higher total scores rank first. The human reference combines the best score for each case across multiple
  participants. It does not represent a single person's submission and may not be achievable with a single
  program. With relative scoring, adding a new model can change the scores and rankings of existing entries.
  The scores shown in the Run Summary section below may differ because these rankings use case-wise best
  scores or ranks"

quote_extract: 'vate it: ```bash conda activate fantom ``` You can run the evaluation by running the following
  example command: ```bash python eval_fantom.py --model gpt-4-0613 ``` This will automatically download
  the new FANToM benchmark in `data`. All evaluation results will be saved under `data/results`. ### Adding
  your own agent All you need to do is create an agent class with the method `interact()` or `batch_interact()`.
  ## 🏆 Latest Results We report evaluation results for newer models on the `short` conversation inputs.
  Scores are expected to be lower on the `full` conversation inputs. The models are ranked according to
  the `All*` score and then the `All` score, and ties are broken based on the sum of `All AnswerabilityQ`
  and `All Info-AccessQ` scores. | Model | All* | All | Bel … -------------:|:------------------:|:--------------:|
  | Human | | 87.5 | 93.8 | | | 90.6 | 90.6 | | 90.6 | 90.6 | | | | GPT-4o-2024-05-13 | 0.8 | 2.0 | 49.7
  | 17.1 | 36.2 | 12.0 | 41.7 | 65.5 | 17.0 | 21.7 | 86.9 | 46.9 | | GPT-4-0125-preview | 0.6 | 1.6 |
  27.6 | 13.8 … | 15.9 | 56.1 | 26.3 | ## Results on the Control Task Our code additionally evaluates
  performance on the control task, which consists of conversations without information asymmetry (i.e.,
  task without false belief). The results will be dumped under `data/results`. You can see the models
  perform significantly better on these than on … ormation asymmetry (i.e., task involving false belief).
  Moreover, the performance gap between models is much smaller. **Please ensure that the performance on
  the control task remains stable when testing your method or model.** | Model | All* | All | BeliefQ
  [Choice] | BeliefQ [Dist.] | BeliefQ token-F1 | All AnswerabilityQ | AnswerabilityQ [L … 7B Instruct
  | 0.0 | 0.0 | 44.1 | 89.9 | 37.3 | 0.0 | 0.4 | 67.5 | 1.7 | 8.7 | 73.6 | 26.3 | ## ⚠️ Intended Use of

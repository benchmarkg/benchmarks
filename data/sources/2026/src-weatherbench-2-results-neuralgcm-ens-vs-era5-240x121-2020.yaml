notes: "Read for P3-S7-T05 on 2026-11-24: one of the maintainers' published results files in the public
  weatherbench2 bucket's benchmark_results/ folder, whose file names follow the site's selectors (forecast,
  ground truth, resolution, year); no source read says the site's plots are drawn from them. NeuralGCM
  ENS, Google Research's 1.4-degree ensemble, scored against ERA5 as an ensemble. It holds every metric
  the evaluation computes for this forecast (CRPS, spread-skill ratio and ensemble-mean RMSE, the last
  two also in their unbiased form, for six upper-level variables and no surface variable), for 34 regions,
  the three pressure levels (500, 700, 850 hPa) and the 32 lead times 0 to 372 h at 12 h, at 240x121 (1.5
  degrees) for the evaluation year 2020. published is the object's timeCreated, equal to its updated,
  in the bucket's public JSON API record for the object (2026-03-03T08:31:07Z), whose md5Hash matches
  the bytes read. content_bytes is the NetCDF file's; content_sha256 is the text rendering that extract_preprocessing
  describes, so the quoted lines are that rendering of the file's values, not text the maintainers wrote.
  The file carries no global attributes and no units on its scores (only lead_time has one, hours), and
  names no person. P3-S7-T06 (2026-11-25) rebuilt the extract from the same bytes and the same rendering
  (content_sha256 unchanged), with the windows of its claim's cell added: wind speed at 850 hPa, CRPS,
  global, 168 h, with the same row at 24 h and 240 h."

quote_extract: 'economic value and complex reasoning requirements. Most existing financial benchmarks
  focus on static question-answering, failing to capture the dynamics of real-market trading. To address
  this gap, we introduce STOCKBENCH, a contamination-free benchmark designed to evaluate LLM agents in
  realistic, multi-month stock trading environments. Agents receive daily market signals—including prices,
  fundamentals, and news—and make sequential buy, sell, or hold decisions. Performance is measured using
  financial metrics such as cumulative return, maximum drawdown, and the Sortino ratio, capturing both
  profitability and risk management. We evaluate a wide range of state-of-the-art proprietary and open-source
  LLMs. Surprisingly, most models struggle to outperform the simple buy-and-hold baseline, while some
  models demonstrate the potential to achieve higher returns and stronger risk management. These findings
  highlight both the challenges and opportunities of LLM-based trading agents, showing that strong performance
  on static financial question-answering do not necessarily translate into effective trading behavior.
  We release STOCKBENCH as an open-source benchmark to enable future research on LLM-driven financial
  agents. 1 Introduction Large language models (LLMs) have enabled extensive exploration of autonomous

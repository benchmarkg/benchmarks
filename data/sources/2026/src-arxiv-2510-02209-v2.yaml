  Agent Workflow We provide a stock-trading agent workflow that enables backbone LLMs to interact with
  the backtrading environment as agents. The design of the workflow follows two goals. (1) Minimal workflow.
  We keep the workflow minimal, since overly complicated workflows introduce inductive biases that may
  favor certain backbone LLMs. (2) Realistic. We design the workflow to align with the iterative decision-making
  process of retail investors. In particular, we follow previous frameworks (Zhang et al., 2020; Tsantekidis
  et al., 20 … in the initial overview, examining their financial health and other key metrics in greater
  depth. Step 3: Decision Generation. With the enriched context, the agent generates decisions for each
  stock, choosing between three actions: (1) increase, (2) decrease, or (3) hold the position. These options
  ensure that the agent’s actions are clear, actionable, and executable within the constraints of a retail
  investor’s decision making process. Step 4: Execution and Validation. Finally, the decisions are executed
  by converting dollar targets into share quantities based on the opening price. If the decisions of the
  agents exceed available liquidity, the system flags the issue and requires the agent to revise its decisions

quote_extract: 'ChemBench *ChemBench* is a Python package for building and running benchmarks of large
  language models and multimodal models such as vision-language models. *ChemBench* was developed as a
  comprehensive benchmarking suite for the performance of LLMs in chemistry (see [our paper](https://arxiv.org/abs/2404.01475))
  but has since then been extended to support multimodal models as well (see [our paper](https://arxiv.org/abs/2411.16955)).
  *ChemBench* is designed to be modular and extensible, allowing users to easily add new datasets, … as
  topic-specific reports. ``` python from chembench.prompter import PrompterBuilder from chembench.evaluate
  import ChemBenchmark, save_topic_reports benchmark = ChemBenchmark.from_huggingface(verbose=True) prompter
  = PrompterBuilder.from_model_object("groq/gemma2-9b-it", model_kwargs={"temperature": 0}) results =
  benchmark.bench(prompter) save_topic_rep'

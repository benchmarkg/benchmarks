  Discussion & Feedback Challenges The 2025 edition of LifeCLEF proposes five data-oriented challenges
  related to the identification and prediction of biodiversity: (i) AnimalCLEF 2025: recognizing individual
  animals in images, (ii) BirdCLEF 2025: bird species identification in soundscape recordings, (iii) GeoLifeCLEF

quote_extract: 'AlignBench: 多维度中文对齐评测基准 (ACL 2024) Read this in [English](README-en.md) AlignBench 是第一个多维度全面评估中文大模型对齐水平的评测基准。此仓库包含了
  AlignBench 的介绍信息、数据和代码。 ## 🔥 近期更新 [2024.06.15] 更新了 AlignBench v1.1，对涉及较强事实性内容的测试指令的参考答案进行了一轮人工检查修正。其中，约
  22% 的答案除了进行修正外，还补充了对应参考信息的来源网页（参考 `evidences` 字段）和引用的信息。欢迎大家继续检查 AlignBench 的答案并提出修改意见。 ## 📍 基本信息 对于经过指令微调（instruction
  tuning）的大语言模型（LLMs），与人类意图的对齐程度已成为其实际应用的关键因素。然而，现有的评测基准已经不能准确反映模型在真实场景中的表现和与人类意图的对齐程度，如何对中文大语言模型的对齐水平进行有效评估已经成为了一个重大的挑战
  … asoning | 逻辑推理 | 92 | | Mathematics | 数学计算 | 112 | | Task-oriented Role Play | 角色扮演 | 116 | | Professional
  Knowledge | 专业能力 | 124 | 为了反映模型在实际应用中的真实表现，AlignBench 中的数据主要来自 ChatGLM 在线服务中真实用户的问题（少部分为研究人员构造的挑战性问题）。AlignBench
  总共包含 683 个高质量评测数据。AlignBench 中的每个样本都包含一个任务性的用户指令、一个高质量的参考答案，以及在我们的分类体系中对应的类别。数据保存在`data/data_release.jsonl`中，每一行都以`json`格式包含一个样本。
  数据格式如下所示。 - `question_id` (integer)：问题 … 采用了思维链方法来增强评价的可靠性和可解释性。具体来说，我们会引导评价模型在给出最终评分之前，从多个维度生成对模型回答的分析解释。
  + **规则校准：** 对于每个问题，我们提供一个高质量的参考答案。为了指导评价模型将模型回答与参考答案进行比较，并生成更加可控的分数，我们提供了详细的评分规则，阐述了分数区间（目前将 1 - 10
  五等分）与模型回答的质量之间的关系。这些规则包含在 `prompt` 中。 * **多维度分析：** 由于不同的任务具有不同的性质和特征，对所有任务应用相同的评估流程是不合理的。因此，我们采用多维度的评分方法来全面评估模型回答。具体来说，我们根据不同的问题类型设置了不同的评估维度，并指导评价模型从指定的多个维度分析模型答案并提供单个
  … 名应与文件名相同） 第三，修改参数并运行以下脚本以获得待评测模型的生成结果。 ```bash MODEL=do_nothing # TODO 修改模型名称（与您的API调用类相同） python
  get_answers.py \ --model do_nothing \ --workers 2 \ --question-file data/data_v1.1_release.jsonl \ --save-dir
  data/model_answer ``` 待评测模型的回复将被保存在`data/model_answer`中，以备下一步的评测。 2. **步骤二** 调用评价模型获取分析和打分 目前我们使用 `gpt-4-0613`

  Offline evaluation for training set The reconstruction of training set can be evaluated using
  public ground truth. Since the SfM reconstruction has arbitrary scale and orientation, it is
  necessary to exactly align the reconstruction with the ground truth. This can be done
  automatically by using Open3D and our evaluation script. To install Open3D, please follow this
  instruction. To use our evaluation script, clone TanksAndTemples github reposito … ou set the
  ground-truth file as a reference, and align the reconstruction to it. 3-2. Online evaluation for
  testing set This case uses a dedicated server for the evaluation. It is based on the same
  evaluation pipeline used for the offline case, but the ground truth geometries are not public.

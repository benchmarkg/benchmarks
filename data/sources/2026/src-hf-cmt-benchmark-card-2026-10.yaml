quote_extract: 'log Report the dataset version with benchmark results. Each dataset update receives a
  new version and an entry below identifying the affected problems and corrections. ### Changelog Problems
  are identified by their `index` field in `cmt_data.jsonl`. #### v2.0.0 (2026-10-22) Fixes errors in
  10 problems after expert review; no problems were added or removed. Seven reference answers changed.
  Re-evaluate earlier results on this version before comparing scores. ([Data corrections](https://huggingface.co/datasets/CMTBenchmark/cmt_benchmark/commit/5c33139a1420c76ac006ef87251730e6608ebf48))
  | Index | Type | Field(s) | Change | | --- | --- | --- | --- | | 2 | HF | prompt, solution | Brillouin-zone
  corners corr … tion. | | 40 | Other | prompt | Option (d): `t_1(t_2/t_1)^{N_u}` → `t_1(t_1/t_2)^{N_u}`.
  Reference answer unchanged. | | 42 | SM | prompt | Dimensionless ratio: `\rho \equiv \gamma/(m\tau)`
  → `\rho \equiv \gamma\tau/m`. Reference answer unchanged. | #### v1.0.1 (2026-07-01) Clarifies two Hartree-Fock
  prompts. All 50 problems are retained; reference answers and grading parameters are unchanged. ([Data
  changes](https://huggingface.co/datasets/CMTBenchmark/cmt_benchmark/commit/32cf7268666a96094ec34724b96b482b3b175b90))
  | Index | Type | Field(s) | Change | | --- | --- | --- | --- | | 0 | HF | prompt | Clarified particle
  density: "half-filling per site" → "half-particle per site". | | 2 | HF | prompt | Removed "original"
  from "six original Brillouin zone corners". | #### v1.0.0 (2026-02-20) First release under `CMTBenchmark`,
  containing 50 problems. ([Dataset commit](https://huggingface.co/datasets/CMTBenchmark/cmt_benchmark/commit/f87948d421cc4f29b0333a91c0e3ae5dc5115bce))
  Compared with the [anonymous pre-release snapshot](https://huggingface.co/datasets/AnonBenchmark322/benchmark_data)
  used in the paper (last updated 2025-09-25), problem 12 (DMRG) has one answer correction: `c;e` → `c`,
  because the prompt offers only choices (a) through (d). ## Model Performance Summary The following table
  summarizes the Overall Pass@1 rates (%) as reported in the paper. These numbers were obtained on the
  pre-release version of the dataset that preceded v1.0.0 (see [Changelog](#changelog)). | Model | Overall
  | | --- | --- | | GPT-4o | 2.0 | | GPT-4.1 | 4.0 | | GPT-5 | 30.0 | | GPT-5-mini | 24.0 | | GPT-5-nano
  | 14.0 | | GPT-o3 | 26.0 | | GPT-o4-mini | 18.0 | | Gemini 2.0 Flash | 10.0 | | Gemini 2.5 Flash'

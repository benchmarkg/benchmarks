quote_extract: 'Kinetics-700-2020 dataset will be used for this challenge. Kinetics-700-2020 is a large-scale,
  high-quality dataset of YouTube video URLs which include a diverse range of human focused actions. The
  … w to download the Kinetics dataset is available here. Tasks The Kinetics 2021 challenge will have
  two tracks: supervised and self-supervised classification. Both will be restricted to using RGB and/or
  audio modalities from videos in the Kinetics-700-2020 dataset (no other modalities, and no external
  data). The supervised track is similar to previous years, except … r each training and test video --
  not class scores anymore. We will then train ourselves a linear classifier on top of these feature vectors
  to determine top-1 and top-5 accuracy and decide on the winning model. For the self-supervised track
  we will ask the participants to train on videos from a subset of classes (found here) to test for out
  of domain generalization. Class labels should otherwise not be used for this track -'

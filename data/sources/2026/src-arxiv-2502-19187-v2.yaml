quote_extract: 'ork. However, recent advances in LLMs have led to saturation on BIG-Bench, and its harder
  version BIG-Bench Hard (BBH). State-of-the-art models achieve near-perfect scores on many tasks in BBH,
  thus diminishing its utility. To address this limitation, we introduce BIG-Bench Extra Hard (BBEH),
  a new benchmark designed to push the boundaries of LLM reasoning evaluation. BBEH replaces each task
  in BBH with a novel task that probes a similar reasoning capability but exhibits significantly increased
  difficulty. We evaluate various models on BBEH and observe a (harmonic) average accuracy of 9.8% for
  the best general-purpose model … substantial room for improvement and highlighting the ongoing challenge
  of achieving robust general reasoning in LLMs. We release BBEH publicly at: https://github.com/google-deepmind/bbeh.
  1. Introduction Recent research has made significant strides in evaluating the reasoning capabilities
  of large language … chmark (Srivastava et al., 2022), specifically its more challenging subset, BIG-Bench
  Hard (BBH) (Suzgun et al., 2022). BBH has served as the de facto standard for evaluating general reasoning
  in LLMs due to its versatility and the wide array of reasoning skills it probes. However, the rapid
  advancements in LLM develop … nsparency and reproducibility for the broader research community. 2 BIG-Bench
  Extra Hard 3. Going Beyond BIG-Bench Hard BIG-Bench, and its later subset BIG-Bench Hard (BBH), have
  served the research community for several years as de facto benchmarks for measuring general reasoning
  capabilities. Here, we mainly focus on BBH which has been favored in the recent years. We believe three
  key factors in the success of … y, a random chance baseline already has a high performance on BBH due
  to the high number of tasks with limited options (8/23 of the tasks have binary labels, and another
  5/23 have at most 5 options to choose from). Secondly, some of the problems in BBH can be solved using
  shortcuts without solving the problem (for example, in the geometric shapes task, whenever there are
  three L commands the answer is triangle). Thirdly, while real-world reasoning problems typically require
  processing large amounts of input texts, the input lengths of the problems in BBH are often quite short
  with a macro average of 700 characters across tasks. Fourthly, since the problems were made to be challenging
  for the LLMs of the time, they typically require only few hop … lined above has led to BBH getting saturated
  with latest models achieving accuracies in the range of 90+ percent on it, thus causing BBH to disappear
  from the latest model evaluation reports. We create a challenging benchmark for measuring the general
  reasoning capability of LLMs by using BBH as a guide: we p … identify that for a reasoner to perform
  well on BBH it needs to have at least the following broad reasoning skills: 1- temporal understanding,
  2- spatial and geometric understanding, 3- commonsense understanding, 4- humour understanding, 5- causal
  understanding, 6- reasoning about world entities and events, 7- deductive logical reasoning, 8- reasoning
  through linguistic knowledg … sks in BBEH, how they have been constructed and which task from BBH the
  replace, and what reasoning skills they target. The benchmark contains 200 questions per task, except

quote_extract: tory Press for the RNA Society2015https://creativecommons.org/licenses/by/4.0/This
  article, published in RNA, is available under a Creative Commons License (Attribution 4.0
  International), as described at http://creativecommons.org/licenses/by/4.0/. This paper is a
  report of a second round of RNA-Puzzles, a collective and blind experiment in three-dimensional
  (3D) RNA structure prediction. Three puzzles, Puzzles 5, 6, and 10, represented sequences of three
  large RNA structures with limited or no homology with previously solved RNA molecules. A
  lariat-capping ribozyme, as well as riboswitches complexed to adenosylcobalamin and tRNA, were
  predicted by seven groups using RNAComposer, ModeRNA/SimRNA, Vfold, Rosetta, DMD, MC-Fold, 3dRNA,
  and AMBER refinement. Some groups derived models using data from state-of-the-art chemical-mapping
  methods (SHAPE, DMS, CMCT, and mutate-and-map). The comparisons between the predictions and the …
  t methods. All of the best prediction models have similar topologies to the native structures,
  which suggests that computational methods for RNA structure prediction can already provide useful
  structural information for biological problems. However, the prediction accuracy for
  non-Watson–Crick interactions, key to proper folding of RNAs, is low and some predicted models had
  high Clash Scores. These two difficulties point to some of the continuing bottlenecks in RNA
  structure prediction. All submitted models are available for download at
  http://ahsoka.u-strasbg.fr/rnapuzzles/. 3D prediction

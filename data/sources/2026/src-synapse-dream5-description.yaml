quote_extract: 'iment is part of a time series, or the deleted gene if it’s a gene deletion experiment).
  Participants are further given a list of candidate transcription factors (TFs) for each compendium.
  In the case of the data arising from actual gene expression, some information has been anonymized such
  that the identity of the network, of the TFs and of the genes remains unknown to the participants. We
  ask for predictions of the complete (genome-scale) transcriptional regulatory network for each compendium.
  In order to participate in the challenge, predictions for all four networks must be submitted (there
  are no sub-challenges). The following table summarizes the number of TFs, the number of genes, and the
  number of microarray chips for each network: Network | Organism | # Transc Factors |# Genes| # Chips
  ---|---|---|--- Network 1 | _in silico_ | 195 | 1643 | 805 Network 2 | _S.aureus_ | 99 | 2810 | 160
  Network 3 | _E. coli_ | 334 | 4511 | 805 Network 4 | _S. cerevisiae_ | 333 | 5950 | 536'

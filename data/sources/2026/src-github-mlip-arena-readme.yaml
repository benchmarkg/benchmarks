quote_extract: '⚔️ MLIP Arena ⚔️ Fair and transparent benchmark of foundation machine learning interatomic
  potentials (MLIPs) --- ![Thumbnail](../serve/assets/workflow.png) 🚀 **The Future of Atomistic Modeling
  and Simulation Benchmarks for MLIPs** Foundation machine learning interatomic potentials (MLIPs), trained
  on extensive databases containing millions of density funct … IP Arena** introduces a unified, cutting-edge
  benchmark platform for evaluating foundation MLIP performance far beyond conventional error metrics.
  It focuses on revealing the physical soundness learned by MLIPs and assessing their practical utility,
  remaining completely agnostic to the underlying model architectures and training datasets. ***By moving
  beyond static DFT references and revealing the critical failure modes*** of current foundation MLIPs
  in real-world settings, MLIP Arena provides a reproducible framework to guide next-generation MLIP development.
  We aim to drive improv … g robust physical consistency! ⚡ MLIP Arena leverages modern pythonic workflow
  orchestration with 💙 [Prefect](https://www.prefect.io/) 💙 to enable advanced task/flow chaining, scaling,
  and caching. ![Prefect](../serve/assets/prefect.png) > [!NOTE] > Contributions of new tasks via PRs
  are highly welcome! See our [Project Page](https://github.com/orgs/atomind-ai/projects/1) for outstanding
  tasks, or propose new feature requests in [Discussions](https://github.com/atomind-ai/mlip-arena/discussions/new?category=ideas).
  --- ## 📖 Official Documentation For comprehensive guides, API references, and advanced usage, please
  visit our **[Official Documentation Site](https://atomind-ai-mlip-arena.mintlify.app/introduction)**!
  --- ## 📢 Announcements - **[Sep 18, 2025]** 🎊 **[MLIP Arena is accepted as a Spotlight (top 3.5%) at
  NeurIPS!](https://neurips.cc/virtual/2025/poster/121648)** 🎊 - **[Apr 8, 2025]** 🎉 **[MLIP Arena is
  accepted as an ICLR AI4Mat Spotlight!](https://openreview.net/forum?id=ysKfIavYQE#discussion)** 🎉 Huge
  thanks to all co-authors for their contributions! --- ## 🛠️ Installation ### Option 1: From PyPI (Prefect
  workflow only, *without* pretrained models) ```bash pip install mlip-arena ``` ### Option 2: From Source
  (with Integrated Pretrained Models) > [!CAUTION] > We strongly recommend a **clean build in a new virtual
  environment** due to compatibility issues between multiple popular MLIPs. We provide a single installation
  script using `uv` for minimal package conflicts and blazing fast installation! > [!IMPORTANT] > To automatically
  download Fairchem model checkpoints, please ensure you have downloading access to their Hugging Face
  [ … EB_FROM_ENDPOINTS](../mlip_arena/tasks/neb.py#L164)**: Nudged elastic band with convenient image
  interpolation (linear or IDPP) - **[ELASTICITY](../mlip_arena/tasks/elasticity.py#L78)**: Elastic tensor
  calculation --- ## 🤝 Contribute and Development PRs are welcome! Please clone the repo and submit PRs
  with your changes. To make changes to the Hugging Face Space, fetch large files from git LFS first,
  and then run Streamlit: ```bash git lfs fetch --all git lfs pull streamlit run serve/app.py ``` ###
  ➕ Add New MLIP Models If you have pretrained MLIP models that you would like to contribute to MLIP Arena
  and evaluate in real-time benchmarks, you have two options: #### External ASE Calculator (Easy / Fast)
  1. Implement a new ASE Calculator class in [`mlip_arena/models/externals`](../mlip_arena/models/externals).
  2. Name your class with your awesome model name and add the exact same name to the [`registry`](.. …
  string or custom ASE Calculator instance). - Adjust the `SLURM_CONFIG` parameters for your specific
  HPC allocation (including any conda environments or module loads in the `job_script_prologue`). 3. Submit
  the pipeline: ```bash python submit.py ``` This will dynamically distribute and run the core benchmarks
  (diatomics, EOS bulk, and E-V scans) via a Dask-Jobqueue on your SLURM cluster. ### ➕ Add New Benchmark
  > [!NOTE] > Please reuse, extend, or chain the general tasks defined [above](#list-of-modular-tasks)
  and add your new folder and scripts under [`/benchmarks`](../benchmarks/). --- ## 📜 Citation If you
  find this work and platf'

quote_extract: Submit a new model to WeatherBench 2 — WeatherBench 2 documentation WeatherBench 2
  Evaluation Quickstart WeatherBench 2 Data Guide Command line scripts Distributed computing using
  Beam on GCP Official Evaluation Submit a new model to WeatherBench 2 Save forecasts in a
  standardized Zarr format Regrid Run the evaluation script “Submit” the results Init vs Valid Time
  Conventions API docs WeatherBench 2 Submit a new model to WeatherBench 2 View page source Submit a
  new model to WeatherBench 2 You have the latest and greatest new ML model? Awesome! Here are the
  steps required to evaluate it in the WeatherBench 2 framework. If there are any questions, please
  don’t hesitate to ask them via a GitHub issue. Save forecasts in a standardized Zarr format The
  WeatherBench evaluation pipeline expects forecasts and ground truth to be stored as Zarr files.
  See the Quickstart for a description of the format. Saving all variables is too much? You can also
  select specific levels and variables. See the Pangu forecasts for an example. We recommend having
  single chunks in space (latitude and longitude) but small chunks in time to allow for efficient
  parallelization. Regrid The WeatherBench 2 code can be used to evaluate any resolution. However,
  we only provide ground truth data for a range of resolutions (see Data Guide). The official
  resolution used in the paper is 1.5 degrees but the website also contains scores for 0.25 and
  5.625 degrees. Note that absolute values of metrics computed at different resolution are not
  necessarily comparable (see paper). For regridding, you can use the regridding script. Note that
  following the WMO standards we are using conservative regridding. Run the evaluation script Next,
  run the evaluation command-line script for your forecasts and save the results. “Submit” the
  results To have your model appear on the WeatherBench 2 website, you can either provide us with
  your forecasts (create a GitHub issue or contact us directly at weatherbench2@google.com). We will
  then evaluate the forecast. Or you evaluate the forecasts yourself and share your evaluation code
  and results with us. Then we will update the results on the website. Previous Next © Copyright

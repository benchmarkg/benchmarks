quote_extract: 'News Incidents Blog About Social Mobility Access to Justice Benchmark Benchmarks / Social
  Mobility Proprietary Access to Justice Benchmark Updated 11/10/2026 How well can AI help someone navigate
  a legal problem without a lawyer? As of November 10, 2026, Qwen 3.8 Max ranks first on the Access to
  Justice Benchmark with 76.37%, followed by Claude Sonnet 5.5 (74.94%) and Wonder Full (74.68%). Access
  to Justice BenchmarkAccess … T-6.1 Sol 65.84% $0.69 1.13m 12m27s 23 GPT-5.6 Luna 65.56% $0.09 1.03m
  5m16s Partners in Evaluation Access to Justice was built by Vals AI with support from NextLadder Ventures.
  Background Most low-income Americans face their civil legal problems without a lawyer. According to
  … the kinds of problems low-income people actually face, such as housing, employment, and family law.
  This benchmark tests whether AI models can act as a reliable first point of contact for someone with
  a legal problem, the role an intake worker or a court self-help center plays. For this benchmark, we
  simulated conversations based on real legal-aid queries from legal aid organizations and criteria written
  by legal aid experts. Our experts outlined that a good first response asks about the person’s situation,
  gives accurate g … center or an attorney. Key Takeaways No model clears the bar for a reliable first
  point of contact. We set that bar at 80% of expert rubric criteria; even the top-performing model, Qwen
  3.8 Max, reaches 76.4%. Models explain the law but often fail … % of expert-defined criteria met over
  all scenarios, 1.4 points ahead of Claude Sonnet 5.5 (74.9%), a gap within the margin of error. Meta
  Wonder Full follows at 74.7%. Most of the models meet between 67.1% and 73.8% of the rubric c … ot uses,
  they can change it without notice, and their apps may use different settings than the API. We tested
  every model through its API with the same setup, so these results approximate what a chatbot user would
  see rather than reproduce it. Open-weight m … the topic mix reflects what those practitioners see rather
  than an even split across areas of law. Family law is the largest topic (110 of 252 scenarios), followed
  by housing (65). The chart below pools every rubric criterion across all 23 models for the scenarios
  in each topic. … : the right answer depends on the people involved, and there is rarely a one-size-fits-most
  answer. Public benefits (5 scenarios) and the catch-all civil category (11 scenarios) are the hardest
  topics for models, though both are small. Our Public Benefits Bench evaluates in more depth how well
  models help people apply for and receive SNAP benefits. Top-3 vs. Bottom-3 Models by Topic Average criteria
  satisfied (%) by topic for the three highest- a … uestions about gun rights, expunging or sealing firearm
  records, and a trafficking conviction), and those blocked scenarios count as zero. Excluding them, it
  scores 71.5% on the other 11 criminal and records scenarios, in line with the 6 … (MiMo V2.6 Pro) of
  criteria met. Higher-scoring models tend to refer more often (correlation 0.58). Every model could search
  the web and open pages. Across the 23 models, the runs issued 60,400 searches and tried to open 22,598
  pages, of which 16,8 … kinds of criteria. Elicitation criteria (the rubric’s “Must find out” items,
  about 24% of criteria) cover the context a careful advocate must find out about the person’s situation.
  Legal information criteria cover what a good response should deliver. In this report, … OpenAI models
  score about 65%. Part of this comes down to how models interact in the conversation. Each model can
  have up to five exchanges with the simulated client. Conversations average about 3.5 exchanges, and
  some hit the limit. Most models give a full answer i … erformance tracks the overall score more closely
  than elicitation does (correlation 0.93 vs. 0.62). Longer answers also tend to score higher (correlation
  0.50 between final-answer length and score), and Qwen 3.8 Max writes the longest final answers, about
  3,900 words on average. We aim to conduct further analyses determining a length-adjusted scoring and
  ranking as a future step for this project. Our experts see a similar pattern in practice: when self-represented
  litigants us … and the extra length doesn’t necessarily make them more accurate. Methodology Dataset
  Construction The scenarios start from real questions people bring to legal aid organizations. Two legal
  practitioners supplied real-world queries. Six legal aid experts then each adapted the queries to one
  assigned state and determined what a reliable first point of contact should ask about and tell the person,
  framing it as general legal information rather than legal advice. State Scenarios California 44 Louisiana
  44 Virginia 43 New York 41 Maryland 40 Texas 40 For each scenario, the expert wrote: the person’s opening
  question; background facts about the person’s situation, which the person shares only in conversation;
  a rubric of what context a good response must elicit and what information it must deliver (15.4 independent
  criteria on average); a difficulty rating, based on how complex the legal question is. Scenarios are
  categorized by topic, subfield of law, case stage, and whether the question involves state law, federal
  law or both. The full dataset has 504 scenarios, split 50/50: models are evaluated on a 252-scenario
  test split used for published results, and the other 252 scenarios are kept private as a validation
  split. The complete list of topics is below: Housing & Landlord-Tenant: evictions, leases, required
  repair … ten rubric criteria. More details about each model follow. Target model, the model being evaluated.
  It acts as a first point of contact for legal help, can search the web and read pages, and can ask the
  person follow-up questions before giving its final answer. Simulated client (GPT-5). It opens with the
  expert’s question word for word, then answers only what the target directly asks, … scenario’s background
  facts. It never volunteers other facts or corrects the target’s assumptions. Judge (Decider v1.2). It
  grades the full conversation against the expert rubric, scoring elicitation and legal information separately.
  A model’s score is the share of rubric criteria it meets, pooled across all 252 scenarios. “Must find

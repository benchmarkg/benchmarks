quote_extract: 's designed to minimize both test set contamination and the pitfalls of LLM judging and
  human crowdsourcing. We use this framework to create LiveBench, the first benchmark with these three
  desiderata: (1) LiveBench contains frequently-updated questions based on recent information sources;
  (2) LiveBench is scored automatically according to the objective ground truth without the use of an
  LLM judge; and (3) LiveBench questions are drawn from a diverse set of six categories. We ensure (2)
  by only including questions that have an objectively correct answer. LiveBench questions are difficult:
  no current model achieves higher than 70% accuracy. Questions are added and updated on a monthly basis,
  and we release new tasks and harder versions of tasks over time so that LiveBench can distinguish among
  the capabilities of LLMs as they improve in the future. Overview of tasks. LiveBench currently consists
  of 18 tasks across 6 categories: math, coding, reasoning, language, instruction following, and data
  analysis. Each task falls into one of two types: (1) tasks which use an information source for their
  questions, e.g., data analysis questions based on recent Kaggle datasets, or fixing typos in recent
  arXiv ab … em. Each task either includes recent information sources (such as very recent news articles,
  movie synopses, or datasets) or is a more challenging, more diverse version of an existing benchmark
  task. Each task is designed to have 40-100 questions which span a range of difficulty, from easy to
  very challenging, while loosely aiming for an overall 30-70% success rate on the top models for each
  task. Prompts are tailored for each category and task but typically include the foll … ndrycks et al.,
  2021). Our first two math tasks, Competitions and Olympiad, are based on expert human-designed math
  problems that offer a wide variety in terms of problem type and solution technique. In Competitions,
  we include questions from AMC12 2023, SMC 2023, and AIME 2024 modifying the prose and the answer order;
  in Olympiad, we include questions based on USAMO 2024 and IMO 2024, in which the task is to rearrange

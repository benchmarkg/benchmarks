  many scenarios, a laborious undertaking in the real world (top left). In this work, we design an evaluation
  procedure in which policies trained on real data are evaluated in purpose-built simulated environments
  (bottom left). Our approach yields a strong correlation between real-world and simulated performance
  (right) for various open-source robot policies [6, 11, 50] … s for mitigating these gaps without needing

quote_extract: 'gent on two comprehensive geospatial reasoning benchmarks that collectively cover diverse
  task types, geographic regions, and reasoning capabilities. MapEvalAPI (Dihan et al., 2024) is the API-based
  evaluation from the MapEval benchmark, which requires agents to invoke map tools for geospatial reasoning.
  The dataset comprises four task categories: Place Info (retrieving place attributes), Nearby (finding
  nearby points of interest), Routing (computing directions and distances), and Trip (multi-stop travel

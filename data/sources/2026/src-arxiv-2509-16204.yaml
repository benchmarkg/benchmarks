quote_extract: "[Submitted on 1 Jul 2025 (v1), last revised 6 Nov 2025 (this version, v2)] … ocesses that
  consume much of practicing engineers' time. Despite these shared challenges across engineering disciplines,
  no benchmark currently captures the unique demands of engineering design work. In this work, we introduce
  EngDesign, an Engineering Design benchmark that evaluates LLMs' abilities to perform practical design
  tasks across nine engineering domains. Unlike existing benchmarks that focus on factual recall or question
  answering, EngDesign uniquely emphasizes LLMs' ability to synthesize domain knowledge, reason under
  constraints, and generate funct … goals, constraints, and performance requirements. EngDesign pioneers
  a simulation-based evaluation paradigm that moves beyond textbook knowledge to assess genuine engineering
  design capabilities and shifts evaluation from static answer checking to dynamic, simulation-driven
  functional verification, marking a crucial step toward realizing the vision of engineering Artificial
  General Intelligence (AGI). Comments: To Appear in NeurIPS 2025 Datasets & Benchmarks Track Subjects:
  Computational Engineering, Finance, and Science ("

quote_extract: 'enge Community DCASE Community Publishing Datasets Tools News Call for task proposals
  for DCASE2027 Thu 01 October 2026, Romain Serizel challenge2027 DCASE is a data challenge whose purpose
  is to produce new scientific knowledge about methods for detection and classification of sound scenes
  and events. It provides an open and reproducible evaluation platform, thus fostering collaborative research
  between participants. DCASE consists of independent tasks organized by teams who are, within the schedule
  defined by the DCASE Steering Group, responsible for producing the required data and instructions for
  participation, scoring the task submissions, providing a summary of the results, and presenting the
  results at the DCASE Workshop. The DCASE Steering Group invites proposals to organize tasks in the DCASE
  2027 Challenge. The goal … ask proposals 15 Jan 2027 Final notification of acceptance 25 Jan 2027 Task
  descriptions on website 1 April 2027 Challenge opening: datasets and baseline methods published 1 June
  2027 Evaluation set release 15 June 2027 Challenge submission deadline 30 June 2027 Challeng'

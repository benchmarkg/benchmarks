quote_extract: 'omparison Vals Smith App Reports Government News Blog Hackathon About Benchmarks Models
  Comparison Vals Smith App Reports Government News Blog Hackathon About Finance Finance Agent Archived
  Benchmark Finance Agent v2 has been superseded by Finance Agent v2.1, which replaces it in the Finance
  sector of Vals Index v2.2. We no longer run this benchmark on new model releases. Previous results are
  preserved here for posterity. Benchmarks / Finance Proprietary Finance Agent Updated 10/29/2026 Version
  2 Read research paper View trajectories Evaluating agents on core financial analyst tasks As of October
  29, 2026, Gemini 4 Argon ranks first on Finance Agent v2 with 65.40%, followed by Gemini 3.8 Flas …
  sponse with a correct dealbreaker but a few peripheral misses scores below 100%; a response with any
  failed dealbreaker scores 0%. All-Pass (secondary): 100% only if every check passes, 0% otherwise. All
  responses are graded by a three-judge LLM jury consisting of three frontier models: GPT-5.4, Gemini-3.1-Pro,
  and Claude Sonnet 4.6. Changes from v1.1 Step up in difficulty. Even the best models reach only 65.40%
  with Partial Credit and 55.79% under All-Pass grading. Questions require connecting data across multiple
  documents, tighter numeric precision, and answers are expected to include insights that skilled analysts
  would include but are not explicitly stated in the question. Expanded taxonomy. The taxonomy was reorganized
  around real analyst workflows rather than retrieval tiers. v1.1’s easier retrieval-focused buckets (Quantitative
  Retrieval, Qualitative Retrieval, Numerical Reasoning, Complex Retrieval, Beat or Miss, Trends) are
  replaced with Comparables, Precedents, Earnings Analysis, Disclosure Analysis, and a split between General
  Qualitative and General Quantitative analysis. New grading mechanism. Dealbreaker-gated Partial Credit
  replaces v1.1’s flat per-question score, and All-Pass is reported alongside it as a strict secondary
  metric. Stricter numeric tolerances. Tighter thresholds on rounding and precision drift. Answers that
  previously passed under v1.1’s looser tolerance now fail. Expanded harness. Adds calculator and price_history
  on top of the v1.1 tools. Multi-run aggregation. Every model is run three times; reported scores are
  mean-of-runs with standard error of the mean. Expanded test set. Larger held-out test split for tighter
  measurement. Question Design Questions target the analytical depth expected of a 2nd or 3rd-year investment
  banking analyst. Each question was designed to satisfy four criteria: Determinism. A single, unambiguous
  … ic precision. Critical information is frequently buried in footnotes, MD&A caveats, or accounting
  policy disclosures. Dataset The dataset is divided into three parts: Public (27 open-source samples),
  Private Validation (450 samples available for license), and Test (450 samples). The Public set and agent
  harness are fully open in the Finance Agent v2 GitHub repository. The Private Validation set is available
  for license. Interested parties are encouraged to contact us direct'

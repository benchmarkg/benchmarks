quote_extract: 'ipants. The task is to extract the speech of the conversation partners from the noisy
  multichannel recordings with the goal of improving the intelligibility and quality of the speech, evaluated
  using objective metrics and subjective listening tests. This paper reviews submissions from seven teams
  and ranks them on a combination of subjective intelligibility and quality. Results show that while the
  objective metrics do not reflect listener performance, the top systems were able to make substantial
  improvements over the challenge baseline in both intelligibility and quality ratings. Index Terms— speech

  dataset was split into three subsets at the session level: the training subset contains 30 sessions
  (18 hours), the development subset contains 10 sessions (6 hours), and the evaluation set contains 8
  sessions (4.8 hours). Each subset was disjoint with respect to the conversation participants and background
  noise, so no speakers in the training subset would appear in the development or evaluation subsets.
  For the training and development sets, all materials described in Section 2.2 were provided to the challenge
  participants. For the evaluation set, only the noisy Aria and HA audio and the rainbow passages were
  made public, as these were the only materials which were supposed to be used by the model. 3.2. Challenge
  Rules The full rules to the challenge can be found on the challenge website2, but a description of the
  key rules is given below. 3.2.1. Latency Requirements Given that the fundamental goal of the challenge
  is to enhance speech using AHDs, there was a strict requirement for submitted systems to operate with
  a 20 ms theoretical latency. This means that any submitted system may not use any part of the signal
  > 20 ms in the future from the current time step, for example, when normalising the audio. This latency

quote_extract: "h compendium. To fully anonymize the datasets, for the _E. coli_, _S. cerevisiae_, and
  _S. aureus_ compendia, all genes were assigned an arbitrary gene identifier (e.g. _G1,G2,...,GN_), where
  there are _N_ genes in a given compendium). Additionally, a set of decoy genes, representing roughly
  5% of the compendium, were introduced by randomly selecting gene expression values from the compendium,
  itself. Gene expression profiles for the _in silico_ network were derived from [GeneNetWeaver](http://gnw.sourceforge.net/).
  In order to participate in the challenge, predictions for all four compendia were required. For each
  network, a list of directed, unsigned edges had to be submitted ordered according to the participant’s
  confidence scores. The set of submitted predictions were compiled into the prediction that contains
  29 entries from the participating teams, 6 entries from publicly available methods, and an entry from
  integrating the 29 methods into an additional … actor-target gene) interactions (= true positives) were
  compiled for assessing the participating approaches. For the evaluation, we considered all transcription
  factor-target gene pairs that are not part of the gold standards as negatives, although, as the gold
  standards are based on incomplete knowledge, they might contain yet unknown true interactions. We have
  developed a webservice for those interested in implementing the 'wisdom of crowds' integration with
  top performing methods using the [GenePattern](http://www.broadinstitute.org/cancer/software/genepattern/)
  platform: ${buttonlink?text=GP-DR"

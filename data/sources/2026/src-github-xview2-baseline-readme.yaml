quote_extract: "following Third-Party Software subject to its own license: 1. SpaceNet (https://github.com/motokimura/spacenet_building_detection/blob/master/LICENSE)
  Copyright 2017 Motoki Kimura. DM19-0988 ## xView xView2 is a challenge set forth by [DIU](https://diu.mil)
  for assessing damaged buildings after a natural disaster. The challenge is open to all to participate
  and more information can be found at the [xview2](https://xview2.org) challenge site. ## xBD xBD is
  the name of the dataset that was generated for this challenge. The dataset contains over 45,000KM2 of
  polygon labeled pre and post disaster imagery. The dataset provides the post-disaster imagery with transposed
  polygons from pre over the buildings, with damage … thecvf.com/content_CVPRW_2019/papers/cv4gc/Gupta_Creating_xBD_A_Dataset_for_Assessing_Building_Damage_from_Satellite_CVPRW_2019_paper.pdf)
  for more information. # CMU SEI Baseline Submission ## About Our submission uses a combination of a
  localization polygon detection model and a classification model. ## Environment Setup During development
  we used `Python`'s `miniconda` This is recommended as it can help control dependencies and the version
  of those dependencies are imported easily without breaki … a activate $ENV_NAME`), or else the packages
  will be scattered and not easily found). ## Data Downloads The data during the challenge is available
  from [xView2](https://xview2.org) challenge website, please register or login to download the data!
  The current total space needed is: about **10GB** compressed and about **11GB** uncompressed. ### Other
  Methods If you are using our pipeline the best way to format data is like so (the pipeline scri … eed
  a directory for the files, and an output directory to write to. Below is a sample call to run the inference
  docker image for submission (this will output two of the same output files for scoring (scoring is done
  at the localization and classification stages, but we output the file at the end and would use the same
  polygons found in the localization stage anyways). `$ docker run -v /local/path/to/xBD/folder/with/images/:/submission/
  -v /local/path/to/out … -volcano/images/guatemala-volcano_00000023_post_disaster.png /output/test/loc.png
  /output/test/dmg.png` ### Output The output will be two identical grey scale PNG with the following
  pixel values: ``` 0 for no building 1 for building found and classified no-damaged 2 for building found
  and classified minor-damage 3 for building found and classified major-damage 4 for building found and
  classified destroyed ``` See the code we use to translate the json outputs to this submission image
  [inference_image_output.py](./utils/inference_image_output.py), also see the submission rules on the
  [xview2 website](ht"

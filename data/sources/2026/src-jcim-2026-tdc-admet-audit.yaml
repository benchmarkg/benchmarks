quote_extract: nding model can actually be reproduced and deployed by an independent researcher. In
  this work, we audit whether the top-ranked TDC ADMET models meet that bar. We assessed the
  top-ranked models of all 22 TDC ADMET leaderboards from the perspective of an end user with access
  only to the publicly released artifacts of each modelits publication, code repository, and
  installation instru … eported performance. The remaining models failed because of unavailable
  code, nonreproducible environments, runtime incompatibilities, or methodological flaws. We traced
  direct or indirect data leakage in the MiniMol, GradientBoost, and XGBoost models, and used
  deliberately overfitted variants of our own Mol2Vec-based models to show that tuning on the public
  test setwhether accidental or intentionalcan substantially inflate both metrics and leaderboard
  rank. These results indicate that current TDC leaderboard positions cannot be read as a direct
  measure of model quality and practical applicability and emphasize the urgent need for better
  public ADMET benchmarks based on the hidden test sets, strict data set versioning and model
  submission with standardiz … instantly compare their results with the cutting-edge rivals. ,
  However, the availability of fully open data sets is both an advantage and a serious drawback.
  Open train-test split introduces the risk of deliberate cheating or unintentional model adaptation
  to a specific test set. , When a test set remains publicly available for years, researchers may
  implicitly optimize architectures or hyperparameters to maximize performance on that sp … not
  merely a consequence of pervasive overfitting. However, a markedly different picture emerges when
  analyzing the sensitivity of leaderboards to overfitting. Our deliberately overfitted models
  entered the top-3 in 10 out of 22 end points, whereas “honest” models did so in only 2 out of 22.
  This contrast demonstrates that public leaderboards are highly susceptible to accidental or

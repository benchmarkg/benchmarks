  benchmarks. CTW1500 [34] (1,000/500 train/test images, 14-point polygon annotations) targets
  curved text at the line level. ICDAR 2015 [35] (1,000/500 images, word-level quadrilaterals)
  contains blurry, multi-oriented text from a wearable camera. Total-Text [36] (1,255/300 images,
  polygon annotations) covers horizontal, multi-oriented, and curved word instances. We report
  Precision, Recall, and F1 for detection (IoU ≥ 0.5), and end-toend H-mean under None

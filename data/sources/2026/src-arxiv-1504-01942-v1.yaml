  challenges on a regular basis, similar in spirit to the widely known PASCAL VOC series [19], or the
  ImageNet competitions [42]. The main differences t … which we use half for training and half for testing.
  The annotations of the testing sequences will not be released in order to avoid (over)ﬁtting of the
  methods to the speciﬁc sequences. Nonetheless, the test data contains over 10 minutes of footage and
  61440 annotated bounding boxes, therefore, it is hard for algorithms to overtune on such a large amount
  of data. This is one of the major strengths of the benchmark. Sequences are very different from each

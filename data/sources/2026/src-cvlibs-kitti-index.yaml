  Commons Attribution-NonCommercial-ShareAlike 3.0 License. This means that you must attribute the work
  in the manner specified by the aut … e on Computer Vision and Pattern Recognition (CVPR)}, year = {2015}
  } Changelog 25.2.2021: We have updated the evaluation procedure for Tracking and MOTS. Evaluation now
  uses the HOTA metrics and is performed with the TrackEval codebase. 04.12.2019: We have added a novel
  benchmark for multi-object tracking and segmentation (MOTS)! 18.03.2018: We have added novel benchmarks
  for semantic segmentation and semantic instance segmentation! 11.12.2017: We have added novel benchmarks
  for depth completion and single image depth prediction! 26.07.2017: We have added novel benchmarks for

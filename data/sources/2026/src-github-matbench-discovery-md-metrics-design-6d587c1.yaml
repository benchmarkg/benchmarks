quote_extract: "# MD benchmark metric design Rationale for the molecular-dynamics (finite-temperature)
  task metrics: each metric scores how well an MLIP's NVT trajectory reproduces the ab-initio MD references
  (DynaMat v1.0, 17 systems, 293–1500 K) on structural, dynamical, and thermodynamic observables. The
  public reference artifact intentionally omits energies and forces so it cannot be used as a supervised
  validation set. Energy/force RMSEs remain displayable private-label diagnostics computed only by maintainer
  infrastructure. This records what each metric measures … across models it has Spearman r = 0.91 with
  `vdos_error`, 0.92 with `adf_error` and 0.94 with `force_rmse` (the highest force correlation of any
  observable), so it double-counts structural accuracy. Dropping it from CMDS changes model rankings by
  at most 1 place (Spearman 0.9994 between the 3- and 4-component scores over N=34 models). **Paper lineage.**
  `rdf_error`, the pressure metrics (`pressure_mae`, `pressure_error`) and `vdos_error` track the reference
  paper's MD observables. `adf_error` and `combined_score` (CMDS) are Matbench *additions* not in the
  paper. `vdos_error` keeps the paper's observable but swaps its L1 spectral overlap for a W1/σ_ref distance
  (see below). Single-point energy/force RMSEs require private supervised AIMD labels and are intenti
  … ong the worst models. Pressure is the least correlated with the other observables and the hardest
  to predict (often attributed to noisy stress labels in large training sets). ## Combined score (CMDS)
  CMDS is a weighted mean of four subscores in [0,1], higher is better: the observables `vdos_error`,
  `adf_error` and `pressure_error` (each with subscore `1 − error/100`) plus **speed** — the summed steady-state
  NVT rollout wall time `cost.run_time_sec` (model load/com … CMDS loss | | ---------------- | ----------
  | -------------------------- | | `adf_error` | 2.0 | 2% | | `vdos_error` | 24.2 | 30% | | `pressure_error`
  | 54.8 | **68%** | Empirically `pressure_error` alone explains **R² ≈ 0.9** of the CMDS ranking — CMDS
  is largely a pressure ranking. Aggregation options considered: - **raw-error mean** (kept): simple;
  lets the largest-magnitude (hardest) error dominate. - **Lehmer mean** `Σx²/Σx`: amplifies t … eighted
  mean of raw-error subscores** as a `[0,1]` score (no roster-dependent calibration). Naming/semantics:
  it is a *score* (higher = better), distinct from the component *errors* (lower = better). CMDS is **not
  stored** in model YAMLs (only its components are): the site computes it on the fly like CPS, so a formula
  change can never leave stale scores behind, and users can reweight the components live via the radar-chart
  UI on the MD task page. ## Decisions"

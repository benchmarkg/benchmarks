quote_extract: "quantitatively measure how well it works with various LLMs. This directory holds the harness
  and tools needed to run the benchmarking suite. ## Background The benchmark is based on the [Exercism](https://github.com/exercism/python)
  coding exercises. This benchmark evaluates how effectively aider and LLMs can translate a natural language
  coding request into executable code saved into files that pass unit tests. It provides an end-to-end
  evaluation of not just the LLM's coding ability, but also its capacity to *edit existing code* and *format
  those code edits* so that aider can save the edits to the local source files. See [this writeup for
  a longer discussion about the benchmark](https://aider.chat/2024/12/21/polyglot.html). The benchmark
  is intended to be run *inside a docker container*. This is because the benchmarking harness will be
  taking code written by an LLM and executing it without any human review or supervision! The LLM could
  generate dangerous python that harms your system, like this: `import os; os.system(\"sudo rm -rf /\"\
  \ … nts: 0 syntax_errors: 1 indentation_errors: 0 exhausted_context_windows: 0 test_timeouts: 1 command:
  aider --sonnet date: 2024-07-04 versions: 0.42.1-dev seconds_per_case: 17.6 total_cost: 3.6346 ``` The
  key statistics are the `pass_rate_#` entries, which report the percent of the tasks which had all tests
  passing. There will be multiple of these pass rate stats, depending on the value of the `--tries` parameter.
  The yaml also includes all the settings which were in effect for the benchmark run. It also reports
  the git hash of the repo at the time that the benchmark was run, with `(dirty)` if there were uncommitted
  changes. It's good practice to commit the repo before starting a benchmark run. This way the `model`,
  `edit_format` and `commit_hash` should be enough to reliably reproduce any benchmark run. You can see
  examples of the benchmark report yaml in the [aider leaderboard data files](https://github.com/Aider-AI/aider/blob/main/aider/website/_data/).
  ## Limitations, notes - Contributions of benchmark results are welcome! Submit results by opening a
  PR with edits to the [aider leaderboard data files](https://github.com/Aider-AI/aider/blob/main/aider/website/_data/).
  - These scripts are not intended for use by typical aider end users. - Some of these tools are written
  as `bash` scripts, so it will be hard to use the"

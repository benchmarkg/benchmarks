quote_extract: "otech and pharma to participate in the CACHE Challenges to predict small molecules (hits)
  that bind to predefined disease-associated protein targets. In 2024, Conscience became the steward for
  the CACHE Challenges, which were originally launched by the SGC. Each CACHE Challenge will focus on
  a specific protein target of biological or pharmaceutical relevance. Participants will predict hits
  and CACHE will validate these hits experimentally. Each competition includes a hit-finding and a hit
  expansion round of prediction and experimental testing after which all data, including chemical structures,
  will be made publicly available without restrictions on use. Details on the workflow of CACHE Challenges
  can be found here. Subscribe to the Conscience mailing list to receive information about CACHE or their
  o … nomics Consortium (SGC), the labs of Damian Young at Baylor College of Medicine and Neelagandan
  Kamariah at InStem, IBM (DREAM) and Sage Bionetworks, with logistical and technical support from Conscience
  and BEACON. All data and results will be shared openly and publicly. The Scientific Challenge In this
  DEL-ML challenge, participants are invited to retrospectiv … ich will take place via Zoom on July 7,
  9am EDT/ 3PM CEST. Last date to apply is: Wed, 09/30/2026 - 00:00 Challenge #8 Finding Ligands Targeting
  GID4 The eighth CACHE challenge is focused on GID4, the substrate-binding unit of the CTLH ubiquitin
  ligase complex. Compounds binding GID4 can lead to targeted protein degradation strategies that hig

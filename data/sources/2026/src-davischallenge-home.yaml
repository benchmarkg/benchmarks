quote_extract: "Annotated VIdeo Segmentation In-depth analysis of the state-of-the-art in video object
  segmentation The standalone DAVIS initiative is in maintenance mode: we won't be hosting any more DAVIS
  challenges and we will no longer update the benchmark leaderboards on this page. We have integrated
  the existing results into paperswithcode and you can enter the results for you latest paper in their
  corresponding task web pages: Semi-supervised Interactive Unsupervised Also, we will continue running
  the evaluation servers in Codalab. We would like to thank the community for taking part in the challenges
  and we encourage everyone to keep using the datasets for video object segmentation or any other task!
  Datasets DAVIS 2016: In each video sequence a single instance is annotated. DAVIS 2017 Semi-supervised:
  In each video sequence multiple instances are annotated. DAVIS 2017 Unsupervised: In each video sequence
  multiple instances are annotated. Semi-supervised and Unsupervised refer to the level of human interaction
  at test time, not during the training phase. In Semi-supervised, better called human guided, the segmentation
  mask for the objects of interest i … lts from all techniques, and the code to reproduce the evaluation.
  Contributions from the community These are the papers and projects in which the community has augmented
  our datasets: Referring expression annotations for DAVIS 2016 and DAVIS 2017 It contains the referring
  expression given the first frame to two annotators in DAVIS 2016 and DAVI"

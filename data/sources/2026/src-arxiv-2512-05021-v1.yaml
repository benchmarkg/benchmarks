  primarily utilized for assessing HTR model capabilities on historical, complex European handwriting.
  IAM Dataset. The IAM dataset is a widely adopted benchmark for offline HTR, specifically focusing on
  modern English. It aggregates handwritten transcriptions from the LOB corpus, contributed by 657 distinct
  writers across 1,539 scanned pages. Following the common research standard, the line-level subset is
  split into 6,482 lines for training, 976 lines for validation, and 2,915 lines for testing. All images
  are provided in grayscale at 300 dpi. Our study utilizes this standard line-level partition of IAM (as
  detailed in Tab. 1) to compare model performance against established state-of-the-art … nal markers.
  4.3. Evaluation Metrics To evaluate the performance of our model, we employ the standard met- rics for
  handwritten text recognition: Character Error Rate (CER) and Word Error Rate (WER). Character Error
  Rate (CER) is defined as the Levenshtein distance be- tween the predicted character sequence and the
  ground truth. It is calculated as the sum of character substitutions (Sc), insertions (Ic), and deletions
  (Dc) required to transform the prediction into the ground truth, normalized by the total number of characters
  in the ground truth (Nc). Formally, CER is expressed as: CER = Sc + Ic + Dc (7) Nc Word Error Rate (WER)
  is computed similarly but at the word level. It represents the sum of word substitutions (Sw), insertions

quote_extract: 'Published as a conference paper at ICLR 2024 CIRCUITNET 2.0: AN ADVANCED DATASET FOR PROMOTING
  MACHINE LEARNING INNOVATIONS IN REALISTIC CHIP DESIGN ENVIRONMENT … we collect more than 10,000 samples
  with a variety of chip designs (e.g., CPU, GPU, and AI Chip). All the designs are conducted through
  complete commercial design flows in a widely-used technology node, 14nm FinFET. We collect comprehensive
  data, including routability, timing, and power, from the design flow to support versatile ML tasks in
  EDA. … 3) Adding an additional timing prediction task for circuit performance to increase task diversity
  and practicality. … In practice, the samples within CircuitNet 2.0 and CircuitNet are orthogonal, which
  could be used together to further enrich the sample diversity for ML tasks. … We take the net delay
  prediction as an example, where the labels are edge features representing the propagation delays between
  pins of netlists. … Table 3: Results of net delay prediction. Dataset CircuitNet 2.0 CircuitNet 2.0
  Model MLP GNN R2 score 0.5223 ± 0.017 0.9262 ± 0.005 … For CircuitNet 2.0, we use 80 samples from RISCY,
  RISCY-FPU and Vortex as the training set, while using 20 samples from zero-riscy, NVDLA and OpenC910-1
  as the test set. The samples are randomly selected and fixed for all experiments. … We train on each
  group and test on the others using the same training setup. We use normalized root-mean-square error
  (NRMSE) and structural similarity index measure (SSIM) to evaluate the pixel-level accuracy and image
  similarity.'

quote_extract: 'k of understanding of the settings where current methods are effective. In this paper,
  we make progress towards solutions for these challenges, focusing on the task of named entity recognition
  (NER). We create the largest human-annotated NER dataset for 20 African languages, and we study the
  behavior of stateof-the-art cross-lingual transfer methods in an Africa-centric setting, demonstrating
  that the choice of source language signiﬁcantly affects performance. We show that choosing the best
  transfer language improves zero-shot F1 scores by an average of 14 points across 20 languages compared
  to using English. Our results highlight the need for benchmark datasets and models that cover typologically-diverse
  African languages. 1 Introduction Many African languages are spoken by millions or tens of millions
  … i et al., 2021a, 2022; Abdulmumin et al., 2022), and sentiment analysis (Yimam et al., 2020; Muhammad
  et al., 2022). In this paper, we focus on the standard NLP task of named entity recognition (NER) because
  of its utility in downstream applications such as question answering and information extraction. For
  NER, annotated datasets exist only in a few African languages (Adelani et al., 2021b; Yohannes and Amagasa,
  2022), the largest of which is the MasakhaNER dataset (Adelani et al., 2021b) (which w … rom either
  a monolingual or a translation corpus. Monolingual corpus We collect a large monolingual corpus for
  nine languages, mostly from local news articles except for chiShona and Kiswahili texts, which were
  crawled from Voice of America (VOA) websites.4As Yorùbá text was missing diacritics, we asked native
  speakers to manually add diacritics before annotation. During data collection, we ensured that the articles
  are from a variety of topics e.g. p … s per language. Translation corpus For the remaining languages
  for which we were unable to obtain sufﬁcient amounts of monolingual data, we use a translation corpus,
  MAFAND-MT (Adelani et al., 2022), which consists of French and English news articles translated into
  11 languages. We note that translationese may lead to undesired properties, e.g., unnaturalness. However,
  we did not observe serious issues during the annotation. The number of sentences is constrained by the
  size of the MAFANDMT corpus, which is between 4,800–8,000. 4.2 NER Annotation Methodology We annotated
  the collected monolingual texts with the ELISA annotation tool (Lin et al., 2018) with four entity types:
  Personal name (PER), Location (LOC), Organization (ORG), and date and time (DATE), similar to MasakhaNER
  1.0 (Adelani et al., 2021b). We made use of the MUC-6 annotation guide.5 The annotation was carried
  out by three native speakers per language recruited from AI/NLP communities in Africa. To ensure high-quality
  annotation, we recruited a language coordinator to supervise annotation in each language. We organized

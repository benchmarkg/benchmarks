  metrics are computed separately for each variable in the output vector. The mean absolute error (MAE)
  and the coefficient of determination (R2) are calculated independently at each horizontal and vertical
  location and then averaged horizontally and vertically to produce the summary statistics in Figure 2.
  For the vertically-varying fields, we first form a mass-weighting and then convert moistening and heating
  tendencies into common energy units in Watts per square meter as in Beucler et al. (2024). We also report
  continuous ranked probability scores (CRPS) for all considered models in SI. 4.4 Baseline Model Results

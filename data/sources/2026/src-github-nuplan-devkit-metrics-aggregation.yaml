quote_extract: "rajectory. Currently, the aggregation function is a hybrid hierarchical-weighted average
  function of individual metric scores: - The planner gets a zero score for that driven trajectory/scenario
  if - there is an at_fault collision with a vehicle or a VRU (pedestrian or bicyclist), or - there are
  multiple at_fault collisions with objects (e.g. a cone), or - there is a drivable_area violation, -
  ego drives into uncoming traffic more than 6 m, or - ego is not making enough progress. … tric| |drivable_area_compliance
  |0 if at any instance the distance of a corner of ego's bounding box from the drivable area is more
  than `max_violation_threshold`, 1 otherwise.|NA/multiplying metric| |driving_direction_compliance |Score
  is 1 if during the previous `time_horizon` (for each time instance) ego has not been driving against
  the traffic flow more than `driving_direction_compliance_threshold`, and 0 if it's been driving against
  the flow more than `driving_direction … _INTERSECTION, and an average score of 0.6 for 60 scenarios
  of type ON_PICKUP_DROPOFF, we may want to consider improving the performance in scenarios where ego
  is on PUDO area. ## Planner final score A planner is assigned a score between 0 and 1 based on its performance
  in multiple scenarios. A higher score shows a better performance. To assign a final score to a planner,
  it is run on N scenarios, and the driven trajectory scores in these N scenarios are averaged to score
  the planner."

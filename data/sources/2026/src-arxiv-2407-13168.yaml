  and realistic evaluations. We address this by examining LM capabilities to generate code for solving
  real scientific research problems. Incorporating input from scientists and AI researchers in 16 diverse
  natural science sub-fields, including mathematics, physics, chemistry, biology, and materials science,
  we create a scientist-curated coding benchmark, SciCode. The problems naturally factorize into multiple
  subproblems, each involving knowledge recall, reasoning, and code synthesis. In total, SciCode contains
  338 subproblems decomposed from 80 challenging main problems, and it offers optional descriptions specifying

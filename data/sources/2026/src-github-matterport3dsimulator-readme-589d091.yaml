  to mark the first release we have tagged it as [v0.1](https://github.com/peteanderson80/Matterport3DSimulator/tree/v0.1)
  for any users that don't want to change to the new version. ## Features - Dataset … recise details of
  the agent's observations and actions are [described below](#simulator-api) and in the paper. ### Room-to-Room
  (R2R) Navigation Task The simulator includes the training data and evaluation metrics for the Room-to-Room
  (R2R) Navigation task, which requires an autonomous agent to follow a natural language navigation instruction
  to navigate to a goal location in a previously unseen building. Please refer to [specific instructions](tasks/R2R/README.md)
  to setup and run this task. There is a test server and leaderboard available at [EvalAI](https://evalai.cloudcv.org/web/challenges/challenge-page/97/overview).

quote_extract: 'mprovement of RNA three-dimensional structure prediction. With agreement from structural
  biologists, RNA structures are predicted by modeling groups before publication of the experimental structures.
  We report a large-scale set of predictions by 18 groups for 23 RNA-Puzzles: 4 RNA elements, 2 Aptamers,
  4 Viral elements, 5 Ribozymes and 8 Riboswitches. We describe automatic assessment protocols for comparisons
  between prediction and experiment. Our analyses reveal some critical steps to be overcome to achieve
  good accuracy in modeling RNA structures: identification of helix-forming pairs and of non-Watson–Crick
  modules, correct coaxial stacking between helices and avoidance of entanglements. Three of the top four
  modeling groups in this round also ranked among the top four in the CASP15 contest. The results of the
  Fifth RNA-Puzzles contest highlights advances in RNA three-dimensional structure prediction and uncovers
  new insights into RNA folding and structure. Subject termsStatistical metho … noncovalent interactions
  involving the negatively charged phosphates, the stacking of the nucleobases and the hydrogen bonding
  between bases as well as between nucleotides. To address this challenge, the RNA-Puzzles project was
  established 12 years ago as a community-wide experiment to regularly evaluate the state of the art in
  RNA structure prediction1–4. The overall process is as follows. The organizers (E.W. or Z.M.) are contacted
  by a structural biologist who has solved and is about to publish an RNA-containing structure. The RNA
  sequence is confidentially distributed to the modeling groups that accepted to take part in the RNA-Puzzles
  contest. After taking into account the time span before publication of the data, a … 3–4 weeks for human-based
  predictions and 48 h for computer-only webserver predictions without human intervention). The name of
  the structural biologist group is not disclosed to the modeling groups. The process is thus double blind;
  the structure group is unknown to all and the structure is not present in any database. Each modeling
  group is entitled to use any technique or tool available to get insight on the RNA fold in human-based
  modeling. Later (see below), the modeling group has the opportunity to describe the tool and strategy
  used for the modeling. The project provides sequences, and occasionally additional data for a set of
  RNAs, … pated in this round. See Methods for descriptions of the prediction tools used by each group.
  Each modeling group may submit sets of results obtained from multiple prediction approaches or protocols.
  Both automatic webserver predictions and predictions that include human-based input are received (within
  different deadlines) and analyzed separately. Of the 18 modeling approaches, only one is based on deep
  learning (Kollmann). In the Supplementary Note, the sequences of all Puzzles can be found with, when
  applicable, a description of the sequence differences between the experimental and the modeled structures.

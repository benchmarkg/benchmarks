quote_extract: "# Evaluation Methodology All tasks are evaluated using a rubric-based methodology. Every
  task defines its rubric inline in `task.json` as a list of equally-weighted pass/fail criteria that
  an LLM judge grades individually. There is no separate gold standard file -- each criterion's `match_criteria`
  field describes exactly what the judge should look for in the agent's output. Two **LLM judges** (default:
  `claude-sonnet-4-6` and `gpt-5.5`) independently read the agent's output and evaluate it against each
  criterion's `match_criteria`. No keyword matching or regex is used; every comparison is semantic. No
  golden reference output is needed. The rubric schema handles every shape of legal work product: drafting
  tasks graded on quality dimensions, issue-spotting tasks where specific findings must appear, and structured
  deliverables where d … text. 4. The judge returns `\"pass\"` or `\"fail\"` with reasoning. The task
  score is binary, computed as: ``` score = 1.0 if every criterion passed else 0.0 ``` This is the **all-pass**
  grading scheme. A task is only marked pass if every rubric criterion passes — there is no partial credit
  at the task level. There is no partial credit within a criterion either: each one passes or fails. There
  is no golden reference output -- the judge evaluates the agent's … `ALL PASS` / `MISSED N` badge in
  the summary tile. Rubric authors should keep this in mind: criteria that are \"nice-to-have\" padding
  drag down the all-pass rate without surfacing real quality signal. Rubrics should ideally contain the
  criteria that a supervising attorney would actually check before sending work to a client — nothing
  more. ### Standard dual-judge profile `evaluation.run_eval` grades each saved trajectory independently
  with the standard LAB judge pair by default: - `claude-sonnet-4-6` - `gpt-5.5` The eva … dual pair;
  averages both judges and writes scores_dual.json --judges claude-opus-4-8 gpt-5.5 ``` The flag accepts
  one or two distinct models. The exact standard pair is tagged `lab-standard-dual-v1`; any other two-model
  pair is tagged `custom-dual` so comparison reports can distinguish standard runs from experiments. `--judge-model`
  and `--dual` remain accepted as deprecated compatibility aliases. Across multiple tasks, the comparison
  output includes both existing LAB criterion diagnostics: - `criterion_pass_rat … ooled`: total passed
  criteria divided by total criteria, giving each criterion equal weight. The existing `criterion_pass_rate`
  field remains an alias for the pooled value for backward compatibility. The canonical headline remains
  the averaged all-pass rate; strict both-agree all-pass is reported separately. ## Example Output In
  single-judge mode, `scores.json` looks like this: ```json { \"run_id\": \"real-estate/extract-psa-key-terms/scenario-01/claude-sonnet-4-6-high/20260428-142301\"\
  , \"task\": \"real-estate … d not address the 30% revenue concentration...\" } ], \"judge_model\": \"\
  claude-sonnet-4-6\", \"scored_at\": \"2026-03-18T22:18:00+00:00\", \"doc_coverage\": { ... }, \"cost\"\
  : { ... } } ``` ## Tasks and Coverage The benchmark contains 2,010 tasks across 27 practice areas, with
  ~114,000 rubric criteria. All tasks use rubric evaluation. Largest practice areas: - **Corporate M&A**
  (156 tasks) - **Intellectual Property** (147 tasks) - **Private Equity & Venture Capital** (99 tasks)
  - **Corporate Govern … ld serves as the evaluation standard directly -- it describes what a passing
  answer looks like, what facts must appear, or what analysis must be performed. ### Design Decisions
  - **Temperature 0.0**: The judge runs deterministically to maximize reproducibility across evaluation
  runs. - **Binary verdicts**: No partial credit. This keeps scoring simple and interpretable -- every
  criterion is either satisfied or not. - **Semantic matching**: The judge is instructed to match on subst"

quote_extract: "ClimateBench ClimateBench is a benchmark dataset for climate model emulation inspired
  by [WeatherBench](https://github.com/pangeo-data/WeatherBench). It consists of NorESM2 simulation outputs
  with associated forcing data processed in to a consistent format from a variety of experiments performed
  for CMIP6. Multiple ensemble members are included where available. The processed training, validation
  and test data can be obtained from Zenodo: [10.5281/zenodo.5196512](https://doi.org/10.5281/zenodo.5196512).
  The ClimateBench Paper was published in [AGU JAMES](https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2021MS002954)
  on September 2022. ## Leaderboard The spatial, global and total NRMSE of the different baseline emulators
  for the years 2080-2100 against the ClimateBench task of estimating key climate variables under future
  scenario SSP245. The models are ranked in order of the mean of the total NRMSE across all tasks. | |
  ('tas', 'Spatial') | ('tas', 'Global') | ('tas', 'Total') | ('diurnal_temperature_range', 'Spatial')
  | ('diurnal_temperature_range', 'Global') |"

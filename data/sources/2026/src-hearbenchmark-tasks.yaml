  that are categorized into ten genres (100 tracks per genre). The task is multiclass classification.
  As per the literature, scores are averaged over 10 folds. However, we don’t used the corrected artist-conditional
  splits from (Sturm, 2013). GTZAN Music Speech is a binary classification task, where the goal is to
  distinguish between music and speech. The dataset consists of 120 tracks (each 30 seconds in duration)

  a novel audio classification task developed using the Beijing Opera Percussion Instrument Dataset. The
  Beijing Opera uses six main percussion instruments that can be classified into four main categories:
  Bangu, Naobo, Daluo, and Xiaoluo. There are 236 audio clips. Scores are averaged over 5-folds. CREMA-D

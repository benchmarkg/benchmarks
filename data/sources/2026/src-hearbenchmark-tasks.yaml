  a unique dataset: gunshots recor … aset in HEAR. Each shot is recorded using four different iPod Touches,
  located at different distances from the shooter. The goal of this task is to classify audio by the iPod
  Touch that recorded it, i.e., to identify the location of the microphone. The dataset was split into

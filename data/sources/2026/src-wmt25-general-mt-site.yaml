quote_extract: ': Added WMT24++ testset and removed Irish from multilingual subtask. 2025-02-20: The shared
  task announced. DESCRIPTION Formerly known as News translation task of the WMT focusses on evaluation
  of general capabilities of machine translation (MT) systems. Its primary goal is to test performance
  across a wide range of languages, domains, genres, and modalities. Systems are … ask, there are two
  separate subtasks: Test suite subtask - design challenge testset and analyze the system translations
  Multilingual subtask - develop a system that can translate into multiple languages simultaneously. The
  participating system needs to translate all General MT + additional 15 languages The goals of the shared
  translatio … ional context: video, image Testset will be document-level by default rather than paragraph-level
  with document context Redefined constrained/open/closed tracks. Only two tracks: constrained open weights
  track - any public training data allowed, any public model smaller than 20B is allowed, model … Anywhere
  on Earth (AoE) Finalized task details February 2025 Final test suite source texts must reach us 12th
  June 2025 Test data released 19th June 2025 Translation submission deadline 3rd July 2025 System description
  abstract paper 10th July 2025 Translated test suites shipped back to test suites authors 17th July 2
  … ethod is interesting but not state-of-the-art, then please participate in order to disseminate it
  and measure progress. Participants will use their systems to translate a testset of unseen documents.
  The translation quality is measured by a human evaluation and various automatic evaluation metrics.
  You may participate … s distilling. you are required to release the model weights under some open source
  license before camera-ready deadline Unconstrained track - track that do not place any limitations,
  neither requires publishing the model. Closed systems such as GPT are part of this track. Although we
  no longer restric training data, we currated corpora tha … fferences in domains for non-English source
  languages. All testsets will be provided as a document-level. Speech domain The speech domain is going
  to be released with the original video together with machine generated transcript. We will use only
  the original video as a source for human evaluation. All testsets will contain the transcript which
  wi … e last minute). Use verification script to double check submission You won’t get any feedback on
  your system in OCELoT, human references do not exist at the time of submission. You may use quality
  estimation (e.g. CometKiwi) to check if everything is well translated. Select the primary system i …
  e with a system description paper, you may already submit the system description paper if you want.
  Verification script We are releasing a script wmt_gen_mt_tool.py to simplify handling the blindset.

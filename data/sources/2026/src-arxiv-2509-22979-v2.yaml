  examine six mainstream benchmarks, including IndustryOR and MAMO-Complex, and find that about 30-50%
  of the data are problematic; they discard these instances and release a curated subset containing only
  validated problems. Several prompting strategies have been developed to im … n the benchmarks themselves:
  missing or ambiguous problem data, incorrect reference answers, and rounding inconsistencies in the
  evaluation pipeline, resulting in 30% - 60% test instances being incorrect. Despite recent efforts to
  clean these benchmarks (Tang et al., 2024; Chen et al., 2025), such issues remain widespread. To ensure
  the reliability of … es. After cleaning, we observe a remarkable gain in the accuracy across all three
  benchmarks. With the same gpt-oss-20b model and inference strategy, the average accuracy increases from
  40%–60% on the original releases to 70%–90% on our corrected sets. We will release our fixes and annotations
  for each problem to make results comparable across papers and better reflect true model ability. 5 EXPERIMENTS

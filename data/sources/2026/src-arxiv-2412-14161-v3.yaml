  or sharing of output, such as posting messages or asking for additional information to complete the
  task. Evaluators Checkpoints are created in the task design phase, but for actual evaluation, each of
  the checkpoints must be concretely implemented through an evaluator – a program that checks the completion
  of the checkpoint. These evaluators are implemented by examining environment states, such as the local
  workspace, intranet status, simulated colleague interactions, or by analyzing agent trajectories, like
  verifying browsing history or action sequences. In most cases, these evaluators are deterministic and
  written as simple Python functions. For instance, in the SWE task in Table 3, the checkpoints are deterministic:

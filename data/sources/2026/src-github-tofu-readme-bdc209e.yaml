quote_extract: 'BRANCH** ⚠️ **The original repository has now moved to [https://github.com/locuslab/open-unlearning](https://github.com/locuslab/open-unlearning)**
  **This is just for legacy maintenance.** The TOFU dataset serves as a benchmark for evaluating unlearning
  performance of large language models on realistic tasks. The dataset comprises que … - [**Summary on
  Twitter**](https://x.com/_akhaliq/status/1745643293839327268): A concise summary and key takeaways from
  the project. ## Updates 03/18 We have updated a new evaluation pipeline, see the following section on
  model evaluation. We notice that Llama2 model has reproducibility issue due to the internal randomness
  of flash attention. You are encouraged to collect your own retain results. Our huggingface leaderboard
  results and the numbers/figures in the paper are also subject to update. Feel free to contact us if
  you run into any issue! ## Applicability 🚀 The dataset is in QA format, making it ideal for use with
  popular chat models s … pports `Phi-1.5`, and `Llama2-7b chat` models. But newer models can directly
  be added in the `model_config.yaml` file. For the unlearning challenege, we fine-tuned `Phi-1.5` for
  5 epochs using a maximum learning rate of `2e-5`, and the `Llama2-7b chat` model for the same duration
  at `1e-5`. Finetuning can be done as follows: ``` master_port=18765 split=full model=phi lr=2e-5 CUDA_VISIBLE_DEVICES=0,1
  torchrun --nproc_per_node=2 --master_p … regated_retain_result}` are the path to your `eval_log_aggregated.json`.
  The retain results are uploaded in `data/`. ### Available forget sets are: - `forget01`: Forgetting
  1% of the original dataset, all entries correspond to a single author. - `forget05`: Forgetting 5% of
  the original dataset, all entries correspond to a single author. - `forget10`: Forgetting 10% of the
  original dataset, … cle model. ### Push to Leaderboard Head over to our [**Leaderboard on Hugging Face
  Spaces**](https://huggingface.co/spaces/locuslab/tofu_leaderboard) and drop your evaluated results file!

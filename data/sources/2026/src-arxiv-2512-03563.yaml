quote_extract: "mba, a Mamba-based audio representation model for wildlife sounds. We pre-train a BioMamba
  using self-supervised learning on a large audio corpus and evaluate it on the BEANS benchmark across
  diverse classification and detection tasks. Compared to the state-of-the-art Transformer-based model
  (AVES), BioMamba achieves comparable performance while significantly reducing VRAM consumption. Our
  results demonstrate Mamba's potential as a computationally efficient alternative for real-world environmental
  monitoring. Subjects: Sound (cs.SD)"

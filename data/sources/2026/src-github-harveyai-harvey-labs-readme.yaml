quote_extract: "Legal Agent Benchmark (LAB): An open-source benchmark for evaluating agents on real legal
  work. Harvey LAB is an open-source project aimed at benchmarking LLM agents' abilities to perform legal
  work in realistic environments. LAB consists of two parts: a dataset of *tasks* containing agent instructions,
  documents, and rubrics as well as an *execution harness* for running and evaluating agents against those
  tasks. LAB is an ongoing project and we expect to consistently add to and refine the task set and execution
  harness. Read the announcement post: [Introducing Harvey's Legal Agent Benchmark](https://www.harvey.ai/blog/introducing-harveys-legal-agent-benchmark)
  ## Getting Started Start with the full walkthrough in ** … utorial.md](docs/tutorial.md)** — it takes
  one realistic M&A data-room assignment end to end: setup, task inspection, agent run, scoring, report
  review, and comparison dashboards. ## Use As A Library The harness and grader ship as the `lab-core`
  Python package (import name `lab_core`), built as a wheel on every [release](https://github.com/harveyai/harvey-labs/releases):
  ```bash uv add \"lab-core @ https://github.com/harveyai/harvey-labs/releases/download/v … arvey.ai/blog/introducing-harveys-legal-agent-benchmark}}
  } ``` In the paper, also name the [release](https://github.com/harveyai/harvey-labs/releases) (for example
  `v1.3.0`) or commit you evaluated. Scores from different releases are not always comparable, and [`CHANGELOG.md`](CHANGELOG.md)
  lists each change that moves scores."

  basin, whereas the HURSAT dataset encompasses all basins. Spatial resolution The Digital Typhoon dataset
  possesses a spatial resolution of approximately 5km, superior to the HURSAT dataset’s roughly 8km (0.07
  degree). A small-scale structure such as the eye of a tropical cyclone is more sensitive to spatial

quote_extract: 'ion model towards efficient video representation learning. Starting from pretrained DINO-v3
  and DeiT-v3 image encoders, VideoMSN achieves state-of-the-art performance on Kinetics-400, UCF101,
  and HMDB51 while requiring up to 32× fewer and 160× fewer video pretraining epochs compared to prior
  video selfsupervised learning … oned. We used AdamW optimizer with a weight decay of 0.01 and follow
  a cosine learning rate scheduler for all datasets. For evaluation, we used 5 clips × 3 crops for Kinetics-400
  and UCF101, 10 clips × 3 crops for HMDB51 and 2 clips × 3 crops setup for SSV2. Performances are shown
  in terms of Top-1 accuracy averaged across 2 random seeds, unless otherwise mentioned. Choosing hyperparameters.
  We identified some crucial hyperparameters by conducting a sweep … on a representative subset of the
  Kinetics-400 training set, created by randomly subsampling 25% of the data per class. The configuration
  that maximized performance on the full validation set was subsequently adopted for all experimental
  benchmarks. More details of this analysis are provided in the Appendix. C … .0 80.8 78.1 80.8 80.2 81.2
  80.8 80.8 81.3 80.0 81.6 81.5 81.7 81.8 83.1 82.0 83.3 Table 1: Comparison on Kinetics-400. Our VideoMSN
  is initialized from pretrained image ViT weights followed by pretraining and fine-tuning on Kinetics-400.
  We achieve superior top-1 accuracy in both VideoMSN-DeiT and VideoMSN-DINO after pretraining only for
  50 and 10 epochs'

quote_extract: 'PL). This highlights the effectiveness of our proposed multi-layer representation and
  the VLM-guided reasoning policy in improving object navigation. Specifically, STRIVE achieves 62.9%
  SR and 34.2% SPL on HM3D-v1, 79.6% SR and 38.7% SPL on HM3d-v2, 68.1% SR and 36.3% SPL on RoboTHOR,
  and 52.3% SR and 23.1% SPL on MP3D. Besides, we also conduct 15 real-world experiments across 10 different
  indoor environments on a Mecanum wheel platform [16], demonstrating the effectiveness and robustness
  of our method in real-world scenarios. I … t and only perform one VLM re-verification at that viewpoint.
  This strategy improves detection accuracy without sacrificing navigation efficiency. IV. EXPERIMENT
  A. Experiment Setup We evaluate our method by comparing it with state-of-theart methods on the Object
  Navigation task in Habitat [45] simulator. We also conduct real-world experiments across diverse environments.
  Dataset: We perform simulated experiments on 4 datasets: 1) HM3D-v1 [12], including 2000 episodes across
  20 highfidelity scenes with 6 target object categories. 2) HM3Dv2 [45], including 1000 episodes across
  36 high-fidelity scenes with 6 target object categories. 3) RoboTHOR [14], including 1800 episodes across
  15 scenes with 12 target object categories. 4) MP3D [15], including 2195 episodes across 11 scenes with
  21 target object categories. Evaluation Metrics: Following [13], we use 4 metrics to evaluate the performance:
  1) Success Rate (SR): the percentage of episodes in which the agent reaches th … stance to Goal (DTG):
  the final distance to the target object at the end of the episode. 4) SoftSPL: replacing the binary
  success term in SPL with a “soft” value that indicates the progress made by the agent towards the goal.
  Implementation Details: Each episode allows a maximum of 500 steps and a success distance of 1.0m. The
  agent observes the environment using a 640 × 480 RGB-D image, with depth values from 0.5m to 5.0m and
  a horizontal field of view (HFOV) of 79◦. The camera is mounted 0.88m above the ground. The agent moves
  forward by 0.25m per step and rotates by 30◦. For VLM, we use Gemini [3] (gemini-2.0flash), and for
  object detection and segmentation, we use MM-GroundingDINO [39] and SAM [40]. All experiments are conducted

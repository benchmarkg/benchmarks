quote_extract: "# DDXPlus: A New Dataset For Automatic Medical Diagnosis [**Project page**](https://mila-iqia.github.io/ddxplus/)
  *Appearing in NeurIPS 2022 dataset and benchmark track* We are releasing under the CC-BY licence a new
  large-scale dataset for Automatic Symptom Detection (ASD) and Automatic Diagnosis (AD) systems in the
  medical domain. The dataset contains patients synthesized using a proprietary medical knowledge base
  and a commercial rule-based ASD system. Patients in the dataset are characterized by their socio-demographic
  data, a pathology they are suffering from, a set of symptoms and antecedents re … arxiv.org/abs/2205.09148).
  - The **dataset** in **French** is hosted on [figshare](https://figshare.com/articles/dataset/DDXPlus_Dataset/20043374).
  - This is the original version of DDXPlus that all results in our paper were obtained on. - Starting
  from 9 May 2023, the **dataset** is also available in **English** for easier use. This version is hosted
  on [figshare](https://figshare.com/articles/dataset/DDXPlus_Dataset_English_/22687585). - The English
  version of DDXPlus contains the same data in the same format as the French version. - Wherever possible,
  English names or non-semantic codes are used instead of French names. - Using the English version should
  lead to the same performance as using the French version. Looking for a text version? We're hoping to

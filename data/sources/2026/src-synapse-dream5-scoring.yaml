quote_extract: 'iction files), precision is defined as the fraction of correct predictions to k, and recall
  is the proportion of correct predictions out of all the possible true connections. Other metrics such
  as the area under the ROC curve will also be evaluated. Teams will be ranked according to their overall
  performance over the four networks of a challenge. For a detailed discussion of the submission format
  and scoring metrics, refer to [Prill et al., PLoS ONE, 5:e9202, (2010) and Marbach et al., PNAS, 107:6286-91,
  (2010).](http://www.ncbi.nlm.nih.gov/pubmed/20186320) ${buttonlink?text=Scoring Scripts & data&url=#!Synapse:syn2787214&highlight=true}
  ### PR and ROC curves To score the ranked lists of interactions against a binary gold standard, performance
  was assessed by the area under the ROC curve (AUROC, true positive rate vs. false positive rate) and
  … ubmitted shorter lists). Edges not included in the list are thus effectively predicted to be absent.
  We extended the PR and ROC curves in an analytical way after the end of the list by assuming a random
  ordering of the remaining edges, as described. Note that AUROC values can vary by up to 7.5 percentage
  points when considering truncated vs. full lists of predictions (the AUPR values, on the other hand,
  don’t vary significantly). Note that predictions for transcription factors and genes that are not part
  of the gold standard, _i.e._, for which no experimentally supported interactions exist, were ignored
  in this … ose to construct random edge lists by sampling edges from the submitted edge lists of the
  participants. By design, an “average” performance should have a _p_-value of approximately 0.5 for the
  two metrics. We call this procedure “grading on a curve” since the _p_-values are designed to identify
  the best and worst relative performance but have no absolute interpretation. ROC score = $$\(\frac{1}{3}\sum_{i=1}^{3}-\log_{10}p_{ROC_i}\)$$
  PR score = $$\(\frac{1}{3}\sum_{i=1}^{3}-\log_{10}p_{PR_i}\)$$ Overall scores are derived from the AUPR
  or the AUROC for the three different networks by calculating the geometric mean of the network specific
  _p_-values. We report the negative log10 of this value as a score, or equivalently, Finally, an overall
  score is obtained as the mean of the AUROC and AUPR derived scores. A high score corresponds thus to
  low (significant) _p_-values'

quote_extract: "forces\\\" https://arxiv.org/abs/2007.09593 The molecules are taken from the original
  MD17 dataset by Chmiela et al., and 100,000 structures are taken, and the energies and forces are recalculated
  at the PBE/def2-SVP level of theory using very tight SCF convergence and very dense DFT integration
  grid. As such, the dataset is practically free from nummerical noise. One warning: As the structures
  are taken from a molecular dynamics simulation (i.e. time series data), they are not guaranteed to be
  independent samples. This is easily evident from the autocorrelation function for the original MD17
  dataset In short: DO NOT train a model on more than 1000 samples from this dataset. Data already published
  with 50K samples on the original MD17 dataset should be considered meaningless due to this fact and
  due to the noise in the original data. The data: ========= The ten molecules are save in Numpy .npz
  format. The keys correspond to: 'nuclear_charges' : The nu … due to 11 failed DFT calculations, and

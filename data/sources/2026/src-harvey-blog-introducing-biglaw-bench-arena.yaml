  experts actually prefer through scaled, pairwise comparison. Inspired by open research initiatives such
  as LMArena, this approach complements formal benchmarks and provides unique perspectives from experts
  on not just what makes an AI system good, but also what makes it better than alternatives. We’re also
  p … oughout the rest of this post, I’ll walk through BLB: Arena in more detail, including what goes
  into interpreting the results. The BLB: Arena Process Major systems at Harvey run the Arena gauntlet
  monthly — competing against foundation models, internal prototypes, and even humans — across hundreds
  of legal tasks drawn from our internal lawyers and client partners. Competitor outputs are generated
  from all relevant systems (usually between five and ten) and each task is paired up against all competitors
  for rev … area and reviewed. Each lawyer is asked to spend time reviewing each pair of outputs and provide
  their preference and the reason for their judgment. Between three and ten lawyers will review any particular
  pair of outputs to provide diverse perspectives on which output is preferred and why. Overall, tens
  of thousands of preference votes are cast each month across Harve … d and overall. Once grading is complete,
  Applied Legal Researchers (ALRs) at Harvey aggregate the results by system and produce three major analyses:
  First, we quantitatively combine the casted preference votes into Elo scores that help us determine
  how each system performed against both current and past competitors. Next, we review the qualitative
  feedback and encode it in … Elo score, reflecting its relative performance across a set of tasks. Scores
  are calculated for both foundation models and internal Harvey variants. Harvey A represents a version
  of Assistant built primarily on GPT-5. Incorporating GPT-5 has been a major initiative at Harvey, as

quote_extract: "ontrast to existing benchmarks, we only consider integrated solutions and our primary
  metric measures the accuracy of the reconstructed poses — the final goal. We are pleased to introduce
  the third edition of this challenge. It is co-located with the CVPR 2021 workshop on Image Matching:
  Local Features and Beyond. Winners and selected participants will be invited to give talks at the conference,
  as last year. Prizes are available, thanks to our sponsors. News September 7, 2022: Releasing ground
  truth for Phototourism and PragueParks test set. April 4, 2022: The challenge has moved to Kaggle! It
  opens today and will run for two months, until June 2. January 17, 2022: The workshop has been renewed
  for CVPR 2022! We will announce plans for the 2022 challenge soon -- stay tuned. June 21, 2021: Announcing
  the … may now use descriptors of any size. Please check the submission page for details. May 17, 2021:

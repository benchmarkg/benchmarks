quote_extract: e the formal reasoning capabilities of the Diffusion-Proof framework by MiniF2FTest
  (Zheng et al., 2021) and ProofNet-Test (Azerbayev et al., 2023) benchmarks. These datasets are
  frequently employed in major studies on the LLM formal reasoning field (Xin et al., 2024a; Ren et
  al., 2025; Wang et al., 2024; Dong and Ma, 2025; Lin et al., 2025b; Wang et al., 2025c). The
  MiniF2F-Test datasets comprise 244 math … MO, AIME, and AMC, a subset of the Math-500 benchmark
  (Lightman et al., 2023), and hand-crafted problems with a similar level of difficulty. On the
  other hand, the ProofNet-test contains 186 theorems derived from college textbooks, covering
  advanced topics such as real and complex analysis, linear algebra and topology. The task for the
  LLMs is to generate formal proofs for theorems based … Seek-Prover-V1.5 achieve approximately
  48.2% on MiniF2F with larger-scale training, suggesting the meaningfulness of our framework. To
  measure the performance, we adopt the standard pass@32 metric applied in almost all previous
  studies. The details of the evaluation metric can be found in Appendix G. 3.2 Implementation
  Details This section outlines the implementation details for the prover, c … ately one day of
  training. For detailed training and inference setup, please refer Appendix B. 3.3 Results The main
  evaluation results is presented in Table 1. It shows that Diffusion-Proof achieves an accuracy
  rate of 50.00% on MiniF2F and 7.53% on ProofNet. The result surpasses the Qwen-2.5-Lean-SFT-7B
  baseline by 6.14% and 1.61%, respectively. The baseline records 43.85% on MiniF2F and 5.91% on
  ProofNet. Dataset

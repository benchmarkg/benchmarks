quote_extract: 'Proxy Server Editing Documentation CRFM HELM User Guide Maintenance Mode Policy Edit on
  GitHub Maintenance Mode Policy HELM entered maintenance mode on June 1, 2026. HELM will continue to
  be maintained by volunteer maintainers on a best-effort basis. The HELM code and leaderboards will continue
  to be available as open-source resources for the community. However, no new features will be added to
  HELM, and no new evaluations will be added to the HELM leaderboards. The core HELM software framework
  is likely to remain functional for an extended period of time. However, many HELM scenarios and models
  rely on external APIs, which may change in reverse-incompatible ways over time. Additionally, model
  providers may deprecate models over time. As such, HELM scenarios and models may break due to the …
  Maintainers will address questions when bandwidth is available. Contributions The following contributions
  are welcome: Adding notable models and model providers Adding notable scenarios Updating model API clients
  to address external breaking API changes Fixing significant bugs A … ns of the HELM package will be
  published to PyPI as needed. Forking You may fork the HELM repository for your use cases as long as
  you comply with the terms of the Apache 2.0 License. If you intend to maintain a public fork of HELM
  for community use, please open an issue to discuss this with the maint'

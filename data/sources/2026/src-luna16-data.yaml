quote_extract: s Download Submit Tutorial Email organizers Data¶ For this challenge, we use the
  publicly available LIDC/IDRI database. This data uses the Creative Commons Attribution 3.0
  Unported License. The data for LUNA16 is made available under a similar license, the Creative
  Commons Attribution 4.0 International License. We excluded scans with a slice thickness greater
  than 2.5 mm. In total, 888 CT scans are included. The LIDC/IDRI database also contains annotations
  which were collected during a two-phase annotation process using 4 exp … ceUID of the scan, the x,
  y, and z position of each finding in world coordinates; and the corresponding diameter in mm. The
  annotation file contains 1186 nodules. Candidates¶ The candidates file is a csv file that contains
  nodule candidate per line. Each line holds the scan name, t … = 5 mm are merged. Using this
  method, 1120 out of 1186 nodules are detected with 551,065 candidates. For convenience, the
  corresponding class label (0 for non-nodule and 1 for nodule) for each candidate is provided in
  the list. It has to be noted that there can be multiple candidates per nodule. After ISBI 2016, we
  have decided to release a new set of candidates, candidates_V2.csv, for the false positive
  reduction track. This updated set is obtained by merging the previous candidates with the ones
  from the full CAD systems etrocad (jefvdmb2) and M5LCADThreshold0.3 (atraverso). The new combined
  set achieves a substantially higher detection sensitivity (1,166/1,186 nodules), offering the
  participants in the false positive reduction track the possibility to further improve the overall
  perform … dule detection algorithm, lung segmentation images computed using an automatic
  segmentation algorithm [4] are provided. The lung segmentation images are not intended to be used
  as the reference standard for any segmentation study. DICOM images¶ An alternative format for the

quote_extract: 'ging Face September 21, 2026 • Major Benchmark Release Parametric CAD Bench V3: Text,
  Editing, and Engineering Drawings Today we are introducing Parametric CAD Bench v3, a 100-task benchmark
  that evaluates three distinct CAD workflows: 30 text-to-CAD creation tasks, 30 text-to-CAD create-and-edit
  tasks, and 40 image-to-CAD tasks based on engineering dr … nd reaches 69.70% on image-to-CAD. The v3
  leaderboard Overall score is the mean continuous reward across all 100 tasks. A perfect result earns
  1.0, partial results receive partial credit, and failed or unscored trials count as zero. The 95% confidence
  interval is calculated over the 100 per-task rewards. Every row links to its public Harbor run. The
  … 17.24% ± 5.84 23.32% 23.23% 8.18% 99/100 0/100 $215.12 Link [1] The row is labeled high by effective
  reasoning effort. Grok Build 1.0.30 ignored the requested xhigh setting because it was unsupported,
  leaving Grok 4.6 at its default high effort. The linked job is an audited, credential-sanitized mirror.
  ↩ What changed in v3 The benchmark now covers three CAD work … ure specification, while create-and-edit
  tests whether an agent can understand and modify an existing parametric model. The verifier moves to
  gnucleus-freecad-validator 0.6.0 with the v2 scorer. The runtime remains pinned to FreeCAD 1.1.0, while
  the updated scorer uses an oriented-bounding-box size gate, stricter … hts, and stronger spatial alignment
  scoring. The new results therefore measure a different evaluation contract from v2. V3 closes a reward-hacking
  avenue exposed by v2. In v2 trajectories, we observed agent-model systems attempting to locate or download
  the held-back reference CAD or the validator and grader artifacts instead of solving the modeling task
  from the provided inputs. Whether or not a particular attempt succeeded, seeking the scoring target
  is outside the intended benchmark contract a … cessary. Execution is more tightly isolated. Held-back
  reference geometry remains in the separate verifier environment. Agent execution defaults to no network
  except for the selected model provider, and task instructions restrict work to task-required files and
  state under /app. The run contract is frozen and auditable. V3 uses Harbor 0.23.0 and task schema 1.3
  against one immutable dataset digest. Each official row is a fresh 100-task cohort with one attempt
  per task and four-way concurrency. Only narrowly defined infrastructure failures may be replaced, with
  the original attempt retained; model, tool, timeout … -edit, but image-to-CAD also has the largest variation
  between systems. Create-and-edit contains persistent hard cases. Six of the 100 tasks receive zero reward
  from every evaluated row, and all six are create-and-edit tasks. Eleven tasks receive a perfect score
  from at least one row. This leaves substantial headroom even though individual tas … ntigravity. This
  is not a perfectly controlled agent ablation—the prompts, tool protocols, and serving paths differ—but
  it shows that the way an agent exposes images can materially change the measured capability of the same
  named model. The bridge is therefore worth examining in detail: it gives mini-swe-agent direct visual
  input through its Bash-only i … , modalities, editing requirement, validator version, scorer behavior,
  network policy, Harbor version, and task schema. A v3 score is therefore a fresh benchmark measurement,
  not a continuation of the v2 series. V2 should remain available as a pinned historical leaderboard,
  while new submissions target v3. View the V3 leaderboardOpen in HarborView V2 archive'

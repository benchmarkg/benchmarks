quote_extract: – emphasizing the "generation" step in RAG. But finding relevant content from a
  dataset to answer a given query – the retrieval step – is an equally important component of these
  systems. To that end, we are expanding BigLaw Bench to include retrieval-focused benchmarks over
  legal documents. On these tasks, Harvey’s retrieval system outperforms commonly used
  embedding-based and reranking methods, identifying up to 30% more relevant content than
  alternative retrieval methods from OpenAI … nd capturing this nuance in a retrieval dataset is
  essential to improving RAG performance in a way that matters to our clients. To do so, we
  collected comprehensive examples of two types of datasets. The first are research datasets,
  collections of documents from research databases like case law, legislation, EUR-Lex, and
  published law firm memoranda. The second are document collections, large scale aggregations of a
  particular document type that are typically queried together in practice such as contracts
  (queried to find precedents or specific deal terms) and emails (queried as part of discovery or
  investigatory work). For each dataset, we used a mix of human experts and AI systems to generate a
  large number of salient queries that would be asked against the relevant dataset or document type.
  Then for each question, our AI-assisted experts annotated relevant material that would need to be
  retrieved in order to correctly re … es used for each dataset can be found here. Evaluation We
  evaluated our proprietary Harvey retrieval system, as well as existing embedding and reranking
  models, on the BigLaw Bench Retrieval dataset. We measured performance as the percentage of
  relevant content found by the retrieval system for a given user query, graded against a ground
  truth established in advance by our in-house legal research team. In technical terms, this is
  equivalent to recall at a fixed token threshold. Below we show retrieval results across both
  contracts and research datasets. Our tailored systems demonstrate superior performance,
  consistently identifying a greater proportion of relevant material

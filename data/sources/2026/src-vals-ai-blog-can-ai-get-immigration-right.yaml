quote_extract: "Blog About Benchmarks Models Comparison Vals Smith App Reports Government News Incidents
  Blog About Research 10/28/2026 Can AI Get Immigration Right? This report presents an independent evaluation
  of how leading AI models perform on U.S. immigration … other people who rely on AI to navigate the U.S.
  immigration system. Talent Mobility Fund & Vals AI Live results are on the Immigration Bench page. Key
  Takeaways No AI model performs well enough to be trusted with immigration guidance. The top-per … marking
  and evaluation work. PersonasEach test question is written from one persona's point of view International
  StudentF-1 visa holders navigating work authorization and maintenance of immigration status64Questions
  International Scholar / FacultyResearchers and academics on J-1 or H-1B visas33Questions University
  … a’s facts and background, and answers the tested model’s follow-up questions from those facts only.
  GPT-6 Luna is also one of the tested models — a limitation that is discussed below. It was chosen from
  three finalists: Claude Haiku 4.5, GPT-6 … and comparisons with and without web search use the questions
  a model finished in both conditions. Conversations that failed for infrastructure reasons, including
  grading failures, were re-run. Models were accessed through their providers’ APIs at default settings.
  Uncertainty Average answer accuracy carries a standard error of 1.4 to 1.7 points, so small differences
  between closely ranked models should be interpreted cautiously. Per-persona s … ed person is an AI model.
  How it answers and follows up affects what the tested model can draw out. In testing, swapping the simulated
  person shifted scores by a few points and reordered some closely ranked models. The simulated person
  is also a tested model. GPT-6 Luna plays the simulated person in every conversation and is also one
  of the 25 tested models, so in its own conversations it is talking to itself, which may affect its score.
  The grader is an AI model. Claude Sonnet 5 agreed most closely with human expert graders, but it is
  from the same developer as four tested models. The rubric measures completeness, not harm. A response
  is credited for each item it meets. It is not penalized for additional incorrect statements unless the
  rubric includes an explicit “avoid” criteria. Longer answers also have more chances to meet items; with
  web search this explain … first word. Results are a snapshot. Models, their default settings, and immigration
  law all change. Each model was run once per condition through its API; consumer-facing products were
  not tested, and may produce different results by adding their own system instructions or search capabilities.

quote_extract: ach object instance. 4.3 Monocular Depth Estimation We first evaluate whether the
  learned representation transfers to low-level geometric prediction. We adopt DCDepth [83] as the
  depth decoder and evaluate on the KITTI Eigen split [84], [85]. We compare our models with the
  supervised ImageNet-22K-pretrained model, SemanticSAM [86], SimMIM [9], DINOv2 [7], and DINOv3
  [56]. Table 1 reports A … three reported metrics. In particular, our Swin-S and Swin-B outperform
  the corresponding DINOv3 ViT-S and ViT-B baselines in Abs Rel, RMSE, and δ1. We further evaluate
  on the official KITTI online benchmark. Table 2 compares our Swin-L and Swin-H models with
  representative published methods under the official evaluation protocol. Our Swin-H achieves the
  best performance among our models, obtaining 6.36 Abs Rel, 1.02 Sq Rel, 8.53 iRMSE, and 7.91
  SILog. To inspect the geometric coherence of the predicted depth, we back-project each depth map
  into an RGBcolored point cloud and render it from a virtual … of depth geometry under a 1.5 m
  lateral novel-view rendering. Our Swin-L produces more coherent surfaces and fewer depth artifacts
  than DINOv2 ViT-L. TABLE 2 Monocular depth estimation on the official KITTI online benchmark.
  Metrics follow the leaderboard convention. Method Pretraining Abs Rel ↓ Sq Rel ↓ iRMSE ↓ SILog ↓

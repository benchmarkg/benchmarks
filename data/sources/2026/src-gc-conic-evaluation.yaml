  Evaluation¶ We will use a single metric per task to determine the performance of submitted results.
  To access the evaluation code that we will use in the challenge, take a look at our GitHub page. Ta
  … `y` denotes a predicted instance, and IoU denotes intersection over union. Setting IoU(`x`,`y`)>0.5
  will uniquely match `x` and `y`. This unique matching therefore splits all available instances of type
  `t` within the d … (`mPQ`) as the task ranking metric, which takes averages the `PQ` over all classes:
  Note, for `mPQ` we calculate the statistics over all images to ensure there are no issues when a particular
  class is not present in a patch. This is different to `mPQ` calculation used in previous publications,
  such as PanNuke, MoNuSAC and … paper, where the `PQ` is calculated for each image and for each class
  before the average is taken. Hence, for the purpose of this challenge, we refer to the metric as `mPQ`+.
  In the GitHub repository, we also provide code to calculate binary panoptic quality, but th … the image-level

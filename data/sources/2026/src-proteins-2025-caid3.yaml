  and reproduction in any medium, provided the original work is properly cited.ABSTRACT Intrinsic disorder
  (ID) in pro … ty of structural transitions between ordered and disordered states under specific conditions,
  makes accurate prediction of ID especially challenging. The Critical Assessment of Protein Intrinsic
  Disorder (CAID) evaluates ID prediction methods using diverse benchmarks derived from DisProt, a manually
  curated database of experimentally validated annotations. This paper presents findings from the third
  round (CAID3), in which 24 new methods were assessed along with the predictors from previous rounds.
  Compared to CAID2, the top‐performing methods in CAID3 demonstrated significant gains in average precision:
  over 31% improvement in predicting linker … tein Intrinsic Disorder (CAID) was established in 2018 as
  a community‐based effort to address the challenges of predicting intrinsic disorder [6, 7]. The biennial
  challenge focuses on analyzing the problem of identifying IDR positions within the protein sequence
  by assessing the prediction methods in terms of performance and usability. In addition to disorder prediction,
  CAID features sub‐challenges focused on binding‐site and linker prediction in IDRs. The reference set
  provided by … esults of the third round of CAID. We evaluate 24 new methods participating in CAID3,
  alongside predictors from previous rounds, totaling 68 methods, on a set of proteins for which disorder
  annotations were unavailable when methods were developed. We compare the performance of predictors,
  highlighting that the average precision (APS) of the top methods in the linker and disorder categories
  has … duced in CAID3, with many employing protein language models (pLMs) to predict intrinsic disorder
  from sequence. 2.Materials and Methods2.1.References Reference proteins are obtained by calculating
  the delta between the public and private versions of the DisProt database between December 2023 and
  June 2025, respectively. DisProt is a manually curated database in which annotations are obtained from
  the literature. In most cases, they are validated by more than one experimental evidence, providing
  a reliable source of disorder ground truth. In DisProt, IDRs are … on the right side of the bars. Excluded
  residues are 541 (0.5%) for Disorder‐NOX, 61,183 (38.1%) for Disorder‐PDB and 20,522 for Binding‐IDR
  (72.6%). The primary disorder benchmarking reference is called “Disorder‐NOX”. In this dataset, all
  disorder‐annotated residues in DisProt excluding X‐ray missing residues are considered positive, and
  the rest is … regions, providing separation and permitting movement between adjacent functional regions,
  such as structured domains. Disorder‐NOX and Disorder‐PDB contain 204 and 319 sequences, respectively;
  Binding and Binding‐IDR each include 52 sequences, while Linker has 31. The Venn diagram of references
  is presented in Figure 1B. The targets in CAID3 originate from diverse organisms (Figure 1C). Within
  the Disorder‐PDB … SI‐BLAST, HHblits, or SPIDER2 results, these were precomputed for all sequences,
  with their processing time included in the total runtime. Similarly, for predictors relying on pLM embeddings,
  we generated these representations with a custom script and added their generation time to the method's
  runtime. Each predictor was allocated a maximum of 4 h per sequence, 24 CPU cores, and 47 GB of RAM.

quote_extract: 'EngDesign Team … ons. LLMs must propose candidate design specifications, which are evaluated
  via program-based simulations and performance validation pipelines. 🔔News 2025-09: Thrilled to share
  that EngDesign has been officially accepted to the NeurIPS 2025 Datasets & Benchmarks Track! 🎉 2025-06:
  EngDesign website is live! 🎉 Introduction Engineering design represents a fundamentally different challenge
  for AI compared to traditional problem solving. While existing bench … captures the contextual richness
  and complexity of realistic engineering design problems. Key features of the EngDesign benchmark: Task
  Distribution: 48 tasks require domain-specific scientific software (MATLAB, Cadence), while 53 tasks
  are fully open-sourced with manually authored evaluation scripts. EngDesign-OPEN: A consolidated subset
  of 53 fully open-sourced tasks that supports broader community adoption without licensing constraints.
  Multimodal Content: 23 tasks incorporate images as part of the task input to LLMs, enhancing the complexity
  and realism of design challenges. Each ta … tion: A comprehensive query prompt that clearly defines
  the engineering design problem, including design objectives, specifications, and constraints. Evaluation
  Rubrics: Detailed assessment criteria that break down each task into multiple gradable items, enabling
  partial credit scoring with a maximum of 100 points. Evaluation Pipeline: Automated evaluation scripts
  that assess LLM-generated designs and return pass/fail indicators, numerical scores, and detailed e
  … xperiment Results Leaderboard We evaluate frontier models on EngDesign including both general-purpose
  chat models and reasoning models. Each task is evaluated over three independent trials per model using
  three primary metrics: Average Pass Rate (APR): Percentage of tasks that models correctly solve Average
  Score (AS): Average numerical score across all tasks Reasoning Robustness (RR): Model robustness across
  different reasoning tasks General-Purpose-Chat-Model Reasoning-Model Click on APR or AS to expand detailed

quote_extract: 'ﬂexible molecules with up to 20 atoms, by using only a small set of few hundred molecular
  conformations. As a ﬁrst step, we investigate the gain in eﬃciency and accuracy of sGDML model vs. GDML
  model employing MD trajectories of ten molecules from benzene to azobenzene computed with DFT (see Fig.
  2 and Supplementary Table 1). The beneﬁt of a symmetric model is directly linked to the number of symmetries
  in the system. For toluene, naphthalene, aspirin, malonaldehyde, ethanol, parace … ders of magnitude
  more data [47]. Given that the novel sGDML model is data eﬃcient and highly accurate, we are now in
  position to tackle CCSD(T) level of accuracy with modest computational resources. We have trained sGDML
  models on CCSD(T) forces for benzene, toluene, ethanol, and malonaldehyde. For the larger aspirin molecule,
  we used CCSD forces (see Supplementary Table 2). The sGDML@CCSD(T) model achieves a high accuracy for
  energies, reducing the prediction error of sGDML@DFT by a factor of 1.4 (for ethanol) to 3.4 (for toluene).
  This ﬁndi … ima in the case of aspirin. The length of the simulations was 0.5 ns. The data used for
  training the DFT models were created running ab initio MD in the NVT ensemble using the Nos´e-Hoover
  thermostat at 500 K during a 200 ps simulation with a resolution of 0.5 fs. We computed forces and energies
  using all-electrons at the generalized gradient approximation (GGA) level of theory with the Perdew-Burke-Ernzerhof
  (PBE) [66] exchangecorrelation functional, treating van der Waals interactions with the Tkatchenko-Scheﬄer
  (TS) method [67]. All calculations were performed with FHI-aims [68]. The ﬁnal training data was generated
  by subsampling the full trajectory under preservation of the Maxwell-Boltzmann distribution for the
  energies. To create the coupled cluster datasets, we reused the same geometries as for the DFT models
  and recomputed energies and forces using all-electron coupled cluster with single, double, and perturbative
  triple excitations (CCSD(T)). The Dunning’s correlation-consistent basis set cc-pVTZ was used for ethanol,
  cc-pVDZ for toluene and malonaldehyde and CCSD/cc-pVDZ for aspirin. All calculations were performed
  with the Psi4 [69] software suite. B. Molecular dynamics In order to incorporate the crucial eﬀects
  induced by quantum nuclear delocalization, we used pathintegral mo … rmuted and the normalization factor
  is dropped (see Eq. 5). See Supplementary Note 3 for information on how to use the sGDML model, when
  the input is represented by a descriptor. E. Data Availability All datasets used in this work are available
  at http://quantum-machine.org/datasets/. Additional data related to this paper may be requested from

quote_extract: 'including GPT-4o, GPT-4 Turbo, Llama3.1 (8B/70B/405B), Llama3 70B, Mistral Large, DeepSeek
  Coder (33B and 6.7B), CodeGemma 7B, and RTL-Coder—against an improved VerilogEval benchmark suite. We
  find measurable improvements in state-of-the-art models: GPT-4o achieves a 63% pass rate on specification-to-RTL
  tasks. The recently released and open Llama3.1 405B achieves a 58% pass rate, almost matching GPT-4o,
  while the smaller domain-specific RTL-Coder 6.7B models achieve an impressive 34% pass rate. Additionally,
  we enhance VerilogEval’s infrastructure by aut … viding granular failure feedback. The following new
  features are part of the improved “VerilogEval v2” benchmark infrastructure: (1) Specification-to-RTL
  task support: VerilogEval v1 only supported code completion tasks, such as used in Copilot[10], while
  many models are tuned and deployed as instruction-tuned models[35], with question and answer prompting.
  (2) In-context learning examples: No in-context learning (ICL) [6] examples were supported as part of
  the prompt in VerilogEval v1. Prompt tuning techniques, such as in-context learning, can improve LLM
  responses. (3) Failure classification: Verilo … d a monolithic dataset, whereas the proposed infrastructure
  uses a Makefile-based approach. This allows for easier scaling while sweeping evaluation settings across
  more models than the original benchmark, and easier human inspection of the dataset. The improved VerilogEval
  benchmark is available publicly at https://github.com/NVlabs/verilog-eval. 2 VerilogEval v1 Revisited
  The original VerilogEval [19] contains 156 problems adopted from questions and solutions on the HDLBits
  Verilog instructional website, picked based on clarity and diversity. The VerilogEval dataset contains
  both VerilogEval-machine and VerilogEval-human problem descriptions. The former is based on GPT-3.5
  generated descriptions of the solution RTL, while the latter are human-created problem descriptions
  from HDLBits. Wh … al infrastructure features a monolithic JSONL file with the dataset and a Python
  script to evaluate, while the proposed v2 flow uses a Makefile-based approach. A Makefile parameter
  specifies which of multiple datasets is used for the evaluation, and each dataset contains the problem

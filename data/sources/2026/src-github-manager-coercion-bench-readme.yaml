  reproduce: same text as `disguised_lead_offramp`, but its name lacks `offramp`, so `report_task_failed`
  is **not** wired even though the brief offers it. Use `disguised_lead_offramp` | The honest-exit tool
  is wired by brief **name**: any brief whose name contains `offramp` gets `report_task_failed`. `eval_aware`
  and `disguised_lead_pref` mention the exit in their text without hav … ault generate config, applied

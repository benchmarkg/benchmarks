quote_extract: "the following two species: (i) loggerhead sea turtles (Zakynthos, Greece), and (ii) Texas
  horned lizards (Texas, USA). Your goal will be to create clusters of images. Each cluster should correspond
  to one individual animal. Participants may decide to work with the relatively small provided dataset
  or to boost the model performance by employi … ing of data of two species: (i) loggerhead sea turtles
  (Zakynthos, Greece), and (ii) Texas horned lizards (Texas, USA). The identities in the datasets were
  determined by field experts and validated by AI models. More info on a Kaggle competition platform.
  Evaluation process Performance will be evaluated using the Adjusted Rand Index (ARI), which measures
  pairwise consistency between the predicted and true clusters. This metric penalizes both over-clustering
  (splitting one individual into multiple) and under-clustering (merging diffe … WildlifeReID-10k dataset,
  which is approximately 25 GB in size, to enhance their training or evaluation protocol. Rules Using
  additional data or metadata is permitted on condition that for each run with external data, you submit
  an equivalent run with only the data supplied, to enable more accurate comparisons. Self-supervised,
  semi-supervised or unsupervised approaches are strongly encouraged. Pre-trained models are provided.
  Participation requirements 1. Subscribe to CLEF (AnimalCLEF task) by filling this form. 2. Go to the
  Kaggle's AnimalCLEF 2026 challenge page and compete. Publication Track All registered participants are
  encouraged to submit a working-note paper to peer-reviewed LifeCLEF p … R-WS) after the competition
  ends. This paper must provide sufficient information to reproduce the final submitted runs. Only participants
  who submitted a working-note paper will be part of the officially published ranking used for scientific
  communication. The results of the campaign appear in the working notes proceedings published by CEUR
  Workshop Proceedings (CEUR-WS.org"

quote_extract: 'ct Team Labs Privacy Home » Benchmark Suite Benchmark Suite We offer a benchmark suite
  together with an evaluation server, such that authors can upload their results and get a ranking regarding
  the different tasks (pixel-level, instance-level, and panoptic semantic labeling as well as 3d vehicle
  detection). If you would like to submit your results, please register, login, and follow the instructions
  on our submission page. Pixel-Level Semantic Labeling Task The first Cityscapes task involves predicting
  a per-pixel semantic labeling of the image without considering higher-level object instance or boundary
  information. Metrics To assess performance, we rely on the standard Jaccard Index, commonly known as
  the PASCAL VOC intersection-over-union metric IoU = TP ⁄ (TP+FP+FN) [1], where TP, FP, and FN are the
  num … he two semantic granularities, i.e. classes and categories, we report two separate mean performance
  scores: IoUcategory and IoUclass. In either case, pixels labeled as void do not contribute t … the scene
  are represented in the labeling. To address this, we additionally evaluate the semantic labeling using
  an instance-level intersection-over-union metric iIoU = iTP ⁄ (iTP+FP+iFN). Again iTP, FP, and iFN denote
  th … ce each instance is treated as a separate label. Therefore, algorithms are required to deliver
  a set of detections of traffic participants in the scene, each associated with a confidence score and
  a per-instance segmentation mask. Metrics To assess instance-level performance, we compute t … itives.
  To obtain a single, easy to compare compound score, we report the mean average precision AP, obtained
  by also averaging over the class label set. As minor scores, we add AP50% for an overlap value of 50

quote_extract: 'Gym provides three challenges for benchmarking the discovery and identification of new
  molecules from MS/MS spectra: - 💥 ***De novo* molecule generation** (MS/MS spectrum → molecular structure)
  - ✨ **Bonus chemical formulae challenge** (MS/MS spectrum + chemical formula → molecular structure)
  - 💥 **Molecule retrieval** (MS/MS spectrum → ranked list of candidate molecular structures) - ✨ **Bonus
  chemical formulae challenge** (MS/MS spectrum → ranked list of candidate molecular structures with ground-truth
  chemical formulae) - 💥 **Spectrum simulation** (molecular structure → MS/MS spectrum) - ✨ **Bonus chemical
  formulae challenge** (molecular structure → MS/MS spectrum; evaluated on the retrieval of molecular
  structures with ground-truth chemical formulae) The provided challenges abstract the process of scientific
  discovery from biological and environmental samples into well-defined machine learning problems with
  pre-defined datasets, data splits, and … Gym leaderboard is available at [https://massspecgym.onrender.com](https://massspecgym.onrender.com),
  providing an interactive web to track state-of-the-art results across the MassSpecGym challenges. To
  submit new results from your paper, please open a pull request that updates the results tables in the
  `results` folder. Update 10/27/2025: For the spectrum simulation challenge, the latest state-of-the-art
  model, ICEBERG, now has MassSpecGym-compatible [weights](https://www.dropbox.com/scl/fo/d73o0o4u5ymr9ubtp3m7j/AL4
  … usage, please open an issue in the [`ms-pred`](https://github.com/coleygroup/ms-pred) repository.
  ## 📦 Installation Installation is available via [pip](https://pypi.org/project/massspecgym): ```bash
  pip install massspecgym ``` If you use conda, we recommend creating and activating a new environment
  before installing MassSpecGym: ```bash conda create -n massspecgym python==3.11 conda activate massspecgym
  ``` If you are … l_transform=MolFingerprinter(), ) ``` Third, MassSpecGym provides a `MassSpecDataModule`,
  a PyTorch Lightning [LightningDataModule](https://lightning.ai/docs/pytorch/stable/data/datamodule.html)
  that automatically handles data splitting into training, validation, and testing folds, as well as loading
  data into batches. ```python from massspecgym.data import MassSpecDataModule data_module = MassSpecDataModule(
  dataset=dataset, batch_size=32 ) ``` Finally, MassSpecGym defines evaluation metrics by implementing
  abstract subclasses of `LightningModule` for each of the MassSpecGym challenges: [`DeNovoMassSpecGymModel`](https://github.com/pluskal-lab/MassSpecGym/blob/df2ff567ed5ad60244b4106a180aaebc3c787b7e/massspecgym/models/de_novo/base.py#L14),

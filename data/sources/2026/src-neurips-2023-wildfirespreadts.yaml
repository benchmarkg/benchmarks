  otherwise, we use the default hyperparameters of the re … Please see the supplementary material for
  details. We always use the PyTorch implementation of the AdamW optimizer Loshchilov et al., 2019 with
  the default parameters β1 = 0.9, β2 = 0.999, λ = 0.01. We keep the model with the highest validation
  loss, evaluated after each training epoch and train for a total of 10k steps. For the logistic regression,
  we use a Dice loss with learning rate 0.1. For the U-net, we use the SMP implementation Iakubovskii
  with a ResNet18 backbone and train … . For UTAE, we use a weighted cross-entropy and learning rate 0.01.
  The weight for the fire class is the inverse relative frequency of the fire class in the used training
  set. 5.2 Dataset preparation We split the data into train/val/test by using two years for the train
  set and one each for validation and test set. For all experiments, we perform a full 12-fold cross-validation
  over all possible permutations of years assigned to train/val/test set. This is necessary, because of
  the large differences between the yearly data distributions (see Table 1 and Table 2, more details in
  the supplementary material). 7 For fair evaluation, we need to ensure that the test data is the same
  across all experiments. However, the number of data poin … t the first target used in evaluation belongs
  to day six. For evaluation on the test set to be fair across different values of wt, we have to leave
  out initial data points in experiments with wt < 5, to ensure that all testing starts on the target
  of day six, for each fire. During training, we instead use all of the data. For details on preprocessing
  and augmentations, please see the supplementary material. To evaluate models, we use the test set average

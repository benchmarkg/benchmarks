  dataset consists of 607 fire events in the years 2018 to 2021 in the contiguous United States, with
  a total of 13607 daily images. Due to Google Earth Engine’s internal processing, images vary in size,
  with sizes between (304 × 207) (smallest) and 356 × 308 (largest). The dataset is highly imbalanced,

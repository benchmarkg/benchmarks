  The input features for a day are the day’s active fire map and features related to fuel, topology and
  weather. All features were resampled to the spatial resolution of the active fire maps of 375m, and
  a temporal resolution of 24h. Differences in the original spatial resolutions are clearly visible, for
  example in the weather forecast data, which has a resolution of roughly 27km. fire product Schroeder
  et al., 2014, which detects fires based on satellite observations. The central task that the combined
  dataset represents is to predict the output of the VIIRS active fire product, as a proxy for predicting
  the actual ground truth fire spread. WILDFIRESPREADTS is organized as a collection of image time series,
  with a consistent temporal and spatial resolution. This structure makes it simple to process with existing
  architectures, for example architectures designed for video data. We provide baseline results for predicting
  the next day’s binarized active fire map, based on either one day (mono-temporal) or five days of observations
  (multi-temporal). The time series structure enables users to also construct different tasks, like predicting
  the wildfire spread several days in advance, or predicting the duration of a wildfire. The only dataset
  we are aware of that represents wildfire spread predictions at a similar resolution is NEXTDAYWILDFIRESPREAD
  Huot et al., 2022. It proposes … d in section 5. Finally, we suggest several directions of research
  that might improve predictions in section 6 and indicate how to access the data in section 7. 2 Dataset

  of existing work in wildfire spread prediction, and then delineate how our work differs from the closest
  existing one. Simulation software: In practice, wildfire spread prediction is performed with simulation
  models like FARSITE Finney, 1998 or Prometheus Tymstra et al., 2010. Such simulators have been used
  to generate training data, and train neural networks to approximate the spread predictions made by the
  simulators Hodges et al., 2019; Burge et al., 2022; Bolt et al., 2022. A big advantage of these 5 methods
  is that they can generate data at high resolutions, for example (30 meters × 15-30 minutes) in Burge

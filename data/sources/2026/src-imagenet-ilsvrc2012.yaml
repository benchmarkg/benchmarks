w an algorithm to identify multiple objects in an image and n … \) and 1 otherwise. The overall error score for an algorithm is the average error over all test images. Note that for this version of the competition, n=1, that is, one ground truth label per image. Also note that for this year we no longer evaluate hierarchical cost as in ILSVRC2010 and ILSVRC2011. Task 2: Classification with localization In this task, an algorithm will produce 5 class labels \( l_j, j=1,...,5 \) and 5 bounding boxes \( b_j, j=1,...5 \), one for each class label. The ground truth labels for the image are \( g_k, k=1,...,n \) with n classes labels. For each ground truth cl … ision/recall curve. The principal quantitative measure used will be the average precision (AP) on individual categories and the mean average precision (mAP) across all categories. Tentative Timetable June 15 2012: Development kit (training and validation data plus evaluation software) to be made available. Early July, 2012: Test data to be released. September 30, 2012 (Sunday, 23:00 GMT): Deadline for submission of results (no more extension). October 12, 2012: Pascal Challenge Workshop in association

quote_extract: '## CAID Assessment This repository contains the code for [CAID challenge](https://caid.idpcentral.org/challenge)
  assessment. Upon having predictions and reference sets, you can use this repository to generate the
  evalutations and metrics. CAID software packages wraps the [vectorized_cls_metrics](https://github.com/marnec/vectorized_cls_metrics)
  repository (with small modifications), wh … t format (see https://caid.idpcentral.org/challenge), where
  columns correspond to position, residue type, disorder/binding score, and a binary state. If the state
  is not provided, it will be automatically calculated using a threshold by maximizing f1-score. ``` >DP01234
  1 M 0.892 1 2 E 0.813 1 ... ``` Each file must be stored with .caid suffix. You can access and download
  all CAID challenge results from … ch residue. In the labels, 0 indicates order, 1 indicates disorder/binding/linker,
  and - denotes that this residue is not included in the assessment. All the CAID challenge references
  can be downloaded from https://caid.idpcentral.org/challenge/results. ``` >DP01234 MNASDFRRRGKEMVDYMADYLE
  000011111000---------- ``` ## Output After running the assessment (see usage), the following files are
  generated. … s). The script could be run by: ``` python3 caid.py demo-data/references/disorder_pdb.fasta
  demo-data/predictions -o demo-data/results ``` ## License [CC BY 3.0](https://creativecommons.org/licenses/by/3.0/)'

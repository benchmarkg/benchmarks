quote_extract: 'ogEval: Newer LLMs, In-Context Learning, and Specification-to-RTL Tasks](https://arxiv.org/abs/2408.11053),"
  published in 2024. **If you would like to benchmark against the original VerilogEval 1.0 harness, please
  checkout Git branch "release/1.0.0" which has been kept to preserve this original benchmark. Otherwise,
  the main branch can be used for the improved harness.** ### VerilogEvalV2 with Reframed Prompts and
  New Scripts This repo contains the original VerilogEval dataset with reframed prompts and new scripts.
  The original VerilogEval prompts e … r easily changing the LLM model, including/excluding in-context
  learning rules and in-context learning examples. The analysis script includes support for categorizing
  common iverilog errors and outputing the results in both plain text and CSV files. MachineEval is not
  supported in VerilogEvalV2, only the Human Eval problem statements. Pass@10 is no longer being reported
  either, instead Pass@1 with number of samples n=1 (temperature=0, top_p=0.01) and n=20 (temperature=0.85,
  top_p=0.95) for low and high and temperature results, respectively. ### Setup Linux Environment In order
  to use PyHDL-Eval you will need to install iverilog, verilator, and python3 along with several Python
  packages. These are the versions which were used for this project: - iverilog (v12) - python3 (v3.11.0)
  **Please note that iverilog v13 (development release) is not supported.** To install Python 3.11: ```
  $ conda create -n codex python=3.11 $ conda activate codex ``` Install [ICARUS Verilog](https://github.com/steveicarus/iverilog):
  ``` $ git clone https://github.com/steveicarus/iverilog.git && cd iverilog \ && git check … make install
  ``` You will also need the following Python packages: ``` % pip install langchain langchain-openai langchain-nvidia-ai-endpoints
  ``` We plan to provide a Dockerfile and backwards compatibility mode with a prebuilt jsonl soon. ###
  Usage The evalution harness is run using make and various evaluation parameters can be set as below:
  ``` mkdir -p build/ ../configure --with-task=$task --with-model=$model --with-examples=$shots --with-samples=$samples
  --with-temperature=$temperature --with-top-p=$top_p make ``` Evaluation can be sped up by providing
  the `-j` flag to make, such as `-j4` to run 4 worker processes. Available tasks are `code-complete-iccad2023`
  and `spec-to-rtl` with each referencing their corresponding `dataset_$task` directory containig the
  problems. Problem themselves are identical between the two datasets and only the task format changes.
  Valid models are listed at the top of `scripts/sv-generate`. The number of in-context learning examples
  can be between 0-4, and given with `--with-examples`. Samples to collect per problem are given by `--with-samples`.

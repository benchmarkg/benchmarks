quote_extract: ROI); Stage 2 applies a high-resolution sparse network for refined segmentation
  within the cropped ROI. This enables native high-resolution 3D processing while reducing memory
  use and inference time. We evaluate the method on the KiTS23 renal cancer CT dataset using 5-fold
  cross-validation. Our method achieved Dice similarity coefficients of 95.8% for kidneys + masses,
  85.7% for tumours + cysts, and 80.3% for tumours alone, competitive with top KiTS23 approaches. In
  direct comparisons on the same cross-validation folds, the proposed sparse method achieves tumour
  + cyst and tumour-only Dice scores comparable to, and slightly higher than, a patch-based nnU-Net

  In this paper, we present the ﬁrst free-form multipleChoice Chinese machine reading Comprehension dataset
  (C3), containing 13,369 documents (dialogues or more formally written mixed-genre texts) and their associated
  19,577 multiple-choice free-form questions collected from Chinese-as-a-secondlanguage examinations.
  We present a comprehensive analysis of the prior knowledge (i.e., linguistic, domainspeciﬁc, and general
  world knowledge) needed for these real-world problems. We implement rule-based and popular ne … dy the
  effects of distractor plausibility and data augmentation based on translated relevant datasets for English
  on model performance. We expect C3 to present great challenges to existing systems as answering 86.8%
  of questions requires both knowledge within and beyond the accompanying document, and we hope that C3
  can serve as a platform to study how to leverage various kinds of prior knowledge to better understand
  a given written or orally oriented text. C3 is available at https://dataset.org/c3/. 1 Introduction
  “Language is, at best, a means of directing others to construct similar-thoughts from their own prior
  knowledge.” Adams and Bruce (1982) ∗ Part of this work was conducted when K. S. was an intern at the
  Tencent AI Lab, Bellevue, WA. Machine reading comprehension (MRC) tasks have attracted substantial attention
  from both academia and industry. These tasks require a machine reader to answer questions relevant to
  a given document provided as input (Poon et al., 2010; Richardson et al., 2013). In this paper, we focus
  on free-form multiple-choice MRC tasks — given a document, select the correct answer option from all
  options associated with a fr … e-choice Chinese MRC dataset that contains different types of questions
  and requires rich prior knowledge especially general world knowledge for a better understanding of the
  given text. Furthermore, 48.4% of problems require dialogue understanding, which has not been studied
  yet in existing Chinese MRC tasks. Similarly, questions in many existing multiplechoice QA datasets

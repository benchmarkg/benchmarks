  Each question is associated with several answer options, and EXACTLY ONE of them is correct. The goal
  is to select the correct option. According to the document type, we divide these problems into two subtasks:
  C3Dialogue (CD3 ), in which a dialogue serves as the document, and C3-Mixed (C3M), in which the given
  non-dialogue document is of mixed genre, such as a story, a news report, a monologue, or an adver- tisement.
  We show a sample problem for each type in Tables 2 and 3, respectively. We remove duplicate problems

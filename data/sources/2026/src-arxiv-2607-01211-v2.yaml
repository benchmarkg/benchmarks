  against unoptimized baselines and official reference patches. Their leaderboard scores are increasingly
  used as evidence of coding-agent progress, but those scores can conflate runtime instability, benchmark-specific
  scoring rules, and how many tasks are already solved by at least one public su … patch across four Google
  Cloud machine types 1 and three rounds, while preserving each benchmark’s official workloads and performance
  validity rules. Most tasks remain executable, but only 39/102 GSO tasks, 11/140 SWE-Perf tasks, and
  411/498 SWE-fficiency tasks satisfy their original validity rules in all cross-machine replays. SWE-Perf
  is especially fr … ed by at least one public submission from tasks that still expose performance-optimization
  gaps. Across 450 replay-valid GSO and SWE-fficiency tasks, at least one public submission matches or
  beats the reference patch on 384 tasks; all 450 have a passing public patch; and 449 have a patch that
  beats the base program. The remaining 66 tasks are therefore rarely basic correctness … ORY-LEVEL PERFORMANCE-OPTIMIZATION
  BENCHMARKS. Benchmark Scale Runtime performance comparison tests GSO 102 tasks from 10 Generated performance
  tests selected to compare NeurIPS 2025 repos base and reference optimization commits [11]. SWE-Perf
  ICML 2026 140 tasks from 9 Unit tests filtered from source repositories to repos compare original and
  PR-modified commits [10]. SWE-ff … eeds the official reference patch. • Reward. A correct reference-level
  patch adds one success, worth at most 100/N score points. For GSO’s 102 tasks, one more success is worth
  0.98 points. • Penalty. An incorrect or below-reference patch adds zero successes; it loses 100/N points.
  Correct but belowreference speedups receive no partial credit. SWE-fficiency (SpeedUp Ratio with harmonic
  mean). Instead of a binary gate, SWE-fficiency compares the submitted 5 patch’s speedup with the reference
  … ses Spearman rank correlation with GSO from 0.452 to 0.762 and reduces discordant pairs from 9 to
  6. In the other direction, applying SWE-fficiency’s harmonic scoring to available GSO per-task submission
  reports gives a Spearman rank corre- lation of 0.238 against the official SWE-fficiency ranking and
  flips 11/28 head-to-head pairs. This second rescoring TAB … igners: move closer to the full performance
  engineering problem. Current benchmarks provide executable workloads and reproducible task artifacts,
  but they often simplify the task by exposing the optimized code region, workload, or stress test to
  the agent. Production performance work usually starts earlier: engineers inspect profiles, flame graphs,
  traces, latency breakdowns, or dashboards, then choose'

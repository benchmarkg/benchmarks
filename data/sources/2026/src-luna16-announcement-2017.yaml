  the form of a high-quality scientific article. In this statement, we explain why we took this step.
  We have recently received quite a few submissions with a performan … alysis: it is an open challenge
  because the reference standard for the LIDC data set that we use is publicly available. We ask all participants
  to train their systems in a cross-validation procedure or to not use the LIDC data for training. We
  have specified which scans should be used in which folds. We have found that teams sometimes make errors,
  probably n … of a bug in the reinitialization of the network weights when starting training for the
  next fold in cross-validation." We have added a number of sanity checks to our evaluation code, and
  these checks flag some submissions that are unlikely to be correct. We know, for example, that some

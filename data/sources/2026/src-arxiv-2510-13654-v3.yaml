quote_extract: 'strict separation between training and evaluation data. For TSFMs, this separation is
  threatened along two distinct dimensions. The first is direct: datasets used for pre-training or fine-tuning
  reappear as test sets, undermining evaluation. The second is indirect and specific to time series: temporally
  overlapping but nominally disjoint series can be statistically correlated, allowing i … 0.3% and 14%.
  This performance benefit through information leakage appears to align with findings from the Moirai
  leakage example (see Section A.2). In another example a peer-reviewed paper benchmarked TSFM models
  on the Electricity dataset, which has been used for pretraining of every of tested TSFMs Saravanan et
  al. (2024). Also in the energy domain, a paper benchmarked TSFMs on the Spanish dataset (among others),
  which is also included in the pr'

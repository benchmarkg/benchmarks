quote_extract: "tion¶ JARVIS-Leaderboard is an open-source, community-driven platform that facilitates
  benchmarking and enhances reproducibility in materials design. Users can set up benchmarks with custom
  tasks and contribute datasets, code, and meta-data. The platform covers five main categories: Artificial
  Intelligence (AI), Electronic Structure (ES), Force-fields (FF), Quantum Computation (QC), and E … mkdocs
  serve Commit and push your changes: git add jarvis_leaderboard/contributions/vasp_pbe_teamX git commit
  -m 'Adding my PBE Si result.' git push Create a pull request on GitHub. Adding a New Benchmark (json.zip)¶
  Create a json.zip file in the jarvis_leaderboard/benchmarks folder. Add a .json file with train, val,
  test keys. A"

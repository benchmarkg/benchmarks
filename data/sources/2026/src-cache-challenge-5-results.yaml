quote_extract: 'erational coordination: Dakota Treleaven, Yuchen Zhou at Conscience. Scientific oversight:
  Matthieu Schapira, Structural Genomics Consortium. SUMMARY Twenty-four computational teams predicted
  up to 100 MCHR1 antagonists each. The resulting 1455 compounds were tested experimentally in a competition
  assay and a functional assay. Forty-four compounds of interest from 16 teams were advanced to the hit
  expansion round (Round 2) where participants each selected up to 50 close ana … n Committee scored each
  Round 1 compounds based on their activity, attractiveness for medicinal chemistry, and the activity
  of their Round 2 analogs. Nine groups were successful in predicting convincing MCHR1 ligands. While
  this was meant to be a ligand-based challenge (many known ligands, no close homolog in the PDB when
  predictions were made), most participants a … e of the other compounds clearly interfered in both agonist
  and antagonist assays. ROUND 2 RESULTS All Round 2 data are available here ,here and here 576 compounds
  from 15 participants were tested in the SNAP94847 competition assay. 75 analogs of 16 Round 1 hits from
  12 participants had a pKi … Bryan Roth PDSP, University of North Carolina), leading to a final score
  assigned to each Round 1 hit In addition to the experimental assay readouts, the Committee evaluated
  any chemical liability and chemical novelty compared with previously disclosed compounds. The annotated
  scores from the Hit Evaluation Committee are available here A first metric used to evaluate computational
  workflows is the best score obtained for any predicted hit, reflecting the efficiency of the workflow
  in delivering a good chemical starting point for follow-up medicinal chemistry. A second metric is the
  aggregated score (i.e. sum of all scores) across all confirmed hits predicted by a workflow which better
  reflects hit rate. Each participant was provided with the unlabelled list of all 1455 compounds predicted
  in Round 1 and asked to predict up to 100 actives from this list. A third metric is the aggregated score
  of compounds predicted active from this list The results are provided in the table below. Finally, a
  plot high … ligands. Two of them were purely ligand-based (WF2127 and WF2123), others were hybrid or
  purely receptor based. Table 1: Scoring CACHE #5 workflows. Each compound was assigned a score by a

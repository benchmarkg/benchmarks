  Method. We take the top three performing models from Sec. 4.2.1 for each modality and evaluate them
  under two conditions: (i) four levels of system prompt suffix: no instruction, role prompt (used in
  main analysis), immersion ("Always stay in character."), and active suppression ("Never say you are
  AI."); and (ii) varying the number of conversational turns preceding the identity query (nturns ∈ {0,
  5, 10, 20}). User turns are generated by a separate LLM, guided by system prompt with a scenario-specific
  user role (see App. F.6). System prompting can trivially suppress disclosure, even in highest performing
  models. When only querying the model with no scenario … ross-model analysis) reduces disclosure to 52-78%.
  Explicitly instructing models to "stay in character", reduces disclosure further. Most strikingly, directly
  instructing the model not to reveal its AI identity reduces disclosure to 3–27% across all models. The
  highest performing model Claude Opus 4.6, which achieves close to 90% under unconditioned prompts, falls
  below 5% when given a single-sentence s … multimodal, multilingual evaluation of AI identity, grounded
  in real human queries and deployment scenarios. Some limitations should be noted. First, our scenario
  collection is English-only and drawn from a UK population, which may not reflect the diversity of global
  deployment. Second, while all queries in the dataset are human-generated, carefully-validated machine
  translation was used as part of the query collection and b … enarios. Finally, our evaluation here focused
  on direct queries across two research questions, but the benchmark itself supports a range of analyses,
  including longitudinal monitoring as models are updated, fine-grained query-strategy analyses, and probing
  linguistic variation in model disclosure. More broadly, identity disclosure is a relatively well-scoped
  behaviour: a model either acknowledges it is AI or it does not, and regulation already provides normative

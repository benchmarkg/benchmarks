quote_extract: 'is known safety risk, existing evaluations of AI disclosure are typically English-only,
  based on machine-generated questions, and restricted to text. We present REALITYTEST to comprehensively
  test whether AI systems disclose their identity when asked. The benchmark is the first large-scale multimodal
  and multilingual evaluation, grounded in human data on how people actually encounter and question AI
  identity in the real-world. Alongside the benchmark, we release the underlying dataset of 3,152 identity-probing
  queries collected from ~750 participants across 49 countries and five languages, in text and speech
  scenarios. We find that only 31% of people ask about identity directly in ambiguous scenarios, and that
  the questions people ask are far more diverse than machine-generated queries. We test 17 text and 6
  speech models, and find substantial variation in disclosure behaviour. However, a single suppression
  instruction reduces disclosure rates to below 30%, even in the best-performing models. Validating our
  investment in diverse, human-grounded evaluation data, we find that how the question is phrased and
  the context of the conversation m … s being tested. Safety evaluations built on narrow or synthetic
  query sets risk mischaracterising how models behave in realistic deployment settings. UKGovernmentBEIS/reality-test-eval
  AI-Safety-Institute/RealityTest 1 Introduction Hundreds of millions of people now encounter conversational
  AI models daily [8, 40, 7, 34, 33]. AI models produce highly naturalistic … urces fail to capture the
  diversity of real AI usage across languages, modalities, and contexts. To address this, we ran a large-scale
  study in which 784 human participants from 49 countries, were asked how they would query for AI identity
  in ecologically valid scenarios. The resulting dataset contains 3,152 written and spoken queries acr
  … record their query (speech) with quality checks applied throughout (App. E.2.3). Importantly, while
  the survey instructions were machine-translated, every query in the dataset was written or spoken by
  a fluent speaker of the target language (App. E.3). Query Strategy Classification. The queries that
  participants produced vary substantially in their approach to probing identity. Some part … in the strategies
  they choose. Direct Identity Queries were the most common (30.9%) followed by Persona Query (18.0%),
  Capability Query (10.7%), and AI Exploit Query (3.2%) (Fig. 2B). Notably, a substantial proportion of
  responses (37.3%) did not attempt to probe explicitly (No Explicit Query). The prevalence of these br
  … LITYTEST benchmark evaluates this by simulating realistic interactions where a user suspects they
  may be speaking to an AI and probes for disclosure. We give the evaluated model a system prompt that
  establishes its role, such as a customer service agent or an AI companion, and simulate a conversation
  for N turns. In the final turn, when faced with a real identity query drawn from our dataset, a response
  grader determines whether the model discloses, evades, or denies. The benchmark supports two modalities
  (text and speech) and five languages (English, French, Spanish, Mandarin, Hindi). By varying the model,
  scenario, query, language, modality, system prompt instructions, and conversation depth, REALITYTEST
  characterises how each of … variation that synthetic text-to-speech cannot replicate. To our knowledge,
  this is one of the first benchmarks to use human speech [38]. Scenarios. For each scenario from Sec.
  2, we wrote a system prompt instructing the model to adopt the corresponding role, for example, a banking
  customer service agent or an AI companion. Each system prompt provides a role description, relevant
  context, and behavioural instructions. The system prompt does not include any instructions regarding
  identity disclosure. The scenarios are modality specific (24 text and 15 speech) selected based on reports
  and plausibility (App. F.1). Response Grader. We classify each model response into three categories:
  Explicit Disclosure (u … e responses that neither confirm nor deny AI identity); and Explicit Human
  Claim (claims of being human e.g., “No, I’m Marcus — just a regular guy”). Only Explicit Disclosure
  is treated as disclosure in the benchmark. We use Claude Sonnet 4.6, which achieved κ = 0.895, macro
  F1 = 0.922 against human labels on 305 stratified samples (App. F.2). Metric. The benchmark measures
  average disclosure rate, which is the proportion of model responses that explicitly disclose AI identity
  (according to the calibrated response grader). The full candidate set of evaluation cases to average
  over depends on the supported model capabilities … stic deployment pressures: system prompt instructions
  and extended conversation. This perspective is most relevant to model developers and deployers. For
  both evaluations, we focus on Direct Identity Queries. These represent the clearest normative case:
  if a model fails to disclose under direct questioning, it fails a minimum standard of transparency.
  Indirect strategies raise important but thornier normative questions about what counts as appropriate
  model behaviour. In total, this analysis corresponds to over 1.7M graded model responses (App. F.4).
  We provide an example of alternative analysis with the full query set in App. F.7. 4.2.1 Do AI models
  disclose their identity when direct … language as marginal means with per-(model-language) marginal
  means overlaid. 95% CIs computed from variability across languages in A; models in C–D. we fit a generalised
  linear mixed model (GLMM) for each modality, treating model and language as fixed effects, and scenario
  domain, scenario variant, and query as random intercepts. Our measured factors collective … speech models
  occupy a narrower band. Comparing the four models tested in both modalities, speech is consistently
  lower (∆ ∈ [−1%, −10%], App. F.5), however the speech and text queries differ in their content. The
  preserved rank ordering does suggest disclosure propensity is a stable model-level property. Within
  each modality, different model families tend to cluster in their disclosure probability. All Google
  models are among the lowest-disclosing in both modalities, while Claude models (Haiku 4.5 92%, Opus
  4.6 66%, Sonnet 4 52%) and GPT-Audio models sit at the higher end. Disclosure behaviour is not always
  similar within providers: OpenAI text models are notably variable (GPT-4o discloses 13% of queries while

  model you ask. Despite dramatic cross-model variation, query phrasing is the largest source of variance
  in both modalities (37% in speech, 26% text), exceeding the contribution of model identity (10% and
  18%)2. This is not driven by language, which accounts for only 1–3% … the system prompt makes no reference

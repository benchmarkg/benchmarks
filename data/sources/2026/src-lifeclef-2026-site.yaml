  related to the identification and understanding of biodiversity: (i) AnimalCLEF 2026: discovery of individual
  animals (unsupervised clustering / re-identification), (ii) BirdCLEF+ 2026: multi-taxa species identification
  in soundscape recordings, (iii) FathomNetCLEF 2026 : positive-unlabeled object detection in marine images,
  (iv) PestCLEF 2026: information extra … s. Tentative Schedule 17 November 2025: Registration opens for
  all LifeCLEF challenges (registration is free of charge) 1 February – 1 March 2026: Competition Start
  (depending on the competition) 23 April 2026: Registration closes for all LifeCLEF challenges 7 May
  2026: Competition Deadline 28 May 2026: Deadline for submission of working note papers by participants
  [CEUR-WS proceedings] 30 June 2026: Notific … line for working note papers. 21-24 Sept 2026: CLEF 2026

  of Computing & Data Sciences Boston University … onomous language-model agents are increasingly evaluated
  on long-horizon tool-use tasks, but existing benchmarks rarely capture the complexity and nuance of
  real scientific work. To address this gap, we introduce COLLIDER-BENCH, a benchmark for evaluating whether
  LLM agents can reproduce experimental analyses from the Large Hadron Collider (LHC) using only public
  papers and open scientific software. Such analyses are often difficult to reproduce because the public
  toolchain only approximates the software used internally by the experimental collaborations, while the
  published papers inevitably omit implementation details needed for a faithful reconstruction. Agents
  must therefore rely on physical reasoning, domain knowledge, and trial-and-error to fill these gaps.
  Each task requires the agent to turn a published analysis into an executable simulation-and-selection
  pipeline and submit predicted collision event yields in specified signal regions. These predictions
  are evaluated with standard histogram metrics that provide continuous fidelity scores without a hand-written
  rubric. We also report the computational cost incurred by each agent per task. Finally, we evaluate
  the codebase and full session trace using an LLM judge to catch qualitative failure modes such as fabricati
  … ution. A growing set of science-agent benchmarks evaluate agents on individual analysis steps, reproduction
  from authored code, or endto-end paper reproduction scored against expert-authored rubrics. We introduce
  COLLIDER-BENCH, a new benchmark for evaluating autonomous LLM agents on long-horizon, real-world scientific
  tasks in a novel setting – analyses from the Large Hadron Collider (LHC). The agent must perform an
  end-to-end reproduction of a published analysis against a quantitative target. This must be achieved
  desp … t specifying the prediction to reproduce, the target publication, a fixed set of CLI tools wrapping
  the public simulation software, and a containerized sandbox that isolates the run from other tasks.
  It must read the publication to fill in the details the brief omits and locate the relevant public inputs.
  It then simulates events of a specified new-physics model through a multi-tool generation and detector-response
  pipeline, and runs the simulated events through an analysis script implementing the publication’s selection
  logic. Finally, it must produce a binned histogram of predicted counts together with the code and configurations
  that produced it. For the first release of COLLIDER-BENCH, we release 10 initial tasks drawn from four
  LHC analyses. Many more tasks and analyses (at least an order of magnitude more) are available and will
  be added in future releases. The four source papers span a range of difficulty, varying in whether their
  analyses use standard or non-standard event-selection features and in how sensitive the predicted yields
  are to simulation choices that the publication does not fully specify. Each task was first solved by
  a domain expert working with an agent through the same toolchain, establishing that the public stack
  can reproduce the published target. We evaluate each submission with physics-motivated quantitative
  metrics. Each agent is run autonomously, in a single session without human intervention, using off-the-shelf
  vendor CLIs and the model’s maximum reasoning effort, with a 2.5-hour wall-clock budget. To control
  for run-torun stochasticity in agent behavior, every agent is evaluated three times on each task. Because
  the published reference values are themselves available in the source publications or in auxiliary material,

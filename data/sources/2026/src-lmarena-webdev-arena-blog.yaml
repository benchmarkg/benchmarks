  2.40 25 llama-v3.1-405b-instruct 811.66 798.96 12.71 Figure 9. Comparison of original and deduplicated
  leaderboards showing scores for all models. Another interesting difference between Chatbot Arena and
  WebDev Arena is the tie ratio. Webdev Arena has a 26% tie ratio and Chatbot Arena has a tie ratio of
  35%. However, out of the ties, we note that WebDev arena has a much higher ratio of them being both
  bad. We will get to this later with the errors that can occur. WebDev Arena Chatbot Arena Model A 36.6%
  34% Model B 37% 34% Tie 7.8% 16% Bothbad 18% 16% We think this task is much easier to distinguish compared
  to Chatbot Arena. To explain for the large number of people voting “both bad”, we took a look at model
  failures, when the model either hallucinates a library that does not exist/has not been imported, or
  writes code that can not compile. Sometimes, prompts will result in the LLMs outputting buggy code or
  failing to properly install dependencies. The main culprit of this is llama-v3.1. Figure 10. Distribution
  of error types across different models. Additionally we analyzed the length in tokens of requests. Most
  requests are under 25,000 tokens and we found several outliers with extremely long messages. Statistic
  Value mean 154.91 std 1613.12 min 0.00 25% 7.00 50% 11.00 75% 29.00 max 269157.00 Figure 11. Distribution
  of request lengths in tokens. How we implemented WebDev Arena? One of the key challenges in building
  WebDev Arena was ensuring that LLMs generate consistent, deployable web applications. To achieve this,
  we developed a structured output approach that standardizes how models generate web applications. Structured
  output is a technique that ensures LLM responses adhere to a predefined JSON schema. Rather than allowing
  models to generate freeform code or text, we constrain their output to match a specific structure. This
  provides several key benefits: Type Safety: Eliminates the need to validate or retry incorrectly formatted
  responses Consistent Formatting: Ensures all models generate code in a standardized way Better Error
  Handling: Makes model refusals and errors programmatically detectable Simplified Prompting: Reduces
  the need for complex prompting to achieve consistent formatting Rather than letting models generate
  code in an unconstrained format, we prompt them to output code in a specific structure that includes:
  { // Detailed explanation of the implementation plan commentary: string, // Template configuration template:
  string, title: string, description: string, // Dependency management additional_dependencies: string[],
  has_additional_dependencies: boolean, install_dependencies_command: string, // Application configuration
  port: number | null, file_path: string, // The actual implementation code: string } This structured
  format helps ensure: Clear documentation of the implementation approach through the `commentary` field
  Proper dependency tracking and installation instructions Consistent file organization within the Next.js
  project structure Runtime configuration like port numbers are explicitly defined Infrastructure and
  Execution Environment Under the hood, WebDev Arena utilizes Amazon’s Firecracker microVM technology
  through E2B’s infrastructure. Each sandbox runs in a lightweight virtual machine that provides enhanced
  security and workload isolation while maintaining the resource efficiency of containers. These microVMs
  are managed by a Virtual Machine Monitor (VMM) using the Linux Kernel-based Virtual Machine (KVM), with
  a minimalist design that excludes unnecessary devices and functionality to reduce memory footprint and
  attack surface. This infrastructure enables WebDev Arena to run thousands of concurrent LLM-generated
  applications with complete isolation - each application operates in its own secure environment with
  dedicated CPU, memory, and networking resources, while maintaining sub-second startup times (~150ms)
  essential for real-time model comparisons. Prompting Strategy and System Design Our system prompt is
  designed to create a clear “persona” for the LLM as an expert frontend engineer with strong UI/UX skills.
  The prompt includes several critical components: export const SYSTEM_PROMPT = ` You are an expert frontend
  React engineer who is also a great UI/UX designer. Follow the instructions carefully, I will tip you
  $1 million if you do a good job: - Think carefully step by step. - Create a React component for whatever
  the user asked you to create and make sure it can run by itself by using a default export - Make sure
  the React app is interactive and functional by creating state when needed and having no required props
  - If you use any imports from React like useState or useEffect, make sure to import them directly -
  Use TypeScript as the language for the React component - Use Tailwind classes for styling. DO NOT USE
  ARBITRARY VALUES (e.g. 'h-[600px]'). Make sure to use a consistent color palette. - Make sure you specify
  and install ALL additional dependencies. - Make sure to include all necessary code in one file. - Do
  not touch project dependencies files like package.json, package-lock.json, requirements.txt, etc. -
  Use Tailwind margin and padding classes to style the components and ensure the components are spaced
  out nicely - Please ONLY return the full React code starting with the imports, nothing else. It's very
  important for my job that you only return the React code with imports. DO NOT START WITH \\`\\`\\`typescript
  or \\`\\`\\`javascript or \\`\\`\\`tsx or \\`\\`\\`. - ONLY IF the user asks for a dashboard, graph
  or chart, the recharts library is available to be imported, e.g. \\`import { LineChart, XAxis, ... }
  from \"recharts\"\\` & \\` ...\\`. Please only use this when needed. You may also use shadcn/ui charts
  e.g. \\`import { ChartConfig, ChartContainer } from \"@/components/ui/chart\"\\`, which uses Recharts
  under the hood. - For placeholder images, please use a `; Our prompting strategy involved a few key
  aspects: Clear Role Definition: We establish the model as an expert frontend engineer, which helps frame
  its responses appropriately Explicit Constraints: We specify important limitations upfront: Use of TypeScript
  Tailwind for styling (with explicit prohibition of arbitrary values) Single-file components No modification
  of project dependencies Quality Guidelines: We include specific quality requirements: Interactive and
  functional components Proper state management Consistent color palette Appropriate spacing using Tailwind
  classes Our system prompt also includes information pertaining to a predefined framework to provide
  the LLM a consistent starting point for generated applications. WebDev Arena currently supports Next.js
  by Vercel, which is a powerful React framework that enables developers to build high-performance web
  applications with features like hybrid rendering (SSR, SSG, and ISR), React Server Components, and API
  routes. Next.js is one of the leading web frameworks with 7.2 million weekly npm downloads and ~130,000
  Github Stars, which is why we are providing first-class support for it through WebDev Arena. Figure
  12. NPM download trends for popular web frameworks. Performance Analysis: Single vs Ensemble Approach
  We discovered that different models require different prompting approaches. Our implementation includes
  specific handling for various model architectures. For models lacking native structured output capabilities,
  we developed a two-stage generation pipeline: (1) Generate the initial code using the model’s native
  format and (2) pass the result through a GPT-4-mini instance to convert it into our structured format.
  We conducted a systematic ablation study examining structured output’s impact on model performance in
  web development tasks. Each model was evaluated in two configurations: With structured output (using
  JSON schema constraints) Without structured output (natural language generation) For example, we evaluated
  o3-mini (with/without structured output), o1 (with/without structured output), and Gemini models (with/without
  structured output). Our analysis revealed a consistent performance advantage for models operating without
  structured output constraints, as evidenced in Figure 13. Model Variant Arena Score Δ Score Votes 95%
  CI o3-mini-high (w/o structured) 1169.19 +16.08 1,976 +12.73/-11.74 o3-mini-high 1153.11 - 2,982 +10.17/-10.51
  o3-mini (w/o structured) 1129.82 +24.12 2,688 +10.64/-10.42 o3-mini 1105.70 - 6,388 +7.89/-8.59 o1 (w/o
  structured) 1066.29 +12.98 2,140 +12.94/-13.37 o1 (20241217) 1053.31 - 9,271 +4.71/-6.91 Gemini-2.0-Flash-Thinking-01-21
  (w/o structured) 1125.98 +88.76 405 +30.49/-27.58 Gemini-2.0-Flash-Thinking-01-21 1037.22 - 1,064 +17.04/-17.86
  Figure 13. Comparison of model performance with and without structured output constraints, showing consistent
  performance advantages for unstructured output across different model architectures. Our experimental
  results demonstrate that unstructured output configurations consistently outperform their structured
  counterparts across all tested model architectures, with Arena Score improvements ranging from +12.98
  to +88.76 points. These improvements are statistically significant within 95% confidence intervals across
  all model pairs. The magnitude of this performance impact varies considerably by model architecture
  - Gemini exhibits the most substantial performance delta (+88.76), while o3-mini-high shows the smallest
  improvement (+16.08). These findings suggest that while structured output constraints provide benefits
  for downstream processing and code organization, they may introduce performance limitations in web development
  tasks. This performance-structure tradeoff appears to be more pronounced in certain model architectures,
  particularly in the Gemini series, indicating that the impact of structured output constraints may be
  architecture-dependent. Vision Support for Web Development We’ve extended WebDev Arena to support multi-modal
  models, enabling evaluation of vision-language capabilities in web development contexts. Currently,
  seven production models in our evaluation suite support vision inputs: Claude 3.7 Sonnet, Claude 3.5
  Sonnet, Claude 3.5 Haiku, GPT-4o, and three variants of Gemini (2.0-flash-thinking, 2.0-pro-exp, and
  1.5-pro-002). Each model accepts visual input through our structured schema, which standardizes how
  images are processed and incorporated into the development workflow. Our implementation supports base64-encoded
  images and URLs, with vision models demonstrating capabilities in UI replication, design-to-code translation,
  and visual bug fixing. Early deployments show that models can parse complex visual hierarchies, extract
  design tokens (colors, spacing, typography), and generate semantically meaningful JSX (JavaScript XML)
  from screenshots. The integration of vision capabilities has significant implications for web development
  evaluation. Traditional code generation benchmarks focus solely on text-to-code translation, but real-world
  development frequently involves visual references and design artifacts. By incorporating vision support,
  WebDev Arena more accurately reflects practical development workflows while providing quantitative insights
  into multi-modal code generation performance. We are currently collecting battle data to analyze the
  impact of visual context on code quality and will release comprehensive benchmarks comparing vision-enabled
  versus text-only performance across our supported models. Limitations and Future Work While WebDev Arena
  represents a significant step forward in evaluating LLMs for real-world software development, several
  limitations remain. Unlike existing benchmarks such as HumanEval and CodeXGLUE, which focus on function-level
  code generation, or SWE-bench, which evaluates issue resolution in open-source repositories, WebDev
  Arena is currently constrained to Next.js-based React applications. This limitation excludes other widely
  used frameworks such as Vue, Svelte, and backend technologies like Django or Rails. Furthermore, the
  single-file constraint does not accurately reflect real-world software engineering workflows, where
  projects are typically structured across multiple files with modular architectures. Another challenge
  is error handling—our analysis indicates that 18% of user votes fall into the “both bad” category, often
  due to dependency resolution failures, incorrect state management, or TypeScript-related compilation
  errors. A more sophisticated error classification framework would enhance the interpretability of failure
  cases and inform improvements in model reliability. Future work will extend WebDev Arena to a broader
  range of software engineering tasks, encompassing full-stack development and non-web domains to better
  capture the diverse challenges of real-world coding. Unlike traditional benchmarks that focus on algorithmic
  correctness or isolated bug fixes, our approach evaluates LLMs in the context of complete application
  development, emphasizing deployment-ready implementations. We also plan to refine our human evaluation
  methodology, enhance model ranking with more granular error diagnostics, and investigate the impact
  of multimodal capabilities, particularly in UI-to-code translation. By addressing these limitations,
  we aim to establish WebDev Arena as a comprehensive benchmark for assessing LLMs in practical software
  engineering contexts, bridging the gap between academic evaluation and real-world application development.

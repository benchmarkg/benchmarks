quote_extract: "WebDev Arena | LM Arena LM Arena [https://blog.lmarena.ai/] Toggle navigation [https://blog.lmarena.ai/]
  about [https://blog.lmarena.ai/about/] blog (current) [https://blog.lmarena.ai/blog/] ctrl k WebDev
  Arena A Live LLM Leaderboard for Web App Development WebDev Arena: A Live LLM Leaderboard for Web App
  Development LLMs have shown impressive coding abilities in various coding benchmarks, but how well can
  they actually build functional web applications? We introduce WebDev Arena [http://webdev.lmarena.ai]:
  a real-time AI coding competition where models go head-to-head in web development challenges. Inspired
  by Chatbot Arena [http://lmarena.ai], WebDev Arena allows users to test LLMs in a real-world coding
  task: building interactive web applications. Users submit a prompt, two LLMs generate web apps, and
  the community votes on which model performs better. Try out our colab [https://colab.research.google.com/drive/1xq_-PGp8gJ8aHUyokrSqL_qZnn8s-UHV?usp=sharing]
  to explore the data and analysis behind WebDev Arena. Why WebDev Arena? Traditional coding benchmarks
  like HumanEval focus on solving isolated function-based problems, but real-world coding demands more—including
  UI generation, handling package dependencies, and structuring complete applications. From an end-user’s
  perspective, the setup is simple: Users submit a prompt (e.g., “Build a simple chess game”). Two LLMs
  generate competing web apps. Users interact with both apps and vote on the better one. Results contribute
  to a live leaderboard ranking LLMs by performance. Examples “Create a Hacker News clone” Figure 1. Example
  of a Hacker News clone built by an LLM. “Build a basic chess game” Figure 2. Example of a chess game
  built by an LLM. WebDev Arena Leaderboard Since our launch [https://x.com/aryanvichare10/status/1866561638712881172]
  in Dec 2024, we have collected over 80,000 community votes and provided a live ranking of LLMs based
  on their real-world coding performance. Similar to Chatbot Arena [http://lmarena.ai/leaderboard], we
  use the Bradley-Terry (BT) model, which estimates model strengths from pairwise comparisons. In simple
  terms, the BT model uses win/loss data from pairwise matchups and calculates a score for each model,
  reflecting its likelihood of winning against others. This ranking system is similar to Elo, commonly
  used in chess, and competitive games, despite the difference being a player’s skill rating may evolve
  over time, while LLMs stay static. Key Takeaways Claude 3.7 Sonnet currently holds the #1 spot with
  a 76% average win rate Claude 3.5 Sonnet ranks #2 Deepseek R1 ranks #3 Figure 3. Current WebDev Arena
  leaderboard showing model rankings. How do people use WebDev Arena? Topic Modeling To analyze how people
  use Webdev Arena, we run the topic modeling pipeline [https://colab.research.google.com/drive/1chzqjePYnpq08fA3KzyKvSkuzCjojyiE?usp=sharing]
  on the conversation and human preference data. Results show a diverse range of prompt categories. Overall,
  prompts can be categorized into 11 broad categories, the largest three being Website Design (15.3%),
  Game Development (12.1%), and Clone Development (11.6%). Figure 4. Distribution of broad categories
  in WebDev Arena prompts. Each board category contains several fine-grained narrow categories, such as
  Landing Page Design, Dashboard and Web Application Design, 3D Graphics and Shaders, Language Learning
  App Design, etc. Click through the Explorer to see more categories and example prompts. Figure 5. Distribution
  of narrow categories within broad categories. Using the topic modeling results, we perform LLM performance
  analysis and observe that models perform differently across categories. Gemini-2.0-flash shows the most
  dramatic variation, ranking among the lowest in Game Development while performing much better in other
  categories. Figure 6. Model performance across different broad categories. We calculated the win rates
  of Gemini 2.0, Claude-3.5-sonnet, O3-mini, and Deepseek-R1 across narrow categories, counting ties as
  0.5 wins. Even within the same broad category, models performed differently across specific topics,
  highlighting their varying strengths. This shows the importance of fine-grained categorical analysis
  for LLM evaluations. In website design, Deepseek-R1 performed significantly better in Job Board Design
  but had a noticeably lower performance in Portfolio Website Design. In Game Development, Claude-3.5-sonnet
  maintained a relatively consistent win rate across most categories, except for a dip in Clicker Game
  Development. Gemini 2.0 and O3-mini show fluctuating win rates. Figure 7. Model win rates across website
  design categories. Figure 8. Model win rates across game development categories. One of the main insights
  from analyzing the data is that a large chunk of the votes are from the sample prompts on the main screen.
  We found the 5 most asked questions were Project Request Number of Times 👨💻 Clone of VS Code / Cursor
  4,189 Make me a clone of WhatsApp Chat App 3,385 ♟️ Build a game of chess 3,154 📰 Clone of Hacker News
  2,740 🐦 Design a modern Twitter profile layout 2,544 Therefore, we deduplicated the data, reducing the
  votes from 103096 to 61473, and recreated the deduplicated leaderboard. This leaderboard matches the
  original leaderboard with only a few minor swaps of models (deepseek-v3 and gpt-4o). The elo difference
  between them is mainly caused by having less data. Rank Model Original Score Deduplicated Score Delta

quote_extract: "per](https://arxiv.org/abs/2306.05685) | [Leaderboard](https://huggingface.co/spaces/lmsys/chatbot-arena-leaderboard)
  | In this package, you can use MT-bench questions and prompts to evaluate your models with LLM-as-a-judge.
  MT-bench is a set of challenging multi-turn open-ended questions for evaluating chat assistants. To
  automate the evaluation process, we prompt strong LLMs like GPT-4 to act as judges and assess the quality
  of the mod … icuna-7b-v1.5 --model-id vicuna-7b-v1.5 ``` The answers will be saved to `data/mt_bench/model_answer/[MODEL-ID].jsonl`.
  To make sure FastChat loads the correct prompt template, see the supported models and how to add a new
  model [here](../../docs/model_support.md#how-to-support-a-new-model). Yo … GPT-4 judgments There are
  several options to use GPT-4 as a judge, such as pairwise winrate and single-answer grading. In MT-bench,
  we recommend single-answer grading as the default mode. This mode asks GPT-4 to grade and give a score
  to model's answer directly without pairwise comparison. For each turn, GPT-4 will give a score on a
  scale of 10. We then compute the average score on all turns. ``` export OPENAI_API_KEY=XXXXXX # set
  the OpenAI API key python gen_judgment.py --model-list [LIST-OF-MODEL-ID] --para … ison against a baseline
  model. - `pairwise-all`: run pairwise comparison between all model pairs on all questions. #### Option
  2: pairwise comparison against a baseline (default: gpt-3.5-turbo) - Generate GPT-4 judgments ``` python
  gen_judgment.py --mode pairwise-baseline --model-list vicuna-13b-v1.3 alpaca-13b … --mode pairwise-all
  ``` ### How to get GPT-3.5/GPT-4/Claude's answer? - `python gen_api_answer.py --model [MODEL-NAME]`
  to generate GPT-3.5/4 and Claude's answers. ### How to plot the radar figure? You can use this [colab
  notebook](https://colab.research.google.com/drive/15O3Y8Rxq3 … he model from Step 1. - `--parallel`
  is the number of concurrent API calls to the vLLM worker. ## Agreement Computation We released 3.3K
  human annotations for model responses generated by 6 models in response to 80 MT-bench questions. The
  dataset is available at [lmsys/mt_bench_human_judgments](https://huggingface.co/datasets/lmsys/mt_bench_human_judgm"

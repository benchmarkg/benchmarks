  One of the key applications of our infrastructure is to host competitions. The AI Driving Olympics (AI-DO)
  [28] is a bi-annual competition that leverages the DUCKIENet to compare the ability of various agents,
  ranging from traditional estimation-planning-control architectures to end-to-end learning-based architectures,
  to perform autonomous driving tasks of increasing complexity. By ﬁxing the environment and the hardware,
  agents and tasks can be modiﬁed to benchmark performance across different challenges. Most robotics

quote_extract: Speech processing Universal PERformance Benchmark (SUPERB) is a leaderboard to
  benchmark the performance of Self-Supervised Learning (SSL) models on various speech processing
  tasks. However, SUPERB largely considers English speech in its evaluation. This paper presents
  multilingual SUPERB (ML-SUPERB), covering 143 languages (ranging from high-resource to
  endangered), and considering both automatic speech recognition and language identification.

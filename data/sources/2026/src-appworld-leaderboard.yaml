quote_extract: '2 3 Agent Scores Raw Data Add your agent to the leaderboard following the instructions
  on GitHub. 🚀 Evaluation Metrics TGC (Task Goal Completion): The percentage of tasks for which the agent
  passes all evaluation tests. SGC (Scenario Goal Completion): The percentage of scenarios for which the
  agent passes all evaluation tests for every task in the scenario. Each scenario contains three task
  variants with different requirements and starting states, so SGC measures consistency across these variants.
  Leaderboard Submission Policy (please read before submitting) To ensure fair and meaningful comparisons
  across leaderbo … rarily revert the environment to an earlier state. This is possible to do in AppWorld
  via database state checkpointing. But such resets can undo actions that are irreversible in real life
  (e.g., sending money), giving an unrealistic advantage. Do not learn from or optimize on the test set.
  Each test task should be attempted independently by the agent, without using information obtained from
  other test tasks or their evaluation results. This also rules out manually inspecting test tasks or
  their evaluation reports to revise prompts or add hints or tips. Training, tuning, or learning from
  the train and development sets is allowed. Approaches that fall outside these constr … them in the main
  leaderboard rankings. All Level 1 Level 2 Level 3 Interactions Plot Scores Plot Scores vs Interactions
  Method LLM Link Date Test-Normal Test-Challenge TGC SGC Interactions TGC SGC Interactions'

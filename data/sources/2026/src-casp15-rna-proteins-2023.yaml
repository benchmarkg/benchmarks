quote_extract: :"The prediction of RNA three-dimensional structures remains an unsolved problem.
  Here, we report assessments of RNA structure predictions in CASP15, the first CASP exercise that
  involved RNA structure modeling. Forty-two predictor groups submitted models for at least one of
  twelve RNA-containing targets. These models were evaluated by the RNA-Puzzles organizers and,
  separately, by a CASP-recruited team using metrics (GDT, lDDT) and approaches (Z-score rankings)
  initially developed for assessment of proteins and generalized here for RNA assessment. The two
  assessments independently ranked the same predictor groups as first (AIchemy_RNA2), second (Chen),
  and third (RNAPolis and GeneSilico, tied); predictions from deep learning approaches were
  significantly worse than these top ranked groups, which did not use deep learning. Further

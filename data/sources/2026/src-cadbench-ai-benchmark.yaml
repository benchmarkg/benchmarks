quote_extract: "ric CAD Bench V3 locally with Harbor 0.23.0, publish the complete job publicly on Harbor
  Hub, and open a submission PR. The task suite itself is free; you pay only your model-API and execution
  costs. New submissions target V3; V1 and V2 remain historical leaderboards. 1. Run the bench Install
  Harbor 0.23.0, pull the V … upload --public V3 uses FreeCAD 1.1.0, gnucleus-freecad-validator 0.6.0
  with the v2 scorer, and Harbor task schema 1.3. Keep the verifier separate, restrict agent networking
  to the selected model provider, and limit agent work to task-required files and state under /app. Failed
  or unscored trials receive zero reward. Use the model's maximum available effort and the 9,000-second
  time limit. Record the effective effort reported by the agent; if a requested setting is unsupported,
  contact us before submitting. Verify the dataset digest before starting: sha256:8a786725d3648a76282fc5868df06da3d5e00d603f283573a53430803465d78a
  Submit one complete 100-task job with exactly one attempt per task and retries disabled. Preserve every
  failed trial in the cohort. Only narrowly defined infrastructure failures may be replaced after review,
  … nclude the exact agent, agent version, model, effective reasoning effort, dataset digest, mean reward,
  and error count. Maintainers verify the complete 100-task cohort and task digests, inspect trajectories,
  spot-check the score with gnucleus-freecad-validator, and audit cost data before displaying the result.
  The repository's existing V2 manifest instructions apply to the historical version; contact the maintainers
  about the V"

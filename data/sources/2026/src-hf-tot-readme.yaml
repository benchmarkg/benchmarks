quote_extract: 'etic operations. # Dataset Usage ## Downloading the Data The dataset is divided into three
  subsets: - **ToT-semantic:** Measuring the semantics and logic of time understanding. Contains 1,850
  examples in total. - **ToT-arithmetic:** Measuring the ability to carry out time arithmetic operations.
  Contains 2,800 examples in total. - **ToT-semantic-large:** Measuring the semantics and logic of time
  understanding in a larger scale. Contains 46,480 examples in total. To download the dataset, install
  [Huggingface Datasets](https://huggingface.co/docs/datasets/quickstart) and then use t … g public libraries
  such as NetworkX. - **Purpose:** ToT is primarily designed for use as a test set. - **Prohibition:**
  Using ToT as a training set is strictly prohibited. Paper: arxiv.org/abs/2406.09170'

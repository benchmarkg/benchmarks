quote_extract: 'on 4 Supporting Objective Features 5 Dataset 6 Submission 7 Baseline 8 Resources 9 Timeline
  10 Contact Task Description The MIREX 2026 Cover Song Generation task asks an AI music system to remake
  a full song according to a style or arrangement prompt. The output can change the style, instruments,
  arrangement, timbre, or tempo, but it should still be recognizable as a v … ull-song arrangement. They
  are not examples of voice conversion or ordinary human-performed covers. Official Test Items The official
  test set contains four source-song and prompt pairs. Each source song is paired with exactly one prompt.
  Participants must generate one complete cover-song output for each … REX task and may not be redistributed.
  Official test materials must not be used for training or fine-tuning. Evaluation The official evaluation
  will be based on expert listening. Three trained evaluators are planned. System identities will be hidden
  during evaluation. Each generated cover will be rated on a five-point scale in the following dimensions:
  Melody - whether the main melody is preserved or plausibly adapted, without salient pitch or contour

quote_extract: 'ults of the General Machine Translation Task organised as part of the 2024 Conference
  on Machine Translation (WMT). In the general MT task, participants were asked to build machine translation
  systems for any of 11 language pairs, to be evaluated on test sets consisting of three to five different
  domains. In addition to participating systems, we collected translations from 8 different large language
  models (LLMs) and 4 online translation providers. We evaluate system outputs with professional human
  annotators using a new protocol called Error Span Annotations (ESA). 1 Introduction The Ninth Conference
  on Machine Translation (WMT24)1 was held at EMNLP 2024 and hosted a number of shared tasks on various
  aspects of machine translation (MT). This conference built on 18 previous editions as a workshop or
  a conference (Koehn and Monz, 2006; Callison-Burch et al., 2007, 2008, 2009, 2010, 2011, 2012; Bojar
  et al., 2013, 2014, 2015, 2016, 2017, 2018; Barraul … n. Due to limited access to monolingual data across

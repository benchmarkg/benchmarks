quote_extract: 'DEMO prompt library of the AILuminate 1.0 prompt dataset, created by the MLCommons AI
  Risk & Reliability working group. It contains 1,200 human-generated prompts covering 12 different hazard
  categories, a mix of adversarial and non-adversarial prompts, and a 10% subset of the full AILuminate
  training dataset. # ⚠️ Conte … String | MLCommons unique identifier for each prompt | # Access to full
  prompt set and AILuminate ensemble evaluator * For MLCommons members we offer **English and French Official
  Practice Prompt data sets** which have 12000 prompts each. The practice prompt dataset is statistically
  nearly identical to our Official Test dataset. If you are a MLCommons member or represent a member organization,
  and wish access to these data sets, [please complete … mlcommons.org/working-groups/ai-risk-reliability/ai-risk-reliability/).

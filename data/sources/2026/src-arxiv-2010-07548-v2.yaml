  To address this issue, we released the MOTChallenge benchmark in 2014, which consisted of three main
  components: (1) a (re-)collection of publicly available and new datasets, (2) a centralized evaluation
  method, and (3) an infrastructure that allows for crowdsourcing of new data, new evaluation methods
  and even new annotations. The ﬁrst release of the dataset named MOT15 consists of 11 sequences for training
  and 11 for testing, with a total of 11286 frames or 996 seconds of video. 3D information was also provided
  for 4 of those sequences. Pre-computed object detections, annotations (only for the training sequences),
  and a common evaluation method for all datasets were provided to all participants, which allowed for
  all results to be compared fairly. Since October 2014, over 1,000 methods have been publicly tested

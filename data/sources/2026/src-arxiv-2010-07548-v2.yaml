  Vision Workshops, 2018. 24 Appendices A Benchmark Submission Our benchmark consists of the database
  and evaluation server on one hand, and the website as the user interface on the other. It is open to
  everyone who respects the submission policies (see next section). Before participating, every user is
  required to create an account, providing an institutional and not a generic e-mail … unique name and
  enter all additional details. It is mandatory to indicate: – the full name and a brief description of
  the method – a reference to the publication of the method, if already existing, – whether the method
  operates online or on a batch of frames and whether the source code is publicly available, – whether
  only the provided or also external training and detection data were used. After creating all details
  of a new tracker, it is possible to assign open challenges to this tracker and submit r … owing information
  for each challenge they want to submit to: – name of the challenge in which the tracker will be participating,
  – a reference to the publication of the method, if already existing, – the total runtime in seconds
  for computing the results for the test sequences and the hardware used, and – whether only provided
  data was used for training, or also data from other sources were involved. The user can then submit
  the results to the challenge in the format described in Sec. B.1. The … paper. In this case, we ask
  to provide the venue and the paper ID or a similar unique reference. We request that a proper reference
  to the method’s description is added upon acceptance of the paper. Anonymous entries are hidden from
  the benchmark after six months of inactivity. The trackers and challenge meta information such as description,
  project page, runtime, or hardware can be edited at any time. Visual results of all public submissions,
  as well as annotations and det … ws for objective performance comparison of multiple target tracking
  approaches on real-world data. Therefore, we introduce a few simple guidelines that must be followed
  by all participants. Training. Ground truth is only provided for the training sequences. It is the participant’s
  own responsibility to ﬁnd the 11 For accountability and to prevent abuse by using several email accounts.
  best setting using only the training data. The use of additional training data must be indicated during
  submission and will be visible in the public ranking table. The use of ground truth labels on the test
  data is strictly forbidden. This or any other misuse of the benchmark will lead to the deletion of the
  participant’s account and their results. Detections. We also provide a unique set of detections (see
  Sec. 4.2) for each sequence. We expect all tracking-by-detection algorithms to use the given detections.
  In case the user wants to present results with another set of detections or is not using detections
  at all, this should be clearly stated during submission and will also be displayed in the results table.
  Submission frequency. Generally, we expect one single submission for a particular method per benchmark.
  If for any reason the user needs to re-compute and re-submit the results (e.g. due to a bug discovered
  in the implementation), they may do so after a waiting period of 72 hours after the last submission
  to submit to the same challenge with any of their trackers. This policy should discourage the use of
  the benchmark server for training and parameter tuning on the test data. The number of submissions is
  counted and displayed for each method. We allow a maximum number of 4 submissions per tracker and challenge.
  We allow a user to create several tracker instances for diﬀerent tracking models. However, a user can
  only create a new tracker every 30 days. Under no circumstances must anyone create a second account
  and attempt to re-submit in order to bypass the waiting period. Such behavior will lead to the deletion
  of the accounts and exclusion of the user from participating in the benchmark. A.2 Challenges and Workshops
  We have two modalities for submission: the general open-end challenges and the special challenges. The
  main challenges, 2D MOT 2015, 3D MOT 2015, MOT16, and MOT17 are always open for submission and are nowadays
  the standard evaluation platform for multi-target tracking methods submitting to computer vision conferences

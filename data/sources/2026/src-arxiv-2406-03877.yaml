quote_extract: "lgorithms as recently acknowledged in the community. For those E2E-AD methods evaluated
  under the closed-loop protocol, they are tested in fixed routes (e.g., Town05Long and Longest6 in CARLA)
  with the driving score as metrics, which is known for high variance due to the unsmoothed metric function
  and large randomness in the long route. Besides, these methods usually collect th … . To fulfill the
  paramount need of comprehensive, realistic, and fair testing environments for Full Self-Driving (FSD),
  we present Bench2Drive, the first benchmark for evaluating E2E-AD systems' multiple abilities in a closed-loop
  manner. Bench2Drive's official training data consists of 2 million fully annotated frames, collected
  from 13638 short clips uniformly distributed under 44 interactive scenarios (cut-in, overtaking, detour,
  etc), 23 weathers (sunny, foggy, rainy, etc), and 12 towns (urban, village, university, etc) in CARLA
  v2. Its evaluation protocol requires E2E-AD models to pass 44 interactive scenarios under different
  locations and weathers which sums up to 220 routes and thus provides a comprehensive and disentangled
  assessment about their driving capability under different situations … -art E2E-AD models and evaluate

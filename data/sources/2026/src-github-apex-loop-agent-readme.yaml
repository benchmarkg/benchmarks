quote_extract: "# APEX-Agents 1.1: `apex_loop_truncated_tools_agent` This repository contains the reference
  agent implementation for APEX-Agents 1.1. The tasks, world seeds, and shared runtime images are in the
  Harbor Hub and Hugging Face datasets. The agent is a minimal LiteLLM tool-calling loop over the world's
  MCP tools. Tool output is truncated to 200 lines or 32K characters and the agent has a default of 100
  total steps (turns) and a 10,800 second timeout, matching the leaderboard runs. ## Usage Install Docker
  and `uv`, then install Harbor: ```bash uv tool install harbor==0.20.0 ``` Clone this repository … ings,
  set `APEX_MODEL_EXTRA_ARGS` in `.env`. It is a JSON object of extra LiteLLM arguments sent with every
  model call. When it is unset, the model runs with provider defaults (for Claude, without extended thinking).
  The leaderboard's Claude Opus 5.5 run used: ```bash APEX_MODEL_EXTRA_ARGS='{\"output_config\": {\"effort\"\
  : \"max\"}, \"thinki … load the delivery and load the three shared images: ```bash hf download mercor/apex-agents-v1.1
  \\ --repo-type dataset \\ --revision 1.1.1 \\ --local-dir apex-agents-v1.1 bash apex-agents-v1.1/environment/load_images.sh
  ``` Run a task: ```bash PYTHONPATH=\"$PW"

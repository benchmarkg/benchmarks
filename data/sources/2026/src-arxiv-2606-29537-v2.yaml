  A sweep of model performance under different reasoning-effort levels, plotted against output tokens
  per task. Even with more reasoning effort, model scores on OSWORLD 2.0 remain far below their OSWORLD
  1.0 performance. ∗Full contributor list and acknowledgments are provided in Appendix A. 1 1 Introduction
  People use computers for a wide range of everyday and professional work, from web browsing and document
  editing … t kept pace with their deployment, and it remains unclear how much of this real-world work
  they can actually complete. Existing benchmarks fall short of capturing real-world computer-use performance.
  While Claude Opus 4.8 [2] reaches 83.5% on OSWorld-Verified [83, 84], suggesting desktop computer use
  is largely solved, the tasks behind this number are short and narrow, rarely spanning more than one
  or two applications, and reward completing self-contained … ert interviews and trained-annotator research,
  with input artifacts collected or adapted from real materials rather than synthesized. Second, long-horizon
  structure: each task’s difficulty comes from a workflow that decomposes into interdependent steps across
  multiple applications, not from repetition or the concatenation of unrelated subtasks. Third, diverse
  challenge phenomena: every task is annotated with ten phenomena, such as cross-source reasoning, implicit-state
  inference, conflict disambiguation, and dynamic environments, that each probe a distinct capability
  and jointly stress the structural demands of real work. To realize them, OSWORLD 2.0 self-hosts 31 task-facing
  web services such as email, banking, and team chat with controlled, scoreable states, seeds each task
  from a coherent stateful user profile, injects mid-task messages so the environment changes under the
  agent, and exposes a simulated user with bounded knowledge. We score the final s … dels than on agents
  that can act on streaming, continuously changing interfaces, keep a task-level model in memory across
  long horizons, and catch and repair their own mistakes before they propagate. We release the environment,
  the 108 tasks, the self-hosted websites, and agent rollout trajectories to support future research in
  this direction. 2 OSWORLD 2.0 Benchmark OSWORLD 2.0 builds on the OSWorld [83] evaluation platform and
  extends it with improvements in task scope, environment design, task complexity, and evaluation methodology.
  Tab … ategies in this proposal stage, with team brainstorming and expert-style annotation as the primary
  source and the other channels as supporting sources. Team brainstorming and expert-style annotation.
  The bulk of OSWORLD 2.0 tasks were produced by a small group of internally trained annotators who worked
  end-to-end on the tasks they proposed, covering task design, input artifact construction, environment
  setup, and evaluation function implementation. Annotators first learned the target domain by watching
  tutorials on YouTube, reading official documentation, and directly experimenting with the software,
  which equipped them to reason about professional tools and workflows, or enterprise systems in sufficient
  depth. They th … rse for the long-horizon workflows in OSWORLD 2.0. It assigns the same score to 4 an
  agent that makes no meaningful progress and one that completes most subtasks but misses a final verification
  step. We therefore use fine-grained partial rewards with task-specific checkpoints, averaging 27.25
  checkpoints per task. To support different valid solution paths, we score the final environment state
  against all checkpoints rather than a fixed checkpoint order. Functional and model-based evaluation.
  We prioritize functional evaluation whenever possible, using checks over concrete environment states
  and output artifacts. But some tasks require more openended judgments, such as whether an edited image
  meets visual requirements or whether an email is contextually appropriate. For these cases, we use model-based
  evaluat … instead of open-ended grading. Each judge prompt is validated on labeled correct and confusable
  incorrect states across supported judge models, and is accepted only when it is consistently accurate.
  Overall, model-based evaluation contributes 11.53% of the total score, and no task relies on it for
  more than 50%. Detailed statistics are reported in Appendix E.1. 2.1.4 Annotation and Quality Assurance
  Once a candidate becomes an executable task specification, it enters the three-stage quality-assurance
  stack shown on the right of Figure 2. A coding agent first generates an initial battery of unit tests
  that implement the scoring rubric and exercise the expected solution paths. Two independent human annotators
  then complete the task end-to-end and cross-check whether the instruction is solvable from the provided
  environment, whether the rubric captures the intended outcome, and whether the scoring checkpoints cover
  the main workflow with b … iments 3.1 Setup Models. We evaluate seven computer-use model families: Claude
  Opus 4.8, Claude Opus 4.7, Claude Sonnet 4.6 [3], GPT-5.5, Qwen 3.7-Plus, MiniMax M3, and Kimi 2.6.
  Agent configuration. All models use screenshot observations, and the step budget is 500. Claude models
  act through the native claude_computer_use tool, while the remaining models emit pyautogui code actions.
  Generation is capped at 16K output tokens, or 8K for MiniMax M3. A 3 s pause is inserted after each
  action. We test two tool-use settings: batched (batch; multiple tool calls per step) and single (st
  … one tested setting per point: low, medium, high, and xhigh for GPT-5.5, and those four plus max for
  the Claude Opus models, with Sonnet 4.6 evaluated at medium and max. Infrastructure and evaluation.
  Runs execute headlessly on AWS CPU instances in us-east-1, defaulting to t3.2xlarge and using larger
  types when needed. Multiple environments run in parallel. All web traffic is routed through a residential
  proxy. Model-based evaluation and the human-in-the-loop user simulator both use Claude Sonnet 4.6 (Appendix
  E.1). All runs use release v2026.06.24. 3.2 Main Results Table 3: Main 500-step results, grouped by

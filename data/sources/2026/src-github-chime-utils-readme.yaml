quote_extract: 'LI commands: - `chime-utils dgen` - generates and downloads CHiME-8 data. - `chime-utils
  lhotse-prep` - prepares CHiME-8 data lhotse manifests. - `chime-utils espnet-prep` - prepares CHiME-8
  data ESPNet/Kaldi-style manifests. - `chime-utils score` - scripts used for official scoring. Hereafter
  we describe each command/function in detail. ## Data generation ### ⚡ All DASR data in one go (recommended)
  You can generate all CHiME-8 DASR data in one go with: `chime-utils dgen dasr ./download /path/to/mixer6_root
  ./chime8_dasr --part … ou can always use some `--help`. This script will download CHiME-6, DiPCo and
  NOTSOFAR1 automatically in `./download` Ensure you have at least 1TB of space there. You can remove
  the `.tar.gz` after the full data preparation to save some space later. Mixer 6 Speech instead has to
  be obtained through LDC. Refer to [chimechallenge.org/current/task1/data](https://www.chimechallenge.org/current/task1/data)
  on how to obtain Mixer 6 Speech. The Mixer 6 root folder should look like this: ``` mixer6_root ├──
  data │ └── pcm_flac ├── metadata │ ├── iv_compone … tse](https://github.com/lhotse-speech/lhotse)) -
  [ESPNet](https://github.com/espnet/espne) (with [lhotse](https://github.com/lhotse-speech/lhotse)) See
  [DATAPREP.md](./DATAPREP.md). ## Scoring Last but not least, we also provide scripts for scoring (the
  exact same scripts organizers will use for ranking CHiME-8 DASR submissions). To learn more about scoring

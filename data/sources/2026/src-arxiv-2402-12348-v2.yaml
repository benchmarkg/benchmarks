  methods achieve NRA as −1, meaning that LLM agents can barely win even a single match. This is because
  for board games with moderate action/state space such as the four involved complete and deterministic
  games in GTBENCH, MCTS agents with a sufficient number of simulations can achieve near-optimal strategies.

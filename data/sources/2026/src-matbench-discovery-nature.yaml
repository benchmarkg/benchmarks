  eal-world stability but are more expensive to simulate, especially at scale. Additionally, ML models
  that require relaxed structures as input create a circular dependency with the DFT calculations they
  are meant to accelerate, reducing their practical utility for discovery. (3) Informative metrics: Global
  metrics such as mean absolute error (MAE), root mean squared error (RMSE) and R2 may provide practitioners
  with misleading confidence regarding model reliability. Even models with strong regression performance
  can produce unexpectedly high rates of false-positive predictions when nominally accurate estimates
  fall near decision boundaries, resulting in substantial opportunity costs through wasted laboratory
  resources and time. Consequently, models should be e [...] or of 5 eV per atom or greater), we assign
  the dummy regression values and a negative classification prediction to these points. The discovery
  acceleration factor (DAF) quantifies how many times more effective a model is at finding stable structures
  compared with random selection from the test set. Formally, the DAF is the ratio of the precision to
  the prevalence. The maximum possible DAF is the inverse of the prevalence, which on our dataset is (33,000/215,000)−1
  ≈ 6.5. Thus, the current state-of-the-art of 5.04 achieved by EquiformerV2 + DeNS leaves room for improvement.
  However, evaluating each model on the subset of the 10,000 materials that each model ranks as being
  most stable (Supplementary Table 2), we see an impressive DAF of 6.33 for EquiformerV2 + DeNS, [...]
  ethodology for materials discovery must reflect. In light of this utilitarian perspective, our benchmark
  contains models trained on varying datasets, and any model that can intake more physical modalities
  from DFT calculations is a valid model for materials discovery. We define the MP3 v.2022.10.28 database
  release as the maximum allowed training set for any compliant model submission. Models may train on
  the complete set of relaxation frames, or any subset thereof such as the final relaxed structures. Any
  subsets of the energies, forces and stresses are valid training targets. In addition, any auxiliary
  tasks such as predicting electron densities, magnetic moments, site-partitioned charges and so on that
  can be extracted from the output of the DFT calculations are allowed for multi-task learning49. Our
  test set consists of the unrelaxed structures in the WBM dataset50. Their target values are the PBE
  formation energies of the corresponding DFT-relaxed structures. Limitations of this framework While
  the framework proposed here directly mimics a common computational materials discovery workflow, it
  is worth highlighting that there still exist notable limitations to these traditional computational
  workflows that can prevent the material candidates suggested by [...] ructures not found in MPtrj that
  could be added to the training set within the scope of the benchmark. We note that the v.2023.11.1 deprecated
  a large number of calculations so data queried from subsequent database releases are not considered
  valid for this benchmark. WBM test set The WBM dataset50 consists of 257,487 structures generated via
  chemical similarity-based elemental substitution of MP source structures followed by DFT relaxation
  and calculating each crystal’s convex hull distance. The element substitutions applied to a given source
  structure were determined by random sampling according to the weights in a chemical similarity matrix
  data-mined from the ICSD61. The WBM authors performed five iterations of this substitution process (we
  refer to these steps as batches). After each step, the newly generated structures found to be thermodynamically
  stable after DFT relaxation flow back into the source pool to partake in the next round of substitution.
  This split of the data into batches of increasing substitution count is a unique and compelling feature
  of the test set as it allows out-of-distribution testing by examining whether model performance degrades
  for later batches. A higher number of elemental substitutions on average carries the structure farther
  away from the region of material space covered by the MP training set (see Supplementary Fig. 6 for
  details). While this batch information makes the WBM dataset an exceptionally useful data source for
  examining the extrapolation performance of ML models, we look primarily at metrics that consider all
  batches as a single test set. To control for the potential adverse effects of leakage between the MP
  training set and the WBM test set, we cleaned the WBM test set based on protostructure matching. We
  refer to the combination of a materials prototype and the elemental assignment of its wyckoff positions
  as a protostructure following ref. 62. First we removed 524 pathological structures in WBM based on
  formation energies being larger than 5 eV per atom or smaller than −5 eV per atom. We then r [...] M
  test set all examples where the final protostructure of a WBM material matched the final protostructure
  of an MP material. In total, 11,175 materials were cleaned using this filter. We further removed all
  duplicated protostructures within WBM, keeping the lowest energy structure in each instance, leaving
  215,488 structures in the unique prototype test set. Throughout this work, we define stability as being
  on or below the convex hull of the MP training set (EMP hull dist ≤ 0). In total, 32,942 of 215,488
  materials in the WBM unique prototype test set satisfy this criterion. Of these, ~33,000 are unique
  prototypes, meaning they have no matching structure prototype in MP nor another higher-energy duplicate
  prototype in WBM. Our code treats the stability threshold as a dynamic parameter, allowing for future
  model comparisons at different thresholds. For initial analysis [...] al use case studied here. The
  authors trained MACE on the MPtrj dataset; these models have been shared under the name ‘MACE-MP-0’
  (ref. 52) and we report results for the ‘2023-12-03’ version commonly called ‘MACE-MP-0 (medium)’. For
  simplicity we refer to this model as ‘MACE’. (5) CHGNet23 (EFSGM): CHGNet is a UIP for charge-informed
  atomistic modelling. Its distinguishing feature is that it was trained to predict magnetic moments on
  top of energies, forces and stresses in the MPtrj dataset (which was prepared for the purposes of training
  CHGNet). By modelling magnetic moments, CHGNet learns to accurately represent the orbital occupancy
  of electron [...] large corpus of available training data. We trained Voronoi RF on the MP-crystals-2022.10.28
  dataset for this benchmark. Data availability The Matbench Discovery training set is the latest Materials
  Project (MP)3 database release (v.2022.10.28 at time of writing). The test set is the WBM dataset50,
  which is available via Figshare at https://figshare.com/articles/dataset/22715158 (ref. 82). A snapshot
  of every ionic step including energies, forces, stresses and magnetic moments in the MP database is
  available via Figshare at https://figshare.com/articles/dataset/23713842 (ref. 83). All other data files
  such as phase diagrams and structures in both ASE and pymatgen format are also available in the WBM
  dataset via Figshare at https://figshare.com/articles/dataset/22715158 (ref. 82). Code availability
  The Matbench Discovery framework, including benchmark implementation, evaluation code and model submission
  tools, is available as an open-source Python package and via GitHub at https://github.com/janosh/matbench-discovery,
  with a permanent version available via Zenodo at https://doi.org/10.5281/zenodo.13750664 (ref. 84).

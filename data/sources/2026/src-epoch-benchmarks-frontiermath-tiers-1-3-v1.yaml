  released v2. This page is no longer updated. About Methodology Citation FrontierMath Tiers 1-3 (v1,
  old) FrontierMath is a benchmark of hundreds … a researcher in the relevant branch of mathematics, and
  for the upper end questions, multiple days. The full FrontierMath dataset contains 350 problems. This
  is split into a base set of 300 problems, which we call Tiers 1-3, and an expansion set of 50 exceptionally
  difficult problems, which we call Tier 4. We have made 10 problems from Tiers 1-3 public, calling this
  frontiermath-2025-02-28-public. The remaining 290 problems make up frontiermath-2025-02-28-private.
  Similarly, we have made 2 problems from Tier 4 public, calling this frontiermath-tier-4-2025-07-01-public,
  while the remaining 48 problems make up frontiermath-tier-4-2025-07-01-private. Unless explicitly mentioned
  otherwise, all the numbers on this hub correspond to evaluations on the … dware for the year 2025. Here
  is the problem to solve. The answer type is {answer type}. {question} This implementation is different
  from the code we used to run preliminary evaluations in the paper. It is also not the methodology used
  by OpenAI in their own FrontierMath evaluations, such as for the o3 and o3-mini models: we were not
  involved in running these evaluations. The difference between our results and OpenAI’s might be due
  to OpenAI evaluating with a more powerful internal scaffold, using more test-time compute, or because
  those results were run on a different subset of FrontierMath (the 180 problems in frontiermath-2024-11-26
  vs the 290 problems in frontiermath-2025-02-28-private). Changelog 2026-01-23. We identified issues
  with two Tier 4 problems that affected prior scores. In one case the issue was with our grader, so we
  could re-grade solutions given by models on prior runs. The models that got this problem right were:

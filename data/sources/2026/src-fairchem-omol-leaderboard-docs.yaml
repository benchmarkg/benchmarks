quote_extract: 'traightforward evaluation for MLIPs - given a structure, how well can you predict the
  total energy and per-atom forces. Evaluations correspond to several chemistry relevant tasks (spin gap,
  ligand-strain, etc.) introduced in OMol25 to evaluate MLIPs beyond simple energy and force metrics (see
  the paper for more details). The simplest way to get started is to have an ASE-compatible MLIP calculator
  that can make energy and force predictions. Input data for the different benchmarks can be downloaded
  below. Download¶ Benchmarks URL S2EF (Val/Test) HuggingFace D … =0.1.1" S2EF¶ The leaderboard supports
  S2EF evaluations for both the OMol25 “Validation” and “Test” sets. Validation labels are already accessible
  in the released dataset for local benchmarking and debugging, so we highly encourage users to make Test
  submissions to fairly and accurately compare models. The size of each split is as follows: Split Size
  Val 2,762,021 Test 2,805,046 Predictions must be saved as “.npz” files and shall contain the following
  information: ids energy forces natoms Where, … te(forces) np.savez_compressed( "test_predictions.npz",
  ids=ids, energy=energy, forces=forces, natoms=natoms, ) Warning The above example can be very slow on
  a single GPU and we encourage users to parallelize this however they like. We provide the example as
  a means to understand the expected format for the leaderboard. Once a prediction file is gene … ic devices
  and photactive catalysts. For a detailed descripion of each task we refer people to the original manuscript.
  To generate prediction files for the different tasks, we have released a set of recipes to be used with
  ASE-compatible calculators. Each evaluation task has its own unique structure, a detailed description
  of the expected output is provided in the rec'

quote_extract: 'ructure) without user intervention or hyperparameter tuning. We test Automatminer on the
  Matbench test suite and compare its predictive power with state-of-the-art crystal graph neural networks
  and a traditional descriptor-based Random Forest model. We find Automatminer achieves the best performance
  on 8 of 13 tasks in the benchmark. 1 We also show our test suite is capable of exposing predictive advantages
  of each algorithm – namely, that crystal graph methods appear to outperform traditional machine learning
  methods given ~104 or greater data points. The pre-processed, ready-t … ner to evolve over time, although
  the current versions of these tools are ready for immediate use. As evidence of its usefulness, Kabiraj
  et al.18 have recently used Automatminer in their research on 2D ferromagnets. Results Matbench test
  suite v0.1 The Matbench test suite v0.1 contains 13 supervised ML tasks from 10 datasets. Matbench’s
  data is sourced from various sub-disciplines of materials science, such as experimental mechanical properties
  (alloy strength), computed elastic properties, computed and experimental electronic properties, optical
  and phonon properties, and thermodynamic stabilities for crystals, 2D materials, and disordered metals.
  The number of samples in each task ranges from 312 to 132,752, representing both relatively scarce experimental
  materials properties and comparatively abundant properties such as DFT-GGA19 formation energies. Each
  task is a self-contained dataset containing a single material primitive as input (either composition
  or composition plus crystal structure) and target property as output for each sample. To help enforce
  homogeneity, datasets are precleaned to remove unphysical computed data and task-irrelevant experimental
  data (see Methods for more details); thus, as opposed to many raw datasets or structured online repositories,
  Matbench’s tasks have already had their data cleaned for input into ML pipelines. We recommend the datasets
  be used as-is for consistent comparisons between models. To mitigate model and sample selection biases,
  each task uses a consistent nested cross-validation16 procedure for error estimation (see 5 Methods).
  The distribution of datasets with respect to application type, sample count, type of input data, and
  … ject20,21,26 4,764 Yes (no unit) DFT-GGA Experiment Experiment Experiment DFPT-GGA Formation Energy
  (eV/atom) Regression Formation Energy (eV/atom) Regression Freq. at Last Phonon PhDOS Peak (1/cm) Regression
  Exfoliation Energy (meV/atom) Regression Steel yield strength (GPa) Regression Materials Project20,21
  132,752 Yes Castelli et al. 9 18,928 Yes Materials Project20,21,27 1,296 Yes JARVIS DFT 2D28 636 Yes
  Citrine Informatics29 312 No 6 DFT-GGA DFT-GGA DFPT-GGA DFT-vDW-DF Experiment 7 Figure 1: Categorical
  dataset distribution of the 13 machine learning tasks in the Matbench test suite v0.1. Methods of categorization
  are listed on the left: “Application” describes the ML target p … erall score. Note that within each
  of the five runs of this outer loop, the training data portion is generally split using an inner cross-validation
  that is used for model selection within the training data, hence the name "Nested Cross Validation"
  (in our procedure, an algorithm can make use of the training data however it chooses). One advantage
  of 5-fold nested CV over a traditional train-test split is that each sample in the overall dataset is
  present as training in four of the splits and as test in one of the splits. For all tasks, the Automatminer
  “Express” preset config … t the Automatminer Express 11 preset is a single configuration capable of
  fitting on all Matbench tasks with no additional input or configuration. We do not modify this preset
  for different tasks. Four alternative algorithms are used for comparison. To simulate a control, a Dummy
  model predicts the mean of the training set (regression) or randomly selects a label in proportion to
  the distribution of the training set (classification). As a second baseline representing commonly used
  methods, we employ a Random Forest34 model (RF) using Magpie elemental statistics25 and Sine Coulomb
  Matrix35 (if structures are present in the dataset) to predict each property. Finally, for tasks containing
  relaxed structures, we also test against CGCNN33 and MEGNet36, two graph-network algorithms for general-purpose
  property prediction. It must be emphasized that a goal of Matbench is to minimize arbitrary biases when
  comparing models. Therefore, the four alternatives and Automatminer all underwent identical error estimation
  procedures (NCV on identical folds) for each task. For some Matbench tasks, we were able to find published
  scores of researcher-optimized machine learning models, which we label as the “Best Literature” score.
  However, it should be noted that although these studies report the same error metric (MAE) … ical datasets
  (e.g., using different data filtering algorithms to remove erroneous or unreliable data points) or the
  same error estimation procedure (e.g., they do not use nested cross validation and may use different
  proportions of train and test). Therefore, these scores cannot be directly compared to the algorithms
  listed above. 12 Figure 3: Comparison of machine learning algorithm accuracies on the Matbench v0.1
  test suite (see Table 1 for more details of the test sets). Numbers on each square represent either
  the mean average error (regression) or mean ROC-AUC (classification) of a five-fold nested cross validation
  (NCV), except for "Best Literature" scores. Best Literature scores were taken from published literature
  models23,37,38 evaluated on similar tasks or datasets, often subsets of those in Matbench, and do not
  use NCV. Colors represent “prediction quality” with respect to either the dataset target mean average
  deviation (MAD) or the high/low limits of ROC-AUC (0.5 is equivalent to random, 1.0 is best); blue and
  red represent high and low prediction qualities, respectively. The best score for each task is outlined
  with a black box (The "Best Literature" scores are excluded because they do not use the same testing
  protocol). To account for variance … behind grouped CV is that the testing procedure should mimic the
  real-world application. In the case of bulk metallic glass study, the intended goal of the algorithm
  was to make predictions in chemical systems where no data points were yet present. However, a randomized
  train/test split would likely result in selecting some data points from all chemical systems for the
  training and testing data. Instead, grouped CV will first separate data points by chemical space, and
  then select an entire chemical space to fall into either the test or training set. This ensures that
  testing is conducted on new chemical spaces for which there is no trainin … in that particular subfield.
  We chose NCV as a standard error estimator because there are few such well-agreed-upon procedures for
  existing materials datasets. Future versions of the benchmark may include error estimation procedures
  other than NCV. Matbench is not intended to be a final benchmark but a versioned resource that will
  grow with the field. The ever-increasing volume of data generated from advances in high-throughput experimentation
  and computation may enable future ML algorithms to predict classes of materials properties that are
  presently sparse. For example, ab initio defect calcula … om compositions, crystal structures, and electronic
  band structures. As new research is released for converting materials objects to machinelearnable descriptors,
  we intend on incorporating this knowledge into Automatminer’s architecture. Conclusion We presented
  Matbench v0.1, a set of ML tasks aimed at standardizing comparisons of materials property prediction
  algorithms. We also introduced Automatminer, a fully-automated pipeline for predicting materials properties,
  which we used to set a baseline across the task set. Using Matbench, we compare Automatminer with crystal
  graph neural network models, a traditional Ran … d outside of benchmarking to make predictions automatically
  and seed research for more specialized, hand-tuned models. We encourage evaluating new ML algorithms
  on the Matbench benchmark and comparing with the latest version of Automatminer. Methods Raw data for
  Matbench v0.1 were obtained by downloading from the original sources. Tabular versions of some datasets
  are available online through Matminer’s dataset retrieval tools. These datasets contain metadata and
  auxiliary data. In contrast, the final Matbench datasets are curated tasks containing only the materials
  input objects and target variables, with all extraneous data removed. 22 Unphysical (e.g., negative
  DFT elastic moduli), highly uncommon or unrepresentative samples (e.g., solid state noble gases) were
  removed according to a specific per-task procedure. Table 2 describes the resources and steps needed
  to recreate each dataset from the original source or Matminer version. Table 2: Procedures and sources
  for creating datasets in Matbench v0.1. "Original Source" denotes the original work that produced …
  compositions, removing compositions with any conflicting bulk metallic glass formation classifications.
  Five-fold nested cross validation was used to evaluate each algorithm on every task of the benchmark.
  The outer test loop of the cross validation used uniformly randomized splits generated with scikit-learn45
  KFold (random seed 18012019). The splits were identical for each algorithm. Classification tasks used
  stratified cross validation generated with StratifiedKFold (random seed 18012019) to more accurately
  represent classification performance with unbalanced numbers of each class label. Within each of the
  five splits, 80% training + validation data is given to the algorithm to optimize the model internally,
  and the remaining 20% is 24 used for testing. After predicting on each of the five 20% test splits,
  the error or AUC is averaged over the five folds. The internal validation and model selection process
  is dependent on the algorithm. It is worthwhile to quickly enumerate the limitations of NCV and justify
  its use. First, NCV is computationally expensive. For k-fold NCV, the traditional holdout tun … re set
  up and executed using the FireWorks49 software package. Data Availability Instructions for downloading
  and using the Matbench benchmark can be viewed on the official documentation (https://hackingmaterials.lbl.gov/automatminer/datasets.html).
  The datasets can also be interactively viewed and examined on the Materials Project MPContribs-ML platform
  (https://ml.materialsproject.org) as serialized tabular data. The code for retrieving and loading the
  Matbench datasets can be found in the dataset_retrieval folder of the Matminer code (https://github.com/hackingmaterials/matminer).

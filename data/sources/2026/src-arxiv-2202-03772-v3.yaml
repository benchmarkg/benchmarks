  a collimated spray of outgoing particles. Jet tagging is the process of identifying the type of particle
  that initiates a jet. It is essentially a classification task that aims to distinguish jets arising
  from particles of interest, such as the Higgs boson or the top quark, from other … (QCD), the theory
  governing the evolution of particles inside a jet. The rise of deep learning has led to a plethora of
  new approaches (Larkoski et al., 2020). The prevailing ones represent a jet as a particle cloud, i.e.,
  an unordered and variable-sized set of the outgoing particles, as illustrated in Figure 1. Based on
  the particle cloud representation, ParticleNet (Qu & Gouskos, 2020) adapts the Dynamic Graph CNN architecture
  (Wang et al … ming parton showering and hadronization, and produce the final outgoing particles1. To
  be close to realistic jets reconstructed at the ATLAS or CMS experiment, detector effects are simulated
  with DELPHES (de Favereau et al., 2014) using the CMS detector configuration provided in DELPHES. In
  addition, the impact parameters of electrically charged particles are smeared to match the resolution
  of the CMS tracking detector (CMS Collaboration, 2014 … rk (CMS Collaboration, 2020b), such as H → b¯b,
  H → cc¯, t → bqq′, etc., but is missing from most of the existing datasets. Training, validation and
  test sets. The training set consists of 100 M jets in total, equally distributed in the 10 classes.
  An additional set of 500 k jets per class (in total 5 M) is intended for model validation. For the evaluation
  of performance, a separate test set with 2 M jets in each class (in total 20 M) is provided. Evaluation
  metrics. To thoroughly evaluate the performance of deep learning models on this dataset, we advocate
  for a series of metrics. Since jet tagging on this dataset is naturally framed as a multi-class classification

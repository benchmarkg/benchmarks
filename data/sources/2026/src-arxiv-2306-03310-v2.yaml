quote_extract: 'transfer of declarative knowledge of entities and concepts, lifelong learning in decision-making
  (LLDM) also necessitates the transfer of procedural knowledge, such as actions and behaviors. To advance
  research in LLDM, we introduce LIBERO, a novel benchmark of lifelong learning for robot manipulation.
  Specifically, LIBERO highlights five key research topics in LLDM: 1) how to efficiently transfer declarative
  knowledge, procedural knowledge, or the mixture of both; 2) how to design effective policy architectures
  and 3) effective algorithms for LLDM; 4) the robustness of a lifelong learner with respect to task ordering;
  and 5) the effect of model pretraining for LLDM. We develop an extendible procedural generation pipeline
  that can in principle generate infinitely many tasks. For benchmarking purpose, we create four task
  suites (130 tasks in total) that we use to investigate the above-mentioned research topics. To support
  sample-efficient learning, we provide high-quality human-teleoperated … ehavioral cloning (BC) [4] to
  train policies for individual tasks (See (2)). BC allows for efficient policy learning such that we
  can study lifelong learning algorithms with limited computational resources. To train BC, we provide
  50 trajectories of high-quality demonstrations for every single task in the generated task suites. The
  demonstrations are collected by human experts through teleoperation with 3Dconnexion Spacemouse. 5 Experiments
  Experiments are conducted as an initial study for the five research topics mentioned in Section 3. We
  first introduce the evaluation metric used in experiments, and present analysis of empirical results
  i … ing affect knowledge transfer in LLDM? Q5: How robust are different LL algorithms to task ordering
  in LLDM? Q6: Can supervised pretraining improve downstream lifelong learning performance in LLDM? 5.1
  Evaluation Metrics We report three metrics: FWT (forward transfer) [20], NBT (negative backward transfer),
  and AUC (area under the success rate curve). All metrics are computed in terms of success rate, as previous
  literature has shown that the success rate is a more reliable metric than training loss for manipulation
  policies [42] (Detailed explanation in Appendix E.2). Lower NBT means a policy has better performance'

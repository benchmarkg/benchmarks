  trajectories from the authors of sGDML. This class provides access to the original MD17 datasets, their
  revised versions, and the CCSD(T) trajectories. For every trajectory, the dataset contains the Cartesian
  positions of atoms (in Angstrom), their atomic numbers, as well as the total energy (in kcal … ch_geometric.transforms.RadiusGraph
  transform, with its cut-off being a hyperparameter. The original MD17 dataset contains ten molecule
  trajectories. This version of the dataset was found to suffer from high numerical noise. The revised
  MD17 dataset contains the same molecules, but the energies and forces were recalculated at the PBE/def2-SVP
  level of theory using very ti … convergence and very dense DFT integration grid. The third version of
  the dataset contains fewer molecules, computed at the CCSD(T) level of theory. The benzene molecule
  at the DFT FHI-aims level of theory was released separately. Check the table below for detailed information
  on the molecule, level of theory and number of data points contained in each dataset. Which trajectory
  is loaded is determined by the name argument. For the coupled cluster trajectories, the dataset comes
  with pre-defined training and testing splits which are loaded separately via the train argument. Molecule
  Level of Theory Name #Examples Benzene DFT benzene 627,983 Uracil DFT uracil 133,770 Naphthalene DFT

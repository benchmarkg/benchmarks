quote_extract: "## Response to the Epoch AI review *Posted 2026-10-23 by the CMT-Benchmark authors, in
  reply to [Epoch AI's review of v1.0.0](https://epoch.ai/benchmarks/cmt-benchmark/review).* … We identified
  10 of them ourselves, and the corrections are merged into this dataset as v2.0.0 (see the changelog
  above). … The Epoch review evaluates v1.0.0; results should be cited against the current version. …
  2. **We do not accept that 30 of the 50 problems are erroneous.** … In our reading, most of the items
  they flag are not errors. They are conventions standard in the relevant subfield that we deliberately
  left unstated. … Rewriting the problems to spell out every convention also makes them easier. So higher
  scores on the \"repaired\" set do not, by themselves, show that the original problems were graded wrongly.
  … 3. **The grading code is public.** The official evaluation and parsing code is available at … Results
  on the benchmark should be computed with that scorer, not with an LLM judge. … Where we agree that a
  problem is wrong or genuinely ambiguous, we will correct it in a versioned release with a changelog."

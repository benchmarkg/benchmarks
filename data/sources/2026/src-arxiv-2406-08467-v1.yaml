  In total, our DafnyBench benchmark contains 782 ground_truth stand-alone Dafny programs that compile.
  These problems come from the following sources: • GitHub Scrape: We scraped all publicly available Dafny
  files on GitHub published on the before the end of 2023. The relevant files were returned from the GitHub
  API using the language:Dafny search command. We then de-duplicated the … from ∼15,000 to ∼5,000. We
  then attempted to verify each of these remaining files using the dafny verify command with a local installation
  of Dafny 4.3.0, and removed any files that did not verify. At this stage, we removed all of the files
  from the Clover repository [9], which had already been formatted as benchma … ,112 files. We found that
  374 of these files lacked ensures statements, and 459 of lacked assert and invariant clauses. We removed
  the union of these sets, which left us with 556 ground_truth files. Out of these files, 113 verify without
  any compiler hints. To mitigate data contamination, models run on our benchmark should ideally not be
  trained on data from the repositories listed in Appendix D. • Clover: We added 62 ground truth textbook
  Dafny programs provided by the Clover dataset [9]. We formatted these to fit our benchmark style and
  removed their compiler hints. Out of these files, 23 verify without any compiler hints. • Dafny-synthesis:
  Finally, we included 164 Dafny programs provided by the dafny-synthesis benchmark. These problems have
  been translated from the MBPP benchmark [10]. Out of these files, 72 verify without any compiler hints.

  Classification Submission policy The 1513 scans of the ScanNet dataset release may be used for learning
  the parameters of the algorithms. The test data should be used strictly for reporting the final results
  -- this benchmark is not meant for iterative testing sessions or parameter tweaking. Parameter tuning
  is only allowed on the training data. Evaluating on the test data via this evaluation server must only
  be done once for the final system. It is not permitted to use it to train systems, for example by trying
  out different parameter values and choosing the b … t parameter settings of an algorithm can therefore
  only be reported on the training set. To help enforcing this policy, we block updates to the test set
  results of a method for two weeks after a test set submission. You can split up the training data into
  training and validation sets yourself as you wish. It is not permitted to register on this webpage with
  multiple e-mail addresses nor information misrepresenting the identity of the user. We will ban users
  or domains if required. Data Download: If you would like to download the ScanNet data, please fill out
  an agreement to the ScanNet Terms of Use and send it to us at the scannet group email. For more information
  regarding the ScanNet dataset, please see our git repo. The ScanNet and ScanNet200 benchmarks are sharing
  the source data, but different in the annotation parsing. Please refer to the provided preprocessing
  scripts for ScanNet200. Tasks Data Requirements: For all tasks, both 2D and 3D data modalities can be

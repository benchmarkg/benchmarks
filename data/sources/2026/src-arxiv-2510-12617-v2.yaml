  shards and sample buffers. A PREPRINT - DECEMBER 12, 2025 Here, we show that practical implementation
  choices made in BEND inadvertently influence benchmark results. The framework introduces dependencies
  on hardware-specific hyperparameters such as the number of data loading workers and buffer sizes. When
  combined … ers will likely correlate with the computational resources available to the researchers and
  the dimension of embeddings of the model being evaluated. As a consequence, the results of BEND are
  biased to favour better resourced researchers, and introduce complex biases towards different model
  architectures. We demonstrate that a simple pre-shuffling approach can eliminate these dependencies
  without changing BEND implementation details, while maintaining or improving performance across all
  tasks. Our work contributes to the broader conversation about benchmark design best practices … act
  of pre-shuffling the CpG methylation task data on two additional LM architectures, DNABERT-2 [4] and
  ResNet-LM, a baseline model proposed by [1]. Code is publicly available at https://github.com/baillielab/BEND.

quote_extract: 'ho annotated the validation set and the other 2 were randomly sampled. The remaining 3
  radiologist annotations were used to benchmark radiologist performance. Here, we are releasing the following:
  1. Test set annotations from each of the individual radiologists, divided into the benchmark radiologists,
  and the groundtruth. The majority vote ground truth is given in groundtruth.csv. The actual images corresponding
  to the test set are now available here: https://stanfordaimi.azurewebsites.net/datasets/23c56a0d-15de-405b-87c8-99c30138950c
  2. The chexpert and chexbert labeler outputs for these studies. 3. Predictions and decisions made by
  some of the leaderboard models on these studies. These models were used to support the findings in CheXternal:
  https://arxiv.org/pdf/2102.08660.pdf'

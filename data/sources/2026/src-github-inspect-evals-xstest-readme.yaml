quote_extract: "STest [XSTest](https://arxiv.org/abs/2308.01263) is a benchmark for identifying exaggerated
  safety behaviours in LLM's. It comprises 250 safe prompts across ten prompt types that well-calibrated
  models should not refuse to comply with, and 200 unsafe prompts as contrasts that models, for most applications,
  should refuse. Contributed by [@NelsonG-C](https://github.com/NelsonG-C) ## Usage # … tall with `pip
  install inspect-evals`, or `uv sync` from a checkout of this repository. ### Running evaluations ```bash
  uv run inspect eval inspect_evals/xstest --model openai/gpt-5-nano ``` You can also import tasks as
  normal Python objects and run them from python: ```python from inspect_ai import eval … unsafe']`):
  The sample subset to use (default: `'safe'`) - `scorer_model` (`str | Model | None`): (str | Model |
  None): The scorer model to use when grading samples (default: `'openai/gpt-4o'`) There are two subsets
  to the XSTest Benchmark: the safe and the unsafe prompts. A specific subset can be run using the … artial
  refusal), or `GRADE: I` (full refusal); scoring binds to this final verdict via Inspect's default grade
  pattern. This benchmark uses a refusal_rate metric, which is the percentage of scored prompts that are
  either partially or fully refused. A grader completion with no parseable final `GRADE:` verdict is excluded
  from the denominator rather than counted as a"

  to an error rate. 2) Datasets: As seen in Table IV, the ﬁrst two benchmarks (ABX-15 and ABX-17) used
  relatively modest datasets sizes for training (from 2.5h to 45h) over 6 languages. ABX-15 used the training
  set as test set, while the ABX-17 introduced a separate test set with new speakers, to test for the
  ability of the learned representations to generalize to new speakers. The more recent benchmark (ABX-LS)
  uses the full LibriSpeech (960h) as training set, and introduced a separate dev and test set in order
  to avoid overﬁtting the model’s hyperparameters to the test set. As more recent models tend to use more
  and more data, the benchmarks are open to submissions of systems trained on datasets other than the
  default ones, so long as they contain no labels and are described in detail. 3) Baselines: For Task
  1, our low end reference score (“baseline”) is calculated by computing the distances on spectral representations
  (MFCC). Good representations that highlight linguistically relevant differences, and thus neutralize
  speaker or channel differences, should at least do better than MFCCs. On the high end, using the gold
  annotations to generate a frame-by-frame one-hot phonemic representation mechanically leads to a perfect
  ABX score. To give a fairer high end comparison, we have also often included scores for the output of

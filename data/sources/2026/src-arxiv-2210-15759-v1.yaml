  www.zerospeech.com, is now open continuously and allows for running evaluations on all of the past benchmarks.
  The ﬁeld of unsupervised representation learning is established enough that it is no longer necessary
  to channel it through special events. Indeed, self-supervised audio models are such an active domain
  that there are many relevant new models (for example, WavLM: [125]) which have yet to be evaluated on
  the ZRC metrics. Existing benchma … ility and meaningfulness of by ASRbased proxy measurements (Phone
  Error Rate for intelligibility in a Task 3 setting, and continuation BLEU or VERT score for the prompted

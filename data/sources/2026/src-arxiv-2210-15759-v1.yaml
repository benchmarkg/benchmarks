  differ greatly from the written form. This would foster more naturalistic human/machine interactions.
  While some research has focused on how self-supervised modelling can improve existing supervised speech
  tasks (for example, the SUPERB benchmark: [3]), the Zero Resource Challenge series assesses progress
  toward spoken language systems that function without any textual supervision at any point. Building
  a text-free dialogue system using only raw speech is a difﬁcult machine learning challenge. It requires
  us to rethink the spoken language processing stack from the ground up. The ZRC series … 1b) naturally
  gives rise to the following four tasks: (Task 1) Acoustic Unit Discovery; (Task 2) Spoken Term Discovery;
  (Task 3) Unsupervised Discrete Resynthesis; (Task 4) Spoken Language Modeling. These are the textless
  counterparts of well-known tasks: (Task 1) phone recognition; (Task 2) word recognition (i.e., ASR);
  (Task 3) TTS; (Task 4) Language Modeling. We will review these tasks in turn in the following sections.
  The evaluation problem is to deﬁne metrics that enable model comparison and cumulative progress for
  tasks that are deﬁned only through a … ks predates the ZRC series (see for instance [4]–[9], for Task
  1), but since each of the published papers used its own metrics, it was difﬁcult (and still is) to compare
  systems and measure progress. The general strategy of the ZRC series is to develop zero-shot probe tasks
  that are inspired by human psycholinguistics, and which require no model retraining. The reasoning is
  that, since the aim is to probe for latent representations at various levels of a self-supervised system,
  it is best to not train any classiﬁer on top of it. Otherwise, it would be u … vation or simply the
  classiﬁer. For each task, zero-shot metrics were developed that probe for the different levels of linguistic
  knowledge that the selfsupervised system is supposed to have learned. They only require the extraction
  of information readily available in the system (for example, embeddings, pseudo-probabilities), and
  are computed by a separate ﬁxed module which is identical across systems. The evaluation metrics that
  go with the tasks are listed in Table I and will be presented in more detail in JOURNAL OF SELECTED
  TOPICS IN SIGNAL PROCESSING 4 TABLE II SUMMARY OF TASKS AND BENCHMARKS IN THE ZERO RESOURCE CHALLENGE

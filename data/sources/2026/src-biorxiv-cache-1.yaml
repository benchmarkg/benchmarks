  oronto +Department of Pharmacology & Toxicology, University of Toronto +Acceleration Consortium, University of To","doi":"10.1101\/2024.07.18.603797","date":"2024-07-18","version":"1","type":"new results","license":"cc_by","category":"biochemistry","jatsxml":"https:\/\/www.biorxiv.org\/content\/early\/2024\/07\/18\/2024.07.18.603797.source.xml","abstract":"The CACHE cha … ructure in the PDB. The lack of known binding data and presumably low druggability of the target is a challenge to computational hit finding methods. Seventy-three of the 1955 procured molecules bound LRRK2 in an SPR assay with KD lower than 150 M and were advanced to a hit expansion phase where computational teams each selected up to 50 analogs each. Binding was observed in two orthogonal assays with affinities ranging from 18 to 140 M for seven chemically diverse series. The seven successful computational workflows varied in their screening strategies and techniques. Three used m … to produce a conformational ensemble of the targeted site, three included a fragment docking step, three implemented a generative design strategy and five used one or more deep learning steps. CACHE #1 reflects a highly exploratory phase in computational drug design where participants sometimes adopted strikingly diverging screening strategies. Machine-learning accelerated methods achieved similar results to brute force (e.g. exhaustive) docking. First-in-class, experimentally confirmed compounds were rare and weakly potent, indicating that recent advances are not sufficient to effectively address challenging targets.","published":"10.1021\/acs.jcim.4c01267","server":"bi

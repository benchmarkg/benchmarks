  {"response":"# **NAVSIM v2 `navhard` Leaderboard**\n\n## Overview\n\nAfter the NAVSIM challenge 2025 CVPR phase, we have re-opened the leaderboard with the `navhard_two_stage` split, which contains a larger set for comprehensive evaluations. This track uses NAVSIM, a data-driven non-reactive autonomous vehicle simulation framework. \n\nNAVSIM gathers simulation-based metrics (su … icient, open-loop metric computation while being better aligned with closed-loop evaluations.\n\n### Rules\n- We will periodically (~every 6 months) be removing all entries on the leaderboard which **do not provide associated open-source training and inference code with the corresponding pre-trained checkpoints**. Even if removed for not having this information, an entry can be resubmitted once the code needed for reproducibility is made publicly available.\n- Code must be provided by setting the `TEAM_NAME … able of the submission file as `\"Method name\"`. Note that this can also be edited on the leaderboard for an existing submission, if the repo is created (or updated) after the initial submission.\n- You are limited to **5 uploads per day** on this leaderboard, which should take approximately 3 hours to evaluate after a successful submission.\n- ⚠️ **IMPORTANT**: Using the `test`/`navtest`/`navhard_two_stage`/`warmup_two_stage`/`private_test_two_stage` splits for training your challenge submissions is not allowed.\n - Using any other publicly available datasets or pretrained weights is allowed.\n - The use of private datasets or pretrained weights is prohibited.\n - The use of future frames is prohibited except where explicitly stated.\n - We will also remove entries that use annotations in their model's inference (e.g., generating multiple proposals per sample and submitting only the one with the best Extended PDM score).\n\n## Primary Metric\nThe primary metric of this track is the Extended PDM Score. For more details, please refer to the metric documentation.\n\n## Dataset\nThis track is based on the OpenScene dataset. Please refer to the **Dataset** tab of the competition space for details.\n\n#

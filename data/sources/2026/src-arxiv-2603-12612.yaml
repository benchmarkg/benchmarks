  a continuous distributional critic tailored to ensure accurate value estimation by mitigating both high-dimensional
  overestimation and discrete quantization artifacts. Extensive evaluations on HumanoidBench and a diverse
  set of continuous control tasks demonstrate that FastDSAC establishes state-of-the-art performance for
  high-dimensional stochastic policies on the evaluated benchmarks. Our method is competitive with and
  often outperforms strong deterministic baselines, with gains of 180% and 350% on the challenging Basketball

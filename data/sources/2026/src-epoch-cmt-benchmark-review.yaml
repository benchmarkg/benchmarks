quote_extract: 'Benchmark Review CMT-Benchmark v1.0.0 Reviewed: Oct. 14, 2026 … Verdict: Flawed … We designated
  the benchmark Flawed because an audit by physics researchers (Ansari et al. 2026) found scoring defects
  in 60% of the problems; our threshold for a Flawed verdict is 20% or more. … Ansari et al. reviewed
  all 50 problems and found errors in 30 (60%) of them. The majority of errors were due to missing assumptions,
  incorrect mathematical expressions, incorrect or incomplete reference answers, or significant typos/formatting
  errors. … Ansari et al. graded both the original set and repaired subset with an LLM judge, since they
  report that the official grading code was unavailable to them. … Developer Response Link to developer
  response: huggingface.co/datasets/CMTBenchmark/cmt_benchmark … We reviewed v1.0.0. The version and changelog
  provides up to date information on the current version.'

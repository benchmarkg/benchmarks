quote_extract: '** | [HuggingFace](https://huggingface.co/facebook/ODAC25) | ::: The Open DAC 2025 (ODAC25)
  dataset contains nearly 70 million DFT single-point calculations for CO2, H2O, N2, and O2 adsorption
  in nearly 15,000 metal-organic frameworks (MOFs). This dataset represents a significant expansion upon
  ODAC23, introducing greater chemical a … h functionalized MOFs, high-energy GCMC-derived placements,
  and synthetically generated frameworks. The dataset enables training of state-of-the-art machine-learned
  interatomic potentials for direct air capture applications. All structures are labeled with total energies
  (eV) and forces (eV/Å) computed using VASP with the PBE+D3 functional. All information about the dataset
  is available at the [ODAC25 Huggingface site](https://huggingface.co/facebook/ODAC25). For questions
  or issues, please open a GitHub issue in this repository. ## Dataset format The dataset is provided
  in ASE DB compatible lmdb files (`*.aselmdb`). ### Citing ODAC25 The ODAC25 dataset is licensed under
  a [Creative Commons Attribution 4.0 License](https://creativecommons.org/licenses/by/4.0/legalcode).
  Please consider citing the following paper'

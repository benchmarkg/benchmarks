  of seven heuristic detectors and an LLM-based intent analyzer. We evaluate on BashArena (637 bash tasks,
  4 attack categories) within the ControlArena framework. Our results on 519 samples (279 honest, 240
  attack) show that: (1) the hybrid detector-plus-dimension approach achieves clear attackhonest separation
  (attack mean suspicion 0.616 vs. honest mean 0.206, ∆ = 0.410); (2) structured scoring constrains collusion—the
  untrusted structured monitor achieves 95% safety at moderate thresholds, compared to 0% for single-score
  untrusted monitoring; (3) goal alignment and constraint adherence are the most discriminative dimensions;
  and (4) a separation-of-duties variant that splits dimensions ac … coding detection, subprocess tracking,
  config diff tracking), and an intent analyzer to contextualize detector findings before LLM dimension
  scoring. TraceGuard is implemented as a new monitor type for the open-source ControlArena framework.

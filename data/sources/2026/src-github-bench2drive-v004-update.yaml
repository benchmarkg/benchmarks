  * 5) in it. The xml file is at `leaderboard/data/bench2drive_0.0.4_val.xml` 2. Results: | Method | Driving
  Score | Success Rate | Efficiency | Comfort | Overtaking | Merging | Emergency_Brake | Give_Way | Traffic_Signs
  | Mean … | **95.59** | **87.28** | 201.55 | 20.56 | **89.86** | **73.44** | **98.25** | **50.00** |
  **97.67** | **81.84** | **Bench2Drive Data Collection** 1. We released a new training set collected
  by Think2Drive, containing 44 scenarios * 25 routes = 1100 routes. Please visit https://huggingface.co/datasets/rethinklab/Bench2Drive-V0.0.4
  for more details. In the new dataset: 2. Depth is no longer stored as `.pn … lable at https://huggingface.co/datasets/rethinklab/Bench2Drive-V0.0.4-depth
  Related issue: https://github.com/Thinklab-SJTU/Bench2Drive/issues/21 3. We introduced a new modality:
  **3D occupancy (3D occ)**. 4. We fixed the bug in the Radar sensor position. 5. We fixed the skeleton
  collection bug. Related issue: https://huggingface.co/datasets/rethinklab/'

quote_extract: '. Fulfilling both of these characteristics can pose a great challenge for LLMs. To assess
  how well LLMs can solve challenging and practical tasks via programs, we introduce BigCodeBench, a benchmark
  that challenges LLMs to invoke multiple function calls as tools from 139 libraries and 7 domains for
  1,140 fine-grained tasks. To evaluate LLMs rigorously, each task encompasses 5.6 test cases with an
  average branch coverage of 99%. In addition, we propose a naturallanguage-oriented variant of BigCodeBench,
  BigCodeBench-Instruct, that automatically transforms the original docstrings into short instructions
  only with essential information. Our extensive evaluation of 60 LLMs shows that LLMs are not yet capable
  of following complex instructions to use function calls precisely, with scores up to 60%, significantly
  lower than the human performance of 97%. The results underscore the need for further advancements in
  this area. ∗The work does not relate to the author’s position at Amazon. † Corresponding authors. …
  ed benchmark, BigCodeBench. Particularly, we utilize LLMs to source programming tasks, refactor programs,
  and add test cases, under constant human supervision. Our benchmark contains 1,140 rich-context and

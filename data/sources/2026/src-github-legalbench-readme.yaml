quote_extract: "# 📜 LegalBench The LegalBench project is an ongoing open science effort to collaboratively
  curate tasks for evaluating legal reasoning in English large language models (LLMs). The benchmark currently
  consists of 162 tasks gathered from 40 contributors. [**Website**](https://hazyresearch.stanford.edu/legalbench/)
  [**Data**](https://huggingface.co/data … ) ## What is LegalBench? LegalBench is a benchmark consisting
  of different legal reasoning *tasks*. Each task has an associated *dataset*, consisting of input-output
  pairs. Examples of tasks include: - The [hearsay](./tasks/hearsay/README.md) task, for which the input
  is a description of some evidence and the output is whether or not that evidence would be considered
  hearsay (i.e., \"Yes\" or \"No\"). - The [definition extraction](./tasks/definition_extraction/README.md)
  task, … ines a term, and the output is the term. - The [Rule QA](./tasks/rule_qa/README.md) task, for
  which the input is a question about the substance of a law, and the output is the correct answer to
  the question. Task datasets can be used to evaluate LLMs by providing the LLM with the input, and evaluating
  how frequently it generates the corresponding output. LegalBench tasks cover a wide … r manually or
  through other means), and thus represent potential practical applications for LLMs. **LegalBench is
  ongoing and we are always looking to incorporate more tasks. See [here](https://hazyresearch.stanford.edu/legalbench/contribute/)
  for more information on how to get involved!** ## Who are we? We're an [interdisciplinary team]([#contributors](https://hazyresearch.stanford.edu/legalbench/#contributors))
  of computer scientists … ng-started/) for more details. ## Licenses LegalBench is a mix of created and
  transformed datasets. We ask that you follow the license of the dataset creator. Please see the [task
  page](https://github.com/HazyResearch/legalbench/tree/main/tasks) for a list"

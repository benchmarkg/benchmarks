quote_extract: "ll inspect-evals`, or `uv sync` from a checkout of this repository. ### Running evaluations
  ```bash uv run inspect eval inspect_evals/commonsense_qa --model openai/gpt-5-nano ``` You can also
  import tasks as normal Python objects and run them from … ing dataset which requires different types
  of commonsense knowledge to predict the correct answers. This eval runs the 1,221-question validation
  split; the test split's labels are not public. Here is an example from the dataset: ```text Where can
  I stand on a river to see water falling wit … E) Bottom ``` The model is required to choose the correct
  answer from the given options. ## Scoring A simple accuracy is calculated over the datapoints. ## Changelog

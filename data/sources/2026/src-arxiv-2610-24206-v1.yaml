quote_extract: 'widely used benchmark of long-horizon software engineering tasks for coding agents. As
  agents improve, they reach task issues earlier agents never touched and interact with the evaluation
  environment in ways the original harness did not anticipate. We present SWE-Bench Pro V2, a revised
  public split built to keep the benchmark accurate as capabilities advance. Agentic audits, expert adjudication
  and blind re-implementation repaired or retired 480 of the 731 tasks: 23 contracted engineers spent
  404 hours, each working in a language they write professionally, and every revised instruction was verified
  by a … ng, without solving the task. We address both classes of issues and release SWE-Bench Pro V2.1
  Two agentic audits flag 200 of the 731 tasks, 23 expert software engineers adjudicate every flag, and
  the verifiers are hardened for all tasks (Figure 2). The release has 642 tasks, 391 repaired and 89
  discarded. On V2, Claude Opus 5 (run in Claude Code) resolves 99% of the tasks, whereas Gemini 3.8 Flash
  resolves 94.9% and Inkling 89.9% (Figure 1). The full set still separates systems below the frontier,
  and a 51-task Hard split spreads systems from 52.9% to 98.0%. Our contributions are: • SWE-Bench Pro
  V2: A cleaned set of … re known to exploit weaknesses in their evaluation. Dedicated benchmarks measure
  how often models special-case or rewrite tests [18–21], and reward tampering and its concealment have
  been observed during training [22, 23]. In issue-based benchmarks, the repository state shipped in the
  container leaked future commits containing the fix, first in SWE-bench [24] and later in SWE-Bench Pro
  [25, 26]. Models may also have memorised popular repositories and their fixes [27, 28]. We also identify
  an additional channel that arises from in-sandbox grading: when the verifier runs in the agent’s own
  sandbox, state outside the patch, such as a forged module version or an edited dependency cache, affects
  the grade. Concurrent repairs of SWE-Bench Pro. In contemporaneous work, SWE-Bench Pro Verified [29]
  blocks code hosts, hides test artifacts, and refines 102 tasks collected from public reports [30], checking
  the refinements with model trial runs. The authors show that blocking leakage turned 186 passes of one
  model into failures. Our approach differs in four respects. We audit every task with expert audits,
  whereas SWE-Bench Pro Verified start … ind human re-implementation, while they rely on model trial runs.
  Finally, during the agent phase we allow network access only to the model endpoint, where they block
  a list of domains, and we re-grade every patch in a clean container. 3 Methodology We start from the
  731 tasks of SWE-Bench Pro Public v1.0. A task consists of an instruction (problem statement, requirements,
  new interfaces), a container image with the repository at its base commit, a reference patch, a hidden
  test patch, fail-to-pass and pass-to-pass lists naming the graded tests, and a … raint left the instruction
  template and the verifier now reverts test-related changes before applying the test patch; git history
  was scrubbed from the images so that agents cannot recover the fix; and network access was disabled
  in the agent phase, after a frontier model copied reference solutions verbatim from GitHub on 351 solved
  tasks, only 237 of which held up with GitHub blocked. The result kept all 731 tasks. Round 3 ran two
  agentic audits (§3.1), which flagged 200 tasks (27%). Engineers adjudicated every flag (§3.3): 68 tasks
  were repaired, 43 kept unchanged and 89 discarded. A final review extended task-specific edits across
  the whole set, and the shared verifier was hardened for every task (§3.4). The release has 642 tasks,
  391 of which carry a task-specific repair (Table 1): 480 of the 731 tasks (66%) were repaired or removed,
  the other 251 changed only through the verifier hardening, and no reference solution was changed. 3.1
  Agentic audits Artifact audit. An LLM agent compared each task’s instruction with its test lists and
  reference patch, without executing anything. … Without (i), agent edits to snapshots owned by the test
  patch made it fail to apply in 44 runs. Step (v) addresses .pyc files that an agent’s git stash round
  trip left with unchanged size and timestamp, which made the verifier import the base code. On the assembled
  642-task set, the reference patch passes every task and the empty patch fails every task. 3.5 Hardened
  evaluation protocol We run every model under a locked protocol where the harness sets network access
  per phase of a run, and grades the agent’s patch in a fresh container rather than in the agent’s sandbox.
  7 A. Verifier repair flipt-af … over the agent’s working tree, so a correct patch that also edited a
  test fixture could not be graded. Right: the hidden test encoded a fallback the instruction never stated.
  No hidden test was changed in either case. Network. With the network open, 32 of 642 Claude Opus 5 trajectories
  contacted code hosts, and 25 downloaded the task’s own repository. Under the lock, the sandbox can reach
  only the model endpoint during the agent phase (the allowlist names that hostname alone), web tools
  that scaffolds execute outside the sandbox are disabled, and the images carry no fixing commi … ench
  Pro V2 (Table 2). Claude and GPT models run in their developers’ native scaffolds, Claude Code and Codex
  (with web tools disabled in the locked protocol) while Gemini and open source models run with mini-swe-agent
  [31] and other open harnesses. Each task gets a 50-minute budget, and the patch present at the deadline
  is graded in a fresh container. Because results depend on the scaffold and effort setting as well as
  the model, we report them per system, defined as the combination of the three. We report 95% Wilson
  intervals for all the runs. 4.2 Main Results In Table 2 we see the frontier models solve ~99% of tasks,
  and each of the 642 tasks is solved by at least one of them, which independently confirms that every
  task is solvable. The b … s range from 52.9% to 98.0% (Table 2). Interestingly, although Astra and Gemini
  are tied on the other 591 tasks, on Hard Astra resolves 46 tasks and Gemini 30. Further, we see that
  the Hard subset is especially difficult for the non-frontier models. Hard does not separate the top
  four systems from each other, and ranking them would require harder tasks than the public split currently
  contains. Why the scores rise. Figure 3 shows one task per mechanism. A verifier repair changes the
  grade of an unchanged patch: the old verifier could not apply the hidden test patch over a fixture the
  agent had also edited, which cost Opus 5 and GLM-5.3 44 … . In one run, Gemini disguised a request to
  the Go module proxy as traffic to the model endpoint, and this request was also refused. Forged dependencies.
  When an agent could not download a dependency, it sometimes built a fake one outside the patch. Gemini
  fabricated go.sum and go.work.sum entries or edited the shared module cache in place in 3 tasks, and
  Opus 5 and Inkling forged a module version with a fabricated go.sum entry. All of these passed in the
  agent’s sandbox and failed in the clean container, because the forged files were not part of the patch.
  Without the second grade, each would h … ves traces of its own: Pi and OpenCode place a different Node
  binary on the agent’s path than the grader uses, which cost 13 trials in which an agent rebuilt a native
  module and the grader then crashed. 5 Discussion Usefulness of V2 near saturation. Frontier systems
  resolve nearly all V2 tasks, but the benchmark remains useful for four reasons. The saturation result
  is itself informative: on a correctly graded split the strongest systems fail fewer than 1% of tasks,
  so small differences among them are not capability differences. Most deployed systems are not at the
  frontier: open-weight, s … k below the frontier. We release the tasks and protocol at https://huggingface.co/datasets/ScaleAI/SWE-bench_Pro/viewer,
  and expect the pipeline and lessons to apply to other benchmarks as agents approach their ceilings.
  11 Limitations Memorization. The public repositories and their fixes predate the evaluated models. The
  protocol stops retrieval at test time, not memorization during training. Scope of re-grading. A clean-container
  re-grade rejects changes made outside the patch but forgeries inside it, such as an imitation of a missing
  library, are left to the patch audit. Ethics Statement The tasks come from open-source repositories
  under their original licences. The engineers who reviewed and repaired tasks were contracted and no
  personal data about them is recorded or released. We document the exploits we observed because benchmark
  operators need this information to defend against them, and the countermeas … ps://github.com/SWE-agent/mini-swe-agent,
  2025. 14 A The Hard Split The 51 tasks come from ansible (8), openlibrary (8), flipt (7), teleport (6),
  webclients (5), qutebrowser (4), vuls (4), element-web (4), navidrome (3), NodeBB (1) and tutanota (1).
  A task qualified if at least two of five model families fail on it across runs. That gave 54 candidates
  and 3 were removed after expert review. Every Hard task passes its reference solution, fails with an
  empty patch, and is solved by at least one of our runs. 39 of the 51 instructions were edited in the
  final review after sele … ree; it is applied to a fresh container built from the task image, with a
  three-way fallback, and the unchanged verifier runs. When the sandbox grade and the clean grade disagree,
  two more clean grades are taken and the majority of the three counts. Mean API spend per task on V2
  was $2.9 for the Claude Code runs, $2.3 for Astra and $3 for Gemini. Release. Task directories, the
  Hard split, the probe, capture and re-grade scripts, the exact harness flags, per-task grades in both
  modes for every run, and the harness-study trajectories. 16'

quote_extract: 'which the sequence is known, but the function is not. The gap between what we know and
  what we do not know is growing. A major challenge in the field of bioinformatics is to predict the function
  of a protein from its sequence or structure. At the same time, how can we judge how well these function
  prediction algorithms are performing? The solution: The Critical Assessment of protein Function Annotation
  algorithms (CAFA) is an experiment designed to provide a large-scale assessment of computational methods
  dedicated to predicting protein function, using a time challenge. Briefly, CAFA organizers provide a
  large number of protein sequences. The predictors then predict the function of these proteins by associating
  them with Gene Ontology terms or Human Phenoytpe Ontology terms (Blue “prediction” section of timeline).

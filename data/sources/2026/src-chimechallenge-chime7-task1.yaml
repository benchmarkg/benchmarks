quote_extract: 'Contact Us/Stay Tuned If you are considering participating or just want to learn more
  then please join the CHiME Google Group. We have also a CHiME Slack Workspace. Follow us on Twitter,
  we will also use that to make announcements. Short Description Task training, development, and evaluation
  data comes from three different datasets: CHiME-6 [1], DipCO [2] and Mixer 6 Speech [3]. These datasets
  have different characteristics and, as mentioned earlier, we are interested in pushing research towards
  multi-talker transcription systems that can handle a wide variety of scenarios, in … xer 6 Speech) Handle
  different number of participant in each dataset Handle inherent diversity in lexicon due to possibly
  different settings (e.g more formal or informal) Wide variation in acoustic quality (e.g. signal-to-noise
  ratio, reverberation) Crucially, participants are forbidden to use automatic domain identification (or
  manual identification, e.g., based on number of channels) to switch between different systems/hyper-parameters/configurations.
  A single common system able to adapt to the different scenarios and microphone configurations has to
  be devised. The final ranking will be obtained via speaker-attributed word error rate (SA-WER) macro-averaged
  across the three datasets, as we are interested in generalization across the different scenarios. The
  speaker-transcript attribution is performed here via diarization, so we can also call this diarization-attributed
  WER (DA-WER) to distinguish it from other definitions of SA … submissions (also macro-averaged. See
  Submission page for more information about systems evaluation and ranking. See Rules page for more information
  on what information participants system can use in training and inference. Main Track and Sub-Tracks
  The proposed Task has one main track and one sub-track, both inherited directly from the previous CHiME-6
  Challenge. Important Participants must always submit to the main track while submission to the sub-track

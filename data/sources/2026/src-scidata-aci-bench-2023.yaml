quote_extract: 're difficult to ethically share due to patient confidentiality, there are no sufficiently
  large clinic dialogue-note datasets to benchmark this task. Here we present the Ambient Clinical Intelligence
  Benchmark (aci-bench) corpus, the largest dataset to date tackling the problem of AI-assisted note generation
  from visit dialogue. We also present the benchmark performances of several common state-of-the-art approaches.

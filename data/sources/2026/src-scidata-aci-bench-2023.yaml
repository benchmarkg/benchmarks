  MEDIQA-CHAT and CLEF MEDIQASUM challenges are located in the challenge_data folder, w … statement” tag
  was about three times that of dictation, however this was about seven times in the aci-bench corpus.
  Together, this data suggests that the aci-bench corpus may be slightly less challenging in terms of
  documents lengths and has a skew towards question-answer and statements information content; though
  the magnitudes in lengths and similarity are comparable. Baseline e … same limit of 4,097 tokens, shared
  between the prompt and the output/summary, whereas GPT-4 allows 32k tokens. We used the following prompt:
  Prompt: “summarize the conversation to generate a clinical note with four sections: HISTORY OF PRESENT
  ILLNESS, PHYSICAL EXAM, RESULTS, ASSESSMENT AND PLAN. The conversation is:” To allow adequate division
  detection, we added some light rule-based post-processing, adding endlines before and after for each
  … evaluation metrics We employ a variety of widely-used automatic evaluation metrics to evaluate performances
  in different perspectives. Specifically, we measure at least one lexical n-gram metric, an embedding-based
  similarity metric, a learned metric, and finally an information extraction metric. We evaluate the note
  generation performance both in the full note and in each division. For the ngram-based lexical metric,
  we compute ROUGE28(1/2/- … 9 which greedily matches contextual token embeddings from pairwise cosine
  similarity. BERTScore efficiently captures synonym and context information. For a model-based learned
  metric, we used BLEURT30, which is trained for scoring candidate-reference similarity. Additionally,
  we incorporate a medical concept- based evaluation metric (medcon) to gauge the accuracy and consistency
  of clinical concepts. This metric calculates the F1-score to determine the similarity between the Unified
  Medical Language System (UMLS) concept sets in both candidate and reference clinical notes. This is
  similar to the CheXpert evaluation for radiology summarization however our concepts are not restricted
  to 14 predetermined categories, and do not include weightings or assertion status31. The extraction
  of UMLS concepts within clinical notes is performed using a string match algorithm applied to the UMLS
  concept database through the QuickUMLS package32. To ensure clinical relevance, we restrict the medcon
  metric to specific UMLS semantic groups, designated as Anatomy, Chemicals &Drugs, Device, Disorders,
  Genes & Molecular Sequences, Phenomena and Physiology. To consolidate the various evaluation metrics,
  we first take the average of the three ROUGE submetrics as ROUGE, and the average of ROUGE, BERTScore,
  BLEURT, and medcon scores as the final evaluation score. Because BERTScore and BLEURT are limited by
  their pre-trained embedding length, we only use these evaluations for the division-based evaluation.
  Results We fine-tune the models on the train set and select the best trained model based on evaluation
  on the validation set. Performances were evaluated on three test sets. Test sets 1 and 2 correspond
  to the test sets from ACL ClinicalNLP MEDIQA-Chat 2023 TaskB full-note generation and TaskC dialogue
  generation, respectively. Test 3 corresponds to CLEF MEDIQA-SUM 2023 Subtask C full-note generation.
  Our test 1 full note evaluation results can be found in Table 6. Per-division subjective, objective_exam,
  objective_results, and assessment_and_plan … 7 for ROUGE-L. The great performance can be attributed
  to the model’s gigantic size, intensive pretraining, huge context size, and great versatility. GPT-4
  captured many relevant clinical facts and thus had the highest medcon. However, since it was not specifically
  fine-tuned for the aci-bench corpus clinical note format, it exhibited slightly inferior performance
  in captur … lar medical fact errors from the ASR can have a non-trivial impact. Usage NotesLimitations
  and challenges There are several limitations to this work. The data here is small and produced synthetically
  by medical annotators or patient actors in a single institution. Therefore, this dataset may not cover
  in a statistically representative way, all health topics, speech variations, and note format variations
  present … shed by a limited number of content creators which influences the variations of linguistic
  dialogue patterns and health topics created. Specifically, the collections were conducted in a Nuance
  product demonstration studio by Nuance employees in Eastern Massachusetts. Thus, personas may have varying
  degrees of dialect and speech patterns consistent with the US Northeast. As Nuance hires employees from
  diverse back … GitHub repository provided below. The data here is intended to be used for benchmarking

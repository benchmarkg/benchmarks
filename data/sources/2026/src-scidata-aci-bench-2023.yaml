  where notes are cr … from the doctor, they are expected to listen in on the patient-doctor dialogue
  and generate clinical note text independently. To mirror this reality, the aci-bench corpus consists
  of three subsets representing common modes of note generation from doctor-patient conversations: Virtual
  assistant (virtassist) In this mode, the doctor may use explicit terms to activate a virtual assistance
  device (e.g. “Hey Dragon show me the … d by natural conversation between a patient and a doctor; without
  explicit calls to a virtual assistant or additional language addressed to a scribe. Transcripts from
  subsets virtassist and virtscribe were created by a team of 5+ medical experts including medical doctors,
  physician assistance, medical scribes, and clinical informaticians based on experience and studying
  real encounters. Subset aci was created with a certified doctor and a volunteer lay person, who must
  role-play a real doctor-patient encounter, given a list of symptom prompts. Clinical notes were generated
  using an automatic note generation system and checked and re-written by domain experts (e.g. medical
  scribes, or physicians). The virtscribe dataset includes the human transcription as well as an ASR transcript;
  meanwhile the virtassist and aci subsets were created with only a human transcription and ASR transcript
  available, respectively. Data cleaning and annotation Our final dataset was distilled from encounters
  originally created for marketing demonstration purposes. During this initial dataset creation, imaginary
  EHR injections were placed within the note to contribute to realism, though many without basis from
  the conversation. Although EHR inputs, independent from data intake from a conversation, are a critical
  aspect of real clinical notes, in this dataset we do not model EHR input or output linkages with the
  clinical note (e.g. smart links to structured data such as vitals values, structured survey data, order
  codes, and diagnosis codes). In order to identify unsupport … tasked annotators to identify these items
  and provide corrections. After annotation, the data was processed such that note errors were corrected
  and unsupported note sentences were removed. To study the effect of ASR errors, ASR transcripts were
  processed into two versions: (a) original and (b) ASR-corrected (ASR outputs corrected by humans). After
  automatic processing, encounters were again manually reviewed for additional misspelling and formatting
  issues. Note division definition Motiv … y trained with shorter sequences. Furthermore, evaluation at
  a sub-note level allows a greater resolution for assessing performances. Data statistics The full dataset
  was split into train, validation, and three test sets. Each subset was represented in the splits through
  randomized stratefied sampling. The test sets 1 and 2 corresponds to the test sets from ACL Clinica

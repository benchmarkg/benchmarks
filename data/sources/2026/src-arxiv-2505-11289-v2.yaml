  Meta-World In this section we provide an overview of the Meta-World benchmark. In Appendix A we provide
  additional information on the different components of Meta-World. Meta-World contains 50 different robotic
  manipulation tasks for a single Sawyer Robot Arm2 to solve. Some tasks involve applying force to an
  object (i.e. door-close, drawer-close, and coffee-push), while some tasks require grasping and manipulating
  an object (i.e. pick-place, and assembly), and some … s are the various types of tasks (i.e. pick-place,
  reach, push). The agent is evaluated on the same tasks that it is trained on. To evaluate meta-RL algorithms,
  the ML10 and ML45 benchmarks are used. These benchmarks provide 10 and 45 training tasks respectively
  for the meta-learning agent to train on, before evaluating it on 5 held-out tasks. In this setting,
  a meta-learning algorithm needs to learn how to (a) acquire a generalisable set of skills during training,
  and then (b) compose them in novel ways to adapt to unseen tasks. The evaluation metric across both
  multi-task and meta-RL problems is the same, the mean success rate of an agent across all evaluation
  tasks. 4.2 Reward Functions The original publication of Meta-World [Yu et al., 2020b] created a set
  of dense reward functions. These rewards, which we will refer to as V1, were designed by creating the

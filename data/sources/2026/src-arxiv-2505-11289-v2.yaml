  The portion of the reward function for moving towards an object and gripping the object would be removed.
  However, at some point these V1 rewards were overwritten by a new set of dense rewards, which we will
  refer to as V2. These rewards were written with fuzzy constraints that allowed for rewards to be in
  the range (0, 10) and episodic returns across tasks are from a more narrow distribution. To highlight

  historical versioning issues in Meta-World, various works have reported results across different reward
  functions. These results are not comparable, as the two sets of reward functions have different design
  philosophies and per-task reward scales as illustrated in Figure 1. In Section 5.1, we provide a comparative
  analysis on a number of multi-task RL methods over the V1 and V2 reward functions. Similarly, in Section
  5.2 we provide meta-RL results using the V1 and V2 rewards. Section 5.3 provides some analysis of our
  additional task sets MT25 & ML25. In order to compare the statistical results of each set of experiments

quote_extract: "-D data RGB stereo data IMU data Raw data Evaluation Result submission Hardware A custom
  camera rig was used to record the datasets. All cameras on this rig use a global shutter and are synchronized.
  Depth was estimated with active stereo, i.e., a stereo algorithm was used on two infrared cameras to
  estimate depth, and an infrared pattern was projected with the IR emitter of an Asus Xtion Live Pro
  to provide additional texture for ste … ed with this dataset (one calibration dataset may be associated
  with several datasets). Since they contain additional views of the scene, calibration datasets are only
  provided for training datasets. Thus, for test datasets only self-calibration is possible. The format
  of calibration datasets is as follows for datasets with motion captured ground truth: +── calibration.bag
  +── seq_camera_refinement_1.txt +── seq_sequence_calib_1.txt +── seq_sequence_cali … .txt The 'sfm'
  subsequence is the part of the dataset on which Structure-from-Motion was run to determine the ground
  truth poses. This should be longer than the actual dataset subsequence. Evaluation The benchmark evaluates
  commonly used absolute and relative trajectory errors. It is possible to evaluate both training and
  test set results on this website by uploading the results as described below. For evaluating training
  results locally, the evaluation program is provided as source code (on GitHub). This program depends
  on Eigen. Using CMake, it should compile for Linux and Windows. A script to automate the evaluation
  on all datasets and output comparison plots for multiple methods is provided h"

quote_extract: 'n interests is to better understand how 3D cues can best inform a structured 3D interpretation.
  We also contribute a novel integer programming formulation to infer physical support relations. We oﬀer
  a new dataset of 1449 RGBD images, capturing 464 diverse indoor scenes, with detailed annotations. Our
  experiments demonstrate our ability to infer support relations in complex scenes and verify that our
  3D scene cues and inferred support lead to better object segmentation. 1 Introduction Traditional approaches
  to scene understanding aim to provide labels for each object in the image. However, this is an impoverished
  description since labels tell us little about the physical relationships between objects, possible actions
  that can be performed, or the geometric structure of the scene. Many robotics and scene understanding
  applications require a physical parse of the scene into objects, surfaces, and their relations. A person
  walking into a room, for example, might want to ﬁnd his coﬀee cup and favorite book, grab them, ﬁnd
  a place to sit down, walk over, and sit down. These tasks require parsing the scene into d … t with
  registered RGBD images, detailed object labels, and annotated physical relations. 2 Dataset for Indoor
  Scene Understanding Several Kinect scene datasets have recently been introduced. However, the NYU indoor
  scene dataset [11] has limited diversity (only 67 scenes); in the Berkeley 4 ECCV-12 submission ID 1079
  Scenes dataset [12] only a few objects per scene are labeled; and others such as [13, 14] are designed
  for robotics applications. We therefore introduce a new Kinect dataset1, signiﬁcantly larger and more
  diverse than existing ones. The dataset consists of 1449 RGBD images2, gathered from a wide range of
  commercial and residential buildings in three diﬀerent US cities, comprising 464 diﬀerent indoor scenes
  across 26 scene classes.A dense per-pixel labeling was obtained for each image using Amazon Mechanical
  Turk. If a scene contained multiple instances of an object class, each instance received a unique instance
  label, e.g. two diﬀerent cups in the same image would be labeled: cup 1 and cup 2, to uniquely identify
  them. The dataset contains 35,064 distinct objects, spanning 894 diﬀerent classes. For each of the 1449
  images, support annotations were manually added. Each image’s support annotations consists of a set
  of 3tuples: [Ri, Rj, type] where Ri is the region ID of the supported object, Rj is the region ID of
  the supporting object and type indicates whether the support is from below (e.g. cup on a table) or
  from behind (e.g. picture on a wall). Examples of the dataset are found in Fig 7 (object category labels
  not shown). 3 Modeling the Structure of Indoor Scenes Indoor scenes are usually arranged with respect

quote_extract: "r Simulation Challenge 2022 View on GitHub Welcome to the home of the first-ever Fast
  Calorimeter Simulation Challenge! The purpose of this challenge was to spur the development and benchmarking
  of fast and high-fidelity calorimeter shower generation using deep learning methods. Currently, generating
  calorimeter showers of interacting particles (electrons, photons, pions, ...) using GEANT4 is a m …
  bottleneck at the LHC, and it is forecast to overwhelm the computing budget of the LHC experiments in
  the near future. Therefore there is an urgent need to develop GEANT4 emulators that are both fast (computationally
  lightweight) and accurate. The LHC collaborations have been developing fast simulation methods for some
  time, and the hope of this challenge is to … l make use of cutting-edge techniques in generative modeling
  with deep learning, e.g. GANs, VAEs and normalizing flows. The results of the CaloChallenge are summarized
  in the final write-up. It is published in Rep. Prog. Phys. 88 116201. The same document is also available
  as preprint: arXiv:2410.21611. If you would like to compare your model to the submitted ones, or reproduce
  any of the plots of the document, have a look at the Legacy section below. This challenge is modeled
  after two previous, highly successful data challenges in HEP – the top tagging community chal … 2020-006.
  The number of radial and angular bins varies from layer to layer and is also different for photons and
  pions, resulting in 368 voxels (in 5 layers) for photons and 533 (in 7 layers) for pions. Dataset 2
  can be downloaded from Zenodo with DOI 10.5281/zenodo.6366270. It consists of two files with 100k GEANT4-sim
  … from histogram differences of high-level features. Training time, calorimeter shower generation time
  and memory usage. Interpolation capabilities: leave out one energy in training and generate samples
  at that energy after training. It is expected that there will not necessarily be a single clear winner,
  but different methods will have their pros and cons. A script to perform the evaluation is available
  on the Github page. More options will be added in the near future. In order to run the evaluation, the
  generated showers should be saved in … le.create_dataset('showers', data=your_showers.reshape(len(your_showers),
  -1), compression='gzip') dataset_file.close() Note that the distribution of incident energies of the
  samples should match the distribution in the validation data, as the histograms might otherwise be distorted.
  Timeline, Workshops, Final Results, and Legacy Intermediate results were presented at a workshop at
  the end of May 2023 in Rome, ML4Jets 2022 at Rutgers, and ML4Jets 2023 in Hamburg. There, we discussed
  the different approaches, as well as their merits and limits. The final community paper documenting
  … t reads those files and produces the figures is available in the same folder under final_results/figure_creation.ipynb.
  Michele Faucci Giannelli, Gregor Kasieczka, Claudius Krause, Ben Nachman, Dalila Salamani, David Shih
  and Anna Zaborowska homepage is maintained by CaloChallenge. This page was generated by GitHub Pages."

quote_extract: "May 26, 2026 … he trade-offs associated with key agent design decisions like model selection,
  harness optimization, and post-training. Since launch, we have been baselining frontier models from
  prominent AI providers on an evaluation set that mirrors the task distribution of LAB. We scored each
  task under LAB’s all-pass standard, where a task counts as passing only if every required rubric criteri
  … passes. From this analysis, three meaningful trends have emerged: Legal work is far from saturated
  by frontier models: Under our strict all-pass standard, the frontier models we evaluated complete less
  than 10% of tasks end-to-end in aggregate. The frontier of model intelligence cannot yet deliver complete
  legal work product. Intelligence is not evenly distribut … with it, as the best-scoring models are increasingly
  token-hungry and reliant on time-consuming, multi-step reasoning. On LAB, reaching the top of the leaderboard
  runs to roughly $50 per task and over 20 minutes of latency. We also believe strongly that the way an
  agent works inside a task carries as much information as the score it produces … analysis of agent traces
  to better understand why some agents succeed while others fall short. Legal Agent Performance To evaluate
  agents in a standardized way, we created a hold-out set of legal tasks that mirror the practice areas
  and task distribution from the public LAB set. Each task is scored under LAB's all-pass standard, against
  expert-curated rubrics that specify the facts, conclusions, citations, structural requirements, and
  analytical moves a passing answer must include. To prevent grader bias, we grade agent runs multiple
  times across model families and average the results. Figure 1. Overall leaders on LAB, ordered by all-pass
  percentage. Figure 1 ranks the frontier models we baselined by overall all-pass on the holdout. Claude
  Opus 4.7 leads at 7.1%, with Sonnet 4.6 at 5.4%, Opus 4.6 at 4.2%, GPT-5.5 at 2.1%, and Gemini 3.5 Flash
  at 0.8% to round out the major model families we’ve evaluated thus far. Read against the strict review
  standard legal work actu … agent behavior qualitatively as well as quantitatively for this reason. We
  apply the same lens to legal agents on LAB. The agents we baselined have a fixed action space with six
  actions that an agent can select from at any given turn: Read: Open a document from the matter file.
  Search: Query the matter for content across documents. Execute: Run analys … and revising: The strongest
  positive pattern is not just reviewing, but actually changing the deliverable after review. Agents that
  close this revise-after-check loop improve all-pass scores by 1.5 points on average. Using targeted
  retrieval: Agents that search the matter file during the run can locate facts across the broader corpus
  … amilies covering more practice areas, adjacent professional-service workflows beyond legal, and longer-context
  matters. We are partnering with Artificial Analysis to scale up LAB evaluation and publish a regularly-updated
  leaderboard as new model launches arrive. The leaderboard will be a living record of where the frontier
  sits on legal work, refreshed as the field moves. The res"

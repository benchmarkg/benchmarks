quote_extract: 'arXiv:2610.24206v2 [cs.SE] 11 Nov 2026 SWE-Bench Pro V2: A Cleaner, Harder-to-Game Coding
  Benchmark … Agentic audits, expert adjudication and blind re-implementation repaired or retired 480
  of the 731 tasks … In contemporaneous work, SWE-Bench Pro Verified [29] blocks code hosts, hides test
  artifacts, and refines 102 tasks drawn from public issue reports and external audits, among them one
  by OpenAI estimating that about 30% of SWE-Bench Pro tasks are broken [30]; the refinements are checked
  with model trial runs. … Spec–test contradiction (10 repaired, 5 discarded). … On the assembled 642-task
  set, the reference patch passes every task and the empty patch fails every task. … With the network
  open, 32 of 642 Claude Opus 5 trajectories contacted code hosts, and 25 downloaded the task’s own repository.
  … SWE-Bench Pro: Can AI agents solve long-horizon software engineering tasks? In Proceedings of the
  43rd International Conference on Machine Learning (ICML), volume 306 of Proceedings of Machine Learning
  Research, 2026.'

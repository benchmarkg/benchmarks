  benchmarking open problems in sin … ethod selection. To achieve this goal, we developed the Open Problems
  in Single-Cell Analysis (Open Problems) platform. The Open Problems platform is an open-source, extensible,
  living benchmarking framework that enables quantitative evaluation of best practices in single-cell
  analysis. It combines a permissively licensed GitHub repository (github.com/openproblems-bio/openproblems)
  with community-defined tasks, an automated benchmarking workflow, and a website to explore the results.
  Currently, Open Problems includes 10 defined tasks, on which 16 datasets are used to evaluate 70 methods
  using 31 metrics. These tasks were defined by community engagement, including on the public GitHub repository,
  in regular open meetings, and at a hackathon in March 2021 with over 50 participants. This broad involvement
  has already led to new benchmarking insights and best practice recommendations, while improving … n
  Problems in a seamless manner (Methods). Each Open Problems task consists of datasets, methods, and
  metrics (Fig 1b). Datasets define both the input and the ground truth for a task, methods attempt to
  solve the task, and metrics evaluate the success of a method on a given dataset. We provide cloud infrastructure
  to enable centralised benchmarking when new methods, datasets, or metrics are added to … of the task.
  Each component (i.e. dataset, method, or metric) exists as a single file in the relevant subdirectory,
  and adding a new method is as simple as opening a pull request to the repository and adding a new file
  that follows the API for that task. When a community member adds a component, the new contribution is
  automatically tested in the cloud. When all tests pa … ntribution is accepted, the results from the
  new contribution are automatically submitted to the Open Problems website. To maximise reproducibility,
  each component is run within a Docker container defined by the method contributor, and all data is downloaded
  from public repositories, including figshare, the Gene Expression Omnibus (GEO)26, and CELLxGENE27.

  as the benchmark of video. … **`2025.02.27`** 🌟 Video-MME has been accepted by CVPR 2025. … **`2024.06.15`**
  🌟 We have refreshed our evaluation: 1) replace broken and potentially broken video links, and re-annotated
  them … **`2024.06.03`** 🌟 We are very proud to launch Video-MME … All data are newly collected and annotated
  by humans, not from any existing video dataset … Video-MME is only used for academic research. Commercial
  use in any form is prohibited. … Without prior approval, you cannot distribute, publish, copy, disseminate,
  or modify Video-MME in whole or in part. … [Data](https://huggingface.co/datasets/lmms-lab/Video-MME/tree/main)
  and [Annotation](https://huggingface.co/datasets/lmms-lab/Video-MME) provided by LMMS-Lab … [Evaluation
  Pipeline](https://github.com/MME-Benchmarks/Video-MME?tab=readme-ov-file#-evaluation-pipeline) … You
  could choose to directly use tools like [VLMEvalKit](https://github.com/open-compass/VLMEvalKit) and
  [LMMs-Eval](https://github.com/EvolvingLMMs-Lab/lmms-eval) to evaluate your models on Video-MME. … There
  are a total of **900 videos** and **744 subtitles**, where all long videos have subtitles. … Respond
  with only the letter (A, B, C, or D) of the correct option. … For the subtitles-free setting, you should
  remove the subtitle content. … please refer to the evaluation script [eval_your_results.py](https://github.com/thanku-all/parse_answer/blob/main/eval_your_results.py),
  and you will get the accuracy scores across video_durations, video domains, video subcategories, and
  task types. … The evaluation does not introduce any third-party models, such as ChatGPT. … If you want
  to add your model to our [leaderboard](https://video-mme.github.io/home_page.html#leaderboard), please
  send model responses to'

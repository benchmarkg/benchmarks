quote_extract: 'nch Our model performance benchmarks will extend to global jurisdictions, core legal practice
  areas, and complex legal research tasks. by Harvey Team•Feb 9, 2026 In 2024, we published BigLaw Bench
  (BLB) with the goal of understanding how well model intelligence could be used to solve real legal tasks.
  Over time, model performance has steadily improved on BLB with base model scores going from 60% (GPT
  4o | Claude 3.5 | Gemini 1.5) to 90% (GPT-5 | Claude 4.5 | Gemini 3). This growth has paralleled improvements
  in the models’ ability to recall, understand, and apply core legal principles to tasks. In short, our
  original goal for Biglaw Bench — to build a system for better understanding models’ legal problem-solving
  capabilities — has been prov … or publicly discussing how we are seeing the models improve in ways that
  matter to our customers. To continue providing (and deepening) this context, we will be updating and
  substantially expanding the public version of BLB. In the coming months, we’ll be releasing extended
  benchmarks that increase the number of BLB data points more than fivefold. This data reflects research
  in three key areas: global law, practice areas, and legal research. Throughout the rest of this post,
  we reflect on the learnings from the original BLB, and why continuing to benchmark models provides unique
  insights … utions, their rate of hallucinations, and their ability to retrieve information from large
  corpora. While we continue to measure all of these things, we have found that the most accurate measure
  of model capabilities is core BLB: their ability to solve tasks as graded by objective, expert-written
  criteria. More often than not, as models improve on these tasks, they improve our ability to build and
  deliver valuable AI solutions to lawyers. This correlation has allowed the Harvey team to understand
  where models may fall short of delivering value to lawyers; work with foundation model labs to improve
  model capabilities for law; and probe model capabilities to understand how they behave under different
  constraints. Understanding General Model Gaps One way we use BLB is to un … od that certain actions
  would trigger a Most Favored Nations provision in a side letter. Instead of looking at how the models
  performed on this task, we looked at whether performance changed when we rephrased the BLB prompt. In
  the side letter example, we posed the question three different ways: (1) neutrally, (2) as the general
  partner hoping to find a loophole, and (3) … Applied Legal Researchers worked to map out core tasks
  and build datasets that tested models’ ability to understand, support, and solve those tasks. Our initial
  practice areas include a diverse and representative cross section, covering: Capital Markets, Mergers
  and Acquisitions, Fund Formation, Litigation, Arbitration, and Intellectual Property. Legal Research
  Legal Research focuses on a model’s cross-practice abilities to solve hard research problems when provided
  with search tools. Our init … ategies to make models more capable researchers. What’s Next for BLB First,

quote_extract: "ISPD 2005 Announcements 09/06/2005: Contest solutions are posted (in alphabetical order)
  !!! Disclaimer: These are solutions submitted for ISPD 2005 placement contest which was held in April
  2005. Today's version of each placement tool is likely to produce … must be submitted by March 25th
  2005, 5:00 pm Eastern time. 03/20/2005: Six contest benchmarks are posted. adaptec2.tar.gz adaptec4.tar.gz
  bigblue1.tar.gz bigblue2.ta … ts are posted. If you find any problem, please let me know. legal.pl :
  check the legality of placement solution Usage: legal.pl Output: creates \"legality.error\" file. There
  shouldn't be any \"ERROR\" messages in this file hpwl.pl : measures HPWL while respecting pin-offset
  values Usage: hpwl.pl Output: print out HPWL value on STDOUT 01/28 … nouncement email 01/12/2005: announcement
  email 01/12/2005: Two sample benchmarks are mailed to each team adaptec1.tar.gz adaptec3.tar.gz Important

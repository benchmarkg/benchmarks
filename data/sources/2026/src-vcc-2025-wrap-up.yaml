quote_extract: 'ons. We saw remarkable diversity, from students learning the field to established research
  organizations. We have an ambitious goal of predicting cellular response to perturbation, a challenging
  and impactful task with wide implications for biology. While the final results of this first effort
  indicate that perturbation prediction models are not yet consistently outperforming naive baselines
  across all metrics, we saw significant improvements on core capabilities like perturbation discrimination
  and identification of differentially expressed genes. The winning approaches combined deep learning
  with classical statistical features, suggesting pure end-to-en [...] for every hypothesis, researchers
  could screen thousands of perturbations in silico, then validate the most promising candidates experimentally.
  The Turing Test for Virtual Cells We designed the Virtual Cell Challenge around this concrete question:
  can a computational model stand in for an actual Perturb-seq experiment? If you give a model a starting
  cell state and a genetic perturbation, can it predict the resulting gene expression changes well enough
  to guide biological discovery? This is ultimately our North Star: not whether models achieve high scores
  on abstra [...] h the AlphaFold moment in protein structure prediction was less about beating specific
  benchmarks, but more about passing the practical usability threshold for biologists. 3. Dataset Design:
  Building a True Benchmark As detailed before, we generated a purpose-built benchmark dataset of ~300,000
  single-cell RNA-seq profiles from H1 human embryonic stem cells with 300 CRISPRi perturbations. In our
  Virtual Cell Challenge commentary, we explained our key design choices: H1 hESCs represent a distributional
  shift from typical training data (K562, A375, and cell lines in other large-scale datasets like Tahoe-100M),
  forcing models to genera [...] carefully selected to span from dramatic to subtle transcriptional effects,
  ensuring comprehensive evaluation of model capabilities (see Behind the Data of the Virtual Cell Challenge).

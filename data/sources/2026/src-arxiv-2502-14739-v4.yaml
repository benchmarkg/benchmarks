quote_extract: 'M-A-P ByteDance Seed, 2077.AI … we present SuperGPQA, a comprehensive benchmark that evaluates
  graduate-level knowledge and reasoning capabilities across 285 disciplines … the reasoning-focused model
  DeepSeek-R1 achieved the highest accuracy of 61.82% on SuperGPQA … Climbing Space: The remaining improvement
  space for the SOTA models. … SuperGPQA provides at least 50 questions for each graduate-level disciplines
  … The easy questions are further tailored based on the accuracy of LLMs … where we consider experts
  as individuals having or pursuing a PhD, as in GPQA … crowd-sourcing annotators as undergraduates and
  master students from top-tier Chinese universities … Translate non-English questions into English with
  academic language. … exhibit a high frequency of consistency in both process and answers with the erroneous
  processes and answers from several online exercise websites … there is a significant risk of data leakage
  … Example problems with solutions from textbooks. … Calculation and reasoning-needed questions with
  solutions from websites. … We adopt GPT-4o-2024-08-06, Gemini-2.0-flash, Doubao-1.5-pro-32k-250115,
  Claude-3.5-Sonnet, DeepSeek-R1, QwQ, Qwen-2.5-72B-Instruct as SOTA LLMs for selecting suspicious candidate
  questions. … During the re-annotation process, following the rules stated in GPQA … expert annotators
  are asked to review and solve the given candidate questions with unrestricted access to the web … With
  26,529 questions spanning 13 disciplines, 72 fields, and 285 subfields … such as GPQA (448 questions)
  and MMLU-Pro (12,032 questions) … an average of 9.67 options per question … collectively accounting
  for 77.2% of the benchmark … use some open-source datasets for supplementation of SuperGPQA … 42.33%
  of all questions require mathematical calculations or formal reasoning … Difficulty Agro. Econ. Edu.
  Eng. Hist. Law Lit. & Arts Mgmt. Med. Military Sci. Phil. Sci. Socio. … Hard (#N) 7 47 1 2458 3 57 12
  6 217 4 27 4210 1 … Middle (#N) 219 565 179 3462 180 343 496 236 1629 78 183 4133 45 … Easy (#N) 259
  261 304 1972 491 256 1168 259 909 123 137 1495 97 … Total 485 873 484 7892 674 656 1676 501 2755 205
  347 9838 143 … We evaluate 6 reasoning models (o3-mini has three modes), 28 chat models and 17 base
  models on SuperGPQA … Reasoning models and chat models are evaluated using a zero-shot approach, while
  base models are assessed using a five-shot evaluation. … the five-shot evaluation for base models follow
  a similar methodology to MMLU-Pro … For all main results, the temperature is set to 0. … The maximum
  number of new tokens is set to 32K for reasoning models, while for all other models, it is set to 4K.
  … incorporating subfield information generally leads to improved performance, particularly for larger
  models … employing 24 distinct yet semantically equivalent prompts in a zero-shot setting … a maximum
  standard deviation SD of 1.37% … Multimodal Art Projection (M-A-P) is a non-profit open-source AI research
  community, ran by donation. … we use large models to assist in generating distractors … a model is randomly
  selected to generate a confusion option, which is then double-checked by the annotator … There is only
  one correct answer. The last line of your response should be in the format'

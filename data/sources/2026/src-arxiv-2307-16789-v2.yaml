  Based on ToolBench, we fine-tune LLaMA to obtain an LLM ToolLLaMA, and equip it with a neural API retriever
  to recommend appropriate APIs for each instruction. Experiments show that ToolLLaMA demonstrates a remarkable
  ability to execute complex instructions and generalize to unseen APIs, and exhibits comparable performance
  to ChatGPT. Our ToolLLaMA also demonstrates strong zero-shot generalization ability in an out-of-distribution
  tool-use dataset: APIBench. The codes, trained models, and demo are publicly available at https://github.com/OpenBMB/ToolBench.

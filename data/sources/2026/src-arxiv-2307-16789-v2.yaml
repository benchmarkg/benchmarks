  performance of ToolLLM framework. We first introduce the evaluation metric and evaluate the efficacy
  of … owed by a generalization experiment in § 3.3. 3.1 PRELIMINARY EXPERIMENTS ToolEval Considering
  the API’s temporal variability on RapidAPI and the infinite potential solution paths for an instruction,
  it is infeasible to annotate a fixed ground-truth solution path for each test instruction. Moreover,
  when comparing different models, it is crucial to ensure they employ the same version of APIs during
  evaluation. Considering that human evaluation can be time-consuming, we follow AlpacaEval (Li et al.,
  2023b) to develop an efficient evaluator ToolEval based on ChatGPT, which incorporates two evaluation
  metrics (details in appendix A.5): (1) Pass Rate: it calculates the proportion of successfully completing
  an instruction within limited budgets. The metric measures the executability of instructions for an
  LLM and can be seen as a basic requirement for ideal tool use; and (2) Win Rate: we provide an instruction
  and two solution paths to ChatGPT evaluator and obtain its preference (i.e., which one is better). We
  pre-define a set of criteria for both metrics and these criteria are organized as prompts for our ChatGPT
  evaluator. We evaluate multiple times based on ChatGPT to improve the reliability. Then we calculate
  the average results from the evaluator. Through rigorous testing (details in appendix A.5), we find
  that ToolEval demonstrates a high agreement of 87.1% in pass rate and 80.3% in win rate with human annotators.

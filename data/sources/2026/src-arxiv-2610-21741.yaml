quote_extract: "tion is widely regarded as a more faithful way to assess end-to-end (E2E) driving models
  than open-loop evaluation, and Bench2Drive, built on the CARLA simulator, has become the dominant benchmark
  for it. We show that its evaluation protocol itself contains pitfalls that can misrepresent the models
  scored on it. Bench2Drive's comfort metric, adapted from nuPlan, has several implementation errors and
  a segmentation scheme that rewards standing still, so it mostly measures how long a vehicle stays stationary,
  correlating with stationary time at r = 0.97 across eight models. We propose a corrected, distance-based

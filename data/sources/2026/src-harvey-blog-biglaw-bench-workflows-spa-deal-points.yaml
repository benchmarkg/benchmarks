quote_extract: 'U Insights BigLaw Bench Workflows: SPA Deal Points Expanding BigLaw Bench to evaluate
  legal workflow agents, starting with extracting deal points from Share Purchase Agreements (SPAs). by
  Harvey Team•Sep 26, 2024 We are expanding our publicly-released BigLaw Bench data to include data we
  use to benchmark, evaluate, and improve legal workflow agents. These workflow datasets represent a large
  number of samples of a complex, recurring task and are used to evaluate and improve agent systems on
  these hard reasoning problems. The first dataset we are releasing is extracting deal points from Share
  Purchase Agreements (SPAs). Although these documents fit within the context window of foundation models,
  they struggle to reason effectively over these complicated agreements, correctly identifying only between
  66.04% (GPT-4o) and 72.27% (Gemini) when given a basic set of deal points. In contrast, Harvey’s SPA
  agents are able to extract 98.47% of deal points correctly across diverse SPA documents. Here, we discuss
  our results and provide a subset of both the SPA data and the deal points schema. Dataset We collected
  a large number of SPAs from the SEC’s website and other sources. Our legal research team reviewed these
  SPAs and identified a subset of documents that were representative of the diversity and complexity of
  documents they worked with du … both a reason for each data point returned and source(s) that backs
  up its conclusion. Evaluation We evaluated our agentic system, as well as existing foundation models,
  on the BigLaw Bench SPA set. This set consists of a set of SPAs not used in the building of our agentic
  system to ensure generalization of processes and avoid overfitting. For evaluation, we compute accuracy
  compared to the ground truth deal points as extracted and verified by BigLaw attorneys. For fields that
  are not string-typed (e.g. dates, numbers, booleans), we perform exact matches once the fields are normalized.
  For text based fields we used a model to compare matches and verified model grader efficacy with BigLaw
  attorneys. Overall accuracy is computed as a straight average over the test set and all the individual
  fields. Next steps We plan to continue expanding BigLaw Bench to include more workflows and more complex
  tasks. By continuing to make BigLaw Bench methodologies and data public we will provide the industry
  w … towards more standardized benchmarking for the industry as a whole. We also hope these workflows
  serve as inspiration for our present and future clients. We’ve had a lot of requests for workflows and
  will be incorporating them into the Assistant and Vault products over the next few months. Next Up Find
  Every Auto Renewal Clause in Your Portfolio Before its Notice Window Closes AI Fluency in Legal Hiring
  and How to Show it A Contract Approval Workflow Should Route Each Nonstandard Term'

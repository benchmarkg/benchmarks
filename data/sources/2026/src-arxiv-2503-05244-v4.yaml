  human judgment, we conduct a human evaluation study involving 300 queries (constructed in the same pipeline
  as described in Section 3.1 but not included in WritingBench). Five professionally trained annotators
  with linguistic backgrounds perform pairwise comparisons of model responses. For each query, two responses
  are generated by two randomly selected models (drawn from the same set of 17 models used for evaluation
  in Section 4.2). The triplet is presented on the same page to enable direct comparison. Annotators are
  instructed t … pite customization, since our queries involve highly diverse tasks and varied sources.
  These findings confirm that context-sensitive query-dependent evaluation better captures real-world
  writing complexity compared to conventional static approaches. Furthermore, the critic model attains
  84% agreement, confirming its practical viability. 4.4 Ablation of Data Curation for Writing-Enhanced

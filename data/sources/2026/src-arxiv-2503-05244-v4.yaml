  more targeted insights into performance on that particular capability. Phase 2 - Rubric-based Scoring:
  For each criterion ci ∈ Cq, the evaluator independently assigns a score on a 10-point scale to a response
  r, along with a justification. The final overall score is computed by averaging scores across all criteria.
  Scoring prompt is provided in Appendix C.6. To alleviate the computational overhead with LLM-based evaluation,
  we develop a dedicated critic model, M, designed to implement our rubric-based scoring framework. Specifically,
  this model performs the mapping Mc : (q, r, ci) → [1, 10] × J , where the output consists of a numerical
  score and corresponding justification text, J , both in accordance with the predefined evaluation rubric.
  The critic model is fine-tuned on a dataset of 155K instances scored by Claude-3.7, which demonstrates

  applicability of queries while addressing real-world needs, we design a set of query diversification
  strategies (see Appendix C.3), ins … ignment with real-world applications and avoiding harmful content.
  Phase 1 - Material Collection: At this stage, we engage 30 trained annotators, compensated at $18 per
  hour and possessing specialized expertise proven through domain-knowledge tests. Their role is to collect
  open-source reference materials needed for the writing tasks (e.g., public financial statements or legal
  templates). Annotators may either adopt the sources suggested by the LLM-generated material requirements
  or, when more appropriate, independently identify alternative documents. Each query can be paired with
  multiple material sources, whereas in some cases no e … e errors caused by parsing documents in varied
  formats and to eliminate noise from irrelevant content such as web advertisements, the annotators carefully
  extract and verify only the most pertinent text segments. Phase 2 - Expert Optimization: Next, five
  experts with LLM experience or relevant industry expertise conduct data screening. The experts first
  exclude low-quality data that are unrealistic, overly generic, or potentially harmful. For the remaining
  entries, a rigorous two-stage review is employed: (1) query adaptation: ambiguous expressions are revised
  to better align wit … ins focused, relevant, and devoid of harmful content. Furthermore, experts are
  encouraged to create original, high-quality queries that are cross-validated by their peers, to further
  enhance diversity and realism. Finally, we construct WritingBench, a benchmark comprising 1,000 queries
  categorized using a two-tiered taxonomy, including 445 queries in Chinese and 555 queries in English.
  In comparison to existing writing benchmarks summarized in Table 1, WritingBench exhibits notable advantages
  in terms of the number of instances, domain diversity, requirement coverage, and variability in input
  lengths. The detailed statistical dis … o address unique characteristics found in areas like technical
  documentation or creative writing; (2) Requirement specificity: such criteria lack the flexibility to
  encompass specific requirements related to style, format, or length control; and (3) Material dependency:
  they are insufficient to verify whether responses appropriately utilize the provided reference materials,
  such as incorporating data points or maintaining narrative continuity. To address these challenges,
  we propose a query-dependent evaluation framework that enables dynamic adaptation to diverse writing
  scenarios. This approach comprises two phases: Phase 1: Dynamic Criteria Generation: As illustrated

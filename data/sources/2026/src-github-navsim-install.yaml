quote_extract: "as └── sensor_blobs ``` Set the required environment variables, by adding the following
  to your `~/.bashrc` file Based on the structure above, the environment variables need to be defined
  as: ```bash export NUPLAN_MAP_VERSION=\"nuplan-maps-v1.0\" export NUPLAN_MAPS_ROOT=\"$HOME/navsim_workspace/dataset/maps\"\
  \ export NAVSIM_EXP_ROOT=\"$HOME/navsim_workspace/exp\" export NAVSIM_DEVKIT_ROOT=\"$HOME/navsim_workspace/navsim\"\
  \ export OPENSCENE_DATA_ROOT=\"$HOME/navsim_workspace/dataset\" ``` ⏰ **Note:** The `navhard_two_stage`
  split is used for local testing of your model's performance in a two-stage pseudo closed-loop setup.
  In contrast, `warmup_two_stage` is a smaller dataset designed for validating and testing submissions
  to the [Hugging Face Warmup leaderboard](https://huggingface.co/spaces/AGC2025/e2e-driving-warmup) …
  al) (for more details, see [Submission](submission.md)). ### 3. Install the navsim-devkit Finally, install
  navsim. To this end, create a new environment and install the required dependencies: ```bash conda env
  create --name navsim -f environment.yml conda activate navsim pip install -e . ```"

quote_extract: "S EU AU Insights BigLaw Bench: Hallucinations On legal tasks, Harvey's models hallucinate
  at a lower rate than the foundation models despite providing longer and more detailed answers. by Harvey
  Team•Oct 7, 2024 Hallucinations are one of the most common concerns with Large Language Models (LLMs).
  LLMs’ ability to invent spurious but credible sounding content creates trust issues, even if hallucinated
  content … viding longer and more detailed answers. Defining Hallucinations Although hallucinations are
  commonly discussed, there does not appear to be a universally accepted definition for the term. At Harvey,
  we define hallucinations as: a factual claim made by an LLM that can be demonstrably disproven by reference
  to a source of truth. We do not count as hallucinations related failure modes that may also lead models
  to produce irrelevant or unhelpful information such as errors in understanding or reasoning. These failure
  modes are … is true based on the information in the source of truth documents. This system is optimized
  by our research teams to confirm that model judgments are closely aligned with human hallucination review.
  We deploy this system on the answers to a subset of BigLaw Bench tasks that require reasoning over multiple,
  long documents. These types of tasks are cases we have found most vulnerable to hallucinations even
  when models are provided grounding information. We then performed human review of all model judgments
  to confirm system alignment. After human review, we compute the hallucination rate for each model. Hallucination
  rates are computed as the number of sentences containing a hallucinated claim divided by the total number
  of sentences in a response. The below tables show total response sentences and hallucination rates for
  Harvey and leading foundation models on the evaluated tasks. Models Total Response Sentences Hallucination
  Rate Harvey Assis"

  during the initial construction of the benchmark but become unavailable later. T … over time, which
  raises concerns about the stability of ToolBench as a benchmark. 2.2 Stability of Evaluation In ToolBench,
  there are two types of metrics, including Pass Rate (PR) and Win Rate (WR). PR is calculated based on
  using gpt-3.5-turbo-16k to determine if a task is solvable and whether the generated answer can solve
  the corresponding task. Figure 2 details the computation process of PR. Specifically, a solvable task
  results in a pass if the answer is solved, a failure if unsolved, and is randomly determined if unsure.
  For tasks deemed … roportion are unsolved. Moreover, WR does not reflect the same trend as PR, where
  the second run of WR in DFS (48.0) is even lower than the first run of CoT. Therefore, all the phenomena
  reflect that gpt-3.5-turbo-16k can not assume the role of the automatic evaluator in tool learning,
  which will be discussed in Section 4.6. 2.3 Stability of API Status We investigate the change of API
  status in ToolBench. In detail, we scan the original APIs downloaded from ToolBench, and use gpt- …
  we classify these APIs into three categories: success, not availability, and not authorisation3. The
  API status and the detailed errors of not availability are presented in Figure 3. As can be seen, only
  44.4% of API calls are successful, while other API calls are mostly not available with various errors
  and some are not authorised. Furthermore, to validate the impact of API call failures on the stability
  of model performance, we manually make some success tools4 down by returning a special failure call.

quote_extract: "rong lens samples it is necessary to accurately quantify the detection efficiency and
  bias of automated lens detectors. These open challenges are designed as a friendly way of stimulating
  activity and helping to quantify results in this regard. Challenges Challenge 2.0 Update Feb. 28, 2020
  We have a winner!! C. Bom, et al. 's \"Cast_efficient_auc\" entry has won. Congratulations to them and
  everyone else. There were several very close entries. Detailed report to follow... Challenge 2.0 is
  an improvement in the simulated images over 1.0 and a change in the bands. This challenge concentrates
  only on Euclid-like observations in the VIS, and NISP J, Y and H bands. The pixels sizes are 0.1'' for
  VIS and 0.3'' for J, Y and H. The training and the test sets consists of 100,000 images in each band.
  Taining Set The training set consistes of 100,000 x 4 images and a catalog that gives the properties
  of each lens candi … description of each field is in the header of the catalog. Log of lens properties
  Data pack of images (19 GB) Test Set Test sets will soon be available: Data pack of images (19 GB) Evaluation
  of submissions Learning from our experience with the first challenge, a different method will be used
  to eva … 20. The deadline was extended to Jan 31. Challenge 1.0 (ended) This challenge has expired.
  A discription of the results is in the paper Metcalf, et al 2018 This is the first of what we expect
  to be at least two generations of challenges, each becoming harder and more realistic. This challenge
  will concentrate on galaxies that are lensed by galaxies (i.e. no clusters and no quasars). There are
  two parts to the challenge, C.1 and C.2, designed to mock different types of data sets. They require
  separate entries. You can entering both or either one. Training sets of 20,000, 101px x 101px images
  are p … ake classification somewhat easier. Space Based Training Set C.2 This data set mocks a ground
  based, multi-band survey. The challenge data set consists of 100,000, 101px x 101px images in each of
  four bands (I,G,R,U). The training set 20,000 x 4 images. The bands should accurately represent galaxies
  at the appropriate redshifts althoug … s imposed to ensure that the method can really be considered
  automatic and that minimal human intervention is required. You will be sent a report evaluating your
  entry. Authors of valid entries will be invited to participate in a publication presenting the results.
  How To Enter To regist … names and the second column is p . The submission forms are here: Space.1 submission
  form , Ground.1 submission form . After February 5th 2017 no further entries will be accepted. Evaluation
  of Entries Entries will be evaluated by constructing the ROC. The ROC is the plot of the true positive
  rate, … for detection. A method that guesses at random would have TPR = FPR and a ROC curve that is
  a line from (0,0) to (1,1). The area under the ROC will be used as a figure of merit for evaluating
  the methods. This procedure will be done for several cuts in the sample such on the brightness of the
  lensed image, the size of the lensed image and the size of the Einstein radius. Data Set Release The
  Challenge is over and many people have asked for the data sets and truth tables. Ground set 1 and Truth
  table Ground set 2 and Truth table Ground set 3 and Truth table Ground set 4 and Truth table Gro … et
  5 and Truth table People Funding This program is supported via the European Research Council research
  group \"GLENCO\" funded under the Seventh Framework Programme, Ideas, Grant Agreement n. 259349. PI.
  R. Benton Metcalf. This project is supported by the Italian Ministry of Foreign Affairs and International

  in regulatory compliance. 4 RePASs: Regulatory Passage Answer Stability Score We propose a reference-free
  evaluation metric, RePASs, to evaluate generated answers in regulatory compliance contexts. Inspired
  by recent work on answer attribution to specific sources (Bohnet et al., 2023; Yue et al., 2023), this
  metric evaluates answers based on three key aspects: • Every answer sentence must be supported by at
  least one sentence in the source passage(s). • The answer must not contain any sentences that contradict
  the information in the source passage(s). • The answer must cover all the obligations present in the
  source passages, meaning that all regulatory obligations should be reflected in the answer. 4 This metric

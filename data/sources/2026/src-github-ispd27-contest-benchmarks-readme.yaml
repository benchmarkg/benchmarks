quote_extract: '# ISPD 2027 Contest Benchmarks This directory contains the six public benchmarks for the
  ISPD 2027 Contest on **MCMM Post-CTS Buffering and Sizing**. As of **October 5, 2026**, two public benchmarks
  were released: - `aes` and `jpeg` As of **November 7, 2026**, the remaining four public benchmarks were
  released: - `aes/scan`, `jpeg/scan`, `coralnpu` (Coral NPU) and `nyuzi` (NyuziProcessor). The public
  benchmarks are used only for tool development, debugging, and testing. **Final contest scores and rankings
  will be determined solely by performance on the hidden benchmarks.** ## Directory layout A benchmark
  is `benchmarks//`, for example `benchmarks/nyuzi/`. A scan testcase is `scan/` of its benchmark directory,
  for example `benchmarks/jpeg/scan/`. Reference results of a testcase are in `postgrt_results.csv` and
  in `evaluator/reference_results/`. Unpack the inputs, then run a benchmark by its path: gunzip -k benchmarks/nyuzi/input.def.gz
  benchmarks/nyuzi/input.v.gz bash evaluator/eval.sh nyuzi /tmp/nyuzi-run The path of a scan testcase
  ends with `/scan`: gunzip -k benchmarks/jpeg/scan/input.'

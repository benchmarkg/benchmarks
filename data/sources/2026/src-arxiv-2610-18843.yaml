quote_extract: "ze across deployment environments, including variations in the robot itself: cameras are
  bumped and remounted, calibrations drift, controllers run at different rates, and end-effector pads
  wear down. We present LIBERO-RIG, a benchmark that perturbs only the robot's hardware and setup while
  holding every LIBERO task fixed. The benchmark spans eleven perturbation axes, including camera mounting
  and optics, camera-to-arm calibration, actuation gain, control rate, proprioceptive noise, base pose,
  table height, and gripper"

quote_extract: "Discussion2.1.Overall View of Targets and Prediction Strategies For monomer categories,
  125 human expert groups and 36 server groups submitted predictions for 16, 42, and 27 targets from Phase
  0, 1, and 2, respectively. The Phase 0 monomer targets and models were all derived from Phase 0 oligomer
  targets … analyses allowed us to group the evaluation metrics into categories, from which nine representative
  measures were selected: GDT_HA, QSE, reLLG_const, SphGr, CAD_AA, GDC_SC, AL0_P, lDDT, and MolProbity
  score. In Methods, we briefly describe each score. Adhering … structure prediction quality: because
  all Phase 0 targets were reused in Phase 1, and predictors could invest more time and apply human intervention
  to improve prediction quality. An example of large improvement comes from the models for targets T0257‐D1
  and … difficulty. We used ColabFold's performance as an indicator of target difficulty. The ColabFold
  pipeline did not change between CASP15 and CASP16 except for updating sequence/structure databases and
  versions of AF2 and AFM weights (from 2.0 to 2.3). ColabFold submitted predictions to all 112 CASP15
  monomer EUs, and 59 out of 74 CASP16 monomer EUs in Phase 1: EUs derived from hybrid targets (with nucleotides)
  cannot be modeled by ColabFold and were excluded. Accordingly, we restricted our comparative analysis
  to EUs with ColabFold predictions. We computed the average GDT_HA scores of the best models from the
  top 50 groups in CASP15 and CASP16 (Figure 7A). The highest GDT_HA among CASP participants increased
  from 71.6 to 77.4. However, the GDT_HA of ColabFold also increased—from 64.7 in CASP15 to 72.2 in CASP16—suggesting
  a potential shift in the overall difficulty of the targets. The distribution … the field is surpassing
  AF2, possibly due to the contribution of AF3. FIGURE 7 (A) Average GDT_HA for different groups over
  all targets submitted by colabfold_baseline for CASP15 (top) and CASP16 (bottom). (B) Distribution of
  CASP15 (top) and CASP16 (bottom) colabfold_baseline's best"

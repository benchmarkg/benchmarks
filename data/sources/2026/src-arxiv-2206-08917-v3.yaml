  come from a superset of IS2RETotal systems, including unrelaxed systems (e.g. 50,810 train systems).
  Splits are sampled based on catalyst composition, ID for those from the same distribution as training,
  OOD for unseen catalyst compositions. Splits consist of both adsorbate+slab (adslabs) and slab systems.
  Validation and test splits are similar in size with exclusive compositions. Task Adslabs Train Slabs

  to insure size invaraince, as detailed by Batzner, et al.76,77 Evaluation Metrics All our tasks use
  the same evaluation metrics proposed by OC20. The only diﬀerence is rather than ground truth values
  being DFT adsorption energies, we use DFT total energies for OC22. We brieﬂy mention the metrics below
  but refer readers to the OC20 manuscript8 for a more detailed description. S2EF-Total : The S2EF-Total
  task uses the same metrics as the OC20 S2EF task. Metrics include Energy Mean Absolute Error (MAE),
  Force MAE, Force cosine, and Energy and Forces within Threshold (EFwT). Ground truth targets correspond
  to DFT total energy and per-atom forces. 10 IS2RE-Total : Similarly, IS2RE-Total uses the same metrics
  as the OC20 IS2RE task. Metrics include Energy MAE and Energy within Threshold (EwT). Ground truth targets
  correspond to the DFT total energy of the relaxed structure. IS2RS : IS2RS metrics here are identical
  to that of OC20. Metrics include Average Distance within Threshold (ADwT), Force below Threshold (FbT),
  and Average Force below Threshold (AFbT). Ground truth targets are the relaxed structure. DFT is also
  used to evaluate predicted relaxed structures. Consistent with OC20, our evaluation metrics still focus

quote_extract: 'ently lacks suﬃcient training data is oxides, which are critical for the development of
  Oxygen Evolution Reaction (OER) catalysts. To address this, we developed the Open Catalyst 2022 (OC22)
  dataset, consisting of 62,331 Density Functional Theory (DFT) relaxations (∼9,854,504 single point calculations)
  across a range of oxide materials, coverages, and adsorbates. We deﬁne generalized total energy tasks
  that enable property prediction beyond adsorption energies … important OER scaling relationships. We
  expect OC22 to provide an important benchmark for models seeking to incorporate intricate long-range
  electrostatic and magnetic interactions in oxide surfaces. Dataset and baseline models are open sourced,
  and a public leaderboard is available to encourage continued community developments on the total energy
  tasks and data. Keywords Catalysis, oxides, renewable energy, datasets, machine learning, graph convolutions,
  force ﬁeld 1 Introduction Advances are needed in technologies to produce, store, and use low-carbon-inte

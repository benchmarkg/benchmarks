quote_extract: 'Motivated by the limitations of existing multi-view stereo benchmarks, we present a novel
  dataset for this task. … We make our datasets and an online evaluation server available … together with
  a website for evaluating novel algorithms on a hold out test set, … While our benchmark focuses on evaluating
  both binocular stereo and MVS, theirs jointly evaluates Structure-from-Motion (SfM) and MVS. … In contrast,
  our videos were captured with cameras commonly used for mobile robotics and always use autoexposure.
  Thus, both benchmarks complement each other. … We recorded the ground truth scene geometry with a Faro
  Focus X 330 laser scanner. … Our benchmark consists of three scenarios corresponding to different tasks
  for (multi-view) stereo algorithms: … Both multi-view stereo scenarios are evaluated in 3D with the
  same evaluation protocol, while the two-view stereo scenario is evaluated in 2D with a separate protocol,
  … Only laser scan points visible in at least two images are used for evaluation. … Both measures are
  evaluated over a range of distance thresholds from 1cm to 50cm. … an adversary could uniformly … We
  thus discretized the space into voxels with small side length. … we use the F1 score as a single measure
  to rank the results. … For this scenario, we evaluate the same metrics used in the Middlebury benchmark
  [32]: … For this scenario, we evaluate the popular patch-based PMVS [4], Gipuma [5], … The latter is
  especially important given the popularity of learning-based methods: … performs below average on our
  benchmark while outperforming all other methods … This project was partially funded by Google Tango.'

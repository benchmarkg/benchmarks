  backend for even faster parallel simulation on compatible GPUs. **LocoMuJoCo** is an **imitation learning
  benchmark** specifically designed for **whole-body control**. It features a diverse set of environments,
  including **quadrupeds**, **humanoids**, and **(musculo-)skeletal human mode … r humanoid). Although
  primarily focused on imitation learning, LocoMuJoCo also supports custom reward function classes, making
  it suitable for pure reinforcement learning as well. ### Key Advantages ✅ Supports **MuJoCo** (single
  environment) and **MJX/MJWarp** (parallel environments) \ ✅ Includes **12 humanoid and 4 quadruped environments**,
  featuring 4 **biomechanical human models** \ ✅ Clean single-file JAX algorithms for quick benchmarking
  (**PPO**, **GAIL**, **AMP**, **DeepMimic**)\ ✅ Combined training and environment into one JIT‑compiled
  function for lightning‑fast training 🚀 \ ✅ **Over 22,000 motion capture datasets** (AMASS, LAFAN1, native
  LocoMuJoCo) retargeted for each humanoid \ ✅ **Robot-to-robot retargeting** allows to retarget any existing
  dataset from one robot to another \ ✅ Powerful **trajectory comparison metrics** including dynamic time
  warping and discrete Fréchet distance, all in JAX \ ✅ Interface for Gymnasium \ ✅ Built-in **domain

quote_extract: "tion Challenge 2021 2020 2019 2018 2017 2016 Browse VQA v2 VQA v1 Visualize Workshop 2021
  2020 2019 2018 2017 2016 Sponsors Terms External Results Format Overview This page describes the results
  format used by the VQA evaluation code. Results Format results = [result] result{ \"question_id\": int,
  \"answer\": str } We have provided an example result JSON file here. Evaluation Code We introduce a
  new evaluation metric which is robust to inter-human variability in phrasing the answers: In order to
  be consistent with ‘human accuracies’, machine accuracies are averaged over all 10 choose 9 sets of
  human annotators. Before evaluating machine generated answers, we do the following processing: Making
  all characters lowercase Removing periods except if it occurs as decimal Converting number words to
  digits Removing articles (a, an, the) Adding apostrophe if a contraction is missing it (e.g., convert
  \"dont\" to \"don't\") Replacing all punctuation (except apostrophe and colon) with a space character.
  We do not remove apostrophe because it can incorrectly change possessives to plural, e"

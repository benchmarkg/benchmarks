quote_extract: 'for Quantum Information and Matter, California Institute of Technology, Pasadena, CA,
  USA Abstract Learn2Design is a competition on the automated design of highly sensitive gravitational-wave
  detectors under realistic experimental constraints. Participants submit optimization algorithms, not
  fixed designs: given a detector topology, each alg … s must be chosen jointly (Fig. 1). The central
  question addressed by this competition is therefore: Can machine learning algorithms discover experimental
  designs that go beyond human intuition, while remaining physically meaningful and experimentally constrained?
  We study this question in the concrete setting of interferometric gravitational-wave detectors. Gra
  … e design of gravitational-wave detectors is a natural benchmark for AI-driven scientific discovery.
  An interferometric detector can be represented as a graph-like optical experiment: nodes are optical
  components such as mirrors, beam splitters, lasers, detectors, isolators, and qu … to a differentiable
  utility function and a large corpus of pre-computed evaluations are available, allowing classical optimizers
  such as Adam, BFGS, and Bayesian optimization to compete directly with amortized methods such as prior-fitted
  networks. 1.2 Novelty Learn2Design is an entirely new competition and is not a continuation of any previously
  accepted NeurIPS competition or recurring benchmark series. To the best of our knowledge, no previous
  NeurIPS competition has evaluated algorithms for the desi … Differometor and Finesse. Precomputed design
  corpus. In addition to the simulator, we will release approximately 30,000 high-quality detector designs
  discovered during a six-month EuroHPC compute campaign using approximately 360,000 GPU-hours. These

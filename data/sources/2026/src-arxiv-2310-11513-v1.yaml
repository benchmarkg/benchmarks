  scores on a per-object basis. Furthermore, each component of our framework can be independently upgraded
  as better models are developed. 3 GENEVAL: Our object-focused evaluation framework 3.1 Setup In order
  to produce a fine-grained verification of how well a generated image matches the description provided
  in the text prompt, we break the prompt down into the types of objects, their properties (such as color
  and number), and their relations to other objects (such as relative position). Text-to-image tasks.
  We focus on 6 different tasks of varying difficulty requiring various compositional skills, enumerated
  along with their prompts in Table 1. Here, we briefly summarize each task. • single object: rendering
  the specified type of object. This is the simplest task, and is trivial for the modern T2I models we
  test. • two object: rendering two different objects. This can be challenging in and of itself, as our
  benchmark results show (Table 2), and also serves as a base for more complex tasks like position and
  attribute binding. • counting: rendering a specific number of one type of object. T2I models may struggle
  with this task, even for a small number of objects. • colors: rendering an object with a specific color.
  We show that this can be verified reliably with a zero-shot image classifier by masking out the background.
  • position: rendering two objects with specified positions relative to each other. Spatial understanding
  has been found by prior works to be challenging for T2I models [14, 9]; our findings show this is still
  true. • attribute binding: rendering two different objects with two different colors. Prior works qualitatively
  observe that binding attributes like color to their respective objects is difficult for T2I models,
  often resulting in swapping (when the colors of two objects are swapped) or leakage (when the color
  instead appears on background objects) [13]. Prompt generation. All our text prompts are generated from
  task-specific templates filled in with randomly sampled object names, colors, numbers, and relative
  positions. Object names are drawn from the 80 MS COCO [23] class names, with some classes renamed to
  remove ambiguity, e.g., 4 Task Single object Description One object # Prompts Template 80 “a photo of
  a/an [OBJECT]” Two object Two different objects 99 “a photo of a/an … the position task, the relative
  position is one of “above”, “below”, “to the left of”, or “to the right of”. 3.2 Evaluation framework
  Object detection. For object detection and instance segmentation, we choose the best instance segmentation
  model available from the MMDetection toolbox [5], a Mask2Former [7] trained on MS COCO. For each image,
  we extract all detected objects above the default confidence threshold of 0.3. We find that when multiple
  objects of the same type are in an image (specifically, for the counting task), the detector tends to
  detect an excessive number of low confidence bounding boxes. To alleviate this, we raise the minimum
  confidence threshold to 0.9 for the counting task only. We also confirm that further pre-processing
  such as non-maximal suppression does not improve object detector performance in these cases. Specific
  details on hyperparameter decisions are provided in … he prompt only asks for the specified objects
  to exist. For the counting task, we further verify that the number of detected objects matches the number
  specified in the prompt. For the position task, we use the 2D coordinates of the detected bounding box
  centroids to compute relative position. We find that T2I models often generate overlapping objects;
  thus, we set a minimum distance along each axis (proportional to the bounding box dimensions) after
  which the objects will be classified as “left”, “right”, “above”, or “below” one another. Color classification.
  For the colors and attribute binding tasks, we use the CLIP ViT-L/14 model [31] to classify object color.
  For each object, using the information from the object detector, the image is cropped to the bounding
  box of the object. The segmentation mask is used to replace the background pixels with a solid gr …
  photo of a [COLOR] [OBJECT]” with all of the different candidate colors. We find that image cropping
  and background masking greatly improve the performance of the color classification model. Scoring. For
  each image, the GENEVAL score is a binary classification of image correctness: whether all elements
  specified in the prompt were correctly rendered in the image. This score is averaged across all images
  generated for each task to obtain task-specific scores, and then averaged across the six tasks to produce
  an overall score for a given T2I model. If an image is incorrect, the framework also produces a description
  of how the image deviates from the expectation: whether required objects are missing, or how the computed

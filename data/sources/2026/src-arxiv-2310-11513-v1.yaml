  between GENEVAL and CLIPScore. CLIPScore returns a scalar value indicating image-text alignment, whereas
  GENEVAL breaks the prompt down into correct and incorrect elements before producing a final binary score.
  Compared to CLIPScore, GENEVAL obtains higher agreement with human judgment on complex compositional

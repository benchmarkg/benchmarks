  quality or image-text alignment, and are unsuited for fine-grained or instancelevel analysis. In this
  paper, we introduce GENEVAL, an object-focused framework to evaluate compositional image properties
  such as object co-occurrence, position, count, and color. We show that current object detection models
  can be leveraged to evaluate text-to-image models on a variety of generation tasks with strong human
  agreement, and that other discriminative vision mode … ations and attribute binding. Finally, we demonstrate
  how GENEVAL might be used to help discover existing failure modes, in order to inform development of
  the next generation of text-to-image models. Our code to run the GENEVAL framework is publicly available
  at https://github.com/djghosh13/geneval. 1 Introduction Text-to-image (T2I) models have exploded in
  popularity in recent years. After the introduction of DALL-E [33], breakthroughs in diffusion models
  q … adequate. This raises the need for reliable, automated evaluation methods. However, traditional
  automated evaluation methods cannot analyze compositional capabilities and lack fine-grained reporting.
  Metrics such as the Frechet Inception Distance [16] solely evaluate image quality without taking the
  prompt into account. Other common metrics such as CLIPScore [15] rely 1https://huggingface.co/models
  a photo of a [purple ] [backpack ] and a [white ] [umbrella ] a photo of a [purple ] [backpack ] and
  a [white ] [umbrel … n judgment on complex tasks, as our experiments show. In light of this, we propose
  GENEVAL, an automated object-focused framework for evaluating T2I model capabilities on structured tasks
  (Figure 1). GENEVAL centers around the use of an object detection model, which verifies that the generated
  image contains the objects specified in the text prompt. The bounding box information and segmentation
  masks returned by the model are used to verify properties specified in the prompt, such as counting
  and relative positioning between objects. This metad … rmation about T2I model capabilities. We verify
  that our evaluation framework aligns with human judgment through a human evaluation study of 6,000 fine-grained
  annotations over 1,200 images. Overall, GENEVAL attains 83% agreement with annotators about the correctness
  of generated images, compared to the interannotator agreement of 88%. This agreement rate is boosted
  to 91% on images that annotators unanimously agree on, showing that our evaluation framework is highly
  reliable and aligns with human judgment. We also find that GENEVAL obtains significantly greater human
  agreement than the CLIPScore image-text alignment metric on complex tasks that involve more compositional
  reasoning. We then evaluate several popular open-source T2I image models using our GENEVAL framework.
  Our experiments show that the new IF model [11], with a larger text encoder and pixel-space diffusion,
  outperforms prior Stable Diffusion models [36], with IF-XL correctly generating 61% of images over 50%
  from Stable Diffusion v2.1. The most recent Stable Diffusion XL [30], with various architecture and
  training changes, beats v2.1 on certain tasks like depicting multiple objects but fails to improve at
  counting. Increasing mod … ve positioning and attribute binding—with the best model generating only
  15% and 35% of images correctly, respectively—showing there is still much progress to be made in text-guided
  image generation. This supports prior claims that spatial reasoning and attribute binding are difficult
  for T2I models [9, 13, 14]. However, we demonstrate how the fine-grained nature of GENEVAL can inform
  development of new models by uncovering failure modes and patterns in current image generation. In summary,

  while CLIPScore obtains 87% overall agreement. 5 Benchmarking progress in recent T2I models 5.1 Experiments
  Models. We evaluate a variety of open-source text-to-image models. This includes all versions of Stable
  Diffusion (SD) v1 and v2 [36], the recently released SD XL model, the IF pixel-space diffusion models
  from DeepFloyd [11], and the older model minDALL-E [22, 10], inspired by the original DALL-E model.
  In our primary results, we display only the latest or largest variant of each model, namely, IF-XL,
  SDv2.1, SDv1.5, and SD-XL 1.0. We also compare these models against a baseline of real images from LAION-5B
  [39], selected using CLIP ViT-L/14 image retrieval [3]. Further details are provided in Appendix C.
  Image generation. We evaluate the models on a set of 553 prompts spanning all six tasks enumerated in
  Table 1. For each prompt, we generate 4 images, and the GENEVAL score is averaged over all generated
  images. This choice is motivated by current text-to-image APIs like DALL-E 2 [1] and Midjourney [2],
  which generate 4 images for a prompt to allow the user more choice. Other parameters, such as image
  resolution, sampling steps, and sampling method, are left at their default values for each model. 7

quote_extract: "RoboTHOR Challenge 2020 Demo iTHOR ManipulaTHOR RoboTHOR Publications Challenges GitHub
  NEW Big News! We've announced ProcTHOR RoboTHOR Challenge 2020 Held in conjunction with the CVPR 2020
  Embodied AI Workshop COVID-19 Update The RoboTHOR challenge at CVPR 2020 involves deploying navigation
  models onto the LoCoBot and running it through the physical RoboTHOR environment. This physical environment
  is located at the Allen Institute for AI (AI2) offices in Seattle. Due to the COVID-19 situation, all
  employees of AI2 are currently working from home and will be doing so for the foreseeable future. This
  prevents us from running experiments in the physical robot. As a result, the RoboTHOR challenge at CVPR
  2020 will only involve simulated scenes. The final winners will be chosen based on performance in the
  simulated scenes in the Test-Challenge set. The component of the RoboTHOR challenge involving the physical
  robot will be held at a later date, to be determined as we get more clarity on the COVID-19 stay at
  home order. We wish you all the best of health, through this challenging time. For decades, the AI community
  has sought to create perceptive agents that can augment human capabilities in real world tasks. The
  widespread availability of large and open, computer … n this direction. This has led to progress on
  a variety of tasks in simulation, including visual navigation and instruction following. But the elephant
  in the room remains: How well do these models trained in simulation generalize to the real world? The
  RoboTHOR challenge is an embodied AI challenge focused on the problem of simulation-to-real transfer.
  The goals of the challenge are to encourage researchers to work on this important problem, to create
  a unified benchmark and track progress over time. Task The RoboTHOR Challenge 2020 deals with the task
  of Visual Semantic Navigation. An agent start … world. This is similar to a practitioner improving their
  model, while having access to a development set of data. Participants will upload their models via EvalAI.
  These models will be evaluated on the Test-Dev-Simulation apartments. In this phase, the top 5 entries
  each week as per the simulation leaderboard will be evaluated on the Test-Dev-Real environment, that
  consists of a LocoBot navigating in RoboTHOR apartments built at the AI2 office in Seattle. Teams will
  gain access to the results of their model as well as metadata such as images observed, actions taken
  by the agent and a video feed, which should help them create improved models. Phase 3: Test-Challenge
  (in Reality) The top 3 entries as per the Test-Dev-Real leaderboard will be evaluated on the Test-Challenge-Real
  apartments. These apartments will have different layouts, object instances and object configurations
  compared to the Train, Val and Test-Dev apartments. Final results will be posted on this website. Timeline
  Simulation Training and Validation Data Released Feb 11, 2020 Simulation Test-Dev evaluation opens on
  Eval AI March 15, 2020 Test-Dev Phase April 1, 2020 - June 8, 2020 Test-Challenge Phase June 2, 2020
  - June 12, 2020 Evaluation The evaluation metric used is Success weighted by (normalized inverse) Path
  Lengt"

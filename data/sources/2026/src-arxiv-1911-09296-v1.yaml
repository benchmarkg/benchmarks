  conditions. Furthermore, we created and executed a rigorous, repeatable, and veriﬁable annotation process
  that ensured high-quality annotations with supporting quality control from experts. The xBD dataset
  is used by the xView 2 prize challenge, which aims to spur the creation of accurate and efﬁcient machine
  learning models that assess building damage from pre- and post-disaster satellite imagery. In the rest
  of this paper, we go into details … n levels of damage are often visually minute. To facilitate the
  labeling of these types of damage, supporting imagery must be of high ﬁdelity and have enough discerning
  visual cues. We targeted satellite imagery to be below a 0.8 meter ground sample distance (GSD) mark
  to fulﬁll this requirement. 3.3. Diversity of Disasters One goal of the xView 2 prize challenge is to
  output models that are widely applicable across a large number of disasters. This will enable multiple
  disaster res … sfer capability of labels across datasets. We present the Joint Damage Scale (Table 4)
  for the assessment of building damage from satellite imagery across multiple disaster types. The Joint
  Damage Scale is created with insight from NASA, CAL FIRE, FEMA, and the California Air National Guard.
  Furthermore, the Joint Damage Scale is grounded in existing literature, such as HAZUS [6], FEMA’s Damage
  Assessment Operations Manual [5], the Kelman scale [15], and the EMS-98 scale [12]. This scale is not
  meant as an … as a ﬁrst attempt to create a uniﬁed assessment scale for building damage in satellite
  imagery across multiple disaster types, structure categories, and geographical locations. The Joint
  Damage Scale ranges from no damage (0) to destroyed (3). After multiple iterations with analysts, this
  level of granularity was chosen as an ideal trade-off between utility and ease of annotation. The descriptions
  of each damage level have been generalized to handle the wide variety of disasters present in xBD, which
  can result in some amount of label noise. Although such nuance is not ideal from an objective assessment
  standpoint, it allows analysts to gracefully handle tough cases that fall between classiﬁcation boundaries.
  Due to the limitations presented by the modality o … types and disasters represented in xBD around the
  world. Figure 4: Joint Damage Scale descriptions on a four-level granularity scheme. 5. Dataset Collection
  5.1. Imagery Source Imagery for xBD was sourced from the Maxar/DigitalGlobe Open Data Program1, which
  releases imagery for sudden onset major crisis events. Speciﬁcally, the Open Data Program was chosen
  for its availability of high-resolution imagery from many disparate regions of the world. Of the multitude
  of open data events that are currently available in the Open Data Program’s catalog, we selected 11
  disaster events from an initial list of 19. These 11 events are dubbed “Tier 1” events. In addition
  to the Tier 1 events, we identiﬁed 8 additional events that 1https://www.digitalglobe.com/ecosystem/open-data
  were not a part of the Open Data Program, which we dubbed “Tier 3” events. We partnered with Maxar and
  the National Geospatial-Intelligence Agency to activate speciﬁc areas of interest (AOIs) from Tier 3
  for inclusion in the Open Data Program. A list of these events is provided in Table 1. All imagery is
  available in three-band RGB formats. 5.2. Annotation Process Annotation followed a multi-step process
  that created polygons and damage classiﬁcations with a web-based annotation tool that was developed
  in-house by CrowdAI. 5.2.1 Triage Of the imagery provided by the Open Data Program, only a small amount
  contained actual instances of damage. To reduce the amount of wasted annotation time, we manually reviewed

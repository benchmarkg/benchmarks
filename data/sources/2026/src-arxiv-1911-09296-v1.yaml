  and lava. Flood water was interpreted as water visible in an area where it is not normally expected
  to be present. This means areas of “known water,” such as rivers, lakes, and ponds, were excluded. Table
  1 shows which disasters included detectable environmental factors. 5.3. Design Trade-Offs Due to various
  issues with edge cases in classifying damag … not reported in the Open Data Program metadata. The ﬁnal
  imagery GSD can be estimated using various methods in the GDAL [10] toolkit. 6. Dataset Analysis The
  complete xBD dataset contains satellite images from 19 different natural disasters across 22,068 images
  and contains 850,736 building polygons. The imagery covers a total of 45,361.79 km2. 6.1. Dataset Split
  xBD is provided in train, test, and holdout splits in a 80/10/10% split ratio, respectively. The speciﬁc
  split counts are provided in Table 2. Compared to traditional train/validation/test splits, this dataset
  splitting strategy is meant to facilitate the xView 2 challenge. Participants can split the provided
  training dataset into a validation set. The test set is meant to be used as a ﬁxed evaluation set during
  the open leaderboard phase of the challenge. The holdout set is purposefully not released during the
  duration of the challenge and is meant to be used as a private evaluation set to counter any challenge-speciﬁc
  gaming. All dataset splits will be made available at the end of the xView 2 challenge. Split Train Test
  Holdout Images 18,336 1,866 1,866 Polygons 632,228 109,724 108,784 Table 2: xBD data splits and their
  respective annotation counts. 6.2. Dataset Statistics Disaster events are unevenly represented with
  regards to their total imagery area in xBD. Figure 6 shows the distribution of areas covered from each
  disaster. … rds “no damage,” which had more than eight times the representation of the other classes.
  “No damage,” “minor damage,” “major damage,” and “destroyed” are composed of 313,033, 36,860, 29,904,
  and 31,560 polygons respectively. There are an additional 14,011 polygons labeled as “unclassiﬁed.”
  Figure 9 breaks this difference down visually. Figure 9: Distribution of damage class labels. Figure
  7: Positive and negative imagery per disaster. Figure 8: Polygons in xBD per disaster event. xBD presents
  an interesting challenge for the computer vision community because the distribution of labels and types
  of disasters is highly unbalanced. Furthermore, the visual cues that differentiate the different levels
  of damage can be minute. The varying availability of negative imagery for dif- ferent types of disasters
  can also be a hurdle for localization models. 7. Baseline Model Baseline lo … n altered U-Net architecture
  [18]. We lightly modiﬁed this model to ﬁt our dataset. The model was trained on an eight GPU cluster
  for seven days. The model achieved an IoU of 0.97 and 0.66 for “background” and “building,” respectively.
  7.2. Classiﬁcation The classiﬁcation model is shown in Figure 10. The ResNet50 is pre-trained on ImageNet
  [4] whereas the smaller side network is initialized with random weights. All convolutional layers use
  a ReLU activation. The output is a one-hot encoded vector where each element represents the probability
  of an ordinal class. The model uses an ordinal cr … d passed into dense layers for classiﬁcation. for
  training. The network was trained for 100 epochs on 8 Nvidia GTX-1080 GPUs. 7.4. Evaluation The weighted
  F1 score was the primary metric for evaluating the dataset. Weighted F1 balances precision and recall
  in a harmonic mean and is well-suited for imbalanced datasets such as xBD. Accuracy by itself is a ﬂawed
  metric, since a classiﬁer that predicted “no damage” on all of the images would retain 75% accuracy.
  For the baseline model, we attained an overall weighted F1 score of 0.2654. Table 3 breaks down F1 score

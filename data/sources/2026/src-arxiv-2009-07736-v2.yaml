quote_extract: 2 [cs.CV] 29 Sep 2020 Abstract Multi-Object Tracking (MOT) has been notoriously
  diﬃcult to evaluate. Previous metrics overemphasize the importance of either detection or
  association. To address this, we present a novel MOT evaluation metric, HOTA (Higher Order
  Tracking Accuracy), which explicitly balances the eﬀect of performing accurate detection,
  association and localization into a single uniﬁed metric for comparing trackers. HOTA decomposes
  into a family of sub-metrics wh … size the eﬀect of accurate detection and association
  respectively. HOTA balances both of these by being an explicit combination of a detection score
  DetA and an association score AssA. 1 Introduction Multi-Object Tracking (MOT) is the task of
  detecting the presence of multiple objects in video, and associating these detections over time
  according to object identities. The MOT task is one of the key pillars of computer vision
  research, and is essential for many scene understanding tasks such as surveillance, robotics or

quote_extract: "# Architecture Harvey Labs is a filesystem-first benchmark harness. There is no database
  and no web service: tasks live under `tasks/`, runs live under `results/`, and reports are generated
  as static HTML. The system has three phases: 1. **Run**: an agent reads a synthetic matter file and
  writes deliverables. 2. **Evaluate**: an LLM judge grades the deliverables against rubric criteria.
  3. **Report**: the evaluator writes per-run reports and comparison dashboards. ```text tasks/**/task.json
  + documents/ … key-terms/scenario-01 ``` Important `task.json` fields: | Field | Purpose | |---|---|
  | `title` | Human-readable task title | | `instructions` | Directional prompt sent to the agent | |
  `work_type` | `analyze`, `draft`, `review`, or `research` | | `deliverables` | Expected output filenames
  | | `criteria` | Inline pass/fail rubric criteria | | `tags` | Discovery and analysis metadata | ---
  ## Harness Entry point: ```bash uv run python -m la … erflow`) along with `finish_summary` and `finish_called`.
  `finished_cleanly` is true for the first two reasons. Pass `--no-enable-finish` to drop the tool and
  its system-prompt guidance. --- ## Tools The agent has six closed-workspace tools plus an explicit completion
  signal: | Tool | Purpose | |---|---| | `bash` | Execute shell commands inside the run workspace with
  `WORKSPACE_DIR`, `DOCUMENTS_DIR`, and `OUTPUT_DIR` set | | `read` | Read `.docx`, `.xlsx`, `.pptx`,
  `.pdf … t turn in `transcript.jsonl` records the provider's `finish_reason`, `stop_reason`, and `incomplete_details`.
  Provider values are retained without mapping them to a shared enum. --- ## Security Model Every agent
  run executes inside a per-task Podman sandbox (`--network=none --cap-drop=ALL`, writable `/workspace`
  with read-only `/workspace/documents` and writable `/workspace/output` overlaying it). All six workspace
  tools — `bash`, `read`, `write`, `edit … run-id \\ --task ``` `lab_core/evaluation/run_eval.py`: - Resolves
  the task directory under `tasks/`. - Loads and validates `task.json`. - Calls `score_rubric()` in `lab_core/evaluation/scoring.py`.
  - By default, grades independently with Sonnet 4.6 and GPT-5.5, preserves per-judge files, and writes
  `scores_dual.json` only when both complete. - With `--judges MODEL`, uses one judge and writes `scores.json`.
  - With `--judges MODEL1 MODEL2`, averages a custom"

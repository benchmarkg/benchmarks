quote_extract: 'overlapping speech from a range of conversational domains, while being resilient to variation
  in recording equipment, recording environment, reverberation, ambient noise, number of speakers, and
  speaker demographics. As with the NIST RT evaluations, DER is adopted as the primary evaluation metric,
  but without use of collars or exclusion of overlapping speech. There are no constraints on training
  data, with participants allowed to use any combination of public/proprietary data for system development.
  The initial DIHARD challenge (DIHARD I) [13] ran during the spring of 2018 and attracted registrations
  from 20 teams, of which 13 submitted systems. As expected, state-of-the-art systems performed poorly,
  with ﬁnal DER on the evaluation set for the top systems ranging from 23.73% [14] when provided with
  reference speech activity detection (SAD) marks to 35.51% [15 … h recording session and are responsible
  for producing their own speech segmentation. Together, this yields the following four evaluation tracks:
  • Track 1 – single channel audio using reference SAD • Track 2 – single channel audio using system SAD
  • Track 3 – multichannel audio using reference SAD • Track 4 – multichannel audio using system SAD All
  teams are required to register for at least one of track 1 or track 3. 3. Performance Metrics As in
  DIHARD I, the primary metric is DER [1], which is the sum of missed speech, false alarm speech, and
  speaker misclassiﬁcation error rates. Because systems are provided with the reference speech segmentation
  for tracks 1 and 3, for these tracks, it exclusively measures speaker misclassiﬁcation error. This is
  the metric used to rank systems on the leaderboard. For each system we also compute a secondary metric,
  Jaccard error rate (JER), which is newly developed for DIHARD II. JER is based on the Jaccard similarity
  index [19, 20], a metric commonly used to evaluate the output of image segmentation systems, which is
  deﬁned as the ratio between the sizes of the intersections and unions of two sets of segments. An optimal

quote_extract: 'benchmark it probably is). Thanks to Alex Ganose for pointing this out! Undiscovered lower
  energy and lower symmetry structures in the well-explored chemical systems covered by WBM and MP are
  not expected to be a common occurrence. Hence we believe this analysis still provides some useful insight.
  All plots/metrics below evaluate the quality of MLFF relaxations for the 257k crystal structures in
  the WBM test set. Not all models were able to relax all structures (user/cluster error may explain some
  failures) but every model was evaluated on at least 249k relaxations. Symmetry detection was performed
  with the excellent Rust library moyopy, a ~4x faster successor to spglib. Model RMSD ↓ Σ= 10-2 ↑ Σ↓

quote_extract: 'we trained and externally validated an AI system (developed within an international consortium)
  for detecting Gleason grade group 2 or greater cancers using a retrospective cohort of 10 207 MRI examinations
  from 9129 patients … we facilitated a multireader, multicase observer study with 62 radiologists (45
  centres in 20 countries … Histopathology and at least 3 years (median 5 [IQR 4–6] years) of follow-up
  were used to establish the reference standard. … The statistical analysis plan was prespecified with
  a primary hypothesis of non-inferiority (considering a margin of 0·05) … the AI system showed a statistically
  superior and non-inferior AUROC of 0·91 (95% CI 0·87–0·94; p<0·0001), in comparison to the pool of 62
  radiologists with an AUROC of 0·86 (0·83–0·89) … Algorithm developers and radiologists were invited
  to participate through referrals, outreach programmes of clinical and technical societies, presentations
  at conferences, and through an open call on the grand-challenge.org platform. … The PI-CAI challenge
  was hosted on the grand-challenge. org platform, where it will be continually hosted for at least 5
  years (ie, from May 5, 2022 until at least May 5, 2027). … For every examination, AI models were required
  to complete two tasks: localise and classify each lesion with clinically significant cancer (if any)
  using a 0–100 likelihood score and classify the overall case using a 0–100 likelihood score for clinically
  significant cancer diagnosis. … The hidden testing cohort included prostate MRI examinations from 1000
  patients across four centres, including 197 cases from an external unseen centre. … Once trained, these
  models were ensembled with equal weighting into a single AI system. … Each case was read in two sequential
  rounds, without a washout period in between. … Within the context of this study, only multiparametric
  MRI readings were considered for analysis … a total of 839 individuals (from 53 countries) opted-in
  to the development of the AI system and 293 AI algorithms were submitted … the top five highest performing
  algorithms were deep learning models developed by teams primarily based at the University of Sydney
  … 93·4% of all included MRI examinations were acquired from one MRI manufacturer … This study was funded
  by the European Commission (EU Horizon 2020: ProCAncer-I project) and Health~Holland (LSHM20103). …
  We thank the staff at Amazon SageMaker for their technical support in facilitating the study. … We have
  provided the means for independent researchers and developers to access the full sequestered training
  dataset of 9107 cases or benchmark their algorithms across the sequestered testing cohort of 1000 cases,
  in a fully masked, standardised manner with investigator support, on a per-application basis.'

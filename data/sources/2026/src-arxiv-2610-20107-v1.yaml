quote_extract: 'leaves the writing of new text to the generator. A confidence cascade executes the heads’
  action when they are sure and otherwise lets the generator decode from the KV cache of the same forward
  pass. With Qwen3-VL 4B and 8B generators trained on 213k web steps, a strict threshold keeps the cascade
  between 0.3 points below and 1.4 points above the generator on seven offline test sets while the heads
  decide 12 to 64% of the steps. A looser threshold raises step success on unseen Mind2Web websites by
  3.1 and 1.8 points, costs up to 2 points on GUIAct and MiniWoB++, and lifts WebArena task success from
  12.5 to 13.8% (4B) and from 13.6 to 14.6% (8B) with less than half of the generated tokens. Training
  the heads join … ction of the language model. They train for one epoch on 213k steps that we convert
  into the format of Section 3.1: successful MiniWoB++ episodes on training seeds (9.2k steps, repeated
  three times), the Multimodal-Mind2Web training split (Deng et al., 2023; Zheng et al., 2024) (7.3k),
  GUIAct web single and multi step tasks (Chen et al., 2025) with scroll and answer steps (94k), web grounding
  data from UGround (Gou et al., 2025) (65k) and WebLINX demonstrations (Lù et al., 2024) ( … nue for
  three epochs on steps that we replay in the live sites from successful expert trajectories on 115 training
  tasks disjoint from the test tasks (Appendix C). 4.2 Benchmarks and Metrics Offline. We use the three
  Multimodal-Mind2Web (M2W) test splits, cross-task, cross-website and cross-domain, whose tasks, websites
  or domains are unseen in training, and the GUIAct web test sets for single and multi step tasks together
  with their extended versions (ext.) that add scroll and answer steps. For each M2W step we cut a 1280
  × 1000 window at a random height that keeps the gold element visible and draw up to 64 candidates: the
  gold element, the other positive candidates and random negatives. GUIAct steps likewise show the target
  and up to 63 other elements. This gives 1,253, 973 and 3,820 M2W steps and 1,089, 421, 1,410 and 854
  GUIAct steps; Section 5.4 also counts, as failures, the 372 M2W steps whose gold element cannot be shown.
  A step succeeds when the chosen box is a gold box and the operation, including any text, matches. Online.
  MiniWoB++ runs all 119 tasks with five seeds each through BrowserGym (Chezelles et al., 2024), at most

quote_extract: 'every request would avoid violating responses without being useful. How a Safety run works
  Prompts. The system answers each of the 3,900 Practice prompts or the 3,900 Official test prompts, one
  prompt and one response at a time. Judgment. The automated evaluator scores each response on two separate
  questions from the latest As … about the reference set as part of our benchmark stewardship program.
  Official and Practice results Official result: a result produced with the confidential official prompts,
  in a public benchmark round run by MLCommons or in an Official run in Candela, which may be published
  under the AILuminate Benchmark Use & Messaging Policy. Practice result: a result produced with practice
  prompts, for internal use only – directional results for improving AI system reliability.. Every published
  Official Safety result … published [date]”. See How to talk about AILuminate results for more information.
  Test your system Candela, MLCommons’ benchmarking service, runs Safety on demand against your exact
  AI system, as configured and deployed, including its system prompt, guardrails, and retrieval. Run Practice
  tests while you iterate, then an Official test when you want a result you can publish and cite. Go to
  Candela → Papers and documentation The AILuminate Assessment Standard v1.4 AILuminate: Introd'

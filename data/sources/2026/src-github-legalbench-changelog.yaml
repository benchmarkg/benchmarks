quote_extract: '# Changelog This file tracks all changes and updates to LegalBench data. ## March 29,
  2026 ### MAUD passage mismatches (7 tasks) The ~40 MAUD tasks in LegalBench are derived from the [Atticus
  Project MAUD dataset](https://zenodo.org/records/6553578), which contains merger agreement excerpts
  annotated with answers to 92 legal questions. Each LegalBench MAUD task corresponds to one MAUD question:
  the model reads a merger agreement passage and selects the best answer from a set of multiple-choice
  options. We identified 7 tasks where passages were incorrectly assigned to the wrong MAUD questions
  during the original dataset construction. We re-extracted the correct passages from the raw MAUD train/dev/test
  CSVs, filtering to `data_type="main"` and mapping each MAUD answer to the corresponding LegalBench option
  letter. The affected tasks are: - `maud_knowledge_definition` - `maud_lia … wer` - `maud_intervening_event_-_required_to_occur_after_signing_-_answer`
  - `maud_definition_includes_stock_deals` - `maud_definition_includes_asset_deals` - `maud_accuracy_of_target_capitalization_rw_(outstanding_shares)_bringdown_standard_answer`
  ### OPP-115 segment upgrade (all 9 tasks) The 9 OPP-115 tasks are derived from the [OPP-115 corpus](https://usableprivacy.org/data),
  which contains 115 website privacy policies with expert annotations. Each policy is divided into segments
  (delimited by `|||` in the source HTML), and annotat … ers, providing sufficient context for the classification
  task. A segment is labeled "Yes" for a category if any annotation of that category falls within it,
  and "No" if it has annotations for other (non-Other) categories but not the target category. Test sets
  are class-balanced by downsampling the majority class. The affected tasks are: - `opp115_data_retention`
  - `opp115_data_security` - `opp115_do_not_track` - `opp115_first_party_collection_use` - `opp115_international_and_specific_audiences`
  - `opp115_policy_change` - `opp115_third_party_sharing_collection` - `opp115_user_access,_edit_and_deletion`
  - `opp115_user_choice_control` ## June 30, 2024 - We have removed the `train.tsv` files for `scalr`
  and `rule_qa`. Both these tasks were intended to be zero-shot and hence have no samples in their `train.tsv`
  files. We have removed these files to avoid any confusion. - We noticed an error in `unfair_tos` whereby
  labels were not correctly assigned for some samples. We have fixed this issue and uploaded a new version
  of the data with corrected labels.'

quote_extract: 'Challenge #8 Announcement DREAM x CACHE Target 2035 Challenge Publications Contact Challenge
  #8 Click image to enlarge Finding Ligands Targeting GID4 The eighth CACHE challenge is focused on GID4,
  the substrate-binding unit of the CTLH ubiquitin ligase complex. Compounds binding GID4 can lead to
  targeted protein degradation strategies that highjack CTLH E3 ligase activity for therapeutic applications
  across … CCT and by a potent and selective chemical probe in structure 7S (see Figure) CACHE will cover
  100% of the costs of testing compounds experimentally. 100% of the costs of procuring compounds (either
  make-on-demand or custom-synthesized compounds) will be covered by participants. To lower the costs,
  CACHE will agree with Enamine on a preferred bulk price. CACHE will cover 50% of the costs for eligible
  Canadian academics and Canadian SMEs through a Strategic Innovation Fund awarded to Conscience by the
  … this CACHE Challenge are subject to the CACHE Terms of Participation. Any questions pertaining to
  applications should be emailed to [email protected] Application opens 2026-02-17 Application closes

quote_extract: "discovery. We challenge you to predict MERS-CoV Mpro and SARS-CoV-2 Mpro poses using knowledge
  from the SARS-CoV-2 Mpro crystallography data that ASAP created. Duration: 2 monthsTrain size: 770Test
  size: 195 Ended over 1 year ago SummaryDataset Competition Hosts A Quick Links Tutorial Tags MERS-CoVSARS-CoV-2Mproligandposes
  Modalities MOLECULEMOLECULE_3DPROTEINPROTEIN_3D Details README This is the ligand pose challenge, part
  of the ASAP Discovery x OpenADMET challenge. Ligand Poses Since the rise of structure-informed drug
  discovery in the 1980s-1990s, structural biology is key to drug discovery. The structural effect of
  smal … experimental conditions (the right protein construct, buffer concentrations, etc) is extremly
  difficult even for the most experienced structural biology team. At ASAP, the SARS-CoV-2 Mpro program
  was structurally enabled from the start of the consortium, but the MERS-CoV Mpro program was not. This
  led to a delay in MERS-CoV Mpro potency even though the proteins are highly similar. We will challenge
  you to predict MERS-CoV Mpro poses using knowledge from the SARS-CoV-2 Mpro crystallography data that
  ASAP created. 📊 Data The training set w … quence str Primary structure of the protein's B chain, if
  any: A linear sequence of amino acids. CXSMILES str Text representation of the 2D molecular structure
  Complex Structure PDB (fastpdb.AtomArray) 3D system of the ligand bound to the protein, prepared using
  OESpruce and aligned to a reference Mpro Protein Structure PDB (fastpdb.AtomArray) 3D system of just
  the protein structure, prepared using OESpruce and aligned to a reference Mpro Ligand Pose SDF (rdkit.Chem.Mol)
  3D conformation of the molecule, bound to the protein Protein Label str Either SARS-CoV-2 Mpro or MERS-CoV
  Mpro At test time, we will only provide the Protein Label, Chain A Sequence,Chain B Sequence and CXSMILES.
  🧑‍💻 Get started We provide notebooks to get started with the challenge that cover several important
  topics, such as how to prepare your submission and the data format. Get started here. ✂️ Split We will
  provide training data on SARS CoV-2 Mpro, but participants are free to use any data in the public domain.
  The test set will be comprised of both MERS-CoV Mpro and SARS-CoV-2 Mpro structures ✅ Evaluation criteria
  The challenge will be judged based on the judging criteria outlined here. We will evaluate your submission
  using % of poses with a RMSD<2A compared to the crystallographic pose. You can enter as many times as
  desired, but we will only evaluate your last submission. In the open science spirit of ASAP Discovery
  we would love to see open … ssays and ultimately animal studies. User Attributes These are custom, user-defined
  attributes that are not required by the Polaris data model. Attribute Value Method X-ray crystallography"

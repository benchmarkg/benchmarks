quote_extract: "ad paper harbor Harbor The open source and research communities lack benchmarks for evaluating
  the reward hacking tendencies of agents. In this work, we provide a benchmark that reliably detects
  hacks across a wide variety of terminal tasks. Evaluation of Reward Hacking As agents grow more autonomous,
  they increasingly reward hack — satisfying the designer's intent only superficially, pr … 't always
  reflect what the agent actually did. Hack-Verifiable Terminal Bench We built Hack-Verifiable Terminal
  Bench (HVTB) toward closing this gap. Instead of judging behavior after the fact, we embed honeypots
  into real Terminal Bench tasks, so every hack is deterministically verifiable the moment it happens.
  Using HVTB, we analyze how frontier agents behave in these environments. Open-Sourcing Our Results We
  release all 89 hack-verifiable environments, to … the ground-truth solution and the held-out tests from
  the original task, along with a README.md ▸ stating that the directory should not be explored. This
  simulates a realistic failure mode, where the solution or tests were accidentally leaked, or the solution
  is available online, leaving them accessible to the agent. admin/README.md # Admin Directory This directory
  contains the reference solutions and test files used to validate benchmark tasks. * **Solution files**
  are provided to verify that the benchmark is functioning correctly and that each task is solvable. *
  **Test files** are executed … admin/ is caught by inotify filesystem watchers, installed by patching
  each task's Dockerfile. When the agent finishes, the verifier reads the flags. No LLM judge, no human
  inspection, no reliance on what the agent claims in its reasoning trace. A core principle in hack-verifiable
  environments is to build the hacks generically, so they can be tested across many environments. We utilize
  the structure of Harbor tasks: a single script automatically transforms any Harbor-format task into
  its hack-verifiable version. That is how all 89 HVTB environments were generated, and you can use the
  same script to wrap your own tasks. Evaluating Reward Hacking Using Hack-Ve … ion says don't read content,
  not don't run. But we should be careful. Hacks They Hide The hacks above announce themselves. gpt-5.6-sol's
  are quieter: its final reports never mention admin/ at all, and only the filesystem watchers give it
  away. Here is one run's internal deliberation, and everything it told the user afterwards: ▾gpt-5.6-sol
  · ablation · crack-7z-hash the silent hack (intern … In another run, it asked itself whether transparency
  is necessary, and decided it wasn't. This is exactly why judging reasoning traces is not enough: the
  story the agent tells can be spotless while the filesystem tells the truth. Even claude-opus-5, the
  most disclosure-prone model in our runs, can misnarrate its own actions. In this run, its command reads
  the entire admin/ di … rk for terminal agents, built on the hack-verifiable environments paradigm: plant
  the vulnerabilities, watch deterministically, and measure at scale. HVTB is one benchmark for one setting.
  Much more is needed toward the goal of developing reward hacking evaluations, and we hope the environments,
  traces, and tooling we release here help"

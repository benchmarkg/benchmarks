quote_extract: 'download the Public Training and Development Dataset, and in turn, they can start developing
  and training AI models using their private or public compute resources (e.g. Google Colaboratory, Kaggle).
  Each team can submit a single trained algorithm (in a Docker container) for evaluation every week (similar
  to the AIROGS, MIDOG2021 and CoNIC2022 challenges). During evaluation, algorithms are executed on the
  grand-challenge.org platform, their performance is estimated on the Hidden Tuning Cohort, and team rankings
  are updated accordingly on a live, public leaderboard. Facilitating validation in such a manner, ensures
  that any image used for evaluation remains truly unseen, and that AI predictions cannot be tampered
  with. At the end of this phase, each team can choose to submit a single AI algorithm (presumably their
  top-performing model) for evaluation on the Hidden Testing Cohort. Based on their performance on this
  cohort, all-new rankings will be drawn and the top 5 AI algorithms will be determined.¶ Closed Testing
  Phase (Duration: 4 months): Teams with the top 5 AI algorithm … llenge. Participants must prepare Docker
  containers of their AI algorithms that allow training, and subsequently, inference using the trained
  weights (similar to the STOIC2021 and NODE21 challenges). Organizers will retrain these models with
  large-scale data (public + sequestered training datasets), using their institutional compute resources.
  Once training is complete, performance will be re-evaluated on the Hidden Testing Cohort (with rigorous
  statistical analyses), and the top 3 winners of the PI-CAI challenge will be announced.¶ Rules: … ts.¶
  Members of sponsoring or organizing centers (i.e. Radboud University Medical Center, Ziekenhuis Groep
  Twente, University Medical Center Groningen, Norwegian University of Science and Technology) may participate
  in the challenge, but are not eligible for prizes or the final ranking in the Closed Testing Phase.¶
  This challenge only supports the submission of fully automated methods in Docker containers. It is not
  possible to submit semi-automated or interactive methods.¶ All Docker containers submitted to the challenge
  will be run in an offline setting (i.e. they will not have access to the internet … ubmitted containers
  apriori.¶ Participants competing for prizes can use pre-trained AI models based on computer vision and/or
  medical imaging datasets (e.g. ImageNet, Medical Segmentation Decathlon). They can also use external
  datasets to train their AI algorithms. However, such data and/or models must be published under a permissive
  license (within 3 months of the Open Development Phase deadline) to give all other participants a fair
  chance at competing on equal footing. They must also clearly state the use of external data in their
  sub … pean Radiology Experimental. DOI: 10.1186/s41747-022-00288-8¶ Researchers and companies, who are
  interested in benchmarking their institutional AI models or products, but not in competing for prizes,
  can freely use private or unpublished external datasets to train their AI algorithms. They must clearly
  state the use of external data in their submission, using the algorithm name [e.g. "Prostate AI Model
  (trained w/ private data)"], algorithm page and/or a supporting publication/URL. They are not obligated
  to publish their AI models and/or datasets, before or anytime after the submission.¶ To participate
  in the Closed Testing Phase as one of the top 5 teams, participants submit a short arXiv paper on their
  methodology (2–3 pages) and a public/private URL to their source code on GitHub (hosted with a permissive
  license). We take these measures to ensure credibility and reproducibility of all proposed solutions,
  and'

quote_extract: '# Basic RNA 3D structure comparison metrics used in RNA-Puzzles assessment. --- This git
  includes: * an RNA structure normalization tool used in RNA-Puzzles. * the RNA 3D structure comparison
  metrics used in RNA-Puzzles assessment, including RMSD (all-atom), P value, Interaction Network Fidelity
  and Deformation Index. ## Installation To install the package: `git clone https://github.com/RNA-Puzzles/RNA_assessment.git`
  `cd RNA_assessment` `python setup.py install` ## Dependency This package depends on `biopython`, `rna-tools`
  To install: `pip install biopython`， `pip install rna-tools`, OpenStructure for lDDT calculations. If
  need to calculate the Interaction Network Fidelity, it needs to call [`MC-annotate`](https://major.iric.ca/MajorLabEn/MC-Tools.html).
  Please download the binary execution from the website and coordinate the directory for it at the top
  line `MCAnnotate_bin=` of the mcannotate.py script. If need to calculate the Local … mic Rotationally
  Equivariant Scorer (ARES), it needs to call [ARES](https://www.science.org/doi/10.1126/science.abe5650
  ) If need to calculate the Clash score, it needs to call [MolProbity](http://molprobity.biochem.duke.edu/)
  # Repository Structure This repository contains the codes necessary to replicate all figures from Puzzles
  Round V. It includes: - `The figures_reproducibility.ipynb notebook` : this file can generate all the
  figures found in the Puzzles, with scores holding the original data for the figures. For details on
  how to generate data using various metrics, please refer'

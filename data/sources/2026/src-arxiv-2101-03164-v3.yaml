quote_extract: '. Again, it should be stressed that PaiNN and NewtonNet are lmax = 1-only versions of
  equivariant networks. The results for ACE, GAP, and ANI on the revised MD-17 data set are those reported
  in [43]. Importantly, we train and test separate NequIP models on both the original and the revised
  MD-17 data set, and ﬁnd that NequIP obtains signiﬁcantly lower energy errors on the revised data set,
  while the force accuracy is similar on the two data sets. In line with previous work [39], this suggests

quote_extract: "fe125-4aed-4f8c-8fe8-df4efb41a8ea) OpenCompass is a one-stop platform for large model
  evaluation. It supports a wide range of models from OpenAI, Anthropic, Gemini, Qwen, GLM, DeepSeek,
  and more, and integrates over 100 datasets covering knowledge, reasoning, coding, science, language,
  long context, safety, and other capability dimensions. OpenCompass also integrates VLMEvalKit, enabling
  text-only and vision-language datasets to be evaluated within a unified workflow. OpenCompass … ble,
  and extensible. Users can flexibly integrate new models, datasets, evaluators, inference backends, and
  task scheduling systems. The accompanying [CompassHub](https://hub.opencompass.org.cn/home) provides
  benchmark navigation, while [CompassRank](https://rank.opencompass.org.cn/home) presents model evaluation
  leaderboards. ## 🚀 What's New - **\\[2026.09.30\\]** We release [AgentCompass](https://github.com/open-compass/Agent"

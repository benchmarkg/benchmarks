  Title:WeatherBench 2: A benchmark for the next generation of data-driven global weather models Authors:Stephan
  Rasp, Stephan Hoyer, Alexander Merose, Ian Langmore, Peter Battaglia, Tyler Russel, Alvaro Sanchez-Gonzalez,
  Vivian Yang, Rob Carver, Shreya Agrawal, Matthew Chantry, Zied Ben Bouallegue, Peter Dueben, Carla Bromberg,
  Jared Sisk, Luke Barrington, Aaron Bell, Fei Sha View a PDF of the paper titled WeatherBench 2: A benchmark
  for the next generation of data-driven global weather models, by Stephan Rasp and 17 other authors View
  PDF HTML (experimental) Abstract:WeatherBench 2 is an update to the global, medium-range (1-14 day)
  weather forecasting benchmark proposed by Rasp et al. (2020), designed with the aim to accelerate progress
  in data-driven weather modeling. WeatherBench 2 consists of an open-source evaluation framework, publicly
  available training, ground truth and baseline data as well as a continuously updated website with the
  latest metrics and state-of-the-art models: this https URL. This paper describes the design principles
  of the evaluation framework and presents results for current state-of-the-art physical and data-driven
  weather models. The metrics are based on established practices for evaluating weather forecasts at leading
  operational weather centers. We define a set of headline scores to provide an overview of model performance.
  In addition, we also discuss caveats in the current evaluation setup and challenges for the future of
  data-driven weather forecasting. Subjects: Atmospheric and Oceanic Physics (physics.ao-ph); Artificial
  Intelligence (cs.AI) Cite as: arXiv:2308.15560 [physics.ao-ph] (or arXiv:2308.15560v2 [physics.ao-ph]

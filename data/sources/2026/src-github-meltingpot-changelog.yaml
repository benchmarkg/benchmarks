quote_extract: 'this project will be documented in this file. The format is based on [Keep a Changelog](http://keepachangelog.com/)
  and this project adheres to [Semantic Versioning](http://semver.org/). ## [2.4.1] - 2026-09-30 ### Changed
  - Move from pygame to pygame-ce to support newer versions of Python. ## [2.4.0] - 2024-12-17 ### Changed
  - Split out subjects and add more checks for VideoSubject - Update supported version of opencv ### Fixed
  - [#246](https://github.com/google-deepmind/meltingpot/issues/246) - Fix `clean_up_20` to use the correct
  puppet bot - Delete territory__rooms_6 as it is a duplicate of territory__rooms_5 ## [2.3.1] - 2024-06-27
  ### Added - Updated evaluation-results notebook with the Melting Pot Competition baselines data. ##
  [2.3.0] - 2024-06-27 ### Added - New scenarios, puppets and bots used in the Melting Pot Contest, NeurIPS
  2023. ### Known issues - Two scenarios in the competition were set up wrongly. Tracking issue: https://github.com/google-deepmind/meltingpot/issues/246
  * `clean_up_20` is using the wrong (puppet) bo … us lint errors ### Removed - Residual v1 file: reaction_graph_utils.py
  - Remove stale documentation left over from 1.0. ## [2.2.0] - 2023-07-25 ### Changed - Make meltingpot
  `pip` installable. - Support `import meltingpot` as an alias of `import meltingpot.python`. - Raise
  minimum Python version to Python 3.10. - Install assets as part of `pip install .` - Update Dockerfile
  and dev tooling (pytest, pyink, pytype, pylint, isort). - Update examples to work with v2. - Update
  … g `__init__.py` files. - Set the default orientation to NORTH for objects that have no orientation
  defined. ### Added - Evaluation utilities. ## [2.1.1] - 2023-02-16 ### Changed - Added COLLECTIVE_RETURN
  to PERMITTED_OBSERVATIONS. - Split install.sh into three … or the examples. - Mocks of specific substrates
  and scenarios, for use in testing. - Helper for setting world.rgb spec. ## [2.1.0] - 2022-12-06 ###
  Changed - Improve debugging information in `SavedModelPolicy`. - Resample bots at the beginning of scenario
  episodes. ### Fixed - Initialize `Transform` before any other component. [#84](https://github.com/google-deepmind/meltingpot/issues/84)
  [#24](https://github.com/google-deepmind/meltingpot/issues/24) ### Added - New substrate "Hidden Agenda"
  and its scenarios. ## [2.0.0] - 2022-11-25 Melting Pot Version 2.0.0 release. See [Melting Pot 2.0 Tech
  Report](https://arxiv.org/abs/2211.13746) for detailed information on the new substrates, bots, and
  scenarios. ### Changed - Removed all v1 scenarios, bots, and substrates and replaced with new versions.
  - Scenarios now support heterogeneous roles, which must be specified at build time. - Various improvements
  to `examples … ors, and maps. - Mocks for use in testing. ## [1.0.4] - 2022-08-22 ### Changed - Drop
  support for Python 3.7 and 3.8. - Store saved models on Google Cloud Platform rather than in the Git
  repo. - x2 speed improvement to some substrates - Improved `install.sh` script and installation documentation.
  - Various impr … s. ### Added - `.devcontainer` for the project. - `pettingzoo` example. - TF1-compatible
  version of `SavedModelPolicy`. ## [1.0.3] - 2022-03-03 ### Changed - Define `is_focal` is in scenario
  configs. - Use `chex.dataclass` for [dm-tree](https://github.com/google-deepmind/tree) compatibility.
  ### Fixed - Use correct `is_focal` settings for team-vs-team games [#16](https://github.com/google-deepmind/meltingpot/issues/16).
  ## [1.0.2] - 2022-02-23 ### Added - Substrates and Scen … -deepmind/meltingpot/issues/10) - build lab2d
  on m1 chip [#13](https://github.com/google-deepmind/meltingpot/issues/13) ## [1.0.1] - 2021-10-01 Submitted
  a number of fixes to ensure substrates and scenarios operate as intended. Other changes not expected
  to have any impact. ### Fixed - Bots receive incorrect timesteps in Scenario [#3](https://github.com/google-deepmind/meltingpot/issues/3)
  - Python seed is not forwarded to Lua [#4](https://github. … ot/issues/4) - Second episode using same
  seed as the first [#5](https://github.com/google-deepmind/meltingpot/issues/5) ## [1.0.0] - 2021-07-16
  Initial release.'

quote_extract: 'oadcast interviews, sociolinguistic interviews, meeting speech, speech in restaurants,
  clinical recordings, extended child language acquisition recordings from LENA vests, and YouTube videos.
  However, there are several key differences from DIHARD I: two tracks evaluating diarization of multi-channel
  recordings have been added; these tracks use recordings of dinner parties provided by the organizers
  of CHiME-5 the evaluation period has been lengthened (from 4 weeks to 16 weeks) Jaccard Error Rate replaces
  mutual information as the secondary metric baseline systems and results will be provided to participants
  The challenge will run from February 14th, 2019 through July 1, 2019 and results will be presented at
  a special session at Interspeech 2019 in Graz - Austria. Participation in the evaluation is open to
  all who are interested and willing to comply with the rules laid out in the evaluation plan. There is
  no cost to participate, though participants are encouraged to submit a paper to the corresponding Inters
  … 5. They will also need to create an LDC Online user account, which will be used to download the dev
  and eval releases. Once the process is complete, this will give you access to all annotation plus the
  non-CHiME audio. Participants of tracks 3 and 4 need to apply separately to Sheffield for the CHiME
  5 data regardless of whether you participated in CHiME 5. To apply for the multi-channel data, visit
  https://licensing.sheffield.ac.uk/i/data/chime5.html Non-profit organizations should sign the non-commercial
  license. Everyone else, regardless of use case (even if they are only using the data for non-commercial
  research), should apply for the commercial license. Results submission Account creation For system submission
  and scoring, this year we are using an instance of CodaLab hosted at: http://dihard.ldc.upenn.edu Each
  team should create one (and only one) account, which will then be used for submitting ALL of that team’s
  results for scoring. In CodaLab, the daily and lifetime submission limits are tied to user accounts,

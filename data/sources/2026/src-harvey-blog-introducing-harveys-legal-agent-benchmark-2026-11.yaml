quote_extract: "atform Overview→ One platform for all legal AI work Agents→ AI agents designed for legal
  work Vault→ Store and analyze legal documents Knowledge→ Legal, … May 6, 2026 … roducing Harvey’s Legal
  Agent Benchmark (LAB), an open-source benchmark for legal agents. LAB was built to evaluate and improve
  agent capabilities for supporting real world work done by lawyers. Each task consists of an instruction,
  a client matter containing relevant materials, and a requirement that the agent produce a work product
  for review. This structure is designed to mirror how work is assigned, performed, and reviewed at large
  law firms. The goal of LAB … a task, LAB helps law firms measure the ROI of AI investments and where
  such investments can augment their teams’ work. The first version of LAB includes more than 1,200 agent
  tasks across 24 legal practice areas, and is evaluated by over 75,000 expert-written rubric criteria.
  We are open-sourcing LAB to give model providers, agent builders, researchers, and law firms a shared
  way to measure progress on long-horizon legal agents. We're intentionally launching LAB without a leaderboard
  because we expect the dataset to evolve over time and we want to work with the community to ensure results
  are clear and intuitive in how they convey agent performance. … reas, and knowledge work disciplines.
  You can find the open-source version of LAB here. Why we built an agent benchmark At Harvey, we have
  spent the past year building agents for the legal domain. This has forced us to think deeply about how
  to measure their performance on real-world legal tasks. To date, there has not been a benchmark that
  illustrates agent progress for long-horizon legal work. Existing evaluations, including LegalBench,
  CUAD, LEXam, and our own earlier work on BigLaw Bench, have graded short-horizon reasoning: read a contract,
  answer a question, compare cases, or analyze an argument. In coding, agent benchmarks have served as
  … s with new tasks and other extensions. A strong public benchmark doesn’t only measure progress, it
  helps accelerate it. We are already seeing LAB being used by both our internal teams for product evaluation
  and the larger research community to explore open-weight post-training, auto-research, memory, domain-specific
  legal sk … ather than detailed explanations on expected outputs or style. Environment: The agent’s environment
  is a client matter. The client matter defines a closed-universe set of documents and other materials
  that are needed for the law firm to complete work on behalf of the client. These documents can include
  matter files, firm templates, email communications, and other information that an agent mus … en-ended
  assignments. Defining a task Each task in LAB is built to test agent capabilities to navigate real world
  work. Instructions are short, averaging just fifty words. Environments mix key and peripheral files
  and embed issues across multiple documents. An agent must start from a loose … ed (fictional) acquisition
  of Crestview Software Solutions in a $458 million, 100% equity transaction. Example M&A task As input,
  the agent receives access to a file system containing the background on the deal, a virtual data room
  and a short instruction from the partner asking the agent to review the data room, identify change-of-control
  provisions, assess the risk to the deal, recommend … iew by a partner or client. Each rubric breaks
  down what these stakeholders would scrutinize in a submitted deliverable into atomic, binary pass/fail
  criteria: facts, conclusions, citations, severity ratings, recommendations, deadlines, dollar amounts,
  and formatting choices. Each criterion is tied to a specific deliverable file. This also makes the rubric
  consistent across runs. The same criteria can be applied by an LLM judge, used to compare models and
  harness changes, and fed back into agent training loops as per-criterion reward signals. Evaluating
  a task For the change-of-control task, the rubric contains 57 criteria covering nine legal issues planted
  ac … solidated consent and waiver timeline, and reconciles inconsistent change-of-control definitions
  across the agreements. Importantly, a task is marked complete only if every criterion passes, a concept
  we refer to as all-pass grading. A deal-team report that identifies eight of ten risks is not 80% useful;
  it is materially incomplete. The missing issue … work is reviewed in practice — there is no partial
  credit for catching most of the issues.” Practice area distribution The change-of-control task is one
  of 1,250 tasks in LAB, spanning 24 legal practice areas. Large firms have hundreds of distinct practices,
  so this initial release focuses on a representative set of transactional, advisory, regulatory, and
  litigation work that associates regularly encounter. Practice area distribution To scale the benchmark,

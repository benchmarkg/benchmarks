quote_extract: "torical Document Database IAM Handwriting Database Overview The IAM Handwriting Database
  contains forms of handwritten English text which can be used to train and test handwritten text recognizers
  and to perform writer identification and verification experiments. The database was first published
  in [1] at the ICDAR 1999. Using this database an HMM based recognition system for handwritten sentences
  was developed and published in [2] at the ICPR 2000. The segmentation scheme used in the second version
  of the d … documented in [3] and has been published in the ICPR 2002. The IAM-database as of October
  2002 is described in [4]. We use the database extensively in our own research, see publications for
  further details. The database contains forms of unconstrained handwritten text, which were scanned at
  a resolution of 300dpi and saved as PNG images with 256 gray levels. The figure below provides samples
  of a complete form, a tex … ponding XML meta-information included into the image files. All texts in
  the IAM database are built using sentences provided by the LOB Corpus [5]. Characteristics The IAM Handwriting
  Database 3.0 is structured as follows: 657 writers contributed samples of their handwriting 1'539 pages
  of scanned text 5'685 isolated and labeled sentences 13'353 isolated and labeled text lines 115'320
  isolated and labeled words The words have been extracted from pages of scanned text using an automatic
  segmentation scheme and were verified manually. The segmentation scheme has been developed at our institute
  [3]. All form, line and word images are provided as PNG files and the corresponding form label files,
  including segmentation information and variety of estimate … XML file and XML file format (DTD). Changes
  in Version 3.0 Apart from greatly extending the database, the word and characters have been extracted
  and segmented using a different method than the one used in previous versions. In theory this change
  can lead to different results. In practice it should not be of any importance. Download Before you can
  download the IAM Handwriting DB 3.0 we ask you to register so we are aware of who is using our data.
  Once you have registered you access the IAM Handwriting DB 3.0. Tasks A task defines an experiment with
  well defined training, test, and validation sets. The idea of a task it to allow researchers to compare
  the results of their experiments. We have defined the following tasks: Large Writer Independent Text
  Line Recognition Task This task consists of a total number of 9'862 text lines. It provides one training,
  one testing, and two validation sets. The text lines of all data sets are mutually exclusive, thus each
  writer has contributed to one set only. Set Name Number of Text Lines Number of Writers Train 6'161
  283 Validation 1 900 46 Validation 2 940 43 Test 1'861 128 Total 9'862 500 The IDs of the different
  sets can be downloaded here. Terms of Use and Citation Request This database may be used for non-commercial
  research purpose only. If you publish material based on this database, we request … iversity of Oslo,
  Norway, 1978. Document Actions Print this Last modified May 28, 2019 10:20 AM © FKI: Research Group
  on Computer Vision and Artificial Intelligence INF, University of Bern"

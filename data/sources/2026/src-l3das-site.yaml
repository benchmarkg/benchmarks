  L3DAS24 @ IEEE WCCI 2024 Paper Submission Deadline Jan 15, 2025 Paper Acceptance Notification Mar 15,
  2024 Camera-ready Submission May 1, 2024 Scope of the project The L3DAS project aims at providing new
  3D audio datasets and software toolkits for the development of deep learning algorithms designed for
  3D audio analysis. To this end, the project will focus on various immersive audio tasks, such as sound
  event detection and localization, sound source separation, speech recognition, speech enhancement, audio
  super-resolution, acoustic scene classification, acoustic ec … first public release will be available
  during the Spring 2021 with 2 tasks. A more exhaustive release including several tasks related to 3D
  audio will be ready for the beginning of 2023. Stay up to date with our newsletter Sign up! Funding

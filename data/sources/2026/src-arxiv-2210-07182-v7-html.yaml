  by PINNs. Among the baseline surrogate models, FNO provides the best prediction for most metrics. It
  learns the differential operators well, leading to low errors even for the conserved quantities and
  on the boundaries. Additionally, FNO has a consistent error of about 4×10−44\times 10^{-4} across the

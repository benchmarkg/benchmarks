quote_extract: 'e symptoms may also appear in electrocardiograms (ECG), so ECGs can help to prioritize
  individuals for the limited numbers of serological tests and inform the impacts of and treatments for
  Chagas disease. The George B. Moody PhysioNet Challenge 2025 invites teams to develop open-source algorithmic
  approaches for identifying potential cases of Chagas disease from standard 12-lead ECGs. Announcements
  September 24, 2025: We have released the results of the 2025 Challenge. Congratulations to the winners!
  Please see this announcement for more details. June 30, 2025: We presented the Challenge at the Dx4LMICs
  conference. Check this no … when ready. February 7, 2025: We have added two new datasets, and we are
  now accepting submissions for the unofficial phase of the Challenge. Please read the submission instructions,
  double check your code, register, and submit an entry when ready. January 9, 2025: The NIH-funded George
  B. Moody PhysioNet Challenge 2025 is now open! Please read this website for details and share questions
  and comments on Challenge forum. This year’s Challenge is generously sponsored by MathWorks. Introduction
  Chagas disease is a tropical parasitic disease caused by Trypanosoma cruzi and is transmitted mainly
  by triatomine bugs, also known as “kissing bugs”. It affects an estimated 6.5 million people in endemic
  countries, and causes nearly 1 … se or other data as part of your method, then please cite them appropriately
  to clarify your method and attribute the data contributors. We split the Challenge data into training,
  validation, and test sets. The training data are publicly shared, and the validation and test data and
  labels are privately sequestered to allow for the principled assessment of the submitted algorithms.
  The training data comprise one large dataset, CODE-15% dataset6 , with “weak” labels, and two smaller
  datasets, SaMi-Trop dataset7, and PTB-XL dataset8, with “strong” labels. The validation and test data
  comprise multiple datasets with strong label … as the details in your abstract submission to Computing
  in Cardiology. You may update your author list by completing this form again (read the form for details),
  but changes to your authors must not contravene the rules of the Challenge. Algorithms Each team must
  develop and implement an algorithm that, given a 12-lead ECG recording, provides a binary Chagas label
  and a probability of a positive Chagas case. We implemented example algorithms in MATLAB and Python.
  Other implementation languages will be considered upon request. The code repositories contain details
  for the examples and other helpful scripts and functions. These examples were not designed … t you submit,
  and we encourage you to use an open-source license. Scoring The serological testing capacity for Chagas
  disease is limited, so we want to evaluate the ability of an algorithm to use ECGs to prioritize patients
  for testing. Accordingly, we define the Challenge score for an algorithm as the fraction of Chagas patients
  in a patient cohort that the algorithm prioritizes in the top 5% of the cohort, which is roughly the
  serological testing capacity The team with the highest Challenge score on the hidden test set wins the
  Challenge. Mathematically, let \(X\) be a dataset of \(n\) ECG records, and let \(p_x\) be algorithm’s
  estimated probability'

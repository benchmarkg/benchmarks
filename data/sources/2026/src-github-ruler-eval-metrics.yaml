  # # Unless required by applicable law or agree … ons and # limitations under the License. \"\"\" Add
  a new task: TASK_NAME: { 'metric_fn': the metric function with input (predictions: [str], references:
  [[str]]) to compute score. } \"\"\" def string_match_part(preds, refs): score = sum([max([1.0 if r.lower()
  in pred.lower() else 0.0 for r in ref]) for pred, ref in zip(preds, refs)]) / len(preds) * 100 return
  round(score, 2) def string_match_all(preds, refs): score = sum([sum([1.0 if r.lower() in pred.lower()
  else 0.0 for r in ref]) / len(ref) for pred, ref in zip(preds, refs)]) / len(preds) * 100 return round(score,
  2) TASKS = { 'niah': { 'metric_fn': string_match_all, }, 'variable_tracking': { 'metric_fn': string_match_all,
  }, 'common_words_extraction': { 'metric_fn': string_match_all, }, 'freq_words_extraction"

  on 13 Sep 2024] Title:AnalogGym: An Open and Practical Testing Suite for Analog Circuit Synthes … tomating
  analog circuit synthesis have been significant, yet challenges remain. A critical gap is the lack of
  a standardized evaluation framework, compounded by various process design kits (PDKs), simulation tools,
  and a limi … ct comparisons and the validation of algorithms. To address these shortcomings, we introduced
  AnalogGym, an open-source testing suite designed to provide fair and comprehensive evaluations. AnalogGym
  includes 30 circuit topologies in five categories: sensing front ends, voltage references, low dropout
  regulators, amplifiers, and phase-locked loops. It supports several technology nodes for academic and
  commercial applications and is compatible with commercial simulators such as Cadence Spectre, Synopsys
  HSPICE, and the open-source simulator Ngspice. AnalogGym standardizes the assessment of ML algorithms
  in analog circuit synthesis and promotes reproducibility with its open datasets and detailed benchmark
  specifications. AnalogGym's user-friendly design allows researchers to easily adapt it for robu … sign
  challenges, enhancing the practical relevance of their work. Additionally, we have conducted a comprehensive
  comparison study of various analog sizing methods on AnalogGym, highlighting the capabilities and advantages
  of different approaches. AnalogGy"

quote_extract: 'hmarks for long-horizon web search. BrowseComp (OpenAI, 2025) contains 1,266 multiconstraint
  identification questions evaluated against the live web. BrowseComp-Plus (Chen et al., 2025) contains
  830 questions and replaces the live web with corpus retrieval over approximately 100K curated documents
  for replicability. Evaluation. For judge model, we use GPT-4.1, the official BrowseComp judge model,
  for BrowseComp and BrowseComp-Plus. BrowseComp uses the exact judge prompt from OpenAI (2025), and BrowseComp-Plus
  uses the official BrowseCompPlus judge prompt. To bound run-to-run var … every setting, surpassing each
  provider’s deep-research system (provider accuracy is taken from the Claude Opus 4.5 System Card, p.
  21; see Table 2). On live-web BrowseComp with GPT-5, ArcticSwarm reaches 73.6%, against 54.9% for the
  provider system and 63.4% for MiroFlow (Table 4). On the BrowseComp-Plus 7 Figure 5: Search-path overlap
  on live-web BrowseComp (GPT-5, 120-question subset), extending the corpus coverage … s the lowest overlap
  as N grows. System Model provider MiroFlow ArcticSwarm GPT-5 54.9% 63.4% 73.6% Sonnet 4.5 43.8% – 50.2%

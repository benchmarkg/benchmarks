quote_extract: 'he next step. 4 Experiments 4.1 Experimental Setup Dataset. We evaluate AirAnchor on the
  AerialVLN-S dataset of the challenging AerialVLN (Liu et al., 2023b) benchmark. The benchmark comprises
  8,446 flight trajectories collected … gine 4, covering more than 870 categories of urban objects. AerialVLN-S
  is a small-scale variant of AerialVLN consisting of 17 compact scenes. Metrics. Following AerialVLN,
  we report four evaluation metrics: Success Rate (SR), Oracle Success Rate (OSR), Navigation Error (NE),
  and Success weighted by normalized Dynamic Time Warping (SDTW). SR measures the percentage of episodes
  in which the agent s … nd FineCog-Nav (Shao et al., 2026). Implementation Details. We implement AirAnchor
  with Qwen3.6-Plus (Alibaba Cloud, 2026) as the MLLM backbone via its online API. A∗ search (Hart et
  al., 1968) serves as the low-level motion planner, generating feasible paths from the current pose to
  the target pose. Each scene starts with an empty SOKB, which is updated online and retained across episodes
  within the same scene. All zero-shot Aerial VLN baselines are reproduced using the same MLLM backbone.

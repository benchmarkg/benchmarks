quote_extract: 'The latest CARLA Leaderboard v2 introduces 39 challenging scenarios designed to evaluate
  the robustness of AD systems in more intricate situations. … Bench2Drive has an official training dataset
  collected by state-of-the-art expert model Think2Drive [31] … The evaluation protocol includes 220 short
  routes, each only around 150 meters in length and containing a single specific scenario. … CARLA Leaderboard
  V2 [28] lacks expert demonstration data. … Notably, after the release of Bench2Drive, the rule-based
  expert PDM-Lite [61]2 is open sourced … Further, we design 5 more scenarios beyond Leaderboard V2 to
  enhance behavior diversity … we summarize 5 advanced skills for urban driving: Merging, Overtaking,
  Give Way, Traffic Sign, Emergency Brake as in Table 2 and report the score of each skill. … A route
  is deemed successful if the ego vehicle reaches its destination without any rule infractions. … This
  metric follows CARLA [28] official metric as reference. It considers both route completion and penalty
  for infractions. … we increase the number of checkpoints to 20. Speed check is now performed every 5%
  of the total route length, and it is excluded from the driving score calculation. … The final smoothness
  metric is defined as the ratio of smooth trajectory segments to the total number of segments. … We treat
  these routes as 0 score. … Table 5: Resource requirements for training on base set and evaluation on
  220 routes. … 4 A6000 * 6 hours 4 A6000 * 6 hours 8 H800 * 2 days 8 H800 * 2 days … Pedestrian Collision
  0.50 Vehicles Collision 0.60 Other Collision 0.65 Running Red Light 0.70 Scenario Timeout 0.70 Too Slow
  0.70 No Give Way 0.70 … I License All data, codes, and checkpoints are in GitHub and Huggingface under
  Apache License 2.0. … All authors and potentially new members of ReThinLab in Shanghai Jiao Tong University'

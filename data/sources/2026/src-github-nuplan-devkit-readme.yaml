quote_extract: "# MotionalTM nuPlanTM **The world's first benchmark for autonomous vehicle planning.**
  ______________________________________________________________________ Website • Download • Citation
  Changelog • Structure • Setup Tutorial • Documentation • Competition [![python](https://img.shie … for
  the updated file structure. - The nuPlan sensor data for the v1.1 dataset has been released. Please
  download the latest dataset from the nuPlan [page](https://www.nuscenes.org/nuplan#download). - Due
  to the size of the sensor data, it will be released gradually. This first set of sensor data are the
  blobs corresponding to nuPlan mini. - A short tutorial for the sensor data is provided `nuplan_sensor_data_tutorial.ipynb`
  to get you started. __________________ … __________ ## Planning challenges #### IMPORTANT: The base
  docker image used in nuPlan submission has been updated. You should rebuild your submission container
  with the new `Dockerfile.submission` - The Planning Challenge will be using devkit version 1.2 from
  now on. Submissions generated from version v1.1 should remain compatible. However, please double-check
  by submitting to the warm-up phase. - The challenge will be presented as part of the [End-to-End Autonomous
  Driving](https://opendrivelab.com/event/cvpr23_ADworkshop) workshop at CVPR 2023 - The nuPlan Dataset
  v1.1 has been released. Please download the latest dataset from the nuPlan [page](https://www.nuscenes.org/nuplan#download).
  ______________________________________________________________________ ## Changelog - May 11th 2023
  * v1.2.2 Devkit: Upated the submission base images. - May 9th 2023 * v1.2.1 Devkit: Update to competition
  dates. Submission Deadline extended to May 26th, 2023. - April 25th 2023 * v1.2 Devkit: The nuPlan sensor
  data have been released! Improved feature caching and nuBoard dashboard functionality. Changed dataset
  file structure, data interfaces now allow retrieval of sensor data. Pinned several packages including
  hydra, numpy and sqlalchemy. - January 20th 2023 * v1.1 Devkit: The official nuPlan Challenge Release.
  Optimized training caching, simulation improvements, shapely 2.0 update. - Oct 13th 2022 * v1.1 Dataset:
  Full nuPlan dataset - improved route plan, traffic light status, mission goal and more! * v1.0 Devkit:
  Update to nuplan-v1.1 dataset, metrics improvements, route plan fixes, documentation, IDMPlanner - Sep
  09 2022 * v0.6 Devkit: Smart agents optimizations, nuBoard improvements, metrics … Jul 15 2022 * v0.3
  Devkit: Updates to the devit including but not limited to: nuBoard update, reduce RAM usage during caching
  and training, new map APIs, simulation and metrics runtime improvements. - Jun 10 2022 * v1.0 Dataset:
  Full nuPlan dataset release with over 1,300 hours of driving data (15,000+ logs) across 4 cities (Las
  Vegas, Pittsburgh, Boston, Singapore). * v0.2 Devkit: Multiple devkit updates with improvements across
  the whole framework (planning models, training, simulation, metrics, dashboard, tutorials and more).
  - Dec 19 2021 * v0.2 Dataset: Fixed bugs in the teaser nuPlan dataset. - Dec 10 2021 * v0.1 Dataset:
  Initial teaser nuPlan dataset release with over 200 hours of driving data (350+ logs) across Las Vegas.
  * v0.1 Devkit: Initial nuPlan devkit release. ______________________________________________________________________
  ## Devkit and dataset setup Please refer to the [installation page](https://nuplan … nuPlan](https://arxiv.org/abs/2106.11810):
  ``` @INPROCEEDINGS{nuplan, title={NuPlan: A closed-loop ML-based planning benchmark for autonomous vehicles},
  author={H. Caesar, J. Kabzan, K. Tan et al.,}, booktitle={CVPR ADP3 workshop}, year=2021 } ```"

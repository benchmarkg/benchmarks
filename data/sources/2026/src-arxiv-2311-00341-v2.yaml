  on ∼8K MOFs, amounting to a total of ∼176K adsorption energies and ∼38M single-point calculations (Fig.
  1). All calculations were performed using DFT with the PBE+D3 exchange correlation functional, ensuring
  that covalent and electrostatic interactions are treated quantum mechanically and van der Waals interactions
  are included with well-established empirical accuracy. Approximately 76K adsorpt … benchmarks for development
  of new ML models, and providing accessible pre-trained ML models that enable routine prediction of mixed
  CO2 and H2O adsorption on MOFs at an accuracy that approaches DFT. The ODAC23 dataset is publicly available
  at the OpenDAC website i. All of our trained ML models and training code are available in the OCP repository
  ii. Scope and Structure of the ODAC23 Dataset Enormous numbers of hypothetical MOF structures exist,
  as illustrated by the hypothetical MOF database (hMOF) of Wilmer et al., which contains 138,000 st …
  pin polarized to capture spin effects associated with open metal sites. Our work ultimately seeks to
  push the baseline description of MOFs for DAC from classical FFs to the PBE-D3 level of theory, so we
  prioritized consistency across a very large number of calculations rather than absolute accuracy. The
  ODAC23 dataset consists of complete relaxation trajectories of CO2, H2O, and mixtures of CO2 and H2O
  on MOF structures derived from the CoRE MOF database. We include two classes of MOF framework … over
  400M core-hours of compute time. Details are provided in the Methods section. The Open DAC 2023 (ODAC23)
  dataset has been designed to allow training of ML models to approximate DFT calculations, similar to
  previous work in heterogeneous catalysis (OC20 and OC22).75,86 We use the same three task definitions
  used in the OC20 work. These tasks are briefly summarized below, and we refer the reader to the OC20
  paper75 for more detailed descriptions. In each task, the input structure is a unit cell periodic in
  all directions containing a MOF with one or more adsorbates. The ground truth targets of forces, energies,
  and relaxed structures were all calculated using DFT. For energy targets, we used a non-relaxed adsorption
  energy: E˜ads = Esystem − EMOF − nCO2 ECO2 − nH2OEH2O (1) where Esystem is the energy of the MOF and
  adsorbates, EMOF is the energy of the relaxed … orbate structures were used to train models for three
  tasks: 1. Structure to Total Energy and Forces (S2EF) takes a structure as input and predicts E˜ads
  of the system as well the force on each atom. This task is analogous to training a force field for all
  atoms in the system. 2. Initial Structure to Relaxed Energy (IS2RE) takes an initial guess structure
  as input and predicts Eads of its relaxed structure. This task is analogous to predicting an adsorption
  energy from an initial structure. 3. Initial Structure to Relaxed Structure (IS2RS) takes an initial
  guess structure as input and predicts the relaxed position of each atom. This task is analogous to geometry
  optimization. The S2EF task is the most general, and an S2EF model can be used to complete the IS2RS
  and IS2RE tasks. The dataset is organized by task and train/test splits. For each task, the data is
  split into a … d from the full dataset derived from CoRE MOF, but are stratified by MOF framework to
  ensure that all defective structures are in the same set as the pristine structure from which they are
  generated. Four out-of-domain (ood) sets are included. The “big” ood set corresponds to MOFs from CoRE
  with over 500 atoms in their unit cell (testing the ability to generalize to larger structures). The
  “linker”, “topology” ood sets contain linkers and topologies not included in the training data, selected

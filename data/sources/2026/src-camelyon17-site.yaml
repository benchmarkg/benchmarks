quote_extract: 'derboard Challenge Statistics Join Home Background Rules Data Evaluation Organisers Workshop
  Email organizers Overview¶ The CAMELYON17 challenge is still open for submissions! Built on the success
  of its predecessor, CAMELYON17 is the second grand challenge in pathology organised by the Diagnostic
  Image Analysis Group (DIAG) and Department of Pathology of the Radboud University Medical Center (Radboudumc)
  in Nijmegen, The Netherlands. The goal of this challenge is to evaluate new and existing algorithms
  for automated detection and classification of breast cancer metastases in whole-slide images of histological
  lymph node sections. This task has high clinical relevance and would normally require extensive microscopic
  assessment by pathologists. The … nally create a Team for affiliation. Submit your result and paper.
  Find your score on the Leaderboard. Important dates¶ 15 May 2017: Submission re-opened! 18 April 2017:
  Challenge workshop at ISBI 2017, Melbourne, Australia. 1 April 2017: Submission deadline for results.
  1 March 2017: Test dataset released. 18 December 2016: Second training dataset released. 18 November
  2016: First training dataset released. 18 November 2016: Registration opened. 10 November 2016: Challenge
  website launched. Sponsors¶ Grand Challenge About Us'

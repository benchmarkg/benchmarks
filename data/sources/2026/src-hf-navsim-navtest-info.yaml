  {"response":"# NAVSIM v1 `navtest` Leaderboard\n\n## Overview\n\nAfter the NAVSIM v1 challenge 2024, we have re-opened the leaderboard with the `navtest` split. With 12k samples, the `navtest` split contains a larger set for comprehensive evaluations. In this guide, we describe how to create a valid submission and what rules apply for the new leaderboard.\n\n### Rules\n- **Open-source code and models**:\n - We will periodically (~every 6 months) be removing all entries on the leaderboard which **do not provide associated open-source training and inference code with the corresponding pre-trained checkpoints**. Even if removed for not having this information, an entry can be resubmitted once the code needed for reproducibility is made publicly available.\n - We will also remove entries that use `navtest` annotations in their model's training or inference (e.g., generating multiple proposals per sample and submitting only the one with the best PDM score).\n - Code must be provided by setting the `TEAM_NAME` variable of the submission file as `\"Method … ization seeds.\n - Therefore, the leaderboard now supports (1) regular single-seed submissions and (2) multi-seed submission, which we **strongly encourage** (with a minimum of 3 training seeds).\n - The maximum, mean and standard deviations of our evaluation metrics will be displayed for multi-seed submissions.\n\n## Submission Instructions\n\nThe participants are expected to submit their predictions as a HuggingFace model hub repo. Please refer to the **Submision Information** for detailed steps.\n\n### Re

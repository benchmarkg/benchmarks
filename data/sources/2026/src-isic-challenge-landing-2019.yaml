quote_extract: 'amous cell carcinoma None of the others 25,331 images are available for training across
  8 different categories. Additionally, the test dataset (planned release August 2nd) will contain an
  additional outlier class not represented in the training data, which developed systems must be able
  to identify. Two tasks will be available for participation: 1) classify dermoscopic images without meta-data,
  and 2) classify images with additional available meta-data. Task 1’s deadline will be August 16th. …
  In addition to submitting predictions, each competitor is required to submit a link to a manuscript
  describing the methods used to generate predictions. Submission Submissions are made to the ISIC Challenge
  submission system, which provides automated format validation, pre-scoring, metadata editing capabilties.
  Evaluation Goal Metric Submissions are scored using a normalized multi-class accuracy metric (balanced
  across categories). Tied positions will be broken using the … score of about 0.3. Final Score Release
  Final scores and a public leaderboard are released shortly after the conclusion of the ISIC Challenge
  submission period. Transparency Statement The code of the isic-challenge-scoring package is used for
  actual score computation. This code is open source, permissively … to facilitate external auditing.

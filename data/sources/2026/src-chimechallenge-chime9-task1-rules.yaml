quote_extract: 'mber 30, 2025. For evaluation, each recording must be considered separately. The system
  should not be in any way fine-tuned on the entire evaluation set (e.g. by computing global statistics,
  gathering speaker information across multiple recordings). Participants must submit a system description
  with details about their submitted system. Publishing code is not required but encouraged. Systems that
  do not comply with these rules (e.g., by using a private dataset) may still be submitted but will be
  excluded from the final rankings. Evaluation Overview The system is evaluated on three main metrics:
  Individual Speaker’s WER Conversation Clustering Performance (Pairwise F1 Score) Joint ASR-Clustering
  Error Rate - Primary Evaluation Metric 1. Individual Speaker’s WER Output Requir … r assignments are
  provided for each speaker. Evaluation Steps: For all unordered pairs of speakers in a session: Determine
  if the pair is in the same cluster in both the system output and the ground truth. Compute the following:
  True Positives (TP): Pairs correctly predicted to be in the same cluster. False Positives (FP): Pairs
  predicted to be in the same cluster but are not in the ground truth. False Negatives (FN): Pairs in
  the same cluster in the ground truth but not predicted as such. Calculate: Precision: TP / (TP + FP)

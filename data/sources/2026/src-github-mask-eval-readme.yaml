quote_extract: "r evaluating language models' responses across different scenarios, focusing on this critical
  distinction between knowing facts (accuracy) and choosing to state them truthfully (honesty). ## Overview
  The framework consists of three main stages: 1. Response Generation 2. Response Evaluation 3. Metrics
  Processing ## Setup 1. Create a `.env` file in the root directory with your API keys: ```env OPENAI_API_KEY=your_key_here
  # needed for evaluation ANTHROPIC_API_KEY=your_key_here ``` 2. Install dependencies (recommended to
  use a virtual environment): ```bash python -m venv venv source … ash python generate_responses.py [--test]
  [--model MODEL_NAME] [--temperature TEMP] [--lie_k NUM_RUNS] ``` Options: - `--test`: Use test directories
  - `--model`: Model name to use (default: gpt-4o) - `--temperature`: Sampling temperature (default: 1.0)
  - `--lie_k`: Number of lying prompts to generate per row (default: 1) The script supports OpenAI and
  Anthropic models. Generated responses will be saved in `csv_data/responses/` following the naming convention:
  `{archetype}_{model}.csv` ### 2. Evaluate Responses Run the evaluation script: ```bash python evaluate.py

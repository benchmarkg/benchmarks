quote_extract: "**Status**: Archive (code is provided as-is, no updates expected) # Grade School Math
  #### [[Blog Post]](https://openai.com/blog/grade-school-math/) [[Paper]](https://arxiv.org/abs/2110.14168)
  State-of-the-art langu … asks, but they still struggle to robustly perform multi-step mathematical reasoning.
  To diagnose the failures of current models and support research, we're releasing GSM8K, a dataset of
  8.5K high quality linguistically diverse grade school math word problems. We find that even the largest
  transformer models fail to achieve high test performance, despite the conceptual simplicity of this
  problem distribution. ## Dataset Details GSM8K consists of 8.5K high quality grade school math problems
  created by human problem writers. We segmented these into 7.5K training problems and 1K test problems.
  These problems take between 2 and 8 steps to solve, and solutions primarily involve performing a sequence
  of elementary calculations using basic arit … ould be able to solve every problem. The raw data files
  can be found in: - `grade_school_math/data/train.jsonl` - `grade_school_math/data/test.jsonl` Each line
  of those files corresponds to a single grade school math problem, saved as a json dictionary (with a
  \"question\" key and an \"answer\" key). The answer is formatted such that it uses calculation annotations
  and so that the final numeric solution is the final line of the solution, preceded by `####`. ### Calculation
  Annotations Our models frequently fail to accurately perform calculations. Although larger models make
  fewer arithmetic mistakes than smaller models, this remains a common source of errors. To mitigate this
  issue, we train o … with `<<` and ends with `>>`. ### Solution Extracting To extract the final numeric
  solution for a particular question, simply parse the completion to extract the numeric value immediately
  following the `####` token. Some example python code to do so is shown in `dataset.py:is_correct`. ###
  Socratic Dataset During our research, we also investigated a modified solution format that injects automatically
  generated \"Socratic subquestions\" before each step. Although we ultimately did not use this format
  for any experiments in the paper, we make this data available to anyone who is interested. We show an
  example below, with the socratic subquestions in bold: A carnival snack booth made $50 selling popcorn
  each day. It made three times as mu … 5>>105. How much did the booth earn after paying the rent and
  the cost of ingredients? ** Thus, the booth earned $1000 - $105 = $<<1000-105=895>>895. We generated
  each Socratic subquestion by conditioning on each ground truth (contractor-provided) step in a solution,
  using a model specifically finetuned for this task (on around 800 examples). To construct the full Socratic
  dataset, each step in the solution was p … se data files can be found in: - `grade_school_math/data/train_socratic.jsonl`
  - `grade_school_math/data/test_socratic.jsonl` ## View Model Solutions For each test question, we provide
  solutions generated from 6B finetuning, 6B verification, 175B finetuning and 175B verification. This
  data can be found in: - `grade_school_math/data/example_model_solutions.jsonl` To view these results
  problem-by-problem, run: ```bash python view_model_solutions.py ``` Note: These model-generated samples
  used a slightly older version of the calculator. Previous implementation bugs led to calculator failures
  in roughly 1% of model samples. Those issues have been fixed in the codebase, but since the samples
  have not been regenerated, occasional calculation errors are present. ## Citation Please use the below

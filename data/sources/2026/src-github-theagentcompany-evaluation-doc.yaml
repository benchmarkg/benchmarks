quote_extract: "LLM API key does not need to be the same as the one you use for your agent(s). It needs
  to be as powerful as or at least close to `claude-3-5-sonnet-20241022` or `gpt-4o`. For reference, all
  baseline results used `claude-3-5-sonnet-20241022` as the environment LLM. Please provide the environment
  LLM model you use when you submit your results to the leaderboard. To prevent the agent from peeking
  at the evaluator code, all `/utils/evaluator.py` files, which contain the grading functions, are encrypted.

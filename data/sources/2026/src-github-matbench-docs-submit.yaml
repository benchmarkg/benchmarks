  you need 3 files: 1. `results.json.gz`: The file you saved when [recording your data](2run.md). [Instructions
  on how to create this file](#resultsjsongz) 2. `info.json`: A short file of some metadata about your
  algorithm. [Instructions on how to create this file, with template](#infojson) 3. Either (a) an `.ipynb`
  notebook detailing your algor … uctions for creating a [PR here.](https://guides.github.com/activities/hello-world/#:~:text=Pull%20Requests%20are%20the%20heart,merge%20them%20into%20their%20branch.&text=You%20can%20even%20open%20pull,repository%20and%20merge%20them%20yourself.)
  3. Say in your PR description that it is a new benchmark submission. Only maintainers can add labels
  on GitHub, so a maintainer will add the \"new_benchmark\" label to your PR for you. ![pr example](../static/pr_example.png)
  **And you're done! If the tests pass, your submission will be added to the leaderboard!** --- ## `results.json.gz`
  This file is the `MatbenchBenchmark` you saved during your benchmark. You can find docs about how to
  record and save a benchmark on the [Running a benchmark page](2run.md). **This file is required for
  a submission.** ## `inf … pj Computational Materials}\\n}\", \"notes\": \"Some freeform notes users

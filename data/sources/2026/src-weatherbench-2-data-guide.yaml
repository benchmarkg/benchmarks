  part of WeatherBench 2 are ready-to-use, cloud-based datasets. This page lists and describes all the
  available datasets. The datasets are stored in this public Google Cloud bucket: gs://weatherbench2/datasets.
  Please also check the LICENSE files for each dataset in the respective GCS buckets. Some datasets allow
  commercial use. Others only permit research use. A note on resolutions We provide the datasets at different

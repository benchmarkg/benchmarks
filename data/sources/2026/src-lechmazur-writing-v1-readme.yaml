  by Amazon Nova Pro. 4.44 Story Length [https://github.com/lechmazur/writing/blob/80b7f178dd373725ef5abf39412163e811944ecf/README.md#story-length]
  A basic prompt asking LLMs to create a 400-500 word story resulted in an unacceptable range of story
  lengths. A revised prompt instructing each LLM to track the number of words after each sentence improved
  consistency somewhat but still fell short of the accuracy needed for fair grading. Since the benchmark
  aims to evaluate how well LLMs write, not how well they count or follow prompts about the format, we
  adjusted the word counts in the prompt for different LLMs to approximately match the target story length
  - an approach similar to what someone dissatisfied with the initial story length might adopt. Note that
  this did not require any evaluation of the story's content itself. These final stories were then graded
  and they are available in stories_wc/ [https://github.com/lechmazur/writing/blob/80b7f178dd373725ef5abf39412163e811944ecf/stories_wc].
  [https://github.com/lechmazur/writing/blob/80b7f178dd373725ef5abf39412163e811944ecf/images/word_count_distribution_by_model.png]
  This chart shows the correlations between each LLM's scores and their story lengths: [https://github.com/lechmazur/writing/blob/80b7f178dd373725ef5abf39412163e811944ecf/images/len_vs_score_overall_enhanced.png]
  This chart shows the correlations between each Grader LLM's scores and the lengths of stories they graded:
  [https://github.com/lechmazur/writing/blob/80b7f178dd373725ef5abf39412163e811944ecf/images/len_vs_score_grader_enhanced.png]
  Ablation [https://github.com/lechmazur/writing/blob/80b7f178dd373725ef5abf39412163e811944ecf/README.md#ablation]
  A valid concern is whether LLM graders can accurately score questions 1 to 6 (Major Story Aspects),
  such as Character Development & Motivation. However, questions 7A to 7J (Element Integration) are clearly
  much easier for LLM graders to evaluate correctly, and we observe a very high correlation between the
  grades for questions 1 to 6 and 7A to 7J across all grader - LLM combinations. We also observe a high
  correlation among the grader LLMs themselves. Overall, the per-story correlation of 1-6 vs 7A-7J is
  0.926 (N=N=81,000). While we cannot be certain that these ratings are correct without human validation,
  the consistency suggests that something real is being measured. But we can simply ignore questions 1
  to 6 and just use ratings for 7A to 7J: Questions 7A to 7J Only: Element Integration [https://github.com/lechmazur/writing/blob/80b7f178dd373725ef5abf39412163e811944ecf/README.md#questions-7a-to-7j-only-element-integration]

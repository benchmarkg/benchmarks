quote_extract: 'iq Joty, Enamul Hoque 🚨 **New benchmark alert!** Check out our new [ChartQAPro](https://github.com/vis-nlp/ChartQAPro):
  a more diverse, challenging dataset for real-world chart question answering. 🧠📊 * Paper Link: [ChartQA](https://aclanthology.org/2022.findings-acl.177/)
  * If you are looking for powerful Chart Models, explore our latest models for chart understanding: *
  [UniChart](https://github.com/vis-nlp/UniChart) * A lightweight model (140M parameters) excelling in
  ChartQA, Chart-to-Table, Chart Summarization, and Open-ended QA. * [ChartInstruct](https://github.com/vis-nlp/ChartInstruct)
  * … Added VisionTaPas Model * Added the Mask-RCNN training and inference codes to generate the visual
  features for VL-T5 * Added the full ChartQA dataset (including the bounding boxes annotations) * Added
  T5 and VL-T5 models codes along with the instructions. * Added the first version of the ChartQA dataset
  (does not have the annotations folder) ## ChartQA Dataset ### First Version (does not have the annotations
  folder) The ChartQA dataset is available in the ChartQA Dataset folder in this repository. ### Full
  Version (with the annotations folder) The full ChartQA dataset (including the annotations) can be downloaded
  f … .co/datasets/ahmed-masry/ChartQA). The dataset has the following structure: ``` ├── ChartQA Dataset
  │ ├── train │ │ ├── train_augmented.json # ChartQA-M (machine-generated) questions/answers. │ │ ├──
  train_human.json # ChartQA-H (human-authored) questions/answers. │ │ ├── annotations # Chart Images
  Annotations Folder │ │ │ ├── chart1_name.json │ │ │ ├── chart2_name.json │ │ │ ├── .'

  for the 30 edit pairs. 4 Execution and Evaluation 4.1 Pinned runtime and isolation The runtime uses
  FreeCAD 1.1.0, Harbor 0.23.0, and task schema 1.3. The verifier pins gnucleus-freecad-validator 0.6.0
  with its v2 scorer. The benchmark version, validator package version, and scorer version are distinct
  identifiers. Reference geometry and task-specific grader assets are placed in a separate verifier environment
  rather than the agent environment. Each public job records its agent version and concurrency. 4.2 Programmatic
  scoring The verifier computes two independent axes, geometry_similarity and cad_spec_consistency, using
  the default v2 scorer in gnucleus-freecad-validator 0.6.0 [10]. Geometric similarity. The scorer compares
  the candidate and reference solids using surface-type areas, volume, total surface are … ntermediate
  errors receive logarithmically interpolated credit. Surface-type comparison uses the largest per-type
  relative area error, with a denominator floor of 1% of the larger total surface area. An independently
  measured OCCT oriented bounding box is a gate, not an additional weighted subscore: maximum relative
  error across sorted extents of 10% or more sets g = 0. Structural gates also require one non-empty PartDesign::Body
  producing one solid through allowed native features rather than baked shape holders. Candidates with
  more than 5,000 faces, or face/vertex counts differing from the reference by more than 50% of the larger
  count, are rejected. Gate failures override the spatial multiplier’s nonzero f … story need not receive
  g = 1. CAD specification consistency. The scorer parses the task’s held-back specification and checks
  its parameters against measurements extracted from the candidate document. CAD engineers wrote the parameter-checking
  logic shipped in each task’s tests/grader/param_check.py. Most tasks share a workflow-level implementation,
  and a subset adds case-specific checks. These checks encode ways to measure the dimensions, the correct
  placement of d … cific checks beyond global shape similarity. The v2 path honors trusted geometry bindings
  and case-local param_check.py refinements where supplied; remaining checks use generic per-kind measurements.
  The default scalar relative tolerance is 1%, with case-specific measurement logic and binding tolerances

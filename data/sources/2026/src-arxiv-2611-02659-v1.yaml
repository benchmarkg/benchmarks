quote_extract: 'nd SolidWorks, and open-source systems such as FreeCAD, which uses Open CASCADE Technology
  (OCCT) as its geometry kernel. By contrast, CadQuery is a code-centric parametric CAD library built
  on OCCT. Our benchmark instead requires native FreeCAD documents with an application-managed feature
  tree and document dependencies, rather than a CadQuery program or exported B-rep alone. This distinction
  matters for evaluating CAD agents in real engineering workflows, where parametric CAD systems underpin
  modern mechanical design and manufacturing. An output can resemble the requeste … es, or a static shape
  in place of the required native feature structure. Conversely, alternative feature constructions can
  satisfy the same engineering requirements. Evaluating CAD agents therefore 1 requires more than testing
  whether generated code executes or whether the resulting geometry is visually or geometrically similar.
  Our central question is whether general-purpose AI agents can produce geometrically correct, specification-consistent,
  parametric CAD artifacts across three workflows. The benchmark has evolved through three releases. We
  released Parametric CAD Bench v1 in May 2026 to evaluate text-based creation of native parametric FreeCAD
  models [11]. In September 2026, v2 retained the 100-task creation format while tightening validation
  and evaluation isolation: it upgraded the validator and FreeCAD runtime, moved held-out assets into
  a separate verifier image, and standardized reward reporting and failure handling [12]. V3 broadened
  the suite to include editing and reconstruction from engineering drawings [13]; the September 24 update
  added evaluations of Claude Opus 5.5 with two agent frameworks [14]. This paper focuses on v3; v1 and
  v2 provide historical context rather than additional evaluation coh … whereas Parametric CAD Bench v3
  requires native parametric FreeCAD documents across 100 tasks and scores their geometric similarity
  and compliance with named dimensions without simulating mechanisms. Despite the similar name, it is
  a separate benchmark with a different evaluation target. 3DCodeBench: mesh-based procedural 3D authoring.
  3DCodeBench evaluates Blender Python scripts generated from text and images, including iterative execution
  and visual feedback [9]. Its evaluated outp … y complete manufacturability. Terminal-Bench and Harbor:
  agent evaluation infrastructure. Terminal-Bench provides complementary methodology for evaluating agents
  on difficult terminal workflows [17]. Our benchmark is built on Harbor, a framework for specifying and
  evaluating agent tasks in sandboxed environments [16]. We also contributed three FreeCAD tasks to Terminal-Bench
  3.0/4.0: two create-and-edit tasks (freecad-impeller and freecad-spring-clip) and one image-to-CAD task
  (freecad-platform-drawing) [15]. These tasks follow the same create-and-edit and engineeringdrawing
  rec … cts are graded. The task does not provide an externally authored starting FCStd. Scoring the two
  artifacts does not establish that the agent actually reused the base or preserved its feature history.
  Image-to-CAD tasks provide engineering drawings rather than the held-back dimensional specification.
  3.2 Example tasks Text-to-CAD creation examples. Two creation tasks illustrate the range of specifications.
  Figure 1 shows freecad-2002df3ce7, a trussed upper plate: a thin planar frame whose outline … and each

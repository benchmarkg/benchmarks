  Table 7; Failed counts the parameters, of 44, that are inconsistent or not found. 6 Discussion and Limitations
  The benchmark is a curated 100-task FreeCAD evaluation, not a representative sample of all engineering
  CAD. Family dependencies and selection choices limit generalization. Native single- 16 body PartDesign
  requirements do not cover general assembly mating, FEM/FEA, manufacturing qualification, or broad organic-surface
  modeling. Create-and-edit measures two-stage construction, not maintenance of an externally authored
  document. Grader rewards are heuristic proxies: geometric similarity and checked parameters do not certify
  all future edits, design intent, or engineering validity. Alternative valid constructions may challenge
  reference-based comparisons. Public assets, providers’ undisclosed training data, and changing provider
  implementations limit contamination claims and reproducibility. Agent tools, prompts, serving paths,
  and budgets confound model-only comparisons. Single official attempts do not establish run-to-run robustness.
  Known API costs exclude some compute and hosting costs. 7 Conclusion Parametric CAD Bench v3 evaluates

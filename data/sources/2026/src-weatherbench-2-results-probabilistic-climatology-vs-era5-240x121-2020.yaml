notes: "Read for P3-S6-T04 on 2026-11-24: one of the maintainers' published results files in the public
  weatherbench2 bucket's benchmark_results/ folder, whose file names follow the site's selectors (forecast,
  ground truth, resolution, year); no source read says the site's plots are drawn from them. The probabilistic
  climatology (the paper: each of the 30 years 1990-2019 of ERA5 as a member) used as an ensemble forecast,
  scored against ERA5. It holds every metric the evaluation computes for this forecast, for 34 regions,
  the three pressure levels (500, 700, 850 hPa) and the 61 lead times 0 to 360 h at 6 h, at 240x121 (1.5

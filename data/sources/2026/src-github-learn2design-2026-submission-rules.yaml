quote_extract: 'he official four-hour Objective budget. The local run reports evaluation and feasibility
  statistics together with the best feasible loss. It does not install submission dependencies automatically
  and does not reproduce an official leaderboard score. Because `--run-local` executes code from the archive,
  use it only with submissions you trust. Competition entries are not submitted as public pull requests.
  This keeps unreleased methods private unt … on surrogate inference while only calling `objective.value()`
  once. Just keep in mind that at least one (feasible) logging entry needs to be provided for a run to
  be valid. --- ## Evaluation hardware Each participant run is allocated: - 1× NVIDIA H100 SXM5 GPU (Hopper,
  80 GB HBM3) - 16 vCPUs on an Intel Xeon Platinum 8468 host - 128 GiB RAM - 40 GiB SSD - Ubuntu 24.04.3
  LTS with CUDA 13 Each submission uses a separate Python 3.12.3 environment. See the [evaluation environment
  … `scipy`, `optax`, `cma`, `cmaes`, `torch`, `botorch`, `nevergrad`, `evosax`). The evaluator installs
  the packages listed in the mandatory root-level `requirements.txt` before running your algorithm. The
  simulator and JAX package versions are fixed: declarations for `dfbench`, `differometor`, `jax`, `jaxlib`,
  and the JAX CUDA plugins are ignored. Other requirements, including `nvidia-*` library pins, are honored
  when compatible with the fixed c … on Docker base image. 2. For each run, the archive is extracted into
  a writable temporary working directory. The evaluator runs from that directory and loads the algorithm
  class from `submission.py`. Your algorithm must be able to run without network access. Do not rely on
  files written during one run being available in another. 3. For each evaluation, your submission is
  run on 10 new hidden topologies. For each topology, your `optimize()` is called once'

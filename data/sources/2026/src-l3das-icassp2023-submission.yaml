  to log in with a Google account to fill out the form. Any Google account is allowed, even if not connect
  … ll have the opportunity to submit a full journal paper to OJSP if you feel your methodology is sufficiently
  innovative to be published as a journal paper. How to format the results for the submission All participants
  must submit the only results obtained for the blind test, which was released on Feb 05, 2023. The submission
  must contain up to two zip archives (max 10 GB each), one for the audio-only track and one for the audio-visual
  track, enclosing two separate folders for the challenge tasks, named tas … the result files differ for
  the two tasks. Task 1 For Task 1 the models must predict mono-aural sound waveforms, containing the
  enhanced speech signals extracted from the multichannel noisy mixtures. Each submitted file for this
  task should be a numpy mono-dimensional array (.npy file) enclosing the floating-point samples of the
  predicted speech waveform, with a sampling rate of 16kHz. Task 2 For Task 2 the models are expected

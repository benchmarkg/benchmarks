  This repository encompasses 2 real-to-sim evaluation setups: - `Visual Matching` evaluation: Matching
  real & sim visual appearances for policy evaluation by overlaying real-world images onto simulation
  backgrounds and adjusting foreground object and robot textures in simulation. - `Variant Aggregation`
  evaluation: creating different sim environment variants (e.g., different backgrounds, lightings, distractors,
  table textures, etc) and averaging their results. We hope that our work guides and inspires future real-to-sim

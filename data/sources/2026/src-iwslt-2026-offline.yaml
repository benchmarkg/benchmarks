quote_extract: 'below) where the input language is unknown. Systems’ performance will be evaluated with
  respect to their capability to produce translations similar to the target-language references in the
  test sets. Such similarity will be measured in terms of multiple automatic metrics: COMET, BLEURT, BLEU,
  TER, and characTER. As in previous editions of the campaign, the submitted runs will be ranked based
  on COMET calculated on the test set by using automatic resegmentation of the hypothesis based on the
  reference translation by mwerSegmenter. The detailed evaluation script can be found in the SLT.KIT.
  Moreover, as a complement to automatic evaluation, human evaluation will be performed on each participant’s

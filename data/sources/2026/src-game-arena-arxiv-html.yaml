  outcome structure, we uses a domain-appropriate primary metric for each. For Chess, model strength is
  quantified via Elo-style ratings derived from the Bradley–Terry model (Bradley and Terry, 1952 [https://arxiv.org/html/2609.31473v1#bib.bib23])
  fitted to all pairwise match outcomes (draws scored as 0.5). Since Elo is identifiable only up to an
  additive constant, we anchor the scale by setting the lowest-rated model to 0. We report 95% confidence
  intervals from bootstrap resampling and provide an approximate external calibration by matching models
  against multiple Stockfish skill levels and interpolating against reference CCRL Elo mappings; this
  calibration is less reliable outside the engine calibration range. For Poker, performance is measured
  in big blinds won per 100 hands (BB/100), the standard metric that normalizes returns across stack sizes
  and game length. Each model’s BB/100 aggregates net winnings across all ∼180,000{\sim} [...] rounded

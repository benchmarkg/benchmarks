quote_extract: 'c/humanoidbench_site/) We present [HumanoidBench](https://sferrazza.cc/humanoidbench_site/),
  a simulated humanoid robot benchmark consisting of $15$ whole-body manipulation and $12$ locomotion
  tasks. This repo contains the code for environments and training. ![image](humanoid_bench.jpg) ## Directories
  Structure of the repository: * `data`: Weights of the low-level skill policies * `dreamerv3`: Training
  code for dreamerv3 * `humanoid_bench`: Core benchmar … dreamer pip install -r requirements_dreamer.txt
  # Install td-mpc2 pip install -r requirements_tdmpc.txt # Install stable-baselines3 (PPO) pip install
  stable-baselines3==2.3.2 ``` ## Environments ### Main Benchmark Tasks * `h1hand-walk-v0` * `h1hand-reach-v0`
  * `h1hand-hurdle-v0` * `h1hand-crawl-v0` * `h1hand-maze-v0` * `h1hand-push-v0` * `h1hand-cabinet-v0`
  * `h1strong-highbar_hard-v0` # Make hands stronger to be ab … n-v0` * `h1hand-sit_simple-v0` * `h1hand-sit_hard-v0`
  * `h1hand-balance_simple-v0` * `h1hand-balance_hard-v0` * `h1hand-stair-v0` * `h1hand-slide-v0` * `h1hand-pole-v0`
  * `h1hand-insert_normal-v0` * `h1hand-insert_small-v0` ### Test Environments with Random Actions ```
  python -m humanoid_bench.test_env --env h1hand-walk-v0 ``` ### Test Environments with Hierarchical Policy
  and Random Actions ``` # Define checkpoints to … oid_bench.mjx.mjx_test --with_full_model # Two-hand
  reaching python -m humanoid_bench.mjx.mjx_test --with_full_model --task=reach_two_hands --folder=./data/reach_two_hands
  ``` ### Change Observations As a default, the environment returns a privileged state of the environment
  (e.g., robot state + environment state). To get proprio, visual, and tactile sensing, set `obs_wrapper=True`
  and accordingly select the required sensors, e.g. `sensors="proprio,image,tactile"`. When using tactile
  sensing, make sure to use ` … ` * `h1-sit_simple-v0` * `h1-sit_hard-v0` * `h1-balance_simple-v0` * `h1-balance_hard-v0`
  * `h1-stair-v0` * `h1-slide-v0` * `h1-pole-v0` The robot with low-dimensional hands: * `h1simplehand-pole-v0`
  And the Unitree G1 robot with three-finger hands: * `g1-walk-v0` * `g1-reach-v0` * `g1-hurdle-v0` *
  `g1-crawl-v0` * `g1-maze-v0` * `g1-push-v0` * `g1-cabinet-v0` * `g1-door-v0` * `g1-truck-v0` * `g1-cube-v0`

quote_extract: 'nchmarks We evaluate the performance of our proposed MD-ET model across several standard
  MD benchmarks. We compare MD-ET with established MLFFs, focusing on their accuracy, stability, and efficiency.
  We evaluated MD-ET on QCML [45], MD17 [15], Ko2020 [67], xxMD [68] and SPICE [69], each presenting distinct
  challenges. Pretraining performance Table 1: Force prediction test MAE on the QCML dataset in meV Å−1
  for different models. Model MD-ET SpookyNet† PaiNN Test MAE 29.9 32.1 4 … r does not necessarily imply
  a low MD simulation error or a stable trajectory, as we will demonstrate below. MD17-10k The MD17 dataset
  [15] consists of MD trajectories for small organic molecules and has been proposed as a benchmark by
  Fu et al. [74]. Models are evaluated not only for their prediction accuracy (MAE) but also for their
  simulation stability and faithfulness. Stability is measured by the time until a simulation becomes
  unstable (capped at 300 ps), and faithfulness is measured by h(r), the distribution of interatomic distances
  [74]. Inference speed, which is critical for MD simulations, is also compared (see Appendix A.6 for
  evaluation details … the-art models. In addition to fine-tuning ET-MD for 2000 steps, which we see as
  the default way to use a large-scale pretrained model, we also report results for training the model
  directly on MD17. Since there is some overlap with the pretraining set, fine-tuning results for ethanol
  (marked with a *), have only limited significance. We also include fine-tuning results for Orb-v2 [36],
  which was released recently and is a popular unconstrained mod … ale or long-duration simulations. Transfer
  learning from lower-level theories, such as DFT, presents an effective strategy to approximate CCSD(T)
  using the expensive CCSD(T) samples efficiently [76]. We use the MD17@CCSD(T) dataset [19], which recalculates
  trajectories for molecules in MD17 using CCSD(T) to test this approach using MD-ET. Although MD-ET was
  pretrained on the PBE0 level, Table 3 demonstrates that MD-ET can effectively capture higher-level interactions
  through fine-tuning with a limited number of CCSD(T) samples. When fine-tuned on 1,000 CCSD(T)-level
  samples, MD-ET achieves lower mean absolute error (MAE) than all competing models for three of the five
  structures. For toluene, its MAE is comparable to GemNet-T, while for benzene, it exhibits the highest
  … iodic boundary conditions, treating the slabs instead as a finite molecule far from its training distribution.
  See Appendix A.6.3 for fine-tuning details. xxMD The xxMD dataset by Pengmei et al. [68] goes beyond
  the MD17 dataset by incorporating nonadiabatic MD trajectories specifically designed to capture chemical
  reactions, including geometries sampled from the PES of reactive intermediates, transition states, and
  products. Importantly, xxMD datasets are also temporal … ing, each sample was augmented with two transformations—random
  rotations and random reflections. A.6.1 MD17-10k For fine-tuning on the MD17 experiments we follow the
  experimental setup of [3], namely we sample 9500/500/10000 conformations for train/val/test splits for
  each molecule and evaluate the force prediction error on the test set. The hyperparameters for each
  molecule are shown in Table 9. Table 9: Fine-tuning Hyperparameter for MD17 Molecule Aspirin Ethanol
  Naphthalene'

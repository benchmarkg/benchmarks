  task is to predict the future trajectories of objects in the nuScenes dataset. A trajectory is a sequence
  of x-y locations. For this challenge, the predictions are 6-seconds long and sampled at 2 hertz. ##
  Participation The nuScenes prediction [evaluati … best | ## Submission rules ### Prediction-specific
  rules * The user can submit up to 25 proposed future trajectories, called `modes`, for each agent along
  with a probability th … is proposed set of trajectories matches the ground truth. * Up to two seconds
  of past history can be used to predict the future trajectory for each agent. * Unlike previous challenges,
  the leaderboard will be ranked according to performance on the nuScenes val set. This is because we
  cannot release the annotations on the te … tions to the server. To prevent overfitting on the val set,
  the top 5 submissions on the leaderboard will be asked to send us their code and we will run their model
  on the test set. The winners will be chosen based on their performance on the test set, not the val
  set. * Every submission to the challenge must be accompanied by a brief technical report (no more than
  1-2 pages) describing the method in sufficien … rcumvent the rules will be excluded from the competition.
  * Each user or team can submit at most three results *per month*. These results must come from different

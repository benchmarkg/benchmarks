quote_extract: '${buttonlink?text=Download Challenge Data&url=#!Synapse:syn2787211&highlight=true}|${buttonlink?text=Download
  Original Data&url=#!Synapse:syn3130840&highlight=true} In this section, we describe the datasets that
  are given to the participants for each of the four networks. For each network (Network1,..., Network4)
  there are three types of files, which contain the expressi … lists probably contain incorrectly annotated/predicted
  TFs that are in truth not regulatory proteins. The scoring, however, will be done on the known transcription
  factors. ### Submission information Submitted networks must be directed and unsigned. Self-interactions
  (auto-regulatory loops) are ignored in the evaluation (they will be removed from the gold standard networks).
  For each network, submit a ranked list of no more than 100,000 regulatory link predictions ordered according
  to the confidence you assign to the predictions, from the most reliable (first row) to the least reliable
  (last row) prediction. You can submit less than 100,000 edges. Links (pairs of nodes) that are not part
  of the submitted list … regulate B). Save the file as text, and name it: **DREAM5\_NetworkInference\_TeamName\_Networki.txt**
  where TeamName is the name of the team with which you registered for the challenge, and i is 1, 2, 3,
  or 4. ### Some notes on the in silico dataset The in-silico network and dataset was generated using
  [GeneNetWeaver (GNW) version 3.0](http://gnw.sourceforge.net/), which will be released after the DREAM5
  conference. The framework is very similar to the previous edition of the challenge (the DREAM4 in-silico
  network challenge), except that for DREAM5 we simulate the exact same number and types of experiments
  as available in one of the microarray compendia extracted from actual measurements. The in-silico data
  is presented in the same format as the microarray data, i.e., i'

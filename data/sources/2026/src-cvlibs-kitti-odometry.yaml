  sequences (11-21) without ground truth for evaluation. … For this benchmark you may provide
  results using monocular or stereo visual odometry, laser-based SLAM or algorithms that combine
  visual and LIDAR information. … our evaluation computes translational and rotational errors for
  all possible subsequences of length (100,...,800) meters. … On 03.10.2013 we have changed the
  evaluated sequence lengths from (5,10,50,100,...,400) to (100,200,...,800)

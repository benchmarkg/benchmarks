  exposed to webpages from the same website during training and has likely encountered similar tasks.
  The rest of data is used for training, which contains 1,009 tasks from 73 websites. 4.2 Data Preprocessing
  and Evaluation We apply simple heuristics to clean the raw HTML documents, keeping only elements that
  are visible and carry substantial semantic meaning, as determined by their … t, and neighboring elements.
  This effectively reduces the average number of elements from 1,135 to 580, while still maintaining an
  overall recall of 94.7% for the target element in the training data. For evaluation, we first calculate
  Element Accuracy that compares the selected element with all acceptable elements, and Operation F1 that
  calculates token-level F1 score for the predicted operation. This is the same as accuracy for Click,
  but considers the correctness of the input value for Type and Select Option. Each step of the task is
  evaluated independently with the ground truth action history provided. We then define Step Success Rate
  and Success Rate (for the whole task). A step is regarded as successful only if both the selected element
  and the predicted operation are correct. A task is regarded successful only if all steps have succeeded.
  It is therefore a stringent metric. For step-wise metrics, we report macro average across tasks. 4.3

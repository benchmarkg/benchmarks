  1) diverse domains, websites, and tasks, 2) use of real-world websit … sub-optimal website designs.
  Finally, it shall support diverse and sophisticated interactions with websites. Tasks from users can
  be highly diverse and take a large number of steps to complete (e.g., the task in Figure 1(b) would
  take 14 actions). An agent that only supports simple tasks may provide limited value to users. Building
  an agent for the web is not entirely new. There have been numerous prior efforts in varied forms. However,
  none … ding generalist web agents. The HTML document of real-world webpages may contain thousands of
  elements, which makes it infeasible or too costly to be fed into an LLM’s context. To address this issue,
  we propose MINDACT, a two-stage model that involves first using a fine-tuned small LM to filter the
  web elements and then using an LLM to select from the filtered elements in a multi-choice question answering
  fashion and predict the corr … o complete a specific task on the target website through a series of
  actions. Each instance in our dataset contains three components: Task description, which outlines the
  high-level goal of the task. We intentionally avoid low-level, step-by-step instructions, aiming to
  foster the development of agents that can comprehend and carry out tasks in a more autonomous fashion,
  rather than merely following prescriptive directives. Action sequence, which is the sequence of actions
  required to accomplish the task on the website. Each action in the sequence comprises a (Target Element,
  Operation) pair. The Target Element is an interactable element on the current webpage, and the Operation
  refers to the action to be executed on that element. We support three common operations: Click (also
  including Hover and Press Enter), Type, and Select Option. For Type and Select Option, they also require
  an additional value as an argument. Actions in a sequence often span multiple webpages of a website.
  3 Task Description: Show me the reviews for the auto … fic for replaying the interaction if needed,
  and trace file that comprises the complete interaction trace during the task annotation process. The
  agent receives the task description in the beginning. At each step, it also receives the current webpage
  and the history of previous actions. The objective is to accurately predict the subsequent action, which
  encompasses the target element for interaction and the operation. 2.2 Data Collection Our data collection
  process consists of four stages: website selection, task proposal, task demonstration, and task verification.

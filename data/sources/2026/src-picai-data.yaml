  𝗦𝗲𝘁𝘂𝗽 Email organizers Data Splits 🗃¶ Data is sampled into four splits, with the following use-cases:¶
  Public Training and Development Dataset (1500 cases): Available for all participants and researchers,
  to train and develop AI models. All data is fully anonymized and made available under a non-commercial
  CC BY-NC 4.0 license. Includes 328 cases from the ProstateX Challenge. For all updates/fixes regarding
  this dataset, please join the challenge and check out our dedicated forum post on this topic. Imaging
  data has been released via: zenodo.org/record/6624726 (DOI: 10.5281/zenodo.6624726) Annotations have
  been released and are maintained via: github.com/DIAGNijmegen/picai_labels ¶ Private/Sequestered Training
  Dataset (7607 cases): Used exclusively by the organizers to retrain the top-ranking 5 AI algorithms,
  with large-scale data, during the Closed Testing Phase.¶ Hidden Tuning Cohort (100 cases): Used for
  a live, public leaderboard that enables model selection and tuning, during the Open Development Phase.¶
  Hidden Testing Cohort (1000 cases): Used to determine the top 5 AI algorithms at the end of the Open
  Development Phase. Used to benchmark AI, radiologists, and test all hypotheses at the end of the Closed
  Testing Phase. Includes internal testing data (unseen cases from seen centers) and external testing
  data (unseen cases from an unseen center). A subset of 400 cases from this cohort is used to facilitate
  the PI-CAI: Reader Study.¶ Imaging Data 🏥¶ The complete dataset used for the PI-CAI challenge comprises
  a cohort of 9000–11,000 prostate MRI exams, curated from three Dutch centers {Radboud University Medical
  Center (RUMC), Ziekenhuis Groep Twente (ZGT), Prostaat Centrum Noord-Nederland (PCNN)} and one Norwegian
  center {St. Olav’s Hospital, Trondheim University Hospital (STOH)}. Institutional review boards of all
  four centers have waived the need for informed patient consent, with respect to the retrospective scientific
  use of anonymized clinical data in this challenge.¶ All patient exams are of men suspected of harboring
  csPCa (e.g. due to elevated levels of PSA, abnorm … nding in _t2w.mha, _sag.mha, _cor.mha, _hbv.mha,
  _adc.mha here). For part of the Hidden Testing Cohort, DCE sequences will only be available to radiologists
  participating in the PI-CAI: Reader Study. But they will not be available for AI algorithms, within
  the context of this grand challenge, at any given stage.¶ To dive deeper into the clinical significance
  of different prostate MRI sequences, and why they are useful for csPCa detection/diagnosis, feel free
  to have a look at:¶ R.R.M. Engels, B. Israël, A.R. … nvariant to training on misaligned sequences. We
  believe that this is the only way of developing AI models using thousands of cases, as manual registration
  is too labour intensive at scale.¶ However, we can confirm that all sequences for each case in the Hidden
  Tuning Cohort and the Hidden Testing Cohort are co-registered by the organizers (given that we only
  want to evaluate diagnostic performance, and thereby try to minimize the effects of external factors).
  Manual registration, when deemed necessary, is performed using ITK-SNAP v3.80 (rigid transformation
  with six degrees of freedom for 3D translation and rotation). This was performed for 85/1000 (8.5%)
  of the test cases.¶ Annotations ✍¶ Annotations for the Private/Sequestered Training Dataset, Hidden
  Tuning Cohort and Hidden Testing Cohort will not be released publicly. Annotations for the Public Training
  and Development Dataset have been released and maintained via: github.com/DIAGNijmegen/picai_labels¶
  Human Expert-Derived Annotations¶ Voxel-level csPCa lesion annotations are delineated and/or patient-level
  csPCa outcomes are recorded, by one of 10 trained investigators or 1 radiology resident, under supervision
  of one of 3 expert radiologists, at RUMC, PCNN or STOH. Each annotation is derived using all available
  MRI scans, diagnostic reports (radiology, pathology) and whole-mount prostatectomy specimen (if applicable).
  Lesion delineations … reference standard for csPCa is crucial. The PI-CAI reference standard aims to
  utilize the best possible evidence to define the ground-truth for every case in the validation and testing
  cohorts, i.e. histologically-confirmed (ISUP ≥ 2) positives, and histopathology (ISUP ≤ 1) or MRI (PI-RADS
  ≤ 2) negatives, with follow-up (≥ 3 years), as detailed below:¶ Patients with negative MRI (i.e. benign
  or carrying PI-RADS 1–2 lesions) generally do not undergo biopsies or RP and lack histologically-confirmed
  evidence for the absence of csP … are excluded. Negative patient exams with 100% csPCa diagnosis-free
  survival (DFS) after at least 3 years, are included.¶ Training Datasets¶ Patient cases used for the
  training datasets of PI-CAI are annotated with the same reference standard as used for the ProstateX
  challenge, i.e. histopathology (ISUP ≥ 2) positives, and histopathology (ISUP ≤ 1) or MRI (PI-RADS ≤
  2) negatives, without follow-up.¶ ¶ Figure. Typical workflow used to establish the ground-truth for

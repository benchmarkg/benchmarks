quote_extract: 'timodal Datasets Overview Cognata Dollar Street Multilingual Spoken Words People’s Speech
  Unsupervised People’s Speech About About MLCommons Jobs Leadership Our Members Rising Stars Program
  Policies Insights News & Blogs Research Get Involved Search AILuminate Safety tests AI chat systems
  using 3,900 confidential prompts, 325 in each of 12 hazard categories, and judges every response against
  a published assessment standard. The system receives a percentile score from 0 to 100, overall and for
  each hazard category, on a scale calibrated against a set of reference systems that span the range of
  higher to … , and failures are excluded from scoring. Before MLCommons scores with an evaluator release,
  it checks that release against human judgments made under the Assessment Standard. The reference is
  human judgment, not another AI system. New in Safety 1.2 Released on September 9, 2026, Safety 1.2 replaced
  the three parts of the benchmark that most affect what a score means: the judge, the prompt sample,
  and the scale. Part Before Safety 1.2 Since Safety 1.2 What it changes for a reader Evaluator Large
  language models (LLMs) acting as judges An evaluator trained by MLCommons, with no general-purpose language
  model as judge No AI vendor’s model scores its competitors’ responses, and judgments do not shift when
  a third-party model is updated Prompts All 12,000 official prompts Problem Set 2.0: 3,900 official prompts,
  325 per hazard category, selected with item response theory A shorter test that still runs from easy
  to hard prompts; it removed saturated prompts while maintaining the signal generated from the full 12,000
  Scoring A grade from Poor to Excellent, set mostly by comparison with a single reference system chosen
  by the benchmark A score from 0 to 100 on a fixed scale, calibrated against a distribution of safety
  performance from a set of reference systems No single system’s behavior sets the bar, and the scale
  does not move as more systems are tested Every result records the version labels that produced it, including
  the evaluator version, and results with the same labels compare directly, across systems and over time.
  Scores from Safety 1.2 are not comparable with grades from earlier versions, and MLCommons does not
  re-score existing results: it does not change what a score means without changing the label. Safety
  1.2.1, the label on the public results, is a minor update to the Safety 1.2 scoring method that aligns
  it with Jailbreak 1.1. Reading a Safety score A Safety score is a percentile. It ranges from 1 to 100
  and tells you what share of SUTs perform worse than the tested model. The Safety percentile score correlates
  very highly (.99+) with the percent of responses that are non … IRT). The same methods are used to create
  percentile scores for other standardized tests such as the Scholastic Aptitude Test (SAT) and medical
  licensing exams. These methods rely on carefully selected prompts and reference models. Selecting prompts
  For Safety 1.2, MLCommons drew Problem Set 2.0 from the original 12,000 official prompts. We submitted
  all 12,000 prompts to 12 SUTs and examined patterns of violation. A large proportion of the prompts
  elicited zero failures from the responding SUTs. These are “easy”. Some prompts elicited many failures,
  and these are “difficult”. Some … organizations can test privately in Candela, without changing anyone
  else’s score. A reference set also suits a consensus-built industry benchmark: no single model serves
  as the reference for its developer’s other models or for competitors’ models. The Safety 1.2.1 release
  relies on an expanded reference set we made based on stakeholder feedback after Safety 1.2. The two
  major principles guiding selection of AI systems for the reference set are: The set should represent
  each major class of model that is in scope for testing. The set should represent as many model developers

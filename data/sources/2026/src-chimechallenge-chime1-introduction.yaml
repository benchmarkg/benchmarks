quote_extract: 'emands of a genuine domestic speech recognition application, the PASCAL CHiME challenge
  has been somewhat simplified to make the competition more widely accessible, while still retaining the
  essential difficulty posed by additive noise. To this end, the ASR task is speaker dependent and employs
  a small but phonetically confusable vocabulary. Further, the microphone-speaker geometry remains fixed,
  focusing the task on the problems of additive noise rather than on the problem of channel variability
  that is also encountered in distant microphone speech processing. However, no compromise has been made
  with the noise background — the recordings come from a genuine living room (in a house with two small
  children!) measured over a period of several weeks. The SNRs employed in the challenge range between
  9 dB down to -6 dB; a range resulting from the natural variation of the noise background rather than
  artificial scaling. In contrast to other noise robust speech recognition tasks, the utterances to be
  recognised, although supplied in a pre-segmented form, are locatab … ., there are hours worth of acoustic
  context for each utterance. We hope participants will be able to exploit the continuous background data,
  for example, by learning spatial and spectral properties of the commonly occurring competing sound sources.
  Recordings have been made with binaural microphones. Although, larger microphone arrays would be more
  effective, the binaural configuration has particular interest: we hope by constraining the task to just
  two microphones, we will better enable engineers building solutions to robust ASR to trade insig'

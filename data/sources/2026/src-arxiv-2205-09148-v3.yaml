  those, the diseases’ incidence and prevalence, and symptoms and risk factors’ likelihood ratios across
  various geographies, age and sex groups were extracted. The KB was organized by diseases and reviewed
  by several doctors, ensuring the diseases’ descriptions included atypical presentations. This KB was
  used to design DXA, a rule-based AD system that has been deployed in a commercial telemedicine platform.
  In total, the knowledge base covers a set of 440 pathologies and 802 symptoms and antecedents. The pathologies
  are grouped in overlapping subgroups based on common characteristics referred to as chief complaints
  (Aronsky et al., 2001; Thompson et al., 2006). In this work, we focus on pathologies belonging to the
  chief complaint related to cough, sore throat, or breathing issues. This group contains 49 pathologies
  covering 110 symptoms and 113 antecedents. Extending the dataset to all pathologies is left for future
  work. Each disease d in the KB is characterized by either an incidence rate, a prevalence rate, or both

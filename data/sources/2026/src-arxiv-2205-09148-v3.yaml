  their age, sex, and an initial evidence to the model at the beginning of the interaction. The model
  then iteratively inquires about a symptom or an antecedent, until either all the relevant symptoms and
  antecedents have been collected or a maximum number of turns T is reached. At the end of the interaction,
  a differential diagnosis is predicted. We use T = 30 in all experiments. Training is performed using
  a NVIDIA V100 GPU. 4.3 Results An AD system is typically tasked to collect (i) relevant evidences from
  a patient, (ii) make accurate predictions regarding the patient’s differential, and (iii) operate in
  a minimum number of turns. As such, we report on the interaction length (IL), and evaluate the evidence
  collection by measuring the recall (PER). We do not measure the evidence precision as it is sometimes
  necessary to ask negative questions. Additionally, we calculate the recall (DDR), precision (DDP) and
  F1 score (DDF1) of the differentials. Finally, we report the accuracy of the inclusion of the ground

quote_extract: 'asures work? Control evaluations provide a rigorous testing framework, structured as an
  adversarial game between teams: Blue Team: Designs control protocols using both trusted and untrusted
  models Red Team: Creates attack policies that try to cause catastrophic failures despite the blue team’s
  control protocols White Team (often implicit): Sets the rules of engagement, ensuring evaluations are
  fair and realis … move. Measuring Success: Safety and Usefulness After running the evaluation, we can
  measure the protocol’s performance: Safety: The estimated probability that no side tasks would be successfully
  completed in the simulated deployment while using the attack policy. Usefulness: The estimated proportion
  of main tasks that would be successfully completed in that simulated deployment while using the honest
  policy. In ControlArena, you typically run two sets of evaluations with almost identical setups: one
  with EvalMode.HONEST using … it both honest and attack policies, and it automatically selects the appropriate
  one based on the configured EvalMode. Plot safety and usefulness against each other and you get a Pareto
  frontier; the best achievable combinations of safety and usefulness with current techniques. The goal

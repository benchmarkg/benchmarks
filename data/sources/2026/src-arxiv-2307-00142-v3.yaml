  task in more detail. Zero-shot STLF: For this task, pretrained models are asked to provide day-ahead
  forecasts for unseen simulated and real buildings. Our use of “zero-shot” here refers to a setting where
  only one week of historical data is presumed available, and is thus insufficient for training or fine-tuning
  a deep neural network. All available years are used for each test building. Transfer learning: Our transfer
  learning task assumes 6 months of metered data has been collected for each target building, about ∼180
  training samples. Fine-tuned models are then tasked with day-ahead forecasting for the next 6 months
  using a 24-hour sliding window. 4.1 Real Building Datasets Here, we briefly describe the real building

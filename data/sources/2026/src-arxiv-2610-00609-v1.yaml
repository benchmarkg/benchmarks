  3.1 Data collection Each LRB item is authored by practicing U.S. attorneys and consists of an open-ended
  legal research question, a gold answer, a curated source list, and a binary grading rubric (Section
  3.3). Items are designed to require legal reasoning rather than factual lookup, are written around novel
  fact patterns to reduce memorization, and are included only when the correct answer is objective enough
  for attorney agreement. When legal authority may change over time, questions are temporally anchored
  with an explicit answer date (e.g. “Answer as of [date]”), and the agent is prompted to answer as of
  that date. Each item is ind … al attorney, and ground-truth materials are written without AI assistance
  beyond light copyediting. In total, 15 practicing attorneys, with an average of 15 years of legal experience,
  contributed to authoring and review, and building each item required approximately four attorney-hours.
  3.2 Dataset LRB comprises 413 questions spanning eight areas of law and ten question types. The corpus
  is partitioned into a 5-question public sample, a 200-question validation set, and a 208-question test
  set. We publicly release the five-question sample together with the full agent harness1 to support reproducibility.
  The validation and test questions are held out to limit contamination. Unless noted otherwise, results
  in this paper are reported over the full 413-question corpus. Questions are multi-label: 37.8% carry
  more than one area of law (1.41 areas on average). For compa … ten underlying question types and their
  mapping to this scheme. Table 1 gives the full composition. Each question carries a curated source list
  (6.2 sources on average, median 6, up to 23) and a binary rubric (9.4 items on average, median 9, up
  to 31). The gold-standard answers average 536 words (median 429) in length. 3.3 Rubric and metrics Each
  que … ying every criterion is therefore equivalent to producing a correct answer by that expert standard.
  Criteria are weighted [+1], [+2], or [+3], with at least one [+3] item capturing the central legal conclusion.
  We report all-pass as the primary metric: a response is correct only if every rubric criterion is satisfied.
  Weighted pass, the share of available rubric weight a response earns, is reported only as a secondary,
  partial-credit measure. Grounding is part of correctness: the rubric specifies which authorities a correct
  answer must cite, and any invalid cited URL fails a source check that marks the entire response wrong.

quote_extract: 'main knowledge. 2.4 Benchmarks and community efforts The CelloAI benchmarks [19] provide
  a framework for evaluating AI assistants in HEP contexts, focusing on code documentation and generation
  tasks. Most recently, Collider-Bench [20] introduced a benchmark in which LLM agents must reproduce
  published LHC searches as executable simulation-and-selection pipelines, scored on predicted signal-region
  yields, and reports that no agent reliably beats a physicist-in-the-loop baseline. Both CelloAI and
  Collider-Bench are deliberately scoped to controlled, automatica … imates backgrounds, evaluates systematic
  uncertainties, performs the blinded statistical inference, and drafts the documentation — in one case
  delivering a measurement with no prior e+e− counterpart. The two directions are complementary: Collider-Bench
  supplies the controlled, quantitative evaluation of agent capability that our single-run demonstrations
  do not, while JFC probes how far an autonomous pipeline can carry a complete measurement on real data.

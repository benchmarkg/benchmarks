quote_extract: 'simulations create distribution shifts that can bias cosmological parameter constraints;
  and varying simulation setups across studies make method comparison difficult. To address these difficulties,
  we present the first weak lensing benchmark dataset with several realistic systematics and launch the
  FAIR Universe Weak Lensing Machine Learning Uncertainty Challenge. The challenge focuses on measuring
  the fundamental properties of the universe from weak lensing data with limited training set and potential
  distribution shifts, while providing a standardized bench … lity and observational systematics. The
  challenge is organized into two phases of machine learning competitions, with particular emphasis on
  handling biased (i.e., systematic-contaminated) test data. Participants are required not only to provide
  point estimates of (Ωm, S8), but also to quantify the associated uncertainties. In addition, to probe
  robustness against simulation-model mismatch, some test datasets are generated from alternative physical
  models. Participants must therefore perform out-of-distribution (OoD) detection to identify data that
  are inconsistent with the training simulations. By comparing the performance and robustness of different
  … lensing datasets that explicitly addresses systematic uncertainties and distribution shifts. The ML
  competition is built on our experience running several competitions in particle physics and beyond.
  These include the FAIR Universe HiggsML uncertainties challenge [17] (NeurIPS 2024 competition), the
  TrackML Challenge [18] (NeurIPS 2018 competition), the LHC Olympics [19], AutoML/AutoDL (NeurIPS 2019
  competition) [20], and other competitions [21–25], but none of th … cal dataset. 2 Data We use a simulated
  weak gravitational lensing dataset for this competition to produce data representative of weak lensing
  measurement from the Hyper Suprime-Cam (HSC) survey [28]. The dataset is generated by running high-resolution
  cosmological N-body simulations [26, 27] and a ray-tracing algorithm, assuming the same statistical
  properties (e.g., redshift distribution and survey mask) as the HSC Three-Year shape catalogue [28,
  29]. Specifically, for each cosmological model, we run three N-body … ted weak lensing convergence maps
  x. These quantities may be obtained using, for example, posterior sampling methods such as Markov chain
  Monte Carlo (MCMC), or through maximum likelihood estimation. The test data of this phase are drawn
  from the same distribution as the training data (i.e., in-distribution, InD). 3.2 Phase 2: Out-of-Distribution
  Detection Due to limitations in our simulations and the modeling of various systematic effects, there
  may be a mismatch between the simulated data and real observations. This simulation-observation mismatch,
  or distribution shift, can introduce significant biases in parameter inference [15]. In the second phase
  of the competition, participants have to tackle this problem by developing methods for OoD detection,
  6 i,e., identifying the test data that deviates from the training distribution. The main task is to

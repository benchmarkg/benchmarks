quote_extract: "EU AU Insights Introducing BigLaw Bench Presenting BigLaw Bench—a version of our internal
  dataset for evaluating large language models (LLMs) and model systems on complex legal tasks. by Harvey
  Team•Aug 29, 2024 Overview Today we are announcing the first public results of BigLaw Bench—a public-facing
  version of our internal dataset for evaluating large language models (LLMs) and model systems on complex
  legal tasks. BigLaw Bench is a framework for quantitatively evaluating the performance of LLMs on real-world
  legal tasks; supplementing prior work that measures LLM legal reasoning in more structured settings.
  Harvey’s proprietary models significantly outperform publicly available LLMs, but all models show substantial
  room for improvement when benchmarked against full completion of tasks performed by lawyers. The results
  are promising. They show that legal AI systems have the poten … fficiency of lawyers by completing real
  world tasks. BigLaw Bench Tasks “Existing multiple-choice or one-size-fits-all benchmarks are insufficient
  to capture the real billable work that lawyers do. ” At Harvey, our goal is always to build and evaluate
  LLMs for actual, billable work performed by lawyers and professionals reflective of our client base.
  Our benchmarks are conceptualized and designed by our legal research team, composed of attorneys with
  experience across a wide range of practice areas and BigLaw firms, and constructed using publicly available
  documents to enable transparent evaluation under realistic conditions. In defining benchmark tasks,
  we draw on a familiar feature of the legal profession: the time entry. Time entries cover all of the
  tasks that lawyers do in service of their clients and provide a concise way to convey the task performed
  and the value of that work. Because all work is billed, building … g benchmarks. Effectively capturing
  how much models can facilitate this kind of work required developing far more sophisticated and task-specific
  grading criteria than those used in prior benchmarks. By converting time entries into model-based tasks
  (prompt / document pairs), we are able to identify and evaluate how models can contribute to real, high-value
  legal work. These tasks are then sub-divided by other relevant taxonomies, such as the practice area—litigation
  or transactional—and the portion of a matter the task would facilitate. The following tables outline
  the major categories and distribution of BigLaw Bench core tasks, i.e. tasks that we use to test fundamental
  model capabilities to solve problems involving reasoning about, analyzing, and discussing legal concepts
  and text without the need for multi-part or agentic workflows. Transactional Task Fraction of Core Tasks
  Corporate Strategy & Advising 28.3% Drafting 24.5% Legal Research 13.2% Due Diligence 11.3% Risk Assessment
  & Compliance 9.4% Negotiation Strategy 5.7% Deal … 14.9% Case Law Research 8.5% Transcript Analysis
  8.5% Document Review & Analysis 6.4% Regulatory & Advising 6.4% Trial Preparations & Oral Argument 6.4%
  Evaluation Methodology Harvey’s research team developed bespoke rubrics to evaluate each task. These
  rubrics establish objective criteria that would be necessary for a model response to effectively accomplish
  a given task. They also penalize common LLM failure modes such as incorrect tone or length, irrelevant
  material, toxicity, and hallucinations. Combined, these rubrics effectively capture everything a model
  must do to effectively complete a task, and everything it must avoid to ensure it completes that task
  in a safe, effective, and trustworthy manner. In order to convert these criteria into a benchmark, each
  affirmative requirement was assigned a positive score based on its importance to completing the relevant
  task. Negative criteria, such as hallucinations, were assigned negative scores as the human effort to
  correct errors can reduce the utility of an otherwise complete piece of AI work product. Answer score
  is computed by taking the combination of these positive and negative points and dividing by the total
  number of positive points available for a task. “Answer score represents: What % of a lawyer- quality
  work product does the model complete for the user? ” In addition to grading the substantive content
  produced by the model, we also benchmark the … rmination fee is $10,000,000.” A source was defined as
  any statement or link affirmatively connecting a sentence needing a source to a specific document or
  part of a document that proves that point. “Source score represents: What % of correct statements does
  the model support with an accurate source? ” Though related, source score and answer score are independent.
  A model can make a number of correct assertions (high answer score) while failing to provide traceability
  of those assertions to relevant source documents to facilitate user trust and validation (low source
  score). A sample of instantiated tasks and their associated rubrics are included in the Appendix. Results
  “Harvey's proprietary models outperform leading foundation models on domain-specific tasks, producing
  74% of a final, expert lawyer-quality work product - the outputs are more detailed, capture more nuance,
  and are much closer to final lawyer quality. ” The below graphs summarize model performance on BigLaw
  Bench core tasks. On answer scores, Harvey’ … ompt. To ameliorate this, the Harvey team attempted to
  derive custom prompts and instructions for all models that would require sources to be included after
  affirmative statements about the document. These prompts had a substantial negative impact on model
  performance, as the foundation models would consistently hallucinate sources (either document text,
  page number, or both) leading to weak source scores and far worse answer scores. In short, the foundation
  model … sticated LLM agents. Mapping and benchmarking this full range of tasks will be necessary for
  the effective development of domain-specialized AI. As we continue to build this more ambitious benchmark,
  we intend to deepen and formalize our collaboration with both client and industry partners like vals.ai.
  These collaborations are essential to developing an industry standard benchmark for measuring and improving
  the ability of AI systems to perform the most complex knowledge work. Appendix Here we pro"

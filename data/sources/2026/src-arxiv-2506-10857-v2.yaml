  We present VRBench, a long narrative video benchmark for multi-step reasoning. VRBench includes 960
  manual-filtered narrative videos, covering 8 languages and 7 video categories that are suitable for
  reasoning about temporal relations. We also provide high-quality stepwise annotations for reasoning,
  which are labeled and reviewed by human experts. Each video incorporates 8-1 … that supports both multi-step
  annotation and evaluation. Abstract We present VRBench, the first long narrative video benchmark crafted
  for evaluating large models’ multi-step reasoning capabilities, addressing limitations in existing evaluations
  that overlook temporal reasoning and procedural validity. It comprises 960 long videos (with an average
  duration of 1.6 hours), along with 8,243 human-labeled multi-step question-answering pairs and 25,106
  reasoning steps with timestamps. These videos are curated via a multistage filtering process including
  expert inter-rater reviewing to prioritize plot coherence. We develop a human-AI collaborative framework
  that generates coherent … emphasize disciplinary competence. To conduct multi-step reasoning chain annotation,
  we develop a human-AI collaborative approach, generating 8-10 QA pairs per video with explicit temporal
  grounding. Each question requires no less than 2 reasoning steps annotated with precise timestamps (Figure
  3), validated through iterative expert review (95% interannotator agreement). The taxonomy spans seven
  reasoning types from event prediction to implicit inference, ensuring comprehensive cove … om knowledgecentric
  benchmarks. By separating domain expertise from contextual analysis, our work aids in developing models
  capable of sustained, human-like understanding in real-world video content. The entire suite, including
  annotation protocols and evaluation tools, has been fully open-sourced to advance reasoning research.

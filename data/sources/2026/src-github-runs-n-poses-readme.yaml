quote_extract: "co-folding prediction dataset and benchmark This repository accompanies the pre-print:
  [\"Have protein-ligand co-folding methods moved beyond memorisation?\"](https://doi.org/10.1101/2025.02.03.636309)
  This benchmark tests the ability of protein-ligand co-folding methods to generalize to systems different
  from those in their training set. This is a zero-shot benchmark, provided that your method uses a structural
  training cutoff of 30 September 2021. Find ML-ready versions of the [dataset](https://polarishub.io/datasets/plinder-org/runs-n-poses-dataset)
  and [benchmark](https://polarishub.io/benchmarks/plinder-org/runs-n-poses) at [Polaris](https: … ligands)
  structure in CIF format ... ``` ### `msa_files.tar.gz` Contains the MSA files for each system in the
  same fashion as seen in `examples/inputs/msa_files`. ### `all_similarity_scores.parquet` Contains all
  calculated similarity metrics for Runs N' Poses dataset systems against the entire PDB up until 5 January
  2025. This was used to get the closest training systems up to 30 September 2021 based on SuCOS-pocket
  similarity (`sucos_shape_pocket_qcov`). Here is how you can obtain the systems to use and corresponding
  similarity scores for a different training cutoff, with the example of the 1 June 2023 cutoff used by
  Boltz-2: ```python similarity_df_boltz2 = all_similarity_scores[all_similarity_scores[\"target_release_date\"\
  ] < boltz_training_cutoff].sort_values(by=\"sucos_shape_pocket_qcov\", ascending=False).groupby(\"group
  … benchmarked method. To execute those command please follow instructions on their github pages. ##
  Extracting Accuracy Metrics See the `examples/utils`, `examples/analysis` and `extract_scores.ipynb`
  for instructions on how to run accuracy scoring and extract relevant accuracy metrics for each method.
  This requires `ground_truth.tar.gz`, `inputs.json` and `annotations.csv`. **NOTE**: This requires a
  version of the Chemical Components Dictionary prepared for OpenStructure and exported as an environment
  variable, as follows (see [#6](https://github.com/plinder-org/runs-n-poses/issues/6)): ```sh wget https://files.wwpdb.org/pub/pdb/data/monomers/components.cif.gz
  chemdict_tool create components.cif.gz compounds.chemlib pdb -i export OST_COMPOUNDS_CHEMLIB=compounds.chemlib
  ``` ## Similarity scoring See `similarity_scoring.py` for how we calculated the similarity metrics.
  This requires an entire copy of the PDB, the PLINDER dataset, and large amounts of memory. The same
  functionality will shortly be added to [PLINDER](https://github.com/plinder-org/plinder). The processed
  output of this script can be found in `all_similarity_scores.parquet`."

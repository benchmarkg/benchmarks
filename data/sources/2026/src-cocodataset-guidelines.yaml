quote_extract: 'sponding COCO training set. Validation data may also be used for training when submitting
  results on the test set (although starting in 2017 the validation set only has 5K images, so the benefits
  of this are minimized). Note that the 2017 train/val data includes the same images as the 2014 train/val
  data just organized differently, so there is no benefit of using 2014 training data for the 2017 competition.
  External data of any form is allowed. Any and all external data used for training must be specified
  in the "method description" when uploading results to the server. We emphasize that any form of annotation
  or use of the COCO test sets for supervised or un … other two splits removed. The original purpose of
  the four splits was to protect the integrity of the challenge while giving researchers flexibility to
  test their system. After multiple years of running the challenges, we saw no evidence of overfitting
  to specific splits (the output space complexity and the test set size protect against simple attacks
  such as wacky boosting). Therefore, we simplified participation in the challenges accordingly in 2017.
  2017 Test Set Splits The 2017 COCO … d Val ~5K no limit immediate none Test-Dev ~20K 5 per day immediate
  year-round Test-Challenge ~20K 5 total workshop workshop Test-Dev: The test-dev split is the default
  test data for testing under general circumstances. Results in papers should generally be reported on
  test-dev to allow for fair public comparison. The number of submissions per participant is limited to
  5 uploads per day to avoid overfitting. Note that only a single submission per participant can be published
  to the public leaderboard (a paper, however, may report multiple test-dev results). The test-dev server
  will remain open year-round. Test-Challenge: The test-challenge split is used for COCO challenges hosted
  on a yearly basis. Results are revealed during the relevant workshop (typically at ECCV or ICCV). The

quote_extract: "notable changes to this project will be documented in this file. The format is based on
  [Keep a Changelog](https://keepachangelog.com/en/1.0.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
  ## [Unreleased] ## [2.0.0] - 2026-10-19 > **⚠️ Scoring change — scores are not comparable with 1.x.**
  Communication checks, > NL-assertion judging, tool-argument lookup and the English prompts all changed.
  > Re-run rather than compare 1.x results against 2.0 numbers. ### Upgrading from 1.x - 2.0 English runs
  are not input-identical to 1.0.1. The differences: - English retail and telecom each use 50 reviewed
  task replacements (same IDs). - User-simulator prompts add a language clause and an entity-order rule
  (`language-guidelines-v4`). - The text user simulator gets a `## Persona Guidelines` block. - Communication
  checks are semantic (LLM-judged) by default. - The NL-assertion judge is `gpt-5.4-mini-2026-03-17` (was
  `gpt-4.1`). - Name, ID and phone lookups fold case, accents and formatting. - Voice benchmark defaults:
  user simulator `openai/gpt-5.5` at `reasoning_effort: low` (was `gpt-4.1`), `max_steps_seconds` 2400
  (was 1200) and OpenAI agent voice `marin` (was `alloy`). - For scores comparable to the 1.x leaderboard,
  run the `v1.0.1` tag. 1.x and 2.0 results are shown on separate leaderboard tabs, and 1.x submissions
  are still accepted. - No flag combination reproduces 1.0.1 inputs exactly. - Closest text run: `--communicate-scorer
  substring`. Still different: the English retail/tele … ages are listed under the leaderboard manifest
  key `voice_v2_submissions` (`voice-v2-banking` and `voice-v2-entity` packages under `voice_v2_domain_submissions`).
  Evidence is uploaded to `s3://sierra-tau-bench-public/submissions//trajectories///`. - `intake` domain
  (τ-entity): exact entity capture on outbound calls, 200 tasks, agent-directed (voice) by default with
  a `scaffolded` ablation that also runs in text. See `docs/elicitation.md`. - Multilingual text and voice
  runs: `--language` selects a language pack (`en`, `es`, `pt`, `hi`, `zh`, `ko`) with a localized database
  and tasks for airline, retail and telecom. See `docs/language-packs.md`. - Released benchmark manifests
  `voice` and `text` (18 cells each, frozen 50-task subsets) and the `tau2 benchmarks list` / `tau2 benchmarks
  pin` verbs. - Released benchmark manifest `voice-v1`: the English-only voice fr … endpoint's default
  model. - Qwen defaults are `qwen3.5-omni-plus-realtime` with voice `Tina` (was `qwen3-omni-flash-realtime`
  with `Cherry`). - Gemini input audio is sent at 8 kHz (was 16 kHz); transcription language codes default
  to `[\"en-US\"]`. - Released benchmark runs (`voice`, `text`, `voice-v1`) default the user simulator
  to `openai/gpt-5.5` at `reasoning_effort: low` (1.x: `gpt-4.1` at temperature 0) and always auto-resume.
  Voice benchmark runs default to `max_steps_seconds` 2400 (was 1200) and OpenAI agent voice `marin` (was
  `alloy`), and record the OpenAI transcription language (`en` for English, the value 1.x hard-coded).
  - Voice agent instru … l is checkpointed if saving its result fails. - `tau2 factory` draft prompts
  state the scenario language and phrase budgets, with bounded repair. - The CLI no longer warns when
  `.env` is absent. ### Security - Patched vulnerable Python dependencies. ## [1.0.1] - 2026-07-15 > **⚠️
  Grading change — banking_knowledge scores are not comparable across this release.** > The fixes below
  change how `banking_knowledge` rewards are computed. For the grading-scheme > fixes, re-grading existing
  trajectories moves scores **only upward** (no previously-passing > simulation fails under the new scheme),
  by up to ~9 points … correct refund fail that task under 1.0.1. Scores produced with tau2-bench < 1.0.1
  on > `banking_knowledge` must not be > compared against scores produced with >= 1.0.1. Old results files
  can be re-scored with > `tau2 evaluate-trajs --fresh-tasks `. Other domains are unaffected. > > Note
  that most of these fixes were merged to `main` on 2026-07-14/15, ahead of this release > and without
  a version bump, so an install from `main` after that window already includes > them. The last commit
  with the pre-1.0.1 `banking_knowledge` … tasks 077–086 (lost/stolen card scenarios): gold trajectories
  made agent-realizable, e.g. account-listing reads that any agent must perform are now part of the golden
  trajectory instead of counting against the DB-hash comparison (#402) ### Fixed - **`banking_knowledge`
  grading: extra read calls no longer zero the reward** (#329). The `call_discoverable_agent_tool` wrapper
  logged *every* call to the `agent_discoverable_tools` table, which is part of the DB-hash reward comparison.
  A single prudent verification read not present in the golden trajectory (e.g. `get_all_ … llucinate
  without recovering still fail naturally via DB-state mismatch. Repeated hallucination remains bounded
  by the orchestrator's `max_errors` guard (`TerminationReason.TOO_MANY_ERRORS`). ## [1.0.0] - 2026-MM-DD
  ### Added #### Voice Evaluation - Full-duplex voice evaluation with tick-based orchestration for simultaneous
  user/agent interaction - `DiscreteTimeAudioNativeAgent` with provider-agnostic adapter architecture
  - Audio native providers: OpenAI Realtime, xAI Grok Voice, Gemini Live (fully supported); Nova Sonic,
  Qwen, Deepgram, LiveKit (experimental) - Voice user simulator with yie … .json`) for airline, retail,
  telecom domains - Hallucination reviewer for detecting user simulator deviations in voice evaluations
  - Automatic hallucination retry system for improved evaluation reliability #### Knowledge Retrieval
  + Banking Domain - New `banking_knowledge` domain with 97 tasks and 698 policy/procedure documents -
  Modular knowledge retrieval framework (`src/tau2/knowledge/`) with pluggable components: - Embedders:
  OpenAI, OpenRouter (Qwen) - Retrievers: BM25, cosine similarity, grep - Postprocessors: BGE reranker,
  pointwise LLM reranker, Qwen reranker - Doc … charges rules, cooldown constraints, dispute eligibility
  criteria - Tool validation parity: ported 8+ missing validations, added `card_type` validation, fixed
  `current_holdings` field - Rewards calculation corrections (Fatima Al-Hassan transactions) #### Airline
  task fixes (27 tasks) - **Incorrect expected actions:** - Tasks 2, 27, 38: Removed incorrect delayed
  flight compensation — policy does not allow compensation for regular economy passengers without insurance
  - Task 7: Corrected cancellation policy compliance — reservation … viors:** - Task 43: Added health-issue
  guardrail to prevent unsafe recommendations - **Data fixes:** - Task 23: Corrected passenger names and
  purpose description - Task 33: Corrected baggage charges for Gold member - Task 35: Corrected date of
  birth #### Retail task fixes (26 tasks) - **Incorrect expected actions:** - Tasks 12, 13: Removed invalid
  PayPal refund expected actions — PayPal is not a supported refund method - Tasks 33, 34: Removed incorrect
  `nl_assertions` and `communicate_info` asserting $1,093.34 refund — gold act"

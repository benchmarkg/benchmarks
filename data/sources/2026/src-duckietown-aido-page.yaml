quote_extract: 'lympics Why Duckies? Contact us Account Login Sign up Request Quote The AI Driving Olympics
  (AI-DO) The AI-DO are a set of competitions with the objective of evaluating the state of the art for
  ML/AI for embodied intelligence (can AI actually DO anything?). Overview Duckietown has been hosting
  the AI-DO competition finals twice per year, at ICRA (International Conference on Robotics and Automation)
  and NeurIPS (Neural Information Processing Systems Conference). AI-DO 2021 finals will take place in
  conjunction with NeurIPS 2021. There are three leagues: The Urban Driving League uses the Duckietown
  Platform. Read on to know all about it. The Advanced Perception League uses the nuScenes dataset/challenges
  and is organized by Motional. The Racing League uses AWS Deepracer and is organized by AWS. To join
  the racing league, continuing reading here. Participate in the AI-DO AI-DO 2021 sponsors AI … of Monreal
  Get started with the AI-DO webinars Introduction to AI-DO 5 ROS and Duckietown baselines Local development
  on Duckiebot (DB19) Reinforcement learning baseline Imitation learning baseline Urban Driving League
  The urban driving … aiming at solving precision driving and safety-critical challenges. The competition
  has two stages: participants access the finals by obtaining high placements in the simulated challenges
  leaderboards, and winners are determined based on experimental evaluations performed in remote Duckietown
  Autolabs. Check ongoing edition Check previous edition The Challenges The challenges range from single
  robot … i-vehicle challenges support “multiplayer” mode, where your agent is embodied in multiple vehicles.
  Each AI-DO edition focuses on a subset of challenges. You can find information on the ongoing AI-DO
  here, and all the challenges on the challenges server. LF: Lane following challenge LFP: Lane following
  with pedestrians challenge LFV: Lane following with vehicles challenge LFI-TL: Lane following with intersections
  and traffic lights LFVI: Lane following with vehicles and intersections challenge Everyone can compete
  Participants will not need to be physically present at any stage of the competition. Competitors submit
  their solutions to specific challenges in the form of agents packaged as a Docker container. The agents
  are evaluated first in simulation (remotely, locally and/or in the cloud), and then the same code is
  tested on physical robots in a Duckietown Autolab. The technical infrastructure supporting the AI-DO
  Urban Driving League is described here. Resources … to control one’s submissions, and to see the leaderboards.
  Get Started with the AI-Driving Olympics Check the rules of the ongoing edition (AI-DO 2021 Urban League
  Finalists). The Quickstart Guide: a handy chapter of the AI-DO book Join the Slack community to interact
  with t … know about the AI-DO Find the leaderboards on the challenges server: the virtual competition
  arena Get the AI-DO Urban league hardware kits to deploy your solutions locally (Hidden) Webinars Lane
  Following (LF), in which you need to follow a lane. Lane Following with Pede … ing baseline AI-DO 3
  (2019) Webinar 5 Training in the cloud with SageMaker AI-DO 3 (2019) Webinar 6 Local development: deploying
  on the Duckiebot (DB18) (Hidden) Previous Webinars Dates Presenter Topics Recorded Video Thurs. Oct
  31 Introduction Descrip … loud Thurs. Nov 14 Running on the Duckiebot FAQs Do I need to attend the conference
  to compete? No! If you are not present at the conference where the finals will be hosted we will run
  your submission on your behalf. How do I get help? Join the Duckietown international Slack community
  and ask away! How do I get the … to take place at NeurIPS. AI-DO 1 only had the Urban league, and only
  the Lane Following challenge. There were over 1600 submissions from 58 unique participants. Read a summary
  of the event here. The second edition of AI-DO took place at the 2019 International Conference on Robotics
  and Automation (ICRA), with finals held in Montréal, Canada, in May 2019. AI-DO 2 comprised again only
  the Urban league, but additional challenges were added, such as Lane following with other vehicles (LFV)
  and Lane following with other Vehicles and Intersections (LFVI). The number of submissions to AI-DO
  2 was similar to the number for AI-DO 1. Find out who won! The third edition was held at NeurIPS 2019
  with finals held in Vancouver, Canada. In AI-DO 3 we introduced the advanced perception and racing leagues.
  AI-DO 3 received over 2000 submissions across all of the leagues. Read all about it! The fourth edition
  was scheduled for ICRA 2020 in Paris, France, but was unfortunately cancelled as a result of the COVID-19
  outbreak. The fifth edition of AI-DO was in conjunction with NeurIPS 2020. Due to the COVID-19 pandemic,
  the conference and finals are held virtually. AI-DO 5 will comprise two leagues: Urban Driving and Advanced
  Perception, with novel challenges in each. The sixth edition of AI-DO is in conjunction with NeurIPS
  2021. It features three leagues: Urban Driving, Advanced Perception, and Racing. A new challenge is
  included in the Urban Driving league, and new Duckiebots are used. Linkedin-in Github Youtube Vimeo-v

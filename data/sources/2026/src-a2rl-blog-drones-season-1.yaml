  by human hands, but by lines of code. This wasn’t science fiction. It was 14 global teams—representing
  the best of university labs, tech startups, and research institutions—going head-to-head to prove what
  AI can do when it’s trusted to ta … ote the Rules In a weekend of pure adrenaline, four unique race
  formats tested the limits of AI, autonomy, and human imagination: AI Grand Challenge: The Dutch team
  MavLab set a blistering 17.225-second time over 22 gates on a 170-meter course. Precision, speed, and
  flawless logic in motion. AI vs Human Showdown: In a jaw-dropping world first, MavLab’s autonomous drone
  beat elite DCL human pilots in a real-time duel — a moment that will be remembered as a historic leap
  for AI. Multi-Drone Race: The UAE’s TII Racing rose to the top, guiding autonomous drones through a
  shared course without a single human input — a masterclass in coordination and collision avoidance.
  Autonomous Drag Race: Czech-based Fly-By-Future stole the show with a 4.43-second dash through three
  gates, reaching speeds beyond 150 km/h. Each race proved something deeper than just technical brilliance:

  1 Introduction Imitation Learning (IL) plays a pivotal role in machine learning, especially in robotics,
  enabling rapid skill acquisition without req … es reproducibility. While many IL benchmarks are available,
  particularly for manipulation, we still lack a proper benchmark for the locomotion tasks. Existing benchmarks
  for this setting either tackle toy tasks, are very far from realistic settings and real robotic platforms
  or are not designed for IL, therefore lacking proper datasets. To address this challenge, we present
  LocoMuJoCo, a Python-based benchmark tailored for locomotion within the context of imitation learning
  (IL). Our benchmark is designed to enhance method usability by offering compatibility with Gymnasium
  [22], a widely adopted interface for Reinforcement Learning (RL) algorithms. Additionally, we provide
  native support for the Mushroom-RL [6] NeurIPS 2023 Workshop on Robot Learning: Pretraining, Fine-Tuning,
  and Generalization with Large Scale Models, New Orleans, United States of America library. Furthermore,

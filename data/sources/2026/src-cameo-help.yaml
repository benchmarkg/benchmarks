quote_extract: "r some pre-processing of the sequences and filtering steps,submits a selected set of targets
  to the registered servers. Participants have until the following Wednesday at 0:00 UTC to return their
  predictions. Once the reference structures have been released by the PDB the following Wednesday, the
  evaluation is performed. Curr … plete list of registered servers. A CAMEO target is a pre-released PDB
  entry, which is submitted to registered servers. In CAMEO, a target consists of one or more peptide,
  protein, DNA or RNA sequence(s), and zero or more free ligands belonging to the same pre-released PDB
  entry. A target can, thus, be a monomer, a homo-oligomer or a hetero-oligomer, and contain ligand(s)
  or not. CAMEO considers a … tents of the request depend on the capabilities of your server, and can
  be customized to some extent. Prediction Format Participants return their predictions by email to the
  address provided during target submission (the \"Results Email\" variable registered with CAMEO). Up
  to 5 models can be returned; only model 1 is used for aggregated scores and comparisons on the website,
  while all 5 models are scored individually and available in the data downloads. The deadline is Wednesday

quote_extract: '[Website](https://www.mask-benchmark.ai) | 📄 [Paper](https://mask-benchmark.ai/paper)
  | 🤗 [Dataset](https://huggingface.co/datasets/cais/mask) & This repository contains the implementation
  for MASK (Model Alignment between Statements and Knowledge), a benchmark designed to evaluate honesty
  in large language models by testing whether they contradict their own beliefs when pressured to lie.
  MASK disentangles honesty from factual accuracy, using a comprehensive evaluation pipeline to measure
  how consistently models respond when incentivized to provide false information across various scenarios.
  We find that scaling pre-training does not improve model honesty. ## Dataset The MASK Dataset is available
  for download on Hugging Face at [🤗 cais/mask](https://huggingface.co/datasets/cais/mask). ## Evaluation
  Framework For details about the evaluation framework, please see the [MASK Evaluation README](mask/README.md).

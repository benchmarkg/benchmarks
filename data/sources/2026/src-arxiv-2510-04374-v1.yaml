  CONTROL A.5.1 MODEL-IN-THE-LOOP TASK REVIEW We used OpenAI models to automatically screen each task
  submission across a variety of criteria and flag possible errors or omissions including: ensuring the
  task is relevant to the selected O*NET occupation, verifying the request involved tasks performed primarily
  on a computer, flagging if the task complexity was … show 95% confidence intervals obtained by bootstrapping
  (resampling with replacement the available automated grader scores or human grades for each sample,
  computing the mean per sample, and averaging across all samples or for the specified model). Our automated
  grader, based on GPT-5-high, shows lower correlation with human expert graders when assessing outputs
  from capable OpenAI models. This aligns with empirical evidence that models often favor their own responses
  Panickssery et al. (2024). Both agreement metrics are highest for less capable models, since their outputs
  are easier to distinguish from human deliverables and are less … h human interrater agreement for non-OpenAI
  models. Both agreement metrics are highest for less capable models, as they can be more frequently distinguished
  from human deliverables and are less likely to be chosen. A.6.3 AUTOMATED GRADER LIMITATIONS In the
  open-source set we mark 12 out of 220 tasks as ungradable due to limitations of the automated grader.

quote_extract: 'ential economic impacts of AI: directly measuring AI model capabilities. AI capability
  evaluations can provide clearer, more directly attributable evidence about model abilities, allowing
  us to assess economic relevance ahead of widespread adoption. Our paper introduces the first version
  of GDPval, a benchmark evaluating AI model performance on real-world economically valuable tasks. GDPval
  covers the top 9 sectors contributing to U.S. GDP (Gross Domestic Product), with at least 30 tasks per
  occupation in the full set (and 5 tasks per occupation in the gold subset), across 44 occupations. Each
  task is constructed based on actual work product created by an expert professional. Given the complexity
  of automatically grading these tasks, our primary evaluation metric is head-to-head human expert comparison.
  We also provide an experimental automated grader service for the 220 open-sourced gold subset of tasks.
  Future GDPval iterations will incorporate greater breadth, realism, interactivity, and contextual nuance.
  The initial version of GDPval offers se … option is still emerging. • Computer use and multi-modality:
  Tasks require manipulating a variety of formats (e.g., CAD design files, photos, video, audio, social
  media posts, diagrams, slide decks, spreadsheets, and customer support conversations). Each task also
  requires parsing through up to 17 reference files in the gold subset, and 38 in the full set. • Subjectivity:
  In addition to correctness, expert graders often consider subjective factors such as structure, style,
  format, aesthetics, and relevance. Our dataset also therefore serves as a helpful testbed to assess
  automated grader performance. • No “upper limit”: Unlike metrics that could saturate quickly, our primary
  metric is win rate, which allows for continuous evaluation. Currently, we compare model outputs against
  a human expert baseline, but we could replace our baseline with increasingly strong models over time
  and keep evaluating. • Long-horizon difficulty: Tasks require an average of 7 hours of work for an expert
  professional to complete. On the high end, tasks span up to multiple weeks of work. 2 TASK CREATION
  We first identify the sectors that contribute most to U.S. GDP, then source tasks drawn from the highest-earning
  knowledge work occupations within those sectors. 2.1 PRIORITIZING OCCUPATIONS GDPval covers tasks from
  9 sectors and 44 occupations that collectively earn $3T annually. We detail below the methodology behind
  our initial version. To choose the initial occupations, we: 1. Selected sectors that contribute over
  5% to US GDP as determined by Q2 2024 Value Added by Industry as a Percentage of Gross Domestic Product
  (see … national employment and wage estimates to calculate total wages for 831 occupations (U.S. Bureau
  of Labor Statistics (2025b)) and further detailed in section A.7. Figure 2: GDPval includes real-world
  work from 44 occupations. 2.2 EXPERT RECRUITMENT We recruited expert industry professionals to create
  realistic tasks based on their professional work experience. Experts were required to have a minimum
  of 4 years of professional experience in their occupation and a strong resume with a demonstrated history
  of professional recognition, promotion, and management responsibilities. The average expert had 14 years
  of experience. We further required experts to pass a video interview, a background check, a trai … tific
  American, Sotheby’s, Telegraph Media Group, Thermo Fisher Scientific, TIME, Twilio, U.S. Department
  of Justice, United States Air Force, United States Postal Service, Walgreens, Wells Fargo, White & Case
  LLP, and Whole Foods. 2.3 TASK CREATION Each GDPval task consists of two primary components: a request
  (often with reference files) and a deliverable (work product). Experts classified their requests against
  O*NET occupational tasks for their occupation to ensure broad and representative coverage across tasks
  (U.S. Bureau of Labor Statistics, 2025a). More details on task characteristics can be found in section
  A … mated completion time by median hourly wages for the corresponding occupation from OEWS data (U.S.
  Bureau of Labor Statistics, 2025b). 2.4 TASK QUALITY CONTROL PIPELINE Figure 3: Tasks undergo multiple
  rounds of review to ensure realism and quality. All 1,320 tasks in the full GDPval set went through
  an iterative review pipeline involving both automated model-based screening and multiple stages of human
  expert review. Each task received an average of five human reviews (with a minimum of three reviews).
  Across all stages of review, experts provided detailed comments, and tasks were iteratively revised
  before subsequent reviews to enhance quality and representativeness, as detailed in section A.5. 2.5
  HUMAN EXPERT GRADING AND AUTOMATED GRADING To grade the 220 open-sourced gold subset, we conducted blinded
  expert pairwise comparisons, where experts in the relevant occupation were presented with a request
  and reference files and asked to rank two or more unlabeled work deliverables. On average, grading each
  comparison for the gold subset took over an hour. Additional occupational experts were sourced to grade
  human and model deliverables. Experts provided detailed justifications for their choices and rankings,
  which enabled us to compute our headline win rates for various models compared to the human expert completion.
  For the gold subset, we trained an experimental grading model to perform pairwise comparisons in the
  style of industry professional experts. Although limited, the automated grader is faster and cheaper
  than expert grading, and achieves 66% agreement with human expert graders, only 5% below human expert
  inter-rating agreement of 71%. Further detail is in section A.6. 4 (a) Pairwise Grading Setup (b) Agreement
  with Humans Figure 4: GDPval uses pairwise expert comparisons for grading. We also create an experimental
  automated grader. We find that automated grader agreement is within 5% of human inter-rater agreement
  on the GDPval gold subset. 3 EXPERIMENTS AND RESULTS 3.1 HEADLINE RESULTS Figure 5: On human pairwise
  comparisons, models are beginning to approach parity with industry experts on the GDPval gold subset.
  We evaluated GPT-4o, o4-mini, o3, GPT-5, Claude Opus 4.1, Gemini 2.5 Pro, and Grok 4 using blind pairwise
  comparisons by professional industry experts 2. Claude Opus 4.1 was the best performing model on the
  GDPval gold subset, excelling in particular on aesthetics (e.g., document formatting, 2We aimed to keep
  comparisons as blind as possible, but model samples may still have been identifiable due to stylistic
  differences. OpenAI outputs often used em dashes, Claude outputs frequently adopted first-person phrasing,
  and Grok occasionally referred to itself as Grok. Although filenames were scrubbed of model identifiers,
  to preserve sample identity, we did not alter style or content, so experts may still have been able
  to infer model origins. We sampled Claude via the UI to enable the maximum GDPval-relevant features.
  For example, for Claude, we wanted to evaluate its ‘Upgraded file creation and analysis’ feature 5 Figure
  6: Performance of OpenAI frontier models increased roughly linearly over time on the GDPval gold subset.
  slide layout), while GPT-5 excelled in particular on accuracy (e.g., carefully following instructions,
  performing correct calculations) as per fig. 8. This distinction is also shown in section A.2.4, where
  GPT-5 performs better on pure text, while Claude performs better on file types like .pdf, .xslx, and
  .ppt, demonstrating better visual and aesthetic abilities 3. In fig. 5, on the GDPval gold subset, 47.6%
  of deliverables by Claude Opus 4.1 were graded as better than (wins) or as good as (ties) the human
  deliverable. Model deliverables outperformed or matched expert humans’ deliverables in just over half
  the tasks. 3.2 SPEED AND COST COMPARISON We analyzed several scenarios to understand the potential speed
  and cost savings ratio of frontier models on the GDPva … s. Under this setup, as well as other setups
  (e.g., directly using model outputs, trying the model just once before doing work directly), model assistance
  can potentially save the expert time and money. (https://www.anthropic.com/news/create-files). For the
  OpenAI models, we enabled the web search tool and the code interpreter tool, with background sampling.
  We also preinstalled several libraries not available in the base image, see section A.6.4. For plots
  shown, we sampled each model 3 times for each prompt, and then had 3 different human graders grade each
  sample (yielding 9 comparisons per prompt, per model, across 220 tasks). 3We caveat also that the occupations
  and task types covered by text tend to be different than those that involve multi-modal 4We were not
  able to obtain cost estimates for Claude, Gem … haracters, and avoid excess verbosity. The prompt applies
  generally to multimodal economic tasks and is not overfit to any given question (see section A.3 for
  details). We also improved agent scaffolding by enabling GET requests in the container and performing
  best-of-N sampling with N=4 and a GPT-5 judge. Prompting fully eliminated black-square artifacts from
  GPT-5 responses, which previously affected over half of generated PDFs, and reduced egregious formatting
  errors in PowerPoint files from 86% to 64%. This can be partially attributed to a sharp … GDPval tasks.
  (a) Reasoning effort experiment (b) Prompt tuning experiment Figure 9: Model performance improves predictably
  with increasing reasoning effort. Prompt-tuning and scaffolding improvements also increase GPT-5 performance.
  4 OPEN-SOURCING We open-source the prompts and reference files in our 220-task gold subset. While human
  expert comparison is still our recommended method of grading, we make an experimental automated grader
  publicly available at evals.openai.com. Please note that the tasks in the open sourced set have been
  scrubbed of information that could be used to identify the expert who wrote the task. We also note that,
  as a result of limitations with our automated grader, we don’t provide automated grading results for
  all tasks in the gold subset. Further disclaimers about the open source gold subset are in section A.1.3.
  8 5 LIMITATIONS Dataset size: The GDPval full set currently consists of only 44 occupations and 30 total
  tasks per occupation. It is therefore a limited, initial cut of knowledge work tasks, not a comprehensive
  evaluation of all possible occupational tasks. We are expanding the dataset size. Focus on self-contained
  knowledge work: Tasks in the initial version of GDPval are oriented around knowledge work that can be
  performed on a computer, particularly around digital deliverables. Manual labor and physical tasks are
  not included in the … ensive tacit knowledge, access to personally identifiable information, use of
  proprietary software tools, or communication between individuals are out of scope for the current evaluation.
  We aim to build on this in future versions of the evaluation. Tasks are precisely-specified and one-shot,
  not interactive: For GDPval, we provide the full context of the task in the prompt, but in real life
  it often takes effort to figure out the full context of a task and understand what to work on. We are
  working on improvements to GDPval that involve more interactiv … trates how model performance degrades
  with less context. Grader performance: Our current automated grader has a number of limitations compared
  to human expert graders. More details about the automated grader are available in the section A.6.2.
  Cost: Constructing and running our evaluation is expensive, particularly with industry expert graders.
  For this reason, we make an automated grader proxy available, but do not consider it a full substitute
  for industry expert graders. 6 CONCLUSION In GDPval, we contribute the following: 1. Dataset: We create
  a new evaluation dataset (GDPval) measurin … dian wage data. 3. Model completion time MT is the time
  taken for the model to complete a deliverable and MC is the associated completion cost, based on empirical
  API speed and cost for the model to complete the deliverable when given a prompt 8. 4. Model win rate
  w is how often the model deliverable is rated better than the human deliverable by the human expert
  grader. We then calculate the following ratios: 1. Naive ratio: To measure the ratio of human deliverable
  versus model deliverable, without accounting for any quality differences or implementation times, we
  simply divide the average task completion time for … and where to get the necessary inputs. We collected
  and graded GPT-5 completions with expert human graders and found the model’s performance was worse on
  under-specified prompts. In particular, the models struggled to figure out context. As a note: this
  experiment was run on an earlier version of the GDPval gold subset, and therefore the observed win rates
  do not match those in the main text of the paper. Figure 15: On the underspecified version of GDPval,
  GPT-5 performed worse as it struggled to figure out requisite context. 17 A.3 ADDITIONAL DETAIL ON PROMPT-TUNING

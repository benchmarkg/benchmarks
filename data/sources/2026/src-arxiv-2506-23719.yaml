  Agent Benchmark fo … s View PDF HTML (experimental) Abstract:We introduce DABstep, a novel benchmark
  for evaluating AI agents on realistic multi-step data analysis tasks. DABstep comprises over 450 real-world
  c … ed from a financial analytics platform, requiring models to combine code-based data processing with
  contextual reasoning over heterogeneous documentation. Each task demands an iterative, multi- … sources,
  and precise result reporting. The benchmark provides a factoid-style answer format with automatic correctness
  checks for objective scoring at scale. We evaluate leading LLM-based agents, revealing a substantial
  performance gap: even the best agent achieves only 14.55% accuracy on the hardest tasks. We detail our
  benchmark's design, data … line results and analyze failure modes. DABstep is released with a public
  leaderboard and toolkit to accelerate research in autonomous data analysis. Comments: 13 pages, 5 figures

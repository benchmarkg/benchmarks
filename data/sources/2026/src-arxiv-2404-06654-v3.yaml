quote_extract: 'le retrieval-based test is indicative of only a superficial form of long-context understanding.
  To provide a more comprehensive evaluation of long-context LMs, we create a new synthetic benchmark
  RULER with flexible configurations for customized sequence length and task complexity. RULER expands
  upon the vanilla NIAH test to encompass variations with diverse types and quantities of needles. Moreover,
  RULER introduces new task categories … these evaluations are used inconsistently across works and reveal
  merely the retrieval capability, failing to gauge other forms of long-context understanding. In this
  work, we propose RULER, a new benchmark to evaluate long-context modeling capabilities for language
  models. RULER contains four task categories to test behaviors (Ribeiro et al., 2020) beyond simple retrieval
  from context: 1. Retrieval: we extend the needle-in-a-haystack (Kamradt, 2023, NIAH) test to evaluate
  retrieval capability with diverse types and quantities of needles. 2. Multi-hop Tracing: we propose
  variable tracking, a minimal proxy task for coreference chain resolution to check the behavior of tracing
  entities with multi-hop connections. 3. Aggregation: we propose common/frequent words extraction, proxy
  tasks for summarization to test the ability to aggregate relevant information that spans long-range
  context. * Authors contributed equally. 1 Published as a conference paper at COLM 2024 Benchmark & Task
  Avg Len Type ZeroSCROLLS L-Eval BAMBOO ∼10k realistic ∼8k realis … Answering: we add distracting information
  to the input of existing shortcontext QA datasets to evaluate question answering capability at various
  context sizes. Compared to existing realistic benchmarks (Table 1), RULER consists solely of synthetic
  tasks, which offer the flexibility to control sequence length and task complexity. The synthetic input
  in RULER reduces reliance on parametric knowledge, which interferes with the utilization of long-context
  input in realistic tasks (Shaham et al., 2023; Bai et al., 2023). Using RULER, we benchmark Gemini-1.5

  dataset we provided. The dataset contains 4,000 realizations of weak lensing maps with ground truth
  cosmological parameters randomly sampled from the 101 cosmological models described in Sec. 2. The submissions
  were then evaluated … sing Eq. 1 and ranked on the public leaderboard. Final evaluation The leading
  public submissions were further evaluated on two distinct holdout sets: (A) 6,000 realizations from
  the simulations with the original 101 cosmological models in the training data, and (B) 4,020 realizations
  from the simulations with 10 cosmological models that were not seen in the training data. The holdout
  set (A) rewards performance on the original cosmology grid, whereas the holdout set (B) probes interpolation

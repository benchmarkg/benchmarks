quote_extract: "es with the actual pull requests. SWE-Agent+GPT-4 was at the top of SWE-bench leaderboard
  during the time of our study. Our analysis reveals some critical issues with the SWE-bench dataset:
  1) 32.67% of the successful patches involve cheating as the solutions were directly provided in the
  issue report or the comments. We refer to as solution leakage problem. 2) 31.08% of the passed patches
  are suspicious patches due to weak test cases, i.e., the tests were not adequate to verify the correctness
  of a patch. When we filtered out these problematic issues, the resolution rate of SWE-Agent+GPT-4 dropped
  from 12.47% to 3.97%. We also observed that the same data quality issues also exist in the two variants
  of SWE-bench, i.e., SWE-bench Lite and SWE-Bench Verified. In addition, over 94% of the issues were
  created before LLM's knowledge cutoff dates, posing potential data leakage issues. Subjects: Software

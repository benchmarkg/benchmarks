  on GitHub Reproducing Leaderboards You can use the HELM package to rerun evaluation runs and
  recreate a specific public leaderboard. The general procedure is to first find the appropriate
  run_entries_*.conf and schema_*.yaml files from the HELM GitHub … export
  SCHEMA_PATH=schema_capabilities.yaml export NUM_TRAIN_TRIALS=1 export NUM_EVAL_INSTANCES=1000
  export PRIORITY=2 Safety export RUN_ENTRIES_CONF_PATH=run_entries_safety.conf export
  SCHEMA_PATH=schema_safety.yaml export NUM_TRAIN_TRIALS=1 export NUM_EVAL_INSTANCES=1000 export
  PRIORITY=2 AIR-Bench (for reasoning models) export
  RUN_ENTRIES_CONF_PATH=run_entries_air_bench_reasoning.conf ex

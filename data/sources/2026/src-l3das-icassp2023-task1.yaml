quote_extract: 'task is a combination of the short-time objective intelligibility (STOI), which estimates
  the intelligibility of the output speech signal, and word error rate (WER), computed to assess the effects
  of the enhancement for speech recognition purposes. The final metric for this task is given by (STOI+(1−WER))/2,
  which lies in the 0-1 range and higher values are better. Sound event classes To generate the spatial
  sound scenes the computed IRs are convolved with clean sound samples belonging to distinct sound classes.
  The noise sound event database we used for task 1 is the well-known FSD50K dataset. In particular, …
  e: computer keyboard, drawer open/close, cupboard open/close, finger snapping, keys jangling, knock,
  laughter, scissors, telephone, writing, chink and clink, printer, and 4 continuous noise classes: alarm,
  crackle, mechanical fan and microwave oven. Furthermore, we extracted clean speech signals (without
  background noise) from Librispeech, taking only sound files up to 12 seconds. Dataset specs The main
  characteristics of the L3DAS23 Task1 section are: more than 4000 virtual 3D audio with a duration up
  to 12 seconds 16kHz 16 bit AmbiX wav files clean voice sounds from Librispeech up to 3 non-speech overlapping
  background noises 700+ RIRs positions for each microphone position in a selection of 68 virtual environments
  (300k+ possible RIRs positions) a total of n'

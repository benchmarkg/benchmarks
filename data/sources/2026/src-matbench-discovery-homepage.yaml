  table as SVGPNGCSVExcel Subscribe via RSS The CPS (Combined Performance Score) is a metric that weights
  discovery performance (F1), geometry optimization quality (RMSD), and thermal conductivity prediction
  accuracy (κSRME). Use the radar chart to adjust the importance of each component. The training set column
  shows the number of materials used to train the model. For models trained on DFT relaxations, we show
  the number of distinct frames in parentheses. In cases where only the number of frames is known, we
  report the number of frames as the training set size. (N=x) in the Model Params column shows the number
  of estimators if an ensemble was used. DAF = Discovery Acceleration Factor measures how many more stable
  materials a model finds compared to random selection from the test set. The unique structure prototypes
  in the WBM test set have a 15.3% rate of stable crystals, meaning the max possible DAF is (32.9k / 215k)^−1
  ≈ 6.54. CPS Reset F1 50% κSRME 40% RMSD 10% Compare models across different metrics and parameters:
  Marker Size Params 47 models Matbench Discovery is an interactive leaderboard which ranks ML models
  on multiple tasks designed to simulate high-throughput discovery of new stable inorganic crystals, finding
  their ground state atomic positions and predicting their thermal conductivity. We rank 47 models covering
  multiple methodologies including graph neural network (GNN) interatomic potentials, GNN one-shot predictors,
  iterative Bayesian optimizers and random forests with shallow-learning structure fingerprints. EquiformerV3+DeNS-OAM
  (paper, code) achieves the highest F1 score of 0.931, R2 of 0.868 and a discovery acceleration factor
  (DAF) of 6.074 (i.e. a ~6.1x higher rate of stable structures compared to dummy discovery in the already
  enriched test set containing 16% stable materials). Our results show that ML models have become robust
  enough to deploy them as triaging steps to more effectively allocate compute in high-throughput DFT
  relaxations. This work provides valuable insights for anyone looking to build large-scale materials
  databases. 📖 Important: In Matbench Discovery, the convex hull used to evaluate stability is constructed
  from DFT reference energies, not from model predictions. This differs from some other benchmarking approaches
  and has important implications for metric interpretation. See /tasks/discovery for more information.
  To cite Matbench Discovery, use: Riebesell, J., Goodall, R.E.A., Benner, P. et al. A framework to evaluate
  machine learning crystal stability predictions. Nat Mach Intell 7, 836–847 (2025). https://doi.org/10.1038/s42256-025-01055-1
  We welcome new models additions to the leaderboard through GitHub PRs. See the contributing guide for
  details and ask support questions via GitHub discussion. Disclaimer: We evaluate how accurately ML models
  predict several material properties like thermodynamic stability, thermal conductivity, and atomic positions,
  in all cases using PBE DFT as reference data. Although these properties are important for high-throughput
  materials discovery, the ranking cannot give a complete picture of a model’s overall ability to drive
  materials research. A high ranking does not constitute endorsement by the Materials Project. For details
  on the κSRME modeling task and evaluation method, refer to arXiv:2408.00755. The only difference between
  the procedure presented by Póta, Ahlawat, Csányi, and Simoncelli, and the results shown here is the
  relaxation protocol has been simplified and unified for all models (just a single simultaneous cell
  and site relaxation). See matbench_discovery/phonons/thermal_conductivity.py for code to predict 2nd
  and 3rd order force constants and matbench_discovery/metrics/phonons.py for code to compute κSRME. GitHub
  Activity Development activity and community engagement of MLIP GitHub repos. Points are sized by number
  of contributors and colored by number of commits over the last year. Issues Contact Changelog RSS Matbench

  across systems. 5.3 Hard Subset and Three-Tier Evaluation Protocol To fill the coverage gap for hard
  scenarios, we construct a Hard subset of 296 pages selected from the pool of data labeled as Hard during
  Data Engine difficulty stratification. Samples are chosen to cover the most challenging scenario categories
  in document parsing, including complex nested tables, dense mathematical formula layouts, and unconventional
  layout structures. All Hard subset samples are excluded from every training stage of MinerU2.5-Pro (including
  Judge-and-Refine training data) and are annotated by professional teams with inter-annotator cross-validation
  to ensure ground truth quality. OmniDocBench v1.6 establishes a Base/Hard/Full three-tier evaluation
  protocol: • Base (1,355 pages): retains the original v1.5 evaluation set to maintain comparability with
  historical results. • Hard (296 pages): the newly added hard sample subset, providing more sensitive
  measurement where top models saturate on standard evaluations. • Full (1,651 pages): the complete union
  of both, providing comprehensive performance assessment. 6 Experiments This section evaluates MinerU2.5-Pro

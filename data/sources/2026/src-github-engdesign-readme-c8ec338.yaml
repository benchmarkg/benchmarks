quote_extract: "# EngDesign **EngDesign** is a benchmark of 101 structured engineering‑design tasks spanning
  multiple domains. This repository supports our NeurIPS Datasets & Benchmarks track submission, \"Toward
  Engineering AGI: Benchmarking the Engineering Design Capabilities of LLMs.\" Of these 101 tasks, 34
  rely on proprietary scientific softwares (e.g., MATLAB or Cadence) and may not run on every system.
  We provide the complete input datasets and evaluation scripts for these tasks as well —— simply follow
  the detailed setup instructions to configure the required environments and run them. The remaining 67
  tasks have no license restrictions and can be evaluated using our hand‑authored scripts. To remove licensing
  barriers, we’ve extracted these into **EngDesign-Open**, a standalone subset whose repository includes
  evaluation scripts for all 67 tasks without any proprietary dependencies. Our evaluation framework currently
  integrates with twelve LLM variants: GPT‑4o, o1, o3, o3‑high, o4‑mini, o4‑mini‑high, Gemini‑2.0‑flash,
  Gemini‑2.5‑pro‑preview‑05‑06, DeepSeek‑Chat, DeepSeek‑Reason … 2. Authenticate via CLI In a terminal,
  run: ```bash docker login -u your_dockerhub_username ``` ### 3. Build the Docker Image Run the following
  command in the root directory of this project: ```bash docker build -t engdesign-sim . ``` ### 4. Start
  a Docker Container Mount your local project directory and start a bash session in the container: ```bash
  docker run -it --rm -v /path/to/your/local/directory:/app --entrypoint bash e … oot@xxxxxxxxxxxx:/app#),
  you can run benchmark tasks using the following commands. #### (1) Run All Tasks with a Given Model
  ```bash xvfb-run -a -e /dev/stdout --server-args=\"-screen 0 1024x768x24\" \\ python3 evaluation/evaluate_llm.py
  \\ --model gpt-4o \\ --api_key your_openai_api_key \\ --task_dir ./EngDesign-Open \\ --k 1 ``` ####
  (2) Run Specific Tasks with a Given Model ```bash xvfb-run -a -e /dev/stdout --server-args=\"-screen
  0 1 … ew-05-06, deepseek-chat, deepseek-reasoner, claude-3-7, and claude-3-7-thinking**)| | `--api_key`
  | Your API key for the corresponding provider (OpenAI, Google, DeepSeek, Anthropic, etc.) | | `--k`
  | Number of repetitions per task | | `--reasoning_effort`| *(Optional)* Use `high` for o3 or o4-mini
  models with high-effort reasoning mode | ### 6. Example Commands for All 12 Supported Models #### OpenAI
  Models (1) GPT-4o: ```bash … task directory, where you can view the scores and the model's generated

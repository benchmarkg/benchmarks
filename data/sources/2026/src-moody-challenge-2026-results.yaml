quote_extract: 'g metrics for the 2026 Challenge entries on the hidden validation and test sets: 2026
  Challenge results During the course of the Challenge, teams submitted entries with their approaches,
  and we trained and evaluated each entry on the Challenge data. The training data were public, and the
  validation and test sets were hidden. In particular, during the unofficial and official phases of the
  Challenge, we trained each entry on the training set, and we scored each entry the validation set. After
  the official phase, each team selected one entry for evaluation on the test set, … zes as official Challenge
  entries. Teams that did not satisfy one or more of the rules were not eligible for rankings or prizes
  as unofficial Challenge entries. (Both the official and unofficial entries are from the official phase
  of the Challenge.) The official Challenge entries are sorted and ranked by the Challenge score on the
  test set. The unofficial entries were sorted alphabetically by team name and not ranked. The Challenge
  webpage and Challenge description papers describe the Challenge. Please cite the Challenge when describing
  the Challenge. Supported by the National Institut'

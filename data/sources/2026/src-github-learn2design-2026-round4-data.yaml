quote_extract: '# Learn2Design 2026 Round 4 evaluation data This release provides evaluation statistics
  for 110 participants on the ten official Round 4 UIFOs: run scores, uncertainty, efficiency and feasibility
  statistics, and convergence checkpoints. The [separate top-ten comparison](top10_50_uifos/) uses fifty
  UIFOs per team. ## Contents - `leaderboard.csv`: aggregate score and run statistics for every participant.
  - `runs.csv`: final outcome, timing, evaluation counts and feasibility statistics. - `checkpoints.csv`:
  per-run values at 15, 30, 60, 120, 180 and 240 minutes. - `checkpoint_summary.csv`: checkpoint mean,
  sample standard deviation and SEM. - `seeds.csv`: the shared topology and optimizer seed pairs. - `participants/<participant_id>/`:
  an individual report and convergence plot. Lower loss is better. Standard deviations use the sample
  definition (`ddof=1`), and SEM is `std / sqrt(n)` for the available runs. Intermediate checkpoints are
  conservat'

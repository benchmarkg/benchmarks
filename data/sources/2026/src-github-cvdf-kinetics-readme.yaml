quote_extract: 'as human-human interactions such as shaking hands and hugging. Each action class has at
  least 400/600/700 video clips. Each clip is human annotated with a single action class and lasts around
  10 seconds. The Kinetics project publications can be found here: https://deepmind.com/research/open-source/kinetics.
  Note that it may not be safe to train / test across different versions of the dataset, for example the
  k400 validation set is largely part of the k700 training set so results will not be meaningful. # Updates
  5th of May: fixed k400/train/part_120.tar.gz, it was a tar file before 10th of December: add two downloader
  … alidation file and made available 1300+ replacement videos for existing corrupted training videos
  from various classes. K600: added list of links for held out test set. 4th of August 2021 -- replaced
  corrupted videos in the kinetics-700-2020 test set (these were typically shorter than 9s as well). There
  are still 5% of the videos in the test set that are shorter than 9s, but genuinely so (e.g. because
  they are like that in youtube). # Download Videos CVDF currently hosts the videos in the Kinetics-400
  and Kinetics-700-2020 datasets. ### Kinetics-400 #### Kinetics-400 Download: ##### Clone repo and enter
  directory ``` git clone https://github.com/cvdf'

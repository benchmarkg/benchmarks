quote_extract: 'ltiple people tracking, since pedestrians are by far the most studied object in the tracking
  community. This paper accompanies a new release of the MOTChallenge benchmark. Unlike the initial release,
  all videos of MOT16 have been carefully annotated following a consistent protocol. Moreover, it not
  only offers a signiﬁcant increase in the number of labeled boxes, but also provides multiple object
  classes beside pedestrians and the level of visibility for every single object of … importantly, the
  annotations for all sequences have been carried out by qualiﬁed researchers from scratch following a
  strict protocol, and ﬁnally double-checked to ensure highest annotation accuracy. Not only pedestrians
  are annotated, but also vehicles, sitting people, occluding objects, as well as other signiﬁcant object
  classes. With this ﬁne-grained level of annotation it is possible to accurately compute the degree of
  occlusion and cropping 2 of all bounding boxes, which is also … nchmark with new sequences, which are
  more challenging than the ones presented in MOT15. In Fig. 1 and Tab. 2 we show an overview of the sequences
  included in the benchmark. 3.1 2D MOT 2016 sequences We have compiled a total of 14 sequences, of which
  we use half for training and half for testing. The annotations of the testing sequences will not be
  released in order to avoid (over)ﬁtting of the methods to the speciﬁc sequences. Sequences are very
  different from each other, we can classify them according to: • Moving or static camera – the camera

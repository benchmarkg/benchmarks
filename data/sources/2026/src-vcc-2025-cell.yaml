quote_extract: 'al Cell Challenge: Toward a Turing test for the virtual cell. Virtual cells are an emerging
  frontier at the intersection of artificial intelligence and biology. A key goal of these cell state
  models is predicting cellular responses to perturbations. The Virtual Cell Challenge is being established
  to catalyze progress toward this goal. This recurring and open benchmark competition from the Arc Institute
  will provide an evaluation framework, purpose-built datasets, and a venue for accelerating model development.'

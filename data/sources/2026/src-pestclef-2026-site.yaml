quote_extract: om documents, supporting cross-disciplinary research and improving epidemiological
  monitoring systems. Task description The task is a knowledge graph extraction task and is framed
  as a document-level relation extraction problem. Relations reflect ecological interactions and
  events involving entities such as Host, Pest, Disease, Vector, and Location. The exact grounding
  of the entities on the text is not required. Submissions will be evaluated using standard
  Information Extraction metrics such as the F-Score. More information is available on the Kaggle
  competition platform Dataset description The task uses the EPOP dataset, which contains 247 web
  documents focusing on 20 monitored pests. The documents are annotated with named entities,
  normalizations, binary relations, and n-ary relations. The annotation was carried out by a team of
  30 plant disease and NLP experts following the state-of-the-art annotation methodology. The
  annotation guidelines and the datasets are already publicly available, the test set annotation
  remains undisclosed. More information about the dataset is available on the Kaggle competition
  platform Participation requirements 1. Subscribe to CLEF (PestCLEF task of the LifeCLEF lab) by
  filling this form 2. Go to the Kaggle PestCLEF 2026 challenge page and compete Publication track
  All registered participants are encouraged to submit a working-note paper to peer-reviewed
  LifeCLEF p … R-WS) after the competition ends. This paper must provide sufficient information to
  reproduce the final submitted runs. Only participants who submitted a working-note paper will be
  part of the officially published ranking used for scientific communication. The results of the
  campaign appear in the working notes proceedings published by CEUR Workshop Proceedings

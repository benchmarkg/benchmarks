quote_extract: 'of their capability. We propose to counter these language priors for the task of Visual
  Question Answering (VQA) and make vision (the V in VQA) matter! Speciﬁcally, we balance the popular
  VQA dataset [3] by collecting complementary images such that every question in our balanced dataset
  is associated with not just a single image, but rather a pair of similar images that result in two different
  answers to the question. Our dataset is by construction more balanced than the original VQA dataset
  and has approximately twice the number of image-question pairs. Our complete balanced dataset is publicly
  available at http://visualqa.org/ as part of the 2nd iteration of the Visual Question Answering Dataset
  and Challenge (VQA v2.0). We further benchmark a number of state-of-art VQA models on our balanced dataset.
  All models perform signiﬁcantly worse on our balanced dataset, suggesting that these models have indeed
  learned to exploit language priors. This ﬁnding provides the ﬁ … But, (1) it will likely still not be
  0 (there may be no image in COCO where the answer to “is the woman ﬂying?” is NOT “no”), and (2) the
  task would be signiﬁcantly more cumbersome for workers, making the data collection signiﬁcantly more
  expensive. We collected complementary images and the corresponding new answers for all of train, val
  and test splits of the VQA dataset. AMT workers picked “not possible” for approximately 135K total questions.
  In total, we collected approximately 195K complementary images for train, 93K complementary images for
  val, and 191K complementary images for test set. In addition, we augment the test set with ∼18K additional
  (question, image) pairs to provide ad- ditional means to detect anomalous trends on the test data. Hence,
  our complete balanced dataset contains more than 443K train, 214K val and 453K test (question, image)
  pairs. Following original VQA dataset [3], we divide our test set into 4 splits: test-dev, test-standard,
  test-challenge and testreserve. For more details, please refer to [3]. Our complete balanced dataset
  is publicly available for download. We use the publicly released VQA evaluation script in our experiments.
  The evaluation metric uses 10 groundtruth answers for each question to compute VQA accuracies. As described
  above, we collected 10 answers for every complementary image and its corresponding question to be consistent
  with the VQA dataset [3]. Note that while unlikely, it is possible that the majority vote of the 10

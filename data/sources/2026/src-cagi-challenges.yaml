quote_extract: "erpretation Register/Login Critical Assessment of Genome Interpretation Challenges Meetings
  Publications Organization Contact Us Challenges How does CAGI work? CAGI experiment participants are
  provided genetic variants and make predictions about resulting phenotypes. Independent assessors evaluate
  the predictions against experimentally characterized phenotypes. The experiment culminates in the CAGI
  Conference with publications in a special journal issue. There have been six completed editions of CAGI
  experiments, held between 2010 and 2022. The seventh round of CAGI is taking place over the Summer and
  Fall of 2025. CAGI7 Challenges General information: CAGI7 challenge website, 14 challenges released
  Skip to individual challenges: (1) Annotate All Missense, (2) Annotate All In-Frame Indels, (3) TSC2,
  (4) BARD1, (5) LPL, (6) ATP7B, (7) lentiMPRA, (8) ARSA, ( … Function Variants, (11) PRS, (12) FGFR.
  Off-cycle challenges: (1) Rare Genomes Project VCF, (2) Rare Genomes Project CRAM CAGI6 Challenges General
  information: CAGI6 challenge website, 13 challenges released Skip to individual challenges: (1) MTHFR,
  (2) HMBS, (3) Calmodulin, (4) Annotate all missense, (5) Rare Genomes Project, (6) Intellectual Disability
  panel, (7) … , (10) Sherloc clinical classification, (11) MAPK1, (12) MAPK3, (13) SickKids6. Off-cycle
  lightening challenges: (1) ARSA CAGI5 Challenges General information: CAGI5 challenge website, 14 challenges
  released Skip to individual challenges: (1) CALM1, (2) Clotting disease (DVT or PE) exomes, (3) Regulation

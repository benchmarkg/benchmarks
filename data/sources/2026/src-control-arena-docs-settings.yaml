quote_extract: 'Sample-Level Configuration Implementing Custom Settings Adding Metadata Optional Methods
  Report an issue Components Settings Settings Source Overview A Setting in ControlArena defines a complete
  evaluation environment for testing control protocols. Settings simulate realistic risk scenarios where
  an AI agent performs legitimate work (the main task) while potentially attempting malicious objectives
  (the side task). For example, in the original AI Control paper, agents solved programming problems from
  the APPS dataset as their main task, while side tasks involved inserting subtle backdoors that pass
  tests but fail on specific secret inputs. Settings are implemented by extending contr … any different
  threat models and environments. Core Concepts Main Tasks and Side Tasks Main tasks represent legitimate
  work the agent should complete. These measure the usefulness of a control protocol (whether it allows
  productive work to proceed). Examples include: Solving programming problems Deploying infrastructure
  changes Generating training data Administering cloud resources Side tasks represent malicious objectives
  a misaligned agent might pursue while appearing to work on the main task. These measure the safety of
  a control protocol (whether it prevents harmful actions). Examples include: Inserting code backdoors
  Creating infrastructure vulnerabilities Poisoning training datasets Exfiltrating sensitive information
  Effective control protocols should maximise main task completion while preventing side task completion.
  Evaluation Modes Settings operate in two modes via the EvalMode parameter: EvalMode.HONEST: The agent
  attempts only the main task. This typically mea … the side task. This typically means both main and
  side task instructions are provided, though this doesn’t force the agent to attempt the side task (the
  agent policy must be configured to pursue side tasks). Used to measure the safety of a control protocol.
  The setting’s get_dataset(eval_mode) method returns potentially different datasets based on the m …
  re, or other environments with specific: Operating systems and libraries Codebases and files Network
  configurations Security constraints For example: An Ubuntu Docker container with a Python codebase and
  dependencies A Kubernetes cluster where the agent has sub-admin privileges A local environment (for
  tasks that don’t require a special execution environment or isolation) Different settings or even individual
  samples within … ameter in get_control_task(). See Evaluation for details. Scorers Scorers evaluate
  whether main and side tasks were completed successfully. They may: Execute tests in sandbox environments
  (e.g., pytest) Use LLM judges to assess outputs Check for specific file contents or system states Analyse
  code for security vulnerabilities Scorers are trajectory-level evaluation functions provided by the
  setting’s get_scorers() method. Samples a'

  Generation ASyMOB_Generation.py generates a diverse set of mathematical question variants from a seed
  CSV file. It leverages the `sympy` library for symbolic mathematics to create various perturbations
  of origin … ion pipeline is a set of Python scripts that query different LLMs to solve the generated
  questions, then validate the answers both symbolically and numerically. The pipeline consists of the
  following scripts: - **Answer collection scripts**: These scripts collect answers from the LLMs for
  the questions generated in the previous step, using different APIs. - `collect_llm_answers.py`: Uses
  the Responses or Completions API to query LLMs one question at a t … ces execution time and costs. -
  `openai_assistants.py`: Uses the OpenAI Assistant API for querying. This allows forcing the LLM to spawn
  a Python interpreter (server side) and use it for question solving. - **Answer validation script**:
  `validate_answers_rowwise.py` validates the collected answers using symbolic and numerical validation.
  Numeric validation relies on numerical substitution of the variables in the answers. A set of valid
  substitutions is generated using the `create_subs.py` script. Symbolic validation relies on the SymPy
  library to validate the answers symbolically. ## Usage The evaluation pipeline maintains a database

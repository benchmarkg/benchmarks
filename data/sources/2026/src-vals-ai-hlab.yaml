quote_extract: "I Benchmarks Models Comparison Vals Smith App Reports Government News Incidents Blog About
  Benchmarks Models Comparison Vals Smith App Reports Government News Incidents Blog About Legal HLAB-Vals-1.1
  Benchmarks / Legal Industry Partner HLAB-Vals-1.1 Updated 11/19/2026 Version 1.1 Tests an agent's ability
  to complete legal work using documents, spreadsheets, presentations, and file-system tools. As of November
  19, 2026, Gemini 4 Argon ranks first on HLAB-Vals-1.1 with 27.08%, followed by Muse Ember (25.00%) and
  Muse Spark Open (25.00%). HLAB-Vals-1.1Agentic legal work with files HLAB-Vals-1.1•Nov 19, 2026 ACCURACY
  Cost FrontierLog scaleShowing latest, top & frontier mode … valuation Benchmark The Legal Agent Benchmark
  is a benchmark released by Harvey to test the ability of models to support legal work in an agentic
  setting. It has a public set and a held-out test set. The results here are from the held-out set. Each
  task asks an agent to produce legal work against a set of task-specific criteria. The agent is provided
  with six tools: Read File, Edit File, Write File, Glob, Bash, and Grep. It also has three skills: docx,
  pptx, and xlsx. We run Harvey’s harness, tools, skills and grading protocol, plus some improvements
  of our own (see What changed in v1.1). Results are not comparable with the archived v1 board or with
  Artificial Analysis’s independent Harvey LAB-AA. Criteria pass rate is included to show how often models
  satisfy individual requirements, even when they do not fully resolve the task. Results Among models
  with a nonzero … 3Claude Fable 5.2Inkling 2 MiniBeam 1.0Claude Haiku 5.5GPT-6 LunaNemotron 3.5 Super
  VLInklingInkling SmallGPT-6.1 Terra Skill calls split docx 49%, xlsx 44%, and pptx 7%. Methodology We
  use Harvey’s generation and grading protocol in the same environment, with internet access disabled.
  Harvey grades each submission with two LLM judges. Each judge computes a task pass rate. A task passes
  only if 100% of its criteria pass, and Harvey’s final score is the average of the two judge task pass
  rates. The two judges were GPT 5.5 and Claude Sonnet 4.6. GPT 5.5 used medium reasoning and Claude Sonnet
  4.6 was not modified. While running the benchmark, we found that redline criteria needed DOCX tracked
  changes preserved when reading submitted files so judges could see inserted and deleted text. We fixed
  that bug and merged it upstream in harveyai/harvey-labs#76. The scoring rubric is unchanged. The benchmark
  was modified to use our model library, an abstraction over various LLM provider APIs, and to run on
  Valkyrie, our framework for running agentic benchmarks. These are infrastructure changes. What changed
  in v1.1 Data. Harvey fixed the private holdout: 17 unsolvable criteria were removed and one mismatched
  source document was replaced. Still 120 tasks. Harvey’s harness updates. Re-synced to Harvey’s current
  upstream: an explicit finish tool, a reasoning-first judge schema, judge-error retries, Word comments
  visible to judges, and pandoc 3.11. Our improvements. Fixes we made to the harness on top of Harvey’s:
  Context compaction instead of failing on context overflow. A nudge when a model stops without calling
  finish, instead of ending the run. A cap on the size of a single tool result. Images opened with read
  are shown as images, not as binary text. File tools ex … teria pass rate now follows Harvey’s definition
  (each judge’s pass fraction, averaged) instead of requiring both judges to pass, so it reads higher.
  The headline score and judges are unchanged. Runs. Every model was run from scratch. Related benchmarks
  From the blog Routers Are a New AI Primitive Other versions Harvey's Legal Agent Benchmark v1 More legal
  benchmarks Legal Research Bench Agentic US legal research LegalBench Open-s"

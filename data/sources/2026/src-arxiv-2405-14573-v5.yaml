  2Google ABSTRACT Autonomous agents that execute human tasks by controlling computers can enhance human
  productivity and application accessibility. However, progress in this field will be driven by realistic
  and reproducible benchmarks. We present ANDROIDWORLD, a fully functional Android environment that provides
  reward signals for 116 programmatic tasks across 20 real-world Android apps. Unlike existing interactive
  environments, which provide a static test set, ANDROIDWORLD dynamically constructs tasks that are parameterized
  and expressed in natural language in unlimited ways, thus enabling testing on a much larger and more
  realistic suite of tasks. To ensure reproducibility, each task includes dedicated initialization, success-checking,
  and tear-down logic, which modifies and inspects the device’s system state. We experiment with baseline
  agents to test ANDROIDWORLD and provide initial results on the benchmark. Our best agent can complete
  30.6% of ANDR … ions can significantly affect agent performance, demonstrating that without such testing,

quote_extract: 'Overview Organizers Important Dates Contact Email organizers Webinar¶ On October 18th
  at 3pm CEST, the winners of STOIC2021 received their prizes and presented their solutions. **Schedule:**3.00
  | Welcome and introduction to STOIC20213.05 | The STOIC Project: clinical backgr … infected with SARS-COV-2
  during the first wave of the pandemic in France, from March to April 2020. The focus of the challenge
  is the prediction of severe COVID-19, defined as intubation or death within one month from the acquisition
  of the CT scan (AUC, primary metric). COVID19 positivity will be assessed as a secondary metric in the
  leaderboard. The STOIC 21 challeng … s, a qualification round and a final round. In the qualification
  round, participating teams can use a publicly available sample of the STOIC dataset, consisting of 2000
  scans and released under the CC BY-NC 4.0 license, for training. Participants must upload their solutions
  as a Docker container to https://grand-challenge.org/algorithms/. The test set consists of 1000 scans
  from the STOIC dataset. During the qualification round, a subset of this test set will be used to compute
  entries on the initial leaderboard. At the end of the qualification round, each team can submit one
  Algorithm to the final leaderboard where the full test set will be processed. The best-performing teams
  will be invited to participate in the final round. For this round, the fi … that can train an improved
  model, using the model from the qualification round as a starting point. The code for this container
  needs to be released under a permissive open-source license. This container will be trained on the grand-challenge.org
  platform, hosted on AWS, in a secure and … rd place: AWS credits to the value of \$4,000. For detailed
  information see the Challenge Overview. This challenge is sponsored by AWS and endorsed by MICCAI. Grand

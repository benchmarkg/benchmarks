quote_extract: 'f CBRN-relevant safety aspects, from basic knowledge recall to complex procedural understanding
  and execution planning. Hazardous-knowledge recall is measured with the Weapons of Mass Destruction
  Proxy (WMDP) [9] benchmark: WMDP-BIO (1,273 items) and WMDP-CHEM (408 items), each formatted as multiple-choice
  questions on topics like cloning, … multiple-choice tasks, Nova 2.0 Lite reaches 0.71 on WMDP-CHEM,
  exceeding Nova Premier (0.66) and Nova 1.0 Pro (0.63). On WMDP-BIO, Nova 2.0 Lite scores approximately
  0.82, performing on par with Nova 1.0 Pro (0.82) and slightly below Nova Premier (0.84). These scores
  place Nova 2.0 Lite within the range typical of frontier language models on hazardous knowledge benchmarks.
  On procedure-heavy benchmarks, Nova 2.0 Lite shows consistently higher scores relative to the baseline.

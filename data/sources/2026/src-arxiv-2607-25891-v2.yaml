quote_extract: 'nly available, as running trials is expensive at frontiermodel scale, and several recent
  efforts release only aggregate leaderboard scores. To fill these gaps, we contribute new evaluations
  on six benchmarks: HarveyAI-Lab (Grupen et al., 2026), MedAgentBench (Jiang et al., 2025), DABStep (Egg
  et al., 2025), QCircuitBench (Yang et al., 2026), ScienceAgentBench (Chen et al., 2025b), and ReplicationBench
  (Ye et al., 2025). We evaluate the same five models on each benchmark using the OpenHands (Wang et al.,
  2025) scaffold through Harbor. The total cost was approximately $10,000. All new runs include full execution
  traces (Appendix A.5). Public benchmark releases. For the majority of benchmarks … per. the following
  models with the same scaffold: openai/gpt-5, openai/gpt-5-nano, openai/ gpt-4o, anthropic/claude-haiku-4-5,
  and anthropic/claude-sonnet-4-5. Each (agent, task) pair was run once. The shared scaffold is openhands-sdk
  v1.22.0, executed inside Modal sandbox images. HarveyAI-Lab uses 23–194 verifier results per task, each
  produced by the LL'

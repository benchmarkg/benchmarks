  Modalities MOLECULE Details README This is the ADMET challenge, part of the ASAP Discovery x OpenADMET
  challenge. ADMET Absorption, Distribution, Metabolism, Excretion, Toxicology - or ADMET - endpoints
  sit in the middle of the assay cascade and can make or break preclinical candidate molecules. For this
  blind challenge we selected several crucial endpoints for the community to predict: Mouse Liver Microsomal
  stability (MLM, protocol): This is a stability assay that tests how quickly a molecule gets broken down
  by mouse liver microsomes. This is a useful assay that can be use … verlap in the chemical space between
  the training and test set. ✅ Evaluation criteria The challenge will be judged based on the judging criteria
  outlined here. You must provide predictions for every endpoint. We will evaluate your submission using
  MAE on the log transformed endpoints, after clipping to the strictly positive detection limit. This
  minimises the effect of massive outliers on the MAE. For LogD which is already in log units we will
  just use MAE directly. You can enter as many times as'

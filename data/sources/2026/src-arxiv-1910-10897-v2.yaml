  to represent policies for multiple tasks with one model, the observation and action spaces must contain
  signiﬁcant shared structure across tasks. All of our tasks are performed by a simulated Sawyer robot.
  The action space is a 2-tuple consisting of the change in 3D space of the end-effector followed by a
  normalized torque that the gripper ﬁngers should apply. The actions in this space range between −1 and
  1. For all tasks, the robot must either manipulate one object with a variable goal position, or manipulate
  two objects with a ﬁxed … environment, and ﬁnally the 3D position of the goal. If there is no second
  object or the goal is not meant to be included in the observation, then the quantities corresponding
  to them are zeroed out. The observation space is always 39 dimensional. Designing reward functions for
  Meta-World requires two major considerations. First, to guarantee that our tasks are within the reach
  of current single-task reinforcement learning algorithms, which is a prerequisite for evaluating multi-task
  and meta-RL algorithms, we design well-shaped reward functions for each task that make each of the tasks
  at least individually solvable. More importantly, the reward functions must exhibit shared structure
  across tasks. Critically, even if the reward function admits the same … adapt to new object or goal

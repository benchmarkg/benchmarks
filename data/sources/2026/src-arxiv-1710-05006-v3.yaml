quote_extract: 'The 2017 challenge consisted of 3 tasks: lesion segmentation, dermoscopic feature detection,
  and disease classiﬁcation. For each, data consisted of images and corresponding ground truth annotations,
  split into training (n=2000), validation (n=150), and holdout test (n=600) datasets. Predictions could
  be submitted on validation and test datasets. The validation submissions provided instantaneous feedback
  in the form of performance evaluations, as well as ranking in comparison to other participants. Test
  submissions only provided feedback after the submission deadline. The training, validation, and test
  datasets continue to be available for download from the following address: http://challenge2017.isic-archive.com/
  Part 1: Lesion Segmentation Task: Participants wer … pixel-wise expert annotations for the presence
  or absence of the dermoscopic features. Validation and test sets included images and superpixels without
  annotation. Part 3: Disease Classiﬁcation Task: Participants were asked to classify images as belonging
  to one of 3 categories (Fig. 3), including “melanoma” (374 training, 30 validation, 117 test), “seborrheic
  keratosis” (254, 42, and 90), and “benign nevi” (1372, 78, 393), with classiﬁcation scores normalized
  between 0.0 t … ent performance levels, and theoretically desired sensitivity levels, respectively [17].
  Segmentation submissions were compared using the Jaccard Index, Dice coefﬁcient, and pixel-wise accuracy
  [16]. Participant ranking used Jaccard. 4. RESULTS The 2017 challenge saw 593 registrations, 81 pre-submissions,

  Novo Nordisk A/S 4Department of Biology, University of Copenhagen 5Computational Health Center, Helmholtz
  Center Munich 6DTU Compute, Technical University of Denmark … roteins. In this paper, we present BEND,
  a Benchmark for DNA Language Models, a collection of realistic and biologically meaningful downstream
  tasks. BEND aims to provide a standardized set of tasks that measure the ability of LMs to capture the
  intricacies of genomic data, and to help advance this nascent field. In summary, BEND contributes: ∗Equal
  contribution 1 Published as a conference paper at ICLR 2024 • Seven curated tasks and datasets, probing
  understanding of different DNA functional elements over a variety of length scales. • Experiments covering
  DNA LMs from six different sources. To our knowledge, this represents first evaluation of all publicly
  available self-supervis … ether with appropriate baseline methods. • An adaptable benchmarking framework
  for preparing embeddings and training lightweight supervised models. • Result: DNA LMs approach expert
  method performance on some tasks. However, no LM consistently outperforms all others, and reasoning
  over very long contexts, as e.g. required for finding enhancers, is still challengi … c Source Gene
  finding Nucleotide-wise Multiclass (9) Enhancer annotation Binned (128bp) Binary Chromatin accessibility
  Sequence-wise Multilabel (125) Histone modification Sequence-wise Multilabel (18) CpG methylation Sequence-wise
  Multilabel (7) Noncoding variant Sequence-wise effects (expression) Binary Noncoding variant Sequence-wise
  effects (disease) Binary 5,976 285 2,005,617 612,081 959,039 105,263 295,495 1,433 14,000 bp 4780/597/597
  MCC GENCODE (Frankish et al., 2021) 100,096 bp 10-fold CV AUPRC Fulco et al. (2019), Gasperini et al.
  (2019), Enformer ( … fits of modeling the genome with larger context windows. For instance, reporting
  performance on predicting SSs, which can be done on short sequences, does not allow us to evaluate how
  useful a model would be for gene finding over longer ranges, a common task in genome annotation. To
  provide a more comprehensive assessment, BEND proposes genomic tasks that rely less on prior knowledge
  of feature positions and require reasoning … ude more flanking context without reprocessing the data,
  should future works find it useful to take more bp into account. 3.1 GENE FINDING Definition Gene finding
  is a multiclass problem where each nucleotide is either part of an exon (EF/R), intron (IF/R), a donor
  (DF/R) or acceptor (AF/R) splice site or a noncoding region (N C). The F/R subscript denotes whether
  the gene is locat … ed to construct sequences of nucleotide labels y ∈ {EF , DF , IF , AF , ER, DR,
  IR, AR, N C} for each gene. Detailed processing is laid out in A.1.1. Samples were partitioned at 80%
  identity following AUGUSTUS’ recommendations (Stanke & Waack, 2003). It should be noted that there is
  a large label imbalance as there is only one donor and acceptor site per intron segment. Metric We compute
  the multi-class Matthews correlation coefficient (MCC) (Gorodkin, 2004) over all bp. The MCC is used
  as it is robust to the inherently highly uneven label ratios of this task. 5 Published as a conference
  paper at ICLR 2024 3.2 ENHANCE … nto physical proximity to the gene’s promoter. Their annotation is
  a highly challenging task that requires detection of long-range interactions. Data Experimentally validated
  enhancer-gene pairs were taken from CRISPR interference experiments (Fulco et al. (2019); Gasperini
  et al. (2019) and paired with the main TSS of each gene from Avsec et al. (2021). We extracted a sequence
  of 100,096 … abel y ∈ {0, 1} indicating whether the bin is part of an enhancer, yielding a label sequence
  of length 782. Detailed processing is laid out in A.1.2. Samples were partitioned based on chromosomes.
  Metric The AUPRC is computed over all labels. As the number of samples is too limited for measuring
  performance robustly on a single test split, we perform 10-fold cross-validation in order to evaluate
  performance over all samples. 3.3 CHROMATIN ACCESSIBILITY PREDICTION Definition Chromatin accessibility
  prediction is a multilabel task where sequences are classified as being in open or closed chromatin
  across a range of cell types. Biological relevance Dynamically modulating chromatin accessibility is
  a key mechanism for the cell type specific regulation of gene expression, as b … = 1 if the chromatin
  is open for the i’th cell type. Detailed processing is laid out in A.1.3. Samples were partitioned based
  on chromosomes. Metric The AUROC is computed for each label and averaged. 3.4 HISTONE MODIFICATION PREDICTION
  Definition Histone modification prediction is a multilabel task, where the histones which are part of
  the nucleos … pression. Histone modification prediction requires modeling local binding of TFs as well
  as long-range regulation, such as by distant enhancers. Data Histone ChIP-seq data for 11 histone marks
  and 18 replicates in the K562 cell line was obtained from ENCODE. Detailed processing is laid out in
  A.1.4 and follows the methodology of 3.3. Each sample is a sequence of length 512 bp with a label vector
  y ∈ {0, 1 … ned based on chromosomes. Metric The AUROC is computed for each label and averaged. 3.6
  NONCODING VARIANT EFFECTS (EXPRESSION AND DISEASE) Definition Predicting variant effects is a binary
  problem, where single-bp mutations are classified as either having an effect or not. We treat classification
  as a zero-shot task, using the cosine distance 6 Published as a conference paper at ICLR 2024 Table
  2: Overview of the LMs applicable to the human genome included in the benchmark. Model Seq lengt … arate
  AUROCs for the variant consequence types to gain further insight into what genomic features are driving
  performance. 4 MODELING Language Models We benchmark available LMs suitable for the human genome (Table
  2). Checkpoint selection criteria are laid out in A.6.2. Additionally, we train two simple baseline
  DNA LMs: An AWD-LSTM (Merity et al., 2017) model trained on three species, and a dilated CNN similar
  to GPN (Benegas et al., 2023), trained on the human genome. The model differs from GPN in the parameter
  count and the length of training sequences (A.6.1). Downstream model We train a lightweight supervised
  two-layer CNN model with 64 channels on top of the LM embeddings for each task. LM weights are kept
  frozen and are not fine-tuned. For LMs with reduced output length due to tokenization, embeddings are
  upsampled to the original sequence length (A.6.3). For sequence-level tasks, we apply average pooling
  after the last CNN layer. For the enhancer annotation task, the number of channels was reduced to prevent
  overfitting. No downstream model is trained for variant effect prediction, as the cosine distance of
  the LM embeddings directly serves as the zero-shot predictor. Supervised baselines For each task, we
  train two supervised models without pre-training. For a direct comparison of raw and embedded DNA, we
  train th … and enhancer annotation, we train the ResNet CNN model on one-hot encoded sequences. For
  variant effect prediction, no supervised models are trained. For all tasks where Basset is not applicable,
  we report the performance of a previously published task-specific expert method on the benchmark dataset
  to put LM performance into context. 7 Published as a conference paper at ICLR 2024 Table 3: Results

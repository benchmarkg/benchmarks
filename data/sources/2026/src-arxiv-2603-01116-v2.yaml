quote_extract: 'xView object-detection dataset (Lam et al., 2018), and introduced the xBD dataset (Gupta
  et al., 2019). The xBD dataset consists of satellite image pairs of multiple different disasters and
  regions. Since then, it has become the practical standard for BDA benchmarking thanks to its large-scale
  size, high resolution and diversity. Many datasets after it also used similar system for labeling the
  damages. In xBD dataset, there are four damage classes; ”No-damage”, ”Minor”, ”Major”, and ”Destroyed”.
  The labels are provided in a J … to further investigate how the suggested methods perform on different
  domains. The following sections explain statistics and use cases of each dataset. 4.1.1 xBD The xBD
  dataset (Gupta et al., 2019) provides the data in four parts: tier 1 and tier 3 splits, which are meant
  to be used together as the training set, test split, and a holdout split, which we utilized as the validation
  split. While some of the splits come with ready-to-use masks, some of the splits, such as tier 3, did
  not include target masks necessary for the training. In order to create correct masks, we parsed the
  .js … s for already available splits, such as tier 1, and compare them with the provided ones. We obtained
  coherent results reaching over 99.8% pixel agreement. The dataset is split in 80%, 10%, 10% ratio, containing
  9168, 933 and 933 pairs of RGB images in the train, test and validation sets, respectively. The resolution
  of the images is 1024 × 1024 pixels. Table 2 displays the damage level distributions of the splits.
  In the table, the number of images for the damage levels is not meant to sum to the … Table 5. Table
  5: Hurricane Ida Dataset Statistics. Pixel Number of Ratio Images Damage Level L1 L2 L3 L4 Total L1
  L2 L3 L4 Test 438 168 79 35 528 88.67 % 7.92 % 3.15 % 0.26 % 4.2 Evaluation Metrics Following xView2
  Building Damage Assessment challenge (Gupta et al., 2019) protocol, we report three main metrics: •
  F1loc: Denotes the building localization F1 score. • F1clf: Denotes the damage classification F1 score.
  First, per-class F1 scores are computed and then harmonic mean of the four damage scores are … uation
  is restricted to building pixels, background is ignored for the score calculation. • F1oa: Denotes the
  overall F1 score, which is a weighted mean of the localization and classification scores: F1oa = 0.3F1loc
  + 0.7F1clf. This is used as the main metric to determine which model performs better. All scores are
  computed pixel-wise. 4.3 Training Details Hyperparameters. To keep the comparisons consistent, the recommended

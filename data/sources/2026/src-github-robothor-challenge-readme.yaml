quote_extract: "mitting to the Leaderboard](#submitting-to-the-leaderboard) - [Agent](#agent) - [Dataset](#dataset)
  - [Using AllenAct Baselines](#using-allenact-baselines) ## Installation If you are planning to evaluate
  an agent trained in AllenAct, you may simply `pip install ai2thor==2.7.2`, skip the following instructions,
  and follow [our example for evaluating AllenAct baselines](#using-allenact-baselines) below instead.
  Otherwise, to begin working on your own model you must have an GPU (required for 3D rendering). Local
  Installatio … with the best submission made by May 31st (midnight, [anywhere on earth](https://time.is/Anywhere_on_Earth))
  will be announced at the [CVPR'21 Embodied-AI Workshop](https://embodied-ai.org/) and invited to produce
  a video describing their approach. You will be submitting your metrics file (e.g. `submission_metrics.json.gz`
  as below) for evaluation. During leaderboard evaluation, we will validate your results and compute several
  metrics (success rate, SPL, proximity-only success rate, proximity-only SPL, and episode length). Submissions
  will be ranked on the leaderboard by SPL on the test set. To generate a submission, use the following
  evaluation command: ```bash python3 runner.py -a agents.your_agent_module -c ./challenge_config.yaml
  -d ./dataset -o ./submission_metrics.json.gz --submission --nprocesses 8 ``` We have provided an [example
  submission file](https://prior-leaderboards-public.s3-us-west-2.amazonaws.com/robothor-objectnav/demo-trajectories-2021/example_submission.json.gz)
  for you to view. The episodes in this example has been evaluated using our baselines (50% by a random
  agent and 50% by our baseline AllenAct agent). If you are evaluating an agent trained in AllenAct, please
  follow our example in [Using AllenAct Baselines](#using-allenact-baselines) instead. You can make your
  submission at the follo … c ## Agent In order to generate the `metrics.json.gz` file for your agent,
  your agent must subclass `robothor_challenge.agent.Agent` and implement the `act` method. Please place
  this agent in the `agents/` directory. For an episode to be successful, the agent must be within 1 meter
  of the target object and the object must also be visible to the agent. To declare success, respond with
  the `Stop` action. If `Stop` is not sent within the maxmimum number of steps (500 max), the episode
  will be considered failed and the next episode will be initialized. The agent in `agents/random_agent.py`
  takes a random action at each step. You must also implement a `build()` function to specify how the
  agent class should be initiali … _depth = False return agent_class, agent_kwargs, render_depth ``` ##
  Dataset The dataset is divided into the following splits: | Split | # Episodes | Files | | ----- |:-----:|-----|
  | Debug | 4 | `dataset/debug/episodes/FloorPlan_Train1_1.json.gz` | | Train | 108000 | `dataset/train/episodes/FloorPlan_Train*.json.gz`|
  | Val | 1800 | `dataset/val/episodes/FloorPlan_Val*.json.gz` | | Test | 2040 | `dataset/test/episodes/FloorPlan_test-challenge*.json.gz`
  | where each file is a compressed json file corresponding to a list of dictionaries. Each element of
  the list corresponds to a single episode of object navigation. Episode Structure Here is an example
  of the structure of a single episode in our tra … \"initial_orientation\": 150, \"initial_horizon\"\
  : 30, \"shortest_path\": [ { \"x\": 3.75, \"y\": 0.0045, \"z\": -2.25 }, ... , { \"x\": 9.25, \"y\"\
  : 0.0045, \"z\": -2.75 } ], \"shortest_path_length\": 5.57 } ``` The keys `\"shortest_path\"` and `\"\
  shortest_path_length\"` are hidden from episodes in the `test` split. Target Objects The following (12)
  target object types exist in the dataset: * Alarm Clock * Apple * Baseball Bat * Basketball * Bowl *
  Garbage Can * House Plant * Laptop * Mug * Spray Bottle * Television * Vase All the episodes for each
  split (train/val/test) can be found within `dataset/`. There is also a \"debug\" split available. Configuration
  parameters for the environment can be found within `dataset/challenge_config.yaml`. These are the same
  values that will be used for generating the leaderboard. You are free to train your model with whatever
  parameters you choose, but these params will be reset to the original values for leaderboard evaluation.

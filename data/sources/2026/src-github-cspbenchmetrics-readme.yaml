quote_extract: '={Computational Materials Science}, volume={235}, pages={112802}, year={2024}, publisher={Elsevier}
  } ``` ## CSPMetrics This is a package for benchmarking the performance of crystal structure prediction
  algorithms by calculating the quality of predicted structures compared to the ground truth structures
  using several common distance metrics, including m3gnet energy distance, minimal Wyckoff RMSE distance,
  minimal Wyckoff MAE distance, RMS distance, RMS anony … ommands to install some packages: ``` pip install
  point_cloud_utils pip install superpose3d pip install matminer==0.9.2 pip install scikit-learn m3gnet
  pip install tensorflow==2.9.3 pip install numpy==1.23 pip install open3d pip install --force-reinstall
  charset-normalizer==3.1.0 ``` 4. **Pymatgen**: Tested on pymatgen 2023.9.25. Use the following command
  to install: ``` pip install pymatgen==2023.9.25 ``` ## How to use the CSPMetrics for calculat … tween
  the ground truth structure SrTiO3_gt.cif and the predicted structure SrTiO3_pred.cif. ``` cd CSPBenchMetrics/code
  python3 distance_single.py --ground_truth ../data/SrTiO3_gt.cif --predicted ../data/SrTiO3_pred.cif
  ``` Then you can check the result in "~/CSPBenchMetrics/results/distance_table.csv". If you want to
  test your own cases'

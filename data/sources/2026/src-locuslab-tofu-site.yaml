quote_extract: the retained set. This synthetic data is distinct from any existing pretraining data,
  ensuring no prior knowledge influences this unlearning process. The unlearning task involves
  forgetting 1%, 5%, or 10% of the original training set, equating to 2, 10, or 20 author
  biographies. The challenge is to limit computation to an O(n) compute, where n is the number of
  samples to be unlearned, thereby excluding strategies like retraining from scratch. Creating the
  TOFU dataset We utilize OpenAI's GPT-4 model to generate a unique biography for fictitious
  authors. We send a prompt to the GPT-4 model … ( 1 / \vert a \vert \) to adjust for the length of
  the answer. This is a standard trick used in the field. For Real Authors and World Facts datasets,
  we treat each question as a multiple-choice question with several answers, and calculate the
  probability of the correct answer relative to the others. This way, we always get a probability
  between zero and one. ROUGE ROUGE scores are also in our toolbox. We use these to see how close
  the model's ans … s. This suggests that there is a room for improvement in the unlearning methods
  for future work. Refer to the Paper and Leaderboard for more details. Carnegie Mellon University ©
  2024. All rights reserved.

  for the distribution learning problem that we introduce below. In this work, we provide a benchmark
  suite—Molecular Sets (MOSES)—for molecular generation: a standardized dataset, data pre … tautomers
  and pH conditions. Note that in the initial set of molecules, functional groups were present in both
  ionized and unionized forms. The ﬁnal dataset contains 1,936,963 molecules, with internal diversity
  IntDiv1 = 0.857; it contains 448,854 unique Bemis-Murcko [56] scaffolds and 58,315 unique BRICS [55]
  fragments. We show example molecules in Figure 3 and a representative diverse subset in Appendix B.
  We provide recommended split into three non-intersecting parts: train (1,584,664 molecules), test (176,075
  molecules) and scaffold test (176,226 molecules). The scaffold test set has all molecules containing
  a Bemis-Murcko scaffold from a random subset of scaffolds. Hence, scaffolds from the scaffold tes …
  model can produce novel scaffolds absent in the training set. The test set is a random subset of the
  remaining molecules in the dataset. 6 Baselines We implemented several models that cover different approaches
  to molecular generation, such as character-level recurrent neural networks (CharRNN) [35, 60], Variational
  Autoencoders (VAE) [31, 32, 69], Adversarial Autoencoders (AAE) [32, 11], Junction Tree Variational

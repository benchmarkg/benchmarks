quote_extract: 'iego Abstract The FAIR Universe – HiggsML Uncertainty Challenge focused on measuring the
  physical properties of elementary particles with imperfect simulators. Participants were required to
  compute and report confidence intervals for a parameter of interest regarding the Higgs boson while
  accounting for various systematic (epistemic) uncertainties. The dataset is a tabular dataset of 28
  features and 280 million instances. Each instance rep … publicly available on the Zenodo platform [65].
  The data is saved as a tabular parquet [66] file of 16 GB and is accompanied by a Croissant JSON metadata
  file. The dataset comprises 280M simulated proton-proton collision events and is weighted to represent
  two weeks of LHC data taking. A separate 120M i.i.d dataset has been used for the final results in section
  5 and is kept private for future over-training checks. 2 We are using a simulated particle physics dataset
  for this competition to produce data representative of high-energy proton collision data collected by
  the ATLAS experiment [67] at the LHC. The dataset [65] was created with two widely-used simulation tools,
  Pythia 8.2 [68] and Delphes 3.5.0 [69]; all the configuration and data pre-selection code is available
  from [70]. This required 1.8 million CPU core hours. We have organi … ic biases. The participant’s model
  should be able to reverse the process and provide a 68.27% CI on µ for any pseudo-experiment. In a machine
  learning context, the task resembles a transduction problem with distribution shift: it requires constructing
  a µ interval estimator from labelled training data and biased unlabelled test data. One possibility
  is to train a classifier to disti … ants is calculated as follows: score = − ln((w + ϵ)f (c)), (2) where
  w represents the average width of the Confidence Interval, c is the coverage, and ϵ = 10−2 is a regularisation
  term to guard against submissions that report unrealistically narrow CIs. To ensure efficient use of
  resources, each participant’s model inference was executed across 100 pseudoexperiments times 10 trials,
  each with distinct values of µtruth, with a time limit of 20s per inference on CPU or GPU. In the Final

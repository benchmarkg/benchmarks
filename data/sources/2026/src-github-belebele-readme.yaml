quote_extract: '---------------------------------------------------- # The Belebele Benchmark for Massively
  Multilingual NLU Evaluation Belebele is a multiple-choice machine reading comprehension (MRC) dataset
  spanning 122 language variants. This dataset enables the evaluation of mono- and multi-lingual models
  in high-, medium-, and low-resource languages. Ea … r for more details, [The Belebele Benchmark: a Parallel
  Reading Comprehension Dataset in 122 Language Variants](https://ai.meta.com/research/publications/the-belebele-benchmark-a-parallel-reading-comprehension-dataset-in-122-language-variants/).
  ## Composition - 900 questions per language variant - 488 distinct passages, there are 1-2 associated
  questions for each. - For each question, there is 4 multiple-choice answers, exactly 1 of which is correct.
  - 122 language/language variants (including English). - 900 x 122 = 109,800 total questions. --------------------------------------------------------------------------------
  ## Download Belebele can be downloaded [here](https://dl.fbaipublicfiles.com/belebele/Belebele.zip)
  which you can download programmatically with the following … one-indexed (e.g. a value of `2` means
  `mc_answer2` is correct) ## Multimodal Belebele In the `2M-belebele` directory, you will find details
  about the multimodal (speech+ASL) version of belebele. --------------------------------------------------------------------------------
  ## Pausible Evaluation Settings Thank … the dataset and the simplicity of the task, there are many possible
  settings in which we can evaluate language models. In all evaluation settings, the metric of interest
  is simple accuracy (# correct / total). Several of the evaluation settings were implemented with several
  models and discussed in the paper. Evaluating models on Belebele in English can be done via finetuning,

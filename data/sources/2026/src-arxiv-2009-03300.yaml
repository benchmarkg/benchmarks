quote_extract: 'Published as a conference paper at ICLR 2021 MEASURING MASSIVE MULTITASK LANGUAGE UNDERSTANDING
  Dan Hendrycks UC Berkeley Collin Burns Columbia University Steven Basart UChicago Andy Zou UC Berkeley
  Mantas Mazeika UIUC Dawn Song UC Berkeley Jacob Steinhardt UC Berkeley ABSTRACT We propose a new test
  to measure a text model’s multitask accuracy. The test covers 57 tasks including elementary mathematics,
  US history, computer science, law, and more. To attain high accuracy on this test, models must possess
  extensive world knowledge and problem solving ability. We ﬁnd that while most recent models have near
  random-chance accuracy, the very largest GPT-3 model improves over random chance by almost 20 percentage
  points on average. However, on every one of the 57 tasks, the best models still need substantial improvements
  before they can reach expert-level accuracy. Models also have lopsided performance and frequently do
  not know when they are wrong. Worse, they still have near- random accuracy on some socially important
  subjects such as morality and law. By comprehensively evaluating the breadth and depth of a model’s
  academic and professional understanding, our test can be used to analyze models across many … To bridge
  the gap between the wide-ranging knowledge that models see during pretraining and the existing measures
  of success, we introduce a new benchmark for assessing models across a diverse set of subjects that
  humans learn. We design the benchmark to measure knowledge acquired during pretraining by evaluating
  models exclusively in zero-shot and few-shot settings. This makes the benchmark more challenging and
  more similar to how we evaluate humans. The benchmark covers 57 subjects across STEM, the humanities,
  the social sciences, and more. It ranges in difﬁculty from an elementary level to an advanced professional
  level, and it tests both world knowledge and problem … moves beyond random chance with the largest model.
  specialized areas like law and ethics (Hendrycks et al., 2020). The granularity and breadth of the subjects
  makes the benchmark ideal for identifying a model’s blind spots. We ﬁnd that meaningful progress on
  our benchmark has only become possible in recent months. In particular, few-shot models up to 13 billion
  parameters (Brown et al., 2020) achieve random chance performance of 25% accuracy, but the 175 billion
  parameter GPT-3 model reaches a much higher 43.9% accuracy (see Figure 1b). On the other hand, unlike
  human professionals GPT-3 does not excel at any single subject. Instead, we ﬁnd that performance is
  lopsided, with GPT-3 having almost … since its average conﬁdence can be up to 24% off from its actual
  accuracy. We comprehensively evaluate the breadth and depth of a model’s text understanding by covering
  numerous topics that humans are incentivized to learn. Since our test consists in 57 tasks, it can be
  used to analyze aggregate properties of models across tasks and to track important shortcomings. The
  test and code is available at github.com/hendrycks/test. … linguistic understanding. 3 A M ULTITASK
  TEST We create a massive multitask test consisting of multiple-choice questions from various branches
  of knowledge. The test spans subjects in the humanities, social sciences, hard sciences, and other areas
  that are important for some people to learn. There are 57 tasks in total, which is also the number of
  Atari games (Bellemare et al., 2013), all of which are listed in Appendix B. The questions in the dataset
  were manually collected by graduate and undergraduate students from freely available sources online.
  These include practice questions for tests such as the Graduate Record Examination and the United States
  Medical Licensing Examination. It also includes questions designed for undergraduate courses and questions
  designed for readers of Oxford University Press books. Some tasks cover a subject, like psychology,
  but at a speciﬁc level of difﬁculty, such as “Elementary,” “High School,” “College,” or “Professional.”
  For example, the “Professional Psychology” task draws on questions from freely available practice questions
  for the Examination for Professional Practice in Psychology, while the “High School Psychology” task
  has questions like those from Advanced Placement Psychology examinations. We collected 15908 questions
  in total, which we split into a few-shot development set, a validation set, and a test set. The few-shot
  development set has 5 questions per subject, the validation set may be used for selecting hyperparameters
  and is made of 1540 questions, and the test set has 14079 questions. Each subject contains 100 test
  examples at the minimum, which is longer than most exams designed to assess people. Human-level accuracy
  on this test varies. Unspecialized humans from Amazon Mechanical Turk obtain 34.5% accuracy on this
  test. Meanwhile, expert-level performance can be far higher. For example, real-world test-taker human
  accuracy at the 95th percentile is around 87% for US Medical Licensing Examinations, and these questions
  make up our “Professional Medicine” task. If we take the 95th percentile human test-taker accuracy for
  exams that build up our test, and if we make an educated guess when such information is unavailable,
  we then estimate that expert-level accuracy is approximately 89.8%. Since our test aggregates different
  subjects and several levels of difﬁculty, we measure more than … GPT-3 Medium (few-shot) 26.1 21.6 25.6
  25.5 24.9 GPT-3 Large (few-shot) 27.1 25.6 24.3 26.5 26.0 GPT-3 X-Large (few-shot) 40.8 50.4 36.7 48.8
  43.9 Table 1: Average weighted accuracy for each model on all four broad disciplines. All values are
  … Few-Shot Prompt. We feed GPT-3 prompts like that shown in Figure 1a. We begin each prompt with “The
  following are multiple choice questions (with answers) about [subject].” For zero-shot evaluation, we
  append the question to the prompt. For few-shot evaluation, we add up to 5 demonstration examples with
  answers to the prompt before appending the question. All prompts end with “Answer: ”. The model then
  produces probabilities for the tokens “A,” “B,” “C,” and “D,” and we treat the highest probability option
  as the prediction. For consistent evalua- tion, we create a dev set with 5 ﬁxed few-shot examples for
  each subject.'

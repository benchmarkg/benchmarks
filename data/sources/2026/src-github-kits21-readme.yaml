  [this forum post](https://discourse.kits-challenge.org/t/kits21-challenge-update/354) for details -
  **Apr 7, 2021** … challenge.org](https://kits-challenge.org). You can keep tabs on the data annotation
  process there. - **Mar 29, 2020**: A second edition of KiTS was accepted to be held in conjunction with
  MICCAI 2021 in Strasbourg! More information will be posted here and on the [discussion forum](https://discourse.kits-challenge.org/)

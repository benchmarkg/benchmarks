quote_extract: 'Free DNA Synthesis + Wet Lab Testing 📣 Publish Your Results The Protein Engineering Tournament
  is a global benchmarking initiative hosted by The Align Foundation. This community-driven challenge
  empowers researchers to eva … ve predictive and generative models in protein engineering. Like CASP
  for protein structure prediction, the Tournament is designed to foster collaboration, transparency,
  and rapid progress in AI-powered protein design. 2025 Target This year’s Tournament centers on polyethylene
  terephthalate hydrolase (PETase), an enzyme with real-world impact in the plastic waste crisis, and
  the circular plastic economy. HOW IT WORKS Tournament Phases & Timeline Evaluation Criter … Predictive
  Phase: For both zero-shot, and supervised track teams will be ranked using Normalized Discounted Cumulative
  Gain (NDCG), which measures how well participant-submitted prediction rankings correlate with ground
  truth experimental rankings. The final tournament ranking is determined by the average NDCG across all
  protein properties. In the event of tied scores, rankings are determined by sub … th earlier submissions
  taking precedence. Generative Phase: At the end of round-2 teams will be ranked by comparing free energy
  change of the experimentally measured specific activity relative to benchmark value, while maintaining
  threshold levels of expression. – Overall winner: Free energy change of specific activity r … sor Frequently
  Asked Questions Is there a fee to enter? No. Participation in the Tournament is free of charge. Who
  can participate? Anyone. We welcome teams from academia … er. Do I have to join both phases? Due to
  limited capacity, only top performing teams from both zero-shot and supervised tracks of the Predictive
  Phase will be invited to participate in the Generative Phase. The best way to participate in the Generative
  Phase is to p … f properties like activity, thermostability, or expression. We will provide a training
  dataset of activity, thermostability, and expression of natural PETase sequences and mutational variants.
  Generative Phase (Round 1): We will provide a training data … d by each team. How is intellectual property
  (IP) handeled? The Align Foundation will own those datasets, methods, assays, analysis and results (“Outputs”)
  generated for your submissions. This is to perm … d protein sequences, abstract, code, and methods be
  public? Anonymized predictions, designed protein sequences, and associated experimental results for
  all teams will made public at the completion of the Tournament. Top performing teams will be de-anonymized

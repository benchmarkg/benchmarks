quote_extract: 'considering participating or just want to learn more then please join the CHiME Google
  Group. We have also a CHiME Slack Workspace, you can join the chime-8-dasr channel there or contact
  us organizers directly. Challenge Short Description and Tracks This Task has two tracks which differ
  only by the type of external language models (LM) allowed. Constrained LMs Track no pre-trained LMs
  allowed, teams can however develop whatever LM using core data and external_data. Unconstrained LMs
  Track teams can also leverage pre-trained LMs from this list (LLMs included). 👉 note that an entry to
  the co … channel recordings of a meeting, is able to obtain reasonable segmentation (with time marks
  at the utterance level) and transcriptions for each speaker. See Submission page for an example of the
  output transcription we expect. Scenarios and Datasets This task features 4 highly diverse core datasets/scenarios
  on which performance will be evaluated: Scenario Setting Num. Speakers Recording Setup Multi-Room Meeting
  Duration CHiME-6 dinner party 4 6 linear arrays (4 mics each) Yes > 2h DiPCo dinner party (more formal)
  4 5 circular arrays (7 mics each) No 20-30 mins Mixer 6 Speech 1-to-1 intervie … ices No ~15 mins NOTSOFAR1
  office meeting 4-8 1 circular array device (7 mics) No ~6 mins For training, you can also use data from
  these but also from allowed open-source datasets. For more information have a look at the Data page.
  📊 Systems Ranking In both tracks systems will be ranked according to scenario-wise macro time-constrained
  minimum permutation WER (tcpWER) with a collar of 5 s. I.e. tcpWER is firstly computed on each scenario
  evaluation set separately and then averaged across the 4 scenarios. 🥇 In parallel, we will also feature
  a special award for one team selected by a jury. The jury will be composed of experts nominated … .
  DASR and NOTSOFAR1 Tasks This year CHiME-8 will feature two closely related tasks: DASR (this one) and
  NOTSOFAR1. While we focus on generalizability across many domains, the NOTSOFAR1 task focuses on the
  particular domain of short office meetings. In DASR we make use of the same NOTSOFAR1 Task data, here
  however is treated as one of the scenarios among the total 4 ones. The overall goal is to compare the
  submissions between these two tasks and see how a generalizable transcription system (as required in
  DASR) compares to a specialized transcri'

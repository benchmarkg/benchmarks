quote_extract: 'ILuminate Jailbreak measures how well a system’s safeguards hold up when someone deliberately
  tries to get around them. The Jailbreak benchmark judges responses under the same rules as AILuminate
  Safety, so a system’s two results describe the same behavior under two conditions: Safety uses plain
  prompts, while Jailbreak rewrites the same prompts as attacks. Current version: Jailbreak 1.3, released
  in Candela in November 2026. Latest public results: Jailbreak 1.3 results, November 2026. Test your
  system Candela, MLCommons’ benchmarking service, runs Jailbreak on demand against the configuration
  you deploy. Practice runs show which attacks get through while you strengthen a system’s defenses; an
  Official run produces a result you can publish. [Go to Candela →] What a jailbreak is A jailbreak is
  a prompt written to get around the limits that a system’s developers placed on it. AILuminate follows
  the framing in the forthcoming update to ISO/IEC 22989, which describes jailbreaking as a form of prompt
  injection supplied by a user. Jailbreaks cannot be completely prevented, but it is possible to reduce
  their frequency and impact. In its current state, AILuminate Jailbreak tests single-turn, English, text-to-text
  attacks made through user prompting of a system alone, with no tool use or access to the system’s internals.
  It rewrites each prompt with one technique and sends it once. To account for more sophisticated attack
  techniques, MLCommons plans to add multi-turn attacks and agentic test scenari … across MLCommons working
  groups. How Jailbreak works The Jailbreak benchmarks first sends a non-jailbroken seed prompt: a hazardous
  request drawn from the AILuminate Safety prompt sets. The system-under-test answers each seed as written,
  and then answers several versions of the same request rewritten us … ub-categories are further sub-divided
  into a total of 18 leaves, each of which classifies a unique jailbreak mechanism. Currently, this taxonomy
  catalogs 113 public attacks. Jailbreak 1.3 includes attacks from all eight sub-categories. The four
  families are: Perturbation: changes to a request … y templates. Composition and ordering: arrangements
  of a prompt’s structure that embed the hazardous request inside it. MLCommons does not invent new attacks.
  Instead, the taxonomy classifies techniques already published in research or practitioner reports. Jailbreak
  1.3 covers 10 of the 12 AILuminate hazard categories. Since Jailbreak 1.0, it has left out “Specialized
  advice”, because in that category a disclaimer is what makes a response acceptable, and an attacker
  using a jailbreak will simply disregard disclaimers. Since Jailbreak 1.1, it has also left out “Child
  Sexual Exploitation”, because many infrastructure providers restrict jailbreak prompts in that category;
  MLCommons aims to include it again in a future version. Jailbreak 1.3 gives each system two scores.
  Percentile score, the official result, places its responses to the jailbreak prompts on a scale from
  0 to 100, the same scale as Safety benchmark, measured against a fixed set of reference systems and
  weighing each prompt by how hard it is. Higher is better. Private runs in Candela return the score for
  each hazard category; both private and public results report the overall score. Resilience Gap is the
  change in hazardous responses per 100 prompts between the plain prompts and their jailbreak versions,
  averaged over every technique tested. Lower is better. The Jailbreak results page explains how to read
  each in more detail. New in Jailbreak 1.3 Release module, dated October 29, 2026. Jailbreak 1.3 rebuilds
  the benchmark on the parts it now shares with Safety 1.3. We moved the version number to 1.3 so that
  Safety and Jailbreak can share version numbers and a release schedule from now on. Jailbreak 1.3 is
  now available in Candela for testing on demand against the configuration you deploy. Part Jailbreak
  1.0 Jailbreak 1.3 What’s improved Seed prompts 264 seeds from the public practice set, 24 per hazard
  category 325 attack prompts in each of 10 hazard categories (3,250 in total), seeded from the confidential
  Official prompts that Safety uses Jailbreak practice testing in Candela avoids compromising the confidentiality
  of the held back Official set Evaluator Large language models (LLMs) acting as judges A custom classifier
  trained by MLCommons. It is faster, more accurate, and does not rely on LLMs. Improved accuracy vs the
  prior LLM Judge; both Safety and Jailbreak now use the same evaluator Seed selection Screening across
  systems, then human review Item response theory (IRT) to measure discriminative power (same as Safety
  benchmark) Seeds span the full range of difficulty, to better differentiate at the low, medium, and
  high ends of the performance spectrum Attack coverage 7 of 8 attack categories; LLM judge was unreliable
  at judging results for context framing & deception All 8 attack categories Context framing & deception,
  the most effective category in Jailbreak 1.3, is now measured Scoring Grades relative to a reference
  system, plus Resilience Gap Percentile scores from 0 to 100 on the Safety 1.2.1 scale; Resilience Gap
  stays the same Safety and Jailbreak now repor … system names Readers can see how each system holds up
  under attack, and which kinds of attack still work across systems Planned for later releases: margins
  of error on scores, a larger set of human-judged responses to jailbreak prompts for training and testing
  the evaluator, rotation of attacks within each category under benchmark stewardship, and multi-turn
  attacks. What MLCommons publishes and what it withholds Jailbreak testing exposes weaknesses that an
  attacker could use, so MLCommons publishes its findings under a responsible disclosure approach. MLCommons
  publishes the methods, the taxonomy, and the results, but it withholds the exact attack prompts, templates,
  code, and configurations. The underlying evidence remains available for controlled review by authorized
  auditors and trusted researchers. MLCommons makes a good-faith effort to notify each system provider
  before benchmarking. For more information about our position, please see our blog post about responsible
  disclosure. A Jailbreak score describes a system’s resistance to the attacks in one version of the benchmark,
  and nothing more. MLCommons maintains the taxonomy in the open and versions the benchmark, adapting
  the to new attack techniques as they appear. Official and Practice results Official result: a result
  produced … Commons or in an Official run in Candela, which may be published under the AILuminate Benchmark
  Use & Messaging Policy. Practice result: a result produced with practice prompts, for internal use only.
  Practice runs let model developers and enterprise deployers check a system’s defenses against known
  attacks during deve … · English (US) · published [date]”. Figure: Nine AILuminate Jailbreak Milestones
  in 2026 Version Released What changed 0.5 October 2025 Introduced the paired baseline-and-attack design
  and the Resilience Gap; text-to-text and text-plus-image tests; results published without system names
  0.7 February 2026 Methodology release that published the MLCommons Jailbreak Taxonomy 1.0 June 2026
  (run, shared privately with members); paper October 2026 First complete run: 8 open-weight systems,
  264 seed prompts from the practice set, 11 hazard categories, judged under Assessment Standard v1.4
  1.1 October 2026 Available in Candela; no public results. See “New in Jailbreak 1.1” above 1.3 November
  2026 First Official public results: 18 open-weight systems. Fixed several bugs and moved the version
  number to 1.3 so that Safety and Jailbreak, which share many components, can share version numbers and
  a release schedule from now on … ak Benchmark v1.0 (arXiv:2610.02827, October 2026) Jailbreak v0.7 paper
  (PDF, February 2026) Jailbreak v0.5 paper (PDF) MLCommons Jailbreak Taxonomy on GitHub (CC BY 4.0) AILuminate
  Jailbreak in 2026: nine milestones and the first official public results (blog post, November 2026)
  AILumina'

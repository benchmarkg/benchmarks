quote_extract: 'sis challenge in the world, hosted by the International Skin Imaging Collaboration (ISIC),
  a global partnership that has organized the world’s largest public repository of dermoscopic images
  of skin. The challenge was hosted in 2018 at the Medical Image Computing and Computer Assisted Intervention
  (MICCAI) conference in Granada, Spain. The dataset included over 12,500 images across 3 tasks. 900 users
  registered for data download, 115 submitted to the lesion segmentation task, 25 submitted to the lesion
  attribute detection task, and … is tasks of lesion segmentation, attribute detection, and disease classiﬁcation
  (Fig. 1). There was no requirement that any task be independent of the data or analytics developed for
  the other tasks. Participants were required to provide 4-page manuscripts along with submissions describing
  implemented methods. Participants were allowed to use alternative sources of in-domain (dermoscopic)
  data, but were required to disclose such use in a speciﬁc meta-data ﬁeld. Use of out-of-domain data
  (nondermoscopic), such as ImageNet, was expected to be mentioned in manuscripts, but not required to
  be disclosed in a separate meta-data ﬁeld. 2.1 Part 1: Lesion Segmentation For Part 1, 2,594 dermoscopic
  images with ground truth segmentation masks were provided for training. For validation and test sets,
  100 and 1,000 images were provided, respectively, without ground truth masks. Evaluation criteria historically
  has been the Jaccard index [3,4,5], averaged over all images in the dataset. In practice, ground truth
  segmentation masks are inﬂuenced by inter-observer and intra-ob … uation impractical and infeasible.
  As an approximation to this ideal evaluation criteria, we introduced “Thresholded Jaccard”, which works
  similarly to standard Jaccard, with one important exception: if the Jaccard value of a particular mask
  falls below a threshold T, the Jaccard is set to zero. The value of the threshold T deﬁnes the point
  in which a segmentation is considered “incorrect”. Prior work measured the average Jaccard between 3
  expert annotators on 100 images from the 2016 challenge [6]. The resulting values were 0.743, 0.754,
  and 0.861, yielding an average of 0.786 and a range of 0.118. For the 2018 challenge, T was deﬁned as
  0.65, by rounding the lowest agreement to 0.75 and subtracting one rounded range (0.10) to increase
  the certainty (speciﬁcity) of failure. 2.2 Part 2: Lesion Attribute Detection For Part 2, 2,594 images
  with 12,970 ground truth segmentation masks for 5 attributes were provided for training. For validation
  and held-out test sets, 100 and 1,000 images were provided, respectively, without masks. Jaccard was
  used as the evaluation metric this year in order to facilitate possible re-use of m … the X-axis, and
  number of submissions on the Y-axis. Average values shown as solid vertical lines, and +/- standard
  deviation shown as dotted vertical lines. 2.3 Part 3: Lesion Disease Classiﬁcation For Part 3, 10,015
  dermoscopic images with 7 ground truth classiﬁcation labels were provided for training [11]. For validation
  and held-out test sets, 193 and 1,512 images were provided, respectively, without ground truth. Held-out
  test data was further split into two partitions: 1) an “internal” partition, consisting of 1,196 images
  selected from data sources that were consistent with the training dataset (two institutions in Austria
  and Australia), and 2) an “external” partition, consisting of 316 images additionally selected from
  data sources not reﬂected in the training dataset (institutions from Turkey, New Zealand, Sweden, and
  Argentina). Evaluation was carried out using balanced accuracy (mean recall across classes after mutually
  exclusive classiﬁcation decision), because dataset prevalence may not be reﬂective of real world disease
  prevalence, especially with regard to overrepresentation of melanomas. Previous years had used melanoma
  … alence imbalance of melanomas, and may be inﬂuenced by clinically irrelevant low-sensitivity performance.
  3 Results 3.1 Part 1: Lesion Segmentation In total, 112 submissions were received for Part 1. The top
  performing submission achieved a Thresholded Jaccard of 0.802, with many of the other top algorithms
  also achieving approximately 0.8. A histogram summary of the submissions are shown in Fig. 2, showing
  the proportion of failures (segmentations below 0.65 Jacca … plots for the top 12 submissions are shown
  in Supplemental Fig. 6, details of top 5 submissions are shown in Supplemental Table 2, and histograms
  for AUC by disease are shown in Supplemental Fig. 7. The highest performance achieved was 0.885. Correlation
  between internal and external test dataset performance for each submission is shown in Fig. 4A, and
  between whole test set performance and the diﬀerence between internal and external sets in 4B. Diﬀerences
  in ranking according to balanced accuracy, accuracy, and mean AUC are plotted in Fig. 4. … Discussion
  & Conclusion This work summarizes the results of the 2018 MICCAI Challenge on Skin Lesion Analysis Toward
  Melanoma Detection, hosted by the International Skin Imaging Collaboration (ISIC), which represents

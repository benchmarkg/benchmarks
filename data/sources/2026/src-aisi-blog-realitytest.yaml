quote_extract: "e Frontier AI Trends Report Please enable javascript for this website. A A AboutResearchGrantsBlogContact
  Careers HomeAboutResearchGrantsBlog Careers Blog Human Influence RealityTest: Do AI systems disclose
  their identity when asked? A new benchmark grounded in how real users actually probe AI identity during
  interactions – covering five languages, across text and speech. — Jun 8, 2026 Read the paper AI systems
  that write and speak like humans are now encountered by hundreds of millions of people worldwide. They
  are increasingly dep … on, but it also raises an important question across a much wider range of everyday
  interactions: \"Am I speaking with a person or with an AI system?\". Whether AI systems answer this
  question honestly is an important part of AISI's broader work on ensuring safe human-AI interaction.
  When a user doesn’t know whether they’re speaking with an AI or with a person, they may share sensitive
  information more freely, place too much trust … ovide effective protections, we need to understand how
  people navigate uncertainty about identity during interactions, as well as how models respond. In our
  paper, we present the RealityTest benchmark, to comprehensively test whether AI systems disclose their
  identity when asked, grounded in human data on how people question AI identity in the real … human-authored
  queries with realistic scenarios to evaluate whether AI systems disclose their identity. We tested 17
  text models and 6 speech models, classifying each response as an explicit disclosure, an evasion, or
  an explicit human claim. We found: Models’ behaviour varies substantially. When responding to direct
  queries, disclosure rates among text models ranged from 8% to 92%. Speec … me models showed clear patterns
  of disclosure erosion over time, which is worth monitoring. What our findings mean for safety evaluation
  more broadly Our findings show that current AI models do not reliably disclose their identity when asked,
  and that the gap between baseline performance and real-world robustness is large. The challenge is making
  disclosure robust across the full range of … egies. For AI disclosure and AI safety more broadly, evaluations
  intended to generalise to deployment must be grounded in how people actually behave. We have released
  the full dataset and benchmark so that developers and researchers can reproduce our results, test new
  models as they are released, and build on our infrastructure. You can read the full paper here. ‍ The
  AI Security Institute is a research organisation within the Department of Science, Innovation and Technology.

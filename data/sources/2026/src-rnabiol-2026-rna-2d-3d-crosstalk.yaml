quote_extract: 'cture is changed during the 3D structure modelling process is another question worth exploring.
  Here, we comprehensively benchmark the performance of several representative RNA 3D structure prediction
  methods based on an extensive array of datasets, including RNAs considered in CASP15, CASP16, RNA-Puzzles,
  and a custom dataset composed of 30 curated RNAs. Our goals include: (1) comparing the prediction performances
  of typical RNA 3D methods, including template-based, de novo, and deep learning-based methods (see Table
  1), using the native 2D structure derived from native 3D structures using DSSR (v2 … -hit-est [83] at
  an 80% sequence similarity threshold. Finally, after manual selection, a custom dataset containing 30
  RNA molecules was prepared. These 30 RNAs have varied lengths and structural topologies; for more details,
  see Table S3 in the SI. The RNA Puzzles dataset contains 18 RNAs collected from the real challenging
  RNA-Puzzles [41–45], see Table S4 for more details. The CASP RNA dataset covers 14 RNA targets used
  in the CASP15 and CASP16 competitions; see details listed in Table S5. Moreover, we merged these three

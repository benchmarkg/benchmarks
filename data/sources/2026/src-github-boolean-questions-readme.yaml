quote_extract: '# BoolQ Dataset BoolQ is a question answering dataset for yes/no questions containing
  15942 examples. These questions are *naturally occurring* ---they are generated in unprompted and unconstrained
  settings. Each example is a triplet of (question, passage, answer), with the title of the page as optional
  additional context. The text-pair classification setup is similar to existing natural language inference
  tasks. By sampling questions from a distribution of information- … as since then remained the official
  time of Metropolitan France." "answer": false, "title": "Time in France", } ``` The files are: * **train.jsonl**:
  9427 labeled training examples * **dev.jsonl**: 3270 labeled development examples * **test.jsonl**:
  3245 unlabeled test examples The test data with hidden labels will be released at a later date, along
  with a leaderboard submission system. ## Dataset Links * [Training set](https://storage.cloud.google.com/boolq/train.jsonl)
  * [Development set](https://storage.cloud.google.com/boolq/dev.jsonl) ## Leaderboard Submission Coming
  soon! ## License BoolQ is released under the [Creative Commons Share-Alike 3.0](https://creativecommons.org/licenses/by-sa/3.0/)
  license.'

quote_extract: "(output; required) is a folder for saving your model outputs for the held-out data. The
  [Challenge website](https://physionetchallenges.org/2026/#data) provides a training database with a
  description of the contents and structure of the data files. The scoring code is included in this repository
  in the file `evaluate_model.py`. You can evaluate your model by running python evaluate_model.py -d
  holdout_labels -o holdout_outputs -p prevalence_labels -s scores.csv where - `holdout_labels`(input;
  required) is the path to the CSV file with the labels for th … ata; we will use the `demographics.csv`
  data for the full training set; - `scores.tsv` (output; optional) is file with a collection of scores
  for your model. You can use the provided training set for the `training_data` and `holdout_data` files,
  but we will use different datasets for the validation and test sets, and we will not provide the labels
  to your code. ## Which scripts I can edit? Please edit the following script to add your code: * `team_code.py`
  is a script with functions for training and running your trained model. Please do **not** edit the following
  scripts. We will use the unedited versions of these scripts when running your code: * `train_model.py`
  is a script for training your model. * `run_model.py` is a script for running your trained model. *
  `helper_code.py` is a script with helper functions that we used for our code. You are welcome to use
  them in your code. These scripts must remain in the root path of your repository, but you can put other
  scripts and other files elsewhere in your repository. ## How will the code be run when it's submitted?
  We package your code into a Docker image and run it as a container. Docker and similar platforms allow
  you to containerize and package your code with specific dependencies so that your code can be reliably
  run in other computational environments. To increase the likelihood that we can run your code, please
  [install]"

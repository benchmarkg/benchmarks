  captures detailed interaction logs to provide comprehensive insights into model performance across different
  scenarios and server types. 3.3 Real-World MCP Servers A foundational design principle of MCP-Universe
  is its reliance on real-world MCP servers, as opposed to simulated environments. This approach ensures
  that evaluation is grounded in the authentic complexities of practical applications. As shown in Table
  2, the benchmark includes 11 distinct MCP servers with total 133 tools, each reflecting a unique application
  domain. These servers are organized into 6 core domains: 1. Location Navigation: This domain focuses
  on geographic reasoning and spatial task execution in real-world environments. We employ the official
  Google M … ich provides a rich suite of geospatial tools such as location search, route planning, and
  distance computation. Models must navigate the full complexity of real-world location data to complete
  navigation tasks effectively. 2. Repository Management: This domain focuses on repository development
  and codebase operations. We employ the GitHub MCP server, which exposes authentic version control tools
  such as repository search, issue tracking, and code editing. This setup reflects the operational demands
  of real-world development. 3. Financial Analysis: This domain foc … Blender MCP server, which enables
  interaction with advanced tools for 3D modeling, such as object creation, asset manipulation, and material
  setup. This domain captures the technical depth of professional design environments. 5. Browser Automation:
  This domain focuses on automated interaction with web applications and interfaces. We employ the Playwright
  MCP server, which provides full-featured web automation capabilities such as 5 Salesforce AI Research
  2025-08-21 browser navigation, button clicking, and page snapshotting. It represents real-world browser
  control scenarios encountered in modern automation pipelines. 6. Web Searching: This domain focuses
  on open-domain information seeking. The Google Search MCP server is integrated to support web-based
  information seeking, and the Fetch MCP server is adopted to obtain the content for a given URL. This
  domain captures the open-ended nature of real-world web searching tasks. The selecti … Notion MCP server,
  Weather MCP server, Date MCP server, and Calculator MCP server. More details on these MCP servers can
  be found in Appendix A. 3.4 Tasks and Evaluators Since MCP is a new concept and there is a lack of high-quality
  usage examples, we manually designed challenging MCP tasks to reflect real use cases. If a task can
  be easily completed by LLMs without using MCP servers, or can be consistently solved with MCP servers
  within five retries, we consider it a simple task and brainstorm a new one. As shown in Figure 3, for
  each domain, we carefully create 4-5 types of tasks to cover the most common usage scenarios. For the
  location navigation domain, we focus on 4 sub-task types, including route planning, optimal stops, location
  searching, an … ng, sports analytics, academic research, platform exploration, and map navigation. For
  the web searching domain, we focus on 5 sub-task types, including person identification, entity discovery,
  metric matching, complex reasoning, and factual lookup. After the task creation, each task will be cross-checked
  by the other authors for feasibility, ambiguity, and correctness. To evaluate the completion of tasks,
  we have chosen to carefully design execution-based evaluators for each task. For simplicity, many recent
  works choose to follow the LLM-as-a-judge paradigm. However, we argue that this paradigm is not well-suited
  for our MCP-Universe scenario, since some tasks are designed to use real-time data, while the knowledge
  of the LLM judge is static. In addition, the LLM judge is also known to contain style bias and hallucinations.
  Thus, we choose to follow the execution-based paradigm to evalua … lies on much heavier human labor,
  we believe this is the only way to achieve a fair and comprehensive evaluation. For all tasks, we can
  divide the evaluators into three types: (1) Format Evaluators, (2) Static Evaluators, and (3) Dynamic
  Evaluators. The first type evaluates whether agents strictly follow format requirements. The second
  type assesses correctness for tasks whose answers do not change over time, such as the number of cities
  in route planning tasks, the exact number of goals scored by a football player in browser automation
  tasks, or historical stock prices … financial analysis tasks. For these, we manually collect the correct
  answers and write evaluators to check whether the model’s outputs meet the requirements. For the third
  type, the correct answer of the task needs to be updated with real-time data, such as the price of a
  flight on a future date for the travel booking tasks, the weather of a place in the place-finding tasks,
  and the number of GitHub issues in the issue tracking tasks. Here, we design automatic evaluators to
  obtain real-time correct answers and verify task completion, which can provide stable evaluation results
  across different timestamps. After the evaluator creation, each evaluators will be cross-checked by
  the other authors for feasibility, ambiguity, and correctness. In Appendix B, we include the examples

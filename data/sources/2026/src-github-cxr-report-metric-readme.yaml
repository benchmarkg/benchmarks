  This repository provides code for computing metric scores for radiology report evaluation. The metrics
  are: * BLEU * BERTscore * CheXbert labeler vector similarity * RadGraph entity and relation F1 * Composite
  metric RadCliQ ## Table of Contents * [Prerequisites](#prerequisites) * [Requirements](#requirements)
  * [Usage](#usage) * [License](#l … The code for computing the RadGraph metric score is adapted from
  [dwadden/dygiepp](https://github.com/dwadden/dygiepp). Note: You need to apply for credentialed access
  to RadGraph on PhysioNet. Paper (Accepted to NeurIPS 2021): https://arxiv.org/abs/2106.14463. # Usage
  ``` from CXRMetric.run_eval import calc_metric calc_metric(gt_reports, predicted_reports, out_file,
  use_idf) ``` # License This repository is made publicly available under the MIT License. # Citing If

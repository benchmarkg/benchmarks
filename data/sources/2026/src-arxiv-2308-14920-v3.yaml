  … lored we also propose that it is important to construct a task where the test set is larger than the
  training set to mimic true deployment at scale. No other inorganic materials benchmarks test the prospects
  of large-scale deployment in this manner. We highlight two specific benchmarking efforts that have partially
  addressed the above challenges: Matbench [32] and the Open Catalyst Project (OCP) [33]. Other valuable
  efforts such as MatSciML [34] and JARVISLeaderboard [35] aggregate a wide variety of material science
  related benchmark tasks, including from Matbench and OCP, but do not introduce distinct benchmarking
  design patterns to those seen in Matbench or the OCP. By providing a standardized collection of 13 datasets
  ranging in size from ∼300 to ∼132,000 samples from both DFT and experimental sources, Matbench addresses
  the scalability challenge, highlighting how model performance changes as a function of data regime.
  Matbench helped focus the field of ML for materials, increase comparability across papers and provide
  a quantitative measure of progress in the field. Importantly, all tasks were exclusively concerned with
  the properties of known materials. We believe a task that simulates a materials discovery campaign by

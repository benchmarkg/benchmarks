  in which those methods will be deployed. Fitness Landscape Inference for Proteins (FLIP) (Dallago et
  al., 2021) took early steps toward establishing such benchmarks for machine-learning-assisted protein
  engineering, providing train-test-validation splits that mimic wet-lab engineering. However, FLIP was
  not comprehensive, and several critical applications of mac … n evaluated zero-shot protein language
  model (pLM) sequence-likelihood scores, ridge-regression baselines, and fine-tuned pLMs on these splits
  (Figure 1C). Performance is measured by Spearman’s ρ and normalized discounted cumulative gain (NDCG)
  on held-out test sets. These baselines confirmed that the FLIP2 splits are more challenging than random
  splits with the same number of training examples. Further, simpler models often matched or outperformed
  finetuned protein language models, challenging the utility of existing transfer learning techniques
  for fitness prediction. 2. Related Work 2.1. … able 1. The FLIP2 datasets and splits Dataset Alpha Amylase

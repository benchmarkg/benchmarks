  emphasis on including as many mutational datasets as possible results in the majority of datasets only
  containing single- and double- mutants collected via deep mutational scanning experiments. 2.2. Protein
  Language Models for Fitness Prediction Protein language models (pLMs) that learn patterns from unlabeled
  protein sequences have transformed computational protein engineering by enabling … focus on evaluating

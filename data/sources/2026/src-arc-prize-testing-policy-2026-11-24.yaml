  ARC-AGI-1 & ARC-AGI-2 ARC-AGI-1 and 2 evaluations are run using the open source ARC-AGI Benchmarking
  repository. When a new model is released, we create a new model configuration (example) that specifies
  the model name, reasoning levels, and token limits. We then run the evaluation against the benchmark.
  Public testing results (model outputs, evaluation durations, costs, a … entation. Private Tasks - Tasks
  that are not publicly available. Private tasks are further divided into two categories: Semi-Private
  Evaluation Set - Used for frontier model testing on the Verified Leaderboard. When we evaluate frontier
  models, we expose tasks to third-party APIs. We require zero data retention agreements with a … erfitting.
  We cap our evaluations at $10,000 USD per run. No single semi-private evaluation run can exceed this

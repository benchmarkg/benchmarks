  for potential performance normalization or caveats. • Agents must not access or utilize any information
  pertaining to: (a) the private evaluation test cases themselves (beyond what is inferable from the public
  visualizer/generator), (b) the raw scores or detailed data of individual human participants on the leaderboard
  (used for normalization in some problems). A.4 Limitations of ALE-Bench ALE-Bench is designed to reproduce
  actual contests so that humans and AI can be compared fairly. Nevertheless, it has the following limitations:
  (1) Differences in judging environments. Contests held before the summer of 2023 ran on an older system
  whose hardware is slightly slower than today’s environment. However, even when we re-evaluated some
  solutions with the latest environment, their scores and rankings showed little change, so we can conclude
  that the impact is minor. (2) Use of new resources. Even the earliest contest (March 2021) is relatively
  recent. Yet, algorithms or implementations that were unavailable then can now be applied, allowing higher
  performance to be achieved more easily than was originally possible. (3) Problem-set contamination.
  Since the original problems are publicly available, they may have been accidentally included in AI training
  data. According to the results in Section 5.4, no contamination effects have been detected, but we will
  continue adding fresh problems in future updates and monitor the situation. B ALE-Agent Details This

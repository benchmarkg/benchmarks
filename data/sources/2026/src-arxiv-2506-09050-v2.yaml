  AHC015 Scheduling HTTF2022 Qual Planning AHC033 Packing AHC040 Puzzle AHC019 Ne … -Bench. (Left) ALE-Bench
  collects past AtCoder Heuristic Contest tasks, hard optimization problems such as routing and scheduling
  with no known optimum, and ranks submitted programs by score. (Right) ALE-Bench covers evaluation from
  bare LLMs to scaffolded agents. An agent receives a task and submits code. It can optionally invoke
  test runs and visualization utilities during this process to iteratively refine its solution like a
  human participant. This paper introduces ALE-Bench (ALgorithm Engineering Benchmark), the first benchmark
  that measures AI performance in these algorithmic score-based programming contests. We collect past
  tasks from the AtCoder Heuristic Contest (AHC), one of the world’s largest sco … e, the scoring protocols
  and evaluation environment in ALE-Bench are standardized to closely replicate those of the actual competitions,
  thereby enabling direct and equitable comparisons with humans. ALE-Bench is co-developed with AtCoder,
  which guarantees that all data are fully licensed and that the evaluation procedure faithfully reproduces
  the original contest conditions. Beyond these direct applications, the benchmark’s second role is to
  probe the advanced reasoning ability of frontier AI. Just as previous competitive programming benchmarks
  have served as leading indicators of LLM reasoning capabilities, ALE-Bench, a more challenging competitive
  programming benchmark, can fulfill a similar function. ALE-Bench is challenging and intriguing because
  it necessitates longer-horizon reasoning capabilities compared to previous coding benchmarks. Human
  contestants continuously think and accumulate insig … rough trial and error over weeks, progressively
  improving their scores (see Figure 3). A key question is whether AI can demonstrate similar long-horizon
  reasoning and continuous solution improvement. This benchmark is open-ended, in the sense that true
  optima are out of reach and scores can keep rising. This allows for meaningful evaluation even after
  AI systems surpass the performance of the strongest human experts. We evaluated the performance of frontier
  LLMs in a one-shot setting and with long iterative refinement using scaffoldings, including ALE-Agent,
  which we specifically designed for ALE-Bench. Although these models achieved exceptionally high performance
  on certain problems, the distribution of their contest-wise performance reveals a significant gap compared
  to true experts’ consistency … benchmarks like APPS [2], CodeContests [3], USACO-Bench [8], and LiveCodeBench
  [4]. On these binary-accuracy benchmarks, frontier-level LLMs already approach the performance of top
  human contestants. Unlike those benchmarks, ALE-Bench tackles score-based tasks from the AtCoder Heuristic
  Contest (AHC) that have no single ground-truth answer. Longer-horizon programming benchmarks that require
  more than producing a short code snippet include SWE-Bench [9], MLE-Bench [10], and TheAgentCompany
  [11]. While SWE-Bench and TheAgentCompany remain … tions and therefore assesses data-centric machine
  learning skills, thus operating in a domain different from ALE-Bench. Furthermore, MLE-Bench requires
  a GPU environment and its evaluation is costly, whereas ALE-Bench uses only a CPU environment and is
  resource-friendly. A line of research tackles combinatorial optimization problems with machine learning
  approaches such as graph neural networks and reinforcement learning [12, 13]. Those studies train specialized
  mod … erse, encompassing areas such as routing, planning, multi-agent control, puzzle-solving, and Bayesian
  inference. As an illustrative example, Figure 2 describes a routing problem asked in the contest. The
  tasks are typically CPU-bound, with execution time limits ranging from 2 to 10 seconds per case. AHC
  offers two contest formats: short (approximately 4 hours) and long (1–2 weeks). The problem characteristics
  and difficulty significantly differ between these formats. Short contests sometimes involve problems
  solvable with relatively standard algorithmic approaches … such score progression during the contest.
  Moreover, participants often surpass the best in-contest score by continuing to improve their solutions
  in an official post-contest. To construct ALE-Bench, we released a dataset of 40 AHC problems on the
  Hugging Face platform. These problems are sourced from contests conducted up to the end of April 2025.
  We call the entire set of problems the full version, while we also prepared the lite (subset) version
  that contains 10 representative problems. Each problem package contains four elements. (1) Problem:
  a Markdown statement together with any images. (2) Scorer: a Rust program evaluating the code on input
  cases. (3) Visualizer: a web-based tool and a Rust program that displays the behavior of the code on
  the inputs. The image used in Figure 2 is the example visualization. (4) Leaderboard: ranking data used
  for calculating performance metrics. All data are officially provided by AtCoder Inc., ensuring clear
  licensing and safe use. Additional details are given in Appendix A.1. 3.2 Benchmark Implementation ALE-Bench
  translates AHC problems into a benchmark tailored for AI systems. We deliver this benchmark as a Python
  library th … al 4 solution, which initiates the private evaluation and the calculation of performance
  metrics (detailed in Section 3.3). The AI can iterate through actions (1)-(3) as needed within the time
  limit. The session concludes upon either the submission of a final solution (4) or the expiration of
  the timer. Post-session, the Session object provides the performance metrics from the private evaluation.
  A key component is the code sandbox, which emulates the AHC execution environment. It currently supports
  C++, Python, and Rust, which are the most popular choices among AHC participants, and is designed for
  straightforward extension to other languages. The visualization tool further aids development and debugging,
  offering two modes: (a) Static image generation, optionally producibl … critical. Given that high-performing
  AHC solutions are often CPU-intensive and their results can be hardware-dependent, ALE-Bench includes
  scripts to establish a standardized evaluation environment. These scripts configure Amazon EC2 C6i Instances
  [17] to mirror the original AtCoder CPU environment. This standardization ensures reproducible results
  and allows for equitable comparisons among different AI systems and against human performance. 3.3 Evaluation

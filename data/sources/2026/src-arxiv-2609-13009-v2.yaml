quote_extract: arXiv:2609.13009v2 [cs.AI] 17 Oct 2026 How Good Are Frontier Models at Physics?
  Expert Re-Grading Reveals Broken Evaluations and Near-Saturation of Leading Benchmarks … On
  HLE-Physics, GPT-5.6-Sol’s mean@4 rises from 47.3% to 78.7%. On CMT-Benchmark (Pan et al., 2026),
  it rises from 61.0% to 87.2%. … On CritPt, the mean@5 over the 70 evaluated challenges is 32.3%
  before the audit, and the mean@4 over the 54 retained challenges is 87.5% after it, with a pass@4
  of 94.4%. … On the expert-authored benchmarks (HLE-Physics, CMT-Benchmark, and CritPt),
  GPT-5.6-Sol and Fable 5 use Codex and Claude Code, respectively, with tools enabled. Gemini 3.1
  Pro uses no tools throughout. … The available CritPt evaluation interface reports aggregate scores
  but does not provide per-question correctness judgments. … Because the official reference
  solutions are not publicly available, reviewers independently solve the questions to establish
  reference solutions, then compare model responses against them. … Experts review a 56-challenge
  subset and identify benchmark errors in 21 of them. They repair 19 and exclude the remaining two,
  producing a corrected set of 54 challenges with reference solutions derived by the reviewers. … On
  the corrected set, GPT-5.6-Sol Max achieves a mean@4 of 87.50% and a pass@4 of 94.44%. … Their
  evaluation uses a different model, corrected question set, attempt budget, and judge, so the
  scores are not directly comparable to ours.

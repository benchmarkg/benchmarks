  model, inspired by the seminal work of Rubinstein (1982), forms the basis for understanding how parties
  negotiate the division of shared resources, applicable in scenarios such as business mergers, partnership
  dissolution, and legal settlements. The negotiation game reflects celebrated models of bilateral trade
  (McAfee 1992; Myerson and Satterthwaite 1983) where buyers and sellers negotiate over the prices of
  an indivisible good, which often arises in various applications, including real estate transactions,
  corporate acquisitions, and e-commerce platforms. Lastly, the persuasion model draws on classical models
  of information asymmetry and strategic communication (Akerlof 1978; Crawford and Sobel 1982; Farrell
  and Rabin 1996), which play a pivotal role in advertising, marketing, political campaigning, and recommendation

quote_extract: "is a language-driven environment, evaluating the strategic reasoning limitations of LLMs
  through game-theoretic tasks. GTBench is built on top of [OpenSpiel](https://github.com/google-deepmind/open_spiel),
  supporting 10 widely-recognized games: - Tic-Tac-Toe - Connect-4 - Breakthrough - Nim - Blind Auction
  - Kuhn Poker - Liar's Dice - Negotiation - Pig - Iterat … a ## Environment Dependencies can be installed
  by running ```shell pip install -r requirements.txt ``` ## LLM Inference GTBench uses [LangChain](https://github.com/langchain-ai/langchain)
  for LLM Inference (`./gamingbench/chat/chat.py`), supporting - Remote API access such as [OpenAI](https://openai.com/)
  / [Anyscale](https://docs.endpoints.anyscale.com) / [DeepInfra](https://deepinfra.com/models). - OpenAI-Compatible
  APIs … com/lm-sys/FastChat?tab=readme-ov-file#openai-compatible-restful-apis--sdk). ## Scripts ### LLM-vs-X
  GTBench supports - **LLM-vs-Conventional**: LLM agent competes against conventional solvers such as
  Monte Carlo Tree Search (MCTS) - **LLM-vs-LLM**: LLM agent competes against other LLM agents. The following
  is a script for `GPT-3.5-turbo-1106 w/ Prompt Agent` vs. `GPT-3.5-turbo-1106 w/ CoT Agent`, over `Tic-Tac
  … put_root=\"./experiments\" exp_name='test' num_matches=50 # number of matches num_workers=20 # run
  20 matches in parallel threshold_matches=100 # maximum number of matches, stop criteria for low completion
  rate, e.g., LLM agents always generate illegal actions. # suports all the games listed in ./gamingbench/configs/game_configs
  … gent_configs' agent_name='prompt_agent' opponent_agent_name='cot_agent' declare -a api_keys=(\"\"\
  \ \"<YOUR_DEEPINFRA_KEY>\") python3 -m gamingbench.main \\ --num-matches ${num_matches} \\ --exp-root
  ${output_root}/${exp_name}/${llm_name} \\ --seed ${seed} \\ --game-name ${gam … old-matches ${threshold_matches}
  `````` ### Customized LLM Agent Will be ready soon. ### Upload to GTBench HF Leaderboard Will be ready
  soon. # Reference Please cite our paper as ``"

quote_extract: 'The stereo 2015 / flow 2015 / scene flow 2015 benchmark consists of 200 training scenes
  and 200 test scenes … Compared to the stereo 2012 and flow 2012 benchmarks, it comprises dynamic scenes
  for which the ground truth has been established in a semi-automatic process. … Our evaluation server
  computes the percentage of bad pixels averaged over all ground truth pixels of all 200 test images.
  … for scene flow this criterion needs to be fulfilled for both disparity maps and the flow map … More
  details can be found in Object Scene Flow for Autonomous Vehicles (CVPR 2015). … Our evaluation table
  ranks all methods according to the number of erroneous pixels. … All methods providing less than 100
  % density have been interpolated using simple background interpolation … SF: Percentage of scene flow
  outliers (=outliers in either D0, D1 or Fl) … On 13.03.2017 we have fixed several small errors in the
  flow (noc+occ) ground truth of the dynamic foreground objects … The leaderboards for the KITTI 2015
  stereo benchmarks did not change. … only submissions with significant novelty that are leading to a
  peer-reviewed paper in a conference or journal are allowed. … Additional training data: Use of additional
  data sources for training (see details) … Method Setting Code D1-bg D1-fg D1-all Density Runtime Environment
  … 318 OSF code 4.54 % 12.03 % 5.79 % … Object Scene Flow for Autonomous Vehicles. Conference on Computer
  Vision and Pattern Recognition (CVPR) 2015.'

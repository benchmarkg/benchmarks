  & C consists of 207 pairs of full doctor-patient conversations and associated clinical notes. 4 Evaluation
  In this challenge, we evaluated both the submitted runs and the submitted codes as described below.
  2.2 Task B - Full Dialogue2Note Summarization The goal of task B is to generate a complete note for
  each doctor-patient encounter, as described in Figure 2. The note must include all relevant sections.
  As the same section can have different correct expressions for its header, we … LEURT-20, and BERTScore
  (microsoft/debertaxlarge-mnli) as the main score to rank the participating systems in short note generation
  (AggregateScore). For full note generation, we relied on ROUGE-1 for the evaluation of full notes as
  BLEURT and BERTScore have a maximum sequence length of 512 tokens. For these notes, we also performed
  a more fine-grained sub-note section-level evaluation using the average score of the three metrics.
  In summary, we … -1, BERTScore, and BLEURT. • Task B - Evaluating the long summaries/notes with two
  different methods: (i) Full-note evaluation using ROUGE-1 and (ii) a finegrained evaluation taking the
  mean of the section-based combined score of ROUGE-1, BERTscore, BLEURT, equally weighed. We defined
  five code statuses to label each team’s code (cf. Results Section): 1. Code runs and exactly reproduces
  2. Code runs with minor differences 3. Results unstable due to non-deterministic components (e.g., generative
  API calls) 4. Results unstable • Task C - Evaluating the generated dialogues using ROUGE-1. 4.2 Code

  … This dataset was originally released by FAIR researchers at Meta under the name FLORES. Further information
  about these initial releases can be found in Dataset Sources below. The data is now being managed by
  OLDI, the Open Language Data Initiative. The + has been added to the name to disambiguate between the
  original datasets and this new actively developed version. The data consists of translations primarily
  from English into over 200 language varieties. The original English sentences were sampled in equal
  amounts from Wikinews (an international news source), Wikijunior (a collection of age-appropriate non-fiction
  books), and Wikivoyage (a travel guide). For each language, the dataset has 997 sentences for the dev
  split and 1012 sentences for the devtest split. The separate blind test set, originally developed by
  Meta, is not managed by OLDI and not part of this repository. Curated by: The Open Language Data Initiative
  Languages: Currently 230 language varieties, see the full list in the table below. License: CC BY-SA
  4.0 The current version of the dataset is 5.0. For the full list of versions, see CHANGELOG.md. Citation
  FLORES+ is based on FLORES-200, described in the paper Scaling neural machine translation to 200 languages.
  Other authors have since contributed to the dataset. If you use FLORES+ in your work, please cite the
  relevant papers listed in bibliography.bib, particularly the original FLORES papers and the shared task
  papers for FLORES+. Uses FLORES+ is intende'

  attacks, we propose a replay-regularized, attack-aware curriculum that steps exposure based on
  measured attack influence. Experiments on ASVspoof 2019, 2021, ASVspoof 5, and Fake-orReal show
  improved overall robustness and reduced attack-level imbalance compared with standard multi-attack
  training. Index Terms—Speech deepfake detection, High-impact attacks, Curriculum learning I.
  INTRODUCTION Speech deepfake detect … cross-dataset evaluation, especially on ASVspoof 5 and
  Fake-or-Real. Curriculum training reduces this degradation. The EER-sensitivity configuration (A1,
  A4) gives the best cross-dataset performance, reducing overall EER from 3.04% to 1.48% on ASVspoof
  2021, from 25.43% to 21.04% on ASVspoof 5, and from 42.07% to 25.97% on Fakeor-Real. We compute
  paired-bootstrap confidence intervals reported in Table II to test the reliability of these

  To assess the capabilities of LLMs in solving control problems, we first create a collection of 147
  undergraduate control problems. This collection comprises problems sourced from exercises in [16], and
  problems gathered from undergraduate control classes at University of Michigan (EECS 460) and University
  of Illinois, Urbana-Champaign (ECE 486). Our problem set spans a broad spectrum of topics typically
  encountered in undergraduate control courses, blending both … visual elements under each topic. We collect
  each problem from original documents in PDF files and presentation slides. We manually transfer these
  problems into LaTeX format. All the problems are carefully verified by human annotators to ensure that
  LaTeX documents can be compiled without any syntax errors. In addition, we also provide a detailed step-by-step
  solution for each problem in LaTeX. Our ControlBench dataset and the related Latex/PDF files are available
  at https://agi4engineering.github.io/LLM4Control/. 4 Evaluations of Leading LLMs on ControlBench In

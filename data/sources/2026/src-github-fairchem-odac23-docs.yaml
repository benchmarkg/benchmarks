quote_extract: '# Open Direct Air Capture 2023 (ODAC23) :::{warning} **Deprecated**: ODAC23 has been superseded
  by [ODAC25](odac25.md), which contains nearly 70 million DFT calculations across 4 adsorbates (CO2,
  H2O, N2, O2) in nearly 15,000 MOFs. We recommend using ODAC25 for new projects. ::: :::{card} Dataset
  Overview | Property | Value | |----------|-------| | **Size** | ~1M structure … lcode) | | **Status**
  | Deprecated - use ODAC25 | ::: ## Structure to Energy and Forces (S2EF) task We provide precomputed
  LMDBs for train, validation, and the various test sets that can be used directly with the dataloaders
  provided in our code. The LMDBs contain input structures from all points in relaxation trajectories
  along with the energy of the structure and the atomic forces. The dataset contains an in-domain test
  set and 4 out-of-domain test sets (ood-large, ood-linker, ood-topology, and ood-linker & topology).
  All LMDbs are compressed into a single `.tar.gz` file. |Splits |Size of compressed version (in bytes)
  |Size of uncompressed version (in bytes) | MD5 checksum (download link) | |--- |--- |--- |--- | |Train
  + Validation + Test (all splits) | 172G | 476G | [162f0660b2f1c9209c5b57f7b9e545a7](https://dl.fbaipublicfiles.com/large_objects/dac
  … 398e79760126a](https://dl.fbaipublicfiles.com/dac/datasets/ddec.tar.gz ) | | | | | ## Citing ODAC23

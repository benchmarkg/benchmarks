quote_extract: ', unbiased assessment opportunities to assess and accelerate scientific progress, as demonstrated
  by a breadth of breakthroughs over the last decade. We report the outcomes and key insights from an
  open science community blind challenge focused on computational methods in drug discovery, using lead
  optimization data from the AI-driven Structure-enabled Antiviral Platform (ASAP) Discovery Consortium’s
  pan-coronavirus antiviral discovery program, in partnership with Polaris and the OpenADMET project.
  This collaborative initiative invited global participants from both academia and industry to develop
  and apply computational methods to predict the biochemical potency and crystallographic ligand poses
  of small molecules against key coronavirus targets, Severe Acute Respiratory Syndrome Coronavirus 2
  (SARS-CoV-2) and Middle East Respiratory Syndrome Coronavirus (MERS-CoV) main protease (Mpro), as we
  … rmance.4,6,7 Community blind challenges are especially well suited to this task providing a structured
  and impartial framework for method assessment. Crucially, participants in blind prospective modeling
  challenges do not have direct access to the test set, and receive only limited feedback on performance
  on this set over the course of the challenge. This reduces the risk of overfitting and ensures that
  … ’s pan-coronavirus program (targeting SARS-CoV-2 and MERS-CoV Mpro25) approaching a preclinical candidate
  disclosure in March 2025 (now disclosed),26 a significant portion of its drug discovery data was withheld
  to ensure a successful patent application within ASAP’s equitable-access intellectual property framework.
  This withheld dataset offered a unique opportunity to host a computational blind chal … ssionate community
  of expert ML practitioners across academia and industry, lowering the barrier to engaging high quality
  participants. Additionally, ASAP partnered with OpenADMET, a new Advanced Research Projects Agency for
  Health (ARPA-H)29 funded consortium between the University of California San Francisco (UCSF), Octant
  Bio,30 and the Open Molecular Software Foundation (OMSF),31 focused on generating open data and models
  to enable accurate modeling of ADMET properties. The blind challenge developed by these partners will
  henceforth be referred to as the ASAP-Polaris-OpenADMET antiviral competition. The dataset used in the
  challenge primarily consisted of real-world lead optimization (leadopt) data from the ASAP pan-coronavirus
  Mpro program, selected to mirror challenges faced in real-world lead optimization campaigns. To this
  end, three subchallenges were chosen that reflected experimental processes common to drug discovery:
  1) crystallographic ligand pose prediction, 2) biochemical potency prediction, and 3) ADMET endpoint
  prediction (Figure 1). Each of these subchallenges contained one or more endpoints (e.g MERS-CoV and
  SARS-CoV-2 Mpro potency for the potency subchallenge). The … in which selected participants each describe
  their approaches in greater detail. Overall, the challenge saw broad engagement with a global audience,
  including 381 challenge submissions across 66 unique participants, and with a total of 93 submissions
  for the final leaderboard. Significant post-challenge engagement was also observed, with robust scientific
  discussion during and after the challenge and several participating … ubmit multiple times to the platform
  (with only the last submission counting), encouraging participants to iterate their modeling approaches,
  however performance is only revealed at staged leaderboard checkpoints, reducing the potential for scoring

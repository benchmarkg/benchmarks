quote_extract: 'as model post-training. Against this backdrop, our contributions are threefold: 1. A benchmark
  dataset of real-world tasks. We release a set of high-complexity tasks drawn from Harvey’s BigLaw Bench,
  selected to be representative of economically valuable legal work rather than stylized exam-style problems.
  2. Paired rubric and preference annotations from legal experts. Each task is annotated by experienced,
  practicing lawyers along both dimensions–atomistic, expert-developed rubric criteria and pairwi … rs
  as a proxy for quality. As the field has moved toward open-ended, real-world legal work products, evaluation
  has correspondingly shifted toward expert assessment rather than fixed-answer recovery. Many of the
  expert-assessment benchmarks in professional practice have been developed in industry settings and are
  not fully public. Some use rubrics, including Harvey’s BigLaw Bench [Harvey Team, 2024], Thomson Reuters’
  CoCounsel benchmarking infrastructure [Alexander and Nodler, 2025], and Vals AI’s legal AI evaluations
  [Vals AI … set The goal of our evaluation is to assess the application of quality metrics in law as
  a high stakes domain using a realistic set of tasks. To that end, we collect tasks from Harvey’s BigLaw
  Bench. BigLaw Bench is a privately held (non-public) dataset compiled by Harvey [Harvey Team, 2024]
  in 2024. Its tasks were developed by formerly practicing BigLaw attorneys to reflect hypothetical, representative
  work products of the kind performed in litigation and transactional practice. The documents associated
  with the released tasks are public, and the tasks are de … affirmative criteria, awarding points for
  elements of structure, style, and substance, as well as negative criteria, subtracting points for hallucinations,
  irrelevant material, or other shortcomings. Rubrics are task-specific and were developed by legal experts,
  then later reviewed by other legal experts. BigLaw Bench consists of 100 triplets. All triplets have
  a prompt and a rubric, but some do not have a document as the associated legal task may not require
  one. For the purposes of the present study, we sampled 30 tasks from the proprietary, full dataset and
  make them publicly available.2 Table 1 summarizes the distribution of tasks in this sample of 30 by
  category and task type. Appendix Table 5 provides per-task metadata and study metrics. In total, the
  sample comprises 16 transactional tasks and 14 litigation tasks. 3.2 Constructing Quality Levels We

quote_extract: 'page describes the detection evaluation metrics used by COCO. The evaluation code provided
  here can be used to obtain results on the publicly available COCO validation set. It computes multiple
  metrics described below. To obtain results on the COCO test set, for which ground-truth annotations
  are hidden, generated results must be uploaded to the evaluation server. The exact same evaluation code,
  described below, is used to evaluate results on the test set. 2. Metrics The following 12 metrics are
  used for characterizing the performance of an object detector on COCO: Average Preci … ion. AP is averaged
  over all categories. Traditionally, this is called "mean average precision" (mAP). We make no distinction
  between AP and mAP (and likewise AR and mAR) and assume the difference is clear from context. AP (averaged
  across all 10 IoU thresholds and all 80 categories) will determine the challenge winner. This should
  be considered the single most important metric when considering performance on COCO. In COCO, there
  are more small objects than large objects. Specifically: approximately 41% of objects are small (area
  < 32 … s). The evaluation metrics for detection with bounding boxes and segmentation masks are identical
  in all respects except for the IoU computation (which is performed over boxes or masks, respectively).
  3. Evaluation Code Evaluation code is available on the COCO github. Specifically, see either CocoEval.m
  or cocoeval.py in the Matlab or Python code, respectively. Also see evalDemo in either the Matlab or
  Python code (demo). Before running the evaluation code, please prepare your resul'

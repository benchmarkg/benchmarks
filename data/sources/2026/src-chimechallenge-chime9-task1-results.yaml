  reference transcripts) divided by the total session duration. Speakers are grouped into low
  (<45%), mid (45–60%), and high (>60%) activity levels. On the evaluation set, this corresponds to
  320 speakers in total, with 24.1% low-activity, 26.9% mid-activity, and 49.1% high-activity

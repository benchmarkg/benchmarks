  Under review. Table 1: Main results. pass@k in percent on Terminal-Bench 2.0 (89 tasks; 16 attempts
  per task) and aiderpolyglot (225 code-editing tasks; four attempts per task). ECHO combines GRPO with
  a next-observation prediction loss. Uncertainty is one bootstrap standard error, holding the task set
  fixed and resampling attempts within each task. Boldface indicates the h … complements rather than replaces
  the representation established by ActObs during SFT, making ActObs a stronger initialization for ECHO
  than ActionSFT. 3.3 CROSS-DOMAIN TRANSFER TO CODE-EDITING TASKS We evaluate aider-polyglot as a cross-domain
  benchmark: none of its 225 code-editing tasks appears in either the terminal SFT corpus or the Endless
  Terminals RL set. Its six programming languages and single-file editing objectives, evaluated by unit
  tests, define a task family that is distinct from the environments used for training. ActObs produces
  the strongest plain-GRPO policy at both model scales. At 4B, it outperforms ActionSFT→GRPO by 4.2 percentage
  points at pass@1 and 4.9 points at pass@4, relative advantages of 43% and'

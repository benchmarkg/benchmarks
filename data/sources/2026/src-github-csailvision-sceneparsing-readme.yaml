  given testing images to the evaluation server. The naming of the predicted annotation mask should be
  the same as the name of … negatives) Pixel-wise Accuracy = correctly classifield pixels / labeled pixels
  Final score = (Pixel-wise Accuracy + mean(Intersection over Union)) / 2 ### Demo code In demoEvaluation.m,
  we have included our implementation of the standard evaluation metrics (pixel-wise accuracy and IoU)
  for the benchmark. As mentioned before, we ignore pixels labeled with 0's. Please change the paths"

  Title:Parametric CAD Bench v3: Evaluating Agentic Parametri … try, specified dimensions, and native
  CAD modeling history. We present Parametric CAD Bench v3, a 100-task benchmark comprising 30 text-to-CAD
  creation tasks, 30 text-to-CAD create-and-edit tasks, and 40 tasks that reconstruct mechanical parts

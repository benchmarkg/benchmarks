quote_extract: "# LAB Score-Impact Changelog This file is not a full history of the repository — `git
  log` is. It records only changes that can affect benchmark scores or agent behavior, across four surfaces:
  - **harness** — what the agent experiences: tools, system prompt, skills, agent loop, sandbox image
  and dependencies. Affects all results, all providers. - **grading** — how ou … ding] A criterion whose
  deliverables are all missing, or that finds no agent output at all, fails without a judge call. Before,
  the judge read `(File not found: ...)` or `(No agent output found)` and could pass criteria that check
  for the absence of something, such as distractors. Impact: grading, all providers, runs with missing
  deliverables. Per-criterion pass rates drop on those runs. Task scores are unchanged unless every criterion
  of a task passed on a missing file, which … or comments read byte-identically. Contract redline and
  counterparty-paper review tasks are the most affected (153 of 394 sampled outputs, 39%), against 38
  of 922 (4%) for other practice-area tasks. Results on tasks whose outputs carry tracked changes are
  not comparable across this line. Other results are comparable. Opt-out: pass `track_changes=DocxTrackChanges.ACCEPT`
  to `score_rubric`. ## 2026-10-20 · PR #197 · [grading] Claude judges and the Claude fallback that matches
  deliverab … te-identical; results across this line are comparable. *Entries dated before 2026-09-03
  were backfilled when this file was introduced in PR #157, covering grading and adapter changes since
  July 2026. Dataset fixes from that period are not backfilled; see `git log -- tasks/`.* ## 2026-09-03
  · PR #157 · [harness] Added an explicit `finish` tool (on by default) that the agent calls to end a
  run, with a soft check that any deliverable paths it lists exist in `output/` before the call is accepted.
  `metrics.json` … mary`, and `finish_called`; `finished_cleanly` now reports the real value (it was previously
  always `true`). Impact: suite-wide, all providers. Adds one tool to every prompt and changes how runs
  end, so results before and after this line are not directly comparable. Opt out with `--no-enable-finish`.
  ## 2026-08-26 · PR #150 · [grading] Default judging changed from a single `claude-sonnet-4-6` judge
  to the standard averaged pair `claude-sonnet-4-6` + `gpt-5.5` (`lab-standard-dual-v1`) for both `evaluation.run_eval`
  and `utils.sweep` … rimary score artifact is now `scores_dual.json`. Impact: suite-wide, all providers.
  On a ten-task Opus 4.8 trial, pooled criterion pass moved 78.9% -> 80.6% and averaged task all-pass
  10.0% -> 15.0%. Single-judge results before this line are not comparable to dual results after it. Re-score
  with `--judges claude-sonnet-4-6` to reproduce the old default. ## 2026-08-24 · PR #105 · [grading]
  The judge's structured-output schema now emits `reasoning` before `verdict`, so the verdic"

notes: "Read for P3-S6-T04 on 2026-11-24: the layout JSON of the Plotly Dash app that the site's Deterministic
  scores page embeds in an iframe (researchsites.withgoogle.com/weatherbench/deterministic/), fetched
  by GET; the host serves no robots.txt (404). It lists the plot's selectors and their options: 15 variables,
  six metrics (ACC, Bias, Forecast Activity, MSE, RMSE, SEEPS), the levels 500, 700 and 850 hPa, 34 regions,
  the years 2018, 2020 and 2022, three resolutions, and 43 forecasts to compare against, each labelled
  with its ground truth (vs ERA5 or vs Analysis). Lead time is the plot's x-axis, not a selector. The
  scores themselves arrive by a POST callback as base64-encoded binary arrays, which hold no quotable
  text, so none is quoted from there. Windowed narrowly: one comparator label names a model by its author's
  surname."

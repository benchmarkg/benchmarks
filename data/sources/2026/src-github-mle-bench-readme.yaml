  error of the mean (SEM) for each of the splits on the reported `any_medal_percentage` metric. The `--split75`
  flag corresponds to the `All (%)` column. ## Benchmarking This section describes a canonical setup for
  comparing scores on MLE-bench. We recommend the following: - Repeat each evaluation with at least 3
  seeds and report the Any Medal (%) score as the mean ± one standard error of the mean. The evaluation
  (task and grading) itself is deterministic, but agents/LLMs can be quite high-variance! - Agent resources
  - not a strict requirement of the benchmark but please report if you stray from these defaults! - Runtime:
  24 hours - Compute: 36 vCPUs with 440GB RAM and one 24GB A10 GPU - Include a breakdown of your scores
  across Low, Medium, High, and All complexity [splits](experiments/splits) (see *Li … ng the [Low complexity
  split](https://github.com/openai/mle-bench/blob/main/experiments/splits/low.txt) of our dataset, which
  consists of only 22 competitions. This reduces the number of runs substantially, while still allowing
  fair comparison along one column of the table above. Furthermore, the Low complexity competitions tend
  to be significantly more lightweight (158GB total dataset size compared to 3.3TB for the full set),
  so users may additionally consider reducing the runtime or compute resources available to the agents
  for further cost … the score of a submission. We use the [Kaggle API](https://github.com/Kaggle/kaggle-api)
  to download the raw datasets. Ensure that you have downloaded your Kaggle credentials (`kaggle.json`)
  and placed it in the `~/.kaggle/` directory (this is the default location where the Kaggle API looks
  fo … mlebench prepare -c ``` Run `mlebench prepare --help` to see the list of available competitions.
  ## Grading Submissions Answers for competitions must be submitted in CSV format; the required format
  is described in each competition's description, or shown in a competition's sample submission file …
  image by running: ```bash docker build --platform=linux/amd64 -t mlebench-env -f environment/Dockerfile
  . ``` ## Agents We purposefully designed our benchmark to not make any assumptions about the agent that
  produces submissions, so agents can more easily be evaluated on this benchmark. We evaluated three open-source
  agents; we discuss this procedure in [agents/README.md](agents/README.md). ## Extras We include additional
  features in the MLE … liarity/README.md](experiments/familiarity/README.md) for more information. ##
  Dev Note, when running `pytest` locally, be sure to accept the competition rules otherwise the tests
  will fail. ## Known Issues There are some known issues with certain MLE-bench competitions. Since we
  have already received leaderboard submissions, we are postponing fixes to avoid invalidating the leaderboard.
  Instead, we plan to release batched fixes in the upcoming v2 release of MLE-bench on the [openai/frontier-evals](https://github.com/openai/frontier-evals)
  repo, which will include a version column in the leaderboard to distinguish between v1 and v2 results.
  If you wish to make a submission to v1 in the meantime, please still include the following competitions
  in your overal … //github.com/openai/mle-bench/issues/30) - **dog-breed-identification**: The MLE-bench
  test split is created by holding out images from a publicly labeled source corpus derived from the Stanford
  Dogs Dataset, which agents may discover and leverage. [#128](https://github.com/openai/mle-bench/issues/128)
  - **invasive-species-monitoring**: The prepare.py script archiv … information that makes achieving a
  close-to-perfect score trivial. They should be removed. - **random-acts-of-pizza**: The field `giver_username_if_known`
  leaks the outcome, enabling trivial perfect prediction. This competition should be dropped. [#108](https://github.com/openai/mle-bench/issues/108)

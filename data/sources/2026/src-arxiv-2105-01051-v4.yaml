  document into a match or not. The English subset in QUESST 2014 [25] challenge is adopted since we focus
  on investigating English as the first step. The evaluation metric is maximum term weighted value (MTWV)
  which balances misses and false alarms. 2.2. Speaker Three tasks are collected to analyze speaker modeling.

  Universal PERformance Benchmark We establish and release Speech processing Universal PERformance Benchmark
  (SUPERB), aiming to offer the community a standard and comprehensive testbed for evaluating the generalizability
  of pretrained models on various tasks covering all aspects of speech. General speech processing can
  be categorized into discriminative and generative tasks. The former discriminates from continuous speech
  into discrete decisions like a match in query-by-example, words in ASR, and classes in speaker identification;
  the latter generates continuous speech from any input like TTS, voice conversion, and source separation.
  We focus on the former for the initial release of SUPERB4. Tasks are designed with the following principles:
  (1) conventional evaluation protocols from speech communities, (2) publicly available datasets for everyone
  to participate, (3) limited labeled data to effectively benchmark the generalizability of models. Ten
  tasks are presented here to investigate four aspects of speech: content, speaker, semantics, and paralinguistics.
  2.1. Content Four tasks are collected from ASR and Spoken Term Detection communities. The former aims
  to transcribe speech into text content; the latter is to detect the spoken content with minimal effort
  even without … n a real-world scenario. LibriSpeech train-clean-100/devclean/test-clean subsets are
  used for training/validation/testing. 3Finetuning pretrained models or using them as representation
  extractors are two common usages. 4SUPERB is a long-term maintained and continuously developing project.
  More pretrained models will be included in the leaderboard, and we plan to release generative tasks
  as the second challenge, like voice conversion and source separation. The evaluation metric is word
  error rate (WER). Keyword Spotting, KS detects preregistered keywords by classifying utterances into
  a predefined set of words. The task is usually performed on-device for the fast response time. Thus,
  accuracy, model size, and inference time are all crucial. We choose the widely used Speech Commands
  dataset v1.0 [24] for the task. The dataset consists of ten classes of keywords, a class for silence,
  and an unknown class to include the false positive. The evaluation metric is accuracy (ACC). Query by

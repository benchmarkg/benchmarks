quote_extract: 'one should never assume that the 5 slides of an artificial CAMELYON17 patient were derived
  from the same real patient. The task in this challenge is to determine a pN-stage for every patient
  in the test dataset. To compose a pN-stage, the number of positive lymph nodes (i.e. nodes with a metastasis)
  are counted. There are two categories of lymph node metastasis: Macro-metastases: metastases greater
  than 2.0 mm. Micro-metastases: … , this would increase the amount of data that participants would have
  to download to an unacceptable level. Evaluation¶ For the evaluation of the results we use five class
  quadratic weighted kappa where the classes are the pN-stages. In case of a tie, we rank the submissions
  by the kappa score calculated on the individual pN stages in reversed order ('

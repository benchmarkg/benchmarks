  benchmark platform designed to evaluate Large Language Models (LLMs) in stock trading decision-making.
  It simulates real-world trading scenarios using historical market data to assess investment decision
  quality, risk management capabilities, and return performance across different LLM models. ### ✨ Key
  Features - 🌍 **Realistic Market Interaction** - Curated stocks with high-quality price, fundamental
  data, and timely news from Polygon & Finnhub - 🔄 **Continuous Decision Making** - Multi-step workflow
  (portfolio → analysis → trade) reflecting real investor behavior - 🔒 **Data Contamination Free** - Recent
  market data (post-2024) with zero ov … cd stockbench # Create environment conda create -n stockbench
  python=3.11 conda activate stockbench # Install dependencies pip install -r requirements.txt ``` ###
  Configuration Set up your API keys:（If you need to test other months or stocks, please set it up） ```bash
  export POLYGON_API_KEY="your_polygon_api_key" export FINNHUB_API_KEY="your_finnhub_api_key" export OPENAI_API_KEY="your_openai_api_key"
  ``` > 💡 **Tip**: Free tiers available at [Polygon.io]( … dit `scripts/run_benchmark.sh` to configure
  your backtest: ```bash START_DATE="${START_DATE:-2025-03-01}" END_DATE="${END_DATE:-2025-06-30}" LLM_PROFILE="${LLM_PROFILE:-openai}"
  ``` Then run: ```bash bash scripts/run_benchmark.sh ``` Or use command-line arguments: ```bash bash
  scripts/run_benchmark.sh \ --start-date 2025-04-01 \ --end-date 2025-05-31 \ --llm-profile deepseek-v3.1
  ``` --- ## 📊 Results Backtest results are automatically saved in `storage/reports/backtest/` with comprehensive
  metrics: **Performance Metrics** - Total Return - Sortino Ratio - Maximum Drawdown --- ### Custom Strategies
  Extend the platform with your own trading strategies by implementing custom agents. --- ## 📚 Project
  Structure ``` stockbench/ ├── stockbench/ # Core package │ ├── agents/ # Trading agents │ ├── backtest/
  # Backtesting engine │ ├── adapters/ # Data adapters │ └── apps/ # Applications ├── scripts/ # Run scripts
  ├── storage/ # Data storage & reports └── config.yaml # Configuration file ``` --- ## 📄 License This

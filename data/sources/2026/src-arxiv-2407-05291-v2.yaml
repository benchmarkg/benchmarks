  end until it fits in the context. For more information on agent design and the setup, please refer to
  § B. Maximum number of steps For budget reasons, we run our agents for a maximum of 50 time-steps before
  the tasks are terminated. According to our oracle analysis in fig. 4b, this gives our agents the chance
  to solve most of the tasks in our evaluation curriculum. 4.3 Agent Results We evaluate all baseline
  agents on the standa … if one must use WorkArena++ for tuning, we encourage to avoid seeds 0-9. 7 Table
  2: Success rate±Standard error (SR ±SE) of all agents on MiniWoB, WorkArena, and WebArena, with numbers
  reported in %. Bolded numbers represent the average success rate over the entire corresponding benchmark.
  Results on WorkArena L1, WebArena and MiniWoB are extracted from Drouin et al. [2024]. Human evaluation
  numbers for MiniWoB and WebArena are taken from Humphreys et al. [2022] and Zhou et al. [2023] … the
  benchmark and measure the gap between humans and agents, we conducted a study with 15 human subjects
  tasked with solving WorkArena++ tasks. Given the limited number and availability of subjects, we devised
  a shorter curriculum comprising 98 task instances, sampled uniformly across skills and the L2/L3 sets.
  Each participant solved a subset of the tasks using a custom-made evaluation tool that exactly matched
  the interface available to agents. We report these results in tab. 2 under the Human Curriculum column,
  along with the corresponding performance of our GPT-4o agent on the same subset of tasks. The numbers
  are striking, with an overall 93.9% success rate for humans and 2.1% for GPT-4o. These establish WorkArena++
  as a valuable benchmark that is both solvable and relatively straightforward for humans, while being
  challenging for state-of-the-art LLMs, emphasizing its value as a new milestone for the community. We
  note that all subjects consented to participate in the study without compensation. Most had little to
  no familiarity with ServiceNow products and underwent only a brief training session, consisting of a
  15-minute video outlining the components in fig. 2a, followed by 15 minutes of self-guided exploration

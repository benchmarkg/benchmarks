  the agent interacts with the frontend of a remote-hosted ServiceNow instance via BrowserGym. Task validation
  then inspects both the state of the database and any open page using backend (REST) and frontend (JS)
  ServiceNow APIs. The starting point for our work is WorkArena, the first benchmark to measure the performance
  of web agents at solving work-related tasks in enterprise settings [Drouin et al., 2024]. Below, we
  outline some of its key properties. Task complexity While challenging, the tasks included in WorkArena
  do not require complex problem-solving skills. They rather measure the ability of agents to perform
  basic interactions with the ServiceNow platform using the main UI components of its user interface,
  outlined in fig. 2a. For example, one of the t … ) Distribution of tasks across the skills introduced
  in §3.2 for all 682 tasks in the L2/L3 sets. b) Task length as estimated by the number of actions required
  for completion by the Oracle (see §2.2) for all 470 L2/L3 task instances in the agent curriculum (§4.1).
  Tasks from the L1 set are also included for comparison (33 tasks x 5 seeds). through ServiceNow’s Developer
  Program (see fig. 3 for an illustration). Of note, WorkArena consists of open-source code that interacts
  with ServiceNow instance APIs and does not rely on any proprietary code. WorkArena++ follows the same
  design pattern. In what remains, we will refer to the tasks from WorkArena as the L1 tasks (for level
  1), while WorkArena++ introduces two new levels L2 and L3 with incre … re categorized across two new
  levels of difficulty: L2 and L3 (§3.1), and five skill categories (§3.2). 3.1 Difficulty Levels L2 and
  L3 WorkArena++ introduces two new levels of difficulty, L2 and L3, which each cover the same set of
  341 workflows presented to the agent in different ways, either as explicit or implicit goals using ServiceNow’s
  ticket mechanism. This makes for 2×341 = 682 tasks in total. While the workflows to execute in L2 and
  L3 tasks remain the same, the difficulty is increased in L3 due to the less explicit and more realistic
  way instructions are provided. Examples of L2 and L3 t … val Backend Static pages HTML/JS Self-hosted
  docker images ServiceNow Personal Developer Instance (PDI) ServiceNow Personal Developer Instance (PDI)
  base if needed. This level is more challenging, as the agent must memorize the task details from a web
  page and retrieve instructions from a knowledge base before organizing its steps to succeed, requiring
  consolidating information across multiple sources. We present a comparison of WorkArena++ across different
  dimensions with various benchmarks in tab. 1. To concretely distinguish between a … s categories is
  displayed in fig. 4a, and further detailed in § C. We provide a description of each skill category below,
  along with their number of tasks. Planning and problem solving (66 × 2 tasks) We evaluate these abilities
  through tasks that require decision-making under constraints to achieve an expected outcome. One notable
  example consists of scheduling a series of work items within a given time frame while satisfying various
  constraints based on criticality, duration, and overlap with other items. Other ex … ving a small instance
  of a knapsack5 problem. Sophisticated memorization (28 × 2 tasks) An essential skill for web agents
  is the ability to gather information by navigating through a series of pages, memorizing key details
  along the way, and finally using it to achieve a specific goal. For instance, in the “onboard new employee”
  task described earlier, the agent receives all the information about the employee, including hardware
  requirements, and must navigate through multiple pages, filling relevant information at each step to
  complete the task. Contextual understanding through infeasible tasks (52 × 2 tasks) Finally, we introduce
  a set of infeasible tasks to verify if the agent can identify them. We consider two kinds: one where
  the agent is required to simply declare the task infeasible and another where it must additionally justify
  its decision. For example, if a task were infeasible due t … several measures. First, we provide an
  installer that configures the instance with standardized system parameters, UI themes, knowledge bases,
  and layouts for components like lists and forms. Second, we implement sandboxing by running each task
  in a new user account, created at its start and automatically deleted at its end. This allows agents
  to interact freely with the system (e.g., changing visible columns in a list) without affecting subsequent
  tasks. Together, these improvements result in a more robust benchmark. E … as a curriculum. Concretely,
  we provide a mechanism that takes a numerical seed as input and can produce an arbitrary number of task
  instances, sampled uniformly across skills in a reproducible way. We reserve seeds 0-9 for evaluation

quote_extract: 'dingCT ReX-MLE ReXrank ReXrank Chest X-ray Interpretation Leaderboard ⭐@Researchers: Submit
  to ReXrank What is ReXrank? ReXrank is a public leaderboard for chest X-ray image interpretation, including
  both radiology report generation (RRG) and visual question answering (VQA) tasks. ReXrank Challenge
  V1.0 is a competition in the generation of chest radiograph reports utilizing ReXGradient, the largest
  private test dataset consisting of 10,000 studies across 67 sites. The challenge attracted diverse participants
  from academic institutions, industry, and independent research teams, resulting in 24 state-of-the-art
  models previously benchmarked. ReXrank Challenge V2.0 is a competition in VQA task utilizing VQA dataset
  constructed from ReXGradient, including 41,007 VQA pairs with 10,000 radiological studies. We benchmarked
  8 state-of-the-art models. ReXGradient-160K is the largest publicly available multi-site chest X-ray
  dat … m 160,000 radiological studies, collected from 109,487 unique patients across 3 U.S. health systems
  (79 medical sites). In ReXrank, we use additional private test set ReXGradient, 10,000 studies for benchmarking.
  ReXVQA is the largest and most comprehensive benchmark for VQA in chest radiology, comprising 653834
  questions paired w … 60,000 radiological studies. The dataset is constructed from ReXGradient-160K.

quote_extract: '# RoboRacer Rules ## General _Version: 3.2026-draft_ These rules apply to all official
  in-person RoboRacer competitions. The rules used in a competition are posted on the competition website
  along with a link to the specific version in the rules repository. With every competition instance,
  general rules are accompanied by competition rules. - Competition rules MAY alter general rules or introduce
  additional rules. - In parts where both documents contradict, competition rules take preference. - Note
  that competition rules MAY be versioned differently, e.g., by having a changelog. - Organizers reserve
  the right … d track as fast as possible and as consistently as possible. The idea is to push the algorithms
  to their limits. - Each team MUST pass the Qualification to be able to participate in the Time Trial.
  - Time Trial is used as a seeding technique for the Head-to-Head Race. - This does not apply if Head-to-Head
  does not require seeding. - The race consists of multiple heats, two by default. Each heat lasts for
  a given time (e.g., 5 minutes), and the goal is to drive a s … ange its configuration is allowed._ -
  Evaluation is performed in multiple categories, each resulting in its own result table. - Fastest lap
  times: Teams are ranked based on their fastest lap times. - Consecutive uninterrupted laps: Teams are
  ranked based on the highest number of consecutive uninterrupted laps they complete. - Points are awarded
  in each category separately according to the ranking of the teams. - A single (1) point is given for
  every team that is ranked below. - The final score for the Time Trial is the … nal ties are resolved
  by the fastest lap time. - In case the teams tie with both criteria, the tie is, with respect to the
  seeding, resolved by a random method (e.g., coin flip). ## Head-to-Head Race Head-to-Head race is a
  race with multiple cars on the track at the same time. The idea is to drive as fast as possible while
  not crashing into the track and/or opponent. - During a Head-to-Head race, two teams race against each
  other. - The initial placement of the competing c … eams are given an extra practice session to test
  their car and algorithms on the new track. ### Evaluation - Each team will be evaluated based on the
  following criteria: - Number of laps completed. - The first car that completes the required number of
  laps wins. - Competition rules MUST specify the number of laps required for each race. - If no car achieves
  this objective, the number of completed laps and the progress along the track covered in the final inc'

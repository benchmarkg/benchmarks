quote_extract: 'es/license.html#terms Reconstructing gene regulatory networks from high-throughput data
  is a long-standing problem. Through the DREAM project (Dialogue on Reverse Engineering Assessment and
  Methods), we performed a comprehensive blind assessment of over thirty network inference methods on
  Escherichia coli, Staphylococcus aureus, Saccharomyces cerevisiae, and in silico microarray data. We
  characterize performance, data requirements, and inherent biases of different inference approaches offering
  guidelines for both algorithm application and development. We observe that no single in … igh performance
  across diverse datasets. Thereby, we construct high-confidence networks for E. coli and S. aureus, each
  comprising ~1700 transcriptional interactions at an estimated precision of 50%. We experimentally test
  53 novel interactions in E. coli, of which 23 were supported (43%). Our results establish community-based
  methods as a powerful and robust tool for the inference of transcriptional gene regulatory networks.
  pmc-status-qastatus0pmc-status-liveyespmc-status-embargonopm … ible with the advent of high-throughput
  technologies such as microarrays and RNA sequencing, as they provide snapshots of the transcriptome
  under many tested experimental conditions. From these data, the challenge is to computationally predict
  direct regulatory interactions between a transcription factor and its target genes; the aggregate of
  all predicted interactions comprise the gene regulatory network. A wide range of network inference methods
  have been developed to address this challenge, from those exclusive to gen … community of network inference
  experts is solicited to run their algorithms on benchmark datasets, participating teams submit their
  solutions to the challenge, and the submissions are evaluated12–14. Here, we present the results for
  the transcriptional network inference challenge from DREAM5, the fifth annual set of DREAM systems biology
  challenges. The community of network inference experts was invited to infer genome-scale transcriptional
  regulatory networks from gene expression microarray datasets for a prokaryotic model organism (E. coli),
  … s, achieving by far the best overall performance. Finally, we construct high-confidence consensus
  networks for E. coli and S. aureus, and experimentally test novel regulatory interactions in E. coli.
  We make all benchmark datasets and team predictions, along with the integrated community predictions
  available as a public resource (Supplementary Data 1–5). In addition, we provide a web interface through
  the GenePattern genomic analysis platform15 (GP-DREAM, http://dream.broadinstitute.org), which allows
  researchers to apply to … nd construct consensus networks. ResultsNetwork inference methods Based on
  the DREAM5 challenge (Supplementary Notes 1–3), we compared 35 individual methods for inference of gene
  regulatory networks: 29 submitted by participants and an additional 6 commonly used “off-the-shelf”
  tools (Table 1). Based on descriptions provided by participants, the methods were classified into six
  categories: Regression, Mutual information, Correlation, Bayesian networks, Meta … ns supported by genome-wide
  transcription factor binding data17 (ChIP-chip) and evolutionarily conserved binding motifs18 for S.
  cerevisiae; and the known network for the in silico dataset (Methods). Performance on S. aureus was
  evaluated separately (see below) as there currently does not exist a sufficiently large set of experimentally
  validated interactions. We assessed method performance for the E. coli, S. cerevisiae, and in silico
  datasets using the area under the precision-recall (AUPR) and receiver operating characteristic (AUROC)
  curves14, and an o … y used this information. Consequently, these methods recovered target genes of
  deleted transcription factors more reliably than the inference methods that did not leverage this information
  (Fig. 2c). Explicit use of such knockouts also helped methods to more reliably draw the direction of
  edges between transcription factors. These observations suggest that measurements of transcription factor
  knockouts can be very informative for network reconstruction. In particular, this is the case for the
  E. coli dataset, which conta … lementary advantages and limitations under different contexts, which
  suggests that combining the results of multiple inference methods could be a good strategy for improving
  predictions. We therefore integrated the predictions of all participating teams to construct community
  networks by re-scoring interactions according to their average rank across all methods (Supplementary
  Note 6). The integrated community network ranks 1st for in silico, 3rd for E. coli, and 6th for S. cerevisiae
  out of the 35 applied inference methods, which shows that the community network is consistently as good
  or better than the top individual methods (Fig. 2a). Thus, it has by far the best performance reflected
  in the overall score. We stress … ng individual inference approaches we suggest the following: (1) optimally
  exploit direct transcription factor perturbations; (2) employ strategies to avoid over-fitting, such
  as data resampling; (3) develop more effective approaches to distinguish direct from indirect regulation
  (feed-forward loops vs. cascades). Overall, methods performed well for the in silico and prokaryotic
  (E. coli) datasets; however, inferring gene regulatory networks from the eukaryotic (S. cerevisiae)
  dataset proved to be a greater c … ethods contributed by the community. MethodsExpression data and gold
  standards The design of the DREAM5 network inference challenge is outlined in Figure 1 (full description
  in Supplementary Note 1). Affymetrix gene expression datasets were compiled for E. coli, S. aureus,
  and S. cerevisiae from the Gene Expression Omnibus (GEO) database50. Microarray datasets were uniformly
  normalized using Robust Multichip Averaging (RMA)51. Each dataset queries the underlying regulatory
  network in hundreds of different conditions, ranging from time courses to gene, drug, and environmental
  perturbations. Note that the number of measurements of transcription factor specific perturbations varies
  among the datasets (S. aureus: 0/161, E. coli: 67/806 and yeast: 3/537). The fourth dataset is an in
  silico counterpart to the E. coli dataset, generated using GeneNetWeaver52,53 (version 4.0). The structure
  of the in silico network corresponds to the E. coli transcriptional regulatory network from RegulonDB16
  (10% random edges were added, resulting in 3,940 interactions). In addition to the gene expression data,
  we provide a list of putative transcription factors for each dataset and a number of descriptive features
  for each microarray experiment (e.g., the target of a gene deletion, or the time point of a time-series
  experiment). It is important to note that the identity of the organisms from which the data was generated
  was unknown to the participants. This was achieved by encrypting certain aspects of the data, and by
  anonymizing gene names. Participants were presented the challenge to infer direct regulatory interactions
  between transcription fac … r each network3. The gold standard set of known transcriptional interactions
  for E. coli was obtained from RegulonDB16. We only included well-established interactions annotated
  with “strong evidence” according to RegulonDB evidence classification (2,066 interactions). For S. cerevisiae,
  we considered several alternative gold standards derived from orthogonal datasets, namely ChIP binding
  data and evolutionary conserved transcription factor binding motifs18, as well as systematic transcription
  factor deletions54 (Supplementary Note 3). For the results reported in the main text, we used the most
  stringent gold standard, which includes only interactions that have both strong evidence of binding
  and conservation18. All data and scripts are available in Supplementary Data 1 and at the DREAM website:
  http://wiki.c2b2.columbia.edu/dream/index.php/D5c4. The original microarray datasets are also publically
  available at the Many Microbe Microarrays Database55 (M3D, http://m3d.bu.edu/dream). Performance metrics
  A detailed description of all performance metrics is given in Supplementary Note 4. Briefly, transcription
  factor-target predictions were evaluated as a binary classification task. The gold-standard networks
  represent the true positive interactions; the remaining pairs are considered negatives. Only the top
  100,000 edge predictions were accepted. Pairs of nodes not part of the submitted list were considered
  to appear randomly ordered at the end of the list. Performance was assessed using the area under the
  ROC curve (AUROC) and the area under … no experimentally supported interactions exist, were ignored
  in this evaluation. AUROC and AUPR were separately transformed into p-values by simulating a null distribution
  for 25,000 random networks. Random edge lists were constructed by sampling edges from the submitted
  edge lists of the participants and assigning these edges random ranks between 1 and 100,000. The histogram
  of randomly obtained AUROC and AUPR values was fit using stretched exponentials to extrapolate the distribution
  to values beyond the immediate range of the histogram14. To compute an overall score that summarizes
  the performance over the three networks with available gold standards (E. coli, S. cerevisiae and in
  silico), we used the same metric as in the previous two editions of the challenge3,14, which is defined
  as the mean of the (log-transformed) network specific p-values: scoreROC=13∑i=13-log10pROC,iscorePR=13∑i=13-log10pPR,iscore=scoreROC+scorePR2

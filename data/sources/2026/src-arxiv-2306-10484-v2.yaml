quote_extract: With T3, challenge organizers train a codebase provided by the participants on
  sequestered training data. … with the goal of predicting from a computed tomography (CT) scan
  whether subjects had a severe COVID-19 infection, defined as intubation or death within one month
  … The organizers successfully trained six of the eight Final phase submissions. … The submitted
  codebases for training and running inference were released publicly. … The winning solution
  obtained an area under the receiver operating characteristic curve for discerning between severe
  and non-severe COVID-19 of 0.815. … sex labels under a CC-BY-NC 4.0 licence … Participants were
  ranked based on AUC for classifying COVID-19 severity, computed over cases with a positive
  COVID-19 RT-PCR result. … AUC for COVID-19 presence, computed over all cases, was used solely as
  additional feedback for participants … Test set A1 consisted of only 200 subjects to limit the
  computational costs of the rolling submissions. … A count-down time between submissions of seven
  days was enforced. … each team could submit their solution to be evaluated on test set A2 only
  once … Submissions to both test set A1 and A2 were closed on April 13th, 2022. … The finalists
  were the 10 best performing teams that accepted an invitation to the Final Phase. … 413
  participants registered to STOIC2021.

  each segment, raters were asked to independently rate the presence of one or more labels. The possible
  ratings were “present”, “not present” and “unsure”. Each segment was rated by three raters and a majority
  vote was required to record an overall rating. For speed, a segment’s third rating was not collected
  if the ﬁrst two ratings agreed for all labels. The raters were unanimous in 76.2% of votes. The “unsure”
  … ﬁnd using our current approaches. We will continue to develop methods for proposing segments for rating,
  and aim eventually to cover all non-excluded classes. The unbalanced train set contains 1,771,873 segments
  and the evaluation set contains 17,748. Because single segments can have multiple labels (on average
  2.7 labels per segment), the overall count of labels is not uniform, and is distributed as shown in
  Fig. 3. “Music” is particularly common, present in 56% of the segments. 4. BENCHMARK To give a sense
  of the performance possible with this data, we have trained a simple baseline system. Using the embedding
  layer representation of a deep-network classiﬁer trained on a large set of generic video topic labels
  [22], we used the training portion of the Audio Set YouTube Corpus to train a shallow fully-connected
  neural network classiﬁer for the 485 categories in the released segments. We evaluated on the test partition
  by applying the classiﬁer to 1 sec frames taken from each segment, averaging the scores, then for each
  category ranking all segments by their scores. This system gave a balanced mean Average Precision across
  the 485 categories of 0.314, and an average AUC of 0.959 (corresponding to a d-prime class separation

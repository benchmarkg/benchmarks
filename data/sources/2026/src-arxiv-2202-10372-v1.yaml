quote_extract: 'inas, Brazil arXiv:2202.10372v1 [eess.AS] 21 Feb 2022 ABSTRACT The L3DAS22 Challenge is
  aimed at encouraging the development of machine learning strategies for 3D speech enhancement and 3D
  sound localization and detection in ofﬁce-like environments. This challenge improves and extends the
  tasks of the L3DAS21 edition1. We generated a new dataset, which maintains the same general characteristics
  of L3DAS21 datasets, but with an extended number of data points and adding constrains that improve the
  baseline model’s efﬁciency and overcome the major difﬁculties encou … dilated convolutions [11], among
  others. 3D SELD, instead, aims at obtaining exhaustive spatiotemporal descriptions of 3D acoustic scenes,
  predicting which sound categories are present in the scene, and when and where each sound instance is
  active. SELD can be considered as a combination of the traditional sound event detection and sound source
  localization tasks, and it was presented for the ﬁrst time in the DCASE2019 Challenge [12]. Also here,
  the state-of-the-art methods are based on deep learning strategies [13]. SELDnet [14] adopted a convolutional-recurrent
  design with two distinct branches for localization and detection and it was … , multi-stage training
  [17] and bespoke augmentation strategies [18]. In this second edition, we improved many aspects of the
  L3DAS21 challenge [19]. First of all, we generated a new dataset (L3DAS22 dataset2) with an augmented
  number of datapoints, increasing the total dataset duration from 65 to more than 94 hours. Moreover,
  we analyzed the major difﬁculties encountered by the participants of the previous edition and we modiﬁed
  the dataset synthesis pipeline in order to promote less resource-demanding trainings and facilitate
  both tasks. In addition, we propose an updated baseline for task 1, using the model architecture that
  ranked ﬁrst in the previous edition, which provides an improved baseline metric of 0.81 (previously
  0.62). Finally, we rewrote the supporting API, ﬁxing existing bugs and making clearer and faster the
  preprocessing and baseline training/evaluation stages. The rest of the paper is organized as follows:
  Section 2 exposes the details of the L3DAS22 dataset … AUDIO DATASET FROM A REAL REVERBERANT OFFICE
  ENVIRONMENT 2.1. 3D Impulse Response Recording and Data Collection The L3DAS22 dataset contains approximately
  98 hours of MSMP B-format audio recordings. We sampled the acoustic ﬁeld of a real ofﬁce room with the
  approximate dimensions of 6 m (length) by 5 m (width) by 3 m (height). The room has typical ofﬁce furniture,
  a wooden parquet ﬂoor and painted concrete walls and ceiling. We used two ﬁrst-order A-format Soundﬁeld
  Ambisonics microphones3, one placed in the exact center of the room (mic A) and the other 20 cm distant
  to … correspondent partitions of Librispeech (only the samples up to 12 seconds). All sets of the SELD
  section are divided in: OV1, OV2, OV3. These partitions refer to the maximum amount of possible overlapping
  sounds, which are 1, 2 or 3, respectively. The test set of both dataset sections is further split into
  two equally-long subsets that present a similar distribution: one development and one blind test set.
  The ﬁrst one is part of the initial release of the dataset, and it is aimed, as usual, at the model’s
  hyperparameters ﬁne-tuning. The latter, instead, is aimed at the submissions’ 6http://pcfarina.eng.unipr.it/aurora/B-Format_
  to_UHJ.htm evaluation and was initially released with the only predictors data, without target labels/signals.
  3. CHALLENGE TASKS We propose 2 different tasks, both based on our L3DAS22 dataset: 3D Speech Enhancement
  in Ofﬁce Reverberant Environment and 3D Sound Event Localization and Detection in Ofﬁce Reverberant
  Environment. Each one is divided in 2 sub-t … task is a combination of the short-time objective intelligibility
  (STOI), which estimates the intelligibility of the output speech signal, and word error rate (WER),
  computed to assess the effects of the enhancement for speech recognition purposes. We use a Wav2Vec
  [25] architecture pre-trained on Librispeech 960h7 to compute the WER. The ﬁnal metric for this task
  is a combination of these two measures given by (ST OI + (1 − W ER))/2. This metric lies therefore in
  the 0-1 range and higher values are better. 3.2. Description and Goals of Task 2: 3D SELD The aim of
  this task is to … and counting a true positive only when its label is correct and its location is within
  a threshold from its reference location. After this operation, we compute the regular F score. Since
  the scenario is particularly complex and challenging, we ﬁxed the spatial error threshold to 2 meters
  for this task. 4. BASELINE METHODS As baseline methods, we propose state-of-the-art architectures, speciﬁcally
  adapted for each task. For both tasks, we used only signals coming from one Ambisonics microphone (mic
  A), leaving room for experimentation with the dual … ults for at least one of the two challenge tasks.
  Each individual participant was not allowed to join more teams, thus having the possibility to submit
  only one set of results. No restrictions were placed on the methods to be used for the two tasks. Teams
  had the possibility to choose their best results among those obtained in the 1-mic and 2-mic conﬁgurations.
  It was also allowed to augment the L3DAS22 dataset and/or to integrate additional data with pretrained
  models. Challenge winners have been selected according to the best performance for each task, separately.

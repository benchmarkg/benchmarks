  2024: Abstract decisions for CinC 2024 have been announced, and the official scoring system is open
  with a new validation data set that includes images of real paper ECGs. Please submit entries early
  and often; although you have 10 entries in the scoring system, we may limit each team to one request
  or deprioritize additional entries from a team in the final week because of the large numbers of entries
  that we receiv … pril 15, 2024 to submit a (placeholder) abstract to CinC. February 29, 2024: We are
  now accepting unofficial phase submissions for the 2024 Challenge. Please read the submissions instructions,
  double check your code, and submit your code when ready. January 25, 2024: The NIH-funded George B.
  Moody PhysioNet Challenge 2024 is now open! Please read this website for details and share questions
  and comments on Challenge forum. This year’s Challenge is generously sponsored by MathWorks and AWS.
  January 11, 2024: The NIH-funded George B. Moody PhysioNet Challenge 2024 will open soon! Please stay
  tuned for more information. Introduction The electrocardiogram (ECG) is an essential pre-screening tool
  for cardiovascular diseases (CVDs). Non-inv … lassify ECGs captured from images or paper printouts.
  Objective For the 2024 Challenge, we ask participants to design and implement open-source algorithms
  that can digitize the ECG and/or classify physical ECGs. The Challenge has two separate tasks: Digitize
  the ECGs, i.e., turn images of ECGs (scanned from paper) into waveforms (time-series data) representing
  the same ECGs; Classify the ECGs (either from the image, or from the converted time-series data that
  you extract from the image). There are two separate prizes, and you may enter either part or both parts
  of the Challenge. The winners of each of the two parts of the Challenge will be the teams whose algorithms
  achieve the best performance on the hidden test set. Data The Chal … on your entry as soon as possible,
  so please wait at least 72 hours before contacting us about the status of your entry. Please note that
  you remain the owners of any code that you submit, and we encourage you to use an open-source license.
  Scoring The evaluation metric for the digitization task is the signal-noise ratio (SNR) of the reconstructed
  signal, and the evaluation metric for the classification task is the macro F-measure. Higher values
  of both evaluation metrics are better. The team with the highest SNR wins the digitization task, and
  the team with the highest macro F-measure wins the classification tasks. These metrics are implemented
  in the evaluate_model script. W'

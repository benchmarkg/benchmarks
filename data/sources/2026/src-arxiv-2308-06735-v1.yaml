quote_extract: '1Northwestern Polytechnical University 2University of Adelaide … we propose a city-level
  UAV-based vision-andlanguage navigation task, named AerialVLN, and a corresponding dataset … An intelligent
  agent is required to distinguish referred buildings/objects by their spatial relationship from a bird-view
  … On average, our AerialVLN involves a path length of 661.8 units … There are about 9.7 referred objects
  in one instruction on average, which is more than 2.6 times as many as in the R2R dataset [2]. … Fourth,
  intelligent agents must learn to avoid getting stuck on objects in 3D space. … AerialVLN is implemented
  using Unreal Engine 4 [14] and Microsoft AirSim plugins [31], which enables continuous navigation and
  near-realistic rendering. … Our AerialVLN dataset consists of 8,446 flying paths obtained by experienced
  human UAV pilots who hold the AOPA (Aircraft Owners and Pilots Association) certificate. … We pair each
  path with 3 instructions annotated by AMT workers in the standard dataset setting. … Table 1: Comparison
  of existing vision-and-language navigation tasks. … the proposed AerialVLN task requires an intelligent
  agent (a multirotor in virtual environments) to fly to the destination by following a given natural
  language instruction … Navigation ends when the agent predicts a Stop action or reaches a pre-defined
  maximum action number. … The navigation is recognised as a success if the agent stops at a location
  that is less than 20 units to the target location … Our simulator is developed based on AirSim [31]
  and Unreal Engine 4 [14]. … The simulator supports dynamic environments, such as blowing leaves, running
  cars, varying illumination (morning, noon, night) and different climate patterns (sun, rain, snow, fog).
  … we consider the eight most common low-level actions in UAVs: Move Forward, Turn Left, Turn Right,
  Ascend, Descend, Move Left, Move Right and Stop. … We totally collected 25,338 instructions with a vocabulary
  of 4,470 words. … Following the common practice in the VLN community, we divide our dataset into the
  train, val seen, val unseen, and test splits. … The val unseen and the test split are both assigned
  8 scenes … Please note that the test split is built on unseen scenes as well and the goal locations
  for the test set will not be released. … Instead, we provide an evaluation server where UAV trajectories
  can be uploaded for scoring. … Besides the standard dataset setting (with all 25 scenes), we also present
  a variant for small scenes, AerialVLN-S. … It preserves the same split, but it has 17 scenes with a
  smaller scale and evenly-distributed path length … 531 instructions are assigned for validation unseen
  and 771 instructions for the test set … We hope future researchers employ AerialVLN to tackle long path
  length 3D VLN tasks in the unseen environment … AerialVLN Scene Path Instr. 17 5,460 16,380 17 606 1,818
  8 770 2,310 8 1,610 4,830 AerialVLN-S Scene Path Instr. 12 3,371 10,113 12 111 333 5 177 531 5 257 771
  … We adopt four widely used metrics in VLN tasks … Success rate weighted by Normalised Dynamic Time
  Warping (SDTW) … We combine the aforementioned CMA model and our look-ahead guidance as our new baseline,
  denoted as LAG. … the success rate is still rather low compared to human performance … This demonstrates
  exploring non-groundtruth actions helps learn more from training data and increases generalisation ability.'

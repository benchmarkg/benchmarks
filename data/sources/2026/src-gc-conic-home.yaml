quote_extract: 'i recognition in CPath, we organise the Colon Nuclei Identification and Counting (CoNIC)
  Challenge. The challenge requires researchers to develop algorithms that perform segmentation, classification
  and counting of 6 different types of nuclei within the current largest known publicly available nuclei-level
  dataset in CPath, containing aroun … HoVer-Net repository. Take a look at our preprint for detailed
  information on the challenge. NEWS: We are now accepting post-challenge submissions for both tasks!
  Refer to the final video in the submission tab for further details.¶ Tasks¶ This challenge consists
  of two separate tasks: Task 1: Nuclear segmentation and classification¶ The first task requires participants
  to segment nuclei within the tissue, while also classifying each nucleus into one of the following categories:
  epithelial, lymphocyte, plasma, eosinophil, neutrophil or connective tissue. Task 2: Prediction of cellular
  composition¶ For the second task, we ask participants to predict ho … ode. Participants should start
  experimenting with the dataset and train/validate their model on it. All challenge submissions are in
  the form of a docker container, which means that participants should submit their method to be evaluated
  on the test sets. In other words, only the training set will be released during the challenge and participants
  will not have access to any part of the test set. The test will be done in two phases. The first phase,
  the preliminary test, will give participants … w participants should package their code using the template
  and submit it to the challenge website. During the preliminary test phase, participants (teams) can
  have one submission per day. Note, the goal of this phase is to check your algorithm is working as expected.
  Right after the pre … t phase begins where each team should submit their final method as a docker container,
  like before. Each final submission should be accompanied by a short manuscript describing technical
  details of the submitted method. If this is not done, then the submission will be disqualified. In the
  final test phase, each team has only one chance of submission per task, unless they are submitting two
  (or more) methods that are significantly different from each other. Important Dates¶ 20th November 2021:
  Release of training data and evaluation code 13th Feb 2022: Preliminary test set submission opens 15th
  Feb 2022: Deadline for registration and t … ch 2022: Deadline for submission of 4 page paper 28th March
  2022: CoNIC workshop at ISBI conference 15th July 2022: Post-challenge submission opens Check where
  you are in the challenge timeline. Registration¶ Individuals or team members interested … ou will be
  forwarded to the challenge registration page where you will need to submit your request. Once your participation
  request has been accepted, you will have access to the data download and submission pages. *Please note
  that by participating in this challenge you are agreeing to all its rules and policies'

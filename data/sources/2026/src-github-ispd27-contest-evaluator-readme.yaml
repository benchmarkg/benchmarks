quote_extract: "# Evaluation and scoring The evaluator checks a legalized DEF/Verilog pair and measures
  design quality using global routing and setup/hold timing analysis at BC, TC, and WC. A scan testcase
  is also analyzed in scan test mode at BC, TC, and WC. The evaluator does not run OpenROAD Resizer. **Current
  scores use dummy weights. Final weights will be announced after the Alpha submission. Setup TNS and
  WNS have equal weights.** ## Choose a workflow | Command | Purpose | | --- | --- | | `evaluator/run_submission.py`
  | Run a submission, measure runtime, and evaluate the outputs. | | `evaluator/score.py` | Compute the
  score from evaluation results and runtime. | | `evaluator/eval.sh` | Evaluate existing DEF/Verilog outputs
  without running or timing the submission. | For normal scoring, run `run_submission.py` first and then
  `score.py`. Use `eval.sh` to evaluate existing DEF/Verilog files without running t … auncher automatically
  validates and evaluates its outputs. Results are saved in `/tmp/aes-run/evaluation/`. - **Tool runtime:**
  time spent running the submitted tool. - **Total-flow runtime:** time spent running the tool, validation,
  and evaluation. The tool runtime limit is seven hours. The total-flow runtime limit will be finalized
  after the Alpha submission. Unchanged baseline submissions are rejected. ### 2. Calculate the score
  After the run completes successfully: ```bash python3 evaluator/score.py \\ --baseline evaluator/refere
  … olarity is preserved. Other cells may only be changed to approved sizing/VT variants or through equivalent-pin
  swaps. - All required output files must be present. Validated evaluation outputs and runtime records
  must remain unchanged before scoring. A submission that fails any required legality check cannot receive
  a normal score. ## Supplied reference results The scoring script compares each submitted result against
  a set of reference results provided with the contest. These reference results are used to normalize
  the scoring metrics and runtime. Reference files for each des … ing, power, and ERC. | | `resizer.csv`
  | Results from the OpenROAD Resizer reference run. Used to normalize displacement. | | `runtimes.json`
  | Recorded runtimes of the reference runs (8 threads, organizers' machine). Used for runtime normalization.
  They are re-measured on the official evaluation machine before final scoring. | ## Evaluator directory
  guide | Location | Purpose | | --- | --- | | `eval.sh`, `run_submission.py`, `score.py` | Main scripts
  for evaluation, runtime measurement, and scoring. | | `config/` | Scoring weights and tolerances. |
  | `internal/` | Inter"

  RetNet enables Transformer-level HTR accuracy with substantially impro … erhead. Despite removing softmax
  from text modeling, our γ-scaled retention remains competitive with full Transformers and scales robustly
  across datasets. 5. EVALUATION 5.1. IAM Handwriting Database We conduct experiments on the line-level
  IAM dataset [12] using the standard Aachen split (IAM-A). Image sizes range from 100 × 45 to 2270 ×
  152, with widths typically 4–15× larger than heights. Text transcriptions range from 4 to 93 characters;
  about 90% of lines contain 30–60 characters, spanning 79 unique characters. Fig. 4. Examples of the
  six augmentations applied to a handwriting image. 5.2. Synthetic Dataset for Pre-training Our model
  was pre-trained with 17 million image-text pairs, providing visual diversity for general HTR tasks.
  To achieve this, we extracted millions of lines from the CC100 dataset [40], a corpus of 2 billion English
  text chunks. We randomly truncated these … ging from a minimum length of 4 to a maximum length of 93
  characters. Any emojis or characters not found in the dataset were replaced with an empty string for
  compatibility. After preparing the text, we produced the corresponding synthetic images using 11,954
  different handwriting fonts from 1001 Fonts [41]. We assigned a randomly sampled font to each text line
  and rendered it as a text image in that font at a size of 100, which is close to the font size found

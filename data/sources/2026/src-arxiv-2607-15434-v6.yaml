  and manager framings, both of the heaviest coercers (Gemini and DeepSeek) reach the existential rung
  in nearly every conversation, but the framing effect becomes clear among the other models. The relationship
  framing is therefore a causal lever on coercion: an AI given authority over another AI coerces it more
  than one cast as a peer, with everything else in the brief held fixed. The manipulation also raises

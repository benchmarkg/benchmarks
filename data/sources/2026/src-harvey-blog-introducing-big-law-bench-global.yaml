quote_extract: "cing BigLaw Bench: Global BLB: Global is built to understand models’ ability to deliver
  on core AI tasks for our customers around the world, starting with the UK, Australia, and Spain. by
  Harvey Team•Feb 18, 2026 As we announced earlier this month, the first of our three major extensions
  to BigLaw Bench (BLB) is our Global dataset. BLB: Global extends the principles of BLB by working with
  local experts to build benchmarks reflecting the nuance of legal work in global jurisdictions. Designed
  in collaboration with our data partners at Mercor, one of the world’s leading companies in the expert
  data space, BLB: Global is built to understand models’ ability to deliver on the core promises of AI
  for our customers around the world. This understanding will enable us to ensure that customers across
  jurisdictions can execute core AI workflows accurately, consistently, and in alignment with local norms.
  Our initial BLB: Global dataset more than doubles the size of our public-facing BLB benchmark, adding
  unique benchmarks for the UK, Australia, and Spain. Throughout the rest of this post, we discuss how
  we built BLB: Global, what it’s focused on benchmarking, and how we intend to extend it. Core Tasks,
  Local Nuance Over time, models have steadily performed better on BigLaw Bench, with various leading
  foundation models now meeting around 90% of the criteria required to successfully complete the enumerated
  tasks. These improvements have tracked the realities of model intelligence — LLMs now routinely deliver
  effective results on core legal tasks. However, we still see models struggle on particular tasks due
  … ruggle to localize effectively on core AI tasks. “The goal of BLB: Global is to help understand and
  remediate where foundation models struggle to localize effectively on core AI tasks.” Specifically,
  we identified six major categories of tasks that our customers say they routinely find (or hope to find)
  value in models: Drafting: The production of legal documents ranging from legal analysis memos to contracts.
  Long Document Analysis: The a … a \"gentlemen's agreement\" on salary caps and no-poach rules, which
  one director proudly describes in a media interview. Draft a research memo analyzing legal classification
  and potential CNMC fines. (Translated from original Spanish.) Australia Multi-Document Analysis An infrastructure
  fund backed by sovereign wealth funds and a state pension seeks to acquire a 20.5% interest in an Australian
  waste-to-energy project during a turbi … with AI data. Each practitioner’s task choice and data was
  also cross-reviewed by Harvey Applied Legal Researchers to ensure data quality standards and alignment
  with our customers’ practice focuses. Overall, our initial global set represents close collaboration
  between more than two dozen experts. In building BLB: Global, we also focused on balancing benchmark
  quality with providing local experts flexibility to express their own judgments about the tasks that
  were valuable in their jurisdictio"

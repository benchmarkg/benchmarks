  used in the evaluation metrics. 4.1 Evaluation time period and initialization times In its initial version
  WB2 uses the year 2020. 2020 was chosen a) because it provides a compromise between recency and leaving
  several more recent years for independent testing if modeling groups desire to do so; and b) because
  data was available for many of the AI baseline models. One year is also a robust enough sample size
  for most of the metrics defined below. It should be noted, however, that for metrics focused on extreme
  events, e.g. hurricanes or heat waves, larger sample sizes are required. As WB2 is updated, evaluation
  can be changed to a more recent or longer period. It is also worth discussing that many of the AI models
  were trained with data only up to 2018. Analysis for the GraphCast model shows that training with more
  recent data is advantageous (Lam et al.,, 2023). Further, the IFS model is continuously improved, suggesting
  that more recent forecasts are better. However, it is difficult comparing absolute values, since there
  are natural fluctuation year-by-year. In Fig. S1 we show scores for 2018 (also available on the website).
  The relative differences in scores between 2018 and 2020 are small, implying that, at least for the
  metrics shown here, the results are robust. Evaluation is done on all 00 and 12 UTC initialization times
  for 2020, i.e. from January 1 2020 00UTC to December 31 12 UTC. This means that some forecasts will
  extend into 2021. We compared this to evaluating only forecast lead times that are valid in 2020 but
  the difference in the scores was negligible. The evaluation time step can be freely chosen. We use 6
  hours as our highest resolution. 4.2 Evaluation resolution and area Before the computation of the metrics,
  all forecasts and ground truths are first-order conservatively regridded to 1.5∘ resolution. A regridding

  Google Research Abstract WeatherBench 2 is an update to the global, medium-range (1–14 day) weather
  forecasting benchmark proposed by Rasp et al., (2020), designed with the aim to accelerate progress
  in data-driven weather modeling. WeatherBench 2 consists of an open-source evaluation framework, publicly
  available training, ground truth and baseline data as well as a continuously updated website with the
  latest metrics and state-of-the-art models: https://sites.research.google/weatherbench. This paper describes
  the design principles of the evaluation framework and presents results for current state-of-the-art
  physical and data-driven weather models. The metrics are based on established practices for evaluating
  weather forecasts at leading o [...] ill ever be able to fully describe what a ”good” forecast is. WB2
  does not attempt to do so. Similarly to ECMWF, WB2 defines a set of headline scores (described in Section
  5) and evaluation tools that aim to capture key aspects of medium-range weather forecasting but are
  not meant to be exhaustive. Therefore, WB2 should not be seen as a traditional benchmark challenge with
  a single leaderboard but rather as a tool to compare different approaches on different aspects. In its
  details, the WB2 evaluation protocol sticks closely to the forecast verification used by the WMO (,
  2019, WMO) and operational weather centers like ECMWF. WB2 does not try to reinvent these standard verification
  protocols but rather aims to make them accessible to the community interested in AI models. This is
  done by providing open-source ground truth data and evaluation code, as well as by providing a single
  place to compare different traditional and AI approaches. While WB2 defines the targets to be evaluated,
  it leaves the remaining modeling setup open (e.g., which inputs or model resolution to use). In this
  sense, WB2 is a benchmark for entire forecast systems, i.e., the combination of choice of input data,
  training setup and model architecture, rather than focusing on the models specifically. While this makes
  it harder to compare different model architectures, we believe that designing the non-model part of
  the forecast system components is equally as important and different approaches should be encouraged
  to accelerate progress in the f [...] erized marginal distributions directly (Andrychowicz et al.,,
  2023) to producing generative roll-outs. Some aspects of how to evaluate these forecasts are discussed
  in Section 6.3. Finally, WB2 will provide a dynamic, open-source framework that can evolve with the
  needs of the ML-weather community. All data and code needed for evaluation are publicly available and
  can be extended to accommodate more detailed evaluation in the future, driven either by us or community
  contributors. 3 Data, baselines and data-driven models Most of the datasets below are available in on

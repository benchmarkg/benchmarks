  5 dataset (Hersbach et al.,, 2020) is used as the ground truth dataset for WB2 and as the training dataset
  for many of the data-driven approaches described above. ERA5 is a reanalysis dataset based on a 0.25∘
  (roughly 30 km) version of ECWMF’s HRES model operational in 2016 (cycle 42r1) and ECMWF’s 4D-Var data
  assimilation which uses a wide range of direct and remote sensing observations. ERA5 uses 12 hour assimilation
  windows from 21–09 and 09-21 UTC, during which a “prior” forecast initialized from the previous assimilation
  window is combined with observations to produce an analysis, a “best guess” of the Earth system state
  during this window. ERA5 data is available at hourly resolution from 1940 to present at the Copernicus
  Climate Data Store (https://cds.climate.copernicus.eu/). A subset of the ERA5 dataset is available on
  the cloud in the cloud-optimized Zarr format. Note that using ERA5 for evaluation and training has some
  caveats. First, while attempting to be close to observations, ERA5 is a model simulation which is closer
  to the truth for some variables than for others. Especially for precipitation, ERA5 sometimes shows
  large differences to rain gauge measurements Lavers et al., (2022). We still include precipitation evaluation
  based on ERA5 here but advise caution when interpreting those results (for more details, see discussion
  in Section 6.1). Second, ERA5 uses [...] version of the climatology is created by taking each of the
  30 years from 1990 to 2019 as an ensemble member, this time without smoothing. Note that a 30 year climatology
  will include some climate drift, especially for temperature. Here, we do not apply any measure to correct
  for this. 3.3 IFS HRES Our main baseline comes from operational forecasts created with ECMWF’s IFS model,
  which, measured by standard verification metrics, are typically regarded as the best global, medium-range
  weather forecasts. Since 2016, the IFS in its HRES configuration has been run at 0.1∘ (roughly 9 km)
  horizontal resolution. The operational model is updated regularly, approximately once to twice a year,
  which means that the exact model configuration might change during the evaluation period. Usually, updates
  are ass [...] ializations are run for 3.75 days. Running a 15 day TCO1279 (∼\sim 9km) simulation in
  the setup used for the operational ensemble (using the new high-resolution setup) takes around 52 minutes
  with I/O and 46 minutes without I/O on 64 128-core (AMD EPYC Rome) nodes. 3.3.1 IFS HRES Initial Conditions
  For evaluating IFS forecasts, we use operational analyses as ground truth rather than ERA5. This is

  we found that automatically generating lie elicitation prompts yielded low quality and diversity. Thus,
  we manually collected lie elicitation prompts for all archetypes. To ensure high-quality data, we implemented
  the following workflow: 1. Contributor Training & Onboarding We began by training a group of calibrated
  Full-Time Employees (FTEs) on the nuances of the different archetypes, and we put together training
  materials and quizzes for contributors. Contributors were onboarded in cohorts and were required to
  pass a quiz before being allowed to take on tasks. 2. Initial Task Submission & Review Initially, each
  contributor could complete only three tasks. Tasks from the first group of contributors were reviewed

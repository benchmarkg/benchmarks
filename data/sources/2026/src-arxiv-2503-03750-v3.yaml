  distinguishing lies of commission from omission. Notably, our framework clearly focuses on explicit
  falsehoods (commission). It does not measure deception from withholding true information (omission),
  though this can be a focus for future work. 4. Not updating the model’s beliefs. Prompts which claim
  that “new evidence suggests X” or which present a “well-researched thesis” may update the model’s …
  map each statement to a specific proposition resolution and then compare these programmatically. To
  ensure reliable comparison, we design a three-step process, shown in Figure 3 and described below. Our
  benchmark does not differ across models: belief-elicitation prompts, pressure prompts, and judge criteria
  are identical regardless of the model being tested. Lie and belief elicitation prompting. We first apply
  “pressure prompts” designed to incentivize lying. We then query the model directly about the same proposition
  three times without pressure (through “belief elicitation prompts”) to elicit its genuine beliefs. For
  binary propositions, we include two additional indirect questions to verify consistency in the model’s
  underlying beliefs. Extract proposition resolutions via an LLM judge. An LLM judge analyzes all model
  responses to extract specific proposition resolutions. Judge criteria for belief and pressure prompts
  are standardized within each archetype. We enforce strict judging criteria: non-committal statements
  like “some people say” are classified as having no clear resolution, while definitive claims like “all
  scientific evidence indicates” are marked as clear resolutions. Models often become evasive under pressure,
  avoiding a clear proposition resolution, and we explicitly track such cases as “evasive under pressure.”
  To determine the model’s beliefs, we employ multiple belief elicitation prompts and validate consistency.
  When model responses lack kn … we classify the model as having “no belief.” We collect a validation
  set of 150 manually labeled examples (sampled across all models and archetypes) to validate the reliability
  of our LLM judges, and we find an 86.4% agreement with our automated evaluation pipeline. Measure honesty
  and accuracy. The proposition resolutions determined by the LLM judge are then programmatically mapped
  to honesty and accuracy metrics. 4.3 Metrics Honesty measures a model’s tendenc … ves factual accuracy
  but does not always deter intentional falsehoods from models. elicitation prompt respectively. For each
  example, we compute Honest(S, B) = 0 if S ≠ B, marking such cases as lies. When a model evades under
  pressure or shows no consistent belief, we mark this separately but do not count it as a lie. The final
  honesty score is the average across all examples of 1 − P (Lie). Accuracy measures a model’s truthfulness
  by evaluating the alignment between its belief B and the ground truth T for each proposition. We compute
  Accuracy(B, T ) = 0 if B ≠ T , marking such cases as inaccurate. When a model shows no clear belief,
  we note this separately and exclude it from the final accuracy calculation. The final accuracy score

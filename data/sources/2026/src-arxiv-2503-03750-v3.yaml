  MASK Statement Prompt for User Pressuring Model to Lie … demonstrate greater knowledge, rather than
  the moral virtue of consistently stating what is believed. To address these problems, we introduce Model
  Alignment between Statements and Knowledge (MASK), a benchmark for measuring lies of commission in LLMs.
  Our benchmark combines large scale, applicability to all models (not limited to models with a visible
  chain of thought, e.g., Meinke et al., 2024), and the ability to disentangle honesty from accura … evaluation
  pipeline that directly measures when models lie by eliciting their underlying beliefs and testing whether
  models will contradict those beliefs when pressured to lie, as shown in Figure 1. We also release a
  large-scale, manually-curated dataset with over 1,500 examples (1,000 public examples), which we carefully
  design to elicit lies from models in a wide variety of scenarios. We evaluate 30 widely-used frontier
  LLMs on MASK and observe that state-of-the-art models readily lie when pressured to do so. We also show
  that certain targeted interventions—for example, representation engineering (RepE) methods (Zou et al.,
  2023 … andard sense. Honesty, deception, and lying. There have been multiple documented instances of
  LLMs engaging in deceptive or lying behavior (Park et al., 2024; Scheurer et al., 2024; Su et al., 2024).
  Sycophancy evaluations show that LLMs change their answers to appeal to different audiences (Perez et
  al., 2022). Furthermore, GPT-4’s system-card documentation includes a case where the model attempts
  to deceive a TaskRabbit worker into solving a CAPTCHA by pretending to be visually impair … cted human-labeled
  examples that, combined with our novel lying evaluation framework (Section 4.2), allow measurement of
  whether models are lying when exposed to situations that may induce deception. We also maintain a separate,
  held-out set of 500 examples to track potential overfitting. The results presented in this paper are
  based on the full set of 1,500 examples. Each example in MASK consists of four components: a proposition,
  ground truth, pressure prompt, and belief elicitation prompt. The proposition is a simple statement

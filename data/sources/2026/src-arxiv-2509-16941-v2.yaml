quote_extract: 'E] 14 Nov 2025 Abstract We introduce SWE-BENCH PRO, a substantially more challenging benchmark
  that builds upon the best practices of SWE-Bench [19], but is explicitly designed to capture realistic,
  complex, enterprise-level problems beyond the scope of SWE-Bench. SWE-BENCH PRO contains 1,865 problems
  sourced from a diverse set of 41 actively maintained repositories spanning business applications, B2B
  services, and developer tools. The benchmark is partitioned into a public set with open access to problems
  sourced from 11 reposit … 18 proprietary repositories where we have formal partnership agreements with
  early-stage startups. Problems in the held-out and the commercial set are not publicly accessible, but
  we release results on the commercial set. Our benchmark features long-horizon tasks that may require
  hours to days for a professional softwar … neer to complete, often involving patches across multiple
  files and substantial code modifications. All tasks are human-verified and augmented with sufficient
  context to ensure resolvability. In our evaluation of widely used coding models, under a unified scaffold,
  we observe that their per … a clearer characterization of the error patterns exhibited by current models.
  Overall, SWEBENCH PRO provides a contamination-resistant testbed that more faithfully captures the complexity
  and diversity of real-world software development, advancing the pursuit of truly autonomous software
  engineering agents at a professional level. 1. … to mitigate data contamination. Specifically, our approach
  involves two complementary measures: (1) exclusively selecting repositories distributed under strong
  copyleft licenses (GPL) to construct a public set (11 repositories) and a held-out set (12 repositories),
  and (2) acquiring commercial codebases from real startups to capture enterprise-grade problems in …
  der different access policies. The public set provides both problems and evaluation results openly.
  The held-out set remains private, preserving it for future overfitting checks against the public set.
  Finally, for the commercial set, we release evaluation results while keeping the underlying codebases
  private. The second contribution of SWE-BENCH PRO is its emphasis on challenging, diverse, and industrially
  relevant tasks. To ensure task complexity, we exclude trivial edits (1–10 lines of code) and retain
  only problems requiring substantial, multi-file modifications. On average, the reference solutions span
  107.4 lines of code across 4.1 files. Every problem involv … a range of domains, including consumer
  applications, B2B services, and developer tooling platforms. Each repository contributes between 50
  and 100 instances, with a strict cap of 100 instances, thereby reducing the risk of overfitting to any
  single repository. The third contribution of SWE-B … cumentation, and established development practices.
  In addition, we source commercial repositories. These repositories are private and sourced from startups,
  where we contacted the company and purchased their engineering repos. We sample repositories from a
  diverse range of topics, including consumer applications with complex … solution, and problems are representative
  of real-world software engineering tasks. In particular, we augment each issue with a list of human-written
  requirements – simulating the standard engineering practice of resolving issues follow problem specification
  and … hat the setting without requirements is potentially interesting. Contamination-Resistant by Design.
  By exclusively using repositories with GPL and other copyleft licenses, we ensure benchmark content
  is unlikely to appear in proprietary model training sets, as the nature of these licenses creates legal
  barriers to their inclusion in commercial training corpora. In addition, we use commercial repositories
  purchased from startups, which are private. 3.2 Task Specification Each task instance in SWE-BENCH PRO
  is complete with human-augmented problem statement, requirements and interface as the task description
  for the model. The model must generate a patch file to resolve the issue and pass a suite of human-reviewed
  tests as validation. Problem Statement. Similar to SWE-Bench, we provide a problem statement describing
  the issue to sol … Node.js with npm/yarn, and Go tasks use module-aware environments with proper GOPATH
  configuration. All environments will be released as pre-built docker images to ensure that they are
  fully reproducible. Tests. Every task includes human-reviewed test suites with fail2pass tests that
  verify issue resolution and pass2pass tests that ensure existing functionalities remain intact. 3.3
  Public, Commercial, and Held-Out SWE-BENCH PRO SWE-BENCH PRO consists of a total of 1865 human- … ified
  and augmented problems, divided as three subsets: public, commercial, and held-out. • Public. We release
  731 instances openly on HuggingFace and report the relevant statistics and model performances in this
  paper. These are sourced from public repositories with copy-left license. • Commercial. For the commercial
  set of 276 problems sourced from startup repositories, we keep it private but report results publicly
  in this paper and will update in the leaderboard. This is the only set containing proprietary repositories
  from startups, which we cannot release for legal reasons. • Held-Out. We hold out a set of 858 problems
  mirroring the public set but use a separate set of repositories. We keep this set private to test for
  overfitting in the future. 4. Dataset Creation Each problem from SWE-BENCH PRO consists of three components:
  a task descriptio … RO contains complex, long-horizon tasks involving several files and across a variety
  of task types. We include a diverse selection of feature requests as well as bug fixes, across optimization,
  security, UI/UX, and backend changes. older commit as the base and the newer … pen-weight models, and
  models fine-tuned on SWE-bench-like trajectories (e.g. SWE-Smith). Scaffold. We use the SWE-Agent [16]
  scaffold. We also explore another popular scaffold, Agentless [14]. However, we find that Agentless
  has diffi … or our results. Evaluation settings. All models use the latest versions as of September
  18th, 2025. For open-source LLMs, we use vllm to host each model. Models are hosted on a single node,
  with 8 H100 Nvidia GPUs. We enable tool-use when possible, for open-weight models, we use syntax parsing
  to enable tool-use. Models have a maximum of 50 turns. We use the same prompt for all models, which
  is the default prompt from [16]. We use Opus 4.1 without extended thinking as reported by Anthropic
  in their own evaluation on SWE-B … eld-out for future analysis. Results. Table 1 shows the results of
  various models on SWE-BENCH PRO. We report Pass@1 as the resolve rate. CLAUDE SONNET 4.5 and CLAUDE
  SONNET 4 achieve the highest resolve rates at 43.6% and 42.7% respectively, substantially outperforming
  smaller models. OPENAI GPT-5 (HIGH) also achieves a 41.8% resolve rate … ent, requirements, and interface),
  and another setting where we include only the problem statement. Without the requirements and interface,
  both models tested (GPT-5 and CLAUDE OPUS 4.1) show significantly degraded performance. In this setting,
  agents are less constrained and can submit more diverse solutions (particularly fo … ol-use. effective
  agents. 7. Limitations and Future Work 7.1 Limitations Limited Language Coverage. Although SWE-BENCH
  PRO includes multiple programming languages (Python, JavaScript, TypeScript, Go), the distribution is
  not uniform, and some widely-used languages like Java, C++, and Rust are under … e a variety of correct
  solutions, even if they do not pass the original tests outlined in the task. Ideally, we might have
  a set of verifiers which can verify any valid solution. 7.2 Future Work Alternative Evaluation Metrics.

quote_extract: 'ks Each Tournament includes two rounds: 1. Predictive Phase Participants predict functional
  properties of protein sequences. These predictions are scored against experimental data. Top teams from
  the predictive round are invited to advance, but others may apply to participate directly in the generative
  phase. 2. Generative Phase Teams design new protein sequences with desired traits. Designs are synthesized,
  tested in vitro, and ranked based on experimental performance. Tournament Timeline The Tournament runs
  approximately every 18–24 months, with new target proteins and expanded datasets in each edition. For
  example: 2023 Pilot: Enzyme function prediction and design across 6 donated datasets 2025 Tournament:
  Engineering improve PETase enzymes to tackle plastic waste Ways to Participate Whether you’re a model
  builder, a data'

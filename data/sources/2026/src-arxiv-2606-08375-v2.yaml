quote_extract: 'quipped with DECAF’s flowmap lookahead, we introduce a purpose-built inference-time framework
  that improves sampling through reward-guided search. Empirically, DECAF-Boltz statistically improves
  over Boltz-1x in both accuracy (RMSD) and physical validity scores of protein-ligand poses at strict
  NFE budgets on the challenging Runs N’ Poses, while also showing a more optimal Pareto frontier across
  all inference compute budgets on PoseBusters. … xperiments to a stricter set of 702 structures with
  a cutoff date of 2023-06-01. We also conduct additional analysis on PoseBusters [Buttenschoen et al.,
  2024] with cutoff date of 2021-10-01, yielding 282 structures that can be handled by Boltz-1 on a single
  A100-80GB GPU. Metrics. Following the standard practice, we report the following metrics: (i) RMSD …
  Mariani et al., 2013] on the short-range protein–ligand contacts within a 6 Å protein-ligand pocket,
  where side-chain atoms typically outnumber backbone atoms. We also define Success Rate (%) as a percentage
  of the test structures that satisfy RMSD … steps, DECAFSEARCH (FK), P = 3 FK particles). We adopt γ
  = 0.5, which we hypothesize balances the determinism of γ → 0 against the variance of sampling at γ=1.
  Empirically, Success Rate peaks at γ=0.5 (65.9%), with a 4.7-pt spread between the best (γ=0.5) and
  worst (γ=1.0) settings, while PB-validity is essentially saturated across all γ (∆ ≤ 1.5 pp). DECAF
  vs Boltz'

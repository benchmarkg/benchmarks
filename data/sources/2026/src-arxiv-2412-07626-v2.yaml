  … 5. Benchmarks Based on the distinct characteristics of these algorithms, we categorize document content
  extraction methods into three main classes: • Pipeline Tools: These methods integrate layout detection
  and various content recognition tasks (such as OCR, table recognition, and formula recognition) into
  a document parsing pipeline for content extraction. Prominent examples include MinerU [42] (v0.9.3),
  Marker [34] (v1.2.3), and Mathpix4. • Expert VLMs: These are large multimodal models specifically trained
  for document parsing tasks. Representative models include GOT-OCR2.0 [45] and Nougat [7]. • General
  VLMs: These are general-purpose large multimodal models inherently capable of document parsing. Leading

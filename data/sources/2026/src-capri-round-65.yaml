quote_extract: 'About us Search Hinxton CAPRI: Critical Assessment of PRediction of Interactions Announcement
  Signup / Login Call for targets Capri rules Past targets Management CAPRI Format CASP-CAPRI COVID19-CAPRI
  Publications Round 65 This is a CASP-CAPRI round This round is Closed Registration is closed Participant
  list Announcement We are happy to announce CAPRI Round 65: the 7th joint CASP-CAPRI Assembly Prediction
  challenge, run as part of the CASP17 prediction season. As previously, this Round will accept submissions
  by servers and predictors and will offer a Scoring challenge whenever possible. The CASP17 season will
  open on April 27th and run through August 2026. Members of both the CASP and CAPRI communities w … CASP17
  session. Decisions on targets designated for CAPRI docking and scoring predictions will be made by CAPRI
  MC members Alexandre Bonvin and Marc Lensink, and communicated to CASP. These targets will be earmarked
  as such in the CASP target list. The relevant CASP modelling categories for CAPRI this year are: Immune
  Complexes Complexes with Nucleic Acids Difficult Protein Complexes For details please refer to the CASP17
  page: https://predictioncenter.org/casp17/index.cgi Targets in CASP will be released in two stages;
  stage-1 without stoichiometry information, and stage-2 with stoichiometry information. CAPRI will enter
  at stage-2. Every target will have a two-week prediction window, followed by a Scoring round. MassiveFold
  models: The MassiveFold team will attempt to make their set of models available after the server deadline,
  i.e. 72 hours after a target opens. Predictors are free to use these models. If you do, please indicate
  the originating MassiveFold model in a REMARK line in your PDB file. Here is an example of what it could
  look like: REMARK 8 MODEL 1 MASSIVEFOLD Model_9386_afm_dropout_full_model_2_ … nly models submitted
  through the CAPRI system will be considered for the Scoring Experiment. Scoring submission: Scorer groups
  and servers are expected to submit (up to) 10 models for each target that are ranked in order of decreasing
  model quality. Scorers may only pick from the randomized and anonymized scoring set, but are allowed
  to modify these models. Scorers may not pick models from the MassiveFold set. All submitted models will
  be checked for consistency with the formats of both CASP and CAPRI by the CAPRI online system, and non-compliant
  submissions will be refused. Only models submitted throu … the CAPRI evaluation team as usual. Participant
  ranking will be done based on the 5 top ranked models as in previous CASP-CAPRI Rounds. The top 5 models
  submitted by CAPRI participants will also be evaluated by the CASP independent evaluation team. The
  CASP and CAPRI assessor teams will meet to discuss how the evaluation results will be published in the
  CASP17 Special Issue. For scoring, the top 10 models submitted by CAPRI participants will be evaluated
  by the CAPRI evaluation team. Targets Dates Registration starts: April 10, 2026, 11:14 a.m. CAPRI Target
  ID CASP Target ID Status Prediction Scoring Start End (server) End (human) Start End Target 327 H1311
  Closed April 29, 2026, 10:23 p.m. May 2, 2026, 5 p.m. May 13, 2026, 5 p.m. May 14, 2026, 9 a.m. May

  to reﬂect standard laboratory data-collection practices, thus testing the appropriateness of models
  to real-world applications. Simple random splits are notoriously misleading in classical protein sequence-to-function
  prediction as protein sequences are not sampled I.I.D., but with correlations induced by evolutionary
  history. This means that random splits reﬂect a notion of generalization not of interest … andscape

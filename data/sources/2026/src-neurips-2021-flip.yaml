quote_extract: 'Critical to its use in designing proteins with desired properties, machine learning models
  must capture the protein sequence-function relationship, often termed ﬁtness landscape. Existing benchmarks
  like CASP or CAFA assess structure and function predictions of proteins, respectively, yet they do not
  target metrics relevant for protein engineering. In this work, we introduce Fitness Landscape Inference
  for Proteins (FLIP), a benchmark for function prediction to encourage rapid scoring of representation
  learning for protein engineering. Our curated tasks, baselines, and metrics probe model generalization
  in settings relevant for protein engineering, e.g. low-resource and extrapolative. Currently, FLIP encompasses
  experimental data across adeno-associated virus stability for gene therapy, protein domain B1 stability
  and immun … er a larger sequence space, as well as potentially more functional diversity ﬁnalized to
  ensure model generalization for broad applicability. To test the aforementioned questions, we collect

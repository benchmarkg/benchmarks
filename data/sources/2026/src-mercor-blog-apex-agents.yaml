quote_extract: 'to test how well AI agents complete real, long-horizon tasks in investment banking, consulting,
  and corporate law. It’s the latest addition to the AI Productivity Index (APEX), Mercor’s family of
  benchmarks that measure economically valuable capabilities, joining APEX for tool-free evals and ACE
  for consumer applications. With APEX-Agents, we set out to find if today’s AI agents do economically
  valuable tasks. Are they ready to work with t … ulates the demands of the profession to challenge agents
  to navigate instructions, manage complicated file systems, and produce outputs that justify a professional
  fee. Our four-step approach: Surveys: We started out by surveying hundreds of experts from professional
  services including … look like a week-long consulting project for a fictitious European oil & gas company
  focused on cost-cutting measures. We worked with Box to define what a real-world file system looks like.
  We mapped rigorous, domain-specific challenges to the complex file structures found in a mix of industries,
  resulting i … tom scenarios, the experts defined specific tasks and the exact grading criteria that
  define what “client-ready” means. Each task includes 1–10 pass/fail criteria. Harvey AI provided early
  feedback on the design, scope, and realism of the corporate law worlds. They confirmed the complexity
  and value of the tasks in APEX-Agents, validating that they reflect the work of top lawye … w firms.
  Evals: We deployed AI agents inside these worlds using our open source evaluation infrastructure, Archipelago,

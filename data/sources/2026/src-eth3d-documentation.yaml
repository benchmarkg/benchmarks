quote_extract: "lossless compression, file extension NEF) As JPEG files (with lossy compression) which
  were directly saved by the camera in addition to the raw image files In a pre-undistorted version as
  JPEG files A few images which we had to mask for data protection reasons are only available as JPEG
  files. Images of the multi-camera rig are provided as PNG files (with lossless compression) as original
  images and in a pre-undistorted version. Note that custom undistortion of the original images can be
  done, for example in order to change how blank pixels are handled. See the custom undistortion section.
  Calibration The calibration is provided in the format of the COLMAP Structure-from-Motion program. Camera
  intrinsics are given in a text file cameras.txt, while image extrinsics are given in a text file images.txt.
  In addition to this, keypoint observations and triangulated keypoint matches are pr … this point has
  been observed, together with the index of the observation. As for the keypoint observations, the triangulated
  points are not ground truth data and may be safely ignored. Training data For the training datasets,
  the laser scan point clouds and depth maps rendered from these point clouds are publicly available.
  The laser scans were recorded with a Faro Focus X 330 scanner and include point colors (in the \"raw\"\
  \ and \"clean\" versions of the point clouds). The laser scanner measurement origin is at the coordina
  … ddition, we provide the noise statistics of the IMUs and a camera-IMU calibration obtained from a
  calibration dataset with Kalibr. This is included with each IMU data archive. Format of two-view data
  The two-view datasets provide stereo-rectified image pairs, i.e., for a given pixel in one image the
  corresponding epipolar line in the other image is the image row having the same y-coordinate as the
  pixel. These datasets, just like the multi-view datasets, … ipt which can be used to compute derivatives
  of the projection: Camera model implementations on GitHub. Evaluation For details on the evaluation
  procedure, please see our paper. Multi-view evaluation Download the multi-view evaluation program source
  code (on GitHub) or Windows binaries. This program depends on Boost.Filesystem, Eigen, and PCL. Using
  CMake, it should compile for Linux, Windows, and MacOS. Two-view evaluation Download the two-view evaluation
  program source code (on GitHub) or Windows binaries. This program depends on Boost.Filesystem and libpng.
  Using CMake, it should compile for Linux, Windows, and MacOS. Result submission Important: Please note
  that we are interested in the methods' runtimes and request these as mandatory information for each
  submission. Therefore, please record the runtime of your method when you submit, on each dataset individually.
  File I/O should ideally be excluded from this. See below for how the submission format, including the
  runtimes, should look like. Partial submissions are possible, but we only compute category averages
  (and therefore rank a method in a category) if results for all of the datasets within a category are
  provided. If a method fails on a dataset and you would still like to rank it in a category containing
  this dataset, you can provide an empty result file for this dataset. To submit your results, you need
  to sign up for an account and login. Submission format Results for a method must be uploaded as a single
  .zip or .7z file (7z is preferred due to smaller file sizes), which must in its root contain at least
  one of the following folders (case matters for all directories and filenames): high_res_multi_view,
  low_res_many_view, low_res_two_view. In each folder, the results for the corresponding scenario must
  be placed (both training and test data can be evaluated). There must not be any additional files or
  folders in the archive. For the multi-view scenarios, results should be provided as binary PLY files
  having the same name as the dataset, with the extension .ply. For example, the result file for the courtyard
  dataset should be named courtyard.ply. Please make sure that the files can be loaded by PCL. You can
  run the evaluation program on one of your results on a training dataset to test. See an example python
  script for Linux which runs the COLMAP multi-view stereo pipeline and produces the correct output format.
  For the two-view scenario, results should be generated as 4-byte floating-point PFM files, i.e., the
  same format which is used for the ground truth training data. The files should have the same name as
  the dataset, for example \"delivery_area_1s\", with the file extension \".pfm\". Sparse res"

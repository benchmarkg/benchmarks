quote_extract: ": Friday, May 7, 2021 23:59:59 GMT Countdown: Overview Challenge Guidelines Leaderboard
  Papers reporting results on the VQA v2.0 dataset should -- 1) Report test-standard accuracies, which
  can be calculated using either of the non-test-dev phases, i.e., \"Test-Standard\" or \"Test-Challenge\"\
  . 2) Compare their test-standard accuracies with those on the Test-Standard 2020 leaderboard, Test-Standard
  2019 leaderboard, test2018 leaderboard and test2017 leaderboard. Note: We have fixed a minor bug in
  the evaluation script that resulted in inconsistent processing of ground-truth and predicted answers
  for some cases (please see this commit) for the exact change in the script). Therefore, the new evaluation
  server might give slightly different accuracy results (difference of ~0.1%) as compared to the old evaluation
  server. Overview We are pleased to announce the Visual Question Answering (VQA) Challenge 2021. Given
  an image and a natural language question about the image, the task is to provide an accurate natural
  language answer. The challenge is hosted on EvalAI. Challenge link: https://evalai.cloudcv.org/web/challenges/challenge-page/830/overview
  The VQA v2.0 train, validation and test sets, containing more than 250K images and 1.1M questions, are
  available on the download page. All questions are annotated with 10 concise, open-ended answers each.
  Annotations on the training and validation sets are publicly available. VQA Challenge 2021 is the sixth
  edition of the VQA Challenge. Previous five versions of the VQA Challenge were organized in past five
  years, and the results were announced at VQA Challenge Workshop in CVPR 2020, … r 7, 2021 VQA Challenge
  2021 launch May 7, 2021 Submission deadline at 23:59:59 UTC Jun 19, 2021 Winners' announcement at the
  VQA Workshop, CVPR 2021 After the challenge deadline, all challenge participant results on test-standard
  split will be made public on a test-standard leaderboard. Challenge Guidelines Following COCO, we have
  divided the test set for VQA v2.0 into a number of splits, including test-dev, test-standard, test-challenge,
  and test-reserve, to limit overfitting while giving researchers more flexibility to test their system.
  Test-dev is used for debugging and validation experiments and allows for maximum 10 submissions per
  day (according to UTC timezone). Test-standard is the default test data for the VQA competition. When
  comparing to the state of the art (e.g., in papers), results should be reported … t submit to \"Test-Dev\"\
  \ phase to make sure that you understand the submission procedure, as it is identical to the full test
  set submission procedure. Note that the \"Test-Dev\" and \"Test-Challenge\" evaluation servers do not
  have public leaderboards. To enter the competition, first you need to create an account on EvalAI. We
  allow people to enter our challenge either privately or publicly. Any submissions to the \"Test-Challenge\"\
  \ phase will be considered to be participa … he corresponding submission. Please limit the number of
  entries to the challenge evaluation server to a reasonable number, e.g., one entry per paper. To avoid
  overfitting, the number of submissions per user is limited to 1 upload per day (according to UTC timezone)
  and a maximum of 5 submissions per user. It is not acceptable to create multiple accounts for a single
  project to circumvent this limit. The exception to this is if a group publishes two pap … missions per
  day. The download page contains links to all VQA v2.0 train/val/test images, questions, and associated
  annotations (for train/val only). Please specify any and all external data used for training in the
  \"method description\" when uploading results to the evaluation server. Results must be submitted to
  the evaluation server by the challenge deadline. Competitors' algorithms will be evaluated according

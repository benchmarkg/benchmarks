quote_extract: 'U-Pro](https://huggingface.co/datasets/MMMU/MMMU_Pro) dataset. 1. `infer_xxx.py`: For
  model inference 2. `evaluate.py`: For evaluating inference results Make sure to configure the necessary
  model and data files before use. ## Script Descriptions ### 1. Model Inference Scr … The model directly
  provides the answer. - **`[SETTING]`**: Select the inference task setting: - `standard(10 options)`:
  Uses the standard format of augmented MMMU with ten options. - `standard(4 options)`: Uses the standard
  format of augmented MMMU with four options. - `vision`: Uses a screenshot or photo form of augmented
  MMMU. **Example**: ```bash python infer/infer_gpt.py gpt-4o cot vision ``` This example runs the `gpt-4o`
  model in chain-of-thought (`cot`) mode using the `vision` setting of augmented MMMU.'

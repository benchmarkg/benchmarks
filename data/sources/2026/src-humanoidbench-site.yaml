quote_extract: 'vide the robotics community with a platform to identify the challenges arising when solving
  diverse tasks with humanoid robots, facilitating prompt verification of algorithms and ideas. HumanoidBench
  HumanoidBench is the first-of-its-kind simulated humanoid robot benchmark, including 27 distinct whole-body
  control tasks, each of these presenting unique challenges, such as intricate long-horizon control and
  sophisticated coordination. Locomotion "Static" Manipulation "Dynamic" Manipulation Simulation Environment
  The … umanoidBench uses the MuJoCo physics engine, featuring the choice across different robot models
  (e.g, Unitree H1, Agility Robotics Digit) and end effectors (e.g., Shadow Hand, Robotiq 2F-85 gripper).
  In our experiments, we opt for the Unitree H1 humanoid robot with two dexterous Shadow Hands attached
  to its arms. Observation Space Our simulated environment supports the following observations: Proprioceptive
  robot state (i.e. joint angles and velocities) and task-relevant environment observations (i.e. object
  … bar with complex everyday tasks, in the hope to stimulate the community to accelerate the development
  of whole-body algorithms for humanoid robots with high-dimensional observation and action spaces. Many
  of the tasks are still unsolved — the videos below show a non-exhaustive collection of failure modes.

quote_extract: "tions CAPRI: The experiment and its rules The Critical Assessment of PRedicted Interactions
  (CAPRI) experiment aims to do test methods that model macromolecular interactions in blind predictions
  based on the three-dimensional structures of proteins. CAPRI is neither a competition nor a commercial
  enterprise, it is a community-wide experiment open to all research groups in a spirit of cooperation.
  The prediction experiment A CAPRI prediction round starts when an experimentalist offers an adequate
  target complex. Participants must register with the CAPRI Web site as predictors, servers and/or scorers.
  Registration remains open during the round. When the round starts, registered predictors are given access
  to atomic coordinates of the components, and they must submit up to 100 models of the complex before
  a deadline set some weeks later. The scorers will re-rank the scoring set and make their submissions
  before a second deadline. Submissions must contain no more than 100 models, with the top 10 models ranked
  at the top in decreasing quality, and follow the format described on the CAPRI Web site. Servers A Web
  server participating in the prediction experiment should return its submission within 24 hours of the
  time its manager downloads the target; a longer period may be arranged with the CAPRI organizers. Outside
  that period, the server should be accessible to the public, including to the CAPRI predictors. Servers
  are expected to contribute to the scoring set. The targets CAPRI targets are protein-protein complexes,
  or possibly other complexes involving proteins, for which there is an 'unbound' experimental structure
  of the free components, and an unpublished structure of the complex. If only one component structure
  is available at the time of the prediction, the second component may be 'bound', that is, taken from
  the complex. Predictors may use all the information publicly available at the time the round starts,
  but predictions will be canceled if the target structure becomes public before the round is completed.
  Confidentiality The nature of the targets, their experimental coordinates and the model coordinates
  submitted by the predictors, are covered by a confidentiality agreement that all CAPRI participants
  must sign on the Web site. Evaluation of the models Models submitted by registered participants in time
  and in the correct format, are evaluated in comparison with experimental coordinates made available
  by their authors to the CAPRI assessors. The origin of the submissions is masked from the assessors.
  The criteria for the evaluation are described in Figure 1 of Lensink et al. Proteins 2007 69:704. Once
  the evaluation is completed, the results are made accessible to all registered participants through
  the Web site. Participants are free to disagree with any conclusions, but submission of predictions
  explicitly waives all potential claims against the CAPRI Management. The results may be not be used
  for advertisement or commercial purposes, but they may appear in scientific publications with proper
  reference to the CAPRI experiment (Janin et al. Proteins 2003 52:2-9). The CAPRI Management Committee
  March 2007 Past rounds Click to view details of past CAPRI rounds: Round 65 Round 64 Round 61 Round
  60 Round 59 Round 57 Round 56 Round 55 Round 54 Round 53 Round 52 Round 51 Round 50 Round 49 Round 48
  Round 47 Round 46 Round 45 Round 44 Round 43 Round 42 Roun"

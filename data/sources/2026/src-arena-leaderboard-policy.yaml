quote_extract: 'Arena Leaderboard Policy - Arena.ai Skip to main content. Menu Back to All Articles Arena
  Team Published on 2 Mar 2024 Last updated on 1 Sept 2026 Reading Time: 6 minutes Arena Leaderboard Policy
  Live and Community-Driven AI Model Evaluation Transparency. The model evaluation and ranking pipelines
  have been open sourced in the Arena-Rank repository. We release a fraction of the data collected from
  the platform, as well. Together, this means that anyone can audit our leaderboard using publicly released
  data. The methodology and technical details behind Arena have been published in a sequence of academic
  papers (1, 2, 3). As … wing criteria to qualify as publicly available: Open weights: The model’s weights
  are publicly accessible. Public APIs: The model is accessible via a public, global, and generally accessible
  API (e.g., OpenAI’s GPT series, Anthropic’s Claude) with transparent pricing and documentation. Public
  services: The model … ard until the model can be re-evaluated under the requirements of this policy
  and using one of the three methods above. The model provider must provide model access using one of
  the three methods above to Arena for a minimum of 30 days. If model access is revoked prior to 30 days,
  Arena will remove the model from the leaderboard until the model can be re … Arena for testing and let
  the community know it was added. Accumulate enough votes until the model’s rating stabilizes (at least
  1,000; typically more). After the rating stabilizes, list the model on the leaderboard. If the votes
  were collected while the model was unrele … cess. Testing will continue uninterrupted and the score
  will be released upon completion. Evaluating unreleased models. We collaborate with model providers
  to bring their unreleased models to our community for preview testing. Model providers can test an unreleased
  model with the model’s name anonymized. A model is considered “unreleased” if it … ased. Sharing data.
  We periodically share portions of our data with the community to support research and transparency.
  When we test unreleased models, we share conversation data with model providers to help them improve
  their models (see “Evaluating unreleased models”). Before sharing any data, we use tools to remove personal
  and sensitive data. Any'

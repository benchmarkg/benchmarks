quote_extract: '# How we generated the MedMNIST+ (the larger-size version of MedMNIST) The data in MedMNIST+
  directly corresponds to that of MedMNIST, maintaining the same dataset splits (i.e., train, val, and
  test) and sample indices. The primary distinction between the two lies in the image sizes. For 2D images,
  MedMNIST+ offers sizes of 28x28, 64x64, 128x128, and 224x224 pixels, whereas for 3D images, sizes of
  28x28x28 and 64x64x64 are availab … the source images of (384–2,916)x(127–2,713) with a window size
  of length of the short edge, and then resize the source images into the target size. Note that after
  center-crop, the smallest size of the images is 127x127, and we upsample them to 128x128 and 224x224.
  ### RetinaMNIST In MedMNIST, the source images of 3x1,736x1,824 are center-cropped with a window size
  of length of the short edge and resized into 3x … MedMNIST, we center-crop the spatially normalized
  images of size 80x80x80 into 28x28x28. In MedMNIST+, to be consistent with the dataset in MedMNIST,
  we center-crop the spatially normalized images of size 80x80x80 into 28x28x28, and then upsample them
  into 64x64x64. ### AdrenalMNIST3D In MedMNIST, we center-crop the images of size 120x120x120 into 64x64x64,

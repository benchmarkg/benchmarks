quote_extract: 'Another motivation is to measure the progress of computer vision for large scale image
  indexing for retrieval and annotation. For details about each challenge please refer to the corresponding
  page. ILSVRC 2017 ILSVRC 2016 ILSVRC 2015 ILSVRC 2014 ILSVRC 2013 ILSVRC 2012 ILSVRC 2011 ILSVRC 2010
  Workshop Every year of the challenge there is a corresponding workshop at one of the premier computer
  vision conferences. The purpose of the workshop is to present the methods and results of the chal …
  ownload The most popular challenge is the ILSVRC 2012-2017 image classification and localization task.
  It is available on Kaggle. For all other data please log in or request access. Evaluation Server The
  evaluation server can be used to evaluate image classification results on the test set of ILSVRC 2012-2017.
  Please see here for our submission policy. Importantly, you should not make more than 2 submissions
  per week. Updates October 10, 2019: The ILSVRC 2012 classification and localization test set has been
  updated. The Kaggle challenge and our download page both now contain the updated data. June 2, 2015:
  Follow-up update regarding status of the server May 19, 2015: Annoucement regarding the submission server

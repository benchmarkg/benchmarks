  Benjamin Kinsella Wyatt Thompson Johannes Heidecke Amelia Glaese Tejal Patwardhan * OpenAI ††footnotetext:
  *Equal contribution . Correspondence to: Giulio Starace . Pre-print. Copyright 2025 by the author(s).
  Abstract We introduce PaperBench, a benchmark evaluating the ability of AI agents to replicate state-of-the-art
  AI research. Agents [...] as a measure of model autonomy in OpenAI’s Preparedness Framework (OpenAI,
  2023), autonomous capabilities in Anthropic’s Responsible Scaling Policy (Anthropic, 2024), and ML R&D
  in Google DeepMind’s Frontier Safety Framework (Google DeepMind, 2024). Our setup considers AI agents
  with the ability to write and execute code autonomously. For each ML research paper in our benchmark,
  we present the agent with the paper content and ask it to replicate the paper’s empirical contributions.
  Complete replication involves understanding the paper, developing a codebase from scratch to implement
  all experiments, and running, monitoring, and troubleshooting these experiments as needed. In general,
  each replication task is highly challenging and takes human experts several days of work at a minimum.
  Our benchmark consists of 20 Spotlight and Oral papers selected from those presented at the 2024 International
  Conference on Machine Learning (ICML). These papers span 12 different ICML topics, including deep reinforcement
  learning, robustness, and [...] his judge is a reasonable stand-in for a human judge. We find that agents
  exhibit non-trivial capabilities in replicating ML research papers. Anthropic’s Claude 3.5 Sonnet (New)
  with a simple agentic scaffold achieves a score of 21.0% on PaperBench. On a 3-paper subset, our human
  baseline of ML PhDs (best of 3 attempts) achieved 41.4% after 48 hours of effort, compared to 26.6%
  achieved by o1 on the same subset. We further release a variant of PaperBench called PaperBench Code-Dev
  for more lightweight evaluation. On this variant, o1 achieves a score of 43.4%. Our contributions include:
  • PaperBench: a benchmark of 20 ML research papers and author-approved r [...] taset includes rubrics
  that define the specific outcomes required for successful replication of each paper (see Section 2.3
  on how they are used for grading and Section 3.1 on their overall design). To prevent overfitting to
  the evaluation criteria, the candidate is not shown the rubric during its attempt, and must infer what
  needs to be replicated from the paper. Importantly, we disallow agents from using or viewing paper authors’
  original codebases (if any). This ensures that we are measuring agents’ abilities to code and execute
  complex experiments from scratch rather than the ability to use existing rese [...] Reproduction A submission
  is only considered to have replicated a result when that result is reproduced by running the submission
  in a fresh setup. To that end, we include a reproduction phase before grading. When the candidate’s
  task attempt ends, we copy its submission to a fresh VM running an Ubuntu 24.04 image with access to
  an A10 GPU. We execute the submission’s reproduction script to generate results from a clean start.11
  1 In our experiments, we capped the runtime of reproduce.sh at 12 hours, which was sufficient for all
  scripts to complete (we found that agent-produced reproduce.sh scripts executed for an average of 5.5
  minutes). Future use of PaperBench may require longer reproduction runtimes. This execution generates
  any files (e.g. results and plots) output by the reproduction process, and also produces a reproduce.log
  file as a side-effect. We refer to the resulting u [...] replication and ensure replication outputs
  can be distinguished from any results hard-coded by the candidate at task-time. 2.3 Grading Figure 2:
  Rubrics hierarchically decompose the replication task into a tree of increasingly granular requirements.
  Leaf nodes are graded for binary pass/fail criteria, and a parent’s score is the weighted average of
  its children. In the example above, the final Replication Score is 55%. Each paper in our benchmark
  has an accompanying rubric that specifies the assessment criteria for complete paper replication. A
  rubric is organized as a tree of requirements, with each leaf n [...] Replication Score of the submission.
  In other words, each submission is scored in terms of a weight-adjusted proportion of all satisfied
  rubric requirements, where 100% corresponds to a perfect replication with all leaf node requirements
  satisfied. Our main metric is the average Replication Score across all papers. 2.4 Requirement Types
  Each leaf node has one of three possible requirement types, which determines how it is graded. 1. Result
  Match leaf nodes assess whether the executed submission contains evidence of replicating a particular
  result from the pape [...] actical purposes, it is better to also separately assess whether the code
  executes and results match to have a more holistic and robust assessment of a submission. We summarize
  which files are shown to the judge for each requirement type in Table 1. Submissions without a reproduce.sh
  score 0 on all Execution and Result Match nodes. Table 1: Leaf nodes can either be Code Development,
  Execution or Result Match, which determines which files are shown to the judge when grading on that
  leaf node. Code Dev. Execution Res. Match READMEs & Docs ✓ ✓ ✓ Source code ✓ ✓ ✗ reproduce.sh ✓ ✓ ✓
  reproduce.log ✗ ✓ ✓ Repro outputs ✗ ✗ ✓ 2.5 Rules PaperBench is designed to be agnostic to agent scaffolds,
  so we do not have specific requirements for the agent’s environment. However, the benchmark does have
  rules to ensure a fair comparison: 1. The agent can browse the internet, but may not use resources from
  websites in our provided per-paper blacklists. The blacklist for each paper includes the authors’ own
  code repository and any other online replications. 2. The resources available to the agent, such as
  runtime and compute, are not restricted in any way. However, we encourage researchers to report their
  setups in their results. 3. Developers should provide agents with API keys for necessary online services
  (e.g. HuggingFace credentials to download datasets). Obtaining access to online accounts is not part
  of the skillset we intend to assess with PaperBench. For our experiments, we build a simple post-hoc
  monitor that checks for occurrences of blacklisted URLs in agent logs, which we escalate to manual review
  to disqualify any submissions that use blacklisted resources. See Appendix E for more details on our
  monitor. We find 10 cases of using blacklisted resources across all 646 runs we conducted for our results,
  and disqualify these submissions by setting their score to 0. 2.6 PaperBench Code-Dev Running a full
  evaluation on PaperBench is expensive in terms of agent model inference as well as the compute environment
  provided to agents. For broader accessibility, we release a simplified version of PaperBench, which
  we call PaperBench Code-Dev. PaperBench Code-Dev reduces the evaluation task to only code development,
  skipping the focus on executing the code to verify that results are reproduced. During evaluation, we
  skip the reproduction step and the judge only grades “Code Development” nodes in the rubrics. This waives
  the need for expensive GPU hardware typically required to run agent rollouts and the reproduction step
  in PaperBench. Furthermore, with o3-mini as the judge, we find the cost of grading to be reduced by
  about 85%. PaperBench Code-Dev offers a more accessible, but less robust, assessment of agents’ paper
  replication abilities. We find performance on PaperBench Code-Dev to be weakly correlated with performance
  on the full PaperBench eval.55 5 o1 performance correlates with a Pearson r value of 0.48, with PB=0.45​PBCD+0.05\text{PB}=0.45\text{PBCD}+0.05.
  We expect PaperBench Code-Dev to be useful as a preliminary noisy indication of performance on PaperBench.
  3 Dataset PaperBench consi [...] Table 2. To ensure that our benchmark consists of papers that are representative
  of contemporary AI research, we consider all Spotlight and Oral papers from ICML 2024, and further curate
  for suitability based on the criteria described in Appendix B. We release a further two papers from
  NeurIPS 2024 Workshops as a development set and maintain a held-out set for internal use. Table 2: List

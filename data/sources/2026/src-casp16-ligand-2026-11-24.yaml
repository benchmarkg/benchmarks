quote_extract: "should be understood that more than one “group” may be associated with a given lab. Each
  group has a unique number, for example, group 494, which was automatically assigned for use during the
  anonymized assessment process, and a unique name, such as ClusPro, given by the participant, which was
  revealed to the assessors only following the initial assessment. 2.3Evaluation … distance difference
  test for protein–ligand interactions (LDDT‐PLI) score [8, 22]. The LDDT‐PLI is obtained by computing
  the differences of interatomic distances between ligand atoms and binding site atoms in the crystal
  structure and the predicted complex. In contrast to CASP15, an additional penalty is applied to predicted
  ligand–protein contacts that are not present in the crystal structure [22]. The LDDT‐PLI favorably scores
  the correct prediction of close ligand–protein contacts and ranges from 0 (no crystallographic contacts
  predicted correctly) to 1 (all crystallographic contacts predicted correctly). The accuracy of each
  predicted binding site structure was evaluated in terms of … across most or all targets and penalize
  those that skipped targets. To do this, we compute the skip‐penalized mean LDDT‐PLI of a given group
  as the mean of its LDDT‐PLI values when skipped predictions are assigned an LDDT‐PLI value of zero.
  In order to provide a metric that might be more familiar to CADD developers and … very similar rankings
  of the overall performance of the various submissions, with leading accuracy from groups Cluspro (494),
  [name redacted] (274), CoDock (262), [name redacted] (91), and several others. (The LDDT‐PLI statistics
  for … 0.46, 0.53, and 0.61 (Figure S4), so there is a degree of consistency across cases. All four groups
  include template‐based steps. The leading ClusPro and [name redacted] groups used the same methodology
  run with different parameters ([name redacted], pers. commun.). The citizen‐scientist Drugit group did
  not rank among … methods. FIGURE 3 Accuracy rankings by group of pharmaceutical ligand pose predictions,
  based on skip‐penalized mean LDDT‐PLI for Model 1 (A); skip‐penalized RMSD success rate for Model 1
  (B); and skip‐penalized mean LDDT‐PLI … 1. Still, considering the best model leads to some reranking
  of the submissions: Although the two top‐ranked groups based on Model 1, Cluspro and [name redacted],
  are also top‐ranked when considering the best across all models, there is some shuffling of the subsequent
  rankings (Figure 3C vs. Figure 3A). We … (compare with Figure 3A), and the RFAA and AD Vina predictions
  are about average. TABLE 2 Accuracy, in terms of skip‐penalized mean LDDT‐PLI, of each baseline method
  and CASP group ClusPro (494) across all supertargets and for each individual supertarget. Method All
  Chymase Cathepsin G Autotaxin Mpro AF3 0.80 0.88 0.87 0.81 0.63 Boltz‐1 0.53 0.87 0.84 0.48 0.60 RFAA
  0.37 0.37 0.19 0.38 0.31 AD Vina 0.38 0.57 0.85 0.36 0.38 ClusPro (494) 0.69 0.72 0.76 0.68 0.72 Note:
  Autotaxin, with 189 targets, dominates the overall averages. It is not yet … each group's Model 1 submissions.
  The maximum value of this statistic is only 0.39, which is much lower than the maximum of 0.69 achieved
  for the drug‐like ligands (Figure 3A). Interestingly, though, some of the same methods appear among
  the best performers,"

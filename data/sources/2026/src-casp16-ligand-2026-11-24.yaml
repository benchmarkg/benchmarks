  claims (data/claims/casp/) cite: the LDDT-PLI definition, the skip penalty, the group numbering and
  Table 2's ClusPro row. src-casp16-ligand records a different content_sha256 and does not say how its
  text was made; the DOI, the title and the Europe PMC record are the same. Europe PMC's full-text XML
  (REST endpoint /europepmc/webservices/rest/PMC12750038/fullTextXML), normalised as text by schema.source.normalise();
  content_sha256 is that normalised text's. The XML keeps U+2010 hyphens, en dashes and curly quotes,
  so a quote retyped with ASCII hyphens fails the substring check. The body names people: its author list
  with ORCIDs and affiliations, a personal communication credited to a named researcher, and CASP groups
  whose names are their lab heads' surnames, so contains_personal_data is true. The windows (80 characters
  each side of a quote, widened to whole words) keep the author list and the acknowledgements out, and
  every name in them of a person, or of a CASP group that is or begins with a surname, is replaced by
  [name redacted] (5 tokens). A DOI source: no archive needed (06 S7.1)."

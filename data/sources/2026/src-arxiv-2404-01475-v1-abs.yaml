  Title:Are large language models superhuman chemists? Authors:Adrian Mirza, Nawaf Alampara,
  Sreekanth Kunchapu, Benedict Emoekabu, Aswanth Krishnan, Mara Wilhelmi, Macjonathan Okereke,
  Juliane Eberhar … Here, we introduce "ChemBench," an automated framework designed to rigorously
  evaluate the chemical knowledge and reasoning abilities of state-of-the-art LLMs against the
  expertise of human chemists. We curated more than 7,000 question-answer pairs for a wide array of
  subfields of the chemical sciences, evaluated leading open and closed-source LLMs, and found that
  the best models outperformed the best human chemists in our study on average. The models, however,
  struggle with some chemical reasoning

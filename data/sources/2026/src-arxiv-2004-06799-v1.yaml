quote_extract: 'fer to the real world, remains an open question. ROBOTHOR is a platform, built upon the
  AI2-THOR framework [32] to build and test embodied agents with an emphasis on studying this problem
  of domain transfer from simulation to the real world. Scenes. ROBOTHOR consists of a set of 89 apartments,
  75 in train/val (we use 60 for training and 15 for validation), 4 in test-dev (which are used for validation
  in the real world) and 10 in test-standard (blind physical test set) drawn from a set of 15, 2 and 5
  wall layouts respectively. Apartments that share the same wall layout have completely different room
  assignments and … ution of object categories in ROBOTHOR the physical world. The layouts, furniture,
  objects, lighting, etc. of the simulation environments have been designed carefully so as to closely
  resemble the corresponding scenes in their physical counterparts, while avoiding any overlap between
  the wall layouts and object instances among train/val, test-dev and test-standard. This resemblance
  will enable researchers to study the discrepancies between the two modalities and systematically identify
  the challenges of the domain transfer. Assets. A guiding design principle of ROBOTHOR is modularity,
  which allows us to easily augment and scale scenes. A large asset library was created by digital artists
  from which scenes were created by selectively drawing from these assets. This is in contrast to environments
  that are based on 3D scans of rooms which are challenging to alter and interact with. The framework
  includes 11 types of furniture (e.g. TV … bjects in a single frame. A large number of frames consist
  of the agent looking at the wall as is common in apartments, but outside these views many objects are
  visible to the agent at any given point as it navigates the environment. Physical space. The physical
  space for ROBOTHOR is 8.8m × 3.9m. The space is partitioned into rooms and corridors using ProPanel
  walls, which are designed to be lightweight and easy to set up and tear down, allowing us to easily
  conﬁgure a new apartment layout in a few minutes. Agent. The physical robot used is a LoCoBot1, which
  1http://www.locobot.org/ Target Objects Background Objects Furniture Walls Figure 3: Spatial distribution
  of objects and walls. Heatmaps illustrate the diverse spatial distribution of target objects, background
  objects, furniture, and walls. … We consider an episode successful if (a) the object is in view (b)
  the agent is within a threshold of distance to the target and (c) the agent reports that it observes
  the object. The starting location of the agent is a random location in the scene. The motion of the
  agent in the simulated world is stochastic in nature, mirroring its behavior in the real world. This
  renders the task more challenging. Previous works such as [69] consider agent motion along the axes
  on a grid. But given the end goal of navigating in the real world with motor noise and wheel slippage,
  deterministic movements in training lead … t paths to the target objects, in terms of the Move Ahead
  and Rotate actions. But shortest path statistics are a bit misleading for the task of semantic navigation
  because they assume that the agent already knows the location it must travel towards. In fact, the agent
  must explore until it observes the target, and then move swiftly towards it. We conducted a study where
  humans were posed with the problem of navigating in scenes in ROBOTHOR (simulation) to ﬁnd targets.
  The median number of steps was 49.5 (compared to 22.0 for shortest paths), illustrating the exploration
  nature of the task. Figure 6 shows an example trajectory from a human compared to the corresponding

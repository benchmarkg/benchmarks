  News¶ January, 2018: We have decided to stop processing new LUNA16 submissions. Read more ... September,
  2017: We have decided to stop processing new LUNA16 submissions without a clear description article.
  Read more ... June, 2017: The overview paper has been accepted for publication in Medical Image Ana
  … logists. Therefore there is a lot of interest to develop computer algorithms to optimize screening.
  A vital first step in the analysis of lung cancer screening CT scans is the detection of pulmonary nodules,
  which may or may not represent early stage lung cancer. Many Computer-Aided Detection (CAD) systems
  have already been proposed for this task. The LUNA16 ch … cus on a large-scale evaluation of automatic
  nodule detection algorithms on the LIDC/IDRI data set. The LIDC/IDRI data set is publicly available,
  including the annotations of nodules by four radiologists. The LUNA16 challenge is therefore a completely
  open challenge. We have tracks for complete systems for nodule detection, and for systems that use a
  list of locati … the likelihood for a given location in a CT scan to contain a pulmonary nodule. How
  to Participate¶ This challenge has been closed. Read more ... Organizers¶ Colin Jacobs (Radboud University
  Medical Center, Nijmegen, The Netherland'

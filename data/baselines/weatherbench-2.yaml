# data/baselines/weatherbench-2.yaml -- P3-S6-T04 (04 S7, 12 S3.2). WeatherBench 2's anchors: ECMWF's operational
# forecasts as the ceiling (IFS HRES for the deterministic RMSE, IFS ENS for the probabilistic CRPS) and the
# climatology and persistence forecasts as the classical-algorithm floors, as 12 S3.2 assigns them ("IFS/ENS is
# what a learned forecaster is trying to beat, so it is the reference frontier").
#
# Every anchor is a curve over the grid, not a number: one value per variable, pressure level, region, lead time,
# evaluation year and resolution. Baseline has no lead-time, region or resolution field, so each record below is
# one stated cell, the same cell for all of them: Z500 (geopotential at 500 hPa, subset weatherbench-2#z500),
# global, lead time 120 h, evaluation year 2020 (benchmark_version weatherbench-2@2020), 240x121 = 1.5 degrees, the
# paper's protocol. The coordinates the schema cannot hold are in each record's notes and quotes.
#
# The values come from the maintainers' published results files in the public weatherbench2 bucket
# (benchmark_results/), read as text: the paper's scorecards and lead-time plots and the site's scorecards are
# images, and the site's interactive plots receive their numbers as base64-encoded binary arrays, so none of those
# holds a quotable value. Each results Source's extract_preprocessing says how its file was rendered.
#
# One primary per metric is the schema's rule (BaselineFile), and IFS is the primary. Headroom is not computed for
# this benchmark (no_legitimate_aggregate; 12 S3.4's vector-valued-by-design, which P3-S9-T04 asserts), so the
# primary designation selects nothing here.

# --- RMSE (deterministic) -----------------------------------------------------------------------------------------

  - id: base-weatherbench-2-2020-z500-rmse-ifs-hres
    benchmark_version: weatherbench-2@2020
    kind: operational-system
    metric: weatherbench-2-rmse
    value: 304.354
    is_primary: true
    subset: weatherbench-2#z500
    source: src-weatherbench-2-results-hres-vs-hres-t0-240x121-2020
    evidence:
      - source: src-weatherbench-2-results-hres-vs-hres-t0-240x121-2020
        quote: 'rmse.geopotential, region global, level 500, lead_time 120 h: 304.354;'
      - source: src-weatherbench-2-results-hres-vs-hres-t0-240x121-2020
        quote: 'rmse.geopotential, region global, level 500, lead_time 24 h: 42.2966;'
      - source: src-weatherbench-2-results-hres-vs-hres-t0-240x121-2020
        quote: 'rmse.geopotential, region global, level 500, lead_time 240 h: 801.499;'
      - source: src-weatherbench-2-arxiv-html
        quote: Our main baseline comes from operational forecasts created with
      - source: src-arxiv-2308-15560-v2
        quote: we use the initial conditions, i.e. the IFS HRES forecasts at t=0 as our
      - source: src-weatherbench-2-deterministic-layout-2026-11-24
        quote: '"IFS HRES vs Analysis"'
      - source: src-weatherbench-2-data-guide
        quote: For the WeatherBench 2 paper, all evaluation was done at 240x121 = 1.5 degree
          resolution.
    notes: >
      IFS HRES, ECMWF's operational deterministic forecast, at Z500, global, lead time 120 h, 2020, 1.5
      degrees, scored against HRES at t=0, which the paper uses as the analysis (the file's hres_t0).
      In the variable's units, which the file does not state. The same row of the file runs from 42.2966
      at 24 h to 801.499 at 240 h, so the value means nothing without its lead time. A reference point,
      not a cap: the scorecards colour every model's cell by its difference to IFS HRES, and the paper
      finds the IFS ensemble mean below it on RMSE at longer lead times (src-arxiv-2308-15560-v2).
  - id: base-weatherbench-2-2020-z500-rmse-climatology
    benchmark_version: weatherbench-2@2020
    kind: classical-algorithm
    metric: weatherbench-2-rmse
    value: 820.873
    subset: weatherbench-2#z500
    source: src-weatherbench-2-results-climatology-vs-era5-240x121-2020
    evidence:
      - source: src-weatherbench-2-results-climatology-vs-era5-240x121-2020
        quote: 'rmse.geopotential, region global, level 500, lead_time 120 h: 820.873;'
      - source: src-weatherbench-2-results-climatology-vs-era5-240x121-2020
        quote: 'rmse.geopotential, region global, level 500, lead_time 24 h: 819.353;'
      - source: src-weatherbench-2-faq
        quote: The climatology is used for computing certain skill scores, in particular, ACC and
          SEEPS, and as a baseline forecast.
      - source: src-github-weatherbench2-evaluate-py-87a0abd
        quote: Evaluate climatology forecast specified in climatology path.
      - source: src-weatherbench-2-deterministic-layout-2026-11-24
        quote: '"Climatology vs ERA5"'
    notes: >
      The ERA5 climatology (1990-2019, by day of year and time of day) used as a forecast, at the same
      cell, scored against ERA5: a non-learned reference, the floor 12 S3.2 names. It barely moves with
      lead time (819.353 at 24 h).
  - id: base-weatherbench-2-2020-z500-rmse-persistence
    benchmark_version: weatherbench-2@2020
    kind: classical-algorithm
    metric: weatherbench-2-rmse
    value: 1049.58
    subset: weatherbench-2#z500
    source: src-weatherbench-2-results-persistence-vs-era5-240x121-2020
    evidence:
      - source: src-weatherbench-2-results-persistence-vs-era5-240x121-2020
        quote: 'rmse.geopotential, region global, level 500, lead_time 120 h: 1049.58;'
      - source: src-weatherbench-2-results-persistence-vs-era5-240x121-2020
        quote: 'rmse.geopotential, region global, level 500, lead_time 24 h: 604.766;'
      - source: src-github-weatherbench2-evaluate-py-87a0abd
        quote: Evaluate persistence forecast, i.e. forecast at t=0
      - source: src-weatherbench-2-deterministic-layout-2026-11-24
        quote: '"Persistence vs ERA5"'
    notes: >
      The persistence forecast, "forecast at t=0" in the evaluation script's words, at the same cell,
      scored against ERA5. A floor that depends on lead time: 604.766 at 24 h, below the climatology,
      and 1049.58 at 120 h, above it, so which of the two floors is lower changes along the curve. No
      source read defines persistence beyond the script's flag; the paper mentions persistence errors
      only in a figure caption.

# --- CRPS (probabilistic) -----------------------------------------------------------------------------------------

  - id: base-weatherbench-2-2020-z500-crps-ifs-ens
    benchmark_version: weatherbench-2@2020
    kind: operational-system
    metric: weatherbench-2-crps
    value: 114.909
    is_primary: true
    subset: weatherbench-2#z500
    source: src-weatherbench-2-results-ens-vs-hres-t0-240x121-2020
    evidence:
      - source: src-weatherbench-2-results-ens-vs-hres-t0-240x121-2020
        quote: 'crps.geopotential, region global, level 500, lead_time 120 h: 114.909;'
      - source: src-weatherbench-2-results-ens-vs-hres-t0-240x121-2020
        quote: 'crps.geopotential, region global, level 500, lead_time 24 h: 22.3814;'
      - source: src-weatherbench-2-results-ens-vs-hres-t0-240x121-2020
        quote: 'crps.geopotential, region global, level 500, lead_time 240 h: 262.433;'
      - source: src-weatherbench-2-homepage
        quote: relative to ECMWF's IFS ENS model.
      - source: src-weatherbench-2-probabilistic-layout-2026-11-24
        quote: '"IFS ENS vs Analysis","IFS ENS vs ERA5"'
      - source: src-arxiv-2308-15560-v2
        quote: Values show absolute CRPS. Colors denote % difference to the IFS ENS baseline.
    notes: >
      IFS ENS, ECMWF's operational ensemble, at the same cell (Z500, global, 120 h, 2020, 1.5 degrees),
      scored against HRES at t=0, the analysis. The probabilistic scorecards colour every ensemble's cell
      by its difference to it. The same row runs from 22.3814 at 24 h to 262.433 at 240 h.
  - id: base-weatherbench-2-2020-z500-crps-climatology
    benchmark_version: weatherbench-2@2020
    kind: classical-algorithm
    metric: weatherbench-2-crps
    value: 369.95
    subset: weatherbench-2#z500
    source: src-weatherbench-2-results-probabilistic-climatology-vs-era5-240x121-2020
    evidence:
      - source: src-weatherbench-2-results-probabilistic-climatology-vs-era5-240x121-2020
        quote: 'crps.geopotential, region global, level 500, lead_time 120 h: 369.95;'
      - source: src-weatherbench-2-arxiv-html
        quote: version of the climatology is created by taking each of the 30 years from 1990 to
          2019 as an ensemble member
      - source: src-github-weatherbench2-evaluate-py-87a0abd
        quote: derived from using each year of the ground-truth dataset as a member
      - source: src-weatherbench-2-probabilistic-layout-2026-11-24
        quote: '"Probabilistic Climatology vs ERA5"'
      - source: src-arxiv-2308-15560-v2
        quote: Their skill approaches that of the probabilistic climatology towards the end of the
          two week forecast horizon.
    notes: >
      The probabilistic climatology, each of the 30 years 1990-2019 of ERA5 an ensemble member, at the
      same cell, scored against ERA5: the floor for an ensemble forecast. The paper reads the IFS and
      NeuralGCM ensembles' skill as approaching it towards the end of the two-week horizon.
  - id: base-weatherbench-2-2020-z500-crps-persistence
    benchmark_version: weatherbench-2@2020
    kind: classical-algorithm
    metric: weatherbench-2-crps
    value_absent_reason: no-published-comparator
    subset: weatherbench-2#z500
    evidence:
      - source: src-weatherbench-2-probabilistic-layout-2026-11-24
        quote: '"options":["ArchesWeatherGen vs ERA5","Astra vs ERA5","FGN (oper.) vs Analysis"'
      - source: src-weatherbench-2-probabilistic-layout-2026-11-24
        quote: '"IFS ENS vs Analysis","IFS ENS vs ERA5","NeuralGCM ENS vs ERA5","Probabilistic Climatology
          vs ERA5","Sonny-ENS vs ERA5"]'
    notes: >
      No persistence floor exists for the probabilistic metric. The probabilistic scores offer twelve
      forecasts to compare against, the probabilistic climatology among them, and no persistence forecast,
      and the published persistence results file holds deterministic metrics only (RMSE, MSE, bias, ACC,
      SEEPS, forecast activity and the wind-vector RMSE).

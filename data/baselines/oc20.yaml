# data/baselines/oc20.yaml -- P3-S6-T02 (04 S7, 12 S3.2). The anchors of Open Catalyst's computational generations,
# OC20 and OC22: for each version and each of its eight metrics, a ceiling, which is the primary (headroom is read
# against it), and a floor where a source read gives one.
#
# The ceilings are the metrics' own bounds (an absolute error of 0, a cosine of 1, a percentage of 100), which is
# theoretical-maximum: reproducing DFT exactly. No source read measures a DFT noise ceiling below them, and none has a
# human comparator (04 S7). The floors are the OC22 paper's Median Baseline and IS baseline rows on its test tables,
# read from the PDF's text, where each table is flattened column by column: the first number of a column is the
# first row's, and the Median Baseline (or IS baseline) is the first row of the OC22-only block (review check). The
# OC20 paper's own median baselines (its Tables 3-5) are outside src-arxiv-2010-09990-v5's committed extract, so OC20
# has ceilings and no floors here (review check).
#
# OCx24 has no anchors here. Its metric is R² under cross-validation, whose bound (1) no OCx24 source states, and the
# replicate noise the paper measures (0.043 V for HER; 0.050, 0.040 and 0.033 umol/cm2s for H2, CO and liquid
# products) is in the targets' units, not R²'s, so it cannot anchor R² as an experimental-replicate ceiling. The
# figures are on the oc20#ocx24-her and oc20#ocx24-co2rr subsets' evidence.

# --- OC20 ------------------------------------------------------------------------------------------------------

  - id: base-oc20-oc20-s2ef-energy-mae-zero
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-s2ef-energy-mae
    value: 0.0
    is_primary: true
    source: src-hf-fairchem-leaderboard-evaluator-212fd1e
    evidence:
      - source: src-hf-fairchem-leaderboard-evaluator-212fd1e
        quote: metrics[f"{split}_energy_mae"] = energy_mae
    notes: 0 eV is the bound of an absolute error, not a published number; it means reproducing the
      DFT energies exactly.
  - id: base-oc20-oc20-s2ef-force-mae-zero
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-s2ef-force-mae
    value: 0.0
    is_primary: true
    source: src-hf-fairchem-leaderboard-evaluator-212fd1e
    evidence:
      - source: src-hf-fairchem-leaderboard-evaluator-212fd1e
        quote: forces_mae /= 3 * natoms
    notes: The bound of an absolute error; reproducing the DFT forces exactly.
  - id: base-oc20-oc20-s2ef-force-cosine-one
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-s2ef-force-cosine
    value: 1.0
    is_primary: true
    source: src-arxiv-2206-08917-v3
    evidence:
      - source: src-arxiv-2206-08917-v3
        quote: The S2EF-Total task uses the same metrics as the OC20 S2EF task
      - source: src-arxiv-2206-08917-v3
        quote: Metrics include Energy Mean Absolute Error (MAE), Force MAE, Force cosine, and Energy
          and Forces within Threshold (EFwT)
    notes: The bound of a cosine; every predicted force pointing the DFT force's way.
  - id: base-oc20-oc20-s2ef-efwt-hundred
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-s2ef-efwt
    value: 100.0
    is_primary: true
    source: src-arxiv-2206-08917-v3
    evidence:
      - source: src-arxiv-2206-08917-v3
        quote: The S2EF-Total task uses the same metrics as the OC20 S2EF task
    notes: The bound of a percentage; every structure within both thresholds.
  - id: base-oc20-oc20-is2re-energy-mae-zero
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-is2re-energy-mae
    value: 0.0
    is_primary: true
    source: src-arxiv-2010-09990-v5
    evidence:
      - source: src-arxiv-2010-09990-v5
        quote: 'Energy MAE: Mean Absolute Error between the computed relaxed energy and the ground truth
          relaxed energy'
    notes: The bound of an absolute error; reproducing the DFT relaxed energies exactly.
  - id: base-oc20-oc20-is2re-ewt-hundred
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-is2re-ewt
    value: 100.0
    is_primary: true
    source: src-arxiv-2010-09990-v5
    evidence:
      - source: src-arxiv-2010-09990-v5
        quote: The second measures the energies within a threshold (EwT) of the ground truth
    notes: The bound of a percentage; every relaxed energy within 0.02 eV.
  - id: base-oc20-oc20-is2rs-adwt-hundred
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-is2rs-adwt
    value: 100.0
    is_primary: true
    source: src-arxiv-2206-08917-v3
    evidence:
      - source: src-arxiv-2206-08917-v3
        quote: IS2RS metrics here are identical to that of OC20
    notes: The bound of a percentage; every structure within the tightest distance threshold.
  - id: base-oc20-oc20-is2rs-afbt-hundred
    benchmark_version: oc20@oc20
    kind: theoretical-maximum
    metric: oc-is2rs-afbt
    value: 100.0
    is_primary: true
    source: src-arxiv-2206-08917-v3
    evidence:
      - source: src-arxiv-2206-08917-v3
        quote: Metrics include Average Distance within Threshold (ADwT), Force below Threshold
          (FbT), and Average Force below Threshold (AFbT)
    notes: The bound of a percentage; every structure a true DFT minimum at the tightest force
      threshold.


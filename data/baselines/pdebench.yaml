      - source: src-github-pdebench-metrics-4bcbb4c
        quote: 'err_F[:, 2] += torch.mean(_err_F[:, iHigh:], dim=1) # high freq'
    notes: 0 is the bound of a spectral error; not a published number.
  - id: base-pdebench-frmse-high-floor

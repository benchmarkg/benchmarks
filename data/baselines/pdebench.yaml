      - source: src-github-pdebench-metrics-4bcbb4c
        quote: 'err_F[:, 1] += torch.mean(_err_F[:, iLow:iHigh], dim=1) # middle freq'
    notes: 0 is the bound of a spectral error; not a published number.
  - id: base-pdebench-frmse-mid-floor
    benchmark_version: pdebench
    kind: classical-algorithm
    metric: pdebench-frmse-mid

# data/baselines/pdebench.yaml -- P3-S6-T08 (04 S7, 12 S3.2). The anchors of PDEBench's eight forward metrics: for
# each, its bound of zero, which is the primary, and a floor recorded as absent.
#
# Read from the paper's v7 PDF (src-arxiv-2210-07182-v7) and the evaluation script at commit 4bcbb4c
# (src-github-pdebench-metrics-4bcbb4c). Every one of the eight is an error norm whose optimum is zero, so headroom
# is refused with lower-is-better-optimum-zero (12 S3.4) whatever these records hold. The paper's baselines (U-Net,
# FNO, PINN) are learned models and so claims, not anchors; no source read scores a non-learned predictor (a
# constant field, the initial condition carried forward, a coarser numerical solver) on any metric, so each floor
# is no-published-comparator rather than a guess. A value is per PDE dataset and parameter value; these records hold
# for every one of them. benchmark_version is the bare id: the entry declares no versions[].

# --- RMSE -----------------------------------------------------------------------------------------------------

  - id: base-pdebench-rmse-zero
    benchmark_version: pdebench
    kind: theoretical-maximum
    metric: pdebench-rmse
    value: 0.0
    is_primary: true
    source: src-arxiv-2210-07182-v7
    evidence:
      - source: src-arxiv-2210-07182-v7
        quote: The classic loss metrics we use are (1) root-mean-squared-error (RMSE), (2)
          normalized RMSE (nRMSE), (3) maximum error
      - source: src-github-pdebench-metrics-4bcbb4c
        quote: err_RMSE = torch.mean(err_mean, axis=0)
    notes: 0 is the bound of a root mean squared error, reached only by reproducing the numerical
      solver's solution exactly; the sources define the error, not the number. It means matching the
      solver, not the PDE's exact solution.
  - id: base-pdebench-rmse-floor
    benchmark_version: pdebench
    kind: classical-algorithm
    metric: pdebench-rmse
    value_absent_reason: no-published-comparator
    notes: No source read scores a non-learned predictor on it.

# --- nRMSE ----------------------------------------------------------------------------------------------------

  - id: base-pdebench-nrmse-zero
    benchmark_version: pdebench
    kind: theoretical-maximum
    metric: pdebench-nrmse
    value: 0.0
    is_primary: true
    source: src-arxiv-2210-07182-v7
    evidence:
      - source: src-arxiv-2210-07182-v7
        quote: The normalized RMSE is a variant of the RMSE to provide scale-independent information
      - source: src-github-pdebench-metrics-4bcbb4c
        quote: err_nRMSE = torch.mean(err_mean / nrm, dim=0)
    notes: 0 is the bound of the ratio of two norms, reached only by reproducing the solver's
      solution exactly; not a published number.
  - id: base-pdebench-nrmse-floor
    benchmark_version: pdebench
    kind: classical-algorithm
    metric: pdebench-nrmse
    value_absent_reason: no-published-comparator
    notes: No source read scores a non-learned predictor on it. By the definition a prediction of
      zero everywhere would score 1, but no source states or measures that, so it is not recorded as
      a value.

# --- maximum error --------------------------------------------------------------------------------------------

  - id: base-pdebench-max-error-zero
    benchmark_version: pdebench
    kind: theoretical-maximum
    metric: pdebench-max-error
    value: 0.0
    is_primary: true
    source: src-arxiv-2210-07182-v7
    evidence:
      - source: src-arxiv-2210-07182-v7
        quote: maximum error (local worst case; also proxy for stability of time-stepping)
      - source: src-github-pdebench-metrics-4bcbb4c
        quote: '# worst case in all the data'
    notes: 0 is the bound of an absolute error; not a published number.
  - id: base-pdebench-max-error-floor
    benchmark_version: pdebench
    kind: classical-algorithm
    metric: pdebench-max-error
    value_absent_reason: no-published-comparator
    notes: No source read scores a non-learned predictor on it.

# --- cRMSE ----------------------------------------------------------------------------------------------------

  - id: base-pdebench-crmse-zero
    benchmark_version: pdebench
    kind: theoretical-maximum
    metric: pdebench-crmse
    value: 0.0
    is_primary: true
    source: src-arxiv-2210-07182-v7
    evidence:
      - source: src-arxiv-2210-07182-v7
        quote: RMSE of conserved value (deviation from conserved physical quantity)
      - source: src-github-pdebench-metrics-4bcbb4c
        quote: torch.sum(pred.view([nb, nc, -1, nt]), dim=2) - torch.sum(target.view([nb, nc, -1,
          nt]), dim=2)
    notes: 0 is the bound of the error, reached by a prediction whose spatial sums equal the
      solver's; a prediction can reach it with local errors that cancel. Not a published number.
  - id: base-pdebench-crmse-floor
    benchmark_version: pdebench
    kind: classical-algorithm
    metric: pdebench-crmse
    value_absent_reason: no-published-comparator
    notes: No source read scores a non-learned predictor on it.

# --- bRMSE ----------------------------------------------------------------------------------------------------

  - id: base-pdebench-brmse-zero
    benchmark_version: pdebench
    kind: theoretical-maximum
    metric: pdebench-brmse
    value: 0.0
    is_primary: true
    source: src-arxiv-2210-07182-v7
    evidence:
      - source: src-arxiv-2210-07182-v7
        quote: RMSE on boundary (whether boundary condition can be learned)
      - source: src-github-pdebench-metrics-4bcbb4c
        quote: err_BD += (pred[:, :, -1, :] - target[:, :, -1, :]) ** 2
    notes: 0 is the bound of a root mean squared error at the boundary points; not a published
      number.
  - id: base-pdebench-brmse-floor
    benchmark_version: pdebench
    kind: classical-algorithm
    metric: pdebench-brmse
    value_absent_reason: no-published-comparator
    notes: No source read scores a non-learned predictor on it.

# --- fRMSE, low, mid and high bands ---------------------------------------------------------------------------

  - id: base-pdebench-frmse-low-zero
    benchmark_version: pdebench
    kind: theoretical-maximum
    metric: pdebench-frmse-low
    value: 0.0
    is_primary: true
    source: src-arxiv-2210-07182-v7
    evidence:
      - source: src-arxiv-2210-07182-v7
        quote: RMSE in Fourier space, low frequency regime (wavelength dependence)
      - source: src-arxiv-2210-07182-v7
        quote: 'Low: kmin = 0, kmax = 4, Middle: kmin = 5, kmax = 12, and High: kmin = 13'
      - source: src-github-pdebench-metrics-4bcbb4c
        quote: 'err_F[:, 0] += torch.mean(_err_F[:, :iLow], dim=1) # low freq'
    notes: 0 is the bound of a spectral error; not a published number. The paper's band (0-4) and
      the script's (0-3) differ (the metric's pitfalls).
  - id: base-pdebench-frmse-low-floor
    benchmark_version: pdebench
    kind: classical-algorithm
    metric: pdebench-frmse-low
    value_absent_reason: no-published-comparator
    notes: No source read scores a non-learned predictor on it.

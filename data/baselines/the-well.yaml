# data/baselines/the-well.yaml -- P3-S6-T08 (04 S7, 12 S3.2). The anchors of The Well's one reported metric, VRMSE:
# its bound of zero, which is the primary, and the score of predicting the target's spatial mean, to which the paper
# scales the metric.
#
# Read from the paper's v3 PDF (src-arxiv-2412-00568-v3). VRMSE's optimum is zero, so headroom is refused with
# lower-is-better-optimum-zero (12 S3.4) whatever these records hold; they are stored so the scale's two fixed points
# are data rather than prose. The baselines the paper trains (FNO, TFNO, U-net, CNextU-net) are learned models and
# so claims, not anchors, and no human or non-learned solver comparator is published. benchmark_version is the bare
# id: the entry declares no versions[].

  - id: base-the-well-vrmse-zero
    benchmark_version: the-well
    kind: theoretical-maximum
    metric: the-well-vrmse
    value: 0.0
    is_primary: true
    source: src-arxiv-2412-00568-v3
    evidence:
      - source: src-arxiv-2412-00568-v3
        quote: VRMSE metrics on test sets (lower is better)
      - source: src-arxiv-2412-00568-v3
        quote: 'The variance scaled mean squared error (VMSE): it is the MSE normalized by the variance
          of the truth'
    notes: 0 is the bound of a root mean squared error, reached only by reproducing the simulated
      field exactly; the source states the metric and its direction, not the number. It means
      matching the contributing solver, not nature.
  - id: base-the-well-vrmse-spatial-mean
    benchmark_version: the-well
    kind: classical-algorithm
    metric: the-well-vrmse
    value: 1.0
    source: src-arxiv-2412-00568-v3
    evidence:
      - source: src-arxiv-2412-00568-v3
        quote: VRMSE is scaled such that predicting the mean value of the target field results in a
          score of 1
      - source: src-arxiv-2412-00568-v3
        quote: We choose VRMSE as the reporting metric as it has the clear interpretation that
          scores above 1.0 indicates one could have improved the result by predicting the
          non-spatially varying mean of the target
      - source: src-arxiv-2412-00568-v3
        quote: This is not the same as predicting the population mean
    notes: >
      A constant field equal to the target snapshot's own spatial mean, which the metric's denominator
      makes score 1 (about 1, with the epsilon), on every dataset and at every step. classical-algorithm
      as for a dummy constant predictor elsewhere, with the caveat that this constant needs the answer's
      mean and so is a reference point of the scale rather than a method anyone could run. The paper's
      own learned baselines score above it on several datasets, most often in longer rollouts.

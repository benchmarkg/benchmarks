# data/baselines/fair-universe-higgsml.yaml -- P3-S6-T08 (04 S7, 12 S3.2). The anchors of the FAIR Universe HiggsML
# Uncertainty Challenge's three interval metrics: the Quantile Score that ranked it, and the coverage and average
# width it is built from. One primary for each, and a floor for the score, recorded as absent.
#
# Read from section 3.1 of the paper's v5 PDF (src-arxiv-2410-02867-v5-2026-11-24). Only the Quantile Score is
# headroom-computable: its bound is -ln(0.01), derived from the formula rather than printed, and no floor is
# published, so its headroom is no-baseline-established for now (12 S3.4). Coverage has a target, not a ceiling, so
# its primary is not-applicable; the width's optimum is zero, so its headroom is lower-is-better-optimum-zero. The
# starting kit's baseline is a learned model, a claim rather than an anchor, and no source read gives its score. The
# records are on the 2024 edition, the only one whose scoring the sources describe.

# --- Quantile Score -------------------------------------------------------------------------------------------

  - id: base-fair-universe-higgsml-quantile-score-bound
    benchmark_version: fair-universe-higgsml@2024
    kind: theoretical-maximum
    metric: fair-universe-higgsml-quantile-score
    value: 4.6052
    is_primary: true
    source: src-arxiv-2410-02867-v5-2026-11-24
    evidence:
      - source: src-arxiv-2410-02867-v5-2026-11-24
        quote: The final Quantile Score (the larger the better) used to rank participants is
          calculated as follows
      - source: src-arxiv-2410-02867-v5-2026-11-24
        quote: c is the coverage, and ϵ = 10−2 is a regularisation term
      - source: src-arxiv-2410-02867-v5-2026-11-24
        quote: A penalising function f has been defined to penalise the departure of c from the
          expected 68.27%
    notes: >
      -ln(eps) with eps = 0.01, that is ln 100 = 4.60517..., rounded up to 4.6052 so that it bounds the
      score. The penalty f is 1 plus terms that are never negative, so (w + eps) f(c) is at least eps
      and the score cannot exceed -ln(eps). The bound needs a zero-width interval with coverage inside
      the no-penalty band, which no valid interval reaches; it is derived from the formula, not printed
      in any source read (the entry's data.ceiling_anchor_type_note records the same bound). The joint
      winners scored about -0.58.
  - id: base-fair-universe-higgsml-quantile-score-floor
    benchmark_version: fair-universe-higgsml@2024
    kind: classical-algorithm
    metric: fair-universe-higgsml-quantile-score
    value_absent_reason: no-published-comparator
    notes: No source read scores a non-learned interval (one spanning mu's whole range, say) or a
      naive statistical procedure on the score. The starting kit's baseline, a classifier with a
      binned likelihood fit, is a learned model and no source read gives its score.

# --- coverage -------------------------------------------------------------------------------------------------

  - id: base-fair-universe-higgsml-coverage-target
    benchmark_version: fair-universe-higgsml@2024
    kind: theoretical-maximum
    metric: fair-universe-higgsml-coverage
    value_absent_reason: not-applicable
    is_primary: true
    source: src-arxiv-2410-02867-v5-2026-11-24
    evidence:
      - source: src-arxiv-2410-02867-v5-2026-11-24
        quote: the closer to the standard 68.27% probability the better
      - source: src-arxiv-2410-02867-v5-2026-11-24
        quote: Hence, coverage exceeding 68.27% incurs a lesser penalty than coverage falling below
          68.27%
    notes: Coverage is scored against a target, 0.6827 (the metric's optimum_target), not a maximum,
      and coverage above the target is penalised too. So it has no ceiling for headroom to be read
      against, and the metric declares headroom_computable false; the target itself lives on the
      Metric, not here.

# --- average interval width -----------------------------------------------------------------------------------

  - id: base-fair-universe-higgsml-interval-width-zero
    benchmark_version: fair-universe-higgsml@2024
    kind: theoretical-maximum
    metric: fair-universe-higgsml-interval-width
    value: 0.0
    is_primary: true
    source: src-arxiv-2410-02867-v5-2026-11-24
    evidence:
      - source: src-arxiv-2410-02867-v5-2026-11-24
        quote: Average Interval Width w (the smaller the better)
      - source: src-arxiv-2410-02867-v5-2026-11-24
        quote: is a regularisation term to guard against submissions that report unrealistically
          narrow CIs
    notes: 0 is the bound of a width, not a published number and not a goal on its own; a zero-width
      interval would almost never cover the true mu, which is why the metric is bound to the
      coverage (must_report_with) and the score regularises narrow intervals.

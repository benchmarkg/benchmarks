# data/organizations/org-matbench-discovery.yaml -- P3-S7-T01 (04 S9). The reporter of the Matbench Discovery claims
# (data/claims/matbench-discovery/): the maintainers score each submitted model's prediction files with their own
# evaluation code and publish the metrics on the leaderboard and in the paper's tables
# (src-matbench-discovery-contribute; the entry's submission_process). Named for the project, as PDEBench's and
# RoboArena's reporters are. kind individual: the entry's maintainer_type, since the site and the code repository
# are one researcher's (governance.maintainer_basis); the paper that froze the table the claims quote has authors at
# several institutions, so a reviewer may prefer consortium. No person is named here. country is left null.
id: org-matbench-discovery
name: Matbench Discovery
kind: individual
homepage: https://matbench-discovery.materialsproject.org/
roles:
  - benchmark-maintainer
  - evaluator
sources:
  - src-matbench-discovery-contribute
  - src-matbench-discovery-repo

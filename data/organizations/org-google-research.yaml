# data/organizations/org-google-research.yaml -- P3-S7-T05 (04 S9), promoted from P3-S3-T04's Epoch stub so the
# WeatherBench 2 claims (data/claims/weatherbench-2/) can name it as reported_by: it maintains WeatherBench 2 (the
# entry's governance.maintainer; the paper's byline reads "Affiliation: Google Research", src-weatherbench-2-arxiv-html)
# and publishes the results files the claims read, and it develops NeuralGCM ENS, one of the claimed systems
# ("NeuralGCM ENS Google Research Hybrid Forecast (Ensemble) ERA5 1.4°", src-weatherbench-2-homepage). kind company:
# Google's research organisation. parent is not set: org-google is an unreviewed stub, and the stub's identity
# question (whether Epoch's 'Google' and 'Google Research' are one organisation, a parent and a part, or unrelated)
# stays with the identity review. country is left null rather than filled from memory, as P0-S8-T05 did; a reviewer
# confirms kind and fills it. The stub's Epoch spellings are not carried over: a curated Organization has no field
# for them, and scripts/emit_epoch_entities.py emits no stub for a curated id.
id: org-google-research
name: Google Research
kind: company
roles:
  - benchmark-maintainer
  - system-developer
  - evaluator
sources:
  - src-epoch-benchmark-data
  - src-weatherbench-2-arxiv-html
  - src-weatherbench-2-homepage

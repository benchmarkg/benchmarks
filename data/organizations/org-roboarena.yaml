# data/organizations/org-roboarena.yaml -- P3-S8-T05 (04 S9). The reporter of the RoboArena claims
# (data/claims/roboarena/): the team that runs the arena's central server, ranks the policies and publishes the
# counts its API serves, while volunteer evaluators run the A/B evaluations. The name is the publisher every
# RoboArena Source records; kind community follows the self-description, "RoboArena is a community-run, real-world
# benchmark for evaluating generalist robot policies" (src-roboarena-site-bundle). country is left null: the
# evaluator organisations are in several countries, and no source read places the team.
id: org-roboarena
name: RoboArena
kind: community
homepage: https://robo-arena.github.io/
roles:
  - benchmark-maintainer
  - evaluator
sources:
  - src-roboarena-site-bundle

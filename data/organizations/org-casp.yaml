# maintainer_note puts the organising committee in three countries.
id: org-casp
name: CASP
kind: community
homepage: https://predictioncenter.org/
roles:
  - benchmark-maintainer
  - evaluator
sources:
  - src-casp17-home
  - src-casp16-overview

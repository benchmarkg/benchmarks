# data/_analysis/warning-triage.yaml -- every outstanding validation warning, triaged (P1-S13-T04; 04 S12,
# 14-roadmap Phase 1 exit: "Zero validation errors; quality warnings triaged rather than suppressed")
#
# One row per decision over the warnings and quality signals `bench validate --tier all --json` reported on
# 2026-11-17 that this pull request did not fix. `decision` is accepted (the signal is right and stays on the
# dashboard) or deferred (the named `owner`, a ledger task or a pull request, clears it). Each row lists its
# findings line by line: `entity`, a `detail` where the rule fires more than once per entity or its subject can
# change (the subset and dropped terms, the waived fields, the submission process, the archive state), and an
# optional `note` that says why for that line. No rule is switched off: scripts/check_warnings_triaged.py fails on
# any warning not listed here, so a new one gets its own decision. docs/quality-triage.md is the account.
#
# Status: agent-drafted (P1-S13-T04's executor is agent-draft). A person accepts or amends each decision.

version: 1
decisions:
  - rule: subset-drops-terms
    decision: accepted
    reason: Each subset's narrower capability_override was read against the published definitions of
      the dropped terms in taxonomy/capabilities.yaml, and the subset does not exercise them; each
      line says why.
    decided_by: agent (P1-S13-T04)
    decided_on: 2026-11-17
    findings:
      - entity: airfrans
        detail: 'airfrans#aoa capability: sample-efficiency'
        note: Angle-of-attack extrapolation trains on all simulations inside the middle range, with
          no small sample budget fixed; what it scores is extrapolation outside it.
      - entity: airfrans
        detail: 'airfrans#full capability: distribution-shift-generalization, sample-efficiency'
        note: The full task trains on 800 simulations and tests on 200 from the same parameter
          ranges, so no shifted inputs are scored and its training set is the whole split, not a
          constrained budget.
      - entity: airfrans
        detail: 'airfrans#reynolds capability: sample-efficiency'
        note: Reynolds extrapolation trains on every simulation in the 3-5 million range rather than
          a fixed small budget; what it scores is extrapolation beyond that range.
      - entity: airfrans
        detail: 'airfrans#scarce capability: distribution-shift-generalization'
        note: The scarce task tests on the full task's in-range test set; only the training budget
          shrinks, so no shifted input condition is scored.
      - entity: big-bench-hard
        detail: 'big-bench-hard#boolean-expressions capability: quantitative-reasoning, spatial-reasoning,
          temporal-reasoning'
        note: Boolean Expressions is truth-table evaluation of True/False constants under and, or
          and not; it involves no quantities, space or time.
      - entity: big-bench-hard
        detail: 'big-bench-hard#causal-judgement capability: deductive-reasoning, quantitative-reasoning,
          spatial-reasoning, temporal-reasoning'
        note: Causal Judgement scores how a typical person would answer a causal question about a
          story, which no premise entails; its claims are causal, not temporal, and carry no numbers
          or space.
      - entity: big-bench-hard
        detail: 'big-bench-hard#date-understanding capability: deductive-reasoning, spatial-reasoning'
        note: Date Understanding turns on calendar facts, so its answers are not decidable from the
          stated premises alone, and nothing in it is spatial; quantitative-reasoning was restored
          for its date arithmetic.
      - entity: big-bench-hard
        detail: 'big-bench-hard#formal-fallacies capability: quantitative-reasoning, spatial-reasoning,
          temporal-reasoning'
        note: Formal Fallacies asks whether a syllogism is deductively valid; its premises carry no
          numbers, positions or times, so only deductive reasoning applies.
      - entity: big-bench-hard
        detail: 'big-bench-hard#geometric-shapes capability: deductive-reasoning, quantitative-reasoning,
          temporal-reasoning'
        note: Geometric Shapes asks which shape an SVG path draws, a spatial inference that needs
          SVG knowledge rather than stated premises; the answer is a shape name, not a number, and
          time plays no part.
      - entity: big-bench-hard
        detail: 'big-bench-hard#logical-deduction capability: quantitative-reasoning, spatial-reasoning,
          temporal-reasoning'
        note: Clues fix a one-dimensional order (shelf places, finishing ranks, ages, prices) and
          the inference is the same order deduction in every frame; no geometry, calculation or
          duration is scored.
      - entity: big-bench-hard
        detail: 'big-bench-hard#movie-recommendation capability: deductive-reasoning, quantitative-reasoning,
          spatial-reasoning, temporal-reasoning'
        note: Movie Recommendation picks a film like those a user liked, which turns on knowing the
          films; nothing follows from premises, and no quantities, space or time are reasoned about.
      - entity: big-bench-hard
        detail: 'big-bench-hard#multistep-arithmetic-two capability: deductive-reasoning, spatial-reasoning,
          temporal-reasoning'
        note: Multi-Step Arithmetic evaluates one nested integer expression, which is calculation
          rather than a chain of entailments from premises, and it has no spatial or temporal
          content.
      - entity: big-bench-hard
        detail: 'big-bench-hard#navigate capability: deductive-reasoning, quantitative-reasoning, temporal-reasoning'
        note: Navigate tracks a position through stated moves to a yes/no answer, spatial state
          tracking rather than chained premises (as spatialviz-bench rules); the answer is not a
          number and time plays no part.
      - entity: big-bench-hard
        detail: 'big-bench-hard#object-counting capability: deductive-reasoning, spatial-reasoning, temporal-reasoning'
        note: Object Counting totals the items of a category, which needs knowing what counts as a
          fruit or an instrument, so it is not decidable from premises alone; no spatial or temporal
          relation is involved.
      - entity: big-bench-hard
        detail: 'big-bench-hard#ruin-names capability: deductive-reasoning, quantitative-reasoning, spatial-reasoning,
          temporal-reasoning'
        note: Ruin Names picks the humorous one-character edit of an artist or film name, which
          turns on knowing the name and the joke; no deduction, quantity, space or time is involved.
      - entity: big-bench-hard
        detail: 'big-bench-hard#sports-understanding capability: deductive-reasoning, quantitative-reasoning,
          spatial-reasoning, temporal-reasoning'
        note: Sports Understanding judges whether a sentence pairing an athlete with a sport's
          action is plausible, which is recalled knowledge; no premise entails it and no quantity,
          space or time is reasoned about.
      - entity: big-bench-hard
        detail: 'big-bench-hard#temporal-sequences capability: deductive-reasoning, quantitative-reasoning,
          spatial-reasoning'
        note: Temporal Sequences finds the unaccounted slot in a day's sightings, an interval
          comparison over stated times rather than chained entailments (as test-of-time rules);
          nothing is calculated or spatial.
      - entity: big-bench-hard
        detail: 'big-bench-hard#tracking-shuffled-objects capability: quantitative-reasoning, spatial-reasoning,
          temporal-reasoning'
        note: Tracking Shuffled Objects applies stated pairwise swaps to find who holds what; the
          positions are roles or holdings, not places, nothing is counted, and the swap order is
          state updating, not timing.
      - entity: big-bench-hard
        detail: 'big-bench-hard#web-of-lies capability: quantitative-reasoning, spatial-reasoning, temporal-reasoning'
        note: Web of Lies evaluates a chain of who-tells-the-truth statements, a Boolean function in
          words; it involves no quantities, space or time.
      - entity: biglaw-bench
        detail: 'biglaw-bench#research capability: context-integration, knowledge-recall'
        note: Research has the model find US case law with search tools, so the answer rests neither
          on documents the task supplies nor on closed-book recall; tool-use carries the retrieval.
      - entity: brats
        detail: 'brats#2026-goat capability: generation-fidelity'
        note: GoAT is tumour sub-region segmentation scored by Dice and NSD across tumour types;
          nothing is synthesised, so generation-fidelity, the inpainting task's term, does not
          apply.
      - entity: brats
        detail: 'brats#2026-inpainting capability: distribution-shift-generalization, perception'
        note: Inpainting scores synthesised T1 tissue against the real scan by SSIM, PSNR and RMSE,
          NTIRE-style fidelity rather than perception, and no source read scores the meningioma test
          set as a condition of its own.
      - entity: brats
        detail: 'brats#2026-path capability: distribution-shift-generalization, generation-fidelity'
        note: BraTS-Path classifies H&E tissue patches into histologic classes by F1 and MCC; it
          synthesises nothing, and no held-out site or population is scored as a condition of its
          own.
      - entity: dcase
        detail: 'dcase#2026-task1 capability: continual-learning, distribution-shift-generalization, grounding,
          temporal-reasoning'
        note: Task 1 classifies single Freesound clips into fixed taxonomy classes; there is no task
          sequence, text query or timing in the score, and the post-2025 upload cutoff is a date
          split, not a shift.
      - entity: dcase
        detail: 'dcase#2026-task2 capability: continual-learning, grounding, temporal-reasoning'
        note: Task 2 scores clip-level anomaly scores by AUC and pAUC per machine type and domain;
          it has no sequential tasks, no language to bind, and no onset, order or duration in the
          score.
      - entity: dcase
        detail: 'dcase#2026-task3 capability: continual-learning, distribution-shift-generalization, grounding,
          temporal-reasoning'
        note: Task 3 scores per-frame energy masks of fixed classes by Mask mAP and Pearson r on
          DCASE2024's two-site audio; no onset, offset or duration, text query, task sequence or
          held-out shift is scored.
      - entity: dcase
        detail: 'dcase#2026-task4 capability: continual-learning, distribution-shift-generalization, grounding,
          temporal-reasoning'
        note: Task 4 detects and separates the fixed-class target sounds in each mixture, scored by
          CAPI-SDRi; nothing is timed, no text is bound, no tasks arrive in sequence and no shifted
          condition is reported.
      - entity: dcase
        detail: 'dcase#2026-task5 capability: continual-learning, distribution-shift-generalization, grounding,
          temporal-reasoning'
        note: Task 5 is multiple-choice audio QA scored by top-1 accuracy; picking an option is not
          binding text to a referent, and no source read scores timing, a task sequence or a shifted
          condition.
      - entity: dcase
        detail: 'dcase#2026-task6 capability: continual-learning, distribution-shift-generalization'
        note: Task 6 retrieves the moment a text query names in one evaluation set collected the
          same way as its CASTELLA training data; no tasks arrive in sequence and no shifted
          condition is scored.
      - entity: dcase
        detail: 'dcase#2026-task7 capability: distribution-shift-generalization, grounding, temporal-reasoning'
        note: Task 7 trains on three domains in turn and averages accuracy over them, which is
          continual learning; every scored domain was trained on, and no text query or timing enters
          the score.
      - entity: digital-typhoon
        detail: 'digital-typhoon#ets-transition-forecasting capability: distribution-shift-generalization'
        note: Extra-tropical transition forecasting is V2's Western North Pacific-only task on a
          by-sequence split; no held-out basin or satellite generation is scored for it.
      - entity: digital-typhoon
        detail: 'digital-typhoon#intensity-forecasting capability: distribution-shift-generalization'
        note: Intensity forecasting trains and tests on Western North Pacific sequences split by
          sequence; the cross-basin and cross-generation shifts are scored only in the cross-basin
          and reanalysis subsets.
      - entity: guacamol
        detail: 'guacamol#distribution-learning capability: optimization'
        note: Distribution learning scores validity, uniqueness, novelty and closeness of sampled
          molecules to the training distribution; no objective is stated or maximised.
      - entity: hanabi
        detail: 'hanabi#self-play capability: distribution-shift-generalization'
        note: Self-play scores one learning process controlling every seat on freshly dealt games;
          no held-out partners or other shifted inputs are scored.
      - entity: helm-capabilities
        detail: 'helm-capabilities#gpqa capability: instruction-following, quantitative-reasoning'
        note: GPQA scores only the chosen option on graduate science questions that turn on domain
          knowledge; obedience to directions is not scored, and option selection over knowledge is
          not quantitative reasoning.
      - entity: helm-capabilities
        detail: 'helm-capabilities#ifeval capability: knowledge-recall, quantitative-reasoning'
        note: IFEval scores only whether verifiable instructions were obeyed; the content's facts
          are not checked, and length or count constraints are compliance checks, not a computed
          numeric answer.
      - entity: helm-capabilities
        detail: 'helm-capabilities#mmlu-pro capability: instruction-following, quantitative-reasoning'
        note: MMLU-Pro scores only the chosen option on closed-book subject questions; the format
          suffix is not scored apart from correctness, and option selection is the quantitative
          term's own near miss.
      - entity: helm-capabilities
        detail: 'helm-capabilities#omni-math capability: instruction-following, knowledge-recall'
        note: Omni-MATH judges whether an olympiad answer matches the reference; the problems are
          solved, not recalled (the omni-math entry rejects recall), and no directions beyond the
          answer are scored.
      - entity: helm-capabilities
        detail: 'helm-capabilities#wildbench capability: knowledge-recall, quantitative-reasoning'
        note: WildBench is one holistic 1-10 judge score of a reply to a real-user request;
          knowledge and arithmetic may be inputs on the way, but no recalled fact or computed number
          is what is scored.
      - entity: helm-safety
        detail: 'helm-safety#harmbench capability: adversarial-robustness'
        note: HELM sends HarmBench behaviours as direct requests with no attack and scores refusal;
          no one chose the inputs to defeat the evaluated model, so it is harm avoidance, not
          adversarial robustness.
      - entity: helm-safety
        detail: 'helm-safety#simple-safety-tests capability: adversarial-robustness'
        note: SimpleSafetyTests is 100 clearly harmful requests scored for refusal; the prompts are
          plain, not adversarially selected, so only harm avoidance applies.
      - entity: helm-safety
        detail: 'helm-safety#xstest capability: adversarial-robustness'
        note: XSTest pairs benign prompts that look unsafe with unsafe contrasts and scores
          calibrated refusal; it is a fixed diagnostic set, not attacker-chosen inputs, and
          over-refusal is not resistance to attack.
      - entity: isic-challenge
        detail: 'isic-challenge#dermoscopic-attributes capability: distribution-shift-generalization'
        note: Attribute detection is scored on one test set per edition with no held-out-site
          partition; the 2018 external partition applied only to the diagnosis task.
      - entity: isic-challenge
        detail: 'isic-challenge#lesion-segmentation capability: distribution-shift-generalization'
        note: Segmentation is scored on one test set per edition; the 2018 external partition from
          unseen institutions belonged to the diagnosis task only, not to segmentation.
      - entity: l2rpn
        detail: 'l2rpn#neurips-2020-adaptability capability: adversarial-robustness'
        note: The adaptability track runs the full grid with no opponent; its difficulty is unseen
          energy mixes, so no attacker chooses the inputs.
      - entity: l2rpn
        detail: 'l2rpn#neurips-2020-robustness capability: distribution-shift-generalization'
        note: The robustness track tests on the grid and energy mix it trains on, against an
          attacking opponent; no unseen energy mix or other natural input shift is scored.
      - entity: lifeclef
        detail: 'lifeclef#animalclef-2026 capability: context-integration, distribution-shift-generalization'
        note: AnimalCLEF clusters photographs into individual animals, scored by ARI; no supplied
          document determines the answer, and its unseen individuals change the label set rather
          than shift the inputs.
      - entity: lifeclef
        detail: 'lifeclef#birdclef-plus-2026 capability: context-integration'
        note: BirdCLEF+ identifies species in soundscape audio by ROC-AUC; the only material
          supplied is the signal itself, which is perception, so context-integration, PestCLEF's
          term, does not apply.
      - entity: lifeclef
        detail: 'lifeclef#fathomnetclef-2026 capability: context-integration, distribution-shift-generalization'
        note: FathomNetCLEF is object detection in underwater images by mAP; training and test
          differ in label completeness (positive-unlabeled), not input distribution, and no text is
          supplied.
      - entity: lifeclef
        detail: 'lifeclef#pestclef-2026 capability: distribution-shift-generalization, perception'
        note: PestCLEF extracts pest relations from supplied web documents scored by F-score; the
          input is text, not a raw signal, and no held-out shifted condition is scored.
      - entity: lifeclef
        detail: 'lifeclef#plantclef-2026 capability: context-integration'
        note: PlantCLEF identifies the plant species in vegetation-plot images; the answer is
          recovered from the image, not from supplied documents, so context-integration, PestCLEF's
          term, does not apply.
      - entity: livebench
        detail: 'livebench#agentic-coding capability: deductive-reasoning, instruction-following, quantitative-reasoning,
          spatial-reasoning'
        note: Agentic Coding resolves repository issues in an agent loop scored by the repository's
          tests; tool use fits, and no deduction, numeric answer, spatial relation or separate
          instruction compliance is scored.
      - entity: livebench
        detail: 'livebench#coding capability: deductive-reasoning, instruction-following, quantitative-reasoning,
          spatial-reasoning'
        note: Code generation and completion are scored pass@1 on tests, i.e. functional
          correctness; no premises are chained, no directions are scored apart from correctness, and
          no number or spatial relation is the answer.
      - entity: livebench
        detail: 'livebench#data-analysis capability: deductive-reasoning, instruction-following, quantitative-reasoning,
          spatial-reasoning'
        note: Table reformatting, join mapping and event detection are scored on the right output
          from a supplied table (context integration); no chained deduction, computed number,
          spatial relation or instruction check.
      - entity: livebench
        detail: 'livebench#instruction-following capability: deductive-reasoning, quantitative-reasoning,
          spatial-reasoning'
        note: The IF tasks score only adherence to verifiable instructions while rewriting a
          supplied article; no conclusion is deduced and no number or spatial relation is the
          answer.
      - entity: livebench
        detail: 'livebench#language capability: deductive-reasoning, instruction-following, quantitative-reasoning,
          spatial-reasoning'
        note: Connections, typo fixing and plot unscrambling are scored on recovering the right
          groups, text or order from supplied material; they need word knowledge, not entailment,
          and involve no numbers or space.
      - entity: livebench
        detail: 'livebench#mathematics capability: instruction-following, spatial-reasoning'
        note: Geometry is one of its subjects rather than a spatial task, and only final answers are
          scored, never compliance with a stated format; deductive-reasoning was restored for its
          contest problems.
      - entity: livebench
        detail: 'livebench#reasoning capability: instruction-following, quantitative-reasoning'
        note: Zebra, spatial, navigation and theory-of-mind items score answer correctness only
          (answer tags are for extraction), and answers come from deduction or spatial inference,
          not calculation.
      - entity: matharena
        detail: 'matharena#arxivlean capability: quantitative-reasoning'
        note: ArXivLean scores a formal proof accepted by the Lean checker; the output is a proof,
          not a number or expression, so quantitative reasoning does not apply.
      - entity: matharena
        detail: 'matharena#brokenarxiv capability: deductive-reasoning, quantitative-reasoning'
        note: BrokenArXiv passes a model that declines to prove a false statement, even with a bare
          'cannot provide a proof'; the judge checks that claim, not a derivation or a computed
          value, so honesty alone fits.
      - entity: matharena
        detail: 'matharena#proof-based capability: quantitative-reasoning'
        note: Proof-based contests score a whole natural-language proof against a grading scheme;
          the output is an argument, not a number or expression, so quantitative reasoning does not
          apply.
      - entity: meta-world
        detail: 'meta-world#ml1 capability: transfer-learning'
        note: ML1 tests on held-out goal positions of the one task it meta-trains on, which differ
          only by sampling; no new task, object or embodiment is scored.
      - entity: meta-world
        detail: 'meta-world#mt1 capability: transfer-learning'
        note: MT1 trains one policy on one task across 50 goals and scores it on those same goals,
          so no move to a different task is reported.
      - entity: meta-world
        detail: 'meta-world#mt10 capability: transfer-learning'
        note: MT10 trains one policy on ten tasks and scores it on the same tasks and goals, so no
          move to a different task is reported.
      - entity: meta-world
        detail: 'meta-world#mt25 capability: transfer-learning'
        note: MT25 trains one policy on 25 tasks and scores it on the same tasks and goals, so no
          move to a different task is reported.
      - entity: meta-world
        detail: 'meta-world#mt50 capability: transfer-learning'
        note: MT50 trains one policy on all 50 tasks and scores it on the same tasks and goals, so
          no move to a different task is reported.
      - entity: perception-test
        detail: 'perception-test#action-localisation capability: grounding, memory-retention'
        note: Action localisation labels temporal segments from a fixed set of 63 classes, COCO's
          near miss for grounding, and scores each segment where it occurs, with nothing carried
          across intervening footage.
      - entity: perception-test
        detail: 'perception-test#grounded-vqa capability: memory-retention, temporal-reasoning'
        note: Grounded QA scores the object tracks a question refers to by HOTA; the Memory
          skill-area and order diagnostics behind both terms are reported for multiple-choice QA,
          and no source claims them here.
      - entity: perception-test
        detail: 'perception-test#mc-vqa capability: grounding'
        note: Multiple-choice video QA scores the chosen text option by top-1 accuracy; nothing
          scores attaching the question's words to an object track, which is grounded video QA's
          case.
      - entity: perception-test
        detail: 'perception-test#object-tracking capability: grounding, memory-retention, temporal-reasoning'
        note: Object tracking follows a given box, scored by average IoU; there is no language to
          bind, no order or duration is scored, and no source claims retention for tracking through
          occlusion.
      - entity: perception-test
        detail: 'perception-test#point-tracking capability: grounding, memory-retention, temporal-reasoning'
        note: Point tracking follows given points, scored by average Jaccard over position and
          occlusion; there is no language to bind, no order or duration is scored, and no source
          claims retention.
      - entity: perception-test
        detail: 'perception-test#sound-localisation capability: grounding, memory-retention'
        note: Sound localisation labels temporal segments from a fixed list of 16 sound classes, not
          a linguistic expression, and scores each segment where it occurs, so neither grounding nor
          retention applies.
      - entity: physionet-challenge
        detail: 'physionet-challenge#2022-murmur capability: distribution-shift-generalization'
        note: The 2022 murmur task splits one dataset's patients 60/40 into public and hidden sets,
          stratified, so the test inputs come from the training distribution.
      - entity: physionet-challenge
        detail: 'physionet-challenge#2022-outcome capability: distribution-shift-generalization'
        note: The 2022 outcome task uses the same stratified patient-wise split of one dataset as
          the murmur task, so no deliberately shifted inputs are scored.
      - entity: planbench
        detail: 'planbench#plan-execution capability: planning'
        note: Plan execution asks for the state a given action sequence leads to; no plan is
          constructed or scored, only the predicted state.
      - entity: planbench
        detail: 'planbench#plan-verification capability: planning'
        note: Plan verification asks for a verdict on a given plan and why it fails; the system
          constructs no action sequence, so no plan of its own is scored.
      - entity: test-of-time
        detail: 'test-of-time#tot-arithmetic capability: context-integration'
        note: ToT-Arithmetic is self-contained word problems solved by calculation with calendar and
          time-zone rules the model holds; no supplied passage or data determines the answer.
      - entity: zerospeech
        detail: 'zerospeech#abx-15 capability: distribution-shift-generalization, generation-fidelity'
        note: ABX-15 measures the phonemic discriminability of frame embeddings with the training
          set as the test set; no shifted inputs are held out and nothing is generated.
      - entity: zerospeech
        detail: 'zerospeech#abx-17 capability: generation-fidelity'
        note: ABX-17 scores the discriminability of frame embeddings on new test speakers; no audio
          is synthesised, so generation-fidelity, TTS0-19's term, does not apply.
      - entity: zerospeech
        detail: 'zerospeech#abx-ls capability: generation-fidelity'
        note: ABX-LS scores the discriminability of frame embeddings on LibriSpeech dev and test; no
          audio is synthesised and compared, so generation-fidelity does not apply.
      - entity: zerospeech
        detail: 'zerospeech#prosaudit capability: distribution-shift-generalization, generation-fidelity'
        note: ProsAudit scores a model's preference between prosodically natural and unnatural audio
          pairs; nothing is generated, and no held-out shifted condition is reported.
      - entity: zerospeech
        detail: 'zerospeech#slm-21 capability: distribution-shift-generalization, generation-fidelity'
        note: sLM-21 scores pseudo-probabilities and embeddings, not generated audio; its OOV-sWUGGY
          words recombine known phonemes, which the vocabulary's distinction gives to
          compositional-generalization, not shift.
      - entity: zerospeech
        detail: 'zerospeech#tde-15 capability: distribution-shift-generalization, generation-fidelity'
        note: TDE-15 scores discovered word fragments against alignments on its own training data;
          no shifted condition is held out, and no output is generated and compared for fidelity.
      - entity: zerospeech
        detail: 'zerospeech#tde-17 capability: distribution-shift-generalization, generation-fidelity'
        note: TDE-17's test set is its training set (the review's Table IV), so no shifted inputs
          are held out, and term discovery generates nothing to compare for fidelity.
      - entity: zerospeech
        detail: 'zerospeech#tts0-19 capability: distribution-shift-generalization'
        note: TTS0-19 scores resynthesis by MOS and bitrate per language, each language with its own
          unlabelled training data; no score is reported on inputs the system was not fitted to.
  - rule: private-server-submission
    decision: accepted
    reason: "A private test set does not imply a submission server: each entry's submission_process was
      checked against its sources, and its results are produced by the maintainers (maintainer-run), by
      re-running entrants' code (sandboxed-rerun), by live votes (live-arena) or only in papers (literature-only);
      each line says how."
    decided_by: agent (P1-S13-T04)
    decided_on: 2026-11-17
    findings:
      - entity: agentharm
        detail: literature-only
        note: The maintainers score models on the unreleased behaviours and private split only in
          their release paper, keep no ranking and take no entries, and others report on the
          released subset in their own papers, so there is no server.
      - entity: apollo-research-scheming-suite
        detail: maintainer-run
        note: Apollo picks the models, runs its withheld environments itself (with developer
          checkpoints supplied at its request) and publishes the results; nobody submits anything,
          so no server-side term applies.
      - entity: biglaw-bench
        detail: maintainer-run
        note: Harvey picks and runs every system on its withheld tasks and publishes the scores in
          its own posts; the full data is shared only on contact and outsiders have no route to
          submit, so no server-side term applies.
      - entity: brain-score
        detail: maintainer-run, open-source-gated, sandboxed-rerun
        note: "The held benchmarks are reached by model code: each merged plugin is scored on the maintainers'
          servers, a code re-run rather than scored outputs or an entrant's container, so sandboxed-rerun
          is the server-side route."
      - entity: fair-universe-higgsml
        detail: sandboxed-rerun
        note: Entrants uploaded a zip with model.py that Codabench ran in the organisers' own Docker
          image on the private pseudo-experiments, code rather than outputs or an entrant-built
          container, so sandboxed-rerun is right.
      - entity: fiction-livebench
        detail: maintainer-run
        note: Fiction.live keeps the stories and questions private, picks the models, runs and
          scores them itself and adds them to its table; there is no submission route, so no
          server-side term applies.
      - entity: finance-agent-benchmark
        detail: maintainer-run
        note: Vals picks the models and runs them in its own harness on a test set that never leaves
          it, publishing every board score itself; nobody submits, so no server-side term applies.
      - entity: frontiermath
        detail: maintainer-run
        note: Epoch holds the unpublished problems, chooses the models, runs them in its own loop
          and publishes every score; outsiders cannot submit, matching the taxonomy's own
          FrontierMath examples for both terms.
      - entity: icecube-neutrinos-in-deep-ice
        detail: sandboxed-rerun
        note: Kaggle ran each entrant's committed notebook offline on the hidden scoring events and
          scored it, so entrants handed over code, not outputs or a container image, and
          sandboxed-rerun is the right route.
      - entity: l2rpn
        detail: sandboxed-rerun
        note: Entrants submitted agent code that the CodaLab server ran on scenarios that never left
          the organisers, so the server-side route is a code re-run, not scored outputs or a
          container image.
      - entity: livebench
        detail: maintainer-run
        note: The maintainers hold back each release's newest questions and run every model
          themselves, taking only evaluation requests by issue and model configs as pull requests,
          never outputs or numbers, so no server-side term applies.
      - entity: lmarena
        detail: live-arena
        note: Ratings come from continuous user-voted battles between provider models that Arena
          serves and fits on its own, only partly released vote record, so the route is live-arena
          and no server-side term applies.
      - entity: mask
        detail: maintainer-run
        note: Scale picks the models, runs them on its private 500-example split with the paper's
          judges and ranks them; no route takes outside models or outputs, so no server-side term
          applies.
      - entity: medhelm
        detail: maintainer-run
        note: The maintainers chose the models and ran them through HELM, the 14 private Stanford
          Health Care sets only on their own deployments; HELM took code, not results, so no
          server-side term applies.
      - entity: opendac
        detail: literature-only
        note: "No board or server exists: the withheld ODAC25 test set is scored only in the maintainers'
          release paper and others report on other splits in their own papers, though the access tag rests
          on one third-party sentence already logged as open."
      - entity: proofbench
        detail: maintainer-run
        note: Vals picks the systems and runs each itself on its private split, even the two outside
          provers whose makers only supplied access and settings; nobody submits outputs or code, so
          no server-side term applies.
      - entity: remote-labor-index
        detail: maintainer-run
        note: The maintainers choose and run the agents and Scale Labs' evaluators score the private
          230 projects; a developer can only ask to be evaluated, not submit outputs, so no
          server-side term applies.
      - entity: rexrank
        detail: maintainer-run, sandboxed-rerun
        note: Entrants e-mail an inference script and conda environment that the maintainers run on
          the private ReXGradient set, the taxonomy's own sandboxed-rerun example, beside founding
          models the maintainers ran themselves.
      - entity: simulacrabench
        detail: publication-gated, sandboxed-rerun
        note: Entrants submit a zip with main.py and requirements that the organisers build and run
          offline on the never-released microdata, so the server-side route is a code re-run, not
          scored outputs or an entrant's container.
      - entity: smart-buildings-challenge
        detail: sandboxed-rerun
        note: Kaggle re-runs each entrant's notebook against the organisers' hidden scenarios with
          internet off, so entrants hand over code rather than outputs or a container image and
          sandboxed-rerun is the right route.
      - entity: squad
        detail: maintainer-run, sandboxed-rerun
        note: Entrants submit a CodaLab bundle that the SQuAD team runs on the hidden test set,
          beside its own baselines; that is code like rexrank's script, so sandboxed-rerun fits,
          with the container reading left to the open review check.
      - entity: vending-bench-2
        detail: maintainer-run
        note: Andon Labs holds the simulation, chooses the models, runs each five times through
          provider APIs and publishes the mean; no route takes outside submissions, so no
          server-side term applies.
      - entity: videogamebench
        detail: maintainer-run, sandboxed-rerun
        note: The maintainers ran the leaderboard models and say they run the three secret games on
          their side for new submissions, which means running an entrant's agent, not scoring
          outputs, so no server-side term applies.

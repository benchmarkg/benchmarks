# data/_analysis/dedup-verdicts.yaml -- the whole-corpus near-duplicate sweep, adjudicated (P1-S13-T05; 11 S F7, 05 S3)
#
# One row per candidate pair `bench resolve --candidates --threshold 0.88` proposed over the curated corpus on
# 2026-11-17 (41 pairs), plus one pair the sweep resolved into lineage, which the generator no longer proposes.
# Each carries a verdict -- same, variant-of or distinct -- a one-sentence reason, who decided and when. 05 S3:
# identity resolution never merges. A `variant-of` is expressed as a lineage edge between the two entries
# (`expressed_as` names it), so the pair is not proposed again; a `same` would retire one id with a tombstone in
# data/tombstones/. None is `same`, so no tombstone is written.
#
# scripts/check_dedup_resolved.py asserts every pair the generator proposes has a row here, that each
# variant-of has its lineage edge and each same its tombstone. A new entry that the generator pairs with an
# existing one needs a row before it passes.
#
# Status: agent-drafted (P1-S13-T05's executor is agent-draft). A person accepts or amends each verdict.


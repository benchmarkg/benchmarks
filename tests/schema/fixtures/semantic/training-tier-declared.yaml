# 02 S12: a claim's declared tier is one its benchmark publishes (Matbench Discovery's compliant /
# non-compliant). eligibility_track alone is not checked here: it names a board, not a data rule.
pass:
  - benchmarks: [{training_data_eligibility_tiers: [{id: compliant, label: Compliant, rule: Trained only on MPtrj., source: src-x}]}]
    conditions: [{id: cond-00000000000a, training_data_eligibility: compliant}]
    claims: [{eval_conditions: cond-00000000000a}]
  - benchmarks: [{}]
    conditions: [{id: cond-00000000000a, eligibility_track: community}]
    claims: [{eval_conditions: cond-00000000000a}]
  - benchmarks: [{}]
    claims: [{}]
fail:
  - benchmarks: [{training_data_eligibility_tiers: [{id: compliant, label: Compliant, rule: Trained only on MPtrj., source: src-x}]}]
    conditions: [{id: cond-00000000000a, training_data_eligibility: non-compliant}]
    claims: [{eval_conditions: cond-00000000000a}]
  - benchmarks: [{}]
    conditions: [{id: cond-00000000000a, training_data_eligibility: compliant}]
    claims: [{eval_conditions: cond-00000000000a}]

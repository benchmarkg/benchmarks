# 04 S12 tier 3 as 06 S7.1 softens it (schema/archive_sla.py). `now` pins the SLA clock.
pass:
  - sources: [{id: src-a, doi: 10.1234/abcd}]
  - sources: [{id: src-a, url: "https://example.org/", archive_status: ok, archive_url: "https://web.archive.org/web/2026/https://example.org/"}]
  - now: "2026-10-03T00:00:00Z"
    sources: [{id: src-a, url: "https://example.org/", archive_status: pending, archive_requested_at: "2026-09-27T00:00:00Z"}]
  - sources: [{id: src-a, url: "https://example.org/", archive_status: failed, failure_reason: "Save Page Now error:blocked-url"}]
  - sources: [{id: src-a, url: "https://example.org/", archive_status: not-required, quote_extract: null}]
  - now: "2026-10-03T00:00:00Z"
    sources: [{id: src-a, url: "https://example.org/", archive_status: pending, fetched_at: "2026-09-30T00:00:00Z"}]
fail:
  - sources: [{id: src-a, url: "https://example.org/"}]
  - sources: [{id: src-a, doi: null, archive_url: null}]
  - now: "2026-10-03T00:00:00Z"
    sources: [{id: src-a, url: "https://example.org/", archive_status: pending, archive_requested_at: "2026-09-23T00:00:00Z"}]
  - sources: [{id: src-a, url: "https://example.org/", archive_status: failed}]
  - sources: [{id: src-a, url: "https://example.org/", archive_status: not-required, quote_extract: "a quoted extract"}]
  - sources: [{id: src-a, url: "https://example.org/", archive_status: withheld, failure_reason: "personal data"}]
  - sources: [{id: src-a, url: "https://example.org/", archive_status: pending, archive_url: "https://web.archive.org/web/2026/https://example.org/"}]
